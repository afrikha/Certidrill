chapter: 32-defender-for-cloud
questions:
  # ------------------------------------------------------------------ 1
  - id: sc900-qz-32-01
    objective: "3.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso hosts its web apps on Azure App Service, and the web apps call business-critical APIs. The security team wants Microsoft Defender for Cloud to raise alerts when attacks target the web apps themselves.

        Which Defender plan should Contoso enable?
      fr: |
        Contoso héberge ses applications web sur Azure App Service, et ces applications appellent des API critiques pour l'activité. L'équipe de sécurité veut que Microsoft Defender pour le cloud émette des alertes quand des attaques visent les applications web elles-mêmes.

        Quel plan Defender Contoso doit-elle activer ?
    body:
      options:
        - { id: a, text: Defender for APIs }
        - { id: b, text: Defender for Servers }
        - { id: c, text: Defender for App Service }
        - { id: d, text: Defender for Resource Manager }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Defender for App Service identifies attacks that target the applications running on App Service. Like every Defender plan, it is enabled for one type of resource and raises security alerts when it detects a threat.
        fr: |
          Defender for App Service identifie les attaques qui visent les applications exécutées sur App Service. Comme chaque plan Defender, il s'active pour un type de ressource et émet des alertes de sécurité quand il détecte une menace.
      options:
        a: { en: "Defender for APIs protects the business-critical APIs themselves; the alerts requested concern the web apps.", fr: "Defender for APIs protège les API critiques elles-mêmes ; les alertes demandées concernent les applications web." }
        b: { en: "Defender for Servers protects Windows and Linux machines; apps on App Service don't run on machines that Contoso manages.", fr: "Defender for Servers protège des machines Windows et Linux ; les applications sur App Service ne s'exécutent pas sur des machines gérées par Contoso." }
        d: { en: "Defender for Resource Manager monitors the resource management operations of the organization, not attacks on running applications.", fr: "Defender for Resource Manager surveille les opérations de gestion des ressources de l'organisation, pas les attaques contre des applications en exécution." }
    references:
      - title: What is Microsoft Defender for Cloud?
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
      - title: Describe the enhanced security of Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/5a-describe-enhanced-security-defender-cloud

  # ------------------------------------------------------------------ 2
  - id: sc900-qz-32-02
    objective: "3.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam uses Microsoft Defender for Cloud. Its posture team wants Defender for Cloud to find software vulnerabilities and exposed secrets on the virtual machines, without installing an agent on them.

        Which plan provides this capability?
      fr: |
        Fabrikam utilise Microsoft Defender pour le cloud. Son équipe chargée de la posture veut que Defender pour le cloud trouve les vulnérabilités logicielles et les secrets exposés sur les machines virtuelles, sans y installer d'agent.

        Quel plan fournit cette fonctionnalité ?
    body:
      options:
        - { id: a, text: { en: "Foundational CSPM", fr: "CSPM de base (Foundational CSPM)" } }
        - { id: b, text: Defender CSPM }
        - { id: c, text: Defender for Storage }
        - { id: d, text: Defender for Resource Manager }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Agentless scanning of virtual machines, for vulnerabilities and for secrets, is one of the advanced posture capabilities of the paid Defender CSPM plan, together with attack path analysis, the cloud security explorer and governance.
        fr: |
          L'analyse sans agent des machines virtuelles, pour les vulnérabilités et pour les secrets, fait partie des fonctionnalités de posture avancées du plan payant Defender CSPM, avec l'analyse du chemin d'attaque, l'explorateur de sécurité du cloud et la gouvernance.
      options:
        a: { en: "The free Foundational CSPM plan provides asset inventory, recommendations and the secure score, but no agentless scanning of virtual machines.", fr: "Le plan gratuit CSPM de base fournit l'inventaire des ressources, les recommandations et le score de sécurité, mais pas l'analyse sans agent des machines virtuelles." }
        c: { en: "Defender for Storage detects potentially harmful activity on storage accounts; it doesn't scan virtual machines.", fr: "Defender for Storage détecte les activités potentiellement dangereuses sur les comptes de stockage ; il n'analyse pas les machines virtuelles." }
        d: { en: "Defender for Resource Manager monitors resource management operations; it doesn't look inside virtual machines.", fr: "Defender for Resource Manager surveille les opérations de gestion des ressources ; il ne regarde pas à l'intérieur des machines virtuelles." }
    references:
      - title: What is Cloud Security Posture Management (CSPM)
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management

  # ------------------------------------------------------------------ 3
  - id: sc900-qz-32-03
    objective: "3.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has onboarded its Azure subscriptions to Microsoft Defender for Cloud and uses only the free Foundational CSPM plan. Its compliance team must show, in the regulatory compliance dashboard, how the resources stand against PCI DSS, control by control.

        What should Woodgrove Bank do first?
      fr: |
        Woodgrove Bank a intégré ses abonnements Azure à Microsoft Defender pour le cloud et n'utilise que le plan gratuit CSPM de base (Foundational CSPM). Son équipe de conformité doit montrer, dans le tableau de bord de conformité réglementaire, où en sont les ressources par rapport à PCI DSS, contrôle par contrôle.

        Que doit faire Woodgrove Bank en premier ?
    body:
      options:
        - { id: a, text: { en: "Wait for PCI DSS to be assigned automatically with the Microsoft cloud security benchmark", fr: "Attendre que PCI DSS soit attribuée automatiquement avec le benchmark de sécurité cloud Microsoft" } }
        - { id: b, text: { en: "Remediate every recommendation of the Microsoft cloud security benchmark", fr: "Corriger chaque recommandation du benchmark de sécurité cloud Microsoft" } }
        - { id: c, text: { en: "Assign owners and due dates to the recommendations of the subscriptions", fr: "Attribuer des propriétaires et des échéances aux recommandations des abonnements" } }
        - { id: d, text: { en: "Enable the Defender CSPM plan and add the PCI DSS standard", fr: "Activer le plan Defender CSPM et ajouter la norme PCI DSS" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Foundational CSPM assesses resources against the Microsoft cloud security benchmark (MCSB) and computes the secure score. Regulatory compliance assessments against other standards, such as PCI DSS, require a paid plan: here, the Defender CSPM plan. Once the standard is added, the regulatory compliance dashboard shows each of its controls with the resources that pass or fail it.
        fr: |
          Le CSPM de base évalue les ressources par rapport au benchmark de sécurité cloud Microsoft (MCSB) et calcule le score de sécurité. Les évaluations de conformité réglementaire par rapport à d'autres normes, comme PCI DSS, demandent un plan payant : ici, le plan Defender CSPM. Une fois la norme ajoutée, le tableau de bord de conformité réglementaire montre chacun de ses contrôles avec les ressources qui le réussissent ou y échouent.
      options:
        a: { en: "Only the MCSB is applied by default; other regulatory standards are added next to it and are never assigned automatically.", fr: "Seul le MCSB est appliqué par défaut ; les autres normes réglementaires s'ajoutent à côté de lui et ne sont jamais attribuées automatiquement." }
        b: { en: "Remediating MCSB recommendations improves the posture and may help with PCI DSS, but it doesn't make the PCI DSS standard appear in the dashboard.", fr: "Corriger les recommandations du MCSB améliore la posture et peut aider pour PCI DSS, mais cela ne fait pas apparaître la norme PCI DSS dans le tableau de bord." }
        c: { en: "Governance assigns owners and due dates; it is itself a Defender CSPM feature and doesn't add a regulatory standard.", fr: "La gouvernance attribue des propriétaires et des échéances ; c'est elle-même une fonctionnalité de Defender CSPM et elle n'ajoute aucune norme réglementaire." }
    references:
      - title: What is Cloud Security Posture Management (CSPM)
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
      - title: Describe how security policies, standards, and recommendations improve cloud security posture
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/3-baselines-for-azure

  # ------------------------------------------------------------------ 4
  - id: sc900-qz-32-04
    objective: "3.2.4"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Litware is deciding how to spend its Microsoft Defender for Cloud budget: on the Defender CSPM plan, on Defender plans for its workloads, or on both. The team first sorts the capabilities it wants.

        Which two capabilities are provided by cloud workload protection rather than by cloud security posture management?

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware décide comment dépenser son budget Microsoft Defender pour le cloud : pour le plan Defender CSPM, pour des plans Defender pour ses charges de travail, ou pour les deux. L'équipe commence par classer les fonctionnalités qu'elle veut.

        Quelles deux fonctionnalités sont fournies par la protection des charges de travail cloud plutôt que par la gestion de la posture de sécurité cloud ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Just-in-time access to the management ports of virtual machines", fr: "L'accès juste-à-temps aux ports de gestion des machines virtuelles" } }
        - { id: b, text: { en: "Attack path analysis toward resources that hold sensitive data", fr: "L'analyse du chemin d'attaque vers les ressources qui contiennent des données sensibles" } }
        - { id: c, text: { en: "Threat protection alerts when an attack on a machine is detected", fr: "Les alertes de protection contre les menaces quand une attaque contre une machine est détectée" } }
        - { id: d, text: { en: "Governance that assigns recommendations to owners with due dates", fr: "La gouvernance qui attribue les recommandations à des propriétaires avec des échéances" } }
        - { id: e, text: { en: "A secure score aggregated across the Azure and AWS resources", fr: "Un score de sécurité agrégé sur les ressources Azure et AWS" } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Cloud workload protection detects and helps resolve threats through the Defender plans: threat protection alerts on attacks against machines, networks and cloud services, and access controls such as just-in-time access to management ports, which reduces exposure to brute-force attacks. Posture management assesses configuration and recommends fixes; it doesn't watch for attacks in progress.
        fr: |
          La protection des charges de travail cloud détecte les menaces et aide à les résoudre par les plans Defender : alertes de protection contre les menaces sur les attaques visant les machines, les réseaux et les services cloud, et contrôles d'accès comme l'accès juste-à-temps aux ports de gestion, qui réduit l'exposition aux attaques par force brute. La gestion de la posture évalue la configuration et recommande des corrections ; elle ne surveille pas les attaques en cours.
      options:
        b: { en: "Attack path analysis is a posture capability of Defender CSPM: it models how weaknesses could be chained, before any attack.", fr: "L'analyse du chemin d'attaque est une fonctionnalité de posture de Defender CSPM : elle modélise comment des faiblesses pourraient être enchaînées, avant toute attaque." }
        d: { en: "Governance is a Defender CSPM capability that drives the remediation of recommendations, which is posture work.", fr: "La gouvernance est une fonctionnalité de Defender CSPM qui pilote la correction des recommandations, ce qui relève de la posture." }
        e: { en: "The secure score is the central indicator of posture management, available even in the free Foundational CSPM plan.", fr: "Le score de sécurité est l'indicateur central de la gestion de la posture, disponible même dans le plan gratuit CSPM de base." }
    references:
      - title: Describe the enhanced security of Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/5a-describe-enhanced-security-defender-cloud
      - title: What is Cloud Security Posture Management (CSPM)
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management

  # ------------------------------------------------------------------ 5
  - id: sc900-qz-32-05
    objective: "3.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A developer of Proseware commits the access key of a storage account into a GitHub repository. Proseware wants Microsoft Defender for Cloud to surface this exposed secret while it is still in the repository, before the application is deployed.

        Which capability of Defender for Cloud addresses this need?
      fr: |
        Un développeur de Proseware valide la clé d'accès d'un compte de stockage dans un dépôt GitHub. Proseware veut que Microsoft Defender pour le cloud fasse ressortir ce secret exposé tant qu'il est encore dans le dépôt, avant le déploiement de l'application.

        Quelle fonctionnalité de Defender pour le cloud répond à ce besoin ?
    body:
      options:
        - { id: a, text: { en: "Cloud security posture management (CSPM)", fr: "La gestion de la posture de sécurité cloud (CSPM)" } }
        - { id: b, text: { en: "Cloud workload protection platform (CWPP)", fr: "La plateforme de protection des charges de travail cloud (CWPP)" } }
        - { id: c, text: { en: "AI security posture management", fr: "La gestion de la posture de sécurité de l'IA" } }
        - { id: d, text: { en: "DevSecOps (DevOps security)", fr: "DevSecOps (sécurité DevOps)" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The DevSecOps pillar unifies security management at the code level across pipelines such as GitHub and Azure DevOps: security teams review the findings of code, secrets and dependency scans in one console. It moves security checks earlier in development, before the code becomes a running workload.
        fr: |
          Le pilier DevSecOps unifie la gestion de la sécurité au niveau du code dans des pipelines comme GitHub et Azure DevOps : les équipes de sécurité consultent les résultats des analyses de code, de secrets et de dépendances dans une même console. Il avance les contrôles de sécurité dans le développement, avant que le code ne devienne une charge de travail en exécution.
      options:
        a: { en: "CSPM assesses how deployed cloud resources are configured; its agentless secret scanning looks at virtual machines, not at code repositories.", fr: "La CSPM évalue la configuration des ressources cloud déployées ; son analyse sans agent des secrets porte sur les machines virtuelles, pas sur les dépôts de code." }
        b: { en: "CWPP protects running workloads such as servers, containers and databases, and raises alerts on attacks; the code isn't deployed yet.", fr: "La CWPP protège les charges de travail en exécution comme les serveurs, les conteneurs et les bases de données, et émet des alertes sur les attaques ; le code n'est pas encore déployé." }
        c: { en: "AI security posture management keeps an inventory of generative AI models, applications and services; it doesn't scan repositories for secrets.", fr: "La gestion de la posture de sécurité de l'IA tient un inventaire des modèles, applications et services d'IA générative ; elle n'analyse pas les dépôts à la recherche de secrets." }
    references:
      - title: Describe Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/2-describe-defender-cloud

  # ------------------------------------------------------------------ 6
  - id: sc900-qz-32-06
    objective: "3.2.4"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Tailspin Toys uses Microsoft Defender for Cloud for its Azure subscriptions and for an AWS account connected to it. The security team lists four threat detection needs and wants each one met by the plan designed for it.

        Which plan should Tailspin Toys enable for each need? To answer, drag the appropriate plan to each need. Each plan may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys utilise Microsoft Defender pour le cloud pour ses abonnements Azure et pour un compte AWS qui lui est connecté. L'équipe de sécurité liste quatre besoins de détection des menaces et veut que chacun soit satisfait par le plan conçu pour lui.

        Quel plan Tailspin Toys doit-elle activer pour chaque besoin ? Pour répondre, faites glisser le plan approprié vers chaque besoin. Chaque plan peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: ai, text: Defender for AI Services }
        - { id: api, text: Defender for APIs }
        - { id: srv, text: Defender for Servers }
        - { id: cont, text: Defender for Containers }
        - { id: app, text: Defender for App Service }
        - { id: cspm, text: Defender CSPM }
      targets:
        - { id: t1, text: { en: "Detect, in real time, attempts to manipulate a generative AI chatbot by inserting instructions into its prompts.", fr: "Détecter, en temps réel, les tentatives de manipulation d'un chatbot d'IA générative par l'insertion d'instructions dans ses invites." } }
        - { id: t2, text: { en: "Detect active threats against the APIs that partner applications call to place orders.", fr: "Détecter les menaces actives contre les API que les applications des partenaires appellent pour passer commande." } }
        - { id: t3, text: { en: "Get endpoint detection and response on the Linux instances that run in the AWS account.", fr: "Obtenir la détection et la réponse des points de terminaison sur les instances Linux qui s'exécutent dans le compte AWS." } }
        - { id: t4, text: { en: "Detect threats at run time in the workloads of a Kubernetes cluster.", fr: "Détecter les menaces à l'exécution dans les charges de travail d'un cluster Kubernetes." } }
    answer: { mapping: { t1: ai, t2: api, t3: srv, t4: cont } }
    explanation:
      correct:
        en: |
          Defender for AI Services detects threats to generative AI workloads, such as prompt injection. Defender for APIs detects real-time threats against business-critical APIs. Defender for Servers protects Windows and Linux machines in Azure, AWS, GCP and on-premises, and includes Microsoft Defender for Endpoint for EDR. Defender for Containers provides run-time threat detection for Kubernetes environments.
        fr: |
          Defender for AI Services détecte les menaces qui visent les charges de travail d'IA générative, comme l'injection d'invites. Defender for APIs détecte en temps réel les menaces contre les API critiques pour l'activité. Defender for Servers protège les machines Windows et Linux dans Azure, AWS, GCP et en local, et inclut Microsoft Defender pour point de terminaison pour l'EDR. Defender for Containers fournit la détection des menaces à l'exécution pour les environnements Kubernetes.
      options:
        cspm: { en: "Defender CSPM manages posture, including AI and API security posture; it doesn't raise alerts on attacks in progress, which every need here asks for.", fr: "Defender CSPM gère la posture, y compris celle de l'IA et des API ; il n'émet pas d'alertes sur les attaques en cours, ce que chaque besoin demande ici." }
        app: { en: "Defender for App Service protects applications that run on App Service; none of the needs concerns an App Service application.", fr: "Defender for App Service protège les applications exécutées sur App Service ; aucun des besoins ne concerne une application App Service." }
    references:
      - title: What is Microsoft Defender for Cloud?
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction
      - title: Describe the enhanced security of Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/5a-describe-enhanced-security-defender-cloud

  # ------------------------------------------------------------------ 7
  - id: sc900-qz-32-07
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam has onboarded its Azure subscriptions and an AWS account to Microsoft Defender for Cloud. Only the free Foundational CSPM plan is enabled. Fabrikam has three new needs and wants to meet each one at the lowest cost.

        To complete the sentences, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam a intégré ses abonnements Azure et un compte AWS à Microsoft Defender pour le cloud. Seul le plan gratuit CSPM de base (Foundational CSPM) est activé. Fabrikam a trois nouveaux besoins et veut satisfaire chacun au moindre coût.

        Pour compléter les phrases, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          To assign each high-severity recommendation to a resource owner with a remediation due date, Fabrikam must [[gov]].

          To be alerted of potentially harmful activity on its Azure storage accounts, Fabrikam must [[sto]].

          To get the secure score and the Microsoft cloud security benchmark recommendations for its AWS resources, Fabrikam must [[aws]].
        fr: |
          Pour attribuer chaque recommandation de gravité élevée à un propriétaire de ressource avec une échéance de correction, Fabrikam doit [[gov]].

          Pour être alertée des activités potentiellement dangereuses sur ses comptes de stockage Azure, Fabrikam doit [[sto]].

          Pour obtenir le score de sécurité et les recommandations du benchmark de sécurité cloud Microsoft pour ses ressources AWS, Fabrikam doit [[aws]].
      slots:
        - id: gov
          options:
            - { id: none1, text: { en: "enable nothing more", fr: "n'activer rien de plus" } }
            - { id: dcspm1, text: { en: "enable the Defender CSPM plan", fr: "activer le plan Defender CSPM" } }
            - { id: sto1, text: { en: "enable the Defender for Storage plan", fr: "activer le plan Defender for Storage" } }
            - { id: srv1, text: { en: "enable the Defender for Servers plan", fr: "activer le plan Defender for Servers" } }
        - id: sto
          options:
            - { id: none2, text: { en: "enable nothing more", fr: "n'activer rien de plus" } }
            - { id: dcspm2, text: { en: "enable the Defender CSPM plan", fr: "activer le plan Defender CSPM" } }
            - { id: sto2, text: { en: "enable the Defender for Storage plan", fr: "activer le plan Defender for Storage" } }
            - { id: srv2, text: { en: "enable the Defender for Servers plan", fr: "activer le plan Defender for Servers" } }
        - id: aws
          options:
            - { id: none3, text: { en: "enable nothing more", fr: "n'activer rien de plus" } }
            - { id: dcspm3, text: { en: "enable the Defender CSPM plan", fr: "activer le plan Defender CSPM" } }
            - { id: sto3, text: { en: "enable the Defender for Storage plan", fr: "activer le plan Defender for Storage" } }
            - { id: srv3, text: { en: "enable the Defender for Servers plan", fr: "activer le plan Defender for Servers" } }
    answer: { values: { gov: dcspm1, sto: sto2, aws: none3 } }
    explanation:
      correct:
        en: |
          Governance, which assigns recommendations to owners with due dates, is a Defender CSPM capability. Alerts on potentially harmful activity on storage accounts are workload protection, delivered by the Defender for Storage plan; a posture plan raises no such alerts. Foundational CSPM is multicloud and free: it already gives AWS accounts the MCSB recommendations and the secure score.
        fr: |
          La gouvernance, qui attribue les recommandations à des propriétaires avec des échéances, est une fonctionnalité de Defender CSPM. Les alertes sur les activités potentiellement dangereuses des comptes de stockage relèvent de la protection des charges de travail, fournie par le plan Defender for Storage ; un plan de posture n'émet pas de telles alertes. Le CSPM de base est multicloud et gratuit : il donne déjà aux comptes AWS les recommandations du MCSB et le score de sécurité.
      options:
        none1: { en: "Governance isn't part of the free Foundational CSPM plan.", fr: "La gouvernance ne fait pas partie du plan gratuit CSPM de base." }
        dcspm2: { en: "Defender CSPM improves posture but doesn't detect attacks on storage accounts; that needs a workload protection plan.", fr: "Defender CSPM améliore la posture mais ne détecte pas les attaques contre les comptes de stockage ; il faut pour cela un plan de protection des charges de travail." }
        dcspm3: { en: "Paying for Defender CSPM isn't needed: the secure score and the MCSB recommendations are included in Foundational CSPM for AWS too.", fr: "Payer Defender CSPM n'est pas nécessaire : le score de sécurité et les recommandations du MCSB sont inclus dans le CSPM de base, pour AWS aussi." }
        srv3: { en: "Defender for Servers adds threat protection for machines; it isn't needed to get recommendations and a secure score.", fr: "Defender for Servers ajoute la protection contre les menaces pour les machines ; il n'est pas nécessaire pour obtenir des recommandations et un score de sécurité." }
    references:
      - title: What is Cloud Security Posture Management (CSPM)
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
      - title: Describe Cloud security posture management
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/4-describe-cloud-security-posture-management

  # ------------------------------------------------------------------ 8
  - id: sc900-qz-32-08
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders assesses its Azure resources in Microsoft Defender for Cloud against the Microsoft cloud security benchmark (MCSB), the ISO 27001 standard and a custom standard that contains the company's own recommendations. The security team wants to raise the secure score.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders évalue ses ressources Azure dans Microsoft Defender pour le cloud par rapport au benchmark de sécurité cloud Microsoft (MCSB), à la norme ISO 27001 et à une norme personnalisée qui contient les recommandations propres à l'entreprise. L'équipe de sécurité veut faire monter le score de sécurité.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "A recommendation flagged as preview doesn't count toward the secure score while it is in preview.", fr: "Une recommandation signalée en préversion ne compte pas dans le score de sécurité tant qu'elle est en préversion." } }
        - { id: s2, text: { en: "Remediating the recommendations of the custom standard raises the secure score.", fr: "Corriger les recommandations de la norme personnalisée fait monter le score de sécurité." } }
        - { id: s3, text: { en: "Remediating one built-in MCSB recommendation can raise the secure score and improve the ISO 27001 compliance status at the same time.", fr: "Corriger une recommandation intégrée du MCSB peut faire monter le score de sécurité et améliorer en même temps l'état de conformité à ISO 27001." } }
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          Only the built-in recommendations of the MCSB affect the secure score, and recommendations in preview aren't included until they become generally available. Recommendations of a custom standard help the company check its own rules but don't change the score. Because one recommendation can support controls of several standards, a single remediation can raise the score and improve the status of a regulatory standard at the same time.
        fr: |
          Seules les recommandations intégrées du MCSB agissent sur le score de sécurité, et les recommandations en préversion n'y sont pas incluses avant d'être en disponibilité générale. Les recommandations d'une norme personnalisée aident l'entreprise à vérifier ses propres règles mais ne changent pas le score. Comme une même recommandation peut servir des contrôles de plusieurs normes, une seule correction peut faire monter le score et améliorer en même temps l'état d'une norme réglementaire.
      options:
        s2: { en: "The secure score counts only the built-in MCSB recommendations; custom recommendations are assessed but don't move the score.", fr: "Le score de sécurité ne compte que les recommandations intégrées du MCSB ; les recommandations personnalisées sont évaluées mais ne font pas bouger le score." }
    references:
      - title: Secure score in Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls
      - title: Describe how security policies, standards, and recommendations improve cloud security posture
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/3-baselines-for-azure

  # ------------------------------------------------------------------ 9
  - id: sc900-qz-32-09
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware runs workloads in Azure, in AWS and on servers in its own datacenter. Its security operations team already investigates the incidents of Microsoft Defender for Endpoint and Microsoft Defender for Identity in one place. Litware needs hardening recommendations for the resources of the three environments, alerts when one of these workloads is attacked, and these alerts correlated into the same incidents as the other Defender alerts.

        Which solution should Litware use?
      fr: |
        Litware exécute des charges de travail dans Azure, dans AWS et sur des serveurs de son propre centre de données. Son équipe des opérations de sécurité examine déjà les incidents de Microsoft Defender pour point de terminaison et de Microsoft Defender pour Identity au même endroit. Litware a besoin de recommandations de renforcement pour les ressources des trois environnements, d'alertes quand l'une de ces charges de travail est attaquée, et de la corrélation de ces alertes dans les mêmes incidents que les autres alertes Defender.

        Quelle solution Litware doit-elle utiliser ?
    body:
      options:
        - { id: a, text: { en: "Defender for Cloud with only Foundational CSPM, its findings reviewed in the Microsoft Defender portal", fr: "Defender pour le cloud avec le seul CSPM de base, ses résultats consultés dans le portail Microsoft Defender" } }
        - { id: b, text: { en: "Defender for Cloud with the Defender plans enabled, its alerts reviewed in the Microsoft Defender portal", fr: "Defender pour le cloud avec les plans Defender activés, ses alertes consultées dans le portail Microsoft Defender" } }
        - { id: c, text: { en: "Defender for Cloud with the Defender plans enabled, its alerts reviewed in the Microsoft Purview portal", fr: "Defender pour le cloud avec les plans Defender activés, ses alertes consultées dans le portail Microsoft Purview" } }
        - { id: d, text: { en: "Microsoft Defender for Cloud Apps with its app connectors, its alerts reviewed in the Microsoft Defender portal", fr: "Microsoft Defender pour les applications cloud avec ses connecteurs d'applications, ses alertes consultées dans le portail Microsoft Defender" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Defender for Cloud covers Azure, AWS, GCP and on-premises machines: posture management provides the hardening recommendations, and the Defender plans add the threat detection that raises alerts. Defender for Cloud is integrated into the Microsoft Defender portal, where its alerts join the incidents of Microsoft Defender XDR with those of Defender for Endpoint and Defender for Identity.
        fr: |
          Defender pour le cloud couvre Azure, AWS, GCP et les machines locales : la gestion de la posture fournit les recommandations de renforcement, et les plans Defender ajoutent la détection des menaces qui émet des alertes. Defender pour le cloud est intégré au portail Microsoft Defender, où ses alertes rejoignent les incidents de Microsoft Defender XDR avec celles de Defender pour point de terminaison et de Defender pour Identity.
      options:
        a: { en: "Foundational CSPM gives recommendations and a secure score, but no threat detection: without Defender plans, there are no alerts to correlate.", fr: "Le CSPM de base donne des recommandations et un score de sécurité, mais aucune détection des menaces : sans plans Defender, il n'y a pas d'alertes à corréler." }
        c: { en: "The Microsoft Purview portal hosts compliance and data solutions; the incidents of the Defender services are handled in the Microsoft Defender portal.", fr: "Le portail Microsoft Purview héberge les solutions de conformité et de données ; les incidents des services Defender se traitent dans le portail Microsoft Defender." }
        d: { en: "Defender for Cloud Apps protects the use of cloud apps; it doesn't assess or protect servers and workloads in Azure, AWS and the datacenter.", fr: "Defender pour les applications cloud protège l'utilisation des applications cloud ; il n'évalue ni ne protège les serveurs et les charges de travail d'Azure, d'AWS et du centre de données." }
    references:
      - title: Describe Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/2-describe-defender-cloud
      - title: What is Microsoft Defender for Cloud?
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/defender-for-cloud-introduction

  # ------------------------------------------------------------------ 10
  - id: sc900-qz-32-10
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        An analyst of Adatum reviews the five findings shown in the following table in Microsoft Defender for Cloud. The analyst doesn't know which plans are enabled on the subscription and wants to deduce it from the findings.

        Answer each prompt by selecting the appropriate finding.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un analyste d'Adatum examine dans Microsoft Defender pour le cloud les cinq résultats présentés dans le tableau suivant. L'analyste ne sait pas quels plans sont activés sur l'abonnement et veut le déduire des résultats.

        Répondez à chaque invite en sélectionnant le résultat approprié.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - { id: p1, text: { en: "The finding that only a cloud workload protection plan can produce", fr: "Le résultat que seul un plan de protection des charges de travail cloud peut produire" } }
        - { id: p2, text: { en: "The finding that the free Foundational CSPM plan produces on its own", fr: "Le résultat que le plan gratuit CSPM de base produit à lui seul" } }
      grid:
        header: [{ en: "Finding", fr: "Résultat" }]
        rows:
          - [{ text: { en: "Storage accounts should restrict public network access (severity: medium)", fr: "Les comptes de stockage doivent restreindre l'accès réseau public (gravité : moyenne)" }, area: f1 }]
          - [{ text: { en: "An internet-exposed virtual machine with a critical vulnerability can reach a storage account that holds sensitive data", fr: "Une machine virtuelle exposée à internet avec une vulnérabilité critique peut atteindre un compte de stockage qui contient des données sensibles" }, area: f2 }]
          - [{ text: { en: "Unusual access to a key vault from an IP address known to be malicious (severity: high)", fr: "Accès inhabituel à un coffre de clés depuis une adresse IP connue pour être malveillante (gravité : élevée)" }, area: f3 }]
          - [{ text: { en: "PCI DSS control failed on three resources", fr: "Contrôle PCI DSS en échec sur trois ressources" }, area: f4 }]
          - [{ text: { en: "Agentless scan found a secret on the disk of a virtual machine", fr: "Une analyse sans agent a trouvé un secret sur le disque d'une machine virtuelle" }, area: f5 }]
    answer: { values: { p1: f3, p2: f1 } }
    explanation:
      correct:
        en: |
          An alert on unusual access to a key vault is threat detection: it comes from the Defender for Key Vault plan, a cloud workload protection plan. A recommendation about the configuration of storage accounts comes from the continuous assessment against the MCSB, included in the free Foundational CSPM plan.
        fr: |
          Une alerte sur un accès inhabituel à un coffre de clés relève de la détection des menaces : elle vient du plan Defender for Key Vault, un plan de protection des charges de travail cloud. Une recommandation sur la configuration des comptes de stockage vient de l'évaluation continue par rapport au MCSB, incluse dans le plan gratuit CSPM de base.
      options:
        f2: { en: "This attack path comes from attack path analysis, a capability of the paid Defender CSPM plan: posture, not threat detection.", fr: "Ce chemin d'attaque vient de l'analyse du chemin d'attaque, une fonctionnalité du plan payant Defender CSPM : de la posture, pas de la détection des menaces." }
        f4: { en: "Regulatory compliance assessments against standards such as PCI DSS require a paid plan such as Defender CSPM; Foundational CSPM doesn't include them.", fr: "Les évaluations de conformité réglementaire par rapport à des normes comme PCI DSS demandent un plan payant comme Defender CSPM ; le CSPM de base ne les inclut pas." }
        f5: { en: "Agentless scanning of virtual machines for secrets comes with Defender CSPM as well as with Defender for Servers Plan 2, so it isn't free and doesn't prove that a workload protection plan is enabled.", fr: "L'analyse sans agent des secrets des machines virtuelles est fournie par Defender CSPM comme par Defender for Servers Plan 2 ; elle n'est donc pas gratuite et ne prouve pas qu'un plan de protection des charges de travail est activé." }
    references:
      - title: What is Cloud Security Posture Management (CSPM)
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
      - title: Describe the enhanced security of Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/training/modules/describe-security-management-capabilities-of-azure/5a-describe-enhanced-security-defender-cloud
