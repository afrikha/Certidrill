# AZ-305 objectives — official study guide, skills measured as of 2026-04-17 (en-us and fr-fr pages, checked on 2026-11-16).
# `code` is the stable key referenced by question files and course sections.
identity:
- group:
    en: Design solutions for logging and monitoring
    fr: Concevoir des solutions de journalisation et de monitoring
  objectives:
  - code: 1.1.1
    en: Recommend a logging solution
    fr: Recommander une solution de journalisation
  - code: 1.1.2
    en: Recommend a solution for routing logs
    fr: Recommander une solution pour la gestion du routage des logs
  - code: 1.1.3
    en: Recommend a monitoring solution
    fr: Recommander une solution de monitoring
- group:
    en: Design authentication and authorization solutions
    fr: Concevoir des solutions d'authentification et d'autorisation
  objectives:
  - code: 1.2.1
    en: Recommend an authentication solution
    fr: Recommander une solution d'authentification
  - code: 1.2.2
    en: Recommend an identity management solution
    fr: Recommander une solution de gestion des identités
  - code: 1.2.3
    en: Recommend a solution for authorizing access to Azure resources
    fr: Recommander une solution pour autoriser l'accès aux ressources Azure
  - code: 1.2.4
    en: Recommend a solution for authorizing access to on-premises resources
    fr: Recommander une solution pour autoriser l'accès aux ressources locales
  - code: 1.2.5
    en: Recommend a solution to manage secrets, certificates, and keys
    fr: Recommander une solution pour gérer les secrets, les certificats et les clés
- group:
    en: Design governance
    fr: Conception de la gouvernance
  objectives:
  - code: 1.3.1
    en: Recommend a structure for management groups, subscriptions, and resource groups, and a strategy for resource tagging
    fr: Recommander une structure pour les groupes d'administration, les abonnements et les groupes de ressources, ainsi qu'une stratégie pour l'étiquetage des ressources
  - code: 1.3.2
    en: Recommend a solution for managing compliance
    fr: Recommander une solution pour la gestion de la conformité
  - code: 1.3.3
    en: Recommend a solution for identity governance
    fr: Recommander une solution pour la gouvernance des identités
data:
- group:
    en: Design data storage solutions for relational data
    fr: Concevoir des solutions de stockage de données pour les données relationnelles
  objectives:
  - code: 2.1.1
    en: Recommend a solution for storing relational data
    fr: Recommander une solution pour le stockage des données relationnelles
  - code: 2.1.2
    en: Recommend a database service tier and compute tier
    fr: Recommander un niveau de service de base de données et un niveau de calcul
  - code: 2.1.3
    en: Recommend a solution for database scalability
    fr: Recommander une solution pour la scalabilité de la base de données
  - code: 2.1.4
    en: Recommend a solution for data protection
    fr: Recommander une solution pour la protection des données
- group:
    en: Design data storage solutions for semi-structured and unstructured data
    fr: Concevoir des solutions de stockage de données pour les données semi-structurées et non structurées
  objectives:
  - code: 2.2.1
    en: Recommend a solution for storing semi-structured data
    fr: Recommander une solution de stockage des données semi-structurées
  - code: 2.2.2
    en: Recommend a solution for storing unstructured data
    fr: Recommander une solution de stockage des données non structurées
  - code: 2.2.3
    en: Recommend a data storage solution to balance features, performance, and costs
    fr: Recommander une solution de stockage de données pour équilibrer les fonctionnalités, les performances et les coûts
  - code: 2.2.4
    en: Recommend a data solution for protection and durability
    fr: Recommander une solution de données pour la protection et la durabilité
- group:
    en: Design data integration
    fr: Concevoir l'intégration de données
  objectives:
  - code: 2.3.1
    en: Recommend a solution for data integration
    fr: Recommander une solution pour l'intégration de données
  - code: 2.3.2
    en: Recommend a solution for data analysis
    fr: Recommander une solution pour l'analyse de données
continuity:
- group:
    en: Design solutions for backup and disaster recovery
    fr: Concevoir des solutions pour la sauvegarde et la reprise d'activité
  objectives:
  - code: 3.1.1
    en: Recommend a recovery solution for Azure and hybrid workloads that meets recovery objectives
    fr: Recommander une solution de récupération pour les charges de travail hybrides et Azure qui répond aux objectifs de récupération
  - code: 3.1.2
    en: Recommend a backup and recovery solution for compute
    fr: Recommander une solution de sauvegarde et de récupération pour les ressources de calcul
  - code: 3.1.3
    en: Recommend a backup and recovery solution for databases
    fr: Recommander une solution de sauvegarde et de récupération pour les bases de données
  - code: 3.1.4
    en: Recommend a backup and recovery solution for unstructured data
    fr: Recommander une solution de sauvegarde et de récupération pour les données non structurées
- group:
    en: Design for high availability
    fr: Concevoir pour la haute disponibilité
  objectives:
  - code: 3.2.1
    en: Recommend a high availability solution for compute
    fr: Recommander une solution de haute disponibilité pour le calcul
  - code: 3.2.2
    en: Recommend a high availability solution for relational data
    fr: Recommander une solution de haute disponibilité pour les données relationnelles
  - code: 3.2.3
    en: Recommend a high availability solution for semi-structured and unstructured data
    fr: Recommander une solution de haute disponibilité pour les données semi-structurées et non structurées
infrastructure:
- group:
    en: Design compute solutions
    fr: Concevoir des solutions de calcul
  objectives:
  - code: 4.1.1
    en: Specify components of a compute solution based on workload requirements
    fr: Spécifier les composants d'une solution de calcul en fonction des besoins de charge de travail
  - code: 4.1.2
    en: Recommend a virtual machine-based solution
    fr: Recommander une solution basée sur des machines virtuelles
  - code: 4.1.3
    en: Recommend a container-based solution
    fr: Recommander une solution basée sur des conteneurs
  - code: 4.1.4
    en: Recommend a serverless-based solution
    fr: Recommander une solution basée sur une architecture sans serveur
  - code: 4.1.5
    en: Recommend a compute solution for batch processing
    fr: Recommander une solution de calcul pour le traitement par lots
- group:
    en: Design an application architecture
    fr: Concevoir une architecture d'application
  objectives:
  - code: 4.2.1
    en: Recommend a messaging architecture
    fr: Recommander une architecture de messagerie
  - code: 4.2.2
    en: Recommend an event-driven architecture
    fr: Recommander une architecture basée sur les événements
  - code: 4.2.3
    en: Recommend a solution for API integration
    fr: Recommander une solution d'intégration des API
  - code: 4.2.4
    en: Recommend a caching solution for applications
    fr: Recommander une solution de mise en cache pour les applications
  - code: 4.2.5
    en: Recommend an application configuration management solution
    fr: Recommander une solution de gestion de la configuration des applications
  - code: 4.2.6
    en: Recommend an automated deployment solution for applications
    fr: Recommander une solution de déploiement automatisé pour les applications
- group:
    en: Design migrations
    fr: Concevoir des migrations
  objectives:
  - code: 4.3.1
    en: Evaluate a migration solution that leverages the Microsoft Cloud Adoption Framework for Azure
    fr: Évaluer une solution de migration qui utilise Microsoft Cloud Adoption Framework pour Azure
  - code: 4.3.2
    en: Evaluate on-premises servers, data, and applications for migration
    fr: Évaluer les serveurs, données et applications locaux pour la migration
  - code: 4.3.3
    en: Recommend a solution for migrating workloads to infrastructure as a service (IaaS) and platform as a service (PaaS)
    fr: Recommander une solution pour la migration des charges de travail vers une infrastructure en tant que service (IaaS) et une plateforme en tant que service (PaaS)
  - code: 4.3.4
    en: Recommend a solution for migrating databases
    fr: Recommander une solution pour la migration des bases de données
  - code: 4.3.5
    en: Recommend a solution for migrating unstructured data
    fr: Recommander une solution pour la migration des données non structurées
- group:
    en: Design network solutions
    fr: Concevoir des solutions réseau
  objectives:
  - code: 4.4.1
    en: Recommend a connectivity solution that connects Azure resources to the internet
    fr: Recommander une solution de connectivité qui connecte les ressources Azure à Internet
  - code: 4.4.2
    en: Recommend a connectivity solution that connects Azure resources to on-premises networks
    fr: Recommander une solution de connectivité qui connecte les ressources Azure aux réseaux locaux
  - code: 4.4.3
    en: Recommend a solution to optimize network performance
    fr: Recommander une solution pour optimiser les performances réseau
  - code: 4.4.4
    en: Recommend a solution to optimize network security
    fr: Recommander une solution pour optimiser la sécurité du réseau
  - code: 4.4.5
    en: Recommend a load-balancing and routing solution
    fr: Recommander une solution d'équilibrage de charge et de routage
