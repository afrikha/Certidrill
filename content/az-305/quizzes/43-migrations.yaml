chapter: 43-migrations
questions:
  # ------------------------------------------------------------------ 1
  - id: az305-qz-43-01
    objective: "4.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders plans to move an order-processing application to Azure. The application works correctly, but its code has accumulated technical debt and is expensive to maintain. The developers will rework the code to use Azure SDKs and cloud design patterns. They won't add any feature, and the architecture of the application will stay the same.

        Which migration strategy of the Microsoft Cloud Adoption Framework for Azure describes this plan?
      fr: |
        Northwind Traders prévoit de déplacer une application de traitement des commandes vers Azure. L'application fonctionne correctement, mais son code a accumulé une dette technique et coûte cher à maintenir. Les développeurs vont retravailler le code pour utiliser les SDK Azure et des modèles de conception cloud. Ils n'ajouteront aucune fonctionnalité, et l'architecture de l'application restera la même.

        Quelle stratégie de migration du Microsoft Cloud Adoption Framework pour Azure décrit ce plan ?
    body:
      options:
        - { id: a, text: { en: "Replatform", fr: "Replatform (changer de plateforme)" } }
        - { id: b, text: { en: "Refactor", fr: "Refactor (refactoriser)" } }
        - { id: c, text: { en: "Rearchitect", fr: "Rearchitect (réarchitecturer)" } }
        - { id: d, text: { en: "Rebuild", fr: "Rebuild (reconstruire)" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Refactor improves the internal structure of the code without adding features, for example to reduce technical debt or to adopt Azure SDKs and cloud design patterns. The architecture stays the same, which distinguishes it from the strategies that redesign or redevelop the workload.
        fr: |
          Refactor améliore la structure interne du code sans ajouter de fonctionnalités, par exemple pour réduire la dette technique ou adopter les SDK Azure et des modèles de conception cloud. L'architecture reste la même, ce qui la distingue des stratégies qui repensent ou redéveloppent la charge de travail.
      options:
        a: { en: "Replatform moves the workload to a managed hosting platform with minimal code changes; here the plan is a deliberate rework of the code.", fr: "Replatform déplace la charge de travail vers une plateforme d'hébergement managée avec des modifications de code minimales ; ici, le plan est un remaniement délibéré du code." }
        c: { en: "Rearchitect redesigns the architecture, for example by decomposing it into services; here the architecture doesn't change.", fr: "Rearchitect repense l'architecture, par exemple en la décomposant en services ; ici, l'architecture ne change pas." }
        d: { en: "Rebuild redevelops the workload from scratch with cloud-native services; here the existing code is kept and improved.", fr: "Rebuild redéveloppe la charge de travail de zéro avec des services natifs du cloud ; ici, le code existant est conservé et amélioré." }
    references:
      - title: Select your cloud migration strategies - Cloud Adoption Framework
        url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/plan/select-cloud-migration-strategy

  # ------------------------------------------------------------------ 2
  - id: az305-qz-43-02
    objective: "4.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has collected one month of performance data with an Azure Migrate appliance. Every night, an antivirus scan pushes the CPU of most servers to 100 percent for a few minutes.

        Contoso wants its Azure VM assessment to keep sizing the virtual machines from the collected performance data, but not to size them for these rare, short spikes. Which assessment setting should you adjust?
      fr: |
        Contoso a collecté un mois de données de performances avec une appliance Azure Migrate. Chaque nuit, une analyse antivirus porte le processeur de la plupart des serveurs à 100 % pendant quelques minutes.

        Contoso veut que son évaluation de machine virtuelle Azure continue de dimensionner les machines virtuelles d'après les données de performances collectées, mais sans les dimensionner pour ces pics rares et courts. Quel paramètre de l'évaluation devez-vous ajuster ?
    body:
      options:
        - { id: a, text: { en: "The comfort factor", fr: "Le facteur de confort" } }
        - { id: b, text: { en: "The performance history", fr: "L'historique des performances" } }
        - { id: c, text: { en: "The percentile utilization", fr: "L'utilisation en centile" } }
        - { id: d, text: { en: "The sizing criterion, set to as-is on-premises", fr: "Le critère de dimensionnement, défini sur en l'état local" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The percentile utilization sets which percentile of the performance samples is used for right-sizing. With the 95th percentile, for example, the few samples of a short nightly spike are ignored, while the sizing still reflects the actual utilization.
        fr: |
          L'utilisation en centile définit le centile des échantillons de performances utilisé pour le dimensionnement. Avec le 95e centile, par exemple, les quelques échantillons d'un pic nocturne court sont ignorés, tandis que le dimensionnement reflète toujours l'utilisation réelle.
      options:
        a: { en: "The comfort factor multiplies the computed size to add headroom; it doesn't decide which samples are used.", fr: "Le facteur de confort multiplie la taille calculée pour ajouter une marge ; il ne décide pas quels échantillons sont utilisés." }
        b: { en: "The performance history sets the period evaluated; the spikes happen every night, so any period still contains them.", fr: "L'historique des performances définit la période évaluée ; les pics ont lieu chaque nuit, donc toute période les contient encore." }
        d: { en: "As-is on-premises sizing ignores the performance data entirely, which Contoso wants to keep using.", fr: "Le dimensionnement en l'état local ignore entièrement les données de performances, que Contoso veut continuer d'utiliser." }
    references:
      - title: Performance vs As-is on-premises assessments - Azure Migrate
        url: https://learn.microsoft.com/en-us/azure/migrate/target-right-sizing

  # ------------------------------------------------------------------ 3
  - id: az305-qz-43-03
    objective: "4.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam runs four ASP.NET web applications on IIS, on virtual machines that run Windows Server 2019. A company standard states that new web workloads in Azure run as Windows containers on the existing Azure Kubernetes Service (AKS) cluster.

        The application code must not change. The team has never written a Dockerfile or built a container image, and the migration effort must be minimized. What should you recommend?
      fr: |
        Fabrikam exécute quatre applications web ASP.NET sur IIS, sur des machines virtuelles qui exécutent Windows Server 2019. Une norme de l'entreprise prévoit que les nouvelles charges de travail web dans Azure s'exécutent en conteneurs Windows sur le cluster Azure Kubernetes Service (AKS) existant.

        Le code des applications ne doit pas changer. L'équipe n'a jamais écrit de Dockerfile ni créé d'image conteneur, et l'effort de migration doit être réduit au minimum. Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Move each application to Azure App Service with App Service Migration Assistant.", fr: "Déplacer chaque application vers Azure App Service avec App Service Migration Assistant." } }
        - { id: b, text: { en: "Rehost the servers as Azure virtual machines with the agentless migration of Azure Migrate.", fr: "Réhéberger les serveurs en machines virtuelles Azure avec la migration sans agent d'Azure Migrate." } }
        - { id: c, text: { en: "Build the images with Azure Container Registry tasks, then deploy them to AKS.", fr: "Créer les images avec des tâches Azure Container Registry, puis les déployer sur AKS." } }
        - { id: d, text: { en: "Package the applications with the Azure Migrate App Containerization tool.", fr: "Empaqueter les applications avec l'outil App Containerization d'Azure Migrate." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The App Containerization tool of Azure Migrate discovers ASP.NET applications on IIS, builds their container images without code changes and deploys them as Windows containers to AKS. The team doesn't need to write Dockerfiles, which meets both the company standard and the effort requirement.
        fr: |
          L'outil App Containerization d'Azure Migrate découvre les applications ASP.NET sur IIS, crée leurs images conteneur sans modification du code et les déploie en conteneurs Windows sur AKS. L'équipe n'a pas besoin d'écrire de Dockerfile, ce qui respecte à la fois la norme de l'entreprise et l'exigence d'effort.
      options:
        a: { en: "App Service Migration Assistant moves the application to App Service code hosting, not to containers on the AKS cluster that the standard requires.", fr: "App Service Migration Assistant déplace l'application vers l'hébergement de code d'App Service, pas vers des conteneurs sur le cluster AKS qu'exige la norme." }
        b: { en: "A rehost keeps the applications on virtual machines; they wouldn't run as containers on AKS.", fr: "Un réhébergement garde les applications sur des machines virtuelles ; elles ne s'exécuteraient pas en conteneurs sur AKS." }
        c: { en: "Container Registry tasks build images from a Dockerfile, which the team would have to write for each application: the effort isn't minimized.", fr: "Les tâches Container Registry créent des images à partir d'un Dockerfile, que l'équipe devrait écrire pour chaque application : l'effort n'est pas réduit au minimum." }
    references:
      - title: "Azure App Containerization ASP.NET; Containerization and migration of ASP.NET applications to Azure Kubernetes. - Azure Migrate"
        url: https://learn.microsoft.com/en-us/azure/migrate/tutorial-app-containerization-aspnet-kubernetes

  # ------------------------------------------------------------------ 4
  - id: az305-qz-43-04
    objective: "4.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso runs a vendor application on an on-premises SQL Server 2016 instance. The vendor requires SQL Server Reporting Services on the same server as the database engine, so the target will be SQL Server on Azure Virtual Machines.

        The application must keep writing to the databases while they are copied, and the downtime must be limited to the final cutover. Contoso doesn't want to configure replication between the SQL Server instances itself. What should you recommend?
      fr: |
        Contoso exécute une application d'éditeur sur une instance SQL Server 2016 locale. L'éditeur exige SQL Server Reporting Services sur le même serveur que le moteur de base de données ; la cible sera donc SQL Server sur Machines virtuelles Azure.

        L'application doit continuer d'écrire dans les bases de données pendant leur copie, et l'interruption doit se limiter à la bascule finale. Contoso ne veut pas configurer elle-même de réplication entre les instances SQL Server. Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "An online migration with Azure Database Migration Service", fr: "Une migration en ligne avec Azure Database Migration Service" } }
        - { id: b, text: { en: "A migration through the Managed Instance link", fr: "Une migration au moyen du lien Managed Instance" } }
        - { id: c, text: { en: "A migration with Log Replay Service in continuous mode", fr: "Une migration avec Log Replay Service en mode continu" } }
        - { id: d, text: { en: "A native backup and restore through Azure Blob Storage", fr: "Une sauvegarde et restauration natives via le Stockage Blob Azure" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Azure Database Migration Service supports online migrations to SQL Server on Azure Virtual Machines: the source stays available for reads and writes while backups are restored continuously on the target, and the downtime is limited to the cutover. The service drives the whole process, so Contoso configures no replication itself.
        fr: |
          Azure Database Migration Service prend en charge les migrations en ligne vers SQL Server sur Machines virtuelles Azure : la source reste disponible en lecture et en écriture pendant que les sauvegardes sont restaurées en continu sur la cible, et l'interruption se limite à la bascule. Le service pilote l'ensemble du processus ; Contoso ne configure donc elle-même aucune réplication.
      options:
        b: { en: "The Managed Instance link replicates only to Azure SQL Managed Instance, not to SQL Server on a virtual machine.", fr: "Le lien Managed Instance ne réplique que vers Azure SQL Managed Instance, pas vers SQL Server sur une machine virtuelle." }
        c: { en: "Log Replay Service is a feature of Azure SQL Managed Instance; it can't restore to SQL Server on a virtual machine.", fr: "Log Replay Service est une fonctionnalité d'Azure SQL Managed Instance ; il ne peut pas restaurer vers SQL Server sur une machine virtuelle." }
        d: { en: "A one-time backup and restore is an offline method: changes made after the backup are lost unless the application stops for the whole copy.", fr: "Une sauvegarde et restauration ponctuelles sont une méthode hors connexion : les modifications faites après la sauvegarde sont perdues, sauf si l'application s'arrête pendant toute la copie." }
    references:
      - title: "Tutorial: Migrate SQL Server to SQL Server on an Azure Virtual Machine with Azure DMS (Online) - Azure Database Migration Service"
        url: https://learn.microsoft.com/en-us/data-migration/sql-server/virtual-machines/database-migration-service-online
      - title: What Is Azure Database Migration Service?
        url: https://learn.microsoft.com/en-us/azure/dms/dms-overview

  # ------------------------------------------------------------------ 5
  - id: az305-qz-43-05
    objective: "4.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware stores 40 TB of product images in an Amazon S3 bucket and plans to move them to a blob container in an Azure storage account. The solution must meet the following requirements:

        - The migration jobs must be defined, started and monitored from Azure.
        - No virtual machine or script must be maintained to perform the copy.
        - Later runs must copy only the new or changed objects.

        What should you recommend?
      fr: |
        Litware stocke 40 To d'images de produits dans un compartiment Amazon S3 et prévoit de les déplacer vers un conteneur d'objets blob dans un compte de stockage Azure. La solution doit répondre aux exigences suivantes :

        - Les travaux de migration doivent être définis, démarrés et supervisés depuis Azure.
        - Aucune machine virtuelle ni aucun script ne doit être maintenu pour effectuer la copie.
        - Les exécutions suivantes ne doivent copier que les objets nouveaux ou modifiés.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "A cloud-to-cloud migration with Azure Storage Mover", fr: "Une migration de cloud à cloud avec Azure Storage Mover" } }
        - { id: b, text: { en: "A scheduled AzCopy job on an Azure virtual machine", fr: "Un travail AzCopy planifié sur une machine virtuelle Azure" } }
        - { id: c, text: { en: "An Azure Data Box device loaded from the bucket", fr: "Un appareil Azure Data Box chargé depuis le compartiment" } }
        - { id: d, text: { en: "Azure File Sync with a cloud endpoint in the account", fr: "Azure File Sync avec un point de terminaison cloud dans le compte" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Azure Storage Mover is a fully managed migration service: its cloud-to-cloud migration copies an AWS S3 bucket to a blob container through an Azure Arc multicloud connector, with no migration agent or virtual machine. Jobs are defined and tracked in the Storage Mover resource, and incremental runs keep the bucket and the container in sync.
        fr: |
          Azure Storage Mover est un service de migration entièrement managé : sa migration de cloud à cloud copie un compartiment AWS S3 vers un conteneur d'objets blob au moyen d'un connecteur multicloud Azure Arc, sans agent de migration ni machine virtuelle. Les travaux sont définis et suivis dans la ressource Storage Mover, et les exécutions incrémentielles maintiennent le compartiment et le conteneur synchronisés.
      options:
        b: { en: "AzCopy can copy from S3, but a virtual machine and a scheduled script would have to be maintained, which the requirements exclude.", fr: "AzCopy peut copier depuis S3, mais il faudrait maintenir une machine virtuelle et un script planifié, ce que les exigences excluent." }
        c: { en: "Data Box carries data from your own site; loading it from S3 would mean downloading the bucket first, and it doesn't handle later incremental runs.", fr: "Data Box transporte des données depuis votre propre site ; le charger depuis S3 imposerait de télécharger d'abord le compartiment, et il ne gère pas les exécutions incrémentielles suivantes." }
        d: { en: "Azure File Sync synchronizes Windows file servers with Azure file shares; it has no S3 source and doesn't target blob containers.", fr: "Azure File Sync synchronise des serveurs de fichiers Windows avec des partages de fichiers Azure ; il n'a pas de source S3 et ne cible pas les conteneurs d'objets blob." }
    references:
      - title: Get started with cloud-to-cloud migration in Azure Storage Mover
        url: https://learn.microsoft.com/en-us/azure/storage-mover/cloud-to-cloud-migration
      - title: Introduction to Azure Storage Mover
        url: https://learn.microsoft.com/en-us/azure/storage-mover/service-overview

  # ------------------------------------------------------------------ 6
  - id: az305-qz-43-06
    objective: "4.3.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        During the Plan phase of the Microsoft Cloud Adoption Framework for Azure, Wingtip Toys reviews four applications:

        | Application | Current situation and plans |
        | --- | --- |
        | Claims | Will run in Azure on its current architecture. Its maintenance costs are high, so developers will rework its code with Azure SDKs to improve observability, without adding features. |
        | Booking | A monolith whose search load is twenty times its payment load at peak. Its existing code will be split into services that are deployed and scaled separately. |
        | Quoting | Built on a discontinued framework and unable to meet new pricing requirements. No commercial product supports Wingtip's pricing rules, so a new application will be developed with cloud-native services. |
        | Plant control | Stable and compliant, meets current and expected business needs, and has no driver to move in the coming years. |

        Which strategy should you assign to each application? To answer, drag the appropriate strategies to the correct applications. Each strategy may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Pendant la phase Plan du Microsoft Cloud Adoption Framework pour Azure, Wingtip Toys examine quatre applications :

        | Application | Situation actuelle et plans |
        | --- | --- |
        | Sinistres | S'exécutera dans Azure sur son architecture actuelle. Ses coûts de maintenance sont élevés, donc les développeurs vont retravailler son code avec les SDK Azure pour améliorer l'observabilité, sans ajouter de fonctionnalités. |
        | Réservations | Un monolithe dont la charge de recherche vaut vingt fois sa charge de paiement en pointe. Son code existant sera découpé en services déployés et mis à l'échelle séparément. |
        | Devis | Construite sur un framework abandonné et incapable de répondre aux nouvelles exigences de tarification. Aucun produit commercial ne prend en charge les règles de tarification de Wingtip, donc une nouvelle application sera développée avec des services natifs du cloud. |
        | Pilotage d'usine | Stable et conforme, répond aux besoins métier actuels et attendus, et n'a aucun motif de déplacement dans les années à venir. |

        Quelle stratégie devez-vous attribuer à chaque application ? Pour répondre, faites glisser les stratégies appropriées vers les applications correspondantes. Chaque stratégie peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: replatform, text: { en: "Replatform", fr: "Replatform (changer de plateforme)" } }
        - { id: refactor, text: { en: "Refactor", fr: "Refactor (refactoriser)" } }
        - { id: rearchitect, text: { en: "Rearchitect", fr: "Rearchitect (réarchitecturer)" } }
        - { id: rebuild, text: { en: "Rebuild", fr: "Rebuild (reconstruire)" } }
        - { id: replace, text: { en: "Replace", fr: "Replace (remplacer)" } }
        - { id: retain, text: { en: "Retain", fr: "Retain (conserver)" } }
      targets:
        - { id: claims, text: { en: "Claims", fr: "Sinistres" } }
        - { id: booking, text: { en: "Booking", fr: "Réservations" } }
        - { id: quoting, text: { en: "Quoting", fr: "Devis" } }
        - { id: plant, text: { en: "Plant control", fr: "Pilotage d'usine" } }
    answer:
      mapping: { claims: refactor, booking: rearchitect, quoting: rebuild, plant: retain }
    explanation:
      correct:
        en: |
          Claims keeps its architecture and changes its code only to reduce maintenance costs and adopt Azure SDKs, without new features: refactor. Booking reuses its code but redesigns the architecture into services that scale independently: rearchitect. Quoting can't meet its requirements, no SaaS product fits, and the application is redeveloped with cloud-native services: rebuild. Plant control has no driver to move: retain.
        fr: |
          Sinistres conserve son architecture et ne modifie son code que pour réduire les coûts de maintenance et adopter les SDK Azure, sans nouvelles fonctionnalités : refactor. Réservations réutilise son code mais repense l'architecture en services mis à l'échelle indépendamment : rearchitect. Devis ne peut pas répondre à ses exigences, aucun produit SaaS ne convient, et l'application est redéveloppée avec des services natifs du cloud : rebuild. Pilotage d'usine n'a aucun motif de déplacement : retain.
      options:
        replatform: { en: "Replatform moves a workload to a managed hosting platform with minimal code changes; Claims plans substantial code work, and none of the workloads is only changing its hosting.", fr: "Replatform déplace une charge de travail vers une plateforme d'hébergement managée avec des modifications de code minimales ; Sinistres prévoit un travail de code important, et aucune charge de travail ne change seulement d'hébergement." }
        replace: { en: "Replace adopts a commercial SaaS product; for Quoting, no commercial product supports the pricing rules.", fr: "Replace adopte un produit SaaS commercial ; pour Devis, aucun produit commercial ne prend en charge les règles de tarification." }
    references:
      - title: Select your cloud migration strategies - Cloud Adoption Framework
        url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/plan/select-cloud-migration-strategy

  # ------------------------------------------------------------------ 7
  - id: az305-qz-43-07
    objective: "4.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank runs 250 standalone SQL Server instances on physical Windows servers in two datacenters. For licensing and inventory, every instance is already connected to Azure Arc with the Azure extension for SQL Server.

        The bank plans to move the databases to Azure SQL and needs a recommendation that meets the following requirements:

        - For each instance, provide its readiness, the recommended Azure SQL target type and service tier based on performance history, and an estimated monthly cost.
        - The results must be refreshed automatically as the workloads change.
        - The security policy forbids deploying any new appliance or server in the datacenters.
        - The administrative effort must be minimized.

        What should you recommend?
      fr: |
        Woodgrove Bank exécute 250 instances SQL Server autonomes sur des serveurs Windows physiques dans deux centres de données. Pour les licences et l'inventaire, chaque instance est déjà connectée à Azure Arc avec l'extension Azure pour SQL Server.

        La banque prévoit de déplacer les bases de données vers Azure SQL et a besoin d'une recommandation qui répond aux exigences suivantes :

        - Pour chaque instance, fournir sa préparation, le type de cible Azure SQL et le niveau de service recommandés d'après l'historique des performances, ainsi qu'un coût mensuel estimé.
        - Les résultats doivent être actualisés automatiquement à mesure que les charges de travail évoluent.
        - La stratégie de sécurité interdit de déployer toute nouvelle appliance ou tout nouveau serveur dans les centres de données.
        - L'effort administratif doit être réduit au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Deploy an Azure Migrate appliance for physical servers, then create an Azure SQL assessment.", fr: "Déployer une appliance Azure Migrate pour serveurs physiques, puis créer une évaluation Azure SQL." } }
        - { id: b, text: { en: "Review the migration assessment that Azure Arc produces for each SQL Server instance.", fr: "Consulter l'évaluation de migration qu'Azure Arc produit pour chaque instance SQL Server." } }
        - { id: c, text: { en: "Run Data Migration Assistant on each instance, then upload the reports to Azure Migrate.", fr: "Exécuter Data Migration Assistant sur chaque instance, puis charger les rapports dans Azure Migrate." } }
        - { id: d, text: { en: "Run SQL Server Migration Assistant (SSMA) against each instance to obtain an Azure SQL target.", fr: "Exécuter SQL Server Migration Assistant (SSMA) sur chaque instance pour obtenir une cible Azure SQL." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          For SQL Server enabled by Azure Arc, the migration assessment is generated automatically and runs again every week. It reports readiness, recommends the Azure SQL target type with its service tier and size from the performance history, and estimates the cost. It uses the Azure extension for SQL Server already installed, so nothing new is deployed in the datacenters.
        fr: |
          Pour SQL Server activé par Azure Arc, l'évaluation de migration est générée automatiquement et s'exécute de nouveau chaque semaine. Elle indique la préparation, recommande le type de cible Azure SQL avec son niveau de service et sa taille d'après l'historique des performances, et estime le coût. Elle utilise l'extension Azure pour SQL Server déjà installée ; rien de nouveau n'est donc déployé dans les centres de données.
      options:
        a: { en: "An Azure Migrate appliance would give the same kind of assessment, but deploying it in the datacenters is forbidden.", fr: "Une appliance Azure Migrate donnerait le même type d'évaluation, mais la déployer dans les centres de données est interdit." }
        c: { en: "Data Migration Assistant was retired in July 2025, and running it on 250 instances doesn't refresh anything automatically.", fr: "Data Migration Assistant a été mis hors service en juillet 2025, et l'exécuter sur 250 instances n'actualise rien automatiquement." }
        d: { en: "SSMA converts schemas from other engines such as Oracle or Db2; it isn't the assessment tool for SQL Server sources.", fr: "SSMA convertit les schémas d'autres moteurs comme Oracle ou Db2 ; ce n'est pas l'outil d'évaluation des sources SQL Server." }
    references:
      - title: Assess Migration Readiness - SQL Server enabled by Azure Arc
        url: https://learn.microsoft.com/en-us/sql/sql-server/azure-arc/migration-assessment

  # ------------------------------------------------------------------ 8
  - id: az305-qz-43-08
    objective: "4.3.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys plans to migrate three workloads from its datacenter to Azure:

        | Workload | Description | Target |
        | --- | --- | --- |
        | WL1 | 220 virtual machines on VMware vSphere, managed by vCenter Server | Azure virtual machines |
        | WL2 | 45 virtual machines on a KVM-based virtualization platform | Azure virtual machines |
        | WL3 | 12 Java web applications on Apache Tomcat, on Linux servers | Linux containers on the existing AKS cluster |

        The solution must meet the following requirements:

        - The security team forbids installing software in the guest operating systems of WL1.
        - The code of WL3 must not change, and the team has no experience building container images.
        - Each workload must use the method that Microsoft recommends for its source.

        Which method should you recommend for each workload? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys prévoit de migrer trois charges de travail de son centre de données vers Azure :

        | Charge de travail | Description | Cible |
        | --- | --- | --- |
        | WL1 | 220 machines virtuelles sur VMware vSphere, gérées par vCenter Server | Machines virtuelles Azure |
        | WL2 | 45 machines virtuelles sur une plateforme de virtualisation basée sur KVM | Machines virtuelles Azure |
        | WL3 | 12 applications web Java sur Apache Tomcat, sur des serveurs Linux | Conteneurs Linux sur le cluster AKS existant |

        La solution doit répondre aux exigences suivantes :

        - L'équipe de sécurité interdit d'installer des logiciels dans les systèmes d'exploitation invités de WL1.
        - Le code de WL3 ne doit pas changer, et l'équipe n'a aucune expérience de la création d'images conteneur.
        - Chaque charge de travail doit utiliser la méthode que Microsoft recommande pour sa source.

        Quelle méthode devez-vous recommander pour chaque charge de travail ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          WL1: [[wl1]]

          WL2: [[wl2]]

          WL3: [[wl3]]
        fr: |
          WL1 : [[wl1]]

          WL2 : [[wl2]]

          WL3 : [[wl3]]
      slots:
        - id: wl1
          options:
            - { id: agentless, text: { en: "Agentless migration of Azure Migrate", fr: "Migration sans agent d'Azure Migrate" } }
            - { id: agent, text: { en: "Agent-based migration of Azure Migrate", fr: "Migration avec agent d'Azure Migrate" } }
            - { id: hcx, text: { en: "Azure VMware Solution with VMware HCX", fr: "Azure VMware Solution avec VMware HCX" } }
            - { id: containerize, text: { en: "Azure Migrate App Containerization tool", fr: "Outil App Containerization d'Azure Migrate" } }
        - id: wl2
          options:
            - { id: agentless, text: { en: "Agentless migration of Azure Migrate", fr: "Migration sans agent d'Azure Migrate" } }
            - { id: agent, text: { en: "Agent-based migration of Azure Migrate", fr: "Migration avec agent d'Azure Migrate" } }
            - { id: hcx, text: { en: "Azure VMware Solution with VMware HCX", fr: "Azure VMware Solution avec VMware HCX" } }
            - { id: asr, text: { en: "Azure Site Recovery", fr: "Azure Site Recovery" } }
        - id: wl3
          options:
            - { id: agentless, text: { en: "Agentless migration of Azure Migrate", fr: "Migration sans agent d'Azure Migrate" } }
            - { id: containerize, text: { en: "Azure Migrate App Containerization tool", fr: "Outil App Containerization d'Azure Migrate" } }
            - { id: asma, text: { en: "App Service Migration Assistant", fr: "App Service Migration Assistant" } }
            - { id: asr, text: { en: "Azure Site Recovery", fr: "Azure Site Recovery" } }
    answer:
      values: { wl1: agentless, wl2: agent, wl3: containerize }
    explanation:
      correct:
        en: |
          VMware virtual machines can be replicated without any software in the guests: the Azure Migrate appliance uses VMware snapshots. Virtual machines on other hypervisors such as KVM are migrated as physical servers, with a replication appliance and the Mobility service agent in each machine. The App Containerization tool packages Java applications on Apache Tomcat as Linux containers and deploys them to AKS without code changes or hand-written images.
        fr: |
          Les machines virtuelles VMware peuvent être répliquées sans aucun logiciel dans les invités : l'appliance Azure Migrate utilise des instantanés VMware. Les machines virtuelles d'autres hyperviseurs comme KVM sont migrées comme des serveurs physiques, avec une appliance de réplication et l'agent du service Mobilité dans chaque machine. L'outil App Containerization empaquette les applications Java sur Apache Tomcat en conteneurs Linux et les déploie sur AKS sans modification du code ni image écrite à la main.
      options:
        agent: { en: "For WL1, the agent-based method installs the Mobility service in each guest, which is forbidden.", fr: "Pour WL1, la méthode avec agent installe le service Mobilité dans chaque invité, ce qui est interdit." }
        hcx: { en: "Azure VMware Solution keeps the machines on a VMware private cloud; the target here is Azure virtual machines, and KVM machines aren't VMware.", fr: "Azure VMware Solution garde les machines sur un cloud privé VMware ; la cible est ici des machines virtuelles Azure, et les machines KVM ne sont pas VMware." }
        agentless: { en: "Agentless replication exists only for VMware and Hyper-V; it neither applies to KVM nor produces containers.", fr: "La réplication sans agent n'existe que pour VMware et Hyper-V ; elle ne s'applique pas à KVM et ne produit pas de conteneurs." }
        asma: { en: "App Service Migration Assistant targets App Service, not containers on the AKS cluster.", fr: "App Service Migration Assistant cible App Service, pas des conteneurs sur le cluster AKS." }
        asr: { en: "Site Recovery is the disaster recovery service; for migrations, Microsoft directs you to Azure Migrate.", fr: "Site Recovery est le service de reprise d'activité ; pour les migrations, Microsoft vous oriente vers Azure Migrate." }
    references:
      - title: Migrate machines as physical servers to Azure with Azure Catalyst - Azure Migrate
        url: https://learn.microsoft.com/en-us/azure/migrate/tutorial-migrate-physical-virtual-machines
      - title: "Azure App Containerization ASP.NET; Containerization and migration of ASP.NET applications to Azure Kubernetes. - Azure Migrate"
        url: https://learn.microsoft.com/en-us/azure/migrate/tutorial-app-containerization-aspnet-kubernetes

  # ------------------------------------------------------------------ 9
  - id: az305-qz-43-09
    objective: "4.3.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam plans to migrate the following databases to Azure SQL Managed Instance:

        | Source | Databases | Features used |
        | --- | --- | --- |
        | SQL1: SQL Server 2014 Enterprise on Windows Server 2012 R2 | Sales, Stock and Billing | Cross-database queries, SQL Server Agent jobs |
        | DB2SRV: IBM Db2 | Parts | Tables, views and stored procedures |

        The applications of SQL1 must keep writing to SQL1 during the migration, and their downtime must be limited to the final cutover. Fabrikam's backup jobs can write full, differential and log backups of SQL1 to Azure Blob Storage.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam prévoit de migrer les bases de données suivantes vers Azure SQL Managed Instance :

        | Source | Bases de données | Fonctionnalités utilisées |
        | --- | --- | --- |
        | SQL1 : SQL Server 2014 Enterprise sur Windows Server 2012 R2 | Sales, Stock et Billing | Requêtes entre bases de données, travaux SQL Server Agent |
        | DB2SRV : IBM Db2 | Parts | Tables, vues et procédures stockées |

        Les applications de SQL1 doivent continuer d'écrire dans SQL1 pendant la migration, et leur interruption doit se limiter à la bascule finale. Les travaux de sauvegarde de Fabrikam peuvent écrire des sauvegardes complètes, différentielles et de journaux de SQL1 dans le Stockage Blob Azure.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Migrating the SQL1 databases through the Managed Instance link meets the downtime requirement.", fr: "Migrer les bases de données de SQL1 au moyen du lien Managed Instance répond à l'exigence d'interruption." }
        - id: s2
          text: { en: "Migrating the SQL1 databases with Log Replay Service in continuous mode meets the downtime requirement.", fr: "Migrer les bases de données de SQL1 avec Log Replay Service en mode continu répond à l'exigence d'interruption." }
        - id: s3
          text: { en: "SQL Server Migration Assistant (SSMA) can convert the schema of Parts and migrate its data to the managed instance.", fr: "SQL Server Migration Assistant (SSMA) peut convertir le schéma de Parts et migrer ses données vers l'instance managée." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          The Managed Instance link relies on distributed availability groups, which appeared in SQL Server 2016, so a SQL Server 2014 source can't use it. Log Replay Service restores standard backups from Blob Storage and supports SQL Server 2012 and later; in continuous mode, it keeps restoring the new log backups until you request the cutover. SSMA converts Db2 schemas to SQL Server, Azure SQL Database or Azure SQL Managed Instance and migrates the data.
        fr: |
          Le lien Managed Instance repose sur les groupes de disponibilité distribués, apparus avec SQL Server 2016 ; une source SQL Server 2014 ne peut donc pas l'utiliser. Log Replay Service restaure des sauvegardes standard depuis le Stockage Blob et prend en charge SQL Server 2012 et ultérieur ; en mode continu, il continue de restaurer les nouvelles sauvegardes de journaux jusqu'à ce que vous demandiez la bascule. SSMA convertit les schémas Db2 vers SQL Server, Azure SQL Database ou Azure SQL Managed Instance et migre les données.
      options:
        s1: { en: "SQL Server versions before 2016 (2008 to 2014) aren't supported by the Managed Instance link.", fr: "Les versions de SQL Server antérieures à 2016 (2008 à 2014) ne sont pas prises en charge par le lien Managed Instance." }
    references:
      - title: Managed Instance link overview - Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
      - title: Migration to Azure SQL Managed Instance - SQL Server migration in Azure Arc
        url: https://learn.microsoft.com/en-us/data-migration/sql-server/managed-instance/database-migration-service

  # ------------------------------------------------------------------ 10
  - id: az305-qz-43-10
    objective: "4.3.5"
    difficulty: 3
    status: draft
    type: multi
    shuffle: false
    stem:
      en: |
        Adatum must copy data from five sites to Azure Blob Storage. Each copy is done once.

        | Site | Data | Internet link | Deadline |
        | --- | --- | --- | --- |
        | Site1 | 45 TB | 100 Mbps | 4 weeks |
        | Site2 | 8 TB | 500 Mbps | 5 days |
        | Site3 | 150 TB | 1 Gbps | 3 weeks |
        | Site4 | 12 TB | 20 Mbps | 6 weeks |
        | Site5 | 30 TB | 1 Gbps | 1 week |

        Adatum's policy is to copy the data over the network whenever the copy can finish before the deadline, and to order an offline transfer device only otherwise. Assume that 1 TB is 10^12 bytes, that each link is fully available for the copy at its nominal rate, and that the protocol overhead can be ignored.

        For which two sites should you recommend an offline transfer device?

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum doit copier les données de cinq sites vers le Stockage Blob Azure. Chaque copie n'a lieu qu'une fois.

        | Site | Données | Liaison Internet | Échéance |
        | --- | --- | --- | --- |
        | Site1 | 45 To | 100 Mbit/s | 4 semaines |
        | Site2 | 8 To | 500 Mbit/s | 5 jours |
        | Site3 | 150 To | 1 Gbit/s | 3 semaines |
        | Site4 | 12 To | 20 Mbit/s | 6 semaines |
        | Site5 | 30 To | 1 Gbit/s | 1 semaine |

        La règle d'Adatum est de copier les données par le réseau chaque fois que la copie peut se terminer avant l'échéance, et de ne commander un appareil de transfert hors connexion que dans le cas contraire. Supposez que 1 To vaut 10^12 octets, que chaque liaison est entièrement disponible pour la copie à son débit nominal et que la surcharge des protocoles peut être ignorée.

        Pour quels deux sites devez-vous recommander un appareil de transfert hors connexion ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: "Site1" }
        - { id: b, text: "Site2" }
        - { id: c, text: "Site3" }
        - { id: d, text: "Site4" }
        - { id: e, text: "Site5" }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Site1: 45 TB are 3.6 × 10^14 bits; at 100 Mbps the copy takes 3.6 × 10^6 seconds, about 42 days, beyond four weeks, so an offline device is needed (Data Box, since 45 TB exceeds a Data Box Disk order). Site4: 12 TB at 20 Mbps take 4.8 × 10^6 seconds, about 56 days, beyond six weeks; one Data Box Disk order (about 35 TB) is enough.
        fr: |
          Site1 : 45 To font 3,6 × 10^14 bits ; à 100 Mbit/s, la copie dure 3,6 × 10^6 secondes, environ 42 jours, au-delà de quatre semaines ; un appareil hors connexion est donc nécessaire (Data Box, car 45 To dépassent une commande Data Box Disk). Site4 : 12 To à 20 Mbit/s demandent 4,8 × 10^6 secondes, environ 56 jours, au-delà de six semaines ; une commande Data Box Disk (environ 35 To) suffit.
      options:
        b: { en: "8 TB at 500 Mbps take 1.28 × 10^5 seconds, about a day and a half: the network copy finishes well within five days.", fr: "8 To à 500 Mbit/s demandent 1,28 × 10^5 secondes, environ un jour et demi : la copie réseau se termine largement en cinq jours." }
        c: { en: "Despite its volume, 150 TB at 1 Gbps take 1.2 × 10^6 seconds, about 14 days: the network copy finishes within three weeks.", fr: "Malgré son volume, 150 To à 1 Gbit/s demandent 1,2 × 10^6 secondes, environ 14 jours : la copie réseau se termine en moins de trois semaines." }
        e: { en: "30 TB at 1 Gbps take 2.4 × 10^5 seconds, under three days: the network copy finishes within one week.", fr: "30 To à 1 Gbit/s demandent 2,4 × 10^5 secondes, moins de trois jours : la copie réseau se termine en moins d'une semaine." }
    references:
      - title: Microsoft Azure Data Box overview
        url: https://learn.microsoft.com/en-us/azure/databox/data-box-overview
      - title: Microsoft Azure Data Box Disk overview
        url: https://learn.microsoft.com/en-us/azure/databox/data-box-disk-overview
