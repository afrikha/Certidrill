chapter: 12-authentication-authorization
questions:
  # ------------------------------------------------------------------ 1
  - id: az305-qz-12-01
    objective: "1.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has a Microsoft Entra workforce tenant. About 300 employees of supplier companies must use a procurement web app that is registered in the Contoso tenant. Some suppliers use Microsoft Entra ID, others use Google accounts.

        Contoso must be able to assign the suppliers to the app and apply its own Conditional Access policies to them, and the suppliers must sign in with their own credentials.

        What should you recommend?
      fr: |
        Contoso dispose d'un locataire de personnel Microsoft Entra. Environ 300 employés d'entreprises fournisseurs doivent utiliser une application web d'achats inscrite dans le locataire Contoso. Certains fournisseurs utilisent Microsoft Entra ID, d'autres des comptes Google.

        Contoso doit pouvoir attribuer les fournisseurs à l'application et leur appliquer ses propres stratégies d'accès conditionnel, et les fournisseurs doivent se connecter avec leurs propres informations d'identification.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "B2B direct connect", fr: "La connexion directe B2B" } }
        - { id: b, text: { en: "Cross-tenant synchronization", fr: "La synchronisation interlocataire" } }
        - { id: c, text: { en: "B2B collaboration", fr: "La collaboration B2B" } }
        - { id: d, text: { en: "Microsoft Entra External ID in an external tenant", fr: "Microsoft Entra External ID dans un locataire externe" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          B2B collaboration represents each partner as a guest user object in the Contoso tenant, so the suppliers can be assigned to the app and targeted by its Conditional Access policies. The guests sign in with their own work, school or social identity, Google included, and Contoso manages no password for them.
        fr: |
          La collaboration B2B représente chaque partenaire par un objet utilisateur invité dans le locataire Contoso ; les fournisseurs peuvent ainsi être attribués à l'application et ciblés par ses stratégies d'accès conditionnel. Les invités se connectent avec leur propre identité professionnelle, scolaire ou sociale, Google compris, et Contoso ne gère aucun mot de passe pour eux.
      options:
        a: { en: "B2B direct connect serves Microsoft Teams shared channels between two Microsoft Entra organizations that trust each other; it doesn't cover Google users or a custom app.", fr: "La connexion directe B2B sert aux canaux partagés Microsoft Teams entre deux organisations Microsoft Entra qui s'approuvent mutuellement ; elle ne couvre ni les utilisateurs Google ni une application personnalisée." }
        b: { en: "Cross-tenant synchronization is for the employees of one organization spread over several of its own tenants, not for independent suppliers.", fr: "La synchronisation interlocataire s'adresse aux employés d'une même organisation répartis sur plusieurs de ses propres locataires, pas à des fournisseurs indépendants." }
        d: { en: "An external tenant holds the consumers and business customers of an app that you publish, apart from the workforce tenant where this app and its policies are.", fr: "Un locataire externe contient les consommateurs et les clients professionnels d'une application que vous publiez, à part du locataire de personnel où se trouvent cette application et ses stratégies." }
    references:
      - title: What is Microsoft Entra B2B collaboration? - Microsoft Entra External ID
        url: https://learn.microsoft.com/en-us/entra/external-id/what-is-b2b

  # ------------------------------------------------------------------ 2
  - id: az305-qz-12-02
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has 25 Conditional Access policies. Tomorrow, a user named **User1** will sign in to Exchange Online from an iOS device outside the trusted locations of the company.

        Today, a help desk engineer must find out which policies will apply to this sign-in and which grant controls they will require, without User1 signing in.

        What should the engineer use?
      fr: |
        Fabrikam dispose de 25 stratégies d'accès conditionnel. Demain, un utilisateur nommé **User1** se connectera à Exchange Online depuis un appareil iOS situé hors des emplacements approuvés de l'entreprise.

        Aujourd'hui, un ingénieur du support doit déterminer quelles stratégies s'appliqueront à cette connexion et quels contrôles d'octroi elles exigeront, sans que User1 se connecte.

        Qu'est-ce que l'ingénieur doit utiliser ?
    body:
      options:
        - { id: a, text: { en: "The report-only mode of the policies", fr: "Le mode rapport seul des stratégies" } }
        - { id: b, text: { en: "The What If tool of Conditional Access", fr: "L'outil What If de l'accès conditionnel" } }
        - { id: c, text: { en: "The sign-in logs of User1", fr: "Les journaux de connexion de User1" } }
        - { id: d, text: { en: "The risky sign-ins report of ID Protection", fr: "Le rapport des connexions risquées d'ID Protection" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The What If tool simulates a sign-in from the conditions that you enter (user, application, location, device platform and others) and lists the policies that would apply, with their controls, and the policies that wouldn't apply with the reason. No real sign-in is needed, and enabled policies as well as report-only policies are evaluated.
        fr: |
          L'outil What If simule une connexion à partir des conditions que vous saisissez (utilisateur, application, emplacement, plateforme de l'appareil, etc.) et liste les stratégies qui s'appliqueraient, avec leurs contrôles, ainsi que celles qui ne s'appliqueraient pas, avec la raison. Aucune connexion réelle n'est nécessaire, et les stratégies activées comme celles en mode rapport seul sont évaluées.
      options:
        a: { en: "Report-only mode records the result of a policy on real sign-ins; it says nothing until User1 actually signs in.", fr: "Le mode rapport seul enregistre le résultat d'une stratégie sur des connexions réelles ; il n'indique rien tant que User1 ne s'est pas réellement connecté." }
        c: { en: "Sign-in logs describe sign-ins that already happened, not a sign-in from new conditions.", fr: "Les journaux de connexion décrivent des connexions déjà effectuées, pas une connexion dans de nouvelles conditions." }
        d: { en: "The risky sign-ins report lists sign-ins that Microsoft Entra ID Protection detected as risky; it doesn't evaluate Conditional Access policies.", fr: "Le rapport des connexions risquées liste les connexions que Microsoft Entra ID Protection a détectées comme risquées ; il n'évalue pas les stratégies d'accès conditionnel." }
    references:
      - title: The Conditional Access What If tool - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/what-if-tool

  # ------------------------------------------------------------------ 3
  - id: az305-qz-12-03
    objective: "1.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware has a key vault named **kv-app1** that is used by virtual machines in a virtual network named **VNet1**. VNet1 is connected to the datacenter through ExpressRoute private peering, and servers of the datacenter also read secrets from kv-app1.

        You need to recommend a network design that meets the following requirements:

        - The traffic from VNet1 and from the datacenter reaches kv-app1 on a private IP address of VNet1.
        - kv-app1 rejects every connection from the internet.

        What should you recommend?
      fr: |
        Proseware dispose d'un coffre de clés nommé **kv-app1** utilisé par des machines virtuelles d'un réseau virtuel nommé **VNet1**. VNet1 est connecté au centre de données par le peering privé ExpressRoute, et des serveurs du centre de données lisent aussi des secrets dans kv-app1.

        Vous devez recommander une conception réseau qui répond aux exigences suivantes :

        - Le trafic provenant de VNet1 et du centre de données atteint kv-app1 sur une adresse IP privée de VNet1.
        - kv-app1 rejette toute connexion provenant d'Internet.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "A Key Vault service endpoint on the subnets of VNet1, and a vault firewall that allows only these subnets", fr: "Un point de terminaison de service Key Vault sur les sous-réseaux de VNet1, et un pare-feu du coffre qui n'autorise que ces sous-réseaux" } }
        - { id: b, text: { en: "A firewall IP rule on the vault that allows the private address range of VNet1 and of the datacenter", fr: "Une règle IP du pare-feu du coffre qui autorise la plage d'adresses privées de VNet1 et du centre de données" } }
        - { id: c, text: { en: "A private endpoint for kv-app1 in VNet1, and public network access disabled on the vault", fr: "Un point de terminaison privé pour kv-app1 dans VNet1, et l'accès au réseau public désactivé sur le coffre" } }
        - { id: d, text: { en: "A network security group rule on VNet1 that allows outbound traffic to the AzureKeyVault service tag", fr: "Une règle de groupe de sécurité réseau sur VNet1 qui autorise le trafic sortant vers la balise de service AzureKeyVault" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A private endpoint gives the vault a private IP address taken from VNet1, and the traffic stays on the Microsoft network; the datacenter reaches the same address through ExpressRoute private peering, with DNS resolving the vault name to it. Disabling public network access then denies every public connection and leaves only the private endpoints.
        fr: |
          Un point de terminaison privé donne au coffre une adresse IP privée prise dans VNet1, et le trafic reste sur le réseau Microsoft ; le centre de données atteint la même adresse par le peering privé ExpressRoute, le DNS résolvant le nom du coffre vers elle. La désactivation de l'accès au réseau public refuse ensuite toute connexion publique et ne laisse que les points de terminaison privés.
      options:
        a: { en: "With a service endpoint, the vault keeps its public address as the destination, and the datacenter servers aren't in an allowed subnet.", fr: "Avec un point de terminaison de service, le coffre garde son adresse publique comme destination, et les serveurs du centre de données ne sont pas dans un sous-réseau autorisé." }
        b: { en: "IP rules of the Key Vault firewall accept only public IP addresses; private ranges can't be listed, and the traffic would still go to the public endpoint.", fr: "Les règles IP du pare-feu Key Vault n'acceptent que des adresses IP publiques ; les plages privées ne peuvent pas y figurer, et le trafic irait toujours vers le point de terminaison public." }
        d: { en: "An outbound NSG rule only lets the virtual machines reach the public endpoints of Key Vault; it neither creates a private address nor blocks the internet.", fr: "Une règle NSG sortante permet seulement aux machines virtuelles d'atteindre les points de terminaison publics de Key Vault ; elle ne crée pas d'adresse privée et ne bloque pas Internet." }
    references:
      - title: Integrate Key Vault with Azure Private Link
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/private-link-service
      - title: Configure network security for Azure Key Vault
        url: https://learn.microsoft.com/en-us/azure/key-vault/general/network-security

  # ------------------------------------------------------------------ 4
  - id: az305-qz-12-04
    objective: "1.2.4"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum has a datacenter that hosts an intranet web app using Integrated Windows Authentication, SMB file shares, and Active Directory Domain Services (AD DS) domain controllers that run Windows Server 2022. Private network connectors are installed in the datacenter to publish the intranet app through Microsoft Entra application proxy.

        The employees use Microsoft Entra joined Windows 11 laptops and sign in with Windows Hello for Business. Adatum is designing access to the file shares for remote employees.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un centre de données qui héberge une application web intranet utilisant l'authentification Windows intégrée, des partages de fichiers SMB et des contrôleurs de domaine Active Directory Domain Services (AD DS) sous Windows Server 2022. Des connecteurs de réseau privé sont installés dans le centre de données pour publier l'application intranet par le proxy d'application Microsoft Entra.

        Les employés utilisent des ordinateurs portables Windows 11 joints à Microsoft Entra et se connectent avec Windows Hello Entreprise. Adatum conçoit l'accès aux partages de fichiers pour les employés distants.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Microsoft Entra application proxy can publish the SMB file shares to the remote employees.", fr: "Le proxy d'application Microsoft Entra peut publier les partages de fichiers SMB pour les employés distants." }
        - id: s2
          text: { en: "Microsoft Entra Private Access can use the private network connectors that are already installed for application proxy.", fr: "Microsoft Entra Private Access peut utiliser les connecteurs de réseau privé déjà installés pour le proxy d'application." }
        - id: s3
          text: { en: "With Microsoft Entra Kerberos, access to the file shares remains authorized by the AD DS domain controllers and the AD DS groups.", fr: "Avec Microsoft Entra Kerberos, l'accès aux partages de fichiers reste autorisé par les contrôleurs de domaine AD DS et les groupes AD DS." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Private network connectors make both Microsoft Entra Private Access and application proxy possible: the same outbound-only agents broker the traffic of either service, so Private Access can give remote access to the file shares. Microsoft Entra Kerberos issues a partial ticket-granting ticket that carries no authorization data; the on-premises domain controller exchanges it for a full ticket, so authorization stays in AD DS.
        fr: |
          Les connecteurs de réseau privé servent à la fois à Microsoft Entra Private Access et au proxy d'application : les mêmes agents, qui n'établissent que des connexions sortantes, relaient le trafic de l'un ou l'autre service ; Private Access peut donc donner l'accès distant aux partages de fichiers. Microsoft Entra Kerberos émet un ticket TGT partiel sans données d'autorisation ; le contrôleur de domaine local l'échange contre un ticket complet, et l'autorisation reste donc dans AD DS.
      options:
        s1: { en: "Application proxy publishes web applications; it doesn't provide network access to SMB shares, which is the role of Private Access or a VPN.", fr: "Le proxy d'application publie des applications web ; il ne donne pas d'accès réseau aux partages SMB, ce qui est le rôle de Private Access ou d'un VPN." }
    references:
      - title: Microsoft Entra private network connectors - Global Secure Access
        url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-connectors
      - title: Passwordless security key sign-in to on-premises resources - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-authentication-passwordless-security-key-on-premises

  # ------------------------------------------------------------------ 5
  - id: az305-qz-12-05
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has a management group named **MG1** that contains a subscription named **Sub1**. The current configuration is the following:

        - An Azure Policy assignment on MG1 uses the deny effect to allow only the West Europe and North Europe regions.
        - A user named **User1** holds the Owner role on Sub1 and no other role.
        - A group named **Auditors** holds the Reader role on MG1.

        Next month, a subscription named **Sub2** will be moved into MG1.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un groupe d'administration nommé **MG1** qui contient un abonnement nommé **Sub1**. La configuration actuelle est la suivante :

        - Une attribution Azure Policy sur MG1 utilise l'effet deny pour n'autoriser que les régions Europe Ouest et Europe Nord.
        - Un utilisateur nommé **User1** détient le rôle Owner sur Sub1 et aucun autre rôle.
        - Un groupe nommé **Auditors** détient le rôle Reader sur MG1.

        Le mois prochain, un abonnement nommé **Sub2** sera déplacé dans MG1.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "With the current configuration, User1 can create a virtual machine in the East US region in Sub1.", fr: "Avec la configuration actuelle, User1 peut créer une machine virtuelle dans la région USA Est dans Sub1." }
        - id: s2
          text: { en: "User1 can read the blobs of a storage account of Sub1 by using Microsoft Entra authorization.", fr: "User1 peut lire les objets blob d'un compte de stockage de Sub1 en utilisant l'autorisation Microsoft Entra." }
        - id: s3
          text: { en: "Once Sub2 is in MG1, the members of Auditors can view the resources of Sub2 without any new role assignment.", fr: "Une fois Sub2 dans MG1, les membres d'Auditors peuvent consulter les ressources de Sub2 sans nouvelle attribution de rôle." }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Azure Policy evaluates the resulting resource whoever makes the request: a non-compliant creation is denied even for an Owner. Role assignments are inherited by every scope below the assignment, so a subscription moved into MG1 inherits the Reader assignment of Auditors.
        fr: |
          Azure Policy évalue la ressource obtenue quel que soit l'auteur de la demande : une création non conforme est refusée même pour un Owner. Les attributions de rôles sont héritées par toutes les étendues situées sous l'attribution ; un abonnement déplacé dans MG1 hérite donc de l'attribution Reader d'Auditors.
      options:
        s1: { en: "The deny assignment inherited from MG1 blocks the creation in East US, whatever the role of User1.", fr: "L'attribution deny héritée de MG1 bloque la création dans USA Est, quel que soit le rôle de User1." }
        s2: { en: "Owner is a control plane role: it lets User1 manage the storage account but grants no blob data access through Microsoft Entra ID, which needs a data role such as Storage Blob Data Reader.", fr: "Owner est un rôle du plan de contrôle : il permet à User1 de gérer le compte de stockage mais n'accorde aucun accès aux données blob par Microsoft Entra ID, qui exige un rôle de données comme Storage Blob Data Reader." }
    references:
      - title: Overview of Azure Policy - Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
      - title: Authorize access to blobs using Microsoft Entra ID - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-access-azure-active-directory

  # ------------------------------------------------------------------ 6
  - id: az305-qz-12-06
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank synchronizes its on-premises Active Directory Domain Services (AD DS) domain to Microsoft Entra ID with Microsoft Entra Connect Sync. The design is the following:

        - Pass-through authentication is the sign-in method, with three authentication agents in the single datacenter.
        - Password hash synchronization is also enabled.
        - Seamless single sign-on (Seamless SSO) is enabled.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank synchronise son domaine Active Directory Domain Services (AD DS) local vers Microsoft Entra ID avec Microsoft Entra Connect Sync. La conception est la suivante :

        - L'authentification directe est la méthode de connexion, avec trois agents d'authentification dans l'unique centre de données.
        - La synchronisation de hachage du mot de passe est aussi activée.
        - L'authentification unique transparente (Seamless SSO) est activée.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "If the datacenter becomes unreachable, cloud sign-ins are validated against the synchronized password hashes without any administrative action.", fr: "Si le centre de données devient injoignable, les connexions cloud sont validées par rapport aux hachages de mots de passe synchronisés sans aucune action d'administration." }
        - id: s2
          text: { en: "A user whose account was disabled in AD DS a minute ago is refused at the next Microsoft Entra sign-in, before the next synchronization cycle.", fr: "Un utilisateur dont le compte a été désactivé dans AD DS il y a une minute est refusé à la connexion Microsoft Entra suivante, avant le prochain cycle de synchronisation." }
        - id: s3
          text: { en: "On domain-joined computers inside the corporate network, users can open cloud apps without typing their password again.", fr: "Sur les ordinateurs joints au domaine, à l'intérieur du réseau de l'entreprise, les utilisateurs peuvent ouvrir des applications cloud sans saisir de nouveau leur mot de passe." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          With pass-through authentication, the agents validate each password against the domain controllers, so AD DS account states such as a disabled account apply at once, without waiting for synchronization. Seamless SSO works with pass-through authentication as with password hash synchronization, for domain-joined devices on the corporate network. Password hash synchronization is only a backup: switching the sign-in method to it is a manual change.
        fr: |
          Avec l'authentification directe, les agents valident chaque mot de passe auprès des contrôleurs de domaine ; les états de compte AD DS, comme un compte désactivé, s'appliquent donc aussitôt, sans attendre la synchronisation. L'authentification unique transparente fonctionne avec l'authentification directe comme avec la synchronisation de hachage du mot de passe, pour les appareils joints au domaine sur le réseau de l'entreprise. La synchronisation de hachage du mot de passe n'est qu'une solution de secours : basculer la méthode de connexion vers elle est une modification manuelle.
      options:
        s1: { en: "Failover from pass-through authentication to password hash synchronization doesn't happen automatically: an administrator must switch the sign-in method.", fr: "Le basculement de l'authentification directe vers la synchronisation de hachage du mot de passe n'est pas automatique : un administrateur doit changer de méthode de connexion." }
    references:
      - title: Authentication for Microsoft Entra hybrid identity solutions - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn

  # ------------------------------------------------------------------ 7
  - id: az305-qz-12-07
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an on-premises Active Directory Domain Services (AD DS) forest. Microsoft Entra Connect Sync synchronizes the users to Microsoft Entra ID, and the domain is federated with Active Directory Federation Services (AD FS), because a third-party multifactor authentication provider is integrated with AD FS. Password hash synchronization isn't enabled.

        Fabrikam deploys a Microsoft Entra Domain Services managed domain for a legacy application that moves to Azure virtual machines. You need to recommend a solution that meets the following requirements:

        - The users sign in to the application with their usual AD DS user name and password.
        - Authentication to the managed domain keeps working when the site-to-site VPN to the datacenter is down.
        - Sign-in to cloud applications keeps using AD FS.
        - The infrastructure to deploy is minimized.

        What should you recommend?
      fr: |
        Fabrikam dispose d'une forêt Active Directory Domain Services (AD DS) locale. Microsoft Entra Connect Sync synchronise les utilisateurs vers Microsoft Entra ID, et le domaine est fédéré avec Active Directory Federation Services (AD FS), car un fournisseur d'authentification multifacteur tiers est intégré à AD FS. La synchronisation de hachage du mot de passe n'est pas activée.

        Fabrikam déploie un domaine managé Microsoft Entra Domain Services pour une application ancienne qui passe sur des machines virtuelles Azure. Vous devez recommander une solution qui répond aux exigences suivantes :

        - Les utilisateurs se connectent à l'application avec leur nom d'utilisateur et leur mot de passe AD DS habituels.
        - L'authentification auprès du domaine managé continue de fonctionner quand le VPN site à site vers le centre de données est coupé.
        - La connexion aux applications cloud continue d'utiliser AD FS.
        - L'infrastructure à déployer est réduite au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Replace federation with pass-through authentication as the sign-in method.", fr: "Remplacer la fédération par l'authentification directe comme méthode de connexion." } }
        - { id: b, text: { en: "Create a forest trust between the managed domain and the on-premises forest.", fr: "Créer une approbation de forêt entre le domaine managé et la forêt locale." } }
        - { id: c, text: { en: "Enable password hash synchronization in Entra Connect, and keep federation.", fr: "Activer la synchronisation de hachage du mot de passe dans Entra Connect et conserver la fédération." } }
        - { id: d, text: { en: "Register the managed domain as a relying party trust in the AD FS farm.", fr: "Inscrire le domaine managé comme approbation de partie de confiance dans la batterie AD FS." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Domain Services validates Kerberos and NTLM with the legacy password hashes that Microsoft Entra Connect synchronizes only when password hash synchronization is enabled; users who authenticate only through AD FS have no usable hash. Enabling it gives the managed domain these hashes, so authentication happens in Azure without the datacenter. Password hash synchronization can run while the sign-in method of the cloud applications stays federation.
        fr: |
          Domain Services valide Kerberos et NTLM avec les hachages de mots de passe hérités que Microsoft Entra Connect ne synchronise que si la synchronisation de hachage du mot de passe est activée ; les utilisateurs qui ne s'authentifient que par AD FS n'ont aucun hachage utilisable. L'activer donne ces hachages au domaine managé, et l'authentification se fait alors dans Azure sans le centre de données. La synchronisation de hachage du mot de passe peut fonctionner alors que la méthode de connexion des applications cloud reste la fédération.
      options:
        a: { en: "Pass-through authentication validates passwords on-premises and synchronizes no hash, and it would stop the use of AD FS that the cloud sign-in must keep.", fr: "L'authentification directe valide les mots de passe en local et ne synchronise aucun hachage, et elle mettrait fin à l'utilisation d'AD FS que la connexion cloud doit conserver." }
        b: { en: "Through a forest trust, the on-premises domain controllers authenticate the users, which fails when the VPN to the datacenter is down.", fr: "Avec une approbation de forêt, ce sont les contrôleurs de domaine locaux qui authentifient les utilisateurs, ce qui échoue quand le VPN vers le centre de données est coupé." }
        d: { en: "A managed domain authenticates with Kerberos and NTLM against its own domain controllers; it doesn't accept AD FS tokens.", fr: "Un domaine managé authentifie avec Kerberos et NTLM auprès de ses propres contrôleurs de domaine ; il n'accepte pas de jetons AD FS." }
    references:
      - title: Enable password hash sync for Microsoft Entra Domain Services - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/domain-services/tutorial-configure-password-hash-sync

  # ------------------------------------------------------------------ 8
  - id: az305-qz-12-08
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys synchronizes its on-premises Active Directory Domain Services (AD DS) domain to Microsoft Entra ID with Microsoft Entra Connect Sync. Warehouse operators use shared terminals and know only their DOMAIN\username sign-in name.

        You need to recommend an authentication design for cloud applications that meets the following requirements:

        - The operators sign in to the cloud applications by entering their sAMAccountName in the DOMAIN\username format.
        - If the on-premises servers that validate the sign-ins become unavailable, the administrators can restore cloud sign-ins by changing the sign-in method, without any password reset.

        What should you recommend?
      fr: |
        Tailspin Toys synchronise son domaine Active Directory Domain Services (AD DS) local vers Microsoft Entra ID avec Microsoft Entra Connect Sync. Les opérateurs de l'entrepôt utilisent des terminaux partagés et ne connaissent que leur nom de connexion DOMAINE\utilisateur.

        Vous devez recommander une conception de l'authentification aux applications cloud qui répond aux exigences suivantes :

        - Les opérateurs se connectent aux applications cloud en saisissant leur sAMAccountName au format DOMAINE\utilisateur.
        - Si les serveurs locaux qui valident les connexions deviennent indisponibles, les administrateurs peuvent rétablir les connexions cloud en changeant de méthode de connexion, sans aucune réinitialisation de mot de passe.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Pass-through authentication, with password hash synchronization also enabled", fr: "L'authentification directe, avec la synchronisation de hachage du mot de passe également activée" } }
        - { id: b, text: { en: "Password hash synchronization, with Seamless single sign-on also enabled", fr: "La synchronisation de hachage du mot de passe, avec l'authentification unique transparente également activée" } }
        - { id: c, text: { en: "Federation with AD FS, with Seamless single sign-on also enabled", fr: "La fédération avec AD FS, avec l'authentification unique transparente également activée" } }
        - { id: d, text: { en: "Federation with AD FS, with password hash synchronization also enabled", fr: "La fédération avec AD FS, avec la synchronisation de hachage du mot de passe également activée" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Signing in with a sAMAccountName instead of a user principal name is a requirement that Microsoft Entra ID doesn't support natively, so a federated identity provider such as AD FS is required. Password hash synchronization deployed alongside federation is the backup method: because the hashes are already synchronized before the failure, the administrators can switch the sign-in method to it, and users keep their passwords.
        fr: |
          Se connecter avec un sAMAccountName au lieu d'un nom d'utilisateur principal est une exigence que Microsoft Entra ID ne prend pas en charge nativement ; un fournisseur d'identité fédéré comme AD FS est donc nécessaire. La synchronisation de hachage du mot de passe déployée à côté de la fédération est la méthode de secours : comme les hachages sont déjà synchronisés avant la panne, les administrateurs peuvent basculer la méthode de connexion vers elle, et les utilisateurs conservent leurs mots de passe.
      options:
        a: { en: "With pass-through authentication, users sign in to Microsoft Entra ID with their user principal name; the DOMAIN\\username format needs federation.", fr: "Avec l'authentification directe, les utilisateurs se connectent à Microsoft Entra ID avec leur nom d'utilisateur principal ; le format DOMAINE\\utilisateur exige la fédération." }
        b: { en: "Password hash synchronization validates the user principal name in the cloud; it doesn't accept a sAMAccountName sign-in.", fr: "La synchronisation de hachage du mot de passe valide le nom d'utilisateur principal dans le cloud ; elle n'accepte pas de connexion par sAMAccountName." }
        c: { en: "Seamless single sign-on works with password hash synchronization or pass-through authentication, not as a backup of federation; without synchronized hashes, no other sign-in method is ready.", fr: "L'authentification unique transparente fonctionne avec la synchronisation de hachage du mot de passe ou l'authentification directe, pas comme secours de la fédération ; sans hachages synchronisés, aucune autre méthode de connexion n'est prête." }
    references:
      - title: Authentication for Microsoft Entra hybrid identity solutions - Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn

  # ------------------------------------------------------------------ 9
  - id: az305-qz-12-09
    objective: "1.2.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders runs a web app named **App1** on Azure App Service. A third-party component of App1 accepts only a connection string that contains an access key of a storage account named **stdocs1**; it can't use Microsoft Entra authentication. The connection string is a secret of a key vault named **kv1**, and an app setting of App1 reads it through a Key Vault reference with the managed identity of App1.

        The security policy requires an automated rotation of the access key every 30 days. You need to recommend a rotation design that meets the following requirements:

        - No request of App1 may fail because of a rotation.
        - The app settings of App1 must not change at each rotation.
        - The code of App1 must not change.

        What should you recommend?
      fr: |
        Northwind Traders exploite une application web nommée **App1** sur Azure App Service. Un composant tiers d'App1 n'accepte qu'une chaîne de connexion qui contient une clé d'accès d'un compte de stockage nommé **stdocs1** ; il ne peut pas utiliser l'authentification Microsoft Entra. La chaîne de connexion est un secret d'un coffre de clés nommé **kv1**, et un paramètre d'application d'App1 la lit par une référence Key Vault avec l'identité managée d'App1.

        La politique de sécurité exige une rotation automatisée de la clé d'accès tous les 30 jours. Vous devez recommander une conception de la rotation qui répond aux exigences suivantes :

        - Aucune requête d'App1 ne doit échouer à cause d'une rotation.
        - Les paramètres d'application d'App1 ne doivent pas changer à chaque rotation.
        - Le code d'App1 ne doit pas changer.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Keep a reference without version. At each rotation, regenerate key1 and store its connection string as a new version of the secret.", fr: "Garder une référence sans version. À chaque rotation, régénérer key1 et stocker sa chaîne de connexion comme nouvelle version du secret." } }
        - { id: b, text: { en: "Keep a reference without version. At each rotation, regenerate the key that the latest version doesn't use and store it as a new version.", fr: "Garder une référence sans version. À chaque rotation, régénérer la clé que la dernière version n'utilise pas et la stocker comme nouvelle version." } }
        - { id: c, text: { en: "Use a reference with a version. At each rotation, regenerate key1, store a new version, and point the reference to that version.", fr: "Utiliser une référence avec version. À chaque rotation, régénérer key1, stocker une nouvelle version et faire pointer la référence vers cette version." } }
        - { id: d, text: { en: "Remove the reference. At each rotation, regenerate key1 and write the new connection string directly into the app setting.", fr: "Supprimer la référence. À chaque rotation, régénérer key1 et écrire la nouvelle chaîne de connexion directement dans le paramètre d'application." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A Key Vault reference without version picks up the latest version of the secret, but App Service caches the value and can take up to 24 hours to use a new version. With two sets of credentials used alternately, the rotation regenerates only the key that the app isn't using, so the key in the cached value stays valid for a whole rotation cycle. No app setting changes, which also avoids the restart that a configuration change causes.
        fr: |
          Une référence Key Vault sans version récupère la dernière version du secret, mais App Service met la valeur en cache et peut mettre jusqu'à 24 heures pour utiliser une nouvelle version. Avec deux jeux d'informations d'identification utilisés en alternance, la rotation ne régénère que la clé que l'application n'utilise pas ; la clé de la valeur en cache reste ainsi valide pendant tout un cycle de rotation. Aucun paramètre d'application ne change, ce qui évite aussi le redémarrage que provoque une modification de configuration.
      options:
        a: { en: "Regenerating the key in use invalidates it at once, while App1 can keep the old cached value for up to 24 hours: requests fail in the meantime.", fr: "Régénérer la clé en cours d'utilisation l'invalide aussitôt, alors qu'App1 peut garder l'ancienne valeur en cache jusqu'à 24 heures : des requêtes échouent entre-temps." }
        c: { en: "Pointing the reference to a new version changes the app setting at each rotation, and the requests fail between the regeneration and the update.", fr: "Faire pointer la référence vers une nouvelle version modifie le paramètre d'application à chaque rotation, et des requêtes échouent entre la régénération et la mise à jour." }
        d: { en: "The secret leaves Key Vault, the app setting changes at each rotation, and requests fail until the setting is updated.", fr: "Le secret quitte Key Vault, le paramètre d'application change à chaque rotation, et des requêtes échouent jusqu'à la mise à jour du paramètre." }
    references:
      - title: Use Key Vault references as app settings - Azure App Service
        url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
      - title: Rotation tutorial for resources with two sets of credentials
        url: https://learn.microsoft.com/en-us/azure/key-vault/secrets/tutorial-rotation-dual

  # ------------------------------------------------------------------ 10
  - id: az305-qz-12-10
    objective: "1.2.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank is designing the key and secret management of a new banking platform in Azure. You need to recommend a design that meets the following requirements:

        - The customer-managed keys that encrypt the Azure Storage accounts and Azure SQL databases are held in a single-tenant HSM. The administrators of the subscriptions and management groups can't give themselves access to the keys.
        - The platform also needs connection strings, API keys and TLS certificates that renew automatically through DigiCert. No HSM requirement applies to these objects.
        - Costs are minimized.

        What should you include in the recommendation? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank conçoit la gestion des clés et des secrets d'une nouvelle plateforme bancaire dans Azure. Vous devez recommander une conception qui répond aux exigences suivantes :

        - Les clés gérées par le client qui chiffrent les comptes Stockage Azure et les bases de données Azure SQL sont conservées dans un HSM à locataire unique. Les administrateurs des abonnements et des groupes d'administration ne peuvent pas s'accorder l'accès aux clés.
        - La plateforme a aussi besoin de chaînes de connexion, de clés d'API et de certificats TLS qui se renouvellent automatiquement via DigiCert. Aucune exigence de HSM ne s'applique à ces objets.
        - Les coûts sont réduits au minimum.

        Que devez-vous inclure dans la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Service that holds the customer-managed keys: [[keys]]

          Service that holds the secrets and the certificates: [[sec]]

          Setting that the key service must have before Azure Storage can use its keys: [[prot]]
        fr: |
          Service qui conserve les clés gérées par le client : [[keys]]

          Service qui conserve les secrets et les certificats : [[sec]]

          Paramètre que le service des clés doit avoir avant que Stockage Azure puisse utiliser ses clés : [[prot]]
      slots:
        - id: keys
          options:
            - { id: kprem, text: { en: "Azure Key Vault Premium", fr: "Azure Key Vault Premium" } }
            - { id: kmhsm, text: { en: "Azure Key Vault Managed HSM", fr: "HSM managé Azure Key Vault" } }
            - { id: kcloud, text: Azure Cloud HSM }
            - { id: kpay, text: Azure Payment HSM }
        - id: sec
          options:
            - { id: sstd, text: { en: "Azure Key Vault Standard", fr: "Azure Key Vault Standard" } }
            - { id: sprem, text: { en: "Azure Key Vault Premium", fr: "Azure Key Vault Premium" } }
            - { id: smhsm, text: { en: "Azure Key Vault Managed HSM", fr: "HSM managé Azure Key Vault" } }
            - { id: scloud, text: Azure Cloud HSM }
        - id: prot
          options:
            - { id: purge, text: { en: "Purge protection enabled", fr: "Protection contre la suppression définitive activée" } }
            - { id: nopublic, text: { en: "Public network access disabled", fr: "Accès au réseau public désactivé" } }
            - { id: rotation, text: { en: "A key rotation policy", fr: "Une stratégie de rotation des clés" } }
            - { id: policies, text: { en: "The access policy permission model", fr: "Le modèle d'autorisation par stratégies d'accès" } }
    answer:
      values: { keys: kmhsm, sec: sstd, prot: purge }
    explanation:
      correct:
        en: |
          Managed HSM is single-tenant, its security domain belongs to the customer, and subscription or management group administrators can't override its access control; it integrates with Azure Storage and Azure SQL for customer-managed keys. It stores keys only, so the secrets and certificates go to a Key Vault vault, and Standard is enough because no HSM requirement applies to them. Azure Storage requires soft delete and purge protection on the key vault or managed HSM that holds its keys; soft delete is already on, purge protection must be enabled.
        fr: |
          Le HSM managé est à locataire unique, son domaine de sécurité appartient au client, et les administrateurs des abonnements ou des groupes d'administration ne peuvent pas passer outre son contrôle d'accès ; il s'intègre à Stockage Azure et à Azure SQL pour les clés gérées par le client. Il ne stocke que des clés ; les secrets et les certificats vont donc dans un coffre Key Vault, et le niveau Standard suffit puisqu'aucune exigence de HSM ne s'applique à eux. Stockage Azure exige la suppression réversible et la protection contre la suppression définitive sur le coffre de clés ou le HSM managé qui conserve ses clés ; la suppression réversible est déjà active, la protection contre la suppression définitive doit être activée.
      options:
        kprem: { en: "Key Vault Premium protects keys in HSMs but is a multitenant service, which doesn't meet the single-tenant requirement.", fr: "Key Vault Premium protège les clés dans des HSM, mais c'est un service multilocataire, ce qui ne répond pas à l'exigence de locataire unique." }
        kcloud: { en: "Azure Cloud HSM is single-tenant but doesn't integrate with Azure platform services such as Azure Storage and Azure SQL.", fr: "Azure Cloud HSM est à locataire unique, mais ne s'intègre pas aux services de plateforme Azure comme Stockage Azure et Azure SQL." }
        kpay: { en: "Azure Payment HSM serves payment PIN processing, not customer-managed keys of Azure services.", fr: "Azure Payment HSM sert au traitement des codes PIN de paiement, pas aux clés gérées par le client des services Azure." }
        sprem: { en: "Premium stores secrets and certificates too, but costs more than Standard while no HSM requirement applies to them.", fr: "Premium stocke aussi les secrets et les certificats, mais coûte plus cher que Standard alors qu'aucune exigence de HSM ne s'applique à eux." }
        smhsm: { en: "Managed HSM stores cryptographic keys only, not secrets or certificates.", fr: "Le HSM managé ne stocke que des clés de chiffrement, ni secrets ni certificats." }
        scloud: { en: "Azure Cloud HSM doesn't store secrets, and it doesn't renew certificates with an integrated certificate authority.", fr: "Azure Cloud HSM ne stocke pas de secrets et ne renouvelle pas de certificats avec une autorité de certification intégrée." }
        nopublic: { en: "Disabling public access hardens the network, but Azure Storage doesn't require it to use customer-managed keys.", fr: "Désactiver l'accès public renforce le réseau, mais Stockage Azure ne l'exige pas pour utiliser des clés gérées par le client." }
        rotation: { en: "A rotation policy creates new key versions; it is useful but isn't a prerequisite of customer-managed keys.", fr: "Une stratégie de rotation crée de nouvelles versions de clés ; elle est utile, mais n'est pas un prérequis des clés gérées par le client." }
        policies: { en: "Access policies are the legacy permission model of Key Vault vaults, not a requirement of Azure Storage.", fr: "Les stratégies d'accès sont l'ancien modèle d'autorisation des coffres Key Vault, pas une exigence de Stockage Azure." }
    references:
      - title: How to choose the right Azure key management solution
        url: https://learn.microsoft.com/en-us/azure/security/fundamentals/key-management-choose
      - title: Customer-managed keys for Azure Storage encryption - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview
