chapter: 31-backup-disaster-recovery
questions:
  # ------------------------------------------------------------------ 1
  - id: az305-qz-31-01
    objective: "3.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The business owner of an ordering application at Wingtip Toys states the following continuity requirement: "After an incident, we can accept losing at most the orders of the last 30 minutes, and the application must be back online within four hours."

        Which recovery objectives does this requirement define?
      fr: |
        Le responsable métier d'une application de commandes chez Wingtip Toys énonce l'exigence de continuité suivante : « Après un incident, nous acceptons de perdre au plus les commandes des 30 dernières minutes, et l'application doit être de nouveau en ligne en moins de quatre heures. »

        Quels objectifs de récupération cette exigence définit-elle ?
    body:
      options:
        - { id: a, text: { en: "An RPO of four hours and an RTO of 30 minutes", fr: "Un RPO de quatre heures et un RTO de 30 minutes" } }
        - { id: b, text: { en: "An RPO of 30 minutes and an RTO of four hours", fr: "Un RPO de 30 minutes et un RTO de quatre heures" } }
        - { id: c, text: { en: "An RPO of zero and an RTO of four hours", fr: "Un RPO de zéro et un RTO de quatre heures" } }
        - { id: d, text: { en: "An RPO of 30 minutes and an RTO of four hours and 30 minutes", fr: "Un RPO de 30 minutes et un RTO de quatre heures et 30 minutes" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The recovery point objective (RPO) is the maximum acceptable data loss, measured as time before the incident: here, 30 minutes of orders. The recovery time objective (RTO) is the maximum acceptable downtime: here, four hours. The two objectives are measured separately and are never added together.
        fr: |
          L'objectif de point de récupération (RPO) est la perte de données maximale acceptable, mesurée en temps avant l'incident : ici, 30 minutes de commandes. L'objectif de délai de récupération (RTO) est le temps d'arrêt maximal acceptable : ici, quatre heures. Les deux objectifs se mesurent séparément et ne s'additionnent jamais.
      options:
        a: { en: "The two values are swapped: the data loss is the RPO and the downtime is the RTO.", fr: "Les deux valeurs sont inversées : la perte de données est le RPO et le temps d'arrêt est le RTO." }
        c: { en: "An RPO of zero means that no data at all can be lost, whereas the owner accepts losing 30 minutes of orders.", fr: "Un RPO de zéro signifie qu'aucune donnée ne peut être perdue, alors que le responsable accepte de perdre 30 minutes de commandes." }
        d: { en: "The RTO is the downtime only, four hours; the accepted data loss isn't added to it.", fr: "Le RTO est le seul temps d'arrêt, quatre heures ; la perte de données acceptée ne s'y ajoute pas." }
    references:
      - title: What Are Business Continuity, High Availability, and Disaster Recovery?
        url: https://learn.microsoft.com/en-us/azure/reliability/concept-business-continuity-high-availability-disaster-recovery

  # ------------------------------------------------------------------ 2
  - id: az305-qz-31-02
    objective: "3.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso backs up a virtual machine named VM1 to a Recovery Services vault named RSV1. RSV1 was created this year with the default security settings.

        Nine days ago, an administrator stopped the protection of VM1 and deleted its backup data. VM1 itself was deleted later.

        You need to recommend how to recover VM1 from its backups with the least administrative effort. What should you recommend?
      fr: |
        Contoso sauvegarde une machine virtuelle nommée VM1 dans un coffre Recovery Services nommé RSV1. RSV1 a été créé cette année avec les paramètres de sécurité par défaut.

        Il y a neuf jours, un administrateur a arrêté la protection de VM1 et supprimé ses données de sauvegarde. VM1 elle-même a été supprimée ensuite.

        Vous devez recommander comment récupérer VM1 à partir de ses sauvegardes avec un minimum d'effort administratif. Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Enable Cross Region Restore on RSV1, and restore VM1 from the copy of its backup data in the paired region.", fr: "Activer la restauration interrégion (Cross Region Restore) sur RSV1, puis restaurer VM1 depuis la copie de ses données de sauvegarde dans la région jumelée." } }
        - { id: b, text: { en: "Open a support request so that Microsoft recovers the deleted backup data of VM1 from the storage of RSV1.", fr: "Ouvrir une demande de support pour que Microsoft récupère les données de sauvegarde supprimées de VM1 dans le stockage de RSV1." } }
        - { id: c, text: { en: "Restore the backup item of VM1 from the soft-deleted state, and restore VM1 from one of its recovery points.", fr: "Restaurer l'élément de sauvegarde de VM1 depuis l'état de suppression réversible, puis restaurer VM1 depuis l'un de ses points de récupération." } }
        - { id: d, text: { en: "Move the recovery points of VM1 back from the vault-archive tier, and restore VM1 from the oldest of them.", fr: "Ramener les points de récupération de VM1 depuis le niveau archive du coffre (vault-archive), puis restaurer VM1 depuis le plus ancien." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Soft delete is permanently enabled on newly created Recovery Services vaults and keeps deleted backup data for 14 days by default, at no extra cost for these 14 days. Restoring the soft-deleted item returns it to the "stop protection with retain data" state, after which its recovery points can be used to restore VM1 and backups can be resumed.
        fr: |
          La suppression réversible est activée de façon permanente sur les coffres Recovery Services nouvellement créés et conserve les données de sauvegarde supprimées 14 jours par défaut, sans coût supplémentaire pendant ces 14 jours. Restaurer l'élément supprimé de façon réversible le ramène à l'état « arrêt de la protection avec conservation des données » ; ses points de récupération peuvent alors servir à restaurer VM1, et les sauvegardes peuvent reprendre.
      options:
        a: { en: "Cross Region Restore restores recovery points that the vault still holds; it doesn't bring back deleted backup data, which is recoverable only through soft delete.", fr: "La restauration interrégion restaure les points de récupération que le coffre détient encore ; elle ne ramène pas des données de sauvegarde supprimées, récupérables uniquement par la suppression réversible." }
        b: { en: "No support request is needed: the soft-deleted data is still in the vault and the administrators can restore it themselves.", fr: "Aucune demande de support n'est nécessaire : les données supprimées de façon réversible sont toujours dans le coffre et les administrateurs peuvent les restaurer eux-mêmes." }
        d: { en: "The vault-archive tier lowers the cost of rarely used long-term recovery points; it isn't a protection against deletion, and deleting the backup data also deletes archived points.", fr: "Le niveau archive du coffre réduit le coût des points de récupération à long terme rarement utilisés ; ce n'est pas une protection contre la suppression, et supprimer les données de sauvegarde supprime aussi les points archivés." }
    references:
      - title: Secure by default with soft delete for Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-security-feature-cloud

  # ------------------------------------------------------------------ 3
  - id: az305-qz-31-03
    objective: "3.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has an Azure SQL database named SalesDb in the Basic service tier of the DTU-based purchasing model. SalesDb uses the default backup settings.

        A new requirement states that SalesDb must be restorable to any point in time within the last 14 days. Costs must be minimized.

        What should you recommend?
      fr: |
        Fabrikam dispose d'une base de données Azure SQL nommée SalesDb au niveau de service Basic du modèle d'achat DTU. SalesDb utilise les paramètres de sauvegarde par défaut.

        Une nouvelle exigence impose que SalesDb puisse être restaurée à n'importe quel instant des 14 derniers jours. Les coûts doivent être réduits au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Keep the Basic service tier, and set the point-in-time restore retention of SalesDb to 14 days.", fr: "Conserver le niveau de service Basic, puis définir la rétention de restauration à un instant dans le passé de SalesDb sur 14 jours." } }
        - { id: b, text: { en: "Configure a long-term retention policy that keeps the weekly full backups of SalesDb for two weeks.", fr: "Configurer une stratégie de conservation à long terme qui garde les sauvegardes complètes hebdomadaires de SalesDb pendant deux semaines." } }
        - { id: c, text: { en: "Change the backup storage redundancy of SalesDb to geo-redundant storage, and keep the default retention.", fr: "Passer la redondance du stockage de sauvegarde de SalesDb en stockage géoredondant, puis conserver la rétention par défaut." } }
        - { id: d, text: { en: "Move SalesDb to the Standard service tier, and set its point-in-time restore retention to 14 days.", fr: "Passer SalesDb au niveau de service Standard, puis définir sa rétention de restauration à un instant dans le passé sur 14 jours." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The point-in-time restore retention of Azure SQL Database can be set from 1 to 35 days, except in the Basic tier, where it is limited to 7 days. SalesDb must therefore leave Basic; Standard is the next tier of the DTU model and accepts a 14-day retention, which covers any point in time of that period.
        fr: |
          La rétention de restauration à un instant dans le passé d'Azure SQL Database se règle de 1 à 35 jours, sauf au niveau Basic, où elle est limitée à 7 jours. SalesDb doit donc quitter Basic ; Standard est le niveau suivant du modèle DTU et accepte une rétention de 14 jours, qui couvre n'importe quel instant de cette période.
      options:
        a: { en: "A Basic database can keep its point-in-time restore backups for 7 days at most, so a 14-day retention can't be set.", fr: "Une base de données Basic conserve ses sauvegardes de restauration à un instant dans le passé 7 jours au plus : une rétention de 14 jours ne peut pas être définie." }
        b: { en: "Long-term retention keeps full backups that are restored as they were when they were taken; it doesn't allow a restore to any point in time.", fr: "La conservation à long terme garde des sauvegardes complètes restaurées telles qu'elles étaient au moment de leur création ; elle ne permet pas de restaurer à n'importe quel instant." }
        c: { en: "The redundancy decides where the backups are stored, not how long they are kept: the retention stays at 7 days.", fr: "La redondance décide où les sauvegardes sont stockées, pas combien de temps elles sont conservées : la rétention reste de 7 jours." }
    references:
      - title: Automatic, Geo-Redundant Backups - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview

  # ------------------------------------------------------------------ 4
  - id: az305-qz-31-04
    objective: "3.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders stores invoices as block blobs in a standard general-purpose v2 storage account named stinvoices. Azure Backup protects stinvoices with a policy that includes an operational backup retained for 30 days and a daily vaulted backup retained for one year.

        Auditors ask for a copy of the invoices container as it was at the backup of last Monday. The copy must be written to another storage account named staudit, and no blob in stinvoices can be modified.

        What should you recommend?
      fr: |
        Northwind Traders stocke des factures sous forme d'objets blob de blocs dans un compte de stockage standard usage général v2 nommé stinvoices. Sauvegarde Azure protège stinvoices avec une stratégie qui comprend une sauvegarde opérationnelle conservée 30 jours et une sauvegarde archivée (vaulted backup) quotidienne conservée un an.

        Des auditeurs demandent une copie du conteneur des factures tel qu'il était lors de la sauvegarde de lundi dernier. La copie doit être écrite dans un autre compte de stockage nommé staudit, et aucun objet blob de stinvoices ne doit être modifié.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Restore the container from the operational backup to last Monday, with staudit as the target account.", fr: "Restaurer le conteneur depuis la sauvegarde opérationnelle à lundi dernier, avec staudit comme compte cible." } }
        - { id: b, text: { en: "Restore the container from the vaulted recovery point of last Monday, with staudit as the target account.", fr: "Restaurer le conteneur depuis le point de récupération archivé de lundi dernier, avec staudit comme compte cible." } }
        - { id: c, text: { en: "Configure object replication of the container from stinvoices to staudit, starting from last Monday.", fr: "Configurer la réplication d'objets du conteneur de stinvoices vers staudit, à partir de lundi dernier." } }
        - { id: d, text: { en: "Run a point-in-time restore of the container to last Monday, and copy the restored blobs to staudit.", fr: "Exécuter une restauration à un instant dans le passé du conteneur à lundi dernier, puis copier les objets blob restaurés vers staudit." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A vaulted backup stores its recovery points in the Backup vault, outside the source account. A restore from one of them lets you select the target storage account, provided that the vault has the Storage Account Backup Contributor role on it, and you can restore all the containers or chosen ones. The copy of last Monday is written to staudit and stinvoices isn't touched.
        fr: |
          Une sauvegarde archivée stocke ses points de récupération dans le coffre de sauvegarde, en dehors du compte source. Une restauration depuis l'un d'eux permet de choisir le compte de stockage cible, à condition que le coffre y dispose du rôle Storage Account Backup Contributor, et de restaurer tous les conteneurs ou ceux que vous choisissez. La copie de lundi dernier est écrite dans staudit et stinvoices n'est pas modifié.
      options:
        a: { en: "An operational backup keeps its data in the source account, and every restore from it is performed to the source account only.", fr: "Une sauvegarde opérationnelle garde ses données dans le compte source, et toute restauration depuis elle s'effectue uniquement dans le compte source." }
        c: { en: "Object replication copies the current blobs and their later changes; it can't produce the state of the container at a past date.", fr: "La réplication d'objets copie les objets blob actuels et leurs modifications ultérieures ; elle ne peut pas produire l'état du conteneur à une date passée." }
        d: { en: "A point-in-time restore overwrites the blobs of the source account with their earlier state, which modifies stinvoices.", fr: "Une restauration à un instant dans le passé remplace les objets blob du compte source par leur état antérieur, ce qui modifie stinvoices." }
    references:
      - title: Restore Azure Blobs - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/blob-restore
      - title: Overview of Azure Blobs backup - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/blob-backup-overview

  # ------------------------------------------------------------------ 5
  - id: az305-qz-31-05
    objective: "3.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum replicates 20 Azure virtual machines from the East US region to the West US region by using Azure Site Recovery. During a regional outage, Adatum failed the virtual machines over to West US and committed the failover. The virtual machines have been running in West US for a week.

        East US is available again, and the source disks of the virtual machines are intact. You need to recommend how to start bringing the virtual machines back to East US. The data written in West US must be kept, and the amount of data transferred must be minimized.

        What should you recommend as the first step?
      fr: |
        Adatum réplique 20 machines virtuelles Azure de la région East US vers la région West US avec Azure Site Recovery. Pendant une panne régionale, Adatum a basculé les machines virtuelles vers West US et validé le basculement. Les machines virtuelles fonctionnent dans West US depuis une semaine.

        East US est de nouveau disponible, et les disques sources des machines virtuelles sont intacts. Vous devez recommander comment commencer à ramener les machines virtuelles dans East US. Les données écrites dans West US doivent être conservées, et la quantité de données transférées doit être réduite au minimum.

        Que devez-vous recommander comme première étape ?
    body:
      options:
        - { id: a, text: { en: "Run a failover of the virtual machines from West US to East US by using the latest recovery point.", fr: "Exécuter un basculement des machines virtuelles de West US vers East US avec le dernier point de récupération." } }
        - { id: b, text: { en: "Disable replication, and enable replication from West US to East US in a new Recovery Services vault.", fr: "Désactiver la réplication, puis activer la réplication de West US vers East US dans un nouveau coffre Recovery Services." } }
        - { id: c, text: { en: "Reprotect the virtual machines so that Site Recovery replicates them from West US to East US.", fr: "Reprotéger les machines virtuelles pour que Site Recovery les réplique de West US vers East US." } }
        - { id: d, text: { en: "Restore the virtual machines in East US from their Azure Backup recovery points by using Cross Region Restore.", fr: "Restaurer les machines virtuelles dans East US depuis leurs points de récupération Sauvegarde Azure avec la restauration interrégion." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          After a failover, the virtual machines run unprotected in the target region. Reprotection reverses the direction of replication so that West US replicates to East US; when the source disks are still accessible, Site Recovery compares the disks and transfers only the differences. Once the machines are protected again, you fail them back to East US, and then reprotect them once more.
        fr: |
          Après un basculement, les machines virtuelles s'exécutent sans protection dans la région cible. La reprotection inverse le sens de la réplication pour que West US réplique vers East US ; quand les disques sources sont encore accessibles, Site Recovery compare les disques et ne transfère que les différences. Une fois les machines de nouveau protégées, vous les faites revenir dans East US, puis vous les reprotégez encore.
      options:
        a: { en: "A failover back to East US is possible only for machines that are reprotected and replicating from West US; right after a committed failover, they aren't protected.", fr: "Un basculement vers East US n'est possible que pour des machines reprotégées qui se répliquent depuis West US ; juste après un basculement validé, elles ne sont pas protégées." }
        b: { en: "A new replication starts with a full initial copy of every disk, which transfers far more data than a reprotection that reuses the source disks.", fr: "Une nouvelle réplication commence par une copie initiale complète de chaque disque, ce qui transfère bien plus de données qu'une reprotection qui réutilise les disques sources." }
        d: { en: "Backups don't contain the data written since the last recovery point, and a restore rebuilds the machines instead of returning the running ones.", fr: "Les sauvegardes ne contiennent pas les données écrites depuis le dernier point de récupération, et une restauration reconstruit les machines au lieu de ramener celles qui s'exécutent." }
    references:
      - title: Reprotect Azure virtual machines to the primary region with Azure Site Recovery - Azure Site Recovery
        url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-how-to-reprotect

  # ------------------------------------------------------------------ 6
  - id: az305-qz-31-06
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank plans to deploy an Azure SQL database named LedgerDb in the General Purpose service tier in the Germany West Central region. The region supports availability zones, and its paired region is Germany North.

        The backup and recovery design must meet the following requirements:

        - The backups of LedgerDb must remain available in Germany West Central if one datacenter of the region fails.
        - After a region-wide outage of Germany West Central, LedgerDb must be recovered in the West Europe region. A downtime of up to 24 hours and the loss of the most recent transactions are acceptable.
        - No secondary database can be billed while Germany West Central is available.

        What should you recommend? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank prévoit de déployer une base de données Azure SQL nommée LedgerDb au niveau de service General Purpose dans la région Germany West Central. La région prend en charge les zones de disponibilité, et sa région jumelée est Germany North.

        La conception de sauvegarde et de récupération doit répondre aux exigences suivantes :

        - Les sauvegardes de LedgerDb doivent rester disponibles dans Germany West Central si un centre de données de la région tombe en panne.
        - Après une panne de toute la région Germany West Central, LedgerDb doit être récupérée dans la région West Europe. Une interruption de 24 heures au plus et la perte des transactions les plus récentes sont acceptables.
        - Aucune base de données secondaire ne doit être facturée tant que Germany West Central est disponible.

        Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Backup storage redundancy: [[red]]

          Recovery after a regional outage: [[rec]]
        fr: |
          Redondance du stockage de sauvegarde : [[red]]

          Récupération après une panne régionale : [[rec]]
      slots:
        - id: red
          options:
            - { id: lrs, text: { en: "Locally redundant storage (LRS)", fr: "Stockage localement redondant (LRS)" } }
            - { id: zrs, text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" } }
            - { id: grs, text: { en: "Geo-redundant storage (GRS)", fr: "Stockage géoredondant (GRS)" } }
            - { id: gzrs, text: { en: "Geo-zone-redundant storage (GZRS)", fr: "Stockage géoredondant interzone (GZRS)" } }
        - id: rec
          options:
            - { id: agr, text: { en: "Active geo-replication to a server in West Europe", fr: "La géoréplication active vers un serveur dans West Europe" } }
            - { id: fog, text: { en: "A failover group with a server in West Europe", fr: "Un groupe de basculement avec un serveur dans West Europe" } }
            - { id: geo, text: { en: "A geo-restore to a server in West Europe", fr: "Une géorestauration vers un serveur dans West Europe" } }
            - { id: pitr, text: { en: "A point-in-time restore to a server in West Europe", fr: "Une restauration à un instant dans le passé vers un serveur dans West Europe" } }
    answer:
      values: { red: gzrs, rec: geo }
    explanation:
      correct:
        en: |
          Geo-zone-redundant backup storage copies the backups synchronously across three availability zones of Germany West Central, so they survive the loss of a datacenter, and asynchronously to the paired region. Geo-restore is available only with geo-redundant or geo-zone-redundant backup storage and creates the database on a server in any region, including West Europe, from the latest geo-replicated backups. It needs no secondary database, and its slower recovery and small data loss are within the stated objectives.
        fr: |
          Le stockage de sauvegarde géoredondant interzone copie les sauvegardes de façon synchrone sur trois zones de disponibilité de Germany West Central, ce qui les fait survivre à la perte d'un centre de données, et de façon asynchrone vers la région jumelée. La géorestauration n'est disponible qu'avec un stockage de sauvegarde géoredondant ou géoredondant interzone et crée la base de données sur un serveur de n'importe quelle région, West Europe comprise, à partir des dernières sauvegardes géorépliquées. Elle ne demande aucune base secondaire, et sa récupération plus lente et sa faible perte de données respectent les objectifs énoncés.
      options:
        lrs: { en: "LRS keeps the backups in a single datacenter of the region and allows no geo-restore.", fr: "LRS garde les sauvegardes dans un seul centre de données de la région et ne permet aucune géorestauration." }
        zrs: { en: "ZRS survives a datacenter failure, but geo-restore is disabled when the backups are zone-redundant only.", fr: "ZRS survit à la panne d'un centre de données, mais la géorestauration est désactivée quand les sauvegardes sont seulement redondantes interzone." }
        grs: { en: "GRS allows a geo-restore, but in Germany West Central it keeps the backups in a single datacenter (LRS).", fr: "GRS permet une géorestauration, mais dans Germany West Central il garde les sauvegardes dans un seul centre de données (LRS)." }
        agr: { en: "Active geo-replication maintains a readable secondary database that is billed at all times.", fr: "La géoréplication active maintient une base de données secondaire lisible facturée en permanence." }
        fog: { en: "A failover group relies on a secondary database in West Europe, which is billed while the primary region is available.", fr: "Un groupe de basculement s'appuie sur une base de données secondaire dans West Europe, facturée tant que la région primaire est disponible." }
        pitr: { en: "A point-in-time restore creates the database on the same server only; cross-region point-in-time restore isn't supported.", fr: "Une restauration à un instant dans le passé crée la base de données uniquement sur le même serveur ; la restauration à un instant dans le passé interrégion n'est pas prise en charge." }
    references:
      - title: Automatic, Geo-Redundant Backups - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
      - title: Restore a Database from a Backup - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/recovery-using-backups

  # ------------------------------------------------------------------ 7
  - id: az305-qz-31-07
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys has two Azure file shares, each in its own standard general-purpose v2 storage account in the North Europe region. The paired region of North Europe is West Europe.

        - **Projects**: users often delete files by mistake. Files must be restorable within minutes from daily recovery points kept for 30 days. The storage account is protected by a delete lock, no off-site copy is required, and costs must be minimized.
        - **Payroll**: the recovery points must remain available if the storage account is deleted or encrypted by ransomware. During a region-wide outage of North Europe, the share must be restorable in West Europe.

        You need to recommend a backup configuration that uses Azure Backup.

        What should you recommend? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys dispose de deux partages de fichiers Azure, chacun dans son propre compte de stockage standard usage général v2 de la région North Europe. La région jumelée de North Europe est West Europe.

        - **Projects** : les utilisateurs suppriment souvent des fichiers par erreur. Les fichiers doivent pouvoir être restaurés en quelques minutes depuis des points de récupération quotidiens conservés 30 jours. Le compte de stockage est protégé par un verrou de suppression, aucune copie hors site n'est exigée, et les coûts doivent être réduits au minimum.
        - **Payroll** : les points de récupération doivent rester disponibles si le compte de stockage est supprimé ou chiffré par un rançongiciel. Pendant une panne de toute la région North Europe, le partage doit pouvoir être restauré dans West Europe.

        Vous devez recommander une configuration de sauvegarde qui utilise Sauvegarde Azure.

        Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Backup tier for Projects: [[projects]]

          Backup tier for Payroll: [[payroll]]

          Vault for Payroll: [[vault]]
        fr: |
          Niveau de sauvegarde pour Projects : [[projects]]

          Niveau de sauvegarde pour Payroll : [[payroll]]

          Coffre pour Payroll : [[vault]]
      slots:
        - id: projects
          options:
            - { id: snap, text: { en: "The snapshot tier", fr: "Le niveau instantané" } }
            - { id: vaulted, text: { en: "The vault-standard tier", fr: "Le niveau standard du coffre (Vault-Standard)" } }
            - { id: oper, text: { en: "Operational backup", fr: "La sauvegarde opérationnelle" } }
        - id: payroll
          options:
            - { id: snap, text: { en: "The snapshot tier", fr: "Le niveau instantané" } }
            - { id: vaulted, text: { en: "The vault-standard tier", fr: "Le niveau standard du coffre (Vault-Standard)" } }
            - { id: oper, text: { en: "Operational backup", fr: "La sauvegarde opérationnelle" } }
        - id: vault
          options:
            - { id: bv, text: { en: "A geo-redundant Backup vault", fr: "Un coffre de sauvegarde géoredondant" } }
            - { id: rsvzrs, text: { en: "A zone-redundant Recovery Services vault", fr: "Un coffre Recovery Services redondant interzone" } }
            - { id: rsvgrs, text: { en: "A geo-redundant Recovery Services vault with Cross Region Restore", fr: "Un coffre Recovery Services géoredondant avec la restauration interrégion" } }
            - { id: rsvlrs, text: { en: "A locally redundant Recovery Services vault", fr: "Un coffre Recovery Services localement redondant" } }
    answer:
      values: { projects: snap, payroll: vaulted, vault: rsvgrs }
    explanation:
      correct:
        en: |
          The snapshot tier keeps share snapshots in the storage account and restores files or the share from them in minutes; it adds no vault storage, so it is the cheapest choice when no off-site copy is needed. The vault-standard tier transfers the changed data to the vault, an off-site copy that doesn't depend on the source account and therefore survives its deletion or encryption. Azure Files backup always uses a Recovery Services vault, and only a geo-redundant vault with Cross Region Restore lets the share be restored in the paired region, West Europe.
        fr: |
          Le niveau instantané garde des instantanés de partage dans le compte de stockage et restaure des fichiers ou le partage à partir d'eux en quelques minutes ; il n'ajoute aucun stockage dans le coffre et c'est donc le choix le moins cher quand aucune copie hors site n'est nécessaire. Le niveau standard du coffre transfère les données modifiées vers le coffre, une copie hors site qui ne dépend pas du compte source et survit donc à sa suppression ou à son chiffrement. La sauvegarde Azure Files utilise toujours un coffre Recovery Services, et seul un coffre géoredondant avec la restauration interrégion permet de restaurer le partage dans la région jumelée, West Europe.
      options:
        vaulted: { en: "For Projects, the vault-standard tier works but adds vault storage costs for an off-site copy that isn't required.", fr: "Pour Projects, le niveau standard du coffre fonctionne mais ajoute des coûts de stockage dans le coffre pour une copie hors site non exigée." }
        oper: { en: "Operational backup is a mode of Azure Blob backup managed from a Backup vault; it doesn't apply to Azure file shares.", fr: "La sauvegarde opérationnelle est un mode de sauvegarde des objets blob Azure géré depuis un coffre de sauvegarde ; elle ne s'applique pas aux partages de fichiers Azure." }
        snap: { en: "For Payroll, snapshots stay in the storage account and are lost with it.", fr: "Pour Payroll, les instantanés restent dans le compte de stockage et disparaissent avec lui." }
        bv: { en: "Azure file shares are protected from a Recovery Services vault, not from a Backup vault.", fr: "Les partages de fichiers Azure sont protégés depuis un coffre Recovery Services, pas depuis un coffre de sauvegarde." }
        rsvzrs: { en: "A zone-redundant vault keeps the backup data in North Europe, so nothing can be restored in West Europe.", fr: "Un coffre redondant interzone garde les données de sauvegarde dans North Europe : rien ne peut être restauré dans West Europe." }
        rsvlrs: { en: "A locally redundant vault keeps the backup data in a single datacenter of North Europe.", fr: "Un coffre localement redondant garde les données de sauvegarde dans un seul centre de données de North Europe." }
    references:
      - title: About Azure Files backup - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/azure-file-share-backup-overview
      - title: Support Matrix for Azure Files backup by using Azure Backup - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/azure-file-share-support-matrix

  # ------------------------------------------------------------------ 8
  - id: az305-qz-31-08
    objective: "3.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware plans to protect 40 Azure virtual machines in the UK South region with Azure Backup. Ten of the virtual machines use Premium SSD v2 data disks; the others use Premium SSD disks only.

        The draft design uses one Standard backup policy that runs once a day, with an instant restore snapshot retention of five days. The operations team then adds a requirement: a restore from any daily recovery point of the last 10 days must be an instant restore from snapshots.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware prévoit de protéger 40 machines virtuelles Azure de la région UK South avec Sauvegarde Azure. Dix des machines virtuelles utilisent des disques de données Premium SSD v2 ; les autres n'utilisent que des disques Premium SSD.

        La conception provisoire utilise une stratégie de sauvegarde standard unique qui s'exécute une fois par jour, avec une rétention des instantanés de restauration instantanée de cinq jours. L'équipe des opérations ajoute ensuite une exigence : une restauration depuis n'importe quel point de récupération quotidien des 10 derniers jours doit être une restauration instantanée depuis les instantanés.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: The draft Standard policy can protect the ten virtual machines that use Premium SSD v2 data disks.
            fr: La stratégie standard provisoire peut protéger les dix machines virtuelles qui utilisent des disques de données Premium SSD v2.
        - id: s2
          text:
            en: To meet the requirement of the operations team, the virtual machines must be protected by an Enhanced policy.
            fr: Pour répondre à l'exigence de l'équipe des opérations, les machines virtuelles doivent être protégées par une stratégie améliorée.
        - id: s3
          text:
            en: If snapshot costs grow, virtual machines protected by an Enhanced policy can later be moved back to a Standard policy.
            fr: Si les coûts des instantanés augmentent, les machines virtuelles protégées par une stratégie améliorée peuvent ensuite revenir à une stratégie standard.
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          The Standard policy doesn't support newer disk types such as Premium SSD v2 and Ultra Disk, so those virtual machines need the Enhanced policy. Instant restore snapshots are kept 1 to 5 days with a Standard policy and 1 to 30 days with an Enhanced policy, so a 10-day instant restore window requires the Enhanced policy for all the machines. Once a virtual machine is backed up with an Enhanced policy, Azure Backup doesn't allow its policy type to be changed back to Standard.
        fr: |
          La stratégie standard ne prend pas en charge les types de disques récents comme Premium SSD v2 et Ultra Disk : ces machines virtuelles ont besoin de la stratégie améliorée. Les instantanés de restauration instantanée sont conservés de 1 à 5 jours avec une stratégie standard et de 1 à 30 jours avec une stratégie améliorée : une fenêtre de restauration instantanée de 10 jours exige donc la stratégie améliorée pour toutes les machines. Une fois qu'une machine virtuelle est sauvegardée avec une stratégie améliorée, Sauvegarde Azure ne permet pas de ramener son type de stratégie à standard.
    references:
      - title: Back Up Azure VMs with the Enhanced Policy - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy
      - title: Azure Instant Restore Capability - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/backup-instant-restore-capability

  # ------------------------------------------------------------------ 9
  - id: az305-qz-31-09
    objective: "3.1.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso runs an order processing application in the East US 2 region. The web and application tiers run on eight Azure virtual machines. The data tier is an Azure SQL database named OrdersDb in the General Purpose service tier.

        You need to recommend a disaster recovery solution to the Central US region. The solution must meet the following requirements:

        - After a region-wide outage of East US 2, the application must run in Central US within one hour.
        - The virtual machines must have an RPO of 15 minutes, and OrdersDb an RPO of less than one minute.
        - The connection string of the application must not change after a failover.
        - No virtual machine compute can be billed in Central US before a failover.

        Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso exécute une application de traitement des commandes dans la région East US 2. Les niveaux web et application s'exécutent sur huit machines virtuelles Azure. Le niveau données est une base de données Azure SQL nommée OrdersDb au niveau de service General Purpose.

        Vous devez recommander une solution de reprise d'activité vers la région Central US. La solution doit répondre aux exigences suivantes :

        - Après une panne de toute la région East US 2, l'application doit fonctionner dans Central US en moins d'une heure.
        - Les machines virtuelles doivent avoir un RPO de 15 minutes, et OrdersDb un RPO inférieur à une minute.
        - La chaîne de connexion de l'application ne doit pas changer après un basculement.
        - Aucun calcul de machine virtuelle ne doit être facturé dans Central US avant un basculement.

        Quelles sont les deux actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Replicate the virtual machines to Central US by using Azure Site Recovery.", fr: "Répliquer les machines virtuelles vers Central US avec Azure Site Recovery." } }
        - { id: b, text: { en: "Replicate OrdersDb to Central US by using Azure Site Recovery.", fr: "Répliquer OrdersDb vers Central US avec Azure Site Recovery." } }
        - { id: c, text: { en: "Configure active geo-replication of OrdersDb to a server in Central US.", fr: "Configurer la géoréplication active d'OrdersDb vers un serveur dans Central US." } }
        - { id: d, text: { en: "Add OrdersDb to a failover group with a server in Central US.", fr: "Ajouter OrdersDb à un groupe de basculement avec un serveur dans Central US." } }
        - { id: e, text: { en: "Back up the virtual machines to a geo-redundant vault with Cross Region Restore.", fr: "Sauvegarder les machines virtuelles dans un coffre géoredondant avec la restauration interrégion." } }
        - { id: f, text: { en: "Deploy a copy of the virtual machines in Central US behind Azure Traffic Manager.", fr: "Déployer une copie des machines virtuelles dans Central US derrière Azure Traffic Manager." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Site Recovery replicates the disks of the virtual machines continuously, with crash-consistent recovery points every five minutes, and creates the machines in Central US only at failover, so no compute is billed before. OrdersDb is a platform database, which Site Recovery doesn't protect: a failover group replicates it asynchronously to Central US with an RPO of seconds and keeps a read-write listener endpoint whose name doesn't change, so the connection string stays the same.
        fr: |
          Site Recovery réplique les disques des machines virtuelles en continu, avec des points de récupération cohérents en cas d'incident toutes les cinq minutes, et ne crée les machines dans Central US qu'au basculement : aucun calcul n'est facturé avant. OrdersDb est une base de données de plateforme, que Site Recovery ne protège pas : un groupe de basculement la réplique de façon asynchrone vers Central US avec un RPO de quelques secondes et garde un point de terminaison d'écouteur en lecture-écriture dont le nom ne change pas, si bien que la chaîne de connexion reste la même.
      options:
        b: { en: "Site Recovery replicates machines (Azure, VMware, Hyper-V and physical); it can't replicate an Azure SQL database.", fr: "Site Recovery réplique des machines (Azure, VMware, Hyper-V et physiques) ; il ne peut pas répliquer une base de données Azure SQL." }
        c: { en: "After a failover with active geo-replication, the application must connect to the secondary server, so the connection string changes.", fr: "Après un basculement avec la géoréplication active, l'application doit se connecter au serveur secondaire : la chaîne de connexion change." }
        e: { en: "Cross Region Restore restores daily or four-hourly recovery points that can lag by up to 36 hours: neither the RPO nor the one-hour RTO is met.", fr: "La restauration interrégion restaure des points de récupération quotidiens ou toutes les quatre heures qui peuvent avoir jusqu'à 36 heures de retard : ni le RPO ni le RTO d'une heure ne sont respectés." }
        f: { en: "Running virtual machines in Central US bills their compute before any failover, and they would still need their data replicated.", fr: "Des machines virtuelles en fonctionnement dans Central US facturent leur calcul avant tout basculement, et leurs données devraient encore être répliquées." }
    references:
      - title: About Azure Site Recovery - Azure Site Recovery
        url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-overview
      - title: Failover Groups Overview & Best Practices - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db

  # ------------------------------------------------------------------ 10
  - id: az305-qz-31-10
    objective: "3.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware has a single on-premises datacenter that hosts 80 VMware vSphere virtual machines managed by vCenter Server. Proseware has an Azure subscription and no other datacenter.

        You need to recommend a protection solution that meets the following requirements:

        - After the loss of the datacenter, the virtual machines must run in Azure within four hours, with an RPO of 30 minutes.
        - Any virtual machine must be restorable as it was at the end of any month of the last three years.
        - Daily backups of the last 14 days must also be kept on local disks in the datacenter for fast restores.

        What should you recommend?
      fr: |
        Proseware dispose d'un seul centre de données local qui héberge 80 machines virtuelles VMware vSphere gérées par vCenter Server. Proseware dispose d'un abonnement Azure et d'aucun autre centre de données.

        Vous devez recommander une solution de protection qui répond aux exigences suivantes :

        - Après la perte du centre de données, les machines virtuelles doivent fonctionner dans Azure en moins de quatre heures, avec un RPO de 30 minutes.
        - Toute machine virtuelle doit pouvoir être restaurée telle qu'elle était à la fin de n'importe quel mois des trois dernières années.
        - Les sauvegardes quotidiennes des 14 derniers jours doivent aussi être conservées sur des disques locaux du centre de données pour des restaurations rapides.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Azure Site Recovery with a replication appliance, and an application-consistent snapshot frequency of one hour in the replication policy", fr: "Azure Site Recovery avec une appliance de réplication, et une fréquence d'instantanés cohérents au niveau des applications d'une heure dans la stratégie de réplication" } }
        - { id: b, text: { en: "Microsoft Azure Backup Server (MABS) that backs up the virtual machines to local disks and to a Recovery Services vault, and no other service", fr: "Microsoft Azure Backup Server (MABS) qui sauvegarde les machines virtuelles sur des disques locaux et dans un coffre Recovery Services, sans autre service" } }
        - { id: c, text: { en: "Azure Site Recovery with a replication appliance, and MABS that backs up the virtual machines to local disks and to a Recovery Services vault", fr: "Azure Site Recovery avec une appliance de réplication, et MABS qui sauvegarde les machines virtuelles sur des disques locaux et dans un coffre Recovery Services" } }
        - { id: d, text: { en: "Azure Site Recovery with a replication appliance, and the MARS agent in each virtual machine that backs up its files and folders to a Recovery Services vault", fr: "Azure Site Recovery avec une appliance de réplication, et l'agent MARS dans chaque machine virtuelle qui sauvegarde ses fichiers et dossiers dans un coffre Recovery Services" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Two needs coexist. Site Recovery replicates the VMware virtual machines to Azure almost continuously through the on-premises replication appliance and fails them over in Azure, which meets the four-hour RTO and the 30-minute RPO; its recovery points are kept 15 days at most, so it can't give three years of monthly points. MABS backs up VMware virtual machines without an agent, first to local disks for short-term restores, then online to the Recovery Services vault, where monthly recovery points can be kept for years.
        fr: |
          Deux besoins coexistent. Site Recovery réplique les machines virtuelles VMware vers Azure presque en continu grâce à l'appliance de réplication locale et les fait basculer dans Azure, ce qui respecte le RTO de quatre heures et le RPO de 30 minutes ; ses points de récupération sont conservés 15 jours au plus : il ne peut donc pas fournir trois ans de points mensuels. MABS sauvegarde les machines virtuelles VMware sans agent, d'abord sur des disques locaux pour les restaurations à court terme, puis en ligne dans le coffre Recovery Services, où des points de récupération mensuels peuvent être conservés des années.
      options:
        a: { en: "Site Recovery alone keeps recovery points for 15 days at most and keeps no local backup copies, whatever the snapshot frequency.", fr: "Site Recovery seul conserve les points de récupération 15 jours au plus et ne garde aucune copie de sauvegarde locale, quelle que soit la fréquence des instantanés." }
        b: { en: "MABS runs in the datacenter that is lost; rebuilding a VMware environment and restoring 80 machines from the vault doesn't fit a four-hour RTO.", fr: "MABS s'exécute dans le centre de données perdu ; reconstruire un environnement VMware et restaurer 80 machines depuis le coffre ne tient pas dans un RTO de quatre heures." }
        d: { en: "The MARS agent backs up files, folders and system state directly to Azure: it keeps no local disk copies and doesn't restore whole virtual machines.", fr: "L'agent MARS sauvegarde des fichiers, des dossiers et l'état du système directement vers Azure : il ne garde aucune copie sur disque local et ne restaure pas des machines virtuelles entières." }
    references:
      - title: Back up VMware VMs using Azure Backup Server - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-backup-server-vmware
      - title: About Azure Site Recovery - Azure Site Recovery
        url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-overview
