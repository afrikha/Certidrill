chapter: 44-networking
questions:
  # ------------------------------------------------------------------ 1
  - id: az305-qz-44-01
    objective: "4.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso uses Azure Bastion to let external contractors administer virtual machines over RDP from the Azure portal. A new audit requirement states that every contractor session must be recorded and that the recordings must be replayable later.

        Which Azure Bastion SKU should you recommend?
      fr: |
        Contoso utilise Azure Bastion pour permettre à des prestataires externes d'administrer des machines virtuelles en RDP depuis le portail Azure. Une nouvelle exigence d'audit impose que chaque session de prestataire soit enregistrée et que les enregistrements puissent être relus plus tard.

        Quelle référence SKU d'Azure Bastion devez-vous recommander ?
    body:
      options:
        - { id: a, text: Developer }
        - { id: b, text: Basic }
        - { id: c, text: Standard }
        - { id: d, text: Premium }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Session recording requires the Premium SKU of Azure Bastion. The recordings of the browser sessions are stored in a blob container of a storage account and replayed in the Azure portal.
        fr: |
          L'enregistrement de session exige la référence SKU Premium d'Azure Bastion. Les enregistrements des sessions du navigateur sont stockés dans un conteneur d'objets blob d'un compte de stockage et relus dans le portail Azure.
      options:
        a: { en: "Developer is a shared, free offering for one connection at a time, not suitable for production, and has no session recording.", fr: "Developer est une offre partagée et gratuite, pour une connexion à la fois, inadaptée à la production, et sans enregistrement de session." }
        b: { en: "Basic provides a dedicated deployment that reaches peered virtual networks, but no session recording.", fr: "Basic fournit un déploiement dédié qui atteint les réseaux virtuels en peering, mais sans enregistrement de session." }
        c: { en: "Standard adds the native client, shareable links and host scaling, but session recording is a Premium feature.", fr: "Standard ajoute le client natif, les liens partageables et la mise à l'échelle des hôtes, mais l'enregistrement de session est une fonctionnalité Premium." }
    references:
      - title: Choose the right Azure Bastion SKU to meet your needs
        url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
      - title: Record Bastion sessions - Azure Bastion
        url: https://learn.microsoft.com/en-us/azure/bastion/session-recording

  # ------------------------------------------------------------------ 2
  - id: az305-qz-44-02
    objective: "4.4.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam publishes several internet-facing applications through Standard public IP addresses. During a DDoS attack, Fabrikam wants access to the DDoS rapid response team, and it wants service credits for the resources that scale out because of a documented attack.

        Which protection should you recommend?
      fr: |
        Fabrikam publie plusieurs applications accessibles depuis Internet au moyen d'adresses IP publiques Standard. Pendant une attaque DDoS, Fabrikam veut avoir accès à l'équipe d'intervention rapide DDoS, et veut des crédits de service pour les ressources qui montent en charge à cause d'une attaque documentée.

        Quelle protection devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "The DDoS infrastructure protection included with Azure", fr: "La protection de l'infrastructure DDoS incluse dans Azure" } }
        - { id: b, text: { en: "DDoS IP Protection on each public IP address", fr: "DDoS IP Protection sur chaque adresse IP publique" } }
        - { id: c, text: { en: "DDoS Network Protection on the virtual networks", fr: "DDoS Network Protection sur les réseaux virtuels" } }
        - { id: d, text: { en: "A WAF policy on Azure Application Gateway", fr: "Une stratégie WAF sur Azure Application Gateway" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          DDoS rapid response support and cost protection are available only with DDoS Network Protection, which is billed per 100 protected public IP addresses. It also adds a discount on WAF.
        fr: |
          Le support d'intervention rapide DDoS et la protection des coûts ne sont disponibles qu'avec DDoS Network Protection, facturé par tranche de 100 adresses IP publiques protégées. Il ajoute aussi une remise sur le WAF.
      options:
        a: { en: "The free infrastructure protection protects the Azure platform, without tuning to your traffic, rapid response or cost protection.", fr: "La protection gratuite de l'infrastructure protège la plateforme Azure, sans réglage adapté à votre trafic, ni intervention rapide, ni protection des coûts." }
        b: { en: "DDoS IP Protection mitigates attacks per public IP address, but it includes neither rapid response support nor cost protection.", fr: "DDoS IP Protection atténue les attaques par adresse IP publique, mais n'inclut ni le support d'intervention rapide ni la protection des coûts." }
        d: { en: "A WAF protects against layer 7 attacks such as SQL injection; it doesn't provide the DDoS rapid response team or cost protection.", fr: "Un WAF protège contre les attaques de couche 7 comme l'injection SQL ; il ne fournit ni l'équipe d'intervention rapide DDoS ni la protection des coûts." }
    references:
      - title: About Azure DDoS Protection Tier Comparison
        url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-sku-comparison

  # ------------------------------------------------------------------ 3
  - id: az305-qz-44-03
    objective: "4.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware connects its Paris datacenter to virtual networks in the France Central region through an ExpressRoute circuit of the Standard SKU, at a peering location in Paris. The circuit uses private peering.

        Litware will deploy new virtual networks in the Japan East and Australia East regions. The datacenter must reach them through the existing circuit, over the Microsoft network. What should you recommend?
      fr: |
        Litware connecte son centre de données de Paris à des réseaux virtuels de la région France Centre au moyen d'un circuit ExpressRoute de la référence SKU Standard, dans un emplacement de peering à Paris. Le circuit utilise le peering privé.

        Litware va déployer de nouveaux réseaux virtuels dans les régions Japon Est et Australie Est. Le centre de données doit les atteindre par le circuit existant, sur le réseau Microsoft. Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Change the SKU of the circuit to Local.", fr: "Changer la référence SKU du circuit en Local." } }
        - { id: b, text: { en: "Enable ExpressRoute Global Reach on the circuit.", fr: "Activer ExpressRoute Global Reach sur le circuit." } }
        - { id: c, text: { en: "Enable ExpressRoute FastPath on the connections.", fr: "Activer ExpressRoute FastPath sur les connexions." } }
        - { id: d, text: { en: "Change the SKU of the circuit to Premium.", fr: "Changer la référence SKU du circuit en Premium." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A Standard circuit reaches all the Azure regions of its geopolitical area only, here Europe. ExpressRoute Premium adds global connectivity: a virtual network in another geopolitical region, such as Japan or Australia, can be linked to the circuit.
        fr: |
          Un circuit Standard n'atteint que les régions Azure de sa zone géopolitique, ici l'Europe. ExpressRoute Premium ajoute la connectivité mondiale : un réseau virtuel d'une autre zone géopolitique, comme le Japon ou l'Australie, peut être lié au circuit.
      options:
        a: { en: "A Local circuit reaches only one or two regions near the peering location, even fewer than Standard.", fr: "Un circuit Local n'atteint qu'une ou deux régions proches de l'emplacement de peering, encore moins que Standard." }
        b: { en: "Global Reach connects two on-premises sites to each other through their circuits; it doesn't extend the regions that a circuit reaches.", fr: "Global Reach relie deux sites locaux entre eux par leurs circuits ; il n'étend pas les régions qu'un circuit atteint." }
        c: { en: "FastPath sends traffic directly to the virtual machines to bypass the gateway in the data path; it doesn't change which regions are reachable.", fr: "FastPath envoie le trafic directement aux machines virtuelles pour contourner la passerelle dans le chemin de données ; il ne change pas les régions accessibles." }
    references:
      - title: FAQ - Azure ExpressRoute
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-faqs

  # ------------------------------------------------------------------ 4
  - id: az305-qz-44-04
    objective: "4.4.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum runs microservices on an Azure Kubernetes Service (AKS) cluster in one region. You need to recommend how to expose them over HTTPS. The solution must meet the following requirements:

        - The layer 7 load balancer must be managed by Azure and run outside the cluster.
        - Developers must configure routing with Kubernetes Gateway API resources.
        - New versions must be released by sending a weighted share of the requests to them.

        What should you recommend?
      fr: |
        Adatum exécute des microservices sur un cluster Azure Kubernetes Service (AKS) dans une région. Vous devez recommander comment les exposer en HTTPS. La solution doit répondre aux exigences suivantes :

        - L'équilibreur de charge de couche 7 doit être géré par Azure et s'exécuter en dehors du cluster.
        - Les développeurs doivent configurer le routage avec des ressources Kubernetes Gateway API.
        - Les nouvelles versions doivent être publiées en leur envoyant une part pondérée des requêtes.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "A Standard public load balancer in front of the AKS nodes", fr: "Un équilibreur de charge public Standard devant les nœuds AKS" } }
        - { id: b, text: { en: "Application Gateway for Containers", fr: "Application Gateway pour conteneurs" } }
        - { id: c, text: { en: "A Traffic Manager profile with the Weighted routing method", fr: "Un profil Traffic Manager avec la méthode de routage Weighted" } }
        - { id: d, text: { en: "An Azure Front Door profile with the cluster as its origin", fr: "Un profil Azure Front Door avec le cluster comme origine" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Application Gateway for Containers is the layer 7 load balancer for AKS workloads: Azure operates its data plane outside the cluster, and its ALB Controller implements Gateway API and Ingress. HTTPRoute resources can set weights to split traffic between backend versions.
        fr: |
          Application Gateway pour conteneurs est l'équilibreur de charge de couche 7 des charges de travail AKS : Azure exploite son plan de données en dehors du cluster, et son contrôleur ALB implémente Gateway API et Ingress. Les ressources HTTPRoute peuvent définir des poids pour répartir le trafic entre les versions des backends.
      options:
        a: { en: "Azure Load Balancer works at layer 4: it can't route HTTP requests or split them by weight between service versions.", fr: "Azure Load Balancer travaille en couche 4 : il ne peut ni router des requêtes HTTP ni les répartir par poids entre des versions de service." }
        c: { en: "Traffic Manager answers DNS queries and isn't in the data path; it isn't configured through Gateway API and doesn't route requests inside one cluster.", fr: "Traffic Manager répond aux requêtes DNS et n'est pas dans le chemin de données ; il ne se configure pas par Gateway API et ne route pas les requêtes à l'intérieur d'un cluster." }
        d: { en: "Azure Front Door is a global entry point at the Microsoft edge; it isn't driven by the cluster's Gateway API resources.", fr: "Azure Front Door est un point d'entrée mondial à la périphérie du réseau Microsoft ; il n'est pas piloté par les ressources Gateway API du cluster." }
    references:
      - title: What is Application Gateway for Containers?
        url: https://learn.microsoft.com/en-us/azure/application-gateway/for-containers/overview
      - title: Traffic Splitting with Application Gateway for Containers - Gateway API
        url: https://learn.microsoft.com/en-us/azure/application-gateway/for-containers/how-to-traffic-splitting-gateway-api

  # ------------------------------------------------------------------ 5
  - id: az305-qz-44-05
    objective: "4.4.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys provides a TCP-based licensing service to customers worldwide. The service runs behind regional Standard public load balancers in the East US and Southeast Asia regions, and on servers in the company's Frankfurt datacenter. Clients connect by using the DNS name of the service.

        You need to recommend a solution that sends each client to the deployment with the lowest network latency, including the Frankfurt datacenter. What should you recommend?
      fr: |
        Tailspin Toys fournit un service de licences basé sur TCP à des clients du monde entier. Le service s'exécute derrière des équilibreurs de charge publics Standard régionaux dans les régions USA Est et Asie Sud-Est, et sur des serveurs du centre de données de l'entreprise à Francfort. Les clients se connectent avec le nom DNS du service.

        Vous devez recommander une solution qui envoie chaque client vers le déploiement dont la latence réseau est la plus faible, y compris le centre de données de Francfort. Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Traffic Manager with the Performance routing method", fr: "Traffic Manager avec la méthode de routage Performance" } }
        - { id: b, text: { en: "Traffic Manager with the Priority routing method", fr: "Traffic Manager avec la méthode de routage Priority" } }
        - { id: c, text: { en: "The global tier of Azure Load Balancer", fr: "Le niveau global d'Azure Load Balancer" } }
        - { id: d, text: { en: "Azure Front Door with an origin group", fr: "Azure Front Door avec un groupe d'origines" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Traffic Manager works with any protocol because it only answers DNS queries. With the Performance routing method, it returns the endpoint with the lowest latency from the client's DNS resolver, and it accepts external endpoints such as the Frankfurt datacenter, for which you specify the closest Azure region.
        fr: |
          Traffic Manager fonctionne avec tout protocole, car il ne fait que répondre aux requêtes DNS. Avec la méthode de routage Performance, il renvoie le point de terminaison dont la latence est la plus faible depuis le résolveur DNS du client, et il accepte des points de terminaison externes comme le centre de données de Francfort, pour lesquels vous indiquez la région Azure la plus proche.
      options:
        b: { en: "Priority sends all clients to the highest-priority healthy endpoint, for failover; it doesn't pick the closest deployment.", fr: "Priority envoie tous les clients vers le point de terminaison sain de plus haute priorité, pour le basculement ; il ne choisit pas le déploiement le plus proche." }
        c: { en: "The global tier of Azure Load Balancer only fronts regional Standard public load balancers in Azure; it can't include the Frankfurt datacenter.", fr: "Le niveau global d'Azure Load Balancer ne se place que devant des équilibreurs de charge publics Standard régionaux dans Azure ; il ne peut pas inclure le centre de données de Francfort." }
        d: { en: "Azure Front Door handles HTTP(S) only; it can't carry a TCP licensing protocol.", fr: "Azure Front Door ne gère que HTTP(S) ; il ne peut pas transporter un protocole de licences TCP." }
    references:
      - title: Traffic Manager Routing Methods
        url: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-routing-methods

  # ------------------------------------------------------------------ 6
  - id: az305-qz-44-06
    objective: "4.4.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has a hub-and-spoke network in one Azure region. The hub contains Azure Firewall Standard, which already filters all the outbound internet traffic of the spokes. A spoke named **Spoke-Files** contains a virtual machine named **VM-SFTP** that has no public IP address.

        External partners must upload files to VM-SFTP by connecting from the internet to TCP port 22. You need to recommend a solution that meets the following requirements:

        - Every inbound connection to VM-SFTP must be filtered and logged by the central firewall, with threat intelligence.
        - VM-SFTP must not receive a public IP address.
        - The rules must be managed with the other rules of the firewall.
        - The cost must be minimized.

        What should you recommend?
      fr: |
        Woodgrove Bank dispose d'un réseau hub-and-spoke dans une région Azure. Le hub contient un Pare-feu Azure Standard, qui filtre déjà tout le trafic Internet sortant des spokes. Un spoke nommé **Spoke-Files** contient une machine virtuelle nommée **VM-SFTP** qui n'a pas d'adresse IP publique.

        Des partenaires externes doivent charger des fichiers sur VM-SFTP en se connectant depuis Internet au port TCP 22. Vous devez recommander une solution qui répond aux exigences suivantes :

        - Chaque connexion entrante vers VM-SFTP doit être filtrée et journalisée par le pare-feu central, avec le renseignement sur les menaces.
        - VM-SFTP ne doit pas recevoir d'adresse IP publique.
        - Les règles doivent être gérées avec les autres règles du pare-feu.
        - Le coût doit être réduit au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "A Standard public load balancer in Spoke-Files with an inbound NAT rule to VM-SFTP", fr: "Un équilibreur de charge public Standard dans Spoke-Files avec une règle NAT entrante vers VM-SFTP" } }
        - { id: b, text: { en: "A NAT gateway on the subnet of VM-SFTP, with a public IP address for the partners", fr: "Une passerelle NAT sur le sous-réseau de VM-SFTP, avec une adresse IP publique pour les partenaires" } }
        - { id: c, text: { en: "A DNAT rule on the hub firewall that translates its public IP address to VM-SFTP", fr: "Une règle DNAT sur le pare-feu du hub qui traduit son adresse IP publique vers VM-SFTP" } }
        - { id: d, text: { en: "An Azure Front Door Premium profile with a Private Link origin on VM-SFTP", fr: "Un profil Azure Front Door Premium avec une origine Private Link sur VM-SFTP" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A DNAT rule translates a public IP address and port of Azure Firewall to a private IP address and port, and it implicitly allows the translated traffic. Every partner connection then crosses the central firewall, which filters it, applies threat intelligence and logs it with the other rules. VM-SFTP keeps only its private address, and the existing firewall is reused.
        fr: |
          Une règle DNAT traduit une adresse IP publique et un port du Pare-feu Azure vers une adresse IP privée et un port, et autorise implicitement le trafic traduit. Chaque connexion de partenaire traverse alors le pare-feu central, qui la filtre, applique le renseignement sur les menaces et la journalise avec les autres règles. VM-SFTP ne garde que son adresse privée, et le pare-feu existant est réutilisé.
      options:
        a: { en: "A public load balancer publishes VM-SFTP without sending the connections through the central firewall, so they aren't inspected there.", fr: "Un équilibreur de charge public publie VM-SFTP sans faire passer les connexions par le pare-feu central ; elles n'y sont donc pas inspectées." }
        b: { en: "A NAT gateway provides outbound connectivity only and never accepts unsolicited inbound connections.", fr: "Une passerelle NAT ne fournit que la connectivité sortante et n'accepte jamais de connexion entrante non sollicitée." }
        d: { en: "Azure Front Door proxies HTTP(S) only; it can't publish an SFTP service on TCP port 22.", fr: "Azure Front Door n'est un proxy que pour HTTP(S) ; il ne peut pas publier un service SFTP sur le port TCP 22." }
    references:
      - title: Filter inbound Internet traffic with Azure Firewall DNAT using the portal
        url: https://learn.microsoft.com/en-us/azure/firewall/tutorial-firewall-dnat

  # ------------------------------------------------------------------ 7
  - id: az305-qz-44-07
    objective: "4.4.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware has a small Azure environment: a hub virtual network and three spoke virtual networks in one region. Its internet-bound traffic peaks at 180 Mbps. The security team proposes the following design:

        - Deploy Azure Firewall Basic in the hub.
        - On every spoke subnet, add a route `0.0.0.0/0` whose next hop is the private IP address of the firewall.
        - Allow outbound HTTP and HTTPS only to approved FQDNs, with application rules.

        The team must validate the design against further requirements.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'un petit environnement Azure : un réseau virtuel hub et trois réseaux virtuels spoke dans une région. Son trafic vers Internet culmine à 180 Mbit/s. L'équipe de sécurité propose la conception suivante :

        - Déployer un Pare-feu Azure Basic dans le hub.
        - Sur chaque sous-réseau spoke, ajouter un itinéraire `0.0.0.0/0` dont le tronçon suivant est l'adresse IP privée du pare-feu.
        - N'autoriser le trafic HTTP et HTTPS sortant que vers des FQDN approuvés, avec des règles d'application.

        L'équipe doit valider la conception par rapport à d'autres exigences.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "With this design, all the internet-bound traffic of the spoke subnets is sent to the firewall for filtering.", fr: "Avec cette conception, tout le trafic des sous-réseaux spoke destiné à Internet est envoyé au pare-feu pour être filtré." }
        - id: s2
          text: { en: "If the team also requires blocking connections to IP addresses and domains known to be malicious, Azure Firewall Basic meets that requirement.", fr: "Si l'équipe exige aussi de bloquer les connexions vers des adresses IP et des domaines connus comme malveillants, le Pare-feu Azure Basic répond à cette exigence." }
        - id: s3
          text: { en: "If the team also requires blocking HTTPS requests to www.fabrikam.com/admin while allowing the rest of www.fabrikam.com, Azure Firewall Standard meets that requirement.", fr: "Si l'équipe exige aussi de bloquer les requêtes HTTPS vers www.fabrikam.com/admin tout en autorisant le reste de www.fabrikam.com, le Pare-feu Azure Standard répond à cette exigence." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          A `0.0.0.0/0` user-defined route with the firewall's private IP address as the next hop forces the internet-bound traffic of the spokes through the firewall, and Basic covers 180 Mbps (up to 250 Mbps) and FQDN-based application rules. Basic only alerts on threat intelligence matches: blocking them needs Standard. Filtering a URL on its full path requires TLS inspection, which only Premium provides; Standard filters on the FQDN.
        fr: |
          Un itinéraire défini par l'utilisateur `0.0.0.0/0` dont le tronçon suivant est l'adresse IP privée du pare-feu fait passer le trafic des spokes destiné à Internet par le pare-feu, et Basic couvre 180 Mbit/s (jusqu'à 250 Mbit/s) ainsi que les règles d'application basées sur les FQDN. Basic ne fait qu'alerter sur les correspondances du renseignement sur les menaces : les bloquer exige Standard. Filtrer une URL sur son chemin complet exige l'inspection TLS, que seul Premium fournit ; Standard filtre sur le FQDN.
      options:
        s2: { en: "Threat intelligence works in alert mode only on Basic; Standard and Premium can deny the traffic.", fr: "Le renseignement sur les menaces fonctionne uniquement en mode alerte sur Basic ; Standard et Premium peuvent refuser le trafic." }
        s3: { en: "Standard sees only the FQDN of HTTPS traffic; URL filtering on the full path is a Premium feature based on TLS inspection.", fr: "Standard ne voit que le FQDN du trafic HTTPS ; le filtrage d'URL sur le chemin complet est une fonctionnalité Premium fondée sur l'inspection TLS." }
    references:
      - title: Choose the right Azure Firewall SKU to meet your needs
        url: https://learn.microsoft.com/en-us/azure/firewall/choose-firewall-sku

  # ------------------------------------------------------------------ 8
  - id: az305-qz-44-08
    objective: "4.4.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam runs a video platform. Images and video segments are delivered from Azure Storage to users worldwide through an endpoint of Azure CDN Standard from Microsoft (classic). A transcoding pipeline runs in the West Europe region on two tiers of virtual machines that exchange large volumes of data.

        You need to recommend changes. The solution must meet the following requirements:

        - Keep edge caching for worldwide users after the retirement of the classic CDN offer.
        - No Private Link to origins and no Microsoft-managed WAF rule set are needed.
        - Minimize the latency and the host CPU used for networking between the two transcoding tiers. Failed jobs are rerun, so the pipeline doesn't need to survive an availability zone failure.
        - Minimize costs.

        Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam exploite une plateforme vidéo. Les images et les segments vidéo sont distribués depuis Stockage Azure aux utilisateurs du monde entier par un point de terminaison Azure CDN Standard de Microsoft (classique). Un pipeline de transcodage s'exécute dans la région Europe Ouest sur deux niveaux de machines virtuelles qui échangent de grands volumes de données.

        Vous devez recommander des modifications. La solution doit répondre aux exigences suivantes :

        - Conserver la mise en cache en périphérie pour les utilisateurs du monde entier après le retrait de l'offre CDN classique.
        - Ni Private Link vers les origines ni ensemble de règles WAF géré par Microsoft ne sont nécessaires.
        - Réduire au minimum la latence et le processeur de l'hôte consacré au réseau entre les deux niveaux de transcodage. Les travaux en échec sont relancés ; le pipeline n'a donc pas besoin de survivre à la panne d'une zone de disponibilité.
        - Réduire les coûts au minimum.

        Quelles deux actions devez-vous inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Migrate the CDN endpoint to an Azure Front Door Premium profile.", fr: "Migrer le point de terminaison CDN vers un profil Azure Front Door Premium." } }
        - { id: b, text: { en: "Migrate the CDN endpoint to an Azure Front Door Standard profile.", fr: "Migrer le point de terminaison CDN vers un profil Azure Front Door Standard." } }
        - { id: c, text: { en: "Replace the CDN endpoint with a Traffic Manager profile that uses Performance routing.", fr: "Remplacer le point de terminaison CDN par un profil Traffic Manager qui utilise le routage Performance." } }
        - { id: d, text: { en: "Spread both tiers across three availability zones in one proximity placement group.", fr: "Répartir les deux niveaux sur trois zones de disponibilité dans un groupe de placement de proximité." } }
        - { id: e, text: { en: "Put both tiers in one proximity placement group, with accelerated networking.", fr: "Placer les deux niveaux dans un groupe de placement de proximité, avec la mise en réseau accélérée." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          Azure CDN Standard from Microsoft (classic) retires on September 30, 2027, and Microsoft directs its users to Azure Front Door Standard or Premium; Standard keeps caching and is cheaper, since the Premium-only features aren't needed. A proximity placement group keeps the virtual machines physically close, and accelerated networking bypasses the host and its virtual switch, which lowers latency, jitter and CPU use.
        fr: |
          Azure CDN Standard de Microsoft (classique) sera retiré le 30 septembre 2027, et Microsoft oriente ses utilisateurs vers Azure Front Door Standard ou Premium ; Standard conserve la mise en cache et coûte moins cher, puisque les fonctionnalités propres à Premium ne sont pas nécessaires. Un groupe de placement de proximité garde les machines virtuelles physiquement proches, et la mise en réseau accélérée contourne l'hôte et son commutateur virtuel, ce qui réduit la latence, la gigue et l'utilisation du processeur.
      options:
        a: { en: "Front Door Premium adds Private Link origins, managed WAF rule sets and bot protection, none of which is needed: it costs more than Standard.", fr: "Front Door Premium ajoute les origines Private Link, les ensembles de règles WAF gérés et la protection contre les bots, dont aucun n'est nécessaire : il coûte plus cher que Standard." }
        c: { en: "Traffic Manager only answers DNS queries; it provides no edge caching.", fr: "Traffic Manager ne fait que répondre aux requêtes DNS ; il ne fournit aucune mise en cache en périphérie." }
        d: { en: "A proximity placement group can't span availability zones, and zone resilience isn't required here.", fr: "Un groupe de placement de proximité ne peut pas s'étendre sur plusieurs zones de disponibilité, et la résilience de zone n'est pas exigée ici." }
    references:
      - title: Comparison Between Azure Front Door and Azure Content Delivery Network
        url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-cdn-comparison

  # ------------------------------------------------------------------ 9
  - id: az305-qz-44-09
    objective: "4.4.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso operates a genomics laboratory whose sequencers produce data continuously. The data must be ingested into virtual machines in a virtual network and into Azure Storage accounts through their public endpoints, at a sustained rate of 60 Gbps.

        You need to recommend a connectivity solution. The solution must meet the following requirements:

        - The traffic must not cross the public internet.
        - Contoso's connectivity must use dedicated physical ports that aren't shared with other customers.
        - The link between Contoso's edge routers and the Microsoft routers must be encrypted at layer 2.
        - Both the virtual network and the public endpoints of Azure Storage must be reachable through the connection.

        What should you recommend? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso exploite un laboratoire de génomique dont les séquenceurs produisent des données en continu. Les données doivent être ingérées dans des machines virtuelles d'un réseau virtuel et dans des comptes Stockage Azure par leurs points de terminaison publics, à un débit soutenu de 60 Gbit/s.

        Vous devez recommander une solution de connectivité. La solution doit répondre aux exigences suivantes :

        - Le trafic ne doit pas traverser l'Internet public.
        - La connectivité de Contoso doit utiliser des ports physiques dédiés, non partagés avec d'autres clients.
        - La liaison entre les routeurs de périphérie de Contoso et les routeurs Microsoft doit être chiffrée en couche 2.
        - Le réseau virtuel et les points de terminaison publics de Stockage Azure doivent être tous deux accessibles par la connexion.

        Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Connection: [[conn]]

          Encryption: [[enc]]

          Peering: [[peering]]
        fr: |
          Connexion : [[conn]]

          Chiffrement : [[enc]]

          Peering : [[peering]]
      slots:
        - id: conn
          options:
            - { id: provider, text: { en: "A 10-Gbps ExpressRoute circuit from a connectivity provider", fr: "Un circuit ExpressRoute de 10 Gbit/s d'un fournisseur de connectivité" } }
            - { id: direct, text: { en: "ExpressRoute Direct with 100-Gbps ports", fr: "ExpressRoute Direct avec des ports de 100 Gbit/s" } }
            - { id: vpn, text: { en: "Site-to-site VPN connections to a VpnGw5AZ gateway", fr: "Des connexions VPN de site à site vers une passerelle VpnGw5AZ" } }
            - { id: vwan, text: { en: "An Azure Virtual WAN hub with site-to-site VPN", fr: "Un hub Azure Virtual WAN avec un VPN de site à site" } }
        - id: enc
          options:
            - { id: macsec, text: { en: "MACsec, with the key stored in Azure Key Vault", fr: "MACsec, avec la clé stockée dans Azure Key Vault" } }
            - { id: ipsec, text: { en: "An IPsec tunnel over the private peering", fr: "Un tunnel IPsec sur le peering privé" } }
            - { id: none, text: { en: "None: ExpressRoute encrypts traffic by default", fr: "Aucun : ExpressRoute chiffre le trafic par défaut" } }
        - id: peering
          options:
            - { id: private, text: { en: "Private peering only", fr: "Peering privé uniquement" } }
            - { id: microsoft, text: { en: "Microsoft peering only", fr: "Peering Microsoft uniquement" } }
            - { id: both, text: { en: "Private peering and Microsoft peering", fr: "Peering privé et peering Microsoft" } }
    answer:
      values: { conn: direct, enc: macsec, peering: both }
    explanation:
      correct:
        en: |
          ExpressRoute Direct provides dedicated 10, 100 or 400 Gbps ports on the Microsoft network for large data ingestion and physical isolation; 60 Gbps needs 100-Gbps ports. MACsec encrypts at layer 2 between your routers and the Microsoft routers, is available only on ExpressRoute Direct, and uses a key that you store in Key Vault. Private peering reaches the virtual network, and Microsoft peering reaches Azure public services such as Azure Storage.
        fr: |
          ExpressRoute Direct fournit des ports dédiés de 10, 100 ou 400 Gbit/s sur le réseau Microsoft pour l'ingestion de grands volumes et l'isolation physique ; 60 Gbit/s exigent des ports de 100 Gbit/s. MACsec chiffre en couche 2 entre vos routeurs et les routeurs Microsoft, n'est disponible que sur ExpressRoute Direct et utilise une clé que vous stockez dans Key Vault. Le peering privé atteint le réseau virtuel, et le peering Microsoft atteint les services publics Azure comme Stockage Azure.
      options:
        provider: { en: "A provider circuit tops out at 10 Gbps, shares the provider's ports and doesn't support MACsec.", fr: "Un circuit de fournisseur plafonne à 10 Gbit/s, partage les ports du fournisseur et ne prend pas en charge MACsec." }
        vpn: { en: "A VPN crosses the public internet, and even the largest VPN gateway SKU stays far below 60 Gbps.", fr: "Un VPN traverse l'Internet public, et même la plus grande référence SKU de passerelle VPN reste loin de 60 Gbit/s." }
        ipsec: { en: "IPsec encrypts at layer 3 and goes through a VPN gateway, whose throughput can't carry 60 Gbps.", fr: "IPsec chiffre en couche 3 et passe par une passerelle VPN, dont le débit ne peut pas transporter 60 Gbit/s." }
        none: { en: "ExpressRoute traffic isn't encrypted by default.", fr: "Le trafic ExpressRoute n'est pas chiffré par défaut." }
    references:
      - title: About Azure ExpressRoute Direct
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-erdirect-about
      - title: About encryption for Azure ExpressRoute
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-encryption

  # ------------------------------------------------------------------ 10
  - id: az305-qz-44-10
    objective: "4.4.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Traders is designing the global entry point of three workloads:

        | Workload | Description |
        | --- | --- |
        | Portal | HTTPS application in the East US and West Europe regions. In each region, an Application Gateway WAF_v2 routes the requests by URL path to virtual machines inside the virtual network. |
        | License | TCP service that runs in two Azure regions and in an on-premises datacenter. Clients use its DNS name. |
        | Telemetry | UDP service published on external IPv4 addresses at several hosting providers. Clients use its DNS name and retry on their own. |

        You need to recommend a solution that meets the following requirements:

        - Portal: a single global entry point with TLS offload at the edge and a failover between regions that doesn't depend on DNS caching. The regional Application Gateways must keep processing the requests.
        - License: clients whose source IP addresses belong to the known ranges of partner networks must always be sent to the on-premises datacenter; the other clients are sent to Azure.
        - Telemetry: each DNS response must contain several healthy endpoints, so that clients can fall back to another one.

        What should you recommend for each workload? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders conçoit le point d'entrée mondial de trois charges de travail :

        | Charge de travail | Description |
        | --- | --- |
        | Portal | Application HTTPS dans les régions USA Est et Europe Ouest. Dans chaque région, un Application Gateway WAF_v2 route les requêtes selon le chemin d'URL vers des machines virtuelles à l'intérieur du réseau virtuel. |
        | License | Service TCP qui s'exécute dans deux régions Azure et dans un centre de données local. Les clients utilisent son nom DNS. |
        | Telemetry | Service UDP publié sur des adresses IPv4 externes chez plusieurs hébergeurs. Les clients utilisent son nom DNS et réessaient d'eux-mêmes. |

        Vous devez recommander une solution qui répond aux exigences suivantes :

        - Portal : un seul point d'entrée mondial avec le déchargement TLS en périphérie et un basculement entre régions qui ne dépend pas de la mise en cache DNS. Les Application Gateway régionaux doivent continuer de traiter les requêtes.
        - License : les clients dont les adresses IP sources appartiennent aux plages connues des réseaux partenaires doivent toujours être envoyés vers le centre de données local ; les autres clients sont envoyés vers Azure.
        - Telemetry : chaque réponse DNS doit contenir plusieurs points de terminaison sains, afin que les clients puissent se replier sur un autre.

        Que devez-vous recommander pour chaque charge de travail ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Portal: [[portal]]

          License: [[license]]

          Telemetry: [[telemetry]]
        fr: |
          Portal : [[portal]]

          License : [[license]]

          Telemetry : [[telemetry]]
      slots:
        - id: portal
          options:
            - { id: afd, text: { en: "Azure Front Door in front of the Application Gateways", fr: "Azure Front Door devant les Application Gateway" } }
            - { id: tmprio, text: { en: "Traffic Manager with Priority routing in front of the Application Gateways", fr: "Traffic Manager avec le routage Priority devant les Application Gateway" } }
            - { id: glb, text: { en: "The global tier of Azure Load Balancer in front of the Application Gateways", fr: "Le niveau global d'Azure Load Balancer devant les Application Gateway" } }
        - id: license
          options:
            - { id: geo, text: { en: "Traffic Manager with Geographic routing", fr: "Traffic Manager avec le routage Geographic" } }
            - { id: perf, text: { en: "Traffic Manager with Performance routing", fr: "Traffic Manager avec le routage Performance" } }
            - { id: subnet, text: { en: "Traffic Manager with Subnet routing", fr: "Traffic Manager avec le routage Subnet" } }
            - { id: multi, text: { en: "Traffic Manager with MultiValue routing", fr: "Traffic Manager avec le routage MultiValue" } }
        - id: telemetry
          options:
            - { id: geo, text: { en: "Traffic Manager with Geographic routing", fr: "Traffic Manager avec le routage Geographic" } }
            - { id: perf, text: { en: "Traffic Manager with Performance routing", fr: "Traffic Manager avec le routage Performance" } }
            - { id: subnet, text: { en: "Traffic Manager with Subnet routing", fr: "Traffic Manager avec le routage Subnet" } }
            - { id: multi, text: { en: "Traffic Manager with MultiValue routing", fr: "Traffic Manager avec le routage MultiValue" } }
    answer:
      values: { portal: afd, license: subnet, telemetry: multi }
    explanation:
      correct:
        en: |
          Azure Front Door is a global layer 7 proxy: it offloads TLS at the edge and fails over between origins without waiting for DNS caches, and placing it in front of Application Gateway keeps the per-request processing inside each virtual network. Subnet routing maps client source IP ranges to specific endpoints, with a fallback endpoint for the other clients. MultiValue returns several healthy endpoints in one response, and it requires all endpoints to be external IPv4 or IPv6 addresses, as Telemetry's are.
        fr: |
          Azure Front Door est un proxy mondial de couche 7 : il décharge le TLS en périphérie et bascule entre les origines sans attendre l'expiration des caches DNS, et le placer devant Application Gateway conserve le traitement par requête dans chaque réseau virtuel. Le routage Subnet associe des plages d'adresses IP sources des clients à des points de terminaison précis, avec un point de terminaison de repli pour les autres clients. MultiValue renvoie plusieurs points de terminaison sains dans une même réponse et exige que tous les points de terminaison soient des adresses IPv4 ou IPv6 externes, comme ceux de Telemetry.
      options:
        tmprio: { en: "Traffic Manager isn't in the data path: it can't offload TLS, and its failover waits for DNS caches to expire.", fr: "Traffic Manager n'est pas dans le chemin de données : il ne peut pas décharger le TLS, et son basculement attend l'expiration des caches DNS." }
        glb: { en: "The global tier of Azure Load Balancer is a layer 4 service in front of regional Standard public load balancers; it offloads no TLS.", fr: "Le niveau global d'Azure Load Balancer est un service de couche 4 placé devant des équilibreurs de charge publics Standard régionaux ; il ne décharge pas le TLS." }
        geo: { en: "Geographic routing uses the location of the DNS query's origin, not the known IP ranges of the partner networks.", fr: "Le routage Geographic utilise l'emplacement d'origine de la requête DNS, pas les plages d'adresses IP connues des réseaux partenaires." }
        perf: { en: "Performance routing returns the single endpoint with the lowest latency; it neither honors source IP ranges nor returns several endpoints.", fr: "Le routage Performance renvoie le seul point de terminaison de plus faible latence ; il ne tient pas compte des plages d'adresses IP sources et ne renvoie pas plusieurs points de terminaison." }
    references:
      - title: Traffic Manager Routing Methods
        url: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-routing-methods
      - title: Comparison Between Azure Front Door and Azure Content Delivery Network
        url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-cdn-comparison
