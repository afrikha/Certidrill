chapter: 23-data-integration
questions:
  # ------------------------------------------------------------------ 1
  - id: az305-qz-23-01
    objective: "2.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank uses Azure Data Factory to copy a table named **Trades** from an Azure SQL database to Parquet files in a folder of an Azure Data Lake Storage account. A copy activity reads the table and writes the files.

        Which Data Factory component represents the Trades table, and the folder of Parquet files, as the input and the output of the copy activity?
      fr: |
        Woodgrove Bank utilise Azure Data Factory pour copier une table nommée **Trades** d'une base de données Azure SQL vers des fichiers Parquet dans un dossier d'un compte Azure Data Lake Storage. Une activité de copie lit la table et écrit les fichiers.

        Quel composant de Data Factory représente la table Trades et le dossier de fichiers Parquet comme entrée et sortie de l'activité de copie ?
    body:
      options:
        - { id: a, text: { en: "Linked service", fr: "Service lié" } }
        - { id: b, text: { en: "Dataset", fr: "Jeu de données" } }
        - { id: c, text: { en: "Integration runtime", fr: "Runtime d'intégration" } }
        - { id: d, text: { en: "Pipeline", fr: "Pipeline" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A dataset represents a data structure within a data store, such as a table or a folder of files, and points to the data that an activity uses as input or output. The copy activity therefore has one dataset for the Trades table and one for the Parquet folder.
        fr: |
          Un jeu de données représente une structure de données dans un magasin de données, comme une table ou un dossier de fichiers, et pointe vers les données qu'une activité utilise en entrée ou en sortie. L'activité de copie a donc un jeu de données pour la table Trades et un autre pour le dossier Parquet.
      options:
        a: { en: "A linked service holds the connection information, like a connection string, for the database or the storage account, not a specific table or folder.", fr: "Un service lié contient les informations de connexion, comme une chaîne de connexion, de la base de données ou du compte de stockage, pas une table ou un dossier précis." }
        c: { en: "The integration runtime is the compute that runs the copy, not a representation of the data.", fr: "Le runtime d'intégration est le calcul qui exécute la copie, pas une représentation des données." }
        d: { en: "A pipeline is the logical group of activities that performs the unit of work.", fr: "Un pipeline est le regroupement logique d'activités qui effectue l'unité de travail." }
    references:
      - title: Introduction to Azure Data Factory - Azure Data Factory
        url: https://learn.microsoft.com/en-us/azure/data-factory/introduction

  # ------------------------------------------------------------------ 2
  - id: az305-qz-23-02
    objective: "2.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso sends order events to Azure Event Hubs. For each event, custom C# code must call the REST API of a partner to reserve stock. Each event is processed independently, and no state is kept between events.

        You need to recommend a service to run the code. The solution must avoid managing servers.

        What should you recommend?
      fr: |
        Contoso envoie des événements de commande à Azure Event Hubs. Pour chaque événement, du code C# personnalisé doit appeler l'API REST d'un partenaire pour réserver du stock. Chaque événement est traité indépendamment, et aucun état n'est conservé entre les événements.

        Vous devez recommander un service pour exécuter le code. La solution doit éviter de gérer des serveurs.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: Azure Functions }
        - { id: b, text: Azure Stream Analytics }
        - { id: c, text: Azure Data Explorer }
        - { id: d, text: Azure Data Factory }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Azure Functions is the serverless compute service for event-driven processing, and it can process the events of an event hub as they arrive. Functions are stateless by design, which matches custom code that handles each event independently.
        fr: |
          Azure Functions est le service de calcul serverless du traitement piloté par les événements, et il peut traiter les événements d'un hub d'événements à leur arrivée. Les fonctions sont sans état par conception, ce qui correspond à du code personnalisé qui traite chaque événement indépendamment.
      options:
        b: { en: "Stream Analytics runs SQL-based queries for filtering, aggregations and joins over streams, not custom C# code that calls an API for each event.", fr: "Stream Analytics exécute des requêtes de type SQL pour filtrer, agréger et joindre des flux, pas du code C# personnalisé qui appelle une API pour chaque événement." }
        c: { en: "Azure Data Explorer stores and analyzes logs and telemetry with KQL; it doesn't run custom code for each event.", fr: "Azure Data Explorer stocke et analyse des journaux et de la télémétrie avec KQL ; il n'exécute pas de code personnalisé pour chaque événement." }
        d: { en: "Data Factory orchestrates batch movement and transformation of data; it doesn't process individual events as they arrive.", fr: "Data Factory orchestre le déplacement et la transformation de données par lots ; il ne traite pas des événements individuels à leur arrivée." }
    references:
      - title: Choose a Stream Processing Technology - Azure Architecture Center
        url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/technology-choices/stream-processing
      - title: Azure Functions Overview
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview

  # ------------------------------------------------------------------ 3
  - id: az305-qz-23-03
    objective: "2.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam's data engineers maintain PySpark notebooks in an Azure Databricks workspace. The notebooks transform the sales data that lands in Azure Data Lake Storage every night. Today, the data is copied from 15 SaaS applications by scripts that the team wants to retire.

        You need to recommend a solution that copies the data with built-in connectors and then runs the existing notebooks, in one scheduled workflow. The notebooks must not be rewritten.

        What should you recommend?
      fr: |
        Les ingénieurs de données de Fabrikam maintiennent des notebooks PySpark dans un espace de travail Azure Databricks. Les notebooks transforment les données de ventes qui arrivent chaque nuit dans Azure Data Lake Storage. Aujourd'hui, les données sont copiées depuis 15 applications SaaS par des scripts que l'équipe veut abandonner.

        Vous devez recommander une solution qui copie les données avec des connecteurs intégrés, puis exécute les notebooks existants, dans un seul flux de travail planifié. Les notebooks ne doivent pas être réécrits.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "A Data Factory pipeline with copy activities, followed by Databricks Notebook activities", fr: "Un pipeline Data Factory avec des activités de copie, suivies d'activités Databricks Notebook" } }
        - { id: b, text: { en: "A Data Factory pipeline with copy activities, followed by mapping data flow activities", fr: "Un pipeline Data Factory avec des activités de copie, suivies d'activités de flux de données de mappage" } }
        - { id: c, text: { en: "An Azure Stream Analytics job that reads the SaaS applications and then starts the notebooks", fr: "Un travail Azure Stream Analytics qui lit les applications SaaS puis lance les notebooks" } }
        - { id: d, text: { en: "A Data Factory pipeline that runs the copies and the notebooks on an Azure-SSIS integration runtime", fr: "Un pipeline Data Factory qui exécute les copies et les notebooks sur un runtime d'intégration Azure-SSIS" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Data Factory orchestrates and copies: copy activities use its built-in connectors for the SaaS sources, and the Azure Databricks Notebook activity runs an existing notebook in the Databricks workspace. A single scheduled pipeline chains both steps, and the transformations stay in the notebooks that the engineers maintain.
        fr: |
          Data Factory orchestre et copie : les activités de copie utilisent ses connecteurs intégrés pour les sources SaaS, et l'activité Azure Databricks Notebook exécute un notebook existant dans l'espace de travail Databricks. Un seul pipeline planifié enchaîne les deux étapes, et les transformations restent dans les notebooks que maintiennent les ingénieurs.
      options:
        b: { en: "Mapping data flows would replace the notebooks with new visual transformations, which means rewriting them.", fr: "Les flux de données de mappage remplaceraient les notebooks par de nouvelles transformations visuelles, ce qui revient à les réécrire." }
        c: { en: "Stream Analytics processes event streams from inputs such as Event Hubs; it neither copies from SaaS applications nor orchestrates notebooks.", fr: "Stream Analytics traite des flux d'événements issus d'entrées comme Event Hubs ; il ne copie pas depuis des applications SaaS et n'orchestre pas de notebooks." }
        d: { en: "The Azure-SSIS integration runtime executes SSIS packages only; copies and Databricks notebooks don't run on it.", fr: "Le runtime d'intégration Azure-SSIS exécute uniquement des packages SSIS ; les copies et les notebooks Databricks ne s'y exécutent pas." }
    references:
      - title: Transform data with Databricks Notebook - Azure Data Factory & Azure Synapse
        url: https://learn.microsoft.com/en-us/azure/data-factory/transform-data-databricks-notebook
      - title: Integration runtime - Azure Data Factory & Azure Synapse
        url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-integration-runtime

  # ------------------------------------------------------------------ 4
  - id: az305-qz-23-04
    objective: "2.3.1"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum is designing an extract, load, transform (ELT) platform. Raw clickstream files will be loaded unchanged into an Azure Data Lake Storage account every hour. Azure Databricks jobs will then build curated tables from these files, in the same account.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum conçoit une plateforme ELT (extraction, chargement, transformation). Des fichiers bruts de parcours de navigation seront chargés tels quels dans un compte Azure Data Lake Storage toutes les heures. Des travaux Azure Databricks créeront ensuite des tables organisées à partir de ces fichiers, dans le même compte.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "After the curated tables are built, the raw files can still serve other uses, such as a machine learning project that starts next year.", fr: "Une fois les tables organisées créées, les fichiers bruts peuvent encore servir à d'autres usages, comme un projet de machine learning qui démarre l'an prochain." }
        - id: s2
          text: { en: "The Databricks jobs must first copy the raw files into the storage of the Databricks workspace before they can process them.", fr: "Les travaux Databricks doivent d'abord copier les fichiers bruts dans le stockage de l'espace de travail Databricks avant de pouvoir les traiter." }
        - id: s3
          text: { en: "In this design, the clickstream data is transformed before it is written to the data lake.", fr: "Dans cette conception, les données de parcours de navigation sont transformées avant d'être écrites dans le lac de données." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          In ELT, the raw data is loaded first and transformed afterwards with the engine of the target, so the raw files stay in the lake for uses that aren't known yet. Spark reads Azure Data Lake Storage in place through the ABFS driver, so no copy is needed before the analysis. Transforming before loading is the definition of ETL, not of this design.
        fr: |
          En ELT, les données brutes sont d'abord chargées puis transformées avec le moteur de la cible : les fichiers bruts restent donc dans le lac pour des usages qui ne sont pas encore connus. Spark lit Azure Data Lake Storage sur place via le pilote ABFS : aucune copie n'est nécessaire avant l'analyse. Transformer avant de charger est la définition de l'ETL, pas celle de cette conception.
      options:
        s2: { en: "Frameworks such as Apache Spark access Data Lake Storage directly through ABFS, without copying or transforming the data first.", fr: "Des infrastructures comme Apache Spark accèdent directement à Data Lake Storage via ABFS, sans copier ni transformer les données au préalable." }
        s3: { en: "In ELT, the transformation takes place in the target store after the load; ETL transforms the data before loading it.", fr: "En ELT, la transformation a lieu dans le magasin cible après le chargement ; l'ETL transforme les données avant de les charger." }
    references:
      - title: Extract, transform, load (ETL) - Azure Architecture Center
        url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/relational-data/etl
      - title: Azure Data Lake Storage overview - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction

  # ------------------------------------------------------------------ 5
  - id: az305-qz-23-05
    objective: "2.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware uses Azure Databricks with Unity Catalog. Its data scientists trained a fraud detection model in Python and track it with MLflow. Card transactions arrive continuously in Azure Event Hubs.

        You need to recommend a solution that scores each transaction with the model as it arrives and writes the results to Delta Lake tables in the data lake. The data scientists must reuse their Python code.

        What should you recommend?
      fr: |
        Litware utilise Azure Databricks avec Unity Catalog. Ses scientifiques des données ont entraîné un modèle de détection de fraude en Python et le suivent avec MLflow. Les transactions par carte arrivent en continu dans Azure Event Hubs.

        Vous devez recommander une solution qui évalue chaque transaction avec le modèle à son arrivée et écrit les résultats dans des tables Delta Lake du lac de données. Les scientifiques des données doivent réutiliser leur code Python.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "An Azure Stream Analytics job with a SQL query over the event hub", fr: "Un travail Azure Stream Analytics avec une requête SQL sur le hub d'événements" } }
        - { id: b, text: { en: "Spark Structured Streaming jobs on Azure Databricks", fr: "Des travaux Spark Structured Streaming sur Azure Databricks" } }
        - { id: c, text: { en: "A Data Factory mapping data flow that runs every hour", fr: "Un flux de données de mappage Data Factory exécuté toutes les heures" } }
        - { id: d, text: { en: "An Azure Data Explorer cluster that ingests the event hub", fr: "Un cluster Azure Data Explorer qui ingère le hub d'événements" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Spark Structured Streaming on Azure Databricks processes streams with the same Spark APIs as batch jobs, so the Python scoring code and the MLflow model can be reused on the stream. It reads Event Hubs incrementally and uses Delta Lake tables as streaming sinks with exactly-once guarantees.
        fr: |
          Spark Structured Streaming sur Azure Databricks traite les flux avec les mêmes API Spark que les traitements par lots : le code Python d'évaluation et le modèle MLflow peuvent donc être réutilisés sur le flux. Il lit Event Hubs de manière incrémentielle et utilise des tables Delta Lake comme récepteurs de streaming avec des garanties « exactly-once ».
      options:
        a: { en: "Stream Analytics suits simple SQL-based filtering and aggregations; the Python code of the data scientists can't be reused in its query.", fr: "Stream Analytics convient au filtrage et aux agrégations simples en SQL ; le code Python des scientifiques des données ne peut pas être réutilisé dans sa requête." }
        c: { en: "A mapping data flow is a visual batch transformation: an hourly run doesn't score transactions as they arrive and reuses no Python code.", fr: "Un flux de données de mappage est une transformation visuelle par lots : une exécution horaire n'évalue pas les transactions à leur arrivée et ne réutilise aucun code Python." }
        d: { en: "Azure Data Explorer stores and queries telemetry with KQL; it doesn't run the Python model on the stream to write Delta Lake tables.", fr: "Azure Data Explorer stocke et interroge de la télémétrie avec KQL ; il n'exécute pas le modèle Python sur le flux pour écrire des tables Delta Lake." }
    references:
      - title: Structured Streaming concepts - Azure Databricks
        url: https://learn.microsoft.com/en-us/azure/databricks/structured-streaming/
      - title: Choose a Stream Processing Technology - Azure Architecture Center
        url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/technology-choices/stream-processing

  # ------------------------------------------------------------------ 6
  - id: az305-qz-23-06
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys operates 8,000 delivery vans. Every second, each van sends its position and engine metrics to an Azure event hub. You are designing the analytics solution, which must meet the following requirements:

        - **Hot path**: dispatchers watch a live dashboard of the vans in alert, updated within seconds. The team writes its queries in SQL and must not manage any cluster.
        - **Warm path**: a mobile app used on three continents retrieves the latest position and the totals of the last hour of a given van, by its identifier, in a few milliseconds.
        - **Cold path**: five years of raw telemetry are kept at the lowest cost, and data scientists retrain models on them every month with PySpark.

        What should you include in the recommendation? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys exploite 8 000 camionnettes de livraison. Chaque seconde, chaque camionnette envoie sa position et ses mesures moteur à un hub d'événements Azure. Vous concevez la solution d'analytique, qui doit répondre aux exigences suivantes :

        - **Chemin chaud** : les répartiteurs suivent un tableau de bord en direct des camionnettes en alerte, mis à jour en quelques secondes. L'équipe écrit ses requêtes en SQL et ne doit gérer aucun cluster.
        - **Chemin tiède** : une application mobile utilisée sur trois continents récupère la dernière position et les totaux de la dernière heure d'une camionnette donnée, par son identifiant, en quelques millisecondes.
        - **Chemin froid** : cinq ans de télémétrie brute sont conservés au coût le plus bas, et des scientifiques des données réentraînent des modèles dessus chaque mois avec PySpark.

        Que devez-vous inclure dans la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Hot path: [[hot]]

          Store of the warm path: [[warm]]

          Cold path: [[cold]]
        fr: |
          Chemin chaud : [[hot]]

          Magasin du chemin tiède : [[warm]]

          Chemin froid : [[cold]]
      slots:
        - id: hot
          options:
            - { id: asa, text: { en: "An Azure Stream Analytics job with a Power BI output", fr: "Un travail Azure Stream Analytics avec une sortie Power BI" } }
            - { id: adf, text: { en: "An Azure Data Factory pipeline that runs every minute", fr: "Un pipeline Azure Data Factory exécuté toutes les minutes" } }
            - { id: dbx, text: { en: "An Azure Databricks job that runs every night", fr: "Un travail Azure Databricks exécuté chaque nuit" } }
            - { id: dedicated, text: { en: "An Azure Synapse Analytics dedicated SQL pool", fr: "Un pool SQL dédié Azure Synapse Analytics" } }
        - id: warm
          options:
            - { id: cosmos, text: Azure Cosmos DB }
            - { id: adls, text: Azure Data Lake Storage }
            - { id: serverless, text: { en: "An Azure Synapse Analytics serverless SQL pool", fr: "Un pool SQL serverless Azure Synapse Analytics" } }
            - { id: eh, text: { en: "Azure Event Hubs with a seven-day retention", fr: "Azure Event Hubs avec une rétention de sept jours" } }
        - id: cold
          options:
            - { id: lake, text: { en: "Azure Data Lake Storage, processed by Azure Databricks", fr: "Azure Data Lake Storage, traité par Azure Databricks" } }
            - { id: cosmosasa, text: { en: "Azure Cosmos DB, processed by Azure Stream Analytics", fr: "Azure Cosmos DB, traité par Azure Stream Analytics" } }
            - { id: ehfunc, text: { en: "Azure Event Hubs, processed by Azure Functions", fr: "Azure Event Hubs, traité par Azure Functions" } }
            - { id: dwh, text: { en: "An Azure Synapse Analytics dedicated SQL pool, loaded every night", fr: "Un pool SQL dédié Azure Synapse Analytics, chargé chaque nuit" } }
    answer:
      values: { hot: asa, warm: cosmos, cold: lake }
    explanation:
      correct:
        en: |
          The hot path is computed on the stream as the events arrive: Stream Analytics runs SQL queries over the event hub without any cluster and has a Power BI output for live dashboards. The warm path keeps recent data in a store that serves key lookups in milliseconds to several continents, which is Azure Cosmos DB, also a Stream Analytics output. The cold path is the batch layer: Data Lake Storage keeps years of raw data at Blob Storage prices, and Databricks reads it in place with PySpark.
        fr: |
          Le chemin chaud est calculé sur le flux à l'arrivée des événements : Stream Analytics exécute des requêtes SQL sur le hub d'événements sans aucun cluster et dispose d'une sortie Power BI pour les tableaux de bord en direct. Le chemin tiède conserve les données récentes dans un magasin qui sert des recherches par clé en quelques millisecondes sur plusieurs continents, c'est-à-dire Azure Cosmos DB, qui est aussi une sortie de Stream Analytics. Le chemin froid est la couche de traitement par lots : Data Lake Storage conserve des années de données brutes au prix du Stockage Blob, et Databricks les lit sur place avec PySpark.
      options:
        adf: { en: "Data Factory runs batch pipelines; a run every minute doesn't update a dashboard within seconds of each event.", fr: "Data Factory exécute des pipelines par lots ; une exécution par minute ne met pas à jour un tableau de bord quelques secondes après chaque événement." }
        dedicated: { en: "A dedicated SQL pool is a data warehouse for loaded data, not a stream processing engine.", fr: "Un pool SQL dédié est un entrepôt de données pour des données chargées, pas un moteur de traitement de flux." }
        serverless: { en: "A serverless SQL pool queries lake files on demand; it isn't designed for millisecond lookups by a global mobile app.", fr: "Un pool SQL serverless interroge à la demande des fichiers du lac ; il n'est pas conçu pour des recherches en millisecondes par une application mobile mondiale." }
        eh: { en: "Event Hubs ingests events; it isn't a store that an app can query by van identifier.", fr: "Event Hubs ingère des événements ; ce n'est pas un magasin qu'une application peut interroger par identifiant de camionnette." }
        dwh: { en: "A dedicated SQL pool costs far more than the lake for five years of raw files, and the PySpark training reads the lake directly.", fr: "Un pool SQL dédié coûte bien plus cher que le lac pour cinq ans de fichiers bruts, et l'entraînement PySpark lit directement le lac." }
    references:
      - title: Azure Stream Analytics Output Types Overview - Azure Stream Analytics
        url: https://learn.microsoft.com/en-us/azure/stream-analytics/stream-analytics-define-outputs
      - title: Choose a Stream Processing Technology - Azure Architecture Center
        url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/technology-choices/stream-processing

  # ------------------------------------------------------------------ 7
  - id: az305-qz-23-07
    objective: "2.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso hosts a SQL Server 2022 instance on an Azure virtual machine named **vm-sql1**. vm-sql1 is connected to a virtual network named **vnet-erp** and has no public IP address. Network security groups block all inbound traffic from the internet to vnet-erp. A Windows Server virtual machine named **vm-tools** already runs in the same subnet as vm-sql1.

        You plan to use Azure Data Factory to copy 30 tables from vm-sql1 every night to an Azure Data Lake Storage account that allows access from public networks.

        You need to recommend an integration runtime for the copy. The solution must minimize administrative effort.

        What should you recommend?
      fr: |
        Contoso héberge une instance SQL Server 2022 sur une machine virtuelle Azure nommée **vm-sql1**. vm-sql1 est connectée à un réseau virtuel nommé **vnet-erp** et n'a pas d'adresse IP publique. Des groupes de sécurité réseau bloquent tout le trafic entrant depuis Internet vers vnet-erp. Une machine virtuelle Windows Server nommée **vm-tools** s'exécute déjà dans le même sous-réseau que vm-sql1.

        Vous prévoyez d'utiliser Azure Data Factory pour copier chaque nuit 30 tables de vm-sql1 vers un compte Azure Data Lake Storage qui autorise l'accès depuis les réseaux publics.

        Vous devez recommander un runtime d'intégration pour la copie. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "The default Azure integration runtime, with a linked service that targets the private IP address of vm-sql1", fr: "Le runtime d'intégration Azure par défaut, avec un service lié qui cible l'adresse IP privée de vm-sql1" } }
        - { id: b, text: { en: "A self-hosted integration runtime installed on vm-tools and registered in the data factory", fr: "Un runtime d'intégration auto-hébergé installé sur vm-tools et inscrit dans la fabrique de données" } }
        - { id: c, text: { en: "An Azure integration runtime in a managed virtual network, with a managed private endpoint to vm-sql1", fr: "Un runtime d'intégration Azure dans un réseau virtuel managé, avec un point de terminaison privé managé vers vm-sql1" } }
        - { id: d, text: { en: "An Azure-SSIS integration runtime joined to vnet-erp that runs the copy activities of the pipeline", fr: "Un runtime d'intégration Azure-SSIS joint à vnet-erp qui exécute les activités de copie du pipeline" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          vm-sql1 sits in a private network with no line of sight from the public cloud, which is the case for a self-hosted integration runtime installed inside that network. The runtime only makes outbound connections, so the NSGs that block inbound traffic don't prevent it from working, and vm-tools is an existing Windows machine that can host it without deploying anything else.
        fr: |
          vm-sql1 se trouve dans un réseau privé sans visibilité directe depuis le cloud public : c'est le cas d'un runtime d'intégration auto-hébergé installé dans ce réseau. Le runtime n'établit que des connexions sortantes : les NSG qui bloquent le trafic entrant ne l'empêchent donc pas de fonctionner, et vm-tools est une machine Windows existante qui peut l'héberger sans rien déployer d'autre.
      options:
        a: { en: "The default Azure integration runtime connects only to publicly accessible endpoints; it can't reach a private IP address in vnet-erp.", fr: "Le runtime d'intégration Azure par défaut ne se connecte qu'à des points de terminaison accessibles publiquement ; il ne peut pas atteindre une adresse IP privée de vnet-erp." }
        c: { en: "Managed private endpoints target Private Link resources; reaching SQL Server on a virtual machine needs a Private Link service, a Standard load balancer and forwarding VMs to build and maintain.", fr: "Les points de terminaison privés managés ciblent des ressources Private Link ; atteindre SQL Server sur une machine virtuelle exige un service Private Link, un équilibreur de charge Standard et des machines virtuelles de transfert à créer et à maintenir." }
        d: { en: "The Azure-SSIS integration runtime only executes SSIS packages; copy activities run on the Azure or self-hosted integration runtime.", fr: "Le runtime d'intégration Azure-SSIS exécute uniquement des packages SSIS ; les activités de copie s'exécutent sur le runtime d'intégration Azure ou auto-hébergé." }
    references:
      - title: Integration runtime - Azure Data Factory & Azure Synapse
        url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-integration-runtime
      - title: Access on-premises SQL Server from Data Factory Managed Virtual Network using Private Endpoint - Azure Data Factory
        url: https://learn.microsoft.com/en-us/azure/data-factory/tutorial-managed-virtual-network-on-premise-sql-server

  # ------------------------------------------------------------------ 8
  - id: az305-qz-23-08
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank has an Azure Synapse Analytics workspace attached to an Azure Data Lake Storage account. The workspace contains a dedicated SQL pool named **dwfinance**, the built-in serverless SQL pool and an Apache Spark pool. Curated Parquet files are stored in the lake, and every night a star schema is loaded from them into dwfinance.

        To reduce costs, an automation pauses dwfinance every day at 20:00 and resumes it at 07:00.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un espace de travail Azure Synapse Analytics rattaché à un compte Azure Data Lake Storage. L'espace de travail contient un pool SQL dédié nommé **dwfinance**, le pool SQL serverless intégré et un pool Apache Spark. Des fichiers Parquet organisés sont stockés dans le lac, et chaque nuit un schéma en étoile en est chargé dans dwfinance.

        Pour réduire les coûts, une automatisation suspend dwfinance chaque jour à 20:00 et le reprend à 07:00.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "At 22:00, analysts can query the curated Parquet files of the lake by using the serverless SQL pool.", fr: "À 22:00, les analystes peuvent interroger les fichiers Parquet organisés du lac avec le pool SQL serverless." }
        - id: s2
          text: { en: "At 22:00, Power BI reports can still query the star schema tables that are stored in dwfinance.", fr: "À 22:00, des rapports Power BI peuvent encore interroger les tables du schéma en étoile stockées dans dwfinance." }
        - id: s3
          text: { en: "Between 20:00 and 07:00, Woodgrove Bank is billed neither for the compute nor for the storage of dwfinance.", fr: "Entre 20:00 et 07:00, Woodgrove Bank n'est facturé ni pour le calcul ni pour le stockage de dwfinance." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          The serverless SQL pool is a separate endpoint of every workspace that queries the lake files in place, so it keeps working while the dedicated pool is paused. Pausing a dedicated SQL pool takes its compute offline and cancels running queries: its tables can't be queried until it resumes. During the pause, compute isn't billed, but the storage of the pool still is.
        fr: |
          Le pool SQL serverless est un point de terminaison distinct de chaque espace de travail qui interroge les fichiers du lac sur place : il continue de fonctionner pendant que le pool dédié est suspendu. Suspendre un pool SQL dédié met son calcul hors ligne et annule les requêtes en cours : ses tables ne peuvent pas être interrogées avant sa reprise. Pendant la suspension, le calcul n'est pas facturé, mais le stockage du pool l'est toujours.
      options:
        s2: { en: "While the pool is paused, its storage is detached from the compute nodes; the data becomes available again after the resume.", fr: "Pendant la suspension, le stockage du pool est détaché des nœuds de calcul ; les données redeviennent disponibles après la reprise." }
        s3: { en: "Pausing stops only the compute charges; the storage of the dedicated SQL pool remains billed.", fr: "La suspension n'arrête que les frais de calcul ; le stockage du pool SQL dédié reste facturé." }
    references:
      - title: "Quickstart: Pause and resume compute in dedicated SQL pool via the Azure portal - Azure Synapse Analytics"
        url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/pause-and-resume-compute-portal
      - title: Serverless SQL pool - Azure Synapse Analytics
        url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql/on-demand-workspace-overview

  # ------------------------------------------------------------------ 9
  - id: az305-qz-23-09
    objective: "2.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders plans to load customer data from an Azure SQL database into an Azure Data Lake Storage account every night, for analytics. The database has a public endpoint that Azure services can reach.

        The solution must meet the following requirements:

        - A compliance rule forbids writing national identification numbers to the data lake, even temporarily. The lake must contain a masked value instead of each number.
        - The transformation logic must scale out with the data volume, without a cluster that Northwind creates or manages.
        - Azure Data Factory must orchestrate and schedule the load.

        What should you recommend?
      fr: |
        Northwind Traders prévoit de charger chaque nuit des données clients d'une base de données Azure SQL vers un compte Azure Data Lake Storage, pour l'analytique. La base de données dispose d'un point de terminaison public que les services Azure peuvent atteindre.

        La solution doit répondre aux exigences suivantes :

        - Une règle de conformité interdit d'écrire des numéros d'identification nationaux dans le lac de données, même temporairement. Le lac doit contenir une valeur masquée à la place de chaque numéro.
        - La logique de transformation doit monter en charge avec le volume de données, sans cluster que Northwind crée ou gère.
        - Azure Data Factory doit orchestrer et planifier le chargement.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Copy the tables to the lake unchanged, and then mask the numbers with an Azure Databricks job.", fr: "Copier les tables telles quelles dans le lac, puis masquer les numéros avec un travail Azure Databricks." } }
        - { id: b, text: { en: "Read the tables with a mapping data flow that masks the numbers and writes the result to the lake.", fr: "Lire les tables avec un flux de données de mappage qui masque les numéros et écrit le résultat dans le lac." } }
        - { id: c, text: { en: "Copy the tables to the lake unchanged, and then expose them through serverless SQL pool views that mask the numbers.", fr: "Copier les tables telles quelles dans le lac, puis les exposer via des vues de pool SQL serverless qui masquent les numéros." } }
        - { id: d, text: { en: "Copy the tables with a copy activity that leaves the column of the numbers out of its column mapping.", fr: "Copier les tables avec une activité de copie qui exclut la colonne des numéros de son mappage de colonnes." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The rule requires an ETL design: the data must be transformed before it is loaded into the lake, in a dedicated engine. A mapping data flow reads the database, masks the column and writes only the masked result, and it runs on Spark clusters that Data Factory starts and stops, so Northwind manages no cluster.
        fr: |
          La règle impose une conception ETL : les données doivent être transformées avant d'être chargées dans le lac, dans un moteur dédié. Un flux de données de mappage lit la base de données, masque la colonne et n'écrit que le résultat masqué, et il s'exécute sur des clusters Spark que Data Factory démarre et arrête : Northwind ne gère aucun cluster.
      options:
        a: { en: "Loading the raw tables first is ELT: the numbers would be written to the lake before the Databricks job masks them.", fr: "Charger d'abord les tables brutes relève de l'ELT : les numéros seraient écrits dans le lac avant que le travail Databricks ne les masque." }
        c: { en: "Views only hide the numbers at query time; the raw files written to the lake still contain them.", fr: "Les vues ne masquent les numéros qu'au moment de la requête ; les fichiers bruts écrits dans le lac les contiennent toujours." }
        d: { en: "Leaving the column out removes the numbers, but the lake must contain a masked value for each of them.", fr: "Exclure la colonne supprime les numéros, mais le lac doit contenir une valeur masquée pour chacun d'eux." }
    references:
      - title: Extract, transform, load (ETL) - Azure Architecture Center
        url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/relational-data/etl
      - title: Mapping data flows - Azure Data Factory
        url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-data-flow-overview

  # ------------------------------------------------------------------ 10
  - id: az305-qz-23-10
    objective: "2.3.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Adatum is consolidating its analytics on an Azure Synapse Analytics workspace. You are designing the data integration of three workloads:

        - **Workload 1**: 120 existing SQL Server Integration Services (SSIS) packages must keep running on a schedule with minimal changes, without any virtual machine that Adatum patches.
        - **Workload 2**: the tables of an on-premises Oracle database must be copied every night to the data lake of the workspace. The datacenter firewall allows outbound connections only.
        - **Workload 3**: business analysts must build joins and aggregations on the copied data visually, without writing code, as steps of the pipelines of the workspace.

        The solution must use the Synapse workspace for every workload whose requirements it supports.

        What should you recommend for each workload? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum regroupe son analytique dans un espace de travail Azure Synapse Analytics. Vous concevez l'intégration de données de trois charges de travail :

        - **Charge de travail 1** : 120 packages SQL Server Integration Services (SSIS) existants doivent continuer à s'exécuter de façon planifiée avec un minimum de modifications, sans aucune machine virtuelle qu'Adatum corrige.
        - **Charge de travail 2** : les tables d'une base de données Oracle locale doivent être copiées chaque nuit dans le lac de données de l'espace de travail. Le pare-feu du centre de données n'autorise que les connexions sortantes.
        - **Charge de travail 3** : des analystes métier doivent créer visuellement des jointures et des agrégations sur les données copiées, sans écrire de code, en tant qu'étapes des pipelines de l'espace de travail.

        La solution doit utiliser l'espace de travail Synapse pour chaque charge de travail dont il prend en charge les exigences.

        Que devez-vous recommander pour chaque charge de travail ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Workload 1: [[w1]]

          Workload 2: [[w2]]

          Workload 3: [[w3]]
        fr: |
          Charge de travail 1 : [[w1]]

          Charge de travail 2 : [[w2]]

          Charge de travail 3 : [[w3]]
      slots:
        - id: w1
          options:
            - { id: synssis, text: { en: "A Synapse pipeline that runs the packages on an Azure-SSIS integration runtime", fr: "Un pipeline Synapse qui exécute les packages sur un runtime d'intégration Azure-SSIS" } }
            - { id: adfssis, text: { en: "An Azure Data Factory instance that runs the packages on an Azure-SSIS integration runtime", fr: "Une instance Azure Data Factory qui exécute les packages sur un runtime d'intégration Azure-SSIS" } }
            - { id: synshir, text: { en: "A Synapse pipeline that runs the packages on a self-hosted integration runtime", fr: "Un pipeline Synapse qui exécute les packages sur un runtime d'intégration auto-hébergé" } }
            - { id: vm, text: { en: "SQL Server Integration Services installed on an Azure virtual machine", fr: "SQL Server Integration Services installé sur une machine virtuelle Azure" } }
        - id: w2
          options:
            - { id: synshir2, text: { en: "A Synapse pipeline with a self-hosted integration runtime", fr: "Un pipeline Synapse avec un runtime d'intégration auto-hébergé" } }
            - { id: synazure, text: { en: "A Synapse pipeline with the Azure integration runtime", fr: "Un pipeline Synapse avec le runtime d'intégration Azure" } }
            - { id: adfssis2, text: { en: "An Azure Data Factory instance with an Azure-SSIS integration runtime", fr: "Une instance Azure Data Factory avec un runtime d'intégration Azure-SSIS" } }
            - { id: serverless, text: { en: "The serverless SQL pool of the workspace, querying the Oracle tables", fr: "Le pool SQL serverless de l'espace de travail, qui interroge les tables Oracle" } }
        - id: w3
          options:
            - { id: dataflow, text: { en: "Data flows in the Synapse pipelines", fr: "Des flux de données dans les pipelines Synapse" } }
            - { id: notebook, text: { en: "Apache Spark notebooks in the workspace", fr: "Des notebooks Apache Spark dans l'espace de travail" } }
            - { id: asa, text: { en: "Azure Stream Analytics jobs", fr: "Des travaux Azure Stream Analytics" } }
            - { id: views, text: { en: "Views in the serverless SQL pool", fr: "Des vues dans le pool SQL serverless" } }
    answer:
      values: { w1: adfssis, w2: synshir2, w3: dataflow }
    explanation:
      correct:
        en: |
          Synapse pipelines support only the Azure and self-hosted integration runtimes, not Azure-SSIS: the SSIS packages need an Azure Data Factory instance with an Azure-SSIS integration runtime, the managed service for lifted and shifted packages. A Synapse pipeline with a self-hosted integration runtime installed in the datacenter copies the Oracle tables over outbound connections only. Synapse data flows are designed visually without code and run as activities of the Synapse pipelines on managed Spark clusters.
        fr: |
          Les pipelines Synapse ne prennent en charge que les runtimes d'intégration Azure et auto-hébergé, pas Azure-SSIS : les packages SSIS exigent une instance Azure Data Factory avec un runtime d'intégration Azure-SSIS, le service managé des packages migrés tels quels. Un pipeline Synapse avec un runtime d'intégration auto-hébergé installé dans le centre de données copie les tables Oracle avec des connexions sortantes uniquement. Les flux de données Synapse se conçoivent visuellement sans code et s'exécutent comme activités des pipelines Synapse sur des clusters Spark managés.
      options:
        synssis: { en: "Synapse pipelines don't support the Azure-SSIS integration runtime.", fr: "Les pipelines Synapse ne prennent pas en charge le runtime d'intégration Azure-SSIS." }
        synshir: { en: "A self-hosted integration runtime moves data and dispatches activities; it doesn't execute SSIS packages.", fr: "Un runtime d'intégration auto-hébergé déplace des données et distribue des activités ; il n'exécute pas de packages SSIS." }
        vm: { en: "SSIS on a virtual machine leaves Adatum with a server to patch.", fr: "SSIS sur une machine virtuelle laisse à Adatum un serveur à corriger." }
        synazure: { en: "The Azure integration runtime can't reach a database inside the on-premises network.", fr: "Le runtime d'intégration Azure ne peut pas atteindre une base de données à l'intérieur du réseau local." }
        serverless: { en: "The serverless SQL pool queries files in the lake, Azure Cosmos DB or Dataverse, not an on-premises Oracle database.", fr: "Le pool SQL serverless interroge des fichiers du lac, Azure Cosmos DB ou Dataverse, pas une base de données Oracle locale." }
        notebook: { en: "Spark notebooks require the analysts to write code.", fr: "Les notebooks Spark exigent que les analystes écrivent du code." }
        views: { en: "Views in the serverless SQL pool are written in T-SQL code.", fr: "Les vues du pool SQL serverless s'écrivent en code T-SQL." }
    references:
      - title: Integration runtime - Azure Data Factory & Azure Synapse
        url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-integration-runtime
      - title: Differences from Azure Data Factory - Azure Synapse Analytics
        url: https://learn.microsoft.com/en-us/azure/synapse-analytics/data-integration/concepts-data-factory-differences
