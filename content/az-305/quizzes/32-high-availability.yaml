chapter: 32-high-availability
questions:
  # ------------------------------------------------------------------ 1
  - id: az305-qz-32-01
    objective: "3.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum plans to deploy an Azure Service Bus namespace in the Standard tier and an Azure container registry in the Basic tier to the Sweden Central region, which supports availability zones.

        Both resources must remain available if an availability zone fails. Costs must be minimized. What should you recommend?
      fr: |
        Adatum prévoit de déployer un espace de noms Azure Service Bus au niveau Standard et un registre de conteneurs Azure au niveau Basic dans la région Sweden Central, qui prend en charge les zones de disponibilité.

        Les deux ressources doivent rester disponibles si une zone de disponibilité tombe en panne. Les coûts doivent être réduits au minimum. Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Upgrade the namespace and the registry to the Premium tier, and enable zone redundancy on both resources.", fr: "Passer l'espace de noms et le registre au niveau Premium, puis activer la redondance de zone sur les deux ressources." } }
        - { id: b, text: { en: "Pair the namespace with another namespace by using Geo-disaster recovery, and geo-replicate the registry.", fr: "Associer l'espace de noms à un autre espace de noms avec la géo-reprise d'activité (Geo-disaster recovery), puis géorépliquer le registre." } }
        - { id: c, text: { en: "Deploy each resource twice in two different availability zones, and switch between the copies by using DNS.", fr: "Déployer chaque ressource deux fois dans deux zones de disponibilité différentes, puis basculer entre les copies par DNS." } }
        - { id: d, text: { en: "Deploy both resources in their current tiers with the default settings, without any additional configuration.", fr: "Déployer les deux ressources dans leurs niveaux actuels avec les paramètres par défaut, sans configuration supplémentaire." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          In a region that supports availability zones, Service Bus namespaces of every tier and container registries of every tier are zone-redundant automatically. Nothing has to be selected or configured, and zone redundancy adds no cost, so the Standard namespace and the Basic registry already survive a zone failure.
        fr: |
          Dans une région qui prend en charge les zones de disponibilité, les espaces de noms Service Bus de tous les niveaux et les registres de conteneurs de tous les niveaux sont redondants interzones automatiquement. Rien n'est à sélectionner ni à configurer, et la redondance de zone n'ajoute aucun coût : l'espace de noms Standard et le registre Basic survivent déjà à la panne d'une zone.
      options:
        a: { en: "Zone redundancy isn't limited to the Premium tier for these services; the upgrade only adds cost.", fr: "La redondance de zone n'est pas réservée au niveau Premium pour ces services ; la mise à niveau ne fait qu'ajouter des coûts." }
        b: { en: "Geo-disaster recovery and geo-replication answer a regional outage, require the Premium tier and add a second region that the requirement doesn't need.", fr: "La géo-reprise d'activité et la géoréplication répondent à une panne régionale, exigent le niveau Premium et ajoutent une deuxième région dont l'exigence n'a pas besoin." }
        c: { en: "Two copies double the cost and need a manual or DNS-based switch, whereas the platform already spreads each resource across zones.", fr: "Deux copies doublent le coût et demandent une bascule manuelle ou par DNS, alors que la plateforme répartit déjà chaque ressource entre les zones." }
    references:
      - title: Reliability in Azure Service Bus
        url: https://learn.microsoft.com/en-us/azure/reliability/reliability-service-bus
      - title: Zone redundancy in Azure Container Registry - Azure Container Registry
        url: https://learn.microsoft.com/en-us/azure/container-registry/zone-redundancy

  # ------------------------------------------------------------------ 2
  - id: az305-qz-32-02
    objective: "3.2.3"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Fabrikam has an Azure Cosmos DB for NoSQL account with two regions: West Europe, the only write region, and North Europe, a read region. The default consistency level of the account is session.

        If West Europe suffers a region-wide outage, which recovery point objective (RPO) should Fabrikam expect for the account?
      fr: |
        Fabrikam dispose d'un compte Azure Cosmos DB for NoSQL avec deux régions : West Europe, la seule région d'écriture, et North Europe, une région de lecture. Le niveau de cohérence par défaut du compte est session.

        Si West Europe subit une panne de toute la région, quel objectif de point de récupération (RPO) Fabrikam doit-il attendre pour le compte ?
    body:
      options:
        - { id: a, text: { en: "Zero", fr: "Zéro" } }
        - { id: b, text: { en: "Less than 15 minutes", fr: "Moins de 15 minutes" } }
        - { id: c, text: { en: "Up to one hour", fr: "Jusqu'à une heure" } }
        - { id: d, text: { en: "Up to 24 hours", fr: "Jusqu'à 24 heures" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In an account with several regions, the consistency level sets the RPO of a regional outage. With session, consistent prefix or eventual consistency, writes are replicated asynchronously to the other regions and the RPO is less than 15 minutes. Only strong consistency, with a single write region, gives an RPO of zero.
        fr: |
          Dans un compte qui a plusieurs régions, le niveau de cohérence fixe le RPO d'une panne régionale. Avec la cohérence session, préfixe cohérent ou éventuelle, les écritures sont répliquées de façon asynchrone vers les autres régions et le RPO est inférieur à 15 minutes. Seule la cohérence forte, avec une seule région d'écriture, donne un RPO de zéro.
      options:
        a: { en: "An RPO of zero requires strong consistency, because each write is then committed in every region before it is acknowledged.", fr: "Un RPO de zéro exige la cohérence forte, car chaque écriture est alors validée dans toutes les régions avant d'être confirmée." }
        c: { en: "Azure Cosmos DB states an RPO of less than 15 minutes for session consistency, not one hour.", fr: "Azure Cosmos DB indique un RPO inférieur à 15 minutes pour la cohérence session, pas une heure." }
        d: { en: "An RPO counted in hours applies to a restore from periodic backups, not to the replication between the regions of the account.", fr: "Un RPO compté en heures correspond à une restauration depuis les sauvegardes périodiques, pas à la réplication entre les régions du compte." }
    references:
      - title: Consistency level choices - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels

  # ------------------------------------------------------------------ 3
  - id: az305-qz-32-03
    objective: "3.2.1"
    difficulty: 2
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Contoso hosts a web application on an Azure App Service plan whose SLA is 99.95%. Every request of the application reads and writes an Azure SQL database whose SLA is 99.99%. The application has no other dependency, and neither component is deployed in a second region.

        You need to estimate the composite availability of the application from these two SLAs. Which value should you use?
      fr: |
        Contoso héberge une application web sur un plan App Service dont le SLA est de 99,95 %. Chaque requête de l'application lit et écrit dans une base de données Azure SQL dont le SLA est de 99,99 %. L'application n'a aucune autre dépendance, et aucun des deux composants n'est déployé dans une deuxième région.

        Vous devez estimer la disponibilité composite de l'application à partir de ces deux SLA. Quelle valeur devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "99.94%", fr: "99,94 %" } }
        - { id: b, text: { en: "99.95%", fr: "99,95 %" } }
        - { id: c, text: { en: "99.97%", fr: "99,97 %" } }
        - { id: d, text: { en: "99.99%", fr: "99,99 %" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The two components are in series: a request fails if either one is unavailable. The composite value is the product of the individual values, 0.9995 × 0.9999 ≈ 0.9994, so about 99.94%, lower than the SLA of each component.
        fr: |
          Les deux composants sont en série : une requête échoue si l'un ou l'autre est indisponible. La valeur composite est le produit des valeurs individuelles, 0,9995 × 0,9999 ≈ 0,9994, soit environ 99,94 %, moins que le SLA de chaque composant.
      options:
        b: { en: "99.95% is the SLA of the weakest component; the unavailability of the database adds to it.", fr: "99,95 % est le SLA du composant le plus faible ; l'indisponibilité de la base de données s'y ajoute." }
        c: { en: "99.97% is the average of the two SLAs; dependencies in series multiply, they don't average.", fr: "99,97 % est la moyenne des deux SLA ; des dépendances en série se multiplient, elles ne se moyennent pas." }
        d: { en: "99.99% is the SLA of the database alone; the application can't be more available than its web tier.", fr: "99,99 % est le SLA de la base de données seule ; l'application ne peut pas être plus disponible que son niveau web." }
    references:
      - title: Architecture strategies for defining reliability targets - Microsoft Azure Well-Architected Framework
        url: https://learn.microsoft.com/en-us/azure/well-architected/reliability/metrics

  # ------------------------------------------------------------------ 4
  - id: az305-qz-32-04
    objective: "3.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware stores product images as block blobs in the hot tier of a standard general-purpose v2 storage account in the Canada Central region. The account currently uses locally redundant storage (LRS).

        A new contract requires a read availability SLA of at least 99.99% for the images. The application will be updated to read from the secondary endpoint when the primary endpoint fails. Costs must be minimized.

        Which redundancy option should you recommend for the account?
      fr: |
        Litware stocke des images de produits sous forme d'objets blob de blocs au niveau chaud (Hot) d'un compte de stockage standard usage général v2 de la région Canada Central. Le compte utilise actuellement le stockage localement redondant (LRS).

        Un nouveau contrat exige un SLA de disponibilité en lecture d'au moins 99,99 % pour les images. L'application sera modifiée pour lire depuis le point de terminaison secondaire quand le point de terminaison principal tombe en panne. Les coûts doivent être réduits au minimum.

        Quelle option de redondance devez-vous recommander pour le compte ?
    body:
      options:
        - { id: a, text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" } }
        - { id: b, text: { en: "Geo-zone-redundant storage (GZRS)", fr: "Stockage géoredondant interzone (GZRS)" } }
        - { id: c, text: { en: "Read-access geo-redundant storage (RA-GRS)", fr: "Stockage géoredondant avec accès en lecture (RA-GRS)" } }
        - { id: d, text: { en: "Read-access geo-zone-redundant storage (RA-GZRS)", fr: "Stockage géoredondant interzone avec accès en lecture (RA-GZRS)" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The read-access options expose a secondary endpoint that can be read at any time, and they raise the read availability SLA of the hot tier to at least 99.99%, against 99.9% for the other options. RA-GRS and RA-GZRS both reach that SLA, and RA-GRS is the cheaper of the two because it keeps the primary copies locally redundant.
        fr: |
          Les options avec accès en lecture exposent un point de terminaison secondaire lisible à tout moment, et elles portent le SLA de disponibilité en lecture du niveau chaud (Hot) à au moins 99,99 %, contre 99,9 % pour les autres options. RA-GRS et RA-GZRS atteignent tous deux ce SLA, et RA-GRS est le moins cher des deux, car il garde les copies primaires localement redondantes.
      options:
        a: { en: "ZRS survives a zone failure, but it has no secondary endpoint and its read SLA is 99.9%.", fr: "ZRS survit à la panne d'une zone, mais n'a pas de point de terminaison secondaire et son SLA de lecture est de 99,9 %." }
        b: { en: "Without read access, the secondary region of GZRS can't be read before a failover, so the read SLA stays at 99.9%.", fr: "Sans accès en lecture, la région secondaire de GZRS ne peut pas être lue avant un basculement : le SLA de lecture reste de 99,9 %." }
        d: { en: "RA-GZRS also offers the 99.99% read SLA, but it costs more than RA-GRS and no requirement asks for zone redundancy in the primary region.", fr: "RA-GZRS offre aussi le SLA de lecture de 99,99 %, mais coûte plus cher que RA-GRS, et aucune exigence ne demande la redondance de zone dans la région primaire." }
    references:
      - title: Data redundancy - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy

  # ------------------------------------------------------------------ 5
  - id: az305-qz-32-05
    objective: "3.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders plans to deploy an Azure Database for PostgreSQL flexible server in the General Purpose tier for an order application. A regulation requires the server to be deployed in a region that doesn't support availability zones.

        You need to recommend a configuration that meets the following requirements:

        - If the server fails, a standby server must take over automatically, without loss of committed data.
        - The server must be covered by the highest uptime SLA available in that region.

        What should you recommend?
      fr: |
        Northwind Traders prévoit de déployer un serveur flexible Azure Database pour PostgreSQL au niveau General Purpose pour une application de commandes. Une réglementation impose de déployer le serveur dans une région qui ne prend pas en charge les zones de disponibilité.

        Vous devez recommander une configuration qui répond aux exigences suivantes :

        - Si le serveur tombe en panne, un serveur de secours doit prendre le relais automatiquement, sans perte de données validées.
        - Le serveur doit être couvert par le SLA de durée de fonctionnement le plus élevé disponible dans cette région.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Enable zone-redundant high availability, with the standby server in another zone of the region.", fr: "Activer la haute disponibilité redondante interzone, avec le serveur de secours dans une autre zone de la région." } }
        - { id: b, text: { en: "Enable same-zone high availability, with the standby server in the zone of the primary server.", fr: "Activer la haute disponibilité dans la même zone, avec le serveur de secours dans la zone du serveur principal." } }
        - { id: c, text: { en: "Create a read replica of the server in the same region, and promote it if the primary server fails.", fr: "Créer un réplica en lecture du serveur dans la même région, puis le promouvoir si le serveur principal tombe en panne." } }
        - { id: d, text: { en: "Enable geo-redundant backup storage, and restore the server from the backups if the primary server fails.", fr: "Activer le stockage de sauvegarde géoredondant, puis restaurer le serveur depuis les sauvegardes si le serveur principal tombe en panne." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Same-zone (zonal) high availability places a standby server next to the primary, replicates to it synchronously and fails over automatically. It is available in every region where the flexible server can be deployed and is covered by an SLA of about 99.95%, the highest option in a region without availability zones.
        fr: |
          La haute disponibilité dans la même zone (zonale) place un serveur de secours à côté du serveur principal, le réplique de façon synchrone et bascule automatiquement. Elle est disponible dans toutes les régions où le serveur flexible peut être déployé et est couverte par un SLA d'environ 99,95 %, l'option la plus élevée dans une région sans zones de disponibilité.
      options:
        a: { en: "Zone-redundant high availability, with its SLA of about 99.99%, is available only in regions that support availability zones.", fr: "La haute disponibilité redondante interzone, avec son SLA d'environ 99,99 %, n'est disponible que dans les régions qui prennent en charge les zones de disponibilité." }
        c: { en: "A read replica is replicated asynchronously and promoted manually, so the takeover is neither automatic nor free of data loss.", fr: "Un réplica en lecture est répliqué de façon asynchrone et promu manuellement : la reprise n'est ni automatique ni exempte de perte de données." }
        d: { en: "A restore creates a new server from the backups: it is a manual recovery with downtime and data loss, not a standby.", fr: "Une restauration crée un nouveau serveur à partir des sauvegardes : c'est une récupération manuelle avec interruption et perte de données, pas un serveur de secours." }
    references:
      - title: High Availability in Azure Database for PostgreSQL flexible server - Azure Database for PostgreSQL
        url: https://learn.microsoft.com/en-us/azure/postgresql/high-availability/concepts-high-availability

  # ------------------------------------------------------------------ 6
  - id: az305-qz-32-06
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Wingtip Toys is designing three web applications. Each application runs on a zone-redundant App Service plan in the West Europe region and stores its data in a service that can be replicated to another region.

        - **Booking**: if West Europe fails, users must be served from another region with no noticeable interruption. Cost is secondary.
        - **Intranet**: if West Europe fails, the application can be unavailable for up to eight hours. Costs must be minimized.
        - **Clinic**: all the data must stay in West Europe. The application must keep running if a datacenter of the region fails. Costs must be minimized.

        You need to recommend a deployment topology for each application.

        What should you recommend? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys conçoit trois applications web. Chaque application s'exécute sur un plan App Service redondant interzone de la région West Europe et stocke ses données dans un service qui peut être répliqué vers une autre région.

        - **Booking** : si West Europe tombe en panne, les utilisateurs doivent être servis depuis une autre région sans interruption perceptible. Le coût est secondaire.
        - **Intranet** : si West Europe tombe en panne, l'application peut être indisponible jusqu'à huit heures. Les coûts doivent être réduits au minimum.
        - **Clinic** : toutes les données doivent rester dans West Europe. L'application doit continuer à fonctionner si un centre de données de la région tombe en panne. Les coûts doivent être réduits au minimum.

        Vous devez recommander une topologie de déploiement pour chaque application.

        Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Booking: [[booking]]

          Intranet: [[intranet]]

          Clinic: [[clinic]]
        fr: |
          Booking : [[booking]]

          Intranet : [[intranet]]

          Clinic : [[clinic]]
      slots:
        - id: booking
          options:
            - { id: zr, text: { en: "One region, with zone redundancy only", fr: "Une seule région, avec la seule redondance de zone" } }
            - { id: twoplans, text: { en: "Two zone-redundant plans in West Europe behind Azure Front Door", fr: "Deux plans redondants interzones dans West Europe derrière Azure Front Door" } }
            - { id: aa, text: { en: "Active-active in two regions", fr: "Actif-actif dans deux régions" } }
            - { id: ap, text: { en: "Active-passive, with a scaled-down or stopped second region", fr: "Actif-passif, avec une deuxième région réduite ou arrêtée" } }
        - id: intranet
          options:
            - { id: zr, text: { en: "One region, with zone redundancy only", fr: "Une seule région, avec la seule redondance de zone" } }
            - { id: twoplans, text: { en: "Two zone-redundant plans in West Europe behind Azure Front Door", fr: "Deux plans redondants interzones dans West Europe derrière Azure Front Door" } }
            - { id: aa, text: { en: "Active-active in two regions", fr: "Actif-actif dans deux régions" } }
            - { id: ap, text: { en: "Active-passive, with a scaled-down or stopped second region", fr: "Actif-passif, avec une deuxième région réduite ou arrêtée" } }
        - id: clinic
          options:
            - { id: zr, text: { en: "One region, with zone redundancy only", fr: "Une seule région, avec la seule redondance de zone" } }
            - { id: twoplans, text: { en: "Two zone-redundant plans in West Europe behind Azure Front Door", fr: "Deux plans redondants interzones dans West Europe derrière Azure Front Door" } }
            - { id: aa, text: { en: "Active-active in two regions", fr: "Actif-actif dans deux régions" } }
            - { id: ap, text: { en: "Active-passive, with a scaled-down or stopped second region", fr: "Actif-passif, avec une deuxième région réduite ou arrêtée" } }
    answer:
      values: { booking: aa, intranet: ap, clinic: zr }
    explanation:
      correct:
        en: |
          App Service is a regional service: zone redundancy keeps an application running through a datacenter failure but not through a regional outage. Booking needs an immediate takeover by another region, which only an active-active deployment provides, at the price of two full deployments. Intranet tolerates eight hours of downtime, so an active-passive design, whose second region is scaled down or stopped until a failover, is the cheaper multi-region option. Clinic must keep its data in West Europe and only survive a datacenter failure, which the zone-redundant plan already does.
        fr: |
          App Service est un service régional : la redondance de zone maintient une application en service pendant la panne d'un centre de données, mais pas pendant une panne régionale. Booking a besoin d'une reprise immédiate par une autre région, que seul un déploiement actif-actif apporte, au prix de deux déploiements complets. Intranet tolère huit heures d'interruption : une conception actif-passif, dont la deuxième région reste réduite ou arrêtée jusqu'à un basculement, est l'option multirégion la moins chère. Clinic doit garder ses données dans West Europe et seulement survivre à la panne d'un centre de données, ce que fait déjà le plan redondant interzone.
      options:
        twoplans: { en: "Two plans in the same region double the cost and still stop together during a regional outage; one zone-redundant plan already covers a datacenter failure.", fr: "Deux plans dans la même région doublent le coût et s'arrêtent ensemble pendant une panne régionale ; un seul plan redondant interzone couvre déjà la panne d'un centre de données." }
        ap: { en: "For Booking, an active-passive design needs the second region to be scaled up or started, so users notice an interruption.", fr: "Pour Booking, une conception actif-passif doit agrandir ou démarrer la deuxième région, et les utilisateurs perçoivent une interruption." }
        aa: { en: "For Intranet, active-active pays for two full deployments that an eight-hour RTO doesn't need; for Clinic, a second region would move data out of West Europe.", fr: "Pour Intranet, l'actif-actif paie deux déploiements complets dont un RTO de huit heures n'a pas besoin ; pour Clinic, une deuxième région ferait sortir des données de West Europe." }
    references:
      - title: Architecture Strategies for Designing for Redundancy - Microsoft Azure Well-Architected Framework
        url: https://learn.microsoft.com/en-us/azure/well-architected/reliability/highly-available-multi-region-design

  # ------------------------------------------------------------------ 7
  - id: az305-qz-32-07
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam is building a rendering service that writes and reads many small block blobs and needs consistently low storage latency. The blobs will be stored in a new premium block blob storage account in the East US 2 region, which supports availability zones.

        You need to recommend a storage design that meets the following requirements:

        - Reads and writes must continue, without any failover, if a datacenter of East US 2 fails.
        - A readable copy of the blobs must be maintained in the Central US region for the case where East US 2 fails.
        - The service must keep the latency of premium storage.

        What should you recommend?
      fr: |
        Fabrikam conçoit un service de rendu qui écrit et lit de nombreux petits objets blob de blocs et a besoin d'une latence de stockage faible et constante. Les objets blob seront stockés dans un nouveau compte de stockage d'objets blob de blocs Premium de la région East US 2, qui prend en charge les zones de disponibilité.

        Vous devez recommander une conception de stockage qui répond aux exigences suivantes :

        - Les lectures et les écritures doivent continuer, sans aucun basculement, si un centre de données d'East US 2 tombe en panne.
        - Une copie lisible des objets blob doit être maintenue dans la région Central US pour le cas où East US 2 tombe en panne.
        - Le service doit conserver la latence du stockage Premium.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Create the premium account with RA-GZRS, and read the copy from the secondary endpoint in Central US.", fr: "Créer le compte Premium avec RA-GZRS, puis lire la copie depuis le point de terminaison secondaire dans Central US." } }
        - { id: b, text: { en: "Create the premium account with LRS, and add object replication to a premium account in Central US.", fr: "Créer le compte Premium avec LRS, puis ajouter la réplication d'objets vers un compte Premium dans Central US." } }
        - { id: c, text: { en: "Create the premium account with ZRS, and add object replication to a premium account in Central US.", fr: "Créer le compte Premium avec ZRS, puis ajouter la réplication d'objets vers un compte Premium dans Central US." } }
        - { id: d, text: { en: "Create a standard general-purpose v2 account with RA-GZRS, and read the copy from its secondary endpoint.", fr: "Créer un compte standard usage général v2 avec RA-GZRS, puis lire la copie depuis son point de terminaison secondaire." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Premium block blob accounts support only LRS and ZRS, so geo-redundancy can't provide the copy in Central US. ZRS replicates the writes synchronously across the zones of East US 2, which keeps reads and writes available during a datacenter failure. Object replication, supported between premium block blob accounts in different regions, copies the block blobs asynchronously to an account in Central US, whose destination container can be read but not written.
        fr: |
          Les comptes d'objets blob de blocs Premium ne prennent en charge que LRS et ZRS : la géoredondance ne peut donc pas fournir la copie dans Central US. ZRS réplique les écritures de façon synchrone entre les zones d'East US 2, ce qui maintient les lectures et les écritures pendant la panne d'un centre de données. La réplication d'objets, prise en charge entre des comptes d'objets blob de blocs Premium de régions différentes, copie les objets blob de blocs de façon asynchrone vers un compte de Central US, dont le conteneur de destination peut être lu mais pas modifié.
      options:
        a: { en: "RA-GZRS and the other geo-redundant options aren't available for premium block blob accounts.", fr: "RA-GZRS et les autres options géoredondantes ne sont pas disponibles pour les comptes d'objets blob de blocs Premium." }
        b: { en: "LRS keeps all the copies of the primary account in one datacenter, so its failure stops reads and writes in East US 2.", fr: "LRS garde toutes les copies du compte principal dans un seul centre de données : sa panne arrête les lectures et les écritures dans East US 2." }
        d: { en: "A standard account meets the redundancy requirements but loses the low latency of premium storage that the service needs.", fr: "Un compte standard répond aux exigences de redondance, mais perd la faible latence du stockage Premium dont le service a besoin." }
    references:
      - title: Data redundancy - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
      - title: Object replication overview - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview

  # ------------------------------------------------------------------ 8
  - id: az305-qz-32-08
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware is deploying a stateless TCP service on six Azure virtual machines in the France Central region, which has three availability zones. External clients reach the service through a single public IP address that is allowed in their own firewalls.

        You need to recommend a design that meets the following requirements:

        - The service must keep running, without any manual action, if an availability zone fails.
        - The clients must keep using the same IP address during a zone failure.
        - Costs must be minimized.

        Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware déploie un service TCP sans état sur six machines virtuelles Azure de la région France Central, qui a trois zones de disponibilité. Les clients externes atteignent le service par une seule adresse IP publique autorisée dans leurs propres pare-feu.

        Vous devez recommander une conception qui répond aux exigences suivantes :

        - Le service doit continuer à fonctionner, sans aucune action manuelle, si une zone de disponibilité tombe en panne.
        - Les clients doivent continuer à utiliser la même adresse IP pendant la panne d'une zone.
        - Les coûts doivent être réduits au minimum.

        Quelles sont les deux actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Place the six virtual machines in an availability set with three fault domains.", fr: "Placer les six machines virtuelles dans un groupe à haute disponibilité avec trois domaines d'erreur." } }
        - { id: b, text: { en: "Deploy two of the virtual machines in each of the three availability zones.", fr: "Déployer deux des machines virtuelles dans chacune des trois zones de disponibilité." } }
        - { id: c, text: { en: "Place the six virtual machines in a proximity placement group.", fr: "Placer les six machines virtuelles dans un groupe de placement de proximité." } }
        - { id: d, text: { en: "Expose the service through a zonal frontend IP configuration of a Standard Load Balancer.", fr: "Exposer le service par une configuration IP frontale zonale d'un Standard Load Balancer." } }
        - { id: e, text: { en: "Expose the service through a zone-redundant frontend IP configuration of a Standard Load Balancer.", fr: "Exposer le service par une configuration IP frontale redondante interzone d'un Standard Load Balancer." } }
        - { id: f, text: { en: "Replicate the virtual machines to another zone by using Azure Site Recovery zone-to-zone replication.", fr: "Répliquer les machines virtuelles vers une autre zone avec la réplication de zone à zone d'Azure Site Recovery." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          Virtual machines spread across the three zones don't share a datacenter, so the loss of one zone leaves four instances running, and the load balancer's health probes remove the unhealthy ones automatically. A zone-redundant frontend is served by infrastructure in several zones and keeps the same IP address during a zone failure, so clients and their firewall rules don't change.
        fr: |
          Des machines virtuelles réparties sur les trois zones ne partagent pas de centre de données : la perte d'une zone laisse quatre instances en service, et les sondes d'intégrité de l'équilibreur de charge retirent automatiquement les instances défaillantes. Une configuration IP frontale redondante interzone est servie par une infrastructure de plusieurs zones et garde la même adresse IP pendant la panne d'une zone : les clients et leurs règles de pare-feu ne changent pas.
      options:
        a: { en: "The fault domains of an availability set are in one datacenter, so a zone failure can stop all six virtual machines.", fr: "Les domaines d'erreur d'un groupe à haute disponibilité sont dans un seul centre de données : la panne d'une zone peut arrêter les six machines virtuelles." }
        c: { en: "A proximity placement group brings the virtual machines physically closer to reduce latency; it adds no availability.", fr: "Un groupe de placement de proximité rapproche physiquement les machines virtuelles pour réduire la latence ; il n'ajoute aucune disponibilité." }
        d: { en: "A zonal frontend depends on its single zone: if that zone fails, the IP address stops serving traffic.", fr: "Une configuration frontale zonale dépend de sa seule zone : si cette zone tombe en panne, l'adresse IP ne sert plus de trafic." }
        f: { en: "Zone-to-zone replication is a disaster recovery mechanism that needs a failover, and it adds cost to a stateless service that can simply run in every zone.", fr: "La réplication de zone à zone est un mécanisme de reprise d'activité qui exige un basculement, et elle ajoute des coûts à un service sans état qui peut simplement s'exécuter dans chaque zone." }
    references:
      - title: Reliability in Azure Load Balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-standard-availability-zones
      - title: Availability options for Azure Virtual Machines - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability

  # ------------------------------------------------------------------ 9
  - id: az305-qz-32-09
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso runs an Azure SQL Managed Instance named MI1 in the Business Critical service tier in the West Europe region. MI1 hosts 25 user databases used by three applications, and it was deployed without zone redundancy.

        Contoso plans the following changes:

        - Make MI1 resilient to the failure of an availability zone of West Europe.
        - Add MI1 to a failover group with a managed instance named MI2 in the North Europe region.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso exécute une instance Azure SQL Managed Instance nommée MI1 au niveau de service Business Critical dans la région West Europe. MI1 héberge 25 bases de données utilisateur utilisées par trois applications, et elle a été déployée sans redondance de zone.

        Contoso prévoit les changements suivants :

        - Rendre MI1 résiliente à la panne d'une zone de disponibilité de West Europe.
        - Ajouter MI1 à un groupe de basculement avec une instance managée nommée MI2 dans la région North Europe.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: Zone redundancy can be enabled on MI1 without moving its databases to a new managed instance.
            fr: La redondance de zone peut être activée sur MI1 sans déplacer ses bases de données vers une nouvelle instance managée.
        - id: s2
          text:
            en: MI1 can also belong to a second failover group with another managed instance in a third region.
            fr: MI1 peut aussi appartenir à un deuxième groupe de basculement avec une autre instance managée dans une troisième région.
        - id: s3
          text:
            en: During a failover, the databases of one application can be failed over to MI2 while the other databases stay primary on MI1.
            fr: Pendant un basculement, les bases de données d'une application peuvent basculer vers MI2 pendant que les autres bases de données restent principales sur MI1.
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          An existing managed instance can be converted to the zone-redundant configuration by updating its settings, so no migration to a new instance is needed. A failover group of SQL Managed Instance contains all the user databases of the instance, which is why only one failover group can be configured on an instance, and it fails over all these databases as a unit: a partial failover of a subset of databases isn't possible.
        fr: |
          Une instance managée existante peut être convertie en configuration redondante interzone en modifiant ses paramètres : aucune migration vers une nouvelle instance n'est nécessaire. Un groupe de basculement de SQL Managed Instance contient toutes les bases de données utilisateur de l'instance, c'est pourquoi un seul groupe de basculement peut être configuré sur une instance, et il fait basculer toutes ces bases de données comme une unité : un basculement partiel d'un sous-ensemble de bases de données n'est pas possible.
    references:
      - title: Availability Through Local and Zone Redundancy - Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/high-availability-sla-local-zone-redundancy
      - title: Failover Groups Overview & Best Practices - Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/failover-group-sql-mi

  # ------------------------------------------------------------------ 10
  - id: az305-qz-32-10
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Adatum plans to deploy an Azure SQL database named TradesDb in the France Central region, which supports availability zones. The paired region is France South.

        The design must meet the following requirements:

        - If an availability zone of France Central fails, TradesDb must remain available with no loss of committed transactions.
        - Reporting queries must run on a readable copy of TradesDb in France Central. The copy must be included in the price of TradesDb, with no additional database to create.
        - After a region-wide outage of France Central, TradesDb must be recovered in France South. A downtime of up to one day and the loss of the last hours of transactions are acceptable, and no secondary database can be paid for.
        - Costs must be minimized.

        What should you recommend? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum prévoit de déployer une base de données Azure SQL nommée TradesDb dans la région France Central, qui prend en charge les zones de disponibilité. La région jumelée est France South.

        La conception doit répondre aux exigences suivantes :

        - Si une zone de disponibilité de France Central tombe en panne, TradesDb doit rester disponible sans perte de transactions validées.
        - Les requêtes de rapport doivent s'exécuter sur une copie lisible de TradesDb dans France Central. La copie doit être incluse dans le prix de TradesDb, sans base de données supplémentaire à créer.
        - Après une panne de toute la région France Central, TradesDb doit être récupérée dans France South. Une interruption d'une journée au plus et la perte des dernières heures de transactions sont acceptables, et aucune base de données secondaire ne doit être payée.
        - Les coûts doivent être réduits au minimum.

        Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Service tier: [[tier]]

          Reporting: [[reports]]

          Regional recovery: [[region]]
        fr: |
          Niveau de service : [[tier]]

          Rapports : [[reports]]

          Récupération régionale : [[region]]
      slots:
        - id: tier
          options:
            - { id: std, text: { en: "Standard (DTU)", fr: "Standard (DTU)" } }
            - { id: gp, text: { en: "General Purpose, zone-redundant", fr: "General Purpose, redondant interzone" } }
            - { id: gpsl, text: { en: "General Purpose serverless, zone-redundant", fr: "General Purpose serverless, redondant interzone" } }
            - { id: bc, text: { en: "Business Critical, zone-redundant", fr: "Business Critical, redondant interzone" } }
        - id: reports
          options:
            - { id: intent, text: { en: "Connections that specify ApplicationIntent=ReadOnly", fr: "Des connexions qui spécifient ApplicationIntent=ReadOnly" } }
            - { id: geo, text: { en: "A geo-secondary in France Central created by active geo-replication", fr: "Un géosecondaire dans France Central créé par la géoréplication active" } }
            - { id: listener, text: { en: "The read-only listener endpoint of a failover group", fr: "Le point de terminaison d'écouteur en lecture seule d'un groupe de basculement" } }
            - { id: named, text: { en: "A named replica of TradesDb", fr: "Un réplica nommé de TradesDb" } }
        - id: region
          options:
            - { id: fog, text: { en: "A failover group with a server in France South", fr: "Un groupe de basculement avec un serveur dans France South" } }
            - { id: agr, text: { en: "Active geo-replication to a server in France South", fr: "La géoréplication active vers un serveur dans France South" } }
            - { id: restore, text: { en: "A geo-restore from geo-redundant backups", fr: "Une géorestauration depuis des sauvegardes géoredondantes" } }
    answer:
      values: { tier: bc, reports: intent, region: restore }
    explanation:
      correct:
        en: |
          Business Critical keeps a primary and secondary replicas on local SSD storage; with zone redundancy, enabled at no extra cost, they are spread across zones and replicated synchronously, so a zone failure loses no committed transaction. One of these replicas serves read-only connections that specify ApplicationIntent=ReadOnly, at no extra cost and in the same region. A geo-restore creates the database in France South from the geo-replicated backups, with a downtime and a data loss within the stated limits and without any secondary database.
        fr: |
          Business Critical maintient un réplica principal et des réplicas secondaires sur un stockage SSD local ; avec la redondance de zone, activée sans surcoût, ils sont répartis entre les zones et répliqués de façon synchrone : la panne d'une zone ne fait perdre aucune transaction validée. L'un de ces réplicas sert les connexions en lecture seule qui spécifient ApplicationIntent=ReadOnly, sans surcoût et dans la même région. Une géorestauration crée la base de données dans France South à partir des sauvegardes géorépliquées, avec une interruption et une perte de données dans les limites énoncées et sans aucune base de données secondaire.
      options:
        std: { en: "The Standard tier of the DTU model doesn't support zone redundancy.", fr: "Le niveau Standard du modèle DTU ne prend pas en charge la redondance de zone." }
        gp: { en: "General Purpose supports zone redundancy but has no read scale-out replica, so reporting would need an additional database.", fr: "General Purpose prend en charge la redondance de zone, mais n'a pas de réplica de lecture à grande échelle : les rapports exigeraient une base de données supplémentaire." }
        gpsl: { en: "Serverless General Purpose has no read scale-out replica either.", fr: "General Purpose serverless n'a pas non plus de réplica de lecture à grande échelle." }
        geo: { en: "A geo-secondary is an additional database that is billed separately.", fr: "Un géosecondaire est une base de données supplémentaire facturée séparément." }
        listener: { en: "The read-only listener points to the secondary database of the failover group, in another region and billed separately.", fr: "L'écouteur en lecture seule pointe vers la base de données secondaire du groupe de basculement, dans une autre région et facturée séparément." }
        named: { en: "Named replicas exist only in the Hyperscale tier, and each one is created as a separate read-only database with its own service objective.", fr: "Les réplicas nommés n'existent qu'au niveau Hyperscale, et chacun est créé comme une base de données distincte en lecture seule avec son propre objectif de service." }
        fog: { en: "A failover group needs a secondary database in France South, which is billed at all times.", fr: "Un groupe de basculement exige une base de données secondaire dans France South, facturée en permanence." }
        agr: { en: "Active geo-replication also keeps a billed secondary database in France South.", fr: "La géoréplication active maintient elle aussi une base de données secondaire facturée dans France South." }
    references:
      - title: Read Queries on Replicas - Azure SQL Database & Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/read-scale-out
      - title: Restore a Database from a Backup - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/recovery-using-backups
