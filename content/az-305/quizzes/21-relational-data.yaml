chapter: 21-relational-data
questions:
  # ------------------------------------------------------------------ 1
  - id: az305-qz-21-01
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso migrates the database of an internal application from SQL Server to a single database in Azure SQL Database. On-premises, SQL Server Agent jobs run Transact-SQL scripts every night to rebuild indexes and purge old rows.

        Which feature should you recommend to run these scheduled scripts after the migration?
      fr: |
        Contoso migre la base de données d'une application interne de SQL Server vers une base de données unique dans Azure SQL Database. En local, des travaux SQL Server Agent exécutent chaque nuit des scripts Transact-SQL qui reconstruisent les index et purgent les lignes anciennes.

        Quelle fonctionnalité devez-vous recommander pour exécuter ces scripts planifiés après la migration ?
    body:
      options:
        - { id: a, text: { en: "SQL Server Agent jobs in the database", fr: "Des travaux SQL Server Agent dans la base de données" } }
        - { id: b, text: { en: "Elastic query across the databases", fr: "La requête élastique entre les bases de données" } }
        - { id: c, text: { en: "The SQL IaaS Agent extension", fr: "L'extension SQL IaaS Agent" } }
        - { id: d, text: { en: "Elastic jobs that target the database", fr: "Des travaux élastiques qui ciblent la base de données" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Azure SQL Database has no SQL Server Agent. Elastic jobs schedule Transact-SQL scripts and maintenance tasks that run periodically against one or many databases, which replaces the nightly Agent jobs.
        fr: |
          Azure SQL Database n'a pas de SQL Server Agent. Les travaux élastiques planifient des scripts Transact-SQL et des tâches de maintenance qui s'exécutent périodiquement sur une ou plusieurs bases de données, ce qui remplace les travaux Agent de la nuit.
      options:
        a: { en: "SQL Server Agent is available in SQL Managed Instance and on virtual machines, not in Azure SQL Database.", fr: "SQL Server Agent est disponible dans SQL Managed Instance et sur les machines virtuelles, pas dans Azure SQL Database." }
        b: { en: "Elastic query runs queries that span databases; it doesn't schedule anything.", fr: "La requête élastique exécute des requêtes qui couvrent plusieurs bases de données ; elle ne planifie rien." }
        c: { en: "The SQL IaaS Agent extension manages SQL Server on Azure Virtual Machines, not Azure SQL Database.", fr: "L'extension SQL IaaS Agent gère SQL Server sur machines virtuelles Azure, pas Azure SQL Database." }
    references:
      - title: Elastic Jobs Overview - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-jobs-overview

  # ------------------------------------------------------------------ 2
  - id: az305-qz-21-02
    objective: "2.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam moved a 900 GB database in Azure SQL Database from the General Purpose service tier to the Hyperscale service tier. The database has never been larger than 1 TB.

        The finance team asks whether the database can return to General Purpose if Hyperscale doesn't bring the expected benefits.

        Which statement is correct?
      fr: |
        Fabrikam a fait passer une base de données de 900 Go d'Azure SQL Database du niveau de service General Purpose au niveau de service Hyperscale. La base de données n'a jamais dépassé 1 To.

        L'équipe financière demande si la base de données peut revenir à General Purpose si Hyperscale n'apporte pas les bénéfices attendus.

        Quelle affirmation est correcte ?
    body:
      options:
        - { id: a, text: { en: "It can return to General Purpose at any time, like any other change of service tier.", fr: "Elle peut revenir à General Purpose à tout moment, comme pour tout autre changement de niveau de service." } }
        - { id: b, text: { en: "It can return to General Purpose only within 45 days of its migration to Hyperscale.", fr: "Elle ne peut revenir à General Purpose que dans les 45 jours qui suivent sa migration vers Hyperscale." } }
        - { id: c, text: { en: "It can never leave Hyperscale; a copy must be exported and imported into a new database.", fr: "Elle ne peut jamais quitter Hyperscale ; une copie doit être exportée puis importée dans une nouvelle base." } }
        - { id: d, text: { en: "It can return to General Purpose or to Business Critical, but only within 7 days.", fr: "Elle peut revenir à General Purpose ou à Business Critical, mais seulement dans un délai de 7 jours." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A database that was migrated to Hyperscale can be reverse migrated to the General Purpose service tier within 45 days of the original migration. After that window, the change can't be undone by a change of service tier.
        fr: |
          Une base de données migrée vers Hyperscale peut faire l'objet d'une migration inverse vers le niveau de service General Purpose dans les 45 jours qui suivent la migration initiale. Passé ce délai, le changement ne peut plus être annulé par un changement de niveau de service.
      options:
        a: { en: "Moving out of Hyperscale isn't an ordinary change of service tier: it is a reverse migration limited in time.", fr: "Quitter Hyperscale n'est pas un changement de niveau de service ordinaire : c'est une migration inverse limitée dans le temps." }
        c: { en: "A reverse migration is possible during 45 days; an export is needed only after this window.", fr: "Une migration inverse est possible pendant 45 jours ; un export n'est nécessaire qu'après ce délai." }
        d: { en: "The window is 45 days, and the target of the reverse migration is General Purpose.", fr: "Le délai est de 45 jours, et la cible de la migration inverse est General Purpose." }
    references:
      - title: What is the Hyperscale service tier? - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale

  # ------------------------------------------------------------------ 3
  - id: az305-qz-21-03
    objective: "2.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware hosts 15 databases on a logical server in Azure SQL Database. Some applications still connect with SQL logins and passwords. A Microsoft Entra admin is already set on the server.

        The security team requires the following:

        - No SQL authentication account, including the server administrator, must be able to connect.
        - Users must sign in with their organizational accounts, so that multifactor authentication and Conditional Access apply.

        What should you recommend?
      fr: |
        Litware héberge 15 bases de données sur un serveur logique d'Azure SQL Database. Certaines applications se connectent encore avec des connexions SQL et des mots de passe. Un administrateur Microsoft Entra est déjà défini sur le serveur.

        L'équipe de sécurité exige ce qui suit :

        - Aucun compte d'authentification SQL, y compris l'administrateur du serveur, ne doit pouvoir se connecter.
        - Les utilisateurs doivent se connecter avec leur compte professionnel, pour que l'authentification multifacteur et l'accès conditionnel s'appliquent.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Enable Microsoft Entra-only authentication on the logical server.", fr: "Activer l'authentification Microsoft Entra uniquement sur le serveur logique." } }
        - { id: b, text: { en: "Enable Microsoft Defender for SQL on the logical server.", fr: "Activer Microsoft Defender pour SQL sur le serveur logique." } }
        - { id: c, text: { en: "Select Deny public network access on the logical server.", fr: "Sélectionner Deny public network access sur le serveur logique." } }
        - { id: d, text: { en: "Enable Always Encrypted on the columns of the 15 databases.", fr: "Activer Always Encrypted sur les colonnes des 15 bases de données." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Microsoft Entra-only authentication disables SQL authentication at the server level: no SQL login can connect, the server administrator included, and only Microsoft Entra identities are accepted, which brings multifactor authentication and Conditional Access. The existing SQL logins aren't deleted, they just can no longer connect. The feature requires a Microsoft Entra admin, which already exists.
        fr: |
          L'authentification Microsoft Entra uniquement désactive l'authentification SQL au niveau du serveur : aucune connexion SQL ne peut se connecter, administrateur du serveur compris, et seules les identités Microsoft Entra sont acceptées, ce qui apporte l'authentification multifacteur et l'accès conditionnel. Les connexions SQL existantes ne sont pas supprimées, elles ne peuvent simplement plus se connecter. La fonctionnalité exige un administrateur Microsoft Entra, qui existe déjà.
      options:
        b: { en: "Defender for SQL detects threats such as brute force or SQL injection; it doesn't disable SQL authentication.", fr: "Defender pour SQL détecte des menaces comme la force brute ou l'injection SQL ; il ne désactive pas l'authentification SQL." }
        c: { en: "Denying public network access restricts the network path, but SQL logins still authenticate over private endpoints.", fr: "Refuser l'accès au réseau public restreint le chemin réseau, mais les connexions SQL s'authentifient toujours par les points de terminaison privés." }
        d: { en: "Always Encrypted protects column values from administrators; it doesn't change how users authenticate.", fr: "Always Encrypted protège les valeurs de colonnes vis-à-vis des administrateurs ; il ne change pas la façon dont les utilisateurs s'authentifient." }
    references:
      - title: Microsoft Entra-Only Authentication - Azure SQL Database & Azure SQL Managed Instance
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-azure-ad-only-authentication

  # ------------------------------------------------------------------ 4
  - id: az305-qz-21-04
    objective: "2.1.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys plans to use an elastic pool in the vCore purchasing model for the 40 tenant databases of a SaaS application. Today, 30 of the databases are on a logical server named **sql-tt1** and 10 are on a logical server named **sql-tt2**, in the same region. The peaks of the tenants occur at different times.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys prévoit d'utiliser un pool élastique dans le modèle d'achat vCore pour les 40 bases de données de locataires d'une application SaaS. Aujourd'hui, 30 de ces bases de données se trouvent sur un serveur logique nommé **sql-tt1** et 10 sur un serveur logique nommé **sql-tt2**, dans la même région. Les pics des locataires surviennent à des moments différents.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The 40 databases can be added to one pool while 10 of them stay on sql-tt2.", fr: "Les 40 bases de données peuvent être ajoutées à un même pool tandis que 10 d'entre elles restent sur sql-tt2." }
        - id: s2
          text: { en: "A maximum number of vCores can be set per database so that one tenant can't use all the resources of the pool.", fr: "Un nombre maximal de vCores peut être défini par base de données pour qu'un locataire ne puisse pas utiliser toutes les ressources du pool." }
        - id: s3
          text: { en: "Each database added to the pool adds a compute charge of its own to the price of the pool.", fr: "Chaque base de données ajoutée au pool ajoute une facturation de calcul qui lui est propre au prix du pool." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          The databases of an elastic pool are on a single logical server: databases of different servers can't share a pool. Minimum and maximum resources can be set per database to keep one tenant from starving the others. A pool is billed per hour for its eDTUs or vCores, with no per-database charge, which is why it saves money when peaks are staggered.
        fr: |
          Les bases de données d'un pool élastique se trouvent sur un seul serveur logique : des bases de données de serveurs différents ne peuvent pas partager un pool. Des ressources minimales et maximales peuvent être définies par base de données pour éviter qu'un locataire prive les autres de ressources. Un pool est facturé à l'heure pour ses eDTU ou ses vCores, sans facturation par base de données ; c'est pourquoi il fait économiser quand les pics sont décalés.
      options:
        s1: { en: "A pool can't contain databases from different logical servers; the 10 databases must first be on sql-tt1, or be placed in another pool.", fr: "Un pool ne peut pas contenir de bases de données de serveurs logiques différents ; les 10 bases de données doivent d'abord se trouver sur sql-tt1, ou aller dans un autre pool." }
        s3: { en: "There is no per-database charge in an elastic pool: the pool is billed for its resources.", fr: "Il n'y a pas de facturation par base de données dans un pool élastique : le pool est facturé pour ses ressources." }
    references:
      - title: Manage Multiple Databases with Elastic Pools - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-pool-overview

  # ------------------------------------------------------------------ 5
  - id: az305-qz-21-05
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys runs the production database of its booking platform on Azure Database for PostgreSQL flexible server. The workload processes many concurrent transactions, and monitoring shows that queries are slowed down by a lack of memory, while processor usage stays moderate.

        You need to recommend a compute tier that gives the server more memory per vCore. The server must remain supported for production workloads.

        What should you recommend?
      fr: |
        Wingtip Toys exécute la base de données de production de sa plateforme de réservation sur Azure Database for PostgreSQL (serveur flexible). La charge de travail traite de nombreuses transactions simultanées, et la supervision montre que les requêtes sont ralenties par un manque de mémoire, alors que l'utilisation du processeur reste modérée.

        Vous devez recommander un niveau de calcul qui donne au serveur davantage de mémoire par vCore. Le serveur doit rester pris en charge pour les charges de travail de production.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: Burstable }
        - { id: b, text: General Purpose }
        - { id: c, text: Memory Optimized }
        - { id: d, text: Business Critical }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Memory Optimized offers 6.75 to 9.5 GiB of memory per vCore, compared with 4 GiB in General Purpose, for high-performance transactional workloads with high concurrency. It is the tier to choose when memory, not the processor, limits a production server.
        fr: |
          Memory Optimized offre de 6,75 à 9,5 Gio de mémoire par vCore, contre 4 Gio en General Purpose, pour les charges de travail transactionnelles hautes performances avec une forte simultanéité. C'est le niveau à choisir quand la mémoire, et non le processeur, limite un serveur de production.
      options:
        a: { en: "Burstable is designed for development and small workloads and isn't recommended for production.", fr: "Burstable est conçu pour le développement et les petites charges de travail et n'est pas recommandé pour la production." }
        b: { en: "General Purpose keeps 4 GiB per vCore: more memory would require more vCores than the workload needs.", fr: "General Purpose reste à 4 Gio par vCore : davantage de mémoire exigerait plus de vCores que la charge de travail n'en a besoin." }
        d: { en: "Business Critical is a service tier of Azure SQL Database and SQL Managed Instance, not a compute tier of PostgreSQL flexible server.", fr: "Business Critical est un niveau de service d'Azure SQL Database et de SQL Managed Instance, pas un niveau de calcul d'Azure Database for PostgreSQL (serveur flexible)." }
    references:
      - title: Compute Options - Azure Database for PostgreSQL
        url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-compute

  # ------------------------------------------------------------------ 6
  - id: az305-qz-21-06
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam plans to move an on-premises SQL Server 2019 instance to Azure. The instance has the following characteristics:

        - Eight databases, 2 TB in total.
        - SQL Server Agent jobs and stored procedures that query tables in several databases.
        - 40 SQL Server Integration Services (SSIS) packages deployed to the SSIS catalog (SSISDB), which load data every night.

        You need to recommend a target that meets the following requirements:

        - Fabrikam must have no operating system to patch.
        - The database code and the SSIS packages must not be rewritten.
        - Administrative effort must be minimized.

        What should you recommend?
      fr: |
        Fabrikam prévoit de déplacer vers Azure une instance SQL Server 2019 locale. L'instance présente les caractéristiques suivantes :

        - Huit bases de données, 2 To au total.
        - Des travaux SQL Server Agent et des procédures stockées qui interrogent des tables de plusieurs bases de données.
        - 40 packages SQL Server Integration Services (SSIS) déployés dans le catalogue SSIS (SSISDB), qui chargent des données chaque nuit.

        Vous devez recommander une cible qui répond aux exigences suivantes :

        - Fabrikam ne doit avoir aucun système d'exploitation à corriger.
        - Le code des bases de données et les packages SSIS ne doivent pas être réécrits.
        - L'effort administratif doit être réduit au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "SQL Managed Instance for the databases and SSISDB, with an Azure-SSIS integration runtime that runs the packages", fr: "SQL Managed Instance pour les bases de données et SSISDB, avec un runtime d'intégration Azure-SSIS qui exécute les packages" } }
        - { id: b, text: { en: "SQL Server on an Azure virtual machine with SSIS installed, managed by the SQL IaaS Agent extension", fr: "SQL Server sur une machine virtuelle Azure avec SSIS installé, gérée par l'extension SQL IaaS Agent" } }
        - { id: c, text: { en: "Azure SQL Database in an elastic pool for the databases and SSISDB, with an Azure-SSIS integration runtime", fr: "Azure SQL Database dans un pool élastique pour les bases de données et SSISDB, avec un runtime d'intégration Azure-SSIS" } }
        - { id: d, text: { en: "SQL Managed Instance for the databases and SSISDB, with the packages run by the SQL Server Agent of the instance", fr: "SQL Managed Instance pour les bases de données et SSISDB, avec les packages exécutés par le SQL Server Agent de l'instance" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          SQL Managed Instance supports SQL Server Agent and queries across the databases of the instance, with no operating system to manage. It can also host SSISDB. The packages themselves run on an Azure-SSIS integration runtime in Azure Data Factory, which lets them be deployed and run in Azure without being rewritten.
        fr: |
          SQL Managed Instance prend en charge SQL Server Agent et les requêtes entre les bases de données de l'instance, sans système d'exploitation à gérer. Elle peut aussi héberger SSISDB. Les packages eux-mêmes s'exécutent sur un runtime d'intégration Azure-SSIS d'Azure Data Factory, qui permet de les déployer et de les exécuter dans Azure sans les réécrire.
      options:
        b: { en: "A virtual machine leaves the operating system and SQL Server patching to Fabrikam, which the first requirement forbids.", fr: "Une machine virtuelle laisse à Fabrikam la correction du système d'exploitation et de SQL Server, ce que la première exigence interdit." }
        c: { en: "Azure SQL Database has no SQL Server Agent and no cross-database queries, so the database code would have to change.", fr: "Azure SQL Database n'a ni SQL Server Agent ni requêtes entre bases de données : le code des bases de données devrait changer." }
        d: { en: "SQL Managed Instance doesn't run SSIS packages itself: an Azure-SSIS integration runtime is required to execute them.", fr: "SQL Managed Instance n'exécute pas elle-même les packages SSIS : un runtime d'intégration Azure-SSIS est nécessaire pour les exécuter." }
    references:
      - title: Create an Azure-SSIS integration runtime in Azure Data Factory - Azure Data Factory
        url: https://learn.microsoft.com/en-us/azure/data-factory/create-azure-ssis-integration-runtime

  # ------------------------------------------------------------------ 7
  - id: az305-qz-21-07
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum hosts a database named **db-claims** in Azure SQL Database, on a logical server in the West Europe region. To meet a residency rule, the backup storage redundancy of db-claims was changed to locally redundant storage. The point-in-time restore retention is 14 days, and no long-term retention policy exists.

        Adatum added a private endpoint for the server in a virtual network and changed no other network setting. A server firewall rule allows the public IP range of a partner company.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum héberge une base de données nommée **db-claims** dans Azure SQL Database, sur un serveur logique de la région West Europe. Pour respecter une règle de résidence, la redondance du stockage de sauvegarde de db-claims a été changée en stockage localement redondant. La conservation pour la restauration à un instant dans le passé est de 14 jours, et aucune stratégie de conservation à long terme n'existe.

        Adatum a ajouté un point de terminaison privé pour le serveur dans un réseau virtuel et n'a modifié aucun autre paramètre réseau. Une règle de pare-feu du serveur autorise la plage d'adresses IP publiques d'une société partenaire.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "If West Europe becomes unavailable, Adatum can recover db-claims in another region by using geo-restore.", fr: "Si la région West Europe devient indisponible, Adatum peut récupérer db-claims dans une autre région à l'aide de la géorestauration." }
        - id: s2
          text: { en: "The partner company can still connect to the server from the internet.", fr: "La société partenaire peut toujours se connecter au serveur depuis Internet." }
        - id: s3
          text: { en: "To restore db-claims to its state of 60 days ago at a later date, Adatum can raise the point-in-time restore retention to 60 days.", fr: "Pour restaurer plus tard db-claims dans son état d'il y a 60 jours, Adatum peut porter la conservation pour la restauration à un instant dans le passé à 60 jours." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Geo-restore is disabled as soon as a database uses locally redundant or zone-redundant backup storage, because the backups no longer leave the region. Adding a private endpoint doesn't block the public endpoint: until Deny public network access is selected, the firewall rule still lets the partner connect from the internet. Point-in-time restore retention is configurable from 1 to 35 days; keeping a restorable state beyond that requires long-term retention of full backups, up to 10 years.
        fr: |
          La géorestauration est désactivée dès qu'une base de données utilise un stockage de sauvegarde localement redondant ou redondant interzone, car les sauvegardes ne quittent plus la région. L'ajout d'un point de terminaison privé ne bloque pas le point de terminaison public : tant que Deny public network access n'est pas sélectionné, la règle de pare-feu laisse toujours le partenaire se connecter depuis Internet. La conservation pour la restauration à un instant dans le passé se configure de 1 à 35 jours ; garder un état restaurable au-delà exige la conservation à long terme de sauvegardes complètes, jusqu'à 10 ans.
      options:
        s1: { en: "With locally redundant backup storage, geo-restore isn't available.", fr: "Avec un stockage de sauvegarde localement redondant, la géorestauration n'est pas disponible." }
        s3: { en: "The maximum point-in-time restore retention is 35 days; a long-term retention policy is needed.", fr: "La conservation maximale pour la restauration à un instant dans le passé est de 35 jours ; une stratégie de conservation à long terme est nécessaire." }
    references:
      - title: Automatic, Geo-Redundant Backups - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
      - title: Azure Private Link - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/private-endpoint-overview

  # ------------------------------------------------------------------ 8
  - id: az305-qz-21-08
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso runs a SaaS application with one database per tenant in Azure SQL Database. All the databases are on the same logical server and use provisioned compute in the vCore model. Monitoring shows three groups of tenants:

        | Group | Databases | Usage |
        | --- | --- | --- |
        | A | 250 | Each database uses 2 to 5 % of its compute on average, with short peaks at different times of the day |
        | B | 6 | Each database uses 70 to 90 % of its 8 vCores all day long |
        | C | 1 | The database is 3.5 TB and grows by 150 GB every month; latency of 5 to 10 ms is acceptable |

        You need to recommend a configuration for each group. The solution must meet the following requirements:

        - Keep the current performance of every tenant.
        - Require no change to the application.
        - Minimize cost.

        What should you recommend? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso exploite une application SaaS avec une base de données par locataire dans Azure SQL Database. Toutes les bases de données sont sur le même serveur logique et utilisent le calcul provisionné du modèle vCore. La supervision fait apparaître trois groupes de locataires :

        | Groupe | Bases de données | Utilisation |
        | --- | --- | --- |
        | A | 250 | Chaque base de données utilise en moyenne 2 à 5 % de son calcul, avec de courts pics à des moments différents de la journée |
        | B | 6 | Chaque base de données utilise 70 à 90 % de ses 8 vCores toute la journée |
        | C | 1 | La base de données fait 3,5 To et grossit de 150 Go chaque mois ; une latence de 5 à 10 ms est acceptable |

        Vous devez recommander une configuration pour chaque groupe. La solution doit répondre aux exigences suivantes :

        - Conserver les performances actuelles de chaque locataire.
        - N'exiger aucune modification de l'application.
        - Réduire au minimum les coûts.

        Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Group A: [[a]]

          Group B: [[b]]

          Group C: [[c]]
        fr: |
          Groupe A : [[a]]

          Groupe B : [[b]]

          Groupe C : [[c]]
      slots:
        - id: a
          options:
            - { id: a-keep, text: { en: "Single databases, each sized for its peak", fr: "Des bases de données uniques, chacune dimensionnée pour son pic" } }
            - { id: a-pool, text: { en: "One elastic pool for the 250 databases", fr: "Un pool élastique pour les 250 bases de données" } }
            - { id: a-shard, text: { en: "Fewer, larger databases that each hold several tenants", fr: "Moins de bases de données, plus grandes, contenant chacune plusieurs locataires" } }
            - { id: a-hs, text: { en: "Hyperscale single databases with named replicas", fr: "Des bases de données uniques Hyperscale avec des réplicas nommés" } }
        - id: b
          options:
            - { id: b-pool, text: { en: "One elastic pool for the six databases", fr: "Un pool élastique pour les six bases de données" } }
            - { id: b-poola, text: { en: "The elastic pool of group A", fr: "Le pool élastique du groupe A" } }
            - { id: b-single, text: { en: "Provisioned single databases sized for their load", fr: "Des bases de données uniques provisionnées dimensionnées pour leur charge" } }
            - { id: b-sless, text: { en: "Serverless single databases with auto-pause enabled", fr: "Des bases de données uniques serverless avec mise en pause automatique" } }
        - id: c
          options:
            - { id: c-gp, text: { en: "General Purpose with a larger maximum size", fr: "General Purpose avec une taille maximale plus grande" } }
            - { id: c-bc, text: Business Critical }
            - { id: c-hs, text: Hyperscale }
            - { id: c-premium, text: { en: "Premium in the DTU model", fr: "Premium dans le modèle DTU" } }
    answer:
      values: { a: a-pool, b: b-single, c: c-hs }
    explanation:
      correct:
        en: |
          The 250 databases of group A have a low average use and staggered peaks, the profile for which an elastic pool shares resources and costs less than single databases sized for their peak. The databases of group B have a persistent high utilization: they gain nothing from a pool and stay provisioned single databases sized for their load. The database of group C will pass 4 TB within a few months; Hyperscale grows up to 128 TB, and its latency fits the requirement.
        fr: |
          Les 250 bases de données du groupe A ont une utilisation moyenne faible et des pics décalés, le profil pour lequel un pool élastique partage les ressources et coûte moins cher que des bases de données uniques dimensionnées pour leur pic. Les bases de données du groupe B ont une utilisation élevée et persistante : elles ne gagnent rien à un pool et restent des bases de données uniques provisionnées dimensionnées pour leur charge. La base de données du groupe C dépassera 4 To dans quelques mois ; Hyperscale grandit jusqu'à 128 To, et sa latence convient à l'exigence.
      options:
        a-keep: { en: "This is the current configuration, which pays for 250 peaks that never occur together.", fr: "C'est la configuration actuelle, qui paie 250 pics qui ne surviennent jamais ensemble." }
        a-shard: { en: "Grouping tenants into shared databases requires changing the application.", fr: "Regrouper des locataires dans des bases de données partagées exige de modifier l'application." }
        b-pool: { en: "Databases with persistent medium-to-high utilization shouldn't share a pool: their peaks overlap all day.", fr: "Des bases de données à l'utilisation moyenne à élevée persistante ne doivent pas partager un pool : leurs pics se chevauchent toute la journée." }
        b-sless: { en: "Serverless suits intermittent usage with idle periods; a database busy all day never pauses and costs more than provisioned compute.", fr: "Serverless convient à une utilisation intermittente avec des périodes d'inactivité ; une base de données occupée toute la journée ne se met jamais en pause et coûte plus cher que le calcul provisionné." }
        c-gp: { en: "General Purpose is limited to 4 TB per database.", fr: "General Purpose est limité à 4 To par base de données." }
        c-bc: { en: "Business Critical is also limited to 4 TB, and its low latency isn't required.", fr: "Business Critical est lui aussi limité à 4 To, et sa faible latence n'est pas exigée." }
        c-premium: { en: "Premium is limited to 4 TB, like the other tiers except Hyperscale.", fr: "Premium est limité à 4 To, comme les autres niveaux sauf Hyperscale." }
    references:
      - title: Manage Multiple Databases with Elastic Pools - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-pool-overview
      - title: What is the Hyperscale service tier? - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale

  # ------------------------------------------------------------------ 9
  - id: az305-qz-21-09
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders plans to migrate a 9 TB database to a single database in Azure SQL Database. The database uses only database-scoped features. Its compute usage is unpredictable: it varies between 1 and 12 vCores during the day, and it falls to 1 vCore for long periods.

        You need to recommend a service tier and a compute tier that meet the following requirements:

        - Compute must follow the load automatically, without intervention.
        - The database must stay online at all times, with no resume delay.
        - Minimize cost.

        What should you recommend?
      fr: |
        Northwind Traders prévoit de migrer une base de données de 9 To vers une base de données unique dans Azure SQL Database. La base de données n'utilise que des fonctionnalités limitées à la base de données. Son utilisation du calcul est imprévisible : elle varie entre 1 et 12 vCores dans la journée, et retombe à 1 vCore pendant de longues périodes.

        Vous devez recommander un niveau de service et un niveau de calcul qui répondent aux exigences suivantes :

        - Le calcul doit suivre la charge automatiquement, sans intervention.
        - La base de données doit rester en ligne en permanence, sans délai de reprise.
        - Réduire au minimum les coûts.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "General Purpose, serverless compute with auto-pause disabled", fr: "General Purpose, calcul serverless avec mise en pause automatique désactivée" } }
        - { id: b, text: { en: "Hyperscale, provisioned compute with 12 vCores", fr: "Hyperscale, calcul provisionné avec 12 vCores" } }
        - { id: c, text: { en: "Hyperscale, serverless compute with auto-pause enabled", fr: "Hyperscale, calcul serverless avec mise en pause automatique activée" } }
        - { id: d, text: { en: "Hyperscale, serverless compute without auto-pause", fr: "Hyperscale, calcul serverless sans mise en pause automatique" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          At 9 TB, only Hyperscale can hold the database as a single database. Hyperscale offers the serverless compute tier, which scales compute with the load and bills it per second, so the long periods at 1 vCore cost far less than 12 provisioned vCores. Without auto-pause, the database never pauses, so no connection waits for a resume.
        fr: |
          Avec 9 To, seul Hyperscale peut contenir la base de données sous forme de base de données unique. Hyperscale propose le niveau de calcul serverless, qui adapte le calcul à la charge et le facture à la seconde : les longues périodes à 1 vCore coûtent donc bien moins que 12 vCores provisionnés. Sans mise en pause automatique, la base de données ne se met jamais en pause, et aucune connexion n'attend de reprise.
      options:
        a: { en: "General Purpose is limited to 4 TB per database, which is too small for 9 TB.", fr: "General Purpose est limité à 4 To par base de données, ce qui est trop petit pour 9 To." }
        b: { en: "Provisioned compute is billed for 12 vCores all the time and doesn't follow the load, which doesn't minimize cost.", fr: "Le calcul provisionné est facturé pour 12 vCores en permanence et ne suit pas la charge, ce qui ne réduit pas les coûts au minimum." }
        c: { en: "Auto-pause in Hyperscale is a preview feature, and a paused database delays the first connection.", fr: "La mise en pause automatique dans Hyperscale est une fonctionnalité en préversion, et une base de données en pause retarde la première connexion." }
    references:
      - title: Serverless compute tier - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
      - title: What is the Hyperscale service tier? - Azure SQL Database
        url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale

  # ------------------------------------------------------------------ 10
  - id: az305-qz-21-10
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Wingtip Toys hosts the invoices of 600 tenants in one database in Azure SQL Database. Every table has a `TenantId` column. The application connects with a single managed identity and writes the identifier of the current tenant to `SESSION_CONTEXT` after it opens a connection.

        You need to recommend a data protection solution that meets the following requirements:

        - A query that omits the tenant filter must return only the rows of the current tenant, and the application must be unable to insert rows for another tenant.
        - Invoices can be corrected after they are issued. Wingtip Toys must be able to prove cryptographically to auditors that no row and no history of changes was altered outside the application, even by a database administrator.
        - The existing queries must not be rewritten.

        Which two features should you include in the recommendation? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys héberge les factures de 600 locataires dans une seule base de données d'Azure SQL Database. Chaque table a une colonne `TenantId`. L'application se connecte avec une seule identité managée et écrit l'identifiant du locataire courant dans `SESSION_CONTEXT` après l'ouverture d'une connexion.

        Vous devez recommander une solution de protection des données qui répond aux exigences suivantes :

        - Une requête qui omet le filtre de locataire ne doit renvoyer que les lignes du locataire courant, et l'application doit être incapable d'insérer des lignes pour un autre locataire.
        - Les factures peuvent être corrigées après leur émission. Wingtip Toys doit pouvoir prouver cryptographiquement aux auditeurs qu'aucune ligne ni aucun historique de modifications n'a été altéré en dehors de l'application, même par un administrateur de base de données.
        - Les requêtes existantes ne doivent pas être réécrites.

        Quelles sont les deux fonctionnalités que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Dynamic data masking on the `TenantId` column of each table", fr: "Le masquage dynamique des données sur la colonne `TenantId` de chaque table" } }
        - { id: b, text: { en: "Append-only ledger tables for the invoice tables", fr: "Des tables de registre d'ajout uniquement pour les tables de factures" } }
        - { id: c, text: { en: "Updatable ledger tables for the invoice tables", fr: "Des tables de registre pouvant être mises à jour pour les tables de factures" } }
        - { id: d, text: { en: "Auditing of the database to a storage account", fr: "L'audit de la base de données vers un compte de stockage" } }
        - { id: e, text: { en: "Row-level security with filter and block predicates", fr: "La sécurité au niveau des lignes avec des prédicats de filtre et de blocage" } }
    answer: { optionIds: [c, e] }
    explanation:
      correct:
        en: |
          Row-level security applies a security policy to every query: a filter predicate that compares `TenantId` with the value in `SESSION_CONTEXT` silently removes the rows of other tenants, and a block predicate rejects inserts for another tenant, with no change to the queries. Updatable ledger tables allow updates and keep the previous versions of the rows in a history table; database digests let Wingtip Toys prove to auditors that the data and its history weren't tampered with.
        fr: |
          La sécurité au niveau des lignes applique une stratégie de sécurité à chaque requête : un prédicat de filtre qui compare `TenantId` à la valeur de `SESSION_CONTEXT` retire silencieusement les lignes des autres locataires, et un prédicat de blocage rejette les insertions pour un autre locataire, sans modifier les requêtes. Les tables de registre pouvant être mises à jour autorisent les mises à jour et conservent les versions précédentes des lignes dans une table d'historique ; les condensés de base de données permettent à Wingtip Toys de prouver aux auditeurs que les données et leur historique n'ont pas été falsifiés.
      options:
        a: { en: "Dynamic data masking only hides values in results; it doesn't filter rows or block inserts.", fr: "Le masquage dynamique des données masque seulement des valeurs dans les résultats ; il ne filtre pas de lignes et ne bloque pas d'insertions." }
        b: { en: "Append-only ledger tables block updates and deletions, but invoices must be correctable.", fr: "Les tables de registre d'ajout uniquement bloquent les mises à jour et les suppressions, alors que les factures doivent pouvoir être corrigées." }
        d: { en: "Auditing records events, but it gives no cryptographic proof that the data and its history are intact.", fr: "L'audit enregistre des événements, mais il ne fournit aucune preuve cryptographique que les données et leur historique sont intacts." }
    references:
      - title: Row-Level Security - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/row-level-security
      - title: Ledger Overview - SQL Server
        url: https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-overview
