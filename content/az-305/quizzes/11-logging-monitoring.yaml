chapter: 11-logging-monitoring
questions:
  # ------------------------------------------------------------------ 1
  - id: az305-qz-11-01
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso instruments a new web API with Application Insights by using the Azure Monitor OpenTelemetry Distro. The operations team wants to query the requests and exceptions of the API with KQL, in the same queries as the resource logs of the other Azure services.

        Where does Application Insights store the telemetry of the API?
      fr: |
        Contoso instrumente une nouvelle API web avec Application Insights à l'aide de la distribution OpenTelemetry d'Azure Monitor. L'équipe d'exploitation veut interroger les requêtes et les exceptions de l'API en KQL, dans les mêmes requêtes que les journaux de ressources des autres services Azure.

        Où Application Insights stocke-t-il la télémétrie de l'API ?
    body:
      options:
        - { id: a, text: { en: "In an Azure Monitor workspace", fr: "Dans un espace de travail Azure Monitor" } }
        - { id: b, text: { en: "In a storage account linked to the resource", fr: "Dans un compte de stockage lié à la ressource" } }
        - { id: c, text: { en: "In a Log Analytics workspace", fr: "Dans un espace de travail Log Analytics" } }
        - { id: d, text: { en: "In the activity log of the subscription", fr: "Dans le journal d'activité de l'abonnement" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Application Insights resources are workspace-based: they send their telemetry to a Log Analytics workspace, where it can be queried with KQL and joined with the other logs of the workspace. Ingestion and retention of this telemetry are billed through that workspace. Classic resources, which kept the data apart, have been retired.
        fr: |
          Les ressources Application Insights sont basées sur un espace de travail : elles envoient leur télémétrie à un espace de travail Log Analytics, où elle s'interroge en KQL et se joint aux autres journaux de l'espace de travail. L'ingestion et la rétention de cette télémétrie sont facturées par cet espace de travail. Les ressources classiques, qui gardaient les données à part, ont été mises hors service.
      options:
        a: { en: "An Azure Monitor workspace stores Prometheus and OpenTelemetry metrics queried with PromQL, not the requests and exceptions that are queried with KQL.", fr: "Un espace de travail Azure Monitor stocke des métriques Prometheus et OpenTelemetry interrogées en PromQL, pas les requêtes et les exceptions interrogées en KQL." }
        b: { en: "A storage account is an archive destination of diagnostic settings or data export rules; Application Insights doesn't store its telemetry there.", fr: "Un compte de stockage est une destination d'archivage des paramètres de diagnostic ou des règles d'exportation de données ; Application Insights n'y stocke pas sa télémétrie." }
        d: { en: "The activity log records control plane operations on the subscription, not the application telemetry.", fr: "Le journal d'activité enregistre les opérations du plan de contrôle sur l'abonnement, pas la télémétrie applicative." }
    references:
      - title: Create and configure Application Insights resources - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/create-workspace-resource

  # ------------------------------------------------------------------ 2
  - id: az305-qz-11-02
    objective: "1.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The compliance team of Fabrikam must continuously assess the resources of its Azure subscriptions against the controls of ISO 27001 and of the Microsoft cloud security benchmark, see which controls fail, and download reports for the auditors.

        Which service should you recommend?
      fr: |
        L'équipe de conformité de Fabrikam doit évaluer en continu les ressources de ses abonnements Azure par rapport aux contrôles d'ISO 27001 et du benchmark de sécurité cloud Microsoft, voir quels contrôles échouent et télécharger des rapports pour les auditeurs.

        Quel service devez-vous recommander ?
    body:
      options:
        - { id: a, text: Microsoft Sentinel }
        - { id: b, text: Azure Advisor }
        - { id: c, text: Azure Service Health }
        - { id: d, text: { en: "Microsoft Defender for Cloud", fr: "Microsoft Defender pour le cloud" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The regulatory compliance dashboard of Microsoft Defender for Cloud continuously assesses resources against the controls of the assigned standards, shows the failing controls with the affected resources, and produces compliance reports for auditors. The Microsoft cloud security benchmark is assigned by default; adding other standards such as ISO 27001 requires at least one paid Defender for Cloud plan.
        fr: |
          Le tableau de bord de conformité réglementaire de Microsoft Defender pour le cloud évalue en continu les ressources par rapport aux contrôles des normes attribuées, affiche les contrôles en échec avec les ressources concernées et produit des rapports de conformité pour les auditeurs. Le benchmark de sécurité cloud Microsoft est attribué par défaut ; l'ajout d'autres normes comme ISO 27001 exige au moins un plan payant de Defender pour le cloud.
      options:
        a: { en: "Microsoft Sentinel correlates security events into incidents and automates the response; it doesn't score resources against regulatory standards.", fr: "Microsoft Sentinel corrèle les événements de sécurité en incidents et automatise la réponse ; il n'évalue pas les ressources par rapport aux normes réglementaires." }
        b: { en: "Azure Advisor gives cost, security, reliability, performance and operational excellence recommendations, without a per-standard compliance assessment.", fr: "Azure Advisor donne des recommandations de coût, de sécurité, de fiabilité, de performances et d'excellence opérationnelle, sans évaluation de conformité par norme." }
        c: { en: "Azure Service Health reports Azure outages and planned maintenance in your regions, not the compliance of your resources.", fr: "Azure Service Health signale les pannes Azure et les maintenances planifiées dans vos régions, pas la conformité de vos ressources." }
    references:
      - title: Improve regulatory compliance in Microsoft Defender for Cloud - Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/regulatory-compliance-dashboard

  # ------------------------------------------------------------------ 3
  - id: az305-qz-11-03
    objective: "1.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware is designing the diagnostic settings of its key vaults, storage accounts and App Service apps, which will send their resource logs to a Log Analytics workspace. The security team has two requirements:

        - To limit the ingestion cost, only the audit logs of each resource are sent to the workspace.
        - When Microsoft adds an audit log category to one of these resource types, the new category is collected without any change to the diagnostic settings.

        What should the diagnostic settings select?
      fr: |
        Litware conçoit les paramètres de diagnostic de ses coffres de clés, de ses comptes de stockage et de ses applications App Service, qui enverront leurs journaux de ressources à un espace de travail Log Analytics. L'équipe de sécurité a deux exigences :

        - Pour limiter le coût d'ingestion, seuls les journaux d'audit de chaque ressource sont envoyés à l'espace de travail.
        - Quand Microsoft ajoute une catégorie de journaux d'audit à l'un de ces types de ressources, la nouvelle catégorie est collectée sans aucune modification des paramètres de diagnostic.

        Que doivent sélectionner les paramètres de diagnostic ?
    body:
      options:
        - { id: a, text: { en: "The allLogs category group, in a diagnostic setting on each resource", fr: "Le groupe de catégories allLogs, dans un paramètre de diagnostic sur chaque ressource" } }
        - { id: b, text: { en: "The audit category group, in a diagnostic setting on each resource", fr: "Le groupe de catégories audit, dans un paramètre de diagnostic sur chaque ressource" } }
        - { id: c, text: { en: "The audit categories listed one by one, in a diagnostic setting on each resource", fr: "Les catégories d'audit listées une par une, dans un paramètre de diagnostic sur chaque ressource" } }
        - { id: d, text: { en: "The audit category group, in one diagnostic setting on each subscription", fr: "Le groupe de catégories audit, dans un seul paramètre de diagnostic sur chaque abonnement" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The `audit` category group contains the resource logs that record interactions with the data or the settings of the service. A category group is dynamic: when the categories that belong to it change, the collection of the diagnostic setting changes automatically. It is selected in the diagnostic setting of each resource, because resource logs are configured resource by resource.
        fr: |
          Le groupe de catégories `audit` contient les journaux de ressources qui enregistrent les interactions avec les données ou les paramètres du service. Un groupe de catégories est dynamique : quand les catégories qui en font partie changent, la collecte du paramètre de diagnostic change automatiquement. Il se sélectionne dans le paramètre de diagnostic de chaque ressource, car les journaux de ressources se configurent ressource par ressource.
      options:
        a: { en: "`allLogs` collects every category of the resource, not only the audit logs, which increases the ingestion cost.", fr: "`allLogs` collecte toutes les catégories de la ressource, pas seulement les journaux d'audit, ce qui augmente le coût d'ingestion." }
        c: { en: "Individual categories are fixed in the setting: a category added later by Microsoft isn't collected until someone edits every setting.", fr: "Des catégories individuelles sont figées dans le paramètre : une catégorie ajoutée plus tard par Microsoft n'est pas collectée tant que quelqu'un ne modifie pas chaque paramètre." }
        d: { en: "A diagnostic setting on a subscription exports its activity log, not the resource logs of the resources it contains.", fr: "Un paramètre de diagnostic sur un abonnement exporte son journal d'activité, pas les journaux de ressources des ressources qu'il contient." }
    references:
      - title: Diagnostic settings in Azure Monitor - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings

  # ------------------------------------------------------------------ 4
  - id: az305-qz-11-04
    objective: "1.1.3"
    difficulty: 2
    status: draft
    type: dragdrop
    stem:
      en: |
        Northwind Traders runs Azure SQL databases, virtual machines and an Azure Kubernetes Service (AKS) cluster whose metrics are collected by Azure Monitor managed service for Prometheus.

        Three teams express monitoring needs. You need to recommend a capability for each need.

        What should you recommend for each need? To answer, drag the appropriate capabilities to the correct needs. Each capability may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders exploite des bases de données Azure SQL, des machines virtuelles et un cluster Azure Kubernetes Service (AKS) dont les métriques sont collectées par le service managé Azure Monitor pour Prometheus.

        Trois équipes expriment des besoins de monitoring. Vous devez recommander une fonctionnalité pour chaque besoin.

        Que devez-vous recommander pour chaque besoin ? Pour répondre, faites glisser les fonctionnalités appropriées vers les besoins correspondants. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: rh, text: { en: "A Resource Health alert rule", fr: "Une règle d'alerte Resource Health" } }
        - { id: sh, text: { en: "A Service Health alert rule", fr: "Une règle d'alerte Service Health" } }
        - { id: prom, text: { en: "A Prometheus alert rule", fr: "Une règle d'alerte Prometheus" } }
        - { id: log, text: { en: "A log search alert rule", fr: "Une règle d'alerte de recherche dans les journaux" } }
        - { id: adv, text: Azure Advisor }
      targets:
        - { id: t1, text: { en: "The database team is notified when the database sqldb-orders becomes unavailable because of a problem of the Azure platform.", fr: "L'équipe des bases de données est prévenue quand la base de données sqldb-orders devient indisponible à cause d'un problème de la plateforme Azure." } }
        - { id: t2, text: { en: "The platform team is notified when a PromQL expression that counts the restarts of the pods of the cluster is true.", fr: "L'équipe de plateforme est prévenue quand une expression PromQL qui compte les redémarrages des pods du cluster est vraie." } }
        - { id: t3, text: { en: "The finance team receives recommendations to reduce the cost of underused virtual machines.", fr: "L'équipe financière reçoit des recommandations pour réduire le coût des machines virtuelles sous-utilisées." } }
    answer:
      mapping: { t1: rh, t2: prom, t3: adv }
    explanation:
      correct:
        en: |
          A Resource Health alert fires when the health status of a given resource changes, for example when a database becomes unavailable for a platform reason. Prometheus alert rules belong to Prometheus rule groups and fire when a PromQL expression on the metrics of Azure Monitor managed service for Prometheus is true. Azure Advisor produces cost recommendations, among its five categories, such as acting on underused virtual machines.
        fr: |
          Une alerte Resource Health se déclenche quand l'état d'intégrité d'une ressource donnée change, par exemple quand une base de données devient indisponible pour une raison liée à la plateforme. Les règles d'alerte Prometheus font partie de groupes de règles Prometheus et se déclenchent quand une expression PromQL sur les métriques du service managé Azure Monitor pour Prometheus est vraie. Azure Advisor produit, parmi ses cinq catégories, des recommandations de coût, comme agir sur les machines virtuelles sous-utilisées.
      options:
        sh: { en: "Service Health reports service issues and planned maintenance in your regions, not the health of one specific database.", fr: "Service Health signale les problèmes de service et les maintenances planifiées dans vos régions, pas l'intégrité d'une base de données précise." }
        log: { en: "A log search alert runs KQL on a Log Analytics workspace; managed Prometheus metrics are stored in an Azure Monitor workspace and evaluated with PromQL.", fr: "Une alerte de recherche dans les journaux exécute du KQL sur un espace de travail Log Analytics ; les métriques Prometheus managées sont stockées dans un espace de travail Azure Monitor et évaluées en PromQL." }
    references:
      - title: Types of Azure Monitor alerts - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
      - title: Introduction to Azure Advisor - Azure Advisor
        url: https://learn.microsoft.com/en-us/azure/advisor/advisor-overview

  # ------------------------------------------------------------------ 5
  - id: az305-qz-11-05
    objective: "1.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has a single Log Analytics workspace named **WS1** in a subscription of the IT department. WS1 collects the logs of 12 other subscriptions, and each of these subscriptions belongs to one department.

        The finance team wants to charge each department every month for its share of the log data that WS1 ingests. The architects want to keep a single workspace if it meets the need, and to minimize administrative effort.

        What should you recommend?
      fr: |
        Adatum dispose d'un seul espace de travail Log Analytics nommé **WS1**, dans un abonnement du service informatique. WS1 collecte les journaux de 12 autres abonnements, et chacun de ces abonnements appartient à un service de l'entreprise.

        L'équipe financière veut refacturer chaque mois à chaque service sa part des données de journal ingérées par WS1. Les architectes veulent conserver un seul espace de travail s'il répond au besoin, et réduire l'effort administratif.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Report the charges of WS1 grouped by subscription in Cost Management.", fr: "Afficher les frais de WS1 regroupés par abonnement dans Cost Management." } }
        - { id: b, text: { en: "Create one workspace per department and send its resource logs there.", fr: "Créer un espace de travail par service et y envoyer ses journaux de ressources." } }
        - { id: c, text: { en: "Configure table-level access so that each department reads its own data.", fr: "Configurer l'accès au niveau des tables pour que chaque service lise ses propres données." } }
        - { id: d, text: { en: "Run a log query in WS1 that sums the billable volume by subscription.", fr: "Exécuter dans WS1 une requête de journal qui totalise le volume facturable par abonnement." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A log query can show the billable data volume of a workspace by Azure resource, resource group or subscription. Because each department has its own subscriptions, this report is granular enough for the charge back, and the single workspace can stay. A separate workspace per cost owner is recommended only when neither Cost Management nor a log query is granular enough.
        fr: |
          Une requête de journal peut afficher le volume de données facturables d'un espace de travail par ressource Azure, par groupe de ressources ou par abonnement. Comme chaque service a ses propres abonnements, ce rapport est assez précis pour la refacturation, et l'espace de travail unique peut rester. Un espace de travail distinct par responsable de coûts n'est recommandé que si ni Cost Management ni une requête de journal ne sont assez précis.
      options:
        a: { en: "Cost Management shows the charges by workspace: the whole cost of WS1 appears under the IT subscription, not split by the subscriptions that send the data.", fr: "Cost Management affiche les frais par espace de travail : tout le coût de WS1 apparaît sous l'abonnement informatique, sans répartition par les abonnements qui envoient les données." }
        b: { en: "Splitting the workspace works, but it adds workspaces and diagnostic settings to maintain while a query already provides the figures.", fr: "Diviser l'espace de travail fonctionne, mais ajoute des espaces de travail et des paramètres de diagnostic à maintenir alors qu'une requête fournit déjà les chiffres." }
        c: { en: "Table-level access controls who reads which tables; it doesn't measure or split the ingested volume.", fr: "L'accès au niveau des tables contrôle qui lit quelles tables ; il ne mesure ni ne répartit le volume ingéré." }
    references:
      - title: Design a Log Analytics workspace architecture - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/workspace-design

  # ------------------------------------------------------------------ 6
  - id: az305-qz-11-06
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam has a single Microsoft Entra tenant and runs 60 App Service apps in the West Europe region. Diagnostic settings send the HTTP logs of all the apps to the **AppServiceHTTPLogs** table of a Log Analytics workspace named **WS1**. The table uses the Analytics plan with 30 days of retention.

        Five of the apps process payments. You need to recommend a design that meets the following requirements:

        - The HTTP logs of the payment apps must remain available for one year to interactive KQL queries and to log search alert rules.
        - Under the privacy policy, the HTTP logs of the other apps must be deleted after 30 days.
        - The number of workspaces and the administrative effort must be minimized.

        What should you recommend? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un seul locataire Microsoft Entra et exploite 60 applications App Service dans la région Europe Ouest. Des paramètres de diagnostic envoient les journaux HTTP de toutes les applications à la table **AppServiceHTTPLogs** d'un espace de travail Log Analytics nommé **WS1**. La table utilise le plan Analytics avec 30 jours de rétention.

        Cinq des applications traitent des paiements. Vous devez recommander une conception qui répond aux exigences suivantes :

        - Les journaux HTTP des applications de paiement doivent rester disponibles pendant un an pour les requêtes KQL interactives et pour les règles d'alerte de recherche dans les journaux.
        - Selon la politique de confidentialité, les journaux HTTP des autres applications doivent être supprimés au bout de 30 jours.
        - Le nombre d'espaces de travail et l'effort administratif doivent être réduits au minimum.

        Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Workspace design: [[ws]]

          Retention of the HTTP log table that receives the logs of the payment apps: [[ret]]
        fr: |
          Conception des espaces de travail : [[ws]]

          Rétention de la table des journaux HTTP qui reçoit les journaux des applications de paiement : [[ret]]
      slots:
        - id: ws
          options:
            - { id: one, text: { en: "Keep WS1 as the only workspace for all the apps", fr: "Conserver WS1 comme seul espace de travail pour toutes les applications" } }
            - { id: two, text: { en: "Add a workspace for the five payment apps, and keep WS1 for the others", fr: "Ajouter un espace de travail pour les cinq applications de paiement et conserver WS1 pour les autres" } }
            - { id: perapp, text: { en: "Add a workspace for each payment app, and keep WS1 for the others", fr: "Ajouter un espace de travail par application de paiement et conserver WS1 pour les autres" } }
        - id: ret
          options:
            - { id: ana1y, text: { en: "Analytics retention of one year", fr: "Rétention Analytics d'un an" } }
            - { id: lt1y, text: { en: "Analytics retention of 30 days and total retention of one year", fr: "Rétention Analytics de 30 jours et rétention totale d'un an" } }
            - { id: aux1y, text: { en: "Auxiliary plan with a total retention of one year", fr: "Plan Auxiliary avec une rétention totale d'un an" } }
            - { id: basic1y, text: { en: "Basic plan with a total retention of one year", fr: "Plan Basic avec une rétention totale d'un an" } }
    answer:
      values: { ws: two, ret: ana1y }
    explanation:
      correct:
        en: |
          Retention is set per table, and all the apps write to the same table: when different resources need different retention for the same table, they must send to separate workspaces. One additional workspace for the five payment apps is enough, while WS1 keeps its 30-day retention for the others. In the new workspace, the table keeps the Analytics plan with one year of analytics retention (up to two years is possible), because only Analytics retention keeps data available to interactive queries and to every type of log search alert.
        fr: |
          La rétention se règle par table, et toutes les applications écrivent dans la même table : quand des ressources différentes ont besoin d'une rétention différente pour la même table, elles doivent envoyer leurs données à des espaces de travail séparés. Un seul espace de travail supplémentaire pour les cinq applications de paiement suffit, et WS1 conserve sa rétention de 30 jours pour les autres. Dans le nouvel espace de travail, la table garde le plan Analytics avec un an de rétention Analytics (jusqu'à deux ans possibles), car seule la rétention Analytics garde les données disponibles pour les requêtes interactives et pour tous les types d'alertes de recherche dans les journaux.
      options:
        one: { en: "A single workspace applies one retention to the whole table: either the payment logs disappear after 30 days, or the other apps' logs are kept for a year in breach of the policy.", fr: "Un seul espace de travail applique une seule rétention à toute la table : soit les journaux de paiement disparaissent au bout de 30 jours, soit ceux des autres applications sont conservés un an en violation de la politique." }
        perapp: { en: "The five payment apps share the same requirement, so one workspace per app adds workspaces without need.", fr: "Les cinq applications de paiement ont la même exigence ; un espace de travail par application ajoute des espaces de travail sans nécessité." }
        lt1y: { en: "After the 30 days of analytics retention, the data is in long-term retention and is reached only through search jobs, not interactive queries or alerts.", fr: "Après les 30 jours de rétention Analytics, les données passent en rétention à long terme et ne sont accessibles que par des travaux de recherche, ni par des requêtes interactives ni par des alertes." }
        aux1y: { en: "Auxiliary tables support no alerts, and their queries are slower.", fr: "Les tables Auxiliary ne prennent en charge aucune alerte, et leurs requêtes sont plus lentes." }
        basic1y: { en: "Basic tables can be queried for a fixed 30 days and support only simple log search alerts.", fr: "Les tables Basic ne s'interrogent que pendant une période fixe de 30 jours et ne prennent en charge que les alertes de recherche dans les journaux simples." }
    references:
      - title: Design a Log Analytics workspace architecture - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/workspace-design
      - title: Manage data retention in a Log Analytics workspace - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/data-retention-configure

  # ------------------------------------------------------------------ 7
  - id: az305-qz-11-07
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank has a hub virtual network peered with eight spoke virtual networks. All the virtual networks use the DNS servers of the hub, which host the private DNS zones of the company.

        The virtual machines of the spokes send logs to two Log Analytics workspaces through the Azure Monitor Agent and data collection endpoints, and the applications send telemetry to Application Insights. You are designing Azure Monitor Private Link so that this traffic doesn't use public endpoints.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un réseau virtuel hub connecté par peering à huit réseaux virtuels spoke. Tous les réseaux virtuels utilisent les serveurs DNS du hub, qui hébergent les zones DNS privées de l'entreprise.

        Les machines virtuelles des spokes envoient des journaux à deux espaces de travail Log Analytics par l'agent Azure Monitor et des points de terminaison de collecte de données, et les applications envoient leur télémétrie à Application Insights. Vous concevez la liaison privée Azure Monitor afin que ce trafic n'utilise pas de points de terminaison publics.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The design should connect one Azure Monitor Private Link Scope (AMPLS) through a private endpoint in the hub virtual network.", fr: "La conception doit connecter une seule étendue de liaison privée Azure Monitor (AMPLS) par un point de terminaison privé dans le réseau virtuel hub." }
        - id: s2
          text: { en: "To isolate the development spoke, the design can add a second AMPLS with its own private endpoint in that spoke, while the spoke keeps using the DNS servers of the hub.", fr: "Pour isoler le spoke de développement, la conception peut ajouter une seconde AMPLS avec son propre point de terminaison privé dans ce spoke, tandis que le spoke continue d'utiliser les serveurs DNS du hub." }
        - id: s3
          text: { en: "Each of the two workspaces needs its own AMPLS and its own private endpoint.", fr: "Chacun des deux espaces de travail a besoin de sa propre AMPLS et de son propre point de terminaison privé." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          A private link changes the DNS records of the Azure Monitor endpoints, so every network that shares the same DNS is affected by it. A hub and spoke topology should therefore use a single AMPLS connected by one private endpoint in the hub, and the spokes reach it through peering. One AMPLS groups several workspaces, the Application Insights resources and the data collection endpoints behind that private endpoint.
        fr: |
          Une liaison privée modifie les enregistrements DNS des points de terminaison Azure Monitor ; tous les réseaux qui partagent le même DNS en sont donc affectés. Une topologie hub and spoke doit ainsi utiliser une seule AMPLS connectée par un point de terminaison privé dans le hub, que les spokes atteignent par le peering. Une seule AMPLS regroupe plusieurs espaces de travail, les ressources Application Insights et les points de terminaison de collecte de données derrière ce point de terminaison privé.
      options:
        s2: { en: "With a shared DNS, the second private link overwrites the DNS records of the first one, and the other networks lose access; a separate AMPLS needs a spoke that doesn't share the DNS zones.", fr: "Avec un DNS partagé, la seconde liaison privée écrase les enregistrements DNS de la première, et les autres réseaux perdent l'accès ; une AMPLS distincte exige un spoke qui ne partage pas les zones DNS." }
        s3: { en: "An AMPLS can contain many workspaces; creating one per workspace on the same DNS would cause the same DNS conflict.", fr: "Une AMPLS peut contenir de nombreux espaces de travail ; en créer une par espace de travail sur le même DNS provoquerait le même conflit DNS." }
    references:
      - title: Design Azure Monitor Private Link configuration - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/private-link-design

  # ------------------------------------------------------------------ 8
  - id: az305-qz-11-08
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has an Azure subscription named **Sub-Prod**. The application teams have created 140 metric, log search and activity log alert rules in Sub-Prod, and each rule notifies the action groups of its team.

        Contoso adopts an incident management platform that receives alerts through a webhook. You need to recommend a solution that meets the following requirements:

        - Every alert of severity Sev0 or Sev1 that fires in Sub-Prod must also call the webhook.
        - The alert rules and the action groups of the teams must not be modified.
        - Alert rules that the teams create later in Sub-Prod must be covered automatically.
        - Administrative effort must be minimized.

        What should you recommend?
      fr: |
        Contoso dispose d'un abonnement Azure nommé **Sub-Prod**. Les équipes applicatives ont créé dans Sub-Prod 140 règles d'alerte de métrique, de recherche dans les journaux et de journal d'activité, et chaque règle notifie les groupes d'actions de son équipe.

        Contoso adopte une plateforme de gestion des incidents qui reçoit les alertes par un webhook. Vous devez recommander une solution qui répond aux exigences suivantes :

        - Chaque alerte de gravité Sev0 ou Sev1 déclenchée dans Sub-Prod doit aussi appeler le webhook.
        - Les règles d'alerte et les groupes d'actions des équipes ne doivent pas être modifiés.
        - Les règles d'alerte que les équipes créeront plus tard dans Sub-Prod doivent être couvertes automatiquement.
        - L'effort administratif doit être réduit au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Add a webhook action to each team action group that a Sev0 or Sev1 alert rule of Sub-Prod uses.", fr: "Ajouter une action webhook à chaque groupe d'actions d'équipe utilisé par une règle d'alerte Sev0 ou Sev1 de Sub-Prod." } }
        - { id: b, text: { en: "Create a webhook action group, and an alert processing rule on Sub-Prod that applies it to Sev0 and Sev1 alerts.", fr: "Créer un groupe d'actions webhook, et une règle de traitement des alertes sur Sub-Prod qui l'applique aux alertes Sev0 et Sev1." } }
        - { id: c, text: { en: "Create a webhook action group, and an Azure Policy assignment that adds it to the Sev0 and Sev1 rules of Sub-Prod.", fr: "Créer un groupe d'actions webhook, et une attribution Azure Policy qui l'ajoute aux règles Sev0 et Sev1 de Sub-Prod." } }
        - { id: d, text: { en: "Create an Automation runbook that lists the fired Sev0 and Sev1 alerts of Sub-Prod every five minutes and calls the webhook.", fr: "Créer un runbook Automation qui liste toutes les cinq minutes les alertes Sev0 et Sev1 déclenchées dans Sub-Prod et appelle le webhook." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          An alert processing rule acts on alerts as they fire, without any change to the alert rules. Its Apply action groups action adds one or more action groups to the affected alerts, and its filters (here the severity) and scope (here the whole subscription) also cover the rules created later. One rule therefore replaces 140 edits.
        fr: |
          Une règle de traitement des alertes agit sur les alertes au moment où elles se déclenchent, sans aucune modification des règles d'alerte. Son action d'application de groupes d'actions ajoute un ou plusieurs groupes d'actions aux alertes concernées, et ses filtres (ici la gravité) et son étendue (ici l'abonnement entier) couvrent aussi les règles créées plus tard. Une seule règle remplace donc 140 modifications.
      options:
        a: { en: "This modifies the action groups of the teams, which is forbidden, and a new action group created later wouldn't call the webhook.", fr: "Cela modifie les groupes d'actions des équipes, ce qui est interdit, et un nouveau groupe d'actions créé plus tard n'appellerait pas le webhook." }
        c: { en: "Adding an action group to the rules modifies the alert rules, which the requirements forbid.", fr: "Ajouter un groupe d'actions aux règles modifie les règles d'alerte, ce que les exigences interdisent." }
        d: { en: "A polling runbook is custom code to write and maintain, and it delays the notification by up to five minutes.", fr: "Un runbook d'interrogation est du code personnalisé à écrire et à maintenir, et il retarde la notification de cinq minutes au plus." }
    references:
      - title: Alert processing rules for Azure Monitor alerts - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-processing-rules

  # ------------------------------------------------------------------ 9
  - id: az305-qz-11-09
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware has a single Microsoft Entra tenant and all its resources in the West Europe region. A Log Analytics workspace named **WS-Ops** ingests 140 GB per day of operational data and uses the 100 GB per day commitment tier. The operations team relies on alert rules, VM insights and workbooks that read this data.

        The security team plans to deploy Microsoft Sentinel to analyze about 25 GB per day of Windows security events and Microsoft Entra sign-in logs. You need to recommend a workspace design that meets the following requirements:

        - The operational data must not be billed at Microsoft Sentinel prices.
        - The alert rules, insights and workbooks of the operations team must keep working on the operational data.
        - During an investigation, the security analysts must be able to query the operational data.
        - The number of workspaces must be minimized.

        What should you recommend?
      fr: |
        Litware dispose d'un seul locataire Microsoft Entra et de toutes ses ressources dans la région Europe Ouest. Un espace de travail Log Analytics nommé **WS-Ops** ingère 140 Go par jour de données opérationnelles et utilise le niveau d'engagement de 100 Go par jour. L'équipe d'exploitation s'appuie sur des règles d'alerte, VM Insights et des classeurs qui lisent ces données.

        L'équipe de sécurité prévoit de déployer Microsoft Sentinel pour analyser environ 25 Go par jour d'événements de sécurité Windows et de journaux de connexion Microsoft Entra. Vous devez recommander une conception des espaces de travail qui répond aux exigences suivantes :

        - Les données opérationnelles ne doivent pas être facturées aux tarifs de Microsoft Sentinel.
        - Les règles d'alerte, les insights et les classeurs de l'équipe d'exploitation doivent continuer de fonctionner sur les données opérationnelles.
        - Pendant une investigation, les analystes de sécurité doivent pouvoir interroger les données opérationnelles.
        - Le nombre d'espaces de travail doit être réduit au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Send the security data to WS-Ops, and enable Microsoft Sentinel on WS-Ops with table-level access for the analysts.", fr: "Envoyer les données de sécurité à WS-Ops, et activer Microsoft Sentinel sur WS-Ops avec un accès au niveau des tables pour les analystes." } }
        - { id: b, text: { en: "Send the security data to WS-Ops, enable Microsoft Sentinel on WS-Ops, and switch the operational tables to the Basic plan.", fr: "Envoyer les données de sécurité à WS-Ops, activer Microsoft Sentinel sur WS-Ops, et passer les tables opérationnelles au plan Basic." } }
        - { id: c, text: { en: "Send the security data to a new workspace with Microsoft Sentinel, and let the analysts read WS-Ops in their queries.", fr: "Envoyer les données de sécurité à un nouvel espace de travail avec Microsoft Sentinel, et laisser les analystes lire WS-Ops dans leurs requêtes." } }
        - { id: d, text: { en: "Send the security data to a new workspace, and enable Microsoft Sentinel on both workspaces to correlate their data.", fr: "Envoyer les données de sécurité à un nouvel espace de travail, et activer Microsoft Sentinel sur les deux espaces de travail pour corréler leurs données." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          When Microsoft Sentinel is enabled on a workspace, all the data of that workspace is subject to Microsoft Sentinel pricing, operational data included. A dedicated security workspace keeps the 140 GB of operational data at Azure Monitor prices; WS-Ops already reaches a commitment tier on its own, so combining the data would bring no tier advantage. The analysts query the operational data across workspaces with read access to WS-Ops, and two workspaces is the minimum that meets the pricing requirement.
        fr: |
          Quand Microsoft Sentinel est activé sur un espace de travail, toutes les données de cet espace de travail relèvent de la tarification Microsoft Sentinel, y compris les données opérationnelles. Un espace de travail de sécurité dédié garde les 140 Go de données opérationnelles aux tarifs d'Azure Monitor ; WS-Ops atteint déjà seul un niveau d'engagement, et réunir les données n'apporterait donc aucun avantage de niveau. Les analystes interrogent les données opérationnelles entre espaces de travail grâce à un accès en lecture à WS-Ops, et deux espaces de travail sont le minimum qui respecte l'exigence de tarification.
      options:
        a: { en: "Table-level access controls who reads the tables, but the operational data of a Sentinel-enabled workspace is still billed at Sentinel prices.", fr: "L'accès au niveau des tables contrôle qui lit les tables, mais les données opérationnelles d'un espace de travail où Sentinel est activé restent facturées aux tarifs de Sentinel." }
        b: { en: "Basic tables support only simple log search alerts and no insights, so the operations team would lose its alert rules and VM insights.", fr: "Les tables Basic ne prennent en charge que les alertes de recherche dans les journaux simples et aucun insight ; l'équipe d'exploitation perdrait ses règles d'alerte et VM Insights." }
        d: { en: "Enabling Microsoft Sentinel on WS-Ops puts the operational data under Sentinel pricing again; cross-workspace queries don't need Sentinel on both workspaces.", fr: "Activer Microsoft Sentinel sur WS-Ops replace les données opérationnelles sous la tarification Sentinel ; les requêtes entre espaces de travail n'exigent pas Sentinel sur les deux espaces de travail." }
    references:
      - title: Design a Log Analytics workspace architecture - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/workspace-design

  # ------------------------------------------------------------------ 10
  - id: az305-qz-11-10
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has three Log Analytics workspaces in the West Europe region:

        | Workspace | Daily ingestion | Pricing |
        | --- | --- | --- |
        | WS-App | 70 GB | Pay-as-you-go |
        | WS-Net | 50 GB | Pay-as-you-go |
        | WS-Data | 40 GB | Pay-as-you-go |

        All the tables use the Analytics plan. The workspaces must stay separate, because the same tables need different retention settings in each of them. You need to recommend a solution that meets the following requirements:

        - The ingestion cost of the three workspaces must be reduced.
        - Alert rules, insights and interactive queries must keep working on all the tables.
        - Administrative effort must be minimized.

        What should you recommend?
      fr: |
        Tailspin Toys dispose de trois espaces de travail Log Analytics dans la région Europe Ouest :

        | Espace de travail | Ingestion quotidienne | Tarification |
        | --- | --- | --- |
        | WS-App | 70 Go | Paiement à l'utilisation |
        | WS-Net | 50 Go | Paiement à l'utilisation |
        | WS-Data | 40 Go | Paiement à l'utilisation |

        Toutes les tables utilisent le plan Analytics. Les espaces de travail doivent rester séparés, car les mêmes tables ont besoin de paramètres de rétention différents dans chacun d'eux. Vous devez recommander une solution qui répond aux exigences suivantes :

        - Le coût d'ingestion des trois espaces de travail doit être réduit.
        - Les règles d'alerte, les insights et les requêtes interactives doivent continuer de fonctionner sur toutes les tables.
        - L'effort administratif doit être réduit au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Set the 100 GB per day commitment tier on each of the three workspaces.", fr: "Définir le niveau d'engagement de 100 Go par jour sur chacun des trois espaces de travail." } }
        - { id: b, text: { en: "Set the 100 GB per day commitment tier on WS-App only, the largest workspace.", fr: "Définir le niveau d'engagement de 100 Go par jour sur WS-App seulement, le plus gros espace de travail." } }
        - { id: c, text: { en: "Switch the tables of the three workspaces to the Basic plan to reduce the ingestion price.", fr: "Passer les tables des trois espaces de travail au plan Basic pour réduire le prix d'ingestion." } }
        - { id: d, text: { en: "Link the three workspaces to a dedicated cluster that uses the 100 GB per day commitment tier.", fr: "Lier les trois espaces de travail à un cluster dédié qui utilise le niveau d'engagement de 100 Go par jour." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Commitment tiers start at 100 GB per day, and none of the workspaces reaches that volume alone. A dedicated cluster, which requires a commitment of at least 100 GB per day, aggregates the ingestion of the workspaces of the same region that are linked to it: the 160 GB per day are billed at the commitment tier price, the volume above 100 GB included. The workspaces stay separate with their own retention settings, and all the features of the Analytics plan remain.
        fr: |
          Les niveaux d'engagement commencent à 100 Go par jour, et aucun des espaces de travail n'atteint seul ce volume. Un cluster dédié, qui exige un engagement d'au moins 100 Go par jour, agrège l'ingestion des espaces de travail de la même région qui lui sont liés : les 160 Go par jour sont facturés au prix du niveau d'engagement, y compris le volume au-delà de 100 Go. Les espaces de travail restent séparés avec leurs propres paramètres de rétention, et toutes les fonctionnalités du plan Analytics sont conservées.
      options:
        a: { en: "Each workspace would pay for 100 GB per day while it ingests 40 to 70 GB: 300 GB committed for 160 GB used costs more than pay-as-you-go.", fr: "Chaque espace de travail paierait 100 Go par jour alors qu'il en ingère de 40 à 70 : 300 Go engagés pour 160 Go utilisés coûtent plus cher que le paiement à l'utilisation." }
        b: { en: "WS-App would pay for 100 GB per day while it ingests 70 GB, which costs more than its pay-as-you-go price, and the other workspaces get no discount.", fr: "WS-App paierait 100 Go par jour alors qu'il en ingère 70, ce qui coûte plus que son prix en paiement à l'utilisation, et les autres espaces de travail n'obtiennent aucune remise." }
        c: { en: "Basic tables support only simple log search alerts and no insights, and they can be queried for a fixed 30 days only.", fr: "Les tables Basic ne prennent en charge que les alertes de recherche dans les journaux simples et aucun insight, et elles ne s'interrogent que pendant une période fixe de 30 jours." }
    references:
      - title: Azure Monitor Logs cost calculations and options - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/cost-logs
      - title: Design a Log Analytics workspace architecture - Azure Monitor
        url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/workspace-design
