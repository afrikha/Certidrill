chapter: 13-governance
questions:
  # ------------------------------------------------------------------ 1
  - id: az305-qz-13-01
    objective: "1.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has a resource group named **RG-Sales** that carries the tag `costcenter: CC-410`. The subscription that contains RG-Sales also carries tags. No Azure Policy assignment applies to the subscription.

        A developer deploys a storage account to RG-Sales and specifies no tag in the deployment.

        Which tags does the storage account have after the deployment?
      fr: |
        Contoso dispose d'un groupe de ressources nommé **RG-Sales** qui porte l'étiquette `costcenter: CC-410`. L'abonnement qui contient RG-Sales porte lui aussi des étiquettes. Aucune attribution Azure Policy ne s'applique à l'abonnement.

        Un développeur déploie un compte de stockage dans RG-Sales et ne spécifie aucune étiquette dans le déploiement.

        Quelles étiquettes le compte de stockage porte-t-il après le déploiement ?
    body:
      options:
        - { id: a, text: { en: "Only the `costcenter: CC-410` tag of RG-Sales", fr: "Uniquement l'étiquette `costcenter: CC-410` de RG-Sales" } }
        - { id: b, text: { en: "The tags of RG-Sales and those of the subscription", fr: "Les étiquettes de RG-Sales et celles de l'abonnement" } }
        - { id: c, text: { en: "Only the tags of the subscription that contains RG-Sales", fr: "Uniquement les étiquettes de l'abonnement qui contient RG-Sales" } }
        - { id: d, text: { en: "None of the tags of RG-Sales or of the subscription", fr: "Aucune des étiquettes de RG-Sales ni de l'abonnement" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Resources don't inherit the tags of their resource group or of their subscription. Without a tag in the deployment and without a policy that adds or copies tags, the storage account has no tag. To propagate `costcenter`, assign a policy such as Inherit a tag from the resource group, which uses the `modify` effect.
        fr: |
          Les ressources n'héritent pas des étiquettes de leur groupe de ressources ni de leur abonnement. Sans étiquette dans le déploiement et sans stratégie qui ajoute ou copie des étiquettes, le compte de stockage n'a aucune étiquette. Pour propager `costcenter`, attribuez une stratégie comme Inherit a tag from the resource group, qui utilise l'effet `modify`.
      options:
        a: { en: "A resource group tag isn't copied to the resources it contains; only a `modify` policy would copy it.", fr: "Une étiquette de groupe de ressources n'est pas copiée sur les ressources qu'il contient ; seule une stratégie `modify` la copierait." }
        b: { en: "Neither the resource group tags nor the subscription tags are inherited by resources.", fr: "Ni les étiquettes du groupe de ressources ni celles de l'abonnement ne sont héritées par les ressources." }
        c: { en: "Subscription tags aren't inherited either: tags apply only to the object that carries them.", fr: "Les étiquettes d'abonnement ne sont pas héritées non plus : une étiquette ne s'applique qu'à l'objet qui la porte." }
    references:
      - title: Use tags to organize your Azure resources and management hierarchy - Azure Resource Manager
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources

  # ------------------------------------------------------------------ 2
  - id: az305-qz-13-02
    objective: "1.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam uses entitlement management in Microsoft Entra ID Governance. The marketing manager owns the Microsoft Entra groups and the SharePoint Online sites of the marketing department.

        The marketing manager must be able to create and manage the access packages that grant these resources, without receiving a Microsoft Entra administrator role.

        What should you recommend?
      fr: |
        Fabrikam utilise la gestion des droits d'utilisation de Microsoft Entra ID Governance. Le responsable marketing est propriétaire des groupes Microsoft Entra et des sites SharePoint Online du service marketing.

        Le responsable marketing doit pouvoir créer et gérer les packages d'accès qui accordent ces ressources, sans recevoir de rôle d'administrateur Microsoft Entra.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "A connected organization managed by the marketing manager", fr: "Une organisation connectée gérée par le responsable marketing" } }
        - { id: b, text: { en: "A catalog of which the marketing manager is the owner", fr: "Un catalogue dont le responsable marketing est propriétaire" } }
        - { id: c, text: { en: "An administrative unit managed by the marketing manager", fr: "Une unité administrative gérée par le responsable marketing" } }
        - { id: d, text: { en: "An access review of which the marketing manager is the reviewer", fr: "Une révision d'accès dont le responsable marketing est le réviseur" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A catalog is the container of resources and access packages in entitlement management, and its management can be delegated. A catalog owner is an entitlement management role, not a directory role: the marketing manager can add the groups and sites that the manager owns to the catalog and create access packages from them.
        fr: |
          Un catalogue est le conteneur des ressources et des packages d'accès dans la gestion des droits d'utilisation, et sa gestion peut être déléguée. Le propriétaire de catalogue est un rôle de la gestion des droits d'utilisation, pas un rôle d'annuaire : le responsable marketing peut ajouter au catalogue les groupes et les sites dont il est propriétaire, puis créer des packages d'accès à partir d'eux.
      options:
        a: { en: "A connected organization represents a partner's directory or domain whose users can request access; it doesn't hold resources.", fr: "Une organisation connectée représente l'annuaire ou le domaine d'un partenaire dont les utilisateurs peuvent demander un accès ; elle ne contient pas de ressources." }
        c: { en: "Managing an administrative unit means holding a Microsoft Entra administrator role scoped to it, which the requirement excludes.", fr: "Gérer une unité administrative suppose de détenir un rôle d'administrateur Microsoft Entra limité à cette unité, ce que l'exigence exclut." }
        d: { en: "A reviewer confirms or removes existing access; an access review doesn't create access packages.", fr: "Un réviseur confirme ou retire des accès existants ; une révision d'accès ne crée pas de packages d'accès." }
    references:
      - title: Delegation and roles in entitlement management - Microsoft Entra ID Governance
        url: https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-delegate

  # ------------------------------------------------------------------ 3
  - id: az305-qz-13-03
    objective: "1.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum assigns the built-in policy **Inherit a tag from the resource group**, which uses the `modify` effect, at a management group named **MG-Corp**. About 1,500 existing resources under MG-Corp must receive the `costcenter` tag of their resource group without being redeployed.

        Adatum will start a remediation task after the first compliance evaluation.

        What must the policy assignment include so that the remediation task can update the existing resources?
      fr: |
        Adatum attribue la stratégie intégrée **Inherit a tag from the resource group**, qui utilise l'effet `modify`, sur un groupe d'administration nommé **MG-Corp**. Environ 1 500 ressources existantes sous MG-Corp doivent recevoir l'étiquette `costcenter` de leur groupe de ressources sans être redéployées.

        Adatum lancera une tâche de correction après la première évaluation de conformité.

        Que doit inclure l'attribution de stratégie pour que la tâche de correction puisse mettre à jour les ressources existantes ?
    body:
      options:
        - { id: a, text: { en: "The enforcement mode set to Disabled while the remediation task runs", fr: "Le mode d'application défini sur Disabled pendant l'exécution de la tâche de correction" } }
        - { id: b, text: { en: "A Mitigated exemption for each resource that lacks the `costcenter` tag", fr: "Une exemption Mitigated pour chaque ressource à laquelle manque l'étiquette `costcenter`" } }
        - { id: c, text: { en: "A managed identity that holds the roles of the definition at MG-Corp", fr: "Une identité managée qui détient les rôles de la définition sur MG-Corp" } }
        - { id: d, text: { en: "A non-compliance message that asks the resource owners to add the tag", fr: "Un message de non-conformité qui demande aux propriétaires d'ajouter l'étiquette" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A remediation task applies the `modify` operations with the managed identity of the policy assignment, not with the identity of the person who starts it. That identity needs the roles listed in the policy definition at the scope it must change; the portal grants them when the assignment is created. Without it, the existing resources stay non-compliant.
        fr: |
          Une tâche de correction applique les opérations `modify` avec l'identité managée de l'attribution de stratégie, pas avec l'identité de la personne qui la lance. Cette identité a besoin des rôles listés dans la définition de stratégie sur l'étendue qu'elle doit modifier ; le portail les accorde à la création de l'attribution. Sans elle, les ressources existantes restent non conformes.
      options:
        a: { en: "With enforcement disabled, the effect isn't applied: nothing would be changed, by requests or by remediation.", fr: "Avec l'application désactivée, l'effet n'est pas appliqué : rien ne serait modifié, ni par les requêtes ni par la correction." }
        b: { en: "An exemption stops the evaluation of the resources; they would never receive the tag.", fr: "Une exemption arrête l'évaluation des ressources ; elles ne recevraient jamais l'étiquette." }
        d: { en: "A non-compliance message only explains a denial or a non-compliance; it changes no resource and relies on people.", fr: "Un message de non-conformité ne fait qu'expliquer un refus ou une non-conformité ; il ne modifie aucune ressource et repose sur les personnes." }
    references:
      - title: Remediate non-compliant resources - Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources

  # ------------------------------------------------------------------ 4
  - id: az305-qz-13-04
    objective: "1.3.1"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Northwind Traders hosts all its workloads in one Azure subscription and receives one invoice. The architects review five situations before they design the subscriptions of the company.

        Which two situations justify the creation of a separate subscription?

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders héberge toutes ses charges de travail dans un seul abonnement Azure et reçoit une seule facture. Les architectes examinent cinq situations avant de concevoir les abonnements de l'entreprise.

        Quelles sont les deux situations qui justifient la création d'un abonnement distinct ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "A new payment workload is subject to PCI DSS and needs stricter policies than the other workloads.", fr: "Une nouvelle charge de travail de paiement est soumise à PCI DSS et exige des stratégies plus strictes que les autres." } }
        - { id: b, text: { en: "The workloads run in three regions, and no regulation requires the data of a region to stay apart.", fr: "Les charges de travail s'exécutent dans trois régions, et aucune réglementation n'impose de séparer les données d'une région." } }
        - { id: c, text: { en: "The finance team wants a monthly report of the costs of each department, still on a single invoice.", fr: "L'équipe financière veut un rapport mensuel des coûts de chaque service, toujours sur une seule facture." } }
        - { id: d, text: { en: "A simulation workload needs thousands of cores and would exhaust the quotas shared with the other workloads.", fr: "Une charge de travail de simulation a besoin de milliers de cœurs et épuiserait les quotas partagés avec les autres." } }
        - { id: e, text: { en: "The web tier and the database of an application are deployed and deleted at different times.", fr: "Le niveau web et la base de données d'une application sont déployés et supprimés à des moments différents." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          A subscription is a boundary for policy assignments and for quotas. A workload subject to PCI DSS gets its own subscription so that its stricter policies apply to it alone, and a large workload that would exhaust the shared limits gets its own subscription as a scale unit.
        fr: |
          Un abonnement est une limite pour les attributions de stratégies et pour les quotas. Une charge de travail soumise à PCI DSS reçoit son propre abonnement pour que ses stratégies plus strictes ne s'appliquent qu'à elle, et une grosse charge de travail qui épuiserait les limites partagées reçoit son propre abonnement comme unité de mise à l'échelle.
      options:
        b: { en: "Subscriptions aren't tied to a region; one subscription per region is justified only by data sovereignty or scale.", fr: "Les abonnements ne sont pas liés à une région ; un abonnement par région ne se justifie que par la souveraineté des données ou la mise à l'échelle." }
        c: { en: "Costs per department inside one subscription are reported with tags, such as a `department` tag used in cost analysis.", fr: "Les coûts par service dans un même abonnement se présentent avec des étiquettes, comme une étiquette `department` utilisée dans l'analyse des coûts." }
        e: { en: "Different life cycles call for separate resource groups, not separate subscriptions.", fr: "Des cycles de vie différents appellent des groupes de ressources distincts, pas des abonnements distincts." }
    references:
      - title: Subscription considerations and recommendations - Cloud Adoption Framework
        url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-subscriptions

  # ------------------------------------------------------------------ 5
  - id: az305-qz-13-05
    objective: "1.3.2"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Litware assigns an Azure Policy initiative at a management group to measure its compliance with an internal standard. The compliance team reviews three situations.

        You need to recommend what to use in each situation.

        What should you recommend? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware attribue une initiative Azure Policy sur un groupe d'administration pour mesurer sa conformité à une norme interne. L'équipe de conformité examine trois situations.

        Vous devez recommander ce qu'il faut utiliser dans chaque situation.

        Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          A storage account is reported as non-compliant by the definition that requires private endpoints. The security team approved its firewall rules as an equivalent control. Only this definition must stop evaluating the account, and the reason must be recorded accurately: [[s1]]

          The standard requires that administrators complete a yearly security training. The state of this control must appear in the compliance view, based on a statement of the compliance officer: [[s2]]

          Virtual machines that don't have the antimalware extension must be reported. Nothing must be installed or blocked: [[s3]]
        fr: |
          Un compte de stockage est signalé non conforme par la définition qui exige des points de terminaison privés. L'équipe de sécurité a approuvé ses règles de pare-feu comme un contrôle équivalent. Seule cette définition doit cesser d'évaluer le compte, et le motif doit être consigné avec exactitude : [[s1]]

          La norme exige que les administrateurs suivent une formation annuelle à la sécurité. L'état de ce contrôle doit apparaître dans la vue de conformité, sur la base d'une déclaration du responsable de la conformité : [[s2]]

          Les machines virtuelles qui n'ont pas l'extension anti-programme malveillant doivent être signalées. Rien ne doit être installé ni bloqué : [[s3]]
      slots:
        - id: s1
          options:
            - { id: waiver, text: { en: "An exemption of the Waiver category", fr: "Une exemption de la catégorie Waiver" } }
            - { id: mitigated, text: { en: "An exemption of the Mitigated category", fr: "Une exemption de la catégorie Mitigated" } }
            - { id: exclusion, text: { en: "An exclusion on the initiative assignment", fr: "Une exclusion sur l'attribution de l'initiative" } }
            - { id: disabled, text: { en: "The enforcement mode set to Disabled", fr: "Le mode d'application défini sur Disabled" } }
        - id: s2
          options:
            - { id: audit2, text: "audit" }
            - { id: aine2, text: "auditIfNotExists" }
            - { id: manual2, text: "manual" }
            - { id: dine2, text: "deployIfNotExists" }
        - id: s3
          options:
            - { id: audit3, text: "audit" }
            - { id: aine3, text: "auditIfNotExists" }
            - { id: dine3, text: "deployIfNotExists" }
            - { id: deny3, text: "deny" }
    answer:
      values: { s1: mitigated, s2: manual2, s3: aine3 }
    explanation:
      correct:
        en: |
          An exemption limited to one definition of the initiative stops its evaluation of the account, and the Mitigated category records that the intent of the policy is met by another method. The `manual` effect lets a person attest the compliance state of a control that can't be evaluated automatically. `auditIfNotExists` reports a resource when a related resource, here the extension of the virtual machine, is missing, without deploying or blocking anything.
        fr: |
          Une exemption limitée à une définition de l'initiative arrête son évaluation du compte, et la catégorie Mitigated consigne que l'intention de la stratégie est respectée par une autre méthode. L'effet `manual` permet à une personne d'attester l'état de conformité d'un contrôle qui ne peut pas être évalué automatiquement. `auditIfNotExists` signale une ressource quand une ressource associée, ici l'extension de la machine virtuelle, est absente, sans rien déployer ni bloquer.
      options:
        waiver: { en: "Waiver means that the non-compliance is temporarily accepted, which isn't the reason here: the intent is met.", fr: "Waiver signifie que la non-conformité est acceptée temporairement, ce qui n'est pas le motif ici : l'intention est respectée." }
        exclusion: { en: "An exclusion removes the account from all the definitions of the initiative, not only from this one.", fr: "Une exclusion retire le compte de toutes les définitions de l'initiative, pas seulement de celle-ci." }
        disabled: { en: "Disabling enforcement affects the whole assignment and doesn't stop the evaluation of the account.", fr: "Désactiver l'application concerne toute l'attribution et n'arrête pas l'évaluation du compte." }
        audit3: { en: "`audit` evaluates the properties of the virtual machine itself; the extension is a related resource, which requires `auditIfNotExists`.", fr: "`audit` évalue les propriétés de la machine virtuelle elle-même ; l'extension est une ressource associée, ce qui exige `auditIfNotExists`." }
        dine3: { en: "`deployIfNotExists` would install the missing extension through remediation, which the requirement forbids.", fr: "`deployIfNotExists` installerait l'extension manquante par une correction, ce que l'exigence interdit." }
    references:
      - title: Details of the policy exemption structure - Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/exemption-structure
      - title: Azure Policy definitions manual effect - Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-manual

  # ------------------------------------------------------------------ 6
  - id: az305-qz-13-06
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank has 25 administrators who hold permanent assignments of the Exchange Administrator role in Microsoft Entra ID and of the Owner role on three production subscriptions. All the administrators have Microsoft Entra ID P2 licenses.

        You need to recommend a solution that meets the following requirements:

        - An administrator must hold each role only after a request that requires multifactor authentication, for at most four hours.
        - Every quarter, the manager of each administrator must confirm whether the administrator must still be able to request each role.
        - The ability to request a role must be removed when the manager doesn't confirm it, without any action from the identity team.

        Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank compte 25 administrateurs qui détiennent des attributions permanentes du rôle Exchange Administrator dans Microsoft Entra ID et du rôle Owner sur trois abonnements de production. Tous les administrateurs disposent de licences Microsoft Entra ID P2.

        Vous devez recommander une solution qui répond aux exigences suivantes :

        - Un administrateur ne doit détenir chaque rôle qu'après une demande qui exige l'authentification multifacteur, pendant quatre heures au plus.
        - Chaque trimestre, le responsable de chaque administrateur doit confirmer si l'administrateur doit toujours pouvoir demander chaque rôle.
        - La possibilité de demander un rôle doit être retirée quand le responsable ne la confirme pas, sans aucune action de l'équipe chargée des identités.

        Quelles sont les deux actions que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Replace the assignments with active PIM assignments that end after 90 days and are renewed each quarter.", fr: "Remplacer les attributions par des attributions PIM actives qui prennent fin après 90 jours et sont renouvelées chaque trimestre." } }
        - { id: b, text: { en: "Replace the assignments with eligible PIM assignments whose activation requires MFA and lasts four hours at most.", fr: "Remplacer les attributions par des attributions PIM éligibles dont l'activation exige la MFA et dure quatre heures au plus." } }
        - { id: c, text: { en: "Create a lifecycle workflow that removes the role assignments of an administrator who changes department.", fr: "Créer un workflow de cycle de vie qui retire les attributions de rôles d'un administrateur qui change de service." } }
        - { id: d, text: { en: "Create a Conditional Access policy that requires MFA for the administrators who sign in to the Azure portal.", fr: "Créer une stratégie d'accès conditionnel qui exige la MFA des administrateurs qui se connectent au portail Azure." } }
        - { id: e, text: { en: "Create quarterly access reviews of the roles in PIM, reviewed by the managers, with results applied automatically.", fr: "Créer dans PIM des révisions d'accès trimestrielles des rôles, menées par les responsables, avec application automatique des résultats." } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          Eligible assignments in Privileged Identity Management (PIM) give the role only after an activation, whose settings can require multifactor authentication and limit the duration to four hours; PIM covers both Microsoft Entra roles and Azure resource roles. Access reviews of these roles, created in PIM and scoped to the eligible assignments, can recur every quarter with the managers as reviewers. With the results applied automatically and access removed when reviewers don't respond, unconfirmed assignments disappear without the identity team.
        fr: |
          Les attributions éligibles de Privileged Identity Management (PIM) ne donnent le rôle qu'après une activation, dont les paramètres peuvent exiger l'authentification multifacteur et limiter la durée à quatre heures ; PIM couvre à la fois les rôles Microsoft Entra et les rôles de ressources Azure. Les révisions d'accès de ces rôles, créées dans PIM et limitées aux attributions éligibles, peuvent se répéter chaque trimestre avec les responsables comme réviseurs. Avec l'application automatique des résultats et le retrait de l'accès quand les réviseurs ne répondent pas, les attributions non confirmées disparaissent sans l'équipe chargée des identités.
      options:
        a: { en: "Active assignments give the role permanently during their validity, with no request, MFA or four-hour limit.", fr: "Les attributions actives donnent le rôle en permanence pendant leur validité, sans demande, sans MFA ni limite de quatre heures." }
        c: { en: "Lifecycle workflows react to joiner, mover and leaver events and require Microsoft Entra ID Governance; they don't run a quarterly confirmation by managers.", fr: "Les workflows de cycle de vie réagissent aux arrivées, changements de poste et départs et exigent Microsoft Entra ID Governance ; ils n'organisent pas de confirmation trimestrielle par les responsables." }
        d: { en: "Conditional Access adds MFA at sign-in, but the roles stay permanently assigned and nobody confirms them.", fr: "L'accès conditionnel ajoute la MFA à la connexion, mais les rôles restent attribués en permanence et personne ne les confirme." }
    references:
      - title: What is Privileged Identity Management? - Microsoft Entra ID Governance
        url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
      - title: Create an access review of Azure resource and Microsoft Entra roles in PIM - Microsoft Entra ID Governance
        url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-create-roles-and-resource-roles-review

  # ------------------------------------------------------------------ 7
  - id: az305-qz-13-07
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys has 60 subscriptions in a management group hierarchy that follows the Azure landing zone architecture. The platform team lists three requirements:

        - Workload teams request subscriptions through an IT service management form. Each approved request must produce, without manual steps, a subscription placed in the management group of its archetype, with a virtual network peered to the hub, a budget and the role assignments of the team.
        - Only the members of the mergers and acquisitions team must be able to move subscriptions into or out of the Microsoft Entra tenant.
        - The resources of an application will be moved from a resource group named **RG-App7** to a resource group named **RG-Shared** in the same subscription. Several users hold role assignments made directly on these resources, and they must keep their access.

        You need to recommend a solution for each requirement.

        What should you recommend? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys compte 60 abonnements dans une hiérarchie de groupes d'administration qui suit l'architecture des zones d'atterrissage Azure. L'équipe de plateforme liste trois exigences :

        - Les équipes de charges de travail demandent des abonnements par un formulaire de gestion des services informatiques. Chaque demande approuvée doit produire, sans étape manuelle, un abonnement placé dans le groupe d'administration de son archétype, avec un réseau virtuel connecté au hub par peering, un budget et les attributions de rôles de l'équipe.
        - Seuls les membres de l'équipe chargée des fusions et acquisitions doivent pouvoir faire entrer des abonnements dans le locataire Microsoft Entra ou les en faire sortir.
        - Les ressources d'une application seront déplacées d'un groupe de ressources nommé **RG-App7** vers un groupe de ressources nommé **RG-Shared** dans le même abonnement. Plusieurs utilisateurs détiennent des attributions de rôles faites directement sur ces ressources, et ils doivent conserver leur accès.

        Vous devez recommander une solution pour chaque exigence.

        Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          New subscriptions: [[vend]]

          Moves of subscriptions between tenants: [[transfer]]

          Move of the resources of RG-App7: [[move]]
        fr: |
          Nouveaux abonnements : [[vend]]

          Déplacements d'abonnements entre locataires : [[transfer]]

          Déplacement des ressources de RG-App7 : [[move]]
      slots:
        - id: vend
          options:
            - { id: defaultmg, text: { en: "A default management group in the hierarchy settings", fr: "Un groupe d'administration par défaut dans les paramètres de hiérarchie" } }
            - { id: blueprints, text: { en: "An Azure Blueprints assignment for each archetype", fr: "Une attribution Azure Blueprints pour chaque archétype" } }
            - { id: vending, text: { en: "Subscription vending", fr: "La distribution automatisée d'abonnements (subscription vending)" } }
            - { id: specs, text: { en: "Template specs shared with the workload teams", fr: "Des specs de modèle partagées avec les équipes de charges de travail" } }
        - id: transfer
          options:
            - { id: policydeny, text: { en: "An Azure Policy assignment with the deny effect at the tenant root group", fr: "Une attribution Azure Policy avec l'effet deny sur le groupe racine du locataire" } }
            - { id: lock, text: { en: "A `CanNotDelete` lock on each subscription", fr: "Un verrou `CanNotDelete` sur chaque abonnement" } }
            - { id: authz, text: { en: "Authorization required in the hierarchy settings", fr: "L'autorisation exigée dans les paramètres de hiérarchie" } }
            - { id: subpolicy, text: { en: "Subscription policies with a list of exempted users", fr: "Les stratégies d'abonnement avec une liste d'utilisateurs exemptés" } }
        - id: move
          options:
            - { id: recreate, text: { en: "Re-create the direct role assignments after the move", fr: "Recréer les attributions de rôles directes après le déplacement" } }
            - { id: nothing, text: { en: "Nothing: the direct role assignments move with the resources", fr: "Rien : les attributions de rôles directes suivent les ressources" } }
            - { id: mover, text: { en: "Move the role assignments with Azure Resource Mover", fr: "Déplacer les attributions de rôles avec Azure Resource Mover" } }
            - { id: inherited, text: { en: "Re-create the role assignments inherited from the subscription", fr: "Recréer les attributions de rôles héritées de l'abonnement" } }
    answer:
      values: { vend: vending, transfer: subpolicy, move: recreate }
    explanation:
      correct:
        en: |
          Subscription vending is the platform mechanism that turns an approved request into a subscription already placed in the right management group, with its peered network, budget and role assignments, through infrastructure as code. Moves of subscriptions into and out of the directory are controlled by the subscription policies, where a Global Administrator blocks transfers and lists the exempted users. A role assignment made directly on a resource doesn't move with it: it becomes orphaned and must be re-created on the moved resource.
        fr: |
          La distribution automatisée d'abonnements (subscription vending) est le mécanisme de plateforme qui transforme une demande approuvée en un abonnement déjà placé dans le bon groupe d'administration, avec son réseau connecté par peering, son budget et ses attributions de rôles, au moyen de l'infrastructure en tant que code. Les déplacements d'abonnements vers l'annuaire et hors de celui-ci sont contrôlés par les stratégies d'abonnement, où un Global Administrator bloque les transferts et liste les utilisateurs exemptés. Une attribution de rôle faite directement sur une ressource ne la suit pas : elle devient orpheline et doit être recréée sur la ressource déplacée.
      options:
        defaultmg: { en: "A default management group only places new subscriptions; it creates no network, budget or role assignment.", fr: "Un groupe d'administration par défaut ne fait que placer les nouveaux abonnements ; il ne crée ni réseau, ni budget, ni attribution de rôle." }
        blueprints: { en: "Azure Blueprints is being retired and must not be recommended for a new design.", fr: "Azure Blueprints est en cours de mise hors service et ne doit pas être recommandé pour une nouvelle conception." }
        specs: { en: "Template specs store and share templates; they don't create or place subscriptions on request.", fr: "Les specs de modèle stockent et partagent des modèles ; elles ne créent ni ne placent d'abonnements sur demande." }
        policydeny: { en: "Azure Policy evaluates resources; it doesn't control the transfer of a subscription to another directory.", fr: "Azure Policy évalue des ressources ; elle ne contrôle pas le transfert d'un abonnement vers un autre annuaire." }
        lock: { en: "Locks protect resources against deletion or change in the control plane; they don't govern directory transfers.", fr: "Les verrous protègent des ressources contre la suppression ou la modification dans le plan de contrôle ; ils ne régissent pas les transferts d'annuaire." }
        authz: { en: "This hierarchy setting controls who can create management groups, not who can transfer subscriptions.", fr: "Ce paramètre de hiérarchie contrôle qui peut créer des groupes d'administration, pas qui peut transférer des abonnements." }
        nothing: { en: "Direct role assignments don't follow a moved resource; they become orphaned.", fr: "Les attributions de rôles directes ne suivent pas une ressource déplacée ; elles deviennent orphelines." }
        mover: { en: "Azure Resource Mover moves resources between regions; it doesn't move role assignments.", fr: "Azure Resource Mover déplace des ressources entre régions ; il ne déplace pas d'attributions de rôles." }
        inherited: { en: "Assignments inherited from the subscription still apply, because the resources stay in the same subscription.", fr: "Les attributions héritées de l'abonnement s'appliquent toujours, car les ressources restent dans le même abonnement." }
    references:
      - title: Subscription vending - Cloud Adoption Framework
        url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/subscription-vending
      - title: Manage Azure subscription policies - Microsoft Cost Management
        url: https://learn.microsoft.com/en-us/azure/cost-management-billing/manage/manage-azure-subscription-policy

  # ------------------------------------------------------------------ 8
  - id: az305-qz-13-08
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware has Microsoft Entra ID P2 licenses for all its users and no Microsoft Entra ID Governance license. The company has no plan to buy other licenses.

        The identity team designs access reviews and access packages for the marketing department.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose de licences Microsoft Entra ID P2 pour tous ses utilisateurs et d'aucune licence Microsoft Entra ID Governance. L'entreprise ne prévoit pas d'acheter d'autres licences.

        L'équipe chargée des identités conçoit des révisions d'accès et des packages d'accès pour le service marketing.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "An access review of a marketing group can be scoped to the members who haven't signed in for 90 days, so that active members aren't reviewed.", fr: "Une révision d'accès d'un groupe marketing peut être limitée aux membres qui ne se sont pas connectés depuis 90 jours, afin que les membres actifs ne soient pas révisés." }
        - id: s2
          text: { en: "An access review of all the members of a marketing group can show the reviewers which members are inactive, to help them decide.", fr: "Une révision d'accès de tous les membres d'un groupe marketing peut indiquer aux réviseurs quels membres sont inactifs, pour les aider à décider." }
        - id: s3
          text: { en: "An access package can be assigned automatically to every user whose department attribute is Marketing, and removed when the attribute changes.", fr: "Un package d'accès peut être attribué automatiquement à chaque utilisateur dont l'attribut department vaut Marketing, et retiré quand l'attribut change." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Microsoft Entra ID P2 includes the access review and entitlement management capabilities that were generally available before Microsoft Entra ID Governance, including reviews of active and inactive users with decision helpers that point out the inactive ones. A review scoped only to inactive users and automatic assignment policies of access packages are advanced capabilities that require Microsoft Entra ID Governance licenses.
        fr: |
          Microsoft Entra ID P2 inclut les fonctionnalités de révision d'accès et de gestion des droits d'utilisation qui étaient en disponibilité générale avant Microsoft Entra ID Governance, dont les révisions des utilisateurs actifs et inactifs avec des aides à la décision qui signalent les inactifs. Une révision limitée aux seuls utilisateurs inactifs et les stratégies d'attribution automatique des packages d'accès sont des fonctionnalités avancées qui exigent des licences Microsoft Entra ID Governance.
      options:
        s1: { en: "Scoping a review to inactive users only requires Microsoft Entra ID Governance; with P2, inactive users are only flagged inside a review of all the users.", fr: "Limiter une révision aux seuls utilisateurs inactifs exige Microsoft Entra ID Governance ; avec P2, les inactifs sont seulement signalés dans une révision de tous les utilisateurs." }
        s3: { en: "Automatic assignment policies based on user attributes are a Microsoft Entra ID Governance capability.", fr: "Les stratégies d'attribution automatique fondées sur les attributs des utilisateurs sont une fonctionnalité de Microsoft Entra ID Governance." }
    references:
      - title: Microsoft Entra ID Governance licensing fundamentals - Microsoft Entra ID Governance
        url: https://learn.microsoft.com/en-us/entra/id-governance/licensing-fundamentals

  # ------------------------------------------------------------------ 9
  - id: az305-qz-13-09
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has a management group named **MG-Contoso** that contains two management groups named **MG-Workloads** and **MG-Sandbox**. A subscription named **Sub-Dev** is in MG-Workloads.

        An initiative is assigned at MG-Workloads. It contains the built-in policy **Allowed locations**, with the values West Europe and North Europe, and a definition that denies storage accounts with public network access. MG-Sandbox has no policy assignment, and no policy is assigned at MG-Contoso or above it.

        The development team has the Owner role on Sub-Dev. It assigns **Allowed locations** at Sub-Dev, with the values West Europe, North Europe and East US.

        A storage account named **st1** in Sub-Dev has a policy exemption of the Mitigated category for the public network access definition only. The exemption expires on June 30.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un groupe d'administration nommé **MG-Contoso** qui contient deux groupes d'administration nommés **MG-Workloads** et **MG-Sandbox**. Un abonnement nommé **Sub-Dev** se trouve dans MG-Workloads.

        Une initiative est attribuée sur MG-Workloads. Elle contient la stratégie intégrée **Allowed locations**, avec les valeurs West Europe et North Europe, et une définition qui refuse les comptes de stockage avec accès au réseau public. MG-Sandbox n'a aucune attribution de stratégie, et aucune stratégie n'est attribuée sur MG-Contoso ni au-dessus.

        L'équipe de développement détient le rôle Owner sur Sub-Dev. Elle attribue **Allowed locations** sur Sub-Dev, avec les valeurs West Europe, North Europe et East US.

        Un compte de stockage nommé **st1** dans Sub-Dev a une exemption de stratégie de la catégorie Mitigated pour la seule définition relative à l'accès au réseau public. L'exemption expire le 30 juin.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The development team can deploy a virtual machine to East US in Sub-Dev.", fr: "L'équipe de développement peut déployer une machine virtuelle dans la région East US dans Sub-Dev." }
        - id: s2
          text: { en: "From July 1, st1 is evaluated against the public network access definition again.", fr: "À partir du 1er juillet, st1 est de nouveau évalué par la définition relative à l'accès au réseau public." }
        - id: s3
          text: { en: "If Sub-Dev is moved to MG-Sandbox, the development team can deploy a virtual machine to East US in Sub-Dev.", fr: "Si Sub-Dev est déplacé vers MG-Sandbox, l'équipe de développement peut déployer une machine virtuelle dans la région East US dans Sub-Dev." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Azure Policy is an explicit deny system: every assignment that applies to a request is evaluated, whoever the caller is, and a more permissive assignment at a lower scope can't allow what a higher assignment denies. In MG-Workloads, East US is therefore denied even to the Owner. Under MG-Sandbox, only the assignment made at Sub-Dev applies, and it allows East US. An exemption isn't deleted when it expires, but it is no longer honored, so st1 is evaluated again.
        fr: |
          Azure Policy est un système de refus explicite : toutes les attributions qui s'appliquent à une requête sont évaluées, quel que soit l'appelant, et une attribution plus permissive à une étendue inférieure ne peut pas autoriser ce qu'une attribution supérieure refuse. Dans MG-Workloads, East US est donc refusée même à l'Owner. Sous MG-Sandbox, seule l'attribution faite sur Sub-Dev s'applique, et elle autorise East US. Une exemption n'est pas supprimée à son expiration, mais elle n'est plus prise en compte : st1 est donc de nouveau évalué.
      options:
        s1: { en: "The initiative inherited from MG-Workloads still denies East US; the assignment at Sub-Dev can't relax it.", fr: "L'initiative héritée de MG-Workloads refuse toujours East US ; l'attribution sur Sub-Dev ne peut pas l'assouplir." }
    references:
      - title: Overview of Azure Policy - Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
      - title: Details of the policy exemption structure - Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/exemption-structure

  # ------------------------------------------------------------------ 10
  - id: az305-qz-13-10
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware has 120 subscriptions in one Microsoft Entra tenant. Its current hierarchy has one management group per region (Europe and Americas), each with a Production and a Development management group, each with one management group per department. Every policy is assigned several times.

        You need to recommend a new hierarchy that meets the following requirements:

        - Policies differ between workloads connected to the corporate network and internet-facing workloads. They are the same in every region and for the production and development environments of a workload. No regulation requires separating the regions.
        - The production and development environments of each workload must have separate administrators and separate quotas.
        - Engineers need an isolated place for experiments, with relaxed policies.
        - The policies of the whole organization must be assigned once, without using the tenant root group.
        - The number of policy assignments must be minimized.

        What should you recommend?
      fr: |
        Litware compte 120 abonnements dans un seul locataire Microsoft Entra. Sa hiérarchie actuelle a un groupe d'administration par région (Europe et Americas), chacun avec un groupe d'administration Production et un groupe d'administration Development, chacun avec un groupe d'administration par service. Chaque stratégie est attribuée plusieurs fois.

        Vous devez recommander une nouvelle hiérarchie qui répond aux exigences suivantes :

        - Les stratégies diffèrent entre les charges de travail connectées au réseau de l'entreprise et les charges de travail exposées à Internet. Elles sont les mêmes dans toutes les régions et pour les environnements de production et de développement d'une charge de travail. Aucune réglementation n'impose de séparer les régions.
        - Les environnements de production et de développement de chaque charge de travail doivent avoir des administrateurs distincts et des quotas distincts.
        - Les ingénieurs ont besoin d'un espace isolé pour leurs expériences, avec des stratégies assouplies.
        - Les stratégies de toute l'organisation doivent être attribuées une seule fois, sans utiliser le groupe racine du locataire.
        - Le nombre d'attributions de stratégies doit être réduit au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Under the tenant root group, Production and Development groups, each with Corp and Online groups; one subscription per workload environment", fr: "Sous le groupe racine du locataire, des groupes Production et Development, chacun avec des groupes Corp et Online ; un abonnement par environnement de charge de travail" } }
        - { id: b, text: { en: "Under an intermediate root, Europe and Americas groups, each with Corp, Online and Sandbox groups; one subscription per workload environment", fr: "Sous une racine intermédiaire, des groupes Europe et Americas, chacun avec des groupes Corp, Online et Sandbox ; un abonnement par environnement de charge de travail" } }
        - { id: c, text: { en: "Under an intermediate root, Corp, Online and Sandbox groups; one subscription per workload, with one resource group per environment", fr: "Sous une racine intermédiaire, des groupes Corp, Online et Sandbox ; un abonnement par charge de travail, avec un groupe de ressources par environnement" } }
        - { id: d, text: { en: "Under an intermediate root, Corp, Online and Sandbox groups; one subscription per environment, a workload's two in the same group", fr: "Sous une racine intermédiaire, des groupes Corp, Online et Sandbox ; un abonnement par environnement, les deux d'une charge de travail dans le même groupe" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A management group hierarchy is built on policy needs: an intermediate root receives the organization-wide policies once, Corp and Online receive the policies of their archetype once, and Sandbox isolates experiments with relaxed policies. Environments are not management groups: production and development are separate subscriptions in the same management group, which gives them separate administrators and quotas while sharing the same assignments.
        fr: |
          Une hiérarchie de groupes d'administration se construit selon les besoins de stratégie : une racine intermédiaire reçoit une seule fois les stratégies de toute l'organisation, Corp et Online reçoivent une seule fois les stratégies de leur archétype, et Sandbox isole les expériences avec des stratégies assouplies. Les environnements ne sont pas des groupes d'administration : la production et le développement sont des abonnements distincts dans le même groupe d'administration, ce qui leur donne des administrateurs et des quotas distincts tout en partageant les mêmes attributions.
      options:
        a: { en: "It assigns at the tenant root group, and environment groups duplicate every Corp and Online assignment; it also lacks a sandbox.", fr: "Elle attribue sur le groupe racine du locataire, et les groupes d'environnement dupliquent chaque attribution Corp et Online ; elle n'a pas non plus de bac à sable." }
        b: { en: "Region groups duplicate every Corp, Online and Sandbox assignment, although no requirement separates the regions.", fr: "Les groupes de région dupliquent chaque attribution Corp, Online et Sandbox, alors qu'aucune exigence ne sépare les régions." }
        c: { en: "Resource groups in one subscription share its quotas, so production and development can't have separate quotas.", fr: "Les groupes de ressources d'un même abonnement partagent ses quotas : la production et le développement ne peuvent donc pas avoir de quotas distincts." }
    references:
      - title: Management groups - Cloud Adoption Framework
        url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups
      - title: Subscription considerations and recommendations - Cloud Adoption Framework
        url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-subscriptions
