chapter: 42-application-architecture
questions:
  # ------------------------------------------------------------------ 1
  - id: az305-qz-42-01
    objective: "4.2.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The platform team of Tailspin Toys manages infrastructure in Azure and in another public cloud. The team wants to describe the infrastructure of both clouds as code, with one language and one tool.

        What should you recommend?
      fr: |
        L'équipe plateforme de Tailspin Toys gère une infrastructure dans Azure et dans un autre cloud public. L'équipe souhaite décrire l'infrastructure des deux clouds sous forme de code, avec un seul langage et un seul outil.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Bicep files", fr: "Des fichiers Bicep" } }
        - { id: b, text: { en: "ARM templates", fr: "Des modèles ARM" } }
        - { id: c, text: { en: "Template specs", fr: "Des specs de modèle" } }
        - { id: d, text: { en: "Terraform", fr: "Terraform" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Terraform manages any infrastructure, including several public clouds, through providers, with the same language and workflow. It is the choice of teams that manage several clouds with one tool.
        fr: |
          Terraform gère n'importe quelle infrastructure, y compris plusieurs clouds publics, grâce à des fournisseurs (providers), avec le même langage et le même flux de travail. C'est le choix des équipes qui gèrent plusieurs clouds avec un seul outil.
      options:
        a: { en: "Bicep deploys Azure resources only, through Azure Resource Manager.", fr: "Bicep déploie uniquement des ressources Azure, via Azure Resource Manager." }
        b: { en: "ARM templates describe Azure resources only.", fr: "Les modèles ARM ne décrivent que des ressources Azure." }
        c: { en: "Template specs store and share ARM templates or Bicep files in Azure; they don't deploy to another cloud.", fr: "Les specs de modèle stockent et partagent des modèles ARM ou des fichiers Bicep dans Azure ; ils ne déploient pas vers un autre cloud." }
    references:
      - title: Overview of Terraform on Azure - What is Terraform?
        url: https://learn.microsoft.com/en-us/azure/developer/terraform/overview

  # ------------------------------------------------------------------ 2
  - id: az305-qz-42-02
    objective: "4.2.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum plans an Azure App Configuration store for the test environment of an application. The store will receive a few thousand requests per day. The test environment has no public network access, so the application must reach the store through a private endpoint. No SLA is required.

        You need to recommend a tier for the store that minimizes cost.

        Which tier should you recommend?
      fr: |
        Adatum prévoit un magasin Azure App Configuration pour l'environnement de test d'une application. Le magasin recevra quelques milliers de requêtes par jour. L'environnement de test n'a pas d'accès au réseau public : l'application doit donc atteindre le magasin par un point de terminaison privé. Aucun SLA n'est exigé.

        Vous devez recommander un niveau pour le magasin qui réduit les coûts au minimum.

        Quel niveau devez-vous recommander ?
    body:
      options:
        - { id: a, text: Free }
        - { id: b, text: Developer }
        - { id: c, text: Standard }
        - { id: d, text: Premium }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The Developer tier is designed for low-volume development and testing and supports private endpoints. It has no SLA, which the test environment doesn't need, and it costs less than Standard.
        fr: |
          Le niveau Developer est conçu pour le développement et les tests à faible volume et prend en charge les points de terminaison privés. Il n'a pas de SLA, ce dont l'environnement de test n'a pas besoin, et il coûte moins cher que Standard.
      options:
        a: { en: "The Free tier doesn't support private endpoints, and it is limited to 1,000 requests per day.", fr: "Le niveau Free ne prend pas en charge les points de terminaison privés, et il est limité à 1 000 requêtes par jour." }
        c: { en: "Standard supports private endpoints, but it costs more and adds an SLA and geo-replication that aren't required.", fr: "Standard prend en charge les points de terminaison privés, mais il coûte plus cher et ajoute un SLA et la géoréplication, qui ne sont pas exigés." }
        d: { en: "Premium removes the request quota for high-volume production workloads, at the highest cost.", fr: "Premium supprime le quota de requêtes pour les charges de production à fort volume, au coût le plus élevé." }
    references:
      - title: Azure App Configuration FAQ
        url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/faq

  # ------------------------------------------------------------------ 3
  - id: az305-qz-42-03
    objective: "4.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The web front end of Proseware hands work items to a pool of identical worker instances. Each work item is a JSON message of about 150 KB, and the backlog never exceeds 3 GB. The workers don't need ordering, publish-subscribe, transactions or duplicate detection.

        You need to recommend a messaging solution that minimizes cost.

        What should you recommend?
      fr: |
        Le front-end web de Proseware transmet des éléments de travail à un pool d'instances de traitement identiques. Chaque élément de travail est un message JSON d'environ 150 Ko, et l'arriéré ne dépasse jamais 3 Go. Les instances de traitement n'ont besoin ni d'ordre, ni de publication-abonnement, ni de transactions, ni de détection des doublons.

        Vous devez recommander une solution de messagerie qui réduit les coûts au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "A queue in Azure Queue Storage", fr: "Une file d'attente dans Stockage File d'attente Azure" } }
        - { id: b, text: { en: "A queue in a Service Bus namespace of the Basic tier", fr: "Une file d'attente dans un espace de noms Service Bus du niveau Basic" } }
        - { id: c, text: { en: "A queue in a Service Bus namespace of the Standard tier", fr: "Une file d'attente dans un espace de noms Service Bus du niveau Standard" } }
        - { id: d, text: { en: "A queue in a Service Bus namespace of the Premium tier", fr: "Une file d'attente dans un espace de noms Service Bus du niveau Premium" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A queue message in Azure Queue Storage is limited to 64 KB, so the 150 KB work items need Service Bus, which accepts messages of up to 256 KB in the Basic and Standard tiers. Basic supports queues only, which is all the workers need, and a 3 GB backlog fits in a queue of that tier.
        fr: |
          Un message de Stockage File d'attente Azure est limité à 64 Ko : les éléments de travail de 150 Ko exigent donc Service Bus, qui accepte des messages jusqu'à 256 Ko aux niveaux Basic et Standard. Basic prend en charge uniquement les files d'attente, ce qui suffit aux instances de traitement, et un arriéré de 3 Go tient dans une file d'attente de ce niveau.
      options:
        a: { en: "Queue Storage is the cheapest queue, but a message can't exceed 64 KB.", fr: "Stockage File d'attente est la file d'attente la moins chère, mais un message ne peut pas dépasser 64 Ko." }
        c: { en: "Standard adds topics, sessions, transactions and duplicate detection, none of which is needed: it costs more than Basic.", fr: "Standard ajoute les rubriques, les sessions, les transactions et la détection des doublons, dont aucune n'est nécessaire : il coûte plus cher que Basic." }
        d: { en: "Premium provides dedicated messaging units and large messages, at a much higher cost than needed.", fr: "Premium fournit des unités de messagerie dédiées et de gros messages, à un coût bien plus élevé que nécessaire." }
    references:
      - title: Microsoft Azure Service Bus quotas and limits - Azure Service Bus
        url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-quotas
      - title: Introduction to Azure Queue Storage - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/queues/storage-queues-introduction

  # ------------------------------------------------------------------ 4
  - id: az305-qz-42-04
    objective: "4.2.3"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Wingtip Toys publishes a weather API through an Azure API Management instance. Wingtip Toys plans two offers:

        - **Trial**: any developer who signs up in the developer portal gets a key immediately. Each trial subscription is limited to 10,000 calls per month.
        - **Partner**: Wingtip Toys reviews each subscription request before a key is issued. Partner subscriptions have no monthly limit.

        You need to recommend how to configure the offers.

        How should you complete the recommendation? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys publie une API météo par une instance Azure API Management. Wingtip Toys prévoit deux offres :

        - **Trial** : tout développeur qui s'inscrit sur le portail des développeurs obtient immédiatement une clé. Chaque abonnement d'essai est limité à 10 000 appels par mois.
        - **Partner** : Wingtip Toys examine chaque demande d'abonnement avant qu'une clé soit émise. Les abonnements partenaires n'ont pas de limite mensuelle.

        Vous devez recommander comment configurer les offres.

        Comment devez-vous compléter la recommandation ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Package each offer as: [[unit]]
          Limit the Trial offer with: [[limit]]
          For the Partner offer, enable: [[approval]]
        fr: |
          Empaqueter chaque offre sous forme de : [[unit]]
          Limiter l'offre Trial avec : [[limit]]
          Pour l'offre Partner, activer : [[approval]]
      slots:
        - id: unit
          options:
            - { id: product, text: { en: "a product", fr: "un produit" } }
            - { id: version, text: { en: "a version of the API", fr: "une version de l'API" } }
            - { id: workspace, text: { en: "a workspace", fr: "un espace de travail" } }
        - id: limit
          options:
            - { id: quota, text: { en: "a quota policy at the product scope", fr: "une stratégie quota à l'étendue du produit" } }
            - { id: rate, text: { en: "a rate-limit policy at the product scope", fr: "une stratégie rate-limit à l'étendue du produit" } }
            - { id: cache, text: { en: "a response caching policy at the product scope", fr: "une stratégie de mise en cache des réponses à l'étendue du produit" } }
        - id: approval
          options:
            - { id: reqsub, text: { en: "the Requires subscription setting", fr: "le paramètre Requires subscription" } }
            - { id: reqapp, text: { en: "the Requires approval setting", fr: "le paramètre Requires approval" } }
            - { id: count, text: { en: "the Subscription count limit setting", fr: "le paramètre Subscription count limit" } }
    answer:
      values: { unit: product, limit: quota, approval: reqapp }
    explanation:
      correct:
        en: |
          A product packages APIs for consumers, who subscribe to it in the developer portal and receive a subscription key. The quota policy, set at the product scope, enforces a call volume per subscription over a long renewal period such as a month. With Requires approval, an administrator accepts or rejects each subscription attempt; without it, subscriptions are approved automatically, as the Trial offer needs.
        fr: |
          Un produit regroupe des API pour les consommateurs, qui s'y abonnent sur le portail des développeurs et reçoivent une clé d'abonnement. La stratégie quota, définie à l'étendue du produit, impose un volume d'appels par abonnement sur une longue période de renouvellement, comme un mois. Avec Requires approval, un administrateur accepte ou rejette chaque tentative d'abonnement ; sans ce paramètre, les abonnements sont approuvés automatiquement, comme l'offre Trial l'exige.
      options:
        version: { en: "API versions publish successive versions of an API; they don't carry subscriptions, quotas or approval.", fr: "Les versions d'API publient des versions successives d'une API ; elles ne portent ni abonnements, ni quotas, ni approbation." }
        workspace: { en: "Workspaces let teams manage their own APIs on a shared instance; they don't package offers for consumers.", fr: "Les espaces de travail permettent à des équipes de gérer leurs propres API sur une instance partagée ; ils n'empaquettent pas d'offres pour les consommateurs." }
        rate: { en: "Rate limits protect against short bursts over a window of seconds or minutes, not a monthly volume.", fr: "Les limites de débit protègent contre de courtes rafales sur une fenêtre de secondes ou de minutes, pas un volume mensuel." }
        reqsub: { en: "Requires subscription only makes a key mandatory; subscription attempts are still approved automatically.", fr: "Requires subscription rend seulement une clé obligatoire ; les tentatives d'abonnement restent approuvées automatiquement." }
        count: { en: "Subscription count limit caps the number of simultaneous subscriptions of a user; it doesn't add a review.", fr: "Subscription count limit plafonne le nombre d'abonnements simultanés d'un utilisateur ; il n'ajoute pas d'examen." }
    references:
      - title: Tutorial - Create and publish a product in Azure API Management
        url: https://learn.microsoft.com/en-us/azure/api-management/api-management-howto-add-products
      - title: Advanced Request Throttling with Azure API Management
        url: https://learn.microsoft.com/en-us/azure/api-management/api-management-sample-flexible-throttling

  # ------------------------------------------------------------------ 5
  - id: az305-qz-42-05
    objective: "4.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso publishes a storefront through Azure Front Door. The `/assets/*` route serves images, style sheets and scripts from a storage account. The `/api/*` route serves `GET` responses that contain the cart and the recommendations of the signed-in user. Customers on other continents complain that pages load slowly.

        You need to reduce the download time of the static files for these customers. A response that contains the data of one user must never be served to another user.

        What should you do?
      fr: |
        Contoso publie une vitrine en ligne par Azure Front Door. L'itinéraire `/assets/*` sert des images, des feuilles de style et des scripts depuis un compte de stockage. L'itinéraire `/api/*` sert des réponses `GET` qui contiennent le panier et les recommandations de l'utilisateur connecté. Les clients d'autres continents se plaignent de la lenteur de chargement des pages.

        Vous devez réduire le temps de téléchargement des fichiers statiques pour ces clients. Une réponse qui contient les données d'un utilisateur ne doit jamais être servie à un autre utilisateur.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable caching on both routes, with the query string behavior set to Use Query String.", fr: "Activer la mise en cache sur les deux itinéraires, avec le comportement de chaîne de requête Use Query String." } }
        - { id: b, text: { en: "Enable caching on both routes, with the query string behavior set to Ignore Query String.", fr: "Activer la mise en cache sur les deux itinéraires, avec le comportement de chaîne de requête Ignore Query String." } }
        - { id: c, text: { en: "Enable caching on the /assets/* route, and keep caching disabled on the /api/* route.", fr: "Activer la mise en cache sur l'itinéraire /assets/*, et laisser la mise en cache désactivée sur l'itinéraire /api/*." } }
        - { id: d, text: { en: "Deploy Azure Managed Redis next to the storage account, and serve the /assets/* files from it.", fr: "Déployer Azure Managed Redis à côté du compte de stockage, et servir les fichiers /assets/* depuis ce cache." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Front Door caches cacheable GET responses at each edge location when caching is enabled on the route, so the static files are served close to the customers. The recommended design uses separate routes for static and dynamic content, with caching disabled on the dynamic one: user-specific responses then always come from the origin.
        fr: |
          Front Door met en cache les réponses GET pouvant être mises en cache dans chaque site de périphérie quand la mise en cache est activée sur l'itinéraire : les fichiers statiques sont donc servis près des clients. La conception recommandée utilise des itinéraires distincts pour le contenu statique et dynamique, avec la mise en cache désactivée sur l'itinéraire dynamique : les réponses propres à un utilisateur viennent alors toujours de l'origine.
      options:
        a: { en: "The cart requests of different users can have the same URL and query string, so a cached cart could be served to another user.", fr: "Les requêtes de panier de différents utilisateurs peuvent avoir la même URL et la même chaîne de requête : un panier mis en cache pourrait être servi à un autre utilisateur." }
        b: { en: "Ignoring the query string makes even more user requests share the same cached response.", fr: "Ignorer la chaîne de requête fait partager la même réponse mise en cache par encore plus de requêtes d'utilisateurs." }
        d: { en: "A Redis cache in one region doesn't bring the files closer to customers on other continents.", fr: "Un cache Redis dans une seule région ne rapproche pas les fichiers des clients des autres continents." }
    references:
      - title: Caching - Azure Front Door
        url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-caching

  # ------------------------------------------------------------------ 6
  - id: az305-qz-42-06
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has a legacy inventory system in its datacenter. The system has no API: its data is available only in an on-premises SQL Server database. The datacenter accepts no connection initiated from the internet.

        Northwind Traders wants to give partners read access to the stock levels. You need to recommend a solution that meets the following requirements:

        - Partners discover a REST API in a developer portal and obtain their own subscription key.
        - A monthly call quota is enforced for each partner.
        - No custom code is written or maintained.
        - Minimize administrative effort.

        What should you recommend?
      fr: |
        Northwind Traders dispose d'un système d'inventaire hérité dans son centre de données. Le système n'a pas d'API : ses données ne sont disponibles que dans une base de données SQL Server locale. Le centre de données n'accepte aucune connexion initiée depuis Internet.

        Northwind Traders souhaite donner aux partenaires un accès en lecture aux niveaux de stock. Vous devez recommander une solution qui répond aux exigences suivantes :

        - Les partenaires découvrent une API REST dans un portail des développeurs et obtiennent leur propre clé d'abonnement.
        - Un quota mensuel d'appels est appliqué à chaque partenaire.
        - Aucun code personnalisé n'est écrit ni maintenu.
        - Réduire l'effort d'administration au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "An API Management self-hosted gateway in the datacenter, with an API whose back end is the SQL Server database", fr: "Une passerelle auto-hébergée API Management dans le centre de données, avec une API dont le back-end est la base de données SQL Server" } }
        - { id: b, text: { en: "A logic app with a Request trigger that queries SQL Server through the on-premises data gateway, imported in API Management", fr: "Une application logique avec un déclencheur Request qui interroge SQL Server via la passerelle de données locale, importée dans API Management" } }
        - { id: c, text: { en: "A logic app with a Request trigger that queries SQL Server through the on-premises data gateway, published through Azure Front Door", fr: "Une application logique avec un déclencheur Request qui interroge SQL Server via la passerelle de données locale, publiée par Azure Front Door" } }
        - { id: d, text: { en: "A function app that queries SQL Server over a site-to-site VPN, imported in API Management", fr: "Une application de fonction qui interroge SQL Server via un VPN site à site, importée dans API Management" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A system that has no API is exposed by fronting a Logic Apps workflow with API Management. The SQL Server connector reaches the database through the on-premises data gateway, which needs no inbound connection, and the logic app's HTTP trigger is imported as an API. API Management then provides the developer portal, the subscription keys and a quota policy per subscription.
        fr: |
          Un système sans API s'expose en plaçant API Management devant un workflow Logic Apps. Le connecteur SQL Server atteint la base de données via la passerelle de données locale, qui ne nécessite aucune connexion entrante, et le déclencheur HTTP de l'application logique est importé comme API. API Management fournit ensuite le portail des développeurs, les clés d'abonnement et une stratégie de quota par abonnement.
      options:
        a: { en: "The self-hosted gateway proxies HTTP APIs; it doesn't turn a SQL Server database into a REST API.", fr: "La passerelle auto-hébergée sert de proxy à des API HTTP ; elle ne transforme pas une base de données SQL Server en API REST." }
        c: { en: "Front Door accelerates and protects HTTP traffic but provides no developer portal, subscription keys or per-partner quotas.", fr: "Front Door accélère et protège le trafic HTTP, mais ne fournit ni portail des développeurs, ni clés d'abonnement, ni quotas par partenaire." }
        d: { en: "A function app requires custom code, and a new VPN adds infrastructure to manage.", fr: "Une application de fonction exige du code personnalisé, et un nouveau VPN ajoute une infrastructure à gérer." }
    references:
      - title: Import a Logic App as an API by Using the Azure Portal
        url: https://learn.microsoft.com/en-us/azure/api-management/import-logic-app-as-api
      - title: Connect to On-Premises Data Sources - Azure Logic Apps
        url: https://learn.microsoft.com/en-us/azure/logic-apps/logic-apps-gateway-connection

  # ------------------------------------------------------------------ 7
  - id: az305-qz-42-07
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Partners of Adatum upload invoices as blobs to a container of a storage account named stinvoices. The partner applications can't be modified. A pool of worker instances must process each new invoice.

        You need to recommend a solution that meets the following requirements:

        - Each invoice is processed by only one worker at a time. If a worker fails while it processes an invoice, another worker retries it.
        - The workers are stopped for up to three days during monthly maintenance. The invoices that arrive meanwhile must be processed automatically after the maintenance, without any manual replay.
        - The workers must not poll the storage account.

        Which two elements should you include in the recommendation? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Les partenaires d'Adatum chargent des factures sous forme d'objets blob dans un conteneur d'un compte de stockage nommé stinvoices. Les applications des partenaires ne peuvent pas être modifiées. Un pool d'instances de traitement doit traiter chaque nouvelle facture.

        Vous devez recommander une solution qui répond aux exigences suivantes :

        - Chaque facture n'est traitée que par une seule instance à la fois. Si une instance échoue pendant le traitement d'une facture, une autre instance la retraite.
        - Les instances de traitement sont arrêtées jusqu'à trois jours pendant la maintenance mensuelle. Les factures arrivées entre-temps doivent être traitées automatiquement après la maintenance, sans aucune relecture manuelle.
        - Les instances de traitement ne doivent pas interroger le compte de stockage.

        Quels sont les deux éléments que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "An Event Grid custom topic to which stinvoices publishes the Blob Created events", fr: "Une rubrique personnalisée Event Grid sur laquelle stinvoices publie les événements Blob Created" } }
        - { id: b, text: { en: "An Event Grid system topic for stinvoices, with an event subscription to the Blob Created event", fr: "Une rubrique système Event Grid pour stinvoices, avec un abonnement aux événements Blob Created" } }
        - { id: c, text: { en: "A webhook on the workers as the event handler, with a dead-letter blob container", fr: "Un webhook sur les instances de traitement comme gestionnaire d'événements, avec un conteneur d'objets blob de lettres mortes" } }
        - { id: d, text: { en: "A Service Bus queue as the event handler, read by the workers in peek-lock mode", fr: "Une file d'attente Service Bus comme gestionnaire d'événements, lue par les instances en mode peek-lock" } }
        - { id: e, text: { en: "An event hub as the event handler, read by the workers through one consumer group", fr: "Un hub d'événements comme gestionnaire d'événements, lu par les instances via un seul groupe de consommateurs" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Blob Storage publishes its events to a system topic, so the partner applications don't change and the workers don't poll. Event Grid retries a handler for 24 hours by default and then drops the event, so the events must be delivered to a durable handler: a Service Bus queue keeps them during the three days of maintenance. In peek-lock mode, a message is locked for one worker and becomes available again if that worker fails, which gives competing consumers with retries.
        fr: |
          Stockage Blob publie ses événements sur une rubrique système : les applications des partenaires ne changent pas et les instances n'interrogent rien. Event Grid réessaie un gestionnaire pendant 24 heures par défaut, puis abandonne l'événement : les événements doivent donc être livrés à un gestionnaire durable. Une file d'attente Service Bus les conserve pendant les trois jours de maintenance. En mode peek-lock, un message est verrouillé pour une instance et redevient disponible si elle échoue, ce qui donne des consommateurs concurrents avec nouvelles tentatives.
      options:
        a: { en: "Only Azure services publish their events, to system topics; custom topics receive the events that your own applications publish.", fr: "Seuls les services Azure publient leurs événements, sur des rubriques système ; les rubriques personnalisées reçoivent les événements que vos propres applications publient." }
        c: { en: "After 24 hours of failed retries, the events go to the dead-letter container, from which someone must replay them manually.", fr: "Après 24 heures de nouvelles tentatives en échec, les événements vont dans le conteneur de lettres mortes, d'où quelqu'un doit les relire manuellement." }
        e: { en: "Event Hubs keeps a stream that readers consume by partition and checkpoint; it doesn't lock an event for one worker and redeliver it if that worker fails.", fr: "Event Hubs conserve un flux que les lecteurs consomment par partition et par point de contrôle ; il ne verrouille pas un événement pour une instance et ne le relivre pas si elle échoue." }
    references:
      - title: System topics in Azure Event Grid - Azure Event Grid
        url: https://learn.microsoft.com/en-us/azure/event-grid/system-topics
      - title: Azure Event Grid Delivery and Retry Explained - Azure Event Grid
        url: https://learn.microsoft.com/en-us/azure/event-grid/delivery-and-retry

  # ------------------------------------------------------------------ 8
  - id: az305-qz-42-08
    objective: "4.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware runs a pricing service in the West Europe and East US regions. Both regions serve customers at the same time. The service caches about 300 GB of pricing data in Redis, with moderate throughput needs.

        You need to recommend a caching solution that meets the following requirements:

        - The service of each region reads and writes a cache in its own region.
        - A write in one region is replicated automatically to the other region, and concurrent writes are resolved without application code.
        - Subject to the other requirements, minimize cost.

        What should you recommend?
      fr: |
        Litware exécute un service de tarification dans les régions Europe Ouest et USA Est. Les deux régions servent des clients en même temps. Le service met en cache environ 300 Go de données tarifaires dans Redis, avec des besoins de débit modérés.

        Vous devez recommander une solution de mise en cache qui répond aux exigences suivantes :

        - Le service de chaque région lit et écrit un cache dans sa propre région.
        - Une écriture dans une région est répliquée automatiquement vers l'autre région, et les écritures simultanées sont résolues sans code applicatif.
        - Sous réserve des autres exigences, réduire les coûts au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Two Flash Optimized Azure Managed Redis instances in an active geo-replication group", fr: "Deux instances Azure Managed Redis Flash Optimized dans un groupe de géoréplication active" } }
        - { id: b, text: { en: "Two Balanced Azure Managed Redis instances in an active geo-replication group", fr: "Deux instances Azure Managed Redis Balanced dans un groupe de géoréplication active" } }
        - { id: c, text: { en: "Two Memory Optimized Azure Managed Redis instances in an active geo-replication group", fr: "Deux instances Azure Managed Redis Memory Optimized dans un groupe de géoréplication active" } }
        - { id: d, text: { en: "Two Azure Cache for Redis Premium caches linked by geo-replication", fr: "Deux caches Azure Cache for Redis Premium liés par géoréplication" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Active geo-replication groups instances in several regions that all accept writes, and it synchronizes them with conflict-free replicated data types. Memory Optimized has the highest memory-to-vCPU ratio, which fits a large dataset with moderate throughput at the lowest cost among the tiers that support active geo-replication.
        fr: |
          La géoréplication active regroupe des instances de plusieurs régions qui acceptent toutes des écritures, et elle les synchronise avec des types de données répliqués sans conflit (CRDT). Memory Optimized a le rapport mémoire/processeur virtuel le plus élevé, ce qui convient à un grand jeu de données avec un débit modéré, au coût le plus bas parmi les niveaux qui prennent en charge la géoréplication active.
      options:
        a: { en: "Flash Optimized is cheaper for large datasets, but it doesn't support active geo-replication.", fr: "Flash Optimized est moins cher pour les grands jeux de données, mais il ne prend pas en charge la géoréplication active." }
        b: { en: "Balanced supports active geo-replication, but it provides fewer GB per vCPU: the same 300 GB costs more than in Memory Optimized.", fr: "Balanced prend en charge la géoréplication active, mais il fournit moins de Go par processeur virtuel : les mêmes 300 Go coûtent plus cher qu'en Memory Optimized." }
        d: { en: "Geo-replication of Azure Cache for Redis Premium is passive, with a read-only secondary, and these tiers retire on September 30, 2028.", fr: "La géoréplication d'Azure Cache for Redis Premium est passive, avec un secondaire en lecture seule, et ces niveaux sont mis hors service le 30 septembre 2028." }
    references:
      - title: Configure active geo-replication for Azure Managed Redis instances - Azure Managed Redis
        url: https://learn.microsoft.com/en-us/azure/redis/how-to-active-geo-replication
      - title: What is Azure Managed Redis? - Azure Managed Redis
        url: https://learn.microsoft.com/en-us/azure/redis/overview

  # ------------------------------------------------------------------ 9
  - id: az305-qz-42-09
    objective: "4.2.6"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam deploys a containerized web application to an Azure Kubernetes Service (AKS) cluster from Azure Pipelines. The pipelines run on Microsoft-hosted agents. Several pipelines can deploy to the production environment.

        You need to recommend a deployment design that meets the following requirements:

        - The pipelines sign in to Azure without any secret stored in Azure DevOps, and no credential has to be rotated.
        - Every deployment to production, whatever the pipeline, waits until a member of the Operations group accepts it.
        - A new version replaces the running pods gradually, so that the application stays available during the deployment.

        How should you complete the recommendation? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam déploie une application web en conteneurs sur un cluster Azure Kubernetes Service (AKS) depuis Azure Pipelines. Les pipelines s'exécutent sur des agents hébergés par Microsoft. Plusieurs pipelines peuvent déployer dans l'environnement de production.

        Vous devez recommander une conception de déploiement qui répond aux exigences suivantes :

        - Les pipelines se connectent à Azure sans aucun secret stocké dans Azure DevOps, et aucune information d'identification ne doit être renouvelée.
        - Chaque déploiement en production, quel que soit le pipeline, attend qu'un membre du groupe Operations l'accepte.
        - Une nouvelle version remplace progressivement les pods en cours d'exécution, pour que l'application reste disponible pendant le déploiement.

        Comment devez-vous compléter la recommandation ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Sign-in to Azure: [[signin]]
          Control before production: [[gate]]
          Release of a new version: [[release]]
        fr: |
          Connexion à Azure : [[signin]]
          Contrôle avant la production : [[gate]]
          Mise en production d'une nouvelle version : [[release]]
      slots:
        - id: signin
          options:
            - { id: wif, text: { en: "an Azure Resource Manager service connection that uses workload identity federation", fr: "une connexion de service Azure Resource Manager qui utilise la fédération d'identité de charge de travail" } }
            - { id: secret, text: { en: "an Azure Resource Manager service connection that uses a service principal and a client secret", fr: "une connexion de service Azure Resource Manager qui utilise un principal de service et une clé secrète client" } }
            - { id: agentmi, text: { en: "the managed identity of the agent virtual machines", fr: "l'identité managée des machines virtuelles des agents" } }
        - id: gate
          options:
            - { id: envapproval, text: { en: "an approval check on the production environment", fr: "une vérification d'approbation sur l'environnement de production" } }
            - { id: branch, text: { en: "a branch policy that requires a reviewer on the main branch", fr: "une stratégie de branche qui exige un relecteur sur la branche main" } }
            - { id: lock, text: { en: "a ReadOnly lock on the production resource group", fr: "un verrou ReadOnly sur le groupe de ressources de production" } }
        - id: release
          options:
            - { id: rolling, text: { en: "a rolling update of the Kubernetes deployment", fr: "une mise à jour propagée du déploiement Kubernetes" } }
            - { id: slot, text: { en: "a deployment slot swap", fr: "une permutation d'emplacements de déploiement" } }
            - { id: revisions, text: { en: "traffic splitting between revisions", fr: "un fractionnement du trafic entre révisions" } }
    answer:
      values: { signin: wif, gate: envapproval, release: rolling }
    explanation:
      correct:
        en: |
          Workload identity federation is the recommended authentication for an Azure Resource Manager service connection: it eliminates secrets and their management. An approval check configured on the production environment applies to every run of every pipeline that targets this environment, and the stage waits until an approver accepts it. On AKS, a rolling update replaces the pods of a deployment progressively, so that part of the replicas keeps serving requests.
        fr: |
          La fédération d'identité de charge de travail est l'authentification recommandée pour une connexion de service Azure Resource Manager : elle élimine les secrets et leur gestion. Une vérification d'approbation configurée sur l'environnement de production s'applique à chaque exécution de chaque pipeline qui cible cet environnement, et l'étape attend qu'un approbateur l'accepte. Sur AKS, une mise à jour propagée remplace progressivement les pods d'un déploiement, pour qu'une partie des réplicas continue de servir les requêtes.
      options:
        secret: { en: "A client secret must be stored in the service connection and rotated before it expires.", fr: "Une clé secrète client doit être stockée dans la connexion de service et renouvelée avant son expiration." }
        agentmi: { en: "An agent-assigned managed identity requires self-hosted agents on Azure virtual machines; Microsoft-hosted agents don't provide one.", fr: "Une identité managée affectée à l'agent exige des agents auto-hébergés sur des machines virtuelles Azure ; les agents hébergés par Microsoft n'en fournissent pas." }
        branch: { en: "A branch policy reviews code changes; it doesn't stop a pipeline run from deploying to production.", fr: "Une stratégie de branche contrôle les modifications du code ; elle n'empêche pas une exécution de pipeline de déployer en production." }
        lock: { en: "A ReadOnly lock blocks every change, including the approved deployments; it doesn't ask anyone for approval.", fr: "Un verrou ReadOnly bloque toute modification, y compris les déploiements approuvés ; il ne demande l'approbation de personne." }
        slot: { en: "Deployment slots are an App Service feature, not an AKS one.", fr: "Les emplacements de déploiement sont une fonctionnalité d'App Service, pas d'AKS." }
        revisions: { en: "Revisions and traffic splitting are an Azure Container Apps feature.", fr: "Les révisions et le fractionnement du trafic sont une fonctionnalité d'Azure Container Apps." }
    references:
      - title: Use an Azure Resource Manager service connection - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/library/connect-to-azure?view=azure-devops
      - title: Pipeline deployment approvals - Azure Pipelines
        url: https://learn.microsoft.com/en-us/azure/devops/pipelines/process/approvals

  # ------------------------------------------------------------------ 10
  - id: az305-qz-42-10
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso is designing a claims processing solution in the West Europe region, which has availability zones. A front end sends each insurance claim as a message of about 180 KB. Several processor instances share the claims.

        When a processor handles a claim, it completes the claim message, sends one message to a queue named payments and sends one message to a queue named audit. These three operations must all succeed or all fail.

        You need to recommend a messaging design that meets the following requirements:

        - Claims processing continues if one availability zone of West Europe fails.
        - Minimize cost.

        How should you complete the recommendation? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso conçoit une solution de traitement des sinistres dans la région Europe Ouest, qui dispose de zones de disponibilité. Un front-end envoie chaque déclaration de sinistre sous forme d'un message d'environ 180 Ko. Plusieurs instances de traitement se partagent les déclarations.

        Quand une instance traite une déclaration, elle termine le message de la déclaration, envoie un message à une file d'attente nommée payments et envoie un message à une file d'attente nommée audit. Ces trois opérations doivent toutes réussir ou toutes échouer.

        Vous devez recommander une conception de messagerie qui répond aux exigences suivantes :

        - Le traitement des déclarations continue si une zone de disponibilité d'Europe Ouest tombe en panne.
        - Réduire les coûts au minimum.

        Comment devez-vous compléter la recommandation ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Messaging service and tier: [[tier]]
          Handling of a claim as one unit of work: [[atomic]]
          Protection against the failure of an availability zone: [[zone]]
        fr: |
          Service et niveau de messagerie : [[tier]]
          Traitement d'une déclaration comme une seule unité de travail : [[atomic]]
          Protection contre la panne d'une zone de disponibilité : [[zone]]
      slots:
        - id: tier
          options:
            - { id: storage, text: { en: "Azure Queue Storage", fr: "Stockage File d'attente Azure" } }
            - { id: basic, text: { en: "Service Bus Basic", fr: "Service Bus Basic" } }
            - { id: standard, text: { en: "Service Bus Standard", fr: "Service Bus Standard" } }
            - { id: premium, text: { en: "Service Bus Premium", fr: "Service Bus Premium" } }
        - id: atomic
          options:
            - { id: txn, text: { en: "a transaction", fr: "une transaction" } }
            - { id: session, text: { en: "a session for each claim", fr: "une session pour chaque déclaration" } }
            - { id: dupdetect, text: { en: "duplicate detection", fr: "la détection des doublons" } }
            - { id: topic, text: { en: "a topic with two subscriptions", fr: "une rubrique avec deux abonnements" } }
        - id: zone
          options:
            - { id: none, text: { en: "no additional configuration", fr: "aucune configuration supplémentaire" } }
            - { id: upgrade, text: { en: "an upgrade of the namespace to a higher tier", fr: "une mise à niveau de l'espace de noms vers un niveau supérieur" } }
            - { id: geodr, text: { en: "Geo-Disaster Recovery to North Europe", fr: "Geo-Disaster Recovery vers Europe Nord" } }
            - { id: partition, text: { en: "partitioning of the queues", fr: "le partitionnement des files d'attente" } }
    answer:
      values: { tier: standard, atomic: txn, zone: none }
    explanation:
      correct:
        en: |
          Messages of 180 KB exceed the 64 KB limit of Queue Storage, and Service Bus Basic doesn't support transactions, so Standard is the cheapest option. A transaction groups the completion of the received message and the two sends, so that they all succeed or all fail. Every Service Bus tier is zone redundant at no extra cost in a region that has availability zones, so nothing more is needed.
        fr: |
          Des messages de 180 Ko dépassent la limite de 64 Ko de Stockage File d'attente, et Service Bus Basic ne prend pas en charge les transactions : Standard est donc l'option la moins chère. Une transaction regroupe la fin du message reçu et les deux envois, pour qu'ils réussissent tous ou échouent tous. Tous les niveaux de Service Bus sont redondants interzones sans coût supplémentaire dans une région qui dispose de zones de disponibilité : rien de plus n'est nécessaire.
      options:
        basic: { en: "The Basic tier supports queues but not transactions.", fr: "Le niveau Basic prend en charge les files d'attente, mais pas les transactions." }
        premium: { en: "Premium meets the requirements, but no Premium feature is required, so it costs more than needed.", fr: "Premium répond aux exigences, mais aucune fonctionnalité Premium n'est exigée : il coûte donc plus cher que nécessaire." }
        session: { en: "Sessions order and group related messages for one receiver; they don't make several operations atomic.", fr: "Les sessions ordonnent et regroupent des messages liés pour un récepteur ; elles ne rendent pas plusieurs opérations atomiques." }
        dupdetect: { en: "Duplicate detection discards a message sent twice; it doesn't tie the completion and the sends together.", fr: "La détection des doublons écarte un message envoyé deux fois ; elle ne lie pas la fin du message et les envois." }
        topic: { en: "A topic would replace the two sends with one, but the completion of the claim and the send would still be separate operations.", fr: "Une rubrique remplacerait les deux envois par un seul, mais la fin du message de la déclaration et l'envoi resteraient des opérations distinctes." }
        upgrade: { en: "Zone redundancy isn't a Premium feature: Basic, Standard and Premium namespaces are all zone redundant.", fr: "La redondance interzone n'est pas une fonctionnalité Premium : les espaces de noms Basic, Standard et Premium sont tous redondants interzones." }
        geodr: { en: "Geo-Disaster Recovery protects against a regional outage, requires Premium and replicates only metadata.", fr: "Geo-Disaster Recovery protège contre une panne régionale, exige Premium et ne réplique que les métadonnées." }
    references:
      - title: Transactions in Azure Service Bus - Azure Service Bus
        url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-transactions
      - title: Reliability in Azure Service Bus
        url: https://learn.microsoft.com/en-us/azure/reliability/reliability-service-bus
