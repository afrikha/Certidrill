chapter: 41-compute
questions:
  # ------------------------------------------------------------------ 1
  - id: az305-qz-41-01
    objective: "4.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso hosts a reporting web app on one instance of an App Service plan in the Standard tier. The number of users is stable, but each report loads a large dataset into memory, and the app fails with out-of-memory errors.

        You need to give each instance of the app more memory.

        What should you do?
      fr: |
        Contoso héberge une application web de création de rapports sur une instance d'un plan App Service du niveau Standard. Le nombre d'utilisateurs est stable, mais chaque rapport charge un grand jeu de données en mémoire, et l'application échoue avec des erreurs de mémoire insuffisante.

        Vous devez donner davantage de mémoire à chaque instance de l'application.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Scale out the App Service plan to three instances of the current size.", fr: "Effectuer un scale-out du plan App Service vers trois instances de la taille actuelle." } }
        - { id: b, text: { en: "Add an autoscale rule that adds an instance when memory usage exceeds 80 percent.", fr: "Ajouter une règle de mise à l'échelle automatique qui ajoute une instance quand l'utilisation de la mémoire dépasse 80 %." } }
        - { id: c, text: { en: "Scale up the App Service plan to a pricing tier whose instances have more memory.", fr: "Effectuer un scale-up du plan App Service vers un niveau tarifaire dont les instances ont plus de mémoire." } }
        - { id: d, text: { en: "Add a deployment slot so that the reports run in a separate slot of the app.", fr: "Ajouter un emplacement de déploiement pour que les rapports s'exécutent dans un emplacement distinct de l'application." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Scaling up changes the pricing tier of the App Service plan, which gives each instance more CPU, memory or disk space. The problem is the size of one instance, not the number of users, so only a larger instance lets a report hold its dataset in memory.
        fr: |
          Le scale-up change le niveau tarifaire du plan App Service, ce qui donne à chaque instance plus de processeur, de mémoire ou d'espace disque. Le problème vient de la taille d'une instance, pas du nombre d'utilisateurs : seule une instance plus grande permet à un rapport de garder son jeu de données en mémoire.
      options:
        a: { en: "Scaling out adds instances of the same size: each instance keeps the same amount of memory, so a large report still fails.", fr: "Le scale-out ajoute des instances de même taille : chaque instance garde la même quantité de mémoire, et un rapport volumineux échoue toujours." }
        b: { en: "An autoscale rule also scales out: it adds instances that have the same memory as the current one.", fr: "Une règle de mise à l'échelle automatique effectue elle aussi un scale-out : elle ajoute des instances qui ont la même mémoire que l'instance actuelle." }
        d: { en: "Deployment slots run on the instances of the same plan; they are used to stage and swap versions, not to add memory.", fr: "Les emplacements de déploiement s'exécutent sur les instances du même plan ; ils servent à préparer et permuter des versions, pas à ajouter de la mémoire." }
    references:
      - title: Scale Up Features and Capacities - Azure App Service
        url: https://learn.microsoft.com/en-us/azure/app-service/manage-scale-up

  # ------------------------------------------------------------------ 2
  - id: az305-qz-41-02
    objective: "4.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank plans to run a risk engine on an Azure virtual machine. A regulator requires that the data of the engine stay protected while it is being processed, including against privileged access by the operators of the host. The engine needs a large amount of memory per vCPU.

        Which virtual machine option should you recommend?
      fr: |
        Woodgrove Bank prévoit d'exécuter un moteur de calcul des risques sur une machine virtuelle Azure. Un régulateur exige que les données du moteur restent protégées pendant leur traitement, y compris contre un accès privilégié des opérateurs de l'hôte. Le moteur a besoin de beaucoup de mémoire par processeur virtuel.

        Quelle option de machine virtuelle devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "A D-series virtual machine with encryption at host enabled", fr: "Une machine virtuelle de la série D avec le chiffrement sur l'hôte activé" } }
        - { id: b, text: { en: "An M-series virtual machine whose disks use customer-managed keys", fr: "Une machine virtuelle de la série M dont les disques utilisent des clés gérées par le client" } }
        - { id: c, text: { en: "An L-series virtual machine that keeps its data on local NVMe disks", fr: "Une machine virtuelle de la série L qui garde ses données sur des disques NVMe locaux" } }
        - { id: d, text: { en: "An ECasv5-series virtual machine deployed as a confidential VM", fr: "Une machine virtuelle de la série ECasv5 déployée comme machine virtuelle confidentielle" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Confidential computing protects data in use: the DC and EC families run the virtual machine in a hardware-based trusted execution environment whose memory is protected against privileged access. ECasv5 is the memory-optimized confidential series, so it also meets the memory requirement.
        fr: |
          L'informatique confidentielle protège les données en cours d'utilisation : les familles DC et EC exécutent la machine virtuelle dans un environnement d'exécution approuvé (TEE) basé sur le matériel, dont la mémoire est protégée contre l'accès privilégié. ECasv5 est la série confidentielle optimisée pour la mémoire ; elle répond donc aussi à l'exigence de mémoire.
      options:
        a: { en: "Encryption at host protects data at rest and on its way to storage, not data that is being processed in memory.", fr: "Le chiffrement sur l'hôte protège les données au repos et pendant leur transfert vers le stockage, pas les données en cours de traitement en mémoire." }
        b: { en: "The M series has the memory, but customer-managed keys only encrypt the disks at rest.", fr: "La série M a la mémoire nécessaire, mais les clés gérées par le client ne chiffrent que les disques au repos." }
        c: { en: "The L series is optimized for local disk throughput and doesn't protect data in use.", fr: "La série L est optimisée pour le débit des disques locaux et ne protège pas les données en cours d'utilisation." }
    references:
      - title: Azure Confidential Computing Products
        url: https://learn.microsoft.com/en-us/azure/confidential-computing/overview-azure-products

  # ------------------------------------------------------------------ 3
  - id: az305-qz-41-03
    objective: "4.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The accounting department of Fabrikam wants to automate an approval process. When a document is added to a SharePoint library, a manager approves or rejects it, and the result is posted in a Microsoft Teams channel.

        You need to recommend a solution. The solution must meet the following requirements:

        - The accountants build and maintain the workflow themselves in a visual designer, without writing code.
        - The accountants have Microsoft 365 licenses but no access to the Azure subscriptions of Fabrikam, and the IT department must not be involved.

        What should you recommend?
      fr: |
        Le service comptable de Fabrikam souhaite automatiser un processus d'approbation. Quand un document est ajouté à une bibliothèque SharePoint, un responsable l'approuve ou le rejette, et le résultat est publié dans un canal Microsoft Teams.

        Vous devez recommander une solution. La solution doit répondre aux exigences suivantes :

        - Les comptables créent et maintiennent eux-mêmes le workflow dans un concepteur visuel, sans écrire de code.
        - Les comptables disposent de licences Microsoft 365 mais d'aucun accès aux abonnements Azure de Fabrikam, et le service informatique ne doit pas intervenir.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "A Consumption workflow in Azure Logic Apps", fr: "Un workflow Consumption dans Azure Logic Apps" } }
        - { id: b, text: { en: "A cloud flow in Power Automate", fr: "Un flux cloud dans Power Automate" } }
        - { id: c, text: { en: "An orchestration in Durable Functions", fr: "Une orchestration dans Durable Functions" } }
        - { id: d, text: { en: "A runbook in Azure Automation", fr: "Un runbook dans Azure Automation" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Power Automate is the designer-first platform for business users and citizen developers who build their own integrations without IT or developers, typically an approval workflow on a SharePoint library. It runs with Microsoft 365 connectors and needs no Azure resource.
        fr: |
          Power Automate est la plateforme orientée concepteur destinée aux utilisateurs métier et aux développeurs citoyens qui créent leurs propres intégrations sans le service informatique ni des développeurs, typiquement un workflow d'approbation sur une bibliothèque SharePoint. Il s'exécute avec des connecteurs Microsoft 365 et ne nécessite aucune ressource Azure.
      options:
        a: { en: "A logic app is an Azure resource deployed and governed in a subscription, which the accountants can't access without IT.", fr: "Une application logique est une ressource Azure déployée et gouvernée dans un abonnement, auquel les comptables n'ont pas accès sans le service informatique." }
        c: { en: "Durable Functions orchestrations are written in code by developers and are deployed to Azure.", fr: "Les orchestrations Durable Functions sont écrites en code par des développeurs et déployées dans Azure." }
        d: { en: "Azure Automation runbooks are scripts that run in an Azure Automation account, managed by IT.", fr: "Les runbooks Azure Automation sont des scripts qui s'exécutent dans un compte Automation Azure, géré par le service informatique." }
    references:
      - title: Integration and Automation Platform Options in Azure
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-compare-logic-apps-ms-flow-webjobs

  # ------------------------------------------------------------------ 4
  - id: az305-qz-41-04
    objective: "4.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware plans an Azure Container Registry instance for the production images of its Azure Kubernetes Service (AKS) clusters, which all run in the West Europe region.

        You need to recommend a registry configuration. The solution must meet the following requirements:

        - The images must be encrypted at rest with a key that the security team stores and rotates in Azure Key Vault.
        - The clusters pull the images through the public endpoint of the registry, and no replica in another region is needed.
        - Minimize cost.

        What should you recommend?
      fr: |
        Litware prévoit une instance Azure Container Registry pour les images de production de ses clusters Azure Kubernetes Service (AKS), qui s'exécutent tous dans la région Europe Ouest.

        Vous devez recommander une configuration du registre. La solution doit répondre aux exigences suivantes :

        - Les images doivent être chiffrées au repos avec une clé que l'équipe de sécurité stocke et renouvelle dans Azure Key Vault.
        - Les clusters tirent les images par le point de terminaison public du registre, et aucun réplica dans une autre région n'est nécessaire.
        - Réduire les coûts au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "The Basic tier, with encryption by a customer-managed key", fr: "Le niveau Basic, avec un chiffrement par une clé gérée par le client" } }
        - { id: b, text: { en: "The Standard tier, with encryption by a customer-managed key", fr: "Le niveau Standard, avec un chiffrement par une clé gérée par le client" } }
        - { id: c, text: { en: "The Standard tier, with encryption by Microsoft-managed keys", fr: "Le niveau Standard, avec un chiffrement par des clés gérées par Microsoft" } }
        - { id: d, text: { en: "The Premium tier, with encryption by a customer-managed key", fr: "Le niveau Premium, avec un chiffrement par une clé gérée par le client" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Customer-managed keys are a Premium feature of Azure Container Registry, like geo-replication, private endpoints and connected registries. Even though the registry needs neither replicas nor a private endpoint, the key requirement alone makes Premium the cheapest tier that meets it.
        fr: |
          Les clés gérées par le client sont une fonctionnalité Premium d'Azure Container Registry, comme la géoréplication, les points de terminaison privés et les registres connectés. Même si le registre n'a besoin ni de réplicas ni de point de terminaison privé, l'exigence de clé suffit à faire de Premium le niveau le moins cher qui y répond.
      options:
        a: { en: "The Basic tier doesn't support customer-managed keys; its content is encrypted with Microsoft-managed keys only.", fr: "Le niveau Basic ne prend pas en charge les clés gérées par le client ; son contenu est chiffré uniquement avec des clés gérées par Microsoft." }
        b: { en: "The Standard tier doesn't support customer-managed keys either: they require Premium.", fr: "Le niveau Standard ne prend pas non plus en charge les clés gérées par le client : elles exigent Premium." }
        c: { en: "Microsoft-managed keys don't let the security team store and rotate the key in its own vault.", fr: "Les clés gérées par Microsoft ne permettent pas à l'équipe de sécurité de stocker et de renouveler la clé dans son propre coffre." }
    references:
      - title: Azure Container Registry SKU Features and Limits - Azure Container Registry
        url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-skus

  # ------------------------------------------------------------------ 5
  - id: az305-qz-41-05
    objective: "4.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys runs a nightly load test on 300 Azure Spot Virtual Machines that are created from an image. The virtual machines are stateless: after an eviction, nothing on them needs to be kept, and the test harness creates new virtual machines when it needs more capacity.

        You need to recommend a configuration for the virtual machines. The solution must meet the following requirements:

        - Minimize cost, including after evictions.
        - Evicted virtual machines must not count against the vCPU quota of the subscription.

        What should you recommend?
      fr: |
        Tailspin Toys exécute chaque nuit un test de charge sur 300 machines virtuelles Azure Spot créées à partir d'une image. Les machines virtuelles sont sans état : après une éviction, rien ne doit être conservé sur elles, et l'outil de test crée de nouvelles machines virtuelles quand il a besoin de plus de capacité.

        Vous devez recommander une configuration des machines virtuelles. La solution doit répondre aux exigences suivantes :

        - Réduire les coûts au minimum, y compris après les évictions.
        - Les machines virtuelles évincées ne doivent pas être décomptées du quota de processeurs virtuels de l'abonnement.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "The Deallocate eviction policy, with a maximum price of -1", fr: "La stratégie d'éviction Deallocate, avec un prix maximal de -1" } }
        - { id: b, text: { en: "The Deallocate eviction policy, with a maximum price below the pay-as-you-go price", fr: "La stratégie d'éviction Deallocate, avec un prix maximal inférieur au prix du paiement à l'utilisation" } }
        - { id: c, text: { en: "The Delete eviction policy, with a maximum price of -1", fr: "La stratégie d'éviction Delete, avec un prix maximal de -1" } }
        - { id: d, text: { en: "Pay-as-you-go virtual machines instead of Spot, with an auto-shutdown schedule", fr: "Des machines virtuelles en paiement à l'utilisation au lieu de Spot, avec une planification d'arrêt automatique" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          With the Delete eviction policy, an evicted virtual machine and its disks are deleted, so storage charges stop and nothing remains to count against the quota. A maximum price of -1 means the virtual machines are never evicted for price and are never charged more than the pay-as-you-go price.
        fr: |
          Avec la stratégie d'éviction Delete, une machine virtuelle évincée et ses disques sont supprimés : les frais de stockage s'arrêtent et rien ne reste décompté du quota. Un prix maximal de -1 signifie que les machines virtuelles ne sont jamais évincées pour le prix et ne sont jamais facturées plus que le prix du paiement à l'utilisation.
      options:
        a: { en: "With Deallocate, the evicted virtual machines keep their disks, which are still billed, and they still count against the quota.", fr: "Avec Deallocate, les machines virtuelles évincées gardent leurs disques, toujours facturés, et restent décomptées du quota." }
        b: { en: "The maximum price only changes when price evictions happen; Deallocate still keeps billed disks and consumes quota.", fr: "Le prix maximal ne change que le moment des évictions pour le prix ; Deallocate conserve toujours des disques facturés et consomme du quota." }
        d: { en: "Pay-as-you-go virtual machines cost much more than Spot for an interruptible, stateless test.", fr: "Des machines virtuelles en paiement à l'utilisation coûtent bien plus cher que Spot pour un test sans état et interruptible." }
    references:
      - title: About Azure Spot Virtual Machines - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/spot-vms

  # ------------------------------------------------------------------ 6
  - id: az305-qz-41-06
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware is reviewing the pricing of four Azure workloads:

        - **Workload1**: 40 Linux virtual machines of the Dsv5 series in the West Europe region. They run continuously, and their size and region won't change for the next three years.
        - **Workload2**: a stable hourly spend on Azure virtual machines, App Service plans in the Premium v3 tier and Azure Container Apps, spread across four regions. The sizes and regions of these resources will change several times during the next three years.
        - **Workload3**: two Linux virtual machines that run continuously for six weeks during a data migration and are then deleted. They can't be interrupted.
        - **Workload4**: eight Windows Server virtual machines that run continuously for three months during a datacenter exit and are then deleted. They can't be interrupted. Litware owns Windows Server licenses with active Software Assurance that are no longer used on-premises.

        Litware won't make any commitment that lasts longer than the workload it covers.

        You need to recommend the pricing option that minimizes the cost of each workload.

        Which option should you recommend for each workload? To answer, drag the appropriate options to the correct workloads. Each option may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware examine la tarification de quatre charges de travail Azure :

        - **Workload1** : 40 machines virtuelles Linux de la série Dsv5 dans la région Europe Ouest. Elles s'exécutent en continu, et leur taille comme leur région ne changeront pas pendant les trois prochaines années.
        - **Workload2** : une dépense horaire stable sur des machines virtuelles Azure, des plans App Service du niveau Premium v3 et Azure Container Apps, répartie sur quatre régions. Les tailles et les régions de ces ressources changeront plusieurs fois pendant les trois prochaines années.
        - **Workload3** : deux machines virtuelles Linux qui s'exécutent en continu pendant six semaines lors d'une migration de données, puis sont supprimées. Elles ne peuvent pas être interrompues.
        - **Workload4** : huit machines virtuelles Windows Server qui s'exécutent en continu pendant trois mois lors de la sortie d'un centre de données, puis sont supprimées. Elles ne peuvent pas être interrompues. Litware possède des licences Windows Server avec une Software Assurance active qui ne sont plus utilisées en local.

        Litware ne prendra aucun engagement plus long que la charge de travail qu'il couvre.

        Vous devez recommander l'option de tarification qui réduit au minimum le coût de chaque charge de travail.

        Quelle option devez-vous recommander pour chaque charge de travail ? Pour répondre, faites glisser les options appropriées vers les charges de travail correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: ri, text: { en: "Three-year reserved virtual machine instances", fr: "Instances de machines virtuelles réservées sur trois ans" } }
        - { id: sp, text: { en: "Three-year Azure savings plan for compute", fr: "Plan d'économies Azure pour le calcul sur trois ans" } }
        - { id: ahb, text: { en: "Azure Hybrid Benefit", fr: "Azure Hybrid Benefit" } }
        - { id: payg, text: { en: "Pay-as-you-go pricing only", fr: "Paiement à l'utilisation uniquement" } }
        - { id: spot, text: { en: "Azure Spot Virtual Machines", fr: "Machines virtuelles Azure Spot" } }
        - { id: host, text: { en: "Azure Dedicated Host", fr: "Azure Dedicated Host" } }
      targets:
        - { id: w1, text: Workload1 }
        - { id: w2, text: Workload2 }
        - { id: w3, text: Workload3 }
        - { id: w4, text: Workload4 }
    answer:
      mapping: { w1: ri, w2: sp, w3: payg, w4: ahb }
    explanation:
      correct:
        en: |
          Reservations give the greatest savings for stable workloads whose size family and region don't change. A savings plan commits to an hourly spend that applies across eligible compute services and regions, so it follows the changes of Workload2. A six-week Linux workload can't justify a one-year commitment and can't be interrupted, so pay-as-you-go is the cheapest option. For Workload4, Azure Hybrid Benefit removes the Windows Server license cost from the pay-as-you-go price without any commitment.
        fr: |
          Les réservations offrent les économies les plus importantes pour des charges stables dont la famille de tailles et la région ne changent pas. Un plan d'économies engage une dépense horaire qui s'applique à tous les services de calcul et régions éligibles ; il suit donc les changements de Workload2. Une charge Linux de six semaines ne justifie pas un engagement d'un an et ne peut pas être interrompue : le paiement à l'utilisation est l'option la moins chère. Pour Workload4, Azure Hybrid Benefit retire le coût de licence Windows Server du prix du paiement à l'utilisation, sans aucun engagement.
      options:
        spot: { en: "Spot virtual machines can be evicted at any time with no SLA, and none of the workloads tolerates interruptions.", fr: "Les machines virtuelles Spot peuvent être évincées à tout moment, sans SLA, et aucune des charges de travail ne tolère d'interruption." }
        host: { en: "Dedicated Host is billed per physical host and answers isolation requirements; it doesn't reduce the cost of these workloads.", fr: "Dedicated Host est facturé par hôte physique et répond à des exigences d'isolation ; il ne réduit pas le coût de ces charges de travail." }
        payg: { en: "For Workload4, pay-as-you-go without Azure Hybrid Benefit still charges for Windows Server licenses that Litware already owns.", fr: "Pour Workload4, le paiement à l'utilisation sans Azure Hybrid Benefit facture toujours des licences Windows Server que Litware possède déjà." }
    references:
      - title: Decide between a savings plan and a reservation - Microsoft Cost Management
        url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
      - title: What are savings plans? - Microsoft Cost Management
        url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/savings-plan-compute-overview

  # ------------------------------------------------------------------ 7
  - id: az305-qz-41-07
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Adatum plans to host an internal expense web app in Azure App Service. Employees reach Azure through a virtual network named VNet1, which is connected to the offices through ExpressRoute. The app reads from an Azure SQL database that is reachable only through a private endpoint in VNet1.

        You need to recommend a hosting configuration. The solution must meet the following requirements:

        - The app must be reachable only on a private IP address in VNet1.
        - The app must reach the database through VNet1.
        - The plan must scale out automatically between two and six instances based on CPU usage.
        - Minimize cost.

        What should you recommend? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum prévoit d'héberger une application web interne de notes de frais dans Azure App Service. Les employés accèdent à Azure par un réseau virtuel nommé VNet1, relié aux bureaux par ExpressRoute. L'application lit une base de données Azure SQL joignable uniquement par un point de terminaison privé dans VNet1.

        Vous devez recommander une configuration d'hébergement. La solution doit répondre aux exigences suivantes :

        - L'application doit être joignable uniquement sur une adresse IP privée dans VNet1.
        - L'application doit atteindre la base de données via VNet1.
        - Le plan doit effectuer un scale-out automatique entre deux et six instances en fonction de l'utilisation du processeur.
        - Réduire les coûts au minimum.

        Que devez-vous recommander ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Pricing tier of the App Service plan: [[tier]]
          Inbound access from VNet1: [[inbound]]
          Outbound access to the database: [[outbound]]
        fr: |
          Niveau tarifaire du plan App Service : [[tier]]
          Accès entrant depuis VNet1 : [[inbound]]
          Accès sortant vers la base de données : [[outbound]]
      slots:
        - id: tier
          options:
            - { id: basic, text: Basic }
            - { id: standard, text: Standard }
            - { id: p3, text: Premium v3 }
            - { id: i2, text: Isolated v2 }
        - id: inbound
          options:
            - { id: pe, text: { en: "a private endpoint for the app, with public network access disabled", fr: "un point de terminaison privé pour l'application, avec l'accès au réseau public désactivé" } }
            - { id: vnetint, text: { en: "virtual network integration of the app", fr: "l'intégration de l'application au réseau virtuel" } }
            - { id: restrict, text: { en: "access restrictions that allow only a service endpoint of VNet1", fr: "des restrictions d'accès qui n'autorisent qu'un point de terminaison de service de VNet1" } }
        - id: outbound
          options:
            - { id: vnetint, text: { en: "virtual network integration of the app", fr: "l'intégration de l'application au réseau virtuel" } }
            - { id: pe, text: { en: "a private endpoint for the app", fr: "un point de terminaison privé pour l'application" } }
            - { id: hybrid, text: { en: "Hybrid Connections", fr: "Connexions hybrides" } }
    answer:
      values: { tier: standard, inbound: pe, outbound: vnetint }
    explanation:
      correct:
        en: |
          Standard is the lowest tier with autoscale, up to 10 instances, and it supports both private endpoints and virtual network integration. A private endpoint carries only inbound traffic to the app, on a private IP address of VNet1, and public network access must be disabled to remove the public exposure. Outbound calls to the database go through virtual network integration, which doesn't give inbound private access.
        fr: |
          Standard est le niveau le plus bas qui offre la mise à l'échelle automatique, jusqu'à 10 instances, et il prend en charge à la fois les points de terminaison privés et l'intégration au réseau virtuel. Un point de terminaison privé ne transporte que le trafic entrant vers l'application, sur une adresse IP privée de VNet1, et l'accès au réseau public doit être désactivé pour supprimer l'exposition publique. Les appels sortants vers la base de données passent par l'intégration au réseau virtuel, qui ne donne pas d'accès entrant privé.
      options:
        basic: { en: "Basic supports private endpoints and virtual network integration but scales out only manually, to three instances.", fr: "Basic prend en charge les points de terminaison privés et l'intégration au réseau virtuel, mais son scale-out est uniquement manuel, jusqu'à trois instances." }
        p3: { en: "Premium v3 meets the requirements but costs more than Standard, and no Premium feature is required.", fr: "Premium v3 répond aux exigences mais coûte plus cher que Standard, et aucune fonctionnalité Premium n'est exigée." }
        i2: { en: "Isolated v2 runs in an App Service Environment, which is single-tenant and much more expensive than needed.", fr: "Isolated v2 s'exécute dans un App Service Environment, monolocataire et bien plus cher que nécessaire." }
        restrict: { en: "Access restrictions filter traffic, but the app keeps its public address instead of a private IP address in VNet1.", fr: "Les restrictions d'accès filtrent le trafic, mais l'application garde son adresse publique au lieu d'une adresse IP privée dans VNet1." }
        hybrid: { en: "Hybrid Connections reach a host and port through a relay agent; they don't route the app's traffic through VNet1.", fr: "Les connexions hybrides atteignent un hôte et un port via un agent de relais ; elles ne font pas passer le trafic de l'application par VNet1." }
    references:
      - title: Use Private Endpoints for Apps - Azure App Service
        url: https://learn.microsoft.com/en-us/azure/app-service/overview-private-endpoint
      - title: Integrate your app with an Azure virtual network - Azure App Service
        url: https://learn.microsoft.com/en-us/azure/app-service/overview-vnet-integration

  # ------------------------------------------------------------------ 8
  - id: az305-qz-41-08
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys is containerizing an internal HR API that runs on Linux. Employees use the API only during business hours, and it receives no requests at night or on weekends. At 09:00, the load rises to about 40 times its daily average within a few minutes.

        You need to recommend a hosting solution. The solution must meet the following requirements:

        - The API must be reachable only from a virtual network of Wingtip Toys, on a private IP address.
        - Replicas must be added automatically based on the number of concurrent HTTP requests.
        - The operations team must not manage a cluster, nodes or Kubernetes upgrades.
        - No compute charges must be incurred while the API receives no requests.

        What should you recommend?
      fr: |
        Wingtip Toys conteneurise une API RH interne qui s'exécute sous Linux. Les employés n'utilisent l'API que pendant les heures de bureau, et elle ne reçoit aucune requête la nuit ni le week-end. À 9 h, la charge monte à environ 40 fois sa moyenne quotidienne en quelques minutes.

        Vous devez recommander une solution d'hébergement. La solution doit répondre aux exigences suivantes :

        - L'API doit être joignable uniquement depuis un réseau virtuel de Wingtip Toys, sur une adresse IP privée.
        - Des réplicas doivent être ajoutés automatiquement en fonction du nombre de requêtes HTTP simultanées.
        - L'équipe d'exploitation ne doit gérer ni cluster, ni nœuds, ni mises à niveau de Kubernetes.
        - Aucun coût de calcul ne doit être engagé tant que l'API ne reçoit aucune requête.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Azure App Service in the Premium v3 tier, with a private endpoint and autoscale rules", fr: "Azure App Service au niveau Premium v3, avec un point de terminaison privé et des règles de mise à l'échelle automatique" } }
        - { id: b, text: { en: "Azure Container Apps, in an internal environment that is integrated with the virtual network", fr: "Azure Container Apps, dans un environnement interne intégré au réseau virtuel" } }
        - { id: c, text: { en: "Azure Container Instances container groups, deployed in a subnet of the virtual network", fr: "Des groupes de conteneurs Azure Container Instances, déployés dans un sous-réseau du réseau virtuel" } }
        - { id: d, text: { en: "An AKS Automatic private cluster, with KEDA scaling the pods on HTTP requests", fr: "Un cluster privé AKS Automatic, avec KEDA qui met à l'échelle les pods selon les requêtes HTTP" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Container Apps scales replicas on concurrent HTTP requests and down to zero, with no cluster or node to manage. An internal environment has no public endpoint: its virtual IP is mapped to a private IP address of the virtual network. In the Consumption plan, a revision scaled to zero replicas incurs no resource consumption charges.
        fr: |
          Container Apps met à l'échelle les réplicas selon les requêtes HTTP simultanées et jusqu'à zéro, sans cluster ni nœud à gérer. Un environnement interne n'a aucun point de terminaison public : son adresse IP virtuelle correspond à une adresse IP privée du réseau virtuel. Dans le plan Consumption, une révision mise à l'échelle à zéro réplica n'engage aucun coût de consommation de ressources.
      options:
        a: { en: "A Premium v3 plan keeps at least one billed instance at all times: App Service doesn't scale to zero.", fr: "Un plan Premium v3 garde en permanence au moins une instance facturée : App Service ne se met pas à l'échelle à zéro." }
        c: { en: "Container Instances has no autoscale and no load balancing: each additional instance is a separate deployment.", fr: "Container Instances n'a ni mise à l'échelle automatique ni équilibrage de charge : chaque instance supplémentaire est un déploiement distinct." }
        d: { en: "AKS Automatic still is a cluster that the team owns and operates, and its system nodes are billed even when no pod of the API runs.", fr: "AKS Automatic reste un cluster que l'équipe possède et exploite, et ses nœuds système sont facturés même quand aucun pod de l'API ne s'exécute." }
    references:
      - title: Networking in an Azure Container Apps Environment
        url: https://learn.microsoft.com/en-us/azure/container-apps/networking
      - title: Billing in Azure Container Apps
        url: https://learn.microsoft.com/en-us/azure/container-apps/billing

  # ------------------------------------------------------------------ 9
  - id: az305-qz-41-09
    objective: "4.1.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware receives about 20,000 scanned invoices in a blob container every night; all of them are in the container by 01:00. The developers are writing a Python solution in Azure Functions that must meet the following requirements:

        - The data of every invoice is extracted in parallel, and then one summary report is produced after all the invoices are processed.
        - If the host restarts during a run, the invoices that are already processed aren't processed again.
        - The function app reaches the storage account and an Azure SQL database only through private endpoints in a virtual network.
        - No compute charges are incurred between the nightly runs, and the cost is minimized.

        How should you complete the recommendation? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware reçoit chaque nuit environ 20 000 factures numérisées dans un conteneur d'objets blob ; toutes sont dans le conteneur à 1 h. Les développeurs écrivent en Python une solution Azure Functions qui doit répondre aux exigences suivantes :

        - Les données de chaque facture sont extraites en parallèle, puis un rapport de synthèse unique est produit une fois toutes les factures traitées.
        - Si l'hôte redémarre pendant une exécution, les factures déjà traitées ne sont pas traitées de nouveau.
        - L'application de fonction atteint le compte de stockage et une base de données Azure SQL uniquement par des points de terminaison privés dans un réseau virtuel.
        - Aucun coût de calcul n'est engagé entre les exécutions nocturnes, et le coût est réduit au minimum.

        Comment devez-vous compléter la recommandation ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Hosting plan: [[plan]]
          Start of the processing: [[start]]
          Durable Functions application pattern: [[pattern]]
        fr: |
          Plan d'hébergement : [[plan]]
          Démarrage du traitement : [[start]]
          Modèle d'application Durable Functions : [[pattern]]
      slots:
        - id: plan
          options:
            - { id: cons, text: { en: "Consumption plan", fr: "Plan Consumption" } }
            - { id: flex, text: { en: "Flex Consumption plan", fr: "Plan Flex Consumption" } }
            - { id: prem, text: { en: "Premium plan", fr: "Plan Premium" } }
            - { id: dedic, text: { en: "Dedicated (App Service) plan", fr: "Plan Dedicated (App Service)" } }
        - id: start
          options:
            - { id: timer, text: { en: "a timer-triggered function that starts one orchestration at 01:00", fr: "une fonction déclenchée par minuteur qui démarre une orchestration à 1 h" } }
            - { id: blob, text: { en: "a blob-triggered function that starts one orchestration per invoice", fr: "une fonction déclenchée par objet blob qui démarre une orchestration par facture" } }
            - { id: http, text: { en: "an HTTP-triggered function that processes the invoices before it responds", fr: "une fonction déclenchée par HTTP qui traite les factures avant de répondre" } }
        - id: pattern
          options:
            - { id: chain, text: { en: "Function chaining", fr: "Chaînage de fonctions" } }
            - { id: fan, text: { en: "Fan-out/fan-in", fr: "Fan-out/fan-in" } }
            - { id: human, text: { en: "Human interaction", fr: "Interaction humaine" } }
            - { id: monitor, text: { en: "Monitor", fr: "Surveillance" } }
    answer:
      values: { plan: flex, start: timer, pattern: fan }
    explanation:
      correct:
        en: |
          Flex Consumption is the only plan that combines virtual network integration with scaling to zero and execution-based billing, and it supports Python and Durable Functions. A timer trigger starts one orchestration per night, which fans out one activity per invoice, waits for all of them, then fans in to build the report. Completed activity results are checkpointed, so a restart doesn't redo the finished invoices.
        fr: |
          Flex Consumption est le seul plan qui combine l'intégration au réseau virtuel, la mise à l'échelle à zéro et la facturation à l'exécution, et il prend en charge Python et Durable Functions. Un déclencheur de minuteur démarre une orchestration par nuit, qui déploie (fan-out) une activité par facture, les attend toutes, puis les regroupe (fan-in) pour produire le rapport. Les résultats des activités terminées sont enregistrés par point de contrôle : un redémarrage ne refait pas les factures terminées.
      options:
        cons: { en: "The legacy Consumption plan has no virtual network integration and can't reach private endpoints.", fr: "Le plan Consumption hérité n'a pas d'intégration au réseau virtuel et ne peut pas atteindre de points de terminaison privés." }
        prem: { en: "The Premium plan always bills at least one warm instance, also between the nightly runs.", fr: "Le plan Premium facture toujours au moins une instance chaude, y compris entre les exécutions nocturnes." }
        dedic: { en: "A Dedicated plan bills its instances continuously, whatever the number of executions.", fr: "Un plan Dedicated facture ses instances en continu, quel que soit le nombre d'exécutions." }
        blob: { en: "One orchestration per invoice runs 20,000 independent instances, with no single point where all the results are aggregated.", fr: "Une orchestration par facture exécute 20 000 instances indépendantes, sans point unique où tous les résultats sont regroupés." }
        http: { en: "An HTTP-triggered function must respond within 230 seconds, far less than the processing of 20,000 invoices.", fr: "Une fonction déclenchée par HTTP doit répondre en 230 secondes, bien moins que le traitement de 20 000 factures." }
        chain: { en: "Function chaining runs the steps one after the other, not the invoices in parallel.", fr: "Le chaînage de fonctions exécute les étapes l'une après l'autre, pas les factures en parallèle." }
    references:
      - title: Azure Functions Scale and Hosting
        url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
      - title: Fan-Out/Fan-In Pattern Scenarios in Durable Functions
        url: https://learn.microsoft.com/en-us/azure/azure-functions/durable/durable-functions-cloud-backup

  # ------------------------------------------------------------------ 10
  - id: az305-qz-41-10
    objective: "4.1.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam runs computational fluid dynamics (CFD) simulations on an on-premises cluster managed by Slurm. Each simulation is a tightly coupled MPI job that spans 64 nodes for about 30 hours, and the solver has no checkpointing. During design campaigns, the jobs exceed the capacity of the cluster.

        Fabrikam plans to run the campaign jobs in Azure. The solution must meet the following requirements:

        - Engineers keep submitting jobs with their existing Slurm scripts and queues.
        - The nodes of a job communicate over a low-latency RDMA network.
        - All the nodes of a job read and write a shared dataset of several terabytes with high throughput. Between campaigns, the dataset is kept in Azure Blob Storage only.
        - A simulation must not have to be rerun from the beginning because Azure reclaims capacity.
        - Subject to the other requirements, minimize cost.

        Which three elements should you include in the recommendation? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam exécute des simulations de mécanique des fluides numérique (CFD) sur un cluster local géré par Slurm. Chaque simulation est un travail MPI fortement couplé qui s'étend sur 64 nœuds pendant environ 30 heures, et le solveur n'a pas de points de contrôle. Pendant les campagnes de conception, les travaux dépassent la capacité du cluster.

        Fabrikam prévoit d'exécuter les travaux des campagnes dans Azure. La solution doit répondre aux exigences suivantes :

        - Les ingénieurs continuent de soumettre les travaux avec leurs scripts et leurs files d'attente Slurm existants.
        - Les nœuds d'un travail communiquent sur un réseau RDMA à faible latence.
        - Tous les nœuds d'un travail lisent et écrivent un jeu de données partagé de plusieurs téraoctets avec un débit élevé. Entre les campagnes, le jeu de données est conservé uniquement dans le Stockage Blob Azure.
        - Une simulation ne doit pas avoir à être relancée depuis le début parce qu'Azure récupère de la capacité.
        - Sous réserve des autres exigences, réduire les coûts au minimum.

        Quels sont les trois éléments que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "An Azure Batch pool whose tasks run the MPI solver", fr: "Un pool Azure Batch dont les tâches exécutent le solveur MPI" } }
        - { id: b, text: { en: "Azure CycleCloud, with a Slurm cluster that autoscales its nodes", fr: "Azure CycleCloud, avec un cluster Slurm qui met à l'échelle ses nœuds automatiquement" } }
        - { id: c, text: { en: "HB-series nodes with Spot priority", fr: "Des nœuds de la série HB en priorité Spot" } }
        - { id: d, text: { en: "HB-series nodes with regular priority", fr: "Des nœuds de la série HB en priorité normale" } }
        - { id: e, text: { en: "An Azure Files share mounted on every node over SMB", fr: "Un partage Azure Files monté sur chaque nœud via SMB" } }
        - { id: f, text: { en: "An Azure Managed Lustre file system linked to the blob container", fr: "Un système de fichiers Azure Managed Lustre lié au conteneur d'objets blob" } }
    answer: { optionIds: [b, d, f] }
    explanation:
      correct:
        en: |
          CycleCloud keeps the existing scheduler: it deploys a Slurm cluster in Azure and autoscales its nodes with the jobs submitted to Slurm, so the scripts and queues don't change. HB-series sizes provide the RDMA network of tightly coupled jobs, and regular priority is required because a single preempted Spot node would restart the whole 30-hour MPI job. Azure Managed Lustre is a parallel file system for HPC that imports the dataset from a linked blob container and exports the results back, so it can be deleted between campaigns.
        fr: |
          CycleCloud conserve le planificateur existant : il déploie un cluster Slurm dans Azure et met à l'échelle ses nœuds selon les travaux soumis à Slurm ; les scripts et les files d'attente ne changent pas. Les tailles de la série HB fournissent le réseau RDMA des travaux fortement couplés, et la priorité normale est obligatoire, car un seul nœud Spot préempté relancerait tout le travail MPI de 30 heures. Azure Managed Lustre est un système de fichiers parallèle pour le HPC qui importe le jeu de données depuis un conteneur d'objets blob lié et y exporte les résultats ; il peut donc être supprimé entre les campagnes.
      options:
        a: { en: "Batch has its own job and task model: the engineers would have to replace their Slurm scripts and queues.", fr: "Batch a son propre modèle de travaux et de tâches : les ingénieurs devraient remplacer leurs scripts et leurs files d'attente Slurm." }
        c: { en: "When one Spot node of a long MPI job is preempted, the whole job has to run again, and the solver has no checkpointing.", fr: "Quand un nœud Spot d'un long travail MPI est préempté, tout le travail doit être relancé, et le solveur n'a pas de points de contrôle." }
        e: { en: "An SMB share isn't a parallel file system for high-throughput HPC access, and it keeps a second copy of the data outside Blob Storage.", fr: "Un partage SMB n'est pas un système de fichiers parallèle pour un accès HPC à débit élevé, et il conserve une seconde copie des données hors du Stockage Blob." }
    references:
      - title: Overview - Azure CycleCloud
        url: https://learn.microsoft.com/en-us/azure/cyclecloud/overview
      - title: What is Azure Managed Lustre? - Azure Managed Lustre File System
        url: https://learn.microsoft.com/en-us/azure/azure-managed-lustre/amlfs-overview
