chapter: 22-nonrelational-data
questions:
  # ------------------------------------------------------------------ 1
  - id: az305-qz-22-01
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders creates an Azure Cosmos DB for NoSQL account and keeps every setting of the account at its default value. An application reads items without specifying a consistency level in its requests.

        Which consistency level do the reads of the application use?
      fr: |
        Northwind Traders crée un compte Azure Cosmos DB for NoSQL et laisse tous les paramètres du compte à leur valeur par défaut. Une application lit des éléments sans préciser de niveau de cohérence dans ses requêtes.

        Quel niveau de cohérence les lectures de l'application utilisent-elles ?
    body:
      options:
        - { id: a, text: Strong }
        - { id: b, text: Bounded staleness }
        - { id: c, text: Session }
        - { id: d, text: Eventual }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Session is the default consistency level of an Azure Cosmos DB account, and the account default applies to every database and container of the account. With Session consistency, a client always reads its own writes within its session, which suits most applications.
        fr: |
          Session est le niveau de cohérence par défaut d'un compte Azure Cosmos DB, et la valeur par défaut du compte s'applique à toutes les bases de données et à tous les conteneurs du compte. Avec la cohérence Session, un client relit toujours ses propres écritures dans sa session, ce qui convient à la plupart des applications.
      options:
        a: { en: "Strong must be selected explicitly as the account default; its reads use two replicas and cost twice the RUs of a Session read.", fr: "Strong doit être choisi explicitement comme valeur par défaut du compte ; ses lectures utilisent deux réplicas et coûtent deux fois plus de RU qu'une lecture Session." }
        b: { en: "Bounded staleness must be configured explicitly, with its K versions and T seconds bounds; it isn't the default.", fr: "Bounded staleness doit être configuré explicitement, avec ses bornes de K versions et de T secondes ; ce n'est pas la valeur par défaut." }
        d: { en: "Eventual is the weakest level; an account uses it only if an administrator selects it as the default.", fr: "Eventual est le niveau le plus faible ; un compte ne l'utilise que si un administrateur le choisit comme valeur par défaut." }
    references:
      - title: Manage Consistency - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-manage-consistency
      - title: Consistency level choices - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels

  # ------------------------------------------------------------------ 2
  - id: az305-qz-22-02
    objective: "2.2.3"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Contoso uses a lifecycle management policy to move block blobs of a standard general-purpose v2 storage account to the cold tier. A blob that is deleted or moved out of the cold tier too soon incurs an early deletion charge.

        For how long must a blob stay in the cold tier to avoid this charge?
      fr: |
        Contoso utilise une stratégie de gestion du cycle de vie pour déplacer des objets blob de blocs d'un compte de stockage standard usage général v2 vers le niveau froid (Cold). Un objet blob supprimé ou retiré trop tôt du niveau froid (Cold) entraîne des frais de suppression anticipée.

        Combien de temps un objet blob doit-il rester dans le niveau froid (Cold) pour éviter ces frais ?
    body:
      options:
        - { id: a, text: { en: "No minimum", fr: "Aucune durée minimale" } }
        - { id: b, text: { en: "30 days", fr: "30 jours" } }
        - { id: c, text: { en: "90 days", fr: "90 jours" } }
        - { id: d, text: { en: "180 days", fr: "180 jours" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Data in the cold tier should be stored for at least 90 days. The early deletion charge is prorated: a blob deleted 60 days after it was moved to the cold tier is charged as if it had been stored there for the remaining 30 days.
        fr: |
          Les données du niveau froid (Cold) doivent être stockées au moins 90 jours. Les frais de suppression anticipée sont calculés au prorata : un objet blob supprimé 60 jours après son passage au niveau froid (Cold) est facturé comme s'il y était resté les 30 jours restants.
      options:
        a: { en: "Only the hot tier has no minimum retention period.", fr: "Seul le niveau chaud (Hot) n'a pas de durée de rétention minimale." }
        b: { en: "30 days is the minimum retention period of the cool tier.", fr: "30 jours est la durée de rétention minimale du niveau froid (Cool)." }
        d: { en: "180 days is the minimum retention period of the archive tier.", fr: "180 jours est la durée de rétention minimale du niveau archive (Archive)." }
    references:
      - title: Access tiers for blob data - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview

  # ------------------------------------------------------------------ 3
  - id: az305-qz-22-03
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware is moving a genomics application to Azure. Twenty Linux compute nodes must mount the same shared file system at the same time. The application supports only version 3 of the NFS protocol and requires a storage latency below one millisecond.

        You need to recommend a storage service for the shared file system.

        What should you recommend?
      fr: |
        Litware migre une application de génomique vers Azure. Vingt nœuds de calcul Linux doivent monter le même système de fichiers partagé en même temps. L'application ne prend en charge que la version 3 du protocole NFS et exige une latence de stockage inférieure à une milliseconde.

        Vous devez recommander un service de stockage pour le système de fichiers partagé.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "An NFS file share in an Azure Files premium (SSD) storage account", fr: "Un partage de fichiers NFS dans un compte de stockage Azure Files Premium (SSD)" } }
        - { id: b, text: { en: "A volume in an Azure NetApp Files capacity pool", fr: "Un volume dans un pool de capacité Azure NetApp Files" } }
        - { id: c, text: { en: "An SMB file share in Azure Files, cached on the nodes by Azure File Sync", fr: "Un partage de fichiers SMB dans Azure Files, mis en cache sur les nœuds par Azure File Sync" } }
        - { id: d, text: { en: "An Azure Elastic SAN volume that the nodes share over iSCSI", fr: "Un volume Azure Elastic SAN que les nœuds partagent via iSCSI" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Azure NetApp Files is the file service for the most demanding workloads: it supports NFSv3, NFSv4.1 and SMB volumes and delivers submillisecond latency on all-flash storage. Many Linux nodes can mount the same NFSv3 volume at the same time.
        fr: |
          Azure NetApp Files est le service de fichiers des charges de travail les plus exigeantes : il prend en charge des volumes NFSv3, NFSv4.1 et SMB et offre une latence inférieure à la milliseconde sur un stockage entièrement flash. De nombreux nœuds Linux peuvent monter le même volume NFSv3 en même temps.
      options:
        a: { en: "NFS Azure file shares support NFS 4.1 only, so an application limited to NFSv3 can't use them.", fr: "Les partages de fichiers Azure NFS ne prennent en charge que NFS 4.1 : une application limitée à NFSv3 ne peut pas les utiliser." }
        c: { en: "Azure File Sync caches SMB shares on Windows file servers; it provides no NFSv3 access to Linux nodes.", fr: "Azure File Sync met en cache des partages SMB sur des serveurs de fichiers Windows ; il ne fournit aucun accès NFSv3 aux nœuds Linux." }
        d: { en: "Elastic SAN provides block volumes over iSCSI, not a shared file system that is mounted with NFS.", fr: "Elastic SAN fournit des volumes de blocs via iSCSI, pas un système de fichiers partagé monté en NFS." }
    references:
      - title: What is Azure NetApp Files
        url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-introduction
      - title: Plan an Azure Files deployment
        url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-planning

  # ------------------------------------------------------------------ 4
  - id: az305-qz-22-04
    objective: "2.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam stores invoices as block blobs in a standard general-purpose v2 storage account named **stfabinvoices**. Blob soft delete and blob versioning are enabled. The administrators of the subscription that contains stfabinvoices have the Owner role on it.

        A security review requires that the invoices can be restored even if a compromised administrator account deletes stfabinvoices. The recovery copies must be kept outside the storage account, in a subscription that only the security team manages.

        What should you recommend?
      fr: |
        Fabrikam stocke des factures sous forme d'objets blob de blocs dans un compte de stockage standard usage général v2 nommé **stfabinvoices**. La suppression réversible des objets blob et le contrôle de version des objets blob sont activés. Les administrateurs de l'abonnement qui contient stfabinvoices y disposent du rôle Owner.

        Une revue de sécurité exige que les factures puissent être restaurées même si un compte d'administrateur compromis supprime stfabinvoices. Les copies de récupération doivent être conservées en dehors du compte de stockage, dans un abonnement que seule l'équipe de sécurité gère.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Azure Backup vaulted backup of the blobs to a Backup vault", fr: "La sauvegarde archivée (vaulted backup) des objets blob de Sauvegarde Azure vers un coffre de sauvegarde" } }
        - { id: b, text: { en: "Azure Backup operational backup of the blobs of the account", fr: "La sauvegarde opérationnelle des objets blob du compte avec Sauvegarde Azure" } }
        - { id: c, text: { en: "A CanNotDelete resource lock on the stfabinvoices account", fr: "Un verrou de ressource CanNotDelete sur le compte stfabinvoices" } }
        - { id: d, text: { en: "Point-in-time restore for the block blobs of the account", fr: "La restauration à un instant dans le passé des objets blob de blocs du compte" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Vaulted backup copies the blobs to a Backup vault on the schedule and with the retention of the backup policy, so the copies survive the accidental or malicious deletion of the storage account. Cross-subscription backup is supported, so the vault can sit in a subscription that the security team manages.
        fr: |
          La sauvegarde archivée copie les objets blob dans un coffre de sauvegarde selon la planification et la rétention de la stratégie de sauvegarde : les copies survivent à la suppression accidentelle ou malveillante du compte de stockage. La sauvegarde entre abonnements est prise en charge : le coffre peut donc se trouver dans un abonnement que gère l'équipe de sécurité.
      options:
        b: { en: "Operational backup keeps its data locally in the source storage account, so it disappears with the account.", fr: "La sauvegarde opérationnelle conserve ses données localement dans le compte de stockage source : elles disparaissent avec le compte." }
        c: { en: "An Owner of the subscription can remove the lock and then delete the account; a lock keeps no copy of the data.", fr: "Un Owner de l'abonnement peut retirer le verrou puis supprimer le compte ; un verrou ne conserve aucune copie des données." }
        d: { en: "Point-in-time restore relies on versioning, change feed and soft delete inside the account; deleting the account removes them.", fr: "La restauration à un instant dans le passé repose sur le contrôle de version, le flux de modification et la suppression réversible du compte ; supprimer le compte les fait disparaître." }
    references:
      - title: Overview of Azure Blob backup - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/blob-backup-overview
      - title: Support matrix for Azure Blobs backup - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/blob-backup-support-matrix

  # ------------------------------------------------------------------ 5
  - id: az305-qz-22-05
    objective: "2.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys is building a ticketing API on Azure Cosmos DB for NoSQL. On sale days, the traffic reaches about 15,000 RU/s for two hours; the rest of the time, it is close to zero. The data must be replicated to a second Azure region so that reads continue if the primary region fails.

        You need to recommend a capacity configuration. The solution must minimize costs and must not throttle requests during the peaks.

        What should you recommend?
      fr: |
        Tailspin Toys développe une API de billetterie sur Azure Cosmos DB for NoSQL. Les jours de mise en vente, le trafic atteint environ 15 000 RU/s pendant deux heures ; le reste du temps, il est proche de zéro. Les données doivent être répliquées dans une seconde région Azure afin que les lectures continuent si la région primaire tombe en panne.

        Vous devez recommander une configuration de capacité. La solution doit réduire les coûts au minimum et ne doit pas limiter les requêtes pendant les pics.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Serverless capacity mode, with a read region added in the second region", fr: "Le mode de capacité serverless, avec une région de lecture ajoutée dans la seconde région" } }
        - { id: b, text: { en: "Autoscale provisioned throughput with a maximum of 15,000 RU/s", fr: "Le débit approvisionné à mise à l'échelle automatique avec un maximum de 15 000 RU/s" } }
        - { id: c, text: { en: "Standard (manual) provisioned throughput of 15,000 RU/s", fr: "Le débit approvisionné standard (manuel) de 15 000 RU/s" } }
        - { id: d, text: { en: "Standard (manual) provisioned throughput of 2,000 RU/s", fr: "Le débit approvisionné standard (manuel) de 2 000 RU/s" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Autoscale scales the throughput between 10% and 100% of the maximum, here between 1,500 and 15,000 RU/s, and bills each hour for the highest throughput reached. The short peaks are served without throttling, and the other hours are billed at the 1,500 RU/s floor. Provisioned throughput also allows the second region that serverless can't offer.
        fr: |
          La mise à l'échelle automatique fait varier le débit entre 10 % et 100 % du maximum, ici entre 1 500 et 15 000 RU/s, et facture chaque heure le débit le plus élevé atteint. Les pics courts sont servis sans limitation, et les autres heures sont facturées au plancher de 1 500 RU/s. Le débit approvisionné permet aussi la seconde région que le serverless ne peut pas offrir.
      options:
        a: { en: "A serverless account runs in a single Azure region, and no region can be added to it after its creation.", fr: "Un compte serverless s'exécute dans une seule région Azure, et aucune région ne peut lui être ajoutée après sa création." }
        c: { en: "15,000 RU/s would be billed every hour, although the traffic is close to zero most of the time.", fr: "15 000 RU/s seraient facturées chaque heure, alors que le trafic est proche de zéro la plupart du temps." }
        d: { en: "2,000 RU/s can't absorb the 15,000 RU/s peaks: the requests above the provisioned throughput are throttled.", fr: "2 000 RU/s ne peuvent pas absorber les pics de 15 000 RU/s : les requêtes au-delà du débit approvisionné sont limitées." }
    references:
      - title: Serverless Consumption-Based Account Type - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/serverless
      - title: Create Containers and Databases with Autoscale Throughput - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/provision-throughput-autoscale

  # ------------------------------------------------------------------ 6
  - id: az305-qz-22-06
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Adatum is planning four storage workloads. Each workload will be deployed in its own storage account. Each account must use the least expensive account type that meets all the requirements of its workload.

        Which account type should you recommend for each workload? To answer, drag the appropriate account types to the correct workloads. Each account type may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum planifie quatre charges de travail de stockage. Chaque charge de travail sera déployée dans son propre compte de stockage. Chaque compte doit utiliser le type de compte le moins coûteux qui répond à toutes les exigences de sa charge de travail.

        Quel type de compte devez-vous recommander pour chaque charge de travail ? Pour répondre, faites glisser les types de comptes appropriés vers les charges de travail correspondantes. Chaque type de compte peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: std, text: { en: "Standard general-purpose v2", fr: "Standard usage général v2" } }
        - { id: pbb, text: { en: "Premium block blobs", fr: "Objets blob de blocs Premium" } }
        - { id: pfs, text: { en: "Premium file shares", fr: "Partages de fichiers Premium" } }
        - { id: ppb, text: { en: "Premium page blobs", fr: "Objets blob de pages Premium" } }
      targets:
        - id: lake
          text: { en: "A data lake with a hierarchical namespace for Spark jobs, whose raw files must move to the archive tier after one year", fr: "Un lac de données avec un espace de noms hiérarchique pour des travaux Spark, dont les fichiers bruts doivent passer au niveau archive (Archive) au bout d'un an" }
        - id: nfs
          text: { en: "A file share that Linux servers mount with NFS 4.1, with its data kept in three availability zones", fr: "Un partage de fichiers que des serveurs Linux montent en NFS 4.1, avec des données conservées dans trois zones de disponibilité" }
        - id: ingest
          text: { en: "A landing zone with a hierarchical namespace that receives millions of small files per hour with consistently low latency", fr: "Une zone d'atterrissage avec un espace de noms hiérarchique qui reçoit des millions de petits fichiers par heure avec une latence constamment faible" }
        - id: smb
          text: { en: "An SMB file share for department documents whose data must be copied to a second region", fr: "Un partage de fichiers SMB pour des documents de service dont les données doivent être copiées dans une seconde région" }
    answer:
      mapping: { lake: std, nfs: pfs, ingest: pbb, smb: std }
    explanation:
      correct:
        en: |
          Only standard general-purpose v2 accounts offer access tiers, including archive, and geo-redundancy, so they host the tiered data lake and the geo-replicated SMB share. NFS shares require SSD media, that is a premium file shares account, which supports ZRS. Premium block blobs accounts give consistently low latency for high transaction rates on small objects and also support the hierarchical namespace of Data Lake Storage.
        fr: |
          Seuls les comptes standard usage général v2 offrent les niveaux d'accès, dont l'archive, et la géoredondance : ils hébergent donc le lac de données hiérarchisé et le partage SMB géorépliqué. Les partages NFS exigent un support SSD, c'est-à-dire un compte de partages de fichiers Premium, qui prend en charge ZRS. Les comptes d'objets blob de blocs Premium offrent une latence constamment faible pour des taux de transactions élevés sur de petits objets et prennent aussi en charge l'espace de noms hiérarchique de Data Lake Storage.
      options:
        pbb: { en: "Premium block blobs accounts have no access tiers and support only LRS and ZRS: they fit neither the archived lake nor any file share.", fr: "Les comptes d'objets blob de blocs Premium n'ont pas de niveaux d'accès et ne prennent en charge que LRS et ZRS : ils ne conviennent ni au lac archivé ni à un partage de fichiers." }
        pfs: { en: "Premium file shares accounts support only LRS and ZRS, so they can't copy the SMB share to a second region.", fr: "Les comptes de partages de fichiers Premium ne prennent en charge que LRS et ZRS : ils ne peuvent pas copier le partage SMB dans une seconde région." }
        ppb: { en: "Premium page blobs accounts store page blobs only, such as disks; they host neither block blobs nor file shares.", fr: "Les comptes d'objets blob de pages Premium ne stockent que des objets blob de pages, comme des disques ; ils n'hébergent ni objets blob de blocs ni partages de fichiers." }
    references:
      - title: Storage Account Overview - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
      - title: Plan an Azure Files deployment
        url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-planning

  # ------------------------------------------------------------------ 7
  - id: az305-qz-22-07
    objective: "2.2.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso runs an order service on an Azure Cosmos DB for NoSQL account that has one write region and one read region. The default consistency level of the account is Session.

        The **orders** container uses `/customerId` as its partition key and autoscale throughput with a maximum of 20,000 RU/s. The largest customer currently stores 6 GB of orders, and its volume doubles every year.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso exécute un service de commandes sur un compte Azure Cosmos DB for NoSQL qui comporte une région d'écriture et une région de lecture. Le niveau de cohérence par défaut du compte est Session.

        Le conteneur **orders** utilise `/customerId` comme clé de partition et un débit à mise à l'échelle automatique avec un maximum de 20 000 RU/s. Le plus gros client stocke actuellement 6 Go de commandes, et son volume double chaque année.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "For an hour during which the orders container receives no request, Contoso is billed for 2,000 RU/s in each region of the account.", fr: "Pour une heure pendant laquelle le conteneur orders ne reçoit aucune requête, Contoso est facturé 2 000 RU/s dans chaque région du compte." }
        - id: s2
          text: { en: "If the default consistency level is changed to Bounded staleness, a read of an item consumes the same number of RUs as it does today.", fr: "Si le niveau de cohérence par défaut passe à Bounded staleness, la lecture d'un élément consomme le même nombre de RU qu'aujourd'hui." }
        - id: s3
          text: { en: "The orders of the largest customer can keep growing in the orders container until they reach 48 GB.", fr: "Les commandes du plus gros client peuvent continuer à croître dans le conteneur orders jusqu'à atteindre 48 Go." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Autoscale never goes below 10% of the maximum: an hour without requests is billed at 0.1 × 20,000 = 2,000 RU/s, and provisioned throughput is billed in each region of the account. Bounded staleness, like Strong, reads from two replicas, so a read costs twice the RUs of a Session read. All the orders of one customer share one partition key value, that is one logical partition, which holds at most 20 GB; the largest customer reaches this limit in less than two years.
        fr: |
          La mise à l'échelle automatique ne descend jamais sous 10 % du maximum : une heure sans requête est facturée 0,1 × 20 000 = 2 000 RU/s, et le débit approvisionné est facturé dans chaque région du compte. Bounded staleness, comme Strong, lit sur deux réplicas : une lecture coûte deux fois plus de RU qu'une lecture Session. Toutes les commandes d'un client partagent une même valeur de clé de partition, c'est-à-dire une partition logique, qui contient au plus 20 Go ; le plus gros client atteint cette limite en moins de deux ans.
      options:
        s2: { en: "Strong and Bounded staleness use minority quorum reads from two replicas, so their reads cost twice as many RUs.", fr: "Strong et Bounded staleness lisent sur deux réplicas (quorum minoritaire) : leurs lectures coûtent deux fois plus de RU." }
        s3: { en: "A logical partition is limited to 20 GB; a key that grows beyond it needs a new container, for example with a hierarchical partition key.", fr: "Une partition logique est limitée à 20 Go ; une clé qui la dépasse exige un nouveau conteneur, par exemple avec une clé de partition hiérarchique." }
    references:
      - title: Frequently Asked Questions About Autoscale Throughput - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/autoscale-faq
      - title: Partitioning and horizontal scaling - Azure Cosmos DB
        url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview

  # ------------------------------------------------------------------ 8
  - id: az305-qz-22-08
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Wingtip Toys must keep three years of CCTV recordings as block blobs in a standard general-purpose v2 storage account in the West Europe region. The recordings are read about twice a year, during investigations.

        You need to recommend a configuration for the account. The solution must meet the following requirements:

        - Reads and writes must continue without interruption if an availability zone of West Europe fails.
        - The recordings must survive the loss of the West Europe region.
        - An investigation can wait up to 24 hours for the recordings that it needs.
        - Storage costs must be minimized.

        What should you recommend? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys doit conserver trois ans d'enregistrements de vidéosurveillance sous forme d'objets blob de blocs dans un compte de stockage standard usage général v2 de la région Europe Ouest. Les enregistrements sont lus environ deux fois par an, lors d'enquêtes.

        Vous devez recommander une configuration pour le compte. La solution doit répondre aux exigences suivantes :

        - Les lectures et les écritures doivent continuer sans interruption si une zone de disponibilité d'Europe Ouest tombe en panne.
        - Les enregistrements doivent survivre à la perte de la région Europe Ouest.
        - Une enquête peut attendre jusqu'à 24 heures les enregistrements dont elle a besoin.
        - Les coûts de stockage doivent être réduits au minimum.

        Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Redundancy of the account: [[red]]

          Access tier of the recordings: [[tier]]
        fr: |
          Redondance du compte : [[red]]

          Niveau d'accès des enregistrements : [[tier]]
      slots:
        - id: red
          options:
            - { id: lrs, text: LRS }
            - { id: zrs, text: ZRS }
            - { id: grs, text: GRS }
            - { id: gzrs, text: GZRS }
        - id: tier
          options:
            - { id: hot, text: { en: "Hot", fr: "Niveau chaud (Hot)" } }
            - { id: cool, text: { en: "Cool", fr: "Niveau froid (Cool)" } }
            - { id: cold, text: { en: "Cold", fr: "Niveau froid (Cold)" } }
            - { id: archive, text: { en: "Archive", fr: "Niveau archive (Archive)" } }
    answer:
      values: { red: gzrs, tier: cold }
    explanation:
      correct:
        en: |
          GZRS replicates synchronously across availability zones in West Europe, so reads and writes continue during a zone failure, and keeps an asynchronous copy in the secondary region. The archive tier would be the cheapest and its hours of rehydration would be acceptable, but it isn't supported for ZRS, GZRS or RA-GZRS accounts. The cold tier is therefore the cheapest tier available for data that is read twice a year.
        fr: |
          GZRS réplique de manière synchrone entre les zones de disponibilité d'Europe Ouest, ce qui maintient les lectures et les écritures pendant une panne de zone, et conserve une copie asynchrone dans la région secondaire. Le niveau archive (Archive) serait le moins cher et ses heures de réhydratation seraient acceptables, mais il n'est pas pris en charge pour les comptes ZRS, GZRS ou RA-GZRS. Le niveau froid (Cold) est donc le niveau disponible le moins cher pour des données lues deux fois par an.
      options:
        lrs: { en: "LRS keeps all the copies in one datacenter: it survives neither a zone failure nor a regional loss.", fr: "LRS conserve toutes les copies dans un seul centre de données : il ne survit ni à une panne de zone ni à la perte de la région." }
        zrs: { en: "ZRS survives a zone failure but keeps no copy outside West Europe.", fr: "ZRS survit à une panne de zone, mais ne conserve aucune copie en dehors d'Europe Ouest." }
        grs: { en: "GRS uses LRS in the primary region: if the datacenter that holds the data fails, access resumes only after a failover.", fr: "GRS utilise LRS dans la région primaire : si le centre de données qui héberge les données tombe en panne, l'accès ne reprend qu'après un basculement." }
        archive: { en: "The archive tier isn't supported for GZRS accounts, the only option that meets both resilience requirements.", fr: "Le niveau archive (Archive) n'est pas pris en charge pour les comptes GZRS, la seule option qui répond aux deux exigences de résilience." }
        cool: { en: "The cool tier stays readable immediately but stores data at a higher price than the cold tier.", fr: "Le niveau froid (Cool) reste lisible immédiatement, mais stocke les données à un prix plus élevé que le niveau froid (Cold)." }
    references:
      - title: Data redundancy - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
      - title: Access tiers for blob data - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview

  # ------------------------------------------------------------------ 9
  - id: az305-qz-22-09
    objective: "2.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam ingests IoT data into a premium block blobs storage account named **stfabingest** in the West Europe region. The account uses ZRS, and the ingestion services depend on its consistently low latency.

        A reporting application in the North Europe region must read the blobs of the **telemetry** container from North Europe. A delay of several minutes between the ingestion of a blob and its availability in North Europe is acceptable.

        You need to recommend a solution. The solution must keep stfabingest as a premium block blobs account and minimize administrative effort.

        What should you recommend?
      fr: |
        Fabrikam ingère des données IoT dans un compte de stockage d'objets blob de blocs Premium nommé **stfabingest** dans la région Europe Ouest. Le compte utilise ZRS, et les services d'ingestion dépendent de sa latence constamment faible.

        Une application de reporting de la région Europe Nord doit lire les objets blob du conteneur **telemetry** depuis Europe Nord. Un délai de plusieurs minutes entre l'ingestion d'un objet blob et sa disponibilité en Europe Nord est acceptable.

        Vous devez recommander une solution. La solution doit conserver stfabingest comme compte d'objets blob de blocs Premium et réduire au minimum l'effort administratif.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Change the redundancy of stfabingest to RA-GZRS, and have the application read from the secondary endpoint.", fr: "Changer la redondance de stfabingest en RA-GZRS, et faire lire l'application sur le point de terminaison secondaire." } }
        - { id: b, text: { en: "Replicate the telemetry container with object replication to a premium block blobs account in North Europe.", fr: "Répliquer le conteneur telemetry par réplication d'objets vers un compte d'objets blob de blocs Premium en Europe Nord." } }
        - { id: c, text: { en: "Protect stfabingest with vaulted backup, and restore the telemetry container to North Europe every hour.", fr: "Protéger stfabingest par une sauvegarde archivée, et restaurer le conteneur telemetry en Europe Nord toutes les heures." } }
        - { id: d, text: { en: "Run AzCopy from a virtual machine every five minutes to copy the telemetry container to North Europe.", fr: "Exécuter AzCopy depuis une machine virtuelle toutes les cinq minutes pour copier le conteneur telemetry vers Europe Nord." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Object replication supports premium block blobs accounts when the source and destination accounts are both premium block blobs accounts, and the two accounts can be in different regions. The platform copies new and updated block blobs asynchronously, and the application can read the destination container. It requires blob versioning on both accounts and change feed on the source, and no copy job to run or monitor.
        fr: |
          La réplication d'objets prend en charge les comptes d'objets blob de blocs Premium quand le compte source et le compte de destination sont tous deux des comptes d'objets blob de blocs Premium, et les deux comptes peuvent se trouver dans des régions différentes. La plateforme copie de manière asynchrone les objets blob de blocs nouveaux et modifiés, et l'application peut lire le conteneur de destination. Elle exige le contrôle de version sur les deux comptes et le flux de modification sur la source, sans travail de copie à exécuter ni à surveiller.
      options:
        a: { en: "Premium block blobs accounts support only LRS and ZRS; geo-redundant options exist only for standard accounts.", fr: "Les comptes d'objets blob de blocs Premium ne prennent en charge que LRS et ZRS ; les options géoredondantes n'existent que pour les comptes standard." }
        c: { en: "Backup copies can't be read by the application, and hourly restores are an operation to schedule and monitor.", fr: "Les copies de sauvegarde ne sont pas lisibles par l'application, et des restaurations horaires sont une opération à planifier et à surveiller." }
        d: { en: "A scheduled AzCopy job works but adds a virtual machine, scripts and monitoring that the platform handles with object replication.", fr: "Un travail AzCopy planifié fonctionne, mais ajoute une machine virtuelle, des scripts et une surveillance que la plateforme gère avec la réplication d'objets." }
    references:
      - title: Object replication overview - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview
      - title: Storage Account Overview - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview

  # ------------------------------------------------------------------ 10
  - id: az305-qz-22-10
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware stores application logs as block blobs in the hot tier of a standard general-purpose v2 storage account that uses LRS. Each log is read many times during the seven days that follow its creation. After that, a log is read only when an incident is investigated, and the investigator must then open it within seconds. Every log is deleted 60 days after its creation.

        Assume the following storage prices, for a month of 30 days, and assume that transaction and data retrieval costs are negligible:

        | Tier | Price per GB per month |
        | --- | --- |
        | Hot | $0.020 |
        | Cool | $0.010 |
        | Cold | $0.004 |
        | Archive | $0.001 |

        You need to recommend a lifecycle management rule for the logs. The solution must minimize the storage cost of a log over its life.

        What should you recommend?
      fr: |
        Proseware stocke des journaux d'application sous forme d'objets blob de blocs dans le niveau chaud (Hot) d'un compte de stockage standard usage général v2 qui utilise LRS. Chaque journal est lu de nombreuses fois pendant les sept jours qui suivent sa création. Ensuite, un journal n'est lu que lors de l'analyse d'un incident, et l'enquêteur doit alors l'ouvrir en quelques secondes. Chaque journal est supprimé 60 jours après sa création.

        Supposez les prix de stockage suivants, pour un mois de 30 jours, et supposez que les coûts de transaction et de récupération des données sont négligeables :

        | Niveau | Prix par Go et par mois |
        | --- | --- |
        | Niveau chaud (Hot) | 0,020 $ |
        | Niveau froid (Cool) | 0,010 $ |
        | Niveau froid (Cold) | 0,004 $ |
        | Niveau archive (Archive) | 0,001 $ |

        Vous devez recommander une règle de gestion du cycle de vie pour les journaux. La solution doit réduire au minimum le coût de stockage d'un journal sur sa durée de vie.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Keep each log in the hot tier until it is deleted.", fr: "Conserver chaque journal dans le niveau chaud (Hot) jusqu'à sa suppression." } }
        - { id: b, text: { en: "Move each log to the cool tier 7 days after its creation.", fr: "Déplacer chaque journal vers le niveau froid (Cool) 7 jours après sa création." } }
        - { id: c, text: { en: "Move each log to the cold tier 7 days after its creation.", fr: "Déplacer chaque journal vers le niveau froid (Cold) 7 jours après sa création." } }
        - { id: d, text: { en: "Move each log to the archive tier 7 days after its creation.", fr: "Déplacer chaque journal vers le niveau archive (Archive) 7 jours après sa création." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          After day 7, a log spends 53 days in its new tier. In the cold tier, the deletion at day 60 comes before the 90-day minimum, so 37 days of early deletion are charged: 90 days × $0.004 / 30 = $0.012 per GB. In the cool tier, 53 days exceed the 30-day minimum: 53 × $0.010 / 30 ≈ $0.0177 per GB. Even with the early deletion charge, the cold tier is the cheapest tier that stays readable within seconds.
        fr: |
          Après le 7e jour, un journal passe 53 jours dans son nouveau niveau. Dans le niveau froid (Cold), la suppression au 60e jour intervient avant le minimum de 90 jours : 37 jours de suppression anticipée sont facturés, soit 90 jours × 0,004 $ / 30 = 0,012 $ par Go. Dans le niveau froid (Cool), 53 jours dépassent le minimum de 30 jours : 53 × 0,010 $ / 30 ≈ 0,0177 $ par Go. Même avec les frais de suppression anticipée, le niveau froid (Cold) est le niveau le moins cher qui reste lisible en quelques secondes.
      options:
        a: { en: "53 more days in the hot tier cost about $0.0353 per GB, the most expensive option.", fr: "53 jours de plus dans le niveau chaud (Hot) coûtent environ 0,0353 $ par Go, l'option la plus chère." }
        b: { en: "The cool tier avoids any early deletion charge but costs about $0.0177 per GB, more than the cold tier with its charge.", fr: "Le niveau froid (Cool) évite tout frais de suppression anticipée, mais coûte environ 0,0177 $ par Go, plus que le niveau froid (Cold) avec ses frais." }
        d: { en: "Archived blobs are offline and must be rehydrated for hours before they can be read, which an investigation can't wait for.", fr: "Les objets blob archivés sont hors connexion et doivent être réhydratés pendant des heures avant d'être lus, ce qu'une enquête ne peut pas attendre." }
    references:
      - title: Access tiers for blob data - Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
