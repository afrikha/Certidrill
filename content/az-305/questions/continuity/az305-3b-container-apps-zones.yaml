id: az305-3b-container-apps-zones
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs several microservices in an Azure Container Apps environment. The environment was created without zone redundancy, in a region that supports availability zones. Each container app runs a minimum of one replica.

    You need to recommend a solution that meets the following requirements:

    - The microservices must remain available if an availability zone fails.
    - Costs must be minimized.

    What should you recommend?
  fr: |
    Adatum exécute plusieurs microservices dans un environnement Azure Container Apps. L'environnement a été créé sans redondance de zone, dans une région qui prend en charge les zones de disponibilité. Chaque application conteneur exécute au minimum un réplica.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Les microservices doivent rester disponibles si une zone de disponibilité tombe en panne.
    - Les coûts doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Enable zone redundancy on the existing environment, and keep a minimum of one replica for each container app.", fr: "Activer la redondance de zone sur l'environnement existant, et conserver un minimum d'un réplica pour chaque application conteneur." }
    - id: b
      text: { en: "Create a new environment that has zone redundancy enabled, redeploy the container apps, and set a minimum of two replicas for each container app.", fr: "Créer un nouvel environnement où la redondance de zone est activée, redéployer les applications conteneur, et définir un minimum de deux réplicas pour chaque application conteneur." }
    - id: c
      text: { en: "Keep the existing environment, and set a minimum of three replicas for each container app.", fr: "Conserver l'environnement existant, et définir un minimum de trois réplicas pour chaque application conteneur." }
    - id: d
      text: { en: "Create a second environment without zone redundancy in the same region, and distribute the requests to both environments by using Traffic Manager.", fr: "Créer un second environnement sans redondance de zone dans la même région, et répartir les requêtes entre les deux environnements avec Traffic Manager." }
answer: { optionId: b }
explanation:
  correct:
    en: Zone redundancy of Azure Container Apps is chosen when the environment is created and can't be enabled afterward, so a new environment is needed. In a zone-redundant environment the platform places the replicas in different zones automatically, provided that each app runs at least two replicas. The feature has no extra charge.
    fr: La redondance de zone d'Azure Container Apps se choisit à la création de l'environnement et ne peut pas être activée ensuite ; un nouvel environnement est donc nécessaire. Dans un environnement redondant interzone, la plateforme place automatiquement les réplicas dans des zones différentes, à condition que chaque application exécute au moins deux réplicas. La fonctionnalité n'entraîne aucuns frais supplémentaires.
  options:
    a:
      en: Zone redundancy can't be enabled on an existing environment, and a single replica runs in one zone only.
      fr: La redondance de zone ne peut pas être activée sur un environnement existant, et un réplica unique ne s'exécute que dans une seule zone.
    c:
      en: Without zone redundancy on the environment, nothing guarantees that the three replicas are in different zones.
      fr: Sans redondance de zone sur l'environnement, rien ne garantit que les trois réplicas sont dans des zones différentes.
    d:
      en: Two environments without zone redundancy can be affected by the same zone failure, and the design doubles the environments to operate and pay for.
      fr: Deux environnements sans redondance de zone peuvent être touchés par la panne de la même zone, et la conception double les environnements à exploiter et à payer.
references:
  - title: Reliability in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-container-apps
