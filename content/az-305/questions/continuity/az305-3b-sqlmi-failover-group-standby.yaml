id: az305-3b-sqlmi-failover-group-standby
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank runs an Azure SQL Managed Instance in the UK South region. The instance hosts 30 user databases.

    You need to recommend a disaster recovery solution that meets the following requirements:

    - All the user databases must be replicated continuously to an instance in the UK West region.
    - The applications must use an endpoint that stays the same after a failover.
    - The instance in UK West will run no read or write workload unless a failover occurs.
    - SQL Server licensing costs must be minimized.

    What should you recommend?
  fr: |
    Woodgrove Bank exécute une instance Azure SQL Managed Instance dans la région UK South. L'instance héberge 30 bases de données utilisateur.

    Vous devez recommander une solution de reprise d'activité qui répond aux exigences suivantes :

    - Toutes les bases de données utilisateur doivent être répliquées en continu vers une instance de la région UK West.
    - Les applications doivent utiliser un point de terminaison qui reste le même après un basculement.
    - L'instance de UK West n'exécutera aucune charge de travail de lecture ou d'écriture tant qu'aucun basculement n'a lieu.
    - Les coûts de licence SQL Server doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A failover group, with the secondary instance designated as a standby replica used only for disaster recovery", fr: "Un groupe de basculement, avec l'instance secondaire désignée comme réplica de secours réservé à la reprise d'activité" }
    - id: b
      text: { en: "A failover group, with the secondary instance designated as a readable replica", fr: "Un groupe de basculement, avec l'instance secondaire désignée comme réplica lisible" }
    - id: c
      text: { en: "Active geo-replication for each database, with each secondary database designated as a standby replica", fr: "La géoréplication active pour chaque base de données, avec chaque base secondaire désignée comme réplica de secours" }
    - id: d
      text: { en: "A zone-redundant instance in UK South, with geo-redundant backup storage", fr: "Une instance redondante interzone dans UK South, avec un stockage de sauvegarde géoredondant" }
answer: { optionId: a }
explanation:
  correct:
    en: A failover group replicates all the user databases of a managed instance to an instance in another region and provides listener endpoints that don't change after a failover. When the secondary instance is used only for disaster recovery, it can be designated as a standby replica. Microsoft then doesn't charge the SQL Server license for its vCores, and only compute and storage are billed.
    fr: "Un groupe de basculement réplique toutes les bases de données utilisateur d'une instance managée vers une instance d'une autre région et fournit des points de terminaison d'écouteur qui ne changent pas après un basculement. Quand l'instance secondaire ne sert qu'à la reprise d'activité, elle peut être désignée comme réplica de secours : Microsoft ne facture alors pas la licence SQL Server de ses vCores, et seuls le calcul et le stockage sont facturés."
  options:
    b:
      en: A readable secondary instance meets the replication and endpoint requirements, but it pays the SQL Server license, which isn't needed for an instance that runs no workload.
      fr: Une instance secondaire lisible répond aux exigences de réplication et de point de terminaison, mais elle paie la licence SQL Server, inutile pour une instance qui n'exécute aucune charge de travail.
    c:
      en: Active geo-replication is a feature of Azure SQL Database. SQL Managed Instance supports failover groups only.
      fr: La géoréplication active est une fonctionnalité d'Azure SQL Database. SQL Managed Instance ne prend en charge que les groupes de basculement.
    d:
      en: Zone redundancy protects against a zone failure in UK South. Geo-redundant backups allow a restore in another region, but with no continuous replication and no stable endpoint.
      fr: La redondance de zone protège contre la panne d'une zone dans UK South. Les sauvegardes géoredondantes permettent une restauration dans une autre région, mais sans réplication continue ni point de terminaison stable.
references:
  - title: Failover groups overview & best practices - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/failover-group-sql-mi
