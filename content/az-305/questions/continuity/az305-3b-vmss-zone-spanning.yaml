id: az305-3b-vmss-zone-spanning
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs a stateless web front end on four virtual machines in an availability set in the East US 2 region. The region supports availability zones. The load varies strongly during the day.

    You need to recommend a new design for the web front end. The solution must meet the following requirements:

    - The front end must remain available if an availability zone fails.
    - The number of virtual machines must follow the demand automatically, including when the capacity of a failed zone must be replaced.
    - Administrative effort must be minimized.

    What should you recommend?
  fr: |
    Litware exécute un front-end web sans état sur quatre machines virtuelles placées dans un groupe à haute disponibilité de la région East US 2. La région prend en charge les zones de disponibilité. La charge varie fortement au cours de la journée.

    Vous devez recommander une nouvelle conception pour le front-end web. La solution doit répondre aux exigences suivantes :

    - Le front-end doit rester disponible si une zone de disponibilité tombe en panne.
    - Le nombre de machines virtuelles doit suivre la demande automatiquement, y compris lorsqu'il faut remplacer la capacité d'une zone en panne.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A Virtual Machine Scale Set that spans three availability zones, with autoscale rules", fr: "Un groupe de machines virtuelles identiques réparti sur trois zones de disponibilité, avec des règles de mise à l'échelle automatique" }
    - id: b
      text: { en: "A Virtual Machine Scale Set deployed to a single availability zone, with autoscale rules", fr: "Un groupe de machines virtuelles identiques déployé dans une seule zone de disponibilité, avec des règles de mise à l'échelle automatique" }
    - id: c
      text: { en: "Six virtual machines created individually in three availability zones, behind a Standard Load Balancer", fr: "Six machines virtuelles créées individuellement dans trois zones de disponibilité, derrière un Standard Load Balancer" }
    - id: d
      text: { en: "An availability set with three fault domains, and an Azure Automation runbook that starts and stops virtual machines", fr: "Un groupe à haute disponibilité à trois domaines d'erreur, et un runbook Azure Automation qui démarre et arrête des machines virtuelles" }
answer: { optionId: a }
explanation:
  correct:
    en: A zone-spanning scale set spreads its instances across the selected zones, so the loss of one zone leaves the instances of the other zones in service. Autoscale rules based on CPU or memory then add instances in the healthy zones to replace the lost capacity, with nothing to script or operate.
    fr: Un groupe de machines virtuelles identiques réparti sur plusieurs zones distribue ses instances entre les zones sélectionnées ; la perte d'une zone laisse donc en service les instances des autres zones. Des règles de mise à l'échelle automatique fondées sur le processeur ou la mémoire ajoutent ensuite des instances dans les zones saines pour remplacer la capacité perdue, sans rien avoir à scripter ni à exploiter.
  options:
    b:
      en: A zonal scale set keeps all its instances in one zone. It scales automatically, but it stops entirely if that zone fails.
      fr: Un groupe de machines virtuelles identiques zonal garde toutes ses instances dans une seule zone. Il se met à l'échelle automatiquement, mais s'arrête entièrement si cette zone tombe en panne.
    c:
      en: Individual virtual machines in three zones survive a zone failure, but their number doesn't follow the demand and they must be managed one by one.
      fr: Des machines virtuelles individuelles dans trois zones survivent à la panne d'une zone, mais leur nombre ne suit pas la demande et il faut les gérer une par une.
    d:
      en: An availability set stays inside one datacenter, so it doesn't survive a zone failure, and the runbook is custom automation to maintain.
      fr: Un groupe à haute disponibilité reste dans un seul centre de données ; il ne survit donc pas à la panne d'une zone, et le runbook est une automatisation personnalisée à maintenir.
references:
