id: az305-3a-cmp-multi-user-authorization
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank backs up its Azure virtual machines to a Recovery Services vault named RSV1. The backup administrators have the Backup Contributor role on RSV1.

    After a security review, you need to recommend a solution that meets the following requirements:

    - Each time a backup administrator wants to reduce the retention of a backup policy, or to stop protection and delete backup data, the security team must first authorize the operation.
    - Once authorized, these operations must remain possible.
    - The backup administrators must keep their current role on RSV1.

    What should you recommend?
  fr: |
    Woodgrove Bank sauvegarde ses machines virtuelles Azure dans un coffre Recovery Services nommé RSV1. Les administrateurs de sauvegarde possèdent le rôle Backup Contributor sur RSV1.

    À la suite d'un audit de sécurité, vous devez recommander une solution qui répond aux exigences suivantes :

    - Chaque fois qu'un administrateur de sauvegarde veut réduire la rétention d'une stratégie de sauvegarde, ou arrêter la protection et supprimer des données de sauvegarde, l'équipe de sécurité doit d'abord autoriser l'opération.
    - Une fois autorisées, ces opérations doivent rester possibles.
    - Les administrateurs de sauvegarde doivent conserver leur rôle actuel sur RSV1.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Enable immutability on RSV1 and lock it.", fr: "Activer l'immuabilité sur RSV1 et la verrouiller." }
    - id: b
      text: { en: "Apply a CanNotDelete lock to RSV1.", fr: "Appliquer un verrou CanNotDelete à RSV1." }
    - id: c
      text: { en: "Set the soft delete retention of RSV1 to 180 days.", fr: "Définir la rétention de la suppression réversible de RSV1 sur 180 jours." }
    - id: d
      text: { en: "Configure multi-user authorization on RSV1 by using a Resource Guard.", fr: "Configurer l'autorisation multi-utilisateur sur RSV1 au moyen d'un Resource Guard." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Multi-user authorization adds a second authorization layer to critical vault operations, such as modifying a policy or deleting protection, through a Resource Guard. The security team owns the Resource Guard, ideally in another subscription or tenant, and grants the Backup MUA Operator role on it just in time; without that role, the backup administrator can't complete the protected operation.
    fr: |
      L'autorisation multi-utilisateur ajoute un second niveau d'autorisation aux opérations critiques du coffre, comme la modification d'une stratégie ou la suppression de la protection, au moyen d'un Resource Guard. L'équipe de sécurité détient le Resource Guard, idéalement dans un autre abonnement ou un autre locataire, et y accorde le rôle Backup MUA Operator juste à temps ; sans ce rôle, l'administrateur de sauvegarde ne peut pas terminer l'opération protégée.
  options:
    a:
      en: "A locked immutable vault blocks these operations for everyone and irreversibly, so they couldn't be performed even with the approval of the security team."
      fr: "Un coffre immuable verrouillé bloque ces opérations pour tout le monde et de façon irréversible : elles ne pourraient pas être effectuées même avec l'accord de l'équipe de sécurité."
    b:
      en: "A CanNotDelete lock prevents the deletion of the vault resource; it doesn't control changes to backup policies and involves no approval."
      fr: "Un verrou CanNotDelete empêche la suppression de la ressource coffre ; il ne contrôle pas les modifications des stratégies de sauvegarde et ne prévoit aucune approbation."
    c:
      en: "Soft delete keeps deleted backup data recoverable for a period; it doesn't require any authorization before the operation."
      fr: "La suppression réversible garde les données de sauvegarde supprimées récupérables pendant une période ; elle n'exige aucune autorisation avant l'opération."
references:
  - title: Multiuser authorization using Resource Guard
    url: https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization-concept
  - title: Immutable vault for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vault-concept
