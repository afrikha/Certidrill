id: az305-3a-cmp-appservice-custom-backup
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum hosts a web app named App1 in an Azure App Service plan of the Premium tier. No backup has been configured for App1.

    You need to recommend a backup solution that meets the following requirements:

    - Backups of App1 must be kept for longer than 30 days.
    - A backup must be downloadable so that it can be restored to an app in another subscription.

    What should you recommend?
  fr: |
    Adatum héberge une application web nommée App1 dans un plan Azure App Service du niveau Premium. Aucune sauvegarde n'a été configurée pour App1.

    Vous devez recommander une solution de sauvegarde qui répond aux exigences suivantes :

    - Les sauvegardes d'App1 doivent être conservées plus de 30 jours.
    - Une sauvegarde doit pouvoir être téléchargée afin d'être restaurée dans une application d'un autre abonnement.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Rely on the automatic backups of App Service.", fr: "S'appuyer sur les sauvegardes automatiques d'App Service." }
    - id: b
      text: { en: "Add a deployment slot and swap it before each release.", fr: "Ajouter un emplacement de déploiement et l'échanger avant chaque mise en production." }
    - id: c
      text: { en: "Configure scheduled custom backups to a storage account.", fr: "Configurer des sauvegardes personnalisées planifiées vers un compte de stockage." }
    - id: d
      text: { en: "Protect App1 with a backup policy of a Recovery Services vault.", fr: "Protéger App1 avec une stratégie de sauvegarde d'un coffre Recovery Services." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Custom backups of App Service are written as blobs to a storage account that you provide. They can be kept indefinitely and downloaded, which is required to restore an app in another subscription. Automatic backups need no configuration but are kept 30 days and can't be downloaded.
    fr: |
      Les sauvegardes personnalisées d'App Service sont écrites sous forme d'objets blob dans un compte de stockage que vous fournissez. Elles peuvent être conservées indéfiniment et téléchargées, ce qui est nécessaire pour restaurer une application dans un autre abonnement. Les sauvegardes automatiques ne demandent aucune configuration, mais elles sont conservées 30 jours et ne peuvent pas être téléchargées.
  options:
    a:
      en: "Automatic backups are taken every hour and kept 30 days; the retention can't be changed and the backups can't be downloaded."
      fr: "Les sauvegardes automatiques sont effectuées toutes les heures et conservées 30 jours ; la rétention ne peut pas être modifiée et les sauvegardes ne peuvent pas être téléchargées."
    b:
      en: "A deployment slot allows a quick rollback of a release; it isn't a backup with retention and can't be downloaded."
      fr: "Un emplacement de déploiement permet d'annuler rapidement une mise en production ; ce n'est pas une sauvegarde avec rétention et il ne peut pas être téléchargé."
    d:
      en: "App Service apps aren't a workload protected by Azure Backup vaults; App Service has its own backup feature."
      fr: "Les applications App Service ne font pas partie des charges de travail protégées par les coffres de Sauvegarde Azure ; App Service possède sa propre fonctionnalité de sauvegarde."
references:
  - title: Back up and restore your app in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/manage-backup
