id: az305-3b-appservice-zone-statements
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam hosts a web app on a zone-redundant Azure App Service plan in the Premium v3 tier. The plan runs three instances in the West Europe region. The web app stores no state on the instances.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam héberge une application web sur un plan Azure App Service redondant interzone de niveau Premium v3. Le plan exécute trois instances dans la région West Europe. L'application web ne stocke aucun état sur les instances.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If one availability zone of West Europe fails, the web app continues to serve requests.
        fr: Si une zone de disponibilité de West Europe tombe en panne, l'application web continue de traiter les requêtes.
    - id: s2
      text:
        en: If the West Europe region becomes unavailable, App Service fails the web app over to another region.
        fr: Si la région West Europe devient indisponible, App Service bascule l'application web vers une autre région.
    - id: s3
      text:
        en: To stay zone-redundant, the plan must keep at least two instances.
        fr: Pour rester redondant interzone, le plan doit conserver au moins deux instances.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The instances of a zone-redundant plan are spread across zones, and the platform reroutes traffic to the remaining instances when a zone fails, with no manual failover. App Service is a single-region service. Surviving a regional outage requires a second deployment in another region and a global load balancer such as Azure Front Door. Zone redundancy requires a minimum of two instances.
    fr: "Les instances d'un plan redondant interzone sont réparties entre les zones, et la plateforme réachemine le trafic vers les instances restantes quand une zone tombe en panne, sans basculement manuel. App Service est un service à région unique : survivre à une panne régionale exige un second déploiement dans une autre région et un équilibreur de charge mondial tel qu'Azure Front Door. La redondance de zone exige un minimum de deux instances."
references:
  - title: Reliability in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-app-service
