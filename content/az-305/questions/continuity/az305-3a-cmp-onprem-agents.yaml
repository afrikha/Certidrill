id: az305-3a-cmp-onprem-agents
objective: "3.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys wants to back up its on-premises servers to Azure:

    - Each of the 12 branch offices has one Windows Server file server. Files, folders and the system state must be backed up. No additional server can be deployed in a branch office.
    - The headquarters has a Hyper-V cluster whose virtual machines run SQL Server and SharePoint Server. The backups must be application-aware, short-term copies must be kept on local disks at the headquarters for fast restores, and long-term copies must be kept in Azure.

    You need to recommend the backup components.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys souhaite sauvegarder ses serveurs locaux vers Azure :

    - Chacune des 12 succursales possède un serveur de fichiers Windows Server. Les fichiers, les dossiers et l'état du système doivent être sauvegardés. Aucun serveur supplémentaire ne peut être déployé dans une succursale.
    - Le siège possède un cluster Hyper-V dont les machines virtuelles exécutent SQL Server et SharePoint Server. Les sauvegardes doivent tenir compte des applications, des copies à court terme doivent être conservées sur des disques locaux au siège pour des restaurations rapides, et des copies à long terme doivent être conservées dans Azure.

    Vous devez recommander les composants de sauvegarde.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Branch offices: [[branch]]

      Headquarters: [[hq]]

      Vault in Azure: [[vault]]
    fr: |
      Succursales : [[branch]]

      Siège : [[hq]]

      Coffre dans Azure : [[vault]]
  slots:
    - id: branch
      options:
        - { id: mars, text: { en: "The MARS agent on each server", fr: "L'agent MARS sur chaque serveur" } }
        - { id: mabs, text: "Microsoft Azure Backup Server (MABS)" }
        - { id: asr, text: { en: "The Azure Site Recovery Provider on each server", fr: "Le Fournisseur Azure Site Recovery sur chaque serveur" } }
        - { id: sync, text: { en: "The Azure File Sync agent on each server", fr: "L'agent Azure File Sync sur chaque serveur" } }
    - id: hq
      options:
        - { id: mars, text: { en: "The MARS agent on each server", fr: "L'agent MARS sur chaque serveur" } }
        - { id: mabs, text: "Microsoft Azure Backup Server (MABS)" }
        - { id: asr, text: { en: "The Azure Site Recovery Provider on each server", fr: "Le Fournisseur Azure Site Recovery sur chaque serveur" } }
        - { id: sync, text: { en: "The Azure File Sync agent on each server", fr: "L'agent Azure File Sync sur chaque serveur" } }
    - id: vault
      options:
        - { id: bv, text: { en: "A Backup vault", fr: "Un coffre de sauvegarde" } }
        - { id: rsv, text: { en: "A Recovery Services vault", fr: "Un coffre Recovery Services" } }
        - { id: kv, text: { en: "A storage account with immutable blob storage", fr: "Un compte de stockage avec stockage Blob immuable" } }
answer:
  values: { branch: mars, hq: mabs, vault: rsv }
explanation:
  correct:
    en: |
      The MARS agent is installed directly on a Windows machine and backs up files, folders, volumes and the system state to Azure without any backup server. MABS protects Hyper-V virtual machines and applications such as SQL Server and SharePoint with application-aware backups: it first stores them on its local disks, then sends them to Azure for long-term retention. Both send their data to a Recovery Services vault.
    fr: |
      L'agent MARS s'installe directement sur une machine Windows et sauvegarde des fichiers, des dossiers, des volumes et l'état du système vers Azure sans serveur de sauvegarde. MABS protège des machines virtuelles Hyper-V et des applications telles que SQL Server et SharePoint par des sauvegardes tenant compte des applications : il les stocke d'abord sur ses disques locaux, puis les envoie dans Azure pour la conservation à long terme. Tous deux envoient leurs données vers un coffre Recovery Services.
  options:
    asr: { en: "The Site Recovery Provider replicates Hyper-V virtual machines for a failover; it isn't a backup component.", fr: "Le Fournisseur Site Recovery réplique des machines virtuelles Hyper-V en vue d'un basculement ; ce n'est pas un composant de sauvegarde." }
    sync: { en: "Azure File Sync synchronizes file shares with Azure Files; it doesn't back up the system state or applications.", fr: "Azure File Sync synchronise des partages de fichiers avec Azure Files ; il ne sauvegarde ni l'état du système ni les applications." }
    bv: { en: "A Backup vault serves workloads such as managed disks, blobs and AKS; MARS and MABS use a Recovery Services vault.", fr: "Un coffre de sauvegarde sert à des charges de travail telles que les disques managés, les objets blob et AKS ; MARS et MABS utilisent un coffre Recovery Services." }
references:
  - title: About the Microsoft Azure Recovery Services (MARS) agent for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-about-mars
  - title: Support matrix for backup with Microsoft Azure Backup Server or System Center DPM
    url: https://learn.microsoft.com/en-us/azure/backup/backup-support-matrix-mabs-dpm
