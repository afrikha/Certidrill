id: az305-3b-sqldb-tier-for-zones
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure SQL database named **DB1** in the Standard service tier of the DTU-based purchasing model. DB1 is in a region that supports availability zones.

    A new requirement states that DB1 must remain available, without data loss, if an availability zone fails.

    You need to recommend a change that makes it possible to enable zone redundancy for DB1.

    What should you recommend?
  fr: |
    Contoso dispose d'une base de données Azure SQL nommée **DB1** dans le niveau de service Standard du modèle d'achat DTU. DB1 se trouve dans une région qui prend en charge les zones de disponibilité.

    Une nouvelle exigence impose que DB1 reste disponible, sans perte de données, si une zone de disponibilité tombe en panne.

    Vous devez recommander une modification qui permette d'activer la redondance de zone pour DB1.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Change the backup storage redundancy of DB1 to zone-redundant.", fr: "Passer la redondance du stockage de sauvegarde de DB1 à redondant interzone." }
    - id: b
      text: { en: "Scale DB1 to a larger compute size of the Standard service tier.", fr: "Faire passer DB1 à une taille de calcul supérieure du niveau de service Standard." }
    - id: c
      text: { en: "Add DB1 to a failover group that has a secondary server in another region.", fr: "Ajouter DB1 à un groupe de basculement dont le serveur secondaire est dans une autre région." }
    - id: d
      text: { en: "Move DB1 to the General Purpose service tier of the vCore-based purchasing model.", fr: "Déplacer DB1 vers le niveau de service General Purpose du modèle d'achat vCore." }
answer: { optionId: d }
explanation:
  correct:
    en: The Basic and Standard service tiers of the DTU model are locally redundant only and don't support zone redundancy. The General Purpose tier does. With zone redundancy enabled, its data and log files are stored in zone-redundant storage and compute capacity is available in other zones, so a zone failure loses no committed data.
    fr: "Les niveaux de service Basic et Standard du modèle DTU ne sont que localement redondants et ne prennent pas en charge la redondance de zone. Le niveau General Purpose la prend en charge : une fois la redondance de zone activée, ses fichiers de données et de journal sont stockés dans un stockage redondant interzone et de la capacité de calcul est disponible dans d'autres zones ; la panne d'une zone ne fait donc perdre aucune donnée validée."
  options:
    a:
      en: The backup storage redundancy protects the backups only. It doesn't change the availability of the database itself.
      fr: La redondance du stockage de sauvegarde ne protège que les sauvegardes. Elle ne change pas la disponibilité de la base de données elle-même.
    b:
      en: No compute size of the Standard tier supports zone redundancy.
      fr: Aucune taille de calcul du niveau Standard ne prend en charge la redondance de zone.
    c:
      en: A failover group replicates the database asynchronously to another region. It doesn't enable zone redundancy, and a forced failover can lose data.
      fr: Un groupe de basculement réplique la base de données de façon asynchrone vers une autre région. Il n'active pas la redondance de zone, et un basculement forcé peut faire perdre des données.
references:
  - title: Availability through redundancy - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla-local-zone-redundancy
