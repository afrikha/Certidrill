id: az305-3a-db-cosmos-mode-redundancy
objective: "3.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has two Azure Cosmos DB for NoSQL accounts in the West Europe region:

    - **Orders**: after an accidental deletion or modification, the operations team must restore the data itself to any point in time within the last 30 days.
    - **Telemetry**: the account stays in periodic backup mode. Its backups must remain in West Europe and must survive the failure of one availability zone.

    You need to recommend the backup configuration of each account.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys possède deux comptes Azure Cosmos DB for NoSQL dans la région West Europe :

    - **Orders** : après une suppression ou une modification accidentelle, l'équipe d'exploitation doit restaurer elle-même les données à n'importe quel instant des 30 derniers jours.
    - **Telemetry** : le compte reste en mode de sauvegarde périodique. Ses sauvegardes doivent rester dans West Europe et survivre à la panne d'une zone de disponibilité.

    Vous devez recommander la configuration de sauvegarde de chaque compte.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Orders, backup mode: [[orders]]

      Telemetry, backup storage redundancy: [[telemetry]]
    fr: |
      Orders, mode de sauvegarde : [[orders]]

      Telemetry, redondance du stockage de sauvegarde : [[telemetry]]
  slots:
    - id: orders
      options:
        - { id: p720, text: { en: "Periodic backup with a one-hour interval and 720 hours of retention", fr: "Sauvegarde périodique avec un intervalle d'une heure et 720 heures de rétention" } }
        - { id: c7, text: { en: "Continuous backup, 7-day tier", fr: "Sauvegarde continue, niveau 7 jours" } }
        - { id: c30, text: { en: "Continuous backup, 30-day tier", fr: "Sauvegarde continue, niveau 30 jours" } }
    - id: telemetry
      options:
        - { id: grs, text: { en: "Geo-redundant backup storage", fr: "Stockage de sauvegarde géoredondant" } }
        - { id: zrs, text: { en: "Zone-redundant backup storage", fr: "Stockage de sauvegarde redondant interzone" } }
        - { id: lrs, text: { en: "Locally-redundant backup storage", fr: "Stockage de sauvegarde localement redondant" } }
answer:
  values: { orders: c30, telemetry: zrs }
explanation:
  correct:
    en: |
      Continuous backup lets you restore an account, a database or a container yourself to any point in time of the retention window, which is 30 days in the 30-day tier. In periodic mode, backup storage is geo-redundant by default and therefore copied to the paired region; zone-redundant backup storage keeps the copies in three availability zones of the account's region.
    fr: |
      La sauvegarde continue vous permet de restaurer vous-même un compte, une base de données ou un conteneur à n'importe quel instant de la fenêtre de rétention, soit 30 jours au niveau 30 jours. En mode périodique, le stockage de sauvegarde est géoredondant par défaut et donc copié dans la région jumelée ; le stockage de sauvegarde redondant interzone conserve les copies dans trois zones de disponibilité de la région du compte.
  options:
    p720: { en: "A periodic backup is restored by Microsoft after a support request, and only at the times the backups were taken.", fr: "Une sauvegarde périodique est restaurée par Microsoft à la suite d'une demande de support, et seulement aux heures où les sauvegardes ont été effectuées." }
    c7: { en: "The 7-day tier limits the restore window to seven days.", fr: "Le niveau 7 jours limite la fenêtre de restauration à sept jours." }
    lrs: { en: "Locally-redundant backup storage stays in the region but in a single physical location, so it doesn't survive a zone failure.", fr: "Le stockage de sauvegarde localement redondant reste dans la région mais dans un seul emplacement physique : il ne survit pas à la panne d'une zone." }
references:
  - title: Continuous backup with point-in-time restore in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/continuous-backup-restore-introduction
  - title: Periodic backup storage redundancy in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/periodic-backup-storage-redundancy
