id: az305-3a-rec-sql-ag-plus-asr
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs an e-commerce application in the East US 2 region. The application uses six web and application servers on Azure virtual machines, and two Azure virtual machines that run SQL Server Enterprise edition in an Always On availability group.

    You need to recommend a disaster recovery solution to the Central US region. The solution must meet the following requirements:

    - The databases must have an RPO of less than one minute.
    - The web and application servers must have an RPO of 15 minutes.
    - A single operation must fail over the whole application in the correct order.

    What should you recommend?
  fr: |
    Fabrikam exécute une application de commerce électronique dans la région East US 2. L'application utilise six serveurs web et d'applications sur des machines virtuelles Azure, ainsi que deux machines virtuelles Azure exécutant SQL Server édition Enterprise dans un groupe de disponibilité Always On.

    Vous devez recommander une solution de reprise d'activité vers la région Central US. La solution doit répondre aux exigences suivantes :

    - Les bases de données doivent avoir un RPO inférieur à une minute.
    - Les serveurs web et d'applications doivent avoir un RPO de 15 minutes.
    - Une seule opération doit faire basculer toute l'application dans le bon ordre.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: Add an asynchronous availability group replica in Central US, replicate the other virtual machines with Azure Site Recovery, and fail over everything from a recovery plan.
        fr: Ajouter un réplica asynchrone du groupe de disponibilité dans Central US, répliquer les autres machines virtuelles avec Azure Site Recovery, et tout faire basculer depuis un plan de récupération.
    - id: b
      text:
        en: Replicate the eight virtual machines with Azure Site Recovery, and fail over everything from a recovery plan.
        fr: Répliquer les huit machines virtuelles avec Azure Site Recovery, et tout faire basculer depuis un plan de récupération.
    - id: c
      text:
        en: Back up the databases with Azure Backup to a vault that has Cross Region Restore, replicate the other virtual machines with Azure Site Recovery, and restore the databases from a recovery plan.
        fr: Sauvegarder les bases de données avec Sauvegarde Azure dans un coffre doté de la restauration interrégion, répliquer les autres machines virtuelles avec Azure Site Recovery, et restaurer les bases de données depuis un plan de récupération.
    - id: d
      text:
        en: Convert the SQL Server virtual machines to a failover cluster instance on shared disks, replicate the eight virtual machines with Azure Site Recovery, and fail over everything from a recovery plan.
        fr: Convertir les machines virtuelles SQL Server en instance de cluster de basculement sur des disques partagés, répliquer les huit machines virtuelles avec Azure Site Recovery, et tout faire basculer depuis un plan de récupération.
answer: { optionId: a }
explanation:
  correct:
    en: |
      Site Recovery creates crash-consistent recovery points every five minutes, which is enough for the web and application servers but not for an RPO under one minute. An asynchronous availability group replica in Central US receives the transaction log continuously, so only the transactions not yet sent can be lost. Site Recovery supports SQL Server Always On natively: a recovery plan can fail over the availability group and then start the other tiers in order.
    fr: |
      Site Recovery crée des points de récupération cohérents en cas d'incident toutes les cinq minutes, ce qui suffit pour les serveurs web et d'applications mais pas pour un RPO inférieur à une minute. Un réplica asynchrone du groupe de disponibilité dans Central US reçoit le journal des transactions en continu : seules les transactions pas encore envoyées peuvent être perdues. Site Recovery prend en charge SQL Server Always On nativement : un plan de récupération peut faire basculer le groupe de disponibilité puis démarrer les autres niveaux dans l'ordre.
  options:
    b:
      en: "Replicating SQL Server with Site Recovery gives recovery points every five minutes at best; for a lower RPO, Microsoft recommends a SQL Server technology such as availability groups."
      fr: "Répliquer SQL Server avec Site Recovery donne au mieux des points de récupération toutes les cinq minutes ; pour un RPO plus faible, Microsoft recommande une technologie SQL Server telle que les groupes de disponibilité."
    c:
      en: "Azure Backup takes log backups of SQL Server every 15 minutes at most, and the recovery points in the paired region lag further; a restore is also slower than a failover."
      fr: "Sauvegarde Azure effectue des sauvegardes du journal de SQL Server toutes les 15 minutes au mieux, et les points de récupération de la région jumelée ont encore plus de retard ; une restauration est aussi plus lente qu'un basculement."
    d:
      en: "Site Recovery doesn't support guest clusters when replicating to an Azure region, and it would still give recovery points every five minutes."
      fr: "Site Recovery ne prend pas en charge les clusters invités lors d'une réplication vers une région Azure, et il ne donnerait toujours que des points de récupération toutes les cinq minutes."
references:
  - title: Set up disaster recovery for SQL Server
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-sql
  - title: About Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-overview
