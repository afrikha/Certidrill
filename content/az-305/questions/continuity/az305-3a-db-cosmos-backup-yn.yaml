id: az305-3a-db-cosmos-backup-yn
objective: "3.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL account that was created with the default backup settings. You are reviewing the backup and restore options of the account.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso possède un compte Azure Cosmos DB for NoSQL créé avec les paramètres de sauvegarde par défaut. Vous examinez les options de sauvegarde et de restauration du compte.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: With the current backup mode, restoring data from a backup requires a support request to Microsoft.
        fr: Avec le mode de sauvegarde actuel, restaurer des données à partir d'une sauvegarde nécessite une demande de support auprès de Microsoft.
    - id: s2
      text:
        en: With the current settings, a full backup is taken every four hours and the latest two backups are kept.
        fr: Avec les paramètres actuels, une sauvegarde complète est effectuée toutes les quatre heures et les deux dernières sauvegardes sont conservées.
    - id: s3
      text:
        en: Switching the account to the 7-day tier of continuous backup adds a charge for backup storage.
        fr: Faire passer le compte au niveau 7 jours de la sauvegarde continue ajoute des frais de stockage de sauvegarde.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      The default mode is periodic backup: a full backup every four hours, with the latest two kept at no extra cost, and a restore that the Azure Cosmos DB team performs after a support request. Continuous backup allows a self-service point-in-time restore; its 7-day tier has no backup storage charge, whereas the 30-day tier is billed per gigabyte and per region.
    fr: |
      Le mode par défaut est la sauvegarde périodique : une sauvegarde complète toutes les quatre heures, les deux dernières étant conservées sans frais supplémentaires, et une restauration effectuée par l'équipe Azure Cosmos DB à la suite d'une demande de support. La sauvegarde continue permet une restauration à un instant dans le passé en libre-service ; son niveau 7 jours n'entraîne aucuns frais de stockage de sauvegarde, alors que le niveau 30 jours est facturé par gigaoctet et par région.
references:
  - title: Periodic backup and restore in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/periodic-backup-restore-introduction
  - title: Continuous backup with point-in-time restore in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/continuous-backup-restore-introduction
