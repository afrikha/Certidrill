id: az305-sr2c-q2
objective: "3.1.4"
type: series_yesno
series: az305-sr2c-blob-rollback
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You recommend an operational backup of the blobs with a 14-day retention.
  fr: |
    Vous recommandez une sauvegarde opérationnelle des objets blob avec une rétention de 14 jours.
body:
  solution:
    en: |
      You recommend creating a **Backup vault** and configuring an **operational backup** of the blobs of stcontoso1 by using a backup policy whose operational backup has a retention of **14 days**.
    fr: |
      Vous recommandez de créer un **coffre de sauvegarde** et de configurer une **sauvegarde opérationnelle** des objets blob de stcontoso1 au moyen d'une stratégie de sauvegarde dont la sauvegarde opérationnelle a une rétention de **14 jours**.
answer: { value: true }
explanation:
  correct:
    en: |
      An operational backup is continuous and has no schedule: it turns on point-in-time restore, blob versioning, the change feed and soft delete in the storage account, so every change is retained for the duration of the policy. Administrators pick any date and time within the 14 days and restore all the block blobs of the account, or selected containers, in one restore operation. The account type of stcontoso1 (standard general-purpose v2, block blobs, no hierarchical namespace) is supported. A new blob backup policy also includes a vaulted backup, which can't be turned off; it doesn't change the answer, because the restore to a point in time comes from the operational backup.
    fr: |
      Une sauvegarde opérationnelle est continue et n'a pas de planification : elle active dans le compte de stockage la restauration à un instant dans le passé, le contrôle de version des objets blob, le flux de modification et la suppression réversible, de sorte que chaque modification est conservée pendant la durée de la stratégie. Les administrateurs choisissent n'importe quelle date et heure dans les 14 jours et restaurent en une seule opération tous les objets blob de blocs du compte, ou des conteneurs sélectionnés. Le type de compte de stcontoso1 (standard usage général v2, objets blob de blocs, pas d'espace de noms hiérarchique) est pris en charge. Une nouvelle stratégie de sauvegarde d'objets blob inclut aussi une sauvegarde archivée, qui ne peut pas être désactivée ; cela ne change pas la réponse, car la restauration à un instant dans le passé provient de la sauvegarde opérationnelle.
references:
  - title: "Overview of Azure Blob backup"
    url: https://learn.microsoft.com/en-us/azure/backup/blob-backup-overview
  - title: "Restore Azure Blobs"
    url: https://learn.microsoft.com/en-us/azure/backup/blob-restore
