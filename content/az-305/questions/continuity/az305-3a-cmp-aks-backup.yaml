id: az305-3a-cmp-aks-backup
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs stateful applications on an Azure Kubernetes Service (AKS) cluster. The applications store their data in persistent volumes backed by Azure Disks through the CSI driver.

    You need to recommend a backup solution. After an incident, Fabrikam must be able to restore selected namespaces, including the Kubernetes resources and the persistent volumes, to the same cluster or to another cluster.

    What should you recommend?
  fr: |
    Fabrikam exécute des applications avec état sur un cluster Azure Kubernetes Service (AKS). Les applications stockent leurs données dans des volumes persistants reposant sur des disques Azure par l'intermédiaire du pilote CSI.

    Vous devez recommander une solution de sauvegarde. Après un incident, Fabrikam doit pouvoir restaurer des espaces de noms choisis, y compris les ressources Kubernetes et les volumes persistants, sur le même cluster ou sur un autre cluster.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "AKS backup with the backup extension in the cluster and a Backup vault", fr: "La sauvegarde AKS avec l'extension de sauvegarde dans le cluster et un coffre de sauvegarde" }
    - id: b
      text: { en: "Azure Disk Backup for each persistent volume disk and a Backup vault", fr: "La sauvegarde de disque Azure pour chaque disque de volume persistant et un coffre de sauvegarde" }
    - id: c
      text: { en: "Azure VM backup of the node virtual machines and a Recovery Services vault", fr: "La sauvegarde de machines virtuelles Azure pour les machines virtuelles des nœuds et un coffre Recovery Services" }
    - id: d
      text: { en: "Azure Site Recovery replication of the node virtual machines to another region", fr: "Une réplication Azure Site Recovery des machines virtuelles des nœuds vers une autre région" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      AKS backup protects the cluster state and the application data of persistent volumes based on the Azure Disks CSI driver. A backup extension installed in the cluster performs the operations driven by a Backup vault, for a whole cluster or for chosen namespaces, and the restore can target the original cluster or another one.
    fr: |
      La sauvegarde AKS protège l'état du cluster et les données applicatives des volumes persistants reposant sur le pilote CSI des disques Azure. Une extension de sauvegarde installée dans le cluster exécute les opérations pilotées par un coffre de sauvegarde, pour un cluster entier ou pour des espaces de noms choisis, et la restauration peut cibler le cluster d'origine ou un autre cluster.
  options:
    b:
      en: "Azure Disk Backup captures the disks only; the Kubernetes resources of the namespaces aren't backed up, and Microsoft recommends AKS backup for disks used as persistent volumes."
      fr: "La sauvegarde de disque Azure ne capture que les disques ; les ressources Kubernetes des espaces de noms ne sont pas sauvegardées, et Microsoft recommande la sauvegarde AKS pour les disques utilisés comme volumes persistants."
    c:
      en: "Backing up node virtual machines doesn't capture Kubernetes objects or persistent volumes in a form that can be restored per namespace."
      fr: "Sauvegarder les machines virtuelles des nœuds ne capture ni les objets Kubernetes ni les volumes persistants sous une forme restaurable par espace de noms."
    d:
      en: "Site Recovery replicates virtual machines for a failover; it isn't a backup and isn't aware of Kubernetes namespaces."
      fr: "Site Recovery réplique des machines virtuelles en vue d'un basculement ; ce n'est pas une sauvegarde et il ne connaît pas les espaces de noms Kubernetes."
references:
  - title: What is Azure Kubernetes Service backup?
    url: https://learn.microsoft.com/en-us/azure/backup/azure-kubernetes-service-backup-overview
