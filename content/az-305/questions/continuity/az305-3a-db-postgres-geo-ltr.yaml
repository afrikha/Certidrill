id: az305-3a-db-postgres-geo-ltr
objective: "3.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys plans to deploy an Azure Database for PostgreSQL flexible server in the East US region for a new application.

    You need to recommend a backup design that meets the following requirements:

    - If East US is lost, the server must be restorable from backups in the paired region.
    - A weekly backup of the databases must be retained for five years.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit de déployer un serveur flexible Azure Database for PostgreSQL dans la région East US pour une nouvelle application.

    Vous devez recommander une conception de sauvegarde qui répond aux exigences suivantes :

    - Si East US est perdue, le serveur doit pouvoir être restauré à partir de sauvegardes dans la région jumelée.
    - Une sauvegarde hebdomadaire des bases de données doit être conservée cinq ans.

    Quelles sont les deux actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the backup retention period of the server to its maximum value.", fr: "Régler la période de rétention des sauvegardes du serveur sur sa valeur maximale." } }
    - { id: b, text: { en: "Select geo-redundant backup storage when the server is created.", fr: "Sélectionner le stockage de sauvegarde géoredondant à la création du serveur." } }
    - { id: c, text: { en: "Create the server with zone-redundant backup storage and switch to geo-redundant backup storage before going live.", fr: "Créer le serveur avec un stockage de sauvegarde redondant interzone et passer au stockage de sauvegarde géoredondant avant la mise en production." } }
    - { id: d, text: { en: "Protect the server with Azure Backup and a retention of five years.", fr: "Protéger le serveur avec Sauvegarde Azure et une rétention de cinq ans." } }
    - { id: e, text: { en: "Enable zone-redundant high availability for the server.", fr: "Activer la haute disponibilité redondante interzone pour le serveur." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Geo-redundant backup storage replicates the backups of the server to the paired region, where a geo-restore creates a new server; it can be selected only when the server is created. The built-in backups are retained 35 days at most, so the five-year retention comes from Azure Backup, which takes weekly backups of the flexible server and can keep them up to 10 years.
    fr: |
      Le stockage de sauvegarde géoredondant réplique les sauvegardes du serveur dans la région jumelée, où une géorestauration crée un nouveau serveur ; il ne peut être sélectionné qu'à la création du serveur. Les sauvegardes intégrées sont conservées 35 jours au plus : la rétention de cinq ans provient donc de Sauvegarde Azure, qui effectue des sauvegardes hebdomadaires du serveur flexible et peut les conserver jusqu'à 10 ans.
  options:
    a:
      en: "The maximum backup retention period of a flexible server is 35 days, far from five years."
      fr: "La période maximale de rétention des sauvegardes d'un serveur flexible est de 35 jours, bien loin de cinq ans."
    c:
      en: "The backup redundancy option can't be changed after the server is provisioned."
      fr: "L'option de redondance des sauvegardes ne peut pas être modifiée une fois le serveur provisionné."
    e:
      en: "Zone-redundant high availability keeps a standby server in another zone of East US; it gives no protection against the loss of the region and no long-term backups."
      fr: "La haute disponibilité redondante interzone maintient un serveur de secours dans une autre zone d'East US ; elle n'apporte ni protection contre la perte de la région ni sauvegardes à long terme."
references:
  - title: Backup and restore in Azure Database for PostgreSQL flexible server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-backup-restore
  - title: About Azure Database for PostgreSQL - Flexible Server backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-database-postgresql-flex-overview
