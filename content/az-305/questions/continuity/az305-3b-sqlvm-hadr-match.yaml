id: az305-3b-sqlvm-hadr-match
objective: "3.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to migrate three SQL Server workloads to SQL Server on Azure Virtual Machines. Each workload has a different availability requirement.

    You need to recommend a SQL Server solution for each requirement.

    Which solution should you recommend for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de migrer trois charges de travail SQL Server vers SQL Server sur Machines virtuelles Azure. Chaque charge de travail a une exigence de disponibilité différente.

    Vous devez recommander une solution SQL Server pour chaque exigence.

    Quelle solution devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ag, text: { en: "Always On availability group", fr: "Groupe de disponibilité Always On" } }
    - { id: fci, text: { en: "Always On failover cluster instance", fr: "Instance de cluster de basculement Always On" } }
    - { id: logship, text: { en: "Log shipping", fr: "Copie des journaux de transaction (log shipping)" } }
    - { id: asr, text: Azure Site Recovery }
  targets:
    - id: instance
      text:
        en: High availability of a whole SQL Server instance inside a region, with the database files stored on Azure shared disks
        fr: La haute disponibilité de toute une instance SQL Server dans une région, avec les fichiers de base de données stockés sur des disques partagés Azure
    - id: databases
      text:
        en: Protection of a set of databases, with replicas in two availability zones of a region and one replica in another region
        fr: La protection d'un ensemble de bases de données, avec des réplicas dans deux zones de disponibilité d'une région et un réplica dans une autre région
    - id: single
      text:
        en: Disaster recovery of one database to an existing SQL Server virtual machine in another region, without a Windows Server failover cluster and with an accepted data loss of 15 minutes
        fr: La reprise d'activité d'une seule base de données vers une machine virtuelle SQL Server existante d'une autre région, sans cluster de basculement Windows Server et avec une perte de données acceptée de 15 minutes
answer:
  mapping: { instance: fci, databases: ag, single: logship }
explanation:
  correct:
    en: A failover cluster instance protects the whole instance and relies on shared storage such as Azure shared disks. An availability group protects databases by replicating them between replicas, which can be placed in several availability zones and in another region. Log shipping sends the transaction log backups of a database to a secondary server through a file share. It needs no cluster and is a low-cost disaster recovery option at the database level.
    fr: Une instance de cluster de basculement protège toute l'instance et repose sur un stockage partagé tel que les disques partagés Azure. Un groupe de disponibilité protège des bases de données en les répliquant entre des réplicas, qui peuvent être placés dans plusieurs zones de disponibilité et dans une autre région. La copie des journaux de transaction envoie les sauvegardes du journal d'une base de données vers un serveur secondaire au moyen d'un partage de fichiers. Elle ne nécessite aucun cluster et constitue une option de reprise d'activité peu coûteuse au niveau de la base de données.
  options:
    asr:
      en: Azure Site Recovery replicates whole virtual machines to another location. It works neither at the instance level with shared storage nor at the level of one database.
      fr: Azure Site Recovery réplique des machines virtuelles entières vers un autre emplacement. Il n'agit ni au niveau de l'instance avec un stockage partagé ni au niveau d'une seule base de données.
references:
  - title: Business continuity and HADR for SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/business-continuity-high-availability-disaster-recovery-hadr-overview
