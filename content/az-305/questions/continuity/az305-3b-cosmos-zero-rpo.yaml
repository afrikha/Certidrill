id: az305-3b-cosmos-zero-rpo
objective: "3.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank plans to store the entries of a ledger in an Azure Cosmos DB for NoSQL account.

    You need to recommend a configuration for the account. The solution must meet the following requirements:

    - The outage of a whole Azure region must not cause the loss of any committed write (RPO of zero).
    - Read requests must still be served during the outage of one region.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit de stocker les entrées d'un grand livre dans un compte Azure Cosmos DB for NoSQL.

    Vous devez recommander une configuration pour le compte. La solution doit répondre aux exigences suivantes :

    - La panne de toute une région Azure ne doit entraîner la perte d'aucune écriture validée (RPO de zéro).
    - Les requêtes de lecture doivent rester servies pendant la panne d'une région.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Regions of the account: [[regions]]

      Default consistency level: [[consistency]]
    fr: |
      Régions du compte : [[regions]]

      Niveau de cohérence par défaut : [[consistency]]
  slots:
    - id: regions
      options:
        - { id: single, text: { en: "One region that has zone redundancy enabled", fr: "Une seule région où la redondance de zone est activée" } }
        - { id: onewrite, text: { en: "Several regions with a single write region", fr: "Plusieurs régions avec une seule région d'écriture" } }
        - { id: multiwrite, text: { en: "Several regions with multiple write regions", fr: "Plusieurs régions avec plusieurs régions d'écriture" } }
    - id: consistency
      options:
        - { id: strong, text: { en: "Strong", fr: "Forte (strong)" } }
        - { id: bounded, text: { en: "Bounded staleness", fr: "Obsolescence limitée (bounded staleness)" } }
        - { id: session, text: Session }
        - { id: eventual, text: { en: "Eventual", fr: "Éventuelle (eventual)" } }
answer:
  values: { regions: onewrite, consistency: strong }
explanation:
  correct:
    en: Strong consistency in an account that has several regions and a single write region is the only configuration with an RPO of zero for a regional outage, because each write is committed in every region before it is acknowledged. The other regions keep serving reads during the outage. Strong consistency can't be combined with multiple write regions.
    fr: La cohérence forte dans un compte doté de plusieurs régions et d'une seule région d'écriture est la seule configuration dont le RPO est de zéro en cas de panne régionale, car chaque écriture est validée dans toutes les régions avant d'être confirmée. Les autres régions continuent de servir les lectures pendant la panne. La cohérence forte ne peut pas être combinée avec plusieurs régions d'écriture.
  options:
    single:
      en: Zone redundancy covers a zone failure only. A single-region account is unavailable during a regional outage, and its RPO isn't zero.
      fr: La redondance de zone ne couvre que la panne d'une zone. Un compte à région unique est indisponible pendant une panne régionale, et son RPO n'est pas de zéro.
    multiwrite:
      en: Multiple write regions replicate asynchronously and don't support strong consistency, so unreplicated writes can be lost.
      fr: Plusieurs régions d'écriture répliquent de façon asynchrone et ne prennent pas en charge la cohérence forte ; des écritures non répliquées peuvent donc être perdues.
    bounded:
      en: With bounded staleness, the RPO is the configured staleness window (a number of versions K or a time T), not zero.
      fr: Avec l'obsolescence limitée, le RPO est la fenêtre d'obsolescence configurée (un nombre de versions K ou une durée T), pas zéro.
    session:
      en: With session consistency, the RPO of a multi-region account is less than 15 minutes, not zero.
      fr: Avec la cohérence de session, le RPO d'un compte multirégion est inférieur à 15 minutes, pas zéro.
    eventual:
      en: With eventual consistency, the RPO of a multi-region account is less than 15 minutes, not zero.
      fr: Avec la cohérence éventuelle, le RPO d'un compte multirégion est inférieur à 15 minutes, pas zéro.
references:
  - title: Consistency levels in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
  - title: Reliability in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-cosmos-db-nosql
