id: az305-3b-zrs-disk-single-instance
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware runs a legacy document-processing application on one Azure virtual machine in availability zone 1 of the North Europe region. The application stores its data on a Premium SSD data disk that uses locally redundant storage (LRS). The application can't be clustered and can run on only one virtual machine at a time.

    You need to recommend a solution that meets the following requirements:

    - If zone 1 fails, no committed data must be lost (RPO of zero).
    - Litware must be able to resume the application on a virtual machine in another zone of North Europe before the zone outage is resolved.
    - Costs must be minimized.

    What should you recommend?
  fr: |
    Litware exécute une ancienne application de traitement de documents sur une machine virtuelle Azure dans la zone de disponibilité 1 de la région North Europe. L'application stocke ses données sur un disque de données Premium SSD qui utilise le stockage localement redondant (LRS). L'application ne peut pas être mise en cluster et ne peut s'exécuter que sur une seule machine virtuelle à la fois.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Si la zone 1 tombe en panne, aucune donnée validée ne doit être perdue (RPO de zéro).
    - Litware doit pouvoir reprendre l'application sur une machine virtuelle d'une autre zone de North Europe avant la fin de la panne de la zone.
    - Les coûts doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Replicate the virtual machine to another availability zone by using Azure Site Recovery.", fr: "Répliquer la machine virtuelle vers une autre zone de disponibilité avec Azure Site Recovery." }
    - id: b
      text: { en: "Move the data to an Ultra Disk, and take an incremental snapshot of the disk every hour.", fr: "Déplacer les données vers un disque Ultra Disk, et prendre un instantané incrémentiel du disque toutes les heures." }
    - id: c
      text: { en: "Move the data to a Premium SSD v2 disk, and attach the disk to a virtual machine in another zone if zone 1 fails.", fr: "Déplacer les données vers un disque Premium SSD v2, et attacher le disque à une machine virtuelle d'une autre zone si la zone 1 tombe en panne." }
    - id: d
      text: { en: "Convert the data disk to zone-redundant storage (ZRS), and attach the disk to a virtual machine in another zone if zone 1 fails.", fr: "Convertir le disque de données en stockage redondant interzone (ZRS), et attacher le disque à une machine virtuelle d'une autre zone si la zone 1 tombe en panne." }
answer: { optionId: d }
explanation:
  correct:
    en: A ZRS managed disk is replicated synchronously across three availability zones, so a zone failure loses no committed write. If the virtual machine is affected, the data disk can be force detached and attached to a virtual machine in another zone. ZRS is available for Premium SSD and Standard SSD disks, and it is the option to choose when the workload can't replicate its own writes across zones.
    fr: Un disque managé ZRS est répliqué de façon synchrone sur trois zones de disponibilité ; la panne d'une zone ne fait donc perdre aucune écriture validée. Si la machine virtuelle est touchée, le disque de données peut être détaché de force puis attaché à une machine virtuelle d'une autre zone. ZRS est disponible pour les disques Premium SSD et Standard SSD, et c'est l'option à retenir quand la charge de travail ne peut pas répliquer elle-même ses écritures entre les zones.
  options:
    a:
      en: Site Recovery replicates asynchronously between zones. It restarts the virtual machine in another zone, but it doesn't provide an RPO of zero.
      fr: Site Recovery réplique de façon asynchrone entre les zones. Il redémarre la machine virtuelle dans une autre zone, mais ne fournit pas un RPO de zéro.
    b:
      en: Ultra Disk supports LRS only, and an hourly snapshot can lose up to one hour of data.
      fr: Ultra Disk ne prend en charge que LRS, et un instantané horaire peut faire perdre jusqu'à une heure de données.
    c:
      en: Premium SSD v2 doesn't support ZRS. Its data stays in one zone and is unavailable while that zone is down.
      fr: Premium SSD v2 ne prend pas en charge ZRS. Ses données restent dans une seule zone et sont indisponibles tant que cette zone est en panne.
references:
