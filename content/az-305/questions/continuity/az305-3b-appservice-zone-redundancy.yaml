id: az305-3b-appservice-zone-redundancy
objective: "3.2.1"
type: dropdown
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Woodgrove Bank hosts a web app on an Azure App Service plan in the Standard tier. The plan runs one instance in a region that supports availability zones.

    You need to recommend a configuration of the App Service plan. The solution must meet the following requirements:

    - The web app must keep serving requests if an availability zone fails, without a manual failover.
    - Costs must be minimized.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank héberge une application web sur un plan Azure App Service de niveau Standard. Le plan exécute une instance dans une région qui prend en charge les zones de disponibilité.

    Vous devez recommander une configuration du plan App Service. La solution doit répondre aux exigences suivantes :

    - L'application web doit continuer à traiter les requêtes si une zone de disponibilité tombe en panne, sans basculement manuel.
    - Les coûts doivent être réduits au minimum.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Tier of the App Service plan: [[tier]]

      Number of instances: [[count]]
    fr: |
      Niveau du plan App Service : [[tier]]

      Nombre d'instances : [[count]]
  slots:
    - id: tier
      options:
        - { id: basic, text: Basic }
        - { id: pv3, text: Premium v3 }
        - { id: standard, text: Standard }
    - id: count
      options:
        - { id: one, text: "1" }
        - { id: two, text: "2" }
        - { id: three, text: "3" }
answer:
  values: { tier: pv3, count: two }
explanation:
  correct:
    en: A zone-redundant App Service plan is available in the Premium v2 to Premium v4 tiers and requires at least two instances, which the platform spreads across zones. Zone redundancy has no separate charge, so Premium v3 with two instances is the cheapest configuration that meets the requirement.
    fr: Un plan App Service redondant interzone est disponible dans les niveaux Premium v2 à Premium v4 et exige au moins deux instances, que la plateforme répartit entre les zones. La redondance de zone n'est pas facturée séparément ; Premium v3 avec deux instances est donc la configuration la moins chère qui répond à l'exigence.
  options:
    basic:
      en: The Basic tier doesn't support zone redundancy.
      fr: Le niveau Basic ne prend pas en charge la redondance de zone.
    standard:
      en: The Standard tier doesn't support zone redundancy. Its instances can share one zone, whatever their number.
      fr: Le niveau Standard ne prend pas en charge la redondance de zone. Ses instances peuvent partager une seule zone, quel que soit leur nombre.
    one:
      en: A zone-redundant plan needs at least two instances. A single instance runs in one zone only.
      fr: Un plan redondant interzone a besoin d'au moins deux instances. Une instance unique ne s'exécute que dans une seule zone.
    three:
      en: Three instances also work, but two are enough to be zone-redundant and cost less.
      fr: Trois instances fonctionnent aussi, mais deux suffisent pour la redondance de zone et coûtent moins cher.
references:
  - title: Reliability in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-app-service
