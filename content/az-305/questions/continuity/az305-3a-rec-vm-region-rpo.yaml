id: az305-3a-rec-vm-region-rpo
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs a line-of-business application on 12 Azure virtual machines in the West Europe region.

    You need to recommend a recovery solution for a region-wide outage. The solution must meet the following requirements:

    - The application must run in North Europe within two hours.
    - No more than 15 minutes of data can be lost.
    - Administrative effort must be minimized.

    What should you recommend?
  fr: |
    Contoso exécute une application métier sur 12 machines virtuelles Azure dans la région West Europe.

    Vous devez recommander une solution de récupération en cas de panne de toute la région. La solution doit répondre aux exigences suivantes :

    - L'application doit fonctionner dans North Europe en moins de deux heures.
    - La perte de données ne doit pas dépasser 15 minutes.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Azure Backup with a geo-redundant vault and Cross Region Restore to North Europe", fr: "Sauvegarde Azure avec un coffre géoredondant et la restauration interrégion (Cross Region Restore) vers North Europe" }
    - id: b
      text: { en: "Azure Backup with an Enhanced policy that runs every four hours", fr: "Sauvegarde Azure avec une stratégie améliorée exécutée toutes les quatre heures" }
    - id: c
      text: { en: "Azure Site Recovery replication of the virtual machines to North Europe", fr: "Une réplication Azure Site Recovery des machines virtuelles vers North Europe" }
    - id: d
      text: { en: "A redeployment of the virtual machines across three availability zones", fr: "Un redéploiement des machines virtuelles sur trois zones de disponibilité" }
answer: { optionId: c }
explanation:
  correct:
    en: Azure Site Recovery replicates the disks of Azure virtual machines continuously to another region and creates crash-consistent recovery points every five minutes, which fits an RPO of 15 minutes. A failover creates the virtual machines in North Europe from the replica disks, and the service is designed for a recovery time of up to one hour, with no scripts to maintain.
    fr: Azure Site Recovery réplique en continu les disques des machines virtuelles Azure vers une autre région et crée des points de récupération cohérents en cas d'incident toutes les cinq minutes, ce qui convient à un RPO de 15 minutes. Un basculement crée les machines virtuelles dans North Europe à partir des disques réplicas, et le service vise un délai de récupération d'une heure au plus, sans script à maintenir.
  options:
    a:
      en: Cross Region Restore restores backups in the paired region, but the recovery points available there can be up to 36 hours old, far from an RPO of 15 minutes.
      fr: La restauration interrégion restaure les sauvegardes dans la région jumelée, mais les points de récupération qui s'y trouvent peuvent dater de 36 heures, bien loin d'un RPO de 15 minutes.
    b:
      en: The Enhanced policy backs up as often as every four hours, so up to four hours of data can be lost, and the backups alone don't provide a recovery in another region.
      fr: La stratégie améliorée sauvegarde au mieux toutes les quatre heures, ce qui peut faire perdre jusqu'à quatre heures de données, et les sauvegardes seules ne fournissent pas de récupération dans une autre région.
    d:
      en: Availability zones protect against the failure of a datacenter inside West Europe; they don't help when the whole region is unavailable.
      fr: Les zones de disponibilité protègent contre la panne d'un centre de données à l'intérieur de West Europe ; elles n'apportent rien lorsque toute la région est indisponible.
references:
  - title: About Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-overview
  - title: Azure to Azure disaster recovery architecture
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-architecture
