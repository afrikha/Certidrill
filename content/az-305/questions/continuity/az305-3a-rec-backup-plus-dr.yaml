id: az305-3a-rec-backup-plus-dr
objective: "3.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank runs a document management application on Azure virtual machines in the UK South region.

    You need to recommend a protection solution that meets the following requirements:

    - After a regional outage, the application must run in UK West within one hour, with an RPO of 15 minutes.
    - A virtual machine must be recoverable as it was at the end of any month of the last five years.

    Which two services should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank exécute une application de gestion documentaire sur des machines virtuelles Azure dans la région UK South.

    Vous devez recommander une solution de protection qui répond aux exigences suivantes :

    - Après une panne régionale, l'application doit fonctionner dans UK West en moins d'une heure, avec un RPO de 15 minutes.
    - Une machine virtuelle doit pouvoir être récupérée dans l'état où elle était à la fin de n'importe quel mois des cinq dernières années.

    Quels sont les deux services à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Azure Resource Mover }
    - { id: b, text: Azure Site Recovery }
    - { id: c, text: Azure Migrate }
    - { id: d, text: { en: "Azure Backup", fr: "Sauvegarde Azure" } }
    - { id: e, text: { en: "Availability zones", fr: "Zones de disponibilité" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Azure Site Recovery replicates the virtual machines continuously to UK West and fails them over within the hour, but it keeps recovery points for 15 days at most. Azure Backup keeps monthly recovery points for years, but a restore in another region doesn't meet an RPO of 15 minutes. The two requirements therefore need both services.
    fr: Azure Site Recovery réplique en continu les machines virtuelles vers UK West et les fait basculer dans l'heure, mais conserve les points de récupération 15 jours au plus. Sauvegarde Azure conserve des points de récupération mensuels pendant des années, mais une restauration dans une autre région ne respecte pas un RPO de 15 minutes. Les deux exigences nécessitent donc les deux services.
  options:
    a:
      en: Azure Resource Mover moves resources to another region once; it neither replicates continuously nor retains recovery points.
      fr: Azure Resource Mover déplace des ressources vers une autre région une seule fois ; il ne réplique pas en continu et ne conserve pas de points de récupération.
    c:
      en: Azure Migrate assesses and migrates workloads to Azure; it isn't a protection service for workloads that already run in Azure.
      fr: Azure Migrate évalue et migre des charges de travail vers Azure ; ce n'est pas un service de protection pour des charges de travail déjà exécutées dans Azure.
    e:
      en: Availability zones protect against a datacenter failure inside UK South, not against a regional outage, and they keep no history.
      fr: Les zones de disponibilité protègent contre la panne d'un centre de données à l'intérieur de UK South, pas contre une panne régionale, et elles ne conservent aucun historique.
references:
  - title: About Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-overview
  - title: What is the Azure Backup service?
    url: https://learn.microsoft.com/en-us/azure/backup/backup-overview
