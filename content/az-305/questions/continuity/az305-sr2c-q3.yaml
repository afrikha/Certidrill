id: az305-sr2c-q3
objective: "3.1.4"
type: series_yesno
series: az305-sr2c-blob-rollback
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You recommend a vaulted backup of the containers that runs once a day.
  fr: |
    Vous recommandez une sauvegarde archivée (vaulted backup) des conteneurs exécutée une fois par jour.
body:
  solution:
    en: |
      You recommend creating a **Backup vault** and configuring a **vaulted backup** of the five containers of stcontoso1 by using a backup policy that runs **one backup per day** and retains the recovery points for **30 days**.
    fr: |
      Vous recommandez de créer un **coffre de sauvegarde** et de configurer une **sauvegarde archivée (vaulted backup)** des cinq conteneurs de stcontoso1 au moyen d'une stratégie de sauvegarde qui exécute **une sauvegarde par jour** et conserve les points de récupération pendant **30 jours**.
answer: { value: false }
explanation:
  correct:
    en: |
      A vaulted backup copies the blobs to the Backup vault at the times set by the schedule, and a restore starts from one of these recovery points. With one backup per day, administrators can only go back to the daily copy that precedes the incident: the state ten minutes before a faulty release can't be restored, and the changes made since that copy are lost. Vaulted backup is the answer when the data must survive the deletion of the storage account, which isn't what Contoso asks for.
    fr: |
      Une sauvegarde archivée copie les objets blob dans le coffre de sauvegarde aux heures fixées par la planification, et une restauration part de l'un de ces points de récupération. Avec une sauvegarde par jour, les administrateurs ne peuvent revenir qu'à la copie quotidienne qui précède l'incident : l'état dix minutes avant une version défectueuse ne peut pas être restauré, et les modifications apportées depuis cette copie sont perdues. La sauvegarde archivée est la réponse quand les données doivent survivre à la suppression du compte de stockage, ce que Contoso ne demande pas.
references:
  - title: "Overview of Azure Blob backup"
    url: https://learn.microsoft.com/en-us/azure/backup/blob-backup-overview
  - title: "Restore Azure Blobs"
