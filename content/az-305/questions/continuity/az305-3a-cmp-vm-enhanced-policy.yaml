id: az305-3a-cmp-vm-enhanced-policy
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has 20 Azure virtual machines that run Windows Server and host an inventory application.

    You need to recommend a backup solution that meets the following requirements:

    - Application-consistent backups of the whole virtual machines must be taken every four hours.
    - Recovery points must be retained for 90 days.
    - A whole virtual machine or individual files must be restorable.
    - Administrative effort must be minimized.

    What should you recommend?
  fr: |
    Contoso possède 20 machines virtuelles Azure exécutant Windows Server et hébergeant une application de gestion des stocks.

    Vous devez recommander une solution de sauvegarde qui répond aux exigences suivantes :

    - Des sauvegardes des machines virtuelles entières, cohérentes au niveau des applications, doivent être effectuées toutes les quatre heures.
    - Les points de récupération doivent être conservés 90 jours.
    - Une machine virtuelle entière ou des fichiers individuels doivent pouvoir être restaurés.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Azure VM backup with a Standard policy", fr: "La sauvegarde de machines virtuelles Azure avec une stratégie standard" }
    - id: b
      text: { en: "Azure VM backup with an Enhanced policy", fr: "La sauvegarde de machines virtuelles Azure avec une stratégie améliorée" }
    - id: c
      text: { en: "Azure Disk Backup with a four-hour schedule", fr: "La sauvegarde de disque Azure avec une planification toutes les quatre heures" }
    - id: d
      text: { en: "Azure Site Recovery with app-consistent snapshots every four hours", fr: "Azure Site Recovery avec des instantanés cohérents au niveau des applications toutes les quatre heures" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Enhanced policy of Azure VM backup supports hourly schedules that run every 4, 6, 8 or 12 hours, so the RPO can go down to four hours. The backups are application-consistent on Windows through VSS, cover the whole virtual machine and allow a restore of the machine, its disks or individual files.
    fr: |
      La stratégie améliorée de la sauvegarde de machines virtuelles Azure prend en charge des planifications horaires exécutées toutes les 4, 6, 8 ou 12 heures, ce qui permet un RPO de quatre heures. Les sauvegardes sont cohérentes au niveau des applications sous Windows grâce à VSS, couvrent la machine virtuelle entière et permettent de restaurer la machine, ses disques ou des fichiers individuels.
  options:
    a:
      en: "The Standard policy backs up a virtual machine once a day at most."
      fr: "La stratégie standard sauvegarde une machine virtuelle une fois par jour au plus."
    c:
      en: "Azure Disk Backup takes crash-consistent snapshots of individual disks; it doesn't provide application consistency, a whole-machine restore or a file restore."
      fr: "La sauvegarde de disque Azure prend des instantanés de disques individuels cohérents en cas d'incident ; elle n'offre ni cohérence au niveau des applications, ni restauration de machine entière, ni restauration de fichiers."
    d:
      en: "Site Recovery is a disaster recovery service that keeps recovery points for 15 days at most; it can't retain them for 90 days."
      fr: "Site Recovery est un service de reprise d'activité qui conserve les points de récupération 15 jours au plus ; il ne peut pas les conserver 90 jours."
references:
  - title: Back up an Azure VM by using the Enhanced policy
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy
  - title: An overview of Azure VM backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-introduction
