id: az305-3a-rec-recovery-plan
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum runs a three-tier application on Azure virtual machines in the East US region. Azure Site Recovery already replicates all the virtual machines to the West US region.

    During a failover, the database virtual machines must start first, then the application servers, then the web servers. After the database tier has started, a script must update a DNS record. The whole failover must be started as a single operation.

    What should you include in the recommendation?
  fr: |
    Adatum exécute une application à trois niveaux sur des machines virtuelles Azure dans la région East US. Azure Site Recovery réplique déjà toutes les machines virtuelles vers la région West US.

    Lors d'un basculement, les machines virtuelles de base de données doivent démarrer en premier, puis les serveurs d'applications, puis les serveurs web. Une fois le niveau base de données démarré, un script doit mettre à jour un enregistrement DNS. L'ensemble du basculement doit être lancé en une seule opération.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - id: a
      text: { en: "A replication group with multi-VM consistency and an Azure Automation runbook", fr: "Un groupe de réplication avec cohérence multimachine virtuelle et un runbook Azure Automation" }
    - id: b
      text: { en: "A recovery plan with three groups and an Azure Automation runbook", fr: "Un plan de récupération avec trois groupes et un runbook Azure Automation" }
    - id: c
      text: { en: "An Azure Traffic Manager profile with priority routing and an Azure Automation runbook", fr: "Un profil Azure Traffic Manager avec routage par priorité et un runbook Azure Automation" }
    - id: d
      text: { en: "A proximity placement group per tier and an Azure Automation runbook", fr: "Un groupe de placement de proximité par niveau et un runbook Azure Automation" }
answer: { optionId: b }
explanation:
  correct:
    en: A recovery plan gathers the replicated machines into groups that fail over one after the other, the machines of a group in parallel. Scripts, manual actions and Azure Automation runbooks can be inserted between the groups, and the whole plan is run as one failover.
    fr: Un plan de récupération rassemble les machines répliquées en groupes qui basculent l'un après l'autre, les machines d'un même groupe en parallèle. Des scripts, des actions manuelles et des runbooks Azure Automation peuvent être insérés entre les groupes, et l'ensemble du plan s'exécute comme un seul basculement.
  options:
    a:
      en: A replication group gives several virtual machines recovery points taken at the same moment; it doesn't define a start order, and a runbook alone would have to script the whole failover.
      fr: Un groupe de réplication donne à plusieurs machines virtuelles des points de récupération pris au même instant ; il ne définit pas d'ordre de démarrage, et un runbook seul devrait scripter tout le basculement.
    c:
      en: Traffic Manager redirects clients to another endpoint by DNS; it doesn't start virtual machines or order a failover.
      fr: Traffic Manager redirige les clients vers un autre point de terminaison par DNS ; il ne démarre pas de machines virtuelles et n'ordonne pas un basculement.
    d:
      en: Proximity placement groups keep resources physically close to reduce latency; they have no role in the failover sequence.
      fr: Les groupes de placement de proximité maintiennent des ressources physiquement proches pour réduire la latence ; ils ne jouent aucun rôle dans la séquence de basculement.
references:
  - title: About recovery plans
    url: https://learn.microsoft.com/en-us/azure/site-recovery/recovery-plan-overview
