id: az305-3a-uns-files-vaulted-backup
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum stores the documents of its finance department in an Azure Files share.

    You need to recommend a backup solution for the share. The backup data must remain available if the storage account that contains the share is deleted or compromised by ransomware. Administrative effort must be minimized.

    What should you recommend?
  fr: |
    Adatum stocke les documents de son service financier dans un partage Azure Files.

    Vous devez recommander une solution de sauvegarde pour le partage. Les données de sauvegarde doivent rester disponibles si le compte de stockage qui contient le partage est supprimé ou compromis par un rançongiciel. L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Azure Files backup that uses the vault-standard tier of a Recovery Services vault", fr: "La sauvegarde Azure Files utilisant le niveau standard du coffre (Vault-Standard) d'un coffre Recovery Services" }
    - id: b
      text: { en: "Azure Files backup that uses the snapshot tier of a Recovery Services vault", fr: "La sauvegarde Azure Files utilisant le niveau instantané d'un coffre Recovery Services" }
    - id: c
      text: { en: "Soft delete for file shares with a retention of 365 days", fr: "La suppression réversible des partages de fichiers avec une rétention de 365 jours" }
    - id: d
      text: { en: "A conversion of the storage account to geo-zone-redundant storage (GZRS)", fr: "Une conversion du compte de stockage en stockage géoredondant interzone (GZRS)" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Vaulted backup of Azure Files takes a share snapshot and then transfers the changed data to the Recovery Services vault. This offsite copy doesn't depend on the source storage account, so it survives the deletion or the compromise of the account, and Azure Backup manages the schedule and the retention.
    fr: |
      La sauvegarde archivée d'Azure Files prend un instantané du partage puis transfère les données modifiées vers le coffre Recovery Services. Cette copie hors site ne dépend pas du compte de stockage source : elle survit à la suppression ou à la compromission du compte, et Sauvegarde Azure gère la planification et la rétention.
  options:
    b:
      en: "With the snapshot tier, the vault stores only a reference: the snapshots stay on the source share and are lost with the storage account."
      fr: "Avec le niveau instantané, le coffre ne stocke qu'une référence : les instantanés restent sur le partage source et sont perdus avec le compte de stockage."
    c:
      en: "Soft delete recovers a deleted share inside an existing account; it gives no copy outside the account."
      fr: "La suppression réversible récupère un partage supprimé à l'intérieur d'un compte existant ; elle ne fournit aucune copie en dehors du compte."
    d:
      en: "Geo-redundancy replicates deletions and encrypted files to the secondary region too, and both copies belong to the same account."
      fr: "La géoredondance réplique aussi les suppressions et les fichiers chiffrés dans la région secondaire, et les deux copies appartiennent au même compte."
references:
  - title: About Azure Files backup
    url: https://learn.microsoft.com/en-us/azure/backup/azure-file-share-backup-overview
