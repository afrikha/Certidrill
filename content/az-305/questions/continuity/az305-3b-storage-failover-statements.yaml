id: az305-3b-storage-failover-statements
objective: "3.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a general-purpose v2 storage account named **stcontoso1** that uses geo-redundant storage (GRS). The primary region of the account is West Europe.

    An outage makes the primary endpoints of stcontoso1 unavailable. Contoso initiates a customer-managed unplanned failover of the account.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un compte de stockage à usage général v2 nommé **stcontoso1** qui utilise le stockage géoredondant (GRS). La région primaire du compte est West Europe.

    Une panne rend indisponibles les points de terminaison primaires de stcontoso1. Contoso lance un basculement non planifié géré par le client pour le compte.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After the failover, the applications must be reconfigured to use new blob endpoint URLs.
        fr: Après le basculement, les applications doivent être reconfigurées pour utiliser de nouvelles URL de point de terminaison d'objets blob.
    - id: s2
      text:
        en: After the failover, the account uses locally redundant storage (LRS) in the new primary region.
        fr: Après le basculement, le compte utilise le stockage localement redondant (LRS) dans la nouvelle région primaire.
    - id: s3
      text:
        en: Blobs that were written to West Europe after the Last Sync Time can be lost.
        fr: Les blobs écrits dans West Europe après l'heure de la dernière synchronisation (Last Sync Time) peuvent être perdus.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: A failover updates the DNS entries of the service endpoints so that they point to the former secondary region. The URLs stay the same. After an unplanned failover, the copy in the original primary region is deleted and the account is converted to LRS, so geo-redundancy must be configured again. Replication to the secondary region is asynchronous. Writes made after the Last Sync Time might not have been copied and are then lost.
    fr: "Un basculement met à jour les entrées DNS des points de terminaison de service pour qu'elles pointent vers l'ancienne région secondaire : les URL restent les mêmes. Après un basculement non planifié, la copie de la région primaire d'origine est supprimée et le compte est converti en LRS ; la géoredondance doit donc être reconfigurée. La réplication vers la région secondaire est asynchrone. Les écritures postérieures à l'heure de la dernière synchronisation peuvent ne pas avoir été copiées et sont alors perdues."
references:
  - title: Azure storage disaster recovery planning and failover
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-disaster-recovery-guidance
