id: az305-3b-sqldb-config-hotarea
objective: "3.2.2"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    Litware has four Azure SQL databases in the West Europe region. The databases are configured as shown in the following table.

    Answer each prompt by selecting the appropriate database in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose de quatre bases de données Azure SQL dans la région West Europe. Les bases de données sont configurées comme indiqué dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la base de données appropriée dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: The database that remains available in West Europe, without data loss, if an availability zone fails
        fr: La base de données qui reste disponible dans West Europe, sans perte de données, si une zone de disponibilité tombe en panne
    - id: p2
      text:
        en: The database that applications reach through the same listener endpoint after a failover to North Europe
        fr: La base de données que les applications atteignent par le même point de terminaison d'écouteur après un basculement vers North Europe
  grid:
    header:
      - { en: "Database", fr: "Base de données" }
      - { en: "Service tier", fr: "Niveau de service" }
      - { en: "Zone redundancy", fr: "Redondance de zone" }
      - { en: "Replication to North Europe", fr: "Réplication vers North Europe" }
    rows:
      - [{ text: DB1, area: db1 }, { text: "Standard (DTU)" }, { text: { en: "Disabled", fr: "Désactivée" } }, { text: { en: "Active geo-replication", fr: "Géoréplication active" } }]
      - [{ text: DB2, area: db2 }, { text: General Purpose }, { text: { en: "Enabled", fr: "Activée" } }, { text: { en: "None", fr: "Aucune" } }]
      - [{ text: DB3, area: db3 }, { text: Business Critical }, { text: { en: "Disabled", fr: "Désactivée" } }, { text: { en: "Failover group", fr: "Groupe de basculement" } }]
      - [{ text: DB4, area: db4 }, { text: General Purpose }, { text: { en: "Disabled", fr: "Désactivée" } }, { text: { en: "None", fr: "Aucune" } }]
answer:
  values: { p1: db2, p2: db3 }
explanation:
  correct:
    en: Only DB2 is zone-redundant. Its data is replicated synchronously across zones, so a zone failure loses no committed data. A database without zone redundancy is locally redundant only, whatever its tier. A failover group provides listener endpoints that keep pointing to the current primary after a failover, which is the case of DB3. With active geo-replication (DB1), the new primary is on another logical server and the endpoint changes.
    fr: Seule DB2 est redondante interzone. Ses données sont répliquées de façon synchrone entre les zones ; la panne d'une zone ne fait donc perdre aucune donnée validée. Une base de données sans redondance de zone n'est que localement redondante, quel que soit son niveau. Un groupe de basculement fournit des points de terminaison d'écouteur qui continuent de pointer vers la base primaire actuelle après un basculement, ce qui est le cas de DB3. Avec la géoréplication active (DB1), la nouvelle base primaire se trouve sur un autre serveur logique et le point de terminaison change.
references:
  - title: Availability through redundancy - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla-local-zone-redundancy
  - title: Failover groups overview & best practices (Azure SQL Database)
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
