id: az305-3a-rec-solution-match
objective: "3.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs three applications on Azure virtual machines in the Australia East region. Each application has a different recovery requirement.

    You need to recommend a recovery solution for each application. Costs must be minimized.

    Which solution should you recommend for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys exécute trois applications sur des machines virtuelles Azure dans la région Australia East. Chaque application a une exigence de récupération différente.

    Vous devez recommander une solution de récupération pour chaque application. Les coûts doivent être réduits au minimum.

    Quelle solution devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: r2r, text: { en: "Azure Site Recovery, region to region", fr: "Azure Site Recovery, de région à région" } }
    - { id: z2z, text: { en: "Azure Site Recovery, zone to zone", fr: "Azure Site Recovery, de zone à zone" } }
    - { id: bkp, text: { en: "Azure Backup", fr: "Sauvegarde Azure" } }
    - { id: mover, text: Azure Resource Mover }
    - { id: migrate, text: Azure Migrate }
  targets:
    - id: t1
      text: { en: "App1 must run in Australia Southeast within one hour of a region-wide outage of Australia East.", fr: "App1 doit fonctionner dans Australia Southeast moins d'une heure après une panne de toute la région Australia East." }
    - id: t2
      text: { en: "App2 must be recoverable as it was three months ago if ransomware is discovered late.", fr: "App2 doit pouvoir être récupérée dans l'état où elle était il y a trois mois si un rançongiciel est découvert tardivement." }
    - id: t3
      text: { en: "App3 must restart in another datacenter after a datacenter failure, and its replicated data must stay in Australia East.", fr: "App3 doit redémarrer dans un autre centre de données après la panne d'un centre de données, et ses données répliquées doivent rester dans Australia East." }
answer:
  mapping: { t1: r2r, t2: bkp, t3: z2z }
explanation:
  correct:
    en: |
      Region-to-region replication with Azure Site Recovery restarts virtual machines in another region with a recovery time of up to one hour. Site Recovery keeps recovery points for 15 days at most, so going back three months requires the long retention of Azure Backup. Zone-to-zone replication protects against the loss of a datacenter while keeping all replicated data inside the region.
    fr: |
      La réplication de région à région avec Azure Site Recovery redémarre des machines virtuelles dans une autre région avec un délai de récupération d'une heure au plus. Site Recovery conserve les points de récupération 15 jours au plus : revenir trois mois en arrière exige la rétention longue de Sauvegarde Azure. La réplication de zone à zone protège contre la perte d'un centre de données tout en gardant toutes les données répliquées dans la région.
  options:
    mover: { en: "Azure Resource Mover relocates resources to another region as a one-time operation; it isn't a recovery service.", fr: "Azure Resource Mover déplace des ressources vers une autre région en une opération ponctuelle ; ce n'est pas un service de récupération." }
    migrate: { en: "Azure Migrate assesses and migrates workloads to Azure; it doesn't protect workloads that already run there.", fr: "Azure Migrate évalue et migre des charges de travail vers Azure ; il ne protège pas les charges de travail qui s'y exécutent déjà." }
references:
  - title: About Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-overview
  - title: Enable Azure VM disaster recovery between availability zones
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-how-to-enable-zone-to-zone-disaster-recovery
