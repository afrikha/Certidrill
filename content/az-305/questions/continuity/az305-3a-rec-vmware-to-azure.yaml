id: az305-3a-rec-vmware-to-azure
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a single on-premises datacenter that hosts 120 VMware vSphere virtual machines. Litware has an Azure subscription but no second datacenter.

    You need to recommend a disaster recovery solution for the virtual machines. The solution must meet the following requirements:

    - After the loss of the datacenter, the workloads must run in Azure with an RPO of 15 minutes.
    - Compute costs in Azure must be incurred only during a failover or a test failover.
    - When the datacenter is available again, the workloads must be brought back on-premises.

    What should you recommend?
  fr: |
    Litware possède un seul centre de données local qui héberge 120 machines virtuelles VMware vSphere. Litware dispose d'un abonnement Azure mais d'aucun second centre de données.

    Vous devez recommander une solution de reprise d'activité pour les machines virtuelles. La solution doit répondre aux exigences suivantes :

    - Après la perte du centre de données, les charges de travail doivent fonctionner dans Azure avec un RPO de 15 minutes.
    - Les coûts de calcul dans Azure ne doivent être facturés que pendant un basculement ou un test de basculement.
    - Lorsque le centre de données est de nouveau disponible, les charges de travail doivent revenir en local.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Microsoft Azure Backup Server (MABS) with backups sent to a Recovery Services vault", fr: "Microsoft Azure Backup Server (MABS) avec des sauvegardes envoyées vers un coffre Recovery Services" }
    - id: b
      text: { en: "Azure Migrate with agentless replication of the virtual machines", fr: "Azure Migrate avec une réplication sans agent des machines virtuelles" }
    - id: c
      text: { en: "The MARS agent installed on each virtual machine", fr: "L'agent MARS installé sur chaque machine virtuelle" }
    - id: d
      text: { en: "Azure Site Recovery with a replication appliance in the datacenter", fr: "Azure Site Recovery avec une appliance de réplication dans le centre de données" }
answer: { optionId: d }
explanation:
  correct:
    en: Azure Site Recovery replicates VMware virtual machines to Azure almost continuously through an on-premises replication appliance and the Mobility service, with crash-consistent recovery points every five minutes. Azure virtual machines are created only at failover or test failover, so compute is billed only then, and after a failover the machines can be reprotected and failed back to the datacenter.
    fr: Azure Site Recovery réplique les machines virtuelles VMware vers Azure de façon quasi continue grâce à une appliance de réplication locale et au service Mobilité, avec des points de récupération cohérents en cas d'incident toutes les cinq minutes. Les machines virtuelles Azure ne sont créées qu'au basculement ou au test de basculement, le calcul n'est donc facturé qu'à ce moment-là, et après un basculement les machines peuvent être reprotégées puis ramenées dans le centre de données.
  options:
    a:
      en: MABS is a backup product. Scheduled backups can't give an RPO of 15 minutes for 120 virtual machines, and a backup doesn't start the workloads in Azure.
      fr: MABS est un produit de sauvegarde. Des sauvegardes planifiées ne peuvent pas offrir un RPO de 15 minutes pour 120 machines virtuelles, et une sauvegarde ne démarre pas les charges de travail dans Azure.
    b:
      en: Azure Migrate replicates machines for a one-way migration to Azure; it isn't a standing disaster recovery service with failover and failback.
      fr: Azure Migrate réplique des machines pour une migration à sens unique vers Azure ; ce n'est pas un service permanent de reprise d'activité avec basculement et restauration automatique.
    c:
      en: The MARS agent backs up files, folders and the system state of Windows machines; it can't fail over whole virtual machines to Azure.
      fr: L'agent MARS sauvegarde les fichiers, les dossiers et l'état du système de machines Windows ; il ne peut pas faire basculer des machines virtuelles entières vers Azure.
references:
  - title: VMware to Azure disaster recovery architecture - Modernized
    url: https://learn.microsoft.com/en-us/azure/site-recovery/vmware-azure-architecture-modernized
  - title: General questions about Azure Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-faq
