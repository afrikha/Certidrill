id: az305-3b-cosmos-multi-region-writes
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is developing a shopping cart service that stores JSON documents in Azure Cosmos DB for NoSQL. The users of the service are in North America, Europe and Asia.

    You need to recommend a configuration for the Azure Cosmos DB account. The solution must meet the following requirements:

    - If any single Azure region fails, the service must continue to read and write without a manual action and without waiting for a failover.
    - Write latency must be minimized for the users of the three continents.
    - Session consistency is sufficient.

    What should you recommend?
  fr: |
    Tailspin Toys développe un service de panier d'achat qui stocke des documents JSON dans Azure Cosmos DB for NoSQL. Les utilisateurs du service se trouvent en Amérique du Nord, en Europe et en Asie.

    Vous devez recommander une configuration pour le compte Azure Cosmos DB. La solution doit répondre aux exigences suivantes :

    - Si une région Azure quelconque tombe en panne, le service doit continuer à lire et à écrire sans action manuelle et sans attendre un basculement.
    - La latence d'écriture doit être réduite au minimum pour les utilisateurs des trois continents.
    - La cohérence de session est suffisante.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "One region that has zone redundancy enabled", fr: "Une seule région où la redondance de zone est activée" }
    - id: b
      text: { en: "Three regions with one write region, and service-managed failover", fr: "Trois régions avec une seule région d'écriture, et le basculement géré par le service" }
    - id: c
      text: { en: "Three regions that are all write regions", fr: "Trois régions qui sont toutes des régions d'écriture" }
    - id: d
      text: { en: "Three regions with one write region, and strong consistency", fr: "Trois régions avec une seule région d'écriture, et la cohérence forte (strong)" }
answer: { optionId: c }
explanation:
  correct:
    en: With multiple write regions, every region accepts reads and writes. If one region fails, the SDK routes the requests to a healthy region with no failover and no expected downtime, and users write to the region closest to them, which gives the lowest write latency. Multi-region writes aren't compatible with strong consistency, but session consistency is enough here.
    fr: Avec plusieurs régions d'écriture, chaque région accepte les lectures et les écritures. Si une région tombe en panne, le SDK achemine les requêtes vers une région saine sans basculement et sans interruption attendue, et les utilisateurs écrivent dans la région la plus proche, ce qui donne la latence d'écriture la plus faible. Les écritures multirégions ne sont pas compatibles avec la cohérence forte, mais la cohérence de session suffit ici.
  options:
    a:
      en: Zone redundancy covers the failure of a zone. A single-region account loses read and write access if its region fails.
      fr: La redondance de zone couvre la panne d'une zone. Un compte à région unique perd l'accès en lecture et en écriture si sa région tombe en panne.
    b:
      en: With one write region, writes stop when that region fails until a failover completes, and a service-managed failover can take an hour or more to start. Users far from the write region also have a higher write latency.
      fr: Avec une seule région d'écriture, les écritures s'arrêtent quand cette région tombe en panne jusqu'à la fin d'un basculement, et un basculement géré par le service peut mettre une heure ou plus à démarrer. Les utilisateurs éloignés de la région d'écriture ont aussi une latence d'écriture plus élevée.
    d:
      en: Strong consistency doesn't remove the dependency on the single write region, and it raises write latency because each write is committed in every region.
      fr: La cohérence forte ne supprime pas la dépendance à l'unique région d'écriture, et elle augmente la latence d'écriture, car chaque écriture est validée dans toutes les régions.
references:
  - title: Reliability in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-cosmos-db-nosql
