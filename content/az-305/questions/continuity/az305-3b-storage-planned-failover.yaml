id: az305-3b-storage-planned-failover
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a general-purpose v2 storage account that uses geo-redundant storage (GRS). The primary region of the account is East US, and the secondary region is West US.

    A hurricane is forecast to reach the East US datacenters in three days. Both regions are currently available.

    You need to recommend how to make West US the primary region of the account before the hurricane arrives. The solution must meet the following requirements:

    - No data must be lost.
    - The account must remain geo-redundant after the operation.

    What should you recommend?
  fr: |
    Northwind Traders dispose d'un compte de stockage à usage général v2 qui utilise le stockage géoredondant (GRS). La région primaire du compte est East US, et la région secondaire est West US.

    Un ouragan devrait atteindre les centres de données de East US dans trois jours. Les deux régions sont actuellement disponibles.

    Vous devez recommander la façon de faire de West US la région primaire du compte avant l'arrivée de l'ouragan. La solution doit répondre aux exigences suivantes :

    - Aucune donnée ne doit être perdue.
    - Le compte doit rester géoredondant après l'opération.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Initiate a customer-managed unplanned failover.", fr: "Lancer un basculement non planifié géré par le client." }
    - id: b
      text: { en: "Change the redundancy of the account to RA-GRS.", fr: "Faire passer la redondance du compte à RA-GRS." }
    - id: c
      text: { en: "Initiate a customer-managed planned failover.", fr: "Lancer un basculement planifié géré par le client." }
    - id: d
      text: { en: "Wait for a Microsoft-managed failover.", fr: "Attendre un basculement géré par Microsoft." }
answer: { optionId: c }
explanation:
  correct:
    en: A customer-managed planned failover is designed for the case in which both regions are available, for example to prepare for a large-scale disaster. The two regions swap their roles after the data is synchronized, so no data loss is expected, and the account keeps its geo-redundancy with the former primary region as the new secondary.
    fr: Un basculement planifié géré par le client est conçu pour le cas où les deux régions sont disponibles, par exemple pour se préparer à un sinistre de grande ampleur. Les deux régions échangent leurs rôles une fois les données synchronisées ; aucune perte de données n'est donc attendue, et le compte conserve sa géoredondance avec l'ancienne région primaire comme nouvelle région secondaire.
  options:
    a:
      en: An unplanned failover doesn't wait for the last writes to be replicated, and it converts the account to LRS in the new primary region.
      fr: Un basculement non planifié n'attend pas la réplication des dernières écritures, et il convertit le compte en LRS dans la nouvelle région primaire.
    b:
      en: RA-GRS adds read access to the secondary region. The primary region remains East US, and writes still go there.
      fr: RA-GRS ajoute l'accès en lecture à la région secondaire. La région primaire reste East US, et les écritures y sont toujours envoyées.
    d:
      en: A Microsoft-managed failover is decided by Microsoft for a whole region after a severe disaster. Its timing is out of your control, and data loss is expected.
      fr: Un basculement géré par Microsoft est décidé par Microsoft pour toute une région après un sinistre grave. Son moment échappe à votre contrôle, et une perte de données est attendue.
references:
  - title: Azure storage disaster recovery planning and failover
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-disaster-recovery-guidance
