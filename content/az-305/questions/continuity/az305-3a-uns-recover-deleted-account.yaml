id: az305-3a-uns-recover-deleted-account
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso had a general-purpose v2 storage account named stcontosodata that stored documents as blobs. Blob soft delete and container soft delete were enabled with a retention of 30 days. The account wasn't protected by Azure Backup.

    Three days ago, an administrator deleted the storage account by mistake. The resource group still exists, and no storage account named stcontosodata has been created since.

    You need to recommend how to recover the documents with the least effort.

    What should you recommend?
  fr: |
    Contoso possédait un compte de stockage à usage général v2 nommé stcontosodata qui stockait des documents sous forme d'objets blob. La suppression réversible des objets blob et celle des conteneurs étaient activées avec une rétention de 30 jours. Le compte n'était pas protégé par Sauvegarde Azure.

    Il y a trois jours, un administrateur a supprimé le compte de stockage par erreur. Le groupe de ressources existe toujours, et aucun compte de stockage nommé stcontosodata n'a été créé depuis.

    Vous devez recommander la manière de récupérer les documents avec le moins d'effort.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Create a storage account named stcontosodata, and then restore the soft-deleted containers.", fr: "Créer un compte de stockage nommé stcontosodata, puis restaurer les conteneurs supprimés de manière réversible." }
    - id: b
      text: { en: "Initiate a customer-managed failover of stcontosodata to the secondary region.", fr: "Lancer un basculement géré par le client de stcontosodata vers la région secondaire." }
    - id: c
      text: { en: "Recover the deleted storage account from the Azure portal.", fr: "Récupérer le compte de stockage supprimé depuis le portail Azure." }
    - id: d
      text: { en: "Restore the blobs to a new storage account from a Backup vault.", fr: "Restaurer les objets blob dans un nouveau compte de stockage à partir d'un coffre de sauvegarde." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A deleted storage account can be recovered when it was created with the Azure Resource Manager deployment model, was deleted within the past 14 days, and no new account with the same name has been created since. All three conditions are met here, so recovering the account brings back its data.
    fr: |
      Un compte de stockage supprimé peut être récupéré s'il a été créé avec le modèle de déploiement Azure Resource Manager, s'il a été supprimé au cours des 14 derniers jours et si aucun nouveau compte portant le même nom n'a été créé depuis. Les trois conditions sont réunies ici : récupérer le compte permet de retrouver ses données.
  options:
    a:
      en: "Soft delete protects blobs and containers inside an existing account, not the account itself, and creating a new account with the same name would prevent the recovery of the deleted one."
      fr: "La suppression réversible protège des objets blob et des conteneurs à l'intérieur d'un compte existant, pas le compte lui-même, et créer un nouveau compte portant le même nom empêcherait la récupération du compte supprimé."
    b:
      en: "A failover applies to an existing geo-redundant account whose primary region is unavailable; a deleted account can't be failed over."
      fr: "Un basculement s'applique à un compte géoredondant existant dont la région primaire est indisponible ; un compte supprimé ne peut pas être basculé."
    d:
      en: "The account wasn't protected by Azure Backup, so no vaulted copy of the blobs exists."
      fr: "Le compte n'était pas protégé par Sauvegarde Azure : il n'existe donc aucune copie archivée des objets blob."
references:
  - title: Data protection overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-protection-overview
