id: az305-3a-uns-blob-protection-match
objective: "3.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys stores blobs in a general-purpose v2 storage account. You are choosing the data protection features of the account.

    You need to recommend a feature for each requirement.

    Which feature should you recommend for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys stocke des objets blob dans un compte de stockage à usage général v2. Vous choisissez les fonctionnalités de protection des données du compte.

    Vous devez recommander une fonctionnalité pour chaque exigence.

    Quelle fonctionnalité devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: bsd, text: { en: "Blob soft delete", fr: "Suppression réversible des objets blob" } }
    - { id: csd, text: { en: "Container soft delete", fr: "Suppression réversible des conteneurs" } }
    - { id: hold, text: { en: "Legal hold", fr: "Conservation légale" } }
    - { id: lock, text: { en: "CanNotDelete resource lock", fr: "Verrou de ressource CanNotDelete" } }
    - { id: repl, text: { en: "Object replication", fr: "Réplication d'objets" } }
  targets:
    - id: t1
      text: { en: "Recover a single blob that a user deleted three days ago.", fr: "Récupérer un objet blob isolé qu'un utilisateur a supprimé il y a trois jours." }
    - id: t2
      text: { en: "Recover a container, with all its blobs, that a script deleted yesterday.", fr: "Récupérer un conteneur, avec tous ses objets blob, qu'un script a supprimé hier." }
    - id: t3
      text: { en: "Keep the blobs of a container unmodifiable until an investigation ends, at a date that isn't known yet.", fr: "Garder les objets blob d'un conteneur non modifiables jusqu'à la fin d'une enquête, à une date encore inconnue." }
answer:
  mapping: { t1: bsd, t2: csd, t3: hold }
explanation:
  correct:
    en: |
      Blob soft delete keeps a deleted blob recoverable during the retention period, but it doesn't cover the deletion of a container: that is the role of container soft delete, which restores the container with its blobs. A legal hold keeps blobs in a write once, read many state until the hold is explicitly cleared, which fits a protection period of unknown length.
    fr: |
      La suppression réversible des objets blob garde un objet blob supprimé récupérable pendant la période de rétention, mais elle ne couvre pas la suppression d'un conteneur : c'est le rôle de la suppression réversible des conteneurs, qui restaure le conteneur avec ses objets blob. Une conservation légale maintient les objets blob dans un état WORM (write once, read many) jusqu'à sa levée explicite, ce qui convient à une période de protection de durée inconnue.
  options:
    lock: { en: "A CanNotDelete lock protects the storage account resource against deletion; it doesn't protect containers or blobs.", fr: "Un verrou CanNotDelete protège la ressource compte de stockage contre la suppression ; il ne protège ni les conteneurs ni les objets blob." }
    repl: { en: "Object replication maintains a copy in another account; it doesn't restore deleted data in the source account or make it unmodifiable.", fr: "La réplication d'objets maintient une copie dans un autre compte ; elle ne restaure pas les données supprimées dans le compte source et ne les rend pas non modifiables." }
references:
  - title: Data protection overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-protection-overview
  - title: Store business-critical blob data with immutable storage in a write once, read many (WORM) state
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview
