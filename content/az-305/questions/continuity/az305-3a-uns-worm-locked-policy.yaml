id: az305-3a-uns-worm-locked-policy
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank must store trade confirmations as blobs in an Azure Storage account.

    You need to recommend a protection that meets the following requirements:

    - For seven years after its creation, a confirmation can't be modified or deleted by anyone, including the administrators of the storage account.
    - After seven years, a confirmation can be deleted.
    - The configuration must comply with SEC Rule 17a-4(f).

    What should you recommend for the container that stores the confirmations?
  fr: |
    Woodgrove Bank doit stocker des confirmations de transactions sous forme d'objets blob dans un compte Stockage Azure.

    Vous devez recommander une protection qui répond aux exigences suivantes :

    - Pendant sept ans après sa création, une confirmation ne peut être ni modifiée ni supprimée par quiconque, y compris les administrateurs du compte de stockage.
    - Au bout de sept ans, une confirmation peut être supprimée.
    - La configuration doit être conforme à la règle SEC 17a-4(f).

    Que devez-vous recommander pour le conteneur qui stocke les confirmations ?
body:
  options:
    - id: a
      text: { en: "A legal hold", fr: "Une conservation légale" }
    - id: b
      text: { en: "A CanNotDelete lock and blob soft delete with a retention of 365 days", fr: "Un verrou CanNotDelete et la suppression réversible des objets blob avec une rétention de 365 jours" }
    - id: c
      text: { en: "A time-based retention policy of seven years that is left unlocked", fr: "Une stratégie de rétention limitée dans le temps de sept ans, laissée déverrouillée" }
    - id: d
      text: { en: "A time-based retention policy of seven years that is locked", fr: "Une stratégie de rétention limitée dans le temps de sept ans, verrouillée" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A time-based retention policy keeps blobs in a write once, read many (WORM) state for the specified interval: during that time nobody, not even an account administrator, can overwrite or delete them, and after it they can be deleted. Locking the policy is what makes it compliant with SEC Rule 17a-4(f): a locked policy can't be deleted, and its retention can be extended but never shortened.
    fr: |
      Une stratégie de rétention limitée dans le temps maintient les objets blob dans un état WORM (write once, read many) pendant l'intervalle indiqué : durant cette période, personne, pas même un administrateur du compte, ne peut les remplacer ni les supprimer, et ensuite ils peuvent être supprimés. C'est le verrouillage de la stratégie qui la rend conforme à la règle SEC 17a-4(f) : une stratégie verrouillée ne peut pas être supprimée, et sa rétention peut être prolongée mais jamais raccourcie.
  options:
    a:
      en: "A legal hold protects blobs until it is explicitly cleared; it suits an unknown duration, not a fixed period of seven years, and a user with the right permission can clear it."
      fr: "Une conservation légale protège les objets blob jusqu'à sa levée explicite ; elle convient à une durée inconnue, pas à une période fixe de sept ans, et un utilisateur disposant de l'autorisation adéquate peut la lever."
    b:
      en: "A resource lock protects the storage account resource, not its blobs, and soft delete only keeps deleted data recoverable for at most 365 days."
      fr: "Un verrou de ressource protège la ressource compte de stockage, pas ses objets blob, et la suppression réversible ne fait que garder les données supprimées récupérables pendant 365 jours au plus."
    c:
      en: "An unlocked policy is meant for testing: it can be shortened or deleted, so it doesn't meet the compliance requirement."
      fr: "Une stratégie déverrouillée est prévue pour les tests : elle peut être raccourcie ou supprimée, et ne répond donc pas à l'exigence de conformité."
references:
  - title: Store business-critical blob data with immutable storage in a write once, read many (WORM) state
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview
