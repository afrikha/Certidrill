id: az305-cs1b-loyalty-cosmos
objective: "3.2.3"
type: yesno_statements
caseStudy: az305-cs1b-blue-yonder
difficulty: 2
status: draft
stem:
  en: |
    You plan to create the Azure Cosmos DB for NoSQL account of the loyalty program with two regions, West Europe and East US 2, and to enable multi-region writes.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer le compte Azure Cosmos DB for NoSQL du programme de fidélité avec deux régions, West Europe et East US 2, et d'activer les écritures multirégions.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The account can use strong consistency as its default consistency level.
        fr: Le compte peut utiliser la cohérence forte (Strong) comme niveau de cohérence par défaut.
    - id: s2
      text:
        en: Session consistency meets the requirement about the balance that a member sees after earning points.
        fr: La cohérence de session (Session) répond à l'exigence relative au solde qu'un membre voit après avoir gagné des points.
    - id: s3
      text:
        en: If West Europe fails, an administrator must promote East US 2 to write region before the loyalty service can write again.
        fr: Si West Europe tombe en panne, un administrateur doit promouvoir East US 2 en région d'écriture avant que le service de fidélité puisse de nouveau écrire.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      An account with multiple write regions can't use strong consistency. Session consistency guarantees that, within a client session, reads honor read-your-writes: the member sees the points that the same session has just written. With multi-region writes every region accepts writes at any time: when West Europe fails, the SDK sends the operations to the remaining region, and the loyalty service in East US 2 continues to write without a failover.
    fr: |
      Un compte à plusieurs régions d'écriture ne peut pas utiliser la cohérence forte. La cohérence de session garantit que, dans une session cliente, les lectures voient les écritures de cette session : le membre voit les points que la même session vient d'écrire. Avec les écritures multirégions, chaque région accepte les écritures à tout moment : quand West Europe tombe en panne, le SDK envoie les opérations vers la région restante, et le service de fidélité dans East US 2 continue d'écrire sans basculement.
references:
  - title: Consistency levels in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
  - title: Reliability in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-cosmos-db-nosql
