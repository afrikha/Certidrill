id: az305-3b-files-ssd-zone
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware plans to create an SMB Azure file share for an application that requires the low latency of SSD storage. The share will be created in a region that supports availability zones.

    You need to recommend a configuration for the file share. The solution must meet the following requirements:

    - The share must remain available if an availability zone fails, and the clients must not have to remount it.
    - Costs must be minimized.

    What should you recommend?
  fr: |
    Proseware prévoit de créer un partage de fichiers Azure SMB pour une application qui exige la faible latence du stockage SSD. Le partage sera créé dans une région qui prend en charge les zones de disponibilité.

    Vous devez recommander une configuration pour le partage de fichiers. La solution doit répondre aux exigences suivantes :

    - Le partage doit rester disponible si une zone de disponibilité tombe en panne, et les clients ne doivent pas avoir à le remonter.
    - Les coûts doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "An SSD file share in an account that uses zone-redundant storage (ZRS)", fr: "Un partage de fichiers SSD dans un compte qui utilise le stockage redondant interzone (ZRS)" }
    - id: b
      text: { en: "An SSD file share in an account that uses locally redundant storage (LRS)", fr: "Un partage de fichiers SSD dans un compte qui utilise le stockage localement redondant (LRS)" }
    - id: c
      text: { en: "An SSD file share in an account that uses geo-zone-redundant storage (GZRS)", fr: "Un partage de fichiers SSD dans un compte qui utilise le stockage géoredondant interzone (GZRS)" }
    - id: d
      text: { en: "An HDD file share in an account that uses zone-redundant storage (ZRS)", fr: "Un partage de fichiers HDD dans un compte qui utilise le stockage redondant interzone (ZRS)" }
answer: { optionId: a }
explanation:
  correct:
    en: SSD file shares support LRS and ZRS only. With ZRS the share is replicated synchronously across the availability zones of the region, and the clients don't need to remount it when a zone fails.
    fr: Les partages de fichiers SSD ne prennent en charge que LRS et ZRS. Avec ZRS, le partage est répliqué de façon synchrone entre les zones de disponibilité de la région, et les clients n'ont pas besoin de le remonter quand une zone tombe en panne.
  options:
    b:
      en: LRS keeps the three copies in one datacenter, so the share is unavailable if that datacenter fails.
      fr: LRS conserve les trois copies dans un seul centre de données ; le partage est donc indisponible si ce centre de données tombe en panne.
    c:
      en: SSD file shares don't support GRS or GZRS. Only HDD file shares can be geo-redundant.
      fr: Les partages de fichiers SSD ne prennent en charge ni GRS ni GZRS. Seuls les partages de fichiers HDD peuvent être géoredondants.
    d:
      en: An HDD file share with ZRS survives a zone failure, but it doesn't provide the low latency of SSD storage that the application requires.
      fr: Un partage de fichiers HDD en ZRS survit à la panne d'une zone, mais il n'offre pas la faible latence du stockage SSD qu'exige l'application.
references:
  - title: Azure Files data redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/files/files-redundancy
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
