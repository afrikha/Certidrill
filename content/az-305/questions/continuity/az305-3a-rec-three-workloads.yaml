id: az305-3a-rec-three-workloads
objective: "3.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has the workloads shown in the following table.

    | Workload | Platform | RTO | RPO |
    | --- | --- | --- | --- |
    | WL1 | Hyper-V virtual machines in the only on-premises datacenter | 2 hours | 30 minutes |
    | WL2 | Azure virtual machines in West Europe | 72 hours | 48 hours |
    | WL3 | Azure virtual machines in West Europe | 1 hour | 15 minutes |

    The objectives apply to the loss of the datacenter for WL1 and to a region-wide outage of West Europe for WL2 and WL3. In addition, a daily recovery point of WL2 must be retained for one year.

    You need to recommend a recovery solution for each workload. Costs must be minimized.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders possède les charges de travail présentées dans le tableau suivant.

    | Charge de travail | Plateforme | RTO | RPO |
    | --- | --- | --- | --- |
    | WL1 | Machines virtuelles Hyper-V dans l'unique centre de données local | 2 heures | 30 minutes |
    | WL2 | Machines virtuelles Azure dans West Europe | 72 heures | 48 heures |
    | WL3 | Machines virtuelles Azure dans West Europe | 1 heure | 15 minutes |

    Les objectifs s'appliquent à la perte du centre de données pour WL1 et à une panne de toute la région West Europe pour WL2 et WL3. De plus, un point de récupération quotidien de WL2 doit être conservé un an.

    Vous devez recommander une solution de récupération pour chaque charge de travail. Les coûts doivent être réduits au minimum.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      WL1: [[wl1]]

      WL2: [[wl2]]

      WL3: [[wl3]]
    fr: |
      WL1 : [[wl1]]

      WL2 : [[wl2]]

      WL3 : [[wl3]]
  slots:
    - id: wl1
      options:
        - { id: mabs, text: { en: "Daily backups with Microsoft Azure Backup Server (MABS)", fr: "Des sauvegardes quotidiennes avec Microsoft Azure Backup Server (MABS)" } }
        - { id: asr, text: { en: "Azure Site Recovery replication to Azure", fr: "Une réplication Azure Site Recovery vers Azure" } }
        - { id: mars, text: { en: "The MARS agent on each virtual machine", fr: "L'agent MARS sur chaque machine virtuelle" } }
        - { id: migrate, text: { en: "Azure Migrate replication to Azure", fr: "Une réplication Azure Migrate vers Azure" } }
    - id: wl2
      options:
        - { id: lrs, text: { en: "Azure Backup with a locally redundant vault", fr: "Sauvegarde Azure avec un coffre localement redondant" } }
        - { id: zones, text: { en: "A redeployment across availability zones", fr: "Un redéploiement sur plusieurs zones de disponibilité" } }
        - { id: asr, text: { en: "Azure Site Recovery replication to North Europe", fr: "Une réplication Azure Site Recovery vers North Europe" } }
        - { id: crr, text: { en: "Azure Backup with a geo-redundant vault and Cross Region Restore", fr: "Sauvegarde Azure avec un coffre géoredondant et la restauration interrégion" } }
    - id: wl3
      options:
        - { id: lrs, text: { en: "Azure Backup with a locally redundant vault", fr: "Sauvegarde Azure avec un coffre localement redondant" } }
        - { id: zones, text: { en: "A redeployment across availability zones", fr: "Un redéploiement sur plusieurs zones de disponibilité" } }
        - { id: asr, text: { en: "Azure Site Recovery replication to North Europe", fr: "Une réplication Azure Site Recovery vers North Europe" } }
        - { id: crr, text: { en: "Azure Backup with a geo-redundant vault and Cross Region Restore", fr: "Sauvegarde Azure avec un coffre géoredondant et la restauration interrégion" } }
answer:
  values: { wl1: asr, wl2: crr, wl3: asr }
explanation:
  correct:
    en: |
      WL1 needs an RPO of 30 minutes and has no second datacenter: Site Recovery replicates Hyper-V virtual machines to Azure and fails them over there. WL2 must keep daily recovery points for a year, which only a backup provides, and its relaxed objectives are met by restoring in the paired region with Cross Region Restore, whose recovery points are at most 36 hours old; adding replication would only add cost. WL3 needs an RPO of 15 minutes and an RTO of one hour, which requires the continuous replication of Site Recovery to another region.
    fr: |
      WL1 exige un RPO de 30 minutes et ne dispose d'aucun second centre de données : Site Recovery réplique les machines virtuelles Hyper-V vers Azure et les y fait basculer. WL2 doit conserver des points de récupération quotidiens pendant un an, ce que seule une sauvegarde fournit, et ses objectifs peu contraignants sont atteints par une restauration dans la région jumelée avec la restauration interrégion, dont les points de récupération datent de 36 heures au plus ; ajouter une réplication ne ferait qu'augmenter les coûts. WL3 exige un RPO de 15 minutes et un RTO d'une heure, ce qui nécessite la réplication continue de Site Recovery vers une autre région.
  options:
    mabs: { en: "Daily backups can't meet an RPO of 30 minutes, and a backup doesn't run the workload in Azure within two hours.", fr: "Des sauvegardes quotidiennes ne peuvent pas respecter un RPO de 30 minutes, et une sauvegarde ne fait pas fonctionner la charge de travail dans Azure en deux heures." }
    lrs: { en: "A locally redundant vault keeps the backups in West Europe only, so they are unavailable during a region-wide outage.", fr: "Un coffre localement redondant ne conserve les sauvegardes que dans West Europe : elles sont indisponibles pendant une panne de toute la région." }
    zones: { en: "Availability zones don't protect against a region-wide outage.", fr: "Les zones de disponibilité ne protègent pas contre une panne de toute la région." }
references:
  - title: About Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-overview
  - title: Create and configure a Recovery Services vault
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
