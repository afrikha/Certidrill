id: az305-3a-cmp-consistency-yn
objective: "3.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs a database application on Azure virtual machines. Some virtual machines run Windows Server and others run Linux. You are designing the backup of the virtual machines and of their data disks with Azure Backup.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute une application de base de données sur des machines virtuelles Azure. Certaines machines virtuelles exécutent Windows Server et d'autres Linux. Vous concevez la sauvegarde des machines virtuelles et de leurs disques de données avec Sauvegarde Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure VM backup can take application-consistent backups of the Windows virtual machines without any script provided by Adatum.
        fr: La sauvegarde de machines virtuelles Azure peut effectuer des sauvegardes cohérentes au niveau des applications des machines virtuelles Windows sans aucun script fourni par Adatum.
    - id: s2
      text:
        en: To obtain application-consistent backups of the Linux virtual machines, Adatum must provide pre-scripts and post-scripts.
        fr: Pour obtenir des sauvegardes cohérentes au niveau des applications des machines virtuelles Linux, Adatum doit fournir des pré-scripts et des post-scripts.
    - id: s3
      text:
        en: Azure Disk Backup creates application-consistent recovery points of the data disks.
        fr: La sauvegarde de disque Azure crée des points de récupération des disques de données cohérents au niveau des applications.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      On Windows, the backup extension uses the Volume Shadow Copy Service (VSS), so the snapshot is application-consistent when the VSS writers succeed. On Linux, the backup is file-system consistent unless pre-scripts and post-scripts that you write quiesce the application. Azure Disk Backup is agentless and takes incremental snapshots that are crash-consistent only.
    fr: |
      Sous Windows, l'extension de sauvegarde utilise le service VSS (Volume Shadow Copy Service) : l'instantané est cohérent au niveau des applications lorsque les enregistreurs VSS réussissent. Sous Linux, la sauvegarde est cohérente au niveau du système de fichiers, sauf si des pré-scripts et des post-scripts que vous écrivez mettent l'application en repos. La sauvegarde de disque Azure fonctionne sans agent et prend des instantanés incrémentiels uniquement cohérents en cas d'incident.
references:
  - title: An overview of Azure VM backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-introduction
  - title: Overview of Azure Disk Backup
    url: https://learn.microsoft.com/en-us/azure/backup/disk-backup-overview
