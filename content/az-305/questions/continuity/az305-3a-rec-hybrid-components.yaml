id: az305-3a-rec-hybrid-components
objective: "3.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware has two on-premises datacenters:

    - **DC1** hosts VMware vSphere virtual machines managed by a vCenter server.
    - **DC2** hosts Hyper-V virtual machines on standalone hosts. System Center Virtual Machine Manager isn't used.

    Proseware plans to use Azure Site Recovery to fail over the virtual machines of both datacenters to Azure.

    You need to recommend the components to deploy in each datacenter.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware possède deux centres de données locaux :

    - **DC1** héberge des machines virtuelles VMware vSphere gérées par un serveur vCenter.
    - **DC2** héberge des machines virtuelles Hyper-V sur des hôtes autonomes. System Center Virtual Machine Manager n'est pas utilisé.

    Proseware prévoit d'utiliser Azure Site Recovery pour faire basculer vers Azure les machines virtuelles des deux centres de données.

    Vous devez recommander les composants à déployer dans chaque centre de données.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      DC1: [[dc1]]

      DC2: [[dc2]]
    fr: |
      DC1 : [[dc1]]

      DC2 : [[dc2]]
  slots:
    - id: dc1
      options:
        - { id: mabs, text: { en: "A Microsoft Azure Backup Server (MABS) and its protection agent on each virtual machine", fr: "Un serveur Microsoft Azure Backup Server (MABS) et son agent de protection sur chaque machine virtuelle" } }
        - { id: prov, text: { en: "The Azure Site Recovery Provider and the Recovery Services agent on each host", fr: "Le Fournisseur Azure Site Recovery et l'agent Recovery Services sur chaque hôte" } }
        - { id: appl, text: { en: "An Azure Site Recovery replication appliance and the Mobility service on each virtual machine", fr: "Une appliance de réplication Azure Site Recovery et le service Mobilité sur chaque machine virtuelle" } }
        - { id: mars, text: { en: "The MARS agent on each virtual machine", fr: "L'agent MARS sur chaque machine virtuelle" } }
    - id: dc2
      options:
        - { id: mabs, text: { en: "A Microsoft Azure Backup Server (MABS) and its protection agent on each virtual machine", fr: "Un serveur Microsoft Azure Backup Server (MABS) et son agent de protection sur chaque machine virtuelle" } }
        - { id: prov, text: { en: "The Azure Site Recovery Provider and the Recovery Services agent on each host", fr: "Le Fournisseur Azure Site Recovery et l'agent Recovery Services sur chaque hôte" } }
        - { id: appl, text: { en: "An Azure Site Recovery replication appliance and the Mobility service on each virtual machine", fr: "Une appliance de réplication Azure Site Recovery et le service Mobilité sur chaque machine virtuelle" } }
        - { id: mars, text: { en: "The MARS agent on each virtual machine", fr: "L'agent MARS sur chaque machine virtuelle" } }
answer:
  values: { dc1: appl, dc2: prov }
explanation:
  correct:
    en: VMware virtual machines are replicated through an on-premises Azure Site Recovery replication appliance, and the Mobility service installed on each machine captures the disk writes. For Hyper-V without Virtual Machine Manager, the Site Recovery Provider and the Recovery Services agent are installed on each Hyper-V host or cluster node, and nothing is installed in the virtual machines.
    fr: Les machines virtuelles VMware sont répliquées par l'intermédiaire d'une appliance de réplication Azure Site Recovery locale, et le service Mobilité installé sur chaque machine capture les écritures sur disque. Pour Hyper-V sans Virtual Machine Manager, le Fournisseur Site Recovery et l'agent Recovery Services sont installés sur chaque hôte ou nœud de cluster Hyper-V, et rien n'est installé dans les machines virtuelles.
  options:
    mabs: { en: "MABS backs up workloads to local disk and to a vault; it doesn't replicate machines for a failover to Azure.", fr: "MABS sauvegarde des charges de travail sur disque local puis dans un coffre ; il ne réplique pas de machines en vue d'un basculement vers Azure." }
    mars: { en: "The MARS agent backs up files, folders and the system state; it isn't a Site Recovery component.", fr: "L'agent MARS sauvegarde des fichiers, des dossiers et l'état du système ; ce n'est pas un composant de Site Recovery." }
references:
  - title: VMware to Azure disaster recovery architecture - Modernized
    url: https://learn.microsoft.com/en-us/azure/site-recovery/vmware-azure-architecture-modernized
  - title: Hyper-V to Azure disaster recovery architecture
    url: https://learn.microsoft.com/en-us/azure/site-recovery/hyper-v-azure-architecture
