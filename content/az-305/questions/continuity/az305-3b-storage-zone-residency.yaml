id: az305-3b-storage-zone-residency
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to create a general-purpose v2 storage account in the Switzerland North region, which supports availability zones. The account will store customer contracts as block blobs.

    You need to recommend a redundancy option for the account. The solution must meet the following requirements:

    - The contracts must remain readable and writable if a datacenter of the region fails.
    - A regulation requires all the copies of the contracts to stay in Switzerland North.
    - Costs must be minimized.

    What should you recommend?
  fr: |
    Contoso prévoit de créer un compte de stockage à usage général v2 dans la région Switzerland North, qui prend en charge les zones de disponibilité. Le compte stockera des contrats clients sous forme d'objets blob de blocs.

    Vous devez recommander une option de redondance pour le compte. La solution doit répondre aux exigences suivantes :

    - Les contrats doivent rester accessibles en lecture et en écriture si un centre de données de la région tombe en panne.
    - Une réglementation impose que toutes les copies des contrats restent dans Switzerland North.
    - Les coûts doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Locally redundant storage (LRS)", fr: "Stockage localement redondant (LRS)" }
    - id: b
      text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" }
    - id: c
      text: { en: "Geo-redundant storage (GRS)", fr: "Stockage géoredondant (GRS)" }
    - id: d
      text: { en: "Geo-zone-redundant storage (GZRS)", fr: "Stockage géoredondant interzone (GZRS)" }
answer: { optionId: b }
explanation:
  correct:
    en: ZRS copies the data synchronously across three or more availability zones of the primary region. Reads and writes continue if a zone fails, and no copy leaves the region. It is the cheapest option that survives a datacenter failure.
    fr: ZRS copie les données de façon synchrone sur trois zones de disponibilité ou plus de la région primaire. Les lectures et les écritures continuent si une zone tombe en panne, et aucune copie ne quitte la région. C'est l'option la moins chère qui survit à la panne d'un centre de données.
  options:
    a:
      en: LRS keeps its three copies in a single datacenter. The data is unavailable, or even lost, if that datacenter fails.
      fr: LRS conserve ses trois copies dans un seul centre de données. Les données sont indisponibles, voire perdues, si ce centre de données tombe en panne.
    c:
      en: GRS copies the data to a secondary region, which the regulation forbids, and its primary region is only locally redundant.
      fr: GRS copie les données vers une région secondaire, ce que la réglementation interdit, et sa région primaire n'est que localement redondante.
    d:
      en: GZRS survives a zone failure, but it also copies the data to a secondary region, which the regulation forbids.
      fr: GZRS survit à la panne d'une zone, mais copie aussi les données vers une région secondaire, ce que la réglementation interdit.
references:
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
