id: az305-3b-sqldb-outage-statements
objective: "3.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure SQL database named **DB1** in the Business Critical service tier. Zone redundancy is enabled for DB1. The logical server of DB1 is in the East US region.

    DB1 belongs to a failover group whose secondary server is in the West US region. The failover group uses the customer managed failover policy.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une base de données Azure SQL nommée **DB1** dans le niveau de service Business Critical. La redondance de zone est activée pour DB1. Le serveur logique de DB1 se trouve dans la région East US.

    DB1 appartient à un groupe de basculement dont le serveur secondaire est dans la région West US. Le groupe de basculement utilise la stratégie de basculement gérée par le client.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If one availability zone of East US fails, DB1 remains available in East US without loss of committed data.
        fr: Si une zone de disponibilité de East US tombe en panne, DB1 reste disponible dans East US sans perte de données validées.
    - id: s2
      text:
        en: A forced failover to West US can lose transactions that were committed in East US shortly before the failover.
        fr: Un basculement forcé vers West US peut faire perdre des transactions validées dans East US peu avant le basculement.
    - id: s3
      text:
        en: If East US becomes unavailable, the failover group fails over to West US without any action from Contoso.
        fr: Si East US devient indisponible, le groupe de basculement bascule vers West US sans aucune action de Contoso.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: A zone-redundant Business Critical database has its replicas in different availability zones and replicates synchronously, so a zone failure causes a local failover with no loss of committed data. Replication between the regions of a failover group is asynchronous, so a forced failover can lose the most recent transactions. With the customer managed policy, Contoso decides when to fail over. Only the Microsoft managed policy lets Microsoft start a failover, after a grace period of at least one hour.
    fr: Une base de données Business Critical redondante interzone a ses réplicas dans des zones de disponibilité différentes et réplique de façon synchrone ; la panne d'une zone provoque donc un basculement local sans perte de données validées. La réplication entre les régions d'un groupe de basculement est asynchrone ; un basculement forcé peut donc faire perdre les transactions les plus récentes. Avec la stratégie gérée par le client, c'est Contoso qui décide du moment du basculement. Seule la stratégie gérée par Microsoft laisse Microsoft lancer un basculement, après une période de grâce d'au moins une heure.
references:
  - title: Failover groups overview & best practices (Azure SQL Database)
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
  - title: Availability through redundancy - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla-local-zone-redundancy
