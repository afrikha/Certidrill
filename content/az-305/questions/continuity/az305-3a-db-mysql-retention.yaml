id: az305-3a-db-mysql-retention
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Database for MySQL flexible server that was created with the default backup settings.

    The data owner requires that the server can be restored to any point in time within the last 30 days. Costs and administrative effort must be minimized.

    What should you recommend?
  fr: |
    Contoso possède un serveur flexible Azure Database for MySQL créé avec les paramètres de sauvegarde par défaut.

    Le propriétaire des données exige que le serveur puisse être restauré à n'importe quel instant des 30 derniers jours. Les coûts et l'effort d'administration doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Increase the backup retention period of the server to 30 days.", fr: "Porter à 30 jours la période de rétention des sauvegardes du serveur." }
    - id: b
      text: { en: "Enable geo-redundant backup storage for the server.", fr: "Activer le stockage de sauvegarde géoredondant pour le serveur." }
    - id: c
      text: { en: "Add a read replica of the server in the same region.", fr: "Ajouter un réplica en lecture du serveur dans la même région." }
    - id: d
      text: { en: "Enable zone-redundant high availability for the server.", fr: "Activer la haute disponibilité redondante interzone pour le serveur." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Database for MySQL flexible server backs itself up and keeps the backups for seven days by default. The retention period can be set from 1 to 35 days, at creation or later, and a point-in-time restore to any moment of that period creates a new server. Raising the retention to 30 days is a single setting.
    fr: |
      Un serveur flexible Azure Database for MySQL se sauvegarde lui-même et conserve les sauvegardes sept jours par défaut. La période de rétention peut être réglée de 1 à 35 jours, à la création ou par la suite, et une restauration à un instant dans le passé de cette période crée un nouveau serveur. Porter la rétention à 30 jours est un simple paramètre.
  options:
    b:
      en: "Geo-redundant backup storage copies the backups to the paired region for a geo-restore; it doesn't lengthen the retention period."
      fr: "Le stockage de sauvegarde géoredondant copie les sauvegardes dans la région jumelée en vue d'une géorestauration ; il n'allonge pas la période de rétention."
    c:
      en: "A read replica receives every change of the source, including the unwanted ones; it can't return to an earlier point in time."
      fr: "Un réplica en lecture reçoit toutes les modifications de la source, y compris les modifications indésirables ; il ne peut pas revenir à un instant antérieur."
    d:
      en: "Zone-redundant high availability keeps a standby server for automatic failover; it protects against a zone failure, not against the need to go back in time."
      fr: "La haute disponibilité redondante interzone maintient un serveur de secours pour un basculement automatique ; elle protège contre la panne d'une zone, pas contre le besoin de revenir en arrière."
references:
  - title: Backup and restore in Azure Database for MySQL
    url: https://learn.microsoft.com/en-us/azure/mysql/flexible-server/concepts-backup-restore
