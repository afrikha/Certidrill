id: az305-3a-db-sql-recovery-match
objective: "3.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware uses Azure SQL Database for three applications. Each application has a different recovery requirement.

    You need to recommend the feature that meets each requirement at the lowest cost.

    Which feature should you recommend for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware utilise Azure SQL Database pour trois applications. Chaque application a une exigence de récupération différente.

    Vous devez recommander la fonctionnalité qui répond à chaque exigence au moindre coût.

    Quelle fonctionnalité devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pitr, text: { en: "Point-in-time restore", fr: "Restauration à un instant dans le passé" } }
    - { id: ltr, text: { en: "Long-term retention", fr: "Conservation à long terme" } }
    - { id: geo, text: { en: "Geo-restore", fr: "Géorestauration" } }
    - { id: agr, text: { en: "Active geo-replication", fr: "Géoréplication active" } }
    - { id: copy, text: { en: "Database copy", fr: "Copie de base de données" } }
  targets:
    - id: t1
      text: { en: "Return a database to its state of 10:00 yesterday, just before a faulty release.", fr: "Ramener une base de données à son état d'hier à 10 h 00, juste avant une mise en production défectueuse." }
    - id: t2
      text: { en: "Provide a database as it was at the end of the fiscal year, four years ago.", fr: "Fournir une base de données telle qu'elle était à la fin de l'exercice fiscal, il y a quatre ans." }
    - id: t3
      text: { en: "Re-create a database in another region after the loss of its region, without paying for a standby database.", fr: "Recréer une base de données dans une autre région après la perte de sa région, sans payer de base de données de secours." }
answer:
  mapping: { t1: pitr, t2: ltr, t3: geo }
explanation:
  correct:
    en: |
      Point-in-time restore re-creates a database at any moment of the retention period, 1 to 35 days. Long-term retention keeps weekly, monthly or yearly full backups for up to 10 years. Geo-restore creates a database in any region from the geo-replicated backups, with no secondary database to pay for, at the price of a longer recovery time.
    fr: |
      La restauration à un instant dans le passé recrée une base de données à n'importe quel moment de la période de rétention, de 1 à 35 jours. La conservation à long terme garde des sauvegardes complètes hebdomadaires, mensuelles ou annuelles jusqu'à 10 ans. La géorestauration crée une base de données dans n'importe quelle région à partir des sauvegardes géorépliquées, sans base secondaire à payer, au prix d'un délai de récupération plus long.
  options:
    agr: { en: "Active geo-replication keeps a secondary database running in another region, which is billed.", fr: "La géoréplication active maintient une base de données secondaire en fonctionnement dans une autre région, qui est facturée." }
    copy: { en: "A database copy is a snapshot of the current state taken on demand; it doesn't return to a past moment unless it was created then.", fr: "Une copie de base de données est une image de l'état actuel prise à la demande ; elle ne permet pas de revenir à un instant passé si elle n'a pas été créée à ce moment-là." }
references:
  - title: Restore a database from a backup in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/recovery-using-backups
  - title: Long-term retention backups - Azure SQL Database and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/long-term-retention-overview
