id: az305-3b-sqlvm-ag-zones
objective: "3.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum plans to deploy SQL Server on two Azure virtual machines in the West Europe region to host a critical database. No shared storage will be used.

    You need to recommend a design that meets the following requirements:

    - The database must remain available if one datacenter of West Europe fails.
    - If the active SQL Server instance fails, an up-to-date copy of the database on the other virtual machine must take over automatically.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de déployer SQL Server sur deux machines virtuelles Azure dans la région West Europe pour héberger une base de données critique. Aucun stockage partagé ne sera utilisé.

    Vous devez recommander une conception qui répond aux exigences suivantes :

    - La base de données doit rester disponible si un centre de données de West Europe tombe en panne.
    - Si l'instance SQL Server active tombe en panne, une copie à jour de la base de données sur l'autre machine virtuelle doit prendre le relais automatiquement.

    Quelles sont les deux actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Deploy the two virtual machines to the same availability set.", fr: "Déployer les deux machines virtuelles dans le même groupe à haute disponibilité." }
    - id: b
      text: { en: "Deploy the two virtual machines to different availability zones.", fr: "Déployer les deux machines virtuelles dans des zones de disponibilité différentes." }
    - id: c
      text: { en: "Configure log shipping between the two SQL Server instances.", fr: "Configurer la copie des journaux de transaction entre les deux instances SQL Server." }
    - id: d
      text: { en: "Configure an Always On availability group between the two SQL Server instances.", fr: "Configurer un groupe de disponibilité Always On entre les deux instances SQL Server." }
    - id: e
      text: { en: "Configure an Always On failover cluster instance on the two virtual machines.", fr: "Configurer une instance de cluster de basculement Always On sur les deux machines virtuelles." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Virtual machines in different availability zones are in separate physical locations of the region, so one of them survives a datacenter failure. An Always On availability group replicates the database between the two instances and fails over automatically to the secondary replica, without shared storage. Azure protects the virtual machine, not SQL Server inside it, so the SQL Server solution is needed as well.
    fr: Des machines virtuelles placées dans des zones de disponibilité différentes sont dans des emplacements physiques distincts de la région ; l'une d'elles survit donc à la panne d'un centre de données. Un groupe de disponibilité Always On réplique la base de données entre les deux instances et bascule automatiquement vers le réplica secondaire, sans stockage partagé. Azure protège la machine virtuelle, pas SQL Server à l'intérieur ; la solution SQL Server est donc elle aussi nécessaire.
  options:
    a:
      en: An availability set keeps the two virtual machines in one datacenter, so a datacenter failure stops both.
      fr: Un groupe à haute disponibilité garde les deux machines virtuelles dans un seul centre de données ; la panne d'un centre de données arrête donc les deux.
    c:
      en: Log shipping copies log backups on a schedule. The secondary lags behind, and the switch to it is manual.
      fr: La copie des journaux de transaction copie des sauvegardes de journal selon une planification. Le serveur secondaire a du retard, et la bascule vers lui est manuelle.
    e:
      en: A failover cluster instance keeps a single copy of the database on shared storage, which the design excludes.
      fr: Une instance de cluster de basculement conserve une seule copie de la base de données sur un stockage partagé, que la conception exclut.
references:
  - title: Business continuity and HADR for SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/business-continuity-high-availability-disaster-recovery-hadr-overview
