id: az305-3a-cmp-backup-vault-workloads
objective: "3.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys plans to protect the following workloads with Azure Backup:

    - Azure virtual machines
    - Azure managed disks that aren't attached to a protected virtual machine
    - An Azure Kubernetes Service (AKS) cluster
    - SQL Server databases in Azure virtual machines
    - Azure Files shares

    You plan to create one Recovery Services vault and one Backup vault.

    Which two workloads should you protect by using the Backup vault? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit de protéger les charges de travail suivantes avec Sauvegarde Azure :

    - Des machines virtuelles Azure
    - Des disques managés Azure non attachés à une machine virtuelle protégée
    - Un cluster Azure Kubernetes Service (AKS)
    - Des bases de données SQL Server dans des machines virtuelles Azure
    - Des partages Azure Files

    Vous prévoyez de créer un coffre Recovery Services et un coffre de sauvegarde.

    Quelles sont les deux charges de travail à protéger au moyen du coffre de sauvegarde ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Azure virtual machines", fr: "Les machines virtuelles Azure" } }
    - { id: b, text: { en: "The Azure managed disks", fr: "Les disques managés Azure" } }
    - { id: c, text: { en: "The AKS cluster", fr: "Le cluster AKS" } }
    - { id: d, text: { en: "The SQL Server databases in Azure virtual machines", fr: "Les bases de données SQL Server dans des machines virtuelles Azure" } }
    - { id: e, text: { en: "The Azure Files shares", fr: "Les partages Azure Files" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Azure Disk Backup and AKS backup are both configured from a Backup vault, the vault type used for the newer workloads of Azure Backup. Virtual machines, SQL Server databases in virtual machines and Azure Files shares are protected by a Recovery Services vault.
    fr: |
      La sauvegarde de disque Azure et la sauvegarde AKS se configurent toutes deux depuis un coffre de sauvegarde, le type de coffre utilisé pour les charges de travail récentes de Sauvegarde Azure. Les machines virtuelles, les bases de données SQL Server dans des machines virtuelles et les partages Azure Files sont protégés par un coffre Recovery Services.
  options:
    a:
      en: "Azure VM backup stores its recovery points in a Recovery Services vault."
      fr: "La sauvegarde de machines virtuelles Azure stocke ses points de récupération dans un coffre Recovery Services."
    d:
      en: "SQL Server in Azure VMs is backed up by a workload extension that streams the data to a Recovery Services vault."
      fr: "SQL Server dans des machines virtuelles Azure est sauvegardé par une extension de charge de travail qui envoie les données vers un coffre Recovery Services."
    e:
      en: "Azure Files backup, snapshot or vaulted, is managed from a Recovery Services vault."
      fr: "La sauvegarde Azure Files, par instantané ou archivée, se gère depuis un coffre Recovery Services."
references:
  - title: Overview of Azure Disk Backup
    url: https://learn.microsoft.com/en-us/azure/backup/disk-backup-overview
  - title: What is Azure Kubernetes Service backup?
    url: https://learn.microsoft.com/en-us/azure/backup/azure-kubernetes-service-backup-overview
