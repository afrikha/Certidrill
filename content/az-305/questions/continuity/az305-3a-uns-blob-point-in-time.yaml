id: az305-3a-uns-blob-point-in-time
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores product images as block blobs in the hot tier of a standard general-purpose v2 storage account. The account doesn't have a hierarchical namespace. A batch job updates thousands of blobs in several containers every night.

    You need to recommend a data protection feature. If the batch job corrupts the blobs, the administrators must be able to return all the block blobs of the affected containers to their state before the job, in a single operation.

    What should you recommend?
  fr: |
    Fabrikam stocke des images de produits sous forme d'objets blob de blocs au niveau chaud (Hot) d'un compte de stockage standard à usage général v2. Le compte ne possède pas d'espace de noms hiérarchique. Un traitement par lots met à jour chaque nuit des milliers d'objets blob dans plusieurs conteneurs.

    Vous devez recommander une fonctionnalité de protection des données. Si le traitement par lots corrompt les objets blob, les administrateurs doivent pouvoir ramener tous les objets blob de blocs des conteneurs touchés à leur état d'avant le traitement, en une seule opération.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Container soft delete", fr: "La suppression réversible des conteneurs" }
    - id: b
      text: { en: "Point-in-time restore for block blobs", fr: "La restauration à un instant dans le passé pour les objets blob de blocs" }
    - id: c
      text: { en: "Blob snapshots taken before each run of the job", fr: "Des instantanés d'objets blob pris avant chaque exécution du traitement" }
    - id: d
      text: { en: "Geo-redundant storage with a customer-managed failover", fr: "Le stockage géoredondant avec un basculement géré par le client" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Point-in-time restore returns a set of block blobs, a whole account, chosen containers or ranges of blob names, to their state at a past moment in one restore operation. It relies on blob versioning, the change feed and blob soft delete, and it is supported for hot and cool block blobs in standard general-purpose v2 accounts without a hierarchical namespace.
    fr: |
      La restauration à un instant dans le passé ramène un ensemble d'objets blob de blocs, qu'il s'agisse d'un compte entier, de conteneurs choisis ou de plages de noms d'objets blob, à leur état à un moment passé en une seule opération de restauration. Elle s'appuie sur le contrôle de version des objets blob, le flux de modification et la suppression réversible des objets blob, et elle est prise en charge pour les objets blob de blocs des niveaux chaud (Hot) et froid (Cool) dans les comptes standard à usage général v2 sans espace de noms hiérarchique.
  options:
    a:
      en: "Container soft delete restores a container that was deleted; here the containers still exist and only their blobs are corrupted."
      fr: "La suppression réversible des conteneurs restaure un conteneur supprimé ; ici les conteneurs existent toujours et seuls leurs objets blob sont corrompus."
    c:
      en: "Snapshots must be created and then copied back blob by blob, which means thousands of operations and custom code."
      fr: "Les instantanés doivent être créés puis recopiés objet blob par objet blob, ce qui représente des milliers d'opérations et du code personnalisé."
    d:
      en: "Geo-redundant storage replicates every write, including the corrupted data, to the secondary region; a failover doesn't go back in time."
      fr: "Le stockage géoredondant réplique chaque écriture, y compris les données corrompues, dans la région secondaire ; un basculement ne permet pas de revenir en arrière."
references:
  - title: Point-in-time restore for block blobs
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/point-in-time-restore-overview
