id: az305-3b-mysql-zone-redundant-ha
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has an Azure Database for MySQL flexible server named **mysql1** in the General Purpose tier. The server was created without high availability, in a region that supports availability zones.

    A new requirement states that if the availability zone of the server fails, the database must fail over automatically to another zone without losing committed data.

    You need to recommend a solution that meets the requirement.

    What should you recommend?
  fr: |
    Tailspin Toys dispose d'un serveur flexible Azure Database pour MySQL nommé **mysql1** dans le niveau General Purpose. Le serveur a été créé sans haute disponibilité, dans une région qui prend en charge les zones de disponibilité.

    Une nouvelle exigence impose que, si la zone de disponibilité du serveur tombe en panne, la base de données bascule automatiquement vers une autre zone sans perdre de données validées.

    Vous devez recommander une solution qui répond à l'exigence.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Enable zone-redundant high availability on mysql1.", fr: "Activer la haute disponibilité redondante interzone sur mysql1." }
    - id: b
      text: { en: "Enable local-redundant high availability on mysql1.", fr: "Activer la haute disponibilité localement redondante sur mysql1." }
    - id: c
      text: { en: "Add a read replica to mysql1, and promote the replica if the zone fails.", fr: "Ajouter un réplica en lecture à mysql1, et promouvoir le réplica si la zone tombe en panne." }
    - id: d
      text: { en: "Create a new server that has zone-redundant high availability, and migrate the databases to it.", fr: "Créer un nouveau serveur doté de la haute disponibilité redondante interzone, et y migrer les bases de données." }
answer: { optionId: d }
explanation:
  correct:
    en: For Azure Database for MySQL flexible server, zone-redundant high availability can be enabled only when the server is created. An existing server without it must be replaced by a new server created with zone-redundant high availability, to which the data is migrated. The standby then takes over automatically, and no committed data is lost.
    fr: Pour le serveur flexible Azure Database pour MySQL, la haute disponibilité redondante interzone ne peut être activée qu'à la création du serveur. Un serveur existant qui n'en dispose pas doit être remplacé par un nouveau serveur créé avec la haute disponibilité redondante interzone, vers lequel les données sont migrées. Le serveur de secours prend alors le relais automatiquement, sans perte de données validées.
  options:
    a:
      en: Zone-redundant high availability can't be enabled on an existing server.
      fr: La haute disponibilité redondante interzone ne peut pas être activée sur un serveur existant.
    b:
      en: Local-redundant high availability can be enabled on an existing server, but its standby is in the zone of the primary, so both stop if that zone fails.
      fr: La haute disponibilité localement redondante peut être activée sur un serveur existant, mais son serveur de secours est dans la zone du serveur principal ; les deux s'arrêtent donc si cette zone tombe en panne.
    c:
      en: A read replica is replicated asynchronously and must be promoted manually. The failover isn't automatic, and recent transactions can be lost.
      fr: Un réplica en lecture est répliqué de façon asynchrone et doit être promu manuellement. Le basculement n'est pas automatique, et des transactions récentes peuvent être perdues.
references:
  - title: High availability in Azure Database for MySQL
    url: https://learn.microsoft.com/en-us/azure/mysql/flexible-server/concepts-high-availability
