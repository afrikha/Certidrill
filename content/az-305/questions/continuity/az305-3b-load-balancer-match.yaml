id: az305-3b-load-balancer-match
objective: "3.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is designing the entry point of four highly available applications that run on Azure compute services.

    You need to recommend a load-balancing service for each application.

    Which service should you recommend for each application? To answer, drag the appropriate services to the correct applications. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders conçoit le point d'entrée de quatre applications hautement disponibles qui s'exécutent sur des services de calcul Azure.

    Vous devez recommander un service d'équilibrage de charge pour chaque application.

    Quel service devez-vous recommander pour chaque application ? Pour répondre, faites glisser les services appropriés vers les applications correspondantes. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: afd, text: Azure Front Door }
    - { id: tm, text: Traffic Manager }
    - { id: agw, text: Application Gateway }
    - { id: glb, text: { en: "Azure Load Balancer, global tier", fr: "Azure Load Balancer, niveau mondial" } }
    - { id: rlb, text: { en: "Azure Load Balancer, regional tier", fr: "Azure Load Balancer, niveau régional" } }
  targets:
    - id: web
      text:
        en: A public web application deployed in three regions. HTTPS requests must reach a healthy region with a fast failover, TLS offload and caching.
        fr: Une application web publique déployée dans trois régions. Les requêtes HTTPS doivent atteindre une région saine avec un basculement rapide, le déchargement TLS et la mise en cache.
    - id: udp
      text:
        en: A UDP telemetry service deployed in two regions. Clients must connect to one static public IP address that keeps working if a region fails.
        fr: Un service de télémétrie UDP déployé dans deux régions. Les clients doivent se connecter à une seule adresse IP publique statique qui continue de fonctionner si une région tombe en panne.
    - id: dns
      text:
        en: A TCP service deployed in two regions. Clients must be directed to a regional endpoint by DNS resolution, and their traffic must not pass through the load-balancing service.
        fr: Un service TCP déployé dans deux régions. Les clients doivent être dirigés vers un point de terminaison régional par la résolution DNS, et leur trafic ne doit pas transiter par le service d'équilibrage de charge.
    - id: zonal
      text:
        en: A web application on virtual machines spread across the zones of one region. HTTPS requests must be distributed inside the region with path-based routing and a web application firewall.
        fr: Une application web sur des machines virtuelles réparties entre les zones d'une seule région. Les requêtes HTTPS doivent être distribuées dans la région avec un routage basé sur le chemin et un pare-feu d'applications web.
answer:
  mapping: { web: afd, udp: glb, dns: tm, zonal: agw }
explanation:
  correct:
    en: Azure Front Door is the global layer-7 service for HTTP(S), with TLS offload, caching and fast failover. The global tier of Azure Load Balancer is a layer-4 service that exposes one static anycast IP address in front of regional load balancers and removes a failed region from rotation. Traffic Manager works through DNS and never sees the traffic itself. Application Gateway is the regional layer-7 load balancer with path-based routing and a web application firewall.
    fr: Azure Front Door est le service mondial de couche 7 pour HTTP(S), avec le déchargement TLS, la mise en cache et un basculement rapide. Le niveau mondial d'Azure Load Balancer est un service de couche 4 qui expose une seule adresse IP anycast statique devant des équilibreurs de charge régionaux et retire de la rotation une région en panne. Traffic Manager fonctionne par DNS et ne voit jamais le trafic lui-même. Application Gateway est l'équilibreur de charge régional de couche 7, avec le routage basé sur le chemin et un pare-feu d'applications web.
  options:
    rlb:
      en: A regional load balancer distributes TCP and UDP traffic inside one region. It offers neither a multi-region frontend nor layer-7 features.
      fr: Un équilibreur de charge régional distribue le trafic TCP et UDP dans une seule région. Il n'offre ni frontal multirégion ni fonctionnalités de couche 7.
references:
  - title: Load balancing options
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/load-balancing-overview
  - title: Global load balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/cross-region-overview
