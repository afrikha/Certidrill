id: az305-3b-cosmos-failover-options
objective: "3.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has an Azure Cosmos DB for NoSQL account. The write region is East US 2, the read region is Central US, and the default consistency level is session. The application can't resolve write conflicts, so the account must keep a single write region.

    You need to recommend a failover mechanism for each of the following requirements:

    - **Outage:** if East US 2 fails, write availability must be restored in Central US within minutes, without any manual action.
    - **Drill:** twice a year, while both regions are healthy, Central US must become the write region without any data loss.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un compte Azure Cosmos DB for NoSQL. La région d'écriture est East US 2, la région de lecture est Central US, et le niveau de cohérence par défaut est session. L'application ne sait pas résoudre les conflits d'écriture ; le compte doit donc conserver une seule région d'écriture.

    Vous devez recommander un mécanisme de basculement pour chacune des exigences suivantes :

    - **Panne :** si East US 2 tombe en panne, la disponibilité en écriture doit être rétablie dans Central US en quelques minutes, sans aucune action manuelle.
    - **Exercice :** deux fois par an, alors que les deux régions sont saines, Central US doit devenir la région d'écriture sans aucune perte de données.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Outage: [[outage]]

      Drill: [[drill]]
    fr: |
      Panne : [[outage]]

      Exercice : [[drill]]
  slots:
    - id: outage
      options:
        - { id: multiwrite, text: { en: "Multiple write regions", fr: "Plusieurs régions d'écriture" } }
        - { id: ppaf, text: { en: "Per-partition automatic failover", fr: "Basculement automatique par partition" } }
        - { id: service, text: { en: "Service-managed failover", fr: "Basculement géré par le service" } }
    - id: drill
      options:
        - { id: change, text: { en: "A change of the write region", fr: "Un changement de la région d'écriture" } }
        - { id: forced, text: { en: "A forced failover that takes East US 2 offline", fr: "Un basculement forcé qui met East US 2 hors connexion" } }
        - { id: service, text: { en: "Service-managed failover", fr: "Basculement géré par le service" } }
answer:
  values: { outage: ppaf, drill: change }
explanation:
  correct:
    en: Per-partition automatic failover applies to accounts with a single write region. It fails the affected partitions over to another region, typically within about three minutes, with no manual action. Changing the write region is the planned operation. It requires healthy regions and waits for replication to catch up before the promotion, so no data is lost.
    fr: Le basculement automatique par partition s'applique aux comptes à région d'écriture unique. Il fait basculer les partitions touchées vers une autre région, généralement en trois minutes environ, sans action manuelle. Le changement de la région d'écriture est l'opération planifiée. Il exige des régions saines et attend que la réplication ait rattrapé son retard avant la promotion ; aucune donnée n'est donc perdue.
  options:
    multiwrite:
      en: Multiple write regions remove the failover, but they can produce write conflicts, which the application can't resolve.
      fr: Plusieurs régions d'écriture suppriment le basculement, mais elles peuvent produire des conflits d'écriture, que l'application ne sait pas résoudre.
    service:
      en: Microsoft decides when a service-managed failover starts. It can take an hour or more after the outage begins, and it isn't an operation that you trigger for a drill.
      fr: C'est Microsoft qui décide du début d'un basculement géré par le service. Il peut prendre une heure ou plus après le début de la panne, et ce n'est pas une opération que vous déclenchez pour un exercice.
    forced:
      en: A forced failover of the write region doesn't wait for replication, so with session consistency unreplicated writes can be lost.
      fr: Un basculement forcé de la région d'écriture n'attend pas la réplication ; avec la cohérence de session, des écritures non répliquées peuvent donc être perdues.
references:
  - title: Reliability in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-cosmos-db-nosql
