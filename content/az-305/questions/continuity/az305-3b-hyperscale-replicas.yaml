id: az305-3b-hyperscale-replicas
objective: "3.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an Azure SQL database named **Sales** in the Hyperscale service tier, in the East US 2 region.

    You need to recommend a type of secondary replica for each of the following requirements:

    - A hot standby must take over automatically if the primary replica fails, and the applications must keep the same connection string.
    - The data science team must run heavy read-only queries on a replica that has its own compute size and to which only that team has access.
    - A readable copy of the database must exist in the West US 2 region for disaster recovery.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'une base de données Azure SQL nommée **Sales** dans le niveau de service Hyperscale, dans la région East US 2.

    Vous devez recommander un type de réplica secondaire pour chacune des exigences suivantes :

    - Un réplica de secours actif doit prendre le relais automatiquement si le réplica primaire tombe en panne, et les applications doivent conserver la même chaîne de connexion.
    - L'équipe de science des données doit exécuter de lourdes requêtes en lecture seule sur un réplica qui a sa propre taille de calcul et auquel seule cette équipe a accès.
    - Une copie lisible de la base de données doit exister dans la région West US 2 pour la reprise d'activité.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Hot standby: [[standby]]

      Replica of the data science team: [[science]]

      Copy in West US 2: [[dr]]
    fr: |
      Réplica de secours actif : [[standby]]

      Réplica de l'équipe de science des données : [[science]]

      Copie dans West US 2 : [[dr]]
  slots:
    - id: standby
      options:
        - { id: geo, text: { en: "Geo-replica", fr: "Géoréplica" } }
        - { id: ha, text: { en: "High-availability replica", fr: "Réplica à haute disponibilité" } }
        - { id: named, text: { en: "Named replica", fr: "Réplica nommé" } }
    - id: science
      options:
        - { id: geo, text: { en: "Geo-replica", fr: "Géoréplica" } }
        - { id: ha, text: { en: "High-availability replica", fr: "Réplica à haute disponibilité" } }
        - { id: named, text: { en: "Named replica", fr: "Réplica nommé" } }
    - id: dr
      options:
        - { id: geo, text: { en: "Geo-replica", fr: "Géoréplica" } }
        - { id: ha, text: { en: "High-availability replica", fr: "Réplica à haute disponibilité" } }
        - { id: named, text: { en: "Named replica", fr: "Réplica nommé" } }
answer:
  values: { standby: ha, science: named, dr: geo }
explanation:
  correct:
    en: A high-availability replica is a hot standby that shares the page servers of the primary. The failover to it is automatic, and the server and database names don't change. A named replica also shares the page servers, but it appears as a separate read-only database with its own service objective, and it can have its own logins, which isolates a read workload. A geo-replica has its own copy of the data on another logical server, in the same or in another region, and is the option for disaster recovery.
    fr: Un réplica à haute disponibilité est un réplica de secours actif qui partage les serveurs de pages du réplica primaire. Le basculement vers lui est automatique, et les noms du serveur et de la base de données ne changent pas. Un réplica nommé partage aussi les serveurs de pages, mais il apparaît comme une base de données distincte en lecture seule avec son propre objectif de service, et il peut avoir ses propres connexions (logins), ce qui isole une charge de travail de lecture. Un géoréplica possède sa propre copie des données sur un autre serveur logique, dans la même région ou dans une autre, et constitue l'option de reprise d'activité.
references:
  - title: Hyperscale secondary replicas
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale-replicas
