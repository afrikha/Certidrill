id: az305-3a-cmp-disk-backup
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has an Azure virtual machine named VM1 that runs a rendering application. The operating system disk of VM1 is redeployed from an image when needed. The results are written to a 2-TiB Premium SSD managed disk named Disk2.

    You need to recommend a backup solution that meets the following requirements:

    - A recovery point of Disk2 must be created every hour and retained for seven days.
    - No agent or extension can be installed in VM1.
    - Crash-consistent recovery points are acceptable.
    - The operating system disk must not be backed up, and costs must be minimized.

    What should you recommend?
  fr: |
    Litware possède une machine virtuelle Azure nommée VM1 qui exécute une application de rendu. Le disque du système d'exploitation de VM1 est redéployé à partir d'une image en cas de besoin. Les résultats sont écrits sur un disque managé SSD Premium de 2 Tio nommé Disk2.

    Vous devez recommander une solution de sauvegarde qui répond aux exigences suivantes :

    - Un point de récupération de Disk2 doit être créé toutes les heures et conservé sept jours.
    - Aucun agent ni aucune extension ne peut être installé dans VM1.
    - Des points de récupération cohérents en cas d'incident sont acceptables.
    - Le disque du système d'exploitation ne doit pas être sauvegardé, et les coûts doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Azure VM backup with an Enhanced policy and a Recovery Services vault", fr: "La sauvegarde de machines virtuelles Azure avec une stratégie améliorée et un coffre Recovery Services" }
    - id: b
      text: { en: "The MARS agent with a Recovery Services vault", fr: "L'agent MARS avec un coffre Recovery Services" }
    - id: c
      text: { en: "Azure Site Recovery replication of VM1 to another availability zone", fr: "Une réplication Azure Site Recovery de VM1 vers une autre zone de disponibilité" }
    - id: d
      text: { en: "Azure Disk Backup with a Backup vault", fr: "La sauvegarde de disque Azure avec un coffre de sauvegarde" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure Disk Backup is agentless: it takes crash-consistent incremental snapshots of a single managed disk, as often as every hour for Premium SSD disks, and keeps them in a resource group of the subscription. It is managed from a Backup vault, and because the snapshots aren't copied to the vault there is no protected-instance fee or vault storage charge, only the cost of the incremental snapshots.
    fr: |
      La sauvegarde de disque Azure fonctionne sans agent : elle prend des instantanés incrémentiels, cohérents en cas d'incident, d'un seul disque managé, jusqu'à une fois par heure pour les disques SSD Premium, et les conserve dans un groupe de ressources de l'abonnement. Elle se gère depuis un coffre de sauvegarde, et comme les instantanés ne sont pas copiés dans le coffre, il n'y a ni frais d'instance protégée ni frais de stockage du coffre, seulement le coût des instantanés incrémentiels.
  options:
    a:
      en: "Azure VM backup installs a backup extension in the virtual machine, and its Enhanced policy runs every four hours at best."
      fr: "La sauvegarde de machines virtuelles Azure installe une extension de sauvegarde dans la machine virtuelle, et sa stratégie améliorée s'exécute au mieux toutes les quatre heures."
    b:
      en: "The MARS agent is an agent installed in the operating system, and it backs up files and folders rather than a disk."
      fr: "L'agent MARS est un agent installé dans le système d'exploitation, et il sauvegarde des fichiers et des dossiers plutôt qu'un disque."
    c:
      en: "Site Recovery installs the Mobility service extension, replicates the whole virtual machine and is a disaster recovery service, not a backup with a seven-day history of hourly points at the lowest cost."
      fr: "Site Recovery installe l'extension du service Mobilité, réplique la machine virtuelle entière et constitue un service de reprise d'activité, pas une sauvegarde offrant au moindre coût un historique de sept jours de points horaires."
references:
  - title: Overview of Azure Disk Backup
    url: https://learn.microsoft.com/en-us/azure/backup/disk-backup-overview
