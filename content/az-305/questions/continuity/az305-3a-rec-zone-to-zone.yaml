id: az305-3a-rec-zone-to-zone
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has eight Azure virtual machines in the Southeast Asia region. All the virtual machines are deployed in availability zone 1 and use Premium SSD managed disks with locally redundant storage.

    You need to recommend a disaster recovery solution that meets the following requirements:

    - If the datacenter that hosts zone 1 fails, the virtual machines must run again within two hours.
    - Replicated data must never be stored outside Southeast Asia.
    - After a failover, the virtual machines must use the existing virtual network and subnets.

    What should you recommend?
  fr: |
    Fabrikam possède huit machines virtuelles Azure dans la région Southeast Asia. Toutes sont déployées dans la zone de disponibilité 1 et utilisent des disques managés SSD Premium à stockage localement redondant.

    Vous devez recommander une solution de reprise d'activité qui répond aux exigences suivantes :

    - Si le centre de données qui héberge la zone 1 tombe en panne, les machines virtuelles doivent fonctionner à nouveau en moins de deux heures.
    - Les données répliquées ne doivent jamais être stockées en dehors de Southeast Asia.
    - Après un basculement, les machines virtuelles doivent utiliser le réseau virtuel et les sous-réseaux existants.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Azure Site Recovery replication to another availability zone of Southeast Asia", fr: "Une réplication Azure Site Recovery vers une autre zone de disponibilité de Southeast Asia" }
    - id: b
      text: { en: "Azure Site Recovery replication to the East Asia region", fr: "Une réplication Azure Site Recovery vers la région East Asia" }
    - id: c
      text: { en: "Azure Backup with a geo-redundant vault and Cross Region Restore", fr: "Sauvegarde Azure avec un coffre géoredondant et la restauration interrégion (Cross Region Restore)" }
    - id: d
      text: { en: "An availability set that contains the eight virtual machines", fr: "Un groupe à haute disponibilité contenant les huit machines virtuelles" }
answer: { optionId: a }
explanation:
  correct:
    en: Zone-to-zone disaster recovery with Azure Site Recovery replicates the virtual machines to another availability zone of the same region, so no data leaves Southeast Asia. Because both zones belong to the same region, the failed-over virtual machines can connect to the same virtual network and subnet, and Site Recovery targets a recovery time of up to one hour.
    fr: La reprise d'activité de zone à zone avec Azure Site Recovery réplique les machines virtuelles vers une autre zone de disponibilité de la même région, de sorte qu'aucune donnée ne quitte Southeast Asia. Comme les deux zones appartiennent à la même région, les machines virtuelles basculées peuvent se connecter au même réseau virtuel et au même sous-réseau, et Site Recovery vise un délai de récupération d'une heure au plus.
  options:
    b:
      en: Region-to-region replication stores the replica disks in East Asia, which breaks the data residency requirement, and it needs a virtual network in the target region.
      fr: La réplication de région à région stocke les disques réplicas dans East Asia, ce qui enfreint l'exigence de résidence des données, et elle nécessite un réseau virtuel dans la région cible.
    c:
      en: A geo-redundant vault copies the backup data to the paired region, outside Southeast Asia, and restoring eight virtual machines from backups is slower than a failover.
      fr: Un coffre géoredondant copie les données de sauvegarde dans la région jumelée, hors de Southeast Asia, et restaurer huit machines virtuelles à partir de sauvegardes est plus lent qu'un basculement.
    d:
      en: An availability set spreads virtual machines across fault domains and update domains of a single datacenter; it doesn't protect against the loss of that datacenter.
      fr: Un groupe à haute disponibilité répartit les machines virtuelles sur des domaines d'erreur et de mise à jour d'un seul centre de données ; il ne protège pas contre la perte de ce centre de données.
references:
  - title: Enable Azure VM disaster recovery between availability zones
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-how-to-enable-zone-to-zone-disaster-recovery
