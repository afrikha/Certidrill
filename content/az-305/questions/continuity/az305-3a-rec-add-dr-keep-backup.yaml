id: az305-3a-rec-add-dr-keep-backup
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys runs an order management application on 40 Azure virtual machines in the North Europe region. The virtual machines are backed up once a day by Azure Backup to a geo-redundant Recovery Services vault that has Cross Region Restore enabled. Monthly recovery points are retained for seven years to meet a legal obligation.

    The business now defines the following objectives for a region-wide outage of North Europe:

    - RTO: four hours
    - RPO: one hour

    You need to recommend changes that meet the new objectives and the legal obligation. Costs must be minimized.

    What should you recommend?
  fr: |
    Wingtip Toys exécute une application de gestion des commandes sur 40 machines virtuelles Azure dans la région North Europe. Les machines virtuelles sont sauvegardées une fois par jour par Sauvegarde Azure dans un coffre Recovery Services géoredondant sur lequel la restauration interrégion (Cross Region Restore) est activée. Des points de récupération mensuels sont conservés sept ans pour respecter une obligation légale.

    L'entreprise définit désormais les objectifs suivants pour une panne de toute la région North Europe :

    - RTO : quatre heures
    - RPO : une heure

    Vous devez recommander des modifications qui respectent les nouveaux objectifs et l'obligation légale. Les coûts doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Keep Azure Backup and change the backup policy to an Enhanced policy that runs every four hours.", fr: "Conserver Sauvegarde Azure et remplacer la stratégie de sauvegarde par une stratégie améliorée exécutée toutes les quatre heures." }
    - id: b
      text: { en: "Replace Azure Backup with Azure Site Recovery replication to West Europe and keep recovery points for the longest period allowed.", fr: "Remplacer Sauvegarde Azure par une réplication Azure Site Recovery vers West Europe et conserver les points de récupération pendant la durée maximale autorisée." }
    - id: c
      text: { en: "Keep Azure Backup and run a duplicate set of the 40 virtual machines in West Europe behind Azure Traffic Manager.", fr: "Conserver Sauvegarde Azure et exécuter un second jeu des 40 machines virtuelles dans West Europe derrière Azure Traffic Manager." }
    - id: d
      text: { en: "Keep Azure Backup and add Azure Site Recovery replication of the virtual machines to West Europe.", fr: "Conserver Sauvegarde Azure et ajouter une réplication Azure Site Recovery des machines virtuelles vers West Europe." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure Backup must stay because only a backup keeps monthly recovery points for seven years, but its recovery points in the paired region can be up to 36 hours old. Adding Azure Site Recovery gives continuous replication with recovery points every five minutes and a failover within the hour, and it stores only replica disks in West Europe until a failover, which keeps the cost lower than running a second environment.
    fr: |
      Sauvegarde Azure doit rester, car seule une sauvegarde conserve des points de récupération mensuels pendant sept ans, mais ses points de récupération dans la région jumelée peuvent dater de 36 heures. Ajouter Azure Site Recovery apporte une réplication continue avec des points de récupération toutes les cinq minutes et un basculement dans l'heure, et ne stocke que des disques réplicas dans West Europe jusqu'au basculement, ce qui coûte moins cher qu'un second environnement en fonctionnement.
  options:
    a:
      en: "With backups every four hours the RPO is at least four hours, and the recovery points replicated to the paired region can lag by up to 36 hours."
      fr: "Avec des sauvegardes toutes les quatre heures, le RPO est d'au moins quatre heures, et les points de récupération répliqués dans la région jumelée peuvent avoir jusqu'à 36 heures de retard."
    b:
      en: "Site Recovery keeps recovery points for 15 days at most, so removing Azure Backup breaks the seven-year retention."
      fr: "Site Recovery conserve les points de récupération 15 jours au plus : supprimer Sauvegarde Azure enfreint la rétention de sept ans."
    c:
      en: "A second running environment is billed for compute all the time and doesn't by itself replicate the data of the virtual machines, so it is the most expensive option and doesn't guarantee the RPO."
      fr: "Un second environnement en fonctionnement est facturé en calcul en permanence et ne réplique pas à lui seul les données des machines virtuelles : c'est l'option la plus chère et elle ne garantit pas le RPO."
references:
  - title: Azure to Azure disaster recovery architecture
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-architecture
  - title: Create and configure a Recovery Services vault
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
