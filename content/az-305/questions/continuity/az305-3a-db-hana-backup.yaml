id: az305-3a-db-hana-backup
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs SAP HANA databases on M-series Azure virtual machines.

    You need to recommend a backup solution for the databases. The solution must meet the following requirements:

    - The RPO must be 15 minutes.
    - The backups must use the native SAP HANA backup interfaces through a solution certified by SAP.
    - Backups must be retained for several years.
    - No backup infrastructure can be deployed or managed by Litware.

    What should you recommend?
  fr: |
    Litware exécute des bases de données SAP HANA sur des machines virtuelles Azure de la série M.

    Vous devez recommander une solution de sauvegarde pour les bases de données. La solution doit répondre aux exigences suivantes :

    - Le RPO doit être de 15 minutes.
    - Les sauvegardes doivent utiliser les interfaces de sauvegarde natives de SAP HANA au moyen d'une solution certifiée par SAP.
    - Les sauvegardes doivent être conservées plusieurs années.
    - Aucune infrastructure de sauvegarde ne peut être déployée ni gérée par Litware.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Azure VM backup with an Enhanced policy and a Recovery Services vault", fr: "La sauvegarde de machines virtuelles Azure avec une stratégie améliorée et un coffre Recovery Services" }
    - id: b
      text: { en: "Azure Backup for SAP HANA databases with a Recovery Services vault", fr: "Sauvegarde Azure pour les bases de données SAP HANA avec un coffre Recovery Services" }
    - id: c
      text: { en: "Azure Disk Backup of the data and log disks with a Backup vault", fr: "La sauvegarde de disque Azure pour les disques de données et de journaux avec un coffre de sauvegarde" }
    - id: d
      text: { en: "SAP HANA System Replication to a second virtual machine", fr: "SAP HANA System Replication vers une seconde machine virtuelle" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Backup for SAP HANA is Backint certified by SAP and uses the native SAP HANA APIs to stream full, differential and log backups directly to a Recovery Services vault. Log backups give an RPO of 15 minutes, the backups can be retained for years, and there is no backup infrastructure to deploy.
    fr: |
      Sauvegarde Azure pour SAP HANA est certifiée Backint par SAP et utilise les API natives de SAP HANA pour envoyer les sauvegardes complètes, différentielles et du journal directement vers un coffre Recovery Services. Les sauvegardes du journal donnent un RPO de 15 minutes, les sauvegardes peuvent être conservées des années, et il n'y a aucune infrastructure de sauvegarde à déployer.
  options:
    a:
      en: "Azure VM backup snapshots the whole machine every four hours at best and doesn't use the SAP HANA backup interfaces."
      fr: "La sauvegarde de machines virtuelles Azure prend un instantané de toute la machine au mieux toutes les quatre heures et n'utilise pas les interfaces de sauvegarde de SAP HANA."
    c:
      en: "Azure Disk Backup takes crash-consistent snapshots of disks, with no awareness of the database and no long-term vault storage."
      fr: "La sauvegarde de disque Azure prend des instantanés de disques cohérents en cas d'incident, sans connaissance de la base de données ni stockage à long terme dans le coffre."
    d:
      en: "HANA System Replication keeps a synchronized standby for availability; it reproduces deletions and corruption and keeps no backup history."
      fr: "HANA System Replication maintient un système de secours synchronisé pour la disponibilité ; elle reproduit les suppressions et les corruptions et ne conserve aucun historique de sauvegarde."
references:
  - title: About SAP HANA database backup on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-about
