id: az305-3b-sqldb-three-databases
objective: "3.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys plans to deploy three Azure SQL databases in the General Purpose service tier to the France Central region, which supports availability zones. The databases have the following requirements.

    | Database | Requirement |
    | --- | --- |
    | Orders | Must remain available, with no loss of committed data and no manual action, if an availability zone fails. There is no requirement for a regional outage. |
    | Catalog | After a regional outage, must be writable in another region within minutes. The connection string of the application must stay the same. |
    | History | After a regional outage, may be unavailable for up to one day and may lose its most recent data. |

    You need to recommend a solution for each database. Each solution must minimize costs.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prévoit de déployer trois bases de données Azure SQL de niveau de service General Purpose dans la région France Central, qui prend en charge les zones de disponibilité. Les bases de données ont les exigences suivantes.

    | Base de données | Exigence |
    | --- | --- |
    | Orders | Doit rester disponible, sans perte de données validées et sans action manuelle, si une zone de disponibilité tombe en panne. Il n'y a aucune exigence en cas de panne régionale. |
    | Catalog | Après une panne régionale, doit être accessible en écriture dans une autre région en quelques minutes. La chaîne de connexion de l'application doit rester la même. |
    | History | Après une panne régionale, peut rester indisponible jusqu'à une journée et peut perdre ses données les plus récentes. |

    Vous devez recommander une solution pour chaque base de données. Chaque solution doit réduire les coûts au minimum.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Orders: [[orders]]

      Catalog: [[catalog]]

      History: [[history]]
    fr: |
      Orders : [[orders]]

      Catalog : [[catalog]]

      History : [[history]]
  slots:
    - id: orders
      options:
        - { id: geo, text: { en: "Active geo-replication", fr: "Géoréplication active" } }
        - { id: fog, text: { en: "A failover group", fr: "Un groupe de basculement" } }
        - { id: restore, text: { en: "Geo-restore from geo-redundant backup storage", fr: "Géorestauration à partir d'un stockage de sauvegarde géoredondant" } }
        - { id: zr, text: { en: "Zone redundancy", fr: "Redondance de zone" } }
    - id: catalog
      options:
        - { id: geo, text: { en: "Active geo-replication", fr: "Géoréplication active" } }
        - { id: fog, text: { en: "A failover group", fr: "Un groupe de basculement" } }
        - { id: restore, text: { en: "Geo-restore from geo-redundant backup storage", fr: "Géorestauration à partir d'un stockage de sauvegarde géoredondant" } }
        - { id: zr, text: { en: "Zone redundancy", fr: "Redondance de zone" } }
    - id: history
      options:
        - { id: geo, text: { en: "Active geo-replication", fr: "Géoréplication active" } }
        - { id: fog, text: { en: "A failover group", fr: "Un groupe de basculement" } }
        - { id: restore, text: { en: "Geo-restore from geo-redundant backup storage", fr: "Géorestauration à partir d'un stockage de sauvegarde géoredondant" } }
        - { id: zr, text: { en: "Zone redundancy", fr: "Redondance de zone" } }
answer:
  values: { orders: zr, catalog: fog, history: restore }
explanation:
  correct:
    en: Zone redundancy replicates a database synchronously across the zones of its region and fails over automatically, with no loss of committed data. It needs no second region. A failover group keeps a secondary database in another region ready to become the primary, behind listener endpoints that don't change. Geo-restore needs no secondary database. It creates a new database in another region from geo-redundant backups, which is the cheapest option when hours of downtime and some data loss are accepted.
    fr: "La redondance de zone réplique une base de données de façon synchrone entre les zones de sa région et bascule automatiquement, sans perte de données validées ; elle ne demande pas de deuxième région. Un groupe de basculement maintient dans une autre région une base secondaire prête à devenir primaire, derrière des points de terminaison d'écouteur qui ne changent pas. La géorestauration ne demande aucune base secondaire. Elle crée une nouvelle base dans une autre région à partir de sauvegardes géoredondantes, ce qui est l'option la moins chère quand des heures d'interruption et une certaine perte de données sont acceptées."
  options:
    geo:
      en: Active geo-replication also keeps a secondary database in another region, but the application must connect to another logical server after a failover, so the connection string changes. For Orders and History, it adds the cost of a secondary database that isn't required.
      fr: La géoréplication active maintient elle aussi une base secondaire dans une autre région, mais l'application doit se connecter à un autre serveur logique après un basculement ; la chaîne de connexion change donc. Pour Orders et History, elle ajoute le coût d'une base secondaire qui n'est pas exigée.
