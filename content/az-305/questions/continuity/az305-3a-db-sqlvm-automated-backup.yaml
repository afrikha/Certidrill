id: az305-3a-db-sqlvm-automated-backup
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs SQL Server 2022 Standard edition on a single Azure virtual machine named SQLVM1. The virtual machine is registered with the SQL IaaS Agent extension.

    You need to recommend a backup solution for the databases of SQLVM1. The solution must meet the following requirements:

    - Full and transaction log backups must be scheduled automatically and stored in an Azure Storage account for 30 days.
    - The RPO must be 15 minutes.
    - No other Azure service than the storage account can be deployed.
    - The database administrators must restore the databases by using SQL Server Management Studio.
    - Administrative effort must be minimized.

    What should you recommend?
  fr: |
    Proseware exécute SQL Server 2022 édition Standard sur une seule machine virtuelle Azure nommée SQLVM1. La machine virtuelle est inscrite auprès de l'extension SQL IaaS Agent.

    Vous devez recommander une solution de sauvegarde pour les bases de données de SQLVM1. La solution doit répondre aux exigences suivantes :

    - Des sauvegardes complètes et des sauvegardes du journal des transactions doivent être planifiées automatiquement et stockées 30 jours dans un compte Stockage Azure.
    - Le RPO doit être de 15 minutes.
    - Aucun autre service Azure que le compte de stockage ne peut être déployé.
    - Les administrateurs de bases de données doivent restaurer les bases avec SQL Server Management Studio.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Azure Backup for SQL Server in Azure VMs", fr: "Sauvegarde Azure pour SQL Server dans des machines virtuelles Azure" }
    - id: b
      text: { en: "Manual backups to URL scheduled by SQL Server Agent jobs", fr: "Des sauvegardes manuelles vers une URL planifiées par des travaux SQL Server Agent" }
    - id: c
      text: { en: "Azure VM backup with an Enhanced policy", fr: "La sauvegarde de machines virtuelles Azure avec une stratégie améliorée" }
    - id: d
      text: { en: "Automated Backup of the SQL IaaS Agent extension", fr: "La Sauvegarde automatisée de l'extension SQL IaaS Agent" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Automated Backup is a feature of the SQL IaaS Agent extension: it schedules the backups of all the databases of the virtual machine to a storage account, with a retention in days and log backups that allow a 15-minute RPO. It requires no additional Azure service, is configured from the portal, and the databases are restored with SQL Server Management Studio or Transact-SQL.
    fr: |
      La Sauvegarde automatisée est une fonctionnalité de l'extension SQL IaaS Agent : elle planifie les sauvegardes de toutes les bases de données de la machine virtuelle vers un compte de stockage, avec une rétention en jours et des sauvegardes du journal qui permettent un RPO de 15 minutes. Elle ne nécessite aucun service Azure supplémentaire, se configure dans le portail, et les bases se restaurent avec SQL Server Management Studio ou Transact-SQL.
  options:
    a:
      en: "Azure Backup for SQL Server requires a Recovery Services vault, an additional service, and its restores are run from Azure Backup rather than from SQL Server Management Studio."
      fr: "Sauvegarde Azure pour SQL Server nécessite un coffre Recovery Services, un service supplémentaire, et ses restaurations se lancent depuis Sauvegarde Azure plutôt que depuis SQL Server Management Studio."
    b:
      en: "Manual backups to URL meet the technical requirements but leave the jobs, the retention and the cleanup of backup files to the administrators."
      fr: "Les sauvegardes manuelles vers une URL répondent aux exigences techniques mais laissent aux administrateurs les travaux, la rétention et le nettoyage des fichiers de sauvegarde."
    c:
      en: "Azure VM backup needs a Recovery Services vault, runs every four hours at best and doesn't take transaction log backups."
      fr: "La sauvegarde de machines virtuelles Azure nécessite un coffre Recovery Services, s'exécute au mieux toutes les quatre heures et n'effectue pas de sauvegardes du journal des transactions."
references:
  - title: Backup and restore for SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/backup-restore
