id: az305-3a-cmp-restore-options
objective: "3.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam backs up its Azure virtual machines every day with Azure Backup. The operations team asks which restore option to use in three situations.

    You need to recommend a restore option for each situation. Recovery time and administrative effort must be minimized.

    Which restore option should you recommend for each situation? To answer, drag the appropriate restore options to the correct situations. Each restore option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam sauvegarde chaque jour ses machines virtuelles Azure avec Sauvegarde Azure. L'équipe d'exploitation demande quelle option de restauration utiliser dans trois situations.

    Vous devez recommander une option de restauration pour chaque situation. Le délai de récupération et l'effort d'administration doivent être réduits au minimum.

    Quelle option de restauration devez-vous recommander pour chaque situation ? Pour répondre, faites glisser les options de restauration appropriées vers les situations correspondantes. Chaque option de restauration peut être utilisée une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: newvm, text: { en: "Create a new virtual machine", fr: "Créer une machine virtuelle" } }
    - { id: disks, text: { en: "Restore disks", fr: "Restaurer des disques" } }
    - { id: replace, text: { en: "Replace existing", fr: "Remplacer l'existant" } }
    - { id: files, text: { en: "File Recovery", fr: "Récupération de fichiers" } }
    - { id: crr, text: { en: "Restore to the secondary region", fr: "Restaurer dans la région secondaire" } }
  targets:
    - id: t1
      text: { en: "Three configuration files were deleted yesterday on VM1; nothing else must change on VM1.", fr: "Trois fichiers de configuration ont été supprimés hier sur VM1 ; rien d'autre ne doit changer sur VM1." }
    - id: t2
      text: { en: "A failed update corrupted the disks of VM2; VM2 must keep its name and network configuration and return to last night's state.", fr: "Une mise à jour ratée a corrompu les disques de VM2 ; VM2 doit garder son nom et sa configuration réseau et revenir à l'état de la nuit dernière." }
    - id: t3
      text: { en: "The disks of a recovery point of VM3 are needed, together with a template, to build a virtual machine with a customized configuration.", fr: "Les disques d'un point de récupération de VM3 sont nécessaires, accompagnés d'un modèle, pour créer une machine virtuelle avec une configuration personnalisée." }
answer:
  mapping: { t1: files, t2: replace, t3: disks }
explanation:
  correct:
    en: |
      File Recovery gives access to the files of a recovery point without restoring a disk or a virtual machine. Replace existing swaps the disks of a virtual machine that still exists with those of the recovery point, so the machine keeps its identity and settings. Restore disks copies the disks to a resource group and generates a template that you can customize to create a virtual machine.
    fr: |
      La récupération de fichiers donne accès aux fichiers d'un point de récupération sans restaurer de disque ni de machine virtuelle. Remplacer l'existant échange les disques d'une machine virtuelle qui existe toujours avec ceux du point de récupération : la machine garde son identité et ses paramètres. Restaurer des disques copie les disques dans un groupe de ressources et génère un modèle que vous pouvez personnaliser pour créer une machine virtuelle.
  options:
    newvm: { en: "Creating a new virtual machine builds a basic machine with a new name; it neither returns single files nor keeps the existing machine.", fr: "Créer une machine virtuelle produit une machine de base portant un nouveau nom ; cela ne rend pas des fichiers isolés et ne conserve pas la machine existante." }
    crr: { en: "A restore to the secondary region is used for a regional outage or a drill, and needs a geo-redundant vault with Cross Region Restore.", fr: "Une restauration dans la région secondaire sert en cas de panne régionale ou d'exercice, et nécessite un coffre géoredondant avec la restauration interrégion." }
references:
  - title: How to restore Azure VM data in Azure portal
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-restore-vms
