id: az305-3a-db-sqlmi-standby-replica
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an Azure SQL Managed Instance in the West Europe region that hosts 40 databases used by several applications.

    You need to recommend a recovery solution for a region-wide outage of West Europe. The solution must meet the following requirements:

    - All the databases must be available in North Europe within one hour.
    - The applications must reconnect without any change to their connection strings.
    - The copy in North Europe will never be used for read workloads.
    - Licensing costs must be minimized.

    What should you recommend?
  fr: |
    Fabrikam possède une instance Azure SQL Managed Instance dans la région West Europe, qui héberge 40 bases de données utilisées par plusieurs applications.

    Vous devez recommander une solution de récupération en cas de panne de toute la région West Europe. La solution doit répondre aux exigences suivantes :

    - Toutes les bases de données doivent être disponibles dans North Europe en moins d'une heure.
    - Les applications doivent se reconnecter sans aucune modification de leurs chaînes de connexion.
    - La copie située dans North Europe ne servira jamais à des charges de travail de lecture.
    - Les coûts de licence doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A failover group whose secondary instance is designated as a standby replica", fr: "Un groupe de basculement dont l'instance secondaire est désignée comme réplica de secours" }
    - id: b
      text: { en: "A failover group whose secondary instance is a readable replica", fr: "Un groupe de basculement dont l'instance secondaire est un réplica lisible" }
    - id: c
      text: { en: "Active geo-replication of each database to an instance in North Europe", fr: "Une géoréplication active de chaque base de données vers une instance située dans North Europe" }
    - id: d
      text: { en: "Geo-redundant backup storage and a geo-restore to a new instance in North Europe", fr: "Un stockage de sauvegarde géoredondant et une géorestauration sur une nouvelle instance dans North Europe" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A failover group replicates all the user databases of a managed instance to a secondary instance in another region and exposes listener endpoints that keep the same name after a failover. When the secondary instance is used only for disaster recovery, it can be designated as a standby replica: Microsoft then doesn't charge the SQL Server license for its vCores, and only compute and storage are billed.
    fr: |
      Un groupe de basculement réplique toutes les bases de données utilisateur d'une instance managée vers une instance secondaire d'une autre région et expose des points de terminaison d'écouteur qui gardent le même nom après un basculement. Lorsque l'instance secondaire ne sert qu'à la reprise d'activité, elle peut être désignée comme réplica de secours : Microsoft ne facture alors pas la licence SQL Server de ses vCores, et seuls le calcul et le stockage sont facturés.
  options:
    b:
      en: "A readable secondary instance meets the recovery objectives, but its SQL Server license is charged, which isn't the lowest licensing cost for a copy that is never read."
      fr: "Une instance secondaire lisible respecte les objectifs de récupération, mais sa licence SQL Server est facturée, ce qui n'est pas le coût de licence le plus bas pour une copie jamais lue."
    c:
      en: "Active geo-replication is a feature of Azure SQL Database; for SQL Managed Instance, geo-replication is provided by failover groups."
      fr: "La géoréplication active est une fonctionnalité d'Azure SQL Database ; pour SQL Managed Instance, la géoréplication est fournie par les groupes de basculement."
    d:
      en: "A geo-restore of 40 databases to a new instance can take hours, and the applications would have to connect to a new instance name."
      fr: "Une géorestauration de 40 bases de données sur une nouvelle instance peut prendre des heures, et les applications devraient se connecter à un nouveau nom d'instance."
references:
  - title: Failover groups overview & best practices - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/failover-group-sql-mi
