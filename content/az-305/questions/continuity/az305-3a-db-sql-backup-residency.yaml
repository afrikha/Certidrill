id: az305-3a-db-sql-backup-residency
objective: "3.1.3"
type: single
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    Woodgrove Bank plans to deploy an Azure SQL Database in the General Purpose service tier in the Germany West Central region, which supports availability zones.

    The backup design must meet the following requirements:

    - The point-in-time restore backups and the long-term retention backups must never be stored outside Germany West Central.
    - The backups must remain available if one datacenter of the region fails.

    Which backup storage redundancy should you recommend?
  fr: |
    Woodgrove Bank prévoit de déployer une base de données Azure SQL Database au niveau de service Usage général (General Purpose) dans la région Germany West Central, qui prend en charge les zones de disponibilité.

    La conception des sauvegardes doit répondre aux exigences suivantes :

    - Les sauvegardes de restauration à un instant dans le passé et les sauvegardes de conservation à long terme ne doivent jamais être stockées en dehors de Germany West Central.
    - Les sauvegardes doivent rester disponibles si un centre de données de la région tombe en panne.

    Quelle redondance du stockage de sauvegarde devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Locally redundant storage (LRS)", fr: "Stockage localement redondant (LRS)" }
    - id: b
      text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" }
    - id: c
      text: { en: "Geo-redundant storage (GRS)", fr: "Stockage géoredondant (GRS)" }
    - id: d
      text: { en: "Geo-zone-redundant storage (GZRS)", fr: "Stockage géoredondant interzone (GZRS)" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The backup storage redundancy of an Azure SQL Database applies to both the short-term and the long-term retention backups. Zone-redundant storage copies them across availability zones of the same region, so they survive the loss of a datacenter without leaving the region. The trade-off is that geo-restore isn't available, because it requires geo-redundant backup storage.
    fr: |
      La redondance du stockage de sauvegarde d'une base de données Azure SQL Database s'applique à la fois aux sauvegardes de rétention à court terme et à celles de conservation à long terme. Le stockage redondant interzone les copie entre des zones de disponibilité de la même région : elles survivent à la perte d'un centre de données sans quitter la région. En contrepartie, la géorestauration n'est pas disponible, car elle exige un stockage de sauvegarde géoredondant.
  options:
    a:
      en: "Locally redundant storage keeps the backups in the region but in a single datacenter, whose failure would make them unavailable."
      fr: "Le stockage localement redondant garde les sauvegardes dans la région mais dans un seul centre de données, dont la panne les rendrait indisponibles."
    c:
      en: "Geo-redundant storage, the default, replicates the backups to the paired region, outside Germany West Central."
      fr: "Le stockage géoredondant, valeur par défaut, réplique les sauvegardes dans la région jumelée, hors de Germany West Central."
    d:
      en: "Geo-zone-redundant storage also replicates the backups to the paired region."
      fr: "Le stockage géoredondant interzone réplique lui aussi les sauvegardes dans la région jumelée."
references:
  - title: Automated backups in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
