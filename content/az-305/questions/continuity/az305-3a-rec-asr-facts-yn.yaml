id: az305-3a-rec-asr-facts-yn
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders plans to protect 30 Azure virtual machines in the Central US region by replicating them to the East US 2 region with Azure Site Recovery. The default replication settings will be used wherever possible.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders prévoit de protéger 30 machines virtuelles Azure de la région Central US en les répliquant vers la région East US 2 avec Azure Site Recovery. Les paramètres de réplication par défaut seront utilisés autant que possible.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Before any failover, Northwind Traders pays compute charges for 30 running virtual machines in East US 2.
        fr: Avant tout basculement, Northwind Traders paie des frais de calcul pour 30 machines virtuelles en cours d'exécution dans East US 2.
    - id: s2
      text:
        en: A test failover can be run in East US 2 while the replication of the production virtual machines continues.
        fr: Un test de basculement peut être exécuté dans East US 2 pendant que la réplication des machines virtuelles de production se poursuit.
    - id: s3
      text:
        en: The solution lets Northwind Traders recover a virtual machine as it was 60 days ago.
        fr: La solution permet à Northwind Traders de récupérer une machine virtuelle dans l'état où elle était il y a 60 jours.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Site Recovery keeps only replica managed disks in the target region; the virtual machines are created at failover or test failover, and compute is billed from then on. A disaster recovery drill runs in an isolated network without affecting the ongoing replication. Recovery points are kept one day by default and 15 days at most, so a recovery to a state of 60 days ago requires Azure Backup.
    fr: |
      Site Recovery ne conserve que des disques managés réplicas dans la région cible ; les machines virtuelles sont créées au basculement ou au test de basculement, et le calcul est facturé à partir de ce moment. Un exercice de reprise d'activité se déroule dans un réseau isolé sans perturber la réplication en cours. Les points de récupération sont conservés un jour par défaut et 15 jours au plus : revenir à un état datant de 60 jours nécessite Sauvegarde Azure.
references:
  - title: Azure to Azure disaster recovery architecture
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-architecture
  - title: General questions about Azure Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-faq
