id: az305-3b-postgresql-region-outage
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs an Azure Database for PostgreSQL flexible server in the Germany West Central region. The server uses the General Purpose tier and zone-redundant high availability. Geo-redundant backup wasn't selected when the server was created.

    A new requirement states that after an outage of the whole region, the database must be available in another region within minutes. Losing the transactions that weren't yet copied to the other region is acceptable.

    You need to recommend a solution that meets the requirement.

    What should you recommend?
  fr: |
    Northwind Traders exécute un serveur flexible Azure Database pour PostgreSQL dans la région Germany West Central. Le serveur utilise le niveau General Purpose et la haute disponibilité redondante interzone. La sauvegarde géoredondante n'a pas été sélectionnée à la création du serveur.

    Une nouvelle exigence impose qu'après une panne de toute la région, la base de données soit disponible dans une autre région en quelques minutes. La perte des transactions qui n'avaient pas encore été copiées vers l'autre région est acceptable.

    Vous devez recommander une solution qui répond à l'exigence.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Enable geo-redundant backup on the server, and restore the backup in the paired region if the region fails.", fr: "Activer la sauvegarde géoredondante sur le serveur, et restaurer la sauvegarde dans la région jumelée si la région tombe en panne." }
    - id: b
      text: { en: "Create a read replica in another region, and promote the replica if the region fails.", fr: "Créer un réplica en lecture dans une autre région, et promouvoir le réplica si la région tombe en panne." }
    - id: c
      text: { en: "Change the server to same-zone high availability, and fail over to the standby server if the region fails.", fr: "Passer le serveur en haute disponibilité dans la même zone, et basculer vers le serveur de secours si la région tombe en panne." }
    - id: d
      text: { en: "Keep the current configuration, and restore the server to a point in time if the region fails.", fr: "Conserver la configuration actuelle, et restaurer le serveur à un instant dans le passé si la région tombe en panne." }
answer: { optionId: b }
explanation:
  correct:
    en: A read replica can be created in any region that supports the service and receives the changes asynchronously. During a regional outage, a forced promotion turns it into a read-write server, typically in one to three minutes, and only the changes that weren't replicated yet are lost. The promotion is started by the customer, never by Azure.
    fr: Un réplica en lecture peut être créé dans toute région qui prend en charge le service et reçoit les modifications de façon asynchrone. Pendant une panne régionale, une promotion forcée le transforme en serveur en lecture-écriture, généralement en une à trois minutes, et seules les modifications qui n'avaient pas encore été répliquées sont perdues. La promotion est lancée par le client, jamais par Azure.
  options:
    a:
      en: Geo-redundant backup can be selected only when the server is created, and restoring a backup involves more downtime and data loss than promoting a replica.
      fr: La sauvegarde géoredondante ne peut être sélectionnée qu'à la création du serveur, et la restauration d'une sauvegarde entraîne plus d'interruption et de perte de données que la promotion d'un réplica.
    c:
      en: The standby server of a high-availability configuration is always in the region of the primary, in the same zone or in another zone. It is lost with the region.
      fr: Le serveur de secours d'une configuration à haute disponibilité se trouve toujours dans la région du serveur principal, dans la même zone ou dans une autre. Il est perdu avec la région.
    d:
      en: Without geo-redundant backup, the backups stay in the region of the server, so a point-in-time restore isn't possible while that region is down.
      fr: Sans sauvegarde géoredondante, les sauvegardes restent dans la région du serveur ; une restauration à un instant dans le passé est donc impossible tant que cette région est en panne.
references:
  - title: Reliability in Azure Database for PostgreSQL
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-postgresql-flexible-server
