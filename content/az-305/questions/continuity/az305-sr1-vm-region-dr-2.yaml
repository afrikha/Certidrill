id: az305-sr1-vm-region-dr-2
objective: "3.1.1"
type: series_yesno
series: az305-sr1-vm-region-dr
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You recommend Azure Site Recovery between availability zones of West Europe.
  fr: Vous recommandez Azure Site Recovery entre les zones de disponibilité de West Europe.
body:
  solution:
    en: |
      You recommend enabling **Azure Site Recovery** for the eight virtual machines and replicating each virtual machine to **another availability zone of West Europe**. A recovery plan fails over all the virtual machines.
    fr: |
      Vous recommandez d'activer **Azure Site Recovery** pour les huit machines virtuelles et de répliquer chaque machine virtuelle vers **une autre zone de disponibilité de West Europe**. Un plan de récupération bascule toutes les machines virtuelles.
answer: { value: false }
explanation:
  correct:
    en: |
      Zone-to-zone disaster recovery replicates continuously, so the data loss stays small, but the replicas remain inside West Europe. It protects against the failure of an availability zone, not against the failure of the entire region stated in the goal, and nothing can be started in North Europe. A regional failure requires replication to another region.
    fr: |
      La reprise d'activité de zone à zone réplique en continu, donc la perte de données reste faible, mais les réplicas demeurent dans West Europe. Elle protège contre la défaillance d'une zone de disponibilité, pas contre la défaillance de toute la région visée par l'objectif, et rien ne peut être démarré dans North Europe. Une défaillance régionale exige une réplication vers une autre région.
references:
  - title: Enable Azure VM disaster recovery between availability zones
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-how-to-enable-zone-to-zone-disaster-recovery
