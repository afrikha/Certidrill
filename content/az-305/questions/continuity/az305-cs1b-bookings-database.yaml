id: az305-cs1b-bookings-database
objective: "3.2.2"
type: dropdown
caseStudy: az305-cs1b-blue-yonder
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a configuration for sqldb-bookings that supports the planned changes and meets the requirements of the bookings database.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une configuration pour sqldb-bookings qui prend en charge les changements prévus et répond aux exigences de la base de données des réservations.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Service tier: [[tier]]

      Protection against the failure of West Europe: [[geo]]
    fr: |
      Niveau de service : [[tier]]

      Protection contre la panne de West Europe : [[geo]]
  slots:
    - id: tier
      options:
        - { id: gp, text: "General Purpose" }
        - { id: hs, text: "Hyperscale" }
        - { id: bc, text: "Business Critical" }
    - id: geo
      options:
        - { id: fog, text: { en: "A failover group with a server in East US 2", fr: "Un groupe de basculement avec un serveur dans East US 2" } }
        - { id: georep, text: { en: "Active geo-replication to a server in East US 2, without a failover group", fr: "La géoréplication active vers un serveur dans East US 2, sans groupe de basculement" } }
        - { id: georestore, text: { en: "Geo-restore of the geo-redundant backups to a server in East US 2", fr: "La géorestauration des sauvegardes géoredondantes vers un serveur dans East US 2" } }
answer:
  values: { tier: bc, geo: fog }
explanation:
  correct:
    en: |
      In Azure SQL Database, memory-optimized tables are available in the Business Critical service tier (Premium in the DTU model). A failover group replicates the database continuously to East US 2 and exposes a read-write listener endpoint whose name stays the same after a failover: app-booking keeps its connection string, and the secondary database is online within minutes of the failover.
    fr: |
      Dans Azure SQL Database, les tables optimisées en mémoire sont disponibles au niveau de service Business Critical (Premium dans le modèle DTU). Un groupe de basculement réplique la base de données en continu vers East US 2 et expose un point de terminaison d'écouteur en lecture-écriture dont le nom reste le même après un basculement : app-booking conserve sa chaîne de connexion, et la base de données secondaire est en ligne quelques minutes après le basculement.
  options:
    gp:
      en: In-Memory OLTP isn't supported in the General Purpose service tier.
      fr: In-Memory OLTP n'est pas pris en charge au niveau de service General Purpose.
    hs:
      en: Hyperscale supports only a subset of In-Memory OLTP objects; memory-optimized tables must be removed before a database moves to this tier.
      fr: Hyperscale ne prend en charge qu'un sous-ensemble des objets In-Memory OLTP ; les tables optimisées en mémoire doivent être supprimées avant qu'une base de données passe à ce niveau.
    georep:
      en: Active geo-replication alone gives the secondary database a different server name, so the connection strings must be changed after a failover.
      fr: La géoréplication active seule donne à la base de données secondaire un autre nom de serveur ; les chaînes de connexion doivent donc être modifiées après un basculement.
    georestore:
      en: Geo-restore creates a new database on another server from backups; it can take hours and the connection strings change.
      fr: La géorestauration crée une nouvelle base de données sur un autre serveur à partir de sauvegardes ; elle peut prendre des heures et les chaînes de connexion changent.
references:
  - title: Failover groups overview & best practices (Azure SQL Database)
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
  - title: Optimize performance by using in-memory technologies in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/in-memory-oltp-overview
