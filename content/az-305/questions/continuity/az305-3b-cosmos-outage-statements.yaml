id: az305-3b-cosmos-outage-statements
objective: "3.2.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL account that has the following configuration:

    - Write region: West Europe
    - Read region: North Europe
    - Default consistency level: session
    - Service-managed failover: enabled
    - Per-partition automatic failover: not enabled

    The applications use the Azure Cosmos DB SDK with both regions in the list of preferred regions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un compte Azure Cosmos DB for NoSQL dont la configuration est la suivante :

    - Région d'écriture : West Europe
    - Région de lecture : North Europe
    - Niveau de cohérence par défaut : session
    - Basculement géré par le service : activé
    - Basculement automatique par partition : non activé

    Les applications utilisent le SDK Azure Cosmos DB avec les deux régions dans la liste des régions préférées.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If West Europe becomes unavailable, write operations continue without interruption.
        fr: Si West Europe devient indisponible, les opérations d'écriture se poursuivent sans interruption.
    - id: s2
      text:
        en: If North Europe becomes unavailable, the applications continue to read and write by using West Europe.
        fr: Si North Europe devient indisponible, les applications continuent de lire et d'écrire en utilisant West Europe.
    - id: s3
      text:
        en: Changing the default consistency level to bounded staleness guarantees that no committed write is lost if West Europe fails.
        fr: Le passage du niveau de cohérence par défaut à l'obsolescence limitée (bounded staleness) garantit qu'aucune écriture validée n'est perdue si West Europe tombe en panne.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: With a single write region and no per-partition automatic failover, write availability is lost when the write region fails, until the region is taken offline by a forced failover or the service-managed failover completes, which can take an hour or more. Reads continue from North Europe. When a read region fails, the SDK sends the requests to the remaining region, and with session consistency writes aren't affected. Only strong consistency gives an RPO of zero. With bounded staleness the RPO is the staleness window.
    fr: "Avec une seule région d'écriture et sans basculement automatique par partition, la disponibilité en écriture est perdue quand la région d'écriture tombe en panne, jusqu'à ce que la région soit mise hors connexion par un basculement forcé ou que le basculement géré par le service se termine, ce qui peut prendre une heure ou plus. Les lectures continuent depuis North Europe. Quand une région de lecture tombe en panne, le SDK envoie les requêtes vers la région restante, et avec la cohérence de session les écritures ne sont pas touchées. Seule la cohérence forte donne un RPO de zéro : avec l'obsolescence limitée, le RPO est la fenêtre d'obsolescence."
references:
  - title: Reliability in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-cosmos-db-nosql
  - title: Consistency levels in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
