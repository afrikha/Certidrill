id: az305-3a-uns-unplanned-failover-steps
objective: "3.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank stores blobs in a standard general-purpose v2 storage account named stwoodgrove in the East US region. The account uses geo-redundant storage (GRS).

    A region-wide outage makes the primary endpoints of stwoodgrove unavailable, and Microsoft gives no estimated time of recovery. You need to recommend a recovery procedure that meets the following requirements:

    - The potential data loss must be assessed before any change is made.
    - Applications must be able to write to stwoodgrove again as soon as possible.
    - After the recovery, stwoodgrove must again be protected against a regional outage.

    Which three actions should you recommend in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank stocke des objets blob dans un compte de stockage standard à usage général v2 nommé stwoodgrove, dans la région East US. Le compte utilise le stockage géoredondant (GRS).

    Une panne de toute la région rend indisponibles les points de terminaison primaires de stwoodgrove, et Microsoft ne donne aucune estimation du délai de rétablissement. Vous devez recommander une procédure de récupération qui répond aux exigences suivantes :

    - La perte de données potentielle doit être évaluée avant toute modification.
    - Les applications doivent pouvoir écrire à nouveau dans stwoodgrove le plus tôt possible.
    - Après la récupération, stwoodgrove doit de nouveau être protégé contre une panne régionale.

    Quelles sont les trois actions à recommander dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: planned, text: { en: "Initiate a customer-managed planned failover.", fr: "Lancer un basculement planifié géré par le client." } }
    - { id: lst, text: { en: "Check the Last Sync Time property of the account.", fr: "Vérifier la propriété Heure de la dernière synchronisation du compte." } }
    - { id: support, text: { en: "Ask Microsoft to start a Microsoft-managed failover of the account.", fr: "Demander à Microsoft de lancer un basculement géré par Microsoft pour le compte." } }
    - { id: grs, text: { en: "Convert the account from locally redundant storage to geo-redundant storage.", fr: "Convertir le compte du stockage localement redondant au stockage géoredondant." } }
    - { id: unplanned, text: { en: "Initiate a customer-managed unplanned failover.", fr: "Lancer un basculement non planifié géré par le client." } }
    - { id: objrep, text: { en: "Configure object replication from the secondary region to the primary region.", fr: "Configurer la réplication d'objets de la région secondaire vers la région primaire." } }
answer:
  sequence: [ lst, unplanned, grs ]
explanation:
  correct:
    en: |
      Geo-replication is asynchronous, so the Last Sync Time is checked first: writes made after it may be lost by the failover. A customer-managed unplanned failover then makes the secondary region the new primary, usually in less than one hour, and applications can write again. After this failover the account is locally redundant in the new primary region, so it must be converted back to geo-redundant storage.
    fr: |
      La géoréplication est asynchrone : on vérifie donc d'abord l'Heure de la dernière synchronisation, car les écritures postérieures risquent d'être perdues lors du basculement. Un basculement non planifié géré par le client fait ensuite de la région secondaire la nouvelle région primaire, généralement en moins d'une heure, et les applications peuvent écrire à nouveau. Après ce basculement, le compte est localement redondant dans la nouvelle région primaire : il doit donc être reconverti en stockage géoredondant.
  options:
    planned: { en: "A planned failover requires both the primary and the secondary regions to be available.", fr: "Un basculement planifié exige que les régions primaire et secondaire soient toutes deux disponibles." }
    support: { en: "A Microsoft-managed failover covers a whole region in extreme circumstances; it can't be requested for an individual account, and Microsoft advises against relying on it.", fr: "Un basculement géré par Microsoft concerne une région entière dans des circonstances extrêmes ; il ne peut pas être demandé pour un compte individuel, et Microsoft déconseille de s'y fier." }
    objrep: { en: "Object replication copies blobs between two separate accounts; it doesn't restore the geo-redundancy of the account.", fr: "La réplication d'objets copie des objets blob entre deux comptes distincts ; elle ne rétablit pas la géoredondance du compte." }
references:
  - title: Azure storage disaster recovery planning and failover
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-disaster-recovery-guidance
