id: az305-3a-rec-objectives-yn
objective: "3.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum defines the following recovery objectives for an application named App1 that runs on Azure virtual machines:

    - RTO: four hours
    - RPO: 15 minutes

    You evaluate several proposals against these objectives.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum définit les objectifs de récupération suivants pour une application nommée App1, exécutée sur des machines virtuelles Azure :

    - RTO : quatre heures
    - RPO : 15 minutes

    Vous évaluez plusieurs propositions par rapport à ces objectifs.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A solution that brings App1 back after two hours with the data as it was 10 minutes before the incident meets both objectives.
        fr: Une solution qui remet App1 en service après deux heures avec les données telles qu'elles étaient 10 minutes avant l'incident respecte les deux objectifs.
    - id: s2
      text:
        en: A solution that restores App1 within one hour from the backup of the previous night meets both objectives.
        fr: Une solution qui restaure App1 en moins d'une heure à partir de la sauvegarde de la nuit précédente respecte les deux objectifs.
    - id: s3
      text:
        en: A solution that brings App1 back after six hours without any data loss meets both objectives.
        fr: Une solution qui remet App1 en service après six heures sans aucune perte de données respecte les deux objectifs.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The RPO is the maximum acceptable data loss, measured as time before the incident, and the RTO is the maximum acceptable time to restore the service. Two hours of downtime and 10 minutes of lost data are within both limits. A nightly backup can lose many hours of data, which exceeds the RPO, and six hours of downtime exceeds the RTO even when no data is lost.
    fr: |
      Le RPO est la perte de données maximale acceptable, mesurée en temps avant l'incident, et le RTO est le délai maximal acceptable pour rétablir le service. Deux heures d'arrêt et 10 minutes de données perdues restent dans les deux limites. Une sauvegarde nocturne peut faire perdre de nombreuses heures de données, ce qui dépasse le RPO, et six heures d'arrêt dépassent le RTO même sans perte de données.
references:
  - title: Architecture strategies for disaster recovery
    url: https://learn.microsoft.com/en-us/azure/well-architected/reliability/disaster-recovery
