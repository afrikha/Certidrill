id: az305-3b-hyperscale-zone-redundancy
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam plans to migrate an 8-TB on-premises database to a new Azure SQL database in the Hyperscale service tier. The database will be created in a region that supports availability zones.

    You need to recommend how to create the database. The solution must meet the following requirements:

    - The database must remain available, without data loss, if an availability zone fails.
    - Costs must be minimized.

    What should you recommend?
  fr: |
    Fabrikam prévoit de migrer une base de données locale de 8 To vers une nouvelle base de données Azure SQL dans le niveau de service Hyperscale. La base de données sera créée dans une région qui prend en charge les zones de disponibilité.

    Vous devez recommander la façon de créer la base de données. La solution doit répondre aux exigences suivantes :

    - La base de données doit rester disponible, sans perte de données, si une zone de disponibilité tombe en panne.
    - Les coûts doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Create the database with no high-availability replica and locally redundant backup storage, and enable zone redundancy when the migration is complete.", fr: "Créer la base de données sans réplica à haute disponibilité et avec un stockage de sauvegarde localement redondant, puis activer la redondance de zone une fois la migration terminée." }
    - id: b
      text: { en: "Create the database with zone redundancy, no high-availability replica and geo-redundant backup storage.", fr: "Créer la base de données avec la redondance de zone, sans réplica à haute disponibilité et avec un stockage de sauvegarde géoredondant." }
    - id: c
      text: { en: "Create the database with zone redundancy, one high-availability replica and zone-redundant backup storage.", fr: "Créer la base de données avec la redondance de zone, un réplica à haute disponibilité et un stockage de sauvegarde redondant interzone." }
    - id: d
      text: { en: "Create the database with no high-availability replica and locally redundant backup storage, and add a named replica when the migration is complete.", fr: "Créer la base de données sans réplica à haute disponibilité et avec un stockage de sauvegarde localement redondant, puis ajouter un réplica nommé une fois la migration terminée." }
answer: { optionId: c }
explanation:
  correct:
    en: For a Hyperscale database, zone redundancy can be set only when the database is created. It requires at least one high-availability replica and zone-redundant or geo-zone-redundant backup storage. One replica and zone-redundant backup storage are the minimum, and so the cheapest configuration that survives a zone failure.
    fr: Pour une base de données Hyperscale, la redondance de zone ne peut être définie qu'à la création de la base. Elle exige au moins un réplica à haute disponibilité et un stockage de sauvegarde redondant interzone ou géoredondant interzone. Un réplica et un stockage de sauvegarde redondant interzone constituent le minimum, donc la configuration la moins chère qui survit à la panne d'une zone.
  options:
    a:
      en: Zone redundancy of a Hyperscale database can't be changed after creation. Changing it later means copying or restoring the 8-TB database to a new one.
      fr: La redondance de zone d'une base Hyperscale ne peut pas être modifiée après la création. La changer plus tard revient à copier ou restaurer la base de 8 To vers une nouvelle base.
    b:
      en: A zone-redundant Hyperscale database needs at least one high-availability replica, and geo-redundant backup storage isn't one of the two accepted options.
      fr: Une base Hyperscale redondante interzone a besoin d'au moins un réplica à haute disponibilité, et le stockage de sauvegarde géoredondant ne fait pas partie des deux options acceptées.
    d:
      en: A named replica serves read workloads with its own compute size. It doesn't make the primary database zone-redundant.
      fr: Un réplica nommé sert des charges de travail de lecture avec sa propre taille de calcul. Il ne rend pas la base de données primaire redondante interzone.
references:
  - title: Availability through redundancy - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla-local-zone-redundancy
  - title: Hyperscale secondary replicas
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale-replicas
