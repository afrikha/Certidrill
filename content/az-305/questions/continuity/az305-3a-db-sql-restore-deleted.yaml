id: az305-3a-db-sql-restore-deleted
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure SQL Database logical server named sql1 that hosts a database named DB1 in the General Purpose service tier. DB1 uses the default backup settings, and no long-term retention policy is configured.

    Twenty minutes ago, an administrator deleted DB1 by mistake. The server sql1 still exists.

    You need to recommend how to recover DB1 with the least data loss.

    What should you recommend?
  fr: |
    Fabrikam possède un serveur logique Azure SQL Database nommé sql1 qui héberge une base de données nommée DB1 au niveau de service Usage général (General Purpose). DB1 utilise les paramètres de sauvegarde par défaut, et aucune stratégie de conservation à long terme n'est configurée.

    Il y a vingt minutes, un administrateur a supprimé DB1 par erreur. Le serveur sql1 existe toujours.

    Vous devez recommander la manière de récupérer DB1 avec la plus faible perte de données.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Perform a geo-restore of DB1 to a server in the paired region.", fr: "Effectuer une géorestauration de DB1 sur un serveur de la région jumelée." }
    - id: b
      text: { en: "Restore DB1 from a long-term retention backup.", fr: "Restaurer DB1 à partir d'une sauvegarde de conservation à long terme." }
    - id: c
      text: { en: "Restore the deleted database on sql1 to the time of its deletion.", fr: "Restaurer la base de données supprimée sur sql1 à l'heure de sa suppression." }
    - id: d
      text: { en: "Create a support request asking Microsoft to recover DB1.", fr: "Créer une demande de support pour que Microsoft récupère DB1." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure SQL Database takes a final transaction log backup before a database is deleted and keeps the backups of the deleted database for its retention period. As long as the logical server exists, the deleted database can be restored on that server to the time of deletion or to an earlier point, with no data loss.
    fr: |
      Azure SQL Database effectue une dernière sauvegarde du journal des transactions avant la suppression d'une base de données et conserve les sauvegardes de la base supprimée pendant sa période de rétention. Tant que le serveur logique existe, la base de données supprimée peut être restaurée sur ce serveur à l'heure de la suppression ou à un instant antérieur, sans perte de données.
  options:
    a:
      en: "A geo-restore uses the backups replicated asynchronously to the paired region, so it can miss the most recent changes, and it isn't needed while sql1 is available."
      fr: "Une géorestauration utilise les sauvegardes répliquées de façon asynchrone dans la région jumelée : elle peut ne pas contenir les dernières modifications, et elle est inutile tant que sql1 est disponible."
    b:
      en: "No long-term retention policy is configured, and such backups are weekly full backups that would lose days of data."
      fr: "Aucune stratégie de conservation à long terme n'est configurée, et ces sauvegardes sont des sauvegardes complètes hebdomadaires qui feraient perdre des jours de données."
    d:
      en: "Restoring a deleted database is a self-service operation in the portal, PowerShell or the CLI; no support request is involved."
      fr: "La restauration d'une base de données supprimée est une opération en libre-service dans le portail, PowerShell ou l'interface CLI ; aucune demande de support n'intervient."
references:
  - title: Restore a database from a backup in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/recovery-using-backups
  - title: Automated backups in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
