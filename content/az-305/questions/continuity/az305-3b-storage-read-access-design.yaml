id: az305-3b-storage-read-access-design
objective: "3.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is building a document viewer application that reads block blobs from a general-purpose v2 storage account in the Canada Central region. The account uses zone-redundant storage (ZRS).

    You need to recommend changes that meet the following requirements:

    - During an outage of the primary region, the application must continue to serve read requests automatically, without any action from an administrator.
    - The application may reject updates during the outage.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam développe une application de consultation de documents qui lit des objets blob de blocs dans un compte de stockage à usage général v2 de la région Canada Central. Le compte utilise le stockage redondant interzone (ZRS).

    Vous devez recommander des modifications qui répondent aux exigences suivantes :

    - Pendant une panne de la région primaire, l'application doit continuer à traiter les requêtes de lecture automatiquement, sans aucune action d'un administrateur.
    - L'application peut refuser les mises à jour pendant la panne.

    Quelles sont les deux actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Change the redundancy of the account to GZRS.", fr: "Faire passer la redondance du compte à GZRS." }
    - id: b
      text: { en: "Change the redundancy of the account to RA-GZRS.", fr: "Faire passer la redondance du compte à RA-GZRS." }
    - id: c
      text: { en: "Design the application to send its write requests to the secondary endpoint when the primary endpoint fails.", fr: "Concevoir l'application pour qu'elle envoie ses requêtes d'écriture au point de terminaison secondaire quand le point de terminaison primaire échoue." }
    - id: d
      text: { en: "Design the application to retry its read requests against the secondary endpoint when the primary endpoint fails.", fr: "Concevoir l'application pour qu'elle relance ses requêtes de lecture sur le point de terminaison secondaire quand le point de terminaison primaire échoue." }
    - id: e
      text: { en: "Enable blob versioning and blob soft delete on the account.", fr: "Activer le contrôle de version des blobs et la suppression réversible des blobs sur le compte." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Only the read-access options (RA-GRS and RA-GZRS) expose a secondary endpoint that can be read while the primary region is down and before any failover. The application must also use it. The storage client library can retry read requests against the secondary endpoint, and the application runs in a read-only mode until the primary region is back.
    fr: "Seules les options avec accès en lecture (RA-GRS et RA-GZRS) exposent un point de terminaison secondaire lisible pendant que la région primaire est en panne et avant tout basculement. Encore faut-il que l'application l'utilise : la bibliothèque cliente de stockage peut relancer les requêtes de lecture sur le point de terminaison secondaire, et l'application fonctionne en lecture seule jusqu'au retour de la région primaire."
  options:
    a:
      en: With GZRS the data is copied to the secondary region, but it can't be read there until an administrator fails the account over.
      fr: Avec GZRS, les données sont copiées vers la région secondaire, mais elles n'y sont lisibles qu'après le basculement du compte par un administrateur.
    c:
      en: The secondary endpoint is read-only. It never accepts write requests.
      fr: Le point de terminaison secondaire est en lecture seule. Il n'accepte jamais de requêtes d'écriture.
    e:
      en: Versioning and soft delete protect blobs against overwrites and deletions. They don't make the data readable during a regional outage.
      fr: Le contrôle de version et la suppression réversible protègent les blobs contre les remplacements et les suppressions. Ils ne rendent pas les données lisibles pendant une panne régionale.
references:
  - title: Use geo-redundancy to design highly available applications
    url: https://learn.microsoft.com/en-us/azure/storage/common/geo-redundant-design
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
