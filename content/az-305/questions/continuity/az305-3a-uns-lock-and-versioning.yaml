id: az305-3a-uns-lock-and-versioning
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware stores contract documents as block blobs in a general-purpose v2 storage account named stprosewaredocs. The account doesn't have a hierarchical namespace. An application frequently overwrites the blobs with new revisions of the documents.

    You need to recommend a protection that meets the following requirements:

    - The storage account must be protected against accidental deletion.
    - When a blob is overwritten, its previous content must be preserved automatically and remain readable.
    - The application must keep overwriting the blobs without any change to its code.

    Which two features should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware stocke des contrats sous forme d'objets blob de blocs dans un compte de stockage à usage général v2 nommé stprosewaredocs. Le compte ne possède pas d'espace de noms hiérarchique. Une application remplace fréquemment les objets blob par de nouvelles révisions des documents.

    Vous devez recommander une protection qui répond aux exigences suivantes :

    - Le compte de stockage doit être protégé contre une suppression accidentelle.
    - Lorsqu'un objet blob est remplacé, son contenu précédent doit être préservé automatiquement et rester lisible.
    - L'application doit continuer à remplacer les objets blob sans aucune modification de son code.

    Quelles sont les deux fonctionnalités à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Container soft delete", fr: "La suppression réversible des conteneurs" } }
    - { id: b, text: { en: "Blob versioning", fr: "Le contrôle de version des objets blob" } }
    - { id: c, text: { en: "Read-access geo-redundant storage (RA-GRS)", fr: "Le stockage géoredondant avec accès en lecture (RA-GRS)" } }
    - { id: d, text: { en: "A CanNotDelete lock on the storage account", fr: "Un verrou CanNotDelete sur le compte de stockage" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A CanNotDelete resource lock prevents the deletion of the storage account while leaving its data and configuration usable. Blob versioning keeps the previous state of a blob as a readable version each time the blob is overwritten or deleted, automatically and without any change in the application.
    fr: |
      Un verrou de ressource CanNotDelete empêche la suppression du compte de stockage tout en laissant ses données et sa configuration utilisables. Le contrôle de version des objets blob conserve l'état précédent d'un objet blob sous forme de version lisible chaque fois que l'objet est remplacé ou supprimé, automatiquement et sans aucune modification de l'application.
  options:
    a:
      en: "Container soft delete restores a deleted container; it doesn't keep the previous content of an overwritten blob and doesn't protect the account."
      fr: "La suppression réversible des conteneurs restaure un conteneur supprimé ; elle ne conserve pas le contenu précédent d'un objet blob remplacé et ne protège pas le compte."
    c:
      en: "Geo-redundancy replicates overwrites to the secondary region and disappears with the account; it protects against a regional outage only."
      fr: "La géoredondance réplique les remplacements dans la région secondaire et disparaît avec le compte ; elle ne protège que contre une panne régionale."
references:
  - title: Data protection overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-protection-overview
  - title: Blob versioning
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/versioning-overview
