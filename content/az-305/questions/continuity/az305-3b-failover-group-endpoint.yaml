id: az305-3b-failover-group-endpoint
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an application that uses 12 Azure SQL databases. The databases are hosted on the same logical server in the West Europe region.

    You need to recommend a solution that meets the following requirements:

    - After a regional outage, the 12 databases must fail over to the North Europe region as one unit.
    - The connection strings of the application must stay the same after a failover.
    - Administrative effort must be minimized.

    What should you include in the recommendation?
  fr: |
    Fabrikam dispose d'une application qui utilise 12 bases de données Azure SQL. Les bases de données sont hébergées sur le même serveur logique dans la région West Europe.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Après une panne régionale, les 12 bases de données doivent basculer ensemble vers la région North Europe.
    - Les chaînes de connexion de l'application doivent rester les mêmes après un basculement.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - id: a
      text: { en: "Zone redundancy for each database", fr: "La redondance de zone pour chaque base de données" }
    - id: b
      text: { en: "Active geo-replication for each database", fr: "La géoréplication active pour chaque base de données" }
    - id: c
      text: { en: "A failover group", fr: "Un groupe de basculement" }
    - id: d
      text: { en: "Geo-restore from geo-redundant backups", fr: "La géorestauration à partir de sauvegardes géoredondantes" }
answer: { optionId: c }
explanation:
  correct:
    en: A failover group replicates a set of databases of a logical server to a server in another region and fails them over together. It provides a read-write listener endpoint that always points to the current primary, so the application keeps the same connection string after a failover.
    fr: Un groupe de basculement réplique un ensemble de bases de données d'un serveur logique vers un serveur d'une autre région et les fait basculer ensemble. Il fournit un point de terminaison d'écouteur en lecture-écriture qui pointe toujours vers le serveur primaire actuel ; l'application conserve donc la même chaîne de connexion après un basculement.
  options:
    a:
      en: Zone redundancy protects against the failure of an availability zone inside West Europe, not against a regional outage.
      fr: La redondance de zone protège contre la panne d'une zone de disponibilité à l'intérieur de West Europe, pas contre une panne régionale.
    b:
      en: Active geo-replication is configured and failed over database by database, and the endpoint changes after a failover because the new primary is on another logical server.
      fr: La géoréplication active se configure et bascule base par base, et le point de terminaison change après un basculement, car la nouvelle base primaire se trouve sur un autre serveur logique.
    d:
      en: A geo-restore creates new databases on another server from backups. It takes longer, loses more data and changes the connection strings.
      fr: Une géorestauration crée de nouvelles bases de données sur un autre serveur à partir de sauvegardes. Elle prend plus de temps, fait perdre plus de données et change les chaînes de connexion.
references:
  - title: Failover groups overview & best practices (Azure SQL Database)
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
  - title: Active geo-replication
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
