id: az305-cs4a-database-backup
objective: "3.1.3"
type: multi
caseStudy: az305-cs4a-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a backup solution for the databases of PayCloud after they are migrated to Azure SQL Managed Instance. The solution must meet the backup requirements.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution de sauvegarde pour les bases de données de PayCloud une fois migrées vers Azure SQL Managed Instance. La solution doit respecter les exigences de sauvegarde.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: Create a failover group with a secondary instance in North Europe
        fr: Créer un groupe de basculement avec une instance secondaire dans North Europe
    - id: b
      text:
        en: Set the short-term retention of the automated backups to 30 days
        fr: Régler la rétention à court terme des sauvegardes automatisées sur 30 jours
    - id: c
      text:
        en: Protect the databases with Azure Backup in a Recovery Services vault
        fr: Protéger les bases de données avec Sauvegarde Azure dans un coffre Recovery Services
    - id: d
      text:
        en: Schedule copy-only backups to a storage account with a SQL Server Agent job
        fr: Planifier des sauvegardes en copie seule vers un compte de stockage avec un travail SQL Server Agent
    - id: e
      text:
        en: Configure a long-term retention policy that keeps a yearly backup for 10 years
        fr: Configurer une stratégie de rétention à long terme qui conserve une sauvegarde annuelle pendant 10 ans
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      SQL Managed Instance backs up every database automatically. The short-term retention of these backups, between 1 and 35 days, sets how far back a point-in-time restore can go: 30 days covers the first requirement. A long-term retention policy then copies selected full backups, here one per year, to separate storage and keeps them for up to 10 years. Both are settings of the service: there is no backup server and no script.
    fr: |
      SQL Managed Instance sauvegarde automatiquement chaque base de données. La rétention à court terme de ces sauvegardes, comprise entre 1 et 35 jours, fixe jusqu'où une restauration à un instant dans le passé peut remonter : 30 jours couvrent la première exigence. Une stratégie de rétention à long terme copie ensuite certaines sauvegardes complètes, ici une par an, vers un stockage distinct et les conserve pendant 10 ans au maximum. Ce sont deux réglages du service : il n'y a ni serveur de sauvegarde ni script.
  options:
    a:
      en: "A failover group replicates the databases to another region, errors included. It cannot bring a database back to an earlier point in time and keeps no yearly copy."
      fr: "Un groupe de basculement réplique les bases de données vers une autre région, erreurs comprises. Il ne permet pas de ramener une base de données à un instant antérieur et ne conserve aucune copie annuelle."
    c:
      en: "Azure Backup protects SQL Server that runs in Azure virtual machines. The backups of SQL Managed Instance are managed by the service itself."
      fr: "Sauvegarde Azure protège SQL Server exécuté dans des machines virtuelles Azure. Les sauvegardes de SQL Managed Instance sont gérées par le service lui-même."
    d:
      en: "Backups scheduled by a job are scripts that Relecloud would have to maintain, which the requirements exclude."
      fr: "Des sauvegardes planifiées par un travail sont des scripts que Relecloud devrait maintenir, ce que les exigences excluent."
references:
  - title: Long-term retention backups - Azure SQL Database and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/long-term-retention-overview
