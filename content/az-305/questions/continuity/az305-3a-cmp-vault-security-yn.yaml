id: az305-3a-cmp-vault-security-yn
objective: "3.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Contoso backs up Azure virtual machines to a Recovery Services vault named RSV1. Immutability is enabled on RSV1 but isn't locked. You are reviewing the options that protect the backups against ransomware.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso sauvegarde des machines virtuelles Azure dans un coffre Recovery Services nommé RSV1. L'immuabilité est activée sur RSV1 mais n'est pas verrouillée. Vous examinez les options qui protègent les sauvegardes contre les rançongiciels.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If Contoso locks the immutability of RSV1, a user who has the Owner role on RSV1 can later disable it.
        fr: Si Contoso verrouille l'immuabilité de RSV1, un utilisateur disposant du rôle Owner sur RSV1 peut la désactiver par la suite.
    - id: s2
      text:
        en: With immutability enabled, a backup administrator can increase the retention defined in a backup policy.
        fr: Avec l'immuabilité activée, un administrateur de sauvegarde peut augmenter la rétention définie dans une stratégie de sauvegarde.
    - id: s3
      text:
        en: The soft delete retention period of RSV1 can be set to 180 days.
        fr: La période de rétention de la suppression réversible de RSV1 peut être définie sur 180 jours.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Enabling immutability is reversible, but locking it is irreversible for every user, whatever the role. An immutable vault blocks only the operations that could lose recovery points, such as reducing retention or deleting backup data; increasing retention stays allowed. Soft delete keeps deleted backup data for 14 days by default, and the period can be extended up to 180 days.
    fr: |
      L'activation de l'immuabilité est réversible, mais son verrouillage est irréversible pour tous les utilisateurs, quel que soit leur rôle. Un coffre immuable ne bloque que les opérations qui feraient perdre des points de récupération, comme réduire la rétention ou supprimer des données de sauvegarde ; augmenter la rétention reste autorisé. La suppression réversible conserve les données de sauvegarde supprimées 14 jours par défaut, et cette période peut être portée à 180 jours.
references:
  - title: Immutable vault for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vault-concept
  - title: Secure by default with soft delete for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-security-feature-cloud
