id: az305-3a-db-sqlvm-fleet-backup
objective: "3.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware runs SQL Server on 60 Azure virtual machines in the East US region. Several instances belong to Always On availability groups.

    You need to recommend a backup design for the databases. The design must meet the following requirements:

    - The RPO must be 15 minutes.
    - All the instances must be monitored from one place, and the databases must be restorable from the Azure portal.
    - Backups must be retained for seven years.
    - Twice a year, sample databases must be restored in West US while East US is fully operational.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware exécute SQL Server sur 60 machines virtuelles Azure dans la région East US. Plusieurs instances appartiennent à des groupes de disponibilité Always On.

    Vous devez recommander une conception de sauvegarde pour les bases de données. La conception doit répondre aux exigences suivantes :

    - Le RPO doit être de 15 minutes.
    - Toutes les instances doivent être supervisées depuis un seul endroit, et les bases de données doivent pouvoir être restaurées depuis le portail Azure.
    - Les sauvegardes doivent être conservées sept ans.
    - Deux fois par an, des bases de données témoins doivent être restaurées dans West US alors qu'East US est pleinement opérationnelle.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Backup solution: [[sol]]

      Backup data location: [[store]]

      Storage redundancy: [[red]]
    fr: |
      Solution de sauvegarde : [[sol]]

      Emplacement des données de sauvegarde : [[store]]

      Redondance de stockage : [[red]]
  slots:
    - id: sol
      options:
        - { id: auto, text: { en: "Automated Backup of the SQL IaaS Agent extension", fr: "La Sauvegarde automatisée de l'extension SQL IaaS Agent" } }
        - { id: vm, text: { en: "Azure VM backup with an Enhanced policy", fr: "La sauvegarde de machines virtuelles Azure avec une stratégie améliorée" } }
        - { id: ab, text: { en: "Azure Backup for SQL Server in Azure VMs", fr: "Sauvegarde Azure pour SQL Server dans des machines virtuelles Azure" } }
    - id: store
      options:
        - { id: rsv, text: { en: "A Recovery Services vault", fr: "Un coffre Recovery Services" } }
        - { id: bv, text: { en: "A Backup vault", fr: "Un coffre de sauvegarde" } }
        - { id: sa, text: { en: "One storage account per virtual machine", fr: "Un compte de stockage par machine virtuelle" } }
    - id: red
      options:
        - { id: lrs, text: { en: "Locally redundant storage", fr: "Stockage localement redondant" } }
        - { id: zrs, text: { en: "Zone-redundant storage", fr: "Stockage redondant interzone" } }
        - { id: grs, text: { en: "Geo-redundant storage without Cross Region Restore", fr: "Stockage géoredondant sans la restauration interrégion" } }
        - { id: crr, text: { en: "Geo-redundant storage with Cross Region Restore", fr: "Stockage géoredondant avec la restauration interrégion" } }
answer:
  values: { sol: ab, store: rsv, red: crr }
explanation:
  correct:
    en: |
      Azure Backup for SQL Server in Azure VMs is the only option of the three that manages many servers from one dashboard, restores databases from the portal, keeps backups for years and has built-in support for Always On, with log backups every 15 minutes. Its workload extension streams the backups to a Recovery Services vault. Cross Region Restore, available on a geo-redundant vault for SQL Server databases in Azure VMs, restores in the paired region on demand.
    fr: |
      Sauvegarde Azure pour SQL Server dans des machines virtuelles Azure est la seule des trois options qui gère de nombreux serveurs depuis un tableau de bord unique, restaure les bases depuis le portail, conserve les sauvegardes des années et prend en charge Always On de façon intégrée, avec des sauvegardes du journal toutes les 15 minutes. Son extension de charge de travail envoie les sauvegardes vers un coffre Recovery Services. La restauration interrégion, disponible sur un coffre géoredondant pour les bases de données SQL Server dans des machines virtuelles Azure, restaure dans la région jumelée à la demande.
  options:
    auto: { en: "Automated Backup is configured per virtual machine, keeps backups for days only and has no built-in support for Always On.", fr: "La Sauvegarde automatisée se configure par machine virtuelle, ne conserve les sauvegardes que quelques jours et ne prend pas en charge Always On de façon intégrée." }
    vm: { en: "Azure VM backup runs every four hours at best and doesn't take transaction log backups.", fr: "La sauvegarde de machines virtuelles Azure s'exécute au mieux toutes les quatre heures et n'effectue pas de sauvegardes du journal des transactions." }
    bv: { en: "A Backup vault serves other workloads, such as managed disks, blobs and PostgreSQL.", fr: "Un coffre de sauvegarde sert à d'autres charges de travail, comme les disques managés, les objets blob et PostgreSQL." }
    grs: { en: "Without Cross Region Restore, the copy in West US can't be restored on demand for a drill.", fr: "Sans la restauration interrégion, la copie située dans West US ne peut pas être restaurée à la demande pour un exercice." }
references:
  - title: Backup and restore for SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/backup-restore
  - title: Create and configure a Recovery Services vault
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
