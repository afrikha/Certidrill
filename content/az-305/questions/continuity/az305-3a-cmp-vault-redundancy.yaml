id: az305-3a-cmp-vault-redundancy
objective: "3.1.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has the Recovery Services vaults shown in the following table. All the vaults are in the East US region, and no backup has been configured in them yet.

    You need to choose the vault that will protect the Azure virtual machines of two workloads. Costs must be minimized as long as the requirements of the workload are met.

    Answer each prompt by selecting the appropriate vault in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders possède les coffres Recovery Services présentés dans le tableau suivant. Tous les coffres se trouvent dans la région East US, et aucune sauvegarde n'y a encore été configurée.

    Vous devez choisir le coffre qui protégera les machines virtuelles Azure de deux charges de travail. Les coûts doivent être réduits au minimum tant que les exigences de la charge de travail sont respectées.

    Répondez à chaque consigne en sélectionnant le coffre approprié dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Payroll workload: the backup data must stay in East US and remain available if one availability zone of the region fails.", fr: "Charge de travail de paie : les données de sauvegarde doivent rester dans East US et demeurer disponibles si une zone de disponibilité de la région tombe en panne." }
    - id: p2
      text: { en: "Test workload: losing the backups in a datacenter failure is acceptable.", fr: "Charge de travail de test : la perte des sauvegardes lors de la panne d'un centre de données est acceptable." }
  grid:
    header: [{ en: "Vault", fr: "Coffre" }, { en: "Storage redundancy", fr: "Redondance de stockage" }, "Cross Region Restore"]
    rows:
      - [{ text: RSV1, area: v1 }, { text: { en: "Locally redundant (LRS)", fr: "Localement redondant (LRS)" } }, { text: { en: "Not available", fr: "Non disponible" } }]
      - [{ text: RSV2, area: v2 }, { text: { en: "Zone-redundant (ZRS)", fr: "Redondant interzone (ZRS)" } }, { text: { en: "Not available", fr: "Non disponible" } }]
      - [{ text: RSV3, area: v3 }, { text: { en: "Geo-redundant (GRS)", fr: "Géoredondant (GRS)" } }, { text: { en: "Disabled", fr: "Désactivée" } }]
      - [{ text: RSV4, area: v4 }, { text: { en: "Geo-redundant (GRS)", fr: "Géoredondant (GRS)" } }, { text: { en: "Enabled", fr: "Activée" } }]
answer:
  values: { p1: v2, p2: v1 }
explanation:
  correct:
    en: |
      Zone-redundant storage replicates the backup data across availability zones of the same region: it satisfies data residency and survives the loss of a zone. Locally redundant storage keeps the copies in a single datacenter and is the low-cost option when the loss of that datacenter is acceptable. Geo-redundant vaults copy the data to the paired region, which the payroll workload forbids and the test workload doesn't need.
    fr: |
      Le stockage redondant interzone réplique les données de sauvegarde entre des zones de disponibilité de la même région : il respecte la résidence des données et survit à la perte d'une zone. Le stockage localement redondant conserve les copies dans un seul centre de données et constitue l'option à faible coût lorsque la perte de ce centre de données est acceptable. Les coffres géoredondants copient les données dans la région jumelée, ce que la charge de travail de paie interdit et dont la charge de travail de test n'a pas besoin.
references:
  - title: What is the Azure Backup service?
    url: https://learn.microsoft.com/en-us/azure/backup/backup-overview
  - title: Create and configure a Recovery Services vault
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
