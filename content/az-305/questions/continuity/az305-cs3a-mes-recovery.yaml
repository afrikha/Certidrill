id: az305-cs3a-mes-recovery
objective: "3.1.1"
type: yesno_statements
caseStudy: az305-cs3a-vanarsdel
difficulty: 3
status: draft
stem:
  en: |
    You plan to protect the MES virtual machines by using Azure Site Recovery, with a Recovery Services vault in the Germany West Central region and the default replication policy.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de protéger les machines virtuelles du MES à l'aide d'Azure Site Recovery, avec un coffre Recovery Services dans la région Germany West Central et la stratégie de réplication par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "While the Munich datacenter operates normally, VanArsdel pays for one Azure virtual machine for each replicated MES virtual machine."
        fr: "Tant que le centre de données de Munich fonctionne normalement, VanArsdel paie une machine virtuelle Azure pour chaque machine virtuelle du MES répliquée."
    - id: s2
      text:
        en: "The recovery points that Site Recovery creates are frequent enough to meet the recovery point objective of the MES."
        fr: "Les points de récupération créés par Site Recovery sont assez fréquents pour satisfaire l'objectif de point de récupération du MES."
    - id: s3
      text:
        en: "The twice-yearly recovery test requires replication of the MES virtual machines to be paused for the duration of the test."
        fr: "Le test de récupération semestriel impose de suspendre la réplication des machines virtuelles du MES pendant la durée du test."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Site Recovery stores the replicated data on managed disks and creates the Azure virtual machines only when a failover runs, so no standby virtual machine is billed in normal operation. Replication of VMware virtual machines is continuous, and crash-consistent recovery points are created every five minutes, well inside the 15-minute objective. A test failover starts the machines in an isolated virtual network without affecting ongoing replication or the production machines."
    fr: "Site Recovery stocke les données répliquées sur des disques managés et ne crée les machines virtuelles Azure qu'au moment d'un basculement : aucune machine virtuelle de secours n'est donc facturée en fonctionnement normal. La réplication des machines virtuelles VMware est continue, et des points de récupération cohérents en cas d'incident sont créés toutes les cinq minutes, bien en deçà de l'objectif de 15 minutes. Un test de basculement démarre les machines dans un réseau virtuel isolé sans affecter la réplication en cours ni les machines de production."
  options:
    s1:
      en: "No: the Azure virtual machines are created from the replicated disks at failover. Before that, VanArsdel pays for Site Recovery and for the storage of the replicated data."
      fr: "Non : les machines virtuelles Azure sont créées à partir des disques répliqués lors du basculement. Avant cela, VanArsdel paie Site Recovery et le stockage des données répliquées."
    s3:
      en: "No: a disaster recovery drill runs as a test failover, which doesn't interrupt ongoing replication."
      fr: "Non : un exercice de reprise d'activité s'exécute sous la forme d'un test de basculement, qui n'interrompt pas la réplication en cours."
references:
  - title: VMware to Azure disaster recovery architecture - Modernized
    url: https://learn.microsoft.com/en-us/azure/site-recovery/vmware-azure-architecture-modernized
  - title: About Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-overview
