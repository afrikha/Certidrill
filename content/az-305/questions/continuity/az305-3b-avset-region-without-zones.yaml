id: az305-3b-avset-region-without-zones
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam must deploy an application tier of three virtual machines to an Azure region that doesn't support availability zones. A compliance policy requires all the resources of the application to stay in that region.

    You need to recommend a solution for the virtual machines. The solution must meet the following requirements:

    - The tier must remain available during the planned maintenance of the Azure hosts and if a single server rack fails.
    - Costs must be minimized.

    What should you include in the recommendation?
  fr: |
    Fabrikam doit déployer un niveau applicatif de trois machines virtuelles dans une région Azure qui ne prend pas en charge les zones de disponibilité. Une règle de conformité impose que toutes les ressources de l'application restent dans cette région.

    Vous devez recommander une solution pour les machines virtuelles. La solution doit répondre aux exigences suivantes :

    - Le niveau doit rester disponible pendant la maintenance planifiée des hôtes Azure et en cas de panne d'un seul rack de serveurs.
    - Les coûts doivent être réduits au minimum.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - id: a
      text: { en: "Azure Site Recovery replication to another region", fr: "Une réplication Azure Site Recovery vers une autre région" }
    - id: b
      text: { en: "An on-demand capacity reservation", fr: "Une réservation de capacité à la demande" }
    - id: c
      text: { en: "An availability set", fr: "Un groupe à haute disponibilité" }
    - id: d
      text: { en: "A Virtual Machine Scale Set that spans three availability zones", fr: "Un groupe de machines virtuelles identiques réparti sur trois zones de disponibilité" }
answer: { optionId: c }
explanation:
  correct:
    en: An availability set places the virtual machines in separate fault domains, which don't share a power source or a network switch, and in separate update domains, which aren't updated at the same time. It works in every region, including those without availability zones, and it is free. You pay only for the virtual machines.
    fr: "Un groupe à haute disponibilité place les machines virtuelles dans des domaines d'erreur distincts, qui ne partagent ni source d'alimentation ni commutateur réseau, et dans des domaines de mise à jour distincts, qui ne sont pas mis à jour en même temps. Il fonctionne dans toutes les régions, y compris celles sans zones de disponibilité, et il est gratuit : vous ne payez que les machines virtuelles."
  options:
    a:
      en: Site Recovery copies the virtual machines to another region, which the compliance policy forbids. It is also a disaster recovery solution with a failover, and it adds cost.
      fr: Site Recovery copie les machines virtuelles vers une autre région, ce que la règle de conformité interdit. C'est aussi une solution de reprise d'activité avec basculement, et elle ajoute un coût.
    b:
      en: A capacity reservation guarantees that a virtual machine size can be allocated. It doesn't spread the virtual machines across racks, and it isn't supported with availability sets.
      fr: Une réservation de capacité garantit qu'une taille de machine virtuelle peut être allouée. Elle ne répartit pas les machines virtuelles entre les racks, et elle n'est pas prise en charge avec les groupes à haute disponibilité.
    d:
      en: A zone-spanning scale set needs availability zones, which the region doesn't have.
      fr: Un groupe de machines virtuelles identiques réparti sur plusieurs zones a besoin de zones de disponibilité, que la région ne possède pas.
references:
  - title: Availability sets overview
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
  - title: On-demand capacity reservation
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/capacity-reservation-overview
