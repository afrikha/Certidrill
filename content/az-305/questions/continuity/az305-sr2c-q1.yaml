seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: |
    You recommend read-access geo-redundant storage (RA-GRS).
  fr: |
    Vous recommandez le stockage géoredondant avec accès en lecture (RA-GRS).
body:
  solution:
    en: |
      You recommend changing the redundancy of stcontoso1 to **read-access geo-redundant storage (RA-GRS)**. After an incident, administrators copy the blobs of the affected containers back from the **secondary endpoint** of the account.
    fr: |
      Vous recommandez de faire passer la redondance de stcontoso1 au **stockage géoredondant avec accès en lecture (RA-GRS)**. Après un incident, les administrateurs recopient les objets blob des conteneurs touchés depuis le **point de terminaison secondaire** du compte.
answer: { value: false }
explanation:
  correct:
    en: |
      Geo-redundant storage replicates every write to the secondary region asynchronously, and that includes the overwrites and the deletions made by the faulty release. The secondary endpoint therefore soon shows the same damaged state and keeps no earlier point in time. Redundancy protects against hardware and regional failures, not against operations that modify the data.
    fr: |
      Le stockage géoredondant réplique chaque écriture vers la région secondaire de façon asynchrone, y compris les écrasements et les suppressions effectués par la version défectueuse. Le point de terminaison secondaire présente donc rapidement le même état endommagé et ne conserve aucun instant antérieur. La redondance protège contre les pannes matérielles et régionales, pas contre les opérations qui modifient les données.
references:
  - title: "Azure Storage redundancy"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
