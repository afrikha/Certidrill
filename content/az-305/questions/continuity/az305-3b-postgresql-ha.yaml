id: az305-3b-postgresql-ha
objective: "3.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders plans to deploy an Azure Database for PostgreSQL flexible server for an order management application. The server will be created in a region that supports availability zones.

    You need to recommend a configuration for the server. The solution must meet the following requirements:

    - If an availability zone fails, the service must fail over automatically with no loss of committed data.
    - The server must be covered by a 99.99 % availability SLA.
    - Costs must be minimized.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders prévoit de déployer un serveur flexible Azure Database pour PostgreSQL pour une application de gestion des commandes. Le serveur sera créé dans une région qui prend en charge les zones de disponibilité.

    Vous devez recommander une configuration pour le serveur. La solution doit répondre aux exigences suivantes :

    - Si une zone de disponibilité tombe en panne, le service doit basculer automatiquement sans perte de données validées.
    - Le serveur doit être couvert par un SLA de disponibilité de 99,99 %.
    - Les coûts doivent être réduits au minimum.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Compute tier: [[tier]]

      High availability: [[ha]]
    fr: |
      Niveau de calcul : [[tier]]

      Haute disponibilité : [[ha]]
  slots:
    - id: tier
      options:
        - { id: burstable, text: Burstable }
        - { id: gp, text: General Purpose }
        - { id: mo, text: Memory Optimized }
    - id: ha
      options:
        - { id: samezone, text: { en: "Same-zone high availability", fr: "Haute disponibilité dans la même zone" } }
        - { id: zr, text: { en: "Zone-redundant high availability", fr: "Haute disponibilité redondante interzone" } }
        - { id: replica, text: { en: "No high availability, and a read replica in the same region", fr: "Pas de haute disponibilité, et un réplica en lecture dans la même région" } }
answer:
  values: { tier: gp, ha: zr }
explanation:
  correct:
    en: Zone-redundant high availability places a standby server in another availability zone and replicates to it synchronously. A zone failure triggers an automatic failover with no loss of committed data, and the configuration has a 99.99 % SLA. High availability isn't supported in the Burstable tier, so General Purpose is the cheapest tier that qualifies.
    fr: "La haute disponibilité redondante interzone place un serveur de secours dans une autre zone de disponibilité et le réplique de façon synchrone. La panne d'une zone déclenche un basculement automatique sans perte de données validées, et la configuration bénéficie d'un SLA de 99,99 %. La haute disponibilité n'est pas prise en charge dans le niveau Burstable : General Purpose est donc le niveau le moins cher qui convient."
  options:
    burstable:
      en: The Burstable tier supports neither zone-redundant nor same-zone high availability.
      fr: Le niveau Burstable ne prend en charge ni la haute disponibilité redondante interzone ni celle dans la même zone.
    mo:
      en: Memory Optimized supports high availability but costs more than General Purpose, and no requirement calls for it.
      fr: Memory Optimized prend en charge la haute disponibilité mais coûte plus cher que General Purpose, et aucune exigence ne le justifie.
    samezone:
      en: With same-zone high availability the standby is in the zone of the primary. Both are unavailable if that zone fails, and the SLA is 99.95 %.
      fr: Avec la haute disponibilité dans la même zone, le serveur de secours est dans la zone du serveur principal. Les deux sont indisponibles si cette zone tombe en panne, et le SLA est de 99,95 %.
    replica:
      en: A read replica is replicated asynchronously and is never promoted automatically. Without high availability the SLA is 99.9 %.
      fr: Un réplica en lecture est répliqué de façon asynchrone et n'est jamais promu automatiquement. Sans haute disponibilité, le SLA est de 99,9 %.
references:
  - title: Reliability in Azure Database for PostgreSQL
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-postgresql-flexible-server
