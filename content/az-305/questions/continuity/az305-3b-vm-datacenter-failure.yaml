id: az305-3b-vm-datacenter-failure
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to deploy a line-of-business application to two Azure virtual machines in the West Europe region. A load balancer will distribute the requests to both virtual machines.

    You need to recommend a deployment option for the virtual machines. The solution must meet the following requirements:

    - The application must remain available if a single datacenter in the region fails.
    - Costs must be minimized.

    What should you recommend?
  fr: |
    Contoso prévoit de déployer une application métier sur deux machines virtuelles Azure dans la région West Europe. Un équilibreur de charge répartira les requêtes entre les deux machines virtuelles.

    Vous devez recommander une option de déploiement pour les machines virtuelles. La solution doit répondre aux exigences suivantes :

    - L'application doit rester disponible si un seul centre de données de la région tombe en panne.
    - Les coûts doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Deploy both virtual machines to the same availability set.", fr: "Déployer les deux machines virtuelles dans le même groupe à haute disponibilité." }
    - id: b
      text: { en: "Deploy each virtual machine to a different availability zone.", fr: "Déployer chaque machine virtuelle dans une zone de disponibilité différente." }
    - id: c
      text: { en: "Deploy both virtual machines to the same proximity placement group.", fr: "Déployer les deux machines virtuelles dans le même groupe de placement de proximité." }
    - id: d
      text: { en: "Deploy both virtual machines to the same availability zone and use zone-redundant (ZRS) disks.", fr: "Déployer les deux machines virtuelles dans la même zone de disponibilité et utiliser des disques redondants interzones (ZRS)." }
answer: { optionId: b }
explanation:
  correct:
    en: Availability zones are physically separate locations of a region, each with its own power, cooling and network. Two virtual machines placed in two different zones don't share a datacenter, so the loss of one datacenter leaves one virtual machine running. Zonal virtual machines cost the same as nonzonal ones.
    fr: Les zones de disponibilité sont des emplacements physiquement séparés d'une région, chacun avec son alimentation, son refroidissement et son réseau. Deux machines virtuelles placées dans deux zones différentes ne partagent pas le même centre de données ; la perte d'un centre de données laisse donc une machine virtuelle en service. Les machines virtuelles zonales coûtent le même prix que les machines non zonales.
  options:
    a:
      en: An availability set spreads virtual machines across fault domains and update domains inside one datacenter. It protects against a rack failure, not against a datacenter failure.
      fr: Un groupe à haute disponibilité répartit les machines virtuelles entre des domaines d'erreur et des domaines de mise à jour dans un seul centre de données. Il protège contre la panne d'un rack, pas contre celle d'un centre de données.
    c:
      en: A proximity placement group places virtual machines close to each other to reduce latency. It adds no availability.
      fr: Un groupe de placement de proximité rapproche les machines virtuelles pour réduire la latence. Il n'ajoute aucune disponibilité.
    d:
      en: ZRS disks keep the data available in other zones, but both virtual machines stay pinned to one zone and stop if that zone fails.
      fr: Les disques ZRS gardent les données disponibles dans les autres zones, mais les deux machines virtuelles restent épinglées à une seule zone et s'arrêtent si cette zone tombe en panne.
references:
  - title: Availability options for Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability
  - title: Reliability in Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-virtual-machines
