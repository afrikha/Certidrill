id: az305-3a-db-sql-backups-yn
objective: "3.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an Azure SQL Database named DB1 in the General Purpose service tier on a logical server named sql-adatum. DB1 was created with the default backup settings.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum possède une base de données Azure SQL Database nommée DB1, au niveau de service Usage général (General Purpose), sur un serveur logique nommé sql-adatum. DB1 a été créée avec les paramètres de sauvegarde par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A point-in-time restore of DB1 replaces the current content of DB1.
        fr: Une restauration à un instant dans le passé de DB1 remplace le contenu actuel de DB1.
    - id: s2
      text:
        en: With the current settings, DB1 can be restored to any point in time within the last seven days.
        fr: Avec les paramètres actuels, DB1 peut être restaurée à n'importe quel instant des sept derniers jours.
    - id: s3
      text:
        en: If Adatum configures a long-term retention policy for DB1, the resulting backups can still be restored after sql-adatum is deleted.
        fr: Si Adatum configure une stratégie de conservation à long terme pour DB1, les sauvegardes obtenues peuvent encore être restaurées après la suppression de sql-adatum.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A point-in-time restore always creates a new database on the same server; it can't overwrite an existing database. The default retention of point-in-time restore backups is seven days, configurable from 1 to 35 days. Deleting a logical server deletes its point-in-time restore backups, but the long-term retention backups are kept and can be restored to another server of the same subscription.
    fr: |
      Une restauration à un instant dans le passé crée toujours une nouvelle base de données sur le même serveur ; elle ne peut pas remplacer une base existante. La rétention par défaut des sauvegardes de restauration à un instant dans le passé est de sept jours, réglable de 1 à 35 jours. La suppression d'un serveur logique supprime ses sauvegardes de restauration à un instant dans le passé, mais les sauvegardes de conservation à long terme sont gardées et peuvent être restaurées sur un autre serveur du même abonnement.
references:
  - title: Automated backups in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
  - title: Long-term retention backups - Azure SQL Database and Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/long-term-retention-overview
