id: az305-cs2c-invoice-backup
objective: "3.1.4"
type: single
caseStudy: az305-cs2c-tailwind-traders
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution to protect the invoices container. The solution must meet the backup requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution pour protéger le conteneur invoices. La solution doit respecter les exigences relatives à la sauvegarde.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Operational backup of the blobs, managed from a Backup vault", fr: "La sauvegarde opérationnelle des objets blob, gérée depuis un coffre de sauvegarde" } }
    - { id: b, text: { en: "Blob versioning, with blob soft delete extended to 90 days", fr: "Le contrôle de version des objets blob, avec la suppression réversible des objets blob portée à 90 jours" } }
    - { id: c, text: { en: "A customer-managed failover of sttailwinddocs to its secondary region", fr: "Un basculement géré par le client de sttailwinddocs vers sa région secondaire" } }
    - { id: d, text: { en: "Vaulted backup of the blobs to a Backup vault", fr: "La sauvegarde archivée (vaulted backup) des objets blob dans un coffre de sauvegarde" } }
answer: { optionId: d }
explanation:
  correct:
    en: A vaulted backup copies the blobs to the Backup vault according to the schedule and the retention of the backup policy. The recovery points are stored outside the storage account, so they protect against the deletion of the account, and the data can be restored to another storage account.
    fr: Une sauvegarde archivée copie les objets blob dans le coffre de sauvegarde selon la planification et la rétention de la stratégie de sauvegarde. Les points de récupération sont stockés en dehors du compte de stockage ; ils protègent donc contre la suppression du compte, et les données peuvent être restaurées dans un autre compte de stockage.
  options:
    a: { en: "Operational backup keeps the data inside the source storage account and restores to that account only.", fr: "La sauvegarde opérationnelle conserve les données dans le compte de stockage source et ne restaure que dans ce compte." }
    b: { en: "Versions and soft-deleted blobs are stored in sttailwinddocs and disappear with the account.", fr: "Les versions et les objets blob supprimés de façon réversible sont stockés dans sttailwinddocs et disparaissent avec le compte." }
    c: { en: "Geo-redundancy is not a backup: the secondary copy belongs to the same account and is deleted with it.", fr: "La géoredondance n'est pas une sauvegarde : la copie secondaire appartient au même compte et est supprimée avec lui." }
references:
  - title: Overview of Azure Blob backup
    url: https://learn.microsoft.com/en-us/azure/backup/blob-backup-overview
