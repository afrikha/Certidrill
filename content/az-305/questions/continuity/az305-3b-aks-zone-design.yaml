id: az305-3b-aks-zone-design
objective: "3.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum plans to deploy a payment API to a new Azure Kubernetes Service (AKS) cluster in a region that has three availability zones. Some pods are stateful and store their data on Azure disks.

    You need to recommend a design for the cluster. The solution must meet the following requirements:

    - The Kubernetes API server must be covered by a financially backed uptime SLA. Long-term support of Kubernetes versions isn't required.
    - The pods must keep running if an availability zone fails.
    - The data of the stateful pods must not be lost and must stay usable from the other zones if an availability zone fails.
    - Costs must be minimized.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de déployer une API de paiement sur un nouveau cluster Azure Kubernetes Service (AKS) dans une région qui possède trois zones de disponibilité. Certains pods sont avec état et stockent leurs données sur des disques Azure.

    Vous devez recommander une conception pour le cluster. La solution doit répondre aux exigences suivantes :

    - Le serveur d'API Kubernetes doit être couvert par un SLA de durée de fonctionnement financièrement garanti. Le support à long terme des versions de Kubernetes n'est pas nécessaire.
    - Les pods doivent continuer à s'exécuter si une zone de disponibilité tombe en panne.
    - Les données des pods avec état ne doivent pas être perdues et doivent rester utilisables depuis les autres zones si une zone de disponibilité tombe en panne.
    - Les coûts doivent être réduits au minimum.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Cluster management pricing tier: [[tier]]

      Node pools: [[nodes]]

      Disks of the stateful pods: [[disk]]
    fr: |
      Niveau tarifaire de gestion du cluster : [[tier]]

      Pools de nœuds : [[nodes]]

      Disques des pods avec état : [[disk]]
  slots:
    - id: tier
      options:
        - { id: free, text: Free }
        - { id: standard, text: Standard }
        - { id: premium, text: Premium }
    - id: nodes
      options:
        - { id: onezone, text: { en: "Deployed to a single availability zone", fr: "Déployés dans une seule zone de disponibilité" } }
        - { id: regional, text: { en: "Deployed without availability zones", fr: "Déployés sans zones de disponibilité" } }
        - { id: zones, text: { en: "Spread across three availability zones", fr: "Répartis sur trois zones de disponibilité" } }
    - id: disk
      options:
        - { id: plrs, text: { en: "Premium SSD, locally redundant storage (LRS)", fr: "Premium SSD, stockage localement redondant (LRS)" } }
        - { id: pzrs, text: { en: "Premium SSD, zone-redundant storage (ZRS)", fr: "Premium SSD, stockage redondant interzone (ZRS)" } }
        - { id: pv2, text: Premium SSD v2 }
        - { id: ultra, text: Ultra Disk }
answer:
  values: { tier: standard, nodes: zones, disk: pzrs }
explanation:
  correct:
    en: The Free tier has no financially backed SLA. Standard and Premium both include the uptime SLA of the API server, and Premium only adds long-term support, so Standard is the cheapest fit. The control plane is zone resilient by default, but node pools survive a zone failure only if they are spread across zones. A ZRS disk is replicated synchronously across three zones, so its data stays available to nodes of the other zones.
    fr: Le niveau Free n'a pas de SLA financièrement garanti. Standard et Premium incluent tous deux le SLA de durée de fonctionnement du serveur d'API, et Premium n'ajoute que le support à long terme ; Standard est donc le choix le moins cher. Le plan de contrôle est résilient aux zones par défaut, mais les pools de nœuds ne survivent à la panne d'une zone que s'ils sont répartis entre les zones. Un disque ZRS est répliqué de façon synchrone sur trois zones ; ses données restent donc disponibles pour les nœuds des autres zones.
  options:
    free:
      en: The Free tier offers best-effort uptime with no financially backed SLA.
      fr: Le niveau Free offre une disponibilité au mieux, sans SLA financièrement garanti.
    onezone:
      en: Nodes that are all in one availability zone stop together if that zone fails.
      fr: Des nœuds qui sont tous dans une seule zone de disponibilité s'arrêtent ensemble si cette zone tombe en panne.
    premium:
      en: Premium includes the same uptime SLA as Standard and adds long-term support, which isn't required.
      fr: Premium inclut le même SLA de durée de fonctionnement que Standard et ajoute le support à long terme, qui n'est pas nécessaire.
    regional:
      en: Nodes deployed without zones can all be placed in the zone that fails.
      fr: Des nœuds déployés sans zones peuvent tous se trouver dans la zone qui tombe en panne.
    plrs:
      en: An LRS disk keeps its three copies in one datacenter, so it can be unavailable during a zone failure.
      fr: Un disque LRS conserve ses trois copies dans un seul centre de données ; il peut donc être indisponible pendant la panne d'une zone.
    pv2:
      en: Premium SSD v2 doesn't support ZRS.
      fr: Premium SSD v2 ne prend pas en charge ZRS.
    ultra:
      en: Ultra Disk doesn't support ZRS.
      fr: Ultra Disk ne prend pas en charge ZRS.
references:
  - title: Reliability in Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-aks
  - title: Cluster management pricing tiers for Azure Kubernetes Service (AKS)
    url: https://learn.microsoft.com/en-us/azure/aks/free-standard-pricing-tiers
