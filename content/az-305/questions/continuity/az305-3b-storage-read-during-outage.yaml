id: az305-3b-storage-read-during-outage
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam stores product images as block blobs in a general-purpose v2 storage account in the East US 2 region. The account uses locally redundant storage (LRS). A web app serves the images to customers.

    You need to recommend a redundancy option for the account. The solution must meet the following requirements:

    - Reads and writes must continue if an availability zone of the primary region fails.
    - If the whole primary region becomes unavailable, the web app must be able to read the images immediately, without waiting for an account failover.
    - Costs must be minimized.

    What should you recommend?
  fr: |
    Fabrikam stocke des images de produits sous forme d'objets blob de blocs dans un compte de stockage à usage général v2 de la région East US 2. Le compte utilise le stockage localement redondant (LRS). Une application web sert les images aux clients.

    Vous devez recommander une option de redondance pour le compte. La solution doit répondre aux exigences suivantes :

    - Les lectures et les écritures doivent continuer si une zone de disponibilité de la région primaire tombe en panne.
    - Si toute la région primaire devient indisponible, l'application web doit pouvoir lire les images immédiatement, sans attendre un basculement du compte.
    - Les coûts doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" }
    - id: b
      text: { en: "Read-access geo-redundant storage (RA-GRS)", fr: "Stockage géoredondant avec accès en lecture (RA-GRS)" }
    - id: c
      text: { en: "Geo-zone-redundant storage (GZRS)", fr: "Stockage géoredondant interzone (GZRS)" }
    - id: d
      text: { en: "Read-access geo-zone-redundant storage (RA-GZRS)", fr: "Stockage géoredondant interzone avec accès en lecture (RA-GZRS)" }
answer: { optionId: d }
explanation:
  correct:
    en: RA-GZRS replicates the data synchronously across the zones of the primary region, which keeps reads and writes available during a zone failure, and asynchronously to a secondary region. The read-access variant exposes a secondary endpoint that can be read at any time, so the web app doesn't have to wait for a failover.
    fr: RA-GZRS réplique les données de façon synchrone entre les zones de la région primaire, ce qui maintient les lectures et les écritures pendant la panne d'une zone, et de façon asynchrone vers une région secondaire. La variante avec accès en lecture expose un point de terminaison secondaire lisible à tout moment ; l'application web n'a donc pas à attendre un basculement.
  options:
    a:
      en: ZRS survives a zone failure, but it keeps no copy outside the primary region.
      fr: ZRS survit à la panne d'une zone, mais ne conserve aucune copie hors de la région primaire.
    b:
      en: RA-GRS lets the app read the secondary region, but its primary region uses LRS, in a single datacenter, so a zone failure can interrupt reads and writes.
      fr: RA-GRS permet à l'application de lire la région secondaire, mais sa région primaire utilise LRS, dans un seul centre de données ; la panne d'une zone peut donc interrompre les lectures et les écritures.
    c:
      en: With GZRS, the data in the secondary region can't be read until an account failover is complete.
      fr: Avec GZRS, les données de la région secondaire ne sont lisibles qu'une fois le basculement du compte terminé.
references:
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
