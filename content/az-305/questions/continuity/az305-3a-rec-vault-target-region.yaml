id: az305-3a-rec-vault-target-region
objective: "3.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has 25 Azure virtual machines in the East US region. You plan to protect them with Azure Site Recovery by replicating them to the West US region.

    The design must meet the following requirements:

    - A failover must be possible while the East US region is completely unavailable.
    - Costs in West US must be minimized until a failover occurs.

    You need to complete the design.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso possède 25 machines virtuelles Azure dans la région East US. Vous prévoyez de les protéger avec Azure Site Recovery en les répliquant vers la région West US.

    La conception doit répondre aux exigences suivantes :

    - Un basculement doit être possible alors que la région East US est totalement indisponible.
    - Les coûts dans West US doivent être réduits au minimum tant qu'aucun basculement n'a lieu.

    Vous devez compléter la conception.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To manage the replication and the failover, create [[vault]].

      Until a failover is started, each protected virtual machine is represented in West US by [[target]].
    fr: |
      Pour gérer la réplication et le basculement, créez [[vault]].

      Tant qu'aucun basculement n'est lancé, chaque machine virtuelle protégée est représentée dans West US par [[target]].
  slots:
    - id: vault
      options:
        - { id: rsv-src, text: { en: "a Recovery Services vault in East US", fr: "un coffre Recovery Services dans East US" } }
        - { id: rsv-tgt, text: { en: "a Recovery Services vault in West US", fr: "un coffre Recovery Services dans West US" } }
        - { id: bv-src, text: { en: "a Backup vault in East US", fr: "un coffre de sauvegarde dans East US" } }
        - { id: bv-tgt, text: { en: "a Backup vault in West US", fr: "un coffre de sauvegarde dans West US" } }
    - id: target
      options:
        - { id: running, text: { en: "a running virtual machine of the same size", fr: "une machine virtuelle de même taille en cours d'exécution" } }
        - { id: stopped, text: { en: "a stopped (deallocated) virtual machine", fr: "une machine virtuelle arrêtée (libérée)" } }
        - { id: disks, text: { en: "replica managed disks", fr: "des disques managés réplicas" } }
        - { id: images, text: { en: "a daily backup of the virtual machine", fr: "une sauvegarde quotidienne de la machine virtuelle" } }
answer:
  values: { vault: rsv-tgt, target: disks }
explanation:
  correct:
    en: |
      Site Recovery is managed from a Recovery Services vault, which can be in any region except the source region, so that a failover can still be started when the source region is down. During replication, Site Recovery maintains only replica managed disks in the target region; the virtual machines are created from them when a failover or a test failover is run, and compute is billed only from then on.
    fr: |
      Site Recovery se gère depuis un coffre Recovery Services, qui peut se trouver dans n'importe quelle région sauf la région source, afin qu'un basculement puisse être lancé même lorsque la région source est en panne. Pendant la réplication, Site Recovery ne maintient que des disques managés réplicas dans la région cible ; les machines virtuelles sont créées à partir de ces disques lors d'un basculement ou d'un test de basculement, et le calcul n'est facturé qu'à partir de ce moment.
  options:
    rsv-src: { en: "A vault in the source region would be unreachable during the outage it must handle.", fr: "Un coffre situé dans la région source serait inaccessible pendant la panne qu'il doit gérer." }
    bv-tgt: { en: "A Backup vault is used by Azure Backup for workloads such as disks and blobs; Site Recovery uses a Recovery Services vault.", fr: "Un coffre de sauvegarde sert à Sauvegarde Azure pour des charges de travail telles que les disques et les objets blob ; Site Recovery utilise un coffre Recovery Services." }
    stopped: { en: "No virtual machine exists in the target region before a failover, not even a deallocated one.", fr: "Aucune machine virtuelle n'existe dans la région cible avant un basculement, pas même libérée." }
references:
  - title: "Tutorial: Set up disaster recovery for Azure VMs"
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-tutorial-enable-replication
  - title: Azure to Azure disaster recovery architecture
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-architecture
