id: az305-3a-uns-blob-backup-modes
objective: "3.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware stores design files as block blobs in a standard general-purpose v2 storage account named stproseware. You plan to protect the blobs with Azure Backup.

    The design must meet the following requirements:

    - After an accidental deletion or corruption, the block blobs must be restorable in stproseware to any point in time within the last 30 days.
    - Copies of the blobs must remain available if stproseware is deleted, and it must be possible to restore them to another storage account.

    You need to complete the design.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware stocke des fichiers de conception sous forme d'objets blob de blocs dans un compte de stockage standard à usage général v2 nommé stproseware. Vous prévoyez de protéger les objets blob avec Sauvegarde Azure.

    La conception doit répondre aux exigences suivantes :

    - Après une suppression ou une corruption accidentelle, les objets blob de blocs doivent pouvoir être restaurés dans stproseware à n'importe quel instant des 30 derniers jours.
    - Des copies des objets blob doivent rester disponibles si stproseware est supprimé, et il doit être possible de les restaurer dans un autre compte de stockage.

    Vous devez compléter la conception.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      For the restore to any point in time, use [[pit]].

      For the copies that survive the deletion of the account, use [[offsite]].

      Manage both from [[vault]].
    fr: |
      Pour la restauration à n'importe quel instant, utilisez [[pit]].

      Pour les copies qui survivent à la suppression du compte, utilisez [[offsite]].

      Gérez les deux depuis [[vault]].
  slots:
    - id: pit
      options:
        - { id: vaulted, text: { en: "vaulted backup", fr: "la sauvegarde archivée (vaulted backup)" } }
        - { id: operational, text: { en: "operational backup", fr: "la sauvegarde opérationnelle" } }
        - { id: replication, text: { en: "object replication", fr: "la réplication d'objets" } }
        - { id: snapshots, text: { en: "blob snapshots", fr: "des instantanés d'objets blob" } }
    - id: offsite
      options:
        - { id: vaulted, text: { en: "vaulted backup", fr: "la sauvegarde archivée (vaulted backup)" } }
        - { id: operational, text: { en: "operational backup", fr: "la sauvegarde opérationnelle" } }
        - { id: softdelete, text: { en: "container soft delete", fr: "la suppression réversible des conteneurs" } }
        - { id: snapshots, text: { en: "blob snapshots", fr: "des instantanés d'objets blob" } }
    - id: vault
      options:
        - { id: rsv, text: { en: "a Recovery Services vault", fr: "un coffre Recovery Services" } }
        - { id: bv, text: { en: "a Backup vault", fr: "un coffre de sauvegarde" } }
        - { id: rg, text: { en: "a Resource Guard", fr: "un Resource Guard" } }
answer:
  values: { pit: operational, offsite: vaulted, vault: bv }
explanation:
  correct:
    en: |
      Operational backup is a continuous, local protection: the data stays in the source account, and block blobs can be restored there to any point in time of the retention period. Vaulted backup copies the blobs on a schedule to the vault, an offsite copy that protects against the deletion of blobs or of the storage account and can be restored to another account. Both modes are configured in a backup policy of a Backup vault.
    fr: |
      La sauvegarde opérationnelle est une protection locale et continue : les données restent dans le compte source, et les objets blob de blocs peuvent y être restaurés à n'importe quel instant de la période de rétention. La sauvegarde archivée copie les objets blob dans le coffre selon une planification : cette copie hors site protège contre la suppression d'objets blob ou du compte de stockage et peut être restaurée dans un autre compte. Les deux modes se configurent dans une stratégie de sauvegarde d'un coffre de sauvegarde.
  options:
    replication: { en: "Object replication copies blobs asynchronously to another account; it doesn't restore the source account to a point in time.", fr: "La réplication d'objets copie des objets blob de façon asynchrone vers un autre compte ; elle ne restaure pas le compte source à un instant donné." }
    snapshots: { en: "Blob snapshots are stored in the same account and are lost with it.", fr: "Les instantanés d'objets blob sont stockés dans le même compte et sont perdus avec lui." }
    softdelete: { en: "Container soft delete works inside the account and disappears with it.", fr: "La suppression réversible des conteneurs fonctionne à l'intérieur du compte et disparaît avec lui." }
    rsv: { en: "A Recovery Services vault protects virtual machines, Azure Files and databases in virtual machines, not blobs.", fr: "Un coffre Recovery Services protège les machines virtuelles, Azure Files et les bases de données dans des machines virtuelles, pas les objets blob." }
references:
  - title: Overview of Azure Blob backup
    url: https://learn.microsoft.com/en-us/azure/backup/blob-backup-overview
