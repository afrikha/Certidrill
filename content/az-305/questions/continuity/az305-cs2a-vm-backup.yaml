id: az305-cs2a-vm-backup
objective: "3.1.2"
type: yesno_statements
caseStudy: az305-cs2a-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You evaluate three backup designs for the CareRecord virtual machines after their migration to Azure.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez trois conceptions de sauvegarde pour les machines virtuelles de CareRecord après leur migration vers Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Backing up the virtual machines to a Recovery Services vault with a Standard backup policy meets the backup requirements.
        fr: La sauvegarde des machines virtuelles dans un coffre Recovery Services avec une stratégie de sauvegarde standard respecte les exigences relatives à la sauvegarde.
    - id: s2
      text:
        en: Backing up the virtual machines to a Recovery Services vault with an Enhanced backup policy meets the backup requirements.
        fr: La sauvegarde des machines virtuelles dans un coffre Recovery Services avec une stratégie de sauvegarde améliorée respecte les exigences relatives à la sauvegarde.
    - id: s3
      text:
        en: Backing up the disks of the virtual machines every four hours with Azure Disk Backup in a Backup vault meets the backup requirements.
        fr: La sauvegarde des disques des machines virtuelles toutes les quatre heures avec la sauvegarde de disque Azure dans un coffre de sauvegarde respecte les exigences relatives à la sauvegarde.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Azure Backup protects Azure virtual machines in a Recovery Services vault, and a recovery point can restore the whole machine. The Standard policy takes one backup a day, so its RPO can reach 24 hours. The Enhanced policy schedules several backups a day, as often as every four hours, which gives the required RPO. Azure Disk Backup can run several times a day, but it protects individual managed disks and restores disks, not an entire virtual machine.
    fr: Sauvegarde Azure protège les machines virtuelles Azure dans un coffre Recovery Services, et un point de récupération permet de restaurer la machine entière. La stratégie standard effectue une sauvegarde par jour ; son RPO peut donc atteindre 24 heures. La stratégie améliorée planifie plusieurs sauvegardes par jour, jusqu'à une toutes les quatre heures, ce qui donne le RPO exigé. La sauvegarde de disque Azure peut s'exécuter plusieurs fois par jour, mais elle protège des disques managés individuels et restaure des disques, pas une machine virtuelle entière.
  options:
    s1: { en: "One backup a day does not give an RPO of four hours.", fr: "Une sauvegarde par jour ne donne pas un RPO de quatre heures." }
    s3: { en: "A disk recovery point restores a disk; the virtual machine itself is not part of the backup.", fr: "Un point de récupération de disque restaure un disque ; la machine virtuelle elle-même ne fait pas partie de la sauvegarde." }
references:
  - title: Back up an Azure VM by using the Enhanced policy
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy
