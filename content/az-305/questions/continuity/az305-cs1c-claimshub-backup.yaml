id: az305-cs1c-claimshub-backup
objective: "3.1.2"
type: dropdown
caseStudy: az305-cs1c-humongous-insurance
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend the configuration of the Recovery Services vault that will protect the ClaimsHub virtual machines. The solution must meet the backup requirements.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander la configuration du coffre Recovery Services qui protégera les machines virtuelles ClaimsHub. La solution doit répondre aux exigences de sauvegarde.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Storage redundancy of the vault: [[redundancy]]

      Protection of the recovery points: [[protection]]
    fr: |
      Redondance du stockage du coffre : [[redundancy]]

      Protection des points de récupération : [[protection]]
  slots:
    - id: redundancy
      options:
        - { id: grs, text: { en: "Geo-redundant", fr: "Géoredondant" } }
        - { id: lrs, text: { en: "Locally redundant", fr: "Localement redondant" } }
        - { id: zrs, text: { en: "Zone-redundant", fr: "Redondant interzone" } }
    - id: protection
      options:
        - { id: mua, text: { en: "Multi-user authorization with a Resource Guard", fr: "L'autorisation multi-utilisateur avec une protection des ressources (Resource Guard)" } }
        - { id: unlocked, text: { en: "Immutability that is enabled on the vault but not locked", fr: "L'immuabilité activée sur le coffre, mais non verrouillée" } }
        - { id: lock, text: { en: "A CanNotDelete resource lock on the vault", fr: "Un verrou de ressource CanNotDelete sur le coffre" } }
        - { id: locked, text: { en: "Immutability that is enabled on the vault and locked", fr: "L'immuabilité activée sur le coffre et verrouillée" } }
answer:
  values: { redundancy: grs, protection: locked }
explanation:
  correct:
    en: |
      Only a geo-redundant vault replicates the backup data to the paired region, UK West; with Cross Region Restore enabled, the virtual machines can be restored there while UK South is unavailable. An immutable vault blocks the operations that would lose recovery points, such as deleting backup data before its expiry or reducing the retention of a policy. Locking the immutability makes the setting irreversible, which is the last backup requirement.
    fr: |
      Seul un coffre géoredondant réplique les données de sauvegarde vers la région jumelée, UK West ; avec la restauration interrégion (Cross Region Restore) activée, les machines virtuelles peuvent y être restaurées pendant que UK South est indisponible. Un coffre immuable bloque les opérations qui feraient perdre des points de récupération, comme supprimer des données de sauvegarde avant leur expiration ou réduire la rétention d'une stratégie. Verrouiller l'immuabilité rend le paramètre irréversible, ce qui correspond à la dernière exigence de sauvegarde.
  options:
    lrs:
      en: A locally redundant vault keeps the backups in a single datacenter of UK South.
      fr: Un coffre localement redondant conserve les sauvegardes dans un seul centre de données de UK South.
    zrs:
      en: A zone-redundant vault keeps the backups in the availability zones of UK South; nothing can be restored from UK West.
      fr: Un coffre redondant interzone conserve les sauvegardes dans les zones de disponibilité de UK South ; rien ne peut être restauré depuis UK West.
    mua:
      en: Multi-user authorization makes critical operations depend on the approval of the owner of the Resource Guard; that owner can still authorize them, and the protection can be removed.
      fr: L'autorisation multi-utilisateur fait dépendre les opérations critiques de l'approbation du propriétaire de la protection des ressources ; ce propriétaire peut toujours les autoriser, et la protection peut être retirée.
    unlocked:
      en: "Until the immutability is locked, the setting is reversible: an administrator can disable it and then delete recovery points."
      fr: "Tant que l'immuabilité n'est pas verrouillée, le paramètre est réversible : un administrateur peut le désactiver puis supprimer des points de récupération."
    lock:
      en: A user who has the Owner role can remove a resource lock, and the lock doesn't prevent a reduction of the retention.
      fr: Un utilisateur qui a le rôle Owner peut retirer un verrou de ressource, et le verrou n'empêche pas de réduire la rétention.
references:
  - title: Immutable vault for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vault-concept
  - title: Create and configure a Recovery Services vault
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
