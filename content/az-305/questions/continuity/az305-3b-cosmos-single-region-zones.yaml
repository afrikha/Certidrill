id: az305-3b-cosmos-single-region-zones
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum plans to create an Azure Cosmos DB for NoSQL account with provisioned throughput for a patient portal. A regulation requires all the data to be stored only in the Norway East region, which supports availability zones.

    You need to recommend a solution that keeps the account available for reads and writes if a datacenter of the region fails. The application code must not be changed.

    What should you include in the recommendation?
  fr: |
    Adatum prévoit de créer un compte Azure Cosmos DB for NoSQL à débit provisionné pour un portail patient. Une réglementation impose que toutes les données soient stockées uniquement dans la région Norway East, qui prend en charge les zones de disponibilité.

    Vous devez recommander une solution qui maintient le compte disponible en lecture et en écriture si un centre de données de la région tombe en panne. Le code de l'application ne doit pas être modifié.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - id: a
      text: { en: "A second region added to the account as a read region", fr: "Une deuxième région ajoutée au compte comme région de lecture" }
    - id: b
      text: { en: "Zone redundancy enabled for the Norway East region of the account", fr: "La redondance de zone activée pour la région Norway East du compte" }
    - id: c
      text: { en: "Continuous backup with point-in-time restore", fr: "La sauvegarde continue avec restauration à un instant dans le passé" }
    - id: d
      text: { en: "Strong consistency as the default consistency level", fr: "La cohérence forte (strong) comme niveau de cohérence par défaut" }
answer: { optionId: b }
explanation:
  correct:
    en: Zone redundancy is enabled region by region. It spreads the replicas of the region across availability zones and replicates the writes synchronously between them. A single-region account then keeps read and write availability when one zone fails, with no data loss and no change to the application.
    fr: La redondance de zone s'active région par région. Elle répartit les réplicas de la région entre les zones de disponibilité et réplique les écritures de façon synchrone entre eux. Un compte à région unique conserve alors la disponibilité en lecture et en écriture quand une zone tombe en panne, sans perte de données et sans modification de l'application.
  options:
    a:
      en: A second region stores a copy of the data outside Norway East, which the regulation forbids.
      fr: Une deuxième région stocke une copie des données hors de Norway East, ce que la réglementation interdit.
    c:
      en: Continuous backup restores data after a deletion or a corruption. It doesn't keep the account available during a datacenter failure.
      fr: La sauvegarde continue restaure les données après une suppression ou une corruption. Elle ne maintient pas le compte disponible pendant la panne d'un centre de données.
    d:
      en: The consistency level defines what reads return. It doesn't place replicas in several datacenters.
      fr: Le niveau de cohérence définit ce que renvoient les lectures. Il ne place pas de réplicas dans plusieurs centres de données.
references:
  - title: Reliability in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-cosmos-db-nosql
