id: az305-3a-uns-files-snapshots-soft-delete
objective: "3.1.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys hosts the home folders of its employees in an Azure Files share that is mounted over SMB on Windows computers.

    You need to recommend the Azure Files features that meet the following requirements:

    - Users must restore an earlier version of a file themselves from the Previous Versions tab in File Explorer.
    - If the share is deleted by mistake, the administrators must be able to recover it, with its content and its snapshots, during the following 14 days.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys héberge les dossiers personnels de ses employés dans un partage Azure Files monté en SMB sur des ordinateurs Windows.

    Vous devez recommander les fonctionnalités d'Azure Files qui répondent aux exigences suivantes :

    - Les utilisateurs doivent restaurer eux-mêmes une version antérieure d'un fichier depuis l'onglet Versions précédentes de l'Explorateur de fichiers.
    - Si le partage est supprimé par erreur, les administrateurs doivent pouvoir le récupérer, avec son contenu et ses instantanés, pendant les 14 jours suivants.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Earlier versions of files: [[versions]]

      Recovery of a deleted share: [[share]]
    fr: |
      Versions antérieures des fichiers : [[versions]]

      Récupération d'un partage supprimé : [[share]]
  slots:
    - id: versions
      options:
        - { id: soft, text: { en: "Soft delete for file shares", fr: "La suppression réversible des partages de fichiers" } }
        - { id: snap, text: { en: "Share snapshots", fr: "Des instantanés de partage" } }
        - { id: tier, text: { en: "Azure File Sync cloud tiering", fr: "La hiérarchisation cloud d'Azure File Sync" } }
        - { id: zrs, text: { en: "Zone-redundant storage (ZRS)", fr: "Le stockage redondant interzone (ZRS)" } }
    - id: share
      options:
        - { id: soft, text: { en: "Soft delete for file shares", fr: "La suppression réversible des partages de fichiers" } }
        - { id: snap, text: { en: "Share snapshots", fr: "Des instantanés de partage" } }
        - { id: tier, text: { en: "Azure File Sync cloud tiering", fr: "La hiérarchisation cloud d'Azure File Sync" } }
        - { id: zrs, text: { en: "Zone-redundant storage (ZRS)", fr: "Le stockage redondant interzone (ZRS)" } }
answer:
  values: { versions: snap, share: soft }
explanation:
  correct:
    en: |
      A share snapshot is a read-only, point-in-time copy of the share; on a mounted SMB share, Windows shows the snapshots in the Previous Versions tab, where a user can open or restore a file. Snapshots are deleted with their share, so the deletion of the share itself is covered by soft delete for file shares, which keeps the share with its content and snapshots for a retention of 1 to 365 days.
    fr: |
      Un instantané de partage est une copie en lecture seule du partage à un instant donné ; sur un partage SMB monté, Windows présente les instantanés dans l'onglet Versions précédentes, où un utilisateur peut ouvrir ou restaurer un fichier. Les instantanés sont supprimés avec leur partage : la suppression du partage lui-même est donc couverte par la suppression réversible des partages de fichiers, qui conserve le partage avec son contenu et ses instantanés pendant une rétention de 1 à 365 jours.
  options:
    tier: { en: "Cloud tiering frees disk space on a Windows file server synchronized by Azure File Sync; it isn't a data protection feature.", fr: "La hiérarchisation cloud libère de l'espace disque sur un serveur de fichiers Windows synchronisé par Azure File Sync ; ce n'est pas une fonctionnalité de protection des données." }
    zrs: { en: "Zone-redundant storage protects against a datacenter failure; it keeps no earlier version and doesn't undo a deletion.", fr: "Le stockage redondant interzone protège contre la panne d'un centre de données ; il ne conserve aucune version antérieure et n'annule pas une suppression." }
references:
  - title: Use share snapshots with Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-snapshots-files
  - title: Azure file share soft delete
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-prevent-file-share-deletion
