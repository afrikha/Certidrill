id: az305-3b-avset-statements
objective: "3.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Proseware runs an application on two Azure virtual machines. Both virtual machines are in the same availability set, in a region that supports availability zones.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute une application sur deux machines virtuelles Azure. Les deux machines virtuelles sont dans le même groupe à haute disponibilité, dans une région qui prend en charge les zones de disponibilité.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The design protects the application against the failure of a single server rack.
        fr: La conception protège l'application contre la panne d'un seul rack de serveurs.
    - id: s2
      text:
        en: The design protects the application against the failure of the datacenter that hosts the virtual machines.
        fr: La conception protège l'application contre la panne du centre de données qui héberge les machines virtuelles.
    - id: s3
      text:
        en: The availability set adds a charge to the price of the two virtual machines.
        fr: Le groupe à haute disponibilité ajoute des frais au prix des deux machines virtuelles.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: An availability set places the virtual machines in different fault domains, which don't share a power source or a network switch, so a rack failure stops only one of them. The fault domains are in the same datacenter. A datacenter failure is covered by availability zones, not by an availability set. The availability set itself is free. Only the virtual machines are billed.
    fr: "Un groupe à haute disponibilité place les machines virtuelles dans des domaines d'erreur différents, qui ne partagent ni source d'alimentation ni commutateur réseau ; la panne d'un rack n'en arrête donc qu'une. Les domaines d'erreur sont dans le même centre de données : la panne d'un centre de données est couverte par les zones de disponibilité, pas par un groupe à haute disponibilité. Le groupe à haute disponibilité lui-même est gratuit ; seules les machines virtuelles sont facturées."
references:
  - title: Availability sets overview
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
  - title: Availability options for Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability
