stem:
  en: You recommend Azure Site Recovery from West Europe to North Europe.
  fr: Vous recommandez Azure Site Recovery de West Europe vers North Europe.
body:
  solution:
    en: |
      You recommend enabling **Azure Site Recovery** for the eight virtual machines and replicating them from West Europe to **North Europe**. A recovery plan fails over all the virtual machines.
    fr: |
      Vous recommandez d'activer **Azure Site Recovery** pour les huit machines virtuelles et de les répliquer de West Europe vers **North Europe**. Un plan de récupération bascule toutes les machines virtuelles.
answer: { value: true }
explanation:
  correct:
    en: |
      Site Recovery replicates the disks of Azure virtual machines continuously to the target region and creates crash-consistent recovery points every five minutes, so the latest recovery point is normally only a few minutes old, within the 15-minute objective. At failover, the virtual machines are created in North Europe from the replicated disks, and a recovery plan starts them together, so the application is back well within four hours.
    fr: |
      Site Recovery réplique en continu les disques des machines virtuelles Azure vers la région cible et crée des points de récupération cohérents en cas d'incident toutes les cinq minutes : le dernier point de récupération ne date normalement que de quelques minutes, dans la limite de l'objectif de 15 minutes. Au basculement, les machines virtuelles sont créées dans North Europe à partir des disques répliqués, et un plan de récupération les démarre ensemble : l'application est rétablie bien avant quatre heures.
references:
  - title: Azure to Azure disaster recovery architecture
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-architecture
  - title: About Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-overview
