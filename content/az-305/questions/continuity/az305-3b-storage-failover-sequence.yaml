id: az305-3b-storage-failover-sequence
objective: "3.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware has a general-purpose v2 storage account named **stlitware1** that uses geo-redundant storage (GRS). The primary region of the account is East US.

    An outage makes the primary endpoints of stlitware1 unavailable. The secondary region is available, and Microsoft hasn't started any failover.

    You need to restore write access to the account as soon as possible. Before the failover, you must identify the period of recent writes that might be lost. After the failover, the data must again be protected against a regional outage.

    Which three actions should you recommend performing in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware dispose d'un compte de stockage à usage général v2 nommé **stlitware1** qui utilise le stockage géoredondant (GRS). La région primaire du compte est East US.

    Une panne rend indisponibles les points de terminaison primaires de stlitware1. La région secondaire est disponible, et Microsoft n'a lancé aucun basculement.

    Vous devez rétablir au plus vite l'accès en écriture au compte. Avant le basculement, vous devez identifier la période des écritures récentes qui risquent d'être perdues. Après le basculement, les données doivent être de nouveau protégées contre une panne régionale.

    Quelles sont les trois actions à recommander, dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: lst, text: { en: "Check the Last Sync Time property of the account.", fr: "Vérifier la propriété Heure de la dernière synchronisation (Last Sync Time) du compte." } }
    - { id: unplanned, text: { en: "Initiate a customer-managed unplanned failover.", fr: "Lancer un basculement non planifié géré par le client." } }
    - { id: geo, text: { en: "Change the redundancy of the account from LRS to GRS.", fr: "Faire passer la redondance du compte de LRS à GRS." } }
    - { id: planned, text: { en: "Initiate a customer-managed planned failover.", fr: "Lancer un basculement planifié géré par le client." } }
    - { id: secondary, text: { en: "Reconfigure the applications to use the secondary endpoint of the account.", fr: "Reconfigurer les applications pour qu'elles utilisent le point de terminaison secondaire du compte." } }
    - { id: support, text: { en: "Ask Microsoft to perform a Microsoft-managed failover of the account.", fr: "Demander à Microsoft d'effectuer un basculement géré par Microsoft pour le compte." } }
answer:
  sequence: [ lst, unplanned, geo ]
explanation:
  correct:
    en: |
      The Last Sync Time is the most recent time at which the data was fully copied to the secondary region. Writes made after it might be lost, so it is checked before the failover. A customer-managed unplanned failover is the type to use when the primary endpoints are unavailable. It makes the secondary region the new primary and restores write access. After it, the account is LRS, so the redundancy must be changed back to GRS to protect the data against a regional outage again.
    fr: |
      L'heure de la dernière synchronisation est le moment le plus récent où les données ont été entièrement copiées vers la région secondaire. Les écritures postérieures risquent d'être perdues ; on la vérifie donc avant le basculement. Un basculement non planifié géré par le client est le type à utiliser quand les points de terminaison primaires sont indisponibles. Il fait de la région secondaire la nouvelle région primaire et rétablit l'accès en écriture. Le compte est ensuite en LRS ; il faut donc repasser la redondance en GRS pour protéger de nouveau les données contre une panne régionale.
  options:
    planned:
      en: A planned failover requires the primary and secondary endpoints to be available. It can't be used during the outage.
      fr: Un basculement planifié exige que les points de terminaison primaires et secondaires soient disponibles. Il ne peut pas être utilisé pendant la panne.
    secondary:
      en: A GRS account has no readable secondary endpoint, and a secondary endpoint never accepts writes. After a failover the usual URLs point to the new primary region.
      fr: Un compte GRS n'a pas de point de terminaison secondaire lisible, et un point de terminaison secondaire n'accepte jamais d'écritures. Après un basculement, les URL habituelles pointent vers la nouvelle région primaire.
    support:
      en: A Microsoft-managed failover is decided by Microsoft for a whole region in extreme cases. It can't be requested for one account.
      fr: Un basculement géré par Microsoft est décidé par Microsoft pour toute une région dans des cas extrêmes. Il ne peut pas être demandé pour un seul compte.
references:
  - title: Azure storage disaster recovery planning and failover
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-disaster-recovery-guidance
