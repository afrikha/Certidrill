id: az305-3a-uns-data-lake-backup
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has a general-purpose v2 storage account named dlslitware that has a hierarchical namespace enabled (Azure Data Lake Storage). The account stores the raw files of an analytics platform.

    You need to recommend a protection solution that meets the following requirements:

    - Files that are deleted or overwritten by mistake, and deleted containers, must be recoverable.
    - The backup copies must be stored outside dlslitware and retained for five years.
    - No custom script can be used.

    What should you recommend?
  fr: |
    Litware possède un compte de stockage à usage général v2 nommé dlslitware, sur lequel un espace de noms hiérarchique est activé (Azure Data Lake Storage). Le compte stocke les fichiers bruts d'une plateforme d'analytique.

    Vous devez recommander une solution de protection qui répond aux exigences suivantes :

    - Les fichiers supprimés ou remplacés par erreur, ainsi que les conteneurs supprimés, doivent pouvoir être récupérés.
    - Les copies de sauvegarde doivent être stockées en dehors de dlslitware et conservées cinq ans.
    - Aucun script personnalisé ne peut être utilisé.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Operational backup of blobs with a Backup vault", fr: "La sauvegarde opérationnelle des objets blob avec un coffre de sauvegarde" }
    - id: b
      text: { en: "Blob versioning and blob soft delete with a lifecycle management policy", fr: "Le contrôle de version et la suppression réversible des objets blob avec une stratégie de gestion du cycle de vie" }
    - id: c
      text: { en: "Vaulted backup of Azure Data Lake Storage with a Backup vault", fr: "La sauvegarde archivée d'Azure Data Lake Storage avec un coffre de sauvegarde" }
    - id: d
      text: { en: "Geo-redundant storage with a customer-managed failover", fr: "Le stockage géoredondant avec un basculement géré par le client" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Vaulted backup of Azure Data Lake Storage protects general-purpose v2 accounts that have a hierarchical namespace: scheduled backups of the selected containers are copied to a Backup vault, outside the source account, and can be retained up to 10 years. A restore goes to another storage account, by container or by prefix, and everything is managed by Azure Backup policies.
    fr: |
      La sauvegarde archivée d'Azure Data Lake Storage protège les comptes à usage général v2 dotés d'un espace de noms hiérarchique : des sauvegardes planifiées des conteneurs sélectionnés sont copiées dans un coffre de sauvegarde, en dehors du compte source, et peuvent être conservées jusqu'à 10 ans. Une restauration s'effectue dans un autre compte de stockage, par conteneur ou par préfixe, et l'ensemble est géré par des stratégies de Sauvegarde Azure.
  options:
    a:
      en: "Operational backup relies on point-in-time restore, which isn't supported with a hierarchical namespace, and it keeps the data in the source account."
      fr: "La sauvegarde opérationnelle s'appuie sur la restauration à un instant dans le passé, qui n'est pas prise en charge avec un espace de noms hiérarchique, et elle conserve les données dans le compte source."
    b:
      en: "Blob versioning isn't supported on accounts that have a hierarchical namespace, and these features keep everything inside the account."
      fr: "Le contrôle de version des objets blob n'est pas pris en charge sur les comptes dotés d'un espace de noms hiérarchique, et ces fonctionnalités conservent tout à l'intérieur du compte."
    d:
      en: "Geo-redundant storage replicates deletions and overwrites to the secondary region; it isn't a backup and keeps no history."
      fr: "Le stockage géoredondant réplique les suppressions et les remplacements dans la région secondaire ; ce n'est pas une sauvegarde et il ne conserve aucun historique."
references:
  - title: About Azure Data Lake Storage vaulted backup
    url: https://learn.microsoft.com/en-us/azure/backup/azure-data-lake-storage-backup-overview
  - title: Data protection overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-protection-overview
