id: az305-3b-capacity-reservation
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a disaster recovery plan for an application. If the primary region fails, 40 virtual machines of the Standard_E8s_v5 size must be created in the North Europe region. During the last test, the creation failed because North Europe couldn't allocate that size at the time.

    You need to recommend a solution that meets the following requirements:

    - Azure must guarantee that the 40 virtual machines can be allocated in North Europe at any time.
    - Woodgrove Bank must not commit to a term and must be able to cancel the solution at any time.

    What should you include in the recommendation?
  fr: |
    Woodgrove Bank dispose d'un plan de reprise d'activité pour une application. Si la région primaire tombe en panne, 40 machines virtuelles de taille Standard_E8s_v5 doivent être créées dans la région North Europe. Lors du dernier test, la création a échoué parce que North Europe ne pouvait pas allouer cette taille à ce moment-là.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Azure doit garantir que les 40 machines virtuelles peuvent être allouées dans North Europe à tout moment.
    - Woodgrove Bank ne doit s'engager sur aucune durée et doit pouvoir résilier la solution à tout moment.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - id: a
      text: { en: "A one-year Azure Reserved Virtual Machine Instances purchase", fr: "Un achat d'instances de machines virtuelles réservées Azure sur un an" }
    - id: b
      text: { en: "A vCPU quota increase for the Esv5 family", fr: "Une augmentation du quota de processeurs virtuels de la famille Esv5" }
    - id: c
      text: { en: "An on-demand capacity reservation", fr: "Une réservation de capacité à la demande" }
    - id: d
      text: { en: "An Azure savings plan for compute", fr: "Un plan d'économies Azure pour le calcul" }
answer: { optionId: c }
explanation:
  correct:
    en: An on-demand capacity reservation reserves compute capacity for a virtual machine size in a region or an availability zone, with an SLA. It has no term, so it can be created and deleted at any time. It is billed at the pay-as-you-go rate of the size, whether it is used or not.
    fr: "Une réservation de capacité à la demande réserve de la capacité de calcul pour une taille de machine virtuelle dans une région ou une zone de disponibilité, avec un SLA. Elle n'a pas de durée d'engagement : elle peut être créée et supprimée à tout moment. Elle est facturée au tarif du paiement à l'utilisation de la taille, qu'elle soit utilisée ou non."
  options:
    a:
      en: Reserved Instances are a billing discount with a one-year or three-year term. They don't guarantee capacity.
      fr: Les instances réservées sont une remise de facturation avec un engagement d'un an ou de trois ans. Elles ne garantissent pas la capacité.
    b:
      en: A quota is the permission of the subscription to deploy cores. It doesn't guarantee that the region has the infrastructure available.
      fr: Un quota est l'autorisation donnée à l'abonnement de déployer des cœurs. Il ne garantit pas que la région dispose de l'infrastructure nécessaire.
    d:
      en: A savings plan is an hourly spending commitment over one or three years in exchange for lower prices. It reserves no capacity.
      fr: Un plan d'économies est un engagement de dépense horaire sur un an ou trois ans en échange de prix réduits. Il ne réserve aucune capacité.
references:
  - title: On-demand capacity reservation
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/capacity-reservation-overview
