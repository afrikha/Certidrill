id: az305-3a-uns-file-sync-backup
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has three on-premises Windows file servers. Azure File Sync synchronizes the servers with an Azure file share, and cloud tiering is enabled on every server endpoint to free local disk space.

    You need to recommend a backup solution for the files. The backup must contain the complete dataset, and the on-premises infrastructure must be minimized.

    What should you recommend?
  fr: |
    Northwind Traders possède trois serveurs de fichiers Windows locaux. Azure File Sync synchronise les serveurs avec un partage de fichiers Azure, et la hiérarchisation cloud est activée sur chaque point de terminaison de serveur pour libérer de l'espace disque local.

    Vous devez recommander une solution de sauvegarde pour les fichiers. La sauvegarde doit contenir le jeu de données complet, et l'infrastructure locale doit être réduite au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Install the MARS agent on one file server and back up its volumes.", fr: "Installer l'agent MARS sur un serveur de fichiers et sauvegarder ses volumes." }
    - id: b
      text: { en: "Deploy Microsoft Azure Backup Server (MABS) on-premises and protect the three file servers.", fr: "Déployer Microsoft Azure Backup Server (MABS) en local et protéger les trois serveurs de fichiers." }
    - id: c
      text: { en: "Back up the Azure file share by using Azure Backup.", fr: "Sauvegarder le partage de fichiers Azure avec Sauvegarde Azure." }
    - id: d
      text: { en: "Add a fourth server endpoint with cloud tiering enabled to hold a copy of the files.", fr: "Ajouter un quatrième point de terminaison de serveur avec la hiérarchisation cloud activée pour conserver une copie des fichiers." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With Azure File Sync, the Azure file share (the cloud endpoint) holds a full copy of the data, whereas a server with cloud tiering may hold only a subset. Microsoft therefore recommends backing up the Azure file share with Azure Backup, which handles the schedule, the retention and the restores without any on-premises component.
    fr: |
      Avec Azure File Sync, le partage de fichiers Azure (le point de terminaison cloud) contient une copie complète des données, alors qu'un serveur doté de la hiérarchisation cloud peut n'en contenir qu'une partie. Microsoft recommande donc de sauvegarder le partage de fichiers Azure avec Sauvegarde Azure, qui gère la planification, la rétention et les restaurations sans aucun composant local.
  options:
    a:
      en: "An on-premises backup of a server with cloud tiering is discouraged: tiered files are skipped, saved as stubs or recalled from Azure, which causes egress charges."
      fr: "Une sauvegarde locale d'un serveur doté de la hiérarchisation cloud est déconseillée : les fichiers hiérarchisés sont ignorés, enregistrés sous forme de pointeurs ou rappelés depuis Azure, ce qui entraîne des frais de sortie."
    b:
      en: "MABS adds an on-premises server and meets the same problem with tiered files."
      fr: "MABS ajoute un serveur local et se heurte au même problème avec les fichiers hiérarchisés."
    d:
      en: "Another server endpoint is a synchronized replica: a deletion or a corruption is synchronized to it, and with cloud tiering it doesn't hold every file."
      fr: "Un autre point de terminaison de serveur est un réplica synchronisé : une suppression ou une corruption y est synchronisée, et avec la hiérarchisation cloud il ne contient pas tous les fichiers."
references:
  - title: Disaster recovery best practices with Azure File Sync
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-disaster-recovery-best-practices
