id: az305-cs2c-orders-recovery
objective: "3.1.3"
type: yesno_statements
caseStudy: az305-cs2c-tailwind-traders
difficulty: 2
status: draft
stem:
  en: |
    You evaluate three changes to db-orders against the backup requirement that concerns a regional outage of East US 2.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez trois modifications de db-orders au regard de l'exigence de sauvegarde qui concerne une panne régionale de East US 2.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Changing the backup storage redundancy of db-orders to geo-redundant meets the requirement.
        fr: Le passage du stockage de sauvegarde de db-orders à l'option géoredondante respecte l'exigence.
    - id: s2
      text:
        en: Changing the backup storage redundancy of db-orders to zone-redundant meets the requirement.
        fr: Le passage du stockage de sauvegarde de db-orders à l'option redondante interzone respecte l'exigence.
    - id: s3
      text:
        en: Adding db-orders to a failover group with a server in Central US meets the requirement.
        fr: L'ajout de db-orders à un groupe de basculement avec un serveur dans Central US respecte l'exigence.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Geo-restore creates a database in another region from the automated backups, without any secondary database, but it is available only when the backup storage is geo-redundant, because the backups are then replicated to the paired region. Zone-redundant backup storage keeps the backups in the zones of East US 2, so they are lost with the region and geo-restore stays unavailable. A failover group also covers a regional outage, but through a secondary database in Central US that is billed permanently.
    fr: La géorestauration crée une base de données dans une autre région à partir des sauvegardes automatiques, sans aucune base de données secondaire, mais elle n'est disponible que si le stockage de sauvegarde est géoredondant, car les sauvegardes sont alors répliquées vers la région jumelée. Un stockage de sauvegarde redondant interzone conserve les sauvegardes dans les zones de East US 2 ; elles sont donc perdues avec la région, et la géorestauration reste indisponible. Un groupe de basculement couvre lui aussi une panne régionale, mais au moyen d'une base de données secondaire dans Central US, facturée en permanence.
  options:
    s2: { en: "Zone-redundant backups never leave East US 2, and geo-restore is disabled with locally redundant or zone-redundant backup storage.", fr: "Les sauvegardes redondantes interzone ne quittent jamais East US 2, et la géorestauration est désactivée avec un stockage de sauvegarde localement redondant ou redondant interzone." }
    s3: { en: "A failover group needs a secondary database, which Tailwind Traders does not want to pay for.", fr: "Un groupe de basculement exige une base de données secondaire, que Tailwind Traders ne veut pas payer." }
references:
  - title: Automated backups in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
