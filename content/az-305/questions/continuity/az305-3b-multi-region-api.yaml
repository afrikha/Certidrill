id: az305-3b-multi-region-api
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys hosts a public, stateless HTTPS API on a Virtual Machine Scale Set that spans three availability zones in the East US region.

    You need to recommend changes that meet the following requirements:

    - The API must remain available if the East US region fails.
    - Clients must keep using the same URL.
    - The failover to another region must not depend on the expiration of DNS records cached by the clients.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys héberge une API HTTPS publique et sans état sur un groupe de machines virtuelles identiques réparti sur trois zones de disponibilité dans la région East US.

    Vous devez recommander des modifications qui répondent aux exigences suivantes :

    - L'API doit rester disponible si la région East US tombe en panne.
    - Les clients doivent continuer à utiliser la même URL.
    - Le basculement vers une autre région ne doit pas dépendre de l'expiration des enregistrements DNS mis en cache par les clients.

    Quelles sont les deux actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Deploy a second Virtual Machine Scale Set to the West US region.", fr: "Déployer un second groupe de machines virtuelles identiques dans la région West US." }
    - id: b
      text: { en: "Create a Traffic Manager profile that uses priority routing between the two regions.", fr: "Créer un profil Traffic Manager qui utilise le routage par priorité entre les deux régions." }
    - id: c
      text: { en: "Create an Azure Front Door profile that uses the two regions as origins.", fr: "Créer un profil Azure Front Door qui utilise les deux régions comme origines." }
    - id: d
      text: { en: "Deploy an Application Gateway to East US that has the scale sets of both regions in its backend pool.", fr: "Déployer dans East US une passerelle Application Gateway dont le pool principal contient les groupes de machines virtuelles identiques des deux régions." }
    - id: e
      text: { en: "Increase the instance count of the existing scale set, and enable strict zone balancing.", fr: "Augmenter le nombre d'instances du groupe de machines virtuelles identiques existant, et activer l'équilibrage de zone strict." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: A scale set is a regional resource, so a regional outage stops all its instances. A second deployment in another region is required. Azure Front Door is a global layer-7 entry point for HTTPS. It probes the origins and sends requests to the healthy region behind one URL, with a fast failover that doesn't rely on DNS caches.
    fr: "Un groupe de machines virtuelles identiques est une ressource régionale ; une panne régionale arrête donc toutes ses instances : un second déploiement dans une autre région est nécessaire. Azure Front Door est un point d'entrée mondial de couche 7 pour HTTPS. Il sonde les origines et envoie les requêtes vers la région saine derrière une seule URL, avec un basculement rapide qui ne repose pas sur les caches DNS."
  options:
    b:
      en: Traffic Manager redirects clients through DNS. Its failover is delayed by DNS caching and by systems that ignore the TTL of the records.
      fr: Traffic Manager redirige les clients par DNS. Son basculement est retardé par la mise en cache DNS et par les systèmes qui ignorent la durée de vie (TTL) des enregistrements.
    d:
      en: Application Gateway is a regional service. Placed in East US, it is a single point of failure that disappears with the region.
      fr: Application Gateway est un service régional. Placée dans East US, la passerelle est un point de défaillance unique qui disparaît avec la région.
    e:
      en: More instances and a strict zone balance improve resilience to a zone failure only. All the instances remain in East US.
      fr: Davantage d'instances et un équilibrage de zone strict n'améliorent que la résilience à la panne d'une zone. Toutes les instances restent dans East US.
references:
  - title: Load balancing options
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/load-balancing-overview
  - title: Reliability in Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-virtual-machines
