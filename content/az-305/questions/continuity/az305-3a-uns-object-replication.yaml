id: az305-3a-uns-object-replication
objective: "3.1.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys stores media files as block blobs in a standard general-purpose v2 storage account in the West Europe region. The account doesn't have a hierarchical namespace.

    You need to recommend a solution that meets the following requirements:

    - A second copy of the blobs must be maintained in the Sweden Central region, which isn't the paired region of West Europe.
    - The copy must be stored in a storage account of another subscription.
    - Reporting applications must be able to read the copy at any time.
    - No custom code or scheduled copy job can be used.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys stocke des fichiers multimédias sous forme d'objets blob de blocs dans un compte de stockage standard à usage général v2 de la région West Europe. Le compte ne possède pas d'espace de noms hiérarchique.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Une seconde copie des objets blob doit être maintenue dans la région Sweden Central, qui n'est pas la région jumelée de West Europe.
    - La copie doit être stockée dans un compte de stockage d'un autre abonnement.
    - Des applications de reporting doivent pouvoir lire la copie à tout moment.
    - Aucun code personnalisé ni travail de copie planifié ne peut être utilisé.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Solution: [[sol]]

      Features to enable first: [[pre]]
    fr: |
      Solution : [[sol]]

      Fonctionnalités à activer au préalable : [[pre]]
  slots:
    - id: sol
      options:
        - { id: ragzrs, text: { en: "Read-access geo-zone-redundant storage (RA-GZRS)", fr: "Stockage géoredondant interzone avec accès en lecture (RA-GZRS)" } }
        - { id: grs, text: { en: "Geo-redundant storage (GRS) with a customer-managed planned failover", fr: "Stockage géoredondant (GRS) avec un basculement planifié géré par le client" } }
        - { id: vaulted, text: { en: "Vaulted backup of the blobs to a Backup vault in Sweden Central", fr: "Sauvegarde archivée des objets blob dans un coffre de sauvegarde de Sweden Central" } }
        - { id: objrep, text: { en: "Object replication to a storage account in Sweden Central", fr: "Réplication d'objets vers un compte de stockage de Sweden Central" } }
    - id: pre
      options:
        - { id: hns, text: { en: "A hierarchical namespace on both accounts", fr: "Un espace de noms hiérarchique sur les deux comptes" } }
        - { id: vercf, text: { en: "Blob versioning on both accounts and the change feed on the source account", fr: "Le contrôle de version des objets blob sur les deux comptes et le flux de modification sur le compte source" } }
        - { id: pitr, text: { en: "Point-in-time restore on the destination account", fr: "La restauration à un instant dans le passé sur le compte de destination" } }
        - { id: softdel, text: { en: "Blob soft delete on the source account and container soft delete on the destination account", fr: "La suppression réversible des objets blob sur le compte source et celle des conteneurs sur le compte de destination" } }
answer:
  values: { sol: objrep, pre: vercf }
explanation:
  correct:
    en: |
      Object replication asynchronously copies block blobs from a source account to a destination account that can be in any region and in another subscription; the destination blobs stay readable. It requires blob versioning on both accounts and the change feed on the source account. Geo-redundant options replicate only to the paired region fixed by Azure, inside the same account.
    fr: |
      La réplication d'objets copie de façon asynchrone des objets blob de blocs d'un compte source vers un compte de destination qui peut se trouver dans n'importe quelle région et dans un autre abonnement ; les objets blob de destination restent lisibles. Elle exige le contrôle de version des objets blob sur les deux comptes et le flux de modification sur le compte source. Les options géoredondantes ne répliquent que vers la région jumelée fixée par Azure, à l'intérieur du même compte.
  options:
    ragzrs: { en: "RA-GZRS gives a readable secondary, but only in the paired region and in the same storage account.", fr: "RA-GZRS fournit un secondaire lisible, mais uniquement dans la région jumelée et dans le même compte de stockage." }
    grs: { en: "With GRS the secondary region is the paired region, and it can't be read without a failover.", fr: "Avec GRS, la région secondaire est la région jumelée, et elle ne peut pas être lue sans basculement." }
    vaulted: { en: "A vaulted backup is stored in a Backup vault and must be restored before it can be read by applications.", fr: "Une sauvegarde archivée est stockée dans un coffre de sauvegarde et doit être restaurée avant de pouvoir être lue par des applications." }
    hns: { en: "A hierarchical namespace isn't a prerequisite of object replication, and the source account doesn't have one.", fr: "Un espace de noms hiérarchique n'est pas un prérequis de la réplication d'objets, et le compte source n'en possède pas." }
references:
  - title: Object replication for block blobs
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
