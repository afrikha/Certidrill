id: az305-3b-storage-redundancy-match
objective: "3.2.3"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Litware plans three storage accounts in a region that supports availability zones and has a paired region.

    You need to recommend a redundancy option for each account. Each solution must minimize costs.

    Which redundancy option should you recommend for each account? To answer, drag the appropriate redundancy options to the correct accounts. Each redundancy option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit trois comptes de stockage dans une région qui prend en charge les zones de disponibilité et possède une région jumelée.

    Vous devez recommander une option de redondance pour chaque compte. Chaque solution doit réduire les coûts au minimum.

    Quelle option de redondance devez-vous recommander pour chaque compte ? Pour répondre, faites glisser les options de redondance appropriées vers les comptes correspondants. Chaque option de redondance peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lrs, text: LRS }
    - { id: zrs, text: ZRS }
    - { id: grs, text: GRS }
    - { id: ragrs, text: RA-GRS }
    - { id: gzrs, text: GZRS }
  targets:
    - id: premium
      text:
        en: A premium block blob account that must remain available if an availability zone fails
        fr: Un compte d'objets blob de blocs Premium qui doit rester disponible si une zone de disponibilité tombe en panne
    - id: archive
      text:
        en: A general-purpose v2 account whose blobs are moved to the archive tier by a lifecycle policy and must survive a regional outage. Reading the secondary region before a failover isn't required.
        fr: Un compte à usage général v2 dont les blobs sont déplacés vers le niveau archive (Archive) par une stratégie de cycle de vie et doivent survivre à une panne régionale. La lecture de la région secondaire avant un basculement n'est pas exigée.
    - id: files
      text:
        en: A general-purpose v2 account that contains only HDD Azure file shares, which must survive both a zone failure and a regional outage
        fr: Un compte à usage général v2 qui ne contient que des partages de fichiers Azure HDD, lesquels doivent survivre à la fois à la panne d'une zone et à une panne régionale
answer:
  mapping: { premium: zrs, archive: grs, files: gzrs }
explanation:
  correct:
    en: Premium block blob accounts support LRS and ZRS only, and ZRS is the one that survives a zone failure. The archive tier is supported with LRS, GRS and RA-GRS, but not with ZRS, GZRS or RA-GZRS. GRS protects against a regional outage and costs less than RA-GRS, whose read access isn't needed. HDD file shares support LRS, ZRS, GRS and GZRS, and GZRS is the only option that covers both a zone failure and a regional outage.
    fr: "Les comptes d'objets blob de blocs Premium ne prennent en charge que LRS et ZRS, et seul ZRS survit à la panne d'une zone. Le niveau archive (Archive) est pris en charge avec LRS, GRS et RA-GRS, mais pas avec ZRS, GZRS ni RA-GZRS : GRS protège contre une panne régionale et coûte moins cher que RA-GRS, dont l'accès en lecture n'est pas nécessaire. Les partages de fichiers HDD prennent en charge LRS, ZRS, GRS et GZRS, et GZRS est la seule option qui couvre à la fois la panne d'une zone et une panne régionale."
  options:
    lrs:
      en: LRS keeps all the copies in one datacenter. It survives neither a zone failure nor a regional outage.
      fr: LRS conserve toutes les copies dans un seul centre de données. Il ne survit ni à la panne d'une zone ni à une panne régionale.
    ragrs:
      en: RA-GRS adds read access to the secondary region, which no account requires here, and Azure Files doesn't support it.
      fr: RA-GRS ajoute l'accès en lecture à la région secondaire, qu'aucun compte n'exige ici, et Azure Files ne le prend pas en charge.
references:
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
  - title: Azure Files data redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/files/files-redundancy
