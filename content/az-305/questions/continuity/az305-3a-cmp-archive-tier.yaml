id: az305-3a-cmp-archive-tier
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware backs up 150 Azure virtual machines once a day to a geo-redundant Recovery Services vault. To meet a compliance rule, monthly recovery points are retained for five years and yearly recovery points for 10 years. Recovery points older than a few months are almost never restored.

    You need to recommend a way to reduce the cost of storing the long-term recovery points. The retention periods must not change.

    What should you recommend?
  fr: |
    Proseware sauvegarde 150 machines virtuelles Azure une fois par jour dans un coffre Recovery Services géoredondant. Pour respecter une règle de conformité, les points de récupération mensuels sont conservés cinq ans et les points de récupération annuels 10 ans. Les points de récupération datant de plus de quelques mois ne sont presque jamais restaurés.

    Vous devez recommander un moyen de réduire le coût de stockage des points de récupération à long terme. Les durées de rétention ne doivent pas changer.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Reduce the Instant Restore snapshot retention to one day.", fr: "Réduire à un jour la rétention des instantanés de restauration instantanée." }
    - id: b
      text: { en: "Move the eligible monthly and yearly recovery points to the vault-archive tier.", fr: "Déplacer les points de récupération mensuels et annuels éligibles vers le niveau archive du coffre." }
    - id: c
      text: { en: "Replace Azure VM backup with Azure Disk Backup.", fr: "Remplacer la sauvegarde de machines virtuelles Azure par la sauvegarde de disque Azure." }
    - id: d
      text: { en: "Change the storage redundancy of the vault to locally redundant storage.", fr: "Remplacer la redondance de stockage du coffre par un stockage localement redondant." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Backup can move long-term recovery points that are rarely accessed to the vault-archive tier, which stores them at a lower cost. For Azure virtual machines, monthly and yearly recovery points become eligible once they are at least three months old and still have at least six months of retention left. The retention defined in the policy doesn't change.
    fr: |
      Sauvegarde Azure peut déplacer vers le niveau archive du coffre les points de récupération à long terme rarement consultés, où ils sont stockés à moindre coût. Pour les machines virtuelles Azure, les points de récupération mensuels et annuels deviennent éligibles lorsqu'ils datent d'au moins trois mois et qu'il leur reste au moins six mois de rétention. La rétention définie dans la stratégie ne change pas.
  options:
    a:
      en: "Instant Restore snapshots are the short-term copies kept next to the disks; shortening their retention doesn't lower the cost of recovery points kept for years in the vault."
      fr: "Les instantanés de restauration instantanée sont les copies à court terme conservées à côté des disques ; raccourcir leur rétention ne réduit pas le coût des points de récupération gardés des années dans le coffre."
    c:
      en: "Azure Disk Backup keeps snapshots in the operational tier only, with at most 450 scheduled snapshots per disk, so it can't hold 10 years of recovery points."
      fr: "La sauvegarde de disque Azure ne conserve des instantanés que dans le niveau opérationnel, avec au plus 450 instantanés planifiés par disque : elle ne peut pas contenir 10 ans de points de récupération."
    d:
      en: "The storage redundancy of a Recovery Services vault can be changed only before backups are configured in the vault."
      fr: "La redondance de stockage d'un coffre Recovery Services ne peut être modifiée qu'avant la configuration de sauvegardes dans le coffre."
references:
  - title: Overview of Archive tier in Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/archive-tier-support
