id: az305-sr1-vm-region-dr-1
objective: "3.1.1"
type: series_yesno
series: az305-sr1-vm-region-dr
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: You recommend Azure Backup with an Enhanced policy and Cross Region Restore.
  fr: Vous recommandez Sauvegarde Azure avec une stratégie améliorée (Enhanced) et la restauration interrégion.
body:
  solution:
    en: |
      You recommend backing up the virtual machines with **Azure Backup** to a Recovery Services vault that uses geo-redundant storage with **Cross Region Restore** enabled. An Enhanced backup policy backs up the virtual machines every four hours. After a regional failure, the virtual machines are restored in North Europe.
    fr: |
      Vous recommandez de sauvegarder les machines virtuelles avec **Sauvegarde Azure** dans un coffre Recovery Services qui utilise le stockage géoredondant avec la **restauration interrégion (Cross Region Restore)** activée. Une stratégie de sauvegarde améliorée (Enhanced) sauvegarde les machines virtuelles toutes les quatre heures. Après une défaillance régionale, les machines virtuelles sont restaurées dans North Europe.
answer: { value: false }
explanation:
  correct:
    en: |
      Cross Region Restore does let you restore the virtual machines in the paired region, but the recovery point objective fails. Four hours is the shortest interval of an Enhanced policy, and the recovery points must then be replicated to the secondary region: for Azure virtual machines, the recovery point objective in the secondary region can reach 36 hours in the worst case. A backup can't guarantee a data loss of 15 minutes or less.
    fr: |
      La restauration interrégion permet bien de restaurer les machines virtuelles dans la région jumelée, mais l'objectif de point de récupération n'est pas tenu. Quatre heures est l'intervalle le plus court d'une stratégie améliorée, et les points de récupération doivent ensuite être répliqués vers la région secondaire : pour les machines virtuelles Azure, l'objectif de point de récupération dans la région secondaire peut atteindre 36 heures dans le pire des cas. Une sauvegarde ne peut pas garantir une perte de données de 15 minutes au plus.
references:
