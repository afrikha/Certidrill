id: az305-3a-uns-account-failover-yn
objective: "3.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware stores blobs in a standard general-purpose v2 storage account named stlitware that uses geo-redundant storage (GRS). You are writing the recovery procedure for an outage of the primary region.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware stocke des objets blob dans un compte de stockage standard à usage général v2 nommé stlitware, qui utilise le stockage géoredondant (GRS). Vous rédigez la procédure de récupération en cas de panne de la région primaire.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After a customer-managed unplanned failover, stlitware uses locally redundant storage in the new primary region.
        fr: Après un basculement non planifié géré par le client, stlitware utilise le stockage localement redondant dans la nouvelle région primaire.
    - id: s2
      text:
        en: A customer-managed planned failover, run while both regions are available, is expected to lose the most recent writes.
        fr: Un basculement planifié géré par le client, exécuté alors que les deux régions sont disponibles, est censé perdre les écritures les plus récentes.
    - id: s3
      text:
        en: Data written to stlitware before the Last Sync Time is available in the secondary region.
        fr: Les données écrites dans stlitware avant l'Heure de la dernière synchronisation sont disponibles dans la région secondaire.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      An unplanned failover makes the secondary region the new primary and leaves the account locally redundant there; geo-redundancy must be configured again. A planned failover is run while both regions are available, so no data loss is expected and the account stays geo-redundant. Geo-replication is asynchronous: the Last Sync Time is the most recent moment for which all the data written to the primary is also in the secondary, and later writes can be lost in an unplanned failover.
    fr: |
      Un basculement non planifié fait de la région secondaire la nouvelle région primaire et y laisse le compte localement redondant ; la géoredondance doit être reconfigurée. Un basculement planifié s'exécute alors que les deux régions sont disponibles : aucune perte de données n'est attendue et le compte reste géoredondant. La géoréplication est asynchrone : l'Heure de la dernière synchronisation est le moment le plus récent pour lequel toutes les données écrites dans la région primaire se trouvent aussi dans la région secondaire, et les écritures ultérieures peuvent être perdues lors d'un basculement non planifié.
references:
  - title: Azure storage disaster recovery planning and failover
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-disaster-recovery-guidance
