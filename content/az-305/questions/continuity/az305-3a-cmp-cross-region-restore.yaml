id: az305-3a-cmp-cross-region-restore
objective: "3.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum plans to deploy 60 Azure virtual machines in the West Europe region and to protect them with Azure Backup. No vault exists yet.

    The backup design must meet the following requirements:

    - For restores in West Europe, the RPO must be four hours.
    - Twice a year, a sample of virtual machines must be restored in North Europe as a drill, while West Europe is fully operational.
    - During an outage of West Europe, the virtual machines must be restorable in North Europe.

    You need to recommend the configuration of the Recovery Services vault and of the backup policy.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de déployer 60 machines virtuelles Azure dans la région West Europe et de les protéger avec Sauvegarde Azure. Aucun coffre n'existe encore.

    La conception de la sauvegarde doit répondre aux exigences suivantes :

    - Pour les restaurations dans West Europe, le RPO doit être de quatre heures.
    - Deux fois par an, un échantillon de machines virtuelles doit être restauré dans North Europe à titre d'exercice, alors que West Europe est pleinement opérationnelle.
    - Pendant une panne de West Europe, les machines virtuelles doivent pouvoir être restaurées dans North Europe.

    Vous devez recommander la configuration du coffre Recovery Services et de la stratégie de sauvegarde.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Storage redundancy of the vault: [[red]]

      Vault feature to enable: [[feat]]

      Backup policy: [[pol]]
    fr: |
      Redondance de stockage du coffre : [[red]]

      Fonctionnalité du coffre à activer : [[feat]]

      Stratégie de sauvegarde : [[pol]]
  slots:
    - id: red
      options:
        - { id: lrs, text: { en: "Locally redundant storage (LRS)", fr: "Stockage localement redondant (LRS)" } }
        - { id: zrs, text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" } }
        - { id: grs, text: { en: "Geo-redundant storage (GRS)", fr: "Stockage géoredondant (GRS)" } }
    - id: feat
      options:
        - { id: csr, text: "Cross Subscription Restore" }
        - { id: crr, text: "Cross Region Restore" }
        - { id: czr, text: "Cross Zonal Restore" }
    - id: pol
      options:
        - { id: std, text: { en: "A Standard policy with a daily schedule", fr: "Une stratégie standard avec une planification quotidienne" } }
        - { id: std5, text: { en: "A Standard policy with Instant Restore snapshots kept five days", fr: "Une stratégie standard avec des instantanés de restauration instantanée conservés cinq jours" } }
        - { id: enh, text: { en: "An Enhanced policy with an hourly schedule", fr: "Une stratégie améliorée avec une planification horaire" } }
answer:
  values: { red: grs, feat: crr, pol: enh }
explanation:
  correct:
    en: |
      Only a geo-redundant vault replicates the backup data to the paired region, and Cross Region Restore is the vault feature that lets you restore there on demand, for a drill as well as during an outage. An RPO of four hours requires the Enhanced policy, whose hourly schedule can run every four hours, whereas a Standard policy backs up once a day.
    fr: |
      Seul un coffre géoredondant réplique les données de sauvegarde dans la région jumelée, et la restauration interrégion (Cross Region Restore) est la fonctionnalité du coffre qui permet d'y restaurer à la demande, pour un exercice comme pendant une panne. Un RPO de quatre heures exige la stratégie améliorée, dont la planification horaire peut s'exécuter toutes les quatre heures, alors qu'une stratégie standard sauvegarde une fois par jour.
  options:
    zrs: { en: "Zone-redundant storage keeps all the backup data inside West Europe.", fr: "Le stockage redondant interzone garde toutes les données de sauvegarde dans West Europe." }
    czr: { en: "Cross Zonal Restore restores a virtual machine to another availability zone, not to another region.", fr: "Cross Zonal Restore restaure une machine virtuelle dans une autre zone de disponibilité, pas dans une autre région." }
    csr: { en: "Cross Subscription Restore targets another subscription of the tenant; it doesn't make backups available in North Europe.", fr: "Cross Subscription Restore cible un autre abonnement du locataire ; elle ne rend pas les sauvegardes disponibles dans North Europe." }
    std5: { en: "The retention of Instant Restore snapshots doesn't change the daily frequency of a Standard policy.", fr: "La rétention des instantanés de restauration instantanée ne change pas la fréquence quotidienne d'une stratégie standard." }
references:
  - title: Create and configure a Recovery Services vault
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
  - title: Back up an Azure VM by using the Enhanced policy
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy
