id: az305-3a-db-sql-failover-design
objective: "3.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders hosts its production databases in Azure SQL Database in the East US region. You are designing the recovery from a region-wide outage:

    - The 15 databases of the ERP application must fail over together to West US, and the application must keep the same connection endpoint after the failover.
    - The product catalog database needs readable copies in three other regions.
    - Once a year, a disaster recovery drill must switch the ERP databases to West US without losing any transaction.

    You need to complete the design.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders héberge ses bases de données de production dans Azure SQL Database, dans la région East US. Vous concevez la récupération en cas de panne de toute la région :

    - Les 15 bases de données de l'application ERP doivent basculer ensemble vers West US, et l'application doit conserver le même point de terminaison de connexion après le basculement.
    - La base de données du catalogue de produits a besoin de copies lisibles dans trois autres régions.
    - Une fois par an, un exercice de reprise d'activité doit faire passer les bases de données ERP dans West US sans perdre aucune transaction.

    Vous devez compléter la conception.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      For the ERP databases, use [[erp]].

      For the product catalog database, use [[catalog]].

      For the yearly drill, start [[drill]].
    fr: |
      Pour les bases de données ERP, utilisez [[erp]].

      Pour la base de données du catalogue de produits, utilisez [[catalog]].

      Pour l'exercice annuel, lancez [[drill]].
  slots:
    - id: erp
      options:
        - { id: agr, text: { en: "active geo-replication", fr: "la géoréplication active" } }
        - { id: fog, text: { en: "a failover group", fr: "un groupe de basculement" } }
        - { id: geo, text: { en: "geo-restore", fr: "la géorestauration" } }
        - { id: zr, text: { en: "a zone-redundant configuration", fr: "une configuration redondante interzone" } }
    - id: catalog
      options:
        - { id: agr, text: { en: "active geo-replication", fr: "la géoréplication active" } }
        - { id: fog, text: { en: "a failover group", fr: "un groupe de basculement" } }
        - { id: geo, text: { en: "geo-restore", fr: "la géorestauration" } }
        - { id: zr, text: { en: "a zone-redundant configuration", fr: "une configuration redondante interzone" } }
    - id: drill
      options:
        - { id: forced, text: { en: "a forced failover", fr: "un basculement forcé" } }
        - { id: restore, text: { en: "a geo-restore to the West US server", fr: "une géorestauration sur le serveur de West US" } }
        - { id: planned, text: { en: "a planned failover", fr: "un basculement planifié" } }
answer:
  values: { erp: fog, catalog: agr, drill: planned }
explanation:
  correct:
    en: |
      A failover group fails over a set of databases as a unit and exposes listener endpoints whose names don't change, so the application keeps its connection string. Active geo-replication is configured per database and supports up to four readable secondaries, which covers three regions, whereas a failover group has a single secondary server outside of a preview feature. For a drill, the planned failover synchronizes the data completely before switching roles, so nothing is lost; a forced failover switches immediately and can lose the transactions not yet replicated.
    fr: |
      Un groupe de basculement fait basculer un ensemble de bases de données en bloc et expose des points de terminaison d'écouteur dont les noms ne changent pas : l'application garde sa chaîne de connexion. La géoréplication active se configure par base de données et prend en charge jusqu'à quatre secondaires lisibles, ce qui couvre trois régions, alors qu'un groupe de basculement n'a qu'un seul serveur secondaire en dehors d'une fonctionnalité en préversion. Pour un exercice, le basculement planifié synchronise entièrement les données avant d'échanger les rôles, de sorte que rien n'est perdu ; un basculement forcé bascule immédiatement et peut perdre les transactions pas encore répliquées.
  options:
    geo: { en: "Geo-restore creates a new database from geo-replicated backups; it provides neither a stable endpoint nor readable copies.", fr: "La géorestauration crée une nouvelle base de données à partir de sauvegardes géorépliquées ; elle ne fournit ni point de terminaison stable ni copies lisibles." }
    zr: { en: "A zone-redundant configuration protects against a zone failure inside East US only.", fr: "Une configuration redondante interzone ne protège que contre la panne d'une zone à l'intérieur d'East US." }
    forced: { en: "A forced failover is meant for an unavailable primary and accepts data loss.", fr: "Un basculement forcé est prévu pour un serveur primaire indisponible et accepte une perte de données." }
references:
  - title: Failover groups overview & best practices (Azure SQL Database)
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/failover-group-sql-db
  - title: Active geo-replication
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
