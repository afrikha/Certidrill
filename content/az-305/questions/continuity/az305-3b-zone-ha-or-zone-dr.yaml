id: az305-3b-zone-ha-or-zone-dr
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans to run two workloads on Azure virtual machines in the Sweden Central region, which supports availability zones. A company policy requires all the data of the workloads to stay in Sweden Central.

    - **Workload1** is a stateless web farm that can run on any number of virtual machines. It must keep serving requests if an availability zone fails.
    - **Workload2** is a licensed application that can run on only one virtual machine at a time. The virtual machine uses Premium SSD disks with locally redundant storage (LRS). After a zone failure, Workload2 may be restarted in another zone with a short downtime and the loss of a few minutes of data. The failover and the failback must be orchestrated by an Azure service and must be testable by a drill.

    You need to recommend a solution for each workload.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit d'exécuter deux charges de travail sur des machines virtuelles Azure dans la région Sweden Central, qui prend en charge les zones de disponibilité. Une règle de l'entreprise impose que toutes les données des charges de travail restent dans Sweden Central.

    - **Workload1** est une batterie de serveurs web sans état qui peut s'exécuter sur un nombre quelconque de machines virtuelles. Elle doit continuer à traiter les requêtes si une zone de disponibilité tombe en panne.
    - **Workload2** est une application sous licence qui ne peut s'exécuter que sur une seule machine virtuelle à la fois. La machine virtuelle utilise des disques Premium SSD en stockage localement redondant (LRS). Après la panne d'une zone, Workload2 peut être redémarrée dans une autre zone avec une courte interruption et la perte de quelques minutes de données. Le basculement et la restauration automatique doivent être orchestrés par un service Azure et pouvoir être testés par un exercice.

    Vous devez recommander une solution pour chaque charge de travail.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Workload1: [[w1]]

      Workload2: [[w2]]
    fr: |
      Workload1 : [[w1]]

      Workload2 : [[w2]]
  slots:
    - id: w1
      options:
        - { id: avset, text: { en: "Virtual machines in an availability set, behind a Standard Load Balancer", fr: "Des machines virtuelles dans un groupe à haute disponibilité, derrière un Standard Load Balancer" } }
        - { id: zones, text: { en: "Virtual machines in three availability zones, behind a Standard Load Balancer", fr: "Des machines virtuelles dans trois zones de disponibilité, derrière un Standard Load Balancer" } }
        - { id: asrzone, text: { en: "Virtual machines in one availability zone, replicated to another zone by Azure Site Recovery", fr: "Des machines virtuelles dans une seule zone de disponibilité, répliquées vers une autre zone par Azure Site Recovery" } }
    - id: w2
      options:
        - { id: asrregion, text: { en: "Azure Site Recovery replication to another region", fr: "Une réplication Azure Site Recovery vers une autre région" } }
        - { id: asrzone, text: { en: "Azure Site Recovery replication to another availability zone", fr: "Une réplication Azure Site Recovery vers une autre zone de disponibilité" } }
        - { id: twovm, text: { en: "Two virtual machines in different availability zones, behind a Standard Load Balancer", fr: "Deux machines virtuelles dans des zones de disponibilité différentes, derrière un Standard Load Balancer" } }
answer:
  values: { w1: zones, w2: asrzone }
explanation:
  correct:
    en: Workload1 can run several instances, so virtual machines in several zones behind a zone-redundant Standard Load Balancer keep it running through a zone failure, without a failover. Workload2 can't run two instances. Zone-to-zone disaster recovery of Azure Site Recovery replicates its virtual machine to another zone of the same region and provides failover, failback and drills, and the data never leaves the region.
    fr: "Workload1 peut exécuter plusieurs instances ; des machines virtuelles dans plusieurs zones derrière un Standard Load Balancer redondant interzone la maintiennent donc en service pendant la panne d'une zone, sans basculement. Workload2 ne peut pas exécuter deux instances. La reprise d'activité de zone à zone d'Azure Site Recovery réplique sa machine virtuelle vers une autre zone de la même région et fournit le basculement, la restauration automatique et les exercices, sans que les données quittent la région."
  options:
    avset:
      en: An availability set keeps the virtual machines in one datacenter. It doesn't survive a zone failure.
      fr: Un groupe à haute disponibilité garde les machines virtuelles dans un seul centre de données. Il ne survit pas à la panne d'une zone.
    asrzone:
      en: For Workload1, replication by Site Recovery means a failover with downtime, whereas a stateless farm can simply run in several zones at once. For Workload2, it is the correct choice.
      fr: Pour Workload1, une réplication par Site Recovery implique un basculement avec interruption, alors qu'une batterie de serveurs sans état peut simplement s'exécuter dans plusieurs zones à la fois. Pour Workload2, c'est le bon choix.
    asrregion:
      en: Replication to another region stores the data outside Sweden Central, which the company policy forbids.
      fr: Une réplication vers une autre région stocke les données hors de Sweden Central, ce que la règle de l'entreprise interdit.
    twovm:
      en: Workload2 can run on only one virtual machine at a time, so it can't be load balanced across two virtual machines.
      fr: Workload2 ne peut s'exécuter que sur une seule machine virtuelle à la fois ; elle ne peut donc pas être équilibrée entre deux machines virtuelles.
references:
  - title: Enable Azure VM disaster recovery between availability zones
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-how-to-enable-zone-to-zone-disaster-recovery
  - title: Reliability in Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-virtual-machines
