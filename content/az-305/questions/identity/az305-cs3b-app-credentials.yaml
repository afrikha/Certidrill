id: az305-cs3b-app-credentials
objective: "1.2.5"
type: multi
caseStudy: az305-cs3b-woodgrove
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend how app-loans will authenticate to LoansDB, to stloandocs and to the credit bureau. The solution must meet the identity and security requirements.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander la manière dont app-loans s'authentifiera auprès de LoansDB, de stloandocs et du bureau de crédit. La solution doit satisfaire les exigences d'identité et de sécurité.

    Quelles sont les deux actions que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create an app registration for app-loans and keep its client secret in Azure Key Vault."
        fr: "Créer une inscription d'application pour app-loans et conserver son secret client dans Azure Key Vault."
    - id: b
      text:
        en: "Enable a managed identity on app-loans and grant it access to LoansDB and to stloandocs."
        fr: "Activer une identité managée sur app-loans et lui accorder l'accès à LoansDB et à stloandocs."
    - id: c
      text:
        en: "Keep the SQL connection string and the storage account key as secrets in Azure Key Vault."
        fr: "Conserver la chaîne de connexion SQL et la clé du compte de stockage comme secrets dans Azure Key Vault."
    - id: d
      text:
        en: "Keep the credit bureau API key in an app setting that is marked as a deployment slot setting."
        fr: "Conserver la clé d'API du bureau de crédit dans un paramètre d'application marqué comme paramètre d'emplacement de déploiement."
    - id: e
      text:
        en: "Keep the credit bureau API key in Azure Key Vault and point an app setting to it with a Key Vault reference."
        fr: "Conserver la clé d'API du bureau de crédit dans Azure Key Vault et faire pointer un paramètre d'application vers elle par une référence Key Vault."
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: "With a managed identity, app-loans obtains Microsoft Entra tokens from the platform and signs in to Azure SQL Database and to Azure Storage without any stored secret. The credit bureau API key can't be replaced by an identity, so it is kept as a secret in Key Vault. An app setting that contains a Key Vault reference without a version is resolved with the managed identity, needs no code change and picks up a new version of the secret within 24 hours, without a deployment."
    fr: "Avec une identité managée, app-loans obtient des jetons Microsoft Entra auprès de la plateforme et se connecte à Azure SQL Database et à Stockage Azure sans aucun secret stocké. La clé d'API du bureau de crédit ne peut pas être remplacée par une identité : elle est donc conservée comme secret dans Key Vault. Un paramètre d'application qui contient une référence Key Vault sans version est résolu avec l'identité managée, ne demande aucun changement de code et récupère une nouvelle version du secret dans les 24 heures, sans déploiement."
  options:
    a:
      en: "An app registration still has a client secret that must be stored and rotated. The requirements allow no stored secret for the access to LoansDB and stloandocs."
      fr: "Une inscription d'application possède toujours un secret client qu'il faut stocker et renouveler. Les exigences n'admettent aucun secret stocké pour l'accès à LoansDB et à stloandocs."
    c:
      en: "Moving the password and the account key to Key Vault protects them better, but they remain stored secrets. The requirements exclude any stored secret for these two resources."
      fr: "Déplacer le mot de passe et la clé de compte dans Key Vault les protège mieux, mais ils restent des secrets stockés. Les exigences excluent tout secret stocké pour ces deux ressources."
    d:
      en: "A slot setting only keeps a value attached to its deployment slot during a swap. The key would still be stored in the app settings."
      fr: "Un paramètre d'emplacement ne fait que maintenir une valeur attachée à son emplacement de déploiement lors d'un échange. La clé resterait stockée dans les paramètres d'application."
references:
  - title: "Tutorial: Use managed identity to connect an Azure web app to an Azure SQL database without secrets"
    url: https://learn.microsoft.com/en-us/azure/app-service/tutorial-connect-msi-sql-database
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
