id: az305-1a-log-table-plans-dd
objective: "1.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is designing a Log Analytics workspace that will contain the following three tables:

    - **SecEvents_CL**: security events used continuously by insights and by scheduled alert rules that aggregate the data.
    - **ProxyTrace_CL**: proxy traces queried with KQL only when an incident is investigated. An alert must fire for each record that contains a specific error code.
    - **AuditTrail_CL**: verbose audit records kept for compliance, almost never read and used by no alert rule.

    You need to recommend a table plan for each table. The solution must minimize costs.

    Which plan should you recommend for each table? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys conçoit un espace de travail Log Analytics qui contiendra les trois tables suivantes :

    - **SecEvents_CL** : des événements de sécurité utilisés en continu par des insights et par des règles d'alerte planifiées qui agrègent les données.
    - **ProxyTrace_CL** : des traces de proxy interrogées en KQL uniquement lors de l'investigation d'un incident. Une alerte doit se déclencher pour chaque enregistrement qui contient un code d'erreur précis.
    - **AuditTrail_CL** : des enregistrements d'audit détaillés conservés pour la conformité, presque jamais lus et utilisés par aucune règle d'alerte.

    Vous devez recommander un plan de table pour chaque table. La solution doit réduire les coûts au minimum.

    Quel plan devez-vous recommander pour chaque table ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      SecEvents_CL: [[sec]]

      ProxyTrace_CL: [[proxy]]

      AuditTrail_CL: [[audit]]
    fr: |
      SecEvents_CL : [[sec]]

      ProxyTrace_CL : [[proxy]]

      AuditTrail_CL : [[audit]]
  slots:
    - id: sec
      options:
        - { id: analytics, text: Analytics }
        - { id: basic, text: Basic }
        - { id: auxiliary, text: Auxiliary }
    - id: proxy
      options:
        - { id: analytics, text: Analytics }
        - { id: basic, text: Basic }
        - { id: auxiliary, text: Auxiliary }
    - id: audit
      options:
        - { id: analytics, text: Analytics }
        - { id: basic, text: Basic }
        - { id: auxiliary, text: Auxiliary }
answer:
  values: { sec: analytics, proxy: basic, audit: auxiliary }
explanation:
  correct:
    en: |
      Only the Analytics plan supports insights and every type of alert rule, so the security events need it. The Basic plan has a reduced ingestion cost, full KQL and simple log search alerts, which evaluate each record individually: it is the cheapest plan that fits the proxy traces. The Auxiliary plan has the lowest ingestion cost and suits audit and compliance data that is rarely read; it supports no alert, which the audit table doesn't need.
    fr: |
      Seul le plan Analytics prend en charge les insights et tous les types de règles d'alerte : les événements de sécurité en ont besoin. Le plan Basic offre un coût d'ingestion réduit, le KQL complet et les alertes de recherche dans les journaux simples, qui évaluent chaque enregistrement individuellement : c'est le plan le moins cher qui convient aux traces de proxy. Le plan Auxiliary a le coût d'ingestion le plus bas et convient aux données d'audit et de conformité rarement lues ; il ne prend en charge aucune alerte, ce dont la table d'audit n'a pas besoin.
references:
  - title: Azure Monitor Logs overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/data-platform-logs
  - title: Choose the right type of alert rule
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
