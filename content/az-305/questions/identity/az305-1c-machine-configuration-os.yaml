id: az305-1c-machine-configuration-os
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs 300 Windows Server virtual machines and 150 Linux virtual machines in Azure. A new internal standard defines settings inside the operating system: minimum password length, services that must not run and local accounts that must not exist.

    You need to recommend a solution to audit these settings. The solution must meet the following requirements:

    - The results must appear in the Azure Policy compliance view, next to the other policies of Litware.
    - Windows and Linux must both be covered.
    - Administrative effort must be minimized.

    What should you recommend?
  fr: |
    Litware exécute 300 machines virtuelles Windows Server et 150 machines virtuelles Linux dans Azure. Une nouvelle norme interne définit des paramètres à l'intérieur du système d'exploitation : longueur minimale des mots de passe, services qui ne doivent pas s'exécuter et comptes locaux qui ne doivent pas exister.

    Vous devez recommander une solution pour auditer ces paramètres. La solution doit respecter les exigences suivantes :

    - Les résultats doivent apparaître dans la vue de conformité d'Azure Policy, à côté des autres stratégies de Litware.
    - Windows et Linux doivent tous deux être couverts.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Azure Update Manager", fr: "Azure Update Manager" }
    - id: b
      text: { en: "Azure machine configuration", fr: "Configuration de machine Azure" }
    - id: c
      text: { en: "Change Tracking and Inventory", fr: "Change Tracking and Inventory (Suivi des modifications et inventaire)" }
    - id: d
      text: { en: "Azure Automation State Configuration", fr: "Azure Automation State Configuration" }
answer: { optionId: b }
explanation:
  correct:
    en: "Azure machine configuration audits, and can enforce, settings inside the operating system of Windows and Linux machines. It is assigned through Azure Policy, so each machine is reported as compliant or non-compliant in the same compliance view as the other policies."
    fr: "La configuration de machine Azure audite, et peut imposer, des paramètres à l'intérieur du système d'exploitation des machines Windows et Linux. Elle s'attribue par Azure Policy : chaque machine est donc signalée comme conforme ou non conforme dans la même vue de conformité que les autres stratégies."
  options:
    a:
      en: "Azure Update Manager assesses and installs operating system updates. It doesn't audit password settings, services or local accounts."
      fr: "Azure Update Manager évalue et installe les mises à jour du système d'exploitation. Il n'audite pas les paramètres de mot de passe, les services ni les comptes locaux."
    c:
      en: "Change Tracking and Inventory records what changes on a machine, such as software, files and services. It doesn't evaluate the machine against a required configuration in Azure Policy."
      fr: "Change Tracking and Inventory enregistre ce qui change sur une machine, comme les logiciels, les fichiers et les services. Il n'évalue pas la machine par rapport à une configuration exigée dans Azure Policy."
    d:
      en: "Azure Automation State Configuration applies configurations from an Automation account and reports there, not in the Azure Policy compliance view."
      fr: "Azure Automation State Configuration applique des configurations à partir d'un compte Automation et produit ses rapports à cet endroit, pas dans la vue de conformité d'Azure Policy."
references:
  - title: What is Azure Machine Configuration?
    url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview
