id: az305-cs1c-governance
objective: "1.3.2"
type: yesno_statements
caseStudy: az305-cs1c-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You are designing the controls that will meet the governance requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez les contrôles qui répondront aux exigences de gouvernance.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Assigning the Allowed locations built-in policy to MG-Humongous applies the region requirement to a subscription that is created later under MG-NonProd.
        fr: Attribuer la stratégie intégrée Allowed locations à MG-Humongous applique l'exigence de région à un abonnement créé plus tard sous MG-NonProd.
    - id: s2
      text:
        en: Assigning the Require a tag on resources built-in policy to MG-Humongous adds the CostCenter tag to the existing resources.
        fr: Attribuer la stratégie intégrée Require a tag on resources à MG-Humongous ajoute l'étiquette CostCenter aux ressources existantes.
    - id: s3
      text:
        en: A CanNotDelete lock on RG-Hub stops a user who has the Owner role on Sub-Connectivity from deleting the hub virtual network while the lock exists.
        fr: Un verrou CanNotDelete sur RG-Hub empêche un utilisateur qui a le rôle Owner sur Sub-Connectivity de supprimer le réseau virtuel hub tant que le verrou existe.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A policy assigned to a management group is inherited by every management group and subscription below it, including the subscriptions that are added later. Require a tag on resources has the deny effect: it rejects new resources without the tag and reports the existing ones as non-compliant, but changes nothing. The tag requirement calls for the Inherit a tag from the resource group policy, whose modify effect is applied to existing resources by a remediation task. A resource lock applies to all users, whatever their role: the resources of RG-Hub inherit the lock, and an owner must remove it before deleting the virtual network, which prevents accidental deletions.
    fr: |
      Une stratégie attribuée à un groupe d'administration est héritée par tous les groupes d'administration et abonnements situés en dessous, y compris les abonnements ajoutés plus tard. Require a tag on resources a l'effet deny : elle rejette les nouvelles ressources sans l'étiquette et signale les ressources existantes comme non conformes, mais ne modifie rien. L'exigence d'étiquetage demande la stratégie Inherit a tag from the resource group, dont l'effet modify est appliqué aux ressources existantes par une tâche de correction. Un verrou de ressource s'applique à tous les utilisateurs, quel que soit leur rôle : les ressources de RG-Hub héritent du verrou, et un propriétaire doit le retirer avant de supprimer le réseau virtuel, ce qui évite les suppressions accidentelles.
references:
  - title: Assign policy definitions for tag compliance
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-policies
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
