id: az305-1b-onprem-arc-servers-yn
objective: "1.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys plans to onboard the Windows and Linux servers of its datacenter to Azure Arc-enabled servers, in a resource group named **RG-Arc**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit d'intégrer les serveurs Windows et Linux de son centre de données aux serveurs avec Azure Arc, dans un groupe de ressources nommé **RG-Arc**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Each onboarded server is represented by an Azure resource in RG-Arc, to which Azure roles can be assigned.
        fr: Chaque serveur intégré est représenté par une ressource Azure dans RG-Arc, à laquelle des rôles Azure peuvent être attribués.
    - id: s2
      text:
        en: A user whose only role is Owner on an Arc-enabled Linux server can open an SSH session on it with a Microsoft Entra account.
        fr: Un utilisateur dont le seul rôle est Owner sur un serveur Linux avec Azure Arc peut y ouvrir une session SSH avec un compte Microsoft Entra.
    - id: s3
      text:
        en: An application on an onboarded server can use the managed identity of the server to read a secret from Azure Key Vault, once the identity has been granted access.
        fr: Une application installée sur un serveur intégré peut utiliser l'identité managée du serveur pour lire un secret dans Azure Key Vault, une fois l'accès accordé à cette identité.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "A connected machine gets an Azure resource ID and sits in a resource group like any other resource, so it can be governed with Azure roles and policies. Owner and Contributor on the server don't grant SSH sign-in with Microsoft Entra ID: that requires the Virtual Machine Administrator Login or Virtual Machine User Login role. An Arc-enabled server has a system-assigned managed identity that local applications use to obtain tokens for services such as Key Vault."
    fr: "Une machine connectée reçoit un ID de ressource Azure et se trouve dans un groupe de ressources comme n'importe quelle autre ressource : elle peut donc être gouvernée par des rôles et des stratégies Azure. Owner et Contributor sur le serveur n'accordent pas la connexion SSH avec Microsoft Entra ID : il faut pour cela le rôle Virtual Machine Administrator Login ou Virtual Machine User Login. Un serveur avec Azure Arc possède une identité managée affectée par le système, que les applications locales utilisent pour obtenir des jetons destinés à des services tels que Key Vault."
references:
  - title: What is Azure Arc-enabled servers?
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/overview
  - title: SSH access to Azure Arc-enabled servers
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/ssh-arc-overview
