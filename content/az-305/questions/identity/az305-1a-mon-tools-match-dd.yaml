id: az305-1a-mon-tools-match-dd
objective: "1.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is defining its monitoring strategy for Azure.

    You need to recommend the service that meets each of the following needs.

    Which service should you recommend for each need? To answer, drag the appropriate services to the correct needs. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank définit sa stratégie de monitoring pour Azure.

    Vous devez recommander le service qui répond à chacun des besoins suivants.

    Quel service devez-vous recommander pour chaque besoin ? Pour répondre, faites glisser les services appropriés vers les besoins correspondants. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sentinel, text: "Microsoft Sentinel" }
    - { id: rh, text: "Azure Resource Health" }
    - { id: appi, text: "Application Insights" }
    - { id: sh, text: "Azure Service Health" }
    - { id: advisor, text: "Azure Advisor" }
    - { id: grafana, text: "Azure Managed Grafana" }
  targets:
    - id: t1
      text:
        en: "Correlate security events from many sources into incidents and run automated response playbooks."
        fr: "Corréler des événements de sécurité de nombreuses sources en incidents et exécuter des playbooks de réponse automatisée."
    - id: t2
      text:
        en: "Find out whether a given virtual machine was unavailable yesterday because of an Azure platform event."
        fr: "Savoir si une machine virtuelle donnée a été indisponible hier à cause d'un événement de la plateforme Azure."
    - id: t3
      text:
        en: "Identify which dependency slows down the requests of a web API."
        fr: "Identifier la dépendance qui ralentit les requêtes d'une API web."
answer:
  mapping: { t1: sentinel, t2: rh, t3: appi }
explanation:
  correct:
    en: |
      Microsoft Sentinel is the SIEM: it collects security data through connectors, groups alerts into incidents and runs playbooks built on Azure Logic Apps. Azure Resource Health reports the current and past health of an individual resource and tells whether its unavailability came from a platform event. Application Insights collects the requests and dependencies of an application; its application map and performance views show which dependency is slow.
    fr: |
      Microsoft Sentinel est le SIEM : il collecte les données de sécurité par des connecteurs, regroupe les alertes en incidents et exécute des playbooks construits sur Azure Logic Apps. Azure Resource Health indique l'intégrité actuelle et passée d'une ressource individuelle et précise si son indisponibilité provenait d'un événement de la plateforme. Application Insights collecte les requêtes et les dépendances d'une application ; sa cartographie d'application et ses vues de performances montrent quelle dépendance est lente.
  options:
    sh:
      en: "Azure Service Health reports the service issues and planned maintenance of the services and regions you use, not the history of one particular resource."
      fr: "Azure Service Health signale les problèmes de service et les maintenances planifiées des services et des régions que vous utilisez, pas l'historique d'une ressource en particulier."
    advisor:
      en: "Azure Advisor issues recommendations to optimize deployed resources; it doesn't investigate incidents."
      fr: "Azure Advisor émet des recommandations pour optimiser les ressources déployées ; il n'investigue pas les incidents."
references:
  - title: Resource Health overview
    url: https://learn.microsoft.com/en-us/azure/service-health/resource-health-overview
  - title: What is Microsoft Sentinel security information and event management (SIEM)?
    url: https://learn.microsoft.com/en-us/azure/sentinel/overview
