id: az305-1c-mg-assignment-scope-hotarea
objective: "1.3.1"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has the management groups and subscriptions shown in the following table. New subscriptions for internal applications will be created under MG-Corp, and new subscriptions for internet-facing applications under MG-Online.

    You need to recommend the scope of two policy assignments. Each policy must be assigned only once, and it must not apply to more subscriptions than required.

    Answer each prompt by selecting the appropriate scope in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose des groupes d'administration et des abonnements présentés dans le tableau suivant. Les nouveaux abonnements destinés aux applications internes seront créés sous MG-Corp, et les nouveaux abonnements destinés aux applications exposées à Internet sous MG-Online.

    Vous devez recommander l'étendue de deux attributions de stratégies. Chaque stratégie ne doit être attribuée qu'une seule fois, et elle ne doit pas s'appliquer à plus d'abonnements que nécessaire.

    Répondez à chaque consigne en sélectionnant l'étendue appropriée dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: "A policy that denies public IP addresses in Sub-HR, Sub-Finance and the future subscriptions of internal applications"
        fr: "Une stratégie qui refuse les adresses IP publiques dans Sub-HR, Sub-Finance et les futurs abonnements d'applications internes"
    - id: p2
      text:
        en: "A policy that requires diagnostic settings in the current and future subscriptions of internal and internet-facing applications, but not in the platform and sandbox subscriptions"
        fr: "Une stratégie qui exige des paramètres de diagnostic dans les abonnements actuels et futurs des applications internes et des applications exposées à Internet, mais pas dans les abonnements de plateforme et de bac à sable"
  grid:
    header:
      - { en: "Scope", fr: "Étendue" }
      - { en: "Type", fr: "Type" }
      - { en: "Parent", fr: "Parent" }
      - { en: "Subscriptions directly below", fr: "Abonnements directement en dessous" }
    rows:
      - [{ text: Tenant Root Group, area: root }, { text: { en: "Management group", fr: "Groupe d'administration" } }, { text: "-" }, { text: { en: "None", fr: "Aucun" } }]
      - [{ text: MG-Fabrikam, area: fabrikam }, { text: { en: "Management group", fr: "Groupe d'administration" } }, { text: Tenant Root Group }, { text: { en: "None", fr: "Aucun" } }]
      - [{ text: MG-Platform, area: platform }, { text: { en: "Management group", fr: "Groupe d'administration" } }, { text: MG-Fabrikam }, { text: "Sub-Connectivity, Sub-Management" }]
      - [{ text: MG-LandingZones, area: lz }, { text: { en: "Management group", fr: "Groupe d'administration" } }, { text: MG-Fabrikam }, { text: { en: "None", fr: "Aucun" } }]
      - [{ text: MG-Corp, area: corp }, { text: { en: "Management group", fr: "Groupe d'administration" } }, { text: MG-LandingZones }, { text: "Sub-HR, Sub-Finance" }]
      - [{ text: MG-Online, area: online }, { text: { en: "Management group", fr: "Groupe d'administration" } }, { text: MG-LandingZones }, { text: Sub-Shop }]
      - [{ text: MG-Sandbox, area: sandbox }, { text: { en: "Management group", fr: "Groupe d'administration" } }, { text: MG-Fabrikam }, { text: "Sub-Dev1, Sub-Dev2" }]
answer:
  values: { p1: corp, p2: lz }
explanation:
  correct:
    en: "An assignment made at a management group is inherited by all the subscriptions below it, including those created there later. MG-Corp contains exactly the subscriptions of internal applications, so the first policy goes there and leaves Sub-Shop alone. MG-LandingZones is the lowest scope that covers both MG-Corp and MG-Online. MG-Fabrikam or the Tenant Root Group would also reach the platform and sandbox subscriptions."
    fr: "Une attribution faite sur un groupe d'administration est héritée par tous les abonnements situés en dessous, y compris ceux qui y sont créés plus tard. MG-Corp contient exactement les abonnements des applications internes : la première stratégie s'y attribue et ne touche pas Sub-Shop. MG-LandingZones est l'étendue la plus basse qui couvre à la fois MG-Corp et MG-Online. MG-Fabrikam ou le groupe racine du locataire atteindraient aussi les abonnements de plateforme et de bac à sable."
references:
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
  - title: Management groups
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups
