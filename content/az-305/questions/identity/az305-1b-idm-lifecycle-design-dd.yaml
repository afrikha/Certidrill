id: az305-1b-idm-lifecycle-design-dd
objective: "1.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has an on-premises Active Directory Domain Services (AD DS) forest that is synchronized to a Microsoft Entra tenant by using Microsoft Entra Cloud Sync and password hash synchronization. Workday is the human resources system of record.

    You need to recommend an identity management solution that meets the following requirements:

    - **Requirement 1:** An account is created in AD DS when a hire is recorded in Workday, and disabled when the contract ends.
    - **Requirement 2:** A user who forgets a password resets it from the Microsoft Entra sign-in page, and the new password applies to the AD DS account.
    - **Requirement 3:** A legacy application that moves to Azure virtual machines gets a directory in which it can extend the schema and use Domain Admins privileges.

    What should you include in the recommendation for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'une forêt Active Directory Domain Services (AD DS) locale, synchronisée vers un locataire Microsoft Entra avec Microsoft Entra Cloud Sync et la synchronisation de hachage du mot de passe. Workday est le système de référence des ressources humaines.

    Vous devez recommander une solution de gestion des identités qui répond aux exigences suivantes :

    - **Exigence 1 :** un compte est créé dans AD DS lorsqu'une embauche est enregistrée dans Workday, et désactivé à la fin du contrat.
    - **Exigence 2 :** un utilisateur qui oublie son mot de passe le réinitialise depuis la page de connexion Microsoft Entra, et le nouveau mot de passe s'applique au compte AD DS.
    - **Exigence 3 :** une application ancienne déplacée vers des machines virtuelles Azure dispose d'un annuaire dont elle peut étendre le schéma et dans lequel elle utilise des privilèges d'administrateur de domaine.

    Que devez-vous inclure dans la recommandation pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Requirement 1: [[r1]]

      Requirement 2: [[r2]]

      Requirement 3: [[r3]]
    fr: |
      Exigence 1 : [[r1]]

      Exigence 2 : [[r2]]

      Exigence 3 : [[r3]]
  slots:
    - id: r1
      options:
        - { id: hr, text: { en: "HR-driven provisioning from Workday", fr: "L'approvisionnement piloté par les RH à partir de Workday" } }
        - { id: grp, text: { en: "Group provisioning to AD DS in Cloud Sync", fr: "L'approvisionnement de groupes dans AD DS avec Cloud Sync" } }
        - { id: cts, text: { en: "Cross-tenant synchronization", fr: "La synchronisation interlocataire" } }
        - { id: b2b, text: { en: "B2B collaboration", fr: "La collaboration B2B" } }
    - id: r2
      options:
        - { id: phs, text: { en: "Password hash synchronization alone", fr: "La synchronisation de hachage du mot de passe seule" } }
        - { id: pta, text: { en: "Pass-through authentication", fr: "L'authentification directe" } }
        - { id: wb, text: { en: "Self-service password reset with password writeback", fr: "La réinitialisation de mot de passe en libre-service avec la réécriture du mot de passe" } }
        - { id: sso, text: { en: "Seamless single sign-on", fr: "L'authentification unique transparente" } }
    - id: r3
      options:
        - { id: ds, text: { en: "A Microsoft Entra Domain Services managed domain", fr: "Un domaine managé Microsoft Entra Domain Services" } }
        - { id: join, text: { en: "Microsoft Entra join for the virtual machines", fr: "La jonction des machines virtuelles à Microsoft Entra" } }
        - { id: ext, text: { en: "A Microsoft Entra External ID external tenant", fr: "Un locataire externe Microsoft Entra External ID" } }
        - { id: vm, text: { en: "AD DS domain controllers on Azure virtual machines", fr: "Des contrôleurs de domaine AD DS sur des machines virtuelles Azure" } }
answer:
  values: { r1: hr, r2: wb, r3: vm }
explanation:
  correct:
    en: "HR-driven provisioning makes the HR system the source of authority: a hire recorded in Workday creates the account in Active Directory, and a termination disables it. Password writeback sends a password that was reset through self-service password reset back to AD DS in real time, whatever the sign-in method. Schema extensions and Domain Admins privileges exist only in a self-managed AD DS domain, so the application needs domain controllers on virtual machines."
    fr: "L'approvisionnement piloté par les RH fait du système RH la source d'autorité : une embauche enregistrée dans Workday crée le compte dans Active Directory, et une fin de contrat le désactive. La réécriture du mot de passe renvoie en temps réel vers AD DS un mot de passe réinitialisé en libre-service, quelle que soit la méthode de connexion. Les extensions de schéma et les privilèges d'administrateur de domaine n'existent que dans un domaine AD DS autogéré : l'application a donc besoin de contrôleurs de domaine sur des machines virtuelles."
  options:
    grp:
      en: "Cloud Sync provisions groups from Microsoft Entra ID to AD DS; it doesn't create user accounts from an HR system."
      fr: "Cloud Sync approvisionne des groupes de Microsoft Entra ID vers AD DS ; il ne crée pas de comptes d'utilisateurs à partir d'un système RH."
    phs:
      en: "Password hash synchronization copies hashes from AD DS to the cloud. Without writeback, a password reset in the cloud never reaches AD DS."
      fr: "La synchronisation de hachage du mot de passe copie des hachages d'AD DS vers le cloud. Sans réécriture, un mot de passe réinitialisé dans le cloud n'atteint jamais AD DS."
    ds:
      en: "A managed domain supports neither schema extensions nor Domain Admins or Enterprise Admins privileges."
      fr: "Un domaine managé ne prend en charge ni les extensions de schéma ni les privilèges d'administrateur de domaine ou d'entreprise."
references:
  - title: What is HR-driven provisioning?
    url: https://learn.microsoft.com/en-us/entra/identity/app-provisioning/what-is-hr-driven-provisioning
  - title: How does self-service password reset writeback work in Microsoft Entra ID?
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-writeback
