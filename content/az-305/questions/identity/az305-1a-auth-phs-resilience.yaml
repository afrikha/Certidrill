id: az305-1a-auth-phs-resilience
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an on-premises Active Directory Domain Services (AD DS) forest in a single datacenter. The users are synchronized to Microsoft Entra ID.

    You need to recommend an authentication method for the synchronized users. The solution must meet the following requirements:

    - Users must be able to sign in to Microsoft 365 when the datacenter is unavailable, without any administrative action.
    - The on-premises infrastructure must be minimized.

    What should you recommend?
  fr: |
    Contoso dispose d'une forêt Active Directory Domain Services (AD DS) locale dans un seul centre de données. Les utilisateurs sont synchronisés vers Microsoft Entra ID.

    Vous devez recommander une méthode d'authentification pour les utilisateurs synchronisés. La solution doit répondre aux exigences suivantes :

    - Les utilisateurs doivent pouvoir se connecter à Microsoft 365 quand le centre de données est indisponible, sans aucune action d'administration.
    - L'infrastructure locale doit être réduite au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "Pass-through authentication with one agent"
        fr: "L'authentification directe avec un agent"
    - id: b
      text:
        en: "Federation with Active Directory Federation Services (AD FS)"
        fr: "La fédération avec les services de fédération Active Directory (AD FS)"
    - id: c
      text:
        en: "Password hash synchronization"
        fr: "La synchronisation de hachage du mot de passe"
    - id: d
      text:
        en: "Pass-through authentication with three agents in the datacenter"
        fr: "L'authentification directe avec trois agents dans le centre de données"
answer: { optionId: c }
explanation:
  correct:
    en: |
      With password hash synchronization, Microsoft Entra ID validates the password itself against the synchronized hash, so sign-in doesn't depend on any on-premises component. It also needs no server beyond the synchronization tool.
    fr: |
      Avec la synchronisation de hachage du mot de passe, Microsoft Entra ID valide lui-même le mot de passe par rapport au hachage synchronisé : la connexion ne dépend d'aucun composant local. Elle ne demande en outre aucun serveur au-delà de l'outil de synchronisation.
  options:
    a:
      en: "Pass-through authentication validates passwords against the on-premises domain controllers, so sign-in fails when the datacenter is unavailable."
      fr: "L'authentification directe valide les mots de passe auprès des contrôleurs de domaine locaux : la connexion échoue quand le centre de données est indisponible."
    b:
      en: "Federation validates sign-ins on-premises and requires AD FS and Web Application Proxy servers, the heaviest infrastructure of the three methods."
      fr: "La fédération valide les connexions en local et exige des serveurs AD FS et proxy d'application web, l'infrastructure la plus lourde des trois méthodes."
    d:
      en: "Three agents protect against the failure of one server, but all of them, and the domain controllers they call, are lost with the datacenter."
      fr: "Trois agents protègent contre la panne d'un serveur, mais tous, ainsi que les contrôleurs de domaine qu'ils appellent, sont perdus avec le centre de données."
references:
  - title: Choose the right authentication method for your Microsoft Entra hybrid identity solution
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn
