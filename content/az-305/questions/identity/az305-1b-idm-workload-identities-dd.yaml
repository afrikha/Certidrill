id: az305-1b-idm-workload-identities-dd
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation designs the identities of three workloads that call Azure Resource Manager and Azure Storage. No secret and no certificate may be stored where the platform makes it avoidable.

    | Workload | Where it runs |
    | --- | --- |
    | Deploy | A GitHub Actions workflow on GitHub-hosted runners |
    | Resize | An Azure Functions app |
    | Export | A scheduled job on a supplier's server, which has no OpenID Connect identity provider and can't be connected to Azure Arc |

    Which identity should you recommend for each workload? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation conçoit les identités de trois charges de travail qui appellent Azure Resource Manager et Stockage Azure. Aucun secret ni aucun certificat ne doit être stocké lorsque la plateforme permet de l'éviter.

    | Charge de travail | Où elle s'exécute |
    | --- | --- |
    | Deploy | Un workflow GitHub Actions sur des exécuteurs hébergés par GitHub |
    | Resize | Une application Azure Functions |
    | Export | Une tâche planifiée sur le serveur d'un fournisseur, qui n'a pas de fournisseur d'identité OpenID Connect et ne peut pas être connecté à Azure Arc |

    Quelle identité devez-vous recommander pour chaque charge de travail ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Deploy: [[w1]]

      Resize: [[w2]]

      Export: [[w3]]
    fr: |
      Deploy : [[w1]]

      Resize : [[w2]]

      Export : [[w3]]
  slots:
    - id: w1
      options:
        - { id: mi, text: { en: "A system-assigned managed identity", fr: "Une identité managée affectée par le système" } }
        - { id: fed, text: { en: "Workload identity federation", fr: "La fédération des identités de charge de travail" } }
        - { id: cert, text: { en: "An app registration with a certificate", fr: "Une inscription d'application avec un certificat" } }
        - { id: user, text: { en: "A user account with a password", fr: "Un compte d'utilisateur avec un mot de passe" } }
    - id: w2
      options:
        - { id: mi, text: { en: "A system-assigned managed identity", fr: "Une identité managée affectée par le système" } }
        - { id: fed, text: { en: "Workload identity federation", fr: "La fédération des identités de charge de travail" } }
        - { id: cert, text: { en: "An app registration with a certificate", fr: "Une inscription d'application avec un certificat" } }
        - { id: user, text: { en: "A user account with a password", fr: "Un compte d'utilisateur avec un mot de passe" } }
    - id: w3
      options:
        - { id: mi, text: { en: "A system-assigned managed identity", fr: "Une identité managée affectée par le système" } }
        - { id: fed, text: { en: "Workload identity federation", fr: "La fédération des identités de charge de travail" } }
        - { id: cert, text: { en: "An app registration with a certificate", fr: "Une inscription d'application avec un certificat" } }
        - { id: user, text: { en: "A user account with a password", fr: "Un compte d'utilisateur avec un mot de passe" } }
answer:
  values: { w1: fed, w2: mi, w3: cert }
explanation:
  correct:
    en: "GitHub issues its own tokens: a federated identity credential on an app registration or on a user-assigned managed identity lets Microsoft Entra ID trust them, so the workflow stores no secret. A function app runs on an Azure resource and uses a managed identity, whose credentials Azure manages. The supplier's server has neither a managed identity nor an external token to federate, so it needs an app registration, with a certificate rather than a password."
    fr: "GitHub émet ses propres jetons : une information d'identification d'identité fédérée sur une inscription d'application ou sur une identité managée affectée par l'utilisateur permet à Microsoft Entra ID de les approuver, et le workflow ne stocke aucun secret. Une application de fonction s'exécute sur une ressource Azure et utilise une identité managée, dont Azure gère les informations d'identification. Le serveur du fournisseur n'a ni identité managée ni jeton externe à fédérer : il lui faut une inscription d'application, avec un certificat plutôt qu'un mot de passe."
  options:
    mi:
      en: "A system-assigned managed identity exists only on an Azure resource (or on an Arc-enabled server); GitHub-hosted runners and the supplier's server have none."
      fr: "Une identité managée affectée par le système n'existe que sur une ressource Azure (ou sur un serveur avec Azure Arc) ; les exécuteurs hébergés par GitHub et le serveur du fournisseur n'en ont pas."
    user:
      en: "A user account with a password is a stored secret tied to a person-type identity; it is never the recommended identity for a workload."
      fr: "Un compte d'utilisateur avec un mot de passe est un secret stocké, lié à une identité de type personne ; ce n'est jamais l'identité recommandée pour une charge de travail."
references:
  - title: Workload identity federation concepts
    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation
  - title: What is managed identities for Azure resources?
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
