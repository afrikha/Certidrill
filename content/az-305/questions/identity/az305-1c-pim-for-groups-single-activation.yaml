id: az305-1c-pim-for-groups-single-activation
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The incident response engineers of Woodgrove Bank need the following roles when they are on call:

    - The Security Administrator role in Microsoft Entra ID
    - The Contributor role on three Azure subscriptions
    - The Key Vault Secrets Officer role on a key vault

    You need to recommend a solution that meets the following requirements:

    - An engineer must obtain all the roles through a single activation request that is valid for up to eight hours and is approved by the security manager.
    - No engineer must have standing access to any of the roles.
    - When a role is added to the on-call duties later, the assignments of the individual engineers must not change.

    What should you recommend?
  fr: |
    Les ingénieurs de réponse aux incidents de Woodgrove Bank ont besoin des rôles suivants lorsqu'ils sont d'astreinte :

    - Le rôle Security Administrator dans Microsoft Entra ID
    - Le rôle Contributor sur trois abonnements Azure
    - Le rôle Key Vault Secrets Officer sur un coffre de clés

    Vous devez recommander une solution qui respecte les exigences suivantes :

    - Un ingénieur doit obtenir tous les rôles par une seule demande d'activation, valable huit heures au maximum et approuvée par le responsable de la sécurité.
    - Aucun ingénieur ne doit avoir d'accès permanent à l'un de ces rôles.
    - Lorsqu'un rôle sera ajouté plus tard aux tâches d'astreinte, les attributions de chaque ingénieur ne doivent pas changer.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Assign the roles to a role-assignable group, and make the engineers eligible members of the group in PIM for Groups.", fr: "Attribuer les rôles à un groupe assignable à un rôle, et rendre les ingénieurs membres éligibles du groupe dans PIM pour les groupes." }
    - id: b
      text: { en: "Make each engineer eligible for each role in PIM, and require approval in the settings of each role.", fr: "Rendre chaque ingénieur éligible à chaque rôle dans PIM, et exiger une approbation dans les paramètres de chaque rôle." }
    - id: c
      text: { en: "Create a custom role that combines the permissions of the roles, and make each engineer eligible for it in PIM.", fr: "Créer un rôle personnalisé qui combine les autorisations des rôles, et rendre chaque ingénieur éligible à ce rôle dans PIM." }
    - id: d
      text: { en: "Assign the roles to a security group of the engineers, and require multifactor authentication with Conditional Access.", fr: "Attribuer les rôles à un groupe de sécurité des ingénieurs, et exiger l'authentification multifacteur avec l'accès conditionnel." }
answer: { optionId: a }
explanation:
  correct:
    en: "With PIM for Groups, membership of a group becomes just-in-time. The roles are assigned once to the group, which must be role-assignable to hold a Microsoft Entra role, and each engineer is an eligible member. One activation of the membership, approved and limited in time, gives all the roles, and a role added to the group later needs no change for the engineers."
    fr: "Avec PIM pour les groupes, l'appartenance à un groupe devient juste-à-temps. Les rôles sont attribués une fois au groupe, qui doit être assignable à un rôle pour porter un rôle Microsoft Entra, et chaque ingénieur en est membre éligible. Une seule activation de l'appartenance, approuvée et limitée dans le temps, donne tous les rôles, et un rôle ajouté plus tard au groupe n'exige aucun changement pour les ingénieurs."
  options:
    b:
      en: "Each role must then be activated separately, so an engineer submits five requests, and a new role means a new eligible assignment for every engineer."
      fr: "Chaque rôle doit alors être activé séparément : un ingénieur soumet cinq demandes, et un nouveau rôle implique une nouvelle attribution éligible pour chaque ingénieur."
    c:
      en: "Microsoft Entra roles and Azure roles are two separate systems. One custom role can't contain the permissions of both, and Azure roles at different scopes still need separate activations."
      fr: "Les rôles Microsoft Entra et les rôles Azure forment deux systèmes distincts. Un rôle personnalisé ne peut pas contenir les autorisations des deux, et des rôles Azure à des étendues différentes exigent toujours des activations distinctes."
    d:
      en: "Permanent members of the group hold the roles at all times. Multifactor authentication strengthens sign-in but doesn't remove standing access."
      fr: "Les membres permanents du groupe détiennent les rôles en permanence. L'authentification multifacteur renforce la connexion, mais ne supprime pas l'accès permanent."
references:
  - title: Privileged Identity Management (PIM) for Groups
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/concept-pim-for-groups
