id: az305-cs2a-legacy-directory
objective: "1.2.2"
type: single
caseStudy: az305-cs2a-lamna-healthcare
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend an identity solution for the ImageVault virtual machines after their migration to Switzerland North. The solution must meet the directory requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution d'identité pour les machines virtuelles d'ImageVault après leur migration vers Switzerland North. La solution doit respecter les exigences relatives à l'annuaire.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Domain controllers of the existing forest on Azure virtual machines in Switzerland North", fr: "Des contrôleurs de domaine de la forêt existante sur des machines virtuelles Azure dans Switzerland North" } }
    - { id: b, text: { en: "A Microsoft Entra Domain Services managed domain in Switzerland North", fr: "Un domaine managé Microsoft Entra Domain Services dans Switzerland North" } }
    - { id: c, text: { en: "The domain controllers of the Lausanne datacenter, reached through a site-to-site VPN", fr: "Les contrôleurs de domaine du centre de données de Lausanne, atteints par un VPN site à site" } }
    - { id: d, text: { en: "Microsoft Entra join of the ImageVault virtual machines", fr: "La jonction à Microsoft Entra des machines virtuelles d'ImageVault" } }
answer: { optionId: b }
explanation:
  correct:
    en: Microsoft Entra Domain Services provides domain join, Group Policy, LDAP and Kerberos or NTLM authentication from a managed domain, with no domain controller to deploy, manage or patch. The managed domain is synchronized one way from Microsoft Entra ID, which receives the users and their password hashes from the on-premises forest, so users keep their names and passwords and the application does not depend on the on-premises domain controllers.
    fr: Microsoft Entra Domain Services fournit la jonction de domaine, les stratégies de groupe, LDAP et l'authentification Kerberos ou NTLM à partir d'un domaine managé, sans contrôleur de domaine à déployer, à gérer ou à corriger. Le domaine managé est synchronisé à sens unique depuis Microsoft Entra ID, qui reçoit de la forêt locale les utilisateurs et leurs hachages de mot de passe ; les utilisateurs conservent donc leurs noms et leurs mots de passe, et l'application ne dépend pas des contrôleurs de domaine locaux.
  options:
    a: { en: "Domain controllers on Azure virtual machines meet the technical needs, but Lamna Healthcare would deploy, manage and patch them.", fr: "Des contrôleurs de domaine sur des machines virtuelles Azure répondent aux besoins techniques, mais Lamna Healthcare devrait les déployer, les gérer et les corriger." }
    c: { en: "ImageVault would stop authenticating users whenever the connection to the on-premises domain controllers is down.", fr: "ImageVault cesserait d'authentifier les utilisateurs dès que la connexion vers les contrôleurs de domaine locaux serait interrompue." }
    d: { en: "A Microsoft Entra joined machine is not a member of a domain: it gets neither Group Policy nor an LDAP directory for the application.", fr: "Une machine jointe à Microsoft Entra n'est pas membre d'un domaine : elle n'obtient ni stratégies de groupe ni annuaire LDAP pour l'application." }
references:
  - title: What is Microsoft Entra Domain Services?
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/overview
