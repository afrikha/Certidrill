id: az305-1a-route-ws-transform-resource-logs
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has 80 storage accounts. Diagnostic settings send the blob resource logs of the storage accounts to a Log Analytics workspace named **WS1**.

    You need to recommend a solution that meets the following requirements:

    - The column that contains the IP address of the callers must never be stored in WS1.
    - The other columns must remain available to the existing alert rules.
    - Diagnostic settings must remain the mechanism that routes the logs.
    - Administrative effort must be minimized.

    What should you recommend?
  fr: |
    Tailspin Toys dispose de 80 comptes de stockage. Des paramètres de diagnostic envoient les journaux de ressources des objets blob des comptes de stockage vers un espace de travail Log Analytics nommé **WS1**.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - La colonne qui contient l'adresse IP des appelants ne doit jamais être stockée dans WS1.
    - Les autres colonnes doivent rester disponibles pour les règles d'alerte existantes.
    - Les paramètres de diagnostic doivent rester le mécanisme d'acheminement des journaux.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "Select fewer log categories in each diagnostic setting."
        fr: "Sélectionner moins de catégories de journaux dans chaque paramètre de diagnostic."
    - id: b
      text:
        en: "Create a workspace transformation DCR for WS1."
        fr: "Créer une DCR de transformation de l'espace de travail pour WS1."
    - id: c
      text:
        en: "Configure table-level access on the table of WS1."
        fr: "Configurer l'accès au niveau des tables sur la table de WS1."
    - id: d
      text:
        en: "Create a data export rule for the table of WS1."
        fr: "Créer une règle d'exportation de données pour la table de WS1."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Resource logs sent by diagnostic settings don't pass through a data collection rule of their own, so the place to transform them is the workspace transformation DCR. A workspace has one such DCR; it holds a transformation per table, and here the transformation removes the column before the data is written to WS1. A single object covers the 80 storage accounts.
    fr: |
      Les journaux de ressources envoyés par les paramètres de diagnostic ne passent pas par une règle de collecte de données qui leur soit propre : l'endroit où les transformer est la DCR de transformation de l'espace de travail. Un espace de travail en possède une seule ; elle contient une transformation par table, et ici la transformation retire la colonne avant l'écriture des données dans WS1. Un seul objet couvre les 80 comptes de stockage.
  options:
    a:
      en: "A diagnostic setting selects whole categories of logs; it can't remove one column from the records of a category."
      fr: "Un paramètre de diagnostic sélectionne des catégories entières de journaux ; il ne peut pas retirer une colonne des enregistrements d'une catégorie."
    c:
      en: "Table-level access limits who can read the table, but the IP addresses would still be stored in WS1."
      fr: "L'accès au niveau des tables limite qui peut lire la table, mais les adresses IP seraient toujours stockées dans WS1."
    d:
      en: "A data export rule copies the records as they are to another destination; it has no filter and doesn't change what WS1 stores."
      fr: "Une règle d'exportation de données copie les enregistrements tels quels vers une autre destination ; elle n'a pas de filtre et ne change pas ce que WS1 stocke."
references:
  - title: Transformations in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/data-collection/data-collection-transformations
  - title: Data collection rules (DCRs) in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/data-collection/data-collection-rule-overview
