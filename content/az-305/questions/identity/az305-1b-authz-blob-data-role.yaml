id: az305-1b-authz-blob-data-role
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has a storage account named **stlitware01** that contains several blob containers. Shared Key authorization is disabled on the account. An App Service web app named **App1** has a system-assigned managed identity.

    App1 must upload blobs to a container named **invoices** and read them back. App1 must have no access to the other containers.

    You need to recommend a role assignment for the managed identity of App1. The principle of least privilege must be applied.

    What should you recommend?
  fr: |
    Litware, Inc. dispose d'un compte de stockage nommé **stlitware01** qui contient plusieurs conteneurs d'objets blob. L'autorisation avec clé partagée est désactivée sur le compte. Une application web App Service nommée **App1** possède une identité managée affectée par le système.

    App1 doit charger des blobs dans un conteneur nommé **invoices** et les relire. App1 ne doit avoir aucun accès aux autres conteneurs.

    Vous devez recommander une attribution de rôle pour l'identité managée d'App1. Le principe du moindre privilège doit être appliqué.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Storage Blob Data Contributor on the invoices container", fr: "Storage Blob Data Contributor sur le conteneur invoices" }
    - id: b
      text: { en: "Storage Blob Data Owner on the invoices container", fr: "Storage Blob Data Owner sur le conteneur invoices" }
    - id: c
      text: { en: "Storage Blob Data Contributor on stlitware01", fr: "Storage Blob Data Contributor sur stlitware01" }
    - id: d
      text: { en: "Storage Account Contributor on stlitware01", fr: "Storage Account Contributor sur stlitware01" }
answer: { optionId: a }
explanation:
  correct:
    en: "Storage Blob Data Contributor is the data role that grants read, write and delete on blobs with Microsoft Entra authorization. A container is the narrowest scope at which it can be assigned, so the identity reaches the invoices container only."
    fr: "Storage Blob Data Contributor est le rôle de données qui accorde la lecture, l'écriture et la suppression des blobs avec l'autorisation Microsoft Entra. Un conteneur est l'étendue la plus étroite à laquelle il peut être attribué : l'identité n'atteint donc que le conteneur invoices."
  options:
    b:
      en: "Storage Blob Data Owner also allows setting ownership and managing POSIX access control, which App1 doesn't need."
      fr: "Storage Blob Data Owner permet aussi de définir la propriété et de gérer le contrôle d'accès POSIX, dont App1 n'a pas besoin."
    c:
      en: "At the storage account scope, the role is inherited by all the containers, not only invoices."
      fr: "À l'étendue du compte de stockage, le rôle est hérité par tous les conteneurs, et pas seulement par invoices."
    d:
      en: "Storage Account Contributor manages the account but gives no access to blob data through Microsoft Entra ID; it works through the account keys, and Shared Key authorization is disabled."
      fr: "Storage Account Contributor gère le compte, mais ne donne aucun accès aux données de blob par Microsoft Entra ID ; il passe par les clés du compte, et l'autorisation avec clé partagée est désactivée."
references:
  - title: Authorize access to blobs by using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-access-azure-active-directory
