id: az305-1c-rg-location-metadata
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank plans to deploy virtual machines and storage accounts to the Germany West Central region. The subscription that will host them is in a management group named **MG-Regulated**.

    A regulation requires that the data of the workload and the metadata that Azure Resource Manager stores about its resources both stay in Germany.

    You need to recommend what to control in the design so that the metadata requirement is met.

    What should you include in the recommendation?
  fr: |
    Woodgrove Bank prévoit de déployer des machines virtuelles et des comptes de stockage dans la région Germany West Central. L'abonnement qui les hébergera se trouve dans un groupe d'administration nommé **MG-Regulated**.

    Une réglementation exige que les données de la charge de travail et les métadonnées qu'Azure Resource Manager stocke sur ses ressources restent toutes en Allemagne.

    Vous devez recommander ce qu'il faut maîtriser dans la conception pour que l'exigence sur les métadonnées soit respectée.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - id: a
      text: { en: "The location of the resource groups", fr: "L'emplacement des groupes de ressources" }
    - id: b
      text: { en: "The country or region of the Microsoft Entra tenant", fr: "Le pays ou la région du locataire Microsoft Entra" }
    - id: c
      text: { en: "The management group of the subscription", fr: "Le groupe d'administration de l'abonnement" }
    - id: d
      text: { en: "The billing address of the subscription", fr: "L'adresse de facturation de l'abonnement" }
answer: { optionId: a }
explanation:
  correct:
    en: "A resource group stores metadata about the resources that it contains, and the location chosen for the resource group is where this metadata is stored. Resources can be in a region other than their group, so the design must place the resource groups themselves in Germany West Central."
    fr: "Un groupe de ressources stocke des métadonnées sur les ressources qu'il contient, et l'emplacement choisi pour le groupe de ressources est celui où ces métadonnées sont stockées. Les ressources peuvent se trouver dans une autre région que leur groupe : la conception doit donc placer les groupes de ressources eux-mêmes dans Germany West Central."
  options:
    b:
      en: "The country or region of the tenant determines where the directory data of Microsoft Entra ID is stored, not the metadata of Azure resources."
      fr: "Le pays ou la région du locataire détermine l'endroit où sont stockées les données d'annuaire de Microsoft Entra ID, pas les métadonnées des ressources Azure."
    c:
      en: "A management group is a scope for policies and roles. It has no region and stores no resource metadata."
      fr: "Un groupe d'administration est une étendue pour les stratégies et les rôles. Il n'a pas de région et ne stocke aucune métadonnée de ressource."
    d:
      en: "The billing address is used for invoicing and taxes. It has no effect on where Azure Resource Manager stores metadata."
      fr: "L'adresse de facturation sert à la facturation et aux taxes. Elle n'a aucun effet sur l'endroit où Azure Resource Manager stocke les métadonnées."
references:
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
