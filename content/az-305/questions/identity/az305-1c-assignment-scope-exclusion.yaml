id: az305-1c-assignment-scope-exclusion
objective: "1.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a management group named **MG-Online** that contains 14 subscriptions. More subscriptions will be added to MG-Online. The parent of MG-Online is a management group named **MG-LandingZones**, which also contains a management group named **MG-Corp**.

    An initiative about TLS and HTTPS settings must apply to all the subscriptions of MG-Online, and only to them. A resource group named **rg-legacy-kiosk**, in one of these subscriptions, hosts an application that will never be upgraded. The solution must meet the following requirements:

    - The resources of rg-legacy-kiosk must not be evaluated against the initiative, and they must not appear in its compliance results. No end date is planned.
    - Administrative effort must be minimized.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un groupe d'administration nommé **MG-Online** qui contient 14 abonnements. D'autres abonnements seront ajoutés à MG-Online. Le parent de MG-Online est un groupe d'administration nommé **MG-LandingZones**, qui contient aussi un groupe d'administration nommé **MG-Corp**.

    Une initiative sur les paramètres TLS et HTTPS doit s'appliquer à tous les abonnements de MG-Online, et seulement à eux. Un groupe de ressources nommé **rg-legacy-kiosk**, dans l'un de ces abonnements, héberge une application qui ne sera jamais mise à niveau. La solution doit respecter les exigences suivantes :

    - Les ressources de rg-legacy-kiosk ne doivent pas être évaluées par rapport à l'initiative, et elles ne doivent pas apparaître dans ses résultats de conformité. Aucune date de fin n'est prévue.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Scope of the initiative assignment: [[scope]]

      For rg-legacy-kiosk: [[legacy]]
    fr: |
      Étendue de l'attribution de l'initiative : [[scope]]

      Pour rg-legacy-kiosk : [[legacy]]
  slots:
    - id: scope
      options:
        - { id: subs, text: { en: "Each of the 14 subscriptions", fr: "Chacun des 14 abonnements" } }
        - { id: lz, text: MG-LandingZones }
        - { id: online, text: MG-Online }
    - id: legacy
      options:
        - { id: lock, text: { en: "A `ReadOnly` lock on the resource group", fr: "Un verrou `ReadOnly` sur le groupe de ressources" } }
        - { id: exclusion, text: { en: "An excluded scope on the assignment", fr: "Une étendue exclue sur l'attribution" } }
        - { id: exemption, text: { en: "A policy exemption with the Mitigated category", fr: "Une exemption de stratégie de catégorie Mitigated" } }
        - { id: tag, text: { en: "A tag named `policy-exempt` on the resource group", fr: "Une étiquette nommée `policy-exempt` sur le groupe de ressources" } }
answer:
  values: { scope: online, legacy: exclusion }
explanation:
  correct:
    en: "One assignment at MG-Online reaches the 14 subscriptions and those that will join them, without touching MG-Corp. An excluded scope (`notScopes`) on the assignment removes rg-legacy-kiosk from the evaluation, so its resources don't appear in the compliance results of the initiative, and the exclusion has no end date."
    fr: "Une seule attribution sur MG-Online atteint les 14 abonnements et ceux qui les rejoindront, sans toucher MG-Corp. Une étendue exclue (`notScopes`) sur l'attribution retire rg-legacy-kiosk de l'évaluation : ses ressources n'apparaissent donc pas dans les résultats de conformité de l'initiative, et l'exclusion n'a pas de date de fin."
  options:
    subs:
      en: "Fourteen assignments must be maintained, and each new subscription needs one more."
      fr: "Il faut maintenir quatorze attributions, et chaque nouvel abonnement en exige une de plus."
    lz:
      en: "An assignment at MG-LandingZones is also inherited by the subscriptions of MG-Corp."
      fr: "Une attribution sur MG-LandingZones est aussi héritée par les abonnements de MG-Corp."
    exemption:
      en: "Exempt resources stay in the compliance results of the assignment, with the Exempt state. An exemption suits a documented exception, not a scope to leave out entirely."
      fr: "Les ressources exemptées restent dans les résultats de conformité de l'attribution, avec l'état Exempt. Une exemption convient à une exception documentée, pas à une étendue à écarter entièrement."
    lock:
      en: "A lock blocks changes to the resources. It has no effect on policy evaluation."
      fr: "Un verrou bloque les modifications des ressources. Il n'a aucun effet sur l'évaluation des stratégies."
    tag:
      en: "A tag has no effect on an assignment by itself. Every definition of the initiative would have to be rewritten to test it."
      fr: "Une étiquette n'a par elle-même aucun effet sur une attribution. Il faudrait réécrire chaque définition de l'initiative pour qu'elle la teste."
references:
  - title: Azure Policy assignment structure
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/assignment-structure
  - title: Azure Policy exemption structure
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/exemption-structure
