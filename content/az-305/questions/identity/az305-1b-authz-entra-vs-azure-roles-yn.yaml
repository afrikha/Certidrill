id: az305-1b-authz-entra-vs-azure-roles-yn
objective: "1.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft Entra tenant and a subscription named **Sub1**. The only role of a user named **Admin1** is Global Administrator in Microsoft Entra ID. The only role of a user named **User1** is Owner on Sub1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un locataire Microsoft Entra et d'un abonnement nommé **Sub1**. Le seul rôle d'un utilisateur nommé **Admin1** est Global Administrator dans Microsoft Entra ID. Le seul rôle d'un utilisateur nommé **User1** est Owner sur Sub1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: With the current role assignments, Admin1 can delete the resource groups of Sub1.
        fr: Avec les attributions de rôles actuelles, Admin1 peut supprimer les groupes de ressources de Sub1.
    - id: s2
      text:
        en: Admin1 can elevate access to obtain the User Access Administrator role on all the subscriptions of the tenant.
        fr: Admin1 peut élever son accès pour obtenir le rôle User Access Administrator sur tous les abonnements du locataire.
    - id: s3
      text:
        en: User1 can reset the passwords of the users of the tenant.
        fr: User1 peut réinitialiser les mots de passe des utilisateurs du locataire.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Microsoft Entra roles control directory resources, and Azure roles control Azure resources: by default, a Global Administrator has no access to Azure resources. A Global Administrator can turn on access management for Azure resources, which grants the User Access Administrator role on all the subscriptions of the tenant. Owner is an Azure role: it gives full control of Sub1 and no permission on the users of the directory."
    fr: "Les rôles Microsoft Entra contrôlent les ressources de l'annuaire, et les rôles Azure contrôlent les ressources Azure : par défaut, un Global Administrator n'a aucun accès aux ressources Azure. Un Global Administrator peut activer la gestion de l'accès pour les ressources Azure, ce qui lui accorde le rôle User Access Administrator sur tous les abonnements du locataire. Owner est un rôle Azure : il donne le contrôle total de Sub1 et aucune autorisation sur les utilisateurs de l'annuaire."
references:
  - title: Azure roles, Microsoft Entra roles, and classic subscription administrator roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles
