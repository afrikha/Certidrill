id: az305-1a-auth-migrate-federation-dd
objective: "1.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an on-premises Active Directory Domain Services (AD DS) forest. Its domain is federated with Microsoft Entra ID through Active Directory Federation Services (AD FS). Fabrikam plans to decommission AD FS.

    You need to recommend a migration design that meets the following requirements:

    - After the migration, users must be able to sign in to cloud applications even when the on-premises datacenter is unavailable.
    - Before the domain is converted, a pilot group of 100 users must use the new sign-in method while the other users continue to use AD FS.
    - After AD FS is removed, the employees who sign in with smart cards must continue to authenticate with their certificates.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une forêt Active Directory Domain Services (AD DS) locale. Son domaine est fédéré avec Microsoft Entra ID par les services de fédération Active Directory (AD FS). Fabrikam prévoit de mettre AD FS hors service.

    Vous devez recommander une conception de migration qui répond aux exigences suivantes :

    - Après la migration, les utilisateurs doivent pouvoir se connecter aux applications cloud même quand le centre de données local est indisponible.
    - Avant la conversion du domaine, un groupe pilote de 100 utilisateurs doit utiliser la nouvelle méthode de connexion pendant que les autres utilisateurs continuent d'utiliser AD FS.
    - Après le retrait d'AD FS, les employés qui se connectent avec des cartes à puce doivent continuer à s'authentifier avec leurs certificats.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Sign-in method after the migration: [[method]]

      Feature used for the pilot group: [[pilot]]

      Authentication of the smart card users after AD FS is removed: [[cert]]
    fr: |
      Méthode de connexion après la migration : [[method]]

      Fonctionnalité utilisée pour le groupe pilote : [[pilot]]

      Authentification des utilisateurs de cartes à puce après le retrait d'AD FS : [[cert]]
  slots:
    - id: method
      options:
        - { id: pta, text: { en: "Pass-through authentication", fr: "Authentification directe" } }
        - { id: phs, text: { en: "Password hash synchronization", fr: "Synchronisation de hachage du mot de passe" } }
        - { id: sso, text: { en: "Seamless single sign-on", fr: "Authentification unique transparente (Seamless SSO)" } }
    - id: pilot
      options:
        - { id: reportonly, text: { en: "Report-only mode of Conditional Access", fr: "Mode rapport seul de l'accès conditionnel" } }
        - { id: tap, text: { en: "Temporary Access Pass", fr: "Passe d'accès temporaire" } }
        - { id: staged, text: { en: "Staged Rollout", fr: "Déploiement par étapes (Staged Rollout)" } }
    - id: cert
      options:
        - { id: cba, text: { en: "Microsoft Entra certificate-based authentication", fr: "Authentification basée sur un certificat Microsoft Entra" } }
        - { id: whfb, text: { en: "Windows Hello for Business", fr: "Windows Hello Entreprise" } }
        - { id: sspr, text: { en: "Self-service password reset", fr: "Réinitialisation de mot de passe en libre-service" } }
answer:
  values: { method: phs, pilot: staged, cert: cba }
explanation:
  correct:
    en: |
      Password hash synchronization is the only hybrid sign-in method that doesn't depend on on-premises components at sign-in. Staged Rollout moves selected groups of users of a federated domain to cloud authentication while the domain, and all the other users, stay federated; the domain is converted afterward. Microsoft Entra certificate-based authentication validates X.509 certificates directly against Microsoft Entra ID, which removes the need for AD FS for certificate sign-ins.
    fr: |
      La synchronisation de hachage du mot de passe est la seule méthode de connexion hybride qui ne dépend pas de composants locaux au moment de la connexion. Le déploiement par étapes fait passer des groupes d'utilisateurs choisis d'un domaine fédéré à l'authentification cloud pendant que le domaine, et tous les autres utilisateurs, restent fédérés ; le domaine est converti ensuite. L'authentification basée sur un certificat Microsoft Entra valide les certificats X.509 directement auprès de Microsoft Entra ID, ce qui supprime le besoin d'AD FS pour les connexions par certificat.
  options:
    pta:
      en: "Pass-through authentication validates passwords on the domain controllers, so sign-in fails when the datacenter is unavailable."
      fr: "L'authentification directe valide les mots de passe sur les contrôleurs de domaine : la connexion échoue quand le centre de données est indisponible."
    reportonly:
      en: "Report-only mode evaluates Conditional Access policies without enforcing them; it doesn't change how a group of users authenticates."
      fr: "Le mode rapport seul évalue les stratégies d'accès conditionnel sans les appliquer ; il ne change pas la manière dont un groupe d'utilisateurs s'authentifie."
    whfb:
      en: "Windows Hello for Business is a different credential, bound to a Windows device; the requirement is to keep signing in with the smart card certificates."
      fr: "Windows Hello Entreprise est une autre information d'identification, liée à un appareil Windows ; l'exigence est de continuer à se connecter avec les certificats des cartes à puce."
references:
  - title: Migrate to cloud authentication using Staged Rollout
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/how-to-connect-staged-rollout
  - title: What is Microsoft Entra certificate-based authentication?
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-certificate-based-authentication
