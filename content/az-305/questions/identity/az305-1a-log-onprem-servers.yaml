id: az305-1a-log-onprem-servers
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has 300 Azure virtual machines and 200 on-premises servers that run Windows Server.

    The Azure virtual machines use the Azure Monitor Agent and data collection rules to send Windows event logs and performance counters to a Log Analytics workspace named **WS1**.

    You need to recommend a solution to collect the same data from the on-premises servers in WS1. The solution must reuse the existing data collection rules and minimize development effort.

    What should you recommend?
  fr: |
    Northwind Traders dispose de 300 machines virtuelles Azure et de 200 serveurs locaux qui exécutent Windows Server.

    Les machines virtuelles Azure utilisent l'agent Azure Monitor et des règles de collecte de données pour envoyer les journaux d'événements Windows et les compteurs de performances vers un espace de travail Log Analytics nommé **WS1**.

    Vous devez recommander une solution pour collecter les mêmes données des serveurs locaux dans WS1. La solution doit réutiliser les règles de collecte de données existantes et réduire au minimum l'effort de développement.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "Create a diagnostic setting for each on-premises server."
        fr: "Créer un paramètre de diagnostic pour chaque serveur local."
    - id: b
      text:
        en: "Discover the on-premises servers by using an Azure Migrate appliance."
        fr: "Découvrir les serveurs locaux à l'aide d'une appliance Azure Migrate."
    - id: c
      text:
        en: "Connect the on-premises servers to Azure Arc, and then install the Azure Monitor Agent."
        fr: "Connecter les serveurs locaux à Azure Arc, puis installer l'agent Azure Monitor."
    - id: d
      text:
        en: "Send the data from a scheduled script that calls the Logs Ingestion API."
        fr: "Envoyer les données depuis un script planifié qui appelle l'API d'ingestion des journaux."
answer: { optionId: c }
explanation:
  correct:
    en: |
      A server outside Azure must first run the Connected Machine agent so that it is managed as an Azure Arc-enabled server. The Azure Monitor Agent can then be installed on it and associated with the same data collection rules as the Azure virtual machines, with no custom code.
    fr: |
      Un serveur situé hors d'Azure doit d'abord exécuter l'agent Connected Machine pour être géré comme un serveur avec Azure Arc. L'agent Azure Monitor peut ensuite y être installé et associé aux mêmes règles de collecte de données que les machines virtuelles Azure, sans code personnalisé.
  options:
    a:
      en: "Diagnostic settings route the platform logs and metrics of Azure resources; they don't collect events or counters from the operating system of a server."
      fr: "Les paramètres de diagnostic acheminent les journaux et les métriques de plateforme des ressources Azure ; ils ne collectent pas les événements ni les compteurs du système d'exploitation d'un serveur."
    b:
      en: "Azure Migrate discovers and assesses servers for a migration; it doesn't send their event logs and counters to WS1."
      fr: "Azure Migrate découvre et évalue des serveurs en vue d'une migration ; il n'envoie pas leurs journaux d'événements ni leurs compteurs vers WS1."
    d:
      en: "The Logs Ingestion API could deliver data to WS1, but it requires scripts to write and maintain and doesn't reuse the rules that drive the agent."
      fr: "L'API d'ingestion des journaux pourrait livrer des données à WS1, mais elle demande d'écrire et de maintenir des scripts et ne réutilise pas les règles qui pilotent l'agent."
references:
  - title: Enable VM monitoring in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vminsights-enable-overview
  - title: Azure Monitor Agent overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/agents/azure-monitor-agent-overview
