id: az305-1a-log-keyvault-secret-access
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure subscription that contains a key vault named **KV1**. No diagnostic setting is configured in the subscription.

    The security team needs to identify which identities read secrets from KV1. The team will investigate by running Kusto Query Language (KQL) queries.

    You need to recommend a logging solution.

    What should you include in the recommendation?
  fr: |
    Vous disposez d'un abonnement Azure qui contient un coffre de clés nommé **KV1**. Aucun paramètre de diagnostic n'est configuré dans l'abonnement.

    L'équipe de sécurité doit identifier les identités qui lisent des secrets dans KV1. Elle mènera ses investigations avec des requêtes KQL (Kusto Query Language).

    Vous devez recommander une solution de journalisation.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - id: a
      text:
        en: "A diagnostic setting on the subscription that sends the activity log to a Log Analytics workspace"
        fr: "Un paramètre de diagnostic sur l'abonnement qui envoie le journal d'activité vers un espace de travail Log Analytics"
    - id: b
      text:
        en: "A diagnostic setting on KV1 that sends the audit logs to a Log Analytics workspace"
        fr: "Un paramètre de diagnostic sur KV1 qui envoie les journaux d'audit vers un espace de travail Log Analytics"
    - id: c
      text:
        en: "A diagnostic setting in Microsoft Entra ID that sends the sign-in logs to a Log Analytics workspace"
        fr: "Un paramètre de diagnostic dans Microsoft Entra ID qui envoie les journaux de connexion vers un espace de travail Log Analytics"
    - id: d
      text:
        en: "A diagnostic setting on KV1 that sends the platform metrics to a Log Analytics workspace"
        fr: "Un paramètre de diagnostic sur KV1 qui envoie les métriques de plateforme vers un espace de travail Log Analytics"
answer: { optionId: b }
explanation:
  correct:
    en: |
      Reading a secret is a data plane operation, recorded in the resource logs of the key vault. Resource logs aren't collected until a diagnostic setting sends them to a destination, and a Log Analytics workspace is the destination that supports KQL queries.
    fr: |
      La lecture d'un secret est une opération du plan de données, enregistrée dans les journaux de ressources du coffre de clés. Les journaux de ressources ne sont pas collectés tant qu'un paramètre de diagnostic ne les envoie pas vers une destination, et l'espace de travail Log Analytics est la destination qui permet les requêtes KQL.
  options:
    a:
      en: "The activity log records control plane operations only, such as the creation of the vault or a change of its configuration, not the reading of a secret."
      fr: "Le journal d'activité n'enregistre que les opérations du plan de contrôle, comme la création du coffre ou une modification de sa configuration, pas la lecture d'un secret."
    c:
      en: "Sign-in logs show that an identity authenticated to Microsoft Entra ID, not which secrets it read in the vault."
      fr: "Les journaux de connexion montrent qu'une identité s'est authentifiée auprès de Microsoft Entra ID, pas les secrets qu'elle a lus dans le coffre."
    d:
      en: "Platform metrics are numeric values such as the number of requests; they don't identify the caller of each operation."
      fr: "Les métriques de plateforme sont des valeurs numériques, comme le nombre de requêtes ; elles n'identifient pas l'appelant de chaque opération."
references:
  - title: Diagnostic settings in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings
  - title: Activity log in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/activity-log
