id: az305-1a-route-policy-scale-order
objective: "1.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a management group named **Corp** that contains 60 subscriptions. The subscriptions contain 400 key vaults, and new key vaults are created every week.

    All the key vaults, existing and future, must send their audit logs to a central Log Analytics workspace. No workspace exists yet. The solution must minimize administrative effort.

    Which three actions should you recommend in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'un groupe d'administration nommé **Corp** qui contient 60 abonnements. Les abonnements contiennent 400 coffres de clés, et de nouveaux coffres de clés sont créés chaque semaine.

    Tous les coffres de clés, existants et futurs, doivent envoyer leurs journaux d'audit vers un espace de travail Log Analytics central. Aucun espace de travail n'existe encore. La solution doit réduire au minimum l'effort d'administration.

    Quelles sont les trois actions à recommander dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: mgdiag
      text:
        en: "Create a diagnostic setting on the Corp management group."
        fr: "Créer un paramètre de diagnostic sur le groupe d'administration Corp."
    - id: remed
      text:
        en: "Create a remediation task for the policy assignment."
        fr: "Créer une tâche de correction pour l'attribution de stratégie."
    - id: audit
      text:
        en: "Assign to Corp a policy that uses the audit effect on key vaults without a diagnostic setting."
        fr: "Attribuer à Corp une stratégie qui applique l'effet audit aux coffres de clés sans paramètre de diagnostic."
    - id: ws
      text:
        en: "Create the central Log Analytics workspace."
        fr: "Créer l'espace de travail Log Analytics central."
    - id: export
      text:
        en: "Create a data export rule in the central workspace."
        fr: "Créer une règle d'exportation de données dans l'espace de travail central."
    - id: dine
      text:
        en: "Assign to Corp a policy that uses the deployIfNotExists effect to create the diagnostic setting of key vaults."
        fr: "Attribuer à Corp une stratégie qui utilise l'effet deployIfNotExists pour créer le paramètre de diagnostic des coffres de clés."
answer:
  sequence: [ ws, dine, remed ]
explanation:
  correct:
    en: |
      The destination must exist before a diagnostic setting can point to it, so the workspace comes first. A policy with the deployIfNotExists effect, assigned at the management group, then creates the diagnostic setting on every key vault that is created in the 60 subscriptions. The policy acts on new resources only, so a remediation task is created last to deploy the setting to the 400 existing key vaults.
    fr: |
      La destination doit exister avant qu'un paramètre de diagnostic puisse la désigner : l'espace de travail vient donc en premier. Une stratégie dotée de l'effet deployIfNotExists, attribuée au groupe d'administration, crée ensuite le paramètre de diagnostic sur chaque coffre de clés créé dans les 60 abonnements. La stratégie n'agit que sur les nouvelles ressources : une tâche de correction est donc créée en dernier pour déployer le paramètre sur les 400 coffres de clés existants.
  options:
    mgdiag:
      en: "A diagnostic setting on a management group exports the activity log events of the management group, not the resource logs of the key vaults below it."
      fr: "Un paramètre de diagnostic sur un groupe d'administration exporte les événements du journal d'activité du groupe d'administration, pas les journaux de ressources des coffres de clés situés en dessous."
    audit:
      en: "The audit effect only reports the key vaults that aren't compliant; it doesn't create anything."
      fr: "L'effet audit signale seulement les coffres de clés non conformes ; il ne crée rien."
    export:
      en: "A data export rule sends data out of the workspace; it doesn't collect the logs of the key vaults."
      fr: "Une règle d'exportation de données fait sortir des données de l'espace de travail ; elle ne collecte pas les journaux des coffres de clés."
references:
  - title: Create diagnostic settings at scale by using custom Azure policies
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings-policy
  - title: Diagnostic settings in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings
