id: az305-1a-log-retention-audit
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has a Log Analytics workspace named **WS1**. Azure Firewall logs are collected in a table of WS1 that uses the Analytics plan.

    You need to recommend a retention configuration that meets the following requirements:

    - Analysts run interactive KQL queries and log search alert rules on the logs of the last 90 days.
    - The logs must be kept for seven years for audits.
    - A few times a year, auditors retrieve old records from WS1 by running search jobs.
    - Costs and administrative effort must be minimized.

    What should you recommend?
  fr: |
    Litware dispose d'un espace de travail Log Analytics nommé **WS1**. Les journaux du Pare-feu Azure sont collectés dans une table de WS1 qui utilise le plan Analytics.

    Vous devez recommander une configuration de rétention qui répond aux exigences suivantes :

    - Les analystes exécutent des requêtes KQL interactives et des règles d'alerte de recherche dans les journaux sur les journaux des 90 derniers jours.
    - Les journaux doivent être conservés sept ans pour les audits.
    - Quelques fois par an, les auditeurs récupèrent d'anciens enregistrements dans WS1 en exécutant des travaux de recherche.
    - Les coûts et l'effort d'administration doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "Set the analytics retention of the table to seven years."
        fr: "Définir la rétention analytique de la table sur sept ans."
    - id: b
      text:
        en: "Switch the table to the Auxiliary plan, and set its total retention to seven years."
        fr: "Passer la table au plan Auxiliary et définir sa rétention totale sur sept ans."
    - id: c
      text:
        en: "Keep 90 days of analytics retention, and add a data export rule to a storage account that uses the archive tier."
        fr: "Conserver 90 jours de rétention analytique et ajouter une règle d'exportation de données vers un compte de stockage qui utilise le niveau archive (Archive)."
    - id: d
      text:
        en: "Set the analytics retention of the table to 90 days and its total retention to seven years."
        fr: "Définir la rétention analytique de la table sur 90 jours et sa rétention totale sur sept ans."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Analytics retention keeps the data available for interactive queries and alert rules, and it only needs to cover 90 days. Total retention then keeps the data in low-cost long-term retention, up to 12 years, inside the same workspace, where search jobs retrieve old records. Nothing else has to be deployed or managed.
    fr: |
      La rétention analytique garde les données disponibles pour les requêtes interactives et les règles d'alerte, et il suffit qu'elle couvre 90 jours. La rétention totale conserve ensuite les données en rétention à long terme, à faible coût et jusqu'à 12 ans, dans le même espace de travail, où les travaux de recherche récupèrent les anciens enregistrements. Il n'y a rien d'autre à déployer ni à gérer.
  options:
    a:
      en: "Analytics retention can't exceed two years, and paying for interactive retention on data that is almost never read wouldn't minimize costs."
      fr: "La rétention analytique ne peut pas dépasser deux ans, et payer une rétention interactive pour des données presque jamais lues ne réduirait pas les coûts."
    b:
      en: "Tables in the Auxiliary plan don't support alert rules, so the analysts' requirement on the last 90 days wouldn't be met."
      fr: "Les tables du plan Auxiliary ne prennent pas en charge les règles d'alerte : l'exigence des analystes sur les 90 derniers jours ne serait pas satisfaite."
    c:
      en: "Exported records live in a storage account, where search jobs of WS1 can't reach them, and the export rule and the storage account add resources to manage."
      fr: "Les enregistrements exportés se trouvent dans un compte de stockage, hors de portée des travaux de recherche de WS1, et la règle d'exportation et le compte de stockage ajoutent des ressources à gérer."
references:
  - title: Manage data retention in a Log Analytics workspace
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/data-retention-configure
  - title: Run search jobs in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/search-jobs
