id: az305-1c-lifecycle-workflows-joiner-leaver
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders already provisions user accounts from its HR system to Microsoft Entra ID. The `employeeHireDate` and `employeeLeaveDateTime` attributes of each account are populated.

    You need to recommend a solution that meets the following requirements:

    - Seven days before the hire date, the manager of a new employee must receive a Temporary Access Pass for the employee.
    - On the hire date, the account must be enabled and added to the groups and teams of the department.
    - On the last day of work, the account must be disabled and removed from all groups.
    - The solution must not rely on custom code.

    What should you recommend?
  fr: |
    Northwind Traders provisionne déjà les comptes d'utilisateurs de son système RH vers Microsoft Entra ID. Les attributs `employeeHireDate` et `employeeLeaveDateTime` de chaque compte sont renseignés.

    Vous devez recommander une solution qui respecte les exigences suivantes :

    - Sept jours avant la date d'embauche, le responsable d'un nouvel employé doit recevoir un passe d'accès temporaire pour cet employé.
    - À la date d'embauche, le compte doit être activé et ajouté aux groupes et aux équipes du service.
    - Le dernier jour de travail, le compte doit être désactivé et retiré de tous les groupes.
    - La solution ne doit pas reposer sur du code personnalisé.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Automatic assignment policies of access packages in entitlement management", fr: "Des stratégies d'attribution automatique de packages d'accès dans la gestion des droits d'utilisation" }
    - id: b
      text: { en: "Dynamic membership groups with rules based on `employeeHireDate`", fr: "Des groupes à appartenance dynamique avec des règles fondées sur `employeeHireDate`" }
    - id: c
      text: { en: "Lifecycle workflows in Microsoft Entra ID Governance", fr: "Des workflows de cycle de vie dans Microsoft Entra ID Governance" }
    - id: d
      text: { en: "Azure Automation runbooks that call Microsoft Graph every day", fr: "Des runbooks Azure Automation qui appellent Microsoft Graph chaque jour" }
answer: { optionId: c }
explanation:
  correct:
    en: "Lifecycle workflows run built-in tasks for joiners, movers and leavers, triggered by time-based attributes such as `employeeHireDate` and `employeeLeaveDateTime` with an offset in days. The tasks include generating a Temporary Access Pass and sending it to the manager, enabling or disabling the account, and adding the user to groups and teams or removing the user from all groups."
    fr: "Les workflows de cycle de vie exécutent des tâches intégrées pour les personnes qui arrivent, changent de poste ou partent, déclenchées par des attributs temporels comme `employeeHireDate` et `employeeLeaveDateTime` avec un décalage en jours. Ces tâches comprennent la génération d'un passe d'accès temporaire envoyé au responsable, l'activation ou la désactivation du compte, ainsi que l'ajout de l'utilisateur à des groupes et à des équipes ou son retrait de tous les groupes."
  options:
    a:
      en: "Automatic assignment policies give or remove access packages according to user attributes. They don't generate a Temporary Access Pass and don't enable or disable accounts."
      fr: "Les stratégies d'attribution automatique accordent ou retirent des packages d'accès selon des attributs des utilisateurs. Elles ne génèrent pas de passe d'accès temporaire et n'activent ni ne désactivent les comptes."
    b:
      en: "Dynamic groups only compute group membership. They can't send a Temporary Access Pass or change the state of an account."
      fr: "Les groupes dynamiques ne font que calculer l'appartenance à des groupes. Ils ne peuvent ni envoyer un passe d'accès temporaire ni modifier l'état d'un compte."
    d:
      en: "Runbooks could perform the tasks, but they are custom code to write and maintain, which the requirements exclude."
      fr: "Des runbooks pourraient exécuter ces tâches, mais c'est du code personnalisé à écrire et à maintenir, ce que les exigences excluent."
references:
  - title: What are lifecycle workflows?
    url: https://learn.microsoft.com/en-us/entra/id-governance/what-are-lifecycle-workflows
  - title: Lifecycle Workflow built-in tasks
    url: https://learn.microsoft.com/en-us/entra/id-governance/lifecycle-workflow-tasks
