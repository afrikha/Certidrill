id: az305-1c-initiative-baseline
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The security team of Fabrikam defines a baseline that is made of 18 Azure Policy definitions, some built-in and some custom.

    You need to recommend how to apply the baseline to a management group that contains 35 subscriptions. The solution must meet the following requirements:

    - The baseline must be assigned in one operation.
    - The compliance of the baseline must be reported as a single result.
    - When a definition is added to the baseline later, no new assignment must be needed.

    What should you recommend?
  fr: |
    L'équipe de sécurité de Fabrikam définit un socle composé de 18 définitions Azure Policy, certaines intégrées et d'autres personnalisées.

    Vous devez recommander la façon d'appliquer ce socle à un groupe d'administration qui contient 35 abonnements. La solution doit respecter les exigences suivantes :

    - Le socle doit être attribué en une seule opération.
    - La conformité du socle doit être présentée comme un résultat unique.
    - Lorsqu'une définition est ajoutée au socle plus tard, aucune nouvelle attribution ne doit être nécessaire.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "An initiative definition that groups the 18 definitions", fr: "Une définition d'initiative qui regroupe les 18 définitions" }
    - id: b
      text: { en: "A custom policy definition whose rule merges the 18 rules", fr: "Une définition de stratégie personnalisée dont la règle fusionne les 18 règles" }
    - id: c
      text: { en: "A template spec that deploys 18 policy assignments", fr: "Une spec de modèle qui déploie 18 attributions de stratégies" }
    - id: d
      text: { en: "A separate assignment of each of the 18 definitions", fr: "Une attribution distincte de chacune des 18 définitions" }
answer: { optionId: a }
explanation:
  correct:
    en: "An initiative definition groups policy definitions that serve one goal. It is assigned once, its compliance is reported for the initiative as a whole, and a definition added to it later is evaluated through the existing assignment."
    fr: "Une définition d'initiative regroupe des définitions de stratégies qui servent un même objectif. Elle s'attribue une seule fois, sa conformité est présentée pour l'initiative dans son ensemble, et une définition ajoutée plus tard est évaluée par l'attribution existante."
  options:
    b:
      en: "A policy definition has one rule and one effect, and the built-in definitions can't be merged into it. Eighteen controls with different effects can't become one rule."
      fr: "Une définition de stratégie a une seule règle et un seul effet, et les définitions intégrées ne peuvent pas y être fusionnées. Dix-huit contrôles aux effets différents ne peuvent pas devenir une seule règle."
    c:
      en: "A template spec can deploy the assignments in one operation, but compliance is then reported per assignment, and a 19th definition needs a new assignment."
      fr: "Une spec de modèle peut déployer les attributions en une opération, mais la conformité est alors présentée par attribution, et une 19e définition exige une nouvelle attribution."
    d:
      en: "Eighteen assignments mean eighteen operations and eighteen compliance results, and a definition added later needs one more assignment."
      fr: "Dix-huit attributions représentent dix-huit opérations et dix-huit résultats de conformité, et une définition ajoutée plus tard exige une attribution de plus."
references:
  - title: What is Azure Policy?
    url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
