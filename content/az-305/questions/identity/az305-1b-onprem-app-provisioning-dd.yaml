id: az305-1b-onprem-app-provisioning-dd
objective: "1.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank wants Microsoft Entra ID to create, update and remove user accounts in two applications that run in its datacenter and keep their own user store.

    | Application | User store |
    | --- | --- |
    | Payroll | A table in a SQL Server database; the application has no provisioning API |
    | Docs | The application exposes a SCIM 2.0 endpoint inside the datacenter |

    The solution must use the fewest components, and the datacenter must accept no inbound connection from the internet.

    What should you include in the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank souhaite que Microsoft Entra ID crée, mette à jour et supprime des comptes d'utilisateurs dans deux applications qui s'exécutent dans son centre de données et conservent leur propre magasin d'utilisateurs.

    | Application | Magasin d'utilisateurs |
    | --- | --- |
    | Payroll | Une table dans une base de données SQL Server ; l'application n'a pas d'API d'approvisionnement |
    | Docs | L'application expose un point de terminaison SCIM 2.0 à l'intérieur du centre de données |

    La solution doit utiliser le moins de composants possible, et le centre de données ne doit accepter aucune connexion entrante depuis Internet.

    Que devez-vous inclure dans la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Component to install for Payroll: [[p]]

      Component to install for Docs: [[d]]

      Connectivity between Microsoft Entra ID and the datacenter: [[n]]
    fr: |
      Composant à installer pour Payroll : [[p]]

      Composant à installer pour Docs : [[d]]

      Connectivité entre Microsoft Entra ID et le centre de données : [[n]]
  slots:
    - id: p
      options:
        - { id: agent, text: { en: "The Microsoft Entra provisioning agent only", fr: "L'agent d'approvisionnement Microsoft Entra seul" } }
        - { id: ecma, text: { en: "The Microsoft Entra provisioning agent and the ECMA Connector Host", fr: "L'agent d'approvisionnement Microsoft Entra et l'hôte du connecteur ECMA" } }
        - { id: conn, text: { en: "A private network connector only", fr: "Un connecteur de réseau privé seul" } }
        - { id: sync, text: { en: "A Microsoft Entra Connect Sync server", fr: "Un serveur Microsoft Entra Connect Sync" } }
    - id: d
      options:
        - { id: agent, text: { en: "The Microsoft Entra provisioning agent only", fr: "L'agent d'approvisionnement Microsoft Entra seul" } }
        - { id: ecma, text: { en: "The Microsoft Entra provisioning agent and the ECMA Connector Host", fr: "L'agent d'approvisionnement Microsoft Entra et l'hôte du connecteur ECMA" } }
        - { id: conn, text: { en: "A private network connector only", fr: "Un connecteur de réseau privé seul" } }
        - { id: sync, text: { en: "A Microsoft Entra Connect Sync server", fr: "Un serveur Microsoft Entra Connect Sync" } }
    - id: n
      options:
        - { id: inb, text: { en: "An inbound firewall rule for TCP port 443 from Microsoft Entra ID", fr: "Une règle de pare-feu entrante pour le port TCP 443 depuis Microsoft Entra ID" } }
        - { id: vpn, text: { en: "A site-to-site VPN to an Azure virtual network", fr: "Un VPN site à site vers un réseau virtuel Azure" } }
        - { id: out, text: { en: "Outbound connections that the agent initiates", fr: "Des connexions sortantes établies par l'agent" } }
answer:
  values: { p: ecma, d: agent, n: out }
explanation:
  correct:
    en: "On-premises application provisioning relies on the Microsoft Entra provisioning agent, which links the provisioning service to the datacenter with outbound connections only, so no inbound port or perimeter network is needed. The ECMA Connector Host translates the provisioning requests for targets such as a SQL database, through a connector. It isn't required for an application that already exposes SCIM: the agent calls the SCIM endpoint directly."
    fr: "L'approvisionnement d'applications locales repose sur l'agent d'approvisionnement Microsoft Entra, qui relie le service d'approvisionnement au centre de données par des connexions sortantes uniquement : aucun port entrant ni réseau de périmètre n'est nécessaire. L'hôte du connecteur ECMA traduit les demandes d'approvisionnement pour des cibles telles qu'une base de données SQL, au moyen d'un connecteur. Il n'est pas nécessaire pour une application qui expose déjà SCIM : l'agent appelle directement le point de terminaison SCIM."
  options:
    conn:
      en: "The private network connector serves application proxy and Private Access; it publishes access to applications and doesn't provision accounts."
      fr: "Le connecteur de réseau privé sert au proxy d'application et à Private Access ; il publie l'accès à des applications et n'approvisionne pas de comptes."
    sync:
      en: "Connect Sync synchronizes AD DS with Microsoft Entra ID; it doesn't write users to an application database or to a SCIM endpoint."
      fr: "Connect Sync synchronise AD DS avec Microsoft Entra ID ; il n'écrit pas d'utilisateurs dans la base de données d'une application ni vers un point de terminaison SCIM."
references:
  - title: Microsoft Entra on-premises application identity provisioning architecture
    url: https://learn.microsoft.com/en-us/entra/identity/app-provisioning/on-premises-application-provisioning-architecture
