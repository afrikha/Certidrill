id: az305-1c-mg-reader-all-subscriptions
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Microsoft Entra tenant and 24 Azure subscriptions. All the subscriptions are in a management group named **MG-Contoso**, which is a child of the Tenant Root Group. Two or three subscriptions are added to MG-Contoso every month.

    The security operations team is represented by a group named **SecOps**. You need to recommend how to give SecOps access. The solution must meet the following requirements:

    - SecOps must be able to view the configuration of every resource in the current and future subscriptions.
    - SecOps must not be able to change resources.
    - Administrative effort must be minimized.

    What should you recommend?
  fr: |
    Contoso dispose d'un locataire Microsoft Entra et de 24 abonnements Azure. Tous les abonnements se trouvent dans un groupe d'administration nommé **MG-Contoso**, enfant du groupe racine du locataire. Deux ou trois abonnements sont ajoutés à MG-Contoso chaque mois.

    L'équipe des opérations de sécurité est représentée par un groupe nommé **SecOps**. Vous devez recommander la façon de donner l'accès à SecOps. La solution doit respecter les exigences suivantes :

    - SecOps doit pouvoir consulter la configuration de chaque ressource des abonnements actuels et futurs.
    - SecOps ne doit pas pouvoir modifier les ressources.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Assign the Reader role to SecOps on each subscription.", fr: "Attribuer le rôle Reader à SecOps sur chaque abonnement." }
    - id: b
      text: { en: "Assign the Reader role to SecOps at MG-Contoso.", fr: "Attribuer le rôle Reader à SecOps sur MG-Contoso." }
    - id: c
      text: { en: "Assign the Global Reader role to SecOps in Microsoft Entra ID.", fr: "Attribuer le rôle Global Reader à SecOps dans Microsoft Entra ID." }
    - id: d
      text: { en: "Assign an Azure Policy initiative that uses the audit effect at MG-Contoso.", fr: "Attribuer une initiative Azure Policy qui utilise l'effet audit sur MG-Contoso." }
answer: { optionId: b }
explanation:
  correct:
    en: "An Azure role assignment made at a management group is inherited by every subscription, resource group and resource below it, including subscriptions that join the management group later. One assignment of Reader at MG-Contoso therefore covers the 24 subscriptions and the future ones, without write access."
    fr: "Une attribution de rôle Azure faite sur un groupe d'administration est héritée par tous les abonnements, groupes de ressources et ressources situés en dessous, y compris par les abonnements qui rejoignent le groupe d'administration plus tard. Une seule attribution du rôle Reader sur MG-Contoso couvre donc les 24 abonnements et les suivants, sans accès en écriture."
  options:
    a:
      en: "It works for the current subscriptions, but 24 assignments must be created and one more for each new subscription, which doesn't minimize administrative effort."
      fr: "Cela fonctionne pour les abonnements actuels, mais il faut créer 24 attributions, puis une de plus à chaque nouvel abonnement, ce qui ne réduit pas l'effort d'administration."
    c:
      en: "Global Reader is a Microsoft Entra role. It gives read access to the directory and to Microsoft 365 services, not to Azure resources."
      fr: "Global Reader est un rôle Microsoft Entra. Il donne un accès en lecture à l'annuaire et aux services Microsoft 365, pas aux ressources Azure."
    d:
      en: "Azure Policy evaluates the compliance of resources. It doesn't grant anyone the permission to read them."
      fr: "Azure Policy évalue la conformité des ressources. Il n'accorde à personne l'autorisation de les lire."
references:
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
