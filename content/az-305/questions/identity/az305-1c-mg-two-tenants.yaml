id: az305-1c-mg-two-tenants
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware acquires Tailspin Toys. The environment is the following:

    - The proseware.com Microsoft Entra tenant has 30 subscriptions under a management group named **MG-Proseware**. All the company policies are assigned at MG-Proseware.
    - The tailspintoys.com Microsoft Entra tenant has six subscriptions.

    You need to recommend a governance design that meets the following requirements:

    - The policy assignments made at MG-Proseware must be inherited by the 36 subscriptions, with no additional assignment.
    - The compliance of the 36 subscriptions must be reported in one management group hierarchy.
    - The Tailspin Toys engineers can be given guest accounts in proseware.com.

    What should you recommend?
  fr: |
    Proseware rachète Tailspin Toys. L'environnement est le suivant :

    - Le locataire Microsoft Entra proseware.com possède 30 abonnements sous un groupe d'administration nommé **MG-Proseware**. Toutes les stratégies de l'entreprise sont attribuées sur MG-Proseware.
    - Le locataire Microsoft Entra tailspintoys.com possède six abonnements.

    Vous devez recommander une conception de gouvernance qui respecte les exigences suivantes :

    - Les attributions de stratégies faites sur MG-Proseware doivent être héritées par les 36 abonnements, sans attribution supplémentaire.
    - La conformité des 36 abonnements doit être présentée dans une seule hiérarchie de groupes d'administration.
    - Les ingénieurs de Tailspin Toys peuvent recevoir des comptes invités dans proseware.com.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Onboard the six subscriptions to Azure Lighthouse, and then add them to MG-Proseware.", fr: "Intégrer les six abonnements à Azure Lighthouse, puis les ajouter à MG-Proseware." }
    - id: b
      text: { en: "Configure cross-tenant synchronization between the two tenants, and then add the six subscriptions to MG-Proseware.", fr: "Configurer la synchronisation interlocataire entre les deux locataires, puis ajouter les six abonnements à MG-Proseware." }
    - id: c
      text: { en: "Transfer the six subscriptions to the proseware.com tenant, and then move them under MG-Proseware.", fr: "Transférer les six abonnements vers le locataire proseware.com, puis les déplacer sous MG-Proseware." }
    - id: d
      text: { en: "Create a management group named MG-Proseware in tailspintoys.com, and then move the six subscriptions under it.", fr: "Créer un groupe d'administration nommé MG-Proseware dans tailspintoys.com, puis déplacer les six abonnements sous celui-ci." }
answer: { optionId: c }
explanation:
  correct:
    en: "Each Microsoft Entra tenant has its own single management group hierarchy, and all the subscriptions of a management group must trust the same tenant. The six subscriptions can inherit from MG-Proseware only after they are transferred to the proseware.com directory. The Tailspin Toys engineers then work with guest accounts and new role assignments."
    fr: "Chaque locataire Microsoft Entra possède sa propre hiérarchie de groupes d'administration, unique, et tous les abonnements d'un groupe d'administration doivent approuver le même locataire. Les six abonnements ne peuvent hériter de MG-Proseware qu'après leur transfert vers l'annuaire proseware.com. Les ingénieurs de Tailspin Toys travaillent ensuite avec des comptes invités et de nouvelles attributions de rôles."
  options:
    a:
      en: "Azure Lighthouse delegates the management of subscriptions to users of another tenant, but a delegated subscription stays in the hierarchy of its own tenant. It can't become a child of MG-Proseware, so policies would need separate assignments."
      fr: "Azure Lighthouse délègue la gestion d'abonnements à des utilisateurs d'un autre locataire, mais un abonnement délégué reste dans la hiérarchie de son propre locataire. Il ne peut pas devenir un enfant de MG-Proseware : les stratégies exigeraient des attributions distinctes."
    b:
      en: "Cross-tenant synchronization creates user accounts in the other tenant. It doesn't change the tenant that the subscriptions trust, so they still can't join MG-Proseware."
      fr: "La synchronisation interlocataire crée des comptes d'utilisateurs dans l'autre locataire. Elle ne change pas le locataire que les abonnements approuvent : ils ne peuvent toujours pas rejoindre MG-Proseware."
    d:
      en: "A management group with the same name in tailspintoys.com is a separate hierarchy. It inherits nothing from proseware.com, and compliance stays split between two hierarchies."
      fr: "Un groupe d'administration du même nom dans tailspintoys.com constitue une hiérarchie distincte. Il n'hérite de rien de proseware.com, et la conformité reste répartie entre deux hiérarchies."
references:
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
  - title: Transfer an Azure subscription to a different Microsoft Entra directory
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/transfer-subscription
