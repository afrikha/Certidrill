id: az305-1c-pim-jit-contributor
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a production subscription named **Sub-Prod**. Twelve engineers have a permanent assignment of the Contributor role on Sub-Prod, although they change production resources only a few times a month.

    You need to recommend a solution that meets the following requirements:

    - An engineer must hold Contributor only when needed, for at most four hours.
    - Each use of the role must be approved by the team lead and must include a justification.
    - A history of the uses of the role must be available to auditors.

    What should you recommend?
  fr: |
    Contoso dispose d'un abonnement de production nommé **Sub-Prod**. Douze ingénieurs ont une attribution permanente du rôle Contributor sur Sub-Prod, alors qu'ils ne modifient les ressources de production que quelques fois par mois.

    Vous devez recommander une solution qui respecte les exigences suivantes :

    - Un ingénieur ne doit détenir Contributor que lorsque c'est nécessaire, pendant quatre heures au maximum.
    - Chaque utilisation du rôle doit être approuvée par le responsable d'équipe et comporter une justification.
    - Un historique des utilisations du rôle doit être disponible pour les auditeurs.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A Conditional Access policy with a sign-in frequency of four hours", fr: "Une stratégie d'accès conditionnel avec une fréquence de connexion de quatre heures" }
    - id: b
      text: { en: "Eligible role assignments in Microsoft Entra Privileged Identity Management (PIM)", fr: "Des attributions de rôles éligibles dans Microsoft Entra Privileged Identity Management (PIM)" }
    - id: c
      text: { en: "A monthly access review of the Contributor role on Sub-Prod", fr: "Une révision d'accès mensuelle du rôle Contributor sur Sub-Prod" }
    - id: d
      text: { en: "A user risk policy in Microsoft Entra ID Protection", fr: "Une stratégie de risque utilisateur dans Microsoft Entra ID Protection" }
answer: { optionId: b }
explanation:
  correct:
    en: "With PIM, the engineers become eligible for Contributor instead of holding it permanently. Each engineer activates the role when needed, for a duration capped by the role settings, with a justification and the approval of a designated approver, and PIM keeps an audit history of activations."
    fr: "Avec PIM, les ingénieurs deviennent éligibles au rôle Contributor au lieu de le détenir en permanence. Chaque ingénieur active le rôle quand il en a besoin, pour une durée plafonnée par les paramètres du rôle, avec une justification et l'approbation d'un approbateur désigné, et PIM conserve un historique d'audit des activations."
  options:
    a:
      en: "A sign-in frequency forces users to reauthenticate every four hours. The role assignment stays permanent, and nothing is approved."
      fr: "Une fréquence de connexion oblige les utilisateurs à se réauthentifier toutes les quatre heures. L'attribution de rôle reste permanente, et rien n'est approuvé."
    c:
      en: "An access review confirms periodically whether the assignments should remain. Between two reviews, the engineers still hold the role at all times."
      fr: "Une révision d'accès confirme périodiquement si les attributions doivent être conservées. Entre deux révisions, les ingénieurs détiennent toujours le rôle en permanence."
    d:
      en: "A user risk policy reacts to compromised accounts, for example by requiring a password change. It doesn't limit how long a role is held."
      fr: "Une stratégie de risque utilisateur réagit aux comptes compromis, par exemple en exigeant un changement de mot de passe. Elle ne limite pas la durée pendant laquelle un rôle est détenu."
references:
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
