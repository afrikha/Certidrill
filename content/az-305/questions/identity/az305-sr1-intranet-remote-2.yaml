id: az305-sr1-intranet-remote-2
objective: "1.2.4"
type: series_yesno
series: az305-sr1-intranet-remote
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You recommend point-to-site VPN connections that use Microsoft Entra ID authentication.
  fr: Vous recommandez des connexions VPN de point à site qui utilisent l'authentification Microsoft Entra ID.
body:
  solution:
    en: |
      You recommend deploying an **Azure VPN gateway** in a virtual network that is connected to the datacenter. Remote employees use **point-to-site VPN** connections that authenticate with Microsoft Entra ID and are subject to the Conditional Access policy.
    fr: |
      Vous recommandez de déployer une **passerelle VPN Azure** dans un réseau virtuel connecté au centre de données. Les employés distants utilisent des connexions **VPN de point à site** qui s'authentifient avec Microsoft Entra ID et sont soumises à la stratégie d'accès conditionnel.
answer: { value: false }
explanation:
  correct:
    en: |
      A point-to-site connection is established by VPN client software configured on each connecting device, and Microsoft Entra ID authentication specifically requires the Azure VPN Client. The solution therefore breaks the requirement that users don't have to install a VPN client, even though sign-in and Conditional Access would go through Microsoft Entra ID.
    fr: |
      Une connexion de point à site est établie par un logiciel client VPN configuré sur chaque appareil qui se connecte, et l'authentification Microsoft Entra ID exige précisément Azure VPN Client. La solution ne respecte donc pas l'exigence selon laquelle les utilisateurs n'ont pas à installer de client VPN, même si la connexion et l'accès conditionnel passent bien par Microsoft Entra ID.
references:
  - title: About Point-to-Site VPN
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about
