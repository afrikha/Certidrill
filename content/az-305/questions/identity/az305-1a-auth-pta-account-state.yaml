id: az305-1a-auth-pta-account-state
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam synchronizes the users of its on-premises Active Directory Domain Services (AD DS) domain to Microsoft Entra ID.

    You need to recommend an authentication method for cloud applications that meets the following requirements:

    - The AD DS account states (disabled, locked out, password expired) and sign-in hours must be enforced at each sign-in.
    - No inbound connection from the internet to the on-premises network is allowed.
    - The number of on-premises servers to deploy must be minimized.

    What should you recommend?
  fr: |
    Fabrikam synchronise les utilisateurs de son domaine Active Directory Domain Services (AD DS) local vers Microsoft Entra ID.

    Vous devez recommander une méthode d'authentification pour les applications cloud qui répond aux exigences suivantes :

    - Les états de compte AD DS (désactivé, verrouillé, mot de passe expiré) et les heures de connexion doivent être appliqués à chaque connexion.
    - Aucune connexion entrante d'Internet vers le réseau local n'est autorisée.
    - Le nombre de serveurs locaux à déployer doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "Pass-through authentication"
        fr: "L'authentification directe"
    - id: b
      text:
        en: "Password hash synchronization"
        fr: "La synchronisation de hachage du mot de passe"
    - id: c
      text:
        en: "Federation with Active Directory Federation Services (AD FS)"
        fr: "La fédération avec les services de fédération Active Directory (AD FS)"
    - id: d
      text:
        en: "Password hash synchronization with Seamless single sign-on"
        fr: "La synchronisation de hachage du mot de passe avec l'authentification unique transparente (Seamless SSO)"
answer: { optionId: a }
explanation:
  correct:
    en: |
      With pass-through authentication, lightweight agents hand each password validation to the on-premises domain controllers, so disabled or locked accounts, expired passwords and sign-in hours apply at every sign-in. The agents make outbound connections only and run on existing servers, without a perimeter network.
    fr: |
      Avec l'authentification directe, des agents légers confient chaque validation de mot de passe aux contrôleurs de domaine locaux : les comptes désactivés ou verrouillés, les mots de passe expirés et les heures de connexion s'appliquent donc à chaque connexion. Les agents n'établissent que des connexions sortantes et s'exécutent sur des serveurs existants, sans réseau de périmètre.
  options:
    b:
      en: "Password hash synchronization validates passwords in the cloud: it doesn't enforce lockout, password expiry or sign-in hours, and a disabled account can take up to 30 minutes to be blocked."
      fr: "La synchronisation de hachage du mot de passe valide les mots de passe dans le cloud : elle n'applique ni le verrouillage, ni l'expiration du mot de passe, ni les heures de connexion, et un compte désactivé peut mettre jusqu'à 30 minutes à être bloqué."
    c:
      en: "Federation enforces the account states, but it needs AD FS servers and Web Application Proxy servers in a perimeter network that accept inbound connections from the internet."
      fr: "La fédération applique les états de compte, mais exige des serveurs AD FS et des serveurs proxy d'application web dans un réseau de périmètre qui acceptent des connexions entrantes depuis Internet."
    d:
      en: "Seamless single sign-on avoids password prompts on domain-joined devices; it doesn't change where the password is validated."
      fr: "L'authentification unique transparente évite les demandes de mot de passe sur les appareils joints au domaine ; elle ne change pas l'endroit où le mot de passe est validé."
references:
  - title: Choose the right authentication method for your Microsoft Entra hybrid identity solution
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn
