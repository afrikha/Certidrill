id: az305-1a-log-entra-yn
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a Microsoft Entra tenant in which every user has a Microsoft Entra ID P1 license. The tenant is associated with an Azure subscription named **Sub1** that contains a Log Analytics workspace named **WS1**.

    You are designing the logging of user sign-ins.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un locataire Microsoft Entra dans lequel chaque utilisateur possède une licence Microsoft Entra ID P1. Le locataire est associé à un abonnement Azure nommé **Sub1** qui contient un espace de travail Log Analytics nommé **WS1**.

    Vous concevez la journalisation des connexions des utilisateurs.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Without any additional configuration, Microsoft Entra ID keeps the sign-in logs for 30 days."
        fr: "Sans configuration supplémentaire, Microsoft Entra ID conserve les journaux de connexion pendant 30 jours."
    - id: s2
      text:
        en: "To run KQL queries over the sign-ins of the last 12 months, Woodgrove Bank should route the sign-in logs to WS1 by using a diagnostic setting created in Microsoft Entra ID."
        fr: "Pour exécuter des requêtes KQL sur les connexions des 12 derniers mois, Woodgrove Bank doit acheminer les journaux de connexion vers WS1 à l'aide d'un paramètre de diagnostic créé dans Microsoft Entra ID."
    - id: s3
      text:
        en: "A diagnostic setting that exports the activity log of Sub1 to WS1 also exports the sign-in logs of the tenant."
        fr: "Un paramètre de diagnostic qui exporte le journal d'activité de Sub1 vers WS1 exporte aussi les journaux de connexion du locataire."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      With Microsoft Entra ID P1 or P2, sign-in and audit logs are kept for 30 days (7 days with the Free edition). To keep and query them longer, a diagnostic setting configured in Microsoft Entra ID routes them to a Log Analytics workspace, where retention can be extended well beyond one year. The activity log of a subscription contains control plane operations on Azure resources only; Microsoft Entra logs have their own diagnostic settings.
    fr: |
      Avec Microsoft Entra ID P1 ou P2, les journaux de connexion et d'audit sont conservés 30 jours (7 jours avec l'édition Free). Pour les conserver et les interroger plus longtemps, un paramètre de diagnostic configuré dans Microsoft Entra ID les achemine vers un espace de travail Log Analytics, où la rétention peut être étendue bien au-delà d'un an. Le journal d'activité d'un abonnement ne contient que les opérations du plan de contrôle sur les ressources Azure ; les journaux Microsoft Entra ont leurs propres paramètres de diagnostic.
references:
  - title: Microsoft Entra data retention
    url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-reports-data-retention
  - title: Configure Microsoft Entra diagnostic settings for activity logs
    url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/howto-configure-diagnostic-settings
