id: az305-1b-idm-external-id-customers
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is building an online store for consumers. Tailspin has a Microsoft Entra tenant that contains its employees, and has never deployed an identity service for customers.

    You need to recommend an identity solution for the store. The solution must meet the following requirements:

    - Customers sign up by themselves with an email address and a password, or with a Google or Facebook account.
    - Customer accounts are stored separately from the employee accounts.

    What should you recommend?
  fr: |
    Tailspin Toys développe une boutique en ligne destinée aux consommateurs. Tailspin dispose d'un locataire Microsoft Entra qui contient ses employés, et n'a jamais déployé de service d'identité pour des clients.

    Vous devez recommander une solution d'identité pour la boutique. La solution doit répondre aux exigences suivantes :

    - Les clients s'inscrivent eux-mêmes avec une adresse e-mail et un mot de passe, ou avec un compte Google ou Facebook.
    - Les comptes des clients sont stockés séparément des comptes des employés.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "B2B collaboration in the existing tenant", fr: "La collaboration B2B dans le locataire existant" }
    - id: b
      text: { en: "Microsoft Entra External ID in an external tenant", fr: "Microsoft Entra External ID dans un locataire externe" }
    - id: c
      text: { en: "Azure AD B2C in a new B2C tenant", fr: "Azure AD B2C dans un nouveau locataire B2C" }
    - id: d
      text: { en: "B2B direct connect in the existing tenant", fr: "La connexion directe B2B dans le locataire existant" }
answer: { optionId: b }
explanation:
  correct:
    en: "An external tenant of Microsoft Entra External ID is the customer identity service for applications published to consumers. It is a directory separate from the workforce tenant, with self-service sign-up by email and password, one-time passcode or social accounts such as Google and Facebook."
    fr: "Un locataire externe Microsoft Entra External ID est le service d'identité des clients pour les applications publiées auprès des consommateurs. C'est un annuaire distinct du locataire de personnel, avec une inscription en libre-service par e-mail et mot de passe, par code secret à usage unique ou par des comptes sociaux tels que Google et Facebook."
  options:
    a:
      en: "B2B collaboration creates guest users in the workforce tenant, next to the employees. It is meant for partners and suppliers, not for consumers."
      fr: "La collaboration B2B crée des utilisateurs invités dans le locataire de personnel, à côté des employés. Elle est destinée aux partenaires et aux fournisseurs, pas aux consommateurs."
    c:
      en: "Azure AD B2C is the legacy customer identity service. Since May 1, 2025, new customers can no longer purchase it, and Tailspin has never used it."
      fr: "Azure AD B2C est l'ancien service d'identité des clients. Depuis le 1er mai 2025, les nouveaux clients ne peuvent plus l'acheter, et Tailspin ne l'a jamais utilisé."
    d:
      en: "B2B direct connect is a mutual trust between two Microsoft Entra organizations for Teams shared channels. It doesn't offer sign-up to consumers."
      fr: "La connexion directe B2B est une approbation mutuelle entre deux organisations Microsoft Entra pour les canaux partagés de Teams. Elle n'offre pas d'inscription aux consommateurs."
references:
  - title: Introduction to Microsoft Entra External ID
    url: https://learn.microsoft.com/en-us/entra/external-id/external-identities-overview
