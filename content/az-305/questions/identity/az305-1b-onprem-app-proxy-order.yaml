id: az305-1b-onprem-app-proxy-order
objective: "1.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. hosts an intranet web application in its datacenter. Remote users must reach the application through Microsoft Entra application proxy, after they authenticate with Microsoft Entra ID. No component of the solution is deployed yet.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware, Inc. héberge une application web intranet dans son centre de données. Les utilisateurs distants doivent atteindre l'application par le proxy d'application Microsoft Entra, après s'être authentifiés avec Microsoft Entra ID. Aucun composant de la solution n'est encore déployé.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: vpn, text: { en: "Create a site-to-site VPN between the datacenter and Azure.", fr: "Créer un VPN site à site entre le centre de données et Azure." } }
    - { id: app, text: { en: "Add the on-premises application in Microsoft Entra ID, with its internal URL and Microsoft Entra ID pre-authentication.", fr: "Ajouter l'application locale dans Microsoft Entra ID, avec son URL interne et la préauthentification Microsoft Entra ID." } }
    - { id: fw, text: { en: "Open inbound TCP port 443 on the datacenter firewall to the web server.", fr: "Ouvrir le port TCP 443 entrant sur le pare-feu du centre de données vers le serveur web." } }
    - { id: conn, text: { en: "Install a private network connector on a Windows Server in the datacenter.", fr: "Installer un connecteur de réseau privé sur un serveur Windows Server du centre de données." } }
    - { id: assign, text: { en: "Assign the remote users to the application.", fr: "Affecter les utilisateurs distants à l'application." } }
    - { id: adfs, text: { en: "Deploy AD FS and Web Application Proxy servers.", fr: "Déployer AD FS et des serveurs Proxy d'application web." } }
answer:
  sequence: [ conn, app, assign ]
explanation:
  correct:
    en: |
      The private network connector comes first: it is the agent inside the network that links the application to the application proxy service. The application is then published in Microsoft Entra ID through that connector, with its internal URL and pre-authentication. Users can be assigned only once the application exists; with pre-authentication, only assigned users reach it.
    fr: |
      Le connecteur de réseau privé vient en premier : c'est l'agent situé à l'intérieur du réseau qui relie l'application au service de proxy d'application. L'application est ensuite publiée dans Microsoft Entra ID par ce connecteur, avec son URL interne et la préauthentification. Les utilisateurs ne peuvent être affectés qu'une fois l'application créée ; avec la préauthentification, seuls les utilisateurs affectés l'atteignent.
  options:
    vpn: { en: "Application proxy needs no VPN: the connector reaches the cloud service with outbound connections.", fr: "Le proxy d'application n'a besoin d'aucun VPN : le connecteur joint le service cloud par des connexions sortantes." }
    fw: { en: "No inbound port is required; opening one would expose the web server to the internet.", fr: "Aucun port entrant n'est nécessaire ; en ouvrir un exposerait le serveur web à Internet." }
    adfs: { en: "AD FS and Web Application Proxy are a different, self-hosted publishing solution that application proxy replaces.", fr: "AD FS et le Proxy d'application web constituent une autre solution de publication, auto-hébergée, que le proxy d'application remplace." }
references:
  - title: Microsoft Entra application proxy
    url: https://learn.microsoft.com/en-us/entra/identity/app-proxy/overview-what-is-app-proxy
