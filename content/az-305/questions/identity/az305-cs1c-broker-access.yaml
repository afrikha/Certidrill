id: az305-cs1c-broker-access
objective: "1.3.3"
type: single
caseStudy: az305-cs1c-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution to manage the access of the brokers. The solution must meet the broker access requirements.

    What should you include in the recommendation?
  fr: |
    Vous devez recommander une solution pour gérer l'accès des courtiers. La solution doit répondre aux exigences d'accès des courtiers.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "A recurring access review of the members of the Brokers group", fr: "Une révision d'accès récurrente des membres du groupe Brokers" } }
    - { id: b, text: { en: "An eligible membership of the Brokers group in Privileged Identity Management (PIM)", fr: "Une appartenance éligible au groupe Brokers dans Privileged Identity Management (PIM)" } }
    - { id: c, text: { en: "An access package for the Brokers group in entitlement management", fr: "Un package d'accès pour le groupe Brokers dans la gestion des droits d'utilisation" } }
    - { id: d, text: { en: "A dynamic membership rule on the Brokers group", fr: "Une règle d'appartenance dynamique sur le groupe Brokers" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An access package of Microsoft Entra entitlement management bundles resources, here the membership of the Brokers group that opens BrokerPortal and the SharePoint Online site, behind one request. Its policy lets the users of connected organizations who aren't yet in the directory request access, names the approvers, and makes each assignment expire after a set duration unless it is extended. Entitlement management also manages the life cycle of the guest accounts that it creates: when the last assignment of an external user ends, the guest account can be removed from the directory automatically.
    fr: |
      Un package d'accès de la gestion des droits d'utilisation Microsoft Entra regroupe des ressources, ici l'appartenance au groupe Brokers qui ouvre BrokerPortal et le site SharePoint Online, derrière une seule demande. Sa stratégie permet aux utilisateurs d'organisations connectées qui ne sont pas encore dans l'annuaire de demander l'accès, désigne les approbateurs et fait expirer chaque attribution après une durée fixée, sauf prolongation. La gestion des droits d'utilisation gère aussi le cycle de vie des comptes invités qu'elle crée : quand la dernière attribution d'un utilisateur externe prend fin, le compte invité peut être supprimé de l'annuaire automatiquement.
  options:
    a:
      en: An access review removes the members who are no longer approved, but it doesn't let a broker without an account request access or obtain an approval.
      fr: Une révision d'accès retire les membres qui ne sont plus approuvés, mais elle ne permet pas à un courtier sans compte de demander l'accès ni d'obtenir une approbation.
    b:
      en: PIM gives just-in-time activation of a membership to users who already exist in the tenant; it neither invites the brokers nor removes their accounts.
      fr: PIM offre l'activation juste-à-temps d'une appartenance à des utilisateurs qui existent déjà dans le locataire ; il n'invite pas les courtiers et ne supprime pas leurs comptes.
    d:
      en: A dynamic rule adds existing users according to their attributes, without any request, approval or expiration.
      fr: Une règle dynamique ajoute des utilisateurs existants d'après leurs attributs, sans demande, ni approbation, ni expiration.
references:
  - title: What is entitlement management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-overview
