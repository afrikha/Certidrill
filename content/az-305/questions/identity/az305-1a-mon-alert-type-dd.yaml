id: az305-1a-mon-alert-type-dd
objective: "1.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has an Azure subscription. Windows security events of the virtual machines are collected in the SecurityEvent table of a Log Analytics workspace.

    You need to recommend a type of alert rule for each of the following conditions. The solution must minimize costs.

    Which type of alert rule should you recommend for each condition? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un abonnement Azure. Les événements de sécurité Windows des machines virtuelles sont collectés dans la table SecurityEvent d'un espace de travail Log Analytics.

    Vous devez recommander un type de règle d'alerte pour chacune des conditions suivantes. La solution doit réduire les coûts au minimum.

    Quel type de règle d'alerte devez-vous recommander pour chaque condition ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A virtual machine of the production resource group is deleted: [[del]]

      The average CPU percentage of an App Service plan exceeds 80 percent: [[cpu]]

      More than 10 failed logon events are found in the SecurityEvent table within 15 minutes: [[logon]]
    fr: |
      Une machine virtuelle du groupe de ressources de production est supprimée : [[del]]

      Le pourcentage moyen de processeur d'un plan App Service dépasse 80 % : [[cpu]]

      Plus de 10 événements d'échec d'ouverture de session sont trouvés dans la table SecurityEvent en 15 minutes : [[logon]]
  slots:
    - id: del
      options:
        - { id: metric, text: { en: "Metric alert", fr: "Alerte de métrique" } }
        - { id: log, text: { en: "Log search alert", fr: "Alerte de recherche dans les journaux" } }
        - { id: activity, text: { en: "Activity log alert", fr: "Alerte de journal d'activité" } }
        - { id: sh, text: { en: "Service Health alert", fr: "Alerte Service Health" } }
    - id: cpu
      options:
        - { id: metric, text: { en: "Metric alert", fr: "Alerte de métrique" } }
        - { id: log, text: { en: "Log search alert", fr: "Alerte de recherche dans les journaux" } }
        - { id: activity, text: { en: "Activity log alert", fr: "Alerte de journal d'activité" } }
        - { id: sh, text: { en: "Service Health alert", fr: "Alerte Service Health" } }
    - id: logon
      options:
        - { id: metric, text: { en: "Metric alert", fr: "Alerte de métrique" } }
        - { id: log, text: { en: "Log search alert", fr: "Alerte de recherche dans les journaux" } }
        - { id: activity, text: { en: "Activity log alert", fr: "Alerte de journal d'activité" } }
        - { id: sh, text: { en: "Service Health alert", fr: "Alerte Service Health" } }
answer:
  values: { del: activity, cpu: metric, logon: log }
explanation:
  correct:
    en: |
      Deleting a resource is a control plane event written to the activity log, so an activity log alert fires when it occurs. The CPU percentage of an App Service plan already exists as a platform metric, and a metric alert is the right choice when the data is a metric that needs little manipulation. Counting events of a workspace table over a time window requires a KQL query, which is what a log search alert runs.
    fr: |
      La suppression d'une ressource est un événement du plan de contrôle écrit dans le journal d'activité : une alerte de journal d'activité se déclenche quand il se produit. Le pourcentage de processeur d'un plan App Service existe déjà sous forme de métrique de plateforme, et une alerte de métrique est le bon choix quand la donnée est une métrique qui demande peu de manipulation. Compter les événements d'une table d'un espace de travail sur une fenêtre de temps demande une requête KQL, ce qu'exécute une alerte de recherche dans les journaux.
  options:
    sh:
      en: "A Service Health alert reports service issues, planned maintenance and health advisories published by Microsoft, not events of your own resources."
      fr: "Une alerte Service Health signale les problèmes de service, les maintenances planifiées et les avis d'intégrité publiés par Microsoft, pas les événements de vos propres ressources."
references:
  - title: Choose the right type of alert rule
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
