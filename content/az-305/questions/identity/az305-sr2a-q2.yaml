id: az305-sr2a-q2
objective: "1.3.3"
type: series_yesno
series: az305-sr2a-partner-consultants
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You recommend inviting the consultants and a recurring access review of Group1.
  fr: |
    Vous recommandez l'invitation des consultants et une révision d'accès périodique de Group1.
body:
  solution:
    en: |
      You recommend that an administrator invites the consultants as guest users by using **Microsoft Entra B2B collaboration** and adds them to Group1, which gives access to Site1 and App1. A quarterly **access review** of the guest members of Group1 is assigned to the manager of Project1, and the consultants whose access is denied are removed from Group1.
    fr: |
      Vous recommandez qu'un administrateur invite les consultants en tant qu'utilisateurs invités avec la **collaboration Microsoft Entra B2B** et les ajoute à Group1, qui donne accès à Site1 et à App1. Une **révision d'accès** trimestrielle des membres invités de Group1 est confiée au responsable de Project1, et les consultants dont l'accès est refusé sont retirés de Group1.
answer: { value: false }
explanation:
  correct:
    en: |
      An access review recertifies access that already exists: the manager of Project1 confirms or removes memberships every quarter, after the consultants have been using the resources. Nothing lets a consultant without an account submit a request, and no approval takes place before the access is granted, because an administrator invites and adds each consultant. The first two requirements aren't met.
    fr: |
      Une révision d'accès recertifie un accès qui existe déjà : le responsable de Project1 confirme ou retire les appartenances chaque trimestre, alors que les consultants utilisent déjà les ressources. Rien ne permet à un consultant sans compte de soumettre une demande, et aucune approbation n'a lieu avant l'octroi de l'accès, puisqu'un administrateur invite et ajoute chaque consultant. Les deux premières exigences ne sont pas satisfaites.
references:
  - title: "What are access reviews?"
    url: https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview
