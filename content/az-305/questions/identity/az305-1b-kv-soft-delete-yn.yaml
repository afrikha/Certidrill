id: az305-1b-kv-soft-delete-yn
objective: "1.2.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys plans to create a key vault named **kv-wingtip** for the secrets of its production applications. Purge protection won't be enabled.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prévoit de créer un coffre de clés nommé **kv-wingtip** pour les secrets de ses applications de production. La protection contre la suppression définitive ne sera pas activée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After kv-wingtip is created, soft delete can be turned off on the vault.
        fr: Après la création de kv-wingtip, la suppression réversible peut être désactivée sur le coffre.
    - id: s2
      text:
        en: When kv-wingtip is created, the retention period of deleted objects can be set to 30 days.
        fr: Lors de la création de kv-wingtip, la période de rétention des objets supprimés peut être fixée à 30 jours.
    - id: s3
      text:
        en: While a deleted secret named Secret1 is in the soft-deleted state, a new secret named Secret1 can be created in kv-wingtip.
        fr: Tant qu'un secret supprimé nommé Secret1 est à l'état de suppression réversible, un nouveau secret nommé Secret1 peut être créé dans kv-wingtip.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Soft delete is on for new vaults and can't be disabled. The retention period is chosen when the vault is created, between 7 and 90 days (90 by default), and can't be changed afterwards. While a deleted object is retained, its name stays reserved: a new object with the same name can't be created in the vault until the deleted one is recovered or purged."
    fr: "La suppression réversible est active pour les nouveaux coffres et ne peut pas être désactivée. La période de rétention se choisit à la création du coffre, entre 7 et 90 jours (90 par défaut), et ne peut plus être modifiée ensuite. Tant qu'un objet supprimé est conservé, son nom reste réservé : un nouvel objet du même nom ne peut pas être créé dans le coffre avant que l'objet supprimé soit récupéré ou supprimé définitivement."
references:
  - title: "Azure Key Vault: soft-delete overview"
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
