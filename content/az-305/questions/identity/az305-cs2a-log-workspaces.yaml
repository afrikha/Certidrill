id: az305-cs2a-log-workspaces
objective: "1.1.1"
type: dropdown
caseStudy: az305-cs2a-lamna-healthcare
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a Log Analytics design for the Azure resources of Lamna Healthcare after the planned changes. The solution must meet the logging requirements.

    What should you include in the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une conception Log Analytics pour les ressources Azure de Lamna Healthcare après les changements prévus. La solution doit respecter les exigences relatives à la journalisation.

    Que devez-vous inclure dans la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Workspaces: [[workspaces]]

      Access of the application teams to the logs: [[access]]
    fr: |
      Espaces de travail : [[workspaces]]

      Accès des équipes applicatives aux journaux : [[access]]
  slots:
    - id: workspaces
      options:
        - { id: one, text: { en: "law-lamna-we only", fr: "law-lamna-we uniquement" } }
        - { id: two, text: { en: "law-lamna-we and a second workspace in Switzerland North", fr: "law-lamna-we et un second espace de travail dans Switzerland North" } }
        - { id: team, text: { en: "One workspace per application team in each region", fr: "Un espace de travail par équipe applicative dans chaque région" } }
    - id: access
      options:
        - { id: reader, text: { en: "The Log Analytics Reader role on the workspaces", fr: "Le rôle Log Analytics Reader sur les espaces de travail" } }
        - { id: table, text: { en: "Table-level access on the workspaces", fr: "Un accès au niveau des tables sur les espaces de travail" } }
        - { id: resource, text: { en: "Resource-context access to the workspaces", fr: "Un accès en contexte de ressource aux espaces de travail" } }
answer:
  values: { workspaces: two, access: resource }
explanation:
  correct:
    en: A workspace stores its data in its own region, so a data residency rule is a reason to add a workspace; one workspace in West Europe and one in Switzerland North is the smallest design that keeps the Swiss logs in Switzerland. Separating teams is not a reason to add workspaces. In the default access mode, a user who has access to a resource can query the logs of that resource without any permission on the workspace, so the Contributor role that each team has on its resource groups is enough.
    fr: Un espace de travail stocke ses données dans sa propre région ; une règle de résidence des données est donc une raison d'ajouter un espace de travail, et un espace dans West Europe plus un autre dans Switzerland North constituent la plus petite conception qui garde les journaux suisses en Suisse. Séparer les équipes n'est pas une raison d'ajouter des espaces de travail. Dans le mode d'accès par défaut, un utilisateur qui a accès à une ressource peut interroger les journaux de cette ressource sans aucune autorisation sur l'espace de travail ; le rôle Contributor que chaque équipe détient sur ses groupes de ressources suffit donc.
  options:
    one: { en: "A single workspace in West Europe would store the logs of the Swiss resources outside Switzerland.", fr: "Un seul espace de travail dans West Europe stockerait les journaux des ressources suisses hors de Suisse." }
    team: { en: "One workspace per team multiplies the workspaces without need: access can be separated inside a workspace.", fr: "Un espace de travail par équipe multiplie les espaces de travail sans nécessité : l'accès peut être séparé à l'intérieur d'un espace de travail." }
    reader: { en: "A role on the workspace gives access to the logs of all the resources that send data to it.", fr: "Un rôle sur l'espace de travail donne accès aux journaux de toutes les ressources qui y envoient des données." }
    table: { en: "Table-level access separates data by table, not by the resource that produced it, and must be maintained for each team.", fr: "L'accès au niveau des tables sépare les données par table, et non par ressource d'origine, et doit être maintenu pour chaque équipe." }
references:
  - title: Design a Log Analytics workspace architecture
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/workspace-design
