id: az305-1a-mon-tool-per-need-dd
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum has Azure virtual machines and on-premises servers that are connected to Azure Arc. The on-premises datacenter is connected to Azure through ExpressRoute.

    You need to recommend a monitoring tool for each of the following needs.

    Which tool should you recommend for each need? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose de machines virtuelles Azure et de serveurs locaux connectés à Azure Arc. Le centre de données local est relié à Azure par ExpressRoute.

    Vous devez recommander un outil de monitoring pour chacun des besoins suivants.

    Quel outil devez-vous recommander pour chaque besoin ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Analyze the guest performance of the virtual machines and the Arc-enabled servers in ready-made views: [[perf]]

      Continuously test packet loss and latency between the Azure virtual machines and the on-premises servers: [[conn]]

      Record the IP flows that cross the virtual networks and identify the hosts that exchange the most traffic: [[flows]]
    fr: |
      Analyser les performances du système invité des machines virtuelles et des serveurs avec Azure Arc dans des vues prêtes à l'emploi : [[perf]]

      Tester en continu la perte de paquets et la latence entre les machines virtuelles Azure et les serveurs locaux : [[conn]]

      Enregistrer les flux IP qui traversent les réseaux virtuels et identifier les hôtes qui échangent le plus de trafic : [[flows]]
  slots:
    - id: perf
      options:
        - { id: vmi, text: "VM insights" }
        - { id: cm, text: { en: "Connection monitor", fr: "Moniteur de connexion" } }
        - { id: flow, text: { en: "Virtual network flow logs with traffic analytics", fr: "Journaux de flux de réseau virtuel avec l'analyse du trafic" } }
        - { id: avail, text: { en: "Application Insights availability tests", fr: "Tests de disponibilité Application Insights" } }
    - id: conn
      options:
        - { id: vmi, text: "VM insights" }
        - { id: cm, text: { en: "Connection monitor", fr: "Moniteur de connexion" } }
        - { id: flow, text: { en: "Virtual network flow logs with traffic analytics", fr: "Journaux de flux de réseau virtuel avec l'analyse du trafic" } }
        - { id: avail, text: { en: "Application Insights availability tests", fr: "Tests de disponibilité Application Insights" } }
    - id: flows
      options:
        - { id: vmi, text: "VM insights" }
        - { id: cm, text: { en: "Connection monitor", fr: "Moniteur de connexion" } }
        - { id: flow, text: { en: "Virtual network flow logs with traffic analytics", fr: "Journaux de flux de réseau virtuel avec l'analyse du trafic" } }
        - { id: avail, text: { en: "Application Insights availability tests", fr: "Tests de disponibilité Application Insights" } }
answer:
  values: { perf: vmi, conn: cm, flows: flow }
explanation:
  correct:
    en: |
      VM insights relies on the Azure Monitor Agent to analyze the performance of Azure virtual machines, scale sets and Arc-enabled servers in its Performance view. Connection monitor, in Network Watcher, continuously measures packet loss and latency between sources such as Azure virtual machines and destinations that include on-premises hosts. Virtual network flow logs record the IP flows through a virtual network, and traffic analytics turns them into insights about who talks to whom.
    fr: |
      VM insights s'appuie sur l'agent Azure Monitor pour analyser dans sa vue Performances les performances des machines virtuelles Azure, des groupes de machines virtuelles identiques et des serveurs avec Azure Arc. Le moniteur de connexion, dans Network Watcher, mesure en continu la perte de paquets et la latence entre des sources comme les machines virtuelles Azure et des destinations qui incluent des hôtes locaux. Les journaux de flux de réseau virtuel enregistrent les flux IP qui traversent un réseau virtuel, et l'analyse du trafic les transforme en informations sur qui communique avec qui.
  options:
    avail:
      en: "Availability tests call a public web endpoint from Microsoft test locations; they measure neither guest performance nor private network paths."
      fr: "Les tests de disponibilité appellent un point de terminaison web public depuis des emplacements de test Microsoft ; ils ne mesurent ni les performances de l'invité ni les chemins réseau privés."
references:
  - title: Connection monitor overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview
  - title: Virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
