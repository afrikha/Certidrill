id: az305-1b-idm-sync-connect-limits
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has an on-premises Active Directory Domain Services (AD DS) forest that contains a single domain named litware.com. The domain contains 220,000 objects to synchronize, and several security groups that each have between 60,000 and 110,000 members.

    Litware plans to synchronize the domain to a Microsoft Entra tenant. The solution must meet the following requirements:

    - Synchronize all the users, and all the groups with their complete membership.
    - Resume synchronization quickly after a hardware failure.

    What should you recommend?
  fr: |
    Litware, Inc. dispose d'une forêt Active Directory Domain Services (AD DS) locale qui contient un seul domaine nommé litware.com. Le domaine contient 220 000 objets à synchroniser, ainsi que plusieurs groupes de sécurité qui comptent chacun entre 60 000 et 110 000 membres.

    Litware prévoit de synchroniser le domaine vers un locataire Microsoft Entra. La solution doit répondre aux exigences suivantes :

    - Synchroniser tous les utilisateurs, et tous les groupes avec l'intégralité de leurs membres.
    - Reprendre rapidement la synchronisation après une panne matérielle.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Microsoft Entra Cloud Sync with one provisioning agent", fr: "Microsoft Entra Cloud Sync avec un agent d'approvisionnement" }
    - id: b
      text: { en: "Microsoft Entra Cloud Sync with three provisioning agents", fr: "Microsoft Entra Cloud Sync avec trois agents d'approvisionnement" }
    - id: c
      text: { en: "Microsoft Entra Connect Sync with a second server in staging mode", fr: "Microsoft Entra Connect Sync avec un second serveur en mode de préproduction" }
    - id: d
      text: { en: "Microsoft Entra Domain Services with a second replica set", fr: "Microsoft Entra Domain Services avec un second jeu de réplicas" }
answer: { optionId: c }
explanation:
  correct:
    en: "Cloud Sync supports up to 150,000 objects per domain and groups of up to 50,000 members, so it can't synchronize this domain completely. Connect Sync has no object limit and supports groups of up to 250,000 members. A second server kept in staging mode holds a ready configuration that an administrator activates if the active server fails."
    fr: "Cloud Sync prend en charge jusqu'à 150 000 objets par domaine et des groupes de 50 000 membres au plus : il ne peut donc pas synchroniser complètement ce domaine. Connect Sync n'a pas de limite d'objets et prend en charge des groupes de 250 000 membres au plus. Un second serveur maintenu en mode de préproduction détient une configuration prête, qu'un administrateur active si le serveur actif tombe en panne."
  options:
    a:
      en: "The domain exceeds the Cloud Sync limits of 150,000 objects per domain and 50,000 members per group, and one agent offers no resilience."
      fr: "Le domaine dépasse les limites de Cloud Sync, soit 150 000 objets par domaine et 50 000 membres par groupe, et un seul agent n'offre aucune résilience."
    b:
      en: "Additional agents add availability, not capacity: the limits per domain and per group stay the same."
      fr: "Des agents supplémentaires ajoutent de la disponibilité, pas de la capacité : les limites par domaine et par groupe restent les mêmes."
    d:
      en: "Domain Services is a managed domain in Azure filled from Microsoft Entra ID. It isn't a tool that synchronizes AD DS to the tenant."
      fr: "Domain Services est un domaine managé dans Azure, alimenté à partir de Microsoft Entra ID. Ce n'est pas un outil qui synchronise AD DS vers le locataire."
references:
  - title: "Migrate from Microsoft Entra Connect Sync to Cloud Sync: decision guide"
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/cloud-sync/connect-to-cloud-sync-decision-guide
