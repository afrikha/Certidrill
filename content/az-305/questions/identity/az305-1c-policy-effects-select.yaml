id: az305-1c-policy-effects-select
objective: "1.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware is writing three custom Azure Policy definitions that will be assigned at a management group.

    You need to recommend the effect of each definition.

    Which effect should you recommend for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware rédige trois définitions Azure Policy personnalisées qui seront attribuées sur un groupe d'administration.

    Vous devez recommander l'effet de chaque définition.

    Quel effet devez-vous recommander pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A request to create a virtual machine whose size isn't approved must be rejected: [[r1]]

      During a three-month pilot, storage accounts that accept a TLS version older than 1.2 must be reported, and no request must be blocked or changed: [[r2]]

      Any request to delete a Log Analytics workspace must be blocked, while updates to workspaces stay possible: [[r3]]
    fr: |
      Une demande de création d'une machine virtuelle dont la taille n'est pas approuvée doit être rejetée : [[r1]]

      Pendant un pilote de trois mois, les comptes de stockage qui acceptent une version de TLS antérieure à 1.2 doivent être signalés, sans qu'aucune requête soit bloquée ni modifiée : [[r2]]

      Toute demande de suppression d'un espace de travail Log Analytics doit être bloquée, alors que les mises à jour des espaces de travail restent possibles : [[r3]]
  slots:
    - id: r1
      options:
        - { id: audit, text: audit }
        - { id: deny, text: deny }
        - { id: denyAction, text: denyAction }
        - { id: modify, text: modify }
    - id: r2
      options:
        - { id: audit, text: audit }
        - { id: deny, text: deny }
        - { id: denyAction, text: denyAction }
        - { id: modify, text: modify }
    - id: r3
      options:
        - { id: audit, text: audit }
        - { id: deny, text: deny }
        - { id: denyAction, text: denyAction }
        - { id: modify, text: modify }
answer:
  values: { r1: deny, r2: audit, r3: denyAction }
explanation:
  correct:
    en: "`deny` refuses a create or update request that doesn't match the rule, such as a virtual machine of an unapproved size. `audit` records the non-compliant resources in the compliance results and changes nothing, which suits a pilot. `denyAction` blocks an action on existing resources, deletion in practice, without affecting create and update requests."
    fr: "`deny` refuse une requête de création ou de mise à jour qui ne respecte pas la règle, comme une machine virtuelle d'une taille non approuvée. `audit` consigne les ressources non conformes dans les résultats de conformité sans rien modifier, ce qui convient à un pilote. `denyAction` bloque une action sur des ressources existantes, en pratique la suppression, sans toucher aux requêtes de création et de mise à jour."
  options:
    modify:
      en: "`modify` adds or replaces properties and tags on a resource. It neither rejects a request nor blocks a deletion, and it would change requests during the pilot."
      fr: "`modify` ajoute ou remplace des propriétés et des étiquettes sur une ressource. Il ne rejette pas de requête, ne bloque pas de suppression, et il modifierait des requêtes pendant le pilote."
references:
  - title: Azure Policy definitions effect basics
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-basics
  - title: Azure Policy definitions denyAction effect
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-deny-action
