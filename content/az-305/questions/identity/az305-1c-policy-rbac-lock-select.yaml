id: az305-1c-policy-rbac-lock-select
objective: "1.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is preparing its first production subscriptions in Azure. The compliance officer lists three controls.

    You need to recommend the Azure feature that implements each control.

    Which feature should you recommend for each control? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prépare ses premiers abonnements de production dans Azure. Le responsable de la conformité énumère trois contrôles.

    Vous devez recommander la fonctionnalité Azure qui met en œuvre chaque contrôle.

    Quelle fonctionnalité devez-vous recommander pour chaque contrôle ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Only the members of the network team can create or change virtual networks: [[c1]]

      Whoever deploys, resources can be created only in the Switzerland North and Switzerland West regions: [[c2]]

      The ExpressRoute circuit is protected against accidental deletion, and an Owner must first remove the protection from the circuit to delete it: [[c3]]
    fr: |
      Seuls les membres de l'équipe réseau peuvent créer ou modifier des réseaux virtuels : [[c1]]

      Quelle que soit la personne qui déploie, les ressources ne peuvent être créées que dans les régions Switzerland North et Switzerland West : [[c2]]

      Le circuit ExpressRoute est protégé contre la suppression accidentelle, et un Owner doit d'abord retirer la protection du circuit pour le supprimer : [[c3]]
  slots:
    - id: c1
      options:
        - { id: policy, text: Azure Policy }
        - { id: rbac, text: { en: "Azure role-based access control (Azure RBAC)", fr: "Contrôle d'accès en fonction du rôle Azure (Azure RBAC)" } }
        - { id: lock, text: { en: "Resource locks", fr: "Verrous de ressources" } }
        - { id: ca, text: { en: "Microsoft Entra Conditional Access", fr: "Accès conditionnel Microsoft Entra" } }
    - id: c2
      options:
        - { id: policy, text: Azure Policy }
        - { id: rbac, text: { en: "Azure role-based access control (Azure RBAC)", fr: "Contrôle d'accès en fonction du rôle Azure (Azure RBAC)" } }
        - { id: lock, text: { en: "Resource locks", fr: "Verrous de ressources" } }
        - { id: ca, text: { en: "Microsoft Entra Conditional Access", fr: "Accès conditionnel Microsoft Entra" } }
    - id: c3
      options:
        - { id: policy, text: Azure Policy }
        - { id: rbac, text: { en: "Azure role-based access control (Azure RBAC)", fr: "Contrôle d'accès en fonction du rôle Azure (Azure RBAC)" } }
        - { id: lock, text: { en: "Resource locks", fr: "Verrous de ressources" } }
        - { id: ca, text: { en: "Microsoft Entra Conditional Access", fr: "Accès conditionnel Microsoft Entra" } }
answer:
  values: { c1: rbac, c2: policy, c3: lock }
explanation:
  correct:
    en: "Azure RBAC decides what a user may do, so limiting the management of virtual networks to one team is a matter of role assignments. Azure Policy decides what resources may be, whoever acts, which is what a restriction on regions needs. A `CanNotDelete` lock on the circuit applies to every role and must be removed before the resource can be deleted."
    fr: "Azure RBAC détermine ce qu'un utilisateur a le droit de faire : réserver la gestion des réseaux virtuels à une équipe relève donc des attributions de rôles. Azure Policy détermine ce que les ressources ont le droit d'être, quel que soit l'auteur de l'action, ce qu'exige une restriction sur les régions. Un verrou `CanNotDelete` sur le circuit s'applique à tous les rôles et doit être retiré avant que la ressource puisse être supprimée."
  options:
    ca:
      en: "Conditional Access sets the conditions of sign-in, such as multifactor authentication or a compliant device. It doesn't control which resources are created, where, or whether they can be deleted."
      fr: "L'accès conditionnel fixe les conditions de connexion, comme l'authentification multifacteur ou un appareil conforme. Il ne détermine pas quelles ressources sont créées, ni où, ni si elles peuvent être supprimées."
references:
  - title: What is Azure Policy?
    url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
