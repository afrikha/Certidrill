id: az305-1c-access-review-guests-groups
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has 400 guest users who are members of 60 Microsoft 365 groups. Nobody checks whether the guests still work with Fabrikam.

    You need to recommend a solution that meets the following requirements:

    - Every quarter, the owners of each group must confirm which guests still need to be members.
    - A guest who isn't confirmed, or whose membership the owners don't review, must be removed from the group automatically.
    - Administrative effort must be minimized.

    What should you recommend?
  fr: |
    Fabrikam compte 400 utilisateurs invités qui sont membres de 60 groupes Microsoft 365. Personne ne vérifie si les invités travaillent encore avec Fabrikam.

    Vous devez recommander une solution qui respecte les exigences suivantes :

    - Chaque trimestre, les propriétaires de chaque groupe doivent confirmer quels invités ont encore besoin d'être membres.
    - Un invité qui n'est pas confirmé, ou dont les propriétaires n'ont pas révisé l'appartenance, doit être retiré du groupe automatiquement.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A Microsoft 365 group expiration policy of 90 days", fr: "Une stratégie d'expiration des groupes Microsoft 365 de 90 jours" }
    - id: b
      text: { en: "Dynamic membership rules on the 60 groups", fr: "Des règles d'appartenance dynamique sur les 60 groupes" }
    - id: c
      text: { en: "Eligible group memberships for the guests in PIM for Groups", fr: "Des appartenances de groupe éligibles pour les invités dans PIM pour les groupes" }
    - id: d
      text: { en: "A recurring access review of guest users in Microsoft 365 groups", fr: "Une révision d'accès récurrente des utilisateurs invités dans les groupes Microsoft 365" }
answer: { optionId: d }
explanation:
  correct:
    en: "An access review can target the guest users of all Microsoft 365 groups, recur every quarter and name the group owners as reviewers. With the results applied automatically and the setting that removes access when reviewers don't respond, guests who are denied or not reviewed lose their membership without administrator action."
    fr: "Une révision d'accès peut cibler les utilisateurs invités de tous les groupes Microsoft 365, se répéter chaque trimestre et désigner les propriétaires des groupes comme réviseurs. Avec l'application automatique des résultats et le paramètre qui retire l'accès lorsque les réviseurs ne répondent pas, les invités refusés ou non révisés perdent leur appartenance sans intervention d'un administrateur."
  options:
    a:
      en: "An expiration policy applies to the groups themselves, which the owners renew or let expire. It doesn't evaluate guests one by one."
      fr: "Une stratégie d'expiration s'applique aux groupes eux-mêmes, que les propriétaires renouvellent ou laissent expirer. Elle n'évalue pas les invités un par un."
    b:
      en: "Dynamic rules compute membership from user attributes. No attribute says whether an owner still wants a guest in the group."
      fr: "Les règles dynamiques calculent l'appartenance à partir d'attributs des utilisateurs. Aucun attribut n'indique si un propriétaire veut encore d'un invité dans le groupe."
    c:
      en: "PIM for Groups provides just-in-time membership that users activate. It doesn't ask owners to confirm memberships every quarter."
      fr: "PIM pour les groupes fournit une appartenance juste-à-temps que les utilisateurs activent. Il ne demande pas aux propriétaires de confirmer les appartenances chaque trimestre."
references:
  - title: What are access reviews?
    url: https://learn.microsoft.com/en-us/entra/id-governance/access-reviews-overview
  - title: Create an access review of groups and applications in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
