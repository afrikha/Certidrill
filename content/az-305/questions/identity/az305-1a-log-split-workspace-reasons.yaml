id: az305-1a-log-split-workspace-reasons
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum is designing its Azure Monitor Logs architecture. The architects want to deploy as few Log Analytics workspaces as possible and are reviewing the requirements collected from the business units.

    Which two requirements justify deploying more than one Log Analytics workspace?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum conçoit son architecture de journaux Azure Monitor. Les architectes veulent déployer le moins possible d'espaces de travail Log Analytics et examinent les exigences recueillies auprès des unités métier.

    Quelles sont les deux exigences qui justifient le déploiement de plusieurs espaces de travail Log Analytics ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Each application team must read only the logs of its own resources."
        fr: "Chaque équipe applicative ne doit lire que les journaux de ses propres ressources."
    - id: b
      text:
        en: "The logs of the German subsidiary must be stored in Germany for regulatory reasons, and the other logs in the United States."
        fr: "Les journaux de la filiale allemande doivent être stockés en Allemagne pour des raisons réglementaires, et les autres journaux aux États-Unis."
    - id: c
      text:
        en: "The total ingestion is expected to exceed 500 GB per day."
        fr: "L'ingestion totale devrait dépasser 500 Go par jour."
    - id: d
      text:
        en: "The monitored resources are deployed in 14 subscriptions of the same tenant."
        fr: "Les ressources surveillées sont déployées dans 14 abonnements du même locataire."
    - id: e
      text:
        en: "Azure resources are deployed in two Microsoft Entra tenants."
        fr: "Des ressources Azure sont déployées dans deux locataires Microsoft Entra."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      A workspace resides in one region, so data that must stay in a given geography needs a workspace there, separate from the workspace that holds the other logs. Most resources can send monitoring data only to a workspace of their own Microsoft Entra tenant, so each tenant gets its own workspace.
    fr: |
      Un espace de travail réside dans une seule région : les données qui doivent rester dans une zone géographique donnée demandent un espace de travail à cet endroit, distinct de celui qui contient les autres journaux. La plupart des ressources ne peuvent envoyer leurs données de monitoring qu'à un espace de travail de leur propre locataire Microsoft Entra : chaque locataire reçoit donc son espace de travail.
  options:
    a:
      en: "Access control isn't a reason to split: resource-context access lets each team query the logs of the resources it can read, inside a shared workspace."
      fr: "Le contrôle d'accès n'est pas une raison de diviser : l'accès en contexte de ressource permet à chaque équipe d'interroger les journaux des ressources qu'elle peut lire, dans un espace de travail partagé."
    c:
      en: "The amount of data in a workspace doesn't limit its performance; a large volume is rather a reason to consolidate and reach a commitment tier."
      fr: "La quantité de données d'un espace de travail ne limite pas ses performances ; un volume important est plutôt une raison de regrouper pour atteindre un niveau d'engagement."
    d:
      en: "A workspace accepts data from resources in any subscription of its tenant."
      fr: "Un espace de travail accepte les données de ressources de n'importe quel abonnement de son locataire."
references:
  - title: Design a Log Analytics workspace architecture
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/workspace-design
