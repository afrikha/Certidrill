id: az305-cs3c-access-governance
objective: "1.3.3"
type: dragdrop
caseStudy: az305-cs3c-alpineski
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a Microsoft Entra feature for each governance requirement of Alpine Ski House.

    Which feature should you recommend for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une fonctionnalité Microsoft Entra pour chaque exigence de gouvernance d'Alpine Ski House.

    Quelle fonctionnalité devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: reviews, text: { en: "Access reviews", fr: "Révisions d'accès" } }
    - { id: ca, text: { en: "Conditional Access", fr: "Accès conditionnel" } }
    - { id: em, text: { en: "Entitlement management", fr: "Gestion des droits d'utilisation" } }
    - { id: lcw, text: { en: "Lifecycle workflows", fr: "Workflows de cycle de vie" } }
    - { id: pim, text: Privileged Identity Management }
  targets:
    - id: partners
      text: { en: "Access of the employees of the partner tour operators to the bundle of resources", fr: "Accès des employés des voyagistes partenaires à l'ensemble de ressources" }
    - id: engineers
      text: { en: "Contributor role of the platform engineers on Sub-Booking", fr: "Rôle Contributor des ingénieurs de la plateforme sur Sub-Booking" }
    - id: group
      text: { en: "Quarterly confirmation of the members of Partners-Reporting", fr: "Confirmation trimestrielle des membres de Partners-Reporting" }
answer:
  mapping: { partners: em, engineers: pim, group: reviews }
explanation:
  correct:
    en: "Entitlement management bundles applications, groups and SharePoint sites in an access package that external users request themselves, with an approval step, an expiration, and the removal of the guest account when its last assignment ends. Privileged Identity Management makes the engineers eligible for the Contributor role, which they activate after approval for a limited time. A recurring access review of the Partners-Reporting group asks the sponsors to confirm each member and removes the members who aren't confirmed."
    fr: "La gestion des droits d'utilisation regroupe des applications, des groupes et des sites SharePoint dans un package d'accès que les utilisateurs externes demandent eux-mêmes, avec une étape d'approbation, une expiration et la suppression du compte invité lorsque sa dernière attribution prend fin. Privileged Identity Management rend les ingénieurs éligibles au rôle Contributor, qu'ils activent après approbation pour une durée limitée. Une révision d'accès récurrente du groupe Partners-Reporting demande aux parrains de confirmer chaque membre et retire les membres qui ne sont pas confirmés."
  options:
    ca:
      en: "Conditional Access evaluates the conditions of a sign-in, such as the device or multifactor authentication. It neither grants access nor reviews it."
      fr: "L'accès conditionnel évalue les conditions d'une connexion, comme l'appareil ou l'authentification multifacteur. Il n'accorde pas l'accès et ne le révise pas."
    lcw:
      en: "Lifecycle workflows automate tasks when employees join, move or leave, based on attributes such as the hire date. They don't handle access requests from partners."
      fr: "Les workflows de cycle de vie automatisent des tâches lorsque des employés arrivent, changent de poste ou partent, à partir d'attributs comme la date d'embauche. Ils ne traitent pas les demandes d'accès de partenaires."
references:
  - title: What is entitlement management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-overview
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
