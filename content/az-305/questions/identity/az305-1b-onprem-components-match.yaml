id: az305-1b-onprem-components-match
objective: "1.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. plans several hybrid access solutions and lists the software components to deploy.

    Which component plays each role? To answer, drag the appropriate components to the correct roles. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. prévoit plusieurs solutions d'accès hybride et dresse la liste des composants logiciels à déployer.

    Quel composant joue chaque rôle ? Pour répondre, faites glisser les composants appropriés vers les rôles correspondants. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pnc, text: { en: "Private network connector", fr: "Connecteur de réseau privé" } }
    - { id: gsa, text: { en: "Global Secure Access client", fr: "Client Global Secure Access" } }
    - { id: cma, text: { en: "Azure Connected Machine agent", fr: "Agent Azure Connected Machine" } }
    - { id: pa, text: { en: "Microsoft Entra provisioning agent", fr: "Agent d'approvisionnement Microsoft Entra" } }
    - { id: pta, text: { en: "Pass-through authentication agent", fr: "Agent d'authentification directe" } }
  targets:
    - id: t1
      text: { en: "Runs in the datacenter and opens the outbound connections through which application proxy reaches on-premises web applications", fr: "S'exécute dans le centre de données et ouvre les connexions sortantes par lesquelles le proxy d'application atteint les applications web locales" }
    - id: t2
      text: { en: "Runs on each on-premises server so that the server becomes an Azure resource", fr: "S'exécute sur chaque serveur local afin que le serveur devienne une ressource Azure" }
    - id: t3
      text: { en: "Runs in the datacenter and writes Microsoft Entra security groups to AD DS for Cloud Sync", fr: "S'exécute dans le centre de données et écrit des groupes de sécurité Microsoft Entra dans AD DS pour Cloud Sync" }
    - id: t4
      text: { en: "Runs on user devices and sends the traffic for private resources to Microsoft Entra Private Access", fr: "S'exécute sur les appareils des utilisateurs et envoie à Microsoft Entra Private Access le trafic destiné aux ressources privées" }
answer:
  mapping: { t1: pnc, t2: cma, t3: pa, t4: gsa }
explanation:
  correct:
    en: "The private network connector is the on-premises agent of application proxy (and of Private Access): it only makes outbound connections. The Azure Connected Machine agent onboards a server to Azure Arc and gives it an Azure resource ID. Cloud Sync runs on provisioning agents, which also provision cloud groups to AD DS. The Global Secure Access client is installed on devices to reach private resources without a VPN."
    fr: "Le connecteur de réseau privé est l'agent local du proxy d'application (et de Private Access) : il n'établit que des connexions sortantes. L'agent Azure Connected Machine intègre un serveur à Azure Arc et lui donne un ID de ressource Azure. Cloud Sync s'exécute sur des agents d'approvisionnement, qui approvisionnent aussi des groupes cloud dans AD DS. Le client Global Secure Access est installé sur les appareils pour atteindre les ressources privées sans VPN."
  options:
    pta:
      en: "The pass-through authentication agent validates passwords against AD DS for cloud sign-ins; it plays none of the four roles."
      fr: "L'agent d'authentification directe valide des mots de passe auprès d'AD DS pour les connexions au cloud ; il ne joue aucun des quatre rôles."
references:
  - title: Microsoft Entra application proxy
    url: https://learn.microsoft.com/en-us/entra/identity/app-proxy/overview-what-is-app-proxy
  - title: What is Azure Arc-enabled servers?
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/overview
