id: az305-1b-onprem-group-provisioning
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. runs an ERP application in its datacenter. The application uses Kerberos and authorizes users from their membership of a security group in Active Directory Domain Services (AD DS). The Litware users are synchronized to Microsoft Entra ID by Microsoft Entra Cloud Sync, and Litware has Microsoft Entra ID Governance licenses.

    You need to recommend a solution that meets the following requirements:

    - Access to the ERP application is requested and approved in Microsoft Entra ID through access packages, and expires after 180 days.
    - The membership of the group that the application checks follows these assignments automatically.
    - The application isn't modified.

    What should you include in the recommendation?
  fr: |
    Litware, Inc. exécute une application ERP dans son centre de données. L'application utilise Kerberos et autorise les utilisateurs d'après leur appartenance à un groupe de sécurité dans Active Directory Domain Services (AD DS). Les utilisateurs de Litware sont synchronisés vers Microsoft Entra ID par Microsoft Entra Cloud Sync, et Litware dispose de licences Microsoft Entra ID Governance.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - L'accès à l'application ERP est demandé et approuvé dans Microsoft Entra ID au moyen de packages d'accès, et expire au bout de 180 jours.
    - L'appartenance au groupe que l'application vérifie suit automatiquement ces attributions.
    - L'application n'est pas modifiée.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - id: a
      text: { en: "Password writeback from Microsoft Entra ID to AD DS", fr: "La réécriture du mot de passe de Microsoft Entra ID vers AD DS" }
    - id: b
      text: { en: "Cross-tenant synchronization of a Microsoft Entra security group", fr: "La synchronisation interlocataire d'un groupe de sécurité Microsoft Entra" }
    - id: c
      text: { en: "Provisioning of a Microsoft Entra security group to AD DS with Cloud Sync", fr: "L'approvisionnement d'un groupe de sécurité Microsoft Entra dans AD DS avec Cloud Sync" }
    - id: d
      text: { en: "Microsoft Entra Domain Services with a group of the managed domain", fr: "Microsoft Entra Domain Services avec un groupe du domaine managé" }
answer: { optionId: c }
explanation:
  correct:
    en: "Cloud Sync can provision a security group that is managed in Microsoft Entra ID to AD DS, either a new group or an existing AD DS group whose source of authority was converted. Entitlement management then adds and removes members through access packages with approval and expiration, and Cloud Sync writes the membership to AD DS, where the unchanged Kerberos application reads it."
    fr: "Cloud Sync peut approvisionner dans AD DS un groupe de sécurité géré dans Microsoft Entra ID, qu'il s'agisse d'un nouveau groupe ou d'un groupe AD DS existant dont la source d'autorité a été convertie. La gestion des droits d'utilisation ajoute et retire ensuite des membres au moyen de packages d'accès avec approbation et expiration, et Cloud Sync écrit l'appartenance dans AD DS, où l'application Kerberos inchangée la lit."
  options:
    a:
      en: "Password writeback sends reset passwords to AD DS. It has no effect on group membership."
      fr: "La réécriture du mot de passe envoie vers AD DS les mots de passe réinitialisés. Elle n'a aucun effet sur l'appartenance aux groupes."
    b:
      en: "Cross-tenant synchronization copies users and groups to another Microsoft Entra tenant, not to an AD DS forest."
      fr: "La synchronisation interlocataire copie des utilisateurs et des groupes vers un autre locataire Microsoft Entra, pas vers une forêt AD DS."
    d:
      en: "A group of a managed domain in Azure isn't the group of the on-premises forest that the application checks."
      fr: "Un groupe d'un domaine managé dans Azure n'est pas le groupe de la forêt locale que l'application vérifie."
references:
  - title: Govern on-premises Active Directory Domain Services based apps (Kerberos) using Microsoft Entra ID Governance
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/cloud-sync/govern-on-premises-groups
