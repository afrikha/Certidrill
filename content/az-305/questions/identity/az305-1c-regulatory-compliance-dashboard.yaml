id: az305-1c-regulatory-compliance-dashboard
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso hosts a payment application in 12 Azure subscriptions. External auditors ask Contoso to show how its Azure resources comply with PCI DSS.

    You need to recommend a solution that meets the following requirements:

    - The state of the resources must be presented control by control, with the resources that pass and those that fail.
    - A report of the assessment must be available for download.
    - Administrative effort must be minimized.

    What should you recommend?
  fr: |
    Contoso héberge une application de paiement dans 12 abonnements Azure. Des auditeurs externes demandent à Contoso de montrer la conformité de ses ressources Azure à la norme PCI DSS.

    Vous devez recommander une solution qui respecte les exigences suivantes :

    - L'état des ressources doit être présenté contrôle par contrôle, avec les ressources conformes et celles qui ne le sont pas.
    - Un rapport de l'évaluation doit pouvoir être téléchargé.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "The audit reports that are published in the Service Trust Portal", fr: "Les rapports d'audit publiés dans le Portail d'approbation de services (Service Trust Portal)" }
    - id: b
      text: { en: "The security recommendations and the score of Azure Advisor", fr: "Les recommandations de sécurité et le score d'Azure Advisor" }
    - id: c
      text: { en: "The regulatory compliance dashboard of Microsoft Defender for Cloud", fr: "Le tableau de bord de conformité réglementaire de Microsoft Defender pour le cloud" }
    - id: d
      text: { en: "An Azure Monitor workbook based on the activity logs of the subscriptions", fr: "Un classeur Azure Monitor basé sur les journaux d'activité des abonnements" }
answer: { optionId: c }
explanation:
  correct:
    en: "The regulatory compliance dashboard of Microsoft Defender for Cloud assesses the subscriptions against the standards that you add, such as PCI DSS, once a paid Defender for Cloud plan is enabled. It shows each control with its passing and failing resources, and a report of the compliance status can be downloaded for auditors."
    fr: "Le tableau de bord de conformité réglementaire de Microsoft Defender pour le cloud évalue les abonnements par rapport aux normes que vous ajoutez, comme PCI DSS, dès qu'un plan payant de Defender pour le cloud est activé. Il présente chaque contrôle avec ses ressources conformes et non conformes, et un rapport de l'état de conformité peut être téléchargé pour les auditeurs."
  options:
    a:
      en: "The Service Trust Portal publishes the audit reports about Microsoft's own cloud services. It says nothing about the configuration of Contoso's resources."
      fr: "Le Service Trust Portal publie les rapports d'audit sur les services cloud de Microsoft. Il ne dit rien de la configuration des ressources de Contoso."
    b:
      en: "Azure Advisor lists recommendations by category, but it doesn't map the resources to the controls of a regulatory standard."
      fr: "Azure Advisor présente des recommandations par catégorie, mais il ne rattache pas les ressources aux contrôles d'une norme réglementaire."
    d:
      en: "Activity logs record operations on resources. A workbook built on them would require a custom mapping to PCI DSS and wouldn't assess the configuration of the resources."
      fr: "Les journaux d'activité enregistrent les opérations sur les ressources. Un classeur construit sur eux exigerait un rattachement personnalisé à PCI DSS et n'évaluerait pas la configuration des ressources."
references:
  - title: Improve regulatory compliance
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/regulatory-compliance-dashboard
