id: az305-1a-route-two-workspaces
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a key vault named **KV1** in the West Europe region. The same region contains two Log Analytics workspaces named **WS-Ops** and **WS-Sec**, and a storage account named **starchive1**.

    The audit logs of KV1 must be sent to WS-Ops, to WS-Sec and to starchive1.

    You need to recommend a routing configuration that uses the fewest diagnostic settings.

    What should you recommend?
  fr: |
    Fabrikam dispose d'un coffre de clés nommé **KV1** dans la région Europe Ouest. La même région contient deux espaces de travail Log Analytics nommés **WS-Ops** et **WS-Sec**, ainsi qu'un compte de stockage nommé **starchive1**.

    Les journaux d'audit de KV1 doivent être envoyés vers WS-Ops, vers WS-Sec et vers starchive1.

    Vous devez recommander une configuration de routage qui utilise le moins possible de paramètres de diagnostic.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "One diagnostic setting whose destinations are WS-Ops, WS-Sec and starchive1"
        fr: "Un paramètre de diagnostic dont les destinations sont WS-Ops, WS-Sec et starchive1"
    - id: b
      text:
        en: "Three diagnostic settings, each with a single destination"
        fr: "Trois paramètres de diagnostic, chacun avec une seule destination"
    - id: c
      text:
        en: "Two diagnostic settings: one to WS-Ops and starchive1, and one to WS-Sec"
        fr: "Deux paramètres de diagnostic : un vers WS-Ops et starchive1, et un vers WS-Sec"
    - id: d
      text:
        en: "One diagnostic setting to WS-Ops and starchive1, and a data export rule from WS-Ops to WS-Sec"
        fr: "Un paramètre de diagnostic vers WS-Ops et starchive1, et une règle d'exportation de données de WS-Ops vers WS-Sec"
answer: { optionId: c }
explanation:
  correct:
    en: |
      A diagnostic setting can define no more than one destination of each type. A workspace and a storage account fit in the same setting, but the second workspace requires a second setting. A resource accepts up to five diagnostic settings, so two is possible and is the minimum here.
    fr: |
      Un paramètre de diagnostic ne peut pas définir plus d'une destination de chaque type. Un espace de travail et un compte de stockage tiennent dans le même paramètre, mais le second espace de travail demande un second paramètre. Une ressource accepte jusqu'à cinq paramètres de diagnostic : deux est donc possible, et c'est ici le minimum.
  options:
    a:
      en: "Two Log Analytics workspaces are two destinations of the same type, which a single diagnostic setting doesn't allow."
      fr: "Deux espaces de travail Log Analytics sont deux destinations du même type, ce qu'un seul paramètre de diagnostic n'autorise pas."
    b:
      en: "It works, but it uses one more diagnostic setting than necessary."
      fr: "Cette option fonctionne, mais utilise un paramètre de diagnostic de plus que nécessaire."
    d:
      en: "A data export rule sends workspace data to a storage account or an event hub, not to another workspace."
      fr: "Une règle d'exportation de données envoie les données d'un espace de travail vers un compte de stockage ou un hub d'événements, pas vers un autre espace de travail."
references:
  - title: Diagnostic settings in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings
