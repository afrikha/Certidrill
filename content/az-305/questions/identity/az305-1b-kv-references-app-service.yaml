id: az305-1b-kv-references-app-service
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has a web app on Azure App Service. The app reads the connection string of its database from an application setting, where anyone who can view the configuration of the app can read it.

    You need to recommend a solution that meets the following requirements:

    - The connection string is stored in Azure Key Vault.
    - The code of the app isn't modified.
    - No credential is stored to access the vault.

    What should you recommend?
  fr: |
    Tailspin Toys dispose d'une application web sur Azure App Service. L'application lit la chaîne de connexion de sa base de données dans un paramètre d'application, où toute personne qui peut consulter la configuration de l'application peut la lire.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - La chaîne de connexion est stockée dans Azure Key Vault.
    - Le code de l'application n'est pas modifié.
    - Aucune information d'identification n'est stockée pour accéder au coffre.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A Key Vault reference in Azure App Configuration, read by the App Configuration provider", fr: "Une référence Key Vault dans Azure App Configuration, lue par le fournisseur App Configuration" }
    - id: b
      text: { en: "A service principal whose client secret is kept in an application setting", fr: "Un principal de service dont le secret client est conservé dans un paramètre d'application" }
    - id: c
      text: { en: "A deployment slot setting that stays with the production slot", fr: "Un paramètre d'emplacement de déploiement qui reste attaché à l'emplacement de production" }
    - id: d
      text: { en: "A Key Vault reference in the application setting, with the managed identity of the app", fr: "Une référence Key Vault dans le paramètre d'application, avec l'identité managée de l'application" }
answer: { optionId: d }
explanation:
  correct:
    en: "An application setting of App Service can hold a Key Vault reference instead of the value. The platform resolves it with the managed identity of the app, which only needs to read secrets (Key Vault Secrets User), and the app keeps reading the setting by its key: no code change and no stored credential."
    fr: "Un paramètre d'application d'App Service peut contenir une référence Key Vault à la place de la valeur. La plateforme la résout avec l'identité managée de l'application, qui a seulement besoin de lire les secrets (Key Vault Secrets User), et l'application continue à lire le paramètre par sa clé : aucun changement de code ni aucune information d'identification stockée."
  options:
    a:
      en: "With App Configuration, the application itself must load the configuration provider and resolve the reference, which is a code change."
      fr: "Avec App Configuration, l'application doit elle-même charger le fournisseur de configuration et résoudre la référence, ce qui est un changement de code."
    b:
      en: "The client secret would be a stored credential, as readable in the configuration as the connection string is today."
      fr: "Le secret client serait une information d'identification stockée, aussi lisible dans la configuration que la chaîne de connexion l'est aujourd'hui."
    c:
      en: "A slot setting only decides whether a setting is swapped with the slot; its value stays in the configuration and not in Key Vault."
      fr: "Un paramètre d'emplacement détermine seulement si un paramètre suit l'emplacement lors d'un échange ; sa valeur reste dans la configuration et non dans Key Vault."
references:
  - title: Use Key Vault references as app settings in Azure App Service, Azure Functions, and Azure Logic Apps (Standard)
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-key-vault-references
