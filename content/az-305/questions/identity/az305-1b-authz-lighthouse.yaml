id: az305-1b-authz-lighthouse
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. has a central platform team whose accounts are in the Proseware Microsoft Entra tenant. Proseware owns nine subsidiaries. Each subsidiary has its own Microsoft Entra tenant and its own Azure subscriptions, which must stay associated with that tenant.

    You need to recommend how the platform team manages the subscriptions of the subsidiaries. The solution must meet the following requirements:

    - The engineers work from their Proseware accounts and see the resources of all the subsidiaries without switching directory.
    - No user account is created for the engineers in the tenants of the subsidiaries.
    - Each subsidiary can see what it delegated and can remove the access at any time.
    - The solution adds no cost.

    What should you recommend?
  fr: |
    Proseware, Inc. dispose d'une équipe de plateforme centrale dont les comptes se trouvent dans le locataire Microsoft Entra de Proseware. Proseware possède neuf filiales. Chaque filiale a son propre locataire Microsoft Entra et ses propres abonnements Azure, qui doivent rester associés à ce locataire.

    Vous devez recommander la manière dont l'équipe de plateforme gère les abonnements des filiales. La solution doit répondre aux exigences suivantes :

    - Les ingénieurs travaillent avec leurs comptes Proseware et voient les ressources de toutes les filiales sans changer d'annuaire.
    - Aucun compte d'utilisateur n'est créé pour les ingénieurs dans les locataires des filiales.
    - Chaque filiale peut voir ce qu'elle a délégué et retirer l'accès à tout moment.
    - La solution n'ajoute aucun coût.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Guest accounts for the engineers in each subsidiary tenant, with Azure role assignments", fr: "Des comptes invités pour les ingénieurs dans le locataire de chaque filiale, avec des attributions de rôles Azure" }
    - id: b
      text: { en: "Azure Lighthouse delegations of the subscriptions to the Proseware tenant", fr: "Des délégations Azure Lighthouse des abonnements vers le locataire Proseware" }
    - id: c
      text: { en: "Cross-tenant synchronization to each subsidiary tenant, with Azure role assignments", fr: "La synchronisation interlocataire vers le locataire de chaque filiale, avec des attributions de rôles Azure" }
    - id: d
      text: { en: "A transfer of the subscriptions of the subsidiaries to the Proseware tenant", fr: "Un transfert des abonnements des filiales vers le locataire Proseware" }
answer: { optionId: b }
explanation:
  correct:
    en: "With Azure Lighthouse, a customer tenant delegates subscriptions or resource groups to users, groups and roles of a managing tenant. The engineers keep signing in to their own tenant and manage the delegated resources of all the subsidiaries from there, the subsidiaries keep control and can remove the delegation, and the service has no extra cost. Enterprises with several tenants can use it as well as service providers."
    fr: "Avec Azure Lighthouse, un locataire client délègue des abonnements ou des groupes de ressources à des utilisateurs, des groupes et des rôles d'un locataire de gestion. Les ingénieurs continuent à se connecter à leur propre locataire et y gèrent les ressources déléguées de toutes les filiales ; les filiales gardent le contrôle et peuvent retirer la délégation, et le service n'entraîne aucun coût supplémentaire. Les entreprises qui ont plusieurs locataires peuvent l'utiliser au même titre que les fournisseurs de services."
  options:
    a:
      en: "Guest accounts are user objects in each subsidiary tenant, and the engineers would have to switch directory to manage each subsidiary."
      fr: "Les comptes invités sont des objets utilisateur dans le locataire de chaque filiale, et les ingénieurs devraient changer d'annuaire pour gérer chaque filiale."
    c:
      en: "Cross-tenant synchronization also creates user objects in the subsidiary tenants, and it doesn't remove the need to switch directory."
      fr: "La synchronisation interlocataire crée elle aussi des objets utilisateur dans les locataires des filiales, et elle ne supprime pas le besoin de changer d'annuaire."
    d:
      en: "The subscriptions must stay associated with the tenants of the subsidiaries."
      fr: "Les abonnements doivent rester associés aux locataires des filiales."
references:
  - title: What is Azure Lighthouse?
    url: https://learn.microsoft.com/en-us/azure/lighthouse/overview
  - title: Tenants, users, and roles in Azure Lighthouse scenarios
    url: https://learn.microsoft.com/en-us/azure/lighthouse/concepts/tenants-users-roles
