id: az305-1a-mon-aks-stores-yn
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware plans to monitor its Azure Kubernetes Service (AKS) clusters with Azure Monitor managed service for Prometheus, container log collection and Azure Managed Grafana.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de surveiller ses clusters Azure Kubernetes Service (AKS) avec le service géré Azure Monitor pour Prometheus, la collecte des journaux de conteneurs et Azure Managed Grafana.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The Prometheus metrics collected from the clusters are stored in a Log Analytics workspace."
        fr: "Les métriques Prometheus collectées sur les clusters sont stockées dans un espace de travail Log Analytics."
    - id: s2
      text:
        en: "The stdout and stderr logs of the containers are stored in a Log Analytics workspace."
        fr: "Les journaux stdout et stderr des conteneurs sont stockés dans un espace de travail Log Analytics."
    - id: s3
      text:
        en: "Azure Managed Grafana can display the Prometheus metrics collected from the clusters."
        fr: "Azure Managed Grafana peut afficher les métriques Prometheus collectées sur les clusters."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Managed Prometheus stores its metrics in an Azure Monitor workspace, which holds Prometheus and OpenTelemetry metrics queried with PromQL; it isn't a Log Analytics workspace. Container logs and Kubernetes events are collected by a containerized agent and sent to a Log Analytics workspace, where they are queried with KQL. Azure Managed Grafana integrates with managed Prometheus and provides predefined Kubernetes dashboards.
    fr: |
      Le service Prometheus managé stocke ses métriques dans un espace de travail Azure Monitor, qui contient des métriques Prometheus et OpenTelemetry interrogées en PromQL ; ce n'est pas un espace de travail Log Analytics. Les journaux de conteneurs et les événements Kubernetes sont collectés par un agent conteneurisé et envoyés vers un espace de travail Log Analytics, où ils s'interrogent en KQL. Azure Managed Grafana s'intègre au service Prometheus managé et fournit des tableaux de bord Kubernetes prédéfinis.
references:
  - title: Kubernetes monitoring in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/containers/kubernetes-monitoring-overview
  - title: Azure Monitor workspace
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/metrics/azure-monitor-workspace-overview
