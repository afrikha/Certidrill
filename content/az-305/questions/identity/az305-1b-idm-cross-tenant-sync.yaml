id: az305-1b-idm-cross-tenant-sync
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank merges with Proseware, Inc. Each company keeps its own Microsoft Entra tenant. The 4,000 employees of the Proseware tenant must use line-of-business applications that are registered in the Woodgrove tenant.

    You need to recommend a solution that meets the following requirements:

    - Accounts in the Woodgrove tenant are created, updated and removed automatically when employees join, change or leave Proseware.
    - Employees receive no invitation email and see no consent prompt.
    - Employees keep authenticating in the Proseware tenant.
    - No custom script has to be written or maintained.

    What should you recommend?
  fr: |
    Woodgrove Bank fusionne avec Proseware, Inc. Chaque société conserve son propre locataire Microsoft Entra. Les 4 000 employés du locataire Proseware doivent utiliser des applications métier inscrites dans le locataire Woodgrove.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Les comptes du locataire Woodgrove sont créés, mis à jour et supprimés automatiquement lorsque des employés rejoignent Proseware, changent de poste ou quittent la société.
    - Les employés ne reçoivent aucun e-mail d'invitation et ne voient aucune demande de consentement.
    - Les employés continuent à s'authentifier dans le locataire Proseware.
    - Aucun script personnalisé n'est à écrire ni à maintenir.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "B2B direct connect enabled in both tenants", fr: "La connexion directe B2B activée dans les deux locataires" }
    - id: b
      text: { en: "A bulk invitation of the Proseware users as guests in the Woodgrove tenant", fr: "Une invitation en bloc des utilisateurs Proseware en tant qu'invités dans le locataire Woodgrove" }
    - id: c
      text: { en: "Microsoft Entra Cloud Sync agents configured for the Woodgrove tenant", fr: "Des agents Microsoft Entra Cloud Sync configurés pour le locataire Woodgrove" }
    - id: d
      text: { en: "Cross-tenant synchronization configured in the Proseware tenant", fr: "La synchronisation interlocataire configurée dans le locataire Proseware" }
answer: { optionId: d }
explanation:
  correct:
    en: "Cross-tenant synchronization is pushed from the source tenant: it creates, updates and deletes B2B collaboration users in the target tenant as the source users change. With automatic redemption enabled on both sides, users get no invitation email and no consent prompt, and they still sign in to their home tenant."
    fr: "La synchronisation interlocataire est poussée depuis le locataire source : elle crée, met à jour et supprime des utilisateurs de collaboration B2B dans le locataire cible au fil des changements des utilisateurs sources. Avec l'acceptation automatique des invitations (automatic redemption) activée des deux côtés, les utilisateurs ne reçoivent ni e-mail d'invitation ni demande de consentement, et ils continuent à se connecter à leur locataire d'origine."
  options:
    a:
      en: "B2B direct connect only serves Teams shared channels and creates no user object in the Woodgrove tenant, so the users can't be assigned to line-of-business applications."
      fr: "La connexion directe B2B ne sert qu'aux canaux partagés de Teams et ne crée aucun objet utilisateur dans le locataire Woodgrove : les utilisateurs ne peuvent donc pas être affectés aux applications métier."
    b:
      en: "A bulk invitation is a one-time operation. Later hires, changes and departures would have to be handled by scripts or by hand."
      fr: "Une invitation en bloc est une opération ponctuelle. Les embauches, les changements et les départs ultérieurs devraient être traités par des scripts ou à la main."
    c:
      en: "Cloud Sync synchronizes an AD DS forest to a tenant. It doesn't synchronize users from one Microsoft Entra tenant to another."
      fr: "Cloud Sync synchronise une forêt AD DS vers un locataire. Il ne synchronise pas des utilisateurs d'un locataire Microsoft Entra vers un autre."
references:
  - title: What is cross-tenant synchronization?
    url: https://learn.microsoft.com/en-us/entra/identity/multi-tenant-organizations/cross-tenant-synchronization-overview
  - title: B2B direct connect overview
    url: https://learn.microsoft.com/en-us/entra/external-id/b2b-direct-connect-overview
