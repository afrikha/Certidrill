id: az305-1b-kv-rbac-pim-identities
objective: "1.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. deploys key vaults for its production applications, which run on Azure App Service and Azure Kubernetes Service (AKS).

    You need to recommend an access design that meets the following requirements:

    - The security engineers get access to the secrets only just in time, through Privileged Identity Management, with approval.
    - A user who has the Contributor role on the resource group of a vault can't give themselves access to the secrets.
    - The applications read their secrets without any stored credential.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. déploie des coffres de clés pour ses applications de production, qui s'exécutent sur Azure App Service et Azure Kubernetes Service (AKS).

    Vous devez recommander une conception des accès qui répond aux exigences suivantes :

    - Les ingénieurs de sécurité n'obtiennent l'accès aux secrets que juste-à-temps, par Privileged Identity Management, avec approbation.
    - Un utilisateur qui détient le rôle Contributor sur le groupe de ressources d'un coffre ne peut pas s'accorder l'accès aux secrets.
    - Les applications lisent leurs secrets sans aucune information d'identification stockée.

    Quelles sont les deux actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Use the Azure RBAC permission model on the vaults.", fr: "Utiliser le modèle d'autorisation Azure RBAC sur les coffres." }
    - id: b
      text: { en: "Use vault access policies on the vaults.", fr: "Utiliser des stratégies d'accès de coffre sur les coffres." }
    - id: c
      text: { en: "Assign the Key Vault Administrator role permanently to the security engineers.", fr: "Attribuer de manière permanente le rôle Key Vault Administrator aux ingénieurs de sécurité." }
    - id: d
      text: { en: "Authenticate the applications with managed identities.", fr: "Authentifier les applications avec des identités managées." }
    - id: e
      text: { en: "Authenticate the applications with a service principal and a client secret.", fr: "Authentifier les applications avec un principal de service et un secret client." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "With the Azure RBAC permission model, access to the contents of a vault comes from role assignments, which support eligible, just-in-time assignments in Privileged Identity Management, and which a Contributor can't create. Managed identities let the applications authenticate to Key Vault with credentials that Azure manages, so nothing is stored in code or configuration."
    fr: "Avec le modèle d'autorisation Azure RBAC, l'accès au contenu d'un coffre provient d'attributions de rôles, qui prennent en charge les attributions éligibles juste-à-temps dans Privileged Identity Management, et qu'un Contributor ne peut pas créer. Les identités managées permettent aux applications de s'authentifier auprès de Key Vault avec des informations d'identification gérées par Azure : rien n'est stocké dans le code ni dans la configuration."
  options:
    b:
      en: "With access policies, a user who can write to the vault resource, such as a Contributor, can add a policy that gives them access to the secrets, and Privileged Identity Management isn't supported."
      fr: "Avec les stratégies d'accès, un utilisateur qui peut écrire sur la ressource coffre, tel qu'un Contributor, peut ajouter une stratégie qui lui donne accès aux secrets, et Privileged Identity Management n'est pas pris en charge."
    c:
      en: "A permanent assignment gives standing access, without request or approval."
      fr: "Une attribution permanente donne un accès continu, sans demande ni approbation."
    e:
      en: "A client secret is a credential that the applications would have to store and rotate."
      fr: "Un secret client est une information d'identification que les applications devraient stocker et renouveler."
references:
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
  - title: Secure your Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/best-practices
