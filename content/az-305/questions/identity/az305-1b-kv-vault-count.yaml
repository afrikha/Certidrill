id: az305-1b-kv-vault-count
objective: "1.2.5"
type: single
difficulty: 3
shuffle: false
status: draft
stem:
  en: |
    Northwind Traders runs three independent applications named App1, App2 and App3. Each application has a test environment and a production environment. Each environment is deployed in the West Europe region and in the East US region, with secrets that are specific to the region.

    You need to recommend a key vault topology that meets the following requirements:

    - An identity that is compromised in one application can't read the secrets of another application.
    - The identities of the test environments have no access to production secrets.
    - A deployment reads its secrets from a vault in its own region.
    - Access is granted at the vault scope only, never on individual secrets.

    What is the minimum number of key vaults that you should recommend?
  fr: |
    Northwind Traders exécute trois applications indépendantes nommées App1, App2 et App3. Chaque application a un environnement de test et un environnement de production. Chaque environnement est déployé dans la région West Europe et dans la région East US, avec des secrets propres à la région.

    Vous devez recommander une topologie de coffres de clés qui répond aux exigences suivantes :

    - Une identité compromise dans une application ne peut pas lire les secrets d'une autre application.
    - Les identités des environnements de test n'ont aucun accès aux secrets de production.
    - Un déploiement lit ses secrets dans un coffre de sa propre région.
    - L'accès est accordé à l'étendue du coffre uniquement, jamais sur des secrets individuels.

    Quel est le nombre minimal de coffres de clés à recommander ?
body:
  options:
    - { id: a, text: "4" }
    - { id: b, text: "6" }
    - { id: c, text: "12" }
    - { id: d, text: "24" }
answer: { optionId: c }
explanation:
  correct:
    en: "A vault is a security boundary, and Microsoft recommends one vault per application, per environment and per region. With access granted at the vault scope, each combination needs its own vault: 3 applications × 2 environments × 2 regions = 12 vaults."
    fr: "Un coffre est une limite de sécurité, et Microsoft recommande un coffre par application, par environnement et par région. Avec un accès accordé à l'étendue du coffre, chaque combinaison a besoin de son propre coffre : 3 applications × 2 environnements × 2 régions = 12 coffres."
  options:
    a:
      en: "Four vaults (one per environment and per region) would be shared by the three applications, so one compromised application could read the secrets of the others."
      fr: "Quatre coffres (un par environnement et par région) seraient partagés par les trois applications : une application compromise pourrait lire les secrets des autres."
    b:
      en: "Six vaults leave out one dimension: one vault per application and per environment serves both regions from a single region, and one vault per application and per region is shared by test and production."
      fr: "Six coffres laissent de côté une dimension : un coffre par application et par environnement sert les deux régions à partir d'une seule, et un coffre par application et par région est partagé par le test et la production."
    d:
      en: "Twelve vaults already isolate every application, environment and region; twice as many aren't needed."
      fr: "Douze coffres isolent déjà chaque application, chaque environnement et chaque région ; il n'en faut pas deux fois plus."
references:
  - title: Secure your Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/best-practices
