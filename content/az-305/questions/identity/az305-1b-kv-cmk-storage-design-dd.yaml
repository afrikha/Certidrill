id: az305-1b-kv-cmk-storage-design-dd
objective: "1.2.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. will create new storage accounts that are encrypted with a customer-managed key. The key is stored in a key vault named **kv-cmk**, which uses the Azure RBAC permission model and has purge protection enabled.

    You need to recommend a design that meets the following requirements:

    - The encryption with the customer-managed key is configured at the time each storage account is created.
    - After the key is rotated in kv-cmk, the storage accounts use the new version without any change to their configuration.
    - The identity that accesses the key has the least privilege.

    What should you include in the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. va créer de nouveaux comptes de stockage chiffrés avec une clé gérée par le client. La clé est stockée dans un coffre de clés nommé **kv-cmk**, qui utilise le modèle d'autorisation Azure RBAC et sur lequel la protection contre la suppression définitive est activée.

    Vous devez recommander une conception qui répond aux exigences suivantes :

    - Le chiffrement avec la clé gérée par le client est configuré au moment de la création de chaque compte de stockage.
    - Après une rotation de la clé dans kv-cmk, les comptes de stockage utilisent la nouvelle version sans aucune modification de leur configuration.
    - L'identité qui accède à la clé dispose du moindre privilège.

    Que devez-vous inclure dans la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Identity that the storage accounts use to access the key: [[id]]

      Key reference that is configured on the storage accounts: [[ref]]

      Role that is assigned to the identity on kv-cmk: [[role]]
    fr: |
      Identité que les comptes de stockage utilisent pour accéder à la clé : [[id]]

      Référence de clé configurée sur les comptes de stockage : [[ref]]

      Rôle attribué à l'identité sur kv-cmk : [[role]]
  slots:
    - id: id
      options:
        - { id: sys, text: { en: "A system-assigned managed identity", fr: "Une identité managée affectée par le système" } }
        - { id: usr, text: { en: "A user-assigned managed identity", fr: "Une identité managée affectée par l'utilisateur" } }
        - { id: sp, text: { en: "A service principal with a client secret", fr: "Un principal de service avec un secret client" } }
    - id: ref
      options:
        - { id: ver, text: { en: "The key URI with the current key version", fr: "L'URI de la clé avec la version actuelle de la clé" } }
        - { id: nover, text: { en: "The key URI without a key version", fr: "L'URI de la clé sans version de clé" } }
        - { id: sec, text: { en: "The URI of a secret that contains the key", fr: "L'URI d'un secret qui contient la clé" } }
    - id: role
      options:
        - { id: officer, text: Key Vault Crypto Officer }
        - { id: secuser, text: Key Vault Secrets User }
        - { id: contrib, text: Key Vault Contributor }
        - { id: encuser, text: Key Vault Crypto Service Encryption User }
answer:
  values: { id: usr, ref: nover, role: encuser }
explanation:
  correct:
    en: "When customer-managed keys are configured at the creation of a storage account, the account must use a user-assigned managed identity: a system-assigned identity exists only after the account does. If the key version is omitted, Azure Storage checks the vault daily and uses the latest version by itself. Key Vault Crypto Service Encryption User grants only what the service needs: reading the key metadata and wrapping and unwrapping."
    fr: "Lorsque des clés gérées par le client sont configurées à la création d'un compte de stockage, le compte doit utiliser une identité managée affectée par l'utilisateur : une identité affectée par le système n'existe qu'une fois le compte créé. Si la version de la clé est omise, Stockage Azure interroge le coffre chaque jour et utilise de lui-même la dernière version. Key Vault Crypto Service Encryption User n'accorde que ce dont le service a besoin : lire les métadonnées de la clé et effectuer les opérations wrap et unwrap."
  options:
    ver:
      en: "With an explicit version, the storage account keeps using that version until its configuration is updated by hand."
      fr: "Avec une version explicite, le compte de stockage continue à utiliser cette version jusqu'à ce que sa configuration soit mise à jour à la main."
    officer:
      en: "Key Vault Crypto Officer can perform any action on keys, including creating and deleting them, which is more than the encryption service needs."
      fr: "Key Vault Crypto Officer peut effectuer toutes les actions sur les clés, y compris les créer et les supprimer, ce qui dépasse le besoin du service de chiffrement."
    contrib:
      en: "Key Vault Contributor manages the vault in the control plane and gives no access to keys."
      fr: "Key Vault Contributor gère le coffre dans le plan de contrôle et ne donne aucun accès aux clés."
references:
  - title: Customer-managed keys for Azure Storage encryption
    url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
