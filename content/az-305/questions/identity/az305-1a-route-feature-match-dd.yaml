id: az305-1a-route-feature-match-dd
objective: "1.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware is designing how monitoring data is routed in Azure Monitor.

    You need to recommend the Azure Monitor object that provides each of the following data flows.

    Which object should you recommend for each data flow? To answer, drag the appropriate objects to the correct data flows. Each object may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware conçoit l'acheminement des données de monitoring dans Azure Monitor.

    Vous devez recommander l'objet Azure Monitor qui assure chacun des flux de données suivants.

    Quel objet devez-vous recommander pour chaque flux de données ? Pour répondre, faites glisser les objets appropriés vers les flux de données correspondants. Chaque objet peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: diag, text: { en: "Diagnostic setting", fr: "Paramètre de diagnostic" } }
    - { id: dcr, text: { en: "Data collection rule", fr: "Règle de collecte de données" } }
    - { id: export, text: { en: "Data export rule", fr: "Règle d'exportation de données" } }
    - { id: ag, text: { en: "Action group", fr: "Groupe d'actions" } }
    - { id: ampls, text: { en: "Azure Monitor Private Link Scope", fr: "Étendue de liaison privée Azure Monitor" } }
  targets:
    - id: t1
      text:
        en: "Send the resource logs of an Azure SQL database to a Log Analytics workspace."
        fr: "Envoyer les journaux de ressources d'une base de données Azure SQL vers un espace de travail Log Analytics."
    - id: t2
      text:
        en: "Define which Windows events the Azure Monitor Agent collects on virtual machines and where it sends them."
        fr: "Définir quels événements Windows l'agent Azure Monitor collecte sur les machines virtuelles et où il les envoie."
    - id: t3
      text:
        en: "Continuously copy the new records of a workspace table to a storage account."
        fr: "Copier en continu les nouveaux enregistrements d'une table d'un espace de travail vers un compte de stockage."
answer:
  mapping: { t1: diag, t2: dcr, t3: export }
explanation:
  correct:
    en: |
      A diagnostic setting routes the resource logs and platform metrics of an Azure resource to its destinations. A data collection rule tells the Azure Monitor Agent which data to collect and to which workspace to send it. A data export rule continuously sends the new records of selected workspace tables to a storage account or an event hub.
    fr: |
      Un paramètre de diagnostic achemine les journaux de ressources et les métriques de plateforme d'une ressource Azure vers ses destinations. Une règle de collecte de données indique à l'agent Azure Monitor quelles données collecter et vers quel espace de travail les envoyer. Une règle d'exportation de données envoie en continu les nouveaux enregistrements des tables choisies d'un espace de travail vers un compte de stockage ou un hub d'événements.
  options:
    ag:
      en: "An action group defines who is notified and what runs when an alert fires; it doesn't route logs."
      fr: "Un groupe d'actions définit qui est notifié et ce qui s'exécute quand une alerte se déclenche ; il n'achemine pas de journaux."
    ampls:
      en: "A private link scope makes the traffic to Azure Monitor private; it doesn't define a data flow."
      fr: "Une étendue de liaison privée rend privé le trafic vers Azure Monitor ; elle ne définit pas de flux de données."
references:
  - title: Azure Monitor data sources and data collection methods
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/data-sources
  - title: Log Analytics data export rules in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/logs-data-export
