id: az305-1b-authz-storage-entra-only
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a storage account named **stadatumlake** that stores financial reports as blobs. The applications of Adatum access the blobs with managed identities.

    You need to recommend an authorization design that meets the following requirements:

    - Requests that are authorized with the account keys are rejected, including shared access signatures (SAS) that are signed with those keys.
    - An external auditor, who has no account in the Adatum tenant, can download one report during 48 hours.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un compte de stockage nommé **stadatumlake** qui stocke des rapports financiers sous forme d'objets blob. Les applications d'Adatum accèdent aux blobs avec des identités managées.

    Vous devez recommander une conception d'autorisation qui répond aux exigences suivantes :

    - Les requêtes autorisées avec les clés du compte sont rejetées, y compris les signatures d'accès partagé (SAS) signées avec ces clés.
    - Un auditeur externe, qui n'a pas de compte dans le locataire Adatum, peut télécharger un rapport pendant 48 heures.

    Quelles sont les deux actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Disallow Shared Key authorization on the storage account.", fr: "Interdire l'autorisation avec clé partagée sur le compte de stockage." }
    - id: b
      text: { en: "Regenerate the account keys every 30 days by using Azure Key Vault.", fr: "Régénérer les clés du compte tous les 30 jours avec Azure Key Vault." }
    - id: c
      text: { en: "Issue a service SAS that references a stored access policy.", fr: "Émettre une SAS de service qui référence une stratégie d'accès stockée." }
    - id: d
      text: { en: "Issue a user delegation SAS for the report.", fr: "Émettre une SAS de délégation d'utilisateur pour le rapport." }
    - id: e
      text: { en: "Enable anonymous read access on the container.", fr: "Activer l'accès en lecture anonyme sur le conteneur." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "When Shared Key authorization is disallowed, Azure Storage rejects every request that is authorized with an account key, and service SAS and account SAS tokens with it. A user delegation SAS is signed with a key obtained with Microsoft Entra credentials, so it keeps working: it gives the auditor time-limited access to one blob without an account in the tenant."
    fr: "Lorsque l'autorisation avec clé partagée est interdite, Stockage Azure rejette toute requête autorisée avec une clé de compte, et avec elle les SAS de service et les SAS de compte. Une SAS de délégation d'utilisateur est signée avec une clé obtenue grâce à des informations d'identification Microsoft Entra : elle continue donc à fonctionner et donne à l'auditeur un accès limité dans le temps à un blob, sans compte dans le locataire."
  options:
    b:
      en: "Rotating the keys limits their lifetime, but requests signed with the current keys are still accepted."
      fr: "La rotation des clés limite leur durée de vie, mais les requêtes signées avec les clés en cours restent acceptées."
    c:
      en: "A service SAS is signed with the account key, so it is rejected once Shared Key authorization is disallowed."
      fr: "Une SAS de service est signée avec la clé du compte : elle est rejetée dès que l'autorisation avec clé partagée est interdite."
    e:
      en: "Anonymous access would let anyone read every blob of the container, with no time limit."
      fr: "L'accès anonyme permettrait à n'importe qui de lire tous les blobs du conteneur, sans limite de durée."
references:
  - title: Prevent Shared Key authorization for an Azure Storage account
    url: https://learn.microsoft.com/en-us/azure/storage/common/shared-key-authorization-prevent
  - title: Authorize access to blobs by using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-access-azure-active-directory
