id: az305-1c-policy-exemption-waiver
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders assigns an initiative of 40 policy definitions at a management group named **MG-Corp**. One of the definitions denies storage accounts that allow public network access.

    A resource group named **rg-partner-exchange**, in a subscription under MG-Corp, must host a storage account with public network access for 90 days, during the migration of a partner.

    You need to recommend how to handle this exception. The solution must meet the following requirements:

    - Only the definition about public network access must stop applying to rg-partner-exchange. The 39 other definitions must still be evaluated there.
    - The exception must end automatically after 90 days.
    - Compliance reports must show the exception as documented, not as a violation.

    What should you recommend?
  fr: |
    Northwind Traders attribue une initiative de 40 définitions de stratégies sur un groupe d'administration nommé **MG-Corp**. L'une des définitions refuse les comptes de stockage qui autorisent l'accès au réseau public.

    Un groupe de ressources nommé **rg-partner-exchange**, dans un abonnement situé sous MG-Corp, doit héberger pendant 90 jours un compte de stockage avec accès au réseau public, le temps de la migration d'un partenaire.

    Vous devez recommander la façon de traiter cette exception. La solution doit respecter les exigences suivantes :

    - Seule la définition sur l'accès au réseau public doit cesser de s'appliquer à rg-partner-exchange. Les 39 autres définitions doivent toujours y être évaluées.
    - L'exception doit prendre fin automatiquement après 90 jours.
    - Les rapports de conformité doivent présenter l'exception comme documentée, pas comme une violation.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "An excluded scope for the resource group on the initiative assignment, to be removed after 90 days", fr: "Une étendue exclue pour le groupe de ressources sur l'attribution de l'initiative, à retirer après 90 jours" }
    - id: b
      text: { en: "A second assignment of the initiative on the resource group, with the enforcement mode set to Disabled", fr: "Une seconde attribution de l'initiative sur le groupe de ressources, avec le mode d'application défini sur Disabled" }
    - id: c
      text: { en: "A move of the subscription to a management group outside MG-Corp, to be reverted after 90 days", fr: "Un déplacement de l'abonnement vers un groupe d'administration extérieur à MG-Corp, à annuler après 90 jours" }
    - id: d
      text: { en: "A policy exemption on the resource group, limited to that definition, with an expiration date", fr: "Une exemption de stratégie sur le groupe de ressources, limitée à cette définition, avec une date d'expiration" }
answer: { optionId: d }
explanation:
  correct:
    en: "A policy exemption targets a scope inside an assignment and, for an initiative, can be limited to chosen definitions. It carries a category, Waiver in this case, and an optional expiration date after which the definition applies again. Exempt resources get the Exempt compliance state instead of being reported as non-compliant."
    fr: "Une exemption de stratégie cible une étendue à l'intérieur d'une attribution et, pour une initiative, peut être limitée à certaines définitions. Elle porte une catégorie, Waiver dans ce cas, et une date d'expiration facultative après laquelle la définition s'applique de nouveau. Les ressources exemptées reçoivent l'état de conformité Exempt au lieu d'être signalées comme non conformes."
  options:
    a:
      en: "An excluded scope removes the resource group from the 40 definitions, never expires by itself and leaves no documented exception in the compliance results."
      fr: "Une étendue exclue retire le groupe de ressources des 40 définitions, n'expire jamais d'elle-même et ne laisse aucune exception documentée dans les résultats de conformité."
    b:
      en: "Assignments are cumulative. A second assignment that isn't enforced doesn't relax the deny effect of the assignment inherited from MG-Corp."
      fr: "Les attributions sont cumulatives. Une seconde attribution non appliquée n'assouplit pas l'effet deny de l'attribution héritée de MG-Corp."
    c:
      en: "Moving the subscription removes all 40 definitions from every resource group of the subscription, and it relies on a manual action to come back."
      fr: "Déplacer l'abonnement retire les 40 définitions de tous les groupes de ressources de l'abonnement, et le retour repose sur une action manuelle."
references:
  - title: Azure Policy exemption structure
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/exemption-structure
