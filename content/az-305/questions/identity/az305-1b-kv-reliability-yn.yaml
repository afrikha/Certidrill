id: az305-1b-kv-reliability-yn
objective: "1.2.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a key vault named **kv-app** in the North Europe region, which supports availability zones and has a paired region. An application reads its secrets from kv-app each time it starts.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un coffre de clés nommé **kv-app** dans la région North Europe, qui prend en charge les zones de disponibilité et possède une région jumelée. Une application lit ses secrets dans kv-app à chaque démarrage.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After Microsoft fails kv-app over to the paired region, the application can read its secrets.
        fr: Après le basculement de kv-app vers la région jumelée par Microsoft, l'application peut lire ses secrets.
    - id: s2
      text:
        en: After Microsoft fails kv-app over to the paired region, an operator can add a new version of a secret.
        fr: Après le basculement de kv-app vers la région jumelée par Microsoft, un opérateur peut ajouter une nouvelle version d'un secret.
    - id: s3
      text:
        en: To keep the secrets available when one availability zone of North Europe fails, Adatum must deploy a second key vault.
        fr: Pour que les secrets restent disponibles lorsqu'une zone de disponibilité de North Europe tombe en panne, Adatum doit déployer un second coffre de clés.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Key Vault replicates the contents of a vault to the paired region, and after a Microsoft-initiated failover the requests are routed there automatically. The vault is then read-only: secrets, keys and certificates can be read and used, but nothing can be changed. Within a region that supports availability zones, zone redundancy is automatic and needs no configuration and no second vault."
    fr: "Key Vault réplique le contenu d'un coffre vers la région jumelée, et après un basculement déclenché par Microsoft les requêtes y sont acheminées automatiquement. Le coffre est alors en lecture seule : les secrets, les clés et les certificats peuvent être lus et utilisés, mais rien ne peut être modifié. Dans une région qui prend en charge les zones de disponibilité, la redondance de zone est automatique et ne demande ni configuration ni second coffre."
references:
  - title: Reliability in Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/disaster-recovery-guidance
