id: az305-1a-route-routing-facts-yn
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is reviewing a log routing design for its Azure subscriptions and virtual machines. The design uses two Log Analytics workspaces named **WS-Ops** and **WS-Sec**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam examine une conception de routage des journaux pour ses abonnements Azure et ses machines virtuelles. La conception utilise deux espaces de travail Log Analytics nommés **WS-Ops** et **WS-Sec**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Sending the activity log of a subscription to WS-Ops incurs no data ingestion charge."
        fr: "L'envoi du journal d'activité d'un abonnement vers WS-Ops n'entraîne aucuns frais d'ingestion de données."
    - id: s2
      text:
        en: "A virtual machine can be associated with two data collection rules, one that sends performance counters to WS-Ops and one that sends security events to WS-Sec."
        fr: "Une machine virtuelle peut être associée à deux règles de collecte de données, l'une qui envoie les compteurs de performances vers WS-Ops et l'autre qui envoie les événements de sécurité vers WS-Sec."
    - id: s3
      text:
        en: "A data export rule created in WS-Ops can continuously copy a table of WS-Ops to WS-Sec."
        fr: "Une règle d'exportation de données créée dans WS-Ops peut copier en continu une table de WS-Ops vers WS-Sec."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Activity log entries have no data ingestion charge in a Log Analytics workspace. A resource can be associated with several data collection rules, and each rule defines what is collected and where it is sent, so one machine can feed two workspaces with one agent. A data export rule sends data only to a storage account or an event hub, never to another workspace.
    fr: |
      Les entrées du journal d'activité n'entraînent pas de frais d'ingestion de données dans un espace de travail Log Analytics. Une ressource peut être associée à plusieurs règles de collecte de données, et chaque règle définit ce qui est collecté et où cela est envoyé : une machine peut donc alimenter deux espaces de travail avec un seul agent. Une règle d'exportation de données n'envoie les données que vers un compte de stockage ou un hub d'événements, jamais vers un autre espace de travail.
references:
  - title: Activity log in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/activity-log
  - title: Data collection rules (DCRs) in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/data-collection/data-collection-rule-overview
