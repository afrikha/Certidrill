id: az305-1c-deployment-stack-deny-settings
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The platform team of Tailspin Toys uses a Bicep file to deploy a network foundation (a virtual network, network security groups and route tables) to each workload subscription. Workload teams have the Owner role on their subscription.

    You need to recommend how to deploy and protect the network foundation. The solution must meet the following requirements:

    - The resources must be managed as one unit. A resource that is removed from the Bicep file must be deleted at the next deployment.
    - Workload teams must not be able to modify or delete the resources of the network foundation, even though they are Owners of the subscription.
    - The identity of the deployment pipeline of the platform team must still be able to update the resources.
    - The solution must not rely on a service that is being retired.

    What should you recommend?
  fr: |
    L'équipe de plateforme de Tailspin Toys utilise un fichier Bicep pour déployer un socle réseau (un réseau virtuel, des groupes de sécurité réseau et des tables de routage) dans chaque abonnement de charge de travail. Les équipes de charges de travail ont le rôle Owner sur leur abonnement.

    Vous devez recommander la façon de déployer et de protéger le socle réseau. La solution doit respecter les exigences suivantes :

    - Les ressources doivent être gérées comme une seule unité. Une ressource retirée du fichier Bicep doit être supprimée au déploiement suivant.
    - Les équipes de charges de travail ne doivent pas pouvoir modifier ni supprimer les ressources du socle réseau, bien qu'elles soient Owner de l'abonnement.
    - L'identité du pipeline de déploiement de l'équipe de plateforme doit toujours pouvoir mettre à jour les ressources.
    - La solution ne doit pas reposer sur un service en cours de mise hors service.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A deployment stack created at the management group scope, with deny settings that exclude the pipeline identity", fr: "Une pile de déploiement créée à l'étendue du groupe d'administration, avec des paramètres de refus qui excluent l'identité du pipeline" }
    - id: b
      text: { en: "A template spec deployed by the pipeline to each subscription, with `ReadOnly` locks on the deployed resources", fr: "Une spec de modèle déployée par le pipeline dans chaque abonnement, avec des verrous `ReadOnly` sur les ressources déployées" }
    - id: c
      text: { en: "An Azure Blueprints assignment for each subscription, with the Read Only lock mode and the pipeline identity excluded", fr: "Une attribution Azure Blueprints pour chaque abonnement, avec le mode de verrouillage Read Only et l'identité du pipeline exclue" }
    - id: d
      text: { en: "A resource group deployment in complete mode by the pipeline, with a `CanNotDelete` lock on the resource group", fr: "Un déploiement de groupe de ressources en mode complet par le pipeline, avec un verrou `CanNotDelete` sur le groupe de ressources" }
answer: { optionId: a }
explanation:
  correct:
    en: "A deployment stack manages the resources of a Bicep file as one unit and can delete the resources that leave the file. Its deny settings (`denyDelete` or `denyWriteAndDelete`) create a deny assignment that applies to everyone, whatever their role, except the excluded principals, here the pipeline identity. Creating the stack at the management group scope keeps the stack and its deny assignment out of reach of the subscription Owners."
    fr: "Une pile de déploiement gère les ressources d'un fichier Bicep comme une seule unité et peut supprimer les ressources qui quittent le fichier. Ses paramètres de refus (`denyDelete` ou `denyWriteAndDelete`) créent une affectation de refus qui s'applique à tout le monde, quel que soit le rôle, sauf aux principaux exclus, ici l'identité du pipeline. Créer la pile à l'étendue du groupe d'administration met la pile et son affectation de refus hors de portée des Owner de l'abonnement."
  options:
    b:
      en: "A template spec only stores and shares the template. An Owner can remove resource locks, and the pipeline would have to remove them before each update."
      fr: "Une spec de modèle se contente de stocker et de partager le modèle. Un Owner peut retirer les verrous de ressources, et le pipeline devrait les retirer avant chaque mise à jour."
    c:
      en: "Azure Blueprints is being retired, so it can't be recommended for a new design."
      fr: "Azure Blueprints est en cours de mise hors service : il ne peut pas être recommandé pour une nouvelle conception."
    d:
      en: "A `CanNotDelete` lock doesn't prevent modifications, and an Owner can remove it. The lock would also stop complete mode from deleting the resources that leave the Bicep file."
      fr: "Un verrou `CanNotDelete` n'empêche pas les modifications, et un Owner peut le retirer. Le verrou empêcherait aussi le mode complet de supprimer les ressources qui quittent le fichier Bicep."
references:
  - title: Create and deploy Azure deployment stacks in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deployment-stacks
