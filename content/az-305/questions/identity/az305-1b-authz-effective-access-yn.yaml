id: az305-1b-authz-effective-access-yn
objective: "1.2.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    You review the authorization design of a subscription named **Sub1** that contains two resource groups named **RG1** and **RG2**.

    - A user named **User1** is a member of **Group1**, and Group1 is a member of **Group2**.
    - The role assignments are shown in the following table.

    | Principal | Role | Scope |
    | --- | --- | --- |
    | Group2 | Contributor | Sub1 |
    | User1 | Reader | RG1 |

    - The resources of RG2 are managed by a deployment stack. The deny settings of the stack block delete operations for all principals, without exclusion.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la conception des autorisations d'un abonnement nommé **Sub1** qui contient deux groupes de ressources nommés **RG1** et **RG2**.

    - Un utilisateur nommé **User1** est membre de **Group1**, et Group1 est membre de **Group2**.
    - Les attributions de rôles figurent dans le tableau suivant.

    | Principal | Rôle | Étendue |
    | --- | --- | --- |
    | Group2 | Contributor | Sub1 |
    | User1 | Reader | RG1 |

    - Les ressources de RG2 sont gérées par une pile de déploiement. Les paramètres de refus de la pile bloquent les opérations de suppression pour tous les principaux, sans exclusion.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: User1 can create a virtual machine in RG1.
        fr: User1 peut créer une machine virtuelle dans RG1.
    - id: s2
      text:
        en: User1 can delete a storage account that the deployment stack manages in RG2.
        fr: User1 peut supprimer un compte de stockage que la pile de déploiement gère dans RG2.
    - id: s3
      text:
        en: User1 can assign the Reader role on RG1 to another user.
        fr: User1 peut attribuer le rôle Reader sur RG1 à un autre utilisateur.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Role assignments to groups are transitive, so User1 receives Contributor on Sub1 through Group2, and Azure RBAC is additive: the Reader assignment on RG1 removes nothing, and User1 can create resources there. The deployment stack creates a deny assignment, and a deny assignment blocks the action even when a role assignment grants it. Contributor can't create role assignments; that requires Owner, User Access Administrator or Role Based Access Control Administrator."
    fr: "Les attributions de rôles aux groupes sont transitives : User1 reçoit donc Contributor sur Sub1 par Group2, et Azure RBAC est additif : l'attribution Reader sur RG1 ne retire rien, et User1 peut y créer des ressources. La pile de déploiement crée une affectation de refus, et une affectation de refus bloque l'action même lorsqu'une attribution de rôle l'accorde. Contributor ne peut pas créer d'attributions de rôles ; il faut pour cela Owner, User Access Administrator ou Role Based Access Control Administrator."
references:
  - title: What is Azure role-based access control (Azure RBAC)?
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
  - title: List Azure deny assignments
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/deny-assignments
