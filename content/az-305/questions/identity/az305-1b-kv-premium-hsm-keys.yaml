id: az305-1b-kv-premium-hsm-keys
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. designs the secret management of a new application in Azure.

    You need to recommend a service that meets the following requirements:

    - The encryption keys are protected by hardware security modules (HSMs) that are validated FIPS 140-3 Level 3.
    - The same service also stores the connection strings and the TLS certificates of the application.
    - A multitenant service is acceptable.
    - Costs are minimized.

    What should you recommend?
  fr: |
    Contoso, Ltd. conçoit la gestion des secrets d'une nouvelle application dans Azure.

    Vous devez recommander un service qui répond aux exigences suivantes :

    - Les clés de chiffrement sont protégées par des modules de sécurité matériels (HSM) validés FIPS 140-3 niveau 3.
    - Le même service stocke aussi les chaînes de connexion et les certificats TLS de l'application.
    - Un service multilocataire est acceptable.
    - Les coûts sont réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: Azure Key Vault Standard }
    - { id: b, text: Azure Key Vault Managed HSM }
    - { id: c, text: Azure Key Vault Premium }
    - { id: d, text: Azure Cloud HSM }
answer: { optionId: c }
explanation:
  correct:
    en: "Key Vault Premium stores keys, secrets and certificates and can protect keys in HSMs validated FIPS 140-3 Level 3. It is a multitenant service and the least expensive option that offers HSM-protected keys."
    fr: "Key Vault Premium stocke des clés, des secrets et des certificats, et peut protéger les clés dans des HSM validés FIPS 140-3 niveau 3. C'est un service multilocataire et l'option la moins coûteuse qui propose des clés protégées par HSM."
  options:
    a:
      en: "Key Vault Standard stores the three kinds of objects but protects keys in software only."
      fr: "Key Vault Standard stocke les trois sortes d'objets, mais ne protège les clés que de manière logicielle."
    b:
      en: "Managed HSM stores keys only, so the connection strings and certificates would need another service, and it costs more."
      fr: "Le HSM managé ne stocke que des clés : les chaînes de connexion et les certificats demanderaient un autre service, et il coûte plus cher."
    d:
      en: "Azure Cloud HSM is a single-tenant HSM for keys and certificates; it doesn't store secrets and costs more than a vault."
      fr: "Azure Cloud HSM est un HSM à locataire unique pour des clés et des certificats ; il ne stocke pas de secrets et coûte plus cher qu'un coffre."
references:
  - title: How to choose the right Azure key management solution
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/key-management-choose
