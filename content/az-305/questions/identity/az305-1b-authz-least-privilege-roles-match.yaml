id: az305-1b-authz-least-privilege-roles-match
objective: "1.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. designs the role assignments of three workload identities. Each identity must receive only the permissions that it needs.

    Which built-in role should you recommend for each identity? To answer, drag the appropriate roles to the correct identities. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. conçoit les attributions de rôles de trois identités de charge de travail. Chaque identité ne doit recevoir que les autorisations dont elle a besoin.

    Quel rôle intégré devez-vous recommander pour chaque identité ? Pour répondre, faites glisser les rôles appropriés vers les identités correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sbdr, text: Storage Blob Data Reader }
    - { id: sac, text: Storage Account Contributor }
    - { id: kvsu, text: Key Vault Secrets User }
    - { id: kvr, text: Key Vault Reader }
    - { id: reader, text: Reader }
    - { id: contrib, text: Contributor }
  targets:
    - id: t1
      text: { en: "The managed identity of a function app downloads blobs from a container by using Microsoft Entra authorization", fr: "L'identité managée d'une application de fonction télécharge des blobs d'un conteneur avec l'autorisation Microsoft Entra" }
    - id: t2
      text: { en: "The managed identity of a web app reads the value of a secret in a key vault that uses the Azure RBAC permission model", fr: "L'identité managée d'une application web lit la valeur d'un secret dans un coffre de clés qui utilise le modèle d'autorisation Azure RBAC" }
    - id: t3
      text: { en: "The service principal of an inventory tool lists the resources of a subscription and their properties, without access to their data", fr: "Le principal de service d'un outil d'inventaire répertorie les ressources d'un abonnement et leurs propriétés, sans accès à leurs données" }
answer:
  mapping: { t1: sbdr, t2: kvsu, t3: reader }
explanation:
  correct:
    en: "Reading blob data with Microsoft Entra ID requires a data role: Storage Blob Data Reader is the read-only one. Key Vault Secrets User reads the contents of secrets in a vault that uses Azure RBAC. Reader lets a principal view all the resources and their configuration through the control plane, without any data action."
    fr: "Lire des données de blob avec Microsoft Entra ID demande un rôle de données : Storage Blob Data Reader est celui qui se limite à la lecture. Key Vault Secrets User lit le contenu des secrets dans un coffre qui utilise Azure RBAC. Reader permet à un principal de consulter toutes les ressources et leur configuration par le plan de contrôle, sans aucune action de données."
  options:
    sac:
      en: "Storage Account Contributor manages the storage account and can list its keys; it isn't a read-only data role."
      fr: "Storage Account Contributor gère le compte de stockage et peut en lister les clés ; ce n'est pas un rôle de données en lecture seule."
    kvr:
      en: "Key Vault Reader reads the metadata of the vault and of its objects, but not the value of a secret."
      fr: "Key Vault Reader lit les métadonnées du coffre et de ses objets, mais pas la valeur d'un secret."
    contrib:
      en: "Contributor can modify and delete every resource, far beyond what any of the three identities needs."
      fr: "Contributor peut modifier et supprimer toutes les ressources, bien au-delà de ce dont chacune des trois identités a besoin."
references:
  - title: Authorize access to blobs by using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-access-azure-active-directory
  - title: Provide access to Key Vault keys, certificates, and secrets with Azure role-based access control
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
