id: az305-1b-onprem-private-access-design-dd
objective: "1.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation replaces its VPN with Microsoft Entra Private Access. Private network connectors are already installed in the datacenter.

    You need to recommend a configuration that meets the following requirements:

    - All the employees reach the general internal resources, a list of FQDNs and IP address ranges that must always be tunneled through the service.
    - Only the Finance group reaches the finance servers, and a stricter Conditional Access policy that requires a compliant device applies to these servers only.
    - On the laptops, the traffic to private resources is sent to the service without any action from the user.

    What should you include in the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation remplace son VPN par Microsoft Entra Private Access. Des connecteurs de réseau privé sont déjà installés dans le centre de données.

    Vous devez recommander une configuration qui répond aux exigences suivantes :

    - Tous les employés atteignent les ressources internes générales, une liste de FQDN et de plages d'adresses IP qui doivent toujours passer par le tunnel du service.
    - Seul le groupe Finance atteint les serveurs financiers, et une stratégie d'accès conditionnel plus stricte, qui exige un appareil conforme, s'applique à ces seuls serveurs.
    - Sur les ordinateurs portables, le trafic à destination des ressources privées est envoyé au service sans aucune action de l'utilisateur.

    Que devez-vous inclure dans la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      General internal resources: [[gen]]

      Finance servers: [[fin]]

      On each laptop: [[dev]]
    fr: |
      Ressources internes générales : [[gen]]

      Serveurs financiers : [[fin]]

      Sur chaque ordinateur portable : [[dev]]
  slots:
    - id: gen
      options:
        - { id: gsa, text: { en: "A separate Global Secure Access app", fr: "Une application Global Secure Access distincte" } }
        - { id: qa, text: { en: "Quick Access", fr: "L'Accès rapide (Quick Access)" } }
        - { id: ap, text: { en: "An application proxy application", fr: "Une application du proxy d'application" } }
        - { id: nl, text: { en: "A named location in Conditional Access", fr: "Un emplacement nommé dans l'accès conditionnel" } }
    - id: fin
      options:
        - { id: gsa, text: { en: "A separate Global Secure Access app", fr: "Une application Global Secure Access distincte" } }
        - { id: qa, text: { en: "Quick Access", fr: "L'Accès rapide (Quick Access)" } }
        - { id: ap, text: { en: "An application proxy application", fr: "Une application du proxy d'application" } }
        - { id: nl, text: { en: "A named location in Conditional Access", fr: "Un emplacement nommé dans l'accès conditionnel" } }
    - id: dev
      options:
        - { id: pnc, text: { en: "A private network connector", fr: "Un connecteur de réseau privé" } }
        - { id: vpn, text: { en: "The Azure VPN Client", fr: "Le client Azure VPN Client" } }
        - { id: arc, text: { en: "The Azure Connected Machine agent", fr: "L'agent Azure Connected Machine" } }
        - { id: client, text: { en: "The Global Secure Access client", fr: "Le client Global Secure Access" } }
answer:
  values: { gen: qa, fin: gsa, dev: client }
explanation:
  correct:
    en: "Quick Access is the primary group of FQDNs, IP addresses and ranges that are always tunneled through the service. A separate Global Secure Access app (per-app access) holds a subset of resources that needs its own assignment of users and its own Conditional Access policies, such as the finance servers. The Global Secure Access client on the devices acquires the traffic and connects users without a VPN."
    fr: "L'Accès rapide (Quick Access) est le groupe principal de FQDN, d'adresses IP et de plages qui passent toujours par le tunnel du service. Une application Global Secure Access distincte (accès par application) contient un sous-ensemble de ressources qui a besoin de sa propre affectation d'utilisateurs et de ses propres stratégies d'accès conditionnel, comme les serveurs financiers. Le client Global Secure Access installé sur les appareils capte le trafic et connecte les utilisateurs sans VPN."
  options:
    ap:
      en: "An application proxy application publishes one web application through an external URL; it doesn't tunnel FQDNs and IP ranges from the devices."
      fr: "Une application du proxy d'application publie une application web au moyen d'une URL externe ; elle ne fait pas passer par un tunnel des FQDN et des plages d'adresses IP depuis les appareils."
    nl:
      en: "A named location is a condition of a Conditional Access policy, not a definition of private resources to reach."
      fr: "Un emplacement nommé est une condition d'une stratégie d'accès conditionnel, pas une définition de ressources privées à atteindre."
    pnc:
      en: "The private network connector runs in the datacenter, not on the laptops."
      fr: "Le connecteur de réseau privé s'exécute dans le centre de données, pas sur les ordinateurs portables."
references:
  - title: Learn about Microsoft Entra Private Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-private-access
