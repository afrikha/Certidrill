id: az305-1a-auth-ca-controls-dd
objective: "1.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Microsoft Entra tenant with Microsoft Entra ID P1 licenses and manages its devices with Microsoft Intune.

    You need to recommend the Conditional Access setting that meets each of the following requirements.

    Which setting should you recommend for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID P1 et gère ses appareils avec Microsoft Intune.

    Vous devez recommander le paramètre d'accès conditionnel qui répond à chacune des exigences suivantes.

    Quel paramètre devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: compliant, text: { en: "Require device to be marked as compliant", fr: "Exiger que l'appareil soit marqué comme conforme" } }
    - { id: reportonly, text: { en: "Report-only mode", fr: "Mode rapport seul" } }
    - { id: tou, text: { en: "Require terms of use", fr: "Exiger des conditions d'utilisation" } }
    - { id: block, text: { en: "Block access", fr: "Bloquer l'accès" } }
    - { id: strength, text: { en: "Require authentication strength", fr: "Exiger une force d'authentification" } }
    - { id: pwd, text: { en: "Require password change", fr: "Exiger la modification du mot de passe" } }
  targets:
    - id: t1
      text:
        en: "Only the devices that are managed by Litware and meet its compliance policies can open the HR application."
        fr: "Seuls les appareils gérés par Litware et conformes à ses stratégies de conformité peuvent ouvrir l'application RH."
    - id: t2
      text:
        en: "The effect of a new policy on real sign-ins is measured before the policy is enforced."
        fr: "L'effet d'une nouvelle stratégie sur les connexions réelles est mesuré avant l'application de la stratégie."
    - id: t3
      text:
        en: "External auditors accept the usage rules of Litware before they access the audit portal."
        fr: "Les auditeurs externes acceptent les règles d'utilisation de Litware avant d'accéder au portail d'audit."
    - id: t4
      text:
        en: "Sign-ins that use legacy authentication protocols are refused."
        fr: "Les connexions qui utilisent des protocoles d'authentification hérités sont refusées."
answer:
  mapping: { t1: compliant, t2: reportonly, t3: tou, t4: block }
explanation:
  correct:
    en: |
      The grant control that requires a device marked as compliant admits only devices that meet the compliance policies of the organization. Report-only mode evaluates a policy at each sign-in and logs the result without enforcing it. Requiring terms of use makes users accept a document before access is granted. A policy that targets legacy authentication clients with the Block access decision refuses those sign-ins.
    fr: |
      Le contrôle d'octroi qui exige un appareil marqué comme conforme n'admet que les appareils qui respectent les stratégies de conformité de l'organisation. Le mode rapport seul évalue une stratégie à chaque connexion et journalise le résultat sans l'appliquer. Exiger des conditions d'utilisation oblige les utilisateurs à accepter un document avant que l'accès soit accordé. Une stratégie qui cible les clients d'authentification hérités avec la décision Bloquer l'accès refuse ces connexions.
  options:
    strength:
      en: "An authentication strength restricts the authentication methods that are accepted; it says nothing about the device, the legal terms or legacy protocols."
      fr: "Une force d'authentification restreint les méthodes d'authentification acceptées ; elle ne dit rien de l'appareil, des conditions juridiques ni des protocoles hérités."
    pwd:
      en: "Requiring a password change is the remediation used for users at risk."
      fr: "Exiger la modification du mot de passe est la correction utilisée pour les utilisateurs à risque."
references:
  - title: What is Conditional Access?
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
  - title: Analyze Conditional Access Policy Impact
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-report-only
