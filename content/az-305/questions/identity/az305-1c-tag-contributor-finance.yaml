id: az305-1c-tag-contributor-finance
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has 20 subscriptions in a management group named **MG-Wingtip**. The financial operations team keeps the `costcenter` and `project` tags of all the resources up to date by running Azure PowerShell scripts.

    You need to recommend a built-in role to assign to the team at MG-Wingtip. The solution must meet the following requirements:

    - The team must be able to update the tags of any resource.
    - The team must not be able to change the configuration of the resources.
    - The principle of least privilege must be applied.

    Which role should you recommend?
  fr: |
    Wingtip Toys dispose de 20 abonnements dans un groupe d'administration nommé **MG-Wingtip**. L'équipe des opérations financières tient à jour les étiquettes `costcenter` et `project` de toutes les ressources en exécutant des scripts Azure PowerShell.

    Vous devez recommander un rôle intégré à attribuer à l'équipe sur MG-Wingtip. La solution doit respecter les exigences suivantes :

    - L'équipe doit pouvoir mettre à jour les étiquettes de n'importe quelle ressource.
    - L'équipe ne doit pas pouvoir modifier la configuration des ressources.
    - Le principe du moindre privilège doit être appliqué.

    Quel rôle devez-vous recommander ?
body:
  options:
    - { id: a, text: Contributor }
    - { id: b, text: Cost Management Contributor }
    - { id: c, text: Resource Policy Contributor }
    - { id: d, text: Tag Contributor }
answer: { optionId: d }
explanation:
  correct:
    en: "Tag Contributor grants write access to the tags resource type, which is enough to tag any resource without having access to the resource itself. Assigned at the management group, it covers the 20 subscriptions, and the scripts can use Azure PowerShell for every tag operation."
    fr: "Tag Contributor accorde l'accès en écriture au type de ressource des étiquettes, ce qui suffit pour étiqueter n'importe quelle ressource sans avoir accès à la ressource elle-même. Attribué sur le groupe d'administration, il couvre les 20 abonnements, et les scripts peuvent utiliser Azure PowerShell pour toutes les opérations sur les étiquettes."
  options:
    a:
      en: "Contributor can update tags, but it can also create, change and delete every resource, which goes far beyond the need."
      fr: "Contributor peut mettre à jour les étiquettes, mais il peut aussi créer, modifier et supprimer toutes les ressources, ce qui dépasse largement le besoin."
    b:
      en: "Cost Management Contributor manages budgets, exports and cost views. It doesn't write tags on resources."
      fr: "Cost Management Contributor gère les budgets, les exportations et les vues de coûts. Il n'écrit pas d'étiquettes sur les ressources."
    c:
      en: "Resource Policy Contributor creates and assigns policies. The team could enforce tags with policies, but the role doesn't let scripts write tags directly on resources."
      fr: "Resource Policy Contributor crée et attribue des stratégies. L'équipe pourrait imposer des étiquettes par des stratégies, mais ce rôle ne permet pas à des scripts d'écrire directement des étiquettes sur les ressources."
references:
  - title: Use tags to organize your Azure resources and management hierarchy
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources
