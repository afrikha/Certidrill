id: az305-1b-idm-sync-tools-match
objective: "1.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders reviews the identity services that it could use to synchronize identities, and lists four characteristics that matter for its design.

    Which service has each characteristic? To answer, drag the appropriate services to the correct characteristics. Each service may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders passe en revue les services d'identité qu'elle pourrait utiliser pour synchroniser des identités, et retient quatre caractéristiques importantes pour sa conception.

    Quel service présente chaque caractéristique ? Pour répondre, faites glisser les services appropriés vers les caractéristiques correspondantes. Chaque service peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: cs, text: Microsoft Entra Cloud Sync }
    - { id: conn, text: Microsoft Entra Connect Sync }
    - { id: cts, text: { en: "Cross-tenant synchronization", fr: "Synchronisation interlocataire" } }
    - { id: ds, text: Microsoft Entra Domain Services }
  targets:
    - id: t1
      text: { en: "Several active agents provide automatic failover, and the configuration is stored in Microsoft Entra ID", fr: "Plusieurs agents actifs assurent un basculement automatique, et la configuration est stockée dans Microsoft Entra ID" }
    - id: t2
      text: { en: "The same tool configures pass-through authentication and federation with AD FS", fr: "Le même outil configure l'authentification directe et la fédération avec AD FS" }
    - id: t3
      text: { en: "Security groups that are created in Microsoft Entra ID are provisioned to AD DS", fr: "Des groupes de sécurité créés dans Microsoft Entra ID sont approvisionnés dans AD DS" }
    - id: t4
      text: { en: "Member users of one Microsoft Entra tenant are created as external users in another tenant of the same organization", fr: "Des utilisateurs membres d'un locataire Microsoft Entra sont créés en tant qu'utilisateurs externes dans un autre locataire de la même organisation" }
answer:
  mapping: { t1: cs, t2: conn, t3: cs, t4: cts }
explanation:
  correct:
    en: "Cloud Sync runs several active provisioning agents with automatic failover, keeps its configuration in the cloud, and is the only tool that provisions cloud groups to AD DS. Connect Sync is the tool that also sets up pass-through authentication and AD FS federation; with Cloud Sync these are managed separately. Cross-tenant synchronization pushes the internal members of a source tenant to a target tenant as B2B collaboration users."
    fr: "Cloud Sync exécute plusieurs agents d'approvisionnement actifs avec basculement automatique, conserve sa configuration dans le cloud, et c'est le seul outil qui approvisionne des groupes cloud dans AD DS. Connect Sync est l'outil qui configure aussi l'authentification directe et la fédération AD FS ; avec Cloud Sync, elles sont gérées séparément. La synchronisation interlocataire pousse les membres internes d'un locataire source vers un locataire cible sous forme d'utilisateurs de collaboration B2B."
  options:
    ds:
      en: "Domain Services receives a one-way copy of the identities of Microsoft Entra ID in a managed domain; it has none of the four characteristics."
      fr: "Domain Services reçoit une copie à sens unique des identités de Microsoft Entra ID dans un domaine managé ; il ne présente aucune des quatre caractéristiques."
references:
  - title: "Migrate from Microsoft Entra Connect Sync to Cloud Sync: decision guide"
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/cloud-sync/connect-to-cloud-sync-decision-guide
  - title: What is cross-tenant synchronization?
    url: https://learn.microsoft.com/en-us/entra/identity/multi-tenant-organizations/cross-tenant-synchronization-overview
