id: az305-cs1c-log-destinations
objective: "1.1.2"
type: dragdrop
caseStudy: az305-cs1c-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You plan to create diagnostic settings for Microsoft Entra ID and for the Azure subscriptions. You need to recommend a destination for each logging requirement.

    Which destination should you recommend for each requirement? To answer, drag the appropriate destinations to the correct requirements. Each destination may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer des paramètres de diagnostic pour Microsoft Entra ID et pour les abonnements Azure. Vous devez recommander une destination pour chaque exigence de journalisation.

    Quelle destination devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les destinations appropriées vers les exigences correspondantes. Chaque destination peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: law, text: { en: "A Log Analytics workspace", fr: "Un espace de travail Log Analytics" } }
    - { id: amw, text: { en: "An Azure Monitor workspace", fr: "Un espace de travail Azure Monitor" } }
    - { id: storage, text: { en: "A storage account", fr: "Un compte de stockage" } }
    - { id: hub, text: { en: "An event hub", fr: "Un hub d'événements" } }
  targets:
    - id: siem
      text: { en: "Send the logs to the SIEM solution in near real time", fr: "Envoyer les journaux à la solution SIEM en quasi-temps réel" }
    - id: archive
      text: { en: "Keep the logs for seven years at the lowest possible cost", fr: "Conserver les journaux sept ans au coût le plus bas possible" }
    - id: query
      text: { en: "Query the logs of the last 90 days and create alert rules", fr: "Interroger les journaux des 90 derniers jours et créer des règles d'alerte" }
answer:
  mapping: { siem: hub, archive: storage, query: law }
explanation:
  correct:
    en: |
      A diagnostic setting can send the same logs to several destinations. An event hub streams them to external systems such as a non-Microsoft SIEM solution. A storage account archives them at a low price for audits. A Log Analytics workspace stores them for interactive log queries and is the data source of log search alert rules.
    fr: |
      Un paramètre de diagnostic peut envoyer les mêmes journaux vers plusieurs destinations. Un hub d'événements les diffuse vers des systèmes externes tels qu'une solution SIEM non-Microsoft. Un compte de stockage les archive à bas prix pour les audits. Un espace de travail Log Analytics les stocke pour des requêtes de journaux interactives et constitue la source de données des règles d'alerte de recherche dans les journaux.
  options:
    amw:
      en: An Azure Monitor workspace stores Prometheus metrics; it isn't a destination of diagnostic settings for logs.
      fr: Un espace de travail Azure Monitor stocke des métriques Prometheus ; ce n'est pas une destination des paramètres de diagnostic pour les journaux.
references:
  - title: Diagnostic settings in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings
