id: az305-1a-auth-leaked-credentials
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank synchronizes its on-premises Active Directory Domain Services (AD DS) users to Microsoft Entra ID. All the users have Microsoft Entra ID P2 licenses.

    Pass-through authentication is the sign-in method, because the sign-in hours defined in AD DS must be enforced at each sign-in.

    The security team now has an additional requirement: Microsoft Entra ID Protection must report the users whose credentials are found leaked.

    You need to recommend a solution that meets the new requirement and keeps the existing one. The solution must minimize changes.

    What should you recommend?
  fr: |
    Woodgrove Bank synchronise ses utilisateurs Active Directory Domain Services (AD DS) locaux vers Microsoft Entra ID. Tous les utilisateurs possèdent une licence Microsoft Entra ID P2.

    L'authentification directe est la méthode de connexion, car les heures de connexion définies dans AD DS doivent être appliquées à chaque connexion.

    L'équipe de sécurité a désormais une exigence supplémentaire : Microsoft Entra ID Protection doit signaler les utilisateurs dont les informations d'identification ont été divulguées.

    Vous devez recommander une solution qui répond à la nouvelle exigence et conserve l'exigence existante. La solution doit limiter les changements.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "Replace pass-through authentication with password hash synchronization as the sign-in method."
        fr: "Remplacer l'authentification directe par la synchronisation de hachage du mot de passe comme méthode de connexion."
    - id: b
      text:
        en: "Enable password hash synchronization, and keep pass-through authentication as the sign-in method."
        fr: "Activer la synchronisation de hachage du mot de passe et conserver l'authentification directe comme méthode de connexion."
    - id: c
      text:
        en: "Replace pass-through authentication with federation with Active Directory Federation Services (AD FS)."
        fr: "Remplacer l'authentification directe par la fédération avec les services de fédération Active Directory (AD FS)."
    - id: d
      text:
        en: "Deploy Microsoft Entra Password Protection on the domain controllers."
        fr: "Déployer la protection par mot de passe Microsoft Entra sur les contrôleurs de domaine."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft Entra ID Protection needs password hash synchronization to produce the report of users with leaked credentials, whatever the sign-in method is. Password hash synchronization can be enabled in addition to pass-through authentication: passwords are still validated on-premises, so sign-in hours keep applying, and the synchronized hashes also become a backup sign-in method that can be activated manually.
    fr: |
      Microsoft Entra ID Protection a besoin de la synchronisation de hachage du mot de passe pour produire le rapport des utilisateurs dont les informations d'identification ont été divulguées, quelle que soit la méthode de connexion. La synchronisation de hachage du mot de passe peut être activée en plus de l'authentification directe : les mots de passe restent validés en local, donc les heures de connexion continuent de s'appliquer, et les hachages synchronisés deviennent aussi une méthode de connexion de secours activable manuellement.
  options:
    a:
      en: "Leaked credentials would be detected, but passwords would be validated in the cloud, where sign-in hours aren't enforced."
      fr: "Les informations d'identification divulguées seraient détectées, mais les mots de passe seraient validés dans le cloud, où les heures de connexion ne sont pas appliquées."
    c:
      en: "Federation keeps the sign-in hours but, like pass-through authentication, doesn't provide leaked credential detection without password hash synchronization, and it adds a server farm."
      fr: "La fédération conserve les heures de connexion mais, comme l'authentification directe, ne fournit pas la détection des informations d'identification divulguées sans synchronisation de hachage du mot de passe, et elle ajoute une batterie de serveurs."
    d:
      en: "Password Protection rejects weak and banned passwords when they are changed in AD DS; it doesn't detect credentials that have leaked."
      fr: "La protection par mot de passe rejette les mots de passe faibles et interdits lors de leur changement dans AD DS ; elle ne détecte pas les informations d'identification divulguées."
references:
  - title: Choose the right authentication method for your Microsoft Entra hybrid identity solution
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn
