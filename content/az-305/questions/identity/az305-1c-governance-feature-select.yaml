id: az305-1c-governance-feature-select
objective: "1.3.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum has Microsoft Entra ID Governance licenses for all its users and uses Workday as its HR system. The internal audit department issues three findings about identity governance.

    You need to recommend the capability that resolves each finding.

    Which capability should you recommend for each finding? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose de licences Microsoft Entra ID Governance pour tous ses utilisateurs et utilise Workday comme système RH. Le service d'audit interne formule trois constats sur la gouvernance des identités.

    Vous devez recommander la fonctionnalité qui résout chaque constat.

    Quelle fonctionnalité devez-vous recommander pour chaque constat ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The accounts of new employees are typed by hand in Microsoft Entra ID from the Workday records, with frequent errors: [[hr]]

      Guests open the supplier portal without having accepted the confidentiality agreement, and no acceptance is recorded: [[nda]]

      Some users hold both the access package *Payments - Create* and the access package *Payments - Approve*, which nothing prevents them from requesting: [[sod]]
    fr: |
      Les comptes des nouveaux employés sont saisis à la main dans Microsoft Entra ID à partir des fiches Workday, avec des erreurs fréquentes : [[hr]]

      Des invités ouvrent le portail des fournisseurs sans avoir accepté l'accord de confidentialité, et aucune acceptation n'est enregistrée : [[nda]]

      Certains utilisateurs détiennent à la fois le package d'accès *Payments - Create* et le package d'accès *Payments - Approve*, que rien ne les empêche de demander : [[sod]]
  slots:
    - id: hr
      options:
        - { id: ar, text: { en: "Access reviews", fr: "Révisions d'accès" } }
        - { id: em, text: { en: "Entitlement management", fr: "Gestion des droits d'utilisation" } }
        - { id: hrp, text: { en: "HR-driven provisioning", fr: "Provisionnement piloté par les RH" } }
        - { id: lcw, text: { en: "Lifecycle workflows", fr: "Workflows de cycle de vie" } }
        - { id: tou, text: { en: "Terms of use", fr: "Conditions d'utilisation" } }
    - id: nda
      options:
        - { id: ar, text: { en: "Access reviews", fr: "Révisions d'accès" } }
        - { id: em, text: { en: "Entitlement management", fr: "Gestion des droits d'utilisation" } }
        - { id: hrp, text: { en: "HR-driven provisioning", fr: "Provisionnement piloté par les RH" } }
        - { id: lcw, text: { en: "Lifecycle workflows", fr: "Workflows de cycle de vie" } }
        - { id: tou, text: { en: "Terms of use", fr: "Conditions d'utilisation" } }
    - id: sod
      options:
        - { id: ar, text: { en: "Access reviews", fr: "Révisions d'accès" } }
        - { id: em, text: { en: "Entitlement management", fr: "Gestion des droits d'utilisation" } }
        - { id: hrp, text: { en: "HR-driven provisioning", fr: "Provisionnement piloté par les RH" } }
        - { id: lcw, text: { en: "Lifecycle workflows", fr: "Workflows de cycle de vie" } }
        - { id: tou, text: { en: "Terms of use", fr: "Conditions d'utilisation" } }
answer:
  values: { hr: hrp, nda: tou, sod: em }
explanation:
  correct:
    en: "HR-driven provisioning creates and updates Microsoft Entra accounts from the records of an HR system such as Workday. Terms of use present a document that users must accept before access, enforced by Conditional Access, and the acceptances are recorded. Entitlement management lets you mark access packages as incompatible, which enforces separation of duties when a user requests the second package."
    fr: "Le provisionnement piloté par les RH crée et met à jour les comptes Microsoft Entra à partir des fiches d'un système RH comme Workday. Les conditions d'utilisation présentent un document que les utilisateurs doivent accepter avant l'accès, imposé par l'accès conditionnel, et les acceptations sont enregistrées. La gestion des droits d'utilisation permet de déclarer des packages d'accès incompatibles, ce qui impose la séparation des tâches lorsqu'un utilisateur demande le second package."
  options:
    lcw:
      en: "Lifecycle workflows run tasks on accounts that already exist, at dates such as the hire date. They don't create accounts from HR records."
      fr: "Les workflows de cycle de vie exécutent des tâches sur des comptes qui existent déjà, à des dates comme la date d'embauche. Ils ne créent pas de comptes à partir des fiches RH."
    ar:
      en: "Access reviews detect and remove access after the fact, at each review. They don't create accounts, record an agreement or block a request for a conflicting access package."
      fr: "Les révisions d'accès détectent et retirent des accès après coup, à chaque révision. Elles ne créent pas de comptes, n'enregistrent pas d'accord et ne bloquent pas la demande d'un package d'accès en conflit."
references:
  - title: What is Microsoft Entra ID Governance?
    url: https://learn.microsoft.com/en-us/entra/id-governance/identity-governance-overview
  - title: Configure separation of duties checks for an access package in entitlement management
    url: https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-access-package-incompatible
