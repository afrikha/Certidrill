id: az305-1c-hybrid-multicloud-governance
objective: "1.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum manages compliance with Azure Policy and Microsoft Defender for Cloud in its Azure subscriptions. The company wants to extend this governance to resources that are outside its own Azure subscriptions.

    You need to recommend what to deploy for each requirement.

    What should you recommend for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum gère la conformité de ses abonnements Azure avec Azure Policy et Microsoft Defender pour le cloud. L'entreprise veut étendre cette gouvernance à des ressources situées hors de ses propres abonnements Azure.

    Vous devez recommander ce qu'il faut déployer pour chaque exigence.

    Que devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: arcsrv, text: { en: "Azure Arc-enabled servers", fr: "Serveurs avec Azure Arc" } }
    - { id: arck8s, text: { en: "Azure Arc-enabled Kubernetes", fr: "Kubernetes avec Azure Arc" } }
    - { id: lighthouse, text: Azure Lighthouse }
    - { id: aws, text: { en: "An AWS connector in Microsoft Defender for Cloud", fr: "Un connecteur AWS dans Microsoft Defender pour le cloud" } }
    - { id: migrate, text: Azure Migrate }
  targets:
    - id: t1
      text: { en: "Include the physical Linux servers of an on-premises datacenter in Azure Policy compliance results", fr: "Inclure les serveurs Linux physiques d'un centre de données local dans les résultats de conformité d'Azure Policy" }
    - id: t2
      text: { en: "Assess the resources of Amazon Web Services accounts against the regulatory standards used for the Azure subscriptions", fr: "Évaluer les ressources de comptes Amazon Web Services par rapport aux normes réglementaires utilisées pour les abonnements Azure" }
    - id: t3
      text: { en: "Let the central team, signed in to its own tenant, assign policies to subscriptions that stay in the Microsoft Entra tenant of a subsidiary", fr: "Permettre à l'équipe centrale, connectée à son propre locataire, d'attribuer des stratégies à des abonnements qui restent dans le locataire Microsoft Entra d'une filiale" }
    - id: t4
      text: { en: "Apply Azure Policy to Kubernetes clusters that run in an on-premises datacenter", fr: "Appliquer Azure Policy à des clusters Kubernetes qui s'exécutent dans un centre de données local" }
answer:
  mapping: { t1: arcsrv, t2: aws, t3: lighthouse, t4: arck8s }
explanation:
  correct:
    en: "Azure Arc projects machines and Kubernetes clusters that run outside Azure into Azure Resource Manager, where Azure Policy can evaluate them like native resources. An AWS connector lets Microsoft Defender for Cloud assess AWS accounts, including against regulatory standards. Azure Lighthouse delegates subscriptions of another tenant to users of the managing tenant, who can then assign policies there with their own accounts."
    fr: "Azure Arc projette dans Azure Resource Manager les machines et les clusters Kubernetes qui s'exécutent hors d'Azure, où Azure Policy peut les évaluer comme des ressources natives. Un connecteur AWS permet à Microsoft Defender pour le cloud d'évaluer des comptes AWS, y compris par rapport à des normes réglementaires. Azure Lighthouse délègue des abonnements d'un autre locataire à des utilisateurs du locataire gestionnaire, qui peuvent alors y attribuer des stratégies avec leurs propres comptes."
  options:
    migrate:
      en: "Azure Migrate discovers and assesses servers in order to move them to Azure. It doesn't bring resources that stay elsewhere under Azure governance."
      fr: "Azure Migrate découvre et évalue des serveurs en vue de les déplacer vers Azure. Il ne place pas sous la gouvernance d'Azure des ressources qui restent ailleurs."
references:
  - title: Azure Arc overview
    url: https://learn.microsoft.com/en-us/azure/azure-arc/overview
  - title: What is Azure Lighthouse?
    url: https://learn.microsoft.com/en-us/azure/lighthouse/overview
