id: az305-1b-onprem-private-access
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. wants to retire its remote access VPN. Remote employees use company laptops and need to reach file servers and Remote Desktop hosts in two datacenters. These resources are identified by fully qualified domain names (FQDNs) and by IP address ranges.

    You need to recommend a solution that meets the following requirements:

    - Access is granted per group of private resources, each with its own Conditional Access policy.
    - The datacenters accept no inbound connection from the internet.
    - Users don't have to start a VPN connection.

    What should you recommend?
  fr: |
    Fabrikam, Inc. souhaite mettre hors service son VPN d'accès à distance. Les employés distants utilisent des ordinateurs portables de l'entreprise et doivent atteindre des serveurs de fichiers et des hôtes Bureau à distance situés dans deux centres de données. Ces ressources sont identifiées par des noms de domaine complets (FQDN) et par des plages d'adresses IP.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - L'accès est accordé par groupe de ressources privées, chacun avec sa propre stratégie d'accès conditionnel.
    - Les centres de données n'acceptent aucune connexion entrante depuis Internet.
    - Les utilisateurs n'ont pas à démarrer de connexion VPN.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: Microsoft Entra Private Access
    - id: b
      text: { en: "Microsoft Entra application proxy", fr: "Le proxy d'application Microsoft Entra" }
    - id: c
      text: Azure Bastion
    - id: d
      text: Microsoft Entra Domain Services
answer: { optionId: a }
explanation:
  correct:
    en: "Microsoft Entra Private Access lets you define the FQDNs and IP addresses that are private, group them in Quick Access or in separate Global Secure Access apps, and assign users and Conditional Access policies to each app. The Global Secure Access client on the laptops connects users to these resources without a VPN, through private network connectors that broker the connection from inside the datacenters."
    fr: "Microsoft Entra Private Access permet de définir les FQDN et les adresses IP privés, de les regrouper dans l'Accès rapide (Quick Access) ou dans des applications Global Secure Access distinctes, et d'affecter à chaque application des utilisateurs et des stratégies d'accès conditionnel. Le client Global Secure Access installé sur les ordinateurs portables connecte les utilisateurs à ces ressources sans VPN, par des connecteurs de réseau privé qui assurent la connexion depuis l'intérieur des centres de données."
  options:
    b:
      en: "Application proxy publishes on-premises web applications; it doesn't give access to file servers or to Remote Desktop hosts by IP address range."
      fr: "Le proxy d'application publie des applications web locales ; il ne donne pas accès à des serveurs de fichiers ni à des hôtes Bureau à distance par plage d'adresses IP."
    c:
      en: "Azure Bastion provides RDP and SSH sessions from a virtual network in Azure; it isn't a replacement for a remote access VPN to datacenters."
      fr: "Azure Bastion fournit des sessions RDP et SSH depuis un réseau virtuel dans Azure ; il ne remplace pas un VPN d'accès à distance vers des centres de données."
    d:
      en: "Domain Services is a managed domain for workloads in Azure. It provides no remote access to on-premises resources."
      fr: "Domain Services est un domaine managé pour des charges de travail dans Azure. Il ne fournit aucun accès à distance aux ressources locales."
references:
  - title: Learn about Microsoft Entra Private Access
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-private-access
  - title: Microsoft Entra application proxy
    url: https://learn.microsoft.com/en-us/entra/identity/app-proxy/overview-what-is-app-proxy
