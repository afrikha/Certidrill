id: az305-1a-log-retention-dd
objective: "1.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys plans to create a Log Analytics workspace that will not be used by Microsoft Sentinel. Custom tables in the Analytics plan will store the logs of a line-of-business application.

    You are documenting the retention options of these tables for the compliance team.

    How should you complete the statements? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prévoit de créer un espace de travail Log Analytics qui ne sera pas utilisé par Microsoft Sentinel. Des tables personnalisées du plan Analytics stockeront les journaux d'une application métier.

    Vous documentez les options de rétention de ces tables pour l'équipe de conformité.

    Comment devez-vous compléter les phrases ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      By default, the tables keep their data available for interactive queries for [[def]].

      This analytics retention can be extended up to [[maxa]].

      With long-term retention, the total retention of a table can reach [[maxt]].
    fr: |
      Par défaut, les tables gardent leurs données disponibles pour les requêtes interactives pendant [[def]].

      Cette rétention analytique peut être étendue jusqu'à [[maxa]].

      Avec la rétention à long terme, la rétention totale d'une table peut atteindre [[maxt]].
  slots:
    - id: def
      options:
        - { id: d7, text: { en: "7 days", fr: "7 jours" } }
        - { id: d30, text: { en: "30 days", fr: "30 jours" } }
        - { id: d90, text: { en: "90 days", fr: "90 jours" } }
        - { id: d180, text: { en: "180 days", fr: "180 jours" } }
    - id: maxa
      options:
        - { id: y1, text: { en: "one year", fr: "un an" } }
        - { id: y2, text: { en: "two years", fr: "deux ans" } }
        - { id: y7, text: { en: "seven years", fr: "sept ans" } }
    - id: maxt
      options:
        - { id: t7, text: { en: "7 years", fr: "7 ans" } }
        - { id: t10, text: { en: "10 years", fr: "10 ans" } }
        - { id: t12, text: { en: "12 years", fr: "12 ans" } }
answer:
  values: { def: d30, maxa: y2, maxt: t12 }
explanation:
  correct:
    en: |
      Analytics tables keep data for 30 days by default for interactive queries; only some tables, such as those of Application Insights or of a workspace used by Microsoft Sentinel, default to 90 days. Analytics retention can be extended up to two years. Beyond it, long-term retention keeps the data at a lower price, for a total retention of up to 12 years, and older data is retrieved with search jobs.
    fr: |
      Les tables Analytics conservent les données 30 jours par défaut pour les requêtes interactives ; seules certaines tables, comme celles d'Application Insights ou d'un espace de travail utilisé par Microsoft Sentinel, ont 90 jours par défaut. La rétention analytique peut être étendue jusqu'à deux ans. Au-delà, la rétention à long terme conserve les données à un prix plus bas, pour une rétention totale allant jusqu'à 12 ans, et les données anciennes se récupèrent avec des travaux de recherche.
references:
  - title: Manage data retention in a Log Analytics workspace
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/data-retention-configure
