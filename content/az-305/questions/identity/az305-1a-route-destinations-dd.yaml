id: az305-1a-route-destinations-dd
objective: "1.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders plans to create diagnostic settings for its Azure SQL databases. The resource logs of the databases have three uses.

    You need to recommend a destination for each use. The solution must minimize costs.

    Which destination should you recommend for each use? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders prévoit de créer des paramètres de diagnostic pour ses bases de données Azure SQL. Les journaux de ressources des bases de données ont trois usages.

    Vous devez recommander une destination pour chaque usage. La solution doit réduire les coûts au minimum.

    Quelle destination devez-vous recommander pour chaque usage ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Run KQL queries and log search alert rules on the logs: [[query]]

      Keep a copy of the logs for 10 years under an immutability policy, almost never read: [[archive]]

      Stream the logs in near real time to an on-premises IBM QRadar SIEM: [[siem]]
    fr: |
      Exécuter des requêtes KQL et des règles d'alerte de recherche dans les journaux : [[query]]

      Conserver une copie des journaux pendant 10 ans sous une stratégie d'immuabilité, presque jamais lue : [[archive]]

      Diffuser les journaux en quasi-temps réel vers un SIEM IBM QRadar local : [[siem]]
  slots:
    - id: query
      options:
        - { id: law, text: { en: "A Log Analytics workspace", fr: "Un espace de travail Log Analytics" } }
        - { id: sa, text: { en: "A storage account", fr: "Un compte de stockage" } }
        - { id: eh, text: { en: "An event hub", fr: "Un hub d'événements" } }
        - { id: amw, text: { en: "An Azure Monitor workspace", fr: "Un espace de travail Azure Monitor" } }
    - id: archive
      options:
        - { id: law, text: { en: "A Log Analytics workspace", fr: "Un espace de travail Log Analytics" } }
        - { id: sa, text: { en: "A storage account", fr: "Un compte de stockage" } }
        - { id: eh, text: { en: "An event hub", fr: "Un hub d'événements" } }
        - { id: amw, text: { en: "An Azure Monitor workspace", fr: "Un espace de travail Azure Monitor" } }
    - id: siem
      options:
        - { id: law, text: { en: "A Log Analytics workspace", fr: "Un espace de travail Log Analytics" } }
        - { id: sa, text: { en: "A storage account", fr: "Un compte de stockage" } }
        - { id: eh, text: { en: "An event hub", fr: "Un hub d'événements" } }
        - { id: amw, text: { en: "An Azure Monitor workspace", fr: "Un espace de travail Azure Monitor" } }
answer:
  values: { query: law, archive: sa, siem: eh }
explanation:
  correct:
    en: |
      A Log Analytics workspace is the destination for KQL queries, correlation and log search alerts. A storage account is the low-cost destination for an archive that is rarely read, and blob immutability policies protect the copy. An event hub streams the logs to external tools: IBM QRadar and other non-Microsoft SIEM products read Azure monitoring data from Event Hubs.
    fr: |
      Un espace de travail Log Analytics est la destination des requêtes KQL, de la corrélation et des alertes de recherche dans les journaux. Un compte de stockage est la destination à faible coût d'une archive rarement lue, et les stratégies d'immuabilité des objets blob protègent la copie. Un hub d'événements diffuse les journaux vers des outils externes : IBM QRadar et d'autres produits SIEM non-Microsoft lisent les données de monitoring Azure depuis Event Hubs.
  options:
    amw:
      en: "An Azure Monitor workspace stores Prometheus and OpenTelemetry metrics; it isn't a destination for resource logs."
      fr: "Un espace de travail Azure Monitor stocke des métriques Prometheus et OpenTelemetry ; ce n'est pas une destination pour les journaux de ressources."
references:
  - title: Diagnostic settings in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings
  - title: Stream Azure monitoring data to an event hub and external partner
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/stream-monitoring-data-event-hubs
