id: az305-1c-hierarchy-level-match
objective: "1.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum is defining the standards that its architects apply when they organize Azure resources.

    You need to recommend the construct to use for each requirement.

    Which construct should you recommend for each requirement? To answer, drag the appropriate constructs to the correct requirements. Each construct may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum définit les règles que ses architectes appliquent pour organiser les ressources Azure.

    Vous devez recommander la construction à utiliser pour chaque exigence.

    Quelle construction devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les constructions appropriées vers les exigences correspondantes. Chaque construction peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: tenant, text: { en: "Microsoft Entra tenant", fr: "Locataire Microsoft Entra" } }
    - { id: mg, text: { en: "Management group", fr: "Groupe d'administration" } }
    - { id: sub, text: { en: "Subscription", fr: "Abonnement" } }
    - { id: rg, text: { en: "Resource group", fr: "Groupe de ressources" } }
    - { id: tag, text: { en: "Tag", fr: "Étiquette" } }
  targets:
    - id: t1
      text: { en: "Hold the resources of one application that are deployed, updated and deleted together", fr: "Contenir les ressources d'une application qui sont déployées, mises à jour et supprimées ensemble" }
    - id: t2
      text: { en: "Report the costs of a project whose resources are spread over several subscriptions and resource groups", fr: "Présenter les coûts d'un projet dont les ressources sont réparties dans plusieurs abonnements et groupes de ressources" }
    - id: t3
      text: { en: "Make 40 subscriptions inherit one policy assignment", fr: "Faire hériter une même attribution de stratégie à 40 abonnements" }
    - id: t4
      text: { en: "Give a large workload its own quotas and limits, separate from those of the other workloads", fr: "Donner à une charge de travail volumineuse ses propres quotas et limites, distincts de ceux des autres charges de travail" }
answer:
  mapping: { t1: rg, t2: tag, t3: mg, t4: sub }
explanation:
  correct:
    en: "A resource group is a container for resources that share a life cycle. Tags describe what the hierarchy can't, such as a project that crosses subscriptions, and cost analysis can group by them. A management group sits above subscriptions and passes its policy and role assignments down to them. A subscription is a unit of scale with its own quotas and limits, which is a reason to give a large workload a dedicated one."
    fr: "Un groupe de ressources est un conteneur pour des ressources qui partagent un cycle de vie. Les étiquettes décrivent ce que la hiérarchie ne peut pas exprimer, comme un projet réparti sur plusieurs abonnements, et l'analyse des coûts peut regrouper selon elles. Un groupe d'administration se place au-dessus des abonnements et leur transmet ses attributions de stratégies et de rôles. Un abonnement est une unité de mise à l'échelle dotée de ses propres quotas et limites, ce qui justifie d'en dédier un à une charge de travail volumineuse."
  options:
    tenant:
      en: "A tenant is the identity boundary that subscriptions trust. It isn't the construct used to group resources, costs, policies or quotas inside an organization."
      fr: "Un locataire est la limite d'identité que les abonnements approuvent. Ce n'est pas la construction qui sert à regrouper des ressources, des coûts, des stratégies ou des quotas au sein d'une organisation."
references:
  - title: Subscription considerations and recommendations
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-subscriptions
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
