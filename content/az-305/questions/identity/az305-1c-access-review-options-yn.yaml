id: az305-1c-access-review-options-yn
objective: "1.3.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has a security group named **G-Finance-Reports** that gives access to financial reports. The group has 200 members: employees and guest users. Tailspin Toys plans to use access reviews to check the membership of the group every quarter.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un groupe de sécurité nommé **G-Finance-Reports** qui donne accès à des rapports financiers. Le groupe compte 200 membres : des employés et des utilisateurs invités. Tailspin Toys prévoit d'utiliser les révisions d'accès pour vérifier l'appartenance au groupe chaque trimestre.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "To review only the guest users, Tailspin Toys must first move the guests to a separate group."
        fr: "Pour ne réviser que les utilisateurs invités, Tailspin Toys doit d'abord déplacer les invités dans un groupe distinct."
    - id: s2
      text:
        en: "An administrator must create a new access review at the start of each quarter."
        fr: "Un administrateur doit créer une nouvelle révision d'accès au début de chaque trimestre."
    - id: s3
      text:
        en: "The review can ask each member to confirm their own need for access."
        fr: "La révision peut demander à chaque membre de confirmer son propre besoin d'accès."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: "The scope of an access review of a group can be all users or guest users only, so no separate group is needed. A review is created once with a recurrence, such as quarterly, and a new instance starts by itself at each period. The reviewers can be the group owners, selected users, managers or the users themselves, who then attest to their own access."
    fr: "L'étendue d'une révision d'accès d'un groupe peut porter sur tous les utilisateurs ou sur les seuls utilisateurs invités : aucun groupe distinct n'est nécessaire. Une révision se crée une seule fois avec une périodicité, par exemple trimestrielle, et une nouvelle instance démarre d'elle-même à chaque période. Les réviseurs peuvent être les propriétaires du groupe, des utilisateurs sélectionnés, les responsables ou les utilisateurs eux-mêmes, qui attestent alors de leur propre accès."
references:
  - title: Create an access review of groups and applications in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/id-governance/create-access-review
