id: az305-1a-auth-sspr-writeback
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum synchronizes the users of its on-premises Active Directory Domain Services (AD DS) domain to Microsoft Entra ID by using Microsoft Entra Connect Sync. Password hash synchronization is the sign-in method.

    You need to recommend a solution that meets the following requirements:

    - Users who forget their password must reset it themselves from the Microsoft Entra sign-in page, without calling the help desk.
    - The new password must be valid immediately in AD DS and must comply with the AD DS password policy.

    Which two features should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum synchronise les utilisateurs de son domaine Active Directory Domain Services (AD DS) local vers Microsoft Entra ID à l'aide de Microsoft Entra Connect Sync. La synchronisation de hachage du mot de passe est la méthode de connexion.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Les utilisateurs qui oublient leur mot de passe doivent le réinitialiser eux-mêmes depuis la page de connexion Microsoft Entra, sans appeler le support technique.
    - Le nouveau mot de passe doit être valide immédiatement dans AD DS et respecter la stratégie de mot de passe AD DS.

    Quelles sont les deux fonctionnalités à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Self-service password reset (SSPR)"
        fr: "La réinitialisation de mot de passe en libre-service (SSPR)"
    - id: b
      text:
        en: "Pass-through authentication"
        fr: "L'authentification directe"
    - id: c
      text:
        en: "Seamless single sign-on"
        fr: "L'authentification unique transparente (Seamless SSO)"
    - id: d
      text:
        en: "Password writeback"
        fr: "La réécriture du mot de passe"
    - id: e
      text:
        en: "Microsoft Entra Password Protection for AD DS"
        fr: "La protection par mot de passe Microsoft Entra pour AD DS"
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Self-service password reset lets users reset their own password in the cloud. Password writeback sends the new password back to AD DS in real time: the operation is synchronous, the password is checked against the AD DS policy before it is committed, and the communication is outbound only. Writeback works with password hash synchronization, pass-through authentication and federation.
    fr: |
      La réinitialisation de mot de passe en libre-service permet aux utilisateurs de réinitialiser eux-mêmes leur mot de passe dans le cloud. La réécriture du mot de passe renvoie le nouveau mot de passe vers AD DS en temps réel : l'opération est synchrone, le mot de passe est vérifié par rapport à la stratégie AD DS avant d'être validé, et la communication est uniquement sortante. La réécriture fonctionne avec la synchronisation de hachage du mot de passe, l'authentification directe et la fédération.
  options:
    b:
      en: "Pass-through authentication changes where passwords are validated at sign-in; it doesn't let users reset a forgotten password."
      fr: "L'authentification directe change l'endroit où les mots de passe sont validés à la connexion ; elle ne permet pas aux utilisateurs de réinitialiser un mot de passe oublié."
    c:
      en: "Seamless single sign-on avoids password prompts on domain-joined devices inside the corporate network; it resets nothing."
      fr: "L'authentification unique transparente évite les demandes de mot de passe sur les appareils joints au domaine à l'intérieur du réseau de l'entreprise ; elle ne réinitialise rien."
    e:
      en: "Password Protection applies the banned password lists to password changes made in AD DS; it isn't a reset mechanism."
      fr: "La protection par mot de passe applique les listes de mots de passe interdits aux changements de mot de passe effectués dans AD DS ; ce n'est pas un mécanisme de réinitialisation."
references:
  - title: How does self-service password reset writeback work in Microsoft Entra ID?
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sspr-writeback
