id: az305-1c-cost-tag-inheritance
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has an Enterprise Agreement (EA) and 40 Azure subscriptions. Each subscription carries a `costcenter` tag. The 12,000 resources of the subscriptions have no `costcenter` tag, and many of them are redeployed every week by the pipelines of a software vendor, which overwrite the tags of the resources.

    The finance team wants to group the costs of all the resources by `costcenter` in cost analysis. You need to recommend a solution that meets the following requirements:

    - The tags of the resources must not be modified.
    - The management group hierarchy must not change.
    - Administrative effort must be minimized.

    What should you recommend?
  fr: |
    Adatum dispose d'un Contrat Entreprise (EA) et de 40 abonnements Azure. Chaque abonnement porte une étiquette `costcenter`. Les 12 000 ressources des abonnements n'ont pas d'étiquette `costcenter`, et beaucoup sont redéployées chaque semaine par les pipelines d'un éditeur de logiciels, qui remplacent les étiquettes des ressources.

    L'équipe financière veut regrouper les coûts de toutes les ressources par `costcenter` dans l'analyse des coûts. Vous devez recommander une solution qui respecte les exigences suivantes :

    - Les étiquettes des ressources ne doivent pas être modifiées.
    - La hiérarchie des groupes d'administration ne doit pas changer.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Assign the Inherit a tag from the subscription policy and create a remediation task.", fr: "Attribuer la stratégie Inherit a tag from the subscription et créer une tâche de correction." }
    - id: b
      text: { en: "Enable tag inheritance in the Cost Management settings.", fr: "Activer l'héritage des étiquettes dans les paramètres de Cost Management." }
    - id: c
      text: { en: "Create one management group for each cost center and move the subscriptions.", fr: "Créer un groupe d'administration par centre de coûts et y déplacer les abonnements." }
    - id: d
      text: { en: "Schedule a daily cost export and join it to the subscription tags in Power BI.", fr: "Planifier une exportation quotidienne des coûts et la joindre aux étiquettes des abonnements dans Power BI." }
answer: { optionId: b }
explanation:
  correct:
    en: "Tag inheritance in Cost Management applies the tags of the subscription and of the resource group to the usage records of the child resources. The resources themselves aren't changed, so the vendor pipelines aren't affected, and cost analysis can then group all the costs by `costcenter` with a single setting."
    fr: "L'héritage des étiquettes de Cost Management applique les étiquettes de l'abonnement et du groupe de ressources aux enregistrements d'utilisation des ressources enfants. Les ressources elles-mêmes ne sont pas modifiées : les pipelines de l'éditeur ne sont donc pas concernés, et l'analyse des coûts peut alors regrouper tous les coûts par `costcenter` grâce à un seul paramètre."
  options:
    a:
      en: "The policy writes the tag on each resource with the modify effect, which the requirements forbid, and the vendor pipelines would overwrite it at each deployment."
      fr: "La stratégie écrit l'étiquette sur chaque ressource avec l'effet modify, ce que les exigences interdisent, et les pipelines de l'éditeur la remplaceraient à chaque déploiement."
    c:
      en: "Costs could be viewed per management group, but the hierarchy must not change, and it should follow policy needs rather than cost centers."
      fr: "Les coûts pourraient être consultés par groupe d'administration, mais la hiérarchie ne doit pas changer, et elle doit suivre les besoins de stratégie plutôt que les centres de coûts."
    d:
      en: "It leaves the tags untouched, but it requires building and maintaining a data model outside cost analysis, which doesn't minimize administrative effort."
      fr: "Cette solution ne touche pas aux étiquettes, mais elle impose de construire et de maintenir un modèle de données hors de l'analyse des coûts, ce qui ne réduit pas l'effort d'administration."
references:
  - title: Group and allocate costs using tag inheritance
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/costs/enable-tag-inheritance
