id: az305-1a-mon-basic-simple-alert
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys collects the container logs of its Azure Kubernetes Service (AKS) clusters in a Log Analytics workspace. To reduce the ingestion cost, the **ContainerLogV2** table uses the Basic plan.

    You need to recommend an alerting solution that meets the following requirements:

    - An alert must fire for each ingested record that contains the text OutOfMemory.
    - Engineers must continue to query the table with KQL.
    - The cost of the table must remain as low as possible.

    What should you recommend?
  fr: |
    Wingtip Toys collecte les journaux de conteneurs de ses clusters Azure Kubernetes Service (AKS) dans un espace de travail Log Analytics. Pour réduire le coût d'ingestion, la table **ContainerLogV2** utilise le plan Basic.

    Vous devez recommander une solution d'alerte qui répond aux exigences suivantes :

    - Une alerte doit se déclencher pour chaque enregistrement ingéré qui contient le texte OutOfMemory.
    - Les ingénieurs doivent continuer à interroger la table en KQL.
    - Le coût de la table doit rester le plus bas possible.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "Keep the Basic plan, and create a simple log search alert rule."
        fr: "Conserver le plan Basic et créer une règle d'alerte de recherche dans les journaux simple."
    - id: b
      text:
        en: "Switch the table to the Analytics plan, and create a log search alert rule that counts the records."
        fr: "Passer la table au plan Analytics et créer une règle d'alerte de recherche dans les journaux qui compte les enregistrements."
    - id: c
      text:
        en: "Switch the table to the Auxiliary plan, and create a log search alert rule."
        fr: "Passer la table au plan Auxiliary et créer une règle d'alerte de recherche dans les journaux."
    - id: d
      text:
        en: "Keep the Basic plan, and create an activity log alert rule."
        fr: "Conserver le plan Basic et créer une règle d'alerte de journal d'activité."
answer: { optionId: a }
explanation:
  correct:
    en: |
      Tables in the Basic plan support simple log search alerts. A simple log search alert evaluates each row individually, so it fires for every record that matches the condition, which is exactly the requirement. The table keeps its reduced ingestion cost and full KQL.
    fr: |
      Les tables du plan Basic prennent en charge les alertes de recherche dans les journaux simples. Une alerte de recherche dans les journaux simple évalue chaque ligne individuellement : elle se déclenche donc pour chaque enregistrement qui remplit la condition, ce qui est exactement l'exigence. La table conserve son coût d'ingestion réduit et le KQL complet.
  options:
    b:
      en: "The Analytics plan supports every type of alert, but at the standard ingestion price, which the Basic plan avoids."
      fr: "Le plan Analytics prend en charge tous les types d'alertes, mais au prix d'ingestion standard, que le plan Basic permet d'éviter."
    c:
      en: "The Auxiliary plan is the cheapest to ingest, but its tables don't support alerts."
      fr: "Le plan Auxiliary est le moins cher à l'ingestion, mais ses tables ne prennent pas en charge les alertes."
    d:
      en: "An activity log alert fires on control plane events of Azure resources; it never reads the records of a workspace table."
      fr: "Une alerte de journal d'activité se déclenche sur des événements du plan de contrôle des ressources Azure ; elle ne lit jamais les enregistrements d'une table d'un espace de travail."
references:
  - title: Azure Monitor Logs overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/data-platform-logs
  - title: Choose the right type of alert rule
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
