id: az305-1a-mon-action-group-hot
objective: "1.1.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso is designing the action group that its critical alert rules will use. The notification and action types that an action group offers are shown in the following table.

    You need to recommend how the action group meets two requirements. Answer each prompt by selecting the notification or action type to use.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso conçoit le groupe d'actions que ses règles d'alerte critiques utiliseront. Les types de notifications et d'actions proposés par un groupe d'actions figurent dans le tableau suivant.

    Vous devez recommander la manière dont le groupe d'actions répond à deux exigences. Répondez à chaque consigne en sélectionnant le type de notification ou d'action à utiliser.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: "Every user who holds the Owner role on the subscription receives an email, without a list of addresses to maintain."
        fr: "Chaque utilisateur qui détient le rôle Owner sur l'abonnement reçoit un e-mail, sans liste d'adresses à maintenir."
    - id: p2
      text:
        en: "Each alert is posted to a Microsoft Teams channel, which expects a payload in its own schema. No code may be written."
        fr: "Chaque alerte est publiée dans un canal Microsoft Teams, qui attend une charge utile dans son propre schéma. Aucun code ne doit être écrit."
  grid:
    header: [{ en: "Type", fr: "Type" }, { en: "Category", fr: "Catégorie" }]
    rows:
      - [{ text: "Email Azure Resource Manager Role", area: armrole }, { text: { en: "Notification", fr: "Notification" } }]
      - [{ text: { en: "Email, SMS, push or voice", fr: "E-mail, SMS, notification push ou appel vocal" }, area: direct }, { text: { en: "Notification", fr: "Notification" } }]
      - [{ text: { en: "Automation runbook", fr: "Runbook Automation" }, area: runbook }, { text: "Action" }]
      - [{ text: { en: "Event Hubs", fr: "Event Hubs" }, area: eh }, { text: "Action" }]
      - [{ text: { en: "Logic app", fr: "Application logique" }, area: logic }, { text: "Action" }]
      - [{ text: { en: "Webhook", fr: "Webhook" }, area: webhook }, { text: "Action" }]
answer:
  values: { p1: armrole, p2: logic }
explanation:
  correct:
    en: |
      The Email Azure Resource Manager Role notification sends the email to the members of a role of the subscription, such as Owner, so the recipients follow the role assignments. A webhook sends the alert payload as it is; when the endpoint expects a specific schema, as Microsoft Teams does, a logic app action transforms the payload and posts the message, with a designer instead of code.
    fr: |
      La notification Email Azure Resource Manager Role envoie l'e-mail aux membres d'un rôle de l'abonnement, comme Owner : les destinataires suivent donc les attributions de rôles. Un webhook envoie la charge utile de l'alerte telle quelle ; quand le point de terminaison attend un schéma précis, comme Microsoft Teams, une action d'application logique transforme la charge utile et publie le message, avec un concepteur au lieu de code.
  options:
    direct:
      en: "A direct email notification targets fixed addresses, which would have to be updated each time the owners change."
      fr: "Une notification directe par e-mail vise des adresses fixes, qu'il faudrait mettre à jour à chaque changement de propriétaires."
    webhook:
      en: "A webhook can't adapt the alert payload to the schema that Teams expects."
      fr: "Un webhook ne peut pas adapter la charge utile de l'alerte au schéma attendu par Teams."
    runbook:
      en: "A runbook could call Teams, but it is a script to write and maintain."
      fr: "Un runbook pourrait appeler Teams, mais c'est un script à écrire et à maintenir."
references:
  - title: Action groups
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups
