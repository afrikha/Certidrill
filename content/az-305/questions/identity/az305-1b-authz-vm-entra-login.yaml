id: az305-1b-authz-vm-entra-login
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank runs Windows Server 2022 virtual machines in a resource group named **RG-Ops**. The Microsoft Entra login extension is installed on the virtual machines, and no local administrator account is shared.

    The members of an operations group must sign in to the virtual machines over RDP with their Microsoft Entra accounts and have administrator privileges in Windows. They must not be able to resize or delete the virtual machines.

    You need to recommend a role to assign to the group on RG-Ops. The principle of least privilege must be applied.

    Which role should you recommend?
  fr: |
    Woodgrove Bank exécute des machines virtuelles Windows Server 2022 dans un groupe de ressources nommé **RG-Ops**. L'extension de connexion Microsoft Entra est installée sur les machines virtuelles, et aucun compte d'administrateur local n'est partagé.

    Les membres d'un groupe d'exploitation doivent se connecter aux machines virtuelles en RDP avec leurs comptes Microsoft Entra et disposer de privilèges d'administrateur dans Windows. Ils ne doivent pas pouvoir redimensionner ni supprimer les machines virtuelles.

    Vous devez recommander un rôle à attribuer au groupe sur RG-Ops. Le principe du moindre privilège doit être appliqué.

    Quel rôle devez-vous recommander ?
body:
  options:
    - { id: a, text: Virtual Machine Contributor }
    - { id: b, text: Virtual Machine Administrator Login }
    - { id: c, text: Virtual Machine User Login }
    - { id: d, text: Owner }
answer: { optionId: b }
explanation:
  correct:
    en: "Virtual Machine Administrator Login authorizes a user to sign in to the virtual machine with Microsoft Entra credentials and administrator privileges. It gives no right to manage the virtual machine resource, which keeps the people who access the machines separate from the people who control them."
    fr: "Virtual Machine Administrator Login autorise un utilisateur à se connecter à la machine virtuelle avec des informations d'identification Microsoft Entra et des privilèges d'administrateur. Il ne donne aucun droit de gestion sur la ressource machine virtuelle, ce qui sépare les personnes qui accèdent aux machines de celles qui les contrôlent."
  options:
    a:
      en: "Virtual Machine Contributor manages the virtual machine resource (resize, delete) but doesn't grant the right to sign in with Microsoft Entra ID."
      fr: "Virtual Machine Contributor gère la ressource machine virtuelle (redimensionnement, suppression), mais n'accorde pas le droit de se connecter avec Microsoft Entra ID."
    c:
      en: "Virtual Machine User Login allows sign-in with regular user privileges only."
      fr: "Virtual Machine User Login ne permet la connexion qu'avec des privilèges d'utilisateur standard."
    d:
      en: "Owner controls the resources but doesn't by itself grant sign-in to the virtual machines, and it is far more than required."
      fr: "Owner contrôle les ressources, mais n'accorde pas à lui seul la connexion aux machines virtuelles, et il dépasse largement le besoin."
references:
  - title: Sign in to Windows virtual machine in Azure using Microsoft Entra ID and Azure Roles Based Access Control
    url: https://learn.microsoft.com/en-us/entra/identity/devices/howto-vm-sign-in-azure-ad-windows
