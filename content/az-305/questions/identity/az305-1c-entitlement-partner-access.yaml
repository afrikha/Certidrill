id: az305-1c-entitlement-partner-access
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware starts a two-year project with a partner named Proseware. Proseware has its own Microsoft Entra tenant. The Proseware engineers who join the project need membership of a team in Microsoft Teams, access to an enterprise application and access to a SharePoint site of Litware.

    You need to recommend a solution that meets the following requirements:

    - Proseware engineers must request the access themselves, and the Litware project sponsor must approve each request.
    - The access must expire after 180 days unless it is renewed.
    - When an engineer has no access left, the guest account must be removed from the Litware tenant automatically.
    - The Litware IT team must not create invitations.

    What should you recommend?
  fr: |
    Litware démarre un projet de deux ans avec un partenaire nommé Proseware. Proseware dispose de son propre locataire Microsoft Entra. Les ingénieurs de Proseware qui rejoignent le projet ont besoin d'appartenir à une équipe Microsoft Teams et d'accéder à une application d'entreprise et à un site SharePoint de Litware.

    Vous devez recommander une solution qui respecte les exigences suivantes :

    - Les ingénieurs de Proseware doivent demander l'accès eux-mêmes, et le sponsor du projet chez Litware doit approuver chaque demande.
    - L'accès doit expirer après 180 jours, sauf renouvellement.
    - Lorsqu'un ingénieur n'a plus aucun accès, son compte invité doit être supprimé automatiquement du locataire Litware.
    - L'équipe informatique de Litware ne doit pas créer d'invitations.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "An access package in entitlement management, with Proseware as a connected organization", fr: "Un package d'accès dans la gestion des droits d'utilisation, avec Proseware comme organisation connectée" }
    - id: b
      text: { en: "Cross-tenant synchronization from the Proseware tenant to the Litware tenant", fr: "Une synchronisation interlocataire du locataire Proseware vers le locataire Litware" }
    - id: c
      text: { en: "B2B direct connect with the Proseware tenant", fr: "Une connexion directe B2B avec le locataire Proseware" }
    - id: d
      text: { en: "Bulk B2B invitations, followed by a recurring access review of guests", fr: "Des invitations B2B en bloc, suivies d'une révision d'accès récurrente des invités" }
answer: { optionId: a }
explanation:
  correct:
    en: "An access package bundles the team, the application and the site, and its policy lets users of a connected organization request it, with approval and an expiration. Entitlement management creates the guest account when the first request is approved and can remove it when the user's last assignment ends."
    fr: "Un package d'accès regroupe l'équipe, l'application et le site, et sa stratégie permet aux utilisateurs d'une organisation connectée de le demander, avec approbation et expiration. La gestion des droits d'utilisation crée le compte invité lorsque la première demande est approuvée et peut le supprimer lorsque la dernière attribution de l'utilisateur prend fin."
  options:
    b:
      en: "Cross-tenant synchronization provisions the accounts that an administrator of the source tenant selects. Engineers request nothing, no sponsor approves, and no access expires."
      fr: "La synchronisation interlocataire provisionne les comptes qu'un administrateur du locataire source sélectionne. Les ingénieurs ne demandent rien, aucun sponsor n'approuve, et aucun accès n'expire."
    c:
      en: "B2B direct connect gives access to Teams shared channels without guest accounts. It doesn't cover the application and the site, and it has no request, approval or expiration."
      fr: "La connexion directe B2B donne accès aux canaux partagés de Teams sans comptes invités. Elle ne couvre ni l'application ni le site, et ne comporte ni demande, ni approbation, ni expiration."
    d:
      en: "Bulk invitations are created by the IT team, which the requirements exclude, and an access review removes access only at each review instead of after 180 days."
      fr: "Les invitations en bloc sont créées par l'équipe informatique, ce que les exigences excluent, et une révision d'accès ne retire l'accès qu'à chaque révision, pas après 180 jours."
references:
  - title: What is entitlement management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-overview
