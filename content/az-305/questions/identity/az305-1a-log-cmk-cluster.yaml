id: az305-1a-log-cmk-cluster
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has two Log Analytics workspaces in the West Europe region. Together, the workspaces ingest 150 GB of data per day.

    A new security policy has the following requirements:

    - The log data must be encrypted at rest with a key that Contoso stores in Azure Key Vault and can revoke.
    - The logs must remain available for KQL queries and alert rules in both workspaces.

    You need to recommend a solution that meets the policy.

    What should you recommend?
  fr: |
    Contoso dispose de deux espaces de travail Log Analytics dans la région Europe Ouest. Ensemble, ils ingèrent 150 Go de données par jour.

    Une nouvelle stratégie de sécurité impose les exigences suivantes :

    - Les données de journal doivent être chiffrées au repos avec une clé que Contoso stocke dans Azure Key Vault et peut révoquer.
    - Les journaux doivent rester disponibles pour les requêtes KQL et les règles d'alerte dans les deux espaces de travail.

    Vous devez recommander une solution conforme à la stratégie.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "Link the workspaces to a dedicated cluster that is configured with the key."
        fr: "Lier les espaces de travail à un cluster dédié configuré avec la clé."
    - id: b
      text:
        en: "Export the tables to a storage account that is encrypted with the key."
        fr: "Exporter les tables vers un compte de stockage chiffré avec la clé."
    - id: c
      text:
        en: "Connect the workspaces to an Azure Monitor Private Link Scope."
        fr: "Connecter les espaces de travail à une étendue de liaison privée Azure Monitor."
    - id: d
      text:
        en: "Move the key to a key vault of the Premium tier that protects it in an HSM."
        fr: "Déplacer la clé vers un coffre de clés de niveau Premium qui la protège dans un HSM."
answer: { optionId: a }
explanation:
  correct:
    en: |
      Customer-managed keys for Azure Monitor Logs are available only on a dedicated cluster: the cluster holds the connection to the key in Key Vault, and the data ingested into the linked workspaces is encrypted with it. A cluster requires a commitment of at least 100 GB per day, which the 150 GB ingested here covers, and the workspaces must be in the same region as the cluster. Queries and alert rules keep working on the linked workspaces.
    fr: |
      Les clés gérées par le client pour les journaux Azure Monitor ne sont disponibles que sur un cluster dédié : le cluster détient la connexion à la clé dans Key Vault, et les données ingérées dans les espaces de travail liés sont chiffrées avec elle. Un cluster exige un engagement d'au moins 100 Go par jour, ce que couvrent les 150 Go ingérés ici, et les espaces de travail doivent se trouver dans la même région que le cluster. Les requêtes et les règles d'alerte continuent de fonctionner sur les espaces de travail liés.
  options:
    b:
      en: "The exported copy would use the key, but the data that stays in the workspaces for queries and alerts would still be encrypted with Microsoft-managed keys."
      fr: "La copie exportée utiliserait la clé, mais les données qui restent dans les espaces de travail pour les requêtes et les alertes seraient toujours chiffrées avec des clés gérées par Microsoft."
    c:
      en: "A private link scope controls the network path used for ingestion and queries; it doesn't change how the data is encrypted at rest."
      fr: "Une étendue de liaison privée contrôle le chemin réseau de l'ingestion et des requêtes ; elle ne change pas le chiffrement des données au repos."
    d:
      en: "Protecting the key in an HSM doesn't make the workspaces use it: without a dedicated cluster, a workspace can't be configured with a customer-managed key."
      fr: "Protéger la clé dans un HSM ne fait pas utiliser cette clé par les espaces de travail : sans cluster dédié, un espace de travail ne peut pas être configuré avec une clé gérée par le client."
references:
  - title: Azure Monitor customer-managed keys
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/customer-managed-keys
  - title: Create and manage a dedicated cluster in Azure Monitor Logs
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/logs-dedicated-clusters
