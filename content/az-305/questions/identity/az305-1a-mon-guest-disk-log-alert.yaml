id: az305-1a-mon-guest-disk-log-alert
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has 250 Azure virtual machines in the West Europe region. The Azure Monitor Agent sends the guest performance counters of the virtual machines to a Log Analytics workspace named **WS1**. The counters are sent to no other destination.

    You need to recommend an alerting solution that meets the following requirements:

    - An alert must fire when the free space of a logical disk of any virtual machine falls below 10 percent.
    - Each alert must identify the affected virtual machine.
    - The number of alert rules must be minimized.

    What should you recommend?
  fr: |
    Fabrikam dispose de 250 machines virtuelles Azure dans la région Europe Ouest. L'agent Azure Monitor envoie les compteurs de performances du système invité des machines virtuelles vers un espace de travail Log Analytics nommé **WS1**. Les compteurs ne sont envoyés vers aucune autre destination.

    Vous devez recommander une solution d'alerte qui répond aux exigences suivantes :

    - Une alerte doit se déclencher quand l'espace libre d'un disque logique d'une machine virtuelle passe sous 10 %.
    - Chaque alerte doit identifier la machine virtuelle concernée.
    - Le nombre de règles d'alerte doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "One metric alert rule scoped to all the virtual machines of the region in the subscription"
        fr: "Une règle d'alerte de métrique dont l'étendue est l'ensemble des machines virtuelles de la région dans l'abonnement"
    - id: b
      text:
        en: "One metric alert rule for each virtual machine"
        fr: "Une règle d'alerte de métrique pour chaque machine virtuelle"
    - id: c
      text:
        en: "One Resource Health alert rule scoped to the subscription"
        fr: "Une règle d'alerte Resource Health dont l'étendue est l'abonnement"
    - id: d
      text:
        en: "One log search alert rule scoped to WS1 that splits the results by virtual machine"
        fr: "Une règle d'alerte de recherche dans les journaux dont l'étendue est WS1 et qui fractionne les résultats par machine virtuelle"
answer: { optionId: d }
explanation:
  correct:
    en: |
      The free space of a logical disk is a guest counter, and here it exists only as log records in WS1. A log search alert rule runs a KQL query on the workspace, and splitting by a dimension such as the computer creates a separate alert for each virtual machine, so one rule covers the 250 machines.
    fr: |
      L'espace libre d'un disque logique est un compteur du système invité, et il n'existe ici que sous forme d'enregistrements de journal dans WS1. Une règle d'alerte de recherche dans les journaux exécute une requête KQL sur l'espace de travail, et le fractionnement par une dimension comme l'ordinateur crée une alerte distincte pour chaque machine virtuelle : une seule règle couvre donc les 250 machines.
  options:
    a:
      en: "A metric alert rule that monitors multiple resources uses platform metrics; it isn't supported for the guest metrics of virtual machines, and the counters aren't stored as metrics here."
      fr: "Une règle d'alerte de métrique qui surveille plusieurs ressources utilise les métriques de plateforme ; elle n'est pas prise en charge pour les métriques du système invité des machines virtuelles, et les compteurs ne sont pas stockés ici sous forme de métriques."
    b:
      en: "The counters aren't available as metrics of the virtual machines, and 250 rules wouldn't minimize the number of rules."
      fr: "Les compteurs ne sont pas disponibles comme métriques des machines virtuelles, et 250 règles ne réduiraient pas le nombre de règles."
    c:
      en: "Resource Health reports whether a resource is available; it knows nothing of the free space inside the guest operating system."
      fr: "Resource Health indique si une ressource est disponible ; il ne sait rien de l'espace libre à l'intérieur du système d'exploitation invité."
references:
  - title: Choose the right type of alert rule
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
