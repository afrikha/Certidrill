id: az305-1b-kv-purge-protection-cmk
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. encrypts its storage accounts with customer-managed keys that are stored in a key vault named **kv-keys**. The vault was created with a soft-delete retention period of 90 days.

    A risk review identifies the following scenario: an administrator who has full permissions on the vault deletes a key and then removes it permanently, which makes the encrypted data unreadable forever.

    You need to recommend a control so that a deleted key stays recoverable in the vault during the whole retention period, whatever the permissions of the administrator.

    What should you recommend?
  fr: |
    Litware, Inc. chiffre ses comptes de stockage avec des clés gérées par le client, stockées dans un coffre de clés nommé **kv-keys**. Le coffre a été créé avec une période de rétention de la suppression réversible de 90 jours.

    Une revue des risques identifie le scénario suivant : un administrateur qui dispose de toutes les autorisations sur le coffre supprime une clé, puis la supprime définitivement, ce qui rend les données chiffrées illisibles pour toujours.

    Vous devez recommander un contrôle pour qu'une clé supprimée reste récupérable dans le coffre pendant toute la période de rétention, quelles que soient les autorisations de l'administrateur.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A CanNotDelete lock on the vault", fr: "Un verrou CanNotDelete sur le coffre" }
    - id: b
      text: { en: "Purge protection on the vault", fr: "La protection contre la suppression définitive sur le coffre" }
    - id: c
      text: { en: "A weekly backup of the key", fr: "Une sauvegarde hebdomadaire de la clé" }
    - id: d
      text: { en: "A rotation policy on the key", fr: "Une stratégie de rotation sur la clé" }
answer: { optionId: b }
explanation:
  correct:
    en: "Soft delete keeps a deleted key recoverable, but a principal with the purge permission can still remove it permanently. With purge protection, a deleted vault or object can't be purged by anyone until the retention period has passed. Azure Storage requires both soft delete and purge protection on a vault that holds customer-managed keys."
    fr: "La suppression réversible maintient une clé supprimée à l'état récupérable, mais un principal qui dispose de l'autorisation de suppression définitive peut encore la retirer pour de bon. Avec la protection contre la suppression définitive, un coffre ou un objet supprimé ne peut être supprimé définitivement par personne avant la fin de la période de rétention. Stockage Azure exige à la fois la suppression réversible et la protection contre la suppression définitive sur un coffre qui contient des clés gérées par le client."
  options:
    a:
      en: "A lock protects the vault resource in the control plane. Deleting or purging a key is a data plane operation, which the lock doesn't block."
      fr: "Un verrou protège la ressource coffre dans le plan de contrôle. Supprimer une clé, de manière réversible ou définitive, est une opération du plan de données, que le verrou ne bloque pas."
    c:
      en: "A backup allows a restore, but it doesn't keep the deleted key recoverable in the vault, and the administrator can still purge the key."
      fr: "Une sauvegarde permet une restauration, mais elle ne maintient pas la clé supprimée à l'état récupérable dans le coffre, et l'administrateur peut toujours supprimer définitivement la clé."
    d:
      en: "A rotation policy creates new versions of the key on a schedule; it doesn't prevent the key from being purged."
      fr: "Une stratégie de rotation crée de nouvelles versions de la clé selon un calendrier ; elle n'empêche pas la suppression définitive de la clé."
references:
  - title: "Azure Key Vault: soft-delete overview"
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview
  - title: Customer-managed keys for Azure Storage encryption
    url: https://learn.microsoft.com/en-us/azure/storage/common/customer-managed-keys-overview
