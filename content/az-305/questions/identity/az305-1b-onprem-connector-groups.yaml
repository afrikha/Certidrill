id: az305-1b-onprem-connector-groups
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has datacenters in Paris and in Singapore. Each datacenter hosts the web applications of the local subsidiaries, and the link between the two datacenters is slow and expensive. Proseware publishes the applications to remote users with Microsoft Entra application proxy.

    You need to recommend a connector design that meets the following requirements:

    - The requests for an application are handled by connectors in the datacenter that hosts the application.
    - The failure of one connector server doesn't interrupt access to the applications.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose de centres de données à Paris et à Singapour. Chaque centre de données héberge les applications web des filiales locales, et la liaison entre les deux centres de données est lente et coûteuse. Proseware publie les applications pour les utilisateurs distants avec le proxy d'application Microsoft Entra.

    Vous devez recommander une conception des connecteurs qui répond aux exigences suivantes :

    - Les requêtes destinées à une application sont traitées par des connecteurs situés dans le centre de données qui héberge l'application.
    - La panne d'un serveur de connecteur n'interrompt pas l'accès aux applications.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Keep all the connectors of both datacenters in the default connector group.", fr: "Conserver tous les connecteurs des deux centres de données dans le groupe de connecteurs par défaut." }
    - id: b
      text: { en: "Create one connector group per datacenter and assign each application to the group of its datacenter.", fr: "Créer un groupe de connecteurs par centre de données et affecter chaque application au groupe de son centre de données." }
    - id: c
      text: { en: "Install at least two connectors in each datacenter.", fr: "Installer au moins deux connecteurs dans chaque centre de données." }
    - id: d
      text: { en: "Install a single connector in a perimeter network that both datacenters can reach.", fr: "Installer un seul connecteur dans un réseau de périmètre que les deux centres de données peuvent joindre." }
    - id: e
      text: { en: "Open inbound TCP port 443 from the internet to the connector servers.", fr: "Ouvrir le port TCP 443 entrant depuis Internet vers les serveurs de connecteurs." }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "Connector groups assign specific connectors to specific applications: a group per datacenter keeps the traffic of an application on local connectors instead of crossing the link between the sites. The connectors of a group work as one unit for high availability and load balancing, so each group needs more than one connector to survive the loss of a server."
    fr: "Les groupes de connecteurs affectent des connecteurs précis à des applications précises : un groupe par centre de données maintient le trafic d'une application sur des connecteurs locaux au lieu de lui faire traverser la liaison entre les sites. Les connecteurs d'un groupe fonctionnent comme une seule unité pour la haute disponibilité et l'équilibrage de charge : chaque groupe a donc besoin de plusieurs connecteurs pour survivre à la perte d'un serveur."
  options:
    a:
      en: "In a single group, any connector can serve any application, so requests for a Paris application could be sent through Singapore."
      fr: "Dans un groupe unique, n'importe quel connecteur peut servir n'importe quelle application : des requêtes destinées à une application de Paris pourraient passer par Singapour."
    d:
      en: "A single connector is a single point of failure, and connectors need no perimeter network."
      fr: "Un connecteur unique est un point de défaillance unique, et les connecteurs n'ont pas besoin d'un réseau de périmètre."
    e:
      en: "Connectors only make outbound connections to the application proxy service; no inbound port is required."
      fr: "Les connecteurs n'établissent que des connexions sortantes vers le service de proxy d'application ; aucun port entrant n'est nécessaire."
references:
  - title: Microsoft Entra private network connector groups
    url: https://learn.microsoft.com/en-us/entra/global-secure-access/concept-connector-groups
