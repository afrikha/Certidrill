id: az305-1c-allowed-locations-yn
objective: "1.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a management group named **MG-Contoso** that contains a subscription named **Sub1**. Sub1 contains a virtual machine named **VM1** in the East US region. A user named **User1** has the Owner role on Sub1.

    To keep its data in Europe, Contoso assigns the built-in policy **Allowed locations** at MG-Contoso, with the values West Europe and North Europe. The assignment has no exclusion and no exemption.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un groupe d'administration nommé **MG-Contoso** qui contient un abonnement nommé **Sub1**. Sub1 contient une machine virtuelle nommée **VM1** dans la région East US. Un utilisateur nommé **User1** a le rôle Owner sur Sub1.

    Pour conserver ses données en Europe, Contoso attribue la stratégie intégrée **Allowed locations** sur MG-Contoso, avec les valeurs West Europe et North Europe. L'attribution n'a ni exclusion ni exemption.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A subscription that is moved into MG-Contoso next month is subject to the policy without a new assignment."
        fr: "Un abonnement déplacé dans MG-Contoso le mois prochain est soumis à la stratégie sans nouvelle attribution."
    - id: s2
      text:
        en: "VM1 keeps running and is reported as non-compliant."
        fr: "VM1 continue de fonctionner et est signalée comme non conforme."
    - id: s3
      text:
        en: "User1 can create a storage account in East US in Sub1."
        fr: "User1 peut créer un compte de stockage dans East US dans Sub1."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "A policy assigned at a management group is inherited by every subscription below it, including those that arrive later. Allowed locations uses the deny effect, which refuses new non-compliant requests but doesn't touch existing resources, so VM1 stays in place and is flagged as non-compliant. Azure Policy applies whoever makes the request, so the Owner role doesn't let User1 deploy outside the allowed regions."
    fr: "Une stratégie attribuée sur un groupe d'administration est héritée par tous les abonnements situés en dessous, y compris ceux qui arrivent plus tard. Allowed locations utilise l'effet deny, qui refuse les nouvelles requêtes non conformes sans toucher aux ressources existantes : VM1 reste en place et est signalée comme non conforme. Azure Policy s'applique quel que soit l'auteur de la requête : le rôle Owner ne permet donc pas à User1 de déployer hors des régions autorisées."
references:
  - title: What is Azure Policy?
    url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
