id: az305-1b-authz-abac-blob-tags
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. stores the engineering documents of 30 projects in a single container of an Azure Storage account. The hierarchical namespace isn't enabled. Each blob has a blob index tag named `Project` whose value is the name of the project. Each project team has a Microsoft Entra group.

    You need to recommend an authorization solution that meets the following requirements:

    - A team can read only the blobs of its project.
    - The blobs stay in the single container.
    - No key and no shared access signature (SAS) is distributed to the teams.

    What should you recommend?
  fr: |
    Fabrikam, Inc. stocke les documents d'ingénierie de 30 projets dans un seul conteneur d'un compte Stockage Azure. L'espace de noms hiérarchique n'est pas activé. Chaque objet blob porte une étiquette d'index de blob nommée `Project`, dont la valeur est le nom du projet. Chaque équipe de projet dispose d'un groupe Microsoft Entra.

    Vous devez recommander une solution d'autorisation qui répond aux exigences suivantes :

    - Une équipe ne peut lire que les blobs de son projet.
    - Les blobs restent dans le conteneur unique.
    - Aucune clé ni aucune signature d'accès partagé (SAS) n'est distribuée aux équipes.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "The Storage Blob Data Reader role with a condition on the blob index tag", fr: "Le rôle Storage Blob Data Reader avec une condition sur l'étiquette d'index de blob" }
    - id: b
      text: { en: "The Storage Blob Data Reader role assigned at the container scope", fr: "Le rôle Storage Blob Data Reader attribué à l'étendue du conteneur" }
    - id: c
      text: { en: "A service SAS for each project, linked to a stored access policy", fr: "Une SAS de service pour chaque projet, liée à une stratégie d'accès stockée" }
    - id: d
      text: { en: "A custom role for each project that uses NotDataActions", fr: "Un rôle personnalisé pour chaque projet, qui utilise NotDataActions" }
answer: { optionId: a }
explanation:
  correct:
    en: "Azure attribute-based access control (ABAC) adds a condition to a role assignment that has blob data actions. A condition that compares the `Project` blob index tag with the project of the team lets each group read only the matching blobs, with Microsoft Entra authorization and without moving the data."
    fr: "Le contrôle d'accès basé sur les attributs Azure (ABAC) ajoute une condition à une attribution de rôle comportant des actions de données de blob. Une condition qui compare l'étiquette d'index de blob `Project` au projet de l'équipe permet à chaque groupe de ne lire que les blobs correspondants, avec l'autorisation Microsoft Entra et sans déplacer les données."
  options:
    b:
      en: "Without a condition, the role at the container scope lets every team read the blobs of all 30 projects."
      fr: "Sans condition, le rôle à l'étendue du conteneur permet à chaque équipe de lire les blobs des 30 projets."
    c:
      en: "A service SAS on the container grants access to all its blobs, and it is a token that has to be distributed, which the requirements exclude."
      fr: "Une SAS de service sur le conteneur donne accès à tous ses blobs, et c'est un jeton à distribuer, ce que les exigences excluent."
    d:
      en: "NotDataActions removes operations from a role; it can't filter the blobs on the value of a tag."
      fr: "NotDataActions retire des opérations d'un rôle ; il ne peut pas filtrer les blobs selon la valeur d'une étiquette."
references:
  - title: What is Azure attribute-based access control (Azure ABAC)?
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/conditions-overview
