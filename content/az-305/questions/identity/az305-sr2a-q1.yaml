stem:
  en: |
    You recommend an access package in entitlement management.
  fr: |
    Vous recommandez un package d'accès dans la gestion des droits d'utilisation.
body:
  solution:
    en: |
      You recommend **entitlement management**. Adatum is added as a **connected organization**, and an **access package** contains Group1, Site1 and App1. The policy of the access package lets the users of Adatum request it, requires the approval of the manager of Project1 and makes each assignment expire after 90 days. The settings for the lifecycle of external users remove a guest account that loses its last assignment.
    fr: |
      Vous recommandez la **gestion des droits d'utilisation**. Adatum est ajoutée en tant qu'**organisation connectée**, et un **package d'accès** contient Group1, Site1 et App1. La stratégie du package d'accès permet aux utilisateurs d'Adatum de le demander, exige l'approbation du responsable de Project1 et fait expirer chaque attribution après 90 jours. Les paramètres du cycle de vie des utilisateurs externes suppriment un compte invité qui perd sa dernière attribution.
answer: { value: true }
explanation:
  correct:
    en: |
      An access package bundles groups, applications and SharePoint sites, so one request covers the three resources. A policy for users who aren't in the directory lets the members of a connected organization request the package: when the request is approved, entitlement management invites the user and creates the guest account. The assignment expires after the configured duration, and the external user lifecycle settings block the guest account once its last assignment is gone, then delete it (after 30 days by default).
    fr: |
      Un package d'accès regroupe des groupes, des applications et des sites SharePoint : une seule demande couvre donc les trois ressources. Une stratégie destinée aux utilisateurs qui ne sont pas dans l'annuaire permet aux membres d'une organisation connectée de demander le package : une fois la demande approuvée, la gestion des droits d'utilisation invite l'utilisateur et crée le compte invité. L'attribution expire après la durée configurée, et les paramètres du cycle de vie des utilisateurs externes bloquent le compte invité dès que sa dernière attribution a disparu, puis le suppriment (après 30 jours par défaut).
