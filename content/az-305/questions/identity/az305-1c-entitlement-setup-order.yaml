id: az305-1c-entitlement-setup-order
objective: "1.3.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam starts a project with a partner named Contoso. Contoso is already configured as a connected organization in the Fabrikam tenant. Nothing else is configured in entitlement management.

    The Contoso users who work on the project must be able to request, through the My Access portal, a bundle made of a Microsoft Teams team, an enterprise application and a SharePoint site. The requests must be approved by the project sponsor, and the access must expire after one year.

    Which four actions should you recommend in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam démarre un projet avec un partenaire nommé Contoso. Contoso est déjà configuré comme organisation connectée dans le locataire Fabrikam. Rien d'autre n'est configuré dans la gestion des droits d'utilisation.

    Les utilisateurs de Contoso qui travaillent sur le projet doivent pouvoir demander, dans le portail Mon accès (My Access), un ensemble composé d'une équipe Microsoft Teams, d'une application d'entreprise et d'un site SharePoint. Les demandes doivent être approuvées par le sponsor du projet, et l'accès doit expirer après un an.

    Quelles sont les quatre actions à recommander dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: review, text: { en: "Create an access review of all the guest users of the tenant.", fr: "Créer une révision d'accès de tous les utilisateurs invités du locataire." } }
    - { id: package, text: { en: "Create an access package in the catalog and add the resource roles to it.", fr: "Créer un package d'accès dans le catalogue et y ajouter les rôles de ressources." } }
    - { id: invite, text: { en: "Invite each Contoso user as a guest and add the guest to the team.", fr: "Inviter chaque utilisateur de Contoso comme invité et ajouter l'invité à l'équipe." } }
    - { id: catalog, text: { en: "Create a catalog for the project.", fr: "Créer un catalogue pour le projet." } }
    - { id: policy, text: { en: "Add to the access package a policy that lets the users of the connected organization request it, with approval and expiration.", fr: "Ajouter au package d'accès une stratégie qui permet aux utilisateurs de l'organisation connectée de le demander, avec approbation et expiration." } }
    - { id: resources, text: { en: "Add the team, the application and the site to the catalog as resources.", fr: "Ajouter l'équipe, l'application et le site au catalogue en tant que ressources." } }
    - { id: pim, text: { en: "Make the Contoso users eligible for the Guest Inviter role in PIM.", fr: "Rendre les utilisateurs de Contoso éligibles au rôle Guest Inviter dans PIM." } }
answer:
  sequence: [ catalog, resources, package, policy ]
explanation:
  correct:
    en: "A catalog is the container of resources and access packages, so it comes first. A resource must be in the catalog before one of its roles can be added to an access package of that catalog. The access package then receives a policy that defines who can request it (here the users of the connected organization), who approves and when the assignments expire."
    fr: "Un catalogue est le conteneur des ressources et des packages d'accès : il vient donc en premier. Une ressource doit se trouver dans le catalogue avant que l'un de ses rôles puisse être ajouté à un package d'accès de ce catalogue. Le package d'accès reçoit ensuite une stratégie qui définit qui peut le demander (ici les utilisateurs de l'organisation connectée), qui approuve et quand les attributions expirent."
  options:
    invite:
      en: "Entitlement management creates the guest account when a request is approved. Manual invitations aren't needed."
      fr: "La gestion des droits d'utilisation crée le compte invité lorsqu'une demande est approuvée. Les invitations manuelles ne sont pas nécessaires."
    review:
      en: "A review of all guests checks existing access. It isn't a step of making the bundle requestable."
      fr: "Une révision de tous les invités vérifie des accès existants. Ce n'est pas une étape pour rendre l'ensemble demandable."
    pim:
      en: "The Guest Inviter role lets a user invite guests. The partner users don't need a directory role to request an access package."
      fr: "Le rôle Guest Inviter permet à un utilisateur d'inviter des invités. Les utilisateurs du partenaire n'ont pas besoin d'un rôle d'annuaire pour demander un package d'accès."
references:
  - title: What is entitlement management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-overview
