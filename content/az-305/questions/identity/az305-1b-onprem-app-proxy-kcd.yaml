id: az305-1b-onprem-app-proxy-kcd
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys publishes an on-premises web application through Microsoft Entra application proxy with Microsoft Entra ID pre-authentication. The application uses Integrated Windows Authentication. After they sign in to Microsoft Entra ID, remote users are prompted a second time, by the application, for their Windows credentials.

    You need to recommend a change so that users get single sign-on to the application. The application must not be modified.

    What should you include in the recommendation?
  fr: |
    Wingtip Toys publie une application web locale par le proxy d'application Microsoft Entra avec la préauthentification Microsoft Entra ID. L'application utilise l'authentification Windows intégrée. Après s'être connectés à Microsoft Entra ID, les utilisateurs distants sont invités une seconde fois, par l'application, à fournir leurs informations d'identification Windows.

    Vous devez recommander une modification pour que les utilisateurs bénéficient de l'authentification unique auprès de l'application. L'application ne doit pas être modifiée.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - id: a
      text: { en: "Kerberos constrained delegation for the private network connector", fr: "La délégation Kerberos contrainte pour le connecteur de réseau privé" }
    - id: b
      text: { en: "Password hash synchronization for the remote users", fr: "La synchronisation de hachage du mot de passe pour les utilisateurs distants" }
    - id: c
      text: { en: "Passthrough pre-authentication for the published application", fr: "La préauthentification directe (Passthrough) pour l'application publiée" }
    - id: d
      text: { en: "A second private network connector in the connector group", fr: "Un second connecteur de réseau privé dans le groupe de connecteurs" }
answer: { optionId: a }
explanation:
  correct:
    en: "For applications that use Integrated Windows Authentication, application proxy provides single sign-on with Kerberos constrained delegation: the connector is allowed in Active Directory to impersonate the pre-authenticated user and to request a Kerberos ticket for the application. The application receives the ticket that it expects and needs no change."
    fr: "Pour les applications qui utilisent l'authentification Windows intégrée, le proxy d'application fournit l'authentification unique avec la délégation Kerberos contrainte : le connecteur est autorisé dans Active Directory à emprunter l'identité de l'utilisateur préauthentifié et à demander un ticket Kerberos pour l'application. L'application reçoit le ticket qu'elle attend et n'a besoin d'aucune modification."
  options:
    b:
      en: "Password hash synchronization changes how users sign in to Microsoft Entra ID; it doesn't give the application a Kerberos ticket."
      fr: "La synchronisation de hachage du mot de passe modifie la manière dont les utilisateurs se connectent à Microsoft Entra ID ; elle ne fournit pas de ticket Kerberos à l'application."
    c:
      en: "With passthrough, Microsoft Entra ID no longer authenticates the user before the application, so there is no identity to delegate and the application still prompts."
      fr: "Avec le mode Passthrough, Microsoft Entra ID n'authentifie plus l'utilisateur avant l'application : il n'y a donc aucune identité à déléguer, et l'application demande toujours les informations d'identification."
    d:
      en: "A second connector adds availability, not single sign-on."
      fr: "Un second connecteur ajoute de la disponibilité, pas l'authentification unique."
references:
  - title: Kerberos Constrained Delegation for single sign-on (SSO) to your apps with application proxy
    url: https://learn.microsoft.com/en-us/entra/identity/app-proxy/how-to-configure-sso-with-kcd
