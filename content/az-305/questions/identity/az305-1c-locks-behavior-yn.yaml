id: az305-1c-locks-behavior-yn
objective: "1.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam protects its production resources with resource locks:

    - A resource group named **RG-Prod** has a `CanNotDelete` lock.
    - A storage account named **stfabrikamlogs**, in another resource group, has a `ReadOnly` lock.

    **Admin1** has the Owner role on the subscription. **Admin2** has the Contributor role on the subscription. An application named **App1** signs in with Microsoft Entra ID and has the Storage Blob Data Contributor role on stfabrikamlogs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam protège ses ressources de production avec des verrous de ressources :

    - Un groupe de ressources nommé **RG-Prod** porte un verrou `CanNotDelete`.
    - Un compte de stockage nommé **stfabrikamlogs**, dans un autre groupe de ressources, porte un verrou `ReadOnly`.

    **Admin1** a le rôle Owner sur l'abonnement. **Admin2** a le rôle Contributor sur l'abonnement. Une application nommée **App1** se connecte avec Microsoft Entra ID et a le rôle Storage Blob Data Contributor sur stfabrikamlogs.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Admin2 can remove the lock from RG-Prod."
        fr: "Admin2 peut retirer le verrou de RG-Prod."
    - id: s2
      text:
        en: "While the lock is in place on stfabrikamlogs, App1 can upload blobs to the storage account."
        fr: "Tant que le verrou est en place sur stfabrikamlogs, App1 peut charger des objets blob dans le compte de stockage."
    - id: s3
      text:
        en: "While the lock is in place on RG-Prod, Admin1 can delete a virtual machine of RG-Prod."
        fr: "Tant que le verrou est en place sur RG-Prod, Admin1 peut supprimer une machine virtuelle de RG-Prod."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Managing locks requires access to `Microsoft.Authorization/locks/*`, which Owner and User Access Administrator have and Contributor doesn't. Locks act on the control plane only, so a `ReadOnly` lock on a storage account doesn't stop a data plane operation such as uploading a blob with Microsoft Entra authorization. A lock on a resource group is inherited by its resources and applies to every user and role, so even an Owner must remove the lock before deleting the virtual machine."
    fr: "La gestion des verrous exige l'accès à `Microsoft.Authorization/locks/*`, que détiennent Owner et User Access Administrator, mais pas Contributor. Les verrous n'agissent que sur le plan de contrôle : un verrou `ReadOnly` sur un compte de stockage n'empêche donc pas une opération du plan de données comme le chargement d'un objet blob avec une autorisation Microsoft Entra. Un verrou placé sur un groupe de ressources est hérité par ses ressources et s'applique à tous les utilisateurs et à tous les rôles : même un Owner doit retirer le verrou avant de supprimer la machine virtuelle."
references:
  - title: Lock your Azure resources to protect your infrastructure
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources
