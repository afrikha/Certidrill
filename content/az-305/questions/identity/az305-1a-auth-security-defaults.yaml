id: az305-1a-auth-security-defaults
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a Microsoft Entra tenant with 40 cloud-only users. The tenant uses Microsoft Entra ID Free.

    You need to recommend a solution that meets the following requirements:

    - All the users must register for multifactor authentication.
    - Administrators must complete multifactor authentication at every sign-in.
    - Legacy authentication protocols must be blocked.
    - No additional license may be purchased.

    What should you recommend?
  fr: |
    Wingtip Toys dispose d'un locataire Microsoft Entra de 40 utilisateurs cloud uniquement. Le locataire utilise Microsoft Entra ID Free.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Tous les utilisateurs doivent s'inscrire à l'authentification multifacteur.
    - Les administrateurs doivent effectuer l'authentification multifacteur à chaque connexion.
    - Les protocoles d'authentification hérités doivent être bloqués.
    - Aucune licence supplémentaire ne doit être achetée.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "Conditional Access policies"
        fr: "Des stratégies d'accès conditionnel"
    - id: b
      text:
        en: "Risk-based policies of Microsoft Entra ID Protection"
        fr: "Des stratégies basées sur les risques de Microsoft Entra ID Protection"
    - id: c
      text:
        en: "Microsoft Entra certificate-based authentication"
        fr: "L'authentification basée sur un certificat Microsoft Entra"
    - id: d
      text:
        en: "Security defaults"
        fr: "Les paramètres de sécurité par défaut"
answer: { optionId: d }
explanation:
  correct:
    en: |
      Security defaults are included at no extra cost in every edition. They require all users to register for multifactor authentication, require administrators to perform it at every sign-in, prompt the other users when necessary and block legacy authentication.
    fr: |
      Les paramètres de sécurité par défaut sont inclus sans frais supplémentaires dans toutes les éditions. Ils obligent tous les utilisateurs à s'inscrire à l'authentification multifacteur, imposent celle-ci aux administrateurs à chaque connexion, la demandent aux autres utilisateurs quand c'est nécessaire et bloquent l'authentification héritée.
  options:
    a:
      en: "Conditional Access can enforce the same controls with more flexibility, but it requires Microsoft Entra ID P1 licenses."
      fr: "L'accès conditionnel peut appliquer les mêmes contrôles avec plus de souplesse, mais il exige des licences Microsoft Entra ID P1."
    b:
      en: "Risk-based policies require Microsoft Entra ID P2 licenses and react to detected risk, not to every administrator sign-in."
      fr: "Les stratégies basées sur les risques exigent des licences Microsoft Entra ID P2 et réagissent au risque détecté, pas à chaque connexion d'administrateur."
    c:
      en: "Certificate-based authentication is free, but it requires a public key infrastructure and blocks neither legacy authentication nor password-only sign-ins by itself."
      fr: "L'authentification basée sur un certificat est gratuite, mais elle exige une infrastructure à clé publique et ne bloque à elle seule ni l'authentification héritée ni les connexions par mot de passe seul."
references:
  - title: Security defaults in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults
