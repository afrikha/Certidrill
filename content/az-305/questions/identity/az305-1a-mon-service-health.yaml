id: az305-1a-mon-service-health
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum runs its workloads in an Azure subscription that uses the North Europe and West Europe regions.

    The operations team must receive an email when Microsoft reports a service issue or a planned maintenance that affects the Azure services and regions used by the subscription.

    You need to recommend a monitoring solution.

    What should you recommend?
  fr: |
    Adatum exécute ses charges de travail dans un abonnement Azure qui utilise les régions Europe Nord et Europe Ouest.

    L'équipe d'exploitation doit recevoir un e-mail quand Microsoft signale un problème de service ou une maintenance planifiée qui touche les services et les régions Azure utilisés par l'abonnement.

    Vous devez recommander une solution de monitoring.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "A Service Health alert rule"
        fr: "Une règle d'alerte Service Health"
    - id: b
      text:
        en: "A Resource Health alert rule"
        fr: "Une règle d'alerte Resource Health"
    - id: c
      text:
        en: "A metric alert rule on the availability of each resource"
        fr: "Une règle d'alerte de métrique sur la disponibilité de chaque ressource"
    - id: d
      text:
        en: "A smart detection rule in Application Insights"
        fr: "Une règle de détection intelligente dans Application Insights"
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Service Health gives a personalized view of the service issues, planned maintenance and health advisories that concern the services and regions a subscription uses. A Service Health alert rule, with an action group, notifies the team when such an event is published.
    fr: |
      Azure Service Health donne une vue personnalisée des problèmes de service, des maintenances planifiées et des avis d'intégrité qui concernent les services et les régions utilisés par un abonnement. Une règle d'alerte Service Health, avec un groupe d'actions, prévient l'équipe quand un tel événement est publié.
  options:
    b:
      en: "Resource Health reports the health of individual resources, such as one virtual machine; it doesn't announce planned maintenance for a service in a region."
      fr: "Resource Health indique l'intégrité de ressources individuelles, comme une machine virtuelle ; il n'annonce pas la maintenance planifiée d'un service dans une région."
    c:
      en: "A metric alert reacts to the values of a resource after the fact; it knows nothing of the events that Microsoft announces."
      fr: "Une alerte de métrique réagit après coup aux valeurs d'une ressource ; elle ne sait rien des événements annoncés par Microsoft."
    d:
      en: "Smart detection analyzes the telemetry of an application monitored by Application Insights, such as an abnormal rise in failures."
      fr: "La détection intelligente analyse la télémétrie d'une application surveillée par Application Insights, par exemple une hausse anormale des échecs."
references:
  - title: What is Azure Service Health?
    url: https://learn.microsoft.com/en-us/azure/service-health/overview
  - title: Choose the right type of alert rule
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
