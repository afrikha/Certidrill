id: az305-cs3c-request-tracing
objective: "1.1.3"
type: single
caseStudy: az305-cs3c-alpineski
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a monitoring solution that meets the requirement of the operations team for the microservices.

    What should you recommend?
  fr: |
    Vous devez recommander une solution de monitoring qui satisfait l'exigence de l'équipe d'exploitation concernant les microservices.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Application Insights", fr: "Application Insights" } }
    - { id: b, text: { en: "Container insights", fr: "Container insights" } }
    - { id: c, text: { en: "Azure Service Health", fr: "Azure Service Health" } }
    - { id: d, text: { en: "Network Watcher Connection Monitor", fr: "Moniteur de connexion Network Watcher" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Application Insights collects the requests, dependencies and traces that the instrumented microservices emit. Its application map draws the components and the calls between them with their failure rate and duration, and its transaction search follows one request from service to service."
    fr: "Application Insights collecte les requêtes, les dépendances et les traces émises par les microservices instrumentés. Sa cartographie d'application dessine les composants et les appels entre eux avec leur taux d'échec et leur durée, et sa recherche de transactions suit une requête de service en service."
  options:
    b:
      en: "Container insights reports the processor, memory and health of Kubernetes nodes and containers. It doesn't trace a request through the application code."
      fr: "Container insights rend compte du processeur, de la mémoire et de l'intégrité des nœuds et des conteneurs Kubernetes. Il ne trace pas une requête à travers le code de l'application."
    c:
      en: "Service Health reports incidents and planned maintenance of the Azure platform. It knows nothing about the calls between the microservices."
      fr: "Service Health signale les incidents et les maintenances planifiées de la plateforme Azure. Il ne sait rien des appels entre les microservices."
    d:
      en: "Connection Monitor tests network reachability and latency between endpoints. It doesn't show application dependencies or failed requests."
      fr: "Le Moniteur de connexion teste l'accessibilité réseau et la latence entre des points de terminaison. Il ne montre ni les dépendances applicatives ni les requêtes en échec."
references:
  - title: Introduction to Application Insights - OpenTelemetry observability
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/app-insights-overview
