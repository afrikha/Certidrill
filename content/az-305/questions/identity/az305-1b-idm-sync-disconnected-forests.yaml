id: az305-1b-idm-sync-disconnected-forests
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has an on-premises Active Directory Domain Services (AD DS) forest named contoso.com and a Microsoft Entra tenant. Contoso acquires Fabrikam, Inc., which has its own AD DS forest named fabrikam.com. There is no network connectivity between the two forests, and none is planned.

    You need to recommend a solution to synchronize the users of both forests to the Contoso tenant. The solution must meet the following requirements:

    - Require no network connection between the forests.
    - Minimize the on-premises infrastructure to deploy and maintain.

    What should you recommend?
  fr: |
    Contoso, Ltd. dispose d'une forêt Active Directory Domain Services (AD DS) locale nommée contoso.com et d'un locataire Microsoft Entra. Contoso acquiert Fabrikam, Inc., qui possède sa propre forêt AD DS nommée fabrikam.com. Il n'existe aucune connectivité réseau entre les deux forêts, et aucune n'est prévue.

    Vous devez recommander une solution pour synchroniser les utilisateurs des deux forêts vers le locataire de Contoso. La solution doit répondre aux exigences suivantes :

    - Ne nécessiter aucune connexion réseau entre les forêts.
    - Réduire au minimum l'infrastructure locale à déployer et à maintenir.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Microsoft Entra Connect Sync on a server in the contoso.com forest", fr: "Microsoft Entra Connect Sync sur un serveur de la forêt contoso.com" }
    - id: b
      text: { en: "Microsoft Entra Cloud Sync with provisioning agents in each forest", fr: "Microsoft Entra Cloud Sync avec des agents d'approvisionnement dans chaque forêt" }
    - id: c
      text: { en: "Cross-tenant synchronization from a new Fabrikam tenant", fr: "La synchronisation interlocataire à partir d'un nouveau locataire Fabrikam" }
    - id: d
      text: { en: "Microsoft Entra Domain Services with a forest trust to each forest", fr: "Microsoft Entra Domain Services avec une approbation de forêt vers chaque forêt" }
answer: { optionId: b }
explanation:
  correct:
    en: "Microsoft Entra Cloud Sync handles disconnected forests natively: lightweight provisioning agents installed in each forest send their objects to the same tenant, and the configuration is held in the cloud. No synchronization server and no link between the forests are needed, which fits a merger or an acquisition."
    fr: "Microsoft Entra Cloud Sync gère nativement les forêts déconnectées : des agents d'approvisionnement légers installés dans chaque forêt envoient leurs objets vers le même locataire, et la configuration est conservée dans le cloud. Aucun serveur de synchronisation ni aucune liaison entre les forêts ne sont nécessaires, ce qui convient à une fusion ou à une acquisition."
  options:
    a:
      en: "A Connect Sync server must reach every forest that it synchronizes; disconnected forests aren't supported, and the server is additional infrastructure to maintain."
      fr: "Un serveur Connect Sync doit joindre chaque forêt qu'il synchronise ; les forêts déconnectées ne sont pas prises en charge, et le serveur est une infrastructure supplémentaire à maintenir."
    c:
      en: "Cross-tenant synchronization copies users from one Microsoft Entra tenant to another. It doesn't read an AD DS forest, so the Fabrikam forest would still need its own synchronization and a second tenant."
      fr: "La synchronisation interlocataire copie des utilisateurs d'un locataire Microsoft Entra vers un autre. Elle ne lit pas une forêt AD DS : la forêt Fabrikam aurait encore besoin de sa propre synchronisation et d'un second locataire."
    d:
      en: "Domain Services provides a managed domain in Azure that is filled from Microsoft Entra ID. It doesn't synchronize on-premises forests to the tenant, and a trust would require connectivity."
      fr: "Domain Services fournit dans Azure un domaine managé alimenté à partir de Microsoft Entra ID. Il ne synchronise pas des forêts locales vers le locataire, et une approbation exigerait une connectivité."
references:
  - title: What is Microsoft Entra Cloud Sync?
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/cloud-sync/what-is-cloud-sync
  - title: "Migrate from Microsoft Entra Connect Sync to Cloud Sync: decision guide"
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/cloud-sync/connect-to-cloud-sync-decision-guide
