id: az305-1b-kv-aks-csi-dd
objective: "1.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. runs microservices in an Azure Kubernetes Service (AKS) cluster. The pods need database passwords and TLS certificates that are stored in Azure Key Vault.

    You need to recommend a solution that meets the following requirements:

    - The secrets and certificates appear as files that are mounted in the pods, and they are refreshed when they are rotated in the vault.
    - No credential that gives access to the vault is stored in the cluster.
    - Each microservice accesses the vault with its own Microsoft Entra identity.

    What should you include in the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. exécute des microservices dans un cluster Azure Kubernetes Service (AKS). Les pods ont besoin de mots de passe de bases de données et de certificats TLS stockés dans Azure Key Vault.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Les secrets et les certificats apparaissent sous forme de fichiers montés dans les pods, et ils sont actualisés lorsqu'ils font l'objet d'une rotation dans le coffre.
    - Aucune information d'identification donnant accès au coffre n'est stockée dans le cluster.
    - Chaque microservice accède au coffre avec sa propre identité Microsoft Entra.

    Que devez-vous inclure dans la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Integration with Key Vault: [[int]]

      Authentication to Key Vault: [[auth]]
    fr: |
      Intégration à Key Vault : [[int]]

      Authentification auprès de Key Vault : [[auth]]
  slots:
    - id: int
      options:
        - { id: ref, text: { en: "Key Vault references in application settings", fr: "Des références Key Vault dans des paramètres d'application" } }
        - { id: ks, text: { en: "Kubernetes secrets created by the deployment pipeline", fr: "Des secrets Kubernetes créés par le pipeline de déploiement" } }
        - { id: csi, text: { en: "The Azure Key Vault provider for Secrets Store CSI Driver", fr: "Le fournisseur Azure Key Vault pour le pilote CSI du magasin de secrets" } }
    - id: auth
      options:
        - { id: wid, text: Microsoft Entra Workload ID }
        - { id: sp, text: { en: "A service principal whose client secret is a Kubernetes secret", fr: "Un principal de service dont le secret client est un secret Kubernetes" } }
        - { id: img, text: { en: "A certificate stored in the container images", fr: "Un certificat stocké dans les images de conteneur" } }
answer:
  values: { int: csi, auth: wid }
explanation:
  correct:
    en: "The Azure Key Vault provider for Secrets Store CSI Driver mounts secrets, keys and certificates of a vault into pods as a volume and can refresh them when they are rotated. With Microsoft Entra Workload ID, each workload exchanges the token of its Kubernetes service account for a Microsoft Entra token, so every microservice has its own identity and no secret is kept in the cluster."
    fr: "Le fournisseur Azure Key Vault pour le pilote CSI du magasin de secrets monte dans les pods, sous forme de volume, les secrets, les clés et les certificats d'un coffre, et peut les actualiser lors de leur rotation. Avec Microsoft Entra Workload ID, chaque charge de travail échange le jeton de son compte de service Kubernetes contre un jeton Microsoft Entra : chaque microservice a donc sa propre identité, et aucun secret n'est conservé dans le cluster."
  options:
    ref:
      en: "Key Vault references in application settings are a feature of App Service and Azure Functions, not of AKS."
      fr: "Les références Key Vault dans les paramètres d'application sont une fonctionnalité d'App Service et d'Azure Functions, pas d'AKS."
    ks:
      en: "Secrets copied by a pipeline are stored in the cluster and aren't refreshed when the vault rotates them."
      fr: "Des secrets copiés par un pipeline sont stockés dans le cluster et ne sont pas actualisés lorsque le coffre les renouvelle."
    sp:
      en: "The client secret would be a credential stored in the cluster."
      fr: "Le secret client serait une information d'identification stockée dans le cluster."
references:
  - title: Use the Azure Key Vault provider for Secrets Store CSI Driver in an Azure Kubernetes Service (AKS) cluster
    url: https://learn.microsoft.com/en-us/azure/aks/csi-secrets-store-driver
  - title: Workload identity federation concepts
    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation
