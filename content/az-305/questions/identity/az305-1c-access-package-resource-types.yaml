id: az305-1c-access-package-resource-types
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to use entitlement management. For each project, an access package must give a new project member everything that the project requires through a single request.

    You are listing what a catalog can contain, to decide what the access packages will grant directly.

    Which two types of resources can you add to a catalog and include in an access package?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit d'utiliser la gestion des droits d'utilisation. Pour chaque projet, un package d'accès doit donner à un nouveau membre du projet tout ce que le projet exige, par une seule demande.

    Vous dressez la liste de ce qu'un catalogue peut contenir, afin de décider ce que les packages d'accès accorderont directement.

    Quels sont les deux types de ressources que vous pouvez ajouter à un catalogue et inclure dans un package d'accès ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Azure Policy assignments", fr: "Attributions Azure Policy" }
    - id: b
      text: { en: "Microsoft Entra security groups", fr: "Groupes de sécurité Microsoft Entra" }
    - id: c
      text: { en: "Conditional Access policies", fr: "Stratégies d'accès conditionnel" }
    - id: d
      text: { en: "SharePoint Online sites", fr: "Sites SharePoint Online" }
    - id: e
      text: { en: "Resource locks", fr: "Verrous de ressources" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A catalog holds the resources that access packages can grant, among them Microsoft Entra security groups, Microsoft 365 groups and teams, enterprise applications and SharePoint Online sites. An access package then gives a role of each resource, such as member of a group or visitor of a site. Access to something else, for example an Azure role, is granted indirectly by putting the role on a group that the package manages."
    fr: "Un catalogue contient les ressources que les packages d'accès peuvent accorder, dont les groupes de sécurité Microsoft Entra, les groupes et équipes Microsoft 365, les applications d'entreprise et les sites SharePoint Online. Un package d'accès donne ensuite un rôle de chaque ressource, comme membre d'un groupe ou visiteur d'un site. L'accès à autre chose, par exemple un rôle Azure, s'accorde indirectement en plaçant le rôle sur un groupe que le package gère."
  options:
    a:
      en: "A policy assignment governs resources at a scope. It isn't an access right that a user can receive."
      fr: "Une attribution de stratégie régit des ressources à une étendue. Ce n'est pas un droit d'accès qu'un utilisateur peut recevoir."
    c:
      en: "Conditional Access policies set the conditions of sign-in for users and applications. They aren't resources of a catalog."
      fr: "Les stratégies d'accès conditionnel fixent les conditions de connexion des utilisateurs et des applications. Ce ne sont pas des ressources d'un catalogue."
    e:
      en: "Locks protect Azure resources against changes. They have no members or roles to grant."
      fr: "Les verrous protègent des ressources Azure contre les modifications. Ils n'ont ni membres ni rôles à accorder."
references:
  - title: What is entitlement management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-overview
