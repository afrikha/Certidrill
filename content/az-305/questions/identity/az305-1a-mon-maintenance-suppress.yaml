id: az305-1a-mon-maintenance-suppress
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders patches the virtual machines of a resource group named **RG-Prod** every Saturday between 22:00 and 02:00. Several alert rules monitor these virtual machines and other resources, and notify the on-call engineer through action groups.

    You need to recommend a solution that meets the following requirements:

    - During the patching window, the on-call engineer must not be notified of the alerts fired for the virtual machines of RG-Prod.
    - The alerts must still be recorded and visible in the Azure portal.
    - The alert rules must stay enabled.
    - Administrative effort must be minimized.

    What should you recommend?
  fr: |
    Northwind Traders applique les correctifs aux machines virtuelles d'un groupe de ressources nommé **RG-Prod** chaque samedi entre 22 h 00 et 2 h 00. Plusieurs règles d'alerte surveillent ces machines virtuelles et d'autres ressources, et notifient l'ingénieur d'astreinte par des groupes d'actions.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Pendant la fenêtre de mise à jour corrective, l'ingénieur d'astreinte ne doit pas être notifié des alertes déclenchées pour les machines virtuelles de RG-Prod.
    - Les alertes doivent tout de même être enregistrées et visibles dans le portail Azure.
    - Les règles d'alerte doivent rester activées.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "A scheduled Azure Automation runbook that disables the alert rules during the window"
        fr: "Un runbook Azure Automation planifié qui désactive les règles d'alerte pendant la fenêtre"
    - id: b
      text:
        en: "Dynamic thresholds in the alert rules"
        fr: "Des seuils dynamiques dans les règles d'alerte"
    - id: c
      text:
        en: "An alert processing rule scoped to RG-Prod that has a recurring schedule"
        fr: "Une règle de traitement des alertes dont l'étendue est RG-Prod et qui possède une planification périodique"
    - id: d
      text:
        en: "A Service Health alert rule for planned maintenance"
        fr: "Une règle d'alerte Service Health pour la maintenance planifiée"
answer: { optionId: c }
explanation:
  correct:
    en: |
      An alert processing rule changes fired alerts without touching the alert rules. Its suppression action removes the action groups from the alerts that match its scope, here RG-Prod, during a one-time or recurring schedule: the alerts still fire and stay visible, but nobody is notified.
    fr: |
      Une règle de traitement des alertes modifie les alertes déclenchées sans toucher aux règles d'alerte. Son action de suppression retire les groupes d'actions des alertes qui correspondent à son étendue, ici RG-Prod, pendant une planification ponctuelle ou périodique : les alertes se déclenchent toujours et restent visibles, mais personne n'est notifié.
  options:
    a:
      en: "Disabled rules fire no alert at all, for RG-Prod and for the other resources they monitor, and the runbook is one more thing to maintain."
      fr: "Des règles désactivées ne déclenchent plus aucune alerte, pour RG-Prod comme pour les autres ressources qu'elles surveillent, et le runbook est un élément de plus à maintenir."
    b:
      en: "A dynamic threshold adapts to the usual pattern of a metric; it doesn't silence notifications during a time window."
      fr: "Un seuil dynamique s'adapte au comportement habituel d'une métrique ; il ne fait pas taire les notifications pendant une plage horaire."
    d:
      en: "Service Health reports the maintenance that Microsoft plans on the platform; it has no effect on the company's own alerts."
      fr: "Service Health signale la maintenance que Microsoft planifie sur la plateforme ; il n'a aucun effet sur les alertes propres à l'entreprise."
references:
  - title: Alert processing rules
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-processing-rules
