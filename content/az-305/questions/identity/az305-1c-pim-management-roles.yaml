id: az305-1c-pim-management-roles
objective: "1.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware deploys Microsoft Entra Privileged Identity Management (PIM). Two teams will administer it:

    - The identity team will manage the eligible assignments and the role settings of Microsoft Entra roles.
    - The cloud platform team will manage the eligible assignments of Azure roles on a subscription named **Sub1**.

    You need to recommend the role to give to each team. The principle of least privilege must be applied.

    Which role should you recommend for each team? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware déploie Microsoft Entra Privileged Identity Management (PIM). Deux équipes l'administreront :

    - L'équipe des identités gérera les attributions éligibles et les paramètres des rôles Microsoft Entra.
    - L'équipe de plateforme cloud gérera les attributions éligibles des rôles Azure sur un abonnement nommé **Sub1**.

    Vous devez recommander le rôle à donner à chaque équipe. Le principe du moindre privilège doit être appliqué.

    Quel rôle devez-vous recommander pour chaque équipe ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Identity team (Microsoft Entra role): [[entra]]

      Cloud platform team (Azure role on Sub1): [[azure]]
    fr: |
      Équipe des identités (rôle Microsoft Entra) : [[entra]]

      Équipe de plateforme cloud (rôle Azure sur Sub1) : [[azure]]
  slots:
    - id: entra
      options:
        - { id: ga, text: Global Administrator }
        - { id: pra, text: Privileged Role Administrator }
        - { id: sa, text: Security Administrator }
        - { id: ua, text: User Administrator }
    - id: azure
      options:
        - { id: contrib, text: Contributor }
        - { id: owner, text: Owner }
        - { id: secadmin, text: Security Admin }
        - { id: uaa, text: User Access Administrator }
answer:
  values: { entra: pra, azure: uaa }
explanation:
  correct:
    en: "For Microsoft Entra roles, PIM assignments and role settings are managed by Privileged Role Administrator, which is narrower than Global Administrator. For Azure roles, PIM is managed by principals that can manage role assignments at the scope, which means Owner or User Access Administrator. User Access Administrator manages access without the right to manage the resources themselves."
    fr: "Pour les rôles Microsoft Entra, les attributions PIM et les paramètres des rôles sont gérés par Privileged Role Administrator, plus restreint que Global Administrator. Pour les rôles Azure, PIM est géré par les principaux qui peuvent gérer les attributions de rôles à l'étendue concernée, c'est-à-dire Owner ou User Access Administrator. User Access Administrator gère les accès sans le droit de gérer les ressources elles-mêmes."
  options:
    ga:
      en: "Global Administrator can manage PIM, but it has every permission in the tenant, far more than the task needs."
      fr: "Global Administrator peut gérer PIM, mais il détient toutes les autorisations du locataire, bien plus que ne l'exige la tâche."
    sa:
      en: "Security Administrator manages security features and policies. It can't manage role assignments in PIM."
      fr: "Security Administrator gère les fonctionnalités et les stratégies de sécurité. Il ne peut pas gérer les attributions de rôles dans PIM."
    ua:
      en: "User Administrator manages users and groups. It can't manage assignments of privileged roles."
      fr: "User Administrator gère les utilisateurs et les groupes. Il ne peut pas gérer les attributions de rôles privilégiés."
    owner:
      en: "Owner can manage PIM for Sub1, but it also has full control of all the resources, which the task doesn't require."
      fr: "Owner peut gérer PIM pour Sub1, mais il a aussi le contrôle total de toutes les ressources, ce que la tâche n'exige pas."
    contrib:
      en: "Contributor manages resources but can't manage role assignments, so it can't manage PIM for Sub1."
      fr: "Contributor gère les ressources, mais ne peut pas gérer les attributions de rôles : il ne peut donc pas gérer PIM pour Sub1."
    secadmin:
      en: "Security Admin manages Microsoft Defender for Cloud settings and security policies. It can't manage role assignments."
      fr: "Security Admin gère les paramètres de Microsoft Defender pour le cloud et les stratégies de sécurité. Il ne peut pas gérer les attributions de rôles."
references:
  - title: Assign Azure resource roles in Privileged Identity Management
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-resource-roles-assign-roles
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
