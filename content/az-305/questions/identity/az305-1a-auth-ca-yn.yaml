id: az305-1a-auth-ca-yn
objective: "1.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Microsoft Entra tenant in which every user has a Microsoft Entra ID P1 license. You plan to recommend Conditional Access policies.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un locataire Microsoft Entra dans lequel chaque utilisateur possède une licence Microsoft Entra ID P1. Vous prévoyez de recommander des stratégies d'accès conditionnel.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A Conditional Access policy can require multifactor authentication only for the sign-ins that come from outside the IP address ranges of the offices."
        fr: "Une stratégie d'accès conditionnel peut exiger l'authentification multifacteur uniquement pour les connexions qui proviennent de l'extérieur des plages d'adresses IP des bureaux."
    - id: s2
      text:
        en: "Conditional Access policies are evaluated before the user completes the first authentication factor."
        fr: "Les stratégies d'accès conditionnel sont évaluées avant que l'utilisateur ait terminé le premier facteur d'authentification."
    - id: s3
      text:
        en: "A policy in report-only mode blocks the sign-ins that don't meet its requirements."
        fr: "Une stratégie en mode rapport seul bloque les connexions qui ne remplissent pas ses exigences."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Location, expressed as IP ranges or countries, is one of the signals of Conditional Access, so a policy can target the sign-ins that come from outside the offices. Policies are enforced after first-factor authentication is completed. In report-only mode, a policy is evaluated at each sign-in and its result is logged, but its controls aren't enforced: nobody is blocked or prompted.
    fr: |
      L'emplacement, exprimé en plages d'adresses IP ou en pays, fait partie des signaux de l'accès conditionnel : une stratégie peut donc cibler les connexions qui proviennent de l'extérieur des bureaux. Les stratégies sont appliquées une fois le premier facteur d'authentification terminé. En mode rapport seul, une stratégie est évaluée à chaque connexion et son résultat est journalisé, mais ses contrôles ne sont pas appliqués : personne n'est bloqué ni sollicité.
references:
  - title: What is Conditional Access?
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
  - title: Analyze Conditional Access Policy Impact
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-conditional-access-report-only
