id: az305-cs3b-employee-sign-in
objective: "1.2.1"
type: single
caseStudy: az305-cs3b-woodgrove
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend the authentication method that replaces AD FS for the employees. The solution must meet the identity and security requirements.

    What should you recommend?
  fr: |
    Vous devez recommander la méthode d'authentification qui remplace AD FS pour les employés. La solution doit satisfaire les exigences d'identité et de sécurité.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Password hash synchronization", fr: "La synchronisation de hachage du mot de passe" } }
    - { id: b, text: { en: "Pass-through authentication", fr: "L'authentification directe" } }
    - { id: c, text: { en: "Federation with a third-party identity provider", fr: "La fédération avec un fournisseur d'identité tiers" } }
    - { id: d, text: { en: "Microsoft Entra Domain Services", fr: "Microsoft Entra Domain Services" } }
answer: { optionId: b }
explanation:
  correct:
    en: "With pass-through authentication, lightweight agents installed on-premises validate each password against the domain controllers, so the account policies of AD DS, including sign-in hours and the disabled state, are enforced at the time of sign-in. The agents only make outbound connections and need no federation servers or perimeter network."
    fr: "Avec l'authentification directe, des agents légers installés localement valident chaque mot de passe auprès des contrôleurs de domaine : les stratégies de compte d'AD DS, dont les heures de connexion et l'état désactivé, sont donc appliquées au moment de la connexion. Les agents n'établissent que des connexions sortantes et ne demandent ni serveurs de fédération ni réseau de périmètre."
  options:
    a:
      en: "Password hash synchronization validates passwords in the cloud against a synchronized hash. Sign-in hours aren't enforced, and a disabled account can keep its access until the next synchronization."
      fr: "La synchronisation de hachage du mot de passe valide les mots de passe dans le cloud par rapport à un hachage synchronisé. Les heures de connexion ne sont pas appliquées, et un compte désactivé peut conserver son accès jusqu'à la synchronisation suivante."
    c:
      en: "Federation delegates the validation to a separate system, which is again a federation service to deploy and operate. The requirements exclude federation servers."
      fr: "La fédération délègue la validation à un système distinct, qui est de nouveau un service de fédération à déployer et à exploiter. Les exigences excluent les serveurs de fédération."
    d:
      en: "Domain Services provides a managed domain for workloads in Azure that need domain join, LDAP, Kerberos or NTLM. It isn't a sign-in method for Microsoft Entra ID."
      fr: "Domain Services fournit un domaine managé aux charges de travail dans Azure qui ont besoin de la jonction de domaine, de LDAP, de Kerberos ou de NTLM. Ce n'est pas une méthode de connexion à Microsoft Entra ID."
references:
  - title: Choose the right authentication method for your Microsoft Entra hybrid identity solution
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn
