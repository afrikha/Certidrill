id: az305-1a-mon-dynamic-threshold
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has an Azure Service Bus queue. The number of messages in the queue follows daily and weekly cycles, and the operations team doesn't know which value should be considered abnormal.

    The team must be alerted when the number of messages deviates from its usual pattern. The team doesn't want to maintain threshold values.

    You need to recommend an alert rule.

    What should you recommend?
  fr: |
    Proseware dispose d'une file d'attente Azure Service Bus. Le nombre de messages dans la file d'attente suit des cycles quotidiens et hebdomadaires, et l'équipe d'exploitation ne sait pas quelle valeur doit être considérée comme anormale.

    L'équipe doit être alertée quand le nombre de messages s'écarte de son comportement habituel. Elle ne veut pas maintenir de valeurs de seuil.

    Vous devez recommander une règle d'alerte.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "A metric alert rule that uses a static threshold"
        fr: "Une règle d'alerte de métrique qui utilise un seuil statique"
    - id: b
      text:
        en: "An activity log alert rule"
        fr: "Une règle d'alerte de journal d'activité"
    - id: c
      text:
        en: "A Resource Health alert rule"
        fr: "Une règle d'alerte Resource Health"
    - id: d
      text:
        en: "A metric alert rule that uses a dynamic threshold"
        fr: "Une règle d'alerte de métrique qui utilise un seuil dynamique"
answer: { optionId: d }
explanation:
  correct:
    en: |
      A dynamic threshold applies machine learning to the history of the metric, identifies its hourly, daily and weekly patterns, and calculates the upper and lower bounds by itself. The rule fires when the metric deviates from this expected behavior, with no value to choose or to maintain.
    fr: |
      Un seuil dynamique applique l'apprentissage automatique à l'historique de la métrique, repère ses comportements horaires, quotidiens et hebdomadaires, et calcule lui-même les limites haute et basse. La règle se déclenche quand la métrique s'écarte de ce comportement attendu, sans valeur à choisir ni à maintenir.
  options:
    a:
      en: "A static threshold is a fixed value that the team would have to choose and adjust, and it ignores the cycles of the queue."
      fr: "Un seuil statique est une valeur fixe que l'équipe devrait choisir et ajuster, et il ignore les cycles de la file d'attente."
    b:
      en: "An activity log alert fires on control plane operations, not on the values of a metric."
      fr: "Une alerte de journal d'activité se déclenche sur des opérations du plan de contrôle, pas sur les valeurs d'une métrique."
    c:
      en: "A Resource Health alert reports a change in the health status of the resource, not an unusual number of messages."
      fr: "Une alerte Resource Health signale un changement de l'état d'intégrité de la ressource, pas un nombre inhabituel de messages."
references:
  - title: Alert rules with dynamic thresholds overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-dynamic-thresholds
