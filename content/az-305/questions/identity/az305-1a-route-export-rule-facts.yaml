id: az305-1a-route-export-rule-facts
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Log Analytics workspace named **WS1** in the West Europe region. WS1 contains a table named **SecurityEvent** that uses the Analytics plan and a table named **ProxyLogs_CL** that uses the Auxiliary plan.

    You plan to recommend a data export rule that copies data from WS1 to a storage account.

    Which two statements about the planned rule are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un espace de travail Log Analytics nommé **WS1** dans la région Europe Ouest. WS1 contient une table nommée **SecurityEvent** qui utilise le plan Analytics et une table nommée **ProxyLogs_CL** qui utilise le plan Auxiliary.

    Vous prévoyez de recommander une règle d'exportation de données qui copie des données de WS1 vers un compte de stockage.

    Quelles sont les deux affirmations vraies au sujet de la règle prévue ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "The storage account must be located in West Europe."
        fr: "Le compte de stockage doit se trouver en Europe Ouest."
    - id: b
      text:
        en: "The records ingested during the 30 days before the creation of the rule are exported."
        fr: "Les enregistrements ingérés pendant les 30 jours précédant la création de la règle sont exportés."
    - id: c
      text:
        en: "The rule can export the records of ProxyLogs_CL."
        fr: "La règle peut exporter les enregistrements de ProxyLogs_CL."
    - id: d
      text:
        en: "The rule exports every new record of SecurityEvent, without any filter."
        fr: "La règle exporte tous les nouveaux enregistrements de SecurityEvent, sans aucun filtre."
    - id: e
      text:
        en: "The storage account can be a premium block blob account."
        fr: "Le compte de stockage peut être un compte d'objets blob de blocs Premium."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      The destination of a data export rule must be in the same region as the workspace. The export is continuous and has no filter: all the data of a selected table is exported as it arrives, and removing records requires a transformation before the data reaches the workspace.
    fr: |
      La destination d'une règle d'exportation de données doit se trouver dans la même région que l'espace de travail. L'exportation est continue et sans filtre : toutes les données d'une table sélectionnée sont exportées à leur arrivée, et retirer des enregistrements demande une transformation avant que les données atteignent l'espace de travail.
  options:
    b:
      en: "The export starts when the rule is configured; data ingested earlier is never exported by the rule."
      fr: "L'exportation commence à la configuration de la règle ; les données ingérées auparavant ne sont jamais exportées par la règle."
    c:
      en: "Data export rules support tables of the Analytics and Basic plans, not of the Auxiliary plan."
      fr: "Les règles d'exportation de données prennent en charge les tables des plans Analytics et Basic, pas celles du plan Auxiliary."
    e:
      en: "Premium storage accounts aren't supported as the destination of a data export rule."
      fr: "Les comptes de stockage Premium ne sont pas pris en charge comme destination d'une règle d'exportation de données."
references:
  - title: Log Analytics data export rules in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/logs-data-export
