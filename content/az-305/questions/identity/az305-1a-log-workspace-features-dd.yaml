id: az305-1a-log-workspace-features-dd
objective: "1.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso consolidates its logs in a single Log Analytics workspace named **WS-Central**.

    You need to recommend a workspace feature for each of the following requirements.

    Which feature should you recommend for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso regroupe ses journaux dans un seul espace de travail Log Analytics nommé **WS-Central**.

    Vous devez recommander une fonctionnalité de l'espace de travail pour chacune des exigences suivantes.

    Quelle fonctionnalité devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: resctx, text: { en: "Resource-context access", fr: "Accès en contexte de ressource" } }
    - { id: table, text: { en: "Table-level access", fr: "Accès au niveau des tables" } }
    - { id: tier, text: { en: "Commitment tier", fr: "Niveau d'engagement" } }
    - { id: cap, text: { en: "Daily cap", fr: "Plafond quotidien" } }
    - { id: cluster, text: { en: "Dedicated cluster", fr: "Cluster dédié" } }
    - { id: search, text: { en: "Search job", fr: "Travail de recherche" } }
  targets:
    - id: t1
      text:
        en: "Application owners query the logs of their own resources without holding any role on WS-Central."
        fr: "Les propriétaires d'applications interrogent les journaux de leurs propres ressources sans détenir aucun rôle sur WS-Central."
    - id: t2
      text:
        en: "Auditors who have access to WS-Central can read only the SigninLogs table."
        fr: "Les auditeurs qui ont accès à WS-Central ne peuvent lire que la table SigninLogs."
    - id: t3
      text:
        en: "The price of a predictable ingestion of 300 GB per day is reduced without deploying another resource."
        fr: "Le prix d'une ingestion prévisible de 300 Go par jour est réduit sans déployer d'autre ressource."
    - id: t4
      text:
        en: "Ingestion stops until the next day when an unexpected spike exceeds a set volume."
        fr: "L'ingestion s'arrête jusqu'au lendemain quand un pic inattendu dépasse un volume défini."
answer:
  mapping: { t1: resctx, t2: table, t3: tier, t4: cap }
explanation:
  correct:
    en: |
      With resource-context access, a user who can read a resource can query the logs of that resource without any permission on the workspace. Table-level access restricts the tables that a workspace user can read. A commitment tier is a pricing option of the workspace that discounts a committed daily volume, starting at 100 GB per day. A daily cap stops the collection of billable data for the rest of the day once the set volume is reached; it is a safeguard against spikes.
    fr: |
      Avec l'accès en contexte de ressource, un utilisateur qui peut lire une ressource peut interroger les journaux de cette ressource sans aucune autorisation sur l'espace de travail. L'accès au niveau des tables restreint les tables qu'un utilisateur de l'espace de travail peut lire. Un niveau d'engagement est une option tarifaire de l'espace de travail qui accorde une remise sur un volume quotidien engagé, à partir de 100 Go par jour. Un plafond quotidien arrête la collecte des données facturables pour le reste de la journée une fois le volume défini atteint ; c'est un garde-fou contre les pics.
  options:
    cluster:
      en: "A dedicated cluster is a separate resource, used for customer-managed keys or to share a commitment tier between several workspaces of a region."
      fr: "Un cluster dédié est une ressource distincte, utilisée pour les clés gérées par le client ou pour partager un niveau d'engagement entre plusieurs espaces de travail d'une région."
    search:
      en: "A search job retrieves records from long-term retention or scans large volumes of data; it controls neither access nor cost."
      fr: "Un travail de recherche récupère des enregistrements de la rétention à long terme ou analyse de grands volumes de données ; il ne contrôle ni l'accès ni le coût."
references:
  - title: Manage access to Log Analytics workspaces
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/manage-access
  - title: Azure Monitor Logs cost calculations and options
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/cost-logs
