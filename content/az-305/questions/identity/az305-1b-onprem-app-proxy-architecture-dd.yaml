id: az305-1b-onprem-app-proxy-architecture-dd
objective: "1.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. will publish an on-premises web application to remote users by using Microsoft Entra application proxy. You describe the architecture to the network team.

    How should you complete the description? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. va publier une application web locale pour des utilisateurs distants avec le proxy d'application Microsoft Entra. Vous décrivez l'architecture à l'équipe réseau.

    Comment devez-vous compléter la description ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The private network connector is installed [[where]].

      The connector communicates with the application proxy service through [[how]].
    fr: |
      Le connecteur de réseau privé est installé [[where]].

      Le connecteur communique avec le service de proxy d'application par [[how]].
  slots:
    - id: where
      options:
        - { id: dmz, text: { en: "on a reverse proxy in a perimeter network", fr: "sur un proxy inverse dans un réseau de périmètre" } }
        - { id: inside, text: { en: "on a Windows Server inside the on-premises network", fr: "sur un serveur Windows Server à l'intérieur du réseau local" } }
        - { id: device, text: { en: "on the device of each remote user", fr: "sur l'appareil de chaque utilisateur distant" } }
    - id: how
      options:
        - { id: inb, text: { en: "inbound connections on port 443", fr: "des connexions entrantes sur le port 443" } }
        - { id: ipsec, text: { en: "a site-to-site IPsec tunnel", fr: "un tunnel IPsec site à site" } }
        - { id: out, text: { en: "outbound connections on ports 80 and 443", fr: "des connexions sortantes sur les ports 80 et 443" } }
answer:
  values: { where: inside, how: out }
explanation:
  correct:
    en: "The private network connector is a lightweight agent that runs on Windows Server inside the network, where it can reach the application. It only opens outbound connections to the application proxy service, on ports 80 and 443, so the firewall needs no inbound rule and no perimeter network is required."
    fr: "Le connecteur de réseau privé est un agent léger qui s'exécute sur Windows Server à l'intérieur du réseau, là où il peut joindre l'application. Il n'ouvre que des connexions sortantes vers le service de proxy d'application, sur les ports 80 et 443 : le pare-feu n'a besoin d'aucune règle entrante, et aucun réseau de périmètre n'est nécessaire."
  options:
    device:
      en: "Remote users need only a browser; nothing is installed on their devices for application proxy."
      fr: "Les utilisateurs distants n'ont besoin que d'un navigateur ; rien n'est installé sur leurs appareils pour le proxy d'application."
references:
  - title: Microsoft Entra application proxy
    url: https://learn.microsoft.com/en-us/entra/identity/app-proxy/overview-what-is-app-proxy
