id: az305-1a-route-diag-limits-yn
objective: "1.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a key vault named **KV1** in the West Europe region. You are designing the diagnostic settings of KV1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un coffre de clés nommé **KV1** dans la région Europe Ouest. Vous concevez les paramètres de diagnostic de KV1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A single diagnostic setting can send the logs of KV1 to a Log Analytics workspace, a storage account and an event hub at the same time."
        fr: "Un seul paramètre de diagnostic peut envoyer les journaux de KV1 vers un espace de travail Log Analytics, un compte de stockage et un hub d'événements en même temps."
    - id: s2
      text:
        en: "A diagnostic setting can send the logs of KV1 to a Log Analytics workspace located in the East US region."
        fr: "Un paramètre de diagnostic peut envoyer les journaux de KV1 vers un espace de travail Log Analytics situé dans la région USA Est."
    - id: s3
      text:
        en: "Eight diagnostic settings can be created on KV1 to send its logs to eight Log Analytics workspaces."
        fr: "Huit paramètres de diagnostic peuvent être créés sur KV1 pour envoyer ses journaux vers huit espaces de travail Log Analytics."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      A diagnostic setting accepts one destination of each type, so a workspace, a storage account and an event hub can be combined in the same setting. A workspace used as destination can be in any region; only storage accounts and event hubs must be in the region of a regional resource. Each resource is limited to five diagnostic settings, so eight workspaces can't be fed directly from KV1.
    fr: |
      Un paramètre de diagnostic accepte une destination de chaque type : un espace de travail, un compte de stockage et un hub d'événements peuvent donc être réunis dans le même paramètre. Un espace de travail utilisé comme destination peut se trouver dans n'importe quelle région ; seuls les comptes de stockage et les hubs d'événements doivent se trouver dans la région d'une ressource régionale. Chaque ressource est limitée à cinq paramètres de diagnostic : huit espaces de travail ne peuvent donc pas être alimentés directement depuis KV1.
references:
  - title: Diagnostic settings in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings
