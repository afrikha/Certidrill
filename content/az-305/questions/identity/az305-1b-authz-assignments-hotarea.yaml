id: az305-1b-authz-assignments-hotarea
objective: "1.2.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a management group named **MG-Prod** that contains a subscription named **Sub-Finance**. Sub-Finance contains several resource groups, including **RG-Finance**. A user-assigned managed identity named **id-finance** is used by a reporting application.

    The platform team proposes the role assignments shown in the following table.

    Answer each prompt by selecting the assignment that meets the requirement with the least privilege.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un groupe d'administration nommé **MG-Prod** qui contient un abonnement nommé **Sub-Finance**. Sub-Finance contient plusieurs groupes de ressources, dont **RG-Finance**. Une identité managée affectée par l'utilisateur nommée **id-finance** est utilisée par une application de création de rapports.

    L'équipe de plateforme propose les attributions de rôles du tableau suivant.

    Répondez à chaque consigne en sélectionnant l'attribution qui répond à l'exigence avec le moindre privilège.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The platform group must manage the role assignments in all the subscriptions of MG-Prod, without managing the resources.", fr: "Le groupe de plateforme doit gérer les attributions de rôles dans tous les abonnements de MG-Prod, sans gérer les ressources." }
    - id: p2
      text: { en: "The reporting application must read the blobs of all the storage accounts of RG-Finance, and of no other resource group.", fr: "L'application de création de rapports doit lire les blobs de tous les comptes de stockage de RG-Finance, et d'aucun autre groupe de ressources." }
  grid:
    header: [{ en: "Assignment", fr: "Attribution" }, Principal, { en: "Role", fr: "Rôle" }, { en: "Scope", fr: "Étendue" }]
    rows:
      - [{ text: "A1", area: a1 }, { text: Group-Platform }, { text: Owner }, { text: { en: "Tenant root group", fr: "Groupe racine du locataire" } }]
      - [{ text: "A2", area: a2 }, { text: Group-Platform }, { text: Contributor }, { text: MG-Prod }]
      - [{ text: "A3", area: a3 }, { text: Group-Platform }, { text: User Access Administrator }, { text: MG-Prod }]
      - [{ text: "A4", area: a4 }, { text: id-finance }, { text: Reader }, { text: RG-Finance }]
      - [{ text: "A5", area: a5 }, { text: id-finance }, { text: Storage Blob Data Reader }, { text: Sub-Finance }]
      - [{ text: "A6", area: a6 }, { text: id-finance }, { text: Storage Blob Data Reader }, { text: RG-Finance }]
answer:
  values: { p1: a3, p2: a6 }
explanation:
  correct:
    en: "User Access Administrator manages access to Azure resources without managing the resources, and an assignment at MG-Prod is inherited by all its subscriptions and by nothing above. Storage Blob Data Reader is the data role that reads blobs; assigned at RG-Finance, it is inherited by every storage account of that resource group only."
    fr: "User Access Administrator gère l'accès aux ressources Azure sans gérer les ressources, et une attribution au niveau de MG-Prod est héritée par tous ses abonnements et par rien au-dessus. Storage Blob Data Reader est le rôle de données qui lit les blobs ; attribué au niveau de RG-Finance, il est hérité par tous les comptes de stockage de ce seul groupe de ressources."
  options:
    a1:
      en: "Owner at the tenant root group also manages the resources, in every subscription of the tenant."
      fr: "Owner au niveau du groupe racine du locataire gère aussi les ressources, dans tous les abonnements du locataire."
    a2:
      en: "Contributor manages the resources and can't create role assignments."
      fr: "Contributor gère les ressources et ne peut pas créer d'attributions de rôles."
    a4:
      en: "Reader is a control plane role: it shows the storage accounts but gives no access to blob data."
      fr: "Reader est un rôle du plan de contrôle : il montre les comptes de stockage, mais ne donne aucun accès aux données de blob."
    a5:
      en: "At the subscription scope, the role also reaches the storage accounts of the other resource groups."
      fr: "À l'étendue de l'abonnement, le rôle atteint aussi les comptes de stockage des autres groupes de ressources."
references:
  - title: Azure roles, Microsoft Entra roles, and classic subscription administrator roles
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles
  - title: Authorize access to blobs by using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/authorize-access-azure-active-directory
