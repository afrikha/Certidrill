id: az305-1b-idm-managed-identity-type-dd
objective: "1.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. plans two workloads in Azure. Neither workload may store a credential.

    - **App1** runs on a single virtual machine. Its identity must be removed automatically when the virtual machine is deleted, and the logs must show that this virtual machine performed the actions.
    - **App2** runs on a virtual machine scale set of 30 instances and on two function apps. All these resources need the same access to a key vault, and the access must be granted before the resources are deployed.

    Which type of identity should you recommend for each workload? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. prévoit deux charges de travail dans Azure. Aucune des deux ne doit stocker d'information d'identification.

    - **App1** s'exécute sur une seule machine virtuelle. Son identité doit être supprimée automatiquement lorsque la machine virtuelle est supprimée, et les journaux doivent montrer que cette machine virtuelle a effectué les actions.
    - **App2** s'exécute sur un groupe de machines virtuelles identiques de 30 instances et sur deux applications de fonction. Toutes ces ressources ont besoin du même accès à un coffre de clés, et l'accès doit être accordé avant le déploiement des ressources.

    Quel type d'identité devez-vous recommander pour chaque charge de travail ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      App1: [[a1]]

      App2: [[a2]]
    fr: |
      App1 : [[a1]]

      App2 : [[a2]]
  slots:
    - id: a1
      options:
        - { id: sys, text: { en: "A system-assigned managed identity", fr: "Une identité managée affectée par le système" } }
        - { id: usr, text: { en: "A user-assigned managed identity", fr: "Une identité managée affectée par l'utilisateur" } }
        - { id: sp, text: { en: "A service principal with a client secret", fr: "Un principal de service avec un secret client" } }
    - id: a2
      options:
        - { id: sys, text: { en: "A system-assigned managed identity", fr: "Une identité managée affectée par le système" } }
        - { id: usr, text: { en: "A user-assigned managed identity", fr: "Une identité managée affectée par l'utilisateur" } }
        - { id: sp, text: { en: "A service principal with a client secret", fr: "Un principal de service avec un secret client" } }
answer:
  values: { a1: sys, a2: usr }
explanation:
  correct:
    en: "A system-assigned managed identity is created with one resource, can't be shared and is deleted with it, so the logs point to that resource. A user-assigned managed identity is a standalone resource: it can be given its role assignments before the compute exists and then be attached to the scale set and to both function apps, which share the same permissions."
    fr: "Une identité managée affectée par le système est créée avec une ressource, ne peut pas être partagée et est supprimée avec elle : les journaux désignent donc cette ressource. Une identité managée affectée par l'utilisateur est une ressource autonome : elle peut recevoir ses attributions de rôles avant que les ressources de calcul n'existent, puis être associée au groupe de machines virtuelles identiques et aux deux applications de fonction, qui partagent les mêmes autorisations."
  options:
    sp:
      en: "A service principal with a client secret requires the secret to be stored and rotated, which both workloads must avoid."
      fr: "Un principal de service avec un secret client impose de stocker et de renouveler ce secret, ce que les deux charges de travail doivent éviter."
references:
  - title: What is managed identities for Azure resources?
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
  - title: Managed identity best practice recommendations
    url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/managed-identity-best-practice-recommendations
