id: az305-1a-route-lighthouse-dd
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware is a managed service provider that operates the Azure resources of 30 customers. Each customer has its own Microsoft Entra tenant and its own subscriptions.

    You need to recommend a logging design that meets the following requirements:

    - The logs of a customer must stay in the tenant of that customer.
    - Proseware operators must query the logs of all the customers from the Proseware tenant, without any user account in the customer tenants.
    - The resource logs of the customers' resources must be collected in a consistent way, with minimal administrative effort.

    How should you complete the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware est un fournisseur de services managés qui exploite les ressources Azure de 30 clients. Chaque client possède son propre locataire Microsoft Entra et ses propres abonnements.

    Vous devez recommander une conception de journalisation qui répond aux exigences suivantes :

    - Les journaux d'un client doivent rester dans le locataire de ce client.
    - Les opérateurs de Proseware doivent interroger les journaux de tous les clients depuis le locataire de Proseware, sans aucun compte d'utilisateur dans les locataires des clients.
    - Les journaux de ressources des ressources des clients doivent être collectés de façon homogène, avec un effort d'administration minimal.

    Comment devez-vous compléter la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Create the Log Analytics workspaces in [[where]].

      Give the operators access to the workspaces by using [[how]].

      Create the diagnostic settings of the customers' resources by using [[what]].
    fr: |
      Créer les espaces de travail Log Analytics dans [[where]].

      Donner aux opérateurs l'accès aux espaces de travail avec [[how]].

      Créer les paramètres de diagnostic des ressources des clients avec [[what]].
  slots:
    - id: where
      options:
        - { id: provider, text: { en: "the Proseware tenant", fr: "le locataire de Proseware" } }
        - { id: customer, text: { en: "each customer tenant", fr: "chaque locataire client" } }
        - { id: shared, text: { en: "a new tenant shared by all the customers", fr: "un nouveau locataire partagé par tous les clients" } }
    - id: how
      options:
        - { id: guests, text: { en: "B2B collaboration guest accounts", fr: "des comptes invités de la collaboration B2B" } }
        - { id: ampls, text: { en: "an Azure Monitor Private Link Scope", fr: "une étendue de liaison privée Azure Monitor" } }
        - { id: lighthouse, text: { en: "Azure Lighthouse", fr: "Azure Lighthouse" } }
    - id: what
      options:
        - { id: policy, text: { en: "Azure Policy assignments on the delegated subscriptions", fr: "des attributions Azure Policy sur les abonnements délégués" } }
        - { id: export, text: { en: "data export rules in the workspaces", fr: "des règles d'exportation de données dans les espaces de travail" } }
        - { id: apr, text: { en: "alert processing rules on the delegated subscriptions", fr: "des règles de traitement des alertes sur les abonnements délégués" } }
answer:
  values: { where: customer, how: lighthouse, what: policy }
explanation:
  correct:
    en: |
      Most resources can send monitoring data only to a workspace of their own tenant, and creating the workspaces in the customer tenants keeps each customer's data there. Azure Lighthouse delegates the customers' subscriptions to users and groups of the provider's tenant, so operators work, and run cross-workspace queries, without signing in to each customer tenant. Azure Policy deployed on the delegated subscriptions creates the diagnostic settings that send the resource logs to the workspace of each tenant.
    fr: |
      La plupart des ressources ne peuvent envoyer leurs données de monitoring qu'à un espace de travail de leur propre locataire, et créer les espaces de travail dans les locataires clients y maintient les données de chaque client. Azure Lighthouse délègue les abonnements des clients à des utilisateurs et des groupes du locataire du fournisseur : les opérateurs travaillent, et exécutent des requêtes sur plusieurs espaces de travail, sans se connecter à chaque locataire client. Azure Policy, déployé sur les abonnements délégués, crée les paramètres de diagnostic qui envoient les journaux de ressources vers l'espace de travail de chaque locataire.
  options:
    guests:
      en: "Guest accounts are user accounts created in each customer tenant, which the requirements exclude."
      fr: "Les comptes invités sont des comptes d'utilisateurs créés dans chaque locataire client, ce que les exigences excluent."
    export:
      en: "A data export rule sends data out of a workspace; it doesn't collect resource logs."
      fr: "Une règle d'exportation de données fait sortir des données d'un espace de travail ; elle ne collecte pas de journaux de ressources."
references:
  - title: Monitor delegated resources at scale
    url: https://learn.microsoft.com/en-us/azure/lighthouse/how-to/monitor-at-scale
  - title: Design a Log Analytics workspace architecture
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/workspace-design
