id: az305-1c-governance-licenses
objective: "1.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys plans three identity governance capabilities, each for a different population of users. For each capability, the company wants to identify the least expensive license that includes it.

    You need to recommend the license for each capability.

    Which license should you recommend for the users of each capability? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prévoit trois fonctionnalités de gouvernance des identités, chacune pour une population d'utilisateurs différente. Pour chaque fonctionnalité, l'entreprise veut identifier la licence la moins chère qui l'inclut.

    Vous devez recommander la licence pour chaque fonctionnalité.

    Quelle licence devez-vous recommander pour les utilisateurs de chaque fonctionnalité ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Administrators who activate their Microsoft Entra roles just in time with Privileged Identity Management: [[pim]]

      Employees whose onboarding and offboarding tasks are automated with lifecycle workflows: [[lcw]]

      Sales staff who must accept terms of use, enforced by a Conditional Access policy, before they open the CRM application: [[tou]]
    fr: |
      Administrateurs qui activent leurs rôles Microsoft Entra juste-à-temps avec Privileged Identity Management : [[pim]]

      Employés dont les tâches d'arrivée et de départ sont automatisées par des workflows de cycle de vie : [[lcw]]

      Commerciaux qui doivent accepter des conditions d'utilisation, imposées par une stratégie d'accès conditionnel, avant d'ouvrir l'application CRM : [[tou]]
  slots:
    - id: pim
      options:
        - { id: p1, text: Microsoft Entra ID P1 }
        - { id: p2, text: Microsoft Entra ID P2 }
        - { id: gov, text: Microsoft Entra ID Governance }
    - id: lcw
      options:
        - { id: p1, text: Microsoft Entra ID P1 }
        - { id: p2, text: Microsoft Entra ID P2 }
        - { id: gov, text: Microsoft Entra ID Governance }
    - id: tou
      options:
        - { id: p1, text: Microsoft Entra ID P1 }
        - { id: p2, text: Microsoft Entra ID P2 }
        - { id: gov, text: Microsoft Entra ID Governance }
answer:
  values: { pim: p2, lcw: gov, tou: p1 }
explanation:
  correct:
    en: "Privileged Identity Management is included in Microsoft Entra ID P2. Lifecycle workflows are one of the capabilities that require Microsoft Entra ID Governance licenses. Conditional Access, and the terms of use that it enforces, are available from Microsoft Entra ID P1, so P2 or Governance licenses would cost more than necessary for the sales staff."
    fr: "Privileged Identity Management est inclus dans Microsoft Entra ID P2. Les workflows de cycle de vie font partie des fonctionnalités qui exigent des licences Microsoft Entra ID Governance. L'accès conditionnel, et les conditions d'utilisation qu'il impose, sont disponibles à partir de Microsoft Entra ID P1 : des licences P2 ou Governance coûteraient plus que nécessaire pour les commerciaux."
references:
  - title: Microsoft Entra ID Governance licensing fundamentals
    url: https://learn.microsoft.com/en-us/entra/id-governance/licensing-fundamentals
