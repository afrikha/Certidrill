id: az305-1a-route-transform-dcr
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has 500 Linux virtual machines. The Azure Monitor Agent and a data collection rule named **DCR-Linux** send the Syslog events of the virtual machines to a Log Analytics workspace named **WS1**.

    About 40 percent of the collected records are informational messages of a single daemon. Nobody uses these records.

    You need to recommend a solution that meets the following requirements:

    - Adatum must stop paying for the ingestion of the unused records.
    - The other Syslog records must remain available to the existing alert rules.
    - The configuration of the virtual machines must not change.

    What should you recommend?
  fr: |
    Adatum dispose de 500 machines virtuelles Linux. L'agent Azure Monitor et une règle de collecte de données nommée **DCR-Linux** envoient les événements Syslog des machines virtuelles vers un espace de travail Log Analytics nommé **WS1**.

    Environ 40 % des enregistrements collectés sont des messages d'information d'un seul démon. Personne n'utilise ces enregistrements.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Adatum doit cesser de payer l'ingestion des enregistrements inutilisés.
    - Les autres enregistrements Syslog doivent rester disponibles pour les règles d'alerte existantes.
    - La configuration des machines virtuelles ne doit pas changer.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "Add a transformation to DCR-Linux."
        fr: "Ajouter une transformation à DCR-Linux."
    - id: b
      text:
        en: "Add a transformation to the workspace transformation DCR of WS1."
        fr: "Ajouter une transformation à la DCR de transformation de l'espace de travail WS1."
    - id: c
      text:
        en: "Set a daily cap on WS1."
        fr: "Définir un plafond quotidien sur WS1."
    - id: d
      text:
        en: "Create a data export rule for the Syslog table of WS1."
        fr: "Créer une règle d'exportation de données pour la table Syslog de WS1."
answer: { optionId: a }
explanation:
  correct:
    en: |
      A transformation is a KQL statement that runs at ingestion, before the data is written to the workspace, and it can drop the records that match a filter. Data collected by the Azure Monitor Agent is transformed in the data collection rule that is associated with the agent, here DCR-Linux, with no change on the machines.
    fr: |
      Une transformation est une instruction KQL exécutée à l'ingestion, avant l'écriture des données dans l'espace de travail, et elle peut supprimer les enregistrements qui correspondent à un filtre. Les données collectées par l'agent Azure Monitor se transforment dans la règle de collecte de données associée à l'agent, ici DCR-Linux, sans changement sur les machines.
  options:
    b:
      en: "The workspace transformation DCR applies only to data that doesn't arrive through another data collection rule, such as resource logs sent by diagnostic settings; it is ignored for data collected by the agent."
      fr: "La DCR de transformation de l'espace de travail ne s'applique qu'aux données qui n'arrivent pas par une autre règle de collecte de données, comme les journaux de ressources envoyés par les paramètres de diagnostic ; elle est ignorée pour les données collectées par l'agent."
    c:
      en: "A daily cap stops all billable ingestion for the rest of the day once it is reached, including the records that the alert rules need."
      fr: "Un plafond quotidien arrête toute l'ingestion facturable pour le reste de la journée dès qu'il est atteint, y compris les enregistrements dont les règles d'alerte ont besoin."
    d:
      en: "A data export rule copies records that are already ingested, and billed, to another destination."
      fr: "Une règle d'exportation de données copie vers une autre destination des enregistrements déjà ingérés, donc déjà facturés."
references:
  - title: Transformations in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/data-collection/data-collection-transformations
