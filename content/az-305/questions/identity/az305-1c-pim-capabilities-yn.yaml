id: az305-1c-pim-capabilities-yn
objective: "1.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to manage two roles with Microsoft Entra Privileged Identity Management (PIM): the User Administrator role in Microsoft Entra ID and the Owner role on a subscription named **Sub1**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit de gérer deux rôles avec Microsoft Entra Privileged Identity Management (PIM) : le rôle User Administrator dans Microsoft Entra ID et le rôle Owner sur un abonnement nommé **Sub1**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "PIM can require the approval of a designated approver before an activation of the Owner role on Sub1 takes effect."
        fr: "PIM peut exiger l'approbation d'un approbateur désigné avant qu'une activation du rôle Owner sur Sub1 prenne effet."
    - id: s2
      text:
        en: "A user who has an eligible assignment for User Administrator can reset the passwords of users before activating the role."
        fr: "Un utilisateur qui a une attribution éligible au rôle User Administrator peut réinitialiser les mots de passe des utilisateurs avant d'activer le rôle."
    - id: s3
      text:
        en: "An eligible assignment can have an end date after which the user can no longer activate the role."
        fr: "Une attribution éligible peut avoir une date de fin après laquelle l'utilisateur ne peut plus activer le rôle."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "PIM covers Microsoft Entra roles and Azure roles, and the settings of each role can require approval, multifactor authentication and a justification at activation. An eligible assignment gives no permission until the user activates the role, so the passwords can't be reset before activation. Eligible and active assignments can both be time-bound, with a start date and an end date."
    fr: "PIM couvre les rôles Microsoft Entra et les rôles Azure, et les paramètres de chaque rôle peuvent exiger une approbation, l'authentification multifacteur et une justification à l'activation. Une attribution éligible ne donne aucune autorisation tant que l'utilisateur n'a pas activé le rôle : les mots de passe ne peuvent donc pas être réinitialisés avant l'activation. Les attributions éligibles et actives peuvent toutes deux être limitées dans le temps, avec une date de début et une date de fin."
references:
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
