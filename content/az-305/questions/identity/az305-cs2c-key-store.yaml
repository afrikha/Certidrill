id: az305-cs2c-key-store
objective: "1.2.5"
type: single
caseStudy: az305-cs2c-tailwind-traders
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend where to store the customer-managed keys that encrypt db-orders and sttailwinddocs. The solution must meet the encryption requirement.

    What should you recommend?
  fr: |
    Vous devez recommander l'emplacement de stockage des clés gérées par le client qui chiffrent db-orders et sttailwinddocs. La solution doit respecter l'exigence relative au chiffrement.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: Azure Key Vault Standard }
    - { id: b, text: Azure Key Vault Premium }
    - { id: c, text: Azure Key Vault Managed HSM }
    - { id: d, text: Azure Cloud HSM }
answer: { optionId: c }
explanation:
  correct:
    en: Azure Key Vault Managed HSM is a fully managed, single-tenant HSM validated FIPS 140-3 Level 3 in which the customer, not Microsoft, holds administrative control of the HSM. It supports customer-managed keys for encryption at rest, so Azure services can use its keys directly.
    fr: Azure Key Vault Managed HSM est un HSM complètement managé, à locataire unique et validé FIPS 140-3 niveau 3, dont le client, et non Microsoft, détient le contrôle administratif. Il prend en charge les clés gérées par le client pour le chiffrement au repos ; les services Azure peuvent donc utiliser ses clés directement.
  options:
    a: { en: "Key Vault Standard is multitenant and protects its keys with software, not with an HSM.", fr: "Key Vault Standard est multilocataire et protège ses clés par logiciel, pas avec un HSM." }
    b: { en: "Key Vault Premium protects keys in HSMs, but it is a multitenant service whose HSMs are administered by Microsoft.", fr: "Key Vault Premium protège les clés dans des HSM, mais c'est un service multilocataire dont les HSM sont administrés par Microsoft." }
    d: { en: "Azure Cloud HSM is single-tenant, but it doesn't integrate with Azure platform services for customer-managed keys.", fr: "Azure Cloud HSM est à locataire unique, mais il ne s'intègre pas aux services de plateforme Azure pour les clés gérées par le client." }
references:
  - title: How to choose the right Azure key management solution
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/key-management-choose
