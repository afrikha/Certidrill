id: az305-1a-mon-visualization-dd
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso collects monitoring data in Azure Monitor. Three teams ask for visualizations.

    You need to recommend a visualization tool for each team.

    Which tool should you recommend for each team? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso collecte des données de monitoring dans Azure Monitor. Trois équipes demandent des visualisations.

    Vous devez recommander un outil de visualisation pour chaque équipe.

    Quel outil devez-vous recommander pour chaque équipe ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Infrastructure team: interactive reports in the Azure portal that combine the logs and metrics of Azure resources and Azure Arc-enabled servers: [[infra]]

      Platform team: Kubernetes dashboards that also read an open-source Prometheus server hosted outside Azure and are shared outside the Azure portal: [[platform]]

      Management: business-centric reports that combine log query results with sales data and show long-term KPI trends: [[mgmt]]
    fr: |
      Équipe infrastructure : des rapports interactifs dans le portail Azure qui combinent les journaux et les métriques des ressources Azure et des serveurs avec Azure Arc : [[infra]]

      Équipe plateforme : des tableaux de bord Kubernetes qui lisent aussi un serveur Prometheus open source hébergé hors d'Azure et sont partagés hors du portail Azure : [[platform]]

      Direction : des rapports orientés métier qui combinent des résultats de requêtes de journal avec des données de ventes et montrent les tendances à long terme des indicateurs clés : [[mgmt]]
  slots:
    - id: infra
      options:
        - { id: wb, text: { en: "Azure workbooks", fr: "Classeurs Azure" } }
        - { id: dash, text: { en: "Azure dashboards", fr: "Tableaux de bord Azure" } }
        - { id: grafana, text: "Azure Managed Grafana" }
        - { id: pbi, text: "Power BI" }
    - id: platform
      options:
        - { id: wb, text: { en: "Azure workbooks", fr: "Classeurs Azure" } }
        - { id: dash, text: { en: "Azure dashboards", fr: "Tableaux de bord Azure" } }
        - { id: grafana, text: "Azure Managed Grafana" }
        - { id: pbi, text: "Power BI" }
    - id: mgmt
      options:
        - { id: wb, text: { en: "Azure workbooks", fr: "Classeurs Azure" } }
        - { id: dash, text: { en: "Azure dashboards", fr: "Tableaux de bord Azure" } }
        - { id: grafana, text: "Azure Managed Grafana" }
        - { id: pbi, text: "Power BI" }
answer:
  values: { infra: wb, platform: grafana, mgmt: pbi }
explanation:
  correct:
    en: |
      Azure workbooks build interactive reports from the widest set of Azure data sources and suit hybrid environments managed with Azure Arc. Azure Managed Grafana is the choice for cloud-native scenarios such as Kubernetes when open-source or external data sources are needed and dashboards are shared outside the portal. Power BI creates business-centric reports, combines log query results with other data sources and analyzes long-term KPI trends.
    fr: |
      Les classeurs Azure construisent des rapports interactifs à partir du plus large ensemble de sources de données Azure et conviennent aux environnements hybrides gérés avec Azure Arc. Azure Managed Grafana est le choix des scénarios natifs cloud comme Kubernetes quand il faut des sources de données open source ou externes et des tableaux de bord partagés hors du portail. Power BI crée des rapports orientés métier, combine les résultats de requêtes de journal avec d'autres sources de données et analyse les tendances à long terme des indicateurs clés.
  options:
    dash:
      en: "Azure dashboards give a single pane of glass in the portal by pinning tiles from several services, with less interactivity than workbooks and no external data source."
      fr: "Les tableaux de bord Azure offrent une vue unique dans le portail en épinglant des vignettes de plusieurs services, avec moins d'interactivité que les classeurs et sans source de données externe."
references:
  - title: Visualize data in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/visualize/best-practices-visualize
