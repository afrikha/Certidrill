id: az305-1a-auth-risk-based
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Microsoft Entra tenant with cloud-only users. Every user has a Microsoft Entra ID P1 license and is registered for multifactor authentication.

    You need to recommend a solution that meets the following requirements:

    - A sign-in that Microsoft Entra ID evaluates as risky, for example from an anonymous IP address, must automatically require multifactor authentication.
    - A user whose credentials are found leaked must be forced to change the password securely at the next sign-in.
    - Licensing costs must be minimized.

    What should you recommend?
  fr: |
    Northwind Traders dispose d'un locataire Microsoft Entra dont les utilisateurs sont cloud uniquement. Chaque utilisateur possède une licence Microsoft Entra ID P1 et est inscrit à l'authentification multifacteur.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Une connexion que Microsoft Entra ID évalue comme risquée, par exemple depuis une adresse IP anonyme, doit exiger automatiquement l'authentification multifacteur.
    - Un utilisateur dont les informations d'identification ont été divulguées doit être contraint de changer son mot de passe de manière sécurisée à la prochaine connexion.
    - Les coûts de licence doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "Keep the P1 licenses, and enable security defaults."
        fr: "Conserver les licences P1 et activer les paramètres de sécurité par défaut."
    - id: b
      text:
        en: "Upgrade to Microsoft Entra ID P2, and create risk-based Conditional Access policies."
        fr: "Passer à Microsoft Entra ID P2 et créer des stratégies d'accès conditionnel basées sur les risques."
    - id: c
      text:
        en: "Keep the P1 licenses, and create a Conditional Access policy based on named locations."
        fr: "Conserver les licences P1 et créer une stratégie d'accès conditionnel basée sur des emplacements nommés."
    - id: d
      text:
        en: "Keep the P1 licenses, and create a Conditional Access policy that requires an authentication strength."
        fr: "Conserver les licences P1 et créer une stratégie d'accès conditionnel qui exige une force d'authentification."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Sign-in risk and user risk are calculated by Microsoft Entra ID Protection, and using them as conditions in Conditional Access requires Microsoft Entra ID P2. A sign-in risk policy requires multifactor authentication for risky sign-ins, and a user risk policy forces a secure password change for accounts considered compromised, for example after leaked credentials. P2 is the least expensive edition that provides both.
    fr: |
      Le risque de connexion et le risque utilisateur sont calculés par Microsoft Entra ID Protection, et leur utilisation comme conditions dans l'accès conditionnel exige Microsoft Entra ID P2. Une stratégie de risque de connexion exige l'authentification multifacteur pour les connexions risquées, et une stratégie de risque utilisateur impose un changement de mot de passe sécurisé pour les comptes considérés comme compromis, par exemple après une divulgation d'informations d'identification. P2 est l'édition la moins chère qui fournit les deux.
  options:
    a:
      en: "Security defaults prompt for multifactor authentication when Microsoft judges it necessary, but they offer no policy on leaked credentials and no forced password change."
      fr: "Les paramètres de sécurité par défaut demandent l'authentification multifacteur quand Microsoft le juge nécessaire, mais n'offrent ni stratégie sur les informations d'identification divulguées ni changement de mot de passe forcé."
    c:
      en: "A location condition relies on IP ranges that the company defines; it doesn't evaluate risk and knows nothing of leaked credentials."
      fr: "Une condition d'emplacement repose sur des plages d'adresses IP définies par l'entreprise ; elle n'évalue pas le risque et ignore les informations d'identification divulguées."
    d:
      en: "An authentication strength chooses which methods are accepted; it doesn't react to the risk of a sign-in or of a user."
      fr: "Une force d'authentification choisit les méthodes acceptées ; elle ne réagit pas au risque d'une connexion ou d'un utilisateur."
references:
  - title: Risk-based access policies
    url: https://learn.microsoft.com/en-us/entra/id-protection/concept-identity-protection-policies
  - title: What is Conditional Access?
    url: https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview
