id: az305-1a-mon-multi-resource-metric
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure subscription that contains 300 virtual machines. All the virtual machines are in the West Europe region, and no monitoring agent is installed on them.

    You need to recommend an alerting solution that meets the following requirements:

    - The operations team must be notified within a few minutes when the Percentage CPU metric of any virtual machine stays above 90 percent for five minutes.
    - Virtual machines that are created later in the subscription must be covered automatically.
    - The number of alert rules must be minimized.

    What should you recommend?
  fr: |
    Contoso dispose d'un abonnement Azure qui contient 300 machines virtuelles. Toutes les machines virtuelles se trouvent dans la région Europe Ouest, et aucun agent de monitoring n'y est installé.

    Vous devez recommander une solution d'alerte qui répond aux exigences suivantes :

    - L'équipe d'exploitation doit être notifiée en quelques minutes quand la métrique Percentage CPU d'une machine virtuelle reste au-dessus de 90 % pendant cinq minutes.
    - Les machines virtuelles créées ultérieurement dans l'abonnement doivent être couvertes automatiquement.
    - Le nombre de règles d'alerte doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "One log search alert rule scoped to a Log Analytics workspace"
        fr: "Une règle d'alerte de recherche dans les journaux dont l'étendue est un espace de travail Log Analytics"
    - id: b
      text:
        en: "One metric alert rule scoped to all the virtual machines of the region in the subscription"
        fr: "Une règle d'alerte de métrique dont l'étendue est l'ensemble des machines virtuelles de la région dans l'abonnement"
    - id: c
      text:
        en: "One metric alert rule for each virtual machine, deployed by Azure Policy"
        fr: "Une règle d'alerte de métrique pour chaque machine virtuelle, déployée par Azure Policy"
    - id: d
      text:
        en: "One activity log alert rule scoped to the subscription"
        fr: "Une règle d'alerte de journal d'activité dont l'étendue est l'abonnement"
answer: { optionId: b }
explanation:
  correct:
    en: |
      Percentage CPU is a platform metric, collected without any agent, and metric alerts are the right type when the data already exists as a metric. A single metric alert rule can monitor all the resources of the same type in the same region of a subscription, including those created later, and it sends an individual notification for each virtual machine.
    fr: |
      Percentage CPU est une métrique de plateforme, collectée sans aucun agent, et les alertes de métrique sont le bon type quand la donnée existe déjà sous forme de métrique. Une seule règle d'alerte de métrique peut surveiller toutes les ressources du même type dans la même région d'un abonnement, y compris celles créées ultérieurement, et elle envoie une notification distincte pour chaque machine virtuelle.
  options:
    a:
      en: "No agent sends data to a workspace, and a log search alert adds latency and a cost per evaluation for data that already exists as a metric."
      fr: "Aucun agent n'envoie de données vers un espace de travail, et une alerte de recherche dans les journaux ajoute de la latence et un coût par évaluation pour une donnée qui existe déjà sous forme de métrique."
    c:
      en: "It works, but it creates 300 alert rules where one is enough."
      fr: "Cette option fonctionne, mais crée 300 règles d'alerte là où une seule suffit."
    d:
      en: "An activity log alert fires on control plane events such as a restart or a deletion, not on metric values."
      fr: "Une alerte de journal d'activité se déclenche sur des événements du plan de contrôle, comme un redémarrage ou une suppression, pas sur des valeurs de métrique."
references:
  - title: Choose the right type of alert rule
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
