stem:
  en: |
    You recommend eligible memberships of Group1 in Privileged Identity Management.
  fr: |
    Vous recommandez des appartenances éligibles à Group1 dans Privileged Identity Management.
body:
  solution:
    en: |
      You recommend that an administrator invites the consultants as guest users and manages Group1, which gives access to Site1 and App1, with **Privileged Identity Management (PIM) for Groups**. Each consultant becomes an **eligible** member of Group1 for 90 days, and the activation of the membership requires the approval of the manager of Project1.
    fr: |
      Vous recommandez qu'un administrateur invite les consultants en tant qu'utilisateurs invités et gère Group1, qui donne accès à Site1 et à App1, avec **Privileged Identity Management (PIM) pour les groupes**. Chaque consultant devient membre **éligible** de Group1 pendant 90 jours, et l'activation de l'appartenance exige l'approbation du responsable de Project1.
answer: { value: false }
explanation:
  correct:
    en: |
      PIM for Groups gives just-in-time membership to users who already have an eligible assignment: an administrator must first invite each consultant and create that assignment, so a consultant without an account can't submit a request. The eligibility ends after 90 days, but PIM doesn't remove the guest account, which stays in the Proseware tenant. The first and third requirements aren't met.
    fr: |
      PIM pour les groupes donne une appartenance juste-à-temps à des utilisateurs qui ont déjà une attribution éligible : un administrateur doit d'abord inviter chaque consultant et créer cette attribution, de sorte qu'un consultant sans compte ne peut pas soumettre de demande. L'éligibilité prend fin après 90 jours, mais PIM ne supprime pas le compte invité, qui reste dans le locataire de Proseware. Les première et troisième exigences ne sont pas satisfaites.
references:
  - title: "Privileged Identity Management (PIM) for Groups"
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/concept-pim-for-groups
