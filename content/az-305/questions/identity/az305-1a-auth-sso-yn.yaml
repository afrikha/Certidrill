id: az305-1a-auth-sso-yn
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys synchronizes its on-premises Active Directory Domain Services (AD DS) users to Microsoft Entra ID. You are evaluating Microsoft Entra seamless single sign-on (Seamless SSO) for the users who work on the corporate network.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys synchronise ses utilisateurs Active Directory Domain Services (AD DS) locaux vers Microsoft Entra ID. Vous évaluez l'authentification unique transparente Microsoft Entra (Seamless SSO) pour les utilisateurs qui travaillent sur le réseau de l'entreprise.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Seamless SSO can be used when password hash synchronization is the sign-in method."
        fr: "Seamless SSO peut être utilisée quand la synchronisation de hachage du mot de passe est la méthode de connexion."
    - id: s2
      text:
        en: "Seamless SSO requires additional servers to be deployed on-premises."
        fr: "Seamless SSO exige le déploiement de serveurs supplémentaires en local."
    - id: s3
      text:
        en: "On Microsoft Entra hybrid joined devices that run Windows 11, single sign-on relies on the primary refresh token instead of Seamless SSO."
        fr: "Sur les appareils à jonction hybride Microsoft Entra qui exécutent Windows 11, l'authentification unique repose sur le jeton d'actualisation principal et non sur Seamless SSO."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Seamless SSO works with password hash synchronization and with pass-through authentication, but not with AD FS. It needs no additional component on-premises and is a free feature. On Microsoft Entra joined, hybrid joined and registered devices that run Windows 10 or later, single sign-on is provided by the primary refresh token; Seamless SSO serves domain-joined devices that aren't in that case.
    fr: |
      Seamless SSO fonctionne avec la synchronisation de hachage du mot de passe et avec l'authentification directe, mais pas avec AD FS. Elle ne demande aucun composant supplémentaire en local et c'est une fonctionnalité gratuite. Sur les appareils joints, à jonction hybride ou inscrits à Microsoft Entra qui exécutent Windows 10 ou une version ultérieure, l'authentification unique est assurée par le jeton d'actualisation principal ; Seamless SSO sert les appareils joints au domaine qui ne sont pas dans ce cas.
references:
  - title: Microsoft Entra seamless single sign-on
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/how-to-connect-sso
