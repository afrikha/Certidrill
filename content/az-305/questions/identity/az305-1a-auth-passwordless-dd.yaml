id: az305-1a-auth-passwordless-dd
objective: "1.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is planning a passwordless deployment in Microsoft Entra ID.

    You need to recommend an authentication method for each of the following needs.

    Which method should you recommend for each need? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank planifie un déploiement sans mot de passe dans Microsoft Entra ID.

    Vous devez recommander une méthode d'authentification pour chacun des besoins suivants.

    Quelle méthode devez-vous recommander pour chaque besoin ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Office employees sign in to their dedicated company laptop that runs Windows 11 with a fingerprint or a PIN: [[office]]

      Privileged administrators in a regulated environment use a device-bound credential on a portable hardware device, on any workstation: [[admin]]

      New employees register their first passwordless method without ever receiving a password: [[newhire]]
    fr: |
      Les employés de bureau se connectent à leur ordinateur portable d'entreprise dédié, sous Windows 11, avec une empreinte digitale ou un code PIN : [[office]]

      Les administrateurs à privilèges d'un environnement réglementé utilisent une information d'identification liée à un appareil, sur un dispositif matériel portable, depuis n'importe quel poste de travail : [[admin]]

      Les nouveaux employés inscrivent leur première méthode sans mot de passe sans jamais recevoir de mot de passe : [[newhire]]
  slots:
    - id: office
      options:
        - { id: whfb, text: { en: "Windows Hello for Business", fr: "Windows Hello Entreprise" } }
        - { id: fido, text: { en: "FIDO2 security key", fr: "Clé de sécurité FIDO2" } }
        - { id: tap, text: { en: "Temporary Access Pass", fr: "Passe d'accès temporaire" } }
        - { id: synced, text: { en: "Synced passkey", fr: "Clé d'accès synchronisée" } }
    - id: admin
      options:
        - { id: whfb, text: { en: "Windows Hello for Business", fr: "Windows Hello Entreprise" } }
        - { id: fido, text: { en: "FIDO2 security key", fr: "Clé de sécurité FIDO2" } }
        - { id: tap, text: { en: "Temporary Access Pass", fr: "Passe d'accès temporaire" } }
        - { id: synced, text: { en: "Synced passkey", fr: "Clé d'accès synchronisée" } }
    - id: newhire
      options:
        - { id: whfb, text: { en: "Windows Hello for Business", fr: "Windows Hello Entreprise" } }
        - { id: fido, text: { en: "FIDO2 security key", fr: "Clé de sécurité FIDO2" } }
        - { id: tap, text: { en: "Temporary Access Pass", fr: "Passe d'accès temporaire" } }
        - { id: synced, text: { en: "Synced passkey", fr: "Clé d'accès synchronisée" } }
answer:
  values: { office: whfb, admin: fido, newhire: tap }
explanation:
  correct:
    en: |
      Windows Hello for Business is the credential of a user's own Windows device, unlocked by a biometric gesture or a PIN. FIDO2 security keys hold a device-bound passkey on portable hardware and are recommended for highly regulated industries and for users with elevated privileges. A Temporary Access Pass is a time-limited passcode that lets a user sign in to register passwordless methods such as passkeys or Windows Hello for Business, without a password.
    fr: |
      Windows Hello Entreprise est l'information d'identification de l'appareil Windows personnel d'un utilisateur, déverrouillée par un geste biométrique ou un code PIN. Les clés de sécurité FIDO2 contiennent une clé d'accès liée à l'appareil sur un matériel portable et sont recommandées pour les secteurs fortement réglementés et pour les utilisateurs à privilèges élevés. Un passe d'accès temporaire est un code secret à durée limitée qui permet à un utilisateur de se connecter pour inscrire des méthodes sans mot de passe, comme les clés d'accès ou Windows Hello Entreprise, sans mot de passe.
  options:
    synced:
      en: "A synced passkey is stored by a cloud passkey provider and copied to the user's devices, so it isn't device-bound; it is the convenient option for users outside regulated or privileged roles."
      fr: "Une clé d'accès synchronisée est stockée par un fournisseur de clés d'accès cloud et copiée sur les appareils de l'utilisateur : elle n'est donc pas liée à un appareil ; c'est l'option pratique pour les utilisateurs sans rôle réglementé ni privilégié."
references:
  - title: Authentication methods in Microsoft Entra ID - passkeys (FIDO2)
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-passwordless
  - title: Configure Temporary Access Pass to register passwordless authentication methods
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-authentication-temporary-access-pass
