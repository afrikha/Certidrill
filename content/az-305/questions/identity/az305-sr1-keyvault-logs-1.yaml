id: az305-sr1-keyvault-logs-1
objective: "1.3.2"
type: series_yesno
series: az305-sr1-keyvault-logs
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You recommend a policy assignment at MG-Prod with the AuditIfNotExists effect.
  fr: Vous recommandez une attribution de stratégie sur MG-Prod avec l'effet AuditIfNotExists.
body:
  solution:
    en: |
      You recommend assigning to **MG-Prod** the built-in Azure Policy definition that enables audit logging of key vaults to a Log Analytics workspace. The assignment targets LAW1 and its effect parameter is set to **AuditIfNotExists**.
    fr: |
      Vous recommandez d'attribuer à **MG-Prod** la définition Azure Policy intégrée qui active la journalisation d'audit des coffres de clés vers un espace de travail Log Analytics. L'attribution cible LAW1 et son paramètre d'effet est défini sur **AuditIfNotExists**.
answer: { value: false }
explanation:
  correct:
    en: |
      The scope is right: an assignment at MG-Prod is inherited by all its subscriptions, including those added later. But AuditIfNotExists only marks as non-compliant the key vaults that have no matching diagnostic setting; it deploys nothing. The project teams would still have to create every diagnostic setting, which breaks the second requirement.
    fr: |
      L'étendue est la bonne : une attribution sur MG-Prod est héritée par tous ses abonnements, y compris ceux ajoutés plus tard. Mais AuditIfNotExists se contente de marquer comme non conformes les coffres de clés qui n'ont pas le paramètre de diagnostic attendu ; il ne déploie rien. Les équipes projet devraient encore créer chaque paramètre de diagnostic, ce qui ne respecte pas la seconde exigence.
references:
  - title: Azure Policy definitions auditIfNotExists effect
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-audit-if-not-exists
  - title: Create diagnostic settings at scale by using built-in Azure policies
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings-policy-built-in
