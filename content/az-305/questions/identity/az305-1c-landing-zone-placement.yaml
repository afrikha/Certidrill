id: az305-1c-landing-zone-placement
objective: "1.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso adopts the Azure landing zone architecture. The management group hierarchy is the following:

    - Tenant Root Group
      - **Contoso**
        - **Platform**, with the child management groups **Management**, **Connectivity**, **Identity** and **Security**
        - **Landing zones**, with the child management groups **Corp** and **Online**
        - **Sandbox**
        - **Decommissioned**
      - **Contoso-Canary**, a copy of the hierarchy that the platform team uses to test changes. It must not receive the assignments of the production hierarchy.

    You need to recommend where to place two new subscriptions and where to assign a policy.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso adopte l'architecture des zones d'atterrissage Azure. La hiérarchie des groupes d'administration est la suivante :

    - Groupe racine du locataire (Tenant Root Group)
      - **Contoso**
        - **Platform**, avec les groupes d'administration enfants **Management**, **Connectivity**, **Identity** et **Security**
        - **Landing zones**, avec les groupes d'administration enfants **Corp** et **Online**
        - **Sandbox**
        - **Decommissioned**
      - **Contoso-Canary**, une copie de la hiérarchie que l'équipe de plateforme utilise pour tester les modifications. Elle ne doit pas recevoir les attributions de la hiérarchie de production.

    Vous devez recommander l'emplacement de deux nouveaux abonnements et l'étendue d'attribution d'une stratégie.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Subscription that hosts the hub virtual network, Azure Firewall and the private DNS zones: [[hub]]

      Subscription of a public e-commerce website that has no connection to the corporate network: [[web]]

      Policy that must apply to every subscription of the production hierarchy: [[org]]
    fr: |
      Abonnement qui héberge le réseau virtuel hub, le Pare-feu Azure et les zones DNS privées : [[hub]]

      Abonnement d'un site web public de commerce électronique sans connexion au réseau de l'entreprise : [[web]]

      Stratégie qui doit s'appliquer à tous les abonnements de la hiérarchie de production : [[org]]
  slots:
    - id: hub
      options:
        - { id: connectivity, text: Connectivity }
        - { id: corp, text: Corp }
        - { id: identity, text: Identity }
        - { id: management, text: Management }
    - id: web
      options:
        - { id: connectivity, text: Connectivity }
        - { id: corp, text: Corp }
        - { id: online, text: Online }
        - { id: sandbox, text: Sandbox }
    - id: org
      options:
        - { id: contoso, text: Contoso }
        - { id: lz, text: Landing zones }
        - { id: platform, text: Platform }
        - { id: root, text: Tenant Root Group }
answer:
  values: { hub: connectivity, web: online, org: contoso }
explanation:
  correct:
    en: "In the landing zone architecture, the Connectivity management group holds the subscription of shared network resources such as the hub, the firewall and private DNS zones. Online is meant for workloads that need direct internet connectivity, whereas Corp is for workloads connected to the corporate network through the hub. Organization-wide policies are assigned at the intermediate root, here Contoso, so that the Tenant Root Group stays free of assignments and the canary hierarchy isn't affected."
    fr: "Dans l'architecture des zones d'atterrissage, le groupe d'administration Connectivity contient l'abonnement des ressources réseau partagées comme le hub, le pare-feu et les zones DNS privées. Online est prévu pour les charges de travail qui ont besoin d'une connectivité Internet directe, alors que Corp sert aux charges de travail connectées au réseau de l'entreprise par le hub. Les stratégies de toute l'organisation s'attribuent sur la racine intermédiaire, ici Contoso, afin que le groupe racine du locataire reste sans attribution et que la hiérarchie canary ne soit pas touchée."
  options:
    management:
      en: "Management holds the subscription of the central Log Analytics workspace and of the management tools, not the network hub."
      fr: "Management contient l'abonnement de l'espace de travail Log Analytics central et des outils de gestion, pas le hub réseau."
    sandbox:
      en: "Sandbox is for experiments with relaxed policies, isolated from the landing zones. A production website doesn't belong there."
      fr: "Sandbox sert aux expérimentations avec des stratégies assouplies, isolées des zones d'atterrissage. Un site web de production n'y a pas sa place."
    root:
      en: "An assignment at the Tenant Root Group would also be inherited by Contoso-Canary."
      fr: "Une attribution sur le groupe racine du locataire serait aussi héritée par Contoso-Canary."
    lz:
      en: "Landing zones doesn't cover the subscriptions under Platform, Sandbox and Decommissioned."
      fr: "Landing zones ne couvre pas les abonnements situés sous Platform, Sandbox et Decommissioned."
references:
  - title: Management groups
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups
