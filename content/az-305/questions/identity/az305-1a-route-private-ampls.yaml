id: az305-1a-route-private-ampls
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has virtual machines in a virtual network named **VNet1**. The Azure Monitor Agent on the virtual machines must send logs to a Log Analytics workspace named **WS1**.

    You need to recommend a network design for the log traffic that meets the following requirements:

    - The traffic between the virtual machines and Azure Monitor must not use public endpoints.
    - The virtual machines of VNet1 must be unable to send logs to a Log Analytics workspace that doesn't belong to Woodgrove Bank.

    What should you recommend?
  fr: |
    Woodgrove Bank dispose de machines virtuelles dans un réseau virtuel nommé **VNet1**. L'agent Azure Monitor des machines virtuelles doit envoyer des journaux vers un espace de travail Log Analytics nommé **WS1**.

    Vous devez recommander une conception réseau pour le trafic des journaux qui répond aux exigences suivantes :

    - Le trafic entre les machines virtuelles et Azure Monitor ne doit pas utiliser de points de terminaison publics.
    - Les machines virtuelles de VNet1 ne doivent pas pouvoir envoyer de journaux vers un espace de travail Log Analytics qui n'appartient pas à Woodgrove Bank.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "An outbound network security group rule that allows the AzureMonitor service tag"
        fr: "Une règle de groupe de sécurité réseau sortante qui autorise l'étiquette de service AzureMonitor"
    - id: b
      text:
        en: "An Azure Monitor Private Link Scope connected to VNet1 through a private endpoint, in the Private Only access mode, and no other network control"
        fr: "Une étendue de liaison privée Azure Monitor connectée à VNet1 par un point de terminaison privé, en mode d'accès Privé uniquement, sans autre contrôle réseau"
    - id: c
      text:
        en: "An Azure Monitor Private Link Scope connected to VNet1 through a private endpoint, and a network firewall that blocks the traffic of VNet1 to the public endpoints of Azure Monitor"
        fr: "Une étendue de liaison privée Azure Monitor connectée à VNet1 par un point de terminaison privé, et un pare-feu réseau qui bloque le trafic de VNet1 vers les points de terminaison publics d'Azure Monitor"
    - id: d
      text:
        en: "An Azure Firewall application rule that allows the fully qualified domain names of Azure Monitor"
        fr: "Une règle d'application du Pare-feu Azure qui autorise les noms de domaine complets d'Azure Monitor"
answer: { optionId: c }
explanation:
  correct:
    en: |
      An Azure Monitor Private Link Scope (AMPLS) groups Azure Monitor resources such as WS1 and its data collection endpoints, and the virtual network reaches them through one private endpoint over the Microsoft backbone. Log Analytics ingestion uses resource-specific endpoints and doesn't follow the AMPLS access modes, so Microsoft Learn says to block traffic to the public endpoints at the network firewall: the agents can then reach only the workspaces of the scope, whatever the access mode.
    fr: |
      Une étendue de liaison privée Azure Monitor (AMPLS) regroupe des ressources Azure Monitor comme WS1 et ses points de terminaison de collecte de données, et le réseau virtuel les atteint par un seul point de terminaison privé, sur le réseau principal de Microsoft. L'ingestion Log Analytics utilise des points de terminaison propres à chaque ressource et ne suit pas les modes d'accès de l'AMPLS : Microsoft Learn indique donc de bloquer le trafic vers les points de terminaison publics au niveau du pare-feu réseau. Les agents ne peuvent alors atteindre que les espaces de travail de l'étendue, quel que soit le mode d'accès.
  options:
    a:
      en: "The service tag allows traffic to the public endpoints of Azure Monitor, for any workspace of any customer."
      fr: "L'étiquette de service autorise le trafic vers les points de terminaison publics d'Azure Monitor, pour n'importe quel espace de travail de n'importe quel client."
    b:
      en: "The Private Only mode makes the traffic to WS1 private, but Log Analytics ingestion doesn't follow the access modes: without a firewall that blocks the public endpoints, the agents could still send logs to another workspace."
      fr: "Le mode Privé uniquement rend privé le trafic vers WS1, mais l'ingestion Log Analytics ne suit pas les modes d'accès : sans pare-feu qui bloque les points de terminaison publics, les agents pourraient encore envoyer des journaux vers un autre espace de travail."
    d:
      en: "The traffic would still go to public endpoints, and the allowed domain names serve the workspaces of every customer."
      fr: "Le trafic irait toujours vers des points de terminaison publics, et les noms de domaine autorisés desservent les espaces de travail de tous les clients."
references:
  - title: Use Azure Private Link to connect networks to Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/private-link-security
  - title: Design Azure Monitor Private Link configuration
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/private-link-design
