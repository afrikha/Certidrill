id: az305-1b-idm-administrative-units
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a single Microsoft Entra tenant that contains 30,000 users in 12 countries. Each country has its own help desk team.

    You need to recommend a delegation model that meets the following requirements:

    - A help desk team can reset passwords only for the users of its country.
    - Northwind keeps a single tenant.
    - The principle of least privilege is applied.

    What should you recommend?
  fr: |
    Northwind Traders dispose d'un seul locataire Microsoft Entra qui contient 30 000 utilisateurs répartis dans 12 pays. Chaque pays a sa propre équipe de support technique.

    Vous devez recommander un modèle de délégation qui répond aux exigences suivantes :

    - Une équipe de support technique ne peut réinitialiser les mots de passe que des utilisateurs de son pays.
    - Northwind conserve un seul locataire.
    - Le principe du moindre privilège est appliqué.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "One administrative unit per country, with the Helpdesk Administrator role scoped to the unit", fr: "Une unité administrative par pays, avec le rôle Helpdesk Administrator limité à l'étendue de l'unité" }
    - id: b
      text: { en: "One dynamic security group per country, with the Helpdesk Administrator role assigned for the tenant", fr: "Un groupe de sécurité dynamique par pays, avec le rôle Helpdesk Administrator attribué pour le locataire" }
    - id: c
      text: { en: "One management group per country, with the User Access Administrator role assigned at the group", fr: "Un groupe d'administration par pays, avec le rôle User Access Administrator attribué au niveau du groupe" }
    - id: d
      text: { en: "One resource group per country, with the Contributor role assigned at the resource group", fr: "Un groupe de ressources par pays, avec le rôle Contributor attribué au niveau du groupe de ressources" }
answer: { optionId: a }
explanation:
  correct:
    en: "An administrative unit is a container of users, groups or devices that restricts a Microsoft Entra role to a part of the organization. A help desk team that holds Helpdesk Administrator scoped to the unit of its country can reset passwords for those users only, inside the same tenant."
    fr: "Une unité administrative est un conteneur d'utilisateurs, de groupes ou d'appareils qui restreint un rôle Microsoft Entra à une partie de l'organisation. Une équipe de support qui détient Helpdesk Administrator avec l'étendue de l'unité de son pays ne peut réinitialiser les mots de passe que de ces utilisateurs, dans le même locataire."
  options:
    b:
      en: "A role assigned for the tenant applies to all the users, whatever the groups they belong to: every team could reset the passwords of every country."
      fr: "Un rôle attribué pour le locataire s'applique à tous les utilisateurs, quels que soient leurs groupes : chaque équipe pourrait réinitialiser les mots de passe de tous les pays."
    c:
      en: "Management groups organize Azure subscriptions, and User Access Administrator is an Azure role for access to Azure resources. Neither controls password resets in the directory."
      fr: "Les groupes d'administration organisent des abonnements Azure, et User Access Administrator est un rôle Azure qui porte sur l'accès aux ressources Azure. Aucun des deux ne contrôle la réinitialisation des mots de passe dans l'annuaire."
    d:
      en: "Resource groups and the Contributor role control Azure resources. They give no permission on the users of the directory."
      fr: "Les groupes de ressources et le rôle Contributor contrôlent des ressources Azure. Ils ne donnent aucune autorisation sur les utilisateurs de l'annuaire."
references:
  - title: Administrative units in Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/administrative-units
