id: az305-1b-idm-domain-services-legacy
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. plans to move a legacy line-of-business application from its datacenter to Azure virtual machines. The application authenticates users with Kerberos and reads the directory by using LDAP. Its servers must be joined to a domain and receive Group Policy settings. The Fabrikam users are already synchronized to a Microsoft Entra tenant with password hash synchronization.

    You need to recommend a directory service for the application. The solution must meet the following requirements:

    - The application runs without code changes.
    - Authentication doesn't depend on a connection to the datacenter.
    - Fabrikam has no domain controller to deploy, patch or back up.

    What should you recommend?
  fr: |
    Fabrikam, Inc. prévoit de déplacer une application métier ancienne de son centre de données vers des machines virtuelles Azure. L'application authentifie les utilisateurs avec Kerberos et lit l'annuaire avec LDAP. Ses serveurs doivent être joints à un domaine et recevoir des paramètres de stratégie de groupe. Les utilisateurs de Fabrikam sont déjà synchronisés vers un locataire Microsoft Entra avec la synchronisation de hachage du mot de passe.

    Vous devez recommander un service d'annuaire pour l'application. La solution doit répondre aux exigences suivantes :

    - L'application s'exécute sans modification du code.
    - L'authentification ne dépend pas d'une connexion au centre de données.
    - Fabrikam n'a aucun contrôleur de domaine à déployer, à corriger ou à sauvegarder.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Microsoft Entra join for the virtual machines", fr: "La jonction des machines virtuelles à Microsoft Entra" }
    - id: b
      text: { en: "AD DS domain controllers on Azure virtual machines", fr: "Des contrôleurs de domaine AD DS sur des machines virtuelles Azure" }
    - id: c
      text: { en: "Microsoft Entra application proxy for the application", fr: "Le proxy d'application Microsoft Entra pour l'application" }
    - id: d
      text: { en: "A Microsoft Entra Domain Services managed domain", fr: "Un domaine managé Microsoft Entra Domain Services" }
answer: { optionId: d }
explanation:
  correct:
    en: "Microsoft Entra Domain Services provides domain join, Group Policy, LDAP, and Kerberos and NTLM authentication in Azure, from the identities of the tenant. Microsoft deploys, patches and backs up the domain controllers, so a legacy application can be moved as is without a link to the datacenter."
    fr: "Microsoft Entra Domain Services fournit dans Azure la jonction de domaine, les stratégies de groupe, LDAP et l'authentification Kerberos et NTLM, à partir des identités du locataire. Microsoft déploie, corrige et sauvegarde les contrôleurs de domaine : une application ancienne peut donc être déplacée telle quelle, sans liaison avec le centre de données."
  options:
    a:
      en: "A machine joined to Microsoft Entra ID has no LDAP directory, no Kerberos domain and no Group Policy for the application to use."
      fr: "Une machine jointe à Microsoft Entra ID ne dispose ni d'un annuaire LDAP, ni d'un domaine Kerberos, ni de stratégies de groupe utilisables par l'application."
    b:
      en: "Self-managed domain controllers meet the protocol requirements, but Fabrikam would have to deploy, patch and back them up."
      fr: "Des contrôleurs de domaine autogérés répondent aux exigences de protocole, mais Fabrikam devrait les déployer, les corriger et les sauvegarder."
    c:
      en: "Application proxy publishes on-premises web applications to remote users. It isn't a directory service that servers can join."
      fr: "Le proxy d'application publie des applications web locales pour des utilisateurs distants. Ce n'est pas un service d'annuaire auquel des serveurs peuvent être joints."
references:
  - title: What is Microsoft Entra Domain Services?
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/overview
  - title: Compare self-managed Active Directory Domain Services, Microsoft Entra ID, and managed Microsoft Entra Domain Services
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/compare-identity-solutions
