id: az305-1b-kv-backup-restore-scope
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has two subscriptions named **Sub1** and **Sub2**. A key vault named **kv-prod** is in the West Europe region, in Sub1. For compliance, Proseware keeps an offline backup of each key and each secret of kv-prod. The recovery plan states that, if kv-prod is lost, the backups are restored into another vault.

    You need to recommend a vault that can receive the restored backups.

    Which vault should you recommend?
  fr: |
    Proseware, Inc. dispose de deux abonnements nommés **Sub1** et **Sub2**. Un coffre de clés nommé **kv-prod** se trouve dans la région West Europe, dans Sub1. Pour des raisons de conformité, Proseware conserve une sauvegarde hors connexion de chaque clé et de chaque secret de kv-prod. Le plan de récupération indique que, si kv-prod est perdu, les sauvegardes sont restaurées dans un autre coffre.

    Vous devez recommander un coffre capable de recevoir les sauvegardes restaurées.

    Quel coffre devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A vault in East US, in Sub1", fr: "Un coffre dans East US, dans Sub1" }
    - id: b
      text: { en: "A vault in North Europe, in Sub1", fr: "Un coffre dans North Europe, dans Sub1" }
    - id: c
      text: { en: "A vault in West Europe, in Sub2", fr: "Un coffre dans West Europe, dans Sub2" }
    - id: d
      text: { en: "A vault in East US, in Sub2", fr: "Un coffre dans East US, dans Sub2" }
answer: { optionId: b }
explanation:
  correct:
    en: "A Key Vault backup is an encrypted blob that can be decrypted only inside Azure, and it can be restored only into a vault of the same subscription and of the same Azure geography. North Europe is in the same geography as West Europe (Europe), and the vault is in Sub1."
    fr: "Une sauvegarde Key Vault est un objet blob chiffré qui ne peut être déchiffré qu'à l'intérieur d'Azure, et elle ne peut être restaurée que dans un coffre du même abonnement et de la même zone géographique Azure. North Europe se trouve dans la même zone géographique que West Europe (Europe), et le coffre est dans Sub1."
  options:
    a:
      en: "East US is in another Azure geography, so the restore fails even in the same subscription."
      fr: "East US se trouve dans une autre zone géographique Azure : la restauration échoue, même dans le même abonnement."
    c:
      en: "The region is right, but a backup can't be restored into a vault of another subscription."
      fr: "La région convient, mais une sauvegarde ne peut pas être restaurée dans un coffre d'un autre abonnement."
    d:
      en: "Both the subscription and the geography differ from those of kv-prod."
      fr: "L'abonnement et la zone géographique diffèrent tous deux de ceux de kv-prod."
references:
  - title: Azure Key Vault backup and restore
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/backup
