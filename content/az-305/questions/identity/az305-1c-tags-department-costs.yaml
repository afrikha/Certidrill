id: az305-1c-tags-department-costs
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has one Azure subscription that contains 60 resource groups. Each resource group holds the resources of one application. The applications belong to five departments, and each department owns several applications.

    The finance team asks for a monthly report of the Azure costs of each department. You need to recommend a solution that meets the following requirements:

    - No resource must be moved.
    - Litware must keep receiving a single invoice.
    - Administrative effort must be minimized.

    What should you recommend?
  fr: |
    Litware dispose d'un abonnement Azure qui contient 60 groupes de ressources. Chaque groupe de ressources contient les ressources d'une application. Les applications appartiennent à cinq services de l'entreprise, et chaque service possède plusieurs applications.

    L'équipe financière demande un rapport mensuel des coûts Azure de chaque service. Vous devez recommander une solution qui respecte les exigences suivantes :

    - Aucune ressource ne doit être déplacée.
    - Litware doit continuer à recevoir une seule facture.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Create one subscription for each department.", fr: "Créer un abonnement pour chaque service." }
    - id: b
      text: { en: "Create one management group for each department.", fr: "Créer un groupe d'administration pour chaque service." }
    - id: c
      text: { en: "Merge the resource groups into one resource group for each department.", fr: "Fusionner les groupes de ressources en un groupe de ressources par service." }
    - id: d
      text: { en: "Apply a `department` tag to the resources and group the costs by this tag.", fr: "Appliquer une étiquette `department` aux ressources et regrouper les coûts selon cette étiquette." }
answer: { optionId: d }
explanation:
  correct:
    en: "Tags add a dimension that the hierarchy doesn't have. With a `department` tag on the resources, cost analysis can group or filter the costs of the subscription by department, with no change to the structure and with the same invoice."
    fr: "Les étiquettes ajoutent une dimension que la hiérarchie ne possède pas. Avec une étiquette `department` sur les ressources, l'analyse des coûts peut regrouper ou filtrer les coûts de l'abonnement par service, sans modifier la structure et avec la même facture."
  options:
    a:
      en: "Separate subscriptions would show the costs per department, but every resource would have to be moved to a new subscription, which the requirements forbid."
      fr: "Des abonnements distincts présenteraient les coûts par service, mais il faudrait déplacer chaque ressource vers un nouvel abonnement, ce que les exigences interdisent."
    b:
      en: "A subscription has exactly one parent management group. With a single subscription, management groups can't split the costs between five departments."
      fr: "Un abonnement a exactement un groupe d'administration parent. Avec un seul abonnement, les groupes d'administration ne peuvent pas répartir les coûts entre cinq services."
    c:
      en: "Merging resource groups means moving the resources, and it would mix applications that don't share the same life cycle."
      fr: "Fusionner des groupes de ressources revient à déplacer les ressources, et cela mélangerait des applications qui ne partagent pas le même cycle de vie."
references:
  - title: Use tags to organize your Azure resources and management hierarchy
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources
