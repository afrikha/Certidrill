id: az305-cs1a-node-identity
objective: "1.2.3"
type: single
caseStudy: az305-cs1a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend how the compute nodes that run the alignment jobs are authorized to read the raw sequencing files and to write the analysis reports. The solution must meet the security requirements.

    What should you recommend?
  fr: |
    Vous devez recommander la façon dont les nœuds de calcul qui exécutent les travaux d'alignement sont autorisés à lire les fichiers de séquençage bruts et à écrire les rapports d'analyse. La solution doit répondre aux exigences de sécurité.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A service principal whose client secret is stored in Azure Key Vault", fr: "Un principal de service dont le secret client est stocké dans Azure Key Vault" } }
    - { id: b, text: { en: "A system-assigned managed identity that is enabled on each pool", fr: "Une identité managée affectée par le système, activée sur chaque pool" } }
    - { id: c, text: { en: "A SAS token for each container that is passed to the jobs as a parameter", fr: "Un jeton SAS pour chaque conteneur, transmis aux travaux sous forme de paramètre" } }
    - { id: d, text: { en: "A user-assigned managed identity that is assigned to each pool", fr: "Une identité managée affectée par l'utilisateur, attribuée à chaque pool" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A user-assigned managed identity is a separate Azure resource whose life cycle doesn't depend on the pools: its role assignments on the storage accounts are created once, and each new pool only references the identity. The nodes obtain tokens from Microsoft Entra ID for this identity, so no secret, key or SAS token appears in the scripts. User-assigned identities are also the type of managed identity that Azure Batch pools use.
    fr: |
      Une identité managée affectée par l'utilisateur est une ressource Azure à part, dont le cycle de vie ne dépend pas des pools : ses attributions de rôles sur les comptes de stockage sont créées une seule fois, et chaque nouveau pool se contente de référencer l'identité. Les nœuds obtiennent des jetons de Microsoft Entra ID pour cette identité ; aucun secret, aucune clé et aucun jeton SAS n'apparaît donc dans les scripts. Les identités affectées par l'utilisateur sont aussi le type d'identité managée qu'utilisent les pools Azure Batch.
  options:
    a:
      en: The client secret is still a secret that the nodes must obtain and present, and reading it from the vault requires another credential.
      fr: Le secret client reste un secret que les nœuds doivent obtenir et présenter, et le lire dans le coffre exige une autre information d'identification.
    b:
      en: A system-assigned identity is created and deleted with its resource, so every run would need new role assignments on the storage accounts.
      fr: Une identité affectée par le système est créée et supprimée avec sa ressource ; chaque campagne exigerait donc de nouvelles attributions de rôles sur les comptes de stockage.
    c:
      en: A SAS token passed as a job parameter is a credential stored in the job configuration, which the security requirements forbid.
      fr: Un jeton SAS transmis comme paramètre d'un travail est une information d'identification stockée dans la configuration du travail, ce que les exigences de sécurité interdisent.
references:
  - title: Configure managed identities in Batch pools
    url: https://learn.microsoft.com/en-us/azure/batch/managed-identity-pools
