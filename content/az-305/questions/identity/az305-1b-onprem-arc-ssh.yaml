id: az305-1b-onprem-arc-ssh
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation runs 180 Linux servers in a datacenter. The servers have outbound internet access, but the datacenter has no VPN and no ExpressRoute connection to Azure.

    You need to recommend how the administrators open SSH sessions on the servers. The solution must meet the following requirements:

    - Administrators sign in with their Microsoft Entra accounts instead of local accounts or SSH keys.
    - The right to sign in is granted by Azure role assignments, which are activated just in time in Privileged Identity Management.
    - The servers have no public IP address and no inbound port opened from the internet.

    What should you recommend?
  fr: |
    Adatum Corporation exploite 180 serveurs Linux dans un centre de données. Les serveurs disposent d'un accès sortant à Internet, mais le centre de données n'a ni VPN ni connexion ExpressRoute vers Azure.

    Vous devez recommander la manière dont les administrateurs ouvrent des sessions SSH sur les serveurs. La solution doit répondre aux exigences suivantes :

    - Les administrateurs se connectent avec leurs comptes Microsoft Entra au lieu de comptes locaux ou de clés SSH.
    - Le droit de se connecter est accordé par des attributions de rôles Azure, activées juste-à-temps dans Privileged Identity Management.
    - Les serveurs n'ont aucune adresse IP publique ni aucun port entrant ouvert depuis Internet.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Azure Bastion with IP-based connections", fr: "Azure Bastion avec des connexions basées sur l'adresse IP" }
    - id: b
      text: { en: "Azure Arc-enabled servers with Microsoft Entra login for SSH", fr: "Des serveurs avec Azure Arc et la connexion Microsoft Entra pour SSH" }
    - id: c
      text: { en: "Microsoft Entra Private Access with a per-app access application", fr: "Microsoft Entra Private Access avec une application d'accès par application" }
    - id: d
      text: { en: "Microsoft Entra application proxy with pre-authentication", fr: "Le proxy d'application Microsoft Entra avec la préauthentification" }
answer: { optionId: b }
explanation:
  correct:
    en: "A server onboarded to Azure Arc becomes an Azure resource. SSH access to Arc-enabled servers needs no public IP address and no additional open port, and on Linux the Microsoft Entra login extension lets users sign in with their Microsoft Entra accounts. The right to sign in comes from the Virtual Machine Administrator Login or Virtual Machine User Login role, which can be made eligible in Privileged Identity Management."
    fr: "Un serveur intégré à Azure Arc devient une ressource Azure. L'accès SSH aux serveurs avec Azure Arc ne demande ni adresse IP publique ni port ouvert supplémentaire, et sous Linux l'extension de connexion Microsoft Entra permet aux utilisateurs de se connecter avec leurs comptes Microsoft Entra. Le droit de se connecter provient du rôle Virtual Machine Administrator Login ou Virtual Machine User Login, qui peut être rendu éligible dans Privileged Identity Management."
  options:
    a:
      en: "Azure Bastion connects from a virtual network, so the servers would need private connectivity to Azure, which the datacenter doesn't have."
      fr: "Azure Bastion se connecte depuis un réseau virtuel : les serveurs auraient donc besoin d'une connectivité privée vers Azure, dont le centre de données ne dispose pas."
    c:
      en: "Private Access gives a network path to the SSH port, but the sign-in on the server would still use local accounts or keys, and no Azure role would authorize it."
      fr: "Private Access fournit un chemin réseau vers le port SSH, mais la connexion au serveur utiliserait encore des comptes locaux ou des clés, et aucun rôle Azure ne l'autoriserait."
    d:
      en: "Application proxy publishes on-premises web applications, not SSH sessions."
      fr: "Le proxy d'application publie des applications web locales, pas des sessions SSH."
references:
  - title: SSH access to Azure Arc-enabled servers
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/ssh-arc-overview
  - title: What is Azure Arc-enabled servers?
    url: https://learn.microsoft.com/en-us/azure/azure-arc/servers/overview
