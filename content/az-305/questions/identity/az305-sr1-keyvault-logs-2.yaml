id: az305-sr1-keyvault-logs-2
objective: "1.3.2"
type: series_yesno
series: az305-sr1-keyvault-logs
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You recommend a DeployIfNotExists assignment at MG-Prod and a remediation task.
  fr: Vous recommandez une attribution DeployIfNotExists sur MG-Prod et une tâche de correction.
body:
  solution:
    en: |
      You recommend assigning to **MG-Prod** the built-in Azure Policy definition that enables audit logging of key vaults to a Log Analytics workspace. The assignment targets LAW1, its effect parameter is set to **DeployIfNotExists**, and its managed identity has the required roles. You also recommend creating a **remediation task** for the assignment.
    fr: |
      Vous recommandez d'attribuer à **MG-Prod** la définition Azure Policy intégrée qui active la journalisation d'audit des coffres de clés vers un espace de travail Log Analytics. L'attribution cible LAW1, son paramètre d'effet est défini sur **DeployIfNotExists** et son identité managée détient les rôles nécessaires. Vous recommandez aussi de créer une **tâche de correction** pour l'attribution.
answer: { value: true }
explanation:
  correct:
    en: |
      An assignment at MG-Prod applies to every subscription under the management group, including future ones. With DeployIfNotExists, Azure Policy creates the diagnostic setting by itself shortly after a key vault is created or updated, by using the managed identity of the assignment. The remediation task runs the same deployment on the 60 key vaults that already exist, so all three populations are covered without any action from the project teams.
    fr: |
      Une attribution sur MG-Prod s'applique à tous les abonnements du groupe d'administration, y compris les futurs. Avec DeployIfNotExists, Azure Policy crée lui-même le paramètre de diagnostic peu après la création ou la mise à jour d'un coffre de clés, à l'aide de l'identité managée de l'attribution. La tâche de correction exécute le même déploiement sur les 60 coffres de clés déjà existants : les trois populations sont donc couvertes sans aucune action des équipes projet.
references:
  - title: Create diagnostic settings at scale by using built-in Azure policies
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings-policy-built-in
  - title: Remediate non-compliant resources with Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
