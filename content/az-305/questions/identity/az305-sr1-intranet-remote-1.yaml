stem:
  en: You recommend Microsoft Entra application proxy with Microsoft Entra ID pre-authentication.
  fr: Vous recommandez le proxy d'application Microsoft Entra avec la préauthentification Microsoft Entra ID.
body:
  solution:
    en: |
      You recommend publishing App1 by using **Microsoft Entra application proxy**. A private network connector is installed on a server in the datacenter, and the pre-authentication method of the application is set to **Microsoft Entra ID**.
    fr: |
      Vous recommandez de publier App1 à l'aide du **proxy d'application Microsoft Entra**. Un connecteur de réseau privé est installé sur un serveur du centre de données, et la méthode de préauthentification de l'application est définie sur **Microsoft Entra ID**.
answer: { value: true }
explanation:
  correct:
    en: |
      The private network connector only opens outbound connections to the application proxy service, so no inbound port is needed on the perimeter firewall, and users reach App1 from a browser without any VPN client. With Microsoft Entra ID pre-authentication, users sign in to Microsoft Entra ID first: Conditional Access, including the MFA requirement, is applied in the cloud and only authenticated requests are forwarded to the datacenter. The connector can then give single sign-on to App1 through Kerberos constrained delegation.
    fr: |
      Le connecteur de réseau privé n'ouvre que des connexions sortantes vers le service de proxy d'application : aucun port entrant n'est nécessaire sur le pare-feu de périmètre, et les utilisateurs atteignent App1 depuis un navigateur, sans client VPN. Avec la préauthentification Microsoft Entra ID, les utilisateurs se connectent d'abord à Microsoft Entra ID : l'accès conditionnel, y compris l'exigence de MFA, s'applique dans le cloud et seules les requêtes authentifiées sont transmises au centre de données. Le connecteur peut ensuite fournir l'authentification unique à App1 grâce à la délégation Kerberos contrainte.
references:
