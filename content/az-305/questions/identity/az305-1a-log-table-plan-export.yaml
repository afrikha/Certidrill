id: az305-1a-log-table-plan-export
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware has a Log Analytics workspace. A custom table named **AppDebug_CL** will receive 800 GB of verbose application logs per day.

    You need to recommend a table plan for AppDebug_CL that meets the following requirements:

    - Engineers query the logs of the last 30 days with KQL, only during incident investigations.
    - No alert rule and no insight will use the table.
    - A data export rule must continuously send the new records of the table to an event hub that a partner reads.
    - No record may be dropped.
    - The ingestion cost must be minimized.

    Which table plan should you recommend?
  fr: |
    Proseware dispose d'un espace de travail Log Analytics. Une table personnalisée nommée **AppDebug_CL** recevra 800 Go de journaux d'application détaillés par jour.

    Vous devez recommander un plan de table pour AppDebug_CL qui répond aux exigences suivantes :

    - Les ingénieurs interrogent les journaux des 30 derniers jours en KQL, uniquement pendant l'investigation des incidents.
    - Aucune règle d'alerte et aucun insight n'utilisera la table.
    - Une règle d'exportation de données doit envoyer en continu les nouveaux enregistrements de la table vers un hub d'événements lu par un partenaire.
    - Aucun enregistrement ne doit être supprimé.
    - Le coût d'ingestion doit être réduit au minimum.

    Quel plan de table devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "The Analytics plan"
        fr: "Le plan Analytics"
    - id: b
      text:
        en: "The Basic plan"
        fr: "Le plan Basic"
    - id: c
      text:
        en: "The Auxiliary plan"
        fr: "Le plan Auxiliary"
    - id: d
      text:
        en: "The Analytics plan, with a daily cap of 400 GB on the workspace"
        fr: "Le plan Analytics, avec un plafond quotidien de 400 Go sur l'espace de travail"
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Basic plan has a reduced ingestion cost, supports full KQL over a 30-day query window and is supported by data export rules. The Auxiliary plan is cheaper to ingest but can't be exported by a data export rule, so Basic is the least expensive plan that still meets every requirement.
    fr: |
      Le plan Basic a un coût d'ingestion réduit, prend en charge le KQL complet sur une fenêtre de requête de 30 jours et est pris en charge par les règles d'exportation de données. Le plan Auxiliary coûte moins cher à l'ingestion, mais une règle d'exportation de données ne peut pas l'exporter : Basic est donc le plan le moins cher qui répond encore à toutes les exigences.
  options:
    a:
      en: "The Analytics plan meets the functional requirements, but at the standard ingestion price, for alerting and insight features that the table doesn't need."
      fr: "Le plan Analytics répond aux exigences fonctionnelles, mais au prix d'ingestion standard, pour des fonctionnalités d'alerte et d'insights dont la table n'a pas besoin."
    c:
      en: "The Auxiliary plan has the lowest ingestion cost, but data export rules don't support Auxiliary tables."
      fr: "Le plan Auxiliary a le coût d'ingestion le plus bas, mais les règles d'exportation de données ne prennent pas en charge les tables Auxiliary."
    d:
      en: "A daily cap stops data collection for the rest of the day once it is reached, so about half of the records would be lost."
      fr: "Un plafond quotidien arrête la collecte des données pour le reste de la journée dès qu'il est atteint : environ la moitié des enregistrements serait perdue."
references:
  - title: Azure Monitor Logs overview
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/data-platform-logs
  - title: Log Analytics data export rules in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/logs-data-export
