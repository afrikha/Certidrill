id: az305-1c-mg-hierarchy-rules-yn
objective: "1.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has one Microsoft Entra tenant and 80 Azure subscriptions. You are designing the management group hierarchy. The hierarchy settings of the tenant have their default values.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un locataire Microsoft Entra et de 80 abonnements Azure. Vous concevez la hiérarchie des groupes d'administration. Les paramètres de la hiérarchie du locataire ont leurs valeurs par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A subscription can be a direct child of two management groups at the same time."
        fr: "Un abonnement peut être l'enfant direct de deux groupes d'administration en même temps."
    - id: s2
      text:
        en: "A policy that is assigned at a management group applies to a subscription that is moved into this management group one month later."
        fr: "Une stratégie attribuée sur un groupe d'administration s'applique à un abonnement déplacé dans ce groupe d'administration un mois plus tard."
    - id: s3
      text:
        en: "A subscription that is created next week is placed under the Tenant Root Group."
        fr: "Un abonnement créé la semaine prochaine est placé sous le groupe racine du locataire."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Each management group and each subscription has exactly one parent, so a subscription belongs to a single management group. Policy and role assignments made at a management group are inherited by everything below it, including subscriptions that arrive later. Unless a default management group is configured in the hierarchy settings, new subscriptions are placed under the root management group."
    fr: "Chaque groupe d'administration et chaque abonnement a exactement un parent : un abonnement appartient donc à un seul groupe d'administration. Les attributions de stratégies et de rôles faites sur un groupe d'administration sont héritées par tout ce qui se trouve en dessous, y compris par les abonnements arrivés plus tard. Tant qu'aucun groupe d'administration par défaut n'est configuré dans les paramètres de la hiérarchie, les nouveaux abonnements sont placés sous le groupe d'administration racine."
references:
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
