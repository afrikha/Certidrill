id: az305-1b-idm-domain-services-yn
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. synchronizes its on-premises Active Directory Domain Services (AD DS) forest to a Microsoft Entra tenant. Proseware plans to deploy a Microsoft Entra Domain Services managed domain in Azure for applications that are migrated from its datacenter.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. synchronise sa forêt Active Directory Domain Services (AD DS) locale vers un locataire Microsoft Entra. Proseware prévoit de déployer dans Azure un domaine managé Microsoft Entra Domain Services pour des applications migrées depuis son centre de données.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Changes that are made in the managed domain are synchronized back to Microsoft Entra ID.
        fr: Les modifications effectuées dans le domaine managé sont synchronisées en retour vers Microsoft Entra ID.
    - id: s2
      text:
        en: Microsoft patches and backs up the domain controllers of the managed domain.
        fr: Microsoft corrige et sauvegarde les contrôleurs de domaine du domaine managé.
    - id: s3
      text:
        en: A forest trust can be configured between the managed domain and the on-premises AD DS forest.
        fr: Une approbation de forêt peut être configurée entre le domaine managé et la forêt AD DS locale.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Synchronization is one-way, from Microsoft Entra ID to the managed domain: users, groups and credentials flow in, and nothing is written back. The domain controllers of the replica set are fully managed by Microsoft, including patching, backups and availability. A managed domain is a standalone domain, but forest trusts with an on-premises AD DS forest can be configured for hybrid access."
    fr: "La synchronisation est à sens unique, de Microsoft Entra ID vers le domaine managé : les utilisateurs, les groupes et les informations d'identification y sont copiés, et rien n'est réécrit en retour. Les contrôleurs de domaine du jeu de réplicas sont entièrement gérés par Microsoft, y compris les correctifs, les sauvegardes et la disponibilité. Un domaine managé est un domaine autonome, mais des approbations de forêt avec une forêt AD DS locale peuvent être configurées pour un accès hybride."
references:
  - title: What is Microsoft Entra Domain Services?
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/overview
  - title: Compare self-managed Active Directory Domain Services, Microsoft Entra ID, and managed Microsoft Entra Domain Services
    url: https://learn.microsoft.com/en-us/entra/identity/domain-services/compare-identity-solutions
