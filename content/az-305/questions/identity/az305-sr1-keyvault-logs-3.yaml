id: az305-sr1-keyvault-logs-3
objective: "1.3.2"
type: series_yesno
series: az305-sr1-keyvault-logs
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You recommend only a DeployIfNotExists assignment at MG-Prod.
  fr: Vous recommandez uniquement une attribution DeployIfNotExists sur MG-Prod.
body:
  solution:
    en: |
      You recommend assigning to **MG-Prod** the built-in Azure Policy definition that enables audit logging of key vaults to a Log Analytics workspace. The assignment targets LAW1, its effect parameter is set to **DeployIfNotExists**, and its managed identity has the required roles. You recommend no other action.
    fr: |
      Vous recommandez d'attribuer à **MG-Prod** la définition Azure Policy intégrée qui active la journalisation d'audit des coffres de clés vers un espace de travail Log Analytics. L'attribution cible LAW1, son paramètre d'effet est défini sur **DeployIfNotExists** et son identité managée détient les rôles nécessaires. Vous ne recommandez aucune autre action.
answer: { value: false }
explanation:
  correct:
    en: |
      DeployIfNotExists runs a deployment only when a resource is created or updated. During the regular evaluation cycle, the existing key vaults without a diagnostic setting are reported as non-compliant, but nothing is deployed to them. Without a remediation task, the existing key vaults keep no diagnostic setting until someone updates them, so the first requirement is not met.
    fr: |
      DeployIfNotExists n'exécute un déploiement que lorsqu'une ressource est créée ou mise à jour. Lors du cycle d'évaluation normal, les coffres de clés existants sans paramètre de diagnostic sont signalés comme non conformes, mais rien n'y est déployé. Sans tâche de correction, les coffres de clés existants restent sans paramètre de diagnostic tant que personne ne les met à jour : la première exigence n'est donc pas respectée.
references:
  - title: Azure Policy definitions deployIfNotExists effect
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-deploy-if-not-exists
  - title: Remediate non-compliant resources with Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
