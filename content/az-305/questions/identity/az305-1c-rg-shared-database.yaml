id: az305-1c-rg-shared-database
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum plans to deploy three web applications named **App1**, **App2** and **App3** to one Azure subscription. Each application has its own App Service plan and its own storage account. The three applications read from one Azure SQL database that is managed by the data team.

    The solution must meet the following requirements:

    - Each application is redeployed, and sometimes deleted, independently of the others.
    - Deleting an application must never delete the database.
    - The data team must be the only team that manages the database, with as few role assignments as possible.

    Which resource group structure should you recommend?
  fr: |
    Adatum prévoit de déployer trois applications web nommées **App1**, **App2** et **App3** dans un abonnement Azure. Chaque application possède son propre plan App Service et son propre compte de stockage. Les trois applications lisent une même base de données Azure SQL, gérée par l'équipe des données.

    La solution doit respecter les exigences suivantes :

    - Chaque application est redéployée, et parfois supprimée, indépendamment des autres.
    - La suppression d'une application ne doit jamais supprimer la base de données.
    - L'équipe des données doit être la seule à gérer la base de données, avec le moins d'attributions de rôles possible.

    Quelle structure de groupes de ressources devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "One resource group for all the resources", fr: "Un groupe de ressources pour toutes les ressources" }
    - id: b
      text: { en: "One resource group per application, with the database in the resource group of App1", fr: "Un groupe de ressources par application, la base de données étant dans le groupe de ressources d'App1" }
    - id: c
      text: { en: "One resource group per application, and one resource group for the database", fr: "Un groupe de ressources par application, et un groupe de ressources pour la base de données" }
    - id: d
      text: { en: "One resource group per resource type: plans, storage accounts and databases", fr: "Un groupe de ressources par type de ressource : plans, comptes de stockage et bases de données" }
answer: { optionId: c }
explanation:
  correct:
    en: "A resource group should hold resources that share the same life cycle, because they are deployed, updated and deleted together. Each application gets its group, and the shared database, which lives longer than any application, gets its own. The data team then receives a single role assignment on the group of the database."
    fr: "Un groupe de ressources doit contenir des ressources qui partagent le même cycle de vie, car elles sont déployées, mises à jour et supprimées ensemble. Chaque application reçoit son groupe, et la base de données partagée, qui vit plus longtemps que n'importe quelle application, reçoit le sien. L'équipe des données reçoit alors une seule attribution de rôle sur le groupe de la base de données."
  options:
    a:
      en: "With a single group, an application can't be deleted by deleting its group, and a role assigned on the group would cover the applications as well as the database."
      fr: "Avec un seul groupe, une application ne peut pas être supprimée en supprimant son groupe, et un rôle attribué sur le groupe couvrirait les applications autant que la base de données."
    b:
      en: "Deleting the resource group of App1 would delete the database that App2 and App3 still use."
      fr: "La suppression du groupe de ressources d'App1 supprimerait la base de données qu'App2 et App3 utilisent encore."
    d:
      en: "Grouping by resource type separates resources that are deployed together and mixes the three applications, so an application can't be redeployed or deleted as a unit."
      fr: "Le regroupement par type de ressource sépare des ressources déployées ensemble et mélange les trois applications : une application ne peut plus être redéployée ou supprimée comme une unité."
references:
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
