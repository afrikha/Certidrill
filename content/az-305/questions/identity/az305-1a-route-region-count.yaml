id: az305-1a-route-region-count
objective: "1.1.2"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Litware has a single Microsoft Entra tenant. Azure SQL databases and key vaults are deployed in the West Europe, North Europe and East US regions. No data residency regulation applies.

    You need to recommend the destinations of the diagnostic settings of these resources. The solution must meet the following requirements:

    - The resource logs of all the regions must be analyzed together with KQL queries.
    - A copy of the resource logs must be archived in storage accounts that have an immutability policy.
    - The number of Log Analytics workspaces and storage accounts must be minimized.

    What should you recommend?
  fr: |
    Litware dispose d'un seul locataire Microsoft Entra. Des bases de données Azure SQL et des coffres de clés sont déployés dans les régions Europe Ouest, Europe Nord et USA Est. Aucune réglementation sur la résidence des données ne s'applique.

    Vous devez recommander les destinations des paramètres de diagnostic de ces ressources. La solution doit répondre aux exigences suivantes :

    - Les journaux de ressources de toutes les régions doivent être analysés ensemble avec des requêtes KQL.
    - Une copie des journaux de ressources doit être archivée dans des comptes de stockage dotés d'une stratégie d'immuabilité.
    - Le nombre d'espaces de travail Log Analytics et de comptes de stockage doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "One Log Analytics workspace and one storage account"
        fr: "Un espace de travail Log Analytics et un compte de stockage"
    - id: b
      text:
        en: "One Log Analytics workspace and three storage accounts"
        fr: "Un espace de travail Log Analytics et trois comptes de stockage"
    - id: c
      text:
        en: "Three Log Analytics workspaces and one storage account"
        fr: "Trois espaces de travail Log Analytics et un compte de stockage"
    - id: d
      text:
        en: "Three Log Analytics workspaces and three storage accounts"
        fr: "Trois espaces de travail Log Analytics et trois comptes de stockage"
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Log Analytics workspace can receive the logs of resources in any region, so one workspace is enough and lets all the logs be queried together. A storage account used as the destination of a diagnostic setting must be in the same region as the monitored resource when the resource is regional, so each of the three regions needs its own storage account.
    fr: |
      Un espace de travail Log Analytics peut recevoir les journaux de ressources de n'importe quelle région : un seul espace de travail suffit et permet d'interroger tous les journaux ensemble. Un compte de stockage utilisé comme destination d'un paramètre de diagnostic doit se trouver dans la même région que la ressource surveillée quand celle-ci est régionale : chacune des trois régions a donc besoin de son propre compte de stockage.
  options:
    a:
      en: "A single storage account can receive the logs of the regional resources of its own region only."
      fr: "Un seul compte de stockage ne peut recevoir que les journaux des ressources régionales de sa propre région."
    c:
      en: "The constraint is the wrong way round: workspaces have no region constraint, storage accounts do."
      fr: "La contrainte est inversée : les espaces de travail n'ont pas de contrainte de région, les comptes de stockage en ont une."
    d:
      en: "It works, but two of the three workspaces are unnecessary, and separate workspaces make it harder to query the logs together."
      fr: "Cette option fonctionne, mais deux des trois espaces de travail sont inutiles, et des espaces de travail séparés compliquent l'interrogation conjointe des journaux."
references:
  - title: Diagnostic settings in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings
