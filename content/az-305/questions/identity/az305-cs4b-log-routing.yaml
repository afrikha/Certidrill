id: az305-cs4b-log-routing
objective: "1.1.2"
type: yesno_statements
caseStudy: az305-cs4b-fourthcoffee
difficulty: 2
status: draft
stem:
  en: |
    You are designing the diagnostic settings of the BrewAhead resources that are deployed in West Europe. The design must meet the monitoring requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez les paramètres de diagnostic des ressources BrewAhead déployées dans West Europe. La conception doit respecter les exigences de monitoring.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The diagnostic settings can send the resource logs to law-brew.
        fr: Les paramètres de diagnostic peuvent envoyer les journaux de ressources à law-brew.
    - id: s2
      text:
        en: The diagnostic settings can stream the resource logs to an event hub of evh-soc.
        fr: Les paramètres de diagnostic peuvent diffuser les journaux de ressources vers un hub d'événements d'evh-soc.
    - id: s3
      text:
        en: One diagnostic setting on a resource can send the resource logs both to a Log Analytics workspace and to an event hub.
        fr: Un seul paramètre de diagnostic sur une ressource peut envoyer les journaux de ressources à la fois à un espace de travail Log Analytics et à un hub d'événements.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A Log Analytics workspace used as a destination can be in any region, so the West Europe resources can send their logs to law-brew in North Europe. An event hub used as a destination must be in the same region as a regional resource: evh-soc is in North Europe, so streaming to the SIEM product requires an Event Hubs namespace in West Europe. A diagnostic setting accepts one destination of each type, so a single setting per resource can feed the workspace and the event hub, which keeps the number of settings to a minimum.
    fr: |
      Un espace de travail Log Analytics utilisé comme destination peut se trouver dans n'importe quelle région : les ressources de West Europe peuvent donc envoyer leurs journaux à law-brew, situé dans North Europe. Un hub d'événements utilisé comme destination doit se trouver dans la même région qu'une ressource régionale : evh-soc étant dans North Europe, la diffusion vers le produit SIEM exige un espace de noms Event Hubs dans West Europe. Un paramètre de diagnostic accepte une destination de chaque type : un seul paramètre par ressource peut donc alimenter l'espace de travail et le hub d'événements, ce qui réduit au minimum le nombre de paramètres.
  options:
    s2:
      en: "The region constraint applies to event hubs and storage accounts, not to Log Analytics workspaces: resources in West Europe cannot stream to a namespace in North Europe."
      fr: "La contrainte de région s'applique aux hubs d'événements et aux comptes de stockage, pas aux espaces de travail Log Analytics : des ressources de West Europe ne peuvent pas diffuser vers un espace de noms situé dans North Europe."
references:
  - title: Diagnostic settings in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings
