id: az305-1c-tags-policy-design
objective: "1.3.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has 15 subscriptions in a management group named **MG-Workloads**. Chargeback relies on a tag named `costcenter`.

    You need to recommend Azure Policy assignments at MG-Workloads that meet the following requirements:

    - A request to create a resource group without a `costcenter` tag must be refused.
    - Every resource must carry the `costcenter` value of its resource group, with no action from the people who deploy. A different value entered on a resource must be replaced.
    - About 3,000 existing resources have no `costcenter` tag. They must receive the tag without being redeployed.

    What should you include in the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose de 15 abonnements dans un groupe d'administration nommé **MG-Workloads**. La refacturation repose sur une étiquette nommée `costcenter`.

    Vous devez recommander des attributions Azure Policy sur MG-Workloads qui respectent les exigences suivantes :

    - Une demande de création d'un groupe de ressources sans étiquette `costcenter` doit être refusée.
    - Chaque ressource doit porter la valeur `costcenter` de son groupe de ressources, sans action des personnes qui déploient. Une valeur différente saisie sur une ressource doit être remplacée.
    - Environ 3 000 ressources existantes n'ont pas d'étiquette `costcenter`. Elles doivent recevoir l'étiquette sans être redéployées.

    Que devez-vous inclure dans la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Built-in policy for resource groups: [[rg]]

      Built-in policy for resources: [[res]]

      For the existing resources: [[existing]]
    fr: |
      Stratégie intégrée pour les groupes de ressources : [[rg]]

      Stratégie intégrée pour les ressources : [[res]]

      Pour les ressources existantes : [[existing]]
  slots:
    - id: rg
      options:
        - { id: addrg, text: Add a tag to resource groups }
        - { id: inhsub, text: Inherit a tag from the subscription }
        - { id: reqrg, text: Require a tag on resource groups }
        - { id: reqres, text: Require a tag on resources }
    - id: res
      options:
        - { id: addres, text: Add a tag to resources }
        - { id: inh, text: Inherit a tag from the resource group }
        - { id: inhmissing, text: Inherit a tag from the resource group if missing }
        - { id: reqres, text: Require a tag on resources }
    - id: existing
      options:
        - { id: exempt, text: { en: "Create a policy exemption", fr: "Créer une exemption de stratégie" } }
        - { id: remediate, text: { en: "Create a remediation task", fr: "Créer une tâche de correction" } }
        - { id: rescan, text: { en: "Start an on-demand compliance evaluation scan", fr: "Lancer une analyse d'évaluation de la conformité à la demande" } }
        - { id: donotenforce, text: { en: "Set the enforcement mode to Disabled", fr: "Définir le mode d'application sur Disabled" } }
answer:
  values: { rg: reqrg, res: inh, existing: remediate }
explanation:
  correct:
    en: "Require a tag on resource groups uses the deny effect, so a resource group without the tag can't be created. Inherit a tag from the resource group uses the modify effect to add the tag or to replace its value with the value of the resource group whenever a resource is created or updated. Existing resources that nobody updates are corrected by a remediation task, which runs with the managed identity of the assignment."
    fr: "Require a tag on resource groups utilise l'effet deny, si bien qu'un groupe de ressources sans l'étiquette ne peut pas être créé. Inherit a tag from the resource group utilise l'effet modify pour ajouter l'étiquette ou remplacer sa valeur par celle du groupe de ressources à chaque création ou mise à jour d'une ressource. Les ressources existantes que personne ne met à jour sont corrigées par une tâche de correction, exécutée avec l'identité managée de l'attribution."
  options:
    addrg:
      en: "Add a tag to resource groups adds a fixed value when the tag is missing. It doesn't refuse the request."
      fr: "Add a tag to resource groups ajoute une valeur fixe lorsque l'étiquette manque. Elle ne refuse pas la demande."
    inhmissing:
      en: "Inherit a tag from the resource group if missing leaves a different value entered on the resource in place."
      fr: "Inherit a tag from the resource group if missing laisse en place une valeur différente saisie sur la ressource."
    addres:
      en: "Add a tag to resources writes the value given in the assignment, not the value of the resource group."
      fr: "Add a tag to resources écrit la valeur indiquée dans l'attribution, pas celle du groupe de ressources."
    reqres:
      en: "Require a tag on resources denies requests, which forces the people who deploy to supply the tag, and it applies to resources, not to resource groups."
      fr: "Require a tag on resources refuse les demandes, ce qui oblige les personnes qui déploient à fournir l'étiquette, et elle s'applique aux ressources, pas aux groupes de ressources."
    rescan:
      en: "An evaluation scan only refreshes the compliance state. It doesn't change any resource."
      fr: "Une analyse d'évaluation ne fait qu'actualiser l'état de conformité. Elle ne modifie aucune ressource."
references:
  - title: Assign policy definitions for tag compliance
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-policies
  - title: Remediate non-compliant resources with Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
