id: az305-1b-authz-reader-mg-scope
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a management group named **MG-Prod** that contains 14 subscriptions. New subscriptions are added to MG-Prod every quarter. The internal audit team has 40 users.

    You need to recommend how to give the auditors access. The solution must meet the following requirements:

    - The auditors can view the configuration of all the resources in the current and future subscriptions of MG-Prod.
    - The auditors can't change any resource.
    - Administrative effort is minimized.

    What should you recommend?
  fr: |
    Contoso, Ltd. dispose d'un groupe d'administration nommé **MG-Prod** qui contient 14 abonnements. De nouveaux abonnements sont ajoutés à MG-Prod chaque trimestre. L'équipe d'audit interne compte 40 utilisateurs.

    Vous devez recommander la manière de donner l'accès aux auditeurs. La solution doit répondre aux exigences suivantes :

    - Les auditeurs peuvent consulter la configuration de toutes les ressources des abonnements actuels et futurs de MG-Prod.
    - Les auditeurs ne peuvent modifier aucune ressource.
    - L'effort d'administration est réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Assign the Reader role to each auditor at each subscription.", fr: "Attribuer le rôle Reader à chaque auditeur au niveau de chaque abonnement." }
    - id: b
      text: { en: "Assign the Global Reader role to a group of the auditors in Microsoft Entra ID.", fr: "Attribuer le rôle Global Reader à un groupe des auditeurs dans Microsoft Entra ID." }
    - id: c
      text: { en: "Assign the Reader role to a group of the auditors at MG-Prod.", fr: "Attribuer le rôle Reader à un groupe des auditeurs au niveau de MG-Prod." }
    - id: d
      text: { en: "Assign a policy initiative that uses the audit effect at MG-Prod.", fr: "Attribuer une initiative de stratégie qui utilise l'effet audit au niveau de MG-Prod." }
answer: { optionId: c }
explanation:
  correct:
    en: "A role assignment made at a management group is inherited by every subscription below it, including the subscriptions that are added later. Reader lets the auditors view all the resources without changing them, and assigning it to a group means that one assignment covers the 40 users and follows the membership of the group."
    fr: "Une attribution de rôle effectuée au niveau d'un groupe d'administration est héritée par tous les abonnements situés en dessous, y compris ceux qui sont ajoutés par la suite. Reader permet aux auditeurs de consulter toutes les ressources sans les modifier, et l'attribuer à un groupe signifie qu'une seule attribution couvre les 40 utilisateurs et suit l'appartenance au groupe."
  options:
    a:
      en: "This requires 560 assignments today and new ones each time a subscription or an auditor is added."
      fr: "Cela demande 560 attributions aujourd'hui, et de nouvelles à chaque ajout d'un abonnement ou d'un auditeur."
    b:
      en: "Global Reader is a Microsoft Entra role: it reads the directory and Microsoft 365 settings, and gives no access to Azure resources."
      fr: "Global Reader est un rôle Microsoft Entra : il lit l'annuaire et les paramètres Microsoft 365, et ne donne aucun accès aux ressources Azure."
    d:
      en: "Azure Policy evaluates the compliance of resources. It doesn't grant anyone access to view them."
      fr: "Azure Policy évalue la conformité des ressources. Il n'accorde à personne l'accès permettant de les consulter."
references:
  - title: What is Azure role-based access control (Azure RBAC)?
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
  - title: Best practices for Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/best-practices
