id: az305-1a-route-entra-logs-where
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Microsoft Entra tenant and an Azure subscription. The subscription contains a Log Analytics workspace named **WS-Sec** on which Microsoft Sentinel is enabled.

    The security team needs to correlate the Microsoft Entra sign-in logs and audit logs with the other data of WS-Sec.

    You need to recommend how to route these logs to WS-Sec.

    What should you recommend?
  fr: |
    Contoso dispose d'un locataire Microsoft Entra et d'un abonnement Azure. L'abonnement contient un espace de travail Log Analytics nommé **WS-Sec** sur lequel Microsoft Sentinel est activé.

    L'équipe de sécurité doit corréler les journaux de connexion et les journaux d'audit Microsoft Entra avec les autres données de WS-Sec.

    Vous devez recommander la manière d'acheminer ces journaux vers WS-Sec.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "A diagnostic setting on the subscription that has WS-Sec as its destination"
        fr: "Un paramètre de diagnostic sur l'abonnement dont la destination est WS-Sec"
    - id: b
      text:
        en: "A data collection rule that has WS-Sec as its destination"
        fr: "Une règle de collecte de données dont la destination est WS-Sec"
    - id: c
      text:
        en: "A data export rule created in WS-Sec"
        fr: "Une règle d'exportation de données créée dans WS-Sec"
    - id: d
      text:
        en: "A diagnostic setting in Microsoft Entra ID that has WS-Sec as its destination"
        fr: "Un paramètre de diagnostic dans Microsoft Entra ID dont la destination est WS-Sec"
answer: { optionId: d }
explanation:
  correct:
    en: |
      Microsoft Entra activity logs are routed by diagnostic settings that are configured in Microsoft Entra ID itself. Such a setting can send the sign-in and audit logs to a Log Analytics workspace, an event hub or a storage account.
    fr: |
      Les journaux d'activité Microsoft Entra sont acheminés par des paramètres de diagnostic configurés dans Microsoft Entra ID lui-même. Un tel paramètre peut envoyer les journaux de connexion et d'audit vers un espace de travail Log Analytics, un hub d'événements ou un compte de stockage.
  options:
    a:
      en: "A diagnostic setting on a subscription exports the activity log of the subscription, which contains control plane operations on Azure resources, not Microsoft Entra sign-ins."
      fr: "Un paramètre de diagnostic sur un abonnement exporte le journal d'activité de l'abonnement, qui contient les opérations du plan de contrôle sur les ressources Azure, pas les connexions Microsoft Entra."
    b:
      en: "A data collection rule drives what the Azure Monitor Agent collects from machines; the tenant's sign-in logs don't come from an agent."
      fr: "Une règle de collecte de données pilote ce que l'agent Azure Monitor collecte sur les machines ; les journaux de connexion du locataire ne proviennent pas d'un agent."
    c:
      en: "A data export rule sends data that is already in the workspace out to a storage account or an event hub; it doesn't bring logs in."
      fr: "Une règle d'exportation de données envoie des données déjà présentes dans l'espace de travail vers un compte de stockage ou un hub d'événements ; elle n'y fait pas entrer de journaux."
references:
  - title: Configure Microsoft Entra diagnostic settings for activity logs
    url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/howto-configure-diagnostic-settings
  - title: What are the Microsoft Entra activity log integration options?
    url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-log-monitoring-integration-options-considerations
