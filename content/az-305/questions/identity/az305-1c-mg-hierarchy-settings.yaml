id: az305-1c-mg-hierarchy-settings
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a management group hierarchy that follows the Azure landing zone architecture. All the policies of the company are assigned at a management group named **Fabrikam**, located directly under the Tenant Root Group.

    An audit reports two problems:

    - Subscriptions that developers create from their Visual Studio benefits appear directly under the Tenant Root Group, where no policy applies.
    - Several users created their own management groups under the Tenant Root Group.

    You need to recommend changes to meet the following requirements:

    - Every new subscription must be placed automatically in the **Sandbox** management group.
    - Only principals that are authorized by the platform team must be able to create management groups.

    Which two settings should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une hiérarchie de groupes d'administration conforme à l'architecture des zones d'atterrissage Azure. Toutes les stratégies de l'entreprise sont attribuées sur un groupe d'administration nommé **Fabrikam**, situé directement sous le groupe racine du locataire.

    Un audit signale deux problèmes :

    - Les abonnements que les développeurs créent à partir de leurs avantages Visual Studio apparaissent directement sous le groupe racine du locataire, où aucune stratégie ne s'applique.
    - Plusieurs utilisateurs ont créé leurs propres groupes d'administration sous le groupe racine du locataire.

    Vous devez recommander des modifications qui respectent les exigences suivantes :

    - Chaque nouvel abonnement doit être placé automatiquement dans le groupe d'administration **Sandbox**.
    - Seuls les principaux autorisés par l'équipe de plateforme doivent pouvoir créer des groupes d'administration.

    Quels sont les deux paramètres à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Apply a `CanNotDelete` lock to the Tenant Root Group.", fr: "Appliquer un verrou `CanNotDelete` au groupe racine du locataire." }
    - id: b
      text: { en: "Set Sandbox as the default management group in the hierarchy settings.", fr: "Définir Sandbox comme groupe d'administration par défaut dans les paramètres de la hiérarchie." }
    - id: c
      text: { en: "Assign the Allowed resource types policy at the Tenant Root Group.", fr: "Attribuer la stratégie Allowed resource types sur le groupe racine du locataire." }
    - id: d
      text: { en: "Require authorization to create management groups in the hierarchy settings.", fr: "Exiger une autorisation pour créer des groupes d'administration dans les paramètres de la hiérarchie." }
    - id: e
      text: { en: "Assign the Management Group Reader role to all users at the Fabrikam management group.", fr: "Attribuer le rôle Management Group Reader à tous les utilisateurs sur le groupe d'administration Fabrikam." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The hierarchy settings of the root management group hold two options. The default management group decides where new subscriptions are placed, instead of the Tenant Root Group. Requiring authorization limits the creation of management groups to principals that have the write permission on management groups at the root, whereas any user of the tenant can create one by default."
    fr: "Les paramètres de la hiérarchie du groupe d'administration racine comportent deux options. Le groupe d'administration par défaut détermine l'emplacement des nouveaux abonnements, à la place du groupe racine du locataire. L'exigence d'autorisation réserve la création de groupes d'administration aux principaux qui détiennent l'autorisation d'écriture sur les groupes d'administration à la racine, alors que tout utilisateur du locataire peut en créer un par défaut."
  options:
    a:
      en: "Resource locks apply to subscriptions, resource groups and resources. A management group can't carry a lock, and a lock wouldn't control where subscriptions are placed."
      fr: "Les verrous de ressources s'appliquent aux abonnements, aux groupes de ressources et aux ressources. Un groupe d'administration ne peut pas porter de verrou, et un verrou ne déterminerait pas l'emplacement des abonnements."
    c:
      en: "Azure Policy governs the resources inside subscriptions. It neither moves new subscriptions to another management group nor restricts the creation of management groups."
      fr: "Azure Policy régit les ressources à l'intérieur des abonnements. Il ne déplace pas les nouveaux abonnements vers un autre groupe d'administration et ne restreint pas la création de groupes d'administration."
    e:
      en: "Management Group Reader only lets users view the hierarchy. Without the authorization requirement, users can still create management groups."
      fr: "Management Group Reader permet seulement de consulter la hiérarchie. Sans l'exigence d'autorisation, les utilisateurs peuvent toujours créer des groupes d'administration."
references:
  - title: Protect your resource hierarchy
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/how-to/protect-resource-hierarchy
  - title: Management groups
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups
