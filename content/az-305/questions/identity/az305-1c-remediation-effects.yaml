id: az305-1c-remediation-effects
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum adopts new standards for its Azure resources. About 2,000 existing resources don't meet them: some lack a required property value and others lack a diagnostic setting.

    The governance team doesn't want to write scripts. It plans to correct the existing resources by using Azure Policy remediation tasks.

    Which two policy effects can the definitions use so that remediation tasks can correct the existing resources?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum adopte de nouvelles règles pour ses ressources Azure. Environ 2 000 ressources existantes ne les respectent pas : certaines n'ont pas la valeur de propriété exigée, d'autres n'ont pas de paramètre de diagnostic.

    L'équipe de gouvernance ne veut pas écrire de scripts. Elle prévoit de corriger les ressources existantes au moyen de tâches de correction Azure Policy.

    Quels sont les deux effets de stratégie que les définitions peuvent utiliser pour que des tâches de correction puissent corriger les ressources existantes ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: append }
    - { id: b, text: audit }
    - { id: c, text: deny }
    - { id: d, text: deployIfNotExists }
    - { id: e, text: modify }
answer: { optionIds: [ d, e ] }
explanation:
  correct:
    en: "Remediation tasks exist for the two effects that change resources. A `modify` definition adds or replaces properties and tags, and a `deployIfNotExists` definition deploys a missing related resource such as a diagnostic setting. In both cases, the task runs with the managed identity of the assignment, which needs the roles named in the definition."
    fr: "Les tâches de correction existent pour les deux effets qui modifient des ressources. Une définition `modify` ajoute ou remplace des propriétés et des étiquettes, et une définition `deployIfNotExists` déploie une ressource associée manquante, comme un paramètre de diagnostic. Dans les deux cas, la tâche s'exécute avec l'identité managée de l'attribution, qui a besoin des rôles indiqués dans la définition."
  options:
    a:
      en: "`append` adds fields to a request while a resource is created or updated. It has no remediation task for resources that already exist."
      fr: "`append` ajoute des champs à une requête pendant la création ou la mise à jour d'une ressource. Il n'a pas de tâche de correction pour les ressources qui existent déjà."
    b:
      en: "`audit` only reports non-compliant resources. It changes nothing."
      fr: "`audit` se contente de signaler les ressources non conformes. Il ne modifie rien."
    c:
      en: "`deny` refuses non-compliant requests. Existing resources are reported as non-compliant but aren't corrected."
      fr: "`deny` refuse les requêtes non conformes. Les ressources existantes sont signalées comme non conformes, mais ne sont pas corrigées."
references:
  - title: Remediate non-compliant resources with Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
