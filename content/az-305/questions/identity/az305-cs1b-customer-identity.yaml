id: az305-cs1b-customer-identity
objective: "1.2.2"
type: single
caseStudy: az305-cs1b-blue-yonder
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend an identity service that replaces the customer accounts table. The solution must meet the requirements for customer identities.

    What should you recommend?
  fr: |
    Vous devez recommander un service d'identité qui remplace la table des comptes clients. La solution doit répondre aux exigences relatives aux identités des clients.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Microsoft Entra B2B collaboration in the blueyonderairlines.com tenant", fr: "La collaboration Microsoft Entra B2B dans le locataire blueyonderairlines.com" } }
    - { id: b, text: { en: "Microsoft Entra External ID in an external tenant", fr: "Microsoft Entra External ID dans un locataire externe" } }
    - { id: c, text: { en: "A Microsoft Entra Domain Services managed domain", fr: "Un domaine managé Microsoft Entra Domain Services" } }
    - { id: d, text: { en: "Cross-tenant synchronization with a second workforce tenant", fr: "La synchronisation entre locataires avec un deuxième locataire de personnel" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An external tenant of Microsoft Entra External ID is a directory dedicated to the customers of an application, separate from the workforce tenant that holds the employees. Its user flows provide self-service sign-up with an email address or a social account such as Google, on pages that carry the company branding.
    fr: |
      Un locataire externe de Microsoft Entra External ID est un annuaire réservé aux clients d'une application, distinct du locataire de personnel qui contient les employés. Ses flux d'utilisateurs fournissent l'inscription en libre-service avec une adresse e-mail ou un compte social tel que Google, sur des pages à la marque de l'entreprise.
  options:
    a:
      en: B2B collaboration creates guest accounts in the tenant of the employees, which the requirements exclude; it targets partners, not millions of customers.
      fr: La collaboration B2B crée des comptes invités dans le locataire des employés, ce que les exigences excluent ; elle vise des partenaires, pas des millions de clients.
    c:
      en: Domain Services provides domain join, LDAP and Kerberos to virtual machines in Azure; it isn't a sign-up and sign-in service for customers.
      fr: Domain Services fournit la jonction de domaine, LDAP et Kerberos aux machines virtuelles dans Azure ; ce n'est pas un service d'inscription et de connexion pour des clients.
    d:
      en: Cross-tenant synchronization copies employee accounts between the workforce tenants of one organization; customers can't sign up with it.
      fr: La synchronisation entre locataires copie des comptes d'employés entre les locataires de personnel d'une même organisation ; les clients ne peuvent pas s'inscrire par ce moyen.
references:
  - title: Introduction to Microsoft Entra External ID
    url: https://learn.microsoft.com/en-us/entra/external-id/external-identities-overview
