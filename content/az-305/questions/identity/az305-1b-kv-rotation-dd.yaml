id: az305-1b-kv-rotation-dd
objective: "1.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. stores the following objects in a key vault.

    | Object | Use |
    | --- | --- |
    | Key1 | Customer-managed key that encrypts Azure Storage accounts |
    | Cert1 | TLS certificate of a public website, issued by DigiCert |
    | Secret1 | Password of a SQL login, with an expiration date |

    Each object must be renewed automatically before it expires, with as little custom code as possible.

    What should you recommend for each object? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. stocke les objets suivants dans un coffre de clés.

    | Objet | Utilisation |
    | --- | --- |
    | Key1 | Clé gérée par le client qui chiffre des comptes Stockage Azure |
    | Cert1 | Certificat TLS d'un site web public, émis par DigiCert |
    | Secret1 | Mot de passe d'une connexion SQL, avec une date d'expiration |

    Chaque objet doit être renouvelé automatiquement avant son expiration, avec le moins de code personnalisé possible.

    Que devez-vous recommander pour chaque objet ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Key1: [[k]]

      Cert1: [[c]]

      Secret1: [[s]]
    fr: |
      Key1 : [[k]]

      Cert1 : [[c]]

      Secret1 : [[s]]
  slots:
    - id: k
      options:
        - { id: eg, text: { en: "An Event Grid subscription to the near-expiry event that triggers a function", fr: "Un abonnement Event Grid à l'événement d'expiration proche qui déclenche une fonction" } }
        - { id: rot, text: { en: "A rotation policy in Key Vault", fr: "Une stratégie de rotation dans Key Vault" } }
        - { id: ca, text: { en: "A certificate policy with an integrated certificate authority and automatic renewal", fr: "Une stratégie de certificat avec une autorité de certification intégrée et le renouvellement automatique" } }
        - { id: lm, text: { en: "A lifecycle management policy in Azure Storage", fr: "Une stratégie de gestion du cycle de vie dans Stockage Azure" } }
    - id: c
      options:
        - { id: eg, text: { en: "An Event Grid subscription to the near-expiry event that triggers a function", fr: "Un abonnement Event Grid à l'événement d'expiration proche qui déclenche une fonction" } }
        - { id: rot, text: { en: "A rotation policy in Key Vault", fr: "Une stratégie de rotation dans Key Vault" } }
        - { id: ca, text: { en: "A certificate policy with an integrated certificate authority and automatic renewal", fr: "Une stratégie de certificat avec une autorité de certification intégrée et le renouvellement automatique" } }
        - { id: lm, text: { en: "A lifecycle management policy in Azure Storage", fr: "Une stratégie de gestion du cycle de vie dans Stockage Azure" } }
    - id: s
      options:
        - { id: eg, text: { en: "An Event Grid subscription to the near-expiry event that triggers a function", fr: "Un abonnement Event Grid à l'événement d'expiration proche qui déclenche une fonction" } }
        - { id: rot, text: { en: "A rotation policy in Key Vault", fr: "Une stratégie de rotation dans Key Vault" } }
        - { id: ca, text: { en: "A certificate policy with an integrated certificate authority and automatic renewal", fr: "Une stratégie de certificat avec une autorité de certification intégrée et le renouvellement automatique" } }
        - { id: lm, text: { en: "A lifecycle management policy in Azure Storage", fr: "Une stratégie de gestion du cycle de vie dans Stockage Azure" } }
answer:
  values: { k: rot, c: ca, s: eg }
explanation:
  correct:
    en: "A key rotation policy makes Key Vault generate new versions of a key at a set interval, which suits customer-managed keys. A certificate is renewed by Key Vault itself when its policy references an integrated certificate authority such as DigiCert or GlobalSign and has an automatic renewal action. Key Vault doesn't change the value of a secret: the near-expiry event sent to Event Grid triggers a function that generates the new password, updates the database and stores the new version."
    fr: "Une stratégie de rotation de clé fait générer par Key Vault de nouvelles versions d'une clé à intervalle défini, ce qui convient aux clés gérées par le client. Un certificat est renouvelé par Key Vault lui-même lorsque sa stratégie référence une autorité de certification intégrée, telle que DigiCert ou GlobalSign, et comporte une action de renouvellement automatique. Key Vault ne modifie pas la valeur d'un secret : l'événement d'expiration proche envoyé à Event Grid déclenche une fonction qui génère le nouveau mot de passe, met à jour la base de données et stocke la nouvelle version."
  options:
    lm:
      en: "Lifecycle management moves or deletes blobs according to their age; it has nothing to do with the objects of a key vault."
      fr: "La gestion du cycle de vie déplace ou supprime des blobs selon leur âge ; elle n'a aucun rapport avec les objets d'un coffre de clés."
references:
  - title: Understanding autorotation in Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/key-vault/general/autorotation
  - title: About Azure Key Vault certificates
    url: https://learn.microsoft.com/en-us/azure/key-vault/certificates/about-certificates
