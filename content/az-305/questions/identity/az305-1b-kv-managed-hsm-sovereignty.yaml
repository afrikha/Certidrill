id: az305-1b-kv-managed-hsm-sovereignty
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank encrypts Azure Storage accounts and Azure SQL databases with customer-managed keys. The regulator of the bank imposes the following requirements on the service that holds the keys:

    - The keys reside in a single-tenant HSM that is dedicated to the bank, and the bank controls the root of trust.
    - The administrators of the subscription or of the management groups can't give themselves access to the keys.
    - Microsoft manages the provisioning, the patching and the availability of the service.
    - The service integrates with Azure Storage and Azure SQL for customer-managed keys.

    What should you recommend?
  fr: |
    Woodgrove Bank chiffre des comptes Stockage Azure et des bases de données Azure SQL avec des clés gérées par le client. Le régulateur de la banque impose les exigences suivantes au service qui détient les clés :

    - Les clés résident dans un HSM à locataire unique dédié à la banque, et la banque contrôle la racine de confiance.
    - Les administrateurs de l'abonnement ou des groupes d'administration ne peuvent pas s'accorder l'accès aux clés.
    - Microsoft gère le provisionnement, les correctifs et la disponibilité du service.
    - Le service s'intègre à Stockage Azure et à Azure SQL pour les clés gérées par le client.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: Azure Key Vault Managed HSM }
    - { id: b, text: Azure Key Vault Premium }
    - { id: c, text: Azure Cloud HSM }
    - { id: d, text: Azure Payment HSM }
answer: { optionId: a }
explanation:
  correct:
    en: "Managed HSM is a fully managed, single-tenant service: each instance is dedicated to one customer and isolated by a security domain that the customer controls. Its local RBAC model can't be overridden by administrators of the subscription or of the management groups, and its keys can be used as customer-managed keys by services such as Azure Storage and Azure SQL."
    fr: "Le HSM managé est un service entièrement managé à locataire unique : chaque instance est dédiée à un client et isolée par un domaine de sécurité que le client contrôle. Son modèle RBAC local ne peut pas être contourné par les administrateurs de l'abonnement ou des groupes d'administration, et ses clés peuvent servir de clés gérées par le client pour des services tels que Stockage Azure et Azure SQL."
  options:
    b:
      en: "Key Vault Premium protects keys in HSMs, but it is a multitenant service without dedicated capacity or customer control of the root of trust."
      fr: "Key Vault Premium protège les clés dans des HSM, mais c'est un service multilocataire, sans capacité dédiée ni contrôle de la racine de confiance par le client."
    c:
      en: "Azure Cloud HSM is single-tenant, but it doesn't integrate with Azure platform services for customer-managed keys."
      fr: "Azure Cloud HSM est à locataire unique, mais il ne s'intègre pas aux services de plateforme Azure pour les clés gérées par le client."
    d:
      en: "Azure Payment HSM is meant for payment PIN processing, not for the encryption at rest of Azure services."
      fr: "Azure Payment HSM est destiné au traitement des codes PIN de paiement, pas au chiffrement au repos des services Azure."
references:
  - title: What is Azure Key Vault Managed HSM?
    url: https://learn.microsoft.com/en-us/azure/key-vault/managed-hsm/overview
  - title: How to choose the right Azure key management solution
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/key-management-choose
