id: az305-1b-idm-b2b-yn
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft Entra tenant for its employees. Contoso starts a joint project with Fabrikam, Inc., which has its own Microsoft Entra tenant. You evaluate B2B collaboration and B2B direct connect to give the Fabrikam users access to Contoso resources.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un locataire Microsoft Entra pour ses employés. Contoso lance un projet commun avec Fabrikam, Inc., qui possède son propre locataire Microsoft Entra. Vous évaluez la collaboration B2B et la connexion directe B2B pour donner aux utilisateurs de Fabrikam l'accès à des ressources de Contoso.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: With B2B collaboration, a Fabrikam user is represented by a user object in the Contoso tenant.
        fr: Avec la collaboration B2B, un utilisateur de Fabrikam est représenté par un objet utilisateur dans le locataire Contoso.
    - id: s2
      text:
        en: With B2B direct connect, a Fabrikam user can be assigned an Azure role on a Contoso subscription.
        fr: Avec la connexion directe B2B, un utilisateur de Fabrikam peut recevoir un rôle Azure sur un abonnement de Contoso.
    - id: s3
      text:
        en: B2B direct connect works only after both Contoso and Fabrikam have enabled it in their cross-tenant access settings.
        fr: La connexion directe B2B ne fonctionne qu'une fois activée par Contoso et par Fabrikam dans leurs paramètres d'accès interlocataire.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "B2B collaboration creates a user object, usually a guest, in the workforce tenant of the inviting organization; it can be added to groups and given roles. B2B direct connect creates no user object in the resource tenant and currently serves Teams shared channels only, so there is nothing to assign an Azure role to. It is blocked by default and is a mutual trust: the resource organization allows inbound access and the external organization allows outbound access."
    fr: "La collaboration B2B crée un objet utilisateur, en général un invité, dans le locataire de personnel de l'organisation qui invite ; il peut être ajouté à des groupes et recevoir des rôles. La connexion directe B2B ne crée aucun objet utilisateur dans le locataire de ressources et ne sert actuellement qu'aux canaux partagés de Teams : il n'y a donc rien à quoi attribuer un rôle Azure. Elle est bloquée par défaut et repose sur une approbation mutuelle : l'organisation de ressources autorise l'accès entrant et l'organisation externe autorise l'accès sortant."
references:
  - title: B2B direct connect overview
    url: https://learn.microsoft.com/en-us/entra/external-id/b2b-direct-connect-overview
  - title: Introduction to Microsoft Entra External ID
    url: https://learn.microsoft.com/en-us/entra/external-id/external-identities-overview
