id: az305-cs4a-resource-organization
objective: "1.3.1"
type: dragdrop
caseStudy: az305-cs4a-relecloud
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend how Relecloud organizes its Azure resources. The solution must meet the governance requirements.

    What should you recommend for each requirement? To answer, drag the appropriate elements to the correct requirements. Each element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander la façon dont Relecloud organise ses ressources Azure. La solution doit respecter les exigences de gouvernance.

    Que devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les éléments appropriés vers les exigences correspondantes. Chaque élément peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mg, text: { en: "A management group", fr: "Un groupe d'administration" } }
    - { id: rg, text: { en: "A resource group", fr: "Un groupe de ressources" } }
    - { id: tag, text: { en: "A resource tag", fr: "Une étiquette de ressource" } }
    - { id: policy, text: { en: "An Azure Policy assignment", fr: "Une attribution Azure Policy" } }
    - { id: lock, text: { en: "A resource lock", fr: "Un verrou de ressource" } }
    - { id: sub, text: { en: "An additional subscription", fr: "Un abonnement supplémentaire" } }
  targets:
    - id: scope
      text:
        en: Receive once the policy assignments and the role assignments that apply to the existing and future production subscriptions
        fr: Recevoir une seule fois les attributions de stratégies et de rôles qui s'appliquent aux abonnements de production existants et futurs
    - id: cost
      text:
        en: Report the costs of each PayCloud component across resource groups and subscriptions
        fr: Établir les coûts de chaque composant de PayCloud à travers les groupes de ressources et les abonnements
    - id: inherit
      text:
        en: Copy the Environment tag of a subscription to every resource that is deployed in it, without any action from the deployer
        fr: Copier l'étiquette Environment d'un abonnement sur chaque ressource qui y est déployée, sans aucune action de la personne qui déploie
    - id: unit
      text:
        en: Manage as one unit the resources that are deployed, updated and deleted together
        fr: Gérer comme une seule unité les ressources qui sont déployées, mises à jour et supprimées ensemble
answer:
  mapping: { scope: mg, cost: tag, inherit: policy, unit: rg }
explanation:
  correct:
    en: |
      A management group sits above subscriptions: a policy or role assignment made on it is inherited by every subscription placed under it, now or later. A tag is a name-value pair attached to each resource, so cost reports can be grouped by component whatever the resource group or the subscription. To apply a tag automatically, assign an Azure Policy definition with the modify effect: the built-in definition Inherit a tag from the subscription adds the tag and its value when a resource is created or updated. A resource group is the container for resources that share the same life cycle.
    fr: |
      Un groupe d'administration se place au-dessus des abonnements : une attribution de stratégie ou de rôle faite à ce niveau est héritée par tous les abonnements placés en dessous, maintenant ou plus tard. Une étiquette est une paire nom-valeur attachée à chaque ressource : les rapports de coûts peuvent donc être regroupés par composant quels que soient le groupe de ressources et l'abonnement. Pour appliquer une étiquette automatiquement, attribuez une définition Azure Policy dotée de l'effet modify : la définition intégrée Inherit a tag from the subscription ajoute l'étiquette et sa valeur quand une ressource est créée ou mise à jour. Un groupe de ressources est le conteneur des ressources qui partagent le même cycle de vie.
  options:
    lock:
      en: "A resource lock only prevents the deletion or the modification of resources. It organizes nothing and applies no tag."
      fr: "Un verrou de ressource empêche seulement la suppression ou la modification de ressources. Il n'organise rien et n'applique aucune étiquette."
    sub:
      en: "A subscription is a billing and access boundary, but a new subscription neither groups the existing ones nor follows a component that spans several subscriptions."
      fr: "Un abonnement est une limite de facturation et d'accès, mais un nouvel abonnement ne regroupe pas les abonnements existants et ne suit pas un composant réparti entre plusieurs abonnements."
references:
  - title: Organize your Azure resources effectively
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/azure-setup-guide/organize-resources
  - title: Assign policy definitions for tag compliance
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-policies
