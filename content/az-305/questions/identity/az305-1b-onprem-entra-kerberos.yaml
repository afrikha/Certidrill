id: az305-1b-onprem-entra-kerberos
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders deploys Microsoft Entra joined Windows 11 laptops. Users sign in to the laptops with FIDO2 security keys. The file servers and the intranet applications of the datacenter use Kerberos in an Active Directory Domain Services (AD DS) forest whose domain controllers run Windows Server 2022. The users are synchronized to Microsoft Entra ID.

    You need to recommend a solution that meets the following requirements:

    - On the corporate network, users get single sign-on to the file servers and the Kerberos applications without typing a password.
    - Authorization still relies on the AD DS groups.
    - No federation server and no certificate on the devices are required.

    What should you recommend?
  fr: |
    Northwind Traders déploie des ordinateurs portables Windows 11 joints à Microsoft Entra. Les utilisateurs se connectent aux ordinateurs avec des clés de sécurité FIDO2. Les serveurs de fichiers et les applications intranet du centre de données utilisent Kerberos dans une forêt Active Directory Domain Services (AD DS) dont les contrôleurs de domaine exécutent Windows Server 2022. Les utilisateurs sont synchronisés vers Microsoft Entra ID.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Sur le réseau de l'entreprise, les utilisateurs bénéficient de l'authentification unique auprès des serveurs de fichiers et des applications Kerberos, sans saisir de mot de passe.
    - L'autorisation repose toujours sur les groupes AD DS.
    - Aucun serveur de fédération ni aucun certificat sur les appareils ne sont nécessaires.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Seamless single sign-on", fr: "L'authentification unique transparente" }
    - id: b
      text: { en: "Pass-through authentication", fr: "L'authentification directe" }
    - id: c
      text: Microsoft Entra Domain Services
    - id: d
      text: Microsoft Entra Kerberos
answer: { optionId: d }
explanation:
  correct:
    en: "With Microsoft Entra Kerberos, a Kerberos server object is created in the AD DS domain and published to Microsoft Entra ID. When a user signs in with a security key, Microsoft Entra ID returns a partial ticket-granting ticket that the device exchanges for a full one with an on-premises domain controller. Service tickets and authorization are still handled by AD DS."
    fr: "Avec Microsoft Entra Kerberos, un objet serveur Kerberos est créé dans le domaine AD DS et publié dans Microsoft Entra ID. Lorsqu'un utilisateur se connecte avec une clé de sécurité, Microsoft Entra ID renvoie un ticket TGT partiel que l'appareil échange contre un ticket complet auprès d'un contrôleur de domaine local. Les tickets de service et l'autorisation restent traités par AD DS."
  options:
    a:
      en: "Seamless single sign-on signs users of domain-joined devices in to cloud applications; it doesn't give Microsoft Entra joined devices Kerberos tickets for on-premises resources."
      fr: "L'authentification unique transparente connecte aux applications cloud les utilisateurs d'appareils joints à un domaine ; elle ne donne pas aux appareils joints à Microsoft Entra des tickets Kerberos pour les ressources locales."
    b:
      en: "Pass-through authentication validates passwords against AD DS for cloud sign-ins. It isn't involved in a passwordless sign-in and issues no Kerberos ticket."
      fr: "L'authentification directe valide des mots de passe auprès d'AD DS pour les connexions au cloud. Elle n'intervient pas dans une connexion sans mot de passe et n'émet aucun ticket Kerberos."
    c:
      en: "Domain Services is a separate managed domain in Azure; it doesn't authenticate users to the servers of the on-premises forest."
      fr: "Domain Services est un domaine managé distinct dans Azure ; il n'authentifie pas les utilisateurs auprès des serveurs de la forêt locale."
references:
  - title: Enable passwordless security key sign-in to on-premises resources by using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/howto-authentication-passwordless-security-key-on-premises
