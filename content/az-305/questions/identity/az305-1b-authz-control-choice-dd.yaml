id: az305-1b-authz-control-choice-dd
objective: "1.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. defines the controls of its Azure landing zones. You need to recommend the type of control that meets each of the following requirements:

    - **Requirement 1:** Nobody, whatever their role, creates resources outside the West Europe and North Europe regions.
    - **Requirement 2:** Nobody, Owners included, can delete the production ExpressRoute circuit until a protection that is set on the circuit itself has been removed.
    - **Requirement 3:** The network team manages the virtual networks of every subscription, and nothing else.

    What should you recommend for each requirement? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. définit les contrôles de ses zones d'atterrissage Azure. Vous devez recommander le type de contrôle qui répond à chacune des exigences suivantes :

    - **Exigence 1 :** personne, quel que soit son rôle, ne crée de ressources en dehors des régions West Europe et North Europe.
    - **Exigence 2 :** personne, pas même un titulaire du rôle Owner, ne peut supprimer le circuit ExpressRoute de production tant qu'une protection placée sur le circuit lui-même n'a pas été retirée.
    - **Exigence 3 :** l'équipe réseau gère les réseaux virtuels de tous les abonnements, et rien d'autre.

    Que devez-vous recommander pour chaque exigence ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Requirement 1: [[c1]]

      Requirement 2: [[c2]]

      Requirement 3: [[c3]]
    fr: |
      Exigence 1 : [[c1]]

      Exigence 2 : [[c2]]

      Exigence 3 : [[c3]]
  slots:
    - id: c1
      options:
        - { id: rbac, text: { en: "An Azure role assignment", fr: "Une attribution de rôle Azure" } }
        - { id: pol, text: { en: "An Azure Policy assignment", fr: "Une attribution Azure Policy" } }
        - { id: lock, text: { en: "A resource lock", fr: "Un verrou de ressource" } }
        - { id: ca, text: { en: "A Conditional Access policy", fr: "Une stratégie d'accès conditionnel" } }
    - id: c2
      options:
        - { id: rbac, text: { en: "An Azure role assignment", fr: "Une attribution de rôle Azure" } }
        - { id: pol, text: { en: "An Azure Policy assignment", fr: "Une attribution Azure Policy" } }
        - { id: lock, text: { en: "A resource lock", fr: "Un verrou de ressource" } }
        - { id: ca, text: { en: "A Conditional Access policy", fr: "Une stratégie d'accès conditionnel" } }
    - id: c3
      options:
        - { id: rbac, text: { en: "An Azure role assignment", fr: "Une attribution de rôle Azure" } }
        - { id: pol, text: { en: "An Azure Policy assignment", fr: "Une attribution Azure Policy" } }
        - { id: lock, text: { en: "A resource lock", fr: "Un verrou de ressource" } }
        - { id: ca, text: { en: "A Conditional Access policy", fr: "Une stratégie d'accès conditionnel" } }
answer:
  values: { c1: pol, c2: lock, c3: rbac }
explanation:
  correct:
    en: "Azure Policy controls what can be deployed (for example the allowed regions) whoever the user is, even an Owner. A resource lock protects a resource from deletion by everyone, Owners included, until the lock is removed. Azure RBAC decides who can do what: a role such as Network Contributor, assigned to the network team at a management group, lets it manage networks only."
    fr: "Azure Policy contrôle ce qui peut être déployé (par exemple les régions autorisées) quel que soit l'utilisateur, même un Owner. Un verrou de ressource protège une ressource contre la suppression par quiconque, Owner compris, tant que le verrou n'est pas retiré. Azure RBAC décide de qui peut faire quoi : un rôle tel que Network Contributor, attribué à l'équipe réseau au niveau d'un groupe d'administration, lui permet de ne gérer que les réseaux."
  options:
    ca:
      en: "Conditional Access controls the conditions of sign-in to applications; it doesn't decide what can be done on an Azure resource."
      fr: "L'accès conditionnel contrôle les conditions de connexion aux applications ; il ne décide pas de ce qui peut être fait sur une ressource Azure."
references:
  - title: What is Azure role-based access control (Azure RBAC)?
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
  - title: Best practices for Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/best-practices
