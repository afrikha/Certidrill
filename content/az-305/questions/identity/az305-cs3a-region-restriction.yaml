id: az305-cs3a-region-restriction
objective: "1.3.2"
type: single
caseStudy: az305-cs3a-vanarsdel
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a solution that enforces the regions in which Azure resources can be created. The solution must meet the business requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution qui impose les régions dans lesquelles les ressources Azure peuvent être créées. La solution doit satisfaire les exigences métier.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An assignment of the Allowed locations policy at the Tenant Root Group", fr: "Une attribution de la stratégie Allowed locations sur le groupe Tenant Root Group" } }
    - { id: b, text: { en: "An assignment of the Allowed locations policy on each subscription", fr: "Une attribution de la stratégie Allowed locations sur chaque abonnement" } }
    - { id: c, text: { en: "An assignment of a custom Azure RBAC role at the Tenant Root Group", fr: "Une attribution d'un rôle RBAC Azure personnalisé sur le groupe Tenant Root Group" } }
    - { id: d, text: { en: "A ReadOnly resource lock on each subscription", fr: "Un verrou de ressource ReadOnly sur chaque abonnement" } }
answer: { optionId: a }
explanation:
  correct:
    en: "The built-in Allowed locations policy denies the creation of resources outside the listed regions, whoever makes the request. An assignment on a management group is inherited by all the subscriptions under it, and new subscriptions of VanArsdel land in the Tenant Root Group by default, so one assignment covers existing and future subscriptions. A subscription owner can't alter an assignment made above the subscription."
    fr: "La stratégie intégrée Allowed locations refuse la création de ressources hors des régions indiquées, quel que soit l'auteur de la demande. Une attribution sur un groupe d'administration est héritée par tous les abonnements situés en dessous, et les nouveaux abonnements de VanArsdel arrivent par défaut dans le groupe Tenant Root Group : une seule attribution couvre donc les abonnements existants et futurs. Un propriétaire d'abonnement ne peut pas modifier une attribution faite au-dessus de l'abonnement."
  options:
    b:
      en: "An assignment per subscription must be repeated for each new subscription, and the owner of a subscription can remove an assignment made at that scope."
      fr: "Une attribution par abonnement doit être répétée pour chaque nouvel abonnement, et le propriétaire d'un abonnement peut supprimer une attribution faite à cette étendue."
    c:
      en: "Azure RBAC decides which actions a user can perform at a scope. A role definition can't restrict the region of the resources that are created."
      fr: "Le RBAC Azure décide des actions qu'un utilisateur peut effectuer à une étendue. Une définition de rôle ne peut pas restreindre la région des ressources créées."
    d:
      en: "A ReadOnly lock blocks every creation and change in the subscription, in the allowed regions too."
      fr: "Un verrou ReadOnly bloque toute création et toute modification dans l'abonnement, y compris dans les régions autorisées."
references:
  - title: What is Azure Policy?
    url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
