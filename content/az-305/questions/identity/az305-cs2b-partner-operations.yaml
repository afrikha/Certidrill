id: az305-cs2b-partner-operations
objective: "1.2.3"
type: single
caseStudy: az305-cs2b-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend how the Fabrikam engineers are authorized to manage the resource groups of TrackHub. The solution must meet the operations requirements.

    What should you recommend?
  fr: |
    Vous devez recommander la façon dont les ingénieurs de Fabrikam sont autorisés à gérer les groupes de ressources de TrackHub. La solution doit respecter les exigences relatives à l'exploitation.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "B2B collaboration guest accounts with eligible role assignments in Privileged Identity Management", fr: "Des comptes invités de collaboration B2B avec des attributions de rôles éligibles dans Privileged Identity Management" } }
    - { id: b, text: { en: "Cross-tenant synchronization of the Fabrikam engineers to the tenant of Wide World Importers", fr: "La synchronisation interlocataire des ingénieurs de Fabrikam vers le locataire de Wide World Importers" } }
    - { id: c, text: { en: "A multitenant app registration whose credentials are given to Fabrikam", fr: "Une inscription d'application multilocataire dont les informations d'identification sont remises à Fabrikam" } }
    - { id: d, text: { en: "Azure Lighthouse delegation of the resource groups to the tenant of Fabrikam", fr: "La délégation Azure Lighthouse des groupes de ressources au locataire de Fabrikam" } }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Azure Lighthouse delegates subscriptions or resource groups to another tenant: users and groups of the Fabrikam tenant receive Azure roles on the delegated resource groups and work from their own tenant with their own accounts, so the customer creates no account for them. The customer sees the delegation, the activity log records the operations of the provider's users, and the customer can remove the delegation at any time. Azure Lighthouse has no additional cost.
    fr: |-
      Azure Lighthouse délègue des abonnements ou des groupes de ressources à un autre locataire : des utilisateurs et des groupes du locataire de Fabrikam reçoivent des rôles Azure sur les groupes de ressources délégués et travaillent depuis leur propre locataire avec leurs propres comptes ; le client ne crée donc aucun compte pour eux. Le client voit la délégation, le journal d'activité enregistre les opérations des utilisateurs du fournisseur, et le client peut retirer la délégation à tout moment. Azure Lighthouse n'entraîne aucun coût supplémentaire.
  options:
    a: { en: "Guest accounts are what Wide World Importers has today: they still have to be created and maintained, whatever the way roles are activated.", fr: "Les comptes invités sont ce que Wide World Importers a aujourd'hui : ils doivent toujours être créés et maintenus, quelle que soit la façon dont les rôles sont activés." }
    b: { en: "Cross-tenant synchronization is meant for the tenants of one organization and still creates user objects in the target tenant.", fr: "La synchronisation interlocataire est destinée aux locataires d'une même organisation et crée tout de même des objets utilisateur dans le locataire cible." }
    c: { en: "A shared application identity hides which engineer performed an operation and adds a credential to protect.", fr: "Une identité d'application partagée masque l'ingénieur qui a effectué une opération et ajoute une information d'identification à protéger." }
references:
  - title: What is Azure Lighthouse?
    url: https://learn.microsoft.com/en-us/azure/lighthouse/overview
