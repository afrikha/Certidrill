id: az305-1a-mon-availability-smart
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a public web app that is instrumented with Application Insights.

    You need to recommend a monitoring solution that meets the following requirements:

    - The home page must be tested from several locations around the world, and the team must be warned before the TLS certificate of the site expires.
    - The team must be notified of an abnormal rise in the rate of failed requests, without having to define a threshold.

    Which two features should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'une application web publique instrumentée avec Application Insights.

    Vous devez recommander une solution de monitoring qui répond aux exigences suivantes :

    - La page d'accueil doit être testée depuis plusieurs emplacements dans le monde, et l'équipe doit être avertie avant l'expiration du certificat TLS du site.
    - L'équipe doit être notifiée d'une hausse anormale du taux de requêtes en échec, sans avoir à définir de seuil.

    Quelles sont les deux fonctionnalités à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "A URL ping test"
        fr: "Un test ping d'URL"
    - id: b
      text:
        en: "A standard availability test"
        fr: "Un test de disponibilité standard"
    - id: c
      text:
        en: "A connection monitor in Network Watcher"
        fr: "Un moniteur de connexion dans Network Watcher"
    - id: d
      text:
        en: "A Resource Health alert rule"
        fr: "Une règle d'alerte Resource Health"
    - id: e
      text:
        en: "Smart detection"
        fr: "La détection intelligente"
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      A standard availability test sends requests to a URL from the test locations you select, checks the response, and can also verify the validity of the TLS certificate and fail when the certificate is close to expiring. Smart detection applies machine learning to the Application Insights telemetry and detects an abnormal rise in the failure rate without any threshold to configure.
    fr: |
      Un test de disponibilité standard envoie des requêtes à une URL depuis les emplacements de test choisis, vérifie la réponse, et peut aussi contrôler la validité du certificat TLS et échouer quand le certificat approche de son expiration. La détection intelligente applique l'apprentissage automatique à la télémétrie Application Insights et détecte une hausse anormale du taux d'échecs sans seuil à configurer.
  options:
    a:
      en: "The URL ping test is deprecated and replaced by the standard test, which adds the checks on the TLS certificate."
      fr: "Le test ping d'URL est déconseillé et remplacé par le test standard, qui ajoute les contrôles sur le certificat TLS."
    c:
      en: "Connection monitor measures connectivity, packet loss and latency from your own virtual machines or Arc-enabled hosts, not from test locations around the world, and it doesn't check certificates."
      fr: "Le moniteur de connexion mesure la connectivité, la perte de paquets et la latence depuis vos propres machines virtuelles ou hôtes avec Azure Arc, pas depuis des emplacements de test dans le monde, et il ne contrôle pas les certificats."
    d:
      en: "Resource Health tells whether the Azure resource is healthy from the platform's point of view; it doesn't analyze failed requests or certificates."
      fr: "Resource Health indique si la ressource Azure est saine du point de vue de la plateforme ; il n'analyse ni les requêtes en échec ni les certificats."
references:
  - title: Application Insights availability tests
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/app/availability-overview
  - title: Choose the right type of alert rule
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
