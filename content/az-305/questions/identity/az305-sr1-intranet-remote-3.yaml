stem:
  en: You recommend Microsoft Entra application proxy with Passthrough pre-authentication.
  fr: Vous recommandez le proxy d'application Microsoft Entra avec la préauthentification Passthrough.
body:
  solution:
    en: |
      You recommend publishing App1 by using **Microsoft Entra application proxy**. A private network connector is installed on a server in the datacenter, and the pre-authentication method of the application is set to **Passthrough**, so that App1 authenticates the users itself.
    fr: |
      Vous recommandez de publier App1 à l'aide du **proxy d'application Microsoft Entra**. Un connecteur de réseau privé est installé sur un serveur du centre de données, et la méthode de préauthentification de l'application est définie sur **Passthrough**, de sorte qu'App1 authentifie elle-même les utilisateurs.
answer: { value: false }
explanation:
  correct:
    en: |
      The connector still uses outbound connections only and no VPN client is needed, but Passthrough removes the Microsoft Entra sign-in in front of the application. Requests are forwarded to the datacenter without a Microsoft Entra token, so the Conditional Access policy and its MFA requirement are not evaluated before traffic reaches the on-premises network. Only Microsoft Entra ID pre-authentication guarantees that authenticated connections alone reach the network.
    fr: |
      Le connecteur n'utilise toujours que des connexions sortantes et aucun client VPN n'est nécessaire, mais Passthrough supprime la connexion Microsoft Entra en amont de l'application. Les requêtes sont transmises au centre de données sans jeton Microsoft Entra : la stratégie d'accès conditionnel et son exigence de MFA ne sont donc pas évaluées avant que le trafic n'atteigne le réseau local. Seule la préauthentification Microsoft Entra ID garantit que seules les connexions authentifiées atteignent le réseau.
references:
  - title: Security considerations for accessing apps remotely with Microsoft Entra application proxy
    url: https://learn.microsoft.com/en-us/entra/identity/app-proxy/application-proxy-security
