id: az305-1a-log-workspace-residency
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a single Microsoft Entra tenant and Azure resources in the West Europe and East US regions.

    You need to recommend a Log Analytics workspace design that meets the following requirements:

    - The logs of the resources located in West Europe must be stored in the European Union for regulatory reasons.
    - No regulation applies to the logs of the resources located in East US.
    - The security team uses Microsoft Sentinel and Microsoft Defender for Cloud, and doesn't require security data to be separated from operational data.
    - Each application team must be able to query the logs of its own resources only.
    - The number of workspaces must be minimized.

    What should you recommend?
  fr: |
    Fabrikam dispose d'un seul locataire Microsoft Entra et de ressources Azure dans les régions Europe Ouest et USA Est.

    Vous devez recommander une conception d'espaces de travail Log Analytics qui répond aux exigences suivantes :

    - Les journaux des ressources situées en Europe Ouest doivent être stockés dans l'Union européenne pour des raisons réglementaires.
    - Aucune réglementation ne s'applique aux journaux des ressources situées dans la région USA Est.
    - L'équipe de sécurité utilise Microsoft Sentinel et Microsoft Defender pour le cloud, et n'exige pas que les données de sécurité soient séparées des données opérationnelles.
    - Chaque équipe applicative doit pouvoir interroger uniquement les journaux de ses propres ressources.
    - Le nombre d'espaces de travail doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "One workspace in East US"
        fr: "Un espace de travail dans la région USA Est"
    - id: b
      text:
        en: "Two workspaces: one in West Europe and one in East US"
        fr: "Deux espaces de travail : un en Europe Ouest et un dans la région USA Est"
    - id: c
      text:
        en: "One workspace in West Europe"
        fr: "Un espace de travail en Europe Ouest"
    - id: d
      text:
        en: "Three workspaces: one in each region and one dedicated to Microsoft Sentinel"
        fr: "Trois espaces de travail : un dans chaque région et un dédié à Microsoft Sentinel"
answer: { optionId: c }
explanation:
  correct:
    en: |
      A workspace accepts data from resources in any region, so a single workspace in West Europe keeps the European logs in the European Union and can also receive the East US logs, which no regulation constrains. Resource-context access lets each team query only the logs of the resources it can read, and Microsoft Sentinel and Defender for Cloud should share the same workspace when the security team doesn't ask for separation. One workspace is therefore enough.
    fr: |
      Un espace de travail accepte les données de ressources de n'importe quelle région : un seul espace de travail en Europe Ouest conserve les journaux européens dans l'Union européenne et peut aussi recevoir les journaux de la région USA Est, qu'aucune réglementation ne contraint. L'accès en contexte de ressource permet à chaque équipe d'interroger uniquement les journaux des ressources qu'elle peut lire, et Microsoft Sentinel et Defender pour le cloud doivent partager le même espace de travail quand l'équipe de sécurité ne demande pas de séparation. Un seul espace de travail suffit donc.
  options:
    a:
      en: "The logs of the West Europe resources would be stored in the United States, which breaks the regulatory requirement."
      fr: "Les journaux des ressources d'Europe Ouest seraient stockés aux États-Unis, ce qui enfreint l'exigence réglementaire."
    b:
      en: "It meets the residency requirement but uses a second workspace that no requirement justifies: only the European logs are bound to a geography."
      fr: "Cette option respecte l'exigence de résidence, mais utilise un second espace de travail qu'aucune exigence ne justifie : seuls les journaux européens sont liés à une zone géographique."
    d:
      en: "Splitting by region and isolating Microsoft Sentinel triples the number of workspaces although neither access control nor the security team requires it."
      fr: "Diviser par région et isoler Microsoft Sentinel triple le nombre d'espaces de travail alors que ni le contrôle d'accès ni l'équipe de sécurité ne l'exigent."
references:
  - title: Design a Log Analytics workspace architecture
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/workspace-design
  - title: Manage access to Log Analytics workspaces
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/manage-access
