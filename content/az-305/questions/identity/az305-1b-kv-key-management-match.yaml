id: az305-1b-kv-key-management-match
objective: "1.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. has three workloads that need a key management service in Azure.

    Which service should you recommend for each workload? To answer, drag the appropriate services to the correct workloads. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. a trois charges de travail qui ont besoin d'un service de gestion de clés dans Azure.

    Quel service devez-vous recommander pour chaque charge de travail ? Pour répondre, faites glisser les services appropriés vers les charges de travail correspondantes. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: std, text: Azure Key Vault Standard }
    - { id: prem, text: Azure Key Vault Premium }
    - { id: mhsm, text: Azure Key Vault Managed HSM }
    - { id: chsm, text: Azure Cloud HSM }
    - { id: phsm, text: Azure Payment HSM }
  targets:
    - id: t1
      text: { en: "A prototype that stores secrets and certificates at the lowest cost, with no HSM requirement", fr: "Un prototype qui stocke des secrets et des certificats au coût le plus bas, sans exigence de HSM" }
    - id: t2
      text: { en: "An application moved from a datacenter to Azure virtual machines, which calls its HSM through PKCS#11", fr: "Une application déplacée d'un centre de données vers des machines virtuelles Azure, qui appelle son HSM par PKCS#11" }
    - id: t3
      text: { en: "The processing of payment card PINs", fr: "Le traitement des codes PIN de cartes de paiement" }
answer:
  mapping: { t1: std, t2: chsm, t3: phsm }
explanation:
  correct:
    en: "Key Vault Standard is the lowest-cost option: it stores keys, secrets and certificates with software protection. Azure Cloud HSM is the option with full native support for PKCS#11 (and JCA/JCE, CNG/KSP), intended for applications that are lifted and shifted to Azure virtual machines. Payment PIN processing is supported only by Azure Payment HSM."
    fr: "Key Vault Standard est l'option la moins coûteuse : il stocke des clés, des secrets et des certificats avec une protection logicielle. Azure Cloud HSM est l'option qui prend entièrement en charge PKCS#11 (ainsi que JCA/JCE et CNG/KSP) de manière native, et vise les applications déplacées telles quelles vers des machines virtuelles Azure. Le traitement des codes PIN de paiement n'est pris en charge que par Azure Payment HSM."
  options:
    prem:
      en: "Key Vault Premium adds HSM-protected keys, which the prototype doesn't need, at a higher cost."
      fr: "Key Vault Premium ajoute des clés protégées par HSM, dont le prototype n'a pas besoin, pour un coût plus élevé."
    mhsm:
      en: "Managed HSM stores keys only and offers limited PKCS#11 support, for TLS offload; it is the choice for key sovereignty with Azure services."
      fr: "Le HSM managé ne stocke que des clés et n'offre qu'une prise en charge limitée de PKCS#11, pour le déchargement TLS ; c'est le choix de la souveraineté des clés avec les services Azure."
references:
  - title: How to choose the right Azure key management solution
    url: https://learn.microsoft.com/en-us/azure/security/fundamentals/key-management-choose
