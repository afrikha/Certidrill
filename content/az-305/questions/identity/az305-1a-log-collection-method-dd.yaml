id: az305-1a-log-collection-method-dd
objective: "1.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is moving an application to Azure. The application consists of a .NET web API hosted in Azure App Service, Linux virtual machines and an Azure Firewall instance.

    All the logs must be stored in a Log Analytics workspace.

    You need to recommend how to collect each type of data.

    What should you recommend for each type of data? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank migre une application vers Azure. L'application se compose d'une API web .NET hébergée dans Azure App Service, de machines virtuelles Linux et d'une instance du Pare-feu Azure.

    Tous les journaux doivent être stockés dans un espace de travail Log Analytics.

    Vous devez recommander la manière de collecter chaque type de données.

    Que devez-vous recommander pour chaque type de données ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Syslog events of the Linux virtual machines: [[vm]]

      Requests, dependencies and exceptions of the web API: [[app]]

      Rule hits of Azure Firewall: [[fw]]
    fr: |
      Événements Syslog des machines virtuelles Linux : [[vm]]

      Requêtes, dépendances et exceptions de l'API web : [[app]]

      Correspondances de règles du Pare-feu Azure : [[fw]]
  slots:
    - id: vm
      options:
        - { id: ama, text: { en: "The Azure Monitor Agent and a data collection rule", fr: "L'agent Azure Monitor et une règle de collecte de données" } }
        - { id: appi, text: { en: "Application Insights instrumentation", fr: "L'instrumentation Application Insights" } }
        - { id: diag, text: { en: "A diagnostic setting", fr: "Un paramètre de diagnostic" } }
        - { id: actlog, text: { en: "The activity log of the subscription", fr: "Le journal d'activité de l'abonnement" } }
    - id: app
      options:
        - { id: ama, text: { en: "The Azure Monitor Agent and a data collection rule", fr: "L'agent Azure Monitor et une règle de collecte de données" } }
        - { id: appi, text: { en: "Application Insights instrumentation", fr: "L'instrumentation Application Insights" } }
        - { id: diag, text: { en: "A diagnostic setting", fr: "Un paramètre de diagnostic" } }
        - { id: actlog, text: { en: "The activity log of the subscription", fr: "Le journal d'activité de l'abonnement" } }
    - id: fw
      options:
        - { id: ama, text: { en: "The Azure Monitor Agent and a data collection rule", fr: "L'agent Azure Monitor et une règle de collecte de données" } }
        - { id: appi, text: { en: "Application Insights instrumentation", fr: "L'instrumentation Application Insights" } }
        - { id: diag, text: { en: "A diagnostic setting", fr: "Un paramètre de diagnostic" } }
        - { id: actlog, text: { en: "The activity log of the subscription", fr: "Le journal d'activité de l'abonnement" } }
answer:
  values: { vm: ama, app: appi, fw: diag }
explanation:
  correct:
    en: |
      Guest operating system data such as Syslog is collected by the Azure Monitor Agent according to a data collection rule. Requests, dependencies and exceptions are application telemetry, produced by Application Insights instrumentation and stored in a workspace. Rule hits are resource logs of Azure Firewall, which are collected only when a diagnostic setting sends them to a destination.
    fr: |
      Les données du système d'exploitation invité, comme Syslog, sont collectées par l'agent Azure Monitor selon une règle de collecte de données. Les requêtes, les dépendances et les exceptions constituent la télémétrie applicative, produite par l'instrumentation Application Insights et stockée dans un espace de travail. Les correspondances de règles sont des journaux de ressources du Pare-feu Azure, collectés uniquement quand un paramètre de diagnostic les envoie vers une destination.
  options:
    actlog:
      en: "The activity log holds control plane operations on the subscription; it contains neither guest events, nor application telemetry, nor firewall traffic."
      fr: "Le journal d'activité contient les opérations du plan de contrôle de l'abonnement ; il ne contient ni les événements de l'invité, ni la télémétrie applicative, ni le trafic du pare-feu."
references:
  - title: Azure Monitor data sources and data collection methods
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/data-sources
