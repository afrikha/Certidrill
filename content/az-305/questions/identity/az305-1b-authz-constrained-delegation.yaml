id: az305-1b-authz-constrained-delegation
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has a subscription named **Sub1** that contains a resource group named **RG-App1**. The resources of RG-App1 are operated by an application team. The platform team wants the lead of the application team, **Lead1**, to manage the access of the team members.

    You need to recommend a role for Lead1. The solution must meet the following requirements:

    - Lead1 can assign only the Virtual Machine Contributor and Reader roles in RG-App1.
    - Lead1 can't assign the Owner role, or any other role, to anyone.
    - The principle of least privilege is applied.

    What should you recommend?
  fr: |
    Litware, Inc. dispose d'un abonnement nommé **Sub1** qui contient un groupe de ressources nommé **RG-App1**. Les ressources de RG-App1 sont exploitées par une équipe applicative. L'équipe de plateforme souhaite que le responsable de l'équipe applicative, **Lead1**, gère l'accès des membres de l'équipe.

    Vous devez recommander un rôle pour Lead1. La solution doit répondre aux exigences suivantes :

    - Lead1 ne peut attribuer que les rôles Virtual Machine Contributor et Reader dans RG-App1.
    - Lead1 ne peut attribuer à personne le rôle Owner, ni aucun autre rôle.
    - Le principe du moindre privilège est appliqué.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "The Owner role on RG-App1, with a condition on the assignable roles", fr: "Le rôle Owner sur RG-App1, avec une condition sur les rôles attribuables" }
    - id: b
      text: { en: "The User Access Administrator role on RG-App1, without a condition", fr: "Le rôle User Access Administrator sur RG-App1, sans condition" }
    - id: c
      text: { en: "The Contributor role on RG-App1, with a resource lock on the resource group", fr: "Le rôle Contributor sur RG-App1, avec un verrou de ressource sur le groupe de ressources" }
    - id: d
      text: { en: "The Role Based Access Control Administrator role on RG-App1, with a condition on the assignable roles", fr: "Le rôle Role Based Access Control Administrator sur RG-App1, avec une condition sur les rôles attribuables" }
answer: { optionId: d }
explanation:
  correct:
    en: "Role Based Access Control Administrator can create and delete role assignments but can't manage the resources. A condition on the assignment constrains the delegation: it can limit the roles that Lead1 may assign (here Virtual Machine Contributor and Reader) and the principals that may receive them, so Lead1 can't grant Owner to anyone."
    fr: "Role Based Access Control Administrator peut créer et supprimer des attributions de rôles, mais pas gérer les ressources. Une condition sur l'attribution limite la délégation : elle peut restreindre les rôles que Lead1 est autorisé à attribuer (ici Virtual Machine Contributor et Reader) et les principaux qui peuvent les recevoir. Lead1 ne peut donc attribuer Owner à personne."
  options:
    a:
      en: "Even with a condition that constrains the role assignments, Owner still gives full management of all the resources of RG-App1, which Lead1 doesn't need."
      fr: "Même avec une condition qui limite les attributions de rôles, Owner donne toujours la gestion complète de toutes les ressources de RG-App1, dont Lead1 n'a pas besoin."
    b:
      en: "Without a condition, User Access Administrator can assign any role, including Owner, to any principal."
      fr: "Sans condition, User Access Administrator peut attribuer n'importe quel rôle, y compris Owner, à n'importe quel principal."
    c:
      en: "Contributor can't create role assignments at all, and a lock doesn't change that."
      fr: "Contributor ne peut créer aucune attribution de rôle, et un verrou n'y change rien."
references:
  - title: Delegate Azure access management to others
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/delegate-role-assignments-overview
