id: az305-1b-authz-privileged-access-dd
objective: "1.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a management group named **MG-Prod** that contains 20 production subscriptions; new production subscriptions are added regularly. The tenant root group also contains the development subscriptions. A team of 35 database administrators needs the Contributor role on production, but only during incidents.

    You need to recommend a role assignment design that meets the following requirements:

    - Access is requested with a justification, approved, and removed automatically after four hours.
    - The current and future production subscriptions are covered by a single assignment, and no other subscription is.
    - The arrival or departure of an administrator requires no change to the role assignment.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un groupe d'administration nommé **MG-Prod** qui contient 20 abonnements de production ; de nouveaux abonnements de production sont ajoutés régulièrement. Le groupe racine du locataire contient aussi les abonnements de développement. Une équipe de 35 administrateurs de bases de données a besoin du rôle Contributor sur la production, mais seulement pendant les incidents.

    Vous devez recommander une conception d'attribution de rôle qui répond aux exigences suivantes :

    - L'accès est demandé avec une justification, approuvé, et retiré automatiquement au bout de quatre heures.
    - Les abonnements de production actuels et futurs sont couverts par une seule attribution, et aucun autre abonnement ne l'est.
    - L'arrivée ou le départ d'un administrateur ne demande aucune modification de l'attribution de rôle.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Type of assignment: [[type]]

      Scope: [[scope]]

      Principal: [[principal]]
    fr: |
      Type d'attribution : [[type]]

      Étendue : [[scope]]

      Principal : [[principal]]
  slots:
    - id: type
      options:
        - { id: active, text: { en: "An active assignment that expires after one year", fr: "Une attribution active qui expire au bout d'un an" } }
        - { id: abac, text: { en: "An active assignment with an ABAC condition", fr: "Une attribution active avec une condition ABAC" } }
        - { id: elig, text: { en: "An eligible assignment in Privileged Identity Management", fr: "Une attribution éligible dans Privileged Identity Management" } }
    - id: scope
      options:
        - { id: root, text: { en: "The tenant root group", fr: "Le groupe racine du locataire" } }
        - { id: mg, text: "MG-Prod" }
        - { id: subs, text: { en: "Each production subscription", fr: "Chaque abonnement de production" } }
    - id: principal
      options:
        - { id: grp, text: { en: "A security group of the administrators", fr: "Un groupe de sécurité des administrateurs" } }
        - { id: users, text: { en: "Each administrator individually", fr: "Chaque administrateur individuellement" } }
        - { id: mi, text: { en: "A user-assigned managed identity", fr: "Une identité managée affectée par l'utilisateur" } }
answer:
  values: { type: elig, scope: mg, principal: grp }
explanation:
  correct:
    en: "An eligible assignment in Privileged Identity Management gives no permission until the member activates it; activation can require a justification and an approval, and it ends after the configured duration. An assignment at MG-Prod is inherited by every subscription that is in the management group now or later, without reaching the development subscriptions. Assigning the role to a group keeps a single assignment while members come and go."
    fr: "Une attribution éligible dans Privileged Identity Management ne donne aucune autorisation tant que le membre ne l'a pas activée ; l'activation peut exiger une justification et une approbation, et elle prend fin après la durée configurée. Une attribution au niveau de MG-Prod est héritée par tous les abonnements présents dans le groupe d'administration aujourd'hui ou plus tard, sans atteindre les abonnements de développement. Attribuer le rôle à un groupe permet de conserver une seule attribution alors que les membres arrivent et partent."
  options:
    active:
      en: "An active assignment gives the permissions all the time, without request or approval."
      fr: "Une attribution active donne les autorisations en permanence, sans demande ni approbation."
    abac:
      en: "ABAC conditions filter access to blob and queue data or constrain role assignment delegation; they don't make a Contributor assignment temporary or subject to approval."
      fr: "Les conditions ABAC filtrent l'accès aux données de blobs et de files d'attente ou limitent la délégation d'attributions de rôles ; elles ne rendent pas une attribution Contributor temporaire ni soumise à approbation."
    root:
      en: "The tenant root group also contains the development subscriptions."
      fr: "Le groupe racine du locataire contient aussi les abonnements de développement."
    subs:
      en: "One assignment per subscription doesn't cover the subscriptions that are added later."
      fr: "Une attribution par abonnement ne couvre pas les abonnements ajoutés par la suite."
references:
  - title: Assign Azure resource roles in Privileged Identity Management
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-resource-roles-assign-roles
  - title: Best practices for Azure RBAC
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/best-practices
