id: az305-1b-idm-cloud-sync-blockers
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation synchronizes its on-premises Active Directory Domain Services (AD DS) forest to Microsoft Entra ID by using Microsoft Entra Connect Sync. Adatum evaluates a move to Microsoft Entra Cloud Sync to reduce its on-premises infrastructure.

    You collect five facts about the current synchronization.

    Which two facts prevent you from recommending Cloud Sync today?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation synchronise sa forêt Active Directory Domain Services (AD DS) locale vers Microsoft Entra ID avec Microsoft Entra Connect Sync. Adatum étudie le passage à Microsoft Entra Cloud Sync pour réduire son infrastructure locale.

    Vous relevez cinq faits sur la synchronisation actuelle.

    Quels sont les deux faits qui vous empêchent de recommander Cloud Sync aujourd'hui ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "The largest domain contains 90,000 objects.", fr: "Le plus grand domaine contient 90 000 objets." }
    - id: b
      text: { en: "A security group of 80,000 members is synchronized with all its members.", fr: "Un groupe de sécurité de 80 000 membres est synchronisé avec tous ses membres." }
    - id: c
      text: { en: "Password hash synchronization is the sign-in method.", fr: "La synchronisation de hachage du mot de passe est la méthode de connexion." }
    - id: d
      text: { en: "Password writeback is used for self-service password reset.", fr: "La réécriture du mot de passe est utilisée pour la réinitialisation de mot de passe en libre-service." }
    - id: e
      text: { en: "Custom synchronization rules merge the attributes of the accounts that a user has in two domains.", fr: "Des règles de synchronisation personnalisées fusionnent les attributs des comptes qu'un utilisateur possède dans deux domaines." }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Cloud Sync synchronizes groups of up to 50,000 members, whereas Connect Sync supports 250,000. Merging attributes from several Active Directory sources relies on the synchronization rules engine of Connect Sync; Cloud Sync only offers attribute mapping with expressions. Both facts are documented blockers for a migration."
    fr: "Cloud Sync synchronise des groupes de 50 000 membres au plus, alors que Connect Sync en prend en charge 250 000. La fusion d'attributs issus de plusieurs sources Active Directory repose sur le moteur de règles de synchronisation de Connect Sync ; Cloud Sync ne propose qu'un mappage d'attributs par expressions. Ces deux faits sont des obstacles documentés à une migration."
  options:
    a:
      en: "Cloud Sync supports up to 150,000 objects per domain, so 90,000 objects are within the limit."
      fr: "Cloud Sync prend en charge jusqu'à 150 000 objets par domaine : 90 000 objets restent dans la limite."
    c:
      en: "Password hash synchronization is supported by both tools."
      fr: "La synchronisation de hachage du mot de passe est prise en charge par les deux outils."
    d:
      en: "Password writeback for self-service password reset is supported by both tools."
      fr: "La réécriture du mot de passe pour la réinitialisation en libre-service est prise en charge par les deux outils."
references:
  - title: "Migrate from Microsoft Entra Connect Sync to Cloud Sync: decision guide"
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/cloud-sync/connect-to-cloud-sync-decision-guide
