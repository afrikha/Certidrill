id: az305-1a-auth-pta-design-dd
objective: "1.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware plans to use pass-through authentication for the users that are synchronized from its on-premises Active Directory Domain Services (AD DS) domain. You are writing the design document.

    How should you complete the design statements? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit d'utiliser l'authentification directe pour les utilisateurs synchronisés depuis son domaine Active Directory Domain Services (AD DS) local. Vous rédigez le document de conception.

    Comment devez-vous compléter les énoncés de conception ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The passwords of the users are validated [[where]].

      For high availability, the number of authentication agents to deploy is [[count]].

      The servers that run the agents need [[net]].
    fr: |
      Les mots de passe des utilisateurs sont validés [[where]].

      Pour la haute disponibilité, le nombre d'agents d'authentification à déployer est de [[count]].

      Les serveurs qui exécutent les agents ont besoin [[net]].
  slots:
    - id: where
      options:
        - { id: cloud, text: { en: "by Microsoft Entra ID, against a synchronized hash", fr: "par Microsoft Entra ID, par rapport à un hachage synchronisé" } }
        - { id: dc, text: { en: "by the on-premises domain controllers", fr: "par les contrôleurs de domaine locaux" } }
        - { id: adfs, text: { en: "by a federation server farm", fr: "par une batterie de serveurs de fédération" } }
    - id: count
      options:
        - { id: n1, text: { en: "one", fr: "un" } }
        - { id: n2, text: { en: "two", fr: "deux" } }
        - { id: n3, text: { en: "three", fr: "trois" } }
    - id: net
      options:
        - { id: inbound, text: { en: "inbound connections from the internet on port 443", fr: "de connexions entrantes depuis Internet sur le port 443" } }
        - { id: outbound, text: { en: "outbound internet access only", fr: "d'un accès Internet sortant uniquement" } }
        - { id: vpn, text: { en: "a site-to-site VPN connection to Azure", fr: "d'une connexion VPN de site à site vers Azure" } }
answer:
  values: { where: dc, count: n3, net: outbound }
explanation:
  correct:
    en: |
      With pass-through authentication, a lightweight agent receives the validation request and checks the password against the on-premises domain controllers; no password hash has to be stored in the cloud for sign-in. Microsoft recommends three agents, so that one can fail while another is down for maintenance. The agent servers only need outbound internet access, with no perimeter network and no inbound port.
    fr: |
      Avec l'authentification directe, un agent léger reçoit la demande de validation et vérifie le mot de passe auprès des contrôleurs de domaine locaux ; aucun hachage de mot de passe n'a besoin d'être stocké dans le cloud pour la connexion. Microsoft recommande trois agents, afin que l'un puisse tomber en panne pendant qu'un autre est en maintenance. Les serveurs des agents n'ont besoin que d'un accès Internet sortant, sans réseau de périmètre ni port entrant.
  options:
    cloud:
      en: "Validation in the cloud against a synchronized hash describes password hash synchronization."
      fr: "La validation dans le cloud par rapport à un hachage synchronisé décrit la synchronisation de hachage du mot de passe."
    inbound:
      en: "Inbound access from the internet is a requirement of the Web Application Proxy servers of an AD FS deployment."
      fr: "L'accès entrant depuis Internet est une exigence des serveurs proxy d'application web d'un déploiement AD FS."
references:
  - title: Choose the right authentication method for your Microsoft Entra hybrid identity solution
    url: https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/choose-ad-authn
