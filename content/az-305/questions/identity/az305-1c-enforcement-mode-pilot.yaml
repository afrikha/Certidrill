id: az305-1c-enforcement-mode-pilot
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys plans to assign a built-in initiative at a management group that contains 50 subscriptions. Most of the definitions of the initiative use the deny effect, and the effect of several of them can't be changed by a parameter.

    Before enforcing the initiative, the governance team wants to measure its impact for 30 days. The solution must meet the following requirements:

    - The existing resources and the new deployments that don't comply must be reported.
    - No deployment must be blocked during the 30 days.
    - No policy definition must be created or duplicated.

    What should you recommend?
  fr: |
    Wingtip Toys prévoit d'attribuer une initiative intégrée sur un groupe d'administration qui contient 50 abonnements. La plupart des définitions de l'initiative utilisent l'effet deny, et l'effet de plusieurs d'entre elles ne peut pas être modifié par un paramètre.

    Avant d'imposer l'initiative, l'équipe de gouvernance veut mesurer son impact pendant 30 jours. La solution doit respecter les exigences suivantes :

    - Les ressources existantes et les nouveaux déploiements non conformes doivent être signalés.
    - Aucun déploiement ne doit être bloqué pendant les 30 jours.
    - Aucune définition de stratégie ne doit être créée ni dupliquée.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Assign the initiative and create a policy exemption for each subscription.", fr: "Attribuer l'initiative et créer une exemption de stratégie pour chaque abonnement." }
    - id: b
      text: { en: "Assign the initiative and add each subscription as an excluded scope.", fr: "Attribuer l'initiative et ajouter chaque abonnement comme étendue exclue." }
    - id: c
      text: { en: "Assign the initiative with the enforcement mode set to Disabled.", fr: "Attribuer l'initiative avec le mode d'application défini sur Disabled." }
    - id: d
      text: { en: "Assign the initiative and create a remediation task for each definition.", fr: "Attribuer l'initiative et créer une tâche de correction pour chaque définition." }
answer: { optionId: c }
explanation:
  correct:
    en: "The enforcement mode is a property of the assignment. When it is set to Disabled, the effects aren't enforced, so nothing is denied, but the resources are still evaluated and their compliance is reported. After the 30 days, the same assignment is switched back to the default mode."
    fr: "Le mode d'application est une propriété de l'attribution. Lorsqu'il est défini sur Disabled, les effets ne sont pas appliqués, donc rien n'est refusé, mais les ressources sont toujours évaluées et leur conformité est signalée. Après les 30 jours, la même attribution est rebasculée dans le mode par défaut."
  options:
    a:
      en: "Exempt resources aren't evaluated against the definitions, so the impact couldn't be measured, and 50 exemptions would have to be managed."
      fr: "Les ressources exemptées ne sont pas évaluées par rapport aux définitions : l'impact ne pourrait pas être mesuré, et il faudrait gérer 50 exemptions."
    b:
      en: "Excluded scopes are left out of the evaluation, so no compliance result would be produced for the subscriptions."
      fr: "Les étendues exclues sont écartées de l'évaluation : aucun résultat de conformité ne serait produit pour les abonnements."
    d:
      en: "Remediation tasks correct existing resources for the modify and deployIfNotExists effects. They don't stop deny definitions from blocking deployments."
      fr: "Les tâches de correction corrigent les ressources existantes pour les effets modify et deployIfNotExists. Elles n'empêchent pas les définitions deny de bloquer des déploiements."
references:
  - title: Azure Policy assignment structure
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/assignment-structure
