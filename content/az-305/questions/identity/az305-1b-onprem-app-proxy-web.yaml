id: az305-1b-onprem-app-proxy-web
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. hosts an intranet web application in its datacenter. The application runs on IIS and uses Integrated Windows Authentication. The Contoso users are synchronized to a Microsoft Entra tenant. Remote employees must use the application from a browser on any device.

    You need to recommend a remote access solution that meets the following requirements:

    - Users authenticate with Microsoft Entra ID, and a Conditional Access policy requires multifactor authentication before any traffic reaches the datacenter.
    - No VPN client is installed on the devices.
    - No inbound port is opened on the datacenter firewall, and no server is placed in a perimeter network.

    What should you recommend?
  fr: |
    Contoso, Ltd. héberge une application web intranet dans son centre de données. L'application s'exécute sur IIS et utilise l'authentification Windows intégrée. Les utilisateurs de Contoso sont synchronisés vers un locataire Microsoft Entra. Les employés distants doivent utiliser l'application depuis un navigateur, sur n'importe quel appareil.

    Vous devez recommander une solution d'accès à distance qui répond aux exigences suivantes :

    - Les utilisateurs s'authentifient avec Microsoft Entra ID, et une stratégie d'accès conditionnel exige l'authentification multifacteur avant que le moindre trafic n'atteigne le centre de données.
    - Aucun client VPN n'est installé sur les appareils.
    - Aucun port entrant n'est ouvert sur le pare-feu du centre de données, et aucun serveur n'est placé dans un réseau de périmètre.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "AD FS with Web Application Proxy servers", fr: "AD FS avec des serveurs Proxy d'application web" }
    - id: b
      text: { en: "A point-to-site VPN with Microsoft Entra authentication", fr: "Un VPN point à site avec l'authentification Microsoft Entra" }
    - id: c
      text: { en: "Microsoft Entra application proxy", fr: "Le proxy d'application Microsoft Entra" }
    - id: d
      text: { en: "Azure Front Door with a web application firewall policy", fr: "Azure Front Door avec une stratégie de pare-feu d'applications web" }
answer: { optionId: c }
explanation:
  correct:
    en: "Microsoft Entra application proxy publishes on-premises web applications through a cloud service and a private network connector that only makes outbound connections on ports 80 and 443. With pre-authentication, Microsoft Entra ID and Conditional Access are applied in the cloud, and unauthenticated traffic never reaches the network. Users only need a browser."
    fr: "Le proxy d'application Microsoft Entra publie des applications web locales au moyen d'un service cloud et d'un connecteur de réseau privé qui n'établit que des connexions sortantes sur les ports 80 et 443. Avec la préauthentification, Microsoft Entra ID et l'accès conditionnel s'appliquent dans le cloud, et le trafic non authentifié n'atteint jamais le réseau. Les utilisateurs n'ont besoin que d'un navigateur."
  options:
    a:
      en: "Web Application Proxy servers sit in a perimeter network and need inbound ports from the internet."
      fr: "Les serveurs Proxy d'application web se trouvent dans un réseau de périmètre et ont besoin de ports entrants depuis Internet."
    b:
      en: "A point-to-site VPN needs a VPN client on every device, and it gives network access rather than access to one application."
      fr: "Un VPN point à site demande un client VPN sur chaque appareil, et il donne un accès réseau plutôt qu'un accès à une seule application."
    d:
      en: "Azure Front Door forwards requests to an origin that it must be able to reach, which means exposing the datacenter to inbound connections."
      fr: "Azure Front Door transmet les requêtes à une origine qu'il doit pouvoir joindre, ce qui revient à exposer le centre de données à des connexions entrantes."
references:
  - title: Microsoft Entra application proxy
    url: https://learn.microsoft.com/en-us/entra/identity/app-proxy/overview-what-is-app-proxy
