id: az305-1a-log-sources-yn
objective: "1.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure subscription named **Sub1** that contains a storage account named **st1** and an App Service web app named **App1**. No diagnostic setting has been created in Sub1.

    You are evaluating which monitoring data is already available before you design the logging solution.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un abonnement Azure nommé **Sub1** qui contient un compte de stockage nommé **st1** et une application web App Service nommée **App1**. Aucun paramètre de diagnostic n'a été créé dans Sub1.

    Vous évaluez les données de monitoring déjà disponibles avant de concevoir la solution de journalisation.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The operations that created st1 and App1 last week are available in the activity log."
        fr: "Les opérations qui ont créé st1 et App1 la semaine dernière sont disponibles dans le journal d'activité."
    - id: s2
      text:
        en: "The read requests made to the blobs of st1 are recorded in the activity log."
        fr: "Les requêtes de lecture adressées aux objets blob de st1 sont enregistrées dans le journal d'activité."
    - id: s3
      text:
        en: "The platform metrics of App1 are collected only after a diagnostic setting is created on App1."
        fr: "Les métriques de plateforme d'App1 ne sont collectées qu'après la création d'un paramètre de diagnostic sur App1."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The activity log is collected automatically and keeps the control plane operations of the subscription, such as the creation of a resource, for 90 days. Reading a blob is a data plane operation: it appears only in the resource logs of the storage account, which exist once a diagnostic setting collects them. Platform metrics are collected automatically; a diagnostic setting is needed only to send them to another destination.
    fr: |
      Le journal d'activité est collecté automatiquement et conserve pendant 90 jours les opérations du plan de contrôle de l'abonnement, comme la création d'une ressource. La lecture d'un objet blob est une opération du plan de données : elle n'apparaît que dans les journaux de ressources du compte de stockage, qui existent une fois qu'un paramètre de diagnostic les collecte. Les métriques de plateforme sont collectées automatiquement ; un paramètre de diagnostic ne sert qu'à les envoyer vers une autre destination.
references:
  - title: Activity log in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/activity-log
  - title: Diagnostic settings in Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/platform/diagnostic-settings
