id: az305-1c-pim-assignment-types
objective: "1.3.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam manages its privileged roles with Microsoft Entra Privileged Identity Management (PIM). The security policy states that a role must be held without activation only when activation is impossible or explicitly excluded, and that every assignment must end as soon as the need ends.

    You need to recommend the type of assignment for each situation.

    Which assignment type should you recommend for each situation? To answer, drag the appropriate assignment types to the correct situations. Each assignment type may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam gère ses rôles privilégiés avec Microsoft Entra Privileged Identity Management (PIM). La politique de sécurité indique qu'un rôle ne doit être détenu sans activation que si l'activation est impossible ou explicitement écartée, et que toute attribution doit prendre fin dès que le besoin disparaît.

    Vous devez recommander le type d'attribution pour chaque situation.

    Quel type d'attribution devez-vous recommander pour chaque situation ? Pour répondre, faites glisser les types d'attribution appropriés vers les situations correspondantes. Chaque type d'attribution peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: pa, text: { en: "Permanent active", fr: "Active permanente" } }
    - { id: ta, text: { en: "Time-bound active", fr: "Active limitée dans le temps" } }
    - { id: pe, text: { en: "Permanent eligible", fr: "Éligible permanente" } }
    - { id: te, text: { en: "Time-bound eligible", fr: "Éligible limitée dans le temps" } }
  targets:
    - id: t1
      text: { en: "An emergency access account that must be able to use Global Administrator at any time, even if PIM activation is unavailable", fr: "Un compte d'accès d'urgence qui doit pouvoir utiliser Global Administrator à tout moment, même si l'activation PIM est indisponible" }
    - id: t2
      text: { en: "An employee of the platform team, with no planned departure, who needs User Access Administrator a few times a month after approval", fr: "Un employé de l'équipe de plateforme, sans départ prévu, qui a besoin de User Access Administrator quelques fois par mois après approbation" }
    - id: t3
      text: { en: "An external auditor who must use Reader continuously during a three-week audit, with no activation step", fr: "Un auditeur externe qui doit utiliser Reader en continu pendant un audit de trois semaines, sans étape d'activation" }
    - id: t4
      text: { en: "A contractor with a six-month contract who needs Contributor occasionally, with a justification each time", fr: "Un prestataire sous contrat de six mois qui a besoin de Contributor de temps en temps, avec une justification à chaque fois" }
answer:
  mapping: { t1: pa, t2: pe, t3: ta, t4: te }
explanation:
  correct:
    en: "An eligible assignment requires the user to activate the role, with the controls of the role settings such as approval or justification. An active assignment gives the role without activation. Each of them can be permanent or time-bound with an end date. The emergency account can't depend on activation and has no end date. The auditor needs the role continuously for three weeks. The employee and the contractor activate on demand, with an end date only for the contractor."
    fr: "Une attribution éligible oblige l'utilisateur à activer le rôle, avec les contrôles des paramètres du rôle comme l'approbation ou la justification. Une attribution active donne le rôle sans activation. Chacune peut être permanente ou limitée dans le temps par une date de fin. Le compte d'urgence ne peut pas dépendre d'une activation et n'a pas de date de fin. L'auditeur a besoin du rôle en continu pendant trois semaines. L'employé et le prestataire activent le rôle à la demande, avec une date de fin pour le seul prestataire."
references:
  - title: What is Microsoft Entra Privileged Identity Management?
    url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
