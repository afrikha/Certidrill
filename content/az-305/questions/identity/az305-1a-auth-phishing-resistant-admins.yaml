id: az305-1a-auth-phishing-resistant-admins
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Microsoft Entra tenant in which every user has a Microsoft Entra ID P1 license. All the users are registered for multifactor authentication, most of them with push notifications in Microsoft Authenticator.

    You need to recommend a solution that meets the following requirements:

    - Users who hold an administrator role must sign in with a phishing-resistant method, such as a FIDO2 security key or Windows Hello for Business.
    - The other users must be able to keep using their current methods.
    - Licensing costs must be minimized.

    What should you recommend for the administrators?
  fr: |
    Litware dispose d'un locataire Microsoft Entra dans lequel chaque utilisateur possède une licence Microsoft Entra ID P1. Tous les utilisateurs sont inscrits à l'authentification multifacteur, la plupart avec des notifications push dans Microsoft Authenticator.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Les utilisateurs qui détiennent un rôle d'administrateur doivent se connecter avec une méthode résistante à l'hameçonnage, comme une clé de sécurité FIDO2 ou Windows Hello Entreprise.
    - Les autres utilisateurs doivent pouvoir conserver leurs méthodes actuelles.
    - Les coûts de licence doivent être réduits au minimum.

    Que devez-vous recommander pour les administrateurs ?
body:
  options:
    - id: a
      text:
        en: "A Conditional Access policy that uses the Require multifactor authentication grant control"
        fr: "Une stratégie d'accès conditionnel qui utilise le contrôle d'octroi Exiger l'authentification multifacteur"
    - id: b
      text:
        en: "Security defaults"
        fr: "Les paramètres de sécurité par défaut"
    - id: c
      text:
        en: "A Conditional Access policy that uses the Require authentication strength grant control"
        fr: "Une stratégie d'accès conditionnel qui utilise le contrôle d'octroi Exiger une force d'authentification"
    - id: d
      text:
        en: "A Conditional Access policy that uses the sign-in risk condition"
        fr: "Une stratégie d'accès conditionnel qui utilise la condition de risque de connexion"
answer: { optionId: c }
explanation:
  correct:
    en: |
      An authentication strength specifies which combinations of methods satisfy a Conditional Access policy. The built-in Phishing-resistant MFA strength accepts only FIDO2 security keys, Windows Hello for Business or platform credentials, and multifactor certificate-based authentication. A policy that targets the administrator roles with this strength leaves the other users unchanged and needs only the P1 licenses that Litware already has.
    fr: |
      Une force d'authentification précise quelles combinaisons de méthodes satisfont une stratégie d'accès conditionnel. La force intégrée Phishing-resistant MFA n'accepte que les clés de sécurité FIDO2, Windows Hello Entreprise ou les informations d'identification de plateforme, et l'authentification basée sur un certificat multifacteur. Une stratégie qui cible les rôles d'administrateur avec cette force ne change rien pour les autres utilisateurs et ne demande que les licences P1 que Litware possède déjà.
  options:
    a:
      en: "The multifactor authentication control is satisfied by any registered method, including push notifications, which aren't phishing-resistant."
      fr: "Le contrôle d'authentification multifacteur est satisfait par n'importe quelle méthode inscrite, y compris les notifications push, qui ne sont pas résistantes à l'hameçonnage."
    b:
      en: "Security defaults require multifactor authentication with Microsoft Authenticator or an OATH code; they can't restrict administrators to phishing-resistant methods, and they aren't combined with Conditional Access policies."
      fr: "Les paramètres de sécurité par défaut exigent l'authentification multifacteur avec Microsoft Authenticator ou un code OATH ; ils ne peuvent pas limiter les administrateurs aux méthodes résistantes à l'hameçonnage, et ils ne se combinent pas avec des stratégies d'accès conditionnel."
    d:
      en: "Sign-in risk requires Microsoft Entra ID P2, and it adds a control only when a sign-in looks risky, without choosing the method."
      fr: "Le risque de connexion exige Microsoft Entra ID P2 et n'ajoute un contrôle que lorsqu'une connexion paraît risquée, sans choisir la méthode."
references:
  - title: Conditional Access authentication strengths
    url: https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-strengths
