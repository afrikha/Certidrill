id: az305-2b-blob-media-app
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is developing a mobile application that lets customers upload photos and short videos. The files are written once and are then read by web and mobile clients from anywhere over HTTPS.

    You need to recommend a storage service for the files. The solution must scale to hundreds of terabytes and must minimize costs.

    What should you recommend?
  fr: |
    Tailspin Toys développe une application mobile qui permet aux clients de charger des photos et de courtes vidéos. Les fichiers sont écrits une seule fois, puis lus par des clients web et mobiles depuis n'importe où en HTTPS.

    Vous devez recommander un service de stockage pour les fichiers. La solution doit pouvoir atteindre des centaines de téraoctets et réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: Azure Files
    - id: b
      text: { en: "Azure Blob Storage", fr: "Stockage Blob Azure" }
    - id: c
      text: { en: "Azure managed disks", fr: "Disques managés Azure" }
    - id: d
      text: { en: "Azure Table Storage", fr: "Stockage Table Azure" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Blob Storage is object storage designed for massive amounts of unstructured data such as images and video. Objects are reachable from anywhere over HTTP or HTTPS, and block blobs can be placed in access tiers that lower the storage price.
    fr: |
      Stockage Blob Azure est un stockage d'objets conçu pour de très grandes quantités de données non structurées, comme des images et des vidéos. Les objets sont accessibles de partout en HTTP ou HTTPS, et les objets blob de blocs peuvent être placés dans des niveaux d'accès qui réduisent le prix du stockage.
  options:
    a:
      en: Azure Files provides file shares that applications mount with SMB or NFS and use through file system APIs; it is not the object store designed to serve media to web and mobile clients at the lowest cost.
      fr: "Azure Files fournit des partages de fichiers que les applications montent en SMB ou NFS et utilisent par les API de système de fichiers ; ce n'est pas le magasin d'objets conçu pour servir des médias à des clients web et mobiles au moindre coût."
    c:
      en: A managed disk is block storage attached to a virtual machine and is not directly reachable by web and mobile clients.
      fr: "Un disque managé est un stockage par blocs attaché à une machine virtuelle ; il n'est pas directement accessible aux clients web et mobiles."
    d:
      en: Table Storage stores small key/attribute entities, not photo and video files.
      fr: "Stockage Table stocke de petites entités clé/attribut, pas des fichiers photo et vidéo."
references:
  - title: Introduction to Azure Blob Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-introduction
