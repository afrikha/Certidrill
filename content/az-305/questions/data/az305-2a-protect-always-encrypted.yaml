id: az305-2a-protect-always-encrypted
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank stores the national identification numbers of its customers in a column of a database in Azure SQL Database.

    You need to recommend a data protection solution that meets the following requirements:

    - Database administrators, including members of the db_owner role, must be unable to read the numbers in plaintext.
    - The numbers must stay encrypted at rest, in transit and while queries are processed on the server.
    - Only the applications that hold the encryption keys may decrypt the numbers.

    What should you recommend?
  fr: |
    Woodgrove Bank stocke les numéros d'identification nationaux de ses clients dans une colonne d'une base de données Azure SQL Database.

    Vous devez recommander une solution de protection des données qui répond aux exigences suivantes :

    - Les administrateurs de base de données, y compris les membres du rôle db_owner, ne doivent pas pouvoir lire les numéros en clair.
    - Les numéros doivent rester chiffrés au repos, en transit et pendant le traitement des requêtes sur le serveur.
    - Seules les applications qui détiennent les clés de chiffrement peuvent déchiffrer les numéros.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Transparent data encryption with a customer-managed key", fr: "Transparent Data Encryption avec une clé gérée par le client" }
    - id: b
      text: { en: "Dynamic data masking", fr: "Le masquage dynamique des données" }
    - id: c
      text: { en: "Row-level security", fr: "La sécurité au niveau des lignes" }
    - id: d
      text: { en: "Always Encrypted", fr: "Always Encrypted" }
answer: { optionId: d }
explanation:
  correct:
    en: With Always Encrypted, the client driver encrypts the column values before they are sent to the database, and the keys are never revealed to the Database Engine. The data therefore stays encrypted at rest, in transit and in use, and a database administrator who queries the column sees only ciphertext.
    fr: Avec Always Encrypted, le pilote client chiffre les valeurs de la colonne avant de les envoyer à la base de données, et les clés ne sont jamais révélées au moteur de base de données. Les données restent donc chiffrées au repos, en transit et en cours d'utilisation, et un administrateur de base de données qui interroge la colonne ne voit que du texte chiffré.
  options:
    a:
      en: Transparent data encryption protects the files and the backups at rest. The engine decrypts the pages for any authorized user, including administrators.
      fr: Transparent Data Encryption protège les fichiers et les sauvegardes au repos. Le moteur déchiffre les pages pour tout utilisateur autorisé, administrateurs compris.
    b:
      en: Dynamic data masking only hides values in query results for non-privileged users. Administrators always see the real data.
      fr: Le masquage dynamique des données ne fait que masquer les valeurs dans les résultats des requêtes pour les utilisateurs non privilégiés. Les administrateurs voient toujours les données réelles.
    c:
      en: Row-level security filters the rows that a user can access. It encrypts nothing, and administrators can bypass it.
      fr: La sécurité au niveau des lignes filtre les lignes auxquelles un utilisateur peut accéder. Elle ne chiffre rien, et les administrateurs peuvent la contourner.
references:
  - title: Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine
