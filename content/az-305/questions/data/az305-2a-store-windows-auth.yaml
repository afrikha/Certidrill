id: az305-2a-store-windows-auth
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware uses a line-of-business client application on domain-joined Windows devices. The application connects to an on-premises SQL Server database by using Windows authentication. The user accounts are synchronized to Microsoft Entra ID.

    Proseware plans to move the database to Azure. You need to recommend a target that meets the following requirements:

    - The application must keep using Windows authentication, without any change to its code.
    - Proseware must have no virtual machine to patch.

    What should you recommend?
  fr: |
    Proseware utilise une application cliente métier sur des appareils Windows joints au domaine. L'application se connecte à une base de données SQL Server locale à l'aide de l'authentification Windows. Les comptes d'utilisateurs sont synchronisés avec Microsoft Entra ID.

    Proseware prévoit de déplacer la base de données vers Azure. Vous devez recommander une cible qui répond aux exigences suivantes :

    - L'application doit continuer à utiliser l'authentification Windows, sans aucune modification de son code.
    - Proseware ne doit avoir aucune machine virtuelle à mettre à jour.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Azure SQL Managed Instance", fr: "Azure SQL Managed Instance" }
    - id: b
      text: { en: "Azure SQL Database with Microsoft Entra authentication", fr: "Azure SQL Database avec l'authentification Microsoft Entra" }
    - id: c
      text: { en: "SQL Server on Azure Virtual Machines joined to the domain", fr: "SQL Server sur machines virtuelles Azure jointes au domaine" }
    - id: d
      text: { en: "Azure SQL Database with SQL authentication", fr: "Azure SQL Database avec l'authentification SQL" }
answer: { optionId: a }
explanation:
  correct:
    en: Among the platform services, only SQL Managed Instance accepts Windows authentication. Windows Authentication for Microsoft Entra principals lets clients obtain Kerberos tickets through Microsoft Entra ID and connect with integrated security, as they do today. No virtual machine is involved.
    fr: Parmi les services de plateforme, seul SQL Managed Instance accepte l'authentification Windows. L'authentification Windows pour les principaux Microsoft Entra permet aux clients d'obtenir des tickets Kerberos par l'intermédiaire de Microsoft Entra ID et de se connecter avec la sécurité intégrée, comme aujourd'hui. Aucune machine virtuelle n'intervient.
  options:
    b:
      en: Azure SQL Database doesn't accept Windows authentication. Moving to Microsoft Entra authentication changes the way the application connects.
      fr: Azure SQL Database n'accepte pas l'authentification Windows. Passer à l'authentification Microsoft Entra modifie la façon dont l'application se connecte.
    c:
      en: SQL Server on a domain-joined virtual machine supports Windows authentication, but Proseware would have to patch the virtual machines.
      fr: SQL Server sur une machine virtuelle jointe au domaine prend en charge l'authentification Windows, mais Proseware devrait mettre à jour les machines virtuelles.
    d:
      en: SQL authentication replaces the Windows identities with logins and passwords, which requires changing the application.
      fr: L'authentification SQL remplace les identités Windows par des comptes de connexion et des mots de passe, ce qui impose de modifier l'application.
references:
  - title: What is Windows Authentication for Microsoft Entra principals on Azure SQL Managed Instance?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/winauth-azuread-overview
  - title: "Features comparison: Azure SQL Database and Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
