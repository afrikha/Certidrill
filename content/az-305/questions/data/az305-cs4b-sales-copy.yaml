id: az305-cs4b-sales-copy
objective: "2.3.1"
type: dropdown
caseStudy: az305-cs4b-fourthcoffee
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution that copies the sales of the day from SQL-SALES to the data lake. The solution must meet the data integration requirements.

    What should you include in the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution qui copie les ventes du jour de SQL-SALES vers le lac de données. La solution doit respecter les exigences d'intégration de données.

    Que devez-vous inclure dans la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Service: [[service]]

      Integration runtime: [[runtime]]
    fr: |
      Service : [[service]]

      Runtime d'intégration : [[runtime]]
  slots:
    - id: service
      options:
        - { id: dms, text: Azure Database Migration Service }
        - { id: adf, text: Azure Data Factory }
        - { id: eh, text: Azure Event Hubs }
        - { id: asa, text: Azure Stream Analytics }
    - id: runtime
      options:
        - { id: azure, text: { en: "Azure integration runtime", fr: "Runtime d'intégration Azure" } }
        - { id: ssis, text: { en: "Azure-SSIS integration runtime", fr: "Runtime d'intégration Azure-SSIS" } }
        - { id: shir, text: { en: "Self-hosted integration runtime", fr: "Runtime d'intégration auto-hébergé" } }
answer:
  values: { service: adf, runtime: shir }
explanation:
  correct:
    en: |
      Azure Data Factory runs copy activities in pipelines that a schedule trigger starts every night, with built-in monitoring and retry, and no code to write. SQL-SALES is in a private network, so the copy activity runs on a self-hosted integration runtime installed on a machine of the Madrid datacenter. This runtime opens outbound connections only: no inbound port and no VPN are needed.
    fr: |
      Azure Data Factory exécute des activités de copie dans des pipelines qu'un déclencheur de planification lance chaque nuit, avec un monitoring et des nouvelles tentatives intégrés, sans code à écrire. SQL-SALES se trouve dans un réseau privé : l'activité de copie s'exécute donc sur un runtime d'intégration auto-hébergé, installé sur une machine du centre de données de Madrid. Ce runtime n'ouvre que des connexions sortantes : ni port entrant ni VPN ne sont nécessaires.
  options:
    dms:
      en: "Database Migration Service moves databases to Azure once. It is not a tool for a recurring copy of data to a data lake."
      fr: "Database Migration Service déplace des bases de données vers Azure une fois. Ce n'est pas un outil de copie récurrente de données vers un lac de données."
    eh:
      en: "Event Hubs ingests streams of events that applications send to it. It does not read tables from a SQL Server instance on a schedule."
      fr: "Event Hubs ingère des flux d'événements que des applications lui envoient. Il ne lit pas des tables d'une instance SQL Server selon une planification."
    asa:
      en: "Stream Analytics processes streams in real time. A nightly copy of tables is a batch movement of data."
      fr: "Stream Analytics traite des flux en temps réel. Une copie nocturne de tables est un déplacement de données par lots."
    azure:
      en: "The Azure integration runtime runs in Azure and cannot reach a server that has no public endpoint without a VPN or ExpressRoute."
      fr: "Le runtime d'intégration Azure s'exécute dans Azure et ne peut pas atteindre, sans VPN ni ExpressRoute, un serveur dépourvu de point de terminaison public."
    ssis:
      en: "The Azure-SSIS integration runtime exists to run SQL Server Integration Services packages, which Fourth Coffee does not have."
      fr: "Le runtime d'intégration Azure-SSIS sert à exécuter des packages SQL Server Integration Services, dont Fourth Coffee ne dispose pas."
references:
  - title: Integration runtime in Azure Data Factory
    url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-integration-runtime
