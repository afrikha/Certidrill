id: az305-sr2b-q1
objective: "2.2.1"
type: series_yesno
series: az305-sr2b-cart-store
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You recommend one write region, two read regions and service-managed failover.
  fr: |
    Vous recommandez une région d'écriture, deux régions de lecture et le basculement géré par le service.
body:
  solution:
    en: |
      You recommend an account that has **West Europe** as its single write region and **East US** and **Southeast Asia** as read regions. **Service-managed failover** is enabled, and the default consistency level is **Session**.
    fr: |
      Vous recommandez un compte dont **West Europe** est la seule région d'écriture et dont **East US** et **Southeast Asia** sont des régions de lecture. Le **basculement géré par le service** est activé, et le niveau de cohérence par défaut est **Session**.
answer: { value: false }
explanation:
  correct:
    en: |
      With a single write region, the deployments of East US and Southeast Asia read locally but send every write to West Europe, which breaks the first requirement. If West Europe fails, write availability is lost until the service-managed failover completes, which can take a significant time, so the application has to wait for a failover. Session consistency alone would satisfy the third requirement.
    fr: |
      Avec une seule région d'écriture, les déploiements d'East US et de Southeast Asia lisent localement mais envoient chaque écriture à West Europe, ce qui enfreint la première exigence. Si West Europe tombe en panne, la disponibilité en écriture est perdue jusqu'à la fin du basculement géré par le service, qui peut prendre un temps important : l'application doit donc attendre un basculement. La cohérence Session suffirait, à elle seule, à satisfaire la troisième exigence.
references:
  - title: "Reliability in Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/high-availability
  - title: "Distribute your data globally with Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/distribute-data-globally
