id: az305-2a-scale-elastic-tools
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is designing a customer application whose data will be sharded across 200 databases in Azure SQL Database. Each customer is stored in one shard.

    You need to recommend the Elastic Database tool for each need of the design.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank conçoit une application cliente dont les données seront partitionnées (sharding) sur 200 bases de données Azure SQL Database. Chaque client est stocké dans une seule partition.

    Vous devez recommander l'outil de base de données élastique adapté à chaque besoin de la conception.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Direct each request to the database that holds the customer's data: [[route]]

      Move customers from an overloaded shard to a new shard: [[move]]

      Run a schema update script on all the shards on a schedule: [[admin]]
    fr: |
      Diriger chaque requête vers la base de données qui contient les données du client : [[route]]

      Déplacer des clients d'une partition surchargée vers une nouvelle partition : [[move]]

      Exécuter un script de mise à jour du schéma sur toutes les partitions selon une planification : [[admin]]
  slots:
    - id: route
      options:
        - { id: r-lib, text: { en: "Elastic Database client library", fr: "Bibliothèque cliente de base de données élastique" } }
        - { id: r-split, text: { en: "Split-merge tool", fr: "Outil de fractionnement et de fusion" } }
        - { id: r-jobs, text: { en: "Elastic jobs", fr: "Travaux élastiques" } }
        - { id: r-query, text: { en: "Elastic query", fr: "Requête élastique" } }
    - id: move
      options:
        - { id: m-lib, text: { en: "Elastic Database client library", fr: "Bibliothèque cliente de base de données élastique" } }
        - { id: m-split, text: { en: "Split-merge tool", fr: "Outil de fractionnement et de fusion" } }
        - { id: m-jobs, text: { en: "Elastic jobs", fr: "Travaux élastiques" } }
        - { id: m-query, text: { en: "Elastic query", fr: "Requête élastique" } }
    - id: admin
      options:
        - { id: a-lib, text: { en: "Elastic Database client library", fr: "Bibliothèque cliente de base de données élastique" } }
        - { id: a-split, text: { en: "Split-merge tool", fr: "Outil de fractionnement et de fusion" } }
        - { id: a-jobs, text: { en: "Elastic jobs", fr: "Travaux élastiques" } }
        - { id: a-query, text: { en: "Elastic query", fr: "Requête élastique" } }
answer:
  values: { route: r-lib, move: m-split, admin: a-jobs }
explanation:
  correct:
    en: The Elastic Database client library manages the shard map and performs data-dependent routing, which opens the connection to the shard that holds a given key. The split-merge tool moves data between shards when shards must be split or merged. Elastic jobs run Transact-SQL scripts across a group of databases, on demand or on a schedule.
    fr: La bibliothèque cliente de base de données élastique gère la carte de partitions et assure le routage dépendant des données, qui ouvre la connexion vers la partition contenant une clé donnée. L'outil de fractionnement et de fusion déplace des données entre partitions lorsqu'il faut en fractionner ou en fusionner. Les travaux élastiques exécutent des scripts Transact-SQL sur un groupe de bases de données, à la demande ou selon une planification.
  options:
    r-query: { en: "Elastic query runs a report query that spans several databases. It doesn't route the transactions of one customer.", fr: "La requête élastique exécute une requête de rapport couvrant plusieurs bases de données. Elle ne route pas les transactions d'un client." }
    m-jobs: { en: "Elastic jobs run scripts on databases. They don't relocate shardlets or update the shard map.", fr: "Les travaux élastiques exécutent des scripts sur des bases de données. Ils ne déplacent pas de données entre partitions et ne mettent pas à jour la carte de partitions." }
    a-split: { en: "The split-merge tool moves data. It doesn't run administration scripts.", fr: "L'outil de fractionnement et de fusion déplace des données. Il n'exécute pas de scripts d'administration." }
references:
  - title: Scale out with Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-scale-introduction
  - title: Building scalable cloud databases
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-database-client-library
