id: az305-2b-premium-blob-account
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is designing the ingestion store of an IoT platform. Devices write millions of small objects per hour as block blobs, and downstream services read each object within seconds.

    You need to recommend a storage account that meets the following requirements:

    - Provide consistently low latency for a very high rate of transactions on small objects.
    - Keep the data available if an availability zone of the region fails.
    - Keep all copies of the data in the region.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam conçoit le magasin d'ingestion d'une plateforme IoT. Des appareils écrivent des millions de petits objets par heure sous forme d'objets blob de blocs, et des services en aval lisent chaque objet en quelques secondes.

    Vous devez recommander un compte de stockage qui répond aux exigences suivantes :

    - Offrir une latence constamment faible pour un taux très élevé de transactions sur de petits objets.
    - Garder les données disponibles en cas de défaillance d'une zone de disponibilité de la région.
    - Conserver toutes les copies des données dans la région.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Storage account type: [[kind]]

      Redundancy: [[red]]
    fr: |
      Type de compte de stockage : [[kind]]

      Redondance : [[red]]
  slots:
    - id: kind
      options:
        - { id: gpv2, text: { en: "Standard general-purpose v2", fr: "Standard usage général v2" } }
        - { id: pbb, text: { en: "Premium block blobs", fr: "Objets blob de blocs Premium" } }
        - { id: pfs, text: { en: "Premium file shares", fr: "Partages de fichiers Premium" } }
        - { id: ppb, text: { en: "Premium page blobs", fr: "Objets blob de pages Premium" } }
    - id: red
      options:
        - { id: lrs, text: LRS }
        - { id: zrs, text: ZRS }
        - { id: grs, text: GRS }
        - { id: gzrs, text: GZRS }
answer:
  values: { kind: pbb, red: zrs }
explanation:
  correct:
    en: |
      A premium block blobs account stores block and append blobs on SSDs and is recommended for high transaction rates, small objects and consistently low storage latency. This account type supports LRS and ZRS; ZRS replicates the data synchronously across the availability zones of the region, so the data survives a zone failure and never leaves the region.
    fr: |
      Un compte d'objets blob de blocs Premium stocke les objets blob de blocs et d'ajout sur des SSD ; il est recommandé pour des taux de transactions élevés, de petits objets et une latence de stockage constamment faible. Ce type de compte prend en charge LRS et ZRS ; ZRS réplique les données de façon synchrone dans les zones de disponibilité de la région : les données survivent à une défaillance de zone et ne quittent jamais la région.
  options:
    gpv2: { en: "A standard account runs on hard disk drives and does not provide consistently low latency at very high transaction rates.", fr: "Un compte standard repose sur des disques durs et n'offre pas une latence constamment faible à des taux de transactions très élevés." }
    pfs: { en: "A premium file shares account hosts Azure Files only, not block blobs.", fr: "Un compte de partages de fichiers Premium n'héberge qu'Azure Files, pas des objets blob de blocs." }
    lrs: { en: "LRS keeps all copies in a single datacenter, which does not protect against the loss of a zone.", fr: "LRS conserve toutes les copies dans un seul centre de données, ce qui ne protège pas contre la perte d'une zone." }
    grs: { en: "GRS and GZRS copy the data to a second region and are not available for premium block blobs accounts.", fr: "GRS et GZRS copient les données dans une seconde région et ne sont pas disponibles pour les comptes d'objets blob de blocs Premium." }
references:
  - title: Overview of storage accounts
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
