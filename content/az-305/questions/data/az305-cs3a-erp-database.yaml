id: az305-cs3a-erp-database
objective: "2.1.1"
type: single
caseStudy: az305-cs3a-vanarsdel
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a target for the SQL Server instance of the ERP. The solution must meet the business and technical requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une cible pour l'instance SQL Server de l'ERP. La solution doit satisfaire les exigences métier et techniques.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An Azure SQL Database elastic pool", fr: "Un pool élastique Azure SQL Database" } }
    - { id: b, text: { en: "Azure SQL Database in the Hyperscale service tier", fr: "Azure SQL Database dans le niveau de service Hyperscale" } }
    - { id: c, text: { en: "Azure SQL Managed Instance", fr: "Azure SQL Managed Instance" } }
    - { id: d, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur des machines virtuelles Azure" } }
answer: { optionId: d }
explanation:
  correct:
    en: "The business requirements prefer a platform service only when it meets every technical requirement. The vendor's agent must be installed on the operating system of the database server, and SSRS must run on that server. Neither is possible on a platform service, which gives no access to the host. SQL Server on Azure Virtual Machines keeps full control of the instance and of the operating system, and it also supports the cross-database queries, SQL Server Agent jobs and Service Broker that the ERP uses."
    fr: "Les exigences métier ne préfèrent un service de plateforme que s'il satisfait toutes les exigences techniques. L'agent de l'éditeur doit être installé sur le système d'exploitation du serveur de bases de données, et SSRS doit s'exécuter sur ce serveur. Ni l'un ni l'autre n'est possible sur un service de plateforme, qui ne donne aucun accès à l'hôte. SQL Server sur des machines virtuelles Azure conserve le contrôle complet de l'instance et du système d'exploitation, et prend aussi en charge les requêtes entre bases de données, les travaux SQL Server Agent et Service Broker que l'ERP utilise."
  options:
    a:
      en: "Azure SQL Database has no SQL Server Agent, no Service Broker and no cross-database queries, and it gives no access to an operating system. An elastic pool only shares resources between such databases."
      fr: "Azure SQL Database n'offre ni SQL Server Agent, ni Service Broker, ni requêtes entre bases de données, et ne donne accès à aucun système d'exploitation. Un pool élastique ne fait que partager des ressources entre de telles bases de données."
    b:
      en: "Hyperscale changes the storage architecture and the maximum size of a database. It is still Azure SQL Database, with the same missing features and no access to the host."
      fr: "Hyperscale change l'architecture de stockage et la taille maximale d'une base de données. Il s'agit toujours d'Azure SQL Database, avec les mêmes fonctionnalités absentes et sans accès à l'hôte."
    c:
      en: "SQL Managed Instance supports cross-database queries, SQL Server Agent and Service Broker, but Microsoft manages its operating system. The vendor's agent can't be installed on it, and it doesn't host SSRS."
      fr: "SQL Managed Instance prend en charge les requêtes entre bases de données, SQL Server Agent et Service Broker, mais Microsoft gère son système d'exploitation. L'agent de l'éditeur ne peut pas y être installé, et elle n'héberge pas SSRS."
references:
  - title: What is Azure SQL?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/azure-sql-iaas-vs-paas-what-is-overview
  - title: "Features comparison: Azure SQL Database and Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
