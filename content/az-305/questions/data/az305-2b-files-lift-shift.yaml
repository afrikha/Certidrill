id: az305-2b-files-lift-shift
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware runs a document-processing application on four on-premises Windows Server virtual machines. The servers exchange files through a shared folder that they access with the SMB protocol.

    Litware plans to move the virtual machines to Azure without modifying the application.

    You need to recommend a storage solution for the shared folder. The solution must be accessible from the four virtual machines at the same time and must minimize administrative effort.

    What should you recommend?
  fr: |
    Litware exécute une application de traitement de documents sur quatre machines virtuelles Windows Server locales. Les serveurs échangent des fichiers par l'intermédiaire d'un dossier partagé auquel ils accèdent avec le protocole SMB.

    Litware prévoit de déplacer les machines virtuelles vers Azure sans modifier l'application.

    Vous devez recommander une solution de stockage pour le dossier partagé. La solution doit être accessible depuis les quatre machines virtuelles en même temps et réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A Premium SSD managed disk attached to one of the virtual machines", fr: "Un disque managé Premium SSD attaché à l'une des machines virtuelles" }
    - id: b
      text: { en: "An Azure Blob Storage container", fr: "Un conteneur Stockage Blob Azure" }
    - id: c
      text: { en: "An Azure file share", fr: "Un partage de fichiers Azure" }
    - id: d
      text: { en: "An Azure Table Storage table", fr: "Une table Stockage Table Azure" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure Files provides fully managed file shares that are mounted with the standard SMB protocol, so an application that already uses file system APIs on a shared folder can be moved without changes. The share is reachable from all the virtual machines at once, and there is no file server to maintain.
    fr: |
      Azure Files fournit des partages de fichiers entièrement managés, montés avec le protocole SMB standard : une application qui utilise déjà les API de système de fichiers sur un dossier partagé peut être déplacée sans modification. Le partage est accessible depuis toutes les machines virtuelles à la fois, et il n'y a aucun serveur de fichiers à maintenir.
  options:
    a:
      en: A managed disk stores data for the virtual machine it is attached to; sharing it with the other servers would require running and maintaining a file server on that machine.
      fr: "Un disque managé stocke les données de la machine virtuelle à laquelle il est attaché ; le partager avec les autres serveurs obligerait à exécuter et à maintenir un serveur de fichiers sur cette machine."
    b:
      en: Blob Storage is object storage accessed over HTTPS; it does not expose an SMB share, so the application would have to be modified.
      fr: "Stockage Blob est un stockage d'objets accessible en HTTPS ; il n'expose pas de partage SMB, et l'application devrait donc être modifiée."
    d:
      en: Table Storage holds key/attribute entities, not files.
      fr: "Stockage Table contient des entités clé/attribut, pas des fichiers."
references:
  - title: Introduction to Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-introduction
  - title: Plan an Azure Files deployment
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-planning
