id: az305-cs4b-sales-lake
objective: "2.2.2"
type: single
caseStudy: az305-cs4b-fourthcoffee
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a storage solution for the data lake of Fourth Coffee. The solution must meet the data lake requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution de stockage pour le lac de données de Fourth Coffee. La solution doit respecter les exigences relatives au lac de données.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: A standard general-purpose v2 storage account that has the hierarchical namespace enabled
        fr: Un compte de stockage standard à usage général v2 dont l'espace de noms hiérarchique est activé
    - id: b
      text:
        en: A standard general-purpose v2 storage account that has the hierarchical namespace disabled
        fr: Un compte de stockage standard à usage général v2 dont l'espace de noms hiérarchique est désactivé
    - id: c
      text:
        en: A file share in an Azure Files storage account
        fr: Un partage de fichiers dans un compte de stockage Azure Files
    - id: d
      text:
        en: A volume in an Azure NetApp Files capacity pool
        fr: Un volume dans un pool de capacité Azure NetApp Files
answer: { optionId: a }
explanation:
  correct:
    en: |
      Enabling the hierarchical namespace on a storage account turns Blob Storage into Azure Data Lake Storage. Objects are organized in real directories: renaming or deleting a directory is a single atomic metadata operation, and POSIX access control lists can be set on directories and files, in addition to Azure RBAC. Spark reaches the data through the ABFS driver, and the data keeps the price, the access tiers and the lifecycle management of Blob Storage.
    fr: |
      Activer l'espace de noms hiérarchique sur un compte de stockage transforme le Stockage Blob en Azure Data Lake Storage. Les objets sont organisés en véritables répertoires : renommer ou supprimer un répertoire est une seule opération atomique sur les métadonnées, et des listes de contrôle d'accès POSIX peuvent être définies sur les répertoires et les fichiers, en plus d'Azure RBAC. Spark atteint les données par le pilote ABFS, et les données conservent le prix, les niveaux d'accès et la gestion du cycle de vie du Stockage Blob.
  options:
    b:
      en: "In a flat namespace, a directory is only a prefix in the names of the blobs: renaming it means processing every blob, and no access control list can be set on it."
      fr: "Dans un espace de noms plat, un répertoire n'est qu'un préfixe dans le nom des objets blob : le renommer revient à traiter chaque objet blob, et aucune liste de contrôle d'accès ne peut y être définie."
    c:
      en: "Azure Files provides SMB and NFS file shares for applications and users. It is not object storage with blob access tiers and it is not read through the ABFS driver."
      fr: "Azure Files fournit des partages de fichiers SMB et NFS pour des applications et des utilisateurs. Ce n'est pas un stockage d'objets doté des niveaux d'accès des objets blob, et il n'est pas lu par le pilote ABFS."
    d:
      en: "Azure NetApp Files is a high-performance file service billed by provisioned capacity, not object storage at Blob Storage prices."
      fr: "Azure NetApp Files est un service de fichiers hautes performances facturé à la capacité provisionnée, pas un stockage d'objets au prix du Stockage Blob."
references:
  - title: Introduction to Azure Data Lake Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction
