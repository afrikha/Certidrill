difficulty: 1
status: draft
stem:
  en: |
    You recommend multi-region writes with the Session consistency level.
  fr: |
    Vous recommandez les écritures multirégions avec le niveau de cohérence Session.
body:
  solution:
    en: |
      You recommend an account that is replicated to the three regions with **multi-region writes** enabled. The default consistency level of the account is **Session**, and each deployment lists its own region first in its preferred regions.
    fr: |
      Vous recommandez un compte répliqué dans les trois régions avec les **écritures multirégions** activées. Le niveau de cohérence par défaut du compte est **Session**, et chaque déploiement place sa propre région en tête de ses régions préférées.
answer: { value: true }
explanation:
  correct:
    en: |
      With multi-region writes, every region of the account accepts writes, so each deployment writes to its local region. If one region is lost, the SDK redirects the requests to the next region of its preferred list: no downtime is expected and there is no failover to wait for. Session consistency guarantees that, within a session, a client reads its own writes, which is exactly the third requirement. Session is also a level that accounts with multiple write regions support.
    fr: |
      Avec les écritures multirégions, chaque région du compte accepte les écritures : chaque déploiement écrit donc dans sa région locale. Si une région est perdue, le SDK redirige les requêtes vers la région suivante de sa liste de préférences : aucune interruption n'est attendue et il n'y a aucun basculement à attendre. La cohérence Session garantit que, dans une session, un client relit ses propres écritures, ce qui correspond exactement à la troisième exigence. Session est aussi un niveau que les comptes à plusieurs régions d'écriture prennent en charge.
references:
