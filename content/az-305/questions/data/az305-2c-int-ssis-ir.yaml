id: az305-2c-int-ssis-ir
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs 250 SQL Server Integration Services (SSIS) packages on an on-premises SQL Server instance. The packages load a data warehouse that is being migrated to Azure SQL Managed Instance.

    You need to recommend a solution to run the packages in Azure. The solution must meet the following requirements:

    - Minimize the changes made to the existing packages.
    - Avoid deploying virtual machines that Fabrikam must patch.
    - Start the packages from scheduled pipelines.

    What should you include in the recommendation?
  fr: |
    Fabrikam exécute 250 packages SQL Server Integration Services (SSIS) sur une instance SQL Server locale. Les packages alimentent un entrepôt de données en cours de migration vers Azure SQL Managed Instance.

    Vous devez recommander une solution pour exécuter les packages dans Azure. La solution doit répondre aux exigences suivantes :

    - Réduire au minimum les modifications apportées aux packages existants.
    - Éviter de déployer des machines virtuelles que Fabrikam devrait mettre à jour.
    - Démarrer les packages à partir de pipelines planifiés.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "Azure Data Factory with an Azure-SSIS integration runtime", fr: "Azure Data Factory avec un runtime d'intégration Azure-SSIS" } }
    - { id: b, text: { en: "Azure Synapse Analytics pipelines with an Azure integration runtime", fr: "Des pipelines Azure Synapse Analytics avec un runtime d'intégration Azure" } }
    - { id: c, text: { en: "Azure Data Factory with mapping data flows on an Azure integration runtime", fr: "Azure Data Factory avec des flux de données de mappage sur un runtime d'intégration Azure" } }
    - { id: d, text: { en: "SQL Server on Azure Virtual Machines with the Integration Services feature", fr: "SQL Server sur Machines virtuelles Azure avec la fonctionnalité Integration Services" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Azure-SSIS integration runtime is a managed cluster dedicated to running SSIS packages, so the existing packages are lifted and shifted without being rewritten. Data Factory pipelines start them with the Execute SSIS Package activity on a schedule, and Fabrikam has no virtual machine to maintain.
    fr: |
      Le runtime d'intégration Azure-SSIS est un cluster managé dédié à l'exécution des packages SSIS : les packages existants sont donc migrés tels quels, sans réécriture. Les pipelines Data Factory les démarrent selon une planification avec l'activité Exécuter le package SSIS, et Fabrikam n'a aucune machine virtuelle à maintenir.
  options:
    b:
      en: Synapse pipelines support the Azure and self-hosted integration runtimes, not the Azure-SSIS integration runtime, so they can't execute the packages.
      fr: Les pipelines Synapse prennent en charge les runtimes d'intégration Azure et auto-hébergé, pas le runtime Azure-SSIS ; ils ne peuvent donc pas exécuter les packages.
    c:
      en: Mapping data flows would require every package to be redesigned as a data flow, which doesn't minimize the changes.
      fr: Les flux de données de mappage imposeraient de reconcevoir chaque package sous forme de flux de données, ce qui ne réduit pas les modifications.
    d:
      en: SQL Server on a virtual machine runs the packages unchanged, but Fabrikam would have to patch the operating system and SQL Server itself.
      fr: SQL Server sur une machine virtuelle exécute les packages sans changement, mais Fabrikam devrait mettre à jour elle-même le système d'exploitation et SQL Server.
references:
  - title: Integration runtime in Azure Data Factory
    url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-integration-runtime
