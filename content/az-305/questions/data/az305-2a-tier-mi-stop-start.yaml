id: az305-2a-tier-mi-stop-start
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware uses an Azure SQL Managed Instance in the General Purpose service tier for user acceptance testing. Testers work on weekdays from 08:00 to 18:00. Outside those hours nobody connects to the instance.

    You need to recommend how to reduce the cost of the instance. The solution must meet the following requirements:

    - Keep the instance and its databases.
    - Make no commitment beyond the current quarter.
    - Keep the performance that testers have today during working hours.
    - Minimize the compute cost.

    What should you recommend?
  fr: |
    Proseware utilise une instance Azure SQL Managed Instance au niveau de service General Purpose pour les tests de recette. Les testeurs travaillent en semaine de 8 h à 18 h. En dehors de ces horaires, personne ne se connecte à l'instance.

    Vous devez recommander comment réduire le coût de l'instance. La solution doit répondre aux exigences suivantes :

    - Conserver l'instance et ses bases de données.
    - Ne prendre aucun engagement au-delà du trimestre en cours.
    - Conserver pendant les heures de travail les performances dont les testeurs disposent aujourd'hui.
    - Réduire au minimum le coût du calcul.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Purchase a one-year reservation for the instance.", fr: "Acheter une réservation d'un an pour l'instance." }
    - id: b
      text: { en: "Scale the instance down to fewer vCores every evening and scale it up every morning.", fr: "Réduire le nombre de vCores de l'instance chaque soir et l'augmenter chaque matin." }
    - id: c
      text: { en: "Reduce the number of vCores of the instance permanently.", fr: "Réduire de façon permanente le nombre de vCores de l'instance." }
    - id: d
      text: { en: "Configure a stop and start schedule for the instance.", fr: "Configurer une planification d'arrêt et de démarrage de l'instance." }
answer: { optionId: d }
explanation:
  correct:
    en: An instance in the General Purpose service tier can be stopped and started, manually or on a schedule. Stopping it is similar to deallocating a virtual machine. Compute and licensing are no longer billed, and only data and backup storage are. A schedule that stops the instance at night and during weekends removes most of the billed hours without changing its size.
    fr: Une instance au niveau de service General Purpose peut être arrêtée et démarrée, manuellement ou selon une planification. L'arrêter revient à libérer une machine virtuelle. Le calcul et les licences ne sont plus facturés, et seuls le stockage des données et celui des sauvegardes le sont. Une planification qui arrête l'instance la nuit et le week-end supprime la plupart des heures facturées sans changer sa taille.
  options:
    a:
      en: A reservation is a commitment of one or three years, which Proseware excludes.
      fr: Une réservation est un engagement d'un an ou de trois ans, ce que Proseware exclut.
    b:
      en: A smaller instance is still billed for compute and licensing all night and all weekend, whereas a stopped instance isn't.
      fr: Une instance plus petite reste facturée pour le calcul et les licences toute la nuit et tout le week-end, contrairement à une instance arrêtée.
    c:
      en: Fewer vCores lower the price but also the performance during working hours, and the instance is still billed when nobody uses it.
      fr: Moins de vCores réduisent le prix, mais aussi les performances pendant les heures de travail, et l'instance reste facturée quand personne ne l'utilise.
references:
  - title: Stop and start an instance - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/instance-stop-start-how-to
