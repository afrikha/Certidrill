id: az305-2a-protect-ddm
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores customer records in Azure SQL Database. Support agents query the Customers table with a reporting tool.

    You need to recommend a solution that meets the following requirements:

    - Support agents must see only the last four digits of a payment card number and a partially hidden e-mail address.
    - The stored data must not be modified.
    - The queries of the existing applications must not change.
    - Authorized finance users must still see the full values.

    What should you recommend?
  fr: |
    Contoso stocke des fiches clients dans Azure SQL Database. Les agents du support interrogent la table Customers avec un outil de reporting.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Les agents du support ne doivent voir que les quatre derniers chiffres d'un numéro de carte de paiement et une adresse e-mail partiellement cachée.
    - Les données stockées ne doivent pas être modifiées.
    - Les requêtes des applications existantes ne doivent pas changer.
    - Les utilisateurs autorisés de la finance doivent continuer à voir les valeurs complètes.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Dynamic data masking", fr: "Le masquage dynamique des données" }
    - id: b
      text: { en: "Always Encrypted", fr: "Always Encrypted" }
    - id: c
      text: { en: "Transparent data encryption", fr: "Transparent Data Encryption" }
    - id: d
      text: { en: "Row-level security", fr: "La sécurité au niveau des lignes" }
answer: { optionId: a }
explanation:
  correct:
    en: Dynamic data masking applies a masking rule to a column, such as showing only the last four digits or a partial e-mail address. The mask is applied to query results for users without the UNMASK permission, while the stored data stays unchanged and queries keep working as they are.
    fr: Le masquage dynamique des données applique une règle de masquage à une colonne, par exemple n'afficher que les quatre derniers chiffres ou une adresse e-mail partielle. Le masque s'applique aux résultats des requêtes pour les utilisateurs sans l'autorisation UNMASK, tandis que les données stockées restent inchangées et que les requêtes continuent de fonctionner telles quelles.
  options:
    b:
      en: Always Encrypted hides the whole value from anyone without the keys. It can't reveal just the last four digits, and client applications must use a driver that supports it.
      fr: Always Encrypted cache la valeur entière à quiconque n'a pas les clés. Il ne peut pas révéler uniquement les quatre derniers chiffres, et les applications clientes doivent utiliser un pilote qui le prend en charge.
    c:
      en: Transparent data encryption encrypts the files at rest. Every authorized query still returns the full values.
      fr: Transparent Data Encryption chiffre les fichiers au repos. Toute requête autorisée renvoie encore les valeurs complètes.
    d:
      en: Row-level security hides entire rows from a user. It doesn't mask part of a column value.
      fr: La sécurité au niveau des lignes cache des lignes entières à un utilisateur. Elle ne masque pas une partie de la valeur d'une colonne.
references:
  - title: Dynamic data masking
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/dynamic-data-masking-overview
