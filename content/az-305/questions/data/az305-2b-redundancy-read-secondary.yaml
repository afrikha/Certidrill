id: az305-2b-redundancy-read-secondary
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys stores its product catalog as block blobs in a standard general-purpose v2 storage account. A web application reads the catalog.

    You need to recommend a redundancy option that meets the following requirements:

    - Writes must continue without any failover if an availability zone of the primary region fails.
    - The data must be protected against a regional disaster.
    - If the primary region becomes unavailable, the web application must be able to read the catalog immediately, before any failover is initiated.

    Which redundancy option should you recommend?
  fr: |
    Tailspin Toys stocke son catalogue de produits sous forme d'objets blob de blocs dans un compte de stockage standard usage général v2. Une application web lit le catalogue.

    Vous devez recommander une option de redondance qui répond aux exigences suivantes :

    - Les écritures doivent se poursuivre sans aucun basculement si une zone de disponibilité de la région primaire tombe en panne.
    - Les données doivent être protégées contre un sinistre régional.
    - Si la région primaire devient indisponible, l'application web doit pouvoir lire le catalogue immédiatement, avant le lancement de tout basculement.

    Quelle option de redondance devez-vous recommander ?
body:
  options:
    - { id: a, text: GZRS }
    - { id: b, text: RA-GRS }
    - { id: c, text: RA-GZRS }
    - { id: d, text: ZRS }
answer: { optionId: c }
explanation:
  correct:
    en: |
      RA-GZRS combines ZRS in the primary region, which keeps accepting writes when a zone fails, with an asynchronous copy in a secondary region. The read-access option exposes a secondary endpoint that applications can read at any time, including during an outage of the primary region and before a failover.
    fr: |
      RA-GZRS combine ZRS dans la région primaire, qui continue d'accepter les écritures lorsqu'une zone tombe en panne, et une copie asynchrone dans une région secondaire. L'option d'accès en lecture expose un point de terminaison secondaire que les applications peuvent lire à tout moment, y compris pendant une panne de la région primaire et avant un basculement.
  options:
    a:
      en: GZRS protects against a zone failure and a regional disaster, but the secondary copy cannot be read until a failover occurs.
      fr: "GZRS protège contre une défaillance de zone et un sinistre régional, mais la copie secondaire ne peut pas être lue avant un basculement."
    b:
      en: RA-GRS offers reads from the secondary region, but the primary region uses LRS, which keeps the copies in a single datacenter.
      fr: "RA-GRS permet de lire dans la région secondaire, mais la région primaire utilise LRS, qui conserve les copies dans un seul centre de données."
    d:
      en: ZRS keeps all copies in one region and does not protect against a regional disaster.
      fr: "ZRS conserve toutes les copies dans une seule région et ne protège pas contre un sinistre régional."
references:
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
  - title: Azure storage disaster recovery planning and failover
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-disaster-recovery-guidance
