id: az305-cs3a-telemetry-platform
objective: "2.3.2"
type: dropdown
caseStudy: az305-cs3a-vanarsdel
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend the services of the telemetry platform. The solution must meet the technical requirements and minimize administrative effort.

    What should you recommend for each function? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander les services de la plateforme de télémétrie. La solution doit satisfaire les exigences techniques et réduire l'effort d'administration au minimum.

    Que devez-vous recommander pour chaque fonction ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Ingest the sensor readings: [[ingest]]

      Raise the vibration alerts: [[alert]]

      Store the readings for the engineers: [[store]]
    fr: |
      Ingérer les relevés des capteurs : [[ingest]]

      Déclencher les alertes de vibration : [[alert]]

      Stocker les relevés pour les ingénieurs : [[store]]
  slots:
    - id: ingest
      options:
        - { id: grid, text: Azure Event Grid }
        - { id: hubs, text: Azure Event Hubs }
        - { id: queue, text: { en: "Azure Queue Storage", fr: "Stockage File d'attente Azure" } }
        - { id: sbus, text: Azure Service Bus }
    - id: alert
      options:
        - { id: adf, text: Azure Data Factory }
        - { id: batch, text: Azure Batch }
        - { id: dbx, text: Azure Databricks }
        - { id: asa, text: Azure Stream Analytics }
    - id: store
      options:
        - { id: adx, text: Azure Data Explorer }
        - { id: cosmos, text: { en: "Azure Cosmos DB for NoSQL", fr: "Azure Cosmos DB for NoSQL" } }
        - { id: sqlpool, text: { en: "A dedicated SQL pool in Azure Synapse Analytics", fr: "Un pool SQL dédié dans Azure Synapse Analytics" } }
        - { id: table, text: { en: "Azure Table storage", fr: "Stockage Table Azure" } }
answer:
  values: { ingest: hubs, alert: asa, store: adx }
explanation:
  correct:
    en: "Azure Event Hubs ingests streams of events and keeps them for a retention period (up to seven days in the Standard tier), during which each consumer group reads and rereads the stream independently. Azure Stream Analytics is a fully managed engine whose SQL-like queries aggregate events over time windows, with an event hub as input. Azure Data Explorer is built for interactive analysis of large volumes of raw telemetry, with native time series functions for anomaly detection and forecasting."
    fr: "Azure Event Hubs ingère des flux d'événements et les conserve pendant une période de rétention (jusqu'à sept jours dans le niveau Standard), durant laquelle chaque groupe de consommateurs lit et relit le flux indépendamment. Azure Stream Analytics est un moteur entièrement managé dont les requêtes de type SQL agrègent les événements sur des fenêtres de temps, avec un hub d'événements en entrée. Azure Data Explorer est conçu pour l'analyse interactive de grands volumes de télémétrie brute, avec des fonctions natives de séries chronologiques pour la détection d'anomalies et la prévision."
  options:
    grid:
      en: "Event Grid routes discrete events to handlers. It doesn't keep a stream that several applications can read again for three days."
      fr: "Event Grid achemine des événements discrets vers des gestionnaires. Il ne conserve pas un flux que plusieurs applications peuvent relire pendant trois jours."
    queue:
      en: "A message of a storage queue is removed once a consumer has processed it, so independent applications can't each read the whole stream."
      fr: "Un message d'une file d'attente de stockage est supprimé une fois qu'un consommateur l'a traité : des applications indépendantes ne peuvent donc pas lire chacune le flux entier."
    sbus:
      en: "Service Bus is a transactional message broker. A message is removed when its receiver completes it, and it can't be replayed by other applications."
      fr: "Service Bus est un répartiteur de messages transactionnel. Un message est supprimé lorsque son récepteur l'a terminé, et d'autres applications ne peuvent pas le relire."
    adf:
      en: "Data Factory orchestrates scheduled data movement and transformation. It doesn't evaluate a stream over a five-minute window as events arrive."
      fr: "Data Factory orchestre des déplacements et des transformations de données planifiés. Il n'évalue pas un flux sur une fenêtre de cinq minutes à l'arrivée des événements."
    batch:
      en: "Azure Batch schedules parallel compute jobs on pools of virtual machines. It isn't a stream processing engine."
      fr: "Azure Batch planifie des travaux de calcul parallèles sur des pools de machines virtuelles. Ce n'est pas un moteur de traitement de flux."
    dbx:
      en: "Spark Structured Streaming on Azure Databricks can compute the windows, but it runs on Spark clusters that the team would have to configure and manage. The requirement asks for a service without clusters."
      fr: "Spark Structured Streaming sur Azure Databricks peut calculer les fenêtres, mais il s'exécute sur des clusters Spark que l'équipe devrait configurer et gérer. L'exigence demande un service sans cluster."
    cosmos:
      en: "Azure Cosmos DB is an operational store for point reads and writes of documents. It has no built-in time series functions for anomaly detection or forecasting."
      fr: "Azure Cosmos DB est un magasin opérationnel pour des lectures et écritures ponctuelles de documents. Il n'a pas de fonctions intégrées de séries chronologiques pour la détection d'anomalies ou la prévision."
    sqlpool:
      en: "A dedicated SQL pool is a data warehouse for data loaded into modeled, distributed tables. The engineers must query raw JSON readings without modeling them first."
      fr: "Un pool SQL dédié est un entrepôt de données pour des données chargées dans des tables distribuées et modélisées. Les ingénieurs doivent interroger des relevés JSON bruts sans les modéliser au préalable."
    table:
      en: "Table storage is a key-value store queried by partition key and row key. It offers no analytical query engine."
      fr: "Le stockage Table est un magasin clé-valeur interrogé par clé de partition et clé de ligne. Il n'offre aucun moteur de requête analytique."
references:
  - title: Compare Azure Event Hubs tiers
    url: https://learn.microsoft.com/en-us/azure/event-hubs/compare-tiers
  - title: What is Azure Data Explorer?
    url: https://learn.microsoft.com/en-us/azure/data-explorer/data-explorer-overview
