id: az305-2a-scale-named-replica
objective: "2.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum plans to migrate a 6 TB transactional database to a single database in Azure SQL Database. A data science team will run long read-only analytical queries on the same data.

    You need to recommend a design that meets the following requirements:

    - The data science team must connect to its own replica, by using a separate database name.
    - The compute size of that replica must be chosen independently of the primary.
    - The replica must use the same storage as the primary and not a second copy of the data.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de migrer une base de données transactionnelle de 6 To vers une base de données unique Azure SQL Database. Une équipe de science des données exécutera de longues requêtes analytiques en lecture seule sur les mêmes données.

    Vous devez recommander une conception qui répond aux exigences suivantes :

    - L'équipe de science des données doit se connecter à son propre réplica, à l'aide d'un nom de base de données distinct.
    - La taille de calcul de ce réplica doit être choisie indépendamment du réplica principal.
    - Le réplica doit utiliser le même stockage que le réplica principal, et non une seconde copie des données.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Service tier of the database: [[tier]]

      Replica for the data science team: [[replica]]
    fr: |
      Niveau de service de la base de données : [[tier]]

      Réplica de l'équipe de science des données : [[replica]]
  slots:
    - id: tier
      options:
        - { id: gp, text: General Purpose }
        - { id: bc, text: Business Critical }
        - { id: hs, text: Hyperscale }
    - id: replica
      options:
        - { id: ha, text: { en: "High-availability replica", fr: "Réplica de haute disponibilité" } }
        - { id: named, text: { en: "Named replica", fr: "Réplica nommé" } }
        - { id: geo, text: { en: "Geo-replica", fr: "Géoréplica" } }
answer:
  values: { tier: hs, replica: named }
explanation:
  correct:
    en: A 6 TB database exceeds the 4 TB limit of General Purpose and Business Critical, so the database must be in Hyperscale. A Hyperscale named replica is a read-only replica with its own database name and its own service level objective. It reads from the same page servers as the primary, so no second copy of the data is stored.
    fr: Une base de données de 6 To dépasse la limite de 4 To de General Purpose et de Business Critical. La base de données doit donc être en Hyperscale. Un réplica nommé Hyperscale est un réplica en lecture seule doté de son propre nom de base de données et de son propre objectif de niveau de service. Il lit sur les mêmes serveurs de pages que le réplica principal, donc aucune seconde copie des données n'est stockée.
  options:
    gp: { en: "General Purpose stores at most 4 TB and has no readable replica.", fr: "General Purpose stocke au plus 4 To et n'a pas de réplica lisible." }
    bc: { en: "Business Critical stores at most 4 TB.", fr: "Business Critical stocke au plus 4 To." }
    ha: { en: "A high-availability replica has the same compute size and the same database name as the primary, and it is a failover target.", fr: "Un réplica de haute disponibilité a la même taille de calcul et le même nom de base de données que le réplica principal, et il sert de cible de basculement." }
    geo: { en: "A geo-replica keeps its own copy of the data and is meant for disaster recovery.", fr: "Un géoréplica conserve sa propre copie des données et sert à la reprise d'activité." }
references:
  - title: Hyperscale secondary replicas
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale-replicas
