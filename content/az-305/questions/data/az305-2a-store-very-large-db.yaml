id: az305-2a-store-very-large-db
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders stores its shipment history in an on-premises SQL Server database. The database holds 45 TB of data and is expected to reach 60 TB within three years. It uses only database-scoped features.

    You need to recommend a target in Azure that meets the following requirements:

    - Keep all the data in one database, with no change to the application.
    - Leave no operating system or SQL Server patching to Northwind Traders.
    - Rely on backups that are managed by the platform.

    What should you recommend?
  fr: |
    Northwind Traders stocke l'historique de ses expéditions dans une base de données SQL Server locale. La base de données contient 45 To de données et devrait atteindre 60 To d'ici trois ans. Elle n'utilise que des fonctionnalités de niveau base de données.

    Vous devez recommander une cible dans Azure qui répond aux exigences suivantes :

    - Conserver toutes les données dans une seule base de données, sans modifier l'application.
    - Ne laisser à Northwind Traders aucune mise à jour du système d'exploitation ni de SQL Server.
    - S'appuyer sur des sauvegardes gérées par la plateforme.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Azure SQL Managed Instance in the Next-gen General Purpose service tier", fr: "Azure SQL Managed Instance au niveau de service Next-gen General Purpose" }
    - id: b
      text: { en: "Azure SQL Database in the Business Critical service tier", fr: "Azure SQL Database au niveau de service Business Critical" }
    - id: c
      text: { en: "SQL Server on Azure Virtual Machines with Premium SSD v2 disks", fr: "SQL Server sur machines virtuelles Azure avec des disques SSD Premium v2" }
    - id: d
      text: { en: "Azure SQL Database in the Hyperscale service tier", fr: "Azure SQL Database au niveau de service Hyperscale" }
answer: { optionId: d }
explanation:
  correct:
    en: Among the platform services, only the Hyperscale service tier of Azure SQL Database stores a database of this size. Its storage is decoupled from compute and grows up to 128 TB. Patching and backups remain the platform's job, and the application keeps a single database.
    fr: Parmi les services de plateforme, seul le niveau de service Hyperscale d'Azure SQL Database stocke une base de données de cette taille. Son stockage est découplé du calcul et s'étend jusqu'à 128 To. Les mises à jour correctives et les sauvegardes restent à la charge de la plateforme, et l'application conserve une seule base de données.
  options:
    a:
      en: SQL Managed Instance stores at most 16 TB per instance, or 32 TB in the Next-gen General Purpose tier, which is below the current 45 TB.
      fr: SQL Managed Instance stocke au plus 16 To par instance, ou 32 To au niveau Next-gen General Purpose, ce qui est inférieur aux 45 To actuels.
    b:
      en: A Business Critical database is limited to 4 TB.
      fr: Une base de données Business Critical est limitée à 4 To.
    c:
      en: A virtual machine can hold the data, but Northwind Traders would patch Windows and SQL Server and design the backups itself.
      fr: Une machine virtuelle peut contenir les données, mais Northwind Traders devrait mettre à jour Windows et SQL Server et concevoir lui-même les sauvegardes.
references:
  - title: Hyperscale service tier
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale
  - title: "Features comparison: Azure SQL Database and Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
