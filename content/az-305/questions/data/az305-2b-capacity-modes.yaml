id: az305-2b-capacity-modes
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans three Azure Cosmos DB for NoSQL workloads. You need to recommend a capacity mode for each workload. The solution must minimize costs and must not throttle the expected traffic.

    Which capacity mode should you recommend for each workload? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit trois charges de travail Azure Cosmos DB for NoSQL. Vous devez recommander un mode de capacité pour chaque charge de travail. La solution doit réduire les coûts au minimum et ne doit pas limiter le trafic attendu.

    Quel mode de capacité devez-vous recommander pour chaque charge de travail ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Order processing - two regions, a steady 20,000 RU/s 24 hours a day: [[orders]]

      Ticket sales - three regions, unpredictable traffic that is low most of the day and reaches 40,000 RU/s when a sale opens: [[tickets]]

      Internal prototype - one region, used a few hours per week with long idle periods: [[proto]]
    fr: |
      Traitement des commandes - deux régions, 20 000 RU/s stables 24 heures sur 24 : [[orders]]

      Vente de billets - trois régions, trafic imprévisible, faible la majeure partie de la journée et atteignant 40 000 RU/s à l'ouverture d'une vente : [[tickets]]

      Prototype interne - une région, utilisé quelques heures par semaine avec de longues périodes d'inactivité : [[proto]]
  slots:
    - id: orders
      options:
        - { id: manual, text: { en: "Standard (manual) provisioned throughput", fr: "Débit approvisionné standard (manuel)" } }
        - { id: auto, text: { en: "Autoscale provisioned throughput", fr: "Débit approvisionné à mise à l'échelle automatique" } }
        - { id: sls, text: Serverless }
    - id: tickets
      options:
        - { id: manual, text: { en: "Standard (manual) provisioned throughput", fr: "Débit approvisionné standard (manuel)" } }
        - { id: auto, text: { en: "Autoscale provisioned throughput", fr: "Débit approvisionné à mise à l'échelle automatique" } }
        - { id: sls, text: Serverless }
    - id: proto
      options:
        - { id: manual, text: { en: "Standard (manual) provisioned throughput", fr: "Débit approvisionné standard (manuel)" } }
        - { id: auto, text: { en: "Autoscale provisioned throughput", fr: "Débit approvisionné à mise à l'échelle automatique" } }
        - { id: sls, text: Serverless }
answer:
  values: { orders: manual, tickets: auto, proto: sls }
explanation:
  correct:
    en: |
      Standard provisioned throughput suits sustained, predictable traffic: the RU/s are used all the time. Autoscale scales between 10% and 100% of the maximum you set and bills the highest RU/s reached in each hour, which fits variable or unpredictable traffic and still supports several regions. Serverless bills only the RUs consumed and fits intermittent traffic with long idle periods, but a serverless account runs in a single region.
    fr: |
      Le débit approvisionné standard convient à un trafic soutenu et prévisible : les RU/s sont utilisées en permanence. La mise à l'échelle automatique évolue entre 10 % et 100 % du maximum que vous fixez et facture les RU/s les plus élevées atteintes dans chaque heure, ce qui convient à un trafic variable ou imprévisible tout en prenant en charge plusieurs régions. Le mode serverless ne facture que les RU consommées et convient à un trafic intermittent avec de longues périodes d'inactivité, mais un compte serverless s'exécute dans une seule région.
  options:
    sls:
      en: Serverless cannot be used for the order processing and ticket sales workloads because they are replicated to several regions.
      fr: "Le mode serverless ne peut pas servir au traitement des commandes ni à la vente de billets, car ces charges de travail sont répliquées dans plusieurs régions."
    manual:
      en: For ticket sales, standard throughput would have to be provisioned at 40,000 RU/s all day and paid even when traffic is low.
      fr: "Pour la vente de billets, le débit standard devrait être approvisionné à 40 000 RU/s toute la journée et payé même quand le trafic est faible."
references:
  - title: How to choose between provisioned throughput and serverless
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/throughput-serverless
  - title: Create Azure Cosmos DB containers and databases with autoscale
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/provision-throughput-autoscale
