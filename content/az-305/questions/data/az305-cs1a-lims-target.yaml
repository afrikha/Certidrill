id: az305-cs1a-lims-target
objective: "2.1.1"
type: single
caseStudy: az305-cs1a-trey-research
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a target service for the LIMS and LIMS_Audit databases. The solution must meet the database requirements.

    What should you recommend?
  fr: |
    Vous devez recommander un service cible pour les bases de données LIMS et LIMS_Audit. La solution doit répondre aux exigences de base de données.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure SQL Managed Instance", fr: "Azure SQL Managed Instance" } }
    - { id: b, text: { en: "An Azure SQL Database elastic pool", fr: "Un pool élastique Azure SQL Database" } }
    - { id: c, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur des machines virtuelles Azure" } }
    - { id: d, text: { en: "Azure SQL Database in the Hyperscale service tier", fr: "Azure SQL Database au niveau de service Hyperscale" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure SQL Managed Instance is a platform service: Microsoft patches the operating system and the database engine. It supports SQL Server Agent jobs, CLR assemblies and cross-database queries between databases of the same instance, so the application and the two databases can be migrated almost unchanged.
    fr: |
      Azure SQL Managed Instance est un service de plateforme : Microsoft applique les correctifs du système d'exploitation et du moteur de base de données. Le service prend en charge les travaux SQL Server Agent, les assemblys CLR et les requêtes entre bases de données d'une même instance ; l'application et les deux bases de données peuvent donc être migrées presque sans modification.
  options:
    b:
      en: Azure SQL Database, in an elastic pool or not, has no SQL Server Agent, no CLR and no three-part-name queries between databases; the application would have to be rewritten with elastic jobs and elastic queries.
      fr: Azure SQL Database, en pool élastique ou non, n'offre ni SQL Server Agent, ni CLR, ni requêtes à nom en trois parties entre bases de données ; l'application devrait être réécrite avec des travaux élastiques et des requêtes élastiques.
    c:
      en: SQL Server on a virtual machine keeps every feature, but Trey Research would have to patch and manage the operating system and SQL Server.
      fr: SQL Server sur une machine virtuelle conserve toutes les fonctionnalités, mais Trey Research devrait corriger et gérer le système d'exploitation et SQL Server.
    d:
      en: Hyperscale is a service tier of Azure SQL Database and has the same missing features; the size of the databases doesn't require it.
      fr: Hyperscale est un niveau de service d'Azure SQL Database et présente les mêmes fonctionnalités manquantes ; la taille des bases de données ne l'exige pas.
references:
  - title: "Features comparison: Azure SQL Database and Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
