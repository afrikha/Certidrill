id: az305-2c-int-fabric-zero-copy
objective: "2.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has adopted Microsoft Fabric as its analytics platform. You need to recommend how to make three data sources available in OneLake:

    - **Source 1**: 60 TB of Parquet files in an Azure Data Lake Storage account that other applications keep using. The files must stay where they are, and the data must not be stored twice.
    - **Source 2**: An Azure SQL database used by the order application. Analysts need the tables in OneLake in near real time, and no pipeline must be built or scheduled.
    - **Source 3**: The SFTP server of a supplier, which publishes CSV files once a day. The files must be loaded into a lakehouse every night at 02:00.

    What should you recommend for each source? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys a adopté Microsoft Fabric comme plateforme d'analytique. Vous devez recommander la façon de rendre trois sources de données disponibles dans OneLake :

    - **Source 1** : 60 To de fichiers Parquet dans un compte Azure Data Lake Storage que d'autres applications continuent d'utiliser. Les fichiers doivent rester là où ils sont, et les données ne doivent pas être stockées deux fois.
    - **Source 2** : une base de données Azure SQL utilisée par l'application de commandes. Les analystes ont besoin des tables dans OneLake en quasi-temps réel, et aucun pipeline ne doit être créé ni planifié.
    - **Source 3** : le serveur SFTP d'un fournisseur, qui publie des fichiers CSV une fois par jour. Les fichiers doivent être chargés dans un lakehouse chaque nuit à 02:00.

    Que devez-vous recommander pour chaque source ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Source 1: [[s1]]

      Source 2: [[s2]]

      Source 3: [[s3]]
    fr: |
      Source 1 : [[s1]]

      Source 2 : [[s2]]

      Source 3 : [[s3]]
  slots:
    - id: s1
      options:
        - { id: eventstream, text: { en: "An eventstream", fr: "Un flux d'événements (eventstream)" } }
        - { id: pipeline, text: { en: "A pipeline with a copy activity", fr: "Un pipeline avec une activité de copie" } }
        - { id: shortcut, text: { en: "A OneLake shortcut", fr: "Un raccourci OneLake" } }
        - { id: mirroring, text: { en: "Mirroring", fr: "La mise en miroir" } }
    - id: s2
      options:
        - { id: eventstream, text: { en: "An eventstream", fr: "Un flux d'événements (eventstream)" } }
        - { id: pipeline, text: { en: "A pipeline with a copy activity", fr: "Un pipeline avec une activité de copie" } }
        - { id: shortcut, text: { en: "A OneLake shortcut", fr: "Un raccourci OneLake" } }
        - { id: mirroring, text: { en: "Mirroring", fr: "La mise en miroir" } }
    - id: s3
      options:
        - { id: eventstream, text: { en: "An eventstream", fr: "Un flux d'événements (eventstream)" } }
        - { id: pipeline, text: { en: "A pipeline with a copy activity", fr: "Un pipeline avec une activité de copie" } }
        - { id: shortcut, text: { en: "A OneLake shortcut", fr: "Un raccourci OneLake" } }
        - { id: mirroring, text: { en: "Mirroring", fr: "La mise en miroir" } }
answer:
  values: { s1: shortcut, s2: mirroring, s3: pipeline }
explanation:
  correct:
    en: |
      A shortcut is a pointer from OneLake to data that stays in its original store, such as Azure Data Lake Storage, so nothing is copied or stored twice. Mirroring continuously replicates an operational database such as Azure SQL Database into OneLake in near real time, with no pipeline to author. Neither applies to files on an SFTP server: a scheduled pipeline with a copy activity loads them into the lakehouse. An eventstream ingests real-time events, which none of the three sources produces.
    fr: |
      Un raccourci est un pointeur de OneLake vers des données qui restent dans leur magasin d'origine, comme Azure Data Lake Storage : rien n'est copié ni stocké deux fois. La mise en miroir réplique en continu dans OneLake une base de données opérationnelle comme Azure SQL Database, en quasi-temps réel et sans pipeline à créer. Ni l'un ni l'autre ne s'applique à des fichiers sur un serveur SFTP : un pipeline planifié avec une activité de copie les charge dans le lakehouse. Un flux d'événements ingère des événements en temps réel, ce qu'aucune des trois sources ne produit.
references:
  - title: OneLake shortcuts
    url: https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts
  - title: What is Mirroring in Fabric?
    url: https://learn.microsoft.com/en-us/fabric/mirroring/overview
