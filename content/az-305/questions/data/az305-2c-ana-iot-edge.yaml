id: az305-2c-ana-iot-edge
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders operates 300 remote pumping stations. Each station has a gateway that runs Azure IoT Edge and sends sensor readings to an Azure IoT hub over a metered satellite link that is often unavailable.

    You need to recommend a solution to analyze the readings. The solution must meet the following requirements:

    - A pump must be stopped when its average pressure over a 30-second window exceeds a threshold, even while the satellite link is down.
    - Only aggregated values must be sent to Azure, to reduce the traffic on the link.
    - The team must reuse the SQL-based queries of the streaming jobs that it already runs in Azure.

    What should you recommend?
  fr: |
    Northwind Traders exploite 300 stations de pompage isolées. Chaque station possède une passerelle qui exécute Azure IoT Edge et envoie les relevés des capteurs à un hub IoT Azure par une liaison satellite facturée au volume et souvent indisponible.

    Vous devez recommander une solution pour analyser les relevés. La solution doit répondre aux exigences suivantes :

    - Une pompe doit être arrêtée lorsque sa pression moyenne sur une fenêtre de 30 secondes dépasse un seuil, même pendant que la liaison satellite est interrompue.
    - Seules des valeurs agrégées doivent être envoyées à Azure, afin de réduire le trafic sur la liaison.
    - L'équipe doit réutiliser les requêtes fondées sur SQL des travaux de streaming qu'elle exécute déjà dans Azure.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An Azure Stream Analytics job in Azure that uses the IoT hub as its input", fr: "Un travail Azure Stream Analytics dans Azure qui utilise le hub IoT comme entrée" } }
    - { id: b, text: { en: "Azure Stream Analytics jobs deployed as modules on the IoT Edge gateways", fr: "Des travaux Azure Stream Analytics déployés sous forme de modules sur les passerelles IoT Edge" } }
    - { id: c, text: { en: "IoT Hub message routing that sends the readings to an Azure Event Hubs endpoint", fr: "Le routage des messages IoT Hub, qui envoie les relevés vers un point de terminaison Azure Event Hubs" } }
    - { id: d, text: { en: "Spark Structured Streaming jobs in Azure Databricks that read from the IoT hub", fr: "Des travaux Spark Structured Streaming dans Azure Databricks qui lisent le hub IoT" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Stream Analytics jobs can be deployed to IoT Edge devices, where they support most features of the SQL-based query language of the cloud jobs and keep running whatever the state of the network. The windowed average is computed on the gateway, so the pump is stopped locally without waiting for the link, and only the aggregates are forwarded to the IoT hub.
    fr: |
      Des travaux Stream Analytics peuvent être déployés sur des appareils IoT Edge, où ils prennent en charge la plupart des fonctionnalités du langage de requête fondé sur SQL des travaux cloud et continuent de fonctionner quel que soit l'état du réseau. La moyenne par fenêtre est calculée sur la passerelle : la pompe est arrêtée localement sans attendre la liaison, et seuls les agrégats sont transmis au hub IoT.
  options:
    a:
      en: A cloud job reuses the queries, but it receives nothing while the link is down and requires every raw reading to be sent over the satellite link.
      fr: Un travail cloud réutilise les requêtes, mais il ne reçoit rien pendant que la liaison est interrompue et impose d'envoyer chaque relevé brut par la liaison satellite.
    c:
      en: Message routing forwards messages that already reached the IoT hub to another endpoint. It computes no windowed average and doesn't act at the station.
      fr: Le routage des messages transmet à un autre point de terminaison les messages déjà arrivés au hub IoT. Il ne calcule aucune moyenne par fenêtre et n'agit pas dans la station.
    d:
      en: Structured Streaming in Azure Databricks runs in the cloud, depends on the link, and would require the team to rewrite its queries for Spark.
      fr: Structured Streaming dans Azure Databricks s'exécute dans le cloud, dépend de la liaison et obligerait l'équipe à réécrire ses requêtes pour Spark.
references:
  - title: Azure Stream Analytics on IoT Edge
    url: https://learn.microsoft.com/en-us/azure/stream-analytics/stream-analytics-edge
