id: az305-2c-int-shir-nodes
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys uses Azure Data Factory to copy data from on-premises databases to Azure. All the copy activities use a self-hosted integration runtime named **IR1** that is installed on a single on-premises server.

    Each month, the pipelines fail while the server restarts for updates. During the nightly peak, copy activities also wait in a queue because IR1 has reached its limit of concurrent jobs.

    You need to recommend a change to the design. The solution must meet the following requirements:

    - Remove the single point of failure.
    - Increase the number of copy activities that can run at the same time.
    - Leave the existing linked services and pipelines unchanged.

    What should you recommend?
  fr: |
    Tailspin Toys utilise Azure Data Factory pour copier vers Azure les données de bases de données locales. Toutes les activités de copie utilisent un runtime d'intégration auto-hébergé nommé **IR1**, installé sur un seul serveur local.

    Chaque mois, les pipelines échouent pendant que le serveur redémarre pour ses mises à jour. Pendant le pic nocturne, des activités de copie attendent aussi en file d'attente, car IR1 a atteint sa limite de travaux simultanés.

    Vous devez recommander une modification de la conception. La solution doit répondre aux exigences suivantes :

    - Supprimer le point de défaillance unique.
    - Augmenter le nombre d'activités de copie qui peuvent s'exécuter en même temps.
    - Laisser inchangés les services liés et les pipelines existants.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Create a second self-hosted integration runtime on another server.", fr: "Créer un deuxième runtime d'intégration auto-hébergé sur un autre serveur." } }
    - { id: b, text: { en: "Replace IR1 with an Azure integration runtime in a managed virtual network.", fr: "Remplacer IR1 par un runtime d'intégration Azure dans un réseau virtuel managé." } }
    - { id: c, text: { en: "Add processors and memory to the server that hosts IR1.", fr: "Ajouter des processeurs et de la mémoire au serveur qui héberge IR1." } }
    - { id: d, text: { en: "Register more on-premises servers as nodes of IR1.", fr: "Inscrire d'autres serveurs locaux comme nœuds d'IR1." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A self-hosted integration runtime is a logical resource that can be associated with up to four on-premises machines. With several nodes, the runtime stays available while one machine restarts, and the copy jobs are spread over the nodes, which raises the number of concurrent jobs. The linked services keep referencing IR1, so nothing else changes.
    fr: |
      Un runtime d'intégration auto-hébergé est une ressource logique qui peut être associée à quatre machines locales au maximum. Avec plusieurs nœuds, le runtime reste disponible pendant qu'une machine redémarre, et les travaux de copie sont répartis sur les nœuds, ce qui augmente le nombre de travaux simultanés. Les services liés continuent de référencer IR1 : rien d'autre ne change.
  options:
    a:
      en: A second runtime is a separate resource. Linked services reference a single integration runtime, so they would have to be duplicated or modified, and neither runtime would fail over to the other.
      fr: "Un deuxième runtime est une ressource distincte. Un service lié référence un seul runtime d'intégration : il faudrait donc dupliquer ou modifier les services liés, et aucun des deux runtimes ne prendrait le relais de l'autre."
    b:
      en: An Azure integration runtime in a managed virtual network connects through managed private endpoints and has no direct path to the on-premises network. Every linked service would also have to be changed to reference the new runtime.
      fr: Un runtime d'intégration Azure dans un réseau virtuel managé se connecte par des points de terminaison privés managés et n'a pas de chemin direct vers le réseau local. Il faudrait en outre modifier chaque service lié pour qu'il référence le nouveau runtime.
    c:
      en: Scaling up the server allows more concurrent jobs on that node, but the runtime still depends on one machine and fails when it restarts.
      fr: Augmenter la puissance du serveur autorise davantage de travaux simultanés sur ce nœud, mais le runtime dépend toujours d'une seule machine et tombe en panne quand elle redémarre.
references:
  - title: Create and configure a self-hosted integration runtime
    url: https://learn.microsoft.com/en-us/azure/data-factory/create-self-hosted-integration-runtime
