id: az305-2b-files-billing-model
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum is deploying a new 30-TiB Azure file share for department documents that users access with SMB. The workload needs about 1,000 IOPS, and latency is not critical.

    You need to recommend a file share configuration that meets the following requirements:

    - The monthly bill must be predictable and must not depend on the number of file operations.
    - Costs must be minimized.

    What should you recommend?
  fr: |
    Adatum déploie un nouveau partage de fichiers Azure de 30 Tio pour les documents des services de l'entreprise, auxquels les utilisateurs accèdent en SMB. La charge de travail demande environ 1 000 IOPS, et la latence n'est pas critique.

    Vous devez recommander une configuration de partage de fichiers qui répond aux exigences suivantes :

    - La facture mensuelle doit être prévisible et ne doit pas dépendre du nombre d'opérations sur les fichiers.
    - Les coûts doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "An SSD file share that uses the provisioned v1 billing model", fr: "Un partage de fichiers SSD qui utilise le modèle de facturation provisionné v1" }
    - id: b
      text: { en: "An HDD file share that uses the pay-as-you-go billing model in the transaction optimized tier", fr: "Un partage de fichiers HDD qui utilise le modèle de facturation à l'utilisation, au niveau optimisé pour les transactions" }
    - id: c
      text: { en: "An HDD file share that uses the provisioned v2 billing model", fr: "Un partage de fichiers HDD qui utilise le modèle de facturation provisionné v2" }
    - id: d
      text: { en: "An SSD file share that uses the provisioned v2 billing model", fr: "Un partage de fichiers SSD qui utilise le modèle de facturation provisionné v2" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With the provisioned v2 model, you provision storage, IOPS and throughput separately and pay for what you provision, whatever the usage, so the bill does not vary with the number of operations. The model exists on HDD media, which is the less expensive media tier and covers 1,000 IOPS (HDD provisioned v2 shares go from 500 to 50,000 IOPS). Microsoft recommends provisioned v2 for new deployments.
    fr: |
      Avec le modèle provisionné v2, vous provisionnez séparément le stockage, les IOPS et le débit, et vous payez ce que vous provisionnez, quelle que soit l'utilisation : la facture ne varie pas avec le nombre d'opérations. Le modèle existe sur support HDD, le niveau de support le moins coûteux, qui couvre 1 000 IOPS (les partages HDD provisionnés v2 vont de 500 à 50 000 IOPS). Microsoft recommande le modèle provisionné v2 pour les nouveaux déploiements.
  options:
    a:
      en: Provisioned v1 is predictable, but it exists only on SSD media, whose performance this workload does not need and which costs more.
      fr: "Le modèle provisionné v1 est prévisible, mais il n'existe que sur support SSD, dont cette charge de travail n'a pas besoin et qui coûte plus cher."
    b:
      en: The pay-as-you-go model bills the data stored and every transaction, so the bill changes with the number of file operations.
      fr: "Le modèle de paiement à l'utilisation facture les données stockées et chaque transaction : la facture varie avec le nombre d'opérations sur les fichiers."
    d:
      en: An SSD share gives a predictable bill, but SSD media is not needed for 1,000 IOPS without a latency requirement and costs more than HDD media.
      fr: "Un partage SSD donne une facture prévisible, mais le support SSD n'est pas nécessaire pour 1 000 IOPS sans exigence de latence et coûte plus cher que le support HDD."
references:
  - title: Understand Azure Files billing
    url: https://learn.microsoft.com/en-us/azure/storage/files/understanding-billing
