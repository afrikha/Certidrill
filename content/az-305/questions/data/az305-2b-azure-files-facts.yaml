id: az305-2b-azure-files-facts
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to replace its file servers with Azure Files. Windows clients will use SMB, and Linux application servers will use NFS 4.1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de remplacer ses serveurs de fichiers par Azure Files. Les clients Windows utiliseront SMB, et les serveurs d'applications Linux utiliseront NFS 4.1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A single premium file shares storage account can contain both SMB file shares and NFS file shares.
        fr: Un même compte de stockage de partages de fichiers Premium peut contenir à la fois des partages de fichiers SMB et des partages de fichiers NFS.
    - id: s2
      text:
        en: An application can read a file share from the secondary region of an RA-GRS storage account while the primary region is available.
        fr: Une application peut lire un partage de fichiers depuis la région secondaire d'un compte de stockage RA-GRS pendant que la région primaire est disponible.
    - id: s3
      text:
        en: SMB file shares can authenticate hybrid user identities by using Microsoft Entra Kerberos.
        fr: Les partages de fichiers SMB peuvent authentifier des identités d'utilisateurs hybrides à l'aide de Microsoft Entra Kerberos.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      One share uses either SMB or NFS, but a premium file shares account can hold shares of both protocols. Azure Files does not support read access to the secondary region: an RA-GRS account can be created, but the shares are not readable from the secondary endpoint. SMB shares support identity-based access with on-premises AD DS, Microsoft Entra Domain Services or Microsoft Entra Kerberos.
    fr: |
      Un partage utilise soit SMB, soit NFS, mais un compte de partages de fichiers Premium peut contenir des partages des deux protocoles. Azure Files ne prend pas en charge l'accès en lecture à la région secondaire : un compte RA-GRS peut être créé, mais les partages ne sont pas lisibles depuis le point de terminaison secondaire. Les partages SMB prennent en charge l'accès basé sur l'identité avec AD DS local, Microsoft Entra Domain Services ou Microsoft Entra Kerberos.
references:
  - title: Plan an Azure Files deployment
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-planning
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
