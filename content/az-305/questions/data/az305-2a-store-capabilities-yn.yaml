id: az305-2a-store-capabilities-yn
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to migrate several SQL Server workloads to Azure and compares Azure SQL Database, Azure SQL Managed Instance and SQL Server on Azure Virtual Machines.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de migrer plusieurs charges de travail SQL Server vers Azure et compare Azure SQL Database, Azure SQL Managed Instance et SQL Server sur machines virtuelles Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure SQL Managed Instance can restore a native SQL Server backup (.bak) file that is stored in Azure Blob Storage.
        fr: Azure SQL Managed Instance peut restaurer un fichier de sauvegarde SQL Server natif (.bak) stocké dans Stockage Blob Azure.
    - id: s2
      text:
        en: A database in Azure SQL Database can run scheduled Transact-SQL jobs by using SQL Server Agent.
        fr: Une base de données Azure SQL Database peut exécuter des travaux Transact-SQL planifiés à l'aide de SQL Server Agent.
    - id: s3
      text:
        en: SQL Server on Azure Virtual Machines can host SQL Server Reporting Services (SSRS) on the same server as the database engine.
        fr: SQL Server sur machines virtuelles Azure peut héberger SQL Server Reporting Services (SSRS) sur le même serveur que le moteur de base de données.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: SQL Managed Instance accepts the `RESTORE ... FROM URL` statement for full backups placed in Azure Blob Storage, which Azure SQL Database doesn't. Azure SQL Database has no SQL Server Agent. Scheduled jobs across databases are run by elastic jobs instead. A virtual machine runs the full SQL Server product, so SSRS and SSAS can be installed next to the database engine, whereas neither platform service runs them.
    fr: SQL Managed Instance accepte l'instruction `RESTORE ... FROM URL` pour des sauvegardes complètes placées dans Stockage Blob Azure, ce qu'Azure SQL Database ne permet pas. Azure SQL Database n'a pas de SQL Server Agent. Les travaux planifiés sur plusieurs bases de données s'exécutent avec les travaux élastiques. Une machine virtuelle exécute le produit SQL Server complet, donc SSRS et SSAS peuvent être installés à côté du moteur de base de données, alors qu'aucun des deux services de plateforme ne les exécute.
references:
  - title: "Features comparison: Azure SQL Database and Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
