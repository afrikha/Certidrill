id: az305-2b-multiwrite-conflicts
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum is designing a collaborative inventory application on Azure Cosmos DB for NoSQL. Warehouses in Europe, America and Asia must write to the database in their own region with low latency.

    Two warehouses can update the same item at the same time. When this happens, the quantities of both updates must be combined by a business rule instead of keeping only the most recent update.

    Which two elements should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum conçoit une application d'inventaire collaborative sur Azure Cosmos DB for NoSQL. Des entrepôts situés en Europe, en Amérique et en Asie doivent écrire dans la base de données dans leur propre région avec une faible latence.

    Deux entrepôts peuvent mettre à jour le même élément au même moment. Dans ce cas, les quantités des deux mises à jour doivent être combinées par une règle métier au lieu de ne conserver que la mise à jour la plus récente.

    Quels sont les deux éléments à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "An account that uses Strong as its default consistency level", fr: "Un compte qui utilise Strong comme niveau de cohérence par défaut" }
    - id: b
      text: { en: "A container created with a custom conflict resolution policy and a merge stored procedure", fr: "Un conteneur créé avec une stratégie de résolution des conflits personnalisée et une procédure stockée de fusion" }
    - id: c
      text: { en: "A container that keeps the default Last Write Wins conflict resolution policy", fr: "Un conteneur qui conserve la stratégie de résolution des conflits par défaut Last Write Wins" }
    - id: d
      text: { en: "An account configured with multiple write regions", fr: "Un compte configuré avec plusieurs régions d'écriture" }
    - id: e
      text: { en: "An account created in the serverless capacity mode", fr: "Un compte créé en mode de capacité serverless" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Multiple write regions let each warehouse write to the replica of its own region. Concurrent updates of the same item then create conflicts; a custom conflict resolution policy, available with the API for NoSQL and defined when the container is created, runs a merge stored procedure that applies the business rule.
    fr: |
      Plusieurs régions d'écriture permettent à chaque entrepôt d'écrire dans le réplica de sa propre région. Les mises à jour simultanées d'un même élément créent alors des conflits ; une stratégie de résolution des conflits personnalisée, disponible avec l'API pour NoSQL et définie à la création du conteneur, exécute une procédure stockée de fusion qui applique la règle métier.
  options:
    a: { en: "Strong consistency cannot be used on an account with multiple write regions.", fr: "La cohérence Strong ne peut pas être utilisée sur un compte à plusieurs régions d'écriture." }
    c: { en: "Last Write Wins keeps the version with the highest timestamp and discards the other update, which contradicts the business rule.", fr: "Last Write Wins conserve la version dont l'horodatage est le plus élevé et écarte l'autre mise à jour, ce qui contredit la règle métier." }
    e: { en: "A serverless account runs in a single region, so it cannot offer local writes on three continents.", fr: "Un compte serverless s'exécute dans une seule région : il ne peut pas offrir des écritures locales sur trois continents." }
references:
  - title: Conflict types and resolution policies when using multiple write regions
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/conflict-resolution-policies
  - title: Multi-region writes in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/multi-region-writes
