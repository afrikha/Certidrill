id: az305-2c-ana-stream-pipeline
objective: "2.3.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum operates 20,000 connected vending machines. You need to recommend a solution to analyze the sales events that the machines send. The solution must meet the following requirements:

    - Each machine must authenticate with its own identity, and operators must be able to send commands from Azure to a specific machine.
    - Sales totals per machine must be computed over 5-minute windows by a team that knows only SQL, without any cluster to provision.
    - A web application must read the totals by using T-SQL queries that join them with its product catalog tables.

    What should you recommend for each part of the solution? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exploite 20 000 distributeurs automatiques connectés. Vous devez recommander une solution pour analyser les événements de vente envoyés par les distributeurs. La solution doit répondre aux exigences suivantes :

    - Chaque distributeur doit s'authentifier avec sa propre identité, et les opérateurs doivent pouvoir envoyer des commandes depuis Azure à un distributeur précis.
    - Les totaux des ventes par distributeur doivent être calculés sur des fenêtres de 5 minutes par une équipe qui ne connaît que SQL, sans cluster à provisionner.
    - Une application web doit lire les totaux au moyen de requêtes T-SQL qui les joignent aux tables de son catalogue de produits.

    Que devez-vous recommander pour chaque partie de la solution ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Ingest the events by using: [[ingest]]

      Compute the totals by using: [[process]]

      Store the totals in: [[serve]]
    fr: |
      Ingérer les événements à l'aide de : [[ingest]]

      Calculer les totaux à l'aide de : [[process]]

      Stocker les totaux dans : [[serve]]
  slots:
    - id: ingest
      options:
        - { id: eventhubs, text: Azure Event Hubs }
        - { id: eventgrid, text: Azure Event Grid }
        - { id: iothub, text: Azure IoT Hub }
        - { id: servicebus, text: Azure Service Bus }
    - id: process
      options:
        - { id: asa, text: Azure Stream Analytics }
        - { id: databricks, text: Azure Databricks }
        - { id: adf, text: Azure Data Factory }
        - { id: functions, text: Azure Functions }
    - id: serve
      options:
        - { id: adls, text: Azure Data Lake Storage }
        - { id: tables, text: Azure Table Storage }
        - { id: eventhubs, text: Azure Event Hubs }
        - { id: sqldb, text: Azure SQL Database }
answer:
  values: { ingest: iothub, process: asa, serve: sqldb }
explanation:
  correct:
    en: |
      IoT Hub gives every device its own identity and supports cloud-to-device messages, which Event Hubs, an ingestion service for one-way event streams, doesn't offer. Stream Analytics computes aggregates over tumbling windows with a SQL-based language and is sized in streaming units, with no cluster; Azure Databricks needs Spark code and clusters, Functions would require custom code to keep window state, and Data Factory is a batch orchestrator. Azure SQL Database is a Stream Analytics output that the web application can query and join in T-SQL, unlike files in a data lake, a key-value table or another event stream.
    fr: |
      IoT Hub donne à chaque appareil sa propre identité et prend en charge les messages cloud-à-appareil, ce que n'offre pas Event Hubs, service d'ingestion pour des flux d'événements à sens unique. Stream Analytics calcule des agrégats sur des fenêtres bascules dans un langage fondé sur SQL et se dimensionne en unités de streaming, sans cluster ; Azure Databricks exige du code Spark et des clusters, Functions imposerait du code personnalisé pour conserver l'état des fenêtres, et Data Factory est un orchestrateur de traitements par lots. Azure SQL Database est une sortie de Stream Analytics que l'application web peut interroger et joindre en T-SQL, contrairement à des fichiers dans un lac de données, à une table clé-valeur ou à un autre flux d'événements.
references:
  - title: Welcome to Azure Stream Analytics
    url: https://learn.microsoft.com/en-us/azure/stream-analytics/stream-analytics-introduction
  - title: "Connecting IoT Devices to Azure: IoT Hub and Event Hubs"
    url: https://learn.microsoft.com/en-us/azure/iot-hub/iot-hub-compare-event-hubs
