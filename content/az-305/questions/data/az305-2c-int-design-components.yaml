id: az305-2c-int-design-components
objective: "2.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders plans to centralize data from 35 operational systems, which include on-premises Oracle databases, SFTP servers and SaaS applications.

    You need to recommend a data integration design. The design must meet the following requirements:

    - Raw files of any format must be stored at the lowest cost, and each department's directory must be protected by access control lists (ACLs).
    - Terabytes of data must be copied every night by using built-in connectors, without servers to manage and without custom code.
    - The passwords of the source systems must not be stored in the pipeline definitions and must be rotated in a single place.

    What should you recommend for each part of the design? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders prévoit de centraliser les données de 35 systèmes opérationnels, parmi lesquels des bases de données Oracle locales, des serveurs SFTP et des applications SaaS.

    Vous devez recommander une conception d'intégration de données. La conception doit répondre aux exigences suivantes :

    - Les fichiers bruts de tout format doivent être stockés au coût le plus bas, et le répertoire de chaque service doit être protégé par des listes de contrôle d'accès (ACL).
    - Des téraoctets de données doivent être copiés chaque nuit à l'aide de connecteurs intégrés, sans serveur à gérer et sans code personnalisé.
    - Les mots de passe des systèmes sources ne doivent pas être stockés dans les définitions de pipeline et doivent être renouvelés à un seul endroit.

    Que devez-vous recommander pour chaque partie de la conception ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Store the raw files in: [[store]]

      Copy the data every night by using: [[copy]]

      Keep the passwords of the source systems in: [[secrets]]
    fr: |
      Stocker les fichiers bruts dans : [[store]]

      Copier les données chaque nuit à l'aide de : [[copy]]

      Conserver les mots de passe des systèmes sources dans : [[secrets]]
  slots:
    - id: store
      options:
        - { id: files, text: Azure Files }
        - { id: adls, text: Azure Data Lake Storage }
        - { id: sqldb, text: Azure SQL Database }
        - { id: dedicated, text: { en: "An Azure Synapse Analytics dedicated SQL pool", fr: "Un pool SQL dédié Azure Synapse Analytics" } }
    - id: copy
      options:
        - { id: asa, text: Azure Stream Analytics }
        - { id: batch, text: Azure Batch }
        - { id: eventhubs, text: Azure Event Hubs }
        - { id: adf, text: Azure Data Factory }
    - id: secrets
      options:
        - { id: kv, text: Azure Key Vault }
        - { id: appconfig, text: Azure App Configuration }
        - { id: globalparams, text: { en: "Data Factory global parameters", fr: "Des paramètres globaux Data Factory" } }
answer:
  values: { store: adls, copy: adf, secrets: kv }
explanation:
  correct:
    en: |
      Azure Data Lake Storage keeps files of any format at Blob Storage prices and, thanks to the hierarchical namespace, secures directories with POSIX-style ACLs. Azure Data Factory is the managed service that copies data on a schedule through its built-in connectors, with no server to run. Linked services can reference secrets held in Azure Key Vault: Data Factory retrieves them when an activity runs, so the passwords stay out of the pipeline definitions and are rotated in the vault. App Configuration and global parameters hold configuration values, not secrets.
    fr: |
      Azure Data Lake Storage conserve des fichiers de tout format au tarif du Stockage Blob et, grâce à l'espace de noms hiérarchique, protège les répertoires par des ACL de type POSIX. Azure Data Factory est le service managé qui copie les données selon une planification au moyen de ses connecteurs intégrés, sans serveur à exploiter. Les services liés peuvent référencer des secrets conservés dans Azure Key Vault : Data Factory les récupère à l'exécution d'une activité, si bien que les mots de passe restent hors des définitions de pipeline et sont renouvelés dans le coffre. App Configuration et les paramètres globaux contiennent des valeurs de configuration, pas des secrets.
references:
  - title: Introduction to Azure Data Lake Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction
  - title: Store credentials in Azure Key Vault
    url: https://learn.microsoft.com/en-us/azure/data-factory/store-credentials-in-key-vault
