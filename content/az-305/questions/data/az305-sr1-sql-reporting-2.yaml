id: az305-sr1-sql-reporting-2
objective: "2.1.2"
type: series_yesno
series: az305-sr1-sql-reporting
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You recommend the General Purpose service tier with zone redundancy.
  fr: Vous recommandez le niveau de service General Purpose avec la redondance de zone.
body:
  solution:
    en: |
      You recommend creating DB1 in the **General Purpose** service tier with provisioned compute and **zone redundancy** enabled. The reporting application connects with `ApplicationIntent=ReadOnly`.
    fr: |
      Vous recommandez de créer DB1 dans le niveau de service **General Purpose** avec le calcul provisionné et la **redondance de zone** activée. L'application de création de rapports se connecte avec `ApplicationIntent=ReadOnly`.
answer: { value: false }
explanation:
  correct:
    en: |
      Zone-redundant General Purpose keeps DB1 available when a zone fails and supports 4 TB, but the high availability architecture of this tier has no readable replica: read scale-out is not available in General Purpose. The reporting queries would run on the primary replica and compete with the order management workload, unless another database such as a geo-replica were created, which the requirements exclude.
    fr: |
      Le niveau General Purpose redondant interzone maintient DB1 disponible quand une zone tombe en panne et accepte 4 To, mais l'architecture de haute disponibilité de ce niveau ne comporte aucun réplica lisible : la lecture à l'échelle (read scale-out) n'est pas disponible en General Purpose. Les requêtes de rapports s'exécuteraient sur le réplica principal, en concurrence avec la charge de gestion des commandes, à moins de créer une autre base de données telle qu'un géoréplica, ce que les exigences excluent.
references:
  - title: Use read-only replicas to offload read-only query workloads
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/read-scale-out
  - title: vCore purchasing model - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tiers-sql-database-vcore
