id: az305-2b-protection-facts
objective: "2.2.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys stores block blobs in a standard general-purpose v2 storage account that has a flat namespace. Blob versioning is enabled, and no other data protection feature is configured. You are reviewing the data protection design.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys stocke des objets blob de blocs dans un compte de stockage standard usage général v2 doté d'un espace de noms plat. Le contrôle de version des objets blob est activé, et aucune autre fonctionnalité de protection des données n'est configurée. Vous examinez la conception de la protection des données.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If a container is deleted, the current configuration allows the blobs of the container to be recovered.
        fr: Si un conteneur est supprimé, la configuration actuelle permet de récupérer les objets blob du conteneur.
    - id: s2
      text:
        en: After a time-based retention policy is locked on a container, a user who has the Owner role can shorten its retention interval.
        fr: Une fois une stratégie de rétention limitée dans le temps verrouillée sur un conteneur, un utilisateur doté du rôle Owner peut raccourcir son intervalle de rétention.
    - id: s3
      text:
        en: Enabling point-in-time restore on the account requires blob soft delete and the change feed in addition to blob versioning.
        fr: L'activation de la restauration à un instant dans le passé sur le compte exige la suppression réversible des objets blob et le flux de modification, en plus du contrôle de version des objets blob.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Versioning works at the blob level: deleting a container removes its blobs and all their versions, and only container soft delete can bring them back. A locked time-based retention policy cannot be deleted and its retention interval cannot be decreased by anyone; it can only be extended. Point-in-time restore requires blob soft delete, the change feed and blob versioning to be enabled first.
    fr: |
      Le contrôle de version agit au niveau des objets blob : supprimer un conteneur supprime ses objets blob et toutes leurs versions, et seule la suppression réversible de conteneur permet de les récupérer. Une stratégie de rétention limitée dans le temps verrouillée ne peut pas être supprimée, et personne ne peut réduire son intervalle de rétention ; elle peut seulement être prolongée. La restauration à un instant dans le passé exige que la suppression réversible des objets blob, le flux de modification et le contrôle de version des objets blob soient d'abord activés.
references:
  - title: Blob versioning
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/versioning-overview
  - title: Point-in-time restore for block blobs
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/point-in-time-restore-overview
