id: az305-cs3b-loans-database
objective: "2.1.3"
type: dropdown
caseStudy: az305-cs3b-woodgrove
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a configuration for LoansDB. The solution must meet the database requirements and minimize costs.

    What should you recommend? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une configuration pour LoansDB. La solution doit satisfaire les exigences relatives à la base de données et réduire les coûts au minimum.

    Que devez-vous recommander ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Service tier: [[tier]]

      Replica for the reporting queries: [[replica]]
    fr: |
      Niveau de service : [[tier]]

      Réplica pour les requêtes de reporting : [[replica]]
  slots:
    - id: tier
      options:
        - { id: bc, text: Business Critical }
        - { id: gp, text: General Purpose }
        - { id: hs, text: Hyperscale }
    - id: replica
      options:
        - { id: geo, text: { en: "A geo-replica in Central US", fr: "Un géoréplica dans Central US" } }
        - { id: ha, text: { en: "A high-availability replica", fr: "Un réplica à haute disponibilité" } }
        - { id: named, text: { en: "A named replica", fr: "Un réplica nommé" } }
answer:
  values: { tier: hs, replica: named }
explanation:
  correct:
    en: "General Purpose and Business Critical databases stop at 4 TB, whereas a Hyperscale database grows automatically up to 128 TB and remains a single database for the application. A named replica of a Hyperscale database is a read-only replica in the same region whose compute size is set and changed independently of the primary, which isolates the reporting workload."
    fr: "Les bases de données General Purpose et Business Critical s'arrêtent à 4 To, alors qu'une base de données Hyperscale grossit automatiquement jusqu'à 128 To et reste une base de données unique pour l'application. Un réplica nommé d'une base de données Hyperscale est un réplica en lecture seule situé dans la même région, dont la taille de calcul est définie et modifiée indépendamment de celle du réplica principal, ce qui isole la charge de reporting."
  options:
    bc:
      en: "Business Critical includes a readable replica, but that replica always has the size of the primary, and the tier is limited to 4 TB."
      fr: "Business Critical inclut un réplica lisible, mais ce réplica a toujours la taille du réplica principal, et le niveau est limité à 4 To."
    gp:
      en: "General Purpose is limited to 4 TB and has no readable replica."
      fr: "General Purpose est limité à 4 To et n'a pas de réplica lisible."
    geo:
      en: "A geo-replica in Central US is meant for disaster recovery and for readers in another region. The reporting replica must be in East US 2, and a geo-replica also keeps its own copy of the data, which costs more."
      fr: "Un géoréplica dans Central US est destiné à la reprise d'activité et aux lecteurs d'une autre région. Le réplica de reporting doit se trouver dans East US 2, et un géoréplica conserve en outre sa propre copie des données, ce qui coûte plus cher."
    ha:
      en: "A high-availability replica can serve read-only connections, but its compute size is always the same as that of the primary."
      fr: "Un réplica à haute disponibilité peut servir des connexions en lecture seule, mais sa taille de calcul est toujours la même que celle du réplica principal."
references:
  - title: Hyperscale service tier
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale
  - title: Hyperscale secondary replicas
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale-replicas
