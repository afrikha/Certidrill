id: az305-2b-cost-features-match
objective: "2.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders wants to optimize the cost of block blobs that are stored in standard general-purpose v2 storage accounts. The accounts use ZRS.

    Which feature should you recommend for each goal? To answer, drag the appropriate features to the correct goals. Each feature may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders veut optimiser le coût d'objets blob de blocs stockés dans des comptes de stockage standard usage général v2. Les comptes utilisent ZRS.

    Quelle fonctionnalité devez-vous recommander pour chaque objectif ? Pour répondre, faites glisser les fonctionnalités appropriées vers les objectifs correspondants. Chaque fonctionnalité peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: lcm, text: { en: "Lifecycle management policy", fr: "Stratégie de gestion du cycle de vie" } }
    - { id: rc, text: { en: "Reserved capacity", fr: "Capacité réservée" } }
    - { id: smart, text: { en: "Smart tier", fr: "Niveau intelligent (smart tier)" } }
    - { id: orp, text: { en: "Object replication", fr: "Réplication d'objets" } }
    - { id: sd, text: { en: "Blob soft delete", fr: "Suppression réversible des objets blob" } }
  targets:
    - id: g1
      text: { en: "Obtain a discount by committing to 100 TiB of hot-tier storage for three years", fr: "Obtenir une remise en s'engageant sur 100 Tio de stockage au niveau chaud (Hot) pendant trois ans" }
    - id: g2
      text: { en: "Delete previous blob versions automatically 90 days after their creation", fr: "Supprimer automatiquement les versions précédentes des objets blob 90 jours après leur création" }
    - id: g3
      text: { en: "Let the platform move blobs between the hot, cool and cold tiers according to their usage, with no rule to define", fr: "Laisser la plateforme déplacer les objets blob entre les niveaux chaud (Hot), froid (Cool) et froid (Cold) selon leur utilisation, sans règle à définir" }
answer:
  mapping: { g1: rc, g2: lcm, g3: smart }
explanation:
  correct:
    en: |
      Reserved capacity is bought in units of 100 TiB or 1 PiB per month for one or three years and discounts the storage of block blobs in a given region, tier and redundancy. Lifecycle management rules can delete previous versions and snapshots as well as current blobs. Smart tier, available in zone-redundant general-purpose v2 accounts, moves blobs between hot, cool and cold from their access pattern, without rules or policies.
    fr: |
      La capacité réservée s'achète par unités de 100 Tio ou de 1 Pio par mois, pour un an ou trois ans, et accorde une remise sur le stockage des objets blob de blocs dans une région, un niveau et une redondance donnés. Les règles de gestion du cycle de vie peuvent supprimer les versions précédentes et les instantanés, comme les objets blob actuels. Le niveau intelligent (smart tier), disponible dans les comptes usage général v2 redondants interzones, déplace les objets blob entre les niveaux chaud (Hot), froid (Cool) et froid (Cold) d'après leur modèle d'accès, sans règle ni stratégie.
  options:
    orp: { en: "Object replication copies block blobs to another storage account; it adds cost instead of reducing it.", fr: "La réplication d'objets copie les objets blob de blocs dans un autre compte de stockage ; elle ajoute des coûts au lieu d'en retirer." }
    sd: { en: "Blob soft delete keeps deleted data for a retention period, billed like active data.", fr: "La suppression réversible des objets blob conserve les données supprimées pendant une période de rétention, facturée comme des données actives." }
references:
  - title: Optimize costs for Blob storage with reserved capacity
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blob-reserved-capacity
  - title: Optimize Azure Blob Storage costs with smart tier
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-smart
