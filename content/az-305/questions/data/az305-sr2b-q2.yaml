stem:
  en: |
    You recommend multi-region writes with the Strong consistency level.
  fr: |
    Vous recommandez les écritures multirégions avec le niveau de cohérence Strong.
body:
  solution:
    en: |
      You recommend an account that is replicated to the three regions with **multi-region writes** enabled. The default consistency level of the account is **Strong**, so that every read returns the latest committed write.
    fr: |
      Vous recommandez un compte répliqué dans les trois régions avec les **écritures multirégions** activées. Le niveau de cohérence par défaut du compte est **Strong**, afin que chaque lecture renvoie la dernière écriture validée.
answer: { value: false }
explanation:
  correct:
    en: |
      This configuration can't be deployed: an Azure Cosmos DB account that has multiple write regions can't use the Strong consistency level, because a distributed system can't offer both a recovery point objective and a recovery time objective of zero. Adatum would have to give up either local writes or Strong consistency. The requirement only asks that users read their own writes, which a weaker level provides.
    fr: |
      Cette configuration ne peut pas être déployée : un compte Azure Cosmos DB à plusieurs régions d'écriture ne peut pas utiliser le niveau de cohérence Strong, car un système distribué ne peut pas offrir à la fois un objectif de point de récupération et un objectif de délai de récupération égaux à zéro. Adatum devrait renoncer soit aux écritures locales, soit à la cohérence Strong. L'exigence demande seulement que les utilisateurs relisent leurs propres écritures, ce qu'un niveau plus faible fournit.
references:
  - title: "Consistency levels in Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
