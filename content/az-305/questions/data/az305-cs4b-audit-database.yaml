id: az305-cs4b-audit-database
objective: "2.1.2"
type: single
caseStudy: az305-cs4b-fourthcoffee
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a configuration for sql-audit. The solution must meet the audit database requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une configuration pour sql-audit. La solution doit respecter les exigences relatives à la base de données d'audit.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: Move sql-audit to an elastic pool in the General Purpose service tier
        fr: Déplacer sql-audit dans un pool élastique du niveau de service General Purpose
    - id: b
      text:
        en: Keep provisioned compute in the General Purpose service tier and reduce sql-audit to 2 vCores
        fr: Conserver le calcul provisionné du niveau de service General Purpose et réduire sql-audit à 2 vCores
    - id: c
      text:
        en: Change sql-audit to the Basic service tier of the DTU purchasing model
        fr: Passer sql-audit au niveau de service Basic du modèle d'achat DTU
    - id: d
      text:
        en: Change sql-audit to the serverless compute tier of the General Purpose service tier, with auto-pause enabled
        fr: Passer sql-audit au niveau de calcul serverless du niveau de service General Purpose, avec la mise en pause automatique activée
answer: { optionId: d }
explanation:
  correct:
    en: |
      The serverless compute tier scales a single database automatically between a minimum and a maximum number of vCores, here up to 8, and bills the compute that is used per second. With auto-pause, the database pauses after a period of inactivity: only storage is billed until the next connection resumes it, without any action from an administrator. The short delay of the resume is accepted by the requirements.
    fr: |
      Le niveau de calcul serverless met automatiquement à l'échelle une base de données unique entre un nombre minimal et un nombre maximal de vCores, ici jusqu'à 8, et facture à la seconde le calcul utilisé. Avec la mise en pause automatique, la base de données se met en pause après une période d'inactivité : seul le stockage est facturé jusqu'à ce que la connexion suivante la relance, sans aucune action d'un administrateur. Le court délai de la reprise est accepté par les exigences.
  options:
    a:
      en: "An elastic pool is billed for every hour that it exists, whether its databases are used or not. It pays off for many databases that share resources, not for one idle database."
      fr: "Un pool élastique est facturé pour chaque heure de son existence, que ses bases de données soient utilisées ou non. Il est rentable pour de nombreuses bases de données qui partagent des ressources, pas pour une seule base inactive."
    b:
      en: "Provisioned compute is billed at a fixed hourly price even when the database is idle, and 2 vCores no longer give the auditors the 8 vCores that they need."
      fr: "Le calcul provisionné est facturé à un prix horaire fixe même quand la base de données est inactive, et 2 vCores ne donnent plus aux auditeurs les 8 vCores dont ils ont besoin."
    c:
      en: "The DTU purchasing model has no serverless compute and no auto-pause: a Basic database is billed all the time, with a capacity far below 8 vCores."
      fr: "Le modèle d'achat DTU n'offre ni calcul serverless ni mise en pause automatique : une base de données Basic est facturée en permanence, avec une capacité très inférieure à 8 vCores."
references:
  - title: Serverless compute tier for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
