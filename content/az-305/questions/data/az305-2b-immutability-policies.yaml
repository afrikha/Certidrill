id: az305-2b-immutability-policies
objective: "2.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank stores two kinds of documents as block blobs in separate containers of a storage account:

    - **Trade confirmations** must comply with SEC Rule 17a-4(f). For six years after its creation, a confirmation must not be modified or deleted by anyone, including administrators, and this protection must not be reducible.
    - **Litigation files** must be protected from modification and deletion until a court case ends. The end date is unknown.

    You need to recommend an immutable storage configuration for each container.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank stocke deux sortes de documents sous forme d'objets blob de blocs dans des conteneurs distincts d'un compte de stockage :

    - Les **confirmations de transactions** doivent être conformes à la règle SEC 17a-4(f). Pendant six ans après sa création, une confirmation ne doit être modifiée ni supprimée par personne, administrateurs compris, et cette protection ne doit pas pouvoir être réduite.
    - Les **dossiers de contentieux** doivent être protégés contre la modification et la suppression jusqu'à la fin d'une procédure judiciaire. La date de fin est inconnue.

    Vous devez recommander une configuration de stockage immuable pour chaque conteneur.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Trade confirmations: [[trade]]

      Litigation files: [[lit]]
    fr: |
      Confirmations de transactions : [[trade]]

      Dossiers de contentieux : [[lit]]
  slots:
    - id: trade
      options:
        - { id: hold, text: { en: "A legal hold", fr: "Une conservation légale" } }
        - { id: unlocked, text: { en: "An unlocked time-based retention policy", fr: "Une stratégie de rétention limitée dans le temps déverrouillée" } }
        - { id: locked, text: { en: "A locked time-based retention policy", fr: "Une stratégie de rétention limitée dans le temps verrouillée" } }
        - { id: soft, text: { en: "Blob soft delete with a 365-day retention period", fr: "La suppression réversible des objets blob avec une période de rétention de 365 jours" } }
    - id: lit
      options:
        - { id: hold, text: { en: "A legal hold", fr: "Une conservation légale" } }
        - { id: unlocked, text: { en: "An unlocked time-based retention policy", fr: "Une stratégie de rétention limitée dans le temps déverrouillée" } }
        - { id: locked, text: { en: "A locked time-based retention policy", fr: "Une stratégie de rétention limitée dans le temps verrouillée" } }
        - { id: soft, text: { en: "Blob soft delete with a 365-day retention period", fr: "La suppression réversible des objets blob avec une période de rétention de 365 jours" } }
answer:
  values: { trade: locked, lit: hold }
explanation:
  correct:
    en: |
      A time-based retention policy keeps blobs in a write once, read many (WORM) state for a fixed interval. Once locked, the policy cannot be deleted and its interval cannot be shortened, and only a locked policy satisfies SEC Rule 17a-4(f). A legal hold has no interval: blobs stay immutable until the hold is explicitly cleared, which fits a retention period that is not known in advance.
    fr: |
      Une stratégie de rétention limitée dans le temps maintient les objets blob dans un état WORM (write once, read many) pendant un intervalle fixe. Une fois verrouillée, la stratégie ne peut pas être supprimée et son intervalle ne peut pas être raccourci, et seule une stratégie verrouillée satisfait la règle SEC 17a-4(f). Une conservation légale n'a pas d'intervalle : les objets blob restent immuables jusqu'à la levée explicite de la conservation, ce qui convient à une durée de rétention inconnue à l'avance.
  options:
    unlocked: { en: "An unlocked policy can still be shortened or deleted; it is meant for testing and does not meet the regulation.", fr: "Une stratégie déverrouillée peut encore être raccourcie ou supprimée ; elle sert aux tests et ne satisfait pas la réglementation." }
    soft: { en: "Soft delete helps recover deleted or overwritten blobs for a limited period, but it does not prevent anyone from modifying or deleting them.", fr: "La suppression réversible aide à récupérer des objets blob supprimés ou écrasés pendant une période limitée, mais elle n'empêche personne de les modifier ou de les supprimer." }
references:
  - title: Store business-critical blob data with immutable storage in a write once, read many (WORM) state
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview
  - title: Container-level write once, read many (WORM) policies for immutable blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-container-level-worm-policies
