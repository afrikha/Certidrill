id: az305-2b-data-lake-namespace
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is building an analytics platform that will ingest several petabytes of raw CSV and Parquet files. Apache Spark jobs will process the files.

    You need to recommend a storage solution that meets the following requirements:

    - Organize the files in directories that can be renamed or deleted in a single atomic operation.
    - Control access with POSIX-style access control lists (ACLs) on individual directories and files.
    - Keep Blob Storage prices and access tiers.

    What should you recommend?
  fr: |
    Fabrikam développe une plateforme d'analytique qui ingérera plusieurs pétaoctets de fichiers CSV et Parquet bruts. Des travaux Apache Spark traiteront les fichiers.

    Vous devez recommander une solution de stockage qui répond aux exigences suivantes :

    - Organiser les fichiers dans des répertoires qui peuvent être renommés ou supprimés en une seule opération atomique.
    - Contrôler l'accès avec des listes de contrôle d'accès (ACL) de type POSIX sur chaque répertoire et chaque fichier.
    - Conserver les tarifs et les niveaux d'accès du Stockage Blob.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A premium file shares storage account with an NFS file share", fr: "Un compte de stockage de partages de fichiers Premium avec un partage de fichiers NFS" }
    - id: b
      text: { en: "A standard general-purpose v2 storage account with a flat namespace", fr: "Un compte de stockage standard usage général v2 avec un espace de noms plat" }
    - id: c
      text: { en: "An Azure NetApp Files capacity pool with NFS volumes", fr: "Un pool de capacité Azure NetApp Files avec des volumes NFS" }
    - id: d
      text: { en: "A standard general-purpose v2 storage account with a hierarchical namespace", fr: "Un compte de stockage standard usage général v2 avec un espace de noms hiérarchique" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Enabling the hierarchical namespace on a storage account unlocks Azure Data Lake Storage. Directories become real objects that are renamed or deleted in one atomic metadata operation, access is controlled with Azure RBAC and POSIX ACLs at the directory and file level, and the data is priced at Blob Storage levels with access tiers and lifecycle management.
    fr: |
      Activer l'espace de noms hiérarchique sur un compte de stockage débloque Azure Data Lake Storage. Les répertoires deviennent de vrais objets, renommés ou supprimés en une seule opération atomique sur les métadonnées ; l'accès est contrôlé par Azure RBAC et par des ACL POSIX au niveau des répertoires et des fichiers, et les données sont facturées au tarif du Stockage Blob, avec les niveaux d'accès et la gestion du cycle de vie.
  options:
    a:
      en: An NFS file share offers POSIX permissions, but on SSD media billed at Azure Files rates, without blob access tiers.
      fr: "Un partage de fichiers NFS offre des autorisations POSIX, mais sur un support SSD facturé au tarif d'Azure Files, sans niveaux d'accès des objets blob."
    b:
      en: With a flat namespace, directories are only name prefixes; renaming one means processing every blob under the prefix, and ACLs on directories and files are not available.
      fr: "Avec un espace de noms plat, les répertoires ne sont que des préfixes de noms : en renommer un oblige à traiter chaque objet blob sous ce préfixe, et les ACL sur les répertoires et les fichiers ne sont pas disponibles."
    c:
      en: Azure NetApp Files is a high-performance file service priced for demanding low-latency workloads, not a data lake at Blob Storage prices.
      fr: "Azure NetApp Files est un service de fichiers hautes performances tarifé pour des charges de travail exigeantes à faible latence, pas un lac de données au tarif du Stockage Blob."
references:
  - title: Introduction to Azure Data Lake Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction
