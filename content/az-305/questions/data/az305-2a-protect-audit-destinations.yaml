id: az305-2a-protect-audit-destinations
objective: "2.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware has three logical servers in Azure SQL Database. Auditing must be enabled on each server, with a destination that fits the way its audit records are used.

    - **sql-archive**: the audit records must be kept for seven years at the lowest storage cost and are rarely read.
    - **sql-pay**: the audit events must be streamed to a third-party SIEM product.
    - **sql-crm**: the audit events must be analyzed with KQL queries, together with other Azure Monitor logs.

    Which destination should you recommend for each server? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware possède trois serveurs logiques Azure SQL Database. L'audit doit être activé sur chaque serveur, avec une destination adaptée à l'usage de ses enregistrements d'audit.

    - **sql-archive** : les enregistrements d'audit doivent être conservés sept ans au coût de stockage le plus bas et sont rarement lus.
    - **sql-pay** : les événements d'audit doivent être diffusés vers un produit SIEM tiers.
    - **sql-crm** : les événements d'audit doivent être analysés avec des requêtes KQL, en même temps que d'autres journaux Azure Monitor.

    Quelle destination devez-vous recommander pour chaque serveur ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      sql-archive: [[archive]]

      sql-pay: [[siem]]

      sql-crm: [[analyze]]
    fr: |
      sql-archive : [[archive]]

      sql-pay : [[siem]]

      sql-crm : [[analyze]]
  slots:
    - id: archive
      options:
        - { id: a-sa, text: { en: "Azure Storage account", fr: "Compte Stockage Azure" } }
        - { id: a-la, text: { en: "Log Analytics workspace", fr: "Espace de travail Log Analytics" } }
        - { id: a-eh, text: Azure Event Hubs }
    - id: siem
      options:
        - { id: s-sa, text: { en: "Azure Storage account", fr: "Compte Stockage Azure" } }
        - { id: s-la, text: { en: "Log Analytics workspace", fr: "Espace de travail Log Analytics" } }
        - { id: s-eh, text: Azure Event Hubs }
    - id: analyze
      options:
        - { id: d-sa, text: { en: "Azure Storage account", fr: "Compte Stockage Azure" } }
        - { id: d-la, text: { en: "Log Analytics workspace", fr: "Espace de travail Log Analytics" } }
        - { id: d-eh, text: Azure Event Hubs }
answer:
  values: { archive: a-sa, siem: s-eh, analyze: d-la }
explanation:
  correct:
    en: Auditing for Azure SQL Database writes the audit log to a storage account, a Log Analytics workspace or Event Hubs. A storage account is the low-cost destination for long retention. An event hub is the streaming endpoint from which external tools such as a SIEM read events. A Log Analytics workspace stores the events with the other Azure Monitor logs and is queried with KQL.
    fr: L'audit d'Azure SQL Database écrit le journal d'audit dans un compte de stockage, un espace de travail Log Analytics ou Event Hubs. Un compte de stockage est la destination à faible coût pour une longue conservation. Un hub d'événements est le point de diffusion à partir duquel des outils externes, comme un SIEM, lisent les événements. Un espace de travail Log Analytics stocke les événements avec les autres journaux Azure Monitor et s'interroge en KQL.
  options:
    a-la: { en: "A workspace is built for interactive analysis. Keeping seven years of audit data there costs more than in a storage account.", fr: "Un espace de travail est conçu pour l'analyse interactive. Y conserver sept ans de données d'audit coûte plus cher que dans un compte de stockage." }
    s-sa: { en: "Files in a storage account aren't a stream that a SIEM consumes as events arrive.", fr: "Les fichiers d'un compte de stockage ne constituent pas un flux qu'un SIEM consomme à mesure que les événements arrivent." }
    d-eh: { en: "An event hub transports events. It offers no query language.", fr: "Un hub d'événements transporte des événements. Il n'offre aucun langage de requête." }
references:
  - title: Auditing for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/auditing-overview
