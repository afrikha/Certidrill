id: az305-2a-scale-pool-sizing
objective: "2.1.3"
type: dropdown
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Tailspin Toys plans to move 20 single databases into one elastic pool in the Standard service tier of Azure SQL Database. Monitoring of the databases shows the following:

    - Each database uses 15 DTUs on average.
    - Each database peaks at 100 DTUs.
    - At most four databases peak at the same time.

    You need to size the pool. The solution must meet the following requirements:

    - Each database must obtain 100 DTUs during its peak.
    - No database may consume more than its expected peak.
    - Minimize cost.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit de déplacer 20 bases de données uniques dans un pool élastique au niveau de service Standard d'Azure SQL Database. La supervision des bases de données montre les éléments suivants :

    - Chaque base de données utilise 15 DTU en moyenne.
    - Chaque base de données culmine à 100 DTU.
    - Quatre bases de données au plus culminent en même temps.

    Vous devez dimensionner le pool. La solution doit répondre aux exigences suivantes :

    - Chaque base de données doit obtenir 100 DTU pendant son pic.
    - Aucune base de données ne doit consommer plus que son pic attendu.
    - Réduire les coûts au minimum.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      eDTUs of the pool: [[pool]]

      Maximum eDTUs per database: [[dbmax]]
    fr: |
      eDTU du pool : [[pool]]

      eDTU maximum par base de données : [[dbmax]]
  slots:
    - id: pool
      options:
        - { id: p100, text: "100" }
        - { id: p300, text: "300" }
        - { id: p400, text: "400" }
        - { id: p2000, text: "2000" }
    - id: dbmax
      options:
        - { id: m20, text: "20" }
        - { id: m100, text: "100" }
        - { id: m400, text: "400" }
answer:
  values: { pool: p400, dbmax: m100 }
explanation:
  correct:
    en: A pool is sized on the larger of two values. The first is the sum of the average utilizations, 20 x 15 = 300 eDTUs. The second is the number of databases that peak together multiplied by their peak, 4 x 100 = 400 eDTUs. The pool therefore needs 400 eDTUs. A per-database maximum of 100 eDTUs lets each database reach its peak and stops any database from taking more.
    fr: Un pool se dimensionne sur la plus grande de deux valeurs. La première est la somme des utilisations moyennes, 20 x 15 = 300 eDTU. La seconde est le nombre de bases de données en pic simultané multiplié par leur pic, 4 x 100 = 400 eDTU. Le pool a donc besoin de 400 eDTU. Un maximum de 100 eDTU par base de données permet à chaque base d'atteindre son pic et empêche toute base d'en prendre davantage.
  options:
    p100: { en: "100 eDTUs cover one peak only, less than the 300 eDTUs of average use.", fr: "100 eDTU ne couvrent qu'un seul pic, moins que les 300 eDTU d'utilisation moyenne." }
    p300: { en: "300 eDTUs cover the average use but not four simultaneous peaks.", fr: "300 eDTU couvrent l'utilisation moyenne, mais pas quatre pics simultanés." }
    p2000: { en: "2,000 eDTUs equal the sum of all the peaks, which removes the saving of a pool.", fr: "2 000 eDTU correspondent à la somme de tous les pics, ce qui supprime l'économie d'un pool." }
    m20: { en: "A maximum of 20 eDTUs would throttle every database below its peak.", fr: "Un maximum de 20 eDTU briderait chaque base de données en dessous de son pic." }
    m400: { en: "A maximum of 400 eDTUs would let one database consume the whole pool.", fr: "Un maximum de 400 eDTU laisserait une seule base de données consommer tout le pool." }
references:
  - title: Elastic pools help you manage and scale multiple databases in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-pool-overview
