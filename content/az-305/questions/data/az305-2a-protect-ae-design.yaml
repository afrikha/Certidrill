id: az305-2a-protect-ae-design
objective: "2.1.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum is moving its human resources database to Azure SQL Database. The HR application runs on several instances of Azure App Service. Two columns of the Employees table will be protected with Always Encrypted so that database administrators can't read them.

    - **Salary** is only displayed by the application. It is never used to search or join, and it must receive the strongest protection.
    - **NationalID** is used by the application to find an employee by an exact value.
    - The keys that protect the column encryption keys must be kept in a central store that all the application instances can reach and to which access is granted through Microsoft Entra ID.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum déplace sa base de données de ressources humaines vers Azure SQL Database. L'application RH s'exécute sur plusieurs instances d'Azure App Service. Deux colonnes de la table Employees seront protégées par Always Encrypted afin que les administrateurs de base de données ne puissent pas les lire.

    - **Salary** est seulement affichée par l'application. Elle ne sert jamais à une recherche ni à une jointure, et elle doit recevoir la protection la plus forte.
    - **NationalID** est utilisée par l'application pour retrouver un employé à partir d'une valeur exacte.
    - Les clés qui protègent les clés de chiffrement de colonne doivent être conservées dans un magasin central, accessible à toutes les instances de l'application et dont l'accès est accordé par l'intermédiaire de Microsoft Entra ID.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Encryption type of Salary: [[salary]]

      Encryption type of NationalID: [[natid]]

      Store of the column master key: [[store]]
    fr: |
      Type de chiffrement de Salary : [[salary]]

      Type de chiffrement de NationalID : [[natid]]

      Magasin de la clé principale de colonne : [[store]]
  slots:
    - id: salary
      options:
        - { id: sal-det, text: { en: "Deterministic", fr: "Déterministe" } }
        - { id: sal-rand, text: { en: "Randomized", fr: "Aléatoire" } }
    - id: natid
      options:
        - { id: nat-det, text: { en: "Deterministic", fr: "Déterministe" } }
        - { id: nat-rand, text: { en: "Randomized", fr: "Aléatoire" } }
    - id: store
      options:
        - { id: st-cert, text: { en: "Windows certificate store", fr: "Magasin de certificats Windows" } }
        - { id: st-kv, text: Azure Key Vault }
        - { id: st-db, text: { en: "The database, in a table with restricted permissions", fr: "La base de données, dans une table aux autorisations restreintes" } }
answer:
  values: { salary: sal-rand, natid: nat-det, store: st-kv }
explanation:
  correct:
    en: Randomized encryption produces a different ciphertext each time, which is the most secure choice but prevents searching, grouping and joining on the column. Deterministic encryption always produces the same ciphertext for a given value, so the database can do equality lookups on NationalID. The column master key belongs in Azure Key Vault, a central store whose access is controlled through Microsoft Entra ID and which every application instance can reach.
    fr: Le chiffrement aléatoire produit un texte chiffré différent à chaque fois, ce qui est le choix le plus sûr, mais empêche la recherche, le regroupement et la jointure sur la colonne. Le chiffrement déterministe produit toujours le même texte chiffré pour une valeur donnée, donc la base de données peut effectuer des recherches d'égalité sur NationalID. La clé principale de colonne a sa place dans Azure Key Vault, un magasin central dont l'accès est contrôlé par Microsoft Entra ID et que chaque instance de l'application peut atteindre.
  options:
    sal-det: { en: "Deterministic encryption lets an observer see which rows share the same value, a weakness that Salary doesn't need to accept.", fr: "Le chiffrement déterministe laisse un observateur voir quelles lignes partagent la même valeur, une faiblesse que Salary n'a pas à accepter." }
    nat-rand: { en: "Without a secure enclave, a column with randomized encryption can't be used in an equality search.", fr: "Sans enclave sécurisée, une colonne à chiffrement aléatoire ne peut pas servir à une recherche d'égalité." }
    st-cert: { en: "A certificate store is local to one machine. The certificate would have to be deployed to every application instance, and access isn't granted through Microsoft Entra ID.", fr: "Un magasin de certificats est local à une machine. Il faudrait déployer le certificat sur chaque instance de l'application, et l'accès n'est pas accordé par Microsoft Entra ID." }
    st-db: { en: "Keeping the key in the database would put it within reach of the administrators it must be hidden from. The database stores only metadata about the keys.", fr: "Conserver la clé dans la base de données la mettrait à la portée des administrateurs auxquels elle doit être cachée. La base de données ne stocke que des métadonnées sur les clés." }
references:
  - title: Always Encrypted
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-database-engine
