id: az305-2b-security-replication-match
objective: "2.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum hosts a multitenant document service on Azure Blob Storage. The documents are block blobs in a standard general-purpose v2 storage account that has a flat namespace.

    Which feature should you recommend for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum héberge un service de documents multilocataire sur Stockage Blob Azure. Les documents sont des objets blob de blocs dans un compte de stockage standard usage général v2 doté d'un espace de noms plat.

    Quelle fonctionnalité devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: orp, text: { en: "Object replication", fr: "Réplication d'objets" } }
    - { id: cmk, text: { en: "A customer-managed key for the storage account", fr: "Une clé gérée par le client pour le compte de stockage" } }
    - { id: scope, text: { en: "Encryption scopes", fr: "Étendues de chiffrement" } }
    - { id: grs, text: { en: "Geo-redundant storage (GRS)", fr: "Stockage géoredondant (GRS)" } }
    - { id: ver, text: { en: "Blob versioning", fr: "Contrôle de version des objets blob" } }
  targets:
    - id: r1
      text: { en: "Maintain an asynchronous copy of selected containers in a storage account of another subscription, in a region that Adatum chooses", fr: "Conserver une copie asynchrone de conteneurs choisis dans un compte de stockage d'un autre abonnement, dans une région choisie par Adatum" }
    - id: r2
      text: { en: "Make all the blobs of the account unreadable by disabling a single key that Adatum controls in Azure Key Vault", fr: "Rendre tous les objets blob du compte illisibles en désactivant une seule clé contrôlée par Adatum dans Azure Key Vault" }
    - id: r3
      text: { en: "Encrypt the blobs of each customer with a different key inside the same storage account", fr: "Chiffrer les objets blob de chaque client avec une clé différente au sein du même compte de stockage" }
answer:
  mapping: { r1: orp, r2: cmk, r3: scope }
explanation:
  correct:
    en: |
      Object replication asynchronously copies the block blobs of chosen containers to a destination account, which can be in another region and another subscription. With a customer-managed key in Azure Key Vault, disabling the key makes read and write operations on the blobs fail until the key is restored. Encryption scopes apply a separate key to a container or a blob, which isolates the data of different customers in one account.
    fr: |
      La réplication d'objets copie de façon asynchrone les objets blob de blocs de conteneurs choisis vers un compte de destination, qui peut se trouver dans une autre région et un autre abonnement. Avec une clé gérée par le client dans Azure Key Vault, désactiver la clé fait échouer les opérations de lecture et d'écriture sur les objets blob jusqu'au rétablissement de la clé. Les étendues de chiffrement appliquent une clé distincte à un conteneur ou à un objet blob, ce qui isole les données de différents clients dans un même compte.
  options:
    grs: { en: "GRS copies the whole account to the secondary region that Azure determines, inside the same account; you choose neither the containers, nor the region, nor another subscription.", fr: "GRS copie tout le compte vers la région secondaire déterminée par Azure, au sein du même compte ; vous ne choisissez ni les conteneurs, ni la région, ni un autre abonnement." }
    ver: { en: "Blob versioning keeps previous versions of blobs; it is a prerequisite of object replication, not a copy or an encryption feature.", fr: "Le contrôle de version des objets blob conserve les versions précédentes des objets blob ; c'est un prérequis de la réplication d'objets, pas une fonctionnalité de copie ou de chiffrement." }
references:
  - title: Object replication for block blobs
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/object-replication-overview
  - title: Encryption scopes for Blob storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/encryption-scope-overview
