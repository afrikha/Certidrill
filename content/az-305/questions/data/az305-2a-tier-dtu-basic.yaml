id: az305-2a-tier-dtu-basic
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys needs a database in Azure SQL Database for an internal reference-data application. The database holds 800 MB of data and will never exceed 1.5 GB. A handful of users run light queries throughout the day, every day.

    You need to recommend a service tier that meets the following requirements:

    - Pay one fixed monthly price that bundles compute and storage.
    - Minimize cost.

    What should you recommend?
  fr: |
    Wingtip Toys a besoin d'une base de données Azure SQL Database pour une application interne de données de référence. La base de données contient 800 Mo de données et ne dépassera jamais 1,5 Go. Quelques utilisateurs exécutent des requêtes légères tout au long de la journée, tous les jours.

    Vous devez recommander un niveau de service qui répond aux exigences suivantes :

    - Payer un prix mensuel fixe qui regroupe le calcul et le stockage.
    - Réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "General Purpose with serverless compute", fr: "General Purpose avec calcul serverless" }
    - id: b
      text: { en: "Standard", fr: "Standard" }
    - id: c
      text: { en: "General Purpose with provisioned compute", fr: "General Purpose avec calcul provisionné" }
    - id: d
      text: { en: "Basic", fr: "Basic" }
answer: { optionId: d }
explanation:
  correct:
    en: The DTU purchasing model sells compute, storage and I/O as one bundle at a fixed price. Basic is its smallest tier, with 5 DTUs and up to 2 GB of storage, which covers a 1.5 GB database with a light workload at the lowest price of Azure SQL Database.
    fr: Le modèle d'achat DTU vend le calcul, le stockage et les E/S sous forme d'un ensemble à prix fixe. Basic est son plus petit niveau, avec 5 DTU et jusqu'à 2 Go de stockage, ce qui couvre une base de données de 1,5 Go à faible charge au prix le plus bas d'Azure SQL Database.
  options:
    a:
      en: Serverless is billed per second according to usage, so the price isn't fixed. A database that is queried all day never pauses.
      fr: Le serverless est facturé à la seconde selon l'utilisation, donc le prix n'est pas fixe. Une base de données interrogée toute la journée ne se met jamais en pause.
    b:
      en: Standard is also a bundled DTU tier, but it costs more than Basic and its extra capacity isn't needed.
      fr: Standard est aussi un niveau DTU groupé, mais il coûte plus cher que Basic et sa capacité supplémentaire est inutile.
    c:
      en: The vCore model bills compute and storage separately, and its smallest provisioned size costs far more than Basic.
      fr: Le modèle vCore facture séparément le calcul et le stockage, et sa plus petite taille provisionnée coûte bien plus cher que Basic.
references:
  - title: DTU-based purchasing model overview
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tiers-dtu
