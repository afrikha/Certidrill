id: az305-2b-account-selection
objective: "2.2.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Contoso plans to deploy the storage accounts shown in the following table. Each account will store block blobs.

    You need to choose a storage account for two data sets. For each data set, the account must meet the requirements at the lowest cost.

    Answer each prompt by selecting the appropriate storage account in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit de déployer les comptes de stockage présentés dans le tableau suivant. Chaque compte stockera des objets blob de blocs.

    Vous devez choisir un compte de stockage pour deux jeux de données. Pour chaque jeu de données, le compte doit répondre aux exigences au coût le plus bas.

    Répondez à chaque consigne en sélectionnant le compte de stockage approprié dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Compliance records that are moved to the archive tier after one year and of which a copy must exist in a second region", fr: "Documents de conformité déplacés vers le niveau archive (Archive) au bout d'un an et dont une copie doit exister dans une seconde région" }
    - id: p2
      text: { en: "Intermediate data that can be regenerated at any time and that a lifecycle management policy moves to the cool tier after 30 days", fr: "Données intermédiaires qui peuvent être régénérées à tout moment et qu'une stratégie de gestion du cycle de vie déplace vers le niveau froid (Cool) au bout de 30 jours" }
  grid:
    header: [{ en: "Name", fr: "Nom" }, { en: "Account type", fr: "Type de compte" }, { en: "Redundancy", fr: "Redondance" }]
    rows:
      - [{ text: stcontoso1, area: a1 }, { text: { en: "Standard general-purpose v2", fr: "Standard usage général v2" } }, { text: LRS }]
      - [{ text: stcontoso2, area: a2 }, { text: { en: "Standard general-purpose v2", fr: "Standard usage général v2" } }, { text: ZRS }]
      - [{ text: stcontoso3, area: a3 }, { text: { en: "Standard general-purpose v2", fr: "Standard usage général v2" } }, { text: GRS }]
      - [{ text: stcontoso4, area: a4 }, { text: { en: "Standard general-purpose v2", fr: "Standard usage général v2" } }, { text: GZRS }]
      - [{ text: stcontoso5, area: a5 }, { text: { en: "Premium block blobs", fr: "Objets blob de blocs Premium" } }, { text: LRS }]
answer:
  values: { p1: a3, p2: a1 }
explanation:
  correct:
    en: |
      The archive tier is supported only in LRS, GRS and RA-GRS accounts, not in ZRS, GZRS or RA-GZRS accounts; of the accounts that copy data to a second region, only stcontoso3 (GRS) can archive blobs. Data that can be regenerated needs no protection beyond LRS, the least expensive redundancy, and stcontoso1 is a general-purpose v2 account, so lifecycle management can move its blobs to the cool tier.
    fr: |
      Le niveau archive (Archive) n'est pris en charge que dans les comptes LRS, GRS et RA-GRS, pas dans les comptes ZRS, GZRS ou RA-GZRS ; parmi les comptes qui copient les données dans une seconde région, seul stcontoso3 (GRS) peut archiver des objets blob. Des données qui peuvent être régénérées n'ont pas besoin d'une protection supérieure à LRS, la redondance la moins coûteuse, et stcontoso1 est un compte usage général v2 : la gestion du cycle de vie peut donc déplacer ses objets blob vers le niveau froid (Cool).
  options:
    a4: { en: "GZRS keeps a copy in a second region, but the archive tier is not supported with it.", fr: "GZRS conserve une copie dans une seconde région, mais le niveau archive (Archive) n'est pas pris en charge avec cette redondance." }
    a5: { en: "A premium block blobs account also uses LRS, but its blobs cannot be moved to another access tier, and premium storage costs more.", fr: "Un compte d'objets blob de blocs Premium utilise aussi LRS, mais ses objets blob ne peuvent pas changer de niveau d'accès, et le stockage Premium coûte plus cher." }
references:
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
