id: az305-2b-cosmos-rpo-design
objective: "2.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso runs a payment ledger on an Azure Cosmos DB for NoSQL account that is deployed in the West Europe region only. The account uses Session consistency.

    The company now requires that no committed write is lost if West Europe becomes unavailable, that is, a recovery point objective (RPO) of zero for a regional outage.

    You need to recommend changes to the account.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exploite un grand livre de paiements sur un compte Azure Cosmos DB for NoSQL déployé uniquement dans la région West Europe. Le compte utilise la cohérence Session.

    L'entreprise exige désormais qu'aucune écriture validée ne soit perdue si West Europe devient indisponible, c'est-à-dire un objectif de point de récupération (RPO) de zéro pour une panne régionale.

    Vous devez recommander des modifications du compte.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Region configuration: [[topo]]

      Default consistency level: [[cons]]

      RPO for a regional outage if Contoso adds a region but keeps Session consistency: [[rpo]]
    fr: |
      Configuration des régions : [[topo]]

      Niveau de cohérence par défaut : [[cons]]

      RPO pour une panne régionale si Contoso ajoute une région mais conserve la cohérence Session : [[rpo]]
  slots:
    - id: topo
      options:
        - { id: az, text: { en: "Keep one region and enable availability zones", fr: "Conserver une seule région et activer les zones de disponibilité" } }
        - { id: multi, text: { en: "Add a second region and enable multiple write regions", fr: "Ajouter une seconde région et activer plusieurs régions d'écriture" } }
        - { id: single, text: { en: "Add a second region and keep a single write region", fr: "Ajouter une seconde région et conserver une seule région d'écriture" } }
    - id: cons
      options:
        - { id: session, text: Session }
        - { id: bounded, text: Bounded staleness }
        - { id: strong, text: Strong }
    - id: rpo
      options:
        - { id: zero, text: "0" }
        - { id: m15, text: { en: "Less than 15 minutes", fr: "Moins de 15 minutes" } }
        - { id: m240, text: { en: "Less than 240 minutes", fr: "Moins de 240 minutes" } }
answer:
  values: { topo: single, cons: strong, rpo: m15 }
explanation:
  correct:
    en: |
      Only an account that spans more than one region, has a single write region and uses Strong consistency offers an RPO of 0 for a regional outage, because a write is committed in the other regions before it is acknowledged. Strong consistency cannot be used with multiple write regions. With Session, Consistent prefix or Eventual consistency, a multi-region account has an RPO of less than 15 minutes; a single-region account has an RPO of less than 240 minutes, whatever its consistency level.
    fr: |
      Seul un compte qui s'étend sur plus d'une région, possède une seule région d'écriture et utilise la cohérence Strong offre un RPO de 0 pour une panne régionale, car une écriture est validée dans les autres régions avant d'être acquittée. La cohérence Strong ne peut pas être utilisée avec plusieurs régions d'écriture. Avec la cohérence Session, Consistent prefix ou Eventual, un compte multirégion a un RPO inférieur à 15 minutes ; un compte à une seule région a un RPO inférieur à 240 minutes, quel que soit son niveau de cohérence.
  options:
    az: { en: "Availability zones protect against a zone failure, not against the loss of the region.", fr: "Les zones de disponibilité protègent contre une défaillance de zone, pas contre la perte de la région." }
    bounded: { en: "With Bounded staleness, the RPO equals the configured staleness window (K versions or T seconds), not zero.", fr: "Avec Bounded staleness, le RPO est égal à la fenêtre d'obsolescence configurée (K versions ou T secondes), et non à zéro." }
references:
  - title: Consistency levels in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
  - title: Reliability in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-cosmos-db-nosql
