id: az305-cs4a-instance-tier
objective: "2.1.2"
type: single
caseStudy: az305-cs4a-relecloud
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a configuration of Azure SQL Managed Instance for the databases of SQL-PAY. The solution must meet the managed instance requirements and minimize costs.

    What should you recommend?
  fr: |
    Vous devez recommander une configuration d'Azure SQL Managed Instance pour les bases de données de SQL-PAY. La solution doit respecter les exigences relatives à l'instance managée et réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: One instance in the General Purpose service tier
        fr: Une instance du niveau de service General Purpose
    - id: b
      text:
        en: One instance in the Business Critical service tier
        fr: Une instance du niveau de service Business Critical
    - id: c
      text:
        en: Five instances in the General Purpose service tier, with the customer databases distributed among them
        fr: Cinq instances du niveau de service General Purpose, entre lesquelles les bases de données des clients sont réparties
    - id: d
      text:
        en: One instance in the Next-gen General Purpose service tier
        fr: Une instance du niveau de service Next-gen General Purpose
answer: { optionId: d }
explanation:
  correct:
    en: |
      Relecloud expects 425 databases (420 customer databases and five reference databases) and 28 TB in one instance. A Next-gen General Purpose instance accepts up to 500 databases and 32 TB of storage, whereas General Purpose and Business Critical stop at 100 databases and 16 TB per instance. It remains a General Purpose tier: Relecloud does not pay for the local SSD storage and the readable replica of Business Critical, which it does not need.
    fr: |
      Relecloud prévoit 425 bases de données (420 bases de clients et cinq bases de référence) et 28 To dans une seule instance. Une instance Next-gen General Purpose accepte jusqu'à 500 bases de données et 32 To de stockage, alors que General Purpose et Business Critical s'arrêtent à 100 bases de données et 16 To par instance. Ce niveau reste un niveau General Purpose : Relecloud ne paie pas le stockage SSD local ni le réplica lisible de Business Critical, dont il n'a pas besoin.
  options:
    a:
      en: "A General Purpose instance is limited to 100 databases and 16 TB: it cannot even hold the 305 databases and 20 TB of today."
      fr: "Une instance General Purpose est limitée à 100 bases de données et 16 To : elle ne peut même pas contenir les 305 bases de données et les 20 To actuels."
    b:
      en: "Business Critical has the same limits of 100 databases and 16 TB, and it bills for local SSD storage and a readable replica that Relecloud does not require."
      fr: "Business Critical a les mêmes limites de 100 bases de données et 16 To, et facture un stockage SSD local et un réplica lisible dont Relecloud n'a pas besoin."
    c:
      en: "Several instances would respect the limits of General Purpose, but each reference database would have to be copied to every instance, which the requirements forbid."
      fr: "Plusieurs instances respecteraient les limites de General Purpose, mais chaque base de données de référence devrait être copiée dans chaque instance, ce que les exigences interdisent."
references:
  - title: vCore purchasing model - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/service-tiers-managed-instance-vcore
