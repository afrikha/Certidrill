id: az305-2c-ana-synapse-engines
objective: "2.3.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans to deploy an Azure Synapse Analytics workspace that is attached to an Azure Data Lake Storage account. The following table lists the components that the workspace can provide.

    You need to recommend a component for each requirement. Answer each prompt by selecting the appropriate component in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit de déployer un espace de travail Azure Synapse Analytics rattaché à un compte Azure Data Lake Storage. Le tableau suivant répertorie les composants que l'espace de travail peut fournir.

    Vous devez recommander un composant pour chaque exigence. Répondez à chaque consigne en sélectionnant le composant approprié dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Data engineers must prepare data and train machine learning models in notebooks inside the workspace.", fr: "Les ingénieurs de données doivent préparer les données et entraîner des modèles de machine learning dans des notebooks au sein de l'espace de travail." }
    - id: p2
      text: { en: "Enterprise reports must get predictable query performance from reserved compute, on a star schema loaded into distributed tables.", fr: "Les rapports d'entreprise doivent obtenir des performances de requête prévisibles à partir d'un calcul réservé, sur un schéma en étoile chargé dans des tables distribuées." }
  grid:
    header: [{ en: "Component", fr: "Composant" }, { en: "Category", fr: "Catégorie" }]
    rows:
      - [{ text: { en: "Serverless SQL pool", fr: "Pool SQL serverless" }, area: serverless }, { text: { en: "SQL engine", fr: "Moteur SQL" } }]
      - [{ text: { en: "Dedicated SQL pool", fr: "Pool SQL dédié" }, area: dedicated }, { text: { en: "SQL engine", fr: "Moteur SQL" } }]
      - [{ text: { en: "Apache Spark pool", fr: "Pool Apache Spark" }, area: spark }, { text: { en: "Spark engine", fr: "Moteur Spark" } }]
      - [{ text: { en: "Synapse pipelines", fr: "Pipelines Synapse" }, area: pipelines }, { text: { en: "Data integration", fr: "Intégration de données" } }]
answer:
  values: { p1: spark, p2: dedicated }
explanation:
  correct:
    en: |
      An Apache Spark pool provides managed Spark, the engine for data preparation, data engineering and machine learning, which notebooks in the workspace use. A dedicated SQL pool is the provisioned data warehouse: its compute is reserved and sized in data warehouse units, and data is loaded into tables that are distributed over the compute nodes, which gives predictable performance. A serverless SQL pool has no reserved compute and no stored tables, and pipelines orchestrate activities without being an analytics engine.
    fr: |
      Un pool Apache Spark fournit un Spark managé, le moteur de la préparation des données, de l'ingénierie des données et du machine learning, qu'utilisent les notebooks de l'espace de travail. Un pool SQL dédié est l'entrepôt de données provisionné : son calcul est réservé et dimensionné en Data Warehouse Units, et les données sont chargées dans des tables distribuées sur les nœuds de calcul, ce qui donne des performances prévisibles. Un pool SQL serverless n'a ni calcul réservé ni tables stockées, et les pipelines orchestrent des activités sans être un moteur d'analytique.
references:
  - title: What is Azure Synapse Analytics?
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/overview-what-is
  - title: What is Azure Synapse SQL architecture?
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql/overview-architecture
