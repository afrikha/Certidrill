id: az305-2b-storage-cost-reduction
objective: "2.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam stores 500 TiB of application logs as block blobs in a standard general-purpose v2 storage account. The account uses RA-GZRS, and all the blobs are in the hot tier.

    A review produces the following findings:

    - A log is read intensively for 30 days after its creation, and then about once per quarter.
    - Any log must remain readable within milliseconds for two years.
    - The data must survive the failure of an availability zone.
    - A copy of the data in a second region is no longer required.

    You need to reduce the storage costs.

    Which two changes should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam stocke 500 Tio de journaux d'application sous forme d'objets blob de blocs dans un compte de stockage standard usage général v2. Le compte utilise RA-GZRS, et tous les objets blob sont au niveau chaud (Hot).

    Une revue aboutit aux constats suivants :

    - Un journal est lu intensivement pendant les 30 jours qui suivent sa création, puis environ une fois par trimestre.
    - Tout journal doit rester lisible en quelques millisecondes pendant deux ans.
    - Les données doivent survivre à la défaillance d'une zone de disponibilité.
    - Une copie des données dans une seconde région n'est plus exigée.

    Vous devez réduire les coûts de stockage.

    Quelles sont les deux modifications à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Change the redundancy of the storage account to LRS", fr: "Remplacer la redondance du compte de stockage par LRS" }
    - id: b
      text: { en: "Add a lifecycle management rule that moves blobs to the cold tier 30 days after their creation", fr: "Ajouter une règle de gestion du cycle de vie qui déplace les objets blob vers le niveau froid (Cold) 30 jours après leur création" }
    - id: c
      text: { en: "Add a lifecycle management rule that moves blobs to the archive tier 30 days after their creation", fr: "Ajouter une règle de gestion du cycle de vie qui déplace les objets blob vers le niveau archive (Archive) 30 jours après leur création" }
    - id: d
      text: { en: "Change the redundancy of the storage account to ZRS", fr: "Remplacer la redondance du compte de stockage par ZRS" }
    - id: e
      text: { en: "Copy the blobs to a premium block blobs storage account", fr: "Copier les objets blob dans un compte de stockage d'objets blob de blocs Premium" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      ZRS keeps synchronous copies in several availability zones of the region, which is all that is still required, and removes the cost of the geo-replicated copy and of read access to it. The cold tier is an online tier with a lower storage price than hot and cool: logs that are read about once per quarter stay readable within milliseconds, and the two-year retention exceeds the 90-day minimum.
    fr: |
      ZRS conserve des copies synchrones dans plusieurs zones de disponibilité de la région, ce qui est tout ce qui reste exigé, et supprime le coût de la copie géorépliquée et de son accès en lecture. Le niveau froid (Cold) est un niveau en ligne dont le prix de stockage est inférieur à celui des niveaux chaud (Hot) et froid (Cool) : des journaux lus environ une fois par trimestre restent lisibles en quelques millisecondes, et la rétention de deux ans dépasse le minimum de 90 jours.
  options:
    a: { en: "LRS is cheaper still, but it keeps all copies in one datacenter and does not survive a zone failure.", fr: "LRS est encore moins cher, mais conserve toutes les copies dans un seul centre de données et ne survit pas à une défaillance de zone." }
    c: { en: "Archived blobs are offline and take hours to rehydrate, and the archive tier is not supported in ZRS, GZRS or RA-GZRS accounts.", fr: "Les objets blob archivés sont hors connexion et demandent des heures de réhydratation, et le niveau archive (Archive) n'est pas pris en charge dans les comptes ZRS, GZRS ou RA-GZRS." }
    e: { en: "A premium block blobs account targets low-latency, high-transaction workloads, has no access tiers and would raise the storage price.", fr: "Un compte d'objets blob de blocs Premium vise des charges de travail à faible latence et à fortes transactions, n'a pas de niveaux d'accès et augmenterait le prix du stockage." }
references:
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
