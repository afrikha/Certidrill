id: az305-2a-tier-characteristics-dd
objective: "2.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are preparing a design guide that describes the service tiers of Azure SQL Database.

    Which service tier matches each description? To answer, drag the appropriate service tiers to the correct descriptions. Each service tier may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez un guide de conception qui décrit les niveaux de service d'Azure SQL Database.

    Quel niveau de service correspond à chaque description ? Pour répondre, faites glisser les niveaux de service appropriés vers les descriptions correspondantes. Chaque niveau de service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: basic, text: Basic }
    - { id: std, text: Standard }
    - { id: gp, text: General Purpose }
    - { id: bc, text: Business Critical }
    - { id: hs, text: Hyperscale }
  targets:
    - id: t1
      text:
        en: Storage decoupled from compute that grows up to 128 TB, with backups based on storage snapshots
        fr: Stockage découplé du calcul qui s'étend jusqu'à 128 To, avec des sauvegardes fondées sur des instantanés de stockage
    - id: t2
      text:
        en: vCore tier on remote premium storage with a latency of 5 to 10 ms, for most business workloads
        fr: Niveau vCore sur stockage Premium distant avec une latence de 5 à 10 ms, pour la plupart des charges de travail métier
    - id: t3
      text:
        en: Local SSD storage and three secondary replicas, one of which serves read-only queries at no extra cost
        fr: Stockage SSD local et trois réplicas secondaires, dont un sert les requêtes en lecture seule sans surcoût
answer:
  mapping: { t1: hs, t2: gp, t3: bc }
explanation:
  correct:
    en: Hyperscale separates compute from a distributed storage layer that grows up to 128 TB and is backed up with snapshots. General Purpose is the budget-oriented vCore tier, on remote premium storage with a latency of 5 to 10 ms. Business Critical places the data on local SSD storage, with a latency of 1 to 2 ms, and maintains three secondary replicas, one of them readable for free.
    fr: Hyperscale sépare le calcul d'une couche de stockage distribuée qui s'étend jusqu'à 128 To et qui est sauvegardée par des instantanés. General Purpose est le niveau vCore économique, sur un stockage Premium distant avec une latence de 5 à 10 ms. Business Critical place les données sur un stockage SSD local, avec une latence de 1 à 2 ms, et maintient trois réplicas secondaires, dont un lisible gratuitement.
  options:
    basic: { en: "Basic is the smallest DTU tier, with 5 DTUs and 2 GB of storage.", fr: "Basic est le plus petit niveau DTU, avec 5 DTU et 2 Go de stockage." }
    std: { en: "Standard is a DTU tier, not a vCore tier, and it stores at most 1 TB.", fr: "Standard est un niveau DTU, pas un niveau vCore, et il stocke au plus 1 To." }
references:
  - title: vCore purchasing model - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tiers-sql-database-vcore
  - title: Hyperscale service tier
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tier-hyperscale
