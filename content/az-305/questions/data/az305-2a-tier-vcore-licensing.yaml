id: az305-2a-tier-vcore-licensing
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs a billing database in Azure SQL Database, in the Standard service tier of the DTU purchasing model. The load is steady around the clock, and the database will be kept for at least three years.

    Northwind Traders owns SQL Server core licenses with active Software Assurance that are no longer used on-premises.

    You need to recommend a new configuration that meets the following requirements:

    - Add storage without paying for more compute.
    - Reuse the existing licenses.
    - Obtain the lowest compute price over the three years.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders exécute une base de données de facturation dans Azure SQL Database, au niveau de service Standard du modèle d'achat DTU. La charge est stable 24 heures sur 24, et la base de données sera conservée au moins trois ans.

    Northwind Traders possède des licences SQL Server par cœur avec Software Assurance active, qui ne sont plus utilisées en local.

    Vous devez recommander une nouvelle configuration qui répond aux exigences suivantes :

    - Ajouter du stockage sans payer davantage de calcul.
    - Réutiliser les licences existantes.
    - Obtenir le prix de calcul le plus bas sur les trois ans.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Purchasing model and service tier: [[model]]

      Licensing: [[license]]

      Compute pricing: [[pricing]]
    fr: |
      Modèle d'achat et niveau de service : [[model]]

      Licences : [[license]]

      Tarification du calcul : [[pricing]]
  slots:
    - id: model
      options:
        - { id: dtu-prem, text: { en: "DTU model, Premium", fr: "Modèle DTU, Premium" } }
        - { id: vcore-gp, text: { en: "vCore model, General Purpose", fr: "Modèle vCore, General Purpose" } }
        - { id: dtu-std, text: { en: "DTU model, Standard with a larger size", fr: "Modèle DTU, Standard avec une taille supérieure" } }
    - id: license
      options:
        - { id: included, text: { en: "License included", fr: "Licence incluse" } }
        - { id: ahb, text: Azure Hybrid Benefit }
    - id: pricing
      options:
        - { id: sless, text: { en: "Serverless compute", fr: "Calcul serverless" } }
        - { id: payg, text: { en: "Provisioned compute, pay-as-you-go", fr: "Calcul provisionné, paiement à l'utilisation" } }
        - { id: reserved, text: { en: "Provisioned compute with a three-year reservation", fr: "Calcul provisionné avec une réservation de trois ans" } }
answer:
  values: { model: vcore-gp, license: ahb, pricing: reserved }
explanation:
  correct:
    en: Only the vCore model sizes storage independently of compute, and it is also the only model that accepts Azure Hybrid Benefit and reserved capacity. Azure Hybrid Benefit applies the existing licenses with Software Assurance, so the software part of the price is no longer paid. A three-year reservation gives the largest discount on provisioned compute for a workload that runs around the clock.
    fr: Seul le modèle vCore dimensionne le stockage indépendamment du calcul, et c'est aussi le seul modèle qui accepte Azure Hybrid Benefit et la capacité réservée. Azure Hybrid Benefit applique les licences existantes avec Software Assurance, si bien que la part logicielle du prix n'est plus payée. Une réservation de trois ans donne la remise la plus forte sur le calcul provisionné pour une charge de travail qui s'exécute 24 heures sur 24.
  options:
    dtu-prem: { en: "DTU tiers bundle compute and storage and accept neither Azure Hybrid Benefit nor reservations.", fr: "Les niveaux DTU regroupent calcul et stockage et n'acceptent ni Azure Hybrid Benefit ni les réservations." }
    dtu-std: { en: "A larger DTU size adds compute together with storage, which is what must be avoided.", fr: "Une taille DTU supérieure ajoute du calcul en même temps que du stockage, ce qu'il faut justement éviter." }
    included: { en: "License included means paying again for licenses that Northwind Traders already owns.", fr: "Avec la licence incluse, Northwind Traders paierait de nouveau des licences qu'il possède déjà." }
    sless: { en: "Serverless suits intermittent use. With a steady load around the clock it never pauses, and Azure Hybrid Benefit doesn't apply to it.", fr: "Le serverless convient à une utilisation intermittente. Avec une charge stable 24 heures sur 24, il ne se met jamais en pause, et Azure Hybrid Benefit ne s'y applique pas." }
    payg: { en: "Pay-as-you-go provisioned compute works but forgoes the reservation discount.", fr: "Le calcul provisionné payé à l'utilisation fonctionne, mais renonce à la remise de réservation." }
references:
  - title: Compare vCore and DTU-based purchasing models of Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/purchasing-models
  - title: "Save on compute costs with Azure Reservations - Azure SQL Database & SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/reserved-capacity-overview
