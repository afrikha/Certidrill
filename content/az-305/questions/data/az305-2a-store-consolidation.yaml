id: az305-2a-store-consolidation
objective: "2.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso plans to migrate three on-premises SQL Server instances to Azure.

    | Instance | Databases | Total size | Features in use | Additional requirement |
    | --- | --- | --- | --- | --- |
    | SQL1 | 1 | 300 GB | Change data capture, full-text search | Compute must scale automatically with the load |
    | SQL2 | 9 | 6 TB | Cross-database transactions, SQL Server Agent jobs | None |
    | SQL3 | 4 | 40 TB | Cross-database queries, Service Broker | None |

    The database code must not change. Each instance must move to a platform as a service (PaaS) offering whenever one supports the workload.

    What should you recommend for each instance? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit de migrer trois instances SQL Server locales vers Azure.

    | Instance | Bases de données | Taille totale | Fonctionnalités utilisées | Exigence supplémentaire |
    | --- | --- | --- | --- | --- |
    | SQL1 | 1 | 300 Go | Capture des changements de données, recherche en texte intégral | Le calcul doit se mettre à l'échelle automatiquement selon la charge |
    | SQL2 | 9 | 6 To | Transactions entre bases de données, travaux SQL Server Agent | Aucune |
    | SQL3 | 4 | 40 To | Requêtes entre bases de données, Service Broker | Aucune |

    Le code des bases de données ne doit pas changer. Chaque instance doit être déplacée vers une offre PaaS (platform as a service) dès lors qu'une telle offre prend en charge la charge de travail.

    Que devez-vous recommander pour chaque instance ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      SQL1: [[sql1]]

      SQL2: [[sql2]]

      SQL3: [[sql3]]
    fr: |
      SQL1 : [[sql1]]

      SQL2 : [[sql2]]

      SQL3 : [[sql3]]
  slots:
    - id: sql1
      options:
        - { id: s1-db, text: Azure SQL Database }
        - { id: s1-mi, text: Azure SQL Managed Instance }
        - { id: s1-vm, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur machines virtuelles Azure" } }
    - id: sql2
      options:
        - { id: s2-db, text: Azure SQL Database }
        - { id: s2-mi, text: Azure SQL Managed Instance }
        - { id: s2-vm, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur machines virtuelles Azure" } }
    - id: sql3
      options:
        - { id: s3-db, text: Azure SQL Database }
        - { id: s3-mi, text: Azure SQL Managed Instance }
        - { id: s3-vm, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur machines virtuelles Azure" } }
answer:
  values: { sql1: s1-db, sql2: s2-mi, sql3: s3-vm }
explanation:
  correct:
    en: Change data capture and full-text search are both available in Azure SQL Database, and only its serverless compute tier scales compute automatically, so SQL1 goes to Azure SQL Database. Cross-database transactions and SQL Server Agent require SQL Managed Instance, and 6 TB fits in an instance. SQL3 needs the same instance features but its 40 TB exceed the 32 TB that the largest managed instance stores, so it has to run on SQL Server on Azure Virtual Machines.
    fr: La capture des changements de données et la recherche en texte intégral sont toutes deux disponibles dans Azure SQL Database, et seul son niveau de calcul serverless met le calcul à l'échelle automatiquement. SQL1 va donc dans Azure SQL Database. Les transactions entre bases de données et SQL Server Agent exigent SQL Managed Instance, et 6 To tiennent dans une instance. SQL3 a besoin des mêmes fonctionnalités d'instance, mais ses 40 To dépassent les 32 To que stocke la plus grande instance managée. Elle doit donc s'exécuter dans SQL Server sur machines virtuelles Azure.
  options:
    s1-mi: { en: "SQL Managed Instance supports the features but has no autoscaling. Its compute is reserved.", fr: "SQL Managed Instance prend en charge les fonctionnalités, mais n'a pas de mise à l'échelle automatique. Son calcul est réservé." }
    s2-db: { en: "Azure SQL Database has no SQL Server Agent and no cross-database transactions without code changes.", fr: "Azure SQL Database n'a ni SQL Server Agent ni transactions entre bases de données sans modification du code." }
    s2-vm: { en: "A virtual machine works, but a PaaS offering supports this workload.", fr: "Une machine virtuelle convient, mais une offre PaaS prend en charge cette charge de travail." }
    s3-mi: { en: "A managed instance stores up to 16 TB, or 32 TB in the Next-gen General Purpose tier.", fr: "Une instance managée stocke jusqu'à 16 To, ou 32 To au niveau Next-gen General Purpose." }
    s3-db: { en: "Hyperscale could hold 40 TB, but Azure SQL Database supports neither Service Broker nor cross-database queries.", fr: "Hyperscale pourrait contenir 40 To, mais Azure SQL Database ne prend en charge ni Service Broker ni les requêtes entre bases de données." }
references:
  - title: "Features comparison: Azure SQL Database and Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
