id: az305-2a-scale-readonly-intent
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders hosts its order database in Azure SQL Database, in the Business Critical service tier. A reporting tool runs heavy read-only queries on the database and slows down order entry.

    You need to recommend a solution that meets the following requirements:

    - Remove the load of the reporting tool from the replica that processes the orders.
    - Add no cost.
    - Minimize changes. Reports may show data that is a few seconds old.

    What should you include in the recommendation?
  fr: |
    Northwind Traders héberge sa base de données de commandes dans Azure SQL Database, au niveau de service Business Critical. Un outil de reporting exécute de lourdes requêtes en lecture seule sur la base de données et ralentit la saisie des commandes.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Retirer la charge de l'outil de reporting du réplica qui traite les commandes.
    - N'ajouter aucun coût.
    - Réduire les modifications au minimum. Les rapports peuvent afficher des données vieilles de quelques secondes.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - id: a
      text: { en: "A readable secondary database created by active geo-replication", fr: "Une base de données secondaire lisible créée par la géoréplication active" }
    - id: b
      text: { en: "`ApplicationIntent=ReadOnly` in the connection string of the reporting tool", fr: "`ApplicationIntent=ReadOnly` dans la chaîne de connexion de l'outil de reporting" }
    - id: c
      text: { en: "A larger number of vCores for the database", fr: "Un plus grand nombre de vCores pour la base de données" }
    - id: d
      text: { en: "An elastic pool in the Business Critical service tier", fr: "Un pool élastique au niveau de service Business Critical" }
answer: { optionId: b }
explanation:
  correct:
    en: A Business Critical database already has secondary replicas, and read scale-out is enabled by default. A connection that specifies `ApplicationIntent=ReadOnly` is routed to a read-only replica, at no extra cost. The replica is updated asynchronously, which the reports accept.
    fr: Une base de données Business Critical possède déjà des réplicas secondaires, et la lecture à l'échelle (read scale-out) est activée par défaut. Une connexion qui indique `ApplicationIntent=ReadOnly` est routée vers un réplica en lecture seule, sans surcoût. Le réplica est mis à jour de façon asynchrone, ce que les rapports acceptent.
  options:
    a:
      en: A geo-secondary would also serve the reports, but it is a second database that is billed in addition.
      fr: Une base secondaire géorépliquée servirait aussi les rapports, mais c'est une seconde base de données facturée en plus.
    c:
      en: More vCores cost more, and the reports would still compete with order entry on the primary replica.
      fr: Davantage de vCores coûtent plus cher, et les rapports resteraient en concurrence avec la saisie des commandes sur le réplica principal.
    d:
      en: A pool shares resources between several databases. It doesn't separate the read workload from the write workload of one database.
      fr: Un pool partage des ressources entre plusieurs bases de données. Il ne sépare pas la charge de lecture de la charge d'écriture d'une même base de données.
references:
  - title: Use read-only replicas to offload read-only query workloads
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/read-scale-out
