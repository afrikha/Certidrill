id: az305-2b-hierarchical-partition
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys is building a multitenant SaaS application on Azure Cosmos DB for NoSQL. All tenants will share one new container. Each item contains the properties `tenantId` and `userId`.

    You identify the following constraints:

    - The largest tenants will each store more than 100 GB of data, but a single user never stores more than 1 GB.
    - Every query filters on the tenant identifier, and most queries also filter on the user identifier.
    - A query for one tenant must be routed only to the partitions that hold the data of that tenant.

    You need to recommend a partitioning strategy for the container.

    What should you recommend?
  fr: |
    Wingtip Toys développe une application SaaS multilocataire sur Azure Cosmos DB for NoSQL. Tous les locataires partageront un nouveau conteneur. Chaque élément contient les propriétés `tenantId` et `userId`.

    Vous identifiez les contraintes suivantes :

    - Les plus gros locataires stockeront chacun plus de 100 Go de données, mais un utilisateur ne stocke jamais plus de 1 Go.
    - Chaque requête filtre sur l'identificateur du locataire, et la plupart des requêtes filtrent aussi sur l'identificateur de l'utilisateur.
    - Une requête portant sur un locataire doit être acheminée uniquement vers les partitions qui contiennent les données de ce locataire.

    Vous devez recommander une stratégie de partitionnement pour le conteneur.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Use /tenantId as the partition key and increase the provisioned throughput of the container", fr: "Utiliser /tenantId comme clé de partition et augmenter le débit approvisionné du conteneur" }
    - id: b
      text: { en: "Use a hierarchical partition key made of /tenantId, then /userId", fr: "Utiliser une clé de partition hiérarchique composée de /tenantId, puis de /userId" }
    - id: c
      text: { en: "Use /id as the partition key", fr: "Utiliser /id comme clé de partition" }
    - id: d
      text: { en: "Use a synthetic partition key that concatenates the tenant identifier and a random suffix", fr: "Utiliser une clé de partition synthétique qui concatène l'identificateur du locataire et un suffixe aléatoire" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A logical partition is limited to 20 GB. With a hierarchical partition key, the data that shares the first-level value (the tenant) can exceed 20 GB and span several physical partitions, while each tenant and user combination stays small. A query that specifies the tenant, a prefix of the key, is routed only to the subset of physical partitions that hold that tenant.
    fr: |
      Une partition logique est limitée à 20 Go. Avec une clé de partition hiérarchique, les données qui partagent la valeur de premier niveau (le locataire) peuvent dépasser 20 Go et s'étendre sur plusieurs partitions physiques, tandis que chaque combinaison locataire et utilisateur reste petite. Une requête qui précise le locataire, préfixe de la clé, est acheminée uniquement vers le sous-ensemble de partitions physiques qui contiennent ce locataire.
  options:
    a:
      en: More throughput does not lift the 20-GB limit of a logical partition, which a 100-GB tenant would exceed.
      fr: "Davantage de débit ne lève pas la limite de 20 Go d'une partition logique, qu'un locataire de 100 Go dépasserait."
    c:
      en: The item ID spreads the data evenly, but a query that filters on the tenant would fan out to all the physical partitions of the container.
      fr: "L'ID d'élément répartit uniformément les données, mais une requête filtrant sur le locataire serait diffusée à toutes les partitions physiques du conteneur."
    d:
      en: A random suffix spreads a tenant over many logical partitions, but a query for the tenant can no longer target them and becomes a cross-partition query.
      fr: "Un suffixe aléatoire répartit un locataire sur de nombreuses partitions logiques, mais une requête sur le locataire ne peut plus les cibler et devient une requête entre partitions."
references:
  - title: Hierarchical partition keys in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
  - title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
