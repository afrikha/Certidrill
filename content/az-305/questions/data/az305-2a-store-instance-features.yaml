id: az305-2a-store-instance-features
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs an ERP application on an on-premises SQL Server 2019 instance that hosts 14 databases. The application relies on SQL Server Agent jobs, on queries that join tables of several databases, and on linked servers to another SQL Server instance.

    Fabrikam plans to move the databases to Azure. You need to recommend a target that meets the following requirements:

    - Minimize changes to the application and to the database code.
    - Leave no operating system to patch.
    - Provide automated backups and built-in high availability.

    What should you recommend?
  fr: |
    Fabrikam exécute une application ERP sur une instance SQL Server 2019 locale qui héberge 14 bases de données. L'application s'appuie sur des travaux SQL Server Agent, sur des requêtes qui joignent des tables de plusieurs bases de données et sur des serveurs liés vers une autre instance SQL Server.

    Fabrikam prévoit de déplacer les bases de données vers Azure. Vous devez recommander une cible qui répond aux exigences suivantes :

    - Réduire au minimum les modifications de l'application et du code des bases de données.
    - Ne laisser aucun système d'exploitation à mettre à jour.
    - Fournir des sauvegardes automatiques et une haute disponibilité intégrée.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "An Azure SQL Database elastic pool", fr: "Un pool élastique Azure SQL Database" }
    - id: b
      text: { en: "Azure SQL Managed Instance", fr: "Azure SQL Managed Instance" }
    - id: c
      text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur machines virtuelles Azure" }
    - id: d
      text: { en: "Azure SQL Database Hyperscale single databases", fr: "Des bases de données uniques Azure SQL Database Hyperscale" }
answer: { optionId: b }
explanation:
  correct:
    en: SQL Managed Instance keeps the instance-scoped features of SQL Server. SQL Server Agent, cross-database queries inside the instance and linked servers to SQL Server all work, so the code moves with few changes. It is still a platform service, with patching, automated backups and high availability handled by Azure.
    fr: SQL Managed Instance conserve les fonctionnalités d'instance de SQL Server. SQL Server Agent, les requêtes entre bases de données de l'instance et les serveurs liés vers SQL Server fonctionnent, si bien que le code migre avec peu de modifications. Cela reste un service de plateforme, dont les mises à jour correctives, les sauvegardes automatiques et la haute disponibilité sont assurées par Azure.
  options:
    a:
      en: Databases in an elastic pool are still Azure SQL Database databases. They have no SQL Server Agent, no three-part-name queries and no linked servers, so the jobs and queries would have to be rewritten with elastic jobs and elastic query.
      fr: Les bases de données d'un pool élastique restent des bases Azure SQL Database. Elles n'ont ni SQL Server Agent, ni requêtes à nom en trois parties, ni serveurs liés. Il faudrait donc réécrire les travaux et les requêtes avec les travaux élastiques et la requête élastique.
    c:
      en: A virtual machine supports every feature but leaves Windows and SQL Server patching, backups and the high-availability design to Fabrikam.
      fr: Une machine virtuelle prend en charge toutes les fonctionnalités, mais laisse à Fabrikam les mises à jour de Windows et de SQL Server, les sauvegardes et la conception de la haute disponibilité.
    d:
      en: Hyperscale is a service tier of Azure SQL Database. It raises the size limit of a database but adds none of the instance-scoped features.
      fr: Hyperscale est un niveau de service d'Azure SQL Database. Il relève la limite de taille d'une base de données, mais n'ajoute aucune fonctionnalité d'instance.
references:
  - title: "Features comparison: Azure SQL Database and Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
