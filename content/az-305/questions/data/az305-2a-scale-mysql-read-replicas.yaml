id: az305-2a-scale-mysql-read-replicas
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs the catalog of an e-commerce site on Azure Database for MySQL flexible server, in the General Purpose compute tier. About 90 % of the queries only read data, and they saturate the processor of the server during sales.

    You need to recommend a solution that meets the following requirements:

    - Spread the read queries over several servers.
    - Keep the writes on one server.
    - Limit the application change to using a different connection string for the read queries.

    What should you recommend?
  fr: |
    Litware exécute le catalogue d'un site d'e-commerce dans Azure Database for MySQL (serveur flexible), au niveau de calcul General Purpose. Environ 90 % des requêtes ne font que lire des données, et elles saturent le processeur du serveur pendant les soldes.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Répartir les requêtes de lecture sur plusieurs serveurs.
    - Conserver les écritures sur un seul serveur.
    - Limiter la modification de l'application à l'utilisation d'une chaîne de connexion différente pour les requêtes de lecture.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Enable zone-redundant high availability and send the read queries to the standby server.", fr: "Activer la haute disponibilité redondante interzone et envoyer les requêtes de lecture au serveur de secours." }
    - id: b
      text: { en: "Change the server to the Burstable compute tier.", fr: "Passer le serveur au niveau de calcul Burstable." }
    - id: c
      text: { en: "Enable storage autogrow on the server.", fr: "Activer la croissance automatique du stockage sur le serveur." }
    - id: d
      text: { en: "Create read replicas of the server and send the read queries to them.", fr: "Créer des réplicas en lecture du serveur et leur envoyer les requêtes de lecture." }
answer: { optionId: d }
explanation:
  correct:
    en: Read replicas are read-only copies of a flexible server that are updated asynchronously from the source server. Each replica is a server with its own endpoint, so the application sends its read queries to the replicas and its writes to the source. A source server supports up to 10 replicas.
    fr: Les réplicas en lecture sont des copies en lecture seule d'un serveur flexible, mises à jour de façon asynchrone à partir du serveur source. Chaque réplica est un serveur doté de son propre point de terminaison, donc l'application envoie ses requêtes de lecture aux réplicas et ses écritures à la source. Un serveur source prend en charge jusqu'à 10 réplicas.
  options:
    a:
      en: The standby server of a high-availability configuration only takes over after a failover. It doesn't accept connections while it is a standby.
      fr: Le serveur de secours d'une configuration à haute disponibilité ne prend le relais qu'après un basculement. Il n'accepte pas de connexions tant qu'il est en attente.
    b:
      en: Burstable is the smallest compute tier, meant for workloads that rarely need the full processor. It would reduce capacity.
      fr: Burstable est le plus petit niveau de calcul, destiné aux charges de travail qui ont rarement besoin du processeur complet. Il réduirait la capacité.
    c:
      en: Storage autogrow adds disk space. The bottleneck here is the processor.
      fr: La croissance automatique du stockage ajoute de l'espace disque. Le goulet d'étranglement est ici le processeur.
references:
  - title: Read replicas in Azure Database for MySQL
    url: https://learn.microsoft.com/en-us/azure/mysql/flexible-server/concepts-read-replicas
  - title: High availability in Azure Database for MySQL
    url: https://learn.microsoft.com/en-us/azure/mysql/flexible-server/concepts-high-availability
