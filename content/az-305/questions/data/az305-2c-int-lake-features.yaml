id: az305-2c-int-lake-features
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to create a storage account that will be the landing zone of its Azure Data Factory pipelines. Azure Databricks jobs will transform the data in place.

    You need to recommend the configuration of the storage account. The solution must meet the following requirements:

    - The Databricks jobs must rename or delete a directory that contains millions of files as a single atomic operation.
    - Each department's directory must be secured with POSIX-style access control lists (ACLs).
    - Raw files that haven't been modified for 180 days must move to a cheaper access tier without any scheduled job to maintain.

    Which two features should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit de créer un compte de stockage qui servira de zone d'arrivée à ses pipelines Azure Data Factory. Des travaux Azure Databricks transformeront les données sur place.

    Vous devez recommander la configuration du compte de stockage. La solution doit répondre aux exigences suivantes :

    - Les travaux Databricks doivent renommer ou supprimer un répertoire contenant des millions de fichiers en une seule opération atomique.
    - Le répertoire de chaque service doit être protégé par des listes de contrôle d'accès (ACL) de type POSIX.
    - Les fichiers bruts non modifiés depuis 180 jours doivent passer à un niveau d'accès moins coûteux, sans travail planifié à maintenir.

    Quelles sont les deux fonctionnalités à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Blob index tags", fr: "Les balises d'index de blob" } }
    - { id: b, text: { en: "A hierarchical namespace", fr: "Un espace de noms hiérarchique" } }
    - { id: c, text: { en: "Object replication", fr: "La réplication d'objets" } }
    - { id: d, text: { en: "A lifecycle management policy", fr: "Une stratégie de gestion du cycle de vie" } }
    - { id: e, text: { en: "Stored access policies", fr: "Des stratégies d'accès stockées" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Enabling the hierarchical namespace turns the account into Azure Data Lake Storage: directories become real objects, so renaming or deleting one is a single atomic metadata operation, and directories and files accept POSIX-style ACLs. A lifecycle management policy then moves blobs to a cooler tier based on the time since their last modification; the platform runs the rule, with nothing to schedule.
    fr: |
      Activer l'espace de noms hiérarchique fait du compte un compte Azure Data Lake Storage : les répertoires deviennent de vrais objets, si bien qu'en renommer ou en supprimer un est une seule opération atomique sur les métadonnées, et les répertoires comme les fichiers acceptent des ACL de type POSIX. Une stratégie de gestion du cycle de vie déplace ensuite les blobs vers un niveau plus froid selon le temps écoulé depuis leur dernière modification ; la plateforme exécute la règle, sans rien à planifier.
  options:
    a:
      en: Blob index tags are key-value attributes used to find and filter blobs. They provide neither directories nor ACLs, and they don't move data between tiers.
      fr: Les balises d'index de blob sont des attributs clé-valeur qui servent à rechercher et à filtrer les blobs. Elles n'apportent ni répertoires ni ACL, et ne déplacent pas les données entre les niveaux.
    c:
      en: Object replication asynchronously copies block blobs to another storage account. It addresses none of the three requirements.
      fr: La réplication d'objets copie de façon asynchrone des objets blob de blocs vers un autre compte de stockage. Elle ne répond à aucune des trois exigences.
    e:
      en: A stored access policy groups the settings of shared access signatures on a container. It isn't a POSIX-style ACL on a directory.
      fr: Une stratégie d'accès stockée regroupe les paramètres de signatures d'accès partagé sur un conteneur. Ce n'est pas une ACL de type POSIX sur un répertoire.
references:
  - title: Introduction to Azure Data Lake Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction
  - title: Azure Blob Storage lifecycle management overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview
