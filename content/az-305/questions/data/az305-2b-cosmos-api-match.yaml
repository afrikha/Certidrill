id: az305-2b-cosmos-api-match
objective: "2.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware plans to move the data of three workloads to Azure Cosmos DB. Each workload must keep its current drivers, tools and query language to minimize code changes.

    Which Azure Cosmos DB API should you recommend for each workload? To answer, drag the appropriate APIs to the correct workloads. Each API may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de déplacer les données de trois charges de travail vers Azure Cosmos DB. Chaque charge de travail doit conserver ses pilotes, ses outils et son langage de requête actuels afin de réduire au minimum les modifications de code.

    Quelle API Azure Cosmos DB devez-vous recommander pour chaque charge de travail ? Pour répondre, faites glisser les API appropriées vers les charges de travail correspondantes. Chaque API peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: nosql, text: NoSQL }
    - { id: mongo, text: MongoDB }
    - { id: cass, text: Apache Cassandra }
    - { id: grem, text: Apache Gremlin }
    - { id: table, text: Table }
  targets:
    - id: w1
      text: { en: "An order service that uses MongoDB drivers and tools", fr: "Un service de commandes qui utilise les pilotes et les outils MongoDB" }
    - id: w2
      text: { en: "A sensor platform whose services query wide-column data with CQL", fr: "Une plateforme de capteurs dont les services interrogent des données en colonnes larges avec CQL" }
    - id: w3
      text: { en: "A fraud detection engine that traverses relationships between accounts, stored as vertices and edges, with Apache TinkerPop", fr: "Un moteur de détection des fraudes qui parcourt les relations entre comptes, stockées sous forme de sommets et d'arêtes, avec Apache TinkerPop" }
answer:
  mapping: { w1: mongo, w2: cass, w3: grem }
explanation:
  correct:
    en: |
      The API for MongoDB supports the MongoDB wire protocol, so existing MongoDB drivers, SDKs and tools keep working. The API for Apache Cassandra supports the Cassandra Query Language (CQL) and existing Cassandra drivers. The API for Apache Gremlin stores property graphs made of vertices and edges and is queried with the Gremlin language of Apache TinkerPop.
    fr: |
      L'API pour MongoDB prend en charge le protocole filaire MongoDB : les pilotes, les SDK et les outils MongoDB existants continuent de fonctionner. L'API pour Apache Cassandra prend en charge le langage CQL (Cassandra Query Language) et les pilotes Cassandra existants. L'API pour Apache Gremlin stocke des graphes de propriétés composés de sommets et d'arêtes et s'interroge avec le langage Gremlin d'Apache TinkerPop.
  options:
    nosql:
      en: The API for NoSQL uses its own SDKs and SQL-like queries; it suits new document applications, not workloads that must keep other drivers.
      fr: "L'API pour NoSQL utilise ses propres SDK et des requêtes de type SQL ; elle convient aux nouvelles applications de documents, pas aux charges de travail qui doivent conserver d'autres pilotes."
    table:
      en: The API for Table is meant for applications written for Azure Table Storage.
      fr: "L'API pour Table est destinée aux applications écrites pour Stockage Table Azure."
references:
  - title: What is Azure Cosmos DB for MongoDB?
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/mongodb/introduction
  - title: What is Azure Cosmos DB for Apache Gremlin?
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gremlin/introduction
