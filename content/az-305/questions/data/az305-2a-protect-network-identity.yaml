id: az305-2a-protect-network-identity
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs a web app in Azure App Service that is integrated with a virtual network named **VNet1**. The web app stores its data in Azure SQL Database.

    You need to recommend how the web app connects to the database. The solution must meet the following requirements:

    - No password or other secret may be stored or rotated for the database connection.
    - The logical server must be reachable only through a private IP address of VNet1. Its public endpoint must not be used.

    Which two components should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys exécute dans Azure App Service une application web intégrée à un réseau virtuel nommé **VNet1**. L'application web stocke ses données dans Azure SQL Database.

    Vous devez recommander la façon dont l'application web se connecte à la base de données. La solution doit répondre aux exigences suivantes :

    - Aucun mot de passe ni autre secret ne doit être stocké ou renouvelé pour la connexion à la base de données.
    - Le serveur logique ne doit être accessible que par une adresse IP privée de VNet1. Son point de terminaison public ne doit pas être utilisé.

    Quels sont les deux composants à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A virtual network service endpoint for Microsoft.Sql and a virtual network rule on the server", fr: "Un point de terminaison de service de réseau virtuel pour Microsoft.Sql et une règle de réseau virtuel sur le serveur" } }
    - { id: b, text: { en: "SQL authentication, with the password stored in Azure Key Vault", fr: "L'authentification SQL, avec le mot de passe stocké dans Azure Key Vault" } }
    - { id: c, text: { en: "A managed identity for the web app, mapped to a database user with Microsoft Entra authentication", fr: "Une identité managée pour l'application web, mappée à un utilisateur de base de données avec l'authentification Microsoft Entra" } }
    - { id: d, text: { en: "A server-level IP firewall rule for the outbound addresses of the web app", fr: "Une règle de pare-feu IP au niveau du serveur pour les adresses sortantes de l'application web" } }
    - { id: e, text: { en: "A private endpoint for the server in VNet1, with public network access disabled", fr: "Un point de terminaison privé pour le serveur dans VNet1, avec l'accès au réseau public désactivé" } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: A managed identity lets the web app obtain Microsoft Entra tokens for Azure SQL Database, so the connection uses no password at all. A private endpoint gives the logical server a private IP address in VNet1, and disabling public network access closes the public endpoint.
    fr: Une identité managée permet à l'application web d'obtenir des jetons Microsoft Entra pour Azure SQL Database, si bien que la connexion n'utilise aucun mot de passe. Un point de terminaison privé donne au serveur logique une adresse IP privée dans VNet1, et la désactivation de l'accès au réseau public ferme le point de terminaison public.
  options:
    a: { en: "A service endpoint restricts which subnets may reach the server, but the traffic still targets the public endpoint of the server.", fr: "Un point de terminaison de service restreint les sous-réseaux autorisés à joindre le serveur, mais le trafic vise toujours le point de terminaison public du serveur." }
    b: { en: "Key Vault protects the password, but a password still exists and has to be rotated.", fr: "Key Vault protège le mot de passe, mais un mot de passe existe toujours et doit être renouvelé." }
    d: { en: "An IP firewall rule filters access to the public endpoint. It doesn't make the server private.", fr: "Une règle de pare-feu IP filtre l'accès au point de terminaison public. Elle ne rend pas le serveur privé." }
references:
  - title: Azure Private Link for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/private-endpoint-overview
  - title: Microsoft Entra authentication for Azure SQL
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/authentication-aad-overview
