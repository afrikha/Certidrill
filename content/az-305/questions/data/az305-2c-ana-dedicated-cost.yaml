id: az305-2c-ana-dedicated-cost
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Synapse Analytics dedicated SQL pool that hosts its data warehouse. The pool runs at DW2000c at all times. The usage is as follows:

    - From 07:00 to 19:00 on weekdays, reports use the full capacity of the pool.
    - From 19:00 to 23:00 on weekdays, a few analysts run light queries that need a fraction of the capacity.
    - At night and on weekends, the pool isn't used.

    You need to recommend how to reduce the compute cost of the pool. The data must stay in the pool, and the reports must keep their current performance.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un pool SQL dédié Azure Synapse Analytics qui héberge son entrepôt de données. Le pool fonctionne en permanence au niveau DW2000c. L'utilisation est la suivante :

    - De 07:00 à 19:00 en semaine, les rapports utilisent toute la capacité du pool.
    - De 19:00 à 23:00 en semaine, quelques analystes exécutent des requêtes légères qui n'ont besoin que d'une fraction de la capacité.
    - La nuit et le week-end, le pool n'est pas utilisé.

    Vous devez recommander la façon de réduire le coût de calcul du pool. Les données doivent rester dans le pool, et les rapports doivent conserver leurs performances actuelles.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Pause the pool at night and on weekends.", fr: "Mettre le pool en pause la nuit et le week-end." } }
    - { id: b, text: { en: "Enable result set caching on the pool.", fr: "Activer la mise en cache du jeu de résultats sur le pool." } }
    - { id: c, text: { en: "Scale the pool down to fewer data warehouse units in the evening.", fr: "Réduire en soirée le nombre de Data Warehouse Units du pool." } }
    - { id: d, text: { en: "Create a user-defined restore point every evening.", fr: "Créer chaque soir un point de restauration défini par l'utilisateur." } }
    - { id: e, text: { en: "Change the tables of the pool to round-robin distribution.", fr: "Passer les tables du pool en distribution par tourniquet (round-robin)." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A dedicated SQL pool separates compute from storage. Pausing it releases the compute, so only storage is billed while the data stays in place, which fits the nights and weekends. Scaling down the data warehouse units in the evening lowers the hourly compute charge when light queries need less capacity, and scaling back up in the morning restores the performance of the reports.
    fr: |
      Un pool SQL dédié sépare le calcul du stockage. Le mettre en pause libère le calcul : seul le stockage est facturé et les données restent en place, ce qui convient aux nuits et aux week-ends. Réduire les Data Warehouse Units en soirée diminue le coût horaire du calcul lorsque des requêtes légères demandent moins de capacité, et les augmenter de nouveau le matin rétablit les performances des rapports.
  options:
    b:
      en: Result set caching speeds up repeated queries. The pool is billed for its provisioned data warehouse units whatever the cache does.
      fr: La mise en cache du jeu de résultats accélère les requêtes répétées. Le pool est facturé pour ses Data Warehouse Units provisionnées, quoi que fasse le cache.
    d:
      en: A restore point protects the data; it has no effect on the compute that is billed.
      fr: Un point de restauration protège les données ; il n'a aucun effet sur le calcul facturé.
    e:
      en: The distribution of the tables affects query performance, not the compute charge, and round-robin tables would slow down the joins of the reports.
      fr: La distribution des tables influe sur les performances des requêtes, pas sur le coût du calcul, et des tables en tourniquet ralentiraient les jointures des rapports.
references:
  - title: Manage compute resources for dedicated SQL pool
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql-data-warehouse/sql-data-warehouse-manage-compute-overview
