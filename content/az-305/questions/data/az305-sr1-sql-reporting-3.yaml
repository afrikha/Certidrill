id: az305-sr1-sql-reporting-3
objective: "2.1.2"
type: series_yesno
series: az305-sr1-sql-reporting
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You recommend the Hyperscale service tier with one high-availability replica and zone redundancy.
  fr: Vous recommandez le niveau de service Hyperscale avec un réplica de haute disponibilité et la redondance de zone.
body:
  solution:
    en: |
      You recommend creating DB1 in the **Hyperscale** service tier with **one high-availability secondary replica**, **zone redundancy** enabled and zone-redundant backup storage. The reporting application connects with `ApplicationIntent=ReadOnly`.
    fr: |
      Vous recommandez de créer DB1 dans le niveau de service **Hyperscale** avec **un réplica secondaire de haute disponibilité**, la **redondance de zone** activée et un stockage de sauvegarde redondant interzone. L'application de création de rapports se connecte avec `ApplicationIntent=ReadOnly`.
answer: { value: true }
explanation:
  correct:
    en: |
      In Hyperscale, read scale-out is available as soon as the database has at least one secondary replica: connections with `ApplicationIntent=ReadOnly` are redirected to the high-availability replica instead of the primary. Zone redundancy, chosen when the database is created, needs exactly what the solution includes: at least one high-availability replica and zone-redundant (or geo-zone-redundant) backup storage. The Hyperscale size limit is far above 2 TB.
    fr: |
      En Hyperscale, la lecture à l'échelle (read scale-out) est disponible dès que la base de données possède au moins un réplica secondaire : les connexions avec `ApplicationIntent=ReadOnly` sont redirigées vers le réplica de haute disponibilité au lieu du réplica principal. La redondance de zone, choisie à la création de la base de données, demande exactement ce que la solution prévoit : au moins un réplica de haute disponibilité et un stockage de sauvegarde redondant interzone (ou géoredondant interzone). La limite de taille d'Hyperscale est très supérieure à 2 To.
references:
  - title: Use read-only replicas to offload read-only query workloads
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/read-scale-out
  - title: Availability through redundancy - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla-local-zone-redundancy
