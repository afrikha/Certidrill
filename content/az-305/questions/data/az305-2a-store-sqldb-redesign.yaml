id: az305-2a-store-sqldb-redesign
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys plans to migrate the database of an inventory application from SQL Server to a single database in Azure SQL Database, in the General Purpose service tier.

    A compatibility assessment lists the SQL Server features that the database uses.

    Which two features must be replaced or redesigned before the migration? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit de migrer la base de données d'une application de gestion des stocks de SQL Server vers une base de données unique Azure SQL Database, au niveau de service General Purpose.

    Une évaluation de compatibilité dresse la liste des fonctionnalités SQL Server utilisées par la base de données.

    Quelles sont les deux fonctionnalités à remplacer ou à reconcevoir avant la migration ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Temporal tables", fr: "Tables temporelles" } }
    - { id: b, text: { en: "Database Mail", fr: "Database Mail" } }
    - { id: c, text: { en: "Columnstore indexes", fr: "Index columnstore" } }
    - { id: d, text: { en: "Full-text search", fr: "Recherche en texte intégral" } }
    - { id: e, text: { en: "CLR stored procedures", fr: "Procédures stockées CLR" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: Database Mail and the common language runtime (CLR) are instance-scoped features that Azure SQL Database doesn't offer. The e-mail notifications and the CLR procedures have to be moved to the application or to another service, or the database must target Azure SQL Managed Instance, which supports both.
    fr: Database Mail et le Common Language Runtime (CLR) sont des fonctionnalités d'instance qu'Azure SQL Database ne propose pas. Les notifications par e-mail et les procédures CLR doivent être déplacées vers l'application ou vers un autre service, ou bien la base de données doit cibler Azure SQL Managed Instance, qui prend en charge les deux.
  options:
    a: { en: "Temporal tables are a database-scoped feature that Azure SQL Database supports.", fr: "Les tables temporelles sont une fonctionnalité de niveau base de données qu'Azure SQL Database prend en charge." }
    c: { en: "Columnstore indexes are supported in the General Purpose service tier.", fr: "Les index columnstore sont pris en charge au niveau de service General Purpose." }
    d: { en: "Full-text search is supported in Azure SQL Database, except for non-Microsoft filters and word breakers.", fr: "La recherche en texte intégral est prise en charge dans Azure SQL Database, à l'exception des filtres et des analyseurs lexicaux non-Microsoft." }
references:
  - title: "Features comparison: Azure SQL Database and Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
