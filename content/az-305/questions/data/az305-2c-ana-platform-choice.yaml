id: az305-2c-ana-platform-choice
objective: "2.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are designing the analytics platforms of two companies.

    - **Fabrikam** has a small analytics team. It wants a single software as a service (SaaS) platform that covers ingestion, transformation, data warehousing and Power BI reports, in which all workloads share one data lake and no infrastructure is provisioned.
    - **Litware** has data engineers and data scientists who work in Python and Scala notebooks on Apache Spark. They need a lakehouse built on Delta Lake, MLflow to track machine learning experiments, and Unity Catalog to govern data.

    Which platform should you recommend for each company? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez les plateformes d'analytique de deux entreprises.

    - **Fabrikam** a une petite équipe d'analytique. Elle veut une seule plateforme software as a service (SaaS) qui couvre l'ingestion, la transformation, l'entrepôt de données et les rapports Power BI, dans laquelle toutes les charges de travail partagent un même lac de données et aucune infrastructure n'est provisionnée.
    - **Litware** a des ingénieurs de données et des scientifiques des données qui travaillent dans des notebooks Python et Scala sur Apache Spark. Ils ont besoin d'un lakehouse fondé sur Delta Lake, de MLflow pour suivre les expériences de machine learning et de Unity Catalog pour gouverner les données.

    Quelle plateforme devez-vous recommander pour chaque entreprise ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Fabrikam: [[fabrikam]]

      Litware: [[litware]]
    fr: |
      Fabrikam : [[fabrikam]]

      Litware : [[litware]]
  slots:
    - id: fabrikam
      options:
        - { id: adx, text: Azure Data Explorer }
        - { id: databricks, text: Azure Databricks }
        - { id: asa, text: Azure Stream Analytics }
        - { id: fabric, text: Microsoft Fabric }
    - id: litware
      options:
        - { id: adx, text: Azure Data Explorer }
        - { id: databricks, text: Azure Databricks }
        - { id: asa, text: Azure Stream Analytics }
        - { id: fabric, text: Microsoft Fabric }
answer:
  values: { fabrikam: fabric, litware: databricks }
explanation:
  correct:
    en: |
      Microsoft Fabric is a SaaS analytics platform whose workloads, from Data Factory to Data Warehouse and Power BI, all store their data in OneLake, with no infrastructure to deploy. Azure Databricks is the Apache Spark-based platform for data engineering and machine learning: its lakehouse relies on Delta Lake, and it includes MLflow and Unity Catalog. Azure Data Explorer targets interactive KQL analytics on logs and telemetry, and Stream Analytics only processes streams.
    fr: |
      Microsoft Fabric est une plateforme d'analytique SaaS dont les charges de travail, de Data Factory à Data Warehouse et Power BI, stockent toutes leurs données dans OneLake, sans infrastructure à déployer. Azure Databricks est la plateforme fondée sur Apache Spark pour l'ingénierie des données et le machine learning : son lakehouse repose sur Delta Lake, et elle comprend MLflow et Unity Catalog. Azure Data Explorer vise l'analytique interactive en KQL sur les journaux et la télémétrie, et Stream Analytics ne fait que traiter des flux.
references:
  - title: What is Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/fundamentals/microsoft-fabric-overview
  - title: What is Azure Databricks?
    url: https://learn.microsoft.com/en-us/azure/databricks/introduction/
