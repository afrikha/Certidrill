id: az305-2b-consistency-facts
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing the design of an Azure Cosmos DB for NoSQL account. The account has a single write region, is replicated to two other regions, and uses Strong as its default consistency level.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la conception d'un compte Azure Cosmos DB for NoSQL. Le compte possède une seule région d'écriture, est répliqué dans deux autres régions et utilise Strong comme niveau de cohérence par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Changing the default consistency level to Eventual reduces the request units consumed by each read.
        fr: Remplacer le niveau de cohérence par défaut par Eventual réduit les unités de requête consommées par chaque lecture.
    - id: s2
      text:
        en: An application can issue a read that uses Session consistency without changing the default level of the account.
        fr: Une application peut émettre une lecture qui utilise la cohérence Session sans modifier le niveau par défaut du compte.
    - id: s3
      text:
        en: Each container of the account can be assigned its own default consistency level.
        fr: Chaque conteneur du compte peut recevoir son propre niveau de cohérence par défaut.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Strong and Bounded staleness reads are served by two replicas and cost twice the request units of Session, Consistent prefix and Eventual reads, which use a single replica. A request can override the account default with a weaker level, for example Session on an account that defaults to Strong. The default level is configured on the account and applies to all its databases and containers; it cannot be set per container.
    fr: |
      Les lectures Strong et Bounded staleness sont servies par deux réplicas et coûtent deux fois plus d'unités de requête que les lectures Session, Consistent prefix et Eventual, qui utilisent un seul réplica. Une requête peut remplacer le niveau par défaut du compte par un niveau plus faible, par exemple Session sur un compte dont le niveau par défaut est Strong. Le niveau par défaut se configure sur le compte et s'applique à toutes ses bases de données et à tous ses conteneurs ; il ne se définit pas par conteneur.
references:
  - title: Consistency levels in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
