id: az305-2c-ana-serverless-statements
objective: "2.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum stores sales data as Parquet files in an Azure Data Lake Storage account. Adatum has an Azure Synapse Analytics workspace that contains only the built-in serverless SQL pool. Analysts plan to use this pool for all their queries.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum stocke des données de ventes sous forme de fichiers Parquet dans un compte Azure Data Lake Storage. Adatum dispose d'un espace de travail Azure Synapse Analytics qui ne contient que le pool SQL serverless intégré. Les analystes prévoient d'utiliser ce pool pour toutes leurs requêtes.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Adatum is charged for the compute of the serverless SQL pool on days when no query runs.
        fr: Le calcul du pool SQL serverless est facturé à Adatum les jours où aucune requête ne s'exécute.
    - id: s2
      text:
        en: Analysts can create views over the Parquet files and use them from Power BI as a logical data warehouse.
        fr: Les analystes peuvent créer des vues sur les fichiers Parquet et les utiliser depuis Power BI comme un entrepôt de données logique.
    - id: s3
      text:
        en: Analysts can load the Parquet files into tables that are stored inside the serverless SQL pool.
        fr: Les analystes peuvent charger les fichiers Parquet dans des tables stockées à l'intérieur du pool SQL serverless.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A serverless SQL pool has no reserved resources: the charge depends on the data processed by the queries that run, so idle days cost nothing for compute. It lets you build a logical data warehouse, a relational layer of views and external tables over the files, that tools such as Power BI query through the T-SQL endpoint. It has no local storage, however: only metadata objects are kept in its databases, and the data stays in the lake.
    fr: |
      Un pool SQL serverless n'a pas de ressources réservées : la facturation dépend des données traitées par les requêtes exécutées, et les jours d'inactivité ne coûtent donc rien en calcul. Il permet de créer un entrepôt de données logique, c'est-à-dire une couche relationnelle de vues et de tables externes au-dessus des fichiers, que des outils comme Power BI interrogent par le point de terminaison T-SQL. Il n'a en revanche pas de stockage local : seuls des objets de métadonnées sont conservés dans ses bases de données, et les données restent dans le lac.
references:
  - title: Serverless SQL pool in Azure Synapse Analytics
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql/on-demand-workspace-overview
