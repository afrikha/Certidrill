id: az305-cs3c-loyalty-restore
objective: "2.2.4"
type: yesno_statements
caseStudy: az305-cs3c-alpineski
difficulty: 3
status: draft
stem:
  en: |
    You are evaluating solutions for the data requirement of the loyalty database.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous évaluez des solutions pour l'exigence relative aux données de la base de données de fidélité.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Keeping the periodic backup mode and raising the backup retention to 30 days meets the requirement."
        fr: "Conserver le mode de sauvegarde périodique et porter la rétention des sauvegardes à 30 jours satisfait l'exigence."
    - id: s2
      text:
        en: "Changing the account to the continuous backup mode with the 30-day tier meets the requirement."
        fr: "Passer le compte au mode de sauvegarde continue avec le niveau de 30 jours satisfait l'exigence."
    - id: s3
      text:
        en: "The read region in North Europe allows the platform team to recover the profiles that a faulty release has deleted."
        fr: "La région de lecture North Europe permet à l'équipe de la plateforme de récupérer les profils qu'une version défectueuse a supprimés."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "In the periodic mode, Azure Cosmos DB takes full backups at a fixed interval, and a restore is carried out by Microsoft after a support request, whatever the retention. The continuous mode offers point-in-time restore that the team starts itself from the portal, the Azure CLI or Azure PowerShell, to any moment of the retention window of its tier (7, 30 or 35 days). Replication to a second region copies every write, including deletions, so it protects against an outage, not against a faulty release."
    fr: "En mode périodique, Azure Cosmos DB prend des sauvegardes complètes à intervalle fixe, et une restauration est effectuée par Microsoft après une demande de support, quelle que soit la rétention. Le mode continu offre une restauration à un instant dans le passé que l'équipe lance elle-même depuis le portail, Azure CLI ou Azure PowerShell, à n'importe quel moment de la fenêtre de rétention de son niveau (7, 30 ou 35 jours). La réplication vers une seconde région recopie chaque écriture, suppressions comprises : elle protège donc contre une panne, pas contre une version défectueuse."
  options:
    s1:
      en: "No: a longer retention keeps more full backups, but the restore still goes through a support request and only to the time of one of those backups."
      fr: "Non : une rétention plus longue conserve davantage de sauvegardes complètes, mais la restauration passe toujours par une demande de support et uniquement à la date de l'une de ces sauvegardes."
    s3:
      en: "No: the deletions are replicated to North Europe within moments, so the read region holds the same data as the write region."
      fr: "Non : les suppressions sont répliquées vers North Europe en quelques instants, de sorte que la région de lecture contient les mêmes données que la région d'écriture."
references:
  - title: Continuous backup with point-in-time restore in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/continuous-backup-restore-introduction
  - title: Periodic backup and restore in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/periodic-backup-restore-introduction
