id: az305-2a-tier-postgres-burstable
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys plans to deploy Azure Database for PostgreSQL flexible server for the development environment of an internal tool. A few developers connect during the day. The processor is idle most of the time and is used at full capacity only for short periods.

    You need to recommend a compute tier. The solution must minimize cost.

    What should you recommend?
  fr: |
    Tailspin Toys prévoit de déployer Azure Database for PostgreSQL (serveur flexible) pour l'environnement de développement d'un outil interne. Quelques développeurs se connectent pendant la journée. Le processeur est inactif la plupart du temps et n'est utilisé à pleine capacité que pendant de courtes périodes.

    Vous devez recommander un niveau de calcul. La solution doit réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: Memory Optimized
    - id: b
      text: Burstable
    - id: c
      text: General Purpose
answer: { optionId: b }
explanation:
  correct:
    en: The Burstable compute tier is intended for workloads that don't need the full processor continuously, such as development servers and low-concurrency applications. It is the tier that Microsoft positions for low-cost development.
    fr: Le niveau de calcul Burstable est destiné aux charges de travail qui n'ont pas besoin du processeur complet en continu, comme les serveurs de développement et les applications à faible concurrence. C'est le niveau que Microsoft destine au développement à faible coût.
  options:
    a:
      en: Memory Optimized targets high-performance production workloads that need in-memory performance and high concurrency. A development server that is mostly idle would pay for capacity it doesn't use.
      fr: Memory Optimized vise les charges de travail de production à hautes performances qui exigent des performances en mémoire et une forte concurrence. Un serveur de développement le plus souvent inactif paierait une capacité qu'il n'utilise pas.
    c:
      en: General Purpose provides full, predictable processor capacity for production workloads, which a development server that is mostly idle doesn't need.
      fr: General Purpose fournit une capacité de processeur complète et prévisible pour les charges de travail de production, ce dont un serveur de développement le plus souvent inactif n'a pas besoin.
references:
  - title: Compute options in Azure Database for PostgreSQL flexible server
    url: https://learn.microsoft.com/en-us/azure/postgresql/flexible-server/concepts-compute
