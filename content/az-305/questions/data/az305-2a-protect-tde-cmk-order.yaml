id: az305-2a-protect-tde-cmk-order
objective: "2.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware has a logical server in Azure SQL Database named **sql-litware**. The server has a system-assigned managed identity, and its databases use transparent data encryption (TDE) with a service-managed key.

    The security team requires TDE to be protected by a key that Litware manages. No key vault exists yet.

    Which three actions should you include in the deployment plan, in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware possède un serveur logique Azure SQL Database nommé **sql-litware**. Le serveur dispose d'une identité managée affectée par le système, et ses bases de données utilisent Transparent Data Encryption (TDE) avec une clé gérée par le service.

    L'équipe de sécurité exige que TDE soit protégé par une clé gérée par Litware. Aucun coffre de clés n'existe encore.

    Quelles sont les trois actions à inclure dans le plan de déploiement, dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: grant, text: { en: "Grant the managed identity of sql-litware the get, wrapKey and unwrapKey permissions on the key vault.", fr: "Accorder à l'identité managée de sql-litware les autorisations get, wrapKey et unwrapKey sur le coffre de clés." } }
    - { id: cmk, text: { en: "Create a column master key in the key vault and a column encryption key in each database.", fr: "Créer une clé principale de colonne dans le coffre de clés et une clé de chiffrement de colonne dans chaque base de données." } }
    - { id: vault, text: { en: "Create a key vault with soft delete and purge protection, and create an RSA key in it.", fr: "Créer un coffre de clés avec la suppression réversible et la protection contre la suppression définitive, puis y créer une clé RSA." } }
    - { id: off, text: { en: "Turn off transparent data encryption on each database.", fr: "Désactiver Transparent Data Encryption sur chaque base de données." } }
    - { id: protector, text: { en: "Set the key of the key vault as the TDE protector of sql-litware.", fr: "Définir la clé du coffre de clés comme protecteur TDE de sql-litware." } }
    - { id: reader, text: { en: "Assign the Key Vault Reader role on the key vault to the database administrators.", fr: "Attribuer le rôle Key Vault Reader sur le coffre de clés aux administrateurs de base de données." } }
answer:
  sequence: [ vault, grant, protector ]
explanation:
  correct:
    en: |
      The key must exist first, in a key vault that has soft delete and purge protection so that the key can't be lost permanently. The server then needs access to the key through its managed identity, with the get, wrapKey and unwrapKey permissions. Only then can the key be selected as the TDE protector of the server, which re-encrypts the database encryption keys with it. The databases stay online and encrypted throughout.
    fr: |
      La clé doit d'abord exister, dans un coffre de clés doté de la suppression réversible et de la protection contre la suppression définitive, afin qu'elle ne puisse pas être perdue définitivement. Le serveur a ensuite besoin d'accéder à la clé par son identité managée, avec les autorisations get, wrapKey et unwrapKey. C'est seulement alors que la clé peut être choisie comme protecteur TDE du serveur, ce qui rechiffre les clés de chiffrement des bases de données avec elle. Les bases de données restent en ligne et chiffrées pendant toute l'opération.
  options:
    cmk: { en: "Column master keys and column encryption keys belong to Always Encrypted, not to TDE.", fr: "Les clés principales de colonne et les clés de chiffrement de colonne relèvent d'Always Encrypted, pas de TDE." }
    off: { en: "Changing the TDE protector doesn't require turning encryption off, which would leave the data unencrypted.", fr: "Changer de protecteur TDE n'impose pas de désactiver le chiffrement, ce qui laisserait les données non chiffrées." }
    reader: { en: "It is the server's identity that needs access to the key, not the database administrators.", fr: "C'est l'identité du serveur qui a besoin d'accéder à la clé, pas les administrateurs de base de données." }
references:
  - title: Azure SQL Transparent Data Encryption with customer-managed key
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview
