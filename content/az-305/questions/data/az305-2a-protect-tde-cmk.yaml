id: az305-2a-protect-tde-cmk
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam hosts regulated data in several databases in Azure SQL Database. A compliance audit sets the following requirements:

    - The data files, the log files and the backups must be encrypted at rest.
    - The encryption must be protected by a key that Fabrikam creates and stores itself.
    - The security team must be able to rotate the key and to make the databases inaccessible by revoking it.
    - The applications must not be modified.

    What should you recommend?
  fr: |
    Fabrikam héberge des données réglementées dans plusieurs bases de données Azure SQL Database. Un audit de conformité fixe les exigences suivantes :

    - Les fichiers de données, les fichiers journaux et les sauvegardes doivent être chiffrés au repos.
    - Le chiffrement doit être protégé par une clé que Fabrikam crée et stocke lui-même.
    - L'équipe de sécurité doit pouvoir effectuer la rotation de la clé et rendre les bases de données inaccessibles en la révoquant.
    - Les applications ne doivent pas être modifiées.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Transparent data encryption with a service-managed key", fr: "Transparent Data Encryption avec une clé gérée par le service" }
    - id: b
      text: { en: "Always Encrypted with the column master key in Azure Key Vault", fr: "Always Encrypted avec la clé principale de colonne dans Azure Key Vault" }
    - id: c
      text: { en: "Transparent data encryption with a customer-managed key in Azure Key Vault", fr: "Transparent Data Encryption avec une clé gérée par le client dans Azure Key Vault" }
    - id: d
      text: { en: "Dynamic data masking with the masking rules defined by the security team", fr: "Le masquage dynamique des données avec des règles de masquage définies par l'équipe de sécurité" }
answer: { optionId: c }
explanation:
  correct:
    en: Transparent data encryption (TDE) encrypts the data files, the log files and the backups without any change to the applications. With a customer-managed key, the TDE protector is a key stored in Azure Key Vault that Fabrikam controls. The security team rotates it and, by revoking the server's access to it, makes the databases inaccessible.
    fr: Transparent Data Encryption (TDE) chiffre les fichiers de données, les fichiers journaux et les sauvegardes sans aucune modification des applications. Avec une clé gérée par le client, le protecteur TDE est une clé stockée dans Azure Key Vault et contrôlée par Fabrikam. L'équipe de sécurité en effectue la rotation et, en révoquant l'accès du serveur à cette clé, rend les bases de données inaccessibles.
  options:
    a:
      en: With a service-managed key, Microsoft creates, stores and rotates the key. Fabrikam can't revoke it.
      fr: Avec une clé gérée par le service, c'est Microsoft qui crée, stocke et fait tourner la clé. Fabrikam ne peut pas la révoquer.
    b:
      en: Always Encrypted protects selected columns, not the whole files and backups, and the applications must use a driver that is configured for it.
      fr: Always Encrypted protège des colonnes choisies, pas l'ensemble des fichiers et des sauvegardes, et les applications doivent utiliser un pilote configuré pour cela.
    d:
      en: Dynamic data masking isn't encryption. It only hides values in query results.
      fr: Le masquage dynamique des données n'est pas un chiffrement. Il ne fait que masquer des valeurs dans les résultats des requêtes.
references:
  - title: Azure SQL Transparent Data Encryption with customer-managed key
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-byok-overview
