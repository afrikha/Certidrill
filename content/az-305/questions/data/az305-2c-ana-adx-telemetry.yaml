id: az305-2c-ana-adx-telemetry
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware operates an online game that generates 5 TB of application logs and player telemetry every day.

    You need to recommend an analytics solution for the operations engineers. The solution must meet the following requirements:

    - The engineers must explore billions of records interactively, with queries that return in seconds.
    - New records must be available for queries shortly after they are generated.
    - The engineers must write the queries in Kusto Query Language (KQL).

    What should you recommend?
  fr: |
    Litware exploite un jeu en ligne qui génère chaque jour 5 To de journaux d'application et de télémétrie des joueurs.

    Vous devez recommander une solution d'analytique pour les ingénieurs d'exploitation. La solution doit répondre aux exigences suivantes :

    - Les ingénieurs doivent explorer des milliards d'enregistrements de manière interactive, avec des requêtes qui répondent en quelques secondes.
    - Les nouveaux enregistrements doivent pouvoir être interrogés peu après leur génération.
    - Les ingénieurs doivent écrire les requêtes en langage de requête Kusto (KQL).

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: Azure Data Explorer }
    - { id: b, text: Azure Stream Analytics }
    - { id: c, text: { en: "An Azure Synapse Analytics dedicated SQL pool", fr: "Un pool SQL dédié Azure Synapse Analytics" } }
    - { id: d, text: Azure Data Factory }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Data Explorer is the managed platform for interactive analytics on large volumes of logs, telemetry and time series. It ingests data continuously, makes it available in near real time, and is queried with KQL, with results returned within seconds on very large volumes.
    fr: |
      Azure Data Explorer est la plateforme managée d'analytique interactive sur de gros volumes de journaux, de télémétrie et de séries chronologiques. Il ingère les données en continu, les rend disponibles en quasi-temps réel et s'interroge en KQL, avec des résultats renvoyés en quelques secondes sur de très gros volumes.
  options:
    b:
      en: Stream Analytics runs continuous queries, written in a SQL-based language, on events in motion. It isn't a store that engineers explore with ad hoc KQL queries.
      fr: Stream Analytics exécute des requêtes continues, écrites dans un langage fondé sur SQL, sur des événements en mouvement. Ce n'est pas un magasin que les ingénieurs explorent avec des requêtes KQL ad hoc.
    c:
      en: A dedicated SQL pool is a data warehouse queried with T-SQL, designed for modeled data loaded in batches rather than for exploring raw logs.
      fr: Un pool SQL dédié est un entrepôt de données interrogé en T-SQL, conçu pour des données modélisées chargées par lots plutôt que pour l'exploration de journaux bruts.
    d:
      en: Data Factory orchestrates data movement and transformation. It doesn't store the logs and has no query engine.
      fr: Data Factory orchestre le déplacement et la transformation de données. Il ne stocke pas les journaux et n'a pas de moteur de requête.
references:
  - title: What is Azure Data Explorer?
    url: https://learn.microsoft.com/en-us/azure/data-explorer/data-explorer-overview
