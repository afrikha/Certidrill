id: az305-2b-redundancy-facts
objective: "2.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is comparing the redundancy options of standard general-purpose v2 storage accounts that store block blobs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders compare les options de redondance de comptes de stockage standard usage général v2 qui stockent des objets blob de blocs.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: With GRS, an application can read the blobs from the secondary region while the primary region is available.
        fr: Avec GRS, une application peut lire les objets blob depuis la région secondaire pendant que la région primaire est disponible.
    - id: s2
      text:
        en: With ZRS, the storage account continues to accept write requests when one availability zone is unavailable.
        fr: Avec ZRS, le compte de stockage continue d'accepter les demandes d'écriture lorsqu'une zone de disponibilité est indisponible.
    - id: s3
      text:
        en: After a customer-managed unplanned failover of a GRS account, the account uses LRS in the new primary region.
        fr: Après un basculement non planifié géré par le client d'un compte GRS, le compte utilise LRS dans la nouvelle région primaire.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      With GRS and GZRS, the secondary copy cannot be read unless a failover occurs; reading it at any time requires RA-GRS or RA-GZRS. ZRS writes synchronously to the availability zones of the region and keeps accepting writes in the zones that remain available. After an unplanned failover, the new primary region is locally redundant and geo-redundancy is lost until it is enabled again.
    fr: |
      Avec GRS et GZRS, la copie secondaire ne peut être lue qu'après un basculement ; la lire à tout moment exige RA-GRS ou RA-GZRS. ZRS écrit de façon synchrone dans les zones de disponibilité de la région et continue d'accepter les écritures dans les zones restées disponibles. Après un basculement non planifié, la nouvelle région primaire est localement redondante, et la géoredondance est perdue jusqu'à sa réactivation.
references:
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
  - title: Azure storage disaster recovery planning and failover
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-disaster-recovery-guidance
