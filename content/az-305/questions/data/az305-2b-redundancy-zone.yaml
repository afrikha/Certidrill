id: az305-2b-redundancy-zone
objective: "2.2.4"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Litware stores medical images in Azure Blob Storage in the France Central region. Regulations require that the data never leaves that region.

    You need to recommend a redundancy option for the storage account. The solution must meet the following requirements:

    - The data must remain available for reads and writes if one datacenter of the region fails.
    - Costs must be minimized.

    Which redundancy option should you recommend?
  fr: |
    Litware stocke des images médicales dans Stockage Blob Azure, dans la région France Central. La réglementation exige que les données ne quittent jamais cette région.

    Vous devez recommander une option de redondance pour le compte de stockage. La solution doit répondre aux exigences suivantes :

    - Les données doivent rester disponibles en lecture et en écriture si un centre de données de la région tombe en panne.
    - Les coûts doivent être réduits au minimum.

    Quelle option de redondance devez-vous recommander ?
body:
  options:
    - { id: a, text: LRS }
    - { id: b, text: ZRS }
    - { id: c, text: GRS }
    - { id: d, text: GZRS }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Zone-redundant storage copies the data synchronously across three or more availability zones of the primary region. If a zone becomes unavailable, the data stays readable and writable, and no copy is stored outside the region.
    fr: |
      Le stockage redondant interzone (ZRS) copie les données de façon synchrone dans trois zones de disponibilité ou plus de la région primaire. Si une zone devient indisponible, les données restent lisibles et modifiables, et aucune copie n'est stockée hors de la région.
  options:
    a:
      en: LRS keeps every copy in a single datacenter, so the loss of that datacenter makes the data unavailable.
      fr: "LRS conserve toutes les copies dans un seul centre de données : la perte de ce centre de données rend les données indisponibles."
    c:
      en: GRS copies the data to a secondary region, which the regulation forbids, and its primary copies are in a single datacenter.
      fr: "GRS copie les données dans une région secondaire, ce que la réglementation interdit, et ses copies primaires se trouvent dans un seul centre de données."
    d:
      en: GZRS survives a zone failure but also copies the data to a secondary region, which the regulation forbids.
      fr: "GZRS survit à une défaillance de zone mais copie aussi les données dans une région secondaire, ce que la réglementation interdit."
references:
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
