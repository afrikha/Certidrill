id: az305-2a-store-control-level
objective: "2.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are designing the database platform of three companies that use SQL Server. Each company must use the most managed Azure SQL service that meets its requirements.

    - **Fabrikam**: the software vendor certifies only one SQL Server version and cumulative update. Fabrikam must decide when updates of the database engine are installed.
    - **Woodgrove**: a new application uses only database-scoped features. Microsoft must patch and upgrade the database engine, and each database must be scaled and billed on its own.
    - **Adatum**: an existing application uses Service Broker and Database Mail. Microsoft must patch the database engine, and the databases must be deployed inside a virtual network of Adatum.

    What should you recommend for each company? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez la plateforme de bases de données de trois entreprises qui utilisent SQL Server. Chaque entreprise doit utiliser le service Azure SQL le plus managé qui répond à ses exigences.

    - **Fabrikam** : l'éditeur du logiciel ne certifie qu'une seule version de SQL Server et une seule mise à jour cumulative. Fabrikam doit décider du moment où les mises à jour du moteur de base de données sont installées.
    - **Woodgrove** : une nouvelle application n'utilise que des fonctionnalités de niveau base de données. Microsoft doit mettre à jour et mettre à niveau le moteur de base de données, et chaque base de données doit être mise à l'échelle et facturée séparément.
    - **Adatum** : une application existante utilise Service Broker et Database Mail. Microsoft doit mettre à jour le moteur de base de données, et les bases de données doivent être déployées dans un réseau virtuel d'Adatum.

    Que devez-vous recommander pour chaque entreprise ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Fabrikam: [[fab]]

      Woodgrove: [[wood]]

      Adatum: [[adatum]]
    fr: |
      Fabrikam : [[fab]]

      Woodgrove : [[wood]]

      Adatum : [[adatum]]
  slots:
    - id: fab
      options:
        - { id: fab-db, text: Azure SQL Database }
        - { id: fab-mi, text: Azure SQL Managed Instance }
        - { id: fab-vm, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur machines virtuelles Azure" } }
    - id: wood
      options:
        - { id: wood-db, text: Azure SQL Database }
        - { id: wood-mi, text: Azure SQL Managed Instance }
        - { id: wood-vm, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur machines virtuelles Azure" } }
    - id: adatum
      options:
        - { id: adatum-db, text: Azure SQL Database }
        - { id: adatum-mi, text: Azure SQL Managed Instance }
        - { id: adatum-vm, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur machines virtuelles Azure" } }
answer:
  values: { fab: fab-vm, wood: wood-db, adatum: adatum-mi }
explanation:
  correct:
    en: Only SQL Server on Azure Virtual Machines lets a customer pick the SQL Server version and control when engine updates are installed. In both platform services Microsoft patches the engine. Azure SQL Database is the most managed service and scales and bills each database separately, which fits an application with database-scoped features only. Service Broker and Database Mail require SQL Managed Instance, which is deployed inside a subnet of the customer's virtual network.
    fr: Seul SQL Server sur machines virtuelles Azure permet à un client de choisir la version de SQL Server et de maîtriser le moment où les mises à jour du moteur sont installées. Dans les deux services de plateforme, c'est Microsoft qui met à jour le moteur. Azure SQL Database est le service le plus managé, et il met à l'échelle et facture chaque base de données séparément, ce qui convient à une application limitée aux fonctionnalités de niveau base de données. Service Broker et Database Mail exigent SQL Managed Instance, qui est déployé dans un sous-réseau du réseau virtuel du client.
  options:
    fab-mi: { en: "Microsoft applies engine updates to a managed instance. Fabrikam can't hold a specific cumulative update.", fr: "Microsoft applique les mises à jour du moteur à une instance managée. Fabrikam ne peut pas rester sur une mise à jour cumulative précise." }
    wood-mi: { en: "A managed instance is sized and billed as a whole instance, and its instance features aren't needed.", fr: "Une instance managée est dimensionnée et facturée comme une instance entière, et ses fonctionnalités d'instance sont inutiles ici." }
    adatum-db: { en: "Azure SQL Database supports neither Service Broker nor Database Mail.", fr: "Azure SQL Database ne prend en charge ni Service Broker ni Database Mail." }
    adatum-vm: { en: "A virtual machine supports both features, but Adatum would patch the engine itself.", fr: "Une machine virtuelle prend en charge les deux fonctionnalités, mais Adatum devrait mettre à jour le moteur lui-même." }
references:
  - title: What is Azure SQL?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/azure-sql-iaas-vs-paas-what-is-overview
  - title: "Features comparison: Azure SQL Database and Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
