id: az305-cs1a-raw-files-storage
objective: "2.2.3"
type: dropdown
caseStudy: az305-cs1a-trey-research
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend the configuration of the storage account that will store the raw sequencing files. The solution must meet the storage requirements.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander la configuration du compte de stockage qui contiendra les fichiers de séquençage bruts. La solution doit répondre aux exigences de stockage.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Redundancy of the storage account: [[redundancy]]

      Access tier to which a lifecycle management rule moves a file 60 days after its creation: [[tier]]
    fr: |
      Redondance du compte de stockage : [[redundancy]]

      Niveau d'accès vers lequel une règle de gestion du cycle de vie déplace un fichier 60 jours après sa création : [[tier]]
  slots:
    - id: redundancy
      options:
        - { id: lrs, text: { en: "Locally redundant storage (LRS)", fr: "Stockage localement redondant (LRS)" } }
        - { id: zrs, text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" } }
        - { id: grs, text: { en: "Geo-redundant storage (GRS)", fr: "Stockage géoredondant (GRS)" } }
        - { id: gzrs, text: { en: "Geo-zone-redundant storage (GZRS)", fr: "Stockage géoredondant interzone (GZRS)" } }
    - id: tier
      options:
        - { id: cool, text: { en: "Cool", fr: "Niveau froid (Cool)" } }
        - { id: cold, text: { en: "Cold", fr: "Niveau froid (Cold)" } }
        - { id: archive, text: { en: "Archive", fr: "Niveau archive (Archive)" } }
answer:
  values: { redundancy: grs, tier: archive }
explanation:
  correct:
    en: |
      Only a geo-redundant option keeps a copy of the files outside Switzerland North, and GRS is the cheapest one; read access to the secondary region isn't required. After 60 days a file is read less than once a year, a wait of up to 15 hours is accepted and the file stays for 10 years, far beyond the 180-day minimum of the archive tier: Archive gives the lowest storage price. The two choices are compatible, because the archive tier is supported with LRS, GRS and RA-GRS, but not with ZRS, GZRS or RA-GZRS.
    fr: |
      Seule une option géoredondante conserve une copie des fichiers hors de Switzerland North, et GRS est la moins chère ; l'accès en lecture à la région secondaire n'est pas exigé. Après 60 jours, un fichier est lu moins d'une fois par an, une attente allant jusqu'à 15 heures est acceptée et le fichier reste 10 ans, bien au-delà du minimum de 180 jours du niveau archive (Archive) : ce niveau offre le prix de stockage le plus bas. Les deux choix sont compatibles, car le niveau archive (Archive) est pris en charge avec LRS, GRS et RA-GRS, mais pas avec ZRS, GZRS ni RA-GZRS.
  options:
    lrs:
      en: LRS keeps three copies in one datacenter of Switzerland North; all of them are lost if the region is destroyed.
      fr: LRS conserve trois copies dans un seul centre de données de Switzerland North ; toutes sont perdues si la région est détruite.
    zrs:
      en: ZRS spreads the copies over the availability zones of Switzerland North only, and it doesn't support the archive tier.
      fr: ZRS répartit les copies entre les zones de disponibilité de Switzerland North uniquement, et ne prend pas en charge le niveau archive (Archive).
    gzrs:
      en: GZRS costs more than GRS, and an account that uses it can't move blobs to the archive tier.
      fr: GZRS coûte plus cher que GRS, et un compte qui l'utilise ne peut pas déplacer d'objets blob vers le niveau archive (Archive).
    cool:
      en: Cool is an online tier for data that is read occasionally; it stores the files at a higher price than Archive, and immediate reads aren't required after 60 days.
      fr: Le niveau froid (Cool) est un niveau en ligne pour des données lues occasionnellement ; il stocke les fichiers à un prix supérieur à celui du niveau archive (Archive), et la lecture immédiate n'est pas exigée après 60 jours.
    cold:
      en: Cold is the cheapest online tier, but the files don't need to stay online and Archive stores them at a lower price.
      fr: Le niveau froid (Cold) est le niveau en ligne le moins cher, mais les fichiers n'ont pas besoin de rester en ligne et le niveau archive (Archive) les stocke à un prix inférieur.
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
