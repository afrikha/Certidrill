id: az305-2b-consistency-levels
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is deploying three applications. Each application has its own Azure Cosmos DB for NoSQL account with a single write region and two read regions.

    For each application, you need to recommend the default consistency level that meets the requirement while minimizing the request units (RUs) consumed by reads.

    Which consistency level should you recommend for each application? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank déploie trois applications. Chaque application possède son propre compte Azure Cosmos DB for NoSQL, avec une seule région d'écriture et deux régions de lecture.

    Pour chaque application, vous devez recommander le niveau de cohérence par défaut qui répond à l'exigence tout en réduisant au minimum les unités de requête (RU) consommées par les lectures.

    Quel niveau de cohérence devez-vous recommander pour chaque application ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Ledger - a read in any region must always return the most recent committed write: [[ledger]]

      Customer portal - a customer must immediately see the changes they have just made, while other customers may briefly see older data: [[portal]]

      Branch popularity counters - reads may be stale and may arrive in any order: [[counters]]
    fr: |
      Grand livre - une lecture dans n'importe quelle région doit toujours renvoyer la dernière écriture validée : [[ledger]]

      Portail client - un client doit voir immédiatement les modifications qu'il vient d'effectuer, tandis que les autres clients peuvent voir brièvement des données plus anciennes : [[portal]]

      Compteurs de popularité des agences - les lectures peuvent être obsolètes et arriver dans n'importe quel ordre : [[counters]]
  slots:
    - id: ledger
      options:
        - { id: strong, text: Strong }
        - { id: bounded, text: Bounded staleness }
        - { id: session, text: Session }
        - { id: eventual, text: Eventual }
    - id: portal
      options:
        - { id: strong, text: Strong }
        - { id: bounded, text: Bounded staleness }
        - { id: session, text: Session }
        - { id: eventual, text: Eventual }
    - id: counters
      options:
        - { id: strong, text: Strong }
        - { id: bounded, text: Bounded staleness }
        - { id: session, text: Session }
        - { id: eventual, text: Eventual }
answer:
  values: { ledger: strong, portal: session, counters: eventual }
explanation:
  correct:
    en: |
      Only Strong consistency guarantees that a read returns the most recent committed version of an item in every region. Session consistency gives a client read-your-writes guarantees inside its session with single-replica reads, which cost half the RUs of Strong or Bounded staleness reads. Eventual consistency has no ordering guarantee and is enough for counters.
    fr: |
      Seule la cohérence Strong garantit qu'une lecture renvoie la dernière version validée d'un élément dans toutes les régions. La cohérence Session garantit à un client la lecture de ses propres écritures dans sa session, avec des lectures sur un seul réplica qui coûtent deux fois moins de RU que les lectures Strong ou Bounded staleness. La cohérence Eventual n'offre aucune garantie d'ordre et suffit pour des compteurs.
  options:
    bounded:
      en: Bounded staleness allows reads to lag by K versions or T seconds, so it does not satisfy the ledger, and its reads cost as much as Strong reads, so it is not the cheapest choice for the two other applications.
      fr: "Bounded staleness autorise un retard de K versions ou de T secondes : il ne satisfait pas le grand livre, et ses lectures coûtent autant que les lectures Strong ; ce n'est donc pas le choix le moins coûteux pour les deux autres applications."
references:
  - title: Consistency levels in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
