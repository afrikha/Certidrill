id: az305-2a-tier-config-hotarea
objective: "2.1.2"
type: hotarea
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Woodgrove Bank is sizing two new single databases in Azure SQL Database. The architecture team shortlisted the configurations shown in the following table.

    For each database, you need to select the configuration that meets its requirements at the lowest cost.

    Answer each prompt by selecting the appropriate configuration in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dimensionne deux nouvelles bases de données uniques Azure SQL Database. L'équipe d'architecture a présélectionné les configurations du tableau suivant.

    Pour chaque base de données, vous devez sélectionner la configuration qui répond à ses exigences au coût le plus bas.

    Répondez à chaque consigne en sélectionnant la configuration appropriée dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: "DB1: 800 GB, storage latency of 1 to 2 ms, reporting queries served by a readable replica that is included in the price"
        fr: "DB1 : 800 Go, latence de stockage de 1 à 2 ms, requêtes de reporting servies par un réplica lisible compris dans le prix"
    - id: p2
      text:
        en: "DB2: 300 GB, steady load around the clock, storage latency of 10 ms accepted, existing SQL Server licenses with Software Assurance to reuse"
        fr: "DB2 : 300 Go, charge stable 24 heures sur 24, latence de stockage de 10 ms acceptée, licences SQL Server existantes avec Software Assurance à réutiliser"
  grid:
    header: [Configuration, { en: "Purchasing model", fr: "Modèle d'achat" }, { en: "Service tier", fr: "Niveau de service" }, { en: "Compute tier", fr: "Niveau de calcul" }]
    rows:
      - [{ text: "1", area: c1 }, { text: DTU }, { text: Standard }, { text: { en: "Provisioned", fr: "Provisionné" } }]
      - [{ text: "2", area: c2 }, { text: vCore }, { text: General Purpose }, { text: { en: "Provisioned", fr: "Provisionné" } }]
      - [{ text: "3", area: c3 }, { text: vCore }, { text: General Purpose }, { text: Serverless }]
      - [{ text: "4", area: c4 }, { text: vCore }, { text: Business Critical }, { text: { en: "Provisioned", fr: "Provisionné" } }]
      - [{ text: "5", area: c5 }, { text: vCore }, { text: Hyperscale }, { text: { en: "Provisioned", fr: "Provisionné" } }]
answer:
  values: { p1: c4, p2: c2 }
explanation:
  correct:
    en: Business Critical keeps the database on local SSD storage, with a latency of 1 to 2 ms, and includes one readable secondary replica at no extra cost. In Hyperscale every replica is billed. For DB2, Azure Hybrid Benefit exists only in the vCore model, General Purpose is the lowest-cost vCore tier with a latency of 5 to 10 ms, and provisioned compute is the economical choice for a load that never stops.
    fr: Business Critical conserve la base de données sur un stockage SSD local, avec une latence de 1 à 2 ms, et inclut un réplica secondaire lisible sans surcoût. En Hyperscale, chaque réplica est facturé. Pour DB2, Azure Hybrid Benefit n'existe que dans le modèle vCore, General Purpose est le niveau vCore le moins coûteux avec une latence de 5 à 10 ms, et le calcul provisionné est le choix économique pour une charge qui ne s'arrête jamais.
  options:
    c1: { en: "The DTU model doesn't accept Azure Hybrid Benefit, and the Standard tier has no readable replica.", fr: "Le modèle DTU n'accepte pas Azure Hybrid Benefit, et le niveau Standard n'a pas de réplica lisible." }
    c3: { en: "Serverless is meant for intermittent use and doesn't accept Azure Hybrid Benefit.", fr: "Le serverless est destiné à une utilisation intermittente et n'accepte pas Azure Hybrid Benefit." }
    c5: { en: "Hyperscale targets very large databases. Its readable replicas are billed separately, and Azure Hybrid Benefit isn't available for new Hyperscale databases.", fr: "Hyperscale vise les bases de données très volumineuses. Ses réplicas lisibles sont facturés à part, et Azure Hybrid Benefit n'est pas disponible pour les nouvelles bases de données Hyperscale." }
references:
  - title: vCore purchasing model - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tiers-sql-database-vcore
  - title: "Azure Hybrid Benefit - Azure SQL Database & SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/azure-hybrid-benefit
