id: az305-2b-table-storage-cost
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is building an inventory application that stores about 200 GB of device metadata as key-value entities. Each lookup uses the partition key and the row key of an entity. The application runs in a single Azure region and is used irregularly.

    You need to recommend a data store that meets the following requirements:

    - Northwind pays only for the data stored and the operations executed.
    - Costs are minimized.

    What should you recommend?
  fr: |
    Northwind Traders développe une application d'inventaire qui stocke environ 200 Go de métadonnées d'appareils sous forme d'entités clé-valeur. Chaque recherche utilise la clé de partition et la clé de ligne d'une entité. L'application s'exécute dans une seule région Azure et son utilisation est irrégulière.

    Vous devez recommander un magasin de données qui répond aux exigences suivantes :

    - Northwind ne paie que les données stockées et les opérations exécutées.
    - Les coûts sont réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Azure Cosmos DB for Table with autoscale provisioned throughput", fr: "Azure Cosmos DB for Table avec un débit approvisionné à mise à l'échelle automatique" }
    - id: b
      text: { en: "Azure SQL Database in the General Purpose provisioned compute tier", fr: "Azure SQL Database au niveau General Purpose avec calcul provisionné" }
    - id: c
      text: { en: "Azure Cosmos DB for NoSQL with standard provisioned throughput", fr: "Azure Cosmos DB for NoSQL avec un débit approvisionné standard" }
    - id: d
      text: { en: "Azure Table Storage", fr: "Stockage Table Azure" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure Table Storage is a schemaless key/attribute store in which entities are retrieved by partition key and row key. You pay for the capacity used and the operations, with no throughput to reserve, which makes it the least expensive choice for a simple key-value workload that needs neither global distribution nor latency guarantees.
    fr: |
      Stockage Table Azure est un magasin clé/attribut sans schéma dans lequel les entités sont récupérées par clé de partition et clé de ligne. Vous payez la capacité utilisée et les opérations, sans débit à réserver : c'est le choix le moins coûteux pour une charge de travail clé-valeur simple qui n'a besoin ni de distribution mondiale ni de garanties de latence.
  options:
    a:
      en: Provisioned throughput is billed every hour as soon as the table exists, even when the application is idle; autoscale only lowers the amount billed to 10% of the maximum.
      fr: "Le débit approvisionné est facturé chaque heure dès que la table existe, même quand l'application est inactive ; la mise à l'échelle automatique ne fait que ramener le montant facturé à 10 % du maximum."
    b:
      en: A relational database with provisioned compute is billed continuously for its vCores and brings features this key-value workload does not need.
      fr: "Une base de données relationnelle avec calcul provisionné est facturée en continu pour ses vCores et apporte des fonctionnalités inutiles à cette charge de travail clé-valeur."
    c:
      en: Standard provisioned throughput is billed per hour for the RU/s provisioned, whatever the consumption.
      fr: "Le débit approvisionné standard est facturé à l'heure pour les RU/s approvisionnées, quelle que soit la consommation."
references:
  - title: What is Azure Table storage?
    url: https://learn.microsoft.com/en-us/azure/storage/tables/table-storage-overview
  - title: Frequently asked questions about Azure Cosmos DB for Table
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/table/faq
