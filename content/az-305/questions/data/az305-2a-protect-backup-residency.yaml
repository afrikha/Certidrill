id: az305-2a-protect-backup-residency
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware creates a database in Azure SQL Database in the West Europe region, which has availability zones and offers every backup storage redundancy option. The database holds data that is subject to a residency rule.

    You need to recommend the backup storage redundancy of the database. The solution must meet the following requirements:

    - The backups must never be stored outside West Europe.
    - The backups must remain available if one datacenter of the region is lost.
    - Minimize cost.

    What should you recommend?
  fr: |
    Litware crée une base de données Azure SQL Database dans la région West Europe, qui dispose de zones de disponibilité et propose toutes les options de redondance du stockage de sauvegarde. La base de données contient des données soumises à une règle de résidence.

    Vous devez recommander la redondance du stockage de sauvegarde de la base de données. La solution doit répondre aux exigences suivantes :

    - Les sauvegardes ne doivent jamais être stockées en dehors de West Europe.
    - Les sauvegardes doivent rester disponibles en cas de perte d'un centre de données de la région.
    - Réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Locally redundant backup storage", fr: "Un stockage de sauvegarde localement redondant" }
    - id: b
      text: { en: "Zone-redundant backup storage", fr: "Un stockage de sauvegarde redondant interzone" }
    - id: c
      text: { en: "Geo-redundant backup storage", fr: "Un stockage de sauvegarde géoredondant" }
    - id: d
      text: { en: "Geo-zone-redundant backup storage", fr: "Un stockage de sauvegarde géoredondant interzone" }
answer: { optionId: b }
explanation:
  correct:
    en: Zone-redundant backup storage copies the backups synchronously across three availability zones of the primary region. The backups stay in West Europe and survive the loss of a datacenter. The trade-off is that geo-restore to another region is no longer available.
    fr: Un stockage de sauvegarde redondant interzone copie les sauvegardes de façon synchrone dans trois zones de disponibilité de la région primaire. Les sauvegardes restent dans West Europe et survivent à la perte d'un centre de données. En contrepartie, la géorestauration vers une autre région n'est plus disponible.
  options:
    a:
      en: Locally redundant storage keeps the backups in the region and is the least expensive option, but its three copies are in a single physical location.
      fr: Un stockage localement redondant conserve les sauvegardes dans la région et constitue l'option la moins chère, mais ses trois copies se trouvent dans un seul emplacement physique.
    c:
      en: Geo-redundant storage, the default, replicates the backups to the paired region, which breaks the residency rule.
      fr: Un stockage géoredondant, le choix par défaut, réplique les sauvegardes vers la région jumelée, ce qui enfreint la règle de résidence.
    d:
      en: Geo-zone-redundant storage survives the loss of a datacenter, but it also copies the backups asynchronously to the paired region.
      fr: Un stockage géoredondant interzone survit à la perte d'un centre de données, mais il copie aussi les sauvegardes de façon asynchrone vers la région jumelée.
references:
  - title: Automated backups in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/automated-backups-overview
