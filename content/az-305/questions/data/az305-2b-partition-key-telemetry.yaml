id: az305-2b-partition-key-telemetry
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam collects telemetry from 50,000 vehicles in an Azure Cosmos DB for NoSQL container. Each item has the properties shown in the following table.

    | Property | Description |
    | --- | --- |
    | id | Unique identifier of the reading |
    | vehicleId | Identifier of the vehicle (50,000 values) |
    | vehicleModel | Model of the vehicle (12 values) |
    | country | Country where the vehicle is registered (8 values) |

    All vehicles send the same number of readings, and the data of one vehicle never exceeds 2 GB. Almost all queries retrieve the readings of a single vehicle.

    You need to recommend a partition key for the container. The solution must distribute storage and throughput evenly and must minimize the request units consumed by the most frequent queries.

    Which partition key should you recommend?
  fr: |
    Fabrikam collecte la télémétrie de 50 000 véhicules dans un conteneur Azure Cosmos DB for NoSQL. Chaque élément possède les propriétés présentées dans le tableau suivant.

    | Propriété | Description |
    | --- | --- |
    | id | Identificateur unique du relevé |
    | vehicleId | Identificateur du véhicule (50 000 valeurs) |
    | vehicleModel | Modèle du véhicule (12 valeurs) |
    | country | Pays d'immatriculation du véhicule (8 valeurs) |

    Tous les véhicules envoient le même nombre de relevés, et les données d'un véhicule ne dépassent jamais 2 Go. Presque toutes les requêtes récupèrent les relevés d'un seul véhicule.

    Vous devez recommander une clé de partition pour le conteneur. La solution doit répartir uniformément le stockage et le débit et réduire au minimum les unités de requête consommées par les requêtes les plus fréquentes.

    Quelle clé de partition devez-vous recommander ?
body:
  options:
    - { id: a, text: "/country" }
    - { id: b, text: "/vehicleModel" }
    - { id: c, text: "/vehicleId" }
    - { id: d, text: "/id" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A good partition key has a high cardinality, spreads storage and request units evenly across logical partitions and appears as an equality filter in the most frequent queries. `/vehicleId` has 50,000 evenly loaded values, each far below the 20-GB limit of a logical partition, and a query for one vehicle is routed to a single partition.
    fr: |
      Une bonne clé de partition a une cardinalité élevée, répartit uniformément le stockage et les unités de requête entre les partitions logiques et sert de filtre d'égalité dans les requêtes les plus fréquentes. `/vehicleId` compte 50 000 valeurs chargées uniformément, chacune très en dessous de la limite de 20 Go d'une partition logique, et une requête sur un véhicule est acheminée vers une seule partition.
  options:
    a:
      en: Eight values concentrate the data in a few very large logical partitions that would exceed 20 GB and become hot partitions.
      fr: "Huit valeurs concentrent les données dans quelques partitions logiques très volumineuses, qui dépasseraient 20 Go et deviendraient des partitions chaudes."
    b:
      en: Twelve values give a low cardinality; each logical partition would hold the data of thousands of vehicles and exceed the 20-GB limit.
      fr: "Douze valeurs donnent une cardinalité faible ; chaque partition logique contiendrait les données de milliers de véhicules et dépasserait la limite de 20 Go."
    d:
      en: The item ID distributes data evenly, but a query for all the readings of one vehicle would fan out to every physical partition and consume more request units.
      fr: "L'ID d'élément répartit uniformément les données, mais une requête sur tous les relevés d'un véhicule serait diffusée à toutes les partitions physiques et consommerait davantage d'unités de requête."
references:
  - title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
