id: az305-2a-tier-inmemory-oltp
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to migrate a 600 GB trading database from SQL Server to a single database in Azure SQL Database. The application stores its order book in durable memory-optimized tables (In-Memory OLTP), and this design must be kept.

    Which two service tiers can you recommend? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit de migrer une base de données de trading de 600 Go de SQL Server vers une base de données unique Azure SQL Database. L'application stocke son carnet d'ordres dans des tables optimisées en mémoire durables (OLTP en mémoire), et cette conception doit être conservée.

    Quels sont les deux niveaux de service que vous pouvez recommander ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Standard }
    - { id: b, text: Premium }
    - { id: c, text: General Purpose }
    - { id: d, text: Business Critical }
    - { id: e, text: Hyperscale }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: In Azure SQL Database, In-Memory OLTP is available in the Premium service tier of the DTU model and in the Business Critical service tier of the vCore model. Both keep the database on local SSD storage with several replicas, which is the architecture that durable memory-optimized tables rely on.
    fr: Dans Azure SQL Database, l'OLTP en mémoire est disponible au niveau de service Premium du modèle DTU et au niveau de service Business Critical du modèle vCore. Tous deux conservent la base de données sur un stockage SSD local avec plusieurs réplicas, l'architecture sur laquelle reposent les tables optimisées en mémoire durables.
  options:
    a: { en: "The Standard tier doesn't support In-Memory OLTP.", fr: "Le niveau Standard ne prend pas en charge l'OLTP en mémoire." }
    c: { en: "General Purpose uses remote storage and doesn't support In-Memory OLTP.", fr: "General Purpose utilise un stockage distant et ne prend pas en charge l'OLTP en mémoire." }
    e: { en: "Hyperscale has only limited support for non-persistent objects such as memory-optimized table variables, not for durable memory-optimized tables.", fr: "Hyperscale n'offre qu'une prise en charge limitée d'objets non persistants, comme les variables de table optimisées en mémoire, pas des tables optimisées en mémoire durables." }
references:
  - title: "Features comparison: Azure SQL Database and Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
  - title: vCore purchasing model - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/service-tiers-sql-database-vcore
