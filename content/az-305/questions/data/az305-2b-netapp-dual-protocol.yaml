id: az305-2b-netapp-dual-protocol
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is migrating an on-premises enterprise NAS to Azure. The NAS hosts SAP HANA shared volumes and research data.

    You need to recommend a storage service that meets the following requirements:

    - Linux servers access a volume with NFSv4.1 while Windows servers access the same volume with SMB.
    - Storage latency stays below one millisecond.
    - Volume snapshots and cross-region replication are provided by the storage service.

    What should you recommend?
  fr: |
    Woodgrove Bank migre un NAS d'entreprise local vers Azure. Le NAS héberge des volumes partagés SAP HANA et des données de recherche.

    Vous devez recommander un service de stockage qui répond aux exigences suivantes :

    - Des serveurs Linux accèdent à un volume en NFSv4.1 tandis que des serveurs Windows accèdent au même volume en SMB.
    - La latence du stockage reste inférieure à une milliseconde.
    - Les instantanés de volume et la réplication interrégion sont fournis par le service de stockage.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: Azure NetApp Files
    - id: b
      text: { en: "Azure Blob Storage with NFS 3.0 protocol support", fr: "Stockage Blob Azure avec la prise en charge du protocole NFS 3.0" }
    - id: c
      text: { en: "Azure Files with SSD file shares", fr: "Azure Files avec des partages de fichiers SSD" }
    - id: d
      text: Azure Elastic SAN
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure NetApp Files supports NFSv3, NFSv4.1 and SMB, including dual-protocol volumes that are accessed with NFS and SMB at the same time. It delivers submillisecond latency for workloads such as SAP HANA and includes snapshots and cross-region replication.
    fr: |
      Azure NetApp Files prend en charge NFSv3, NFSv4.1 et SMB, y compris des volumes à double protocole accessibles simultanément en NFS et en SMB. Il offre une latence inférieure à la milliseconde pour des charges de travail comme SAP HANA et inclut les instantanés et la réplication interrégion.
  options:
    b:
      en: Blob Storage offers NFS 3.0 only, with no SMB access, and is optimized for large sequential reads rather than low-latency workloads.
      fr: "Stockage Blob ne propose que NFS 3.0, sans accès SMB, et il est optimisé pour de grandes lectures séquentielles plutôt que pour des charges de travail à faible latence."
    c:
      en: A single Azure file share uses either SMB or NFS, never both, and SSD shares provide single-digit millisecond latency.
      fr: "Un partage de fichiers Azure utilise soit SMB, soit NFS, jamais les deux, et les partages SSD offrent une latence de quelques millisecondes."
    d:
      en: Elastic SAN provides block volumes over iSCSI, not NFS or SMB file shares.
      fr: "Elastic SAN fournit des volumes de blocs en iSCSI, pas des partages de fichiers NFS ou SMB."
references:
  - title: What is Azure NetApp Files?
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-introduction
  - title: Compare access to Azure Files, Blob Storage, and Azure NetApp Files with NFS
    url: https://learn.microsoft.com/en-us/azure/storage/common/nfs-comparison
