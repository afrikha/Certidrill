id: az305-2b-point-in-time-restore
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank stores block blobs in 300 containers of a standard general-purpose v2 storage account that has a flat namespace. A faulty release of an application recently overwrote and deleted thousands of blobs in many containers before the error was detected.

    You need to recommend a solution that lets administrators return the block blobs of the affected containers to their state at a chosen date and time, in a single operation.

    What should you recommend?
  fr: |
    Woodgrove Bank stocke des objets blob de blocs dans 300 conteneurs d'un compte de stockage standard usage général v2 doté d'un espace de noms plat. Une version défectueuse d'une application a récemment écrasé et supprimé des milliers d'objets blob dans de nombreux conteneurs avant que l'erreur ne soit détectée.

    Vous devez recommander une solution qui permet aux administrateurs de ramener, en une seule opération, les objets blob de blocs des conteneurs concernés à leur état à une date et une heure choisies.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Point-in-time restore for block blobs", fr: "La restauration à un instant dans le passé pour les objets blob de blocs" }
    - id: b
      text: { en: "Container soft delete", fr: "La suppression réversible de conteneur" }
    - id: c
      text: { en: "Object replication to a second storage account", fr: "La réplication d'objets vers un second compte de stockage" }
    - id: d
      text: { en: "Geo-redundant storage (GRS) with customer-managed failover", fr: "Le stockage géoredondant (GRS) avec un basculement géré par le client" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Point-in-time restore returns block blobs to their state at a restore point that you specify, for chosen ranges of containers and blobs or for the whole account, in one operation. It protects against accidental deletion and data corruption by an application and relies on blob versioning, the change feed and blob soft delete.
    fr: |
      La restauration à un instant dans le passé ramène les objets blob de blocs à leur état à un point de restauration que vous indiquez, pour des plages de conteneurs et d'objets blob choisies ou pour tout le compte, en une seule opération. Elle protège contre la suppression accidentelle et la corruption des données par une application, et repose sur le contrôle de version des objets blob, le flux de modification et la suppression réversible des objets blob.
  options:
    b:
      en: Container soft delete restores a whole container that was deleted; it does not revert blobs that were overwritten or deleted inside containers that still exist.
      fr: "La suppression réversible de conteneur restaure un conteneur entier qui a été supprimé ; elle ne rétablit pas des objets blob écrasés ou supprimés dans des conteneurs qui existent toujours."
    c:
      en: Object replication copies the changes of the source account, including the faulty ones, to the destination; it offers no operation that returns many blobs to a given time.
      fr: "La réplication d'objets copie vers la destination les modifications du compte source, y compris les modifications erronées ; elle n'offre aucune opération ramenant de nombreux objets blob à un instant donné."
    d:
      en: Geo-replication also copies overwrites and deletions to the secondary region, so a failover returns the same corrupted data.
      fr: "La géoréplication copie aussi les écrasements et les suppressions dans la région secondaire : un basculement renvoie donc les mêmes données corrompues."
references:
  - title: Point-in-time restore for block blobs
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/point-in-time-restore-overview
  - title: Data protection overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-protection-overview
