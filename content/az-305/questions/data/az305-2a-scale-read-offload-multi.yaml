id: az305-2a-scale-read-offload-multi
objective: "2.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a 400 GB database named **db-sales** in Azure SQL Database, in the General Purpose service tier with provisioned compute, in the West Europe region. Read-only queries of a business intelligence (BI) tool slow down the transactions of the sales application.

    You need to recommend a change that meets the following requirements:

    - The queries of the BI tool must run on a replica other than the one that processes the transactions.
    - The only change allowed in the BI tool is adding `ApplicationIntent=ReadOnly` to its connection string. The server name and the database name must stay the same.
    - No second database may be created.

    Which two changes can you recommend? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso possède une base de données de 400 Go nommée **db-sales** dans Azure SQL Database, au niveau de service General Purpose avec calcul provisionné, dans la région West Europe. Les requêtes en lecture seule d'un outil de décisionnel (BI) ralentissent les transactions de l'application commerciale.

    Vous devez recommander une modification qui répond aux exigences suivantes :

    - Les requêtes de l'outil BI doivent s'exécuter sur un autre réplica que celui qui traite les transactions.
    - La seule modification autorisée dans l'outil BI est l'ajout de `ApplicationIntent=ReadOnly` à sa chaîne de connexion. Le nom du serveur et le nom de la base de données doivent rester les mêmes.
    - Aucune seconde base de données ne doit être créée.

    Quelles sont les deux modifications que vous pouvez recommander ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Change db-sales to the Business Critical service tier.", fr: "Passer db-sales au niveau de service Business Critical." } }
    - { id: b, text: { en: "Increase the number of vCores of db-sales in the General Purpose service tier.", fr: "Augmenter le nombre de vCores de db-sales au niveau de service General Purpose." } }
    - { id: c, text: { en: "Move db-sales into a General Purpose elastic pool.", fr: "Déplacer db-sales dans un pool élastique General Purpose." } }
    - { id: d, text: { en: "Change db-sales to the Hyperscale service tier with one high-availability replica.", fr: "Passer db-sales au niveau de service Hyperscale avec un réplica de haute disponibilité." } }
    - { id: e, text: { en: "Change db-sales to the serverless compute tier.", fr: "Passer db-sales au niveau de calcul serverless." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Read scale-out routes the connections that specify `ApplicationIntent=ReadOnly` to a read-only replica of the same database, under the same server and database names. It exists in Business Critical, where a readable secondary replica is built in, and in Hyperscale as soon as the database has at least one secondary replica. A General Purpose database has no readable replica, whatever its size or compute tier.
    fr: La lecture à l'échelle (read scale-out) route les connexions qui indiquent `ApplicationIntent=ReadOnly` vers un réplica en lecture seule de la même base de données, sous les mêmes noms de serveur et de base de données. Elle existe en Business Critical, où un réplica secondaire lisible est intégré, et en Hyperscale dès que la base de données possède au moins un réplica secondaire. Une base de données General Purpose n'a pas de réplica lisible, quels que soient sa taille et son niveau de calcul.
  options:
    b: { en: "More vCores give more capacity to the single replica, on which the BI queries and the transactions still run together.", fr: "Davantage de vCores donnent plus de capacité au réplica unique, sur lequel les requêtes BI et les transactions s'exécutent toujours ensemble." }
    c: { en: "A pool shares resources between databases. A General Purpose database in a pool still has no readable replica.", fr: "Un pool partage des ressources entre bases de données. Une base de données General Purpose dans un pool n'a toujours pas de réplica lisible." }
    e: { en: "Serverless changes how compute is scaled and billed. It adds no replica.", fr: "Le serverless change la façon dont le calcul est mis à l'échelle et facturé. Il n'ajoute aucun réplica." }
references:
  - title: Use read-only replicas to offload read-only query workloads
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/read-scale-out
