id: az305-2b-file-sync-branches
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has 12 branch offices. Each office has a Windows Server file server that users access over SMB. The local disks of the servers are almost full.

    You need to recommend a solution that meets the following requirements:

    - Centralize all the files in Azure.
    - Keep each file server as a local cache, so that users keep their current access paths and fast access to recent files.
    - Free local disk space by keeping rarely used files only in Azure, while they remain visible in the folders.

    Which two components should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders possède 12 succursales. Chaque succursale dispose d'un serveur de fichiers Windows Server auquel les utilisateurs accèdent en SMB. Les disques locaux des serveurs sont presque pleins.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Centraliser tous les fichiers dans Azure.
    - Conserver chaque serveur de fichiers comme cache local, afin que les utilisateurs gardent leurs chemins d'accès actuels et un accès rapide aux fichiers récents.
    - Libérer de l'espace disque local en ne conservant les fichiers rarement utilisés que dans Azure, tout en les laissant visibles dans les dossiers.

    Quels sont les deux composants à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "An Azure file share that uses the NFS protocol", fr: "Un partage de fichiers Azure qui utilise le protocole NFS" }
    - id: b
      text: { en: "Azure File Sync with cloud tiering enabled on each file server", fr: "Azure File Sync avec la hiérarchisation cloud activée sur chaque serveur de fichiers" }
    - id: c
      text: { en: "An Azure Blob Storage container with a lifecycle management policy", fr: "Un conteneur Stockage Blob Azure avec une stratégie de gestion du cycle de vie" }
    - id: d
      text: { en: "An Azure file share that uses the SMB protocol", fr: "Un partage de fichiers Azure qui utilise le protocole SMB" }
    - id: e
      text: { en: "An Azure NetApp Files volume with cross-region replication", fr: "Un volume Azure NetApp Files avec la réplication interrégion" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Azure File Sync centralizes file shares in Azure Files while each registered Windows Server keeps a local cache and syncs with a central Azure file share. Cloud tiering keeps only frequently accessed files on the local disk; the other files stay in Azure but remain visible and are recalled on access. Azure File Sync works only with SMB Azure file shares.
    fr: |
      Azure File Sync centralise les partages de fichiers dans Azure Files, tandis que chaque serveur Windows Server inscrit conserve un cache local et se synchronise avec un partage de fichiers Azure central. La hiérarchisation cloud ne garde sur le disque local que les fichiers fréquemment consultés ; les autres restent dans Azure tout en demeurant visibles, et sont rappelés lors de l'accès. Azure File Sync ne fonctionne qu'avec des partages de fichiers Azure SMB.
  options:
    a: { en: "Azure File Sync does not support NFS file shares, and Windows clients cannot mount them.", fr: "Azure File Sync ne prend pas en charge les partages de fichiers NFS, et les clients Windows ne peuvent pas les monter." }
    c: { en: "Lifecycle management moves blobs between access tiers inside Azure; it does not synchronize or tier files of Windows file servers.", fr: "La gestion du cycle de vie déplace des objets blob entre niveaux d'accès dans Azure ; elle ne synchronise pas les fichiers de serveurs de fichiers Windows et ne les hiérarchise pas." }
    e: { en: "Azure NetApp Files would replace the file servers instead of keeping them as local caches, and it does not tier files from Windows Server.", fr: "Azure NetApp Files remplacerait les serveurs de fichiers au lieu de les conserver comme caches locaux, et ne hiérarchise pas les fichiers de Windows Server." }
references:
  - title: What is Azure File Sync?
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-introduction
  - title: Plan an Azure File Sync deployment
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-planning
