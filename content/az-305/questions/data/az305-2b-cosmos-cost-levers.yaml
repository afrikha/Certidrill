id: az305-2b-cosmos-cost-levers
objective: "2.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys stores device telemetry in an Azure Cosmos DB for NoSQL account that is replicated to two regions. The container uses standard provisioned throughput of 30,000 RU/s, and the account uses Strong as its default consistency level.

    You need to reduce costs while meeting the following requirements:

    - Telemetry items must be removed 90 days after their last update, without custom code and by using only the request units that the application leaves unused.
    - A reporting service that tolerates stale data must spend fewer request units on its reads. The default consistency level of the account must not change.
    - Traffic reaches 30,000 RU/s for about three hours per day and stays near 3,000 RU/s the rest of the time. Requests must not be throttled.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys stocke la télémétrie d'appareils dans un compte Azure Cosmos DB for NoSQL répliqué dans deux régions. Le conteneur utilise un débit approvisionné standard de 30 000 RU/s, et le compte utilise Strong comme niveau de cohérence par défaut.

    Vous devez réduire les coûts tout en répondant aux exigences suivantes :

    - Les éléments de télémétrie doivent être supprimés 90 jours après leur dernière mise à jour, sans code personnalisé et en n'utilisant que les unités de requête laissées inutilisées par l'application.
    - Un service de création de rapports qui tolère des données obsolètes doit dépenser moins d'unités de requête pour ses lectures. Le niveau de cohérence par défaut du compte ne doit pas changer.
    - Le trafic atteint 30 000 RU/s pendant environ trois heures par jour et reste proche de 3 000 RU/s le reste du temps. Les requêtes ne doivent pas subir de limitation de débit.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To remove old telemetry items: [[purge]]

      For the reads of the reporting service: [[reads]]

      For the throughput of the container: [[cap]]
    fr: |
      Pour supprimer les anciens éléments de télémétrie : [[purge]]

      Pour les lectures du service de création de rapports : [[reads]]

      Pour le débit du conteneur : [[cap]]
  slots:
    - id: purge
      options:
        - { id: cfp, text: { en: "Run a change feed processor that deletes old items", fr: "Exécuter un processeur de flux de modification qui supprime les anciens éléments" } }
        - { id: ttl, text: { en: "Set a default time to live (TTL) on the container", fr: "Définir une durée de vie (TTL) par défaut sur le conteneur" } }
        - { id: sproc, text: { en: "Call a stored procedure from a scheduled function", fr: "Appeler une procédure stockée depuis une fonction planifiée" } }
    - id: reads
      options:
        - { id: bounded, text: { en: "Override the consistency of the requests to Bounded staleness", fr: "Remplacer la cohérence des requêtes par Bounded staleness" } }
        - { id: region, text: { en: "Keep Strong consistency and add a third read region", fr: "Conserver la cohérence Strong et ajouter une troisième région de lecture" } }
        - { id: eventual, text: { en: "Override the consistency of the requests to Eventual", fr: "Remplacer la cohérence des requêtes par Eventual" } }
    - id: cap
      options:
        - { id: manual, text: { en: "Standard provisioned throughput of 30,000 RU/s", fr: "Débit approvisionné standard de 30 000 RU/s" } }
        - { id: auto, text: { en: "Autoscale with a maximum of 30,000 RU/s", fr: "Mise à l'échelle automatique avec un maximum de 30 000 RU/s" } }
        - { id: sls, text: { en: "Serverless", fr: "Serverless" } }
answer:
  values: { purge: ttl, reads: eventual, cap: auto }
explanation:
  correct:
    en: |
      A time to live on the container deletes items automatically a set number of seconds after their last modification; with provisioned throughput, the deletions use only the request units left over by user requests. A request can override the account default with a weaker level: Eventual reads use a single replica and cost half the request units of Strong reads. Autoscale scales between 10% and 100% of its maximum, here 3,000 to 30,000 RU/s, and bills the highest value reached in each hour, which is cheaper than paying 30,000 RU/s all day.
    fr: |
      Une durée de vie sur le conteneur supprime automatiquement les éléments un nombre défini de secondes après leur dernière modification ; avec un débit approvisionné, les suppressions n'utilisent que les unités de requête laissées par les requêtes des utilisateurs. Une requête peut remplacer le niveau par défaut du compte par un niveau plus faible : les lectures Eventual utilisent un seul réplica et coûtent deux fois moins d'unités de requête que les lectures Strong. La mise à l'échelle automatique évolue entre 10 % et 100 % de son maximum, ici de 3 000 à 30 000 RU/s, et facture la valeur la plus élevée atteinte dans chaque heure, ce qui coûte moins cher que de payer 30 000 RU/s toute la journée.
  options:
    cfp: { en: "A change feed processor is custom code, and its delete operations consume request units like any other request.", fr: "Un processeur de flux de modification est du code personnalisé, et ses suppressions consomment des unités de requête comme toute autre requête." }
    bounded: { en: "Bounded staleness reads use two replicas and cost as many request units as Strong reads.", fr: "Les lectures Bounded staleness utilisent deux réplicas et coûtent autant d'unités de requête que les lectures Strong." }
    region: { en: "Adding a region increases the cost and does not change the request units charged for a Strong read.", fr: "Ajouter une région augmente le coût et ne change pas les unités de requête facturées pour une lecture Strong." }
    sls: { en: "A serverless account runs in a single region, and this account is replicated to two regions.", fr: "Un compte serverless s'exécute dans une seule région, alors que ce compte est répliqué dans deux régions." }
references:
  - title: Time to live in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
  - title: Consistency levels in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
