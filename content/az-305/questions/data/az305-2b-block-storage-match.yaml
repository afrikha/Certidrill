id: az305-2b-block-storage-match
objective: "2.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware is planning the storage of three workloads.

    Which storage service should you recommend for each workload? To answer, drag the appropriate services to the correct workloads. Each service may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware planifie le stockage de trois charges de travail.

    Quel service de stockage devez-vous recommander pour chaque charge de travail ? Pour répondre, faites glisser les services appropriés vers les charges de travail correspondantes. Chaque service peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: blob, text: { en: "Azure Blob Storage", fr: "Stockage Blob Azure" } }
    - { id: files, text: Azure Files }
    - { id: anf, text: Azure NetApp Files }
    - { id: esan, text: Azure Elastic SAN }
    - { id: disks, text: { en: "Azure managed disks", fr: "Disques managés Azure" } }
  targets:
    - id: t1
      text: { en: "A genomics pipeline whose Linux nodes mount the data with NFS 3.0 for large sequential reads, while the same data is tiered by lifecycle management policies", fr: "Un pipeline de génomique dont les nœuds Linux montent les données en NFS 3.0 pour de grandes lectures séquentielles, tandis que les mêmes données changent de niveau grâce à des stratégies de gestion du cycle de vie" }
    - id: t2
      text: { en: "A shared pool of iSCSI block volumes whose capacity and performance are consumed by many virtual machines and Azure Kubernetes Service clusters", fr: "Un pool partagé de volumes de blocs iSCSI dont la capacité et les performances sont consommées par de nombreuses machines virtuelles et de nombreux clusters Azure Kubernetes Service" }
    - id: t3
      text: { en: "Persistent block storage that is attached to one database virtual machine and is never accessed from outside that machine", fr: "Un stockage par blocs persistant attaché à une machine virtuelle de base de données et jamais utilisé en dehors de cette machine" }
answer:
  mapping: { t1: blob, t2: esan, t3: disks }
explanation:
  correct:
    en: |
      Blob Storage supports NFS 3.0 mounts for large-scale, read-heavy sequential workloads and keeps object features such as lifecycle management. Elastic SAN is a storage area network whose iSCSI volumes share the performance of the SAN and serve several compute services, including virtual machines and AKS. Managed disks persist the data of the virtual machine they are attached to.
    fr: |
      Stockage Blob prend en charge les montages NFS 3.0 pour des charges de travail séquentielles à grande échelle, à forte proportion de lectures, et conserve les fonctionnalités d'objets comme la gestion du cycle de vie. Elastic SAN est un réseau de stockage dont les volumes iSCSI partagent les performances du SAN et desservent plusieurs services de calcul, dont les machines virtuelles et AKS. Les disques managés conservent les données de la machine virtuelle à laquelle ils sont attachés.
  options:
    files: { en: "Azure Files offers NFS 4.1 and SMB shares for random-access file workloads; it has no NFS 3.0 or iSCSI access.", fr: "Azure Files propose des partages NFS 4.1 et SMB pour des charges de travail de fichiers à accès aléatoire ; il n'offre ni NFS 3.0 ni accès iSCSI." }
    anf: { en: "Azure NetApp Files supports NFS 3.0, but it is a file service without blob lifecycle management, and it does not provide iSCSI block volumes.", fr: "Azure NetApp Files prend en charge NFS 3.0, mais c'est un service de fichiers sans gestion du cycle de vie des objets blob, et il ne fournit pas de volumes de blocs iSCSI." }
references:
  - title: Introduction to Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-introduction
  - title: Compare access to Azure Files, Blob Storage, and Azure NetApp Files with NFS
    url: https://learn.microsoft.com/en-us/azure/storage/common/nfs-comparison
