id: az305-2b-account-types-facts
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso is choosing storage account types for several new workloads that store unstructured data.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso choisit des types de comptes de stockage pour plusieurs nouvelles charges de travail qui stockent des données non structurées.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Block blobs stored in a premium block blobs account can be moved to the cool access tier by a lifecycle management policy.
        fr: Les objets blob de blocs stockés dans un compte d'objets blob de blocs Premium peuvent être déplacés vers le niveau d'accès froid (Cool) par une stratégie de gestion du cycle de vie.
    - id: s2
      text:
        en: One standard general-purpose v2 account can host blob containers, file shares, queues and tables.
        fr: Un même compte standard usage général v2 peut héberger des conteneurs d'objets blob, des partages de fichiers, des files d'attente et des tables.
    - id: s3
      text:
        en: A premium file shares account can be configured with geo-redundant storage (GRS).
        fr: Un compte de partages de fichiers Premium peut être configuré avec le stockage géoredondant (GRS).
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Data in a premium block blobs account cannot be tiered, neither with Set Blob Tier nor with lifecycle management; access tiers belong to standard accounts. A standard general-purpose v2 account supports Blob Storage, Azure Files, Queue Storage and Table Storage. Premium account types support only LRS and ZRS; geo-redundant options require a standard general-purpose v2 account.
    fr: |
      Les données d'un compte d'objets blob de blocs Premium ne peuvent pas changer de niveau, ni avec Set Blob Tier ni avec la gestion du cycle de vie ; les niveaux d'accès appartiennent aux comptes standard. Un compte standard usage général v2 prend en charge Stockage Blob, Azure Files, Stockage File d'attente et Stockage Table. Les types de comptes Premium ne prennent en charge que LRS et ZRS ; les options géoredondantes exigent un compte standard usage général v2.
references:
  - title: Overview of storage accounts
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-account-overview
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
