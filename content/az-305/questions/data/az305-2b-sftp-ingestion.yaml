id: az305-2b-sftp-ingestion
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware receives daily data files from 40 partners. Each partner sends its files with its own SFTP client. After each upload, Apache Spark jobs analyze the files.

    You need to recommend a storage solution that meets the following requirements:

    - Partners connect directly to the storage service with SFTP.
    - No virtual machine or file transfer server is deployed.
    - The Spark jobs read the files where they were uploaded, without copying them to another service.

    What should you recommend?
  fr: |
    Proseware reçoit chaque jour des fichiers de données de 40 partenaires. Chaque partenaire envoie ses fichiers avec son propre client SFTP. Après chaque chargement, des travaux Apache Spark analysent les fichiers.

    Vous devez recommander une solution de stockage qui répond aux exigences suivantes :

    - Les partenaires se connectent directement au service de stockage en SFTP.
    - Aucune machine virtuelle ni aucun serveur de transfert de fichiers n'est déployé.
    - Les travaux Spark lisent les fichiers là où ils ont été chargés, sans les copier vers un autre service.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Azure Files in a standard general-purpose v2 storage account", fr: "Azure Files dans un compte de stockage standard usage général v2" }
    - id: b
      text: { en: "Azure Blob Storage in a storage account that has a hierarchical namespace", fr: "Stockage Blob Azure dans un compte de stockage doté d'un espace de noms hiérarchique" }
    - id: c
      text: { en: "Azure Files in a premium file shares storage account", fr: "Azure Files dans un compte de stockage de partages de fichiers Premium" }
    - id: d
      text: { en: "Azure Blob Storage in a storage account that has a flat namespace", fr: "Stockage Blob Azure dans un compte de stockage doté d'un espace de noms plat" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Blob Storage accepts SFTP connections natively, with local users authenticated by a password or an SSH key, so no transfer server is needed. SFTP support requires the hierarchical namespace, which also turns the account into Azure Data Lake Storage that Spark reads directly.
    fr: |
      Stockage Blob Azure accepte nativement les connexions SFTP, avec des utilisateurs locaux authentifiés par un mot de passe ou une clé SSH : aucun serveur de transfert n'est nécessaire. La prise en charge de SFTP exige l'espace de noms hiérarchique, qui fait aussi du compte un Azure Data Lake Storage que Spark lit directement.
  options:
    a:
      en: Azure Files is reached with SMB, NFS or its REST API; it has no SFTP endpoint.
      fr: "Azure Files est accessible en SMB, en NFS ou par son API REST ; il n'a pas de point de terminaison SFTP."
    c:
      en: A premium file shares account adds NFS shares and SSD performance, but still no SFTP endpoint.
      fr: "Un compte de partages de fichiers Premium ajoute les partages NFS et les performances SSD, mais toujours pas de point de terminaison SFTP."
    d:
      en: SFTP support cannot be enabled on a storage account that has a flat namespace.
      fr: "La prise en charge de SFTP ne peut pas être activée sur un compte de stockage doté d'un espace de noms plat."
references:
  - title: SSH File Transfer Protocol (SFTP) support for Azure Blob Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/secure-file-transfer-protocol-support
  - title: Introduction to Azure Data Lake Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-lake-storage-introduction
