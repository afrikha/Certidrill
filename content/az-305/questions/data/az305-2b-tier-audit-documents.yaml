id: az305-2b-tier-audit-documents
objective: "2.2.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Contoso stores 80 TB of signed contracts as block blobs in a standard general-purpose v2 storage account that uses LRS. Each contract is kept for five years. After its first week, a contract is read about once a year, during an audit.

    You need to recommend an access tier for the contracts that are older than one week. The solution must meet the following requirements:

    - An auditor must be able to open any contract within seconds.
    - Storage costs must be minimized.

    Which access tier should you recommend?
  fr: |
    Contoso stocke 80 To de contrats signés sous forme d'objets blob de blocs dans un compte de stockage standard usage général v2 qui utilise LRS. Chaque contrat est conservé cinq ans. Après sa première semaine, un contrat est lu environ une fois par an, lors d'un audit.

    Vous devez recommander un niveau d'accès pour les contrats de plus d'une semaine. La solution doit répondre aux exigences suivantes :

    - Un auditeur doit pouvoir ouvrir n'importe quel contrat en quelques secondes.
    - Les coûts de stockage doivent être réduits au minimum.

    Quel niveau d'accès devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Hot", fr: "Niveau chaud (Hot)" } }
    - { id: b, text: { en: "Cool", fr: "Niveau froid (Cool)" } }
    - { id: c, text: { en: "Cold", fr: "Niveau froid (Cold)" } }
    - { id: d, text: { en: "Archive", fr: "Niveau archive (Archive)" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The cold tier is an online tier: blobs are read within milliseconds, like in the hot and cool tiers. Its storage price is lower than that of the cool tier, in exchange for higher access costs and a 90-day minimum retention, which suits data that is kept for years and read about once a year.
    fr: |
      Le niveau froid (Cold) est un niveau en ligne : les objets blob y sont lus en quelques millisecondes, comme dans les niveaux chaud (Hot) et froid (Cool). Son prix de stockage est inférieur à celui du niveau froid (Cool), en contrepartie de coûts d'accès plus élevés et d'une rétention minimale de 90 jours, ce qui convient à des données conservées des années et lues environ une fois par an.
  options:
    a:
      en: The hot tier has the highest storage price and is meant for data that is read or modified frequently.
      fr: "Le niveau chaud (Hot) a le prix de stockage le plus élevé et s'adresse aux données lues ou modifiées fréquemment."
    b:
      en: The cool tier is online too, but its storage price is higher than that of the cold tier, and the contracts are almost never read.
      fr: "Le niveau froid (Cool) est lui aussi en ligne, mais son prix de stockage est supérieur à celui du niveau froid (Cold), et les contrats ne sont presque jamais lus."
    d:
      en: The archive tier is offline; a blob must be rehydrated before it can be read, which can take hours.
      fr: "Le niveau archive (Archive) est hors connexion : un objet blob doit être réhydraté avant de pouvoir être lu, ce qui peut prendre des heures."
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
