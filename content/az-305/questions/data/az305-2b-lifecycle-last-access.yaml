id: az305-2b-lifecycle-last-access
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys stores 20 million marketing images as block blobs in the hot tier of a standard general-purpose v2 storage account that uses LRS. Most images are no longer read a few weeks after their publication, but some of them become popular again during new campaigns.

    You need to recommend a solution that meets the following requirements:

    - Move an image to the cool tier when it has not been read for 30 days.
    - Move the image back to the hot tier when it is read again.
    - Minimize administrative effort.

    What should you recommend?
  fr: |
    Tailspin Toys stocke 20 millions d'images marketing sous forme d'objets blob de blocs au niveau chaud (Hot) d'un compte de stockage standard usage général v2 qui utilise LRS. La plupart des images ne sont plus lues quelques semaines après leur publication, mais certaines redeviennent populaires lors de nouvelles campagnes.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Déplacer une image vers le niveau froid (Cool) lorsqu'elle n'a pas été lue depuis 30 jours.
    - Ramener l'image au niveau chaud (Hot) lorsqu'elle est lue de nouveau.
    - Réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A lifecycle management policy based on the last access time", fr: "Une stratégie de gestion du cycle de vie basée sur l'heure du dernier accès" }
    - id: b
      text: { en: "A lifecycle management policy based on the last modified time", fr: "Une stratégie de gestion du cycle de vie basée sur l'heure de dernière modification" }
    - id: c
      text: { en: "An Azure function that runs every day and calls Set Blob Tier for each image", fr: "Une fonction Azure exécutée chaque jour qui appelle Set Blob Tier pour chaque image" }
    - id: d
      text: { en: "A change of the default access tier of the storage account to cool", fr: "Le passage du niveau d'accès par défaut du compte de stockage au niveau froid (Cool)" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Lifecycle management rules can use the last access time of a blob once access time tracking is enabled on the account. A rule can move blobs that have not been read for 30 days to the cool tier and move them back from cool to hot when they are accessed again. The policy itself is free and needs no code.
    fr: |
      Les règles de gestion du cycle de vie peuvent utiliser l'heure du dernier accès à un objet blob une fois le suivi de l'heure d'accès activé sur le compte. Une règle peut déplacer vers le niveau froid (Cool) les objets blob non lus depuis 30 jours et les ramener du niveau froid (Cool) au niveau chaud (Hot) lorsqu'ils sont de nouveau consultés. La stratégie elle-même est gratuite et ne demande aucun code.
  options:
    b:
      en: The last modified time does not change when an image is read, so popular images would be moved to the cool tier and would never come back.
      fr: "L'heure de dernière modification ne change pas quand une image est lue : des images populaires seraient déplacées vers le niveau froid (Cool) et n'en reviendraient jamais."
    c:
      en: Custom code could change tiers, but it has to be written, scheduled, monitored and maintained, and it needs its own way of knowing when each image was last read.
      fr: "Du code personnalisé pourrait changer les niveaux, mais il faut l'écrire, le planifier, le superviser et le maintenir, et il lui faut son propre moyen de savoir quand chaque image a été lue pour la dernière fois."
    d:
      en: The default tier applies to every blob without an explicit tier, including the images that are read every day, and nothing brings an image back to the hot tier.
      fr: "Le niveau par défaut s'applique à tous les objets blob sans niveau explicite, y compris les images lues chaque jour, et rien ne ramène une image au niveau chaud (Hot)."
references:
  - title: Azure Blob Storage lifecycle management overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview
