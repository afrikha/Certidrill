id: az305-2c-int-elt-raw-lake
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum collects 4 TB of clickstream data in JSON files every day. Adatum plans to build an analytics platform in Azure.

    You need to recommend a data integration approach. The solution must meet the following requirements:

    - The daily load must not be slowed down by transformations.
    - The raw data must remain available to data scientists for uses that aren't known yet.
    - The transformations must run on compute that scales out with the data volume.

    What should you recommend?
  fr: |
    Adatum collecte chaque jour 4 To de données de parcours de navigation dans des fichiers JSON. Adatum prévoit de créer une plateforme d'analytique dans Azure.

    Vous devez recommander une approche d'intégration de données. La solution doit répondre aux exigences suivantes :

    - Le chargement quotidien ne doit pas être ralenti par des transformations.
    - Les données brutes doivent rester disponibles pour les scientifiques des données, pour des usages qui ne sont pas encore connus.
    - Les transformations doivent s'exécuter sur un calcul dont la capacité augmente avec le volume de données.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Transform the files with SSIS packages on a server, and then load the results into an Azure Synapse Analytics dedicated SQL pool.", fr: "Transformer les fichiers avec des packages SSIS sur un serveur, puis charger les résultats dans un pool SQL dédié Azure Synapse Analytics." } }
    - { id: b, text: { en: "Load the files unchanged into Azure Data Lake Storage, and then transform them in the lake with Azure Databricks.", fr: "Charger les fichiers tels quels dans Azure Data Lake Storage, puis les transformer dans le lac avec Azure Databricks." } }
    - { id: c, text: { en: "Aggregate the files with mapping data flows during the load, and then store only the aggregates in Azure SQL Database.", fr: "Agréger les fichiers avec des flux de données de mappage pendant le chargement, puis ne stocker que les agrégats dans Azure SQL Database." } }
    - { id: d, text: { en: "Send the records to Azure Event Hubs, and then store only the windowed totals computed by Azure Stream Analytics.", fr: "Envoyer les enregistrements à Azure Event Hubs, puis ne stocker que les totaux par fenêtre calculés par Azure Stream Analytics." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      This is extract, load, transform (ELT): the raw files land in the data lake first, so the load is a plain copy, and the transformations run afterward on a Spark engine that scales out. The untouched raw data stays in the lake for the data scientists.
    fr: |
      Il s'agit d'une approche extraction, chargement, transformation (ELT) : les fichiers bruts arrivent d'abord dans le lac de données, le chargement se réduit donc à une copie, et les transformations s'exécutent ensuite sur un moteur Spark à mise à l'échelle horizontale. Les données brutes intactes restent dans le lac pour les scientifiques des données.
  options:
    a:
      en: This is ETL on a dedicated engine. The transformation happens before the load on a single server that doesn't scale out, and the raw files never reach Azure.
      fr: C'est de l'ETL sur un moteur dédié. La transformation a lieu avant le chargement, sur un serveur unique sans mise à l'échelle horizontale, et les fichiers bruts n'arrivent jamais dans Azure.
    c:
      en: Mapping data flows scale out, but transforming during the load and keeping only aggregates discards the raw data that the data scientists need.
      fr: Les flux de données de mappage se mettent à l'échelle, mais transformer pendant le chargement et ne garder que des agrégats fait perdre les données brutes dont les scientifiques des données ont besoin.
    d:
      en: Stream processing that stores only windowed totals also discards the raw records, and it addresses a low-latency need that Adatum doesn't have.
      fr: Un traitement de flux qui ne stocke que des totaux par fenêtre fait lui aussi perdre les enregistrements bruts, et il répond à un besoin de faible latence qu'Adatum n'a pas.
references:
  - title: Extract, transform, and load (ETL)
    url: https://learn.microsoft.com/en-us/azure/architecture/data-guide/relational-data/etl
