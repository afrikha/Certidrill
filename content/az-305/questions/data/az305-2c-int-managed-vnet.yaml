id: az305-2c-int-managed-vnet
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has an Azure subscription that contains an Azure SQL database named **db1** and an Azure Data Lake Storage account named **stlitware**. Public network access is disabled on both resources.

    You plan to deploy an Azure Data Factory instance that reads db1, transforms the data, and writes the results to stlitware.

    You need to recommend an integration runtime. The solution must meet the following requirements:

    - The transformations must be built as mapping data flows.
    - Data Factory must connect to db1 and stlitware through private endpoints.
    - The data engineering team must not deploy or maintain virtual machines or virtual networks.

    What should you include in the recommendation?
  fr: |
    Litware dispose d'un abonnement Azure qui contient une base de données Azure SQL nommée **db1** et un compte Azure Data Lake Storage nommé **stlitware**. L'accès réseau public est désactivé sur les deux ressources.

    Vous prévoyez de déployer une instance Azure Data Factory qui lit db1, transforme les données et écrit les résultats dans stlitware.

    Vous devez recommander un runtime d'intégration. La solution doit répondre aux exigences suivantes :

    - Les transformations doivent être créées sous forme de flux de données de mappage.
    - Data Factory doit se connecter à db1 et à stlitware par des points de terminaison privés.
    - L'équipe d'ingénierie des données ne doit ni déployer ni maintenir de machines virtuelles ou de réseaux virtuels.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "A self-hosted integration runtime on an Azure virtual machine, in a virtual network that has private endpoints", fr: "Un runtime d'intégration auto-hébergé sur une machine virtuelle Azure, dans un réseau virtuel doté de points de terminaison privés" } }
    - { id: b, text: { en: "An Azure-SSIS integration runtime joined to a virtual network that has private endpoints", fr: "Un runtime d'intégration Azure-SSIS joint à un réseau virtuel doté de points de terminaison privés" } }
    - { id: c, text: { en: "An Azure integration runtime in a managed virtual network, with managed private endpoints", fr: "Un runtime d'intégration Azure dans un réseau virtuel managé, avec des points de terminaison privés managés" } }
    - { id: d, text: { en: "An Azure integration runtime outside a virtual network, with the data factory's managed identity", fr: "Un runtime d'intégration Azure hors réseau virtuel, avec l'identité managée de la fabrique de données" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Mapping data flows run only on an Azure integration runtime. When that runtime is created in a Data Factory managed virtual network, it reaches db1 and stlitware through managed private endpoints, and Microsoft operates the network: the team has no virtual network and no virtual machine to look after.
    fr: |
      Les flux de données de mappage ne s'exécutent que sur un runtime d'intégration Azure. Créé dans un réseau virtuel managé de Data Factory, ce runtime atteint db1 et stlitware par des points de terminaison privés managés, et Microsoft exploite le réseau : l'équipe n'a ni réseau virtuel ni machine virtuelle à gérer.
  options:
    a:
      en: A self-hosted integration runtime can copy data over private endpoints, but it doesn't run mapping data flows, and the team would have to deploy and patch the virtual machine and its network.
      fr: Un runtime d'intégration auto-hébergé peut copier des données par des points de terminaison privés, mais il n'exécute pas les flux de données de mappage, et l'équipe devrait déployer et mettre à jour la machine virtuelle et son réseau.
    b:
      en: The Azure-SSIS integration runtime executes SSIS packages, not mapping data flows, and joining it to a virtual network means that the team manages that network.
      fr: Le runtime d'intégration Azure-SSIS exécute des packages SSIS, pas des flux de données de mappage, et le joindre à un réseau virtuel oblige l'équipe à gérer ce réseau.
    d:
      en: A managed identity authenticates the data factory but doesn't change the network path. Without a managed virtual network, the Azure integration runtime uses the public endpoints, which are disabled.
      fr: Une identité managée authentifie la fabrique de données, mais ne change pas le chemin réseau. Sans réseau virtuel managé, le runtime d'intégration Azure passe par les points de terminaison publics, qui sont désactivés.
references:
  - title: Integration runtime in Azure Data Factory
    url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-integration-runtime
  - title: Azure Data Factory managed virtual network
    url: https://learn.microsoft.com/en-us/azure/data-factory/managed-virtual-network-private-endpoint
