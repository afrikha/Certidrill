id: az305-cs1a-report-immutability
objective: "2.2.4"
type: single
caseStudy: az305-cs1a-trey-research
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a solution to protect the analysis reports in the **reports** container. The solution must meet the storage requirements.

    What should you include in the recommendation?
  fr: |
    Vous devez recommander une solution pour protéger les rapports d'analyse du conteneur **reports**. La solution doit répondre aux exigences de stockage.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "A legal hold on the reports container", fr: "Une conservation légale sur le conteneur reports" } }
    - { id: b, text: { en: "A locked time-based retention policy on the reports container", fr: "Une stratégie de rétention limitée dans le temps, verrouillée, sur le conteneur reports" } }
    - { id: c, text: { en: "Blob versioning and blob soft delete on the storage account", fr: "Le contrôle de version des objets blob et la suppression réversible des objets blob sur le compte de stockage" } }
    - { id: d, text: { en: "A CanNotDelete resource lock on the storage account", fr: "Un verrou de ressource CanNotDelete sur le compte de stockage" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A time-based retention policy keeps the blobs in a write once, read many (WORM) state for a fixed interval: they can be read, but not overwritten or deleted, even by users who have administrative rights on the account. Once the policy is locked, it can't be deleted and its interval can't be shortened, only extended, which meets the 10-year requirement.
    fr: |
      Une stratégie de rétention limitée dans le temps maintient les objets blob dans un état WORM (write once, read many) pendant une durée fixe : ils restent lisibles, mais ne peuvent être ni remplacés ni supprimés, même par les utilisateurs qui ont des droits d'administration sur le compte. Une fois verrouillée, la stratégie ne peut plus être supprimée et sa durée ne peut plus être raccourcie, seulement prolongée, ce qui répond à l'exigence de 10 ans.
  options:
    a:
      en: A legal hold has no duration and can be cleared at any time by an authorized user, so the 10-year period isn't guaranteed.
      fr: Une conservation légale n'a pas de durée et peut être levée à tout moment par un utilisateur autorisé ; la durée de 10 ans n'est donc pas garantie.
    c:
      en: Versioning and soft delete help to recover from mistakes, but they don't prevent modifications or deletions and an administrator can turn them off.
      fr: Le contrôle de version et la suppression réversible aident à réparer des erreurs, mais ils n'empêchent ni les modifications ni les suppressions, et un administrateur peut les désactiver.
    d:
      en: A resource lock protects the storage account on the control plane; it doesn't stop blobs from being overwritten or deleted, and an owner can remove it.
      fr: Un verrou de ressource protège le compte de stockage sur le plan de contrôle ; il n'empêche pas de remplacer ou de supprimer des objets blob, et un propriétaire peut le retirer.
references:
  - title: Store business-critical blob data with immutable storage in a write once, read many (WORM) state
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview
