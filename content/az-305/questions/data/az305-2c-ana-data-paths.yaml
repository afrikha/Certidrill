id: az305-2c-ana-data-paths
objective: "2.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware is designing an analytics solution for the sensors of its production lines. The design separates a hot data path, a warm data path and a cold data path.

    You need to identify the data path that serves each requirement.

    Which data path should you identify for each requirement? To answer, drag the appropriate data paths to the correct requirements. Each data path may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware conçoit une solution d'analytique pour les capteurs de ses lignes de production. La conception distingue un chemin de données chaud, un chemin de données tiède et un chemin de données froid.

    Vous devez identifier le chemin de données qui répond à chaque exigence.

    Quel chemin de données devez-vous identifier pour chaque exigence ? Pour répondre, faites glisser les chemins de données appropriés vers les exigences correspondantes. Chaque chemin de données peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: hot, text: { en: "Hot path", fr: "Chemin chaud" } }
    - { id: warm, text: { en: "Warm path", fr: "Chemin tiède" } }
    - { id: cold, text: { en: "Cold path", fr: "Chemin froid" } }
  targets:
    - id: t1
      text: { en: "Raise an alert within one second when a vibration reading exceeds the safety threshold", fr: "Déclencher une alerte en moins d'une seconde lorsqu'un relevé de vibrations dépasse le seuil de sécurité" }
    - id: t2
      text: { en: "Rebuild the quality report every night from three years of stored readings", fr: "Reconstruire chaque nuit le rapport qualité à partir de trois ans de relevés stockés" }
    - id: t3
      text: { en: "Show supervisors production totals that are a few minutes old, from recent data kept in Azure SQL Database", fr: "Présenter aux superviseurs des totaux de production vieux de quelques minutes, à partir de données récentes conservées dans Azure SQL Database" }
    - id: t4
      text: { en: "Retrain a machine learning model every week on the complete history kept in Azure Data Lake Storage", fr: "Réentraîner chaque semaine un modèle de machine learning sur l'historique complet conservé dans Azure Data Lake Storage" }
answer:
  mapping: { t1: hot, t2: cold, t3: warm, t4: cold }
explanation:
  correct:
    en: |
      The hot path processes events as they arrive, for alerts and dashboards that need an answer within seconds or less. The warm path tolerates a short delay: the stream is aggregated in near real time and the recent results are kept in a store such as Azure SQL Database or Azure Cosmos DB. The cold path is batch processing over the complete history kept in long-term storage, which fits the nightly report and the weekly retraining.
    fr: |
      Le chemin chaud traite les événements à leur arrivée, pour des alertes et des tableaux de bord qui exigent une réponse en quelques secondes ou moins. Le chemin tiède tolère un court délai : le flux est agrégé en quasi-temps réel, et les résultats récents sont conservés dans un magasin comme Azure SQL Database ou Azure Cosmos DB. Le chemin froid est un traitement par lots sur l'historique complet conservé dans un stockage à long terme, ce qui correspond au rapport nocturne et au réentraînement hebdomadaire.
references:
  - title: Design strategies for hot, warm, and cold data paths
    url: https://learn.microsoft.com/en-us/training/modules/design-data-integration/7-design-strategy-for-hot-warm-cold-data-path
