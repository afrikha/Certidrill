id: az305-2b-blob-types
objective: "2.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys will store three kinds of data in Azure Blob Storage. You need to recommend a blob type for each kind of data.

    Which blob type should you recommend for each kind of data? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys stockera trois sortes de données dans Stockage Blob Azure. Vous devez recommander un type d'objet blob pour chaque sorte de données.

    Quel type d'objet blob devez-vous recommander pour chaque sorte de données ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Video files that are uploaded once, streamed to customers and later moved to cooler access tiers: [[video]]

      Audit logs to which virtual machines continuously add new records at the end of the file: [[logs]]

      Virtual hard disk (VHD) files that require random read and write access: [[vhd]]
    fr: |
      Fichiers vidéo chargés une seule fois, diffusés en continu aux clients, puis déplacés vers des niveaux d'accès plus froids : [[video]]

      Journaux d'audit auxquels des machines virtuelles ajoutent continuellement de nouveaux enregistrements en fin de fichier : [[logs]]

      Fichiers de disque dur virtuel (VHD) qui exigent un accès aléatoire en lecture et en écriture : [[vhd]]
  slots:
    - id: video
      options:
        - { id: block, text: { en: "Block blobs", fr: "Objets blob de blocs" } }
        - { id: append, text: { en: "Append blobs", fr: "Objets blob d'ajout" } }
        - { id: page, text: { en: "Page blobs", fr: "Objets blob de pages" } }
    - id: logs
      options:
        - { id: block, text: { en: "Block blobs", fr: "Objets blob de blocs" } }
        - { id: append, text: { en: "Append blobs", fr: "Objets blob d'ajout" } }
        - { id: page, text: { en: "Page blobs", fr: "Objets blob de pages" } }
    - id: vhd
      options:
        - { id: block, text: { en: "Block blobs", fr: "Objets blob de blocs" } }
        - { id: append, text: { en: "Append blobs", fr: "Objets blob d'ajout" } }
        - { id: page, text: { en: "Page blobs", fr: "Objets blob de pages" } }
answer:
  values: { video: block, logs: append, vhd: page }
explanation:
  correct:
    en: |
      Block blobs store text and binary data such as media files, and they are the only blob type whose access tier can be changed. Append blobs are optimized for append operations, such as logging data written by virtual machines. Page blobs store random-access files and are used for VHD files.
    fr: |
      Les objets blob de blocs stockent du texte et des données binaires comme des fichiers multimédias, et ce sont les seuls dont le niveau d'accès peut être modifié. Les objets blob d'ajout sont optimisés pour les opérations d'ajout, comme la journalisation de données écrites par des machines virtuelles. Les objets blob de pages stockent des fichiers à accès aléatoire et servent aux fichiers VHD.
references:
  - title: Introduction to Azure Blob Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-introduction
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
