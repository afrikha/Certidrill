id: az305-2b-disk-types-plan
objective: "2.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum is planning the managed disks of three Azure virtual machines. You need to recommend a disk type for each disk. The solution must meet each requirement at the lowest cost.

    Which disk type should you recommend for each disk? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum planifie les disques managés de trois machines virtuelles Azure. Vous devez recommander un type de disque pour chaque disque. La solution doit répondre à chaque exigence au coût le plus bas.

    Quel type de disque devez-vous recommander pour chaque disque ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Operating system disk of a production application server that needs high performance, low latency and zone-redundant storage (ZRS): [[os]]

      Data disk of a development web server that needs SSD storage at the lowest price: [[dev]]

      Data disk that holds infrequently accessed backup files at the lowest price: [[bak]]
    fr: |
      Disque de système d'exploitation d'un serveur d'applications de production qui exige des performances élevées, une faible latence et le stockage redondant interzone (ZRS) : [[os]]

      Disque de données d'un serveur web de développement qui exige un stockage SSD au prix le plus bas : [[dev]]

      Disque de données qui contient des fichiers de sauvegarde peu consultés, au prix le plus bas : [[bak]]
  slots:
    - id: os
      options:
        - { id: ultra, text: Ultra Disk }
        - { id: pv2, text: Premium SSD v2 }
        - { id: pssd, text: Premium SSD }
        - { id: hdd, text: Standard HDD }
    - id: dev
      options:
        - { id: pv2, text: Premium SSD v2 }
        - { id: pssd, text: Premium SSD }
        - { id: sssd, text: Standard SSD }
        - { id: hdd, text: Standard HDD }
    - id: bak
      options:
        - { id: pssd, text: Premium SSD }
        - { id: sssd, text: Standard SSD }
        - { id: hdd, text: Standard HDD }
answer:
  values: { os: pssd, dev: sssd, bak: hdd }
explanation:
  correct:
    en: |
      Premium SSD targets production workloads that need high performance and low latency, can be used as an operating system disk and supports ZRS. Standard SSD is the entry-level SSD for web servers, lightly used applications and development or test environments. Standard HDD is the least expensive type, intended for backups and noncritical, infrequently accessed data.
    fr: |
      Premium SSD vise les charges de travail de production qui exigent des performances élevées et une faible latence, peut servir de disque de système d'exploitation et prend en charge ZRS. Standard SSD est le SSD d'entrée de gamme pour les serveurs web, les applications peu sollicitées et les environnements de développement ou de test. Standard HDD est le type le moins coûteux, destiné aux sauvegardes et aux données non critiques peu consultées.
  options:
    ultra:
      en: Ultra Disks and Premium SSD v2 disks cannot be used as operating system disks and do not support ZRS.
      fr: "Les disques Ultra Disk et Premium SSD v2 ne peuvent pas servir de disque de système d'exploitation et ne prennent pas en charge ZRS."
    hdd:
      en: Standard HDD does not support ZRS and is not SSD storage, so it fits neither the production server nor the development web server.
      fr: "Standard HDD ne prend pas en charge ZRS et n'est pas un stockage SSD : il ne convient ni au serveur de production ni au serveur web de développement."
references:
  - title: Azure managed disk types
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types
  - title: Redundancy options for managed disks
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-redundancy
