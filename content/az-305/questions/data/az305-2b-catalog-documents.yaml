id: az305-2b-catalog-documents
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum is designing a new product catalog service. Each product is a JSON document whose attributes differ from one product category to another, and new attributes are added every month.

    You need to recommend a data store that meets the following requirements:

    - Store the documents without defining a schema in advance.
    - Query any attribute with a SQL-like language, without managing indexes.
    - Serve reads in less than 10 ms from several Azure regions.

    What should you recommend?
  fr: |
    Adatum conçoit un nouveau service de catalogue de produits. Chaque produit est un document JSON dont les attributs diffèrent d'une catégorie de produits à l'autre, et de nouveaux attributs sont ajoutés chaque mois.

    Vous devez recommander un magasin de données qui répond aux exigences suivantes :

    - Stocker les documents sans définir de schéma à l'avance.
    - Interroger n'importe quel attribut avec un langage de type SQL, sans gérer d'index.
    - Servir les lectures en moins de 10 ms depuis plusieurs régions Azure.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: Azure Cosmos DB for NoSQL
    - id: b
      text: Azure SQL Database
    - id: c
      text: { en: "Azure Blob Storage", fr: "Stockage Blob Azure" }
    - id: d
      text: { en: "Azure Table Storage", fr: "Stockage Table Azure" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Cosmos DB for NoSQL stores schema-free JSON documents, indexes their properties automatically and is queried with a SQL-like language. An account can be replicated to several regions, and reads are served in less than 10 ms at the 99th percentile.
    fr: |
      Azure Cosmos DB for NoSQL stocke des documents JSON sans schéma, indexe automatiquement leurs propriétés et s'interroge avec un langage de type SQL. Un compte peut être répliqué dans plusieurs régions, et les lectures sont servies en moins de 10 ms au 99e centile.
  options:
    b:
      en: A relational database relies on a schema defined in advance and on indexes that you design; attributes that change every month would require constant schema work.
      fr: "Une base de données relationnelle repose sur un schéma défini à l'avance et sur des index que vous concevez ; des attributs qui changent chaque mois imposeraient un travail constant sur le schéma."
    c:
      en: Blob Storage can hold JSON files, but it treats them as opaque objects and cannot query their attributes.
      fr: "Stockage Blob peut contenir des fichiers JSON, mais il les traite comme des objets opaques et ne peut pas interroger leurs attributs."
    d:
      en: Table Storage retrieves entities efficiently only by partition key and row key, and it offers neither automatic indexing of every property nor multi-region reads with a latency guarantee.
      fr: "Stockage Table ne récupère efficacement les entités que par clé de partition et clé de ligne, et n'offre ni l'indexation automatique de toutes les propriétés ni des lectures multirégions avec garantie de latence."
references:
  - title: Azure Cosmos DB documentation
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/
  - title: Consistency levels in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
