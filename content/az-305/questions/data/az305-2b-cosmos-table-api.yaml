id: az305-2b-cosmos-table-api
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a web application that stores customer preferences in Azure Table Storage. The application uses the Azure Tables SDK.

    Contoso plans to open the application to users in North America, Europe and Asia. You need to recommend a data store that meets the following requirements:

    - Replicate the data to an Azure region on each continent and serve reads from the nearest region.
    - Index every property of the entities automatically.
    - Minimize changes to the application code.

    What should you recommend?
  fr: |
    Contoso dispose d'une application web qui stocke les préférences des clients dans Stockage Table Azure. L'application utilise le SDK Azure Tables.

    Contoso prévoit d'ouvrir l'application à des utilisateurs en Amérique du Nord, en Europe et en Asie. Vous devez recommander un magasin de données qui répond aux exigences suivantes :

    - Répliquer les données dans une région Azure de chaque continent et servir les lectures depuis la région la plus proche.
    - Indexer automatiquement toutes les propriétés des entités.
    - Réduire au minimum les modifications du code de l'application.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: Azure Cosmos DB for NoSQL
    - id: b
      text: Azure Cosmos DB for Table
    - id: c
      text: { en: "Azure Table Storage in an RA-GZRS storage account", fr: "Stockage Table Azure dans un compte de stockage RA-GZRS" }
    - id: d
      text: Azure Cosmos DB for Apache Cassandra
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Cosmos DB for Table is compatible with the SDKs and tools written for Azure Table Storage, so the application needs little or no code change beyond its connection string. The account can be replicated to any Azure region, and every property of an entity is indexed by default.
    fr: |
      Azure Cosmos DB for Table est compatible avec les SDK et les outils écrits pour Stockage Table Azure : l'application ne demande que peu ou pas de modifications de code, en dehors de sa chaîne de connexion. Le compte peut être répliqué dans n'importe quelle région Azure, et toutes les propriétés d'une entité sont indexées par défaut.
  options:
    a:
      en: The API for NoSQL also offers global distribution and automatic indexing, but the data access code written for the Table API would have to be rewritten.
      fr: "L'API pour NoSQL offre aussi la distribution mondiale et l'indexation automatique, mais le code d'accès aux données écrit pour l'API Table devrait être réécrit."
    c:
      en: RA-GZRS adds a single read-only secondary region chosen by Azure, not a replica on each continent, and Table Storage does not index every property.
      fr: "RA-GZRS ajoute une seule région secondaire en lecture seule, choisie par Azure, et non un réplica sur chaque continent ; de plus, Stockage Table n'indexe pas toutes les propriétés."
    d:
      en: The API for Apache Cassandra targets applications that use CQL and Cassandra drivers, so the application would have to be rewritten.
      fr: "L'API pour Apache Cassandra s'adresse aux applications qui utilisent CQL et les pilotes Cassandra : l'application devrait être réécrite."
references:
  - title: What is Azure Cosmos DB for Table?
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/table/introduction
  - title: Frequently asked questions about Azure Cosmos DB for Table
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/table/faq
