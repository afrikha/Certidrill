id: az305-2b-file-share-design
objective: "2.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware needs two Azure file shares:

    - **Share1** will be mounted by Linux application servers that require POSIX permissions and case-sensitive file names.
    - **Share2** will store department documents for Windows users on HDD media. It must be replicated to a second Azure region and must cost as little as possible. Zone redundancy in the primary region is not required.

    You need to recommend a configuration for the shares.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware a besoin de deux partages de fichiers Azure :

    - **Share1** sera monté par des serveurs d'applications Linux qui exigent des autorisations POSIX et des noms de fichiers sensibles à la casse.
    - **Share2** stockera les documents des services de l'entreprise pour des utilisateurs Windows sur un support HDD. Il doit être répliqué dans une seconde région Azure et coûter le moins cher possible. La redondance de zone dans la région primaire n'est pas exigée.

    Vous devez recommander une configuration pour les partages.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Protocol of Share1: [[proto]]

      Storage account type for Share1: [[media]]

      Redundancy of Share2: [[red]]
    fr: |
      Protocole de Share1 : [[proto]]

      Type de compte de stockage pour Share1 : [[media]]

      Redondance de Share2 : [[red]]
  slots:
    - id: proto
      options:
        - { id: smb, text: SMB 3.1.1 }
        - { id: nfs3, text: NFS 3.0 }
        - { id: nfs41, text: NFS 4.1 }
    - id: media
      options:
        - { id: hdd, text: { en: "Standard general-purpose v2 (HDD)", fr: "Standard usage général v2 (HDD)" } }
        - { id: pbb, text: { en: "Premium block blobs (SSD)", fr: "Objets blob de blocs Premium (SSD)" } }
        - { id: ssd, text: { en: "Premium file shares (SSD)", fr: "Partages de fichiers Premium (SSD)" } }
    - id: red
      options:
        - { id: lrs, text: LRS }
        - { id: zrs, text: ZRS }
        - { id: grs, text: GRS }
        - { id: gzrs, text: GZRS }
answer:
  values: { proto: nfs41, media: ssd, red: grs }
explanation:
  correct:
    en: |
      Linux workloads that need POSIX permissions and case sensitivity use NFS file shares, and Azure Files implements NFS 4.1, which requires SSD media, that is, a premium file shares account. HDD file shares support LRS, ZRS, GRS and GZRS; GRS replicates to a secondary region without paying for zone redundancy in the primary region.
    fr: |
      Les charges de travail Linux qui ont besoin des autorisations POSIX et de la sensibilité à la casse utilisent des partages de fichiers NFS, et Azure Files implémente NFS 4.1, qui exige un support SSD, c'est-à-dire un compte de partages de fichiers Premium. Les partages de fichiers HDD prennent en charge LRS, ZRS, GRS et GZRS ; GRS réplique vers une région secondaire sans payer la redondance de zone dans la région primaire.
  options:
    smb: { en: "SMB shares do not provide the POSIX permission model required by the Linux servers.", fr: "Les partages SMB n'offrent pas le modèle d'autorisations POSIX exigé par les serveurs Linux." }
    nfs3: { en: "NFS 3.0 is offered by Azure Blob Storage, not by Azure Files.", fr: "NFS 3.0 est proposé par Stockage Blob Azure, pas par Azure Files." }
    hdd: { en: "NFS file shares are not supported on HDD media.", fr: "Les partages de fichiers NFS ne sont pas pris en charge sur un support HDD." }
    pbb: { en: "A premium block blobs account hosts blobs only, not file shares.", fr: "Un compte d'objets blob de blocs Premium n'héberge que des objets blob, pas des partages de fichiers." }
    zrs: { en: "LRS and ZRS keep the data in a single region.", fr: "LRS et ZRS conservent les données dans une seule région." }
    gzrs: { en: "GZRS also replicates to a second region, but adds zone redundancy that is not required and costs more.", fr: "GZRS réplique aussi vers une seconde région, mais ajoute une redondance de zone non exigée et plus coûteuse." }
references:
  - title: NFS Azure file shares
    url: https://learn.microsoft.com/en-us/azure/storage/files/files-nfs-protocol
  - title: Plan an Azure Files deployment
    url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-planning
