id: az305-2a-tier-dev-serverless
objective: "2.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    A development team of Contoso needs a 40 GB database in Azure SQL Database to test a new application. The database will be used for a few hours on some weekdays, at times that can't be predicted, and will be idle the rest of the time.

    You need to recommend a configuration that meets the following requirements:

    - Bill no compute while the database is idle.
    - Minimize cost. A storage latency of 5 to 10 ms is acceptable.

    A delay on the first connection after an idle period is acceptable.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une équipe de développement de Contoso a besoin d'une base de données Azure SQL Database de 40 Go pour tester une nouvelle application. La base de données sera utilisée quelques heures certains jours de semaine, à des moments imprévisibles, et restera inactive le reste du temps.

    Vous devez recommander une configuration qui répond aux exigences suivantes :

    - Ne facturer aucun calcul pendant que la base de données est inactive.
    - Réduire les coûts au minimum. Une latence de stockage de 5 à 10 ms est acceptable.

    Un délai lors de la première connexion après une période d'inactivité est acceptable.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Service tier: [[tier]]

      Compute tier: [[compute]]
    fr: |
      Niveau de service : [[tier]]

      Niveau de calcul : [[compute]]
  slots:
    - id: tier
      options:
        - { id: gp, text: General Purpose }
        - { id: bc, text: Business Critical }
        - { id: prem, text: Premium }
    - id: compute
      options:
        - { id: prov, text: { en: "Provisioned", fr: "Provisionné" } }
        - { id: sless, text: Serverless }
answer:
  values: { tier: gp, compute: sless }
explanation:
  correct:
    en: The serverless compute tier bills compute per second for what the database uses and pauses the database after a period of inactivity. While it is paused, only storage is billed. Serverless is offered in the vCore model, and General Purpose is its lowest-cost service tier, with the 5 to 10 ms storage latency that the team accepts.
    fr: Le niveau de calcul serverless facture le calcul à la seconde selon ce que la base de données utilise, et met la base de données en pause après une période d'inactivité. Pendant la pause, seul le stockage est facturé. Le serverless est proposé dans le modèle vCore, et General Purpose est son niveau de service le moins coûteux, avec la latence de stockage de 5 à 10 ms que l'équipe accepte.
  options:
    bc: { en: "Business Critical costs more for local SSD storage and extra replicas that a test database doesn't need, and it has no serverless compute tier.", fr: "Business Critical coûte plus cher pour un stockage SSD local et des réplicas supplémentaires dont une base de données de test n'a pas besoin, et il n'a pas de niveau de calcul serverless." }
    prem: { en: "Premium belongs to the DTU purchasing model, which has no serverless compute tier.", fr: "Premium appartient au modèle d'achat DTU, qui n'a pas de niveau de calcul serverless." }
    prov: { en: "Provisioned compute is billed per hour for the vCores configured, whether the database is used or not.", fr: "Le calcul provisionné est facturé à l'heure pour les vCores configurés, que la base de données soit utilisée ou non." }
references:
  - title: Serverless compute tier for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
