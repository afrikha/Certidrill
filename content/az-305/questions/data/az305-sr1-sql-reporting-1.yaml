series: az305-sr1-sql-reporting
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You recommend the Business Critical service tier with zone redundancy.
  fr: Vous recommandez le niveau de service Business Critical avec la redondance de zone.
body:
  solution:
    en: |
      You recommend creating DB1 in the **Business Critical** service tier with **zone redundancy** enabled. The reporting application connects with `ApplicationIntent=ReadOnly`.
    fr: |
      Vous recommandez de créer DB1 dans le niveau de service **Business Critical** avec la **redondance de zone** activée. L'application de création de rapports se connecte avec `ApplicationIntent=ReadOnly`.
answer: { value: true }
explanation:
  correct:
    en: |
      A Business Critical database is provisioned with a primary replica and secondary replicas, and read scale-out is enabled by default: connections that specify `ApplicationIntent=ReadOnly` are redirected to a read-only replica of the same database at no extra cost. With zone redundancy, the replicas are placed in different availability zones, so DB1 survives the loss of one zone. The tier supports up to 4 TB, which covers the expected 2 TB.
    fr: |
      Une base de données Business Critical est provisionnée avec un réplica principal et des réplicas secondaires, et la lecture à l'échelle (read scale-out) est activée par défaut : les connexions qui indiquent `ApplicationIntent=ReadOnly` sont redirigées vers un réplica en lecture seule de la même base de données, sans surcoût. Avec la redondance de zone, les réplicas sont placés dans des zones de disponibilité différentes : DB1 survit donc à la perte d'une zone. Le niveau accepte jusqu'à 4 To, ce qui couvre les 2 To prévus.
references:
  - title: Use read-only replicas to offload read-only query workloads
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/read-scale-out
  - title: Availability through redundancy - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/high-availability-sla-local-zone-redundancy
