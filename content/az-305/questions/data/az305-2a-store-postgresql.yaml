id: az305-2a-store-postgresql
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware runs a logistics application on on-premises Linux servers. The application stores its data in PostgreSQL and uses PostgreSQL-specific data types and PL/pgSQL functions.

    You need to recommend a database service in Azure that meets the following requirements:

    - Keep the PostgreSQL engine so that the application code isn't rewritten.
    - Have the platform apply patches and take backups.
    - Maintain a standby server in another availability zone that takes over if the primary server fails.

    What should you recommend?
  fr: |
    Litware exécute une application de logistique sur des serveurs Linux locaux. L'application stocke ses données dans PostgreSQL et utilise des types de données propres à PostgreSQL ainsi que des fonctions PL/pgSQL.

    Vous devez recommander un service de base de données dans Azure qui répond aux exigences suivantes :

    - Conserver le moteur PostgreSQL afin de ne pas réécrire le code de l'application.
    - Laisser la plateforme appliquer les mises à jour correctives et effectuer les sauvegardes.
    - Maintenir dans une autre zone de disponibilité un serveur de secours qui prend le relais en cas de défaillance du serveur principal.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Azure Database for PostgreSQL flexible server", fr: "Azure Database for PostgreSQL (serveur flexible)" }
    - id: b
      text: { en: "PostgreSQL on Azure virtual machines in two availability zones", fr: "PostgreSQL sur des machines virtuelles Azure dans deux zones de disponibilité" }
    - id: c
      text: { en: "A zone-redundant database in Azure SQL Database", fr: "Une base de données redondante interzone dans Azure SQL Database" }
    - id: d
      text: { en: "Azure Database for MySQL flexible server", fr: "Azure Database for MySQL (serveur flexible)" }
answer: { optionId: a }
explanation:
  correct:
    en: Azure Database for PostgreSQL flexible server is the managed PostgreSQL service. The engine is the open-source one, so the data types and functions keep working, while Azure handles patching and automated backups. Its zone-redundant high availability keeps a synchronously replicated standby server in another availability zone, ready to take over after a failover.
    fr: Azure Database for PostgreSQL (serveur flexible) est le service PostgreSQL managé. Le moteur est le moteur open source, donc les types de données et les fonctions continuent de fonctionner, tandis qu'Azure se charge des mises à jour correctives et des sauvegardes automatiques. Sa haute disponibilité redondante interzone maintient dans une autre zone de disponibilité un serveur de secours répliqué de façon synchrone, prêt à prendre le relais après un basculement.
  options:
    b:
      en: Virtual machines keep the engine, but Litware would have to patch the operating system and PostgreSQL, script the backups and build the replication and failover itself.
      fr: Des machines virtuelles conservent le moteur, mais Litware devrait mettre à jour le système d'exploitation et PostgreSQL, écrire les scripts de sauvegarde et construire lui-même la réplication et le basculement.
    c:
      en: Azure SQL Database runs the SQL Server engine. PL/pgSQL functions and PostgreSQL data types would have to be rewritten.
      fr: Azure SQL Database exécute le moteur SQL Server. Il faudrait réécrire les fonctions PL/pgSQL et les types de données PostgreSQL.
    d:
      en: This is the managed service for the MySQL engine, which isn't compatible with PostgreSQL code.
      fr: Il s'agit du service managé du moteur MySQL, qui n'est pas compatible avec le code PostgreSQL.
references:
  - title: What is Azure Database for PostgreSQL flexible server?
    url: https://learn.microsoft.com/en-us/azure/postgresql/overview
