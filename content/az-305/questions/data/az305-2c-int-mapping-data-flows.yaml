id: az305-2c-int-mapping-data-flows
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware uses Azure Data Factory to load sales files into Azure Data Lake Storage. Business analysts must now join, aggregate and clean the files before the data is published.

    You need to recommend how to build the transformations. The solution must meet the following requirements:

    - The analysts can't write Spark, Python or SQL code.
    - The transformations must scale out without a cluster that Proseware creates or manages.
    - The transformations must run as steps of the existing pipelines.

    What should you include in the recommendation?
  fr: |
    Proseware utilise Azure Data Factory pour charger des fichiers de ventes dans Azure Data Lake Storage. Des analystes métier doivent désormais joindre, agréger et nettoyer les fichiers avant la publication des données.

    Vous devez recommander la façon de créer les transformations. La solution doit répondre aux exigences suivantes :

    - Les analystes ne savent pas écrire de code Spark, Python ou SQL.
    - Les transformations doivent se mettre à l'échelle horizontalement sans cluster que Proseware crée ou gère.
    - Les transformations doivent s'exécuter comme des étapes des pipelines existants.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "Azure Databricks notebook activities", fr: "Des activités de notebook Azure Databricks" } }
    - { id: b, text: { en: "Azure HDInsight Hive activities", fr: "Des activités Hive Azure HDInsight" } }
    - { id: c, text: { en: "Mapping data flows", fr: "Des flux de données de mappage" } }
    - { id: d, text: { en: "Azure Function activities", fr: "Des activités Azure Function" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Mapping data flows are transformations that are designed visually, without code. Data Factory runs them as pipeline activities on Spark clusters that the service starts, scales and stops itself, so Proseware has no cluster to operate.
    fr: |
      Les flux de données de mappage sont des transformations conçues visuellement, sans code. Data Factory les exécute comme des activités de pipeline sur des clusters Spark que le service démarre, met à l'échelle et arrête lui-même : Proseware n'a aucun cluster à exploiter.
  options:
    a:
      en: A notebook activity runs code that someone must write in Python, Scala or SQL, in an Azure Databricks workspace whose clusters Proseware configures.
      fr: Une activité de notebook exécute du code que quelqu'un doit écrire en Python, Scala ou SQL, dans un espace de travail Azure Databricks dont Proseware configure les clusters.
    b:
      en: A Hive activity runs HiveQL scripts on an HDInsight cluster, which means code to write and a cluster to manage.
      fr: Une activité Hive exécute des scripts HiveQL sur un cluster HDInsight, ce qui implique du code à écrire et un cluster à gérer.
    d:
      en: An Azure Function activity calls custom code that developers write and maintain; it isn't a visual transformation tool.
      fr: Une activité Azure Function appelle du code personnalisé que des développeurs écrivent et maintiennent ; ce n'est pas un outil de transformation visuel.
references:
  - title: Mapping data flows in Azure Data Factory
    url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-data-flow-overview
