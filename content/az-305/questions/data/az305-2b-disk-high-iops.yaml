id: az305-2b-disk-high-iops
objective: "2.2.3"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Woodgrove Bank is deploying a transaction-processing database on an Azure virtual machine. The data disk must deliver 150,000 IOPS, and administrators must be able to change its IOPS and throughput without restarting the virtual machine.

    You need to recommend a disk type for the data disk.

    Which disk type should you recommend?
  fr: |
    Woodgrove Bank déploie une base de données de traitement transactionnel sur une machine virtuelle Azure. Le disque de données doit fournir 150 000 IOPS, et les administrateurs doivent pouvoir modifier ses IOPS et son débit sans redémarrer la machine virtuelle.

    Vous devez recommander un type de disque pour le disque de données.

    Quel type de disque devez-vous recommander ?
body:
  options:
    - { id: a, text: Standard SSD }
    - { id: b, text: Premium SSD }
    - { id: c, text: Premium SSD v2 }
    - { id: d, text: Ultra Disk }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Ultra Disk is the only managed disk type that exceeds 80,000 IOPS: it scales up to 400,000 IOPS per disk and targets top-tier databases and transaction-heavy workloads. Its IOPS and throughput can be changed at runtime without detaching the disk or restarting the virtual machine.
    fr: |
      Ultra Disk est le seul type de disque managé qui dépasse 80 000 IOPS : il atteint 400 000 IOPS par disque et vise les bases de données de premier plan et les charges de travail à fortes transactions. Ses IOPS et son débit peuvent être modifiés à l'exécution, sans détacher le disque ni redémarrer la machine virtuelle.
  options:
    a:
      en: A Standard SSD disk is limited to 6,000 IOPS and targets web servers and development or test workloads.
      fr: "Un disque Standard SSD est limité à 6 000 IOPS et vise les serveurs web et les charges de travail de développement ou de test."
    b:
      en: A Premium SSD disk is limited to 20,000 IOPS.
      fr: "Un disque Premium SSD est limité à 20 000 IOPS."
    c:
      en: Premium SSD v2 performance can also be adjusted without downtime, but a disk is limited to 80,000 IOPS.
      fr: "Les performances d'un disque Premium SSD v2 peuvent aussi être ajustées sans interruption, mais un disque est limité à 80 000 IOPS."
references:
  - title: Azure managed disk types
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types
