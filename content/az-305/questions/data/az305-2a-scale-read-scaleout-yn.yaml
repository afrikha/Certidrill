id: az305-2a-scale-read-scaleout-yn
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank wants to use read scale-out in Azure SQL Database to offload read-only queries from the primary replica of several databases.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank souhaite utiliser la lecture à l'échelle (read scale-out) dans Azure SQL Database pour décharger le réplica principal de plusieurs bases de données de leurs requêtes en lecture seule.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A database in the General Purpose service tier can route read-only connections to a built-in secondary replica.
        fr: Une base de données au niveau de service General Purpose peut router les connexions en lecture seule vers un réplica secondaire intégré.
    - id: s2
      text:
        en: A session that is connected to a read-only replica might not see a change that was just committed on the primary replica.
        fr: Une session connectée à un réplica en lecture seule peut ne pas voir une modification qui vient d'être validée sur le réplica principal.
    - id: s3
      text:
        en: A database in the Hyperscale service tier offers read scale-out as soon as it has at least one secondary replica.
        fr: Une base de données au niveau de service Hyperscale offre la lecture à l'échelle dès qu'elle possède au moins un réplica secondaire.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Read scale-out exists in the Premium, Business Critical and Hyperscale service tiers. Basic, Standard and General Purpose databases have no readable replica. Read-only replicas are updated asynchronously, so a change committed on the primary can be invisible on the replica for a short time. In Hyperscale, the feature is available when at least one secondary replica has been added.
    fr: La lecture à l'échelle existe aux niveaux de service Premium, Business Critical et Hyperscale. Les bases de données Basic, Standard et General Purpose n'ont pas de réplica lisible. Les réplicas en lecture seule sont mis à jour de façon asynchrone, donc une modification validée sur le réplica principal peut rester invisible sur le réplica pendant un court instant. En Hyperscale, la fonctionnalité est disponible dès qu'au moins un réplica secondaire a été ajouté.
references:
  - title: Use read-only replicas to offload read-only query workloads
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/read-scale-out
