id: az305-2b-tiering-plan
objective: "2.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware stores three data sets as block blobs in a standard general-purpose v2 storage account that uses GRS. You need to recommend an access tier for each data set. The solution must minimize costs.

    Which access tier should you recommend for each data set? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware stocke trois jeux de données sous forme d'objets blob de blocs dans un compte de stockage standard usage général v2 qui utilise GRS. Vous devez recommander un niveau d'accès pour chaque jeu de données. La solution doit réduire les coûts au minimum.

    Quel niveau d'accès devez-vous recommander pour chaque jeu de données ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Product images that the website displays thousands of times per day: [[images]]

      Customer invoices that are opened occasionally and must then be displayed immediately: [[invoices]]

      Tax records that are kept for 10 years and almost never read, for which a retrieval delay of 24 hours is acceptable: [[tax]]
    fr: |
      Images de produits que le site web affiche des milliers de fois par jour : [[images]]

      Factures clients ouvertes occasionnellement et qui doivent alors s'afficher immédiatement : [[invoices]]

      Documents fiscaux conservés 10 ans et presque jamais lus, pour lesquels un délai de récupération de 24 heures est acceptable : [[tax]]
  slots:
    - id: images
      options:
        - { id: hot, text: { en: "Hot", fr: "Niveau chaud (Hot)" } }
        - { id: cool, text: { en: "Cool", fr: "Niveau froid (Cool)" } }
        - { id: archive, text: { en: "Archive", fr: "Niveau archive (Archive)" } }
    - id: invoices
      options:
        - { id: hot, text: { en: "Hot", fr: "Niveau chaud (Hot)" } }
        - { id: cool, text: { en: "Cool", fr: "Niveau froid (Cool)" } }
        - { id: archive, text: { en: "Archive", fr: "Niveau archive (Archive)" } }
    - id: tax
      options:
        - { id: hot, text: { en: "Hot", fr: "Niveau chaud (Hot)" } }
        - { id: cool, text: { en: "Cool", fr: "Niveau froid (Cool)" } }
        - { id: archive, text: { en: "Archive", fr: "Niveau archive (Archive)" } }
answer:
  values: { images: hot, invoices: cool, tax: archive }
explanation:
  correct:
    en: |
      The hot tier has the highest storage price but the lowest access price, which suits data that is read constantly. The cool tier lowers the storage price for infrequently accessed data that must stay online and readable within milliseconds. The archive tier has the lowest storage price for data that is rarely read and tolerates a rehydration delay of up to 15 hours; it is supported with GRS.
    fr: |
      Le niveau chaud (Hot) a le prix de stockage le plus élevé mais le prix d'accès le plus bas, ce qui convient à des données lues en permanence. Le niveau froid (Cool) réduit le prix de stockage de données peu consultées qui doivent rester en ligne et lisibles en quelques millisecondes. Le niveau archive (Archive) offre le prix de stockage le plus bas pour des données rarement lues qui tolèrent un délai de réhydratation pouvant atteindre 15 heures ; il est pris en charge avec GRS.
  options:
    archive:
      en: Archived blobs are offline, so the archive tier cannot serve the images or the invoices, which must be displayed immediately.
      fr: "Les objets blob archivés sont hors connexion : le niveau archive (Archive) ne peut pas servir les images ni les factures, qui doivent s'afficher immédiatement."
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
  - title: Blob rehydration from the archive tier
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/archive-rehydrate-overview
