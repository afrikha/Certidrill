id: az305-2c-int-shir-onprem
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an on-premises datacenter that hosts a SQL Server instance named **SQL1**. Contoso has an Azure subscription that contains an Azure Data Lake Storage account. The datacenter has no VPN or ExpressRoute connection to Azure.

    You plan to use Azure Data Factory to copy 40 tables from SQL1 to the storage account every night.

    You need to recommend an integration runtime for the copy. The solution must meet the following requirements:

    - The firewall of the datacenter must not allow any inbound connection from the internet.
    - No new network connection must be deployed between the datacenter and Azure.

    What should you include in the recommendation?
  fr: |
    Contoso possède un centre de données local qui héberge une instance SQL Server nommée **SQL1**. Contoso dispose d'un abonnement Azure qui contient un compte Azure Data Lake Storage. Le centre de données n'a aucune connexion VPN ni ExpressRoute vers Azure.

    Vous prévoyez d'utiliser Azure Data Factory pour copier chaque nuit 40 tables de SQL1 vers le compte de stockage.

    Vous devez recommander un runtime d'intégration pour la copie. La solution doit répondre aux exigences suivantes :

    - Le pare-feu du centre de données ne doit autoriser aucune connexion entrante depuis Internet.
    - Aucune nouvelle connexion réseau ne doit être déployée entre le centre de données et Azure.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "An Azure integration runtime that uses automatic region resolution", fr: "Un runtime d'intégration Azure avec résolution automatique de la région" } }
    - { id: b, text: { en: "A self-hosted integration runtime installed on a server in the datacenter", fr: "Un runtime d'intégration auto-hébergé installé sur un serveur du centre de données" } }
    - { id: c, text: { en: "An Azure-SSIS integration runtime provisioned in the region of the storage account", fr: "Un runtime d'intégration Azure-SSIS provisionné dans la région du compte de stockage" } }
    - { id: d, text: { en: "An Azure integration runtime provisioned in a managed virtual network", fr: "Un runtime d'intégration Azure provisionné dans un réseau virtuel managé" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A self-hosted integration runtime runs on a machine inside the private network, next to the data store, and performs the copy from there. It only opens outbound HTTPS connections to Azure, so the firewall needs no inbound rule and no VPN or ExpressRoute circuit is required.
    fr: |
      Un runtime d'intégration auto-hébergé s'exécute sur une machine du réseau privé, au plus près du magasin de données, et réalise la copie depuis cet emplacement. Il n'ouvre que des connexions HTTPS sortantes vers Azure : le pare-feu n'a besoin d'aucune règle entrante, et ni VPN ni circuit ExpressRoute ne sont nécessaires.
  options:
    a:
      en: The Azure integration runtime runs in Azure and reaches data stores through their public endpoints; it has no line of sight to a server inside the datacenter.
      fr: Le runtime d'intégration Azure s'exécute dans Azure et atteint les magasins de données par leurs points de terminaison publics ; il n'a aucune visibilité directe sur un serveur situé dans le centre de données.
    c:
      en: The Azure-SSIS integration runtime executes SQL Server Integration Services packages. It would also need a virtual network connected to the datacenter to reach SQL1.
      fr: Le runtime d'intégration Azure-SSIS exécute des packages SQL Server Integration Services. Il lui faudrait en outre un réseau virtuel connecté au centre de données pour atteindre SQL1.
    d:
      en: A managed virtual network gives the Azure integration runtime private endpoints to Azure data stores. It doesn't extend into the on-premises network.
      fr: Un réseau virtuel managé donne au runtime d'intégration Azure des points de terminaison privés vers des magasins de données Azure. Il ne s'étend pas au réseau local.
references:
  - title: Integration runtime in Azure Data Factory
    url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-integration-runtime
  - title: Create and configure a self-hosted integration runtime
    url: https://learn.microsoft.com/en-us/azure/data-factory/create-self-hosted-integration-runtime
