id: az305-2b-container-blob-recovery
objective: "2.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam stores design files as block blobs in a standard general-purpose v2 storage account that has a flat namespace.

    You need to recommend a data protection solution that meets the following requirements:

    - If a container is deleted by mistake, it can be restored with its content for 30 days.
    - Each time a blob is overwritten, its previous state is kept automatically and can be restored.

    Which two features should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam stocke des fichiers de conception sous forme d'objets blob de blocs dans un compte de stockage standard usage général v2 doté d'un espace de noms plat.

    Vous devez recommander une solution de protection des données qui répond aux exigences suivantes :

    - Si un conteneur est supprimé par erreur, il peut être restauré avec son contenu pendant 30 jours.
    - Chaque fois qu'un objet blob est écrasé, son état précédent est conservé automatiquement et peut être restauré.

    Quelles sont les deux fonctionnalités à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Blob versioning", fr: "Le contrôle de version des objets blob" }
    - id: b
      text: { en: "A CanNotDelete lock on the storage account", fr: "Un verrou CanNotDelete sur le compte de stockage" }
    - id: c
      text: { en: "Read-access geo-redundant storage (RA-GRS)", fr: "Le stockage géoredondant avec accès en lecture (RA-GRS)" }
    - id: d
      text: { en: "Container soft delete", fr: "La suppression réversible de conteneur" }
    - id: e
      text: { en: "An encryption scope on each container", fr: "Une étendue de chiffrement sur chaque conteneur" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Container soft delete keeps a deleted container and its content during a retention period of 1 to 365 days, during which the container can be restored. Blob versioning automatically keeps the previous version each time a blob is overwritten, and a previous version can be copied back as the current version.
    fr: |
      La suppression réversible de conteneur conserve un conteneur supprimé et son contenu pendant une période de rétention de 1 à 365 jours, durant laquelle le conteneur peut être restauré. Le contrôle de version des objets blob conserve automatiquement la version précédente chaque fois qu'un objet blob est écrasé, et une version précédente peut être recopiée comme version actuelle.
  options:
    b: { en: "A resource lock protects the storage account against deletion; it does not protect its containers or blobs.", fr: "Un verrou de ressource protège le compte de stockage contre la suppression ; il ne protège ni ses conteneurs ni ses objets blob." }
    c: { en: "Geo-replication copies deletions and overwrites to the secondary region; it is not a way to go back to an earlier state.", fr: "La géoréplication copie les suppressions et les écrasements dans la région secondaire ; ce n'est pas un moyen de revenir à un état antérieur." }
    e: { en: "An encryption scope defines the key that encrypts a container or a blob; it keeps no earlier state.", fr: "Une étendue de chiffrement définit la clé qui chiffre un conteneur ou un objet blob ; elle ne conserve aucun état antérieur." }
references:
  - title: Soft delete for containers
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-container-overview
  - title: Blob versioning
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/versioning-overview
