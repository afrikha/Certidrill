id: az305-2c-ana-serverless-adhoc
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank stores 3 TB of Parquet files in an Azure Data Lake Storage account. At the end of each month, finance analysts run a few T-SQL queries on the files. Nothing queries the files during the rest of the month.

    You need to recommend an analytics solution for the analysts. The solution must meet the following requirements:

    - The files must be queried where they are, without being loaded into another store.
    - Woodgrove Bank must pay only when queries run.
    - No compute resource must be provisioned or resized.

    What should you recommend?
  fr: |
    Woodgrove Bank stocke 3 To de fichiers Parquet dans un compte Azure Data Lake Storage. À la fin de chaque mois, des analystes financiers exécutent quelques requêtes T-SQL sur les fichiers. Rien n'interroge les fichiers le reste du mois.

    Vous devez recommander une solution d'analytique pour les analystes. La solution doit répondre aux exigences suivantes :

    - Les fichiers doivent être interrogés là où ils se trouvent, sans être chargés dans un autre magasin.
    - Woodgrove Bank ne doit payer que lorsque des requêtes s'exécutent.
    - Aucune ressource de calcul ne doit être provisionnée ni redimensionnée.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An Azure Synapse Analytics dedicated SQL pool", fr: "Un pool SQL dédié Azure Synapse Analytics" } }
    - { id: b, text: { en: "An Azure SQL Database Hyperscale database", fr: "Une base de données Azure SQL Database Hyperscale" } }
    - { id: c, text: { en: "An Azure Data Explorer cluster", fr: "Un cluster Azure Data Explorer" } }
    - { id: d, text: { en: "An Azure Synapse Analytics serverless SQL pool", fr: "Un pool SQL serverless Azure Synapse Analytics" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Every Azure Synapse workspace has a built-in serverless SQL pool that queries Parquet, Delta Lake and delimited text files in the data lake in place with T-SQL. There is nothing to provision, and the cost depends on the amount of data that each query processes, so a month without queries costs nothing for compute.
    fr: |
      Chaque espace de travail Azure Synapse comporte un pool SQL serverless intégré qui interroge sur place, en T-SQL, les fichiers Parquet, Delta Lake et texte délimité du lac de données. Il n'y a rien à provisionner, et le coût dépend de la quantité de données traitées par chaque requête : un mois sans requête ne coûte donc rien en calcul.
  options:
    a:
      en: A dedicated SQL pool is provisioned compute, sized in data warehouse units and billed while it runs, and the data is normally loaded into its tables first.
      fr: Un pool SQL dédié est un calcul provisionné, dimensionné en Data Warehouse Units et facturé tant qu'il fonctionne, et les données sont normalement d'abord chargées dans ses tables.
    b:
      en: An Azure SQL database is provisioned compute, and the Parquet files would have to be loaded into its tables before being queried.
      fr: Une base de données Azure SQL est un calcul provisionné, et les fichiers Parquet devraient être chargés dans ses tables avant d'être interrogés.
    c:
      en: An Azure Data Explorer cluster is provisioned and billed while it runs, and it is designed for logs and telemetry queried with KQL.
      fr: Un cluster Azure Data Explorer est provisionné et facturé tant qu'il fonctionne, et il est conçu pour des journaux et de la télémétrie interrogés en KQL.
references:
  - title: Serverless SQL pool in Azure Synapse Analytics
    url: https://learn.microsoft.com/en-us/azure/synapse-analytics/sql/on-demand-workspace-overview
