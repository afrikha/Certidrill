id: az305-cs3b-sensitive-columns
objective: "2.1.4"
type: dragdrop
caseStudy: az305-cs3b-woodgrove
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a data protection feature of Azure SQL Database for each security requirement of LoansDB.

    Which feature should you recommend for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une fonctionnalité de protection des données d'Azure SQL Database pour chaque exigence de sécurité de LoansDB.

    Quelle fonctionnalité devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ae, text: Always Encrypted }
    - { id: ddm, text: { en: "Dynamic data masking", fr: "Masquage dynamique des données" } }
    - { id: ledger, text: { en: "Ledger", fr: "Registre (Ledger)" } }
    - { id: rls, text: { en: "Row-level security", fr: "Sécurité au niveau des lignes" } }
    - { id: tde, text: { en: "Transparent data encryption with a customer-managed key", fr: "Transparent Data Encryption (TDE) avec une clé gérée par le client" } }
  targets:
    - id: ssn
      text: { en: "Help desk agents see only the last four digits of the Social Security numbers", fr: "Les agents du support technique ne voient que les quatre derniers chiffres des numéros de sécurité sociale" }
    - id: bank
      text: { en: "Database administrators can never read the bank account numbers in clear text", fr: "Les administrateurs de bases de données ne peuvent jamais lire les numéros de compte bancaire en clair" }
    - id: files
      text: { en: "The files and backups are encrypted with a key that the company controls and can revoke", fr: "Les fichiers et les sauvegardes sont chiffrés avec une clé que l'entreprise contrôle et peut révoquer" }
answer:
  mapping: { ssn: ddm, bank: ae, files: tde }
explanation:
  correct:
    en: "Dynamic data masking hides part of a column in the result sets returned to nonprivileged users, such as the help desk agents, without changing the stored data or the queries. Always Encrypted encrypts the column in the client driver with a key that is never given to the database engine, so even database administrators see only ciphertext. Transparent data encryption protects the data files and the backups, and a customer-managed key in Azure Key Vault lets Woodgrove Bank rotate and revoke the key."
    fr: "Le masquage dynamique des données cache une partie d'une colonne dans les jeux de résultats renvoyés aux utilisateurs sans privilèges, comme les agents du support technique, sans modifier les données stockées ni les requêtes. Always Encrypted chiffre la colonne dans le pilote client avec une clé qui n'est jamais remise au moteur de base de données : même les administrateurs de bases de données ne voient que du texte chiffré. Transparent Data Encryption protège les fichiers de données et les sauvegardes, et une clé gérée par le client dans Azure Key Vault permet à Woodgrove Bank de renouveler et de révoquer la clé."
  options:
    ledger:
      en: "Ledger gives cryptographic proof that data hasn't been tampered with. It hides nothing and encrypts nothing."
      fr: "Le registre (Ledger) apporte la preuve cryptographique que les données n'ont pas été falsifiées. Il ne cache rien et ne chiffre rien."
    rls:
      en: "Row-level security filters which rows a user can read. The agents must see the rows, with part of one column hidden."
      fr: "La sécurité au niveau des lignes filtre les lignes qu'un utilisateur peut lire. Les agents doivent voir les lignes, avec une partie d'une colonne cachée."
references:
  - title: An overview of Azure SQL Database and SQL Managed Instance security capabilities
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/security-overview
