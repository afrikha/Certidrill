id: az305-2b-cosmos-continuous-backup
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs an Azure Cosmos DB for NoSQL account that uses the default backup configuration. After an incident in which a script deleted a container, the company defines the following requirements:

    - Restore a deleted or corrupted container to any point in time within the previous 14 days.
    - Start the restore without opening a support request.
    - Minimize costs.

    You need to recommend a backup configuration for the account.

    What should you recommend?
  fr: |
    Proseware exploite un compte Azure Cosmos DB for NoSQL qui utilise la configuration de sauvegarde par défaut. Après un incident au cours duquel un script a supprimé un conteneur, l'entreprise définit les exigences suivantes :

    - Restaurer un conteneur supprimé ou corrompu à n'importe quel instant des 14 derniers jours.
    - Lancer la restauration sans ouvrir de demande de support.
    - Réduire les coûts au minimum.

    Vous devez recommander une configuration de sauvegarde pour le compte.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Periodic backup mode with a backup interval of 1 hour", fr: "Le mode de sauvegarde périodique avec un intervalle de sauvegarde de 1 heure" }
    - id: b
      text: { en: "Periodic backup mode with a retention period of 14 days", fr: "Le mode de sauvegarde périodique avec une période de rétention de 14 jours" }
    - id: c
      text: { en: "Continuous backup mode with the 7-day tier", fr: "Le mode de sauvegarde continue avec le niveau 7 jours" }
    - id: d
      text: { en: "Continuous backup mode with the 30-day tier", fr: "Le mode de sauvegarde continue avec le niveau 30 jours" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Continuous backup offers self-service point-in-time restore of an account, a database or a container to any moment of its retention window. The 30-day tier is the least expensive tier that covers 14 days.
    fr: |
      La sauvegarde continue offre la restauration à un instant dans le passé en libre-service d'un compte, d'une base de données ou d'un conteneur, à n'importe quel moment de sa fenêtre de rétention. Le niveau 30 jours est le niveau le moins coûteux qui couvre 14 jours.
  options:
    a:
      en: Periodic backup, the default mode, takes full backups at an interval and is restored by opening a support request; a restore returns the data of a backup, not of any point in time.
      fr: "La sauvegarde périodique, mode par défaut, effectue des sauvegardes complètes à intervalles réguliers et se restaure en ouvrant une demande de support ; une restauration renvoie les données d'une sauvegarde, pas d'un instant quelconque."
    b:
      en: A longer retention keeps more periodic backups, but a restore still requires a support request and is limited to the backup times.
      fr: "Une rétention plus longue conserve davantage de sauvegardes périodiques, mais une restauration exige toujours une demande de support et se limite aux heures des sauvegardes."
    c:
      en: The 7-day tier has no backup storage charge, but its restore window is shorter than the 14 days required.
      fr: "Le niveau 7 jours n'entraîne pas de frais de stockage de sauvegarde, mais sa fenêtre de restauration est plus courte que les 14 jours exigés."
references:
  - title: Continuous backup with point-in-time restore in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/continuous-backup-restore-introduction
  - title: Periodic backup and restore in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/periodic-backup-restore-introduction
