id: az305-2a-tier-no-resume-delay
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum hosts the database of a customer portal in Azure SQL Database. The database is 120 GB. Its compute usage stays below 1 vCore most of the time and jumps to 8 vCores several times a day, at random, for less than one hour a day in total. At night the database often receives no request for several hours.

    You need to recommend a service tier and a compute tier that meet the following requirements:

    - Every connection, including the first one after an idle period, must be served without a resume delay.
    - Compute must follow the load without any intervention.
    - Minimize cost.

    What should you recommend?
  fr: |
    Adatum héberge la base de données d'un portail client dans Azure SQL Database. La base de données fait 120 Go. Son utilisation du calcul reste inférieure à 1 vCore la plupart du temps et grimpe à 8 vCores plusieurs fois par jour, de façon aléatoire, pendant moins d'une heure par jour au total. La nuit, la base de données ne reçoit souvent aucune requête pendant plusieurs heures.

    Vous devez recommander un niveau de service et un niveau de calcul qui répondent aux exigences suivantes :

    - Chaque connexion, y compris la première après une période d'inactivité, doit être servie sans délai de reprise.
    - Le calcul doit suivre la charge sans aucune intervention.
    - Réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "General Purpose, provisioned compute with 8 vCores", fr: "General Purpose, calcul provisionné avec 8 vCores" }
    - id: b
      text: { en: "General Purpose, serverless compute with an auto-pause delay of one hour", fr: "General Purpose, calcul serverless avec un délai de mise en pause automatique d'une heure" }
    - id: c
      text: { en: "General Purpose, serverless compute with auto-pause disabled", fr: "General Purpose, calcul serverless avec la mise en pause automatique désactivée" }
    - id: d
      text: { en: "Business Critical, provisioned compute with 8 vCores", fr: "Business Critical, calcul provisionné avec 8 vCores" }
answer: { optionId: c }
explanation:
  correct:
    en: Serverless compute scales automatically between a minimum and a maximum number of vCores and is billed per second for what is used, which costs much less than 8 provisioned vCores when the load is usually under 1 vCore. Disabling auto-pause keeps the database online, so no connection waits for a resume. The price to pay is the minimum vCores, which are billed even when the database is idle.
    fr: Le calcul serverless se met à l'échelle automatiquement entre un nombre minimal et un nombre maximal de vCores et se facture à la seconde selon l'utilisation, ce qui coûte bien moins cher que 8 vCores provisionnés quand la charge est le plus souvent inférieure à 1 vCore. Désactiver la mise en pause automatique maintient la base de données en ligne, donc aucune connexion n'attend une reprise. En contrepartie, les vCores minimum sont facturés même quand la base de données est inactive.
  options:
    a:
      en: Eight provisioned vCores remove the resume delay but are billed every hour for a peak that lasts less than one hour a day, and they don't follow the load.
      fr: Huit vCores provisionnés suppriment le délai de reprise, mais sont facturés chaque heure pour un pic qui dure moins d'une heure par jour, et ils ne suivent pas la charge.
    b:
      en: With auto-pause enabled, the database pauses during the idle hours of the night, and the first connection afterward waits for the database to resume.
      fr: Avec la mise en pause automatique activée, la base de données se met en pause pendant les heures d'inactivité de la nuit, et la première connexion suivante attend la reprise de la base de données.
    d:
      en: Business Critical costs more than General Purpose for replicas and local storage that no requirement asks for, and its compute is provisioned.
      fr: Business Critical coûte plus cher que General Purpose pour des réplicas et un stockage local qu'aucune exigence ne demande, et son calcul est provisionné.
references:
  - title: Serverless compute tier for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
