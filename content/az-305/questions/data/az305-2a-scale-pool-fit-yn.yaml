id: az305-2a-scale-pool-fit-yn
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has several groups of single databases in Azure SQL Database. Every database is sized for its own peak. The databases of each group are on the same logical server.

    You are evaluating whether moving each group into one elastic pool would reduce cost while keeping the performance of the databases.

    For each of the following groups, select **Yes** if an elastic pool is an appropriate recommendation. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso possède plusieurs groupes de bases de données uniques Azure SQL Database. Chaque base de données est dimensionnée pour son propre pic. Les bases de données de chaque groupe se trouvent sur le même serveur logique.

    Vous évaluez si le déplacement de chaque groupe dans un pool élastique réduirait les coûts tout en conservant les performances des bases de données.

    Pour chacun des groupes suivants, sélectionnez **Oui** si un pool élastique est une recommandation appropriée. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Eight databases that each use between 70 % and 85 % of their compute all day long
        fr: Huit bases de données qui utilisent chacune entre 70 % et 85 % de leur calcul toute la journée
    - id: s2
      text:
        en: Thirty databases that each use 5 % of their compute on average and peak for a few minutes at different times of the day
        fr: Trente bases de données qui utilisent chacune 5 % de leur calcul en moyenne et connaissent un pic de quelques minutes à des moments différents de la journée
    - id: s3
      text:
        en: Twenty-five databases that are idle most of the day and all reach their peak together, every morning at 09:00
        fr: Vingt-cinq bases de données inactives la plupart de la journée et qui atteignent toutes leur pic en même temps, chaque matin à 9 h
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: A pool pays off when the databases have a low average utilization and infrequent peaks that don't coincide, as in the second group. Then the pool can be far smaller than the sum of the peaks. Databases with a sustained medium-to-high utilization leave nothing to share. When all the databases peak together, the pool must be sized for the sum of the peaks, so nothing is saved. In the DTU model the pool would even cost more, because an eDTU is priced 1.5 times a DTU of a single database.
    fr: Un pool est rentable quand les bases de données ont une utilisation moyenne faible et des pics peu fréquents qui ne coïncident pas, comme dans le deuxième groupe. Le pool peut alors être bien plus petit que la somme des pics. Des bases de données à l'utilisation durablement moyenne à élevée ne laissent rien à partager. Quand toutes les bases de données culminent en même temps, le pool doit être dimensionné pour la somme des pics, donc rien n'est économisé. Dans le modèle DTU, le pool coûterait même plus cher, car une eDTU est facturée 1,5 fois le prix d'une DTU de base de données unique.
references:
  - title: Elastic pools help you manage and scale multiple databases in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-pool-overview
