id: az305-2a-scale-sharding
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys operates a SaaS platform for 12,000 retailers on Azure SQL Database. The design forecast shows the following:

    - The total data volume will reach 300 TB.
    - The write throughput at peak exceeds what the largest single database can process.
    - The data of European retailers must be stored in Europe, and the data of American retailers in the United States.
    - Each transaction reads and writes the data of one retailer only.

    You need to recommend a scalability solution. The application must reach the database that holds a retailer's data, and capacity must be added as retailers join.

    What should you recommend?
  fr: |
    Tailspin Toys exploite une plateforme SaaS pour 12 000 détaillants dans Azure SQL Database. Les prévisions de conception montrent les éléments suivants :

    - Le volume total de données atteindra 300 To.
    - Le débit d'écriture en pic dépasse ce que la plus grande base de données unique peut traiter.
    - Les données des détaillants européens doivent être stockées en Europe, et celles des détaillants américains aux États-Unis.
    - Chaque transaction lit et écrit les données d'un seul détaillant.

    Vous devez recommander une solution de scalabilité. L'application doit atteindre la base de données qui contient les données d'un détaillant, et de la capacité doit pouvoir être ajoutée à mesure que des détaillants arrivent.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "One Hyperscale database with named replicas in each geography", fr: "Une base de données Hyperscale avec des réplicas nommés dans chaque zone géographique" }
    - id: b
      text: { en: "One Business Critical database with read scale-out and active geo-replication", fr: "Une base de données Business Critical avec la lecture à l'échelle et la géoréplication active" }
    - id: c
      text: { en: "Several databases sharded by retailer, with a shard map and the Elastic Database client library", fr: "Plusieurs bases de données partitionnées par détaillant, avec une carte de partitions (shard map) et la bibliothèque cliente de base de données élastique" }
    - id: d
      text: { en: "One elastic pool that contains a database per table of the application", fr: "Un pool élastique qui contient une base de données par table de l'application" }
answer: { optionId: c }
explanation:
  correct:
    en: Sharding distributes identically structured data across many databases, which scales out both storage and writes and lets each shard be placed in the region its retailers require. The shard map records which database holds each retailer, and the Elastic Database client library uses it to route every request. Because a transaction touches a single retailer, it stays inside one shard, the case in which sharding works best.
    fr: Le partitionnement (sharding) répartit des données de structure identique sur de nombreuses bases de données, ce qui met à l'échelle le stockage comme les écritures et permet de placer chaque partition dans la région exigée par ses détaillants. La carte de partitions enregistre quelle base de données contient chaque détaillant, et la bibliothèque cliente de base de données élastique s'en sert pour router chaque requête. Comme une transaction ne touche qu'un seul détaillant, elle reste dans une seule partition, le cas où le partitionnement fonctionne le mieux.
  options:
    a:
      en: A Hyperscale database stores at most 128 TB, and its named replicas are read-only replicas in the region of the primary. All the writes would still go to one primary.
      fr: Une base de données Hyperscale stocke au plus 128 To, et ses réplicas nommés sont des réplicas en lecture seule dans la région du réplica principal. Toutes les écritures iraient encore vers un seul réplica principal.
    b:
      en: Business Critical is limited to 4 TB. Read scale-out and geo-replicas add readers, not write capacity, and they copy all the data to every region.
      fr: Business Critical est limité à 4 To. La lecture à l'échelle et les géoréplicas ajoutent des lecteurs, pas de capacité d'écriture, et ils copient toutes les données dans chaque région.
    d:
      en: Splitting by table breaks the transactions of a retailer across databases, and a pool shares compute. It doesn't raise the write limit or place data by geography.
      fr: Un découpage par table éclate les transactions d'un détaillant entre plusieurs bases de données, et un pool partage le calcul. Il ne relève pas la limite d'écriture et ne place pas les données par zone géographique.
references:
  - title: Scale out with Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-scale-introduction
  - title: Building scalable cloud databases
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-database-client-library
