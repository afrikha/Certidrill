id: az305-2b-consistency-multiwrite
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys runs a booking platform on an Azure Cosmos DB for NoSQL account. The account is configured with multiple write regions: West Europe, East US and Southeast Asia.

    You need to recommend a default consistency level for the account. The solution must meet the following requirements:

    - Each region must keep accepting writes locally.
    - A read in any region must never lag behind the latest writes by more than 10 minutes.

    Which consistency level should you recommend?
  fr: |
    Tailspin Toys exploite une plateforme de réservation sur un compte Azure Cosmos DB for NoSQL. Le compte est configuré avec plusieurs régions d'écriture : West Europe, East US et Southeast Asia.

    Vous devez recommander un niveau de cohérence par défaut pour le compte. La solution doit répondre aux exigences suivantes :

    - Chaque région doit continuer d'accepter les écritures localement.
    - Une lecture dans n'importe quelle région ne doit jamais avoir plus de 10 minutes de retard sur les dernières écritures.

    Quel niveau de cohérence devez-vous recommander ?
body:
  options:
    - { id: a, text: Strong }
    - { id: b, text: Session }
    - { id: c, text: Consistent prefix }
    - { id: d, text: Bounded staleness }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Bounded staleness guarantees that the lag between regions stays below K versions of an item or a time interval T, whichever is reached first. In a multi-region account T can be set from 300 seconds, so a 10-minute bound can be enforced. It is also the strongest level that an account with multiple write regions can use.
    fr: |
      Bounded staleness garantit que le retard entre régions reste inférieur à K versions d'un élément ou à un intervalle de temps T, selon la première limite atteinte. Dans un compte multirégion, T se règle à partir de 300 secondes : une borne de 10 minutes peut donc être imposée. C'est aussi le niveau le plus fort utilisable par un compte à plusieurs régions d'écriture.
  options:
    a:
      en: Strong consistency is not available for an account configured with multiple write regions; keeping local writes in every region excludes it.
      fr: "La cohérence Strong n'est pas disponible pour un compte configuré avec plusieurs régions d'écriture ; conserver les écritures locales dans chaque région l'exclut."
    b:
      en: Session consistency only guarantees that a client reads its own writes within its session; reads of other clients have no bounded delay.
      fr: "La cohérence Session garantit seulement qu'un client relit ses propres écritures dans sa session ; les lectures des autres clients n'ont pas de retard borné."
    c:
      en: Consistent prefix gives no upper limit on how far a region can lag behind the latest writes.
      fr: "Consistent prefix ne fixe aucune limite supérieure au retard d'une région sur les dernières écritures."
references:
  - title: Consistency levels in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
  - title: Multi-region writes in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/multi-region-writes
