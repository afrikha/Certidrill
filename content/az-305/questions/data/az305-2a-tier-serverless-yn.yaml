id: az305-2a-tier-serverless-yn
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum is reviewing the compute tier of its databases in Azure SQL Database and considers the serverless compute tier for some of them.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum passe en revue le niveau de calcul de ses bases de données Azure SQL Database et envisage le niveau de calcul serverless pour certaines d'entre elles.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The databases of an elastic pool can use the serverless compute tier.
        fr: Les bases de données d'un pool élastique peuvent utiliser le niveau de calcul serverless.
    - id: s2
      text:
        en: While a serverless database is paused, Adatum is billed for its storage but not for compute.
        fr: Pendant qu'une base de données serverless est en pause, Adatum est facturé pour son stockage, mais pas pour le calcul.
    - id: s3
      text:
        en: Auto-pause can be disabled on a serverless database so that the database stays online during idle periods.
        fr: La mise en pause automatique peut être désactivée sur une base de données serverless afin que celle-ci reste en ligne pendant les périodes d'inactivité.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Serverless is a compute tier of single databases. Elastic pools use provisioned compute. When a serverless database is paused, compute billing stops and only storage is charged. Auto-pause is optional. With auto-pause disabled the database keeps autoscaling between its minimum and maximum vCores and is always billed for at least the minimum.
    fr: Le serverless est un niveau de calcul des bases de données uniques. Les pools élastiques utilisent le calcul provisionné. Quand une base de données serverless est en pause, la facturation du calcul s'arrête et seul le stockage est facturé. La mise en pause automatique est facultative. Lorsqu'elle est désactivée, la base de données continue de se mettre à l'échelle automatiquement entre ses vCores minimum et maximum, et elle est toujours facturée au moins pour le minimum.
references:
  - title: Serverless compute tier for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
