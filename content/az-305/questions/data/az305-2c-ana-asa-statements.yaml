id: az305-2c-ana-asa-statements
objective: "2.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware receives telemetry from delivery trucks in an Azure IoT hub. A table of truck metadata is maintained in an Azure SQL database. Proseware plans to analyze the telemetry with an Azure Stream Analytics job.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware reçoit la télémétrie de camions de livraison dans un hub IoT Azure. Une table de métadonnées des camions est tenue à jour dans une base de données Azure SQL. Proseware prévoit d'analyser la télémétrie avec un travail Azure Stream Analytics.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The job can join the telemetry stream with the truck metadata table used as reference data.
        fr: Le travail peut joindre le flux de télémétrie à la table de métadonnées des camions, utilisée comme données de référence.
    - id: s2
      text:
        en: Proseware must provision a Spark cluster to run the job.
        fr: Proseware doit provisionner un cluster Spark pour exécuter le travail.
    - id: s3
      text:
        en: The same job can write aggregated results to an Azure SQL database and raw events to Azure Data Lake Storage.
        fr: Le même travail peut écrire des résultats agrégés dans une base de données Azure SQL et des événements bruts dans Azure Data Lake Storage.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Stream Analytics supports reference data inputs from Azure SQL Database or Blob Storage, which a query joins to the stream for lookups. The service is fully managed: capacity is expressed in streaming units and there is no cluster to create. A job can have several outputs, and one query can route different results to different outputs, such as Azure SQL Database and Azure Data Lake Storage.
    fr: |
      Stream Analytics prend en charge des entrées de données de référence issues d'Azure SQL Database ou du Stockage Blob, qu'une requête joint au flux pour des recherches. Le service est entièrement managé : la capacité s'exprime en unités de streaming, et il n'y a aucun cluster à créer. Un travail peut avoir plusieurs sorties, et une même requête peut diriger des résultats différents vers des sorties différentes, comme Azure SQL Database et Azure Data Lake Storage.
references:
  - title: Welcome to Azure Stream Analytics
    url: https://learn.microsoft.com/en-us/azure/stream-analytics/stream-analytics-introduction
  - title: Use reference data for lookups in Stream Analytics
    url: https://learn.microsoft.com/en-us/azure/stream-analytics/stream-analytics-use-reference-data
