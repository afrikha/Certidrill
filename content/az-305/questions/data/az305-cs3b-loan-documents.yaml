id: az305-cs3b-loan-documents
objective: "2.2.4"
type: dropdown
caseStudy: az305-cs3b-woodgrove
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a configuration for stloandocs. The solution must meet the document requirements and minimize costs.

    What should you recommend? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une configuration pour stloandocs. La solution doit satisfaire les exigences relatives aux documents et réduire les coûts au minimum.

    Que devez-vous recommander ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Redundancy of the storage account: [[redundancy]]

      Protection of the documents of a disputed loan: [[protection]]
    fr: |
      Redondance du compte de stockage : [[redundancy]]

      Protection des documents d'un prêt contesté : [[protection]]
  slots:
    - id: redundancy
      options:
        - { id: zrs, text: ZRS }
        - { id: gzrs, text: GZRS }
        - { id: ragrs, text: RA-GRS }
        - { id: ragzrs, text: RA-GZRS }
    - id: protection
      options:
        - { id: lock, text: { en: "A CanNotDelete lock on the storage account", fr: "Un verrou CanNotDelete sur le compte de stockage" } }
        - { id: hold, text: { en: "A legal hold", fr: "Une conservation légale" } }
        - { id: retention, text: { en: "A locked time-based retention policy", fr: "Une stratégie de rétention limitée dans le temps verrouillée" } }
        - { id: softdelete, text: { en: "Blob soft delete", fr: "La suppression réversible des objets blob" } }
answer:
  values: { redundancy: ragzrs, protection: hold }
explanation:
  correct:
    en: "RA-GZRS replicates the data synchronously across the availability zones of East US 2, so a zone failure causes no interruption, and asynchronously to the secondary region, whose endpoint is readable at any time without a failover. A legal hold keeps blobs in a write once, read many state with no end date. The documents can be read but not modified or deleted until the hold is explicitly cleared, which fits a dispute of unknown duration."
    fr: "RA-GZRS réplique les données de façon synchrone entre les zones de disponibilité d'East US 2, de sorte que la panne d'une zone ne cause aucune interruption, et de façon asynchrone vers la région secondaire, dont le point de terminaison est lisible à tout moment sans basculement. Une conservation légale maintient les objets blob dans un état WORM (write once, read many) sans date de fin. Les documents peuvent être lus, mais ni modifiés ni supprimés tant que la conservation n'est pas explicitement levée, ce qui convient à un litige de durée inconnue."
  options:
    zrs:
      en: "ZRS survives a zone failure but keeps no copy outside East US 2, so the documents can't be read during a regional outage."
      fr: "ZRS survit à la panne d'une zone mais ne garde aucune copie hors d'East US 2 : les documents ne peuvent donc pas être lus pendant une panne régionale."
    gzrs:
      en: "GZRS has the same copies as RA-GZRS, but the secondary region can't be read until an account failover has completed."
      fr: "GZRS possède les mêmes copies que RA-GZRS, mais la région secondaire ne peut pas être lue tant qu'un basculement du compte n'est pas terminé."
    ragrs:
      en: "RA-GRS offers a readable secondary region, but the copies of the primary region are in a single datacenter. A zone failure can interrupt access to the documents."
      fr: "RA-GRS offre une région secondaire lisible, mais les copies de la région primaire se trouvent dans un seul centre de données. La panne d'une zone peut interrompre l'accès aux documents."
    lock:
      en: "A resource lock acts on the control plane, on the storage account itself. It doesn't prevent anyone from overwriting or deleting blobs."
      fr: "Un verrou de ressource agit sur le plan de contrôle, sur le compte de stockage lui-même. Il n'empêche personne de remplacer ou de supprimer des objets blob."
    retention:
      en: "A time-based retention policy needs a retention interval that is fixed in advance, and once it is locked the interval can only be extended. It can't follow a dispute whose end isn't known."
      fr: "Une stratégie de rétention limitée dans le temps demande un intervalle de rétention fixé à l'avance, et une fois verrouillée, cet intervalle ne peut qu'être allongé. Elle ne peut pas suivre un litige dont la fin n'est pas connue."
    softdelete:
      en: "Soft delete lets you recover a deleted blob during a retention period. It doesn't prevent the modification or the deletion."
      fr: "La suppression réversible permet de récupérer un objet blob supprimé pendant une période de rétention. Elle n'empêche ni la modification ni la suppression."
references:
  - title: Azure Storage redundancy
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
  - title: Store business-critical blob data with immutable storage in a write once, read many (WORM) state
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview
