id: az305-2a-tier-purchasing-yn
objective: "2.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is choosing between the DTU and the vCore purchasing models for its Azure SQL workloads.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam hésite entre les modèles d'achat DTU et vCore pour ses charges de travail Azure SQL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In the vCore purchasing model, the storage of a database is sized independently of its number of vCores.
        fr: Dans le modèle d'achat vCore, le stockage d'une base de données se dimensionne indépendamment de son nombre de vCores.
    - id: s2
      text:
        en: Azure Hybrid Benefit reduces the price of a database in the DTU purchasing model.
        fr: Azure Hybrid Benefit réduit le prix d'une base de données dans le modèle d'achat DTU.
    - id: s3
      text:
        en: The Hyperscale service tier can be selected in the DTU purchasing model.
        fr: Le niveau de service Hyperscale peut être sélectionné dans le modèle d'achat DTU.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: The vCore model lets you choose compute and storage separately, whereas a DTU is a bundled measure of compute, storage and I/O. Azure Hybrid Benefit applies only to provisioned compute in the vCore model, not to the DTU model. The DTU model offers the Basic, Standard and Premium service tiers. Hyperscale, like General Purpose and Business Critical, is a vCore service tier.
    fr: Le modèle vCore permet de choisir séparément le calcul et le stockage, alors qu'une DTU est une mesure groupée de calcul, de stockage et d'E/S. Azure Hybrid Benefit ne s'applique qu'au calcul provisionné du modèle vCore, pas au modèle DTU. Le modèle DTU propose les niveaux de service Basic, Standard et Premium. Hyperscale, comme General Purpose et Business Critical, est un niveau de service vCore.
references:
  - title: Compare vCore and DTU-based purchasing models of Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/purchasing-models
