id: az305-2a-protect-ae-enclaves
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders stores patient records in Azure SQL Database. The LastName and BirthDate columns are confidential.

    You need to recommend a data protection solution that meets the following requirements:

    - Database administrators must be unable to read the two columns in plaintext.
    - The application must search LastName with pattern matching (`LIKE`) and filter BirthDate on a range of dates.
    - The searches must be evaluated by the database, without downloading the whole table to the application.

    What should you recommend?
  fr: |
    Northwind Traders stocke des dossiers de patients dans Azure SQL Database. Les colonnes LastName et BirthDate sont confidentielles.

    Vous devez recommander une solution de protection des données qui répond aux exigences suivantes :

    - Les administrateurs de base de données ne doivent pas pouvoir lire les deux colonnes en clair.
    - L'application doit rechercher dans LastName par correspondance de modèle (`LIKE`) et filtrer BirthDate sur une plage de dates.
    - Les recherches doivent être évaluées par la base de données, sans télécharger toute la table vers l'application.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Always Encrypted with deterministic encryption", fr: "Always Encrypted avec le chiffrement déterministe" }
    - id: b
      text: { en: "Always Encrypted with secure enclaves", fr: "Always Encrypted avec enclaves sécurisées" }
    - id: c
      text: { en: "Dynamic data masking with custom masks", fr: "Le masquage dynamique des données avec des masques personnalisés" }
    - id: d
      text: { en: "Transparent data encryption with a customer-managed key", fr: "Transparent Data Encryption avec une clé gérée par le client" }
answer: { optionId: b }
explanation:
  correct:
    en: Always Encrypted with secure enclaves lets the Database Engine run computations on encrypted columns inside a protected region of memory that administrators can't inspect. Pattern matching and range comparisons then work on the server while the data stays hidden from administrators.
    fr: Always Encrypted avec enclaves sécurisées permet au moteur de base de données d'exécuter des calculs sur des colonnes chiffrées à l'intérieur d'une région protégée de la mémoire que les administrateurs ne peuvent pas inspecter. La correspondance de modèle et les comparaisons de plages fonctionnent alors sur le serveur, tandis que les données restent cachées aux administrateurs.
  options:
    a:
      en: Without an enclave, deterministic encryption supports only equality comparisons. `LIKE` and range filters aren't possible.
      fr: Sans enclave, le chiffrement déterministe ne prend en charge que les comparaisons d'égalité. `LIKE` et les filtres de plage sont impossibles.
    c:
      en: Dynamic data masking leaves the data in plaintext in the database, and administrators see the unmasked values.
      fr: Le masquage dynamique des données laisse les données en clair dans la base de données, et les administrateurs voient les valeurs non masquées.
    d:
      en: Transparent data encryption protects the files at rest. An administrator who queries the table reads the plaintext.
      fr: Transparent Data Encryption protège les fichiers au repos. Un administrateur qui interroge la table lit le texte en clair.
references:
  - title: Always Encrypted with secure enclaves
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/encryption/always-encrypted-enclaves
