id: az305-2b-access-tier-facts
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware is defining a tiering strategy for block blobs that are stored in a standard general-purpose v2 storage account.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware définit une stratégie de hiérarchisation pour des objets blob de blocs stockés dans un compte de stockage standard usage général v2.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A blob that is moved to the cool tier and deleted 10 days later incurs an early deletion charge.
        fr: Un objet blob déplacé vers le niveau froid (Cool) puis supprimé 10 jours plus tard entraîne des frais de suppression anticipée.
    - id: s2
      text:
        en: The archive tier can be selected as the default access tier of the storage account.
        fr: Le niveau archive (Archive) peut être sélectionné comme niveau d'accès par défaut du compte de stockage.
    - id: s3
      text:
        en: A lifecycle management policy can rehydrate archived blobs to the cool tier.
        fr: Une stratégie de gestion du cycle de vie peut réhydrater des objets blob archivés vers le niveau froid (Cool).
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      In a general-purpose v2 account, the cool tier has a 30-day minimum retention: a blob deleted after 10 days is charged for the 20 remaining days. The default access tier of an account can be hot, cool or cold; archive is set only on individual blobs. Lifecycle management policies move blobs to cooler tiers and can bring them back from cool to hot, but they cannot rehydrate archived blobs; rehydration uses Copy Blob or Set Blob Tier.
    fr: |
      Dans un compte usage général v2, le niveau froid (Cool) impose une rétention minimale de 30 jours : un objet blob supprimé au bout de 10 jours est facturé pour les 20 jours restants. Le niveau d'accès par défaut d'un compte peut être chaud (Hot), froid (Cool) ou froid (Cold) ; le niveau archive (Archive) ne se définit que sur des objets blob individuels. Les stratégies de gestion du cycle de vie déplacent les objets blob vers des niveaux plus froids et peuvent les ramener du niveau froid (Cool) au niveau chaud (Hot), mais elles ne peuvent pas réhydrater des objets blob archivés ; la réhydratation utilise Copy Blob ou Set Blob Tier.
references:
  - title: Access tiers for blob data
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
  - title: Azure Blob Storage lifecycle management overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-overview
