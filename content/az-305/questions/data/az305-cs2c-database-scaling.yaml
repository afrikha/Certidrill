id: az305-cs2c-database-scaling
objective: "2.1.3"
type: dropdown
caseStudy: az305-cs2c-tailwind-traders
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a scalability solution for the store databases and for the reporting queries on db-orders. The solution must meet the database requirements and minimize costs.

    What should you include in the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution de scalabilité pour les bases de données de magasin et pour les requêtes de rapport sur db-orders. La solution doit respecter les exigences relatives aux bases de données et réduire les coûts au minimum.

    Que devez-vous inclure dans la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Store databases: [[stores]]

      Reporting queries on db-orders: [[reports]]
    fr: |
      Bases de données de magasin : [[stores]]

      Requêtes de rapport sur db-orders : [[reports]]
  slots:
    - id: stores
      options:
        - { id: single, text: { en: "Provisioned single databases sized for their peaks", fr: "Des bases de données uniques provisionnées, dimensionnées pour leurs pics" } }
        - { id: serverless, text: { en: "Serverless single databases with auto-pause", fr: "Des bases de données uniques serverless avec mise en pause automatique" } }
        - { id: pool, text: { en: "Databases in an elastic pool", fr: "Des bases de données dans un pool élastique" } }
    - id: reports
      options:
        - { id: georep, text: { en: "An active geo-replication secondary of db-orders", fr: "Une base secondaire de géoréplication active de db-orders" } }
        - { id: scaleup, text: { en: "A larger compute size for db-orders", fr: "Une taille de calcul supérieure pour db-orders" } }
        - { id: readscale, text: { en: "The read scale-out replica of db-orders", fr: "Le réplica de lecture à l'échelle (read scale-out) de db-orders" } }
        - { id: copy, text: { en: "A copy of db-orders that is refreshed every night", fr: "Une copie de db-orders actualisée chaque nuit" } }
answer:
  values: { stores: serverless, reports: readscale }
explanation:
  correct:
    en: Serverless is a compute tier for single databases that scales compute automatically with the load and bills per second for the compute used. After a period of inactivity the database pauses and only its storage is billed; it resumes at the next connection, with a delay that is accepted here. A Business Critical database includes a readable secondary replica at no extra cost; a reporting connection that declares a read-only intent is routed to this replica, so the reports no longer use the primary replica.
    fr: Serverless est un niveau de calcul pour bases de données uniques qui met le calcul à l'échelle automatiquement selon la charge et facture à la seconde le calcul utilisé. Après une période d'inactivité, la base se met en pause et seul son stockage est facturé ; elle reprend à la connexion suivante, avec un délai accepté ici. Une base de données Business Critical inclut un réplica secondaire lisible sans surcoût ; une connexion de rapport qui déclare une intention de lecture seule est acheminée vers ce réplica, et les rapports n'utilisent donc plus le réplica principal.
  options:
    single: { en: "Provisioned compute is billed per hour for the configured size, whether the store is open or closed.", fr: "Le calcul provisionné est facturé à l'heure pour la taille configurée, que le magasin soit ouvert ou fermé." }
    pool: { en: "An elastic pool is billed day and night for its provisioned resources, and it saves money only when the databases peak at different times; these stores are busy at the same hours.", fr: "Un pool élastique est facturé jour et nuit pour ses ressources provisionnées, et il n'est économique que si les bases ont leurs pics à des moments différents ; ces magasins sont actifs aux mêmes heures." }
    georep: { en: "A geo-replication secondary is a readable database, but it is an additional database to pay for.", fr: "Une base secondaire de géoréplication est lisible, mais c'est une base de données supplémentaire à payer." }
    scaleup: { en: "A larger compute size costs more, and the reports still run on the primary replica.", fr: "Une taille de calcul supérieure coûte plus cher, et les rapports s'exécutent toujours sur le réplica principal." }
    copy: { en: "A copy is another database to pay for, and its data is up to a day old.", fr: "Une copie est une autre base de données à payer, et ses données datent d'un jour au plus." }
references:
  - title: Serverless compute tier for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
  - title: Use read-only replicas to offload read-only query workloads
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/read-scale-out
