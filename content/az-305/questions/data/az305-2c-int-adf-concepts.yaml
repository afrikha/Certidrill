id: az305-2c-int-adf-concepts
objective: "2.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank plans to use Azure Data Factory to copy data from an on-premises Oracle database to Azure every night.

    You need to identify the Data Factory component that provides each capability of the design.

    Which component should you identify for each capability? To answer, drag the appropriate components to the correct capabilities. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit d'utiliser Azure Data Factory pour copier chaque nuit vers Azure les données d'une base de données Oracle locale.

    Vous devez identifier le composant Data Factory qui fournit chaque capacité de la conception.

    Quel composant devez-vous identifier pour chaque capacité ? Pour répondre, faites glisser les composants appropriés vers les capacités correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dataset, text: { en: "Dataset", fr: "Jeu de données" } }
    - { id: ir, text: { en: "Integration runtime", fr: "Runtime d'intégration" } }
    - { id: linked, text: { en: "Linked service", fr: "Service lié" } }
    - { id: dataflow, text: { en: "Mapping data flow", fr: "Flux de données de mappage" } }
    - { id: trigger, text: { en: "Trigger", fr: "Déclencheur" } }
  targets:
    - id: t1
      text: { en: "Holds the connection information that Data Factory needs to connect to the Oracle database", fr: "Contient les informations de connexion dont Data Factory a besoin pour se connecter à la base de données Oracle" }
    - id: t2
      text: { en: "Provides the compute that runs the copy close to the Oracle database", fr: "Fournit le calcul qui exécute la copie au plus près de la base de données Oracle" }
    - id: t3
      text: { en: "Determines when a run of the nightly pipeline starts", fr: "Détermine le moment où démarre une exécution du pipeline nocturne" }
answer:
  mapping: { t1: linked, t2: ir, t3: trigger }
explanation:
  correct:
    en: |
      A linked service works like a connection string: it defines how Data Factory connects to a data store or a compute service. The integration runtime is the compute infrastructure on which activities such as the copy run, here a self-hosted one near the database. A trigger decides when a pipeline run is started. A dataset only describes the structure of the data that an activity reads or writes, and a mapping data flow holds transformation logic.
    fr: |
      Un service lié joue le rôle d'une chaîne de connexion : il définit la façon dont Data Factory se connecte à un magasin de données ou à un service de calcul. Le runtime d'intégration est l'infrastructure de calcul sur laquelle s'exécutent les activités comme la copie, ici un runtime auto-hébergé proche de la base de données. Un déclencheur décide du moment où une exécution de pipeline démarre. Un jeu de données décrit seulement la structure des données qu'une activité lit ou écrit, et un flux de données de mappage contient une logique de transformation.
references:
  - title: What is Azure Data Factory?
    url: https://learn.microsoft.com/en-us/azure/data-factory/introduction
