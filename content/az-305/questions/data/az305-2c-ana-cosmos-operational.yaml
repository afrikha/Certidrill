id: az305-2c-ana-cosmos-operational
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys runs an e-commerce application that stores orders in an Azure Cosmos DB for NoSQL account with provisioned throughput. Tailspin Toys has standardized on Microsoft Fabric for analytics and reporting.

    You need to recommend a solution that lets analysts build reports on the orders. The solution must meet the following requirements:

    - The analytical queries must not consume the request units (RUs) provisioned for the application.
    - New and changed orders must be available to the analysts in near real time.
    - No extract, transform, load (ETL) pipeline or custom code must be developed or scheduled.

    What should you recommend?
  fr: |
    Tailspin Toys exécute une application de commerce électronique qui stocke les commandes dans un compte Azure Cosmos DB for NoSQL à débit approvisionné. Tailspin Toys a retenu Microsoft Fabric comme standard pour l'analytique et les rapports.

    Vous devez recommander une solution qui permet aux analystes de créer des rapports sur les commandes. La solution doit répondre aux exigences suivantes :

    - Les requêtes analytiques ne doivent pas consommer les unités de requête (RU) approvisionnées pour l'application.
    - Les commandes nouvelles et modifiées doivent être disponibles pour les analystes en quasi-temps réel.
    - Aucun pipeline d'extraction, de transformation et de chargement (ETL) ni aucun code personnalisé ne doit être développé ou planifié.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Connect the Power BI reports directly to the containers of the Azure Cosmos DB account.", fr: "Connecter directement les rapports Power BI aux conteneurs du compte Azure Cosmos DB." } }
    - { id: b, text: { en: "Copy the containers to Azure Data Lake Storage every hour with an Azure Data Factory pipeline.", fr: "Copier les conteneurs vers Azure Data Lake Storage toutes les heures avec un pipeline Azure Data Factory." } }
    - { id: c, text: { en: "Mirror the Azure Cosmos DB database in Microsoft Fabric, and build the reports on the mirrored data.", fr: "Mettre en miroir la base de données Azure Cosmos DB dans Microsoft Fabric, puis créer les rapports sur les données mises en miroir." } }
    - { id: d, text: { en: "Process the change feed with Azure Functions, and write the orders to an Azure SQL database.", fr: "Traiter le flux de modification avec Azure Functions, puis écrire les commandes dans une base de données Azure SQL." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Mirroring continuously replicates the Azure Cosmos DB data into OneLake in near real time, without any pipeline to build. It relies on the continuous backup of the account, and the replication doesn't consume the RUs allocated to the transactional workload. The reports then query the replicated copy in Fabric, not the containers.
    fr: |
      La mise en miroir réplique en continu les données Azure Cosmos DB dans OneLake, en quasi-temps réel et sans aucun pipeline à créer. Elle s'appuie sur la sauvegarde continue du compte, et la réplication ne consomme pas les RU allouées à la charge de travail transactionnelle. Les rapports interrogent ensuite la copie répliquée dans Fabric, pas les conteneurs.
  options:
    a:
      en: Reports connected to the containers send their queries to the transactional store. Each query is charged in request units against the throughput provisioned for the application.
      fr: Des rapports connectés aux conteneurs envoient leurs requêtes au magasin transactionnel. Chaque requête est facturée en unités de requête sur le débit approvisionné pour l'application.
    b:
      en: An hourly copy is an ETL pipeline to build and schedule, its reads consume request units, and the data is up to an hour old.
      fr: Une copie horaire est un pipeline ETL à créer et à planifier, ses lectures consomment des unités de requête, et les données peuvent dater d'une heure.
    d:
      en: A change feed processor is custom code to develop and operate, and reading the change feed uses the provisioned throughput like any other operation.
      fr: Un processeur de flux de modification est du code personnalisé à développer et à exploiter, et la lecture du flux de modification utilise le débit approvisionné comme toute autre opération.
references:
  - title: Mirroring Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db
