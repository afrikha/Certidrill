id: az305-2a-scale-techniques-dd
objective: "2.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware has three single databases in Azure SQL Database that no longer meet their performance or cost targets. Each problem must be solved with the simplest technique that removes it.

    Which technique should you recommend for each database? To answer, drag the appropriate techniques to the correct databases. Each technique may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware possède trois bases de données uniques Azure SQL Database qui n'atteignent plus leurs objectifs de performances ou de coût. Chaque problème doit être résolu par la technique la plus simple qui le supprime.

    Quelle technique devez-vous recommander pour chaque base de données ? Pour répondre, faites glisser les techniques appropriées vers les bases de données correspondantes. Chaque technique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: up, text: { en: "Scale up the compute size", fr: "Augmenter la taille de calcul (scale-up)" } }
    - { id: sless, text: { en: "Serverless compute tier", fr: "Niveau de calcul serverless" } }
    - { id: rso, text: { en: "Read scale-out", fr: "Lecture à l'échelle (read scale-out)" } }
    - { id: pool, text: { en: "Elastic pool", fr: "Pool élastique" } }
    - { id: shard, text: { en: "Sharding", fr: "Partitionnement (sharding)" } }
  targets:
    - id: t1
      text:
        en: "DB1, General Purpose with provisioned compute: the processor is saturated during a sales campaign that is planned two weeks every year"
        fr: "DB1, General Purpose avec calcul provisionné : le processeur est saturé pendant une campagne commerciale planifiée deux semaines par an"
    - id: t2
      text:
        en: "DB2, General Purpose with provisioned compute: the load varies at random during the day, with long periods of low activity, and compute must follow it without intervention"
        fr: "DB2, General Purpose avec calcul provisionné : la charge varie de façon aléatoire dans la journée, avec de longues périodes de faible activité, et le calcul doit la suivre sans intervention"
    - id: t3
      text:
        en: "DB3, Premium: dashboards that only read data compete with the transactions of the application"
        fr: "DB3, Premium : des tableaux de bord qui ne font que lire des données sont en concurrence avec les transactions de l'application"
answer:
  mapping: { t1: up, t2: sless, t3: rso }
explanation:
  correct:
    en: A known, temporary peak on one database is handled by changing its compute size for the campaign and scaling back afterward. The operation is online. A load that varies unpredictably is what the serverless compute tier is for, because it scales compute automatically between a minimum and a maximum. A Premium database has a readable secondary replica, so the dashboards can be sent to it with read scale-out.
    fr: Un pic connu et temporaire sur une base de données se traite en changeant sa taille de calcul pour la campagne, puis en revenant à la taille initiale. L'opération se fait en ligne. Une charge qui varie de façon imprévisible est le cas d'usage du niveau de calcul serverless, qui met le calcul à l'échelle automatiquement entre un minimum et un maximum. Une base de données Premium possède un réplica secondaire lisible, donc les tableaux de bord peuvent y être envoyés grâce à la lecture à l'échelle.
  options:
    pool: { en: "An elastic pool shares resources between many databases. It doesn't help a single database.", fr: "Un pool élastique partage des ressources entre de nombreuses bases de données. Il n'aide pas une base de données isolée." }
    shard: { en: "Sharding requires application changes and is justified only when one database can't hold the data or the writes.", fr: "Le partitionnement impose de modifier l'application et ne se justifie que lorsqu'une base de données ne peut plus contenir les données ou les écritures." }
references:
  - title: "Dynamically scale database resources with minimal downtime - Azure SQL Database & Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/scale-resources
