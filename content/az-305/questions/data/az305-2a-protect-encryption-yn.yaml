id: az305-2a-protect-encryption-yn
objective: "2.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum is reviewing how the data of its databases in Azure SQL Database is protected. The databases use transparent data encryption, dynamic data masking on some columns and Always Encrypted on other columns.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum passe en revue la protection des données de ses bases de données Azure SQL Database. Les bases de données utilisent Transparent Data Encryption, le masquage dynamique des données sur certaines colonnes et Always Encrypted sur d'autres colonnes.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Transparent data encryption encrypts the backups of a database as well as its data files and log files.
        fr: Transparent Data Encryption chiffre les sauvegardes d'une base de données ainsi que ses fichiers de données et ses fichiers journaux.
    - id: s2
      text:
        en: Dynamic data masking prevents a member of the db_owner role from seeing the original values of a masked column.
        fr: Le masquage dynamique des données empêche un membre du rôle db_owner de voir les valeurs d'origine d'une colonne masquée.
    - id: s3
      text:
        en: With Always Encrypted, column values are encrypted and decrypted by the client driver, outside the Database Engine.
        fr: Avec Always Encrypted, les valeurs des colonnes sont chiffrées et déchiffrées par le pilote client, en dehors du moteur de base de données.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Transparent data encryption encrypts the database, its backups and its transaction log at rest. Dynamic data masking only changes what non-privileged users see in query results. Administrators and users with the UNMASK permission still read the real values. Always Encrypted performs encryption and decryption in the client driver, so the Database Engine never handles the plaintext keys.
    fr: Transparent Data Encryption chiffre au repos la base de données, ses sauvegardes et son journal des transactions. Le masquage dynamique des données ne change que ce que les utilisateurs non privilégiés voient dans les résultats des requêtes. Les administrateurs et les utilisateurs dotés de l'autorisation UNMASK lisent toujours les valeurs réelles. Always Encrypted effectue le chiffrement et le déchiffrement dans le pilote client, donc le moteur de base de données ne manipule jamais les clés en clair.
references:
  - title: Transparent data encryption for SQL Database and SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/transparent-data-encryption-tde-overview
  - title: An overview of Azure SQL Database and SQL Managed Instance security capabilities
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/security-overview
