id: az305-2a-store-sqlvm-extension
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs a vendor application on SQL Server 2022. The vendor requires access to the operating system, so the databases will be hosted on SQL Server on Azure Virtual Machines.

    You need to recommend how to reduce the administrative effort of the SQL Server virtual machines. The solution must meet the following requirements:

    - Schedule the backups of all the databases without writing custom scripts.
    - Switch the SQL Server license of a virtual machine between pay-as-you-go and Azure Hybrid Benefit from the Azure portal.
    - Deploy no additional server.

    What should you include in the recommendation?
  fr: |
    Proseware exécute une application d'éditeur sur SQL Server 2022. L'éditeur exige un accès au système d'exploitation, donc les bases de données seront hébergées dans SQL Server sur machines virtuelles Azure.

    Vous devez recommander comment réduire l'effort d'administration des machines virtuelles SQL Server. La solution doit répondre aux exigences suivantes :

    - Planifier les sauvegardes de toutes les bases de données sans écrire de scripts personnalisés.
    - Basculer la licence SQL Server d'une machine virtuelle entre le paiement à l'utilisation et Azure Hybrid Benefit depuis le portail Azure.
    - Ne déployer aucun serveur supplémentaire.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - id: a
      text: { en: "Microsoft Azure Backup Server", fr: "Serveur de sauvegarde Microsoft Azure" }
    - id: b
      text: { en: "Azure Automation runbooks", fr: "Des runbooks Azure Automation" }
    - id: c
      text: { en: "The SQL IaaS Agent extension", fr: "L'extension SQL IaaS Agent" }
    - id: d
      text: { en: "Azure Site Recovery", fr: "Azure Site Recovery" }
answer: { optionId: c }
explanation:
  correct:
    en: Registering a SQL Server virtual machine with the SQL IaaS Agent extension adds management features to the Azure portal. They include automated backup, which schedules the backups of all the databases, and flexible licensing, which switches the virtual machine between pay-as-you-go and Azure Hybrid Benefit. The extension runs inside the existing virtual machine.
    fr: L'inscription d'une machine virtuelle SQL Server auprès de l'extension SQL IaaS Agent ajoute des fonctionnalités de gestion au portail Azure. Elles comprennent la sauvegarde automatisée, qui planifie les sauvegardes de toutes les bases de données, et la gestion flexible des licences, qui bascule la machine virtuelle entre le paiement à l'utilisation et Azure Hybrid Benefit. L'extension s'exécute dans la machine virtuelle existante.
  options:
    a:
      en: Microsoft Azure Backup Server is a separate server to deploy, and it doesn't manage SQL Server licensing.
      fr: Le serveur de sauvegarde Microsoft Azure est un serveur distinct à déployer, et il ne gère pas les licences SQL Server.
    b:
      en: Runbooks are custom scripts to write and maintain, which the requirements exclude.
      fr: Les runbooks sont des scripts personnalisés à écrire et à maintenir, ce que les exigences excluent.
    d:
      en: Site Recovery replicates virtual machines to another region for disaster recovery. It neither schedules database backups nor manages licenses.
      fr: Site Recovery réplique des machines virtuelles vers une autre région pour la reprise d'activité. Il ne planifie pas les sauvegardes de bases de données et ne gère pas les licences.
references:
  - title: Automate management with the Windows SQL Server IaaS Agent extension
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/sql-server-iaas-agent-extension-automate-management
