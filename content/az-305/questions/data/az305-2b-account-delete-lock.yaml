id: az305-2b-account-delete-lock
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum hosts production data in a storage account named **stadatumprod**. Several administrators have the Contributor role on the resource group of the account. One of them recently deleted another storage account by mistake.

    You need to recommend a solution that prevents the accidental deletion of stadatumprod. The administrators must still be able to change the configuration of the account and to manage its data.

    What should you recommend?
  fr: |
    Adatum héberge des données de production dans un compte de stockage nommé **stadatumprod**. Plusieurs administrateurs ont le rôle Contributor sur le groupe de ressources du compte. L'un d'eux a récemment supprimé un autre compte de stockage par erreur.

    Vous devez recommander une solution qui empêche la suppression accidentelle de stadatumprod. Les administrateurs doivent toujours pouvoir modifier la configuration du compte et gérer ses données.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A CanNotDelete lock on the storage account", fr: "Un verrou CanNotDelete sur le compte de stockage" }
    - id: b
      text: { en: "A ReadOnly lock on the storage account", fr: "Un verrou ReadOnly sur le compte de stockage" }
    - id: c
      text: { en: "Container soft delete with a 14-day retention period", fr: "La suppression réversible de conteneur avec une période de rétention de 14 jours" }
    - id: d
      text: { en: "Blob versioning", fr: "Le contrôle de version des objets blob" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An Azure Resource Manager lock protects the storage account resource itself. A CanNotDelete lock blocks the deletion of the account while authorized users can still read and modify it, so administrators keep managing its configuration and data.
    fr: |
      Un verrou Azure Resource Manager protège la ressource compte de stockage elle-même. Un verrou CanNotDelete bloque la suppression du compte tandis que les utilisateurs autorisés peuvent toujours le lire et le modifier : les administrateurs continuent donc de gérer sa configuration et ses données.
  options:
    b:
      en: A ReadOnly lock also prevents deletion, but it blocks changes to the configuration of the account.
      fr: "Un verrou ReadOnly empêche aussi la suppression, mais il bloque les modifications de la configuration du compte."
    c:
      en: Container soft delete recovers deleted containers; it does not protect against the deletion of the storage account.
      fr: "La suppression réversible de conteneur récupère des conteneurs supprimés ; elle ne protège pas contre la suppression du compte de stockage."
    d:
      en: Blob versioning works at the blob level and does not protect against the deletion of a container or of the account.
      fr: "Le contrôle de version des objets blob agit au niveau des objets blob et ne protège pas contre la suppression d'un conteneur ou du compte."
references:
  - title: Data protection overview
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/data-protection-overview
  - title: Blob versioning
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/versioning-overview
