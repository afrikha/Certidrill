id: az305-2b-partition-key-change
objective: "2.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso stores orders in an Azure Cosmos DB for NoSQL container named **Orders** that uses `/orderDate` as its partition key. On the busiest days, a few partitions receive most of the requests and the application is throttled. You determine that `/customerId` would distribute the load evenly.

    You need to recommend how to adopt the new partition key.

    Which three actions should you recommend performing in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso stocke des commandes dans un conteneur Azure Cosmos DB for NoSQL nommé **Orders** qui utilise `/orderDate` comme clé de partition. Les jours de plus forte activité, quelques partitions reçoivent la plupart des requêtes et l'application subit une limitation de débit. Vous déterminez que `/customerId` répartirait uniformément la charge.

    Vous devez recommander la manière d'adopter la nouvelle clé de partition.

    Quelles sont les trois actions à recommander, dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: alter, text: { en: "Change the partition key path of the Orders container to /customerId.", fr: "Remplacer le chemin de la clé de partition du conteneur Orders par /customerId." } }
    - { id: copy, text: { en: "Copy the items to the new container by using a container copy job.", fr: "Copier les éléments dans le nouveau conteneur à l'aide d'un travail de copie de conteneur." } }
    - { id: ru, text: { en: "Increase the provisioned throughput of the Orders container.", fr: "Augmenter le débit approvisionné du conteneur Orders." } }
    - { id: new, text: { en: "Create a new container that uses /customerId as its partition key.", fr: "Créer un nouveau conteneur qui utilise /customerId comme clé de partition." } }
    - { id: hier, text: { en: "Enable hierarchical partition keys on the Orders container.", fr: "Activer les clés de partition hiérarchiques sur le conteneur Orders." } }
    - { id: switch, text: { en: "Point the application to the new container, and then delete the Orders container.", fr: "Faire pointer l'application vers le nouveau conteneur, puis supprimer le conteneur Orders." } }
answer:
  sequence: [ new, copy, switch ]
explanation:
  correct:
    en: |
      The partition key of a container cannot be changed in place. The data must be moved to a new container created with the desired key, for example with a container copy job, and the application is then redirected to the new container before the old one is removed.
    fr: |
      La clé de partition d'un conteneur ne peut pas être modifiée sur place. Les données doivent être déplacées vers un nouveau conteneur créé avec la clé voulue, par exemple avec un travail de copie de conteneur ; l'application est ensuite redirigée vers le nouveau conteneur avant la suppression de l'ancien.
  options:
    alter: { en: "The partition key path of an existing container is immutable.", fr: "Le chemin de la clé de partition d'un conteneur existant est immuable." }
    ru: { en: "Provisioned throughput is divided evenly among physical partitions, so more RU/s does not remove the hot partitions and raises the cost.", fr: "Le débit approvisionné est réparti uniformément entre les partitions physiques : davantage de RU/s ne supprime pas les partitions chaudes et augmente le coût." }
    hier: { en: "Hierarchical partition keys can be enabled only when a container is created, and their paths cannot be changed later.", fr: "Les clés de partition hiérarchiques ne peuvent être activées qu'à la création d'un conteneur, et leurs chemins ne peuvent pas être modifiés ensuite." }
references:
  - title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
  - title: Hierarchical partition keys in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
