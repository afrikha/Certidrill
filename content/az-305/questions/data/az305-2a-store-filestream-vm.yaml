id: az305-2a-store-filestream-vm
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank runs a document management application on an on-premises SQL Server 2019 instance. An assessment of the instance shows the following:

    - Six databases, 3 TB in total.
    - SQL Server Agent jobs and queries that join tables across the databases.
    - Scanned documents stored in FILESTREAM columns.

    The instance must move to Azure within two months. The application code and the database schema must not be modified. Among the services that meet this constraint, you must recommend the one with the least administrative effort.

    What should you recommend?
  fr: |
    Woodgrove Bank exécute une application de gestion de documents sur une instance SQL Server 2019 locale. Une évaluation de l'instance montre les éléments suivants :

    - Six bases de données, 3 To au total.
    - Des travaux SQL Server Agent et des requêtes qui joignent des tables de plusieurs bases de données.
    - Des documents numérisés stockés dans des colonnes FILESTREAM.

    L'instance doit être déplacée vers Azure dans les deux mois. Le code de l'application et le schéma des bases de données ne doivent pas être modifiés. Parmi les services qui respectent cette contrainte, vous devez recommander celui qui demande le moins d'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Azure SQL Managed Instance in the General Purpose service tier", fr: "Azure SQL Managed Instance au niveau de service General Purpose" }
    - id: b
      text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur machines virtuelles Azure" }
    - id: c
      text: { en: "Azure SQL Managed Instance in the Business Critical service tier", fr: "Azure SQL Managed Instance au niveau de service Business Critical" }
    - id: d
      text: { en: "An Azure SQL Database elastic pool", fr: "Un pool élastique Azure SQL Database" }
answer: { optionId: b }
explanation:
  correct:
    en: FILESTREAM is supported neither by Azure SQL Database nor by Azure SQL Managed Instance. Because the schema can't change, the only Azure SQL option left is SQL Server on Azure Virtual Machines, which runs the full SQL Server product. The Agent jobs and the cross-database queries point to SQL Managed Instance, but one unsupported feature is enough to rule a service out.
    fr: FILESTREAM n'est pris en charge ni par Azure SQL Database ni par Azure SQL Managed Instance. Comme le schéma ne peut pas changer, la seule option Azure SQL restante est SQL Server sur machines virtuelles Azure, qui exécute le produit SQL Server complet. Les travaux Agent et les requêtes entre bases de données orientent vers SQL Managed Instance, mais une seule fonctionnalité non prise en charge suffit à écarter un service.
  options:
    a:
      en: SQL Managed Instance supports SQL Server Agent and cross-database queries but not FILESTREAM, in any service tier. The documents would have to be moved to another store.
      fr: SQL Managed Instance prend en charge SQL Server Agent et les requêtes entre bases de données, mais pas FILESTREAM, quel que soit le niveau de service. Il faudrait déplacer les documents vers un autre magasin.
    c:
      en: The Business Critical tier changes the storage and the number of replicas, not the feature set. FILESTREAM stays unsupported.
      fr: Le niveau Business Critical change le stockage et le nombre de réplicas, pas l'ensemble des fonctionnalités. FILESTREAM reste non pris en charge.
    d:
      en: Azure SQL Database supports neither FILESTREAM, nor SQL Server Agent, nor cross-database queries.
      fr: Azure SQL Database ne prend en charge ni FILESTREAM, ni SQL Server Agent, ni les requêtes entre bases de données.
references:
  - title: "Features comparison: Azure SQL Database and Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
