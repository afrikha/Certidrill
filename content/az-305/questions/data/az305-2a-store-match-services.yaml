id: az305-2a-store-match-services
objective: "2.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys is moving three workloads to Azure. Each workload must use the most managed database service that supports it.

    Which service should you recommend for each workload? To answer, drag the appropriate services to the correct workloads. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys déplace trois charges de travail vers Azure. Chaque charge de travail doit utiliser le service de base de données le plus managé qui la prend en charge.

    Quel service devez-vous recommander pour chaque charge de travail ? Pour répondre, faites glisser les services appropriés vers les charges de travail correspondantes. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pool, text: { en: "Azure SQL Database elastic pool", fr: "Pool élastique Azure SQL Database" } }
    - { id: mi, text: Azure SQL Managed Instance }
    - { id: vm, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur machines virtuelles Azure" } }
    - { id: mysql, text: { en: "Azure Database for MySQL flexible server", fr: "Azure Database for MySQL (serveur flexible)" } }
    - { id: pg, text: { en: "Azure Database for PostgreSQL flexible server", fr: "Azure Database for PostgreSQL (serveur flexible)" } }
  targets:
    - id: t1
      text:
        en: A packaged application whose vendor requires SQL Server Analysis Services (SSAS) on the database server and sign-in to the operating system
        fr: Une application packagée dont l'éditeur exige SQL Server Analysis Services (SSAS) sur le serveur de base de données et une connexion au système d'exploitation
    - id: t2
      text:
        en: Sixty small databases of a new SaaS application, one per customer, that are busy at different times and are paid from one compute budget
        fr: Soixante petites bases de données d'une nouvelle application SaaS, une par client, sollicitées à des moments différents et financées par un seul budget de calcul
    - id: t3
      text:
        en: A web application written for the open-source MySQL engine, with patching and backups handled by the platform
        fr: Une application web écrite pour le moteur open source MySQL, dont les mises à jour correctives et les sauvegardes sont assurées par la plateforme
answer:
  mapping: { t1: vm, t2: pool, t3: mysql }
explanation:
  correct:
    en: SSAS and operating system access exist only on SQL Server on Azure Virtual Machines. Neither Azure SQL Database nor SQL Managed Instance runs SSAS. Many small databases with staggered activity share the resources of an elastic pool at one price. An application written for MySQL keeps its engine on Azure Database for MySQL flexible server, where Azure patches and backs up the server.
    fr: SSAS et l'accès au système d'exploitation n'existent que dans SQL Server sur machines virtuelles Azure. Ni Azure SQL Database ni SQL Managed Instance n'exécutent SSAS. De nombreuses petites bases de données à l'activité décalée partagent les ressources d'un pool élastique pour un prix unique. Une application écrite pour MySQL conserve son moteur dans Azure Database for MySQL (serveur flexible), où Azure met à jour et sauvegarde le serveur.
  options:
    mi: { en: "SQL Managed Instance has no operating system access and doesn't run SSAS. For new per-customer databases it brings instance features that aren't needed.", fr: "SQL Managed Instance ne donne pas accès au système d'exploitation et n'exécute pas SSAS. Pour de nouvelles bases de données par client, il apporte des fonctionnalités d'instance inutiles." }
    pg: { en: "PostgreSQL is a different engine. An application written for MySQL would have to be ported.", fr: "PostgreSQL est un autre moteur. Une application écrite pour MySQL devrait être portée." }
references:
  - title: What is Azure SQL?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/azure-sql-iaas-vs-paas-what-is-overview
  - title: What is Azure Database for MySQL flexible server?
    url: https://learn.microsoft.com/en-us/azure/mysql/flexible-server/overview
