id: az305-2b-cosmos-reserved-capacity
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs an order platform on an Azure Cosmos DB for NoSQL account that is replicated to two regions. Monitoring shows that the container consumes close to 40,000 RU/s around the clock. The company expects this load to remain stable for the next three years.

    You need to recommend a capacity configuration that minimizes costs without throttling the application.

    What should you recommend?
  fr: |
    Northwind Traders exploite une plateforme de commandes sur un compte Azure Cosmos DB for NoSQL répliqué dans deux régions. La supervision montre que le conteneur consomme près de 40 000 RU/s jour et nuit. L'entreprise prévoit que cette charge restera stable pendant les trois prochaines années.

    Vous devez recommander une configuration de capacité qui réduit les coûts au minimum sans limiter le débit de l'application.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Standard provisioned throughput of 40,000 RU/s, covered by a three-year reserved capacity purchase", fr: "Un débit approvisionné standard de 40 000 RU/s, couvert par l'achat d'une capacité réservée de trois ans" }
    - id: b
      text: { en: "Standard provisioned throughput of 40,000 RU/s, billed at pay-as-you-go rates", fr: "Un débit approvisionné standard de 40 000 RU/s, facturé au tarif du paiement à l'utilisation" }
    - id: c
      text: { en: "Autoscale provisioned throughput with a maximum of 40,000 RU/s, billed at pay-as-you-go rates", fr: "Un débit approvisionné à mise à l'échelle automatique avec un maximum de 40 000 RU/s, facturé au tarif du paiement à l'utilisation" }
    - id: d
      text: { en: "A new account that uses the serverless capacity mode", fr: "Un nouveau compte qui utilise le mode de capacité serverless" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Standard provisioned throughput is the mode for sustained, predictable traffic, and reserved capacity discounts provisioned RU/s in exchange for a one-year or three-year commitment, with the larger discount for three years. A load that is stable for three years makes full use of the reservation.
    fr: |
      Le débit approvisionné standard est le mode adapté à un trafic soutenu et prévisible, et la capacité réservée accorde une remise sur les RU/s approvisionnées en échange d'un engagement d'un an ou de trois ans, la remise la plus forte étant celle de trois ans. Une charge stable pendant trois ans utilise pleinement la réservation.
  options:
    b:
      en: The configuration is the same, but without the reservation discount.
      fr: "La configuration est la même, mais sans la remise de réservation."
    c:
      en: Autoscale saves money only when the maximum is used during 66% of the hours or fewer; a container that stays at its maximum pays the higher autoscale rate all the time.
      fr: "La mise à l'échelle automatique n'est économique que si le maximum est utilisé pendant 66 % des heures au plus ; un conteneur qui reste à son maximum paie en permanence le tarif plus élevé de la mise à l'échelle automatique."
    d:
      en: A serverless account runs in a single region, targets intermittent traffic and is not covered by reserved capacity.
      fr: "Un compte serverless s'exécute dans une seule région, vise un trafic intermittent et n'est pas couvert par la capacité réservée."
references:
  - title: Azure Cosmos DB pricing & discounts with Reserved Capacity
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/reserved-capacity
  - title: Create Azure Cosmos DB containers and databases with autoscale
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/provision-throughput-autoscale
