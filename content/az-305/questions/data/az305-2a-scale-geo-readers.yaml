id: az305-2a-scale-geo-readers
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware hosts a product catalog database in Azure SQL Database, in the General Purpose service tier, in the West Europe region. A new web front end in the Australia East region only reads the catalog, and its queries are slow because of the distance to the database.

    You need to recommend a solution that meets the following requirements:

    - Serve the read queries of the Australian front end from a copy of the data in Australia East.
    - Keep all the writes in West Europe.
    - Keep the copy up to date continuously, with no custom synchronization code.

    What should you recommend?
  fr: |
    Proseware héberge une base de données de catalogue de produits dans Azure SQL Database, au niveau de service General Purpose, dans la région West Europe. Un nouveau front-end web dans la région Australia East ne fait que lire le catalogue, et ses requêtes sont lentes à cause de la distance qui le sépare de la base de données.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Servir les requêtes de lecture du front-end australien à partir d'une copie des données située dans Australia East.
    - Conserver toutes les écritures dans West Europe.
    - Maintenir la copie à jour en continu, sans code de synchronisation personnalisé.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Read scale-out with `ApplicationIntent=ReadOnly`", fr: "La lecture à l'échelle (read scale-out) avec `ApplicationIntent=ReadOnly`" }
    - id: b
      text: { en: "A readable secondary database in Australia East, created by active geo-replication", fr: "Une base de données secondaire lisible dans Australia East, créée par la géoréplication active" }
    - id: c
      text: { en: "Geo-redundant backup storage and a daily geo-restore to Australia East", fr: "Un stockage de sauvegarde géoredondant et une géorestauration quotidienne vers Australia East" }
    - id: d
      text: { en: "An elastic pool that spans West Europe and Australia East", fr: "Un pool élastique qui couvre West Europe et Australia East" }
answer: { optionId: b }
explanation:
  correct:
    en: Active geo-replication, available in every service tier of Azure SQL Database, creates a continuously synchronized secondary database in a region of your choice. The secondary is readable, so the Australian front end can query it locally while all the writes go to the primary in West Europe. Up to four secondaries can be created.
    fr: La géoréplication active, disponible à tous les niveaux de service d'Azure SQL Database, crée une base de données secondaire synchronisée en continu dans la région de votre choix. La base secondaire est lisible, donc le front-end australien peut l'interroger localement tandis que toutes les écritures vont vers la base primaire dans West Europe. Il est possible de créer jusqu'à quatre bases secondaires.
  options:
    a:
      en: Read scale-out uses a replica in the region of the primary, and a General Purpose database has none.
      fr: La lecture à l'échelle utilise un réplica situé dans la région du réplica principal, et une base de données General Purpose n'en a pas.
    c:
      en: A geo-restore creates a point-in-time copy from backups. The copy isn't kept up to date, and repeating the restore is custom synchronization.
      fr: Une géorestauration crée une copie à un instant donné à partir des sauvegardes. La copie n'est pas maintenue à jour, et répéter la restauration revient à une synchronisation personnalisée.
    d:
      en: All the databases of an elastic pool are on one logical server, in one region.
      fr: Toutes les bases de données d'un pool élastique se trouvent sur un seul serveur logique, dans une seule région.
references:
  - title: Active geo-replication
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/active-geo-replication-overview
