id: az305-2a-store-new-app
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is building a new order management application that will run in Azure App Service. The data consists of customers, orders and order lines that are linked by foreign keys and updated in multi-table transactions.

    You need to recommend a data store that meets the following requirements:

    - Support Transact-SQL queries and referential integrity.
    - Require no operating system or database engine maintenance.
    - Change the compute size of the database without redeploying it.
    - Minimize cost. The application uses no instance-scoped SQL Server feature.

    What should you recommend?
  fr: |
    Contoso développe une nouvelle application de gestion des commandes qui s'exécutera dans Azure App Service. Les données sont des clients, des commandes et des lignes de commande liés par des clés étrangères et mis à jour dans des transactions portant sur plusieurs tables.

    Vous devez recommander un magasin de données qui répond aux exigences suivantes :

    - Prendre en charge les requêtes Transact-SQL et l'intégrité référentielle.
    - N'exiger aucune maintenance du système d'exploitation ni du moteur de base de données.
    - Changer la taille de calcul de la base de données sans la redéployer.
    - Réduire les coûts au minimum. L'application n'utilise aucune fonctionnalité SQL Server d'instance.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur machines virtuelles Azure" }
    - id: b
      text: { en: "Azure SQL Managed Instance", fr: "Azure SQL Managed Instance" }
    - id: c
      text: { en: "Azure SQL Database", fr: "Azure SQL Database" }
    - id: d
      text: { en: "Azure Cosmos DB for NoSQL", fr: "Azure Cosmos DB for NoSQL" }
answer: { optionId: c }
explanation:
  correct:
    en: Azure SQL Database is the most managed Azure SQL option. Microsoft patches the engine and the platform, backups and high availability are built in, and a single database is sized and scaled on its own. With no instance-scoped feature to preserve, it is the lowest-cost fit for a new relational application.
    fr: Azure SQL Database est l'option Azure SQL la plus managée. Microsoft applique les mises à jour correctives du moteur et de la plateforme, les sauvegardes et la haute disponibilité sont intégrées, et une base de données unique se dimensionne et se met à l'échelle seule. Sans fonctionnalité d'instance à préserver, c'est le choix le moins coûteux pour une nouvelle application relationnelle.
  options:
    a:
      en: A virtual machine leaves the operating system, the SQL Server patches and the high-availability design to you.
      fr: Une machine virtuelle vous laisse la charge du système d'exploitation, des mises à jour de SQL Server et de la conception de la haute disponibilité.
    b:
      en: SQL Managed Instance is built for migrations that need instance-scoped features such as SQL Server Agent or cross-database queries. You size and pay for a whole instance, which the application doesn't need.
      fr: SQL Managed Instance est conçu pour les migrations qui ont besoin de fonctionnalités d'instance comme SQL Server Agent ou les requêtes entre bases de données. Vous dimensionnez et payez une instance entière, dont l'application n'a pas besoin.
    d:
      en: Azure Cosmos DB for NoSQL stores JSON items. It doesn't enforce foreign keys and doesn't run Transact-SQL.
      fr: Azure Cosmos DB for NoSQL stocke des éléments JSON. Il n'impose pas les clés étrangères et n'exécute pas Transact-SQL.
references:
  - title: What is Azure SQL?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/azure-sql-iaas-vs-paas-what-is-overview
