id: az305-cs2b-events-container
objective: "2.2.1"
type: dropdown
caseStudy: az305-cs2b-wide-world-importers
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a configuration for the shipment-events container. The solution must meet the data requirements.

    What should you include in the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une configuration pour le conteneur shipment-events. La solution doit respecter les exigences relatives aux données.

    Que devez-vous inclure dans la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Capacity mode: [[capacity]]

      Partition key: [[key]]
    fr: |
      Mode de capacité : [[capacity]]

      Clé de partition : [[key]]
  slots:
    - id: capacity
      options:
        - { id: manual, text: { en: "Provisioned throughput, manual, 60,000 RU/s", fr: "Débit approvisionné manuel de 60 000 RU/s" } }
        - { id: autoscale, text: { en: "Provisioned throughput, autoscale, maximum of 60,000 RU/s", fr: "Débit approvisionné avec mise à l'échelle automatique, maximum de 60 000 RU/s" } }
        - { id: serverless, text: Serverless }
    - id: key
      options:
        - { id: hub, text: /hubId }
        - { id: shipment, text: /shipmentId }
        - { id: status, text: /status }
        - { id: time, text: /timestamp }
answer:
  values: { capacity: autoscale, key: shipment }
explanation:
  correct:
    en: Autoscale provisioned throughput scales instantly between 10% and 100% of the maximum, here 6,000 to 60,000 RU/s, and bills each hour for the highest value reached, so the peaks are served and the quiet hours cost less. A good partition key has many distinct values, spreads storage and requests evenly and appears as a filter in most queries; shipmentId has hundreds of millions of values and is the filter of the most frequent query, which is then served by one partition.
    fr: Le débit approvisionné avec mise à l'échelle automatique varie instantanément entre 10 % et 100 % du maximum, ici de 6 000 à 60 000 RU/s, et facture chaque heure la valeur la plus élevée atteinte ; les pics sont donc servis et les heures calmes coûtent moins cher. Une bonne clé de partition a de nombreuses valeurs distinctes, répartit uniformément le stockage et les requêtes et sert de filtre à la plupart des requêtes ; shipmentId compte des centaines de millions de valeurs et constitue le filtre de la requête la plus fréquente, qui est alors servie par une seule partition.
  options:
    manual: { en: "Manual throughput set for the peak is billed at 60,000 RU/s every hour, even when the load is 8,000 RU/s.", fr: "Un débit manuel réglé sur le pic est facturé 60 000 RU/s chaque heure, même quand la charge est de 8 000 RU/s." }
    serverless: { en: "A serverless account runs in a single region; cosmos-trackhub is replicated to three regions.", fr: "Un compte serverless s'exécute dans une seule région ; cosmos-trackhub est répliqué dans trois régions." }
    hub: { en: "Five hubs receive half of the scans: their partitions would be hot, and a query for one shipment would not target one hubId.", fr: "Cinq plateformes reçoivent la moitié des lectures : leurs partitions seraient surchargées, et une requête portant sur une expédition ne ciblerait pas un seul hubId." }
    status: { en: "Six values give six huge logical partitions, beyond the 20 GB limit of a logical partition.", fr: "Six valeurs donnent six énormes partitions logiques, au-delà de la limite de 20 Go d'une partition logique." }
    time: { en: "A timestamp spreads the data, but the events of one shipment would be scattered over many partitions.", fr: "Un horodatage répartit les données, mais les événements d'une expédition seraient dispersés sur de nombreuses partitions." }
references:
  - title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
  - title: Create Azure Cosmos DB containers and databases with autoscale
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/provision-throughput-autoscale
