id: az305-2a-tier-mi-tiers
objective: "2.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware plans to migrate two SQL Server instances to Azure SQL Managed Instance. Each SQL Server instance must become one managed instance.

    | Instance | Databases | Total size | Characteristics |
    | --- | --- | --- | --- |
    | ERP1 | 280 | 9 TB | No specific latency requirement |
    | TRADE1 | 12 | 2 TB | Uses In-Memory OLTP. Reports must read from a replica that is included in the price of the instance |

    You need to recommend a service tier for each managed instance. The solution must minimize cost.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de migrer deux instances SQL Server vers Azure SQL Managed Instance. Chaque instance SQL Server doit devenir une instance managée.

    | Instance | Bases de données | Taille totale | Caractéristiques |
    | --- | --- | --- | --- |
    | ERP1 | 280 | 9 To | Aucune exigence de latence particulière |
    | TRADE1 | 12 | 2 To | Utilise l'OLTP en mémoire. Les rapports doivent lire sur un réplica compris dans le prix de l'instance |

    Vous devez recommander un niveau de service pour chaque instance managée. La solution doit réduire les coûts au minimum.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      ERP1: [[erp]]

      TRADE1: [[trade]]
    fr: |
      ERP1 : [[erp]]

      TRADE1 : [[trade]]
  slots:
    - id: erp
      options:
        - { id: erp-gp, text: General Purpose }
        - { id: erp-ng, text: Next-gen General Purpose }
        - { id: erp-bc, text: Business Critical }
    - id: trade
      options:
        - { id: trade-gp, text: General Purpose }
        - { id: trade-ng, text: Next-gen General Purpose }
        - { id: trade-bc, text: Business Critical }
answer:
  values: { erp: erp-ng, trade: trade-bc }
explanation:
  correct:
    en: A managed instance holds up to 100 databases in the General Purpose and Business Critical tiers and up to 500 in the Next-gen General Purpose tier, so only the latter accepts the 280 databases of ERP1 in one instance. In SQL Managed Instance, In-Memory OLTP and the built-in readable replica exist only in the Business Critical tier, which TRADE1 therefore requires.
    fr: Une instance managée contient jusqu'à 100 bases de données aux niveaux General Purpose et Business Critical, et jusqu'à 500 au niveau Next-gen General Purpose. Seul ce dernier accepte donc les 280 bases de données d'ERP1 dans une seule instance. Dans SQL Managed Instance, l'OLTP en mémoire et le réplica lisible intégré n'existent qu'au niveau Business Critical, que TRADE1 exige donc.
  options:
    erp-gp: { en: "General Purpose is limited to 100 databases per instance.", fr: "General Purpose est limité à 100 bases de données par instance." }
    erp-bc: { en: "Business Critical is limited to 100 databases per instance and costs more.", fr: "Business Critical est limité à 100 bases de données par instance et coûte plus cher." }
    trade-gp: { en: "General Purpose supports neither In-Memory OLTP nor a readable replica.", fr: "General Purpose ne prend en charge ni l'OLTP en mémoire ni un réplica lisible." }
    trade-ng: { en: "Next-gen General Purpose improves storage performance and limits, but it has no In-Memory OLTP and no built-in readable replica.", fr: "Next-gen General Purpose améliore les performances et les limites du stockage, mais il n'a ni OLTP en mémoire ni réplica lisible intégré." }
references:
  - title: vCore purchasing model - Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/service-tiers-managed-instance-vcore
  - title: "Features comparison: Azure SQL Database and Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/features-comparison
