id: az305-2a-protect-ledger
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank records settlement transactions in a table of a database in Azure SQL Database. External auditors set the following requirements:

    - Rows may only be inserted into the table.
    - Woodgrove Bank must be able to prove cryptographically that no row was altered or deleted afterward, even by a database administrator.

    What should you recommend?
  fr: |
    Woodgrove Bank enregistre des transactions de règlement dans une table d'une base de données Azure SQL Database. Des auditeurs externes fixent les exigences suivantes :

    - Les lignes ne peuvent qu'être insérées dans la table.
    - Woodgrove Bank doit pouvoir prouver de façon cryptographique qu'aucune ligne n'a été modifiée ni supprimée par la suite, même par un administrateur de base de données.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A system-versioned temporal table", fr: "Une table temporelle avec version gérée par le système" }
    - id: b
      text: { en: "Auditing to a storage account", fr: "L'audit vers un compte de stockage" }
    - id: c
      text: { en: "An append-only ledger table", fr: "Une table de registre en ajout seul" }
    - id: d
      text: { en: "Change data capture on the table", fr: "La capture des changements de données sur la table" }
answer: { optionId: c }
explanation:
  correct:
    en: The ledger feature protects tables with cryptographic hashes that are chained in a database ledger, and database digests stored outside the database let anyone verify later that the data wasn't tampered with. An append-only ledger table accepts inserts only, which matches the rule set by the auditors.
    fr: La fonctionnalité de registre (ledger) protège des tables par des hachages cryptographiques chaînés dans un registre de base de données, et des synthèses de base de données stockées hors de la base permettent de vérifier plus tard que les données n'ont pas été falsifiées. Une table de registre en ajout seul n'accepte que des insertions, ce qui correspond à la règle fixée par les auditeurs.
  options:
    a:
      en: A temporal table keeps the history of row versions, but an administrator can alter that history and nothing proves its integrity.
      fr: Une table temporelle conserve l'historique des versions de lignes, mais un administrateur peut modifier cet historique et rien n'en prouve l'intégrité.
    b:
      en: Auditing records who ran which statement. It doesn't block updates and gives no cryptographic proof about the content of the table.
      fr: L'audit enregistre qui a exécuté quelle instruction. Il ne bloque pas les mises à jour et ne donne aucune preuve cryptographique sur le contenu de la table.
    d:
      en: Change data capture records changes for downstream processing. It neither prevents nor proves the absence of tampering.
      fr: La capture des changements de données enregistre les modifications pour des traitements en aval. Elle n'empêche pas la falsification et n'en prouve pas l'absence.
references:
  - title: Ledger overview
    url: https://learn.microsoft.com/en-us/sql/relational-databases/security/ledger/ledger-overview
