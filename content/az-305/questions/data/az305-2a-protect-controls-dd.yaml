id: az305-2a-protect-controls-dd
objective: "2.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is defining the security baseline of its databases in Azure SQL Database. Each requirement must be met by a built-in feature.

    Which feature should you recommend for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders définit la base de référence de sécurité de ses bases de données Azure SQL Database. Chaque exigence doit être satisfaite par une fonctionnalité intégrée.

    Quelle fonctionnalité devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rls, text: { en: "Row-level security", fr: "Sécurité au niveau des lignes" } }
    - { id: defender, text: { en: "Microsoft Defender for SQL", fr: "Microsoft Defender pour SQL" } }
    - { id: audit, text: { en: "Auditing", fr: "Audit" } }
    - { id: classif, text: { en: "Data Discovery & Classification", fr: "Découverte et classification des données" } }
    - { id: ddm, text: { en: "Dynamic data masking", fr: "Masquage dynamique des données" } }
    - { id: tde, text: { en: "Transparent data encryption", fr: "Transparent Data Encryption" } }
  targets:
    - id: t1
      text:
        en: Each sales representative must be able to read only the orders of his or her own region, whatever query is sent
        fr: Chaque commercial ne doit pouvoir lire que les commandes de sa propre région, quelle que soit la requête envoyée
    - id: t2
      text:
        en: The security team must be alerted to potential SQL injection and to sign-ins from unusual locations
        fr: L'équipe de sécurité doit être alertée des injections SQL potentielles et des connexions depuis des emplacements inhabituels
    - id: t3
      text:
        en: A record of the database events, including who ran which statement, must be kept for compliance reviews
        fr: Un enregistrement des événements de base de données, indiquant qui a exécuté quelle instruction, doit être conservé pour les revues de conformité
    - id: t4
      text:
        en: The columns that contain personal data must be identified and labeled with a sensitivity level
        fr: Les colonnes qui contiennent des données personnelles doivent être identifiées et étiquetées avec un niveau de sensibilité
answer:
  mapping: { t1: rls, t2: defender, t3: audit, t4: classif }
explanation:
  correct:
    en: Row-level security applies a filter predicate to every query, so a user obtains only the rows that the predicate allows. Microsoft Defender for SQL includes Advanced Threat Protection, which raises alerts on SQL injection and anomalous access. Auditing tracks database events and writes them to an audit log. Data Discovery & Classification finds the columns that are likely to hold sensitive data and labels them.
    fr: La sécurité au niveau des lignes applique un prédicat de filtre à chaque requête, donc un utilisateur n'obtient que les lignes autorisées par le prédicat. Microsoft Defender pour SQL inclut Advanced Threat Protection, qui déclenche des alertes sur les injections SQL et les accès anormaux. L'audit suit les événements de base de données et les écrit dans un journal d'audit. Découverte et classification des données repère les colonnes susceptibles de contenir des données sensibles et les étiquette.
  options:
    ddm: { en: "Dynamic data masking hides part of a column value in results. It neither filters rows nor classifies columns.", fr: "Le masquage dynamique des données cache une partie de la valeur d'une colonne dans les résultats. Il ne filtre pas les lignes et ne classe pas les colonnes." }
    tde: { en: "Transparent data encryption protects the files at rest. It doesn't restrict, detect or record access.", fr: "Transparent Data Encryption protège les fichiers au repos. Il ne restreint pas, ne détecte pas et n'enregistre pas les accès." }
references:
  - title: An overview of Azure SQL Database and SQL Managed Instance security capabilities
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/security-overview
