id: az305-2a-scale-elastic-pool
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam sells a SaaS application. Each of its 40 customers has its own database in Azure SQL Database, and all the databases are on the same logical server. Every database is sized for its peak, but each one is idle most of the time and peaks for a few minutes at a different time of the day.

    You need to recommend a solution that meets the following requirements:

    - Reduce the cost of the databases.
    - Let each database still reach its peak performance.
    - Require no change to the application.

    What should you recommend?
  fr: |
    Fabrikam vend une application SaaS. Chacun de ses 40 clients possède sa propre base de données Azure SQL Database, et toutes les bases de données se trouvent sur le même serveur logique. Chaque base de données est dimensionnée pour son pic, mais chacune est inactive la plupart du temps et connaît un pic de quelques minutes à un moment différent de la journée.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Réduire le coût des bases de données.
    - Permettre à chaque base de données d'atteindre encore ses performances de pic.
    - N'exiger aucune modification de l'application.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Sharding with the Elastic Database client library", fr: "Le partitionnement (sharding) avec la bibliothèque cliente de base de données élastique" }
    - id: b
      text: { en: "Read scale-out on each database", fr: "La lecture à l'échelle (read scale-out) sur chaque base de données" }
    - id: c
      text: { en: "An elastic pool that contains the 40 databases", fr: "Un pool élastique qui contient les 40 bases de données" }
    - id: d
      text: { en: "The Hyperscale service tier for each database", fr: "Le niveau de service Hyperscale pour chaque base de données" }
answer: { optionId: c }
explanation:
  correct:
    en: The databases of an elastic pool share a set of resources that is bought once for the pool. Because the peaks don't coincide, the pool can be much smaller than the sum of the individual peaks while each database still gets the resources it needs when it is busy. Moving a database into a pool doesn't change its connection string.
    fr: Les bases de données d'un pool élastique partagent un ensemble de ressources acheté une seule fois pour le pool. Comme les pics ne coïncident pas, le pool peut être bien plus petit que la somme des pics individuels, tandis que chaque base de données obtient toujours les ressources nécessaires quand elle est sollicitée. Déplacer une base de données dans un pool ne change pas sa chaîne de connexion.
  options:
    a:
      en: Sharding spreads data across more databases to scale out. It adds databases and application logic and doesn't reduce what is paid for idle capacity.
      fr: Le partitionnement répartit les données sur davantage de bases de données pour une mise à l'échelle horizontale. Il ajoute des bases de données et de la logique applicative, et ne réduit pas ce qui est payé pour la capacité inutilisée.
    b:
      en: Read scale-out sends read-only queries to a replica. It doesn't lower the size or the price of a database.
      fr: La lecture à l'échelle envoie les requêtes en lecture seule vers un réplica. Elle ne réduit ni la taille ni le prix d'une base de données.
    d:
      en: Hyperscale addresses very large databases. Each database would still be provisioned and billed for its own peak.
      fr: Hyperscale répond au cas des bases de données très volumineuses. Chaque base de données resterait provisionnée et facturée pour son propre pic.
references:
  - title: Elastic pools help you manage and scale multiple databases in Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/elastic-pool-overview
