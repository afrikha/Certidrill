id: az305-2c-int-ir-statements
objective: "2.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Data Factory instance named **adf1**. A self-hosted integration runtime named **IR1** is registered in adf1 and installed on a server in the on-premises datacenter, which hosts a SQL Server instance. adf1 also has the default Azure integration runtime.

    You are reviewing a proposed design for new pipelines.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une instance Azure Data Factory nommée **adf1**. Un runtime d'intégration auto-hébergé nommé **IR1** est inscrit dans adf1 et installé sur un serveur du centre de données local, qui héberge une instance SQL Server. adf1 possède également le runtime d'intégration Azure par défaut.

    Vous examinez une proposition de conception pour de nouveaux pipelines.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Mapping data flows that transform the on-premises data can be executed on IR1.
        fr: Des flux de données de mappage qui transforment les données locales peuvent être exécutés sur IR1.
    - id: s2
      text:
        en: IR1 can be shared with a second data factory in the same Microsoft Entra tenant, so that no additional server has to be installed for that factory.
        fr: IR1 peut être partagé avec une deuxième fabrique de données du même locataire Microsoft Entra, de sorte qu'aucun serveur supplémentaire ne doit être installé pour cette fabrique.
    - id: s3
      text:
        en: A stored procedure activity that targets the on-premises SQL Server instance can be dispatched through IR1.
        fr: Une activité de procédure stockée qui cible l'instance SQL Server locale peut être distribuée par l'intermédiaire d'IR1.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Data flow activities run only on an Azure integration runtime: the on-premises data must first be copied to Azure through IR1. A self-hosted integration runtime can be shared with other data factories of the same Microsoft Entra tenant, which create a linked integration runtime that references it and reuse the same machine. Besides moving data, a self-hosted integration runtime dispatches transformation activities, such as a stored procedure, to compute in the on-premises network.
    fr: |
      Les activités de flux de données ne s'exécutent que sur un runtime d'intégration Azure : les données locales doivent d'abord être copiées vers Azure au moyen d'IR1. Un runtime d'intégration auto-hébergé peut être partagé avec d'autres fabriques de données du même locataire Microsoft Entra, qui créent un runtime d'intégration lié le référençant et réutilisent la même machine. Outre le déplacement de données, un runtime d'intégration auto-hébergé distribue des activités de transformation, comme une procédure stockée, vers des ressources de calcul du réseau local.
references:
  - title: Integration runtime in Azure Data Factory
    url: https://learn.microsoft.com/en-us/azure/data-factory/concepts-integration-runtime
  - title: Create a shared self-hosted integration runtime in Azure Data Factory
    url: https://learn.microsoft.com/en-us/azure/data-factory/create-shared-self-hosted-integration-runtime-powershell
