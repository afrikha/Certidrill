id: az305-4b-dep-github-oidc
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware deploys Azure resources from GitHub Actions workflows that run on GitHub-hosted runners.

    You need to recommend how the workflows sign in to Azure. The solution must meet the following requirements:

    - No password, client secret or certificate that gives access to Azure can be stored in GitHub.
    - No credential must have to be rotated.

    What should you recommend?
  fr: |
    Litware déploie des ressources Azure à partir de workflows GitHub Actions qui s'exécutent sur des exécuteurs hébergés par GitHub.

    Vous devez recommander la façon dont les workflows se connectent à Azure. La solution doit répondre aux exigences suivantes :

    - Aucun mot de passe, aucune clé secrète client ni aucun certificat donnant accès à Azure ne peut être stocké dans GitHub.
    - Aucune information d'identification ne doit avoir à être renouvelée.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A service principal with a client secret stored as a GitHub secret", fr: "Un principal de service avec une clé secrète client stockée comme secret GitHub" } }
    - { id: b, text: { en: "A publish profile stored as a GitHub secret", fr: "Un profil de publication stocké comme secret GitHub" } }
    - { id: c, text: { en: "A managed identity assigned to an Azure virtual machine", fr: "Une identité managée affectée à une machine virtuelle Azure" } }
    - { id: d, text: { en: "OpenID Connect with a user-assigned managed identity", fr: "OpenID Connect avec une identité managée affectée par l'utilisateur" } }
answer: { optionId: d }
explanation:
  correct:
    en: "With OpenID Connect, the workflow exchanges a short-lived token issued by GitHub for a Microsoft Entra token of an application or a user-assigned managed identity that trusts the repository. No secret is stored in GitHub and nothing has to be rotated; it is the sign-in method that Microsoft recommends."
    fr: "Avec OpenID Connect, le workflow échange un jeton de courte durée émis par GitHub contre un jeton Microsoft Entra d'une application ou d'une identité managée affectée par l'utilisateur qui approuve le dépôt. Aucun secret n'est stocké dans GitHub et rien n'est à renouveler ; c'est la méthode de connexion que Microsoft recommande."
  options:
    a:
      en: "A client secret is a long-lived credential stored in GitHub that expires and must be rotated; Microsoft marks this option as not recommended."
      fr: "Une clé secrète client est une information d'identification de longue durée stockée dans GitHub, qui expire et doit être renouvelée ; Microsoft signale cette option comme non recommandée."
    c:
      en: "Signing in with the managed identity of a virtual machine is available only on self-hosted runners that run on that virtual machine."
      fr: "La connexion avec l'identité managée d'une machine virtuelle n'est possible que sur des exécuteurs auto-hébergés qui s'exécutent sur cette machine virtuelle."
    b:
      en: "A publish profile contains deployment credentials of one App Service app and would be stored in GitHub."
      fr: "Un profil de publication contient des informations d'identification de déploiement d'une seule application App Service et serait stocké dans GitHub."
references:
  - title: Use GitHub Actions to connect to Azure
    url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure
