id: az305-4c-net-natgw-statements
objective: "4.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware associates a NAT gateway named **NAT1** with a subnet named **Subnet1** of a virtual network named **VNet1**. Subnet1 contains two virtual machines:

    - **VM1** has an instance-level Standard public IP address.
    - **VM2** has no public IP address.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware associe une passerelle NAT nommée **NAT1** à un sous-réseau nommé **Subnet1** d'un réseau virtuel nommé **VNet1**. Subnet1 contient deux machines virtuelles :

    - **VM1** possède une adresse IP publique Standard d'instance.
    - **VM2** n'a pas d'adresse IP publique.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Connections that VM1 initiates to the internet use a public IP address of NAT1.
        fr: Les connexions que VM1 lance vers Internet utilisent une adresse IP publique de NAT1.
    - id: s2
      text:
        en: A client on the internet can open a connection to VM2 through the public IP address of NAT1.
        fr: Un client sur Internet peut ouvrir une connexion vers VM2 par l'adresse IP publique de NAT1.
    - id: s3
      text:
        en: NAT1 can also be associated with a subnet of another virtual network named VNet2.
        fr: NAT1 peut aussi être associée à un sous-réseau d'un autre réseau virtuel nommé VNet2.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A NAT gateway takes precedence over the other outbound methods of the subnet, including an instance-level public IP address, so the outbound connections of VM1 leave through NAT1. A NAT gateway only translates outbound connections and their return traffic; it never forwards connections initiated from the internet. A NAT gateway can serve several subnets of one virtual network but can't span virtual networks.
    fr: |
      Une passerelle NAT est prioritaire sur les autres méthodes sortantes du sous-réseau, y compris une adresse IP publique d'instance : les connexions sortantes de VM1 passent donc par NAT1. Une passerelle NAT ne traduit que les connexions sortantes et leur trafic de retour ; elle ne transmet jamais de connexion lancée depuis Internet. Une passerelle NAT peut desservir plusieurs sous-réseaux d'un même réseau virtuel, mais ne peut pas s'étendre sur plusieurs réseaux virtuels.
references:
  - title: What is Azure NAT Gateway?
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
