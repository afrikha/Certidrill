id: az305-4d-sec-fw-sku
objective: "4.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a hub-spoke network in the West Europe region with six spoke virtual networks. All the internet-bound traffic of the spokes must be routed through a central firewall in the hub.

    You need to recommend a firewall solution. The solution must meet the following requirements:

    - Block, not only log, the traffic to IP addresses and domains known to be malicious.
    - Allow outbound SFTP connections on TCP port 22 only to partner servers identified by their FQDN.
    - Support a peak throughput of 3 Gbps.
    - TLS inspection isn't required.
    - Minimize costs.

    What should you recommend?
  fr: |
    Proseware dispose d'un réseau hub-and-spoke dans la région West Europe avec six réseaux virtuels spoke. Tout le trafic des spokes à destination d'Internet doit être routé par un pare-feu central dans le hub.

    Vous devez recommander une solution de pare-feu. La solution doit répondre aux exigences suivantes :

    - Bloquer, et pas seulement journaliser, le trafic vers les adresses IP et les domaines connus comme malveillants.
    - Autoriser les connexions SFTP sortantes sur le port TCP 22 uniquement vers des serveurs partenaires identifiés par leur FQDN.
    - Prendre en charge un débit de pointe de 3 Gbit/s.
    - L'inspection TLS n'est pas exigée.
    - Réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Firewall Basic", fr: "Pare-feu Azure Basic" } }
    - { id: b, text: { en: "Azure Firewall Standard", fr: "Pare-feu Azure Standard" } }
    - { id: c, text: { en: "Azure Firewall Premium", fr: "Pare-feu Azure Premium" } }
    - { id: d, text: { en: "Network security groups that use service tags on the spoke subnets", fr: "Des groupes de sécurité réseau utilisant des balises de service sur les sous-réseaux spoke" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Firewall Standard scales up to 30 Gbps, filters by threat intelligence in alert and deny mode, and supports FQDN filtering in network rules for any port and protocol, such as SFTP on port 22. It is the lowest SKU that meets every requirement, because Premium only adds features that aren't needed here, such as TLS inspection and IDPS.
    fr: |
      Le Pare-feu Azure Standard évolue jusqu'à 30 Gbit/s, filtre selon le renseignement sur les menaces en mode alerte et refus, et prend en charge le filtrage FQDN dans les règles de réseau pour tous les ports et protocoles, comme SFTP sur le port 22. C'est la plus petite référence SKU qui respecte toutes les exigences : Premium n'ajoute que des fonctionnalités inutiles ici, comme l'inspection TLS et l'IDPS.
  options:
    a:
      en: |
        The Basic SKU is limited to 250 Mbps, runs threat intelligence in alert mode only and doesn't support FQDN filtering in network rules.
      fr: |
        La référence SKU Basic est limitée à 250 Mbit/s, n'applique le renseignement sur les menaces qu'en mode alerte et ne prend pas en charge le filtrage FQDN dans les règles de réseau.
    c:
      en: |
        The Premium SKU meets the requirements but costs more, for TLS inspection, IDPS and URL filtering that aren't required.
      fr: |
        La référence SKU Premium respecte les exigences, mais coûte plus cher, pour l'inspection TLS, l'IDPS et le filtrage d'URL qui ne sont pas exigés.
    d:
      en: |
        Network security groups filter on IP addresses, ports and service tags; they can't filter by FQDN or by threat intelligence.
      fr: |
        Les groupes de sécurité réseau filtrent sur les adresses IP, les ports et les balises de service ; ils ne savent pas filtrer par FQDN ni selon le renseignement sur les menaces.
references:
  - title: Choose the right Azure Firewall SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/firewall/choose-firewall-sku
