id: az305-4c-mig-webapp-appservice
objective: "4.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys hosts an ASP.NET web application on IIS, on a single server that runs Windows Server 2016. The application uses only .NET Framework features and connects to a database on another server.

    You need to recommend a migration approach for the web application. The solution must meet the following requirements:

    - The operations team must no longer patch or manage an operating system.
    - The application code must not change.
    - The team has no container skills, and the effort must be minimized.

    What should you recommend?
  fr: |
    Wingtip Toys héberge une application web ASP.NET sur IIS, sur un seul serveur Windows Server 2016. L'application n'utilise que des fonctionnalités de .NET Framework et se connecte à une base de données située sur un autre serveur.

    Vous devez recommander une approche de migration pour l'application web. La solution doit répondre aux exigences suivantes :

    - L'équipe d'exploitation ne doit plus corriger ni gérer de système d'exploitation.
    - Le code de l'application ne doit pas changer.
    - L'équipe n'a aucune compétence en conteneurs, et l'effort doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Replicate the server to an Azure virtual machine by using Azure Migrate.", fr: "Répliquer le serveur vers une machine virtuelle Azure à l'aide d'Azure Migrate." } }
    - { id: b, text: { en: "Containerize the application and deploy it to Azure Kubernetes Service.", fr: "Conteneuriser l'application et la déployer dans Azure Kubernetes Service." } }
    - { id: c, text: { en: "Rewrite the application as functions hosted in Azure Functions.", fr: "Réécrire l'application sous forme de fonctions hébergées dans Azure Functions." } }
    - { id: d, text: { en: "Move the application to Azure App Service by using App Service Migration Assistant.", fr: "Déplacer l'application vers Azure App Service à l'aide d'App Service Migration Assistant." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure App Service is a managed platform: Microsoft maintains the operating system and the web server. App Service Migration Assistant migrates a standalone ASP.NET web app from a Windows server to App Service, where a standard ASP.NET application runs as it is: a replatform with the least effort.
    fr: |
      Azure App Service est une plateforme managée : Microsoft maintient le système d'exploitation et le serveur web. App Service Migration Assistant migre une application web ASP.NET autonome d'un serveur Windows vers App Service, où une application ASP.NET standard s'exécute telle quelle : un changement de plateforme au moindre effort.
  options:
    a:
      en: A rehost to a virtual machine keeps a Windows Server operating system that the team must still patch.
      fr: Un réhébergement sur une machine virtuelle conserve un système d'exploitation Windows Server que l'équipe doit encore corriger.
    b:
      en: Containers on AKS remove the server but require container and Kubernetes skills that the team doesn't have.
      fr: Des conteneurs sur AKS suppriment le serveur, mais exigent des compétences en conteneurs et en Kubernetes que l'équipe n'a pas.
    c:
      en: Rewriting the application for Azure Functions changes the code, which the requirements forbid.
      fr: Réécrire l'application pour Azure Functions modifie le code, ce que les exigences interdisent.
references:
  - title: .NET migration cases for Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/app-service-asp-net-migration
