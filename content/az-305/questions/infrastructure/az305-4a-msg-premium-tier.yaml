id: az305-4a-msg-premium-tier
objective: "4.2.1"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Woodgrove Bank plans an Azure Service Bus namespace for payment instructions.

    You need to recommend a tier for the namespace. The solution must meet the following requirements:

    - Messages carry signed documents of up to 5 MB.
    - The namespace is reachable only through a private endpoint.
    - Minimize cost.

    Which tier should you recommend?
  fr: |
    Woodgrove Bank prévoit un espace de noms Azure Service Bus pour des instructions de paiement.

    Vous devez recommander un niveau pour l'espace de noms. La solution doit répondre aux exigences suivantes :

    - Les messages transportent des documents signés pouvant atteindre 5 Mo.
    - L'espace de noms est joignable uniquement par un point de terminaison privé.
    - Réduire les coûts au minimum.

    Quel niveau devez-vous recommander ?
body:
  options:
    - { id: a, text: Basic }
    - { id: b, text: Standard }
    - { id: c, text: { en: "Standard, with partitioned queues", fr: "Standard, avec des files d'attente partitionnées" } }
    - { id: d, text: Premium }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Only the Premium tier accepts large messages, up to 100 MB, and supports private endpoints. The other tiers are cheaper, but the Standard tier is limited to 256 KB per message and has no private endpoint, so cost can't be reduced further.
    fr: |
      Seul le niveau Premium accepte les messages volumineux, jusqu'à 100 Mo, et prend en charge les points de terminaison privés. Les autres niveaux sont moins chers, mais le niveau Standard est limité à 256 Ko par message et n'a pas de point de terminaison privé ; le coût ne peut donc pas être réduit davantage.
  options:
    a:
      en: The Basic tier offers queues only, with small messages and no private endpoint.
      fr: Le niveau Basic ne propose que des files d'attente, avec de petits messages et sans point de terminaison privé.
    b:
      en: The Standard tier limits messages to 256 KB and doesn't support private endpoints.
      fr: Le niveau Standard limite les messages à 256 Ko et ne prend pas en charge les points de terminaison privés.
    c:
      en: Partitioning spreads a queue over several message brokers; it changes neither the message size limit nor the networking features of the Standard tier.
      fr: Le partitionnement répartit une file d'attente sur plusieurs répartiteurs de messages ; il ne change ni la limite de taille des messages ni les fonctionnalités réseau du niveau Standard.
references:
  - title: Azure Service Bus premium messaging tier
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-premium-messaging
