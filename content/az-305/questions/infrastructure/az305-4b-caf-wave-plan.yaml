id: az305-4b-caf-wave-plan
objective: "4.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank plans the migration of the following workloads to Azure, by following the Migrate methodology of the Microsoft Cloud Adoption Framework for Azure:

    - **App1**: an internal wiki that has a development environment and a production environment. It can be stopped during weekends.
    - **App2**: a payment application that has a strict SLA. It uses a database server named DB1.
    - **App3**: a reporting application that also uses DB1.

    Dependency analysis shows that App2 and App3 exchange data with DB1 permanently. This is the first migration project of the team.

    You need to recommend a migration plan that minimizes the risk.

    Which plan should you recommend?
  fr: |
    Woodgrove Bank planifie la migration des charges de travail suivantes vers Azure, en suivant la méthodologie Migrate du Microsoft Cloud Adoption Framework pour Azure :

    - **App1** : un wiki interne qui a un environnement de développement et un environnement de production. Il peut être arrêté pendant les week-ends.
    - **App2** : une application de paiement soumise à un SLA strict. Elle utilise un serveur de base de données nommé DB1.
    - **App3** : une application de reporting qui utilise aussi DB1.

    L'analyse des dépendances montre qu'App2 et App3 échangent en permanence des données avec DB1. Il s'agit du premier projet de migration de l'équipe.

    Vous devez recommander un plan de migration qui réduit le risque au minimum.

    Quel plan devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "Wave 1: App2, with a near-zero downtime migration. Wave 2: DB1 and App3. Wave 3: App1."
        fr: "Vague 1 : App2, avec une migration à interruption quasi nulle. Vague 2 : DB1 et App3. Vague 3 : App1."
    - id: b
      text:
        en: "Wave 1: App1, development then production, with a downtime migration. Wave 2: App2, App3 and DB1 together, with a near-zero downtime migration."
        fr: "Vague 1 : App1, développement puis production, avec une migration avec interruption. Vague 2 : App2, App3 et DB1 ensemble, avec une migration à interruption quasi nulle."
    - id: c
      text:
        en: "Wave 1: DB1, with a downtime migration. Wave 2: App2 and App3, with a near-zero downtime migration. Wave 3: App1."
        fr: "Vague 1 : DB1, avec une migration avec interruption. Vague 2 : App2 et App3, avec une migration à interruption quasi nulle. Vague 3 : App1."
    - id: d
      text:
        en: "A single wave: App1, App2, App3 and DB1 during the same weekend, with a downtime migration."
        fr: "Une seule vague : App1, App2, App3 et DB1 pendant le même week-end, avec une migration avec interruption."
answer: { optionId: b }
explanation:
  correct:
    en: "The planning guidance is to start with simpler workloads, to move non-production environments before production and to schedule critical systems after an initial success. Workloads that depend on each other migrate in the same wave, otherwise the service is disrupted. A downtime migration suits a workload that tolerates a planned outage; a near-zero downtime migration is for critical workloads with a strict SLA."
    fr: "Les conseils de planification sont de commencer par les charges de travail les plus simples, de déplacer les environnements hors production avant la production et de planifier les systèmes critiques après un premier succès. Les charges de travail qui dépendent les unes des autres migrent dans la même vague, sans quoi le service est perturbé. Une migration avec interruption convient à une charge de travail qui tolère une interruption planifiée ; une migration à interruption quasi nulle est destinée aux charges de travail critiques soumises à un SLA strict."
  options:
    a:
      en: "It starts with the most critical workload and separates App2 from the database server it depends on."
      fr: "Il commence par la charge de travail la plus critique et sépare App2 du serveur de base de données dont elle dépend."
    c:
      en: "Moving DB1 alone breaks the permanent exchanges with App2 and App3, and stopping DB1 interrupts the payment application."
      fr: "Déplacer DB1 seul rompt les échanges permanents avec App2 et App3, et l'arrêt de DB1 interrompt l'application de paiement."
    d:
      en: "A single wave gives the team no experience on a simple workload first, and a downtime migration does not suit the payment application."
      fr: "Une vague unique ne donne à l'équipe aucune expérience préalable sur une charge de travail simple, et une migration avec interruption ne convient pas à l'application de paiement."
references:
  - title: Plan your migration
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/migrate/plan-migration
