id: az305-4c-hyb-vwan
objective: "4.4.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has 70 retail branches, each with an internet link and a VPN-capable SD-WAN device, and two datacenters that each have an ExpressRoute circuit. The company's workloads run in virtual networks in four Azure regions.

    You need to recommend a connectivity solution. The solution must meet the following requirements:

    - Every branch must reach every virtual network and both datacenters.
    - Virtual networks in different regions must reach each other without a mesh of peerings or user-defined routes to maintain.
    - Microsoft must operate and scale the hub routers and gateways, to minimize administrative effort.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys compte 70 succursales de vente, chacune dotée d'une liaison Internet et d'un appareil SD-WAN compatible VPN, et deux centres de données qui disposent chacun d'un circuit ExpressRoute. Les charges de travail de l'entreprise s'exécutent dans des réseaux virtuels de quatre régions Azure.

    Vous devez recommander une solution de connectivité. La solution doit répondre aux exigences suivantes :

    - Chaque succursale doit atteindre chaque réseau virtuel et les deux centres de données.
    - Les réseaux virtuels de régions différentes doivent se joindre sans maillage de peerings ni itinéraires définis par l'utilisateur à maintenir.
    - Microsoft doit exploiter et mettre à l'échelle les routeurs et les passerelles des hubs, afin de réduire l'effort d'administration.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Service: [[svc]]

      Virtual WAN type: [[type]]
    fr: |
      Service : [[svc]]

      Type de WAN virtuel : [[type]]
  slots:
    - id: svc
      options:
        - { id: hub, text: { en: "A hub virtual network with a VPN gateway in each region", fr: "Un réseau virtuel hub avec une passerelle VPN dans chaque région" } }
        - { id: ars, text: { en: "Azure Route Server in each region", fr: "Azure Route Server dans chaque région" } }
        - { id: vwan, text: { en: "Azure Virtual WAN with a hub in each region", fr: "Azure Virtual WAN avec un hub dans chaque région" } }
        - { id: avnm, text: { en: "Azure Virtual Network Manager with a mesh topology", fr: "Azure Virtual Network Manager avec une topologie maillée" } }
    - id: type
      options:
        - { id: basic, text: "Basic" }
        - { id: standard, text: "Standard" }
answer:
  values: { svc: vwan, type: standard }
explanation:
  correct:
    en: |
      Azure Virtual WAN provides Microsoft-managed hubs that terminate site-to-site VPN, ExpressRoute and virtual network connections and route between all of them, including between hubs of different regions. The Standard type is required: a Basic virtual WAN only supports site-to-site VPN, without ExpressRoute, hub-to-hub or virtual network-to-virtual network transit.
    fr: |
      Azure Virtual WAN fournit des hubs gérés par Microsoft qui terminent les connexions VPN de site à site, ExpressRoute et de réseaux virtuels et assurent le routage entre toutes, y compris entre hubs de régions différentes. Le type Standard est exigé : un WAN virtuel de type Basic ne prend en charge que le VPN de site à site, sans ExpressRoute ni transit entre hubs ou entre réseaux virtuels.
  options:
    hub:
      en: Customer-managed hubs would work but leave the gateways, the peerings and the routes between regions to design and maintain.
      fr: Des hubs gérés par le client fonctionneraient, mais laissent les passerelles, les peerings et les itinéraires entre régions à concevoir et à maintenir.
    ars:
      en: Azure Route Server exchanges BGP routes with appliances in a virtual network; it terminates neither VPN tunnels nor ExpressRoute circuits.
      fr: Azure Route Server échange des itinéraires BGP avec des appliances dans un réseau virtuel ; il ne termine ni tunnels VPN ni circuits ExpressRoute.
    avnm:
      en: Azure Virtual Network Manager connects virtual networks to each other; it doesn't connect branches or datacenters.
      fr: Azure Virtual Network Manager relie des réseaux virtuels entre eux ; il ne connecte ni succursales ni centres de données.
    basic:
      en: A Basic virtual WAN only supports site-to-site VPN connections.
      fr: Un WAN virtuel de type Basic ne prend en charge que les connexions VPN de site à site.
references:
  - title: What is Azure Virtual WAN?
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-about
