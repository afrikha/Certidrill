id: az305-4d-lb-ha-ports
objective: "4.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso deploys two third-party firewall network virtual appliances (NVAs) in a hub virtual network. User-defined routes in the spoke subnets send the internet-bound traffic and the spoke-to-spoke traffic to a single next-hop IP address. The traffic uses TCP and UDP on many ports.

    You need to recommend a solution to make the NVAs highly available. The solution must meet the following requirements:

    - Both NVAs must process traffic at the same time.
    - If an NVA fails, traffic must continue through the other NVA without any change to the route tables.
    - A single rule must cover all ports and protocols.
    - Minimize costs.

    What should you recommend?
  fr: |
    Contoso déploie deux appliances virtuelles réseau (NVA) de pare-feu tierces dans un réseau virtuel hub. Des itinéraires définis par l'utilisateur dans les sous-réseaux spoke envoient le trafic à destination d'Internet et le trafic entre spokes vers une seule adresse IP de tronçon suivant. Le trafic utilise TCP et UDP sur de nombreux ports.

    Vous devez recommander une solution pour rendre les NVA hautement disponibles. La solution doit répondre aux exigences suivantes :

    - Les deux NVA doivent traiter le trafic en même temps.
    - Si une NVA tombe en panne, le trafic doit continuer par l'autre NVA sans aucune modification des tables de routage.
    - Une seule règle doit couvrir tous les ports et protocoles.
    - Réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An internal Standard load balancer with an HA ports rule, whose frontend IP address is the next hop of the routes", fr: "Un équilibreur de charge Standard interne avec une règle de ports HA, dont l'adresse IP frontale est le tronçon suivant des itinéraires" } }
    - { id: b, text: { en: "A public Standard load balancer with one load-balancing rule per port, whose frontend IP address is the next hop of the routes", fr: "Un équilibreur de charge Standard public avec une règle d'équilibrage de charge par port, dont l'adresse IP frontale est le tronçon suivant des itinéraires" } }
    - { id: c, text: { en: "A Gateway Load Balancer with the NVAs in its backend pool, chained to the spoke subnets", fr: "Un équilibreur de charge de passerelle avec les NVA dans son pool principal, chaîné aux sous-réseaux spoke" } }
    - { id: d, text: { en: "A Traffic Manager profile with the Priority routing method and the two NVAs as endpoints", fr: "Un profil Traffic Manager avec la méthode de routage Priority et les deux NVA comme points de terminaison" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An HA ports rule, configured with port 0 and protocol All, balances every TCP and UDP flow on every port of an internal Standard load balancer. The user-defined routes point to the frontend IP address of the load balancer, both NVAs in the backend pool are active, and the health probes remove a failed NVA from rotation, so no route needs to change. HA ports are only available on an internal Standard load balancer.
    fr: |
      Une règle de ports HA, configurée avec le port 0 et le protocole All, équilibre chaque flux TCP et UDP sur tous les ports d'un équilibreur de charge Standard interne. Les itinéraires définis par l'utilisateur pointent vers l'adresse IP frontale de l'équilibreur de charge, les deux NVA du pool principal sont actives et les sondes d'intégrité retirent une NVA en panne de la rotation : aucun itinéraire n'a à changer. Les ports HA ne sont disponibles que sur un équilibreur de charge Standard interne.
  options:
    b:
      en: |
        A public load balancer doesn't support HA ports, needs a rule per port, and its public frontend can't be the next hop of private routes.
      fr: |
        Un équilibreur de charge public ne prend pas en charge les ports HA, exige une règle par port, et son front-end public ne peut pas être le tronçon suivant d'itinéraires privés.
    c:
      en: |
        A Gateway Load Balancer is chained to the frontend of a Standard public load balancer or to the IP configuration of a virtual machine, not to subnets; it doesn't handle routed spoke-to-spoke traffic.
      fr: |
        Un équilibreur de charge de passerelle se chaîne au front-end d'un équilibreur de charge public Standard ou à la configuration IP d'une machine virtuelle, pas à des sous-réseaux ; il ne gère pas le trafic routé entre spokes.
    d:
      en: |
        Traffic Manager answers DNS queries; it can't be the next hop of a user-defined route.
      fr: |
        Traffic Manager répond à des requêtes DNS ; il ne peut pas être le tronçon suivant d'un itinéraire défini par l'utilisateur.
references:
  - title: High availability ports overview in Azure
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-ha-ports-overview
