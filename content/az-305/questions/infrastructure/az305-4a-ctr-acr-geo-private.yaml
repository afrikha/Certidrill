id: az305-4a-ctr-acr-geo-private
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs Azure Kubernetes Service (AKS) clusters in the West Europe, East US and Southeast Asia regions. All the clusters pull the same container images.

    You need to recommend a container registry design. The solution must meet the following requirements:

    - Developers push an image once, to a single registry name.
    - Each cluster pulls images from its own region.
    - The registry is reachable only through private endpoints.
    - Minimize administrative effort.

    What should you recommend?
  fr: |
    Fabrikam exécute des clusters Azure Kubernetes Service (AKS) dans les régions West Europe, East US et Southeast Asia. Tous les clusters tirent les mêmes images conteneur.

    Vous devez recommander une conception de registre de conteneurs. La solution doit répondre aux exigences suivantes :

    - Les développeurs envoient une image une seule fois, vers un nom de registre unique.
    - Chaque cluster tire les images depuis sa propre région.
    - Le registre est joignable uniquement par des points de terminaison privés.
    - Réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "One Basic registry in each of the three regions", fr: "Un registre Basic dans chacune des trois régions" } }
    - { id: b, text: { en: "One Standard registry in West Europe, with zone redundancy", fr: "Un registre Standard dans West Europe, avec la redondance de zone" } }
    - { id: c, text: { en: "One Premium registry in West Europe, geo-replicated to the two other regions", fr: "Un registre Premium dans West Europe, géorépliqué dans les deux autres régions" } }
    - { id: d, text: { en: "One Premium registry in each of the three regions, with images imported between them", fr: "Un registre Premium dans chacune des trois régions, avec importation des images entre eux" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Geo-replication and private endpoints are both features of the Premium tier of Azure Container Registry. A geo-replicated registry keeps a single name: an image pushed once is replicated to every region, and each cluster pulls from the replica in its region.
    fr: |
      La géoréplication et les points de terminaison privés sont deux fonctionnalités du niveau Premium d'Azure Container Registry. Un registre géorépliqué garde un nom unique : une image envoyée une fois est répliquée dans chaque région, et chaque cluster tire depuis le réplica de sa région.
  options:
    a:
      en: Three Basic registries have three names, no replication between them and no private endpoint support.
      fr: Trois registres Basic ont trois noms, aucune réplication entre eux et ne prennent pas en charge les points de terminaison privés.
    b:
      en: Zone redundancy protects the registry inside one region; the Standard tier offers neither geo-replication nor private endpoints.
      fr: La redondance de zone protège le registre à l'intérieur d'une région ; le niveau Standard n'offre ni la géoréplication ni les points de terminaison privés.
    d:
      en: Three Premium registries support private endpoints, but developers or a custom process must copy every image, under three registry names.
      fr: Trois registres Premium prennent en charge les points de terminaison privés, mais les développeurs ou un processus personnalisé doivent copier chaque image, sous trois noms de registre.
references:
  - title: Azure Container Registry SKU features and limits
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-skus
