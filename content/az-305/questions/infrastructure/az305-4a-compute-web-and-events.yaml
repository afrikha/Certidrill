id: az305-4a-compute-web-and-events
objective: "4.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is designing a new solution that has two components:

    - A customer-facing REST API written in .NET. New versions must be swapped into production without downtime by using deployment slots.
    - An image-resizing component that runs for a few seconds each time a file is uploaded to a blob container. Uploads are irregular, and the component must not be billed while no file is uploaded.

    The solution must minimize administrative effort.

    Which two services should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys conçoit une nouvelle solution composée de deux éléments :

    - Une API REST écrite en .NET et destinée aux clients. Les nouvelles versions doivent être basculées en production sans interruption grâce à des emplacements de déploiement.
    - Un composant de redimensionnement d'images qui s'exécute quelques secondes chaque fois qu'un fichier est chargé dans un conteneur d'objets blob. Les chargements sont irréguliers, et le composant ne doit pas être facturé tant qu'aucun fichier n'est chargé.

    La solution doit réduire au minimum l'effort d'administration.

    Quels sont les deux services à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Azure Kubernetes Service (AKS) }
    - { id: b, text: Azure App Service }
    - { id: c, text: { en: "Azure Virtual Machine Scale Sets", fr: "Groupes de machines virtuelles identiques Azure" } }
    - { id: d, text: Azure Functions }
    - { id: e, text: Azure Batch }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      App Service hosts the API on a managed platform and provides deployment slots that are swapped with production. Azure Functions runs the resizing code when a blob event occurs, scales to zero between uploads and bills per execution. Both are platform services with no server to manage.
    fr: |
      App Service héberge l'API sur une plateforme managée et fournit des emplacements de déploiement que l'on échange avec la production. Azure Functions exécute le code de redimensionnement lorsqu'un événement d'objet blob se produit, se met à l'échelle jusqu'à zéro entre les chargements et facture à l'exécution. Les deux sont des services de plateforme sans serveur à gérer.
  options:
    a:
      en: AKS could run both components, but you would operate a Kubernetes cluster that is billed even when nothing runs, and it has no deployment slots.
      fr: AKS pourrait exécuter les deux composants, mais vous exploiteriez un cluster Kubernetes facturé même quand rien ne s'exécute, et il n'a pas d'emplacements de déploiement.
    c:
      en: Scale sets are virtual machines to patch and manage, and they don't provide deployment slots or per-execution billing.
      fr: Les groupes de machines virtuelles identiques sont des machines virtuelles à corriger et à gérer, et n'offrent ni emplacements de déploiement ni facturation à l'exécution.
    e:
      en: Batch schedules large parallel jobs on pools of nodes; it isn't a web host or an event-driven function runtime.
      fr: Batch planifie de grands travaux parallèles sur des pools de nœuds ; ce n'est ni un hébergeur web ni un runtime de fonctions piloté par les événements.
references:
  - title: Choose an Azure compute service
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/compute-decision-tree
  - title: Azure Functions hosting options
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
