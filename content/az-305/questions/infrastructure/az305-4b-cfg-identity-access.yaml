id: az305-4b-cfg-identity-access
objective: "4.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders hosts a web application on Azure App Service. The application reads its settings from an Azure App Configuration store.

    You need to recommend how the application accesses the store. The solution must meet the following requirements:

    - Access key authentication will be disabled on the store.
    - The application must only be able to read the key-values of the store.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders héberge une application web sur Azure App Service. L'application lit ses paramètres dans un magasin Azure App Configuration.

    Vous devez recommander la façon dont l'application accède au magasin. La solution doit répondre aux exigences suivantes :

    - L'authentification par clé d'accès sera désactivée sur le magasin.
    - L'application doit seulement pouvoir lire les paires clé-valeur du magasin.

    Quelles sont les deux actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign the App Configuration Data Owner role on the store to the identity of the application", fr: "Attribuer le rôle App Configuration Data Owner sur le magasin à l'identité de l'application" } }
    - { id: b, text: { en: "Enable a managed identity on the web application", fr: "Activer une identité managée sur l'application web" } }
    - { id: c, text: { en: "Assign the Reader role on the store to the identity of the application", fr: "Attribuer le rôle Reader sur le magasin à l'identité de l'application" } }
    - { id: d, text: { en: "Store the connection string of the store in Azure Key Vault and reference it from an app setting", fr: "Stocker la chaîne de connexion du magasin dans Azure Key Vault et la référencer depuis un paramètre d'application" } }
    - { id: e, text: { en: "Assign the App Configuration Data Reader role on the store to the identity of the application", fr: "Attribuer le rôle App Configuration Data Reader sur le magasin à l'identité de l'application" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Without access keys, the store is accessed through Microsoft Entra ID: the web application needs a managed identity, and this identity needs a data plane role on the store. App Configuration Data Reader gives read access to the key-values and nothing more, which is the least privilege."
    fr: "Sans clés d'accès, l'accès au magasin passe par Microsoft Entra ID : l'application web a besoin d'une identité managée, et cette identité a besoin d'un rôle de plan de données sur le magasin. App Configuration Data Reader donne un accès en lecture aux paires clé-valeur et rien de plus, ce qui correspond au moindre privilège."
  options:
    a:
      en: "App Configuration Data Owner also allows writing and deleting key-values, which exceeds the requirement."
      fr: "App Configuration Data Owner autorise aussi l'écriture et la suppression de paires clé-valeur, ce qui dépasse l'exigence."
    c:
      en: "Reader is a control plane role: it shows the resource but grants no access to the data stored in App Configuration."
      fr: "Reader est un rôle de plan de contrôle : il montre la ressource mais ne donne aucun accès aux données stockées dans App Configuration."
    d:
      en: "A connection string contains an access key, and access key authentication will be disabled on the store."
      fr: "Une chaîne de connexion contient une clé d'accès, et l'authentification par clé d'accès sera désactivée sur le magasin."
references:
  - title: Access Azure App Configuration using Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-enable-rbac
