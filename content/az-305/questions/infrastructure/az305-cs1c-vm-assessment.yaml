id: az305-cs1c-vm-assessment
objective: "4.3.2"
type: multi
caseStudy: az305-cs1c-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend how to assess the virtual machines of the London datacenter. The solution must meet the migration requirements.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander la façon d'évaluer les machines virtuelles du centre de données de Londres. La solution doit répondre aux exigences de migration.

    Quelles sont les deux actions à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install the Azure Monitor Agent and the Dependency agent on each virtual machine.", fr: "Installer l'agent Azure Monitor et l'agent Dependency sur chaque machine virtuelle." } }
    - { id: b, text: { en: "Deploy an Azure Migrate appliance that connects to vCenter Server.", fr: "Déployer une appliance Azure Migrate qui se connecte au serveur vCenter." } }
    - { id: c, text: { en: "Create Azure VM assessments that use the As-is on-premises sizing criterion.", fr: "Créer des évaluations de machines virtuelles Azure qui utilisent le critère de dimensionnement As-is on-premises." } }
    - { id: d, text: { en: "Use the agentless dependency analysis of Azure Migrate.", fr: "Utiliser l'analyse des dépendances sans agent d'Azure Migrate." } }
    - { id: e, text: { en: "Deploy an Azure Site Recovery replication appliance in the datacenter.", fr: "Déployer une appliance de réplication Azure Site Recovery dans le centre de données." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      The Azure Migrate appliance discovers the VMware virtual machines through vCenter Server and collects their configuration and performance data without installing anything on them; performance-based assessments then check Azure readiness and recommend sizes from the measured utilization. Agentless dependency analysis also runs from the appliance: it captures the network connections between the servers, which shows the servers that must migrate together.
    fr: |
      L'appliance Azure Migrate découvre les machines virtuelles VMware par l'intermédiaire du serveur vCenter et collecte leurs données de configuration et de performances sans rien y installer ; des évaluations basées sur les performances vérifient ensuite la préparation pour Azure et recommandent des tailles d'après l'utilisation mesurée. L'analyse des dépendances sans agent s'exécute aussi depuis l'appliance : elle capture les connexions réseau entre les serveurs, ce qui montre les serveurs à migrer ensemble.
  options:
    a:
      en: Installing agents on the 320 virtual machines contradicts the requirement that no software be installed for the assessment.
      fr: Installer des agents sur les 320 machines virtuelles contredit l'exigence de n'installer aucun logiciel pour l'évaluation.
    c:
      en: As-is on-premises sizing keeps the current allocation of each server; the requirement asks for sizes based on measured utilization, which is performance-based sizing.
      fr: Le dimensionnement As-is on-premises conserve l'allocation actuelle de chaque serveur ; l'exigence demande des tailles fondées sur l'utilisation mesurée, c'est-à-dire un dimensionnement basé sur les performances.
    e:
      en: A Site Recovery replication appliance replicates servers for disaster recovery; it doesn't assess readiness, size or dependencies.
      fr: Une appliance de réplication Site Recovery réplique des serveurs pour la reprise d'activité ; elle n'évalue ni la préparation, ni la taille, ni les dépendances.
references:
  - title: Dependency analysis
    url: https://learn.microsoft.com/en-us/azure/migrate/concepts-dependency-visualization
