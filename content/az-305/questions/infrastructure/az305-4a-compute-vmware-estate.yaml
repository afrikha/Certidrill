id: az305-4a-compute-vmware-estate
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs 400 virtual machines on VMware vSphere in a datacenter whose lease ends in six months. The operations team manages the environment with vCenter Server and NSX.

    You need to recommend a target platform in Azure. The solution must meet the following requirements:

    - Move the virtual machines without converting them to another virtual machine format.
    - Let the operations team keep its VMware tools and procedures.

    What should you recommend?
  fr: |
    Contoso exécute 400 machines virtuelles sur VMware vSphere dans un centre de données dont le bail se termine dans six mois. L'équipe d'exploitation gère l'environnement avec vCenter Server et NSX.

    Vous devez recommander une plateforme cible dans Azure. La solution doit répondre aux exigences suivantes :

    - Déplacer les machines virtuelles sans les convertir dans un autre format de machine virtuelle.
    - Permettre à l'équipe d'exploitation de conserver ses outils et ses procédures VMware.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Virtual Machines, migrated by using Azure Migrate", fr: "Machines virtuelles Azure, migrées avec Azure Migrate" } }
    - { id: b, text: { en: "Azure Virtual Machines on Azure Dedicated Host", fr: "Machines virtuelles Azure sur Azure Dedicated Host" } }
    - { id: c, text: Azure VMware Solution }
    - { id: d, text: Azure Kubernetes Service (AKS) }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure VMware Solution provides private clouds made of vSphere clusters on dedicated Azure infrastructure, with vCenter Server, vSAN and NSX. The virtual machines stay VMware virtual machines and are moved with VMware HCX, and the team keeps the tools it already uses.
    fr: |
      Azure VMware Solution fournit des clouds privés composés de clusters vSphere sur une infrastructure Azure dédiée, avec vCenter Server, vSAN et NSX. Les machines virtuelles restent des machines virtuelles VMware et sont déplacées avec VMware HCX, et l'équipe conserve les outils qu'elle utilise déjà.
  options:
    a:
      en: Azure Migrate converts each VMware machine into a native Azure virtual machine, and vCenter Server and NSX no longer manage them.
      fr: Azure Migrate convertit chaque machine VMware en machine virtuelle Azure native, et vCenter Server et NSX ne les gèrent plus.
    b:
      en: Dedicated Host reserves physical servers for native Azure virtual machines; the machines would still be converted and managed with Azure tools.
      fr: Dedicated Host réserve des serveurs physiques à des machines virtuelles Azure natives ; les machines seraient tout de même converties et gérées avec les outils Azure.
    d:
      en: AKS runs containers; moving 400 virtual machines to it means rebuilding the applications.
      fr: AKS exécute des conteneurs ; y déplacer 400 machines virtuelles revient à reconstruire les applications.
references:
  - title: What is Azure VMware Solution?
    url: https://learn.microsoft.com/en-us/azure/azure-vmware/introduction
  - title: Choose an Azure compute service
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/compute-decision-tree
