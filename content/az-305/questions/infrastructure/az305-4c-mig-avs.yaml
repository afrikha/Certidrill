id: az305-4c-mig-avs
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware runs 800 virtual machines on VMware vSphere in a datacenter whose lease ends in five months.

    You need to recommend a migration target in Azure. The solution must meet the following requirements:

    - The operations team must keep using vCenter Server and its existing vSphere tooling.
    - The virtual machines must keep their IP addresses and must not be converted to another format.
    - The migration time must be minimized.

    What should you recommend?
  fr: |
    Proseware exécute 800 machines virtuelles sur VMware vSphere dans un centre de données dont le bail se termine dans cinq mois.

    Vous devez recommander une cible de migration dans Azure. La solution doit répondre aux exigences suivantes :

    - L'équipe d'exploitation doit continuer à utiliser vCenter Server et ses outils vSphere existants.
    - Les machines virtuelles doivent conserver leurs adresses IP et ne doivent pas être converties dans un autre format.
    - La durée de la migration doit être réduite au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure virtual machines, by using the agentless migration of Azure Migrate", fr: "Des machines virtuelles Azure, à l'aide de la migration sans agent d'Azure Migrate" } }
    - { id: b, text: { en: "Azure VMware Solution, by using VMware HCX", fr: "Azure VMware Solution, à l'aide de VMware HCX" } }
    - { id: c, text: { en: "Azure virtual machines on Azure Dedicated Host, by using Azure Migrate", fr: "Des machines virtuelles Azure sur Azure Dedicated Host, à l'aide d'Azure Migrate" } }
    - { id: d, text: { en: "Azure Kubernetes Service, by using application containerization", fr: "Azure Kubernetes Service, à l'aide de la conteneurisation des applications" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure VMware Solution is a VMware private cloud (vSphere, vSAN, NSX) that runs on dedicated Azure hosts. The virtual machines move as they are with VMware HCX, which can extend the on-premises networks so that the machines keep their IP addresses, and the team keeps administering them from vCenter Server.
    fr: |
      Azure VMware Solution est un cloud privé VMware (vSphere, vSAN, NSX) exécuté sur des hôtes Azure dédiés. Les machines virtuelles se déplacent telles quelles avec VMware HCX, qui peut étendre les réseaux locaux afin que les machines conservent leurs adresses IP, et l'équipe continue de les administrer depuis vCenter Server.
  options:
    a:
      en: Azure Migrate converts each machine to an Azure virtual machine, which is managed with Azure tools and receives an address of an Azure virtual network.
      fr: Azure Migrate convertit chaque machine en machine virtuelle Azure, administrée avec les outils Azure et dotée d'une adresse d'un réseau virtuel Azure.
    c:
      en: A dedicated host isolates Azure virtual machines on a physical server; the machines are still converted and vSphere tooling no longer applies.
      fr: Un hôte dédié isole des machines virtuelles Azure sur un serveur physique ; les machines sont tout de même converties et les outils vSphere ne s'appliquent plus.
    d:
      en: Containerizing 800 servers is a modernization project, far longer than a move as is, and it changes the format of every workload.
      fr: Conteneuriser 800 serveurs est un projet de modernisation, bien plus long qu'un déplacement tel quel, et il change le format de chaque charge de travail.
references:
  - title: What is Azure VMware Solution?
    url: https://learn.microsoft.com/en-us/azure/azure-vmware/introduction
