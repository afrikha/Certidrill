id: az305-cs1a-alignment-compute
objective: "4.1.5"
type: dropdown
caseStudy: az305-cs1a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a compute solution for the alignment jobs. The solution must meet the compute requirements.

    What should you include in the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution de calcul pour les travaux d'alignement. La solution doit répondre aux exigences de calcul.

    Que devez-vous inclure dans la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Service that runs the jobs: [[service]]

      Capacity used by the compute nodes: [[capacity]]
    fr: |
      Service qui exécute les travaux : [[service]]

      Capacité utilisée par les nœuds de calcul : [[capacity]]
  slots:
    - id: service
      options:
        - { id: cyclecloud, text: "Azure CycleCloud" }
        - { id: functions, text: "Azure Functions" }
        - { id: batch, text: "Azure Batch" }
    - id: capacity
      options:
        - { id: payg, text: { en: "Dedicated virtual machines at pay-as-you-go rates", fr: "Machines virtuelles dédiées au tarif du paiement à l'utilisation" } }
        - { id: spot, text: { en: "Spot virtual machines", fr: "Machines virtuelles Spot" } }
        - { id: reserved, text: { en: "Dedicated virtual machines covered by a one-year reservation", fr: "Machines virtuelles dédiées couvertes par une réservation d'un an" } }
answer:
  values: { service: batch, capacity: spot }
explanation:
  correct:
    en: |
      Azure Batch creates the pools, queues the jobs and schedules the tasks itself, so Trey Research has no scheduler to deploy, and a pool can be scaled down to zero nodes or deleted between two sequencing runs. The jobs are independent, can be delayed and resume from a checkpoint, which is the workload Spot virtual machines are made for: when a Spot node is preempted, Batch requeues the interrupted task on another node, and Spot capacity is sold at a reduced price.
    fr: |
      Azure Batch crée les pools, met les travaux en file d'attente et planifie lui-même les tâches : Trey Research n'a aucun planificateur à déployer, et un pool peut être réduit à zéro nœud ou supprimé entre deux campagnes de séquençage. Les travaux sont indépendants, peuvent être retardés et reprennent à partir d'un point de contrôle, ce qui correspond à la charge de travail visée par les machines virtuelles Spot : quand un nœud Spot est préempté, Batch remet la tâche interrompue en file d'attente sur un autre nœud, et la capacité Spot est vendue à prix réduit.
  options:
    cyclecloud:
      en: Azure CycleCloud deploys and manages clusters that run a scheduler such as Slurm or PBS Pro, which Trey Research doesn't want to operate.
      fr: Azure CycleCloud déploie et gère des clusters qui exécutent un planificateur tel que Slurm ou PBS Pro, ce que Trey Research ne veut pas exploiter.
    functions:
      en: Azure Functions targets short event-driven executions, not thousands of command-line jobs that each run for hours on compute nodes.
      fr: Azure Functions vise des exécutions courtes déclenchées par des événements, pas des milliers de travaux en ligne de commande qui durent chacun plusieurs heures sur des nœuds de calcul.
    payg:
      en: Dedicated nodes at pay-as-you-go rates work, but they cost more than Spot nodes although the jobs tolerate interruptions and delays.
      fr: Des nœuds dédiés au tarif du paiement à l'utilisation fonctionnent, mais ils coûtent plus cher que des nœuds Spot alors que les travaux tolèrent les interruptions et les retards.
    reserved:
      en: A reservation is billed for the whole year, including the days without any sequencing run.
      fr: Une réservation est facturée toute l'année, y compris les jours sans aucune campagne de séquençage.
references:
  - title: Use Spot VMs with Batch workloads
    url: https://learn.microsoft.com/en-us/azure/batch/batch-spot-vms
