id: az305-4b-dep-practices-yn
objective: "4.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders reviews the deployment practices of its Azure teams before it defines a company standard.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders passe en revue les pratiques de déploiement de ses équipes Azure avant de définir un standard d'entreprise.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A deployment stack created at the subscription scope can manage, as one unit, resources that it deploys in resource groups of that subscription."
        fr: "Une pile de déploiement créée à l'étendue de l'abonnement peut gérer, comme une seule unité, des ressources qu'elle déploie dans des groupes de ressources de cet abonnement."
    - id: s2
      text:
        en: "Azure Blueprints is the service to select for a new design that must remain supported after January 2027."
        fr: "Azure Blueprints est le service à retenir pour une nouvelle conception qui doit rester prise en charge après janvier 2027."
    - id: s3
      text:
        en: "In single revision mode, if the update of a container app fails, the traffic stays on the previous revision."
        fr: "En mode de révision unique, si la mise à jour d'une application conteneur échoue, le trafic reste sur la révision précédente."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "A deployment stack can be created at the resource group, subscription or management group scope; at the subscription scope it can deploy its template to resource groups of the subscription and manage the resources together. Azure Blueprints will be retired on January 31, 2027, and Microsoft recommends deployment stacks and template specs instead. In single revision mode, Container Apps keeps the traffic on the old revision until the new one is ready, and leaves it there if the update fails."
    fr: "Une pile de déploiement peut être créée à l'étendue d'un groupe de ressources, d'un abonnement ou d'un groupe d'administration ; à l'étendue de l'abonnement, elle peut déployer son modèle dans des groupes de ressources de l'abonnement et gérer les ressources ensemble. Azure Blueprints sera mis hors service le 31 janvier 2027, et Microsoft recommande à la place les piles de déploiement et les specs de modèle. En mode de révision unique, Container Apps maintient le trafic sur l'ancienne révision jusqu'à ce que la nouvelle soit prête, et l'y laisse si la mise à jour échoue."
references:
  - title: Create and deploy Azure deployment stacks in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deployment-stacks
  - title: Update and deploy changes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions
