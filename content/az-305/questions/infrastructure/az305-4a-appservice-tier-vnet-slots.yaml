id: az305-4a-appservice-tier-vnet-slots
objective: "4.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum plans to host a web app in Azure App Service. Users connect to the app from the internet. The app reads from an Azure SQL database that is reachable only through a private endpoint in a virtual network named VNet1.

    You need to recommend a configuration for the app. The solution must meet the following requirements:

    - The app must reach the database through VNet1.
    - Each of 12 feature teams needs its own deployment slot.
    - The app must scale out automatically.
    - Minimize cost.

    What should you recommend? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit d'héberger une application web dans Azure App Service. Les utilisateurs se connectent à l'application depuis Internet. L'application lit une base de données Azure SQL joignable uniquement par un point de terminaison privé dans un réseau virtuel nommé VNet1.

    Vous devez recommander une configuration pour l'application. La solution doit répondre aux exigences suivantes :

    - L'application doit atteindre la base de données en passant par VNet1.
    - Chacune des 12 équipes fonctionnelles a besoin de son propre emplacement de déploiement.
    - L'application doit effectuer automatiquement un scale-out.
    - Réduire les coûts au minimum.

    Que devez-vous recommander ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Create the App Service plan in the [[tier]] tier.
      To reach the database, configure [[net]].
    fr: |
      Créer le plan App Service au niveau [[tier]].
      Pour atteindre la base de données, configurer [[net]].
  slots:
    - id: tier
      options:
        - { id: basic, text: Basic }
        - { id: standard, text: Standard }
        - { id: premium, text: Premium v3 }
        - { id: isolated, text: Isolated v2 }
    - id: net
      options:
        - { id: pe, text: { en: "a private endpoint for the web app", fr: "un point de terminaison privé pour l'application web" } }
        - { id: vnetint, text: { en: "virtual network integration for the web app", fr: "l'intégration au réseau virtuel pour l'application web" } }
        - { id: restrict, text: { en: "access restrictions on the web app", fr: "des restrictions d'accès sur l'application web" } }
answer:
  values: { tier: premium, net: vnetint }
explanation:
  correct:
    en: |
      Twelve slots exceed the five staging slots of the Standard tier; the Premium tiers provide 20 slots per app, with autoscale. Virtual network integration routes the outbound calls of the app into VNet1, where the private endpoint of the database is reachable. The app itself stays public, as the users require.
    fr: |
      Douze emplacements dépassent les cinq emplacements de préproduction du niveau Standard ; les niveaux Premium fournissent 20 emplacements par application, avec la mise à l'échelle automatique. L'intégration au réseau virtuel achemine les appels sortants de l'application vers VNet1, où le point de terminaison privé de la base de données est joignable. L'application elle-même reste publique, comme l'exigent les utilisateurs.
  options:
    basic:
      en: Basic supports virtual network integration but has neither autoscale nor deployment slots.
      fr: Basic prend en charge l'intégration au réseau virtuel, mais n'a ni mise à l'échelle automatique ni emplacements de déploiement.
    standard:
      en: Standard has autoscale but only five staging slots per app.
      fr: Standard propose la mise à l'échelle automatique, mais seulement cinq emplacements de préproduction par application.
    isolated:
      en: Isolated v2 also provides 20 slots, but it requires an App Service Environment and costs more; no requirement asks for single-tenant isolation.
      fr: Isolated v2 fournit aussi 20 emplacements, mais exige un App Service Environment et coûte plus cher ; aucune exigence ne demande une isolation monolocataire.
    pe:
      en: A private endpoint for the web app handles inbound traffic to the app; it doesn't give the app a path to the database, and it would cut off internet users.
      fr: Un point de terminaison privé pour l'application web traite le trafic entrant vers l'application ; il ne donne pas à l'application un chemin vers la base de données et couperait l'accès des utilisateurs d'Internet.
    restrict:
      en: Access restrictions filter inbound requests to the app; they don't affect how the app reaches the database.
      fr: Les restrictions d'accès filtrent les requêtes entrantes vers l'application ; elles n'ont aucun effet sur la façon dont l'application atteint la base de données.
references:
  - title: What are Azure App Service plans?
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans
  - title: Azure subscription and service limits, quotas, and constraints
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/azure-subscription-service-limits
