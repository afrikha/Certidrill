id: az305-4a-sls-logic-apps-hosting
objective: "4.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys plans three workloads in Azure Logic Apps:

    - **Workload1**: a single workflow that runs a few times a week. It calls public SaaS services only and must be billed per execution.
    - **Workload2**: several workflows in one logic app resource. The workflows call an internal API through a private endpoint in a virtual network.
    - **Workload3**: workflows that must run on the infrastructure that Tailspin Toys manages in a factory with intermittent internet connectivity, and that process data locally.

    You need to recommend a hosting option for each workload.

    What should you recommend? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit trois charges de travail dans Azure Logic Apps :

    - **Workload1** : un seul workflow exécuté quelques fois par semaine. Il n'appelle que des services SaaS publics et doit être facturé à l'exécution.
    - **Workload2** : plusieurs workflows dans une même ressource d'application logique. Les workflows appellent une API interne par un point de terminaison privé dans un réseau virtuel.
    - **Workload3** : des workflows qui doivent s'exécuter sur l'infrastructure que Tailspin Toys gère dans une usine dont la connectivité Internet est intermittente, et qui traitent les données localement.

    Vous devez recommander une option d'hébergement pour chaque charge de travail.

    Que devez-vous recommander ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Workload1: [[w1]]
      Workload2: [[w2]]
      Workload3: [[w3]]
    fr: |
      Workload1 : [[w1]]
      Workload2 : [[w2]]
      Workload3 : [[w3]]
  slots:
    - id: w1
      options:
        - { id: cons, text: { en: "Consumption (multitenant)", fr: "Consumption (multilocataire)" } }
        - { id: std, text: { en: "Standard (Workflow Service Plan)", fr: "Standard (Workflow Service Plan)" } }
        - { id: hybrid, text: { en: "Standard (Hybrid)", fr: "Standard (Hybrid)" } }
    - id: w2
      options:
        - { id: cons, text: { en: "Consumption (multitenant)", fr: "Consumption (multilocataire)" } }
        - { id: std, text: { en: "Standard (Workflow Service Plan)", fr: "Standard (Workflow Service Plan)" } }
        - { id: hybrid, text: { en: "Standard (Hybrid)", fr: "Standard (Hybrid)" } }
    - id: w3
      options:
        - { id: cons, text: { en: "Consumption (multitenant)", fr: "Consumption (multilocataire)" } }
        - { id: std, text: { en: "Standard (Workflow Service Plan)", fr: "Standard (Workflow Service Plan)" } }
        - { id: hybrid, text: { en: "Standard (Hybrid)", fr: "Standard (Hybrid)" } }
answer:
  values: { w1: cons, w2: std, w3: hybrid }
explanation:
  correct:
    en: |
      A Consumption logic app holds one workflow, runs in the multitenant service and is billed per execution. A Standard logic app in a Workflow Service Plan runs in single-tenant Azure Logic Apps, holds several workflows and has integrated support for virtual networks and private endpoints. The Standard hybrid option runs the Logic Apps runtime on infrastructure that you own and manage, for partially connected environments that need local processing.
    fr: |
      Une application logique Consumption contient un seul workflow, s'exécute dans le service multilocataire et est facturée à l'exécution. Une application logique Standard dans un Workflow Service Plan s'exécute dans Azure Logic Apps monolocataire, contient plusieurs workflows et prend en charge de façon intégrée les réseaux virtuels et les points de terminaison privés. L'option Standard hybride exécute le runtime Logic Apps sur une infrastructure que vous possédez et gérez, pour les environnements partiellement connectés qui exigent un traitement local.
  options:
    cons:
      en: Consumption allows one workflow per resource and has no virtual network integration, and it runs only in Azure.
      fr: Consumption n'autorise qu'un workflow par ressource, n'a pas d'intégration au réseau virtuel et ne s'exécute que dans Azure.
    std:
      en: A Workflow Service Plan is billed through a hosting plan whatever the number of executions, and it runs in Azure, not on the factory infrastructure.
      fr: Un Workflow Service Plan est facturé par un plan d'hébergement quel que soit le nombre d'exécutions, et il s'exécute dans Azure, pas sur l'infrastructure de l'usine.
references:
  - title: Differences between Standard single-tenant logic apps versus Consumption multitenant logic apps
    url: https://learn.microsoft.com/en-us/azure/logic-apps/single-tenant-overview-compare
  - title: What is Azure Logic Apps?
    url: https://learn.microsoft.com/en-us/azure/logic-apps/logic-apps-overview
