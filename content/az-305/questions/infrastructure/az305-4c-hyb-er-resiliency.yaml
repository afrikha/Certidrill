id: az305-4c-hyb-er-resiliency
objective: "4.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum connects its headquarters to a hub virtual network through one ExpressRoute circuit. A risk assessment shows that a failure of the whole peering location would cut the headquarters off from Azure.

    You need to recommend a design that keeps the headquarters connected to the virtual network if the peering location fails.

    Which two options meet the goal? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum relie son siège à un réseau virtuel hub par un seul circuit ExpressRoute. Une analyse de risques montre qu'une défaillance de tout l'emplacement de peering couperait le siège d'Azure.

    Vous devez recommander une conception qui maintient le siège connecté au réseau virtuel si l'emplacement de peering tombe en panne.

    Quelles sont les deux options qui permettent d'atteindre l'objectif ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a second ExpressRoute circuit in a different peering location and connect it to the same virtual network.", fr: "Ajouter un second circuit ExpressRoute dans un autre emplacement de peering et le connecter au même réseau virtuel." } }
    - { id: b, text: { en: "Upgrade the existing circuit from the Standard SKU to the Premium SKU.", fr: "Faire passer le circuit existant de la référence SKU Standard à la référence SKU Premium." } }
    - { id: c, text: { en: "Add a site-to-site VPN connection as a backup path for the private peering of the circuit.", fr: "Ajouter une connexion VPN de site à site comme chemin de secours du peering privé du circuit." } }
    - { id: d, text: { en: "Enable ExpressRoute FastPath on the connection of the existing circuit.", fr: "Activer ExpressRoute FastPath sur la connexion du circuit existant." } }
    - { id: e, text: { en: "Increase the bandwidth of the existing circuit.", fr: "Augmenter la bande passante du circuit existant." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A standard circuit has its two connections in a single peering location, so only a path through another location survives a failure of that site. Two circuits in two distinct peering locations give the maximum resiliency. A site-to-site VPN connection is a passive backup: Azure prefers the ExpressRoute path while its routes exist and converges on the VPN tunnel when they disappear. Microsoft doesn't recommend the VPN backup for latency-sensitive or bandwidth-intensive workloads, but it does keep the site connected.
    fr: |
      Un circuit standard a ses deux connexions dans un seul emplacement de peering : seul un chemin passant par un autre emplacement survit à une défaillance de ce site. Deux circuits dans deux emplacements de peering distincts offrent la résilience maximale. Une connexion VPN de site à site constitue un secours passif : Azure préfère le chemin ExpressRoute tant que ses itinéraires existent et converge vers le tunnel VPN quand ils disparaissent. Microsoft ne recommande pas le secours par VPN pour les charges de travail sensibles à la latence ou gourmandes en bande passante, mais il maintient bien le site connecté.
  options:
    b:
      en: The Premium SKU extends the reach of the circuit to more regions and routes; the circuit still depends on the same peering location.
      fr: La référence SKU Premium étend la portée du circuit à davantage de régions et d'itinéraires ; le circuit dépend toujours du même emplacement de peering.
    d:
      en: FastPath improves the performance of the data path; it adds no redundancy.
      fr: FastPath améliore les performances du chemin de données ; il n'ajoute aucune redondance.
    e:
      en: More bandwidth on the same circuit doesn't protect against the loss of its peering location.
      fr: Davantage de bande passante sur le même circuit ne protège pas contre la perte de son emplacement de peering.
references:
  - title: Design and architect Azure ExpressRoute for resiliency
    url: https://learn.microsoft.com/en-us/azure/expressroute/design-architecture-for-resiliency
  - title: Using S2S VPN as a backup for ExpressRoute private peering
    url: https://learn.microsoft.com/en-us/azure/expressroute/use-s2s-vpn-as-backup-for-expressroute-privatepeering
