id: az305-4b-dep-appservice-release
objective: "4.2.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank hosts a web application on an Azure App Service plan in the Basic tier. Woodgrove Bank wants to automate its releases.

    You need to recommend a design that meets the following requirements:

    - New versions must be deployed to a staging slot and to a QA slot before they reach production.
    - Before a full release, 20 percent of the production users must receive the new version.
    - After a swap, the staging slot must still use the connection string of the test database.
    - The cost must be minimized.

    How should you complete the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank héberge une application web sur un plan App Service de niveau Basic. Woodgrove Bank veut automatiser ses mises en production.

    Vous devez recommander une conception qui répond aux exigences suivantes :

    - Les nouvelles versions doivent être déployées dans un emplacement de préproduction et dans un emplacement d'assurance qualité avant d'atteindre la production.
    - Avant une mise en production complète, 20 % des utilisateurs de production doivent recevoir la nouvelle version.
    - Après un échange, l'emplacement de préproduction doit toujours utiliser la chaîne de connexion de la base de données de test.
    - Le coût doit être réduit au minimum.

    Comment devez-vous compléter la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Scale up the App Service plan to the [[tier]] tier.

      To expose the new version to 20 percent of the users, [[traffic]].

      To keep the test connection string with the staging slot, [[sticky]].
    fr: |
      Faites monter en puissance le plan App Service vers le niveau [[tier]].

      Pour exposer la nouvelle version à 20 % des utilisateurs, [[traffic]].

      Pour que la chaîne de connexion de test reste avec l'emplacement de préproduction, [[sticky]].
  slots:
    - id: tier
      options:
        - { id: standard, text: Standard }
        - { id: premium, text: Premium }
        - { id: isolated, text: Isolated }
    - id: traffic
      options:
        - { id: autoswap, text: { en: "enable auto swap on the staging slot", fr: "activez l'échange automatique sur l'emplacement de préproduction" } }
        - { id: preview, text: { en: "perform a swap with preview", fr: "effectuez un échange avec aperçu" } }
        - { id: percent, text: { en: "set the traffic percentage of the staging slot to 20", fr: "définissez le pourcentage de trafic de l'emplacement de préproduction sur 20" } }
    - id: sticky
      options:
        - { id: kv, text: { en: "store the connection string in Azure Key Vault", fr: "stockez la chaîne de connexion dans Azure Key Vault" } }
        - { id: slotsetting, text: { en: "mark the connection string as a deployment slot setting", fr: "marquez la chaîne de connexion comme paramètre d'emplacement de déploiement" } }
        - { id: clone, text: { en: "clone the settings of the production slot", fr: "clonez les paramètres de l'emplacement de production" } }
answer:
  values: { tier: standard, traffic: percent, sticky: slotsetting }
explanation:
  correct:
    en: "Deployment slots require the Standard, Premium or Isolated tier; Standard, which supports five slots, is the least expensive and is enough for a staging and a QA slot. Setting the traffic percentage of a slot routes that share of the production clients to it at random. A connection string marked as a deployment slot setting is not swapped: it stays with its slot."
    fr: "Les emplacements de déploiement exigent le niveau Standard, Premium ou Isolated ; Standard, qui prend en charge cinq emplacements, est le moins coûteux et suffit pour un emplacement de préproduction et un emplacement d'assurance qualité. Définir le pourcentage de trafic d'un emplacement y route aléatoirement cette part des clients de production. Une chaîne de connexion marquée comme paramètre d'emplacement de déploiement n'est pas échangée : elle reste avec son emplacement."
  options:
    autoswap: { en: "Auto swap puts the whole new version in production as soon as it is deployed and warmed up.", fr: "L'échange automatique met toute la nouvelle version en production dès qu'elle est déployée et préchauffée." }
    preview: { en: "A swap with preview pauses the swap so that you can validate the staging slot; it sends no production users to it.", fr: "Un échange avec aperçu suspend l'échange pour vous laisser valider l'emplacement de préproduction ; il n'y envoie aucun utilisateur de production." }
    kv: { en: "A Key Vault reference protects the secret, but the setting that holds it is swapped unless it is marked as a slot setting.", fr: "Une référence Key Vault protège le secret, mais le paramètre qui la contient est échangé s'il n'est pas marqué comme paramètre d'emplacement." }
references:
  - title: Set up staging environments in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
