id: az305-4b-evt-hubs-order-multi
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders ingests point-of-sale events from 1,200 stores in an event hub of an Azure Event Hubs namespace in the Standard tier. The event hub has 16 partitions.

    You need to complete the design to meet the following requirements:

    - The events of a given store must be read in the order in which the store sent them.
    - A stock application and a finance application must each read all the events, without affecting the position of the other application in the stream.

    Which two elements should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders ingère les événements de caisse de 1 200 magasins dans un hub d'événements d'un espace de noms Azure Event Hubs de niveau Standard. Le hub d'événements compte 16 partitions.

    Vous devez compléter la conception pour répondre aux exigences suivantes :

    - Les événements d'un magasin donné doivent être lus dans l'ordre où le magasin les a envoyés.
    - Une application de stock et une application financière doivent chacune lire tous les événements, sans modifier la position de l'autre application dans le flux.

    Quels sont les deux éléments à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable Event Hubs Capture on the event hub", fr: "Activer Event Hubs Capture sur le hub d'événements" } }
    - { id: b, text: { en: "Publish each event with the store ID as the partition key", fr: "Publier chaque événement avec l'identifiant du magasin comme clé de partition" } }
    - { id: c, text: { en: "Enable auto-inflate on the namespace", fr: "Activer la majoration automatique (auto-inflate) sur l'espace de noms" } }
    - { id: d, text: { en: "Create one consumer group for each application", fr: "Créer un groupe de consommateurs pour chaque application" } }
    - { id: e, text: { en: "Enable log compaction on the event hub", fr: "Activer le compactage de journal sur le hub d'événements" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Events published with the same partition key land in the same partition, in the exact order of their arrival, so the events of a store stay ordered. A consumer group is an independent view of the stream with its own position: one group per application lets both read everything without interfering."
    fr: "Les événements publiés avec la même clé de partition arrivent dans la même partition, dans l'ordre exact de leur arrivée : les événements d'un magasin restent ordonnés. Un groupe de consommateurs est une vue indépendante du flux, avec sa propre position : un groupe par application permet aux deux de tout lire sans interférer."
  options:
    a:
      en: "Capture archives the events in Blob Storage or Data Lake Storage; it neither orders events nor separates readers."
      fr: "Capture archive les événements dans le Stockage Blob ou Data Lake Storage ; elle n'ordonne pas les événements et ne sépare pas les lecteurs."
    c:
      en: "Auto-inflate raises the number of throughput units under load; it has no effect on ordering or on reader positions."
      fr: "La majoration automatique augmente le nombre d'unités de débit sous la charge ; elle n'a aucun effet sur l'ordre ni sur la position des lecteurs."
    e:
      en: "Log compaction keeps only the latest event of each key, so the applications would no longer read all the events."
      fr: "Le compactage de journal ne conserve que le dernier événement de chaque clé : les applications ne liraient plus tous les événements."
references:
  - title: Event Hubs features and terminology
    url: https://learn.microsoft.com/en-us/azure/event-hubs/event-hubs-features
