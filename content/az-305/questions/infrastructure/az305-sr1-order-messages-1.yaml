stem:
  en: You recommend Azure Event Hubs with a partition key and two consumer groups.
  fr: Vous recommandez Azure Event Hubs avec une clé de partition et deux groupes de consommateurs.
body:
  solution:
    en: |
      You recommend **Azure Event Hubs**. The front end sends each order to an event hub and uses the customer ID as the partition key. Billing and Shipping each read the event hub through their own **consumer group**.
    fr: |
      Vous recommandez **Azure Event Hubs**. Le front-end envoie chaque commande à un hub d'événements et utilise l'identifiant du client comme clé de partition. Billing et Shipping lisent chacun le hub d'événements par leur propre **groupe de consommateurs**.
answer: { value: false }
explanation:
  correct:
    en: |
      Two requirements are met: each consumer group reads the whole stream independently, and events that share a partition key are kept in order inside one partition. But Event Hubs is a streaming service without duplicate detection: an order sent twice is stored twice and delivered twice to both services, which would have to detect the duplicate themselves. The third requirement fails.
    fr: |
      Deux exigences sont respectées : chaque groupe de consommateurs lit tout le flux de façon indépendante, et les événements qui partagent une clé de partition restent ordonnés à l'intérieur d'une même partition. Mais Event Hubs est un service de streaming sans détection des doublons : une commande envoyée deux fois est stockée deux fois et remise deux fois aux deux services, qui devraient détecter eux-mêmes le doublon. La troisième exigence n'est pas respectée.
references:
  - title: Choose between Azure Event Grid, Event Hubs, and Service Bus
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/compare-messaging-services
