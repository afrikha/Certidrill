id: az305-4b-caf-cutover-plan
objective: "4.3.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders prepares the cutover of two workloads according to the Migrate methodology of the Microsoft Cloud Adoption Framework for Azure. The requirements are the following:

    - **Training portal**: it is used during business hours only, a planned interruption during a weekend is accepted, and the simplest method must be used.
    - **Order API**: it is critical and has a strict SLA; the interruption of service must be minimal.
    - If a problem appears during the stabilization period that follows the cutover, Northwind Traders must be able to return quickly to the on-premises environment.

    How should you complete the plan? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders prépare la bascule de deux charges de travail selon la méthodologie Migrate du Microsoft Cloud Adoption Framework pour Azure. Les exigences sont les suivantes :

    - **Portail de formation** : il n'est utilisé que pendant les heures de bureau, une interruption planifiée pendant un week-end est acceptée, et la méthode la plus simple doit être utilisée.
    - **API de commandes** : elle est critique et soumise à un SLA strict ; l'interruption de service doit être minimale.
    - Si un problème apparaît pendant la période de stabilisation qui suit la bascule, Northwind Traders doit pouvoir revenir rapidement à l'environnement local.

    Comment devez-vous compléter le plan ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Training portal: [[m1]].

      Order API: [[m2]].

      Source servers after the cutover: [[src]].
    fr: |
      Portail de formation : [[m1]].

      API de commandes : [[m2]].

      Serveurs sources après la bascule : [[src]].
  slots:
    - id: m1
      options:
        - { id: nearzero, text: { en: "stop writes only for the final synchronization of continuously replicated data (near-zero downtime migration)", fr: "arrêter les écritures uniquement pour la synchronisation finale de données répliquées en continu (migration à interruption quasi nulle)" } }
        - { id: downtime, text: { en: "stop the workload, copy all the data, then restart it in Azure (downtime migration)", fr: "arrêter la charge de travail, copier toutes les données, puis la redémarrer dans Azure (migration avec interruption)" } }
        - { id: rebuild, text: { en: "redevelop the workload with cloud-native services (rebuild)", fr: "redévelopper la charge de travail avec des services natifs du cloud (rebuild)" } }
    - id: m2
      options:
        - { id: downtime, text: { en: "stop the workload, copy all the data, then restart it in Azure (downtime migration)", fr: "arrêter la charge de travail, copier toutes les données, puis la redémarrer dans Azure (migration avec interruption)" } }
        - { id: rebuild, text: { en: "redevelop the workload with cloud-native services (rebuild)", fr: "redévelopper la charge de travail avec des services natifs du cloud (rebuild)" } }
        - { id: nearzero, text: { en: "stop writes only for the final synchronization of continuously replicated data (near-zero downtime migration)", fr: "arrêter les écritures uniquement pour la synchronisation finale de données répliquées en continu (migration à interruption quasi nulle)" } }
    - id: src
      options:
        - { id: decom, text: { en: "decommission them on the day of the cutover", fr: "les désaffecter le jour de la bascule" } }
        - { id: reuse, text: { en: "reassign them at once to other workloads", fr: "les réaffecter aussitôt à d'autres charges de travail" } }
        - { id: fallback, text: { en: "keep them available as a fallback until the workload owners approve the decommissioning", fr: "les garder disponibles comme solution de repli jusqu'à ce que les propriétaires des charges de travail approuvent la désaffectation" } }
answer:
  values: { m1: downtime, m2: nearzero, src: fallback }
explanation:
  correct:
    en: "A downtime migration is the simpler method and suits workloads that tolerate a planned outage, such as the training portal. A near-zero downtime migration replicates the data continuously and pauses writes only for the final synchronization: it is more complex and reserved for critical workloads. After the cutover, the source environment is retained as a fallback during the stabilization period, and it is decommissioned only with the explicit approval of the workload owners."
    fr: "Une migration avec interruption est la méthode la plus simple et convient aux charges de travail qui tolèrent une interruption planifiée, comme le portail de formation. Une migration à interruption quasi nulle réplique les données en continu et ne suspend les écritures que pour la synchronisation finale : elle est plus complexe et réservée aux charges de travail critiques. Après la bascule, l'environnement source est conservé comme solution de repli pendant la période de stabilisation, et il n'est désaffecté qu'avec l'approbation explicite des propriétaires des charges de travail."
  options:
    rebuild: { en: "Rebuild is a migration strategy that redevelops the workload; it is not a cutover method and is not requested here.", fr: "Rebuild est une stratégie de migration qui redéveloppe la charge de travail ; ce n'est pas une méthode de bascule et elle n'est pas demandée ici." }
    decom: { en: "Decommissioning on the cutover day removes the possibility to return to the on-premises environment.", fr: "Désaffecter le jour de la bascule supprime la possibilité de revenir à l'environnement local." }
references:
  - title: Execute migration to cloud
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/migrate/execute-migration
  - title: Decommission source workloads after migration to cloud
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/migrate/decommission-source-workload
