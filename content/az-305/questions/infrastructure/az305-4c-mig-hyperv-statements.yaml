id: az305-4c-mig-hyperv-statements
objective: "4.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware plans to rehost 200 Hyper-V virtual machines as Azure virtual machines by using the migration tool of Azure Migrate.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de réhéberger 200 machines virtuelles Hyper-V sous forme de machines virtuelles Azure à l'aide de l'outil de migration d'Azure Migrate.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Litware can run a test migration of a virtual machine to an isolated virtual network while the on-premises virtual machine keeps running.
        fr: Litware peut exécuter une migration de test d'une machine virtuelle vers un réseau virtuel isolé pendant que la machine virtuelle locale continue de fonctionner.
    - id: s2
      text:
        en: Litware must install the Mobility service agent in each Hyper-V virtual machine before the replication starts.
        fr: Litware doit installer l'agent du service Mobilité dans chaque machine virtuelle Hyper-V avant le début de la réplication.
    - id: s3
      text:
        en: Litware must install replication software on the Hyper-V hosts.
        fr: Litware doit installer un logiciel de réplication sur les hôtes Hyper-V.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A test migration creates an Azure virtual machine from replicated data in the virtual network that you select, without touching the source machine or the ongoing replication. For Hyper-V, the migration is agentless inside the virtual machines: the replication is performed by providers (the Azure Site Recovery provider and the Recovery Services agent) that you install on the Hyper-V hosts or cluster nodes.
    fr: |
      Une migration de test crée une machine virtuelle Azure à partir des données répliquées dans le réseau virtuel que vous sélectionnez, sans toucher à la machine source ni à la réplication en cours. Pour Hyper-V, la migration est sans agent à l'intérieur des machines virtuelles : la réplication est assurée par des fournisseurs (le fournisseur Azure Site Recovery et l'agent Recovery Services) que vous installez sur les hôtes Hyper-V ou les nœuds du cluster.
references:
  - title: Migrate Hyper-V VMs to Azure
    url: https://learn.microsoft.com/en-us/azure/migrate/tutorial-migrate-hyper-v
