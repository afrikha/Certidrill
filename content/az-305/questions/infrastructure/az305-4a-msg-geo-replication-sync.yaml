id: az305-4a-msg-geo-replication-sync
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam processes orders through an Azure Service Bus Premium namespace in the West Europe region.

    You need to recommend a disaster recovery solution for an outage of the West Europe region. The solution must meet the following requirements:

    - The messages that are in the queues when the outage starts are available in the North Europe region after the switch.
    - No message that was acknowledged to a sender is lost (RPO of zero).
    - Applications keep the same namespace host name.

    What should you recommend?
  fr: |
    Fabrikam traite des commandes au moyen d'un espace de noms Azure Service Bus Premium dans la région West Europe.

    Vous devez recommander une solution de reprise d'activité pour une panne de la région West Europe. La solution doit répondre aux exigences suivantes :

    - Les messages présents dans les files d'attente au début de la panne sont disponibles dans la région North Europe après la bascule.
    - Aucun message dont la réception a été confirmée à un expéditeur n'est perdu (RPO de zéro).
    - Les applications conservent le même nom d'hôte d'espace de noms.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Geo-Disaster Recovery, with a pairing to a namespace in North Europe", fr: "Geo-Disaster Recovery, avec un jumelage à un espace de noms dans North Europe" } }
    - { id: b, text: { en: "Geo-Replication to North Europe, in synchronous mode", fr: "Geo-Replication vers North Europe, en mode synchrone" } }
    - { id: c, text: { en: "Geo-Replication to North Europe, in asynchronous mode", fr: "Geo-Replication vers North Europe, en mode asynchrone" } }
    - { id: d, text: { en: "Availability zones for the namespace in West Europe", fr: "Des zones de disponibilité pour l'espace de noms dans West Europe" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Geo-Replication, a Premium feature, replicates both the metadata and the data of the namespace: messages, their states and property changes. In synchronous mode, an operation is committed in both regions before the client is acknowledged, which gives an RPO of zero. The namespace keeps a single host name that points to the current primary region after a promotion.
    fr: |
      Geo-Replication, une fonctionnalité Premium, réplique à la fois les métadonnées et les données de l'espace de noms : les messages, leurs états et les modifications de propriétés. En mode synchrone, une opération est validée dans les deux régions avant la confirmation au client, ce qui donne un RPO de zéro. L'espace de noms garde un nom d'hôte unique qui pointe vers la région primaire actuelle après une promotion.
  options:
    a:
      en: Geo-Disaster Recovery replicates only the metadata (queues, topics, subscriptions, configuration); the messages stay in the failed region.
      fr: Geo-Disaster Recovery ne réplique que les métadonnées (files d'attente, rubriques, abonnements, configuration) ; les messages restent dans la région en panne.
    c:
      en: In asynchronous mode, the primary acknowledges before replicating, so a forced promotion can lose the messages within the replication lag.
      fr: En mode asynchrone, la région primaire confirme avant de répliquer ; une promotion forcée peut donc perdre les messages compris dans le retard de réplication.
    d:
      en: Availability zones protect the namespace against the failure of a datacenter inside West Europe, not against an outage of the whole region.
      fr: Les zones de disponibilité protègent l'espace de noms contre la défaillance d'un centre de données à l'intérieur de West Europe, pas contre une panne de toute la région.
references:
  - title: Azure Service Bus Geo-Replication
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-geo-replication
  - title: Azure Service Bus Geo-Disaster Recovery
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-geo-dr
