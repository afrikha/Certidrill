id: az305-cs3a-engineering-drawings
objective: "4.3.5"
type: single
caseStudy: az305-cs3a-vanarsdel
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a solution for the engineering drawings of FS01. The solution must meet the technical requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution pour les plans techniques de FS01. La solution doit satisfaire les exigences techniques.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Data Box to import the drawings into a blob container", fr: "Azure Data Box pour importer les plans dans un conteneur d'objets blob" } }
    - { id: b, text: { en: "Azure Storage Mover to migrate the drawings to an Azure file share", fr: "Azure Storage Mover pour migrer les plans vers un partage de fichiers Azure" } }
    - { id: c, text: { en: "AzCopy on a schedule to copy the drawings to a blob container", fr: "AzCopy selon une planification pour copier les plans vers un conteneur d'objets blob" } }
    - { id: d, text: { en: "Azure File Sync with cloud tiering to an Azure file share", fr: "Azure File Sync avec la hiérarchisation cloud vers un partage de fichiers Azure" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Azure File Sync synchronizes the shares of FS01 with an Azure file share, so every drawing is stored in Azure while users keep working on the server. With cloud tiering, only the frequently opened files stay on FS01. The others keep their entry in the namespace and are recalled from Azure when someone opens them, which frees most of the volume."
    fr: "Azure File Sync synchronise les partages de FS01 avec un partage de fichiers Azure : chaque plan est donc stocké dans Azure tandis que les utilisateurs continuent de travailler sur le serveur. Avec la hiérarchisation cloud, seuls les fichiers souvent ouverts restent sur FS01. Les autres gardent leur entrée dans l'espace de noms et sont rappelés depuis Azure lorsque quelqu'un les ouvre, ce qui libère la majeure partie du volume."
  options:
    a:
      en: "A Data Box moves a copy of the data offline, once. The drawings in the blob container are no longer reachable through the SMB share paths of FS01, and nothing is freed on the server."
      fr: "Une Data Box déplace une copie des données hors connexion, une seule fois. Les plans du conteneur d'objets blob ne sont plus accessibles par les chemins de partage SMB de FS01, et rien n'est libéré sur le serveur."
    b:
      en: "Storage Mover migrates the files to an Azure file share, to which users would then connect directly. The existing share paths of FS01 would no longer be the access point."
      fr: "Storage Mover migre les fichiers vers un partage de fichiers Azure, auquel les utilisateurs se connecteraient ensuite directement. Les chemins de partage existants de FS01 ne seraient plus le point d'accès."
    c:
      en: "AzCopy only copies files. The drawings would stay entirely on FS01, so the disk space used on the server wouldn't decrease."
      fr: "AzCopy ne fait que copier des fichiers. Les plans resteraient entièrement sur FS01 : l'espace disque utilisé sur le serveur ne diminuerait donc pas."
references:
  - title: What is Azure File Sync?
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-introduction
  - title: Azure File Sync cloud tiering overview
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-cloud-tiering-overview
