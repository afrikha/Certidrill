stem:
  en: You recommend Traffic Manager in front of a Standard load balancer in each region.
  fr: Vous recommandez Traffic Manager devant un équilibreur de charge Standard dans chaque région.
body:
  solution:
    en: |
      You recommend placing each scale set behind a public **Standard load balancer**, and creating an **Azure Traffic Manager** profile that uses the Performance routing method with the public IP addresses of the two load balancers as endpoints.
    fr: |
      Vous recommandez de placer chaque groupe de machines virtuelles identiques derrière un **équilibreur de charge Standard** public, et de créer un profil **Azure Traffic Manager** qui utilise la méthode de routage Performance avec les adresses IP publiques des deux équilibreurs de charge comme points de terminaison.
answer: { value: false }
explanation:
  correct:
    en: |
      Performance routing sends each user to the endpoint with the lowest latency and stops returning an endpoint that fails its health checks, so the first two requirements are met. But Traffic Manager only answers DNS queries and never sees the HTTP requests, and a Standard load balancer works at layer 4. Nothing in this design inspects the requests with a WAF.
    fr: |
      Le routage Performance envoie chaque utilisateur vers le point de terminaison à la latence la plus faible et cesse de renvoyer un point de terminaison dont les contrôles d'intégrité échouent : les deux premières exigences sont respectées. Mais Traffic Manager ne fait que répondre à des requêtes DNS et ne voit jamais les requêtes HTTP, et un équilibreur de charge Standard travaille en couche 4. Rien dans cette conception n'inspecte les requêtes avec un WAF.
references:
  - title: Load balancing options
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/load-balancing-overview
