id: az305-4a-batch-monte-carlo
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank runs a nightly risk calculation that consists of 50,000 independent Monte Carlo simulations. Each simulation is a command-line program that runs for a few minutes on one virtual machine and does not communicate with the other simulations.

    You need to recommend a compute solution. The solution must meet the following requirements:

    - The simulations are scheduled on a pool of virtual machines that the service creates and resizes.
    - Woodgrove Bank does not install or manage cluster or job scheduler software.

    What should you recommend?
  fr: |
    Woodgrove Bank exécute chaque nuit un calcul de risque composé de 50 000 simulations de Monte-Carlo indépendantes. Chaque simulation est un programme en ligne de commande qui s'exécute quelques minutes sur une machine virtuelle et ne communique pas avec les autres simulations.

    Vous devez recommander une solution de calcul. La solution doit répondre aux exigences suivantes :

    - Les simulations sont planifiées sur un pool de machines virtuelles que le service crée et redimensionne.
    - Woodgrove Bank n'installe et ne gère aucun logiciel de cluster ni de planification de travaux.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: Azure Batch }
    - { id: b, text: Azure CycleCloud }
    - { id: c, text: { en: "Kubernetes jobs on Azure Kubernetes Service (AKS)", fr: "Des travaux Kubernetes sur Azure Kubernetes Service (AKS)" } }
    - { id: d, text: { en: "A Virtual Machine Scale Set with a custom scheduler", fr: "Un groupe de machines virtuelles identiques avec un planificateur personnalisé" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Batch runs large-scale parallel jobs: it creates and manages the pool of compute nodes, installs the application and schedules the tasks, with no cluster or scheduler software to install. Monte Carlo simulations are a typical intrinsically parallel workload for Batch.
    fr: |
      Azure Batch exécute des travaux parallèles à grande échelle : il crée et gère le pool de nœuds de calcul, installe l'application et planifie les tâches, sans logiciel de cluster ni de planification à installer. Les simulations de Monte-Carlo sont une charge intrinsèquement parallèle typique de Batch.
  options:
    b:
      en: CycleCloud provisions the infrastructure of an HPC cluster, but you deploy and manage a scheduler such as Slurm yourself.
      fr: CycleCloud provisionne l'infrastructure d'un cluster HPC, mais vous déployez et gérez vous-même un planificateur tel que Slurm.
    c:
      en: Kubernetes jobs would require packaging the program as a container and operating a cluster.
      fr: Des travaux Kubernetes exigeraient d'empaqueter le programme en conteneur et d'exploiter un cluster.
    d:
      en: A scale set provides the virtual machines, but the scheduler would have to be written and maintained.
      fr: Un groupe de machines virtuelles identiques fournit les machines virtuelles, mais le planificateur devrait être écrit et maintenu.
references:
  - title: What is Azure Batch?
    url: https://learn.microsoft.com/en-us/azure/batch/batch-technical-overview
