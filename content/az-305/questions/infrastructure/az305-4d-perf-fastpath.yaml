id: az305-4d-perf-fastpath
objective: "4.4.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam connects its datacenter to Azure through a 10-Gbps ExpressRoute circuit from a connectivity provider. The circuit is linked to an ErGw1AZ ExpressRoute gateway in a hub virtual network named VNet-Hub in the West Europe region. Workload virtual networks are peered with VNet-Hub.

    Fabrikam plans to deploy virtual machines that will ingest large volumes of data from the datacenter. During a pilot, the ExpressRoute gateway limited the throughput.

    You need to recommend a solution. The solution must meet the following requirements:

    - The traffic from the datacenter to the virtual machines must bypass the ExpressRoute gateway in the data path.
    - The ExpressRoute gateway must remain zone-redundant.
    - The circuit must not be replaced.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam connecte son centre de données à Azure par un circuit ExpressRoute de 10 Gbit/s fourni par un fournisseur de connectivité. Le circuit est lié à une passerelle ExpressRoute ErGw1AZ dans un réseau virtuel hub nommé VNet-Hub, dans la région West Europe. Les réseaux virtuels des charges de travail sont reliés par peering à VNet-Hub.

    Fabrikam prévoit de déployer des machines virtuelles qui ingéreront de gros volumes de données provenant du centre de données. Lors d'un pilote, la passerelle ExpressRoute a limité le débit.

    Vous devez recommander une solution. La solution doit répondre aux exigences suivantes :

    - Le trafic du centre de données vers les machines virtuelles doit contourner la passerelle ExpressRoute dans le chemin des données.
    - La passerelle ExpressRoute doit rester redondante interzone.
    - Le circuit ne doit pas être remplacé.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      ExpressRoute feature to enable on the connection: [[feature]]

      ExpressRoute gateway SKU: [[sku]]

      Location of the ingestion virtual machines: [[placement]]
    fr: |
      Fonctionnalité ExpressRoute à activer sur la connexion : [[feature]]

      Référence SKU de la passerelle ExpressRoute : [[sku]]

      Emplacement des machines virtuelles d'ingestion : [[placement]]
  slots:
    - id: feature
      options:
        - { id: globalreach, text: "Global Reach" }
        - { id: fastpath, text: "FastPath" }
        - { id: msftpeering, text: { en: "Microsoft peering", fr: "Peering Microsoft" } }
    - id: sku
      options:
        - { id: ergw2az, text: "ErGw2AZ" }
        - { id: ultra, text: "Ultra Performance" }
        - { id: ergw3az, text: "ErGw3AZ" }
        - { id: ergw1az, text: { en: "ErGw1AZ (no change)", fr: "ErGw1AZ (sans changement)" } }
    - id: placement
      options:
        - { id: hub, text: { en: "VNet-Hub, the virtual network connected to the gateway", fr: "VNet-Hub, le réseau virtuel connecté à la passerelle" } }
        - { id: spoke, text: { en: "A new workload virtual network peered with VNet-Hub", fr: "Un nouveau réseau virtuel de charge de travail relié par peering à VNet-Hub" } }
answer:
  values: { feature: fastpath, sku: ergw3az, placement: hub }
explanation:
  correct:
    en: |
      FastPath sends the traffic from on-premises directly to the virtual machines, bypassing the gateway in the data path. It requires an Ultra Performance, ErGw3AZ or ErGwScale (10 scale units or more) gateway; ErGw3AZ is the listed SKU that is also zone-redundant. FastPath to virtual machines in peered virtual networks is only supported on ExpressRoute Direct, so with a provider circuit the virtual machines must be in the virtual network connected to the gateway.
    fr: |
      FastPath envoie le trafic local directement vers les machines virtuelles, en contournant la passerelle dans le chemin des données. Il exige une passerelle Ultra Performance, ErGw3AZ ou ErGwScale (au moins 10 unités d'échelle) ; ErGw3AZ est la référence SKU proposée qui est aussi redondante interzone. FastPath vers des machines virtuelles de réseaux virtuels reliés par peering n'est pris en charge qu'avec ExpressRoute Direct : avec un circuit de fournisseur, les machines virtuelles doivent se trouver dans le réseau virtuel connecté à la passerelle.
  options:
    globalreach:
      en: |
        Global Reach connects two on-premises sites through their ExpressRoute circuits; it doesn't change the path to Azure virtual machines.
      fr: |
        Global Reach relie deux sites locaux par leurs circuits ExpressRoute ; il ne change pas le chemin vers les machines virtuelles Azure.
    msftpeering:
      en: |
        Microsoft peering reaches the public endpoints of Microsoft services, not virtual machines in a virtual network.
      fr: |
        Le peering Microsoft atteint les points de terminaison publics des services Microsoft, pas des machines virtuelles d'un réseau virtuel.
    ultra:
      en: |
        Ultra Performance supports FastPath but isn't a zone-redundant SKU.
      fr: |
        Ultra Performance prend en charge FastPath, mais n'est pas une référence SKU redondante interzone.
    ergw2az:
      en: |
        ErGw2AZ is zone-redundant but doesn't support FastPath.
      fr: |
        ErGw2AZ est redondante interzone, mais ne prend pas en charge FastPath.
    spoke:
      en: |
        FastPath to peered virtual networks requires ExpressRoute Direct; with a provider circuit, that traffic still flows through the gateway.
      fr: |
        FastPath vers des réseaux virtuels reliés par peering exige ExpressRoute Direct ; avec un circuit de fournisseur, ce trafic passe toujours par la passerelle.
references:
  - title: "Azure ExpressRoute FastPath: Features, availability, and limitations"
    url: https://learn.microsoft.com/en-us/azure/expressroute/about-fastpath
