id: az305-4b-cfg-global-design
objective: "4.2.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Proseware operates a SaaS application in three Azure regions. The application reads its settings from one Azure App Configuration store.

    You need to recommend a design that meets the following requirements:

    - The instances of each region must read the settings from an endpoint in their own region, and use another region if their region fails.
    - The store must be covered by an SLA of 99.99 percent.
    - A new pricing engine must be enabled for 5 percent of the customers, then for a growing share of them, without a redeployment.

    How should you complete the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exploite une application SaaS dans trois régions Azure. L'application lit ses paramètres dans un seul magasin Azure App Configuration.

    Vous devez recommander une conception qui répond aux exigences suivantes :

    - Les instances de chaque région doivent lire les paramètres depuis un point de terminaison de leur propre région, et utiliser une autre région si la leur tombe en panne.
    - Le magasin doit être couvert par un SLA de 99,99 %.
    - Un nouveau moteur de tarification doit être activé pour 5 % des clients, puis pour une part croissante d'entre eux, sans redéploiement.

    Comment devez-vous compléter la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Create the store in the [[tier]] tier.

      For regional access and failover, [[geo]].

      To release the pricing engine progressively, use [[rollout]].
    fr: |
      Créez le magasin au niveau [[tier]].

      Pour l'accès régional et le basculement, [[geo]].

      Pour mettre à disposition le moteur de tarification progressivement, utilisez [[rollout]].
  slots:
    - id: tier
      options:
        - { id: developer, text: Developer }
        - { id: standard, text: Standard }
        - { id: premium, text: Premium }
    - id: geo
      options:
        - { id: snapshot, text: { en: "create a snapshot of the store for each region", fr: "créez un instantané du magasin pour chaque région" } }
        - { id: replica, text: { en: "add a replica of the store in each of the other regions", fr: "ajoutez un réplica du magasin dans chacune des autres régions" } }
        - { id: label, text: { en: "add a label for each region to every key-value", fr: "ajoutez une étiquette par région à chaque paire clé-valeur" } }
    - id: rollout
      options:
        - { id: timewindow, text: { en: "a feature flag with a time window filter", fr: "un indicateur de fonctionnalité avec un filtre de fenêtre de temps" } }
        - { id: kvref, text: { en: "a Key Vault reference", fr: "une référence Key Vault" } }
        - { id: sentinel, text: { en: "a sentinel key", fr: "une clé sentinelle" } }
        - { id: targeting, text: { en: "a feature flag with a targeting filter", fr: "un indicateur de fonctionnalité avec un filtre de ciblage" } }
answer:
  values: { tier: premium, geo: replica, rollout: targeting }
explanation:
  correct:
    en: "With geo-replication, the SLA is 99.95 % in the Standard tier and 99.99 % in the Premium tier, so Premium is required. Each replica is in a different region and has its own endpoint; the configuration providers fail over automatically to another replica. A feature flag with a targeting filter exposes a feature to a percentage of users that can be raised over time, with no deployment."
    fr: "Avec la géoréplication, le SLA est de 99,95 % au niveau Standard et de 99,99 % au niveau Premium : Premium est donc requis. Chaque réplica se trouve dans une région différente et possède son propre point de terminaison ; les fournisseurs de configuration basculent automatiquement vers un autre réplica. Un indicateur de fonctionnalité avec un filtre de ciblage expose une fonctionnalité à un pourcentage d'utilisateurs que l'on peut augmenter au fil du temps, sans déploiement."
  options:
    developer: { en: "The Developer tier has no SLA and no geo-replication.", fr: "Le niveau Developer n'a ni SLA ni géoréplication." }
    standard: { en: "The Standard tier reaches 99.95 % with geo-replication, below the requirement.", fr: "Le niveau Standard atteint 99,95 % avec la géoréplication, en deçà de l'exigence." }
    snapshot: { en: "A snapshot is an immutable set of key-values in the same store; it adds no regional endpoint.", fr: "Un instantané est un jeu immuable de paires clé-valeur dans le même magasin ; il n'ajoute aucun point de terminaison régional." }
    timewindow: { en: "A time window filter turns a feature on during a defined period for everyone, not for a percentage of users.", fr: "Un filtre de fenêtre de temps active une fonctionnalité pendant une période définie pour tout le monde, pas pour un pourcentage d'utilisateurs." }
    sentinel: { en: "A sentinel key tells applications when to reload their configuration; it does not select users.", fr: "Une clé sentinelle indique aux applications quand recharger leur configuration ; elle ne sélectionne pas d'utilisateurs." }
references:
  - title: Azure App Configuration FAQ
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/faq
  - title: Geo-replication overview
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-geo-replication
