id: az305-4a-ctr-aca-revisions-scale
objective: "4.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys hosts a storefront API and an order processor in Azure Container Apps.

    You need to recommend how to configure the two container apps. The solution must meet the following requirements:

    - A new version of the storefront API must first receive 10 percent of the requests, before the full rollout.
    - The order processor must run more replicas as the number of messages waiting in an Azure Service Bus queue grows, and no replica while the queue is empty.

    What should you recommend? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys héberge une API de vitrine et un processeur de commandes dans Azure Container Apps.

    Vous devez recommander la configuration des deux applications conteneur. La solution doit répondre aux exigences suivantes :

    - Une nouvelle version de l'API de vitrine doit d'abord recevoir 10 % des requêtes, avant le déploiement complet.
    - Le processeur de commandes doit exécuter davantage de réplicas à mesure que le nombre de messages en attente dans une file d'attente Azure Service Bus augmente, et aucun réplica tant que la file d'attente est vide.

    Que devez-vous recommander ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      For the storefront API, use [[release]].
      For the order processor, configure [[scale]].
    fr: |
      Pour l'API de vitrine, utiliser [[release]].
      Pour le processeur de commandes, configurer [[scale]].
  slots:
    - id: release
      options:
        - { id: slots, text: { en: "deployment slots", fr: "des emplacements de déploiement" } }
        - { id: revisions, text: { en: "revisions with traffic splitting", fr: "des révisions avec fractionnement du trafic" } }
        - { id: job, text: { en: "a Container Apps job", fr: "un travail Container Apps" } }
    - id: scale
      options:
        - { id: custom, text: { en: "a custom scale rule based on the queue", fr: "une règle de mise à l'échelle personnalisée basée sur la file d'attente" } }
        - { id: http, text: { en: "an HTTP scale rule", fr: "une règle de mise à l'échelle HTTP" } }
        - { id: tcp, text: { en: "a TCP scale rule", fr: "une règle de mise à l'échelle TCP" } }
answer:
  values: { release: revisions, scale: custom }
explanation:
  correct:
    en: |
      Container Apps keeps several revisions of an app active and splits the traffic between them by percentage, which is how a new version receives 10 percent of the requests. A custom scale rule uses a KEDA scaler, here the Service Bus scaler, to add replicas according to the queue length and to return to zero replicas when the queue is empty.
    fr: |
      Container Apps garde plusieurs révisions d'une application actives et fractionne le trafic entre elles par pourcentage : c'est ainsi qu'une nouvelle version reçoit 10 % des requêtes. Une règle de mise à l'échelle personnalisée utilise un scaler KEDA, ici celui de Service Bus, pour ajouter des réplicas selon la longueur de la file d'attente et revenir à zéro réplica quand la file d'attente est vide.
  options:
    slots:
      en: Deployment slots are a feature of App Service, not of Container Apps.
      fr: Les emplacements de déploiement sont une fonctionnalité d'App Service, pas de Container Apps.
    job:
      en: A job runs a task to completion and has no ingress; it can't serve part of the API traffic.
      fr: Un travail exécute une tâche jusqu'à son terme et n'a pas d'entrée (ingress) ; il ne peut pas servir une partie du trafic de l'API.
    http:
      en: An HTTP scale rule follows the number of concurrent HTTP requests; the order processor receives queue messages, not HTTP requests.
      fr: Une règle de mise à l'échelle HTTP suit le nombre de requêtes HTTP simultanées ; le processeur de commandes reçoit des messages de file d'attente, pas des requêtes HTTP.
    tcp:
      en: A TCP scale rule follows the number of concurrent TCP connections to the app, not the length of a queue.
      fr: Une règle de mise à l'échelle TCP suit le nombre de connexions TCP simultanées vers l'application, pas la longueur d'une file d'attente.
references:
  - title: Set scaling rules in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
  - title: Comparing Container Apps with other Azure container options
    url: https://learn.microsoft.com/en-us/azure/container-apps/compare-options
