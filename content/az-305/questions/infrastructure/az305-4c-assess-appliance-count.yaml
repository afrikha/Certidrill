id: az305-4c-assess-appliance-count
objective: "4.3.2"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Adatum plans to assess the following servers for a migration to Azure:

    - 6,000 virtual machines that run on 180 Hyper-V hosts
    - 700 physical servers that run Linux

    You plan to discover all the servers by using Azure Migrate appliances.

    What is the minimum number of Azure Migrate appliances that you should include in the recommendation?
  fr: |
    Adatum prévoit d'évaluer les serveurs suivants en vue d'une migration vers Azure :

    - 6 000 machines virtuelles exécutées sur 180 hôtes Hyper-V
    - 700 serveurs physiques sous Linux

    Vous prévoyez de découvrir tous les serveurs à l'aide d'appliances Azure Migrate.

    Quel est le nombre minimal d'appliances Azure Migrate à inclure dans la recommandation ?
body:
  options:
    - { id: a, text: "2" }
    - { id: b, text: "3" }
    - { id: c, text: "4" }
    - { id: d, text: "7" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An appliance is deployed for one type of source. An appliance for Hyper-V discovers up to 5,000 servers on up to 300 hosts, so 6,000 virtual machines need two appliances. An appliance for physical servers discovers up to 1,000 servers, so one is enough for the 700 Linux servers. The minimum is three appliances.
    fr: |
      Une appliance est déployée pour un seul type de source. Une appliance pour Hyper-V découvre jusqu'à 5 000 serveurs sur 300 hôtes au maximum : 6 000 machines virtuelles demandent donc deux appliances. Une appliance pour serveurs physiques découvre jusqu'à 1 000 serveurs : une seule suffit pour les 700 serveurs Linux. Le minimum est de trois appliances.
  options:
    a:
      en: Two appliances would leave either 1,000 Hyper-V virtual machines or the physical servers undiscovered.
      fr: Deux appliances laisseraient soit 1 000 machines virtuelles Hyper-V, soit les serveurs physiques sans découverte.
    c:
      en: A fourth appliance isn't needed, because 180 hosts stay under the limit of 300 hosts per Hyper-V appliance and 700 servers under the limit for physical servers.
      fr: Une quatrième appliance est inutile, car 180 hôtes restent sous la limite de 300 hôtes par appliance Hyper-V et 700 serveurs sous la limite des serveurs physiques.
    d:
      en: Seven appliances would correspond to a limit of 1,000 servers for every source type, which only applies to physical servers.
      fr: Sept appliances correspondraient à une limite de 1 000 serveurs pour chaque type de source, qui ne vaut que pour les serveurs physiques.
references:
  - title: Azure Migrate appliance
    url: https://learn.microsoft.com/en-us/azure/migrate/migrate-appliance
