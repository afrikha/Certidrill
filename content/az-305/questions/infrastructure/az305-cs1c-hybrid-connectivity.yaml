id: az305-cs1c-hybrid-connectivity
objective: "4.4.2"
type: single
caseStudy: az305-cs1c-humongous-insurance
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a solution that connects the London datacenter to the hub virtual network. The solution must meet the connectivity requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution qui connecte le centre de données de Londres au réseau virtuel hub. La solution doit répondre aux exigences de connectivité.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "One ExpressRoute circuit that is connected to a zone-redundant virtual network gateway", fr: "Un circuit ExpressRoute connecté à une passerelle de réseau virtuel redondante interzone" } }
    - { id: b, text: { en: "Two ExpressRoute circuits that are created in two different peering locations", fr: "Deux circuits ExpressRoute créés dans deux emplacements de peering différents" } }
    - { id: c, text: { en: "One ExpressRoute circuit and a site-to-site VPN connection that is used as a backup", fr: "Un circuit ExpressRoute et une connexion VPN de site à site utilisée en secours" } }
    - { id: d, text: { en: "Two ExpressRoute circuits that are created in the same peering location", fr: "Deux circuits ExpressRoute créés dans le même emplacement de peering" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      ExpressRoute is a private connection that doesn't cross the public internet. A circuit has two connections, but both end in the same peering location, the facility in which the provider connects to the Microsoft network. Two circuits created in two different peering locations keep a private path when a whole peering location is lost.
    fr: |
      ExpressRoute est une connexion privée qui ne traverse pas l'Internet public. Un circuit comporte deux connexions, mais toutes deux aboutissent au même emplacement de peering, le site dans lequel le fournisseur se raccorde au réseau Microsoft. Deux circuits créés dans deux emplacements de peering différents conservent un chemin privé quand un emplacement de peering entier est perdu.
  options:
    a:
      en: A zone-redundant gateway protects the Azure side against a zone failure; the single circuit still depends on one peering location.
      fr: Une passerelle redondante interzone protège le côté Azure contre la panne d'une zone ; le circuit unique dépend toujours d'un seul emplacement de peering.
    c:
      en: The tunnel of the VPN backup crosses the public internet whenever the circuit is down.
      fr: Le tunnel du VPN de secours traverse l'Internet public dès que le circuit est en panne.
    d:
      en: Two circuits in the same peering location are both lost when that location becomes unavailable.
      fr: Deux circuits dans le même emplacement de peering sont perdus ensemble quand cet emplacement devient indisponible.
references:
  - title: Design and architect Azure ExpressRoute for resiliency
    url: https://learn.microsoft.com/en-us/azure/expressroute/design-architecture-for-resiliency
