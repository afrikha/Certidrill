id: az305-4d-lb-afd-tier
objective: "4.4.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs a public web application on Azure App Service in the East US 2 and North Europe regions.

    You need to recommend a global load-balancing solution. The solution must meet the following requirements:

    - Route each user to the healthy region that has the lowest latency.
    - The App Service apps must receive traffic only through private connectivity, with public network access disabled on them.
    - Inspect requests with Microsoft-managed WAF rule sets and bot protection.
    - Minimize costs.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute une application web publique sur Azure App Service dans les régions East US 2 et North Europe.

    Vous devez recommander une solution d'équilibrage de charge global. La solution doit répondre aux exigences suivantes :

    - Router chaque utilisateur vers la région saine qui présente la latence la plus faible.
    - Les applications App Service ne doivent recevoir du trafic que par une connectivité privée, avec l'accès réseau public désactivé.
    - Inspecter les requêtes avec des ensembles de règles WAF managés par Microsoft et une protection contre les bots.
    - Réduire les coûts au minimum.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Service and tier: [[tier]]

      Connection from the service to the App Service apps: [[origin]]
    fr: |
      Service et niveau : [[tier]]

      Connexion du service aux applications App Service : [[origin]]
  slots:
    - id: tier
      options:
        - { id: afd-std, text: "Azure Front Door Standard" }
        - { id: afd-prem, text: "Azure Front Door Premium" }
        - { id: tm, text: { en: "Traffic Manager with the Performance routing method", fr: "Traffic Manager avec la méthode de routage Performance" } }
    - id: origin
      options:
        - { id: tag, text: { en: "Access restrictions that allow the AzureFrontDoor.Backend service tag", fr: "Des restrictions d'accès qui autorisent la balise de service AzureFrontDoor.Backend" } }
        - { id: vnetint, text: { en: "Virtual network integration of the App Service apps", fr: "L'intégration au réseau virtuel des applications App Service" } }
        - { id: pl, text: { en: "Private Link connections to the App Service origins", fr: "Des connexions Private Link vers les origines App Service" } }
answer:
  values: { tier: afd-prem, origin: pl }
explanation:
  correct:
    en: |
      Azure Front Door routes each request to the healthy origin with the lowest latency. Only the Premium tier offers Microsoft-managed rule sets, bot protection and Private Link connections to origins, so it is the cheapest option that meets every requirement. With Private Link, Front Door reaches App Service through a private endpoint that the app owner approves, so the apps no longer need a public endpoint.
    fr: |
      Azure Front Door route chaque requête vers l'origine saine dont la latence est la plus faible. Seul le niveau Premium offre les ensembles de règles managés par Microsoft, la protection contre les bots et les connexions Private Link vers les origines : c'est donc l'option la moins chère qui respecte toutes les exigences. Avec Private Link, Front Door atteint App Service par un point de terminaison privé approuvé par le propriétaire de l'application, qui n'a alors plus besoin d'un point de terminaison public.
  options:
    afd-std:
      en: |
        The Standard tier has no Microsoft-managed rule sets, no bot protection and no Private Link to origins.
      fr: |
        Le niveau Standard n'a ni ensembles de règles managés par Microsoft, ni protection contre les bots, ni Private Link vers les origines.
    tm:
      en: |
        Traffic Manager only answers DNS queries; it can't apply a WAF or connect privately to the apps.
      fr: |
        Traffic Manager ne fait que répondre à des requêtes DNS ; il ne peut ni appliquer un WAF ni se connecter de façon privée aux applications.
    tag:
      en: |
        Access restrictions based on the service tag still require public network access on the apps.
      fr: |
        Des restrictions d'accès basées sur la balise de service exigent toujours l'accès réseau public sur les applications.
    vnetint:
      en: |
        Virtual network integration only handles the outbound traffic of the apps; it doesn't make them reachable privately.
      fr: |
        L'intégration au réseau virtuel ne gère que le trafic sortant des applications ; elle ne les rend pas joignables de façon privée.
references:
  - title: Secure your Origin with Private Link in Azure Front Door Premium
    url: https://learn.microsoft.com/en-us/azure/frontdoor/private-link
  - title: Comparison between Azure Front Door and Azure Content Delivery Network
    url: https://learn.microsoft.com/en-us/azure/frontdoor/standard-premium/tier-comparison
