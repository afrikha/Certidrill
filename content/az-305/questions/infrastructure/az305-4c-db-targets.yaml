id: az305-4c-db-targets
objective: "4.3.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware plans to migrate three on-premises SQL Server workloads to Azure. Each workload must move to the compatible target that requires the least administration.

    Which target should you recommend for each workload? To answer, drag the appropriate targets to the correct workloads. Each target may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit de migrer trois charges de travail SQL Server locales vers Azure. Chaque charge de travail doit passer à la cible compatible qui demande le moins d'administration.

    Quelle cible devez-vous recommander pour chaque charge de travail ? Pour répondre, faites glisser les cibles appropriées vers les charges de travail correspondantes. Chaque cible peut être utilisée une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sqldb, text: "Azure SQL Database" }
    - { id: sqlmi, text: "Azure SQL Managed Instance" }
    - { id: sqlvm, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur Machines virtuelles Azure" } }
    - { id: pg, text: { en: "Azure Database for PostgreSQL", fr: "Azure Database pour PostgreSQL" } }
  targets:
    - id: t1
      text: { en: "A refactored application with one database that uses only database-scoped features", fr: "Une application refactorisée avec une seule base de données qui n'utilise que des fonctionnalités limitées à la base de données" }
    - id: t2
      text: { en: "An instance whose databases rely on SQL Server Agent jobs, cross-database queries and Service Broker, to move without code changes", fr: "Une instance dont les bases de données s'appuient sur des travaux SQL Server Agent, des requêtes entre bases de données et Service Broker, à déplacer sans modification du code" }
    - id: t3
      text: { en: "A vendor application that installs its own agent in the operating system and requires SQL Server Reporting Services on the same server", fr: "Une application d'éditeur qui installe son propre agent dans le système d'exploitation et exige SQL Server Reporting Services sur le même serveur" }
answer:
  mapping: { t1: sqldb, t2: sqlmi, t3: sqlvm }
explanation:
  correct:
    en: |
      Azure SQL Database is the most managed option and fits a database that only needs database-scoped features. Azure SQL Managed Instance offers near complete compatibility with the SQL Server engine, including instance-scoped features such as SQL Server Agent, cross-database queries and Service Broker, while staying a managed service. Access to the operating system, or to components installed next to the engine such as Reporting Services, requires SQL Server on a virtual machine.
    fr: |
      Azure SQL Database est l'option la plus managée et convient à une base de données qui n'a besoin que de fonctionnalités limitées à la base de données. Azure SQL Managed Instance offre une compatibilité presque complète avec le moteur SQL Server, y compris les fonctionnalités à l'échelle de l'instance comme SQL Server Agent, les requêtes entre bases de données et Service Broker, tout en restant un service managé. L'accès au système d'exploitation ou des composants installés à côté du moteur, comme Reporting Services, exigent SQL Server sur une machine virtuelle.
  options:
    pg:
      en: Moving to PostgreSQL changes the database engine and would require rewriting the database code.
      fr: Passer à PostgreSQL change le moteur de base de données et imposerait de réécrire le code des bases de données.
references:
  - title: What is Azure SQL?
    url: https://learn.microsoft.com/en-us/azure/azure-sql/azure-sql-iaas-vs-paas-what-is-overview
