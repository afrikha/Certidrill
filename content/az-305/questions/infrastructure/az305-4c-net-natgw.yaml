id: az305-4c-net-natgw
objective: "4.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a subnet that contains 40 virtual machines without public IP addresses. The virtual machines call a partner API over the internet. The partner only accepts calls that come from two public IP addresses declared in advance.

    You need to recommend an outbound connectivity solution. The solution must meet the following requirements:

    - All the outbound connections of the subnet must use the same static public IP addresses.
    - The virtual machines must not be reachable from the internet.
    - The outbound traffic doesn't need to be inspected.
    - The cost and the administrative effort must be minimized.

    What should you recommend?
  fr: |
    Contoso dispose d'un sous-réseau qui contient 40 machines virtuelles sans adresse IP publique. Les machines virtuelles appellent l'API d'un partenaire par Internet. Le partenaire n'accepte que les appels provenant de deux adresses IP publiques déclarées à l'avance.

    Vous devez recommander une solution de connectivité sortante. La solution doit répondre aux exigences suivantes :

    - Toutes les connexions sortantes du sous-réseau doivent utiliser les mêmes adresses IP publiques statiques.
    - Les machines virtuelles ne doivent pas être joignables depuis Internet.
    - Le trafic sortant n'a pas besoin d'être inspecté.
    - Le coût et l'effort d'administration doivent être réduits au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Standard public IP address on each virtual machine", fr: "Une adresse IP publique Standard sur chaque machine virtuelle" } }
    - { id: b, text: { en: "Azure Firewall with a default route on the subnet", fr: "Pare-feu Azure avec un itinéraire par défaut sur le sous-réseau" } }
    - { id: c, text: { en: "A NAT gateway associated with the subnet", fr: "Une passerelle NAT associée au sous-réseau" } }
    - { id: d, text: { en: "A service endpoint enabled on the subnet", fr: "Un point de terminaison de service activé sur le sous-réseau" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A NAT gateway associated with a subnet translates every outbound connection of that subnet to its own static public IP addresses or prefix, and it never accepts connections initiated from the internet. It is a managed service with no routes to maintain, and it costs less than a firewall when no inspection is needed.
    fr: |
      Une passerelle NAT associée à un sous-réseau traduit chaque connexion sortante de ce sous-réseau vers ses propres adresses IP publiques statiques ou son préfixe, et n'accepte jamais de connexion lancée depuis Internet. C'est un service managé sans itinéraire à maintenir, et il coûte moins cher qu'un pare-feu quand aucune inspection n'est nécessaire.
  options:
    a:
      en: One public IP address per machine gives 40 different outbound addresses and exposes each machine to inbound connections.
      fr: Une adresse IP publique par machine donne 40 adresses sortantes différentes et expose chaque machine aux connexions entrantes.
    b:
      en: Azure Firewall would work with static addresses, but it costs more and adds routes to manage for an inspection that isn't required.
      fr: Le Pare-feu Azure fonctionnerait avec des adresses statiques, mais il coûte plus cher et ajoute des itinéraires à gérer pour une inspection qui n'est pas exigée.
    d:
      en: A service endpoint only reaches Azure services over the Microsoft backbone; it doesn't give access to a partner API on the internet.
      fr: Un point de terminaison de service n'atteint que des services Azure par le réseau principal de Microsoft ; il ne donne pas accès à l'API d'un partenaire sur Internet.
references:
  - title: What is Azure NAT Gateway?
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
