id: az305-4d-lb-global-tier
objective: "4.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys hosts multiplayer game servers that use UDP on virtual machine scale sets in three Azure regions. In each region, the scale set is behind a regional Standard public load balancer.

    You need to recommend a solution to publish the game servers. The solution must meet the following requirements:

    - Game clients must use a single static public IP address, hard-coded in the client.
    - Each player must reach the closest healthy region.
    - If a region fails, new connections must move to another region without depending on DNS caches.
    - The game servers must see the original IP address of each player.

    What should you recommend?
  fr: |
    Tailspin Toys héberge des serveurs de jeu multijoueur qui utilisent UDP sur des groupes de machines virtuelles identiques dans trois régions Azure. Dans chaque région, le groupe identique se trouve derrière un équilibreur de charge public Standard régional.

    Vous devez recommander une solution pour publier les serveurs de jeu. La solution doit répondre aux exigences suivantes :

    - Les clients de jeu doivent utiliser une seule adresse IP publique statique, codée en dur dans le client.
    - Chaque joueur doit atteindre la région saine la plus proche.
    - En cas de panne d'une région, les nouvelles connexions doivent passer vers une autre région sans dépendre des caches DNS.
    - Les serveurs de jeu doivent voir l'adresse IP d'origine de chaque joueur.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Traffic Manager profile with the Performance routing method", fr: "Un profil Traffic Manager avec la méthode de routage Performance" } }
    - { id: b, text: { en: "A global tier Azure Load Balancer with the three regional load balancers in its backend pool", fr: "Un Azure Load Balancer de niveau global avec les trois équilibreurs de charge régionaux dans son pool principal" } }
    - { id: c, text: { en: "An Azure Front Door Premium profile with the three load balancers as origins", fr: "Un profil Azure Front Door Premium avec les trois équilibreurs de charge comme origines" } }
    - { id: d, text: { en: "A Gateway Load Balancer chained to the three regional load balancers", fr: "Un équilibreur de charge de passerelle chaîné aux trois équilibreurs de charge régionaux" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The global tier of Azure Load Balancer provides one static public IP address in front of regional Standard public load balancers. Traffic enters at the participating region closest to the client and goes to the closest healthy regional deployment; a failed region is taken out of rotation without any DNS change. It is a layer 4 pass-through load balancer, so it supports UDP and preserves the client IP address.
    fr: |
      Le niveau global d'Azure Load Balancer fournit une adresse IP publique statique unique devant des équilibreurs de charge publics Standard régionaux. Le trafic entre dans la région participante la plus proche du client et va vers le déploiement régional sain le plus proche ; une région en panne est retirée de la rotation sans aucune modification DNS. C'est un équilibreur de charge de couche 4 en mode pass-through : il prend en charge UDP et conserve l'adresse IP du client.
  options:
    a:
      en: |
        Traffic Manager returns the address of a region in a DNS answer, so clients don't use a single IP address and failover depends on DNS caching.
      fr: |
        Traffic Manager renvoie l'adresse d'une région dans une réponse DNS : les clients n'utilisent pas une adresse IP unique et le basculement dépend de la mise en cache DNS.
    c:
      en: |
        Azure Front Door only proxies HTTP and HTTPS traffic; it can't carry a UDP game protocol.
      fr: |
        Azure Front Door ne sert de proxy qu'au trafic HTTP et HTTPS ; il ne peut pas transporter un protocole de jeu UDP.
    d:
      en: |
        A Gateway Load Balancer inserts network virtual appliances in the path of a public endpoint; it doesn't distribute traffic between regions.
      fr: |
        Un équilibreur de charge de passerelle insère des appliances virtuelles réseau dans le chemin d'un point de terminaison public ; il ne répartit pas le trafic entre régions.
references:
  - title: Global load balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/cross-region-overview
