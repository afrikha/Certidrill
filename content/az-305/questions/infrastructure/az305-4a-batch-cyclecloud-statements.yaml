id: az305-4a-batch-cyclecloud-statements
objective: "4.1.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Litware must choose between Azure Batch and Azure CycleCloud for a new high-performance computing workload.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware doit choisir entre Azure Batch et Azure CycleCloud pour une nouvelle charge de calcul haute performance.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: With Azure Batch, Litware pays a fee for the Batch service in addition to the compute, storage and networking resources that the jobs consume.
        fr: Avec Azure Batch, Litware paie des frais pour le service Batch en plus des ressources de calcul, de stockage et de réseau que les travaux consomment.
    - id: s2
      text:
        en: With Azure Batch, Litware must deploy a head node that runs the job scheduler.
        fr: Avec Azure Batch, Litware doit déployer un nœud principal qui exécute le planificateur de travaux.
    - id: s3
      text:
        en: With Azure CycleCloud, Litware manages the scheduler, and CycleCloud provisions and autoscales the infrastructure.
        fr: Avec Azure CycleCloud, Litware gère le planificateur, et CycleCloud provisionne et met à l'échelle automatiquement l'infrastructure.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Batch has no charge of its own: you pay only for the underlying virtual machines, storage and networking. Batch is a scheduler as a service that manages pools, jobs and tasks, with no scheduler software to install. CycleCloud is not a scheduler: it deploys a scheduler such as Slurm or PBS Pro that you manage, and it provisions and autoscales the Azure infrastructure of the cluster.
    fr: |
      Batch n'a pas de frais propres : vous ne payez que les machines virtuelles, le stockage et le réseau sous-jacents. Batch est un planificateur en tant que service qui gère les pools, les travaux et les tâches, sans logiciel de planification à installer. CycleCloud n'est pas un planificateur : il déploie un planificateur comme Slurm ou PBS Pro que vous gérez, et il provisionne et met à l'échelle automatiquement l'infrastructure Azure du cluster.
references:
  - title: What is Azure Batch?
    url: https://learn.microsoft.com/en-us/azure/batch/batch-technical-overview
  - title: What is Azure CycleCloud?
    url: https://learn.microsoft.com/en-us/azure/cyclecloud/overview
