id: az305-4b-evt-hubs-tier
objective: "4.2.2"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Litware collects telemetry from 40,000 connected vehicles, about 600,000 events per minute, in Azure Event Hubs.

    You need to recommend a tier for the Event Hubs namespace. The solution must meet the following requirements:

    - A real-time dashboard, a billing service and a fraud detection job must each read the complete stream independently, at their own pace.
    - Each application must be able to reread the events of the last five days.
    - The cost must be minimized.

    Which tier should you recommend?
  fr: |
    Litware collecte la télémétrie de 40 000 véhicules connectés, soit environ 600 000 événements par minute, dans Azure Event Hubs.

    Vous devez recommander un niveau pour l'espace de noms Event Hubs. La solution doit répondre aux exigences suivantes :

    - Un tableau de bord en temps réel, un service de facturation et un travail de détection des fraudes doivent chacun lire le flux complet de façon indépendante, à leur propre rythme.
    - Chaque application doit pouvoir relire les événements des cinq derniers jours.
    - Le coût doit être réduit au minimum.

    Quel niveau devez-vous recommander ?
body:
  options:
    - { id: a, text: Basic }
    - { id: b, text: Standard }
    - { id: c, text: Premium }
    - { id: d, text: Dedicated }
answer: { optionId: b }
explanation:
  correct:
    en: "The Standard tier allows up to 20 consumer groups per event hub, so each of the three applications gets its own view of the stream, and it retains events for up to 7 days. It is the least expensive tier that offers both."
    fr: "Le niveau Standard autorise jusqu'à 20 groupes de consommateurs par hub d'événements : chacune des trois applications dispose de sa propre vue du flux, et les événements sont conservés jusqu'à 7 jours. C'est le niveau le moins coûteux qui offre les deux."
  options:
    a:
      en: "The Basic tier has a single consumer group per event hub and retains events for one day only."
      fr: "Le niveau Basic n'a qu'un seul groupe de consommateurs par hub d'événements et ne conserve les événements qu'un jour."
    c:
      en: "The Premium tier meets the requirements (100 consumer groups, 90 days), but its isolated processing units cost more than what is needed here."
      fr: "Le niveau Premium répond aux exigences (100 groupes de consommateurs, 90 jours), mais ses unités de traitement isolées coûtent plus que nécessaire ici."
    d:
      en: "A Dedicated cluster is a single-tenant offer for the highest volumes; it meets the requirements at a much higher cost."
      fr: "Un cluster Dedicated est une offre monolocataire destinée aux volumes les plus élevés ; il répond aux exigences pour un coût bien supérieur."
references:
  - title: Compare Azure Event Hubs tiers
    url: https://learn.microsoft.com/en-us/azure/event-hubs/compare-tiers
