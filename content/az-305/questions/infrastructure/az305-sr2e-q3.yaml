stem:
  en: |
    You recommend the Premium plan with virtual network integration.
  fr: |
    Vous recommandez le plan Premium avec l'intégration au réseau virtuel.
body:
  solution:
    en: |
      You recommend hosting Func1 in a **Premium** plan with **virtual network integration** to a subnet of VNet1. The plan scales out on the number of messages in the queue, and the function timeout keeps its default value.
    fr: |
      Vous recommandez d'héberger Func1 dans un plan **Premium** avec l'**intégration au réseau virtuel** dans un sous-réseau de VNet1. Le plan augmente le nombre d'instances selon le nombre de messages de la file d'attente, et le délai d'expiration des fonctions conserve sa valeur par défaut.
answer: { value: false }
explanation:
  correct:
    en: |
      The Premium plan meets the first two requirements: it supports virtual network integration and its timeout is 30 minutes by default. But a Premium plan never scales to zero: it always keeps at least one active instance, which is billed whether or not functions execute. Tailspin Toys would pay for compute during the hours when the queue is empty.
    fr: |
      Le plan Premium satisfait les deux premières exigences : il prend en charge l'intégration au réseau virtuel et son délai d'expiration est de 30 minutes par défaut. Mais un plan Premium n'est jamais mis à l'échelle jusqu'à zéro : il conserve toujours au moins une instance active, facturée que des fonctions s'exécutent ou non. Tailspin Toys paierait du calcul pendant les heures où la file d'attente est vide.
references:
