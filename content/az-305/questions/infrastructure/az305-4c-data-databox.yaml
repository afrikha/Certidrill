id: az305-4c-data-databox
objective: "4.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso must move 90 TB of video archives from an on-premises NAS to Azure Blob Storage. The datacenter has a 100-Mbps internet link that is shared with production applications.

    The transfer happens only once and must be finished within three weeks. Contoso wants Microsoft to supply the transfer equipment.

    What should you recommend?
  fr: |
    Contoso doit déplacer 90 To d'archives vidéo d'un NAS local vers le Stockage Blob Azure. Le centre de données dispose d'une liaison Internet de 100 Mbit/s partagée avec les applications de production.

    Le transfert n'a lieu qu'une fois et doit être terminé en trois semaines. Contoso veut que Microsoft fournisse le matériel de transfert.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: "Azure Data Box" }
    - { id: b, text: "Azure Data Box Disk" }
    - { id: c, text: "AzCopy" }
    - { id: d, text: "Azure File Sync" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      At 100 Mbps, 90 TB would need more than 80 days of continuous transfer on a link that production also uses. Azure Data Box is a rugged storage device that Microsoft ships to the datacenter: Contoso copies the data locally, returns the device and Microsoft uploads the data to the storage account. One device holds the 90 TB.
    fr: |
      À 100 Mbit/s, 90 To demanderaient plus de 80 jours de transfert continu sur une liaison que la production utilise aussi. Azure Data Box est un appareil de stockage renforcé que Microsoft expédie au centre de données : Contoso copie les données localement, renvoie l'appareil et Microsoft charge les données dans le compte de stockage. Un seul appareil contient les 90 To.
  options:
    b:
      en: A Data Box Disk order is limited to about 35 TB of usable capacity, so 90 TB would require several orders.
      fr: Une commande Data Box Disk est limitée à environ 35 To de capacité utilisable ; 90 To demanderaient plusieurs commandes.
    c:
      en: AzCopy transfers over the network; the available bandwidth can't move 90 TB in three weeks.
      fr: AzCopy transfère par le réseau ; la bande passante disponible ne permet pas de déplacer 90 To en trois semaines.
    d:
      en: Azure File Sync synchronizes Windows file servers with Azure file shares over the network; it neither targets Blob Storage nor avoids the bandwidth limit.
      fr: Azure File Sync synchronise des serveurs de fichiers Windows avec des partages de fichiers Azure par le réseau ; il ne cible pas le Stockage Blob et n'évite pas la limite de bande passante.
references:
  - title: What is Azure Data Box?
    url: https://learn.microsoft.com/en-us/azure/databox/data-box-overview
  - title: Choose an Azure solution for data transfer
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-choose-data-transfer-solution
