id: az305-4a-appservice-tier-autoscale-slots
objective: "4.1.1"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Litware plans to host a public web app in Azure App Service.

    You need to recommend a pricing tier for the App Service plan. The solution must meet the following requirements:

    - Scale out automatically between two and eight instances based on CPU usage.
    - Provide three staging slots in addition to the production slot.
    - Minimize cost.

    Which pricing tier should you recommend?
  fr: |
    Litware prévoit d'héberger une application web publique dans Azure App Service.

    Vous devez recommander un niveau tarifaire pour le plan App Service. La solution doit répondre aux exigences suivantes :

    - Effectuer automatiquement un scale-out entre deux et huit instances selon l'utilisation du processeur.
    - Fournir trois emplacements de préproduction en plus de l'emplacement de production.
    - Réduire les coûts au minimum.

    Quel niveau tarifaire devez-vous recommander ?
body:
  options:
    - { id: a, text: Basic }
    - { id: b, text: Standard }
    - { id: c, text: Premium v3 }
    - { id: d, text: Isolated v2 }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Standard is the first tier that offers autoscale and deployment slots: it scales out to 10 instances and provides five staging slots per app. That covers eight instances and three slots at the lowest price among the tiers that qualify.
    fr: |
      Standard est le premier niveau qui propose la mise à l'échelle automatique et les emplacements de déploiement : il effectue un scale-out jusqu'à 10 instances et fournit cinq emplacements de préproduction par application. Cela couvre huit instances et trois emplacements au prix le plus bas parmi les niveaux qui conviennent.
  options:
    a:
      en: Basic runs on dedicated instances but is limited to three instances scaled manually, and it has no deployment slots.
      fr: Basic s'exécute sur des instances dédiées, mais se limite à trois instances mises à l'échelle manuellement et n'a aucun emplacement de déploiement.
    c:
      en: Premium v3 meets the requirements (30 instances, 20 slots) but costs more than Standard, which is sufficient.
      fr: Premium v3 répond aux exigences (30 instances, 20 emplacements), mais coûte plus cher que Standard, qui suffit.
    d:
      en: Isolated v2 requires an App Service Environment; its single-tenant network isolation isn't requested and makes it the most expensive choice.
      fr: Isolated v2 exige un App Service Environment ; son isolation réseau monolocataire n'est pas demandée et en fait le choix le plus cher.
references:
