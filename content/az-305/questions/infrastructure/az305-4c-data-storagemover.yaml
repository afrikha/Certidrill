id: az305-4c-data-storagemover
objective: "4.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to decommission a NAS appliance that exposes 14 TB of data through 30 SMB shares. The data must move to blob containers in an Azure storage account. The datacenter has a 1-Gbps connection to Azure.

    You need to recommend a migration solution. The solution must meet the following requirements:

    - The folder structure of each share must be preserved.
    - The migration of each share must be started from Azure, and its progress and results must be tracked there.
    - Later runs must transfer only the new and updated files.
    - The administrative effort must be minimized.

    What should you recommend?
  fr: |
    Adatum prévoit de mettre hors service une appliance NAS qui expose 14 To de données par 30 partages SMB. Les données doivent être déplacées vers des conteneurs d'objets blob d'un compte de stockage Azure. Le centre de données dispose d'une connexion de 1 Gbit/s vers Azure.

    Vous devez recommander une solution de migration. La solution doit répondre aux exigences suivantes :

    - L'arborescence des dossiers de chaque partage doit être préservée.
    - La migration de chaque partage doit être lancée depuis Azure, et sa progression et ses résultats doivent y être suivis.
    - Les exécutions ultérieures ne doivent transférer que les fichiers nouveaux ou modifiés.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: "Azure File Sync" }
    - { id: b, text: "Azure Storage Mover" }
    - { id: c, text: { en: "Azure Storage Explorer", fr: "Explorateur Stockage Azure" } }
    - { id: d, text: "Azure Data Box" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Storage Mover is a fully managed migration service that copies SMB shares to blob containers or Azure file shares. You create a migration project, define the source and the target of each share, start each migration when you choose and track its progress and results in Azure. The service detects the differences between source and target, so a later run transfers only new and updated files.
    fr: |
      Azure Storage Mover est un service de migration entièrement managé qui copie des partages SMB vers des conteneurs d'objets blob ou des partages de fichiers Azure. Vous créez un projet de migration, définissez la source et la cible de chaque partage, lancez chaque migration au moment de votre choix et suivez sa progression et ses résultats dans Azure. Le service détecte les différences entre la source et la cible : une exécution ultérieure ne transfère donc que les fichiers nouveaux ou modifiés.
  options:
    a:
      en: Azure File Sync synchronizes Windows file servers with Azure file shares; it handles neither a NAS appliance nor blob containers.
      fr: Azure File Sync synchronise des serveurs de fichiers Windows avec des partages de fichiers Azure ; il ne gère ni une appliance NAS ni les conteneurs d'objets blob.
    c:
      en: Azure Storage Explorer is a graphical tool for occasional manual transfers, without migration projects tracked in Azure for 30 shares.
      fr: L'Explorateur Stockage Azure est un outil graphique pour des transferts manuels occasionnels, sans projets de migration suivis dans Azure pour 30 partages.
    d:
      en: A Data Box is an offline device meant for limited bandwidth, unnecessary for 14 TB over a 1-Gbps link, and a shipped device can't run later incremental transfers.
      fr: Un Data Box est un appareil hors connexion destiné aux bandes passantes limitées, inutile pour 14 To sur une liaison à 1 Gbit/s, et un appareil expédié ne peut pas exécuter de transferts incrémentiels ultérieurs.
references:
  - title: What is Azure Storage Mover?
    url: https://learn.microsoft.com/en-us/azure/storage-mover/service-overview
