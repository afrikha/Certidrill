id: az305-4a-sls-long-running-http
objective: "4.1.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank plans to expose an HTTP endpoint that starts the generation of an account statement. A generation takes up to 20 minutes. Client applications must receive an immediate response and then check the progress until the statement is ready.

    Woodgrove Bank already pays for a Premium v3 App Service plan that hosts web apps and has unused capacity. The function app must use this capacity instead of adding new billed compute resources.

    You need to recommend a design for the function app.

    What should you recommend? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit d'exposer un point de terminaison HTTP qui lance la génération d'un relevé de compte. Une génération dure jusqu'à 20 minutes. Les applications clientes doivent recevoir une réponse immédiate, puis vérifier la progression jusqu'à ce que le relevé soit prêt.

    Woodgrove Bank paie déjà un plan App Service Premium v3 qui héberge des applications web et dispose de capacité inutilisée. L'application de fonctions doit utiliser cette capacité au lieu d'ajouter de nouvelles ressources de calcul facturées.

    Vous devez recommander une conception pour l'application de fonctions.

    Que devez-vous recommander ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Host the function app in [[plan]].
      Implement the endpoint as [[pattern]].
    fr: |
      Héberger l'application de fonctions dans [[plan]].
      Implémenter le point de terminaison sous la forme [[pattern]].
  slots:
    - id: plan
      options:
        - { id: premium, text: { en: "a new Premium plan", fr: "un nouveau plan Premium" } }
        - { id: flex, text: { en: "a new Flex Consumption plan", fr: "un nouveau plan Flex Consumption" } }
        - { id: dedicated, text: { en: "the existing App Service plan (Dedicated plan)", fr: "le plan App Service existant (plan Dedicated)" } }
    - id: pattern
      options:
        - { id: durable, text: { en: "an HTTP function that starts a Durable Functions orchestration", fr: "d'une fonction HTTP qui démarre une orchestration Durable Functions" } }
        - { id: timeout, text: { en: "a single HTTP function with a function timeout of 30 minutes", fr: "d'une seule fonction HTTP avec un délai d'expiration de fonction de 30 minutes" } }
        - { id: alwayson, text: { en: "a single HTTP function with Always On enabled", fr: "d'une seule fonction HTTP avec Always On activé" } }
answer:
  values: { plan: dedicated, pattern: durable }
explanation:
  correct:
    en: |
      A function app can run in an existing App Service plan (Dedicated plan) and use its spare capacity, without any new billed compute resource. Whatever the plan and the function timeout, an HTTP-triggered function must respond within 230 seconds: the long operation must run in the background. With the Durable Functions asynchronous pattern, the HTTP function starts an orchestration and returns immediately with a status endpoint that the client polls.
    fr: |
      Une application de fonctions peut s'exécuter dans un plan App Service existant (plan Dedicated) et utiliser sa capacité libre, sans nouvelle ressource de calcul facturée. Quels que soient le plan et le délai d'expiration de la fonction, une fonction déclenchée par HTTP doit répondre en 230 secondes : l'opération longue doit s'exécuter en arrière-plan. Avec le modèle asynchrone de Durable Functions, la fonction HTTP démarre une orchestration et répond immédiatement avec un point de terminaison d'état que le client interroge.
  options:
    premium:
      en: A new Premium plan always bills at least one instance of its own and doesn't use the capacity that is already paid for.
      fr: Un nouveau plan Premium facture toujours au moins une instance qui lui est propre et n'utilise pas la capacité déjà payée.
    flex:
      en: A new Flex Consumption plan is a separate resource that bills executions and memory; it doesn't use the capacity that is already paid for.
      fr: Un nouveau plan Flex Consumption est une ressource distincte qui facture les exécutions et la mémoire ; il n'utilise pas la capacité déjà payée.
    timeout:
      en: A longer function timeout doesn't change the 230-second limit for the response of an HTTP-triggered function.
      fr: Un délai d'expiration de fonction plus long ne change pas la limite de 230 secondes pour la réponse d'une fonction déclenchée par HTTP.
    alwayson:
      en: Always On keeps the host loaded and allows long executions in a Dedicated plan, but the HTTP response is still limited to 230 seconds.
      fr: Always On garde l'hôte chargé et autorise les exécutions longues dans un plan Dedicated, mais la réponse HTTP reste limitée à 230 secondes.
references:
  - title: Azure Functions hosting options
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
  - title: Durable orchestrations
    url: https://learn.microsoft.com/en-us/azure/azure-functions/durable/durable-functions-orchestrations
