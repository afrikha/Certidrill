id: az305-cs4b-database-access
objective: "4.4.4"
type: single
caseStudy: az305-cs4b-fourthcoffee
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend how app-brewahead and func-orders connect to sql-brewahead. The solution must meet the network security requirements and minimize costs.

    What should you recommend?
  fr: |
    Vous devez recommander la façon dont app-brewahead et func-orders se connectent à sql-brewahead. La solution doit respecter les exigences de sécurité réseau et réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: A service endpoint for Microsoft.Sql on the integration subnet, and a virtual network rule on the logical server
        fr: Un point de terminaison de service Microsoft.Sql sur le sous-réseau d'intégration, et une règle de réseau virtuel sur le serveur logique
    - id: b
      text:
        en: A private endpoint for the logical server in a subnet of VNet-Brew
        fr: Un point de terminaison privé pour le serveur logique dans un sous-réseau de VNet-Brew
    - id: c
      text:
        en: Firewall rules on the logical server that allow only the outbound IP addresses of the two apps
        fr: Des règles de pare-feu sur le serveur logique qui n'autorisent que les adresses IP sortantes des deux applications
    - id: d
      text:
        en: An Azure Firewall in VNet-Brew that filters the traffic of the integration subnet to the logical server
        fr: Un Pare-feu Azure dans VNet-Brew qui filtre le trafic du sous-réseau d'intégration vers le serveur logique
answer: { optionId: b }
explanation:
  correct:
    en: |
      A private endpoint gives the logical server a private IP address taken from VNet-Brew. The apps, which already send their outbound traffic through the virtual network integration, reach the database on that address, and public network access to the server can then be disabled entirely. A private endpoint is billed, but it is the only option that meets both requirements.
    fr: |
      Un point de terminaison privé donne au serveur logique une adresse IP privée prise dans VNet-Brew. Les applications, qui font déjà passer leur trafic sortant par l'intégration au réseau virtuel, atteignent la base de données à cette adresse, et l'accès réseau public au serveur peut alors être entièrement désactivé. Un point de terminaison privé est facturé, mais c'est la seule option qui respecte les deux exigences.
  options:
    a:
      en: "A service endpoint is free, but the server keeps its public IP address and the apps still connect to it: the public endpoint cannot be disabled, only restricted."
      fr: "Un point de terminaison de service est gratuit, mais le serveur conserve son adresse IP publique et les applications s'y connectent toujours : le point de terminaison public ne peut pas être désactivé, seulement restreint."
    c:
      en: "Firewall rules restrict who can use the public endpoint but keep it enabled, and the apps do not use a private IP address."
      fr: "Des règles de pare-feu restreignent qui peut utiliser le point de terminaison public mais le laissent activé, et les applications n'utilisent pas d'adresse IP privée."
    d:
      en: "Azure Firewall filters the traffic that leaves the virtual network, but the traffic still goes to the public endpoint of the server, at a much higher cost."
      fr: "Le Pare-feu Azure filtre le trafic qui quitte le réseau virtuel, mais ce trafic va toujours vers le point de terminaison public du serveur, pour un coût bien supérieur."
references:
  - title: Integrate Azure services with virtual networks for network isolation
    url: https://learn.microsoft.com/en-us/azure/virtual-network/vnet-integration-for-azure-services
