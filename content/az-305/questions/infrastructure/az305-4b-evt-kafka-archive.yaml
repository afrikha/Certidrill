id: az305-4b-evt-kafka-archive
objective: "4.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs on-premises applications that publish clickstream events to an Apache Kafka cluster. Fabrikam plans to retire the cluster and to ingest the events in Azure Event Hubs.

    You need to recommend a design that meets the following requirements:

    - The code of the existing Kafka producers must not be rewritten.
    - Consumers must be able to replay the events of the last 30 days from the stream.
    - Every event must be archived automatically in Azure Data Lake Storage, without custom code.
    - The cost must be minimized.

    How should you complete the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam exécute localement des applications qui publient des événements de parcours de navigation dans un cluster Apache Kafka. Fabrikam prévoit de supprimer le cluster et d'ingérer les événements dans Azure Event Hubs.

    Vous devez recommander une conception qui répond aux exigences suivantes :

    - Le code des producteurs Kafka existants ne doit pas être réécrit.
    - Les consommateurs doivent pouvoir rejouer les événements des 30 derniers jours à partir du flux.
    - Chaque événement doit être archivé automatiquement dans Azure Data Lake Storage, sans code personnalisé.
    - Le coût doit être réduit au minimum.

    Comment devez-vous compléter la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Create the Event Hubs namespace in the [[tier]] tier.

      Connect the producers by [[connect]].

      Archive the events by using [[archive]].
    fr: |
      Créez l'espace de noms Event Hubs au niveau [[tier]].

      Connectez les producteurs en [[connect]].

      Archivez les événements à l'aide de [[archive]].
  slots:
    - id: tier
      options:
        - { id: basic, text: Basic }
        - { id: standard, text: Standard }
        - { id: premium, text: Premium }
        - { id: dedicated, text: Dedicated }
    - id: connect
      options:
        - { id: sdk, text: { en: "rewriting them with the Event Hubs SDK", fr: "les réécrivant avec le SDK Event Hubs" } }
        - { id: kafka, text: { en: "changing their configuration to target the Kafka endpoint of the namespace", fr: "modifiant leur configuration pour cibler le point de terminaison Kafka de l'espace de noms" } }
        - { id: grid, text: { en: "publishing their events to an Event Grid custom topic", fr: "publiant leurs événements dans une rubrique personnalisée Event Grid" } }
    - id: archive
      options:
        - { id: func, text: { en: "an Azure Functions app triggered by the event hub", fr: "une application Azure Functions déclenchée par le hub d'événements" } }
        - { id: georep, text: { en: "Event Hubs geo-replication", fr: "la géoréplication Event Hubs" } }
        - { id: capture, text: Event Hubs Capture }
        - { id: cg, text: { en: "a dedicated consumer group", fr: "un groupe de consommateurs dédié" } }
answer:
  values: { tier: premium, connect: kafka, archive: capture }
explanation:
  correct:
    en: "A retention of 30 days exceeds the 7 days of the Standard tier, so the Premium tier (up to 90 days) is the least expensive tier that fits; Capture is included in it. The Kafka endpoint of Event Hubs accepts existing Kafka clients after a configuration change only. Event Hubs Capture writes the events to Blob Storage or Data Lake Storage automatically, with no code."
    fr: "Une rétention de 30 jours dépasse les 7 jours du niveau Standard : le niveau Premium (jusqu'à 90 jours) est le moins coûteux qui convienne, et Capture y est incluse. Le point de terminaison Kafka d'Event Hubs accepte les clients Kafka existants moyennant un simple changement de configuration. Event Hubs Capture écrit automatiquement les événements dans le Stockage Blob ou Data Lake Storage, sans code."
  options:
    basic: { en: "The Basic tier supports neither the Kafka endpoint nor Capture, and retains events for one day.", fr: "Le niveau Basic ne prend en charge ni le point de terminaison Kafka ni Capture, et conserve les événements un jour." }
    standard: { en: "The Standard tier supports Kafka and Capture but retains events for 7 days at most.", fr: "Le niveau Standard prend en charge Kafka et Capture, mais conserve les événements 7 jours au plus." }
    dedicated: { en: "A Dedicated cluster also retains events for 90 days, at a higher cost than Premium.", fr: "Un cluster Dedicated conserve aussi les événements 90 jours, pour un coût supérieur à celui de Premium." }
    func: { en: "A function is custom code to write and maintain.", fr: "Une fonction est du code personnalisé à écrire et à maintenir." }
    georep: { en: "Geo-replication copies the namespace to another region for resiliency; it is not an archive in a data lake.", fr: "La géoréplication copie l'espace de noms dans une autre région pour la résilience ; ce n'est pas une archive dans un lac de données." }
references:
  - title: Compare Azure Event Hubs tiers
    url: https://learn.microsoft.com/en-us/azure/event-hubs/compare-tiers
  - title: What is Azure Event Hubs for Apache Kafka?
    url: https://learn.microsoft.com/en-us/azure/event-hubs/azure-event-hubs-apache-kafka-overview
