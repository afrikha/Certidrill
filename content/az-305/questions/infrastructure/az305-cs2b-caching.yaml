id: az305-cs2b-caching
objective: "4.2.4"
type: dragdrop
caseStudy: az305-cs2b-wide-world-importers
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a caching solution for each caching requirement of TrackHub.

    Which solution should you recommend for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution de mise en cache pour chaque exigence de mise en cache de TrackHub.

    Quelle solution devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: redis, text: Azure Managed Redis }
    - { id: afd, text: { en: "Azure Front Door caching", fr: "Mise en cache d'Azure Front Door" } }
    - { id: apim, text: { en: "Response caching policy in API Management", fr: "Stratégie de mise en cache des réponses dans API Management" } }
    - { id: appconfig, text: Azure App Configuration }
    - { id: tm, text: Azure Traffic Manager }
  targets:
    - id: statuses
      text: { en: "Shipment statuses and user sessions shared by the instances of the Tracking API", fr: "États d'expédition et sessions utilisateur partagés par les instances de Tracking API" }
    - id: static
      text: { en: "Images and scripts of the web application", fr: "Images et scripts de l'application web" }
    - id: partner
      text: { en: "Identical requests sent to the partner API", fr: "Requêtes identiques envoyées à l'API partenaire" }
answer:
  mapping: { statuses: redis, static: afd, partner: apim }
explanation:
  correct:
    en: Azure Managed Redis is an in-memory data store that all the instances of an application can use to cache frequently read data and to hold session state outside the instances. Azure Front Door caches static content at its edge locations, close to the users. A response caching policy makes the API Management gateway return a stored response to identical requests for a set duration, without calling the backend.
    fr: Azure Managed Redis est un magasin de données en mémoire que toutes les instances d'une application peuvent utiliser pour mettre en cache les données souvent lues et pour conserver l'état de session en dehors des instances. Azure Front Door met en cache le contenu statique dans ses emplacements de périphérie, près des utilisateurs. Une stratégie de mise en cache des réponses fait renvoyer par la passerelle API Management une réponse stockée aux requêtes identiques pendant une durée définie, sans appel au service principal.
  options:
    appconfig: { en: "App Configuration stores settings and feature flags; it is not a cache.", fr: "App Configuration stocke des paramètres et des indicateurs de fonctionnalités ; ce n'est pas un cache." }
    tm: { en: "Traffic Manager answers DNS queries to direct clients to an endpoint; it stores no content.", fr: "Traffic Manager répond à des requêtes DNS pour diriger les clients vers un point de terminaison ; il ne stocke aucun contenu." }
references:
  - title: What is Azure Managed Redis?
    url: https://learn.microsoft.com/en-us/azure/redis/overview
  - title: Caching with Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-caching
