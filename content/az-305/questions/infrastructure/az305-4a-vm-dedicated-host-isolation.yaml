id: az305-4a-vm-dedicated-host-isolation
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware processes medical records on Azure virtual machines. A regulator requires that the virtual machines run on physical servers that are not shared with any other Azure customer. Proseware also wants to choose when platform maintenance is applied to these servers.

    What should you recommend?
  fr: |
    Proseware traite des dossiers médicaux sur des machines virtuelles Azure. Un régulateur exige que les machines virtuelles s'exécutent sur des serveurs physiques qui ne sont partagés avec aucun autre client Azure. Proseware souhaite aussi choisir le moment où la maintenance de la plateforme est appliquée à ces serveurs.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An availability set with three fault domains", fr: "Un groupe à haute disponibilité avec trois domaines d'erreur" } }
    - { id: b, text: Azure Dedicated Host }
    - { id: c, text: { en: "A proximity placement group", fr: "Un groupe de placement de proximité" } }
    - { id: d, text: { en: "DC-series confidential virtual machines", fr: "Des machines virtuelles confidentielles de série DC" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Dedicated Host assigns physical servers to a single subscription: no virtual machine of another customer is placed on them. Maintenance control lets you defer platform updates and apply them at a time you choose within a 35-day rolling window.
    fr: |
      Azure Dedicated Host affecte des serveurs physiques à un seul abonnement : aucune machine virtuelle d'un autre client n'y est placée. Le contrôle de maintenance permet de différer les mises à jour de la plateforme et de les appliquer au moment de votre choix, dans une fenêtre glissante de 35 jours.
  options:
    a:
      en: An availability set spreads virtual machines across racks for availability; the physical servers are still shared with other customers.
      fr: Un groupe à haute disponibilité répartit les machines virtuelles entre des racks pour la disponibilité ; les serveurs physiques restent partagés avec d'autres clients.
    c:
      en: A proximity placement group places virtual machines close together to reduce latency; it doesn't isolate hardware.
      fr: Un groupe de placement de proximité rapproche les machines virtuelles pour réduire la latence ; il n'isole pas le matériel.
    d:
      en: Confidential virtual machines protect data while it is in use, but they run on servers shared with other customers and give no control over maintenance.
      fr: Les machines virtuelles confidentielles protègent les données pendant leur utilisation, mais s'exécutent sur des serveurs partagés avec d'autres clients et ne donnent aucun contrôle sur la maintenance.
references:
  - title: Azure Dedicated Hosts
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/dedicated-hosts
