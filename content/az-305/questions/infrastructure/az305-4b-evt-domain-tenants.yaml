id: az305-4b-evt-domain-tenants
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware is a software vendor whose platform publishes maintenance events for 4,000 customers by using Azure Event Grid.

    You need to recommend how to organize the events. The solution must meet the following requirements:

    - The platform must publish all the events to a single endpoint.
    - Each customer must be able to create event subscriptions only for its own events, through Azure role assignments scoped to these events.
    - The administrative effort must be minimized.

    What should you recommend?
  fr: |
    Proseware est un éditeur de logiciels dont la plateforme publie des événements de maintenance pour 4 000 clients à l'aide d'Azure Event Grid.

    Vous devez recommander une organisation des événements. La solution doit répondre aux exigences suivantes :

    - La plateforme doit publier tous les événements vers un seul point de terminaison.
    - Chaque client doit pouvoir créer des abonnements aux événements uniquement pour ses propres événements, grâce à des attributions de rôles Azure limitées à ces événements.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An event domain with one domain topic per customer", fr: "Un domaine d'événements avec une rubrique de domaine par client" } }
    - { id: b, text: { en: "One custom topic per customer", fr: "Une rubrique personnalisée par client" } }
    - { id: c, text: { en: "A single custom topic with one subject filter per customer", fr: "Une seule rubrique personnalisée avec un filtre d'objet par client" } }
    - { id: d, text: { en: "A single event hub with one consumer group per customer", fr: "Un seul hub d'événements avec un groupe de consommateurs par client" } }
answer: { optionId: a }
explanation:
  correct:
    en: "An event domain gives one publishing endpoint for thousands of topics that belong to the same application. Each customer has its own domain topic, and Azure RBAC roles assigned at the scope of that topic let the customer create subscriptions for its events only."
    fr: "Un domaine d'événements fournit un seul point de terminaison de publication pour des milliers de rubriques liées à la même application. Chaque client a sa propre rubrique de domaine, et des rôles Azure RBAC attribués à l'étendue de cette rubrique lui permettent de créer des abonnements pour ses seuls événements."
  options:
    b:
      en: "Separate custom topics isolate the customers, but each topic has its own endpoint and 4,000 topics must be managed one by one."
      fr: "Des rubriques personnalisées distinctes isolent les clients, mais chaque rubrique a son propre point de terminaison et il faut gérer 4 000 rubriques une par une."
    c:
      en: "A subject filter limits what a subscription receives, but a role assigned on the single topic lets a customer subscribe to the events of every customer."
      fr: "Un filtre d'objet limite ce que reçoit un abonnement, mais un rôle attribué sur la rubrique unique permet à un client de s'abonner aux événements de tous les clients."
    d:
      en: "An event hub is a stream that every consumer group reads entirely; it does not route each customer's events, and a hub accepts far fewer than 4,000 consumer groups."
      fr: "Un hub d'événements est un flux que chaque groupe de consommateurs lit en entier ; il ne route pas les événements de chaque client, et un hub accepte bien moins de 4 000 groupes de consommateurs."
references:
  - title: Event domains in Azure Event Grid
    url: https://learn.microsoft.com/en-us/azure/event-grid/event-domains
