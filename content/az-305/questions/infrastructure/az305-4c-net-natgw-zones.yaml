id: az305-4c-net-natgw-zones
objective: "4.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum deploys a virtual machine scale set across three availability zones. All the instances are in a single subnet of a new virtual network and have no public IP addresses.

    You need to recommend an outbound internet connectivity solution. The solution must meet the following requirements:

    - Outbound connections must use static public IP addresses.
    - Outbound connectivity must remain available for the surviving instances if one availability zone fails.
    - The administrative effort must be minimized.

    What should you recommend?
  fr: |
    Adatum déploie un groupe de machines virtuelles identiques sur trois zones de disponibilité. Toutes les instances sont dans un seul sous-réseau d'un nouveau réseau virtuel et n'ont pas d'adresse IP publique.

    Vous devez recommander une solution de connectivité sortante vers Internet. La solution doit répondre aux exigences suivantes :

    - Les connexions sortantes doivent utiliser des adresses IP publiques statiques.
    - La connectivité sortante doit rester disponible pour les instances restantes en cas de défaillance d'une zone de disponibilité.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "One Standard NAT gateway in zone 1, associated with the subnet", fr: "Une passerelle NAT Standard dans la zone 1, associée au sous-réseau" } }
    - { id: b, text: { en: "Three Standard NAT gateways, one per zone, associated with the subnet", fr: "Trois passerelles NAT Standard, une par zone, associées au sous-réseau" } }
    - { id: c, text: { en: "One StandardV2 NAT gateway, associated with the subnet", fr: "Une passerelle NAT StandardV2, associée au sous-réseau" } }
    - { id: d, text: { en: "One internal Standard load balancer in front of the instances", fr: "Un équilibreur de charge interne Standard devant les instances" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The StandardV2 SKU of NAT Gateway is zone-redundant: it keeps providing outbound connectivity when a zone fails, and it works with StandardV2 public IP addresses. A single resource on the subnet therefore covers the three zones with static addresses.
    fr: |
      La référence SKU StandardV2 de NAT Gateway est redondante interzone : elle continue de fournir la connectivité sortante quand une zone tombe en panne, et elle fonctionne avec des adresses IP publiques StandardV2. Une seule ressource sur le sous-réseau couvre donc les trois zones avec des adresses statiques.
  options:
    a:
      en: A Standard NAT gateway is zonal; if zone 1 fails, the instances of the other zones lose their outbound connectivity.
      fr: Une passerelle NAT Standard est zonale ; si la zone 1 tombe en panne, les instances des autres zones perdent leur connectivité sortante.
    b:
      en: A subnet can be associated with only one NAT gateway, so three gateways can't serve the same subnet.
      fr: Un sous-réseau ne peut être associé qu'à une seule passerelle NAT ; trois passerelles ne peuvent donc pas desservir le même sous-réseau.
    d:
      en: An internal load balancer has no public frontend and provides no outbound connectivity to the internet.
      fr: Un équilibreur de charge interne n'a pas de front-end public et ne fournit aucune connectivité sortante vers Internet.
references:
  - title: What is Azure NAT Gateway?
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
