id: az305-4c-db-dms-online
objective: "4.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to standardize on Azure Database Migration Service to migrate its on-premises SQL Server databases to Azure.

    Several databases must stay available for writes during the migration, with a downtime limited to the cutover. You need to identify the targets for which Azure Database Migration Service supports such an online migration.

    Which two targets should you identify?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit d'adopter Azure Database Migration Service comme outil standard pour migrer ses bases de données SQL Server locales vers Azure.

    Plusieurs bases de données doivent rester disponibles en écriture pendant la migration, avec une interruption limitée à la bascule. Vous devez identifier les cibles pour lesquelles Azure Database Migration Service prend en charge une telle migration en ligne.

    Quelles sont les deux cibles à identifier ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A single database in Azure SQL Database", fr: "Une base de données unique dans Azure SQL Database" } }
    - { id: b, text: { en: "Azure SQL Managed Instance", fr: "Azure SQL Managed Instance" } }
    - { id: c, text: { en: "A database in an Azure SQL Database elastic pool", fr: "Une base de données dans un pool élastique Azure SQL Database" } }
    - { id: d, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur Machines virtuelles Azure" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Azure Database Migration Service migrates SQL Server databases online or offline to Azure SQL Managed Instance and to SQL Server on Azure Virtual Machines: an online migration keeps the target synchronized until you start the cutover. For Azure SQL Database, it only offers offline migrations.
    fr: |
      Azure Database Migration Service migre les bases de données SQL Server en ligne ou hors connexion vers Azure SQL Managed Instance et vers SQL Server sur Machines virtuelles Azure : une migration en ligne maintient la cible synchronisée jusqu'à ce que vous lanciez la bascule. Pour Azure SQL Database, il ne propose que des migrations hors connexion.
  options:
    a:
      en: A migration to a single database of Azure SQL Database through Azure Database Migration Service is offline only.
      fr: Une migration vers une base de données unique d'Azure SQL Database par Azure Database Migration Service est uniquement hors connexion.
    c:
      en: A database in an elastic pool is still an Azure SQL Database target, for which only offline migrations exist.
      fr: Une base de données d'un pool élastique reste une cible Azure SQL Database, pour laquelle seules des migrations hors connexion existent.
references:
  - title: Azure Database Migration Service supported scenarios
    url: https://learn.microsoft.com/en-us/azure/dms/resource-scenario-status
  - title: What is Azure Database Migration Service?
    url: https://learn.microsoft.com/en-us/azure/dms/dms-overview
