id: az305-4c-hyb-er-encrypt
objective: "4.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam connects its headquarters to Azure virtual networks through a 1-Gbps ExpressRoute circuit ordered from a connectivity provider. The circuit uses private peering.

    A new security policy requires the traffic between the on-premises network and the virtual networks to be encrypted end to end. The traffic must not cross the public internet, and the existing circuit must be kept.

    What should you include in the recommendation?
  fr: |
    Fabrikam relie son siège à des réseaux virtuels Azure par un circuit ExpressRoute de 1 Gbit/s commandé auprès d'un fournisseur de connectivité. Le circuit utilise le peering privé.

    Une nouvelle stratégie de sécurité exige que le trafic entre le réseau local et les réseaux virtuels soit chiffré de bout en bout. Le trafic ne doit pas passer par l'Internet public, et le circuit existant doit être conservé.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "MACsec on the ExpressRoute circuit", fr: "MACsec sur le circuit ExpressRoute" } }
    - { id: b, text: { en: "ExpressRoute Global Reach on the circuit", fr: "ExpressRoute Global Reach sur le circuit" } }
    - { id: c, text: { en: "A site-to-site VPN tunnel over the ExpressRoute private peering", fr: "Un tunnel VPN de site à site sur le peering privé ExpressRoute" } }
    - { id: d, text: { en: "A site-to-site VPN tunnel over the internet link of the headquarters", fr: "Un tunnel VPN de site à site sur la liaison Internet du siège" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      ExpressRoute traffic is private but not encrypted by default. An IPsec site-to-site VPN tunnel established between the on-premises VPN device and the Azure VPN gateway over the private peering encrypts the traffic end to end while it stays on the circuit, away from the internet.
    fr: |
      Le trafic ExpressRoute est privé, mais n'est pas chiffré par défaut. Un tunnel VPN IPsec de site à site établi entre le périphérique VPN local et la passerelle VPN Azure sur le peering privé chiffre le trafic de bout en bout tout en le maintenant sur le circuit, à l'écart d'Internet.
  options:
    a:
      en: MACsec is only available on ExpressRoute Direct ports, not on a circuit delivered by a connectivity provider, and it encrypts only the link to the Microsoft edge routers.
      fr: MACsec n'est disponible que sur les ports ExpressRoute Direct, pas sur un circuit fourni par un fournisseur de connectivité, et il ne chiffre que la liaison jusqu'aux routeurs de périphérie Microsoft.
    b:
      en: Global Reach links on-premises sites to each other through their circuits; it doesn't encrypt anything.
      fr: Global Reach relie des sites locaux entre eux à travers leurs circuits ; il ne chiffre rien.
    d:
      en: A VPN tunnel over the internet is encrypted but crosses the public internet, which the policy forbids.
      fr: Un tunnel VPN sur Internet est chiffré, mais passe par l'Internet public, ce que la stratégie interdit.
references:
  - title: About encryption for Azure ExpressRoute
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-encryption
