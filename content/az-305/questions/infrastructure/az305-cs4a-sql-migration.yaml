id: az305-cs4a-sql-migration
objective: "4.3.4"
type: single
caseStudy: az305-cs4a-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a method to migrate the databases of SQL-PAY to Azure SQL Managed Instance. The solution must meet the migration requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une méthode pour migrer les bases de données de SQL-PAY vers Azure SQL Managed Instance. La solution doit respecter les exigences de migration.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: Export the databases to BACPAC files and import the files
        fr: Exporter les bases de données dans des fichiers BACPAC et importer ces fichiers
    - id: b
      text:
        en: Use the Managed Instance link
        fr: Utiliser le lien Managed Instance
    - id: c
      text:
        en: Use Log Replay Service
        fr: Utiliser Log Replay Service
    - id: d
      text:
        en: Restore native full backups from Azure Blob Storage
        fr: Restaurer des sauvegardes complètes natives depuis le Stockage Blob Azure
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Managed Instance link replicates the databases in near real time from SQL Server 2016 or later to SQL Managed Instance through a distributed availability group. The replicated databases are available in Azure for read-only queries while SQL-PAY remains the primary, so the quality assurance team can test them, and the cutover is a failover of the link, which keeps the downtime to a few minutes.
    fr: |
      Le lien Managed Instance réplique les bases de données en quasi-temps réel depuis SQL Server 2016 ou ultérieur vers SQL Managed Instance au moyen d'un groupe de disponibilité distribué. Les bases de données répliquées sont accessibles dans Azure pour des requêtes en lecture seule pendant que SQL-PAY reste le réplica principal : l'équipe d'assurance qualité peut donc les tester, et la bascule est un basculement du lien, qui limite l'interruption à quelques minutes.
  options:
    a:
      en: "A BACPAC file is a copy at one point in time. Nothing is synchronized afterwards, and exporting then importing 20 TB takes far longer than 15 minutes."
      fr: "Un fichier BACPAC est une copie à un instant donné. Rien n'est synchronisé ensuite, et exporter puis importer 20 To prend bien plus de 15 minutes."
    c:
      en: "Log Replay Service applies log backups continuously, but the databases stay in a restoring state until the cutover: they accept neither read nor write workloads before it."
      fr: "Log Replay Service applique des sauvegardes de journaux en continu, mais les bases de données restent en cours de restauration jusqu'à la bascule : elles n'acceptent ni lecture ni écriture avant celle-ci."
    d:
      en: "A native restore is an offline migration: the changes made after the last backup are not synchronized, so the application must stop for the whole backup and restore."
      fr: "Une restauration native est une migration hors connexion : les modifications postérieures à la dernière sauvegarde ne sont pas synchronisées, et l'application doit s'arrêter pendant toute la sauvegarde et la restauration."
references:
  - title: Overview of the Managed Instance link
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
  - title: Overview of Log Replay Service with Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/log-replay-service-overview
