id: az305-4d-sec-admin-rules
objective: "4.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has 150 virtual networks in 12 subscriptions under a management group named MG-Litware. Application teams have the Network Contributor role on their own virtual networks and manage their own network security groups (NSGs). Some existing NSGs contain rules that allow RDP from the internet.

    You need to recommend a solution for the security team. The solution must meet the following requirements:

    - Block inbound RDP and SSH from the internet in all the virtual networks, including virtual networks created later.
    - The block must take effect even when an NSG rule allows that traffic.
    - The security team must not modify the NSGs of the application teams, and the teams must keep managing their own NSG rules.
    - Minimize administrative effort.

    What should you recommend?
  fr: |
    Litware dispose de 150 réseaux virtuels dans 12 abonnements sous un groupe d'administration nommé MG-Litware. Les équipes applicatives ont le rôle Network Contributor sur leurs propres réseaux virtuels et gèrent leurs propres groupes de sécurité réseau (NSG). Certains NSG existants contiennent des règles qui autorisent RDP depuis Internet.

    Vous devez recommander une solution pour l'équipe de sécurité. La solution doit répondre aux exigences suivantes :

    - Bloquer RDP et SSH entrants depuis Internet dans tous les réseaux virtuels, y compris ceux créés plus tard.
    - Le blocage doit s'appliquer même quand une règle NSG autorise ce trafic.
    - L'équipe de sécurité ne doit pas modifier les NSG des équipes applicatives, et les équipes doivent continuer à gérer leurs propres règles NSG.
    - Réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An Azure Policy assignment on MG-Litware that denies NSG rules allowing RDP and SSH from the internet", fr: "Une attribution Azure Policy sur MG-Litware qui refuse les règles NSG autorisant RDP et SSH depuis Internet" } }
    - { id: b, text: { en: "Azure Virtual Network Manager security admin rules with a Deny action, applied to a network group with dynamic membership", fr: "Des règles d'administration de sécurité Azure Virtual Network Manager avec l'action Deny, appliquées à un groupe réseau à appartenance dynamique" } }
    - { id: c, text: { en: "One NSG per region with Deny rules for RDP and SSH, associated with every subnet", fr: "Un NSG par région avec des règles Deny pour RDP et SSH, associé à chaque sous-réseau" } }
    - { id: d, text: { en: "Azure Firewall Premium in a hub per region, with IDPS in deny mode", fr: "Le Pare-feu Azure Premium dans un hub par région, avec l'IDPS en mode refus" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Security admin rules of Azure Virtual Network Manager are evaluated before NSG rules; a Deny rule stops the traffic even if an NSG allows it, and the NSGs themselves aren't modified. Applied to a network group whose dynamic membership is defined with Azure Policy conditions, the configuration also reaches virtual networks created later, while application teams keep managing their NSGs for finer control.
    fr: |
      Les règles d'administration de sécurité d'Azure Virtual Network Manager sont évaluées avant les règles NSG ; une règle Deny arrête le trafic même si un NSG l'autorise, et les NSG eux-mêmes ne sont pas modifiés. Appliquée à un groupe réseau dont l'appartenance dynamique est définie par des conditions Azure Policy, la configuration atteint aussi les réseaux virtuels créés plus tard, tandis que les équipes applicatives continuent de gérer leurs NSG pour un contrôle plus fin.
  options:
    a:
      en: |
        A deny policy blocks the creation or update of such rules, but the existing NSG rules that allow RDP stay in effect unless the NSGs are changed.
      fr: |
        Une stratégie de refus bloque la création ou la mise à jour de telles règles, mais les règles NSG existantes qui autorisent RDP restent en vigueur tant que les NSG ne sont pas modifiés.
    c:
      en: |
        A subnet has only one NSG; replacing the teams' NSGs modifies them and removes the teams' control, and NSGs are regional resources tied to one subscription.
      fr: |
        Un sous-réseau n'a qu'un seul NSG ; remplacer les NSG des équipes les modifie et retire le contrôle aux équipes, et les NSG sont des ressources régionales liées à un abonnement.
    d:
      en: |
        A hub firewall only inspects traffic that is routed through it; virtual machines with their own public IP addresses would still receive RDP directly, and the cost is high.
      fr: |
        Un pare-feu de hub n'inspecte que le trafic qui est routé par lui ; les machines virtuelles dotées de leur propre adresse IP publique recevraient toujours RDP directement, et le coût est élevé.
