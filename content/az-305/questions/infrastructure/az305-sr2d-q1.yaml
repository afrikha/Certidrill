stem:
  en: |
    You recommend one ExpressRoute circuit and a site-to-site VPN connection to the same virtual network.
  fr: |
    Vous recommandez un circuit ExpressRoute et une connexion VPN de site à site vers le même réseau virtuel.
body:
  solution:
    en: |
      You recommend one **ExpressRoute** circuit connected to an ExpressRoute virtual network gateway in VNet1. You also deploy a route-based **VPN gateway** (VpnGw2AZ) in VNet1 and a **site-to-site VPN** connection that uses the internet connection of the datacenter. The same routes are advertised over both paths by using BGP.
    fr: |
      Vous recommandez un circuit **ExpressRoute** connecté à une passerelle de réseau virtuel ExpressRoute dans VNet1. Vous déployez également dans VNet1 une **passerelle VPN** basée sur des itinéraires (VpnGw2AZ) et une connexion **VPN de site à site** qui utilise la connexion Internet du centre de données. Les mêmes itinéraires sont annoncés sur les deux chemins avec BGP.
answer: { value: true }
explanation:
  correct:
    en: |
      An ExpressRoute gateway and a VPN gateway can coexist in the same virtual network. When a route is advertised over both paths, Azure prefers ExpressRoute, so the private circuit carries the traffic in normal operation and the VPN path is used only if the circuit fails; BGP moves the traffic without any action from an administrator. The backup path crosses the internet inside an IPsec tunnel, so it is encrypted, and Woodgrove Bank accepts the lower performance of a VPN during the failure.
    fr: |
      Une passerelle ExpressRoute et une passerelle VPN peuvent coexister dans le même réseau virtuel. Quand un itinéraire est annoncé sur les deux chemins, Azure préfère ExpressRoute : le circuit privé transporte donc le trafic en fonctionnement normal et le chemin VPN n'est utilisé que si le circuit tombe en panne ; le basculement s'effectue par BGP, sans intervention d'un administrateur. Le chemin de secours traverse Internet dans un tunnel IPsec : il est donc chiffré, et Woodgrove Bank accepte les performances moindres d'un VPN pendant la panne.
