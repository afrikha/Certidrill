id: az305-4b-cfg-features-yn
objective: "4.2.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank evaluates Azure App Configuration for a loan application that is deployed in a development, a test and a production environment.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank évalue Azure App Configuration pour une application de prêts déployée dans un environnement de développement, un environnement de test et un environnement de production.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "With labels, one key can hold a different value for each environment in the same store."
        fr: "Grâce aux étiquettes, une même clé peut porter une valeur différente pour chaque environnement dans le même magasin."
    - id: s2
      text:
        en: "A feature flag with a targeting filter can enable a feature for 10 percent of the users without a redeployment of the application."
        fr: "Un indicateur de fonctionnalité doté d'un filtre de ciblage peut activer une fonctionnalité pour 10 % des utilisateurs sans redéploiement de l'application."
    - id: s3
      text:
        en: "Microsoft recommends storing database passwords as key-values in App Configuration instead of storing them in Azure Key Vault."
        fr: "Microsoft recommande de stocker les mots de passe de base de données sous forme de paires clé-valeur dans App Configuration plutôt que dans Azure Key Vault."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Labels maintain several values for the same key, for example one per environment, and the application loads the set that matches its label. Feature flags decouple the release of a feature from the deployment of the code; a targeting filter exposes the feature to a percentage of users or to specific groups. Key Vault remains the recommended place for application secrets; App Configuration complements it and can reference its secrets."
    fr: "Les étiquettes conservent plusieurs valeurs pour une même clé, par exemple une par environnement, et l'application charge le jeu qui correspond à son étiquette. Les indicateurs de fonctionnalités dissocient la mise à disposition d'une fonctionnalité du déploiement du code ; un filtre de ciblage expose la fonctionnalité à un pourcentage d'utilisateurs ou à des groupes précis. Key Vault reste l'emplacement recommandé pour les secrets d'application ; App Configuration le complète et peut référencer ses secrets."
references:
  - title: Azure App Configuration best practices
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/howto-best-practices
  - title: Feature management overview
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-feature-management
