id: az305-4b-caf-strategy-match
objective: "4.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam assigns a migration strategy of the Microsoft Cloud Adoption Framework for Azure to each workload of its datacenter.

    Which strategy should you recommend for each workload? To answer, drag the appropriate strategies to the correct workloads. Each strategy may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam attribue une stratégie de migration du Microsoft Cloud Adoption Framework pour Azure à chaque charge de travail de son centre de données.

    Quelle stratégie devez-vous recommander pour chaque charge de travail ? Pour répondre, faites glisser les stratégies appropriées vers les charges de travail correspondantes. Chaque stratégie peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rehost, text: { en: "Rehost", fr: "Rehost (réhéberger)" } }
    - { id: replatform, text: { en: "Replatform", fr: "Replatform (changer de plateforme)" } }
    - { id: rearchitect, text: { en: "Rearchitect", fr: "Rearchitect (réarchitecturer)" } }
    - { id: replace, text: { en: "Replace", fr: "Replace (remplacer)" } }
    - { id: retire, text: { en: "Retire", fr: "Retire (mettre hors service)" } }
    - { id: retain, text: { en: "Retain", fr: "Retain (conserver)" } }
  targets:
    - id: t1
      text:
        en: "A stable payroll application on three virtual machines; the datacenter contract ends in four months and no modernization is planned"
        fr: "Une application de paie stable sur trois machines virtuelles ; le contrat du centre de données se termine dans quatre mois et aucune modernisation n'est prévue"
    - id: t2
      text:
        en: "A web application and its SQL Server database, to be moved to Azure App Service and Azure SQL Database with minimal code changes, in order to stop maintaining operating systems"
        fr: "Une application web et sa base de données SQL Server, à déplacer vers Azure App Service et Azure SQL Database avec des modifications de code minimales, afin de ne plus maintenir de systèmes d'exploitation"
    - id: t3
      text:
        en: "A custom CRM application that needs little customization and whose functions are covered by a commercial SaaS product"
        fr: "Une application CRM personnalisée qui nécessite peu de personnalisation et dont les fonctions sont couvertes par un produit SaaS du commerce"
    - id: t4
      text:
        en: "A reporting tool that nobody uses anymore and that has no business value"
        fr: "Un outil de reporting que plus personne n'utilise et qui n'a plus de valeur métier"
answer:
  mapping: { t1: rehost, t2: replatform, t3: replace, t4: retire }
explanation:
  correct:
    en: "Rehost is the like-for-like move of a stable workload when speed matters and no modernization is planned. Replatform moves a workload to a PaaS hosting environment with minimal code changes to offload maintenance. Replace adopts a commercial SaaS solution when little customization is needed. Retire decommissions a workload that no longer provides business value."
    fr: "Rehost est le déplacement à l'identique d'une charge de travail stable quand la rapidité prime et qu'aucune modernisation n'est prévue. Replatform déplace une charge de travail vers un environnement d'hébergement PaaS avec des modifications de code minimales pour se décharger de la maintenance. Replace adopte une solution SaaS du commerce quand peu de personnalisation est nécessaire. Retire désaffecte une charge de travail qui n'apporte plus de valeur métier."
  options:
    rearchitect: { en: "Rearchitect redesigns the architecture, for example to decompose an application into services; no workload here requires it.", fr: "Rearchitect repense l'architecture, par exemple pour décomposer une application en services ; aucune charge de travail ne l'exige ici." }
    retain: { en: "Retain leaves a workload where it is; every workload here either moves, is replaced or is removed.", fr: "Retain laisse une charge de travail là où elle est ; ici, chaque charge de travail est déplacée, remplacée ou supprimée." }
references:
  - title: Select your cloud migration strategies
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/plan/select-cloud-migration-strategy
