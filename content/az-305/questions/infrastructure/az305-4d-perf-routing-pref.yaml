id: az305-4d-perf-routing-pref
objective: "4.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware distributes large software updates from a virtual machine scale set in the East US region. Customers download the updates from the internet through a Standard public load balancer that has a NIC-based backend pool. The monthly internet egress volume is about 400 TB.

    You need to recommend a solution. The solution must meet the following requirements:

    - Minimize the cost of the internet egress data transfer.
    - A download performance comparable to other cloud providers is acceptable.
    - The application code must not change.

    What should you recommend?
  fr: |
    Litware distribue de grosses mises à jour logicielles depuis un groupe de machines virtuelles identiques dans la région East US. Les clients téléchargent les mises à jour depuis Internet par un équilibreur de charge public Standard dont le pool principal est basé sur les cartes réseau. Le volume mensuel de sortie vers Internet est d'environ 400 To.

    Vous devez recommander une solution. La solution doit répondre aux exigences suivantes :

    - Réduire au minimum le coût du transfert de données sortant vers Internet.
    - Des performances de téléchargement comparables à celles des autres fournisseurs de cloud sont acceptables.
    - Le code de l'application ne doit pas changer.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Enable accelerated networking on the scale set instances", fr: "Activer la mise en réseau accélérée sur les instances du groupe identique" } }
    - { id: b, text: { en: "Associate a NAT gateway with the subnet of the scale set", fr: "Associer une passerelle NAT au sous-réseau du groupe identique" } }
    - { id: c, text: { en: "Use a new public IP address with the Internet routing preference as the frontend", fr: "Utiliser comme front-end une nouvelle adresse IP publique avec la préférence de routage Internet" } }
    - { id: d, text: { en: "Order an ExpressRoute Local circuit, which includes egress data transfer in its price", fr: "Commander un circuit ExpressRoute Local, dont le prix inclut le transfert de données sortant" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With the Internet routing preference ("hot potato"), the traffic leaves the Microsoft network in the region that hosts the service and travels over transit ISP networks, and its egress is billed at a lower price. The performance is comparable to other cloud providers, which the requirements accept. The routing preference can't be changed on an existing public IP address, so a new zone-redundant Standard public IP address is created and assigned to the load balancer frontend.
    fr: |
      Avec la préférence de routage Internet (« hot potato »), le trafic quitte le réseau Microsoft dans la région qui héberge le service et emprunte les réseaux des FAI de transit, et sa sortie est facturée à un prix inférieur. Les performances sont comparables à celles des autres fournisseurs de cloud, ce que les exigences acceptent. La préférence de routage ne peut pas être modifiée sur une adresse IP publique existante : on crée donc une nouvelle adresse IP publique Standard redondante interzone, affectée au front-end de l'équilibreur de charge.
  options:
    a:
      en: |
        Accelerated networking improves latency and CPU use inside the virtual machines; it doesn't change the price of the egress traffic.
      fr: |
        La mise en réseau accélérée améliore la latence et l'utilisation du processeur dans les machines virtuelles ; elle ne change pas le prix du trafic sortant.
    b:
      en: |
        A NAT gateway handles outbound connections initiated by the virtual machines, not downloads by internet clients, and it adds its own data processing charge.
      fr: |
        Une passerelle NAT gère les connexions sortantes lancées par les machines virtuelles, pas les téléchargements des clients Internet, et elle ajoute ses propres frais de traitement des données.
    d:
      en: |
        An ExpressRoute circuit carries traffic between Microsoft and the organization's own network; it doesn't serve customers who download from the internet.
      fr: |
        Un circuit ExpressRoute transporte le trafic entre Microsoft et le réseau de l'organisation ; il ne dessert pas les clients qui téléchargent depuis Internet.
references:
  - title: Routing preference in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/routing-preference-overview
