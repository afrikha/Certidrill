id: az305-4a-vm-burstable-size
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso needs an Azure virtual machine for an internal wiki. The average CPU usage of the server is below 10 percent, with peaks of about 80 percent for a few minutes each night when the search index is rebuilt. The virtual machine must stay available and must not be interrupted.

    You need to recommend a virtual machine option that minimizes cost.

    What should you recommend?
  fr: |
    Contoso a besoin d'une machine virtuelle Azure pour un wiki interne. L'utilisation moyenne du processeur du serveur est inférieure à 10 %, avec des pics d'environ 80 % pendant quelques minutes chaque nuit, lors de la reconstruction de l'index de recherche. La machine virtuelle doit rester disponible et ne doit pas être interrompue.

    Vous devez recommander une option de machine virtuelle qui réduit les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A D-series virtual machine", fr: "Une machine virtuelle de série D" } }
    - { id: b, text: { en: "An F-series virtual machine", fr: "Une machine virtuelle de série F" } }
    - { id: c, text: { en: "A B-series virtual machine", fr: "Une machine virtuelle de série B" } }
    - { id: d, text: { en: "A D-series Azure Spot virtual machine", fr: "Une machine virtuelle Azure Spot de série D" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The B-series is the burstable general-purpose family: it is priced for workloads that use little CPU most of the time and need full performance only for short peaks. That is exactly the profile of this server, and a B-series virtual machine is a regular virtual machine that Azure doesn't evict.
    fr: |
      La série B est la famille d'usage général à capacité de rafale (burstable) : son prix est adapté aux charges qui sollicitent peu le processeur la plupart du temps et n'ont besoin de toutes les performances que pendant de courts pics. C'est exactement le profil de ce serveur, et une machine virtuelle de série B est une machine virtuelle ordinaire qu'Azure n'évince pas.
  options:
    a:
      en: The D-series provides full CPU performance all the time for enterprise applications; here that capacity would be paid for and left unused.
      fr: La série D fournit en permanence toutes les performances du processeur pour des applications d'entreprise ; ici, cette capacité serait payée sans être utilisée.
    b:
      en: The F-series is compute optimized, for workloads that use the CPU heavily and continuously.
      fr: La série F est optimisée pour le calcul, pour des charges qui sollicitent le processeur fortement et en continu.
    d:
      en: A Spot virtual machine is cheap but can be evicted with 30 seconds' notice and has no SLA, which breaks the availability requirement.
      fr: Une machine virtuelle Spot est bon marché, mais peut être évincée avec un préavis de 30 secondes et n'a aucun SLA, ce qui enfreint l'exigence de disponibilité.
references:
  - title: Sizes for virtual machines in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/overview
  - title: Azure Spot Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/spot-vms
