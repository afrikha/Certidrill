stem:
  en: |
    You recommend the Flex Consumption plan with virtual network integration.
  fr: |
    Vous recommandez le plan Flex Consumption avec l'intégration au réseau virtuel.
body:
  solution:
    en: |
      You recommend hosting Func1 in a **Flex Consumption** plan with **virtual network integration** to a subnet of VNet1. No always ready instance is configured, and the function timeout keeps its default value.
    fr: |
      Vous recommandez d'héberger Func1 dans un plan **Flex Consumption** avec l'**intégration au réseau virtuel** dans un sous-réseau de VNet1. Aucune instance toujours prête n'est configurée, et le délai d'expiration des fonctions conserve sa valeur par défaut.
answer: { value: true }
explanation:
  correct:
    en: |
      Flex Consumption supports virtual network integration, so Func1 reaches the private endpoint of the database through VNet1. Its function timeout is 30 minutes by default, which covers a 20-minute execution. Without always ready instances, the plan runs on demand: it scales to zero while the queue is empty and bills only the time during which functions execute.
    fr: |
      Flex Consumption prend en charge l'intégration au réseau virtuel : Func1 atteint donc le point de terminaison privé de la base de données à travers VNet1. Son délai d'expiration des fonctions est de 30 minutes par défaut, ce qui couvre une exécution de 20 minutes. Sans instance toujours prête, le plan fonctionne à la demande : il est mis à l'échelle jusqu'à zéro tant que la file d'attente est vide et ne facture que le temps pendant lequel des fonctions s'exécutent.
references:
  - title: "Azure Functions Flex Consumption plan hosting"
    url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-plan
  - title: "Azure Functions hosting options"
