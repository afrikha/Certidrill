id: az305-4b-dep-share-modules
objective: "4.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The platform team of Proseware writes Bicep files that describe approved configurations of storage accounts and virtual networks. All the application teams of Proseware deploy their infrastructure with Bicep.

    You need to recommend how the platform team shares these files. The solution must meet the following requirements:

    - The application teams must reuse the approved code from a central location, by referring to a version.
    - Access must be granted to Microsoft Entra identities through Azure roles, without a SAS token or a public URL.

    Which two solutions meet the requirements? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe de plateforme de Proseware écrit des fichiers Bicep qui décrivent des configurations approuvées de comptes de stockage et de réseaux virtuels. Toutes les équipes applicatives de Proseware déploient leur infrastructure avec Bicep.

    Vous devez recommander la façon dont l'équipe de plateforme partage ces fichiers. La solution doit répondre aux exigences suivantes :

    - Les équipes applicatives doivent réutiliser le code approuvé depuis un emplacement central, en se référant à une version.
    - L'accès doit être accordé à des identités Microsoft Entra au moyen de rôles Azure, sans jeton SAS ni URL publique.

    Quelles sont les deux solutions qui répondent aux exigences ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store the files in a blob container and distribute SAS tokens", fr: "Stocker les fichiers dans un conteneur d'objets blob et distribuer des jetons SAS" } }
    - { id: b, text: { en: "Publish the files as template specs", fr: "Publier les fichiers sous forme de specs de modèle" } }
    - { id: c, text: { en: "Store the files in a public GitHub repository", fr: "Stocker les fichiers dans un dépôt GitHub public" } }
    - { id: d, text: { en: "Publish the files as modules in a private registry hosted in Azure Container Registry", fr: "Publier les fichiers sous forme de modules dans un registre privé hébergé dans Azure Container Registry" } }
    - { id: e, text: { en: "Deploy the files as a deployment stack in each subscription", fr: "Déployer les fichiers sous forme de pile de déploiement dans chaque abonnement" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A template spec is an Azure resource that stores a template in versions; access is managed with Azure RBAC, and read access is enough to deploy it. A private Bicep module registry is hosted in Azure Container Registry: teams with the permission to pull reference a module and its version from their own Bicep files. For teams that all use Bicep, Microsoft describes the choice between the two as mostly a matter of preference."
    fr: "Une spec de modèle est une ressource Azure qui stocke un modèle sous forme de versions ; l'accès se gère avec Azure RBAC, et un accès en lecture suffit pour la déployer. Un registre privé de modules Bicep est hébergé dans Azure Container Registry : les équipes autorisées à extraire (pull) référencent un module et sa version depuis leurs propres fichiers Bicep. Pour des équipes qui utilisent toutes Bicep, Microsoft présente le choix entre les deux comme surtout une affaire de préférence."
  options:
    a:
      en: "Templates in a storage account are shared through SAS tokens or public access, which the requirements exclude."
      fr: "Des modèles dans un compte de stockage se partagent par des jetons SAS ou un accès public, ce que les exigences excluent."
    c:
      en: "A public repository exposes the files to everyone through a public URL."
      fr: "Un dépôt public expose les fichiers à tout le monde par une URL publique."
    e:
      en: "A deployment stack deploys and manages resources; it is not a catalog from which other teams reuse code."
      fr: "Une pile de déploiement déploie et gère des ressources ; ce n'est pas un catalogue dans lequel d'autres équipes réutilisent du code."
references:
  - title: Azure Resource Manager template specs in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/template-specs
  - title: Create a private container registry in Azure for Bicep modules
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/private-module-registry
