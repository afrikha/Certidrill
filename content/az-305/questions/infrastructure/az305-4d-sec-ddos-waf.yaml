id: az305-4d-sec-ddos-waf
objective: "4.4.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank exposes two internet-facing workloads in the East US region:

    - A customer web portal published through Azure Application Gateway Standard_v2
    - A TCP-based market data feed published through a Standard public load balancer

    The workloads use four Standard public IP addresses in total.

    You need to recommend a protection solution. The solution must meet the following requirements:

    - Protect the four public IP addresses against volumetric and protocol attacks with adaptive tuning, attack alerts and mitigation reports.
    - DDoS rapid response support and cost protection aren't required.
    - Block SQL injection and cross-site scripting attempts against the web portal.
    - Minimize costs.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank expose deux charges de travail accessibles depuis Internet dans la région East US :

    - Un portail web client publié par Azure Application Gateway Standard_v2
    - Un flux de données de marché basé sur TCP, publié par un équilibreur de charge public Standard

    Les charges de travail utilisent au total quatre adresses IP publiques Standard.

    Vous devez recommander une solution de protection. La solution doit répondre aux exigences suivantes :

    - Protéger les quatre adresses IP publiques contre les attaques volumétriques et de protocole, avec un réglage adaptatif, des alertes d'attaque et des rapports d'atténuation.
    - Le support de réponse rapide DDoS et la protection des coûts ne sont pas exigés.
    - Bloquer les tentatives d'injection SQL et de scripts intersites contre le portail web.
    - Réduire les coûts au minimum.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Protection of the public IP addresses: [[ddos]]

      Protection of the web portal: [[web]]
    fr: |
      Protection des adresses IP publiques : [[ddos]]

      Protection du portail web : [[web]]
  slots:
    - id: ddos
      options:
        - { id: infra, text: { en: "The default DDoS infrastructure protection", fr: "La protection DDoS d'infrastructure par défaut" } }
        - { id: ipprot, text: "DDoS IP Protection" }
        - { id: netprot, text: "DDoS Network Protection" }
    - id: web
      options:
        - { id: fwprem, text: { en: "Azure Firewall Premium with IDPS in front of Application Gateway", fr: "Le Pare-feu Azure Premium avec IDPS devant Application Gateway" } }
        - { id: nsg, text: { en: "NSG rules on the Application Gateway subnet", fr: "Des règles NSG sur le sous-réseau d'Application Gateway" } }
        - { id: wafv2, text: { en: "The WAF_v2 SKU of Application Gateway with a WAF policy", fr: "La référence SKU WAF_v2 d'Application Gateway avec une stratégie WAF" } }
answer:
  values: { ddos: ipprot, web: wafv2 }
explanation:
  correct:
    en: |
      DDoS IP Protection has the same core mitigation features as DDoS Network Protection, including adaptive tuning, metrics, alerts and mitigation reports. It is billed per protected IP address and only lacks rapid response support, cost protection and the WAF discount, so it is the cheaper choice for four addresses. DDoS Protection works at layers 3 and 4; SQL injection and cross-site scripting are layer 7 attacks that a web application firewall on Application Gateway (WAF_v2) blocks.
    fr: |
      DDoS IP Protection offre les mêmes fonctionnalités d'atténuation de base que DDoS Network Protection, dont le réglage adaptatif, les métriques, les alertes et les rapports d'atténuation. Elle est facturée par adresse IP protégée et ne manque que du support de réponse rapide, de la protection des coûts et de la remise sur le WAF : c'est donc le choix le moins cher pour quatre adresses. La protection DDoS agit aux couches 3 et 4 ; l'injection SQL et les scripts intersites sont des attaques de couche 7 que bloque un pare-feu d'applications web sur Application Gateway (WAF_v2).
  options:
    infra:
      en: |
        The default infrastructure protection doesn't provide tuning to the application's traffic, attack alerts or mitigation reports.
      fr: |
        La protection d'infrastructure par défaut ne fournit ni réglage selon le trafic de l'application, ni alertes d'attaque, ni rapports d'atténuation.
    netprot:
      en: |
        DDoS Network Protection is billed per 100 protected IP addresses and mainly adds rapid response, cost protection and a WAF discount, which aren't required.
      fr: |
        DDoS Network Protection est facturée par tranche de 100 adresses IP protégées et ajoute surtout la réponse rapide, la protection des coûts et une remise sur le WAF, qui ne sont pas exigées.
    fwprem:
      en: |
        Azure Firewall Premium doesn't terminate inbound TLS itself (it relies on Application Gateway for that), so its IDPS can't read the encrypted requests to the portal, and it costs far more than a WAF.
      fr: |
        Le Pare-feu Azure Premium ne termine pas lui-même le TLS entrant (il s'appuie pour cela sur Application Gateway) : son IDPS ne peut donc pas lire les requêtes chiffrées vers le portail, et il coûte bien plus cher qu'un WAF.
    nsg:
      en: |
        NSGs filter on addresses, ports and protocols; they can't inspect the content of HTTP requests.
      fr: |
        Les NSG filtrent sur les adresses, les ports et les protocoles ; ils ne peuvent pas inspecter le contenu des requêtes HTTP.
