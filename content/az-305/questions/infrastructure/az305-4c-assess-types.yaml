id: az305-4c-assess-types
objective: "4.3.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware has discovered its on-premises VMware environment by using Azure Migrate. The architecture board asks three questions before it chooses the migration targets.

    Which type of Azure Migrate assessment should you recommend to answer each question? To answer, drag the appropriate assessment types to the correct questions. Each assessment type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware a découvert son environnement VMware local à l'aide d'Azure Migrate. Le comité d'architecture pose trois questions avant de choisir les cibles de migration.

    Quel type d'évaluation Azure Migrate devez-vous recommander pour répondre à chaque question ? Pour répondre, faites glisser les types d'évaluation appropriés vers les questions correspondantes. Chaque type d'évaluation peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vm, text: { en: "Azure VM assessment", fr: "Évaluation de machines virtuelles Azure" } }
    - { id: sql, text: { en: "Azure SQL assessment", fr: "Évaluation Azure SQL" } }
    - { id: app, text: { en: "Azure App Service assessment", fr: "Évaluation Azure App Service" } }
    - { id: avs, text: { en: "Azure VMware Solution assessment", fr: "Évaluation Azure VMware Solution" } }
  targets:
    - id: t1
      text: { en: "Can the 40 SQL Server instances move to a managed database service, and with which service tier?", fr: "Les 40 instances SQL Server peuvent-elles passer à un service de base de données managé, et avec quel niveau de service ?" }
    - id: t2
      text: { en: "How many nodes would a VMware private cloud in Azure need to run the virtual machines unchanged?", fr: "De combien de nœuds un cloud privé VMware dans Azure aurait-il besoin pour exécuter les machines virtuelles sans les modifier ?" }
    - id: t3
      text: { en: "Can the ASP.NET web applications hosted on IIS run on a managed web hosting platform without code changes?", fr: "Les applications web ASP.NET hébergées sur IIS peuvent-elles s'exécuter sur une plateforme d'hébergement web managée sans modification du code ?" }
answer:
  mapping: { t1: sql, t2: avs, t3: app }
explanation:
  correct:
    en: |
      An Azure SQL assessment checks the readiness of the discovered SQL Server instances and databases and recommends the Azure SQL target with its service tier and size. An Azure VMware Solution assessment computes the number of nodes of the private cloud. An Azure App Service assessment checks whether the discovered ASP.NET web applications can run in App Service. The Azure VM assessment would answer a fourth question: readiness, size and cost as Azure virtual machines.
    fr: |
      Une évaluation Azure SQL vérifie la préparation des instances et des bases de données SQL Server découvertes et recommande la cible Azure SQL avec son niveau de service et sa taille. Une évaluation Azure VMware Solution calcule le nombre de nœuds du cloud privé. Une évaluation Azure App Service vérifie si les applications web ASP.NET découvertes peuvent s'exécuter dans App Service. L'évaluation de machines virtuelles Azure répondrait à une quatrième question : préparation, taille et coût en machines virtuelles Azure.
references:
  - title: Assessment overview (migrate to Azure VMs)
    url: https://learn.microsoft.com/en-us/azure/migrate/concepts-assessment-calculation?view=migrate-classic
  - title: What is Azure Migrate?
    url: https://learn.microsoft.com/en-us/azure/migrate/migrate-services-overview
