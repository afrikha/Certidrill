id: az305-4b-evt-blob-thumbnail
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores product photos in an Azure Storage account. Partner applications upload about 2,000 photos per day, at irregular times.

    You need to recommend a solution that starts an Azure function to generate a thumbnail each time a photo is uploaded. The solution must meet the following requirements:

    - The partner applications must not be modified.
    - The function must be notified within seconds, without polling the storage account.
    - Contoso must pay only for the notifications that are delivered.

    What should you include in the recommendation?
  fr: |
    Contoso stocke des photos de produits dans un compte Stockage Azure. Des applications partenaires chargent environ 2 000 photos par jour, à des moments irréguliers.

    Vous devez recommander une solution qui démarre une fonction Azure pour générer une miniature à chaque chargement d'une photo. La solution doit répondre aux exigences suivantes :

    - Les applications partenaires ne doivent pas être modifiées.
    - La fonction doit être avertie en quelques secondes, sans interroger le compte de stockage.
    - Contoso ne doit payer que les notifications remises.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: Azure Event Hubs }
    - { id: b, text: Azure Event Grid }
    - { id: c, text: Azure Service Bus }
    - { id: d, text: { en: "Azure Queue Storage", fr: "Stockage File d'attente Azure" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Azure Storage publishes an event to Event Grid when a blob is created, with no change to the applications that upload. An event subscription pushes the event to the function within seconds, and Event Grid is serverless and billed per event."
    fr: "Stockage Azure publie un événement dans Event Grid à la création d'un objet blob, sans modification des applications qui chargent les fichiers. Un abonnement aux événements pousse l'événement vers la fonction en quelques secondes, et Event Grid est un service serverless facturé à l'événement."
  options:
    a:
      en: "Event Hubs ingests streams that producers send to it and is billed by provisioned capacity; the storage account does not send its blob events there by itself."
      fr: "Event Hubs ingère des flux que des producteurs lui envoient et se facture à la capacité provisionnée ; le compte de stockage n'y envoie pas de lui-même ses événements d'objets blob."
    c:
      en: "A Service Bus queue receives messages that a sender puts in it; the partner applications would have to be modified to send a message after each upload."
      fr: "Une file d'attente Service Bus reçoit les messages qu'un expéditeur y dépose ; il faudrait modifier les applications partenaires pour envoyer un message après chaque chargement."
    d:
      en: "A storage queue also needs a sender, and its consumers poll the queue instead of being notified."
      fr: "Une file d'attente de stockage nécessite elle aussi un expéditeur, et ses consommateurs interrogent la file au lieu d'être avertis."
references:
  - title: What is Azure Event Grid?
    url: https://learn.microsoft.com/en-us/azure/event-grid/overview
  - title: Choose between Azure Event Grid, Event Hubs, and Service Bus
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/compare-messaging-services
