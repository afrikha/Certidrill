id: az305-4c-net-explicit-outbound
objective: "4.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys creates a new virtual network. Its subnets are private subnets: default outbound access is disabled. Virtual machines in a subnet named **App** must download updates from the internet. The virtual machines have no public IP addresses and are not behind a load balancer.

    You need to recommend an explicit method of outbound connectivity for the virtual machines.

    Which two options meet the goal? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys crée un nouveau réseau virtuel. Ses sous-réseaux sont des sous-réseaux privés : l'accès sortant par défaut est désactivé. Des machines virtuelles d'un sous-réseau nommé **App** doivent télécharger des mises à jour depuis Internet. Les machines virtuelles n'ont pas d'adresse IP publique et ne sont pas derrière un équilibreur de charge.

    Vous devez recommander une méthode explicite de connectivité sortante pour les machines virtuelles.

    Quelles sont les deux options qui permettent d'atteindre l'objectif ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Place the virtual machines in the backend pool of an internal Standard load balancer.", fr: "Placer les machines virtuelles dans le pool principal d'un équilibreur de charge interne Standard." } }
    - { id: b, text: { en: "Place the virtual machines in the backend pool of a Standard public load balancer that has an outbound rule.", fr: "Placer les machines virtuelles dans le pool principal d'un équilibreur de charge public Standard doté d'une règle de trafic sortant." } }
    - { id: c, text: { en: "Add an outbound security rule that allows the Internet service tag to the network security group of the subnet.", fr: "Ajouter au groupe de sécurité réseau du sous-réseau une règle de sécurité sortante qui autorise l'étiquette de service Internet." } }
    - { id: d, text: { en: "Assign a Standard public IP address to the network interface of each virtual machine.", fr: "Attribuer une adresse IP publique Standard à l'interface réseau de chaque machine virtuelle." } }
    - { id: e, text: { en: "Enable a service endpoint for Microsoft.Storage on the subnet.", fr: "Activer un point de terminaison de service pour Microsoft.Storage sur le sous-réseau." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      In a private subnet, a virtual machine reaches the internet only through an explicit method: a NAT gateway on the subnet, an outbound rule of a Standard public load balancer, a public IP address on the machine, or a firewall or appliance reached by a route. An outbound rule uses the public frontend of the load balancer for source NAT, and an instance-level public IP address gives the machine its own outbound address.
    fr: |
      Dans un sous-réseau privé, une machine virtuelle n'atteint Internet que par une méthode explicite : une passerelle NAT sur le sous-réseau, une règle de trafic sortant d'un équilibreur de charge public Standard, une adresse IP publique sur la machine, ou un pare-feu ou une appliance atteints par un itinéraire. Une règle de trafic sortant utilise le front-end public de l'équilibreur de charge pour la traduction d'adresses source, et une adresse IP publique d'instance donne à la machine sa propre adresse sortante.
  options:
    a:
      en: An internal load balancer has only private frontends and provides no outbound connectivity to the internet.
      fr: Un équilibreur de charge interne n'a que des front-ends privés et ne fournit aucune connectivité sortante vers Internet.
    c:
      en: A network security group only filters traffic; allowing a flow doesn't give the machines a public address to leave with.
      fr: Un groupe de sécurité réseau ne fait que filtrer le trafic ; autoriser un flux ne donne pas aux machines une adresse publique pour sortir.
    e:
      en: A service endpoint reaches Azure Storage over the Microsoft backbone; it gives no access to update sites on the internet.
      fr: Un point de terminaison de service atteint Stockage Azure par le réseau principal de Microsoft ; il ne donne aucun accès aux sites de mise à jour sur Internet.
references:
  - title: Default outbound access in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/default-outbound-access
