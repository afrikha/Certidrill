id: az305-cs1b-messaging-services
objective: "4.2.2"
type: dragdrop
caseStudy: az305-cs1b-blue-yonder
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a service for each data flow of the planned changes. The solution must meet the requirements for messages and events.

    Which service should you recommend for each data flow? To answer, drag the appropriate services to the correct data flows. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander un service pour chaque flux de données des changements prévus. La solution doit répondre aux exigences relatives aux messages et aux événements.

    Quel service devez-vous recommander pour chaque flux de données ? Pour répondre, faites glisser les services appropriés vers les flux de données correspondants. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: grid, text: "Azure Event Grid" }
    - { id: queue, text: { en: "Azure Queue Storage", fr: "Stockage File d'attente Azure (Queue Storage)" } }
    - { id: hubs, text: "Azure Event Hubs" }
    - { id: bus, text: "Azure Service Bus" }
  targets:
    - id: ticketing
      text: { en: "Ticketing requests sent by app-booking to the ticketing service", fr: "Demandes d'émission envoyées par app-booking au service de billetterie" }
    - id: baggage
      text: { en: "Baggage scan events sent by the airports", fr: "Événements de lecture des bagages envoyés par les aéroports" }
    - id: boarding
      text: { en: "Creation of a boarding pass in the boarding-passes container", fr: "Création d'une carte d'embarquement dans le conteneur boarding-passes" }
answer:
  mapping: { ticketing: bus, baggage: hubs, boarding: grid }
explanation:
  correct:
    en: |
      Ticketing requests are high-value messages: Azure Service Bus provides ordered processing with sessions, duplicate detection and a dead-letter queue for the messages that keep failing. The baggage scanners produce a high-volume stream: Azure Event Hubs ingests it and retains it, so that each consumer group reads the stream independently and can read it again. The creation of a blob is a discrete event: Azure Event Grid pushes it to the function, which doesn't have to poll.
    fr: |
      Les demandes d'émission sont des messages de grande valeur : Azure Service Bus offre le traitement ordonné avec les sessions, la détection des doublons et une file d'attente de lettres mortes pour les messages qui échouent sans cesse. Les lecteurs de bagages produisent un flux volumineux : Azure Event Hubs l'ingère et le conserve, de sorte que chaque groupe de consommateurs lit le flux indépendamment et peut le relire. La création d'un objet blob est un événement discret : Azure Event Grid le pousse vers la fonction, qui n'a pas à interroger le conteneur.
  options:
    queue:
      en: Queue Storage is a simple queue that guarantees neither ordering nor duplicate detection, has no dead-letter queue and delivers each message to a single reader.
      fr: Stockage File d'attente Azure est une file d'attente simple qui ne garantit ni l'ordre ni la détection des doublons, n'a pas de file d'attente de lettres mortes et remet chaque message à un seul lecteur.
references:
  - title: Choose between Azure Event Grid, Event Hubs, and Service Bus
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/compare-messaging-services
