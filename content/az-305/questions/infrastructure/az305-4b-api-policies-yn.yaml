id: az305-4b-api-policies-yn
objective: "4.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank publishes APIs through an Azure API Management instance in the Standard v2 tier. A mobile application used by 50,000 customers calls the APIs with a single subscription key and sends the Microsoft Entra token of each customer.

    You are evaluating what the instance can provide.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank publie des API via une instance Azure API Management de niveau Standard v2. Une application mobile utilisée par 50 000 clients appelle les API avec une seule clé d'abonnement et envoie le jeton Microsoft Entra de chaque client.

    Vous évaluez ce que l'instance peut fournir.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A rate-limit-by-key policy that uses a claim of the token as its key can limit each customer to 100 calls per minute."
        fr: "Une stratégie rate-limit-by-key qui utilise une revendication du jeton comme clé peut limiter chaque client à 100 appels par minute."
    - id: s2
      text:
        en: "Responses to identical GET requests can be served from the built-in cache of the instance, without deploying a Redis cache."
        fr: "Les réponses à des requêtes GET identiques peuvent être servies depuis le cache intégré de l'instance, sans déployer de cache Redis."
    - id: s3
      text:
        en: "To publish a developer portal for partner developers, Woodgrove Bank must move the instance to the Premium v2 tier."
        fr: "Pour publier un portail des développeurs destiné aux développeurs partenaires, Woodgrove Bank doit faire passer l'instance au niveau Premium v2."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "The rate-limit policy counts calls per subscription, which cannot separate customers who share a key; rate-limit-by-key counts them per key computed by an expression, for example the subject claim of the JWT. Every tier except Consumption has a built-in cache (1 GB in Standard v2) that the response caching policies use. The developer portal is available in every tier except Consumption, so no tier change is needed."
    fr: "La stratégie rate-limit compte les appels par abonnement, ce qui ne permet pas de distinguer des clients qui partagent une clé ; rate-limit-by-key les compte par clé calculée par une expression, par exemple la revendication de sujet du jeton JWT. Tous les niveaux sauf Consumption ont un cache intégré (1 Go en Standard v2) qu'utilisent les stratégies de mise en cache des réponses. Le portail des développeurs est disponible dans tous les niveaux sauf Consumption : aucun changement de niveau n'est nécessaire."
references:
  - title: Advanced request throttling with Azure API Management
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-sample-flexible-throttling
  - title: Feature-based comparison of the Azure API Management tiers
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-features
