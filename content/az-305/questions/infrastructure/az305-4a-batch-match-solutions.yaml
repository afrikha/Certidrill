id: az305-4a-batch-match-solutions
objective: "4.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware has three batch processing requirements.

    Which solution should you recommend for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware a trois besoins de traitement par lots.

    Quelle solution devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: batch, text: Azure Batch }
    - { id: cycle, text: Azure CycleCloud }
    - { id: func, text: { en: "Azure Functions with a timer trigger", fr: "Azure Functions avec un déclencheur de minuteur" } }
    - { id: aksjob, text: { en: "Kubernetes jobs on Azure Kubernetes Service (AKS)", fr: "Des travaux Kubernetes sur Azure Kubernetes Service (AKS)" } }
    - { id: logic, text: Azure Logic Apps }
  targets:
    - id: t1
      text:
        en: A cleanup script of about 20 seconds must run every hour, with no server to manage and billing per execution.
        fr: Un script de nettoyage d'environ 20 secondes doit s'exécuter toutes les heures, sans serveur à gérer et avec une facturation à l'exécution.
    - id: t2
      text:
        en: An engineering department must keep its PBS Pro scheduler, its queues and its job scripts when it moves its HPC cluster to Azure.
        fr: Un service d'ingénierie doit conserver son planificateur PBS Pro, ses files d'attente et ses scripts de travaux lorsqu'il déplace son cluster HPC vers Azure.
    - id: t3
      text:
        en: A data team must run its batch workloads as Kubernetes Job manifests on the Kubernetes platform that it already operates in Azure.
        fr: Une équipe de données doit exécuter ses traitements par lots sous forme de manifestes Kubernetes Job sur la plateforme Kubernetes qu'elle exploite déjà dans Azure.
answer:
  mapping: { t1: func, t2: cycle, t3: aksjob }
explanation:
  correct:
    en: |
      A timer-triggered function runs short code on a schedule, serverless and billed per execution. CycleCloud deploys familiar schedulers such as PBS Pro or Slurm and autoscales the infrastructure, so scheduler-specific scripts, queues and policies are preserved. Workloads that are already written as Kubernetes Job manifests run unchanged on the existing AKS platform.
    fr: |
      Une fonction déclenchée par un minuteur exécute du code court selon une planification, en mode serverless et avec une facturation à l'exécution. CycleCloud déploie des planificateurs familiers comme PBS Pro ou Slurm et met l'infrastructure à l'échelle automatiquement : les scripts, les files d'attente et les stratégies propres au planificateur sont conservés. Les traitements déjà écrits sous forme de manifestes Kubernetes Job s'exécutent sans modification sur la plateforme AKS existante.
  options:
    batch:
      en: Batch is its own scheduler as a service, used through the Batch APIs; adopting it means leaving PBS Pro scripts or Kubernetes manifests behind, and it is oversized for an hourly script.
      fr: Batch est son propre planificateur en tant que service, utilisé par les API Batch ; l'adopter revient à abandonner les scripts PBS Pro ou les manifestes Kubernetes, et il est surdimensionné pour un script horaire.
    logic:
      en: Logic Apps orchestrates connectors in a designer; it isn't meant to run a script, an HPC scheduler or Kubernetes manifests.
      fr: Logic Apps orchestre des connecteurs dans un concepteur ; il n'est pas destiné à exécuter un script, un planificateur HPC ou des manifestes Kubernetes.
references:
  - title: What is Azure CycleCloud?
    url: https://learn.microsoft.com/en-us/azure/cyclecloud/overview
  - title: What is Azure Batch?
    url: https://learn.microsoft.com/en-us/azure/batch/batch-technical-overview
