id: az305-cs3c-booking-messaging
objective: "4.2.1"
type: dropdown
caseStudy: az305-cs3c-alpineski
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a messaging solution for the booking messages. The solution must meet the messaging requirements and minimize costs.

    What should you recommend? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution de messagerie pour les messages de réservation. La solution doit satisfaire les exigences de messagerie et réduire les coûts au minimum.

    Que devez-vous recommander ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Messaging entity: [[entity]]

      Feature that keeps the order of the messages of a booking: [[order]]

      Service tier: [[tier]]
    fr: |
      Entité de messagerie : [[entity]]

      Fonctionnalité qui conserve l'ordre des messages d'une réservation : [[order]]

      Niveau de service : [[tier]]
  slots:
    - id: entity
      options:
        - { id: ehub, text: { en: "An event hub with three consumer groups", fr: "Un hub d'événements avec trois groupes de consommateurs" } }
        - { id: queue, text: { en: "A Service Bus queue with three receivers", fr: "Une file d'attente Service Bus avec trois récepteurs" } }
        - { id: topic, text: { en: "A Service Bus topic with three subscriptions", fr: "Une rubrique Service Bus avec trois abonnements" } }
    - id: order
      options:
        - { id: dedup, text: { en: "Duplicate detection", fr: "Détection des doublons" } }
        - { id: defer, text: { en: "Message deferral", fr: "Report de messages" } }
        - { id: sessions, text: { en: "Message sessions", fr: "Sessions de messages" } }
    - id: tier
      options:
        - { id: basic, text: Basic }
        - { id: standard, text: Standard }
        - { id: premium, text: Premium }
answer:
  values: { entity: topic, order: sessions, tier: standard }
explanation:
  correct:
    en: "A Service Bus topic gives each subscription its own copy of every message, and the filter of a subscription keeps only the message types that its consumer wants. Sessions, enabled on the subscriptions, group the messages that carry the same session ID, here the booking, and deliver them in first-in, first-out order. Topics, sessions and duplicate detection all exist in the Standard tier, which is cheaper than Premium and is sufficient for messages under 256 KB that use the public endpoint."
    fr: "Une rubrique Service Bus donne à chaque abonnement sa propre copie de chaque message, et le filtre d'un abonnement ne garde que les types de messages voulus par son consommateur. Les sessions, activées sur les abonnements, regroupent les messages qui portent le même ID de session, ici la réservation, et les remettent dans l'ordre premier entré, premier sorti. Les rubriques, les sessions et la détection des doublons existent toutes dans le niveau Standard, moins cher que Premium et suffisant pour des messages de moins de 256 Ko qui utilisent le point de terminaison public."
  options:
    ehub:
      en: "An event hub lets several consumer groups read the same stream, but it has no filter per consumer and no duplicate detection."
      fr: "Un hub d'événements permet à plusieurs groupes de consommateurs de lire le même flux, mais il n'a ni filtre par consommateur ni détection des doublons."
    queue:
      en: "The receivers of a queue compete for the messages. Each message is processed by only one of them, not by the three consumers."
      fr: "Les récepteurs d'une file d'attente sont en concurrence pour les messages. Chaque message n'est traité que par l'un d'eux, pas par les trois consommateurs."
    dedup:
      en: "Duplicate detection discards a message whose message ID was already seen during the detection window. It covers the retry requirement, not the processing order."
      fr: "La détection des doublons écarte un message dont l'ID de message a déjà été vu pendant la fenêtre de détection. Elle couvre l'exigence sur les nouvelles tentatives, pas l'ordre de traitement."
    defer:
      en: "Deferral lets a receiver set a message aside and retrieve it later. It doesn't guarantee an order by itself."
      fr: "Le report permet à un récepteur de mettre un message de côté et de le récupérer plus tard. Il ne garantit pas un ordre à lui seul."
    basic:
      en: "The Basic tier offers queues only, without topics, sessions or duplicate detection."
      fr: "Le niveau Basic n'offre que des files d'attente, sans rubriques, sessions ni détection des doublons."
    premium:
      en: "Premium adds dedicated capacity, messages up to 100 MB and private endpoints. None of these is required, so its fixed price isn't justified."
      fr: "Premium ajoute une capacité dédiée, des messages jusqu'à 100 Mo et des points de terminaison privés. Rien de tout cela n'est exigé : son prix fixe n'est donc pas justifié."
references:
  - title: Message sessions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-sessions
  - title: Service Bus queues, topics, and subscriptions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-queues-topics-subscriptions
