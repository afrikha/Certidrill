id: az305-4c-assess-discovery-statements
objective: "4.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs 300 virtual machines on Hyper-V hosts in one datacenter. You plan to use Azure Migrate to evaluate the servers for a migration to Azure virtual machines.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders exécute 300 machines virtuelles sur des hôtes Hyper-V dans un centre de données. Vous prévoyez d'utiliser Azure Migrate pour évaluer les serveurs en vue d'une migration vers des machines virtuelles Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An Azure Migrate appliance can discover the virtual machines and their installed software without an agent in each virtual machine.
        fr: Une appliance Azure Migrate peut découvrir les machines virtuelles et leurs logiciels installés sans agent dans chaque machine virtuelle.
    - id: s2
      text:
        en: An assessment that uses the as on-premises sizing criterion takes the collected CPU and memory utilization into account.
        fr: Une évaluation qui utilise le critère de dimensionnement en l'état local (As on-premises) tient compte de l'utilisation collectée du processeur et de la mémoire.
    - id: s3
      text:
        en: Northwind Traders can create an assessment from a CSV file that lists the servers, before any appliance is deployed.
        fr: Northwind Traders peut créer une évaluation à partir d'un fichier CSV qui répertorie les serveurs, avant le déploiement de toute appliance.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The appliance performs an agentless discovery: it connects to the Hyper-V hosts and, with the credentials that you provide, collects the configuration, the performance data and the software inventory of the servers. As on-premises sizing keeps the allocated cores, memory and disks; only performance-based sizing uses the utilization data. Azure Migrate can also assess servers whose inventory is imported from a CSV file, which gives a first estimate before an appliance exists.
    fr: |
      L'appliance effectue une découverte sans agent : elle se connecte aux hôtes Hyper-V et, avec les informations d'identification que vous fournissez, collecte la configuration, les données de performances et l'inventaire logiciel des serveurs. Le dimensionnement en l'état local conserve les cœurs, la mémoire et les disques alloués ; seul le dimensionnement basé sur les performances utilise les données d'utilisation. Azure Migrate peut aussi évaluer des serveurs dont l'inventaire est importé depuis un fichier CSV, ce qui donne une première estimation avant qu'une appliance n'existe.
references:
  - title: Assessment overview (migrate to Azure VMs)
    url: https://learn.microsoft.com/en-us/azure/migrate/concepts-assessment-calculation?view=migrate-classic
  - title: "Tutorial: Build a business case or assess servers using an imported CSV file"
    url: https://learn.microsoft.com/en-us/azure/migrate/tutorial-discover-import
