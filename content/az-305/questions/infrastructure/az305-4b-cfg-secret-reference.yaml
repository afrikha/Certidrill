id: az305-4b-cfg-secret-reference
objective: "4.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware centralizes the settings of its applications, which run on Azure App Service, in an Azure App Configuration store. One of the settings is the password of a SQL database.

    The security team requires that no secret and no access key appear in the code, in configuration files or in the deployment pipelines.

    You need to recommend how to manage the password.

    How should you complete the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware centralise les paramètres de ses applications, qui s'exécutent sur Azure App Service, dans un magasin Azure App Configuration. L'un des paramètres est le mot de passe d'une base de données SQL.

    L'équipe de sécurité exige qu'aucun secret ni aucune clé d'accès n'apparaisse dans le code, dans les fichiers de configuration ou dans les pipelines de déploiement.

    Vous devez recommander la façon de gérer le mot de passe.

    Comment devez-vous compléter la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Store the password in [[store]].

      In the App Configuration store, create [[ref]] that points to the password.

      Let the applications access both services by using [[auth]].
    fr: |
      Stockez le mot de passe dans [[store]].

      Dans le magasin App Configuration, créez [[ref]] qui pointe vers le mot de passe.

      Faites accéder les applications aux deux services à l'aide de [[auth]].
  slots:
    - id: store
      options:
        - { id: appcfg, text: { en: "a key-value of the App Configuration store", fr: "une paire clé-valeur du magasin App Configuration" } }
        - { id: kv, text: { en: "an Azure Key Vault secret", fr: "un secret Azure Key Vault" } }
        - { id: appsetting, text: { en: "an App Service app setting", fr: "un paramètre d'application App Service" } }
    - id: ref
      options:
        - { id: flag, text: { en: "a feature flag", fr: "un indicateur de fonctionnalité" } }
        - { id: snapshot, text: { en: "a snapshot", fr: "un instantané" } }
        - { id: label, text: { en: "a label", fr: "une étiquette" } }
        - { id: kvref, text: { en: "a Key Vault reference", fr: "une référence Key Vault" } }
    - id: auth
      options:
        - { id: mi, text: { en: "a managed identity", fr: "une identité managée" } }
        - { id: connstr, text: { en: "the connection string of the store", fr: "la chaîne de connexion du magasin" } }
        - { id: sp, text: { en: "a service principal with a client secret", fr: "un principal de service avec une clé secrète client" } }
answer:
  values: { store: kv, ref: kvref, auth: mi }
explanation:
  correct:
    en: "Microsoft recommends keeping application secrets in Key Vault and using App Configuration side by side with it: a key-value of the store holds a Key Vault reference, and the secret itself stays in the vault. A managed identity lets the applications authenticate to the store and to the vault through Microsoft Entra ID, with no connection string or secret to store."
    fr: "Microsoft recommande de conserver les secrets d'application dans Key Vault et d'utiliser App Configuration à ses côtés : une paire clé-valeur du magasin contient une référence Key Vault, et le secret lui-même reste dans le coffre. Une identité managée permet aux applications de s'authentifier auprès du magasin et du coffre via Microsoft Entra ID, sans chaîne de connexion ni secret à stocker."
  options:
    appcfg: { en: "App Configuration encrypts its data, but Key Vault remains the recommended place for secrets.", fr: "App Configuration chiffre ses données, mais Key Vault reste l'emplacement recommandé pour les secrets." }
    connstr: { en: "The connection string of the store contains an access key, which the security team forbids.", fr: "La chaîne de connexion du magasin contient une clé d'accès, ce que l'équipe de sécurité interdit." }
    sp: { en: "A client secret is itself a secret that would have to be stored and rotated.", fr: "Une clé secrète client est elle-même un secret qu'il faudrait stocker et renouveler." }
references:
  - title: Azure App Configuration FAQ
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/faq
  - title: Azure App Configuration best practices
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/howto-best-practices
