id: az305-4c-data-offline-statements
objective: "4.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a remote site with a 20-Mbps internet link. The site must import 25 TB of files to an Azure storage account. Later, it must receive an export of 10 TB of blobs from Azure.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys possède un site distant doté d'une liaison Internet de 20 Mbit/s. Le site doit importer 25 To de fichiers dans un compte de stockage Azure. Plus tard, il devra recevoir une exportation de 10 To d'objets blob depuis Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A single Azure Data Box Disk order can hold the 25 TB to import.
        fr: Une seule commande Azure Data Box Disk peut contenir les 25 To à importer.
    - id: s2
      text:
        en: An Azure Data Box Disk order can deliver the 10-TB export from Azure.
        fr: Une commande Azure Data Box Disk peut livrer l'exportation de 10 To depuis Azure.
    - id: s3
      text:
        en: The Azure Import/Export service can export the 10 TB of blobs to disk drives that Tailspin Toys supplies.
        fr: Le service Azure Import/Export peut exporter les 10 To d'objets blob vers des disques fournis par Tailspin Toys.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      A Data Box Disk order contains up to five 8-TB disks, about 35 TB of usable capacity, which is enough for 25 TB. Data Box Disk only supports imports to Azure. An export from Blob Storage uses a Data Box device or the Azure Import/Export service, to which the customer ships its own drives.
    fr: |
      Une commande Data Box Disk comprend jusqu'à cinq disques de 8 To, soit environ 35 To de capacité utilisable, ce qui suffit pour 25 To. Data Box Disk ne prend en charge que les importations vers Azure. Une exportation depuis le Stockage Blob utilise un appareil Data Box ou le service Azure Import/Export, auquel le client expédie ses propres disques.
references:
  - title: What is Azure Data Box Disk?
    url: https://learn.microsoft.com/en-us/azure/databox/data-box-disk-overview
  - title: What is Azure Import/Export service?
    url: https://learn.microsoft.com/en-us/azure/import-export/storage-import-export-service
