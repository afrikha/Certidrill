id: az305-4c-db-offline-methods
objective: "4.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys plans to migrate two databases from an on-premises SQL Server 2019 instance.

    | Database | Size | Target |
    | --- | --- | --- |
    | DB1 | 12 GB | Azure SQL Database |
    | DB2 | 900 GB | Azure SQL Managed Instance |

    Each application can be stopped for a full weekend. The company wants a one-time copy of each database, without configuring continuous replication and without deploying a migration service.

    Which migration method should you recommend for each database? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prévoit de migrer deux bases de données d'une instance SQL Server 2019 locale.

    | Base de données | Taille | Cible |
    | --- | --- | --- |
    | DB1 | 12 Go | Azure SQL Database |
    | DB2 | 900 Go | Azure SQL Managed Instance |

    Chaque application peut être arrêtée pendant un week-end entier. L'entreprise veut une copie ponctuelle de chaque base de données, sans configurer de réplication continue et sans déployer de service de migration.

    Quelle méthode de migration devez-vous recommander pour chaque base de données ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      DB1: [[db1]]

      DB2: [[db2]]
    fr: |
      DB1 : [[db1]]

      DB2 : [[db2]]
  slots:
    - id: db1
      options:
        - { id: native, text: { en: "Native backup and restore from Azure Blob Storage", fr: "Sauvegarde et restauration natives à partir du Stockage Blob Azure" } }
        - { id: bacpac, text: { en: "BACPAC export and import", fr: "Exportation et importation BACPAC" } }
        - { id: link, text: { en: "Managed Instance link", fr: "Lien Managed Instance" } }
        - { id: lrs, text: "Log Replay Service" }
    - id: db2
      options:
        - { id: repl, text: { en: "Transactional replication", fr: "Réplication transactionnelle" } }
        - { id: link, text: { en: "Managed Instance link", fr: "Lien Managed Instance" } }
        - { id: ssma, text: "SQL Server Migration Assistant (SSMA)" }
        - { id: native, text: { en: "Native backup and restore from Azure Blob Storage", fr: "Sauvegarde et restauration natives à partir du Stockage Blob Azure" } }
answer:
  values: { db1: bacpac, db2: native }
explanation:
  correct:
    en: |
      Azure SQL Database can't restore a native SQL Server backup file; for a small database and an accepted downtime, a BACPAC file exported from the source and imported into the target is the simple one-time copy. Azure SQL Managed Instance can restore a native backup taken to a URL in Azure Blob Storage, which is the simplest offline method for a large database when a maintenance window exists.
    fr: |
      Azure SQL Database ne peut pas restaurer un fichier de sauvegarde SQL Server natif ; pour une petite base de données et une interruption acceptée, un fichier BACPAC exporté de la source et importé dans la cible constitue la copie ponctuelle simple. Azure SQL Managed Instance peut restaurer une sauvegarde native effectuée vers une URL du Stockage Blob Azure : c'est la méthode hors connexion la plus simple pour une grande base de données quand une fenêtre de maintenance existe.
  options:
    link:
      en: The Managed Instance link sets up continuous replication, and it only targets Azure SQL Managed Instance.
      fr: Le lien Managed Instance met en place une réplication continue et ne cible qu'Azure SQL Managed Instance.
    lrs:
      en: Log Replay Service targets Azure SQL Managed Instance, not Azure SQL Database.
      fr: Log Replay Service cible Azure SQL Managed Instance, pas Azure SQL Database.
    repl:
      en: Transactional replication is a continuous mechanism to configure, which the company wants to avoid.
      fr: La réplication transactionnelle est un mécanisme continu à configurer, ce que l'entreprise veut éviter.
    ssma:
      en: SSMA is meant for sources that aren't SQL Server, such as Oracle or MySQL.
      fr: SSMA est destiné aux sources autres que SQL Server, comme Oracle ou MySQL.
references:
  - title: "Migration overview: SQL Server to Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/migration-guides/database/sql-server-to-sql-database-overview
  - title: "Migration overview: SQL Server to Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/migration-guides/managed-instance/sql-server-to-managed-instance-overview
