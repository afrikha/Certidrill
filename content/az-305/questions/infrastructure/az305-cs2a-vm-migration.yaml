id: az305-cs2a-vm-migration
objective: "4.3.3"
type: multi
caseStudy: az305-cs2a-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution to migrate the CareRecord virtual machines to Azure. The solution must support the planned changes and meet the migration requirements.

    Which two elements should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une solution pour migrer les machines virtuelles de CareRecord vers Azure. La solution doit prendre en charge les changements prévus et respecter les exigences relatives à la migration.

    Quels sont les deux éléments à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Agent-based replication with the Mobility service of Azure Migrate", fr: "La réplication basée sur un agent avec le service Mobilité d'Azure Migrate" } }
    - { id: b, text: { en: "Agentless replication with the Azure Migrate appliance", fr: "La réplication sans agent avec l'appliance Azure Migrate" } }
    - { id: c, text: { en: "A test failover of Azure Site Recovery", fr: "Un test de basculement d'Azure Site Recovery" } }
    - { id: d, text: { en: "A test migration of Azure Migrate to a non-production virtual network", fr: "Une migration de test d'Azure Migrate vers un réseau virtuel hors production" } }
    - { id: e, text: { en: "An Azure VMware Solution private cloud with VMware HCX", fr: "Un cloud privé Azure VMware Solution avec VMware HCX" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: For VMware virtual machines, Azure Migrate recommends agentless replication. The Azure Migrate appliance replicates the disks through VMware snapshots while the machines keep running, so nothing is installed in the certified guest operating systems. The same tool then runs a test migration, which starts a copy of a machine in Azure from the replicated data and leaves the machine in Ghent untouched, before the final migration.
    fr: Pour les machines virtuelles VMware, Azure Migrate recommande la réplication sans agent. L'appliance Azure Migrate réplique les disques au moyen d'instantanés VMware pendant que les machines continuent de fonctionner ; rien n'est donc installé dans les systèmes d'exploitation invités certifiés. Le même outil exécute ensuite une migration de test, qui démarre dans Azure une copie d'une machine à partir des données répliquées, sans toucher à la machine de Gand, avant la migration finale.
  options:
    a: { en: "Agent-based replication installs the Mobility service agent in each guest operating system, which the vendor forbids.", fr: "La réplication basée sur un agent installe l'agent du service Mobilité dans chaque système d'exploitation invité, ce que l'éditeur interdit." }
    c: { en: "Site Recovery is the disaster recovery service, not the migration tool, and it also relies on the Mobility service for VMware machines.", fr: "Site Recovery est le service de reprise d'activité, pas l'outil de migration, et il repose lui aussi sur le service Mobilité pour les machines VMware." }
    e: { en: "Azure VMware Solution keeps the machines on VMware hosts; the planned change is a migration to Azure virtual machines.", fr: "Azure VMware Solution conserve les machines sur des hôtes VMware ; le changement prévu est une migration vers des machines virtuelles Azure." }
references:
  - title: Agentless and Agent-based migration methods
    url: https://learn.microsoft.com/en-us/azure/migrate/server-migrate-overview
