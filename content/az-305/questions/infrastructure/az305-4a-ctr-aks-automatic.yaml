id: az305-4a-ctr-aks-automatic
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso packages its platform as Helm charts that install custom resource definitions (CRDs) and Kubernetes operators. Engineers manage the workloads with kubectl.

    You need to recommend a hosting service in Azure. The solution must meet the following requirements:

    - Keep the Helm charts, the CRDs and the operators unchanged.
    - Minimize the effort spent on node provisioning, node scaling and cluster upgrades.

    What should you recommend?
  fr: |
    Contoso empaquette sa plateforme sous forme de charts Helm qui installent des définitions de ressources personnalisées (CRD) et des opérateurs Kubernetes. Les ingénieurs gèrent les charges de travail avec kubectl.

    Vous devez recommander un service d'hébergement dans Azure. La solution doit répondre aux exigences suivantes :

    - Conserver les charts Helm, les CRD et les opérateurs sans modification.
    - Réduire au minimum l'effort consacré au provisionnement des nœuds, à leur mise à l'échelle et aux mises à niveau du cluster.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An AKS Automatic cluster", fr: "Un cluster AKS Automatic" } }
    - { id: b, text: { en: "An AKS Standard cluster with manually scaled node pools", fr: "Un cluster AKS Standard avec des pools de nœuds mis à l'échelle manuellement" } }
    - { id: c, text: { en: "An Azure Container Apps environment with the Dedicated plan", fr: "Un environnement Azure Container Apps avec le plan Dedicated" } }
    - { id: d, text: { en: "Web App for Containers in a Premium v3 App Service plan", fr: "Web App for Containers dans un plan App Service Premium v3" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      CRDs, operators and kubectl require the Kubernetes API, which only AKS exposes among these services. AKS Automatic keeps that API while Azure manages the node pools, provisions and scales nodes according to the workloads and upgrades the cluster automatically.
    fr: |
      Les CRD, les opérateurs et kubectl exigent l'API Kubernetes, que seul AKS expose parmi ces services. AKS Automatic conserve cette API pendant qu'Azure gère les pools de nœuds, provisionne et met à l'échelle les nœuds selon les charges de travail et met à niveau le cluster automatiquement.
  options:
    b:
      en: AKS Standard also exposes the Kubernetes API, but you create, scale and upgrade the node pools yourself, which doesn't minimize the effort.
      fr: AKS Standard expose aussi l'API Kubernetes, mais vous créez, mettez à l'échelle et mettez à niveau les pools de nœuds vous-même, ce qui ne réduit pas l'effort.
    c:
      en: Container Apps gives no direct access to the Kubernetes API, whatever the plan, so CRDs and operators can't be installed.
      fr: "Container Apps ne donne aucun accès direct à l'API Kubernetes, quel que soit le plan : les CRD et les opérateurs ne peuvent pas y être installés."
    d:
      en: Web App for Containers hosts containerized web apps on App Service; it isn't a Kubernetes platform.
      fr: Web App for Containers héberge des applications web en conteneurs sur App Service ; ce n'est pas une plateforme Kubernetes.
references:
  - title: What is Azure Kubernetes Service (AKS) Automatic?
    url: https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
  - title: Comparing Container Apps with other Azure container options
    url: https://learn.microsoft.com/en-us/azure/container-apps/compare-options
