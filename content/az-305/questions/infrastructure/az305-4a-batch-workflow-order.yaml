id: az305-4a-batch-workflow-order
objective: "4.1.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to run a parallel image-analysis workload in Azure Batch. A Batch account exists. The application and the input files are already stored in the Azure Storage account that is linked to the Batch account.

    You need to recommend the sequence of actions that runs the workload.

    Which three actions should be performed in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso prévoit d'exécuter une charge parallèle d'analyse d'images dans Azure Batch. Un compte Batch existe. L'application et les fichiers d'entrée sont déjà stockés dans le compte Stockage Azure lié au compte Batch.

    Vous devez recommander la séquence d'actions qui exécute la charge de travail.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: head, text: { en: "Deploy a head node virtual machine and install a job scheduler on it.", fr: "Déployer une machine virtuelle de nœud principal et y installer un planificateur de travaux." } }
    - { id: tasks, text: { en: "Add the tasks to the job.", fr: "Ajouter les tâches au travail." } }
    - { id: pool, text: { en: "Create a pool of compute nodes.", fr: "Créer un pool de nœuds de calcul." } }
    - { id: queue, text: { en: "Create an Azure Service Bus queue that holds one message per task.", fr: "Créer une file d'attente Azure Service Bus qui contient un message par tâche." } }
    - { id: job, text: { en: "Create a job that is assigned to the pool.", fr: "Créer un travail affecté au pool." } }
    - { id: vmss, text: { en: "Create a Virtual Machine Scale Set for the compute nodes.", fr: "Créer un groupe de machines virtuelles identiques pour les nœuds de calcul." } }
answer:
  sequence: [ pool, job, tasks ]
explanation:
  correct:
    en: |
      In the Batch workflow, you create a pool of compute nodes, then a job that runs on the pool, then the tasks of the job; Batch downloads the application and the input files to the nodes and schedules the tasks. A job refers to its pool, and a task belongs to a job, which fixes the order.
    fr: |
      Dans le workflow Batch, vous créez un pool de nœuds de calcul, puis un travail qui s'exécute sur le pool, puis les tâches du travail ; Batch télécharge l'application et les fichiers d'entrée sur les nœuds et planifie les tâches. Un travail fait référence à son pool, et une tâche appartient à un travail, ce qui fixe l'ordre.
  options:
    head:
      en: Batch is the scheduler; there is no head node or scheduler software to install.
      fr: Batch est le planificateur ; il n'y a ni nœud principal ni logiciel de planification à installer.
    queue:
      en: Batch keeps its own queue of tasks inside the job; no messaging service is needed.
      fr: Batch tient sa propre file d'attente de tâches dans le travail ; aucun service de messagerie n'est nécessaire.
    vmss:
      en: Batch creates and manages the virtual machines of the pool itself.
      fr: Batch crée et gère lui-même les machines virtuelles du pool.
references:
  - title: What is Azure Batch?
    url: https://learn.microsoft.com/en-us/azure/batch/batch-technical-overview
