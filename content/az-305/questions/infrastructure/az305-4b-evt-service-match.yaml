id: az305-4b-evt-service-match
objective: "4.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is designing several integration flows between its applications.

    You need to recommend a service for each flow. To answer, drag the appropriate services to the correct flows. Each service may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank conçoit plusieurs flux d'intégration entre ses applications.

    Vous devez recommander un service pour chaque flux. Pour répondre, faites glisser les services appropriés vers les flux correspondants. Chaque service peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: eg, text: Azure Event Grid }
    - { id: eh, text: Azure Event Hubs }
    - { id: sb, text: Azure Service Bus }
    - { id: qs, text: { en: "Azure Queue Storage", fr: "Stockage File d'attente Azure" } }
    - { id: nh, text: Azure Notification Hubs }
  targets:
    - id: t1
      text: { en: "Start a Logic Apps workflow each time a resource is deleted in a subscription", fr: "Démarrer un workflow Logic Apps chaque fois qu'une ressource est supprimée dans un abonnement" }
    - id: t2
      text: { en: "Ingest 200,000 sensor readings per second for analysis by Azure Stream Analytics", fr: "Ingérer 200 000 relevés de capteurs par seconde pour une analyse par Azure Stream Analytics" }
    - id: t3
      text: { en: "Let devices and back-end services publish and subscribe to MQTT topics", fr: "Permettre à des appareils et à des services back-end de publier dans des rubriques MQTT et de s'y abonner" }
    - id: t4
      text: { en: "Process payment orders within transactions, with duplicate detection", fr: "Traiter des ordres de paiement dans des transactions, avec détection des doublons" }
answer:
  mapping: { t1: eg, t2: eh, t3: eg, t4: sb }
explanation:
  correct:
    en: "Event Grid routes discrete events, such as a change in an Azure resource, to handlers like a Logic Apps workflow, and its namespaces include an MQTT broker for devices. Event Hubs is the ingestion service for streams of millions of events per second that analytics engines read. Service Bus is the transactional message broker that offers transactions and duplicate detection."
    fr: "Event Grid route des événements discrets, comme un changement dans une ressource Azure, vers des gestionnaires tels qu'un workflow Logic Apps, et ses espaces de noms comprennent un répartiteur MQTT pour les appareils. Event Hubs est le service d'ingestion des flux de millions d'événements par seconde que lisent les moteurs d'analyse. Service Bus est le répartiteur de messages transactionnel qui offre les transactions et la détection des doublons."
  options:
    qs: { en: "Storage queues hold simple messages; they offer no transactions, no duplicate detection, no MQTT and no event routing.", fr: "Les files d'attente de stockage contiennent des messages simples ; elles n'offrent ni transactions, ni détection des doublons, ni MQTT, ni routage d'événements." }
    nh: { en: "Notification Hubs sends push notifications to mobile devices; it is not an integration service between applications.", fr: "Notification Hubs envoie des notifications Push à des appareils mobiles ; ce n'est pas un service d'intégration entre applications." }
references:
  - title: Choose between Azure Event Grid, Event Hubs, and Service Bus
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/compare-messaging-services
  - title: What is Azure Event Grid?
    url: https://learn.microsoft.com/en-us/azure/event-grid/overview
