id: az305-4b-cache-active-geo
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys deploys a game back end in the West Europe and East US regions. Both regions serve players at the same time.

    You need to recommend a caching solution for the leaderboards. The solution must meet the following requirements:

    - The back end of each region must read and write the cache in its own region.
    - A write in one region must be replicated automatically to the other region, and conflicting writes must be resolved without application code.
    - If one region fails, the other region must keep working with its local cache.

    What should you recommend?
  fr: |
    Tailspin Toys déploie le back-end d'un jeu dans les régions West Europe et East US. Les deux régions servent des joueurs en même temps.

    Vous devez recommander une solution de mise en cache pour les classements. La solution doit répondre aux exigences suivantes :

    - Le back-end de chaque région doit lire et écrire dans le cache de sa propre région.
    - Une écriture dans une région doit être répliquée automatiquement vers l'autre région, et les écritures en conflit doivent être résolues sans code applicatif.
    - Si une région tombe en panne, l'autre région doit continuer à fonctionner avec son cache local.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "One Azure Managed Redis Balanced instance with high availability enabled", fr: "Une instance Azure Managed Redis Balanced avec la haute disponibilité activée" } }
    - { id: b, text: { en: "Two Azure Managed Redis Balanced instances with data persistence enabled", fr: "Deux instances Azure Managed Redis Balanced avec la persistance des données activée" } }
    - { id: c, text: { en: "Two Azure Managed Redis Balanced instances in an active geo-replication group", fr: "Deux instances Azure Managed Redis Balanced dans un groupe de géoréplication active" } }
    - { id: d, text: { en: "Two Azure Managed Redis Flash Optimized instances in an active geo-replication group", fr: "Deux instances Azure Managed Redis Flash Optimized dans un groupe de géoréplication active" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Active geo-replication groups up to five Azure Managed Redis instances of different regions into one cache: every instance accepts reads and writes, the writes are replicated in both directions and conflicts are handled by conflict-free replicated data types. Each region keeps a local, writable instance if the other one is lost."
    fr: "La géoréplication active regroupe jusqu'à cinq instances Azure Managed Redis de régions différentes en un seul cache : chaque instance accepte les lectures et les écritures, les écritures sont répliquées dans les deux sens et les conflits sont traités par des types de données répliqués sans conflit (CRDT). Chaque région conserve une instance locale accessible en écriture si l'autre est perdue."
  options:
    a:
      en: "High availability spreads the nodes of one instance inside a region; the East US back end would use a remote cache that disappears with West Europe."
      fr: "La haute disponibilité répartit les nœuds d'une instance au sein d'une région ; le back-end d'East US utiliserait un cache distant qui disparaît avec West Europe."
    b:
      en: "Data persistence writes the data of an instance to disk to recover from node failures; it replicates nothing between two instances."
      fr: "La persistance des données écrit les données d'une instance sur disque pour récupérer après des pannes de nœuds ; elle ne réplique rien entre deux instances."
    d:
      en: "The Flash Optimized tier does not support active geo-replication."
      fr: "Le niveau Flash Optimized ne prend pas en charge la géoréplication active."
references:
  - title: Configure active geo-replication for Azure Managed Redis instances
    url: https://learn.microsoft.com/en-us/azure/redis/how-to-active-geo-replication
