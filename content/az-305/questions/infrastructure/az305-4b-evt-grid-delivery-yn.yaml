id: az305-4b-evt-grid-delivery-yn
objective: "4.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys publishes order status events to an Azure Event Grid custom topic. An event subscription delivers the events to a webhook hosted by a partner. The event subscription uses the default retry policy and has no dead-letter destination.

    You are reviewing the design.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys publie des événements d'état de commande dans une rubrique personnalisée Azure Event Grid. Un abonnement aux événements remet les événements à un webhook hébergé par un partenaire. L'abonnement aux événements utilise la stratégie de nouvelle tentative par défaut et n'a pas de destination de lettres mortes.

    Vous passez la conception en revue.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "If the partner webhook is unavailable for 36 hours, Event Grid delivers the events published at the start of the outage when the webhook is back online."
        fr: "Si le webhook du partenaire est indisponible pendant 36 heures, Event Grid remet les événements publiés au début de la panne lorsque le webhook est de nouveau en ligne."
    - id: s2
      text:
        en: "A blob container of a storage account can be set on the event subscription to keep the events that Event Grid fails to deliver."
        fr: "Un conteneur d'objets blob d'un compte de stockage peut être défini sur l'abonnement aux événements pour conserver les événements qu'Event Grid ne parvient pas à remettre."
    - id: s3
      text:
        en: "The partner webhook must be designed to accept events that arrive more than once or out of order."
        fr: "Le webhook du partenaire doit être conçu pour accepter des événements qui arrivent plusieurs fois ou dans le désordre."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "By default Event Grid retries a delivery with exponential backoff for 24 hours (event time to live of 1,440 minutes, 30 attempts at most); after that, the event is dropped when no dead-letter destination exists. Dead-lettering is enabled by specifying a blob container of a storage account on the event subscription. Event Grid delivers each event at least once and does not guarantee the order, so the subscriber must tolerate duplicates and disorder."
    fr: "Par défaut, Event Grid retente une remise avec un backoff exponentiel pendant 24 heures (durée de vie de l'événement de 1 440 minutes, 30 tentatives au plus) ; passé ce délai, l'événement est abandonné s'il n'existe pas de destination de lettres mortes. La mise en lettres mortes s'active en indiquant un conteneur d'objets blob d'un compte de stockage sur l'abonnement aux événements. Event Grid remet chaque événement au moins une fois et ne garantit pas l'ordre : l'abonné doit tolérer les doublons et le désordre."
references:
  - title: Event Grid message delivery and retry
    url: https://learn.microsoft.com/en-us/azure/event-grid/delivery-and-retry
