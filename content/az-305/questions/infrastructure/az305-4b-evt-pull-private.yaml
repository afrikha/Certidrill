id: az305-4b-evt-pull-private
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum develops applications that publish inventory events. Adatum plans to distribute the events by using Azure Event Grid.

    One consumer application runs in an on-premises datacenter that is connected to an Azure virtual network through ExpressRoute private peering.

    You need to recommend an Event Grid configuration for this consumer. The solution must meet the following requirements:

    - The consumer must receive the events through a private endpoint.
    - No endpoint of the datacenter can be exposed to the internet.
    - The consumer must decide when it reads events and how many it reads.

    What should you recommend?
  fr: |
    Adatum développe des applications qui publient des événements d'inventaire. Adatum prévoit de distribuer les événements à l'aide d'Azure Event Grid.

    Une application consommatrice s'exécute dans un centre de données local connecté à un réseau virtuel Azure par un peering privé ExpressRoute.

    Vous devez recommander une configuration Event Grid pour ce consommateur. La solution doit répondre aux exigences suivantes :

    - Le consommateur doit recevoir les événements par un point de terminaison privé.
    - Aucun point de terminaison du centre de données ne peut être exposé à Internet.
    - Le consommateur doit décider du moment où il lit les événements et du nombre d'événements lus.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A custom topic with a webhook event subscription", fr: "Une rubrique personnalisée avec un abonnement aux événements de type webhook" } }
    - { id: b, text: { en: "An event domain with a webhook event subscription", fr: "Un domaine d'événements avec un abonnement aux événements de type webhook" } }
    - { id: c, text: { en: "A namespace topic with a push event subscription", fr: "Une rubrique d'espace de noms avec un abonnement aux événements de type push" } }
    - { id: d, text: { en: "A namespace topic with a queue event subscription", fr: "Une rubrique d'espace de noms avec un abonnement aux événements de type file d'attente" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A queue event subscription on a namespace topic uses pull delivery: the consumer connects to Event Grid and reads events when it wants, with queue-like semantics. Receiving events over a private link is possible only with pull delivery, and nothing has to be exposed in the datacenter because the consumer opens the connection."
    fr: "Un abonnement aux événements de type file d'attente sur une rubrique d'espace de noms utilise la remise par extraction (pull) : le consommateur se connecte à Event Grid et lit les événements quand il le souhaite, avec une sémantique de file d'attente. La réception d'événements par une liaison privée n'est possible qu'avec la remise par extraction, et rien n'a besoin d'être exposé dans le centre de données puisque c'est le consommateur qui ouvre la connexion."
  options:
    a:
      en: "With push delivery to a webhook, Event Grid calls a public HTTPS endpoint at its own pace; the datacenter would have to expose that endpoint."
      fr: "Avec la remise push vers un webhook, Event Grid appelle un point de terminaison HTTPS public à son propre rythme ; le centre de données devrait exposer ce point de terminaison."
    b:
      en: "An event domain groups many topics behind one publishing endpoint, but its subscriptions still use push delivery to a public endpoint."
      fr: "Un domaine d'événements regroupe de nombreuses rubriques derrière un seul point de terminaison de publication, mais ses abonnements utilisent toujours la remise push vers un point de terminaison public."
    c:
      en: "A namespace topic also supports push delivery, but push delivery cannot use a private link and Event Grid controls the delivery rate."
      fr: "Une rubrique d'espace de noms prend aussi en charge la remise push, mais celle-ci ne peut pas utiliser de liaison privée et c'est Event Grid qui contrôle le rythme de remise."
references:
  - title: Pull delivery with HTTP
    url: https://learn.microsoft.com/en-us/azure/event-grid/pull-delivery-overview
