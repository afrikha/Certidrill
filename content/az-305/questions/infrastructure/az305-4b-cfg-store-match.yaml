id: az305-4b-cfg-store-match
objective: "4.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam inventories the configuration data of a web application that is hosted on Azure App Service and has a staging deployment slot.

    You need to recommend where to store each type of data. To answer, drag the appropriate locations to the correct data. Each location may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam inventorie les données de configuration d'une application web hébergée sur Azure App Service et dotée d'un emplacement de déploiement de préproduction.

    Vous devez recommander où stocker chaque type de données. Pour répondre, faites glisser les emplacements de stockage appropriés vers les données correspondantes. Chaque emplacement de stockage peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: appcfg, text: Azure App Configuration }
    - { id: kv, text: Azure Key Vault }
    - { id: slot, text: { en: "A deployment slot setting of the web application", fr: "Un paramètre d'emplacement de déploiement de l'application web" } }
    - { id: table, text: { en: "Azure Table Storage", fr: "Stockage Table Azure" } }
  targets:
    - id: t1
      text: { en: "The password of the database and the TLS certificate of the API", fr: "Le mot de passe de la base de données et le certificat TLS de l'API" }
    - id: t2
      text: { en: "A feature flag that enables a new checkout page for 10 percent of the users", fr: "Un indicateur de fonctionnalité qui active une nouvelle page de paiement pour 10 % des utilisateurs" }
    - id: t3
      text: { en: "The URL of a test back end that must stay with the staging slot when the slots are swapped", fr: "L'URL d'un service principal de test qui doit rester attachée à l'emplacement de préproduction lors de l'échange des emplacements" }
answer:
  mapping: { t1: kv, t2: appcfg, t3: slot }
explanation:
  correct:
    en: "Key Vault is the place for secrets, keys and certificates. App Configuration manages feature flags, whose filters can target a percentage of users without a deployment. An app setting marked as a deployment slot setting is not swapped: it stays with its slot, which keeps the staging slot connected to its test back end."
    fr: "Key Vault est l'endroit où placer les secrets, les clés et les certificats. App Configuration gère les indicateurs de fonctionnalités, dont les filtres peuvent cibler un pourcentage d'utilisateurs sans déploiement. Un paramètre d'application marqué comme paramètre d'emplacement de déploiement n'est pas échangé : il reste avec son emplacement, ce qui maintient l'emplacement de préproduction connecté à son service principal de test."
  options:
    table: { en: "Table Storage is a NoSQL data store for application data; it offers no secret management, feature flags or slot awareness.", fr: "Le Stockage Table est un magasin de données NoSQL pour les données d'application ; il n'offre ni gestion des secrets, ni indicateurs de fonctionnalités, ni prise en compte des emplacements." }
references:
  - title: Azure App Configuration FAQ
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/faq
  - title: Set up staging environments in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
