id: az305-4d-sec-pe-private-only
objective: "4.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a finance application that runs on virtual machines in a virtual network named VNet-Fin. The application stores ledgers in the Blob service of a storage account named stfinledger. Accountants in the on-premises offices also open the ledgers from their workstations. The offices are connected to VNet-Fin through ExpressRoute private peering.

    You need to recommend a solution to secure access to stfinledger. The solution must meet the following requirements:

    - The virtual machines and the on-premises workstations must reach stfinledger only through private IP addresses.
    - stfinledger must not be reachable from the internet.
    - The network path must only allow access to stfinledger, not to other storage accounts.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une application financière qui s'exécute sur des machines virtuelles dans un réseau virtuel nommé VNet-Fin. L'application stocke des registres comptables dans le service Blob d'un compte de stockage nommé stfinledger. Les comptables des bureaux locaux ouvrent aussi les registres depuis leurs postes de travail. Les bureaux sont connectés à VNet-Fin par le peering privé ExpressRoute.

    Vous devez recommander une solution pour sécuriser l'accès à stfinledger. La solution doit répondre aux exigences suivantes :

    - Les machines virtuelles et les postes de travail locaux doivent atteindre stfinledger uniquement par des adresses IP privées.
    - stfinledger ne doit pas être joignable depuis Internet.
    - Le chemin réseau ne doit permettre l'accès qu'à stfinledger, pas à d'autres comptes de stockage.

    Quelles sont les deux actions que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable a Microsoft.Storage service endpoint on the subnets of VNet-Fin", fr: "Activer un point de terminaison de service Microsoft.Storage sur les sous-réseaux de VNet-Fin" } }
    - { id: b, text: { en: "Disable public network access on stfinledger", fr: "Désactiver l'accès réseau public sur stfinledger" } }
    - { id: c, text: { en: "Configure Microsoft peering on the ExpressRoute circuit", fr: "Configurer le peering Microsoft sur le circuit ExpressRoute" } }
    - { id: d, text: { en: "Create a private endpoint for the blob subresource of stfinledger in VNet-Fin", fr: "Créer un point de terminaison privé pour la sous-ressource blob de stfinledger dans VNet-Fin" } }
    - { id: e, text: { en: "Add the public IP range of the offices to the firewall of stfinledger", fr: "Ajouter la plage d'adresses IP publiques des bureaux au pare-feu de stfinledger" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      A private endpoint gives stfinledger a private IP address in VNet-Fin. It is reachable from the virtual network and from on-premises networks connected through ExpressRoute, and it maps to that single storage account only. A private endpoint doesn't restrict the public endpoint by itself, so public network access must also be disabled on the account.
    fr: |
      Un point de terminaison privé donne à stfinledger une adresse IP privée dans VNet-Fin. Il est joignable depuis le réseau virtuel et depuis les réseaux locaux connectés par ExpressRoute, et il ne correspond qu'à ce seul compte de stockage. Un point de terminaison privé ne restreint pas à lui seul le point de terminaison public : il faut donc aussi désactiver l'accès réseau public sur le compte.
  options:
    a:
      en: |
        With a service endpoint, the storage account keeps its public IP address, the endpoint covers the whole service, and it isn't usable from on-premises networks.
      fr: |
        Avec un point de terminaison de service, le compte de stockage garde son adresse IP publique, le point de terminaison couvre tout le service, et il n'est pas utilisable depuis les réseaux locaux.
    c:
      en: |
        Microsoft peering reaches the public endpoints of Microsoft services, which contradicts the private IP requirement.
      fr: |
        Le peering Microsoft atteint les points de terminaison publics des services Microsoft, ce qui contredit l'exigence d'adresses IP privées.
    e:
      en: |
        An IP rule keeps the account on its public endpoint and lets the offices connect through public IP addresses.
      fr: |
        Une règle IP laisse le compte sur son point de terminaison public et fait se connecter les bureaux par des adresses IP publiques.
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
