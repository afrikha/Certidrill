id: az305-4b-caf-landing-zone
objective: "4.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum prepares its Azure environment according to the Ready phase of the Microsoft Cloud Adoption Framework for Azure. Twenty workload teams will receive Azure subscriptions during the migration.

    You need to describe the target organization to the project sponsors.

    How should you complete the description? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prépare son environnement Azure selon la phase Ready du Microsoft Cloud Adoption Framework pour Azure. Vingt équipes de charge de travail recevront des abonnements Azure pendant la migration.

    Vous devez décrire l'organisation cible aux commanditaires du projet.

    Comment devez-vous compléter la description ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The management group hierarchy, its policies and the centralized connectivity, identity and management services belong to [[platform]].

      Each workload team deploys and operates its resources in [[workload]].

      To request, create and hand over subscriptions to the teams in a repeatable way, Adatum implements [[vending]].
    fr: |
      La hiérarchie de groupes d'administration, ses stratégies et les services centralisés de connectivité, d'identité et de gestion relèvent de [[platform]].

      Chaque équipe de charge de travail déploie et exploite ses ressources dans [[workload]].

      Pour demander, créer et remettre des abonnements aux équipes de façon reproductible, Adatum met en place [[vending]].
  slots:
    - id: platform
      options:
        - { id: wlz, text: { en: "a workload landing zone", fr: "une zone d'atterrissage de charge de travail" } }
        - { id: plz, text: { en: "the platform landing zone", fr: "la zone d'atterrissage de plateforme" } }
        - { id: sandbox, text: { en: "a sandbox subscription", fr: "un abonnement de bac à sable" } }
    - id: workload
      options:
        - { id: plz, text: { en: "the platform landing zone", fr: "la zone d'atterrissage de plateforme" } }
        - { id: rg, text: { en: "a resource group of the platform landing zone", fr: "un groupe de ressources de la zone d'atterrissage de plateforme" } }
        - { id: wlz, text: { en: "a workload landing zone", fr: "une zone d'atterrissage de charge de travail" } }
    - id: vending
      options:
        - { id: vending, text: { en: "subscription vending", fr: "la distribution d'abonnements (subscription vending)" } }
        - { id: lighthouse, text: Azure Lighthouse }
        - { id: mover, text: Azure Resource Mover }
answer:
  values: { platform: plz, workload: wlz, vending: vending }
explanation:
  correct:
    en: "An Azure landing zone has two components. The platform landing zone is the centralized foundation: a management group hierarchy and shared resources for governance, security, connectivity and identity. Workload landing zones are the environments where workload teams deploy and operate their resources within the guardrails of the platform. Subscription vending is the repeatable, automated process for requesting, creating and distributing workload landing zones."
    fr: "Une zone d'atterrissage Azure comporte deux composants. La zone d'atterrissage de plateforme est le socle centralisé : une hiérarchie de groupes d'administration et des ressources partagées pour la gouvernance, la sécurité, la connectivité et l'identité. Les zones d'atterrissage de charge de travail sont les environnements où les équipes déploient et exploitent leurs ressources dans le cadre des garde-fous de la plateforme. La distribution d'abonnements (subscription vending) est le processus reproductible et automatisé de demande, de création et de distribution des zones d'atterrissage de charge de travail."
  options:
    lighthouse: { en: "Azure Lighthouse delegates the management of resources to another tenant, typically a service provider; it does not create subscriptions.", fr: "Azure Lighthouse délègue la gestion de ressources à un autre locataire, en général un fournisseur de services ; il ne crée pas d'abonnements." }
    mover: { en: "Azure Resource Mover moves resources between regions; it does not provision subscriptions.", fr: "Azure Resource Mover déplace des ressources entre régions ; il ne provisionne pas d'abonnements." }
references:
  - title: What is an Azure landing zone?
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/
