id: az305-4b-cfg-snapshot-release
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum releases each version of an application together with a set of 40 key-values that are stored in an Azure App Configuration store in the Standard tier.

    You need to recommend a feature of App Configuration that meets the following requirements:

    - Once a release is approved, the values of its set must be guaranteed to stay unchanged.
    - The application must load the whole set by referring to a single name.
    - If a release fails, the application must return to the set of the last known good release.

    What should you recommend?
  fr: |
    Adatum publie chaque version d'une application avec un jeu de 40 paires clé-valeur stockées dans un magasin Azure App Configuration de niveau Standard.

    Vous devez recommander une fonctionnalité d'App Configuration qui répond aux exigences suivantes :

    - Une fois une version approuvée, les valeurs de son jeu doivent être garanties inchangées.
    - L'application doit charger le jeu complet en se référant à un seul nom.
    - Si une mise en production échoue, l'application doit revenir au jeu de la dernière version correcte connue.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A label for each release", fr: "Une étiquette pour chaque version" } }
    - { id: b, text: { en: "A feature flag for each release", fr: "Un indicateur de fonctionnalité pour chaque version" } }
    - { id: c, text: { en: "The point-in-time view of the revision history", fr: "La vue à un instant donné de l'historique des révisions" } }
    - { id: d, text: { en: "A snapshot for each release", fr: "Un instantané pour chaque version" } }
answer: { optionId: d }
explanation:
  correct:
    en: "A snapshot is a named, immutable subset of the key-values of a store: once created, its content cannot change. The application only references the name of the snapshot, and pointing it back to the previous snapshot restores the last known good configuration."
    fr: "Un instantané est un sous-ensemble nommé et immuable des paires clé-valeur d'un magasin : une fois créé, son contenu ne peut plus changer. L'application référence seulement le nom de l'instantané, et la faire pointer à nouveau vers l'instantané précédent rétablit la dernière configuration correcte connue."
  options:
    a:
      en: "A label groups the values of a release under one name, but these key-values remain editable after the approval."
      fr: "Une étiquette regroupe les valeurs d'une version sous un nom, mais ces paires clé-valeur restent modifiables après l'approbation."
    b:
      en: "A feature flag turns a feature on or off; it does not freeze a set of settings."
      fr: "Un indicateur de fonctionnalité active ou désactive une fonctionnalité ; il ne fige pas un jeu de paramètres."
    c:
      en: "The revision history shows past values for a limited period (30 days in Standard); it is not a named set that the application loads."
      fr: "L'historique des révisions montre les valeurs passées pendant une durée limitée (30 jours en Standard) ; ce n'est pas un jeu nommé que l'application charge."
references:
  - title: Snapshots
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-snapshots
