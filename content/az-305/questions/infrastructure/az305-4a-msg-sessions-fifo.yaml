id: az305-4a-msg-sessions-fifo
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The ordering system of Contoso sends several messages for each customer order: created, paid and shipped. Several worker instances receive the messages in parallel. Each message is smaller than 100 KB.

    You need to recommend a messaging solution. The solution must meet the following requirements:

    - The messages of the same order are processed in the order in which they were sent, by one worker at a time.
    - Minimize cost.

    What should you recommend?
  fr: |
    Le système de commandes de Contoso envoie plusieurs messages pour chaque commande client : créée, payée et expédiée. Plusieurs instances de worker reçoivent les messages en parallèle. Chaque message fait moins de 100 Ko.

    Vous devez recommander une solution de messagerie. La solution doit répondre aux exigences suivantes :

    - Les messages d'une même commande sont traités dans l'ordre de leur envoi, par un seul worker à la fois.
    - Réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Service Bus queue with sessions, in the Premium tier", fr: "Une file d'attente Service Bus avec des sessions, au niveau Premium" } }
    - { id: b, text: { en: "A Service Bus queue with sessions, in the Standard tier", fr: "Une file d'attente Service Bus avec des sessions, au niveau Standard" } }
    - { id: c, text: { en: "A Service Bus queue, in the Basic tier", fr: "Une file d'attente Service Bus, au niveau Basic" } }
    - { id: d, text: { en: "A queue in Azure Queue Storage", fr: "Une file d'attente dans Stockage File d'attente Azure" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Service Bus sessions group the messages that share a session ID, here the order number: one receiver locks the session and gets its messages in order, while other workers process other sessions. Sessions are available from the Standard tier, which also accepts messages of up to 256 KB.
    fr: |
      Les sessions Service Bus regroupent les messages qui partagent un ID de session, ici le numéro de commande : un seul récepteur verrouille la session et reçoit ses messages dans l'ordre, pendant que d'autres workers traitent d'autres sessions. Les sessions sont disponibles à partir du niveau Standard, qui accepte aussi des messages jusqu'à 256 Ko.
  options:
    a:
      en: The Premium tier supports sessions too, but its dedicated capacity costs more and nothing in the requirements needs it.
      fr: Le niveau Premium prend aussi en charge les sessions, mais sa capacité dédiée coûte plus cher et aucune exigence ne la rend nécessaire.
    c:
      en: The Basic tier offers queues without sessions, so ordered processing per order isn't guaranteed with several workers.
      fr: Le niveau Basic propose des files d'attente sans sessions ; le traitement ordonné par commande n'est donc pas garanti avec plusieurs workers.
    d:
      en: Queue Storage gives no ordering guarantee and has no session concept.
      fr: Le Stockage File d'attente ne donne aucune garantie d'ordre et n'a pas de notion de session.
references:
  - title: Message sessions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-sessions
  - title: Storage queues and Service Bus queues - compared and contrasted
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-azure-and-service-bus-queues-compared-contrasted
