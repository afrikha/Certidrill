id: az305-4b-dep-whatif-review
objective: "4.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso deploys its Azure infrastructure from Bicep files by using a pipeline.

    Before each deployment to production, the operations team wants to review the resources that the deployment would create or modify. The review must not change anything in Azure.

    What should you include in the pipeline?
  fr: |
    Contoso déploie son infrastructure Azure à partir de fichiers Bicep à l'aide d'un pipeline.

    Avant chaque déploiement en production, l'équipe d'exploitation veut passer en revue les ressources que le déploiement créerait ou modifierait. Cette revue ne doit rien changer dans Azure.

    Que devez-vous inclure dans le pipeline ?
body:
  options:
    - { id: a, text: { en: "A what-if operation", fr: "Une opération what-if" } }
    - { id: b, text: { en: "A deployment stack", fr: "Une pile de déploiement" } }
    - { id: c, text: { en: "A template spec", fr: "Une spec de modèle" } }
    - { id: d, text: { en: "An Azure Policy assignment with the audit effect", fr: "Une attribution Azure Policy avec l'effet audit" } }
answer: { optionId: a }
explanation:
  correct:
    en: "The what-if operation of Azure Resource Manager compares a Bicep file with the current state and lists the resources that would be created, modified or left unchanged, with the properties that would change. It makes no change to the existing resources."
    fr: "L'opération what-if d'Azure Resource Manager compare un fichier Bicep à l'état actuel et liste les ressources qui seraient créées, modifiées ou laissées inchangées, avec les propriétés qui changeraient. Elle n'apporte aucune modification aux ressources existantes."
  options:
    b:
      en: "A deployment stack manages the deployed resources as one unit; creating or updating it does deploy the resources."
      fr: "Une pile de déploiement gère les ressources déployées comme une seule unité ; sa création ou sa mise à jour déploie bel et bien les ressources."
    c:
      en: "A template spec stores a template to share it; it does not preview the effect of a deployment."
      fr: "Une spec de modèle stocke un modèle pour le partager ; elle ne donne pas d'aperçu de l'effet d'un déploiement."
    d:
      en: "The audit effect reports existing resources that do not comply with a rule; it does not show what a deployment will change."
      fr: "L'effet audit signale les ressources existantes non conformes à une règle ; il ne montre pas ce qu'un déploiement va changer."
references:
  - title: "Bicep What-If: Preview Changes Before Deployment"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if
