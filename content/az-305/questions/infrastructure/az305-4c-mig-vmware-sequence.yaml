id: az305-4c-mig-vmware-sequence
objective: "4.3.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders plans to rehost VMware virtual machines as Azure virtual machines by using the agentless method of Azure Migrate. An Azure Migrate project already exists, and the target virtual networks are deployed.

    You need to plan the migration of the first wave. The migrated machines must be validated before the production cutover.

    Which four actions should you plan in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders prévoit de réhéberger des machines virtuelles VMware sous forme de machines virtuelles Azure à l'aide de la méthode sans agent d'Azure Migrate. Un projet Azure Migrate existe déjà, et les réseaux virtuels cibles sont déployés.

    Vous devez planifier la migration de la première vague. Les machines migrées doivent être validées avant la bascule de production.

    Quelles sont les quatre actions à planifier dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: disc, text: { en: "Deploy the Azure Migrate appliance and discover the virtual machines.", fr: "Déployer l'appliance Azure Migrate et découvrir les machines virtuelles." } }
    - { id: repl, text: { en: "Start the replication of the virtual machines.", fr: "Démarrer la réplication des machines virtuelles." } }
    - { id: test, text: { en: "Run a test migration to an isolated virtual network.", fr: "Exécuter une migration de test vers un réseau virtuel isolé." } }
    - { id: mig, text: { en: "Migrate the virtual machines to the production virtual network.", fr: "Migrer les machines virtuelles vers le réseau virtuel de production." } }
    - { id: agent, text: { en: "Install the Mobility service agent in each virtual machine.", fr: "Installer l'agent du service Mobilité dans chaque machine virtuelle." } }
    - { id: avs, text: { en: "Deploy an Azure VMware Solution private cloud.", fr: "Déployer un cloud privé Azure VMware Solution." } }
answer:
  sequence: [ disc, repl, test, mig ]
explanation:
  correct:
    en: |
      The appliance must first discover the virtual machines through vCenter Server, because only discovered machines can be replicated. Replication then copies the disks to Azure while the machines keep running. A test migration validates each machine in an isolated network without affecting the source, and the final migration cuts over to production.
    fr: |
      L'appliance doit d'abord découvrir les machines virtuelles par l'intermédiaire de vCenter Server, car seules les machines découvertes peuvent être répliquées. La réplication copie ensuite les disques vers Azure pendant que les machines continuent de fonctionner. Une migration de test valide chaque machine dans un réseau isolé sans affecter la source, puis la migration finale bascule vers la production.
  options:
    agent:
      en: The Mobility service agent belongs to the agent-based method; the agentless method installs nothing in the virtual machines.
      fr: L'agent du service Mobilité relève de la méthode avec agent ; la méthode sans agent n'installe rien dans les machines virtuelles.
    avs:
      en: An Azure VMware Solution private cloud is another target; here the machines become Azure virtual machines.
      fr: Un cloud privé Azure VMware Solution est une autre cible ; ici, les machines deviennent des machines virtuelles Azure.
references:
  - title: Migrate VMware VMs to Azure (agentless)
    url: https://learn.microsoft.com/en-us/azure/migrate/tutorial-migrate-vmware
