id: az305-4c-db-oracle-ssma
objective: "4.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders runs an inventory application on an on-premises Oracle Database server. The company plans to move the database to Azure SQL Database.

    You need to recommend a tool that converts the Oracle schemas, including tables and PL/SQL packages, to their Azure SQL equivalent and then migrates the data.

    What should you recommend?
  fr: |
    Northwind Traders exécute une application de gestion des stocks sur un serveur Oracle Database local. L'entreprise prévoit de déplacer la base de données vers Azure SQL Database.

    Vous devez recommander un outil qui convertit les schémas Oracle, y compris les tables et les packages PL/SQL, en leur équivalent Azure SQL, puis migre les données.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The migration tool of Azure Migrate", fr: "L'outil de migration d'Azure Migrate" } }
    - { id: b, text: { en: "A BACPAC file imported into Azure SQL Database", fr: "Un fichier BACPAC importé dans Azure SQL Database" } }
    - { id: c, text: { en: "SQL Server Migration Assistant (SSMA) for Oracle", fr: "SQL Server Migration Assistant (SSMA) pour Oracle" } }
    - { id: d, text: { en: "The copy activity of Azure Data Factory", fr: "L'activité de copie d'Azure Data Factory" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      SSMA for Oracle assesses an Oracle database, converts its schema objects and PL/SQL code to Transact-SQL, loads the converted schema into the target and then migrates the data. Azure SQL Database is one of its supported targets, which makes SSMA the tool for a heterogeneous migration to Azure SQL.
    fr: |
      SSMA pour Oracle évalue une base de données Oracle, convertit ses objets de schéma et son code PL/SQL en Transact-SQL, charge le schéma converti dans la cible, puis migre les données. Azure SQL Database fait partie de ses cibles prises en charge, ce qui fait de SSMA l'outil d'une migration hétérogène vers Azure SQL.
  options:
    a:
      en: The migration tool of Azure Migrate replicates servers to Azure virtual machines; it doesn't convert a database engine.
      fr: L'outil de migration d'Azure Migrate réplique des serveurs vers des machines virtuelles Azure ; il ne convertit pas un moteur de base de données.
    b:
      en: A BACPAC file is exported from a SQL Server or Azure SQL database; Oracle can't produce one.
      fr: Un fichier BACPAC est exporté d'une base de données SQL Server ou Azure SQL ; Oracle ne peut pas en produire.
    d:
      en: The copy activity moves rows between data stores but doesn't convert PL/SQL packages or other schema objects.
      fr: L'activité de copie déplace des lignes entre magasins de données, mais ne convertit ni les packages PL/SQL ni les autres objets de schéma.
references:
  - title: SQL Server Migration Assistant for Oracle (OracleToSQL)
    url: https://learn.microsoft.com/en-us/sql/ssma/oracle/sql-server-migration-assistant-for-oracle-oracletosql
