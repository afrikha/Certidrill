id: az305-cs2b-carrier-workflows
objective: "4.1.4"
type: single
caseStudy: az305-cs2b-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a service to host the carrier workflows. The solution must meet the requirements of the carrier workflows.

    What should you recommend?
  fr: |
    Vous devez recommander un service pour héberger les workflows des transporteurs. La solution doit respecter les exigences relatives aux workflows des transporteurs.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: "Azure Logic Apps (Standard)" }
    - { id: b, text: "Azure Logic Apps (Consumption)" }
    - { id: c, text: { en: "Durable Functions in a Flex Consumption plan", fr: "Durable Functions dans un plan Flex Consumption" } }
    - { id: d, text: { en: "Power Automate cloud flows", fr: "Des flux de cloud Power Automate" } }
answer: { optionId: a }
explanation:
  correct:
    en: Azure Logic Apps builds workflows in a visual designer with prebuilt connectors. A Standard logic app runs in single-tenant Azure Logic Apps, where one resource can hold many workflows and where virtual network integration and private endpoints are supported, so the workflows can reach the private endpoint of the Azure Cosmos DB account.
    fr: Azure Logic Apps construit des workflows dans un concepteur visuel avec des connecteurs prédéfinis. Une application logique Standard s'exécute dans Azure Logic Apps monolocataire, où une seule ressource peut contenir de nombreux workflows et où l'intégration au réseau virtuel et les points de terminaison privés sont pris en charge ; les workflows peuvent donc atteindre le point de terminaison privé du compte Azure Cosmos DB.
  options:
    b: { en: "A Consumption logic app holds only one workflow and runs in the multitenant service, without the virtual network integration of the Standard type.", fr: "Une application logique Consumption ne contient qu'un seul workflow et s'exécute dans le service multilocataire, sans l'intégration au réseau virtuel du type Standard." }
    c: { en: "Durable Functions orchestrates workflows in code; it offers neither a visual designer nor prebuilt connectors.", fr: "Durable Functions orchestre des workflows dans du code ; il n'offre ni concepteur visuel ni connecteurs prédéfinis." }
    d: { en: "Power Automate is meant for business users who automate their own tasks; its flows are not deployed and managed as an Azure resource.", fr: "Power Automate est destiné aux utilisateurs métier qui automatisent leurs propres tâches ; ses flux ne sont pas déployés ni gérés comme une ressource Azure." }
references:
  - title: Differences between Standard single-tenant logic apps versus Consumption multitenant logic apps
    url: https://learn.microsoft.com/en-us/azure/logic-apps/single-tenant-overview-compare
