id: az305-4b-dep-vmss-rolling
objective: "4.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys hosts an API on a Virtual Machine Scale Set of 30 instances. A new image version is published every month in Azure Compute Gallery.

    You need to recommend how the instances receive the new image. The solution must meet the following requirements:

    - The instances must be upgraded in batches, so that a defined share of them stays available.
    - The upgrade must take the health of the application into account.
    - No manual action must be needed on each instance.

    Which upgrade policy mode should you recommend?
  fr: |
    Tailspin Toys héberge une API sur un groupe de machines virtuelles identiques de 30 instances. Une nouvelle version d'image est publiée chaque mois dans Azure Compute Gallery.

    Vous devez recommander la façon dont les instances reçoivent la nouvelle image. La solution doit répondre aux exigences suivantes :

    - Les instances doivent être mises à niveau par lots, afin qu'une part définie d'entre elles reste disponible.
    - La mise à niveau doit tenir compte de l'intégrité de l'application.
    - Aucune action manuelle ne doit être nécessaire sur chaque instance.

    Quel mode de stratégie de mise à niveau devez-vous recommander ?
body:
  options:
    - { id: a, text: Automatic }
    - { id: b, text: Manual }
    - { id: c, text: Rolling }
answer: { optionId: c }
explanation:
  correct:
    en: "In Rolling mode, the scale set upgrades its instances in batches, with settings such as the batch size, and it relies on the Application Health extension or a health probe to monitor the application. It is the mode suited to production workloads that need a number of instances always available."
    fr: "En mode Rolling, le groupe identique met à niveau ses instances par lots, avec des paramètres comme la taille des lots, et il s'appuie sur l'extension Application Health ou sur une sonde d'intégrité pour surveiller l'application. C'est le mode adapté aux charges de travail de production qui ont besoin d'un nombre d'instances toujours disponibles."
  options:
    a:
      en: "In Automatic mode, the scale set gives no guarantee about the order of the upgrades and may take all the instances down at the same time."
      fr: "En mode Automatic, le groupe identique ne donne aucune garantie sur l'ordre des mises à niveau et peut arrêter toutes les instances en même temps."
    b:
      en: "In Manual mode, nothing happens to the existing instances until an administrator upgrades each of them."
      fr: "En mode Manual, rien ne se passe sur les instances existantes tant qu'un administrateur ne met pas chacune d'elles à niveau."
references:
  - title: Upgrade policy modes for Virtual Machine Scale Sets
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-upgrade-policy
