id: az305-4c-data-filesync
objective: "4.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has a Windows file server in each of its six branch offices. Each server stores about 4 TB of files and is running out of disk space.

    You need to recommend a solution that meets the following requirements:

    - All the files must be centralized in Azure file shares.
    - Branch users must keep accessing the files over SMB through their local server, with fast access to recently used files.
    - Rarely used files must stop consuming local disk space.

    What should you recommend?
  fr: |
    Litware possède un serveur de fichiers Windows dans chacune de ses six succursales. Chaque serveur stocke environ 4 To de fichiers et manque d'espace disque.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Tous les fichiers doivent être centralisés dans des partages de fichiers Azure.
    - Les utilisateurs des succursales doivent continuer d'accéder aux fichiers en SMB par leur serveur local, avec un accès rapide aux fichiers récemment utilisés.
    - Les fichiers rarement utilisés doivent cesser d'occuper de l'espace disque local.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Storage Mover", fr: "Azure Storage Mover" } }
    - { id: b, text: { en: "A scheduled AzCopy synchronization", fr: "Une synchronisation AzCopy planifiée" } }
    - { id: c, text: { en: "Azure Data Box Disk", fr: "Azure Data Box Disk" } }
    - { id: d, text: { en: "Azure File Sync with cloud tiering", fr: "Azure File Sync avec la hiérarchisation cloud" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure File Sync synchronizes a Windows file server with an Azure file share and turns the server into a cache of that share. With cloud tiering, only the frequently used files stay on the local disk; the others are replaced by pointers and recalled from Azure on demand. Users keep their SMB path to the local server.
    fr: |
      Azure File Sync synchronise un serveur de fichiers Windows avec un partage de fichiers Azure et transforme le serveur en cache de ce partage. Avec la hiérarchisation cloud, seuls les fichiers souvent utilisés restent sur le disque local ; les autres sont remplacés par des pointeurs et rappelés d'Azure à la demande. Les utilisateurs conservent leur chemin SMB vers le serveur local.
  options:
    a:
      en: Azure Storage Mover copies the files to Azure for a cloud-only target; it leaves no synchronized local cache.
      fr: Azure Storage Mover copie les fichiers vers Azure pour une cible uniquement cloud ; il ne laisse aucun cache local synchronisé.
    b:
      en: A scheduled AzCopy job uploads copies but frees no local space and doesn't bring changes back to the servers.
      fr: Un travail AzCopy planifié charge des copies, mais ne libère aucun espace local et ne ramène pas les modifications sur les serveurs.
    c:
      en: Data Box Disk is a one-time offline import; it provides no ongoing synchronization or local cache.
      fr: Data Box Disk est une importation hors connexion ponctuelle ; il ne fournit ni synchronisation continue ni cache local.
references:
  - title: What is Azure File Sync?
    url: https://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-introduction
