id: az305-4a-vm-spot-statements
objective: "4.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to run a stateless test farm on Azure Spot Virtual Machines. Each virtual machine will be created with a maximum price of -1 and the Deallocate eviction policy.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit d'exécuter une ferme de test sans état sur des machines virtuelles Azure Spot. Chaque machine virtuelle sera créée avec un prix maximal de -1 et la stratégie d'éviction Deallocate.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure can evict the virtual machines when it needs the capacity.
        fr: Azure peut évincer les machines virtuelles lorsqu'il a besoin de la capacité.
    - id: s2
      text:
        en: After an eviction, Adatum continues to be charged for the disks of the evicted virtual machines.
        fr: Après une éviction, Adatum continue d'être facturé pour les disques des machines virtuelles évincées.
    - id: s3
      text:
        en: The virtual machines are covered by an availability SLA.
        fr: Les machines virtuelles sont couvertes par un SLA de disponibilité.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      A maximum price of -1 means that the virtual machines are never evicted for price reasons, but Azure still evicts them, with 30 seconds' notice, when it needs the capacity. With the Deallocate policy, an evicted virtual machine is stopped and deallocated: its disks are kept and their storage is still billed. Spot virtual machines offer no availability guarantee and no SLA.
    fr: |
      Un prix maximal de -1 signifie que les machines virtuelles ne sont jamais évincées pour des raisons de prix, mais Azure les évince tout de même, avec un préavis de 30 secondes, lorsqu'il a besoin de la capacité. Avec la stratégie Deallocate, une machine virtuelle évincée est arrêtée et libérée : ses disques sont conservés et leur stockage reste facturé. Les machines virtuelles Spot n'offrent aucune garantie de disponibilité ni aucun SLA.
references:
  - title: Azure Spot Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/spot-vms
