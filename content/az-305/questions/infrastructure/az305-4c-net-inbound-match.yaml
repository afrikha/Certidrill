id: az305-4c-net-inbound-match
objective: "4.4.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders hosts several workloads on virtual machines in one Azure region. None of the virtual machines has a public IP address.

    Which service should you recommend for each requirement? To answer, drag the appropriate services to the correct requirements. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders héberge plusieurs charges de travail sur des machines virtuelles dans une région Azure. Aucune des machines virtuelles n'a d'adresse IP publique.

    Quel service devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les services appropriés vers les exigences correspondantes. Chaque service peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: bastion, text: "Azure Bastion" }
    - { id: appgw, text: "Azure Application Gateway" }
    - { id: lb, text: { en: "Standard public load balancer", fr: "Équilibreur de charge public Standard" } }
    - { id: nat, text: "Azure NAT Gateway" }
    - { id: vpn, text: { en: "Azure VPN Gateway", fr: "Passerelle VPN Azure" } }
  targets:
    - id: t1
      text: { en: "Let administrators open RDP and SSH sessions to the virtual machines from the internet, through the Azure portal", fr: "Permettre aux administrateurs d'ouvrir des sessions RDP et SSH vers les machines virtuelles depuis Internet, par le portail Azure" }
    - id: t2
      text: { en: "Publish an HTTPS web application to internet users, with TLS termination and URL path-based routing", fr: "Publier une application web HTTPS pour les utilisateurs d'Internet, avec terminaison TLS et routage basé sur le chemin d'URL" }
    - id: t3
      text: { en: "Publish a UDP-based telemetry service to devices on the internet", fr: "Publier un service de télémétrie UDP pour des appareils sur Internet" }
answer:
  mapping: { t1: bastion, t2: appgw, t3: lb }
explanation:
  correct:
    en: |
      Azure Bastion gives RDP and SSH access over TLS from the Azure portal to virtual machines that have only private addresses. Application Gateway is a regional layer 7 load balancer that terminates TLS and routes requests by URL path. A UDP service needs a layer 4 service: a Standard public load balancer distributes TCP and UDP flows from its public frontend. A NAT gateway only handles outbound connections, and a VPN gateway connects private networks.
    fr: |
      Azure Bastion donne un accès RDP et SSH sur TLS, depuis le portail Azure, à des machines virtuelles qui n'ont que des adresses privées. Application Gateway est un équilibreur de charge régional de couche 7 qui termine TLS et route les requêtes selon le chemin d'URL. Un service UDP a besoin d'un service de couche 4 : un équilibreur de charge public Standard distribue les flux TCP et UDP depuis son front-end public. Une passerelle NAT ne gère que les connexions sortantes, et une passerelle VPN relie des réseaux privés.
references:
  - title: Load balancing options
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/load-balancing-overview
  - title: Choose the right Azure Bastion SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
