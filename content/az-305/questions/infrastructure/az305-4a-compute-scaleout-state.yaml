id: az305-4a-compute-scaleout-state
objective: "4.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs a web application on a single Azure virtual machine. The application requires a licensed component that is installed in the operating system, and it keeps user sessions in the memory of the web server process. Traffic triples during sales campaigns.

    You need to recommend changes to the design. The solution must meet the following requirements:

    - Identical instances are added and removed automatically based on CPU usage.
    - Users must not lose their session when an instance is removed.

    What should you recommend? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders exécute une application web sur une seule machine virtuelle Azure. L'application exige un composant sous licence installé dans le système d'exploitation, et elle conserve les sessions des utilisateurs dans la mémoire du processus du serveur web. Le trafic triple pendant les campagnes de soldes.

    Vous devez recommander des modifications de la conception. La solution doit répondre aux exigences suivantes :

    - Des instances identiques sont ajoutées et supprimées automatiquement selon l'utilisation du processeur.
    - Les utilisateurs ne doivent pas perdre leur session lorsqu'une instance est supprimée.

    Que devez-vous recommander ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Host the web tier on [[host]].
      Store the session data in [[state]].
    fr: |
      Héberger le niveau web sur [[host]].
      Stocker les données de session dans [[state]].
  slots:
    - id: host
      options:
        - { id: bigger, text: { en: "a single virtual machine of a larger size", fr: "une seule machine virtuelle d'une taille supérieure" } }
        - { id: vmss, text: { en: "a Virtual Machine Scale Set", fr: "un groupe de machines virtuelles identiques" } }
        - { id: avset, text: { en: "two virtual machines in an availability set", fr: "deux machines virtuelles dans un groupe à haute disponibilité" } }
    - id: state
      options:
        - { id: memory, text: { en: "the memory of each instance, with session affinity on the load balancer", fr: "la mémoire de chaque instance, avec l'affinité de session sur l'équilibreur de charge" } }
        - { id: tempdisk, text: { en: "the temporary disk of each instance", fr: "le disque temporaire de chaque instance" } }
        - { id: redis, text: { en: "Azure Managed Redis", fr: "Azure Managed Redis" } }
answer:
  values: { host: vmss, state: redis }
explanation:
  correct:
    en: |
      The component installed in the operating system keeps the workload on virtual machines, and a scale set creates identical instances from one image and adds or removes them with autoscale rules. Scaling out only works with stateless instances: the session data must live outside them, in a shared cache such as Azure Managed Redis, so that any instance can serve any user and be removed at any time.
    fr: |
      Le composant installé dans le système d'exploitation maintient la charge de travail sur des machines virtuelles, et un groupe de machines virtuelles identiques crée des instances identiques à partir d'une image, puis les ajoute ou les supprime avec des règles de mise à l'échelle automatique. Le scale-out ne fonctionne qu'avec des instances sans état : les données de session doivent résider hors des instances, dans un cache partagé comme Azure Managed Redis, afin que toute instance puisse servir tout utilisateur et être supprimée à tout moment.
  options:
    bigger:
      en: A larger size is a scale-up; it is not automatic, adds no instance and leaves a single point of failure.
      fr: Une taille supérieure est un scale-up ; il n'est pas automatique, n'ajoute aucune instance et laisse un point de défaillance unique.
    avset:
      en: An availability set spreads a fixed number of machines across fault domains; it doesn't add or remove instances.
      fr: Un groupe à haute disponibilité répartit un nombre fixe de machines entre des domaines d'erreur ; il n'ajoute ni ne supprime d'instances.
    memory:
      en: Session affinity keeps a user on one instance, but the sessions held in memory disappear when that instance is removed.
      fr: L'affinité de session maintient un utilisateur sur une instance, mais les sessions conservées en mémoire disparaissent quand cette instance est supprimée.
    tempdisk:
      en: The temporary disk is local to one instance and is lost with it.
      fr: Le disque temporaire est local à une instance et disparaît avec elle.
references:
  - title: What are Virtual Machine Scale Sets?
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/overview
  - title: Choose an Azure compute service
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/compute-decision-tree
