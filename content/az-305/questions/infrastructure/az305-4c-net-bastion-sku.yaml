id: az305-4c-net-bastion-sku
objective: "4.4.1"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Fabrikam has a hub virtual network that is peered with six spoke virtual networks. The virtual machines in the spokes have no public IP addresses.

    You need to recommend an Azure Bastion deployment in the hub so that administrators can connect to the virtual machines from the internet. The solution must meet the following requirements:

    - One deployment must reach the virtual machines of all the peered spokes.
    - Administrators must be able to connect from the native RDP and SSH clients of their workstations.
    - The cost must be minimized.

    Which Azure Bastion SKU should you recommend?
  fr: |
    Fabrikam dispose d'un réseau virtuel hub relié par peering à six réseaux virtuels spokes. Les machines virtuelles des spokes n'ont pas d'adresse IP publique.

    Vous devez recommander un déploiement d'Azure Bastion dans le hub afin que les administrateurs puissent se connecter aux machines virtuelles depuis Internet. La solution doit répondre aux exigences suivantes :

    - Un seul déploiement doit atteindre les machines virtuelles de tous les spokes reliés par peering.
    - Les administrateurs doivent pouvoir se connecter depuis les clients RDP et SSH natifs de leurs postes de travail.
    - Le coût doit être réduit au minimum.

    Quelle référence SKU d'Azure Bastion devez-vous recommander ?
body:
  options:
    - { id: a, text: "Developer" }
    - { id: b, text: "Basic" }
    - { id: c, text: "Standard" }
    - { id: d, text: "Premium" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Connections from a native client on the workstation are available from the Standard SKU. Standard also reaches virtual machines in peered virtual networks, so it is the lowest SKU that meets both requirements.
    fr: |
      Les connexions depuis un client natif du poste de travail sont disponibles à partir de la référence SKU Standard. Standard atteint aussi les machines virtuelles des réseaux virtuels reliés par peering : c'est la référence SKU la plus basse qui répond aux deux exigences.
  options:
    a:
      en: The Developer SKU is a shared service for dev/test that doesn't reach peered virtual networks or support native clients.
      fr: La référence SKU Developer est un service partagé pour le développement et les tests, qui n'atteint pas les réseaux virtuels reliés par peering et ne prend pas en charge les clients natifs.
    b:
      en: The Basic SKU reaches peered virtual networks but only offers connections from the browser in the Azure portal.
      fr: La référence SKU Basic atteint les réseaux virtuels reliés par peering, mais n'offre que des connexions depuis le navigateur dans le portail Azure.
    d:
      en: The Premium SKU adds session recording and private-only deployment, which aren't required, at a higher price.
      fr: La référence SKU Premium ajoute l'enregistrement des sessions et le déploiement privé uniquement, qui ne sont pas exigés, pour un prix plus élevé.
references:
  - title: Choose the right Azure Bastion SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-sku-comparison
