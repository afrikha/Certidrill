id: az305-4a-sls-logic-apps-connectors
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The IT integration team of Proseware must automate the following process: when a partner drops a file on an SFTP server, a record is created in Salesforce and a message is posted in a Microsoft Teams channel. The process runs a few times a day.

    You need to recommend a solution. The solution must meet the following requirements:

    - Use prebuilt connectors, with little or no code to write.
    - The workflow is an Azure resource that the integration team deploys and governs in its subscription.
    - Costs are based on the number of executions.

    What should you recommend?
  fr: |
    L'équipe d'intégration informatique de Proseware doit automatiser le processus suivant : lorsqu'un partenaire dépose un fichier sur un serveur SFTP, un enregistrement est créé dans Salesforce et un message est publié dans un canal Microsoft Teams. Le processus s'exécute quelques fois par jour.

    Vous devez recommander une solution. La solution doit répondre aux exigences suivantes :

    - Utiliser des connecteurs prédéfinis, avec peu ou pas de code à écrire.
    - Le workflow est une ressource Azure que l'équipe d'intégration déploie et gouverne dans son abonnement.
    - Les coûts dépendent du nombre d'exécutions.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Functions with custom code", fr: "Azure Functions avec du code personnalisé" } }
    - { id: b, text: { en: "A cloud flow in Power Automate", fr: "Un flux de cloud dans Power Automate" } }
    - { id: c, text: { en: "A WebJob in Azure App Service", fr: "Un WebJob dans Azure App Service" } }
    - { id: d, text: { en: "A Consumption workflow in Azure Logic Apps", fr: "Un workflow Consumption dans Azure Logic Apps" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure Logic Apps is the designer-first integration service of Azure, with more than 1,400 prebuilt connectors, including SFTP, Salesforce and Teams. A Consumption logic app is an Azure resource in the subscription and is billed per execution, which fits a workflow that runs a few times a day.
    fr: |
      Azure Logic Apps est le service d'intégration orienté concepteur d'Azure, avec plus de 1 400 connecteurs prédéfinis, dont SFTP, Salesforce et Teams. Une application logique Consumption est une ressource Azure de l'abonnement et est facturée à l'exécution, ce qui convient à un workflow exécuté quelques fois par jour.
  options:
    a:
      en: Functions is code-first and has only about a dozen built-in binding types; the calls to SFTP, Salesforce and Teams would have to be coded.
      fr: Functions est orienté code et ne compte qu'une dizaine de types de liaisons intégrés ; les appels à SFTP, Salesforce et Teams devraient être codés.
    b:
      en: Power Automate has similar connectors but targets business users and runs outside the Azure subscription; it isn't an Azure resource governed by the integration team.
      fr: Power Automate dispose de connecteurs similaires, mais s'adresse aux utilisateurs métier et s'exécute hors de l'abonnement Azure ; ce n'est pas une ressource Azure gouvernée par l'équipe d'intégration.
    c:
      en: A WebJob runs a program or a script in an App Service plan that is billed continuously, and everything would have to be coded.
      fr: Un WebJob exécute un programme ou un script dans un plan App Service facturé en continu, et tout devrait être codé.
references:
  - title: Choose the right integration and automation services in Azure
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-compare-logic-apps-ms-flow-webjobs
  - title: What is Azure Logic Apps?
    url: https://learn.microsoft.com/en-us/azure/logic-apps/logic-apps-overview
