id: az305-4a-vm-scale-set-design
objective: "4.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys plans to run a stateless web tier on Virtual Machine Scale Sets that are created from a custom image.

    You need to recommend a design. The solution must meet the following requirements:

    - A scale set must be able to grow to 800 instances.
    - The same image version must be available to scale sets in three Azure regions.
    - A scale set must combine pay-as-you-go virtual machines, as a guaranteed baseline, with Azure Spot virtual machines.

    Which two elements should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prévoit d'exécuter un niveau web sans état sur des groupes de machines virtuelles identiques créés à partir d'une image personnalisée.

    Vous devez recommander une conception. La solution doit répondre aux exigences suivantes :

    - Un groupe de machines virtuelles identiques doit pouvoir atteindre 800 instances.
    - La même version d'image doit être disponible pour des groupes situés dans trois régions Azure.
    - Un groupe doit combiner des machines virtuelles facturées à l'utilisation, comme base garantie, avec des machines virtuelles Azure Spot.

    Quels sont les deux éléments à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store the image as an image version in Azure Compute Gallery.", fr: "Stocker l'image en tant que version d'image dans Azure Compute Gallery." } }
    - { id: b, text: { en: "Store the image as a managed image in one resource group.", fr: "Stocker l'image en tant qu'image managée dans un groupe de ressources." } }
    - { id: c, text: { en: "Create the scale sets in the Flexible orchestration mode.", fr: "Créer les groupes en mode d'orchestration Flexible." } }
    - { id: d, text: { en: "Create the scale sets in the Uniform orchestration mode.", fr: "Créer les groupes en mode d'orchestration Uniform." } }
    - { id: e, text: { en: "Place the instances of each scale set in a proximity placement group.", fr: "Placer les instances de chaque groupe dans un groupe de placement de proximité." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Azure Compute Gallery stores image versions and replicates them to the regions you choose, and a scale set created from a gallery image supports up to 1,000 instances. The Flexible orchestration mode is the one that lets a scale set combine Spot and pay-as-you-go virtual machines.
    fr: |
      Azure Compute Gallery stocke des versions d'image et les réplique dans les régions de votre choix, et un groupe de machines virtuelles identiques créé à partir d'une image de galerie prend en charge jusqu'à 1 000 instances. Le mode d'orchestration Flexible est celui qui permet à un groupe de combiner des machines virtuelles Spot et des machines virtuelles facturées à l'utilisation.
  options:
    b:
      en: A scale set created from a managed image is limited to 600 instances, and a managed image is not replicated to other regions.
      fr: Un groupe créé à partir d'une image managée est limité à 600 instances, et une image managée n'est pas répliquée dans d'autres régions.
    d:
      en: Combining Spot and pay-as-you-go virtual machines in one scale set is a capability of the Flexible mode, and the mode can't be changed after creation.
      fr: Combiner des machines virtuelles Spot et des machines facturées à l'utilisation dans un même groupe est une capacité du mode Flexible, et le mode ne peut pas être modifié après la création.
    e:
      en: A proximity placement group reduces latency between instances; it addresses none of the requirements.
      fr: Un groupe de placement de proximité réduit la latence entre les instances ; il ne répond à aucune des exigences.
references:
  - title: What are Virtual Machine Scale Sets?
    url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/overview
  - title: Store and share resources in Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
