id: az305-cs3a-hybrid-connectivity
objective: "4.4.2"
type: single
caseStudy: az305-cs3a-vanarsdel
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution to connect the Munich datacenter to Azure. The solution must meet the technical requirements.

    What should you include in the recommendation?
  fr: |
    Vous devez recommander une solution pour connecter le centre de données de Munich à Azure. La solution doit satisfaire les exigences techniques.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "An ExpressRoute Direct port pair with MACsec enabled", fr: "Une paire de ports ExpressRoute Direct avec MACsec activé" } }
    - { id: b, text: { en: "An ExpressRoute circuit and a site-to-site VPN connection over its private peering", fr: "Un circuit ExpressRoute et une connexion VPN de site à site sur son peering privé" } }
    - { id: c, text: { en: "A site-to-site VPN connection over the two internet links", fr: "Une connexion VPN de site à site sur les deux liaisons Internet" } }
    - { id: d, text: { en: "An ExpressRoute circuit with ExpressRoute FastPath enabled", fr: "Un circuit ExpressRoute avec ExpressRoute FastPath activé" } }
answer: { optionId: b }
explanation:
  correct:
    en: "An ExpressRoute circuit provides the private 1-Gbps path, but its traffic isn't encrypted by default. A site-to-site VPN connection that uses the private IP address of the VPN gateway runs over the private peering of the circuit, so the traffic is protected by IPsec from the VPN device of the datacenter to the virtual network without crossing the internet."
    fr: "Un circuit ExpressRoute fournit le chemin privé de 1 Gbit/s, mais son trafic n'est pas chiffré par défaut. Une connexion VPN de site à site qui utilise l'adresse IP privée de la passerelle VPN passe par le peering privé du circuit : le trafic est donc protégé par IPsec depuis l'appareil VPN du centre de données jusqu'au réseau virtuel, sans traverser Internet."
  options:
    a:
      en: "MACsec encrypts only the physical links between the edge devices of the customer and those of Microsoft, at layer 2, not with IPsec up to the virtual networks. It also requires ExpressRoute Direct, whose dedicated ports far exceed a 1-Gbps need and cost more."
      fr: "MACsec ne chiffre que les liaisons physiques entre les appareils de périphérie du client et ceux de Microsoft, en couche 2, et non par IPsec jusqu'aux réseaux virtuels. Il exige en outre ExpressRoute Direct, dont les ports dédiés dépassent largement un besoin de 1 Gbit/s et coûtent plus cher."
    c:
      en: "This tunnel is encrypted with IPsec, but it crosses the public internet. The requirements ask for a private connection."
      fr: "Ce tunnel est chiffré par IPsec, mais il traverse l'Internet public. Les exigences demandent une connexion privée."
    d:
      en: "FastPath improves the performance of the data path by bypassing the virtual network gateway. It doesn't encrypt anything."
      fr: "FastPath améliore les performances du chemin de données en contournant la passerelle de réseau virtuel. Il ne chiffre rien."
references:
  - title: About encryption for Azure ExpressRoute
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-encryption
  - title: Configure a Site-to-Site VPN connection over ExpressRoute private peering
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/site-to-site-vpn-private-peering
