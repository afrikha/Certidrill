id: az305-4a-appservice-plan-sharing
objective: "4.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to host two web apps named App1 and App2 in a single Standard App Service plan named Plan1 in the West Europe region. App1 will have a deployment slot named staging. Per-app scaling will not be enabled.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit d'héberger deux applications web nommées App1 et App2 dans un seul plan App Service Standard nommé Plan1, dans la région West Europe. App1 aura un emplacement de déploiement nommé staging. La mise à l'échelle par application ne sera pas activée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When an autoscale rule adds an instance to Plan1, both App1 and App2 run on the new instance.
        fr: Lorsqu'une règle de mise à l'échelle automatique ajoute une instance à Plan1, App1 et App2 s'exécutent toutes deux sur la nouvelle instance.
    - id: s2
      text:
        en: The staging slot of App1 runs on virtual machine instances that are separate from the instances of Plan1.
        fr: L'emplacement staging d'App1 s'exécute sur des instances de machines virtuelles distinctes des instances de Plan1.
    - id: s3
      text:
        en: To also run App2 in the North Europe region, Proseware must create a second App Service plan.
        fr: Pour exécuter également App2 dans la région North Europe, Proseware doit créer un second plan App Service.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      An App Service plan defines the compute: every app in the plan runs on all its instances, so the apps scale together. Deployment slots run on the same instances as the app and compete for the same resources. A plan belongs to one region, so running an app in another region requires another plan.
    fr: |
      Un plan App Service définit les ressources de calcul : chaque application du plan s'exécute sur toutes ses instances, et les applications sont donc mises à l'échelle ensemble. Les emplacements de déploiement s'exécutent sur les mêmes instances que l'application et se partagent les mêmes ressources. Un plan appartient à une seule région : exécuter une application dans une autre région exige un autre plan.
  options:
    s2:
      en: A slot is not isolated compute; it shares the instances of the plan with the production app and the other apps.
      fr: Un emplacement n'est pas une ressource de calcul isolée ; il partage les instances du plan avec l'application de production et les autres applications.
references:
  - title: What are Azure App Service plans?
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans
