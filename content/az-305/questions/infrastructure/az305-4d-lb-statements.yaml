id: az305-4d-lb-statements
objective: "4.4.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware is comparing global load-balancing options for two applications deployed in two Azure regions:

    - App1, an HTTPS web application
    - App2, a TCP service that internal clients reach through private IP addresses only

    The architects consider Azure Traffic Manager and the global tier of Azure Load Balancer.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware compare des options d'équilibrage de charge global pour deux applications déployées dans deux régions Azure :

    - App1, une application web HTTPS
    - App2, un service TCP que des clients internes atteignent uniquement par des adresses IP privées

    Les architectes étudient Azure Traffic Manager et le niveau global d'Azure Load Balancer.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If App1 uses Traffic Manager with the Priority routing method and the primary region fails, some clients can keep trying the failed region until their cached DNS answer expires.
        fr: |
          Si App1 utilise Traffic Manager avec la méthode de routage Priority et que la région principale tombe en panne, certains clients peuvent continuer à essayer la région défaillante jusqu'à l'expiration de leur réponse DNS en cache.
    - id: s2
      text:
        en: |
          Traffic Manager can terminate the TLS connections of App1 and apply a WAF policy before the requests reach a region.
        fr: |
          Traffic Manager peut terminer les connexions TLS d'App1 et appliquer une stratégie WAF avant que les requêtes n'atteignent une région.
    - id: s3
      text:
        en: |
          The global tier of Azure Load Balancer can provide App2 with an internal frontend IP address in front of internal load balancers in both regions.
        fr: |
          Le niveau global d'Azure Load Balancer peut fournir à App2 une adresse IP frontale interne devant des équilibreurs de charge internes dans les deux régions.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Traffic Manager is DNS-based: it changes its DNS answers when an endpoint fails, but DNS caching and clients that ignore the time-to-live delay the failover. It isn't a proxy, so it never sees the HTTP requests and can't terminate TLS or apply a WAF; that is the role of Azure Front Door. The global tier of Azure Load Balancer only supports a public frontend, and internal load balancers can't be added to its backend pool.
    fr: |
      Traffic Manager repose sur le DNS : il modifie ses réponses DNS quand un point de terminaison tombe en panne, mais la mise en cache DNS et les clients qui ignorent la durée de vie (TTL) retardent le basculement. Ce n'est pas un proxy : il ne voit jamais les requêtes HTTP et ne peut ni terminer TLS ni appliquer un WAF ; c'est le rôle d'Azure Front Door. Le niveau global d'Azure Load Balancer ne prend en charge qu'un front-end public, et des équilibreurs de charge internes ne peuvent pas être ajoutés à son pool principal.
references:
  - title: Load balancing options
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/load-balancing-overview
  - title: Global load balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/cross-region-overview
