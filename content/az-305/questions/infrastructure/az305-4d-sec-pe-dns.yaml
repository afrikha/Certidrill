id: az305-4d-sec-pe-dns
objective: "4.4.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys connects its datacenter to a hub virtual network named VNet-Hub through ExpressRoute. Several storage accounts are reached through private endpoints for their Blob service in VNet-Hub, and public network access is disabled on them. New storage accounts will be added in the same way.

    On-premises clients use two Windows Server DNS servers in the datacenter.

    You need to recommend a name resolution solution. The solution must meet the following requirements:

    - On-premises clients must resolve the names of the storage accounts, such as stdata01.blob.core.windows.net, to the private IP addresses of the private endpoints.
    - Storage accounts added later must resolve without changing the on-premises DNS servers.
    - Don't deploy any virtual machine in Azure.
    - Minimize administrative effort.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys connecte son centre de données à un réseau virtuel hub nommé VNet-Hub par ExpressRoute. Plusieurs comptes de stockage sont atteints par des points de terminaison privés pour leur service Blob dans VNet-Hub, et l'accès réseau public y est désactivé. De nouveaux comptes de stockage seront ajoutés de la même façon.

    Les clients locaux utilisent deux serveurs DNS Windows Server du centre de données.

    Vous devez recommander une solution de résolution de noms. La solution doit répondre aux exigences suivantes :

    - Les clients locaux doivent résoudre les noms des comptes de stockage, comme stdata01.blob.core.windows.net, vers les adresses IP privées des points de terminaison privés.
    - Les comptes de stockage ajoutés plus tard doivent être résolus sans modifier les serveurs DNS locaux.
    - Ne déployer aucune machine virtuelle dans Azure.
    - Réduire au minimum l'effort d'administration.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Private DNS zone linked to VNet-Hub: [[zone]]

      Azure component that receives the queries from the datacenter: [[resolver]]

      Domain of the conditional forwarder on the on-premises DNS servers: [[forwarder]]
    fr: |
      Zone DNS privée liée à VNet-Hub : [[zone]]

      Composant Azure qui reçoit les requêtes du centre de données : [[resolver]]

      Domaine du redirecteur conditionnel sur les serveurs DNS locaux : [[forwarder]]
  slots:
    - id: zone
      options:
        - { id: z-blob, text: "blob.core.windows.net" }
        - { id: z-privatelink, text: "privatelink.blob.core.windows.net" }
        - { id: z-core, text: "core.windows.net" }
    - id: resolver
      options:
        - { id: r-outbound, text: { en: "An outbound endpoint of Azure DNS Private Resolver", fr: "Un point de terminaison sortant du Résolveur privé Azure DNS" } }
        - { id: r-inbound, text: { en: "An inbound endpoint of Azure DNS Private Resolver", fr: "Un point de terminaison entrant du Résolveur privé Azure DNS" } }
        - { id: r-vms, text: { en: "Two DNS forwarder virtual machines in VNet-Hub", fr: "Deux machines virtuelles de redirection DNS dans VNet-Hub" } }
        - { id: r-ip, text: { en: "The Azure-provided DNS address 168.63.129.16", fr: "L'adresse DNS fournie par Azure 168.63.129.16" } }
    - id: forwarder
      options:
        - { id: f-account, text: "stdata01.blob.core.windows.net" }
        - { id: f-privatelink, text: "privatelink.blob.core.windows.net" }
        - { id: f-blob, text: "blob.core.windows.net" }
answer:
  values: { zone: z-privatelink, resolver: r-inbound, forwarder: f-blob }
explanation:
  correct:
    en: |
      The A records of Blob private endpoints live in the privatelink.blob.core.windows.net private DNS zone, linked to the virtual network. An inbound endpoint of Azure DNS Private Resolver gives the datacenter a private IP address in VNet-Hub that resolves through Azure DNS, without any virtual machine to manage. The on-premises conditional forwarder must target the public zone, blob.core.windows.net, not the privatelink zone, so that every current and future account name follows the CNAME to its private record.
    fr: |
      Les enregistrements A des points de terminaison privés Blob se trouvent dans la zone DNS privée privatelink.blob.core.windows.net, liée au réseau virtuel. Un point de terminaison entrant du Résolveur privé Azure DNS offre au centre de données une adresse IP privée dans VNet-Hub qui résout par Azure DNS, sans machine virtuelle à gérer. Le redirecteur conditionnel local doit cibler la zone publique, blob.core.windows.net, et non la zone privatelink, afin que chaque nom de compte actuel ou futur suive le CNAME jusqu'à son enregistrement privé.
  options:
    z-blob:
      en: |
        A private zone named blob.core.windows.net would override public resolution for every blob account, including accounts without a private endpoint.
      fr: |
        Une zone privée nommée blob.core.windows.net remplacerait la résolution publique de tous les comptes blob, y compris ceux sans point de terminaison privé.
    r-outbound:
      en: |
        An outbound endpoint forwards queries from Azure to other DNS servers; it doesn't receive queries from on-premises.
      fr: |
        Un point de terminaison sortant transfère des requêtes d'Azure vers d'autres serveurs DNS ; il ne reçoit pas les requêtes du réseau local.
    r-vms:
      en: |
        DNS forwarder virtual machines would work but are excluded by the requirements and add administrative effort.
      fr: |
        Des machines virtuelles de redirection DNS fonctionneraient, mais elles sont exclues par les exigences et ajoutent de l'effort d'administration.
    r-ip:
      en: |
        168.63.129.16 is only reachable from inside Azure virtual networks, not from the datacenter.
      fr: |
        168.63.129.16 n'est joignable que depuis les réseaux virtuels Azure, pas depuis le centre de données.
    f-account:
      en: |
        A forwarder per account name would require a change on the on-premises DNS servers for every new storage account.
      fr: |
        Un redirecteur par nom de compte imposerait une modification des serveurs DNS locaux pour chaque nouveau compte de stockage.
    f-privatelink:
      en: |
        Clients query the public name of the account; Microsoft recommends forwarding the public zone, not the privatelink zone.
      fr: |
        Les clients interrogent le nom public du compte ; Microsoft recommande de rediriger la zone publique, et non la zone privatelink.
references:
  - title: Azure Private Endpoint DNS Integration Scenarios
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
  - title: What is Azure DNS Private Resolver?
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
