id: az305-4a-sls-premium-windows
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam is moving an internal API to Azure Functions. The functions are written in C#, are triggered by HTTP requests from interactive users, and load a native library that exists only for Windows.

    You need to recommend a hosting plan. The solution must meet the following requirements:

    - The functions call an on-premises system through virtual network integration.
    - The platform adds and removes instances according to the incoming events, without autoscale rules to maintain.
    - No request waits for a cold start.

    Which hosting plan should you recommend?
  fr: |
    Fabrikam déplace une API interne vers Azure Functions. Les fonctions sont écrites en C#, sont déclenchées par des requêtes HTTP d'utilisateurs interactifs et chargent une bibliothèque native qui n'existe que pour Windows.

    Vous devez recommander un plan d'hébergement. La solution doit répondre aux exigences suivantes :

    - Les fonctions appellent un système local grâce à l'intégration au réseau virtuel.
    - La plateforme ajoute et supprime des instances selon les événements entrants, sans règles de mise à l'échelle automatique à maintenir.
    - Aucune requête n'attend un démarrage à froid.

    Quel plan d'hébergement devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The Flex Consumption plan, with always-ready instances", fr: "Le plan Flex Consumption, avec des instances toujours prêtes" } }
    - { id: b, text: { en: "The Consumption plan", fr: "Le plan Consumption" } }
    - { id: c, text: { en: "The Dedicated (App Service) plan, with Always On", fr: "Le plan Dedicated (App Service), avec Always On" } }
    - { id: d, text: { en: "The Premium plan", fr: "Le plan Premium" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Premium plan runs on Windows or Linux, supports virtual network integration and scales on events like the serverless plans. It keeps at least one instance always ready and uses prewarmed instances when it scales out, so requests don't hit a cold start.
    fr: |
      Le plan Premium s'exécute sous Windows ou Linux, prend en charge l'intégration au réseau virtuel et se met à l'échelle selon les événements, comme les plans serverless. Il garde au moins une instance toujours prête et utilise des instances préchauffées lors du scale-out : les requêtes ne subissent donc pas de démarrage à froid.
  options:
    a:
      en: Flex Consumption with always-ready instances would meet the networking, scaling and cold-start requirements, but the plan is Linux only.
      fr: Flex Consumption avec des instances toujours prêtes répondrait aux exigences de réseau, de mise à l'échelle et de démarrage à froid, mais ce plan est réservé à Linux.
    b:
      en: The Consumption plan runs on Windows, but it has no virtual network integration and requests can wait for a cold start after a scale to zero.
      fr: Le plan Consumption s'exécute sous Windows, mais il n'a pas d'intégration au réseau virtuel et les requêtes peuvent attendre un démarrage à froid après une mise à l'échelle à zéro.
    c:
      en: A Dedicated plan with Always On has no cold start and supports virtual networks, but it scales manually or with autoscale rules, not on events.
      fr: Un plan Dedicated avec Always On n'a pas de démarrage à froid et prend en charge les réseaux virtuels, mais il est mis à l'échelle manuellement ou par des règles de mise à l'échelle automatique, et non selon les événements.
references:
  - title: Azure Functions hosting options
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
  - title: Azure Functions Premium plan
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-premium-plan
