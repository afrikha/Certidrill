id: az305-4a-compute-match-workloads
objective: "4.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum is designing three new workloads in Azure. Each workload must use the most managed compute service that meets its requirements.

    Which service should you recommend for each workload? To answer, drag the appropriate services to the correct workloads. Each service may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum conçoit trois nouvelles charges de travail dans Azure. Chaque charge de travail doit utiliser le service de calcul le plus managé qui répond à ses exigences.

    Quel service devez-vous recommander pour chaque charge de travail ? Pour répondre, faites glisser les services appropriés vers les charges de travail correspondantes. Chaque service peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: func, text: Azure Functions }
    - { id: app, text: Azure App Service }
    - { id: batch, text: Azure Batch }
    - { id: aks, text: Azure Kubernetes Service (AKS) }
    - { id: vm, text: { en: "Azure Virtual Machines", fr: "Machines virtuelles Azure" } }
  targets:
    - id: t1
      text:
        en: Code that runs for a few seconds each time a message arrives in a queue, billed per execution, with nothing running while the queue is empty
        fr: Du code qui s'exécute quelques secondes à chaque arrivée d'un message dans une file d'attente, facturé à l'exécution, sans rien d'actif tant que la file d'attente est vide
    - id: t2
      text:
        en: A web API on a managed web hosting platform, with deployment slots and built-in authentication
        fr: Une API web sur une plateforme d'hébergement web managée, avec des emplacements de déploiement et l'authentification intégrée
    - id: t3
      text:
        en: Thousands of independent rendering tasks that need managed job scheduling on pools of compute nodes
        fr: Des milliers de tâches de rendu indépendantes qui ont besoin d'une planification managée des travaux sur des pools de nœuds de calcul
answer:
  mapping: { t1: func, t2: app, t3: batch }
explanation:
  correct:
    en: |
      Azure Functions runs event-driven code, scales to zero and bills per execution. App Service is the managed platform for web apps and APIs, with deployment slots and built-in authentication. Azure Batch creates pools of compute nodes and schedules large numbers of parallel tasks on them. AKS and virtual machines would work, but they leave more to operate than each workload requires.
    fr: |
      Azure Functions exécute du code piloté par les événements, se met à l'échelle jusqu'à zéro et facture à l'exécution. App Service est la plateforme managée des applications web et des API, avec des emplacements de déploiement et l'authentification intégrée. Azure Batch crée des pools de nœuds de calcul et y planifie un grand nombre de tâches parallèles. AKS et les machines virtuelles fonctionneraient, mais laissent plus d'exploitation à votre charge que ce que chaque charge de travail exige.
references:
  - title: Choose an Azure compute service
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/compute-decision-tree
