id: az305-4b-api-tier-hotarea
objective: "4.2.3"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders compares tiers of Azure API Management in the following table.

    You need to recommend a tier for two environments. Answer each prompt by selecting the appropriate tier in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders compare des niveaux d'Azure API Management dans le tableau suivant.

    Vous devez recommander un niveau pour deux environnements. Répondez à chaque consigne en sélectionnant le niveau approprié dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: "A proof of concept that receives a few calls per day and must be billed only for the calls it receives"
        fr: "Une preuve de concept qui reçoit quelques appels par jour et ne doit être facturée que pour les appels reçus"
    - id: p2
      text:
        en: "A test environment to evaluate the self-hosted gateway at the lowest cost; no SLA is required"
        fr: "Un environnement de test pour évaluer la passerelle auto-hébergée au moindre coût ; aucun SLA n'est exigé"
  grid:
    header:
      - { en: "Tier", fr: "Niveau" }
      - { en: "Scale units", fr: "Unités d'échelle" }
      - { en: "Self-hosted gateway", fr: "Passerelle auto-hébergée" }
      - { en: "Back ends isolated in a virtual network", fr: "Services principaux isolés dans un réseau virtuel" }
    rows:
      - - { text: Consumption, area: consumption }
        - { text: { en: "None: automatic scaling, billed per call", fr: "Aucune : mise à l'échelle automatique, facturation à l'appel" } }
        - { text: { en: "No", fr: "Non" } }
        - { text: { en: "No", fr: "Non" } }
      - - { text: Developer, area: developer }
        - { text: { en: "1, no SLA", fr: "1, sans SLA" } }
        - { text: { en: "Yes, one gateway node", fr: "Oui, un seul nœud de passerelle" } }
        - { text: { en: "Yes", fr: "Oui" } }
      - - { text: Basic v2, area: basicv2 }
        - { text: { en: "Up to 10", fr: "Jusqu'à 10" } }
        - { text: { en: "No", fr: "Non" } }
        - { text: { en: "No", fr: "Non" } }
      - - { text: Standard v2, area: stdv2 }
        - { text: { en: "Up to 10", fr: "Jusqu'à 10" } }
        - { text: { en: "No", fr: "Non" } }
        - { text: { en: "Yes", fr: "Oui" } }
      - - { text: Premium, area: premium }
        - { text: { en: "Up to 12 per region", fr: "Jusqu'à 12 par région" } }
        - { text: { en: "Yes", fr: "Oui" } }
        - { text: { en: "Yes", fr: "Oui" } }
answer:
  values: { p1: consumption, p2: developer }
explanation:
  correct:
    en: "The Consumption tier has no fixed capacity: it scales automatically and is billed per call, which suits sporadic traffic. The self-hosted gateway exists only in the Developer and Premium tiers; Developer, which has no SLA and allows a single gateway node, is the inexpensive tier meant for evaluation and test."
    fr: "Le niveau Consumption n'a pas de capacité fixe : il se met à l'échelle automatiquement et se facture à l'appel, ce qui convient à un trafic sporadique. La passerelle auto-hébergée n'existe que dans les niveaux Developer et Premium ; Developer, qui n'a pas de SLA et n'autorise qu'un seul nœud de passerelle, est le niveau peu coûteux destiné à l'évaluation et au test."
references:
  - title: Feature-based comparison of the Azure API Management tiers
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-features
