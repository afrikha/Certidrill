id: az305-4a-ctr-container-apps-microservices
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is building an order platform made of 12 containerized microservices. Some microservices expose HTTP APIs, and the others process messages from Azure Service Bus queues.

    You need to recommend a hosting service. The solution must meet the following requirements:

    - Each microservice scales on HTTP traffic or on queue length, and scales to zero when it is idle.
    - The team does not manage a cluster, nodes or Kubernetes upgrades.

    The team does not need access to the Kubernetes API.

    What should you recommend?
  fr: |
    Northwind Traders construit une plateforme de commandes composée de 12 microservices en conteneurs. Certains microservices exposent des API HTTP, et les autres traitent des messages de files d'attente Azure Service Bus.

    Vous devez recommander un service d'hébergement. La solution doit répondre aux exigences suivantes :

    - Chaque microservice est mis à l'échelle selon le trafic HTTP ou la longueur de la file d'attente, et jusqu'à zéro lorsqu'il est inactif.
    - L'équipe ne gère ni cluster, ni nœuds, ni mises à niveau de Kubernetes.

    L'équipe n'a pas besoin d'accéder à l'API Kubernetes.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: Azure Kubernetes Service (AKS) }
    - { id: b, text: Azure Container Instances }
    - { id: c, text: Azure Container Apps }
    - { id: d, text: { en: "Azure Virtual Machine Scale Sets that run Docker", fr: "Des groupes de machines virtuelles identiques Azure qui exécutent Docker" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure Container Apps is a serverless platform for containerized microservices. Its scaling is driven by HTTP traffic or by events such as queue length (KEDA) and goes down to zero replicas, and there is no cluster to operate. The trade-off, no direct access to the Kubernetes API, is acceptable here.
    fr: |
      Azure Container Apps est une plateforme serverless pour les microservices en conteneurs. Sa mise à l'échelle est pilotée par le trafic HTTP ou par des événements comme la longueur d'une file d'attente (KEDA) et descend jusqu'à zéro réplica, sans cluster à exploiter. La contrepartie, l'absence d'accès direct à l'API Kubernetes, est acceptable ici.
  options:
    a:
      en: AKS gives the full Kubernetes API, which isn't needed, and leaves a cluster to configure and operate.
      fr: AKS donne accès à toute l'API Kubernetes, ce qui n'est pas nécessaire, et laisse un cluster à configurer et à exploiter.
    b:
      en: Container Instances runs isolated container groups without scaling or load balancing; running more instances means creating more container groups yourself.
      fr: Container Instances exécute des groupes de conteneurs isolés, sans mise à l'échelle ni équilibrage de charge ; exécuter plus d'instances revient à créer vous-même d'autres groupes de conteneurs.
    d:
      en: Scale sets with Docker are virtual machines to patch, with no container orchestration and no scale to zero driven by queue length.
      fr: Des groupes de machines virtuelles identiques avec Docker sont des machines virtuelles à corriger, sans orchestration de conteneurs ni mise à l'échelle à zéro pilotée par la longueur de la file d'attente.
references:
  - title: Comparing Container Apps with other Azure container options
    url: https://learn.microsoft.com/en-us/azure/container-apps/compare-options
  - title: Set scaling rules in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/scale-app
