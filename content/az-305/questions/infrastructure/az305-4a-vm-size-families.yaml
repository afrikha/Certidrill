id: az305-4a-vm-size-families
objective: "4.1.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys plans to deploy two workloads on Azure virtual machines. You need to recommend a virtual machine size series for each workload.

    Answer each prompt by selecting the appropriate series in the following table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit de déployer deux charges de travail sur des machines virtuelles Azure. Vous devez recommander une série de tailles de machines virtuelles pour chaque charge de travail.

    Répondez à chaque consigne en sélectionnant la série appropriée dans le tableau suivant.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: An SAP HANA in-memory database that needs 6 TB of memory on a single virtual machine
        fr: Une base de données en mémoire SAP HANA qui a besoin de 6 To de mémoire sur une seule machine virtuelle
    - id: p2
      text:
        en: An Apache Cassandra cluster that stores its data on the local disks of the nodes and needs the highest local disk throughput
        fr: Un cluster Apache Cassandra qui stocke ses données sur les disques locaux des nœuds et a besoin du débit de disque local le plus élevé
  grid:
    caption: { en: "Azure virtual machine size series", fr: "Séries de tailles de machines virtuelles Azure" }
    rows:
      - [{ text: { en: "B-series", fr: "Série B" }, area: b }, { text: { en: "D-series", fr: "Série D" }, area: d }]
      - [{ text: { en: "E-series", fr: "Série E" }, area: e }, { text: { en: "F-series", fr: "Série F" }, area: f }]
      - [{ text: { en: "L-series", fr: "Série L" }, area: l }, { text: { en: "M-series", fr: "Série M" }, area: m }]
      - [{ text: { en: "NC-series", fr: "Série NC" }, area: nc }, { text: { en: "HB-series", fr: "Série HB" }, area: hb }]
answer:
  values: { p1: m, p2: l }
explanation:
  correct:
    en: |
      The M-series is the memory-optimized family for extremely large databases that need the largest amounts of memory, such as SAP HANA. The L-series is storage optimized: it offers high throughput and I/O on local disks, for NoSQL databases such as Cassandra and for data warehousing.
    fr: |
      La série M est la famille optimisée pour la mémoire destinée aux très grandes bases de données qui exigent les plus grandes quantités de mémoire, comme SAP HANA. La série L est optimisée pour le stockage : elle offre un débit et des E/S élevés sur les disques locaux, pour les bases de données NoSQL comme Cassandra et pour les entrepôts de données.
  options:
    e:
      en: The E-series is also memory optimized, for relational databases and in-memory analytics, but the largest memory sizes belong to the M-series.
      fr: La série E est aussi optimisée pour la mémoire, pour les bases de données relationnelles et l'analytique en mémoire, mais les plus grandes tailles de mémoire relèvent de la série M.
    hb:
      en: The HB-series targets high-performance computing that needs high memory bandwidth, such as fluid dynamics, not database storage.
      fr: La série HB vise le calcul haute performance qui exige une bande passante mémoire élevée, comme la dynamique des fluides, et non le stockage de bases de données.
references:
  - title: Sizes for virtual machines in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/overview
