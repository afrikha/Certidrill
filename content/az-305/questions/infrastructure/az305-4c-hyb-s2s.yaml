id: az305-4c-hyb-s2s
objective: "4.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders opens a branch office with 25 employees. The computers and printers of the office must reach applications that run on virtual machines in an Azure virtual network.

    You need to recommend a connectivity solution. The solution must meet the following requirements:

    - The traffic between the office and Azure must be encrypted.
    - The connection must be operational within one week, at the lowest cost.
    - No client software can be installed on the devices of the office.
    - The latency of an internet path is acceptable.

    What should you recommend?
  fr: |
    Northwind Traders ouvre une succursale de 25 employés. Les ordinateurs et les imprimantes du bureau doivent atteindre des applications exécutées sur des machines virtuelles d'un réseau virtuel Azure.

    Vous devez recommander une solution de connectivité. La solution doit répondre aux exigences suivantes :

    - Le trafic entre le bureau et Azure doit être chiffré.
    - La connexion doit être opérationnelle en une semaine, au moindre coût.
    - Aucun logiciel client ne peut être installé sur les appareils du bureau.
    - La latence d'un chemin Internet est acceptable.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An ExpressRoute circuit", fr: "Un circuit ExpressRoute" } }
    - { id: b, text: { en: "A site-to-site VPN connection", fr: "Une connexion VPN de site à site" } }
    - { id: c, text: { en: "Point-to-site VPN connections", fr: "Des connexions VPN de point à site" } }
    - { id: d, text: { en: "An ExpressRoute Direct port pair", fr: "Une paire de ports ExpressRoute Direct" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A site-to-site VPN is an IPsec/IKE tunnel between the VPN device of the office and an Azure VPN gateway, over the existing internet link. It encrypts all the traffic of the office network, needs nothing on the individual devices, is quick to deploy and costs much less than a private circuit.
    fr: |
      Un VPN de site à site est un tunnel IPsec/IKE entre le périphérique VPN du bureau et une passerelle VPN Azure, sur la liaison Internet existante. Il chiffre tout le trafic du réseau du bureau, ne demande rien sur les appareils individuels, se déploie rapidement et coûte bien moins cher qu'un circuit privé.
  options:
    a:
      en: An ExpressRoute circuit is ordered from a connectivity provider, takes longer to provision, costs more and isn't encrypted by default.
      fr: Un circuit ExpressRoute se commande auprès d'un fournisseur de connectivité, est plus long à provisionner, coûte plus cher et n'est pas chiffré par défaut.
    c:
      en: Point-to-site connections require a VPN client on each computer and can't serve devices such as printers.
      fr: Les connexions de point à site exigent un client VPN sur chaque ordinateur et ne peuvent pas desservir des appareils comme les imprimantes.
    d:
      en: ExpressRoute Direct provides dedicated high-capacity ports for massive needs, at a cost and lead time out of proportion with a small office.
      fr: ExpressRoute Direct fournit des ports dédiés à grande capacité pour des besoins massifs, à un coût et dans un délai sans rapport avec un petit bureau.
references:
  - title: What is Azure VPN Gateway?
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpngateways
