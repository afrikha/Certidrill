id: az305-4c-db-opensource-tools
objective: "4.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware plans to migrate two open-source databases to Azure:

    - A 600-GB MySQL 8.0 database that runs on-premises, to Azure Database for MySQL flexible server
    - A PostgreSQL 15 database that runs on Amazon RDS, to Azure Database for PostgreSQL flexible server

    Both applications must stay online during the migration, with a downtime limited to the cutover. The solution must use tools managed by Microsoft and minimize effort.

    Which tool should you recommend for each database? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de migrer deux bases de données open source vers Azure :

    - Une base de données MySQL 8.0 de 600 Go exécutée en local, vers Azure Database pour MySQL - Serveur flexible
    - Une base de données PostgreSQL 15 exécutée sur Amazon RDS, vers Azure Database pour PostgreSQL - Serveur flexible

    Les deux applications doivent rester en ligne pendant la migration, avec une interruption limitée à la bascule. La solution doit utiliser des outils managés par Microsoft et réduire l'effort au minimum.

    Quel outil devez-vous recommander pour chaque base de données ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      MySQL database: [[mysql]]

      PostgreSQL database: [[pg]]
    fr: |
      Base de données MySQL : [[mysql]]

      Base de données PostgreSQL : [[pg]]
  slots:
    - id: mysql
      options:
        - { id: ssma, text: { en: "SQL Server Migration Assistant (SSMA) for MySQL", fr: "SQL Server Migration Assistant (SSMA) pour MySQL" } }
        - { id: dms, text: "Azure Database Migration Service" }
        - { id: bacpac, text: { en: "A BACPAC import", fr: "Une importation BACPAC" } }
        - { id: migrate, text: { en: "The migration tool of Azure Migrate", fr: "L'outil de migration d'Azure Migrate" } }
    - id: pg
      options:
        - { id: pgms, text: { en: "The migration service in Azure Database for PostgreSQL", fr: "Le service de migration d'Azure Database pour PostgreSQL" } }
        - { id: link, text: { en: "The Managed Instance link", fr: "Le lien Managed Instance" } }
        - { id: lrs, text: "Log Replay Service" }
        - { id: ssma, text: "SQL Server Migration Assistant (SSMA)" }
answer:
  values: { mysql: dms, pg: pgms }
explanation:
  correct:
    en: |
      Azure Database Migration Service performs online migrations from MySQL servers to Azure Database for MySQL flexible server: after the initial load, it replicates the changes until the cutover. For PostgreSQL, the migration service of Azure Database for PostgreSQL flexible server migrates online or offline from on-premises servers, Azure virtual machines and other clouds, including Amazon RDS.
    fr: |
      Azure Database Migration Service effectue des migrations en ligne de serveurs MySQL vers Azure Database pour MySQL - Serveur flexible : après le chargement initial, il réplique les modifications jusqu'à la bascule. Pour PostgreSQL, le service de migration d'Azure Database pour PostgreSQL - Serveur flexible migre en ligne ou hors connexion depuis des serveurs locaux, des machines virtuelles Azure et d'autres clouds, dont Amazon RDS.
  options:
    ssma:
      en: SSMA converts other engines to SQL Server or Azure SQL; here the engine doesn't change.
      fr: SSMA convertit d'autres moteurs vers SQL Server ou Azure SQL ; ici, le moteur ne change pas.
    bacpac:
      en: BACPAC is a SQL Server and Azure SQL format.
      fr: BACPAC est un format de SQL Server et d'Azure SQL.
    migrate:
      en: The migration tool of Azure Migrate rehosts servers as virtual machines, not as a managed database service.
      fr: L'outil de migration d'Azure Migrate réhéberge des serveurs en machines virtuelles, pas en service de base de données managé.
    link:
      en: The Managed Instance link connects SQL Server to Azure SQL Managed Instance.
      fr: Le lien Managed Instance relie SQL Server à Azure SQL Managed Instance.
    lrs:
      en: Log Replay Service restores SQL Server backups to Azure SQL Managed Instance.
      fr: Log Replay Service restaure des sauvegardes SQL Server vers Azure SQL Managed Instance.
references:
  - title: Azure Database Migration Service supported scenarios
    url: https://learn.microsoft.com/en-us/azure/dms/resource-scenario-status
  - title: What is the migration service in Azure Database for PostgreSQL flexible server?
    url: https://learn.microsoft.com/en-us/azure/postgresql/migrate/migration-service/overview-migration-service-postgresql
