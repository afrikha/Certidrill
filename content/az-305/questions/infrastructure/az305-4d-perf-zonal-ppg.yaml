id: az305-4d-perf-zonal-ppg
objective: "4.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders plans to deploy an order-matching application in the East US 2 region, which supports availability zones. The application has a gateway tier and a matching-engine tier. Each request crosses both tiers several times.

    You need to recommend a placement for the virtual machines. The solution must meet the following requirements:

    - Keep the latency between the gateway tier and the matching-engine tier as low as possible.
    - Keep the application available if one availability zone fails.
    - A zone-redundant Standard load balancer will distribute the client connections.

    What should you recommend?
  fr: |
    Northwind Traders prévoit de déployer une application de rapprochement d'ordres dans la région East US 2, qui prend en charge les zones de disponibilité. L'application comprend un niveau passerelle et un niveau moteur de rapprochement. Chaque requête traverse plusieurs fois les deux niveaux.

    Vous devez recommander un placement pour les machines virtuelles. La solution doit répondre aux exigences suivantes :

    - Maintenir la latence entre le niveau passerelle et le niveau moteur de rapprochement aussi faible que possible.
    - Maintenir l'application disponible en cas de panne d'une zone de disponibilité.
    - Un équilibreur de charge Standard redondant interzone répartira les connexions des clients.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Two proximity placement groups, each pinned to a different zone and each containing a full copy of both tiers", fr: "Deux groupes de placement de proximité, épinglés chacun à une zone différente et contenant chacun une copie complète des deux niveaux" } }
    - { id: b, text: { en: "One proximity placement group that contains both tiers, with each tier in its own availability set", fr: "Un groupe de placement de proximité contenant les deux niveaux, avec chaque niveau dans son propre groupe à haute disponibilité" } }
    - { id: c, text: { en: "One proximity placement group that contains both tiers, with the virtual machines spread across zones 1 and 2", fr: "Un groupe de placement de proximité contenant les deux niveaux, avec les machines virtuelles réparties sur les zones 1 et 2" } }
    - { id: d, text: { en: "No proximity placement group, with the virtual machines of each tier spread across zones 1, 2 and 3", fr: "Aucun groupe de placement de proximité, avec les machines virtuelles de chaque niveau réparties sur les zones 1, 2 et 3" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A proximity placement group can be created in a specific availability zone, but a single group can't span zones. Deploying a complete stack of both tiers in each of two zone-pinned groups keeps the tier-to-tier traffic inside one datacenter, and the zone-redundant load balancer sends the clients to the stack in the surviving zone if a zone fails.
    fr: |
      Un groupe de placement de proximité peut être créé dans une zone de disponibilité donnée, mais un même groupe ne peut pas s'étendre sur plusieurs zones. Déployer une pile complète des deux niveaux dans chacun de deux groupes épinglés à une zone maintient le trafic entre niveaux dans un seul centre de données, et l'équilibreur de charge redondant interzone envoie les clients vers la pile de la zone restante si une zone tombe en panne.
  options:
    b:
      en: |
        Availability sets protect against rack and update failures inside one datacenter; the application would not survive the failure of the zone.
      fr: |
        Les groupes à haute disponibilité protègent contre les pannes de rack et les mises à jour dans un centre de données ; l'application ne survivrait pas à la panne de la zone.
    c:
      en: |
        A single proximity placement group can't span availability zones.
      fr: |
        Un même groupe de placement de proximité ne peut pas s'étendre sur plusieurs zones de disponibilité.
    d:
      en: |
        Spreading the tiers across zones meets the resiliency requirement, but many requests cross zones, which doesn't keep the latency as low as possible.
      fr: |
        Répartir les niveaux sur les zones répond à l'exigence de résilience, mais de nombreuses requêtes traversent les zones, ce qui ne maintient pas la latence aussi faible que possible.
references:
  - title: Proximity placement groups
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/co-location
