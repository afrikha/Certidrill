id: az305-4b-caf-govern-phase
objective: "4.3.1"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Litware migrated its first workloads to Azure by following the Microsoft Cloud Adoption Framework for Azure.

    Management now asks how Litware will control its Azure environment as more workloads arrive: which risks to address, which policies to document and how to enforce them.

    Which methodology of the framework provides this guidance?
  fr: |
    Litware a migré ses premières charges de travail vers Azure en suivant le Microsoft Cloud Adoption Framework pour Azure.

    La direction demande maintenant comment Litware va contrôler son environnement Azure à mesure que d'autres charges de travail arrivent : quels risques traiter, quelles stratégies documenter et comment les appliquer.

    Quelle méthodologie du framework fournit ces conseils ?
body:
  options:
    - { id: a, text: Strategy }
    - { id: b, text: Ready }
    - { id: c, text: Govern }
    - { id: d, text: Manage }
answer: { optionId: c }
explanation:
  correct:
    en: "Each phase of the framework answers one key decision. Govern answers how the organization controls its Azure environment, through governance policies that it documents and enforces; it runs continuously, alongside the adoption."
    fr: "Chaque phase du framework répond à une décision clé. Govern répond à la façon dont l'organisation contrôle son environnement Azure, au moyen de stratégies de gouvernance qu'elle documente et applique ; elle se déroule en continu, en parallèle de l'adoption."
  options:
    a:
      en: "Strategy defines what the adoption of Azure should look like: motivations and expected outcomes."
      fr: "Strategy définit à quoi doit ressembler l'adoption d'Azure : motivations et résultats attendus."
    b:
      en: "Ready covers how to build the Azure landing zone before workloads are deployed."
      fr: "Ready traite de la construction de la zone d'atterrissage Azure avant le déploiement des charges de travail."
    d:
      en: "Manage covers how to operate and optimize Azure over time, not how to set and enforce the rules."
      fr: "Manage traite de l'exploitation et de l'optimisation d'Azure dans la durée, pas de la définition et de l'application des règles."
references:
  - title: What is the Cloud Adoption Framework?
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/overview
