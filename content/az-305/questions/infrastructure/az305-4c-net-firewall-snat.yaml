id: az305-4c-net-firewall-snat
objective: "4.4.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a hub virtual network that contains an Azure Firewall instance with one public IP address. A route for 0.0.0.0/0 on every spoke subnet sends internet-bound traffic to the firewall.

    During batch jobs, thousands of virtual machines connect to the same few internet destinations, and connections fail because the firewall runs out of SNAT ports.

    You need to recommend a change. The solution must meet the following requirements:

    - Internet-bound traffic must still be filtered by the firewall.
    - The number of SNAT ports must increase.
    - The number of public IP addresses that partners must allow must stay as low as possible.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un réseau virtuel hub qui contient une instance du Pare-feu Azure dotée d'une seule adresse IP publique. Un itinéraire pour 0.0.0.0/0 sur chaque sous-réseau des spokes envoie le trafic à destination d'Internet vers le pare-feu.

    Pendant les traitements par lots, des milliers de machines virtuelles se connectent aux mêmes quelques destinations Internet, et des connexions échouent parce que le pare-feu n'a plus de ports SNAT disponibles.

    Vous devez recommander une modification. La solution doit répondre aux exigences suivantes :

    - Le trafic à destination d'Internet doit toujours être filtré par le pare-feu.
    - Le nombre de ports SNAT doit augmenter.
    - Le nombre d'adresses IP publiques que les partenaires doivent autoriser doit rester aussi faible que possible.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Deploy [[res]] and associate it with [[subnet]].
    fr: |
      Déployer [[res]] et l'associer à [[subnet]].
  slots:
    - id: res
      options:
        - { id: lb, text: { en: "a Standard public load balancer", fr: "un équilibreur de charge public Standard" } }
        - { id: nat, text: { en: "a NAT gateway", fr: "une passerelle NAT" } }
        - { id: ars, text: { en: "an Azure Route Server", fr: "un serveur de routes Azure (Azure Route Server)" } }
        - { id: appgw, text: { en: "an application gateway", fr: "une passerelle d'application (Application Gateway)" } }
    - id: subnet
      options:
        - { id: spokes, text: { en: "each spoke workload subnet", fr: "chaque sous-réseau de charge de travail des spokes" } }
        - { id: gw, text: "GatewaySubnet" }
        - { id: fw, text: "AzureFirewallSubnet" }
        - { id: ars, text: "RouteServerSubnet" }
answer:
  values: { res: nat, subnet: fw }
explanation:
  correct:
    en: |
      A NAT gateway associated with AzureFirewallSubnet becomes the outbound path of the firewall: the traffic is still filtered by the firewall, then translated by the NAT gateway, which offers far more SNAT ports per public IP address than the firewall does. Partners therefore allow one or two addresses of the NAT gateway instead of many firewall addresses.
    fr: |
      Une passerelle NAT associée à AzureFirewallSubnet devient le chemin sortant du pare-feu : le trafic est toujours filtré par le pare-feu, puis traduit par la passerelle NAT, qui offre bien plus de ports SNAT par adresse IP publique que le pare-feu. Les partenaires autorisent donc une ou deux adresses de la passerelle NAT au lieu de nombreuses adresses du pare-feu.
  options:
    spokes:
      en: "On the spoke subnets, the route for 0.0.0.0/0 to the firewall takes precedence, so a NAT gateway there would not be used; without the route, the traffic would bypass the firewall."
      fr: "Sur les sous-réseaux des spokes, l'itinéraire pour 0.0.0.0/0 vers le pare-feu est prioritaire : une passerelle NAT n'y serait pas utilisée ; sans l'itinéraire, le trafic contournerait le pare-feu."
    lb:
      en: A load balancer can't be placed in front of the outbound traffic of Azure Firewall to add SNAT ports.
      fr: Un équilibreur de charge ne peut pas être placé devant le trafic sortant du Pare-feu Azure pour ajouter des ports SNAT.
    ars:
      en: Azure Route Server exchanges BGP routes with network virtual appliances; it performs no address translation.
      fr: Azure Route Server échange des itinéraires BGP avec des appliances virtuelles réseau ; il n'effectue aucune traduction d'adresses.
references:
  - title: Scale SNAT ports with Azure NAT Gateway
    url: https://learn.microsoft.com/en-us/azure/firewall/integrate-with-nat-gateway
