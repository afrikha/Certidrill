id: az305-sr1-order-messages-3
objective: "4.2.1"
type: series_yesno
series: az305-sr1-order-messages
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You recommend a Service Bus Basic namespace with one queue per back-end service.
  fr: Vous recommandez un espace de noms Service Bus Basic avec une file d'attente par service principal.
body:
  solution:
    en: |
      You recommend an **Azure Service Bus** namespace in the **Basic** tier that contains two **queues**, one for Billing and one for Shipping. The front end sends each order to both queues, with the order number as the message ID.
    fr: |
      Vous recommandez un espace de noms **Azure Service Bus** de niveau **Basic** qui contient deux **files d'attente**, une pour Billing et une pour Shipping. Le front-end envoie chaque commande aux deux files d'attente, avec le numéro de commande comme ID de message.
answer: { value: false }
explanation:
  correct:
    en: |
      Sending to two queues gives each service its own copy, but the Basic tier supports neither sessions nor duplicate detection. Without sessions, the processing order of the messages of one customer is not guaranteed, and without duplicate detection a retried order is delivered twice whatever its message ID. The Standard tier is the lowest tier that offers both features.
    fr: |
      L'envoi vers deux files d'attente donne à chaque service sa propre copie, mais le niveau Basic ne prend en charge ni les sessions ni la détection des doublons. Sans sessions, l'ordre de traitement des messages d'un même client n'est pas garanti, et sans détection des doublons une commande renvoyée est remise deux fois, quel que soit son ID de message. Le niveau Standard est le plus bas qui offre ces deux fonctionnalités.
references:
  - title: Message sessions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-sessions
  - title: Duplicate detection in Azure Service Bus
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/duplicate-detection
