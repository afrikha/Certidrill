id: az305-4c-data-transfer-table
objective: "4.3.5"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders evaluates the options in the following table to transfer data from two remote sites to Azure Blob Storage. Each site has a 10-Mbps internet link.

    Answer each prompt by selecting the option that you should recommend.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders étudie les options du tableau suivant pour transférer des données de deux sites distants vers le Stockage Blob Azure. Chaque site dispose d'une liaison Internet de 10 Mbit/s.

    Répondez à chaque consigne en sélectionnant l'option que vous devez recommander.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Site 1: a one-time import of 28 TB, at the lowest cost, with storage media supplied by Microsoft", fr: "Site 1 : une importation ponctuelle de 28 To, au moindre coût, avec des supports de stockage fournis par Microsoft" }
    - id: p2
      text: { en: "Site 2: a one-time import of 6 TB, by reusing the disk drives that the site already owns", fr: "Site 2 : une importation ponctuelle de 6 To, en réutilisant les disques que le site possède déjà" }
  grid:
    header: [{ en: "Option", fr: "Option" }, { en: "Transfer type", fr: "Type de transfert" }]
    rows:
      - [{ text: "Azure Data Box", area: box }, { text: { en: "Offline", fr: "Hors connexion" } }]
      - [{ text: "Azure Data Box Disk", area: disk }, { text: { en: "Offline", fr: "Hors connexion" } }]
      - [{ text: { en: "Azure Import/Export service", fr: "Service Azure Import/Export" }, area: ie }, { text: { en: "Offline", fr: "Hors connexion" } }]
      - [{ text: "AzCopy", area: azcopy }, { text: { en: "Online", fr: "En ligne" } }]
      - [{ text: "Azure Storage Mover", area: mover }, { text: { en: "Online", fr: "En ligne" } }]
answer:
  values: { p1: disk, p2: ie }
explanation:
  correct:
    en: |
      At 10 Mbps, even 6 TB would take close to two months, so both sites need an offline transfer. For 28 TB, a Data Box Disk order (up to five encrypted 8-TB SSDs, about 35 TB usable) is the smallest and cheapest device that Microsoft ships; a Data Box would be oversized. The Azure Import/Export service is the option in which the customer prepares and ships its own drives to an Azure datacenter.
    fr: |
      À 10 Mbit/s, même 6 To prendraient près de deux mois : les deux sites ont besoin d'un transfert hors connexion. Pour 28 To, une commande Data Box Disk (jusqu'à cinq SSD chiffrés de 8 To, environ 35 To utilisables) est l'appareil le plus petit et le moins cher que Microsoft expédie ; un Data Box serait surdimensionné. Le service Azure Import/Export est l'option dans laquelle le client prépare et expédie ses propres disques vers un centre de données Azure.
references:
  - title: What is Azure Data Box Disk?
    url: https://learn.microsoft.com/en-us/azure/databox/data-box-disk-overview
  - title: What is Azure Import/Export service?
    url: https://learn.microsoft.com/en-us/azure/import-export/storage-import-export-service
