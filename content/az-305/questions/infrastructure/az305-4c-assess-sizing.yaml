id: az305-4c-assess-sizing
objective: "4.3.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso plans to migrate 900 VMware virtual machines to Azure virtual machines. An Azure Migrate appliance has been collecting performance data for two months.

    Most virtual machines use less than 20 percent of their allocated CPU and memory, except during a month-end closing that lasts three days.

    You need to recommend the settings of the Azure VM assessment. The solution must meet the following requirements:

    - The recommended sizes must reflect the actual resource utilization, to minimize Azure costs.
    - The utilization data used for sizing must include a month-end closing.
    - The recommended sizes must include 30 percent of extra capacity for the expected growth.

    Which settings should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit de migrer 900 machines virtuelles VMware vers des machines virtuelles Azure. Une appliance Azure Migrate collecte des données de performances depuis deux mois.

    La plupart des machines virtuelles utilisent moins de 20 % du processeur et de la mémoire qui leur sont alloués, sauf pendant une clôture de fin de mois qui dure trois jours.

    Vous devez recommander les paramètres de l'évaluation de machines virtuelles Azure. La solution doit répondre aux exigences suivantes :

    - Les tailles recommandées doivent refléter l'utilisation réelle des ressources, afin de réduire les coûts Azure.
    - Les données d'utilisation servant au dimensionnement doivent inclure une clôture de fin de mois.
    - Les tailles recommandées doivent inclure 30 % de capacité supplémentaire pour la croissance prévue.

    Quels paramètres devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Sizing criterion: [[sizing]]

      Performance history: [[history]]

      Comfort factor: [[comfort]]
    fr: |
      Critère de dimensionnement : [[sizing]]

      Historique des performances : [[history]]

      Facteur de confort : [[comfort]]
  slots:
    - id: sizing
      options:
        - { id: onprem, text: { en: "As on-premises", fr: "En l'état local (As on-premises)" } }
        - { id: perf, text: { en: "Performance-based", fr: "Basé sur les performances (Performance-based)" } }
    - id: history
      options:
        - { id: day, text: { en: "1 day", fr: "1 jour" } }
        - { id: week, text: { en: "1 week", fr: "1 semaine" } }
        - { id: month, text: { en: "1 month", fr: "1 mois" } }
    - id: comfort
      options:
        - { id: c07, text: "0.7" }
        - { id: c10, text: "1.0" }
        - { id: c13, text: "1.3" }
        - { id: c30, text: "3.0" }
answer:
  values: { sizing: perf, history: month, comfort: c13 }
explanation:
  correct:
    en: |
      Performance-based sizing computes the target size from the CPU, memory and disk utilization that the appliance collected, so underused servers are not migrated with their over-provisioning. A performance history of one month is the only duration that contains a month-end closing. The comfort factor multiplies the measured utilization: 1.3 adds a 30 percent buffer.
    fr: |
      Le dimensionnement basé sur les performances calcule la taille cible d'après l'utilisation du processeur, de la mémoire et des disques collectée par l'appliance : les serveurs sous-utilisés ne sont pas migrés avec leur surprovisionnement. Un historique des performances d'un mois est la seule durée qui contient une clôture de fin de mois. Le facteur de confort multiplie l'utilisation mesurée : 1,3 ajoute une marge de 30 %.
  options:
    onprem:
      en: As on-premises sizing keeps the current allocation and ignores the utilization data.
      fr: Le dimensionnement en l'état local conserve l'allocation actuelle et ignore les données d'utilisation.
    week:
      en: One week of data is unlikely to contain the three days of the month-end closing.
      fr: Une semaine de données a peu de chances de contenir les trois jours de la clôture de fin de mois.
    c30:
      en: A comfort factor of 3.0 triples the measured utilization instead of adding 30 percent.
      fr: Un facteur de confort de 3,0 triple l'utilisation mesurée au lieu d'ajouter 30 %.
    c07:
      en: A comfort factor below 1.0 would size the target under the measured utilization.
      fr: Un facteur de confort inférieur à 1,0 dimensionnerait la cible en dessous de l'utilisation mesurée.
references:
  - title: Assessment overview (migrate to Azure VMs)
    url: https://learn.microsoft.com/en-us/azure/migrate/concepts-assessment-calculation?view=migrate-classic
