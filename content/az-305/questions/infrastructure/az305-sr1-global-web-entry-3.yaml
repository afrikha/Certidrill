stem:
  en: You recommend Traffic Manager in front of an Application Gateway WAF_v2 in each region.
  fr: Vous recommandez Traffic Manager devant une instance Application Gateway WAF_v2 dans chaque région.
body:
  solution:
    en: |
      You recommend deploying in each region an **Application Gateway** of the WAF_v2 SKU, with a WAF policy that uses a managed rule set, as the only public entry point of the scale set. An **Azure Traffic Manager** profile uses the Performance routing method with the public IP addresses of the two application gateways as endpoints.
    fr: |
      Vous recommandez de déployer dans chaque région une instance **Application Gateway** de référence SKU WAF_v2, avec une stratégie WAF qui utilise un ensemble de règles managé, comme seul point d'entrée public du groupe de machines virtuelles identiques. Un profil **Azure Traffic Manager** utilise la méthode de routage Performance avec les adresses IP publiques des deux passerelles d'application comme points de terminaison.
answer: { value: true }
explanation:
  correct:
    en: |
      Traffic Manager does not inspect traffic, but here it only chooses the region: Performance routing returns the endpoint with the lowest latency for each user and leaves out an endpoint that fails its health checks. The user then connects to the application gateway of that region, where the WAF inspects every request before it reaches the scale set. Failover is slower than with Azure Front Door because of DNS caching, but the goal sets no failover time, so all three requirements are met.
    fr: |
      Traffic Manager n'inspecte pas le trafic, mais il ne fait ici que choisir la région : le routage Performance renvoie à chaque utilisateur le point de terminaison à la latence la plus faible et écarte un point de terminaison dont les contrôles d'intégrité échouent. L'utilisateur se connecte ensuite à la passerelle d'application de cette région, où le WAF inspecte chaque requête avant qu'elle n'atteigne le groupe de machines virtuelles identiques. Le basculement est plus lent qu'avec Azure Front Door à cause de la mise en cache DNS, mais l'objectif ne fixe aucun délai de basculement : les trois exigences sont donc respectées.
