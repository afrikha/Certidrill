id: az305-4b-cfg-central-store
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs 15 microservices on Azure Kubernetes Service (AKS) and Azure App Service. Each microservice keeps its settings in its own configuration files, so a change requires a new deployment of every microservice. The settings contain no secrets.

    You need to recommend a solution that meets the following requirements:

    - The settings shared by the microservices must be managed in one place.
    - A change must reach the running microservices without a redeployment.
    - The value that a setting had at an earlier date must be retrievable.

    What should you recommend?
  fr: |
    Contoso exécute 15 microservices sur Azure Kubernetes Service (AKS) et Azure App Service. Chaque microservice conserve ses paramètres dans ses propres fichiers de configuration : une modification impose un nouveau déploiement de chaque microservice. Les paramètres ne contiennent aucun secret.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Les paramètres partagés par les microservices doivent être gérés à un seul endroit.
    - Une modification doit atteindre les microservices en cours d'exécution sans redéploiement.
    - La valeur qu'avait un paramètre à une date antérieure doit pouvoir être retrouvée.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: Azure Key Vault }
    - { id: b, text: { en: "Azure Blob Storage", fr: "Stockage Blob Azure" } }
    - { id: c, text: { en: "App Service app settings", fr: "Les paramètres d'application App Service" } }
    - { id: d, text: Azure App Configuration }
answer: { optionId: d }
explanation:
  correct:
    en: "App Configuration is the service that centralizes application settings and feature flags for several applications. Applications can refresh their settings dynamically, without a redeployment or a restart, and the point-in-time replay shows the values at an earlier date."
    fr: "App Configuration est le service qui centralise les paramètres d'application et les indicateurs de fonctionnalités de plusieurs applications. Les applications peuvent actualiser leurs paramètres dynamiquement, sans redéploiement ni redémarrage, et la relecture à un instant donné montre les valeurs à une date antérieure."
  options:
    a:
      en: "Key Vault is designed for secrets, keys and certificates; it complements App Configuration but is not a store for general application settings."
      fr: "Key Vault est conçu pour les secrets, les clés et les certificats ; il complète App Configuration mais n'est pas un magasin de paramètres d'application généraux."
    c:
      en: "App settings belong to one App Service app; they are not shared with the AKS microservices, and changing them restarts the app."
      fr: "Les paramètres d'application appartiennent à une seule application App Service ; ils ne sont pas partagés avec les microservices AKS, et leur modification redémarre l'application."
    b:
      en: "A file in a blob container is central, but the dynamic refresh, the history of each setting and the management interface would all have to be developed."
      fr: "Un fichier dans un conteneur d'objets blob est centralisé, mais l'actualisation dynamique, l'historique de chaque paramètre et l'interface de gestion seraient entièrement à développer."
references:
  - title: What is Azure App Configuration?
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/overview
