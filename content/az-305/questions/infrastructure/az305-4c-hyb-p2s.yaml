id: az305-4c-hyb-p2s
objective: "4.4.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware has 400 employees who work from home on company laptops. They must reach applications that are only available on private IP addresses in Azure virtual networks.

    You need to recommend a connectivity solution. The solution must meet the following requirements:

    - Users must sign in with their Microsoft Entra ID accounts, and a Conditional Access policy must require multifactor authentication.
    - No network equipment can be installed in the employees' homes.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware compte 400 employés qui travaillent à domicile sur des ordinateurs portables de l'entreprise. Ils doivent atteindre des applications disponibles uniquement sur des adresses IP privées dans des réseaux virtuels Azure.

    Vous devez recommander une solution de connectivité. La solution doit répondre aux exigences suivantes :

    - Les utilisateurs doivent se connecter avec leurs comptes Microsoft Entra ID, et une stratégie d'accès conditionnel doit exiger l'authentification multifacteur.
    - Aucun équipement réseau ne peut être installé au domicile des employés.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Connection type: [[conn]]

      Tunnel type: [[tunnel]]
    fr: |
      Type de connexion : [[conn]]

      Type de tunnel : [[tunnel]]
  slots:
    - id: conn
      options:
        - { id: s2s, text: { en: "Site-to-site VPN", fr: "VPN de site à site" } }
        - { id: p2s, text: { en: "Point-to-site VPN", fr: "VPN de point à site" } }
        - { id: er, text: "ExpressRoute" }
        - { id: gr, text: "ExpressRoute Global Reach" }
    - id: tunnel
      options:
        - { id: ikev2, text: "IKEv2" }
        - { id: sstp, text: "SSTP" }
        - { id: ovpn, text: "OpenVPN" }
answer:
  values: { conn: p2s, tunnel: ovpn }
explanation:
  correct:
    en: |
      A point-to-site VPN connects individual computers to a virtual network through a VPN client, with no equipment on the user's side. Microsoft Entra ID authentication, which makes Conditional Access and multifactor authentication applicable to the VPN, is only supported with the OpenVPN tunnel type.
    fr: |
      Un VPN de point à site connecte des ordinateurs individuels à un réseau virtuel au moyen d'un client VPN, sans équipement du côté de l'utilisateur. L'authentification Microsoft Entra ID, qui rend l'accès conditionnel et l'authentification multifacteur applicables au VPN, n'est prise en charge qu'avec le type de tunnel OpenVPN.
  options:
    s2s:
      en: A site-to-site VPN needs a VPN device at each location, which can't be installed in the employees' homes.
      fr: Un VPN de site à site exige un périphérique VPN sur chaque site, qui ne peut pas être installé au domicile des employés.
    er:
      en: ExpressRoute connects a site through a connectivity provider; it isn't a solution for individual remote users.
      fr: ExpressRoute relie un site par un fournisseur de connectivité ; ce n'est pas une solution pour des utilisateurs distants individuels.
    ikev2:
      en: IKEv2 point-to-site connections authenticate with certificates or RADIUS, not directly with Microsoft Entra ID.
      fr: Les connexions de point à site IKEv2 s'authentifient par certificats ou par RADIUS, pas directement avec Microsoft Entra ID.
    sstp:
      en: SSTP doesn't support Microsoft Entra ID authentication.
      fr: SSTP ne prend pas en charge l'authentification Microsoft Entra ID.
references:
  - title: About Point-to-Site VPN
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about
