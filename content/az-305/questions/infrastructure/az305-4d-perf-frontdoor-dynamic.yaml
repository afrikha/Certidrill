id: az305-4d-perf-frontdoor-dynamic
objective: "4.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation hosts a customer portal on Azure App Service in the Australia East region. The portal serves personalized HTTPS pages and API responses that can't be cached. A regulation requires the application and its data to stay in Australia East.

    Users in Europe and North America report slow page loads. An analysis shows that most of the delay comes from TCP and TLS handshakes over long-distance internet paths.

    You need to recommend a solution. The solution must meet the following requirements:

    - Improve the response times for distant users.
    - Don't deploy the application in another region.
    - Minimize administrative effort.

    What should you recommend?
  fr: |
    Adatum Corporation héberge un portail client sur Azure App Service dans la région Australia East. Le portail sert des pages HTTPS personnalisées et des réponses d'API qui ne peuvent pas être mises en cache. Une réglementation impose que l'application et ses données restent dans Australia East.

    Les utilisateurs d'Europe et d'Amérique du Nord signalent des chargements de pages lents. Une analyse montre que l'essentiel du délai provient des négociations TCP et TLS sur des chemins Internet longue distance.

    Vous devez recommander une solution. La solution doit répondre aux exigences suivantes :

    - Améliorer les temps de réponse pour les utilisateurs éloignés.
    - Ne pas déployer l'application dans une autre région.
    - Réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Traffic Manager profile that uses the Performance routing method", fr: "Un profil Traffic Manager qui utilise la méthode de routage Performance" } }
    - { id: b, text: { en: "An Application Gateway v2 deployment in Australia East with autoscaling", fr: "Un déploiement Application Gateway v2 dans Australia East avec mise à l'échelle automatique" } }
    - { id: c, text: { en: "An ExpressRoute circuit with Microsoft peering in Australia", fr: "Un circuit ExpressRoute avec peering Microsoft en Australie" } }
    - { id: d, text: { en: "An Azure Front Door Standard profile with the web app as its origin", fr: "Un profil Azure Front Door Standard avec l'application web comme origine" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure Front Door accepts the user's connection at the nearest edge location, so the TCP and TLS handshakes happen over a short distance. It then uses split TCP and the Microsoft private WAN to reach the single origin in Australia East, which accelerates dynamic content that isn't cached. It is a managed service and doesn't require a second deployment of the application.
    fr: |
      Azure Front Door accepte la connexion de l'utilisateur à l'emplacement de périphérie le plus proche : les négociations TCP et TLS se font sur une courte distance. Il utilise ensuite le split TCP et le WAN privé de Microsoft pour atteindre l'origine unique dans Australia East, ce qui accélère le contenu dynamique non mis en cache. C'est un service managé qui ne demande pas de second déploiement de l'application.
  options:
    a:
      en: |
        Traffic Manager only chooses between endpoints by DNS; with a single region there is nothing to choose, and clients still connect directly to Australia East.
      fr: |
        Traffic Manager ne fait que choisir entre des points de terminaison par DNS ; avec une seule région il n'y a rien à choisir, et les clients se connectent toujours directement à Australia East.
    b:
      en: |
        Application Gateway is a regional service in Australia East; distant users still perform their handshakes across the long internet path.
      fr: |
        Application Gateway est un service régional dans Australia East ; les utilisateurs éloignés effectuent toujours leurs négociations sur le long chemin Internet.
    c:
      en: |
        ExpressRoute connects private networks of an organization to Microsoft; it doesn't help internet users in other continents.
      fr: |
        ExpressRoute relie les réseaux privés d'une organisation à Microsoft ; il n'aide pas les utilisateurs Internet d'autres continents.
references:
  - title: What is Azure Front Door?
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-overview
