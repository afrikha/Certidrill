id: az305-4d-lb-match
objective: "4.4.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation is designing the load balancing of four workloads.

    Which service should you recommend for each workload? To answer, drag the appropriate services to the correct workloads. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation conçoit l'équilibrage de charge de quatre charges de travail.

    Quel service devez-vous recommander pour chaque charge de travail ? Pour répondre, faites glisser les services appropriés vers les charges de travail correspondantes. Chaque service peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: afd, text: "Azure Front Door" }
    - { id: appgw, text: "Azure Application Gateway" }
    - { id: lb, text: "Azure Load Balancer" }
    - { id: tm, text: "Azure Traffic Manager" }
    - { id: agc, text: { en: "Application Gateway for Containers", fr: "Application Gateway pour conteneurs" } }
  targets:
    - id: t1
      text: { en: "A public website deployed in three regions that needs TLS offload and caching at the edge", fr: "Un site web public déployé dans trois régions qui a besoin du déchargement TLS et de la mise en cache en périphérie" }
    - id: t2
      text: { en: "A web application on virtual machines in one region that needs URL path-based routing, cookie-based affinity and a WAF", fr: "Une application web sur des machines virtuelles dans une région qui a besoin du routage basé sur le chemin d'URL, de l'affinité basée sur les cookies et d'un WAF" }
    - id: t3
      text: { en: "An internal TCP service on virtual machines in one virtual network, reached by other servers through a private IP address", fr: "Un service TCP interne sur des machines virtuelles dans un réseau virtuel, atteint par d'autres serveurs par une adresse IP privée" }
    - id: t4
      text: { en: "An SMTP relay that runs in an on-premises datacenter and in an Azure region, with clients directed to either site by DNS", fr: "Un relais SMTP qui s'exécute dans un centre de données local et dans une région Azure, les clients étant dirigés vers l'un ou l'autre site par DNS" }
answer:
  mapping: { t1: afd, t2: appgw, t3: lb, t4: tm }
explanation:
  correct:
    en: |
      Azure Front Door is the global layer 7 service with TLS offload and caching at the edge. Application Gateway is the regional layer 7 load balancer with URL path-based routing, session affinity and a WAF. Azure Load Balancer distributes TCP and UDP flows at layer 4, including behind an internal frontend IP address. Traffic Manager directs clients by DNS to Azure or external endpoints, such as an on-premises site, for any non-HTTP protocol. Application Gateway for Containers is for workloads in Kubernetes clusters.
    fr: |
      Azure Front Door est le service mondial de couche 7 avec déchargement TLS et mise en cache en périphérie. Application Gateway est l'équilibreur de charge régional de couche 7 avec routage basé sur le chemin d'URL, affinité de session et WAF. Azure Load Balancer répartit les flux TCP et UDP en couche 4, y compris derrière une adresse IP frontale interne. Traffic Manager dirige les clients par DNS vers des points de terminaison Azure ou externes, comme un site local, pour des protocoles autres que HTTP. Application Gateway pour conteneurs est destiné aux charges de travail dans des clusters Kubernetes.
references:
  - title: Load balancing options
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/load-balancing-overview
