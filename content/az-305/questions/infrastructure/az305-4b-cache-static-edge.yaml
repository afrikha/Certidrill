id: az305-4b-cache-static-edge
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam publishes a catalog website for customers on four continents. The product images, style sheets and scripts are stored in an Azure Blob Storage account in West Europe and rarely change.

    You need to recommend a solution that meets the following requirements:

    - Reduce the download time of these files for customers of every continent.
    - Reduce the number of requests that reach the storage account.

    What should you recommend?
  fr: |
    Fabrikam publie un site web de catalogue pour des clients répartis sur quatre continents. Les images de produits, les feuilles de style et les scripts sont stockés dans un compte Stockage Blob Azure situé dans la région West Europe et changent rarement.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Réduire le temps de téléchargement de ces fichiers pour les clients de chaque continent.
    - Réduire le nombre de requêtes qui atteignent le compte de stockage.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Front Door with caching enabled on the route", fr: "Azure Front Door avec la mise en cache activée sur la route" } }
    - { id: b, text: { en: "Azure Managed Redis with the cache-aside pattern", fr: "Azure Managed Redis avec le modèle cache-aside" } }
    - { id: c, text: { en: "Azure Traffic Manager with the performance routing method", fr: "Azure Traffic Manager avec la méthode de routage Performance" } }
    - { id: d, text: { en: "Azure API Management with a response caching policy", fr: "Azure API Management avec une stratégie de mise en cache des réponses" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Front Door caches the responses to GET requests in its edge locations around the world. Customers download the static files from a location close to them, and the storage account is contacted only when a cached file is missing or has expired."
    fr: "Front Door met en cache les réponses aux requêtes GET dans ses emplacements de périphérie à travers le monde. Les clients téléchargent les fichiers statiques depuis un emplacement proche, et le compte de stockage n'est sollicité que lorsqu'un fichier mis en cache est absent ou a expiré."
  options:
    b:
      en: "A Redis cache is read by application code in its own region; browsers do not download files from it."
      fr: "Un cache Redis est lu par le code de l'application dans sa propre région ; les navigateurs n'y téléchargent pas de fichiers."
    c:
      en: "Traffic Manager only answers DNS queries to pick an endpoint; it caches nothing, and there is a single origin here."
      fr: "Traffic Manager répond seulement à des requêtes DNS pour choisir un point de terminaison ; il ne met rien en cache, et il n'y a ici qu'une seule origine."
    d:
      en: "The built-in cache of API Management lives in the region of the gateway; it does not bring files closer to customers of other continents."
      fr: "Le cache intégré d'API Management se trouve dans la région de la passerelle ; il ne rapproche pas les fichiers des clients des autres continents."
references:
  - title: Caching with Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-caching
