id: az305-4d-lb-gateway-lb
objective: "4.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam publishes an e-commerce application through a Standard public load balancer in a virtual network named VNet-Shop, in a subscription named Sub-Shop. The security team operates a cluster of third-party firewall NVAs in a virtual network named VNet-Sec, in a subscription named Sub-Sec.

    You need to recommend a solution to inspect the traffic of the application. The solution must meet the following requirements:

    - All the traffic to and from the frontend of the public load balancer must pass through the third-party NVAs before it reaches the application.
    - The request and the response of a flow must go through the same NVA instance.
    - No user-defined routes must be maintained in VNet-Shop.
    - The application servers must see the original client IP addresses.

    What should you recommend?
  fr: |
    Fabrikam publie une application d'e-commerce par un équilibreur de charge public Standard dans un réseau virtuel nommé VNet-Shop, dans un abonnement nommé Sub-Shop. L'équipe de sécurité exploite un cluster de NVA de pare-feu tierces dans un réseau virtuel nommé VNet-Sec, dans un abonnement nommé Sub-Sec.

    Vous devez recommander une solution pour inspecter le trafic de l'application. La solution doit répondre aux exigences suivantes :

    - Tout le trafic à destination et en provenance du front-end de l'équilibreur de charge public doit passer par les NVA tierces avant d'atteindre l'application.
    - La requête et la réponse d'un flux doivent passer par la même instance de NVA.
    - Aucun itinéraire défini par l'utilisateur ne doit être maintenu dans VNet-Shop.
    - Les serveurs d'application doivent voir les adresses IP d'origine des clients.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An internal Standard load balancer with HA ports in front of the NVAs, and peering between VNet-Shop and VNet-Sec", fr: "Un équilibreur de charge Standard interne avec des ports HA devant les NVA, et un peering entre VNet-Shop et VNet-Sec" } }
    - { id: b, text: { en: "Azure Firewall Premium in VNet-Shop with DNAT rules to the application servers", fr: "Le Pare-feu Azure Premium dans VNet-Shop avec des règles DNAT vers les serveurs d'application" } }
    - { id: c, text: { en: "A global tier Azure Load Balancer in Sub-Sec with the public load balancer in its backend pool", fr: "Un Azure Load Balancer de niveau global dans Sub-Sec avec l'équilibreur de charge public dans son pool principal" } }
    - { id: d, text: { en: "A Gateway Load Balancer in VNet-Sec with the NVAs in its backend pool, chained to the frontend of the public load balancer", fr: "Un équilibreur de charge de passerelle dans VNet-Sec avec les NVA dans son pool principal, chaîné au front-end de l'équilibreur de charge public" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Gateway Load Balancer inserts NVAs transparently ("bump in the wire") in the path of a Standard public load balancer frontend: once it is chained, the traffic to and from the endpoint goes through the appliances without user-defined routes. It keeps flow stickiness to one backend instance in both directions and preserves the packets, so the servers see the client IP address. The consumer and provider virtual networks can be in different subscriptions or tenants.
    fr: |
      L'équilibreur de charge de passerelle insère des NVA de façon transparente (« bump in the wire ») dans le chemin du front-end d'un équilibreur de charge public Standard : une fois chaîné, le trafic vers et depuis le point de terminaison passe par les appliances sans itinéraire défini par l'utilisateur. Il maintient l'affinité de flux avec une instance du pool principal dans les deux sens et conserve les paquets : les serveurs voient l'adresse IP du client. Les réseaux virtuels consommateur et fournisseur peuvent se trouver dans des abonnements ou des locataires différents.
  options:
    a:
      en: |
        An HA ports design needs user-defined routes in VNet-Shop, and flow symmetry isn't supported when NVAs sit between a public and an internal load balancer.
      fr: |
        Une conception avec ports HA exige des itinéraires définis par l'utilisateur dans VNet-Shop, et la symétrie des flux n'est pas prise en charge quand des NVA se trouvent entre un équilibreur de charge public et un équilibreur de charge interne.
    b:
      en: |
        Azure Firewall replaces the third-party NVAs that the security team must use, and it is deployed in the application network instead of being inserted transparently.
      fr: |
        Le Pare-feu Azure remplace les NVA tierces que l'équipe de sécurité doit utiliser, et il est déployé dans le réseau de l'application au lieu d'être inséré de façon transparente.
    c:
      en: |
        The global tier distributes traffic between regional load balancers; it doesn't send traffic through NVAs.
      fr: |
        Le niveau global répartit le trafic entre des équilibreurs de charge régionaux ; il ne fait pas passer le trafic par des NVA.
references:
  - title: Gateway load balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/gateway-overview
  - title: High availability ports overview in Azure
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-ha-ports-overview
