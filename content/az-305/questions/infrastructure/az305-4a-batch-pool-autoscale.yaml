id: az305-4a-batch-pool-autoscale
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Azure Batch for genome sequence analysis. Researchers submit jobs at irregular times. Between jobs, the pool keeps 200 dedicated nodes that are idle but still billed.

    You need to recommend a change that minimizes the compute cost. Jobs must still start without any manual action, and the way researchers submit jobs must not change.

    What should you recommend?
  fr: |
    Fabrikam utilise Azure Batch pour l'analyse de séquences génomiques. Les chercheurs soumettent des travaux à des moments irréguliers. Entre les travaux, le pool conserve 200 nœuds dédiés, inactifs mais toujours facturés.

    Vous devez recommander une modification qui réduit au minimum le coût de calcul. Les travaux doivent toujours démarrer sans action manuelle, et la façon dont les chercheurs soumettent les travaux ne doit pas changer.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Enable automatic scaling on the pool, based on the number of pending tasks.", fr: "Activer la mise à l'échelle automatique du pool, selon le nombre de tâches en attente." } }
    - { id: b, text: { en: "Replace the pool with an Azure CycleCloud cluster that uses Slurm.", fr: "Remplacer le pool par un cluster Azure CycleCloud qui utilise Slurm." } }
    - { id: c, text: { en: "Increase the number of task slots per node in the pool.", fr: "Augmenter le nombre d'emplacements de tâches par nœud dans le pool." } }
    - { id: d, text: { en: "Enable inter-node communication on the pool.", fr: "Activer la communication entre nœuds dans le pool." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Batch pool can scale automatically: the number of nodes follows the workload, so the pool shrinks when no task is waiting and grows again when researchers submit jobs. Batch itself is free, so removing idle virtual machines removes the cost, and job submission stays the same.
    fr: |
      Un pool Batch peut être mis à l'échelle automatiquement : le nombre de nœuds suit la charge, le pool se réduit donc quand aucune tâche n'attend et grandit à nouveau lorsque les chercheurs soumettent des travaux. Batch lui-même est gratuit : supprimer les machines virtuelles inactives supprime le coût, et la soumission des travaux reste identique.
  options:
    b:
      en: CycleCloud with Slurm changes the scheduler and the way jobs are submitted, and adds a cluster to manage.
      fr: CycleCloud avec Slurm change le planificateur et la façon de soumettre les travaux, et ajoute un cluster à gérer.
    c:
      en: More task slots per node run more tasks in parallel on each node, but the 200 nodes stay allocated and billed between jobs.
      fr: Davantage d'emplacements de tâches par nœud exécutent plus de tâches en parallèle sur chaque nœud, mais les 200 nœuds restent alloués et facturés entre les travaux.
    d:
      en: Inter-node communication lets tasks on different nodes talk to each other, for MPI workloads; it has no effect on idle cost.
      fr: La communication entre nœuds permet aux tâches de nœuds différents de se parler, pour les charges MPI ; elle n'a aucun effet sur le coût d'inactivité.
references:
  - title: What is Azure Batch?
    url: https://learn.microsoft.com/en-us/azure/batch/batch-technical-overview
