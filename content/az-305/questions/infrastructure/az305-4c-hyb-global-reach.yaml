id: az305-4c-hyb-global-reach
objective: "4.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has datacenters in London and Singapore. Each datacenter is connected to Azure through its own ExpressRoute circuit.

    The two datacenters replicate data to each other over a leased WAN link. Litware wants to remove that link and send the traffic between the two datacenters over the Microsoft network, through the existing circuits.

    What should you recommend?
  fr: |
    Litware possède des centres de données à Londres et à Singapour. Chaque centre de données est connecté à Azure par son propre circuit ExpressRoute.

    Les deux centres de données répliquent des données l'un vers l'autre par une liaison WAN louée. Litware veut supprimer cette liaison et faire passer le trafic entre les deux centres de données par le réseau Microsoft, à travers les circuits existants.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: "ExpressRoute FastPath" }
    - { id: b, text: { en: "Global virtual network peering", fr: "Le peering mondial de réseaux virtuels" } }
    - { id: c, text: { en: "ExpressRoute Microsoft peering", fr: "Le peering Microsoft d'ExpressRoute" } }
    - { id: d, text: "ExpressRoute Global Reach" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      ExpressRoute Global Reach links two ExpressRoute circuits together so that the on-premises networks connected to them exchange traffic directly over the Microsoft global network. It replaces a WAN link between sites without routing the traffic through a virtual network. Because London and Singapore are in different geopolitical regions, both circuits must use the Premium SKU.
    fr: |
      ExpressRoute Global Reach relie deux circuits ExpressRoute entre eux afin que les réseaux locaux qui y sont connectés échangent du trafic directement par le réseau mondial de Microsoft. Il remplace une liaison WAN entre sites sans faire passer le trafic par un réseau virtuel. Londres et Singapour se trouvant dans des régions géopolitiques différentes, les deux circuits doivent utiliser la référence SKU Premium.
  options:
    a:
      en: FastPath improves the data path between the on-premises network and virtual machines by bypassing the gateway; it doesn't connect two sites.
      fr: FastPath améliore le chemin de données entre le réseau local et les machines virtuelles en contournant la passerelle ; il ne relie pas deux sites.
    b:
      en: Global peering connects Azure virtual networks of different regions, not on-premises networks.
      fr: Le peering mondial relie des réseaux virtuels Azure de régions différentes, pas des réseaux locaux.
    c:
      en: Microsoft peering reaches the public endpoints of Microsoft services such as Microsoft 365; it doesn't carry traffic between two datacenters.
      fr: Le peering Microsoft atteint les points de terminaison publics de services Microsoft comme Microsoft 365 ; il ne transporte pas de trafic entre deux centres de données.
references:
  - title: About ExpressRoute Global Reach
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-global-reach
