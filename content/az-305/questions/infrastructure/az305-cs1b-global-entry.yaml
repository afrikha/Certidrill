id: az305-cs1b-global-entry
objective: "4.4.5"
type: single
caseStudy: az305-cs1b-blue-yonder
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a solution that distributes the requests of the customers between the two regions of app-booking. The solution must meet the requirements of the booking website.

    What should you recommend?
  fr: |
    Vous devez recommander une solution qui répartit les requêtes des clients entre les deux régions d'app-booking. La solution doit répondre aux exigences du site web de réservation.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Traffic Manager with the Performance routing method", fr: "Azure Traffic Manager avec la méthode de routage Performance" } }
    - { id: b, text: { en: "Azure Application Gateway v2 with a WAF policy in each region", fr: "Azure Application Gateway v2 avec une stratégie WAF dans chaque région" } }
    - { id: c, text: { en: "Azure Load Balancer in the Global tier", fr: "Azure Load Balancer au niveau Global" } }
    - { id: d, text: { en: "Azure Front Door with a WAF policy", fr: "Azure Front Door avec une stratégie WAF" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure Front Door is a global layer-7 service that runs at the edge of the Microsoft network: it terminates TLS there, applies its web application firewall policy before the traffic reaches a region, and sends each request to the healthy origin that has the lowest latency. A single service covers the three requirements.
    fr: |
      Azure Front Door est un service mondial de couche 7 qui s'exécute à la périphérie du réseau Microsoft : il y termine les connexions TLS, applique sa stratégie de pare-feu d'applications web avant que le trafic n'atteigne une région, et envoie chaque requête vers l'origine saine dont la latence est la plus faible. Un seul service couvre les trois exigences.
  options:
    a:
      en: Traffic Manager only answers DNS queries; the client then connects directly to a region, so nothing terminates TLS or filters attacks at the edge.
      fr: Traffic Manager ne fait que répondre à des requêtes DNS ; le client se connecte ensuite directement à une région, si bien que rien ne termine TLS ni ne filtre les attaques à la périphérie.
    b:
      en: Application Gateway is a regional service; the gateways filter attacks inside each region and can't choose between the regions without another global service.
      fr: Application Gateway est un service régional ; les passerelles filtrent les attaques à l'intérieur de chaque région et ne peuvent pas choisir entre les régions sans un autre service mondial.
    c:
      en: A global load balancer works at layer 4; it doesn't terminate TLS and has no web application firewall.
      fr: Un équilibreur de charge mondial fonctionne en couche 4 ; il ne termine pas TLS et n'a pas de pare-feu d'applications web.
references:
  - title: Load balancing options
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/load-balancing-overview
