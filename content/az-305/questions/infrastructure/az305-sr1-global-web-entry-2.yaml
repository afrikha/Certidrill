stem:
  en: You recommend Azure Front Door Premium with a WAF policy.
  fr: Vous recommandez Azure Front Door Premium avec une stratégie WAF.
body:
  solution:
    en: |
      You recommend an **Azure Front Door Premium** profile whose origin group contains the public endpoint of App1 in each region, with the same priority and the same weight. A **WAF policy** that uses a Microsoft-managed rule set is associated with the Front Door endpoint, and the scale sets accept traffic only from Azure Front Door.
    fr: |
      Vous recommandez un profil **Azure Front Door Premium** dont le groupe d'origines contient le point de terminaison public d'App1 dans chaque région, avec la même priorité et le même poids. Une **stratégie WAF** qui utilise un ensemble de règles géré par Microsoft est associée au point de terminaison Front Door, et les groupes de machines virtuelles identiques n'acceptent que le trafic provenant d'Azure Front Door.
answer: { value: true }
explanation:
  correct:
    en: |
      Azure Front Door is a global layer 7 entry point: among healthy origins of equal priority, it sends each request to the one with the lowest latency, and its health probes take a failed region out of rotation quickly. Requests are inspected at the Microsoft edge by the WAF policy before they are forwarded, and the Premium tier is the one that includes Microsoft-managed rule sets.
    fr: |
      Azure Front Door est un point d'entrée global de couche 7 : parmi les origines saines de même priorité, il envoie chaque requête vers celle dont la latence est la plus faible, et ses sondes d'intégrité retirent rapidement de la rotation une région défaillante. Les requêtes sont inspectées par la stratégie WAF à la périphérie du réseau Microsoft avant d'être transmises, et le niveau Premium est celui qui inclut les ensembles de règles gérés par Microsoft.
