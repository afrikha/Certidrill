id: az305-4b-cache-redis-tiers
objective: "4.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware plans three Azure Managed Redis instances for three workloads.

    You need to recommend a tier for each instance. Each tier must fit the profile of the workload at the lowest cost.

    Which tier should you recommend for each workload? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit trois instances Azure Managed Redis pour trois charges de travail.

    Vous devez recommander un niveau pour chaque instance. Chaque niveau doit correspondre au profil de la charge de travail pour le coût le plus faible.

    Quel niveau devez-vous recommander pour chaque charge de travail ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Recommendation engine (1.5 TB of data, most of it rarely read; slower access to rarely read keys is accepted): [[w1]]

      Bidding engine (40 GB of data, the highest possible throughput): [[w2]]

      User profiles (200 GB of data, low throughput, few vCPUs needed, active geo-replication between two regions): [[w3]]
    fr: |
      Moteur de recommandation (1,5 To de données, pour la plupart rarement lues ; un accès plus lent aux clés rarement lues est accepté) : [[w1]]

      Moteur d'enchères (40 Go de données, le débit le plus élevé possible) : [[w2]]

      Profils utilisateur (200 Go de données, faible débit, peu de vCPU nécessaires, géoréplication active entre deux régions) : [[w3]]
  slots:
    - id: w1
      options:
        - { id: memory, text: Memory Optimized }
        - { id: balanced, text: Balanced }
        - { id: compute, text: Compute Optimized }
        - { id: flash, text: Flash Optimized }
    - id: w2
      options:
        - { id: memory, text: Memory Optimized }
        - { id: balanced, text: Balanced }
        - { id: compute, text: Compute Optimized }
        - { id: flash, text: Flash Optimized }
    - id: w3
      options:
        - { id: memory, text: Memory Optimized }
        - { id: balanced, text: Balanced }
        - { id: compute, text: Compute Optimized }
        - { id: flash, text: Flash Optimized }
answer:
  values: { w1: flash, w2: compute, w3: memory }
explanation:
  correct:
    en: "Flash Optimized keeps the less used data on NVMe storage instead of RAM, which lowers the cost of very large datasets at the price of some performance. Compute Optimized has the lowest memory-to-vCPU ratio (2:1), so it gives the highest throughput for a small dataset. Memory Optimized has the highest ratio (8:1) for memory-intensive workloads that need few vCPUs, and it supports active geo-replication, which Flash Optimized does not."
    fr: "Flash Optimized garde les données les moins utilisées sur un stockage NVMe plutôt qu'en mémoire vive, ce qui réduit le coût des très grands jeux de données au prix d'une partie des performances. Compute Optimized a le rapport mémoire/vCPU le plus faible (2:1) : il offre le débit le plus élevé pour un petit jeu de données. Memory Optimized a le rapport le plus élevé (8:1) pour les charges gourmandes en mémoire qui ont besoin de peu de vCPU, et il prend en charge la géoréplication active, contrairement à Flash Optimized."
  options:
    balanced: { en: "Balanced (4:1) suits standard workloads; it is neither the cheapest way to hold much memory with few vCPUs nor the fastest tier.", fr: "Balanced (4:1) convient aux charges de travail standard ; ce n'est ni le moyen le moins coûteux de disposer de beaucoup de mémoire avec peu de vCPU, ni le niveau le plus rapide." }
references:
  - title: What is Azure Managed Redis?
    url: https://learn.microsoft.com/en-us/azure/redis/overview
