id: az305-cs4b-release
objective: "4.2.6"
type: single
caseStudy: az305-cs4b-fourthcoffee
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend how new versions of app-brewahead are put into production. The solution must meet the deployment requirements and minimize costs.

    What should you recommend?
  fr: |
    Vous devez recommander la façon dont les nouvelles versions d'app-brewahead sont mises en production. La solution doit respecter les exigences de déploiement et réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: Deploy the new version to a second web app in a new App Service plan, then change the DNS record of BrewAhead
        fr: Déployer la nouvelle version sur une seconde application web dans un nouveau plan App Service, puis modifier l'enregistrement DNS de BrewAhead
    - id: b
      text:
        en: Scale out the plan to 20 instances, then deploy the new version to the production slot
        fr: Augmenter le plan à 20 instances, puis déployer la nouvelle version dans l'emplacement de production
    - id: c
      text:
        en: Stop app-brewahead, deploy the new version, check it, then start the app again
        fr: Arrêter app-brewahead, déployer la nouvelle version, la vérifier, puis redémarrer l'application
    - id: d
      text:
        en: Deploy the new version to a staging deployment slot of app-brewahead, then swap the slot with production
        fr: Déployer la nouvelle version dans un emplacement de déploiement intermédiaire d'app-brewahead, puis échanger cet emplacement avec la production
answer: { optionId: d }
explanation:
  correct:
    en: |
      A deployment slot is a live app with its own host name that runs in the same App Service plan, at no extra charge. The new version is started and checked in the staging slot, and the swap warms up its instances before it redirects the traffic, so no request is dropped. After the swap, the staging slot holds the previous version: a second swap returns to it within seconds.
    fr: |
      Un emplacement de déploiement est une application active dotée de son propre nom d'hôte, qui s'exécute dans le même plan App Service, sans frais supplémentaires. La nouvelle version est démarrée et vérifiée dans l'emplacement intermédiaire, et l'échange préchauffe ses instances avant de rediriger le trafic : aucune requête n'est donc perdue. Après l'échange, l'emplacement intermédiaire contient la version précédente : un second échange y revient en quelques secondes.
  options:
    a:
      en: "A second plan doubles the compute cost, and a DNS change takes effect only as the caches expire, both for the release and for the return to the previous version."
      fr: "Un second plan double le coût de calcul, et un changement DNS ne prend effet qu'à l'expiration des caches, pour la mise en production comme pour le retour à la version précédente."
    b:
      en: "More instances do not help: the new version still reaches production without having been started and checked first."
      fr: "Des instances supplémentaires n'y changent rien : la nouvelle version arrive toujours en production sans avoir été démarrée et vérifiée au préalable."
    c:
      en: "Stopping the app interrupts the service for the whole deployment and check."
      fr: "Arrêter l'application interrompt le service pendant tout le déploiement et la vérification."
references:
  - title: Set up staging environments in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
