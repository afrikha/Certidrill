id: az305-4a-ctr-aca-dedicated-plan
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware runs several inference APIs as Linux containers. The APIs receive a steady, high volume of requests.

    You need to recommend a hosting solution. The solution must meet the following requirements:

    - Litware does not manage a cluster or nodes. The Kubernetes API is not required.
    - The containers run on GPU-enabled hardware that is dedicated to Litware, with a single-tenant guarantee.
    - Several APIs share the same hardware instances, and the cost stays predictable.

    What should you recommend?
  fr: |
    Litware exécute plusieurs API d'inférence sous forme de conteneurs Linux. Les API reçoivent un volume de requêtes élevé et régulier.

    Vous devez recommander une solution d'hébergement. La solution doit répondre aux exigences suivantes :

    - Litware ne gère ni cluster ni nœuds. L'API Kubernetes n'est pas nécessaire.
    - Les conteneurs s'exécutent sur du matériel doté de GPU et dédié à Litware, avec une garantie d'isolation monolocataire.
    - Plusieurs API partagent les mêmes instances matérielles, et le coût reste prévisible.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Container Apps in the Consumption plan, with serverless GPUs", fr: "Azure Container Apps dans le plan Consumption, avec des GPU serverless" } }
    - { id: b, text: { en: "Azure Container Apps in the Dedicated plan, with a GPU workload profile", fr: "Azure Container Apps dans le plan Dedicated, avec un profil de charge de travail GPU" } }
    - { id: c, text: { en: "An AKS Standard cluster with a GPU node pool", fr: "Un cluster AKS Standard avec un pool de nœuds GPU" } }
    - { id: d, text: { en: "Azure Container Instances confidential container groups", fr: "Des groupes de conteneurs confidentiels Azure Container Instances" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Dedicated plan of Container Apps runs apps on workload profiles: dedicated hardware with a single-tenant guarantee, available in GPU-enabled types. You pay per profile instance, not per app, so several apps share an instance and the cost of a steady, high-volume workload is predictable. The platform stays fully managed.
    fr: |
      Le plan Dedicated de Container Apps exécute les applications sur des profils de charge de travail : du matériel dédié avec une garantie monolocataire, disponible en types dotés de GPU. Vous payez par instance de profil, et non par application : plusieurs applications partagent une instance, et le coût d'une charge régulière à fort volume est prévisible. La plateforme reste entièrement managée.
  options:
    a:
      en: The Consumption plan offers serverless GPUs on demand, billed while apps run, but not hardware dedicated to one customer.
      fr: Le plan Consumption propose des GPU serverless à la demande, facturés pendant l'exécution des applications, mais pas de matériel dédié à un seul client.
    c:
      en: A GPU node pool in AKS Standard provides the hardware, but Litware would create, scale and upgrade the node pools itself.
      fr: Un pool de nœuds GPU dans AKS Standard fournit le matériel, mais Litware devrait créer, mettre à l'échelle et mettre à niveau les pools de nœuds lui-même.
    d:
      en: Confidential container groups protect data in memory; they don't provide shared dedicated GPU hardware, and each group is deployed and scaled separately.
      fr: Les groupes de conteneurs confidentiels protègent les données en mémoire ; ils ne fournissent pas de matériel GPU dédié et partagé, et chaque groupe est déployé et mis à l'échelle séparément.
references:
  - title: Azure Container Apps plan types
    url: https://learn.microsoft.com/en-us/azure/container-apps/plans
