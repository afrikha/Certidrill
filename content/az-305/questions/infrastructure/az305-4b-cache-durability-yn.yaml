id: az305-4b-cache-durability-yn
objective: "4.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank plans an Azure Managed Redis instance in the Balanced tier, in a region that has availability zones. High availability and RDB data persistence with a one-hour frequency will be enabled.

    You are reviewing the resiliency of the design.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit une instance Azure Managed Redis de niveau Balanced, dans une région dotée de zones de disponibilité. La haute disponibilité et la persistance des données RDB, à une fréquence d'une heure, seront activées.

    Vous passez en revue la résilience de la conception.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The nodes of the instance are distributed across availability zones."
        fr: "Les nœuds de l'instance sont répartis entre des zones de disponibilité."
    - id: s2
      text:
        en: "If an application writes corrupted data, the persisted RDB files can be used to return the cache to its state of the previous day."
        fr: "Si une application écrit des données corrompues, les fichiers RDB persistants peuvent servir à ramener le cache à son état de la veille."
    - id: s3
      text:
        en: "Exporting the data of the cache on a schedule provides copies that can be imported into another instance."
        fr: "L'exportation planifiée des données du cache fournit des copies qui peuvent être importées dans une autre instance."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "With high availability, the primary and replica shards run on at least two nodes, which are spread across zones by default where the region has zones. Data persistence only rebuilds the cache from its most recent snapshot after a failure of the nodes: it is not a backup or a point-in-time restore, corrupted data is persisted too, and the files cannot be accessed or imported. Backups rely on the export feature, whose files can be imported into an instance."
    fr: "Avec la haute disponibilité, les partitions primaires et de réplica s'exécutent sur au moins deux nœuds, répartis par défaut entre les zones lorsque la région en possède. La persistance des données reconstruit seulement le cache à partir de son instantané le plus récent après une panne des nœuds : ce n'est ni une sauvegarde ni une restauration à un instant donné, les données corrompues sont persistées elles aussi, et les fichiers ne sont ni accessibles ni importables. Les sauvegardes reposent sur la fonctionnalité d'exportation, dont les fichiers peuvent être importés dans une instance."
references:
  - title: Configure data persistence for an Azure Managed Redis instance
    url: https://learn.microsoft.com/en-us/azure/redis/how-to-persistence
  - title: What is Azure Managed Redis?
    url: https://learn.microsoft.com/en-us/azure/redis/overview
