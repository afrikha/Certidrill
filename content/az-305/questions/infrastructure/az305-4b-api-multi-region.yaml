id: az305-4b-api-multi-region
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys exposes APIs to customers in Europe, North America and Asia through Azure API Management.

    You need to recommend a deployment that meets the following requirements:

    - An API gateway must run in an Azure region of each continent, and each customer must be routed automatically to the gateway that has the lowest latency.
    - If a region fails, the gateways of the other regions must keep serving requests.
    - The APIs and the policies must be configured only once.

    What should you recommend?
  fr: |
    Tailspin Toys expose des API à des clients en Europe, en Amérique du Nord et en Asie via Azure API Management.

    Vous devez recommander un déploiement qui répond aux exigences suivantes :

    - Une passerelle d'API doit s'exécuter dans une région Azure de chaque continent, et chaque client doit être routé automatiquement vers la passerelle dont la latence est la plus faible.
    - Si une région tombe en panne, les passerelles des autres régions doivent continuer à traiter les requêtes.
    - Les API et les stratégies ne doivent être configurées qu'une seule fois.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "One Premium v2 tier instance deployed across three availability zones", fr: "Une instance de niveau Premium v2 déployée sur trois zones de disponibilité" } }
    - { id: b, text: { en: "Three Standard v2 tier instances behind an Azure Traffic Manager profile", fr: "Trois instances de niveau Standard v2 derrière un profil Azure Traffic Manager" } }
    - { id: c, text: { en: "One Standard v2 tier instance behind an Azure Front Door profile", fr: "Une instance de niveau Standard v2 derrière un profil Azure Front Door" } }
    - { id: d, text: { en: "One Premium tier instance deployed to three Azure regions", fr: "Une instance de niveau Premium déployée dans trois régions Azure" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Only the Premium tier supports multi-region deployment: the gateway of a single instance is replicated to the added regions, requests are routed to the regional gateway with the lowest latency, and a failed region is bypassed automatically. The configuration is defined once, in the management plane of the primary region."
    fr: "Seul le niveau Premium prend en charge le déploiement multirégion : la passerelle d'une seule instance est répliquée dans les régions ajoutées, les requêtes sont routées vers la passerelle régionale dont la latence est la plus faible, et une région défaillante est contournée automatiquement. La configuration est définie une seule fois, dans le plan de gestion de la région primaire."
  options:
    a:
      en: "Availability zones protect against the failure of a datacenter inside one region; Premium v2 does not offer multi-region deployment."
      fr: "Les zones de disponibilité protègent contre la panne d'un centre de données au sein d'une région ; Premium v2 ne propose pas le déploiement multirégion."
    b:
      en: "Three separate instances can be load-balanced by Traffic Manager, but the APIs and policies must then be configured and kept identical in three instances."
      fr: "Trois instances distinctes peuvent être équilibrées par Traffic Manager, mais les API et les stratégies doivent alors être configurées et maintenues à l'identique dans trois instances."
    c:
      en: "Front Door brings an entry point close to customers, but the only gateway stays in one region and its failure stops every API."
      fr: "Front Door rapproche le point d'entrée des clients, mais l'unique passerelle reste dans une seule région et sa panne arrête toutes les API."
references:
  - title: Deploy an Azure API Management instance to multiple Azure regions
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-howto-deploy-multi-region
