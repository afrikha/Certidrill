id: az305-4b-api-workspaces-teams
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has one Azure API Management instance in the Premium tier, operated by a central platform team. Five product teams publish their APIs on this instance.

    You need to recommend a solution that meets the following requirements:

    - Each product team must manage only its own APIs, products and subscriptions.
    - The platform team must keep control of the instance and of the policies that apply to all the APIs.
    - No additional API Management instance can be deployed.

    What should you recommend?
  fr: |
    Proseware dispose d'une instance Azure API Management de niveau Premium, exploitée par une équipe de plateforme centrale. Cinq équipes produit publient leurs API sur cette instance.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Chaque équipe produit ne doit gérer que ses propres API, produits et abonnements.
    - L'équipe de plateforme doit garder le contrôle de l'instance et des stratégies qui s'appliquent à toutes les API.
    - Aucune instance API Management supplémentaire ne peut être déployée.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Create one product per product team", fr: "Créer un produit par équipe produit" } }
    - { id: b, text: { en: "Create one workspace per product team", fr: "Créer un espace de travail par équipe produit" } }
    - { id: c, text: { en: "Create one custom group per product team", fr: "Créer un groupe personnalisé par équipe produit" } }
    - { id: d, text: { en: "Deploy one self-hosted gateway per product team", fr: "Déployer une passerelle auto-hébergée par équipe produit" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Workspaces implement federated API management: each workspace contains the APIs, products and subscriptions of one team, accessible only to its collaborators through Azure RBAC roles scoped to the workspace. The platform team keeps the instance, its global policies and the monitoring."
    fr: "Les espaces de travail mettent en œuvre une gestion fédérée des API : chaque espace de travail contient les API, produits et abonnements d'une équipe, accessibles uniquement à ses collaborateurs grâce à des rôles Azure RBAC limités à l'espace de travail. L'équipe de plateforme conserve l'instance, ses stratégies globales et la supervision."
  options:
    a:
      en: "A product packages APIs for consumers; it does not delegate the administration of APIs to a team."
      fr: "Un produit regroupe des API pour les consommateurs ; il ne délègue pas l'administration d'API à une équipe."
    c:
      en: "Groups control which products are visible to developer portal users; they give no administrative isolation."
      fr: "Les groupes contrôlent la visibilité des produits pour les utilisateurs du portail des développeurs ; ils n'apportent aucune isolation administrative."
    d:
      en: "A self-hosted gateway moves the runtime close to the APIs; all gateways are still configured in the same shared instance."
      fr: "Une passerelle auto-hébergée rapproche l'exécution des API ; toutes les passerelles restent configurées dans la même instance partagée."
references:
  - title: Federated API management with workspaces
    url: https://learn.microsoft.com/en-us/azure/api-management/workspaces-overview
