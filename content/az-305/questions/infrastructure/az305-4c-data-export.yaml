id: az305-4c-data-export
objective: "4.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores 70 TB of block blobs in an Azure storage account. A regulator requires that a copy of the data be delivered to the company's on-premises archive within 30 days.

    The archive site has a 50-Mbps internet link, and Fabrikam owns no spare disk drives.

    What should you recommend?
  fr: |
    Fabrikam stocke 70 To d'objets blob de blocs dans un compte de stockage Azure. Un régulateur exige qu'une copie des données soit livrée aux archives locales de l'entreprise sous 30 jours.

    Le site d'archivage dispose d'une liaison Internet de 50 Mbit/s, et Fabrikam ne possède aucun disque de rechange.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: "Azure Data Box Disk" }
    - { id: b, text: "Azure Storage Mover" }
    - { id: c, text: "Azure Data Box" }
    - { id: d, text: "AzCopy" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure Data Box supports export orders: Microsoft copies the selected blobs to the device in the Azure datacenter and ships it to the customer, who copies the data to local storage. Downloading 70 TB at 50 Mbps would take about 130 days, far beyond the deadline.
    fr: |
      Azure Data Box prend en charge les commandes d'exportation : Microsoft copie les objets blob sélectionnés sur l'appareil dans le centre de données Azure et l'expédie au client, qui copie les données vers son stockage local. Télécharger 70 To à 50 Mbit/s prendrait environ 130 jours, bien au-delà de l'échéance.
  options:
    a:
      en: Data Box Disk only imports data to Azure; it can't export data from Azure.
      fr: Data Box Disk ne fait qu'importer des données vers Azure ; il ne peut pas exporter de données depuis Azure.
    b:
      en: Azure Storage Mover migrates files to Azure Storage over the network; it doesn't bring blobs back on-premises.
      fr: Azure Storage Mover migre des fichiers vers Stockage Azure par le réseau ; il ne ramène pas d'objets blob en local.
    d:
      en: AzCopy downloads over the network, and the link is too slow to bring back 70 TB within 30 days.
      fr: AzCopy télécharge par le réseau, et la liaison est trop lente pour rapatrier 70 To en 30 jours.
references:
  - title: What is Azure Data Box?
    url: https://learn.microsoft.com/en-us/azure/databox/data-box-overview
