id: az305-4a-appservice-ase-isolated
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank plans to host 20 internal web apps on Azure App Service.

    You need to recommend a hosting configuration. The solution must meet the following requirements:

    - The apps must run on compute that is dedicated to Woodgrove Bank and isolated from other customers.
    - The apps must be reachable only on a private address inside a virtual network of Woodgrove Bank.
    - A single App Service plan must be able to scale out to 60 instances.

    What should you recommend?
  fr: |
    Woodgrove Bank prévoit d'héberger 20 applications web internes sur Azure App Service.

    Vous devez recommander une configuration d'hébergement. La solution doit répondre aux exigences suivantes :

    - Les applications doivent s'exécuter sur des ressources de calcul dédiées à Woodgrove Bank et isolées des autres clients.
    - Les applications doivent être joignables uniquement sur une adresse privée, dans un réseau virtuel de Woodgrove Bank.
    - Un même plan App Service doit pouvoir effectuer un scale-out jusqu'à 60 instances.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Premium v3 plans, with a private endpoint for each app", fr: "Des plans Premium v3, avec un point de terminaison privé pour chaque application" } }
    - { id: b, text: { en: "Standard plans, with virtual network integration for each app", fr: "Des plans Standard, avec l'intégration au réseau virtuel pour chaque application" } }
    - { id: c, text: { en: "An App Service Environment v3 with an external virtual IP, and Isolated v2 plans", fr: "Un App Service Environment v3 avec une adresse IP virtuelle externe, et des plans Isolated v2" } }
    - { id: d, text: { en: "An App Service Environment v3 with an internal virtual IP, and Isolated v2 plans", fr: "Un App Service Environment v3 avec une adresse IP virtuelle interne, et des plans Isolated v2" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An App Service Environment v3 is a single-tenant deployment of App Service in a subnet of your virtual network. With an internal virtual IP, the inbound address of every app is inside that subnet, so the apps aren't exposed publicly. An Isolated v2 plan scales out to 100 instances, whereas the multitenant tiers stop at 30.
    fr: |
      Un App Service Environment v3 est un déploiement monolocataire d'App Service dans un sous-réseau de votre réseau virtuel. Avec une adresse IP virtuelle interne, l'adresse entrante de chaque application se trouve dans ce sous-réseau : les applications ne sont pas exposées publiquement. Un plan Isolated v2 effectue un scale-out jusqu'à 100 instances, alors que les niveaux multilocataires s'arrêtent à 30.
  options:
    a:
      en: Private endpoints make the apps private, but Premium v3 runs on the multitenant service and a plan is limited to 30 instances.
      fr: Les points de terminaison privés rendent les applications privées, mais Premium v3 s'exécute sur le service multilocataire et un plan est limité à 30 instances.
    b:
      en: Virtual network integration only handles outbound calls from the apps; the apps stay reachable from the internet, on the multitenant service, with at most 10 instances.
      fr: L'intégration au réseau virtuel ne traite que les appels sortants des applications ; celles-ci restent joignables depuis Internet, sur le service multilocataire, avec 10 instances au maximum.
    c:
      en: With an external virtual IP, the inbound address of the environment is public and the apps are listed in public DNS.
      fr: Avec une adresse IP virtuelle externe, l'adresse entrante de l'environnement est publique et les applications figurent dans le DNS public.
references:
  - title: App Service Environment overview
    url: https://learn.microsoft.com/en-us/azure/app-service/environment/overview
