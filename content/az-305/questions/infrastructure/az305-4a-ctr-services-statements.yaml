id: az305-4a-ctr-services-statements
objective: "4.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware is evaluating Azure container services for a new application.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware évalue les services de conteneurs Azure pour une nouvelle application.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure Container Instances automatically creates additional container groups when the CPU usage of a container group increases.
        fr: Azure Container Instances crée automatiquement des groupes de conteneurs supplémentaires lorsque l'utilisation du processeur d'un groupe de conteneurs augmente.
    - id: s2
      text:
        en: An app in Azure Container Apps can scale to zero replicas while it receives no HTTP requests.
        fr: Une application dans Azure Container Apps peut être mise à l'échelle jusqu'à zéro réplica tant qu'elle ne reçoit aucune requête HTTP.
    - id: s3
      text:
        en: Zone redundancy for an Azure Container Registry requires the Premium tier.
        fr: La redondance de zone d'un registre Azure Container Registry exige le niveau Premium.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Container Instances is a building block without scaling or load balancing: to run five instances, you create five container groups. Container Apps scales on HTTP traffic or events, and its minimum number of replicas can be zero. Zone redundancy is available in every tier of Container Registry; the Premium tier is required for geo-replication and private endpoints.
    fr: |
      Container Instances est une brique de base sans mise à l'échelle ni équilibrage de charge : pour exécuter cinq instances, vous créez cinq groupes de conteneurs. Container Apps est mis à l'échelle selon le trafic HTTP ou des événements, et son nombre minimal de réplicas peut être zéro. La redondance de zone est disponible dans tous les niveaux de Container Registry ; le niveau Premium est nécessaire pour la géoréplication et les points de terminaison privés.
references:
  - title: Comparing Container Apps with other Azure container options
    url: https://learn.microsoft.com/en-us/azure/container-apps/compare-options
  - title: Azure Container Registry SKU features and limits
    url: https://learn.microsoft.com/en-us/azure/container-registry/container-registry-skus
