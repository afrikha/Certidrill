id: az305-4a-msg-topic-subscriptions
objective: "4.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    The order service of Litware publishes one message for each order to Azure Service Bus. Three consumers must each receive the orders independently, at their own pace: Billing, Analytics and EU Shipping.

    Billing and Analytics must receive every order. EU Shipping must receive only the orders whose application property `region` is set to `EU`.

    You need to recommend a messaging design.

    What should you recommend? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le service de commandes de Litware publie un message par commande dans Azure Service Bus. Trois consommateurs doivent chacun recevoir les commandes indépendamment, à leur propre rythme : Billing, Analytics et EU Shipping.

    Billing et Analytics doivent recevoir toutes les commandes. EU Shipping ne doit recevoir que les commandes dont la propriété d'application `region` a la valeur `EU`.

    Vous devez recommander une conception de messagerie.

    Que devez-vous recommander ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Publish the orders to [[entity]].
      Give each consumer its own [[reader]].
      For EU Shipping, add [[filter]].
    fr: |
      Publier les commandes dans [[entity]].
      Donner à chaque consommateur [[reader]].
      Pour EU Shipping, ajouter [[filter]].
  slots:
    - id: entity
      options:
        - { id: queue, text: { en: "a queue", fr: "une file d'attente" } }
        - { id: topic, text: { en: "a topic", fr: "une rubrique" } }
        - { id: sessq, text: { en: "a queue with sessions", fr: "une file d'attente avec des sessions" } }
    - id: reader
      options:
        - { id: session, text: { en: "session", fr: "sa propre session" } }
        - { id: cg, text: { en: "consumer group", fr: "son propre groupe de consommateurs" } }
        - { id: sub, text: { en: "subscription", fr: "son propre abonnement" } }
    - id: filter
      options:
        - { id: corr, text: { en: "a correlation filter on the region property", fr: "un filtre de corrélation sur la propriété region" } }
        - { id: sqlbody, text: { en: "a SQL filter on the message body", fr: "un filtre SQL sur le corps du message" } }
        - { id: dup, text: { en: "duplicate detection on the region property", fr: "la détection des doublons sur la propriété region" } }
answer:
  values: { entity: topic, reader: sub, filter: corr }
explanation:
  correct:
    en: |
      A topic implements publish-subscribe: every subscription receives its own copy of each message and behaves like a virtual queue that its consumer reads at its own pace. A subscription rule filters on message properties: a correlation filter matches the exact value of a property such as `region` and is more efficient than a SQL filter.
    fr: |
      Une rubrique met en œuvre la publication-abonnement : chaque abonnement reçoit sa propre copie de chaque message et se comporte comme une file d'attente virtuelle que son consommateur lit à son rythme. Une règle d'abonnement filtre sur les propriétés des messages : un filtre de corrélation compare la valeur exacte d'une propriété telle que `region` et est plus efficace qu'un filtre SQL.
  options:
    queue:
      en: In a queue, each message is received by a single consumer; the three consumers would compete for the orders.
      fr: Dans une file d'attente, chaque message est reçu par un seul consommateur ; les trois consommateurs se disputeraient les commandes.
    sessq:
      en: Sessions group related messages for ordered processing; they don't give a copy of each message to several consumers.
      fr: Les sessions regroupent des messages liés pour un traitement ordonné ; elles ne donnent pas une copie de chaque message à plusieurs consommateurs.
    cg:
      en: Consumer groups belong to Event Hubs, not to Service Bus.
      fr: Les groupes de consommateurs appartiennent à Event Hubs, pas à Service Bus.
    sqlbody:
      en: Filters evaluate message properties only; they can't read the message body.
      fr: Les filtres n'évaluent que les propriétés des messages ; ils ne peuvent pas lire le corps du message.
    dup:
      en: Duplicate detection drops messages that reuse a message ID; it doesn't select messages for a subscription.
      fr: La détection des doublons écarte les messages qui réutilisent un ID de message ; elle ne sélectionne pas les messages d'un abonnement.
references:
  - title: Service Bus queues, topics, and subscriptions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-queues-topics-subscriptions
  - title: Topic filters and actions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/topic-filters
