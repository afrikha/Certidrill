id: az305-4b-api-tier-private-backends
objective: "4.2.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Fabrikam plans to deploy an Azure API Management instance for a production mobile application.

    You need to recommend a tier for the instance. The solution must meet the following requirements:

    - The back-end APIs run on virtual machines that have only private IP addresses in a virtual network.
    - The gateway must remain reachable from the internet by the mobile application.
    - The instance must be covered by a service-level agreement (SLA).
    - The instance is deployed in one region and no self-hosted gateway is needed.
    - The cost must be minimized.

    Which tier should you recommend?
  fr: |
    Fabrikam prévoit de déployer une instance Azure API Management pour une application mobile de production.

    Vous devez recommander un niveau pour l'instance. La solution doit répondre aux exigences suivantes :

    - Les API principales s'exécutent sur des machines virtuelles qui n'ont que des adresses IP privées dans un réseau virtuel.
    - La passerelle doit rester accessible depuis Internet pour l'application mobile.
    - L'instance doit être couverte par un contrat de niveau de service (SLA).
    - L'instance est déployée dans une seule région et aucune passerelle auto-hébergée n'est nécessaire.
    - Le coût doit être réduit au minimum.

    Quel niveau devez-vous recommander ?
body:
  options:
    - { id: a, text: Consumption }
    - { id: b, text: Developer }
    - { id: c, text: Standard v2 }
    - { id: d, text: Premium }
answer: { optionId: c }
explanation:
  correct:
    en: "Standard v2 is a production tier with an SLA that supports virtual network integration: the gateway keeps its public endpoint while its outbound requests reach back ends isolated in a virtual network. It is the least expensive tier that combines these capabilities."
    fr: "Standard v2 est un niveau de production assorti d'un SLA qui prend en charge l'intégration au réseau virtuel : la passerelle garde son point de terminaison public tandis que ses requêtes sortantes atteignent des services principaux isolés dans un réseau virtuel. C'est le niveau le moins coûteux qui réunit ces capacités."
  options:
    a:
      en: "The Consumption tier cannot connect to back ends isolated in a virtual network."
      fr: "Le niveau Consumption ne peut pas se connecter à des services principaux isolés dans un réseau virtuel."
    b:
      en: "The Developer tier can be injected in a virtual network, but it is intended for non-production use and has no SLA."
      fr: "Le niveau Developer peut être injecté dans un réseau virtuel, mais il est destiné à un usage hors production et n'a pas de SLA."
    d:
      en: "The Premium tier meets the requirements, but its price is justified by multi-region deployment, availability zones or the self-hosted gateway, none of which is needed here."
      fr: "Le niveau Premium répond aux exigences, mais son prix se justifie par le déploiement multirégion, les zones de disponibilité ou la passerelle auto-hébergée, dont aucun n'est nécessaire ici."
references:
  - title: Feature-based comparison of the Azure API Management tiers
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-features
  - title: Azure API Management v2 tiers
    url: https://learn.microsoft.com/en-us/azure/api-management/v2-service-tiers-overview
