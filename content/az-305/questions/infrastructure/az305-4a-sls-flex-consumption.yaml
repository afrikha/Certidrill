id: az305-4a-sls-flex-consumption
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso is building a new function app in Python. The functions are triggered by messages in an Azure Service Bus queue and write to an Azure SQL database that is reachable only through a private endpoint in a virtual network. Messages arrive in bursts that are separated by hours of inactivity.

    You need to recommend a hosting plan for the function app. The solution must meet the following requirements:

    - The functions must reach the database through the virtual network.
    - The number of instances must follow the number of messages and return to zero when there is no message.
    - Minimize cost.

    Which hosting plan should you recommend?
  fr: |
    Contoso développe une nouvelle application de fonctions en Python. Les fonctions sont déclenchées par les messages d'une file d'attente Azure Service Bus et écrivent dans une base de données Azure SQL joignable uniquement par un point de terminaison privé dans un réseau virtuel. Les messages arrivent en rafales séparées par des heures d'inactivité.

    Vous devez recommander un plan d'hébergement pour l'application de fonctions. La solution doit répondre aux exigences suivantes :

    - Les fonctions doivent atteindre la base de données en passant par le réseau virtuel.
    - Le nombre d'instances doit suivre le nombre de messages et revenir à zéro en l'absence de message.
    - Réduire les coûts au minimum.

    Quel plan d'hébergement devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The Consumption plan", fr: "Le plan Consumption" } }
    - { id: b, text: { en: "The Flex Consumption plan", fr: "Le plan Flex Consumption" } }
    - { id: c, text: { en: "The Premium plan", fr: "Le plan Premium" } }
    - { id: d, text: { en: "The Dedicated (App Service) plan", fr: "Le plan Dedicated (App Service)" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Flex Consumption plan combines serverless billing and event-driven scaling, including scale to zero, with virtual network integration. It runs on Linux, which suits a Python app, and is the recommended serverless plan for new function apps.
    fr: |
      Le plan Flex Consumption associe la facturation serverless et la mise à l'échelle pilotée par les événements, y compris jusqu'à zéro, à l'intégration au réseau virtuel. Il s'exécute sous Linux, ce qui convient à une application Python, et c'est le plan serverless recommandé pour les nouvelles applications de fonctions.
  options:
    a:
      en: The legacy Consumption plan scales to zero but has no virtual network integration, so the functions couldn't reach the private endpoint.
      fr: Le plan Consumption hérité se met à l'échelle jusqu'à zéro, mais n'a pas d'intégration au réseau virtuel ; les fonctions ne pourraient donc pas atteindre le point de terminaison privé.
    c:
      en: The Premium plan supports virtual networks and event-driven scaling, but at least one instance is always running and billed.
      fr: Le plan Premium prend en charge les réseaux virtuels et la mise à l'échelle pilotée par les événements, mais au moins une instance est toujours active et facturée.
    d:
      en: A Dedicated plan runs continuously on a fixed number of instances that you scale manually or with autoscale rules; it is billed during the idle hours.
      fr: Un plan Dedicated s'exécute en continu sur un nombre fixe d'instances que vous mettez à l'échelle manuellement ou avec des règles de mise à l'échelle automatique ; il est facturé pendant les heures d'inactivité.
references:
  - title: Azure Functions hosting options
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
  - title: Azure Functions Flex Consumption plan hosting
    url: https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-plan
