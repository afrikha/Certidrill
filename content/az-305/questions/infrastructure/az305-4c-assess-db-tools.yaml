id: az305-4c-assess-db-tools
objective: "4.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank plans to move its databases to Azure SQL. The on-premises estate contains 120 SQL Server instances on VMware virtual machines and four Oracle Database servers.

    You need to recommend a tool to evaluate each part of the estate:

    - For SQL Server, the bank wants the readiness, the recommended Azure SQL target and the estimated monthly cost of all the instances in one operation.
    - For Oracle, the bank wants a report that shows which schema objects can be converted automatically and how much effort the other objects require.

    Which tool should you recommend for each part of the estate? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit de déplacer ses bases de données vers Azure SQL. Le parc local comprend 120 instances SQL Server sur des machines virtuelles VMware et quatre serveurs Oracle Database.

    Vous devez recommander un outil pour évaluer chaque partie du parc :

    - Pour SQL Server, la banque veut la préparation, la cible Azure SQL recommandée et le coût mensuel estimé de toutes les instances en une seule opération.
    - Pour Oracle, la banque veut un rapport qui indique quels objets de schéma peuvent être convertis automatiquement et quel effort demandent les autres objets.

    Quel outil devez-vous recommander pour chaque partie du parc ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      SQL Server instances: [[sql]]

      Oracle Database servers: [[oracle]]
    fr: |
      Instances SQL Server : [[sql]]

      Serveurs Oracle Database : [[oracle]]
  slots:
    - id: sql
      options:
        - { id: dms, text: "Azure Database Migration Service" }
        - { id: migrate, text: "Azure Migrate" }
        - { id: ssma, text: "SQL Server Migration Assistant (SSMA)" }
        - { id: mover, text: "Azure Storage Mover" }
    - id: oracle
      options:
        - { id: migrate, text: "Azure Migrate" }
        - { id: adf, text: "Azure Data Factory" }
        - { id: dms, text: "Azure Database Migration Service" }
        - { id: ssma, text: "SQL Server Migration Assistant (SSMA)" }
answer:
  values: { sql: migrate, oracle: ssma }
explanation:
  correct:
    en: |
      Azure Migrate discovers SQL Server instances at scale through its appliance, and an Azure SQL assessment returns the readiness, the recommended target (SQL Database, SQL Managed Instance or SQL Server on Azure Virtual Machines) and the monthly cost. SSMA for Oracle produces an assessment report that lists the objects it can convert to SQL Server syntax and estimates the manual effort for the rest.
    fr: |
      Azure Migrate découvre les instances SQL Server à grande échelle grâce à son appliance, et une évaluation Azure SQL fournit la préparation, la cible recommandée (SQL Database, SQL Managed Instance ou SQL Server sur Machines virtuelles Azure) et le coût mensuel. SSMA pour Oracle produit un rapport d'évaluation qui répertorie les objets qu'il peut convertir en syntaxe SQL Server et estime l'effort manuel pour le reste.
  options:
    dms:
      en: Azure Database Migration Service moves the data of databases; it doesn't produce these assessments.
      fr: Azure Database Migration Service déplace les données des bases de données ; il ne produit pas ces évaluations.
    mover:
      en: Azure Storage Mover migrates files and folders, not databases.
      fr: Azure Storage Mover migre des fichiers et des dossiers, pas des bases de données.
    adf:
      en: Azure Data Factory copies and transforms data; it doesn't analyze the conversion of Oracle schemas.
      fr: Azure Data Factory copie et transforme des données ; il n'analyse pas la conversion des schémas Oracle.
references:
  - title: Assessment Overview (migrate to Azure SQL)
    url: https://learn.microsoft.com/en-us/azure/migrate/concepts-azure-sql-assessment-calculation?view=migrate-classic
  - title: SQL Server Migration Assistant for Oracle (OracleToSQL)
    url: https://learn.microsoft.com/en-us/sql/ssma/oracle/sql-server-migration-assistant-for-oracle-oracletosql
