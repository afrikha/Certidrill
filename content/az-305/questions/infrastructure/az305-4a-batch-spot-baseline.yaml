id: az305-4a-batch-spot-baseline
objective: "4.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys renders animation frames in Azure Batch. Each frame is an independent task that takes about 10 minutes.

    You need to recommend a pool design. The solution must meet the following requirements:

    - At least 2,000 frames must be rendered every night, even when no Spot capacity is available.
    - Any capacity beyond this minimum must cost as little as possible.

    What should you recommend? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys effectue le rendu d'images d'animation dans Azure Batch. Chaque image est une tâche indépendante d'environ 10 minutes.

    Vous devez recommander une conception de pool. La solution doit répondre aux exigences suivantes :

    - Au moins 2 000 images doivent être rendues chaque nuit, même lorsqu'aucune capacité Spot n'est disponible.
    - Toute capacité au-delà de ce minimum doit coûter le moins cher possible.

    Que devez-vous recommander ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Create a pool that contains [[nodes]].
      When a Spot node is preempted while it runs a task, the task [[behavior]].
    fr: |
      Créer un pool qui contient [[nodes]].
      Lorsqu'un nœud Spot est préempté pendant qu'il exécute une tâche, la tâche [[behavior]].
  slots:
    - id: nodes
      options:
        - { id: dedicated, text: { en: "dedicated nodes only", fr: "uniquement des nœuds dédiés" } }
        - { id: spot, text: { en: "Spot nodes only", fr: "uniquement des nœuds Spot" } }
        - { id: mix, text: { en: "a fixed number of dedicated nodes, plus Spot nodes", fr: "un nombre fixe de nœuds dédiés, plus des nœuds Spot" } }
    - id: behavior
      options:
        - { id: requeue, text: { en: "is requeued automatically and runs again on another node", fr: "est remise en file d'attente automatiquement et s'exécute à nouveau sur un autre nœud" } }
        - { id: fail, text: { en: "fails, and the job is terminated", fr: "échoue, et le travail est arrêté" } }
        - { id: pause, text: { en: "is suspended and resumes from the same point when the node returns", fr: "est suspendue et reprend au même point au retour du nœud" } }
answer:
  values: { nodes: mix, behavior: requeue }
explanation:
  correct:
    en: |
      A Batch pool can contain dedicated and Spot nodes at the same time. The dedicated nodes are a baseline that guarantees the minimum throughput, and the Spot nodes add capacity at a discount when it is available. A task interrupted by a preemption is requeued automatically and runs again on another node; work that wasn't checkpointed is redone, which is acceptable for short independent tasks.
    fr: |
      Un pool Batch peut contenir en même temps des nœuds dédiés et des nœuds Spot. Les nœuds dédiés forment une base qui garantit le débit minimal, et les nœuds Spot ajoutent de la capacité à prix réduit quand elle est disponible. Une tâche interrompue par une préemption est remise en file d'attente automatiquement et s'exécute à nouveau sur un autre nœud ; le travail sans point de contrôle est refait, ce qui est acceptable pour des tâches courtes et indépendantes.
  options:
    dedicated:
      en: Dedicated nodes only guarantee the throughput, but the additional capacity is paid at full price.
      fr: Des nœuds dédiés seuls garantissent le débit, mais la capacité supplémentaire est payée au plein tarif.
    spot:
      en: Spot nodes only are the cheapest option, but nothing is rendered when Azure has no Spot capacity.
      fr: Des nœuds Spot seuls sont l'option la moins chère, mais rien n'est rendu quand Azure n'a pas de capacité Spot.
    fail:
      en: A preemption doesn't fail the job; Batch reschedules the interrupted task.
      fr: Une préemption ne fait pas échouer le travail ; Batch replanifie la tâche interrompue.
    pause:
      en: The local data of a preempted node is lost; the task starts again unless the application implements its own checkpoints.
      fr: Les données locales d'un nœud préempté sont perdues ; la tâche recommence, sauf si l'application implémente ses propres points de contrôle.
references:
  - title: Use Spot VMs with Batch workloads
    url: https://learn.microsoft.com/en-us/azure/batch/batch-spot-vms
