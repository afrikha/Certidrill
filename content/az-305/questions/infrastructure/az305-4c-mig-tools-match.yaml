id: az305-4c-mig-tools-match
objective: "4.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum plans three migrations to Azure and wants to use the tool that Microsoft recommends for each of them.

    Which tool should you recommend for each migration? To answer, drag the appropriate tools to the correct migrations. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit trois migrations vers Azure et veut utiliser pour chacune l'outil que Microsoft recommande.

    Quel outil devez-vous recommander pour chaque migration ? Pour répondre, faites glisser les outils appropriés vers les migrations correspondantes. Chaque outil peut être utilisé une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: migrate, text: "Azure Migrate" }
    - { id: hcx, text: "VMware HCX" }
    - { id: asma, text: "App Service Migration Assistant" }
    - { id: dms, text: "Azure Database Migration Service" }
    - { id: mover, text: "Azure Storage Mover" }
  targets:
    - id: t1
      text: { en: "Replicate Hyper-V virtual machines and cut them over to Azure virtual machines", fr: "Répliquer des machines virtuelles Hyper-V et les basculer vers des machines virtuelles Azure" }
    - id: t2
      text: { en: "Move virtual machines from an on-premises vSphere cluster to an Azure VMware Solution private cloud", fr: "Déplacer des machines virtuelles d'un cluster vSphere local vers un cloud privé Azure VMware Solution" }
    - id: t3
      text: { en: "Move one ASP.NET site from an IIS server to a managed web hosting platform", fr: "Déplacer un site ASP.NET d'un serveur IIS vers une plateforme d'hébergement web managée" }
answer:
  mapping: { t1: migrate, t2: hcx, t3: asma }
explanation:
  correct:
    en: |
      Azure Migrate replicates Hyper-V virtual machines, runs test migrations and cuts over to Azure virtual machines. VMware HCX is the mobility tool, available as an add-on of Azure VMware Solution, that moves virtual machines between an on-premises vSphere environment and the private cloud. App Service Migration Assistant assesses an IIS site and migrates it to Azure App Service. Azure Database Migration Service moves databases and Azure Storage Mover moves files.
    fr: |
      Azure Migrate réplique les machines virtuelles Hyper-V, exécute des migrations de test et bascule vers des machines virtuelles Azure. VMware HCX est l'outil de mobilité, disponible en module complémentaire d'Azure VMware Solution, qui déplace des machines virtuelles entre un environnement vSphere local et le cloud privé. App Service Migration Assistant évalue un site IIS et le migre vers Azure App Service. Azure Database Migration Service déplace des bases de données et Azure Storage Mover des fichiers.
references:
  - title: What is Azure Migrate?
    url: https://learn.microsoft.com/en-us/azure/migrate/migrate-services-overview
  - title: What is Azure VMware Solution?
    url: https://learn.microsoft.com/en-us/azure/azure-vmware/introduction
