id: az305-cs1a-nas-transfer
objective: "4.3.5"
type: single
caseStudy: az305-cs1a-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution to copy the existing files of NAS1 to Azure Blob Storage. The solution must meet the storage requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution pour copier les fichiers existants de NAS1 vers Stockage Blob Azure. La solution doit répondre aux exigences de stockage.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An Azure Storage Mover migration project with an agent deployed in the Basel datacenter", fr: "Un projet de migration Azure Storage Mover avec un agent déployé dans le centre de données de Bâle" } }
    - { id: b, text: { en: "A single Azure Data Box Disk order that is shipped to the Basel datacenter", fr: "Une seule commande Azure Data Box Disk expédiée au centre de données de Bâle" } }
    - { id: c, text: { en: "A single Azure Data Box device that is shipped to the Basel datacenter", fr: "Un seul appareil Azure Data Box expédié au centre de données de Bâle" } }
    - { id: d, text: { en: "An AzCopy job that runs in the Basel datacenter with a bandwidth cap", fr: "Un travail AzCopy exécuté dans le centre de données de Bâle avec une limite de bande passante" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      At 50 Mbps, copying 60 TB over the network takes about 111 days, far more than the six weeks allowed. Azure Data Box is an offline transfer: Microsoft ships a storage device, the files are copied to it on the local network and the device returns to an Azure datacenter, where its content is uploaded to the storage account. Microsoft positions Data Box for transfers larger than 40 TB with no or limited network connectivity, and one device holds the 60 TB of NAS1.
    fr: |
      À 50 Mbit/s, copier 60 To par le réseau prend environ 111 jours, bien plus que les six semaines accordées. Azure Data Box est un transfert hors connexion : Microsoft expédie un appareil de stockage, les fichiers y sont copiés sur le réseau local et l'appareil repart vers un centre de données Azure, où son contenu est chargé dans le compte de stockage. Microsoft destine Data Box aux transferts de plus de 40 To quand la connectivité réseau est absente ou limitée, et un seul appareil contient les 60 To de NAS1.
  options:
    a:
      en: Azure Storage Mover copies the files over the network, so the 50-Mbps limit makes the six-week deadline impossible to meet.
      fr: Azure Storage Mover copie les fichiers par le réseau ; la limite de 50 Mbit/s rend donc le délai de six semaines impossible à tenir.
    b:
      en: A Data Box Disk order contains at most five 8-TB disks, about 35 TB of usable capacity, which is less than the 60 TB of NAS1.
      fr: Une commande Data Box Disk contient au plus cinq disques de 8 To, soit environ 35 To de capacité utilisable, moins que les 60 To de NAS1.
    d:
      en: AzCopy also uses the internet link; capped at 50 Mbps, the copy would last more than three months.
      fr: AzCopy utilise lui aussi la liaison Internet ; limitée à 50 Mbit/s, la copie durerait plus de trois mois.
references:
  - title: What is Azure Data Box?
    url: https://learn.microsoft.com/en-us/azure/databox/data-box-overview
  - title: What is Azure Data Box Disk?
    url: https://learn.microsoft.com/en-us/azure/databox/data-box-disk-overview
