id: az305-4d-sec-svc-endpoint
objective: "4.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys runs batch virtual machines in a subnet named Snet-Batch of a virtual network named VNet1. The virtual machines write files to a storage account named stwingtipraw in the same region.

    You need to recommend a network security solution for stwingtipraw. The solution must meet the following requirements:

    - The storage account must accept data-plane connections only from Snet-Batch.
    - No access is needed from on-premises networks or from other virtual networks.
    - Don't change any DNS configuration.
    - Minimize costs.

    What should you recommend?
  fr: |
    Wingtip Toys exécute des machines virtuelles de traitement par lots dans un sous-réseau nommé Snet-Batch d'un réseau virtuel nommé VNet1. Les machines virtuelles écrivent des fichiers dans un compte de stockage nommé stwingtipraw situé dans la même région.

    Vous devez recommander une solution de sécurité réseau pour stwingtipraw. La solution doit répondre aux exigences suivantes :

    - Le compte de stockage ne doit accepter les connexions au plan de données que depuis Snet-Batch.
    - Aucun accès n'est nécessaire depuis les réseaux locaux ni depuis d'autres réseaux virtuels.
    - Ne modifier aucune configuration DNS.
    - Réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A private endpoint for stwingtipraw in Snet-Batch, with public network access disabled", fr: "Un point de terminaison privé pour stwingtipraw dans Snet-Batch, avec l'accès réseau public désactivé" } }
    - { id: b, text: { en: "An outbound NSG rule on Snet-Batch that allows only the Storage service tag", fr: "Une règle NSG sortante sur Snet-Batch qui n'autorise que la balise de service Storage" } }
    - { id: c, text: { en: "A Microsoft.Storage service endpoint on Snet-Batch and a virtual network rule on stwingtipraw", fr: "Un point de terminaison de service Microsoft.Storage sur Snet-Batch et une règle de réseau virtuel sur stwingtipraw" } }
    - { id: d, text: { en: "Azure Firewall in VNet1 with an application rule that allows stwingtipraw", fr: "Le Pare-feu Azure dans VNet1 avec une règle d'application qui autorise stwingtipraw" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A service endpoint makes the traffic from Snet-Batch reach Azure Storage over the Microsoft backbone with the subnet's private addresses as the source. A virtual network rule on the storage firewall then allows only that subnet and rejects other public connections. Service endpoints are free and leave the DNS records unchanged; their lack of access from on-premises doesn't matter here.
    fr: |
      Un point de terminaison de service fait arriver le trafic de Snet-Batch vers Stockage Azure par le réseau principal de Microsoft, avec les adresses privées du sous-réseau comme source. Une règle de réseau virtuel dans le pare-feu du stockage n'autorise alors que ce sous-réseau et rejette les autres connexions publiques. Les points de terminaison de service sont gratuits et ne modifient pas les enregistrements DNS ; leur absence d'accès depuis le réseau local n'a pas d'importance ici.
  options:
    a:
      en: |
        A private endpoint would restrict access too, but it is billed and requires a private DNS zone, which the requirements rule out.
      fr: |
        Un point de terminaison privé restreindrait aussi l'accès, mais il est facturé et nécessite une zone DNS privée, ce que les exigences excluent.
    b:
      en: |
        An NSG rule only limits what the virtual machines can reach; the storage account would still accept connections from anywhere.
      fr: |
        Une règle NSG ne limite que ce que les machines virtuelles peuvent atteindre ; le compte de stockage accepterait toujours des connexions de n'importe où.
    d:
      en: |
        Azure Firewall filters the outbound traffic of VNet1 at a high cost and doesn't stop other clients from reaching the storage account.
      fr: |
        Le Pare-feu Azure filtre le trafic sortant de VNet1 pour un coût élevé et n'empêche pas d'autres clients d'atteindre le compte de stockage.
references:
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
