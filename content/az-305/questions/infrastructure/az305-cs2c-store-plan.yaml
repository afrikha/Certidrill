id: az305-cs2c-store-plan
objective: "4.1.1"
type: single
caseStudy: az305-cs2c-tailwind-traders
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You need to recommend a pricing tier for plan-store. The solution must meet the requirements of the online store.

    What should you recommend?
  fr: |
    Vous devez recommander un niveau tarifaire pour plan-store. La solution doit respecter les exigences relatives à la boutique en ligne.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: Basic }
    - { id: b, text: Standard }
    - { id: c, text: Premium v3 }
    - { id: d, text: Isolated v2 }
answer: { optionId: c }
explanation:
  correct:
    en: The Standard tier already provides autoscale and deployment slots, but an App Service plan can be zone redundant only in the Premium v2 to Premium v4 tiers, with at least two instances. Zone redundancy has no separate charge in these tiers, so Premium v3 is the lowest tier of the list that meets the three requirements.
    fr: Le niveau Standard fournit déjà la mise à l'échelle automatique et les emplacements de déploiement, mais un plan App Service ne peut être redondant interzone que dans les niveaux Premium v2 à Premium v4, avec au moins deux instances. La redondance de zone n'y est pas facturée séparément ; Premium v3 est donc le niveau le plus bas de la liste qui respecte les trois exigences.
  options:
    a: { en: "The Basic tier has neither autoscale nor deployment slots, and it can't be zone redundant.", fr: "Le niveau Basic n'a ni mise à l'échelle automatique ni emplacements de déploiement, et il ne peut pas être redondant interzone." }
    b: { en: "The Standard tier, used today, offers autoscale and slots but can't be zone redundant.", fr: "Le niveau Standard, utilisé aujourd'hui, offre la mise à l'échelle automatique et les emplacements, mais ne peut pas être redondant interzone." }
    d: { en: "Isolated v2 runs in a dedicated App Service Environment: it costs more, and network isolation isn't required.", fr: "Isolated v2 s'exécute dans un environnement App Service Environment dédié : il coûte plus cher, et l'isolation réseau n'est pas exigée." }
references:
  - title: Reliability in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/reliability/reliability-app-service
  - title: What are Azure App Service plans?
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans
