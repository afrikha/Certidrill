id: az305-4a-msg-features-match
objective: "4.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is designing an order workflow on Azure Service Bus queues.

    Which Service Bus feature should you recommend for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders conçoit un workflow de commandes sur des files d'attente Azure Service Bus.

    Quelle fonctionnalité de Service Bus devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: defer, text: { en: "Message deferral", fr: "Report de message" } }
    - { id: dlq, text: { en: "Dead-letter queue", fr: "File d'attente de lettres mortes" } }
    - { id: sched, text: { en: "Scheduled delivery", fr: "Remise planifiée" } }
    - { id: fwd, text: { en: "Auto-forwarding", fr: "Transfert automatique" } }
    - { id: dup, text: { en: "Duplicate detection", fr: "Détection des doublons" } }
  targets:
    - id: t1
      text:
        en: A receiver gets a message that it can't process yet. It must set the message aside in the queue and retrieve it later by its sequence number.
        fr: Un récepteur obtient un message qu'il ne peut pas encore traiter. Il doit mettre le message de côté dans la file d'attente et le récupérer plus tard grâce à son numéro de séquence.
    - id: t2
      text:
        en: A message whose processing has failed ten times must leave the main flow and be kept for inspection.
        fr: Un message dont le traitement a échoué dix fois doit quitter le flux principal et être conservé pour inspection.
    - id: t3
      text:
        en: A reminder that is sent today must become available to receivers only at 06:00 tomorrow.
        fr: Un rappel envoyé aujourd'hui ne doit devenir disponible pour les récepteurs que demain à 06:00.
answer:
  mapping: { t1: defer, t2: dlq, t3: sched }
explanation:
  correct:
    en: |
      Message deferral lets a receiver set a message aside; the message stays in the queue and is retrieved later by its sequence number. When the delivery count of a message exceeds the maximum delivery count, 10 by default, Service Bus moves it to the dead-letter queue, where it stays until it is inspected and completed. Scheduled delivery submits a message that becomes available for consumption at a set time.
    fr: |
      Le report de message permet à un récepteur de mettre un message de côté ; le message reste dans la file d'attente et est récupéré plus tard grâce à son numéro de séquence. Lorsque le nombre de remises d'un message dépasse le nombre maximal de remises, 10 par défaut, Service Bus le déplace vers la file d'attente de lettres mortes, où il reste jusqu'à son inspection et sa finalisation. La remise planifiée soumet un message qui devient disponible pour la consommation à une heure définie.
  options:
    fwd:
      en: Auto-forwarding moves messages from a queue or a subscription to another queue or topic of the same namespace.
      fr: Le transfert automatique déplace les messages d'une file d'attente ou d'un abonnement vers une autre file d'attente ou rubrique du même espace de noms.
    dup:
      en: Duplicate detection drops a message that is sent again with the same message ID during the detection window.
      fr: La détection des doublons écarte un message renvoyé avec le même ID de message pendant la fenêtre de détection.
references:
  - title: Azure Service Bus - advanced features
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/advanced-features-overview
  - title: Overview of Service Bus dead-letter queues
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-dead-letter-queues
