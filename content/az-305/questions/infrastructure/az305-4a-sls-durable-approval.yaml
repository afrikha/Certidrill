id: az305-4a-sls-durable-approval
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The developers of Adatum are building an expense workflow in C#. The workflow validates an expense report, waits up to five days for the approval of a manager, escalates the request if no approval arrives in time, and then posts the expense to the ERP system.

    You need to recommend a serverless solution. The solution must meet the following requirements:

    - The workflow is defined in code and is covered by the unit tests of the team.
    - The state of each workflow instance is preserved while it waits, including across restarts of the host.

    What should you recommend?
  fr: |
    Les développeurs d'Adatum créent un workflow de notes de frais en C#. Le workflow valide une note de frais, attend jusqu'à cinq jours l'approbation d'un responsable, escalade la demande si aucune approbation n'arrive à temps, puis enregistre la dépense dans le système ERP.

    Vous devez recommander une solution serverless. La solution doit répondre aux exigences suivantes :

    - Le workflow est défini en code et couvert par les tests unitaires de l'équipe.
    - L'état de chaque instance de workflow est conservé pendant l'attente, y compris lors des redémarrages de l'hôte.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A workflow in Azure Logic Apps (Consumption)", fr: "Un workflow dans Azure Logic Apps (Consumption)" } }
    - { id: b, text: { en: "An approval flow in Power Automate", fr: "Un flux d'approbation dans Power Automate" } }
    - { id: c, text: { en: "An orchestration in Durable Functions", fr: "Une orchestration dans Durable Functions" } }
    - { id: d, text: { en: "An HTTP-triggered function that waits for the approval", fr: "Une fonction déclenchée par HTTP qui attend l'approbation" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Durable Functions is the code-first way to build orchestrations in Azure Functions. An orchestrator function written in C# can wait for an external event, such as an approval, combined with a durable timer for the escalation; the runtime checkpoints the state of the instance and restores it after a restart.
    fr: |
      Durable Functions est l'approche orientée code pour créer des orchestrations dans Azure Functions. Une fonction d'orchestrateur écrite en C# peut attendre un événement externe, comme une approbation, associé à un minuteur durable pour l'escalade ; le runtime enregistre l'état de l'instance par points de contrôle et le restaure après un redémarrage.
  options:
    a:
      en: Logic Apps can model the approval, but it is designer-first; the workflow is a declarative definition, not C# code under the unit tests of the team.
      fr: Logic Apps peut modéliser l'approbation, mais c'est une approche orientée concepteur ; le workflow est une définition déclarative, et non du code C# couvert par les tests unitaires de l'équipe.
    b:
      en: Power Automate targets business users who automate tasks without code; it isn't a code-first developer service.
      fr: Power Automate s'adresse aux utilisateurs métier qui automatisent des tâches sans code ; ce n'est pas un service orienté code pour développeurs.
    d:
      en: An HTTP-triggered function must respond within 230 seconds and keeps no state between executions, so it can't wait five days.
      fr: Une fonction déclenchée par HTTP doit répondre en 230 secondes et ne conserve aucun état entre les exécutions ; elle ne peut donc pas attendre cinq jours.
references:
  - title: Durable orchestrations
    url: https://learn.microsoft.com/en-us/azure/azure-functions/durable/durable-functions-orchestrations
  - title: Choose the right integration and automation services in Azure
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-compare-logic-apps-ms-flow-webjobs
