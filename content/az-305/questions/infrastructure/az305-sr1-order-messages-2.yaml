id: az305-sr1-order-messages-2
objective: "4.2.1"
type: series_yesno
series: az305-sr1-order-messages
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You recommend a Service Bus Standard topic with duplicate detection and two session-enabled subscriptions.
  fr: Vous recommandez une rubrique Service Bus Standard avec la détection des doublons et deux abonnements avec sessions.
body:
  solution:
    en: |
      You recommend an **Azure Service Bus** namespace in the **Standard** tier. The front end sends each order to a **topic** that has duplicate detection enabled, with the order number as the message ID and the customer ID as the session ID. Billing and Shipping each have their own **subscription** with sessions enabled.
    fr: |
      Vous recommandez un espace de noms **Azure Service Bus** de niveau **Standard**. Le front-end envoie chaque commande à une **rubrique** dont la détection des doublons est activée, avec le numéro de commande comme ID de message et l'identifiant du client comme ID de session. Billing et Shipping ont chacun leur propre **abonnement** avec les sessions activées.
answer: { value: true }
explanation:
  correct:
    en: |
      Every subscription of a topic receives a copy of each message and is read independently, like a queue. Sessions give first-in, first-out processing of the messages that carry the same session ID, here the customer ID. Duplicate detection makes the topic drop a message whose message ID was already seen during the detection window, which is 10 minutes by default. The Standard tier supports sessions and duplicate detection, and 20 KB is below its message size limit.
    fr: |
      Chaque abonnement d'une rubrique reçoit une copie de chaque message et se lit indépendamment, comme une file d'attente. Les sessions donnent un traitement premier entré, premier sorti des messages qui portent le même ID de session, ici l'identifiant du client. La détection des doublons fait écarter par la rubrique un message dont l'ID de message a déjà été vu pendant la fenêtre de détection, qui est de 10 minutes par défaut. Le niveau Standard prend en charge les sessions et la détection des doublons, et 20 Ko est inférieur à sa limite de taille de message.
references:
  - title: Message sessions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/message-sessions
  - title: Duplicate detection in Azure Service Bus
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/duplicate-detection
