id: az305-4c-net-outbound-fqdn
objective: "4.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware uses a hub-and-spoke topology in one Azure region. The virtual machines in the spoke virtual networks need outbound internet access, but only to an approved list of fully qualified domain names such as `*.ubuntu.com` and `api.fabrikam.com`.

    You need to recommend an outbound connectivity solution. The solution must meet the following requirements:

    - Outbound traffic must be allowed or denied according to the destination FQDN.
    - Allowed and denied connections must be logged in one place for all the spokes.
    - The rules must be administered centrally.

    What should you recommend?
  fr: |
    Litware utilise une topologie hub-and-spoke dans une région Azure. Les machines virtuelles des réseaux virtuels spokes ont besoin d'un accès sortant à Internet, mais uniquement vers une liste approuvée de noms de domaine complets tels que `*.ubuntu.com` et `api.fabrikam.com`.

    Vous devez recommander une solution de connectivité sortante. La solution doit répondre aux exigences suivantes :

    - Le trafic sortant doit être autorisé ou refusé selon le nom de domaine complet (FQDN) de destination.
    - Les connexions autorisées et refusées doivent être journalisées à un seul endroit pour tous les spokes.
    - Les règles doivent être administrées de façon centralisée.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Firewall in the hub, with a default route on the spoke subnets", fr: "Pare-feu Azure dans le hub, avec un itinéraire par défaut sur les sous-réseaux des spokes" } }
    - { id: b, text: { en: "A NAT gateway in each spoke, with network security groups on the subnets", fr: "Une passerelle NAT dans chaque spoke, avec des groupes de sécurité réseau sur les sous-réseaux" } }
    - { id: c, text: { en: "Application Gateway in the hub, with a web application firewall policy", fr: "Application Gateway dans le hub, avec une stratégie de pare-feu d'applications web" } }
    - { id: d, text: { en: "Network security groups on the spoke subnets, with service tag rules", fr: "Des groupes de sécurité réseau sur les sous-réseaux des spokes, avec des règles à étiquettes de service" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Firewall is a central, stateful firewall whose application rules allow or deny outbound HTTP and HTTPS traffic by FQDN, including wildcards, and whose logs record every allowed and denied connection. A user-defined route for 0.0.0.0/0 on the spoke subnets sends the internet-bound traffic of all the spokes to the firewall in the hub.
    fr: |
      Le Pare-feu Azure est un pare-feu central avec état dont les règles d'application autorisent ou refusent le trafic HTTP et HTTPS sortant par FQDN, caractères génériques compris, et dont les journaux enregistrent chaque connexion autorisée ou refusée. Un itinéraire défini par l'utilisateur pour 0.0.0.0/0 sur les sous-réseaux des spokes envoie le trafic à destination d'Internet de tous les spokes vers le pare-feu du hub.
  options:
    b:
      en: A NAT gateway provides outbound addresses without filtering, and network security groups filter on IP addresses, ports and service tags, not on FQDNs.
      fr: Une passerelle NAT fournit des adresses sortantes sans filtrage, et les groupes de sécurité réseau filtrent sur des adresses IP, des ports et des étiquettes de service, pas sur des FQDN.
    c:
      en: Application Gateway is a reverse proxy for inbound web traffic to published applications; it doesn't filter the outbound traffic of virtual machines.
      fr: Application Gateway est un proxy inverse pour le trafic web entrant vers des applications publiées ; il ne filtre pas le trafic sortant des machines virtuelles.
    d:
      en: Service tags represent the address ranges of Azure services, not arbitrary internet FQDNs, and each network security group is managed separately.
      fr: Les étiquettes de service représentent les plages d'adresses de services Azure, pas des FQDN Internet quelconques, et chaque groupe de sécurité réseau est géré séparément.
