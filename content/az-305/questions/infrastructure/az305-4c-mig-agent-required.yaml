id: az305-4c-mig-agent-required
objective: "4.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to use Azure Migrate to rehost the following workloads as Azure virtual machines.

    | Workload | Servers |
    | --- | --- |
    | WL1 | 120 virtual machines on VMware vSphere, managed by vCenter Server |
    | WL2 | 80 virtual machines on Hyper-V hosts |
    | WL3 | 40 physical servers that run Windows Server |
    | WL4 | 60 Amazon EC2 instances |

    The agentless method must be used wherever Azure Migrate supports it.

    For which two workloads must you plan to install the Mobility service agent on each server?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit d'utiliser Azure Migrate pour réhéberger les charges de travail suivantes sous forme de machines virtuelles Azure.

    | Charge de travail | Serveurs |
    | --- | --- |
    | WL1 | 120 machines virtuelles sur VMware vSphere, gérées par vCenter Server |
    | WL2 | 80 machines virtuelles sur des hôtes Hyper-V |
    | WL3 | 40 serveurs physiques sous Windows Server |
    | WL4 | 60 instances Amazon EC2 |

    La méthode sans agent doit être utilisée partout où Azure Migrate la prend en charge.

    Pour quelles deux charges de travail devez-vous prévoir d'installer l'agent du service Mobilité sur chaque serveur ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "WL1" }
    - { id: b, text: "WL2" }
    - { id: c, text: "WL3" }
    - { id: d, text: "WL4" }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      Azure Migrate has no hypervisor to rely on for physical servers, and it migrates the virtual machines of other clouds, such as Amazon EC2 instances, as if they were physical servers. Both use the agent-based method: a replication appliance and the Mobility service agent on each server.
    fr: |
      Azure Migrate ne dispose d'aucun hyperviseur sur lequel s'appuyer pour les serveurs physiques, et il migre les machines virtuelles d'autres clouds, comme les instances Amazon EC2, comme s'il s'agissait de serveurs physiques. Les deux utilisent la méthode avec agent : une appliance de réplication et l'agent du service Mobilité sur chaque serveur.
  options:
    a:
      en: VMware virtual machines managed by vCenter Server can be replicated agentlessly from VMware snapshots by the Azure Migrate appliance.
      fr: Les machines virtuelles VMware gérées par vCenter Server peuvent être répliquées sans agent, à partir d'instantanés VMware, par l'appliance Azure Migrate.
    b:
      en: Hyper-V virtual machines are replicated by a provider installed on the Hyper-V hosts, with no agent in the machines.
      fr: Les machines virtuelles Hyper-V sont répliquées par un fournisseur installé sur les hôtes Hyper-V, sans agent dans les machines.
references:
  - title: Migrate machines as physical servers to Azure
    url: https://learn.microsoft.com/en-us/azure/migrate/tutorial-migrate-physical-virtual-machines
  - title: Agentless and Agent-based migration methods
    url: https://learn.microsoft.com/en-us/azure/migrate/server-migrate-overview
