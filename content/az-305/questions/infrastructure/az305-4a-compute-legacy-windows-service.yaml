id: az305-4a-compute-legacy-windows-service
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam plans to move a line-of-business application from an on-premises datacenter to Azure. The application runs as a Windows service and depends on a third-party driver that must be installed in the operating system. The vendor does not support any change to the application.

    You need to recommend a compute service for the application. The solution must minimize administrative effort while meeting the application requirements.

    What should you recommend?
  fr: |
    Fabrikam prévoit de déplacer une application métier d'un centre de données local vers Azure. L'application s'exécute en tant que service Windows et dépend d'un pilote tiers qui doit être installé dans le système d'exploitation. L'éditeur ne prend en charge aucune modification de l'application.

    Vous devez recommander un service de calcul pour l'application. La solution doit réduire au minimum l'effort d'administration tout en respectant les exigences de l'application.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Virtual Machines", fr: "Machines virtuelles Azure" } }
    - { id: b, text: Azure App Service }
    - { id: c, text: Azure Container Apps }
    - { id: d, text: Azure Functions }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Installing a driver and running an unmodified Windows service require control of the operating system, which only infrastructure as a service provides. Azure Virtual Machines is the lift-and-shift choice when a workload needs full control of the machine. The other services are more managed, but none of them gives access to the operating system.
    fr: |
      L'installation d'un pilote et l'exécution d'un service Windows non modifié exigent le contrôle du système d'exploitation, que seule l'infrastructure en tant que service fournit. Machines virtuelles Azure est le choix de migration lift-and-shift lorsqu'une charge de travail a besoin du contrôle complet de la machine. Les autres services sont plus managés, mais aucun ne donne accès au système d'exploitation.
  options:
    b:
      en: App Service hosts web apps and APIs on a managed platform where you can't install drivers or Windows services in the operating system.
      fr: App Service héberge des applications web et des API sur une plateforme managée où vous ne pouvez installer ni pilote ni service Windows dans le système d'exploitation.
    c:
      en: Container Apps runs containers on a serverless platform; a driver installed in the host operating system is out of reach, and the application would have to be repackaged.
      fr: Container Apps exécute des conteneurs sur une plateforme serverless ; un pilote installé dans le système d'exploitation hôte est hors de portée, et l'application devrait être réempaquetée.
    d:
      en: Functions runs short event-driven code; it can't host an existing Windows service and its driver.
      fr: Functions exécute du code court piloté par les événements ; il ne peut pas héberger un service Windows existant et son pilote.
references:
  - title: Choose an Azure compute service
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/compute-decision-tree
