id: az305-4b-api-internal-waf
objective: "4.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum plans to publish, through Azure API Management, APIs whose back ends run in an on-premises datacenter. The datacenter is connected to an Azure virtual network through ExpressRoute.

    You need to recommend a design that meets the following requirements:

    - The gateway, the developer portal and the management endpoint of API Management must be reachable only from the virtual network and the networks connected to it.
    - Internal applications must call the APIs through ExpressRoute.
    - Partners must call some APIs from the internet, and their requests must be inspected by a web application firewall (WAF).

    How should you complete the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de publier, via Azure API Management, des API dont les services principaux s'exécutent dans un centre de données local. Le centre de données est connecté à un réseau virtuel Azure par ExpressRoute.

    Vous devez recommander une conception qui répond aux exigences suivantes :

    - La passerelle, le portail des développeurs et le point de terminaison de gestion d'API Management ne doivent être accessibles que depuis le réseau virtuel et les réseaux qui y sont connectés.
    - Les applications internes doivent appeler les API par ExpressRoute.
    - Des partenaires doivent appeler certaines API depuis Internet, et leurs requêtes doivent être inspectées par un pare-feu d'applications web (WAF).

    Comment devez-vous compléter la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Deploy API Management in the [[tier]] tier.

      Connect the instance to the virtual network by using [[mode]].

      Publish the APIs to the partners through [[edge]].
    fr: |
      Déployez API Management au niveau [[tier]].

      Connectez l'instance au réseau virtuel à l'aide de [[mode]].

      Publiez les API auprès des partenaires via [[edge]].
  slots:
    - id: tier
      options:
        - { id: consumption, text: Consumption }
        - { id: basicv2, text: Basic v2 }
        - { id: stdv2, text: Standard v2 }
        - { id: premium, text: Premium }
    - id: mode
      options:
        - { id: external, text: { en: "virtual network injection in external mode", fr: "l'injection dans le réseau virtuel en mode externe" } }
        - { id: internal, text: { en: "virtual network injection in internal mode", fr: "l'injection dans le réseau virtuel en mode interne" } }
        - { id: integration, text: { en: "outbound virtual network integration", fr: "l'intégration au réseau virtuel en sortie" } }
    - id: edge
      options:
        - { id: tm, text: { en: "an Azure Traffic Manager profile", fr: "un profil Azure Traffic Manager" } }
        - { id: lb, text: { en: "a public Azure Load Balancer", fr: "un équilibreur de charge Azure public" } }
        - { id: appgw, text: { en: "an Azure Application Gateway with WAF", fr: "une passerelle Azure Application Gateway avec WAF" } }
        - { id: nat, text: { en: "an Azure NAT Gateway", fr: "une passerelle Azure NAT Gateway" } }
answer:
  values: { tier: premium, mode: internal, edge: appgw }
explanation:
  correct:
    en: "Virtual network injection in internal mode places the gateway, the developer portal and the management plane behind an internal load balancer, reachable only from the virtual network, peered networks and ExpressRoute or VPN connections; among the listed tiers, only Premium supports injection. For internet clients, Microsoft recommends an internet-facing Application Gateway with WAF in front of the internal instance: it is the only public entry point and it inspects the requests."
    fr: "L'injection dans le réseau virtuel en mode interne place la passerelle, le portail des développeurs et le plan de gestion derrière un équilibreur de charge interne, accessibles uniquement depuis le réseau virtuel, les réseaux reliés par peering et les connexions ExpressRoute ou VPN ; parmi les niveaux proposés, seul Premium prend en charge l'injection. Pour les clients Internet, Microsoft recommande une passerelle Application Gateway avec WAF exposée à Internet devant l'instance interne : c'est le seul point d'entrée public et elle inspecte les requêtes."
  options:
    external: { en: "In external mode the API Management endpoints stay reachable from the public internet.", fr: "En mode externe, les points de terminaison d'API Management restent accessibles depuis Internet." }
    integration: { en: "Outbound integration only lets the gateway reach private back ends; its inbound endpoint remains public.", fr: "L'intégration en sortie permet seulement à la passerelle d'atteindre des services principaux privés ; son point de terminaison entrant reste public." }
    stdv2: { en: "Standard v2 supports outbound integration and inbound private endpoints for the gateway, not the injection of the whole service.", fr: "Standard v2 prend en charge l'intégration en sortie et les points de terminaison privés entrants pour la passerelle, pas l'injection de l'ensemble du service." }
    tm: { en: "Traffic Manager is a DNS-based load balancer; it does not inspect requests and cannot reach a private endpoint.", fr: "Traffic Manager est un équilibreur de charge basé sur DNS ; il n'inspecte pas les requêtes et ne peut pas atteindre un point de terminaison privé." }
references:
  - title: Use a virtual network to secure inbound or outbound traffic for Azure API Management
    url: https://learn.microsoft.com/en-us/azure/api-management/virtual-network-concepts
