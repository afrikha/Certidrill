id: az305-4a-msg-queues-compared
objective: "4.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is comparing queues in Azure Queue Storage with queues in Azure Service Bus for a new application.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys compare les files d'attente du Stockage File d'attente Azure avec les files d'attente d'Azure Service Bus pour une nouvelle application.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A queue in Azure Queue Storage guarantees first-in, first-out delivery.
        fr: Une file d'attente du Stockage File d'attente Azure garantit une remise premier entré, premier sorti.
    - id: s2
      text:
        en: A queue in Azure Queue Storage can store more than 80 GB of messages.
        fr: Une file d'attente du Stockage File d'attente Azure peut stocker plus de 80 Go de messages.
    - id: s3
      text:
        en: A Service Bus queue can deliver each message at most once, by using the Receive and delete mode.
        fr: Une file d'attente Service Bus peut remettre chaque message au plus une fois, grâce au mode Receive and delete.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Queue Storage gives no ordering guarantee: messages usually come out in order, but they can be out of order; guaranteed first-in, first-out needs Service Bus sessions. A Queue Storage queue is limited only by the capacity of the storage account, whereas a Service Bus queue holds from 1 GB to 80 GB. Service Bus offers at-least-once delivery with the Peek-lock mode and at-most-once delivery with the Receive and delete mode.
    fr: |
      Le Stockage File d'attente ne donne aucune garantie d'ordre : les messages sortent généralement dans l'ordre, mais peuvent être désordonnés ; un ordre premier entré, premier sorti garanti exige les sessions Service Bus. Une file d'attente du Stockage File d'attente n'est limitée que par la capacité du compte de stockage, alors qu'une file d'attente Service Bus contient de 1 Go à 80 Go. Service Bus propose une remise au moins une fois avec le mode Peek-lock et une remise au plus une fois avec le mode Receive and delete.
references:
  - title: Storage queues and Service Bus queues - compared and contrasted
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-azure-and-service-bus-queues-compared-contrasted
