id: az305-cs1b-partner-gateway
objective: "4.2.3"
type: single
caseStudy: az305-cs1b-blue-yonder
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend an API gateway for the partner API. The solution must meet the requirements of the partner API.

    What should you recommend?
  fr: |
    Vous devez recommander une passerelle d'API pour l'API partenaires. La solution doit répondre aux exigences de l'API partenaires.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure API Management in the Premium tier", fr: "Azure API Management au niveau Premium" } }
    - { id: b, text: { en: "Azure API Management in the Standard v2 tier", fr: "Azure API Management au niveau Standard v2" } }
    - { id: c, text: { en: "Azure API Management in the Consumption tier", fr: "Azure API Management au niveau Consumption" } }
    - { id: d, text: { en: "Azure Front Door in the Premium tier", fr: "Azure Front Door au niveau Premium" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure API Management issues a subscription key to each consumer, enforces quotas per key with policies and publishes a developer portal where the agencies sign up and read the documentation. Among its tiers, the Premium tier is the one that supports multi-region deployment: a single instance, managed in one place, has regional gateways in West Europe and East US 2.
    fr: |
      Azure API Management délivre une clé d'abonnement à chaque consommateur, applique des quotas par clé avec des stratégies et publie un portail des développeurs où les agences s'inscrivent et lisent la documentation. Parmi ses niveaux, Premium est celui qui prend en charge le déploiement multirégion : une seule instance, gérée à un seul endroit, dispose de passerelles régionales dans West Europe et East US 2.
  options:
    b:
      en: Standard v2 provides keys, quotas and the developer portal, but an instance is deployed in a single region.
      fr: Standard v2 fournit les clés, les quotas et le portail des développeurs, mais une instance est déployée dans une seule région.
    c:
      en: A Consumption instance runs in a single region and doesn't include the developer portal.
      fr: Une instance Consumption s'exécute dans une seule région et ne comprend pas le portail des développeurs.
    d:
      en: Front Door routes and protects HTTP traffic across regions, but it doesn't issue keys per consumer, apply quotas per agency or publish a developer portal.
      fr: Front Door achemine et protège le trafic HTTP entre les régions, mais il ne délivre pas de clés par consommateur, n'applique pas de quotas par agence et ne publie pas de portail des développeurs.
references:
  - title: Feature-based comparison of the Azure API Management tiers
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-features
