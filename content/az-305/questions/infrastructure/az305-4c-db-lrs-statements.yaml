id: az305-4c-db-lrs-statements
objective: "4.3.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Adatum plans to migrate a 300-GB database named **DB1** from an on-premises SQL Server 2017 instance to Azure SQL Managed Instance by using Log Replay Service in continuous mode.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de migrer une base de données de 300 Go nommée **DB1** d'une instance SQL Server 2017 locale vers Azure SQL Managed Instance à l'aide de Log Replay Service en mode continu.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Log Replay Service restores DB1 from backup files that Adatum uploads to Azure Blob Storage.
        fr: Log Replay Service restaure DB1 à partir de fichiers de sauvegarde qu'Adatum charge dans le Stockage Blob Azure.
    - id: s2
      text:
        en: The reporting team can run read-only queries against DB1 on the managed instance before the cutover.
        fr: L'équipe de reporting peut exécuter des requêtes en lecture seule sur DB1 dans l'instance managée avant la bascule.
    - id: s3
      text:
        en: The application can keep writing to DB1 on SQL Server until Adatum starts the cutover.
        fr: L'application peut continuer d'écrire dans DB1 sur SQL Server jusqu'à ce qu'Adatum lance la bascule.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Log Replay Service restores the full, differential and log backups that you copy to a Blob Storage container. In continuous mode it keeps scanning the container and restoring new log backups, so the source stays in use until the cutover. During that time the database on the managed instance is in a restoring state and can't be read; a readable target during migration is a capability of the Managed Instance link.
    fr: |
      Log Replay Service restaure les sauvegardes complètes, différentielles et de journaux que vous copiez dans un conteneur du Stockage Blob. En mode continu, il continue d'analyser le conteneur et de restaurer les nouvelles sauvegardes de journaux : la source reste utilisée jusqu'à la bascule. Pendant ce temps, la base de données de l'instance managée est en cours de restauration et ne peut pas être lue ; une cible lisible pendant la migration est une capacité du lien Managed Instance.
references:
  - title: Overview of Log Replay Service with Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/log-replay-service-overview
