id: az305-4b-api-partner-gateway
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso hosts REST APIs on Azure App Service and on Azure Kubernetes Service (AKS). Contoso plans to open these APIs to external partners.

    You need to recommend a solution that meets the following requirements:

    - Partners must discover the APIs, read their documentation and obtain their own key in a self-service portal.
    - A monthly call quota must be enforced for each partner.
    - Contoso must be able to replace a back end without changing the URL that the partners call.

    What should you recommend?
  fr: |
    Contoso héberge des API REST sur Azure App Service et sur Azure Kubernetes Service (AKS). Contoso prévoit d'ouvrir ces API à des partenaires externes.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Les partenaires doivent découvrir les API, lire leur documentation et obtenir leur propre clé dans un portail en libre-service.
    - Un quota mensuel d'appels doit être appliqué à chaque partenaire.
    - Contoso doit pouvoir remplacer un service principal sans changer l'URL appelée par les partenaires.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: Azure API Management }
    - { id: b, text: Azure Front Door }
    - { id: c, text: Azure Application Gateway }
    - { id: d, text: Azure API Center }
answer: { optionId: a }
explanation:
  correct:
    en: "API Management places a gateway in front of the back ends, so they can change without affecting consumers. Its developer portal publishes the documentation and lets partners subscribe to products and get subscription keys, and its policies enforce quotas per subscription."
    fr: "API Management place une passerelle devant les services principaux, qui peuvent ainsi changer sans affecter les consommateurs. Son portail des développeurs publie la documentation et permet aux partenaires de s'abonner à des produits et d'obtenir des clés d'abonnement, et ses stratégies appliquent des quotas par abonnement."
  options:
    c:
      en: "Application Gateway load-balances and protects HTTP traffic in a region; it has no developer portal, no subscription keys and no per-consumer quotas."
      fr: "Application Gateway équilibre et protège le trafic HTTP dans une région ; il n'a ni portail des développeurs, ni clés d'abonnement, ni quotas par consommateur."
    b:
      en: "Front Door is a global entry point with caching and a web application firewall; it does not publish APIs to developers or meter their calls per partner."
      fr: "Front Door est un point d'entrée mondial avec mise en cache et pare-feu d'applications web ; il ne publie pas d'API auprès de développeurs et ne compte pas leurs appels par partenaire."
    d:
      en: "API Center is an inventory for the discovery and design-time governance of APIs; it is not a gateway and enforces nothing at run time."
      fr: "API Center est un inventaire destiné à la découverte et à la gouvernance des API au moment de la conception ; ce n'est pas une passerelle et il n'applique rien à l'exécution."
references:
  - title: What is Azure API Management?
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-key-concepts
