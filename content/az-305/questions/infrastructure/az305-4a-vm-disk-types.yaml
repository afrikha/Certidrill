id: az305-4a-vm-disk-types
objective: "4.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam plans to deploy two database virtual machines named VM1 and VM2 in an availability zone. Each virtual machine will have one data disk for the database files.

    You need to recommend a managed disk type for each disk. The solution must meet the following requirements:

    - The data disk of VM1 must deliver 60,000 IOPS with sub-millisecond latency, at the lowest possible cost.
    - The data disk of VM2 must deliver 250,000 IOPS.
    - The operating system disks must use the highest-performance disk type that is supported for operating system disks.

    What should you recommend? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit de déployer deux machines virtuelles de base de données nommées VM1 et VM2 dans une zone de disponibilité. Chaque machine virtuelle aura un disque de données pour les fichiers de la base de données.

    Vous devez recommander un type de disque managé pour chaque disque. La solution doit répondre aux exigences suivantes :

    - Le disque de données de VM1 doit fournir 60 000 IOPS avec une latence inférieure à la milliseconde, au coût le plus bas possible.
    - Le disque de données de VM2 doit fournir 250 000 IOPS.
    - Les disques de système d'exploitation doivent utiliser le type de disque le plus performant pris en charge pour les disques de système d'exploitation.

    Que devez-vous recommander ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Data disk of VM1: [[d1]]
      Data disk of VM2: [[d2]]
      Operating system disks: [[os]]
    fr: |
      Disque de données de VM1 : [[d1]]
      Disque de données de VM2 : [[d2]]
      Disques de système d'exploitation : [[os]]
  slots:
    - id: d1
      options:
        - { id: stdssd, text: { en: "Standard SSD", fr: "SSD Standard" } }
        - { id: prem, text: { en: "Premium SSD", fr: "SSD Premium" } }
        - { id: premv2, text: { en: "Premium SSD v2", fr: "SSD Premium v2" } }
        - { id: ultra, text: Ultra Disk }
    - id: d2
      options:
        - { id: stdssd, text: { en: "Standard SSD", fr: "SSD Standard" } }
        - { id: prem, text: { en: "Premium SSD", fr: "SSD Premium" } }
        - { id: premv2, text: { en: "Premium SSD v2", fr: "SSD Premium v2" } }
        - { id: ultra, text: Ultra Disk }
    - id: os
      options:
        - { id: stdssd, text: { en: "Standard SSD", fr: "SSD Standard" } }
        - { id: prem, text: { en: "Premium SSD", fr: "SSD Premium" } }
        - { id: premv2, text: { en: "Premium SSD v2", fr: "SSD Premium v2" } }
        - { id: ultra, text: Ultra Disk }
answer:
  values: { d1: premv2, d2: ultra, os: prem }
explanation:
  correct:
    en: |
      Premium SSD stops at 20,000 IOPS per disk. Premium SSD v2 reaches 80,000 IOPS with sub-millisecond latency and is the better price-performance choice, so it fits VM1; only Ultra Disk, with up to 400,000 IOPS, covers the 250,000 IOPS of VM2. Neither Ultra Disk nor Premium SSD v2 can be an operating system disk: Premium SSD is the fastest type allowed there.
    fr: |
      Un SSD Premium plafonne à 20 000 IOPS par disque. Le SSD Premium v2 atteint 80 000 IOPS avec une latence inférieure à la milliseconde et offre le meilleur rapport prix-performances : il convient à VM1 ; seul Ultra Disk, avec jusqu'à 400 000 IOPS, couvre les 250 000 IOPS de VM2. Ni Ultra Disk ni le SSD Premium v2 ne peuvent servir de disque de système d'exploitation : le SSD Premium est le type le plus rapide autorisé pour cet usage.
  options:
    stdssd:
      en: Standard SSD is limited to 6,000 IOPS and targets web servers and lightly used applications.
      fr: Le SSD Standard est limité à 6 000 IOPS et vise les serveurs web et les applications peu utilisées.
references:
  - title: Azure managed disk types
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types
