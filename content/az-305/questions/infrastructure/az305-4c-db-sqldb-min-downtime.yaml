id: az305-4c-db-sqldb-min-downtime
objective: "4.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs an order database of 150 GB on an on-premises SQL Server 2017 instance. The application has been refactored and uses only database-scoped features. Every table has a primary key.

    You need to recommend a migration method. The solution must meet the following requirements:

    - The target must be a single database in Azure SQL Database.
    - The application must keep writing to SQL Server while the data is copied.
    - The downtime must be limited to the few minutes of the final cutover.

    What should you recommend?
  fr: |
    Fabrikam exécute une base de données de commandes de 150 Go sur une instance SQL Server 2017 locale. L'application a été refactorisée et n'utilise que des fonctionnalités limitées à la base de données. Chaque table possède une clé primaire.

    Vous devez recommander une méthode de migration. La solution doit répondre aux exigences suivantes :

    - La cible doit être une base de données unique dans Azure SQL Database.
    - L'application doit continuer d'écrire dans SQL Server pendant la copie des données.
    - L'interruption doit se limiter aux quelques minutes de la bascule finale.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Database Migration Service", fr: "Azure Database Migration Service" } }
    - { id: b, text: { en: "The Managed Instance link", fr: "Le lien Managed Instance" } }
    - { id: c, text: { en: "A BACPAC export and import", fr: "Une exportation et une importation BACPAC" } }
    - { id: d, text: { en: "Transactional replication", fr: "La réplication transactionnelle" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With transactional replication, the SQL Server instance publishes the tables and Azure SQL Database subscribes to them: an initial snapshot is applied, then the changes flow continuously while the application keeps working. At cutover, you stop the application, let the last transactions arrive and redirect the connections, so the downtime is a few minutes.
    fr: |
      Avec la réplication transactionnelle, l'instance SQL Server publie les tables et Azure SQL Database s'y abonne : un instantané initial est appliqué, puis les modifications circulent en continu pendant que l'application continue de fonctionner. À la bascule, vous arrêtez l'application, laissez arriver les dernières transactions et redirigez les connexions : l'interruption dure quelques minutes.
  options:
    a:
      en: For an Azure SQL Database target, Azure Database Migration Service only performs offline migrations, during which the application must stop writing.
      fr: Pour une cible Azure SQL Database, Azure Database Migration Service n'effectue que des migrations hors connexion, pendant lesquelles l'application doit cesser d'écrire.
    b:
      en: The Managed Instance link replicates to Azure SQL Managed Instance only, not to Azure SQL Database.
      fr: Le lien Managed Instance réplique uniquement vers Azure SQL Managed Instance, pas vers Azure SQL Database.
    c:
      en: A BACPAC file is a point-in-time copy; the application must stay stopped from the export to the end of the import.
      fr: Un fichier BACPAC est une copie à un instant donné ; l'application doit rester arrêtée de l'exportation jusqu'à la fin de l'importation.
references:
  - title: "Migration overview: SQL Server to Azure SQL Database"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/migration-guides/database/sql-server-to-sql-database-overview
  - title: Azure Database Migration Service supported scenarios
    url: https://learn.microsoft.com/en-us/azure/dms/resource-scenario-status
