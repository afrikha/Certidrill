id: az305-4d-sec-controls-hotarea
objective: "4.4.4"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a hub-spoke network in one Azure region. The security architect lists the network security controls that the design can use, as shown in the following table.

    You need to recommend the control that meets each requirement.

    Answer each prompt by selecting the appropriate control in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un réseau hub-and-spoke dans une région Azure. L'architecte de sécurité liste les contrôles de sécurité réseau que la conception peut utiliser, comme le montre le tableau suivant.

    Vous devez recommander le contrôle qui répond à chaque exigence.

    Répondez à chaque consigne en sélectionnant le contrôle approprié dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text:
        en: "Block SQL injection and cross-site scripting attempts against an HTTPS application that is published in the region"
        fr: "Bloquer les tentatives d'injection SQL et de scripts intersites contre une application HTTPS publiée dans la région"
    - id: p2
      text:
        en: "Allow the virtual machines of all the spokes to reach only *.northwindtraders.com on the internet, and log every allowed and denied connection centrally"
        fr: "Autoriser les machines virtuelles de tous les spokes à n'atteindre que *.northwindtraders.com sur Internet, et journaliser de façon centralisée chaque connexion autorisée ou refusée"
  grid:
    header:
      - { en: "Control", fr: "Contrôle" }
      - { en: "Where it is deployed", fr: "Où il est déployé" }
    rows:
      - [{ text: { en: "Network security group", fr: "Groupe de sécurité réseau" }, area: nsg }, { text: { en: "Each spoke subnet", fr: "Chaque sous-réseau spoke" } }]
      - [{ text: { en: "Azure Firewall", fr: "Pare-feu Azure" }, area: fw }, { text: { en: "Hub virtual network", fr: "Réseau virtuel hub" } }]
      - [{ text: { en: "Web application firewall policy", fr: "Stratégie de pare-feu d'applications web" }, area: waf }, { text: { en: "Application Gateway WAF_v2 in a spoke", fr: "Application Gateway WAF_v2 dans un spoke" } }]
      - [{ text: "Azure DDoS Network Protection", area: ddos }, { text: { en: "Public IP addresses of the virtual networks", fr: "Adresses IP publiques des réseaux virtuels" } }]
      - [{ text: { en: "Private endpoint", fr: "Point de terminaison privé" }, area: pe }, { text: { en: "Each spoke that uses a PaaS service", fr: "Chaque spoke qui utilise un service PaaS" } }]
answer:
  values: { p1: waf, p2: fw }
explanation:
  correct:
    en: "A web application firewall inspects HTTP requests at layer 7 and blocks SQL injection and cross-site scripting with its managed rules; for an application published in one region it runs on Application Gateway WAF_v2. Azure Firewall in the hub filters outbound traffic by FQDN for all the spokes whose routes point to it and logs every decision centrally. NSGs can't filter by FQDN, and DDoS Network Protection only mitigates layer 3 and 4 attacks."
    fr: "Un pare-feu d'applications web inspecte les requêtes HTTP en couche 7 et bloque l'injection SQL et les scripts intersites grâce à ses règles managées ; pour une application publiée dans une seule région, il s'exécute sur Application Gateway WAF_v2. Le Pare-feu Azure du hub filtre le trafic sortant par FQDN pour tous les spokes dont les itinéraires pointent vers lui et journalise chaque décision de façon centralisée. Les NSG ne savent pas filtrer par FQDN, et DDoS Network Protection n'atténue que les attaques des couches 3 et 4."
references:
  - title: Choose the right Azure Firewall SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/firewall/choose-firewall-sku
  - title: Azure DDoS Protection Overview
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-overview
