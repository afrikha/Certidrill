id: az305-4d-lb-tm-nested
objective: "4.4.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank provides a TCP-based market data service to financial institutions. The service is deployed in four Azure regions: France Central and Germany West Central in Europe, and East US and West US in North America. Clients connect by using the DNS name of the service.

    You plan to use Azure Traffic Manager. You need to recommend a configuration that meets the following requirements:

    - Clients whose DNS queries come from Europe must be served only by the European regions, and clients from North America only by the North American regions.
    - Within each geography, one region must serve all the traffic, and the other region must receive traffic only if the first one fails.

    Which routing methods should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank fournit un service de données de marché basé sur TCP à des institutions financières. Le service est déployé dans quatre régions Azure : France Central et Germany West Central en Europe, East US et West US en Amérique du Nord. Les clients se connectent avec le nom DNS du service.

    Vous prévoyez d'utiliser Azure Traffic Manager. Vous devez recommander une configuration qui répond aux exigences suivantes :

    - Les clients dont les requêtes DNS proviennent d'Europe ne doivent être servis que par les régions européennes, et les clients d'Amérique du Nord que par les régions nord-américaines.
    - Dans chaque zone géographique, une région doit servir tout le trafic, et l'autre région ne doit recevoir du trafic qu'en cas de panne de la première.

    Quelles méthodes de routage devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Parent profile, with one nested endpoint per geography: [[parent]]

      Child profile of each geography, with its two regional endpoints: [[child]]
    fr: |
      Profil parent, avec un point de terminaison imbriqué par zone géographique : [[parent]]

      Profil enfant de chaque zone géographique, avec ses deux points de terminaison régionaux : [[child]]
  slots:
    - id: parent
      options:
        - { id: p-performance, text: "Performance" }
        - { id: p-geographic, text: "Geographic" }
        - { id: p-priority, text: "Priority" }
        - { id: p-subnet, text: "Subnet" }
    - id: child
      options:
        - { id: c-weighted, text: "Weighted" }
        - { id: c-multivalue, text: "MultiValue" }
        - { id: c-priority, text: "Priority" }
        - { id: c-performance, text: "Performance" }
answer:
  values: { parent: p-geographic, child: c-priority }
explanation:
  correct:
    en: |
      Geographic routing maps the region where the DNS query originates to one endpoint, which meets the data sovereignty requirement. Because each geographic region maps to a single endpoint, Microsoft recommends using nested endpoints whose child profiles contain at least two endpoints. Priority routing in each child profile sends all the traffic to the primary region and fails over to the other region only when the primary is unhealthy.
    fr: |
      Le routage Geographic associe la région d'origine de la requête DNS à un point de terminaison, ce qui répond à l'exigence de souveraineté des données. Comme chaque région géographique ne correspond qu'à un seul point de terminaison, Microsoft recommande d'utiliser des points de terminaison imbriqués dont les profils enfants contiennent au moins deux points de terminaison. Le routage Priority dans chaque profil enfant envoie tout le trafic vers la région principale et ne bascule vers l'autre région qu'en cas de défaillance de la principale.
  options:
    p-performance:
      en: |
        Performance routing chooses the endpoint with the lowest latency; a European client could be sent to North America if the European regions are unhealthy or slower.
      fr: |
        Le routage Performance choisit le point de terminaison à la latence la plus faible ; un client européen pourrait être envoyé en Amérique du Nord si les régions européennes sont défaillantes ou plus lentes.
    p-subnet:
      en: |
        Subnet routing maps client IP address ranges listed by hand; it doesn't map geographies.
      fr: |
        Le routage Subnet associe des plages d'adresses IP clientes listées manuellement ; il n'associe pas de zones géographiques.
    c-weighted:
      en: |
        Weighted routing splits the traffic between both regions instead of keeping the second one for failover.
      fr: |
        Le routage Weighted répartit le trafic entre les deux régions au lieu de réserver la seconde au basculement.
    c-multivalue:
      en: |
        MultiValue returns several healthy endpoints in one answer, so both regions receive traffic.
      fr: |
        MultiValue renvoie plusieurs points de terminaison sains dans une réponse : les deux régions reçoivent du trafic.
references:
  - title: Traffic Manager routing methods
    url: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-routing-methods
  - title: Nested Traffic Manager profiles
    url: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-nested-profiles
