id: az305-4d-perf-match
objective: "4.4.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders reports three network performance issues in its Azure environment. The environment is connected to the on-premises datacenter through a site-to-site VPN.

    Which solution should you recommend for each issue? To answer, drag the appropriate solutions to the correct issues. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders signale trois problèmes de performances réseau dans son environnement Azure. L'environnement est connecté au centre de données local par un VPN site à site.

    Quelle solution devez-vous recommander pour chaque problème ? Pour répondre, faites glisser les solutions appropriées vers les problèmes correspondants. Chaque solution peut être utilisée une seule fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: accel, text: { en: "Accelerated networking", fr: "Mise en réseau accélérée" } }
    - { id: nat, text: "Azure NAT Gateway" }
    - { id: connmon, text: { en: "Connection monitor in Azure Network Watcher", fr: "Moniteur de connexion dans Azure Network Watcher" } }
    - { id: ppg, text: { en: "Proximity placement group", fr: "Groupe de placement de proximité" } }
    - { id: fastpath, text: "ExpressRoute FastPath" }
    - { id: routepref, text: { en: "Internet routing preference", fr: "Préférence de routage Internet" } }
  targets:
    - id: t1
      text: { en: "Firewall NVAs deployed across three availability zones must process more packets per second with less host CPU", fr: "Des NVA de pare-feu déployées sur trois zones de disponibilité doivent traiter plus de paquets par seconde avec moins de processeur de l'hôte" } 
    - id: t2
      text: { en: "During peaks, outbound connections from a subnet of virtual machines to a SaaS API fail because of SNAT port exhaustion", fr: "Pendant les pics, les connexions sortantes d'un sous-réseau de machines virtuelles vers une API SaaS échouent à cause de l'épuisement des ports SNAT" }
    - id: t3
      text: { en: "The latency and packet loss between on-premises servers and Azure virtual machines must be measured continuously to find where the path degrades", fr: "La latence et la perte de paquets entre des serveurs locaux et des machines virtuelles Azure doivent être mesurées en continu pour trouver où le chemin se dégrade" }
answer:
  mapping: { t1: accel, t2: nat, t3: connmon }
explanation:
  correct:
    en: |
      Accelerated networking bypasses the host virtual switch with SR-IOV, which raises the packets per second and lowers the CPU used for networking; a proximity placement group would not help and can't span zones. A NAT gateway provides a large pool of SNAT ports from its public IP addresses and is the standard fix for SNAT exhaustion. Connection monitor measures latency, packet loss and round-trip time between Azure and on-premises endpoints and shows the hops of the path. FastPath requires ExpressRoute, and the routing preference changes the internet egress path, not these issues.
    fr: |
      La mise en réseau accélérée contourne le commutateur virtuel de l'hôte grâce à SR-IOV, ce qui augmente le nombre de paquets par seconde et réduit le processeur consacré au réseau ; un groupe de placement de proximité n'aiderait pas et ne peut pas s'étendre sur plusieurs zones. Une passerelle NAT fournit un grand nombre de ports SNAT à partir de ses adresses IP publiques et règle classiquement l'épuisement SNAT. Le moniteur de connexion mesure la latence, la perte de paquets et le temps aller-retour entre des points de terminaison Azure et locaux, et montre les tronçons du chemin. FastPath exige ExpressRoute, et la préférence de routage modifie le chemin de sortie vers Internet, pas ces problèmes.
references:
  - title: Azure Accelerated Networking overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/accelerated-networking-overview
  - title: Connection monitor overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview
