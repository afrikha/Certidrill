id: az305-4b-cfg-region-outage
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs an application in the West Europe and North Europe regions. The instances of both regions read their settings from an Azure App Configuration store.

    You need to recommend a configuration for the store. The solution must meet the following requirements:

    - The instances must still be able to read their settings if West Europe is unavailable.
    - The instances must connect to the store through private endpoints.
    - The store must be covered by an SLA.
    - The cost must be minimized.

    What should you recommend?
  fr: |
    Tailspin Toys exécute une application dans les régions West Europe et North Europe. Les instances des deux régions lisent leurs paramètres dans un magasin Azure App Configuration.

    Vous devez recommander une configuration pour le magasin. La solution doit répondre aux exigences suivantes :

    - Les instances doivent pouvoir continuer à lire leurs paramètres si West Europe est indisponible.
    - Les instances doivent se connecter au magasin par des points de terminaison privés.
    - Le magasin doit être couvert par un SLA.
    - Le coût doit être réduit au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Free tier store in each region", fr: "Un magasin de niveau Free dans chaque région" } }
    - { id: b, text: { en: "A Developer tier store in West Europe with a replica in North Europe", fr: "Un magasin de niveau Developer dans West Europe avec un réplica dans North Europe" } }
    - { id: c, text: { en: "A Standard tier store in West Europe with a replica in North Europe", fr: "Un magasin de niveau Standard dans West Europe avec un réplica dans North Europe" } }
    - { id: d, text: { en: "A Premium tier store in West Europe with a replica in North Europe", fr: "Un magasin de niveau Premium dans West Europe avec un réplica dans North Europe" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Geo-replication creates a replica of the store, with its own endpoint, in another region; the replicas of the unaffected regions stay accessible during a regional outage. The Standard tier is the least expensive tier that offers geo-replication, private endpoints and an SLA (99.95 % with geo-replication)."
    fr: "La géoréplication crée un réplica du magasin, doté de son propre point de terminaison, dans une autre région ; les réplicas des régions non touchées restent accessibles pendant une panne régionale. Le niveau Standard est le niveau le moins coûteux qui offre la géoréplication, les points de terminaison privés et un SLA (99,95 % avec la géoréplication)."
  options:
    a:
      en: "The Free tier has no SLA and no private endpoints, and two separate stores would have to be kept identical."
      fr: "Le niveau Free n'a ni SLA ni points de terminaison privés, et il faudrait maintenir deux magasins distincts à l'identique."
    b:
      en: "The Developer tier supports private endpoints but offers neither geo-replication nor an SLA."
      fr: "Le niveau Developer prend en charge les points de terminaison privés, mais n'offre ni géoréplication ni SLA."
    d:
      en: "The Premium tier meets the requirements, but it is priced for a higher SLA and for stores without a request quota, which are not required."
      fr: "Le niveau Premium répond aux exigences, mais son prix correspond à un SLA supérieur et à des magasins sans quota de requêtes, qui ne sont pas exigés."
references:
  - title: Azure App Configuration FAQ
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/faq
  - title: Geo-replication overview
    url: https://learn.microsoft.com/en-us/azure/azure-app-configuration/concept-geo-replication
