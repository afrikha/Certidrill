id: az305-cs4a-migration-strategies
objective: "4.3.1"
type: dropdown
caseStudy: az305-cs4a-relecloud
difficulty: 1
status: draft
stem:
  en: |
    You are documenting the migration plan of PayCloud with the Microsoft Cloud Adoption Framework for Azure.

    Which migration strategy does Relecloud apply to each component in the planned changes? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous documentez le plan de migration de PayCloud à l'aide de Microsoft Cloud Adoption Framework pour Azure.

    Quelle stratégie de migration Relecloud applique-t-elle à chaque composant dans les changements prévus ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Web portal and calculation engine: [[servers]]

      SQL-PAY: [[database]]

      Report server: [[reports]]
    fr: |
      Portail web et moteur de calcul : [[servers]]

      SQL-PAY : [[database]]

      Serveur de rapports : [[reports]]
  slots:
    - id: servers
      options:
        - { id: rearchitect, text: { en: "Rearchitect", fr: "Rearchitect (réarchitecturer)" } }
        - { id: rehost, text: { en: "Rehost", fr: "Rehost (réhéberger)" } }
        - { id: replace, text: { en: "Replace", fr: "Replace (remplacer)" } }
        - { id: replatform, text: { en: "Replatform", fr: "Replatform (changer de plateforme)" } }
        - { id: retain, text: { en: "Retain", fr: "Retain (conserver)" } }
    - id: database
      options:
        - { id: rearchitect, text: { en: "Rearchitect", fr: "Rearchitect (réarchitecturer)" } }
        - { id: rehost, text: { en: "Rehost", fr: "Rehost (réhéberger)" } }
        - { id: replace, text: { en: "Replace", fr: "Replace (remplacer)" } }
        - { id: replatform, text: { en: "Replatform", fr: "Replatform (changer de plateforme)" } }
        - { id: retain, text: { en: "Retain", fr: "Retain (conserver)" } }
    - id: reports
      options:
        - { id: rearchitect, text: { en: "Rearchitect", fr: "Rearchitect (réarchitecturer)" } }
        - { id: rehost, text: { en: "Rehost", fr: "Rehost (réhéberger)" } }
        - { id: replace, text: { en: "Replace", fr: "Replace (remplacer)" } }
        - { id: replatform, text: { en: "Replatform", fr: "Replatform (changer de plateforme)" } }
        - { id: retain, text: { en: "Retain", fr: "Retain (conserver)" } }
shuffle: false
answer:
  values: { servers: rehost, database: replatform, reports: replace }
explanation:
  correct:
    en: |
      Rehost moves a workload to Azure like for like, with minimal changes: the servers of the web portal and of the calculation engine become Azure virtual machines. Replatform moves a workload to a modern hosting environment with minimal code changes: the databases leave a SQL Server instance for the platform service Azure SQL Managed Instance. Replace abandons a workload for a commercial SaaS product, which is what Relecloud does with the report server.
    fr: |
      Rehost (réhéberger) déplace une charge de travail vers Azure à l'identique, avec des modifications minimales : les serveurs du portail web et du moteur de calcul deviennent des machines virtuelles Azure. Replatform (changer de plateforme) déplace une charge de travail vers un environnement d'hébergement moderne avec des modifications de code minimales : les bases de données quittent une instance SQL Server pour le service de plateforme Azure SQL Managed Instance. Replace (remplacer) abandonne une charge de travail au profit d'un produit SaaS du commerce, ce que fait Relecloud avec le serveur de rapports.
  options:
    rearchitect:
      en: "Rearchitect redesigns the architecture of the workload, for example by breaking a monolith into services. No component of PayCloud is redesigned."
      fr: "Rearchitect (réarchitecturer) revoit l'architecture de la charge de travail, par exemple en découpant un monolithe en services. Aucun composant de PayCloud n'est repensé."
    retain:
      en: "Retain keeps a workload where it is. Every component leaves the datacenter of the hosting provider."
      fr: "Retain (conserver) laisse une charge de travail là où elle se trouve. Tous les composants quittent le centre de données de l'hébergeur."
references:
  - title: Select your cloud migration strategies
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/plan/select-cloud-migration-strategy
