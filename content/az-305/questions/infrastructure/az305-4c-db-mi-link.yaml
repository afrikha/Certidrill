id: az305-4c-db-mi-link
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans to migrate a 1.5-TB database from an on-premises SQL Server 2019 instance to Azure SQL Managed Instance.

    You need to recommend a migration method. The solution must meet the following requirements:

    - Changes made on SQL Server must be replicated to the managed instance in near real time until the cutover.
    - The reporting team must be able to run read-only queries against the database on the managed instance while the migration is in progress.
    - The downtime at cutover must be minimized.

    What should you recommend?
  fr: |
    Contoso prévoit de migrer une base de données de 1,5 To d'une instance SQL Server 2019 locale vers Azure SQL Managed Instance.

    Vous devez recommander une méthode de migration. La solution doit répondre aux exigences suivantes :

    - Les modifications effectuées sur SQL Server doivent être répliquées vers l'instance managée en quasi-temps réel jusqu'à la bascule.
    - L'équipe de reporting doit pouvoir exécuter des requêtes en lecture seule sur la base de données de l'instance managée pendant la migration.
    - L'interruption au moment de la bascule doit être réduite au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Log Replay Service", fr: "Log Replay Service" } }
    - { id: b, text: { en: "The Managed Instance link", fr: "Le lien Managed Instance" } }
    - { id: c, text: { en: "A native backup restored from Azure Blob Storage", fr: "Une sauvegarde native restaurée à partir du Stockage Blob Azure" } }
    - { id: d, text: { en: "A BACPAC file imported into the managed instance", fr: "Un fichier BACPAC importé dans l'instance managée" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Managed Instance link replicates the database from SQL Server to the managed instance in near real time through a distributed availability group. The replicated database on the managed instance is readable during the migration, and the cutover is a failover of the link, which keeps the downtime to a minimum.
    fr: |
      Le lien Managed Instance réplique la base de données de SQL Server vers l'instance managée en quasi-temps réel au moyen d'un groupe de disponibilité distribué. La base de données répliquée sur l'instance managée est lisible pendant la migration, et la bascule est un basculement du lien, ce qui réduit l'interruption au minimum.
  options:
    a:
      en: Log Replay Service also limits downtime, but the database stays in a restoring state on the managed instance and can't be queried before the cutover.
      fr: Log Replay Service limite aussi l'interruption, mais la base de données reste en cours de restauration sur l'instance managée et ne peut pas être interrogée avant la bascule.
    c:
      en: A native backup and restore is an offline migration; changes made after the backup aren't replicated.
      fr: Une sauvegarde et une restauration natives constituent une migration hors connexion ; les modifications postérieures à la sauvegarde ne sont pas répliquées.
    d:
      en: A BACPAC import is an offline copy of the schema and data, with no replication of later changes.
      fr: Une importation BACPAC est une copie hors connexion du schéma et des données, sans réplication des modifications ultérieures.
references:
  - title: Overview of the Managed Instance link
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/managed-instance-link-feature-overview
  - title: "Migration overview: SQL Server to Azure SQL Managed Instance"
    url: https://learn.microsoft.com/en-us/azure/azure-sql/migration-guides/managed-instance/sql-server-to-managed-instance-overview
