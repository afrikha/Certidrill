id: az305-cs4a-load-balancing
objective: "4.4.5"
type: dropdown
caseStudy: az305-cs4a-relecloud
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a load-balancing service for each tier of PayCloud. The solution must meet the network requirements and minimize costs.

    Which service should you recommend for each tier? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander un service d'équilibrage de charge pour chaque niveau de PayCloud. La solution doit respecter les exigences réseau et réduire les coûts au minimum.

    Quel service devez-vous recommander pour chaque niveau ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Web portal: [[portal]]

      Calculation engine: [[engine]]
    fr: |
      Portail web : [[portal]]

      Moteur de calcul : [[engine]]
  slots:
    - id: portal
      options:
        - { id: agw, text: Azure Application Gateway }
        - { id: afd, text: Azure Front Door }
        - { id: lb, text: Azure Load Balancer }
        - { id: tm, text: Azure Traffic Manager }
    - id: engine
      options:
        - { id: agw, text: Azure Application Gateway }
        - { id: afd, text: Azure Front Door }
        - { id: lb, text: Azure Load Balancer }
        - { id: tm, text: Azure Traffic Manager }
answer:
  values: { portal: agw, engine: lb }
explanation:
  correct:
    en: |
      PayCloud runs in one region, so both tiers need a regional service. Application Gateway is the regional layer 7 load balancer: it terminates HTTPS, routes on the URL path, includes a WAF in the WAF_v2 SKU and is deployed in the virtual network with a public and a private frontend IP address. The calculation engine uses a proprietary TCP protocol: an internal Standard Load Balancer distributes the connections at layer 4 inside VNet-Pay, probes port 9000 and passes the traffic through without terminating it, so the engine still sees the address of the calling server, at a lower cost than a proxy.
    fr: |
      PayCloud s'exécute dans une seule région : les deux niveaux ont donc besoin d'un service régional. Application Gateway est l'équilibreur de charge régional de couche 7 : il termine HTTPS, route selon le chemin de l'URL, inclut un WAF avec la référence SKU WAF_v2 et se déploie dans le réseau virtuel avec une adresse IP frontale publique et une adresse IP frontale privée. Le moteur de calcul utilise un protocole TCP propriétaire : un équilibreur de charge Standard interne répartit les connexions en couche 4 dans VNet-Pay, sonde le port 9000 et transmet le trafic sans le terminer, de sorte que le moteur voit toujours l'adresse du serveur appelant, pour un coût inférieur à celui d'un proxy.
  options:
    afd:
      en: "Azure Front Door is a global HTTP(S) entry point at the Microsoft edge: it has no private frontend IP address in VNet-Pay and does not carry a proprietary TCP protocol."
      fr: "Azure Front Door est un point d'entrée HTTP(S) global à la périphérie du réseau Microsoft : il n'a pas d'adresse IP frontale privée dans VNet-Pay et ne transporte pas un protocole TCP propriétaire."
    tm:
      en: "Traffic Manager only answers DNS queries to direct clients between endpoints, typically in several regions. It terminates no HTTPS, has no WAF and distributes no connection inside a virtual network."
      fr: "Traffic Manager se contente de répondre à des requêtes DNS pour orienter les clients entre des points de terminaison, en général dans plusieurs régions. Il ne termine pas HTTPS, n'a pas de WAF et ne répartit aucune connexion à l'intérieur d'un réseau virtuel."
    lb:
      en: "For the web portal, Azure Load Balancer works at layer 4: it cannot terminate HTTPS, route on a URL path or apply a WAF."
      fr: "Pour le portail web, Azure Load Balancer fonctionne en couche 4 : il ne peut ni terminer HTTPS, ni router selon un chemin d'URL, ni appliquer un WAF."
    agw:
      en: "For the calculation engine, Application Gateway would act as a terminating proxy: the engine would see the address of the gateway instead of the calling server, at a higher cost than a load balancer."
      fr: "Pour le moteur de calcul, Application Gateway agirait comme un proxy qui termine les connexions : le moteur verrait l'adresse de la passerelle au lieu de celle du serveur appelant, pour un coût supérieur à celui d'un équilibreur de charge."
references:
  - title: Load balancing options
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/load-balancing-overview
