id: az305-4d-perf-tier-latency
objective: "4.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank runs a pricing application in the West Europe Azure region. The application has two tiers that exchange many small messages:

    - A pricing tier of six virtual machines
    - A cache tier of four virtual machines

    Both tiers are in the same subnet of a virtual network named VNet1. A secondary deployment in another region already provides disaster recovery.

    You need to recommend changes to the deployment. The solution must meet the following requirements:

    - Minimize the network latency and jitter between the two tiers.
    - Reduce the CPU that the virtual machines spend on network processing.
    - The deployment in West Europe doesn't need to survive the failure of an availability zone.

    Which two actions should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank exécute une application de tarification dans la région Azure West Europe. L'application comprend deux niveaux qui échangent de nombreux petits messages :

    - Un niveau de tarification de six machines virtuelles
    - Un niveau de cache de quatre machines virtuelles

    Les deux niveaux se trouvent dans le même sous-réseau d'un réseau virtuel nommé VNet1. Un déploiement secondaire dans une autre région assure déjà la reprise d'activité.

    Vous devez recommander des modifications du déploiement. La solution doit répondre aux exigences suivantes :

    - Réduire au minimum la latence réseau et la gigue entre les deux niveaux.
    - Réduire le processeur que les machines virtuelles consacrent au traitement réseau.
    - Le déploiement dans West Europe n'a pas besoin de survivre à la panne d'une zone de disponibilité.

    Quelles sont les deux actions que vous devez inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Spread the virtual machines of each tier across three availability zones", fr: "Répartir les machines virtuelles de chaque niveau sur trois zones de disponibilité" } }
    - { id: b, text: { en: "Deploy the virtual machines of both tiers in one proximity placement group", fr: "Déployer les machines virtuelles des deux niveaux dans un même groupe de placement de proximité" } }
    - { id: c, text: { en: "Move the cache tier to a second virtual network peered with VNet1", fr: "Déplacer le niveau de cache dans un second réseau virtuel relié par peering à VNet1" } }
    - { id: d, text: { en: "Associate a NAT gateway with the subnet of both tiers", fr: "Associer une passerelle NAT au sous-réseau des deux niveaux" } }
    - { id: e, text: { en: "Enable accelerated networking on the network interfaces of all the virtual machines", fr: "Activer la mise en réseau accélérée sur les interfaces réseau de toutes les machines virtuelles" } }
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |
      A proximity placement group keeps the virtual machines of both tiers physically close, in one datacenter, which minimizes the latency between them; it can't span zones, which is acceptable here. Accelerated networking uses SR-IOV so traffic bypasses the host and its virtual switch, which lowers latency and jitter and reduces the CPU spent on network processing. Microsoft recommends combining the two for the lowest latency.
    fr: |
      Un groupe de placement de proximité maintient les machines virtuelles des deux niveaux physiquement proches, dans un même centre de données, ce qui réduit au minimum la latence entre elles ; il ne peut pas s'étendre sur plusieurs zones, ce qui est acceptable ici. La mise en réseau accélérée utilise SR-IOV pour que le trafic contourne l'hôte et son commutateur virtuel, ce qui réduit la latence, la gigue et le processeur consacré au traitement réseau. Microsoft recommande de combiner les deux pour obtenir la latence la plus faible.
  options:
    a:
      en: |
        Spreading the tiers across zones improves resiliency, which isn't required, and increases the latency between the virtual machines.
      fr: |
        Répartir les niveaux sur plusieurs zones améliore la résilience, qui n'est pas exigée, et augmente la latence entre les machines virtuelles.
    c:
      en: |
        Splitting the tiers between two virtual networks adds nothing, and accelerated networking has minimal effect on latency across virtual networks.
      fr: |
        Séparer les niveaux dans deux réseaux virtuels n'apporte rien, et la mise en réseau accélérée a peu d'effet sur la latence entre réseaux virtuels.
    d:
      en: |
        A NAT gateway only handles outbound connections to the internet; it doesn't change the traffic between the two tiers.
      fr: |
        Une passerelle NAT ne gère que les connexions sortantes vers Internet ; elle ne change rien au trafic entre les deux niveaux.
references:
  - title: Proximity placement groups
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/co-location
  - title: Azure Accelerated Networking overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/accelerated-networking-overview
