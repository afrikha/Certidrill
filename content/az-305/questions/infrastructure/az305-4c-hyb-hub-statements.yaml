id: az305-4c-hyb-hub-statements
objective: "4.4.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a hub virtual network named **Hub1** in a region that has availability zones. Hub1 contains a VPN gateway of the VpnGw2AZ SKU with a site-to-site connection to the company's datacenter.

    Two virtual networks named **Spoke1** and **Spoke2** are each peered with Hub1. The peerings allow gateway transit on Hub1 and use the remote gateway on the spokes.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un réseau virtuel hub nommé **Hub1** dans une région dotée de zones de disponibilité. Hub1 contient une passerelle VPN de référence SKU VpnGw2AZ avec une connexion de site à site vers le centre de données de l'entreprise.

    Deux réseaux virtuels nommés **Spoke1** et **Spoke2** sont chacun reliés par peering à Hub1. Les peerings autorisent le transit par passerelle sur Hub1 et utilisent la passerelle distante sur les spokes.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Virtual machines in Spoke1 can reach the datacenter through the gateway of Hub1.
        fr: Les machines virtuelles de Spoke1 peuvent atteindre le centre de données par la passerelle de Hub1.
    - id: s2
      text:
        en: The gateway of Hub1 stays available if a single availability zone of the region fails.
        fr: La passerelle de Hub1 reste disponible si une seule zone de disponibilité de la région tombe en panne.
    - id: s3
      text:
        en: To reach the datacenter, Spoke2 needs its own VPN gateway.
        fr: Pour atteindre le centre de données, Spoke2 a besoin de sa propre passerelle VPN.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      With gateway transit allowed on the hub side of a peering and the remote gateway used on the spoke side, a spoke shares the VPN gateway of the hub and learns the on-premises routes, so neither spoke needs a gateway of its own. The SKUs whose name ends with AZ deploy the gateway instances across availability zones, which keeps the gateway available when one zone fails.
    fr: |
      Lorsque le transit par passerelle est autorisé côté hub d'un peering et que la passerelle distante est utilisée côté spoke, un spoke partage la passerelle VPN du hub et apprend les itinéraires locaux : aucun spoke n'a donc besoin de sa propre passerelle. Les références SKU dont le nom se termine par AZ déploient les instances de la passerelle sur plusieurs zones de disponibilité, ce qui maintient la passerelle disponible quand une zone tombe en panne.
references:
  - title: Configure VPN gateway transit for virtual network peering
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-peering-gateway-transit
  - title: About gateway SKUs
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-gateway-skus
