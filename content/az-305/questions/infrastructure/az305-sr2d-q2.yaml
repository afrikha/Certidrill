id: az305-sr2d-q2
objective: "4.4.2"
type: series_yesno
series: az305-sr2d-datacenter-link
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You recommend one ExpressRoute circuit and a zone-redundant ExpressRoute gateway.
  fr: |
    Vous recommandez un circuit ExpressRoute et une passerelle ExpressRoute redondante interzone.
body:
  solution:
    en: |
      You recommend one **ExpressRoute** circuit that has its two connections in a **single peering location**. The circuit is connected to a **zone-redundant** ExpressRoute virtual network gateway (ErGw2AZ) deployed in VNet1.
    fr: |
      Vous recommandez un circuit **ExpressRoute** dont les deux connexions se trouvent dans un **seul emplacement de peering**. Le circuit est connecté à une passerelle de réseau virtuel ExpressRoute **redondante interzone** (ErGw2AZ) déployée dans VNet1.
answer: { value: false }
explanation:
  correct:
    en: |
      The two connections of a circuit protect against the failure of a link or of a device, and the zone-redundant gateway protects against the failure of an availability zone in the Azure region. Both connections still end in the same peering location: this design, called standard resiliency, gives no protection when the whole site fails. Connectivity would be lost until the site is back, so the second requirement isn't met.
    fr: |
      Les deux connexions d'un circuit protègent contre la panne d'une liaison ou d'un équipement, et la passerelle redondante interzone protège contre la panne d'une zone de disponibilité de la région Azure. Les deux connexions aboutissent pourtant au même emplacement de peering : cette conception, dite de résilience standard, n'offre aucune protection quand le site entier tombe en panne. La connectivité serait perdue jusqu'au retour du site : la deuxième exigence n'est donc pas satisfaite.
references:
  - title: "Design and architect Azure ExpressRoute for resiliency"
    url: https://learn.microsoft.com/en-us/azure/expressroute/design-architecture-for-resiliency
