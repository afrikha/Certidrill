id: az305-4c-assess-dependencies
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam plans to migrate 350 VMware virtual machines to Azure in several waves. An Azure Migrate appliance already discovers the virtual machines.

    You need to identify which virtual machines communicate with each other, so that interdependent machines are placed in the same wave. No software can be installed on the virtual machines.

    What should you include in the recommendation?
  fr: |
    Fabrikam prévoit de migrer 350 machines virtuelles VMware vers Azure en plusieurs vagues. Une appliance Azure Migrate découvre déjà les machines virtuelles.

    Vous devez identifier les machines virtuelles qui communiquent entre elles, afin de placer les machines interdépendantes dans la même vague. Aucun logiciel ne peut être installé sur les machines virtuelles.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "The Map feature of VM insights", fr: "La fonctionnalité Map de VM Insights" } }
    - { id: b, text: { en: "A business case in Azure Migrate", fr: "Une analyse de rentabilité dans Azure Migrate" } }
    - { id: c, text: { en: "Agentless dependency analysis in Azure Migrate", fr: "L'analyse des dépendances sans agent dans Azure Migrate" } }
    - { id: d, text: { en: "A performance-based Azure VM assessment in Azure Migrate", fr: "Une évaluation de machines virtuelles Azure basée sur les performances dans Azure Migrate" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Agentless dependency analysis uses the Azure Migrate appliance to collect the TCP connections of the discovered servers and shows which servers talk to each other, without installing anything on them. The result lets you group interdependent servers and move them in the same wave.
    fr: |
      L'analyse des dépendances sans agent s'appuie sur l'appliance Azure Migrate pour collecter les connexions TCP des serveurs découverts et montre quels serveurs se parlent, sans rien installer sur eux. Le résultat permet de regrouper les serveurs interdépendants et de les déplacer dans la même vague.
  options:
    a:
      en: The Map feature of VM insights also shows connections, but it requires agents on every monitored machine.
      fr: La fonctionnalité Map de VM Insights montre aussi les connexions, mais elle exige des agents sur chaque machine surveillée.
    b:
      en: A business case compares the on-premises and Azure costs; it doesn't show the connections between servers.
      fr: Une analyse de rentabilité compare les coûts en local et dans Azure ; elle ne montre pas les connexions entre serveurs.
    d:
      en: An assessment gives the readiness, size and cost of each server, not its dependencies.
      fr: Une évaluation donne la préparation, la taille et le coût de chaque serveur, pas ses dépendances.
references:
  - title: Dependency analysis
    url: https://learn.microsoft.com/en-us/azure/migrate/concepts-dependency-visualization?view=migrate-classic
