id: az305-4a-vm-savings-plan-flex
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs production workloads on Azure virtual machines that must run continuously. During the next three years, Litware will move some workloads to other Azure regions and will replace the current virtual machines with sizes from other families. The total hourly spend on compute is expected to remain stable.

    You need to recommend a pricing option. The solution must meet the following requirements:

    - Maximize savings over the three years.
    - Continue to apply after the planned changes of region and size family.

    What should you recommend?
  fr: |
    Litware exécute des charges de production sur des machines virtuelles Azure qui doivent fonctionner en continu. Au cours des trois prochaines années, Litware déplacera certaines charges vers d'autres régions Azure et remplacera les machines virtuelles actuelles par des tailles d'autres familles. La dépense horaire totale de calcul devrait rester stable.

    Vous devez recommander une option tarifaire. La solution doit répondre aux exigences suivantes :

    - Maximiser les économies sur les trois ans.
    - Continuer à s'appliquer après les changements de région et de famille de tailles prévus.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A three-year Azure savings plan for compute", fr: "Un plan d'économies Azure pour le calcul de trois ans" } }
    - { id: b, text: { en: "Three-year reserved virtual machine instances with instance size flexibility", fr: "Des instances de machines virtuelles réservées de trois ans avec la flexibilité de taille d'instance" } }
    - { id: c, text: { en: "Azure Spot virtual machines with the Deallocate eviction policy", fr: "Des machines virtuelles Azure Spot avec la stratégie d'éviction Deallocate" } }
    - { id: d, text: { en: "On-demand capacity reservations in each region", fr: "Des réservations de capacité à la demande dans chaque région" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A savings plan commits to a fixed hourly spend for one or three years, and the discount applies to eligible compute usage in every region and for every size family, up to the commitment. It therefore follows the workloads when they change region or family, which a reservation doesn't do.
    fr: |
      Un plan d'économies engage sur une dépense horaire fixe pendant un ou trois ans, et la remise s'applique à l'utilisation de calcul éligible dans toutes les régions et pour toutes les familles de tailles, dans la limite de l'engagement. Il suit donc les charges lorsqu'elles changent de région ou de famille, ce qu'une réservation ne fait pas.
  options:
    b:
      en: A reservation is tied to one region, and instance size flexibility only extends the discount to other sizes of the same size group; it would stop matching after the planned changes.
      fr: Une réservation est liée à une région, et la flexibilité de taille d'instance n'étend la remise qu'aux autres tailles du même groupe de tailles ; elle ne correspondrait plus après les changements prévus.
    c:
      en: Spot virtual machines can be evicted at any time and have no SLA; they don't suit workloads that must run continuously.
      fr: Les machines virtuelles Spot peuvent être évincées à tout moment et n'ont aucun SLA ; elles ne conviennent pas à des charges qui doivent fonctionner en continu.
    d:
      en: An on-demand capacity reservation guarantees that capacity is available; it isn't a discount.
      fr: Une réservation de capacité à la demande garantit la disponibilité de la capacité ; ce n'est pas une remise.
references:
  - title: Decide between a savings plan and a reservation
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
  - title: Save costs with Azure Reserved VM Instances
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/prepay-reserved-vm-instances
