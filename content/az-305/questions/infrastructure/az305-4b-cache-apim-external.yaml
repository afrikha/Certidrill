id: az305-4b-cache-apim-external
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum exposes a product catalog API through an Azure API Management instance in the Consumption tier. The catalog changes once a day, and the back end needs two seconds to answer each request.

    You need to recommend a solution that meets the following requirements:

    - For one hour, identical GET requests must be answered without calling the back end.
    - The instance must stay in the Consumption tier.

    What should you include in the recommendation?
  fr: |
    Adatum expose une API de catalogue de produits via une instance Azure API Management de niveau Consumption. Le catalogue change une fois par jour, et le service principal met deux secondes à répondre à chaque requête.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Pendant une heure, les requêtes GET identiques doivent recevoir une réponse sans appel au service principal.
    - L'instance doit rester au niveau Consumption.

    Que devez-vous inclure dans la recommandation ?
body:
  options:
    - { id: a, text: { en: "Response caching policies that use the built-in cache of the instance", fr: "Des stratégies de mise en cache des réponses qui utilisent le cache intégré de l'instance" } }
    - { id: b, text: { en: "Response caching policies that use an external Azure Managed Redis cache", fr: "Des stratégies de mise en cache des réponses qui utilisent un cache Azure Managed Redis externe" } }
    - { id: c, text: { en: "A rate limit policy that applies to the catalog API", fr: "Une stratégie de limite de débit qui s'applique à l'API de catalogue" } }
    - { id: d, text: { en: "A load-balanced back-end pool for the catalog API", fr: "Un pool de services principaux à charge équilibrée pour l'API de catalogue" } }
answer: { optionId: b }
explanation:
  correct:
    en: "The cache-lookup and cache-store policies return a stored response instead of calling the back end. The Consumption tier has no built-in cache, so these policies must use an external Redis-compatible cache, such as an Azure Managed Redis instance, which every tier supports."
    fr: "Les stratégies cache-lookup et cache-store renvoient une réponse stockée au lieu d'appeler le service principal. Le niveau Consumption n'a pas de cache intégré : ces stratégies doivent donc utiliser un cache externe compatible Redis, comme une instance Azure Managed Redis, que tous les niveaux prennent en charge."
  options:
    a:
      en: "The built-in cache is not available in the Consumption tier."
      fr: "Le cache intégré n'est pas disponible au niveau Consumption."
    c:
      en: "A rate limit rejects calls above a threshold; the accepted calls still reach the slow back end."
      fr: "Une limite de débit rejette les appels au-delà d'un seuil ; les appels acceptés atteignent toujours le service principal lent."
    d:
      en: "A back-end pool spreads the calls over several back ends; every request is still processed by a back end."
      fr: "Un pool de services principaux répartit les appels entre plusieurs services principaux ; chaque requête est toujours traitée par un service principal."
references:
  - title: Add caching to improve performance in Azure API Management
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-howto-cache
  - title: Feature-based comparison of the Azure API Management tiers
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-features
