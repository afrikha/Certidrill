id: az305-4a-ctr-aks-virtual-nodes
objective: "4.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum runs Linux workloads on an Azure Kubernetes Service (AKS) cluster. A reporting service receives sudden bursts of jobs several times a day.

    You need to recommend how to handle the bursts. The solution must meet the following requirements:

    - Additional pods start within seconds, without waiting for new virtual machine nodes to be provisioned.
    - The burst capacity is billed per second, only while the pods run.
    - The baseline load continues to run on the existing node pool.

    What should you recommend? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute des charges de travail Linux sur un cluster Azure Kubernetes Service (AKS). Un service de création de rapports reçoit des rafales soudaines de travaux plusieurs fois par jour.

    Vous devez recommander la façon d'absorber les rafales. La solution doit répondre aux exigences suivantes :

    - Les pods supplémentaires démarrent en quelques secondes, sans attendre le provisionnement de nouveaux nœuds de machines virtuelles.
    - La capacité de rafale est facturée à la seconde, uniquement pendant l'exécution des pods.
    - La charge de base continue de s'exécuter sur le pool de nœuds existant.

    Que devez-vous recommander ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Schedule the burst pods on [[burst]].
      The cluster must use [[net]].
    fr: |
      Planifier les pods de rafale sur [[burst]].
      Le cluster doit utiliser [[net]].
  slots:
    - id: burst
      options:
        - { id: autoscaler, text: { en: "a node pool that is scaled by the cluster autoscaler", fr: "un pool de nœuds mis à l'échelle par le cluster autoscaler" } }
        - { id: spot, text: { en: "a node pool of Azure Spot virtual machines", fr: "un pool de nœuds de machines virtuelles Azure Spot" } }
        - { id: vnodes, text: { en: "virtual nodes", fr: "des nœuds virtuels" } }
    - id: net
      options:
        - { id: kubenet, text: { en: "kubenet networking", fr: "le réseau kubenet" } }
        - { id: cni, text: { en: "Azure CNI networking", fr: "le réseau Azure CNI" } }
        - { id: any, text: { en: "either kubenet or Azure CNI networking", fr: "indifféremment le réseau kubenet ou Azure CNI" } }
answer:
  values: { burst: vnodes, net: cni }
explanation:
  correct:
    en: |
      Virtual nodes run pods in Azure Container Instances: the pods are provisioned quickly and billed per second of execution, without waiting for the cluster autoscaler to add virtual machine nodes. Virtual nodes work only with clusters that use Azure CNI (advanced) networking, and they run Linux pods.
    fr: |
      Les nœuds virtuels exécutent les pods dans Azure Container Instances : les pods sont provisionnés rapidement et facturés à la seconde d'exécution, sans attendre que le cluster autoscaler ajoute des nœuds de machines virtuelles. Les nœuds virtuels ne fonctionnent qu'avec les clusters qui utilisent le réseau Azure CNI (avancé), et ils exécutent des pods Linux.
  options:
    autoscaler:
      en: The cluster autoscaler adds virtual machine nodes, which takes longer to provision than the requirement allows, and the nodes are billed as virtual machines.
      fr: Le cluster autoscaler ajoute des nœuds de machines virtuelles, dont le provisionnement dépasse le délai exigé, et les nœuds sont facturés comme des machines virtuelles.
    spot:
      en: A Spot node pool lowers the price of nodes, but the nodes are still virtual machines to provision and they can be evicted.
      fr: Un pool de nœuds Spot réduit le prix des nœuds, mais ceux-ci restent des machines virtuelles à provisionner et peuvent être évincés.
    kubenet:
      en: Virtual nodes aren't supported on clusters that use basic (kubenet) networking.
      fr: Les nœuds virtuels ne sont pas pris en charge sur les clusters qui utilisent le réseau de base (kubenet).
    any:
      en: The networking model matters; virtual nodes need Azure CNI so that pods in Container Instances can communicate with the cluster.
      fr: Le modèle réseau compte ; les nœuds virtuels exigent Azure CNI pour que les pods dans Container Instances puissent communiquer avec le cluster.
references:
  - title: Create and configure an Azure Kubernetes Services (AKS) cluster to use virtual nodes
    url: https://learn.microsoft.com/en-us/azure/aks/virtual-nodes
