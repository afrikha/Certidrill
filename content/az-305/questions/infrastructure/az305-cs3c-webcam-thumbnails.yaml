id: az305-cs3c-webcam-thumbnails
objective: "4.1.4"
type: single
caseStudy: az305-cs3c-alpineski
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution that replaces the virtual machine that creates the webcam thumbnails. The solution must meet the compute requirements and minimize costs.

    What should you recommend?
  fr: |
    Vous devez recommander une solution qui remplace la machine virtuelle qui crée les miniatures des webcams. La solution doit satisfaire les exigences de calcul et réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A function app in a Premium plan with an Event Grid-based blob trigger", fr: "Une application de fonction dans un plan Premium avec un déclencheur d'objets blob basé sur Event Grid" } }
    - { id: b, text: { en: "A function app in a Flex Consumption plan with an Event Grid-based blob trigger", fr: "Une application de fonction dans un plan Flex Consumption avec un déclencheur d'objets blob basé sur Event Grid" } }
    - { id: c, text: { en: "A function app in a Dedicated (App Service) plan with a timer trigger", fr: "Une application de fonction dans un plan Dedicated (App Service) avec un déclencheur de minuteur" } }
    - { id: d, text: { en: "A continuous WebJob in a Basic App Service plan", fr: "Une tâche web continue dans un plan App Service Basic" } }
answer: { optionId: b }
explanation:
  correct:
    en: "In the Flex Consumption plan, a function app scales to zero and is billed for the executions and for the instances only while they run, so nothing is billed when no image arrives. The Event Grid-based blob trigger starts the function from an event subscription on the container as soon as a blob is created, instead of scanning the container."
    fr: "Dans le plan Flex Consumption, une application de fonction est mise à l'échelle jusqu'à zéro et n'est facturée que pour les exécutions et pour les instances pendant qu'elles s'exécutent : rien n'est donc facturé lorsqu'aucune image n'arrive. Le déclencheur d'objets blob basé sur Event Grid démarre la fonction à partir d'un abonnement aux événements du conteneur dès qu'un objet blob est créé, au lieu d'analyser le conteneur."
  options:
    a:
      en: "The Premium plan reacts to the same events, but it always keeps at least one instance warm, which is billed day and night and outside the ski season."
      fr: "Le plan Premium réagit aux mêmes événements, mais il garde toujours au moins une instance chaude, facturée jour et nuit et hors de la saison de ski."
    c:
      en: "An App Service plan is billed for its instances whether the functions run or not, and a timer trigger would have to list the container to find new images."
      fr: "Un plan App Service est facturé pour ses instances, que les fonctions s'exécutent ou non, et un déclencheur de minuteur devrait lister le conteneur pour trouver les nouvelles images."
    d:
      en: "A continuous WebJob runs permanently on the instances of an App Service plan, which are billed around the clock like the current virtual machine."
      fr: "Une tâche web continue s'exécute en permanence sur les instances d'un plan App Service, facturées en continu comme la machine virtuelle actuelle."
references:
  - title: Azure Functions hosting options
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
  - title: "Tutorial: Trigger Azure Functions on blob containers by using an event subscription"
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-event-grid-blob-trigger
