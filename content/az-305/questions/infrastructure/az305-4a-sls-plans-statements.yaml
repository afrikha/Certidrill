id: az305-4a-sls-plans-statements
objective: "4.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is comparing the Azure Functions hosting plans for its new function apps.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders compare les plans d'hébergement Azure Functions pour ses nouvelles applications de fonctions.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A function app in the Premium plan is billed for at least one instance, even while no function runs.
        fr: Une application de fonctions dans le plan Premium est facturée pour au moins une instance, même lorsqu'aucune fonction ne s'exécute.
    - id: s2
      text:
        en: A function app in the Flex Consumption plan can run on Windows.
        fr: Une application de fonctions dans le plan Flex Consumption peut s'exécuter sous Windows.
    - id: s3
      text:
        en: In the legacy Consumption plan, the timeout of a function execution can be raised to 30 minutes.
        fr: Dans le plan Consumption hérité, le délai d'expiration d'une exécution de fonction peut être porté à 30 minutes.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A Premium plan always keeps at least one instance active, and that minimum is billed whether or not functions run. Flex Consumption is a Linux-only plan. In the legacy Consumption plan, the default timeout is 5 minutes and the maximum is 10 minutes; the other plans default to 30 minutes and can be unbounded.
    fr: |
      Un plan Premium garde toujours au moins une instance active, et ce minimum est facturé que des fonctions s'exécutent ou non. Flex Consumption est un plan réservé à Linux. Dans le plan Consumption hérité, le délai d'expiration par défaut est de 5 minutes et le maximum de 10 minutes ; les autres plans ont 30 minutes par défaut et peuvent être illimités.
references:
  - title: Azure Functions hosting options
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
  - title: Azure Functions Premium plan
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-premium-plan
