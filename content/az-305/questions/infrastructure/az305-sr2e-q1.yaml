stem:
  en: |
    You recommend the Consumption plan.
  fr: |
    Vous recommandez le plan Consumption.
body:
  solution:
    en: |
      You recommend hosting Func1 in a **Consumption** plan. The function timeout is set to the highest value that the plan allows.
    fr: |
      Vous recommandez d'héberger Func1 dans un plan **Consumption**. Le délai d'expiration des fonctions est défini sur la valeur la plus élevée que le plan autorise.
answer: { value: false }
explanation:
  correct:
    en: |
      The Consumption plan scales to zero and bills only the executions, which fits the third requirement. However, it has no virtual network integration, so Func1 couldn't reach a database that is exposed only through a private endpoint, and its timeout is 5 minutes by default and 10 minutes at most. Two of the three requirements aren't met; Microsoft now describes this plan as legacy.
    fr: |
      Le plan Consumption est mis à l'échelle jusqu'à zéro et ne facture que les exécutions, ce qui convient à la troisième exigence. En revanche, il n'offre pas d'intégration au réseau virtuel : Func1 ne pourrait pas atteindre une base de données exposée uniquement par un point de terminaison privé, et son délai d'expiration est de 5 minutes par défaut et de 10 minutes au maximum. Deux des trois exigences ne sont pas satisfaites ; Microsoft qualifie désormais ce plan d'hérité.
references:
  - title: "Azure Functions hosting options"
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
