id: az305-4c-data-online-tools
objective: "4.3.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware defines its standard tools to move unstructured data to Azure Storage over its 1-Gbps ExpressRoute circuit.

    Which tool should you recommend for each need? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware définit ses outils standard pour déplacer des données non structurées vers Stockage Azure par son circuit ExpressRoute de 1 Gbit/s.

    Quel outil devez-vous recommander pour chaque besoin ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A nightly scripted copy of new log files from a Linux server to a blob container: [[s1]]

      An occasional upload of a few files by a business analyst who needs a graphical interface: [[s2]]

      A scheduled pipeline that copies objects from Amazon S3 and from an SFTP server, with a transformation step: [[s3]]
    fr: |
      Une copie nocturne scriptée des nouveaux fichiers journaux d'un serveur Linux vers un conteneur d'objets blob : [[s1]]

      Un chargement occasionnel de quelques fichiers par un analyste métier qui a besoin d'une interface graphique : [[s2]]

      Un pipeline planifié qui copie des objets depuis Amazon S3 et depuis un serveur SFTP, avec une étape de transformation : [[s3]]
  slots:
    - id: s1
      options:
        - { id: azcopy, text: "AzCopy" }
        - { id: explorer, text: { en: "Azure Storage Explorer", fr: "Explorateur Stockage Azure" } }
        - { id: adf, text: "Azure Data Factory" }
        - { id: databox, text: "Azure Data Box" }
    - id: s2
      options:
        - { id: azcopy, text: "AzCopy" }
        - { id: explorer, text: { en: "Azure Storage Explorer", fr: "Explorateur Stockage Azure" } }
        - { id: adf, text: "Azure Data Factory" }
        - { id: databox, text: "Azure Data Box" }
    - id: s3
      options:
        - { id: azcopy, text: "AzCopy" }
        - { id: explorer, text: { en: "Azure Storage Explorer", fr: "Explorateur Stockage Azure" } }
        - { id: adf, text: "Azure Data Factory" }
        - { id: databox, text: "Azure Data Box" }
answer:
  values: { s1: azcopy, s2: explorer, s3: adf }
explanation:
  correct:
    en: |
      AzCopy is a command-line tool, easy to call from a scheduled script on Linux, that copies files to Blob Storage. Azure Storage Explorer is the graphical client for occasional manual transfers. Azure Data Factory runs scheduled pipelines whose copy activity reads many sources, including Amazon S3 and SFTP, and can transform the data on the way.
    fr: |
      AzCopy est un outil en ligne de commande, facile à appeler depuis un script planifié sous Linux, qui copie des fichiers vers le Stockage Blob. L'Explorateur Stockage Azure est le client graphique des transferts manuels occasionnels. Azure Data Factory exécute des pipelines planifiés dont l'activité de copie lit de nombreuses sources, dont Amazon S3 et SFTP, et peut transformer les données au passage.
  options:
    databox:
      en: Azure Data Box is an offline device for large one-time transfers when the bandwidth is insufficient, which isn't the case here.
      fr: Azure Data Box est un appareil hors connexion pour de gros transferts ponctuels quand la bande passante est insuffisante, ce qui n'est pas le cas ici.
references:
  - title: Choose an Azure solution for data transfer
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-choose-data-transfer-solution
