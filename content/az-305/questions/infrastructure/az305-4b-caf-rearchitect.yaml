id: az305-4b-caf-rearchitect
objective: "4.3.1"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Tailspin Toys runs a monolithic e-commerce application on virtual machines. During sales periods, the checkout function is saturated while the catalog function is idle, but the whole application must be scaled as one block.

    Tailspin Toys plans to move the application to Azure and has the following requirements:

    - The checkout and catalog functions must scale independently of each other.
    - The existing code must be reused as much as possible; the application must not be redeveloped from scratch.

    Which migration strategy of the Microsoft Cloud Adoption Framework for Azure should you recommend?
  fr: |
    Tailspin Toys exécute une application monolithique de commerce électronique sur des machines virtuelles. Pendant les périodes de soldes, la fonction de paiement est saturée alors que la fonction de catalogue est inactive, mais l'application entière doit être mise à l'échelle d'un seul bloc.

    Tailspin Toys prévoit de déplacer l'application vers Azure et a les exigences suivantes :

    - Les fonctions de paiement et de catalogue doivent se mettre à l'échelle indépendamment l'une de l'autre.
    - Le code existant doit être réutilisé autant que possible ; l'application ne doit pas être redéveloppée de zéro.

    Quelle stratégie de migration du Microsoft Cloud Adoption Framework pour Azure devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Replatform", fr: "Replatform (changer de plateforme)" } }
    - { id: b, text: { en: "Refactor", fr: "Refactor (refactoriser)" } }
    - { id: c, text: { en: "Rearchitect", fr: "Rearchitect (réarchitecturer)" } }
    - { id: d, text: { en: "Rebuild", fr: "Rebuild (reconstruire)" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Rearchitect redesigns the architecture of a workload to unlock cloud capabilities. Its key indicators are an application that requires modularization or decomposition into services and scaling needs that vary by component, which is exactly the situation of the checkout and catalog functions."
    fr: "Rearchitect repense l'architecture d'une charge de travail pour tirer parti des capacités du cloud. Ses indicateurs clés sont une application qui exige une modularisation ou une décomposition en services et des besoins de mise à l'échelle qui varient selon le composant, ce qui correspond exactement à la situation des fonctions de paiement et de catalogue."
  options:
    a:
      en: "Replatform moves the application to a managed platform with minimal code changes; the monolith would still scale as one block."
      fr: "Replatform déplace l'application vers une plateforme managée avec des modifications de code minimales ; le monolithe se mettrait toujours à l'échelle d'un seul bloc."
    b:
      en: "Refactor improves the internal structure of the code, to reduce technical debt for example, without changing the architecture."
      fr: "Refactor améliore la structure interne du code, par exemple pour réduire la dette technique, sans changer l'architecture."
    d:
      en: "Rebuild is a full redevelopment with cloud-native services, which the second requirement excludes."
      fr: "Rebuild est un redéveloppement complet avec des services natifs du cloud, ce que la seconde exigence exclut."
references:
  - title: Select your cloud migration strategies
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/plan/select-cloud-migration-strategy
