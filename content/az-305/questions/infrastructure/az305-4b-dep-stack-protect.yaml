id: az305-4b-dep-stack-protect
objective: "4.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The platform team of Fabrikam deploys the shared network resources of each subscription from a Bicep file, by using a pipeline.

    You need to recommend a deployment solution that meets the following requirements:

    - The deployed resources must be managed as one unit, and a resource that is removed from the Bicep file must be deleted from Azure at the next deployment.
    - The Owners of the subscriptions must not be able to modify or delete these resources; only the identity of the pipeline can.
    - The solution must still be supported after January 2027.

    What should you recommend?
  fr: |
    L'équipe de plateforme de Fabrikam déploie les ressources réseau partagées de chaque abonnement à partir d'un fichier Bicep, à l'aide d'un pipeline.

    Vous devez recommander une solution de déploiement qui répond aux exigences suivantes :

    - Les ressources déployées doivent être gérées comme une seule unité, et une ressource retirée du fichier Bicep doit être supprimée d'Azure au déploiement suivant.
    - Les titulaires du rôle Owner sur les abonnements ne doivent pas pouvoir modifier ni supprimer ces ressources ; seule l'identité du pipeline le peut.
    - La solution doit encore être prise en charge après janvier 2027.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A template spec with CanNotDelete locks on the resources", fr: "Une spec de modèle avec des verrous CanNotDelete sur les ressources" } }
    - { id: b, text: { en: "An Azure Blueprints assignment with resource locking", fr: "Une affectation Azure Blueprints avec verrouillage des ressources" } }
    - { id: c, text: { en: "A deployment stack with the DenyWriteAndDelete deny setting", fr: "Une pile de déploiement avec le paramètre de refus DenyWriteAndDelete" } }
    - { id: d, text: { en: "A resource group deployment with ReadOnly locks on the resources", fr: "Un déploiement de groupe de ressources avec des verrous ReadOnly sur les ressources" } }
answer: { optionId: c }
explanation:
  correct:
    en: "A deployment stack manages the resources of a template as a single unit; with the delete action on unmanage, a resource that leaves the template is deleted. Its DenyWriteAndDelete deny setting blocks changes and deletions made outside the stack, even by Owners, while the identity of the pipeline is listed as an excluded principal. Deployment stacks are the recommended replacement for Azure Blueprints."
    fr: "Une pile de déploiement gère les ressources d'un modèle comme une seule unité ; avec l'action de suppression sur les ressources non managées, une ressource qui sort du modèle est supprimée. Son paramètre de refus DenyWriteAndDelete bloque les modifications et les suppressions faites en dehors de la pile, même par les titulaires du rôle Owner, tandis que l'identité du pipeline figure parmi les principaux exclus. Les piles de déploiement sont le remplacement recommandé d'Azure Blueprints."
  options:
    a:
      en: "A template spec only stores and shares the template, and a CanNotDelete lock does not prevent modifications; an Owner can also remove the lock."
      fr: "Une spec de modèle ne fait que stocker et partager le modèle, et un verrou CanNotDelete n'empêche pas les modifications ; un titulaire du rôle Owner peut en outre retirer le verrou."
    b:
      en: "Azure Blueprints will be retired on January 31, 2027; Microsoft recommends migrating to deployment stacks and template specs."
      fr: "Azure Blueprints sera mis hors service le 31 janvier 2027 ; Microsoft recommande de migrer vers les piles de déploiement et les specs de modèle."
    d:
      en: "An ordinary deployment does not delete the resources removed from the file, and Owners can remove the locks set by hand."
      fr: "Un déploiement ordinaire ne supprime pas les ressources retirées du fichier, et les titulaires du rôle Owner peuvent retirer des verrous posés à la main."
references:
  - title: Create and deploy Azure deployment stacks in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deployment-stacks
  - title: What is Azure Blueprints (Preview)?
    url: https://learn.microsoft.com/en-us/azure/governance/blueprints/overview
