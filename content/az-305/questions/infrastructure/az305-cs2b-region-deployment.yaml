id: az305-cs2b-region-deployment
objective: "4.2.6"
type: dropdown
caseStudy: az305-cs2b-wide-world-importers
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend how the pipeline deploys the shared infrastructure of a region. The solution must meet the deployment requirements.

    What should you include in the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander la façon dont le pipeline déploie l'infrastructure partagée d'une région. La solution doit respecter les exigences relatives au déploiement.

    Que devez-vous inclure dans la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Deploy the Bicep file as: [[unit]]

      Protect the deployed resources with: [[protection]]
    fr: |
      Déployer le fichier Bicep sous la forme : [[unit]]

      Protéger les ressources déployées avec : [[protection]]
  slots:
    - id: unit
      options:
        - { id: spec, text: { en: "A template spec", fr: "D'une spec de modèle" } }
        - { id: stack, text: { en: "A deployment stack", fr: "D'une pile de déploiement" } }
        - { id: blueprint, text: { en: "An Azure Blueprints assignment", fr: "D'une affectation Azure Blueprints" } }
    - id: protection
      options:
        - { id: lock, text: { en: "ReadOnly locks", fr: "Des verrous ReadOnly" } }
        - { id: policy, text: { en: "An Azure Policy assignment with the deny effect", fr: "Une attribution Azure Policy avec l'effet deny" } }
        - { id: denysettings, text: { en: "Deny settings", fr: "Des paramètres de refus" } }
answer:
  values: { unit: stack, protection: denysettings }
explanation:
  correct:
    en: |-
      A deployment stack manages the resources of a Bicep file as one unit: when a resource is removed from the file, the next update of the stack can delete it from Azure. The deny settings of the stack block write and delete operations on the managed resources for every principal that isn't excluded, the Owners of the subscription included, so only the pipeline identity changes them.
    fr: |-
      Une pile de déploiement gère les ressources d'un fichier Bicep comme une seule unité : quand une ressource est retirée du fichier, la mise à jour suivante de la pile peut la supprimer d'Azure. Les paramètres de refus de la pile bloquent les opérations d'écriture et de suppression sur les ressources managées pour tout principal qui n'est pas exclu, y compris les utilisateurs ayant le rôle Owner sur l'abonnement ; seule l'identité du pipeline les modifie donc.
  options:
    spec: { en: "A template spec stores and shares a template; it doesn't track the deployed resources or delete those removed from the file.", fr: "Une spec de modèle stocke et partage un modèle ; elle ne suit pas les ressources déployées et ne supprime pas celles qui sont retirées du fichier." }
    blueprint: { en: "Azure Blueprints retires on January 31, 2027; Microsoft recommends migrating blueprints to deployment stacks.", fr: "Azure Blueprints sera mis hors service le 31 janvier 2027 ; Microsoft recommande de migrer les blueprints vers les piles de déploiement." }
    lock: { en: "A user with the Owner role can remove a lock, and a ReadOnly lock would also block the pipeline.", fr: "Un utilisateur ayant le rôle Owner peut retirer un verrou, et un verrou ReadOnly bloquerait aussi le pipeline." }
    policy: { en: "A deny policy blocks configurations that break a rule; it doesn't stop compliant changes or deletions made in the portal.", fr: "Une stratégie deny bloque les configurations qui enfreignent une règle ; elle n'empêche ni les modifications conformes ni les suppressions faites dans le portail." }
references:
  - title: Create and deploy Azure deployment stacks in Bicep
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deployment-stacks
  - title: What is Azure Blueprints (Preview)?
    url: https://learn.microsoft.com/en-us/azure/governance/blueprints/overview
