id: az305-4b-api-hybrid-gateway
objective: "4.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware hosts production APIs in an on-premises datacenter and in Amazon Web Services (AWS). Litware plans to manage all these APIs from a single Azure API Management instance.

    You need to recommend a design that meets the following requirements:

    - Calls from on-premises applications to on-premises APIs must not transit through Azure.
    - The APIs and their policies must be configured once, in Azure.
    - The solution must be supported for production, with an SLA.
    - The on-premises firewall must not accept any connection initiated from the internet.

    How should you complete the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware héberge des API de production dans un centre de données local et dans Amazon Web Services (AWS). Litware prévoit de gérer toutes ces API depuis une seule instance Azure API Management.

    Vous devez recommander une conception qui répond aux exigences suivantes :

    - Les appels des applications locales vers les API locales ne doivent pas transiter par Azure.
    - Les API et leurs stratégies doivent être configurées une seule fois, dans Azure.
    - La solution doit être prise en charge en production, avec un SLA.
    - Le pare-feu local ne doit accepter aucune connexion initiée depuis Internet.

    Comment devez-vous compléter la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Deploy the API Management instance in the [[tier]] tier.

      In the datacenter and in AWS, deploy [[gw]].

      In the on-premises firewall, allow [[fw]].
    fr: |
      Déployez l'instance API Management au niveau [[tier]].

      Dans le centre de données et dans AWS, déployez [[gw]].

      Dans le pare-feu local, autorisez [[fw]].
  slots:
    - id: tier
      options:
        - { id: developer, text: Developer }
        - { id: stdv2, text: Standard v2 }
        - { id: premium, text: Premium }
        - { id: premv2, text: Premium v2 }
    - id: gw
      options:
        - { id: workspace, text: { en: "a workspace gateway", fr: "une passerelle d'espace de travail" } }
        - { id: selfhosted, text: { en: "a self-hosted gateway", fr: "une passerelle auto-hébergée" } }
        - { id: datagw, text: { en: "an on-premises data gateway", fr: "une passerelle de données locale" } }
    - id: fw
      options:
        - { id: out443, text: { en: "outbound connections to Azure on TCP port 443", fr: "les connexions sortantes vers Azure sur le port TCP 443" } }
        - { id: in443, text: { en: "inbound connections from Azure on TCP port 443", fr: "les connexions entrantes depuis Azure sur le port TCP 443" } }
        - { id: in3443, text: { en: "inbound connections from Azure on TCP port 3443", fr: "les connexions entrantes depuis Azure sur le port TCP 3443" } }
answer:
  values: { tier: premium, gw: selfhosted, fw: out443 }
explanation:
  correct:
    en: "The self-hosted gateway is a containerized gateway deployed next to the APIs, so local calls stay local, while it is still configured from the API Management instance in Azure. It exists in the Developer and Premium tiers only, and Developer has no SLA, so Premium is required; the v2 tiers do not offer it. Each self-hosted gateway only needs outbound connectivity to Azure on port 443 to fetch its configuration and send heartbeats."
    fr: "La passerelle auto-hébergée est une passerelle conteneurisée déployée près des API : les appels locaux restent locaux, alors qu'elle reste configurée depuis l'instance API Management dans Azure. Elle n'existe que dans les niveaux Developer et Premium, et Developer n'a pas de SLA : Premium est donc requis ; les niveaux v2 ne la proposent pas. Chaque passerelle auto-hébergée a seulement besoin d'une connectivité sortante vers Azure sur le port 443 pour récupérer sa configuration et envoyer ses pulsations."
  options:
    developer: { en: "The Developer tier supports the self-hosted gateway for evaluation, on a single node and without SLA.", fr: "Le niveau Developer prend en charge la passerelle auto-hébergée à des fins d'évaluation, sur un seul nœud et sans SLA." }
    premv2: { en: "The v2 tiers, Premium v2 included, do not offer the self-hosted gateway.", fr: "Les niveaux v2, Premium v2 compris, ne proposent pas la passerelle auto-hébergée." }
    workspace: { en: "A workspace gateway is an Azure resource that runs the APIs of workspaces; it cannot be deployed on-premises or in AWS.", fr: "Une passerelle d'espace de travail est une ressource Azure qui exécute les API des espaces de travail ; elle ne peut pas être déployée localement ni dans AWS." }
    datagw: { en: "The on-premises data gateway connects services such as Logic Apps to local data sources; it is not an API gateway.", fr: "La passerelle de données locale relie des services comme Logic Apps à des sources de données locales ; ce n'est pas une passerelle d'API." }
references:
  - title: Self-hosted gateway overview
    url: https://learn.microsoft.com/en-us/azure/api-management/self-hosted-gateway-overview
  - title: Feature-based comparison of the Azure API Management tiers
    url: https://learn.microsoft.com/en-us/azure/api-management/api-management-features
