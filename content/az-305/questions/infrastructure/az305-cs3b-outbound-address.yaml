id: az305-cs3b-outbound-address
objective: "4.4.1"
type: single
caseStudy: az305-cs3b-woodgrove
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a solution for the calls from app-loans to the credit bureau. The solution must meet the network requirements and the business requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution pour les appels d'app-loans vers le bureau de crédit. La solution doit satisfaire les exigences réseau et les exigences métier.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Declare all the current outbound IP addresses of app-loans to the credit bureau", fr: "Déclarer au bureau de crédit toutes les adresses IP sortantes actuelles d'app-loans" } }
    - { id: b, text: { en: "Add a private endpoint to app-loans in a new virtual network", fr: "Ajouter un point de terminaison privé à app-loans dans un nouveau réseau virtuel" } }
    - { id: c, text: { en: "Integrate app-loans with a virtual network and route its outbound traffic through Azure Firewall", fr: "Intégrer app-loans à un réseau virtuel et acheminer son trafic sortant par le Pare-feu Azure" } }
    - { id: d, text: { en: "Integrate app-loans with a virtual network and attach a NAT gateway to the integration subnet", fr: "Intégrer app-loans à un réseau virtuel et associer une passerelle NAT au sous-réseau d'intégration" } }
answer: { optionId: d }
explanation:
  correct:
    en: "With regional virtual network integration, the outbound internet traffic of the app leaves through the integration subnet. A NAT gateway on that subnet gives this traffic a static public IP address that doesn't depend on the App Service plan or on its pricing tier. It is the simplest and cheapest way to obtain a predictable outbound address when no inspection is required."
    fr: "Avec l'intégration au réseau virtuel régional, le trafic Internet sortant de l'application sort par le sous-réseau d'intégration. Une passerelle NAT sur ce sous-réseau donne à ce trafic une adresse IP publique statique qui ne dépend ni du plan App Service ni de son niveau tarifaire. C'est le moyen le plus simple et le moins coûteux d'obtenir une adresse sortante prévisible lorsqu'aucune inspection n'est requise."
  options:
    a:
      en: "The set of outbound IP addresses of an app changes when the plan is scaled between certain pricing tiers, which is what caused last year's incident."
      fr: "L'ensemble des adresses IP sortantes d'une application change lorsque le plan passe d'un niveau tarifaire à certains autres, ce qui a causé l'incident de l'an dernier."
    b:
      en: "A private endpoint carries inbound traffic to the app from a virtual network. It has no effect on the address from which the app calls an external service."
      fr: "Un point de terminaison privé transporte le trafic entrant vers l'application depuis un réseau virtuel. Il n'a aucun effet sur l'adresse depuis laquelle l'application appelle un service externe."
    c:
      en: "Azure Firewall also gives a static outbound address, but it is a filtering service that costs more and needs routes and rules to maintain. The requirements ask for no inspection and for minimal cost and effort."
      fr: "Le Pare-feu Azure donne aussi une adresse sortante statique, mais c'est un service de filtrage qui coûte plus cher et demande des itinéraires et des règles à maintenir. Les exigences ne demandent aucune inspection et veulent un coût et un effort minimaux."
references:
  - title: Inbound and outbound IP addresses in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-inbound-outbound-ips
  - title: Configure Azure NAT Gateway integration
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-nat-gateway-integration
