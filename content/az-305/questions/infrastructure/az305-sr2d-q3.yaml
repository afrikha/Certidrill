stem:
  en: |
    You recommend two ExpressRoute circuits in two different peering locations.
  fr: |
    Vous recommandez deux circuits ExpressRoute dans deux emplacements de peering différents.
body:
  solution:
    en: |
      You recommend two **ExpressRoute** circuits in **two different peering locations**, each one through a different connectivity provider. Both circuits are connected to the same ExpressRoute virtual network gateway deployed in VNet1.
    fr: |
      Vous recommandez deux circuits **ExpressRoute** dans **deux emplacements de peering différents**, chacun par un fournisseur de connectivité différent. Les deux circuits sont connectés à la même passerelle de réseau virtuel ExpressRoute déployée dans VNet1.
answer: { value: true }
explanation:
  correct:
    en: |
      Two circuits in two distinct peering locations form the maximum resiliency design of ExpressRoute: the loss of one site, of its edge devices or of one provider leaves the other circuit in service. BGP withdraws the routes of the failed circuit and the traffic moves to the other one automatically. The traffic stays on private connections even during the failure, so the third requirement is met without any encryption.
    fr: |
      Deux circuits dans deux emplacements de peering distincts constituent la conception de résilience maximale d'ExpressRoute : la perte d'un site, de ses équipements de périphérie ou d'un fournisseur laisse l'autre circuit en service. BGP retire les itinéraires du circuit en panne et le trafic passe automatiquement sur l'autre. Le trafic reste sur des connexions privées même pendant la panne : la troisième exigence est donc satisfaite sans aucun chiffrement.
references:
  - title: "Design and architect Azure ExpressRoute for resiliency"
    url: https://learn.microsoft.com/en-us/azure/expressroute/design-architecture-for-resiliency
