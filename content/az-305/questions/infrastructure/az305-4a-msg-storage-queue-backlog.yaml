id: az305-4a-msg-storage-queue-backlog
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The web front end of Adatum hands work items to background workers through a queue. Each work item is a JSON message smaller than 10 KB. During seasonal peaks, the backlog of messages can exceed 150 GB.

    The workers don't need ordering, duplicate detection or publish-subscribe.

    You need to recommend a messaging service that minimizes cost.

    What should you recommend?
  fr: |
    Le serveur web frontal d'Adatum transmet des éléments de travail à des workers d'arrière-plan par l'intermédiaire d'une file d'attente. Chaque élément de travail est un message JSON de moins de 10 Ko. Pendant les pics saisonniers, l'arriéré de messages peut dépasser 150 Go.

    Les workers n'ont besoin ni d'ordre, ni de détection des doublons, ni de publication-abonnement.

    Vous devez recommander un service de messagerie qui réduit les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A queue in an Azure Service Bus Standard namespace", fr: "Une file d'attente dans un espace de noms Azure Service Bus Standard" } }
    - { id: b, text: { en: "A queue in an Azure Service Bus Premium namespace", fr: "Une file d'attente dans un espace de noms Azure Service Bus Premium" } }
    - { id: c, text: { en: "A queue in Azure Queue Storage", fr: "Une file d'attente dans Stockage File d'attente Azure" } }
    - { id: d, text: { en: "An event hub in an Azure Event Hubs Standard namespace", fr: "Un hub d'événements dans un espace de noms Azure Event Hubs Standard" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Queue Storage queue accepts messages of up to 64 KB and can grow to the capacity of the storage account, far beyond 150 GB. It is the simple, low-cost choice for a backlog of small work items when none of the advanced broker features is needed.
    fr: |
      Une file d'attente du Stockage File d'attente accepte des messages jusqu'à 64 Ko et peut grandir jusqu'à la capacité du compte de stockage, bien au-delà de 150 Go. C'est le choix simple et économique pour un arriéré de petits éléments de travail lorsqu'aucune fonctionnalité avancée de répartiteur n'est nécessaire.
  options:
    a:
      en: A Service Bus queue is limited to 80 GB, so it can't hold the peak backlog.
      fr: Une file d'attente Service Bus est limitée à 80 Go ; elle ne peut donc pas contenir l'arriéré des pics.
    b:
      en: The Premium tier doesn't raise the 80 GB limit of a queue, and it is the most expensive option.
      fr: Le niveau Premium ne relève pas la limite de 80 Go d'une file d'attente, et c'est l'option la plus chère.
    d:
      en: Event Hubs ingests streams of events that readers replay by partition; it isn't a work queue in which each message is taken and removed by one worker.
      fr: Event Hubs ingère des flux d'événements que les lecteurs relisent par partition ; ce n'est pas une file d'attente de travail dans laquelle chaque message est pris et supprimé par un worker.
references:
  - title: Storage queues and Service Bus queues - compared and contrasted
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-azure-and-service-bus-queues-compared-contrasted
  - title: What is Azure Queue Storage?
    url: https://learn.microsoft.com/en-us/azure/storage/queues/storage-queues-introduction
