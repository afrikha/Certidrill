id: az305-4d-lb-tm-weighted
objective: "4.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation runs an SFTP service for its suppliers in an on-premises datacenter. Suppliers connect to the service by its DNS name, sftp.adatum.com. Adatum has deployed a copy of the service in Azure behind a Standard public load balancer and wants to migrate the suppliers progressively.

    You need to recommend a solution. The solution must meet the following requirements:

    - Initially send about 10 percent of the new supplier connections to Azure, then increase the share over several weeks.
    - Keep the on-premises service in use until the migration ends.
    - Minimize costs.

    What should you recommend?
  fr: |
    Adatum Corporation exécute un service SFTP pour ses fournisseurs dans un centre de données local. Les fournisseurs se connectent au service par son nom DNS, sftp.adatum.com. Adatum a déployé une copie du service dans Azure derrière un équilibreur de charge public Standard et souhaite migrer les fournisseurs progressivement.

    Vous devez recommander une solution. La solution doit répondre aux exigences suivantes :

    - Envoyer d'abord environ 10 % des nouvelles connexions des fournisseurs vers Azure, puis augmenter la part sur plusieurs semaines.
    - Continuer à utiliser le service local jusqu'à la fin de la migration.
    - Réduire les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Traffic Manager profile that uses the Priority routing method", fr: "Un profil Traffic Manager qui utilise la méthode de routage Priority" } }
    - { id: b, text: { en: "An Azure Front Door profile with weighted origins", fr: "Un profil Azure Front Door avec des origines pondérées" } }
    - { id: c, text: { en: "A Traffic Manager profile that uses the Weighted routing method", fr: "Un profil Traffic Manager qui utilise la méthode de routage Weighted" } }
    - { id: d, text: { en: "A Traffic Manager profile that uses the Performance routing method", fr: "Un profil Traffic Manager qui utilise la méthode de routage Performance" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Traffic Manager works at the DNS level, so it handles any protocol, including SFTP, and supports external endpoints such as the on-premises service. The Weighted routing method distributes the DNS answers according to the weights of the endpoints, which is the documented method for a gradual migration to Azure: the weight of the Azure endpoint is raised over time.
    fr: |
      Traffic Manager agit au niveau DNS : il prend en charge n'importe quel protocole, y compris SFTP, ainsi que les points de terminaison externes comme le service local. La méthode de routage Weighted répartit les réponses DNS selon les poids des points de terminaison, ce qui correspond à la méthode documentée pour une migration progressive vers Azure : on augmente le poids du point de terminaison Azure au fil du temps.
  options:
    a:
      en: |
        Priority routing sends all the traffic to the primary endpoint and uses the other one only for failover; it can't split the traffic.
      fr: |
        Le routage Priority envoie tout le trafic vers le point de terminaison principal et n'utilise l'autre que pour le basculement ; il ne peut pas répartir le trafic.
    b:
      en: |
        Azure Front Door only handles HTTP and HTTPS traffic, not SFTP.
      fr: |
        Azure Front Door ne gère que le trafic HTTP et HTTPS, pas SFTP.
    d:
      en: |
        Performance routing sends each supplier to the endpoint with the lowest latency; it doesn't control the share of traffic.
      fr: |
        Le routage Performance envoie chaque fournisseur vers le point de terminaison dont la latence est la plus faible ; il ne contrôle pas la part du trafic.
references:
  - title: Traffic Manager routing methods
    url: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-routing-methods
