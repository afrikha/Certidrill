id: az305-4b-cache-redis-production
objective: "4.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware designs an Azure Managed Redis instance for a production web application that is hosted on Azure App Service.

    You need to recommend the configuration of the instance.

    How should you complete the recommendation? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware conçoit une instance Azure Managed Redis pour une application web de production hébergée sur Azure App Service.

    Vous devez recommander la configuration de l'instance.

    Comment devez-vous compléter la recommandation ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      So that the cache keeps running when a node fails, [[ha]].

      So that the web application connects without a stored secret, authenticate with [[auth]].
    fr: |
      Pour que le cache continue de fonctionner lorsqu'un nœud tombe en panne, [[ha]].

      Pour que l'application web se connecte sans secret stocké, authentifiez-la avec [[auth]].
  slots:
    - id: ha
      options:
        - { id: persist, text: { en: "enable data persistence", fr: "activez la persistance des données" } }
        - { id: ha, text: { en: "enable high availability", fr: "activez la haute disponibilité" } }
        - { id: flash, text: { en: "select the Flash Optimized tier", fr: "sélectionnez le niveau Flash Optimized" } }
    - id: auth
      options:
        - { id: keyapp, text: { en: "an access key stored in an app setting", fr: "une clé d'accès stockée dans un paramètre d'application" } }
        - { id: keycfg, text: { en: "an access key stored in Azure App Configuration", fr: "une clé d'accès stockée dans Azure App Configuration" } }
        - { id: entra, text: { en: "Microsoft Entra ID and the managed identity of the web application", fr: "Microsoft Entra ID et l'identité managée de l'application web" } }
answer:
  values: { ha: ha, auth: entra }
explanation:
  correct:
    en: "With high availability enabled, the primary and replica shards are distributed over at least two nodes, so the loss of a node does not stop the cache; running without it is meant for development and test. Azure Managed Redis supports Microsoft Entra authentication, which lets the web application sign in with its managed identity instead of an access key."
    fr: "Avec la haute disponibilité activée, les partitions primaires et de réplica sont réparties sur au moins deux nœuds : la perte d'un nœud n'arrête pas le cache ; s'en passer est réservé au développement et au test. Azure Managed Redis prend en charge l'authentification Microsoft Entra, qui permet à l'application web de se connecter avec son identité managée plutôt qu'avec une clé d'accès."
  options:
    persist: { en: "Persistence reloads the data after all the nodes are lost; it does not keep the cache available during a node failure.", fr: "La persistance recharge les données après la perte de tous les nœuds ; elle ne maintient pas le cache disponible pendant la panne d'un nœud." }
    flash: { en: "The Flash Optimized tier changes where data is stored (NVMe), not the number of nodes.", fr: "Le niveau Flash Optimized change l'emplacement de stockage des données (NVMe), pas le nombre de nœuds." }
    keyapp: { en: "An access key in an app setting is a stored secret that must be protected and rotated.", fr: "Une clé d'accès dans un paramètre d'application est un secret stocké qu'il faut protéger et renouveler." }
references:
  - title: What is Azure Managed Redis?
    url: https://learn.microsoft.com/en-us/azure/redis/overview
