id: az305-cs3c-microservices-hosting
objective: "4.1.3"
type: single
caseStudy: az305-cs3c-alpineski
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a hosting service for the microservices of the booking platform. The solution must meet the business requirements and the compute requirements.

    What should you recommend?
  fr: |
    Vous devez recommander un service d'hébergement pour les microservices de la plateforme de réservation. La solution doit satisfaire les exigences métier et les exigences de calcul.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Kubernetes Service (AKS)", fr: "Azure Kubernetes Service (AKS)" } }
    - { id: b, text: { en: "Azure Container Instances", fr: "Azure Container Instances" } }
    - { id: c, text: { en: "Azure App Service (Web App for Containers)", fr: "Azure App Service (Web App for Containers)" } }
    - { id: d, text: { en: "Azure Container Apps", fr: "Azure Container Apps" } }
answer: { optionId: a }
explanation:
  correct:
    en: "The Helm charts, the custom resource definitions and the operators of the microservices need direct access to the Kubernetes API. Among the managed container services, only Azure Kubernetes Service exposes that API, and it can run any Kubernetes workload. The more managed services don't meet this technical requirement, so the business requirement doesn't lead to them."
    fr: "Les charts Helm, les définitions de ressources personnalisées et les opérateurs des microservices ont besoin d'un accès direct à l'API Kubernetes. Parmi les services de conteneurs managés, seul Azure Kubernetes Service expose cette API, et il peut exécuter n'importe quelle charge de travail Kubernetes. Les services plus managés ne satisfont pas cette exigence technique : l'exigence métier ne conduit donc pas à eux."
  options:
    b:
      en: "Container Instances starts individual container groups. It has no autoscaling, no load balancing between instances and no Kubernetes API."
      fr: "Container Instances démarre des groupes de conteneurs individuels. Il n'a ni mise à l'échelle automatique, ni équilibrage de charge entre les instances, ni API Kubernetes."
    c:
      en: "App Service runs containerized web applications and APIs on its own platform. It can't install custom resource definitions or operators."
      fr: "App Service exécute des applications web et des API conteneurisées sur sa propre plateforme. Il ne peut pas installer de définitions de ressources personnalisées ni d'opérateurs."
    d:
      en: "Container Apps is built on Kubernetes and needs less operational work, but it gives no direct access to the Kubernetes API. Teams that need that access are directed to AKS."
      fr: "Container Apps repose sur Kubernetes et demande moins de travail d'exploitation, mais il ne donne aucun accès direct à l'API Kubernetes. Les équipes qui ont besoin de cet accès sont dirigées vers AKS."
references:
  - title: Comparing Container Apps with other Azure container options
    url: https://learn.microsoft.com/en-us/azure/container-apps/compare-options
