id: az305-4c-assess-business-case
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware runs 1,200 servers in two datacenters. An Azure Migrate appliance has discovered the servers and collected their performance data.

    Before the board approves a migration to Azure, the chief financial officer asks for a report that compares the total cost of ownership of the on-premises environment with the cost of the same workloads in Azure, including the savings from Azure Hybrid Benefit.

    The report must be built from the discovered data and must minimize effort.

    What should you recommend?
  fr: |
    Litware exploite 1 200 serveurs dans deux centres de données. Une appliance Azure Migrate a découvert les serveurs et collecté leurs données de performances.

    Avant que le conseil d'administration n'approuve une migration vers Azure, le directeur financier demande un rapport qui compare le coût total de possession de l'environnement local au coût des mêmes charges de travail dans Azure, en incluant les économies d'Azure Hybrid Benefit.

    Le rapport doit être établi à partir des données découvertes et réduire l'effort au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An estimate in the Azure pricing calculator", fr: "Une estimation dans la calculatrice de prix Azure" } }
    - { id: b, text: { en: "A business case in Azure Migrate", fr: "Une analyse de rentabilité dans Azure Migrate" } }
    - { id: c, text: { en: "An Azure VM assessment in Azure Migrate", fr: "Une évaluation de machines virtuelles Azure dans Azure Migrate" } }
    - { id: d, text: { en: "A cost analysis view in Microsoft Cost Management", fr: "Une vue d'analyse des coûts dans Microsoft Cost Management" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The business case of Azure Migrate is generated from the discovered servers. It compares the total cost of ownership on-premises and in Azure and shows the savings, including those of Azure Hybrid Benefit, which is what a financial decision maker needs before approving the project.
    fr: |
      L'analyse de rentabilité d'Azure Migrate est générée à partir des serveurs découverts. Elle compare le coût total de possession en local et dans Azure et montre les économies, y compris celles d'Azure Hybrid Benefit : c'est ce dont un décideur financier a besoin avant d'approuver le projet.
  options:
    a:
      en: The pricing calculator estimates Azure prices from values typed by hand; it doesn't use the discovered data or compute the on-premises cost.
      fr: La calculatrice de prix estime des prix Azure à partir de valeurs saisies à la main ; elle n'utilise pas les données découvertes et ne calcule pas le coût en local.
    c:
      en: An assessment estimates the monthly Azure cost of the servers, but it doesn't compare it with the on-premises total cost of ownership.
      fr: Une évaluation estime le coût mensuel Azure des serveurs, mais ne le compare pas au coût total de possession en local.
    d:
      en: Cost Management analyzes what existing Azure resources already cost; the workloads aren't in Azure yet.
      fr: Cost Management analyse ce que coûtent déjà des ressources Azure existantes ; les charges de travail ne sont pas encore dans Azure.
references:
  - title: Business case (preview) overview
    url: https://learn.microsoft.com/en-us/azure/migrate/concepts-business-case-calculation?view=migrate-classic
