id: az305-4c-mig-three-tier
objective: "4.3.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys plans to migrate an on-premises application that has three tiers.

    | Tier | Description |
    | --- | --- |
    | Web | ASP.NET application on IIS, with no dependency on the operating system |
    | Processing | Windows service that relies on a licensed third-party driver installed in the operating system |
    | Data | SQL Server 2019 instance with three databases that use cross-database queries and SQL Server Agent jobs |

    You need to recommend a target for each tier. The solution must meet the following requirements:

    - The application code and the database code must not change.
    - Each tier must use the compatible hosting option that requires the least management of the operating system and the platform.

    What should you recommend for each tier? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit de migrer une application locale composée de trois niveaux.

    | Niveau | Description |
    | --- | --- |
    | Web | Application ASP.NET sur IIS, sans dépendance vis-à-vis du système d'exploitation |
    | Traitement | Service Windows qui s'appuie sur un pilote tiers sous licence installé dans le système d'exploitation |
    | Données | Instance SQL Server 2019 avec trois bases de données qui utilisent des requêtes entre bases de données et des travaux SQL Server Agent |

    Vous devez recommander une cible pour chaque niveau. La solution doit répondre aux exigences suivantes :

    - Le code de l'application et le code des bases de données ne doivent pas changer.
    - Chaque niveau doit utiliser l'option d'hébergement compatible qui demande le moins de gestion du système d'exploitation et de la plateforme.

    Que devez-vous recommander pour chaque niveau ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Web tier: [[web]]

      Processing tier: [[proc]]

      Data tier: [[data]]
    fr: |
      Niveau Web : [[web]]

      Niveau Traitement : [[proc]]

      Niveau Données : [[data]]
  slots:
    - id: web
      options:
        - { id: vm, text: { en: "Azure Virtual Machines", fr: "Machines virtuelles Azure" } }
        - { id: app, text: "Azure App Service" }
        - { id: func, text: "Azure Functions" }
        - { id: swa, text: "Azure Static Web Apps" }
    - id: proc
      options:
        - { id: app, text: "Azure App Service" }
        - { id: func, text: "Azure Functions" }
        - { id: aca, text: "Azure Container Apps" }
        - { id: vm, text: { en: "Azure Virtual Machines", fr: "Machines virtuelles Azure" } }
    - id: data
      options:
        - { id: sqldb, text: "Azure SQL Database" }
        - { id: sqlvm, text: { en: "SQL Server on Azure Virtual Machines", fr: "SQL Server sur Machines virtuelles Azure" } }
        - { id: sqlmi, text: "Azure SQL Managed Instance" }
        - { id: pg, text: { en: "Azure Database for PostgreSQL", fr: "Azure Database pour PostgreSQL" } }
answer:
  values: { web: app, proc: vm, data: sqlmi }
explanation:
  correct:
    en: |
      An ASP.NET application without operating system dependencies runs unchanged on Azure App Service, where Microsoft manages the servers. A Windows service that needs a driver installed in the operating system requires full control of that operating system, which only a virtual machine gives. Cross-database queries and SQL Server Agent are instance-scoped features: Azure SQL Managed Instance supports them as a managed service, without code changes.
    fr: |
      Une application ASP.NET sans dépendance vis-à-vis du système d'exploitation s'exécute sans modification sur Azure App Service, où Microsoft gère les serveurs. Un service Windows qui a besoin d'un pilote installé dans le système d'exploitation exige le contrôle complet de ce système, que seule une machine virtuelle donne. Les requêtes entre bases de données et SQL Server Agent sont des fonctionnalités à l'échelle de l'instance : Azure SQL Managed Instance les prend en charge sous forme de service managé, sans modification du code.
  options:
    func:
      en: Azure Functions hosts event-driven functions; moving an existing web application or Windows service to it means rewriting code.
      fr: Azure Functions héberge des fonctions pilotées par les événements ; y déplacer une application web ou un service Windows existant impose de réécrire du code.
    swa:
      en: Azure Static Web Apps serves static front ends, not a server-side ASP.NET application.
      fr: Azure Static Web Apps sert des front-ends statiques, pas une application ASP.NET côté serveur.
    aca:
      en: Azure Container Apps runs containers on a managed platform and gives no access to install a driver in the host operating system.
      fr: Azure Container Apps exécute des conteneurs sur une plateforme managée et ne donne aucun accès pour installer un pilote dans le système d'exploitation hôte.
    sqldb:
      en: Azure SQL Database lacks instance-scoped features such as SQL Server Agent, so the database code would have to change.
      fr: Azure SQL Database ne dispose pas des fonctionnalités à l'échelle de l'instance comme SQL Server Agent ; le code des bases de données devrait changer.
    sqlvm:
      en: SQL Server on a virtual machine is compatible but leaves the operating system and the instance to manage.
      fr: SQL Server sur une machine virtuelle est compatible, mais laisse le système d'exploitation et l'instance à gérer.
