id: az305-4c-assess-physical-aws
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs 250 physical Linux servers in a colocation facility and 120 Amazon EC2 instances.

    You need to recommend how to collect the configuration and performance data that an Azure Migrate assessment of all these servers requires. The solution must minimize the software deployed on the servers.

    What should you recommend?
  fr: |
    Tailspin Toys exploite 250 serveurs Linux physiques dans un centre de colocation et 120 instances Amazon EC2.

    Vous devez recommander la façon de collecter les données de configuration et de performances qu'exige une évaluation Azure Migrate de tous ces serveurs. La solution doit réduire au minimum les logiciels déployés sur les serveurs.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The Mobility service agent installed on each server", fr: "L'agent du service Mobilité installé sur chaque serveur" } }
    - { id: b, text: { en: "An Azure Migrate appliance deployed from the OVA template for VMware", fr: "Une appliance Azure Migrate déployée à partir du modèle OVA pour VMware" } }
    - { id: c, text: { en: "Azure Monitor Agent installed on each server, with a data collection rule", fr: "Azure Monitor Agent installé sur chaque serveur, avec une règle de collecte de données" } }
    - { id: d, text: { en: "An Azure Migrate appliance set up for physical servers, with credentials for the servers", fr: "Une appliance Azure Migrate configurée pour les serveurs physiques, avec des informations d'identification pour les serveurs" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure Migrate discovers physical servers, and virtual machines of other clouds that it treats as physical servers, through an appliance installed by script on a separate machine. The appliance connects to the servers with the credentials that you provide and collects configuration and performance data without an agent on them.
    fr: |
      Azure Migrate découvre les serveurs physiques, ainsi que les machines virtuelles d'autres clouds qu'il traite comme des serveurs physiques, grâce à une appliance installée par script sur une machine distincte. L'appliance se connecte aux serveurs avec les informations d'identification que vous fournissez et collecte les données de configuration et de performances sans agent sur ces serveurs.
  options:
    a:
      en: The Mobility service agent replicates disks during an agent-based migration; it isn't needed for discovery and assessment.
      fr: L'agent du service Mobilité réplique les disques pendant une migration avec agent ; il n'est pas nécessaire pour la découverte et l'évaluation.
    b:
      en: The OVA appliance discovers servers through vCenter Server, which doesn't manage physical servers or EC2 instances.
      fr: L'appliance OVA découvre les serveurs par l'intermédiaire de vCenter Server, qui ne gère ni les serveurs physiques ni les instances EC2.
    c:
      en: Azure Monitor Agent would deploy software on every server and sends data to Azure Monitor, not to an Azure Migrate project.
      fr: Azure Monitor Agent déploierait un logiciel sur chaque serveur et envoie les données à Azure Monitor, pas à un projet Azure Migrate.
references:
  - title: Azure Migrate appliance
    url: https://learn.microsoft.com/en-us/azure/migrate/migrate-appliance
