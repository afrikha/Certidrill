id: az305-4c-hyb-er-local
objective: "4.4.2"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Contoso has a datacenter in Amsterdam. All its Azure workloads run in the West Europe region, and the company doesn't plan to use another region.

    Contoso will connect the datacenter to Azure through a connectivity provider at the Amsterdam peering location, with a 2-Gbps ExpressRoute circuit. The circuit will only use private peering. Every night, about 15 TB of data are transferred from Azure to the datacenter.

    You need to recommend an ExpressRoute circuit SKU. The solution must minimize the total cost, including data transfer.

    Which SKU should you recommend?
  fr: |
    Contoso possède un centre de données à Amsterdam. Toutes ses charges de travail Azure s'exécutent dans la région West Europe, et l'entreprise ne prévoit pas d'utiliser une autre région.

    Contoso connectera le centre de données à Azure par un fournisseur de connectivité à l'emplacement de peering d'Amsterdam, avec un circuit ExpressRoute de 2 Gbit/s. Le circuit n'utilisera que le peering privé. Chaque nuit, environ 15 To de données sont transférés d'Azure vers le centre de données.

    Vous devez recommander une référence SKU de circuit ExpressRoute. La solution doit réduire au minimum le coût total, transfert de données compris.

    Quelle référence SKU devez-vous recommander ?
body:
  options:
    - { id: a, text: "Local" }
    - { id: b, text: "Standard" }
    - { id: c, text: "Premium" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Local circuit only reaches the one or two Azure regions close to its peering location, here West Europe from Amsterdam, which is all that Contoso needs. Its price includes the outbound data transfer, whereas egress is paid in addition on Standard and Premium circuits. With hundreds of terabytes leaving Azure each month, Local is the most economical SKU.
    fr: |
      Un circuit Local n'atteint que la ou les deux régions Azure proches de son emplacement de peering, ici West Europe depuis Amsterdam, ce qui suffit à Contoso. Son prix inclut le transfert de données sortant, alors que les données sortantes sont payées en plus sur les circuits Standard et Premium. Avec des centaines de téraoctets quittant Azure chaque mois, Local est la référence SKU la plus économique.
  options:
    b:
      en: A Standard circuit reaches all the regions of the geopolitical area, which Contoso doesn't need, and the outbound data transfer is paid on top of the circuit.
      fr: Un circuit Standard atteint toutes les régions de la zone géopolitique, ce dont Contoso n'a pas besoin, et le transfert de données sortant est payé en plus du circuit.
    c:
      en: A Premium circuit adds access to regions worldwide and higher limits at an extra charge, with none of them needed here.
      fr: Un circuit Premium ajoute, moyennant un supplément, l'accès aux régions du monde entier et des limites plus élevées, dont aucune n'est nécessaire ici.
