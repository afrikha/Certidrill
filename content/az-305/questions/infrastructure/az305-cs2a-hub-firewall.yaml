id: az305-cs2a-hub-firewall
objective: "4.4.4"
type: single
caseStudy: az305-cs2a-lamna-healthcare
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a solution to control the outbound internet traffic of the spoke virtual networks. The solution must meet the network security requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une solution pour contrôler le trafic Internet sortant des réseaux virtuels spoke. La solution doit respecter les exigences relatives à la sécurité du réseau.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Firewall Basic", fr: "Pare-feu Azure Basic" } }
    - { id: b, text: { en: "Azure Firewall Standard", fr: "Pare-feu Azure Standard" } }
    - { id: c, text: { en: "Azure Firewall Premium", fr: "Pare-feu Azure Premium" } }
    - { id: d, text: { en: "Network security groups with service tags", fr: "Des groupes de sécurité réseau avec des balises de service" } }
answer: { optionId: c }
explanation:
  correct:
    en: Every Azure Firewall SKU can restrict outbound traffic to a list of FQDNs with application rules, but TLS inspection, which decrypts outbound HTTPS traffic, and the intrusion detection and prevention system exist only in the Premium SKU. Premium is therefore the least expensive SKU that meets all the requirements.
    fr: Toutes les références SKU du Pare-feu Azure peuvent limiter le trafic sortant à une liste de FQDN avec des règles d'application, mais l'inspection TLS, qui déchiffre le trafic HTTPS sortant, et le système de détection et de prévention des intrusions n'existent que dans la référence SKU Premium. Premium est donc la référence SKU la moins coûteuse qui respecte toutes les exigences.
  options:
    a: { en: "The Basic SKU filters FQDNs but offers neither TLS inspection nor IDPS, and its threat intelligence only raises alerts.", fr: "La référence SKU Basic filtre les FQDN, mais n'offre ni inspection TLS ni IDPS, et son renseignement sur les menaces ne fait qu'émettre des alertes." }
    b: { en: "The Standard SKU costs less than Premium and filters FQDNs, but it can't decrypt HTTPS traffic and has no IDPS.", fr: "La référence SKU Standard coûte moins cher que Premium et filtre les FQDN, mais elle ne peut pas déchiffrer le trafic HTTPS et n'a pas d'IDPS." }
    d: { en: "Network security groups filter on IP addresses, ports and service tags; they can't filter on FQDNs or inspect traffic.", fr: "Les groupes de sécurité réseau filtrent sur des adresses IP, des ports et des balises de service ; ils ne peuvent ni filtrer sur des FQDN ni inspecter le trafic." }
references:
  - title: Choose the right Azure Firewall SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/firewall/choose-firewall-sku
