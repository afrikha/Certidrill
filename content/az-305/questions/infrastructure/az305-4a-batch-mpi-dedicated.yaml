id: az305-4a-batch-mpi-dedicated
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum runs a computational fluid dynamics solver in Azure Batch. A simulation is a tightly coupled MPI job that spans 64 nodes for about 36 hours. The solver has no checkpointing, and the results must be delivered by a contractual deadline.

    You need to recommend a pool configuration. The solution must meet the following requirements:

    - The nodes communicate over a low-latency RDMA network.
    - A simulation must not have to be rerun from the beginning.
    - Subject to the other requirements, minimize cost.

    Which pool configuration should you recommend?
  fr: |
    Adatum exécute un solveur de dynamique des fluides numérique dans Azure Batch. Une simulation est un travail MPI fortement couplé qui s'étend sur 64 nœuds pendant environ 36 heures. Le solveur n'a pas de points de contrôle, et les résultats doivent être livrés avant une échéance contractuelle.

    Vous devez recommander une configuration de pool. La solution doit répondre aux exigences suivantes :

    - Les nœuds communiquent sur un réseau RDMA à faible latence.
    - Une simulation ne doit pas avoir à être relancée depuis le début.
    - Sous réserve des autres exigences, réduire les coûts au minimum.

    Quelle configuration de pool devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Spot nodes of an HB-series size", fr: "Des nœuds Spot d'une taille de série HB" } }
    - { id: b, text: { en: "Spot nodes of an F-series size", fr: "Des nœuds Spot d'une taille de série F" } }
    - { id: c, text: { en: "Dedicated nodes of an HB-series size", fr: "Des nœuds dédiés d'une taille de série HB" } }
    - { id: d, text: { en: "Dedicated nodes of an F-series size", fr: "Des nœuds dédiés d'une taille de série F" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Tightly coupled workloads need HPC sizes: the HB-series is designed for fluid dynamics and provides the RDMA network that MPI uses. Spot nodes are not recommended for long MPI jobs, because the preemption of a single node can force the whole job to run again; without checkpointing, only dedicated nodes protect the deadline.
    fr: |
      Les charges fortement couplées exigent des tailles HPC : la série HB est conçue pour la dynamique des fluides et fournit le réseau RDMA qu'utilise MPI. Les nœuds Spot sont déconseillés pour les longs travaux MPI, car la préemption d'un seul nœud peut obliger à relancer tout le travail ; sans points de contrôle, seuls des nœuds dédiés protègent l'échéance.
  options:
    a:
      en: HB-series Spot nodes have the right network and cost less, but one preemption during the 36 hours would force the whole simulation to restart.
      fr: Des nœuds Spot de série HB ont le bon réseau et coûtent moins cher, mais une seule préemption pendant les 36 heures obligerait à relancer toute la simulation.
    b:
      en: F-series sizes are compute optimized but have no RDMA network, and Spot nodes can be preempted.
      fr: Les tailles de série F sont optimisées pour le calcul, mais n'ont pas de réseau RDMA, et les nœuds Spot peuvent être préemptés.
    d:
      en: Dedicated F-series nodes aren't preempted, but they lack the low-latency RDMA network that the solver requires.
      fr: Des nœuds dédiés de série F ne sont pas préemptés, mais il leur manque le réseau RDMA à faible latence qu'exige le solveur.
references:
