id: az305-4b-caf-migration-yn
objective: "4.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to move the workloads of its datacenter to Azure and follows the Microsoft Cloud Adoption Framework for Azure. The project team makes several statements during a design review.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit de déplacer les charges de travail de son centre de données vers Azure et suit le Microsoft Cloud Adoption Framework pour Azure. L'équipe projet formule plusieurs affirmations lors d'une revue de conception.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Rehosting the servers as Azure virtual machines is, on its own, a modernization of the workloads."
        fr: "Réhéberger les serveurs sous forme de machines virtuelles Azure constitue, à lui seul, une modernisation des charges de travail."
    - id: s2
      text:
        en: "A workload that is stable and compliant and has no near-term driver to move can be assigned the Retain strategy."
        fr: "Une charge de travail stable et conforme, sans motif de déplacement à court terme, peut se voir attribuer la stratégie Retain."
    - id: s3
      text:
        en: "The rollback criteria and procedures of a workload are established before its migration starts."
        fr: "Les critères et les procédures de retour arrière d'une charge de travail sont établis avant le début de sa migration."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Migration changes where a workload runs, whereas modernization improves how it meets its requirements: a rehost alone is not a modernization. Retain keeps a workload in its current environment when it is stable, compliant and has no near-term driver to move. The framework asks to always establish rollback criteria and procedures before initiating a migration."
    fr: "La migration change l'endroit où une charge de travail s'exécute, alors que la modernisation améliore la façon dont elle répond à ses exigences : un rehost seul n'est pas une modernisation. Retain conserve une charge de travail dans son environnement actuel lorsqu'elle est stable, conforme et sans motif de déplacement à court terme. Le framework demande de toujours établir les critères et les procédures de retour arrière avant de lancer une migration."
references:
  - title: Modernization preparation
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/modernize/
  - title: Plan your migration
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/migrate/plan-migration
