id: az305-4b-cache-aside-practices
objective: "4.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders reads product data from Azure SQL Database. Product pages are displayed thousands of times per minute, and a product is updated a few times per week.

    You plan to add an Azure Managed Redis instance and to apply the cache-aside pattern to reduce the load on the database.

    Which two practices should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders lit des données de produits dans Azure SQL Database. Les pages de produits sont affichées des milliers de fois par minute, et un produit est mis à jour quelques fois par semaine.

    Vous prévoyez d'ajouter une instance Azure Managed Redis et d'appliquer le modèle cache-aside pour réduire la charge sur la base de données.

    Quelles sont les deux pratiques à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "On a cache miss, read the product from the database and store it in the cache with an expiration time", fr: "En cas d'absence dans le cache, lire le produit dans la base de données et le stocker dans le cache avec un délai d'expiration" } }
    - { id: b, text: { en: "When a product is updated, remove the cached item and then write the change to the database", fr: "Lors de la mise à jour d'un produit, supprimer l'élément mis en cache puis écrire la modification dans la base de données" } }
    - { id: c, text: { en: "Store the products in the cache without an expiration time so that they are never reloaded", fr: "Stocker les produits dans le cache sans délai d'expiration afin qu'ils ne soient jamais rechargés" } }
    - { id: d, text: { en: "When a product is updated, write the change to the database and then invalidate the cached item", fr: "Lors de la mise à jour d'un produit, écrire la modification dans la base de données puis invalider l'élément mis en cache" } }
    - { id: e, text: { en: "Write the product updates to the cache only and use the cache as the system of record", fr: "Écrire les mises à jour de produits uniquement dans le cache et utiliser le cache comme système de référence" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "With cache-aside, the application reads the cache first and, on a miss, loads the item from the data store and adds it to the cache; an expiration policy adapted to the access pattern limits stale data. On an update, the application writes to the data store first and then invalidates the cached item, so that the next read reloads the new value."
    fr: "Avec le modèle cache-aside, l'application lit d'abord le cache et, en cas d'absence, charge l'élément depuis le magasin de données et l'ajoute au cache ; une stratégie d'expiration adaptée au mode d'accès limite les données obsolètes. Lors d'une mise à jour, l'application écrit d'abord dans le magasin de données puis invalide l'élément mis en cache, afin que la lecture suivante recharge la nouvelle valeur."
  options:
    b:
      en: "Removing the cached item first leaves a short window in which a reader reloads the old value from the database before the update is written."
      fr: "Supprimer d'abord l'élément mis en cache laisse un court intervalle pendant lequel un lecteur recharge l'ancienne valeur depuis la base de données avant l'écriture de la mise à jour."
    c:
      en: "Without expiration, a change made by another process never reaches the cache, and unused items stay in memory until they are evicted."
      fr: "Sans expiration, une modification faite par un autre processus n'atteint jamais le cache, et les éléments inutilisés restent en mémoire jusqu'à leur éviction."
    e:
      en: "A cache is not an authoritative store: its data can be lost or evicted, so every important change must be saved in the database."
      fr: "Un cache n'est pas un magasin faisant autorité : ses données peuvent être perdues ou évincées, toute modification importante doit donc être enregistrée dans la base de données."
references:
  - title: Cache-Aside pattern
    url: https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside
