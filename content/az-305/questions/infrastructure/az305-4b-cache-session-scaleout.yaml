id: az305-4b-cache-session-scaleout
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs an e-commerce web application on eight instances of an Azure App Service plan. Each instance keeps the shopping carts in its own memory, so customers lose their cart when a request reaches another instance or when the plan scales in.

    You need to recommend a solution that meets the following requirements:

    - A cart must be available to every instance, with session affinity disabled.
    - Reading and writing a cart must stay as fast as an in-memory access.

    What should you recommend?
  fr: |
    Contoso exécute une application web de commerce électronique sur huit instances d'un plan App Service. Chaque instance conserve les paniers dans sa propre mémoire : les clients perdent leur panier lorsqu'une requête atteint une autre instance ou lorsque le plan diminue le nombre d'instances.

    Vous devez recommander une solution qui répond aux exigences suivantes :

    - Un panier doit être disponible pour toutes les instances, l'affinité de session étant désactivée.
    - La lecture et l'écriture d'un panier doivent rester aussi rapides qu'un accès en mémoire.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Store the session state in Azure Managed Redis", fr: "Stocker l'état de session dans Azure Managed Redis" } }
    - { id: b, text: { en: "Add a response caching policy in Azure API Management", fr: "Ajouter une stratégie de mise en cache des réponses dans Azure API Management" } }
    - { id: c, text: { en: "Enable caching on an Azure Front Door route", fr: "Activer la mise en cache sur une route Azure Front Door" } }
    - { id: d, text: { en: "Scale up the plan to give more memory to each instance", fr: "Augmenter la taille du plan pour donner plus de mémoire à chaque instance" } }
answer: { optionId: a }
explanation:
  correct:
    en: "A shared in-memory cache such as Azure Managed Redis is the usual session store for an application that runs on several instances: every instance reads and writes the same cart, so no server affinity is required and instances can be added or removed freely."
    fr: "Un cache en mémoire partagé comme Azure Managed Redis est le magasin de sessions habituel d'une application qui s'exécute sur plusieurs instances : toutes les instances lisent et écrivent le même panier, sans affinité de serveur, et des instances peuvent être ajoutées ou retirées librement."
  options:
    c:
      en: "Front Door caches responses to GET requests at the edge; it cannot hold per-user state that the application modifies."
      fr: "Front Door met en cache les réponses aux requêtes GET en périphérie ; il ne peut pas contenir un état propre à chaque utilisateur que l'application modifie."
    b:
      en: "A response caching policy stores API responses in the gateway; it is not a store that the web application can write session data to."
      fr: "Une stratégie de mise en cache des réponses stocke des réponses d'API dans la passerelle ; ce n'est pas un magasin où l'application web peut écrire des données de session."
    d:
      en: "More memory per instance keeps the carts private to each instance; they are still lost when another instance serves the request."
      fr: "Plus de mémoire par instance laisse les paniers privés à chaque instance ; ils sont toujours perdus quand une autre instance traite la requête."
references:
  - title: Caching guidance
    url: https://learn.microsoft.com/en-us/azure/architecture/best-practices/caching
  - title: What is Azure Managed Redis?
    url: https://learn.microsoft.com/en-us/azure/redis/overview
