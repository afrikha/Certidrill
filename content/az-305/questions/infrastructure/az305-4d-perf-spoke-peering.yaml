id: az305-4d-perf-spoke-peering
objective: "4.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses a hub-spoke topology in the North Europe region. Azure Firewall is deployed in the hub virtual network. The route table of every spoke subnet contains a single route, 0.0.0.0/0, with the firewall as the next hop, so all spoke-to-spoke traffic is inspected by the firewall.

    Every night, SQL Server virtual machines in a spoke named Spoke-DB send several terabytes to reporting servers in a spoke named Spoke-Rpt. Both spokes belong to the same workload. The security team confirms that this flow doesn't need to be inspected.

    You need to recommend a solution. The solution must meet the following requirements:

    - Minimize the latency between Spoke-DB and Spoke-Rpt.
    - Reduce the Azure Firewall processing costs.
    - Minimize administrative effort.

    What should you recommend?
  fr: |
    Contoso utilise une topologie hub-and-spoke dans la région North Europe. Le Pare-feu Azure est déployé dans le réseau virtuel hub. La table de routage de chaque sous-réseau spoke contient un seul itinéraire, 0.0.0.0/0, avec le pare-feu comme tronçon suivant : tout le trafic entre spokes est donc inspecté par le pare-feu.

    Chaque nuit, des machines virtuelles SQL Server d'un spoke nommé Spoke-DB envoient plusieurs téraoctets à des serveurs de rapports d'un spoke nommé Spoke-Rpt. Les deux spokes appartiennent à la même charge de travail. L'équipe de sécurité confirme que ce flux n'a pas besoin d'être inspecté.

    Vous devez recommander une solution. La solution doit répondre aux exigences suivantes :

    - Réduire au minimum la latence entre Spoke-DB et Spoke-Rpt.
    - Réduire les coûts de traitement du Pare-feu Azure.
    - Réduire au minimum l'effort d'administration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Deploy a VPN gateway in each spoke and create a VNet-to-VNet connection", fr: "Déployer une passerelle VPN dans chaque spoke et créer une connexion de réseau virtuel à réseau virtuel" } }
    - { id: b, text: { en: "Create a virtual network peering between Spoke-DB and Spoke-Rpt", fr: "Créer un peering de réseaux virtuels entre Spoke-DB et Spoke-Rpt" } }
    - { id: c, text: { en: "Deploy Azure Route Server in the hub virtual network", fr: "Déployer Azure Route Server dans le réseau virtuel hub" } }
    - { id: d, text: { en: "Upgrade Azure Firewall from the Standard SKU to the Premium SKU", fr: "Mettre à niveau le Pare-feu Azure de la référence SKU Standard vers Premium" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A direct peering between the two spokes removes the hop through the hub firewall; Microsoft recommends it to minimize latency for flows such as database synchronization between spokes of the same workload. The peering adds a system route for the address space of the other spoke, which is more specific than the 0.0.0.0/0 route, so the replication traffic no longer reaches the firewall and stops generating firewall processing charges.
    fr: |
      Un peering direct entre les deux spokes supprime le passage par le pare-feu du hub ; Microsoft le recommande pour réduire la latence des flux tels que la synchronisation de bases de données entre spokes d'une même charge de travail. Le peering ajoute un itinéraire système pour l'espace d'adressage de l'autre spoke, plus spécifique que l'itinéraire 0.0.0.0/0 : le trafic de réplication n'atteint plus le pare-feu et ne génère plus de frais de traitement du pare-feu.
  options:
    a:
      en: |
        VPN gateways add encryption overhead, gateway costs and lower throughput than peering over the Microsoft backbone.
      fr: |
        Des passerelles VPN ajoutent la surcharge du chiffrement, le coût des passerelles et un débit inférieur à celui d'un peering sur le réseau principal de Microsoft.
    c:
      en: |
        Azure Route Server exchanges routes with NVAs over BGP; it doesn't forward traffic and doesn't create a path between the spokes.
      fr: |
        Azure Route Server échange des itinéraires avec des NVA par BGP ; il ne transmet pas de trafic et ne crée pas de chemin entre les spokes.
    d:
      en: |
        The Premium SKU adds TLS inspection and IDPS at a higher price; the traffic still makes the extra hop through the firewall.
      fr: |
        La référence SKU Premium ajoute l'inspection TLS et l'IDPS pour un prix plus élevé ; le trafic fait toujours le détour par le pare-feu.
references:
  - title: Hub-spoke network topology in Azure
    url: https://learn.microsoft.com/en-us/azure/architecture/networking/architecture/hub-spoke
