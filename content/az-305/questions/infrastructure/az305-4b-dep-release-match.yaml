id: az305-4b-dep-release-match
objective: "4.2.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum wants to release new versions of its applications without interrupting the users.

    You need to recommend a feature for each requirement. To answer, drag the appropriate features to the correct requirements. Each feature may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum veut mettre en production de nouvelles versions de ses applications sans interrompre les utilisateurs.

    Vous devez recommander une fonctionnalité pour chaque exigence. Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: swap, text: { en: "Deployment slot swap", fr: "Échange d'emplacements de déploiement" } }
    - { id: autoswap, text: { en: "Auto swap", fr: "Échange automatique" } }
    - { id: split, text: { en: "Traffic splitting between revisions", fr: "Fractionnement du trafic entre les révisions" } }
    - { id: label, text: { en: "Revision label", fr: "Étiquette de révision" } }
    - { id: single, text: { en: "Single revision mode", fr: "Mode de révision unique" } }
  targets:
    - id: t1
      text:
        en: "Web app on Azure App Service: once the new version is validated in staging, put it in production without dropping requests and be able to return to the previous version at once"
        fr: "Application web sur Azure App Service : une fois la nouvelle version validée en préproduction, la mettre en production sans perdre de requêtes et pouvoir revenir aussitôt à la version précédente"
    - id: t2
      text:
        en: "Container app on Azure Container Apps: send 10 percent of the requests to the new version while the previous version serves the rest"
        fr: "Application conteneur sur Azure Container Apps : envoyer 10 % des requêtes à la nouvelle version pendant que la version précédente traite le reste"
    - id: t3
      text:
        en: "Container app on Azure Container Apps: give testers a stable URL to the new version, which receives no production traffic"
        fr: "Application conteneur sur Azure Container Apps : donner aux testeurs une URL stable vers la nouvelle version, qui ne reçoit aucun trafic de production"
answer:
  mapping: { t1: swap, t2: split, t3: label }
explanation:
  correct:
    en: "A slot swap warms up the staging slot and then exchanges it with production with no dropped request; the same swap brings the last known good version back. In multiple revision mode, a container app splits traffic between revisions by percentage. A label gives a revision its own URL, which stays the same when the label moves to another revision, and it works independently of traffic splitting."
    fr: "Un échange d'emplacements préchauffe l'emplacement de préproduction puis l'échange avec la production sans perdre de requête ; le même échange rétablit la dernière version correcte connue. En mode de révisions multiples, une application conteneur fractionne le trafic entre les révisions par pourcentage. Une étiquette donne à une révision sa propre URL, qui reste la même quand l'étiquette passe à une autre révision, et elle fonctionne indépendamment du fractionnement du trafic."
  options:
    autoswap: { en: "Auto swap swaps as soon as the code is pushed to the slot, before any validation in staging.", fr: "L'échange automatique échange dès que le code est poussé dans l'emplacement, avant toute validation en préproduction." }
    single: { en: "In single revision mode, the new revision replaces the old one for all the traffic; there is no split.", fr: "En mode de révision unique, la nouvelle révision remplace l'ancienne pour tout le trafic ; il n'y a pas de fractionnement." }
references:
  - title: Set up staging environments in Azure App Service
    url: https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
  - title: Update and deploy changes in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/revisions
