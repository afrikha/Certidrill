id: az305-4d-sec-statements
objective: "4.4.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Contoso is designing the network security of a three-tier application. The web, application and database tiers run on virtual machines in separate subnets of one virtual network named VNet1. The application tier uses an Azure SQL Database logical server named sql-contoso.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso conçoit la sécurité réseau d'une application à trois niveaux. Les niveaux web, application et base de données s'exécutent sur des machines virtuelles dans des sous-réseaux distincts d'un réseau virtuel nommé VNet1. Le niveau application utilise un serveur logique Azure SQL Database nommé sql-contoso.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A network security group rule can allow the web tier to send outbound traffic only to the FQDN api.fabrikam.com.
        fr: |
          Une règle de groupe de sécurité réseau peut autoriser le niveau web à envoyer du trafic sortant uniquement vers le FQDN api.fabrikam.com.
    - id: s2
      text:
        en: |
          Network security group rules can use application security groups as source and destination to allow traffic from the application tier to the database tier without listing IP addresses.
        fr: |
          Les règles de groupe de sécurité réseau peuvent utiliser des groupes de sécurité d'application comme source et destination pour autoriser le trafic du niveau application vers le niveau base de données sans lister d'adresses IP.
    - id: s3
      text:
        en: |
          Creating a private endpoint for sql-contoso in VNet1 also blocks connections to the public endpoint of sql-contoso.
        fr: |
          La création d'un point de terminaison privé pour sql-contoso dans VNet1 bloque aussi les connexions au point de terminaison public de sql-contoso.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Network security groups filter on IP addresses, ports, protocols, service tags and application security groups, not on FQDNs; FQDN filtering requires Azure Firewall. Application security groups group the network interfaces of a tier so that NSG rules reference the tier instead of IP addresses, as long as the members are in the same virtual network. A private endpoint adds a private IP address for the server but doesn't restrict public network access, which must be disabled separately.
    fr: |
      Les groupes de sécurité réseau filtrent sur les adresses IP, les ports, les protocoles, les balises de service et les groupes de sécurité d'application, pas sur les FQDN ; le filtrage par FQDN exige le Pare-feu Azure. Les groupes de sécurité d'application regroupent les interfaces réseau d'un niveau pour que les règles NSG désignent le niveau au lieu d'adresses IP, à condition que les membres soient dans le même réseau virtuel. Un point de terminaison privé ajoute une adresse IP privée pour le serveur, mais ne restreint pas l'accès réseau public, qu'il faut désactiver séparément.
references:
  - title: Azure Application Security Groups Overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
