id: az305-4a-msg-payment-reliability
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The payment service of Proseware sends payment messages to a queue in an Azure Service Bus Standard namespace. Several worker instances process the messages.

    You need to recommend a configuration. The solution must meet the following requirements:

    - If the sender receives no acknowledgment and sends the same payment again, the queue keeps only one copy of the message.
    - If a worker crashes while it processes a message, the message is delivered again to a worker.

    Which two features should you include in the recommendation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le service de paiement de Proseware envoie des messages de paiement à une file d'attente d'un espace de noms Azure Service Bus Standard. Plusieurs instances de worker traitent les messages.

    Vous devez recommander une configuration. La solution doit répondre aux exigences suivantes :

    - Si l'expéditeur ne reçoit aucune confirmation et renvoie le même paiement, la file d'attente ne conserve qu'une seule copie du message.
    - Si un worker tombe en panne pendant qu'il traite un message, le message est remis à nouveau à un worker.

    Quelles sont les deux fonctionnalités à inclure dans la recommandation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Duplicate detection", fr: "La détection des doublons" } }
    - { id: b, text: { en: "The Receive and delete receive mode", fr: "Le mode de réception Receive and delete" } }
    - { id: c, text: { en: "The Peek-lock receive mode", fr: "Le mode de réception Peek-lock" } }
    - { id: d, text: { en: "Auto-forwarding", fr: "Le transfert automatique" } }
    - { id: e, text: { en: "Scheduled delivery", fr: "La remise planifiée" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      With duplicate detection, Service Bus records the message IDs received during a time window and drops a message that arrives again with the same ID, so the sender can safely resend. In the Peek-lock mode, a message is locked while a worker processes it and is removed only when the worker completes it; if the worker crashes, the lock expires and the message is delivered again.
    fr: |
      Avec la détection des doublons, Service Bus enregistre les ID des messages reçus pendant une fenêtre de temps et écarte un message qui arrive à nouveau avec le même ID ; l'expéditeur peut donc renvoyer sans risque. En mode Peek-lock, un message est verrouillé pendant qu'un worker le traite et n'est supprimé que lorsque le worker le finalise ; si le worker tombe en panne, le verrou expire et le message est remis à nouveau.
  options:
    b:
      en: In the Receive and delete mode, the message is removed as soon as it is handed to the worker; a crash during processing loses it.
      fr: En mode Receive and delete, le message est supprimé dès qu'il est remis au worker ; une panne pendant le traitement le fait perdre.
    d:
      en: Auto-forwarding chains a queue to another queue or topic; it neither removes duplicates nor redelivers messages.
      fr: Le transfert automatique chaîne une file d'attente à une autre file d'attente ou rubrique ; il ne supprime pas les doublons et ne remet pas les messages à nouveau.
    e:
      en: Scheduled delivery delays the moment when a message becomes available; it is unrelated to both requirements.
      fr: La remise planifiée retarde le moment où un message devient disponible ; elle est sans rapport avec les deux exigences.
references:
  - title: Duplicate detection in Azure Service Bus
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/duplicate-detection
  - title: Service Bus queues, topics, and subscriptions
    url: https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-queues-topics-subscriptions
