id: az305-4b-caf-phase-order
objective: "4.3.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs all its workloads in an on-premises datacenter and has no Azure environment yet. Contoso wants to adopt Azure by following the Microsoft Cloud Adoption Framework for Azure.

    Which four actions should Contoso perform first, in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso exécute toutes ses charges de travail dans un centre de données local et n'a pas encore d'environnement Azure. Contoso veut adopter Azure en suivant le Microsoft Cloud Adoption Framework pour Azure.

    Quelles sont les quatre premières actions que Contoso doit effectuer, dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: migrate, text: { en: "Migrate the first workloads to Azure.", fr: "Migrer les premières charges de travail vers Azure." } }
    - { id: decom, text: { en: "Decommission the source servers of the first workloads.", fr: "Désaffecter les serveurs sources des premières charges de travail." } }
    - { id: strategy, text: { en: "Define the motivations and the expected business outcomes of the adoption.", fr: "Définir les motivations et les résultats métier attendus de l'adoption." } }
    - { id: lz, text: { en: "Deploy an Azure landing zone.", fr: "Déployer une zone d'atterrissage Azure." } }
    - { id: rebuild, text: { en: "Rebuild every workload with cloud-native services before it is assessed.", fr: "Reconstruire chaque charge de travail avec des services natifs du cloud avant de l'évaluer." } }
    - { id: plan, text: { en: "Inventory the existing workloads and select a migration strategy for each of them.", fr: "Inventorier les charges de travail existantes et choisir une stratégie de migration pour chacune." } }
answer:
  sequence: [ strategy, plan, lz, migrate ]
explanation:
  correct:
    en: |
      The framework orders the adoption in phases: Strategy (why adopt Azure and with which outcomes), Plan (inventory of the workloads and migration strategy for each), Ready (build the Azure landing zone) and Adopt (migrate, modernize and build workloads). The landing zone must exist before the first workload moves.
    fr: |
      Le framework ordonne l'adoption en phases : Strategy (pourquoi adopter Azure et avec quels résultats), Plan (inventaire des charges de travail et stratégie de migration pour chacune), Ready (construire la zone d'atterrissage Azure) et Adopt (migrer, moderniser et créer des charges de travail). La zone d'atterrissage doit exister avant le déplacement de la première charge de travail.
  options:
    decom: { en: "Decommissioning the source is the last step of a migration, after the workload is validated in Azure.", fr: "La désaffectation de la source est la dernière étape d'une migration, après la validation de la charge de travail dans Azure." }
    rebuild: { en: "Rebuild is one strategy among others, chosen per workload during the Plan phase; it is not a general prerequisite.", fr: "Rebuild est une stratégie parmi d'autres, choisie par charge de travail pendant la phase Plan ; ce n'est pas un prérequis général." }
references:
  - title: What is the Cloud Adoption Framework?
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/overview
