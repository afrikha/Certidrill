id: az305-4a-sls-plans-container-vnet
objective: "4.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware packages a function app as a custom Linux container image.

    You need to recommend a hosting option for the function app. The solution must meet the following requirements:

    - The function app is deployed from the container image.
    - The function app is integrated with a virtual network.
    - The platform adds and removes instances according to the number of events, without autoscale rules to maintain.

    Which two hosting options meet the requirements? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware empaquette une application de fonctions sous forme d'image conteneur Linux personnalisée.

    Vous devez recommander une option d'hébergement pour l'application de fonctions. La solution doit répondre aux exigences suivantes :

    - L'application de fonctions est déployée à partir de l'image conteneur.
    - L'application de fonctions est intégrée à un réseau virtuel.
    - La plateforme ajoute et supprime des instances selon le nombre d'événements, sans règles de mise à l'échelle automatique à maintenir.

    Quelles sont les deux options d'hébergement qui répondent aux exigences ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Consumption plan", fr: "Le plan Consumption" } }
    - { id: b, text: { en: "The Flex Consumption plan", fr: "Le plan Flex Consumption" } }
    - { id: c, text: { en: "The Premium plan", fr: "Le plan Premium" } }
    - { id: d, text: { en: "The Dedicated (App Service) plan", fr: "Le plan Dedicated (App Service)" } }
    - { id: e, text: { en: "Azure Container Apps", fr: "Azure Container Apps" } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      The Premium plan accepts Linux container deployments, supports virtual networks and scales on events. Azure Container Apps hosts function apps as Linux containers in an environment that is integrated with a virtual network, with event-driven scaling based on KEDA.
    fr: |
      Le plan Premium accepte les déploiements de conteneurs Linux, prend en charge les réseaux virtuels et se met à l'échelle selon les événements. Azure Container Apps héberge des applications de fonctions sous forme de conteneurs Linux dans un environnement intégré à un réseau virtuel, avec une mise à l'échelle pilotée par les événements fondée sur KEDA.
  options:
    a:
      en: The legacy Consumption plan supports neither containers nor virtual network integration.
      fr: Le plan Consumption hérité ne prend en charge ni les conteneurs ni l'intégration au réseau virtuel.
    b:
      en: Flex Consumption has virtual network integration and event-driven scaling, but it runs Linux code only and doesn't support containers.
      fr: Flex Consumption dispose de l'intégration au réseau virtuel et de la mise à l'échelle pilotée par les événements, mais n'exécute que du code Linux et ne prend pas en charge les conteneurs.
    d:
      en: A Dedicated plan runs Linux containers in a virtual network, but its instances are scaled manually or by autoscale rules, not by the events.
      fr: Un plan Dedicated exécute des conteneurs Linux dans un réseau virtuel, mais ses instances sont mises à l'échelle manuellement ou par des règles de mise à l'échelle automatique, et non par les événements.
references:
  - title: Azure Functions hosting options
    url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
