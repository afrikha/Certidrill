id: az305-4d-perf-statements
objective: "4.4.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is designing the network of a latency-sensitive application that will run on virtual machines in the West Europe region. The virtual machines will have Standard public IP addresses and will also write data to Azure Storage accounts in other Azure regions.

    The architects consider proximity placement groups, accelerated networking and the routing preference of the public IP addresses.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys conçoit le réseau d'une application sensible à la latence qui s'exécutera sur des machines virtuelles dans la région West Europe. Les machines virtuelles auront des adresses IP publiques Standard et écriront aussi des données dans des comptes Stockage Azure d'autres régions Azure.

    Les architectes étudient les groupes de placement de proximité, la mise en réseau accélérée et la préférence de routage des adresses IP publiques.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The virtual machines of a single proximity placement group can be spread across two availability zones.
        fr: |
          Les machines virtuelles d'un même groupe de placement de proximité peuvent être réparties sur deux zones de disponibilité.
    - id: s2
      text:
        en: |
          Accelerated networking reduces jitter because the network interface hardware enforces the network policies instead of the host virtual switch.
        fr: |
          La mise en réseau accélérée réduit la gigue, car le matériel de l'interface réseau applique les stratégies réseau à la place du commutateur virtuel de l'hôte.
    - id: s3
      text:
        en: |
          If the public IP addresses use the Internet routing preference, the traffic from the virtual machines to the storage accounts in other regions travels over transit ISP networks.
        fr: |
          Si les adresses IP publiques utilisent la préférence de routage Internet, le trafic des machines virtuelles vers les comptes de stockage d'autres régions emprunte les réseaux des FAI de transit.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A proximity placement group is pinned to one datacenter and can't span availability zones; when resiliency comes first, the instances are spread across zones instead. Accelerated networking uses SR-IOV: the network interface applies the policies in hardware and forwards the traffic directly to the virtual machine, which removes the variability caused by the host and lowers jitter. The routing preference only affects traffic to and from the internet; traffic to destinations inside Azure still uses the Microsoft WAN.
    fr: |
      Un groupe de placement de proximité est épinglé à un centre de données et ne peut pas s'étendre sur plusieurs zones de disponibilité ; quand la résilience passe en premier, les instances sont plutôt réparties sur les zones. La mise en réseau accélérée utilise SR-IOV : l'interface réseau applique les stratégies dans le matériel et transmet le trafic directement à la machine virtuelle, ce qui supprime la variabilité due à l'hôte et réduit la gigue. La préférence de routage ne concerne que le trafic échangé avec Internet ; le trafic vers des destinations situées dans Azure utilise toujours le WAN Microsoft.
references:
  - title: Proximity placement groups
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/co-location
  - title: Routing preference in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/routing-preference-overview
