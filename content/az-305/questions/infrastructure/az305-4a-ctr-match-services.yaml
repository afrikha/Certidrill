id: az305-4a-ctr-match-services
objective: "4.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are designing container hosting for three teams of Tailspin Toys.

    Which service should you recommend for each requirement? To answer, drag the appropriate services to the correct requirements. Each service may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez l'hébergement de conteneurs pour trois équipes de Tailspin Toys.

    Quel service devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les services appropriés vers les exigences correspondantes. Chaque service peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: aro, text: Azure Red Hat OpenShift }
    - { id: wac, text: { en: "Azure App Service (Web App for Containers)", fr: "Azure App Service (Web App for Containers)" } }
    - { id: aci, text: Azure Container Instances }
    - { id: aks, text: Azure Kubernetes Service (AKS) }
    - { id: aca, text: Azure Container Apps }
  targets:
    - id: t1
      text:
        en: A team that has standardized on OpenShift wants a managed cluster that is operated and supported jointly by Red Hat and Microsoft.
        fr: Une équipe qui a standardisé sur OpenShift veut un cluster managé, exploité et pris en charge conjointement par Red Hat et Microsoft.
    - id: t2
      text:
        en: A single containerized website needs deployment slots and built-in authentication on a managed web hosting platform.
        fr: Un site web unique en conteneur a besoin d'emplacements de déploiement et de l'authentification intégrée sur une plateforme d'hébergement web managée.
    - id: t3
      text:
        en: A Windows container that converts files must run on demand for about ten minutes, be billed per second and then stop, without any orchestration.
        fr: Un conteneur Windows qui convertit des fichiers doit s'exécuter à la demande pendant une dizaine de minutes, être facturé à la seconde puis s'arrêter, sans aucune orchestration.
answer:
  mapping: { t1: aro, t2: wac, t3: aci }
explanation:
  correct:
    en: |
      Azure Red Hat OpenShift is the managed OpenShift service, engineered and supported by Red Hat and Microsoft, for teams already using OpenShift. Web App for Containers runs a containerized web app on App Service with its features, such as deployment slots and built-in authentication. Container Instances starts Linux or Windows containers in seconds, bills per second and needs no orchestrator for a single short task.
    fr: |
      Azure Red Hat OpenShift est le service OpenShift managé, conçu et pris en charge par Red Hat et Microsoft, pour les équipes qui utilisent déjà OpenShift. Web App for Containers exécute une application web en conteneur sur App Service avec ses fonctionnalités, comme les emplacements de déploiement et l'authentification intégrée. Container Instances démarre des conteneurs Linux ou Windows en quelques secondes, facture à la seconde et n'exige aucun orchestrateur pour une tâche courte unique.
  options:
    aks:
      en: AKS is the right choice when a workload needs the Kubernetes API; none of these requirements asks for it, and a cluster would have to be operated.
      fr: AKS est le bon choix lorsqu'une charge a besoin de l'API Kubernetes ; aucune de ces exigences ne la demande, et il faudrait exploiter un cluster.
    aca:
      en: Container Apps targets microservices and jobs in Linux containers; it has no deployment slots and doesn't run Windows containers.
      fr: Container Apps vise les microservices et les travaux en conteneurs Linux ; il n'a pas d'emplacements de déploiement et n'exécute pas de conteneurs Windows.
references:
  - title: Comparing Container Apps with other Azure container options
    url: https://learn.microsoft.com/en-us/azure/container-apps/compare-options
  - title: What is Azure Container Instances?
    url: https://learn.microsoft.com/en-us/azure/container-instances/container-instances-overview
