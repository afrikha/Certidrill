id: az305-4c-data-hybrid-transfer
objective: "4.3.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank must migrate 300 TB of SMB shares from a NAS appliance to Azure file shares. The NAS will be decommissioned, and no file server will remain on-premises. The site has a 200-Mbps connection to Azure, and the bank owns no spare disk drives.

    You need to recommend a migration solution. The solution must meet the following requirements:

    - The migration must be completed within six weeks.
    - Users keep modifying files until the cutover. The files changed during the bulk transfer must be copied before the cutover, without copying the whole data set again.
    - The permissions and the timestamps of the files must be preserved.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank doit migrer 300 To de partages SMB d'une appliance NAS vers des partages de fichiers Azure. Le NAS sera mis hors service, et aucun serveur de fichiers ne restera en local. Le site dispose d'une connexion de 200 Mbit/s vers Azure, et la banque ne possède aucun disque de rechange.

    Vous devez recommander une solution de migration. La solution doit répondre aux exigences suivantes :

    - La migration doit être terminée en six semaines.
    - Les utilisateurs continuent de modifier des fichiers jusqu'à la bascule. Les fichiers modifiés pendant le transfert en masse doivent être copiés avant la bascule, sans recopier tout le jeu de données.
    - Les autorisations et les horodatages des fichiers doivent être préservés.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Bulk transfer of the 300 TB: [[bulk]]

      Copy of the files changed since the bulk transfer: [[delta]]
    fr: |
      Transfert en masse des 300 To : [[bulk]]

      Copie des fichiers modifiés depuis le transfert en masse : [[delta]]
  slots:
    - id: bulk
      options:
        - { id: disk, text: "Azure Data Box Disk" }
        - { id: azcopy, text: "AzCopy" }
        - { id: box, text: "Azure Data Box" }
        - { id: ie, text: { en: "Azure Import/Export service", fr: "Service Azure Import/Export" } }
    - id: delta
      options:
        - { id: explorer, text: { en: "Azure Storage Explorer", fr: "Explorateur Stockage Azure" } }
        - { id: mover, text: "Azure Storage Mover" }
        - { id: disk, text: "Azure Data Box Disk" }
        - { id: adf, text: "Azure Data Factory" }
answer:
  values: { bulk: box, delta: mover }
explanation:
  correct:
    en: |
      At 200 Mbps, 300 TB would take about 140 days, so the bulk must travel offline: an Azure Data Box device of the 525-TB model carries it in one shipment. Azure Storage Mover then detects the differences between the source shares and the Azure file shares and transfers only the new and updated files, or only the metadata when just the permissions changed, which closes the gap before the cutover while keeping timestamps and ACLs.
    fr: |
      À 200 Mbit/s, 300 To prendraient environ 140 jours : l'essentiel doit donc voyager hors connexion. Un appareil Azure Data Box du modèle de 525 To le transporte en un seul envoi. Azure Storage Mover détecte ensuite les différences entre les partages sources et les partages de fichiers Azure et ne transfère que les fichiers nouveaux ou modifiés, ou seulement les métadonnées quand seules les autorisations ont changé, ce qui comble l'écart avant la bascule tout en conservant les horodatages et les listes de contrôle d'accès.
  options:
    disk:
      en: A Data Box Disk order holds about 35 TB, far less than 300 TB, and a second offline shipment wouldn't catch the last changes.
      fr: Une commande Data Box Disk contient environ 35 To, bien moins que 300 To, et un second envoi hors connexion ne capterait pas les dernières modifications.
    azcopy:
      en: A network copy of 300 TB at 200 Mbps can't finish within six weeks.
      fr: Une copie réseau de 300 To à 200 Mbit/s ne peut pas se terminer en six semaines.
    ie:
      en: The Import/Export service needs disk drives supplied by the customer, which the bank doesn't have.
      fr: Le service Import/Export exige des disques fournis par le client, dont la banque ne dispose pas.
    explorer:
      en: Azure Storage Explorer is a manual tool that may lose file permissions on Azure Files.
      fr: L'Explorateur Stockage Azure est un outil manuel qui peut perdre des autorisations de fichiers sur Azure Files.
    adf:
      en: Azure Data Factory copies data in pipelines but isn't designed to preserve the fidelity of a file share migration.
      fr: Azure Data Factory copie des données dans des pipelines, mais n'est pas conçu pour préserver la fidélité d'une migration de partages de fichiers.
references:
  - title: What is Azure Storage Mover?
    url: https://learn.microsoft.com/en-us/azure/storage-mover/service-overview
  - title: What is Azure Data Box?
    url: https://learn.microsoft.com/en-us/azure/databox/data-box-overview
