id: az305-4a-vm-reservation-hybrid-benefit
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank will run SQL Server on six Windows Server virtual machines of the same memory-optimized size in the West Europe region. The virtual machines will run continuously, and their size and region will not change for at least three years. The workload can't tolerate interruptions.

    Woodgrove Bank owns Windows Server and SQL Server licenses with active Software Assurance that are no longer used on-premises.

    You need to recommend a pricing option that minimizes cost.

    What should you recommend?
  fr: |
    Woodgrove Bank exécutera SQL Server sur six machines virtuelles Windows Server de la même taille optimisée pour la mémoire, dans la région West Europe. Les machines virtuelles s'exécuteront en continu, et leur taille et leur région ne changeront pas pendant au moins trois ans. La charge de travail ne tolère aucune interruption.

    Woodgrove Bank possède des licences Windows Server et SQL Server avec une Software Assurance active, qui ne sont plus utilisées en local.

    Vous devez recommander une option tarifaire qui réduit les coûts au minimum.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A three-year Azure savings plan for compute, with pay-as-you-go licenses", fr: "Un plan d'économies Azure pour le calcul de trois ans, avec des licences facturées à l'utilisation" } }
    - { id: b, text: { en: "Azure Spot virtual machines with a maximum price of -1, with Azure Hybrid Benefit", fr: "Des machines virtuelles Azure Spot avec un prix maximal de -1, avec Azure Hybrid Benefit" } }
    - { id: c, text: { en: "Pay-as-you-go virtual machines, with Azure Hybrid Benefit", fr: "Des machines virtuelles facturées à l'utilisation, avec Azure Hybrid Benefit" } }
    - { id: d, text: { en: "Three-year reserved virtual machine instances, with Azure Hybrid Benefit", fr: "Des instances de machines virtuelles réservées de trois ans, avec Azure Hybrid Benefit" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A reservation commits to a size family in a region and gives the greatest savings when the workload is stable and the reservation fully used, which is the case here. A reservation covers only the compute part of the price: Azure Hybrid Benefit removes the Windows Server and SQL Server license charges by reusing the licenses that Woodgrove Bank already owns.
    fr: |
      Une réservation engage sur une famille de tailles dans une région et procure les économies les plus fortes lorsque la charge est stable et la réservation pleinement utilisée, ce qui est le cas ici. Une réservation ne couvre que la part de calcul du prix : Azure Hybrid Benefit supprime les frais de licence Windows Server et SQL Server en réutilisant les licences que Woodgrove Bank possède déjà.
  options:
    a:
      en: A savings plan trades part of the discount for flexibility across families and regions that this workload doesn't need, and the licenses would be paid a second time.
      fr: Un plan d'économies échange une partie de la remise contre une flexibilité entre familles et régions dont cette charge n'a pas besoin, et les licences seraient payées une seconde fois.
    b:
      en: A maximum price of -1 only prevents evictions for price; Azure can still evict Spot virtual machines when it needs the capacity, and they have no SLA.
      fr: Un prix maximal de -1 n'empêche que les évictions liées au prix ; Azure peut toujours évincer les machines virtuelles Spot quand il a besoin de la capacité, et elles n'ont aucun SLA.
    c:
      en: Azure Hybrid Benefit removes the license charges, but the compute is still paid at the full pay-as-you-go rate for three years.
      fr: Azure Hybrid Benefit supprime les frais de licence, mais le calcul reste payé au plein tarif à l'utilisation pendant trois ans.
references:
  - title: Decide between a savings plan and a reservation
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
  - title: Save costs with Azure Reserved VM Instances
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/prepay-reserved-vm-instances
