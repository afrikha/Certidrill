id: az305-4a-batch-container-apps-jobs
objective: "4.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs its microservices in an Azure Container Apps environment. Two containerized batch workloads must be added to the same environment, without any other compute platform:

    - **Converter**: each message in an Azure Service Bus queue describes one document to convert. A conversion takes 10 to 40 minutes and must run in a new container that stops when the conversion ends.
    - **Reporter**: a report generator that must run every night at 02:00 UTC and then stop.

    You need to recommend how to deploy the workloads.

    What should you recommend? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders exécute ses microservices dans un environnement Azure Container Apps. Deux charges de traitement par lots en conteneurs doivent être ajoutées au même environnement, sans autre plateforme de calcul :

    - **Converter** : chaque message d'une file d'attente Azure Service Bus décrit un document à convertir. Une conversion dure de 10 à 40 minutes et doit s'exécuter dans un nouveau conteneur qui s'arrête à la fin de la conversion.
    - **Reporter** : un générateur de rapports qui doit s'exécuter chaque nuit à 02:00 UTC, puis s'arrêter.

    Vous devez recommander la façon de déployer les charges de travail.

    Que devez-vous recommander ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Deploy both workloads as [[res]].
      Trigger type for Converter: [[t1]]
      Trigger type for Reporter: [[t2]]
    fr: |
      Déployer les deux charges de travail sous forme de [[res]].
      Type de déclencheur pour Converter : [[t1]]
      Type de déclencheur pour Reporter : [[t2]]
  slots:
    - id: res
      options:
        - { id: apps1, text: { en: "container apps with a minimum of one replica", fr: "applications conteneur avec un minimum d'un réplica" } }
        - { id: jobs, text: { en: "Container Apps jobs", fr: "travaux Container Apps" } }
        - { id: appshttp, text: { en: "container apps with an HTTP scale rule", fr: "applications conteneur avec une règle de mise à l'échelle HTTP" } }
    - id: t1
      options:
        - { id: manual, text: Manual }
        - { id: schedule, text: Schedule }
        - { id: event, text: Event }
    - id: t2
      options:
        - { id: manual, text: Manual }
        - { id: schedule, text: Schedule }
        - { id: event, text: Event }
answer:
  values: { res: jobs, t1: event, t2: schedule }
explanation:
  correct:
    en: |
      Container apps run continuously, whereas Container Apps jobs start, run for a finite duration and stop, in the same environment. An event-driven job uses a KEDA scaler, here on the Service Bus queue, and starts one execution per event, each in a fresh container. A scheduled job runs on a cron expression that is evaluated in UTC.
    fr: |
      Les applications conteneur s'exécutent en continu, alors que les travaux Container Apps démarrent, s'exécutent pendant une durée finie et s'arrêtent, dans le même environnement. Un travail piloté par les événements utilise un scaler KEDA, ici sur la file d'attente Service Bus, et lance une exécution par événement, chacune dans un nouveau conteneur. Un travail planifié s'exécute selon une expression cron évaluée en UTC.
  options:
    apps1:
      en: An app with a minimum of one replica runs and is billed all the time, and its replicas process messages continuously instead of one document per container.
      fr: Une application avec un minimum d'un réplica s'exécute et est facturée en permanence, et ses réplicas traitent les messages en continu au lieu d'un document par conteneur.
    appshttp:
      en: An HTTP scale rule follows HTTP requests; neither workload receives any.
      fr: Une règle de mise à l'échelle HTTP suit les requêtes HTTP ; aucune des deux charges n'en reçoit.
    manual:
      en: A manual job starts only when someone or something calls the start operation.
      fr: Un travail manuel ne démarre que lorsqu'une personne ou un outil appelle l'opération de démarrage.
references:
  - title: Jobs in Azure Container Apps
    url: https://learn.microsoft.com/en-us/azure/container-apps/jobs
