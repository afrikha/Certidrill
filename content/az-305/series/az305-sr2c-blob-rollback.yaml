id: az305-sr2c-blob-rollback
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso, Ltd. has a storage account named **stcontoso1**. The account is a standard general-purpose v2 account that uses locally redundant storage (LRS), and its hierarchical namespace is disabled. An application named **App1** stores block blobs in the hot tier in five containers of stcontoso1.

    A faulty release of App1 recently overwrote and deleted thousands of blobs before the problem was detected.

    You need to recommend a solution for the next incident of this kind. The solution must meet the following requirements:

    - Administrators must be able to return the block blobs of the affected containers to their state at any point in time of the previous 14 days, for example ten minutes before a faulty release.
    - The restore must be a single operation, not a blob-by-blob recovery.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso, Ltd. dispose d'un compte de stockage nommé **stcontoso1**. Il s'agit d'un compte standard usage général v2 qui utilise le stockage localement redondant (LRS) et dont l'espace de noms hiérarchique est désactivé. Une application nommée **App1** stocke des objets blob de blocs au niveau chaud (Hot) dans cinq conteneurs de stcontoso1.

    Une version défectueuse d'App1 a récemment écrasé et supprimé des milliers d'objets blob avant que le problème ne soit détecté.

    Vous devez recommander une solution pour le prochain incident de ce type. La solution doit répondre aux exigences suivantes :

    - Les administrateurs doivent pouvoir ramener les objets blob de blocs des conteneurs touchés à leur état à n'importe quel instant des 14 derniers jours, par exemple dix minutes avant une version défectueuse.
    - La restauration doit être une opération unique, et non une récupération objet blob par objet blob.
