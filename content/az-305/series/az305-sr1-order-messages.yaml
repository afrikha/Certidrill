id: az305-sr1-order-messages
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys is designing an order processing solution in Azure. A web front end publishes one message of about 20 KB for each order. Two back-end services named **Billing** and **Shipping** process the orders.

    You need to recommend a messaging solution that meets the following requirements:

    - Billing and Shipping must each receive their own copy of every order message and process it at their own pace.
    - For a given customer, each service must process the messages in the order in which they were sent.
    - When the front end retries and sends the same order a second time within 10 minutes, the messaging service must discard the duplicate. The back-end services must not contain any code to detect duplicates.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys conçoit une solution de traitement des commandes dans Azure. Un front-end web publie un message d'environ 20 Ko pour chaque commande. Deux services principaux nommés **Billing** et **Shipping** traitent les commandes.

    Vous devez recommander une solution de messagerie qui répond aux exigences suivantes :

    - Billing et Shipping doivent chacun recevoir leur propre copie de chaque message de commande et la traiter à leur propre rythme.
    - Pour un client donné, chaque service doit traiter les messages dans l'ordre dans lequel ils ont été envoyés.
    - Lorsque le front-end fait une nouvelle tentative et envoie la même commande une seconde fois en moins de 10 minutes, le service de messagerie doit écarter le doublon. Les services principaux ne doivent contenir aucun code de détection des doublons.
