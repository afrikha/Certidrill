id: az305-sr1-vm-region-dr
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam, Inc. runs a line-of-business application on eight Azure virtual machines in the West Europe region. The virtual machines are distributed across the three availability zones of the region.

    You need to recommend a disaster recovery solution for a failure of the entire West Europe region. The solution must meet the following requirements:

    - The application must run in the North Europe region within four hours of the failure (recovery time objective).
    - No more than 15 minutes of data may be lost (recovery point objective).
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam, Inc. exécute une application métier sur huit machines virtuelles Azure dans la région West Europe. Les machines virtuelles sont réparties entre les trois zones de disponibilité de la région.

    Vous devez recommander une solution de reprise d'activité pour une défaillance de toute la région West Europe. La solution doit répondre aux exigences suivantes :

    - L'application doit s'exécuter dans la région North Europe dans les quatre heures qui suivent la défaillance (objectif de délai de récupération).
    - La perte de données ne doit pas dépasser 15 minutes (objectif de point de récupération).
