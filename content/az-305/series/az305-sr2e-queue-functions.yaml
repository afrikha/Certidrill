id: az305-sr2e-queue-functions
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys plans to deploy a function app named **Func1** that is written in C#. Func1 is triggered by the messages of an Azure Service Bus queue. The messages arrive in bursts a few times per day; between two bursts, the queue stays empty for hours.

    Func1 writes its results to an Azure SQL database that accepts connections only through a private endpoint in a virtual network named **VNet1**.

    You need to recommend a hosting plan for Func1. The solution must meet the following requirements:

    - Func1 must be able to connect to the database through the private endpoint.
    - A single execution of a function must be able to run for 20 minutes.
    - No compute charges can be incurred while the queue is empty.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys prévoit de déployer une application de fonctions nommée **Func1**, écrite en C#. Func1 est déclenchée par les messages d'une file d'attente Azure Service Bus. Les messages arrivent par rafales quelques fois par jour ; entre deux rafales, la file d'attente reste vide pendant des heures.

    Func1 écrit ses résultats dans une base de données Azure SQL qui n'accepte les connexions que par un point de terminaison privé situé dans un réseau virtuel nommé **VNet1**.

    Vous devez recommander un plan d'hébergement pour Func1. La solution doit répondre aux exigences suivantes :

    - Func1 doit pouvoir se connecter à la base de données par le point de terminaison privé.
    - Une exécution de fonction doit pouvoir durer 20 minutes.
    - Aucuns frais de calcul ne peuvent être facturés tant que la file d'attente est vide.
