id: az305-sr1-keyvault-logs
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware, Inc. has a management group named **MG-Prod** that contains 15 Azure subscriptions. New subscriptions are added to MG-Prod every quarter. Project teams have created 60 key vaults in these subscriptions and continue to create new ones. Most of the existing key vaults have no diagnostic setting.

    A central Log Analytics workspace named **LAW1** is used by the security team.

    You need to recommend a compliance solution that meets the following requirements:

    - The audit logs of every key vault in MG-Prod must be sent to LAW1. This applies to the existing key vaults, to new key vaults and to key vaults in subscriptions added later.
    - The diagnostic settings must be created without any action from the project teams.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware, Inc. dispose d'un groupe d'administration nommé **MG-Prod** qui contient 15 abonnements Azure. De nouveaux abonnements sont ajoutés à MG-Prod chaque trimestre. Les équipes projet ont créé 60 coffres de clés dans ces abonnements et continuent d'en créer. La plupart des coffres de clés existants n'ont aucun paramètre de diagnostic.

    Un espace de travail Log Analytics central nommé **LAW1** est utilisé par l'équipe de sécurité.

    Vous devez recommander une solution de conformité qui répond aux exigences suivantes :

    - Les journaux d'audit de chaque coffre de clés de MG-Prod doivent être envoyés à LAW1. Cela concerne les coffres de clés existants, les nouveaux coffres de clés et les coffres de clés des abonnements ajoutés plus tard.
    - Les paramètres de diagnostic doivent être créés sans aucune action des équipes projet.
