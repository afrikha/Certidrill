id: az305-sr2d-datacenter-link
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has an on-premises datacenter and an Azure subscription that contains a hub virtual network named **VNet1**. The datacenter has contracts with two connectivity providers and has a separate internet connection.

    You need to recommend a connectivity solution between the datacenter and VNet1. The solution must meet the following requirements:

    - In normal operation, the traffic must use a private connection that doesn't traverse the public internet.
    - If the peering location used by that connection fails entirely, connectivity must be restored automatically, without any action from an administrator.
    - During such a failure, the traffic can traverse the public internet only if it is encrypted. Reduced bandwidth and higher latency are acceptable during the failure.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'un centre de données local et d'un abonnement Azure qui contient un réseau virtuel hub nommé **VNet1**. Le centre de données a des contrats avec deux fournisseurs de connectivité et dispose d'une connexion Internet distincte.

    Vous devez recommander une solution de connectivité entre le centre de données et VNet1. La solution doit répondre aux exigences suivantes :

    - En fonctionnement normal, le trafic doit utiliser une connexion privée qui ne transite pas par l'Internet public.
    - Si l'emplacement de peering utilisé par cette connexion tombe entièrement en panne, la connectivité doit être rétablie automatiquement, sans aucune intervention d'un administrateur.
    - Pendant une telle panne, le trafic ne peut transiter par l'Internet public que s'il est chiffré. Une bande passante réduite et une latence plus élevée sont acceptables pendant la panne.
