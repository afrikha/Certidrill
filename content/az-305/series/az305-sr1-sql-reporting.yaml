id: az305-sr1-sql-reporting
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso, Ltd. plans to deploy a new Azure SQL database named **DB1** for an order management application. DB1 will be created in an Azure region that has availability zones, by using the vCore purchasing model. DB1 is expected to grow to 2 TB.

    You need to recommend a service tier and a configuration for DB1. The solution must meet the following requirements:

    - A reporting application runs long read-only queries. These queries must run on a read-only replica of DB1 so that they do not consume the resources of the primary replica. No additional database must be created for reporting.
    - DB1 must remain available if one availability zone fails.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso, Ltd. prévoit de déployer une nouvelle base de données Azure SQL nommée **DB1** pour une application de gestion des commandes. DB1 sera créée dans une région Azure dotée de zones de disponibilité, avec le modèle d'achat vCore. DB1 devrait atteindre 2 To.

    Vous devez recommander un niveau de service et une configuration pour DB1. La solution doit répondre aux exigences suivantes :

    - Une application de création de rapports exécute de longues requêtes en lecture seule. Ces requêtes doivent s'exécuter sur un réplica en lecture seule de DB1 afin de ne pas consommer les ressources du réplica principal. Aucune base de données supplémentaire ne doit être créée pour les rapports.
    - DB1 doit rester disponible en cas de défaillance d'une zone de disponibilité.
