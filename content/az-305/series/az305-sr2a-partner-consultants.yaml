id: az305-sr2a-partner-consultants
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Proseware, Inc. has a Microsoft Entra tenant with Microsoft Entra ID Governance licenses. A project named **Project1** uses a Microsoft 365 group named **Group1**, a SharePoint site named **Site1** and an enterprise application named **App1**.

    Consultants of a partner company named Adatum Corporation work on Project1 for limited periods. Adatum has its own Microsoft Entra tenant. Most of the consultants have no account in the Proseware tenant.

    You need to recommend an identity governance solution that meets the following requirements:

    - A consultant must be able to request access to Group1, Site1 and App1 in a single request, even without an existing guest account in the Proseware tenant.
    - Each request must be approved by the manager of Project1 before any access is granted.
    - The access must end automatically after 90 days, and the guest account of a consultant who has no remaining access must be removed automatically.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Proseware, Inc. dispose d'un locataire Microsoft Entra avec des licences Microsoft Entra ID Governance. Un projet nommé **Project1** utilise un groupe Microsoft 365 nommé **Group1**, un site SharePoint nommé **Site1** et une application d'entreprise nommée **App1**.

    Des consultants d'une société partenaire nommée Adatum Corporation travaillent sur Project1 pendant des périodes limitées. Adatum possède son propre locataire Microsoft Entra. La plupart des consultants n'ont aucun compte dans le locataire de Proseware.

    Vous devez recommander une solution de gouvernance des identités qui répond aux exigences suivantes :

    - Un consultant doit pouvoir demander l'accès à Group1, Site1 et App1 en une seule demande, même sans compte invité existant dans le locataire de Proseware.
    - Chaque demande doit être approuvée par le responsable de Project1 avant qu'un accès ne soit accordé.
    - L'accès doit prendre fin automatiquement après 90 jours, et le compte invité d'un consultant qui n'a plus aucun accès doit être supprimé automatiquement.
