id: az305-sr1-global-web-entry
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank is deploying a public web application named **App1** to Azure. A full copy of App1 runs on a virtual machine scale set in the West Europe region and on another virtual machine scale set in the East US region. Users connect over HTTPS from Europe and North America.

    You need to recommend how to expose App1 to the internet. The solution must meet the following requirements:

    - Each user must be directed to the region that offers the lowest latency.
    - If App1 becomes unavailable in one region, users must automatically be directed to the other region.
    - Every HTTP request must be inspected by a web application firewall (WAF) that applies a managed rule set before the request reaches a virtual machine scale set.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank déploie dans Azure une application web publique nommée **App1**. Une copie complète d'App1 s'exécute sur un groupe de machines virtuelles identiques dans la région West Europe et sur un autre groupe de machines virtuelles identiques dans la région East US. Les utilisateurs se connectent en HTTPS depuis l'Europe et l'Amérique du Nord.

    Vous devez recommander la façon d'exposer App1 sur Internet. La solution doit répondre aux exigences suivantes :

    - Chaque utilisateur doit être dirigé vers la région qui offre la latence la plus faible.
    - Si App1 devient indisponible dans une région, les utilisateurs doivent être dirigés automatiquement vers l'autre région.
    - Chaque requête HTTP doit être inspectée par un pare-feu d'applications web (WAF) qui applique un ensemble de règles managé avant que la requête n'atteigne un groupe de machines virtuelles identiques.
