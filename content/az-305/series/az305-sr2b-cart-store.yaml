id: az305-sr2b-cart-store
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum Corporation is designing an Azure Cosmos DB for NoSQL account that will store the shopping carts of an online store as JSON documents. The store application is deployed in the **West Europe**, **East US** and **Southeast Asia** regions, and each user connects to the nearest deployment.

    You need to recommend a configuration for the account. The solution must meet the following requirements:

    - The write operations of each deployment must be accepted by the Azure Cosmos DB region in which the deployment runs.
    - If one of the three regions fails, the deployments in the other regions must continue to read and write without waiting for a failover.
    - Within a session, a user must always read the latest cart that the same user wrote.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum Corporation conçoit un compte Azure Cosmos DB for NoSQL qui stockera les paniers d'une boutique en ligne sous forme de documents JSON. L'application de la boutique est déployée dans les régions **West Europe**, **East US** et **Southeast Asia**, et chaque utilisateur se connecte au déploiement le plus proche.

    Vous devez recommander une configuration pour le compte. La solution doit répondre aux exigences suivantes :

    - Les opérations d'écriture de chaque déploiement doivent être acceptées par la région Azure Cosmos DB dans laquelle le déploiement s'exécute.
    - Si l'une des trois régions tombe en panne, les déploiements des autres régions doivent continuer à lire et à écrire sans attendre un basculement.
    - Dans une session, un utilisateur doit toujours lire le dernier panier qu'il a lui-même écrit.
