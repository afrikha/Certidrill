id: az305-sr1-intranet-remote
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Your company has an on-premises datacenter that hosts an intranet web application named **App1**. App1 runs on IIS and uses Integrated Windows Authentication. The on-premises Active Directory Domain Services (AD DS) forest syncs to a Microsoft Entra tenant. All users have a Microsoft Entra ID P1 license.

    You need to recommend a solution that gives remote employees access to App1 from the internet. The solution must meet the following requirements:

    - Users must sign in with their Microsoft Entra account, and a Conditional Access policy that requires multifactor authentication (MFA) must be evaluated before any request reaches the on-premises network.
    - No inbound ports can be opened on the perimeter firewall of the datacenter.
    - Users must not have to install a VPN client on their devices.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Votre entreprise dispose d'un centre de données local qui héberge une application web intranet nommée **App1**. App1 s'exécute sur IIS et utilise l'authentification Windows intégrée. La forêt Active Directory Domain Services (AD DS) locale est synchronisée avec un locataire Microsoft Entra. Tous les utilisateurs disposent d'une licence Microsoft Entra ID P1.

    Vous devez recommander une solution qui donne aux employés distants l'accès à App1 depuis Internet. La solution doit répondre aux exigences suivantes :

    - Les utilisateurs doivent se connecter avec leur compte Microsoft Entra, et une stratégie d'accès conditionnel qui exige l'authentification multifacteur (MFA) doit être évaluée avant qu'une requête n'atteigne le réseau local.
    - Aucun port entrant ne doit être ouvert sur le pare-feu de périmètre du centre de données.
    - Les utilisateurs ne doivent pas avoir à installer de client VPN sur leurs appareils.
