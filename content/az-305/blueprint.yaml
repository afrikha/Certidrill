# AZ-305 — Designing Microsoft Azure Infrastructure Solutions (Microsoft Certified: Azure Solutions Architect Expert)
# Source: official study guide, "Skills measured as of April 17, 2026" (en-us and fr-fr pages, checked on 2026-11-16):
# https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/az-305
# Real exam: passing score 700/1000, case studies and "does the solution meet the goal" series, no lab.
# Exam time: 100 minutes. The AZ-305 exam page does not state the time; 100 minutes is the Microsoft Learn
# figure for "associate and expert role-based exams without labs" (Exam duration and exam experience page,
# checked on 2026-11-16). Microsoft does not publish the number of questions (about 40 to 60).
# Type mix: a design exam, so more answer-area drop-downs and almost no sequence (ordering) question.
# Readiness and progression rules are those of AZ-104.
# active: false until the bank and the course are reviewed and published.
