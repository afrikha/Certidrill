id: az305-cs1c-humongous-insurance
status: draft
title:
  en: Humongous Insurance
  fr: Humongous Insurance
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Humongous Insurance is a property and casualty insurer based in London. It has 4,200 employees and sells its policies through 1,500 independent brokers who work for about 200 brokerage firms.

        Humongous Insurance has a datacenter in London. The lease of the datacenter ends in 12 months, and the company has decided to move all its servers to Azure. The regulator requires that customer data stay in the United Kingdom.
      fr: |
        Humongous Insurance est un assureur dommages basé à Londres. Il compte 4 200 employés et vend ses contrats par l'intermédiaire de 1 500 courtiers indépendants, qui travaillent pour environ 200 cabinets de courtage.

        Humongous Insurance possède un centre de données à Londres. Le bail du centre de données se termine dans 12 mois, et la société a décidé de déplacer tous ses serveurs vers Azure. Le régulateur exige que les données des clients restent au Royaume-Uni.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **London datacenter**

        The datacenter hosts 320 virtual machines that run Windows Server or Red Hat Enterprise Linux on VMware vSphere 7.0, managed by one vCenter Server. Nobody knows precisely which servers depend on each other, and many virtual machines are larger than their workload requires.

        The main application, **ClaimsHub**, manages the insurance claims. It runs on four web servers, four application servers and two SQL Server 2019 servers.

        **Identity**

        The Active Directory Domain Services (AD DS) forest named humongousinsurance.com is synchronized with a Microsoft Entra tenant. All employees have a Microsoft Entra ID P2 license. The brokers have no account in the tenant.

        **Azure**

        | Management group | Parent | Subscriptions |
        | --- | --- | --- |
        | MG-Humongous | Tenant root group | None |
        | MG-Platform | MG-Humongous | Sub-Connectivity |
        | MG-Prod | MG-Humongous | Sub-Claims-Prod |
        | MG-NonProd | MG-Humongous | Sub-Claims-Dev |

        New subscriptions will be created under MG-Prod and MG-NonProd during the migration. Sub-Connectivity contains a resource group named **RG-Hub**, which contains a hub virtual network in the UK South region. Each resource group has a tag named **CostCenter**; most existing resources don't have this tag.

        **Security operations**

        A security team analyzes the logs of the on-premises systems in a non-Microsoft security information and event management (SIEM) solution hosted by an external provider.
      fr: |
        **Centre de données de Londres**

        Le centre de données héberge 320 machines virtuelles qui exécutent Windows Server ou Red Hat Enterprise Linux sur VMware vSphere 7.0, gérées par un seul serveur vCenter. Personne ne sait précisément quels serveurs dépendent les uns des autres, et de nombreuses machines virtuelles sont plus grandes que ne l'exige leur charge de travail.

        L'application principale, **ClaimsHub**, gère les sinistres. Elle s'exécute sur quatre serveurs web, quatre serveurs d'applications et deux serveurs SQL Server 2019.

        **Identité**

        La forêt Active Directory Domain Services (AD DS) nommée humongousinsurance.com est synchronisée avec un locataire Microsoft Entra. Tous les employés disposent d'une licence Microsoft Entra ID P2. Les courtiers n'ont aucun compte dans le locataire.

        **Azure**

        | Groupe d'administration | Parent | Abonnements |
        | --- | --- | --- |
        | MG-Humongous | Groupe racine du locataire | Aucun |
        | MG-Platform | MG-Humongous | Sub-Connectivity |
        | MG-Prod | MG-Humongous | Sub-Claims-Prod |
        | MG-NonProd | MG-Humongous | Sub-Claims-Dev |

        De nouveaux abonnements seront créés sous MG-Prod et MG-NonProd pendant la migration. Sub-Connectivity contient un groupe de ressources nommé **RG-Hub**, qui contient un réseau virtuel hub dans la région UK South. Chaque groupe de ressources porte une étiquette nommée **CostCenter** ; la plupart des ressources existantes ne portent pas cette étiquette.

        **Opérations de sécurité**

        Une équipe de sécurité analyse les journaux des systèmes locaux dans une solution de gestion des informations et des événements de sécurité (SIEM) non-Microsoft, hébergée par un prestataire externe.
  - key: planned
    title: { en: "Planned changes", fr: "Changements prévus" }
    body:
      en: |
        Humongous Insurance plans to implement the following changes:

        - Assess the 320 virtual machines, then migrate them to Azure virtual machines in UK South in several waves.
        - Connect the London datacenter to the hub virtual network for the duration of the migration, and afterward the London head office, which is in another building.
        - Deploy a new web application named **BrokerPortal** in Azure App Service. BrokerPortal uses Microsoft Entra ID to sign users in. A Microsoft Entra security group named **Brokers** gives access to BrokerPortal and to a SharePoint Online site that contains the sales documentation.
        - Back up the migrated ClaimsHub virtual machines with Azure Backup.
      fr: |
        Humongous Insurance prévoit de mettre en œuvre les changements suivants :

        - Évaluer les 320 machines virtuelles, puis les migrer vers des machines virtuelles Azure dans UK South en plusieurs vagues.
        - Connecter le centre de données de Londres au réseau virtuel hub pendant la durée de la migration, puis le siège de Londres, qui se trouve dans un autre bâtiment.
        - Déployer une nouvelle application web nommée **BrokerPortal** dans Azure App Service. BrokerPortal utilise Microsoft Entra ID pour connecter les utilisateurs. Un groupe de sécurité Microsoft Entra nommé **Brokers** donne accès à BrokerPortal et à un site SharePoint Online qui contient la documentation commerciale.
        - Sauvegarder les machines virtuelles ClaimsHub migrées avec Sauvegarde Azure.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Migration requirements**

        - The assessment must state whether each virtual machine can run in Azure and recommend a virtual machine size based on the measured use of CPU, memory and disks.
        - The assessment must identify the servers that communicate with each other, so that they are migrated in the same wave.
        - No software must be installed on the virtual machines for the assessment.

        **Connectivity requirements**

        - The traffic between the London sites and Azure must never cross the public internet, including when a component of the connectivity solution fails.
        - The connectivity must remain available if a facility in which a connectivity provider connects to the Microsoft network becomes completely unavailable.

        **Broker access requirements**

        - A broker must request access to BrokerPortal and to the SharePoint Online site in a single request. The Humongous Insurance account manager of the brokerage firm must approve the request.
        - The access of a broker must end after 12 months unless the broker asks for an extension.
        - The account of a broker who no longer has any access must be removed from the tenant automatically.

        **Backup requirements**

        - The ClaimsHub virtual machines must be backed up every day. Daily backups are kept for 30 days and monthly backups for seven years.
        - If UK South is unavailable, it must be possible to restore the virtual machines in UK West.
        - Nobody, including the users who have the Owner or Backup Contributor role, must be able to delete a recovery point before it expires or to reduce the retention. It must be impossible to remove this protection later.

        **Logging requirements**

        - The Microsoft Entra sign-in logs and the Azure activity logs must be sent to the SIEM solution in near real time.
        - The same logs must be kept for seven years at the lowest possible cost. They will be read only for an audit.
        - The security team must run interactive queries on the logs of the last 90 days and create alert rules on them.

        **Governance requirements**

        - Resources must be created only in UK South and UK West, in every current and future subscription under MG-Humongous.
        - Every resource, including the existing ones, must have the CostCenter tag of its resource group.
        - The hub virtual network must be protected against accidental deletion, including by users who have the Owner role.
        - Administrative effort must be minimized.
      fr: |
        **Exigences de migration**

        - L'évaluation doit indiquer si chaque machine virtuelle peut s'exécuter dans Azure et recommander une taille de machine virtuelle d'après l'utilisation mesurée du processeur, de la mémoire et des disques.
        - L'évaluation doit identifier les serveurs qui communiquent entre eux, afin de les migrer dans la même vague.
        - Aucun logiciel ne doit être installé sur les machines virtuelles pour l'évaluation.

        **Exigences de connectivité**

        - Le trafic entre les sites de Londres et Azure ne doit jamais traverser l'Internet public, y compris quand un composant de la solution de connectivité tombe en panne.
        - La connectivité doit rester disponible si un site dans lequel un fournisseur de connectivité se raccorde au réseau Microsoft devient totalement indisponible.

        **Exigences d'accès des courtiers**

        - Un courtier doit demander l'accès à BrokerPortal et au site SharePoint Online en une seule demande. Le responsable de compte de Humongous Insurance chargé du cabinet de courtage doit approuver la demande.
        - L'accès d'un courtier doit prendre fin au bout de 12 mois, sauf si le courtier demande une prolongation.
        - Le compte d'un courtier qui n'a plus aucun accès doit être supprimé du locataire automatiquement.

        **Exigences de sauvegarde**

        - Les machines virtuelles ClaimsHub doivent être sauvegardées chaque jour. Les sauvegardes quotidiennes sont conservées 30 jours et les sauvegardes mensuelles sept ans.
        - Si UK South est indisponible, il doit être possible de restaurer les machines virtuelles dans UK West.
        - Personne, y compris les utilisateurs qui ont le rôle Owner ou Backup Contributor, ne doit pouvoir supprimer un point de récupération avant son expiration ni réduire la rétention. Il doit être impossible de retirer cette protection par la suite.

        **Exigences de journalisation**

        - Les journaux de connexion Microsoft Entra et les journaux d'activité Azure doivent être envoyés à la solution SIEM en quasi-temps réel.
        - Les mêmes journaux doivent être conservés sept ans au coût le plus bas possible. Ils ne seront lus que pour un audit.
        - L'équipe de sécurité doit exécuter des requêtes interactives sur les journaux des 90 derniers jours et créer des règles d'alerte sur ces journaux.

        **Exigences de gouvernance**

        - Les ressources ne doivent être créées que dans UK South et UK West, dans tous les abonnements actuels et futurs situés sous MG-Humongous.
        - Chaque ressource, y compris les ressources existantes, doit porter l'étiquette CostCenter de son groupe de ressources.
        - Le réseau virtuel hub doit être protégé contre une suppression accidentelle, y compris par les utilisateurs qui ont le rôle Owner.
        - L'effort d'administration doit être réduit au minimum.
