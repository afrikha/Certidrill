id: az305-cs4a-relecloud
status: draft
title:
  en: Relecloud
  fr: Relecloud
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Relecloud is a software company that sells a payroll application named **PayCloud** as software as a service (SaaS) to 300 companies. Relecloud has 420 employees and its head office is in Vienna.

        PayCloud runs in the datacenter of a hosting provider in Frankfurt. The hosting contract ends in nine months. Relecloud plans to move PayCloud to the West Europe Azure region, which has availability zones.
      fr: |
        Relecloud est un éditeur de logiciels qui vend une application de paie nommée **PayCloud** sous forme de logiciel en tant que service (SaaS) à 300 entreprises. Relecloud compte 420 employés et son siège est à Vienne.

        PayCloud s'exécute dans le centre de données d'un hébergeur à Francfort. Le contrat d'hébergement se termine dans neuf mois. Relecloud prévoit de déplacer PayCloud vers la région Azure West Europe, qui dispose de zones de disponibilité.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Azure**

        Relecloud has a Microsoft Entra tenant and four Azure subscriptions named **Sub-Prod-App**, **Sub-Prod-Data**, **Sub-Dev** and **Sub-Test**. The subscriptions are directly under the tenant root group. Relecloud expects to create more production subscriptions.

        Sub-Prod-App contains a virtual network named **VNet-Pay** in West Europe. A site-to-site VPN connects VNet-Pay to the Frankfurt datacenter and to the head office.

        **PayCloud at the hosting provider**

        | Component | Description |
        | --- | --- |
        | Web portal | Eight Windows Server virtual machines that run IIS. Customers and Relecloud employees use the portal over HTTPS. The servers are identical and keep no state. |
        | Calculation engine | Six virtual machines that listen on TCP port 9000 with a proprietary protocol. Only the web portal servers call them. |
        | SQL-PAY | A SQL Server 2019 Enterprise instance that hosts one database per customer (300 databases) and five shared reference databases, 20 TB in total. The customer databases read the reference databases with cross-database queries. SQL Server Agent jobs run the payroll closing. |
        | Report server | A server that runs a commercial reporting product. Relecloud uses it to produce statistics about payslips. |
      fr: |
        **Azure**

        Relecloud dispose d'un locataire Microsoft Entra et de quatre abonnements Azure nommés **Sub-Prod-App**, **Sub-Prod-Data**, **Sub-Dev** et **Sub-Test**. Les abonnements sont placés directement sous le groupe racine du locataire. Relecloud prévoit de créer d'autres abonnements de production.

        Sub-Prod-App contient un réseau virtuel nommé **VNet-Pay** dans West Europe. Un VPN de site à site relie VNet-Pay au centre de données de Francfort et au siège.

        **PayCloud chez l'hébergeur**

        | Composant | Description |
        | --- | --- |
        | Portail web | Huit machines virtuelles Windows Server qui exécutent IIS. Les clients et les employés de Relecloud utilisent le portail en HTTPS. Les serveurs sont identiques et ne conservent aucun état. |
        | Moteur de calcul | Six machines virtuelles qui écoutent sur le port TCP 9000 avec un protocole propriétaire. Seuls les serveurs du portail web les appellent. |
        | SQL-PAY | Une instance SQL Server 2019 Enterprise qui héberge une base de données par client (300 bases de données) et cinq bases de données de référence partagées, 20 To au total. Les bases de données des clients lisent les bases de référence par des requêtes entre bases de données. Des travaux SQL Server Agent exécutent la clôture de paie. |
        | Serveur de rapports | Un serveur qui exécute un progiciel de reporting. Relecloud l'utilise pour produire des statistiques sur les bulletins de paie. |
  - key: planned
    title: { en: "Planned changes", fr: "Changements prévus" }
    body:
      en: |
        - The servers of the web portal and of the calculation engine will be moved as they are to Azure virtual machines in VNet-Pay.
        - The databases of SQL-PAY will be moved to Azure SQL Managed Instance, with as few changes as possible to the code of PayCloud.
        - The report server will not be moved. Relecloud will subscribe to a reporting product sold as software as a service (SaaS) by another vendor.
        - Within three years, Relecloud expects 420 customer databases and 28 TB of data.
      fr: |
        - Les serveurs du portail web et du moteur de calcul seront déplacés tels quels vers des machines virtuelles Azure dans VNet-Pay.
        - Les bases de données de SQL-PAY seront déplacées vers Azure SQL Managed Instance, avec le moins de modifications possible du code de PayCloud.
        - Le serveur de rapports ne sera pas déplacé. Relecloud s'abonnera à un produit de reporting vendu sous forme de logiciel en tant que service (SaaS) par un autre éditeur.
        - D'ici trois ans, Relecloud prévoit 420 bases de données de clients et 28 To de données.
  - key: data-requirements
    title: { en: "Database requirements", fr: "Exigences relatives aux bases de données" }
    body:
      en: |
        **Managed instance**

        - All the databases must stay in a single instance, because each reference database must exist in one copy only.
        - The instance must accept the number of databases and the volume of data expected within three years.
        - The reporting queries run at night. A readable replica is not required.

        **Migration**

        - During the migration, the databases in Azure must be synchronized continuously with SQL-PAY.
        - Before the cutover, the quality assurance team must run read-only test queries on the databases in Azure.
        - Downtime at cutover must not exceed 15 minutes.

        **Backup**

        - Any database must be restorable to any point in time of the last 30 days.
        - A backup taken once a year must be kept for 10 years.
        - Relecloud must not operate backup servers or maintain backup scripts.
      fr: |
        **Instance managée**

        - Toutes les bases de données doivent rester dans une seule instance, car chaque base de données de référence ne doit exister qu'en un seul exemplaire.
        - L'instance doit accepter le nombre de bases de données et le volume de données prévus d'ici trois ans.
        - Les requêtes de reporting s'exécutent la nuit. Un réplica lisible n'est pas nécessaire.

        **Migration**

        - Pendant la migration, les bases de données dans Azure doivent être synchronisées en continu avec SQL-PAY.
        - Avant la bascule, l'équipe d'assurance qualité doit exécuter des requêtes de test en lecture seule sur les bases de données dans Azure.
        - L'interruption de service lors de la bascule ne doit pas dépasser 15 minutes.

        **Sauvegarde**

        - Toute base de données doit pouvoir être restaurée à n'importe quel instant des 30 derniers jours.
        - Une sauvegarde effectuée une fois par an doit être conservée pendant 10 ans.
        - Relecloud ne doit ni exploiter de serveurs de sauvegarde ni maintenir de scripts de sauvegarde.
  - key: platform-requirements
    title: { en: "Platform requirements", fr: "Exigences relatives à la plateforme" }
    body:
      en: |
        **Network requirements**

        - Web portal: the load balancer must terminate HTTPS, send the requests whose path starts with /api to a separate pool of servers and protect the portal with a web application firewall (WAF). It must have a public frontend IP address for the customers and a private frontend IP address in VNet-Pay for the employees who arrive through the VPN.
        - Calculation engine: the calls of the web portal must be distributed between the calculation engine servers without leaving VNet-Pay. A server that no longer answers on port 9000 must stop receiving calls. The calculation engine must see the IP address of the web portal server that calls it.

        **Governance requirements**

        - The policy assignments and the role assignments that concern production must be made once and apply to the existing production subscriptions and to those created later.
        - Finance must report the costs of each PayCloud component (portal, engine, database), even when the resources of a component are spread over several resource groups and subscriptions.
        - Every resource must receive the Environment tag of its subscription automatically, without any action from the people who deploy it.
        - Resources that are deployed, updated and deleted together must be managed as one unit.

        **General requirements**

        - Costs must be minimized.
        - Administrative effort must be minimized.
      fr: |
        **Exigences réseau**

        - Portail web : l'équilibreur de charge doit terminer HTTPS, envoyer les requêtes dont le chemin commence par /api vers un pool de serveurs distinct et protéger le portail par un pare-feu d'applications web (WAF). Il doit disposer d'une adresse IP frontale publique pour les clients et d'une adresse IP frontale privée dans VNet-Pay pour les employés qui arrivent par le VPN.
        - Moteur de calcul : les appels du portail web doivent être répartis entre les serveurs du moteur de calcul sans quitter VNet-Pay. Un serveur qui ne répond plus sur le port 9000 doit cesser de recevoir des appels. Le moteur de calcul doit voir l'adresse IP du serveur du portail web qui l'appelle.

        **Exigences de gouvernance**

        - Les attributions de stratégies et les attributions de rôles qui concernent la production doivent être faites une seule fois et s'appliquer aux abonnements de production existants ainsi qu'à ceux créés plus tard.
        - Le service financier doit établir les coûts de chaque composant de PayCloud (portail, moteur, base de données), même quand les ressources d'un composant sont réparties entre plusieurs groupes de ressources et abonnements.
        - Chaque ressource doit recevoir automatiquement l'étiquette Environment de son abonnement, sans aucune action des personnes qui la déploient.
        - Les ressources qui sont déployées, mises à jour et supprimées ensemble doivent être gérées comme une seule unité.

        **Exigences générales**

        - Les coûts doivent être réduits au minimum.
        - L'effort d'administration doit être réduit au minimum.
