id: az305-cs3a-vanarsdel
status: draft
title:
  en: VanArsdel, Ltd.
  fr: VanArsdel, Ltd.
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        VanArsdel, Ltd. designs and manufactures industrial pumps. The company has 3,200 employees, a head office and a datacenter in Munich, and four plants: two in Germany and two in Poland. An IT team of 14 people manages the infrastructure.

        VanArsdel plans to move its enterprise resource planning (ERP) system to Azure, to build a telemetry platform for the sensors of its plants, and to connect the Munich datacenter to Azure.
      fr: |
        VanArsdel, Ltd. conçoit et fabrique des pompes industrielles. L'entreprise compte 3 200 employés, un siège et un centre de données à Munich, et quatre usines : deux en Allemagne et deux en Pologne. Une équipe informatique de 14 personnes gère l'infrastructure.

        VanArsdel prévoit de déplacer son progiciel de gestion intégré (ERP) vers Azure, de construire une plateforme de télémétrie pour les capteurs de ses usines et de connecter le centre de données de Munich à Azure.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Identity.** An Active Directory Domain Services forest named vanarsdel.com is synchronized with a Microsoft Entra tenant.

        **Munich datacenter.** The datacenter runs 140 virtual machines on VMware vSphere. VanArsdel has no second datacenter.

        | Workload | Description |
        | --- | --- |
        | ERP | A SQL Server 2019 instance named SQLERP01 hosts 11 databases (1.8 TB in total). The ERP uses cross-database queries, SQL Server Agent jobs and Service Broker. SQLERP01 also runs SQL Server Reporting Services (SSRS), which serves the 60 reports of the ERP, and a license-monitoring agent of the ERP vendor that is installed on its operating system. |
        | MES | The manufacturing execution system runs on 22 VMware virtual machines (Windows and Linux). It must stay in Munich, close to the production lines, for at least three years. |
        | FS01 | A Windows Server 2022 file server that holds 9 TB of engineering drawings in SMB shares protected by NTFS permissions. 85 percent of the files haven't been opened for more than a year, and the volume is 92 percent full. |
        | Plant sensors | 6,000 sensors send JSON readings through a gateway in each plant, about 4,000 readings per second in total. The readings are kept for 48 hours in a local historian. |

        **Network.** The Munich datacenter has two redundant 1-Gbps internet links. The plants connect to Munich through an MPLS network. There is no connectivity between the datacenter and Azure.

        **Azure.** VanArsdel has one pay-as-you-go subscription that is used for tests. The management group hierarchy contains only the Tenant Root Group, and new subscriptions are placed in it by default.
      fr: |
        **Identité.** Une forêt Active Directory Domain Services nommée vanarsdel.com est synchronisée avec un locataire Microsoft Entra.

        **Centre de données de Munich.** Le centre de données exécute 140 machines virtuelles sur VMware vSphere. VanArsdel n'a pas de second centre de données.

        | Charge de travail | Description |
        | --- | --- |
        | ERP | Une instance SQL Server 2019 nommée SQLERP01 héberge 11 bases de données (1,8 To au total). L'ERP utilise des requêtes entre bases de données, des travaux SQL Server Agent et Service Broker. SQLERP01 exécute aussi SQL Server Reporting Services (SSRS), qui sert les 60 rapports de l'ERP, et un agent de suivi des licences de l'éditeur de l'ERP, installé sur son système d'exploitation. |
        | MES | Le système d'exécution de la fabrication fonctionne sur 22 machines virtuelles VMware (Windows et Linux). Il doit rester à Munich, près des lignes de production, pendant au moins trois ans. |
        | FS01 | Un serveur de fichiers Windows Server 2022 qui contient 9 To de plans techniques dans des partages SMB protégés par des autorisations NTFS. 85 % des fichiers n'ont pas été ouverts depuis plus d'un an, et le volume est plein à 92 %. |
        | Capteurs des usines | 6 000 capteurs envoient des relevés JSON par l'intermédiaire d'une passerelle dans chaque usine, soit environ 4 000 relevés par seconde au total. Les relevés sont conservés 48 heures dans un historien local. |

        **Réseau.** Le centre de données de Munich dispose de deux liaisons Internet redondantes de 1 Gbit/s. Les usines sont reliées à Munich par un réseau MPLS. Il n'existe aucune connectivité entre le centre de données et Azure.

        **Azure.** VanArsdel dispose d'un abonnement avec paiement à l'utilisation qui sert aux tests. La hiérarchie des groupes d'administration ne contient que le groupe Tenant Root Group, et les nouveaux abonnements y sont placés par défaut.
  - key: planned
    title: { en: "Planned changes", fr: "Changements prévus" }
    body:
      en: |
        VanArsdel plans the following changes:

        - Create separate subscriptions for production, for non-production and for the analytics team of each plant. More subscriptions will be created later.
        - Migrate the ERP, including its databases, to the Germany West Central region.
        - Build a telemetry platform that ingests, analyzes and stores the sensor readings.
        - Connect the Munich datacenter to Azure.
        - Protect the MES against the loss of the Munich datacenter.
      fr: |
        VanArsdel prévoit les changements suivants :

        - Créer des abonnements distincts pour la production, pour la hors-production et pour l'équipe d'analytique de chaque usine. D'autres abonnements seront créés par la suite.
        - Migrer l'ERP, y compris ses bases de données, vers la région Germany West Central.
        - Construire une plateforme de télémétrie qui ingère, analyse et stocke les relevés des capteurs.
        - Connecter le centre de données de Munich à Azure.
        - Protéger le MES contre la perte du centre de données de Munich.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Business requirements**

        - Minimize administrative effort. Use platform services instead of virtual machines whenever they meet all the technical requirements.
        - Minimize costs whenever several solutions meet the technical requirements.
        - Azure resources must be created only in the Germany West Central and Poland Central regions. The restriction must apply automatically to every existing and future subscription, and subscription owners must be unable to bypass it.

        **Technical requirements**

        1. **ERP databases.** The databases must be migrated without changes to the application code or to the database code. The SSRS reports must keep running on the database server, and the license-monitoring agent of the vendor must remain installed on its operating system.
        2. **Connectivity.** Traffic between the Munich datacenter and Azure must use a private 1-Gbps connection that doesn't cross the public internet. The security policy of VanArsdel also requires this traffic to be encrypted with IPsec between the VPN device of the datacenter and the virtual networks. The cost of the solution must be minimized.
        3. **Telemetry ingestion.** The ingestion service must keep the readings for three days so that several independent applications can each read the same stream, and read it again.
        4. **Telemetry alerts.** An alert must be raised when the average vibration of a pump over a five-minute window exceeds a threshold. The logic must be written in a SQL-like language, on a service that has no cluster to manage.
        5. **Telemetry analysis.** Engineers must explore two years of raw JSON readings interactively, with built-in time series functions such as anomaly detection and forecasting. Queries must return in seconds, without modeling the data beforehand.
        6. **MES recovery.** If the Munich datacenter is lost, the MES virtual machines must run in Azure with a recovery point objective (RPO) of 15 minutes and a recovery time objective (RTO) of four hours. The recovery must be tested twice a year without interrupting production or replication. While the datacenter operates normally, VanArsdel must not pay for standby virtual machines in Azure.
        7. **Engineering drawings.** All the drawings must be stored in Azure. Users must keep opening them through the existing SMB share paths of FS01, with the existing NTFS permissions. The disk space used on FS01 must decrease.
      fr: |
        **Exigences métier**

        - Réduire l'effort d'administration au minimum. Utiliser des services de plateforme plutôt que des machines virtuelles chaque fois qu'ils satisfont toutes les exigences techniques.
        - Réduire les coûts au minimum chaque fois que plusieurs solutions satisfont les exigences techniques.
        - Les ressources Azure ne doivent être créées que dans les régions Germany West Central et Poland Central. La restriction doit s'appliquer automatiquement à chaque abonnement existant et futur, et les propriétaires d'abonnement ne doivent pas pouvoir la contourner.

        **Exigences techniques**

        1. **Bases de données de l'ERP.** Les bases de données doivent être migrées sans modification du code de l'application ni du code des bases de données. Les rapports SSRS doivent continuer de s'exécuter sur le serveur de bases de données, et l'agent de suivi des licences de l'éditeur doit rester installé sur son système d'exploitation.
        2. **Connectivité.** Le trafic entre le centre de données de Munich et Azure doit emprunter une connexion privée de 1 Gbit/s qui ne traverse pas l'Internet public. La politique de sécurité de VanArsdel exige en outre que ce trafic soit chiffré par IPsec entre l'appareil VPN du centre de données et les réseaux virtuels. Le coût de la solution doit être réduit au minimum.
        3. **Ingestion de la télémétrie.** Le service d'ingestion doit conserver les relevés pendant trois jours afin que plusieurs applications indépendantes puissent chacune lire le même flux, et le relire.
        4. **Alertes de télémétrie.** Une alerte doit être déclenchée lorsque la vibration moyenne d'une pompe sur une fenêtre de cinq minutes dépasse un seuil. La logique doit être écrite dans un langage de type SQL, sur un service sans cluster à gérer.
        5. **Analyse de la télémétrie.** Les ingénieurs doivent explorer de manière interactive deux ans de relevés JSON bruts, avec des fonctions intégrées de séries chronologiques telles que la détection d'anomalies et la prévision. Les requêtes doivent répondre en quelques secondes, sans modélisation préalable des données.
        6. **Récupération du MES.** Si le centre de données de Munich est perdu, les machines virtuelles du MES doivent fonctionner dans Azure avec un objectif de point de récupération (RPO) de 15 minutes et un objectif de délai de récupération (RTO) de quatre heures. La récupération doit être testée deux fois par an sans interrompre la production ni la réplication. Tant que le centre de données fonctionne normalement, VanArsdel ne doit pas payer de machines virtuelles de secours dans Azure.
        7. **Plans techniques.** Tous les plans doivent être stockés dans Azure. Les utilisateurs doivent continuer à les ouvrir par les chemins de partage SMB existants de FS01, avec les autorisations NTFS existantes. L'espace disque utilisé sur FS01 doit diminuer.
