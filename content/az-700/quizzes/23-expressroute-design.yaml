chapter: 23-expressroute-design
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-23-01
    objective: "2.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso is ordering its first ExpressRoute circuit from a connectivity provider. The order form asks for a peering location, such as Amsterdam or Silicon Valley.

        What does the peering location of an ExpressRoute circuit represent?
      fr: |
        Contoso commande son premier circuit ExpressRoute auprès d'un fournisseur de connectivité. Le formulaire de commande demande un emplacement de peering, comme Amsterdam ou Silicon Valley.

        Que représente l'emplacement de peering d'un circuit ExpressRoute ?
    body:
      options:
        - { id: a, text: { en: "The Azure region where every virtual network linked to the circuit must be deployed", fr: "La région Azure dans laquelle tous les réseaux virtuels liés au circuit doivent être déployés" } }
        - { id: b, text: { en: "The colocation facility where the circuit reaches the Microsoft Enterprise Edge (MSEE) routers", fr: "Le site de colocalisation où le circuit atteint les routeurs Microsoft Enterprise Edge (MSEE)" } }
        - { id: c, text: { en: "The Azure datacenter that hosts the ExpressRoute virtual network gateway of the circuit", fr: "Le centre de données Azure qui héberge la passerelle de réseau virtuel ExpressRoute du circuit" } }
        - { id: d, text: { en: "The on-premises site where the provider installs the customer edge routers of the circuit", fr: "Le site local où le fournisseur installe les routeurs de périphérie client du circuit" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A peering location is a colocation facility where Microsoft's edge routers (MSEEs) are deployed and where the provider, or you with ExpressRoute Direct, connects into the Microsoft global network. It isn't an Azure region: one circuit reaches the regions allowed by its tier, for example every region of the geopolitical area with Standard.
        fr: |
          Un emplacement de peering est un site de colocalisation où sont déployés les routeurs de périphérie de Microsoft (MSEE) et où le fournisseur, ou vous-même avec ExpressRoute Direct, se raccorde au réseau mondial de Microsoft. Ce n'est pas une région Azure : un circuit atteint les régions que permet son niveau, par exemple toutes les régions de la zone géopolitique avec Standard.
      options:
        a: { en: "The peering location and the Azure region are different things: a Standard circuit reaches every region of its geopolitical area, not a single region.", fr: "L'emplacement de peering et la région Azure sont deux choses différentes : un circuit Standard atteint toutes les régions de sa zone géopolitique, pas une seule région." }
        c: { en: "The ExpressRoute gateway is deployed in the GatewaySubnet of each linked virtual network, in that network's region, not at the peering location.", fr: "La passerelle ExpressRoute est déployée dans le GatewaySubnet de chaque réseau virtuel lié, dans la région de ce réseau, pas dans l'emplacement de peering." }
        d: { en: "The customer edge routers are in your datacenter or colocation space; the peering location is the Microsoft side of the connection.", fr: "Les routeurs de périphérie client sont dans votre centre de données ou votre espace de colocalisation ; l'emplacement de peering est le côté Microsoft de la connexion." }
    references:
      - title: "Azure ExpressRoute: Connectivity models"
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-connectivity-models
      - title: "Azure ExpressRoute: circuits and peering"
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-circuit-peerings

  # ------------------------------------------------------------------ 2
  - id: az700-qz-23-02
    objective: "2.3.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam will configure both Azure private peering and Microsoft peering on a new ExpressRoute circuit. The security team asks where each peering should terminate in the on-premises network, as Microsoft recommends.

        What should you recommend?
      fr: |
        Fabrikam va configurer à la fois le peering privé Azure et le peering Microsoft sur un nouveau circuit ExpressRoute. L'équipe de sécurité demande où chaque peering doit aboutir dans le réseau local, selon la recommandation de Microsoft.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Private peering to the core network, and Microsoft peering to the perimeter network (DMZ)", fr: "Le peering privé au réseau principal, et le peering Microsoft au réseau de périmètre (DMZ)" } }
        - { id: b, text: { en: "Private peering to the perimeter network (DMZ), and Microsoft peering to the core network", fr: "Le peering privé au réseau de périmètre (DMZ), et le peering Microsoft au réseau principal" } }
        - { id: c, text: { en: "Both peerings to the perimeter network (DMZ), behind the same pair of firewalls", fr: "Les deux peerings au réseau de périmètre (DMZ), derrière la même paire de pare-feu" } }
        - { id: d, text: { en: "Both peerings to the core network, so that they share one routing table", fr: "Les deux peerings au réseau principal, afin qu'ils partagent une même table de routage" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Private peering extends the core network to the virtual networks over private addresses, so it is a trusted extension of the core network. Microsoft peering exchanges public addresses with Microsoft online services and Azure public endpoints, so Microsoft recommends connecting it to the perimeter network.
        fr: |
          Le peering privé prolonge le réseau principal vers les réseaux virtuels avec des adresses privées : c'est une extension approuvée du réseau principal. Le peering Microsoft échange des adresses publiques avec les services en ligne de Microsoft et les points de terminaison publics Azure : Microsoft recommande donc de le raccorder au réseau de périmètre.
      options:
        b: { en: "This inverts the recommendation: the peering that carries public addresses belongs in the DMZ, the one that extends the private address space belongs in the core.", fr: "C'est l'inverse de la recommandation : le peering qui transporte des adresses publiques va dans la DMZ, celui qui prolonge l'espace d'adressage privé va dans le réseau principal." }
        c: { en: "Private peering is a trusted extension of the core network; placing it in the DMZ treats the virtual networks as untrusted.", fr: "Le peering privé est une extension approuvée du réseau principal ; le placer dans la DMZ traite les réseaux virtuels comme non approuvés." }
        d: { en: "Microsoft peering exchanges public routes with Microsoft online services; connecting it directly to the core network bypasses the perimeter.", fr: "Le peering Microsoft échange des routes publiques avec les services en ligne de Microsoft ; le raccorder directement au réseau principal contourne le périmètre." }
    references:
      - title: "Azure ExpressRoute: circuits and peering"
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-circuit-peerings

  # ------------------------------------------------------------------ 3
  - id: az700-qz-23-03
    objective: "2.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip has an ExpressRoute circuit named **CKT1** that uses the Premium tier, the MeteredData billing model and a bandwidth of 500 Mbps. Thirty-eight virtual networks are linked to CKT1, and Global Reach isn't used. The provider port has spare capacity up to 10 Gbps.

        Wingtip must link eight more virtual networks, in the same geopolitical area, to CKT1. The solution must minimize cost.

        What should you do?
      fr: |
        Wingtip dispose d'un circuit ExpressRoute nommé **CKT1** qui utilise le niveau Premium, le modèle de facturation MeteredData et une bande passante de 500 Mbit/s. Trente-huit réseaux virtuels sont liés à CKT1, et Global Reach n'est pas utilisé. Le port du fournisseur a de la capacité disponible jusqu'à 10 Gbit/s.

        Wingtip doit lier huit réseaux virtuels supplémentaires, dans la même zone géopolitique, à CKT1. La solution doit réduire les coûts au minimum.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Increase the bandwidth of CKT1 to 1 Gbps.", fr: "Augmenter la bande passante de CKT1 à 1 Gbit/s." } }
        - { id: b, text: { en: "Increase the bandwidth of CKT1 to 2 Gbps.", fr: "Augmenter la bande passante de CKT1 à 2 Gbit/s." } }
        - { id: c, text: { en: "Change the billing model of CKT1 to UnlimitedData.", fr: "Passer le modèle de facturation de CKT1 à UnlimitedData." } }
        - { id: d, text: { en: "Link the new virtual networks without changing CKT1.", fr: "Lier les nouveaux réseaux virtuels sans modifier CKT1." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          With Premium, the number of virtual networks that can be linked depends on the bandwidth: 40 at 500 Mbps, 50 at 1 Gbps and 60 at 2 Gbps. Wingtip needs 46 links, so 1 Gbps is the smallest bandwidth that fits, and increasing the bandwidth doesn't require recreating the circuit when the provider port has capacity.
        fr: |
          Avec Premium, le nombre de réseaux virtuels pouvant être liés dépend de la bande passante : 40 à 500 Mbit/s, 50 à 1 Gbit/s et 60 à 2 Gbit/s. Wingtip a besoin de 46 liens : 1 Gbit/s est donc la plus petite bande passante qui convient, et l'augmentation de bande passante ne demande pas de recréer le circuit quand le port du fournisseur a la capacité.
      options:
        b: { en: "2 Gbps allows 60 links, which also works, but it costs more than the 1 Gbps that already allows 50.", fr: "2 Gbit/s permet 60 liens, ce qui fonctionne aussi, mais coûte plus cher que 1 Gbit/s, qui en permet déjà 50." }
        c: { en: "The billing model changes how outbound data is charged; it doesn't change the number of virtual networks a circuit accepts.", fr: "Le modèle de facturation change la façon dont les données sortantes sont facturées ; il ne change pas le nombre de réseaux virtuels qu'accepte un circuit." }
        d: { en: "A 500 Mbps Premium circuit accepts 40 linked virtual networks, not 100; 46 links exceed the limit.", fr: "Un circuit Premium de 500 Mbit/s accepte 40 réseaux virtuels liés, pas 100 ; 46 liens dépassent la limite." }
    references:
      - title: FAQ - Azure ExpressRoute
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-faqs

  # ------------------------------------------------------------------ 4
  - id: az700-qz-23-04
    objective: "2.3.3"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Litware has the following resources:

        | Virtual network | Region | ExpressRoute gateway | Connected circuit |
        | --- | --- | --- | --- |
        | VNet-WE | West Europe | ERGW-WE (ErGw2Az) | CKT-AMS, Amsterdam peering location, Standard |
        | VNet-NE | North Europe | ERGW-NE (ErGw2Az) | CKT-DUB, Dublin peering location, Standard |

        The on-premises networks behind both circuits are connected by Litware's WAN. Litware requires that both virtual networks keep private connectivity to the on-premises networks if either circuit fails. The solution must minimize cost.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose des ressources suivantes :

        | Réseau virtuel | Région | Passerelle ExpressRoute | Circuit connecté |
        | --- | --- | --- | --- |
        | VNet-WE | West Europe | ERGW-WE (ErGw2Az) | CKT-AMS, emplacement de peering Amsterdam, Standard |
        | VNet-NE | North Europe | ERGW-NE (ErGw2Az) | CKT-DUB, emplacement de peering Dublin, Standard |

        Les réseaux locaux situés derrière les deux circuits sont reliés par le WAN de Litware. Litware exige que les deux réseaux virtuels conservent une connectivité privée vers les réseaux locaux en cas de panne de l'un ou l'autre circuit. La solution doit réduire les coûts au minimum.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create a connection between ERGW-WE and CKT-DUB.", fr: "Créer une connexion entre ERGW-WE et CKT-DUB." } }
        - { id: b, text: { en: "Enable Global Reach between CKT-AMS and CKT-DUB.", fr: "Activer Global Reach entre CKT-AMS et CKT-DUB." } }
        - { id: c, text: { en: "Create a connection between ERGW-NE and CKT-AMS.", fr: "Créer une connexion entre ERGW-NE et CKT-AMS." } }
        - { id: d, text: { en: "Upgrade CKT-AMS and CKT-DUB to the Premium tier.", fr: "Passer CKT-AMS et CKT-DUB au niveau Premium." } }
        - { id: e, text: { en: "Peer VNet-NE with VNet-WE and enable Use remote gateways on VNet-NE.", fr: "Créer un peering entre VNet-NE et VNet-WE et activer Utiliser des passerelles distantes sur VNet-NE." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Linking each virtual network to both circuits (a "bow-tie" design) lets each region use its local circuit and fall back to the remote one when the local circuit fails. Both regions and both peering locations are in the same geopolitical area, so the Standard tier is enough, and each ErGw2Az gateway accepts several circuit connections.
        fr: |
          Lier chaque réseau virtuel aux deux circuits (conception en « nœud papillon ») permet à chaque région d'utiliser son circuit local et de se replier sur le circuit distant quand le circuit local tombe en panne. Les deux régions et les deux emplacements de peering sont dans la même zone géopolitique : le niveau Standard suffit, et chaque passerelle ErGw2Az accepte plusieurs connexions de circuit.
      options:
        b: { en: "Global Reach connects the on-premises sites to each other through the two circuits; it doesn't give a virtual network a second path to on-premises.", fr: "Global Reach relie les sites locaux entre eux par les deux circuits ; il ne donne pas à un réseau virtuel un second chemin vers le réseau local." }
        d: { en: "Premium is needed only to link a virtual network outside the circuit's geopolitical area; West Europe and North Europe are in the same area as Amsterdam and Dublin.", fr: "Premium n'est nécessaire que pour lier un réseau virtuel hors de la zone géopolitique du circuit ; West Europe et North Europe sont dans la même zone qu'Amsterdam et Dublin." }
        e: { en: "A virtual network that uses a remote gateway can't have its own gateway, and VNet-NE already has ERGW-NE.", fr: "Un réseau virtuel qui utilise une passerelle distante ne peut pas avoir sa propre passerelle, or VNet-NE possède déjà ERGW-NE." }
    references:
      - title: "Azure ExpressRoute: Designing for disaster recovery with ExpressRoute private peering"
        url: https://learn.microsoft.com/en-us/azure/expressroute/designing-for-disaster-recovery-with-expressroute-privatepeering
      - title: Azure virtual network peering
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview

  # ------------------------------------------------------------------ 5
  - id: az700-qz-23-05
    objective: "2.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin has three offices, each connected to Azure by its own ExpressRoute circuit with Azure private peering:

        | Circuit | Peering location | SKU |
        | --- | --- | --- |
        | CKT-PAR | Paris | Standard |
        | CKT-FRA | Frankfurt | Standard |
        | CKT-MIL | Milan | Standard |

        ExpressRoute Global Reach is enabled between CKT-PAR and CKT-FRA, and between CKT-FRA and CKT-MIL. The Paris and Frankfurt offices communicate, and so do the Frankfurt and Milan offices, but the Paris office can't reach the Milan office.

        You need the Paris and Milan offices to communicate over the Microsoft network. What should you do?
      fr: |
        Tailspin possède trois bureaux, chacun connecté à Azure par son propre circuit ExpressRoute avec le peering privé Azure :

        | Circuit | Emplacement de peering | Référence SKU |
        | --- | --- | --- |
        | CKT-PAR | Paris | Standard |
        | CKT-FRA | Frankfurt | Standard |
        | CKT-MIL | Milan | Standard |

        ExpressRoute Global Reach est activé entre CKT-PAR et CKT-FRA, et entre CKT-FRA et CKT-MIL. Les bureaux de Paris et de Francfort communiquent, de même que ceux de Francfort et de Milan, mais le bureau de Paris ne parvient pas à joindre celui de Milan.

        Vous devez faire communiquer les bureaux de Paris et de Milan par le réseau Microsoft. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Upgrade CKT-FRA to the Premium tier so that it can transit traffic.", fr: "Passer CKT-FRA au niveau Premium pour qu'il puisse faire transiter le trafic." } }
        - { id: b, text: { en: "Enable FastPath on the gateway connections of the three circuits.", fr: "Activer FastPath sur les connexions de passerelle des trois circuits." } }
        - { id: c, text: { en: "Link one virtual network to all three circuits so that it relays traffic.", fr: "Lier un même réseau virtuel aux trois circuits pour qu'il relaie le trafic." } }
        - { id: d, text: { en: "Enable Global Reach directly between CKT-PAR and CKT-MIL.", fr: "Activer Global Reach directement entre CKT-PAR et CKT-MIL." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Global Reach isn't transitive: linking A to B and B to C doesn't connect A to C. Each pair of sites that must communicate needs its own Global Reach connection, so you add one between CKT-PAR and CKT-MIL. The three circuits are in the same geopolitical area, so Standard is enough.
        fr: |
          Global Reach n'est pas transitif : relier A à B et B à C ne connecte pas A à C. Chaque paire de sites qui doit communiquer a besoin de sa propre connexion Global Reach : vous en ajoutez donc une entre CKT-PAR et CKT-MIL. Les trois circuits sont dans la même zone géopolitique : Standard suffit.
      options:
        a: { en: "Premium extends the geographic reach and the limits of a circuit; it doesn't make Global Reach transitive.", fr: "Premium étend la portée géographique et les limites d'un circuit ; il ne rend pas Global Reach transitif." }
        b: { en: "FastPath changes the data path between the MSEEs and the virtual machines; it has no effect on traffic between on-premises sites.", fr: "FastPath modifie le chemin des données entre les MSEE et les machines virtuelles ; il n'a aucun effet sur le trafic entre sites locaux." }
        c: { en: "ExpressRoute gateways don't relay traffic from one circuit to another; on-premises-to-on-premises traffic over the Microsoft network needs Global Reach.", fr: "Les passerelles ExpressRoute ne relaient pas le trafic d'un circuit à un autre ; le trafic entre sites locaux par le réseau Microsoft exige Global Reach." }
    references:
      - title: FAQ - Azure ExpressRoute
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-faqs
      - title: About Azure ExpressRoute Global Reach
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-global-reach

  # ------------------------------------------------------------------ 6
  - id: az700-qz-23-06
    objective: "2.3.5"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Four subsidiaries of Contoso each order their own ExpressRoute circuit. Each subsidiary owns public IP prefixes registered in a routing registry. Their requirements are described in the answer area.

        Which peering configuration should each subsidiary use on its circuit? The solution must use only the peerings that the requirements need. To answer, drag the appropriate configurations to the correct subsidiaries. Each configuration may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Quatre filiales de Contoso commandent chacune leur propre circuit ExpressRoute. Chaque filiale possède des préfixes IP publics inscrits dans un registre de routage. Leurs exigences sont décrites dans la zone de réponse.

        Quelle configuration de peering chaque filiale doit-elle utiliser sur son circuit ? La solution ne doit utiliser que les peerings dont les exigences ont besoin. Pour répondre, faites glisser les configurations appropriées vers les filiales correspondantes. Chaque configuration peut être utilisée une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: private, text: { en: "Azure private peering only", fr: "Peering privé Azure uniquement" } }
        - { id: microsoft, text: { en: "Microsoft peering only", fr: "Peering Microsoft uniquement" } }
        - { id: both, text: { en: "Both Azure private peering and Microsoft peering", fr: "Le peering privé Azure et le peering Microsoft" } }
      targets:
        - { id: t1, text: { en: "Adatum: reach virtual machines and Azure SQL databases through private endpoints; public network access is disabled on the databases.", fr: "Adatum : atteindre des machines virtuelles et des bases de données Azure SQL par des points de terminaison privés ; l'accès réseau public est désactivé sur les bases de données." } }
        - { id: t2, text: { en: "Litware: no virtual networks; users reach Exchange Online over a Premium circuit that Microsoft authorized for Microsoft 365.", fr: "Litware : aucun réseau virtuel ; les utilisateurs atteignent Exchange Online par un circuit Premium que Microsoft a autorisé pour Microsoft 365." } }
        - { id: t3, text: { en: "Proseware: reach virtual machines, and the public endpoints of storage accounts from NAT public addresses.", fr: "Proseware : atteindre des machines virtuelles, ainsi que les points de terminaison publics de comptes de stockage depuis des adresses publiques NAT." } }
        - { id: t4, text: { en: "Tailspin: only IPsec tunnels carried over the circuit to the public IP addresses of an Azure VPN gateway.", fr: "Tailspin : uniquement des tunnels IPsec transportés par le circuit vers les adresses IP publiques d'une passerelle VPN Azure." } }
    answer:
      mapping: { t1: private, t2: microsoft, t3: both, t4: microsoft }
    explanation:
      correct:
        en: |
          Private endpoints have private addresses in a virtual network, so Adatum needs private peering only. Microsoft 365 and the public endpoints of Azure services are reached through Microsoft peering, so Litware needs Microsoft peering only and Proseware, which also reaches virtual machines, needs both. The public IP addresses of a VPN gateway are advertised over Microsoft peering, so Tailspin's tunnels need Microsoft peering only; the virtual network traffic travels inside the tunnels.
        fr: |
          Les points de terminaison privés ont des adresses privées dans un réseau virtuel : Adatum n'a besoin que du peering privé. Microsoft 365 et les points de terminaison publics des services Azure s'atteignent par le peering Microsoft : Litware n'a besoin que du peering Microsoft, et Proseware, qui atteint aussi des machines virtuelles, a besoin des deux. Les adresses IP publiques d'une passerelle VPN sont publiées sur le peering Microsoft : les tunnels de Tailspin n'ont donc besoin que du peering Microsoft ; le trafic des réseaux virtuels circule à l'intérieur des tunnels.
      options:
        both: { en: "For Adatum, Microsoft peering would be unused: the databases are reached only through their private endpoints, and their public access is disabled.", fr: "Pour Adatum, le peering Microsoft serait inutilisé : les bases de données ne sont atteintes que par leurs points de terminaison privés, et leur accès public est désactivé." }
        private: { en: "For Tailspin, private peering doesn't carry routes to public IP addresses; tunnels to the public addresses of the gateway need Microsoft peering.", fr: "Pour Tailspin, le peering privé ne transporte pas de routes vers des adresses IP publiques ; des tunnels vers les adresses publiques de la passerelle exigent le peering Microsoft." }
    references:
      - title: "Azure ExpressRoute: circuits and peering"
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-circuit-peerings
      - title: "Azure ExpressRoute: Configure S2S VPN over Microsoft peering"
        url: https://learn.microsoft.com/en-us/azure/expressroute/site-to-site-vpn-over-microsoft-peering

  # ------------------------------------------------------------------ 7
  - id: az700-qz-23-07
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum has a virtual network named **VNet-WE** in West Europe. Its ExpressRoute gateway, which uses the ErGw2Az SKU, has the following connections:

        | Connection | Circuit | Peering location | Circuit SKU | Routing weight |
        | --- | --- | --- | --- | --- |
        | Conn-AMS | CKT-AMS | Amsterdam | Standard | 0 |
        | Conn-LON | CKT-LON | London | Standard | 0 |

        The on-premises edge routers advertise the prefix 10.50.0.0/16 over the private peering of both circuits, with the same AS path. The edge routers don't apply any BGP policy.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un réseau virtuel nommé **VNet-WE** dans West Europe. Sa passerelle ExpressRoute, qui utilise la référence SKU ErGw2Az, possède les connexions suivantes :

        | Connexion | Circuit | Emplacement de peering | Référence SKU du circuit | Poids de routage |
        | --- | --- | --- | --- | --- |
        | Conn-AMS | CKT-AMS | Amsterdam | Standard | 0 |
        | Conn-LON | CKT-LON | London | Standard | 0 |

        Les routeurs de périphérie locaux publient le préfixe 10.50.0.0/16 sur le peering privé des deux circuits, avec le même chemin d'AS. Les routeurs de périphérie n'appliquent aucune stratégie BGP.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Traffic from VNet-WE to 10.50.0.0/16 is currently spread across CKT-AMS and CKT-LON.", fr: "Le trafic de VNet-WE vers 10.50.0.0/16 est actuellement réparti entre CKT-AMS et CKT-LON." } }
        - { id: s2, text: { en: "If you set the routing weight of Conn-AMS to 100, the traffic from 10.50.0.0/16 to VNet-WE also uses only CKT-AMS.", fr: "Si vous réglez le poids de routage de Conn-AMS sur 100, le trafic de 10.50.0.0/16 vers VNet-WE emprunte lui aussi uniquement CKT-AMS." } }
        - { id: s3, text: { en: "To link a virtual network in East US to both circuits, you must upgrade both CKT-AMS and CKT-LON to the Premium tier.", fr: "Pour lier un réseau virtuel situé dans East US aux deux circuits, vous devez passer CKT-AMS et CKT-LON au niveau Premium." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          When two circuits advertise the same prefix with the same BGP attributes and equal connection weights, Azure load-balances the flows across them (ECMP). The routing weight only changes the path that Azure chooses toward on-premises; the path from on-premises to Azure is chosen by the edge routers, for example with a higher local preference, so the flows would become asymmetric. Amsterdam and London are in Europe and East US isn't, so each circuit that links the new virtual network needs Premium.
        fr: |
          Quand deux circuits publient le même préfixe avec les mêmes attributs BGP et des poids de connexion égaux, Azure équilibre les flux entre eux (ECMP). Le poids de routage ne change que le chemin choisi par Azure vers le réseau local ; le chemin du réseau local vers Azure est choisi par les routeurs de périphérie, par exemple avec une préférence locale plus élevée : les flux deviendraient donc asymétriques. Amsterdam et Londres sont en Europe, East US non : chaque circuit qui lie le nouveau réseau virtuel a besoin de Premium.
    references:
      - title: "Azure ExpressRoute: Designing for disaster recovery with ExpressRoute private peering"
        url: https://learn.microsoft.com/en-us/azure/expressroute/designing-for-disaster-recovery-with-expressroute-privatepeering
      - title: Connect a virtual network to an ExpressRoute circuit using Azure PowerShell
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-linkvnet-arm

  # ------------------------------------------------------------------ 8
  - id: az700-qz-23-08
    objective: "2.3.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove has the following resources:

        | Resource | Configuration |
        | --- | --- |
        | VNet-Hub | West Europe; ExpressRoute gateway ERGW-Hub with the ErGw3AZ SKU |
        | CKT-D | 10-Gbps circuit on ExpressRoute Direct ports at the Amsterdam peering location, Standard |
        | Conn-D | Connection between ERGW-Hub and CKT-D, created in 2026 with FastPath enabled |
        | VNet-App1 | West Europe; peered with VNet-Hub, **Use remote gateways** enabled; contains virtual machines and a Standard internal load balancer named ILB1 |
        | VNet-App2 | North Europe; peered with VNet-Hub, **Use remote gateways** enabled; contains virtual machines |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove dispose des ressources suivantes :

        | Ressource | Configuration |
        | --- | --- |
        | VNet-Hub | West Europe ; passerelle ExpressRoute ERGW-Hub avec la référence SKU ErGw3AZ |
        | CKT-D | Circuit de 10 Gbit/s sur des ports ExpressRoute Direct à l'emplacement de peering Amsterdam, Standard |
        | Conn-D | Connexion entre ERGW-Hub et CKT-D, créée en 2026 avec FastPath activé |
        | VNet-App1 | West Europe ; peering avec VNet-Hub, **Utiliser des passerelles distantes** activé ; contient des machines virtuelles et un équilibreur de charge interne Standard nommé ILB1 |
        | VNet-App2 | North Europe ; peering avec VNet-Hub, **Utiliser des passerelles distantes** activé ; contient des machines virtuelles |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Traffic from on-premises to the virtual machines in VNet-App1 bypasses ERGW-Hub.", fr: "Le trafic du réseau local vers les machines virtuelles de VNet-App1 contourne ERGW-Hub." } }
        - { id: s2, text: { en: "Traffic from on-premises to the virtual machines in VNet-App2 bypasses ERGW-Hub.", fr: "Le trafic du réseau local vers les machines virtuelles de VNet-App2 contourne ERGW-Hub." } }
        - { id: s3, text: { en: "Traffic from on-premises to the frontend IP address of ILB1 bypasses ERGW-Hub.", fr: "Le trafic du réseau local vers l'adresse IP frontale d'ILB1 contourne ERGW-Hub." } }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          On an ExpressRoute Direct circuit, FastPath also covers spoke virtual networks peered with the hub in the same region, so traffic to the virtual machines in VNet-App1 bypasses the gateway. Global virtual network peering isn't supported by FastPath, so traffic to VNet-App2, in another region, still goes through ERGW-Hub. Internal load balancers are supported in the hub only: traffic to ILB1, in a spoke, still goes through the gateway.
        fr: |
          Sur un circuit ExpressRoute Direct, FastPath couvre aussi les réseaux virtuels spoke reliés au hub par un peering dans la même région : le trafic vers les machines virtuelles de VNet-App1 contourne donc la passerelle. Le peering de réseaux virtuels mondial n'est pas pris en charge par FastPath : le trafic vers VNet-App2, dans une autre région, passe toujours par ERGW-Hub. Les équilibreurs de charge internes ne sont pris en charge que dans le hub : le trafic vers ILB1, situé dans un spoke, passe toujours par la passerelle.
    references:
      - title: "Azure ExpressRoute FastPath: Features, availability, and limitations"
        url: https://learn.microsoft.com/en-us/azure/expressroute/about-fastpath

  # ------------------------------------------------------------------ 9
  - id: az700-qz-23-09
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum plans a new 2-Gbps ExpressRoute circuit named **CKT-AMS** at the Amsterdam peering location, whose local Azure region is West Europe. The connectivity provider offers ExpressRoute Local at that location. Adatum already has a Standard circuit named **CKT-LON** at the London peering location.

        CKT-AMS must meet the following requirements:

        - Link 12 virtual networks, all in West Europe.
        - Use ExpressRoute Global Reach with CKT-LON so that the Amsterdam and London offices can communicate.
        - Include outbound data transfer in the monthly price of the circuit, without per-GB charges.

        You need to recommend a SKU for CKT-AMS. The solution must minimize cost.

        What should you recommend?
      fr: |
        Adatum prévoit un nouveau circuit ExpressRoute de 2 Gbit/s nommé **CKT-AMS** à l'emplacement de peering Amsterdam, dont la région Azure locale est West Europe. Le fournisseur de connectivité propose ExpressRoute Local à cet emplacement. Adatum dispose déjà d'un circuit Standard nommé **CKT-LON** à l'emplacement de peering London.

        CKT-AMS doit répondre aux exigences suivantes :

        - Lier 12 réseaux virtuels, tous dans West Europe.
        - Utiliser ExpressRoute Global Reach avec CKT-LON pour que les bureaux d'Amsterdam et de Londres puissent communiquer.
        - Inclure le transfert de données sortant dans le prix mensuel du circuit, sans facturation au Go.

        Vous devez recommander une référence SKU pour CKT-AMS. La solution doit réduire les coûts au minimum.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: "Local" }
        - { id: b, text: "Standard, UnlimitedData" }
        - { id: c, text: "Premium, MeteredData" }
        - { id: d, text: "Premium, UnlimitedData" }
    shuffle: false
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Local and Standard circuits accept at most 10 linked virtual networks, whatever the bandwidth, so 12 links require Premium, which allows 60 at 2 Gbps. Outbound data must be included in the monthly price, which is the UnlimitedData billing model. Global Reach between Amsterdam and London, in the same geopolitical area, works with Premium on CKT-AMS and Standard on CKT-LON.
        fr: |
          Les circuits Local et Standard acceptent au plus 10 réseaux virtuels liés, quelle que soit la bande passante : 12 liens exigent donc Premium, qui en permet 60 à 2 Gbit/s. Les données sortantes doivent être incluses dans le prix mensuel, ce qui correspond au modèle de facturation UnlimitedData. Global Reach entre Amsterdam et Londres, dans la même zone géopolitique, fonctionne avec Premium sur CKT-AMS et Standard sur CKT-LON.
      options:
        a: { en: "Local includes outbound data, but it doesn't support Global Reach and it has the Standard limit of 10 linked virtual networks.", fr: "Local inclut les données sortantes, mais ne prend pas en charge Global Reach et a la limite Standard de 10 réseaux virtuels liés." }
        b: { en: "Standard supports Global Reach and includes data with UnlimitedData, but it accepts only 10 linked virtual networks.", fr: "Standard prend en charge Global Reach et inclut les données avec UnlimitedData, mais n'accepte que 10 réseaux virtuels liés." }
        c: { en: "Premium accepts the 12 links and supports Global Reach, but MeteredData charges outbound data transfer per GB.", fr: "Premium accepte les 12 liens et prend en charge Global Reach, mais MeteredData facture le transfert de données sortant au Go." }
    references:
      - title: FAQ - Azure ExpressRoute
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-faqs

  # ------------------------------------------------------------------ 10
  - id: az700-qz-23-10
    objective: "2.3.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind has the following ExpressRoute circuits. Azure private peering is configured on both circuits.

        | Circuit | Peering location | SKU | Subscription | Managed by |
        | --- | --- | --- | --- | --- |
        | CKT-LON | London | Standard, MeteredData | Sub-EU | EU network team |
        | CKT-SIN | Singapore | Standard, MeteredData | Sub-APAC | APAC network team |

        The London and Singapore offices must exchange traffic over the Microsoft network by using ExpressRoute Global Reach. The EU network team will configure Global Reach; it has no permissions in Sub-APAC. The solution must minimize cost.

        What should you configure? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind dispose des circuits ExpressRoute suivants. Le peering privé Azure est configuré sur les deux circuits.

        | Circuit | Emplacement de peering | Référence SKU | Abonnement | Géré par |
        | --- | --- | --- | --- | --- |
        | CKT-LON | London | Standard, MeteredData | Sub-EU | Équipe réseau EU |
        | CKT-SIN | Singapore | Standard, MeteredData | Sub-APAC | Équipe réseau APAC |

        Les bureaux de Londres et de Singapour doivent échanger du trafic par le réseau Microsoft à l'aide d'ExpressRoute Global Reach. L'équipe réseau EU va configurer Global Reach ; elle n'a aucune autorisation dans Sub-APAC. La solution doit réduire les coûts au minimum.

        Que devez-vous configurer ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Tier of the circuits: [[tier]]

          Resource that the APAC network team creates on CKT-SIN: [[res]]

          Global Reach configuration: [[cfg]]
        fr: |
          Niveau des circuits : [[tier]]

          Ressource que l'équipe réseau APAC crée sur CKT-SIN : [[res]]

          Configuration de Global Reach : [[cfg]]
      slots:
        - id: tier
          options:
            - { id: std, text: { en: "Keep Standard on both circuits", fr: "Conserver Standard sur les deux circuits" } }
            - { id: lon, text: { en: "Premium on CKT-LON only", fr: "Premium sur CKT-LON uniquement" } }
            - { id: sin, text: { en: "Premium on CKT-SIN only", fr: "Premium sur CKT-SIN uniquement" } }
            - { id: both, text: { en: "Premium on both circuits", fr: "Premium sur les deux circuits" } }
        - id: res
          options:
            - { id: auth, text: { en: "An authorization", fr: "Une autorisation" } }
            - { id: rf, text: { en: "A route filter", fr: "Un filtre de routage" } }
            - { id: conn, text: { en: "A connection to an ExpressRoute gateway", fr: "Une connexion à une passerelle ExpressRoute" } }
            - { id: msft, text: { en: "A Microsoft peering", fr: "Un peering Microsoft" } }
        - id: cfg
          options:
            - { id: onelon, text: { en: "One connection, added on CKT-LON, that references the private peering of CKT-SIN", fr: "Une connexion, ajoutée sur CKT-LON, qui référence le peering privé de CKT-SIN" } }
            - { id: two, text: { en: "Two connections, one added on each circuit", fr: "Deux connexions, une ajoutée sur chaque circuit" } }
            - { id: onesin, text: { en: "One connection, added on CKT-SIN, that references the private peering of CKT-LON", fr: "Une connexion, ajoutée sur CKT-SIN, qui référence le peering privé de CKT-LON" } }
    answer:
      values: { tier: both, res: auth, cfg: onelon }
    explanation:
      correct:
        en: |
          London and Singapore are in different geopolitical areas, and Global Reach between circuits of different geopolitical areas requires Premium on both circuits. Because the circuits are in different subscriptions, the owner of CKT-SIN creates an authorization and gives its key and the private peering ID of CKT-SIN to the EU team. A single Global Reach connection, added on CKT-LON with that key and a /29 subnet, connects both sites.
        fr: |
          Londres et Singapour sont dans des zones géopolitiques différentes, et Global Reach entre des circuits de zones géopolitiques différentes exige Premium sur les deux circuits. Comme les circuits sont dans des abonnements différents, le propriétaire de CKT-SIN crée une autorisation et transmet sa clé et l'ID du peering privé de CKT-SIN à l'équipe EU. Une seule connexion Global Reach, ajoutée sur CKT-LON avec cette clé et un sous-réseau /29, relie les deux sites.
      options:
        std: { en: "Standard is enough only when both circuits are in the same geopolitical area.", fr: "Standard ne suffit que si les deux circuits sont dans la même zone géopolitique." }
        rf: { en: "A route filter selects the Microsoft peering prefixes; Global Reach uses private peering.", fr: "Un filtre de routage sélectionne les préfixes du peering Microsoft ; Global Reach utilise le peering privé." }
        two: { en: "Global Reach is configured once, on one of the two circuits; the connection works in both directions.", fr: "Global Reach se configure une seule fois, sur l'un des deux circuits ; la connexion fonctionne dans les deux sens." }
        onesin: { en: "The EU team has no permissions in Sub-APAC, so it can't add the connection on CKT-SIN.", fr: "L'équipe EU n'a aucune autorisation dans Sub-APAC : elle ne peut pas ajouter la connexion sur CKT-SIN." }
    references:
      - title: "Azure ExpressRoute: Configure Global Reach"
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-set-global-reach
      - title: FAQ - Azure ExpressRoute
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-faqs
