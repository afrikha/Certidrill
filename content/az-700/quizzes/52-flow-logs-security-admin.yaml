chapter: 52-flow-logs-security-admin
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-52-01
    objective: "5.1.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has just created a subscription named **Sub2** for a new project. You plan to create the first virtual network flow log of Sub2 for a virtual network named **VNet-Proj**.

        Which resource provider must be registered in Sub2 so that the flow log can record the traffic of VNet-Proj?
      fr: |
        Fabrikam vient de créer un abonnement nommé **Sub2** pour un nouveau projet. Vous prévoyez de créer le premier journal de flux de réseau virtuel de Sub2 pour un réseau virtuel nommé **VNet-Proj**.

        Quel fournisseur de ressources doit être inscrit dans Sub2 pour que le journal de flux puisse enregistrer le trafic de VNet-Proj ?
    body:
      options:
        - { id: a, text: "Microsoft.OperationalInsights" }
        - { id: b, text: "Microsoft.Security" }
        - { id: c, text: "Microsoft.Insights" }
        - { id: d, text: "Microsoft.EventHub" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Virtual network flow logs need the **Microsoft.Insights** resource provider to be registered in the subscription to log the traffic of a virtual network. If its status is NotRegistered, register it from **Resource providers** in the subscription before creating the flow log.
        fr: |
          Les journaux de flux de réseau virtuel exigent que le fournisseur de ressources **Microsoft.Insights** soit inscrit dans l'abonnement pour journaliser le trafic d'un réseau virtuel. Si son état est NotRegistered, inscrivez-le depuis **Fournisseurs de ressources** dans l'abonnement avant de créer le journal de flux.
      options:
        a: { en: "Microsoft.OperationalInsights provides Log Analytics workspaces, used only if you add traffic analytics; it isn't what flow logging requires.", fr: "Microsoft.OperationalInsights fournit les espaces de travail Log Analytics, utilisés seulement si vous ajoutez traffic analytics ; ce n'est pas ce qu'exige la journalisation des flux." }
        b: { en: "Microsoft.Security is the provider of Microsoft Defender for Cloud, not of Network Watcher flow logs.", fr: "Microsoft.Security est le fournisseur de Microsoft Defender pour le cloud, pas celui des journaux de flux de Network Watcher." }
        d: { en: "Flow logs are written to a storage account; Event Hubs isn't a prerequisite of virtual network flow logs.", fr: "Les journaux de flux sont écrits dans un compte de stockage ; Event Hubs n'est pas un prérequis des journaux de flux de réseau virtuel." }
    references:
      - title: Manage Virtual Network Flow Logs - Azure Network Watcher
        url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-portal

  # ------------------------------------------------------------------ 2
  - id: az700-qz-52-02
    objective: "5.1.8"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Network Watcher is enabled for the West Europe region in a subscription named **Sub1**. A virtual machine named **VM-DB2** in West Europe has been stopped (deallocated) since a maintenance operation.

        You open **IP flow verify** to test inbound TCP 1433 to VM-DB2, but VM-DB2 isn't listed among the virtual machines that you can select.

        What should you do?
      fr: |
        Network Watcher est activé pour la région West Europe dans un abonnement nommé **Sub1**. Une machine virtuelle nommée **VM-DB2** de West Europe est arrêtée (désallouée) depuis une opération de maintenance.

        Vous ouvrez la **vérification des flux IP** pour tester TCP 1433 en entrée vers VM-DB2, mais VM-DB2 ne figure pas parmi les machines virtuelles que vous pouvez sélectionner.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Install the Network Watcher Agent extension on VM-DB2.", fr: "Installer l'extension Network Watcher Agent sur VM-DB2." } }
        - { id: b, text: { en: "Create a virtual network flow log for the subnet of VM-DB2.", fr: "Créer un journal de flux de réseau virtuel pour le sous-réseau de VM-DB2." } }
        - { id: c, text: { en: "Associate a network security group with the interface of VM-DB2.", fr: "Associer un groupe de sécurité réseau à l'interface de VM-DB2." } }
        - { id: d, text: { en: "Start VM-DB2, and then run the IP flow verify test again.", fr: "Démarrer VM-DB2, puis relancer le test de vérification des flux IP." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Stopped virtual machines can't be selected in IP flow verify: the virtual machine must be running. Once VM-DB2 runs, the test evaluates the security rules of its subnet and network interface (and the security admin rules of its virtual network) and names the rule that allows or denies the flow.
        fr: |
          Les machines virtuelles arrêtées ne peuvent pas être sélectionnées dans la vérification des flux IP : la machine virtuelle doit être en cours d'exécution. Une fois VM-DB2 démarrée, le test évalue les règles de sécurité de son sous-réseau et de son interface réseau (ainsi que les règles d'administration de sécurité de son réseau virtuel) et nomme la règle qui autorise ou refuse le flux.
      options:
        a: { en: "IP flow verify evaluates the rules configured in Azure; the agent extension doesn't make a stopped virtual machine selectable.", fr: "La vérification des flux IP évalue les règles configurées dans Azure ; l'extension d'agent ne rend pas sélectionnable une machine virtuelle arrêtée." }
        b: { en: "A flow log records past flows; it isn't a prerequisite of IP flow verify and doesn't change which virtual machines are listed.", fr: "Un journal de flux enregistre les flux passés ; ce n'est pas un prérequis de la vérification des flux IP, et il ne change pas les machines virtuelles listées." }
        c: { en: "The list of virtual machines doesn't depend on NSG associations; the missing virtual machine is the stopped one.", fr: "La liste des machines virtuelles ne dépend pas des associations de NSG ; la machine virtuelle absente est celle qui est arrêtée." }
    references:
      - title: "Quickstart: Diagnose a VM Traffic Filter Problem - Azure Portal - Azure Network Watcher"
        url: https://learn.microsoft.com/en-us/azure/network-watcher/diagnose-vm-network-traffic-filtering-problem

  # ------------------------------------------------------------------ 3
  - id: az700-qz-52-03
    objective: "5.1.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An Azure Bastion host named **bas-hub** is deployed to the **AzureBastionSubnet** subnet of a virtual network named **VNet-Hub**. A network security group named **NSG-Bastion** is associated with AzureBastionSubnet and contains all the rules that Bastion requires, including an inbound rule that allows TCP 443 from the Internet service tag.

        The security team requires that administrators can open sessions through bas-hub only from the public range of the head office, 198.51.100.0/24.

        What should you do?
      fr: |
        Un hôte Azure Bastion nommé **bas-hub** est déployé dans le sous-réseau **AzureBastionSubnet** d'un réseau virtuel nommé **VNet-Hub**. Un groupe de sécurité réseau nommé **NSG-Bastion** est associé à AzureBastionSubnet et contient toutes les règles requises par Bastion, dont une règle entrante qui autorise TCP 443 depuis l'étiquette de service Internet.

        L'équipe de sécurité exige que les administrateurs ne puissent ouvrir des sessions via bas-hub que depuis la plage publique du siège, 198.51.100.0/24.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In NSG-Bastion, change the source of the inbound TCP 443 rule from Internet to 198.51.100.0/24.", fr: "Dans NSG-Bastion, remplacer la source de la règle entrante TCP 443, Internet, par 198.51.100.0/24." } }
        - { id: b, text: { en: "In NSG-Bastion, add an inbound rule that allows TCP 3389 and 22 from 198.51.100.0/24 only.", fr: "Dans NSG-Bastion, ajouter une règle entrante qui autorise TCP 3389 et 22 depuis 198.51.100.0/24 uniquement." } }
        - { id: c, text: { en: "In NSG-Bastion, change the source of the GatewayManager TCP 443 rule to 198.51.100.0/24.", fr: "Dans NSG-Bastion, remplacer la source de la règle TCP 443 GatewayManager par 198.51.100.0/24." } }
        - { id: d, text: { en: "In the NSGs of the target subnets, allow TCP 3389 and 22 from 198.51.100.0/24 only.", fr: "Dans les NSG des sous-réseaux cibles, autoriser TCP 3389 et 22 depuis 198.51.100.0/24 uniquement." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Users reach Bastion over TLS on TCP 443, and the source of the inbound 443 rule of AzureBastionSubnet can be either the Internet service tag or specific public IP addresses. Replacing Internet with 198.51.100.0/24 limits sessions to the head office while the GatewayManager, AzureLoadBalancer and VirtualNetwork rules keep Bastion working.
        fr: |
          Les utilisateurs joignent Bastion en TLS sur TCP 443, et la source de la règle entrante 443 d'AzureBastionSubnet peut être l'étiquette de service Internet ou des adresses IP publiques précises. Remplacer Internet par 198.51.100.0/24 limite les sessions au siège, tandis que les règles GatewayManager, AzureLoadBalancer et VirtualNetwork maintiennent le fonctionnement de Bastion.
      options:
        b: { en: "Ports 3389 and 22 aren't used inbound on AzureBastionSubnet; the user sessions still arrive on 443 from any internet address.", fr: "Les ports 3389 et 22 ne sont pas utilisés en entrée sur AzureBastionSubnet ; les sessions des utilisateurs arrivent toujours sur 443 depuis n'importe quelle adresse Internet." }
        c: { en: "The GatewayManager rule carries the control plane traffic; restricting it breaks the management of bas-hub without restricting users.", fr: "La règle GatewayManager porte le trafic du plan de contrôle ; la restreindre casse la gestion de bas-hub sans restreindre les utilisateurs." }
        d: { en: "Sessions reach the target virtual machines from Bastion's private addresses, not from the users' public range, so these rules would block every session.", fr: "Les sessions arrivent sur les machines virtuelles cibles depuis les adresses privées de Bastion, pas depuis la plage publique des utilisateurs : ces règles bloqueraient toutes les sessions." }
    references:
      - title: Configure NSG rules for Azure Bastion
        url: https://learn.microsoft.com/en-us/azure/bastion/bastion-nsg

  # ------------------------------------------------------------------ 4
  - id: az700-qz-52-04
    objective: "5.1.10"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A network manager named **NM1** has a security admin configuration named **SAC1** that targets a network group named **NG-Prod**. SAC1 is deployed to the West Europe region and contains a Deny rule that blocks inbound TCP 22 and 3389 from the Internet service tag.

        You edit the rule in SAC1 to add TCP 5985, and you save the change. Two hours later, connections on TCP 5985 from the internet still reach the production virtual machines.

        What should you do?
      fr: |
        Un gestionnaire de réseau nommé **NM1** possède une configuration d'administration de sécurité nommée **SAC1** qui cible un groupe réseau nommé **NG-Prod**. SAC1 est déployée dans la région West Europe et contient une règle Deny qui bloque en entrée TCP 22 et 3389 depuis l'étiquette de service Internet.

        Vous modifiez la règle dans SAC1 pour ajouter TCP 5985, puis vous enregistrez la modification. Deux heures plus tard, des connexions sur TCP 5985 depuis Internet atteignent toujours les machines virtuelles de production.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Wait up to 24 hours for Azure Policy to evaluate the membership of NG-Prod again.", fr: "Attendre jusqu'à 24 heures qu'Azure Policy réévalue l'appartenance à NG-Prod." } }
        - { id: b, text: { en: "Deploy SAC1 again to the West Europe region.", fr: "Déployer de nouveau SAC1 dans la région West Europe." } }
        - { id: c, text: { en: "Create a second security admin configuration for TCP 5985, and deploy it to West Europe.", fr: "Créer une seconde configuration d'administration de sécurité pour TCP 5985, puis la déployer dans West Europe." } }
        - { id: d, text: { en: "Remove the virtual networks from NG-Prod, and then add them again.", fr: "Retirer les réseaux virtuels de NG-Prod, puis les ajouter de nouveau." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Virtual Network Manager configurations take effect only when they are deployed: a deployment sets the goal state of a region, and a modified configuration must be deployed again for its changes to apply. Redeploying SAC1 to West Europe pushes the updated Deny rule to the virtual networks of NG-Prod.
        fr: |
          Les configurations de Virtual Network Manager ne prennent effet qu'une fois déployées : un déploiement fixe l'état cible d'une région, et une configuration modifiée doit être de nouveau déployée pour que ses changements s'appliquent. Redéployer SAC1 dans West Europe envoie la règle Deny mise à jour aux réseaux virtuels de NG-Prod.
      options:
        a: { en: "Azure Policy evaluates dynamic membership conditions; the membership of NG-Prod hasn't changed, only the rule has.", fr: "Azure Policy évalue les conditions d'appartenance dynamique ; l'appartenance à NG-Prod n'a pas changé, seule la règle a changé." }
        c: { en: "Only one security admin configuration of a network manager can be deployed to a region at a time; add the port to SAC1 instead.", fr: "Une seule configuration d'administration de sécurité d'un gestionnaire de réseau peut être déployée dans une région à la fois ; ajoutez plutôt le port à SAC1." }
        d: { en: "New members receive the configuration that is currently deployed, which is still the version without TCP 5985.", fr: "Les nouveaux membres reçoivent la configuration actuellement déployée, qui reste la version sans TCP 5985." }
    references:
      - title: Manage configuration deployments in Azure Virtual Network Manager
        url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-deployments

  # ------------------------------------------------------------------ 5
  - id: az700-qz-52-05
    objective: "5.1.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A virtual machine named **VM1** (10.1.2.4) uses a DNS server that runs on a virtual machine at 10.0.0.4. Users report that name resolution on VM1 fails. A virtual network flow log records the traffic of the subnet of VM1.

        Which flow tuple shows that a security rule blocked a DNS query that VM1 sent over UDP?
      fr: |
        Une machine virtuelle nommée **VM1** (10.1.2.4) utilise un serveur DNS exécuté sur une machine virtuelle à l'adresse 10.0.0.4. Des utilisateurs signalent que la résolution de noms échoue sur VM1. Un journal de flux de réseau virtuel enregistre le trafic du sous-réseau de VM1.

        Quel tuple de flux montre qu'une règle de sécurité a bloqué une requête DNS envoyée par VM1 en UDP ?
    body:
      options:
        - { id: a, text: "`1763390400,10.0.0.4,10.1.2.4,53,53012,17,I,D,NX,0,0,0,0`" }
        - { id: b, text: "`1763390400,10.1.2.4,10.0.0.4,53012,53,6,O,D,NX,0,0,0,0`" }
        - { id: c, text: "`1763390400,10.1.2.4,10.0.0.4,53012,53,17,O,D,NX,0,0,0,0`" }
        - { id: d, text: "`1763390400,10.1.2.4,10.0.0.4,53012,53,17,O,E,NX,1,74,1,130`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A version 2 tuple lists the time stamp, source and destination IP addresses, source and destination ports, protocol, direction, flow state, encryption and counters. Tuple c goes from 10.1.2.4 to port 53 of 10.0.0.4, uses protocol 17 (UDP), is outbound (`O`) and has the state `D` (denied), with zero counters.
        fr: |
          Un tuple version 2 indique l'horodatage, les adresses IP source et de destination, les ports source et de destination, le protocole, la direction, l'état du flux, le chiffrement et les compteurs. Le tuple c va de 10.1.2.4 vers le port 53 de 10.0.0.4, utilise le protocole 17 (UDP), est sortant (`O`) et a l'état `D` (refusé), avec des compteurs à zéro.
      options:
        a: { en: "This tuple is an inbound flow sent by 10.0.0.4 from port 53 to VM1, not a query that VM1 sent.", fr: "Ce tuple est un flux entrant envoyé par 10.0.0.4 depuis le port 53 vers VM1, pas une requête envoyée par VM1." }
        b: { en: "Protocol 6 is TCP; the question asks for a query sent over UDP (protocol 17).", fr: "Le protocole 6 est TCP ; la question porte sur une requête envoyée en UDP (protocole 17)." }
        d: { en: "The state `E` marks the end of an allowed flow, with packets and bytes exchanged; it wasn't blocked.", fr: "L'état `E` marque la fin d'un flux autorisé, avec des paquets et des octets échangés ; il n'a pas été bloqué." }
    references:
      - title: Virtual Network Flow Logs - Azure Network Watcher
        url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview

  # ------------------------------------------------------------------ 6
  - id: az700-qz-52-06
    objective: "5.1.6"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has a subscription named **Sub1** that contains 45 virtual networks in the West Europe region and 20 virtual networks in the North Europe region. Application teams create new virtual networks every week. Network Watcher is enabled in both regions. Sub1 contains the following storage accounts.

        | Name | Region | Performance | Account kind |
        | --- | --- | --- | --- |
        | stflweu | West Europe | Standard | General-purpose v2 |
        | stflneu | North Europe | Standard | General-purpose v2 |

        You need to ensure that every virtual network of Sub1, existing or future, has a virtual network flow log with a retention of 30 days. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Contoso dispose d'un abonnement nommé **Sub1** qui contient 45 réseaux virtuels dans la région West Europe et 20 réseaux virtuels dans la région North Europe. Les équipes d'application créent de nouveaux réseaux virtuels chaque semaine. Network Watcher est activé dans les deux régions. Sub1 contient les comptes de stockage suivants.

        | Nom | Région | Performance | Type de compte |
        | --- | --- | --- | --- |
        | stflweu | West Europe | Standard | Usage général v2 |
        | stflneu | North Europe | Standard | Usage général v2 |

        Vous devez faire en sorte que chaque réseau virtuel de Sub1, existant ou futur, dispose d'un journal de flux de réseau virtuel avec une rétention de 30 jours. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign the Deploy a flow log resource with target virtual network policy once to Sub1 with stflweu, and create a remediation task.", fr: "Attribuer la stratégie Deploy a flow log resource with target virtual network une seule fois à Sub1 avec stflweu, et créer une tâche de correction." } }
        - { id: b, text: { en: "Assign the Audit flow logs configuration for every virtual network policy to Sub1, and create a remediation task.", fr: "Attribuer la stratégie Audit flow logs configuration for every virtual network à Sub1, et créer une tâche de correction." } }
        - { id: c, text: { en: "Assign the Deploy a flow log resource with target virtual network policy once per region with that region's account, without a remediation task.", fr: "Attribuer la stratégie Deploy a flow log resource with target virtual network une fois par région avec le compte de cette région, sans tâche de correction." } }
        - { id: d, text: { en: "Assign the Deploy a flow log resource with target virtual network policy once per region with that region's account, and create a remediation task.", fr: "Attribuer la stratégie Deploy a flow log resource with target virtual network une fois par région avec le compte de cette région, et créer une tâche de correction." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The DeployIfNotExists policy creates flow logs for virtual networks that don't have one. Each assignment takes one virtual network region, the Network Watcher of that region and a storage account in the same region as the virtual networks, so you need one assignment per region. A remediation task deploys flow logs to the 65 existing virtual networks; new ones are handled when they're created.
        fr: |
          La stratégie DeployIfNotExists crée des journaux de flux pour les réseaux virtuels qui n'en ont pas. Chaque attribution prend une région de réseaux virtuels, le Network Watcher de cette région et un compte de stockage situé dans la même région que les réseaux virtuels : il faut donc une attribution par région. Une tâche de correction déploie les journaux de flux sur les 65 réseaux virtuels existants ; les nouveaux sont traités lors de leur création.
      options:
        a: { en: "The storage account of a flow log must be in the region of the virtual network: stflweu can't serve the North Europe virtual networks.", fr: "Le compte de stockage d'un journal de flux doit être dans la région du réseau virtuel : stflweu ne peut pas servir les réseaux virtuels de North Europe." }
        b: { en: "The audit policy only reports virtual networks without flow logs; it has no deployment, so a remediation task can't create flow logs.", fr: "La stratégie d'audit signale seulement les réseaux virtuels sans journal de flux ; elle ne déploie rien, donc une tâche de correction ne peut pas créer de journaux de flux." }
        c: { en: "Without a remediation task, the 65 existing virtual networks stay noncompliant: the policy acts on resources when they're created or updated.", fr: "Sans tâche de correction, les 65 réseaux virtuels existants restent non conformes : la stratégie agit sur les ressources lors de leur création ou de leur mise à jour." }
    references:
      - title: Audit and Deploy Virtual Network Flow Logs Using Azure Policy - Azure Network Watcher
        url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-policy
      - title: Virtual Network Flow Logs - Azure Network Watcher
        url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview

  # ------------------------------------------------------------------ 7
  - id: az700-qz-52-07
    objective: "5.1.7"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        A virtual machine named **VM-App1** (10.1.1.4) is connected to a subnet of a virtual network named **VNet-App**. A network security group named **NSG-App** is associated with the subnet, and Azure Virtual Network Manager deploys a security admin configuration named **SAC-Prod** to VNet-App. Virtual network encryption is enabled on VNet-App and on the peered virtual network **VNet-Data** (10.2.0.0/16).

        The virtual network flow log of VNet-App contains the following extract for the network interface of VM-App1.

        ```json
        "flows": [
          {
            "aclID": "<resource ID of SAC-Prod>",
            "flowGroups": [
              {
                "rule": "Allow-Monitoring-Hub",
                "flowTuples": [
                  "1763390000,10.100.0.10,10.1.1.4,51544,5986,6,I,B,NX,0,0,0,0"
                ]
              }
            ]
          },
          {
            "aclID": "<resource ID of NSG-App>",
            "flowGroups": [
              {
                "rule": "UserRule_Allow-Sql-Out",
                "flowTuples": [
                  "1763390030,10.1.1.4,10.2.1.5,49822,1433,6,O,B,X,0,0,0,0",
                  "1763390090,10.1.1.4,10.2.1.5,49822,1433,6,O,E,X,25,4200,30,61000"
                ]
              },
              {
                "rule": "DefaultRule_AllowInternetOutBound",
                "flowTuples": [
                  "1763390050,10.1.1.4,198.51.100.25,49830,443,6,O,B,NX,0,0,0,0"
                ]
              }
            ]
          }
        ]
        ```

        Use the drop-down menus to complete the statements based on the extract.

        NOTE: Each correct selection is worth one point.
      fr: |
        Une machine virtuelle nommée **VM-App1** (10.1.1.4) est connectée à un sous-réseau d'un réseau virtuel nommé **VNet-App**. Un groupe de sécurité réseau nommé **NSG-App** est associé au sous-réseau, et Azure Virtual Network Manager déploie une configuration d'administration de sécurité nommée **SAC-Prod** sur VNet-App. Le chiffrement de réseau virtuel est activé sur VNet-App et sur le réseau virtuel relié par peering **VNet-Data** (10.2.0.0/16).

        Le journal de flux de réseau virtuel de VNet-App contient l'extrait suivant pour l'interface réseau de VM-App1.

        ```json
        "flows": [
          {
            "aclID": "<resource ID of SAC-Prod>",
            "flowGroups": [
              {
                "rule": "Allow-Monitoring-Hub",
                "flowTuples": [
                  "1763390000,10.100.0.10,10.1.1.4,51544,5986,6,I,B,NX,0,0,0,0"
                ]
              }
            ]
          },
          {
            "aclID": "<resource ID of NSG-App>",
            "flowGroups": [
              {
                "rule": "UserRule_Allow-Sql-Out",
                "flowTuples": [
                  "1763390030,10.1.1.4,10.2.1.5,49822,1433,6,O,B,X,0,0,0,0",
                  "1763390090,10.1.1.4,10.2.1.5,49822,1433,6,O,E,X,25,4200,30,61000"
                ]
              },
              {
                "rule": "DefaultRule_AllowInternetOutBound",
                "flowTuples": [
                  "1763390050,10.1.1.4,198.51.100.25,49830,443,6,O,B,NX,0,0,0,0"
                ]
              }
            ]
          }
        ]
        ```

        Utilisez les menus déroulants pour compléter les affirmations à partir de l'extrait.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          The connection from 10.100.0.10 on TCP 5986 was allowed by [[monitor]].

          The connection to 10.2.1.5 on TCP 1433 was [[sql]].

          The connection to 198.51.100.25 on TCP 443 was [[web]].
        fr: |
          La connexion depuis 10.100.0.10 sur TCP 5986 a été autorisée par [[monitor]].

          La connexion vers 10.2.1.5 sur TCP 1433 a été [[sql]].

          La connexion vers 198.51.100.25 sur TCP 443 a été [[web]].
      slots:
        - id: monitor
          options:
            - { id: admin, text: { en: "a security admin rule of Virtual Network Manager", fr: "une règle d'administration de sécurité de Virtual Network Manager" } }
            - { id: nsguser, text: { en: "a user-defined rule of NSG-App", fr: "une règle définie par l'utilisateur de NSG-App" } }
            - { id: nsgdef, text: { en: "the AllowVnetInBound default rule of NSG-App", fr: "la règle par défaut AllowVnetInBound de NSG-App" } }
            - { id: platform, text: { en: "a platform rule of Azure", fr: "une règle de plateforme d'Azure" } }
        - id: sql
          options:
            - { id: inenc, text: { en: "opened by 10.2.1.5 and encrypted by the platform", fr: "ouverte par 10.2.1.5 et chiffrée par la plateforme" } }
            - { id: outenc, text: { en: "opened by VM-App1 and encrypted by the platform", fr: "ouverte par VM-App1 et chiffrée par la plateforme" } }
            - { id: outclear, text: { en: "opened by VM-App1 and left unencrypted", fr: "ouverte par VM-App1 et laissée non chiffrée" } }
        - id: web
          options:
            - { id: alloweddef, text: { en: "allowed by a default rule of NSG-App", fr: "autorisée par une règle par défaut de NSG-App" } }
            - { id: denieddef, text: { en: "denied by a default rule of NSG-App", fr: "refusée par une règle par défaut de NSG-App" } }
            - { id: allowedadmin, text: { en: "allowed by a security admin rule", fr: "autorisée par une règle d'administration de sécurité" } }
    answer:
      values: { monitor: admin, sql: outenc, web: alloweddef }
    explanation:
      correct:
        en: |
          Each `flows` entry is identified by the `aclID` of the resource that evaluated the traffic, an NSG or Virtual Network Manager: the monitoring flow sits under SAC-Prod, so a security admin rule decided it. The SQL tuples go from 10.1.1.4 to port 1433 with direction `O` (VM-App1 opened the connection) and the encryption field `X` (encrypted). The HTTPS flow has the state `B` in the flow group `DefaultRule_AllowInternetOutBound`, a default rule of NSG-App that allowed it.
        fr: |
          Chaque entrée `flows` est identifiée par l'`aclID` de la ressource qui a évalué le trafic, un NSG ou Virtual Network Manager : le flux de supervision se trouve sous SAC-Prod, c'est donc une règle d'administration de sécurité qui l'a traité. Les tuples SQL vont de 10.1.1.4 vers le port 1433 avec la direction `O` (VM-App1 a ouvert la connexion) et le champ de chiffrement `X` (chiffrée). Le flux HTTPS a l'état `B` dans le groupe de flux `DefaultRule_AllowInternetOutBound`, une règle par défaut de NSG-App qui l'a autorisé.
      options:
        nsguser: { en: "NSG rules appear under the aclID of NSG-App with the prefix UserRule_ or DefaultRule_; this flow group belongs to SAC-Prod.", fr: "Les règles NSG apparaissent sous l'aclID de NSG-App avec le préfixe UserRule_ ou DefaultRule_ ; ce groupe de flux appartient à SAC-Prod." }
        platform: { en: "A platform rule marks traffic that the platform processes without a configured rule; here a configured security admin rule is named.", fr: "Une règle de plateforme signale un trafic traité par la plateforme sans règle configurée ; ici, une règle d'administration de sécurité configurée est nommée." }
        outclear: { en: "`NX` would mean unencrypted; the SQL tuples carry `X`, so the platform encrypted the connection.", fr: "`NX` signifierait non chiffré ; les tuples SQL portent `X`, donc la plateforme a chiffré la connexion." }
        denieddef: { en: "A denied flow has the state `D`; this tuple has the state `B` (begin).", fr: "Un flux refusé a l'état `D` ; ce tuple a l'état `B` (début)." }
    references:
      - title: Virtual Network Flow Logs - Azure Network Watcher
        url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview

  # ------------------------------------------------------------------ 8
  - id: az700-qz-52-08
    objective: "5.1.9"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin has an Azure Bastion host that uses the Standard SKU, deployed to **AzureBastionSubnet** (10.0.254.0/26) in a virtual network named **VNet-Hub**. A network security group named **NSG-Bastion** is associated with AzureBastionSubnet. NSG-Bastion contains the rules that Bastion requires for the default RDP and SSH ports, and an outbound rule with priority 4000 that denies all other traffic.

        A peered virtual network named **VNet-App** contains a subnet named **Subnet-Linux** associated with a network security group named **NSG-Linux**. NSG-Linux contains the following inbound rules.

        | Priority | Source | Port | Access |
        | --- | --- | --- | --- |
        | 100 | 10.0.254.0/26 | TCP 22 | Allow |
        | 4000 | Any | Any | Deny |

        For security reasons, the SSH daemon of the Linux virtual machines in Subnet-Linux now listens only on TCP 2222. Administrators will connect through Bastion by using the custom port feature with port 2222.

        Which two changes should you make? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin dispose d'un hôte Azure Bastion de référence SKU Standard, déployé dans **AzureBastionSubnet** (10.0.254.0/26) d'un réseau virtuel nommé **VNet-Hub**. Un groupe de sécurité réseau nommé **NSG-Bastion** est associé à AzureBastionSubnet. NSG-Bastion contient les règles requises par Bastion pour les ports RDP et SSH par défaut, ainsi qu'une règle sortante de priorité 4000 qui refuse tout autre trafic.

        Un réseau virtuel relié par peering, nommé **VNet-App**, contient un sous-réseau nommé **Subnet-Linux** associé à un groupe de sécurité réseau nommé **NSG-Linux**. NSG-Linux contient les règles entrantes suivantes.

        | Priorité | Source | Port | Accès |
        | --- | --- | --- | --- |
        | 100 | 10.0.254.0/26 | TCP 22 | Allow |
        | 4000 | Any | Any | Deny |

        Pour des raisons de sécurité, le démon SSH des machines virtuelles Linux de Subnet-Linux n'écoute plus que sur TCP 2222. Les administrateurs se connecteront via Bastion en utilisant la fonctionnalité de port personnalisé avec le port 2222.

        Quelles sont les deux modifications à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "In NSG-Linux, add an inbound rule that allows TCP 2222 from 10.0.254.0/26.", fr: "Dans NSG-Linux, ajouter une règle entrante qui autorise TCP 2222 depuis 10.0.254.0/26." } }
        - { id: b, text: { en: "In NSG-Linux, add an inbound rule that allows TCP 2222 from GatewayManager.", fr: "Dans NSG-Linux, ajouter une règle entrante qui autorise TCP 2222 depuis GatewayManager." } }
        - { id: c, text: { en: "In NSG-Bastion, add an inbound rule that allows TCP 2222 from Internet.", fr: "Dans NSG-Bastion, ajouter une règle entrante qui autorise TCP 2222 depuis Internet." } }
        - { id: d, text: { en: "In NSG-Bastion, add an outbound rule that allows TCP 2222 to VirtualNetwork.", fr: "Dans NSG-Bastion, ajouter une règle sortante qui autorise TCP 2222 vers VirtualNetwork." } }
        - { id: e, text: { en: "In NSG-Linux, add an inbound rule that allows TCP 443 from 10.0.254.0/26.", fr: "Dans NSG-Linux, ajouter une règle entrante qui autorise TCP 443 depuis 10.0.254.0/26." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          With the custom port feature, the target subnet must allow the custom port inbound from the AzureBastionSubnet range, and the Bastion subnet must allow its egress to the VirtualNetwork service tag on that port: the existing rules cover only 22 and 3389, and both NSGs end with a Deny rule at 4000. Users still reach Bastion on TCP 443, so nothing changes on the inbound side of NSG-Bastion.
        fr: |
          Avec la fonctionnalité de port personnalisé, le sous-réseau cible doit autoriser en entrée le port personnalisé depuis la plage d'AzureBastionSubnet, et le sous-réseau Bastion doit autoriser sa sortie vers l'étiquette de service VirtualNetwork sur ce port : les règles existantes ne couvrent que 22 et 3389, et les deux NSG se terminent par une règle Deny à 4000. Les utilisateurs joignent toujours Bastion sur TCP 443 : rien ne change côté entrant de NSG-Bastion.
      options:
        b: { en: "GatewayManager carries Bastion's control plane traffic to AzureBastionSubnet; sessions reach the virtual machines from the Bastion subnet's private addresses.", fr: "GatewayManager porte le trafic du plan de contrôle de Bastion vers AzureBastionSubnet ; les sessions arrivent sur les machines virtuelles depuis les adresses privées du sous-réseau Bastion." }
        c: { en: "Users connect to Bastion over TCP 443 whatever the port of the target virtual machine; the custom port is used only between Bastion and the virtual machine.", fr: "Les utilisateurs se connectent à Bastion sur TCP 443 quel que soit le port de la machine virtuelle cible ; le port personnalisé n'est utilisé qu'entre Bastion et la machine virtuelle." }
        e: { en: "Bastion opens the session to the virtual machine on its SSH port (2222 here), not on 443.", fr: "Bastion ouvre la session vers la machine virtuelle sur son port SSH (ici 2222), pas sur 443." }
    references:
      - title: Configure NSG rules for Azure Bastion
        url: https://learn.microsoft.com/en-us/azure/bastion/bastion-nsg

  # ------------------------------------------------------------------ 9
  - id: az700-qz-52-09
    objective: "5.1.10"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        A network manager named **NM1** deploys to the West Europe region a security admin configuration with the default settings. Its only rule collection targets a network group named **NG-All** and contains one inbound rule.

        | Priority | Action | Source | Destination ports |
        | --- | --- | --- | --- |
        | 100 | Deny | Internet (service tag) | TCP 443, 3389 |

        NG-All contains the following virtual networks.

        | Virtual network | Subnets |
        | --- | --- |
        | VNet-Hub | AzureBastionSubnet (Azure Bastion, Standard SKU), GatewaySubnet (VPN gateway), snet-web (web servers that have public IP addresses) |
        | VNet-Data | snet-mi (Azure SQL Managed Instance), snet-app (virtual machines that have public IP addresses) |

        The network security group of snet-web allows inbound TCP 443 from the Internet service tag.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un gestionnaire de réseau nommé **NM1** déploie dans la région West Europe une configuration d'administration de sécurité avec les paramètres par défaut. Son unique regroupement de règles cible un groupe réseau nommé **NG-All** et contient une règle entrante.

        | Priorité | Action | Source | Ports de destination |
        | --- | --- | --- | --- |
        | 100 | Deny | Internet (étiquette de service) | TCP 443, 3389 |

        NG-All contient les réseaux virtuels suivants.

        | Réseau virtuel | Sous-réseaux |
        | --- | --- |
        | VNet-Hub | AzureBastionSubnet (Azure Bastion, référence SKU Standard), GatewaySubnet (passerelle VPN), snet-web (serveurs web dotés d'adresses IP publiques) |
        | VNet-Data | snet-mi (Azure SQL Managed Instance), snet-app (machines virtuelles dotées d'adresses IP publiques) |

        Le groupe de sécurité réseau de snet-web autorise en entrée TCP 443 depuis l'étiquette de service Internet.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Administrators can still open sessions from the internet to the Bastion host of VNet-Hub over TCP 443.", fr: "Les administrateurs peuvent toujours ouvrir des sessions depuis Internet vers l'hôte Bastion de VNet-Hub sur TCP 443." } }
        - { id: s2, text: { en: "Clients on the internet can reach the web servers of snet-web over TCP 443, because their network security group allows it.", fr: "Les clients sur Internet peuvent joindre les serveurs web de snet-web sur TCP 443, car leur groupe de sécurité réseau l'autorise." } }
        - { id: s3, text: { en: "The rule blocks inbound TCP 3389 from the internet to the virtual machines of snet-app.", fr: "La règle bloque en entrée TCP 3389 depuis Internet vers les machines virtuelles de snet-app." } }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Security admin rules don't affect the subnets of Azure Bastion, VPN Gateway, Azure Firewall and the other listed services, so the Bastion host still accepts TCP 443 (Yes). In snet-web, the Deny admin rule is evaluated before NSGs and ends the evaluation, so the NSG allow rule is never reached (No). By default, security admin rules aren't applied to a virtual network that contains Azure SQL Managed Instance, so VNet-Data isn't protected by this rule (No).
        fr: |
          Les règles d'administration de sécurité n'affectent pas les sous-réseaux d'Azure Bastion, de VPN Gateway, du Pare-feu Azure et des autres services listés : l'hôte Bastion accepte donc toujours TCP 443 (Oui). Dans snet-web, la règle d'administration Deny est évaluée avant les NSG et met fin à l'évaluation : la règle d'autorisation du NSG n'est jamais atteinte (Non). Par défaut, les règles d'administration de sécurité ne sont pas appliquées à un réseau virtuel qui contient Azure SQL Managed Instance : VNet-Data n'est donc pas protégé par cette règle (Non).
      options:
        s2: { en: "Deny and Always Allow are final: NSGs can only further restrict traffic that an Allow admin rule let through.", fr: "Deny et Always Allow sont définitifs : les NSG ne peuvent que restreindre davantage un trafic qu'une règle d'administration Allow a laissé passer." }
        s3: { en: "With the default settings, a virtual network that contains SQL Managed Instance doesn't receive the rules; only the AllowRulesOnly option applies Allow rules there, never Deny rules.", fr: "Avec les paramètres par défaut, un réseau virtuel qui contient SQL Managed Instance ne reçoit pas les règles ; seule l'option AllowRulesOnly y applique les règles Allow, jamais les règles Deny." }
    references:
      - title: Security admin rules in Azure Virtual Network Manager
        url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins

  # ------------------------------------------------------------------ 10
  - id: az700-qz-52-10
    objective: "5.1.8"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum has the following configuration:

        - A virtual machine named **VM-DB1** (10.1.3.4) is connected to a subnet named **Subnet-Data** in a virtual network named **VNet1**. A route table associated with Subnet-Data sends 10.2.0.0/16 to an Azure Firewall in a hub.
        - A virtual machine named **VM-App2** (10.2.1.4) is in a virtual network named **VNet2**, which is peered with VNet1.
        - Azure Virtual Network Manager deploys to VNet1 a security admin rule named **AllowSqlSpokes**: priority 10, action **Allow**, inbound, source 10.2.0.0/16, TCP 1433.

        The network security groups contain the following inbound rules in addition to the default rules.

        | NSG | Associated with | Priority | Name | Source | Port | Access |
        | --- | --- | --- | --- | --- | --- | --- |
        | NSG-Data | Subnet-Data | 100 | Allow-Sql-VNet | VirtualNetwork | TCP 1433 | Allow |
        | NSG-DB1 | Network interface of VM-DB1 | 200 | Deny-Sql-Spoke2 | 10.2.1.0/24 | TCP 1433 | Deny |

        You run IP flow verify for VM-DB1 with the following settings: direction **Inbound**, protocol **TCP**, local port **1433**, remote IP address **10.2.1.4**, remote port **50000**.

        What is the result of the test?
      fr: |
        Adatum dispose de la configuration suivante :

        - Une machine virtuelle nommée **VM-DB1** (10.1.3.4) est connectée à un sous-réseau nommé **Subnet-Data** d'un réseau virtuel nommé **VNet1**. Une table de routage associée à Subnet-Data envoie 10.2.0.0/16 vers un Pare-feu Azure situé dans un hub.
        - Une machine virtuelle nommée **VM-App2** (10.2.1.4) se trouve dans un réseau virtuel nommé **VNet2**, relié par peering à VNet1.
        - Azure Virtual Network Manager déploie sur VNet1 une règle d'administration de sécurité nommée **AllowSqlSpokes** : priorité 10, action **Allow**, entrante, source 10.2.0.0/16, TCP 1433.

        Les groupes de sécurité réseau contiennent les règles entrantes suivantes en plus des règles par défaut.

        | NSG | Associé à | Priorité | Nom | Source | Port | Accès |
        | --- | --- | --- | --- | --- | --- | --- |
        | NSG-Data | Subnet-Data | 100 | Allow-Sql-VNet | VirtualNetwork | TCP 1433 | Allow |
        | NSG-DB1 | Interface réseau de VM-DB1 | 200 | Deny-Sql-Spoke2 | 10.2.1.0/24 | TCP 1433 | Deny |

        Vous exécutez la vérification des flux IP pour VM-DB1 avec les paramètres suivants : direction **Inbound**, protocole **TCP**, port local **1433**, adresse IP distante **10.2.1.4**, port distant **50000**.

        Quel est le résultat du test ?
    body:
      options:
        - { id: a, text: { en: "Access allowed, by the AllowSqlSpokes security admin rule", fr: "Accès autorisé, par la règle d'administration de sécurité AllowSqlSpokes" } }
        - { id: b, text: { en: "Access allowed, by the Allow-Sql-VNet rule of NSG-Data", fr: "Accès autorisé, par la règle Allow-Sql-VNet de NSG-Data" } }
        - { id: c, text: { en: "Access denied, by the Deny-Sql-Spoke2 rule of NSG-DB1", fr: "Accès refusé, par la règle Deny-Sql-Spoke2 de NSG-DB1" } }
        - { id: d, text: { en: "Access denied, by the DenyAllInBound rule of NSG-DB1", fr: "Accès refusé, par la règle DenyAllInBound de NSG-DB1" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          IP flow verify evaluates the Virtual Network Manager rules of the virtual network and the NSGs of the subnet and the network interface, but not routing, so the route to the firewall doesn't change the answer. An **Allow** admin rule doesn't end the evaluation: NSG-Data (subnet, evaluated first inbound) allows the flow with Allow-Sql-VNet, then NSG-DB1 denies it with Deny-Sql-Spoke2, which IP flow verify names.
        fr: |
          La vérification des flux IP évalue les règles Virtual Network Manager du réseau virtuel et les NSG du sous-réseau et de l'interface réseau, mais pas le routage : l'itinéraire vers le pare-feu ne change donc pas la réponse. Une règle d'administration **Allow** ne termine pas l'évaluation : NSG-Data (sous-réseau, évalué en premier en entrée) autorise le flux avec Allow-Sql-VNet, puis NSG-DB1 le refuse avec Deny-Sql-Spoke2, que la vérification des flux IP nomme.
      options:
        a: { en: "Only Always Allow and Deny admin rules end the evaluation; an Allow admin rule passes the traffic on to the NSGs.", fr: "Seules les règles d'administration Always Allow et Deny terminent l'évaluation ; une règle d'administration Allow transmet le trafic aux NSG." }
        b: { en: "Traffic must be allowed by both the subnet NSG and the interface NSG; NSG-DB1 is still evaluated after NSG-Data.", fr: "Le trafic doit être autorisé à la fois par le NSG du sous-réseau et par celui de l'interface ; NSG-DB1 est encore évalué après NSG-Data." }
        d: { en: "Deny-Sql-Spoke2 (200) matches 10.2.1.4 on TCP 1433 before the default rules of NSG-DB1 are reached.", fr: "Deny-Sql-Spoke2 (200) correspond à 10.2.1.4 sur TCP 1433 avant que les règles par défaut de NSG-DB1 soient atteintes." }
    references:
      - title: IP Flow Verify Overview - Azure Network Watcher
        url: https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview
      - title: Security admin rules in Azure Virtual Network Manager
        url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins
