chapter: 14-vnet-connectivity
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-14-01
    objective: "1.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Proseware has two virtual networks in the same subscription: **VNet-A** (10.1.0.0/16) and **VNet-B** (10.1.128.0/17). When you try to peer them, the operation fails.

        What is the cause of the failure?
      fr: |
        Proseware dispose de deux réseaux virtuels dans le même abonnement : **VNet-A** (10.1.0.0/16) et **VNet-B** (10.1.128.0/17). Quand vous essayez de les relier par peering, l'opération échoue.

        Quelle est la cause de l'échec ?
    body:
      options:
        - { id: a, text: { en: "The address spaces of the two virtual networks overlap.", fr: "Les espaces d'adressage des deux réseaux virtuels se chevauchent." } }
        - { id: b, text: { en: "The address spaces of the two virtual networks have different prefix lengths.", fr: "Les espaces d'adressage des deux réseaux virtuels ont des longueurs de préfixe différentes." } }
        - { id: c, text: { en: "Neither virtual network contains a virtual network gateway.", fr: "Aucun des deux réseaux virtuels ne contient de passerelle de réseau virtuel." } }
        - { id: d, text: { en: "The two virtual networks must first be moved to different subscriptions.", fr: "Les deux réseaux virtuels doivent d'abord être déplacés dans des abonnements différents." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Peered virtual networks must have nonoverlapping address spaces. 10.1.128.0/17 is contained in 10.1.0.0/16, so Azure can't route between the two networks and refuses the peering. Change the address space of one of them first.
        fr: |
          Des réseaux virtuels reliés par peering doivent avoir des espaces d'adressage qui ne se chevauchent pas. 10.1.128.0/17 est contenu dans 10.1.0.0/16 : Azure ne peut pas router entre les deux réseaux et refuse le peering. Modifiez d'abord l'espace d'adressage de l'un d'eux.
      options:
        b: { en: "Peered networks can use any prefix lengths; only an overlap between the ranges blocks the peering.", fr: "Des réseaux reliés par peering peuvent utiliser n'importe quelles longueurs de préfixe ; seul un chevauchement des plages bloque le peering." }
        c: { en: "Peering uses the Microsoft backbone directly and needs no gateway; a gateway is needed only for gateway transit.", fr: "Le peering utilise directement le réseau principal de Microsoft et n'exige aucune passerelle ; une passerelle n'est nécessaire que pour le transit par passerelle." }
        d: { en: "Peering works within one subscription as well as across subscriptions and tenants.", fr: "Le peering fonctionne au sein d'un même abonnement comme entre abonnements et locataires." }
    references:
      - title: Create, change, or delete Azure virtual network peering
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering

  # ------------------------------------------------------------------ 2
  - id: az700-qz-14-02
    objective: "1.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has two virtual networks, **VNet1** and **VNet2**, in different regions. Each one contains a VPN gateway, and the gateways are connected by a VNet-to-VNet connection. You now also peer VNet1 and VNet2, and both peering links show **Connected**.

        Which path does the traffic between the virtual machines of VNet1 and VNet2 use?
      fr: |
        Fabrikam dispose de deux réseaux virtuels, **VNet1** et **VNet2**, dans des régions différentes. Chacun contient une passerelle VPN, et les passerelles sont reliées par une connexion de réseau virtuel à réseau virtuel. Vous reliez maintenant aussi VNet1 et VNet2 par peering, et les deux liens de peering affichent **Connecté**.

        Quel chemin le trafic entre les machines virtuelles de VNet1 et de VNet2 emprunte-t-il ?
    body:
      options:
        - { id: a, text: { en: "The VNet-to-VNet connection, because it was configured before the peering", fr: "La connexion de réseau virtuel à réseau virtuel, car elle a été configurée avant le peering" } }
        - { id: b, text: { en: "The peering, over the Microsoft backbone, without going through the gateways", fr: "Le peering, sur le réseau principal de Microsoft, sans passer par les passerelles" } }
        - { id: c, text: { en: "Both paths, with the flows spread between the peering and the VPN tunnel", fr: "Les deux chemins, les flux étant répartis entre le peering et le tunnel VPN" } }
        - { id: d, text: { en: "The VNet-to-VNet connection, unless gateway transit is enabled on the peering", fr: "La connexion de réseau virtuel à réseau virtuel, sauf si le transit par passerelle est activé sur le peering" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          When two virtual networks are connected both by peering and by a gateway connection, the traffic between them flows through the peering, over the Azure backbone. The VNet-to-VNet connection is no longer used for that traffic and can be removed to save the gateway costs.
        fr: |
          Quand deux réseaux virtuels sont reliés à la fois par un peering et par une connexion de passerelle, le trafic entre eux passe par le peering, sur le réseau principal d'Azure. La connexion de réseau virtuel à réseau virtuel n'est plus utilisée pour ce trafic et peut être supprimée pour économiser le coût des passerelles.
      options:
        a: { en: "The order of creation doesn't matter: the peering is preferred as soon as it is connected.", fr: "L'ordre de création ne compte pas : le peering est préféré dès qu'il est connecté." }
        c: { en: "Traffic isn't spread across the two interconnections; it uses the peering only.", fr: "Le trafic n'est pas réparti entre les deux interconnexions ; il n'utilise que le peering." }
        d: { en: "Gateway transit lets a network use the gateway of its peer to reach other networks; it doesn't send traffic between the two peers through the tunnel.", fr: "Le transit par passerelle permet à un réseau d'utiliser la passerelle de son pair pour joindre d'autres réseaux ; il ne fait pas passer le trafic entre les deux pairs par le tunnel." }
    references:
      - title: Azure virtual network peering
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview

  # ------------------------------------------------------------------ 3
  - id: az700-qz-14-03
    objective: "1.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware deploys an Azure Virtual Network Manager connectivity configuration with the **Mesh** topology for a network group that contains five virtual networks. You review the effective routes of a virtual machine in one of these networks.

        Which next hop type do the routes to the other four virtual networks show?
      fr: |
        Litware déploie une configuration de connectivité Azure Virtual Network Manager de topologie **Maillage** (Mesh) pour un groupe réseau qui contient cinq réseaux virtuels. Vous examinez les itinéraires effectifs d'une machine virtuelle de l'un de ces réseaux.

        Quel type de tronçon suivant les itinéraires vers les quatre autres réseaux virtuels affichent-ils ?
    body:
      options:
        - { id: a, text: VNetPeering }
        - { id: b, text: VirtualNetworkGateway }
        - { id: c, text: ConnectedGroup }
        - { id: d, text: VirtualAppliance }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A mesh topology creates a connected group, a Virtual Network Manager construct: the members communicate without any peering, and their effective routes show the next hop type ConnectedGroup. No peering appears on the **Peerings** page of the members.
        fr: |
          Une topologie en maillage crée un groupe connecté, une construction de Virtual Network Manager : les membres communiquent sans aucun peering, et leurs itinéraires effectifs affichent le type de tronçon suivant ConnectedGroup. Aucun peering n'apparaît sur la page **Peerings** des membres.
      options:
        a: { en: "VNetPeering appears between a hub and its spokes, because the hub-and-spoke topology creates peerings; a mesh doesn't.", fr: "VNetPeering apparaît entre un hub et ses spokes, car la topologie hub-and-spoke crée des peerings ; un maillage n'en crée pas." }
        b: { en: "VirtualNetworkGateway is the next hop of routes learned from a VPN or ExpressRoute gateway, not of mesh routes.", fr: "VirtualNetworkGateway est le tronçon suivant des itinéraires appris d'une passerelle VPN ou ExpressRoute, pas des itinéraires de maillage." }
        d: { en: "VirtualAppliance comes from a user-defined route toward an appliance; a mesh creates no user-defined route.", fr: "VirtualAppliance provient d'un itinéraire défini par l'utilisateur vers une appliance ; un maillage ne crée aucun itinéraire défini par l'utilisateur." }
    references:
      - title: Connectivity configurations in Azure Virtual Network Manager
        url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-connectivity-configuration

  # ------------------------------------------------------------------ 4
  - id: az700-qz-14-04
    objective: "1.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has a hub virtual network named **VNet-Hub** whose VPN gateway accepts point-to-site connections from Windows laptops. You peer a new virtual network named **VNet-Spoke3** with VNet-Hub, with gateway transit on the hub side and the remote gateway on the spoke side. Both links show **Connected**.

        The laptops that are already connected by point-to-site VPN can reach VNet-Hub but not VNet-Spoke3.

        What should you do?
      fr: |
        Contoso dispose d'un réseau virtuel hub nommé **VNet-Hub**, dont la passerelle VPN accepte les connexions point à site d'ordinateurs portables Windows. Vous reliez par peering un nouveau réseau virtuel nommé **VNet-Spoke3** à VNet-Hub, avec le transit par passerelle côté hub et la passerelle distante côté spoke. Les deux liens affichent **Connecté**.

        Les ordinateurs portables déjà connectés en VPN point à site joignent VNet-Hub mais pas VNet-Spoke3.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Sync the peering links between VNet-Hub and VNet-Spoke3.", fr: "Synchroniser les liens de peering entre VNet-Hub et VNet-Spoke3." } }
        - { id: b, text: { en: "Download and reinstall the VPN client package on the laptops.", fr: "Télécharger et réinstaller le package du client VPN sur les ordinateurs portables." } }
        - { id: c, text: { en: "Add the range of VNet-Spoke3 to the point-to-site address pool.", fr: "Ajouter la plage de VNet-Spoke3 au pool d'adresses point à site." } }
        - { id: d, text: { en: "Allow forwarded traffic on the link from VNet-Spoke3 to VNet-Hub.", fr: "Autoriser le trafic transféré sur le lien de VNet-Spoke3 vers VNet-Hub." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Point-to-site clients receive their routes in the VPN client package. After a peering is configured, the package must be downloaded and installed again so that the clients get the route to the new virtual network. The peering itself is already established and correct.
        fr: |
          Les clients point à site reçoivent leurs itinéraires dans le package du client VPN. Après la configuration d'un peering, le package doit être téléchargé et installé à nouveau pour que les clients obtiennent l'itinéraire vers le nouveau réseau virtuel. Le peering lui-même est déjà établi et correct.
      options:
        a: { en: "A sync is needed after the address space of a peered network is resized; here the peering is new and already connected.", fr: "Une synchronisation est nécessaire après le redimensionnement de l'espace d'adressage d'un réseau relié par peering ; ici, le peering est nouveau et déjà connecté." }
        c: { en: "The point-to-site pool provides the addresses of the clients; it must not overlap with the Azure ranges.", fr: "Le pool point à site fournit les adresses des clients ; il ne doit pas chevaucher les plages Azure." }
        d: { en: "Gateway transit is already configured; the missing piece is on the clients, which don't have the route.", fr: "Le transit par passerelle est déjà configuré ; l'élément manquant est sur les clients, qui n'ont pas l'itinéraire." }
    references:
      - title: Create, change, or delete Azure virtual network peering
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering

  # ------------------------------------------------------------------ 5
  - id: az700-qz-14-05
    objective: "1.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum uses Azure Virtual Network Manager. Two connectivity configurations are deployed to West Europe: **CC-Hub** (hub and spoke) and **CC-Mesh** (mesh).

        You add a spoke network group to CC-Hub and save the configuration. CC-Hub and CC-Mesh must both stay active in West Europe.

        What should you deploy to West Europe?
      fr: |
        Adatum utilise Azure Virtual Network Manager. Deux configurations de connectivité sont déployées en West Europe : **CC-Hub** (hub-and-spoke) et **CC-Mesh** (maillage).

        Vous ajoutez un groupe réseau spoke à CC-Hub et enregistrez la configuration. CC-Hub et CC-Mesh doivent rester actives toutes les deux en West Europe.

        Que devez-vous déployer en West Europe ?
    body:
      options:
        - { id: a, text: { en: "CC-Hub only, because CC-Mesh is unchanged and stays deployed", fr: "CC-Hub uniquement, car CC-Mesh n'a pas changé et reste déployée" } }
        - { id: b, text: { en: "CC-Hub and CC-Mesh together, in a single deployment", fr: "CC-Hub et CC-Mesh ensemble, en un seul déploiement" } }
        - { id: c, text: { en: "CC-Hub, then CC-Mesh in a second, separate deployment", fr: "CC-Hub, puis CC-Mesh dans un second déploiement distinct" } }
        - { id: d, text: { en: "None, then CC-Hub, so that the old version of CC-Hub is removed first", fr: "None, puis CC-Hub, pour que l'ancienne version de CC-Hub soit d'abord retirée" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A deployment sets the goal state of a region: the configurations that you commit become the complete set that is active there. After you modify CC-Hub, you must deploy CC-Hub and CC-Mesh together so that the change applies and CC-Mesh stays.
        fr: |
          Un déploiement définit l'état cible d'une région : les configurations que vous validez deviennent l'ensemble complet qui y est actif. Après avoir modifié CC-Hub, vous devez déployer CC-Hub et CC-Mesh ensemble pour que la modification s'applique et que CC-Mesh reste en place.
      options:
        a: { en: "Committing only CC-Hub makes it the whole goal state of the region, so CC-Mesh is removed.", fr: "Valider uniquement CC-Hub en fait tout l'état cible de la région : CC-Mesh est donc retirée." }
        c: { en: "Each deployment replaces the goal state: the second one, with CC-Mesh only, removes CC-Hub.", fr: "Chaque déploiement remplace l'état cible : le second, avec CC-Mesh seule, retire CC-Hub." }
        d: { en: "Deploying None removes every configuration of the region, and the next deployment of CC-Hub alone leaves CC-Mesh removed.", fr: "Déployer None retire toutes les configurations de la région, et le déploiement suivant de CC-Hub seule laisse CC-Mesh retirée." }
    references:
      - title: Manage configuration deployments in Azure Virtual Network Manager
        url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-deployments

  # ------------------------------------------------------------------ 6
  - id: az700-qz-14-06
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin has two virtual networks, **VNet-Hub** (10.0.0.0/16) and **VNet-Spoke1** (10.1.0.0/16), in different subscriptions. They are peered with the default settings on both links, and both links show **Connected**.

        The subnet of the application servers in VNet-Spoke1 has a network security group that contains the following inbound rule, above the default rules:

        | Priority | Source | Destination | Port | Action |
        | --- | --- | --- | --- | --- |
        | 200 | VirtualNetwork | VirtualNetwork | 443 | Allow |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin dispose de deux réseaux virtuels, **VNet-Hub** (10.0.0.0/16) et **VNet-Spoke1** (10.1.0.0/16), dans des abonnements différents. Ils sont reliés par peering avec les paramètres par défaut sur les deux liens, et les deux liens affichent **Connecté**.

        Le sous-réseau des serveurs d'applications de VNet-Spoke1 a un groupe de sécurité réseau qui contient la règle de trafic entrant suivante, au-dessus des règles par défaut :

        | Priorité | Source | Destination | Port | Action |
        | --- | --- | --- | --- | --- |
        | 200 | VirtualNetwork | VirtualNetwork | 443 | Allow |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Rule 200 allows HTTPS traffic from the virtual machines of VNet-Hub to the application servers.", fr: "La règle 200 autorise le trafic HTTPS des machines virtuelles de VNet-Hub vers les serveurs d'applications." }
        - id: s2
          text: { en: "To block all the traffic between the two networks during a maintenance window and restore it afterwards, you can clear the access setting on the peering links instead of deleting the peering.", fr: "Pour bloquer tout le trafic entre les deux réseaux pendant une fenêtre de maintenance puis le rétablir, vous pouvez décocher le paramètre d'accès sur les liens de peering au lieu de supprimer le peering." }
        - id: s3
          text: { en: "If an administrator deletes the peering link on VNet-Hub, the link on VNet-Spoke1 remains, and only the link on VNet-Hub must be re-created to restore the peering.", fr: "Si un administrateur supprime le lien de peering sur VNet-Hub, le lien sur VNet-Spoke1 subsiste, et seul le lien sur VNet-Hub doit être recréé pour rétablir le peering." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          With the access setting selected (the default), the `VirtualNetwork` service tag of each network includes the peered network, so rule 200 matches traffic from VNet-Hub. Clearing the access setting blocks the traffic without deleting the peering, which is easier to undo than deleting and re-creating it. Deleting a peering from one virtual network also deletes the peering of the remote virtual network.
        fr: |
          Avec le paramètre d'accès coché (la valeur par défaut), l'étiquette de service `VirtualNetwork` de chaque réseau inclut le réseau relié par peering : la règle 200 correspond donc au trafic venant de VNet-Hub. Décocher le paramètre d'accès bloque le trafic sans supprimer le peering, ce qui est plus simple à annuler qu'une suppression suivie d'une recréation. Supprimer un peering d'un réseau virtuel supprime aussi le peering du réseau virtuel distant.
      options:
        s3: { en: "The remote link is deleted too: both links must be created again, which needs permissions on both virtual networks.", fr: "Le lien distant est supprimé lui aussi : les deux liens doivent être recréés, ce qui exige des autorisations sur les deux réseaux virtuels." }
    references:
      - title: Create, change, or delete Azure virtual network peering
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering

  # ------------------------------------------------------------------ 7
  - id: az700-qz-14-07
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove has a hub virtual network named **VNet-Hub** (10.0.0.0/16) that contains a route-based VPN gateway (VpnGw2AZ). A site-to-site connection links it to the on-premises network 192.168.0.0/16. The on-premises VPN device is policy-based, so the connection has **UsePolicyBasedTrafficSelectors** enabled, and the device defines one traffic selector: 192.168.0.0/16 to 10.0.0.0/16.

        You peer a new virtual network named **VNet-Spoke1** (10.1.0.0/16) with VNet-Hub. The hub link allows the gateway to forward traffic, and the spoke link uses the remote gateway. Both links show **Connected**. The effective routes of the virtual machines in VNet-Spoke1 contain 192.168.0.0/16 with the next hop type Virtual network gateway.

        The virtual machines in VNet-Hub can reach the on-premises network, but those in VNet-Spoke1 can't.

        What should you do?
      fr: |
        Woodgrove dispose d'un réseau virtuel hub nommé **VNet-Hub** (10.0.0.0/16) qui contient une passerelle VPN basée sur des routes (VpnGw2AZ). Une connexion site à site la relie au réseau local 192.168.0.0/16. L'appareil VPN local est basé sur des stratégies : la connexion a donc **UsePolicyBasedTrafficSelectors** activé, et l'appareil définit un sélecteur de trafic : 192.168.0.0/16 vers 10.0.0.0/16.

        Vous reliez par peering un nouveau réseau virtuel nommé **VNet-Spoke1** (10.1.0.0/16) à VNet-Hub. Le lien du hub autorise la passerelle à transférer le trafic, et le lien du spoke utilise la passerelle distante. Les deux liens affichent **Connecté**. Les itinéraires effectifs des machines virtuelles de VNet-Spoke1 contiennent 192.168.0.0/16 avec le type de tronçon suivant Passerelle de réseau virtuel.

        Les machines virtuelles de VNet-Hub joignent le réseau local, mais pas celles de VNet-Spoke1.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add 10.1.0.0/16 to the address space of the local network gateway that represents the on-premises network.", fr: "Ajouter 10.1.0.0/16 à l'espace d'adressage de la passerelle de réseau local qui représente le réseau local." } }
        - { id: b, text: { en: "Select Allow forwarded traffic on the peering link from VNet-Hub to VNet-Spoke1.", fr: "Sélectionner l'autorisation du trafic transféré sur le lien de peering de VNet-Hub vers VNet-Spoke1." } }
        - { id: c, text: { en: "Add a user-defined route for 192.168.0.0/16 with the next hop type Virtual network gateway in VNet-Spoke1.", fr: "Ajouter un itinéraire défini par l'utilisateur pour 192.168.0.0/16 avec le type de tronçon suivant Passerelle de réseau virtuel dans VNet-Spoke1." } }
        - { id: d, text: { en: "Add a traffic selector between 192.168.0.0/16 and 10.1.0.0/16 on the on-premises VPN device.", fr: "Ajouter un sélecteur de trafic entre 192.168.0.0/16 et 10.1.0.0/16 sur l'appareil VPN local." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The Azure side is complete: gateway transit is configured and the spoke has learned the on-premises route. With policy-based traffic selectors, the on-premises device must define every combination of on-premises prefixes and Azure prefixes, and the spoke range is now an Azure prefix of the tunnel. Without the 192.168.0.0/16 to 10.1.0.0/16 selector, the device doesn't send or accept the spoke traffic.
        fr: |
          Le côté Azure est complet : le transit par passerelle est configuré et le spoke a appris l'itinéraire local. Avec des sélecteurs de trafic basés sur des stratégies, l'appareil local doit définir toutes les combinaisons de préfixes locaux et de préfixes Azure, et la plage du spoke est désormais un préfixe Azure du tunnel. Sans le sélecteur 192.168.0.0/16 vers 10.1.0.0/16, l'appareil n'envoie ni n'accepte le trafic du spoke.
      options:
        a: { en: "The local network gateway lists the on-premises prefixes; adding an Azure range there would send spoke traffic back into the tunnel as if it were on-premises.", fr: "La passerelle de réseau local liste les préfixes locaux ; y ajouter une plage Azure enverrait le trafic du spoke dans le tunnel comme s'il était local." }
        b: { en: "Gateway transit doesn't need Allow forwarded traffic: the effective routes show that the spoke already uses the hub gateway.", fr: "Le transit par passerelle n'a pas besoin de l'autorisation du trafic transféré : les itinéraires effectifs montrent que le spoke utilise déjà la passerelle du hub." }
        c: { en: "The spoke already has this route through gateway transit; the problem is the device, which drops the traffic of the new prefix.", fr: "Le spoke a déjà cet itinéraire grâce au transit par passerelle ; le problème est l'appareil, qui abandonne le trafic du nouveau préfixe." }
    references:
      - title: VPN Gateway FAQ
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-vpn-faq
      - title: Configure VPN gateway transit for virtual network peering
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-peering-gateway-transit

  # ------------------------------------------------------------------ 8
  - id: az700-qz-14-08
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware uses Azure Virtual Network Manager. A deployed connectivity configuration named **CC-Data** uses the **Mesh** topology for a network group named **NG-Data**. NG-Data has dynamic membership: every virtual network with the tag `tier=data` joins it.

        Last week, a team created a virtual network named **VNet-X** with the tag `tier=data` and the address space 10.20.0.0/16, which is already used by another member, **VNet-Y**. Traffic from the other members to 10.20.0.0/16 was then dropped, which caused an outage. The team has since renumbered VNet-X.

        You need to ensure that a virtual network whose address space overlaps with a member's can't be added to the mesh. NG-Data must keep its dynamic membership. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Litware utilise Azure Virtual Network Manager. Une configuration de connectivité déployée nommée **CC-Data** utilise la topologie **Maillage** (Mesh) pour un groupe réseau nommé **NG-Data**. NG-Data a une appartenance dynamique : chaque réseau virtuel qui a l'étiquette `tier=data` le rejoint.

        La semaine dernière, une équipe a créé un réseau virtuel nommé **VNet-X** avec l'étiquette `tier=data` et l'espace d'adressage 10.20.0.0/16, déjà utilisé par un autre membre, **VNet-Y**. Le trafic des autres membres vers 10.20.0.0/16 a alors été abandonné, ce qui a provoqué une panne. L'équipe a depuis renuméroté VNet-X.

        Vous devez faire en sorte qu'un réseau virtuel dont l'espace d'adressage chevauche celui d'un membre ne puisse pas être ajouté au maillage. NG-Data doit conserver son appartenance dynamique. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Select Enforce peering in CC-Data, and deploy CC-Data again.", fr: "Sélectionner Enforce peering dans CC-Data, puis déployer à nouveau CC-Data." } }
        - { id: b, text: { en: "Set ConnectedGroupAddressOverlap to Disallowed in CC-Data, and deploy CC-Data again.", fr: "Définir ConnectedGroupAddressOverlap sur Disallowed dans CC-Data, puis déployer à nouveau CC-Data." } }
        - { id: c, text: { en: "Enable the global mesh option in CC-Data, and deploy CC-Data again.", fr: "Activer l'option de maillage global dans CC-Data, puis déployer à nouveau CC-Data." } }
        - { id: d, text: { en: "Replace CC-Data with a hub-and-spoke configuration that has direct connectivity, and deploy it.", fr: "Remplacer CC-Data par une configuration hub-and-spoke avec connectivité directe, puis la déployer." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Unlike peering, a mesh allows overlapping address spaces by default: Virtual Network Manager then removes the overlapping range from the mesh and drops the traffic to it. Setting ConnectedGroupAddressOverlap to Disallowed makes the service validate new members and address space changes and block those that overlap. The setting is part of the configuration, so CC-Data must be deployed again.
        fr: |
          Contrairement au peering, un maillage admet par défaut des espaces d'adressage qui se chevauchent : Virtual Network Manager retire alors la plage en double du maillage et abandonne le trafic vers elle. Définir ConnectedGroupAddressOverlap sur Disallowed fait valider par le service les nouveaux membres et les modifications d'espace d'adressage, et bloque ceux qui se chevauchent. Le paramètre fait partie de la configuration : CC-Data doit donc être déployée à nouveau.
      options:
        a: { en: "Enforce peering protects the peerings of a topology from changes made outside Virtual Network Manager; a mesh has no peerings and no address check comes from it.", fr: "Enforce peering protège les peerings d'une topologie contre les modifications faites hors de Virtual Network Manager ; un maillage n'a pas de peerings, et ce paramètre ne vérifie aucune adresse." }
        c: { en: "Global mesh only extends the connected group across regions; it doesn't validate address spaces.", fr: "Le maillage global ne fait qu'étendre le groupe connecté à toutes les régions ; il ne valide pas les espaces d'adressage." }
        d: { en: "Direct connectivity also creates a connected group, with the same default overlap behavior, and rebuilding the topology adds effort.", fr: "La connectivité directe crée aussi un groupe connecté, avec le même comportement par défaut face aux chevauchements, et reconstruire la topologie ajoute de l'effort." }
    references:
      - title: Connectivity configurations in Azure Virtual Network Manager
        url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-connectivity-configuration

  # ------------------------------------------------------------------ 9
  - id: az700-qz-14-09
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has the management group hierarchy **MG-Contoso** > **MG-Dev** > **Sub-Dev**. A network manager named **NM1** has the scope MG-Contoso and the features **Connectivity** and **SecurityAdmin**.

        The development team wants its own network manager, **NM2**, for the networks of the development environment.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose de la hiérarchie de groupes d'administration **MG-Contoso** > **MG-Dev** > **Sub-Dev**. Un gestionnaire de réseau nommé **NM1** a l'étendue MG-Contoso et les fonctionnalités **Connectivity** et **SecurityAdmin**.

        L'équipe de développement veut son propre gestionnaire de réseau, **NM2**, pour les réseaux de l'environnement de développement.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "You can create NM2 with the scope Sub-Dev and the Connectivity feature.", fr: "Vous pouvez créer NM2 avec l'étendue Sub-Dev et la fonctionnalité Connectivity." }
        - id: s2
          text: { en: "You can create NM2 with the scope Sub-Dev and the Routing feature only.", fr: "Vous pouvez créer NM2 avec l'étendue Sub-Dev et la seule fonctionnalité Routing." }
        - id: s3
          text: { en: "If you create NM2 with Azure CLI and the scope MG-Dev, you must first register the Microsoft.Network resource provider at the MG-Dev scope.", fr: "Si vous créez NM2 avec Azure CLI et l'étendue MG-Dev, vous devez d'abord inscrire le fournisseur de ressources Microsoft.Network à l'étendue MG-Dev." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Network managers can have overlapping scopes in the same hierarchy only if they enable different features. Sub-Dev is inside the scope of NM1, so NM2 can't enable Connectivity or SecurityAdmin there, but it can enable Routing. With a management group scope, Microsoft.Network must be registered at that management group: the portal does it during creation, Azure CLI and PowerShell don't.
        fr: |
          Des gestionnaires de réseau ne peuvent avoir des étendues qui se chevauchent dans la même hiérarchie que s'ils activent des fonctionnalités différentes. Sub-Dev est dans l'étendue de NM1 : NM2 ne peut donc pas y activer Connectivity ni SecurityAdmin, mais il peut activer Routing. Avec une étendue de groupe d'administration, Microsoft.Network doit être inscrit à ce groupe d'administration : le portail le fait pendant la création, Azure CLI et PowerShell non.
      options:
        s1: { en: "NM1 already has the Connectivity feature on a scope that contains Sub-Dev; the same feature can't be enabled on an overlapping scope.", fr: "NM1 a déjà la fonctionnalité Connectivity sur une étendue qui contient Sub-Dev ; la même fonctionnalité ne peut pas être activée sur une étendue qui la chevauche." }
    references:
      - title: Understand and work with Azure Virtual Network Manager scopes
        url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-network-manager-scope

  # ------------------------------------------------------------------ 10
  - id: az700-qz-14-10
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin has a management group named **MG-Tailspin** that contains 40 subscriptions, and new subscriptions are added every month. The subscriptions contain about 600 spoke virtual networks in West Europe, each tagged `env=prod` or `env=dev`. A hub virtual network named **VNet-Hub** contains an ExpressRoute gateway.

        You plan to use Azure Virtual Network Manager with one hub-and-spoke connectivity configuration and two spoke network groups that use dynamic membership: **NG-Prod** and **NG-Dev**. You have already set NG-Prod to use direct connectivity and the hub as a gateway.

        The configuration must meet the following requirements:

        - Every spoke, including spokes in future subscriptions, must reach the on-premises network through the ExpressRoute gateway of VNet-Hub.
        - The dev spokes must not communicate with each other.
        - Some dev spokes were peered with each other manually. These peerings must be removed.
        - Administrative effort must be minimized.

        How should you complete the design? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin dispose d'un groupe d'administration nommé **MG-Tailspin** qui contient 40 abonnements, et de nouveaux abonnements sont ajoutés chaque mois. Les abonnements contiennent environ 600 réseaux virtuels spokes en West Europe, chacun avec l'étiquette `env=prod` ou `env=dev`. Un réseau virtuel hub nommé **VNet-Hub** contient une passerelle ExpressRoute.

        Vous prévoyez d'utiliser Azure Virtual Network Manager avec une configuration de connectivité hub-and-spoke et deux groupes réseau spokes à appartenance dynamique : **NG-Prod** et **NG-Dev**. Vous avez déjà configuré NG-Prod pour utiliser la connectivité directe et le hub en tant que passerelle.

        La configuration doit répondre aux exigences suivantes :

        - Chaque spoke, y compris les spokes des futurs abonnements, doit joindre le réseau local par la passerelle ExpressRoute de VNet-Hub.
        - Les spokes de développement ne doivent pas communiquer entre eux.
        - Certains spokes de développement ont été reliés entre eux par des peerings manuels. Ces peerings doivent être supprimés.
        - L'effort administratif doit être réduit au minimum.

        Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Scope of the network manager: [[scope]]

          Settings of NG-Dev: [[dev]]

          Option of the connectivity configuration: [[option]]
        fr: |
          Étendue du gestionnaire de réseau : [[scope]]

          Paramètres de NG-Dev : [[dev]]

          Option de la configuration de connectivité : [[option]]
      slots:
        - id: scope
          options:
            - { id: mg, text: { en: "The management group MG-Tailspin", fr: "Le groupe d'administration MG-Tailspin" } }
            - { id: hubsub, text: { en: "The subscription that contains VNet-Hub", fr: "L'abonnement qui contient VNet-Hub" } }
            - { id: persub, text: { en: "Each subscription, with one network manager per subscription", fr: "Chaque abonnement, avec un gestionnaire de réseau par abonnement" } }
        - id: dev
          options:
            - { id: gwonly, text: { en: "Use hub as a gateway only", fr: "Utiliser le hub en tant que passerelle uniquement" } }
            - { id: both, text: { en: "Direct connectivity and Use hub as a gateway", fr: "Connectivité directe et Utiliser le hub en tant que passerelle" } }
            - { id: directonly, text: { en: "Direct connectivity only", fr: "Connectivité directe uniquement" } }
            - { id: none, text: { en: "Neither direct connectivity nor Use hub as a gateway", fr: "Ni la connectivité directe ni Utiliser le hub en tant que passerelle" } }
        - id: option
          options:
            - { id: delete, text: { en: "Delete existing peerings", fr: "Suppression des peerings existants" } }
            - { id: enforce, text: { en: "Enforce peering", fr: "Imposer le peering" } }
            - { id: overlap, text: { en: "ConnectedGroupAddressOverlap set to Disallowed", fr: "ConnectedGroupAddressOverlap défini sur Disallowed" } }
    answer:
      values: { scope: mg, dev: gwonly, option: delete }
    explanation:
      correct:
        en: |
          A scope at MG-Tailspin covers every current and future subscription, so the dynamic groups pick up new spokes without changing the network manager. NG-Dev needs only Use hub as a gateway: the spokes use the ExpressRoute gateway, and without direct connectivity they get no connected group among themselves. Delete existing peerings removes the peerings that don't match the configuration, including the manual dev-to-dev peerings.
        fr: |
          Une étendue sur MG-Tailspin couvre tous les abonnements actuels et futurs : les groupes dynamiques intègrent donc les nouveaux spokes sans modifier le gestionnaire de réseau. NG-Dev n'a besoin que d'Utiliser le hub en tant que passerelle : les spokes utilisent la passerelle ExpressRoute, et sans connectivité directe ils n'obtiennent aucun groupe connecté entre eux. La suppression des peerings existants retire les peerings qui ne correspondent pas à la configuration, y compris les peerings manuels entre spokes de développement.
      options:
        hubsub: { en: "The spokes in the other subscriptions would be outside the scope, and the network manager wouldn't apply the configuration to them.", fr: "Les spokes des autres abonnements seraient hors de l'étendue, et le gestionnaire de réseau ne leur appliquerait pas la configuration." }
        persub: { en: "Forty network managers, plus one for each new subscription, multiply the administration, and each one would need the hub in its scope.", fr: "Quarante gestionnaires de réseau, plus un par nouvel abonnement, multiplient l'administration, et chacun aurait besoin du hub dans son étendue." }
        both: { en: "Direct connectivity creates a connected group among the dev spokes, which must not communicate.", fr: "La connectivité directe crée un groupe connecté entre les spokes de développement, qui ne doivent pas communiquer." }
        directonly: { en: "Without Use hub as a gateway, the dev spokes don't reach the on-premises network through the ExpressRoute gateway.", fr: "Sans Utiliser le hub en tant que passerelle, les spokes de développement ne joignent pas le réseau local par la passerelle ExpressRoute." }
        none: { en: "The dev spokes would be peered with the hub but couldn't use its ExpressRoute gateway.", fr: "Les spokes de développement seraient reliés au hub par peering mais ne pourraient pas utiliser sa passerelle ExpressRoute." }
        enforce: { en: "Enforce peering prevents changes to the peerings of the topology; it doesn't remove the manual peerings.", fr: "Imposer le peering empêche de modifier les peerings de la topologie ; il ne supprime pas les peerings manuels." }
        overlap: { en: "This setting blocks overlapping address spaces in a connected group; it doesn't remove peerings.", fr: "Ce paramètre bloque les espaces d'adressage qui se chevauchent dans un groupe connecté ; il ne supprime pas de peerings." }
    references:
      - title: Connectivity configurations in Azure Virtual Network Manager
        url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-connectivity-configuration
      - title: Understand and work with Azure Virtual Network Manager scopes
        url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-network-manager-scope
