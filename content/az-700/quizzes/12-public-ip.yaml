chapter: 12-public-ip
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-12-01
    objective: "1.1.6"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        You need to create a public IP prefix of IPv6 addresses that contains 16 addresses.

        Which prefix length should you specify?
      fr: |
        Vous devez créer un préfixe d'adresse IP publique d'adresses IPv6 qui contient 16 adresses.

        Quelle longueur de préfixe devez-vous indiquer ?
    body:
      options:
        - { id: a, text: "/64" }
        - { id: b, text: "/124" }
        - { id: c, text: "/125" }
        - { id: d, text: "/126" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Public IP prefixes come in four sizes, from 16 down to 2 addresses. For IPv6, 16 addresses is a /124, the counterpart of a /28 for IPv4.
        fr: |
          Les préfixes d'adresses IP publiques existent en quatre tailles, de 16 à 2 adresses. En IPv6, 16 adresses correspondent à un /124, l'équivalent d'un /28 en IPv4.
      options:
        a: { en: "/64 is the mandatory size of an IPv6 subnet in a virtual network, not a public IP prefix size.", fr: "/64 est la taille imposée d'un sous-réseau IPv6 dans un réseau virtuel, pas une taille de préfixe d'adresse IP publique." }
        c: { en: "A /125 contains 8 addresses.", fr: "Un /125 contient 8 adresses." }
        d: { en: "A /126 contains 4 addresses.", fr: "Un /126 contient 4 adresses." }
    references:
      - title: Azure Public IP address prefix - Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix

  # ------------------------------------------------------------------ 2
  - id: az700-qz-12-02
    objective: "1.1.9"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        You are deploying a public Standard load balancer named **LB-Web**. LB-Web must accept client connections on one public IPv4 frontend and on one public IPv6 frontend.

        What is the minimum number of public IP address resources that you must create?
      fr: |
        Vous déployez un équilibreur de charge public Standard nommé **LB-Web**. LB-Web doit accepter les connexions des clients sur une configuration frontale IPv4 publique et sur une configuration frontale IPv6 publique.

        Quel est le nombre minimal de ressources d'adresse IP publique que vous devez créer ?
    body:
      options:
        - { id: a, text: "1" }
        - { id: b, text: "2" }
        - { id: c, text: "3" }
        - { id: d, text: "4" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The IP version (IPv4 or IPv6) is a setting of each public IP address resource, chosen at creation. A dual-stack frontend therefore needs two resources: one IPv4 address and one IPv6 address, each used by its own frontend IP configuration.
        fr: |
          La version IP (IPv4 ou IPv6) est un paramètre de chaque ressource d'adresse IP publique, choisi à la création. Une configuration frontale à double pile a donc besoin de deux ressources : une adresse IPv4 et une adresse IPv6, chacune utilisée par sa propre configuration IP frontale.
      options:
        a: { en: "A public IP address resource has a single IP version; it can't carry both an IPv4 and an IPv6 address.", fr: "Une ressource d'adresse IP publique n'a qu'une version IP ; elle ne peut pas porter à la fois une adresse IPv4 et une adresse IPv6." }
        c: { en: "No third address is needed: the load balancer has no separate management address.", fr: "Aucune troisième adresse n'est nécessaire : l'équilibreur de charge n'a pas d'adresse de gestion distincte." }
        d: { en: "Zone redundancy doesn't require extra addresses: a single zone-redundant address serves all the zones.", fr: "La redondance interzone n'exige pas d'adresses supplémentaires : une seule adresse redondante interzone dessert toutes les zones." }
    references:
      - title: Public IP addresses in Azure - Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses

  # ------------------------------------------------------------------ 3
  - id: az700-qz-12-03
    objective: "1.1.10"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware has a virtual machine named **VM-Web** that hosts a website. VM-Web has one network interface named **vmweb-nic** with one IP configuration named **ipconfig1**, which is associated with a public IP address named **pip-site1**.

        VM-Web must host a second website that needs its own public IPv4 address and its own TLS certificate. You created a Standard public IP address named **pip-site2** in the region and subscription of VM-Web.

        What should you do?
      fr: |
        Proseware dispose d'une machine virtuelle nommée **VM-Web** qui héberge un site web. VM-Web a une interface réseau nommée **vmweb-nic** avec une configuration IP nommée **ipconfig1**, associée à une adresse IP publique nommée **pip-site1**.

        VM-Web doit héberger un second site web qui a besoin de sa propre adresse IPv4 publique et de son propre certificat TLS. Vous avez créé une adresse IP publique Standard nommée **pip-site2** dans la région et l'abonnement de VM-Web.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add a second IP configuration to vmweb-nic, and associate pip-site2 with it.", fr: "Ajouter une seconde configuration IP à vmweb-nic, puis lui associer pip-site2." } }
        - { id: b, text: { en: "Associate pip-site2 with ipconfig1, next to pip-site1.", fr: "Associer pip-site2 à ipconfig1, à côté de pip-site1." } }
        - { id: c, text: { en: "Create a public IP prefix for both addresses, and associate it with vmweb-nic.", fr: "Créer un préfixe d'adresse IP publique pour les deux adresses, puis l'associer à vmweb-nic." } }
        - { id: d, text: { en: "Associate a NAT gateway that uses pip-site2 with the subnet of VM-Web.", fr: "Associer au sous-réseau de VM-Web une passerelle NAT qui utilise pip-site2." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          An IP configuration of a network interface holds one private address and, optionally, one public address. To give a virtual machine more public addresses, you add IP configurations to its network interface and associate one public IP address with each of them.
        fr: |
          Une configuration IP d'interface réseau porte une adresse privée et, en option, une adresse publique. Pour donner plus d'adresses publiques à une machine virtuelle, vous ajoutez des configurations IP à son interface réseau et associez une adresse IP publique à chacune d'elles.
      options:
        b: { en: "An IP configuration accepts only one public IP address; ipconfig1 already has pip-site1.", fr: "Une configuration IP n'accepte qu'une adresse IP publique ; ipconfig1 a déjà pip-site1." }
        c: { en: "A public IP prefix can't be associated with a network interface; virtual machines use addresses created from the prefix.", fr: "Un préfixe d'adresse IP publique ne peut pas être associé à une interface réseau ; les machines virtuelles utilisent des adresses créées à partir du préfixe." }
        d: { en: "A NAT gateway provides outbound connectivity only; clients on the internet can't open connections to the website through it.", fr: "Une passerelle NAT ne fournit que la connectivité sortante ; les clients d'internet ne peuvent pas ouvrir de connexions vers le site web à travers elle." }
    references:
      - title: Configure IP addresses for an Azure network interface
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/virtual-network-network-interface-addresses

  # ------------------------------------------------------------------ 4
  - id: az700-qz-12-04
    objective: "1.1.7"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Wingtip Toys has a public IP prefix named **ippre-app** (/29, Standard, IPv4, zone-redundant) in UK South. Three public IP addresses were created from ippre-app: **pip-1** is associated with a virtual machine named VM1, and **pip-2** and **pip-3** aren't associated with any resource.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys dispose d'un préfixe d'adresse IP publique nommé **ippre-app** (/29, Standard, IPv4, redondant interzone) dans la région Royaume-Uni Sud. Trois adresses IP publiques ont été créées à partir d'ippre-app : **pip-1** est associée à une machine virtuelle nommée VM1, et **pip-2** et **pip-3** ne sont associées à aucune ressource.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "You can use ippre-app itself as the frontend of a load-balancing rule on a public Standard load balancer.", fr: "Vous pouvez utiliser ippre-app lui-même comme configuration frontale d'une règle d'équilibrage de charge d'un équilibreur de charge public Standard." }
        - id: s2
          text: { en: "If you delete pip-3, you can later create a public IP address from ippre-app that receives the address pip-3 had.", fr: "Si vous supprimez pip-3, vous pouvez créer plus tard à partir d'ippre-app une adresse IP publique qui reçoit l'adresse qu'avait pip-3." }
        - id: s3
          text: { en: "You can delete ippre-app while pip-1 stays associated with VM1.", fr: "Vous pouvez supprimer ippre-app pendant que pip-1 reste associée à VM1." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A load balancer can use a whole prefix only for outbound connections; an inbound frontend needs an individual address created from the prefix. When you delete an address created from a prefix, it returns to the prefix, and you can request that exact address when you create a new public IP address from the prefix. A prefix can't be deleted while one of its addresses is associated with a resource.
        fr: |
          Un équilibreur de charge ne peut utiliser un préfixe entier que pour les connexions sortantes ; une configuration frontale entrante a besoin d'une adresse individuelle créée à partir du préfixe. Quand vous supprimez une adresse créée à partir d'un préfixe, elle retourne au préfixe, et vous pouvez demander cette adresse précise en créant une nouvelle adresse IP publique à partir du préfixe. Un préfixe ne peut pas être supprimé tant que l'une de ses adresses est associée à une ressource.
      options:
        s1: { en: "A prefix used by a load balancer serves outbound rules only, never inbound connections.", fr: "Un préfixe utilisé par un équilibreur de charge ne sert qu'aux règles de trafic sortant, jamais aux connexions entrantes." }
        s3: { en: "Dissociate every address of the prefix from its resource before you delete the prefix.", fr: "Dissociez chaque adresse du préfixe de sa ressource avant de supprimer le préfixe." }
    references:
      - title: Azure Public IP address prefix - Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix

  # ------------------------------------------------------------------ 5
  - id: az700-qz-12-05
    objective: "1.1.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso onboarded its range 192.0.2.0/24 to Azure as a unified custom IP prefix named **cip-contoso** in West Europe. cip-contoso is commissioned, and workloads in West Europe use public IP prefixes derived from 192.0.2.0/25.

        Contoso now wants workloads in East US to use addresses from 192.0.2.128/25. West Europe must keep 192.0.2.0/25.

        What should you do?
      fr: |
        Contoso a intégré sa plage 192.0.2.0/24 à Azure sous la forme d'un préfixe d'adresse IP personnalisé unifié nommé **cip-contoso** dans la région Europe Ouest. cip-contoso est mis en service, et des charges de travail d'Europe Ouest utilisent des préfixes d'adresses IP publiques dérivés de 192.0.2.0/25.

        Contoso veut désormais que des charges de travail d'USA Est utilisent des adresses de 192.0.2.128/25. L'Europe Ouest doit conserver 192.0.2.0/25.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Derive a /25 public IP prefix in East US from cip-contoso, and use it for the East US workloads.", fr: "Dériver de cip-contoso un préfixe d'adresse IP publique /25 dans la région USA Est, puis l'utiliser pour les charges de travail d'USA Est." } }
        - { id: b, text: { en: "Create a regional custom IP prefix for 192.0.2.128/25 in East US, with cip-contoso as its parent.", fr: "Créer dans la région USA Est un préfixe d'adresse IP personnalisé régional pour 192.0.2.128/25, avec cip-contoso comme parent." } }
        - { id: c, text: { en: "Fully deprovision cip-contoso, then onboard the range again as a global prefix with one regional prefix per region.", fr: "Déprovisionner entièrement cip-contoso, puis intégrer à nouveau la plage comme préfixe global avec un préfixe régional par région." } }
        - { id: d, text: { en: "Create a second unified custom IP prefix for 192.0.2.128/25 in East US, next to cip-contoso.", fr: "Créer dans la région USA Est un second préfixe d'adresse IP personnalisé unifié pour 192.0.2.128/25, à côté de cip-contoso." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A unified custom IP prefix lives in one region, and the public IP prefixes derived from it must be in that region. Splitting a range across regions needs the global/regional model, and a range can't be migrated between models: it must be fully deprovisioned and onboarded again, with a global /24 and regional /25 children.
        fr: |
          Un préfixe d'adresse IP personnalisé unifié réside dans une seule région, et les préfixes d'adresses IP publiques qui en sont dérivés doivent se trouver dans cette région. Répartir une plage entre régions exige le modèle global/régional, et une plage ne peut pas passer d'un modèle à l'autre : elle doit être entièrement déprovisionnée puis intégrée à nouveau, avec un /24 global et des enfants régionaux en /25.
      options:
        a: { en: "A public IP prefix derived from a custom IP prefix must be in the region of the custom IP prefix.", fr: "Un préfixe d'adresse IP publique dérivé d'un préfixe personnalisé doit se trouver dans la région du préfixe personnalisé." }
        b: { en: "Regional prefixes are children of a global prefix; a unified prefix can't become a parent without leaving its model.", fr: "Les préfixes régionaux sont les enfants d'un préfixe global ; un préfixe unifié ne peut pas devenir parent sans quitter son modèle." }
        d: { en: "A unified custom IP prefix must be between /21 and /24, and the range is already onboarded by cip-contoso.", fr: "Un préfixe d'adresse IP personnalisé unifié doit mesurer entre /21 et /24, et la plage est déjà intégrée par cip-contoso." }
    references:
      - title: Custom IP address prefix (BYOIP) - Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/custom-ip-address-prefix
      - title: Create a custom IPv4 address prefix in Azure - Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/create-custom-ip-address-prefix-cli

  # ------------------------------------------------------------------ 6
  - id: az700-qz-12-06
    objective: "1.1.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso runs 12 virtual machines in West Europe that upload files to a bank. Each virtual machine has its own Standard public IP address. The bank accepts connections only from the individual addresses that Contoso registers with it, and each change to the registration takes three weeks. Contoso doesn't own a public IP range.

        Every month, a release pipeline deletes each virtual machine together with its network interface and its public IP address, then deploys it again from a template. You can change the template, but not the fact that the public IP addresses are deleted.

        You need to ensure that the redeployed virtual machines keep the addresses that are registered with the bank.

        What should you do?
      fr: |
        Contoso exécute 12 machines virtuelles dans la région Europe Ouest qui chargent des fichiers vers une banque. Chaque machine virtuelle a sa propre adresse IP publique Standard. La banque n'accepte que les connexions des adresses individuelles que Contoso y enregistre, et chaque modification de l'enregistrement prend trois semaines. Contoso ne possède aucune plage d'adresses IP publiques.

        Chaque mois, un pipeline de mise en production supprime chaque machine virtuelle avec son interface réseau et son adresse IP publique, puis la redéploie à partir d'un modèle. Vous pouvez modifier le modèle, mais pas le fait que les adresses IP publiques soient supprimées.

        Vous devez faire en sorte que les machines virtuelles redéployées conservent les adresses enregistrées auprès de la banque.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set the allocation method of each public IP address in the template to Static, so that each address is assigned again.", fr: "Définir dans le modèle la méthode d'allocation de chaque adresse IP publique sur Static, afin que chaque adresse soit réattribuée." } }
        - { id: b, text: { en: "Create a /28 public IP prefix once, and have the template request the previous address of each VM from the prefix.", fr: "Créer une seule fois un préfixe d'adresse IP publique /28, et faire demander par le modèle l'adresse précédente de chaque VM au préfixe." } }
        - { id: c, text: { en: "Give each public IP address a DNS name label, and register these names with the bank instead of the addresses.", fr: "Donner à chaque adresse IP publique une étiquette de nom DNS, puis enregistrer ces noms auprès de la banque au lieu des adresses." } }
        - { id: d, text: { en: "Create a custom IP prefix once, and have the template derive the address of each VM from the custom prefix.", fr: "Créer une seule fois un préfixe d'adresse IP personnalisé, et faire dériver par le modèle l'adresse de chaque VM du préfixe personnalisé." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Addresses created from a public IP prefix return to the prefix when their public IP address resources are deleted, instead of going back to Azure. When the pipeline creates a public IP address from the prefix, it can specify the exact address to use, so each redeployed virtual machine receives its previous address. A /28 holds the 12 addresses with room for growth, and the bank can register the whole prefix.
        fr: |
          Les adresses créées à partir d'un préfixe d'adresse IP publique retournent au préfixe quand leurs ressources d'adresse IP publique sont supprimées, au lieu de revenir à Azure. Quand le pipeline crée une adresse IP publique à partir du préfixe, il peut indiquer l'adresse précise à utiliser : chaque machine virtuelle redéployée reçoit donc son adresse précédente. Un /28 contient les 12 adresses avec de la marge, et la banque peut enregistrer tout le préfixe.
      options:
        a: { en: "Standard addresses are already static: the address is kept until the resource is deleted, then released and can't be recovered.", fr: "Les adresses Standard sont déjà statiques : l'adresse est conservée jusqu'à la suppression de la ressource, puis libérée sans possibilité de récupération." }
        c: { en: "The bank accepts registered addresses only, and a DNS name label doesn't keep the address when the resource is deleted.", fr: "La banque n'accepte que des adresses enregistrées, et une étiquette de nom DNS ne conserve pas l'adresse quand la ressource est supprimée." }
        d: { en: "A custom IP prefix brings a range that you own (BYOIP); Contoso doesn't own one.", fr: "Un préfixe d'adresse IP personnalisé sert à apporter une plage que vous possédez (BYOIP) ; Contoso n'en possède aucune." }
    references:
      - title: Azure Public IP address prefix - Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix

  # ------------------------------------------------------------------ 7
  - id: az700-qz-12-07
    objective: "1.1.10"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Litware has two subscriptions, **Sub-Old** and **Sub-New**, in the same Microsoft Entra tenant. In Sub-Old, a public IP address named **pip-api** (Standard, IPv4, zone-redundant, West Europe) is associated with the IP configuration ipconfig1 of the network interface of a virtual machine named **VM-Old**. Customers call an API at the address of pip-api.

        The API moves to a virtual machine named **VM-New** in a resource group named **RG-New** of Sub-New, in West Europe. The network interface of VM-New has an IP configuration named ipconfig1 without a public IP address, and its NSG already allows the API traffic. Customers must keep using the same address.

        Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Litware dispose de deux abonnements, **Sub-Old** et **Sub-New**, dans le même locataire Microsoft Entra. Dans Sub-Old, une adresse IP publique nommée **pip-api** (Standard, IPv4, redondante interzone, Europe Ouest) est associée à la configuration IP ipconfig1 de l'interface réseau d'une machine virtuelle nommée **VM-Old**. Les clients appellent une API à l'adresse de pip-api.

        L'API est déplacée vers une machine virtuelle nommée **VM-New** dans un groupe de ressources nommé **RG-New** de Sub-New, dans la région Europe Ouest. L'interface réseau de VM-New a une configuration IP nommée ipconfig1 sans adresse IP publique, et son NSG autorise déjà le trafic de l'API. Les clients doivent continuer à utiliser la même adresse.

        Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 3
      actions:
        - { id: dissoc, text: { en: "Dissociate pip-api from ipconfig1 of the network interface of VM-Old.", fr: "Dissocier pip-api de l'ipconfig1 de l'interface réseau de VM-Old." } }
        - { id: move, text: { en: "Move pip-api to RG-New in Sub-New.", fr: "Déplacer pip-api vers RG-New dans Sub-New." } }
        - { id: assoc, text: { en: "Associate pip-api with ipconfig1 of the network interface of VM-New.", fr: "Associer pip-api à l'ipconfig1 de l'interface réseau de VM-New." } }
        - { id: recreate, text: { en: "Delete pip-api, then create a public IP address with the same address in Sub-New.", fr: "Supprimer pip-api, puis créer dans Sub-New une adresse IP publique avec la même adresse." } }
        - { id: dealloc, text: { en: "Stop and deallocate VM-New.", fr: "Arrêter et libérer VM-New." } }
        - { id: peer, text: { en: "Peer the virtual network of VM-Old with the virtual network of VM-New.", fr: "Créer un peering entre le réseau virtuel de VM-Old et celui de VM-New." } }
    answer:
      sequence: [ dissoc, move, assoc ]
    explanation:
      correct:
        en: |
          A public IP address must be in the same subscription and region as the resource it is associated with, so pip-api must first move to Sub-New. A Standard public IP address can move to another subscription only when it is detached from every resource: dissociate it from VM-Old, move it, then associate it with the IP configuration of VM-New. The address doesn't change during the move.
        fr: |
          Une adresse IP publique doit se trouver dans le même abonnement et la même région que la ressource à laquelle elle est associée : pip-api doit donc d'abord passer dans Sub-New. Une adresse IP publique Standard ne peut changer d'abonnement que si elle est détachée de toute ressource : dissociez-la de VM-Old, déplacez-la, puis associez-la à la configuration IP de VM-New. L'adresse ne change pas pendant le déplacement.
      options:
        recreate: { en: "A deleted public IP address can't be recovered, and you can't choose the address of a new one outside a prefix.", fr: "Une adresse IP publique supprimée ne peut pas être récupérée, et vous ne pouvez pas choisir l'adresse d'une nouvelle adresse en dehors d'un préfixe." }
        dealloc: { en: "A public IP address can be associated with the network interface of a running virtual machine.", fr: "Une adresse IP publique peut être associée à l'interface réseau d'une machine virtuelle en cours d'exécution." }
        peer: { en: "Peering connects private address spaces; it doesn't let a resource of Sub-New use a public IP address of Sub-Old.", fr: "Le peering relie des espaces d'adressage privés ; il ne permet pas à une ressource de Sub-New d'utiliser une adresse IP publique de Sub-Old." }
    references:
      - title: Create, change, or delete an Azure public IP address - Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/virtual-network-public-ip-address

  # ------------------------------------------------------------------ 8
  - id: az700-qz-12-08
    objective: "1.1.9"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind Traders runs several internet-facing workloads in North Europe, a region with three availability zones. To lower its internet egress data transfer costs, the network team plans to create the public IP addresses of these workloads with the routing preference set to **Internet**.

        Which two public IP addresses can the team create with this routing preference and use as planned?

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders exécute plusieurs charges de travail exposées à internet dans la région Europe Nord, qui compte trois zones de disponibilité. Pour réduire ses coûts de transfert de données sortant vers internet, l'équipe réseau prévoit de créer les adresses IP publiques de ces charges de travail avec la préférence de routage définie sur **Internet**.

        Quelles sont les deux adresses IP publiques que l'équipe peut créer avec cette préférence de routage et utiliser comme prévu ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "A zone-redundant Standard IPv4 address for a public load balancer whose backend pool is configured by network interface", fr: "Une adresse IPv4 Standard redondante interzone pour un équilibreur de charge public dont le pool principal est configuré par interface réseau" } }
        - { id: b, text: { en: "A zone-redundant Standard IPv4 address for the outbound traffic of a Standard NAT gateway", fr: "Une adresse IPv4 Standard redondante interzone pour le trafic sortant d'une passerelle NAT Standard" } }
        - { id: c, text: { en: "A zone-redundant Standard IPv6 address for a dual-stack virtual machine", fr: "Une adresse IPv6 Standard redondante interzone pour une machine virtuelle à double pile" } }
        - { id: d, text: { en: "A zone-redundant Standard IPv4 address for an Azure Firewall instance", fr: "Une adresse IPv4 Standard redondante interzone pour une instance de Pare-feu Azure" } }
        - { id: e, text: { en: "A zonal Standard IPv4 address in zone 2 for a virtual machine deployed in zone 2", fr: "Une adresse IPv4 Standard zonale dans la zone 2 pour une machine virtuelle déployée dans la zone 2" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Routing preference Internet works only with zone-redundant Standard IPv4 addresses. It is supported for virtual machines, scale sets, AKS, public load balancers with NIC-based backend pools, Application Gateway and Azure Firewall.
        fr: |
          La préférence de routage Internet ne fonctionne qu'avec des adresses IPv4 Standard redondantes interzone. Elle est prise en charge pour les machines virtuelles, les groupes de machines virtuelles identiques, AKS, les équilibreurs de charge publics avec des pools principaux basés sur les interfaces réseau, Application Gateway et le Pare-feu Azure.
      options:
        b: { en: "NAT gateways don't support public IP addresses whose routing preference is Internet.", fr: "Les passerelles NAT ne prennent pas en charge les adresses IP publiques dont la préférence de routage est Internet." }
        c: { en: "Routing preference Internet doesn't support IPv6 addresses.", fr: "La préférence de routage Internet ne prend pas en charge les adresses IPv6." }
        e: { en: "Routing preference Internet requires a zone-redundant address; a zonal address can't use it.", fr: "La préférence de routage Internet exige une adresse redondante interzone ; une adresse zonale ne peut pas l'utiliser." }
    references:
      - title: Routing preference in Azure - Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/routing-preference-overview

  # ------------------------------------------------------------------ 9
  - id: az700-qz-12-09
    objective: "1.1.8"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys owns the range 198.51.100.0/24, registered in its name with RIPE NCC. Today, the routers of Tailspin's datacenter advertise the range to the internet.

        Tailspin will move the web services that use this range to West Europe, a region with availability zones, by using a unified custom IP prefix named **cip-tailspin**. The Azure deployment must be tested with these addresses from inside Azure before the internet advertisement moves to Microsoft during a maintenance window.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys possède la plage 198.51.100.0/24, enregistrée à son nom auprès du RIPE NCC. Aujourd'hui, les routeurs du centre de données de Tailspin publient la plage vers internet.

        Tailspin va déplacer les services web qui utilisent cette plage vers la région Europe Ouest, dotée de zones de disponibilité, à l'aide d'un préfixe d'adresse IP personnalisé unifié nommé **cip-tailspin**. Le déploiement Azure doit être testé avec ces adresses depuis Azure avant que la publication vers internet ne passe à Microsoft pendant une fenêtre de maintenance.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "You can create cip-tailspin in West Europe without selecting any availability zone.", fr: "Vous pouvez créer cip-tailspin dans la région Europe Ouest sans sélectionner de zone de disponibilité." }
        - id: s2
          text: { en: "Once cip-tailspin is Provisioned, you can commission it so that it's advertised only from West Europe while the datacenter routers keep advertising it to the internet.", fr: "Une fois cip-tailspin à l'état Provisioned, vous pouvez le mettre en service de sorte qu'il ne soit publié que depuis l'Europe Ouest pendant que les routeurs du centre de données continuent de le publier vers internet." }
        - id: s3
          text: { en: "If Tailspin leaves Azure later, it should remove the ROA at RIPE NCC before it decommissions cip-tailspin.", fr: "Si Tailspin quitte Azure plus tard, elle doit supprimer la ROA auprès du RIPE NCC avant de mettre cip-tailspin hors service." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          In a region with availability zones, a custom IP prefix must be zone-redundant or zonal; it can't be created without a zone. Regional commissioning puts a unified prefix in the CommissionedNoInternetAdvertise state, advertised only from its Azure region, which lets you test the attached resources before Microsoft advertises the range to the internet. When you leave, decommission the range before you modify or delete the ROA, otherwise Microsoft keeps advertising a range that it is no longer authorized to advertise.
        fr: |
          Dans une région dotée de zones de disponibilité, un préfixe d'adresse IP personnalisé doit être redondant interzone ou zonal ; il ne peut pas être créé sans zone. La mise en service régionale place un préfixe unifié dans l'état CommissionedNoInternetAdvertise, publié uniquement depuis sa région Azure, ce qui permet de tester les ressources attachées avant que Microsoft ne publie la plage vers internet. Au départ, mettez la plage hors service avant de modifier ou de supprimer la ROA ; sinon, Microsoft continue de publier une plage qu'il n'est plus autorisé à publier.
      options:
        s1: { en: "In a region with availability zones, the custom prefix must be created zone-redundant or in one zone.", fr: "Dans une région dotée de zones de disponibilité, le préfixe personnalisé doit être créé redondant interzone ou dans une zone." }
        s3: { en: "The order is the reverse: decommission first, then modify or delete the ROA.", fr: "L'ordre est inverse : mettez d'abord hors service, puis modifiez ou supprimez la ROA." }
    references:
      - title: Custom IP address prefix (BYOIP) - Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/custom-ip-address-prefix
      - title: Manage a custom IP address prefix - Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/manage-custom-ip-address-prefix

  # ------------------------------------------------------------------ 10
  - id: az700-qz-12-10
    objective: "1.1.10"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Adatum has a subscription named **Sub1** that contains the following public IP addresses. None of them is associated with a resource.

        | Name | SKU | Region | Tier | Availability zones | Routing preference |
        | --- | --- | --- | --- | --- | --- |
        | pip-a | Standard v2 | West Europe | Regional | Zone-redundant | Microsoft network |
        | pip-b | Standard | West Europe | Regional | Zone-redundant | Internet |
        | pip-c | Standard | West Europe | Global | - | - |
        | pip-d | Standard | North Europe | Regional | Zone-redundant | Microsoft network |
        | pip-e | Standard | West Europe | Regional | Zone 2 | Microsoft network |
        | pip-f | Standard | West Europe | Regional | Zone-redundant | Microsoft network |

        Four resources of Sub1 in West Europe need a public IP address. They are listed in the answer area.

        Which public IP address should you associate with each resource? To answer, drag the appropriate public IP addresses to the correct resources. Each public IP address may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un abonnement nommé **Sub1** qui contient les adresses IP publiques suivantes. Aucune n'est associée à une ressource.

        | Nom | SKU | Région | Niveau | Zones de disponibilité | Préférence de routage |
        | --- | --- | --- | --- | --- | --- |
        | pip-a | Standard v2 | Europe Ouest | Régional | Redondante interzone | Réseau Microsoft |
        | pip-b | Standard | Europe Ouest | Régional | Redondante interzone | Internet |
        | pip-c | Standard | Europe Ouest | Global | - | - |
        | pip-d | Standard | Europe Nord | Régional | Redondante interzone | Réseau Microsoft |
        | pip-e | Standard | Europe Ouest | Régional | Zone 2 | Réseau Microsoft |
        | pip-f | Standard | Europe Ouest | Régional | Redondante interzone | Réseau Microsoft |

        Quatre ressources de Sub1 dans la région Europe Ouest ont besoin d'une adresse IP publique. Elles figurent dans la zone de réponse.

        Quelle adresse IP publique devez-vous associer à chaque ressource ? Pour répondre, faites glisser les adresses IP publiques appropriées vers les ressources correspondantes. Chaque adresse IP publique peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: pipa, text: pip-a }
        - { id: pipb, text: pip-b }
        - { id: pipc, text: pip-c }
        - { id: pipd, text: pip-d }
        - { id: pipe, text: pip-e }
        - { id: pipf, text: pip-f }
      targets:
        - id: natv2
          text: { en: "A StandardV2 NAT gateway for the outbound traffic of a subnet", fr: "Une passerelle NAT StandardV2 pour le trafic sortant d'un sous-réseau" }
        - id: glb
          text: { en: "The frontend of a global (cross-region) load balancer whose home region is West Europe", fr: "La configuration frontale d'un équilibreur de charge global (inter-régions) dont la région d'origine est Europe Ouest" }
        - id: vpn
          text: { en: "The second public IP address of a zone-redundant VPN gateway in active-active mode", fr: "La seconde adresse IP publique d'une passerelle VPN redondante interzone en mode actif-actif" }
        - id: vmz2
          text: { en: "A virtual machine in zone 2, whose public IP address must be pinned to the same zone", fr: "Une machine virtuelle de la zone 2, dont l'adresse IP publique doit être rattachée à la même zone" }
    answer:
      mapping: { natv2: pipa, glb: pipc, vpn: pipf, vmz2: pipe }
    explanation:
      correct:
        en: |
          A StandardV2 NAT gateway accepts only Standard v2 addresses, and Standard v2 addresses work with nothing else. A global load balancer needs a Global tier address, deployed in a home region such as West Europe. A zone-redundant VPN gateway needs zone-redundant Standard addresses, and routing preference Internet isn't supported for VPN gateways, which leaves pip-f. A zonal address shares the fate of its zone, which is what the virtual machine in zone 2 requires.
        fr: |
          Une passerelle NAT StandardV2 n'accepte que des adresses Standard v2, et les adresses Standard v2 ne fonctionnent avec rien d'autre. Un équilibreur de charge global a besoin d'une adresse de niveau Global, déployée dans une région d'origine comme Europe Ouest. Une passerelle VPN redondante interzone a besoin d'adresses Standard redondantes interzone, et la préférence de routage Internet n'est pas prise en charge pour les passerelles VPN : il reste pip-f. Une adresse zonale partage le sort de sa zone, ce que demande la machine virtuelle de la zone 2.
      options:
        pipb: { en: "Routing preference Internet is supported for VMs, scale sets, AKS, NIC-based public load balancers, Application Gateway and Azure Firewall, not for VPN gateways; and it's zone-redundant, not pinned to zone 2.", fr: "La préférence de routage Internet est prise en charge pour les VM, les groupes de machines virtuelles identiques, AKS, les équilibreurs de charge publics basés sur les interfaces réseau, Application Gateway et le Pare-feu Azure, pas pour les passerelles VPN ; et elle est redondante interzone, pas rattachée à la zone 2." }
        pipd: { en: "A public IP address must be in the same region as the resource; pip-d is in North Europe.", fr: "Une adresse IP publique doit se trouver dans la même région que la ressource ; pip-d est en Europe Nord." }
    references:
      - title: Public IP addresses in Azure - Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses
      - title: Reliability in Azure Virtual Network Gateways
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-zone-redundant-vnet-gateways
