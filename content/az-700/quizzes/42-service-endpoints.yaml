chapter: 42-service-endpoints
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-42-01
    objective: "4.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum wants the virtual machines of a virtual network named **VNet1** to reach Azure Key Vault over a virtual network service endpoint.

        On which resource do you enable the Microsoft.KeyVault service endpoint?
      fr: |
        Adatum veut que les machines virtuelles d'un réseau virtuel nommé **VNet1** atteignent Azure Key Vault par un point de terminaison de service de réseau virtuel.

        Sur quelle ressource activez-vous le point de terminaison de service Microsoft.KeyVault ?
    body:
      options:
        - { id: a, text: { en: "On the subnet of VNet1 that contains the virtual machines", fr: "Sur le sous-réseau de VNet1 qui contient les machines virtuelles" } }
        - { id: b, text: { en: "On the network interface of each virtual machine of VNet1", fr: "Sur l'interface réseau de chaque machine virtuelle de VNet1" } }
        - { id: c, text: { en: "On the key vault, in its networking settings", fr: "Sur le coffre de clés, dans ses paramètres de mise en réseau" } }
        - { id: d, text: { en: "On the virtual network gateway of VNet1", fr: "Sur la passerelle de réseau virtuel de VNet1" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A service endpoint is a property of a subnet, enabled per service: every compute resource in that subnet then uses it. Each subnet that needs access enables the endpoint itself, and the resource side is configured separately with a virtual network rule.
        fr: |
          Un point de terminaison de service est une propriété d'un sous-réseau, activée service par service : toutes les ressources de calcul de ce sous-réseau l'utilisent alors. Chaque sous-réseau qui a besoin de l'accès active lui-même le point de terminaison, et le côté ressource se configure séparément avec une règle de réseau virtuel.
      options:
        b: { en: "Service endpoints aren't configured per network interface; the setting belongs to the subnet.", fr: "Les points de terminaison de service ne se configurent pas par interface réseau ; le paramètre appartient au sous-réseau." }
        c: { en: "The key vault's networking settings hold the virtual network rule that allows the subnet; the endpoint itself is enabled on the subnet.", fr: "Les paramètres de mise en réseau du coffre de clés portent la règle de réseau virtuel qui autorise le sous-réseau ; le point de terminaison lui-même s'active sur le sous-réseau." }
        d: { en: "A gateway connects other networks; service endpoints don't apply to traffic from on-premises and aren't set on the gateway.", fr: "Une passerelle connecte d'autres réseaux ; les points de terminaison de service ne s'appliquent pas au trafic local et ne se définissent pas sur la passerelle." }
    references:
      - title: Azure virtual network service endpoints
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview

  # ------------------------------------------------------------------ 2
  - id: az700-qz-42-02
    objective: "4.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has enabled several service endpoints on a subnet named **Subnet-Data**. The security team wants a service endpoint policy that lists the individual resources that Subnet-Data can reach over the service endpoint of one service.

        For which service can you use a service endpoint policy?
      fr: |
        Fabrikam a activé plusieurs points de terminaison de service sur un sous-réseau nommé **Subnet-Data**. L'équipe sécurité veut une stratégie de point de terminaison de service qui liste les ressources que Subnet-Data peut atteindre par le point de terminaison de service d'un service.

        Pour quel service pouvez-vous utiliser une stratégie de point de terminaison de service ?
    body:
      options:
        - { id: a, text: Azure SQL Database }
        - { id: b, text: Azure Key Vault }
        - { id: c, text: { en: "Azure Storage", fr: "Stockage Azure" } }
        - { id: d, text: Azure Cosmos DB }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Service endpoint policies filter the traffic that leaves a subnet over the Microsoft.Storage service endpoint: they're an allow list of storage accounts, resource groups or subscriptions. Azure Storage is the service they support.
        fr: |
          Les stratégies de point de terminaison de service filtrent le trafic qui quitte un sous-réseau par le point de terminaison de service Microsoft.Storage : ce sont des listes d'autorisation de comptes de stockage, de groupes de ressources ou d'abonnements. Stockage Azure est le service qu'elles prennent en charge.
      options:
        a: { en: "Azure SQL Database supports service endpoints (Microsoft.Sql), but not service endpoint policies.", fr: "Azure SQL Database prend en charge les points de terminaison de service (Microsoft.Sql), mais pas les stratégies de point de terminaison de service." }
        b: { en: "Azure Key Vault supports service endpoints (Microsoft.KeyVault), but not service endpoint policies.", fr: "Azure Key Vault prend en charge les points de terminaison de service (Microsoft.KeyVault), mais pas les stratégies de point de terminaison de service." }
        d: { en: "Azure Cosmos DB supports service endpoints (Microsoft.AzureCosmosDB), but not service endpoint policies.", fr: "Azure Cosmos DB prend en charge les points de terminaison de service (Microsoft.AzureCosmosDB), mais pas les stratégies de point de terminaison de service." }
    references:
      - title: Virtual network service endpoint policies for Azure Storage
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoint-policies-overview

  # ------------------------------------------------------------------ 3
  - id: az700-qz-42-03
    objective: "4.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has the following resources in the same Microsoft Entra tenant:

        | Resource | Subscription | Managed by |
        | --- | --- | --- |
        | Subnet **snet-app** of VNet-App, with the Microsoft.Storage service endpoint enabled | Sub-Network | The network team |
        | Storage account **stcontosodocs** | Sub-Data | The storage team |

        A storage administrator who has the Storage Account Contributor role on stcontosodocs tries to add snet-app as a virtual network rule of the storage account. The operation fails with an authorization error.

        You need to allow the administrator to add the rule. The solution must follow the principle of least privilege.

        What should you assign to the administrator at the scope of snet-app?
      fr: |
        Contoso dispose des ressources suivantes dans le même locataire Microsoft Entra :

        | Ressource | Abonnement | Géré par |
        | --- | --- | --- |
        | Sous-réseau **snet-app** de VNet-App, avec le point de terminaison de service Microsoft.Storage activé | Sub-Network | L'équipe réseau |
        | Compte de stockage **stcontosodocs** | Sub-Data | L'équipe stockage |

        Un administrateur du stockage qui a le rôle Storage Account Contributor sur stcontosodocs essaie d'ajouter snet-app comme règle de réseau virtuel du compte de stockage. L'opération échoue avec une erreur d'autorisation.

        Vous devez permettre à l'administrateur d'ajouter la règle. La solution doit respecter le principe du moindre privilège.

        Que devez-vous attribuer à l'administrateur à l'étendue de snet-app ?
    body:
      options:
        - { id: a, text: { en: "The Network Contributor role", fr: "Le rôle Network Contributor" } }
        - { id: b, text: { en: "A custom role that contains `Microsoft.Network/virtualNetworks/subnets/write`", fr: "Un rôle personnalisé qui contient `Microsoft.Network/virtualNetworks/subnets/write`" } }
        - { id: c, text: { en: "The Reader role", fr: "Le rôle Reader" } }
        - { id: d, text: { en: "A custom role that contains `Microsoft.Network/virtualNetworks/subnets/joinViaServiceEndpoint/action`", fr: "Un rôle personnalisé qui contient `Microsoft.Network/virtualNetworks/subnets/joinViaServiceEndpoint/action`" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Adding a subnet to the network rules of a resource requires the `joinViaServiceEndpoint/action` permission on the subnet that is added. The administrator's role is scoped to the storage account, so it grants nothing on snet-app; a custom role with only this action, assigned on snet-app, meets the need with the least privilege.
        fr: |
          Ajouter un sous-réseau aux règles réseau d'une ressource exige l'autorisation `joinViaServiceEndpoint/action` sur le sous-réseau ajouté. Le rôle de l'administrateur a pour étendue le compte de stockage : il n'accorde rien sur snet-app. Un rôle personnalisé qui ne contient que cette action, attribué sur snet-app, répond au besoin avec le moindre privilège.
      options:
        a: { en: "Network Contributor includes the action, but also full management of the network resources: it's more than needed.", fr: "Network Contributor inclut l'action, mais aussi la gestion complète des ressources réseau : c'est plus que nécessaire." }
        b: { en: "`subnets/write` lets the holder change the subnet, which isn't required, and isn't the join action that the rule checks.", fr: "`subnets/write` permet de modifier le sous-réseau, ce qui n'est pas requis, et n'est pas l'action de jonction que vérifie la règle." }
        c: { en: "Reader only reads the subnet; it doesn't include the join action required to add it to a network rule.", fr: "Reader ne fait que lire le sous-réseau ; il n'inclut pas l'action de jonction requise pour l'ajouter à une règle réseau." }
    references:
      - title: Azure virtual network service endpoints
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
      - title: Create a virtual network rule for Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-virtual-networks

  # ------------------------------------------------------------------ 4
  - id: az700-qz-42-04
    objective: "4.2.2"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin has a subnet named **Subnet-Web** in the West Europe region. Subnet-Web is associated with a NAT gateway whose public IP address is 20.61.4.10. A storage account named **sttailspinweb** in West Europe allows only one source: an IP network rule for 20.61.4.10. No service endpoint is enabled on Subnet-Web.

        A network administrator who has the Network Contributor role on the virtual network plans to enable the Microsoft.Storage service endpoint on Subnet-Web.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin dispose d'un sous-réseau nommé **Subnet-Web** dans la région West Europe. Subnet-Web est associé à une passerelle NAT dont l'adresse IP publique est 20.61.4.10. Un compte de stockage nommé **sttailspinweb**, situé en West Europe, n'autorise qu'une source : une règle de réseau IP pour 20.61.4.10. Aucun point de terminaison de service n'est activé sur Subnet-Web.

        Un administrateur réseau qui a le rôle Network Contributor sur le réseau virtuel prévoit d'activer le point de terminaison de service Microsoft.Storage sur Subnet-Web.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "After the endpoint is enabled, the IP network rule for 20.61.4.10 keeps allowing the virtual machines of Subnet-Web to access sttailspinweb.", fr: "Une fois le point de terminaison activé, la règle de réseau IP pour 20.61.4.10 continue d'autoriser les machines virtuelles de Subnet-Web à accéder à sttailspinweb." }
        - id: s2
          text: { en: "The network administrator can enable the endpoint on Subnet-Web without any role assignment on sttailspinweb.", fr: "L'administrateur réseau peut activer le point de terminaison sur Subnet-Web sans aucune attribution de rôle sur sttailspinweb." }
        - id: s3
          text: { en: "The command `az network vnet list-endpoint-services --location westeurope` lists the service endpoints that can be enabled on subnets in West Europe.", fr: "La commande `az network vnet list-endpoint-services --location westeurope` liste les points de terminaison de service qui peuvent être activés sur des sous-réseaux en West Europe." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Once the endpoint is enabled, the subnet's traffic to Azure Storage uses the private IP addresses of the virtual machines as source instead of the NAT gateway's public address, so IP rules for that subnet stop matching; add a virtual network rule at the same time. Enabling the endpoint is a subnet setting that needs write access to the virtual network only, and `list-endpoint-services` shows the endpoints available in a region.
        fr: |
          Une fois le point de terminaison activé, le trafic du sous-réseau vers Stockage Azure utilise comme source les adresses IP privées des machines virtuelles au lieu de l'adresse publique de la passerelle NAT : les règles IP pour ce sous-réseau ne correspondent plus. Ajoutez une règle de réseau virtuel en même temps. Activer le point de terminaison est un paramètre du sous-réseau qui n'exige qu'un accès en écriture au réseau virtuel, et `list-endpoint-services` affiche les points de terminaison disponibles dans une région.
      options:
        s1: { en: "With the endpoint, the source becomes a private address of the subnet, so the IP rule for the NAT address no longer matches.", fr: "Avec le point de terminaison, la source devient une adresse privée du sous-réseau : la règle IP de l'adresse NAT ne correspond plus." }
    references:
      - title: Azure virtual network service endpoints
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
      - title: Firewall rules and network access for Azure Blob, Data Lake, Queue, and Table Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security

  # ------------------------------------------------------------------ 5
  - id: az700-qz-42-05
    objective: "4.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind's storage account **stnwbatch** has public network access set to **Enabled from selected virtual networks and IP addresses**, with a virtual network rule for a subnet named **Subnet-Batch**. During a redesign, an administrator deleted Subnet-Batch, created a new subnet with the same name and address range, and enabled the Microsoft.Storage service endpoint on it.

        The virtual machines of the new Subnet-Batch now receive HTTP 403 errors from stnwbatch. You need to restore their access. No other source must gain access to stnwbatch.

        What should you do?
      fr: |
        Le compte de stockage **stnwbatch** de Northwind a l'accès réseau public réglé sur **Activé à partir des réseaux virtuels et adresses IP sélectionnés**, avec une règle de réseau virtuel pour un sous-réseau nommé **Subnet-Batch**. Lors d'une refonte, un administrateur a supprimé Subnet-Batch, créé un nouveau sous-réseau portant le même nom et la même plage d'adresses, puis activé le point de terminaison de service Microsoft.Storage sur celui-ci.

        Les machines virtuelles du nouveau Subnet-Batch reçoivent maintenant des erreurs HTTP 403 de stnwbatch. Vous devez rétablir leur accès. Aucune autre source ne doit obtenir l'accès à stnwbatch.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add an IP network rule for the address range of Subnet-Batch to stnwbatch.", fr: "Ajouter à stnwbatch une règle de réseau IP pour la plage d'adresses de Subnet-Batch." } }
        - { id: b, text: { en: "Add a virtual network rule for the new Subnet-Batch to stnwbatch.", fr: "Ajouter à stnwbatch une règle de réseau virtuel pour le nouveau Subnet-Batch." } }
        - { id: c, text: { en: "Replace the Microsoft.Storage endpoint of Subnet-Batch with Microsoft.Storage.Global.", fr: "Remplacer le point de terminaison Microsoft.Storage de Subnet-Batch par Microsoft.Storage.Global." } }
        - { id: d, text: { en: "Set the public network access of stnwbatch to Enabled from all networks.", fr: "Régler l'accès réseau public de stnwbatch sur Activé à partir de tous les réseaux." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Deleting a subnet removes it from the network rules of the storage account, and a new subnet with the same name doesn't inherit the access: it must be authorized again. The endpoint is already enabled on the new subnet, so a virtual network rule for it restores the access without opening the account to other sources.
        fr: |
          Supprimer un sous-réseau le retire des règles réseau du compte de stockage, et un nouveau sous-réseau portant le même nom n'hérite pas de l'accès : il faut l'autoriser de nouveau. Le point de terminaison est déjà activé sur le nouveau sous-réseau ; une règle de réseau virtuel pour celui-ci rétablit donc l'accès sans ouvrir le compte à d'autres sources.
      options:
        a: { en: "With a service endpoint, the subnet's traffic uses private source addresses, and IP network rules for that subnet have no effect.", fr: "Avec un point de terminaison de service, le trafic du sous-réseau utilise des adresses sources privées, et les règles de réseau IP pour ce sous-réseau n'ont aucun effet." }
        c: { en: "The account is in the subnet's region and the endpoint already works; the missing piece is the rule on the account.", fr: "Le compte se trouve dans la région du sous-réseau et le point de terminaison fonctionne déjà ; ce qui manque est la règle sur le compte." }
        d: { en: "Allowing all networks restores access but also opens the account to every other source, which isn't allowed.", fr: "Autoriser tous les réseaux rétablit l'accès, mais ouvre aussi le compte à toutes les autres sources, ce qui est interdit." }
    references:
      - title: Create a virtual network rule for Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-virtual-networks
      - title: Firewall rules and network access for Azure Blob, Data Lake, Queue, and Table Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security

  # ------------------------------------------------------------------ 6
  - id: az700-qz-42-06
    objective: "4.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware has a virtual network named **VNet1** in the West Europe region with the following subnets:

        | Subnet | Content | Route table |
        | --- | --- | --- |
        | snet-nva | A network virtual appliance named **NVA1** (10.0.0.4) that inspects the traffic it forwards and applies source NAT to it | None |
        | snet-app | Application virtual machines | 0.0.0.0/0 to the virtual appliance 10.0.0.4 |

        The application virtual machines write to a storage account named **stlitwareapp** in West Europe. You need to meet the following requirements:

        - NVA1 inspects all the traffic from snet-app to stlitwareapp.
        - stlitwareapp accepts connections only from VNet1 and refuses every internet source.
        - No private endpoint is deployed, and costs are minimized.

        What should you do?
      fr: |
        Litware dispose d'un réseau virtuel nommé **VNet1** dans la région West Europe, avec les sous-réseaux suivants :

        | Sous-réseau | Contenu | Table de routage |
        | --- | --- | --- |
        | snet-nva | Une appliance virtuelle réseau nommée **NVA1** (10.0.0.4) qui inspecte le trafic qu'elle transfère et lui applique une NAT source | Aucune |
        | snet-app | Les machines virtuelles de l'application | 0.0.0.0/0 vers l'appliance virtuelle 10.0.0.4 |

        Les machines virtuelles de l'application écrivent dans un compte de stockage nommé **stlitwareapp**, situé en West Europe. Vous devez répondre aux exigences suivantes :

        - NVA1 inspecte tout le trafic de snet-app vers stlitwareapp.
        - stlitwareapp n'accepte que les connexions venant de VNet1 et refuse toutes les sources internet.
        - Aucun point de terminaison privé n'est déployé, et les coûts sont réduits au minimum.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable the Microsoft.Storage service endpoint on snet-app, and add a virtual network rule for snet-app to stlitwareapp.", fr: "Activer le point de terminaison de service Microsoft.Storage sur snet-app, et ajouter à stlitwareapp une règle de réseau virtuel pour snet-app." } }
        - { id: b, text: { en: "Enable the Microsoft.Storage service endpoint on both subnets, and add virtual network rules for both subnets to stlitwareapp.", fr: "Activer le point de terminaison de service Microsoft.Storage sur les deux sous-réseaux, et ajouter à stlitwareapp des règles de réseau virtuel pour les deux." } }
        - { id: c, text: { en: "Enable the Microsoft.Storage service endpoint on snet-nva, and add a virtual network rule for snet-nva to stlitwareapp.", fr: "Activer le point de terminaison de service Microsoft.Storage sur snet-nva, et ajouter à stlitwareapp une règle de réseau virtuel pour snet-nva." } }
        - { id: d, text: { en: "Enable the endpoint on snet-app, allow snet-app on stlitwareapp, and route the Storage service tag to 10.0.0.4.", fr: "Activer le point de terminaison sur snet-app, autoriser snet-app sur stlitwareapp, et router l'étiquette de service Storage vers 10.0.0.4." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          To filter service traffic through a network virtual appliance, enable the service endpoint on the appliance's subnet only, and secure the resource to that subnet. The application traffic follows 0.0.0.0/0 to NVA1, which forwards it with its own address in snet-nva; that traffic then uses the service endpoint, so stlitwareapp sees VNet1's subnet identity and can refuse internet sources.
        fr: |
          Pour filtrer le trafic d'un service par une appliance virtuelle réseau, activez le point de terminaison de service sur le sous-réseau de l'appliance uniquement, et sécurisez la ressource sur ce sous-réseau. Le trafic de l'application suit 0.0.0.0/0 vers NVA1, qui le transfère avec sa propre adresse de snet-nva ; ce trafic utilise alors le point de terminaison de service : stlitwareapp voit l'identité du sous-réseau de VNet1 et peut refuser les sources internet.
      options:
        a: { en: "The endpoint route for the storage prefixes overrides the 0.0.0.0/0 user-defined route, so snet-app traffic bypasses NVA1.", fr: "L'itinéraire du point de terminaison pour les préfixes du stockage l'emporte sur l'itinéraire défini par l'utilisateur 0.0.0.0/0 : le trafic de snet-app contourne NVA1." }
        b: { en: "With an endpoint on snet-app, its storage traffic leaves directly over the endpoint route and is never inspected by NVA1.", fr: "Avec un point de terminaison sur snet-app, son trafic de stockage part directement par l'itinéraire du point de terminaison et n'est jamais inspecté par NVA1." }
        d: { en: "Service endpoint routes take precedence over user-defined routes for the service prefixes, so the extra route doesn't send the traffic to NVA1.", fr: "Les itinéraires du point de terminaison de service l'emportent sur les itinéraires définis par l'utilisateur pour les préfixes du service : l'itinéraire supplémentaire n'envoie pas le trafic vers NVA1." }
    references:
      - title: Azure virtual network service endpoints
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview

  # ------------------------------------------------------------------ 7
  - id: az700-qz-42-07
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum has the following resources in the West Europe region, in a subscription named **Sub-Corp**:

        | Subnet | Virtual network | Configuration |
        | --- | --- | --- |
        | Subnet-App | VNet-A | Microsoft.Storage service endpoint; associated with a service endpoint policy named **sep-corp** that allows all the storage accounts of Sub-Corp |
        | snet-agw | VNet-A | An Application Gateway v2; Microsoft.Storage service endpoint |
        | GatewaySubnet | VNet-A | A VPN gateway with a site-to-site connection to the on-premises network |
        | Subnet-Etl | VNet-B, peered with VNet-A | Microsoft.Storage service endpoint; no service endpoint policy |

        The storage accounts of Adatum and of other organizations allow access from all networks.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose des ressources suivantes dans la région West Europe, dans un abonnement nommé **Sub-Corp** :

        | Sous-réseau | Réseau virtuel | Configuration |
        | --- | --- | --- |
        | Subnet-App | VNet-A | Point de terminaison de service Microsoft.Storage ; associé à une stratégie de point de terminaison de service nommée **sep-corp** qui autorise tous les comptes de stockage de Sub-Corp |
        | snet-agw | VNet-A | Une Application Gateway v2 ; point de terminaison de service Microsoft.Storage |
        | GatewaySubnet | VNet-A | Une passerelle VPN avec une connexion de site à site vers le réseau local |
        | Subnet-Etl | VNet-B, relié par peering à VNet-A | Point de terminaison de service Microsoft.Storage ; aucune stratégie de point de terminaison de service |

        Les comptes de stockage d'Adatum et d'autres organisations autorisent l'accès depuis tous les réseaux.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Virtual machines in Subnet-Etl can write to a storage account that belongs to another organization.", fr: "Les machines virtuelles de Subnet-Etl peuvent écrire dans un compte de stockage qui appartient à une autre organisation." }
        - id: s2
          text: { en: "You can associate sep-corp with snet-agw to limit the storage accounts that the application gateway reaches.", fr: "Vous pouvez associer sep-corp à snet-agw pour limiter les comptes de stockage qu'atteint l'Application Gateway." }
        - id: s3
          text: { en: "sep-corp prevents on-premises servers that connect through the VPN gateway from writing to storage accounts outside Sub-Corp.", fr: "sep-corp empêche les serveurs locaux qui se connectent par la passerelle VPN d'écrire dans des comptes de stockage hors de Sub-Corp." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          A service endpoint policy filters only the traffic of the subnets it's associated with: peered virtual networks need their own policy, so Subnet-Etl still reaches every account. Managed services deployed in a subnet, such as Application Gateway or VPN Gateway, don't support service endpoint policies (Azure SQL Managed Instance is the exception), and policies don't apply to traffic from on-premises.
        fr: |
          Une stratégie de point de terminaison de service ne filtre que le trafic des sous-réseaux auxquels elle est associée : les réseaux virtuels reliés par peering ont besoin de leur propre stratégie ; Subnet-Etl atteint donc toujours tous les comptes. Les services managés déployés dans un sous-réseau, comme Application Gateway ou la passerelle VPN, ne prennent pas en charge les stratégies de point de terminaison de service (Azure SQL Managed Instance est l'exception), et les stratégies ne s'appliquent pas au trafic local.
      options:
        s2: { en: "Managed services such as Application Gateway don't support service endpoint policies on their subnet.", fr: "Les services managés comme Application Gateway ne prennent pas en charge les stratégies de point de terminaison de service sur leur sous-réseau." }
        s3: { en: "Policies apply only to the traffic of the associated subnet; on-premises traffic must be filtered by an appliance or a firewall.", fr: "Les stratégies ne s'appliquent qu'au trafic du sous-réseau associé ; le trafic local doit être filtré par une appliance ou un pare-feu." }
    references:
      - title: Virtual network service endpoint policies for Azure Storage
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoint-policies-overview

  # ------------------------------------------------------------------ 8
  - id: az700-qz-42-08
    objective: "4.2.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam has a storage account named **stfabexchange** in a subscription of its Microsoft Entra tenant. Public network access is set to **Enabled from selected virtual networks and IP addresses**, and no rule exists yet. The following sources must be allowed, and no others:

        | Source | Details |
        | --- | --- |
        | Subnet-Fab | Fabrikam subnet in the same tenant as stfabexchange; the Microsoft.Storage service endpoint is enabled |
        | Subnet-Partner | Subnet of a partner in another Microsoft Entra tenant; the Microsoft.Storage service endpoint is enabled, and the partner granted you the required permission on the subnet |
        | On-premises users | Connected to Azure by a site-to-site VPN; their internet traffic leaves through the public range 198.51.100.16/28 |

        How should you configure access for each source? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un compte de stockage nommé **stfabexchange** dans un abonnement de son locataire Microsoft Entra. L'accès réseau public est réglé sur **Activé à partir des réseaux virtuels et adresses IP sélectionnés**, et aucune règle n'existe encore. Les sources suivantes doivent être autorisées, et aucune autre :

        | Source | Détails |
        | --- | --- |
        | Subnet-Fab | Sous-réseau de Fabrikam dans le même locataire que stfabexchange ; le point de terminaison de service Microsoft.Storage est activé |
        | Subnet-Partner | Sous-réseau d'un partenaire dans un autre locataire Microsoft Entra ; le point de terminaison de service Microsoft.Storage est activé, et le partenaire vous a accordé l'autorisation requise sur le sous-réseau |
        | Utilisateurs locaux | Connectés à Azure par un VPN de site à site ; leur trafic internet sort par la plage publique 198.51.100.16/28 |

        Comment devez-vous configurer l'accès pour chaque source ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Subnet-Fab: [[s1]]

          Subnet-Partner: [[s2]]

          On-premises users: [[s3]]
        fr: |
          Subnet-Fab : [[s1]]

          Subnet-Partner : [[s2]]

          Utilisateurs locaux : [[s3]]
      slots:
        - id: s1
          options:
            - { id: ipr, text: { en: "An IP network rule for the address range of Subnet-Fab", fr: "Une règle de réseau IP pour la plage d'adresses de Subnet-Fab" } }
            - { id: vnr, text: { en: "A virtual network rule for Subnet-Fab", fr: "Une règle de réseau virtuel pour Subnet-Fab" } }
            - { id: rir, text: { en: "A resource instance rule for the virtual machines of Subnet-Fab", fr: "Une règle d'instance de ressource pour les machines virtuelles de Subnet-Fab" } }
        - id: s2
          options:
            - { id: portal, text: { en: "A virtual network rule added in the Azure portal", fr: "Une règle de réseau virtuel ajoutée dans le portail Azure" } }
            - { id: cli, text: { en: "A virtual network rule added with the Azure CLI by using the subnet resource ID", fr: "Une règle de réseau virtuel ajoutée avec Azure CLI à l'aide de l'ID de ressource du sous-réseau" } }
            - { id: rir, text: { en: "A resource instance rule for the partner's virtual machines", fr: "Une règle d'instance de ressource pour les machines virtuelles du partenaire" } }
            - { id: ipr, text: { en: "An IP network rule for the address range of Subnet-Partner", fr: "Une règle de réseau IP pour la plage d'adresses de Subnet-Partner" } }
        - id: s3
          options:
            - { id: gw, text: { en: "A virtual network rule for the GatewaySubnet of the VPN gateway", fr: "Une règle de réseau virtuel pour le GatewaySubnet de la passerelle VPN" } }
            - { id: priv, text: { en: "An IP network rule for the on-premises private address range", fr: "Une règle de réseau IP pour la plage d'adresses privée locale" } }
            - { id: pub, text: { en: "An IP network rule for 198.51.100.16/28", fr: "Une règle de réseau IP pour 198.51.100.16/28" } }
    answer:
      values: { s1: vnr, s2: cli, s3: pub }
    explanation:
      correct:
        en: |
          Subnets that have the Microsoft.Storage endpoint are allowed with virtual network rules, which accept subnets from any subscription, tenant or region. The portal lists only the virtual networks of your own tenant, so a subnet of another tenant is added with PowerShell, the Azure CLI or the REST API by its resource ID. Service endpoints don't cover on-premises traffic: allow the public addresses that this traffic uses with an IP network rule.
        fr: |
          Les sous-réseaux qui ont le point de terminaison Microsoft.Storage s'autorisent par des règles de réseau virtuel, qui acceptent des sous-réseaux de n'importe quel abonnement, locataire ou région. Le portail ne liste que les réseaux virtuels de votre propre locataire : un sous-réseau d'un autre locataire s'ajoute avec PowerShell, Azure CLI ou l'API REST, par son ID de ressource. Les points de terminaison de service ne couvrent pas le trafic local : autorisez les adresses publiques qu'utilise ce trafic par une règle de réseau IP.
      options:
        ipr: { en: "Traffic from a subnet that has a service endpoint uses private source addresses, so IP rules for the subnet have no effect.", fr: "Le trafic d'un sous-réseau doté d'un point de terminaison de service utilise des adresses sources privées : les règles IP pour ce sous-réseau n'ont aucun effet." }
        rir: { en: "Resource instance rules allow specific Azure resource instances of the same tenant, not the virtual machines of a subnet.", fr: "Les règles d'instance de ressource autorisent des instances de ressources Azure précises du même locataire, pas les machines virtuelles d'un sous-réseau." }
        portal: { en: "The portal shows only the virtual networks of the same tenant; the partner's subnet can't be selected there.", fr: "Le portail n'affiche que les réseaux virtuels du même locataire ; le sous-réseau du partenaire n'y est pas sélectionnable." }
        gw: { en: "On-premises traffic doesn't use service endpoints, so a rule for the gateway subnet doesn't match it.", fr: "Le trafic local n'utilise pas les points de terminaison de service : une règle pour le sous-réseau de la passerelle ne lui correspond pas." }
    references:
      - title: Create a virtual network rule for Azure Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-virtual-networks
      - title: Firewall rules and network access for Azure Blob, Data Lake, Queue, and Table Storage
        url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security

  # ------------------------------------------------------------------ 9
  - id: az700-qz-42-09
    objective: "4.2.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Wingtip publishes a multitenant App Service web app named **app-wingtip** through an Application Gateway v2 named **agw-wingtip**. agw-wingtip is deployed in a subnet named **snet-agw** of a virtual network named **VNet-Web**, and its backend pool targets the default host name of app-wingtip. app-wingtip has no private endpoint and no access restriction rule.

        Users can bypass the web application firewall of agw-wingtip by browsing to app-wingtip directly. You need to ensure that app-wingtip accepts requests only from agw-wingtip. The solution must not use private endpoints and must minimize costs.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip publie une application web App Service multilocataire nommée **app-wingtip** au moyen d'une Application Gateway v2 nommée **agw-wingtip**. agw-wingtip est déployée dans un sous-réseau nommé **snet-agw** d'un réseau virtuel nommé **VNet-Web**, et son pool principal cible le nom d'hôte par défaut d'app-wingtip. app-wingtip n'a ni point de terminaison privé ni règle de restriction d'accès.

        Des utilisateurs peuvent contourner le pare-feu d'applications web d'agw-wingtip en accédant directement à app-wingtip. Vous devez faire en sorte qu'app-wingtip n'accepte que les requêtes d'agw-wingtip. La solution ne doit pas utiliser de points de terminaison privés et doit réduire les coûts au minimum.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Associate a service endpoint policy that lists app-wingtip with snet-agw.", fr: "Associer à snet-agw une stratégie de point de terminaison de service qui liste app-wingtip." } }
        - { id: b, text: { en: "Enable the Microsoft.Web service endpoint on snet-agw.", fr: "Activer le point de terminaison de service Microsoft.Web sur snet-agw." } }
        - { id: c, text: { en: "Add an outbound rule to the NSG of snet-agw that allows only the AppService service tag.", fr: "Ajouter au NSG de snet-agw une règle sortante qui n'autorise que l'étiquette de service AppService." } }
        - { id: d, text: { en: "Add an access restriction rule to app-wingtip that allows snet-agw of VNet-Web.", fr: "Ajouter à app-wingtip une règle de restriction d'accès qui autorise snet-agw de VNet-Web." } }
        - { id: e, text: { en: "Connect app-wingtip to snet-agw by using virtual network integration.", fr: "Connecter app-wingtip à snet-agw au moyen de l'intégration au réseau virtuel." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          App Service uses service endpoints to restrict inbound access to a set of subnets. With the Microsoft.Web endpoint on snet-agw, the gateway's requests carry the subnet identity, and a service endpoint-based access restriction rule that allows snet-agw makes the app deny every other source with HTTP 403. The endpoint must be enabled on the network side and used by the service side, and it adds no cost.
        fr: |
          App Service utilise les points de terminaison de service pour restreindre l'accès entrant à un ensemble de sous-réseaux. Avec le point de terminaison Microsoft.Web sur snet-agw, les requêtes de la passerelle portent l'identité du sous-réseau, et une règle de restriction d'accès basée sur le point de terminaison de service qui autorise snet-agw fait refuser par l'application toute autre source avec une erreur HTTP 403. Le point de terminaison doit être activé côté réseau et utilisé côté service, et il n'ajoute aucun coût.
      options:
        a: { en: "Service endpoint policies support only Azure Storage, and managed services such as Application Gateway don't support them.", fr: "Les stratégies de point de terminaison de service ne prennent en charge que Stockage Azure, et les services managés comme Application Gateway ne les prennent pas en charge." }
        c: { en: "An outbound rule on the gateway subnet doesn't stop internet users from reaching the app directly.", fr: "Une règle sortante sur le sous-réseau de la passerelle n'empêche pas les utilisateurs d'internet d'atteindre directement l'application." }
        e: { en: "Virtual network integration handles the app's outbound traffic; it doesn't restrict who can call the app.", fr: "L'intégration au réseau virtuel gère le trafic sortant de l'application ; elle ne restreint pas qui peut appeler l'application." }
    references:
      - title: Set Up Access Restrictions - Azure App Service
        url: https://learn.microsoft.com/en-us/azure/app-service/app-service-ip-restrictions
      - title: Azure virtual network service endpoints
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview

  # ------------------------------------------------------------------ 10
  - id: az700-qz-42-10
    objective: "4.2.4"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Contoso has a subnet named **Subnet-Api** in a virtual network named **VNet1** (10.1.0.0/16) in the West Europe region. VNet1 is peered with **VNet2** (10.2.0.0/16). The Microsoft.Storage and Microsoft.Sql service endpoints are enabled on Subnet-Api, and the target resources allow Subnet-Api through virtual network rules. No route table is associated with Subnet-Api.

        A network security group named **NSG-Api** is associated with Subnet-Api. Its outbound security rules are shown in the following table.

        Answer each prompt by selecting the rule that processes the connection.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un sous-réseau nommé **Subnet-Api** dans un réseau virtuel nommé **VNet1** (10.1.0.0/16), dans la région West Europe. VNet1 est relié par peering à **VNet2** (10.2.0.0/16). Les points de terminaison de service Microsoft.Storage et Microsoft.Sql sont activés sur Subnet-Api, et les ressources cibles autorisent Subnet-Api par des règles de réseau virtuel. Aucune table de routage n'est associée à Subnet-Api.

        Un groupe de sécurité réseau nommé **NSG-Api** est associé à Subnet-Api. Ses règles de sécurité sortantes figurent dans le tableau suivant.

        Répondez à chaque consigne en sélectionnant la règle qui traite la connexion.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "A virtual machine in Subnet-Api connects to a storage account in West Europe on TCP 443.", fr: "Une machine virtuelle de Subnet-Api se connecte à un compte de stockage situé en West Europe sur TCP 443." }
        - id: p2
          text: { en: "A virtual machine in Subnet-Api connects to an Azure SQL Database logical server in West Europe on TCP 1433.", fr: "Une machine virtuelle de Subnet-Api se connecte à un serveur logique Azure SQL Database situé en West Europe sur TCP 1433." }
        - id: p3
          text: { en: "A virtual machine in Subnet-Api connects to a SQL Server virtual machine in VNet2 on TCP 1433.", fr: "Une machine virtuelle de Subnet-Api se connecte à une machine virtuelle SQL Server de VNet2 sur TCP 1433." }
      grid:
        header: [{ en: Priority, fr: Priorité }, { en: Name, fr: Nom }, Port, { en: Protocol, fr: Protocole }, Destination, Action]
        rows:
          - [{ text: "100" }, { text: Allow-Storage, area: r100 }, { text: "443" }, { text: TCP }, { text: Storage.WestEurope }, { text: { en: Allow, fr: Autoriser } }]
          - [{ text: "200" }, { text: Deny-Internet, area: r200 }, { text: { en: Any, fr: Tous } }, { text: { en: Any, fr: Tous } }, { text: Internet }, { text: { en: Deny, fr: Refuser } }]
          - [{ text: "300" }, { text: Allow-Sql, area: r300 }, { text: "1433" }, { text: TCP }, { text: Sql.WestEurope }, { text: { en: Allow, fr: Autoriser } }]
          - [{ text: "65000" }, { text: AllowVnetOutBound, area: r65000 }, { text: { en: Any, fr: Tous } }, { text: { en: Any, fr: Tous } }, { text: VirtualNetwork }, { text: { en: Allow, fr: Autoriser } }]
          - [{ text: "65001" }, { text: AllowInternetOutBound, area: r65001 }, { text: { en: Any, fr: Tous } }, { text: { en: Any, fr: Tous } }, { text: Internet }, { text: { en: Allow, fr: Autoriser } }]
          - [{ text: "65500" }, { text: DenyAllOutBound, area: r65500 }, { text: { en: Any, fr: Tous } }, { text: { en: Any, fr: Tous } }, { text: { en: Any, fr: Tous } }, { text: { en: Deny, fr: Refuser } }]
    answer:
      values: { p1: r100, p2: r200, p3: r65000 }
    explanation:
      correct:
        en: |
          A service endpoint doesn't change the destination: the storage account and the SQL server keep their public IP addresses, and the NSG evaluates rules by priority. Storage traffic matches rule 100 first. The SQL server's public address belongs to the Internet service tag, which includes Azure-owned public IP space, so rule 200 denies the connection before rule 300 is evaluated; Allow-Sql needs a priority lower than 200. Traffic to VNet2 isn't Internet traffic: the peered address space is part of the VirtualNetwork tag, so the default rule 65000 allows it.
        fr: |
          Un point de terminaison de service ne change pas la destination : le compte de stockage et le serveur SQL gardent leurs adresses IP publiques, et le NSG évalue les règles par priorité. Le trafic de stockage correspond d'abord à la règle 100. L'adresse publique du serveur SQL appartient à l'étiquette de service Internet, qui inclut l'espace d'adresses IP publiques détenu par Azure : la règle 200 refuse donc la connexion avant que la règle 300 soit évaluée ; Allow-Sql doit avoir une priorité inférieure à 200. Le trafic vers VNet2 n'est pas du trafic internet : l'espace d'adressage relié par peering fait partie de l'étiquette VirtualNetwork, et la règle par défaut 65000 l'autorise.
      options:
        r300: { en: "Rule 300 matches the SQL traffic, but rule 200, which has a lower number, is processed first and denies it.", fr: "La règle 300 correspond au trafic SQL, mais la règle 200, de numéro inférieur, est traitée en premier et le refuse." }
    references:
      - title: Azure service tags overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview
      - title: Azure virtual network service endpoints
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
