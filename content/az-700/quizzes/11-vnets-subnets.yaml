chapter: 11-vnets-subnets
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-11-01
    objective: "1.1.3"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        You create a subnet named **Subnet1** with the address range 10.40.2.0/28 in a virtual network named **VNet1**.

        How many IP addresses of Subnet1 can Azure assign to resources?
      fr: |
        Vous créez un sous-réseau nommé **Subnet1** avec la plage d'adresses 10.40.2.0/28 dans un réseau virtuel nommé **VNet1**.

        Dans Subnet1, combien d'adresses IP Azure peut-il attribuer à des ressources ?
    body:
      options:
        - { id: a, text: "11" }
        - { id: b, text: "13" }
        - { id: c, text: "14" }
        - { id: d, text: "16" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A /28 contains 16 addresses, and Azure reserves five of them in every subnet: the network address, the default gateway, two addresses that map the Azure DNS service, and the broadcast address. In 10.40.2.0/28, resources can receive 10.40.2.4 to 10.40.2.14, which is 11 addresses.
        fr: |
          Un /28 contient 16 adresses, et Azure en réserve cinq dans chaque sous-réseau : l'adresse réseau, la passerelle par défaut, deux adresses de mappage du service DNS Azure et l'adresse de diffusion. Dans 10.40.2.0/28, les ressources peuvent recevoir 10.40.2.4 à 10.40.2.14, soit 11 adresses.
      options:
        b: { en: "13 would mean three reserved addresses; Azure reserves the first four addresses and the last one.", fr: "13 supposerait trois adresses réservées ; Azure réserve les quatre premières adresses et la dernière." }
        c: { en: "14 is the count of a traditional on-premises subnet (network and broadcast only); Azure also reserves the gateway and two DNS addresses.", fr: "14 est le décompte d'un sous-réseau local classique (réseau et diffusion seulement) ; Azure réserve aussi la passerelle et deux adresses DNS." }
        d: { en: "16 is the size of the range, before the five addresses that Azure reserves in every subnet.", fr: "16 est la taille de la plage, avant les cinq adresses qu'Azure réserve dans chaque sous-réseau." }
    references:
      - title: Azure Virtual Network FAQ
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq

  # ------------------------------------------------------------------ 2
  - id: az700-qz-11-02
    objective: "1.1.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A network engineer at Contoso delegates an empty subnet named **snet-mi** to `Microsoft.Sql/managedInstances` before a managed instance is deployed into it.

        What does this delegation do?
      fr: |
        Un ingénieur réseau de Contoso délègue un sous-réseau vide nommé **snet-mi** à `Microsoft.Sql/managedInstances` avant qu'une instance managée n'y soit déployée.

        Que fait cette délégation ?
    body:
      options:
        - { id: a, text: { en: "It designates snet-mi for the service, which can deploy its instances there and apply the network intent policies it needs.", fr: "Elle désigne snet-mi pour le service, qui peut y déployer ses instances et y appliquer les stratégies d'intention de réseau dont il a besoin." } }
        - { id: b, text: { en: "It gives snet-mi a direct route to Azure SQL Database, and the service then sees private source addresses from snet-mi.", fr: "Elle donne à snet-mi un itinéraire direct vers Azure SQL Database, et le service voit alors des adresses sources privées provenant de snet-mi." } }
        - { id: c, text: { en: "It creates in snet-mi a network interface with a private IP address that maps to a managed instance hosted elsewhere.", fr: "Elle crée dans snet-mi une interface réseau avec une adresse IP privée qui correspond à une instance managée hébergée ailleurs." } }
        - { id: d, text: { en: "It hands the NSG and the route table of snet-mi over to the service, so that you can no longer associate your own.", fr: "Elle confie le NSG et la table de routage de snet-mi au service, si bien que vous ne pouvez plus associer les vôtres." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Delegation designates a subnet for one injected PaaS service. The service can then deploy its instances into the subnet and add the network intent policies (security rules and routes) that it requires, and Azure blocks changes that would break it.
        fr: |
          La délégation désigne un sous-réseau pour un service PaaS injecté. Le service peut alors déployer ses instances dans le sous-réseau et y ajouter les stratégies d'intention de réseau (règles de sécurité et itinéraires) dont il a besoin, et Azure bloque les modifications qui le casseraient.
      options:
        b: { en: "This describes a service endpoint for Microsoft.Sql, a subnet setting unrelated to delegation.", fr: "Cela décrit un point de terminaison de service pour Microsoft.Sql, un paramètre de sous-réseau sans rapport avec la délégation." }
        c: { en: "This describes a private endpoint, and a delegated subnet can't even host private endpoints.", fr: "Cela décrit un point de terminaison privé, et un sous-réseau délégué ne peut même pas héberger de points de terminaison privés." }
        d: { en: "You keep control of the subnet: a delegated subnet still accepts your NSG and route table, within what the service accepts.", fr: "Vous gardez la main sur le sous-réseau : un sous-réseau délégué accepte toujours votre NSG et votre table de routage, dans les limites de ce que le service accepte." }
    references:
      - title: Subnet Delegation in Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/subnet-delegation-overview

  # ------------------------------------------------------------------ 3
  - id: az700-qz-11-03
    objective: "1.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has a virtual network named **VNet-App** in a resource group named **RG-Net**. The address space of VNet-App is 10.10.0.0/16, and it contains three subnets that host virtual machines.

        You need to add the range 10.20.0.0/16 to the address space of VNet-App by using the Azure CLI. The existing subnets must not be affected.

        Which command should you run?
      fr: |
        Fabrikam dispose d'un réseau virtuel nommé **VNet-App** dans un groupe de ressources nommé **RG-Net**. L'espace d'adressage de VNet-App est 10.10.0.0/16, et il contient trois sous-réseaux qui hébergent des machines virtuelles.

        Vous devez ajouter la plage 10.20.0.0/16 à l'espace d'adressage de VNet-App à l'aide d'Azure CLI. Les sous-réseaux existants ne doivent pas être affectés.

        Quelle commande devez-vous exécuter ?
    body:
      options:
        - { id: a, text: "`az network vnet update -g RG-Net -n VNet-App --address-prefixes 10.20.0.0/16`" }
        - { id: b, text: "`az network vnet update -g RG-Net -n VNet-App --address-prefixes 10.10.0.0/16 10.20.0.0/16`" }
        - { id: c, text: "`az network vnet subnet create -g RG-Net --vnet-name VNet-App -n Range2 --address-prefixes 10.20.0.0/16`" }
        - { id: d, text: "`az network vnet create -g RG-Net -n VNet-App --address-prefixes 10.10.0.0/16 10.20.0.0/16`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The list passed to `--address-prefixes` of `az network vnet update` replaces the whole address space of the virtual network. To add a range, you repeat the existing range next to the new one; 10.10.0.0/16 and its subnets are then left unchanged.
        fr: |
          La liste passée à `--address-prefixes` de `az network vnet update` remplace tout l'espace d'adressage du réseau virtuel. Pour ajouter une plage, vous répétez la plage existante à côté de la nouvelle ; 10.10.0.0/16 et ses sous-réseaux restent alors inchangés.
      options:
        a: { en: "This list would replace 10.10.0.0/16 with 10.20.0.0/16, and a range can't be removed while subnets use it: the command fails.", fr: "Cette liste remplacerait 10.10.0.0/16 par 10.20.0.0/16, et une plage ne peut pas être retirée tant que des sous-réseaux l'utilisent : la commande échoue." }
        c: { en: "A subnet range must lie inside the address space of the virtual network; creating a subnet never extends the address space.", fr: "La plage d'un sous-réseau doit se trouver dans l'espace d'adressage du réseau virtuel ; créer un sous-réseau n'étend jamais l'espace d'adressage." }
        d: { en: "`az network vnet create` sends a complete definition of the virtual network, which doesn't include the three existing subnets.", fr: "`az network vnet create` envoie une définition complète du réseau virtuel, qui ne contient pas les trois sous-réseaux existants." }
    references:
      - title: Create, change, or delete an Azure virtual network - Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-virtual-network

  # ------------------------------------------------------------------ 4
  - id: az700-qz-11-04
    objective: "1.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware has a virtual network named **VNet1** with the IPv4 address space 10.1.0.0/16. A subnet named **Subnet1** (10.1.1.0/24) hosts web servers. To make the web servers dual stack, you add the IPv6 range 2001:db8:4a2c::/48 to the address space of VNet1.

        Which IPv6 range should you add to Subnet1?
      fr: |
        Litware dispose d'un réseau virtuel nommé **VNet1** avec l'espace d'adressage IPv4 10.1.0.0/16. Un sous-réseau nommé **Subnet1** (10.1.1.0/24) héberge des serveurs web. Pour passer les serveurs web en double pile, vous ajoutez la plage IPv6 2001:db8:4a2c::/48 à l'espace d'adressage de VNet1.

        Quelle plage IPv6 devez-vous ajouter à Subnet1 ?
    body:
      options:
        - { id: a, text: "2001:db8:4a2c::/48" }
        - { id: b, text: "2001:db8:4a2c:100::/56" }
        - { id: c, text: "2001:db8:4a2c:1::/64" }
        - { id: d, text: "2001:db8:4a2c:1::/120" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          An IPv6 subnet in Azure must be exactly /64, whatever the number of resources it hosts. The IPv6 range of the subnet sits next to its IPv4 range, and 2001:db8:4a2c:1::/64 lies inside the /48 of the virtual network.
        fr: |
          Dans Azure, un sous-réseau IPv6 doit être exactement un /64, quel que soit le nombre de ressources qu'il héberge. La plage IPv6 du sous-réseau s'ajoute à sa plage IPv4, et 2001:db8:4a2c:1::/64 se trouve dans le /48 du réseau virtuel.
      options:
        a: { en: "A /48 is the size of the virtual network range here, and a subnet can't use the whole range: IPv6 subnets must be /64.", fr: "Un /48 est ici la taille de la plage du réseau virtuel, et un sous-réseau ne peut pas en prendre la totalité : les sous-réseaux IPv6 doivent être des /64." }
        b: { en: "A /56 is larger than a /64; Azure accepts only /64 for IPv6 subnets.", fr: "Un /56 est plus grand qu'un /64 ; Azure n'accepte que des /64 pour les sous-réseaux IPv6." }
        d: { en: "A /120 is smaller than a /64; sizing an IPv6 subnet to its number of hosts doesn't apply in Azure.", fr: "Un /120 est plus petit qu'un /64 ; dimensionner un sous-réseau IPv6 selon son nombre d'hôtes ne s'applique pas dans Azure." }
    references:
      - title: Overview of IPv6 for Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/ipv6-overview

  # ------------------------------------------------------------------ 5
  - id: az700-qz-11-05
    objective: "1.1.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders has a virtual network named **VNet1** in West Europe. VNet1 is connected to the on-premises network by a site-to-site VPN. A subnet named **snet-app** hosts application servers and is associated with a NAT gateway whose public IP address is 20.61.10.5.

        The application servers connect to an Azure SQL Database logical server named **sql-nw** in West Europe. The firewall of sql-nw contains a single IP rule, which allows 20.61.10.5. You plan to enable a service endpoint for Microsoft.Sql on snet-app and to make no other change.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un réseau virtuel nommé **VNet1** dans la région Europe Ouest. VNet1 est connecté au réseau local par un VPN de site à site. Un sous-réseau nommé **snet-app** héberge des serveurs d'applications et est associé à une passerelle NAT dont l'adresse IP publique est 20.61.10.5.

        Les serveurs d'applications se connectent à un serveur logique Azure SQL Database nommé **sql-nw** dans la région Europe Ouest. Le pare-feu de sql-nw contient une seule règle IP, qui autorise 20.61.10.5. Vous prévoyez d'activer un point de terminaison de service pour Microsoft.Sql sur snet-app, sans aucune autre modification.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "After the service endpoint is enabled, the connections of the application servers to sql-nw still match the rule that allows 20.61.10.5.", fr: "Une fois le point de terminaison de service activé, les connexions des serveurs d'applications à sql-nw correspondent toujours à la règle qui autorise 20.61.10.5." }
        - id: s2
          text: { en: "TCP connections that the application servers have open to sql-nw can be closed when you enable the service endpoint.", fr: "Les connexions TCP que les serveurs d'applications ont ouvertes vers sql-nw peuvent être fermées quand vous activez le point de terminaison de service." }
        - id: s3
          text: { en: "After the change, servers in the on-premises network can reach sql-nw through the service endpoint of snet-app.", fr: "Après la modification, les serveurs du réseau local peuvent joindre sql-nw via le point de terminaison de service de snet-app." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A service endpoint routes the traffic of the subnet to the service directly, and the service then sees the private addresses of the servers instead of a public address. Open TCP connections to the service are closed during this switch, so plan the change outside critical tasks. Service endpoints apply only to traffic that originates in the subnet, never to on-premises traffic.
        fr: |
          Un point de terminaison de service route directement le trafic du sous-réseau vers le service, qui voit alors les adresses privées des serveurs au lieu d'une adresse publique. Les connexions TCP ouvertes vers le service sont fermées pendant cette bascule : planifiez la modification en dehors des tâches critiques. Les points de terminaison de service ne s'appliquent qu'au trafic issu du sous-réseau, jamais au trafic local.
      options:
        s1: { en: "The source becomes a private address of snet-app, not the NAT gateway address: the IP rule stops matching, and sql-nw needs a virtual network rule for snet-app.", fr: "La source devient une adresse privée de snet-app, et non plus l'adresse de la passerelle NAT : la règle IP ne correspond plus, et sql-nw a besoin d'une règle de réseau virtuel pour snet-app." }
        s3: { en: "Service endpoints can't be used by traffic from on-premises networks; on-premises traffic still needs a public IP rule or a private endpoint.", fr: "Les points de terminaison de service ne peuvent pas être utilisés par le trafic des réseaux locaux ; ce trafic a toujours besoin d'une règle IP publique ou d'un point de terminaison privé." }
    references:
      - title: Azure virtual network service endpoints
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview

  # ------------------------------------------------------------------ 6
  - id: az700-qz-11-06
    objective: "1.1.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum has a virtual network named **VNet-Core** in North Europe. A subnet named **snet-core** (10.30.0.0/23) contains the following resources:

        | Resource | Outbound internet access |
        | --- | --- |
        | 40 web and application virtual machines | A Standard public IP address on each network interface |
        | A network virtual appliance (NVA) virtual machine named **nva1** | None |
        | The frontend of an internal Standard load balancer | Not applicable |
        | Five private endpoints | Not applicable |

        An NSG named **nsg-core** is associated with snet-core. Its rules use two application security groups, **asg-web** and **asg-app**, that contain the web and the application virtual machines. No NAT gateway is associated with snet-core.

        A partner requires that nva1 reach its API from one fixed public address. The web and application virtual machines must keep their current outbound addresses. You want to keep the number of subnets as low as possible.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un réseau virtuel nommé **VNet-Core** dans la région Europe Nord. Un sous-réseau nommé **snet-core** (10.30.0.0/23) contient les ressources suivantes :

        | Ressource | Accès sortant à internet |
        | --- | --- |
        | 40 machines virtuelles web et d'applications | Une adresse IP publique Standard sur chaque interface réseau |
        | Une machine virtuelle d'appliance virtuelle réseau (NVA) nommée **nva1** | Aucun |
        | La configuration IP frontale d'un équilibreur de charge interne Standard | Sans objet |
        | Cinq points de terminaison privés | Sans objet |

        Un NSG nommé **nsg-core** est associé à snet-core. Ses règles utilisent deux groupes de sécurité d'application, **asg-web** et **asg-app**, qui contiennent les machines virtuelles web et d'applications. Aucune passerelle NAT n'est associée à snet-core.

        Un partenaire exige que nva1 appelle son API depuis une adresse publique fixe unique. Les machines virtuelles web et d'applications doivent conserver leurs adresses sortantes actuelles. Vous voulez garder le moins de sous-réseaux possible.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "If you associate a NAT gateway with snet-core to meet the partner requirement, the web and application virtual machines keep using their instance-level public IP addresses for new outbound connections.", fr: "Si vous associez une passerelle NAT à snet-core pour répondre à l'exigence du partenaire, les machines virtuelles web et d'applications continuent d'utiliser leurs adresses IP publiques de niveau instance pour les nouvelles connexions sortantes." }
        - id: s2
          text: { en: "You can deploy an Azure Container Apps environment in snet-core, next to the existing resources, by adding a delegation to Microsoft.App/environments.", fr: "Vous pouvez déployer un environnement Azure Container Apps dans snet-core, à côté des ressources existantes, en ajoutant une délégation à Microsoft.App/environments." }
        - id: s3
          text: { en: "In nsg-core, rules that use asg-web and asg-app can allow different inbound traffic to the web and to the application virtual machines of snet-core.", fr: "Dans nsg-core, des règles qui utilisent asg-web et asg-app peuvent autoriser un trafic entrant différent vers les machines virtuelles web et vers les machines virtuelles d'applications de snet-core." }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          A NAT gateway is a subnet setting, and it takes precedence over instance-level public IP addresses for all new outbound connections of the subnet: meeting the partner requirement without changing the other virtual machines means giving nva1 its own subnet or its own public IP address. Container Apps environments need a dedicated subnet, which a shared subnet can't become while it holds other resources. Inside a shared subnet, application security groups still let NSG rules treat each tier differently.
        fr: |
          Une passerelle NAT est un paramètre de sous-réseau, et elle a priorité sur les adresses IP publiques de niveau instance pour toutes les nouvelles connexions sortantes du sous-réseau : répondre au partenaire sans changer les autres machines virtuelles impose de donner à nva1 son propre sous-réseau ou sa propre adresse IP publique. Les environnements Container Apps exigent un sous-réseau dédié, ce qu'un sous-réseau partagé ne peut pas devenir tant qu'il contient d'autres ressources. Dans un sous-réseau partagé, les groupes de sécurité d'application permettent toujours aux règles de NSG de traiter chaque niveau différemment.
      options:
        s1: { en: "The NAT gateway applies to the whole subnet and overrides instance-level public IP addresses for new connections, so the web and application virtual machines would change outbound address.", fr: "La passerelle NAT s'applique à tout le sous-réseau et prime sur les adresses IP publiques de niveau instance pour les nouvelles connexions : les machines virtuelles web et d'applications changeraient d'adresse sortante." }
        s2: { en: "A Container Apps environment needs a subnet dedicated to it and delegated to Microsoft.App/environments; snet-core already hosts other resources.", fr: "Un environnement Container Apps a besoin d'un sous-réseau qui lui est dédié et délégué à Microsoft.App/environments ; snet-core héberge déjà d'autres ressources." }
    references:
      - title: What Is Azure NAT Gateway?
        url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
      - title: Configure Virtual Networks in Azure Container Apps Environments
        url: https://learn.microsoft.com/en-us/azure/container-apps/custom-virtual-networks

  # ------------------------------------------------------------------ 7
  - id: az700-qz-11-07
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Tailspin Toys is planning a subnet named **snet-orders** in a virtual network named **VNet-Shop**. snet-orders will host only the following resources:

        - A virtual machine scale set that scales between 40 and 115 instances. Each instance has one network interface with one IPv4 configuration, and the scale set never creates extra instances during scale-out or upgrades.
        - An internal Standard load balancer with two frontend IP configurations.
        - Six private endpoints.

        The range of snet-orders won't be changed after the resources are deployed. The design must use as little address space as possible.

        What is the smallest subnet size that you can use for snet-orders?
      fr: |
        Tailspin Toys planifie un sous-réseau nommé **snet-orders** dans un réseau virtuel nommé **VNet-Shop**. snet-orders hébergera uniquement les ressources suivantes :

        - Un groupe de machines virtuelles identiques qui varie entre 40 et 115 instances. Chaque instance a une interface réseau avec une configuration IPv4, et le groupe ne crée jamais d'instances supplémentaires lors des augmentations d'échelle ou des mises à niveau.
        - Un équilibreur de charge interne Standard avec deux configurations IP frontales.
        - Six points de terminaison privés.

        La plage de snet-orders ne sera pas modifiée après le déploiement des ressources. La conception doit utiliser le moins d'espace d'adressage possible.

        Quelle est la plus petite taille de sous-réseau que vous pouvez utiliser pour snet-orders ?
    body:
      options:
        - { id: a, text: "/27" }
        - { id: b, text: "/26" }
        - { id: c, text: "/25" }
        - { id: d, text: "/24" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Size a subnet for the maximum scale: 115 instance addresses, 2 load balancer frontends and 6 private endpoints make 123 addresses. With the 5 addresses that Azure reserves, the subnet needs 128 addresses, which is exactly a /25 (123 usable addresses).
        fr: |
          Un sous-réseau se dimensionne pour l'échelle maximale : 115 adresses d'instances, 2 configurations frontales d'équilibreur de charge et 6 points de terminaison privés font 123 adresses. Avec les 5 adresses réservées par Azure, le sous-réseau a besoin de 128 adresses, soit exactement un /25 (123 adresses utilisables).
      options:
        a: { en: "A /27 leaves 27 usable addresses, less than even the minimum of 40 instances.", fr: "Un /27 laisse 27 adresses utilisables, moins que le minimum de 40 instances." }
        b: { en: "A /26 leaves 59 usable addresses: enough for 40 instances, not for 115. Count the maximum scale, not the current one.", fr: "Un /26 laisse 59 adresses utilisables : assez pour 40 instances, pas pour 115. Comptez l'échelle maximale, pas l'échelle actuelle." }
        d: { en: "A /24 works, but it uses twice the address space that the design needs.", fr: "Un /24 fonctionne, mais il utilise deux fois l'espace d'adressage dont la conception a besoin." }
    references:
      - title: Azure Virtual Network FAQ
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
      - title: Add, change, or delete a subnet
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-subnet

  # ------------------------------------------------------------------ 8
  - id: az700-qz-11-08
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank has a virtual network named **VNet-Web** that contains a subnet named **snet-int** (10.70.4.0/26). snet-int is delegated to Microsoft.Web/serverFarms and is used by the regional virtual network integration of an App Service plan named **ASP1**. No other resource is deployed in snet-int.

        The security team requests several changes to snet-int. The apps of ASP1 must stay integrated with snet-int, and you must not move them to another subnet.

        Which two changes can you make?

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'un réseau virtuel nommé **VNet-Web** qui contient un sous-réseau nommé **snet-int** (10.70.4.0/26). snet-int est délégué à Microsoft.Web/serverFarms et est utilisé par l'intégration au réseau virtuel régionale d'un plan App Service nommé **ASP1**. Aucune autre ressource n'est déployée dans snet-int.

        L'équipe de sécurité demande plusieurs modifications de snet-int. Les applications d'ASP1 doivent rester intégrées à snet-int, et vous ne devez pas les déplacer vers un autre sous-réseau.

        Quelles sont les deux modifications que vous pouvez effectuer ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Associate an NSG whose outbound rules limit the destinations that the apps can reach.", fr: "Associer un NSG dont les règles de trafic sortant limitent les destinations que les applications peuvent joindre." } }
        - { id: b, text: { en: "Deploy a small monitoring virtual machine in snet-int, next to the integration instances.", fr: "Déployer une petite machine virtuelle de supervision dans snet-int, à côté des instances d'intégration." } }
        - { id: c, text: { en: "Associate a route table that sends 0.0.0.0/0 to an Azure Firewall instance in a hub network.", fr: "Associer une table de routage qui envoie 0.0.0.0/0 vers une instance de Pare-feu Azure d'un réseau hub." } }
        - { id: d, text: { en: "Add the second address prefix 10.70.5.0/26 to snet-int to prepare for growth.", fr: "Ajouter le second préfixe d'adresse 10.70.5.0/26 à snet-int pour préparer la croissance." } }
        - { id: e, text: { en: "Extend the range of snet-int to 10.70.4.0/25 while the apps keep running.", fr: "Étendre la plage de snet-int à 10.70.4.0/25 pendant que les applications continuent de tourner." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Delegation doesn't take the subnet away from you: a delegated subnet still accepts an NSG and a route table. For App Service virtual network integration, an NSG on the integration subnet filters the outbound traffic of the apps, and a route table sends that traffic where you want, such as to a firewall.
        fr: |
          La délégation ne vous retire pas le sous-réseau : un sous-réseau délégué accepte toujours un NSG et une table de routage. Pour l'intégration au réseau virtuel d'App Service, un NSG sur le sous-réseau d'intégration filtre le trafic sortant des applications, et une table de routage envoie ce trafic où vous le souhaitez, par exemple vers un pare-feu.
      options:
        b: { en: "Virtual network integration depends on a dedicated subnet: the delegated subnet can't host virtual machines.", fr: "L'intégration au réseau virtuel repose sur un sous-réseau dédié : le sous-réseau délégué ne peut pas héberger de machines virtuelles." }
        d: { en: "Delegated subnets can't use multiple address prefixes; that capability is for virtual machines and scale sets.", fr: "Les sous-réseaux délégués ne peuvent pas utiliser plusieurs préfixes d'adresse ; cette capacité est destinée aux machines virtuelles et aux groupes de machines virtuelles identiques." }
        e: { en: "A subnet range can be changed only when no resource uses the subnet, and the size of an integration subnet can't change after assignment.", fr: "La plage d'un sous-réseau ne se modifie que si aucune ressource n'utilise le sous-réseau, et la taille d'un sous-réseau d'intégration ne change plus après son attribution." }
    references:
      - title: Subnet Delegation in Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/subnet-delegation-overview
      - title: Integrate your app with an Azure virtual network - Azure App Service
        url: https://learn.microsoft.com/en-us/azure/app-service/overview-vnet-integration

  # ------------------------------------------------------------------ 9
  - id: az700-qz-11-09
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso has a virtual network named **VNet-Legacy** that was created in 2024. A subnet named **snet-batch** hosts six virtual machines. The virtual machines have no public IP address, no NSG restricts their outbound traffic, and they reach the internet by using default outbound access.

        A security audit sets the following requirements:

        - No virtual machine in snet-batch may keep a default outbound IP address.
        - The virtual machines must keep calling a partner API that allows one source IP address only. This address must never change.
        - No connection may be initiated from the internet to the virtual machines.
        - Administrative effort must be minimized.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un réseau virtuel nommé **VNet-Legacy** créé en 2024. Un sous-réseau nommé **snet-batch** héberge six machines virtuelles. Les machines virtuelles n'ont pas d'adresse IP publique, aucun NSG ne restreint leur trafic sortant, et elles atteignent internet grâce à l'accès sortant par défaut.

        Un audit de sécurité fixe les exigences suivantes :

        - Aucune machine virtuelle de snet-batch ne doit conserver d'adresse IP sortante par défaut.
        - Les machines virtuelles doivent continuer à appeler une API partenaire qui n'autorise qu'une seule adresse IP source. Cette adresse ne doit jamais changer.
        - Aucune connexion ne doit pouvoir être initiée depuis internet vers les machines virtuelles.
        - L'effort administratif doit être réduit au minimum.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Outbound method for snet-batch: [[method]]

          Setting of snet-batch: [[setting]]

          Action on the virtual machines: [[vms]]
        fr: |
          Méthode sortante pour snet-batch : [[method]]

          Paramètre de snet-batch : [[setting]]

          Action sur les machines virtuelles : [[vms]]
      slots:
        - id: method
          options:
            - { id: natgw, text: { en: "A NAT gateway with one Standard public IP address", fr: "Une passerelle NAT avec une adresse IP publique Standard" } }
            - { id: pervm, text: { en: "A Standard public IP address on each network interface", fr: "Une adresse IP publique Standard sur chaque interface réseau" } }
            - { id: udrnet, text: { en: "A user-defined route 0.0.0.0/0 with the next hop type Internet", fr: "Un itinéraire défini par l'utilisateur 0.0.0.0/0 avec le type de tronçon suivant Internet" } }
        - id: setting
          options:
            - { id: private, text: { en: "Default outbound access set to Disabled (private subnet)", fr: "Accès sortant par défaut défini sur Disabled (sous-réseau privé)" } }
            - { id: nsgdeny, text: { en: "An NSG outbound rule that denies the Internet service tag", fr: "Une règle de trafic sortant de NSG qui refuse l'étiquette de service Internet" } }
            - { id: pepolicy, text: { en: "Network policy for private endpoints set to Network security groups", fr: "Stratégie réseau pour les points de terminaison privés définie sur Network security groups" } }
        - id: vms
          options:
            - { id: dealloc, text: { en: "Stop and deallocate each virtual machine, then start it", fr: "Arrêter et libérer chaque machine virtuelle, puis la démarrer" } }
            - { id: osrestart, text: { en: "Restart each virtual machine from its guest operating system", fr: "Redémarrer chaque machine virtuelle depuis son système d'exploitation invité" } }
            - { id: noaction, text: { en: "No action: the setting applies at once", fr: "Aucune action : le paramètre s'applique immédiatement" } }
    answer:
      values: { method: natgw, setting: private, vms: dealloc }
    explanation:
      correct:
        en: |
          A NAT gateway gives the whole subnet one static outbound address and accepts no connection initiated from the internet; it is the recommended explicit method. Virtual networks created before the change keep non-private subnets, so you set default outbound access to Disabled on snet-batch. The virtual machines must then be stopped and deallocated for the setting to reach their network interfaces and remove their default outbound IP addresses.
        fr: |
          Une passerelle NAT donne à tout le sous-réseau une adresse sortante statique unique et n'accepte aucune connexion initiée depuis internet ; c'est la méthode explicite recommandée. Les réseaux virtuels créés avant le changement conservent des sous-réseaux non privés : vous désactivez donc l'accès sortant par défaut sur snet-batch. Les machines virtuelles doivent ensuite être arrêtées et libérées pour que le paramètre atteigne leurs interfaces réseau et supprime leurs adresses IP sortantes par défaut.
      options:
        pervm: { en: "Six instance-level addresses give six different source addresses, and the partner allows only one.", fr: "Six adresses de niveau instance donnent six adresses sources différentes, alors que le partenaire n'en autorise qu'une." }
        udrnet: { en: "A route with the next hop type Internet provides no fixed address, and such routes break in a private subnet.", fr: "Un itinéraire avec le tronçon suivant Internet ne fournit aucune adresse fixe, et ces itinéraires ne fonctionnent plus dans un sous-réseau privé." }
        nsgdeny: { en: "Denying the Internet service tag would also block the traffic to the partner through the NAT gateway, and it doesn't remove the default outbound IP addresses.", fr: "Refuser l'étiquette de service Internet bloquerait aussi le trafic vers le partenaire via la passerelle NAT, et ne supprime pas les adresses IP sortantes par défaut." }
        pepolicy: { en: "This setting applies NSGs to private endpoints; it has no effect on outbound access.", fr: "Ce paramètre applique les NSG aux points de terminaison privés ; il n'a aucun effet sur l'accès sortant." }
        osrestart: { en: "A restart from the guest operating system doesn't deallocate the virtual machine, so its network interface keeps the default outbound IP address.", fr: "Un redémarrage depuis le système d'exploitation invité ne libère pas la machine virtuelle : son interface réseau conserve l'adresse IP sortante par défaut." }
    references:
      - title: Default Outbound Access in Azure - Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/default-outbound-access

  # ------------------------------------------------------------------ 10
  - id: az700-qz-11-10
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam is planning a shared services virtual network named **VNet-Core** in West Europe. VNet-Core will host the following services:

        - An ExpressRoute virtual network gateway that will connect 16 ExpressRoute circuits.
        - Azure Firewall Premium. All the internet-bound traffic of the firewall must be sent to the on-premises network (forced tunneling).
        - One Azure SQL Managed Instance.

        Each subnet must use the smallest size that its service supports in this plan.

        Which subnets should you plan for each service? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam planifie un réseau virtuel de services partagés nommé **VNet-Core** dans la région Europe Ouest. VNet-Core hébergera les services suivants :

        - Une passerelle de réseau virtuel ExpressRoute qui connectera 16 circuits ExpressRoute.
        - Pare-feu Azure Premium. Tout le trafic du pare-feu destiné à internet doit être envoyé vers le réseau local (tunneling forcé).
        - Une instance Azure SQL Managed Instance.

        Chaque sous-réseau doit utiliser la plus petite taille que son service prend en charge dans ce plan.

        Quels sous-réseaux devez-vous prévoir pour chaque service ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          ExpressRoute gateway: [[gw]]

          Azure Firewall Premium: [[fw]]

          Azure SQL Managed Instance: [[mi]]
        fr: |
          Passerelle ExpressRoute : [[gw]]

          Pare-feu Azure Premium : [[fw]]

          Azure SQL Managed Instance : [[mi]]
      slots:
        - id: gw
          options:
            - { id: gw28, text: { en: "GatewaySubnet, /28", fr: "GatewaySubnet, /28" } }
            - { id: gw27, text: { en: "GatewaySubnet, /27", fr: "GatewaySubnet, /27" } }
            - { id: gw26, text: { en: "GatewaySubnet, /26", fr: "GatewaySubnet, /26" } }
            - { id: anyname26, text: { en: "A /26 subnet with any name, dedicated to the gateway", fr: "Un sous-réseau /26 de nom quelconque, dédié à la passerelle" } }
        - id: fw
          options:
            - { id: fwonly26, text: { en: "AzureFirewallSubnet (/26) only", fr: "AzureFirewallSubnet (/26) uniquement" } }
            - { id: fwonly25, text: { en: "AzureFirewallSubnet (/25) only", fr: "AzureFirewallSubnet (/25) uniquement" } }
            - { id: fwmgmt26, text: { en: "AzureFirewallSubnet (/26) and AzureFirewallManagementSubnet (/26)", fr: "AzureFirewallSubnet (/26) et AzureFirewallManagementSubnet (/26)" } }
            - { id: fwmgmt28, text: { en: "AzureFirewallSubnet (/26) and AzureFirewallManagementSubnet (/28)", fr: "AzureFirewallSubnet (/26) et AzureFirewallManagementSubnet (/28)" } }
        - id: mi
          options:
            - { id: mi28, text: { en: "A /28 subnet delegated to Microsoft.Sql/managedInstances", fr: "Un sous-réseau /28 délégué à Microsoft.Sql/managedInstances" } }
            - { id: mi27, text: { en: "A /27 subnet delegated to Microsoft.Sql/managedInstances", fr: "Un sous-réseau /27 délégué à Microsoft.Sql/managedInstances" } }
            - { id: mi27pe, text: { en: "A /27 subnet without delegation, with a private endpoint for the instance", fr: "Un sous-réseau /27 sans délégation, avec un point de terminaison privé pour l'instance" } }
    answer:
      values: { gw: gw26, fw: fwmgmt26, mi: mi27 }
    explanation:
      correct:
        en: |
          A gateway subnet must be named GatewaySubnet; /27 suits most configurations, but a gateway that connects 16 ExpressRoute circuits needs /26 or larger. Forced tunneling requires the Firewall Management NIC, which uses a second subnet named AzureFirewallManagementSubnet with a minimum size of /26, next to the /26 AzureFirewallSubnet. A SQL managed instance needs a dedicated subnet delegated to Microsoft.Sql/managedInstances, with at least 32 addresses (/27).
        fr: |
          Un sous-réseau de passerelle doit s'appeler GatewaySubnet ; un /27 convient à la plupart des configurations, mais une passerelle qui connecte 16 circuits ExpressRoute a besoin d'un /26 ou plus. Le tunneling forcé exige la carte réseau de gestion du pare-feu (Firewall Management NIC), qui utilise un second sous-réseau nommé AzureFirewallManagementSubnet d'une taille minimale de /26, à côté de l'AzureFirewallSubnet en /26. Une instance managée SQL a besoin d'un sous-réseau dédié, délégué à Microsoft.Sql/managedInstances, d'au moins 32 adresses (/27).
      options:
        gw27: { en: "/27 is enough for most gateways, but not for one that connects 16 ExpressRoute circuits.", fr: "Un /27 suffit à la plupart des passerelles, mais pas à une passerelle qui connecte 16 circuits ExpressRoute." }
        anyname26: { en: "Azure deploys gateway instances only into a subnet named GatewaySubnet.", fr: "Azure ne déploie les instances de passerelle que dans un sous-réseau nommé GatewaySubnet." }
        fwonly26: { en: "Without the management subnet, the firewall can't use the Management NIC that forced tunneling requires.", fr: "Sans le sous-réseau de gestion, le pare-feu ne peut pas utiliser la carte réseau de gestion qu'exige le tunneling forcé." }
        fwmgmt28: { en: "AzureFirewallManagementSubnet has the same minimum size as AzureFirewallSubnet: /26.", fr: "AzureFirewallManagementSubnet a la même taille minimale qu'AzureFirewallSubnet : /26." }
        mi28: { en: "A /28 has 16 addresses; a managed instance needs at least 32.", fr: "Un /28 compte 16 adresses ; une instance managée en exige au moins 32." }
        mi27pe: { en: "A managed instance is injected into a delegated subnet; a private endpoint gives access to it but doesn't host it.", fr: "Une instance managée est injectée dans un sous-réseau délégué ; un point de terminaison privé permet d'y accéder mais ne l'héberge pas." }
    references:
      - title: About ExpressRoute virtual network gateways
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-virtual-network-gateways
      - title: Azure Firewall Management NIC
        url: https://learn.microsoft.com/en-us/azure/firewall/management-nic
