chapter: 13-name-resolution
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-13-01
    objective: "1.2.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You create a public DNS zone named **fabrikam.com** in Azure DNS. You don't add any record yet.

        Which record sets does Azure DNS create in the zone automatically?
      fr: |
        Vous créez une zone DNS publique nommée **fabrikam.com** dans Azure DNS. Vous n'y ajoutez encore aucun enregistrement.

        Quels jeux d'enregistrements Azure DNS crée-t-il automatiquement dans la zone ?
    body:
      options:
        - { id: a, text: { en: "An A record set at the zone apex and a CNAME record set named www", fr: "Un jeu d'enregistrements A à l'apex de la zone et un jeu d'enregistrements CNAME nommé www" } }
        - { id: b, text: { en: "An NS record set at the zone apex and a CAA record set for Azure", fr: "Un jeu d'enregistrements NS à l'apex de la zone et un jeu d'enregistrements CAA pour Azure" } }
        - { id: c, text: { en: "An NS record set and an SOA record set at the zone apex", fr: "Un jeu d'enregistrements NS et un jeu d'enregistrements SOA à l'apex de la zone" } }
        - { id: d, text: { en: "An SOA record set and an MX record set at the zone apex", fr: "Un jeu d'enregistrements SOA et un jeu d'enregistrements MX à l'apex de la zone" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Every zone gets an NS record set and an SOA record set at its apex (`@`). They are created and deleted with the zone and can't be deleted on their own. The NS record set lists the four Azure DNS name servers that you give to the registrar to delegate the domain.
        fr: |
          Chaque zone reçoit un jeu d'enregistrements NS et un jeu d'enregistrements SOA à son apex (`@`). Ils sont créés et supprimés avec la zone et ne peuvent pas être supprimés seuls. Le jeu d'enregistrements NS liste les quatre serveurs de noms Azure DNS que vous donnez au bureau d'enregistrement pour déléguer le domaine.
      options:
        a: { en: "Azure DNS creates no address or alias records: you add A and CNAME record sets yourself.", fr: "Azure DNS ne crée aucun enregistrement d'adresse ni d'alias : vous ajoutez vous-même les jeux d'enregistrements A et CNAME." }
        b: { en: "The apex NS record set is created, but CAA records are optional and created only by you.", fr: "Le jeu d'enregistrements NS de l'apex est bien créé, mais les enregistrements CAA sont facultatifs et créés par vous seul." }
        d: { en: "The SOA record set is created, but MX records are created only when you configure mail for the domain.", fr: "Le jeu d'enregistrements SOA est bien créé, mais les enregistrements MX ne sont créés que lorsque vous configurez la messagerie du domaine." }
    references:
      - title: Overview of DNS zones and records
        url: https://learn.microsoft.com/en-us/azure/dns/dns-zones-records

  # ------------------------------------------------------------------ 2
  - id: az700-qz-13-02
    objective: "1.2.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin has a private DNS zone named **tailspin.internal**. The zone is linked to a virtual network named **VNet1** with autoregistration enabled, and it contains the A records of the 20 virtual machines of VNet1.

        During a test, an administrator edits the link and clears **Enable auto registration**.

        What happens to the 20 A records?
      fr: |
        Tailspin dispose d'une zone DNS privée nommée **tailspin.internal**. La zone est liée à un réseau virtuel nommé **VNet1** avec l'inscription automatique activée, et elle contient les enregistrements A des 20 machines virtuelles de VNet1.

        Lors d'un test, un administrateur modifie le lien et décoche **Enable auto registration**.

        Qu'advient-il des 20 enregistrements A ?
    body:
      options:
        - { id: a, text: { en: "They stay in the zone until each virtual machine is stopped or deleted.", fr: "Ils restent dans la zone jusqu'à l'arrêt ou la suppression de chaque machine virtuelle." } }
        - { id: b, text: { en: "They are deleted from the zone as soon as the change is saved.", fr: "Ils sont supprimés de la zone dès que la modification est enregistrée." } }
        - { id: c, text: { en: "They stay in the zone as manual records that you must now maintain.", fr: "Ils restent dans la zone comme enregistrements manuels que vous devez désormais maintenir." } }
        - { id: d, text: { en: "They stay in the zone until their TTL expires, then they are deleted.", fr: "Ils restent dans la zone jusqu'à l'expiration de leur TTL, puis ils sont supprimés." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Disabling autoregistration on an existing virtual network link immediately deletes every record that was registered through that link. The virtual machines of VNet1 lose their names in the zone until autoregistration is enabled again or records are created manually.
        fr: |
          Désactiver l'inscription automatique sur un lien de réseau virtuel existant supprime immédiatement tous les enregistrements inscrits par ce lien. Les machines virtuelles de VNet1 perdent leur nom dans la zone jusqu'à ce que l'inscription automatique soit réactivée ou que des enregistrements soient créés manuellement.
      options:
        a: { en: "Stopping or deleting a virtual machine removes its record while autoregistration is on; disabling it doesn't wait for that.", fr: "L'arrêt ou la suppression d'une machine virtuelle retire son enregistrement tant que l'inscription automatique est active ; la désactiver n'attend pas cet événement." }
        c: { en: "The registered records aren't converted: they belong to the link and are removed with its registration setting.", fr: "Les enregistrements inscrits ne sont pas convertis : ils appartiennent au lien et disparaissent avec son paramètre d'inscription." }
        d: { en: "The TTL only controls how long resolvers cache an answer; it doesn't schedule the deletion of a record in the zone.", fr: "Le TTL ne fixe que la durée de mise en cache d'une réponse par les résolveurs ; il ne programme pas la suppression d'un enregistrement de la zone." }
    references:
      - title: Azure Private DNS FAQ
        url: https://learn.microsoft.com/en-us/azure/dns/dns-faq-private

  # ------------------------------------------------------------------ 3
  - id: az700-qz-13-03
    objective: "1.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind sets the DNS servers of a virtual network named **VNet1** to **Custom**, with 10.1.0.4 first and 10.1.0.5 second. Both DNS servers are virtual machines in VNet1, and the network interfaces inherit the settings of VNet1.

        How do the virtual machines of VNet1 use the two DNS servers?
      fr: |
        Northwind définit les serveurs DNS d'un réseau virtuel nommé **VNet1** sur **Personnalisé**, avec 10.1.0.4 en premier et 10.1.0.5 en second. Les deux serveurs DNS sont des machines virtuelles de VNet1, et les interfaces réseau héritent des paramètres de VNet1.

        Comment les machines virtuelles de VNet1 utilisent-elles les deux serveurs DNS ?
    body:
      options:
        - { id: a, text: { en: "They alternate between the two servers in round robin to spread the queries.", fr: "Elles alternent entre les deux serveurs à tour de rôle pour répartir les requêtes." } }
        - { id: b, text: { en: "They send each query to both servers and keep the first answer received.", fr: "Elles envoient chaque requête aux deux serveurs et gardent la première réponse reçue." } }
        - { id: c, text: { en: "They use 10.1.0.4, and use 10.1.0.5 only when 10.1.0.4 can't be reached.", fr: "Elles utilisent 10.1.0.4, et n'utilisent 10.1.0.5 que si 10.1.0.4 est injoignable." } }
        - { id: d, text: { en: "They use the server that Azure DHCP measures as the closest to each machine.", fr: "Elles utilisent le serveur que le DHCP d'Azure mesure comme le plus proche de chaque machine." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Custom DNS servers are used in the order of the list, not in round robin. A client uses the first server it can reach, even if that server answers badly, so the order of the list matters. To change it in the portal, remove the addresses and add them back in the order you want.
        fr: |
          Les serveurs DNS personnalisés sont utilisés dans l'ordre de la liste, pas à tour de rôle. Un client utilise le premier serveur qu'il peut joindre, même si ce serveur répond mal : l'ordre de la liste compte donc. Pour le changer dans le portail, supprimez les adresses et ajoutez-les à nouveau dans l'ordre voulu.
      options:
        a: { en: "Azure explicitly doesn't use the custom DNS servers as a round-robin set.", fr: "Azure n'utilise explicitement pas les serveurs DNS personnalisés comme un ensemble à tour de rôle." }
        b: { en: "Clients don't query every server in parallel: the second server is used only as an alternative to the first.", fr: "Les clients n'interrogent pas tous les serveurs en parallèle : le second serveur n'est qu'une solution de remplacement du premier." }
        d: { en: "Azure DHCP only delivers the list in its configured order; it doesn't measure latency or choose a server.", fr: "Le DHCP d'Azure ne fait que distribuer la liste dans l'ordre configuré ; il ne mesure aucune latence et ne choisit aucun serveur." }
    references:
      - title: Create, change, or delete an Azure virtual network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-virtual-network

  # ------------------------------------------------------------------ 4
  - id: az700-qz-13-04
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso hosts the public zone **contoso.com** in Azure DNS. A VPN appliance is reached at `vpn.contoso.com` through a Standard SKU public IP address resource named **pip-vpn1**. Deployments sometimes delete pip-vpn1.

        The name must always return the current address of pip-vpn1 without manual updates. When pip-vpn1 is deleted, the name must stop returning the released address, so that it can't point to a resource of another customer.

        What should you create in contoso.com?
      fr: |
        Contoso héberge la zone publique **contoso.com** dans Azure DNS. Une appliance VPN est joignable à l'adresse `vpn.contoso.com` via une ressource d'adresse IP publique de référence SKU Standard nommée **pip-vpn1**. Des déploiements suppriment parfois pip-vpn1.

        Le nom doit toujours renvoyer l'adresse actuelle de pip-vpn1, sans mise à jour manuelle. Quand pip-vpn1 est supprimée, le nom doit cesser de renvoyer l'adresse libérée, pour qu'il ne puisse pas pointer vers une ressource d'un autre client.

        Que devez-vous créer dans contoso.com ?
    body:
      options:
        - { id: a, text: { en: "An A record set named vpn with the address of pip-vpn1 and a TTL of 60 seconds", fr: "Un jeu d'enregistrements A nommé vpn avec l'adresse de pip-vpn1 et un TTL de 60 secondes" } }
        - { id: b, text: { en: "An alias record set of type A named vpn that targets the pip-vpn1 resource", fr: "Un jeu d'enregistrements d'alias de type A nommé vpn qui cible la ressource pip-vpn1" } }
        - { id: c, text: { en: "A CNAME record set named vpn that points to the DNS name label of pip-vpn1", fr: "Un jeu d'enregistrements CNAME nommé vpn qui pointe vers l'étiquette de nom DNS de pip-vpn1" } }
        - { id: d, text: { en: "A PTR record set for the address of pip-vpn1 in a reverse lookup zone", fr: "Un jeu d'enregistrements PTR pour l'adresse de pip-vpn1 dans une zone de recherche inversée" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          An alias A record set that targets a Standard public IP address follows the resource: it is updated when the address changes, and it becomes an empty record set when the resource is deleted. The name then can't dangle on an address that Azure may assign to someone else.
        fr: |
          Un jeu d'enregistrements d'alias A qui cible une adresse IP publique Standard suit la ressource : il est mis à jour quand l'adresse change, et il devient un jeu d'enregistrements vide quand la ressource est supprimée. Le nom ne peut alors pas rester orphelin sur une adresse qu'Azure pourrait attribuer à quelqu'un d'autre.
      options:
        a: { en: "A static A record keeps the old address after a change or a deletion; a short TTL only shortens caching.", fr: "Un enregistrement A statique conserve l'ancienne adresse après un changement ou une suppression ; un TTL court ne fait que raccourcir la mise en cache." }
        c: { en: "The CNAME stays in the zone after the deletion and points to a DNS name label that another customer can claim.", fr: "Le CNAME reste dans la zone après la suppression et pointe vers une étiquette de nom DNS qu'un autre client peut s'approprier." }
        d: { en: "A PTR record answers reverse lookups (address to name); it doesn't make vpn.contoso.com resolve.", fr: "Un enregistrement PTR répond aux recherches inversées (de l'adresse vers le nom) ; il ne fait pas résoudre vpn.contoso.com." }
    references:
      - title: Azure DNS alias records overview
        url: https://learn.microsoft.com/en-us/azure/dns/dns-alias

  # ------------------------------------------------------------------ 5
  - id: az700-qz-13-05
    objective: "1.2.5"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum hosts the public zone **adatum.com** in Azure DNS. The domain is delegated to the four Azure DNS name servers of the zone. Adatum also has a private DNS zone named **corp.adatum.internal** that is linked to its virtual networks.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum héberge la zone publique **adatum.com** dans Azure DNS. Le domaine est délégué aux quatre serveurs de noms Azure DNS de la zone. Adatum dispose aussi d'une zone DNS privée nommée **corp.adatum.internal**, liée à ses réseaux virtuels.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "To co-host adatum.com with a second DNS provider, you can add the name servers of that provider to the NS record set at the apex of the zone.", fr: "Pour co-héberger adatum.com chez un second fournisseur DNS, vous pouvez ajouter les serveurs de noms de ce fournisseur au jeu d'enregistrements NS de l'apex de la zone." }
        - id: s2
          text: { en: "You can create an SRV record set named _ldap._tcp in corp.adatum.internal.", fr: "Vous pouvez créer un jeu d'enregistrements SRV nommé _ldap._tcp dans corp.adatum.internal." }
        - id: s3
          text: { en: "The second DNS provider can keep its copy of adatum.com up to date by requesting zone transfers (AXFR) from the Azure DNS name servers.", fr: "Le second fournisseur DNS peut tenir à jour sa copie d'adatum.com en demandant des transferts de zone (AXFR) aux serveurs de noms Azure DNS." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          You can add name servers to the apex NS record set (not remove those of Azure DNS), which is how a domain is co-hosted with another provider. Private DNS zones support A, AAAA, CNAME, MX, PTR, SOA, SRV and TXT records. Azure DNS doesn't support zone transfers: the records must be kept in sync through the portal, Azure CLI, PowerShell or the API.
        fr: |
          Vous pouvez ajouter des serveurs de noms au jeu d'enregistrements NS de l'apex (pas retirer ceux d'Azure DNS) : c'est ainsi qu'un domaine est co-hébergé chez un autre fournisseur. Les zones DNS privées prennent en charge les enregistrements A, AAAA, CNAME, MX, PTR, SOA, SRV et TXT. Azure DNS ne prend pas en charge les transferts de zone : les enregistrements doivent être synchronisés par le portail, Azure CLI, PowerShell ou l'API.
      options:
        s3: { en: "Zone transfers (AXFR/IXFR) aren't supported by Azure DNS; a zone file can only be imported with Azure CLI.", fr: "Les transferts de zone (AXFR/IXFR) ne sont pas pris en charge par Azure DNS ; un fichier de zone peut seulement être importé avec Azure CLI." }
    references:
      - title: Overview of DNS zones and records
        url: https://learn.microsoft.com/en-us/azure/dns/dns-zones-records
      - title: Azure DNS FAQ
        url: https://learn.microsoft.com/en-us/azure/dns/dns-faq

  # ------------------------------------------------------------------ 6
  - id: az700-qz-13-06
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove has a virtual network named **VNet-Hub** that is connected to the on-premises network by a site-to-site VPN. VNet-Hub contains two DNS server virtual machines, DNS1 (10.0.2.4) and DNS2 (10.0.2.5). They forward the queries for `onprem.woodgrove.com` to the on-premises DNS servers and all the other queries to 168.63.129.16.

        VNet-Hub also contains:

        - An Application Gateway v2 named **appgw1**, whose backend pool contains the FQDN `app.onprem.woodgrove.com`.
        - A virtual machine named **vm-jump**, whose network interface has its DNS servers set to **Custom** with 10.0.9.4. The server at 10.0.9.4 hosts only the zone `lab.woodgrove.com` and doesn't forward any query.

        A virtual network named **VNet-Spoke1** is peered with VNet-Hub and uses the default (Azure-provided) DNS servers.

        Yesterday, you changed the DNS servers of VNet-Hub from **Default (Azure-provided)** to **Custom** with 10.0.2.4 and 10.0.2.5, then you restarted all the virtual machines of VNet-Hub. You made no other change.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove dispose d'un réseau virtuel nommé **VNet-Hub**, connecté au réseau local par un VPN site à site. VNet-Hub contient deux machines virtuelles serveurs DNS, DNS1 (10.0.2.4) et DNS2 (10.0.2.5). Elles transfèrent les requêtes pour `onprem.woodgrove.com` aux serveurs DNS locaux, et toutes les autres requêtes à 168.63.129.16.

        VNet-Hub contient aussi :

        - Une passerelle Application Gateway v2 nommée **appgw1**, dont le pool principal contient le FQDN `app.onprem.woodgrove.com`.
        - Une machine virtuelle nommée **vm-jump**, dont l'interface réseau a ses serveurs DNS définis sur **Personnalisé** avec 10.0.9.4. Le serveur 10.0.9.4 n'héberge que la zone `lab.woodgrove.com` et ne transfère aucune requête.

        Un réseau virtuel nommé **VNet-Spoke1** est relié par peering à VNet-Hub et utilise les serveurs DNS par défaut (fournis par Azure).

        Hier, vous avez fait passer les serveurs DNS de VNet-Hub de **Par défaut (fourni par Azure)** à **Personnalisé** avec 10.0.2.4 et 10.0.2.5, puis vous avez redémarré toutes les machines virtuelles de VNet-Hub. Vous n'avez fait aucune autre modification.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "appgw1 now resolves app.onprem.woodgrove.com by sending its queries to DNS1 or DNS2.", fr: "appgw1 résout désormais app.onprem.woodgrove.com en envoyant ses requêtes à DNS1 ou DNS2." }
        - id: s2
          text: { en: "Since its restart, vm-jump can resolve app.onprem.woodgrove.com.", fr: "Depuis son redémarrage, vm-jump peut résoudre app.onprem.woodgrove.com." }
        - id: s3
          text: { en: "If you set the DNS servers of VNet-Spoke1 to Custom with 10.0.2.4 and 10.0.2.5 and its virtual machines renew their DHCP lease, they can resolve app.onprem.woodgrove.com.", fr: "Si vous définissez les serveurs DNS de VNet-Spoke1 sur Personnalisé avec 10.0.2.4 et 10.0.2.5 et que ses machines virtuelles renouvellent leur bail DHCP, elles peuvent résoudre app.onprem.woodgrove.com." }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          DNS servers are delivered through DHCP, and resources keep their current DNS settings until they are restarted: this applies to Application Gateway and Azure Firewall as well as to virtual machines, so appgw1 must be restarted. DNS servers set on a network interface override those of the virtual network, so vm-jump still queries only 10.0.9.4. The spoke VMs reach DNS1 and DNS2 through the peering, and those servers forward the on-premises zone.
        fr: |
          Les serveurs DNS sont distribués par DHCP, et les ressources conservent leurs paramètres DNS actuels jusqu'à leur redémarrage : c'est vrai pour Application Gateway et le Pare-feu Azure comme pour les machines virtuelles ; appgw1 doit donc être redémarrée. Les serveurs DNS définis sur une interface réseau remplacent ceux du réseau virtuel : vm-jump n'interroge donc toujours que 10.0.9.4. Les machines virtuelles du spoke joignent DNS1 et DNS2 par le peering, et ces serveurs transfèrent la zone locale.
      options:
        s1: { en: "appgw1 wasn't restarted, so it keeps the Azure-provided DNS settings, which can't resolve the on-premises zone.", fr: "appgw1 n'a pas été redémarrée : elle conserve les paramètres DNS fournis par Azure, qui ne résolvent pas la zone locale." }
        s2: { en: "The Custom setting of the network interface takes precedence over VNet-Hub, and 10.0.9.4 neither hosts nor forwards onprem.woodgrove.com.", fr: "Le paramètre Personnalisé de l'interface réseau prime sur VNet-Hub, et 10.0.9.4 n'héberge ni ne transfère onprem.woodgrove.com." }
    references:
      - title: Create, change, or delete an Azure virtual network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-virtual-network

  # ------------------------------------------------------------------ 7
  - id: az700-qz-13-07
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has the following virtual networks in West Europe:

        | Virtual network | Content | DNS servers |
        | --- | --- | --- |
        | VNet-Identity | DC1 (10.0.1.4) and DC2 (10.0.1.5), domain controllers that run the DNS Server role | Custom: 10.0.1.4, 10.0.1.5 |
        | VNet-App1 | Web servers | Custom: 10.0.1.4, 10.0.1.5 |
        | VNet-App2 | API servers | Custom: 10.0.1.4, 10.0.1.5 |

        VNet-App1 and VNet-App2 are peered with VNet-Identity. DC1 and DC2 host the Active Directory zone `fabrikam.com` and forward all the other queries to 168.63.129.16.

        A private DNS zone named **apps.fabrikam.internal** is linked to VNet-App1 and to VNet-App2, both with autoregistration enabled. The zone contains the A records of all the web and API servers. However, a query for `vm-api1.apps.fabrikam.internal` from a web server returns NXDOMAIN.

        You need the web and API servers to resolve the names of apps.fabrikam.internal. The servers must keep using DC1 and DC2 as their DNS servers. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Fabrikam dispose des réseaux virtuels suivants en West Europe :

        | Réseau virtuel | Contenu | Serveurs DNS |
        | --- | --- | --- |
        | VNet-Identity | DC1 (10.0.1.4) et DC2 (10.0.1.5), contrôleurs de domaine qui exécutent le rôle Serveur DNS | Personnalisé : 10.0.1.4, 10.0.1.5 |
        | VNet-App1 | Serveurs web | Personnalisé : 10.0.1.4, 10.0.1.5 |
        | VNet-App2 | Serveurs d'API | Personnalisé : 10.0.1.4, 10.0.1.5 |

        VNet-App1 et VNet-App2 sont reliés par peering à VNet-Identity. DC1 et DC2 hébergent la zone Active Directory `fabrikam.com` et transfèrent toutes les autres requêtes à 168.63.129.16.

        Une zone DNS privée nommée **apps.fabrikam.internal** est liée à VNet-App1 et à VNet-App2, avec l'inscription automatique activée sur les deux liens. La zone contient les enregistrements A de tous les serveurs web et d'API. Pourtant, une requête pour `vm-api1.apps.fabrikam.internal` émise par un serveur web renvoie NXDOMAIN.

        Vous devez faire en sorte que les serveurs web et d'API résolvent les noms d'apps.fabrikam.internal. Les serveurs doivent continuer à utiliser DC1 et DC2 comme serveurs DNS. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "On DC1 and DC2, add a conditional forwarder for apps.fabrikam.internal that targets 168.63.129.16.", fr: "Sur DC1 et DC2, ajouter un redirecteur conditionnel pour apps.fabrikam.internal qui cible 168.63.129.16." } }
        - { id: b, text: { en: "Add 168.63.129.16 as a third DNS server in the Custom settings of VNet-App1 and VNet-App2.", fr: "Ajouter 168.63.129.16 comme troisième serveur DNS dans les paramètres Personnalisé de VNet-App1 et VNet-App2." } }
        - { id: c, text: { en: "Link apps.fabrikam.internal to VNet-Identity, with autoregistration disabled on the new link.", fr: "Lier apps.fabrikam.internal à VNet-Identity, avec l'inscription automatique désactivée sur le nouveau lien." } }
        - { id: d, text: { en: "Select Allow forwarded traffic on the peerings between VNet-Identity and the two app networks.", fr: "Sélectionner l'autorisation du trafic transféré sur les peerings entre VNet-Identity et les deux réseaux d'applications." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          With custom DNS servers, the query goes to DC1 or DC2, and the DCs forward it to 168.63.129.16 from VNet-Identity. Azure DNS consults only the private zones linked to the virtual network of the server that sends the query, and apps.fabrikam.internal isn't linked to VNet-Identity, so the name is resolved as a public name and doesn't exist. A resolution link (without autoregistration) from the zone to VNet-Identity fixes it, without changing the servers' DNS settings.
        fr: |
          Avec des serveurs DNS personnalisés, la requête part vers DC1 ou DC2, qui la transfèrent à 168.63.129.16 depuis VNet-Identity. Azure DNS ne consulte que les zones privées liées au réseau virtuel du serveur qui envoie la requête ; or apps.fabrikam.internal n'est pas liée à VNet-Identity : le nom est donc résolu comme un nom public et n'existe pas. Un lien de résolution (sans inscription automatique) entre la zone et VNet-Identity corrige le problème, sans modifier les paramètres DNS des serveurs.
      options:
        a: { en: "The DCs already send these queries to 168.63.129.16; the forwarder would still leave from VNet-Identity, which isn't linked to the zone.", fr: "Les contrôleurs de domaine envoient déjà ces requêtes à 168.63.129.16 ; le redirecteur partirait toujours de VNet-Identity, qui n'est pas lié à la zone." }
        b: { en: "Clients use the first reachable DNS server of the list: as long as DC1 answers, 168.63.129.16 is never queried.", fr: "Les clients utilisent le premier serveur DNS joignable de la liste : tant que DC1 répond, 168.63.129.16 n'est jamais interrogé." }
        d: { en: "The DCs are already reachable through the peering; forwarded traffic settings don't change which private zones a query sees.", fr: "Les contrôleurs de domaine sont déjà joignables par le peering ; le paramètre de trafic transféré ne change pas les zones privées que voit une requête." }
    references:
      - title: Azure Private DNS FAQ
        url: https://learn.microsoft.com/en-us/azure/dns/dns-faq-private
      - title: What is Azure DNS Private Resolver?
        url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview

  # ------------------------------------------------------------------ 8
  - id: az700-qz-13-08
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has a virtual network named **VNet-App** that uses Azure-provided DNS. A private DNS zone named `privatelink.blob.core.windows.net`, in a Contoso subscription, is linked to VNet-App with the default settings. The zone contains one A record, `stcontosoapp`, for the private endpoint of the storage account **stcontosoapp** (10.1.5.4).

        The applications in VNet-App must also read blobs from a storage account named **stfabpartner** that belongs to the Microsoft Entra tenant of a partner, Fabrikam. Contoso accesses stfabpartner through its public endpoint, which allows the public IP address of Contoso. Fabrikam has created a private endpoint for stfabpartner in its own network, so the public name `stfabpartner.blob.core.windows.net` is now a CNAME of `stfabpartner.privatelink.blob.core.windows.net`. Contoso has no private endpoint for stfabpartner.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un réseau virtuel nommé **VNet-App** qui utilise le DNS fourni par Azure. Une zone DNS privée nommée `privatelink.blob.core.windows.net`, dans un abonnement de Contoso, est liée à VNet-App avec les paramètres par défaut. La zone contient un enregistrement A, `stcontosoapp`, pour le point de terminaison privé du compte de stockage **stcontosoapp** (10.1.5.4).

        Les applications de VNet-App doivent aussi lire des objets blob d'un compte de stockage nommé **stfabpartner**, qui appartient au locataire Microsoft Entra d'un partenaire, Fabrikam. Contoso accède à stfabpartner par son point de terminaison public, qui autorise l'adresse IP publique de Contoso. Fabrikam a créé un point de terminaison privé pour stfabpartner dans son propre réseau : le nom public `stfabpartner.blob.core.windows.net` est désormais un CNAME de `stfabpartner.privatelink.blob.core.windows.net`. Contoso n'a pas de point de terminaison privé pour stfabpartner.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "With the current configuration, a query from VNet-App for stfabpartner.blob.core.windows.net returns NXDOMAIN.", fr: "Avec la configuration actuelle, une requête émise depuis VNet-App pour stfabpartner.blob.core.windows.net renvoie NXDOMAIN." }
        - id: s2
          text: { en: "After you enable fallback to internet on the link between the zone and VNet-App, a query from VNet-App for stcontosoapp.blob.core.windows.net returns the public IP address of stcontosoapp.", fr: "Après l'activation du repli vers internet sur le lien entre la zone et VNet-App, une requête émise depuis VNet-App pour stcontosoapp.blob.core.windows.net renvoie l'adresse IP publique de stcontosoapp." }
        - id: s3
          text: { en: "After you enable fallback to internet on the link between the zone and VNet-App, a query from VNet-App for stfabpartner.blob.core.windows.net returns the public IP address of stfabpartner.", fr: "Après l'activation du repli vers internet sur le lien entre la zone et VNet-App, une requête émise depuis VNet-App pour stfabpartner.blob.core.windows.net renvoie l'adresse IP publique de stfabpartner." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          The CNAME leads the query into `privatelink.blob.core.windows.net`, which is linked to VNet-App and has no record for stfabpartner: the private zone answers with an authoritative NXDOMAIN. **Enable fallback to internet** (`resolutionPolicy: NxDomainRedirect`) on the virtual network link makes Azure DNS retry such a query as a public name, so stfabpartner resolves to its public address. Names that have a record in the zone, such as stcontosoapp, keep resolving to their private IP address.
        fr: |
          Le CNAME mène la requête dans `privatelink.blob.core.windows.net`, qui est liée à VNet-App et n'a pas d'enregistrement pour stfabpartner : la zone privée répond par un NXDOMAIN faisant autorité. **Enable fallback to internet** (repli vers internet, `resolutionPolicy: NxDomainRedirect`) sur le lien de réseau virtuel fait réessayer une telle requête par Azure DNS comme un nom public : stfabpartner est alors résolu vers son adresse publique. Les noms qui ont un enregistrement dans la zone, comme stcontosoapp, continuent d'être résolus vers leur adresse IP privée.
      options:
        s2: { en: "Fallback applies only when the private zone returns NXDOMAIN; stcontosoapp has a record, so it still resolves to 10.1.5.4.", fr: "Le repli ne s'applique que lorsque la zone privée renvoie NXDOMAIN ; stcontosoapp a un enregistrement, il est donc toujours résolu vers 10.1.5.4." }
    references:
      - title: Fallback to internet for Azure Private DNS zones
        url: https://learn.microsoft.com/en-us/azure/dns/private-dns-fallback

  # ------------------------------------------------------------------ 9
  - id: az700-qz-13-09
    objective: "1.2.7"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware has a DNS private resolver named **dnspr-hub** in a virtual network named **VNet-Hub** in East US. A DNS forwarding ruleset named **RS1** uses the outbound endpoint of dnspr-hub and is linked to the virtual network **VNet-App**, which uses Azure-provided DNS. VNet-Hub is connected to the on-premises network by ExpressRoute.

        The on-premises network has the following DNS servers, all reachable from VNet-Hub:

        - 192.168.1.10 and 192.168.1.11: they host `corp.litware.com` and also resolve internet names.
        - 192.168.1.20: a legacy server that hosts `legacy.litware.com` and listens on port 5353 only.
        - Eight partner DNS servers that host `partner.fabrikam.com`.

        You plan to add forwarding rules to RS1. Each option describes a rule and its goal.

        Which two rules can you add to RS1 and achieve their goal?

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un résolveur DNS privé nommé **dnspr-hub** dans un réseau virtuel nommé **VNet-Hub** en East US. Un ensemble de règles de transfert DNS nommé **RS1** utilise le point de terminaison sortant de dnspr-hub et est lié au réseau virtuel **VNet-App**, qui utilise le DNS fourni par Azure. VNet-Hub est connecté au réseau local par ExpressRoute.

        Le réseau local dispose des serveurs DNS suivants, tous joignables depuis VNet-Hub :

        - 192.168.1.10 et 192.168.1.11 : ils hébergent `corp.litware.com` et résolvent aussi les noms internet.
        - 192.168.1.20 : un ancien serveur qui héberge `legacy.litware.com` et n'écoute que sur le port 5353.
        - Huit serveurs DNS de partenaire qui hébergent `partner.fabrikam.com`.

        Vous prévoyez d'ajouter des règles de transfert à RS1. Chaque option décrit une règle et son objectif.

        Quelles sont les deux règles que vous pouvez ajouter à RS1 et qui atteignent leur objectif ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Domain `corp.litware.com.`, targets 192.168.1.10:53 and 192.168.1.11:53, so that the queries are spread evenly across both servers", fr: "Domaine `corp.litware.com.`, cibles 192.168.1.10:53 et 192.168.1.11:53, pour répartir les requêtes équitablement entre les deux serveurs" } }
        - { id: b, text: { en: "Domain `.`, target 192.168.1.10:53, so that the names that match no linked private zone are resolved on-premises", fr: "Domaine `.`, cible 192.168.1.10:53, pour que les noms qui ne correspondent à aucune zone privée liée soient résolus en local" } }
        - { id: c, text: { en: "Domain `corp.litware.com.`, targets 192.168.1.10:53 and 168.63.129.16:53, so that Azure DNS answers if 192.168.1.10 fails", fr: "Domaine `corp.litware.com.`, cibles 192.168.1.10:53 et 168.63.129.16:53, pour qu'Azure DNS réponde en cas de panne de 192.168.1.10" } }
        - { id: d, text: { en: "Domain `legacy.litware.com.`, target 192.168.1.20:5353, so that the names of the legacy zone are resolved", fr: "Domaine `legacy.litware.com.`, cible 192.168.1.20:5353, pour que les noms de l'ancienne zone soient résolus" } }
        - { id: e, text: { en: "Domain `partner.fabrikam.com.`, all eight partner servers as targets, so that every partner server is used", fr: "Domaine `partner.fabrikam.com.`, les huit serveurs du partenaire comme cibles, pour que chaque serveur du partenaire soit utilisé" } }
    answer: { optionIds: [ b, d ] }
    explanation:
      correct:
        en: |
          A target is an IP address and a port, so a server that listens on 5353 can be a target. The rule `.` is a wildcard that forwards every name not answered by a linked private zone; it works here because its target also resolves internet names, which Azure services depend on.
        fr: |
          Une cible est une adresse IP et un port : un serveur qui écoute sur 5353 peut donc être une cible. La règle `.` est un caractère générique qui transfère tous les noms auxquels aucune zone privée liée ne répond ; elle fonctionne ici car sa cible résout aussi les noms internet, dont dépendent des services Azure.
      options:
        a: { en: "The targets of a rule aren't used in round robin: the first one is used, and the next one only when it doesn't respond.", fr: "Les cibles d'une règle ne sont pas utilisées à tour de rôle : la première est utilisée, et la suivante seulement si elle ne répond pas." }
        c: { en: "168.63.129.16 can't be the target of a forwarding rule: adding it returns an error.", fr: "168.63.129.16 ne peut pas être la cible d'une règle de transfert : l'ajouter renvoie une erreur." }
        e: { en: "A forwarding rule accepts at most six target DNS servers.", fr: "Une règle de transfert accepte au plus six serveurs DNS cibles." }
    references:
      - title: Azure DNS Private Resolver endpoints and rulesets
        url: https://learn.microsoft.com/en-us/azure/dns/private-resolver-endpoints-rulesets
      - title: What is Azure DNS Private Resolver?
        url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview

  # ------------------------------------------------------------------ 10
  - id: az700-qz-13-10
    objective: "1.2.7"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso has a hub-and-spoke network in West Europe. The hub virtual network **VNet-Hub** is connected to the on-premises network by a site-to-site VPN and is peered with 15 spoke virtual networks. All the virtual networks use Azure-provided DNS.

        - The on-premises DNS server 192.168.1.10 hosts the zone `onprem.contoso.com`.
        - A private DNS zone named `azure.contoso.com` is linked to VNet-Hub only.
        - VNet-Hub contains a DNS private resolver named **dnspr-hub** with an inbound endpoint at 10.0.0.4 and one outbound endpoint named **ep-out**.

        The virtual machines in VNet-Hub and in all the spokes must resolve the names of both `onprem.contoso.com` and `azure.contoso.com`. The zone `azure.contoso.com` must not be linked to the spokes, and the DNS server settings of the virtual networks must not change.

        You create two DNS forwarding rulesets: **RS-Hub**, linked to VNet-Hub, and **RS-Spokes**, linked to every spoke.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un réseau hub-and-spoke en West Europe. Le réseau virtuel hub **VNet-Hub** est connecté au réseau local par un VPN site à site et relié par peering à 15 réseaux virtuels spokes. Tous les réseaux virtuels utilisent le DNS fourni par Azure.

        - Le serveur DNS local 192.168.1.10 héberge la zone `onprem.contoso.com`.
        - Une zone DNS privée nommée `azure.contoso.com` est liée à VNet-Hub uniquement.
        - VNet-Hub contient un résolveur DNS privé nommé **dnspr-hub**, avec un point de terminaison entrant à l'adresse 10.0.0.4 et un point de terminaison sortant nommé **ep-out**.

        Les machines virtuelles de VNet-Hub et de tous les spokes doivent résoudre les noms d'`onprem.contoso.com` et d'`azure.contoso.com`. La zone `azure.contoso.com` ne doit pas être liée aux spokes, et les paramètres de serveurs DNS des réseaux virtuels ne doivent pas changer.

        Vous créez deux ensembles de règles de transfert DNS : **RS-Hub**, lié à VNet-Hub, et **RS-Spokes**, lié à chaque spoke.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Rules of RS-Hub: [[hub]]

          Rules of RS-Spokes: [[spokes]]

          Outbound endpoints of the rulesets: [[endpoint]]
        fr: |
          Règles de RS-Hub : [[hub]]

          Règles de RS-Spokes : [[spokes]]

          Points de terminaison sortants des ensembles de règles : [[endpoint]]
      slots:
        - id: hub
          options:
            - { id: h1, text: { en: "`onprem.contoso.com.` to 192.168.1.10:53 only", fr: "`onprem.contoso.com.` vers 192.168.1.10:53 uniquement" } }
            - { id: h2, text: { en: "`onprem.contoso.com.` to 192.168.1.10:53 and `azure.contoso.com.` to 10.0.0.4:53", fr: "`onprem.contoso.com.` vers 192.168.1.10:53 et `azure.contoso.com.` vers 10.0.0.4:53" } }
            - { id: h3, text: { en: "`azure.contoso.com.` to 10.0.0.4:53 only", fr: "`azure.contoso.com.` vers 10.0.0.4:53 uniquement" } }
            - { id: h4, text: { en: "`onprem.contoso.com.` to 10.0.0.4:53 only", fr: "`onprem.contoso.com.` vers 10.0.0.4:53 uniquement" } }
        - id: spokes
          options:
            - { id: s1, text: { en: "`onprem.contoso.com.` to 192.168.1.10:53 only", fr: "`onprem.contoso.com.` vers 192.168.1.10:53 uniquement" } }
            - { id: s2, text: { en: "`onprem.contoso.com.` to 192.168.1.10:53 and `azure.contoso.com.` to 10.0.0.4:53", fr: "`onprem.contoso.com.` vers 192.168.1.10:53 et `azure.contoso.com.` vers 10.0.0.4:53" } }
            - { id: s3, text: { en: "`onprem.contoso.com.` to 192.168.1.10:53 and `azure.contoso.com.` to 168.63.129.16:53", fr: "`onprem.contoso.com.` vers 192.168.1.10:53 et `azure.contoso.com.` vers 168.63.129.16:53" } }
            - { id: s4, text: { en: "`azure.contoso.com.` to 10.0.0.4:53 only", fr: "`azure.contoso.com.` vers 10.0.0.4:53 uniquement" } }
        - id: endpoint
          options:
            - { id: e1, text: { en: "Both rulesets use ep-out", fr: "Les deux ensembles de règles utilisent ep-out" } }
            - { id: e2, text: { en: "Each ruleset uses the outbound endpoint of its own resolver in VNet-Hub", fr: "Chaque ensemble de règles utilise le point de terminaison sortant de son propre résolveur dans VNet-Hub" } }
            - { id: e3, text: { en: "RS-Hub uses ep-out, and RS-Spokes uses the inbound endpoint", fr: "RS-Hub utilise ep-out, et RS-Spokes utilise le point de terminaison entrant" } }
    answer:
      values: { hub: h1, spokes: s2, endpoint: e1 }
    explanation:
      correct:
        en: |
          The hub resolves `azure.contoso.com` through its zone link, so RS-Hub needs only the on-premises rule; a rule that targets the inbound endpoint must never be in a ruleset linked to the network of that endpoint, because the queries would loop. The spokes have no zone link: RS-Spokes forwards `azure.contoso.com` to the inbound endpoint, which resolves it from VNet-Hub, and forwards `onprem.contoso.com` on-premises. An outbound endpoint can serve two rulesets, so both use ep-out.
        fr: |
          Le hub résout `azure.contoso.com` grâce à son lien de zone : RS-Hub n'a donc besoin que de la règle locale ; une règle qui cible le point de terminaison entrant ne doit jamais figurer dans un ensemble de règles lié au réseau de ce point de terminaison, car les requêtes boucleraient. Les spokes n'ont pas de lien de zone : RS-Spokes transfère `azure.contoso.com` vers le point de terminaison entrant, qui le résout depuis VNet-Hub, et transfère `onprem.contoso.com` vers le réseau local. Un point de terminaison sortant peut servir deux ensembles de règles : les deux utilisent donc ep-out.
      options:
        h2: { en: "The rule to 10.0.0.4 in a ruleset linked to VNet-Hub, the network of the inbound endpoint, creates a resolution loop.", fr: "La règle vers 10.0.0.4 dans un ensemble de règles lié à VNet-Hub, le réseau du point de terminaison entrant, crée une boucle de résolution." }
        h3: { en: "It loops for azure.contoso.com and leaves the hub unable to resolve onprem.contoso.com.", fr: "Elle boucle pour azure.contoso.com et laisse le hub incapable de résoudre onprem.contoso.com." }
        h4: { en: "The inbound endpoint resolves from VNet-Hub, where RS-Hub would send the query back to the same endpoint: it loops.", fr: "Le point de terminaison entrant résout depuis VNet-Hub, où RS-Hub renverrait la requête vers le même point de terminaison : elle boucle." }
        s1: { en: "The spokes aren't linked to azure.contoso.com, so without a rule toward the inbound endpoint they can't resolve it.", fr: "Les spokes ne sont pas liés à azure.contoso.com : sans règle vers le point de terminaison entrant, ils ne peuvent pas la résoudre." }
        s3: { en: "168.63.129.16 can't be the target of a forwarding rule.", fr: "168.63.129.16 ne peut pas être la cible d'une règle de transfert." }
        s4: { en: "Without the on-premises rule, the spokes can't resolve onprem.contoso.com.", fr: "Sans la règle locale, les spokes ne peuvent pas résoudre onprem.contoso.com." }
        e2: { en: "A virtual network holds at most one DNS private resolver.", fr: "Un réseau virtuel contient au plus un résolveur DNS privé." }
        e3: { en: "A ruleset is associated with outbound endpoints only; the inbound endpoint receives queries.", fr: "Un ensemble de règles n'est associé qu'à des points de terminaison sortants ; le point de terminaison entrant reçoit des requêtes." }
    references:
      - title: Private resolver architecture
        url: https://learn.microsoft.com/en-us/azure/dns/private-resolver-architecture
      - title: What is Azure DNS Private Resolver?
        url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
