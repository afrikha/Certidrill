chapter: 41-private-link
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-41-01
    objective: "4.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso creates a private endpoint in a subnet named **snet-pe** for the blob service of a general-purpose v2 storage account.

        Which resource does Azure deploy in snet-pe for the private endpoint?
      fr: |
        Contoso crée un point de terminaison privé dans un sous-réseau nommé **snet-pe** pour le service blob d'un compte de stockage v2 universel.

        Quelle ressource Azure déploie-t-il dans snet-pe pour le point de terminaison privé ?
    body:
      options:
        - { id: a, text: { en: "A read-only network interface in snet-pe that has a private IP address of the subnet", fr: "Une interface réseau en lecture seule dans snet-pe, dotée d'une adresse IP privée du sous-réseau" } }
        - { id: b, text: { en: "A route in snet-pe whose next hop type is VirtualNetworkServiceEndpoint for the storage prefixes", fr: "Un itinéraire dans snet-pe dont le type de tronçon suivant est VirtualNetworkServiceEndpoint pour les préfixes du stockage" } }
        - { id: c, text: { en: "An internal load balancer frontend in snet-pe that forwards the traffic to the storage service", fr: "Une configuration frontale d'équilibreur de charge interne dans snet-pe, qui transfère le trafic vers le service de stockage" } }
        - { id: d, text: { en: "A NAT gateway on snet-pe that translates the client addresses into a storage address", fr: "Une passerelle NAT sur snet-pe, qui traduit les adresses des clients en une adresse du stockage" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A private endpoint is a read-only network interface that Azure places in the subnet you choose. It receives a private IP address of that subnet, which stays the same for the lifetime of the endpoint, and it maps to one subresource (here `blob`) of one resource.
        fr: |
          Un point de terminaison privé est une interface réseau en lecture seule qu'Azure place dans le sous-réseau de votre choix. Elle reçoit une adresse IP privée de ce sous-réseau, qui ne change pas pendant toute la durée de vie du point de terminaison, et elle correspond à une sous-ressource (ici `blob`) d'une ressource.
      options:
        b: { en: "A VirtualNetworkServiceEndpoint route is what a service endpoint adds; the destination then stays the public IP address of the service.", fr: "Un itinéraire VirtualNetworkServiceEndpoint est ce qu'ajoute un point de terminaison de service ; la destination reste alors l'adresse IP publique du service." }
        c: { en: "A load balancer frontend belongs to the provider side of a Private Link service, not to the private endpoint that a consumer creates.", fr: "Une configuration frontale d'équilibreur de charge appartient au côté fournisseur d'un service Private Link, pas au point de terminaison privé que crée un consommateur." }
        d: { en: "A private endpoint doesn't use a NAT gateway: clients connect directly to the private IP address of the endpoint's network interface.", fr: "Un point de terminaison privé n'utilise pas de passerelle NAT : les clients se connectent directement à l'adresse IP privée de l'interface réseau du point de terminaison." }
    references:
      - title: What is a private endpoint?
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview

  # ------------------------------------------------------------------ 2
  - id: az700-qz-41-02
    objective: "4.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware created a private endpoint named **PE-Reports** for a key vault that the security team manages. The connection was approved, and applications used it for several months. The security team then removed the private endpoint connection from the key vault.

        What is the connection status of PE-Reports now, and what should you do with it?
      fr: |
        Litware a créé un point de terminaison privé nommé **PE-Reports** pour un coffre de clés géré par l'équipe sécurité. La connexion a été approuvée et les applications l'ont utilisée pendant plusieurs mois. L'équipe sécurité a ensuite supprimé la connexion de point de terminaison privé du coffre de clés.

        Quel est maintenant l'état de la connexion de PE-Reports, et que devez-vous en faire ?
    body:
      options:
        - { id: a, text: { en: "Pending: wait until the security team approves the connection again.", fr: "En attente (Pending) : attendre que l'équipe sécurité approuve de nouveau la connexion." } }
        - { id: b, text: { en: "Rejected: send a new request message from PE-Reports to the security team.", fr: "Rejetée (Rejected) : envoyer un nouveau message de requête depuis PE-Reports à l'équipe sécurité." } }
        - { id: c, text: { en: "Disconnected: delete PE-Reports, because it can no longer carry traffic.", fr: "Déconnectée (Disconnected) : supprimer PE-Reports, car il ne peut plus transporter de trafic." } }
        - { id: d, text: { en: "Approved: the traffic continues until you delete PE-Reports yourself.", fr: "Approuvée (Approved) : le trafic continue jusqu'à ce que vous supprimiez vous-même PE-Reports." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          When the owner of the private-link resource removes the connection, the private endpoint goes to the Disconnected state. It becomes informative only and should be deleted for cleanup; only an Approved connection carries traffic, so a new private endpoint is needed if access must be restored.
        fr: |
          Quand le propriétaire de la ressource de liaison privée supprime la connexion, le point de terminaison privé passe à l'état Déconnectée (Disconnected). Il ne sert plus qu'à titre informatif et doit être supprimé ; seule une connexion Approuvée transporte du trafic : il faut donc un nouveau point de terminaison privé pour rétablir l'accès.
      options:
        a: { en: "Pending is the state of a manual request that the owner hasn't processed yet, not of a connection that the owner removed.", fr: "En attente est l'état d'une demande manuelle que le propriétaire n'a pas encore traitée, pas celui d'une connexion qu'il a supprimée." }
        b: { en: "Rejected is the result of the owner rejecting a request; here the owner removed an approved connection.", fr: "Rejetée résulte du rejet d'une demande par le propriétaire ; ici, le propriétaire a supprimé une connexion approuvée." }
        d: { en: "Once the owner removes the connection, it's no longer Approved, and only an Approved connection can send traffic.", fr: "Dès que le propriétaire supprime la connexion, celle-ci n'est plus Approuvée, et seule une connexion Approuvée peut envoyer du trafic." }
    references:
      - title: What is a private endpoint?
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview

  # ------------------------------------------------------------------ 3
  - id: az700-qz-41-03
    objective: "4.1.5"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam has a general-purpose v2 storage account named **stfabsales**. An approved private endpoint for its `blob` subresource is in a virtual network named **VNet-A**. The private DNS zone `privatelink.blob.core.windows.net` contains the A record of the private endpoint and is linked only to VNet-A.

        A virtual network named **VNet-B** is peered with VNet-A. The virtual machines of both networks use Azure-provided DNS.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un compte de stockage v2 universel nommé **stfabsales**. Un point de terminaison privé approuvé pour sa sous-ressource `blob` se trouve dans un réseau virtuel nommé **VNet-A**. La zone DNS privée `privatelink.blob.core.windows.net` contient l'enregistrement A du point de terminaison privé et n'est liée qu'à VNet-A.

        Un réseau virtuel nommé **VNet-B** est relié par peering à VNet-A. Les machines virtuelles des deux réseaux utilisent le DNS fourni par Azure.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A virtual machine in VNet-A that resolves `stfabsales.blob.core.windows.net` receives the private IP address of the private endpoint.", fr: "Une machine virtuelle de VNet-A qui résout `stfabsales.blob.core.windows.net` reçoit l'adresse IP privée du point de terminaison privé." }
        - id: s2
          text: { en: "A virtual machine in VNet-B that resolves `stfabsales.blob.core.windows.net` receives the private IP address of the private endpoint, because VNet-B is peered with VNet-A.", fr: "Une machine virtuelle de VNet-B qui résout `stfabsales.blob.core.windows.net` reçoit l'adresse IP privée du point de terminaison privé, car VNet-B est relié par peering à VNet-A." }
        - id: s3
          text: { en: "Applications in VNet-A must connect to `stfabsales.privatelink.blob.core.windows.net` instead of `stfabsales.blob.core.windows.net` to use the private endpoint.", fr: "Les applications de VNet-A doivent se connecter à `stfabsales.privatelink.blob.core.windows.net` au lieu de `stfabsales.blob.core.windows.net` pour utiliser le point de terminaison privé." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Public DNS answers the usual name with a CNAME to the `privatelink` name. Azure DNS returns the A record of the private zone only for queries that come from a virtual network linked to the zone: VNet-A gets the private IP address. VNet-B isn't linked, so its VMs resolve the public IP address; peering doesn't share private DNS zones, a virtual network link is needed.
        fr: |
          Le DNS public répond au nom habituel par un CNAME vers le nom `privatelink`. Azure DNS ne renvoie l'enregistrement A de la zone privée qu'aux requêtes qui viennent d'un réseau virtuel lié à la zone : VNet-A obtient l'adresse IP privée. VNet-B n'est pas lié ; ses machines virtuelles résolvent donc l'adresse IP publique. Le peering ne partage pas les zones DNS privées : il faut un lien de réseau virtuel.
      options:
        s2: { en: "Private DNS zones are visible only to linked virtual networks. Link the zone to VNet-B to get the private answer there.", fr: "Les zones DNS privées ne sont visibles que des réseaux virtuels liés. Liez la zone à VNet-B pour y obtenir la réponse privée." }
        s3: { en: "Clients keep the usual name; the CNAME chain leads to the privatelink name, so no connection string change is needed.", fr: "Les clients gardent le nom habituel ; la chaîne de CNAME mène au nom privatelink : aucune modification de chaîne de connexion n'est nécessaire." }
    references:
      - title: Azure Private Endpoint DNS Integration Scenarios
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration

  # ------------------------------------------------------------------ 4
  - id: az700-qz-41-04
    objective: "4.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has a hub virtual network named **VNet-Hub** and three spoke virtual networks, each peered with VNet-Hub. A single private DNS zone named `privatelink.database.windows.net` is linked to the four virtual networks, which use Azure-provided DNS.

        Applications in the three spokes will connect to an Azure SQL Database logical server named **sql-adatum** through Private Link, and public network access to sql-adatum will be disabled. The solution must avoid duplicate or conflicting DNS records and must minimize costs.

        How should you plan the private endpoints for sql-adatum?
      fr: |
        Adatum dispose d'un réseau virtuel hub nommé **VNet-Hub** et de trois réseaux virtuels spoke, chacun relié par peering à VNet-Hub. Une seule zone DNS privée nommée `privatelink.database.windows.net` est liée aux quatre réseaux virtuels, qui utilisent le DNS fourni par Azure.

        Les applications des trois spokes se connecteront à un serveur logique Azure SQL Database nommé **sql-adatum** via Private Link, et l'accès réseau public à sql-adatum sera désactivé. La solution doit éviter les enregistrements DNS en double ou en conflit et réduire les coûts au minimum.

        Comment devez-vous planifier les points de terminaison privés de sql-adatum ?
    body:
      options:
        - { id: a, text: { en: "Create one private endpoint in VNet-Hub, and let the spokes reach it over their peerings.", fr: "Créer un point de terminaison privé dans VNet-Hub, et laisser les spokes l'atteindre via leurs peerings." } }
        - { id: b, text: { en: "Create one private endpoint in each spoke, each with a DNS zone group that uses the shared zone.", fr: "Créer un point de terminaison privé dans chaque spoke, chacun avec un groupe de zones DNS qui utilise la zone partagée." } }
        - { id: c, text: { en: "Create one private endpoint in each spoke, and replace the shared zone with one zone per spoke.", fr: "Créer un point de terminaison privé dans chaque spoke, et remplacer la zone partagée par une zone par spoke." } }
        - { id: d, text: { en: "Create three private endpoints in VNet-Hub, each in a separate subnet dedicated to one spoke.", fr: "Créer trois points de terminaison privés dans VNet-Hub, chacun dans un sous-réseau distinct dédié à un spoke." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          For networks that share one DNS configuration, the recommended practice is a single private endpoint per private-link resource, which avoids duplicate entries or conflicts in DNS resolution. Clients in regionally peered virtual networks reach a private endpoint in the hub, and one endpoint also costs less than three.
        fr: |
          Pour des réseaux qui partagent une même configuration DNS, la pratique recommandée est un seul point de terminaison privé par ressource de liaison privée, ce qui évite les entrées en double ou les conflits de résolution DNS. Les clients des réseaux virtuels reliés par peering dans la même région atteignent un point de terminaison privé situé dans le hub, et un seul point de terminaison coûte moins cher que trois.
      options:
        b: { en: "Three endpoints of the same server register the same name in one shared zone: the records conflict, and you pay for three endpoints.", fr: "Trois points de terminaison du même serveur inscrivent le même nom dans une seule zone partagée : les enregistrements entrent en conflit, et vous payez trois points de terminaison." }
        c: { en: "Separate zones with the same name require manual merging of records, and three endpoints cost more than one reachable endpoint.", fr: "Des zones distinctes portant le même nom exigent de fusionner les enregistrements à la main, et trois points de terminaison coûtent plus cher qu'un seul point de terminaison accessible." }
        d: { en: "Several endpoints for one resource in networks that share DNS create duplicate records, and the spokes can already reach one endpoint.", fr: "Plusieurs points de terminaison pour une même ressource dans des réseaux qui partagent le DNS créent des enregistrements en double, et les spokes peuvent déjà atteindre un seul point de terminaison." }
    references:
      - title: What is a private endpoint?
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
      - title: Azure Private Endpoint DNS Integration Scenarios
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration

  # ------------------------------------------------------------------ 5
  - id: az700-qz-41-05
    objective: "4.1.2"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove's finance team created a private endpoint for a storage account named **stwgarchive** in the resource group **RG-Archive**. You manage stwgarchive. The finance team has no permissions on the storage account, so the private endpoint connection, named **pe-finance.7f3c**, is in the Pending state.

        You need to approve the connection by using the Azure CLI.

        How should you complete the command? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe finance de Woodgrove a créé un point de terminaison privé pour un compte de stockage nommé **stwgarchive**, dans le groupe de ressources **RG-Archive**. Vous gérez stwgarchive. L'équipe finance n'a aucune autorisation sur le compte de stockage ; la connexion de point de terminaison privé, nommée **pe-finance.7f3c**, est donc à l'état En attente (Pending).

        Vous devez approuver la connexion à l'aide d'Azure CLI.

        Comment devez-vous compléter la commande ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        az network [[grp]] [[verb]] \
          --resource-group RG-Archive \
          --resource-name stwgarchive \
          --type [[type]] \
          --name pe-finance.7f3c \
          --description "Approved for the finance team"
      slots:
        - id: grp
          options:
            - { id: pec, text: private-endpoint-connection }
            - { id: pe, text: private-endpoint }
            - { id: pls, text: private-link-service }
            - { id: sub, text: vnet subnet }
        - id: verb
          options:
            - { id: approve, text: approve }
            - { id: update, text: update }
            - { id: create, text: create }
        - id: type
          options:
            - { id: st, text: Microsoft.Storage/storageAccounts }
            - { id: pep, text: Microsoft.Network/privateEndpoints }
            - { id: plsv, text: Microsoft.Network/privateLinkServices }
    answer:
      values: { grp: pec, verb: approve, type: st }
    explanation:
      correct:
        en: |
          The resource owner manages requests with `az network private-endpoint-connection`, whose `approve` command takes the connection name and identifies the target resource by its group, name and `--type`. The type is the type of the private-link resource that receives the request, here `Microsoft.Storage/storageAccounts`, not the type of the private endpoint.
        fr: |
          Le propriétaire de la ressource gère les demandes avec `az network private-endpoint-connection`, dont la commande `approve` prend le nom de la connexion et identifie la ressource cible par son groupe, son nom et `--type`. Le type est celui de la ressource de liaison privée qui reçoit la demande, ici `Microsoft.Storage/storageAccounts`, et non celui du point de terminaison privé.
      options:
        pe: { en: "`az network private-endpoint` manages the endpoint on the consumer side; it doesn't approve connections on the target resource.", fr: "`az network private-endpoint` gère le point de terminaison côté consommateur ; il n'approuve pas les connexions sur la ressource cible." }
        pls: { en: "`az network private-link-service` manages your own Private Link services, not a storage account.", fr: "`az network private-link-service` gère vos propres services Private Link, pas un compte de stockage." }
        pep: { en: "`--type` names the resource that receives the connection request, not the private endpoint.", fr: "`--type` désigne la ressource qui reçoit la demande de connexion, pas le point de terminaison privé." }
    references:
      - title: az network private-endpoint-connection
        url: https://learn.microsoft.com/en-us/cli/azure/network/private-endpoint-connection

  # ------------------------------------------------------------------ 6
  - id: az700-qz-41-06
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin has the following virtual networks in the West Europe region. The three virtual networks are peered with each other.

        | Virtual network | Address space | Content |
        | --- | --- | --- |
        | VNet-Hub | 10.0.0.0/16 | An Azure Firewall with the private IP address 10.0.1.4 |
        | VNet-Data | 10.20.0.0/16 | A subnet named **snet-pe** that contains private endpoints for Azure SQL Database and Azure Storage |
        | VNet-App | 10.30.0.0/16 | A subnet named **snet-app** that contains application virtual machines |

        The network policy for private endpoints of snet-pe is set to **Enabled**. snet-app is associated with a route table named **RT-App** that contains one route: 0.0.0.0/0, with the next hop type **Virtual appliance** and the next hop address 10.0.1.4. The firewall allows the application traffic by using application rules.

        The firewall logs show the internet traffic of snet-app, but none of its traffic to the private endpoints. You need to ensure that the firewall inspects all the traffic from snet-app to the private endpoints of snet-pe, including private endpoints that will be added later. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Tailspin dispose des réseaux virtuels suivants dans la région West Europe. Les trois réseaux virtuels sont reliés par peering entre eux.

        | Réseau virtuel | Espace d'adressage | Contenu |
        | --- | --- | --- |
        | VNet-Hub | 10.0.0.0/16 | Un Pare-feu Azure dont l'adresse IP privée est 10.0.1.4 |
        | VNet-Data | 10.20.0.0/16 | Un sous-réseau nommé **snet-pe** qui contient des points de terminaison privés pour Azure SQL Database et Stockage Azure |
        | VNet-App | 10.30.0.0/16 | Un sous-réseau nommé **snet-app** qui contient les machines virtuelles de l'application |

        La stratégie réseau des points de terminaison privés de snet-pe vaut **Enabled**. snet-app est associé à une table de routage nommée **RT-App** qui contient un seul itinéraire : 0.0.0.0/0, avec le type de tronçon suivant **Appliance virtuelle** et l'adresse de tronçon suivant 10.0.1.4. Le pare-feu autorise le trafic de l'application au moyen de règles d'application.

        Les journaux du pare-feu montrent le trafic internet de snet-app, mais aucun de ses flux vers les points de terminaison privés. Vous devez faire en sorte que le pare-feu inspecte tout le trafic de snet-app vers les points de terminaison privés de snet-pe, y compris ceux qui seront ajoutés plus tard. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add a route for 10.20.0.0/16 to RT-App, with the next hop type Virtual appliance and the address 10.0.1.4.", fr: "Ajouter à RT-App un itinéraire pour 10.20.0.0/16, avec le type de tronçon suivant Appliance virtuelle et l'adresse 10.0.1.4." } }
        - { id: b, text: { en: "Add a route for 10.0.0.0/8 to RT-App, with the next hop type Virtual appliance and the address 10.0.1.4.", fr: "Ajouter à RT-App un itinéraire pour 10.0.0.0/8, avec le type de tronçon suivant Appliance virtuelle et l'adresse 10.0.1.4." } }
        - { id: c, text: { en: "Add to RT-App a /32 route for the IP address of each private endpoint, with the next hop address 10.0.1.4.", fr: "Ajouter à RT-App un itinéraire /32 pour l'adresse IP de chaque point de terminaison privé, avec l'adresse de tronçon suivant 10.0.1.4." } }
        - { id: d, text: { en: "Change the network policy for private endpoints of snet-pe to RouteTableEnabled, and keep RT-App unchanged.", fr: "Passer la stratégie réseau des points de terminaison privés de snet-pe à RouteTableEnabled, et laisser RT-App inchangée." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Each private endpoint adds a /32 system route to its virtual network and to the peered networks, and longest prefix match makes it win over 0.0.0.0/0. With network policies for route tables enabled on the endpoint subnet, a user-defined route whose prefix is equal to or more specific than the address space of the endpoint's virtual network (10.20.0.0/16) overrides those /32 routes. One route covers every current and future endpoint, and the application rules SNAT the traffic, so the return path is symmetric.
        fr: |
          Chaque point de terminaison privé ajoute un itinéraire système /32 à son réseau virtuel et aux réseaux reliés par peering, et la correspondance du préfixe le plus long le fait l'emporter sur 0.0.0.0/0. Quand les stratégies réseau pour les tables de routage sont activées sur le sous-réseau du point de terminaison, un itinéraire défini par l'utilisateur dont le préfixe est égal ou plus précis que l'espace d'adressage du réseau virtuel du point de terminaison (10.20.0.0/16) remplace ces itinéraires /32. Un seul itinéraire couvre tous les points de terminaison actuels et futurs, et les règles d'application appliquent la SNAT : le chemin de retour est symétrique.
      options:
        b: { en: "10.0.0.0/8 is broader than the 10.20.0.0/16 address space, so it doesn't override the /32 routes of the private endpoints.", fr: "10.0.0.0/8 est plus large que l'espace d'adressage 10.20.0.0/16 ; il ne remplace donc pas les itinéraires /32 des points de terminaison privés." }
        c: { en: "/32 routes work, but each new private endpoint needs a new route, which doesn't meet the requirement with the least effort.", fr: "Des itinéraires /32 fonctionnent, mais chaque nouveau point de terminaison privé exige un nouvel itinéraire, ce qui ne répond pas à l'exigence avec un effort minimal." }
        d: { en: "Enabled already applies route tables to the endpoints; the missing piece is a route in RT-App that overrides the /32 routes.", fr: "Enabled applique déjà les tables de routage aux points de terminaison ; ce qui manque est un itinéraire dans RT-App qui remplace les itinéraires /32." }
    references:
      - title: Manage network policies for private endpoints
        url: https://learn.microsoft.com/en-us/azure/private-link/disable-private-endpoint-network-policy
      - title: What is a private endpoint?
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview

  # ------------------------------------------------------------------ 7
  - id: az700-qz-41-07
    objective: "4.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam publishes a billing API through a Private Link service named **pls-billing**. pls-billing uses the frontend IP configuration of a Standard internal load balancer in a virtual network named **VNet-Prov** (10.50.0.0/16) and takes its NAT IP addresses from a subnet named **snet-pls** (10.50.9.0/24). The API runs on virtual machines in a subnet named **snet-api** (10.50.1.0/24).

        Two customers connect through approved private endpoints: Contoso, from a virtual network that uses 10.50.0.0/16, and Tailspin, from a virtual network that uses 172.16.0.0/16. The connections of both customers time out. A network security group named **NSG-API** is associated with snet-api and contains the following custom inbound security rules:

        | Priority | Source | Destination port | Action |
        | --- | --- | --- | --- |
        | 100 | 172.16.0.0/16 | TCP 443 | Allow |
        | 3000 | AzureLoadBalancer service tag | Any | Allow |
        | 4000 | Any | Any | Deny |

        You need to ensure that the customers can use the API. The virtual machines must keep refusing connections from the other sources of VNet-Prov and from peered virtual networks.

        What should you do?
      fr: |
        Fabrikam publie une API de facturation au moyen d'un service Private Link nommé **pls-billing**. pls-billing utilise la configuration IP frontale d'un équilibreur de charge interne Standard situé dans un réseau virtuel nommé **VNet-Prov** (10.50.0.0/16), et prend ses adresses IP NAT dans un sous-réseau nommé **snet-pls** (10.50.9.0/24). L'API s'exécute sur des machines virtuelles d'un sous-réseau nommé **snet-api** (10.50.1.0/24).

        Deux clients se connectent par des points de terminaison privés approuvés : Contoso, depuis un réseau virtuel qui utilise 10.50.0.0/16, et Tailspin, depuis un réseau virtuel qui utilise 172.16.0.0/16. Les connexions des deux clients expirent. Un groupe de sécurité réseau nommé **NSG-API** est associé à snet-api et contient les règles de sécurité entrantes personnalisées suivantes :

        | Priorité | Source | Port de destination | Action |
        | --- | --- | --- | --- |
        | 100 | 172.16.0.0/16 | TCP 443 | Autoriser |
        | 3000 | Étiquette de service AzureLoadBalancer | Tous | Autoriser |
        | 4000 | Tous | Tous | Refuser |

        Vous devez faire en sorte que les clients puissent utiliser l'API. Les machines virtuelles doivent continuer à refuser les connexions des autres sources de VNet-Prov et des réseaux virtuels reliés par peering.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Change the source of rule 100 to 10.50.9.0/24.", fr: "Remplacer la source de la règle 100 par 10.50.9.0/24." } }
        - { id: b, text: { en: "Change the source of rule 100 to the private IP addresses of the customers' private endpoints.", fr: "Remplacer la source de la règle 100 par les adresses IP privées des points de terminaison privés des clients." } }
        - { id: c, text: { en: "Change the source of rule 100 to the VirtualNetwork service tag.", fr: "Remplacer la source de la règle 100 par l'étiquette de service VirtualNetwork." } }
        - { id: d, text: { en: "Change the source of rule 100 to the AzureLoadBalancer service tag.", fr: "Remplacer la source de la règle 100 par l'étiquette de service AzureLoadBalancer." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A Private Link service applies NAT: all consumer traffic reaches the backend from the NAT IP addresses of the service, taken from snet-pls, whatever the consumer's address space. Rule 100 never matches, so rule 4000 drops the connections. Allowing 10.50.9.0/24 admits only traffic that arrives through the Private Link service, and the other sources of VNet-Prov stay denied by rule 4000.
        fr: |
          Un service Private Link applique une NAT : tout le trafic des consommateurs arrive sur le back-end depuis les adresses IP NAT du service, prises dans snet-pls, quel que soit l'espace d'adressage du consommateur. La règle 100 ne correspond jamais : la règle 4000 rejette donc les connexions. Autoriser 10.50.9.0/24 n'admet que le trafic qui arrive par le service Private Link, et les autres sources de VNet-Prov restent refusées par la règle 4000.
      options:
        b: { en: "The backend never sees the consumers' private endpoint addresses, and Contoso's range overlaps VNet-Prov anyway.", fr: "Le back-end ne voit jamais les adresses des points de terminaison privés des consommateurs, et la plage de Contoso chevauche de toute façon VNet-Prov." }
        c: { en: "VirtualNetwork contains the NAT addresses, but also all of VNet-Prov and the peered networks, which must stay blocked.", fr: "VirtualNetwork contient les adresses NAT, mais aussi tout VNet-Prov et les réseaux reliés par peering, qui doivent rester bloqués." }
        d: { en: "AzureLoadBalancer matches the health probes (168.63.129.16), not the consumer traffic, which comes from the NAT addresses.", fr: "AzureLoadBalancer correspond aux sondes d'intégrité (168.63.129.16), pas au trafic des consommateurs, qui vient des adresses NAT." }
    references:
      - title: What is Azure Private Link service?
        url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
      - title: Azure service tags overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview

  # ------------------------------------------------------------------ 8
  - id: az700-qz-41-08
    objective: "4.1.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso has the following configuration. All the virtual networks use Azure-provided DNS.

        | Resource | Configuration |
        | --- | --- |
        | VNet-Hub | Contains **pe-app** (10.1.2.4), a private endpoint for the `blob` subresource of the storage account **stcontosoapp** |
        | VNet-Spoke1, VNet-Spoke2 | Both peered with VNet-Hub |
        | privatelink.blob.core.windows.net | Private DNS zone that contains only the A record of stcontosoapp (10.1.2.4); linked to VNet-Hub and VNet-Spoke1; fallback to internet isn't enabled on the links |
        | sttailspinfiles | Storage account of a partner, which Contoso uses through its public endpoint. The partner created a private endpoint for its `blob` subresource in a partner virtual network |

        Which answer does each query receive? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose de la configuration suivante. Tous les réseaux virtuels utilisent le DNS fourni par Azure.

        | Ressource | Configuration |
        | --- | --- |
        | VNet-Hub | Contient **pe-app** (10.1.2.4), un point de terminaison privé pour la sous-ressource `blob` du compte de stockage **stcontosoapp** |
        | VNet-Spoke1, VNet-Spoke2 | Tous deux reliés par peering à VNet-Hub |
        | privatelink.blob.core.windows.net | Zone DNS privée qui ne contient que l'enregistrement A de stcontosoapp (10.1.2.4) ; liée à VNet-Hub et à VNet-Spoke1 ; le repli vers internet n'est pas activé sur les liens |
        | sttailspinfiles | Compte de stockage d'un partenaire, que Contoso utilise par son point de terminaison public. Le partenaire a créé un point de terminaison privé pour sa sous-ressource `blob` dans un réseau virtuel du partenaire |

        Quelle réponse obtient chaque requête ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          A virtual machine in VNet-Spoke1 resolves `stcontosoapp.blob.core.windows.net` to: [[s1]]

          A virtual machine in VNet-Spoke2 resolves `stcontosoapp.blob.core.windows.net` to: [[s2]]

          A virtual machine in VNet-Hub resolves `sttailspinfiles.blob.core.windows.net` to: [[s3]]
        fr: |
          Une machine virtuelle de VNet-Spoke1 résout `stcontosoapp.blob.core.windows.net` en : [[s1]]

          Une machine virtuelle de VNet-Spoke2 résout `stcontosoapp.blob.core.windows.net` en : [[s2]]

          Une machine virtuelle de VNet-Hub résout `sttailspinfiles.blob.core.windows.net` en : [[s3]]
      slots:
        - id: s1
          options:
            - { id: priv, text: "10.1.2.4" }
            - { id: pub, text: { en: "A public IP address of Azure Storage", fr: "Une adresse IP publique de Stockage Azure" } }
            - { id: nx, text: { en: "No address (NXDOMAIN)", fr: "Aucune adresse (NXDOMAIN)" } }
            - { id: part, text: { en: "The IP address of the partner's private endpoint", fr: "L'adresse IP du point de terminaison privé du partenaire" } }
        - id: s2
          options:
            - { id: priv, text: "10.1.2.4" }
            - { id: pub, text: { en: "A public IP address of Azure Storage", fr: "Une adresse IP publique de Stockage Azure" } }
            - { id: nx, text: { en: "No address (NXDOMAIN)", fr: "Aucune adresse (NXDOMAIN)" } }
            - { id: part, text: { en: "The IP address of the partner's private endpoint", fr: "L'adresse IP du point de terminaison privé du partenaire" } }
        - id: s3
          options:
            - { id: priv, text: "10.1.2.4" }
            - { id: pub, text: { en: "A public IP address of Azure Storage", fr: "Une adresse IP publique de Stockage Azure" } }
            - { id: nx, text: { en: "No address (NXDOMAIN)", fr: "Aucune adresse (NXDOMAIN)" } }
            - { id: part, text: { en: "The IP address of the partner's private endpoint", fr: "L'adresse IP du point de terminaison privé du partenaire" } }
    answer:
      values: { s1: priv, s2: pub, s3: nx }
    explanation:
      correct:
        en: |
          VNet-Spoke1 is linked to the zone, so Azure DNS follows the CNAME to the `privatelink` name and returns the A record 10.1.2.4. VNet-Spoke2 isn't linked: the `privatelink` name is resolved publicly and returns the public IP address of the service, even though the network is peered with the hub. For sttailspinfiles, public DNS also returns a CNAME to the `privatelink` name because the partner has a private endpoint; the zone linked to VNet-Hub has no record for it and fallback to internet is off, so the answer is NXDOMAIN.
        fr: |
          VNet-Spoke1 est lié à la zone : Azure DNS suit le CNAME vers le nom `privatelink` et renvoie l'enregistrement A 10.1.2.4. VNet-Spoke2 n'est pas lié : le nom `privatelink` est résolu publiquement et renvoie l'adresse IP publique du service, même si le réseau est relié par peering au hub. Pour sttailspinfiles, le DNS public renvoie aussi un CNAME vers le nom `privatelink`, car le partenaire a un point de terminaison privé ; la zone liée à VNet-Hub n'a aucun enregistrement pour ce compte et le repli vers internet est désactivé : la réponse est NXDOMAIN.
      options:
        part: { en: "The partner's record lives in the partner's own private zone, which Contoso's networks can't query.", fr: "L'enregistrement du partenaire se trouve dans sa propre zone privée, que les réseaux de Contoso ne peuvent pas interroger." }
    references:
      - title: Azure Private Endpoint private DNS zone values
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
      - title: Azure Private Endpoint DNS Integration Scenarios
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration

  # ------------------------------------------------------------------ 9
  - id: az700-qz-41-09
    objective: "4.1.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware publishes a quote API through a Private Link service named **pls-quotes** in the West Europe region. The API runs behind a Standard internal load balancer in a virtual network named **VNet-Prov** (10.60.0.0/16). pls-quotes has the following settings:

        | Setting | Value |
        | --- | --- |
        | Visibility | Restricted by subscription: Sub-Contoso, Sub-Tailspin |
        | Auto-approval | Sub-Contoso |
        | NAT IP addresses | 10.60.9.4 and 10.60.9.5 |
        | TCP proxy v2 | Disabled |

        The application on the backend virtual machines doesn't parse PROXY protocol headers.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware publie une API de devis au moyen d'un service Private Link nommé **pls-quotes**, dans la région West Europe. L'API s'exécute derrière un équilibreur de charge interne Standard dans un réseau virtuel nommé **VNet-Prov** (10.60.0.0/16). pls-quotes a les paramètres suivants :

        | Paramètre | Valeur |
        | --- | --- |
        | Visibilité | Restreint par abonnement : Sub-Contoso, Sub-Tailspin |
        | Approbation automatique | Sub-Contoso |
        | Adresses IP NAT | 10.60.9.4 et 10.60.9.5 |
        | TCP proxy v2 | Désactivé |

        L'application des machines virtuelles du back-end n'analyse pas les en-têtes du protocole PROXY.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A private endpoint that Tailspin creates in Sub-Tailspin for pls-quotes stays in the Pending state until Proseware approves it.", fr: "Un point de terminaison privé que Tailspin crée dans Sub-Tailspin pour pls-quotes reste à l'état En attente (Pending) jusqu'à ce que Proseware l'approuve." }
        - id: s2
          text: { en: "A private endpoint that Contoso creates for pls-quotes in a virtual network that uses 10.60.0.0/16 is approved without any action from Proseware, and Contoso can reach the API through it.", fr: "Un point de terminaison privé que Contoso crée pour pls-quotes dans un réseau virtuel qui utilise 10.60.0.0/16 est approuvé sans aucune action de Proseware, et Contoso peut atteindre l'API par son intermédiaire." }
        - id: s3
          text: { en: "If Proseware enables TCP proxy v2 on pls-quotes, the application keeps accepting the customers' connections without any change.", fr: "Si Proseware active TCP proxy v2 sur pls-quotes, l'application continue d'accepter les connexions des clients sans aucune modification." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Visibility controls who can request a connection, and auto-approval, a subset of the visibility list, controls which requests are approved automatically: Tailspin can request one, but its request waits for Proseware's manual approval, while Contoso's request is approved at once. The service applies NAT, so a consumer network that overlaps VNet-Prov works. Once TCP proxy v2 is enabled, every connection carries a PROXY v2 header, and requests fail if the backend doesn't parse it.
        fr: |
          La visibilité contrôle qui peut demander une connexion, et l'approbation automatique, sous-ensemble de la liste de visibilité, contrôle les demandes approuvées automatiquement : Tailspin peut en demander une, mais sa demande attend l'approbation manuelle de Proseware, tandis que celle de Contoso est approuvée immédiatement. Le service applique une NAT : un réseau consommateur qui chevauche VNet-Prov fonctionne. Dès que TCP proxy v2 est activé, chaque connexion porte un en-tête PROXY v2, et les requêtes échouent si le back-end ne l'analyse pas.
      options:
        s3: { en: "With TCP proxy v2 enabled, the backend must parse the PROXY header; an application that doesn't parse it sees its requests fail.", fr: "Avec TCP proxy v2 activé, le back-end doit analyser l'en-tête PROXY ; une application qui ne l'analyse pas voit ses requêtes échouer." }
    references:
      - title: What is Azure Private Link service?
        url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview

  # ------------------------------------------------------------------ 10
  - id: az700-qz-41-10
    objective: "4.1.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove has the following resources in the West Europe region:

        | Resource | Configuration |
        | --- | --- |
        | VNet-Hub (10.0.0.0/16) | A VPN gateway with a site-to-site connection to the on-premises network, with BGP enabled on the connection; an Azure DNS Private Resolver with an inbound endpoint at 10.0.5.4 |
        | VNet-Sec (10.8.0.0/16) | **pe-kv** (10.8.1.5), a private endpoint for the key vault **kv-woodgrove**; no gateway |
        | privatelink.vaultcore.azure.net | Private DNS zone linked to VNet-Hub, with the A record of pe-kv |

        VNet-Hub and VNet-Sec are peered with the default peering settings. The on-premises DNS servers forward the Key Vault public zones to 10.0.5.4, and `nslookup kv-woodgrove.vault.azure.net` on an on-premises server returns 10.8.1.5. However, the connections of on-premises applications to kv-woodgrove time out.

        You need to ensure that the on-premises applications can use pe-kv. pe-kv must stay in VNet-Sec, and you must not deploy new resources.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove dispose des ressources suivantes dans la région West Europe :

        | Ressource | Configuration |
        | --- | --- |
        | VNet-Hub (10.0.0.0/16) | Une passerelle VPN avec une connexion de site à site vers le réseau local, BGP étant activé sur la connexion ; un Azure DNS Private Resolver avec un point de terminaison entrant à l'adresse 10.0.5.4 |
        | VNet-Sec (10.8.0.0/16) | **pe-kv** (10.8.1.5), un point de terminaison privé pour le coffre de clés **kv-woodgrove** ; aucune passerelle |
        | privatelink.vaultcore.azure.net | Zone DNS privée liée à VNet-Hub, avec l'enregistrement A de pe-kv |

        VNet-Hub et VNet-Sec sont reliés par peering avec les paramètres de peering par défaut. Les serveurs DNS locaux transfèrent les zones publiques de Key Vault vers 10.0.5.4, et `nslookup kv-woodgrove.vault.azure.net` sur un serveur local renvoie 10.8.1.5. Pourtant, les connexions des applications locales à kv-woodgrove expirent.

        Vous devez faire en sorte que les applications locales puissent utiliser pe-kv. pe-kv doit rester dans VNet-Sec, et vous ne devez déployer aucune nouvelle ressource.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "On the VNet-Hub peering to VNet-Sec, allow gateway transit.", fr: "Sur le peering de VNet-Hub vers VNet-Sec, autoriser le transit par passerelle." } }
        - { id: b, text: { en: "On the VNet-Sec peering to VNet-Hub, use the remote gateways of VNet-Hub.", fr: "Sur le peering de VNet-Sec vers VNet-Hub, utiliser les passerelles distantes de VNet-Hub." } }
        - { id: c, text: { en: "Link the privatelink.vaultcore.azure.net zone to VNet-Sec.", fr: "Lier la zone privatelink.vaultcore.azure.net à VNet-Sec." } }
        - { id: d, text: { en: "Set the network policy for private endpoints of the pe-kv subnet to RouteTableEnabled.", fr: "Régler la stratégie réseau des points de terminaison privés du sous-réseau de pe-kv sur RouteTableEnabled." } }
        - { id: e, text: { en: "On the on-premises DNS servers, forward privatelink.vaultcore.azure.net to 10.0.5.4.", fr: "Sur les serveurs DNS locaux, transférer privatelink.vaultcore.azure.net vers 10.0.5.4." } }
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          Name resolution already returns the private address, so the failure is routing. The private endpoint is in a spoke that doesn't use the hub gateway: on-premises has no route to 10.8.0.0/16, and VNet-Sec has no route back to on-premises. Allowing gateway transit on the hub side and using the remote gateways on the spoke side lets the VPN gateway advertise the spoke address space over BGP and gives VNet-Sec the on-premises routes.
        fr: |
          La résolution de noms renvoie déjà l'adresse privée : la panne vient du routage. Le point de terminaison privé se trouve dans un spoke qui n'utilise pas la passerelle du hub : le réseau local n'a pas d'itinéraire vers 10.8.0.0/16, et VNet-Sec n'a pas d'itinéraire de retour vers le réseau local. Autoriser le transit par passerelle côté hub et utiliser les passerelles distantes côté spoke permet à la passerelle VPN d'annoncer l'espace d'adressage du spoke par BGP et donne à VNet-Sec les itinéraires du réseau local.
      options:
        c: { en: "The resolver queries Azure DNS from VNet-Hub, which is already linked: on-premises servers already get 10.8.1.5.", fr: "Le résolveur interroge Azure DNS depuis VNet-Hub, déjà lié : les serveurs locaux obtiennent déjà 10.8.1.5." }
        d: { en: "Network policies apply NSGs and user-defined routes to the endpoint; they don't create a path between on-premises and VNet-Sec.", fr: "Les stratégies réseau appliquent les NSG et les itinéraires définis par l'utilisateur au point de terminaison ; elles ne créent pas de chemin entre le réseau local et VNet-Sec." }
        e: { en: "Applications use the public name, which is already forwarded; the problem isn't DNS but the missing route.", fr: "Les applications utilisent le nom public, déjà transféré ; le problème n'est pas le DNS mais l'itinéraire manquant." }
    references:
      - title: Configure VPN gateway transit for virtual network peering
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-peering-gateway-transit
      - title: Azure Private Endpoint DNS Integration Scenarios
        url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
