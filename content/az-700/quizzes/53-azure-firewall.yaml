chapter: 53-azure-firewall
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-53-01
    objective: "5.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You plan to deploy an Azure Firewall Standard in a hub virtual network named **VNet-Hub**. Forced tunneling isn't required.

        Which subnet must you create in VNet-Hub for the firewall?
      fr: |
        Vous prévoyez de déployer un Pare-feu Azure Standard dans un réseau virtuel hub nommé **VNet-Hub**. Le tunneling forcé n'est pas nécessaire.

        Quel sous-réseau devez-vous créer dans VNet-Hub pour le pare-feu ?
    body:
      options:
        - { id: a, text: { en: "A subnet named AzureFirewallSubnet with a /28 prefix", fr: "Un sous-réseau nommé AzureFirewallSubnet avec un préfixe /28" } }
        - { id: b, text: { en: "A subnet named FirewallSubnet with a /26 prefix", fr: "Un sous-réseau nommé FirewallSubnet avec un préfixe /26" } }
        - { id: c, text: { en: "A subnet named AzureFirewallSubnet with a /26 prefix", fr: "Un sous-réseau nommé AzureFirewallSubnet avec un préfixe /26" } }
        - { id: d, text: { en: "A subnet named AzureFirewallManagementSubnet with a /26 prefix", fr: "Un sous-réseau nommé AzureFirewallManagementSubnet avec un préfixe /26" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Azure Firewall is deployed in a dedicated subnet that must be named AzureFirewallSubnet. A /26 subnet gives the firewall enough addresses for all its scaling scenarios, because the service adds instances as the load grows.
        fr: |
          Le Pare-feu Azure se déploie dans un sous-réseau dédié qui doit s'appeler AzureFirewallSubnet. Un sous-réseau /26 lui donne assez d'adresses pour tous ses scénarios de mise à l'échelle, car le service ajoute des instances quand la charge augmente.
      options:
        a: { en: "The name is right, but /28 is too small: the firewall needs a /26 to scale out.", fr: "Le nom est correct, mais un /28 est trop petit : le pare-feu a besoin d'un /26 pour monter en charge." }
        b: { en: "The firewall only deploys into a subnet with the reserved name AzureFirewallSubnet.", fr: "Le pare-feu ne se déploie que dans un sous-réseau portant le nom réservé AzureFirewallSubnet." }
        d: { en: "AzureFirewallManagementSubnet carries the management NIC (forced tunneling, Basic); it doesn't replace the data subnet.", fr: "AzureFirewallManagementSubnet porte la carte réseau de gestion (tunneling forcé, Basic) ; il ne remplace pas le sous-réseau de données." }
    references:
      - title: Azure Firewall FAQ
        url: https://learn.microsoft.com/en-us/azure/firewall/firewall-faq

  # ------------------------------------------------------------------ 2
  - id: az700-qz-53-02
    objective: "5.2.2"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Tailspin Toys runs a small Azure environment for one branch office. You need to deploy an Azure Firewall that meets the following requirements:

        - Allow outbound HTTPS only to a list of FQDNs by using application rules.
        - Support a throughput of up to 200 Mbps.
        - Raise alerts for traffic to known malicious IP addresses. Blocking this traffic isn't required.

        The solution must minimize costs. Which SKU should you choose?
      fr: |
        Tailspin Toys exploite un petit environnement Azure pour une agence. Vous devez déployer un Pare-feu Azure qui répond aux exigences suivantes :

        - Autoriser le HTTPS sortant uniquement vers une liste de FQDN à l'aide de règles d'application.
        - Prendre en charge un débit allant jusqu'à 200 Mbit/s.
        - Générer des alertes pour le trafic vers des adresses IP malveillantes connues. Il n'est pas nécessaire de bloquer ce trafic.

        La solution doit réduire les coûts au minimum. Quelle référence SKU devez-vous choisir ?
    body:
      options:
        - { id: a, text: Basic }
        - { id: b, text: Standard }
        - { id: c, text: Premium }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Basic suits small environments with a throughput of up to 250 Mbps. It supports application rules with FQDN filtering, and its threat intelligence works in alert mode, which is all the requirements ask for. It's the cheapest SKU that meets them.
        fr: |
          Basic convient aux petits environnements dont le débit ne dépasse pas 250 Mbit/s. Il prend en charge les règles d'application avec filtrage FQDN, et son renseignement sur les menaces fonctionne en mode alerte, ce qui suffit aux exigences. C'est la référence SKU la moins chère qui y répond.
      options:
        b: { en: "Standard adds DNS proxy, network-level FQDN filtering and threat intelligence that can deny, none of which is required: it costs more for nothing here.", fr: "Standard ajoute le proxy DNS, le filtrage FQDN au niveau réseau et un renseignement sur les menaces capable de refuser, rien de tout cela n'est exigé : il coûte plus cher sans utilité ici." }
        c: { en: "Premium adds TLS inspection, IDPS and URL filtering, which aren't required, at the highest price.", fr: "Premium ajoute l'inspection TLS, l'IDPS et le filtrage d'URL, qui ne sont pas exigés, au prix le plus élevé." }
    references:
      - title: Choose the right Azure Firewall SKU to meet your needs
        url: https://learn.microsoft.com/en-us/azure/firewall/choose-firewall-sku

  # ------------------------------------------------------------------ 3
  - id: az700-qz-53-03
    objective: "5.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The spoke subnets of Fabrikam send their internet-bound traffic to an Azure Firewall. You are adding an application rule for HTTPS to the firewall policy.

        The rule must allow the domain `contoso.com` itself and every host under it, such as `www.contoso.com` and `api.eu.contoso.com`. Look-alike domains such as `badcontoso.com` must stay blocked by the default deny.

        Which target FQDNs should you specify in the rule?
      fr: |
        Les sous-réseaux spokes de Fabrikam envoient leur trafic Internet vers un Pare-feu Azure. Vous ajoutez à la stratégie de pare-feu une règle d'application pour le HTTPS.

        La règle doit autoriser le domaine `contoso.com` lui-même et tous les hôtes qui en dépendent, comme `www.contoso.com` et `api.eu.contoso.com`. Les domaines ressemblants comme `badcontoso.com` doivent rester bloqués par le refus par défaut.

        Quels FQDN cibles devez-vous indiquer dans la règle ?
    body:
      options:
        - { id: a, text: "`*.contoso.com`" }
        - { id: b, text: "`*contoso.com`" }
        - { id: c, text: "`contoso.com` and `*.contoso.com`" }
        - { id: d, text: "`contoso.com` and `*contoso.com`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          An asterisk at the left of a target FQDN matches anything to its left, so `*.contoso.com` matches every host under the domain, at any depth. It doesn't match the bare domain, which must be listed separately as `contoso.com`. Together, the two entries allow exactly the expected names.
        fr: |
          Un astérisque à gauche d'un FQDN cible correspond à n'importe quoi à sa gauche : `*.contoso.com` correspond donc à tous les hôtes du domaine, quelle que soit leur profondeur. Il ne correspond pas au domaine nu, qu'il faut indiquer séparément sous la forme `contoso.com`. Ensemble, les deux entrées autorisent exactement les noms attendus.
      options:
        a: { en: "`*.contoso.com` doesn't match `contoso.com` itself, so connections to the bare domain would hit the default deny.", fr: "`*.contoso.com` ne correspond pas à `contoso.com` lui-même : les connexions au domaine nu tomberaient sur le refus par défaut." }
        b: { en: "`*contoso.com` matches `contoso.com`, but also any name that ends with these characters, such as `badcontoso.com`.", fr: "`*contoso.com` correspond à `contoso.com`, mais aussi à tout nom qui se termine par ces caractères, comme `badcontoso.com`." }
        d: { en: "The `*contoso.com` entry still allows look-alike domains such as `badcontoso.com`.", fr: "L'entrée `*contoso.com` autorise toujours les domaines ressemblants comme `badcontoso.com`." }
    references:
      - title: Azure Firewall FAQ
        url: https://learn.microsoft.com/en-us/azure/firewall/firewall-faq

  # ------------------------------------------------------------------ 4
  - id: az700-qz-53-04
    objective: "5.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The spoke subnets of Litware route all their traffic to an Azure Firewall named **FW1**. The firewall policy of FW1 contains the following network rule collections:

        | Priority | Rule collection | Action | Rule |
        | --- | --- | --- | --- |
        | 200 | NC-AllowSQL | Allow | TCP 1433 from 10.1.0.0/16 (Spoke-App) to 10.2.0.10 (Spoke-Data) |
        | 300 | NC-DenyToApp | Deny | Any protocol from 10.2.0.0/16 (Spoke-Data) to 10.1.0.0/16 (Spoke-App) |

        An application server with the address 10.1.0.5 opens a connection to the SQL Server instance at 10.2.0.10 on TCP port 1433.

        What is the result?
      fr: |
        Les sous-réseaux spokes de Litware routent tout leur trafic vers un Pare-feu Azure nommé **FW1**. La stratégie de pare-feu de FW1 contient les collections de règles de réseau suivantes :

        | Priorité | Collection de règles | Action | Règle |
        | --- | --- | --- | --- |
        | 200 | NC-AllowSQL | Allow | TCP 1433 de 10.1.0.0/16 (Spoke-App) vers 10.2.0.10 (Spoke-Data) |
        | 300 | NC-DenyToApp | Deny | Tout protocole de 10.2.0.0/16 (Spoke-Data) vers 10.1.0.0/16 (Spoke-App) |

        Un serveur d'applications d'adresse 10.1.0.5 ouvre une connexion vers l'instance SQL Server située à 10.2.0.10 sur le port TCP 1433.

        Quel est le résultat ?
    body:
      options:
        - { id: a, text: { en: "The connection fails, because NC-DenyToApp drops the responses of 10.2.0.10.", fr: "La connexion échoue, car NC-DenyToApp abandonne les réponses de 10.2.0.10." } }
        - { id: b, text: { en: "The connection succeeds, because FW1 allows the return traffic of an allowed connection.", fr: "La connexion réussit, car FW1 autorise le trafic de retour d'une connexion autorisée." } }
        - { id: c, text: { en: "The connection succeeds only after you allow TCP 1024-65535 from 10.2.0.10 to Spoke-App.", fr: "La connexion ne réussit qu'après l'autorisation de TCP 1024-65535 de 10.2.0.10 vers Spoke-App." } }
        - { id: d, text: { en: "The connection fails, because deny collections are processed before allow collections.", fr: "La connexion échoue, car les collections de refus sont traitées avant les collections d'autorisation." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Azure Firewall is stateful: once NC-AllowSQL allows the connection, its return traffic flows even though a deny rule exists in the reverse direction. NC-DenyToApp only blocks new connections initiated from Spoke-Data to Spoke-App.
        fr: |
          Le Pare-feu Azure est avec état : dès que NC-AllowSQL autorise la connexion, son trafic de retour passe même si une règle de refus existe dans le sens inverse. NC-DenyToApp ne bloque que les nouvelles connexions initiées de Spoke-Data vers Spoke-App.
      options:
        a: { en: "The responses belong to an established, allowed connection: a reverse deny rule doesn't apply to them.", fr: "Les réponses appartiennent à une connexion établie et autorisée : une règle de refus dans le sens inverse ne s'y applique pas." }
        c: { en: "A return rule is what a stateless filter would need; a stateful firewall tracks the connection and needs no rule for its responses.", fr: "Une règle de retour est ce dont aurait besoin un filtre sans état ; un pare-feu avec état suit la connexion et n'a besoin d'aucune règle pour ses réponses." }
        d: { en: "Collections are processed by priority number, whatever their action; NC-AllowSQL (200) comes first and matches.", fr: "Les collections sont traitées par numéro de priorité, quelle que soit leur action ; NC-AllowSQL (200) passe en premier et correspond." }
    references:
      - title: Azure Firewall rule processing logic
        url: https://learn.microsoft.com/en-us/azure/firewall/rule-processing

  # ------------------------------------------------------------------ 5
  - id: az700-qz-53-05
    objective: "5.2.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has two Azure Firewall Standard instances: **FW-EUS** in the East US region and **FW-WEU** in the West Europe region. Each firewall uses classic rules, and the two rule sets have drifted apart over time.

        You need both firewalls to enforce the same rules, maintained in a single place. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Adatum dispose de deux instances de Pare-feu Azure Standard : **FW-EUS** dans la région East US et **FW-WEU** dans la région West Europe. Chaque pare-feu utilise des règles classiques, et les deux ensembles de règles ont divergé avec le temps.

        Vous devez faire appliquer les mêmes règles par les deux pare-feu, gérées en un seul endroit. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a firewall policy in each region, and copy the rule collections between the two policies after each change.", fr: "Créer une stratégie de pare-feu dans chaque région, puis copier les collections de règles d'une stratégie à l'autre après chaque modification." } }
        - { id: b, text: { en: "Create a parent policy in East US and a child policy in West Europe, and associate each policy with the firewall of its region.", fr: "Créer une stratégie parente dans East US et une stratégie enfant dans West Europe, puis associer chaque stratégie au pare-feu de sa région." } }
        - { id: c, text: { en: "Keep the classic rules, and redeploy the rules of FW-EUS to FW-WEU from an exported template after each change.", fr: "Conserver les règles classiques, puis redéployer les règles de FW-EUS sur FW-WEU à partir d'un modèle exporté après chaque modification." } }
        - { id: d, text: { en: "Migrate the classic rules to a single firewall policy, and associate this policy with both FW-EUS and FW-WEU.", fr: "Migrer les règles classiques vers une seule stratégie de pare-feu, puis associer cette stratégie à FW-EUS et à FW-WEU." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A firewall policy is a global resource: one policy can be associated with firewalls in any region and subscription. Classic rules can be migrated to a policy in the portal or with Azure PowerShell, after which every change is made once and applies to both firewalls.
        fr: |
          Une stratégie de pare-feu est une ressource globale : une même stratégie peut être associée à des pare-feu de n'importe quelle région et de n'importe quel abonnement. Les règles classiques se migrent vers une stratégie dans le portail ou avec Azure PowerShell ; chaque modification se fait alors une seule fois et s'applique aux deux pare-feu.
      options:
        a: { en: "Two policies kept in sync by hand are two places to maintain, the opposite of the requirement.", fr: "Deux stratégies synchronisées à la main, ce sont deux endroits à maintenir, l'inverse de l'exigence." }
        b: { en: "A parent policy and its child policy must be in the same region, and a policy doesn't need to be in the firewall's region anyway.", fr: "Une stratégie parente et sa stratégie enfant doivent se trouver dans la même région, et une stratégie n'a de toute façon pas besoin d'être dans la région du pare-feu." }
        c: { en: "Classic rules belong to one firewall: sharing them requires a manual export and import after each change.", fr: "Les règles classiques appartiennent à un seul pare-feu : les partager exige une exportation et une importation manuelles après chaque modification." }
    references:
      - title: Azure Firewall Manager policy overview
        url: https://learn.microsoft.com/en-us/azure/firewall-manager/policy-overview

  # ------------------------------------------------------------------ 6
  - id: az700-qz-53-06
    objective: "5.2.7"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Contoso uses Azure Firewall Manager and is designing four regional security hubs, each protected by Azure Firewall. Each hub has the specific requirement shown in the answer area.

        Which Firewall Manager architecture should you use for each hub? To answer, drag the appropriate architectures to the correct requirements. Each architecture may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso utilise Azure Firewall Manager et conçoit quatre hubs de sécurité régionaux, chacun protégé par le Pare-feu Azure. Chaque hub a l'exigence propre indiquée dans la zone de réponse.

        Quelle architecture Firewall Manager devez-vous utiliser pour chaque hub ? Pour répondre, faites glisser les architectures appropriées vers les exigences correspondantes. Chaque architecture peut être utilisée une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: hubvnet, text: { en: "Hub virtual network", fr: "Réseau virtuel hub" } }
        - { id: svh, text: { en: "Secured virtual hub", fr: "Hub virtuel sécurisé" } }
        - { id: either, text: { en: "Either architecture", fr: "L'une ou l'autre architecture" } }
      targets:
        - { id: t1, text: { en: "Connect 120 branch offices automatically through their SD-WAN devices", fr: "Connecter automatiquement 120 agences par leurs appareils SD-WAN" } }
        - { id: t2, text: { en: "Run an Application Gateway WAF in the hub network itself, next to the firewall", fr: "Exécuter un WAF Application Gateway dans le réseau du hub lui-même, à côté du pare-feu" } }
        - { id: t3, text: { en: "Filter internet traffic with a third-party SECaaS partner and private traffic with Azure Firewall, without building the partner tunnels yourself", fr: "Filtrer le trafic Internet avec un partenaire SECaaS tiers et le trafic privé avec le Pare-feu Azure, sans créer vous-même les tunnels vers le partenaire" } }
        - { id: t4, text: { en: "Associate a NAT gateway with the firewall subnet to add SNAT ports", fr: "Associer une passerelle NAT au sous-réseau du pare-feu pour ajouter des ports SNAT" } }
    answer:
      mapping: { t1: svh, t2: hubvnet, t3: svh, t4: hubvnet }
    explanation:
      correct:
        en: |
          A secured virtual hub is a Virtual WAN hub: it supports automated branch connectivity through SD-WAN, and Firewall Manager automates two security providers, Azure Firewall for private traffic and a third-party partner for internet traffic. A hub virtual network is a virtual network you manage: an Application Gateway WAF can run in it, whereas a secured hub supports it only in a spoke. A NAT gateway can be associated with AzureFirewallSubnet in a virtual network, but it isn't supported in a secured virtual hub.
        fr: |
          Un hub virtuel sécurisé est un hub Virtual WAN : il prend en charge la connectivité automatisée des agences par SD-WAN, et Firewall Manager y automatise deux fournisseurs de sécurité, le Pare-feu Azure pour le trafic privé et un partenaire tiers pour le trafic Internet. Un réseau virtuel hub est un réseau virtuel que vous gérez : un WAF Application Gateway peut y être déployé, alors qu'un hub sécurisé ne le prend en charge que dans un spoke. Une passerelle NAT peut être associée à AzureFirewallSubnet dans un réseau virtuel, mais elle n'est pas prise en charge dans un hub virtuel sécurisé.
      options:
        either: { en: "Each requirement is supported by only one of the two architectures.", fr: "Chaque exigence n'est prise en charge que par l'une des deux architectures." }
    references:
      - title: What are the Azure Firewall Manager architecture options?
        url: https://learn.microsoft.com/en-us/azure/firewall-manager/vhubs-and-vnets
      - title: Scale SNAT ports with Azure NAT Gateway
        url: https://learn.microsoft.com/en-us/azure/firewall/integrate-with-nat-gateway

  # ------------------------------------------------------------------ 7
  - id: az700-qz-53-07
    objective: "5.2.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind Traders has a hub virtual network named **VNet-Hub**. The only free address range in VNet-Hub is 10.0.1.0/25. A Standard SKU public IP address named **pip-fw1** exists in the same region and resource group.

        You plan to deploy an Azure Firewall Basic named **FW1** in VNet-Hub with pip-fw1 as its public IP address. FW1 will be managed by a Basic firewall policy that contains application rules only.

        Which three actions should you perform to prepare the deployment of FW1? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un réseau virtuel hub nommé **VNet-Hub**. La seule plage d'adresses libre de VNet-Hub est 10.0.1.0/25. Une adresse IP publique de référence SKU Standard nommée **pip-fw1** existe dans la même région et le même groupe de ressources.

        Vous prévoyez de déployer un Pare-feu Azure Basic nommé **FW1** dans VNet-Hub, avec pip-fw1 comme adresse IP publique. FW1 sera géré par une stratégie de pare-feu Basic qui ne contient que des règles d'application.

        Quelles sont les trois actions à effectuer pour préparer le déploiement de FW1 ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Create a subnet named AzureFirewallSubnet with the prefix 10.0.1.0/26.", fr: "Créer un sous-réseau nommé AzureFirewallSubnet avec le préfixe 10.0.1.0/26." } }
        - { id: b, text: { en: "Create a subnet named AzureFirewallManagementSubnet with the prefix 10.0.1.96/27.", fr: "Créer un sous-réseau nommé AzureFirewallManagementSubnet avec le préfixe 10.0.1.96/27." } }
        - { id: c, text: { en: "Create a second Standard SKU public IP address for the management IP configuration of FW1.", fr: "Créer une deuxième adresse IP publique de référence SKU Standard pour la configuration IP de gestion de FW1." } }
        - { id: d, text: { en: "Create a subnet named AzureFirewallManagementSubnet with the prefix 10.0.1.64/26.", fr: "Créer un sous-réseau nommé AzureFirewallManagementSubnet avec le préfixe 10.0.1.64/26." } }
        - { id: e, text: { en: "Associate a route table that sends 0.0.0.0/0 to a virtual appliance with AzureFirewallManagementSubnet.", fr: "Associer à AzureFirewallManagementSubnet une table de routage qui envoie 0.0.0.0/0 vers une appliance virtuelle." } }
        - { id: f, text: { en: "Enable DNS proxy in the firewall policy so that FW1 can resolve the target FQDNs.", fr: "Activer le proxy DNS dans la stratégie de pare-feu pour que FW1 puisse résoudre les FQDN cibles." } }
    answer: { optionIds: [a, c, d] }
    explanation:
      correct:
        en: |
          A Basic firewall always has a management NIC. It therefore needs AzureFirewallSubnet and AzureFirewallManagementSubnet, each at least /26 (the free /25 holds exactly two /26), and a dedicated management public IP address with the same SKU, tier and location as the firewall's public IP address.
        fr: |
          Un pare-feu Basic a toujours une carte réseau de gestion. Il lui faut donc AzureFirewallSubnet et AzureFirewallManagementSubnet, d'au moins /26 chacun (la plage /25 libre contient exactement deux /26), et une adresse IP publique de gestion dédiée, de même référence SKU, de même niveau et dans le même emplacement que l'adresse IP publique du pare-feu.
      options:
        b: { en: "AzureFirewallManagementSubnet must be at least /26; a /27 is too small.", fr: "AzureFirewallManagementSubnet doit être d'au moins /26 ; un /27 est trop petit." }
        e: { en: "The only route allowed on AzureFirewallManagementSubnet is a default route to the Internet: the management traffic must not go through an appliance.", fr: "La seule route autorisée sur AzureFirewallManagementSubnet est une route par défaut vers Internet : le trafic de gestion ne doit pas passer par une appliance." }
        f: { en: "Basic doesn't support DNS proxy, and application rules don't need it: they match the Host header or the SNI.", fr: "Basic ne prend pas en charge le proxy DNS, et les règles d'application n'en ont pas besoin : elles correspondent sur l'en-tête Host ou le SNI." }
    references:
      - title: Azure Firewall Management NIC
        url: https://learn.microsoft.com/en-us/azure/firewall/management-nic
      - title: Choose the right Azure Firewall SKU to meet your needs
        url: https://learn.microsoft.com/en-us/azure/firewall/choose-firewall-sku

  # ------------------------------------------------------------------ 8
  - id: az700-qz-53-08
    objective: "5.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has a hub virtual network that contains an ExpressRoute gateway and an Azure Firewall Standard named **FW1**. FW1 was deployed without the Firewall Management NIC. The spoke subnets use a route table that sends 0.0.0.0/0 to the private IP address of FW1, with gateway route propagation disabled. AzureFirewallSubnet has no route table.

        The on-premises network has started advertising a default route (0.0.0.0/0) over ExpressRoute by using BGP. Since then, FW1 no longer has direct internet connectivity, and the spoke virtual machines can't reach internet sites.

        FW1 must keep sending internet-bound traffic directly to the internet by using its public IP address. The on-premises routing configuration must not change.

        What should you do?
      fr: |
        Woodgrove Bank dispose d'un réseau virtuel hub qui contient une passerelle ExpressRoute et un Pare-feu Azure Standard nommé **FW1**. FW1 a été déployé sans la carte réseau de gestion du pare-feu. Les sous-réseaux spokes utilisent une table de routage qui envoie 0.0.0.0/0 vers l'adresse IP privée de FW1, avec la propagation des itinéraires de passerelle désactivée. AzureFirewallSubnet n'a pas de table de routage.

        Le réseau local a commencé à annoncer une route par défaut (0.0.0.0/0) sur ExpressRoute à l'aide de BGP. Depuis, FW1 n'a plus de connectivité Internet directe, et les machines virtuelles des spokes ne joignent plus les sites Internet.

        FW1 doit continuer à envoyer le trafic Internet directement vers Internet avec son adresse IP publique. La configuration de routage locale ne doit pas changer.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Associate with AzureFirewallSubnet a route table that has a 0.0.0.0/0 route with the next hop type Virtual network gateway.", fr: "Associer à AzureFirewallSubnet une table de routage qui a une route 0.0.0.0/0 avec le type de tronçon suivant Passerelle de réseau virtuel." } }
        - { id: b, text: { en: "Add 0.0.0.0/0 to the SNAT private IP address ranges of the firewall policy of FW1.", fr: "Ajouter 0.0.0.0/0 aux plages d'adresses IP privées SNAT de la stratégie de pare-feu de FW1." } }
        - { id: c, text: { en: "Associate with AzureFirewallSubnet a route table that has a 0.0.0.0/0 route with the next hop type Internet.", fr: "Associer à AzureFirewallSubnet une table de routage qui a une route 0.0.0.0/0 avec le type de tronçon suivant Internet." } }
        - { id: d, text: { en: "Enable gateway route propagation on the route table that is associated with the spoke subnets.", fr: "Activer la propagation des itinéraires de passerelle sur la table de routage associée aux sous-réseaux spokes." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Azure Firewall needs direct internet connectivity unless it's configured for forced tunneling. When AzureFirewallSubnet learns a default route to on-premises through BGP, you override it with a user-defined route for 0.0.0.0/0 whose next hop type is Internet. The user-defined route wins over the BGP route, and the on-premises advertisements stay unchanged.
        fr: |
          Le Pare-feu Azure a besoin d'une connectivité Internet directe, sauf s'il est configuré en tunneling forcé. Quand AzureFirewallSubnet apprend par BGP une route par défaut vers le réseau local, vous la remplacez par un itinéraire défini par l'utilisateur 0.0.0.0/0 dont le type de tronçon suivant est Internet. L'itinéraire défini par l'utilisateur l'emporte sur la route BGP, et les annonces du réseau local restent inchangées.
      options:
        a: { en: "Sending the firewall's default route to the gateway is forced tunneling: it requires the management NIC, which FW1 doesn't have, and the traffic wouldn't leave directly.", fr: "Envoyer la route par défaut du pare-feu vers la passerelle, c'est le tunneling forcé : il exige la carte réseau de gestion, que FW1 n'a pas, et le trafic ne sortirait pas directement." }
        b: { en: "This setting only disables SNAT for all destinations; the firewall's own routing still follows the BGP default route, and without SNAT it could never egress directly.", fr: "Ce paramètre ne fait que désactiver le SNAT pour toutes les destinations ; le routage du pare-feu suit toujours la route par défaut BGP, et sans SNAT il ne pourrait jamais sortir directement." }
        d: { en: "The spoke subnets would learn the on-premises default route and send internet traffic to ExpressRoute, bypassing FW1.", fr: "Les sous-réseaux spokes apprendraient la route par défaut du réseau local et enverraient le trafic Internet vers ExpressRoute en contournant FW1." }
    references:
      - title: Azure Firewall FAQ
        url: https://learn.microsoft.com/en-us/azure/firewall/firewall-faq
      - title: Azure Firewall forced tunneling
        url: https://learn.microsoft.com/en-us/azure/firewall/forced-tunneling

  # ------------------------------------------------------------------ 9
  - id: az700-qz-53-09
    objective: "5.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam has an Azure Firewall Standard named **FW1** in a hub virtual network. FW1 uses the default SNAT settings, and DNS proxy is enabled. The on-premises network uses 172.16.0.0/16 and is connected through a VPN gateway in the hub. A spoke virtual machine named **VM1** has the IP address 10.20.1.4, and its subnet sends all traffic to FW1.

        The firewall policy of FW1 contains no network rules and the following application rules:

        - Allow HTTPS from 10.20.0.0/16 to the target FQDN `intranet.fabrikam.local`, which resolves to the on-premises server 172.16.5.10.
        - Allow HTTPS from 10.20.0.0/16 to the target FQDN `api.tailspin.example`, an internet API.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un Pare-feu Azure Standard nommé **FW1** dans un réseau virtuel hub. FW1 utilise les paramètres SNAT par défaut, et le proxy DNS est activé. Le réseau local utilise 172.16.0.0/16 et est connecté par une passerelle VPN dans le hub. Une machine virtuelle spoke nommée **VM1** a l'adresse IP 10.20.1.4, et son sous-réseau envoie tout le trafic vers FW1.

        La stratégie de pare-feu de FW1 ne contient aucune règle de réseau et les règles d'application suivantes :

        - Autoriser le HTTPS de 10.20.0.0/16 vers le FQDN cible `intranet.fabrikam.local`, qui se résout en l'adresse du serveur local 172.16.5.10.
        - Autoriser le HTTPS de 10.20.0.0/16 vers le FQDN cible `api.tailspin.example`, une API Internet.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si elle est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The on-premises server 172.16.5.10 sees a private IP address of FW1, not 10.20.1.4, as the source of the HTTPS connections from VM1.", fr: "Le serveur local 172.16.5.10 voit une adresse IP privée de FW1, et non 10.20.1.4, comme source des connexions HTTPS de VM1." } }
        - { id: s2, text: { en: "If you replace the rule for `api.tailspin.example` with a network rule for TCP 443 to the same destination FQDN, the FW1 logs can show 10.20.1.4 as the source of these connections.", fr: "Si vous remplacez la règle de `api.tailspin.example` par une règle de réseau pour TCP 443 vers le même FQDN de destination, les journaux de FW1 peuvent indiquer 10.20.1.4 comme source de ces connexions." } }
        - { id: s3, text: { en: "If you set the SNAT private IP address ranges to 0.0.0.0/0, the internet traffic that network rules allow still leaves FW1 with its public IP address as the source.", fr: "Si vous définissez les plages d'adresses IP privées SNAT sur 0.0.0.0/0, le trafic Internet autorisé par des règles de réseau sort toujours de FW1 avec son adresse IP publique comme source." } }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Traffic processed by application rules is always SNATed, even to a private destination, so the on-premises server sees a firewall address. The exemption for RFC 1918 destinations applies to network rules; a network rule with a destination FQDN (which relies on DNS proxy) keeps the original source in the logs. Adding 0.0.0.0/0 to the private ranges disables SNAT for every destination, so the firewall can no longer egress directly to the internet with its public IP address.
        fr: |
          Le trafic traité par des règles d'application est toujours traduit (SNAT), même vers une destination privée : le serveur local voit donc une adresse du pare-feu. L'exemption pour les destinations RFC 1918 s'applique aux règles de réseau ; une règle de réseau avec un FQDN de destination (qui s'appuie sur le proxy DNS) conserve la source d'origine dans les journaux. Ajouter 0.0.0.0/0 aux plages privées désactive le SNAT pour toutes les destinations : le pare-feu ne peut alors plus sortir directement vers Internet avec son adresse IP publique.
      options:
        s3: { en: "With 0.0.0.0/0 as a private range, no destination is SNATed: this setting is meant for forced tunneling, and Azure Firewall can then never egress directly to the internet.", fr: "Avec 0.0.0.0/0 comme plage privée, aucune destination n'est traduite : ce paramètre est destiné au tunneling forcé, et le Pare-feu Azure ne peut alors jamais sortir directement vers Internet." }
    references:
      - title: Azure Firewall FAQ
        url: https://learn.microsoft.com/en-us/azure/firewall/firewall-faq
      - title: Azure Firewall forced tunneling
        url: https://learn.microsoft.com/en-us/azure/firewall/forced-tunneling

  # ------------------------------------------------------------------ 10
  - id: az700-qz-53-10
    objective: "5.2.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso has an Azure Firewall Standard named **FW1** with the public IP address 20.10.0.4. FW1 is associated with a firewall policy named **FWP-App**, whose parent policy is **FWP-Base**. Threat intelligence is set to **Alert and deny** in FWP-Base. The IP address 203.0.113.66 is listed in the Microsoft Threat Intelligence feed. All the spoke subnets route their traffic to FW1.

        The policies contain the following rule collections:

        | Policy | Rule collection group (priority) | Rule collection (priority) | Type | Rule |
        | --- | --- | --- | --- | --- |
        | FWP-Base | RCG-Base (500) | NC-DenyRDP (510) | Network, Deny | Source *, TCP, destination 10.2.0.0/16, port 3389 |
        | FWP-Base | RCG-Base (500) | AC-DenySocial (520) | Application, Deny | Source *, Https:443, target FQDN `*.social.example` |
        | FWP-App | RCG-App (100) | DNAT-RDP (110) | DNAT | Source 198.51.100.0/24, TCP, destination 20.10.0.4 port 3389, translated to 10.2.0.7 port 3389 |
        | FWP-App | RCG-App (100) | AC-AllowAll (120) | Application, Allow | Source 10.0.0.0/8, Https:443, target FQDN `*` |

        What is the outcome of each connection? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un Pare-feu Azure Standard nommé **FW1** d'adresse IP publique 20.10.0.4. FW1 est associé à une stratégie de pare-feu nommée **FWP-App**, dont la stratégie parente est **FWP-Base**. Le renseignement sur les menaces est réglé sur **Alerte et refus** dans FWP-Base. L'adresse IP 203.0.113.66 figure dans le flux Microsoft Threat Intelligence. Tous les sous-réseaux spokes routent leur trafic vers FW1.

        Les stratégies contiennent les collections de règles suivantes :

        | Stratégie | Groupe de collections de règles (priorité) | Collection de règles (priorité) | Type | Règle |
        | --- | --- | --- | --- | --- |
        | FWP-Base | RCG-Base (500) | NC-DenyRDP (510) | Réseau, Deny | Source *, TCP, destination 10.2.0.0/16, port 3389 |
        | FWP-Base | RCG-Base (500) | AC-DenySocial (520) | Application, Deny | Source *, Https:443, FQDN cible `*.social.example` |
        | FWP-App | RCG-App (100) | DNAT-RDP (110) | DNAT | Source 198.51.100.0/24, TCP, destination 20.10.0.4 port 3389, traduite en 10.2.0.7 port 3389 |
        | FWP-App | RCG-App (100) | AC-AllowAll (120) | Application, Allow | Source 10.0.0.0/8, Https:443, FQDN cible `*` |

        Quel est le résultat de chaque connexion ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          HTTPS from 10.3.0.8 to 203.0.113.66: [[c1]]

          HTTPS from 10.3.0.8 to `www.social.example`: [[c2]]

          HTTPS from 10.3.0.8 to `www.fabrikam.example`: [[c3]]

          RDP (TCP 3389) from 198.51.100.20 to 20.10.0.4: [[c4]]
        fr: |
          HTTPS de 10.3.0.8 vers 203.0.113.66 : [[c1]]

          HTTPS de 10.3.0.8 vers `www.social.example` : [[c2]]

          HTTPS de 10.3.0.8 vers `www.fabrikam.example` : [[c3]]

          RDP (TCP 3389) de 198.51.100.20 vers 20.10.0.4 : [[c4]]
      slots:
        - id: c1
          options:
            - { id: ti, text: { en: "Denied by threat intelligence", fr: "Refusée par le renseignement sur les menaces" } }
            - { id: acall, text: { en: "Allowed by AC-AllowAll", fr: "Autorisée par AC-AllowAll" } }
            - { id: acsoc, text: { en: "Denied by AC-DenySocial", fr: "Refusée par AC-DenySocial" } }
            - { id: ncrdp, text: { en: "Denied by NC-DenyRDP", fr: "Refusée par NC-DenyRDP" } }
            - { id: dnat, text: { en: "Allowed by DNAT-RDP", fr: "Autorisée par DNAT-RDP" } }
        - id: c2
          options:
            - { id: ti, text: { en: "Denied by threat intelligence", fr: "Refusée par le renseignement sur les menaces" } }
            - { id: acall, text: { en: "Allowed by AC-AllowAll", fr: "Autorisée par AC-AllowAll" } }
            - { id: acsoc, text: { en: "Denied by AC-DenySocial", fr: "Refusée par AC-DenySocial" } }
            - { id: ncrdp, text: { en: "Denied by NC-DenyRDP", fr: "Refusée par NC-DenyRDP" } }
            - { id: dnat, text: { en: "Allowed by DNAT-RDP", fr: "Autorisée par DNAT-RDP" } }
        - id: c3
          options:
            - { id: ti, text: { en: "Denied by threat intelligence", fr: "Refusée par le renseignement sur les menaces" } }
            - { id: acall, text: { en: "Allowed by AC-AllowAll", fr: "Autorisée par AC-AllowAll" } }
            - { id: acsoc, text: { en: "Denied by AC-DenySocial", fr: "Refusée par AC-DenySocial" } }
            - { id: ncrdp, text: { en: "Denied by NC-DenyRDP", fr: "Refusée par NC-DenyRDP" } }
            - { id: dnat, text: { en: "Allowed by DNAT-RDP", fr: "Autorisée par DNAT-RDP" } }
        - id: c4
          options:
            - { id: ti, text: { en: "Denied by threat intelligence", fr: "Refusée par le renseignement sur les menaces" } }
            - { id: acall, text: { en: "Allowed by AC-AllowAll", fr: "Autorisée par AC-AllowAll" } }
            - { id: acsoc, text: { en: "Denied by AC-DenySocial", fr: "Refusée par AC-DenySocial" } }
            - { id: ncrdp, text: { en: "Denied by NC-DenyRDP", fr: "Refusée par NC-DenyRDP" } }
            - { id: dnat, text: { en: "Allowed by DNAT-RDP", fr: "Autorisée par DNAT-RDP" } }
    answer:
      values: { c1: ti, c2: acsoc, c3: acall, c4: dnat }
    explanation:
      correct:
        en: |
          Threat intelligence in Alert and deny mode, inherited from the parent policy, is processed before any rule, so the connection to 203.0.113.66 is denied even though AC-AllowAll would allow it. Within the application rules, the parent policy's collections are processed before the child's whatever the priorities, so AC-DenySocial (group 500) wins over AC-AllowAll (group 100) for `www.social.example`, while `www.fabrikam.example` only matches AC-AllowAll. A DNAT match translates and allows the traffic without further network rule processing, so NC-DenyRDP doesn't block the published RDP connection.
        fr: |
          Le renseignement sur les menaces en mode Alerte et refus, hérité de la stratégie parente, est traité avant toute règle : la connexion vers 203.0.113.66 est refusée même si AC-AllowAll l'autoriserait. Parmi les règles d'application, les collections de la stratégie parente sont traitées avant celles de l'enfant, quelles que soient les priorités : AC-DenySocial (groupe 500) l'emporte donc sur AC-AllowAll (groupe 100) pour `www.social.example`, tandis que `www.fabrikam.example` ne correspond qu'à AC-AllowAll. Une correspondance DNAT traduit et autorise le trafic sans traitement supplémentaire par les règles de réseau : NC-DenyRDP ne bloque donc pas la connexion RDP publiée.
      options:
        acall: { en: "AC-AllowAll is in a group with a lower priority number, but parent collections are always processed first, and threat intelligence comes before any rule.", fr: "AC-AllowAll se trouve dans un groupe de numéro de priorité inférieur, mais les collections de la stratégie parente sont toujours traitées en premier, et le renseignement sur les menaces passe avant toute règle." }
        ncrdp: { en: "Network rules aren't applied to traffic that a DNAT rule has already translated and allowed.", fr: "Les règles de réseau ne s'appliquent pas au trafic qu'une règle DNAT a déjà traduit et autorisé." }
    references:
      - title: Azure Firewall rule processing logic
        url: https://learn.microsoft.com/en-us/azure/firewall/rule-processing
      - title: Azure Firewall Manager policy overview
        url: https://learn.microsoft.com/en-us/azure/firewall-manager/policy-overview
