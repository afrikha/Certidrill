chapter: 21-site-to-site-vpn
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-21-01
    objective: "2.1.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam is creating a local network gateway for its Lyon branch office. The branch VPN device has the public IP address 203.0.113.10, and the branch networks use 10.5.0.0/16. BGP won't be used on the connection.

        What should the **Address space** of the local network gateway contain?
      fr: |
        Fabrikam crée une passerelle de réseau local pour son agence de Lyon. L'appareil VPN de l'agence a l'adresse IP publique 203.0.113.10, et les réseaux de l'agence utilisent 10.5.0.0/16. BGP ne sera pas utilisé sur la connexion.

        Que doit contenir l'**espace d'adressage** de la passerelle de réseau local ?
    body:
      options:
        - { id: a, text: { en: "10.5.0.0/16 only, the prefix of the branch networks", fr: "10.5.0.0/16 uniquement, le préfixe des réseaux de l'agence" } }
        - { id: b, text: { en: "10.5.0.0/16 and 203.0.113.10/32, the device's public IP", fr: "10.5.0.0/16 et 203.0.113.10/32, l'IP publique de l'appareil" } }
        - { id: c, text: { en: "203.0.113.10/32 only, the public IP of the branch device", fr: "203.0.113.10/32 uniquement, l'IP publique de l'appareil de l'agence" } }
        - { id: d, text: { en: "The address space of the Azure virtual network to connect", fr: "L'espace d'adressage du réseau virtuel Azure à connecter" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The address space of a local network gateway lists the prefixes located on the on-premises network that Azure must route to this device, here 10.5.0.0/16. Without BGP, these prefixes are the only routes Azure has to the branch. The device's public IP address is entered as the endpoint, not as a prefix.
        fr: |
          L'espace d'adressage d'une passerelle de réseau local liste les préfixes situés sur le réseau local qu'Azure doit router vers cet appareil, ici 10.5.0.0/16. Sans BGP, ces préfixes sont les seules routes dont Azure dispose vers l'agence. L'adresse IP publique de l'appareil se saisit comme point de terminaison, pas comme préfixe.
      options:
        b: { en: "Including the Internet-facing IP address of the device in the local network definition can cause sporadic disconnections of the tunnel.", fr: "Inclure l'adresse IP publique de l'appareil dans la définition du réseau local peut provoquer des déconnexions sporadiques du tunnel." }
        c: { en: "The public IP address goes in the IP address endpoint field; with it as the only prefix, Azure would have no route to 10.5.0.0/16.", fr: "L'adresse IP publique se saisit dans le champ du point de terminaison ; si elle était le seul préfixe, Azure n'aurait aucune route vers 10.5.0.0/16." }
        d: { en: "The local network gateway describes the on-premises side; the virtual network's ranges are already known to the VPN gateway.", fr: "La passerelle de réseau local décrit le côté local ; les plages du réseau virtuel sont déjà connues de la passerelle VPN." }
    references:
      - title: "Tutorial - Create S2S VPN connection between on-premises network and Azure virtual network: Azure portal - Azure VPN Gateway"
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/tutorial-site-to-site-portal
      - title: Troubleshoot an Azure S2S VPN connection that can't connect - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-troubleshoot-site-to-site-cannot-connect

  # ------------------------------------------------------------------ 2
  - id: az700-qz-21-02
    objective: "2.1.9"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso plans to use Azure Extended Network to stretch the on-premises subnet 192.168.40.0/24 into a virtual network during a migration. The on-premises virtual appliance and the Azure virtual appliance are already deployed, each with one NIC in a routable subnet and one NIC in the extended subnet.

        What should you use to deploy and manage the extended network?
      fr: |
        Contoso prévoit d'utiliser Azure Extended Network pour étendre le sous-réseau local 192.168.40.0/24 dans un réseau virtuel pendant une migration. L'appliance virtuelle locale et l'appliance virtuelle Azure sont déjà déployées, chacune avec une carte réseau dans un sous-réseau routable et une carte réseau dans le sous-réseau étendu.

        Que devez-vous utiliser pour déployer et gérer le réseau étendu ?
    body:
      options:
        - { id: a, text: { en: "The Extended network extension of Windows Admin Center, run from a third machine connected to Azure", fr: "L'extension Extended network de Windows Admin Center, exécutée depuis une troisième machine connectée à Azure" } }
        - { id: b, text: { en: "The Extended network extension of Windows Admin Center, installed on the Azure virtual appliance", fr: "L'extension Extended network de Windows Admin Center, installée sur l'appliance virtuelle Azure" } }
        - { id: c, text: { en: "The Azure Network Adapter feature of Windows Admin Center, run from a third machine connected to Azure", fr: "La fonctionnalité Azure Network Adapter de Windows Admin Center, exécutée depuis une troisième machine connectée à Azure" } }
        - { id: d, text: { en: "The Subnets page of the virtual network in the Azure portal, on the subnet that uses 192.168.40.0/24", fr: "La page Sous-réseaux du réseau virtuel dans le portail Azure, sur le sous-réseau qui utilise 192.168.40.0/24" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Azure Extended Network is deployed and managed with the Extended network extension of Windows Admin Center, which must be connected to Azure. Windows Admin Center must not run on either virtual appliance: it runs on a separate machine that manages both appliances.
        fr: |
          Azure Extended Network se déploie et se gère avec l'extension Extended network de Windows Admin Center, qui doit être connecté à Azure. Windows Admin Center ne doit tourner sur aucune des deux appliances virtuelles : il s'exécute sur une machine distincte qui gère les deux appliances.
      options:
        b: { en: "Windows Admin Center must not run on the extended network appliances; it runs on another machine.", fr: "Windows Admin Center ne doit pas tourner sur les appliances du réseau étendu ; il s'exécute sur une autre machine." }
        c: { en: "Azure Network Adapter connects a single server to a virtual network over a point-to-site VPN; it doesn't stretch a subnet.", fr: "Azure Network Adapter relie un seul serveur à un réseau virtuel par un VPN de point à site ; il n'étend pas un sous-réseau." }
        d: { en: "Creating a subnet with the same range in Azure is a prerequisite, but the portal doesn't configure the VXLAN tunnel between the appliances.", fr: "Créer un sous-réseau de même plage dans Azure est un prérequis, mais le portail ne configure pas le tunnel VXLAN entre les appliances." }
    references:
      - title: Extend your on-premises subnets into Azure using extended network for Azure
        url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/azure/azure-extended-network

  # ------------------------------------------------------------------ 3
  - id: az700-qz-21-03
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has a virtual network named **VNet-Lab** that contains a route-based VPN gateway named **GW-Lab**. GW-Lab uses the Basic SKU and has one site-to-site connection to the lab office.

        The lab office must now exchange routes with Azure by using BGP. The solution must minimize costs.

        What should you do?
      fr: |
        Adatum dispose d'un réseau virtuel nommé **VNet-Lab** qui contient une passerelle VPN basée sur des routes nommée **GW-Lab**. GW-Lab utilise la référence SKU Basic et a une connexion de site à site vers le bureau du laboratoire.

        Le bureau du laboratoire doit désormais échanger ses routes avec Azure par BGP. La solution doit réduire les coûts au minimum.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Change the SKU of GW-Lab to VpnGw1AZ on its Configuration page; the gateway keeps its public IP address.", fr: "Changer la référence SKU de GW-Lab en VpnGw1AZ dans sa page Configuration ; la passerelle garde son adresse IP publique." } }
        - { id: b, text: { en: "Delete GW-Lab, create a VpnGw1AZ gateway, re-create the connection, and update the lab device with the new public IP.", fr: "Supprimer GW-Lab, créer une passerelle VpnGw1AZ, recréer la connexion et mettre à jour l'appareil avec la nouvelle IP publique." } }
        - { id: c, text: { en: "Enable BGP on the existing connection, then add the ASN and BGP peer IP of the lab device to its local network gateway.", fr: "Activer BGP sur la connexion existante, puis ajouter l'ASN et l'IP de pair BGP de l'appareil à sa passerelle de réseau local." } }
        - { id: d, text: { en: "Migrate GW-Lab to VpnGw1AZ with the VPN Gateway SKU migration, which keeps the public IP address and the connection.", fr: "Migrer GW-Lab vers VpnGw1AZ avec la migration de référence SKU de VPN Gateway, qui garde l'IP publique et la connexion." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The Basic SKU doesn't support BGP, and a Basic gateway can't be upgraded to another SKU: you must delete it and create a new gateway, here VpnGw1AZ, the least expensive SKU with BGP. The new gateway gets a new public IP address, so the connection is re-created and the lab device is updated with the new address.
        fr: |
          La référence SKU Basic ne prend pas en charge BGP, et une passerelle Basic ne peut pas être mise à niveau vers une autre référence : il faut la supprimer et créer une nouvelle passerelle, ici VpnGw1AZ, la référence la moins chère avec BGP. La nouvelle passerelle reçoit une nouvelle adresse IP publique : la connexion est recréée et l'appareil du laboratoire est mis à jour avec la nouvelle adresse.
      options:
        a: { en: "Upgrading in place keeps the public IP address, but it isn't available for a Basic gateway: Basic to any other SKU is delete and re-create only.", fr: "La mise à niveau sur place garde l'adresse IP publique, mais elle n'est pas possible pour une passerelle Basic : de Basic vers une autre référence, il faut supprimer et recréer." }
        c: { en: "BGP can't be enabled on a connection of a Basic gateway, because the Basic SKU doesn't support BGP.", fr: "BGP ne peut pas être activé sur une connexion d'une passerelle Basic, car la référence SKU Basic ne prend pas en charge BGP." }
        d: { en: "The SKU migration moves non-AZ VpnGw1-5 and legacy gateways to the AZ SKUs; it doesn't apply to a Basic gateway.", fr: "La migration de référence SKU fait passer les passerelles VpnGw1-5 non AZ et les anciennes références vers les références AZ ; elle ne s'applique pas à une passerelle Basic." }
    references:
      - title: Upgrade a VPN Gateway SKU - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/gateway-sku-upgrade
      - title: About gateway SKUs
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-gateway-skus

  # ------------------------------------------------------------------ 4
  - id: az700-qz-21-04
    objective: "2.1.6"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders will apply a custom IPsec/IKE policy to the site-to-site connection between a VpnGw2AZ gateway and the firewall of its Lyon office. The firewall is configured as follows:

        | Phase | Firewall configuration |
        | --- | --- |
        | IKE (Main Mode) | AES256, SHA256, Diffie-Hellman group 14, SA lifetime 3,600 seconds |
        | IPsec (Quick Mode) | AES256, SHA256, PFS with Diffie-Hellman group 14, SA lifetime 3,600 seconds |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders va appliquer une stratégie IPsec/IKE personnalisée à la connexion de site à site entre une passerelle VpnGw2AZ et le pare-feu de son bureau de Lyon. Le pare-feu est configuré ainsi :

        | Phase | Configuration du pare-feu |
        | --- | --- |
        | IKE (mode principal) | AES256, SHA256, groupe Diffie-Hellman 14, durée de vie des SA de 3 600 secondes |
        | IPsec (mode rapide) | AES256, SHA256, PFS avec le groupe Diffie-Hellman 14, durée de vie des SA de 3 600 secondes |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: To match Diffie-Hellman group 14 in Main Mode, you can select DHGroup2048 as the DH group of the policy.
            fr: Pour correspondre au groupe Diffie-Hellman 14 en mode principal, vous pouvez sélectionner DHGroup2048 comme groupe DH de la stratégie.
        - id: s2
          text:
            en: You can set the IKE Main Mode SA lifetime of the connection to 3,600 seconds.
            fr: Vous pouvez définir la durée de vie des SA IKE en mode principal de la connexion à 3 600 secondes.
        - id: s3
          text:
            en: You can set the IPsec Quick Mode SA lifetime of the connection to 3,600 seconds.
            fr: Vous pouvez définir la durée de vie des SA IPsec en mode rapide de la connexion à 3 600 secondes.
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Diffie-Hellman group 14 (2048-bit MODP) appears in the policy as DHGroup14 or DHGroup2048, so either value matches the firewall. The Main Mode SA lifetime is fixed at 28,800 seconds on Azure VPN gateways and isn't a policy parameter. The Quick Mode SA lifetime is configurable, from a minimum of 300 seconds (default 27,000), so 3,600 seconds is accepted.
        fr: |
          Le groupe Diffie-Hellman 14 (MODP 2048 bits) apparaît dans la stratégie sous DHGroup14 ou DHGroup2048 : les deux valeurs correspondent au pare-feu. La durée de vie des SA en mode principal est fixée à 28 800 secondes sur les passerelles VPN Azure et n'est pas un paramètre de la stratégie. La durée de vie des SA en mode rapide est configurable, à partir de 300 secondes (27 000 par défaut) : 3 600 secondes est accepté.
      options:
        s2: { en: "Only the Quick Mode lifetimes (seconds and kilobytes) are policy parameters; Main Mode stays at 28,800 seconds.", fr: "Seules les durées de vie du mode rapide (secondes et kilo-octets) sont des paramètres de la stratégie ; le mode principal reste à 28 800 secondes." }
    references:
      - title: "Configure custom IPsec/IKE connection policies for S2S VPN & VNet-to-VNet: Azure portal - Azure VPN Gateway"
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/ipsec-ike-policy-howto
      - title: Cryptographic requirements for VPN gateways - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-compliance-crypto

  # ------------------------------------------------------------------ 5
  - id: az700-qz-21-05
    objective: "2.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware has a virtual network named **VNet1** (10.1.0.0/16) that contains a route-based VPN gateway named **VNet1GW** (VpnGw2AZ). VNet1GW has a site-to-site connection to the Paris office. The Paris VPN device is represented by a local network gateway named **LNG-Paris** whose address space is 10.2.0.0/16.

        Litware opens a Berlin office with its own VPN device (public IP address 198.51.100.40) and the network 10.3.0.0/16. Berlin must connect to VNet1 by using a site-to-site VPN.

        What should you do?
      fr: |
        Litware dispose d'un réseau virtuel nommé **VNet1** (10.1.0.0/16) qui contient une passerelle VPN basée sur des routes nommée **VNet1GW** (VpnGw2AZ). VNet1GW a une connexion de site à site vers le bureau de Paris. L'appareil VPN de Paris est représenté par une passerelle de réseau local nommée **LNG-Paris** dont l'espace d'adressage est 10.2.0.0/16.

        Litware ouvre un bureau à Berlin avec son propre appareil VPN (adresse IP publique 198.51.100.40) et le réseau 10.3.0.0/16. Berlin doit se connecter à VNet1 par un VPN de site à site.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add 10.3.0.0/16 to the address space of LNG-Paris, and add 198.51.100.40 as a second endpoint of LNG-Paris.", fr: "Ajouter 10.3.0.0/16 à l'espace d'adressage de LNG-Paris, et ajouter 198.51.100.40 comme second point de terminaison de LNG-Paris." } }
        - { id: b, text: { en: "Create a local network gateway for the Berlin device, then create a site-to-site connection from VNet1GW to it.", fr: "Créer une passerelle de réseau local pour l'appareil de Berlin, puis créer une connexion de site à site de VNet1GW vers celle-ci." } }
        - { id: c, text: { en: "Create a second VPN gateway in VNet1, then connect it to a local network gateway for the Berlin device.", fr: "Créer une seconde passerelle VPN dans VNet1, puis la connecter à une passerelle de réseau local pour l'appareil de Berlin." } }
        - { id: d, text: { en: "Create a second connection from VNet1GW to LNG-Paris, and configure the Berlin device with its shared key.", fr: "Créer une seconde connexion de VNet1GW vers LNG-Paris, et configurer l'appareil de Berlin avec sa clé partagée." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A route-based gateway accepts several site-to-site connections. Each site is represented by its own local network gateway, with its device's public IP address and its prefixes, and each one gets its own connection from the existing gateway. The ranges of the sites must not overlap each other or the virtual network, which is the case here.
        fr: |
          Une passerelle basée sur des routes accepte plusieurs connexions de site à site. Chaque site est représenté par sa propre passerelle de réseau local, avec l'adresse IP publique de son appareil et ses préfixes, et reçoit sa propre connexion depuis la passerelle existante. Les plages des sites ne doivent se chevaucher ni entre elles ni avec le réseau virtuel, ce qui est le cas ici.
      options:
        a: { en: "A local network gateway has one endpoint and describes one device; Berlin traffic routed to LNG-Paris would be sent to the Paris device.", fr: "Une passerelle de réseau local a un seul point de terminaison et décrit un seul appareil ; le trafic de Berlin routé vers LNG-Paris serait envoyé à l'appareil de Paris." }
        c: { en: "A virtual network can contain only one VPN gateway; the existing gateway accepts additional connections.", fr: "Un réseau virtuel ne peut contenir qu'une seule passerelle VPN ; la passerelle existante accepte d'autres connexions." }
        d: { en: "A connection to LNG-Paris targets the Paris device's public IP address; the Berlin device would never be reached.", fr: "Une connexion vers LNG-Paris vise l'adresse IP publique de l'appareil de Paris ; l'appareil de Berlin ne serait jamais joint." }
    references:
      - title: Add or remove site-to-site connections - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-howto-multi-site-to-site-resource-manager-portal

  # ------------------------------------------------------------------ 6
  - id: az700-qz-21-06
    objective: "2.1.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys connects a virtual network to a partner network by using a site-to-site VPN. The partner's VPN device runs BGP over the tunnel and accepts only APIPA addresses for the BGP session:

        | Setting | Partner value |
        | --- | --- |
        | Device public IP address | 198.51.100.77 |
        | Device ASN | 64600 |
        | Device BGP peer IP address | 169.254.21.2 |
        | Azure BGP peer IP address expected by the device | 169.254.21.1 |

        Tailspin has an active-standby VPN gateway named **GW-Partner** (VpnGw2AZ, BGP enabled, ASN 65515) and is creating a local network gateway named **LNG-Partner** for the device.

        You need to ensure that the BGP session can be established. What should you do?
      fr: |
        Tailspin Toys relie un réseau virtuel au réseau d'un partenaire par un VPN de site à site. L'appareil VPN du partenaire exécute BGP dans le tunnel et n'accepte que des adresses APIPA pour la session BGP :

        | Paramètre | Valeur du partenaire |
        | --- | --- |
        | Adresse IP publique de l'appareil | 198.51.100.77 |
        | ASN de l'appareil | 64600 |
        | Adresse IP de pair BGP de l'appareil | 169.254.21.2 |
        | Adresse IP de pair BGP Azure attendue par l'appareil | 169.254.21.1 |

        Tailspin dispose d'une passerelle VPN actif/passif nommée **GW-Partner** (VpnGw2AZ, BGP activé, ASN 65515) et crée une passerelle de réseau local nommée **LNG-Partner** pour l'appareil.

        Vous devez faire en sorte que la session BGP puisse s'établir. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "On GW-Partner, set the custom Azure APIPA BGP IP address to 169.254.21.1. On LNG-Partner, set the BGP peer IP address to 169.254.21.2 and leave the address space empty.", fr: "Sur GW-Partner, définir l'adresse IP BGP APIPA Azure personnalisée sur 169.254.21.1. Sur LNG-Partner, définir l'adresse IP du pair BGP sur 169.254.21.2 et laisser l'espace d'adressage vide." } }
        - { id: b, text: { en: "Keep the default BGP settings of GW-Partner. On LNG-Partner, set the BGP peer IP address to 169.254.21.2 and add 169.254.21.2/32 to the address space.", fr: "Garder les paramètres BGP par défaut de GW-Partner. Sur LNG-Partner, définir l'adresse IP du pair BGP sur 169.254.21.2 et ajouter 169.254.21.2/32 à l'espace d'adressage." } }
        - { id: c, text: { en: "On GW-Partner, set the custom Azure APIPA BGP IP address to 169.254.21.1. On LNG-Partner, set the BGP peer IP address to 198.51.100.77 and leave the address space empty.", fr: "Sur GW-Partner, définir l'adresse IP BGP APIPA Azure personnalisée sur 169.254.21.1. Sur LNG-Partner, définir l'adresse IP du pair BGP sur 198.51.100.77 et laisser l'espace d'adressage vide." } }
        - { id: d, text: { en: "On the connection, enable Use Azure Private IP Address. On LNG-Partner, set the BGP peer IP address to 169.254.21.2 and leave the address space empty.", fr: "Sur la connexion, activer Use Azure Private IP Address. Sur LNG-Partner, définir l'adresse IP du pair BGP sur 169.254.21.2 et laisser l'espace d'adressage vide." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          When the on-premises device peers with an APIPA address, the VPN gateway must also use an APIPA address, chosen in the Azure-reserved range 169.254.21.0 to 169.254.22.255: 169.254.21.1 fits. The local network gateway carries the device's BGP peer IP address (169.254.21.2) and its ASN; with BGP, the address space can stay empty because Azure adds the route to the BGP peer itself.
        fr: |
          Quand l'appareil local établit sa session BGP avec une adresse APIPA, la passerelle VPN doit elle aussi utiliser une adresse APIPA, choisie dans la plage réservée par Azure de 169.254.21.0 à 169.254.22.255 : 169.254.21.1 convient. La passerelle de réseau local porte l'adresse IP de pair BGP de l'appareil (169.254.21.2) et son ASN ; avec BGP, l'espace d'adressage peut rester vide, car Azure ajoute lui-même la route vers le pair BGP.
      options:
        b: { en: "With its default settings, GW-Partner peers from an address of GatewaySubnet, not 169.254.21.1, so the session can't establish; an APIPA peer IP isn't entered in the address space either.", fr: "Avec ses paramètres par défaut, GW-Partner établit la session BGP depuis une adresse du GatewaySubnet, pas 169.254.21.1 : la session ne s'établit pas ; une IP de pair APIPA ne se saisit pas non plus dans l'espace d'adressage." }
        c: { en: "The BGP peer IP address of the local network gateway must match the device's BGP address (169.254.21.2), not its public IP address.", fr: "L'adresse IP du pair BGP de la passerelle de réseau local doit correspondre à l'adresse BGP de l'appareil (169.254.21.2), pas à son adresse IP publique." }
        d: { en: "Use Azure Private IP Address makes the tunnel use the gateway's private IP, for example over ExpressRoute private peering; it doesn't give the gateway an APIPA BGP address.", fr: "Use Azure Private IP Address fait utiliser l'IP privée de la passerelle au tunnel, par exemple sur le peering privé ExpressRoute ; il ne donne pas d'adresse BGP APIPA à la passerelle." }
    references:
      - title: "Configure BGP for VPN Gateway: Portal - Azure VPN Gateway"
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/bgp-howto

  # ------------------------------------------------------------------ 7
  - id: az700-qz-21-07
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank has the following environment:

        | Resource | Configuration |
        | --- | --- |
        | VNet-Hub | Route-based VPN gateway named GW-Hub (VpnGw2AZ) |
        | VNet-Spoke | Peered with VNet-Hub. The VNet-Hub side allows gateway transit, and the VNet-Spoke side uses the remote gateway of VNet-Hub |
        | Branch1 | Route-based VPN device. Connection to GW-Hub with BGP enabled |
        | Branch2 | Policy-based firewall that supports IKEv2. Connection to GW-Hub with a custom IPsec/IKE policy and policy-based traffic selectors enabled |

        Both connections are **Connected**, and network security groups allow all the traffic.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose de l'environnement suivant :

        | Ressource | Configuration |
        | --- | --- |
        | VNet-Hub | Passerelle VPN basée sur des routes nommée GW-Hub (VpnGw2AZ) |
        | VNet-Spoke | Peering avec VNet-Hub. Le côté VNet-Hub autorise le transit par passerelle, et le côté VNet-Spoke utilise la passerelle distante de VNet-Hub |
        | Branch1 | Appareil VPN basé sur des routes. Connexion à GW-Hub avec BGP activé |
        | Branch2 | Pare-feu basé sur des stratégies qui prend en charge IKEv2. Connexion à GW-Hub avec une stratégie IPsec/IKE personnalisée et les sélecteurs de trafic basés sur une stratégie activés |

        Les deux connexions sont **Connectées**, et les groupes de sécurité réseau autorisent tout le trafic.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: Servers in Branch1 can reach the virtual machines in VNet-Spoke.
            fr: Les serveurs de Branch1 peuvent joindre les machines virtuelles de VNet-Spoke.
        - id: s2
          text:
            en: Servers in Branch2 can reach the virtual machines in VNet-Spoke once the firewall defines traffic selectors for the VNet-Spoke prefixes.
            fr: Les serveurs de Branch2 peuvent joindre les machines virtuelles de VNet-Spoke dès que le pare-feu définit des sélecteurs de trafic pour les préfixes de VNet-Spoke.
        - id: s3
          text:
            en: Servers in Branch2 can reach servers in Branch1 through GW-Hub.
            fr: Les serveurs de Branch2 peuvent joindre les serveurs de Branch1 par GW-Hub.
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          With gateway transit, the site-to-site connectivity of GW-Hub applies to the peered spoke, so Branch1, a normal route-based connection, reaches VNet-Spoke. A connection with policy-based traffic selectors only gives its site access to the virtual network of the gateway: those sites can't transit to other on-premises networks or other virtual networks through the gateway. Adding selectors on the firewall doesn't lift this limit, so Branch2 reaches neither VNet-Spoke nor Branch1.
        fr: |
          Avec le transit par passerelle, la connectivité de site à site de GW-Hub s'applique au spoke relié par peering : Branch1, une connexion basée sur des routes classique, joint VNet-Spoke. Une connexion avec des sélecteurs de trafic basés sur une stratégie ne donne à son site accès qu'au réseau virtuel de la passerelle : ces sites ne peuvent pas transiter vers d'autres réseaux locaux ni vers d'autres réseaux virtuels par la passerelle. Ajouter des sélecteurs sur le pare-feu ne lève pas cette limite : Branch2 ne joint ni VNet-Spoke ni Branch1.
      options:
        s2: { en: "Policy-based traffic selectors on a route-based gateway cover only the gateway's virtual network and the site's prefixes, never a peered virtual network.", fr: "Les sélecteurs de trafic basés sur une stratégie d'une passerelle basée sur des routes ne couvrent que le réseau virtuel de la passerelle et les préfixes du site, jamais un réseau virtuel relié par peering." }
        s3: { en: "Sites connected with policy-based traffic selectors can't transit to other on-premises sites through the same gateway.", fr: "Les sites connectés avec des sélecteurs de trafic basés sur une stratégie ne peuvent pas transiter vers d'autres sites locaux par la même passerelle." }
    references:
      - title: Connect VPN gateways to multiple on-premises policy-based VPN devices - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-connect-multiple-policybased-rm-ps
      - title: Configure VPN gateway transit for virtual network peering - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-peering-gateway-transit

  # ------------------------------------------------------------------ 8
  - id: az700-qz-21-08
    objective: "2.1.8"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso has the following environment:

        | Resource | Configuration |
        | --- | --- |
        | VNet-Hub (10.10.0.0/16) | VPN gateway named GW-Hub with a site-to-site connection named HQ-Link, BGP disabled |
        | LNG-HQ | Local network gateway of HQ-Link: device public IP 203.0.113.20, address space 192.168.0.0/16 |
        | VNet-Spoke (10.20.0.0/16) | Peered with VNet-Hub |
        | Headquarters VPN device | Route-based, with static routes to Azure |

        HQ-Link is **Connected**. Headquarters servers in 192.168.0.0/16 can reach the virtual machines in VNet-Hub but not the virtual machines in VNet-Spoke. Network security groups allow all the traffic.

        Which two issues could cause this problem?

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose de l'environnement suivant :

        | Ressource | Configuration |
        | --- | --- |
        | VNet-Hub (10.10.0.0/16) | Passerelle VPN nommée GW-Hub avec une connexion de site à site nommée HQ-Link, BGP désactivé |
        | LNG-HQ | Passerelle de réseau local de HQ-Link : IP publique de l'appareil 203.0.113.20, espace d'adressage 192.168.0.0/16 |
        | VNet-Spoke (10.20.0.0/16) | Peering avec VNet-Hub |
        | Appareil VPN du siège | Basé sur des routes, avec des routes statiques vers Azure |

        HQ-Link est **Connecté**. Les serveurs du siège en 192.168.0.0/16 joignent les machines virtuelles de VNet-Hub, mais pas celles de VNet-Spoke. Les groupes de sécurité réseau autorisent tout le trafic.

        Quels sont les deux problèmes qui pourraient en être la cause ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The headquarters device routes only 10.10.0.0/16 through the tunnel.", fr: "L'appareil du siège ne route que 10.10.0.0/16 dans le tunnel." } }
        - { id: b, text: { en: "The address space of LNG-HQ doesn't include 10.20.0.0/16.", fr: "L'espace d'adressage de LNG-HQ n'inclut pas 10.20.0.0/16." } }
        - { id: c, text: { en: "The VNet-Spoke side of the peering doesn't use the remote gateway.", fr: "Le côté VNet-Spoke du peering n'utilise pas la passerelle distante." } }
        - { id: d, text: { en: "The shared key of HQ-Link doesn't match the key of the device.", fr: "La clé partagée de HQ-Link ne correspond pas à celle de l'appareil." } }
        - { id: e, text: { en: "HQ-Link uses the default IPsec/IKE policy, not a custom one.", fr: "HQ-Link utilise la stratégie IPsec/IKE par défaut, pas une personnalisée." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          A Connected tunnel and a reachable hub prove that the keys, peer addresses and crypto settings are fine: the fault is in routing to the spoke. With static routing, the headquarters device must send 10.20.0.0/16 into the tunnel; if it routes only the hub range, spoke traffic never enters the tunnel. On the Azure side, VNet-Spoke learns the routes of GW-Hub only if its peering uses the remote gateway (with gateway transit allowed on the hub side); otherwise spoke VMs have no return route to 192.168.0.0/16.
        fr: |
          Un tunnel Connecté et un hub joignable prouvent que les clés, les adresses des pairs et le chiffrement sont corrects : la panne est dans le routage vers le spoke. En routage statique, l'appareil du siège doit envoyer 10.20.0.0/16 dans le tunnel ; s'il ne route que la plage du hub, le trafic du spoke n'entre jamais dans le tunnel. Côté Azure, VNet-Spoke n'apprend les routes de GW-Hub que si son peering utilise la passerelle distante (avec le transit par passerelle autorisé côté hub) ; sinon, les VM du spoke n'ont pas de route de retour vers 192.168.0.0/16.
      options:
        b: { en: "The local network gateway lists the on-premises prefixes; the spoke range must not be added there, because Azure would route it to the headquarters.", fr: "La passerelle de réseau local liste les préfixes locaux ; la plage du spoke ne doit pas y figurer, car Azure la routerait vers le siège." }
        d: { en: "A shared key mismatch prevents the tunnel from being established, but HQ-Link is Connected and the hub is reachable.", fr: "Une clé partagée différente empêche l'établissement du tunnel, or HQ-Link est Connecté et le hub est joignable." }
        e: { en: "The default policy works with a matching device, as the Connected status and the reachable hub show; a custom policy changes no routes.", fr: "La stratégie par défaut fonctionne avec un appareil compatible, comme le montrent l'état Connecté et le hub joignable ; une stratégie personnalisée ne change aucune route." }
    references:
      - title: Configure VPN gateway transit for virtual network peering - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-peering-gateway-transit
      - title: Troubleshoot an Azure S2S VPN connection that can't connect - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-troubleshoot-site-to-site-cannot-connect

  # ------------------------------------------------------------------ 9
  - id: az700-qz-21-09
    objective: "2.1.7"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Fabrikam has an active-standby VPN gateway named **GW-Core** (VpnGw2AZ) with one site-to-site connection named **Core-to-HQ** to a single headquarters device named **VPN-HQ**. BGP is enabled on the connection. GW-Core uses its default BGP peer IP address from GatewaySubnet (no APIPA address). The local network gateway **LNG-HQ** contains the public IP address, the ASN and the BGP peer IP address of VPN-HQ.

        You need to change GW-Core to active-active mode so that traffic uses a tunnel from each gateway instance to VPN-HQ.

        Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Fabrikam dispose d'une passerelle VPN actif/passif nommée **GW-Core** (VpnGw2AZ) avec une connexion de site à site nommée **Core-to-HQ** vers un seul appareil du siège nommé **VPN-HQ**. BGP est activé sur la connexion. GW-Core utilise son adresse IP de pair BGP par défaut, prise dans le GatewaySubnet (pas d'adresse APIPA). La passerelle de réseau local **LNG-HQ** contient l'adresse IP publique, l'ASN et l'adresse IP de pair BGP de VPN-HQ.

        Vous devez faire passer GW-Core en mode actif/actif pour que le trafic utilise un tunnel depuis chaque instance de la passerelle vers VPN-HQ.

        Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 3
      actions:
        - { id: enable, text: { en: "On the Configuration page of GW-Core, set Active-active mode to Enabled, add a second public IP address, and save.", fr: "Dans la page Configuration de GW-Core, définir Active-active mode sur Enabled, ajouter une seconde adresse IP publique et enregistrer." } }
        - { id: note, text: { en: "When the update completes, note the two public IP addresses and the two new BGP peer IP addresses of GW-Core.", fr: "Une fois la mise à jour terminée, relever les deux adresses IP publiques et les deux nouvelles adresses IP de pair BGP de GW-Core." } }
        - { id: device, text: { en: "On VPN-HQ, configure a tunnel to each public IP address of GW-Core and a BGP peer for each new BGP peer IP address.", fr: "Sur VPN-HQ, configurer un tunnel vers chaque adresse IP publique de GW-Core et un pair BGP pour chaque nouvelle adresse IP de pair BGP." } }
        - { id: newlng, text: { en: "Create a second local network gateway that represents VPN-HQ, with the same ASN and BGP peer IP address.", fr: "Créer une seconde passerelle de réseau local qui représente VPN-HQ, avec le même ASN et la même adresse IP de pair BGP." } }
        - { id: newconn, text: { en: "Create a second connection from GW-Core to LNG-HQ for the tunnel of the second gateway instance.", fr: "Créer une seconde connexion de GW-Core vers LNG-HQ pour le tunnel de la seconde instance de passerelle." } }
        - { id: lngbgp, text: { en: "On LNG-HQ, replace the BGP peer IP address with the new BGP peer IP address of GW-Core.", fr: "Sur LNG-HQ, remplacer l'adresse IP de pair BGP par la nouvelle adresse IP de pair BGP de GW-Core." } }
        - { id: reset, text: { en: "Reset GW-Core so that both instances of the gateway become active.", fr: "Réinitialiser GW-Core pour que les deux instances de la passerelle deviennent actives." } }
    answer:
      sequence: [enable, note, device]
    explanation:
      correct:
        en: |
          An active-standby gateway is changed to active-active on its Configuration page, with a second Standard public IP address. With non-APIPA BGP, this change replaces the single BGP IP address of the gateway with two new ones from GatewaySubnet and causes downtime, so you read the new addresses once provisioning completes. You then configure VPN-HQ with a tunnel to each gateway instance and with the new BGP peers; both tunnels belong to the existing Core-to-HQ connection.
        fr: |
          Une passerelle actif/passif passe en mode actif/actif dans sa page Configuration, avec une seconde adresse IP publique Standard. Avec un BGP sans APIPA, ce changement remplace l'unique adresse IP BGP de la passerelle par deux nouvelles adresses du GatewaySubnet et provoque une interruption : vous relevez les nouvelles adresses une fois le provisionnement terminé. Vous configurez ensuite VPN-HQ avec un tunnel vers chaque instance de la passerelle et avec les nouveaux pairs BGP ; les deux tunnels appartiennent à la connexion Core-to-HQ existante.
      options:
        newlng: { en: "A second local network gateway is for a second on-premises device; one device keeps one local network gateway.", fr: "Une seconde passerelle de réseau local sert à un second appareil local ; un appareil garde une seule passerelle de réseau local." }
        newconn: { en: "In active-active mode, the two tunnels to one device are part of the same connection; no second connection is created.", fr: "En mode actif/actif, les deux tunnels vers un même appareil font partie de la même connexion ; aucune seconde connexion n'est créée." }
        lngbgp: { en: "The local network gateway holds the BGP peer IP address of the on-premises device, which doesn't change; the new Azure addresses go on the device.", fr: "La passerelle de réseau local contient l'adresse IP de pair BGP de l'appareil local, qui ne change pas ; les nouvelles adresses Azure se configurent sur l'appareil." }
        reset: { en: "A reset reboots a gateway instance and reapplies its configuration; it doesn't change the gateway mode.", fr: "Une réinitialisation redémarre une instance de la passerelle et réapplique sa configuration ; elle ne change pas le mode de la passerelle." }
    references:
      - title: Change a gateway to active-active mode - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/gateway-change-active-active
      - title: About active-active VPN gateways - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-active-active-gateways

  # ------------------------------------------------------------------ 10
  - id: az700-qz-21-10
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware has a virtual network named **VNet-Hub** (10.10.0.0/16) that contains a route-based VPN gateway named **GW-Hub** (VpnGw1AZ, active-standby). GW-Hub has a site-to-site connection to the Site-A office, which uses 172.16.0.0/16.

        Proseware acquired a company whose office, Site-B, also uses 10.10.0.0/16 and can't be readdressed. Site-B will connect to GW-Hub through a site-to-site VPN with static routing and without policy-based traffic selectors. The range 100.64.0.0/10 is unused and can be used for address translation. The design must meet the following requirements:

        - Virtual machines in VNet-Hub and servers in Site-B must be able to start connections to each other.
        - The Site-A device configuration and the addresses that Site-A uses to reach VNet-Hub must not change.
        - Costs must be minimized.

        How should you complete the design? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'un réseau virtuel nommé **VNet-Hub** (10.10.0.0/16) qui contient une passerelle VPN basée sur des routes nommée **GW-Hub** (VpnGw1AZ, actif/passif). GW-Hub a une connexion de site à site vers le bureau Site-A, qui utilise 172.16.0.0/16.

        Proseware a racheté une société dont le bureau, Site-B, utilise lui aussi 10.10.0.0/16 et ne peut pas être réadressé. Site-B se connectera à GW-Hub par un VPN de site à site en routage statique et sans sélecteurs de trafic basés sur une stratégie. La plage 100.64.0.0/10 est inutilisée et peut servir à la traduction d'adresses. La conception doit répondre aux exigences suivantes :

        - Les machines virtuelles de VNet-Hub et les serveurs de Site-B doivent pouvoir ouvrir des connexions les uns vers les autres.
        - La configuration de l'appareil de Site-A et les adresses que Site-A utilise pour joindre VNet-Hub ne doivent pas changer.
        - Les coûts doivent être réduits au minimum.

        Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          SKU of GW-Hub: [[sku]]

          NAT rules to create on GW-Hub: [[rules]]

          Type of the NAT rules: [[type]]

          NAT rules to link to the Site-A connection: [[sitea]]
        fr: |
          Référence SKU de GW-Hub : [[sku]]

          Règles NAT à créer sur GW-Hub : [[rules]]

          Type des règles NAT : [[type]]

          Règles NAT à lier à la connexion de Site-A : [[sitea]]
      slots:
        - id: sku
          options:
            - { id: basic, text: Basic }
            - { id: gw1az, text: { en: "VpnGw1AZ (current SKU)", fr: "VpnGw1AZ (référence actuelle)" } }
            - { id: gw2az, text: VpnGw2AZ }
            - { id: gw4az, text: VpnGw4AZ }
        - id: rules
          options:
            - { id: ingress, text: { en: "An IngressSNAT rule for the Site-B range only", fr: "Une règle IngressSNAT pour la plage de Site-B uniquement" } }
            - { id: egress, text: { en: "An EgressSNAT rule for the VNet-Hub range only", fr: "Une règle EgressSNAT pour la plage de VNet-Hub uniquement" } }
            - { id: both, text: { en: "An IngressSNAT rule for Site-B and an EgressSNAT rule for VNet-Hub", fr: "Une règle IngressSNAT pour Site-B et une règle EgressSNAT pour VNet-Hub" } }
            - { id: reversed, text: { en: "An EgressSNAT rule for Site-B and an IngressSNAT rule for VNet-Hub", fr: "Une règle EgressSNAT pour Site-B et une règle IngressSNAT pour VNet-Hub" } }
        - id: type
          options:
            - { id: static, text: Static }
            - { id: dynamic, text: Dynamic }
            - { id: mixed, text: { en: "Static for the Site-B rule, Dynamic for the VNet-Hub rule", fr: "Static pour la règle de Site-B, Dynamic pour la règle de VNet-Hub" } }
        - id: sitea
          options:
            - { id: none, text: { en: "None", fr: "Aucune" } }
            - { id: aegress, text: { en: "The EgressSNAT rule", fr: "La règle EgressSNAT" } }
            - { id: aingress, text: { en: "The IngressSNAT rule", fr: "La règle IngressSNAT" } }
            - { id: aboth, text: { en: "Both rules", fr: "Les deux règles" } }
    answer:
      values: { sku: gw2az, rules: both, type: static, sitea: none }
    explanation:
      correct:
        en: |
          NAT on VPN Gateway requires VpnGw2AZ or above, so GW-Hub is resized from VpnGw1AZ to VpnGw2AZ, the least expensive SKU that supports it. Because both sides use 10.10.0.0/16, each side must see the other under a translated range: an IngressSNAT rule translates the Site-B range and an EgressSNAT rule translates the VNet-Hub range, both linked to the Site-B connection. Static rules are 1:1 and allow connections initiated from both sides, whereas dynamic rules only allow flows started from the internal mapping side. NAT applies only to the connections the rules are linked to, so the Site-A connection gets no rule and keeps using the real VNet-Hub addresses.
        fr: |
          Le NAT sur VPN Gateway exige VpnGw2AZ ou plus : GW-Hub passe de VpnGw1AZ à VpnGw2AZ, la référence la moins chère qui le prend en charge. Comme les deux côtés utilisent 10.10.0.0/16, chaque côté doit voir l'autre sous une plage traduite : une règle IngressSNAT traduit la plage de Site-B et une règle EgressSNAT traduit la plage de VNet-Hub, toutes deux liées à la connexion de Site-B. Les règles statiques sont 1:1 et autorisent les connexions ouvertes des deux côtés, alors que les règles dynamiques n'autorisent que les flux lancés depuis le côté du mappage interne. Le NAT ne s'applique qu'aux connexions auxquelles les règles sont liées : la connexion de Site-A ne reçoit aucune règle et continue d'utiliser les vraies adresses de VNet-Hub.
      options:
        gw1az: { en: "NAT rules aren't supported on VpnGw1AZ; the minimum is VpnGw2AZ.", fr: "Les règles NAT ne sont pas prises en charge sur VpnGw1AZ ; le minimum est VpnGw2AZ." }
        ingress: { en: "With IngressSNAT only, Site-B servers would still have to reach Azure VMs at 10.10.x.x, a range they treat as their own local network.", fr: "Avec IngressSNAT seule, les serveurs de Site-B devraient toujours joindre les VM Azure en 10.10.x.x, une plage qu'ils considèrent comme leur propre réseau local." }
        reversed: { en: "IngressSNAT translates on-premises ranges and EgressSNAT translates the virtual network range, not the opposite.", fr: "IngressSNAT traduit les plages locales et EgressSNAT traduit la plage du réseau virtuel, pas l'inverse." }
        dynamic: { en: "Dynamic NAT is unidirectional: connections can only be started from the internal mapping side, which breaks the two-way requirement.", fr: "Le NAT dynamique est unidirectionnel : les connexions ne peuvent être ouvertes que depuis le côté du mappage interne, ce qui ne respecte pas l'exigence dans les deux sens." }
        aegress: { en: "Linking the EgressSNAT rule to the Site-A connection would make Site-A see VNet-Hub under the translated range, which changes its addresses.", fr: "Lier la règle EgressSNAT à la connexion de Site-A ferait voir VNet-Hub à Site-A sous la plage traduite, ce qui change ses adresses." }
    references:
      - title: About NAT (Network Address Translation) on VPN Gateway - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/nat-overview
      - title: Configure NAT on VPN Gateway - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/nat-howto
