chapter: 35-front-door
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-35-01
    objective: "3.3.1"
    difficulty: 1
    status: draft
    type: multi
    stem:
      en: |
        Litware plans to publish its applications through an Azure Front Door Standard profile.

        Which two capabilities does the Standard profile provide?

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware prévoit de publier ses applications au moyen d'un profil Azure Front Door Standard.

        Quelles sont les deux fonctionnalités fournies par le profil Standard ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Load balancing of UDP traffic for a multiplayer game", fr: "Équilibrage de charge du trafic UDP d'un jeu multijoueur" } }
        - { id: b, text: { en: "A custom apex domain such as litware.com", fr: "Un domaine apex personnalisé tel que litware.com" } }
        - { id: c, text: { en: "A Private Link connection to an origin without public access", fr: "Une connexion Private Link à une origine sans accès public" } }
        - { id: d, text: { en: "Client connections over IPv6 and HTTP/2", fr: "Des connexions clientes en IPv6 et en HTTP/2" } }
        - { id: e, text: { en: "A WAF policy with a Microsoft-managed rule set", fr: "Une stratégie WAF avec un ensemble de règles managé par Microsoft" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Both tiers support custom domains, including apex and wildcard domains, and Front Door natively supports end-to-end IPv6 connectivity and HTTP/2. Private Link origins and Microsoft-managed WAF rule sets need Premium, and Front Door only carries HTTP and HTTPS.
        fr: |
          Les deux niveaux prennent en charge les domaines personnalisés, y compris les domaines apex et génériques, et Front Door prend en charge en natif la connectivité IPv6 de bout en bout et HTTP/2. Les origines Private Link et les ensembles de règles WAF managés par Microsoft exigent Premium, et Front Door ne transporte que HTTP et HTTPS.
      options:
        a: { en: "Front Door is a layer 7 service for HTTP and HTTPS only; UDP needs Load Balancer or Traffic Manager.", fr: "Front Door est un service de couche 7 pour HTTP et HTTPS uniquement ; UDP exige Load Balancer ou Traffic Manager." }
        c: { en: "A Private Link connection to the origin is a Premium feature.", fr: "La connexion Private Link à l'origine est une fonctionnalité Premium." }
        e: { en: "Standard supports WAF custom rules only; Microsoft-managed rule sets need Premium.", fr: "Standard ne prend en charge que les règles WAF personnalisées ; les ensembles de règles managés par Microsoft exigent Premium." }
    references:
      - title: What is Azure Front Door?
        url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-overview
      - title: Domains in Azure Front Door
        url: https://learn.microsoft.com/en-us/azure/frontdoor/domain

  # ------------------------------------------------------------------ 2
  - id: az700-qz-35-02
    objective: "3.3.7"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam publishes a JSON API through an Azure Front Door Standard route. Every response is personalized, so the route must never cache content.

        You need to reduce the size of the JSON responses received by the clients. What should you do?
      fr: |
        Fabrikam publie une API JSON au moyen d'un itinéraire Azure Front Door Standard. Chaque réponse est personnalisée : l'itinéraire ne doit donc jamais mettre de contenu en cache.

        Vous devez réduire la taille des réponses JSON reçues par les clients. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable caching on the route, and then enable compression for application/json", fr: "Activer la mise en cache sur l'itinéraire, puis activer la compression pour application/json" } }
        - { id: b, text: { en: "Add a rule set action that sets the Content-Encoding response header to br", fr: "Ajouter une action d'ensemble de règles qui définit l'en-tête de réponse Content-Encoding sur br" } }
        - { id: c, text: { en: "Configure the origin application to compress its responses with gzip or Brotli", fr: "Configurer l'application d'origine pour qu'elle compresse ses réponses avec gzip ou Brotli" } }
        - { id: d, text: { en: "Enable compression on the route and leave caching disabled on the route", fr: "Activer la compression sur l'itinéraire et laisser la mise en cache désactivée sur l'itinéraire" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Front Door compression is part of the caching settings of a route: it is available only when caching is enabled. A route that must never cache can't use it, but Front Door passes along the responses that the origin has already compressed.
        fr: |
          La compression de Front Door fait partie des paramètres de mise en cache d'un itinéraire : elle n'est disponible que si la mise en cache est activée. Un itinéraire qui ne doit jamais mettre en cache ne peut pas l'utiliser, mais Front Door transmet les réponses que l'origine a déjà compressées.
      options:
        a: { en: "Enabling caching breaks the requirement that the route never caches content.", fr: "Activer la mise en cache enfreint l'exigence selon laquelle l'itinéraire ne met jamais de contenu en cache." }
        b: { en: "A header only labels the content: the body stays uncompressed, and browsers fail to decode it.", fr: "Un en-tête ne fait qu'étiqueter le contenu : le corps reste non compressé, et les navigateurs ne parviennent pas à le décoder." }
        d: { en: "The Enable compression option appears only after Enable caching is selected on the route.", fr: "L'option Activer la compression n'apparaît qu'après avoir coché Activer la mise en cache sur l'itinéraire." }
    references:
      - title: Improve performance by compressing files in Azure Front Door
        url: https://learn.microsoft.com/en-us/azure/frontdoor/standard-premium/how-to-compression

  # ------------------------------------------------------------------ 3
  - id: az700-qz-35-03
    objective: "3.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum uses an Azure Front Door Premium profile named **afd-adatum**. A review shows that afd-adatum only uses caching, managed certificates and WAF custom rules. The WAF policy has no managed rule set, and no origin uses Private Link.

        You need to reduce the cost of the solution while keeping all the current features. What should you do?
      fr: |
        Adatum utilise un profil Azure Front Door Premium nommé **afd-adatum**. Un audit montre qu'afd-adatum n'utilise que la mise en cache, des certificats managés et des règles WAF personnalisées. La stratégie WAF n'a aucun ensemble de règles managé, et aucune origine n'utilise Private Link.

        Vous devez réduire le coût de la solution tout en conservant toutes les fonctionnalités actuelles. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Change the tier of afd-adatum to Standard on the Configuration page of the profile.", fr: "Passer le niveau d'afd-adatum à Standard dans la page Configuration du profil." } }
        - { id: b, text: { en: "Create a Standard profile with the same configuration, and move the custom domains to it.", fr: "Créer un profil Standard avec la même configuration, puis y déplacer les domaines personnalisés." } }
        - { id: c, text: { en: "Create an Azure Front Door (classic) profile, and move the custom domains to it.", fr: "Créer un profil Azure Front Door (classique), puis y déplacer les domaines personnalisés." } }
        - { id: d, text: { en: "Disable the bot protection and the managed rules in the WAF policy of afd-adatum.", fr: "Désactiver la protection contre les bots et les règles managées dans la stratégie WAF d'afd-adatum." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Caching, managed certificates and WAF custom rules are all available in Standard, which costs less than Premium. A Premium profile can't be downgraded to Standard, so you must create a Standard profile and move the configuration and the domains to it.
        fr: |
          La mise en cache, les certificats managés et les règles WAF personnalisées sont tous disponibles en Standard, moins coûteux que Premium. Un profil Premium ne peut pas revenir à Standard : vous devez créer un profil Standard et y déplacer la configuration et les domaines.
      options:
        a: { en: "The Configuration page only upgrades Standard to Premium; a downgrade from Premium to Standard isn't supported.", fr: "La page Configuration ne fait que mettre à niveau Standard vers Premium ; le passage de Premium à Standard n'est pas pris en charge." }
        c: { en: "Front Door (classic) no longer accepts new profiles and retires on March 31, 2027.", fr: "Front Door (classique) n'accepte plus de nouveaux profils et sera mis hors service le 31 mars 2027." }
        d: { en: "The profile keeps its Premium base fee as long as it stays in the Premium tier, whatever its WAF settings.", fr: "Le profil conserve les frais de base Premium tant qu'il reste au niveau Premium, quels que soient ses paramètres WAF." }
    references:
      - title: Upgrade from Azure Front Door Standard to Premium
        url: https://learn.microsoft.com/en-us/azure/frontdoor/tier-upgrade

  # ------------------------------------------------------------------ 4
  - id: az700-qz-35-04
    objective: "3.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove adds the custom domain **www.woodgrove.com** to an Azure Front Door Standard profile and selects a Front Door-managed certificate. The `_dnsauth.www` TXT record is validated, and a CNAME record points www.woodgrove.com to the endpoint.

        Hours later, the certificate still isn't issued. The woodgrove.com DNS zone contains a CAA record with the value `0 issue letsencrypt.org`.

        You need Front Door to issue the managed certificate. What should you do?
      fr: |
        Woodgrove ajoute le domaine personnalisé **www.woodgrove.com** à un profil Azure Front Door Standard et sélectionne un certificat managé par Front Door. L'enregistrement TXT `_dnsauth.www` est validé, et un enregistrement CNAME dirige www.woodgrove.com vers le point de terminaison.

        Plusieurs heures plus tard, le certificat n'est toujours pas émis. La zone DNS woodgrove.com contient un enregistrement CAA avec la valeur `0 issue letsencrypt.org`.

        Vous devez faire en sorte que Front Door émette le certificat managé. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Replace the CNAME record with an A record that points to the endpoint IP address.", fr: "Remplacer l'enregistrement CNAME par un enregistrement A qui pointe vers l'adresse IP du point de terminaison." } }
        - { id: b, text: { en: "Add a CAA record with the value `0 issue microsoft.com` to the woodgrove.com zone.", fr: "Ajouter un enregistrement CAA avec la valeur `0 issue microsoft.com` à la zone woodgrove.com." } }
        - { id: c, text: { en: "Add a CAA record with the value `0 issue digicert.com` to the woodgrove.com zone.", fr: "Ajouter un enregistrement CAA avec la valeur `0 issue digicert.com` à la zone woodgrove.com." } }
        - { id: d, text: { en: "Enable the Redirect all traffic to use HTTPS option on the route of the domain.", fr: "Activer l'option Rediriger tout le trafic pour utiliser HTTPS sur l'itinéraire du domaine." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Front Door-managed certificates are issued by DigiCert. A CAA record that only allows another certificate authority blocks the issuance, so you must explicitly allow DigiCert with a CAA record whose value is `0 issue digicert.com`.
        fr: |
          Les certificats managés par Front Door sont émis par DigiCert. Un enregistrement CAA qui n'autorise qu'une autre autorité de certification bloque l'émission : vous devez autoriser explicitement DigiCert avec un enregistrement CAA dont la valeur est `0 issue digicert.com`.
      options:
        a: { en: "Front Door recommends a CNAME record; an A record doesn't remove the CAA restriction and prevents automatic rotation.", fr: "Front Door recommande un enregistrement CNAME ; un enregistrement A ne lève pas la restriction CAA et empêche la rotation automatique." }
        b: { en: "Front Door-managed certificates come from DigiCert; a record for another CA still doesn't allow DigiCert.", fr: "Les certificats managés par Front Door viennent de DigiCert ; un enregistrement pour une autre autorité n'autorise toujours pas DigiCert." }
        d: { en: "The HTTPS redirect answers HTTP requests with a redirect; it doesn't issue a certificate.", fr: "La redirection HTTPS répond aux requêtes HTTP par une redirection ; elle n'émet aucun certificat." }
    references:
      - title: Domains in Azure Front Door
        url: https://learn.microsoft.com/en-us/azure/frontdoor/domain

  # ------------------------------------------------------------------ 5
  - id: az700-qz-35-05
    objective: "3.3.8"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        An Azure Front Door Premium route for **www.contoso.com** sends its traffic to an origin group named **og-web**. The domain has a WAF policy with custom rules. A rule set associated with the route contains a rule named **rule-mobile**:

        | Match condition | Operator | Values |
        | --- | --- | --- |
        | Request path | Begins With | `api/` |
        | Request header `X-Client` | Equal | `mobile`, `tablet` |

        The action of rule-mobile is a route configuration override that sends the request to an origin group named **og-mobile**.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un itinéraire Azure Front Door Premium pour **www.contoso.com** envoie son trafic à un groupe d'origines nommé **og-web**. Le domaine a une stratégie WAF avec des règles personnalisées. Un ensemble de règles associé à l'itinéraire contient une règle nommée **rule-mobile** :

        | Condition de correspondance | Opérateur | Valeurs |
        | --- | --- | --- |
        | Chemin de la requête | Begins With | `api/` |
        | En-tête de requête `X-Client` | Equal | `mobile`, `tablet` |

        L'action de rule-mobile est un remplacement de la configuration de l'itinéraire qui envoie la requête à un groupe d'origines nommé **og-mobile**.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: "A request for /api/orders with the header `X-Client: tablet` is sent to og-mobile."
            fr: "Une requête pour /api/orders avec l'en-tête `X-Client: tablet` est envoyée à og-mobile."
        - id: s2
          text:
            en: "A request for /home with the header `X-Client: mobile` is sent to og-mobile."
            fr: "Une requête pour /home avec l'en-tête `X-Client: mobile` est envoyée à og-mobile."
        - id: s3
          text:
            en: The custom rules of the WAF policy are evaluated before rule-mobile.
            fr: Les règles personnalisées de la stratégie WAF sont évaluées avant rule-mobile.
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          The match conditions of a rule are combined with AND, and the values of one condition with OR: /api/orders with `X-Client: tablet` meets both conditions. /home doesn't begin with `api/`, so the request stays on og-web whatever its header. The WAF is processed first, then the route settings, including the rule sets of the route.
        fr: |
          Les conditions de correspondance d'une règle sont combinées par ET, et les valeurs d'une même condition par OU : /api/orders avec `X-Client: tablet` remplit les deux conditions. /home ne commence pas par `api/` : la requête reste donc sur og-web, quel que soit son en-tête. Le WAF est traité en premier, puis les paramètres de l'itinéraire, dont ses ensembles de règles.
    references:
      - title: Rules match conditions
        url: https://learn.microsoft.com/en-us/azure/frontdoor/rules-match-conditions
      - title: What is a rule set in Azure Front Door?
        url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-rules-engine

  # ------------------------------------------------------------------ 6
  - id: az700-qz-35-06
    objective: "3.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin runs two workloads in the East US and West Europe regions:

        | Workload | Protocol | Clients |
        | --- | --- | --- |
        | Booking API | HTTPS | Browsers and mobile apps worldwide |
        | Telemetry ingestion | UDP port 5000 | Flight devices worldwide |

        You need to meet the following requirements:

        - The clients of each workload are directed to the closest healthy region.
        - The TLS connections of the booking API are terminated close to the clients, and one web application firewall (WAF) policy inspects its requests.
        - The solution uses global services only, with no load balancer deployed in each region for this purpose.

        What should you use?
      fr: |
        Tailspin exécute deux charges de travail dans les régions East US et West Europe :

        | Charge de travail | Protocole | Clients |
        | --- | --- | --- |
        | API de réservation | HTTPS | Navigateurs et applications mobiles du monde entier |
        | Ingestion de télémétrie | UDP port 5000 | Équipements de vol du monde entier |

        Vous devez répondre aux exigences suivantes :

        - Les clients de chaque charge de travail sont dirigés vers la région saine la plus proche.
        - Les connexions TLS de l'API de réservation sont terminées près des clients, et une seule stratégie de pare-feu d'applications web (WAF) inspecte ses requêtes.
        - La solution n'utilise que des services mondiaux, sans équilibreur de charge déployé dans chaque région à cet effet.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "One Azure Front Door Premium profile with one route for each workload", fr: "Un profil Azure Front Door Premium avec un itinéraire pour chaque charge de travail" } }
        - { id: b, text: { en: "Azure Front Door for the booking API, and Azure Traffic Manager for the telemetry", fr: "Azure Front Door pour l'API de réservation, et Azure Traffic Manager pour la télémétrie" } }
        - { id: c, text: { en: "Azure Traffic Manager for both workloads, with a WAF policy on the profile", fr: "Azure Traffic Manager pour les deux charges de travail, avec une stratégie WAF sur le profil" } }
        - { id: d, text: { en: "Azure Front Door for the telemetry, and Azure Traffic Manager for the booking API", fr: "Azure Front Door pour la télémétrie, et Azure Traffic Manager pour l'API de réservation" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Front Door is a global layer 7 service for HTTP and HTTPS: it terminates TLS at the edge, applies one WAF policy and sends each request to the closest healthy origin, which fits the booking API. It can't carry UDP. Traffic Manager is a global DNS-based service for any protocol: it returns the endpoint of the closest healthy region, and the devices then connect to it directly.
        fr: |
          Front Door est un service mondial de couche 7 pour HTTP et HTTPS : il termine TLS en périphérie, applique une seule stratégie WAF et envoie chaque requête vers l'origine saine la plus proche, ce qui convient à l'API de réservation. Il ne peut pas transporter d'UDP. Traffic Manager est un service mondial fondé sur le DNS, pour tout protocole : il renvoie le point de terminaison de la région saine la plus proche, et les équipements s'y connectent ensuite directement.
      options:
        a: { en: "Front Door accepts only HTTP and HTTPS, so no route can carry the UDP telemetry.", fr: "Front Door n'accepte que HTTP et HTTPS : aucun itinéraire ne peut transporter la télémétrie UDP." }
        c: { en: "Traffic Manager only answers DNS queries: it neither terminates TLS nor applies a WAF policy.", fr: "Traffic Manager ne fait que répondre aux requêtes DNS : il ne termine pas TLS et n'applique pas de stratégie WAF." }
        d: { en: "The services are swapped: Front Door can't carry UDP, and Traffic Manager has no TLS termination or WAF.", fr: "Les services sont inversés : Front Door ne peut pas transporter d'UDP, et Traffic Manager n'a ni terminaison TLS ni WAF." }
    references:
      - title: Load balancing options
        url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/load-balancing-overview

  # ------------------------------------------------------------------ 7
  - id: az700-qz-35-07
    objective: "3.3.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso publishes **www.contoso.com** through an Azure Front Door Standard profile. The route of the domain sends the traffic to an origin group named **og-web** with the forwarding protocol **HTTPS only**. og-web contains two origins:

        | Origin | Origin host name | Origin host header | Certificate subject name validation |
        | --- | --- | --- | --- |
        | app-we | contoso-we.azurewebsites.net | www.contoso.com | Enabled |
        | app-ne | contoso-ne.azurewebsites.net | www.contoso.com | Enabled |

        Both origins are App Service apps with no custom domain. Users who browse to https://www.contoso.com receive an App Service error page saying that the site can't be found.

        You need users to reach the apps. You must not change the configuration of the apps, and the traffic between Front Door and the apps must stay encrypted. What should you do?
      fr: |
        Contoso publie **www.contoso.com** au moyen d'un profil Azure Front Door Standard. L'itinéraire du domaine envoie le trafic à un groupe d'origines nommé **og-web** avec le protocole de transfert **HTTPS only**. og-web contient deux origines :

        | Origine | Nom d'hôte de l'origine | En-tête de l'hôte d'origine | Validation du nom du sujet du certificat |
        | --- | --- | --- | --- |
        | app-we | contoso-we.azurewebsites.net | www.contoso.com | Activée |
        | app-ne | contoso-ne.azurewebsites.net | www.contoso.com | Activée |

        Les deux origines sont des applications App Service sans domaine personnalisé. Les utilisateurs qui accèdent à https://www.contoso.com reçoivent une page d'erreur App Service indiquant que le site est introuvable.

        Vous devez permettre aux utilisateurs d'atteindre les applications. Vous ne devez pas modifier la configuration des applications, et le trafic entre Front Door et les applications doit rester chiffré. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Disable certificate subject name validation on app-we and app-ne.", fr: "Désactiver la validation du nom du sujet du certificat sur app-we et app-ne." } }
        - { id: b, text: { en: "Set the forwarding protocol of the route to Match incoming request.", fr: "Définir le protocole de transfert de l'itinéraire sur Match incoming request." } }
        - { id: c, text: { en: "Set the origin host header of app-we and app-ne to contoso.com.", fr: "Définir l'en-tête de l'hôte d'origine d'app-we et d'app-ne sur contoso.com." } }
        - { id: d, text: { en: "Set the origin host header of each origin to its origin host name.", fr: "Définir l'en-tête de l'hôte d'origine de chaque origine sur son nom d'hôte d'origine." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The origin host header is the Host value that Front Door sends to the origin. App Service only answers on the host names it knows, and www.contoso.com isn't configured on the apps, so they return a site-not-found error. Setting each origin host header to its azurewebsites.net host name fixes this without touching the apps, and HTTPS only keeps the traffic encrypted.
        fr: |
          L'en-tête de l'hôte d'origine est la valeur Host que Front Door envoie à l'origine. App Service ne répond que sur les noms d'hôte qu'il connaît, et www.contoso.com n'est pas configuré sur les applications : elles renvoient donc une erreur de site introuvable. Définir l'en-tête de l'hôte de chaque origine sur son nom d'hôte azurewebsites.net corrige le problème sans toucher aux applications, et HTTPS only garde le trafic chiffré.
      options:
        a: { en: "The error comes from the Host header, not from the TLS check; Microsoft also advises keeping the validation enabled.", fr: "L'erreur vient de l'en-tête Host, pas du contrôle TLS ; Microsoft recommande en outre de garder la validation activée." }
        b: { en: "The protocol doesn't change the Host header, and HTTP clients would then reach the apps unencrypted.", fr: "Le protocole ne change pas l'en-tête Host, et les clients HTTP atteindraient alors les applications sans chiffrement." }
        c: { en: "contoso.com isn't configured on the apps either, so App Service still can't find the site.", fr: "contoso.com n'est pas non plus configuré sur les applications : App Service ne trouve toujours pas le site." }
    references:
      - title: How to configure an origin for Azure Front Door
        url: https://learn.microsoft.com/en-us/azure/frontdoor/how-to-configure-origin
      - title: Origins and origin groups in Azure Front Door
        url: https://learn.microsoft.com/en-us/azure/frontdoor/origin

  # ------------------------------------------------------------------ 8
  - id: az700-qz-35-08
    objective: "3.3.8"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam is retiring the host name **old.fabrikam.com**, which is a custom domain of an Azure Front Door Standard profile, in favor of **www.fabrikam.com**. You add a rule to the rule set of the route of old.fabrikam.com, with the match condition **Host name Equal old.fabrikam.com** and a **URL redirect** action.

        The redirect must meet the following requirements:

        - Search engines replace the old URLs with the new ones in their index.
        - Clients always reach the new site over HTTPS.
        - A request for `http://old.fabrikam.com/docs/setup?lang=fr` is sent to `https://www.fabrikam.com/docs/setup?lang=fr`, and the same mapping applies to every path and query string.

        How should you configure the URL redirect action? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam abandonne le nom d'hôte **old.fabrikam.com**, un domaine personnalisé d'un profil Azure Front Door Standard, au profit de **www.fabrikam.com**. Vous ajoutez une règle à l'ensemble de règles de l'itinéraire d'old.fabrikam.com, avec la condition de correspondance **Host name Equal old.fabrikam.com** et une action **URL redirect**.

        La redirection doit répondre aux exigences suivantes :

        - Les moteurs de recherche remplacent les anciennes URL par les nouvelles dans leur index.
        - Les clients atteignent toujours le nouveau site en HTTPS.
        - Une requête pour `http://old.fabrikam.com/docs/setup?lang=fr` est envoyée vers `https://www.fabrikam.com/docs/setup?lang=fr`, et la même correspondance s'applique à tous les chemins et à toutes les chaînes de requête.

        Comment devez-vous configurer l'action URL redirect ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Redirect type: [[type]]

          Redirect protocol: [[protocol]]

          Destination host: [[host]]

          Destination path: [[path]]
        fr: |
          Type de redirection : [[type]]

          Protocole de redirection : [[protocol]]

          Hôte de destination : [[host]]

          Chemin de destination : [[path]]
      slots:
        - id: type
          options:
            - { id: found, text: "Found (302)" }
            - { id: moved, text: "Moved (301)" }
            - { id: temporary, text: "Temporary redirect (307)" }
        - id: protocol
          options:
            - { id: match, text: Match request }
            - { id: https, text: HTTPS }
            - { id: http, text: HTTP }
        - id: host
          options:
            - { id: empty, text: { en: "(leave empty)", fr: "(laisser vide)" } }
            - { id: old, text: old.fabrikam.com }
            - { id: www, text: www.fabrikam.com }
        - id: path
          options:
            - { id: root, text: "`/`" }
            - { id: empty, text: { en: "(leave empty)", fr: "(laisser vide)" } }
            - { id: wildcard, text: "`/*`" }
    answer:
      values: { type: moved, protocol: https, host: www, path: empty }
    explanation:
      correct:
        en: |
          A 301 tells clients and search engines that the resource has a new permanent URI; 302 and 307 are temporary. The HTTPS protocol sends every client to HTTPS, even when the request arrived over HTTP. The destination host replaces old.fabrikam.com, while an empty destination path and an empty query string keep the incoming values, so `/docs/setup?lang=fr` is preserved.
        fr: |
          Un 301 indique aux clients et aux moteurs de recherche que la ressource a un nouvel URI permanent ; 302 et 307 sont temporaires. Le protocole HTTPS envoie tous les clients vers HTTPS, même quand la requête est arrivée en HTTP. L'hôte de destination remplace old.fabrikam.com, tandis qu'un chemin de destination vide et une chaîne de requête vide conservent les valeurs entrantes : `/docs/setup?lang=fr` est donc préservé.
      options:
        found: { en: "302 is a temporary redirect: clients keep using the old URL.", fr: "302 est une redirection temporaire : les clients continuent d'utiliser l'ancienne URL." }
        match: { en: "Match request keeps HTTP for a request that arrived over HTTP.", fr: "Match request conserve HTTP pour une requête arrivée en HTTP." }
        root: { en: "A path value replaces the incoming path: every request would land on the home page.", fr: "Une valeur de chemin remplace le chemin entrant : toutes les requêtes arriveraient sur la page d'accueil." }
    references:
      - title: URL redirect
        url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-url-redirect

  # ------------------------------------------------------------------ 9
  - id: az700-qz-35-09
    objective: "3.3.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        An Azure Front Door Standard route named **route-assets** matches `/assets/*`. Caching is enabled on the route with the query string caching behavior **Use Query String**. No rule set is associated with the route.

        The origin returns the following headers:

        | Request | Caching headers in the origin response |
        | --- | --- |
        | `GET /assets/app.css` | `Cache-Control: public, max-age=86400, s-maxage=600` |
        | `GET /assets/list?b=2&a=1` | `Cache-Control: public, max-age=3600` |
        | `GET /assets/logo.png` | None |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un itinéraire Azure Front Door Standard nommé **route-assets** correspond à `/assets/*`. La mise en cache est activée sur l'itinéraire avec le comportement de mise en cache des chaînes de requête **Use Query String**. Aucun ensemble de règles n'est associé à l'itinéraire.

        L'origine renvoie les en-têtes suivants :

        | Requête | En-têtes de mise en cache de la réponse de l'origine |
        | --- | --- |
        | `GET /assets/app.css` | `Cache-Control: public, max-age=86400, s-maxage=600` |
        | `GET /assets/list?b=2&a=1` | `Cache-Control: public, max-age=3600` |
        | `GET /assets/logo.png` | Aucun |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: A point of presence serves /assets/app.css from its cache for up to 24 hours before it requests the file from the origin again.
            fr: Un point de présence sert /assets/app.css depuis son cache pendant 24 heures au plus avant de redemander le fichier à l'origine.
        - id: s2
          text:
            en: While the response for /assets/list?b=2&a=1 is cached, a request for /assets/list?a=1&b=2 is served from that cached copy.
            fr: Tant que la réponse pour /assets/list?b=2&a=1 est en cache, une requête pour /assets/list?a=1&b=2 est servie depuis cette copie en cache.
        - id: s3
          text:
            en: Front Door caches /assets/logo.png for a duration between one and three days.
            fr: Front Door met /assets/logo.png en cache pour une durée comprise entre un et trois jours.
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Front Door uses the first caching header present in this order: `s-maxage`, `max-age`, then `Expires`. app.css is therefore cached for 600 seconds, not 24 hours. With Use Query String, each unique URL is cached, but the order of the parameters doesn't matter. Without any caching header, Front Door picks a random duration between one and three days.
        fr: |
          Front Door utilise le premier en-tête de mise en cache présent dans cet ordre : `s-maxage`, `max-age`, puis `Expires`. app.css est donc mis en cache pendant 600 secondes, pas 24 heures. Avec Use Query String, chaque URL unique est mise en cache, mais l'ordre des paramètres n'a pas d'importance. Sans aucun en-tête de mise en cache, Front Door choisit une durée aléatoire comprise entre un et trois jours.
    references:
      - title: Caching with Azure Front Door
        url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-caching

  # ------------------------------------------------------------------ 10
  - id: az700-qz-35-10
    objective: "3.3.9"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove has an Azure Front Door Premium profile named **afd-wg**. The route of api.woodgrove.com uses an origin group named **og-api** whose latency sensitivity is 1,000 milliseconds. og-api contains one origin that points to an App Service app named **app-api** in East US, with Private Link enabled in the **East US** Private Link region. Public network access is disabled on app-api.

        Traffic is expected to reach 15,000 requests per second. During a load test, Front Door starts returning `429 Too Many Requests` at about 7,200 requests per second, while app-api stays below 40 percent CPU.

        You need afd-wg to handle the expected load. app-api must stay reachable only through Private Link. What should you do?
      fr: |
        Woodgrove dispose d'un profil Azure Front Door Premium nommé **afd-wg**. L'itinéraire d'api.woodgrove.com utilise un groupe d'origines nommé **og-api** dont la sensibilité de latence est de 1 000 millisecondes. og-api contient une origine qui pointe vers une application App Service nommée **app-api** dans East US, avec Private Link activé dans la région Private Link **East US**. L'accès réseau public est désactivé sur app-api.

        Le trafic attendu atteint 15 000 requêtes par seconde. Pendant un test de charge, Front Door commence à renvoyer `429 Too Many Requests` vers 7 200 requêtes par seconde, alors qu'app-api reste sous 40 % de processeur.

        Vous devez faire en sorte qu'afd-wg absorbe la charge attendue. app-api doit rester joignable uniquement par Private Link. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add two origins for app-api to og-api with Private Link in East US, then approve their connections.", fr: "Ajouter à og-api deux origines pour app-api avec Private Link dans East US, puis approuver leurs connexions." } }
        - { id: b, text: { en: "Scale out the App Service plan of app-api, and set the weight of the origin to 1,000.", fr: "Faire un scale-out du plan App Service d'app-api, et définir le poids de l'origine sur 1 000." } }
        - { id: c, text: { en: "Add two origins for app-api to og-api with Private Link in two other regions, then approve their connections.", fr: "Ajouter à og-api deux origines pour app-api avec Private Link dans deux autres régions, puis approuver leurs connexions." } }
        - { id: d, text: { en: "Add an origin for the public endpoint of app-api to og-api, restricted to the AzureFrontDoor.Backend tag.", fr: "Ajouter à og-api une origine pour le point de terminaison public d'app-api, limitée à la balise AzureFrontDoor.Backend." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Each Front Door regional cluster accepts up to 7,200 requests per second per profile for Private Link, and the excess is rate limited with HTTP 429. Origins that use different Private Link regions spread the traffic across several regional clusters; each new region creates a private endpoint whose connection must be approved. Three regions give enough capacity for 15,000 requests per second, and the latency sensitivity lets all three origins receive traffic.
        fr: |
          Chaque cluster régional Front Door accepte jusqu'à 7 200 requêtes par seconde par profil pour Private Link, et l'excédent est limité avec une erreur HTTP 429. Des origines qui utilisent des régions Private Link différentes répartissent le trafic sur plusieurs clusters régionaux ; chaque nouvelle région crée un point de terminaison privé dont la connexion doit être approuvée. Trois régions donnent une capacité suffisante pour 15 000 requêtes par seconde, et la sensibilité de latence permet aux trois origines de recevoir du trafic.
      options:
        a: { en: "Origins with the same resource, subresource and region share one private endpoint and the same regional cluster limit.", fr: "Des origines avec la même ressource, la même sous-ressource et la même région partagent un seul point de terminaison privé et la même limite de cluster régional." }
        b: { en: "app-api isn't the bottleneck: the limit applies to the Front Door regional cluster, whatever the weight.", fr: "app-api n'est pas le goulot d'étranglement : la limite s'applique au cluster régional Front Door, quel que soit le poids." }
        d: { en: "Public access must stay disabled, and an origin group can't mix public and private origins.", fr: "L'accès public doit rester désactivé, et un groupe d'origines ne peut pas mélanger origines publiques et privées." }
    references:
      - title: Secure your origin with Private Link in Azure Front Door Premium
        url: https://learn.microsoft.com/en-us/azure/frontdoor/private-link
