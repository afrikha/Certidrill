chapter: 24-expressroute-implementation
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-24-01
    objective: "2.3.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware is configuring Azure private peering on an ExpressRoute circuit bought from a Layer 2 connectivity provider. The network team proposes several AS numbers for the on-premises edge routers.

        Which peer ASN will Azure reject for the private peering?
      fr: |
        Litware configure le peering privé Azure sur un circuit ExpressRoute acheté à un fournisseur de connectivité de couche 2. L'équipe réseau propose plusieurs numéros d'AS pour les routeurs de périphérie locaux.

        Quel ASN homologue Azure refusera-t-il pour le peering privé ?
    shuffle: false
    body:
      options:
        - { id: a, text: "64512" }
        - { id: b, text: "65010" }
        - { id: c, text: "65515" }
        - { id: d, text: "4200000010" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Microsoft reserves the AS numbers 65515 to 65520 for internal use, and the private peering configuration explicitly forbids 65515. Private AS numbers are otherwise allowed on private peering, in 2-byte or 4-byte form, while Microsoft uses AS 12076 on its side.
        fr: |
          Microsoft réserve les numéros d'AS 65515 à 65520 à un usage interne, et la configuration du peering privé interdit explicitement 65515. Les numéros d'AS privés sont par ailleurs autorisés sur le peering privé, sur 2 ou 4 octets, tandis que Microsoft utilise l'AS 12076 de son côté.
      options:
        a: { en: "64512 is a valid 2-byte private ASN outside the range that Microsoft reserves.", fr: "64512 est un ASN privé valide sur 2 octets, hors de la plage réservée par Microsoft." }
        b: { en: "65010 is a valid 2-byte private ASN; the reserved range starts at 65515.", fr: "65010 est un ASN privé valide sur 2 octets ; la plage réservée commence à 65515." }
        d: { en: "4-byte AS numbers are supported, and 4200000010 is a private 4-byte ASN outside the reserved range.", fr: "Les numéros d'AS sur 4 octets sont pris en charge, et 4200000010 est un ASN privé sur 4 octets hors de la plage réservée." }
    references:
      - title: "Azure ExpressRoute: Routing requirements"
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-routing
      - title: Configure peering for ExpressRoute circuit - Azure PowerShell
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-routing-arm

  # ------------------------------------------------------------------ 2
  - id: az700-qz-24-02
    objective: "2.3.13"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Three days ago, Adatum created an ExpressRoute circuit named **ER-Adatum** and sent its service key to the connectivity provider. `Get-AzExpressRouteCircuit` returns the following values:

        | Property | Value |
        | --- | --- |
        | CircuitProvisioningState | Enabled |
        | ServiceProviderProvisioningState | NotProvisioned |

        You need to configure Azure private peering on ER-Adatum as soon as possible. What should you do first?
      fr: |
        Il y a trois jours, Adatum a créé un circuit ExpressRoute nommé **ER-Adatum** et a transmis sa clé de service au fournisseur de connectivité. `Get-AzExpressRouteCircuit` renvoie les valeurs suivantes :

        | Propriété | Valeur |
        | --- | --- |
        | CircuitProvisioningState | Enabled |
        | ServiceProviderProvisioningState | NotProvisioned |

        Vous devez configurer le peering privé Azure sur ER-Adatum au plus vite. Que devez-vous faire en premier ?
    body:
      options:
        - { id: a, text: { en: "Open a support request with Microsoft to enable the circuit.", fr: "Ouvrir une demande de support auprès de Microsoft pour activer le circuit." } }
        - { id: b, text: { en: "Contact the connectivity provider to complete the provisioning.", fr: "Contacter le fournisseur de connectivité pour terminer l'approvisionnement." } }
        - { id: c, text: { en: "Delete the circuit and create a new one with a new service key.", fr: "Supprimer le circuit et en créer un nouveau avec une nouvelle clé de service." } }
        - { id: d, text: { en: "Configure the private peering so that provisioning can complete.", fr: "Configurer le peering privé pour que l'approvisionnement puisse se terminer." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The circuit status describes the Microsoft side and is already Enabled. The provider status shows whether the connectivity provider has provisioned its side; while it stays NotProvisioned, you contact the provider. Peerings can be configured only once the provider status is Provisioned.
        fr: |
          L'état du circuit décrit le côté Microsoft et est déjà Enabled. L'état du fournisseur indique si le fournisseur de connectivité a approvisionné son côté ; tant qu'il reste NotProvisioned, vous contactez le fournisseur. Les peerings ne peuvent être configurés qu'une fois l'état du fournisseur à Provisioned.
      options:
        a: { en: "Microsoft support is the contact when the circuit status is stuck in Not enabled; here the Microsoft side is already Enabled.", fr: "Le support Microsoft est l'interlocuteur quand l'état du circuit reste bloqué sur Not enabled ; ici, le côté Microsoft est déjà Enabled." }
        c: { en: "A new circuit would need the same provider work, and billing has already started on this one when its service key was issued.", fr: "Un nouveau circuit demanderait le même travail au fournisseur, et la facturation de celui-ci a déjà commencé à l'émission de sa clé de service." }
        d: { en: "Peerings can be configured only on a circuit whose provider status is Provisioned; they don't drive the provider's provisioning.", fr: "Les peerings ne se configurent que sur un circuit dont l'état du fournisseur est Provisioned ; ils ne déclenchent pas l'approvisionnement du fournisseur." }
    references:
      - title: Verify Azure ExpressRoute connectivity
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-troubleshooting-expressroute-overview

  # ------------------------------------------------------------------ 3
  - id: az700-qz-24-03
    objective: "2.3.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has a hub virtual network named **VNet-Hub** with a /27 GatewaySubnet. Fabrikam must connect VNet-Hub to six ExpressRoute circuits, each at a different peering location. FastPath isn't required.

        You need to deploy an ExpressRoute gateway in VNet-Hub. The solution must minimize cost.

        Which gateway SKU should you use?
      fr: |
        Fabrikam dispose d'un réseau virtuel hub nommé **VNet-Hub** avec un GatewaySubnet en /27. Fabrikam doit connecter VNet-Hub à six circuits ExpressRoute, chacun dans un emplacement de peering différent. FastPath n'est pas nécessaire.

        Vous devez déployer une passerelle ExpressRoute dans VNet-Hub. La solution doit réduire les coûts au minimum.

        Quelle référence SKU de passerelle devez-vous utiliser ?
    shuffle: false
    body:
      options:
        - { id: a, text: "ErGw1AZ" }
        - { id: b, text: "ErGw2AZ" }
        - { id: c, text: "ErGw3AZ" }
        - { id: d, text: { en: "ErGwScale with 1 scale unit", fr: "ErGwScale avec 1 unité d'échelle" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The number of circuit connections depends on the gateway SKU: 4 for ErGw1AZ, 8 for ErGw2AZ and 16 for ErGw3AZ. Six circuits exceed the ErGw1AZ limit, so ErGw2AZ is the smallest fixed SKU that fits, and a /27 GatewaySubnet is enough below 16 circuits.
        fr: |
          Le nombre de connexions de circuit dépend de la référence SKU de la passerelle : 4 pour ErGw1AZ, 8 pour ErGw2AZ et 16 pour ErGw3AZ. Six circuits dépassent la limite d'ErGw1AZ : ErGw2AZ est donc la plus petite référence SKU fixe qui convient, et un GatewaySubnet en /27 suffit en dessous de 16 circuits.
      options:
        a: { en: "ErGw1AZ accepts 4 circuit connections, fewer than the six circuits required.", fr: "ErGw1AZ accepte 4 connexions de circuit, moins que les six circuits nécessaires." }
        c: { en: "ErGw3AZ accepts 16 circuits and supports FastPath, but it costs more than ErGw2AZ, which already accepts 8.", fr: "ErGw3AZ accepte 16 circuits et prend en charge FastPath, mais coûte plus cher qu'ErGw2AZ, qui en accepte déjà 8." }
        d: { en: "With 1 scale unit, ErGwScale accepts 4 circuit connections; 8 require at least 2 scale units.", fr: "Avec 1 unité d'échelle, ErGwScale accepte 4 connexions de circuit ; 8 exigent au moins 2 unités d'échelle." }
    references:
      - title: About ExpressRoute virtual network gateways
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-virtual-network-gateways

  # ------------------------------------------------------------------ 4
  - id: az700-qz-24-04
    objective: "2.3.9"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        The network team of Contoso owns an ExpressRoute circuit named **ER-Core** in a subscription named **Sub-Net**. Virtual networks of Sub-Net are linked to ER-Core.

        The application team owns a subscription named **Sub-App** that contains two virtual networks, **VNet-A** and **VNet-B**, each with its own ExpressRoute gateway. The network team created one authorization named **Auth1** on ER-Core and sent its key and the resource ID of ER-Core to the application team, which used them to connect VNet-A to ER-Core.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'équipe réseau de Contoso possède un circuit ExpressRoute nommé **ER-Core** dans un abonnement nommé **Sub-Net**. Des réseaux virtuels de Sub-Net sont liés à ER-Core.

        L'équipe applicative possède un abonnement nommé **Sub-App** qui contient deux réseaux virtuels, **VNet-A** et **VNet-B**, chacun avec sa propre passerelle ExpressRoute. L'équipe réseau a créé une autorisation nommée **Auth1** sur ER-Core et a transmis sa clé et l'ID de ressource d'ER-Core à l'équipe applicative, qui les a utilisés pour connecter VNet-A à ER-Core.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The application team can use the key of Auth1 again to connect VNet-B to ER-Core.", fr: "L'équipe applicative peut réutiliser la clé d'Auth1 pour connecter VNet-B à ER-Core." } }
        - { id: s2, text: { en: "If the network team deletes Auth1, the connection between VNet-A and ER-Core is deleted.", fr: "Si l'équipe réseau supprime Auth1, la connexion entre VNet-A et ER-Core est supprimée." } }
        - { id: s3, text: { en: "Traffic of VNet-A shares the bandwidth of ER-Core with the virtual networks of Sub-Net.", fr: "Le trafic de VNet-A partage la bande passante d'ER-Core avec les réseaux virtuels de Sub-Net." } }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          An authorization is valid for one connection only, so VNet-B needs a second authorization from the circuit owner. The circuit owner can revoke an authorization at any time, and revoking it deletes the connections that used it. All the virtual networks linked to a circuit share its bandwidth, and the circuit owner's subscription pays for the circuit.
        fr: |
          Une autorisation n'est valable que pour une seule connexion : VNet-B a donc besoin d'une seconde autorisation du propriétaire du circuit. Le propriétaire du circuit peut révoquer une autorisation à tout moment, et la révocation supprime les connexions qui l'utilisaient. Tous les réseaux virtuels liés à un circuit partagent sa bande passante, et l'abonnement du propriétaire du circuit paie le circuit.
    references:
      - title: Connect a virtual network to an ExpressRoute circuit using Azure PowerShell
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-linkvnet-arm

  # ------------------------------------------------------------------ 5
  - id: az700-qz-24-05
    objective: "2.3.12"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin configured Azure private peering on an ExpressRoute circuit in 2023. To detect link failures faster, the network engineers added the following line to the interface that faces the MSEE on both on-premises edge routers, and changed nothing else:

        `bfd interval 300 min_rx 300 multiplier 3`

        During a failover test, traffic still takes about three minutes to move from the primary link to the secondary link.

        What should you do?
      fr: |
        Tailspin a configuré le peering privé Azure sur un circuit ExpressRoute en 2023. Pour détecter plus vite les pannes de liaison, les ingénieurs réseau ont ajouté la ligne suivante sur l'interface tournée vers le MSEE des deux routeurs de périphérie locaux, sans rien modifier d'autre :

        `bfd interval 300 min_rx 300 multiplier 3`

        Lors d'un test de basculement, le trafic met toujours environ trois minutes à passer de la liaison principale à la liaison secondaire.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Reset the Azure private peering so that the MSEEs start BFD.", fr: "Réinitialiser le peering privé Azure pour que les MSEE démarrent BFD." } }
        - { id: b, text: { en: "Lower the BFD interval to 100 ms on both edge routers.", fr: "Réduire l'intervalle BFD à 100 ms sur les deux routeurs de périphérie." } }
        - { id: c, text: { en: "Link BFD to the BGP neighbor of the MSEE on both edge routers.", fr: "Lier BFD au voisin BGP du MSEE sur les deux routeurs de périphérie." } }
        - { id: d, text: { en: "Enable FastPath on the connection between the gateway and the circuit.", fr: "Activer FastPath sur la connexion entre la passerelle et le circuit." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          BFD on the customer side takes two steps on each edge router: enable it on the interface, then link it to the BGP session of the neighbor (for example `fall-over bfd`). The engineers did only the first step, so BGP still relies on its 180-second hold time. A private peering created in 2023 already has BFD enabled on the MSEEs.
        fr: |
          BFD côté client demande deux étapes sur chaque routeur de périphérie : l'activer sur l'interface, puis le lier à la session BGP du voisin (par exemple `fall-over bfd`). Les ingénieurs n'ont fait que la première étape : BGP repose donc toujours sur son temps de maintien de 180 secondes. Un peering privé créé en 2023 a déjà BFD activé sur les MSEE.
      options:
        a: { en: "A reset is needed only for IPv4 private peerings created before August 2018; this peering already has BFD on the MSEEs.", fr: "Une réinitialisation n'est nécessaire que pour les peerings privés IPv4 créés avant août 2018 ; ce peering a déjà BFD sur les MSEE." }
        b: { en: "The slower peer sets the rate and the MSEEs use 300 ms, so a shorter interval can't be negotiated; BFD still wouldn't be tied to BGP.", fr: "L'homologue le plus lent fixe la cadence et les MSEE utilisent 300 ms : un intervalle plus court ne peut pas être négocié ; BFD ne serait toujours pas lié à BGP." }
        d: { en: "FastPath makes the data path bypass the gateway inside Azure; it doesn't change how fast a link failure is detected.", fr: "FastPath fait contourner la passerelle par le chemin des données dans Azure ; il ne change pas la vitesse de détection d'une panne de liaison." }
    references:
      - title: "Azure ExpressRoute: Configure BFD"
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-bfd

  # ------------------------------------------------------------------ 6
  - id: az700-qz-24-06
    objective: "2.3.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove has an ExpressRoute circuit named **CKT1** created in 2026. You configured Microsoft peering on CKT1 with the following settings:

        | Setting | Value |
        | --- | --- |
        | Primary and secondary subnets | 198.51.100.0/30 and 198.51.100.4/30 |
        | Advertised public prefixes | 198.51.100.32/27 (NAT pool of the on-premises hosts) |
        | Routing registry name | RIPENCC |
        | Route filter | Attached, one Allow rule with the BGP community of West Europe |

        The prefix 198.51.100.0/24 was transferred to Woodgrove by its former parent company, Contoso, under a written agreement, but the RIPE NCC database still lists Contoso as the holder. `Get-AzExpressRouteCircuitPeeringConfig` shows `AdvertisedPublicPrefixesState` as `Validation needed`.

        On-premises hosts must reach Azure services in West Europe over the Microsoft peering of CKT1. What should you do?
      fr: |
        Woodgrove dispose d'un circuit ExpressRoute nommé **CKT1** créé en 2026. Vous avez configuré le peering Microsoft sur CKT1 avec les paramètres suivants :

        | Paramètre | Valeur |
        | --- | --- |
        | Sous-réseaux principal et secondaire | 198.51.100.0/30 et 198.51.100.4/30 |
        | Préfixes publics publiés | 198.51.100.32/27 (pool NAT des hôtes locaux) |
        | Nom du registre de routage | RIPENCC |
        | Filtre de routage | Attaché, une règle Allow avec la communauté BGP de West Europe |

        Le préfixe 198.51.100.0/24 a été cédé à Woodgrove par son ancienne société mère, Contoso, en vertu d'un accord écrit, mais la base de données du RIPE NCC indique toujours Contoso comme titulaire. `Get-AzExpressRouteCircuitPeeringConfig` affiche `Validation needed` pour `AdvertisedPublicPrefixesState`.

        Les hôtes locaux doivent atteindre les services Azure de West Europe par le peering Microsoft de CKT1. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Change the routing registry name of the peering to RADB, and then save the peering again.", fr: "Remplacer le nom du registre de routage du peering par RADB, puis enregistrer de nouveau le peering." } }
        - { id: b, text: { en: "Open a support request and provide the agreement that assigns the prefix to Woodgrove.", fr: "Ouvrir une demande de support et fournir l'accord qui attribue le préfixe à Woodgrove." } }
        - { id: c, text: { en: "Advertise the on-premises range 10.20.0.0/16 instead of the NAT pool, and then save the peering again.", fr: "Publier la plage locale 10.20.0.0/16 à la place du pool NAT, puis enregistrer de nouveau le peering." } }
        - { id: d, text: { en: "Upgrade CKT1 to the Premium tier, and then add the West Europe community to a second route filter.", fr: "Passer CKT1 au niveau Premium, puis ajouter la communauté de West Europe à un second filtre de routage." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Microsoft checks in the routing registry that the advertised prefixes and the ASN belong to the peer. When the automatic check fails, the state shows Validation needed and you open a support ticket with documents proving that the registered holder assigned the prefixes to you. The route filter is already correct, so manual validation is the only missing step.
        fr: |
          Microsoft vérifie dans le registre de routage que les préfixes publiés et l'ASN appartiennent à l'homologue. Quand la vérification automatique échoue, l'état indique Validation needed et vous ouvrez un ticket de support avec des documents prouvant que le titulaire inscrit vous a attribué les préfixes. Le filtre de routage est déjà correct : la validation manuelle est la seule étape manquante.
      options:
        a: { en: "The registry name must point to the registry where the prefix is recorded, RIPE NCC here; changing it doesn't prove that Woodgrove owns the prefix.", fr: "Le nom du registre doit désigner le registre où le préfixe est enregistré, ici le RIPE NCC ; le changer ne prouve pas que Woodgrove détient le préfixe." }
        c: { en: "Microsoft peering doesn't accept private (RFC 1918) prefixes; on-premises hosts must use public NAT addresses.", fr: "Le peering Microsoft n'accepte pas de préfixes privés (RFC 1918) ; les hôtes locaux doivent utiliser des adresses NAT publiques." }
        d: { en: "Premium isn't needed for Azure services in the circuit's geopolitical area, and the existing filter already allows West Europe; the prefix is still unvalidated.", fr: "Premium n'est pas nécessaire pour les services Azure de la zone géopolitique du circuit, et le filtre existant autorise déjà West Europe ; le préfixe reste non validé." }
    references:
      - title: Configure peering for ExpressRoute circuit - Azure PowerShell
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-routing-arm
      - title: "Azure ExpressRoute: Routing requirements"
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-routing

  # ------------------------------------------------------------------ 7
  - id: az700-qz-24-07
    objective: "2.3.8"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware has a virtual network named **VNet-Hub** that contains an ExpressRoute gateway named **ERGW1** with the ErGw1AZ SKU. ERGW1 has the following connections:

        | Connection | Circuit | Peering location |
        | --- | --- | --- |
        | Conn1 | CKT-AMS1 | Amsterdam |
        | Conn2 | CKT-AMS2 | Amsterdam |
        | Conn3 | CKT-LON | London |
        | Conn4 | CKT-PAR | Paris |

        Another virtual network, **VNet-B**, has its own ExpressRoute gateway, which is connected to CKT-LON. Both gateways use their default settings.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'un réseau virtuel nommé **VNet-Hub** qui contient une passerelle ExpressRoute nommée **ERGW1** avec la référence SKU ErGw1AZ. ERGW1 possède les connexions suivantes :

        | Connexion | Circuit | Emplacement de peering |
        | --- | --- | --- |
        | Conn1 | CKT-AMS1 | Amsterdam |
        | Conn2 | CKT-AMS2 | Amsterdam |
        | Conn3 | CKT-LON | London |
        | Conn4 | CKT-PAR | Paris |

        Un autre réseau virtuel, **VNet-B**, possède sa propre passerelle ExpressRoute, connectée à CKT-LON. Les deux passerelles utilisent leurs paramètres par défaut.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "You can connect ERGW1 to a fifth circuit, at the Dublin peering location, without changing the gateway SKU.", fr: "Vous pouvez connecter ERGW1 à un cinquième circuit, à l'emplacement de peering Dublin, sans changer la référence SKU de la passerelle." } }
        - { id: s2, text: { en: "After you resize ERGW1 to ErGw3AZ, you can connect two more circuits at the Amsterdam peering location to VNet-Hub.", fr: "Après avoir redimensionné ERGW1 en ErGw3AZ, vous pouvez connecter deux circuits supplémentaires de l'emplacement de peering Amsterdam à VNet-Hub." } }
        - { id: s3, text: { en: "Virtual machines in VNet-Hub and VNet-B can communicate through CKT-LON.", fr: "Les machines virtuelles de VNet-Hub et de VNet-B peuvent communiquer par CKT-LON." } }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          ErGw1AZ accepts at most 4 circuit connections, and ERGW1 already has 4. ErGw3AZ accepts 16, and whatever the SKU a virtual network can connect to at most 4 circuits from the same peering location, so two more Amsterdam circuits (four in total) fit. Traffic between virtual networks through ExpressRoute is disabled by default on the gateways and must be enabled explicitly; virtual network peering remains the recommended path.
        fr: |
          ErGw1AZ accepte au plus 4 connexions de circuit, et ERGW1 en a déjà 4. ErGw3AZ en accepte 16, et quelle que soit la référence SKU, un réseau virtuel peut se connecter à au plus 4 circuits du même emplacement de peering : deux circuits supplémentaires à Amsterdam (quatre au total) conviennent donc. Le trafic entre réseaux virtuels par ExpressRoute est désactivé par défaut sur les passerelles et doit être activé explicitement ; le peering de réseaux virtuels reste le chemin recommandé.
    references:
      - title: About ExpressRoute virtual network gateways
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-virtual-network-gateways

  # ------------------------------------------------------------------ 8
  - id: az700-qz-24-08
    objective: "2.3.13"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Fabrikam has an ExpressRoute circuit named **ER-FAB** that uses the Standard SKU and Azure private peering. A hub virtual network named **VNet-Hub** (10.0.0.0/16) contains an ExpressRoute gateway connected to ER-FAB. Two spoke virtual networks, **VNet-Spoke1** (10.1.0.0/16) and **VNet-Spoke2** (10.2.0.0/16), are peered with VNet-Hub.

        Two problems are reported:

        - On-premises servers can reach VNet-Hub and VNet-Spoke1, but not VNet-Spoke2.
        - Since a configuration change on the secondary edge router yesterday, the BGP session of the secondary link goes down repeatedly.

        You collect the results shown in the following table. Answer each prompt by selecting the result that identifies the cause.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un circuit ExpressRoute nommé **ER-FAB** qui utilise la référence SKU Standard et le peering privé Azure. Un réseau virtuel hub nommé **VNet-Hub** (10.0.0.0/16) contient une passerelle ExpressRoute connectée à ER-FAB. Deux réseaux virtuels spoke, **VNet-Spoke1** (10.1.0.0/16) et **VNet-Spoke2** (10.2.0.0/16), sont reliés à VNet-Hub par un peering.

        Deux problèmes sont signalés :

        - Les serveurs locaux atteignent VNet-Hub et VNet-Spoke1, mais pas VNet-Spoke2.
        - Depuis une modification de configuration du routeur de périphérie secondaire hier, la session BGP de la liaison secondaire tombe à répétition.

        Vous collectez les résultats présentés dans le tableau suivant. Répondez à chaque consigne en sélectionnant le résultat qui identifie la cause.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The cause of the repeated BGP session drops on the secondary link", fr: "La cause des chutes répétées de la session BGP sur la liaison secondaire" }
        - id: p2
          text: { en: "The reason why on-premises servers can't reach VNet-Spoke2", fr: "La raison pour laquelle les serveurs locaux ne peuvent pas atteindre VNet-Spoke2" }
      grid:
        header: [{ en: "Check", fr: "Vérification" }, { en: "Result", fr: "Résultat" }]
        rows:
          - [{ text: "Get-AzExpressRouteCircuit" }, { text: "CircuitProvisioningState: Enabled; ServiceProviderProvisioningState: Provisioned", area: r1 }]
          - [{ text: "Get-AzExpressRouteCircuitARPTable -DevicePath Secondary" }, { text: { en: "On-premises and Microsoft entries, each with a MAC address", fr: "Entrées on-premises et Microsoft, chacune avec une adresse MAC" }, area: r2 }]
          - [{ text: "Get-AzExpressRouteCircuitRouteTable -DevicePath Primary" }, { text: { en: "Neighbor Established; 3,700 on-premises prefixes received", fr: "Voisin Established ; 3 700 préfixes locaux reçus" }, area: r3 }]
          - [{ text: { en: "Log of the secondary edge router", fr: "Journal du routeur de périphérie secondaire" } }, { text: { en: "4,150 prefixes advertised to the MSEE before each session reset", fr: "4 150 préfixes publiés vers le MSEE avant chaque réinitialisation de session" }, area: r4 }]
          - [{ text: { en: "Peering VNet-Hub to VNet-Spoke2", fr: "Peering VNet-Hub vers VNet-Spoke2" } }, { text: { en: "Allow gateway transit: Enabled", fr: "Autoriser le transit par passerelle : activé" }, area: r5 }]
          - [{ text: { en: "Peering VNet-Spoke2 to VNet-Hub", fr: "Peering VNet-Spoke2 vers VNet-Hub" } }, { text: { en: "Use remote gateways: Disabled", fr: "Utiliser des passerelles distantes : désactivé" }, area: r6 }]
          - [{ text: { en: "Peering VNet-Spoke1 to VNet-Hub", fr: "Peering VNet-Spoke1 vers VNet-Hub" } }, { text: { en: "Use remote gateways: Enabled", fr: "Utiliser des passerelles distantes : activé" }, area: r7 }]
    answer:
      values: { p1: r4, p2: r6 }
    explanation:
      correct:
        en: |
          A Standard circuit accepts 4,000 IPv4 prefixes on private peering; when a router advertises more, the BGP session is dropped until the count goes back under the limit, so the 4,150 prefixes of the secondary router explain the resets. A spoke reaches on-premises through the hub gateway only when its peering has Use remote gateways enabled; VNet-Spoke1 has it, VNet-Spoke2 doesn't, so its prefix isn't exchanged with on-premises.
        fr: |
          Un circuit Standard accepte 4 000 préfixes IPv4 sur le peering privé ; quand un routeur en publie davantage, la session BGP est interrompue jusqu'à ce que le nombre repasse sous la limite : les 4 150 préfixes du routeur secondaire expliquent donc les réinitialisations. Un spoke n'atteint le réseau local par la passerelle du hub que si son peering a Utiliser des passerelles distantes activé ; VNet-Spoke1 l'a, VNet-Spoke2 non : son préfixe n'est donc pas échangé avec le réseau local.
      options:
        r2: { en: "Both ARP entries are resolved on the secondary path, so Layer 2 works there.", fr: "Les deux entrées ARP sont résolues sur le chemin secondaire : la couche 2 y fonctionne." }
        r5: { en: "Allow gateway transit is required on the hub side and is already enabled.", fr: "Autoriser le transit par passerelle est nécessaire côté hub et est déjà activé." }
    references:
      - title: Verify Azure ExpressRoute connectivity
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-troubleshooting-expressroute-overview
      - title: "Azure ExpressRoute: Routing requirements"
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-routing

  # ------------------------------------------------------------------ 9
  - id: az700-qz-24-09
    objective: "2.3.11"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso has a pair of 10-Gbps ExpressRoute Direct ports named **ERD-AMS**. A circuit named **CKT-D** is provisioned on ERD-AMS, and its Azure private peering is linked to a virtual network named **VNet-Prod** through an ExpressRoute gateway. A new security policy requires the following:

        - All frames on the physical links between the Contoso edge routers and the MSEEs, BGP included, must be encrypted.
        - Traffic between on-premises application servers and the virtual machines in VNet-Prod must be encrypted end to end. The tunnel endpoints must not use public IP addresses.

        You will adjust the route advertisements separately.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'une paire de ports ExpressRoute Direct de 10 Gbit/s nommée **ERD-AMS**. Un circuit nommé **CKT-D** est approvisionné sur ERD-AMS, et son peering privé Azure est lié à un réseau virtuel nommé **VNet-Prod** par une passerelle ExpressRoute. Une nouvelle stratégie de sécurité exige ce qui suit :

        - Toutes les trames des liaisons physiques entre les routeurs de périphérie de Contoso et les MSEE, BGP compris, doivent être chiffrées.
        - Le trafic entre les serveurs d'applications locaux et les machines virtuelles de VNet-Prod doit être chiffré de bout en bout. Les extrémités du tunnel ne doivent pas utiliser d'adresses IP publiques.

        Vous ajusterez les publications de routes séparément.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Configure MACsec on both links of ERD-AMS, with the CKN and CAK stored as secrets in Azure Key Vault.", fr: "Configurer MACsec sur les deux liaisons d'ERD-AMS, avec la CKN et la CAK stockées comme secrets dans Azure Key Vault." } }
        - { id: b, text: { en: "Configure MACsec on the connection between the ExpressRoute gateway of VNet-Prod and CKT-D.", fr: "Configurer MACsec sur la connexion entre la passerelle ExpressRoute de VNet-Prod et CKT-D." } }
        - { id: c, text: { en: "Configure Microsoft peering on CKT-D and build IPsec tunnels to the public IP addresses of a VPN gateway.", fr: "Configurer le peering Microsoft sur CKT-D et établir des tunnels IPsec vers les adresses IP publiques d'une passerelle VPN." } }
        - { id: d, text: { en: "Deploy a VPN gateway in VNet-Prod with Gateway Private IPs enabled, and connect to its private address over private peering.", fr: "Déployer une passerelle VPN dans VNet-Prod avec Adresses IP privées de la passerelle activé, et se connecter à son adresse privée par le peering privé." } }
        - { id: e, text: { en: "Enable FastPath on the connection between the ExpressRoute gateway of VNet-Prod and CKT-D.", fr: "Activer FastPath sur la connexion entre la passerelle ExpressRoute de VNet-Prod et CKT-D." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          MACsec encrypts the physical links between your edge routers and the MSEEs at Layer 2, BGP included; it is available on ExpressRoute Direct ports and uses keys that you store in Azure Key Vault. MACsec stops at the MSEEs, so end-to-end encryption needs an IPsec tunnel: a VPN gateway with Gateway Private IPs enabled and a connection that uses its private address over private peering.
        fr: |
          MACsec chiffre au niveau de la couche 2 les liaisons physiques entre vos routeurs de périphérie et les MSEE, BGP compris ; il est disponible sur les ports ExpressRoute Direct et utilise des clés que vous stockez dans Azure Key Vault. MACsec s'arrête aux MSEE : le chiffrement de bout en bout demande donc un tunnel IPsec, soit une passerelle VPN avec Adresses IP privées de la passerelle activé et une connexion qui utilise son adresse privée par le peering privé.
      options:
        b: { en: "MACsec is configured on the ExpressRoute Direct ports, not on the gateway connection, and it doesn't extend into the virtual network.", fr: "MACsec se configure sur les ports ExpressRoute Direct, pas sur la connexion de la passerelle, et il ne s'étend pas jusqu'au réseau virtuel." }
        c: { en: "Tunnels over Microsoft peering terminate on the public IP addresses of the gateway, which the policy forbids.", fr: "Des tunnels sur le peering Microsoft aboutissent aux adresses IP publiques de la passerelle, ce que la stratégie interdit." }
        e: { en: "FastPath makes traffic bypass the gateway in the data path; it encrypts nothing.", fr: "FastPath fait contourner la passerelle par le trafic dans le chemin des données ; il ne chiffre rien." }
    references:
      - title: Configure MACsec on ExpressRoute Direct ports
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-macsec
      - title: Configure a Site-to-Site VPN connection over ExpressRoute private peering
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/site-to-site-vpn-private-peering

  # ------------------------------------------------------------------ 10
  - id: az700-qz-24-10
    objective: "2.3.10"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has two ExpressRoute circuits, **CKT-AMS** (Amsterdam) and **CKT-LON** (London), with Microsoft peering configured on both. Fabrikam peers with Microsoft by using its own public ASN on both circuits. On-premises hosts reach Azure public endpoints through stateful NAT devices that translate their addresses to 198.51.100.0/24, a prefix registered to Fabrikam and validated on both peerings. The edge routers advertise 198.51.100.0/24 over both circuits and already prefer CKT-AMS for outbound traffic by using local preference.

        Return traffic from Microsoft to 198.51.100.0/24 currently arrives over both circuits, which breaks the NAT sessions. You need the return traffic to use CKT-AMS while CKT-AMS is available, and CKT-LON to take over if CKT-AMS fails.

        Which two actions can you perform? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose de deux circuits ExpressRoute, **CKT-AMS** (Amsterdam) et **CKT-LON** (London), avec le peering Microsoft configuré sur les deux. Fabrikam établit le peering avec Microsoft en utilisant son propre ASN public sur les deux circuits. Les hôtes locaux atteignent les points de terminaison publics Azure par des équipements NAT avec état qui traduisent leurs adresses en 198.51.100.0/24, un préfixe inscrit au nom de Fabrikam et validé sur les deux peerings. Les routeurs de périphérie publient 198.51.100.0/24 sur les deux circuits et préfèrent déjà CKT-AMS pour le trafic sortant grâce à la préférence locale.

        Le trafic de retour de Microsoft vers 198.51.100.0/24 arrive actuellement par les deux circuits, ce qui rompt les sessions NAT. Vous devez faire en sorte que le trafic de retour emprunte CKT-AMS tant que CKT-AMS est disponible, et que CKT-LON prenne le relais si CKT-AMS tombe en panne.

        Quelles sont les deux actions possibles ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Add 198.51.100.0/25 and 198.51.100.128/25 to the advertised prefixes of the CKT-AMS peering and advertise them over CKT-AMS only.", fr: "Ajouter 198.51.100.0/25 et 198.51.100.128/25 aux préfixes publiés du peering de CKT-AMS et les publier uniquement sur CKT-AMS." } }
        - { id: b, text: { en: "Tag 198.51.100.0/24 with the BGP community of the West Europe region when it is advertised over CKT-AMS.", fr: "Marquer 198.51.100.0/24 avec la communauté BGP de la région West Europe quand il est publié sur CKT-AMS." } }
        - { id: c, text: { en: "Set a higher routing weight on the connection of CKT-AMS than on the connection of CKT-LON.", fr: "Définir un poids de routage plus élevé sur la connexion de CKT-AMS que sur celle de CKT-LON." } }
        - { id: d, text: { en: "Prepend the public ASN of Fabrikam several times to 198.51.100.0/24 when it is advertised over CKT-LON.", fr: "Préfixer plusieurs fois l'ASN public de Fabrikam à 198.51.100.0/24 quand il est publié sur CKT-LON." } }
        - { id: e, text: { en: "Raise the local preference of the routes that the edge routers receive from Microsoft over CKT-AMS.", fr: "Augmenter la préférence locale des routes que les routeurs de périphérie reçoivent de Microsoft par CKT-AMS." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Microsoft chooses its path to your prefixes from what you advertise. More specific prefixes over CKT-AMS win by longest prefix match, and the /24 still advertised over CKT-LON takes over if they disappear. AS path prepending with a public ASN on CKT-LON makes that path longer, so Microsoft prefers CKT-AMS while keeping CKT-LON as a backup.
        fr: |
          Microsoft choisit son chemin vers vos préfixes d'après ce que vous publiez. Des préfixes plus spécifiques sur CKT-AMS l'emportent par la correspondance du préfixe le plus long, et le /24 toujours publié sur CKT-LON prend le relais s'ils disparaissent. Le préfixage du chemin d'AS avec un ASN public sur CKT-LON allonge ce chemin : Microsoft préfère donc CKT-AMS tout en gardant CKT-LON en secours.
      options:
        b: { en: "Microsoft tags the routes it advertises with BGP communities but ignores the communities that you set on your routes.", fr: "Microsoft marque les routes qu'il publie avec des communautés BGP, mais ignore les communautés que vous posez sur vos routes." }
        c: { en: "Routing weight is a setting of the gateway connections of private peering; Microsoft peering has no gateway connection.", fr: "Le poids de routage est un paramètre des connexions de passerelle du peering privé ; le peering Microsoft n'a pas de connexion de passerelle." }
        e: { en: "Local preference controls the path that the edge routers choose for outbound traffic, which is already CKT-AMS; it doesn't influence how Microsoft returns traffic.", fr: "La préférence locale contrôle le chemin choisi par les routeurs de périphérie pour le trafic sortant, déjà CKT-AMS ; elle n'influence pas la façon dont Microsoft renvoie le trafic." }
    references:
      - title: Optimize routing for Azure ExpressRoute
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-optimize-routing
      - title: "Azure ExpressRoute: Routing requirements"
        url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-routing
