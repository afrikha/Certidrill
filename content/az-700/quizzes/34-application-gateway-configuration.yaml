chapter: 34-application-gateway-configuration
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-34-01
    objective: "3.2.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin publishes a web shop through an Application Gateway Standard_v2 named **AGW1**. When no backend server is available, the shop users see the generic 502 error page of the gateway.

        You need the users of the shop listener to see a branded HTML page instead. What should you configure?
      fr: |
        Tailspin publie une boutique web au moyen d'un Application Gateway Standard_v2 nommé **AGW1**. Quand aucun serveur de back-end n'est disponible, les utilisateurs de la boutique voient la page d'erreur 502 générique de la passerelle.

        Vous devez faire en sorte que les utilisateurs de l'écouteur de la boutique voient plutôt une page HTML à l'image de la marque. Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "A rewrite set that sets the Location response header to the branded page for 502 responses", fr: "Un ensemble de réécriture qui définit l'en-tête de réponse Location sur la page de marque pour les réponses 502" } }
        - { id: b, text: { en: "A custom health probe that requests the branded page from the backend servers", fr: "Une sonde d'intégrité personnalisée qui demande la page de marque aux serveurs de back-end" } }
        - { id: c, text: { en: "A custom error page for status code 502 on the listener of the shop", fr: "Une page d'erreur personnalisée pour le code d'état 502 sur l'écouteur de la boutique" } }
        - { id: d, text: { en: "A redirection to an external site that hosts the branded page, on the shop rule", fr: "Une redirection vers un site externe qui héberge la page de marque, sur la règle de la boutique" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Application Gateway can replace its own error pages with custom error pages for codes 400, 403, 405, 408, 500, 502, 503 and 504, either globally or per listener. A listener-level page for 502 gives the shop users the branded page without changing the other listeners.
        fr: |
          Application Gateway peut remplacer ses propres pages d'erreur par des pages d'erreur personnalisées pour les codes 400, 403, 405, 408, 500, 502, 503 et 504, globalement ou par écouteur. Une page 502 au niveau de l'écouteur montre la page de marque aux utilisateurs de la boutique sans modifier les autres écouteurs.
      options:
        a: { en: "Rewrites don't apply to the 4xx and 5xx responses that the gateway generates itself, so the 502 page can't be changed this way.", fr: "Les réécritures ne s'appliquent pas aux réponses 4xx et 5xx générées par la passerelle elle-même : la page 502 ne peut pas être modifiée ainsi." }
        b: { en: "A health probe only decides which servers receive traffic; it doesn't change what users see when no server is healthy.", fr: "Une sonde d'intégrité décide seulement quels serveurs reçoivent le trafic ; elle ne change pas ce que voient les utilisateurs quand aucun serveur n'est sain." }
        d: { en: "A redirection on the rule would send every shop request to the external site, not only the failed ones.", fr: "Une redirection sur la règle enverrait toutes les requêtes de la boutique vers le site externe, pas seulement celles qui échouent." }
    references:
      - title: Create Application Gateway custom error pages
        url: https://learn.microsoft.com/en-us/azure/application-gateway/custom-error
      - title: Application Gateway listener configuration
        url: https://learn.microsoft.com/en-us/azure/application-gateway/configuration-listeners

  # ------------------------------------------------------------------ 2
  - id: az700-qz-34-02
    objective: "3.2.8"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        An Application Gateway Standard_v2 named **AGW1** forwards requests to virtual machines in its own virtual network. The backend settings of AGW1 use their default values.

        A report page takes about 45 seconds to generate. Users who open it receive an error from AGW1 after about 20 seconds, although the servers finish the report.

        Which setting should you change?
      fr: |
        Un Application Gateway Standard_v2 nommé **AGW1** transfère les requêtes à des machines virtuelles de son propre réseau virtuel. Les paramètres de back-end d'AGW1 utilisent leurs valeurs par défaut.

        Une page de rapport met environ 45 secondes à se générer. Les utilisateurs qui l'ouvrent reçoivent une erreur d'AGW1 après environ 20 secondes, alors que les serveurs terminent le rapport.

        Quel paramètre devez-vous modifier ?
    body:
      options:
        - { id: a, text: { en: "The connection draining timeout of the backend settings", fr: "Le délai de drainage des connexions des paramètres de back-end" } }
        - { id: b, text: { en: "The request timeout of the backend settings", fr: "Le délai d'expiration de la requête des paramètres de back-end" } }
        - { id: c, text: { en: "The interval of the health probe", fr: "L'intervalle de la sonde d'intégrité" } }
        - { id: d, text: { en: "The unhealthy threshold of the health probe", fr: "Le seuil Unhealthy threshold de la sonde d'intégrité" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The request timeout of the backend settings is how long the gateway waits for a response from a backend server; its default is 20 seconds. Raising it above 45 seconds lets the report complete (private backends accept up to 86,400 seconds).
        fr: |
          Le délai d'expiration de la requête des paramètres de back-end est le temps pendant lequel la passerelle attend la réponse d'un serveur de back-end ; il vaut 20 secondes par défaut. Le porter au-delà de 45 secondes laisse le rapport se terminer (les back-ends privés acceptent jusqu'à 86 400 secondes).
      options:
        a: { en: "Connection draining only lets servers that are removed from the pool finish their existing requests.", fr: "Le drainage des connexions permet seulement aux serveurs retirés du pool de terminer leurs requêtes en cours." }
        c: { en: "The probe interval sets how often health is checked; it doesn't limit how long a user request can take.", fr: "L'intervalle de la sonde fixe la fréquence des vérifications d'intégrité ; il ne limite pas la durée d'une requête utilisateur." }
        d: { en: "The unhealthy threshold sets how many failed probes mark a server unhealthy; the servers here are healthy.", fr: "Le seuil Unhealthy threshold fixe le nombre d'échecs de sonde qui rendent un serveur non sain ; ici, les serveurs sont sains." }
    references:
      - title: Application Gateway backend settings configuration
        url: https://learn.microsoft.com/en-us/azure/application-gateway/configuration-http-settings

  # ------------------------------------------------------------------ 3
  - id: az700-qz-34-03
    objective: "3.2.7"
    difficulty: 1
    status: draft
    type: multi
    stem:
      en: |
        You are adding path rules to the URL path map of a path-based routing rule on an Application Gateway Standard_v2 named **AGW1**.

        Which two path patterns are supported?

        NOTE: Each correct selection is worth one point.
      fr: |
        Vous ajoutez des règles de chemin au mappage de chemins d'URL d'une règle de routage basée sur le chemin d'un Application Gateway Standard_v2 nommé **AGW1**.

        Quels sont les deux modèles de chemin pris en charge ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: "`/media/*.png`" }
        - { id: b, text: "`/media/*`" }
        - { id: c, text: "`/*.png`" }
        - { id: d, text: "`/catalog/*/reviews`" }
        - { id: e, text: "`/catalog*`" }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          A path pattern starts with `/` and can use `*` only at its end, with or without a slash before it: `/media/*` and `/catalog*` are both valid. The matcher only sees the path, not the query string, and the comparison is case-insensitive.
        fr: |
          Un modèle de chemin commence par `/` et ne peut utiliser `*` qu'à la fin, avec ou sans barre oblique avant : `/media/*` et `/catalog*` sont tous deux valides. Le moteur de correspondance ne voit que le chemin, pas la chaîne de requête, et la comparaison est insensible à la casse.
      options:
        a: { en: "A wildcard followed by an extension (`*.png`) isn't supported: `*` can only end the pattern.", fr: "Un caractère générique suivi d'une extension (`*.png`) n'est pas pris en charge : `*` ne peut que terminer le modèle." }
        c: { en: "A pattern that starts with a wildcard and filters on an extension, such as `/*.jpg`, isn't supported.", fr: "Un modèle qui commence par un caractère générique et filtre sur une extension, comme `/*.jpg`, n'est pas pris en charge." }
        d: { en: "A wildcard in the middle of the path, like `/Repos/*/Comments/*`, isn't supported.", fr: "Un caractère générique au milieu du chemin, comme `/Repos/*/Comments/*`, n'est pas pris en charge." }
    references:
      - title: URL Path Based Routing overview
        url: https://learn.microsoft.com/en-us/azure/application-gateway/url-route-overview

  # ------------------------------------------------------------------ 4
  - id: az700-qz-34-04
    objective: "3.2.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove has an Application Gateway Standard_v2 named **AGW1** in a subnet named **snet-agw**. AGW1 has a user-assigned managed identity that holds the Key Vault Secrets User role on a key vault named **kv-woodgrove**. An HTTPS listener of AGW1 references a certificate of kv-woodgrove by a versionless secret identifier, and it worked until today.

        The security team enabled the firewall of kv-woodgrove, set to allow access from selected networks only, with no network rule. The listener is now disabled.

        You need the listener to work again. Internet traffic to kv-woodgrove must stay blocked, and you must not deploy any new resource. What should you do?
      fr: |
        Woodgrove dispose d'un Application Gateway Standard_v2 nommé **AGW1** dans un sous-réseau nommé **snet-agw**. AGW1 possède une identité managée affectée par l'utilisateur qui détient le rôle Key Vault Secrets User sur un coffre de clés nommé **kv-woodgrove**. Un écouteur HTTPS d'AGW1 référence un certificat de kv-woodgrove par un identificateur de secret sans version, et il fonctionnait jusqu'à aujourd'hui.

        L'équipe de sécurité a activé le pare-feu de kv-woodgrove, réglé pour n'autoriser l'accès que depuis des réseaux sélectionnés, sans aucune règle réseau. L'écouteur est maintenant désactivé.

        Vous devez rétablir le fonctionnement de l'écouteur. Le trafic Internet vers kv-woodgrove doit rester bloqué, et vous ne devez déployer aucune nouvelle ressource. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign a system-assigned managed identity to AGW1, and grant this identity the Key Vault Secrets User role on kv-woodgrove.", fr: "Affecter une identité managée affectée par le système à AGW1, puis accorder à cette identité le rôle Key Vault Secrets User sur kv-woodgrove." } }
        - { id: b, text: { en: "Replace the versionless identifier of the listener certificate with the identifier of the current version.", fr: "Remplacer l'identificateur sans version du certificat de l'écouteur par l'identificateur de la version actuelle." } }
        - { id: c, text: { en: "Grant the managed identity the Key Vault Certificates Officer role on kv-woodgrove instead of its current role.", fr: "Accorder à l'identité managée le rôle Key Vault Certificates Officer sur kv-woodgrove à la place de son rôle actuel." } }
        - { id: d, text: { en: "Enable the Microsoft.KeyVault service endpoint on snet-agw, add the subnet to the vault firewall, and allow trusted services.", fr: "Activer le point de terminaison de service Microsoft.KeyVault sur snet-agw, ajouter le sous-réseau au pare-feu du coffre et autoriser les services approuvés." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The permissions were already correct: the new firewall blocks the gateway, and a gateway that can't reach its key vault disables the listener. With selected networks, add the gateway subnet with the `Microsoft.KeyVault` service endpoint and allow trusted Microsoft services to bypass the firewall; internet traffic stays denied. A private endpoint would also work, but it is a new resource.
        fr: |
          Les autorisations étaient déjà correctes : le nouveau pare-feu bloque la passerelle, et une passerelle qui ne peut pas joindre son coffre de clés désactive l'écouteur. Avec des réseaux sélectionnés, ajoutez le sous-réseau de la passerelle avec le point de terminaison de service `Microsoft.KeyVault` et autorisez les services Microsoft approuvés à contourner le pare-feu ; le trafic Internet reste refusé. Un point de terminaison privé fonctionnerait aussi, mais c'est une nouvelle ressource.
      options:
        a: { en: "Application Gateway uses a user-assigned identity for Key Vault, and the problem is the network access, not the identity.", fr: "Application Gateway utilise une identité affectée par l'utilisateur pour Key Vault, et le problème est l'accès réseau, pas l'identité." }
        b: { en: "A versioned identifier would still be blocked by the firewall, and it would stop the automatic use of renewed certificates.", fr: "Un identificateur avec version serait toujours bloqué par le pare-feu, et il empêcherait l'utilisation automatique des certificats renouvelés." }
        c: { en: "Key Vault Secrets User is already the role the gateway needs; another role doesn't open the firewall.", fr: "Key Vault Secrets User est déjà le rôle dont la passerelle a besoin ; un autre rôle n'ouvre pas le pare-feu." }
    references:
      - title: TLS termination with Key Vault certificates
        url: https://learn.microsoft.com/en-us/azure/application-gateway/key-vault-certs

  # ------------------------------------------------------------------ 5
  - id: az700-qz-34-05
    objective: "3.2.10"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        An Application Gateway Standard_v2 named **AGW1** has a listener named **lst-web** and a basic routing rule named **rule-web** for that listener. A rewrite set named **rs-headers** is associated with rule-web and contains two rewrite rules without conditions:

        | Rewrite rule | Rule sequence | Action |
        | --- | --- | --- |
        | add-hsts | 100 | Set the `Strict-Transport-Security` response header |
        | hide-server | 50 | Delete the `Server` response header |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un Application Gateway Standard_v2 nommé **AGW1** possède un écouteur nommé **lst-web** et une règle de routage de base nommée **rule-web** pour cet écouteur. Un ensemble de réécriture nommé **rs-headers** est associé à rule-web et contient deux règles de réécriture sans condition :

        | Règle de réécriture | Séquence de règle | Action |
        | --- | --- | --- |
        | add-hsts | 100 | Définir l'en-tête de réponse `Strict-Transport-Security` |
        | hide-server | 50 | Supprimer l'en-tête de réponse `Server` |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: The rewrite rule hide-server runs before the rewrite rule add-hsts.
            fr: La règle de réécriture hide-server s'exécute avant la règle de réécriture add-hsts.
        - id: s2
          text:
            en: The Strict-Transport-Security header is added to the 502 responses that AGW1 generates when no backend server is healthy.
            fr: L'en-tête Strict-Transport-Security est ajouté aux réponses 502 qu'AGW1 génère quand aucun serveur de back-end n'est sain.
        - id: s3
          text:
            en: The rewrite set applies to the requests received by lst-web, whatever their URL path.
            fr: L'ensemble de réécriture s'applique aux requêtes reçues par lst-web, quel que soit leur chemin d'URL.
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Rewrite rules run in ascending order of rule sequence, so hide-server (50) runs before add-hsts (100). Rewrites don't apply to the 4xx and 5xx responses generated by the gateway itself, so its 502 page doesn't get the header. With a basic routing rule, the rewrite set is a global rewrite for the whole listener; only a path-based rule limits it to some paths.
        fr: |
          Les règles de réécriture s'exécutent dans l'ordre croissant de leur séquence : hide-server (50) s'exécute donc avant add-hsts (100). Les réécritures ne s'appliquent pas aux réponses 4xx et 5xx générées par la passerelle elle-même : sa page 502 ne reçoit pas l'en-tête. Avec une règle de routage de base, l'ensemble de réécriture est une réécriture globale pour tout l'écouteur ; seule une règle basée sur le chemin la limite à certains chemins.
    references:
      - title: Rewrite HTTP headers and URL with Application Gateway
        url: https://learn.microsoft.com/en-us/azure/application-gateway/rewrite-http-headers-url
      - title: Rewrite HTTP request and response headers with Azure Application Gateway - Azure portal
        url: https://learn.microsoft.com/en-us/azure/application-gateway/rewrite-http-headers-portal

  # ------------------------------------------------------------------ 6
  - id: az700-qz-34-06
    objective: "3.2.9"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has an Application Gateway Standard_v2 named **AGW1**. All the following HTTPS listeners use the same public frontend IP address and port 443:

        | Rule priority | Rule | Listener type | Host names | Listener certificate |
        | --- | --- | --- | --- | --- |
        | 10 | rule-api | Multi-site | api.contoso.com | cert-api |
        | 20 | rule-shop | Multi-site | shop.contoso.com | cert-shop |
        | 900 | rule-default | Basic | (any) | cert-default |

        Legacy barcode scanners connect to `https://<public IP address of AGW1>/` by IP address. Their TLS client doesn't send the Server Name Indication (SNI) extension.

        Which certificate does AGW1 present to the scanners, and which rule processes their HTTP requests?
      fr: |
        Contoso dispose d'un Application Gateway Standard_v2 nommé **AGW1**. Tous les écouteurs HTTPS suivants utilisent la même adresse IP frontale publique et le port 443 :

        | Priorité de la règle | Règle | Type d'écouteur | Noms d'hôte | Certificat de l'écouteur |
        | --- | --- | --- | --- | --- |
        | 10 | rule-api | Multisite | api.contoso.com | cert-api |
        | 20 | rule-shop | Multisite | shop.contoso.com | cert-shop |
        | 900 | rule-default | De base | (tous) | cert-default |

        D'anciens lecteurs de codes-barres se connectent à `https://<adresse IP publique d'AGW1>/` par adresse IP. Leur client TLS n'envoie pas l'extension SNI (Server Name Indication).

        Quel certificat AGW1 présente-t-il aux lecteurs, et quelle règle traite leurs requêtes HTTP ?
    body:
      options:
        - { id: a, text: { en: "cert-default, and rule-default processes the requests", fr: "cert-default, et rule-default traite les requêtes" } }
        - { id: b, text: { en: "cert-api, and rule-api processes the requests", fr: "cert-api, et rule-api traite les requêtes" } }
        - { id: c, text: { en: "cert-api, and rule-default processes the requests", fr: "cert-api, et rule-default traite les requêtes" } }
        - { id: d, text: { en: "No certificate: AGW1 resets the TLS connection", fr: "Aucun certificat : AGW1 réinitialise la connexion TLS" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Without SNI, a v2 gateway doesn't fall back to the basic listener's certificate: it presents the certificate of the HTTPS listener whose rule has the highest priority (lowest number), here cert-api. Once the TLS session is set up, the Host header contains an IP address that matches no multi-site host name, so the basic listener and rule-default process the requests.
        fr: |
          Sans SNI, une passerelle v2 ne se replie pas sur le certificat de l'écouteur de base : elle présente le certificat de l'écouteur HTTPS dont la règle a la priorité la plus haute (le plus petit numéro), ici cert-api. Une fois la session TLS établie, l'en-tête Host contient une adresse IP qui ne correspond à aucun nom d'hôte multisite : l'écouteur de base et rule-default traitent donc les requêtes.
      options:
        a: { en: "v2 doesn't use the basic listener's certificate as a fallback for clients without SNI.", fr: "La v2 n'utilise pas le certificat de l'écouteur de base comme repli pour les clients sans SNI." }
        b: { en: "The certificate is cert-api, but routing uses the Host header, and an IP address doesn't match api.contoso.com.", fr: "Le certificat est bien cert-api, mais le routage utilise l'en-tête Host, et une adresse IP ne correspond pas à api.contoso.com." }
        d: { en: "Unlike v1, a v2 gateway doesn't reset connections without SNI; it presents a certificate.", fr: "Contrairement à la v1, une passerelle v2 ne réinitialise pas les connexions sans SNI ; elle présente un certificat." }
    references:
      - title: Overview of TLS termination and end to end TLS with Application Gateway
        url: https://learn.microsoft.com/en-us/azure/application-gateway/ssl-overview

  # ------------------------------------------------------------------ 7
  - id: az700-qz-34-07
    objective: "3.2.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam has an Application Gateway Standard_v2 named **AGW1**. The following listeners share one public frontend IP address and port 443, and their certificates are valid for every host name that clients request:

        | Rule priority | Rule | Listener type | Host names |
        | --- | --- | --- | --- |
        | 100 | rule-kiosk | Multi-site | `kiosk?.fabrikam.com` |
        | 200 | rule-contoso | Multi-site | `*.contoso.com` |
        | 300 | rule-catchall | Basic | (any) |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un Application Gateway Standard_v2 nommé **AGW1**. Les écouteurs suivants partagent une adresse IP frontale publique et le port 443, et leurs certificats sont valides pour tous les noms d'hôte que demandent les clients :

        | Priorité de la règle | Règle | Type d'écouteur | Noms d'hôte |
        | --- | --- | --- | --- |
        | 100 | rule-kiosk | Multisite | `kiosk?.fabrikam.com` |
        | 200 | rule-contoso | Multisite | `*.contoso.com` |
        | 300 | rule-catchall | De base | (tous) |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: A request for https://contoso.com/ is processed by rule-contoso.
            fr: Une requête pour https://contoso.com/ est traitée par rule-contoso.
        - id: s2
          text:
            en: A request for https://eu.shop.contoso.com/ is processed by rule-contoso.
            fr: Une requête pour https://eu.shop.contoso.com/ est traitée par rule-contoso.
        - id: s3
          text:
            en: A request for https://kiosk12.fabrikam.com/ is processed by rule-kiosk.
            fr: Une requête pour https://kiosk12.fabrikam.com/ est traitée par rule-kiosk.
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          `*.contoso.com` requires a dot before contoso, so it doesn't match contoso.com: that request falls through to the basic listener of rule-catchall. The asterisk matches several characters, including dots, so eu.shop.contoso.com matches `*.contoso.com`. The question mark matches exactly one character, so `kiosk?.fabrikam.com` matches kiosk1.fabrikam.com but not kiosk12.fabrikam.com, which goes to rule-catchall.
        fr: |
          `*.contoso.com` exige un point avant contoso et ne correspond donc pas à contoso.com : cette requête aboutit à l'écouteur de base de rule-catchall. L'astérisque correspond à plusieurs caractères, points compris : eu.shop.contoso.com correspond donc à `*.contoso.com`. Le point d'interrogation correspond à un seul caractère : `kiosk?.fabrikam.com` correspond à kiosk1.fabrikam.com mais pas à kiosk12.fabrikam.com, qui va vers rule-catchall.
    references:
      - title: Application Gateway multi-site hosting
        url: https://learn.microsoft.com/en-us/azure/application-gateway/multiple-site-overview

  # ------------------------------------------------------------------ 8
  - id: az700-qz-34-08
    objective: "3.2.7"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        An Application Gateway Standard_v2 named **AGW1** has a path-based routing rule named **rule-shop** for the listener of www.contoso.com. Its URL path map contains the following path rules, in this order, and its default backend pool is **pool-web**:

        | Order | Path | Target |
        | --- | --- | --- |
        | 1 | `/api/v2/*` | Backend pool pool-v2 |
        | 2 | `/api/*` | Backend pool pool-api |
        | 3 | `/media*` | Backend pool pool-media |
        | 4 | `/old/*` | Redirection to the external site https://archive.contoso.com, query string included |

        The backend settings don't override the backend path, and no rewrite set is associated with rule-shop.

        Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un Application Gateway Standard_v2 nommé **AGW1** possède une règle de routage basée sur le chemin nommée **rule-shop** pour l'écouteur de www.contoso.com. Son mappage de chemins d'URL contient les règles de chemin suivantes, dans cet ordre, et son pool principal par défaut est **pool-web** :

        | Ordre | Chemin | Cible |
        | --- | --- | --- |
        | 1 | `/api/v2/*` | Pool principal pool-v2 |
        | 2 | `/api/*` | Pool principal pool-api |
        | 3 | `/media*` | Pool principal pool-media |
        | 4 | `/old/*` | Redirection vers le site externe https://archive.contoso.com, chaîne de requête incluse |

        Les paramètres de back-end ne remplacent pas le chemin de back-end, et aucun ensemble de réécriture n'est associé à rule-shop.

        Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          A request for `/API/v2/orders?id=7` is served by: [[s1]]

          The servers that serve this request receive the path: [[s2]]

          A request for `/mediakit/logo.png` is served by: [[s3]]

          A request for `/old/catalog?page=2` is redirected to: [[s4]]
        fr: |
          Une requête pour `/API/v2/orders?id=7` est servie par : [[s1]]

          Les serveurs qui servent cette requête reçoivent le chemin : [[s2]]

          Une requête pour `/mediakit/logo.png` est servie par : [[s3]]

          Une requête pour `/old/catalog?page=2` est redirigée vers : [[s4]]
      slots:
        - id: s1
          options:
            - { id: v2, text: pool-v2 }
            - { id: api, text: pool-api }
            - { id: web, text: pool-web }
        - id: s2
          options:
            - { id: orders, text: "`/orders`" }
            - { id: full, text: "`/API/v2/orders`" }
            - { id: v2orders, text: "`/v2/orders`" }
        - id: s3
          options:
            - { id: web, text: pool-web }
            - { id: media, text: pool-media }
            - { id: api, text: pool-api }
        - id: s4
          options:
            - { id: pathquery, text: { en: "archive.contoso.com, with the path and the query string", fr: "archive.contoso.com, avec le chemin et la chaîne de requête" } }
            - { id: pathonly, text: { en: "archive.contoso.com, with the path but without the query string", fr: "archive.contoso.com, avec le chemin mais sans la chaîne de requête" } }
            - { id: queryonly, text: { en: "archive.contoso.com, with the query string but without the path", fr: "archive.contoso.com, avec la chaîne de requête mais sans le chemin" } }
    answer:
      values: { s1: v2, s2: full, s3: media, s4: queryonly }
    explanation:
      correct:
        en: |
          Path rules are case-insensitive and only see the path, not the query string, so `/API/v2/orders?id=7` matches `/api/v2/*`, listed first. The full original path is forwarded to the backend unless an override backend path or a URL rewrite is configured. `/media*` has no slash before the asterisk and matches any path that starts with `/media`, including `/mediakit/logo.png`. A redirection to an external site can include the query string but never forwards the path.
        fr: |
          Les règles de chemin sont insensibles à la casse et ne voient que le chemin, pas la chaîne de requête : `/API/v2/orders?id=7` correspond donc à `/api/v2/*`, listé en premier. Le chemin d'origine complet est transmis au back-end, sauf si un remplacement du chemin de back-end ou une réécriture d'URL est configuré. `/media*` n'a pas de barre oblique avant l'astérisque et correspond à tout chemin qui commence par `/media`, dont `/mediakit/logo.png`. Une redirection vers un site externe peut inclure la chaîne de requête mais ne transmet jamais le chemin.
      options:
        api: { en: "pool-api would only receive the request if `/api/*` were listed before `/api/v2/*`.", fr: "pool-api ne recevrait la requête que si `/api/*` était listé avant `/api/v2/*`." }
        orders: { en: "The gateway doesn't strip the matched prefix; it forwards the full path.", fr: "La passerelle ne retire pas le préfixe correspondant ; elle transmet le chemin complet." }
        pathquery: { en: "Only a redirection to a listener can include the path; an external site redirection can't.", fr: "Seule une redirection vers un écouteur peut inclure le chemin ; une redirection vers un site externe ne le peut pas." }
    references:
      - title: URL Path Based Routing overview
        url: https://learn.microsoft.com/en-us/azure/application-gateway/url-route-overview
      - title: Application Gateway request routing rules
        url: https://learn.microsoft.com/en-us/azure/application-gateway/configuration-request-routing-rules

  # ------------------------------------------------------------------ 9
  - id: az700-qz-34-09
    objective: "3.2.8"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Northwind publishes **www.northwind.com** through an HTTPS listener of an Application Gateway Standard_v2 named **AGW1**. The backend pool contains an App Service app named **nw-web**, addressed by its FQDN nw-web.azurewebsites.net. No custom domain is configured on nw-web.

        nw-web issues host-bound cookies and absolute redirect URLs, which must contain www.northwind.com. You have the following requirements:

        - The traffic between AGW1 and nw-web must be encrypted.
        - nw-web must receive the host name www.northwind.com in the Host header.
        - No rewrite set must be used.

        A custom health probe that uses the host name www.northwind.com already exists.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind publie **www.northwind.com** au moyen d'un écouteur HTTPS d'un Application Gateway Standard_v2 nommé **AGW1**. Le pool principal contient une application App Service nommée **nw-web**, désignée par son FQDN nw-web.azurewebsites.net. Aucun domaine personnalisé n'est configuré sur nw-web.

        nw-web émet des cookies liés au nom d'hôte et des URL de redirection absolues, qui doivent contenir www.northwind.com. Vous avez les exigences suivantes :

        - Le trafic entre AGW1 et nw-web doit être chiffré.
        - nw-web doit recevoir le nom d'hôte www.northwind.com dans l'en-tête Host.
        - Aucun ensemble de réécriture ne doit être utilisé.

        Une sonde d'intégrité personnalisée qui utilise le nom d'hôte www.northwind.com existe déjà.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Set the backend settings to HTTPS and enable Pick host name from backend target.", fr: "Régler les paramètres de back-end sur HTTPS et activer Pick host name from backend target." } }
        - { id: b, text: { en: "Add www.northwind.com as a custom domain of nw-web, with a TLS/SSL binding for this name.", fr: "Ajouter www.northwind.com comme domaine personnalisé de nw-web, avec une liaison TLS/SSL pour ce nom." } }
        - { id: c, text: { en: "Upload the root certificate of the App Service CA as a trusted root certificate of the backend settings.", fr: "Charger le certificat racine de l'autorité d'App Service comme certificat racine approuvé des paramètres de back-end." } }
        - { id: d, text: { en: "Set the backend settings to HTTPS and keep the host name of the request, without any host name override.", fr: "Régler les paramètres de back-end sur HTTPS et conserver le nom d'hôte de la requête, sans remplacement du nom d'hôte." } }
        - { id: e, text: { en: "Enable the dedicated backend connection in the backend settings of the routing rule.", fr: "Activer la connexion de back-end dédiée dans les paramètres de back-end de la règle de routage." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Keeping the original host name end to end is the recommended design: HTTPS backend settings that don't override the host name forward www.northwind.com in the Host header and as the SNI. App Service only answers on the host names it knows, so www.northwind.com must be added to nw-web as a custom domain, with a TLS binding whose certificate matches that name.
        fr: |
          Conserver le nom d'hôte d'origine de bout en bout est la conception recommandée : des paramètres de back-end HTTPS sans remplacement du nom d'hôte transmettent www.northwind.com dans l'en-tête Host et comme SNI. App Service ne répond que sur les noms d'hôte qu'il connaît : www.northwind.com doit donc être ajouté à nw-web comme domaine personnalisé, avec une liaison TLS dont le certificat correspond à ce nom.
      options:
        a: { en: "Pick host name from backend target sends nw-web.azurewebsites.net in the Host header, which breaks the cookies and redirects.", fr: "Pick host name from backend target envoie nw-web.azurewebsites.net dans l'en-tête Host, ce qui casse les cookies et les redirections." }
        c: { en: "App Service presents certificates that v2 already trusts; a trusted root certificate is only needed for private or self-signed CAs.", fr: "App Service présente des certificats que la v2 approuve déjà ; un certificat racine approuvé ne sert que pour les autorités privées ou auto-signées." }
        e: { en: "A dedicated backend connection is for NTLM or Kerberos passthrough; it doesn't change the Host header.", fr: "La connexion de back-end dédiée sert au passage de NTLM ou Kerberos ; elle ne change pas l'en-tête Host." }
    references:
      - title: Application Gateway backend settings configuration
        url: https://learn.microsoft.com/en-us/azure/application-gateway/configuration-http-settings
      - title: Overview of TLS termination and end to end TLS with Application Gateway
        url: https://learn.microsoft.com/en-us/azure/application-gateway/ssl-overview

  # ------------------------------------------------------------------ 10
  - id: az700-qz-34-10
    objective: "3.2.10"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware publishes a product catalog through an Application Gateway Standard_v2 named **AGW1**. A basic routing rule sends all the requests of the listener to a backend pool named **pool-catalog**.

        Clients use friendly URLs such as `/products/1234`, where 1234 is any product number. The application on pool-catalog only serves URLs such as `/item.aspx?id=1234`. The URL shown in the browser must not change.

        You add a rewrite rule with the action type **URL rewrite** to a rewrite set associated with the routing rule. How should you complete the rewrite rule?

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware publie un catalogue de produits au moyen d'un Application Gateway Standard_v2 nommé **AGW1**. Une règle de routage de base envoie toutes les requêtes de l'écouteur à un pool principal nommé **pool-catalog**.

        Les clients utilisent des URL simplifiées comme `/products/1234`, où 1234 est un numéro de produit quelconque. L'application de pool-catalog ne sert que des URL comme `/item.aspx?id=1234`. L'URL affichée dans le navigateur ne doit pas changer.

        Vous ajoutez une règle de réécriture avec le type d'action **URL rewrite** à un ensemble de réécriture associé à la règle de routage. Comment devez-vous compléter la règle de réécriture ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Condition: type of variable to check: Server variable; server variable: [[var]]; operator: equal (=)

          Pattern to match: [[pattern]]

          Action: URL path: `/item.aspx`; URL query string: [[query]]
        fr: |
          Condition : type de variable à vérifier : variable de serveur ; variable de serveur : [[var]] ; opérateur : égal (=)

          Modèle à faire correspondre : [[pattern]]

          Action : chemin d'URL : `/item.aspx` ; chaîne de requête d'URL : [[query]]
      slots:
        - id: var
          options:
            - { id: qs, text: query_string }
            - { id: path, text: uri_path }
            - { id: host, text: host }
        - id: pattern
          options:
            - { id: nocapture, text: "`^/products/[0-9]+$`" }
            - { id: target, text: "`^/item.aspx\\?id=([0-9]+)$`" }
            - { id: capture, text: "`^/products/([0-9]+)$`" }
        - id: query
          options:
            - { id: whole, text: "`id={var_uri_path}`" }
            - { id: group, text: "`id={var_uri_path_1}`" }
            - { id: reqprefix, text: "`id={http_req_uri_path_1}`" }
            - { id: qsgroup, text: "`id={var_query_string_1}`" }
    answer:
      values: { var: path, pattern: capture, query: group }
    explanation:
      correct:
        en: |
          The product number is in the path of the request, so the condition tests the `uri_path` server variable, which holds the original path. The pattern must capture the number in parentheses, and `{var_uri_path_1}` returns the first capture group of that server variable. The URL rewrite sends `/item.aspx?id=1234` to the backend while the browser keeps `/products/1234`.
        fr: |
          Le numéro de produit se trouve dans le chemin de la requête : la condition teste donc la variable de serveur `uri_path`, qui contient le chemin d'origine. Le modèle doit capturer le numéro entre parenthèses, et `{var_uri_path_1}` renvoie le premier groupe de capture de cette variable de serveur. La réécriture d'URL envoie `/item.aspx?id=1234` au back-end, tandis que le navigateur conserve `/products/1234`.
      options:
        qs: { en: "The client requests have no query string, so query_string holds nothing to capture.", fr: "Les requêtes des clients n'ont pas de chaîne de requête : query_string ne contient rien à capturer." }
        nocapture: { en: "Without parentheses, the pattern matches but stores no capture group to reuse in the action.", fr: "Sans parenthèses, le modèle correspond mais ne stocke aucun groupe de capture à réutiliser dans l'action." }
        target: { en: "The condition is evaluated on the original request, which never contains /item.aspx.", fr: "La condition est évaluée sur la requête d'origine, qui ne contient jamais /item.aspx." }
        whole: { en: "Without a group number, the variable returns the whole path, giving id=/products/1234.", fr: "Sans numéro de groupe, la variable renvoie tout le chemin, ce qui donne id=/products/1234." }
        reqprefix: { en: "The http_req_ prefix is for request headers; server variable captures use var_.", fr: "Le préfixe http_req_ concerne les en-têtes de requête ; les captures de variables de serveur utilisent var_." }
    references:
      - title: Rewrite HTTP headers and URL with Application Gateway
        url: https://learn.microsoft.com/en-us/azure/application-gateway/rewrite-http-headers-url
