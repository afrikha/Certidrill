chapter: 31-load-balancer-design
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-31-01
    objective: "3.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has a public Standard load balancer named **LB1** whose backend pool contains VM1, VM2 and VM3. Administrators must open an RDP session to VM2 only, by connecting to the frontend IP address of LB1 on TCP port 50002.

        Which LB1 component should you configure?
      fr: |
        Contoso dispose d'un équilibreur de charge public Standard nommé **LB1** dont le pool principal contient VM1, VM2 et VM3. Les administrateurs doivent ouvrir une session RDP vers VM2 uniquement, en se connectant à l'adresse IP frontale de LB1 sur le port TCP 50002.

        Quel composant de LB1 devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "A load-balancing rule", fr: "Une règle d'équilibrage de charge" } }
        - { id: b, text: { en: "An outbound rule", fr: "Une règle de trafic sortant" } }
        - { id: c, text: { en: "An inbound NAT rule", fr: "Une règle NAT entrante" } }
        - { id: d, text: { en: "A health probe", fr: "Une sonde d'intégrité" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          An inbound NAT rule forwards the traffic that arrives on a frontend IP address and port to one specific instance of the backend pool. Mapping port 50002 of the frontend to port 3389 of VM2 gives the administrators port forwarding to that VM only.
        fr: |
          Une règle NAT entrante transfère le trafic qui arrive sur une adresse IP et un port frontaux vers une instance précise du pool principal. Associer le port 50002 de la configuration frontale au port 3389 de VM2 offre aux administrateurs un réacheminement de port vers cette seule VM.
      options:
        a: { en: "A load-balancing rule spreads the flows across all the healthy instances of the pool, not to VM2 only.", fr: "Une règle d'équilibrage de charge répartit les flux entre toutes les instances saines du pool, pas vers VM2 seule." }
        b: { en: "An outbound rule configures the SNAT of the backend instances for their outbound connections.", fr: "Une règle de trafic sortant configure la SNAT des instances du back-end pour leurs connexions sortantes." }
        d: { en: "A health probe decides which instances receive new flows; it doesn't forward any port.", fr: "Une sonde d'intégrité décide des instances qui reçoivent les nouveaux flux ; elle ne transfère aucun port." }
    references:
      - title: Azure Load Balancer components
        url: https://learn.microsoft.com/en-us/azure/load-balancer/components

  # ------------------------------------------------------------------ 2
  - id: az700-qz-31-02
    objective: "3.1.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam deploys an internal Standard load balancer named **ILB1** in a hub virtual network named **VNet-Hub**. VNet-Hub is peered with several spoke virtual networks, and an on-premises network connects to VNet-Hub through an ExpressRoute gateway.

        From where can clients reach the frontend of ILB1?
      fr: |
        Fabrikam déploie un équilibreur de charge interne Standard nommé **ILB1** dans un réseau virtuel hub nommé **VNet-Hub**. VNet-Hub est relié par peering à plusieurs réseaux virtuels spokes, et un réseau local se connecte à VNet-Hub par une passerelle ExpressRoute.

        D'où les clients peuvent-ils joindre la configuration frontale d'ILB1 ?
    body:
      options:
        - { id: a, text: { en: "Only from the virtual machines in the subnet of the frontend IP address", fr: "Uniquement depuis les machines virtuelles du sous-réseau de l'adresse IP frontale" } }
        - { id: b, text: { en: "From VNet-Hub, the peered virtual networks, the on-premises network and the internet", fr: "Depuis VNet-Hub, les réseaux virtuels reliés par peering, le réseau local et Internet" } }
        - { id: c, text: { en: "From VNet-Hub only, because peerings and gateways don't carry load-balanced traffic", fr: "Depuis VNet-Hub uniquement, car les peerings et les passerelles ne transportent pas le trafic équilibré" } }
        - { id: d, text: { en: "From VNet-Hub, the peered virtual networks and the on-premises network", fr: "Depuis VNet-Hub, les réseaux virtuels reliés par peering et le réseau local" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          An internal load balancer has a private frontend IP address. It is reachable from its virtual network, from peered virtual networks (global peering included for the Standard SKU) and from on-premises networks connected through a VPN or ExpressRoute gateway, but never from the internet.
        fr: |
          Un équilibreur de charge interne a une adresse IP frontale privée. Il est joignable depuis son réseau virtuel, depuis les réseaux virtuels reliés par peering (peering global compris pour la référence SKU Standard) et depuis les réseaux locaux connectés par une passerelle VPN ou ExpressRoute, mais jamais depuis Internet.
      options:
        a: { en: "The frontend is reachable from any subnet of the virtual network, not only from its own subnet.", fr: "La configuration frontale est joignable depuis n'importe quel sous-réseau du réseau virtuel, pas seulement depuis le sien." }
        b: { en: "A private frontend IP address can't be reached from the internet; a public load balancer is needed for internet clients.", fr: "Une adresse IP frontale privée n'est pas joignable depuis Internet ; il faut un équilibreur de charge public pour les clients Internet." }
        c: { en: "Peered virtual networks and on-premises networks behind a gateway can reach a Standard internal load balancer.", fr: "Les réseaux virtuels reliés par peering et les réseaux locaux derrière une passerelle peuvent joindre un équilibreur de charge interne Standard." }
    references:
      - title: What is Azure Load Balancer?
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-overview
      - title: Azure Load Balancer SKUs
        url: https://learn.microsoft.com/en-us/azure/load-balancer/skus

  # ------------------------------------------------------------------ 3
  - id: az700-qz-31-03
    objective: "3.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has an internal Standard load balancer named **ILB1**. A load-balancing rule for TCP port 8443 uses an HTTP health probe, and the backend pool contains VM1, VM2 and VM3.

        You must install an update on VM2. During the maintenance window, the application on VM2 keeps running and keeps answering the health probe. VM2 must stop receiving new connections, its established TCP connections must be allowed to finish, and VM2 must stay in the backend pool.

        What should you do?
      fr: |
        Adatum dispose d'un équilibreur de charge interne Standard nommé **ILB1**. Une règle d'équilibrage de charge pour le port TCP 8443 utilise une sonde d'intégrité HTTP, et le pool principal contient VM1, VM2 et VM3.

        Vous devez installer une mise à jour sur VM2. Pendant la fenêtre de maintenance, l'application de VM2 continue de fonctionner et de répondre à la sonde d'intégrité. VM2 ne doit plus recevoir de nouvelles connexions, ses connexions TCP établies doivent pouvoir se terminer, et VM2 doit rester dans le pool principal.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set the admin state of VM2 to Up in the backend pool.", fr: "Définir l'état administratif de VM2 sur Up dans le pool principal." } }
        - { id: b, text: { en: "Set the admin state of VM2 to Down in the backend pool.", fr: "Définir l'état administratif de VM2 sur Down dans le pool principal." } }
        - { id: c, text: { en: "Set the admin state of VM2 to None in the backend pool.", fr: "Définir l'état administratif de VM2 sur None dans le pool principal." } }
        - { id: d, text: { en: "Create an inbound NAT rule for VM2, and set its admin state to Down.", fr: "Créer une règle NAT entrante pour VM2, puis définir son état administratif sur Down." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Admin state overrides the health probe for one backend pool instance. With Down, the load balancer sends no new connections to VM2 even though its probe is healthy, and the established TCP connections continue until they end. The setting applies because the rule has a health probe.
        fr: |
          L'état administratif remplace la sonde d'intégrité pour une instance du pool principal. Avec Down, l'équilibreur de charge n'envoie plus de nouvelles connexions à VM2 même si sa sonde est saine, et les connexions TCP établies se poursuivent jusqu'à leur fin. Le paramètre s'applique parce que la règle a une sonde d'intégrité.
      options:
        a: { en: "Up ignores the probe and keeps VM2 eligible for new connections, the opposite of the requirement.", fr: "Up ignore la sonde et garde VM2 éligible aux nouvelles connexions, l'inverse de l'exigence." }
        c: { en: "None follows the health probe; since VM2 still answers it, VM2 keeps receiving new connections.", fr: "None suit la sonde d'intégrité ; comme VM2 y répond toujours, VM2 continue de recevoir de nouvelles connexions." }
        d: { en: "Admin state isn't supported with inbound NAT rules, and such a rule doesn't affect the load-balancing rule.", fr: "L'état administratif n'est pas pris en charge avec les règles NAT entrantes, et une telle règle n'agit pas sur la règle d'équilibrage de charge." }
    references:
      - title: Administrative State (Admin State) in Azure Load Balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/admin-state-overview

  # ------------------------------------------------------------------ 4
  - id: az700-qz-31-04
    objective: "3.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank deploys two firewall network virtual appliances (NVAs), FW1 and FW2, in a subnet of a hub virtual network. User-defined routes send the traffic of the spoke virtual networks to the hub. Both NVAs must process traffic at the same time, for every TCP and UDP port and for ICMP, and an NVA that fails must stop receiving new flows.

        What should you use as the next hop of the user-defined routes?
      fr: |
        Woodgrove Bank déploie deux appliances virtuelles réseau (NVA) de pare-feu, FW1 et FW2, dans un sous-réseau d'un réseau virtuel hub. Des itinéraires définis par l'utilisateur envoient le trafic des réseaux virtuels spokes vers le hub. Les deux NVA doivent traiter le trafic en même temps, pour tous les ports TCP et UDP et pour ICMP, et une NVA en panne ne doit plus recevoir de nouveaux flux.

        Que devez-vous utiliser comme tronçon suivant des itinéraires définis par l'utilisateur ?
    body:
      options:
        - { id: a, text: { en: "The frontend IP address of a public Standard load balancer that has an HA ports rule", fr: "L'adresse IP frontale d'un équilibreur de charge public Standard doté d'une règle de Ports HA" } }
        - { id: b, text: { en: "The frontend IP address of a Gateway Load Balancer whose backend pool contains FW1 and FW2", fr: "L'adresse IP frontale d'un équilibreur de charge de passerelle dont le pool principal contient FW1 et FW2" } }
        - { id: c, text: { en: "The frontend IP address of an internal Standard load balancer that has an HA ports rule", fr: "L'adresse IP frontale d'un équilibreur de charge interne Standard doté d'une règle de Ports HA" } }
        - { id: d, text: { en: "The frontend IP address of an internal Standard load balancer that has one rule per TCP and UDP port", fr: "L'adresse IP frontale d'un équilibreur de charge interne Standard doté d'une règle par port TCP et UDP" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          An HA ports rule (protocol All, port 0) on an internal Standard load balancer balances every TCP and UDP flow on every port, and it also carries ICMP. The NVAs in the backend pool work active-active, the health probe removes a failed NVA from rotation, and the frontend private IP address is the next hop of the user-defined routes.
        fr: |
          Une règle de Ports HA (protocole All, port 0) sur un équilibreur de charge interne Standard équilibre tous les flux TCP et UDP sur tous les ports, et transporte aussi ICMP. Les NVA du pool principal fonctionnent en actif-actif, la sonde d'intégrité retire de la rotation une NVA en panne, et l'adresse IP privée frontale sert de tronçon suivant aux itinéraires définis par l'utilisateur.
      options:
        a: { en: "HA ports rules exist only on internal Standard load balancers, and a public frontend isn't a valid next hop for private traffic.", fr: "Les règles de Ports HA n'existent que sur les équilibreurs de charge internes Standard, et une configuration frontale publique n'est pas un tronçon suivant valable pour le trafic privé." }
        b: { en: "A Gateway Load Balancer frontend can't be the next hop of a user-defined route: it is chained to public frontends.", fr: "La configuration frontale d'un équilibreur de charge de passerelle ne peut pas être le tronçon suivant d'un itinéraire défini par l'utilisateur : elle se chaîne à des configurations frontales publiques." }
        d: { en: "Ordinary rules carry only TCP or UDP, so ICMP isn't forwarded, and covering every port exceeds the rule limits.", fr: "Les règles ordinaires ne transportent que TCP ou UDP ; ICMP n'est donc pas transféré, et couvrir tous les ports dépasse les limites de règles." }
    references:
      - title: High availability ports overview
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-ha-ports-overview
      - title: Gateway Load Balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/gateway-overview

  # ------------------------------------------------------------------ 5
  - id: az700-qz-31-05
    objective: "3.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware is creating a public Standard load balancer named **LB1** in the France Central region for a TCP service. The backend virtual machines are zonal VMs spread across zones 1, 2 and 3.

        Clients must use a single public IP address, and that address must keep receiving traffic if any one availability zone fails.

        Which availability zone setting should you use for the Standard public IP address of the frontend?
      fr: |
        Litware crée un équilibreur de charge public Standard nommé **LB1** dans la région France Central pour un service TCP. Les machines virtuelles du back-end sont des VM zonales réparties dans les zones 1, 2 et 3.

        Les clients doivent utiliser une seule adresse IP publique, et cette adresse doit continuer à recevoir du trafic en cas de panne de l'une des zones de disponibilité.

        Quel paramètre de zone de disponibilité devez-vous utiliser pour l'adresse IP publique Standard de la configuration frontale ?
    body:
      options:
        - { id: a, text: { en: "Zone-redundant", fr: "Redondant interzone" } }
        - { id: b, text: { en: "Zonal, in zone 1", fr: "Zonal, dans la zone 1" } }
        - { id: c, text: { en: "No zone", fr: "Aucune zone" } }
        - { id: d, text: { en: "Zonal, one address in each zone", fr: "Zonal, une adresse dans chaque zone" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A zone-redundant frontend is served from all the zones of the region at the same time, so a single zone failure doesn't stop it from receiving and distributing traffic. The backend zones are independent of the frontend: the load balancer sends flows to the healthy VMs of the remaining zones.
        fr: |
          Une configuration frontale redondante interzone est servie simultanément depuis toutes les zones de la région ; la panne d'une zone ne l'empêche donc pas de recevoir et de répartir le trafic. Les zones du back-end sont indépendantes de la configuration frontale : l'équilibreur de charge envoie les flux aux VM saines des zones restantes.
      options:
        b: { en: "A zonal frontend is pinned to zone 1 and fails with it, even if VMs in zones 2 and 3 are healthy.", fr: "Une configuration frontale zonale est attachée à la zone 1 et tombe avec elle, même si des VM des zones 2 et 3 sont saines." }
        c: { en: "No zone is for regions without availability zones; it gives no zone resiliency guarantee.", fr: "Aucune zone correspond aux régions sans zones de disponibilité ; elle ne garantit aucune résilience de zone." }
        d: { en: "Three zonal addresses mean three IP addresses for the clients, against the single-address requirement.", fr: "Trois adresses zonales imposent trois adresses IP aux clients, contrairement à l'exigence d'adresse unique." }
    references:
      - title: Reliability in Azure Load Balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-standard-availability-zones

  # ------------------------------------------------------------------ 6
  - id: az700-qz-31-06
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank runs an API on a single virtual machine named **VM-API** in East US. VM-API has a Standard public IP address on its network interface, and clients connect directly to that address. No load balancer is deployed.

        The security team deploys three third-party firewall appliances that support VXLAN. All inbound and outbound traffic of VM-API must be inspected by the appliances. The solution must meet the following requirements:

        - The appliances must be highly available, and the same appliance must handle both directions of a flow.
        - VM-API must see the original IP address of each client.
        - No user-defined route may be created, and the public IP address of VM-API must not change.

        What should you do?
      fr: |
        Woodgrove Bank exécute une API sur une seule machine virtuelle nommée **VM-API** en East US. VM-API possède une adresse IP publique Standard sur son interface réseau, et les clients se connectent directement à cette adresse. Aucun équilibreur de charge n'est déployé.

        L'équipe de sécurité déploie trois appliances de pare-feu tierces qui prennent en charge VXLAN. Tout le trafic entrant et sortant de VM-API doit être inspecté par les appliances. La solution doit répondre aux exigences suivantes :

        - Les appliances doivent être hautement disponibles, et la même appliance doit traiter les deux sens d'un flux.
        - VM-API doit voir l'adresse IP d'origine de chaque client.
        - Aucun itinéraire défini par l'utilisateur ne peut être créé, et l'adresse IP publique de VM-API ne doit pas changer.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Deploy an internal Standard load balancer with an HA ports rule for the appliances, and route the subnet of VM-API through its frontend.", fr: "Déployer un équilibreur de charge interne Standard avec une règle de Ports HA pour les appliances, et router le sous-réseau de VM-API par sa configuration frontale." } }
        - { id: b, text: { en: "Deploy a Gateway Load Balancer with the appliances in its backend pool, and chain it to a new internal Standard load balancer in front of VM-API.", fr: "Déployer un équilibreur de charge de passerelle avec les appliances dans son pool principal, et le chaîner à un nouvel équilibreur de charge interne Standard devant VM-API." } }
        - { id: c, text: { en: "Deploy a public Standard load balancer with the appliances in its backend pool, and forward the traffic to VM-API with inbound NAT rules.", fr: "Déployer un équilibreur de charge public Standard avec les appliances dans son pool principal, et transférer le trafic vers VM-API avec des règles NAT entrantes." } }
        - { id: d, text: { en: "Deploy a Gateway Load Balancer with the appliances in its backend pool, and chain the public IP configuration of VM-API to its frontend.", fr: "Déployer un équilibreur de charge de passerelle avec les appliances dans son pool principal, et chaîner la configuration IP publique de VM-API à sa configuration frontale." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A Gateway Load Balancer inserts appliances transparently in front of a Standard public load balancer frontend or of the Standard public IP configuration of a VM. Once chained, traffic in both directions goes through the same appliance over VXLAN without any user-defined route, the client IP address is preserved, and VM-API keeps its public IP address.
        fr: |
          Un équilibreur de charge de passerelle insère des appliances de façon transparente devant la configuration frontale d'un équilibreur de charge public Standard ou devant la configuration IP publique Standard d'une VM. Une fois le chaînage effectué, le trafic des deux sens passe par la même appliance en VXLAN sans aucun itinéraire défini par l'utilisateur, l'adresse IP du client est préservée et VM-API garde son adresse IP publique.
      options:
        a: { en: "This design depends on user-defined routes, which the requirements forbid.", fr: "Cette conception repose sur des itinéraires définis par l'utilisateur, que les exigences interdisent." }
        b: { en: "A Gateway Load Balancer chains only to a public frontend or a VM public IP configuration, not to an internal load balancer.", fr: "Un équilibreur de charge de passerelle ne se chaîne qu'à une configuration frontale publique ou à la configuration IP publique d'une VM, pas à un équilibreur de charge interne." }
        c: { en: "Clients would connect to a new public IP address, and the appliances would have to translate the traffic instead of inspecting it transparently.", fr: "Les clients se connecteraient à une nouvelle adresse IP publique, et les appliances devraient traduire le trafic au lieu de l'inspecter de façon transparente." }
    references:
      - title: Gateway Load Balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/gateway-overview

  # ------------------------------------------------------------------ 7
  - id: az700-qz-31-07
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso runs an order service on TCP port 7000 on four virtual machines in a virtual network named **VNet1**. The virtual machines are in one availability set and are added to backend pools by network interface. They are already in the backend pool of an internal Standard load balancer named **ILB-Mgmt**, which balances a management service on TCP port 9000.

        The order service must meet the following requirements:

        - Partners connect from the internet to a single public IP address.
        - Contoso offices connect through ExpressRoute private peering. Their traffic must use a private IP address and must not be exposed to the internet.
        - Both groups of clients must be distributed across the healthy virtual machines.

        What should you do?
      fr: |
        Contoso exécute un service de commandes sur le port TCP 7000 sur quatre machines virtuelles d'un réseau virtuel nommé **VNet1**. Les machines virtuelles sont dans un groupe à haute disponibilité et sont ajoutées aux pools principaux par interface réseau. Elles figurent déjà dans le pool principal d'un équilibreur de charge interne Standard nommé **ILB-Mgmt**, qui équilibre un service de gestion sur le port TCP 9000.

        Le service de commandes doit répondre aux exigences suivantes :

        - Les partenaires se connectent depuis Internet à une seule adresse IP publique.
        - Les bureaux de Contoso se connectent par le peering privé ExpressRoute. Leur trafic doit utiliser une adresse IP privée et ne doit pas être exposé à Internet.
        - Les deux groupes de clients doivent être répartis entre les machines virtuelles saines.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Deploy a public Standard load balancer for the partners, and a second internal Standard load balancer with a NIC-based pool for the offices.", fr: "Déployer un équilibreur de charge public Standard pour les partenaires, et un second équilibreur de charge interne Standard avec un pool par interface réseau pour les bureaux." } }
        - { id: b, text: { en: "Deploy a public Standard load balancer for the partners, and add a rule for TCP port 7000 to ILB-Mgmt for the offices.", fr: "Déployer un équilibreur de charge public Standard pour les partenaires, et ajouter une règle pour le port TCP 7000 à ILB-Mgmt pour les bureaux." } }
        - { id: c, text: { en: "Deploy a public Standard load balancer only, and allow the partner and office public IP addresses in a network security group.", fr: "Déployer uniquement un équilibreur de charge public Standard, et autoriser les adresses IP publiques des partenaires et des bureaux dans un groupe de sécurité réseau." } }
        - { id: d, text: { en: "Deploy a global load balancer for the partners, and add ILB-Mgmt to its backend pool with a rule for TCP port 7000.", fr: "Déployer un équilibreur de charge global pour les partenaires, et ajouter ILB-Mgmt à son pool principal avec une règle pour le port TCP 7000." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Internet partners need a public load balancer, and the offices need an internal frontend reached through the ExpressRoute gateway. With NIC-based pools, an availability set can be behind only one public and one internal load balancer, so the internal part must reuse ILB-Mgmt: a new load-balancing rule for port 7000 on ILB-Mgmt serves the offices privately.
        fr: |
          Les partenaires sur Internet ont besoin d'un équilibreur de charge public, et les bureaux d'une configuration frontale interne joignable par la passerelle ExpressRoute. Avec des pools par interface réseau, un groupe à haute disponibilité ne peut se trouver derrière qu'un seul équilibreur de charge public et un seul interne ; la partie interne doit donc réutiliser ILB-Mgmt : une nouvelle règle d'équilibrage de charge pour le port 7000 sur ILB-Mgmt sert les bureaux en privé.
      options:
        a: { en: "The availability set is already behind ILB-Mgmt; a second NIC-based internal load balancer for the same availability set isn't supported.", fr: "Le groupe à haute disponibilité est déjà derrière ILB-Mgmt ; un second équilibreur de charge interne par interface réseau pour ce même groupe n'est pas pris en charge." }
        c: { en: "The offices would reach a public IP address over the internet, which violates the private-access requirement.", fr: "Les bureaux joindraient une adresse IP publique par Internet, ce qui enfreint l'exigence d'accès privé." }
        d: { en: "The backend pool of a global load balancer accepts only public regional load balancers, never an internal one.", fr: "Le pool principal d'un équilibreur de charge global n'accepte que des équilibreurs de charge régionaux publics, jamais un interne." }
    references:
      - title: Azure Load Balancer components
        url: https://learn.microsoft.com/en-us/azure/load-balancer/components
      - title: Global load balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/cross-region-overview

  # ------------------------------------------------------------------ 8
  - id: az700-qz-31-08
    objective: "3.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam is reviewing five designs proposed for workloads in a virtual network named **VNet1**. All the load balancers in the designs use the Standard SKU.

        Which two designs are supported?

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam examine cinq conceptions proposées pour des charges de travail d'un réseau virtuel nommé **VNet1**. Tous les équilibreurs de charge de ces conceptions utilisent la référence SKU Standard.

        Quelles sont les deux conceptions prises en charge ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "A public load balancer whose backend pool contains the private endpoint of an Azure SQL database", fr: "Un équilibreur de charge public dont le pool principal contient le point de terminaison privé d'une base de données Azure SQL" } }
        - { id: b, text: { en: "An internal load balancer with an HA ports rule that distributes ICMP and all TCP and UDP flows across two NVAs", fr: "Un équilibreur de charge interne avec une règle de Ports HA qui répartit ICMP et tous les flux TCP et UDP entre deux NVA" } }
        - { id: c, text: { en: "An internal load balancer whose backend pool contains VMs of VNet1 and VMs of a virtual network peered with VNet1", fr: "Un équilibreur de charge interne dont le pool principal contient des VM de VNet1 et des VM d'un réseau virtuel relié par peering à VNet1" } }
        - { id: d, text: { en: "A public load balancer that forwards fragmented UDP packets of a video service to its backend VMs", fr: "Un équilibreur de charge public qui transfère les paquets UDP fragmentés d'un service vidéo vers ses VM du back-end" } }
        - { id: e, text: { en: "An internal load balancer with a NIC-based backend pool that a Private Link service exposes to customers' private endpoints", fr: "Un équilibreur de charge interne avec un pool par interface réseau qu'un service Private Link expose aux points de terminaison privés des clients" } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          An HA ports rule is available on internal Standard load balancers and carries every TCP and UDP flow, and ICMP as well, which makes it the standard design for NVA high availability. A Private Link service is built on an internal Standard load balancer whose backend pool is NIC-based, so customers reach the VMs through their own private endpoints.
        fr: |
          Une règle de Ports HA est disponible sur les équilibreurs de charge internes Standard et transporte tous les flux TCP et UDP ainsi qu'ICMP ; c'est la conception de référence pour la haute disponibilité des NVA. Un service Private Link repose sur un équilibreur de charge interne Standard dont le pool principal est basé sur les interfaces réseau ; les clients joignent ainsi les VM par leurs propres points de terminaison privés.
      options:
        a: { en: "A backend pool can't contain a private endpoint, another load balancer or an Application Gateway.", fr: "Un pool principal ne peut contenir ni point de terminaison privé, ni autre équilibreur de charge, ni Application Gateway." }
        c: { en: "All the frontends and backend instances of a load balancer must be in one virtual network; a rule can't span two.", fr: "Toutes les configurations frontales et instances du back-end d'un équilibreur de charge doivent être dans un seul réseau virtuel ; une règle ne peut pas en couvrir deux." }
        d: { en: "Load-balancing rules don't forward IP fragments, so fragmented UDP packets aren't delivered.", fr: "Les règles d'équilibrage de charge ne transfèrent pas les fragments IP ; les paquets UDP fragmentés ne sont donc pas remis." }
    references:
      - title: Azure Load Balancer components
        url: https://learn.microsoft.com/en-us/azure/load-balancer/components
      - title: Azure Load Balancer SKUs
        url: https://learn.microsoft.com/en-us/azure/load-balancer/skus

  # ------------------------------------------------------------------ 9
  - id: az700-qz-31-09
    objective: "3.1.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin publishes a TCP application through a global load balancer named **GLB1**. GLB1 was deployed with West Europe as its home region and has an IPv4 frontend. Its backend pool contains two regional public Standard load balancers, each with a health probe on its virtual machines:

        | Load balancer | Region |
        | --- | --- |
        | LB-EU | North Europe |
        | LB-AS | Southeast Asia |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin publie une application TCP par un équilibreur de charge global nommé **GLB1**. GLB1 a été déployé avec West Europe comme région d'origine et possède une configuration frontale IPv4. Son pool principal contient deux équilibreurs de charge régionaux publics Standard, chacun avec une sonde d'intégrité sur ses machines virtuelles :

        | Équilibreur de charge | Région |
        | --- | --- |
        | LB-EU | North Europe |
        | LB-AS | Southeast Asia |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "If every virtual machine behind LB-AS fails its health probe, GLB1 sends the new flows of Asian clients to LB-EU.", fr: "Si toutes les machines virtuelles derrière LB-AS échouent à leur sonde d'intégrité, GLB1 envoie les nouveaux flux des clients asiatiques vers LB-EU." } }
        - { id: s2, text: { en: "If the West Europe region has an outage, clients can't reach the application through GLB1 until the region recovers.", fr: "Si la région West Europe subit une panne, les clients ne peuvent plus joindre l'application par GLB1 avant le rétablissement de la région." } }
        - { id: s3, text: { en: "You can add to the backend pool of GLB1 a regional public load balancer whose only frontend is an IPv6 address.", fr: "Vous pouvez ajouter au pool principal de GLB1 un équilibreur de charge régional public dont la seule configuration frontale est une adresse IPv6." } }
    answer: { values: { s1: true, s2: false, s3: false } }
    explanation:
      correct:
        en: |
          The global load balancer checks the availability of each regional load balancer every 5 seconds and takes a region at 0% availability out of rotation, so the closest healthy region, LB-EU, receives the flows. The home region only hosts the resource: it doesn't affect routing, and its failure doesn't stop traffic. NAT64 isn't supported, so the frontend and the backends must use the same IP version.
        fr: |
          L'équilibreur de charge global vérifie la disponibilité de chaque équilibreur de charge régional toutes les 5 secondes et retire de la rotation une région à 0 % de disponibilité ; la région saine la plus proche, LB-EU, reçoit donc les flux. La région d'origine ne fait qu'héberger la ressource : elle n'influe pas sur le routage, et sa panne n'arrête pas le trafic. NAT64 n'est pas pris en charge ; la configuration frontale et les back-ends doivent donc utiliser la même version d'IP.
      options:
        s2: { en: "The home region doesn't affect how traffic is routed; if it goes down, traffic flow is unaffected.", fr: "La région d'origine n'influe pas sur le routage du trafic ; si elle tombe, le flux de trafic n'est pas affecté." }
        s3: { en: "An IPv4 global frontend can't front IPv6 regional frontends: there is no NAT64 translation.", fr: "Une configuration frontale globale IPv4 ne peut pas desservir des configurations frontales régionales IPv6 : aucune traduction NAT64 n'existe." }
    references:
      - title: Global load balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/cross-region-overview

  # ------------------------------------------------------------------ 10
  - id: az700-qz-31-10
    objective: "3.1.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam runs a VoIP signaling service in the East US 2 and West Europe regions. In each region, virtual machines listen on UDP port 15060. Clients worldwide send their traffic to UDP port 5060.

        The design must meet the following requirements:

        - Clients use one static public IP address, and a regional failure must not require clients to resolve a new address.
        - In each region, a load balancer distributes the flows to the healthy virtual machines. Its load-balancing rule uses frontend port 5060 and backend port 15060.
        - The virtual machines connect outbound to SIP providers from known public IP addresses.

        How should you complete the design? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam exécute un service de signalisation VoIP dans les régions East US 2 et West Europe. Dans chaque région, des machines virtuelles écoutent sur le port UDP 15060. Les clients du monde entier envoient leur trafic au port UDP 5060.

        La conception doit répondre aux exigences suivantes :

        - Les clients utilisent une seule adresse IP publique statique, et une panne régionale ne doit pas obliger les clients à résoudre une nouvelle adresse.
        - Dans chaque région, un équilibreur de charge répartit les flux entre les machines virtuelles saines. Sa règle d'équilibrage de charge utilise le port frontal 5060 et le port de back-end 15060.
        - Les machines virtuelles se connectent en sortie à des fournisseurs SIP depuis des adresses IP publiques connues.

        Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Service that the clients connect to: [[entry]]

          Load balancer in each region: [[regional]]

          Backend port of the load-balancing rule of the service that the clients connect to: [[port]]

          Outbound connectivity of the virtual machines: [[out]]
        fr: |
          Service auquel les clients se connectent : [[entry]]

          Équilibreur de charge dans chaque région : [[regional]]

          Port de back-end de la règle d'équilibrage de charge du service auquel les clients se connectent : [[port]]

          Connectivité sortante des machines virtuelles : [[out]]
      slots:
        - id: entry
          options:
            - { id: tm, text: { en: "A Traffic Manager profile that uses the Performance routing method", fr: "Un profil Traffic Manager qui utilise la méthode de routage Performance" } }
            - { id: glb, text: { en: "A Standard load balancer of the Global tier", fr: "Un équilibreur de charge Standard du niveau Global" } }
            - { id: afd, text: { en: "An Azure Front Door Premium profile", fr: "Un profil Azure Front Door Premium" } }
        - id: regional
          options:
            - { id: int, text: { en: "An internal Standard load balancer of the Regional tier", fr: "Un équilibreur de charge interne Standard du niveau Regional" } }
            - { id: gw, text: { en: "A Gateway Load Balancer", fr: "Un équilibreur de charge de passerelle" } }
            - { id: pub, text: { en: "A public Standard load balancer of the Regional tier", fr: "Un équilibreur de charge public Standard du niveau Regional" } }
        - id: port
          options:
            - { id: p5060, text: "5060" }
            - { id: p15060, text: "15060" }
            - { id: p0, text: { en: "0 (HA ports)", fr: "0 (Ports HA)" } }
        - id: out
          options:
            - { id: glbout, text: { en: "An outbound rule on the Global tier load balancer", fr: "Une règle de trafic sortant sur l'équilibreur de charge du niveau Global" } }
            - { id: nat, text: { en: "Inbound NAT rules on each regional load balancer", fr: "Des règles NAT entrantes sur chaque équilibreur de charge régional" } }
            - { id: regout, text: { en: "Outbound rules on each regional load balancer", fr: "Des règles de trafic sortant sur chaque équilibreur de charge régional" } }
    answer: { values: { entry: glb, regional: pub, port: p5060, out: regout } }
    explanation:
      correct:
        en: |
          A Global tier load balancer gives one static anycast IP address and moves clients to the closest healthy region without any DNS change; it is layer 4 and carries UDP. Its backend pool contains public regional Standard load balancers, and the backend port of its rule must match the frontend port of the regional rules (5060), not the port of the VMs. Outbound rules aren't supported on the Global tier, so outbound SNAT is configured on the regional load balancers.
        fr: |
          Un équilibreur de charge du niveau Global offre une seule adresse IP anycast statique et dirige les clients vers la région saine la plus proche sans changement DNS ; il fonctionne en couche 4 et transporte UDP. Son pool principal contient des équilibreurs de charge régionaux publics Standard, et le port de back-end de sa règle doit correspondre au port frontal des règles régionales (5060), pas au port des VM. Les règles de trafic sortant ne sont pas prises en charge au niveau Global ; la SNAT sortante se configure donc sur les équilibreurs de charge régionaux.
      options:
        tm: { en: "Traffic Manager works through DNS: after a failure, clients must resolve and use another address.", fr: "Traffic Manager fonctionne par DNS : après une panne, les clients doivent résoudre et utiliser une autre adresse." }
        afd: { en: "Front Door is an HTTP(S) entry point and doesn't carry UDP signaling traffic.", fr: "Front Door est un point d'entrée HTTP(S) et ne transporte pas de trafic de signalisation UDP." }
        int: { en: "The backend pool of a global load balancer can't contain an internal load balancer.", fr: "Le pool principal d'un équilibreur de charge global ne peut pas contenir d'équilibreur de charge interne." }
        p15060: { en: "15060 is the VM port; the global rule targets the frontend port of the regional rules.", fr: "15060 est le port des VM ; la règle globale cible le port frontal des règles régionales." }
        glbout: { en: "Outbound rules aren't supported on a global load balancer.", fr: "Les règles de trafic sortant ne sont pas prises en charge sur un équilibreur de charge global." }
    references:
      - title: Global load balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/cross-region-overview
      - title: Outbound rules for Azure Load Balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/outbound-rules
