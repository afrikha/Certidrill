chapter: 25-virtual-wan
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-25-01
    objective: "2.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware has a virtual WAN named **VWAN1** of type Basic. VWAN1 contains a virtual hub named **Hub-WE** in West Europe and a virtual hub named **Hub-US** in East US. Each hub has a site-to-site VPN gateway. The European branch offices connect to Hub-WE, and the US branch offices connect to Hub-US.

        Which statement about this configuration is true?
      fr: |
        Litware dispose d'un WAN virtuel nommé **VWAN1** de type Basic. VWAN1 contient un hub virtuel nommé **Hub-WE** en West Europe et un hub virtuel nommé **Hub-US** en East US. Chaque hub possède une passerelle VPN de site à site. Les succursales européennes se connectent à Hub-WE, et les succursales américaines à Hub-US.

        Quelle affirmation sur cette configuration est vraie ?
    body:
      options:
        - { id: a, text: { en: "The European branch offices can reach the US branch offices through Hub-WE and Hub-US.", fr: "Les succursales européennes peuvent joindre les succursales américaines en passant par Hub-WE et Hub-US." } }
        - { id: b, text: { en: "You can add gateway scale units to each VPN gateway to raise its aggregate throughput.", fr: "Vous pouvez ajouter des unités d'échelle à chaque passerelle VPN pour augmenter son débit agrégé." } }
        - { id: c, text: { en: "The two hubs aren't meshed, so the branch offices of one hub can't reach the other hub.", fr: "Les deux hubs ne sont pas maillés, donc les succursales d'un hub ne peuvent pas joindre l'autre hub." } }
        - { id: d, text: { en: "You can add a User VPN gateway to Hub-WE for remote users without changing the WAN type.", fr: "Vous pouvez ajouter une passerelle VPN utilisateur à Hub-WE pour des utilisateurs distants sans changer le type du WAN." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          In a Basic virtual WAN, the hubs aren't meshed and there is no hub router to provide transit: each Basic hub only terminates site-to-site VPN connections. The full mesh between hubs over the Microsoft backbone, and therefore branch-to-branch traffic across hubs, requires the Standard type.
        fr: |
          Dans un WAN virtuel Basic, les hubs ne sont pas maillés et aucun routeur de hub n'assure le transit : chaque hub Basic se contente de terminer des connexions VPN de site à site. Le maillage complet entre hubs sur le réseau principal Microsoft, et donc le trafic de branche à branche entre hubs, exige le type Standard.
      options:
        a: { en: "Transit between hubs exists only in a Standard virtual WAN, whose hubs are meshed automatically.", fr: "Le transit entre hubs n'existe que dans un WAN virtuel Standard, dont les hubs sont maillés automatiquement." }
        b: { en: "A Basic virtual WAN doesn't support adjusting gateway scale units; upgrade to Standard for more throughput.", fr: "Un WAN virtuel Basic ne permet pas de modifier les unités d'échelle des passerelles ; passez à Standard pour plus de débit." }
        d: { en: "A Basic hub supports site-to-site VPN only; User VPN (point-to-site) requires a Standard virtual WAN.", fr: "Un hub Basic ne prend en charge que le VPN de site à site ; le VPN utilisateur (point à site) exige un WAN virtuel Standard." }
    references:
      - title: What is Azure Virtual WAN?
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-about
      - title: Azure Virtual WAN FAQ
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-faq

  # ------------------------------------------------------------------ 2
  - id: az700-qz-25-02
    objective: "2.4.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You are creating a virtual hub named **Hub1** in a Standard virtual WAN. On the **Basics** tab, you must enter the hub private address space.

        Which statement about the hub private address space is true?
      fr: |
        Vous créez un hub virtuel nommé **Hub1** dans un WAN virtuel Standard. Dans l'onglet **De base**, vous devez saisir l'espace d'adressage privé du hub.

        Quelle affirmation sur l'espace d'adressage privé du hub est vraie ?
    body:
      options:
        - { id: a, text: { en: "You can enlarge it later by editing the hub, for example from a /24 to a /22.", fr: "Vous pouvez l'agrandir plus tard en modifiant le hub, par exemple d'un /24 à un /22." } }
        - { id: b, text: { en: "It must contain a GatewaySubnet that you create before you add a gateway.", fr: "Il doit contenir un GatewaySubnet que vous créez avant d'ajouter une passerelle." } }
        - { id: c, text: { en: "It can overlap a connected virtual network that is in the same region as the hub.", fr: "Il peut chevaucher un réseau virtuel connecté situé dans la même région que le hub." } }
        - { id: d, text: { en: "It can't be modified after creation, so you size it for the services to come.", fr: "Il n'est plus modifiable après la création ; vous le dimensionnez donc pour les services à venir." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The hub address space can't be changed once the hub exists. The minimum is a /24, a /23 or larger is recommended, and a /22 is needed for Azure Firewall to scale, so you choose the prefix for the gateways, firewalls and NVAs that the hub may host later.
        fr: |
          L'espace d'adressage du hub ne peut plus être modifié une fois le hub créé. Le minimum est un /24, un /23 ou plus est recommandé et un /22 est nécessaire pour que Pare-feu Azure monte en charge ; vous choisissez donc le préfixe en fonction des passerelles, pare-feu et NVA que le hub pourra héberger plus tard.
      options:
        a: { en: "There is no resize operation: a larger space means a new hub.", fr: "Aucune opération de redimensionnement n'existe : un espace plus grand impose un nouveau hub." }
        b: { en: "Azure creates the subnets of the router and gateways automatically; you never create a GatewaySubnet in a hub.", fr: "Azure crée automatiquement les sous-réseaux du routeur et des passerelles ; vous ne créez jamais de GatewaySubnet dans un hub." }
        c: { en: "The hub space must not overlap other hubs, connected virtual networks or on-premises ranges, whatever the region.", fr: "L'espace du hub ne doit chevaucher ni d'autres hubs, ni les réseaux virtuels connectés, ni les plages locales, quelle que soit la région." }
    references:
      - title: About virtual hub settings
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/hub-settings

  # ------------------------------------------------------------------ 3
  - id: az700-qz-25-03
    objective: "2.4.4"
    difficulty: 2
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Woodgrove Bank has a Standard virtual WAN with a virtual hub named **Hub-Paris**. You plan to add a User VPN (point-to-site) gateway to Hub-Paris. Up to 900 employees will be connected at the same time. Each user generates little traffic, and the aggregate throughput won't exceed 400 Mbps.

        You need to configure the gateway scale units. The solution must minimize costs.

        How many gateway scale units should you configure?
      fr: |
        Woodgrove Bank dispose d'un WAN virtuel Standard avec un hub virtuel nommé **Hub-Paris**. Vous prévoyez d'ajouter une passerelle VPN utilisateur (point à site) à Hub-Paris. Jusqu'à 900 employés seront connectés simultanément. Chaque utilisateur génère peu de trafic, et le débit agrégé ne dépassera pas 400 Mbit/s.

        Vous devez configurer les unités d'échelle de la passerelle. La solution doit réduire les coûts au minimum.

        Combien d'unités d'échelle de passerelle devez-vous configurer ?
    body:
      options:
        - { id: a, text: "1" }
        - { id: b, text: "2" }
        - { id: c, text: "4" }
        - { id: d, text: "7" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A point-to-site gateway is sized by concurrent connections first: 1 to 3 scale units support 500 concurrent connections, and 4 to 6 units support 1,000. Four units are the smallest value for 900 users, and they also provide 2 Gbps, well above the 400 Mbps needed.
        fr: |
          Une passerelle point à site se dimensionne d'abord sur les connexions simultanées : de 1 à 3 unités d'échelle, elle accepte 500 connexions simultanées, et de 4 à 6 unités, 1 000. Quatre unités sont la plus petite valeur pour 900 utilisateurs, et elles offrent aussi 2 Gbit/s, bien au-delà des 400 Mbit/s nécessaires.
      options:
        a: { en: "One unit covers the 400 Mbps (0.5 Gbps) but only 500 concurrent connections.", fr: "Une unité couvre les 400 Mbit/s (0,5 Gbit/s) mais seulement 500 connexions simultanées." }
        b: { en: "Two units double the throughput, not the connections: they still support 500 concurrent users.", fr: "Deux unités doublent le débit, pas les connexions : elles n'acceptent toujours que 500 utilisateurs simultanés." }
        d: { en: "Seven units support 5,000 concurrent connections: they work but cost more than needed.", fr: "Sept unités acceptent 5 000 connexions simultanées : elles conviennent mais coûtent plus que nécessaire." }
    references:
      - title: Azure Virtual WAN FAQ
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-faq
      - title: About Virtual WAN gateway settings
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/gateway-settings

  # ------------------------------------------------------------------ 4
  - id: az700-qz-25-04
    objective: "2.4.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has a Standard virtual WAN with a virtual hub named **Hub1** that contains a site-to-site VPN gateway. A branch office in Lyon has one VPN device that is connected to the internet through two internet service providers (ISPs). Each ISP connection has its own public IP address.

        You need to connect the Lyon office to Hub1. Tunnels must be established over both ISP connections at the same time, and the loss of one ISP must not require any manual action.

        What should you do?
      fr: |
        Adatum dispose d'un WAN virtuel Standard avec un hub virtuel nommé **Hub1** qui contient une passerelle VPN de site à site. Une succursale de Lyon possède un périphérique VPN connecté à Internet par deux fournisseurs d'accès (FAI). Chaque connexion FAI a sa propre adresse IP publique.

        Vous devez connecter la succursale de Lyon à Hub1. Des tunnels doivent être établis sur les deux connexions FAI en même temps, et la perte d'un FAI ne doit exiger aucune action manuelle.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create two VPN sites that each have one link, and connect the second site to Hub1 if the first ISP fails.", fr: "Créer deux sites VPN comportant chacun un lien, puis connecter le second site à Hub1 si le premier FAI tombe en panne." } }
        - { id: b, text: { en: "Create one VPN site that has one link, and increase the VPN gateway of Hub1 to two scale units.", fr: "Créer un site VPN comportant un lien, puis passer la passerelle VPN de Hub1 à deux unités d'échelle." } }
        - { id: c, text: { en: "Create two local network gateways, one per public IP address, and connect them to the VPN gateway of Hub1.", fr: "Créer deux passerelles de réseau local, une par adresse IP publique, puis les connecter à la passerelle VPN de Hub1." } }
        - { id: d, text: { en: "Create one VPN site that has two links, one per public IP address, and connect the VPN site to Hub1.", fr: "Créer un site VPN comportant deux liens, un par adresse IP publique, puis connecter le site VPN à Hub1." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A VPN site represents one on-premises location and can have up to four links, one per physical connection or ISP. When the site is connected to the hub, each link gets its own tunnels to the active-active VPN gateway, so both ISPs are used at the same time and the loss of one link doesn't need any action.
        fr: |
          Un site VPN représente un emplacement local et peut comporter jusqu'à quatre liens, un par connexion physique ou FAI. Quand le site est connecté au hub, chaque lien obtient ses propres tunnels vers la passerelle VPN actif-actif ; les deux FAI sont donc utilisés en même temps et la perte d'un lien n'exige aucune action.
      options:
        a: { en: "Connecting the second site only after a failure is a manual action, and the two ISPs aren't used at the same time.", fr: "Connecter le second site seulement après une panne est une action manuelle, et les deux FAI ne sont pas utilisés en même temps." }
        b: { en: "Scale units add gateway throughput; they don't create a tunnel over the second ISP connection.", fr: "Les unités d'échelle ajoutent du débit à la passerelle ; elles ne créent aucun tunnel sur la seconde connexion FAI." }
        c: { en: "Local network gateways belong to VPN Gateway in a virtual network; a Virtual WAN hub uses VPN sites and their links.", fr: "Les passerelles de réseau local appartiennent à VPN Gateway dans un réseau virtuel ; un hub Virtual WAN utilise des sites VPN et leurs liens." }
    references:
      - title: Azure Virtual WAN FAQ
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-faq

  # ------------------------------------------------------------------ 5
  - id: az700-qz-25-05
    objective: "2.4.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has a Standard virtual WAN with a virtual hub named **Hub1**. The routing of Hub1 is configured as follows:

        | Connections | Associated route table | Propagating to |
        | --- | --- | --- |
        | VNet-App1, VNet-App2, VNet-App3 | RT_SHARED | Default |
        | VNet-Shared (shared services) | Default | RT_SHARED and Default |
        | Site-to-site VPN connections of the branch offices | Default | RT_SHARED and Default |

        You connect a new virtual network named **VNet-App4** to Hub1. VNet-App4 must communicate with VNet-Shared and with the branch offices, but not with VNet-App1, VNet-App2 or VNet-App3.

        How should you configure the routing of the VNet-App4 connection?
      fr: |
        Contoso dispose d'un WAN virtuel Standard avec un hub virtuel nommé **Hub1**. Le routage de Hub1 est configuré comme suit :

        | Connexions | Table de routage associée | Propagation vers |
        | --- | --- | --- |
        | VNet-App1, VNet-App2, VNet-App3 | RT_SHARED | Default |
        | VNet-Shared (services partagés) | Default | RT_SHARED et Default |
        | Connexions VPN de site à site des succursales | Default | RT_SHARED et Default |

        Vous connectez un nouveau réseau virtuel nommé **VNet-App4** à Hub1. VNet-App4 doit communiquer avec VNet-Shared et avec les succursales, mais pas avec VNet-App1, VNet-App2 ni VNet-App3.

        Comment devez-vous configurer le routage de la connexion de VNet-App4 ?
    body:
      options:
        - { id: a, text: { en: "Associate it with Default, and propagate to RT_SHARED.", fr: "L'associer à Default, et la propager vers RT_SHARED." } }
        - { id: b, text: { en: "Associate it with RT_SHARED, and propagate to Default.", fr: "L'associer à RT_SHARED, et la propager vers Default." } }
        - { id: c, text: { en: "Associate it with RT_SHARED, and propagate to RT_SHARED and Default.", fr: "L'associer à RT_SHARED, et la propager vers RT_SHARED et Default." } }
        - { id: d, text: { en: "Associate it with Default, and propagate to Default.", fr: "L'associer à Default, et la propager vers Default." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          VNet-App4 must be configured like the other isolated virtual networks. Associated with RT_SHARED, it forwards traffic only to the prefixes of that table: the shared services and the branches. Propagating only to Default lets VNet-Shared and the branches, which use Default, learn its prefix, while the other application networks, which use RT_SHARED, never learn it.
        fr: |
          VNet-App4 doit être configuré comme les autres réseaux virtuels isolés. Associé à RT_SHARED, il n'achemine le trafic que vers les préfixes de cette table : les services partagés et les succursales. En se propageant uniquement vers Default, son préfixe est appris par VNet-Shared et les succursales, qui utilisent Default, et jamais par les autres réseaux d'application, qui utilisent RT_SHARED.
      options:
        a: { en: "Associated with Default, VNet-App4 learns the prefixes of every application network, and propagating to RT_SHARED advertises it to them.", fr: "Associé à Default, VNet-App4 apprend les préfixes de tous les réseaux d'application, et la propagation vers RT_SHARED le leur publie." }
        c: { en: "Propagating to RT_SHARED puts the VNet-App4 prefix in the table used by the other application networks, so they can reach it.", fr: "La propagation vers RT_SHARED place le préfixe de VNet-App4 dans la table utilisée par les autres réseaux d'application, qui peuvent alors le joindre." }
        d: { en: "Default contains the prefixes of VNet-App1 to VNet-App3, so VNet-App4 would route traffic to them.", fr: "Default contient les préfixes de VNet-App1 à VNet-App3 ; VNet-App4 acheminerait donc du trafic vers eux." }
    references:
      - title: "Scenario: Route to shared services VNets"
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/scenario-shared-services-vnet
      - title: About virtual hub routing
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/about-virtual-hub-routing

  # ------------------------------------------------------------------ 6
  - id: az700-qz-25-06
    objective: "2.4.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has a Standard virtual WAN named **VWAN1** with two virtual hubs: **Hub-EU** in West Europe and **Hub-US** in East US. Fabrikam has 3,000 remote employees in Europe and North America who use the Azure VPN Client. Users authenticate against an on-premises RADIUS server that both hubs can reach.

        You need to design remote access. The solution must meet the following requirements:

        - All users must import the same VPN client profile.
        - Each user must connect to the hub that is closest to their location.
        - Authentication must succeed whichever hub a user connects to.

        What should you include in the design?
      fr: |
        Fabrikam dispose d'un WAN virtuel Standard nommé **VWAN1** avec deux hubs virtuels : **Hub-EU** en West Europe et **Hub-US** en East US. Fabrikam compte 3 000 employés distants en Europe et en Amérique du Nord qui utilisent Azure VPN Client. Les utilisateurs s'authentifient auprès d'un serveur RADIUS local que les deux hubs peuvent joindre.

        Vous devez concevoir l'accès distant. La solution doit répondre aux exigences suivantes :

        - Tous les utilisateurs doivent importer le même profil client VPN.
        - Chaque utilisateur doit se connecter au hub le plus proche de lui.
        - L'authentification doit réussir quel que soit le hub auquel l'utilisateur se connecte.

        Que devez-vous inclure dans la conception ?
    body:
      options:
        - { id: a, text: { en: "A point-to-site gateway in each hub; turn on Use Remote/On-premises RADIUS server on the Hub-EU gateway only, and distribute the global profile.", fr: "Une passerelle point à site dans chaque hub ; activer Use Remote/On-premises RADIUS server sur la seule passerelle de Hub-EU, et distribuer le profil global." } }
        - { id: b, text: { en: "A point-to-site gateway in each hub; turn on Use Remote/On-premises RADIUS server on both gateways, and distribute the Hub-EU profile.", fr: "Une passerelle point à site dans chaque hub ; activer Use Remote/On-premises RADIUS server sur les deux passerelles, et distribuer le profil de Hub-EU." } }
        - { id: c, text: { en: "A point-to-site gateway in each hub; turn on Use Remote/On-premises RADIUS server on both gateways, and distribute the global profile.", fr: "Une passerelle point à site dans chaque hub ; activer Use Remote/On-premises RADIUS server sur les deux passerelles, et distribuer le profil global." } }
        - { id: d, text: { en: "A point-to-site gateway in Hub-EU sized for 3,000 users; turn on Use Remote/On-premises RADIUS server, and distribute the global profile.", fr: "Une passerelle point à site dans Hub-EU dimensionnée pour 3 000 utilisateurs ; activer Use Remote/On-premises RADIUS server, et distribuer le profil global." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          For multi-region resiliency, users connect to several hubs, and the global (WAN-level) profile sends each user to the closest available hub that uses the User VPN configuration. With RADIUS and the global profile, Use Remote/On-premises RADIUS server must be on for every point-to-site gateway, and the RADIUS server must accept the proxy IP addresses of all of them, so that authentication works through either hub.
        fr: |
          Pour la résilience multirégion, les utilisateurs se connectent à plusieurs hubs, et le profil global (au niveau du WAN) dirige chaque utilisateur vers le hub disponible le plus proche qui utilise la configuration de VPN utilisateur. Avec RADIUS et le profil global, Use Remote/On-premises RADIUS server doit être activé sur toutes les passerelles point à site, et le serveur RADIUS doit accepter les adresses IP de proxy de chacune d'elles, afin que l'authentification fonctionne par l'un ou l'autre hub.
      options:
        a: { en: "US users directed to Hub-US by the global profile would fail authentication, because the setting must be on for every gateway that uses the configuration.", fr: "Les utilisateurs américains dirigés vers Hub-US par le profil global échoueraient à s'authentifier, car le paramètre doit être activé sur chaque passerelle qui utilise la configuration." }
        b: { en: "A hub profile connects users only to that hub: US users would always connect to Hub-EU.", fr: "Un profil de hub ne connecte les utilisateurs qu'à ce hub : les utilisateurs américains se connecteraient toujours à Hub-EU." }
        d: { en: "With a single gateway in Hub-EU, US users can't connect to the hub closest to them.", fr: "Avec une seule passerelle dans Hub-EU, les utilisateurs américains ne peuvent pas se connecter au hub le plus proche d'eux." }
    references:
      - title: Download global and hub VPN profiles for User VPN clients
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/global-hub-profile

  # ------------------------------------------------------------------ 7
  - id: az700-qz-25-07
    objective: "2.4.4"
    difficulty: 3
    status: draft
    type: dropdown
    shuffle: false
    stem:
      en: |
        Tailspin has a Standard virtual WAN. You are deploying a virtual hub named **Hub-NE** in North Europe. Hub-NE must meet the following requirements:

        - The spoke virtual networks connected to Hub-NE will contain up to 5,000 virtual machines, and the traffic between the spokes through the hub router will reach 12 Gbps.
        - An ExpressRoute gateway must support an aggregate throughput of 9 Gbps for two ExpressRoute circuits.
        - A User VPN (point-to-site) gateway must support up to 600 concurrent users with an aggregate throughput of 3 Gbps.

        You need to configure the capacity settings. The solution must minimize costs.

        What should you configure? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin dispose d'un WAN virtuel Standard. Vous déployez un hub virtuel nommé **Hub-NE** en North Europe. Hub-NE doit répondre aux exigences suivantes :

        - Les réseaux virtuels spokes connectés à Hub-NE contiendront jusqu'à 5 000 machines virtuelles, et le trafic entre spokes via le routeur de hub atteindra 12 Gbit/s.
        - Une passerelle ExpressRoute doit prendre en charge un débit agrégé de 9 Gbit/s pour deux circuits ExpressRoute.
        - Une passerelle VPN utilisateur (point à site) doit prendre en charge jusqu'à 600 utilisateurs simultanés avec un débit agrégé de 3 Gbit/s.

        Vous devez configurer les paramètres de capacité. La solution doit réduire les coûts au minimum.

        Que devez-vous configurer ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Virtual hub capacity: [[riu]] routing infrastructure units

          ExpressRoute gateway: [[er]] scale units

          User VPN (point-to-site) gateway: [[p2s]] scale units
        fr: |
          Capacité du hub virtuel : [[riu]] unités d'infrastructure de routage

          Passerelle ExpressRoute : [[er]] unités d'échelle

          Passerelle VPN utilisateur (point à site) : [[p2s]] unités d'échelle
      slots:
        - id: riu
          options:
            - { id: r5, text: "5" }
            - { id: r7, text: "7" }
            - { id: r10, text: "10" }
            - { id: r12, text: "12" }
        - id: er
          options:
            - { id: e4, text: "4" }
            - { id: e5, text: "5" }
            - { id: e9, text: "9" }
            - { id: e10, text: "10" }
        - id: p2s
          options:
            - { id: p2, text: "2" }
            - { id: p4, text: "4" }
            - { id: p6, text: "6" }
            - { id: p7, text: "7" }
    answer: { values: { riu: r12, er: e5, p2s: p6 } }
    explanation:
      correct:
        en: |
          Each routing infrastructure unit above the default of 2 adds about 1 Gbps and 1,000 VMs: 5,000 VMs would need 5 units, but 12 Gbps of VNet-to-VNet traffic needs 12, so throughput decides. An ExpressRoute scale unit provides 2 Gbps, so 9 Gbps needs 5 units (10 Gbps). For point-to-site, 600 users need 4 units (1,000 connections) but only 2 Gbps; 3 Gbps needs 6 units, which still support 1,000 connections.
        fr: |
          Chaque unité d'infrastructure de routage au-delà des 2 par défaut ajoute environ 1 Gbit/s et 1 000 VM : 5 000 VM demanderaient 5 unités, mais 12 Gbit/s de trafic entre réseaux virtuels en demandent 12 ; c'est donc le débit qui décide. Une unité d'échelle ExpressRoute fournit 2 Gbit/s, donc 9 Gbit/s demandent 5 unités (10 Gbit/s). En point à site, 600 utilisateurs demandent 4 unités (1 000 connexions) mais seulement 2 Gbit/s ; 3 Gbit/s demandent 6 unités, qui acceptent toujours 1 000 connexions.
      options:
        r5: { en: "Five units support 5,000 VMs but only about 5 Gbps of hub router throughput.", fr: "Cinq unités acceptent 5 000 VM mais seulement environ 5 Gbit/s de débit de routeur de hub." }
        e4: { en: "Four ExpressRoute scale units provide 8 Gbps, below the 9 Gbps required.", fr: "Quatre unités d'échelle ExpressRoute fournissent 8 Gbit/s, sous les 9 Gbit/s exigés." }
        p4: { en: "Four point-to-site units cover the 600 users but provide only 2 Gbps.", fr: "Quatre unités point à site couvrent les 600 utilisateurs mais ne fournissent que 2 Gbit/s." }
        p7: { en: "Seven units provide 3.5 Gbps and 5,000 connections: more than needed, at a higher cost.", fr: "Sept unités fournissent 3,5 Gbit/s et 5 000 connexions : plus que nécessaire, pour un coût supérieur." }
    references:
      - title: About virtual hub settings
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/hub-settings
      - title: Azure Virtual WAN FAQ
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-faq

  # ------------------------------------------------------------------ 8
  - id: az700-qz-25-08
    objective: "2.4.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders has a Standard virtual WAN with the following virtual hubs:

        | Hub | Region | Configuration |
        | --- | --- | --- |
        | Hub1 | West Europe | Azure Firewall, an ExpressRoute gateway, routing intent with an internet traffic routing policy whose next hop is Azure Firewall |
        | Hub2 | North Europe | A site-to-site VPN gateway, no firewall, no routing intent |

        Spoke virtual networks are connected to both hubs, and their connections keep the default settings. The ExpressRoute circuit of the Amsterdam datacenter is connected to Hub1, and its connection also keeps the default settings.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un WAN virtuel Standard avec les hubs virtuels suivants :

        | Hub | Région | Configuration |
        | --- | --- | --- |
        | Hub1 | West Europe | Pare-feu Azure, une passerelle ExpressRoute, une intention de routage avec une stratégie de routage du trafic Internet dont le tronçon suivant est Pare-feu Azure |
        | Hub2 | North Europe | Une passerelle VPN de site à site, aucun pare-feu, aucune intention de routage |

        Des réseaux virtuels spokes sont connectés aux deux hubs, et leurs connexions conservent les paramètres par défaut. Le circuit ExpressRoute du centre de données d'Amsterdam est connecté à Hub1, et sa connexion conserve elle aussi les paramètres par défaut.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The spoke virtual networks connected to Hub1 send their internet-bound traffic to the Azure Firewall of Hub1.", fr: "Les réseaux virtuels spokes connectés à Hub1 envoient leur trafic à destination d'Internet au Pare-feu Azure de Hub1." } }
        - { id: s2, text: { en: "The spoke virtual networks connected to Hub2 learn the 0.0.0.0/0 route of Hub1 and reach the internet through its Azure Firewall.", fr: "Les réseaux virtuels spokes connectés à Hub2 apprennent la route 0.0.0.0/0 de Hub1 et atteignent Internet par son Pare-feu Azure." } }
        - { id: s3, text: { en: "For the Amsterdam datacenter to send its internet-bound traffic through the Azure Firewall of Hub1, you enable Propagate default route on the ExpressRoute connection.", fr: "Pour que le centre de données d'Amsterdam envoie son trafic à destination d'Internet par le Pare-feu Azure de Hub1, vous activez Propager la route par défaut sur la connexion ExpressRoute." } }
    answer: { values: { s1: true, s2: false, s3: true } }
    explanation:
      correct:
        en: |
          With an internet routing policy, the hub advertises 0.0.0.0/0 to every connection whose default route flag is on. The flag is on by default for virtual network connections, so the Hub1 spokes use the firewall, but off by default for ExpressRoute and VPN connections, so you enable it on the Amsterdam connection. The 0.0.0.0/0 route stays in the local hub: it is never propagated to Hub2.
        fr: |
          Avec une stratégie de routage du trafic Internet, le hub publie 0.0.0.0/0 vers chaque connexion dont l'indicateur de route par défaut est activé. Cet indicateur est activé par défaut sur les connexions de réseaux virtuels, donc les spokes de Hub1 utilisent le pare-feu, mais désactivé par défaut sur les connexions ExpressRoute et VPN ; vous l'activez donc sur la connexion d'Amsterdam. La route 0.0.0.0/0 reste dans le hub local : elle n'est jamais propagée à Hub2.
      options:
        s2: { en: "All information about 0.0.0.0/0 is confined to the local hub; Hub2 doesn't learn the default route of Hub1.", fr: "Toute information sur 0.0.0.0/0 reste confinée au hub local ; Hub2 n'apprend pas la route par défaut de Hub1." }
    references:
      - title: How to configure Virtual WAN Hub routing intent and routing policies
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies
      - title: Azure Virtual WAN FAQ
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-faq

  # ------------------------------------------------------------------ 9
  - id: az700-qz-25-09
    objective: "2.4.7"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware has a Standard virtual WAN named **VWAN1** with a virtual hub named **Hub1**. Hub1 has no firewall and no routing intent. Forty branch offices connect to Hub1 by using site-to-site VPN.

        A virtual network named **VNet-FW** is connected to Hub1 and contains a firewall network virtual appliance (NVA) named **NVA1**. Several virtual networks that aren't connected to Hub1 are peered with VNet-FW. The current configuration is the following:

        - Hub1 has a BGP peer for NVA1 that uses the IP address of the NVA1 network interface and the ASN 65100.
        - NVA1 peers with both IP addresses of the hub router and advertises the prefixes of the peered virtual networks to both.
        - The VNet-FW connection is associated with a custom route table named RT_FW.
        - Branch-to-branch traffic is disabled in the configuration of VWAN1.

        The branch offices must learn the prefixes advertised by NVA1 dynamically, without static routes.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'un WAN virtuel Standard nommé **VWAN1** avec un hub virtuel nommé **Hub1**. Hub1 n'a ni pare-feu ni intention de routage. Quarante succursales se connectent à Hub1 en VPN de site à site.

        Un réseau virtuel nommé **VNet-FW** est connecté à Hub1 et contient une appliance virtuelle réseau (NVA) de pare-feu nommée **NVA1**. Plusieurs réseaux virtuels non connectés à Hub1 sont reliés à VNet-FW par peering. La configuration actuelle est la suivante :

        - Hub1 possède un pair BGP pour NVA1 qui utilise l'adresse IP de l'interface réseau de NVA1 et l'ASN 65100.
        - NVA1 établit un peering avec les deux adresses IP du routeur de hub et publie les préfixes de ces réseaux virtuels vers les deux.
        - La connexion de VNet-FW est associée à une table de routage personnalisée nommée RT_FW.
        - Le trafic de branche à branche est désactivé dans la configuration de VWAN1.

        Les succursales doivent apprendre dynamiquement les préfixes publiés par NVA1, sans routes statiques.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Change the ASN of NVA1 to 65515 so that it matches the ASN of the hub router.", fr: "Remplacer l'ASN de NVA1 par 65515 pour qu'il corresponde à l'ASN du routeur de hub." } }
        - { id: b, text: { en: "Associate the VNet-FW connection with the Default route table of Hub1.", fr: "Associer la connexion de VNet-FW à la table de routage par défaut de Hub1." } }
        - { id: c, text: { en: "Configure a private traffic routing policy on Hub1 whose next hop is NVA1.", fr: "Configurer sur Hub1 une stratégie de routage du trafic privé dont le tronçon suivant est NVA1." } }
        - { id: d, text: { en: "Enable branch-to-branch traffic in the configuration of VWAN1.", fr: "Activer le trafic de branche à branche dans la configuration de VWAN1." } }
        - { id: e, text: { en: "Add a static route to the Default route table with the VNet-FW connection as next hop.", fr: "Ajouter une route statique à la table de routage par défaut avec la connexion de VNet-FW comme tronçon suivant." } }
        - { id: f, text: { en: "Increase the virtual hub capacity of Hub1 to 4 routing infrastructure units.", fr: "Porter la capacité du hub virtuel Hub1 à 4 unités d'infrastructure de routage." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          The hub treats the connection of a BGP-peered NVA as a branch: it must be associated with the Default route table and propagate to the same tables as the VPN and ExpressRoute connections. Routes exchanged between the NVA and the VPN sites are branch-to-branch routes, so branch-to-branch traffic must be enabled in the virtual WAN configuration before the branches learn them.
        fr: |
          Le hub traite la connexion d'une NVA en peering BGP avec le hub comme une branche : elle doit être associée à la table de routage par défaut et se propager vers les mêmes tables que les connexions VPN et ExpressRoute. Les routes échangées entre la NVA et les sites VPN sont des routes de branche à branche ; le trafic de branche à branche doit donc être activé dans la configuration du WAN virtuel pour que les succursales les apprennent.
      options:
        a: { en: "65515 is reserved by Azure, and the NVA ASN must differ from the hub ASN; 65100 is already valid.", fr: "65515 est réservé par Azure, et l'ASN de la NVA doit différer de celui du hub ; 65100 est déjà valide." }
        c: { en: "Routing intent next hops are Azure Firewall, a supported NVA deployed in the hub or a SaaS solution, not an NVA in a spoke.", fr: "Le tronçon suivant de l'intention de routage est Pare-feu Azure, une NVA prise en charge déployée dans le hub ou une solution SaaS, pas une NVA dans un spoke." }
        e: { en: "A static route is excluded by the requirement, and it doesn't fix the association or branch-to-branch settings.", fr: "Une route statique est exclue par l'exigence, et elle ne corrige ni l'association ni le paramètre de branche à branche." }
        f: { en: "Hub capacity sizes VNet-to-VNet throughput and VM count; it doesn't control which routes the branches learn.", fr: "La capacité du hub dimensionne le débit entre réseaux virtuels et le nombre de VM ; elle ne décide pas des routes apprises par les succursales." }
    references:
      - title: "Scenario: BGP peering with a virtual hub"
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/scenario-bgp-peering-hub

  # ------------------------------------------------------------------ 10
  - id: az700-qz-25-10
    objective: "2.4.6"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso has a Standard virtual WAN with two virtual hubs, **Hub1** and **Hub2**. No static routes and no routing intent are configured. The hub routing preference of Hub1 is set to **AS Path**.

        Hub1 learns the following routes to on-premises prefixes:

        | Prefix | Learned from | AS path |
        | --- | --- | --- |
        | 10.30.0.0/16 | ExpressRoute connection of Hub1 | 65030 65030 65030 |
        | 10.30.0.0/16 | Site-to-site VPN connection of Hub1 | 65030 |
        | 10.40.0.0/16 | ExpressRoute connection of Hub1 | 65040 |
        | 10.40.0.0/16 | Site-to-site VPN connection of Hub1 | 65040 |
        | 10.50.0.0/16 | Hub2, from an ExpressRoute connection of Hub2 | 65520 65520 65050 |
        | 10.50.0.0/16 | Site-to-site VPN connection of Hub1 | 65050 65050 65050 65050 |

        A virtual machine in a spoke virtual network connected to Hub1 sends traffic to each prefix.

        Which path does Hub1 select for each prefix? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un WAN virtuel Standard avec deux hubs virtuels, **Hub1** et **Hub2**. Aucune route statique et aucune intention de routage ne sont configurées. La préférence de routage de hub de Hub1 est définie sur **AS Path**.

        Hub1 apprend les routes suivantes vers des préfixes locaux :

        | Préfixe | Appris depuis | Chemin d'AS |
        | --- | --- | --- |
        | 10.30.0.0/16 | Connexion ExpressRoute de Hub1 | 65030 65030 65030 |
        | 10.30.0.0/16 | Connexion VPN de site à site de Hub1 | 65030 |
        | 10.40.0.0/16 | Connexion ExpressRoute de Hub1 | 65040 |
        | 10.40.0.0/16 | Connexion VPN de site à site de Hub1 | 65040 |
        | 10.50.0.0/16 | Hub2, depuis une connexion ExpressRoute de Hub2 | 65520 65520 65050 |
        | 10.50.0.0/16 | Connexion VPN de site à site de Hub1 | 65050 65050 65050 65050 |

        Une machine virtuelle d'un réseau virtuel spoke connecté à Hub1 envoie du trafic vers chaque préfixe.

        Quel chemin Hub1 sélectionne-t-il pour chaque préfixe ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          10.30.0.0/16: [[r30]]

          10.40.0.0/16: [[r40]]

          10.50.0.0/16: [[r50]]
        fr: |
          10.30.0.0/16 : [[r30]]

          10.40.0.0/16 : [[r40]]

          10.50.0.0/16 : [[r50]]
      slots:
        - id: r30
          options:
            - { id: er, text: { en: "The ExpressRoute connection of Hub1", fr: "La connexion ExpressRoute de Hub1" } }
            - { id: vpn, text: { en: "The site-to-site VPN connection of Hub1", fr: "La connexion VPN de site à site de Hub1" } }
            - { id: ecmp, text: { en: "Both connections of Hub1 (ECMP)", fr: "Les deux connexions de Hub1 (ECMP)" } }
        - id: r40
          options:
            - { id: er, text: { en: "The ExpressRoute connection of Hub1", fr: "La connexion ExpressRoute de Hub1" } }
            - { id: vpn, text: { en: "The site-to-site VPN connection of Hub1", fr: "La connexion VPN de site à site de Hub1" } }
            - { id: ecmp, text: { en: "Both connections of Hub1 (ECMP)", fr: "Les deux connexions de Hub1 (ECMP)" } }
        - id: r50
          options:
            - { id: hub2, text: { en: "The route through Hub2", fr: "La route via Hub2" } }
            - { id: vpn, text: { en: "The site-to-site VPN connection of Hub1", fr: "La connexion VPN de site à site de Hub1" } }
            - { id: ecmp, text: { en: "Both paths (ECMP)", fr: "Les deux chemins (ECMP)" } }
    answer: { values: { r30: vpn, r40: er, r50: vpn } }
    explanation:
      correct:
        en: |
          With the AS Path preference, Hub1 first selects the shortest AS path whatever the source, so the VPN route wins for 10.30.0.0/16. For 10.40.0.0/16 the AS paths tie and both routes are local, so the next rule applies: ExpressRoute is preferred over VPN for local routes. For 10.50.0.0/16, routes learned from ExpressRoute circuits connected to a remote hub are always selected last, whatever their AS path length, so the longer local VPN route wins.
        fr: |
          Avec la préférence AS Path, Hub1 retient d'abord le chemin d'AS le plus court, quelle que soit la source ; la route VPN l'emporte donc pour 10.30.0.0/16. Pour 10.40.0.0/16, les chemins d'AS sont égaux et les deux routes sont locales ; la règle suivante s'applique : ExpressRoute est préféré au VPN pour les routes locales. Pour 10.50.0.0/16, les routes apprises de circuits ExpressRoute connectés à un hub distant sont toujours sélectionnées en dernier, quelle que soit la longueur de leur chemin d'AS ; la route VPN locale, plus longue, l'emporte donc.
      options:
        er: { en: "For 10.30.0.0/16, the ExpressRoute route has the longer AS path (3 against 1) and loses under AS Path.", fr: "Pour 10.30.0.0/16, la route ExpressRoute a le chemin d'AS le plus long (3 contre 1) et perd avec AS Path." }
        ecmp: { en: "For 10.40.0.0/16, equal AS paths don't give ECMP across ExpressRoute and VPN: the local ExpressRoute route is preferred.", fr: "Pour 10.40.0.0/16, des chemins d'AS égaux ne donnent pas d'ECMP entre ExpressRoute et VPN : la route ExpressRoute locale est préférée." }
        hub2: { en: "For 10.50.0.0/16, the shorter AS path doesn't help: remote ExpressRoute routes are always ranked last.", fr: "Pour 10.50.0.0/16, le chemin d'AS plus court n'aide pas : les routes ExpressRoute distantes sont toujours classées en dernier." }
    references:
      - title: Virtual hub routing preference
        url: https://learn.microsoft.com/en-us/azure/virtual-wan/about-virtual-hub-routing-preference
