chapter: 54-waf
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-54-01
    objective: "5.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You compare the custom rules of Azure Web Application Firewall (WAF) on Azure Front Door and on Azure Application Gateway WAF_v2.

        Which custom rule action is available on Azure Front Door but not on Application Gateway?
      fr: |
        Vous comparez les règles personnalisées d'Azure Web Application Firewall (WAF) sur Azure Front Door et sur Azure Application Gateway WAF_v2.

        Quelle action de règle personnalisée est disponible sur Azure Front Door mais pas sur Application Gateway ?
    body:
      options:
        - { id: a, text: Log }
        - { id: b, text: Allow }
        - { id: c, text: Redirect }
        - { id: d, text: Block }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          On Azure Front Door, a custom rule can redirect the matching request to the redirect URL defined in the policy settings. Custom rules on Application Gateway WAF_v2 offer Allow, Block and Log, but no Redirect action.
        fr: |
          Sur Azure Front Door, une règle personnalisée peut rediriger la requête correspondante vers l'URL de redirection définie dans les paramètres de la stratégie. Les règles personnalisées d'Application Gateway WAF_v2 proposent Allow, Block et Log, mais pas d'action Redirect.
      options:
        a: { en: "Log exists on both platforms: it records the match and lets the next rules run.", fr: "Log existe sur les deux plateformes : elle enregistre la correspondance et laisse les règles suivantes s'exécuter." }
        b: { en: "Allow exists on both platforms: it lets the request through and skips the remaining rules.", fr: "Allow existe sur les deux plateformes : elle laisse passer la requête et ignore les règles restantes." }
        d: { en: "Block exists on both platforms: it stops the request in Prevention mode.", fr: "Block existe sur les deux plateformes : elle arrête la requête en mode Prevention." }
    references:
      - title: Custom rules for Azure Web Application Firewall on Azure Front Door
        url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-custom-rules
      - title: Custom rules for Web Application Firewall v2 on Azure Application Gateway
        url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/custom-waf-rules-overview

  # ------------------------------------------------------------------ 2
  - id: az700-qz-54-02
    objective: "5.3.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum hosts an internal expense application on virtual machines in an Azure virtual network. Employees reach it only from the on-premises network over ExpressRoute. The application must never be exposed on a public endpoint.

        You need to protect the application with Microsoft-managed rules against SQL injection and cross-site scripting.

        What should you use?
      fr: |
        Adatum héberge une application interne de notes de frais sur des machines virtuelles d'un réseau virtuel Azure. Les employés n'y accèdent que depuis le réseau local par ExpressRoute. L'application ne doit jamais être exposée sur un point de terminaison public.

        Vous devez protéger l'application avec des règles managées par Microsoft contre l'injection SQL et le cross-site scripting.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "An Azure Front Door Premium profile with a WAF policy that uses the Default Rule Set", fr: "Un profil Azure Front Door Premium avec une stratégie WAF qui utilise le Default Rule Set" } }
        - { id: b, text: { en: "An Application Gateway WAF_v2 with a listener on its private frontend IP address and a WAF policy", fr: "Une passerelle Application Gateway WAF_v2 avec un écouteur sur son adresse IP frontale privée et une stratégie WAF" } }
        - { id: c, text: { en: "An Azure Front Door Standard profile with a WAF policy that contains custom rules", fr: "Un profil Azure Front Door Standard avec une stratégie WAF qui contient des règles personnalisées" } }
        - { id: d, text: { en: "An Azure Firewall Premium with IDPS in Alert and deny mode in front of the subnet", fr: "Un Pare-feu Azure Premium avec l'IDPS en mode Alerte et refus devant le sous-réseau" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Application Gateway is deployed inside the virtual network and can expose a listener on a private frontend IP address, so internal clients reach it without any public endpoint. A WAF policy on WAF_v2 applies the managed rule sets (DRS or CRS) against SQL injection and cross-site scripting.
        fr: |
          Application Gateway se déploie dans le réseau virtuel et peut exposer un écouteur sur une adresse IP frontale privée : les clients internes l'atteignent sans aucun point de terminaison public. Une stratégie WAF sur WAF_v2 applique les ensembles de règles managés (DRS ou CRS) contre l'injection SQL et le cross-site scripting.
      options:
        a: { en: "Front Door receives requests on public edge endpoints; it doesn't serve clients that must stay on a private address.", fr: "Front Door reçoit les requêtes sur des points de terminaison publics en périphérie ; il ne sert pas des clients qui doivent rester sur une adresse privée." }
        c: { en: "Front Door Standard is public as well, and its WAF has no managed rule sets.", fr: "Front Door Standard est lui aussi public, et son WAF n'a pas d'ensembles de règles managés." }
        d: { en: "IDPS is signature-based network intrusion detection, not a WAF with OWASP-based web rules for HTTP requests.", fr: "L'IDPS est une détection d'intrusion réseau par signatures, pas un WAF avec des règles web fondées sur OWASP pour les requêtes HTTP." }
    references:
      - title: Azure Application Gateway frontend IP address configuration
        url: https://learn.microsoft.com/en-us/azure/application-gateway/configuration-frontend-ip
      - title: What is Azure Web Application Firewall on Azure Application Gateway?
        url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview

  # ------------------------------------------------------------------ 3
  - id: az700-qz-54-03
    objective: "5.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        An Application Gateway WAF_v2 uses a WAF policy named **WAFP-Store** in Prevention mode with the Default Rule Set (DRS) 2.2 and several custom rules. WAF logs are sent to a Log Analytics workspace.

        You plan a new custom rule that would block requests whose `User-Agent` header contains `scanbot`. For one week, you need to see which requests the rule would match without affecting any traffic. The existing rules must keep blocking attacks during that week.

        What should you do?
      fr: |
        Une passerelle Application Gateway WAF_v2 utilise une stratégie WAF nommée **WAFP-Store** en mode Prevention avec le Default Rule Set (DRS) 2.2 et plusieurs règles personnalisées. Les journaux WAF sont envoyés vers un espace de travail Log Analytics.

        Vous prévoyez une nouvelle règle personnalisée qui bloquerait les requêtes dont l'en-tête `User-Agent` contient `scanbot`. Pendant une semaine, vous devez voir à quelles requêtes la règle correspondrait sans affecter aucun trafic. Les règles existantes doivent continuer à bloquer les attaques pendant cette semaine.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add the rule with the action Block, and switch WAFP-Store to Detection mode for the week.", fr: "Ajouter la règle avec l'action Block, puis passer WAFP-Store en mode Detection pendant la semaine." } }
        - { id: b, text: { en: "Add the rule with the action Block, and set the state of the rule to Disabled for the week.", fr: "Ajouter la règle avec l'action Block, puis régler l'état de la règle sur Disabled pendant la semaine." } }
        - { id: c, text: { en: "Add the rule to a new policy in Detection mode, and associate that policy with the gateway.", fr: "Ajouter la règle à une nouvelle stratégie en mode Detection, puis associer cette stratégie à la passerelle." } }
        - { id: d, text: { en: "Add the rule to WAFP-Store with the action Log, and change the action to Block after the week.", fr: "Ajouter la règle à WAFP-Store avec l'action Log, puis changer l'action en Block après la semaine." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The Log action writes the match to the WAF logs and lets the remaining rules run, so the request isn't affected by the new rule. Because WAFP-Store stays in Prevention mode, the managed rules and the other custom rules keep blocking attacks.
        fr: |
          L'action Log écrit la correspondance dans les journaux WAF et laisse les règles restantes s'exécuter : la requête n'est pas affectée par la nouvelle règle. Comme WAFP-Store reste en mode Prevention, les règles managées et les autres règles personnalisées continuent de bloquer les attaques.
      options:
        a: { en: "Detection mode stops the whole policy from blocking, including the existing rules.", fr: "Le mode Detection empêche toute la stratégie de bloquer, y compris les règles existantes." }
        b: { en: "A disabled rule isn't evaluated, so it produces no log entries to review.", fr: "Une règle désactivée n'est pas évaluée : elle ne produit aucune entrée de journal à examiner." }
        c: { en: "Associating a new policy with the gateway replaces WAFP-Store, so the gateway would stop blocking attacks.", fr: "Associer une nouvelle stratégie à la passerelle remplace WAFP-Store : la passerelle cesserait de bloquer les attaques." }
    references:
      - title: Custom rules for Web Application Firewall v2 on Azure Application Gateway
        url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/custom-waf-rules-overview

  # ------------------------------------------------------------------ 4
  - id: az700-qz-54-04
    objective: "5.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam publishes a document portal through an Application Gateway WAF_v2. Its WAF policy uses the Default Rule Set (DRS) 2.2 in Prevention mode with the default request size settings.

        Users must now upload scanned archives of up to 500 MB as `multipart/form-data` files. The uploads are currently rejected by the WAF. The rest of each request must still be inspected.

        What should you do?
      fr: |
        Fabrikam publie un portail documentaire via une passerelle Application Gateway WAF_v2. Sa stratégie WAF utilise le Default Rule Set (DRS) 2.2 en mode Prevention avec les paramètres de taille de requête par défaut.

        Les utilisateurs doivent désormais charger des archives numérisées allant jusqu'à 500 Mo sous forme de fichiers `multipart/form-data`. Les chargements sont actuellement rejetés par le WAF. Le reste de chaque requête doit toujours être inspecté.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set the maximum request body size of the policy to 512,000 KB.", fr: "Régler la taille maximale du corps de la requête de la stratégie sur 512 000 Ko." } }
        - { id: b, text: { en: "Turn off the request body check in the policy settings.", fr: "Désactiver la vérification du corps de la requête dans les paramètres de la stratégie." } }
        - { id: c, text: { en: "Set the file upload limit of the policy to 500 MB or more.", fr: "Régler la limite de chargement de fichiers de la stratégie sur 500 Mo ou plus." } }
        - { id: d, text: { en: "Switch the policy to Detection mode for the upload paths.", fr: "Passer la stratégie en mode Detection pour les chemins de chargement." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A `multipart/form-data` part with a file name counts as a file upload, and it's limited by the file upload limit, 100 MB by default. With DRS or CRS 3.2 and later, WAF_v2 accepts a file upload limit of up to 4 GB, so raising it to 500 MB or more lets the archives through while the rest of the request is still evaluated.
        fr: |
          Une partie `multipart/form-data` avec un nom de fichier compte comme un chargement de fichier, limité par la limite de chargement de fichiers, de 100 Mo par défaut. Avec DRS ou CRS 3.2 et ultérieur, WAF_v2 accepte une limite de chargement de fichiers allant jusqu'à 4 Go : la porter à 500 Mo ou plus laisse passer les archives, tandis que le reste de la requête est toujours évalué.
      options:
        a: { en: "The maximum request body size excludes file uploads, and with inspection enabled it can't exceed 2 MB.", fr: "La taille maximale du corps de la requête exclut les chargements de fichiers et, avec l'inspection activée, elle ne peut pas dépasser 2 Mo." }
        b: { en: "With DRS, body inspection and size enforcement are separate settings: turning off the check stops inspecting bodies but doesn't lift the file upload limit.", fr: "Avec DRS, l'inspection du corps et l'application des limites de taille sont des paramètres distincts : désactiver la vérification arrête l'inspection des corps mais ne lève pas la limite de chargement de fichiers." }
        d: { en: "The mode is a setting of the whole policy, and Detection would stop blocking every attack, not only large uploads.", fr: "Le mode est un paramètre de toute la stratégie, et Detection cesserait de bloquer toutes les attaques, pas seulement les gros chargements." }
    references:
      - title: Web Application Firewall request and file upload size limits
        url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/application-gateway-waf-request-size-limits
      - title: Azure subscription and service limits, quotas, and constraints
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/azure-subscription-service-limits

  # ------------------------------------------------------------------ 5
  - id: az700-qz-54-05
    objective: "5.3.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys has a WAF policy named **wafEdge** for an Azure Front Door Premium profile. wafEdge is in Prevention mode.

        You add a custom rule that uses the GeoMatch operator and the action **Redirect** so that clients from unsupported countries are sent to an information page at `https://www.wingtiptoys.com/unavailable`. The portal refuses to save the policy.

        What should you configure in wafEdge?
      fr: |
        Wingtip Toys dispose d'une stratégie WAF nommée **wafEdge** pour un profil Azure Front Door Premium. wafEdge est en mode Prevention.

        Vous ajoutez une règle personnalisée qui utilise l'opérateur GeoMatch et l'action **Redirect** afin d'envoyer les clients des pays non pris en charge vers une page d'information à l'adresse `https://www.wingtiptoys.com/unavailable`. Le portail refuse d'enregistrer la stratégie.

        Que devez-vous configurer dans wafEdge ?
    body:
      options:
        - { id: a, text: { en: "The redirect URL in the policy settings", fr: "L'URL de redirection dans les paramètres de la stratégie" } }
        - { id: b, text: { en: "The custom response status code in the policy settings", fr: "Le code d'état de réponse personnalisé dans les paramètres de la stratégie" } }
        - { id: c, text: { en: "The anomaly score action of the managed rule set", fr: "L'action du score d'anomalie de l'ensemble de règles managé" } }
        - { id: d, text: { en: "A second match condition on RequestUri in the custom rule", fr: "Une deuxième condition de correspondance sur RequestUri dans la règle personnalisée" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The Redirect action sends the client to the redirect URL, which is a setting of the whole policy, not of the rule. A Front Door WAF policy requires this URL, a valid HTTP or HTTPS address, as soon as any of its rules uses Redirect.
        fr: |
          L'action Redirect envoie le client vers l'URL de redirection, qui est un paramètre de toute la stratégie et non de la règle. Une stratégie WAF Front Door exige cette URL, une adresse HTTP ou HTTPS valide, dès qu'une de ses règles utilise Redirect.
      options:
        b: { en: "The custom response status code applies to blocked requests; a redirect doesn't use it.", fr: "Le code d'état de réponse personnalisé s'applique aux requêtes bloquées ; une redirection ne l'utilise pas." }
        c: { en: "The anomaly score action governs the managed rules, not the action of a custom rule.", fr: "L'action du score d'anomalie régit les règles managées, pas l'action d'une règle personnalisée." }
        d: { en: "A geo rule needs no path condition, and adding one wouldn't provide the destination of the redirect.", fr: "Une règle géographique n'a pas besoin de condition de chemin, et en ajouter une ne fournirait pas la destination de la redirection." }
    references:
      - title: Policy settings for Web Application Firewall in Azure Front Door
        url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-policy-settings

  # ------------------------------------------------------------------ 6
  - id: az700-qz-54-06
    objective: "5.3.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware publishes a web application through an Azure Front Door Premium profile named **afd-litware**, whose WAF policy blocks attacks at the edge. The origin of afd-litware is an Application Gateway WAF_v2 named **AGW-App** that has a public frontend IP address. Private Link isn't used. A network security group (NSG) on the subnet of AGW-App already allows the Application Gateway infrastructure traffic.

        Security testers reached AGW-App directly on its public IP address, bypassing afd-litware. You need to ensure that AGW-App accepts only requests that come through afd-litware.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware publie une application web via un profil Azure Front Door Premium nommé **afd-litware**, dont la stratégie WAF bloque les attaques en périphérie. L'origine d'afd-litware est une passerelle Application Gateway WAF_v2 nommée **AGW-App** qui a une adresse IP frontale publique. Private Link n'est pas utilisé. Un groupe de sécurité réseau (NSG) sur le sous-réseau d'AGW-App autorise déjà le trafic d'infrastructure d'Application Gateway.

        Des testeurs de sécurité ont atteint AGW-App directement sur son adresse IP publique, en contournant afd-litware. Vous devez faire en sorte qu'AGW-App n'accepte que les requêtes qui passent par afd-litware.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "In the NSG, allow TCP 443 from the AzureFrontDoor.Frontend service tag and deny TCP 443 from the Internet service tag.", fr: "Dans le NSG, autoriser TCP 443 depuis l'étiquette de service AzureFrontDoor.Frontend et refuser TCP 443 depuis l'étiquette de service Internet." } }
        - { id: b, text: { en: "In the WAF policy of AGW-App, add a custom rule that blocks requests whose X-Azure-FDID header doesn't equal the Front Door ID of afd-litware.", fr: "Dans la stratégie WAF d'AGW-App, ajouter une règle personnalisée qui bloque les requêtes dont l'en-tête X-Azure-FDID n'est pas égal à l'ID Front Door d'afd-litware." } }
        - { id: c, text: { en: "In the WAF policy of afd-litware, add a custom rule that blocks requests whose X-Azure-FDID header doesn't equal the Front Door ID of afd-litware.", fr: "Dans la stratégie WAF d'afd-litware, ajouter une règle personnalisée qui bloque les requêtes dont l'en-tête X-Azure-FDID n'est pas égal à l'ID Front Door d'afd-litware." } }
        - { id: d, text: { en: "In the NSG, allow TCP 443 from the AzureFrontDoor.Backend service tag and deny TCP 443 from the Internet service tag.", fr: "Dans le NSG, autoriser TCP 443 depuis l'étiquette de service AzureFrontDoor.Backend et refuser TCP 443 depuis l'étiquette de service Internet." } }
        - { id: e, text: { en: "Associate the WAF policy of afd-litware with the listener of AGW-App, so that both entry points share the same rules.", fr: "Associer la stratégie WAF d'afd-litware à l'écouteur d'AGW-App, afin que les deux points d'entrée partagent les mêmes règles." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          For a public origin, Front Door recommends two checks together. The NSG allows HTTPS only from AzureFrontDoor.Backend, the address space Front Door uses to connect to origins. Because other Front Door customers share those addresses, a WAF custom rule on AGW-App also rejects requests whose X-Azure-FDID header doesn't carry the ID of afd-litware.
        fr: |
          Pour une origine publique, Front Door recommande deux vérifications conjointes. Le NSG n'autorise le HTTPS que depuis AzureFrontDoor.Backend, l'espace d'adresses que Front Door utilise pour se connecter aux origines. Comme d'autres clients Front Door partagent ces adresses, une règle personnalisée du WAF d'AGW-App rejette en outre les requêtes dont l'en-tête X-Azure-FDID ne porte pas l'ID d'afd-litware.
      options:
        a: { en: "AzureFrontDoor.Frontend covers the addresses that clients connect to, not the addresses from which Front Door reaches the origins.", fr: "AzureFrontDoor.Frontend couvre les adresses auxquelles les clients se connectent, pas celles depuis lesquelles Front Door joint les origines." }
        c: { en: "Front Door adds X-Azure-FDID to the requests it sends to the origin; requests that bypass Front Door never reach its WAF, so the check must run on the origin.", fr: "Front Door ajoute X-Azure-FDID aux requêtes qu'il envoie à l'origine ; les requêtes qui contournent Front Door n'atteignent jamais son WAF, donc la vérification doit s'exécuter sur l'origine." }
        e: { en: "A Global WAF (Front Door) policy can't be associated with Application Gateway, and sharing rules wouldn't stop direct access anyway.", fr: "Une stratégie Global WAF (Front Door) ne peut pas être associée à Application Gateway, et partager des règles n'empêcherait de toute façon pas l'accès direct." }
    references:
      - title: Secure traffic to Azure Front Door origins
        url: https://learn.microsoft.com/en-us/azure/frontdoor/origin-security

  # ------------------------------------------------------------------ 7
  - id: az700-qz-54-07
    objective: "5.3.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has an Azure Front Door Premium profile named **afd-tailspin** with the custom domain shop.tailspintoys.com and two routes:

        | Route | Domain | Paths | Origin group |
        | --- | --- | --- | --- |
        | route-web | shop.tailspintoys.com | `/*` | og-web |
        | route-pay | shop.tailspintoys.com | `/checkout/*` | og-pay |

        A WAF policy named **wafShop** is associated with the domain shop.tailspintoys.com. You create a stricter WAF policy named **wafPay**.

        You need to ensure that wafPay processes the requests for `/checkout/*`, while wafShop keeps processing all the other requests for shop.tailspintoys.com.

        What should you do?
      fr: |
        Tailspin Toys dispose d'un profil Azure Front Door Premium nommé **afd-tailspin** avec le domaine personnalisé shop.tailspintoys.com et deux itinéraires (routes) :

        | Itinéraire | Domaine | Chemins | Groupe d'origines |
        | --- | --- | --- | --- |
        | route-web | shop.tailspintoys.com | `/*` | og-web |
        | route-pay | shop.tailspintoys.com | `/checkout/*` | og-pay |

        Une stratégie WAF nommée **wafShop** est associée au domaine shop.tailspintoys.com. Vous créez une stratégie WAF plus stricte nommée **wafPay**.

        Vous devez faire en sorte que wafPay traite les requêtes pour `/checkout/*`, tandis que wafShop continue de traiter toutes les autres requêtes pour shop.tailspintoys.com.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Associate wafPay with afd-tailspin at the profile scope.", fr: "Associer wafPay à afd-tailspin au niveau du profil." } }
        - { id: b, text: { en: "Associate wafPay with the origin group og-pay.", fr: "Associer wafPay au groupe d'origines og-pay." } }
        - { id: c, text: { en: "Associate wafPay with the route route-pay.", fr: "Associer wafPay à l'itinéraire route-pay." } }
        - { id: d, text: { en: "Move the domain shop.tailspintoys.com from wafShop to wafPay.", fr: "Déplacer le domaine shop.tailspintoys.com de wafShop vers wafPay." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Front Door WAF policies can be associated at the profile, domain and route scopes. When several scopes apply to a request, the most specific one is used: a route-level policy wins over a domain-level policy. Associating wafPay with route-pay applies it to `/checkout/*` only, and the domain-level wafShop keeps handling the other paths.
        fr: |
          Les stratégies WAF Front Door peuvent être associées aux étendues du profil, du domaine et de l'itinéraire. Quand plusieurs étendues s'appliquent à une requête, la plus spécifique est utilisée : une stratégie au niveau de l'itinéraire l'emporte sur une stratégie au niveau du domaine. Associer wafPay à route-pay l'applique à `/checkout/*` seulement, et wafShop, au niveau du domaine, continue de traiter les autres chemins.
      options:
        a: { en: "The profile is the least specific scope: the domain-level wafShop would still win for every request to shop.tailspintoys.com.", fr: "Le profil est l'étendue la moins spécifique : wafShop, au niveau du domaine, l'emporterait toujours pour chaque requête vers shop.tailspintoys.com." }
        b: { en: "Origin groups aren't a WAF association scope; the WAF evaluates the request at the edge, before routing to an origin group.", fr: "Les groupes d'origines ne sont pas une étendue d'association du WAF ; le WAF évalue la requête en périphérie, avant le routage vers un groupe d'origines." }
        d: { en: "Moving the domain would apply wafPay to every path of shop.tailspintoys.com, not to `/checkout/*` only.", fr: "Déplacer le domaine appliquerait wafPay à tous les chemins de shop.tailspintoys.com, et pas seulement à `/checkout/*`." }
    references:
      - title: Policy settings for Web Application Firewall in Azure Front Door
        url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-policy-settings

  # ------------------------------------------------------------------ 8
  - id: az700-qz-54-08
    objective: "5.3.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso publishes a partner portal through an Azure Front Door Premium profile. Its WAF policy is in Prevention mode, uses the Default Rule Set (DRS) 2.1 with its default settings, and contains the following custom rules:

        | Priority | Name | Condition | Action |
        | --- | --- | --- | --- |
        | 10 | Log-Partner | `RequestUri` Contains /partner/ | Log |
        | 20 | Block-Proxy | `SocketAddr` IPMatch 198.51.100.7 | Block |
        | 30 | Allow-Monitor | `RemoteAddr` IPMatch 203.0.113.10 | Allow |

        198.51.100.7 is the outbound proxy of a partner. It adds the `X-Forwarded-For` header with the original client address.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso publie un portail partenaires via un profil Azure Front Door Premium. Sa stratégie WAF est en mode Prevention, utilise le Default Rule Set (DRS) 2.1 avec ses paramètres par défaut et contient les règles personnalisées suivantes :

        | Priorité | Nom | Condition | Action |
        | --- | --- | --- | --- |
        | 10 | Log-Partner | `RequestUri` Contains /partner/ | Log |
        | 20 | Block-Proxy | `SocketAddr` IPMatch 198.51.100.7 | Block |
        | 30 | Allow-Monitor | `RemoteAddr` IPMatch 203.0.113.10 | Allow |

        198.51.100.7 est le proxy sortant d'un partenaire. Il ajoute l'en-tête `X-Forwarded-For` avec l'adresse d'origine du client.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si elle est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "A request for /partner/orders that arrives through the proxy 198.51.100.7 is blocked.", fr: "Une requête pour /partner/orders qui arrive par le proxy 198.51.100.7 est bloquée." } }
        - { id: s2, text: { en: "A request from the client 203.0.113.10 that arrives through the proxy 198.51.100.7 is allowed by Allow-Monitor.", fr: "Une requête du client 203.0.113.10 qui arrive par le proxy 198.51.100.7 est autorisée par Allow-Monitor." } }
        - { id: s3, text: { en: "A request for /partner/orders that doesn't use the proxy and matches no managed rule is logged by Log-Partner and forwarded to the origin.", fr: "Une requête pour /partner/orders qui n'utilise pas le proxy et ne correspond à aucune règle managée est journalisée par Log-Partner puis transmise à l'origine." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Custom rules run by priority, and evaluation stops at any action except Log: Log-Partner records the match and evaluation continues. `SocketAddr` is the address that connects to Front Door, here the proxy, while `RemoteAddr` is the original client taken from `X-Forwarded-For`. Every request through the proxy therefore matches Block-Proxy (priority 20) before Allow-Monitor (priority 30) is evaluated. A direct request to /partner/ is only logged, then the managed rules evaluate it and let it through.
        fr: |
          Les règles personnalisées s'exécutent par priorité, et l'évaluation s'arrête à toute action sauf Log : Log-Partner enregistre la correspondance et l'évaluation continue. `SocketAddr` est l'adresse qui se connecte à Front Door, ici le proxy, tandis que `RemoteAddr` est le client d'origine tiré de `X-Forwarded-For`. Toute requête qui passe par le proxy correspond donc à Block-Proxy (priorité 20) avant qu'Allow-Monitor (priorité 30) ne soit évaluée. Une requête directe vers /partner/ est seulement journalisée, puis les règles managées l'évaluent et la laissent passer.
      options:
        s2: { en: "Allow-Monitor would match on `RemoteAddr`, but Block-Proxy has a lower priority number and matches the proxy's `SocketAddr` first.", fr: "Allow-Monitor correspondrait sur `RemoteAddr`, mais Block-Proxy a un numéro de priorité inférieur et correspond d'abord au `SocketAddr` du proxy." }
    references:
      - title: Custom rules for Azure Web Application Firewall on Azure Front Door
        url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-custom-rules
      - title: Configure an IP restriction rule with a WAF for Azure Front Door
        url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-configure-ip-restriction

  # ------------------------------------------------------------------ 9
  - id: az700-qz-54-09
    objective: "5.3.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Traders publishes a media platform through an Application Gateway WAF_v2. Its WAF policy, **WAFP-Media**, uses the OWASP CRS 3.1 rule set in Prevention mode with the default request size settings.

        The platform has the following new requirements:

        - Users upload video files of up to 1.5 GB as `multipart/form-data` parts with a file name.
        - JSON API requests have bodies of up to 1 MB. These bodies must be inspected in full and must not be rejected for their size.

        The solution must keep managed rule protection and Prevention mode.

        How should you configure WAFP-Media? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders publie une plateforme multimédia via une passerelle Application Gateway WAF_v2. Sa stratégie WAF, **WAFP-Media**, utilise l'ensemble de règles OWASP CRS 3.1 en mode Prevention avec les paramètres de taille de requête par défaut.

        La plateforme a les nouvelles exigences suivantes :

        - Les utilisateurs chargent des fichiers vidéo allant jusqu'à 1,5 Go sous forme de parties `multipart/form-data` avec un nom de fichier.
        - Les requêtes de l'API JSON ont des corps allant jusqu'à 1 Mo. Ces corps doivent être inspectés en totalité et ne doivent pas être rejetés en raison de leur taille.

        La solution doit conserver la protection par les règles managées et le mode Prevention.

        Comment devez-vous configurer WAFP-Media ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Managed rule set: [[rs]]

          File upload limit: [[fu]]

          Maximum request body size: [[size]]

          Maximum request body inspection limit: [[insp]]
        fr: |
          Ensemble de règles managé : [[rs]]

          Limite de chargement de fichiers : [[fu]]

          Taille maximale du corps de la requête : [[size]]

          Limite d'inspection maximale du corps de la requête : [[insp]]
      slots:
        - id: rs
          options:
            - { id: crs31, text: { en: "Keep OWASP CRS 3.1", fr: "Conserver OWASP CRS 3.1" } }
            - { id: drs22, text: { en: "Upgrade to DRS 2.2", fr: "Passer à DRS 2.2" } }
            - { id: bot, text: { en: "Keep OWASP CRS 3.1 and add Bot Manager 1.1", fr: "Conserver OWASP CRS 3.1 et ajouter Bot Manager 1.1" } }
        - id: fu
          options:
            - { id: fu100, text: { en: "100 MB", fr: "100 Mo" } }
            - { id: fu750, text: { en: "750 MB", fr: "750 Mo" } }
            - { id: fu1600, text: { en: "1,600 MB", fr: "1 600 Mo" } }
        - id: size
          options:
            - { id: s128, text: { en: "128 KB", fr: "128 Ko" } }
            - { id: s1024, text: { en: "1,024 KB", fr: "1 024 Ko" } }
            - { id: s4096, text: { en: "4,096 KB", fr: "4 096 Ko" } }
        - id: insp
          options:
            - { id: i128, text: { en: "128 KB", fr: "128 Ko" } }
            - { id: i1024, text: { en: "1,024 KB", fr: "1 024 Ko" } }
            - { id: ioff, text: { en: "Request body check turned off", fr: "Vérification du corps de la requête désactivée" } }
    answer:
      values: { rs: drs22, fu: fu1600, size: s1024, insp: i1024 }
    explanation:
      correct:
        en: |
          With CRS 3.1, WAF_v2 caps file uploads at 750 MB and request bodies at 128 KB, so the policy must move to a rule set that runs the newer engine, such as DRS 2.2. A 1.5 GB file needs a file upload limit above 1,536 MB (up to 4 GB is supported). With inspection on, both the maximum request body size and the inspection limit can go up to 2 MB, so 1,024 KB lets 1 MB JSON bodies through and inspects them in full; the default 128 KB would reject or only partly inspect them.
        fr: |
          Avec CRS 3.1, WAF_v2 plafonne les chargements de fichiers à 750 Mo et les corps de requête à 128 Ko : la stratégie doit passer à un ensemble de règles qui utilise le moteur plus récent, comme DRS 2.2. Un fichier de 1,5 Go exige une limite de chargement de fichiers supérieure à 1 536 Mo (jusqu'à 4 Go est pris en charge). Avec l'inspection activée, la taille maximale du corps de la requête et la limite d'inspection peuvent aller jusqu'à 2 Mo : 1 024 Ko laisse passer les corps JSON de 1 Mo et les inspecte en totalité ; la valeur par défaut de 128 Ko les rejetterait ou ne les inspecterait qu'en partie.
      options:
        crs31: { en: "CRS 3.1 is limited to 750 MB uploads and 128 KB bodies.", fr: "CRS 3.1 est limité à 750 Mo pour les chargements et à 128 Ko pour les corps." }
        bot: { en: "Bot Manager adds bot protection but doesn't change the engine or its size limits.", fr: "Bot Manager ajoute la protection contre les bots mais ne change ni le moteur ni ses limites de taille." }
        fu750: { en: "750 MB is below the size of the videos.", fr: "750 Mo est inférieur à la taille des vidéos." }
        s4096: { en: "With size enforcement and inspection on, the maximum request body size can't exceed 2 MB.", fr: "Avec l'application des limites et l'inspection activées, la taille maximale du corps de la requête ne peut pas dépasser 2 Mo." }
        ioff: { en: "Turning off the request body check stops the managed rules from evaluating the JSON bodies.", fr: "Désactiver la vérification du corps de la requête empêche les règles managées d'évaluer les corps JSON." }
    references:
      - title: Web Application Firewall request and file upload size limits
        url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/application-gateway-waf-request-size-limits
      - title: Azure subscription and service limits, quotas, and constraints
        url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/azure-subscription-service-limits

  # ------------------------------------------------------------------ 10
  - id: az700-qz-54-10
    objective: "5.3.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware runs two websites on an Application Gateway WAF_v2 named **AGW-Web**. A WAF policy named **WAFP-Web** uses the OWASP CRS 3.2 rule set in Prevention mode and is associated with the two multi-site listeners, **lst-eu** and **lst-us**. AGW-Web scales out to several instances during peak hours.

        You need to add rate limit custom rules to WAFP-Web that meet the following requirements:

        - R1: On /login, each client IP address is limited to 100 requests per minute. Clients connect directly to AGW-Web.
        - R2: On /api/export, all the clients of a site together are limited to 600 requests per minute, the most that the backend of each site can handle.
        - R3: On /partner/, each partner user is limited individually. Partner users connect through the partner's proxy, which adds the `X-Forwarded-For` header with the user's address.

        How should you configure the rules? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware exploite deux sites web sur une passerelle Application Gateway WAF_v2 nommée **AGW-Web**. Une stratégie WAF nommée **WAFP-Web** utilise l'ensemble de règles OWASP CRS 3.2 en mode Prevention et est associée aux deux écouteurs multisites, **lst-eu** et **lst-us**. AGW-Web monte en charge sur plusieurs instances aux heures de pointe.

        Vous devez ajouter à WAFP-Web des règles personnalisées de limitation de débit qui répondent aux exigences suivantes :

        - R1 : sur /login, chaque adresse IP cliente est limitée à 100 requêtes par minute. Les clients se connectent directement à AGW-Web.
        - R2 : sur /api/export, l'ensemble des clients d'un site est limité à 600 requêtes par minute, le maximum que le backend de chaque site peut traiter.
        - R3 : sur /partner/, chaque utilisateur partenaire est limité individuellement. Les utilisateurs partenaires se connectent par le proxy du partenaire, qui ajoute l'en-tête `X-Forwarded-For` avec l'adresse de l'utilisateur.

        Comment devez-vous configurer les règles ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          R1 group by: [[g1]]

          R2 group by: [[g2]]

          R2 threshold (requests per minute): [[t2]]

          R3 group by: [[g3]]
        fr: |
          Regroupement de R1 : [[g1]]

          Regroupement de R2 : [[g2]]

          Seuil de R2 (requêtes par minute) : [[t2]]

          Regroupement de R3 : [[g3]]
      slots:
        - id: g1
          options:
            - { id: client, text: ClientAddr }
            - { id: none, text: None }
            - { id: xff, text: ClientAddrXFFHeader }
            - { id: geo, text: GeoLocation }
        - id: g2
          options:
            - { id: client, text: ClientAddr }
            - { id: none, text: None }
            - { id: xff, text: ClientAddrXFFHeader }
            - { id: geo, text: GeoLocation }
        - id: t2
          options:
            - { id: t300, text: "300" }
            - { id: t600, text: "600" }
            - { id: t1200, text: { en: "1,200", fr: "1 200" } }
        - id: g3
          options:
            - { id: client, text: ClientAddr }
            - { id: none, text: None }
            - { id: xff, text: ClientAddrXFFHeader }
            - { id: geo, text: GeoLocation }
    answer:
      values: { g1: client, g2: none, t2: t600, g3: xff }
    explanation:
      correct:
        en: |
          ClientAddr, the default, keeps one counter per source IP address, which fits direct clients. None counts all the matching traffic together, which caps a path for all clients combined. Counters are kept independently for each association, so with WAFP-Web on two listeners each site gets its own 600-request counter, and scaling out the gateway doesn't divide the threshold. Behind a proxy, every user shares the proxy's address, so ClientAddrXFFHeader counts each address found in `X-Forwarded-For` separately.
        fr: |
          ClientAddr, la valeur par défaut, tient un compteur par adresse IP source, ce qui convient aux clients directs. None compte ensemble tout le trafic correspondant, ce qui plafonne un chemin pour l'ensemble des clients. Les compteurs sont tenus indépendamment pour chaque association : avec WAFP-Web sur deux écouteurs, chaque site a son propre compteur de 600 requêtes, et la montée en charge de la passerelle ne divise pas le seuil. Derrière un proxy, tous les utilisateurs partagent l'adresse du proxy : ClientAddrXFFHeader compte séparément chaque adresse trouvée dans `X-Forwarded-For`.
      options:
        t300: { en: "Halving the threshold assumes one counter shared by the two listeners; each association has its own counter.", fr: "Diviser le seuil par deux suppose un compteur partagé par les deux écouteurs ; chaque association a son propre compteur." }
        t1200: { en: "Each listener already has its own counter: 1,200 would let each site's backend receive twice what it can handle.", fr: "Chaque écouteur a déjà son propre compteur : 1 200 laisserait le backend de chaque site recevoir le double de ce qu'il peut traiter." }
        geo: { en: "GeoLocation groups clients by country or region, which matches none of the requirements.", fr: "GeoLocation regroupe les clients par pays ou région, ce qui ne correspond à aucune des exigences." }
    references:
      - title: Rate limiting for Azure Web Application Firewall on Azure Application Gateway
        url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/rate-limiting-overview
