chapter: 32-load-balancer-traffic-manager
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-32-01
    objective: "3.1.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin has a public Standard load balancer named **LB-Web** with an HTTP health probe on port 80. The backend virtual machines run Linux with a host firewall that drops every packet whose source address isn't explicitly allowed.

        All the virtual machines are reported as unhealthy, although the web application answers locally on port 80.

        Which source IP address must the host firewall allow so that the health probe succeeds?
      fr: |
        Tailspin dispose d'un équilibreur de charge public Standard nommé **LB-Web** avec une sonde d'intégrité HTTP sur le port 80. Les machines virtuelles du back-end exécutent Linux avec un pare-feu hôte qui abandonne tout paquet dont l'adresse source n'est pas explicitement autorisée.

        Toutes les machines virtuelles sont signalées comme non saines, alors que l'application web répond localement sur le port 80.

        Quelle adresse IP source le pare-feu hôte doit-il autoriser pour que la sonde d'intégrité réussisse ?
    body:
      options:
        - { id: a, text: "169.254.169.254" }
        - { id: b, text: { en: "The frontend IP address of LB-Web", fr: "L'adresse IP frontale de LB-Web" } }
        - { id: c, text: "168.63.129.16" }
        - { id: d, text: { en: "The first usable address of the backend subnet", fr: "La première adresse utilisable du sous-réseau du back-end" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          IPv4 health probes of Azure Load Balancer come from 168.63.129.16, the address that the `AzureLoadBalancer` service tag represents. Both the network security groups and any guest firewall must allow it; otherwise every instance is marked down and receives no new flows.
        fr: |
          Les sondes d'intégrité IPv4 d'Azure Load Balancer proviennent de 168.63.129.16, l'adresse que représente l'étiquette de service `AzureLoadBalancer`. Les groupes de sécurité réseau comme tout pare-feu invité doivent l'autoriser ; sinon chaque instance est marquée comme défaillante et ne reçoit plus de nouveaux flux.
      options:
        a: { en: "169.254.169.254 is the Azure Instance Metadata Service endpoint, which the VM calls itself; health probes don't come from it.", fr: "169.254.169.254 est le point de terminaison du service de métadonnées d'instance Azure, que la VM appelle elle-même ; les sondes d'intégrité n'en proviennent pas." }
        b: { en: "The frontend IP address is where clients send their traffic; the load balancer doesn't send its probes from it.", fr: "L'adresse IP frontale est la destination du trafic des clients ; l'équilibreur de charge n'envoie pas ses sondes depuis cette adresse." }
        d: { en: "The first usable address of a subnet is the default gateway that Azure reserves for routing, not the source of the probes.", fr: "La première adresse utilisable d'un sous-réseau est la passerelle par défaut réservée par Azure pour le routage, pas la source des sondes." }
    references:
      - title: Azure Load Balancer health probes
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview

  # ------------------------------------------------------------------ 2
  - id: az700-qz-32-02
    objective: "3.1.7"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso uses an Azure Traffic Manager profile named **tm-telemetry** with the Performance routing method. Its endpoints are two deployments of an application that receives a custom TCP protocol on port 5000, in West Europe and East US.

        A network engineer asks how the connection of a client reaches one of the endpoints. Which statement describes the behavior of Traffic Manager?
      fr: |
        Contoso utilise un profil Azure Traffic Manager nommé **tm-telemetry** avec la méthode de routage Performance. Ses points de terminaison sont deux déploiements d'une application qui reçoit un protocole TCP personnalisé sur le port 5000, en West Europe et en East US.

        Un ingénieur réseau demande comment la connexion d'un client atteint l'un des points de terminaison. Quelle affirmation décrit le comportement de Traffic Manager ?
    body:
      options:
        - { id: a, text: { en: "The client connects to an anycast IP address of Traffic Manager, which forwards the TCP connection to the closest healthy endpoint.", fr: "Le client se connecte à une adresse IP anycast de Traffic Manager, qui transfère la connexion TCP au point de terminaison sain le plus proche." } }
        - { id: b, text: { en: "The client resolves the profile name, receives the address of an endpoint in the DNS response, and connects directly to that endpoint.", fr: "Le client résout le nom du profil, reçoit l'adresse d'un point de terminaison dans la réponse DNS, puis se connecte directement à ce point de terminaison." } }
        - { id: c, text: { en: "The client connects to a regional proxy of Traffic Manager, which terminates the connection and opens a new one to the endpoint.", fr: "Le client se connecte à un proxy régional de Traffic Manager, qui termine la connexion et en ouvre une nouvelle vers le point de terminaison." } }
        - { id: d, text: { en: "The client connects to the public IP address of the profile, which translates the destination to the endpoint chosen by the routing method.", fr: "Le client se connecte à l'adresse IP publique du profil, qui traduit la destination vers le point de terminaison choisi par la méthode de routage." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Traffic Manager works only at the DNS level: it answers the DNS query with the endpoint selected by the routing method and endpoint health, and the client then connects directly to that endpoint. Traffic Manager never sees the traffic, which is why it works for any protocol, including a custom TCP protocol.
        fr: |
          Traffic Manager fonctionne uniquement au niveau du DNS : il répond à la requête DNS avec le point de terminaison choisi selon la méthode de routage et l'intégrité des points de terminaison, puis le client se connecte directement à ce point de terminaison. Traffic Manager ne voit jamais le trafic ; c'est pourquoi il fonctionne pour tout protocole, y compris un protocole TCP personnalisé.
      options:
        a: { en: "Traffic Manager has no anycast data path; forwarding TCP connections from an anycast address describes a global load balancer, not a DNS service.", fr: "Traffic Manager n'a pas de chemin de données anycast ; transférer des connexions TCP depuis une adresse anycast décrit un équilibreur de charge global, pas un service DNS." }
        c: { en: "Traffic Manager isn't a proxy: it doesn't terminate or relay connections. A proxy that terminates connections describes services such as Front Door.", fr: "Traffic Manager n'est pas un proxy : il ne termine ni ne relaie les connexions. Un proxy qui termine les connexions décrit des services comme Front Door." }
        d: { en: "A Traffic Manager profile has a DNS name under trafficmanager.net, not a public IP address, and it performs no address translation.", fr: "Un profil Traffic Manager a un nom DNS sous trafficmanager.net, pas d'adresse IP publique, et il n'effectue aucune traduction d'adresses." }
    references:
      - title: Azure Traffic Manager - FAQ
        url: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-faqs

  # ------------------------------------------------------------------ 3
  - id: az700-qz-32-03
    objective: "3.1.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam publishes a reporting application on TCP port 443 through a public Standard load balancer named **LB-Rep**. Users often leave a report open without any activity for up to 25 minutes, and their connections must survive these pauses.

        When a connection does reach the idle timeout, both the client and the virtual machine must be notified at once so that the application can reconnect. The idle timeout of the frontend public IP address is set to the same value as the rule.

        How should you configure the load-balancing rule?
      fr: |
        Fabrikam publie une application de rapports sur le port TCP 443 via un équilibreur de charge public Standard nommé **LB-Rep**. Les utilisateurs laissent souvent un rapport ouvert sans aucune activité jusqu'à 25 minutes, et leurs connexions doivent survivre à ces pauses.

        Quand une connexion atteint malgré tout le délai d'inactivité, le client et la machine virtuelle doivent être prévenus immédiatement pour que l'application puisse se reconnecter. Le délai d'inactivité de l'adresse IP publique frontale est défini sur la même valeur que la règle.

        Comment devez-vous configurer la règle d'équilibrage de charge ?
    body:
      options:
        - { id: a, text: { en: "Idle timeout 4 minutes, TCP reset enabled", fr: "Délai d'inactivité de 4 minutes, TCP reset activé" } }
        - { id: b, text: { en: "Idle timeout 30 minutes, TCP reset disabled", fr: "Délai d'inactivité de 30 minutes, TCP reset désactivé" } }
        - { id: c, text: { en: "Idle timeout 120 minutes, TCP reset enabled", fr: "Délai d'inactivité de 120 minutes, TCP reset activé" } }
        - { id: d, text: { en: "Idle timeout 30 minutes, TCP reset enabled", fr: "Délai d'inactivité de 30 minutes, TCP reset activé" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A load-balancing rule accepts an idle timeout from 4 to 100 minutes, so 30 minutes covers pauses of 25 minutes. Without TCP reset, Load Balancer drops an idle flow silently; with TCP reset enabled, it sends a RST to both the client and the server when the timeout is reached, so both ends close the socket and reconnect at once.
        fr: |
          Une règle d'équilibrage de charge accepte un délai d'inactivité de 4 à 100 minutes ; 30 minutes couvrent donc des pauses de 25 minutes. Sans TCP reset, Load Balancer abandonne un flux inactif en silence ; avec TCP reset activé, il envoie un RST au client et au serveur à l'expiration du délai, si bien que les deux extrémités ferment le socket et se reconnectent immédiatement.
      options:
        a: { en: "The default 4-minute timeout would cut the connections during the pauses of up to 25 minutes.", fr: "Le délai par défaut de 4 minutes couperait les connexions pendant les pauses de jusqu'à 25 minutes." }
        b: { en: "Without TCP reset, the flow is dropped silently at the timeout: neither endpoint is notified.", fr: "Sans TCP reset, le flux est abandonné en silence à l'expiration du délai : aucune extrémité n'est prévenue." }
        c: { en: "120 minutes is the maximum of outbound rules; load-balancing rules are limited to 100 minutes.", fr: "120 minutes est le maximum des règles de trafic sortant ; les règles d'équilibrage de charge sont limitées à 100 minutes." }
    references:
      - title: Load Balancer TCP Reset and idle timeout in Azure
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-tcp-reset

  # ------------------------------------------------------------------ 4
  - id: az700-qz-32-04
    objective: "3.1.10"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has a public Standard load balancer named **LB1** with a frontend IP configuration named **FE1**. You create an inbound NAT rule that maps TCP port 50001 of FE1 to TCP port 3389 of a virtual machine named **VM1**.

        The network security group of the VM1 subnet contains an inbound rule that allows TCP port 50001 from the administrators' public range 203.0.113.0/24, followed by the default rules. Administrators can't open a Remote Desktop session to FE1 on port 50001, whereas Remote Desktop to VM1 works from a server in the same virtual network.

        What should you do?
      fr: |
        Adatum dispose d'un équilibreur de charge public Standard nommé **LB1** avec une configuration IP frontale nommée **FE1**. Vous créez une règle NAT entrante qui associe le port TCP 50001 de FE1 au port TCP 3389 d'une machine virtuelle nommée **VM1**.

        Le groupe de sécurité réseau du sous-réseau de VM1 contient une règle entrante qui autorise le port TCP 50001 depuis la plage publique des administrateurs 203.0.113.0/24, suivie des règles par défaut. Les administrateurs ne parviennent pas à ouvrir une session Bureau à distance vers FE1 sur le port 50001, alors que le Bureau à distance vers VM1 fonctionne depuis un serveur du même réseau virtuel.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Attach a TCP health probe on port 3389 to the inbound NAT rule so that VM1 is marked healthy.", fr: "Attacher une sonde d'intégrité TCP sur le port 3389 à la règle NAT entrante pour que VM1 soit marquée saine." } }
        - { id: b, text: { en: "Change the backend port of the inbound NAT rule to 50001 so that it matches the NSG rule.", fr: "Remplacer le port de back-end de la règle NAT entrante par 50001 pour qu'il corresponde à la règle NSG." } }
        - { id: c, text: { en: "Change the destination port of the NSG rule to 3389, and keep the administrators' range as the source.", fr: "Remplacer le port de destination de la règle NSG par 3389, en conservant la plage des administrateurs comme source." } }
        - { id: d, text: { en: "Add an NSG rule that allows the AzureLoadBalancer service tag as the source on port 50001.", fr: "Ajouter une règle NSG qui autorise l'étiquette de service AzureLoadBalancer comme source sur le port 50001." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A network security group evaluates inbound traffic after the load balancer has translated it: the destination is the private IP address and the backend port of VM1 (3389), while the source stays the administrator's address. The rule must therefore allow port 3389 from 203.0.113.0/24; port 50001 exists only on the frontend.
        fr: |
          Un groupe de sécurité réseau évalue le trafic entrant après sa traduction par l'équilibreur de charge : la destination est l'adresse IP privée et le port de back-end de VM1 (3389), tandis que la source reste l'adresse de l'administrateur. La règle doit donc autoriser le port 3389 depuis 203.0.113.0/24 ; le port 50001 n'existe que sur l'adresse frontale.
      options:
        a: { en: "An inbound NAT rule needs no health probe: it forwards to its target whatever the probe status.", fr: "Une règle NAT entrante n'a pas besoin de sonde d'intégrité : elle transfère vers sa cible quel que soit l'état des sondes." }
        b: { en: "Remote Desktop listens on 3389 on VM1; forwarding to port 50001 would reach no service.", fr: "Le Bureau à distance écoute sur le port 3389 de VM1 ; un transfert vers le port 50001 n'atteindrait aucun service." }
        d: { en: "AzureLoadBalancer covers the probe address 168.63.129.16, not the administrators' traffic, whose source stays 203.0.113.0/24.", fr: "AzureLoadBalancer couvre l'adresse des sondes 168.63.129.16, pas le trafic des administrateurs, dont la source reste 203.0.113.0/24." }
    references:
      - title: Azure network security groups overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
      - title: Inbound NAT rules
        url: https://learn.microsoft.com/en-us/azure/load-balancer/inbound-nat-rules

  # ------------------------------------------------------------------ 5
  - id: az700-qz-32-05
    objective: "3.1.11"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind has a subnet named **snet-app**. Default outbound access is disabled on snet-app, and no NAT gateway is associated with it. LB-Pub is a public Standard load balancer with an outbound rule for its backend pool; LB-Int is an internal Standard load balancer. The subnet contains the following virtual machines:

        | Name | Instance-level public IP address | Backend pool membership |
        | --- | --- | --- |
        | VM1 | Standard public IP address | Backend pool of LB-Pub |
        | VM2 | None | Backend pool of LB-Pub |
        | VM3 | None | Backend pool of LB-Int only |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind dispose d'un sous-réseau nommé **snet-app**. L'accès sortant par défaut est désactivé sur snet-app, et aucune passerelle NAT ne lui est associée. LB-Pub est un équilibreur de charge public Standard avec une règle de trafic sortant pour son pool principal ; LB-Int est un équilibreur de charge interne Standard. Le sous-réseau contient les machines virtuelles suivantes :

        | Nom | Adresse IP publique au niveau de l'instance | Appartenance à un pool principal |
        | --- | --- | --- |
        | VM1 | Adresse IP publique Standard | Pool principal de LB-Pub |
        | VM2 | Aucune | Pool principal de LB-Pub |
        | VM3 | Aucune | Pool principal de LB-Int uniquement |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "VM1 uses its own public IP address for its outbound connections, not the frontend IP address of the outbound rule.", fr: "VM1 utilise sa propre adresse IP publique pour ses connexions sortantes, et non l'adresse IP frontale de la règle de trafic sortant." }
        - id: s2
          text: { en: "If you associate a NAT gateway with snet-app, VM2 keeps using the frontend IP address of the outbound rule for its outbound connections.", fr: "Si vous associez une passerelle NAT à snet-app, VM2 continue d'utiliser l'adresse IP frontale de la règle de trafic sortant pour ses connexions sortantes." }
        - id: s3
          text: { en: "VM3 reaches the internet through SNAT on the frontend IP address of LB-Int.", fr: "VM3 accède à internet grâce à la SNAT sur l'adresse IP frontale de LB-Int." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Azure uses the first available outbound method in this order: NAT gateway on the subnet, instance-level public IP address, load balancer frontend with outbound rules, then the other methods. Outbound rules apply only to backend VMs without an instance-level public IP address, so VM1 uses its own address. A NAT gateway would take precedence over the outbound rule for VM2, and an internal load balancer provides no outbound connectivity.
        fr: |
          Azure utilise la première méthode sortante disponible dans cet ordre : passerelle NAT sur le sous-réseau, adresse IP publique au niveau de l'instance, adresse frontale d'équilibreur de charge avec règles de trafic sortant, puis les autres méthodes. Les règles de trafic sortant ne s'appliquent qu'aux VM du back-end sans adresse IP publique au niveau de l'instance ; VM1 utilise donc sa propre adresse. Une passerelle NAT l'emporterait sur la règle de trafic sortant pour VM2, et un équilibreur de charge interne ne fournit aucune connectivité sortante.
      options:
        s2: { en: "A NAT gateway on the subnet has the highest precedence: VM2 would leave through the NAT gateway's public IP address.", fr: "Une passerelle NAT sur le sous-réseau a la priorité la plus élevée : VM2 sortirait par l'adresse IP publique de la passerelle NAT." }
        s3: { en: "An internal load balancer has a private frontend and gives no outbound access; VM3 needs a NAT gateway, a public IP address or a public load balancer with an outbound rule.", fr: "Un équilibreur de charge interne a une adresse frontale privée et ne donne aucun accès sortant ; VM3 a besoin d'une passerelle NAT, d'une adresse IP publique ou d'un équilibreur de charge public avec une règle de trafic sortant." }
    references:
      - title: Source Network Address Translation (SNAT) for outbound connections
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-outbound-connections
      - title: Outbound rules for Azure Load Balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/outbound-rules

  # ------------------------------------------------------------------ 6
  - id: az700-qz-32-06
    objective: "3.1.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso has a public Standard load balancer named **LB-Shop** in a virtual network named **vnet-shop**. LB-Shop has two backend pools:

        - **pool-nic** is NIC-based and contains VM1, VM2 and VM3. A load-balancing rule for TCP port 80 uses pool-nic and an HTTP health probe on port 80 with the path `/health`.
        - **pool-ip** is IP-based and is associated with vnet-shop. Another load-balancing rule uses it.

        After an update of its application, VM3 answers requests for `/health` with an HTTP 301 response that redirects to `/health/`. VM1 and VM2 answer with HTTP 200.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un équilibreur de charge public Standard nommé **LB-Shop** dans un réseau virtuel nommé **vnet-shop**. LB-Shop a deux pools principaux :

        - **pool-nic** est basé sur la carte réseau et contient VM1, VM2 et VM3. Une règle d'équilibrage de charge pour le port TCP 80 utilise pool-nic et une sonde d'intégrité HTTP sur le port 80 avec le chemin `/health`.
        - **pool-ip** est basé sur l'adresse IP et associé à vnet-shop. Une autre règle d'équilibrage de charge l'utilise.

        Après une mise à jour de son application, VM3 répond aux requêtes sur `/health` par une réponse HTTP 301 qui redirige vers `/health/`. VM1 et VM2 répondent par HTTP 200.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "If VM2 later stops answering the probe, the TCP connections already established to VM2 continue.", fr: "Si VM2 cesse ensuite de répondre à la sonde, les connexions TCP déjà établies vers VM2 se poursuivent." }
        - id: s2
          text: { en: "VM3 keeps receiving new flows from the rule while `/health` answers with the 301 redirect.", fr: "VM3 continue de recevoir de nouveaux flux de la règle tant que `/health` répond par la redirection 301." }
        - id: s3
          text: { en: "You can add the address 10.4.1.20 of vnet-shop to pool-ip before the virtual machine that will use this address is created.", fr: "Vous pouvez ajouter l'adresse 10.4.1.20 de vnet-shop à pool-ip avant la création de la machine virtuelle qui utilisera cette adresse." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          When one instance fails its probe, new TCP flows go to the healthy instances but the flows already established to it continue. An HTTP probe is up only when the instance returns HTTP 200; a 301 redirect is a failure, so VM3 is marked down. An IP-based backend pool is defined by IP addresses and the virtual network ID, so it can be prepopulated before the virtual machines exist.
        fr: |
          Quand une instance échoue à sa sonde, les nouveaux flux TCP vont vers les instances saines, mais les flux déjà établis vers elle se poursuivent. Une sonde HTTP n'est réussie que si l'instance renvoie HTTP 200 ; une redirection 301 est un échec, donc VM3 est marquée comme défaillante. Un pool principal basé sur l'adresse IP est défini par des adresses IP et l'ID du réseau virtuel ; il peut donc être prérempli avant que les machines virtuelles existent.
      options:
        s2: { en: "Load Balancer HTTP probes accept only status 200; any other code, a redirect included, marks the instance down and stops new flows to it.", fr: "Les sondes HTTP de Load Balancer n'acceptent que le code 200 ; tout autre code, redirection comprise, marque l'instance comme défaillante et arrête les nouveaux flux vers elle." }
    references:
      - title: Azure Load Balancer health probes
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview
      - title: Backend Pool Management - Azure Load Balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/backend-pool-management

  # ------------------------------------------------------------------ 7
  - id: az700-qz-32-07
    objective: "3.1.9"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove publishes a partner portal through a public Standard load balancer named **LB-Partner**. The load-balancing rule **rule-portal** has the following settings:

        | Setting | Value |
        | --- | --- |
        | Frontend IP configuration | fe-portal (public IP address pip-portal, idle timeout 4 minutes) |
        | Protocol and ports | TCP, frontend port 443, backend port 443 |
        | Backend pool | pool-portal (VM1 to VM4) |
        | Session persistence | Client IP |
        | Idle timeout | 30 minutes |
        | TCP reset | Disabled |
        | Floating IP | Disabled |

        The 2,000 users of a partner company reach the portal through a forward proxy that uses a single public IP address. All four virtual machines are healthy, and the membership of pool-portal doesn't change.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove publie un portail partenaires via un équilibreur de charge public Standard nommé **LB-Partner**. La règle d'équilibrage de charge **rule-portal** a les paramètres suivants :

        | Paramètre | Valeur |
        | --- | --- |
        | Configuration IP frontale | fe-portal (adresse IP publique pip-portal, délai d'inactivité de 4 minutes) |
        | Protocole et ports | TCP, port frontal 443, port de back-end 443 |
        | Pool principal | pool-portal (VM1 à VM4) |
        | Persistance de session | Client IP |
        | Délai d'inactivité | 30 minutes |
        | TCP reset | Désactivé |
        | IP flottante | Désactivée |

        Les 2 000 utilisateurs d'une société partenaire accèdent au portail via un proxy de transfert qui utilise une seule adresse IP publique. Les quatre machines virtuelles sont saines, et la composition de pool-portal ne change pas.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The connections of all the partner users are sent to the same virtual machine.", fr: "Les connexions de tous les utilisateurs du partenaire sont envoyées vers la même machine virtuelle." } }
        - { id: b, text: { en: "An idle connection stays open for 30 minutes, then both endpoints receive a TCP reset.", fr: "Une connexion inactive reste ouverte 30 minutes, puis les deux extrémités reçoivent un TCP reset." } }
        - { id: c, text: { en: "The virtual machines receive the packets with the IP address of fe-portal as the destination.", fr: "Les machines virtuelles reçoivent les paquets avec l'adresse IP de fe-portal comme destination." } }
        - { id: d, text: { en: "An idle connection is dropped after 4 minutes, and neither endpoint is notified.", fr: "Une connexion inactive est abandonnée après 4 minutes, sans qu'aucune extrémité soit prévenue." } }
        - { id: e, text: { en: "If VM5 is added to pool-portal, every partner user stays on the virtual machine it already uses.", fr: "Si VM5 est ajoutée à pool-portal, chaque utilisateur du partenaire reste sur la machine virtuelle qu'il utilise déjà." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          Client IP persistence hashes the source and destination IP addresses, so every user behind the proxy's single address reaches the same virtual machine. When a rule's idle timeout differs from that of the frontend IP address it references, the frontend IP's value takes precedence, so flows time out after 4 minutes; with TCP reset disabled, Load Balancer drops them silently.
        fr: |
          La persistance Client IP calcule un hachage des adresses IP source et de destination ; tous les utilisateurs derrière l'adresse unique du proxy atteignent donc la même machine virtuelle. Quand le délai d'inactivité d'une règle diffère de celui de l'adresse IP frontale qu'elle référence, la valeur de l'adresse frontale l'emporte : les flux expirent donc après 4 minutes, et avec TCP reset désactivé, Load Balancer les abandonne en silence.
      options:
        b: { en: "The 4-minute timeout of the frontend IP address takes precedence over the 30 minutes of the rule, and TCP reset is disabled.", fr: "Le délai de 4 minutes de l'adresse IP frontale l'emporte sur les 30 minutes de la règle, et TCP reset est désactivé." }
        c: { en: "Floating IP is disabled, so the load balancer delivers packets to the private IP address of each virtual machine.", fr: "L'IP flottante est désactivée ; l'équilibreur de charge livre donc les paquets à l'adresse IP privée de chaque machine virtuelle." }
        e: { en: "Adding or removing a pool member recomputes the distribution; existing clients aren't guaranteed to reach the same virtual machine.", fr: "Ajouter ou retirer un membre du pool recalcule la répartition ; les clients existants n'ont pas la garantie d'atteindre la même machine virtuelle." }
    references:
      - title: Azure Load Balancer distribution modes
        url: https://learn.microsoft.com/en-us/azure/load-balancer/distribution-mode-concepts
      - title: Load Balancer TCP Reset and idle timeout in Azure
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-tcp-reset

  # ------------------------------------------------------------------ 8
  - id: az700-qz-32-08
    objective: "3.1.11"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware runs an order-processing application on 30 virtual machines in the backend pool of a public Standard load balancer named **LB-Orders**. The virtual machines have no instance-level public IP addresses, and their subnet has no NAT gateway. An outbound rule uses a single frontend IP configuration with the public IP address **PIP1** and allocates 2,048 ports per instance.

        Most outbound connections go to an Azure SQL Database logical server through its public endpoint. The others go to a payment API hosted by a partner, whose firewall accepts only PIP1. At peak hours, new connections to the database fail intermittently, and the metrics of LB-Orders show SNAT port exhaustion.

        You need to resolve the failures. The payment API must keep receiving the connections from PIP1, and the application code must not change. The virtual network uses Azure-provided DNS.

        What should you do?
      fr: |
        Litware exécute une application de traitement des commandes sur 30 machines virtuelles du pool principal d'un équilibreur de charge public Standard nommé **LB-Orders**. Les machines virtuelles n'ont pas d'adresse IP publique au niveau de l'instance, et leur sous-réseau n'a pas de passerelle NAT. Une règle de trafic sortant utilise une seule configuration IP frontale avec l'adresse IP publique **PIP1** et alloue 2 048 ports par instance.

        La plupart des connexions sortantes vont vers un serveur logique Azure SQL Database via son point de terminaison public. Les autres vont vers une API de paiement hébergée par un partenaire, dont le pare-feu n'accepte que PIP1. Aux heures de pointe, les nouvelles connexions vers la base de données échouent par intermittence, et les métriques de LB-Orders indiquent un épuisement des ports SNAT.

        Vous devez résoudre ces échecs. L'API de paiement doit continuer à recevoir les connexions depuis PIP1, et le code de l'application ne doit pas changer. Le réseau virtuel utilise le DNS fourni par Azure.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Associate a NAT gateway that has a new public IP address with the subnet of the virtual machines.", fr: "Associer au sous-réseau des machines virtuelles une passerelle NAT dotée d'une nouvelle adresse IP publique." } }
        - { id: b, text: { en: "Add a frontend with a new public IP address to the outbound rule, and allocate 4,096 ports per instance.", fr: "Ajouter à la règle de trafic sortant une adresse frontale avec une nouvelle adresse IP publique, et allouer 4 096 ports par instance." } }
        - { id: c, text: { en: "Create a private endpoint for the logical server, and link its private DNS zone to the virtual network.", fr: "Créer un point de terminaison privé pour le serveur logique, et lier sa zone DNS privée au réseau virtuel." } }
        - { id: d, text: { en: "Increase the idle timeout of the outbound rule to 120 minutes, and enable TCP reset on the rule.", fr: "Porter le délai d'inactivité de la règle de trafic sortant à 120 minutes, et activer TCP reset sur la règle." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Traffic to a PaaS service through Private Link stays on the Azure backbone and uses no SNAT port, which removes the main consumer of the ports. With the privatelink zone linked, the server's usual name resolves to the private IP address, so the connection string doesn't change. The payment API traffic keeps leaving through the outbound rule and PIP1, which now has enough ports.
        fr: |
          Le trafic vers un service PaaS via Private Link reste sur le réseau principal Azure et n'utilise aucun port SNAT, ce qui supprime le principal consommateur de ports. Avec la zone privatelink liée, le nom habituel du serveur se résout en adresse IP privée : la chaîne de connexion ne change pas. Le trafic de l'API de paiement continue de sortir par la règle de trafic sortant et PIP1, qui dispose désormais d'assez de ports.
      options:
        a: { en: "A NAT gateway takes precedence over the outbound rule, so the payment API would receive connections from the new address and reject them.", fr: "Une passerelle NAT l'emporte sur la règle de trafic sortant : l'API de paiement recevrait les connexions depuis la nouvelle adresse et les rejetterait." }
        b: { en: "Flows would also leave from the new address, which the partner firewall doesn't accept.", fr: "Des flux sortiraient aussi depuis la nouvelle adresse, que le pare-feu du partenaire n'accepte pas." }
        d: { en: "A longer idle timeout keeps idle flows, and their SNAT ports, longer: it makes the exhaustion worse.", fr: "Un délai d'inactivité plus long conserve plus longtemps les flux inactifs et leurs ports SNAT : il aggrave l'épuisement." }
    references:
      - title: Source Network Address Translation (SNAT) for outbound connections
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-outbound-connections
      - title: Outbound rules for Azure Load Balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/outbound-rules

  # ------------------------------------------------------------------ 9
  - id: az700-qz-32-09
    objective: "3.1.8"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam publishes a web application through a public Standard load balancer named **LB-Web**:

        - The frontend **fe-in** (public IP address pip-in) is used by a load-balancing rule for TCP port 443, with outbound SNAT disabled.
        - The frontend **fe-out** (public IP address pip-out) is used by an outbound rule for the backend pool of the web servers.

        A management virtual machine named **VM-Mgmt** isn't in the backend pool. The IP configuration of its NIC has a Standard public IP address named **pip-mgmt**.

        A Gateway Load Balancer named **GWLB1**, whose backend pool contains third-party firewall appliances, is chained to fe-in. The security team reports that the outbound connections of the web servers and all the traffic of VM-Mgmt bypass the appliances.

        You need all this traffic to be inspected by the appliances of GWLB1. Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam publie une application web via un équilibreur de charge public Standard nommé **LB-Web** :

        - L'adresse frontale **fe-in** (adresse IP publique pip-in) est utilisée par une règle d'équilibrage de charge pour le port TCP 443, avec la SNAT sortante désactivée.
        - L'adresse frontale **fe-out** (adresse IP publique pip-out) est utilisée par une règle de trafic sortant pour le pool principal des serveurs web.

        Une machine virtuelle d'administration nommée **VM-Mgmt** n'est pas dans le pool principal. La configuration IP de sa carte réseau a une adresse IP publique Standard nommée **pip-mgmt**.

        Un équilibreur de charge de passerelle nommé **GWLB1**, dont le pool principal contient des appliances de pare-feu tierces, est chaîné à fe-in. L'équipe de sécurité signale que les connexions sortantes des serveurs web et tout le trafic de VM-Mgmt contournent les appliances.

        Vous devez faire inspecter tout ce trafic par les appliances de GWLB1. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Chain GWLB1 to the frontend IP configuration fe-out of LB-Web.", fr: "Chaîner GWLB1 à la configuration IP frontale fe-out de LB-Web." } }
        - { id: b, text: { en: "Create a route table with a 0.0.0.0/0 route whose next hop is the frontend IP address of GWLB1.", fr: "Créer une table de routage avec un itinéraire 0.0.0.0/0 dont le tronçon suivant est l'adresse IP frontale de GWLB1." } }
        - { id: c, text: { en: "Chain GWLB1 to the NIC IP configuration of VM-Mgmt that holds pip-mgmt.", fr: "Chaîner GWLB1 à la configuration IP de la carte réseau de VM-Mgmt qui porte pip-mgmt." } }
        - { id: d, text: { en: "Associate a NAT gateway with the subnets of the web servers and of VM-Mgmt.", fr: "Associer une passerelle NAT aux sous-réseaux des serveurs web et de VM-Mgmt." } }
        - { id: e, text: { en: "Create an HA ports load-balancing rule on LB-Web whose backend pool contains the appliances.", fr: "Créer sur LB-Web une règle d'équilibrage de charge Ports HA dont le pool principal contient les appliances." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Traffic goes through a Gateway Load Balancer only for the public frontends chained to it. To inspect outbound traffic, chain it to the frontend IP configurations used by the outbound rules, here fe-out. A Standard public IP configuration of a VM NIC can also reference the Gateway Load Balancer frontend, which brings the inbound and outbound traffic of VM-Mgmt through the appliances without any route.
        fr: |
          Le trafic ne traverse un équilibreur de charge de passerelle que pour les adresses frontales publiques chaînées à celui-ci. Pour inspecter le trafic sortant, chaînez-le aux configurations IP frontales utilisées par les règles de trafic sortant, ici fe-out. Une configuration IP publique Standard de carte réseau de VM peut aussi référencer l'adresse frontale de l'équilibreur de charge de passerelle, ce qui fait passer le trafic entrant et sortant de VM-Mgmt par les appliances sans aucun itinéraire.
      options:
        b: { en: "A Gateway Load Balancer frontend can't be the next hop of a user-defined route; insertion works only by chaining.", fr: "L'adresse frontale d'un équilibreur de charge de passerelle ne peut pas être le tronçon suivant d'un itinéraire défini par l'utilisateur ; l'insertion se fait uniquement par chaînage." }
        d: { en: "A NAT gateway takes precedence over outbound rules and instance-level public IP addresses: outbound traffic would leave through it, away from the chained frontends.", fr: "Une passerelle NAT l'emporte sur les règles de trafic sortant et les adresses IP publiques des instances : le trafic sortant passerait par elle, hors des adresses frontales chaînées." }
        e: { en: "An HA ports rule can't be created on a public load balancer such as LB-Web, and it wouldn't bring the traffic of VM-Mgmt through the appliances.", fr: "Une règle Ports HA ne peut pas être créée sur un équilibreur de charge public comme LB-Web, et elle ne ferait pas passer le trafic de VM-Mgmt par les appliances." }
    references:
      - title: Gateway load balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/gateway-overview

  # ------------------------------------------------------------------ 10
  - id: az700-qz-32-10
    objective: "3.1.7"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware runs a multiplayer game service on six virtual machines in three Azure regions. Each virtual machine has a Standard public IPv4 address with a DNS name label. The game servers listen on TCP port 7777 and don't serve HTTP.

        The game client resolves **play.proseware.com**, a CNAME record that points to a new Traffic Manager profile. You need to configure the profile to meet the following requirements:

        - Each DNS response must contain up to three IPv4 addresses of healthy servers, so that the client can try another server if the first one doesn't answer.
        - Each server must be checked on the port that the game uses.
        - A server must be removed from the DNS responses after a single failed check, and failures must be detected as quickly as Traffic Manager allows.

        How should you configure the profile? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware exploite un service de jeu multijoueur sur six machines virtuelles dans trois régions Azure. Chaque machine virtuelle dispose d'une adresse IPv4 publique Standard avec une étiquette de nom DNS. Les serveurs de jeu écoutent sur le port TCP 7777 et ne servent pas de HTTP.

        Le client du jeu résout **play.proseware.com**, un enregistrement CNAME qui pointe vers un nouveau profil Traffic Manager. Vous devez configurer le profil pour répondre aux exigences suivantes :

        - Chaque réponse DNS doit contenir jusqu'à trois adresses IPv4 de serveurs sains, pour que le client puisse essayer un autre serveur si le premier ne répond pas.
        - Chaque serveur doit être vérifié sur le port utilisé par le jeu.
        - Un serveur doit être retiré des réponses DNS après une seule vérification en échec, et les pannes doivent être détectées aussi vite que Traffic Manager le permet.

        Comment devez-vous configurer le profil ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Routing method: [[method]]

          Endpoints: [[endpoint]]

          Monitoring protocol: [[protocol]]

          Probing: [[probing]]
        fr: |
          Méthode de routage : [[method]]

          Points de terminaison : [[endpoint]]

          Protocole de supervision : [[protocol]]

          Sondage : [[probing]]
      slots:
        - id: method
          options:
            - { id: performance, text: Performance }
            - { id: weighted, text: Weighted }
            - { id: multivalue, text: MultiValue }
            - { id: priority, text: Priority }
        - id: endpoint
          options:
            - { id: azure, text: { en: "Azure endpoints that target the public IP address resources", fr: "Points de terminaison Azure qui ciblent les ressources d'adresse IP publique" } }
            - { id: extip, text: { en: "External endpoints that use the IPv4 addresses", fr: "Points de terminaison externes qui utilisent les adresses IPv4" } }
            - { id: extfqdn, text: { en: "External endpoints that use the DNS names of the addresses", fr: "Points de terminaison externes qui utilisent les noms DNS des adresses" } }
            - { id: nested, text: { en: "Nested endpoints, one child profile per region", fr: "Points de terminaison imbriqués, un profil enfant par région" } }
        - id: protocol
          options:
            - { id: http, text: "HTTP" }
            - { id: https, text: "HTTPS" }
            - { id: tcp, text: "TCP" }
        - id: probing
          options:
            - { id: i30f3, text: { en: "Interval 30 seconds, tolerated failures 3", fr: "Intervalle de 30 secondes, 3 échecs tolérés" } }
            - { id: i30f0, text: { en: "Interval 30 seconds, tolerated failures 0", fr: "Intervalle de 30 secondes, 0 échec toléré" } }
            - { id: i10f0, text: { en: "Interval 10 seconds, tolerated failures 0", fr: "Intervalle de 10 secondes, 0 échec toléré" } }
            - { id: i10f1, text: { en: "Interval 10 seconds, tolerated failures 1", fr: "Intervalle de 10 secondes, 1 échec toléré" } }
    answer:
      values: { method: multivalue, endpoint: extip, protocol: tcp, probing: i10f0 }
    explanation:
      correct:
        en: |
          MultiValue returns all the healthy endpoints in one response, up to a maximum return count (set to 3 here), so that the client can retry. It works only when all the endpoints are External endpoints specified as IPv4 or IPv6 addresses, even for addresses hosted in Azure. TCP monitoring checks that the game port accepts connections, a 10-second probing interval is the fastest available, and 0 tolerated failures marks an endpoint degraded after a single failed check.
        fr: |
          MultiValue renvoie tous les points de terminaison sains dans une seule réponse, jusqu'à un nombre maximal de retours (ici 3), pour que le client puisse réessayer. Il ne fonctionne que si tous les points de terminaison sont des points de terminaison externes définis par des adresses IPv4 ou IPv6, même pour des adresses hébergées dans Azure. La supervision TCP vérifie que le port du jeu accepte les connexions, un intervalle de sondage de 10 secondes est le plus rapide possible, et 0 échec toléré marque un point de terminaison comme dégradé après une seule vérification en échec.
      options:
        performance: { en: "Performance returns a single endpoint, the closest one, so the client gets no other address to retry.", fr: "Performance renvoie un seul point de terminaison, le plus proche ; le client n'obtient donc pas d'autre adresse pour réessayer." }
        weighted: { en: "Weighted returns one endpoint chosen by weight in each response.", fr: "Weighted renvoie un seul point de terminaison choisi selon son poids dans chaque réponse." }
        priority: { en: "Priority returns only the available endpoint with the lowest priority value.", fr: "Priority renvoie uniquement le point de terminaison disponible de plus faible valeur de priorité." }
        azure: { en: "MultiValue doesn't accept Azure endpoints: every endpoint must be External and given as an IP address.", fr: "MultiValue n'accepte pas les points de terminaison Azure : chaque point de terminaison doit être externe et défini par une adresse IP." }
        extfqdn: { en: "MultiValue endpoints must be IPv4 or IPv6 addresses, not FQDNs.", fr: "Les points de terminaison MultiValue doivent être des adresses IPv4 ou IPv6, pas des FQDN." }
        nested: { en: "A MultiValue profile can't be the parent of nested profiles, and child profiles aren't IP address endpoints.", fr: "Un profil MultiValue ne peut pas être le parent de profils imbriqués, et les profils enfants ne sont pas des points de terminaison d'adresse IP." }
        http: { en: "The servers don't serve HTTP, so an HTTP probe would fail on every endpoint.", fr: "Les serveurs ne servent pas de HTTP : une sonde HTTP échouerait sur chaque point de terminaison." }
        https: { en: "An HTTPS probe needs a TLS server that answers HTTP requests, which the game servers don't provide.", fr: "Une sonde HTTPS exige un serveur TLS qui répond aux requêtes HTTP, ce que les serveurs de jeu ne fournissent pas." }
        i30f3: { en: "This is the default: the endpoint is degraded only after the fourth consecutive failure, every 30 seconds.", fr: "C'est la valeur par défaut : le point de terminaison n'est dégradé qu'après le quatrième échec consécutif, toutes les 30 secondes." }
        i30f0: { en: "A single failure is enough, but a 30-second interval detects failures more slowly than the 10-second fast interval.", fr: "Un seul échec suffit, mais un intervalle de 30 secondes détecte les pannes plus lentement que l'intervalle rapide de 10 secondes." }
        i10f1: { en: "With 1 tolerated failure, the endpoint is degraded only after two consecutive failed checks.", fr: "Avec 1 échec toléré, le point de terminaison n'est dégradé qu'après deux vérifications consécutives en échec." }
    references:
      - title: Traffic Manager routing methods
        url: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-routing-methods
      - title: Azure Traffic Manager endpoint monitoring
        url: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-monitoring
