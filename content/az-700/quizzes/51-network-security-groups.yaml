chapter: 51-network-security-groups
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-51-01
    objective: "5.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A network security group named **NSG1** is associated with a subnet named **Subnet1**. NSG1 contains only the default security rules.

        You need to prevent the virtual machines in Subnet1 from connecting to the internet. Traffic inside the virtual network must remain allowed.

        What should you do?
      fr: |
        Un groupe de sécurité réseau nommé **NSG1** est associé à un sous-réseau nommé **Subnet1**. NSG1 ne contient que les règles de sécurité par défaut.

        Vous devez empêcher les machines virtuelles de Subnet1 de se connecter à Internet. Le trafic à l'intérieur du réseau virtuel doit rester autorisé.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Delete the AllowInternetOutBound default rule from NSG1.", fr: "Supprimer la règle par défaut AllowInternetOutBound de NSG1." } }
        - { id: b, text: { en: "Change the action of the AllowInternetOutBound default rule to Deny.", fr: "Remplacer l'action de la règle par défaut AllowInternetOutBound par Deny." } }
        - { id: c, text: { en: "Add an outbound rule with priority 4000 that denies traffic to the Internet service tag.", fr: "Ajouter une règle sortante de priorité 4000 qui refuse le trafic vers l'étiquette de service Internet." } }
        - { id: d, text: { en: "Add an outbound rule with priority 65100 that denies traffic to the Internet service tag.", fr: "Ajouter une règle sortante de priorité 65100 qui refuse le trafic vers l'étiquette de service Internet." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Default rules can't be deleted or changed, but a custom rule overrides them because custom priorities (100 to 4096) are always evaluated before the default rules (65000 and above). An outbound Deny rule to the Internet service tag at priority 4000 matches before AllowInternetOutBound (65001), while AllowVnetOutBound still allows traffic inside the virtual network.
        fr: |
          Les règles par défaut ne peuvent être ni supprimées ni modifiées, mais une règle personnalisée les remplace, car les priorités personnalisées (100 à 4096) sont toujours évaluées avant les règles par défaut (65000 et plus). Une règle sortante Deny vers l'étiquette de service Internet de priorité 4000 correspond avant AllowInternetOutBound (65001), tandis qu'AllowVnetOutBound continue d'autoriser le trafic à l'intérieur du réseau virtuel.
      options:
        a: { en: "Azure doesn't allow you to delete a default security rule; you can only override it with a custom rule.", fr: "Azure ne permet pas de supprimer une règle de sécurité par défaut ; vous pouvez seulement la remplacer par une règle personnalisée." }
        b: { en: "Default security rules can't be modified, so their action can't be changed.", fr: "Les règles de sécurité par défaut ne peuvent pas être modifiées : leur action ne peut donc pas être changée." }
        d: { en: "Custom rules accept priorities from 100 to 4096 only; 65100 isn't a valid priority for a rule that you create.", fr: "Les règles personnalisées n'acceptent que des priorités de 100 à 4096 ; 65100 n'est pas une priorité valide pour une règle que vous créez." }
    references:
      - title: Azure network security groups overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
      - title: Create, Change, or Delete Azure Network Security Groups
        url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-network-security-group

  # ------------------------------------------------------------------ 2
  - id: az700-qz-51-02
    objective: "5.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You plan to create an application security group named **asg-api** for the API servers of a virtual network named **VNet1** in the West Europe region.

        In the creation form, which setting must you specify in addition to the subscription, the resource group and the name?
      fr: |
        Vous prévoyez de créer un groupe de sécurité d'application nommé **asg-api** pour les serveurs d'API d'un réseau virtuel nommé **VNet1** dans la région West Europe.

        Dans le formulaire de création, quel paramètre devez-vous indiquer en plus de l'abonnement, du groupe de ressources et du nom ?
    body:
      options:
        - { id: a, text: { en: "The virtual network that the group belongs to", fr: "Le réseau virtuel auquel le groupe appartient" } }
        - { id: b, text: { en: "The region of the group", fr: "La région du groupe" } }
        - { id: c, text: { en: "The subnet that hosts the API servers", fr: "Le sous-réseau qui héberge les serveurs d'API" } }
        - { id: d, text: { en: "The network security group that uses the group", fr: "Le groupe de sécurité réseau qui utilise le groupe" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          An application security group is a regional resource created with a subscription, a resource group, a name and a region; it has no virtual network, subnet or rule setting. Its virtual network is fixed later by the first network interface that you add to it, and network interfaces can join only groups in their own location.
        fr: |
          Un groupe de sécurité d'application est une ressource régionale créée avec un abonnement, un groupe de ressources, un nom et une région ; il n'a aucun paramètre de réseau virtuel, de sous-réseau ou de règle. Son réseau virtuel est fixé plus tard par la première interface réseau que vous y ajoutez, et une interface réseau ne peut rejoindre que des groupes situés dans son propre emplacement.
      options:
        a: { en: "The group has no virtual network setting: the virtual network of the first network interface added to it determines which interfaces can join later.", fr: "Le groupe n'a pas de paramètre de réseau virtuel : le réseau virtuel de la première interface réseau ajoutée détermine les interfaces qui pourront le rejoindre ensuite." }
        c: { en: "Members are network interfaces, added after the group exists; the group isn't tied to a subnet.", fr: "Les membres sont des interfaces réseau, ajoutées une fois le groupe créé ; le groupe n'est lié à aucun sous-réseau." }
        d: { en: "Security rules reference the group after it's created; the group itself doesn't point to a network security group.", fr: "Les règles de sécurité référencent le groupe une fois celui-ci créé ; le groupe lui-même ne désigne aucun groupe de sécurité réseau." }
    references:
      - title: Azure Application Security Groups Overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
      - title: Create, Change, or Delete Azure Network Interfaces
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface

  # ------------------------------------------------------------------ 3
  - id: az700-qz-51-03
    objective: "5.1.2"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Your Microsoft Entra tenant contains two subscriptions named **Sub1** and **Sub2**. A network security group named **NSG1** is in Sub1, in the West Europe region, and is associated with a subnet named **Subnet1**.

        You have the following virtual networks. None of them are peered.

        | Virtual network | Subscription | Region | Subnets |
        | --- | --- | --- | --- |
        | VNet1 | Sub1 | West Europe | Subnet1, Subnet2 |
        | VNet3 | Sub1 | West Europe | Subnet-A |
        | VNet4 | Sub2 | West Europe | Subnet-B |
        | VNet5 | Sub1 | North Europe | Subnet-C |

        Which two subnets can you also associate with NSG1?

        NOTE: Each correct selection is worth one point.
      fr: |
        Votre locataire Microsoft Entra contient deux abonnements nommés **Sub1** et **Sub2**. Un groupe de sécurité réseau nommé **NSG1** se trouve dans Sub1, dans la région West Europe, et il est associé à un sous-réseau nommé **Subnet1**.

        Vous disposez des réseaux virtuels suivants. Aucun d'eux n'est relié par peering.

        | Réseau virtuel | Abonnement | Région | Sous-réseaux |
        | --- | --- | --- | --- |
        | VNet1 | Sub1 | West Europe | Subnet1, Subnet2 |
        | VNet3 | Sub1 | West Europe | Subnet-A |
        | VNet4 | Sub2 | West Europe | Subnet-B |
        | VNet5 | Sub1 | North Europe | Subnet-C |

        À quels deux sous-réseaux pouvez-vous aussi associer NSG1 ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: "Subnet2" }
        - { id: b, text: "Subnet-A" }
        - { id: c, text: "Subnet-B" }
        - { id: d, text: "Subnet-C" }
    answer: { optionIds: [a, b] }
    explanation:
      correct:
        en: |
          One network security group can be associated with many subnets, in the same virtual network or in other virtual networks, and peering isn't required. For a subnet, the NSG must exist in the same subscription and location as the virtual network: Subnet2 (VNet1) and Subnet-A (VNet3) are both in Sub1 and West Europe.
        fr: |
          Un même groupe de sécurité réseau peut être associé à de nombreux sous-réseaux, du même réseau virtuel ou d'autres réseaux virtuels, sans qu'un peering soit nécessaire. Pour un sous-réseau, le NSG doit exister dans le même abonnement et le même emplacement que le réseau virtuel : Subnet2 (VNet1) et Subnet-A (VNet3) sont tous deux dans Sub1 et West Europe.
      options:
        c: { en: "VNet4 is in Sub2; a subnet can be associated only with an NSG of the same subscription as its virtual network, even within one tenant.", fr: "VNet4 se trouve dans Sub2 ; un sous-réseau ne peut être associé qu'à un NSG du même abonnement que son réseau virtuel, même au sein d'un seul locataire." }
        d: { en: "VNet5 is in North Europe; the NSG must be in the same location as the virtual network of the subnet.", fr: "VNet5 se trouve dans North Europe ; le NSG doit être dans le même emplacement que le réseau virtuel du sous-réseau." }
    references:
      - title: Add, change, or delete a subnet
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-subnet

  # ------------------------------------------------------------------ 4
  - id: az700-qz-51-04
    objective: "5.1.5"
    difficulty: 2
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        A network security group named **NSG-Api** is associated with a subnet named **Subnet-Api** (10.1.4.0/24). Three partners connect to the API servers of Subnet-Api from the ranges 198.51.100.0/24, 203.0.113.0/25 and 192.0.2.64/26.

        You need to allow inbound TCP 443 and TCP 8443 from these three ranges to the servers of Subnet-Api. The solution must minimize the number of security rules.

        How many inbound rules should you create?
      fr: |
        Un groupe de sécurité réseau nommé **NSG-Api** est associé à un sous-réseau nommé **Subnet-Api** (10.1.4.0/24). Trois partenaires se connectent aux serveurs d'API de Subnet-Api depuis les plages 198.51.100.0/24, 203.0.113.0/25 et 192.0.2.64/26.

        Vous devez autoriser en entrée TCP 443 et TCP 8443 depuis ces trois plages vers les serveurs de Subnet-Api. La solution doit réduire au minimum le nombre de règles de sécurité.

        Combien de règles entrantes devez-vous créer ?
    body:
      options:
        - { id: a, text: "1" }
        - { id: b, text: "2" }
        - { id: c, text: "3" }
        - { id: d, text: "6" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Augmented security rules combine several explicit IP addresses and ranges, and several ports, in one rule. A single rule with the three partner ranges as source, 10.1.4.0/24 as destination and the ports 443 and 8443 meets the requirement. The restriction to remember applies to service tags and application security groups: a rule can't list several of them.
        fr: |
          Les règles de sécurité augmentées combinent plusieurs adresses et plages IP explicites, et plusieurs ports, dans une même règle. Une seule règle avec les trois plages partenaires comme source, 10.1.4.0/24 comme destination et les ports 443 et 8443 répond à l'exigence. La restriction à retenir concerne les étiquettes de service et les groupes de sécurité d'application : une règle ne peut pas en citer plusieurs.
      options:
        b: { en: "One rule per port isn't needed: a rule accepts a list of ports such as 443,8443.", fr: "Une règle par port n'est pas nécessaire : une règle accepte une liste de ports comme 443,8443." }
        c: { en: "One rule per range isn't needed: the source of a rule accepts several explicit ranges.", fr: "Une règle par plage n'est pas nécessaire : la source d'une règle accepte plusieurs plages explicites." }
        d: { en: "Six rules (one per range and port) is what you would need without augmented rules; it doesn't minimize the number of rules.", fr: "Six règles (une par plage et par port) seraient nécessaires sans règles augmentées ; cela ne réduit pas le nombre de règles au minimum." }
    references:
      - title: Azure network security groups overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview

  # ------------------------------------------------------------------ 5
  - id: az700-qz-51-05
    objective: "5.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A subnet named **Subnet-Web** hosts six web servers whose network interfaces are members of an application security group named **asg-web**. A network security group named **NSG-Web** is associated with Subnet-Web and contains an inbound rule with priority 100 that allows TCP 443 from the Internet service tag to asg-web.

        A web server named **VM-Web3** must stop receiving HTTPS connections from the internet but must stay in Subnet-Web. The other web servers must not be affected. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Un sous-réseau nommé **Subnet-Web** héberge six serveurs web dont les interfaces réseau sont membres d'un groupe de sécurité d'application nommé **asg-web**. Un groupe de sécurité réseau nommé **NSG-Web** est associé à Subnet-Web et contient une règle entrante de priorité 100 qui autorise TCP 443 depuis l'étiquette de service Internet vers asg-web.

        Un serveur web nommé **VM-Web3** doit cesser de recevoir des connexions HTTPS depuis Internet, mais doit rester dans Subnet-Web. Les autres serveurs web ne doivent pas être affectés. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Remove the network interface of VM-Web3 from asg-web.", fr: "Retirer l'interface réseau de VM-Web3 d'asg-web." } }
        - { id: b, text: { en: "Add the network interface of VM-Web3 to a second group named asg-blocked.", fr: "Ajouter l'interface réseau de VM-Web3 à un second groupe nommé asg-blocked." } }
        - { id: c, text: { en: "Add a rule with priority 90 that denies TCP 443 from Internet to asg-web.", fr: "Ajouter une règle de priorité 90 qui refuse TCP 443 depuis Internet vers asg-web." } }
        - { id: d, text: { en: "Dissociate NSG-Web from Subnet-Web, and then associate it again.", fr: "Dissocier NSG-Web de Subnet-Web, puis l'associer de nouveau." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A rule that references an application security group applies only to its member network interfaces. Removing VM-Web3's interface from asg-web takes it out of the allow rule, so its HTTPS traffic from the internet falls to DenyAllInbound, and no rule changes are needed.
        fr: |
          Une règle qui référence un groupe de sécurité d'application ne s'applique qu'aux interfaces réseau membres. Retirer l'interface de VM-Web3 d'asg-web la sort de la règle d'autorisation : son trafic HTTPS depuis Internet tombe alors sur DenyAllInbound, sans modifier aucune règle.
      options:
        b: { en: "An interface can belong to several groups; while it stays in asg-web, the allow rule still matches its traffic.", fr: "Une interface peut appartenir à plusieurs groupes ; tant qu'elle reste dans asg-web, la règle d'autorisation correspond toujours à son trafic." }
        c: { en: "This rule targets every member of asg-web, so it would block HTTPS to all six web servers.", fr: "Cette règle cible tous les membres d'asg-web : elle bloquerait HTTPS vers les six serveurs web." }
        d: { en: "Reassociating the same NSG leaves its rules and the group membership unchanged, so VM-Web3 still receives HTTPS.", fr: "Réassocier le même NSG laisse ses règles et l'appartenance au groupe inchangées : VM-Web3 reçoit toujours HTTPS." }
    references:
      - title: Azure Application Security Groups Overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
      - title: Create, Change, or Delete Azure Network Interfaces
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface

  # ------------------------------------------------------------------ 6
  - id: az700-qz-51-06
    objective: "5.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove has a virtual network named **VNet1** that contains the following subnets.

        | Subnet | Content | Network security group |
        | --- | --- | --- |
        | snet-app | Application servers, members of the application security group **asg-app** | None |
        | snet-tools | Build agents, not members of any application security group | None |
        | snet-pe | A private endpoint named **pe-st1** for a storage account, member of the application security group **asg-pe** | NSG-PE |

        NSG-PE contains the following inbound rules in addition to the default rules.

        | Priority | Source | Destination | Port | Access |
        | --- | --- | --- | --- | --- |
        | 100 | asg-app | asg-pe | TCP 443 | Allow |
        | 110 | VirtualNetwork | asg-pe | Any | Deny |

        The **Private endpoint network policy** setting of snet-pe is **Disabled**. Tests show that the build agents can still connect to pe-st1 over HTTPS.

        You need to ensure that only the application servers can connect to pe-st1.

        What should you do?
      fr: |
        Woodgrove dispose d'un réseau virtuel nommé **VNet1** qui contient les sous-réseaux suivants.

        | Sous-réseau | Contenu | Groupe de sécurité réseau |
        | --- | --- | --- |
        | snet-app | Serveurs d'applications, membres du groupe de sécurité d'application **asg-app** | Aucun |
        | snet-tools | Agents de build, membres d'aucun groupe de sécurité d'application | Aucun |
        | snet-pe | Un point de terminaison privé nommé **pe-st1** pour un compte de stockage, membre du groupe de sécurité d'application **asg-pe** | NSG-PE |

        NSG-PE contient les règles entrantes suivantes en plus des règles par défaut.

        | Priorité | Source | Destination | Port | Accès |
        | --- | --- | --- | --- | --- |
        | 100 | asg-app | asg-pe | TCP 443 | Allow |
        | 110 | VirtualNetwork | asg-pe | Any | Deny |

        Le paramètre **Private endpoint network policy** (stratégie réseau des points de terminaison privés) de snet-pe a la valeur **Disabled**. Des tests montrent que les agents de build peuvent toujours se connecter à pe-st1 en HTTPS.

        Vous devez faire en sorte que seuls les serveurs d'applications puissent se connecter à pe-st1.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set the private endpoint network policy of snet-pe to Route tables.", fr: "Régler la stratégie réseau des points de terminaison privés de snet-pe sur Route tables." } }
        - { id: b, text: { en: "Set the private endpoint network policy of snet-pe to Network security groups.", fr: "Régler la stratégie réseau des points de terminaison privés de snet-pe sur Network security groups." } }
        - { id: c, text: { en: "Change the source of the rule with priority 110 from VirtualNetwork to Any.", fr: "Remplacer la source de la règle de priorité 110, VirtualNetwork, par Any." } }
        - { id: d, text: { en: "Associate NSG-PE with snet-tools so that its rules apply to the build agents.", fr: "Associer NSG-PE à snet-tools pour que ses règles s'appliquent aux agents de build." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Network policies are disabled by default for private endpoints, so the NSG of snet-pe doesn't filter traffic to pe-st1, including the rules that reference asg-pe. Enabling the **Network security groups** option of the private endpoint network policy makes rules 100 and 110 apply: the application servers match rule 100, and the build agents, which belong to VirtualNetwork, match the Deny rule 110.
        fr: |
          Les stratégies réseau sont désactivées par défaut pour les points de terminaison privés : le NSG de snet-pe ne filtre donc pas le trafic vers pe-st1, y compris les règles qui référencent asg-pe. Activer l'option **Network security groups** de la stratégie réseau des points de terminaison privés fait appliquer les règles 100 et 110 : les serveurs d'applications correspondent à la règle 100, et les agents de build, qui font partie de VirtualNetwork, correspondent à la règle Deny 110.
      options:
        a: { en: "The Route tables option enables user-defined routes for the private endpoints; NSG rules still aren't applied to them.", fr: "L'option Route tables active les itinéraires définis par l'utilisateur pour les points de terminaison privés ; les règles NSG ne leur sont toujours pas appliquées." }
        c: { en: "No rule of NSG-PE is applied to pe-st1 while the network policy is disabled, whatever its source.", fr: "Aucune règle de NSG-PE n'est appliquée à pe-st1 tant que la stratégie réseau est désactivée, quelle que soit sa source." }
        d: { en: "The rules of NSG-PE are inbound rules whose destination is asg-pe; on snet-tools they would never match the outbound connections of the build agents.", fr: "Les règles de NSG-PE sont des règles entrantes dont la destination est asg-pe ; sur snet-tools, elles ne correspondraient jamais aux connexions sortantes des agents de build." }
    references:
      - title: Manage network policies for private endpoints - Azure Private Link
        url: https://learn.microsoft.com/en-us/azure/private-link/disable-private-endpoint-network-policy
      - title: Configure an application security group with a private endpoint - Azure Private Link
        url: https://learn.microsoft.com/en-us/azure/private-link/configure-asg-private-endpoint

  # ------------------------------------------------------------------ 7
  - id: az700-qz-51-07
    objective: "5.1.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso has a public Standard load balancer named **LB-Web** whose frontend IP address is 198.51.100.10. The back-end pool contains two virtual machines, **VM-W1** (10.1.1.4) and **VM-W2** (10.1.1.5), connected to a subnet named **Subnet-Web** (10.1.1.0/24). A load-balancing rule forwards TCP 443 to the virtual machines, and a health probe checks HTTP on TCP 80.

        A network security group named **NSG-Web** is associated with Subnet-Web. The network interfaces have no network security group. A colleague replaced the rules of NSG-Web with the following inbound rules.

        | Priority | Name | Source | Destination | Port | Access |
        | --- | --- | --- | --- | --- | --- |
        | 100 | Allow-HTTPS | Internet | 198.51.100.10 | TCP 443 | Allow |
        | 4000 | Deny-All | Any | Any | Any | Deny |

        Since the change, the health probe marks both virtual machines as down, and users can't reach the website. You need to restore the service while keeping NSG-Web as restrictive as possible.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un équilibreur de charge public Standard nommé **LB-Web** dont l'adresse IP frontale est 198.51.100.10. Le pool principal contient deux machines virtuelles, **VM-W1** (10.1.1.4) et **VM-W2** (10.1.1.5), connectées à un sous-réseau nommé **Subnet-Web** (10.1.1.0/24). Une règle d'équilibrage de charge transfère TCP 443 vers les machines virtuelles, et une sonde d'intégrité vérifie HTTP sur TCP 80.

        Un groupe de sécurité réseau nommé **NSG-Web** est associé à Subnet-Web. Les interfaces réseau n'ont aucun groupe de sécurité réseau. Un collègue a remplacé les règles de NSG-Web par les règles entrantes suivantes.

        | Priorité | Nom | Source | Destination | Port | Accès |
        | --- | --- | --- | --- | --- | --- |
        | 100 | Allow-HTTPS | Internet | 198.51.100.10 | TCP 443 | Allow |
        | 4000 | Deny-All | Any | Any | Any | Deny |

        Depuis ce changement, la sonde d'intégrité marque les deux machines virtuelles comme hors service, et les utilisateurs ne peuvent plus joindre le site web. Vous devez rétablir le service tout en gardant NSG-Web aussi restrictif que possible.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Change the destination of Allow-HTTPS to 10.1.1.0/24.", fr: "Remplacer la destination d'Allow-HTTPS par 10.1.1.0/24." } }
        - { id: b, text: { en: "Change the source of Allow-HTTPS to the AzureLoadBalancer service tag.", fr: "Remplacer la source d'Allow-HTTPS par l'étiquette de service AzureLoadBalancer." } }
        - { id: c, text: { en: "Add an inbound rule with priority 200 that allows TCP 80 from the AzureLoadBalancer service tag.", fr: "Ajouter une règle entrante de priorité 200 qui autorise TCP 80 depuis l'étiquette de service AzureLoadBalancer." } }
        - { id: d, text: { en: "Add an inbound rule with priority 4050 that allows TCP 80 from the AzureLoadBalancer service tag.", fr: "Ajouter une règle entrante de priorité 4050 qui autorise TCP 80 depuis l'étiquette de service AzureLoadBalancer." } }
        - { id: e, text: { en: "Add an outbound rule with priority 200 that allows TCP 443 to the Internet service tag.", fr: "Ajouter une règle sortante de priorité 200 qui autorise TCP 443 vers l'étiquette de service Internet." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          For load-balanced virtual machines, the NSG sees the original client as the source and the virtual machine as the destination, never the frontend IP address: Allow-HTTPS must target 10.1.1.0/24. The probes come from 168.63.129.16 (AzureLoadBalancer); the default rule that allows them (65001) is evaluated after Deny-All, so a custom allow rule with a priority lower than 4000 is required.
        fr: |
          Pour des machines virtuelles derrière un équilibreur de charge, le NSG voit le client d'origine comme source et la machine virtuelle comme destination, jamais l'adresse IP frontale : Allow-HTTPS doit cibler 10.1.1.0/24. Les sondes viennent de 168.63.129.16 (AzureLoadBalancer) ; la règle par défaut qui les autorise (65001) est évaluée après Deny-All : une règle d'autorisation personnalisée de priorité inférieure à 4000 est donc nécessaire.
      options:
        b: { en: "The AzureLoadBalancer tag covers only the probe traffic; user connections keep the client's address as source.", fr: "L'étiquette AzureLoadBalancer ne couvre que le trafic des sondes ; les connexions des utilisateurs gardent l'adresse du client comme source." }
        d: { en: "Priority 4050 is evaluated after Deny-All (4000), which already drops the probe traffic.", fr: "La priorité 4050 est évaluée après Deny-All (4000), qui rejette déjà le trafic des sondes." }
        e: { en: "NSGs are stateful: the responses to allowed inbound connections need no outbound rule, and no custom outbound rule blocks them.", fr: "Les NSG sont avec état : les réponses aux connexions entrantes autorisées n'ont besoin d'aucune règle sortante, et aucune règle sortante personnalisée ne les bloque." }
    references:
      - title: Azure Load Balancer health probes
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview
      - title: Azure network security groups overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview

  # ------------------------------------------------------------------ 8
  - id: az700-qz-51-08
    objective: "5.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        A virtual network named **VNet1** contains the following virtual machines. No route table is associated with the subnets.

        | Virtual machine | IP address | Subnet | NSG of the subnet | NSG of the network interface |
        | --- | --- | --- | --- | --- |
        | VM1 | 10.1.1.4 | Subnet1 | NSG-S1 | None |
        | VM2 | 10.1.1.5 | Subnet1 | NSG-S1 | NSG-N2 |
        | VM3 | 10.1.2.4 | Subnet2 | None | NSG-N3 |

        The network security groups contain the following custom rules in addition to the default rules.

        | NSG | Direction | Priority | Source | Destination | Port | Access |
        | --- | --- | --- | --- | --- | --- | --- |
        | NSG-S1 | Inbound | 100 | VirtualNetwork | Any | TCP 445 | Deny |
        | NSG-N2 | Inbound | 100 | 10.1.1.4 | Any | TCP 445 | Allow |
        | NSG-N3 | Outbound | 100 | Any | VirtualNetwork | Any | Deny |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un réseau virtuel nommé **VNet1** contient les machines virtuelles suivantes. Aucune table de routage n'est associée aux sous-réseaux.

        | Machine virtuelle | Adresse IP | Sous-réseau | NSG du sous-réseau | NSG de l'interface réseau |
        | --- | --- | --- | --- | --- |
        | VM1 | 10.1.1.4 | Subnet1 | NSG-S1 | Aucun |
        | VM2 | 10.1.1.5 | Subnet1 | NSG-S1 | NSG-N2 |
        | VM3 | 10.1.2.4 | Subnet2 | Aucun | NSG-N3 |

        Les groupes de sécurité réseau contiennent les règles personnalisées suivantes en plus des règles par défaut.

        | NSG | Direction | Priorité | Source | Destination | Port | Accès |
        | --- | --- | --- | --- | --- | --- | --- |
        | NSG-S1 | Entrant | 100 | VirtualNetwork | Any | TCP 445 | Deny |
        | NSG-N2 | Entrant | 100 | 10.1.1.4 | Any | TCP 445 | Allow |
        | NSG-N3 | Sortant | 100 | Any | VirtualNetwork | Any | Deny |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "VM1 can open an SMB connection (TCP 445) to VM2.", fr: "VM1 peut ouvrir une connexion SMB (TCP 445) vers VM2." } }
        - { id: s2, text: { en: "VM2 can open an RDP connection (TCP 3389) to VM3.", fr: "VM2 peut ouvrir une connexion RDP (TCP 3389) vers VM3." } }
        - { id: s3, text: { en: "If you dissociate NSG-S1 from Subnet1, VM1 can open an SMB connection (TCP 445) to VM2.", fr: "Si vous dissociez NSG-S1 de Subnet1, VM1 peut ouvrir une connexion SMB (TCP 445) vers VM2." } }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          Inbound traffic is evaluated by the subnet NSG and then by the interface NSG, and this order also applies inside a subnet: NSG-S1 denies TCP 445 from VirtualNetwork before NSG-N2 can allow it (No). VM2 to VM3 passes the default VNet rules in NSG-N2, NSG-S1 and NSG-N3; the outbound Deny of NSG-N3 doesn't drop VM3's replies because NSGs are stateful (Yes). Without NSG-S1, only NSG-N2 filters the traffic to VM2, and its rule 100 allows 10.1.1.4 (Yes).
        fr: |
          Le trafic entrant est évalué par le NSG du sous-réseau puis par celui de l'interface, et cet ordre s'applique aussi à l'intérieur d'un sous-réseau : NSG-S1 refuse TCP 445 depuis VirtualNetwork avant que NSG-N2 puisse l'autoriser (Non). VM2 vers VM3 passe par les règles par défaut du réseau virtuel dans NSG-N2, NSG-S1 et NSG-N3 ; la règle sortante Deny de NSG-N3 ne bloque pas les réponses de VM3, car les NSG sont avec état (Oui). Sans NSG-S1, seul NSG-N2 filtre le trafic vers VM2, et sa règle 100 autorise 10.1.1.4 (Oui).
      options:
        s1: { en: "Being in the same subnet doesn't bypass the subnet NSG: its inbound rules are processed first, even for intra-subnet traffic.", fr: "Être dans le même sous-réseau ne permet pas de contourner le NSG du sous-réseau : ses règles entrantes sont traitées en premier, même pour le trafic intra-sous-réseau." }
        s2: { en: "The outbound rule of NSG-N3 applies to connections that VM3 opens, not to the return traffic of a connection that VM2 opened.", fr: "La règle sortante de NSG-N3 s'applique aux connexions ouvertes par VM3, pas au trafic de retour d'une connexion ouverte par VM2." }
    references:
      - title: How Network Security Groups Filter Network Traffic in Azure
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works

  # ------------------------------------------------------------------ 9
  - id: az700-qz-51-09
    objective: "5.1.3"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        A virtual network named **VNet1** contains the following subnets and virtual machines.

        | Subnet | Virtual machine | Application security group |
        | --- | --- | --- |
        | Subnet-Web (10.1.1.0/24) | VM-W1 | asg-web |
        | Subnet-App (10.1.2.0/24) | VM-A1, VM-A2 | asg-app |
        | Subnet-App (10.1.2.0/24) | VM-T1 (monitoring tools) | None |
        | Subnet-Jump (10.1.9.0/24) | VM-J1 (10.1.9.4) | None |

        A network security group named **NSG-App** is associated with Subnet-App. No other network security group applies to these virtual machines. The inbound rules of NSG-App are shown in the following table.

        Answer each prompt by selecting the rule that processes the connection.

        NOTE: Each correct selection is worth one point.
      fr: |
        Un réseau virtuel nommé **VNet1** contient les sous-réseaux et les machines virtuelles suivants.

        | Sous-réseau | Machine virtuelle | Groupe de sécurité d'application |
        | --- | --- | --- |
        | Subnet-Web (10.1.1.0/24) | VM-W1 | asg-web |
        | Subnet-App (10.1.2.0/24) | VM-A1, VM-A2 | asg-app |
        | Subnet-App (10.1.2.0/24) | VM-T1 (outils de supervision) | Aucun |
        | Subnet-Jump (10.1.9.0/24) | VM-J1 (10.1.9.4) | Aucun |

        Un groupe de sécurité réseau nommé **NSG-App** est associé à Subnet-App. Aucun autre groupe de sécurité réseau ne s'applique à ces machines virtuelles. Les règles entrantes de NSG-App figurent dans le tableau suivant.

        Répondez à chaque consigne en sélectionnant la règle qui traite la connexion.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - { id: p1, text: { en: "An RDP connection (TCP 3389) from VM-J1 to VM-A1", fr: "Une connexion RDP (TCP 3389) de VM-J1 vers VM-A1" } }
        - { id: p2, text: { en: "A connection on TCP 8080 from VM-W1 to VM-T1", fr: "Une connexion sur TCP 8080 de VM-W1 vers VM-T1" } }
      grid:
        header: [{ en: "Priority", fr: "Priorité" }, { en: Name, fr: Nom }, Source, Destination, Port, { en: Access, fr: Accès }]
        rows:
          - [{ text: "100" }, { text: Allow-Web-App, area: r100 }, { text: asg-web }, { text: asg-app }, { text: "TCP 8080" }, { text: Allow }]
          - [{ text: "110" }, { text: Deny-To-App, area: r110 }, { text: Any }, { text: asg-app }, { text: Any }, { text: Deny }]
          - [{ text: "120" }, { text: Allow-Jump-RDP, area: r120 }, { text: 10.1.9.0/24 }, { text: Any }, { text: "TCP 3389" }, { text: Allow }]
          - [{ text: "65000" }, { text: AllowVnetInBound, area: r65000 }, { text: VirtualNetwork }, { text: VirtualNetwork }, { text: Any }, { text: Allow }]
          - [{ text: "65001" }, { text: AllowAzureLoadBalancerInBound, area: r65001 }, { text: AzureLoadBalancer }, { text: Any }, { text: Any }, { text: Allow }]
          - [{ text: "65500" }, { text: DenyAllInBound, area: r65500 }, { text: Any }, { text: Any }, { text: Any }, { text: Deny }]
    answer:
      values: { p1: r110, p2: r65000 }
    explanation:
      correct:
        en: |
          Rules are processed by priority until the first match, and a rule with an application security group as destination matches only the members of that group. RDP from VM-J1 to VM-A1 doesn't match Allow-Web-App (the source isn't in asg-web) but matches Deny-To-App, which is evaluated before Allow-Jump-RDP. VM-T1 isn't a member of asg-app, so TCP 8080 from VM-W1 matches neither 100 nor 110 nor 120 and is allowed by AllowVnetInBound.
        fr: |
          Les règles sont traitées par priorité jusqu'à la première correspondance, et une règle dont la destination est un groupe de sécurité d'application ne correspond qu'aux membres de ce groupe. Le RDP de VM-J1 vers VM-A1 ne correspond pas à Allow-Web-App (la source n'est pas dans asg-web) mais correspond à Deny-To-App, évaluée avant Allow-Jump-RDP. VM-T1 n'est pas membre d'asg-app : TCP 8080 depuis VM-W1 ne correspond ni à 100, ni à 110, ni à 120, et il est autorisé par AllowVnetInBound.
      options:
        r120: { en: "Allow-Jump-RDP would allow the RDP connection, but Deny-To-App (110) matches first for every member of asg-app.", fr: "Allow-Jump-RDP autoriserait la connexion RDP, mais Deny-To-App (110) correspond d'abord pour tous les membres d'asg-app." }
        r100: { en: "Allow-Web-App targets asg-app; VM-T1 isn't a member, so the rule doesn't match the connection to VM-T1.", fr: "Allow-Web-App cible asg-app ; VM-T1 n'en est pas membre, donc la règle ne correspond pas à la connexion vers VM-T1." }
    references:
      - title: Azure Application Security Groups Overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
      - title: Azure network security groups overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview

  # ------------------------------------------------------------------ 10
  - id: az700-qz-51-10
    objective: "5.1.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware has a virtual network named **VNet-Hub** (10.1.0.0/16) in the West Europe region. VNet-Hub is peered with **VNet-Spoke** (10.2.0.0/16) and has a site-to-site VPN connection to the on-premises network 10.50.0.0/16. No route table is associated with the subnets.

        A network security group named **NSG-App** is associated with a subnet named **Subnet-App** (10.1.2.0/24). NSG-App contains only the default rules. You need to configure the outbound rules of NSG-App to meet the following requirements:

        - The virtual machines in Subnet-App can connect to on-premises servers over TCP 443.
        - The virtual machines can connect to Azure SQL Database in West Europe over TCP 1433.
        - The virtual machines can't open any other outbound connection.

        How should you complete the outbound rules? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un réseau virtuel nommé **VNet-Hub** (10.1.0.0/16) dans la région West Europe. VNet-Hub est relié par peering à **VNet-Spoke** (10.2.0.0/16) et possède une connexion VPN de site à site vers le réseau local 10.50.0.0/16. Aucune table de routage n'est associée aux sous-réseaux.

        Un groupe de sécurité réseau nommé **NSG-App** est associé à un sous-réseau nommé **Subnet-App** (10.1.2.0/24). NSG-App ne contient que les règles par défaut. Vous devez configurer les règles sortantes de NSG-App pour répondre aux exigences suivantes :

        - Les machines virtuelles de Subnet-App peuvent se connecter aux serveurs locaux en TCP 443.
        - Les machines virtuelles peuvent se connecter à Azure SQL Database dans West Europe en TCP 1433.
        - Les machines virtuelles ne peuvent ouvrir aucune autre connexion sortante.

        Comment devez-vous compléter les règles sortantes ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Priority 100 - Allow TCP 443 to: [[onprem]]

          Priority 110 - Allow TCP 1433 to: [[sql]]

          Priority 200 - Deny any protocol to: [[deny]]

          Priority 210 - Deny any protocol to: Internet
        fr: |
          Priorité 100 - Allow TCP 443 vers : [[onprem]]

          Priorité 110 - Allow TCP 1433 vers : [[sql]]

          Priorité 200 - Deny tout protocole vers : [[deny]]

          Priorité 210 - Deny tout protocole vers : Internet
      slots:
        - id: onprem
          options:
            - { id: vnet, text: "VirtualNetwork" }
            - { id: range, text: "10.50.0.0/16" }
            - { id: inet, text: "Internet" }
            - { id: gwm, text: "GatewayManager" }
        - id: sql
          options:
            - { id: sql, text: "Sql" }
            - { id: cloudweu, text: "AzureCloud.WestEurope" }
            - { id: sqlweu, text: "Sql.WestEurope" }
            - { id: stweu, text: "Storage.WestEurope" }
        - id: deny
          options:
            - { id: hub, text: "10.1.0.0/16" }
            - { id: subnet, text: "10.1.2.0/24" }
            - { id: cloud, text: "AzureCloud" }
            - { id: vnettag, text: "VirtualNetwork" }
    answer:
      values: { onprem: range, sql: sqlweu, deny: vnettag }
    explanation:
      correct:
        en: |
          The on-premises servers are reached through the VPN, so the allow rule uses their range, 10.50.0.0/16; the VirtualNetwork tag would also open TCP 443 to VNet-Hub and VNet-Spoke. The regional tag Sql.WestEurope limits SQL access to West Europe. The default AllowVnetOutBound rule must then be overridden by a Deny to VirtualNetwork, which covers the virtual network, the peered network and the on-premises ranges, while rule 210 overrides AllowInternetOutBound.
        fr: |
          Les serveurs locaux sont joints par le VPN : la règle d'autorisation utilise leur plage, 10.50.0.0/16 ; l'étiquette VirtualNetwork ouvrirait aussi TCP 443 vers VNet-Hub et VNet-Spoke. L'étiquette régionale Sql.WestEurope limite l'accès SQL à West Europe. La règle par défaut AllowVnetOutBound doit ensuite être remplacée par un Deny vers VirtualNetwork, qui couvre le réseau virtuel, le réseau relié par peering et les plages locales, tandis que la règle 210 remplace AllowInternetOutBound.
      options:
        vnet: { en: "VirtualNetwork includes VNet-Hub and VNet-Spoke: TCP 443 would be allowed to destinations other than on-premises.", fr: "VirtualNetwork inclut VNet-Hub et VNet-Spoke : TCP 443 serait autorisé vers d'autres destinations que le réseau local." }
        sql: { en: "The Sql tag without a region covers Azure SQL in every region, which is broader than required.", fr: "L'étiquette Sql sans région couvre Azure SQL dans toutes les régions, ce qui est plus large que nécessaire." }
        hub: { en: "10.1.0.0/16 doesn't cover VNet-Spoke or the on-premises network, which AllowVnetOutBound would still allow on every port.", fr: "10.1.0.0/16 ne couvre ni VNet-Spoke ni le réseau local, que AllowVnetOutBound autoriserait encore sur tous les ports." }
    references:
      - title: Azure service tags overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/service-tags-overview
      - title: Azure network security groups overview
        url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
