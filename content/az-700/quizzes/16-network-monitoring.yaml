chapter: 16-network-monitoring
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-16-01
    objective: "1.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum wants a Network Watcher connection monitor to test, every minute, the reachability of an Azure SQL endpoint from a Windows Server named **SRV-PAR1** in its Paris datacenter.

        What must be configured on SRV-PAR1 so that it can be a source of the connection monitor?
      fr: |
        Adatum veut qu'un moniteur de connexion de Network Watcher teste, chaque minute, l'accessibilité d'un point de terminaison Azure SQL depuis un serveur Windows Server nommé **SRV-PAR1** de son centre de données de Paris.

        Que faut-il configurer sur SRV-PAR1 pour qu'il puisse être une source du moniteur de connexion ?
    body:
      options:
        - { id: a, text: { en: "The Log Analytics agent, connected to a Log Analytics workspace", fr: "L'agent Log Analytics, connecté à un espace de travail Log Analytics" } }
        - { id: b, text: { en: "The Network Watcher Agent extension, installed directly on the server", fr: "L'extension Network Watcher Agent, installée directement sur le serveur" } }
        - { id: c, text: { en: "The Azure Arc agent, then the Azure Monitor Agent on the server", fr: "L'agent Azure Arc, puis l'agent Azure Monitor sur le serveur" } }
        - { id: d, text: { en: "The Dependency agent, with VM insights enabled for the server", fr: "L'agent Dependency, avec VM Insights activé pour le serveur" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          On-premises sources of Connection monitor must be Azure Arc-enabled and run the Azure Monitor Agent; the portal can install the Azure Monitor Agent, but Azure Arc must be enabled first. Destinations, such as the Azure SQL endpoint, need no agent.
        fr: |
          Les sources locales du Moniteur de connexion doivent être activées avec Azure Arc et exécuter l'agent Azure Monitor ; le portail peut installer l'agent Azure Monitor, mais Azure Arc doit être activé d'abord. Les destinations, comme le point de terminaison Azure SQL, n'ont besoin d'aucun agent.
      options:
        a: { en: "The Log Analytics agent is no longer supported for on-premises monitoring with Connection monitor.", fr: "L'agent Log Analytics n'est plus pris en charge pour la supervision locale avec le Moniteur de connexion." }
        b: { en: "The Network Watcher Agent extension is the requirement for Azure VMs and scale sets, not for on-premises machines.", fr: "L'extension Network Watcher Agent est l'exigence des VM et groupes de machines virtuelles identiques Azure, pas des machines locales." }
        d: { en: "The Dependency agent maps processes for VM insights; it doesn't make a machine a Connection monitor source.", fr: "L'agent Dependency cartographie les processus pour VM Insights ; il ne fait pas d'une machine une source du Moniteur de connexion." }
    references:
      - title: Connection Monitor Overview - Azure Network Watcher
        url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview

  # ------------------------------------------------------------------ 2
  - id: az700-qz-16-02
    objective: "1.4.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam publishes a web shop through an Application Gateway Standard v2 in a virtual network protected by DDoS Network Protection. During a campaign, the shop receives a flood of HTTP GET requests (a layer 7 attack) that DDoS Protection doesn't stop.

        What should you add to mitigate this type of attack?
      fr: |
        Fabrikam publie une boutique en ligne par une Application Gateway Standard v2 dans un réseau virtuel protégé par DDoS Network Protection. Pendant une campagne, la boutique reçoit un flot de requêtes HTTP GET (une attaque de couche 7) que DDoS Protection n'arrête pas.

        Que devez-vous ajouter pour atténuer ce type d'attaque ?
    body:
      options:
        - { id: a, text: { en: "DDoS IP Protection on the public IP address of the application gateway", fr: "DDoS IP Protection sur l'adresse IP publique de la passerelle d'application" } }
        - { id: b, text: { en: "A web application firewall, by moving the application gateway to the WAF v2 tier", fr: "Un pare-feu d'applications web, en passant la passerelle d'application au niveau WAF v2" } }
        - { id: c, text: { en: "A network security group on the gateway subnet that limits HTTP requests per client", fr: "Un groupe de sécurité réseau sur le sous-réseau de la passerelle qui limite les requêtes HTTP par client" } }
        - { id: d, text: { en: "A NAT gateway on the gateway subnet that hides the public IP address of the shop", fr: "Une passerelle NAT sur le sous-réseau de la passerelle qui masque l'adresse IP publique de la boutique" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Azure DDoS Protection mitigates attacks at layers 3 and 4. Layer 7 attacks on a web application need a web application firewall, such as the WAF of Application Gateway, combined with DDoS Protection.
        fr: |
          Azure DDoS Protection atténue les attaques de couches 3 et 4. Les attaques de couche 7 contre une application web exigent un pare-feu d'applications web, comme le WAF d'Application Gateway, combiné à DDoS Protection.
      options:
        a: { en: "DDoS IP Protection has the same layer 3 and 4 mitigation as Network Protection, which already covers the public IP.", fr: "DDoS IP Protection offre la même atténuation de couches 3 et 4 que Network Protection, qui couvre déjà l'IP publique." }
        c: { en: "NSG rules allow or deny flows by 5-tuple; they don't inspect or count HTTP requests.", fr: "Les règles NSG autorisent ou refusent des flux par 5-tuple ; elles n'inspectent ni ne comptent les requêtes HTTP." }
        d: { en: "A NAT gateway provides outbound connectivity only; it doesn't filter inbound HTTP traffic.", fr: "Une passerelle NAT fournit uniquement une connectivité sortante ; elle ne filtre pas le trafic HTTP entrant." }
    references:
      - title: Azure DDoS Protection Overview
        url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-overview

  # ------------------------------------------------------------------ 3
  - id: az700-qz-16-03
    objective: "1.4.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A site-to-site IPsec connection named **cn-lyon** of a route-based VPN gateway stays disconnected after the Lyon office replaced its VPN device. You run Network Watcher VPN troubleshoot on cn-lyon, and the result reports the fault type `Authentication`.

        What should you do?
      fr: |
        Une connexion IPsec de site à site nommée **cn-lyon** d'une passerelle VPN basée sur des routes reste déconnectée depuis que l'agence de Lyon a remplacé son équipement VPN. Vous exécutez la résolution des problèmes de VPN de Network Watcher sur cn-lyon, et le résultat indique le type d'erreur `Authentication`.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Align the IKE and IPsec parameters of the device with a policy that Azure supports.", fr: "Aligner les paramètres IKE et IPsec de l'équipement sur une stratégie prise en charge par Azure." } }
        - { id: b, text: { en: "Update the public IP address of the device in the local network gateway.", fr: "Mettre à jour l'adresse IP publique de l'équipement dans la passerelle de réseau local." } }
        - { id: c, text: { en: "Set the same shared key on the device and on the cn-lyon connection.", fr: "Définir la même clé partagée sur l'équipement et sur la connexion cn-lyon." } }
        - { id: d, text: { en: "Resize the VPN gateway to a SKU with more CPU capacity.", fr: "Redimensionner la passerelle VPN vers une référence SKU plus puissante." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          For a connection, the `Authentication` fault type means that the preshared key doesn't match between the two ends. A new device often comes with a different key, so the key configured on the device and on the Azure connection must be the same.
        fr: |
          Pour une connexion, le type d'erreur `Authentication` signifie que la clé prépartagée ne correspond pas entre les deux extrémités. Un nouvel équipement arrive souvent avec une autre clé : la clé configurée sur l'équipement et sur la connexion Azure doit être la même.
      options:
        a: { en: "IKE policies that Azure doesn't support produce the `IkePolicyMismatch` fault type.", fr: "Des stratégies IKE non prises en charge par Azure produisent le type d'erreur `IkePolicyMismatch`." }
        b: { en: "An unreachable peer, for example a wrong device address, produces the `PeerReachability` fault type.", fr: "Un pair injoignable, par exemple une mauvaise adresse d'équipement, produit le type d'erreur `PeerReachability`." }
        d: { en: "CPU pressure is reported as `GatewayCPUUsageExceeded` on the gateway, not as an authentication fault of a connection.", fr: "Une surcharge du processeur est signalée par `GatewayCPUUsageExceeded` sur la passerelle, pas par une erreur d'authentification d'une connexion." }
    references:
      - title: VPN Troubleshoot Overview - Azure Network Watcher
        url: https://learn.microsoft.com/en-us/azure/network-watcher/vpn-troubleshoot-overview

  # ------------------------------------------------------------------ 4
  - id: az700-qz-16-04
    objective: "1.4.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has networking resources in six subscriptions. During a cleanup, an engineer finds a public IP address named **pip-agw-legacy** and must identify the resource that uses it, without knowing its subscription or resource group. No query or workbook may be written.

        In Azure Monitor network insights, what should the engineer use?
      fr: |
        Contoso dispose de ressources réseau dans six abonnements. Pendant un nettoyage, un ingénieur trouve une adresse IP publique nommée **pip-agw-legacy** et doit identifier la ressource qui l'utilise, sans connaître son abonnement ni son groupe de ressources. Aucune requête ni aucun classeur ne doit être écrit.

        Dans Network Insights d'Azure Monitor, que doit utiliser l'ingénieur ?
    body:
      options:
        - { id: a, text: { en: "The search box of the Network health view", fr: "La zone de recherche de la vue Network health" } }
        - { id: b, text: { en: "The IP address search of the Traffic tab", fr: "La recherche par adresse IP de l'onglet Traffic" } }
        - { id: c, text: { en: "The Sources tile of the Connectivity tab", fr: "La vignette Sources de l'onglet Connectivity" } }
        - { id: d, text: { en: "The next hop tool of the Diagnostic Toolkit", fr: "L'outil Tronçon suivant de la boîte à outils de diagnostic" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The Network health view of network insights covers all the selected subscriptions with no configuration, and its search returns a resource with its associated resources: searching for a public IP returns the IP and, for example, the application gateway that uses it.
        fr: |
          La vue Network health de Network Insights couvre tous les abonnements sélectionnés sans configuration, et sa recherche renvoie une ressource avec ses ressources associées : rechercher une IP publique renvoie l'IP et, par exemple, la passerelle d'application qui l'utilise.
      options:
        b: { en: "The Traffic tab searches an IP address to find the network security groups that apply to it, not the resource that owns a public IP.", fr: "L'onglet Traffic recherche une adresse IP pour trouver les groupes de sécurité réseau qui s'y appliquent, pas la ressource qui possède une IP publique." }
        c: { en: "The Connectivity tab shows the results of existing Connection monitor tests, grouped by sources and destinations.", fr: "L'onglet Connectivity montre les résultats des tests existants du Moniteur de connexion, regroupés par sources et destinations." }
        d: { en: "Next hop returns the routing decision for traffic from a VM to a destination; it doesn't look up resources.", fr: "Le tronçon suivant renvoie la décision de routage pour le trafic d'une VM vers une destination ; il ne recherche pas de ressources." }
    references:
      - title: Network Insights
        url: https://learn.microsoft.com/en-us/azure/network-watcher/network-insights-overview

  # ------------------------------------------------------------------ 5
  - id: az700-qz-16-05
    objective: "1.4.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware uses the classic secure score of Microsoft Defender for Cloud in the Azure portal. The following security controls of a subscription have unhealthy resources:

        | Security control | Max score | Healthy resources | Unhealthy resources |
        | --- | --- | --- | --- |
        | Secure management ports | 8 | 30 | 10 |
        | Restrict unauthorized network access | 4 | 2 | 6 |
        | Protect applications against DDoS attacks | 2 | 0 | 2 |
        | Encrypt data in transit | 4 | 15 | 5 |

        You can fully remediate only one control this week, and you need to gain as many control points as possible.

        Which control should you remediate?
      fr: |
        Litware utilise le degré de sécurisation classique de Microsoft Defender for Cloud dans le portail Azure. Les contrôles de sécurité suivants d'un abonnement ont des ressources non saines :

        | Contrôle de sécurité | Score maximal | Ressources saines | Ressources non saines |
        | --- | --- | --- | --- |
        | Secure management ports | 8 | 30 | 10 |
        | Restrict unauthorized network access | 4 | 2 | 6 |
        | Protect applications against DDoS attacks | 2 | 0 | 2 |
        | Encrypt data in transit | 4 | 15 | 5 |

        Vous ne pouvez corriger entièrement qu'un seul contrôle cette semaine, et vous devez gagner le plus de points possible sur les contrôles.

        Quel contrôle devez-vous corriger ?
    body:
      options:
        - { id: a, text: Secure management ports }
        - { id: b, text: Restrict unauthorized network access }
        - { id: c, text: Protect applications against DDoS attacks }
        - { id: d, text: Encrypt data in transit }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The points of a control per resource are its max score divided by its healthy and unhealthy resources, and the potential increase is that value multiplied by the unhealthy resources. Restrict unauthorized network access gives 4 ÷ 8 × 6 = 3 points, more than Secure management ports (8 ÷ 40 × 10 = 2), DDoS (2 ÷ 2 × 2 = 2) and Encrypt data in transit (4 ÷ 20 × 5 = 1).
        fr: |
          Les points d'un contrôle par ressource sont son score maximal divisé par ses ressources saines et non saines, et l'augmentation potentielle est cette valeur multipliée par les ressources non saines. Restrict unauthorized network access rapporte 4 ÷ 8 × 6 = 3 points, plus que Secure management ports (8 ÷ 40 × 10 = 2), DDoS (2 ÷ 2 × 2 = 2) et Encrypt data in transit (4 ÷ 20 × 5 = 1).
      options:
        a: { en: "It has the highest max score and the most unhealthy resources, but 30 of its 40 resources are already healthy: only 2 points remain.", fr: "Il a le score maximal le plus élevé et le plus de ressources non saines, mais 30 de ses 40 ressources sont déjà saines : il ne reste que 2 points." }
        c: { en: "All its resources are unhealthy, but its max score is 2, so fixing it gains 2 points.", fr: "Toutes ses ressources sont non saines, mais son score maximal est de 2 : le corriger rapporte 2 points." }
        d: { en: "Three quarters of its resources are healthy, so only 1 point remains to gain.", fr: "Les trois quarts de ses ressources sont saines : il ne reste qu'un point à gagner." }
    references:
      - title: Cloud Secure Score in Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls

  # ------------------------------------------------------------------ 6
  - id: az700-qz-16-06
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove has a virtual network named **VNet-Pay** in West Europe. Its subnets have network security groups that still have NSG flow logs created in 2024. The security team plans the following changes:

        - Enable a virtual network flow log on VNet-Pay that writes to a storage account named **stflowpay**, in West Europe, encrypted with a customer-managed key.
        - Rotate the customer-managed key of stflowpay every 90 days.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove dispose d'un réseau virtuel nommé **VNet-Pay** en West Europe. Ses sous-réseaux ont des groupes de sécurité réseau qui ont encore des journaux de flux NSG créés en 2024. L'équipe de sécurité prévoit les modifications suivantes :

        - Activer sur VNet-Pay un journal de flux de réseau virtuel qui écrit dans un compte de stockage nommé **stflowpay**, en West Europe, chiffré avec une clé gérée par le client.
        - Faire tourner la clé gérée par le client de stflowpay tous les 90 jours.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si elle est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Each record of the virtual network flow log identifies the NSG rule or the security admin rule that allowed or denied the flow.", fr: "Chaque enregistrement du journal de flux de réseau virtuel identifie la règle NSG ou la règle d'administration de la sécurité qui a autorisé ou refusé le flux." } }
        - { id: s2, text: { en: "After each key rotation, the virtual network flow log keeps writing to stflowpay without any action.", fr: "Après chaque rotation de clé, le journal de flux de réseau virtuel continue d'écrire dans stflowpay sans aucune action." } }
        - { id: s3, text: { en: "Keeping the existing NSG flow logs after you enable the virtual network flow log can produce duplicate records and extra cost.", fr: "Conserver les journaux de flux NSG existants après l'activation du journal de flux de réseau virtuel peut produire des enregistrements en double et un surcoût." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Virtual network flow log records are evaluated against NSG rules and Azure Virtual Network Manager security admin rules, and each record carries the rule that allowed or denied the flow. Changing or rotating the customer-managed key of the storage account stops the flow log until you disable and re-enable it. Running NSG flow logs and virtual network flow logs on the same workloads can duplicate the logging, so Microsoft recommends disabling the NSG flow logs first.
        fr: |
          Les enregistrements des journaux de flux de réseau virtuel sont évalués selon les règles NSG et les règles d'administration de la sécurité d'Azure Virtual Network Manager, et chaque enregistrement porte la règle qui a autorisé ou refusé le flux. Changer ou faire tourner la clé gérée par le client du compte de stockage arrête le journal de flux jusqu'à ce que vous le désactiviez puis le réactiviez. Exécuter des journaux de flux NSG et de réseau virtuel sur les mêmes charges de travail peut doubler la journalisation : Microsoft recommande de désactiver d'abord les journaux de flux NSG.
      options:
        s2: { en: "A key change stops logging; the flow log must be disabled and re-enabled after each rotation.", fr: "Un changement de clé arrête la journalisation ; le journal de flux doit être désactivé puis réactivé après chaque rotation." }
    references:
      - title: Virtual Network Flow Logs - Azure Network Watcher
        url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview

  # ------------------------------------------------------------------ 7
  - id: az700-qz-16-07
    objective: "1.4.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin uses Defender CSPM with agentless scanning. Attack path analysis shows a path that starts at a virtual machine named **VM-Front** and ends at a storage account that contains sensitive data:

        - VM-Front has a Standard public IP address and isn't behind any load balancer, application gateway or firewall.
        - The NSG of VM-Front allows TCP 3389 from any source. Administrators connect through Azure Bastion, deployed in AzureBastionSubnet of the same virtual network.
        - VM-Front has high-severity vulnerabilities and a managed identity that can read the storage account.

        You need to break the attack path. The managed identity must keep its access to the storage account.

        Which two actions should you perform? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin utilise Defender CSPM avec l'analyse sans agent. L'analyse du chemin d'attaque montre un chemin qui part d'une machine virtuelle nommée **VM-Front** et se termine sur un compte de stockage contenant des données sensibles :

        - VM-Front a une adresse IP publique Standard et n'est derrière aucun équilibreur de charge, passerelle d'application ni pare-feu.
        - Le NSG de VM-Front autorise TCP 3389 depuis n'importe quelle source. Les administrateurs se connectent par Azure Bastion, déployé dans AzureBastionSubnet du même réseau virtuel.
        - VM-Front a des vulnérabilités de gravité élevée et une identité managée qui peut lire le compte de stockage.

        Vous devez couper le chemin d'attaque. L'identité managée doit conserver son accès au compte de stockage.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Dissociate the public IP address from the network interface of VM-Front.", fr: "Dissocier l'adresse IP publique de l'interface réseau de VM-Front." } }
        - { id: b, text: { en: "Enable DDoS IP Protection on the public IP address of VM-Front.", fr: "Activer DDoS IP Protection sur l'adresse IP publique de VM-Front." } }
        - { id: c, text: { en: "Restrict the TCP 3389 rule of the NSG to the AzureBastionSubnet range.", fr: "Restreindre la règle TCP 3389 du NSG à la plage d'AzureBastionSubnet." } }
        - { id: d, text: { en: "Enable a virtual network flow log with traffic analytics on the network.", fr: "Activer un journal de flux de réseau virtuel avec traffic analytics sur le réseau." } }
        - { id: e, text: { en: "Enable soft delete for blobs and containers on the storage account.", fr: "Activer la suppression réversible des objets blob et des conteneurs sur le compte de stockage." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          An attack path starts at an entry point exposed outside the organization. Without its public IP address, and with no load balancer or gateway in front of it, VM-Front is no longer reachable from the internet. Restricting the RDP rule to the Bastion subnet also removes the internet exposure, because no rule then allows inbound internet traffic. Either change breaks the path while the identity keeps its permission.
        fr: |
          Un chemin d'attaque part d'un point d'entrée exposé à l'extérieur de l'organisation. Sans son adresse IP publique, et sans équilibreur de charge ni passerelle devant elle, VM-Front n'est plus joignable depuis Internet. Restreindre la règle RDP au sous-réseau Bastion supprime aussi l'exposition à Internet, car aucune règle n'autorise alors le trafic entrant depuis Internet. Chacune de ces modifications coupe le chemin, et l'identité garde son autorisation.
      options:
        b: { en: "DDoS IP Protection mitigates volumetric attacks but leaves RDP open to the internet: the entry point stays exposed.", fr: "DDoS IP Protection atténue les attaques volumétriques mais laisse RDP ouvert sur Internet : le point d'entrée reste exposé." }
        d: { en: "Flow logs and traffic analytics add visibility; they don't change the exposure of VM-Front.", fr: "Les journaux de flux et traffic analytics apportent de la visibilité ; ils ne changent pas l'exposition de VM-Front." }
        e: { en: "Soft delete helps recover deleted data, but the identity can still read the sensitive data through the path.", fr: "La suppression réversible aide à récupérer des données supprimées, mais l'identité peut toujours lire les données sensibles par le chemin." }
    references:
      - title: Identify and remediate attack paths in Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/how-to-manage-attack-path

  # ------------------------------------------------------------------ 8
  - id: az700-qz-16-08
    objective: "1.4.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware has a virtual network named **VNet-Web** protected by DDoS Network Protection. VNet-Web hosts an application gateway whose frontend uses the public IP address **pip-agw**. The security operations center uses Microsoft Sentinel on a Log Analytics workspace named **law-soc**.

        You need to send DDoS data to law-soc to meet the following requirements:

        - Analysts see the dropped and forwarded flows of each attack in near real time.
        - Analysts receive an event when a mitigation starts and when it stops.
        - The solution doesn't depend on a log category that is being retired.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'un réseau virtuel nommé **VNet-Web** protégé par DDoS Network Protection. VNet-Web héberge une passerelle d'application dont le front-end utilise l'adresse IP publique **pip-agw**. Le centre des opérations de sécurité utilise Microsoft Sentinel sur un espace de travail Log Analytics nommé **law-soc**.

        Vous devez envoyer des données DDoS vers law-soc pour répondre aux exigences suivantes :

        - Les analystes voient en quasi temps réel les flux abandonnés et transmis de chaque attaque.
        - Les analystes reçoivent un événement quand une atténuation commence et quand elle s'arrête.
        - La solution ne dépend pas d'une catégorie de journal en cours de mise hors service.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Create a diagnostic setting on: [[res]]
          Category for the flows: [[flows]]
          Category for the start and stop events: [[notif]]
          Table that the analysts query in law-soc: [[table]]
        fr: |
          Créer un paramètre de diagnostic sur : [[res]]
          Catégorie pour les flux : [[flows]]
          Catégorie pour les événements de début et de fin : [[notif]]
          Table que les analystes interrogent dans law-soc : [[table]]
      slots:
        - id: res
          options:
            - { id: pip, text: { en: "The public IP address pip-agw", fr: "L'adresse IP publique pip-agw" } }
            - { id: plan, text: { en: "The DDoS protection plan", fr: "Le plan de protection DDoS" } }
            - { id: vnet, text: { en: "The virtual network VNet-Web", fr: "Le réseau virtuel VNet-Web" } }
            - { id: agw, text: { en: "The application gateway", fr: "La passerelle d'application" } }
        - id: flows
          options:
            - { id: f-flowlogs, text: DDoSMitigationFlowLogs }
            - { id: f-reports, text: DDoSMitigationReports }
            - { id: f-notifs, text: DDoSProtectionNotifications }
            - { id: f-allmetrics, text: AllMetrics }
        - id: notif
          options:
            - { id: n-notifs, text: DDoSProtectionNotifications }
            - { id: n-reports, text: DDoSMitigationReports }
            - { id: n-flowlogs, text: DDoSMitigationFlowLogs }
            - { id: n-allmetrics, text: AllMetrics }
        - id: table
          options:
            - { id: diag, text: AzureDiagnostics }
            - { id: metrics, text: AzureMetrics }
            - { id: nta, text: NTANetAnalytics }
            - { id: activity, text: AzureActivity }
    answer:
      values: { res: pip, flows: f-flowlogs, notif: n-notifs, table: diag }
    explanation:
      correct:
        en: |
          DDoS telemetry is exposed by the protected public IP address, so the diagnostic setting is created on pip-agw. DDoSMitigationFlowLogs contains the dropped and forwarded flows during an attack, and DDoSProtectionNotifications reports when mitigation starts and stops. These resource logs land in the AzureDiagnostics table, filtered by Category.
        fr: |
          La télémétrie DDoS est exposée par l'adresse IP publique protégée : le paramètre de diagnostic se crée donc sur pip-agw. DDoSMitigationFlowLogs contient les flux abandonnés et transmis pendant une attaque, et DDoSProtectionNotifications signale le début et la fin de l'atténuation. Ces journaux de ressources arrivent dans la table AzureDiagnostics, filtrée par Category.
      options:
        plan: { en: "The DDoS logs and metrics are categories of the public IP address resource, not of the protection plan.", fr: "Les journaux et métriques DDoS sont des catégories de la ressource adresse IP publique, pas du plan de protection." }
        f-reports: { en: "DDoSMitigationReports gives aggregated five-minute reports and is being retired in favor of the flow logs.", fr: "DDoSMitigationReports fournit des rapports agrégés par tranches de cinq minutes et est en cours de mise hors service au profit des journaux de flux." }
        metrics: { en: "AzureMetrics holds metrics such as Under DDoS attack or not, not the resource log categories.", fr: "AzureMetrics contient des métriques comme Under DDoS attack or not, pas les catégories de journaux de ressources." }
        nta: { en: "NTANetAnalytics is the traffic analytics table for virtual network flow logs.", fr: "NTANetAnalytics est la table de traffic analytics pour les journaux de flux de réseau virtuel." }
    references:
      - title: "Tutorial: View Azure DDoS Protection logs in Log Analytics workspace"
        url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-view-diagnostic-logs
      - title: Azure DDoS Protection monitoring data reference
        url: https://learn.microsoft.com/en-us/azure/ddos-protection/monitor-ddos-protection-reference

  # ------------------------------------------------------------------ 9
  - id: az700-qz-16-09
    objective: "1.4.7"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Northwind has two Azure subscriptions. **Sub-Prod** has the Defender CSPM plan with agentless scanning. **Sub-Dev** has only the foundational CSPM capabilities, and no paid plan may be enabled on it. The network security team has the requirements listed in the answer area.

        Which tool should the team use for each requirement? To answer, drag the appropriate tools to the correct requirements. Each tool may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind dispose de deux abonnements Azure. **Sub-Prod** a le plan Defender CSPM avec l'analyse sans agent. **Sub-Dev** n'a que les fonctionnalités Foundational CSPM, et aucun plan payant ne peut y être activé. L'équipe de sécurité réseau a les exigences indiquées dans la zone de réponse.

        Quel outil l'équipe doit-elle utiliser pour chaque exigence ? Pour répondre, faites glisser les outils appropriés vers les exigences correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: recs, text: { en: "Secure score recommendations", fr: "Recommandations du degré de sécurisation" } }
        - { id: apa, text: { en: "Attack path analysis", fr: "Analyse du chemin d'attaque" } }
        - { id: cse, text: { en: "Cloud security explorer", fr: "Explorateur de sécurité du cloud" } }
        - { id: ipfv, text: { en: "Network Watcher IP flow verify", fr: "Vérification des flux IP de Network Watcher" } }
        - { id: insights, text: { en: "Azure Monitor network insights", fr: "Network Insights d'Azure Monitor" } }
      targets:
        - { id: t1, text: { en: "Sub-Dev: list the network misconfigurations, ranked by their effect on the score", fr: "Sub-Dev : lister les mauvaises configurations réseau, classées selon leur effet sur le score" } }
        - { id: t2, text: { en: "Sub-Prod: find now every internet-exposed VM whose managed identity can access a key vault, even if no attack path exists yet", fr: "Sub-Prod : trouver dès maintenant chaque VM exposée à Internet dont l'identité managée peut accéder à un coffre de clés, même si aucun chemin d'attaque n'existe encore" } }
        - { id: t3, text: { en: "Sub-Prod: see how an exploitable internet exposure leads to a critical database, with the recommendations that break it", fr: "Sub-Prod : voir comment une exposition à Internet exploitable mène à une base de données critique, avec les recommandations qui la coupent" } }
        - { id: t4, text: { en: "Sub-Dev: check whether the NSG rules of VM-Test allow TCP 3389 from 203.0.113.10, and which rule decides", fr: "Sub-Dev : vérifier si les règles NSG de VM-Test autorisent TCP 3389 depuis 203.0.113.10, et quelle règle décide" } }
    answer:
      mapping: { t1: recs, t2: cse, t3: apa, t4: ipfv }
    explanation:
      correct:
        en: |
          Secure score and recommendations are part of foundational CSPM, so they're the only Defender option for Sub-Dev. Cloud security explorer runs proactive graph queries, such as internet exposure combined with identity access, before any attack path exists, while attack path analysis shows the exploitable route to a critical asset and the recommendations that break it; both need Defender CSPM, available on Sub-Prod. IP flow verify tests one flow against the NSG rules of a VM network interface and returns the deciding rule.
        fr: |
          Le degré de sécurisation et les recommandations font partie de Foundational CSPM : c'est la seule option Defender pour Sub-Dev. L'explorateur de sécurité du cloud exécute des requêtes de graphe proactives, comme l'exposition à Internet combinée à l'accès d'une identité, avant qu'un chemin d'attaque n'existe, tandis que l'analyse du chemin d'attaque montre le parcours exploitable vers une ressource critique et les recommandations qui le coupent ; les deux exigent Defender CSPM, disponible sur Sub-Prod. La vérification des flux IP teste un flux par rapport aux règles NSG d'une interface réseau de VM et renvoie la règle décisive.
      options:
        insights: { en: "Network insights shows the health, topology and metrics of network resources; it doesn't rank misconfigurations or evaluate a single flow.", fr: "Network Insights montre l'intégrité, la topologie et les métriques des ressources réseau ; il ne classe pas les mauvaises configurations et n'évalue pas un flux précis." }
    references:
      - title: Build queries with cloud security explorer
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/how-to-manage-cloud-security-explorer
      - title: Identify and remediate attack paths in Microsoft Defender for Cloud
        url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/how-to-manage-attack-path

  # ------------------------------------------------------------------ 10
  - id: az700-qz-16-10
    objective: "1.4.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        A VM named **VM1** in resource group **RG1** has a single network interface named **vm1-nic** with the private IP address 10.1.0.4. An administrator at 203.0.113.25 can't open an RDP session (TCP 3389) to the public IP address of VM1. The RDP client uses a random source port.

        You need to use the Azure CLI to check whether the network security rules that apply to vm1-nic allow this traffic, whatever the source port of the client.

        How should you complete the command? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Une VM nommée **VM1** dans le groupe de ressources **RG1** a une seule interface réseau nommée **vm1-nic**, d'adresse IP privée 10.1.0.4. Un administrateur situé à 203.0.113.25 ne parvient pas à ouvrir une session RDP (TCP 3389) vers l'adresse IP publique de VM1. Le client RDP utilise un port source aléatoire.

        Vous devez utiliser Azure CLI pour vérifier si les règles de sécurité réseau qui s'appliquent à vm1-nic autorisent ce trafic, quel que soit le port source du client.

        Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        az network watcher test-ip-flow --resource-group RG1 --vm VM1 --nic vm1-nic \
          [[dirproto]] \
          --local [[local]] --remote [[remote]]
      slots:
        - id: dirproto
          options:
            - { id: intcp, text: "--direction Inbound --protocol TCP" }
            - { id: outtcp, text: "--direction Outbound --protocol TCP" }
            - { id: inudp, text: "--direction Inbound --protocol UDP" }
            - { id: inicmp, text: "--direction Inbound --protocol ICMP" }
        - id: local
          options:
            - { id: l-vm3389, text: "10.1.0.4:3389" }
            - { id: l-vmany, text: "10.1.0.4:*" }
            - { id: l-adm3389, text: "203.0.113.25:3389" }
            - { id: l-admany, text: "203.0.113.25:*" }
        - id: remote
          options:
            - { id: r-admany, text: "203.0.113.25:*" }
            - { id: r-adm3389, text: "203.0.113.25:3389" }
            - { id: r-vm3389, text: "10.1.0.4:3389" }
            - { id: r-vmany, text: "10.1.0.4:*" }
    answer:
      values: { dirproto: intcp, local: l-vm3389, remote: r-admany }
    explanation:
      correct:
        en: |
          IP flow verify tests a packet from the point of view of the VM network interface: an RDP session opened by the administrator is Inbound TCP. `--local` is the private IP address of the NIC with the destination port 3389, and `--remote` is the administrator's address; the `*` port is allowed on the remote side for an inbound test, which covers any source port.
        fr: |
          La vérification des flux IP teste un paquet du point de vue de l'interface réseau de la VM : une session RDP ouverte par l'administrateur est du TCP entrant (Inbound). `--local` est l'adresse IP privée de l'interface avec le port de destination 3389, et `--remote` est l'adresse de l'administrateur ; le port `*` est autorisé côté distant pour un test entrant, ce qui couvre n'importe quel port source.
      options:
        outtcp: { en: "Outbound would test traffic that VM1 initiates, not the RDP session that the administrator opens.", fr: "Outbound testerait le trafic initié par VM1, pas la session RDP ouverte par l'administrateur." }
        inicmp: { en: "IP flow verify accepts only TCP and UDP; ICMP checks need NSG diagnostics.", fr: "La vérification des flux IP n'accepte que TCP et UDP ; les vérifications ICMP exigent les diagnostics NSG." }
        l-vmany: { en: "A `*` port on the local side is allowed only for outbound tests, and the RDP destination port is 3389.", fr: "Un port `*` côté local n'est autorisé que pour les tests sortants, et le port de destination RDP est 3389." }
        r-adm3389: { en: "Port 3389 on the remote side would test a client source port of 3389, not any source port.", fr: "Le port 3389 côté distant testerait un port source client 3389, pas n'importe quel port source." }
    references:
      - title: az network watcher
        url: https://learn.microsoft.com/en-us/cli/azure/network/watcher?view=azure-cli-latest
