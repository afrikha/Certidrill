chapter: 22-point-to-site-vpn
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-22-01
    objective: "2.2.2"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        You are configuring point-to-site VPN on a route-based VPN gateway that runs in active-active mode. You need to enter the address pool from which the VPN clients receive their IP addresses. The range must not overlap the virtual network or the on-premises networks.

        What is the smallest address pool that you can use?
      fr: |
        Vous configurez le VPN de point à site sur une passerelle VPN basée sur des routes qui fonctionne en mode actif/actif. Vous devez saisir le pool d'adresses dans lequel les clients VPN reçoivent leur adresse IP. La plage ne doit chevaucher ni le réseau virtuel ni les réseaux locaux.

        Quel est le plus petit pool d'adresses que vous pouvez utiliser ?
    body:
      options:
        - { id: a, text: "/30" }
        - { id: b, text: "/29" }
        - { id: c, text: "/28" }
        - { id: d, text: "/27" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The point-to-site address pool must be at least a /29 for an active-passive gateway and at least a /28 for an active-active gateway. It's a private range that overlaps neither the virtual network nor the networks the clients connect from.
        fr: |
          Le pool d'adresses de point à site doit être au moins un /29 pour une passerelle actif/passif et au moins un /28 pour une passerelle actif/actif. C'est une plage privée qui ne chevauche ni le réseau virtuel ni les réseaux depuis lesquels les clients se connectent.
      options:
        a: { en: "A /30 is smaller than the minimum of both gateway modes.", fr: "Un /30 est plus petit que le minimum des deux modes de passerelle." }
        b: { en: "A /29 is the minimum for an active-passive gateway, not for an active-active one.", fr: "Un /29 est le minimum d'une passerelle actif/passif, pas d'une passerelle actif/actif." }
        d: { en: "A /27 works, but a smaller /28 is already accepted for an active-active gateway.", fr: "Un /27 fonctionne, mais un /28, plus petit, est déjà accepté pour une passerelle actif/actif." }
    references:
      - title: "Configure VPN gateway for P2S certificate authentication: Azure portal - Azure VPN Gateway"
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-certificate-gateway

  # ------------------------------------------------------------------ 2
  - id: az700-qz-22-02
    objective: "2.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam's point-to-site users authenticate with client certificates issued from a root certificate named **FabrikamRoot**, uploaded to the VPN gateway. A laptop of one user is stolen.

        You need to prevent this laptop from connecting while the other 300 users keep connecting with their current certificates. What should you do?
      fr: |
        Les utilisateurs de point à site de Fabrikam s'authentifient avec des certificats clients émis à partir d'un certificat racine nommé **FabrikamRoot**, chargé sur la passerelle VPN. Le portable d'un utilisateur est volé.

        Vous devez empêcher ce portable de se connecter, tandis que les 300 autres utilisateurs continuent de se connecter avec leurs certificats actuels. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Delete FabrikamRoot from the gateway, then upload it again", fr: "Supprimer FabrikamRoot de la passerelle, puis le charger de nouveau" } }
        - { id: b, text: { en: "Add the thumbprint of the laptop's client certificate to the revoked certificates", fr: "Ajouter l'empreinte numérique du certificat client du portable aux certificats révoqués" } }
        - { id: c, text: { en: "Add the thumbprint of FabrikamRoot to the revoked certificates of the gateway", fr: "Ajouter l'empreinte numérique de FabrikamRoot aux certificats révoqués de la passerelle" } }
        - { id: d, text: { en: "Reset the gateway to end the current session of the laptop", fr: "Réinitialiser la passerelle pour mettre fin à la session en cours du portable" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Revoking a single client certificate is done by adding its thumbprint to the revoked certificates list of the point-to-site configuration. Once the update completes, that certificate can no longer connect, while the certificates issued from the same root keep working.
        fr: |
          La révocation d'un seul certificat client se fait en ajoutant son empreinte numérique à la liste des certificats révoqués de la configuration de point à site. Une fois la mise à jour terminée, ce certificat ne peut plus se connecter, alors que les certificats émis à partir de la même racine continuent de fonctionner.
      options:
        a: { en: "Uploading the same root again trusts the same root: the stolen laptop's certificate stays valid, and users are cut off in between.", fr: "Charger de nouveau la même racine approuve la même racine : le certificat du portable volé reste valide, et les utilisateurs sont coupés entre-temps." }
        c: { en: "Revoking the root would block every client certificate issued from it, so all 300 users would lose access.", fr: "Révoquer la racine bloquerait tous les certificats clients qu'elle a émis : les 300 utilisateurs perdraient l'accès." }
        d: { en: "A reset reboots a gateway instance; the laptop could reconnect with its valid certificate afterward.", fr: "Une réinitialisation redémarre une instance de la passerelle ; le portable pourrait ensuite se reconnecter avec son certificat valide." }
    references:
      - title: "Configure VPN gateway for P2S certificate authentication: Azure portal - Azure VPN Gateway"
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-certificate-gateway

  # ------------------------------------------------------------------ 3
  - id: az700-qz-22-03
    objective: "2.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso has a route-based VPN gateway named **VPNGW1** that uses the VpnGw1AZ SKU. Its point-to-site configuration uses the IKEv2 tunnel type with certificate authentication, and 240 users connect at peak time.

        Next quarter, up to 400 users will connect at the same time over IKEv2. The users must keep their current VPN client configuration, and downtime and costs must be minimized.

        What should you do?
      fr: |
        Contoso dispose d'une passerelle VPN basée sur des routes nommée **VPNGW1** qui utilise la référence SKU VpnGw1AZ. Sa configuration de point à site utilise le type de tunnel IKEv2 avec l'authentification par certificat, et 240 utilisateurs se connectent en période de pointe.

        Au prochain trimestre, jusqu'à 400 utilisateurs se connecteront en même temps en IKEv2. Les utilisateurs doivent garder leur configuration de client VPN actuelle, et l'interruption comme les coûts doivent être réduits au minimum.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Change the tunnel type to IKEv2 and OpenVPN (SSL) so that each protocol gets its own 250-connection limit.", fr: "Changer le type de tunnel en IKEv2 et OpenVPN (SSL) pour que chaque protocole ait sa propre limite de 250 connexions." } }
        - { id: b, text: { en: "Deploy a second VpnGw1AZ gateway in the same virtual network, and move half of the users to it.", fr: "Déployer une seconde passerelle VpnGw1AZ dans le même réseau virtuel, et y déplacer la moitié des utilisateurs." } }
        - { id: c, text: { en: "Delete VPNGW1, create a VpnGw2AZ gateway, and distribute a new VPN client package to the users.", fr: "Supprimer VPNGW1, créer une passerelle VpnGw2AZ, et distribuer un nouveau package de client VPN aux utilisateurs." } }
        - { id: d, text: { en: "Change the SKU of VPNGW1 to VpnGw2AZ on its Configuration page; the gateway keeps its public IP address.", fr: "Changer la référence SKU de VPNGW1 en VpnGw2AZ dans sa page Configuration ; la passerelle garde son adresse IP publique." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          VpnGw1AZ accepts 250 IKEv2/OpenVPN connections and VpnGw2AZ accepts 500, so VpnGw2AZ is the least expensive SKU for 400 users. A resize within the AZ family takes about 45 minutes with minimal downtime and keeps the gateway's public IP address, so the clients don't need a new configuration.
        fr: |
          VpnGw1AZ accepte 250 connexions IKEv2/OpenVPN et VpnGw2AZ en accepte 500 : VpnGw2AZ est la référence la moins chère pour 400 utilisateurs. Un redimensionnement au sein de la famille AZ prend environ 45 minutes avec une interruption minimale et garde l'adresse IP publique de la passerelle : les clients n'ont pas besoin d'une nouvelle configuration.
      options:
        a: { en: "The 250-connection limit of VpnGw1AZ covers IKEv2 and OpenVPN together; only SSTP has a separate limit.", fr: "La limite de 250 connexions de VpnGw1AZ couvre IKEv2 et OpenVPN ensemble ; seul SSTP a une limite distincte." }
        b: { en: "A virtual network can contain only one VPN gateway.", fr: "Un réseau virtuel ne peut contenir qu'une seule passerelle VPN." }
        c: { en: "Re-creating the gateway changes its public IP address and forces a new client configuration, which breaks the requirements.", fr: "Recréer la passerelle change son adresse IP publique et impose une nouvelle configuration des clients, ce qui enfreint les exigences." }
    references:
      - title: About gateway SKUs
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-gateway-skus
      - title: Upgrade a VPN Gateway SKU - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/gateway-sku-upgrade

  # ------------------------------------------------------------------ 4
  - id: az700-qz-22-04
    objective: "2.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has a route-based VPN gateway named **VPNGW1** (VpnGw1AZ) whose point-to-site configuration uses IKEv2 and RADIUS authentication. The RADIUS server is a Network Policy Server named **NPS01** in the on-premises datacenter, which is connected to the virtual network through a site-to-site VPN connection whose status is **Connected**.

        On VPNGW1, the RADIUS server is entered as **nps01.corp.fabrikam.com**. VPNGW1 is registered as a RADIUS client on NPS01 with the same shared secret. Authentication fails, and NPS01 receives no request from the gateway.

        What should you do?
      fr: |
        Fabrikam dispose d'une passerelle VPN basée sur des routes nommée **VPNGW1** (VpnGw1AZ) dont la configuration de point à site utilise IKEv2 et l'authentification RADIUS. Le serveur RADIUS est un serveur Network Policy Server nommé **NPS01** dans le centre de données local, relié au réseau virtuel par une connexion VPN de site à site dont l'état est **Connecté**.

        Sur VPNGW1, le serveur RADIUS est saisi sous la forme **nps01.corp.fabrikam.com**. VPNGW1 est enregistrée comme client RADIUS sur NPS01 avec le même secret partagé. L'authentification échoue, et NPS01 ne reçoit aucune demande de la passerelle.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Replace nps01.corp.fabrikam.com with the IP address of NPS01 in the RADIUS settings of VPNGW1.", fr: "Remplacer nps01.corp.fabrikam.com par l'adresse IP de NPS01 dans les paramètres RADIUS de VPNGW1." } }
        - { id: b, text: { en: "Replace the site-to-site connection with an ExpressRoute connection to the on-premises datacenter.", fr: "Remplacer la connexion de site à site par une connexion ExpressRoute vers le centre de données local." } }
        - { id: c, text: { en: "Resize VPNGW1 to VpnGw2AZ, the smallest SKU that supports RADIUS authentication.", fr: "Redimensionner VPNGW1 en VpnGw2AZ, la plus petite référence SKU qui prend en charge l'authentification RADIUS." } }
        - { id: d, text: { en: "Add a second RADIUS server entry for nps01.corp.fabrikam.com with a higher score on VPNGW1.", fr: "Ajouter sur VPNGW1 une seconde entrée de serveur RADIUS pour nps01.corp.fabrikam.com avec un score plus élevé." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The RADIUS server can be entered by name or by IP address, but the VPN gateway may be unable to resolve the name of an on-premises server. Because NPS01 receives nothing although the site-to-site path and the shared secret are correct, entering the server's IP address lets the gateway send the requests through the tunnel.
        fr: |
          Le serveur RADIUS peut être saisi par son nom ou par son adresse IP, mais la passerelle VPN peut être incapable de résoudre le nom d'un serveur local. Comme NPS01 ne reçoit rien alors que le chemin de site à site et le secret partagé sont corrects, saisir l'adresse IP du serveur permet à la passerelle d'envoyer les demandes dans le tunnel.
      options:
        b: { en: "An ExpressRoute connection can't be used to reach an on-premises RADIUS server; the site-to-site connection is the supported path.", fr: "Une connexion ExpressRoute ne peut pas servir à joindre un serveur RADIUS local ; la connexion de site à site est le chemin pris en charge." }
        c: { en: "Every SKU except Basic supports RADIUS authentication, VpnGw1AZ included.", fr: "Toutes les références SKU sauf Basic prennent en charge l'authentification RADIUS, VpnGw1AZ compris." }
        d: { en: "A second server entered by the same name hits the same name resolution failure.", fr: "Un second serveur saisi sous le même nom se heurte au même échec de résolution de nom." }
    references:
      - title: Connect to a virtual network using P2S and RADIUS authentication - PowerShell - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-how-to-radius-ps

  # ------------------------------------------------------------------ 5
  - id: az700-qz-22-05
    objective: "2.2.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware has a virtual network named **VNet-Ops** with a route-based VPN gateway. A regional office contains 45 Windows Server 2022 servers, a firewall that supports IPsec VPN, and a static public IP address. Windows Admin Center, registered with Azure, manages all the servers.

        All the servers, and any server added later, must reach VNet-Ops by using private IP addresses. The solution must minimize the configuration done on each server.

        What should you use?
      fr: |
        Litware dispose d'un réseau virtuel nommé **VNet-Ops** avec une passerelle VPN basée sur des routes. Un bureau régional contient 45 serveurs Windows Server 2022, un pare-feu qui prend en charge le VPN IPsec et une adresse IP publique statique. Windows Admin Center, inscrit auprès d'Azure, gère tous les serveurs.

        Tous les serveurs, ainsi que tout serveur ajouté plus tard, doivent joindre VNet-Ops par des adresses IP privées. La solution doit réduire au minimum la configuration à faire sur chaque serveur.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Azure Network Adapter, added to each server from Windows Admin Center", fr: "Azure Network Adapter, ajouté à chaque serveur depuis Windows Admin Center" } }
        - { id: b, text: { en: "A site-to-site VPN connection between the gateway and the firewall", fr: "Une connexion VPN de site à site entre la passerelle et le pare-feu" } }
        - { id: c, text: { en: "A point-to-site VPN profile, installed on each server with a certificate", fr: "Un profil VPN de point à site, installé sur chaque serveur avec un certificat" } }
        - { id: d, text: { en: "Azure Bastion in VNet-Ops, used from each server through the portal", fr: "Azure Bastion dans VNet-Ops, utilisé depuis chaque serveur par le portail" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Azure Network Adapter creates a point-to-site connection per server, which suits a few servers in a site without a VPN device or public IP address. Here the office has 45 servers, an IPsec-capable firewall and a public IP address: one site-to-site connection serves the whole office, including future servers, with no configuration on the servers.
        fr: |
          Azure Network Adapter crée une connexion de point à site par serveur, ce qui convient à quelques serveurs d'un site sans appareil VPN ni adresse IP publique. Ici, le bureau a 45 serveurs, un pare-feu compatible IPsec et une adresse IP publique : une seule connexion de site à site dessert tout le bureau, futurs serveurs compris, sans configuration sur les serveurs.
      options:
        a: { en: "Azure Network Adapter works, but it is configured server by server, and every new server needs its own connection.", fr: "Azure Network Adapter fonctionne, mais il se configure serveur par serveur, et chaque nouveau serveur a besoin de sa propre connexion." }
        c: { en: "Point-to-site profiles also require a client and a certificate on each server, the opposite of the requirement.", fr: "Les profils de point à site exigent eux aussi un client et un certificat sur chaque serveur, à l'inverse de l'exigence." }
        d: { en: "Azure Bastion gives RDP or SSH access to Azure VMs from the portal; it doesn't route the servers' traffic to private IP addresses.", fr: "Azure Bastion donne un accès RDP ou SSH aux VM Azure depuis le portail ; il ne route pas le trafic des serveurs vers des adresses IP privées." }
    references:
      - title: Connect server to Azure Virtual Network - Azure Network Adapter
        url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/azure/use-azure-network-adapter

  # ------------------------------------------------------------------ 6
  - id: az700-qz-22-06
    objective: "2.2.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has a route-based VPN gateway named **VPNGW1** (VpnGw2AZ). Its point-to-site configuration uses the tunnel type **IKEv2 and OpenVPN (SSL)** and **Azure certificate** authentication. Consultants use Windows 11 laptops with the native Windows VPN client, installed from the VPN client package, and a client certificate in Current User\Personal.

        Consultants connect without issues from home. From several customer sites whose networks allow only outbound TCP port 443, their connections fail with a timeout.

        You need to ensure that the consultants can connect from these customer sites. The solution must not change the gateway configuration. What should you do?
      fr: |
        Woodgrove Bank dispose d'une passerelle VPN basée sur des routes nommée **VPNGW1** (VpnGw2AZ). Sa configuration de point à site utilise le type de tunnel **IKEv2 et OpenVPN (SSL)** et l'authentification **Certificat Azure**. Les consultants utilisent des portables Windows 11 avec le client VPN natif de Windows, installé depuis le package du client VPN, et un certificat client dans Current User\Personal.

        Les consultants se connectent sans problème depuis leur domicile. Depuis plusieurs sites clients dont les réseaux n'autorisent que le port TCP 443 en sortie, leurs connexions échouent sur un délai d'expiration.

        Vous devez faire en sorte que les consultants puissent se connecter depuis ces sites clients. La solution ne doit pas modifier la configuration de la passerelle. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Install the Azure VPN Client on the laptops and import azurevpnconfig_cert.xml from the AzureVPN folder of the client package.", fr: "Installer Azure VPN Client sur les portables et importer azurevpnconfig_cert.xml depuis le dossier AzureVPN du package client." } }
        - { id: b, text: { en: "Change the tunnel type of VPNGW1 to IKEv2 and SSTP (SSL) so that the native Windows client falls back to SSTP on TCP 443.", fr: "Changer le type de tunnel de VPNGW1 en IKEv2 et SSTP (SSL) pour que le client Windows natif se replie sur SSTP en TCP 443." } }
        - { id: c, text: { en: "Import vpnconfig.ovpn from the OpenVPN folder of the client package into the native Windows VPN client of each laptop.", fr: "Importer vpnconfig.ovpn depuis le dossier OpenVPN du package client dans le client VPN natif de Windows de chaque portable." } }
        - { id: d, text: { en: "Run VpnClientSetupAmd64 from the WindowsAmd64 folder again, then reinstall the client certificate with its private key.", fr: "Relancer VpnClientSetupAmd64 depuis le dossier WindowsAmd64, puis réinstaller le certificat client avec sa clé privée." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The native Windows client connects over IKEv2, which uses UDP 500 and 4500 and is blocked by networks that only open TCP 443. The gateway already offers OpenVPN, which uses TCP 443: with certificate authentication, the Azure VPN Client connects over OpenVPN by using the azurevpnconfig_cert.xml profile from the AzureVPN folder, with the existing client certificate.
        fr: |
          Le client Windows natif se connecte en IKEv2, qui utilise UDP 500 et 4500 et est bloqué par les réseaux qui n'ouvrent que TCP 443. La passerelle propose déjà OpenVPN, qui utilise TCP 443 : avec l'authentification par certificat, Azure VPN Client se connecte en OpenVPN avec le profil azurevpnconfig_cert.xml du dossier AzureVPN et le certificat client existant.
      options:
        b: { en: "Enabling SSTP on a gateway is no longer possible since August 31, 2026, and the change would modify the gateway configuration.", fr: "Activer SSTP sur une passerelle n'est plus possible depuis le 31 août 2026, et ce changement modifierait la configuration de la passerelle." }
        c: { en: "The OpenVPN folder is for OpenVPN clients; the native Windows VPN client doesn't support the OpenVPN protocol.", fr: "Le dossier OpenVPN sert aux clients OpenVPN ; le client VPN natif de Windows ne prend pas en charge le protocole OpenVPN." }
        d: { en: "The certificate works, since connections succeed from home; reinstalling the native client keeps IKEv2, which stays blocked.", fr: "Le certificat fonctionne, puisque les connexions réussissent depuis le domicile ; réinstaller le client natif garde IKEv2, qui reste bloqué." }
    references:
      - title: Configure a VPN client for P2S certificate authentication connections - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-vpn-client-certificate-windows-azure-vpn-client
      - title: SSTP protocol retirement and connections migration - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/ikev2-openvpn-from-sstp

  # ------------------------------------------------------------------ 7
  - id: az700-qz-22-07
    objective: "2.2.5"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum has a route-based VPN gateway named **VPNGW1** (VpnGw2AZ) in the Azure public cloud. Its point-to-site configuration uses the tunnel type **IKEv2 and OpenVPN (SSL)** and **Azure certificate** authentication. macOS users connect with the native macOS VPN client.

        Adatum plans to add **Microsoft Entra ID** as a second authentication type, with the Microsoft-registered Azure VPN Client app ID `c632b3df-fb67-4d84-bdcf-b95ad541b5c8` as the audience. Windows 11 users will then connect with the Azure VPN Client. Later, the R&D team will need its own custom app ID.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'une passerelle VPN basée sur des routes nommée **VPNGW1** (VpnGw2AZ) dans le cloud public Azure. Sa configuration de point à site utilise le type de tunnel **IKEv2 et OpenVPN (SSL)** et l'authentification **Certificat Azure**. Les utilisateurs macOS se connectent avec le client VPN natif de macOS.

        Adatum prévoit d'ajouter **Microsoft Entra ID** comme second type d'authentification, avec l'ID d'application Azure VPN Client inscrit par Microsoft `c632b3df-fb67-4d84-bdcf-b95ad541b5c8` comme audience. Les utilisateurs Windows 11 se connecteront ensuite avec Azure VPN Client. Plus tard, l'équipe R&D aura besoin de son propre ID d'application personnalisé.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: After the change, the macOS users can still authenticate with their certificates over IKEv2.
            fr: Après la modification, les utilisateurs macOS peuvent toujours s'authentifier avec leurs certificats en IKEv2.
        - id: s2
          text:
            en: Before the Windows 11 users can connect, an administrator must grant admin consent to the Azure VPN application in the tenant.
            fr: Avant que les utilisateurs Windows 11 puissent se connecter, un administrateur doit accorder le consentement administrateur à l'application Azure VPN dans le locataire.
        - id: s3
          text:
            en: For the R&D team, you can add the custom app ID to VPNGW1 as a second Audience value, next to the Microsoft-registered app ID.
            fr: Pour l'équipe R&D, vous pouvez ajouter l'ID d'application personnalisé à VPNGW1 comme seconde valeur Audience, à côté de l'ID d'application inscrit par Microsoft.
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          With the tunnel type IKEv2 and OpenVPN, a gateway can combine Microsoft Entra ID and Azure certificate authentication: Entra ID clients use OpenVPN, and certificate clients can keep using IKEv2. The Microsoft-registered app ID needs no admin consent; consent was only required for the older manually registered app ID. A gateway supports one Audience value at a time, so the R&D team needs a gateway whose audience is the custom app ID.
        fr: |
          Avec le type de tunnel IKEv2 et OpenVPN, une passerelle peut combiner l'authentification Microsoft Entra ID et Certificat Azure : les clients Entra ID utilisent OpenVPN, et les clients par certificat peuvent continuer d'utiliser IKEv2. L'ID d'application inscrit par Microsoft n'exige aucun consentement administrateur ; le consentement n'était nécessaire que pour l'ancien ID d'application inscrit manuellement. Une passerelle ne prend en charge qu'une valeur Audience à la fois : l'équipe R&D a besoin d'une passerelle dont l'audience est l'ID d'application personnalisé.
      options:
        s2: { en: "Granting admin consent is only for the manually registered Azure VPN Client app and its older Audience values.", fr: "Accorder le consentement administrateur ne concerne que l'application Azure VPN Client inscrite manuellement et ses anciennes valeurs Audience." }
        s3: { en: "A point-to-site gateway can't support multiple Audience values simultaneously.", fr: "Une passerelle de point à site ne peut pas prendre en charge plusieurs valeurs Audience simultanément." }
    references:
      - title: "Configure P2S VPN gateway for Microsoft Entra ID authentication: Microsoft-registered client - Azure VPN Gateway"
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-entra-gateway
      - title: About Azure Point-to-Site VPN connections - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about

  # ------------------------------------------------------------------ 8
  - id: az700-qz-22-08
    objective: "2.2.8"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware has a route-based VPN gateway named **VPNGW-Corp** (VpnGw3AZ). Its point-to-site configuration currently uses the tunnel type **OpenVPN (SSL)** and **Microsoft Entra ID** authentication, and employees connect with the Azure VPN Client.

        Proseware plans to deploy Always On VPN device tunnels on its domain-joined Windows 11 Enterprise laptops so that they connect to Azure before any user signs in. Proseware's enterprise certification authority will issue a computer certificate to each laptop. Employees must keep connecting with the Azure VPN Client and their Entra credentials.

        How should you configure the point-to-site settings of VPNGW-Corp?
      fr: |
        Proseware dispose d'une passerelle VPN basée sur des routes nommée **VPNGW-Corp** (VpnGw3AZ). Sa configuration de point à site utilise actuellement le type de tunnel **OpenVPN (SSL)** et l'authentification **Microsoft Entra ID**, et les employés se connectent avec Azure VPN Client.

        Proseware prévoit de déployer des tunnels d'appareil VPN Always On sur ses portables Windows 11 Entreprise joints au domaine pour qu'ils se connectent à Azure avant toute ouverture de session. L'autorité de certification d'entreprise de Proseware émettra un certificat d'ordinateur pour chaque portable. Les employés doivent continuer de se connecter avec Azure VPN Client et leurs identifiants Entra.

        Comment devez-vous configurer les paramètres de point à site de VPNGW-Corp ?
    body:
      options:
        - { id: a, text: { en: "Tunnel type IKEv2 and OpenVPN (SSL); authentication types Microsoft Entra ID and Azure certificate", fr: "Type de tunnel IKEv2 et OpenVPN (SSL) ; types d'authentification Microsoft Entra ID et Certificat Azure" } }
        - { id: b, text: { en: "Tunnel type IKEv2; authentication types Microsoft Entra ID and Azure certificate", fr: "Type de tunnel IKEv2 ; types d'authentification Microsoft Entra ID et Certificat Azure" } }
        - { id: c, text: { en: "Tunnel type IKEv2 and OpenVPN (SSL); authentication types Microsoft Entra ID and RADIUS", fr: "Type de tunnel IKEv2 et OpenVPN (SSL) ; types d'authentification Microsoft Entra ID et RADIUS" } }
        - { id: d, text: { en: "Tunnel type OpenVPN (SSL); authentication types Microsoft Entra ID and Azure certificate", fr: "Type de tunnel OpenVPN (SSL) ; types d'authentification Microsoft Entra ID et Certificat Azure" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          An Always On VPN device tunnel uses the built-in Windows VPN client with IKEv2 and computer certificate authentication, so the gateway needs IKEv2 and Azure certificate authentication, with the root certificate of the computer certificates uploaded. Microsoft Entra ID works only over OpenVPN, so the tunnel type must stay "IKEv2 and OpenVPN (SSL)", a combination that accepts Microsoft Entra ID and Azure certificate together.
        fr: |
          Un tunnel d'appareil VPN Always On utilise le client VPN intégré à Windows avec IKEv2 et l'authentification par certificat d'ordinateur : la passerelle a besoin d'IKEv2 et de l'authentification Certificat Azure, avec le certificat racine des certificats d'ordinateur chargé. Microsoft Entra ID ne fonctionne qu'en OpenVPN : le type de tunnel doit donc être « IKEv2 et OpenVPN (SSL) », une combinaison qui accepte Microsoft Entra ID et Certificat Azure ensemble.
      options:
        b: { en: "Without OpenVPN, the Entra ID users of the Azure VPN Client can't connect: Entra ID isn't supported over IKEv2.", fr: "Sans OpenVPN, les utilisateurs Entra ID d'Azure VPN Client ne peuvent plus se connecter : Entra ID n'est pas pris en charge en IKEv2." }
        c: { en: "The device tunnel authenticates with a computer certificate validated by the gateway, not through a RADIUS server.", fr: "Le tunnel d'appareil s'authentifie avec un certificat d'ordinateur validé par la passerelle, pas par un serveur RADIUS." }
        d: { en: "The device tunnel uses the built-in Windows client over IKEv2; OpenVPN alone can't carry it.", fr: "Le tunnel d'appareil utilise le client Windows intégré en IKEv2 ; OpenVPN seul ne peut pas le transporter." }
    references:
      - title: Configure an Always-On VPN tunnel - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-howto-always-on-device-tunnel
      - title: About Azure Point-to-Site VPN connections - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about

  # ------------------------------------------------------------------ 9
  - id: az700-qz-22-09
    objective: "2.2.6"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Tailspin Toys has a route-based VPN gateway named **VPNGW1** in the Azure public cloud. Its point-to-site configuration uses OpenVPN (SSL) and Microsoft Entra ID authentication with the Audience `41b23e61-6c1e-4545-b367-cd054e0ed4b4`, the manually registered Azure VPN Client app, for which admin consent was granted years ago. Users run the latest Azure VPN Client on Windows 11 and macOS.

        You need to move VPNGW1 and its users to the Microsoft-registered Azure VPN Client app ID before the manually registered app retires.

        Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Tailspin Toys dispose d'une passerelle VPN basée sur des routes nommée **VPNGW1** dans le cloud public Azure. Sa configuration de point à site utilise OpenVPN (SSL) et l'authentification Microsoft Entra ID avec l'Audience `41b23e61-6c1e-4545-b367-cd054e0ed4b4`, l'application Azure VPN Client inscrite manuellement, pour laquelle le consentement administrateur a été accordé il y a des années. Les utilisateurs exécutent la dernière version d'Azure VPN Client sur Windows 11 et macOS.

        Vous devez faire passer VPNGW1 et ses utilisateurs à l'ID d'application Azure VPN Client inscrit par Microsoft avant la mise hors service de l'application inscrite manuellement.

        Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 3
      actions:
        - { id: audience, text: { en: "On the Point-to-site configuration page of VPNGW1, set Audience to c632b3df-fb67-4d84-bdcf-b95ad541b5c8 and save.", fr: "Dans la page Configuration de point à site de VPNGW1, définir Audience sur c632b3df-fb67-4d84-bdcf-b95ad541b5c8 et enregistrer." } }
        - { id: download, text: { en: "Select Download VPN client and extract azurevpnconfig.xml from the AzureVPN folder.", fr: "Sélectionner Télécharger le client VPN et extraire azurevpnconfig.xml du dossier AzureVPN." } }
        - { id: import, text: { en: "Import the new azurevpnconfig.xml in the Azure VPN Client on each device, in place of the old profile.", fr: "Importer le nouveau azurevpnconfig.xml dans Azure VPN Client sur chaque appareil, à la place de l'ancien profil." } }
        - { id: consent, text: { en: "Grant admin consent to the Microsoft-registered Azure VPN Client app in the tenant.", fr: "Accorder le consentement administrateur à l'application Azure VPN Client inscrite par Microsoft dans le locataire." } }
        - { id: second, text: { en: "Add c632b3df-fb67-4d84-bdcf-b95ad541b5c8 as a second Audience value next to the current one.", fr: "Ajouter c632b3df-fb67-4d84-bdcf-b95ad541b5c8 comme seconde valeur Audience à côté de la valeur actuelle." } }
        - { id: tunnel, text: { en: "Change the tunnel type of VPNGW1 to IKEv2 and OpenVPN (SSL).", fr: "Changer le type de tunnel de VPNGW1 en IKEv2 et OpenVPN (SSL)." } }
        - { id: reset, text: { en: "Reset VPNGW1 so that it applies the new Audience value.", fr: "Réinitialiser VPNGW1 pour qu'elle applique la nouvelle valeur Audience." } }
    answer:
      sequence: [audience, download, import]
    explanation:
      correct:
        en: |
          You first change the Audience of the gateway to the Microsoft-registered app ID and save; the update causes a few minutes of downtime. The client package is a snapshot of the gateway configuration, so you download it only after the change, then import the new azurevpnconfig.xml (or edit the Audience of the existing profile) in the Azure VPN Client on each device.
        fr: |
          Vous changez d'abord l'Audience de la passerelle pour l'ID d'application inscrit par Microsoft et enregistrez ; la mise à jour provoque quelques minutes d'interruption. Le package client est un instantané de la configuration de la passerelle : vous ne le téléchargez qu'après la modification, puis vous importez le nouveau azurevpnconfig.xml (ou modifiez l'Audience du profil existant) dans Azure VPN Client sur chaque appareil.
      options:
        consent: { en: "The Microsoft-registered app ID needs no admin consent; consent was only for the manually registered app.", fr: "L'ID d'application inscrit par Microsoft n'exige aucun consentement administrateur ; le consentement ne concernait que l'application inscrite manuellement." }
        second: { en: "A point-to-site gateway supports only one Audience value at a time.", fr: "Une passerelle de point à site ne prend en charge qu'une seule valeur Audience à la fois." }
        tunnel: { en: "Microsoft Entra ID uses OpenVPN only; adding IKEv2 has no effect on the audience migration.", fr: "Microsoft Entra ID n'utilise qu'OpenVPN ; ajouter IKEv2 n'a aucun effet sur la migration de l'audience." }
        reset: { en: "Saving the point-to-site configuration applies the new Audience; no reset is needed.", fr: "Enregistrer la configuration de point à site applique la nouvelle Audience ; aucune réinitialisation n'est nécessaire." }
    references:
      - title: Migrate manually registered Azure VPN client to Microsoft-registered for P2S Microsoft Entra ID authentication - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-entra-gateway-update

  # ------------------------------------------------------------------ 10
  - id: az700-qz-22-10
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Traders is deploying a new point-to-site VPN gateway named **VPNGW-Hub** in a hub virtual network. The gateway must be zone-redundant, run in active-active mode, and minimize costs. Two groups of users will connect at the same time:

        | Group | Peak concurrent users | Devices and client | Authentication requirement |
        | --- | --- | --- | --- |
        | Office staff | 2,600 | Windows 11, macOS, iOS and Android, Azure VPN Client | Microsoft Entra credentials with Conditional Access |
        | Factory staff | 900 | Windows 11, native Windows VPN client | Active Directory Domain Services credentials, validated by NPS servers in the hub virtual network |

        How should you complete the configuration of VPNGW-Hub? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders déploie une nouvelle passerelle VPN de point à site nommée **VPNGW-Hub** dans un réseau virtuel hub. La passerelle doit être redondante interzone, fonctionner en mode actif/actif et réduire les coûts au minimum. Deux groupes d'utilisateurs se connecteront en même temps :

        | Groupe | Utilisateurs simultanés en pointe | Appareils et client | Exigence d'authentification |
        | --- | --- | --- | --- |
        | Personnel de bureau | 2 600 | Windows 11, macOS, iOS et Android, Azure VPN Client | Identifiants Microsoft Entra avec accès conditionnel |
        | Personnel d'usine | 900 | Windows 11, client VPN natif de Windows | Identifiants Active Directory Domain Services, validés par des serveurs NPS dans le réseau virtuel hub |

        Comment devez-vous compléter la configuration de VPNGW-Hub ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Gateway SKU: [[sku]]

          Tunnel type: [[tunnel]]

          Authentication types: [[auth]]

          Number of public IP addresses: [[pips]]
        fr: |
          Référence SKU de la passerelle : [[sku]]

          Type de tunnel : [[tunnel]]

          Types d'authentification : [[auth]]

          Nombre d'adresses IP publiques : [[pips]]
      slots:
        - id: sku
          options:
            - { id: gw2az, text: VpnGw2AZ }
            - { id: gw3az, text: VpnGw3AZ }
            - { id: gw4az, text: VpnGw4AZ }
            - { id: gw5az, text: VpnGw5AZ }
        - id: tunnel
          options:
            - { id: ovpn, text: "OpenVPN (SSL)" }
            - { id: ikev2, text: IKEv2 }
            - { id: ikeovpn, text: { en: "IKEv2 and OpenVPN (SSL)", fr: "IKEv2 et OpenVPN (SSL)" } }
            - { id: ikesstp, text: { en: "IKEv2 and SSTP (SSL)", fr: "IKEv2 et SSTP (SSL)" } }
        - id: auth
          options:
            - { id: entra, text: Microsoft Entra ID }
            - { id: entraradius, text: { en: "Microsoft Entra ID and RADIUS", fr: "Microsoft Entra ID et RADIUS" } }
            - { id: entracert, text: { en: "Microsoft Entra ID and Azure certificate", fr: "Microsoft Entra ID et Certificat Azure" } }
            - { id: radius, text: RADIUS }
        - id: pips
          options:
            - { id: p1, text: "1" }
            - { id: p2, text: "2" }
            - { id: p3, text: "3" }
            - { id: p4, text: "4" }
    answer:
      values: { sku: gw4az, tunnel: ikeovpn, auth: entraradius, pips: p3 }
    explanation:
      correct:
        en: |
          The IKEv2/OpenVPN limit applies to both groups together: 3,500 concurrent users exceed the 1,000 of VpnGw3AZ, so VpnGw4AZ (5,000) is the least expensive SKU. Microsoft Entra ID works only over OpenVPN, while the native Windows client uses IKEv2, so the tunnel type is "IKEv2 and OpenVPN (SSL)"; domain credentials checked by NPS require RADIUS, which this tunnel type accepts together with Microsoft Entra ID. An active-active gateway needs two public IP addresses, plus a third one for point-to-site.
        fr: |
          La limite IKEv2/OpenVPN s'applique aux deux groupes ensemble : 3 500 utilisateurs simultanés dépassent les 1 000 de VpnGw3AZ, donc VpnGw4AZ (5 000) est la référence la moins chère. Microsoft Entra ID ne fonctionne qu'en OpenVPN, alors que le client Windows natif utilise IKEv2 : le type de tunnel est « IKEv2 et OpenVPN (SSL) » ; des identifiants de domaine vérifiés par NPS exigent RADIUS, que ce type de tunnel accepte avec Microsoft Entra ID. Une passerelle actif/actif a besoin de deux adresses IP publiques, plus une troisième pour le point à site.
      options:
        gw3az: { en: "VpnGw3AZ accepts 1,000 IKEv2/OpenVPN connections, fewer than the 3,500 needed.", fr: "VpnGw3AZ accepte 1 000 connexions IKEv2/OpenVPN, moins que les 3 500 nécessaires." }
        gw5az: { en: "VpnGw5AZ (10,000) fits but costs more than VpnGw4AZ, which already covers 3,500 users.", fr: "VpnGw5AZ (10 000) convient mais coûte plus cher que VpnGw4AZ, qui couvre déjà 3 500 utilisateurs." }
        ovpn: { en: "The native Windows VPN client of the factory staff doesn't support OpenVPN.", fr: "Le client VPN natif de Windows du personnel d'usine ne prend pas en charge OpenVPN." }
        ikesstp: { en: "Enabling SSTP is no longer possible since August 31, 2026, and Microsoft Entra ID requires OpenVPN.", fr: "Activer SSTP n'est plus possible depuis le 31 août 2026, et Microsoft Entra ID exige OpenVPN." }
        entracert: { en: "Azure certificate authentication doesn't validate Active Directory Domain Services credentials; NPS needs RADIUS.", fr: "L'authentification Certificat Azure ne valide pas les identifiants Active Directory Domain Services ; NPS demande RADIUS." }
        p2: { en: "Two public IP addresses cover the two instances of an active-active gateway, but point-to-site needs a third one.", fr: "Deux adresses IP publiques couvrent les deux instances d'une passerelle actif/actif, mais le point à site en demande une troisième." }
    references:
      - title: About Azure Point-to-Site VPN connections - Azure VPN Gateway
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about
      - title: About gateway SKUs
        url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-gateway-skus
