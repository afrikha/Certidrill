chapter: 15-routing-nat
questions:
  # ------------------------------------------------------------------ 1
  - id: az700-qz-15-01
    objective: "1.3.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has a virtual network named **VNet1** in West Europe that contains four workload subnets. A route table named **RT1**, in the same region and subscription, contains the routes that every workload subnet must use.

        The routes must be maintained in a single route table. What should you do?
      fr: |
        Fabrikam dispose d'un réseau virtuel nommé **VNet1** en West Europe qui contient quatre sous-réseaux de charge de travail. Une table de routage nommée **RT1**, dans la même région et le même abonnement, contient les itinéraires que chaque sous-réseau de charge de travail doit utiliser.

        Les itinéraires doivent être gérés dans une seule table de routage. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Associate RT1 with VNet1 so that all its subnets inherit the routes.", fr: "Associer RT1 à VNet1 afin que tous ses sous-réseaux héritent des itinéraires." } }
        - { id: b, text: { en: "Associate RT1 with GatewaySubnet so that the gateway propagates the routes.", fr: "Associer RT1 à GatewaySubnet afin que la passerelle propage les itinéraires." } }
        - { id: c, text: { en: "Associate RT1 with each of the four workload subnets of VNet1.", fr: "Associer RT1 à chacun des quatre sous-réseaux de charge de travail de VNet1." } }
        - { id: d, text: { en: "Create one copy of RT1 per subnet and associate each copy with a subnet.", fr: "Créer une copie de RT1 par sous-réseau et associer chaque copie à un sous-réseau." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A route table can be associated with zero or more subnets, and each subnet has zero or one route table. Route tables are never associated with a virtual network, so you associate RT1 with each subnet that must use its routes, and you maintain the routes once in RT1.
        fr: |
          Une table de routage peut être associée à zéro ou plusieurs sous-réseaux, et chaque sous-réseau a zéro ou une table de routage. Les tables de routage ne s'associent jamais à un réseau virtuel : vous associez donc RT1 à chaque sous-réseau qui doit utiliser ses itinéraires, et vous gérez les itinéraires une seule fois dans RT1.
      options:
        a: { en: "Route tables aren't associated with virtual networks; the association is made subnet by subnet.", fr: "Les tables de routage ne s'associent pas aux réseaux virtuels ; l'association se fait sous-réseau par sous-réseau." }
        b: { en: "A route table associated with GatewaySubnet changes only the routing of the gateway subnet; the gateway doesn't propagate UDRs to the workload subnets.", fr: "Une table de routage associée à GatewaySubnet ne change que le routage du sous-réseau de passerelle ; la passerelle ne propage pas les UDR vers les sous-réseaux de charge de travail." }
        d: { en: "Copies work but create four route tables to keep in sync, which breaks the single route table requirement.", fr: "Des copies fonctionnent, mais créent quatre tables de routage à synchroniser, ce qui enfreint l'exigence d'une seule table." }
    references:
      - title: Azure virtual network traffic routing
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
      - title: Create, change, or delete an Azure route table - Azure Virtual Network
        url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-route-table

  # ------------------------------------------------------------------ 2
  - id: az700-qz-15-02
    objective: "1.3.10"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You create a Standard NAT gateway named **natgw1** in a virtual network named **VNet1**. VNet1 contains the subnets listed in the options.

        With which subnet can't you associate natgw1?
      fr: |
        Vous créez une passerelle NAT Standard nommée **natgw1** dans un réseau virtuel nommé **VNet1**. VNet1 contient les sous-réseaux indiqués dans les options.

        À quel sous-réseau ne pouvez-vous pas associer natgw1 ?
    body:
      options:
        - { id: a, text: { en: "AzureFirewallSubnet, which hosts an Azure Firewall instance", fr: "AzureFirewallSubnet, qui héberge une instance du Pare-feu Azure" } }
        - { id: b, text: { en: "GatewaySubnet, which hosts a route-based VPN gateway", fr: "GatewaySubnet, qui héberge une passerelle VPN basée sur des routes" } }
        - { id: c, text: { en: "Web, whose VMs have Standard instance-level public IPs", fr: "Web, dont les VM ont des IP publiques Standard au niveau de l'instance" } }
        - { id: d, text: { en: "Data, whose VMs are behind a Standard internal load balancer", fr: "Data, dont les VM sont derrière un équilibreur de charge interne Standard" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A NAT gateway can't be deployed in the gateway subnet of a virtual network gateway (nor in a subnet that contains SQL Managed Instance). The other subnets accept a NAT gateway, which then handles their new outbound internet connections.
        fr: |
          Une passerelle NAT ne peut pas être déployée dans le sous-réseau de passerelle d'une passerelle de réseau virtuel (ni dans un sous-réseau qui contient SQL Managed Instance). Les autres sous-réseaux acceptent une passerelle NAT, qui prend alors en charge leurs nouvelles connexions Internet sortantes.
      options:
        a: { en: "Associating a NAT gateway with AzureFirewallSubnet is a documented design that scales the SNAT ports of the firewall.", fr: "Associer une passerelle NAT à AzureFirewallSubnet est une conception documentée qui augmente les ports SNAT du pare-feu." }
        c: { en: "Standard instance-level public IPs coexist with a NAT gateway; new outbound connections then use the NAT gateway.", fr: "Des IP publiques Standard au niveau de l'instance coexistent avec une passerelle NAT ; les nouvelles connexions sortantes utilisent alors la passerelle NAT." }
        d: { en: "Only Basic load balancers are incompatible with a NAT gateway; the backend VMs of a Standard internal load balancer can use one.", fr: "Seuls les équilibreurs de charge Basic sont incompatibles avec une passerelle NAT ; les VM de back-end d'un équilibreur de charge interne Standard peuvent en utiliser une." }
    references:
      - title: What Is Azure NAT Gateway?
        url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview

  # ------------------------------------------------------------------ 3
  - id: az700-qz-15-03
    objective: "1.3.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin created a virtual network named **VNet-App** in May 2026. Its subnet **Backend** contains six VMs that are in the backend pool of a Standard internal load balancer named **ilb-app**. The VMs have no public IP addresses.

        The VMs must download operating system updates from the internet. They must not be reachable from the internet, and the solution must minimize administrative effort.

        What should you do?
      fr: |
        Tailspin a créé un réseau virtuel nommé **VNet-App** en mai 2026. Son sous-réseau **Backend** contient six VM qui font partie du pool principal d'un équilibreur de charge interne Standard nommé **ilb-app**. Les VM n'ont pas d'adresse IP publique.

        Les VM doivent télécharger les mises à jour du système d'exploitation depuis Internet. Elles ne doivent pas être joignables depuis Internet, et la solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add an outbound rule to ilb-app that uses its frontend IP configuration.", fr: "Ajouter à ilb-app une règle de trafic sortant qui utilise sa configuration IP frontale." } }
        - { id: b, text: { en: "Associate a NAT gateway that has a Standard public IP address with Backend.", fr: "Associer à Backend une passerelle NAT dotée d'une adresse IP publique Standard." } }
        - { id: c, text: { en: "Assign a Standard public IP address to the network interface of each VM.", fr: "Attribuer une adresse IP publique Standard à l'interface réseau de chaque VM." } }
        - { id: d, text: { en: "Associate with Backend a route table that sends 0.0.0.0/0 to the next hop type Internet.", fr: "Associer à Backend une table de routage qui envoie 0.0.0.0/0 vers le type de tronçon suivant Internet." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Since March 31, 2026, new virtual networks use private subnets by default, so the VMs need an explicit outbound method. A NAT gateway associated with the subnet gives all its VMs outbound internet access through its public IP addresses, with no route change, and it doesn't accept unsolicited inbound connections.
        fr: |
          Depuis le 31 mars 2026, les nouveaux réseaux virtuels utilisent par défaut des sous-réseaux privés : les VM ont donc besoin d'une méthode sortante explicite. Une passerelle NAT associée au sous-réseau donne à toutes ses VM un accès Internet sortant par ses adresses IP publiques, sans modification de route, et elle n'accepte pas de connexions entrantes non sollicitées.
      options:
        a: { en: "Outbound rules define SNAT for the public frontend of a public Standard load balancer; an internal load balancer has no public frontend to translate to.", fr: "Les règles de trafic sortant définissent la SNAT vers le front-end public d'un équilibreur de charge public Standard ; un équilibreur de charge interne n'a pas de front-end public vers lequel traduire." }
        c: { en: "Instance-level public IPs give outbound access but make each VM reachable from the internet, and there are six addresses to manage.", fr: "Des IP publiques au niveau de l'instance donnent l'accès sortant, mais rendent chaque VM joignable depuis Internet, et il y a six adresses à gérer." }
        d: { en: "The system route already sends 0.0.0.0/0 to Internet; what a private subnet lacks is a public source address, which a route doesn't provide.", fr: "La route système envoie déjà 0.0.0.0/0 vers Internet ; ce qui manque à un sous-réseau privé est une adresse source publique, qu'une route ne fournit pas." }
    references:
      - title: What Is Azure NAT Gateway?
        url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
      - title: Outbound Rules for Azure Load Balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/outbound-rules

  # ------------------------------------------------------------------ 4
  - id: az700-qz-15-04
    objective: "1.3.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum has a VM named **VM2** whose network interface is **vm2-nic**. VM2 was stopped (deallocated) last night for a disk change. This morning, a developer reports that VM2 used the wrong path to reach an on-premises server before it was stopped.

        You run `az network nic show-effective-route-table` for vm2-nic, and no route is returned. You need to review the routes that apply to vm2-nic.

        What should you do first?
      fr: |
        Adatum dispose d'une VM nommée **VM2** dont l'interface réseau est **vm2-nic**. VM2 a été arrêtée (libérée) hier soir pour un changement de disque. Ce matin, un développeur signale que VM2 utilisait un mauvais chemin pour joindre un serveur local avant son arrêt.

        Vous exécutez `az network nic show-effective-route-table` pour vm2-nic, et aucun itinéraire n'est renvoyé. Vous devez examiner les itinéraires qui s'appliquent à vm2-nic.

        Que devez-vous faire en premier ?
    body:
      options:
        - { id: a, text: { en: "Enable Network Watcher in the region of VM2.", fr: "Activer Network Watcher dans la région de VM2." } }
        - { id: b, text: { en: "Enable IP forwarding on vm2-nic.", fr: "Activer le transfert IP sur vm2-nic." } }
        - { id: c, text: { en: "Start VM2.", fr: "Démarrer VM2." } }
        - { id: d, text: { en: "Associate a route table with the subnet of VM2.", fr: "Associer une table de routage au sous-réseau de VM2." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Effective routes are returned only when the VM is in the running state. Once VM2 runs, the effective routes of vm2-nic list the system, BGP and user-defined routes with their state and next hop.
        fr: |
          Les itinéraires effectifs ne sont renvoyés que lorsque la VM est en cours d'exécution. Une fois VM2 démarrée, les itinéraires effectifs de vm2-nic listent les itinéraires système, BGP et définis par l'utilisateur avec leur état et leur tronçon suivant.
      options:
        a: { en: "Effective routes are a property of the network interface; viewing them doesn't depend on a Network Watcher instance.", fr: "Les itinéraires effectifs sont une propriété de l'interface réseau ; leur consultation ne dépend pas d'une instance Network Watcher." }
        b: { en: "IP forwarding lets a VM forward traffic that isn't addressed to it; it has no effect on whether effective routes are shown.", fr: "Le transfert IP permet à une VM de transférer du trafic qui ne lui est pas destiné ; il ne change rien à l'affichage des itinéraires effectifs." }
        d: { en: "A subnet without a route table still has system routes; the empty result comes from the VM state, not from missing routes.", fr: "Un sous-réseau sans table de routage a quand même des itinéraires système ; le résultat vide vient de l'état de la VM, pas d'itinéraires manquants." }
    references:
      - title: Diagnose an Azure virtual machine routing problem
        url: https://learn.microsoft.com/en-us/azure/virtual-network/diagnose-network-routing-problem

  # ------------------------------------------------------------------ 5
  - id: az700-qz-15-05
    objective: "1.3.6"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove has a virtual network named **VNet1** (10.0.0.0/16) with the following subnets:

        | Subnet | Prefix | Route table |
        | --- | --- | --- |
        | App | 10.0.1.0/24 | RT-FT: 0.0.0.0/0, next hop type Virtual appliance, 10.0.9.4 |
        | Web | 10.0.2.0/24 | None |
        | Inspect | 10.0.9.0/24 | None |

        The network virtual appliance at 10.0.9.4 forwards internet-bound traffic to the on-premises proxies. A VM named **VM-App1** in App has an instance-level public IP address. No subnet has a service endpoint.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove dispose d'un réseau virtuel nommé **VNet1** (10.0.0.0/16) avec les sous-réseaux suivants :

        | Sous-réseau | Préfixe | Table de routage |
        | --- | --- | --- |
        | App | 10.0.1.0/24 | RT-FT : 0.0.0.0/0, type de tronçon suivant Virtual appliance, 10.0.9.4 |
        | Web | 10.0.2.0/24 | Aucune |
        | Inspect | 10.0.9.0/24 | Aucune |

        L'appliance virtuelle réseau 10.0.9.4 transfère le trafic destiné à Internet vers les proxys locaux. Une VM nommée **VM-App1** dans App possède une adresse IP publique au niveau de l'instance. Aucun sous-réseau n'a de point de terminaison de service.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si elle est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "Administrators on the internet can connect by RDP directly to the public IP address of VM-App1.", fr: "Des administrateurs sur Internet peuvent se connecter en RDP directement à l'adresse IP publique de VM-App1." } }
        - { id: s2, text: { en: "Traffic from VM-App1 to the public endpoint of an Azure storage account is sent to 10.0.9.4.", fr: "Le trafic de VM-App1 vers le point de terminaison public d'un compte de stockage Azure est envoyé à 10.0.9.4." } }
        - { id: s3, text: { en: "Traffic from VM-App1 to a VM in the Web subnet is sent to 10.0.9.4.", fr: "Le trafic de VM-App1 vers une VM du sous-réseau Web est envoyé à 10.0.9.4." } }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A 0.0.0.0/0 route to an appliance sends all traffic without a more specific route to that appliance, including traffic to the public IP addresses of Azure services when no service endpoint exists. Resources of the subnet are then no longer directly reachable from the internet: the replies to an inbound RDP session leave through the appliance instead of the public IP, so the session fails. Traffic to Web matches the more specific virtual network route 10.0.0.0/16 and stays direct.
        fr: |
          Une route 0.0.0.0/0 vers une appliance envoie à celle-ci tout le trafic qui n'a pas d'itinéraire plus spécifique, y compris le trafic vers les adresses IP publiques des services Azure en l'absence de point de terminaison de service. Les ressources du sous-réseau ne sont alors plus joignables directement depuis Internet : les réponses d'une session RDP entrante repartent par l'appliance au lieu de l'IP publique, et la session échoue. Le trafic vers Web correspond à l'itinéraire de réseau virtuel 10.0.0.0/16, plus spécifique, et reste direct.
      options:
        s1: { en: "With a default route to an appliance, inbound internet access must go through the device that handles the default route.", fr: "Avec une route par défaut vers une appliance, l'accès entrant depuis Internet doit passer par l'équipement qui traite la route par défaut." }
        s3: { en: "Longest prefix match: the /16 virtual network system route beats the /0 user-defined route.", fr: "Correspondance du préfixe le plus long : l'itinéraire système /16 du réseau virtuel bat l'itinéraire /0 défini par l'utilisateur." }
    references:
      - title: Azure virtual network traffic routing
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview

  # ------------------------------------------------------------------ 6
  - id: az700-qz-15-06
    objective: "1.3.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has the following virtual networks in North Europe:

        | Virtual network | Address space | Peerings |
        | --- | --- | --- |
        | VNet-Hub | 10.0.0.0/16 | Spoke1, Spoke2 |
        | Spoke1 | 10.1.0.0/16 | VNet-Hub, Spoke2 |
        | Spoke2 | 10.2.0.0/16 | VNet-Hub, Spoke1 |

        An Azure Firewall instance named **FW1** in VNet-Hub has the private IP address 10.0.1.4. The workload subnets of Spoke1 use a route table named **RT-Spoke1**, and those of Spoke2 use **RT-Spoke2**. Both route tables contain the routes 0.0.0.0/0 and 10.0.0.0/8, each with the next hop type Virtual appliance and the address 10.0.1.4.

        FW1 logs show no traffic between Spoke1 and Spoke2. All traffic between the two spokes must be inspected by FW1. The peerings must not be modified.

        What should you do?
      fr: |
        Contoso dispose des réseaux virtuels suivants en North Europe :

        | Réseau virtuel | Espace d'adressage | Peerings |
        | --- | --- | --- |
        | VNet-Hub | 10.0.0.0/16 | Spoke1, Spoke2 |
        | Spoke1 | 10.1.0.0/16 | VNet-Hub, Spoke2 |
        | Spoke2 | 10.2.0.0/16 | VNet-Hub, Spoke1 |

        Une instance du Pare-feu Azure nommée **FW1** dans VNet-Hub a l'adresse IP privée 10.0.1.4. Les sous-réseaux de charge de travail de Spoke1 utilisent une table de routage nommée **RT-Spoke1**, et ceux de Spoke2 utilisent **RT-Spoke2**. Les deux tables de routage contiennent les itinéraires 0.0.0.0/0 et 10.0.0.0/8, chacun avec le type de tronçon suivant Virtual appliance et l'adresse 10.0.1.4.

        Les journaux de FW1 ne montrent aucun trafic entre Spoke1 et Spoke2. Tout le trafic entre les deux spokes doit être inspecté par FW1. Les peerings ne doivent pas être modifiés.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set Propagate gateway routes to No on RT-Spoke1 and RT-Spoke2 so that the spoke-to-spoke peering routes aren't added.", fr: "Définir Propager les itinéraires de passerelle sur Non dans RT-Spoke1 et RT-Spoke2 afin que les itinéraires du peering entre spokes ne soient pas ajoutés." } }
        - { id: b, text: { en: "Add 10.2.0.0/16 to RT-Spoke1 and 10.1.0.0/16 to RT-Spoke2, each with the next hop type Virtual appliance and 10.0.1.4.", fr: "Ajouter 10.2.0.0/16 à RT-Spoke1 et 10.1.0.0/16 à RT-Spoke2, chacun avec le type de tronçon suivant Virtual appliance et 10.0.1.4." } }
        - { id: c, text: { en: "Change the next hop type of the 10.0.0.0/8 routes to Virtual network so that the traffic reaches the hub before the spokes.", fr: "Changer le type de tronçon suivant des itinéraires 10.0.0.0/8 en Virtual network afin que le trafic atteigne le hub avant les spokes." } }
        - { id: d, text: { en: "Enable IP forwarding on the network interfaces of the spoke VMs so that the 10.0.0.0/8 routes take effect for peered traffic.", fr: "Activer le transfert IP sur les interfaces réseau des VM des spokes afin que les itinéraires 10.0.0.0/8 s'appliquent au trafic des peerings." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Because Spoke1 and Spoke2 are peered directly, each spoke has a Virtual network peering system route for the other spoke's /16. That route is more specific than the 10.0.0.0/8 UDR, so it wins and the traffic bypasses FW1. A UDR with the same /16 prefix takes precedence over the system route, so adding the remote spoke's range to each route table, in both directions, sends the traffic and its replies through FW1.
        fr: |
          Comme Spoke1 et Spoke2 sont reliés directement par peering, chaque spoke a un itinéraire système Peering de réseaux virtuels pour le /16 de l'autre spoke. Cet itinéraire est plus spécifique que l'UDR 10.0.0.0/8 : il l'emporte et le trafic contourne FW1. Une UDR de même préfixe /16 est prioritaire sur l'itinéraire système ; ajouter la plage du spoke distant à chaque table de routage, dans les deux sens, fait passer le trafic et ses réponses par FW1.
      options:
        a: { en: "Gateway route propagation only controls routes learned from a virtual network gateway; peering routes are system routes that it doesn't remove.", fr: "La propagation des itinéraires de passerelle ne contrôle que les itinéraires appris d'une passerelle de réseau virtuel ; les itinéraires de peering sont des itinéraires système qu'elle ne retire pas." }
        c: { en: "Virtual network (VnetLocal) keeps traffic inside the local virtual network; it doesn't send anything to FW1.", fr: "Virtual network (VnetLocal) garde le trafic dans le réseau virtuel local ; il n'envoie rien à FW1." }
        d: { en: "IP forwarding is needed on the appliance that forwards traffic, not on the source VMs, and it doesn't change route selection.", fr: "Le transfert IP est nécessaire sur l'appliance qui transfère le trafic, pas sur les VM sources, et il ne change pas la sélection des itinéraires." }
    references:
      - title: Azure virtual network traffic routing
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview

  # ------------------------------------------------------------------ 7
  - id: az700-qz-15-07
    objective: "1.3.8"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind has a hub virtual network named **VNet-Hub** (10.10.0.0/16) that contains an Azure Route Server named **RS1** and the subnets **App** (10.10.2.0/24) and **Data** (10.10.4.0/24). A network virtual appliance named **NVA1** (10.10.3.4, ASN 65010) has BGP sessions with both instances of RS1.

        A spoke virtual network named **Spoke1** (10.20.0.0/16) is peered with VNet-Hub. The hub side of the peering allows gateway transit, and the Spoke1 side uses the remote virtual network's gateway or Route Server.

        NVA1 advertises 172.16.0.0/16 (branch offices) and 10.10.4.0/24, so that traffic to the Data subnet is inspected.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind dispose d'un réseau virtuel hub nommé **VNet-Hub** (10.10.0.0/16) qui contient un Azure Route Server nommé **RS1** et les sous-réseaux **App** (10.10.2.0/24) et **Data** (10.10.4.0/24). Une appliance virtuelle réseau nommée **NVA1** (10.10.3.4, ASN 65010) a des sessions BGP avec les deux instances de RS1.

        Un réseau virtuel spoke nommé **Spoke1** (10.20.0.0/16) est relié à VNet-Hub par peering. Le côté hub du peering autorise le transit par passerelle, et le côté Spoke1 utilise la passerelle ou le serveur de routes du réseau virtuel distant.

        NVA1 annonce 172.16.0.0/16 (agences) et 10.10.4.0/24, afin que le trafic vers le sous-réseau Data soit inspecté.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si elle est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The effective routes of a VM in Spoke1 contain 172.16.0.0/16 with the next hop 10.10.3.4.", fr: "Les itinéraires effectifs d'une VM de Spoke1 contiennent 172.16.0.0/16 avec le tronçon suivant 10.10.3.4." } }
        - { id: s2, text: { en: "Traffic from a VM in the App subnet to 10.10.4.10 is sent to NVA1.", fr: "Le trafic d'une VM du sous-réseau App vers 10.10.4.10 est envoyé à NVA1." } }
        - { id: s3, text: { en: "If NVA1 advertises 4,200 routes, RS1 keeps the BGP session and programs the first 4,000 routes.", fr: "Si NVA1 annonce 4 200 itinéraires, RS1 conserve la session BGP et programme les 4 000 premiers itinéraires." } }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          With the spoke peering set to use the remote gateway or Route Server, RS1 programs the routes learned from NVA1 into the spoke VMs, with NVA1 as the next hop. Route Server can't steer traffic between subnets of its own virtual network: the virtual network system route is preferred over a BGP route, even a more specific one, so a UDR is needed for the Data subnet. Each BGP peer can advertise up to 4,000 routes; above that, Route Server drops the BGP session.
        fr: |
          Comme le peering du spoke utilise la passerelle ou le serveur de routes distant, RS1 programme dans les VM du spoke les itinéraires appris de NVA1, avec NVA1 comme tronçon suivant. Route Server ne peut pas orienter le trafic entre sous-réseaux de son propre réseau virtuel : l'itinéraire système du réseau virtuel est préféré à un itinéraire BGP, même plus spécifique ; une UDR est donc nécessaire pour le sous-réseau Data. Chaque pair BGP peut annoncer jusqu'à 4 000 itinéraires ; au-delà, Route Server coupe la session BGP.
      options:
        s2: { en: "The 10.10.0.0/16 virtual network system route beats the BGP route 10.10.4.0/24 despite its longer prefix.", fr: "L'itinéraire système 10.10.0.0/16 du réseau virtuel bat l'itinéraire BGP 10.10.4.0/24 malgré son préfixe plus long." }
        s3: { en: "Exceeding 4,000 routes tears down the BGP session; Route Server doesn't truncate the advertisement.", fr: "Dépasser 4 000 itinéraires coupe la session BGP ; Route Server ne tronque pas l'annonce." }
    references:
      - title: Azure Route Server frequently asked questions
        url: https://learn.microsoft.com/en-us/azure/route-server/route-server-faq
      - title: Azure virtual network traffic routing
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview

  # ------------------------------------------------------------------ 8
  - id: az700-qz-15-08
    objective: "1.3.10"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware has a hub virtual network named **VNet-Hub** in Germany West Central that contains a zone-redundant Azure Firewall named **FW1**, with a single Standard public IP address. Twelve spoke virtual networks are peered with VNet-Hub. The route tables of the spoke subnets send 0.0.0.0/0 to the private IP address of FW1.

        During batch runs, FW1 reports SNAT port exhaustion for connections to a SaaS API. You have the following requirements:

        - Internet-bound traffic from the spokes must still be inspected by FW1.
        - Outbound connectivity must survive the failure of one availability zone.
        - SNAT ports must be allocated dynamically, with up to 64,512 ports per public IP address.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un réseau virtuel hub nommé **VNet-Hub** en Germany West Central qui contient un Pare-feu Azure redondant interzone nommé **FW1**, avec une seule adresse IP publique Standard. Douze réseaux virtuels spokes sont reliés à VNet-Hub par peering. Les tables de routage des sous-réseaux des spokes envoient 0.0.0.0/0 vers l'adresse IP privée de FW1.

        Pendant les traitements par lots, FW1 signale un épuisement des ports SNAT pour les connexions vers une API SaaS. Vous avez les exigences suivantes :

        - Le trafic des spokes destiné à Internet doit toujours être inspecté par FW1.
        - La connectivité sortante doit survivre à la panne d'une zone de disponibilité.
        - Les ports SNAT doivent être alloués dynamiquement, avec jusqu'à 64 512 ports par adresse IP publique.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create a StandardV2 NAT gateway that uses StandardV2 public IP addresses.", fr: "Créer une passerelle NAT StandardV2 qui utilise des adresses IP publiques StandardV2." } }
        - { id: b, text: { en: "Create a Standard NAT gateway in zone 1 that uses Standard public IP addresses.", fr: "Créer une passerelle NAT Standard dans la zone 1 qui utilise des adresses IP publiques Standard." } }
        - { id: c, text: { en: "Associate the NAT gateway with AzureFirewallSubnet in VNet-Hub.", fr: "Associer la passerelle NAT à AzureFirewallSubnet dans VNet-Hub." } }
        - { id: d, text: { en: "Associate the NAT gateway with the workload subnets of the twelve spokes.", fr: "Associer la passerelle NAT aux sous-réseaux de charge de travail des douze spokes." } }
        - { id: e, text: { en: "Change the 0.0.0.0/0 routes of the spokes to use the NAT gateway as the next hop.", fr: "Modifier les itinéraires 0.0.0.0/0 des spokes pour utiliser la passerelle NAT comme tronçon suivant." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          A NAT gateway associated with AzureFirewallSubnet becomes the outbound path of the firewall: the spokes still route to FW1 for inspection, and FW1's outbound flows then use the NAT gateway's dynamically allocated SNAT ports, 64,512 per public IP address. The Standard NAT gateway doesn't support zone-redundant deployments, so a zone-redundant firewall needs a StandardV2 NAT gateway, which works only with StandardV2 public IP addresses.
        fr: |
          Une passerelle NAT associée à AzureFirewallSubnet devient le chemin sortant du pare-feu : les spokes routent toujours vers FW1 pour l'inspection, puis les flux sortants de FW1 utilisent les ports SNAT alloués dynamiquement de la passerelle NAT, 64 512 par adresse IP publique. La passerelle NAT Standard ne prend pas en charge les déploiements redondants interzone : un pare-feu redondant interzone exige une passerelle NAT StandardV2, qui ne fonctionne qu'avec des adresses IP publiques StandardV2.
      options:
        b: { en: "A zonal Standard NAT gateway fails with its zone, so outbound connectivity wouldn't survive a zone 1 outage.", fr: "Une passerelle NAT Standard zonale tombe avec sa zone : la connectivité sortante ne survivrait pas à une panne de la zone 1." }
        d: { en: "A NAT gateway can't span virtual networks, and on the spoke subnets the 0.0.0.0/0 UDR to FW1 takes precedence over a NAT gateway anyway.", fr: "Une passerelle NAT ne peut pas couvrir plusieurs réseaux virtuels, et sur les sous-réseaux des spokes l'UDR 0.0.0.0/0 vers FW1 est de toute façon prioritaire sur une passerelle NAT." }
        e: { en: "A NAT gateway isn't a next hop type of a UDR, and sending the traffic past FW1 would stop the inspection.", fr: "Une passerelle NAT n'est pas un type de tronçon suivant d'UDR, et faire contourner FW1 au trafic arrêterait l'inspection." }
    references:
      - title: Integrate Azure Firewall with NAT Gateway V2 for zone-redundant SNAT
        url: https://learn.microsoft.com/en-us/azure/firewall/integrate-with-nat-gateway-v2
      - title: Scale SNAT ports with Azure NAT Gateway
        url: https://learn.microsoft.com/en-us/azure/firewall/integrate-with-nat-gateway

  # ------------------------------------------------------------------ 9
  - id: az700-qz-15-09
    objective: "1.3.6"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Proseware has a hub virtual network named **VNet-Hub** that contains a VPN gateway with a BGP-enabled site-to-site connection to the datacenter. The datacenter routers advertise 0.0.0.0/0 over BGP so that all internet-bound traffic leaves through the datacenter proxies.

        You are deploying a new Azure Firewall Premium named **FW2** in VNet-Hub with the Firewall Management NIC enabled. The internet-bound traffic that FW2 forwards must follow the 0.0.0.0/0 route advertised by the datacenter, without static routes to maintain. The management traffic of FW2 must keep working, and the solution must use the smallest supported subnet.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'un réseau virtuel hub nommé **VNet-Hub** qui contient une passerelle VPN avec une connexion de site à site, avec BGP, vers le centre de données. Les routeurs du centre de données annoncent 0.0.0.0/0 par BGP afin que tout le trafic destiné à Internet sorte par les proxys du centre de données.

        Vous déployez dans VNet-Hub un nouveau Pare-feu Azure Premium nommé **FW2**, avec la carte réseau de gestion (Firewall Management NIC) activée. Le trafic destiné à Internet que FW2 transfère doit suivre la route 0.0.0.0/0 annoncée par le centre de données, sans itinéraire statique à maintenir. Le trafic de gestion de FW2 doit continuer à fonctionner, et la solution doit utiliser le plus petit sous-réseau pris en charge.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Management subnet name: [[name]]
          Management subnet prefix: [[size]]
          Routing of the management subnet: [[mgmt]]
          Routing of AzureFirewallSubnet: [[data]]
        fr: |
          Nom du sous-réseau de gestion : [[name]]
          Préfixe du sous-réseau de gestion : [[size]]
          Routage du sous-réseau de gestion : [[mgmt]]
          Routage d'AzureFirewallSubnet : [[data]]
      slots:
        - id: name
          options:
            - { id: mgmtsub, text: AzureFirewallManagementSubnet }
            - { id: fwsub, text: AzureFirewallSubnet }
            - { id: gwsub, text: GatewaySubnet }
            - { id: rssub, text: RouteServerSubnet }
        - id: size
          options:
            - { id: s28, text: /28 }
            - { id: s27, text: /27 }
            - { id: s26, text: /26 }
            - { id: s25, text: /25 }
        - id: mgmt
          options:
            - { id: inetnoprop, text: { en: "Only 0.0.0.0/0 to Internet, Propagate gateway routes disabled", fr: "Uniquement 0.0.0.0/0 vers Internet, Propager les itinéraires de passerelle désactivé" } }
            - { id: inetprop, text: { en: "Only 0.0.0.0/0 to Internet, Propagate gateway routes enabled", fr: "Uniquement 0.0.0.0/0 vers Internet, Propager les itinéraires de passerelle activé" } }
            - { id: vgwprop, text: { en: "0.0.0.0/0 to Virtual network gateway, Propagate gateway routes enabled", fr: "0.0.0.0/0 vers Virtual network gateway, Propager les itinéraires de passerelle activé" } }
            - { id: none, text: { en: "0.0.0.0/0 to None, Propagate gateway routes disabled", fr: "0.0.0.0/0 vers None, Propager les itinéraires de passerelle désactivé" } }
        - id: data
          options:
            - { id: prop, text: { en: "No 0.0.0.0/0 UDR, Propagate gateway routes enabled", fr: "Aucune UDR 0.0.0.0/0, Propager les itinéraires de passerelle activé" } }
            - { id: noprop, text: { en: "No 0.0.0.0/0 UDR, Propagate gateway routes disabled", fr: "Aucune UDR 0.0.0.0/0, Propager les itinéraires de passerelle désactivé" } }
            - { id: inet, text: { en: "0.0.0.0/0 to Internet, Propagate gateway routes enabled", fr: "0.0.0.0/0 vers Internet, Propager les itinéraires de passerelle activé" } }
    answer:
      values: { name: mgmtsub, size: s26, mgmt: inetnoprop, data: prop }
    explanation:
      correct:
        en: |
          The Firewall Management NIC uses a dedicated subnet named AzureFirewallManagementSubnet, at least /26, with its own public IP address. Its only allowed route is a default route to the internet, and gateway route propagation must be disabled on it, so that no route learned from the datacenter applies to the management traffic. On AzureFirewallSubnet, enabling Propagate gateway routes lets FW2 learn the BGP default route, so its forwarded internet traffic goes to the datacenter without a static UDR.
        fr: |
          La carte réseau de gestion du pare-feu utilise un sous-réseau dédié nommé AzureFirewallManagementSubnet, d'au moins /26, avec sa propre adresse IP publique. La seule route autorisée y est une route par défaut vers Internet, et la propagation des itinéraires de passerelle doit y être désactivée, afin qu'aucun itinéraire appris du centre de données ne s'applique au trafic de gestion. Sur AzureFirewallSubnet, activer Propager les itinéraires de passerelle permet à FW2 d'apprendre la route par défaut BGP : son trafic Internet transféré part vers le centre de données sans UDR statique.
      options:
        fwsub: { en: "AzureFirewallSubnet carries the data traffic of the firewall; the management NIC needs its own subnet.", fr: "AzureFirewallSubnet porte le trafic de données du pare-feu ; la carte réseau de gestion exige son propre sous-réseau." }
        s27: { en: "/27 is smaller than the /26 minimum of AzureFirewallManagementSubnet.", fr: "/27 est plus petit que le minimum /26 d'AzureFirewallManagementSubnet." }
        inetprop: { en: "Propagate gateway routes must be disabled on AzureFirewallManagementSubnet: the management subnet must not receive the on-premises routes.", fr: "Propager les itinéraires de passerelle doit être désactivé sur AzureFirewallManagementSubnet : le sous-réseau de gestion ne doit pas recevoir les itinéraires locaux." }
        noprop: { en: "With propagation disabled and no UDR, FW2 would keep the system route to the internet and bypass the datacenter.", fr: "Avec la propagation désactivée et sans UDR, FW2 garderait la route système vers Internet et contournerait le centre de données." }
        inet: { en: "A 0.0.0.0/0 UDR to Internet wins over the BGP route with the same prefix, so FW2 would bypass the datacenter.", fr: "Une UDR 0.0.0.0/0 vers Internet l'emporte sur la route BGP de même préfixe : FW2 contournerait le centre de données." }
    references:
      - title: Azure Firewall Management NIC
        url: https://learn.microsoft.com/en-us/azure/firewall/management-nic
      - title: Azure Firewall forced tunneling
        url: https://learn.microsoft.com/en-us/azure/firewall/forced-tunneling

  # ------------------------------------------------------------------ 10
  - id: az700-qz-15-10
    objective: "1.3.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Wingtip has a spoke virtual network named **Spoke-App** (10.20.0.0/16) peered with a hub named **VNet-Hub** (10.0.0.0/16). The spoke peering uses the remote gateway of the hub, whose VPN gateway learns on-premises prefixes over BGP. A network virtual appliance (NVA) in VNet-Hub has the IP address 10.0.3.4.

        A VM named **VM-App1** runs in a subnet of Spoke-App associated with a route table named **RT-App**. The **Effective routes** exhibit shows the effective routes of its network interface.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip dispose d'un réseau virtuel spoke nommé **Spoke-App** (10.20.0.0/16) relié par peering à un hub nommé **VNet-Hub** (10.0.0.0/16). Le peering du spoke utilise la passerelle distante du hub, dont la passerelle VPN apprend les préfixes locaux par BGP. Une appliance virtuelle réseau (NVA) de VNet-Hub a l'adresse IP 10.0.3.4.

        Une VM nommée **VM-App1** s'exécute dans un sous-réseau de Spoke-App associé à une table de routage nommée **RT-App**. La pièce **Itinéraires effectifs** montre les itinéraires effectifs de son interface réseau.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si elle est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    exhibits:
      - id: routes
        title: { en: "Effective routes", fr: "Itinéraires effectifs" }
        body:
          en: |
            | Source | State | Address prefixes | Next hop type | Next hop IP address |
            | --- | --- | --- | --- | --- |
            | Default | Active | 10.20.0.0/16 | Virtual network | - |
            | Default | Active | 10.0.0.0/16 | VNet peering | - |
            | Virtual network gateway | Active | 192.168.0.0/16 | Virtual network gateway | 10.0.255.4, 10.0.255.5 |
            | Virtual network gateway | Invalid | 172.16.0.0/16 | Virtual network gateway | 10.0.255.4, 10.0.255.5 |
            | User | Active | 172.16.0.0/16 | Virtual appliance | 10.0.3.4 |
            | User | Active | 192.168.50.0/24 | None | - |
            | Default | Invalid | 0.0.0.0/0 | Internet | - |
            | User | Active | 0.0.0.0/0 | Virtual appliance | 10.0.3.4 |
          fr: |
            | Source | État | Préfixes d'adresse | Type de tronçon suivant | Adresse IP du tronçon suivant |
            | --- | --- | --- | --- | --- |
            | Default | Active | 10.20.0.0/16 | Virtual network | - |
            | Default | Active | 10.0.0.0/16 | VNet peering | - |
            | Virtual network gateway | Active | 192.168.0.0/16 | Virtual network gateway | 10.0.255.4, 10.0.255.5 |
            | Virtual network gateway | Invalid | 172.16.0.0/16 | Virtual network gateway | 10.0.255.4, 10.0.255.5 |
            | User | Active | 172.16.0.0/16 | Virtual appliance | 10.0.3.4 |
            | User | Active | 192.168.50.0/24 | None | - |
            | Default | Invalid | 0.0.0.0/0 | Internet | - |
            | User | Active | 0.0.0.0/0 | Virtual appliance | 10.0.3.4 |
    body:
      statements:
        - { id: s1, text: { en: "Traffic from VM-App1 to 192.168.50.20 is dropped.", fr: "Le trafic de VM-App1 vers 192.168.50.20 est abandonné." } }
        - { id: s2, text: { en: "Traffic from VM-App1 to 172.16.8.8 is sent to the VPN gateway.", fr: "Le trafic de VM-App1 vers 172.16.8.8 est envoyé à la passerelle VPN." } }
        - { id: s3, text: { en: "If you set Propagate gateway routes to No on RT-App, traffic from VM-App1 to 192.168.50.20 is still dropped.", fr: "Si vous définissez Propager les itinéraires de passerelle sur Non dans RT-App, le trafic de VM-App1 vers 192.168.50.20 est toujours abandonné." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Azure applies longest prefix match first: 192.168.50.20 matches the BGP route 192.168.0.0/16 and the user-defined route 192.168.50.0/24, and the /24 with next hop None wins, so the traffic is dropped. For 172.16.8.8, the user-defined and BGP routes have the same prefix, so the user-defined route wins (the BGP route is Invalid) and the traffic goes to the NVA. Disabling gateway route propagation removes only the routes learned from the gateway; the user-defined 192.168.50.0/24 route stays and still drops the traffic.
        fr: |
          Azure applique d'abord la correspondance du préfixe le plus long : 192.168.50.20 correspond à l'itinéraire BGP 192.168.0.0/16 et à l'itinéraire défini par l'utilisateur 192.168.50.0/24, et le /24 de tronçon suivant None l'emporte : le trafic est abandonné. Pour 172.16.8.8, l'itinéraire défini par l'utilisateur et l'itinéraire BGP ont le même préfixe : l'itinéraire défini par l'utilisateur l'emporte (l'itinéraire BGP est Invalid) et le trafic part vers la NVA. Désactiver la propagation des itinéraires de passerelle ne retire que les itinéraires appris de la passerelle ; l'itinéraire défini par l'utilisateur 192.168.50.0/24 reste et abandonne toujours le trafic.
      options:
        s2: { en: "Invalid means that a route with the same prefix and a higher-priority source, here the user-defined route to the NVA, overrides it.", fr: "Invalid signifie qu'un itinéraire de même préfixe et de source plus prioritaire, ici l'itinéraire défini par l'utilisateur vers la NVA, le remplace." }
    references:
      - title: Azure virtual network traffic routing
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
      - title: Diagnose an Azure virtual machine routing problem
        url: https://learn.microsoft.com/en-us/azure/virtual-network/diagnose-network-routing-problem
