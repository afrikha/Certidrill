id: az700-1a-07-vnet-region-scope
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a virtual network named VNet1 in the West Europe region. VNet1 has the address space 10.1.0.0/16 and contains several virtual machines.

    You need to deploy a virtual machine named VM-US1 in the East US region. VM-US1 must communicate with the virtual machines in VNet1 by using private IP addresses.

    What should you do?
  fr: |
    Northwind Traders dispose d'un réseau virtuel nommé VNet1 dans la région West Europe. VNet1 a pour espace d'adressage 10.1.0.0/16 et contient plusieurs machines virtuelles.

    Vous devez déployer une machine virtuelle nommée VM-US1 dans la région East US. VM-US1 doit communiquer avec les machines virtuelles de VNet1 en utilisant des adresses IP privées.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Create a virtual network in East US, deploy VM-US1 in it, and peer it with VNet1.
        fr: Créer un réseau virtuel dans la région East US, y déployer VM-US1, puis le relier par peering à VNet1.
    - id: b
      text:
        en: Add the address range 10.2.0.0/16 to VNet1 and create a subnet in East US for VM-US1.
        fr: Ajouter la plage 10.2.0.0/16 à VNet1 et créer un sous-réseau dans la région East US pour VM-US1.
    - id: c
      text:
        en: Move VNet1 to a resource group located in East US, then deploy VM-US1 in VNet1.
        fr: Déplacer VNet1 vers un groupe de ressources situé dans la région East US, puis déployer VM-US1 dans VNet1.
    - id: d
      text:
        en: Deploy VM-US1 in East US and attach its network interface to a subnet of VNet1.
        fr: Déployer VM-US1 dans la région East US et attacher son interface réseau à un sous-réseau de VNet1.
answer: { optionId: a }
explanation:
  correct:
    en: A virtual network exists in a single region, and every resource connected to it must be in the same region. To connect resources in another region, create a virtual network there and connect it with global virtual network peering, which carries private traffic over the Microsoft backbone.
    fr: Un réseau virtuel n'existe que dans une seule région, et toute ressource qui y est connectée doit se trouver dans la même région. Pour connecter des ressources d'une autre région, créez-y un réseau virtuel et reliez-le par peering de réseaux virtuels global, qui transporte le trafic privé sur le réseau principal de Microsoft.
  options:
    b: { en: "Subnets have no region of their own: they are always in the region of their virtual network.", fr: "Les sous-réseaux n'ont pas de région propre : ils sont toujours dans la région de leur réseau virtuel." }
    c: { en: "The location of a resource group doesn't change the region of the resources it contains.", fr: "L'emplacement d'un groupe de ressources ne change pas la région des ressources qu'il contient." }
    d: { en: "A network interface must be in the same region as the virtual network it connects to.", fr: "Une interface réseau doit se trouver dans la même région que le réseau virtuel auquel elle est connectée." }
references:
  - title: Create, change, or delete an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-virtual-network
