id: az700-1b-dns-cname-conflict
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip hosts the public zone **wingtip.com** in Azure DNS. The zone contains an A record set named `app` with the address 203.0.113.40.

    The web application moves to Azure App Service, and `app.wingtip.com` must now resolve through the host name `wingtip-app.azurewebsites.net`. When you try to create a CNAME record set named `app`, the operation fails.

    What should you do first?
  fr: |
    Wingtip héberge la zone publique **wingtip.com** dans Azure DNS. La zone contient un jeu d'enregistrements A nommé `app` avec l'adresse 203.0.113.40.

    L'application web migre vers Azure App Service, et `app.wingtip.com` doit désormais être résolu par le nom d'hôte `wingtip-app.azurewebsites.net`. Quand vous tentez de créer un jeu d'enregistrements CNAME nommé `app`, l'opération échoue.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Increase the TTL of the app A record set.", fr: "Augmenter la durée de vie (TTL) du jeu d'enregistrements A app." }
    - id: b
      text: { en: "Delete the app A record set.", fr: "Supprimer le jeu d'enregistrements A app." }
    - id: c
      text: { en: "Create the CNAME record set at the zone apex.", fr: "Créer le jeu d'enregistrements CNAME à l'apex de la zone." }
    - id: d
      text: { en: "Add a second record to the app A record set.", fr: "Ajouter un second enregistrement au jeu d'enregistrements A app." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A CNAME record set can't coexist with another record set of the same name. You must delete the app A record set before you create the CNAME record set app.
    fr: |
      Un jeu d'enregistrements CNAME ne peut pas coexister avec un autre jeu d'enregistrements du même nom. Vous devez supprimer le jeu d'enregistrements A app avant de créer le jeu d'enregistrements CNAME app.
  options:
    a: { en: "The TTL controls caching; it doesn't remove the name conflict.", fr: "La durée de vie contrôle la mise en cache ; elle ne supprime pas le conflit de noms." }
    c: { en: "A CNAME can't exist at the apex, which already contains the NS and SOA record sets, and it would not cover app.wingtip.com.", fr: "Un CNAME ne peut pas exister à l'apex, qui contient déjà les jeux NS et SOA, et il ne couvrirait pas app.wingtip.com." }
    d: { en: "More A records keep the conflict and still point to IP addresses, not to the App Service host name.", fr: "Plus d'enregistrements A conservent le conflit et pointent toujours vers des adresses IP, pas vers le nom d'hôte App Service." }
references:
  - title: Overview of DNS zones and records
    url: https://learn.microsoft.com/en-us/azure/dns/dns-zones-records
