id: az700-1b-chaining-expressroute-hub
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has a hub virtual network named **VNet-Hub** that contains an ExpressRoute gateway. Eight spoke virtual networks are peered with VNet-Hub and use the remote gateway of the hub. The spokes aren't peered with each other.

    You need to enable communication between all the spokes. All spoke-to-spoke traffic must be inspected by a central firewall, and the on-premises connectivity of the spokes must not change.

    What should you do?
  fr: |
    Woodgrove dispose d'un réseau virtuel hub nommé **VNet-Hub** qui contient une passerelle ExpressRoute. Huit réseaux virtuels spokes sont reliés par peering à VNet-Hub et utilisent la passerelle distante du hub. Les spokes ne sont pas reliés entre eux par peering.

    Vous devez permettre la communication entre tous les spokes. Tout le trafic entre spokes doit être inspecté par un pare-feu central, et la connectivité locale des spokes ne doit pas changer.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add routes to the other spokes with the next hop type Virtual network gateway in each spoke.", fr: "Ajouter dans chaque spoke des itinéraires vers les autres spokes avec le type de tronçon suivant Passerelle de réseau virtuel." }
    - id: b
      text: { en: "Select Allow forwarded traffic on the peerings from VNet-Hub to each spoke.", fr: "Sélectionner l'autorisation du trafic transféré sur les peerings de VNet-Hub vers chaque spoke." }
    - id: c
      text: { en: "Peer all the spokes with each other and filter the traffic with network security groups.", fr: "Relier tous les spokes entre eux par peering et filtrer le trafic avec des groupes de sécurité réseau." }
    - id: d
      text: { en: "Deploy Azure Firewall in VNet-Hub and add spoke routes with the next hop type Virtual appliance.", fr: "Déployer le Pare-feu Azure dans VNet-Hub et ajouter des itinéraires de spokes avec le type de tronçon suivant Appliance virtuelle." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Spoke-to-spoke service chaining uses a firewall or NVA in the hub and user-defined routes in each spoke whose next hop is its private IP address (with forwarded traffic accepted on the spoke peerings). The firewall inspects every flow, and the routes to on-premises through the ExpressRoute gateway are unchanged.
    fr: |
      Le chaînage de services entre spokes utilise un pare-feu ou une NVA dans le hub et, dans chaque spoke, des itinéraires définis par l'utilisateur dont le tronçon suivant est son adresse IP privée (avec le trafic transféré accepté sur les peerings des spokes). Le pare-feu inspecte chaque flux, et les itinéraires vers le réseau local par la passerelle ExpressRoute ne changent pas.
  options:
    a: { en: "The Virtual network gateway next hop works only with VPN gateways; a user-defined route can't send traffic to an ExpressRoute gateway.", fr: "Le tronçon suivant Passerelle de réseau virtuel ne fonctionne qu'avec les passerelles VPN ; un itinéraire défini par l'utilisateur ne peut pas envoyer de trafic vers une passerelle ExpressRoute." }
    c: { en: "Direct peerings would connect the spokes, but the traffic would bypass the central firewall.", fr: "Des peerings directs connecteraient les spokes, mais le trafic contournerait le pare-feu central." }
    b: { en: "Accepting forwarded traffic is needed only when a device forwards the traffic; without routes, no spoke sends traffic for another spoke to the hub.", fr: "L'acceptation du trafic transféré n'est utile que si un équipement transfère le trafic ; sans itinéraires, aucun spoke n'envoie au hub le trafic destiné à un autre spoke." }
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
  - title: Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
