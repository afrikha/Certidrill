id: az700-1b-dns-solution-by-scenario
objective: "1.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware is designing name resolution for its Azure environment. The environment contains several virtual networks, and it is connected to the on-premises network by a site-to-site VPN.

    Which solution should you use for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware conçoit la résolution de noms de son environnement Azure. L'environnement contient plusieurs réseaux virtuels et il est connecté au réseau local par un VPN site à site.

    Quelle solution devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: azdns, text: { en: "Azure-provided DNS", fr: "DNS fourni par Azure" } }
    - { id: pzone, text: { en: "Azure private DNS zone", fr: "Zone DNS privée Azure" } }
    - { id: outbound, text: { en: "DNS Private Resolver outbound endpoint and forwarding ruleset", fr: "Point de terminaison sortant et ensemble de règles de transfert DNS Private Resolver" } }
    - { id: dc, text: { en: "Custom DNS servers set to the domain controllers", fr: "Serveurs DNS personnalisés définis sur les contrôleurs de domaine" } }
    - { id: public, text: { en: "Azure public DNS zone", fr: "Zone DNS publique Azure" } }
  targets:
    - id: onprem
      text: { en: "Azure virtual machines that use the default DNS settings must resolve names of a zone hosted on the on-premises DNS servers, without deploying any server in Azure", fr: "Des machines virtuelles Azure qui utilisent les paramètres DNS par défaut doivent résoudre les noms d'une zone hébergée sur les serveurs DNS locaux, sans déployer de serveur dans Azure" }
    - id: ad
      text: { en: "Domain-joined virtual machines must register their records dynamically in an Active Directory-integrated zone", fr: "Des machines virtuelles jointes à un domaine doivent inscrire dynamiquement leurs enregistrements dans une zone intégrée à Active Directory" }
    - id: internet
      text: { en: "Clients on the internet must resolve the records of the litware.com domain that Litware bought from a registrar", fr: "Des clients sur Internet doivent résoudre les enregistrements du domaine litware.com que Litware a acheté auprès d'un bureau d'enregistrement" }
answer:
  mapping: { onprem: outbound, ad: dc, internet: public }
explanation:
  correct:
    en: |
      An outbound endpoint with a forwarding ruleset linked to the virtual network forwards the on-premises zone to the on-premises DNS servers, with nothing to deploy or patch. Dynamic registration in an Active Directory-integrated zone needs the domain controllers as the DNS servers of the virtual machines. Internet clients need an authoritative public zone, hosted in Azure DNS once the domain is delegated.
    fr: |
      Un point de terminaison sortant associé à un ensemble de règles de transfert lié au réseau virtuel transfère la zone locale vers les serveurs DNS locaux, sans rien déployer ni corriger. L'inscription dynamique dans une zone intégrée à Active Directory exige que les contrôleurs de domaine soient les serveurs DNS des machines virtuelles. Les clients Internet ont besoin d'une zone publique faisant autorité, hébergée dans Azure DNS une fois le domaine délégué.
  options:
    azdns: { en: "Azure-provided DNS resolves only Azure host names and public names; it can't forward to on-premises servers or accept custom records.", fr: "Le DNS fourni par Azure ne résout que les noms d'hôtes Azure et les noms publics ; il ne peut ni transférer vers des serveurs locaux ni accepter des enregistrements personnalisés." }
    pzone: { en: "A private zone answers only linked virtual networks and isn't an Active Directory-integrated zone.", fr: "Une zone privée ne répond qu'aux réseaux virtuels liés et n'est pas une zone intégrée à Active Directory." }
references:
  - title: Configure DNS name resolution for Azure virtual networks
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-name-resolution-for-vms-and-role-instances
  - title: What is Azure DNS Private Resolver?
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
