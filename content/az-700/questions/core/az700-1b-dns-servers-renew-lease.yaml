id: az700-1b-dns-servers-renew-lease
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind has a virtual network named **VNet1** that contains 12 running Windows Server virtual machines. The network interfaces of the virtual machines inherit their DNS settings from VNet1.

    You change the DNS servers of VNet1 from Default (Azure-provided) to Custom, with the addresses 10.1.0.4 and 10.1.0.5. One hour later, `ipconfig /all` on the virtual machines still shows 168.63.129.16 as the DNS server.

    You need the virtual machines to use the new DNS servers.

    What should you do?
  fr: |
    Northwind dispose d'un réseau virtuel nommé **VNet1** qui contient 12 machines virtuelles Windows Server en cours d'exécution. Les interfaces réseau des machines virtuelles héritent leurs paramètres DNS de VNet1.

    Vous remplacez les serveurs DNS de VNet1, Par défaut (fourni par Azure), par Personnalisé, avec les adresses 10.1.0.4 et 10.1.0.5. Une heure plus tard, `ipconfig /all` affiche toujours 168.63.129.16 comme serveur DNS sur les machines virtuelles.

    Vous devez faire en sorte que les machines virtuelles utilisent les nouveaux serveurs DNS.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Type the new addresses in the network adapter settings of each guest operating system.", fr: "Saisir les nouvelles adresses dans les paramètres de la carte réseau de chaque système d'exploitation invité." }
    - id: b
      text: { en: "Set the DNS servers of each network interface to Custom with the same addresses.", fr: "Définir les serveurs DNS de chaque interface réseau sur Personnalisé avec les mêmes adresses." }
    - id: c
      text: { en: "Renew the DHCP lease on each virtual machine, or restart the virtual machines.", fr: "Renouveler le bail DHCP sur chaque machine virtuelle, ou redémarrer les machines virtuelles." }
    - id: d
      text: { en: "Link a private DNS zone to VNet1 so that the new DNS settings are pushed to the virtual machines.", fr: "Lier une zone DNS privée à VNet1 pour que les nouveaux paramètres DNS soient envoyés aux machines virtuelles." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Virtual machines receive their DNS servers through DHCP. After you change the DNS settings of a virtual network, the running virtual machines keep the previous servers until they renew their DHCP lease (`ipconfig /renew` on Windows) or restart.
    fr: |
      Les machines virtuelles reçoivent leurs serveurs DNS par DHCP. Après une modification des paramètres DNS d'un réseau virtuel, les machines virtuelles en cours d'exécution conservent les anciens serveurs jusqu'au renouvellement de leur bail DHCP (`ipconfig /renew` sous Windows) ou à leur redémarrage.
  options:
    b: { en: "The network interfaces already inherit the new setting; a custom value on each interface adds work and is also applied only at the next lease renewal.", fr: "Les interfaces réseau héritent déjà du nouveau paramètre ; une valeur personnalisée sur chaque interface ajoute du travail et ne s'applique elle aussi qu'au prochain renouvellement du bail." }
    a: { en: "DNS settings shouldn't be edited inside the guest: they can be erased during a service heal, and Azure manages them through DHCP.", fr: "Les paramètres DNS ne doivent pas être modifiés dans l'invité : ils peuvent être effacés lors d'une réparation de service, et Azure les gère par DHCP." }
    d: { en: "A private DNS zone link adds records to resolve; it doesn't change which DNS servers the virtual machines use.", fr: "Un lien de zone DNS privée ajoute des enregistrements à résoudre ; il ne change pas les serveurs DNS utilisés par les machines virtuelles." }
references:
  - title: Configure DNS name resolution for Azure virtual networks
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-name-resolution-for-vms-and-role-instances
