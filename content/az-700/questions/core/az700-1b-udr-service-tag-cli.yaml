id: az700-1b-udr-service-tag-cli
objective: "1.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has a route table named **RT-App** associated with the subnet of its application servers. A network virtual appliance at 10.0.9.4 inspects traffic.

    The traffic from the application servers to Azure Storage, in every Azure region, must go through the appliance. The routing of all the other traffic must not change. The solution must not require updates when Microsoft changes the IP ranges of the service.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'une table de routage nommée **RT-App**, associée au sous-réseau de ses serveurs d'applications. Une appliance virtuelle réseau à l'adresse 10.0.9.4 inspecte le trafic.

    Le trafic des serveurs d'applications vers Stockage Azure, dans toutes les régions Azure, doit passer par l'appliance. Le routage de tout le reste du trafic ne doit pas changer. La solution ne doit pas exiger de mises à jour quand Microsoft modifie les plages IP du service.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network route-table route create --resource-group RG1 \
      --route-table-name RT-App --name to-storage \
      --address-prefix [[pfx]] \
      --next-hop-type [[nht]] --next-hop-ip-address 10.0.9.4
  slots:
    - id: pfx
      options:
        - { id: storage, text: Storage }
        - { id: storagewe, text: Storage.WestEurope }
        - { id: cloud, text: AzureCloud }
        - { id: default, text: 0.0.0.0/0 }
    - id: nht
      options:
        - { id: va, text: VirtualAppliance }
        - { id: vgw, text: VirtualNetworkGateway }
        - { id: vnetlocal, text: VnetLocal }
        - { id: internet, text: Internet }
answer:
  values: { pfx: storage, nht: va }
explanation:
  correct:
    en: |
      A user-defined route can use a service tag as its address prefix, and Microsoft keeps the prefixes of the tag up to date. The top-level tag Storage covers Azure Storage in all regions. The next hop type VirtualAppliance, with the appliance's IP address, sends the matching traffic to the NVA.
    fr: |
      Un itinéraire défini par l'utilisateur peut utiliser une étiquette de service comme préfixe d'adresse, et Microsoft tient à jour les préfixes de l'étiquette. L'étiquette de premier niveau Storage couvre Stockage Azure dans toutes les régions. Le type de tronçon suivant VirtualAppliance, avec l'adresse IP de l'appliance, envoie le trafic correspondant à la NVA.
  options:
    storagewe: { en: "A regional tag covers only Azure Storage in West Europe.", fr: "Une étiquette régionale ne couvre que Stockage Azure en West Europe." }
    cloud: { en: "AzureCloud covers all Azure public IP ranges, so other traffic would change too.", fr: "AzureCloud couvre toutes les plages IP publiques d'Azure : d'autres flux changeraient aussi." }
    default: { en: "0.0.0.0/0 would send all unmatched traffic, including internet traffic, to the appliance.", fr: "0.0.0.0/0 enverrait à l'appliance tout le trafic sans autre correspondance, y compris le trafic Internet." }
    vgw: { en: "VirtualNetworkGateway sends traffic to a VPN gateway and takes no next hop IP address.", fr: "VirtualNetworkGateway envoie le trafic vers une passerelle VPN et ne prend pas d'adresse IP de tronçon suivant." }
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
