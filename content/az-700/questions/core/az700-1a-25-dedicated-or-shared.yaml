id: az700-1a-25-dedicated-or-shared
objective: "1.1.5"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Contoso is planning the subnets of a new virtual network. A subnet named snet-vms will host the application virtual machines. Four more resources must be placed, and the architects want as few subnets as possible.

    Which subnet should you plan for each resource? To answer, drag the appropriate subnets to the correct resources. Each subnet may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso planifie les sous-réseaux d'un nouveau réseau virtuel. Un sous-réseau nommé snet-vms hébergera les machines virtuelles de l'application. Quatre autres ressources doivent être placées, et les architectes veulent le moins de sous-réseaux possible.

    Quel sous-réseau devez-vous prévoir pour chaque ressource ? Pour répondre, faites glisser les sous-réseaux appropriés vers les ressources correspondantes. Chaque sous-réseau peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: vms, text: { en: "snet-vms, shared with the virtual machines", fr: "snet-vms, partagé avec les machines virtuelles" } }
    - { id: fwsub, text: { en: "A dedicated subnet named AzureFirewallSubnet", fr: "Un sous-réseau dédié nommé AzureFirewallSubnet" } }
    - { id: anyname, text: { en: "A dedicated subnet with any name, without delegation", fr: "Un sous-réseau dédié de nom quelconque, sans délégation" } }
    - { id: mysql, text: { en: "A dedicated subnet delegated to Microsoft.DBforMySQL/flexibleServers", fr: "Un sous-réseau dédié délégué à Microsoft.DBforMySQL/flexibleServers" } }
    - { id: gwsub, text: { en: "GatewaySubnet", fr: "GatewaySubnet" } }
  targets:
    - { id: t1, text: { en: "A third-party network virtual appliance", fr: "Une appliance virtuelle réseau tierce" } }
    - { id: t2, text: { en: "Azure Firewall Standard", fr: "Pare-feu Azure Standard" } }
    - { id: t3, text: { en: "Azure Database for MySQL flexible server with private access", fr: "Serveur flexible Azure Database pour MySQL avec accès privé" } }
    - { id: t4, text: { en: "Application Gateway WAF_v2", fr: "Application Gateway WAF_v2" } }
answer:
  mapping: { t1: vms, t2: fwsub, t3: mysql, t4: anyname }
explanation:
  correct:
    en: A network virtual appliance doesn't need a dedicated subnet. Azure Firewall deploys only into AzureFirewallSubnet. A MySQL flexible server with private access needs a subnet delegated to Microsoft.DBforMySQL/flexibleServers that holds only flexible servers. Application Gateway needs a subnet that contains only application gateways, with any name.
    fr: Une appliance virtuelle réseau n'a pas besoin de sous-réseau dédié. Le Pare-feu Azure se déploie uniquement dans AzureFirewallSubnet. Un serveur flexible MySQL avec accès privé a besoin d'un sous-réseau délégué à Microsoft.DBforMySQL/flexibleServers qui ne contient que des serveurs flexibles. Application Gateway a besoin d'un sous-réseau qui ne contient que des passerelles d'application, de nom quelconque.
  options:
    gwsub: { en: "GatewaySubnet is reserved for VPN and ExpressRoute gateways.", fr: "GatewaySubnet est réservé aux passerelles VPN et ExpressRoute." }
references:
  - title: Integrate Azure services with virtual networks for network isolation
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-for-azure-services
  - title: Private Network Access using virtual network integration for Azure Database for MySQL - Flexible Server
    url: https://learn.microsoft.com/en-us/azure/mysql/flexible-server/concepts-networking-vnet
