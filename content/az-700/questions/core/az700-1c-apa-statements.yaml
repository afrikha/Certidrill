id: az700-1c-apa-statements
objective: "1.4.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has enabled Defender CSPM with agentless scanning. The security team reviews attack path analysis in Microsoft Defender for Cloud and in the Microsoft Defender portal before deciding which network changes to make.

    Which two statements about attack path analysis are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso a activé Defender CSPM avec l'analyse sans agent. L'équipe de sécurité examine l'analyse du chemin d'attaque dans Microsoft Defender for Cloud et dans le portail Microsoft Defender avant de décider des modifications réseau à effectuer.

    Quelles sont les deux affirmations vraies concernant l'analyse du chemin d'attaque ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An attack path starts at an external entry point, such as an internet-exposed vulnerable resource.", fr: "Un chemin d'attaque commence à un point d'entrée externe, par exemple une ressource vulnérable exposée à Internet." } }
    - { id: b, text: { en: "A resolved attack path disappears from the list as soon as the recommendation is remediated.", fr: "Un chemin d'attaque résolu disparaît de la liste dès que la recommandation est corrigée." } }
    - { id: c, text: { en: "Choke points identify the nodes where several attack paths intersect.", fr: "Les points d'étranglement (choke points) identifient les nœuds où plusieurs chemins d'attaque se croisent." } }
    - { id: d, text: { en: "Attack paths are built only from the network security group rules of the subscription.", fr: "Les chemins d'attaque sont construits uniquement à partir des règles des groupes de sécurité réseau de l'abonnement." } }
    - { id: e, text: { en: "Every recommendation listed for an attack path fully breaks the path when it is remediated.", fr: "Chaque recommandation listée pour un chemin d'attaque coupe entièrement le chemin lorsqu'elle est corrigée." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Attack path analysis focuses on externally initiated, exploitable threats, so each path starts at an external entry point and leads to a critical target. In the Defender portal, the Attack Path Map and the Choke points view highlight the nodes where multiple paths converge, which are high-value places to remediate.
    fr: "L'analyse du chemin d'attaque se concentre sur les menaces exploitables initiées de l'extérieur : chaque chemin commence à un point d'entrée externe et mène à une cible critique. Dans le portail Defender, la carte des chemins d'attaque (Attack Path Map) et la vue Choke points mettent en évidence les nœuds où plusieurs chemins convergent, qui sont des emplacements prioritaires pour la correction."
  options:
    b: { en: "After an attack path is resolved, it can take up to 24 hours to be removed from the list.", fr: "Après la résolution d'un chemin d'attaque, sa suppression de la liste peut prendre jusqu'à 24 heures." }
    d: { en: "The cloud security graph combines inventory, internet exposure, permissions, network connections, vulnerabilities and lateral movement, not only NSG rules.", fr: "Le graphique de sécurité cloud combine l'inventaire, l'exposition à Internet, les autorisations, les connexions réseau, les vulnérabilités et les mouvements latéraux, pas seulement les règles NSG." }
    e: { en: "Additional recommendations lower the risk without fully fixing the path; only the main recommendations break it.", fr: "Les recommandations supplémentaires (Additional recommendations) réduisent le risque sans corriger entièrement le chemin ; seules les recommandations principales le coupent." }
references:
  - title: Identify and remediate attack paths in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/how-to-manage-attack-path
  - title: Security explorer and attack paths in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-attack-path
