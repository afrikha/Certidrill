id: az700-cs2b-effective-routes
objective: "1.3.7"
type: yesno_statements
caseStudy: az700-cs2b-wide-world-importers
difficulty: 3
status: draft
stem:
  en: |
    The effective routes of the network interface of VM-APP1 are shown in the **Effective routes** exhibit.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les itinéraires effectifs de l'interface réseau de VM-APP1 figurent dans la pièce jointe **Itinéraires effectifs**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
exhibits:
  - id: routes
    title: { en: "Effective routes", fr: "Itinéraires effectifs" }
    body:
      en: |
        | Source | State | Address prefix | Next hop type | Next hop IP address |
        | --- | --- | --- | --- | --- |
        | Default | Active | 10.41.0.0/16 | Virtual network | |
        | Default | Active | 10.40.0.0/16 | VNet peering | |
        | Virtual network gateway | Active | 172.16.0.0/16 | Virtual network gateway | |
        | Virtual network gateway | Active | 0.0.0.0/0 | Virtual network gateway | |
        | User | Active | 172.16.50.0/24 | Virtual appliance | 10.40.2.4 |
        | Default | Invalid | 0.0.0.0/0 | Internet | |
      fr: |
        | Source | État | Préfixe d'adresse | Type de tronçon suivant | Adresse IP du tronçon suivant |
        | --- | --- | --- | --- | --- |
        | Default | Active | 10.41.0.0/16 | Virtual network | |
        | Default | Active | 10.40.0.0/16 | VNet peering | |
        | Virtual network gateway | Active | 172.16.0.0/16 | Virtual network gateway | |
        | Virtual network gateway | Active | 0.0.0.0/0 | Virtual network gateway | |
        | User | Active | 172.16.50.0/24 | Virtual appliance | 10.40.2.4 |
        | Default | Invalid | 0.0.0.0/0 | Internet | |
body:
  statements:
    - id: s1
      text:
        en: |
          Traffic from VM-APP1 to 172.16.50.20 is sent to nva-inspect.
        fr: |
          Le trafic de VM-APP1 vers 172.16.50.20 est envoyé à nva-inspect.
    - id: s2
      text:
        en: |
          Traffic from VM-APP1 to a public IP address on the internet leaves Azure directly, without crossing ER-AMS.
        fr: |
          Le trafic de VM-APP1 vers une adresse IP publique sur Internet quitte Azure directement, sans traverser ER-AMS.
    - id: s3
      text:
        en: |
          If you add to rt-app a route for 0.0.0.0/0 with the next hop type Internet, traffic from VM-APP1 to the internet still crosses ER-AMS.
        fr: |
          Si vous ajoutez à rt-app un itinéraire pour 0.0.0.0/0 avec le type de tronçon suivant Internet, le trafic de VM-APP1 vers Internet traverse toujours ER-AMS.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Azure first selects the route with the longest prefix match, so 172.16.50.20 uses the /24 user-defined route to 10.40.2.4 rather than the /16 learned from the gateway. For 0.0.0.0/0, a BGP route beats the system route, which is why the default Internet route is Invalid and internet traffic goes to Rotterdam over ER-AMS. A user-defined route with the same prefix beats a BGP route, so a 0.0.0.0/0 route with the next hop type Internet in rt-app sends the internet traffic of snet-app directly out of Azure.
    fr: |
      Azure sélectionne d'abord l'itinéraire dont le préfixe correspond le plus longuement : 172.16.50.20 utilise donc l'itinéraire défini par l'utilisateur /24 vers 10.40.2.4 plutôt que le /16 appris de la passerelle. Pour 0.0.0.0/0, un itinéraire BGP l'emporte sur l'itinéraire système, d'où l'état Invalid de l'itinéraire Internet par défaut : le trafic Internet part vers Rotterdam par ER-AMS. Un itinéraire défini par l'utilisateur de même préfixe l'emporte sur un itinéraire BGP : un itinéraire 0.0.0.0/0 avec le type de tronçon suivant Internet dans rt-app envoie donc le trafic Internet de snet-app directement hors d'Azure.
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
