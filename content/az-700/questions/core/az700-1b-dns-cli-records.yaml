id: az700-1b-dns-cli-records
objective: "1.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware hosts the public zone **proseware.com** in Azure DNS, in a resource group named **RG1**. You need to configure the following records by using Azure CLI:

    - proseware.com (the zone apex) must resolve to 203.0.113.25.
    - shop.proseware.com must be an alias of www.proseware.com.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware héberge la zone publique **proseware.com** dans Azure DNS, dans un groupe de ressources nommé **RG1**. Vous devez configurer les enregistrements suivants avec Azure CLI :

    - proseware.com (l'apex de la zone) doit être résolu en 203.0.113.25.
    - shop.proseware.com doit être un alias de www.proseware.com.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network dns record-set [[t1]] --resource-group RG1 \
      --zone-name proseware.com --record-set-name [[n1]] --ipv4-address 203.0.113.25

    az network dns record-set [[t2]] --resource-group RG1 \
      --zone-name proseware.com --record-set-name shop --cname www.proseware.com
  slots:
    - id: t1
      options:
        - { id: aadd, text: a add-record }
        - { id: acreate, text: a create }
        - { id: nsadd, text: ns add-record }
        - { id: cnameset, text: cname set-record }
    - id: n1
      options:
        - { id: apex, text: "\"@\"" }
        - { id: star, text: "\"*\"" }
        - { id: fqdn, text: proseware.com }
        - { id: dot, text: "\".\"" }
    - id: t2
      options:
        - { id: aadd, text: a add-record }
        - { id: txtadd, text: txt add-record }
        - { id: nsadd, text: ns add-record }
        - { id: cnameset, text: cname set-record }
answer:
  values: { t1: aadd, n1: apex, t2: cnameset }
explanation:
  correct:
    en: "`a add-record` adds an IPv4 address to an A record set and creates the record set if needed. Record set names are relative to the zone, and `@` designates the apex. A CNAME record set holds a single record, which `cname set-record` sets."
    fr: "`a add-record` ajoute une adresse IPv4 à un jeu d'enregistrements A et crée le jeu si nécessaire. Les noms de jeux d'enregistrements sont relatifs à la zone, et `@` désigne l'apex. Un jeu d'enregistrements CNAME contient un seul enregistrement, que `cname set-record` définit."
  options:
    acreate: { en: "a create creates an empty record set; it doesn't take an IPv4 address.", fr: "a create crée un jeu d'enregistrements vide ; il ne prend pas d'adresse IPv4." }
    fqdn: { en: "Names are relative: proseware.com would create proseware.com.proseware.com.", fr: "Les noms sont relatifs : proseware.com créerait proseware.com.proseware.com." }
    star: { en: "* is a wildcard that answers for undefined names below the apex, not for the apex.", fr: "* est un caractère générique qui répond pour les noms non définis sous l'apex, pas pour l'apex." }
references:
  - title: Overview of DNS zones and records
    url: https://learn.microsoft.com/en-us/azure/dns/dns-zones-records
