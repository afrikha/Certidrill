id: az700-1c-apa-internet-exposure
objective: "1.4.6"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove uses Defender CSPM. A virtual machine named **VM-Web1** has no public IP address. It is in the backend pool of a Standard public load balancer, and an NSG allows TCP 443 from the internet to VM-Web1. VM-Web1 has high-severity vulnerabilities and a managed identity that can read a storage account containing sensitive data.

    Attack path analysis shows a path that starts at VM-Web1 and ends at the storage account.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove utilise Defender CSPM. Une machine virtuelle nommée **VM-Web1** n'a pas d'adresse IP publique. Elle fait partie du pool principal d'un équilibreur de charge public Standard, et un NSG autorise TCP 443 depuis Internet vers VM-Web1. VM-Web1 présente des vulnérabilités de gravité élevée et dispose d'une identité managée qui peut lire un compte de stockage contenant des données sensibles.

    L'analyse du chemin d'attaque montre un chemin qui commence à VM-Web1 et se termine au compte de stockage.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Defender for Cloud treats VM-Web1 as internet exposed even though VM-Web1 has no public IP address.
        fr: Defender for Cloud considère VM-Web1 comme exposée à Internet bien que VM-Web1 n'ait pas d'adresse IP publique.
    - id: s2
      text:
        en: To determine internet exposure, Defender for Cloud evaluates routing, NSG rules and network components such as load balancers, application gateways and Azure Firewall.
        fr: Pour déterminer l'exposition à Internet, Defender for Cloud évalue le routage, les règles NSG et des composants réseau comme les équilibreurs de charge, les passerelles d'application et le Pare-feu Azure.
    - id: s3
      text:
        en: Removing the read permission of the managed identity on the storage account leaves this attack path unchanged.
        fr: Le retrait de l'autorisation de lecture de l'identité managée sur le compte de stockage laisse ce chemin d'attaque inchangé.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Internet exposure analysis looks at control-plane configuration and at network-path reachability, so a VM behind a public load balancer can be reachable from the internet without its own public IP. It assesses application gateways, load balancers, Azure Firewall, NSGs and virtual networks or subnets. An attack path chains the entry point to the target through lateral movement, here the identity's permission; removing that permission breaks the path.
    fr: "L'analyse de l'exposition à Internet examine la configuration du plan de contrôle et l'accessibilité par les chemins réseau : une machine virtuelle derrière un équilibreur de charge public peut être joignable depuis Internet sans adresse IP publique propre. Elle évalue les passerelles d'application, les équilibreurs de charge, le Pare-feu Azure, les NSG et les réseaux virtuels ou sous-réseaux. Un chemin d'attaque relie le point d'entrée à la cible par un mouvement latéral, ici l'autorisation de l'identité ; retirer cette autorisation coupe le chemin."
references:
  - title: Internet exposure analysis
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/internet-exposure-analysis
  - title: Security explorer and attack paths in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-attack-path
