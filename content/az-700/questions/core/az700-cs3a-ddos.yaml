id: az700-cs3a-ddos
objective: "1.4.4"
type: single
caseStudy: az700-cs3a-southridge
difficulty: 1
status: draft
stem:
  en: You need to protect the public IP addresses of LB-Ingest. The solution must meet the live ingest requirements. What should you do?
  fr: Vous devez protéger les adresses IP publiques de LB-Ingest. La solution doit respecter les exigences de réception en direct. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable DDoS IP Protection on each public IP address of LB-Ingest", fr: "Activer DDoS IP Protection sur chaque adresse IP publique de LB-Ingest" } }
    - { id: b, text: { en: "Place Azure Firewall Premium in front of LB-Ingest with IDPS in Alert and deny mode", fr: "Placer un Pare-feu Azure Premium devant LB-Ingest avec IDPS en mode Alert and deny" } }
    - { id: c, text: { en: "Rely on the infrastructure DDoS protection included with every Azure public IP", fr: "S'appuyer sur la protection DDoS d'infrastructure incluse avec chaque adresse IP publique Azure" } }
    - { id: d, text: { en: "Create a DDoS protection plan and enable DDoS Network Protection on VNet-WE", fr: "Créer un plan de protection DDoS et activer DDoS Network Protection sur VNet-WE" } }
answer: { optionId: d }
explanation:
  correct:
    en: DDoS Network Protection is enabled by associating a DDoS protection plan with the virtual network, and it protects the public IP resources in that network, including the frontend of LB-Ingest. This tier includes access to the DDoS Rapid Response team during an attack and cost protection credits for scale-out caused by a documented attack.
    fr: DDoS Network Protection s'active en associant un plan de protection DDoS au réseau virtuel, et protège les ressources d'adresse IP publique de ce réseau, y compris la configuration frontale de LB-Ingest. Ce niveau donne accès à l'équipe DDoS Rapid Response pendant une attaque et à des crédits de protection des coûts pour la montée en charge causée par une attaque documentée.
  options:
    a: { en: "DDoS IP Protection protects individual public IP addresses but doesn't include DDoS Rapid Response support or cost protection.", fr: "DDoS IP Protection protège des adresses IP publiques une par une, mais n'inclut ni le support DDoS Rapid Response ni la protection des coûts." }
    b: { en: "IDPS detects and blocks malicious traffic patterns; it isn't a volumetric DDoS mitigation service and gives no access to Microsoft DDoS experts or cost protection. The firewall's own public IP would also need DDoS protection.", fr: "IDPS détecte et bloque des schémas de trafic malveillants ; ce n'est pas un service d'atténuation DDoS volumétrique et il ne donne accès ni aux experts DDoS de Microsoft, ni à la protection des coûts. L'adresse IP publique du pare-feu aurait elle-même besoin d'une protection DDoS." }
    c: { en: "The default infrastructure protection isn't tuned to the application and gives no access to Microsoft DDoS experts or service credits.", fr: "La protection d'infrastructure par défaut n'est pas adaptée à l'application et ne donne accès ni aux experts DDoS de Microsoft, ni à des crédits de service." }
references:
  - title: About Azure DDoS Protection Tier Comparison
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-sku-comparison
  - title: What is Azure DDoS Protection?
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-overview
