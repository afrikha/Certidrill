id: az700-1c-nat-usecase-match
objective: "1.3.9"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware is designing connectivity for four workloads hosted on Azure virtual machines. Each requirement must be met with the simplest suitable Azure feature.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware conçoit la connectivité de quatre charges de travail hébergées sur des machines virtuelles Azure. Chaque exigence doit être satisfaite avec la fonctionnalité Azure adaptée la plus simple.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: nat, text: { en: "Azure NAT Gateway", fr: "Azure NAT Gateway" } }
    - { id: fw, text: { en: "Azure Firewall", fr: "Pare-feu Azure" } }
    - { id: pip, text: { en: "Instance-level public IP address", fr: "Adresse IP publique au niveau de l'instance" } }
    - { id: pe, text: { en: "Private endpoint", fr: "Point de terminaison privé" } }
    - { id: ilb, text: { en: "Internal load balancer", fr: "Équilibreur de charge interne" } }
  targets:
    - id: t1
      text: { en: "300 VMs in a private subnet need scalable outbound internet access with no inspection and no inbound exposure.", fr: "300 machines virtuelles d'un sous-réseau privé ont besoin d'un accès sortant à Internet évolutif, sans inspection ni exposition entrante." }
    - id: t2
      text: { en: "Outbound internet traffic from all spokes must be allowed or denied based on destination FQDNs and logged centrally.", fr: "Le trafic Internet sortant de tous les spokes doit être autorisé ou refusé selon les noms de domaine complets (FQDN) de destination et journalisé de façon centralisée." }
    - id: t3
      text: { en: "A single lab VM must accept connections initiated from the internet on TCP 8443 directly on its own address.", fr: "Une seule machine virtuelle de laboratoire doit accepter des connexions initiées depuis Internet sur TCP 8443 directement sur sa propre adresse." }
    - id: t4
      text: { en: "VMs must reach a storage account over a private IP address of the virtual network, without going to its public endpoint.", fr: "Des machines virtuelles doivent joindre un compte de stockage via une adresse IP privée du réseau virtuel, sans passer par son point de terminaison public." }
answer:
  mapping: { t1: nat, t2: fw, t3: pip, t4: pe }
explanation:
  correct:
    en: NAT Gateway provides outbound-only SNAT for whole subnets and blocks unsolicited inbound connections. Azure Firewall adds filtering, including FQDN-based application rules, with central logging. An instance-level public IP is the direct way for one VM to accept inbound internet connections. A private endpoint gives a PaaS resource a private IP address in the virtual network. An internal load balancer distributes private traffic and does not meet any of these needs.
    fr: "NAT Gateway fournit une SNAT uniquement sortante pour des sous-réseaux entiers et bloque les connexions entrantes non sollicitées. Le Pare-feu Azure ajoute le filtrage, y compris des règles d'application basées sur les FQDN, avec une journalisation centralisée. Une adresse IP publique au niveau de l'instance est le moyen direct pour une machine virtuelle d'accepter des connexions entrantes depuis Internet. Un point de terminaison privé donne à une ressource PaaS une adresse IP privée dans le réseau virtuel. Un équilibreur de charge interne répartit du trafic privé et ne répond à aucun de ces besoins."
references:
  - title: What is Azure NAT Gateway?
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
