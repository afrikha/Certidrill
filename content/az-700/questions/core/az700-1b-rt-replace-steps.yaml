id: az700-1b-rt-replace-steps
objective: "1.3.5"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a virtual network named **VNet1** in East US. A route table named **RT-Old** is associated only with the subnet **Subnet1** of VNet1, and it sends all the traffic of Subnet1 to a firewall.

    You need to replace RT-Old with a new route table named **RT-New** that contains updated routes, and then delete RT-Old. At no point may Subnet1 use only the system routes.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'un réseau virtuel nommé **VNet1** en East US. Une table de routage nommée **RT-Old** est associée uniquement au sous-réseau **Subnet1** de VNet1, et elle envoie tout le trafic de Subnet1 vers un pare-feu.

    Vous devez remplacer RT-Old par une nouvelle table de routage nommée **RT-New** contenant des itinéraires mis à jour, puis supprimer RT-Old. À aucun moment Subnet1 ne doit utiliser uniquement les itinéraires système.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create RT-New in East US, in the subscription of VNet1.", fr: "Créer RT-New en East US, dans l'abonnement de VNet1." } }
    - { id: routes, text: { en: "Add the updated routes to RT-New.", fr: "Ajouter les itinéraires mis à jour à RT-New." } }
    - { id: assoc, text: { en: "In the settings of Subnet1, select RT-New as the route table.", fr: "Dans les paramètres de Subnet1, sélectionner RT-New comme table de routage." } }
    - { id: delete, text: { en: "Delete RT-Old.", fr: "Supprimer RT-Old." } }
    - { id: none, text: { en: "In the settings of Subnet1, set the route table to None.", fr: "Dans les paramètres de Subnet1, définir la table de routage sur None." } }
    - { id: vnet, text: { en: "Associate RT-New with VNet1.", fr: "Associer RT-New à VNet1." } }
answer:
  sequence: [ create, routes, assoc, delete ]
explanation:
  correct:
    en: |
      You prepare RT-New completely before Subnet1 uses it. A subnet has zero or one route table, so selecting RT-New replaces RT-Old in a single change, without a period on system routes only. RT-Old is then associated with no subnet, which is required before it can be deleted.
    fr: |
      Vous préparez entièrement RT-New avant que Subnet1 l'utilise. Un sous-réseau a zéro ou une table de routage : sélectionner RT-New remplace RT-Old en une seule modification, sans période avec les seuls itinéraires système. RT-Old n'est alors plus associée à aucun sous-réseau, ce qui est obligatoire avant de pouvoir la supprimer.
  options:
    none: { en: "Setting the route table to None would leave Subnet1 on the system routes until RT-New is associated.", fr: "Définir la table de routage sur None laisserait Subnet1 sur les itinéraires système jusqu'à l'association de RT-New." }
    vnet: { en: "Route tables are associated with subnets, not with virtual networks.", fr: "Les tables de routage sont associées à des sous-réseaux, pas à des réseaux virtuels." }
references:
  - title: Create, change, or delete a route table
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-route-table
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
