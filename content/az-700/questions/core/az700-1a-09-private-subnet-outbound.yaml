id: az700-1a-09-private-subnet-outbound
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In November 2026, you create a virtual network named VNet5 in the Azure portal by using the default settings. VNet5 contains a subnet named Subnet1. You deploy two virtual machines named VM1 and VM2 in Subnet1. The virtual machines have no public IP address.

    VM1 and VM2 must download updates from an internet repository. The repository accepts connections only from source IP addresses that you register in advance, and the address must not change over time. The virtual machines must not accept connections initiated from the internet.

    What should you do?
  fr: |
    En novembre 2026, vous créez dans le portail Azure un réseau virtuel nommé VNet5 en conservant les paramètres par défaut. VNet5 contient un sous-réseau nommé Subnet1. Vous déployez deux machines virtuelles nommées VM1 et VM2 dans Subnet1. Les machines virtuelles n'ont pas d'adresse IP publique.

    VM1 et VM2 doivent télécharger des mises à jour depuis un référentiel sur Internet. Le référentiel n'accepte les connexions que depuis des adresses IP sources que vous enregistrez à l'avance, et l'adresse ne doit pas changer dans le temps. Les machines virtuelles ne doivent pas accepter de connexions initiées depuis Internet.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Associate a NAT gateway that has a Standard public IP address with Subnet1.
        fr: Associer à Subnet1 une passerelle NAT dotée d'une adresse IP publique Standard.
    - id: b
      text:
        en: Disable the private subnet setting of Subnet1, then stop and deallocate VM1 and VM2.
        fr: Désactiver le paramètre de sous-réseau privé de Subnet1, puis arrêter et libérer VM1 et VM2.
    - id: c
      text:
        en: Enable the Microsoft.Storage service endpoint on Subnet1.
        fr: Activer le point de terminaison de service Microsoft.Storage sur Subnet1.
    - id: d
      text:
        en: Configure custom DNS servers on VNet5 that resolve the name of the repository.
        fr: Configurer sur VNet5 des serveurs DNS personnalisés qui résolvent le nom du référentiel.
answer: { optionId: a }
explanation:
  correct:
    en: The portal creates private subnets, so the virtual machines have no default outbound access and need an explicit outbound method. A NAT gateway gives every virtual machine of the subnet the same static outbound address that you can register with the repository, and it doesn't allow connections initiated from the internet.
    fr: |
      Le portail crée des sous-réseaux privés : les machines virtuelles n'ont pas d'accès sortant par défaut et ont besoin d'une méthode sortante explicite. Une passerelle NAT donne à toutes les machines virtuelles du sous-réseau la même adresse sortante statique, que vous pouvez enregistrer auprès du référentiel, et elle n'autorise pas les connexions initiées depuis Internet.
  options:
    b: { en: "Default outbound access uses a Microsoft-owned address that can change without notice, so it can't be registered with the repository.", fr: "L'accès sortant par défaut utilise une adresse appartenant à Microsoft qui peut changer sans préavis : elle ne peut pas être enregistrée auprès du référentiel." }
    c: { en: "A service endpoint gives a direct path to an Azure service, not to an internet repository.", fr: "Un point de terminaison de service donne un chemin direct vers un service Azure, pas vers un référentiel sur Internet." }
    d: { en: "Name resolution doesn't give the virtual machines a path to the internet.", fr: "La résolution de noms ne donne pas aux machines virtuelles de chemin vers Internet." }
references:
  - title: Default outbound access in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/default-outbound-access
  - title: What is Azure NAT Gateway?
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
