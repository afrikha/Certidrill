id: az700-1a-10-vnet-powershell-order
objective: "1.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You need to create a virtual network named VNet-Edge by using Azure PowerShell. VNet-Edge must have the address space 10.60.0.0/16 and two subnets: Front (10.60.1.0/24) and Back (10.60.2.0/24). You want the virtual network to be created with Front, then to add Back to it.

    Which four cmdlets should you run in sequence? To answer, move the appropriate cmdlets from the list of cmdlets to the answer area and arrange them in the correct order.
  fr: |
    Vous devez créer un réseau virtuel nommé VNet-Edge avec Azure PowerShell. VNet-Edge doit avoir l'espace d'adressage 10.60.0.0/16 et deux sous-réseaux : Front (10.60.1.0/24) et Back (10.60.2.0/24). Vous voulez que le réseau virtuel soit créé avec Front, puis y ajouter Back.

    Quelles sont les quatre cmdlets à exécuter dans l'ordre ? Pour répondre, déplacez les cmdlets appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: newsub, text: "$front = New-AzVirtualNetworkSubnetConfig -Name Front -AddressPrefix 10.60.1.0/24" }
    - { id: newvnet, text: "$vnet = New-AzVirtualNetwork -Name VNet-Edge -AddressPrefix 10.60.0.0/16 -Subnet $front ..." }
    - { id: addsub, text: "Add-AzVirtualNetworkSubnetConfig -Name Back -AddressPrefix 10.60.2.0/24 -VirtualNetwork $vnet" }
    - { id: setvnet, text: "Set-AzVirtualNetwork -VirtualNetwork $vnet" }
    - { id: setsub, text: "Set-AzVirtualNetworkSubnetConfig -Name Back -AddressPrefix 10.60.2.0/24 -VirtualNetwork $vnet" }
    - { id: getsub, text: "Get-AzVirtualNetworkSubnetConfig -Name Front -VirtualNetwork $vnet" }
answer:
  sequence: [ newsub, newvnet, addsub, setvnet ]
explanation:
  correct:
    en: |
      New-AzVirtualNetworkSubnetConfig builds the Front subnet object in memory, and New-AzVirtualNetwork creates the virtual network with it. Add-AzVirtualNetworkSubnetConfig adds Back only to the in-memory representation of the virtual network, so Set-AzVirtualNetwork must then write the change to Azure.
    fr: |
      New-AzVirtualNetworkSubnetConfig construit en mémoire l'objet du sous-réseau Front, et New-AzVirtualNetwork crée le réseau virtuel avec cet objet. Add-AzVirtualNetworkSubnetConfig n'ajoute Back qu'à la représentation en mémoire du réseau virtuel : Set-AzVirtualNetwork doit ensuite enregistrer la modification dans Azure.
  options:
    setsub: { en: "Set-AzVirtualNetworkSubnetConfig modifies a subnet that already exists in the configuration; it doesn't add a new one.", fr: "Set-AzVirtualNetworkSubnetConfig modifie un sous-réseau qui existe déjà dans la configuration ; elle n'en ajoute pas." }
    getsub: { en: "Get-AzVirtualNetworkSubnetConfig only reads a subnet configuration.", fr: "Get-AzVirtualNetworkSubnetConfig ne fait que lire une configuration de sous-réseau." }
references:
  - title: Add-AzVirtualNetworkSubnetConfig (Az.Network)
    url: https://learn.microsoft.com/en-us/powershell/module/az.network/add-azvirtualnetworksubnetconfig
