id: az700-1a-50-bastion-pip
objective: "1.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are deploying Azure Bastion with the Standard SKU in a virtual network named VNet-Hub in the UK South region. The deployment isn't private-only. The subscription contains the following unused public IP addresses:

    | Name | SKU | Region | Tier |
    | --- | --- | --- | --- |
    | pip-1 | Standard | UK South | Regional |
    | pip-2 | Standard v2 | UK South | Regional |
    | pip-3 | Standard | UK West | Regional |
    | pip-4 | Standard | UK South | Global |

    Which public IP address should you use for the Bastion host?
  fr: |
    Vous déployez Azure Bastion avec le SKU Standard dans un réseau virtuel nommé VNet-Hub, dans la région UK South. Le déploiement n'est pas privé uniquement. L'abonnement contient les adresses IP publiques inutilisées suivantes :

    | Nom | SKU | Région | Niveau |
    | --- | --- | --- | --- |
    | pip-1 | Standard | UK South | Régional |
    | pip-2 | Standard v2 | UK South | Régional |
    | pip-3 | Standard | UK West | Régional |
    | pip-4 | Standard | UK South | Global |

    Quelle adresse IP publique devez-vous utiliser pour l'hôte Bastion ?
body:
  options:
    - { id: a, text: pip-1 }
    - { id: b, text: pip-2 }
    - { id: c, text: pip-3 }
    - { id: d, text: pip-4 }
answer: { optionId: a }
explanation:
  correct:
    en: The Bastion host needs a static Standard SKU public IP address that isn't already in use, in the same region as the host. pip-1 is the only Regional tier Standard address in UK South.
    fr: L'hôte Bastion a besoin d'une adresse IP publique statique de SKU Standard qui n'est pas déjà utilisée, dans la même région que l'hôte. pip-1 est la seule adresse Standard de niveau Régional dans la région UK South.
  options:
    b: { en: "Standard v2 public IP addresses currently work only with a StandardV2 NAT gateway.", fr: "Les adresses IP publiques Standard v2 ne fonctionnent actuellement qu'avec une passerelle NAT StandardV2." }
    c: { en: "A public IP address must be in the same region as the resource it is associated with.", fr: "Une adresse IP publique doit se trouver dans la même région que la ressource à laquelle elle est associée." }
    d: { en: "A Global tier address is an anycast address for a global load balancer.", fr: "Une adresse de niveau Global est une adresse anycast destinée à un équilibreur de charge global." }
references:
  - title: About Azure Bastion configuration settings
    url: https://learn.microsoft.com/en-us/azure/bastion/configuration-settings
  - title: Public IP addresses in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses
