id: az700-sr1-onprem-private-dns-3
objective: "1.2.7"
type: series_yesno
series: az700-sr1-onprem-private-dns
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You deploy DNS Private Resolver with an inbound endpoint and forward to it from on-premises.
  fr: |
    Vous déployez DNS Private Resolver avec un point de terminaison entrant et transférez vers celui-ci depuis le réseau local.
body:
  solution:
    en: |
      You deploy an **Azure DNS Private Resolver** in VNet-Hub with an **inbound endpoint** in a dedicated /28 subnet delegated to `Microsoft.Network/dnsResolvers`. On the two on-premises DNS servers, you create a conditional forwarder for **blob.core.windows.net** that targets the IP address of the inbound endpoint.
    fr: |
      Vous déployez un **Azure DNS Private Resolver** dans VNet-Hub avec un **point de terminaison entrant** dans un sous-réseau /28 dédié et délégué à `Microsoft.Network/dnsResolvers`. Sur les deux serveurs DNS locaux, vous créez un redirecteur conditionnel pour **blob.core.windows.net** qui cible l'adresse IP du point de terminaison entrant.
answer: { value: true }
explanation:
  correct:
    en: |
      The inbound endpoint receives an IP address from VNet-Hub and is reachable over the VPN. It resolves the queries with Azure DNS from VNet-Hub, so the CNAME to privatelink.blob.core.windows.net is answered from the linked private zone with the private IP address. Forwarding the public zone name (blob.core.windows.net) rather than the privatelink name is the recommended pattern, and the resolver is a managed service, so no virtual machine is needed.
    fr: |
      Le point de terminaison entrant reçoit une adresse IP de VNet-Hub et il est joignable par le VPN. Il résout les requêtes avec Azure DNS depuis VNet-Hub : le CNAME vers privatelink.blob.core.windows.net reçoit donc la réponse de la zone privée liée, avec l'adresse IP privée. Transférer le nom de la zone publique (blob.core.windows.net) plutôt que le nom privatelink est le modèle recommandé, et le résolveur est un service managé : aucune machine virtuelle n'est nécessaire.
references:
