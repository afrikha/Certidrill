id: az700-1c-cse-roles
objective: "1.4.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Northwind has enabled Defender CSPM and agentless scanning on a subscription named **Sub-Net**. A network engineer named **User1** must run cloud security explorer queries to identify internet-exposed network resources in Sub-Net. User1 must not be able to modify any resource.

    Which two Azure roles can you assign to User1 at the scope of Sub-Net?

    Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind a activé Defender CSPM et l'analyse sans agent sur un abonnement nommé **Sub-Net**. Un ingénieur réseau nommé **User1** doit exécuter des requêtes de l'explorateur de sécurité du cloud pour identifier les ressources réseau exposées à Internet dans Sub-Net. User1 ne doit pouvoir modifier aucune ressource.

    Quels sont les deux rôles Azure que vous pouvez attribuer à User1 dans l'étendue de Sub-Net ?

    Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Security Reader }
    - { id: b, text: Billing Reader }
    - { id: c, text: Reader }
    - { id: d, text: Virtual Machine User Login }
    - { id: e, text: Key Vault Secrets User }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Cloud security explorer can be used with the Security Reader, Security Admin, Reader, Contributor or Owner role. Among them, Security Reader and Reader are read-only, so they let User1 build and run queries without changing resources.
    fr: L'explorateur de sécurité du cloud peut être utilisé avec les rôles Security Reader, Security Admin, Reader, Contributor ou Owner. Parmi eux, Security Reader et Reader sont en lecture seule ; ils permettent à User1 de créer et d'exécuter des requêtes sans modifier de ressources.
  options:
    b: { en: "Billing Reader gives access to billing data only, not to Defender for Cloud.", fr: "Billing Reader donne uniquement accès aux données de facturation, pas à Defender for Cloud." }
    d: { en: "Virtual Machine User Login lets a user sign in to VMs; it doesn't grant access to Defender for Cloud.", fr: "Virtual Machine User Login permet de se connecter aux machines virtuelles ; il ne donne pas accès à Defender for Cloud." }
    e: { en: "Key Vault Secrets User reads secret contents in key vaults; it doesn't grant access to Defender for Cloud.", fr: "Key Vault Secrets User lit le contenu des secrets des coffres de clés ; il ne donne pas accès à Defender for Cloud." }
references:
  - title: Build queries with cloud security explorer
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/how-to-manage-cloud-security-explorer
