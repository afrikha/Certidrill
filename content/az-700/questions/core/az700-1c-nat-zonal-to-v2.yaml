id: az700-1c-nat-zonal-to-v2
objective: "1.3.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a Standard NAT gateway named **natgw-prod** deployed in availability zone 1 of West Europe. natgw-prod uses two Standard public IP addresses and is associated with the subnets **Web** and **Api** of a virtual network named **VNet-Prod**. The virtual machines in both subnets are spread across zones 1, 2 and 3.

    During a zone 1 outage, the virtual machines in zones 2 and 3 lost their outbound internet connectivity. You need to ensure that outbound connectivity survives the failure of any single zone.

    What should you do?
  fr: |
    Northwind dispose d'une passerelle NAT Standard nommée **natgw-prod** déployée dans la zone de disponibilité 1 de West Europe. natgw-prod utilise deux adresses IP publiques Standard et est associée aux sous-réseaux **Web** et **Api** d'un réseau virtuel nommé **VNet-Prod**. Les machines virtuelles des deux sous-réseaux sont réparties sur les zones 1, 2 et 3.

    Lors d'une panne de la zone 1, les machines virtuelles des zones 2 et 3 ont perdu leur connectivité sortante vers Internet. Vous devez faire en sorte que la connectivité sortante résiste à la panne de n'importe quelle zone.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Change the availability zone setting of natgw-prod from zone 1 to Zone-redundant and keep its public IP addresses.", fr: "Modifier le paramètre de zone de disponibilité de natgw-prod de la zone 1 vers Redondant interzone et conserver ses adresses IP publiques." }
    - id: b
      text: { en: "Deploy two more Standard NAT gateways in zones 2 and 3 and associate all three with Web and Api.", fr: "Déployer deux autres passerelles NAT Standard dans les zones 2 et 3 et associer les trois à Web et Api." }
    - id: c
      text: { en: "Create a StandardV2 NAT gateway with StandardV2 public IP addresses and associate it with Web and Api instead of natgw-prod.", fr: "Créer une passerelle NAT StandardV2 avec des adresses IP publiques StandardV2 et l'associer à Web et Api à la place de natgw-prod." }
    - id: d
      text: { en: "Upgrade the SKU of natgw-prod in place from Standard to StandardV2 and keep its association with Web and Api.", fr: "Mettre à niveau sur place la référence SKU de natgw-prod de Standard vers StandardV2 et conserver son association avec Web et Api." }
answer: { optionId: c }
explanation:
  correct:
    en: A Standard NAT gateway is zonal, so an outage of its zone affects every subnet it serves. The StandardV2 SKU is zone redundant, but it requires StandardV2 public IP addresses or prefixes, and a Standard NAT gateway can't be upgraded in place. You therefore deploy a new StandardV2 NAT gateway and replace the old one on the subnets.
    fr: "Une passerelle NAT Standard est zonale : une panne de sa zone affecte tous les sous-réseaux qu'elle dessert. La référence SKU StandardV2 est redondante interzone, mais elle exige des adresses ou préfixes d'adresse IP publique StandardV2, et une passerelle NAT Standard ne peut pas être mise à niveau sur place. Vous déployez donc une nouvelle passerelle NAT StandardV2 et remplacez l'ancienne sur les sous-réseaux."
  options:
    a: { en: "The zone of a NAT gateway is chosen at creation and can't be changed afterward.", fr: "La zone d'une passerelle NAT est choisie à la création et ne peut plus être modifiée ensuite." }
    b: { en: "A subnet can be associated with only one NAT gateway.", fr: "Un sous-réseau ne peut être associé qu'à une seule passerelle NAT." }
    d: { en: "There is no in-place upgrade from Standard to StandardV2; a new NAT gateway is required.", fr: "Il n'existe pas de mise à niveau sur place de Standard vers StandardV2 ; une nouvelle passerelle NAT est nécessaire." }
references:
  - title: NAT gateway resource
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-gateway-resource
  - title: What is Azure NAT Gateway?
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
