id: az700-1b-resolver-hub-spoke
objective: "1.2.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a hub-and-spoke network in West Europe. The hub virtual network **VNet-Hub** is peered with 20 spoke virtual networks. All the virtual networks use Azure-provided DNS.

    Several private DNS zones, including `privatelink.blob.core.windows.net` and `fabrikam.internal`, are linked to VNet-Hub only. VNet-Hub contains Azure DNS Private Resolver with an inbound endpoint at 10.0.0.4 and an outbound endpoint.

    The virtual machines in the spokes must resolve the records of these private DNS zones. The zones must not be linked to the spokes.

    Which two solutions meet the requirements? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un réseau hub-and-spoke en West Europe. Le réseau virtuel hub **VNet-Hub** est relié par peering à 20 réseaux virtuels spokes. Tous les réseaux virtuels utilisent le DNS fourni par Azure.

    Plusieurs zones DNS privées, dont `privatelink.blob.core.windows.net` et `fabrikam.internal`, sont liées à VNet-Hub uniquement. VNet-Hub contient Azure DNS Private Resolver avec un point de terminaison entrant à l'adresse 10.0.0.4 et un point de terminaison sortant.

    Les machines virtuelles des spokes doivent résoudre les enregistrements de ces zones DNS privées. Les zones ne doivent pas être liées aux spokes.

    Quelles sont les deux solutions qui répondent aux exigences ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the DNS servers of each spoke to Custom with the address 168.63.129.16.", fr: "Définir les serveurs DNS de chaque spoke sur Personnalisé avec l'adresse 168.63.129.16." } }
    - { id: b, text: { en: "Create a ruleset with rules for the zones that target 10.0.0.4, and link it to each spoke.", fr: "Créer un ensemble de règles avec des règles pour les zones qui ciblent 10.0.0.4, et le lier à chaque spoke." } }
    - { id: c, text: { en: "Create a ruleset with rules for the zones that target 10.0.0.4, and link it to VNet-Hub.", fr: "Créer un ensemble de règles avec des règles pour les zones qui ciblent 10.0.0.4, et le lier à VNet-Hub." } }
    - { id: d, text: { en: "Set the DNS servers of each spoke to Custom with the address 10.0.0.4.", fr: "Définir les serveurs DNS de chaque spoke sur Personnalisé avec l'adresse 10.0.0.4." } }
    - { id: e, text: { en: "Enable Allow gateway transit on the peerings from VNet-Hub to the spokes.", fr: "Activer le transit par passerelle sur les peerings de VNet-Hub vers les spokes." } }
answer: { optionIds: [ d, b ] }
explanation:
  correct:
    en: |
      In the centralized design, the spokes use the inbound endpoint as their DNS server; the endpoint resolves with Azure DNS from VNet-Hub, where the zones are linked. In the distributed design, the spokes keep Azure-provided DNS and a ruleset linked to each spoke forwards the zone names through the outbound endpoint to the inbound endpoint. Both work because the spokes reach 10.0.0.4 through peering.
    fr: |
      Dans la conception centralisée, les spokes utilisent le point de terminaison entrant comme serveur DNS ; le point de terminaison résout avec Azure DNS depuis VNet-Hub, où les zones sont liées. Dans la conception distribuée, les spokes conservent le DNS fourni par Azure, et un ensemble de règles lié à chaque spoke transfère les noms des zones par le point de terminaison sortant vers le point de terminaison entrant. Les deux fonctionnent, car les spokes joignent 10.0.0.4 par peering.
  options:
    c: { en: "A ruleset applies only to the virtual networks it is linked to, and linking it to the network of the inbound endpoint that it targets creates a resolution loop.", fr: "Un ensemble de règles ne s'applique qu'aux réseaux virtuels auxquels il est lié, et le lier au réseau du point de terminaison entrant qu'il cible crée une boucle de résolution." }
    a: { en: "168.63.129.16 queried from a spoke consults only the zones linked to that spoke, and none are.", fr: "168.63.129.16 interrogé depuis un spoke ne consulte que les zones liées à ce spoke, et aucune ne l'est." }
    e: { en: "Gateway transit shares a VPN or ExpressRoute gateway; it has no effect on name resolution.", fr: "Le transit par passerelle partage une passerelle VPN ou ExpressRoute ; il n'a aucun effet sur la résolution de noms." }
references:
  - title: Azure DNS Private Resolver endpoints and rulesets
    url: https://learn.microsoft.com/en-us/azure/dns/private-resolver-endpoints-rulesets
  - title: What is Azure DNS Private Resolver?
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
