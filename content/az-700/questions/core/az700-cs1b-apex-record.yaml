id: az700-cs1b-apex-record
objective: "1.2.5"
type: single
caseStudy: az700-cs1b-proseware
difficulty: 1
status: draft
stem:
  en: You add proseware.com as an apex domain of fd-proseware, the domain is validated, and you associate it with ep-portal. You need to ensure that students who browse to proseware.com reach ep-portal. What should you create in the proseware.com zone?
  fr: Vous ajoutez proseware.com comme domaine apex de fd-proseware, le domaine est validé, et vous l'associez à ep-portal. Vous devez vous assurer que les étudiants qui naviguent vers proseware.com atteignent ep-portal. Que devez-vous créer dans la zone proseware.com ?
body:
  options:
    - { id: a, text: { en: "A CNAME record at the zone apex that points to the host name of ep-portal", fr: "Un enregistrement CNAME à l'apex de la zone qui pointe vers le nom d'hôte d'ep-portal" } }
    - { id: b, text: { en: "An A record at the zone apex that contains the IP address returned when you resolve the host name of ep-portal", fr: "Un enregistrement A à l'apex de la zone qui contient l'adresse IP obtenue en résolvant le nom d'hôte d'ep-portal" } }
    - { id: c, text: { en: "An alias record set of type A at the zone apex that targets ep-portal", fr: "Un jeu d'enregistrements d'alias de type A à l'apex de la zone qui cible ep-portal" } }
    - { id: d, text: { en: "An NS record set at the zone apex that delegates proseware.com to ep-portal", fr: "Un jeu d'enregistrements NS à l'apex de la zone qui délègue proseware.com à ep-portal" } }
answer: { optionId: c }
explanation:
  correct:
    en: The DNS protocol doesn't allow a CNAME record at the zone apex, but an Azure DNS alias record set can be created at the apex and can target an Azure Front Door endpoint. Azure DNS keeps the alias pointed at the endpoint, so the apex domain follows the IP addresses that Front Door uses.
    fr: Le protocole DNS n'autorise pas d'enregistrement CNAME à l'apex d'une zone, mais un jeu d'enregistrements d'alias Azure DNS peut être créé à l'apex et cibler un point de terminaison Azure Front Door. Azure DNS maintient l'alias pointé vers le point de terminaison, si bien que le domaine apex suit les adresses IP utilisées par Front Door.
  options:
    a:
      en: The DNS protocol doesn't allow a CNAME record at the zone apex, such as proseware.com itself.
      fr: Le protocole DNS n'autorise pas d'enregistrement CNAME à l'apex de la zone, c'est-à-dire sur proseware.com lui-même.
    b:
      en: The IP addresses behind a Front Door endpoint aren't fixed; a static A record would break when they change.
      fr: Les adresses IP derrière un point de terminaison Front Door ne sont pas fixes ; un enregistrement A statique cesserait de fonctionner quand elles changent.
    d:
      en: The NS records at the apex identify the Azure DNS name servers of the zone; Front Door isn't a DNS server and can't receive a delegation.
      fr: Les enregistrements NS à l'apex identifient les serveurs de noms Azure DNS de la zone ; Front Door n'est pas un serveur DNS et ne peut pas recevoir de délégation.
references:
  - title: Azure DNS alias records overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-alias
  - title: Onboard a Root or Apex Domain to Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-how-to-onboard-apex-domain
