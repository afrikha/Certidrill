id: az700-1a-27-prefix-size
objective: "1.1.6"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Litware needs public IPv4 addresses for five virtual machines that a partner will allow in its firewall. Two more virtual machines will be added next year. All the addresses must come from one contiguous range created in Azure, and you must reserve as few addresses as possible.

    Which prefix size should you specify when you create the public IP prefix?
  fr: |
    Litware a besoin d'adresses IPv4 publiques pour cinq machines virtuelles qu'un partenaire autorisera dans son pare-feu. Deux machines virtuelles supplémentaires seront ajoutées l'an prochain. Toutes les adresses doivent provenir d'une seule plage contiguë créée dans Azure, et vous devez réserver le moins d'adresses possible.

    Quelle taille de préfixe devez-vous indiquer lors de la création du préfixe d'adresse IP publique ?
body:
  options:
    - { id: a, text: /28 }
    - { id: b, text: /29 }
    - { id: c, text: /30 }
    - { id: d, text: /31 }
answer: { optionId: b }
explanation:
  correct:
    en: Seven addresses are needed. A /29 public IP prefix contains 8 addresses, all usable for public IP addresses, and its size can't be changed later, so it must cover the planned growth now.
    fr: |
      Sept adresses sont nécessaires. Un préfixe d'adresse IP publique /29 contient 8 adresses, toutes utilisables pour des adresses IP publiques, et sa taille ne peut pas être modifiée plus tard : il doit couvrir dès maintenant la croissance prévue.
  options:
    a: { en: "A /28 reserves 16 addresses, twice what is needed.", fr: "Un /28 réserve 16 adresses, soit le double du besoin." }
    c: { en: "A /30 contains only 4 addresses.", fr: "Un /30 ne contient que 4 adresses." }
    d: { en: "A /31 contains only 2 addresses.", fr: "Un /31 ne contient que 2 adresses." }
references:
  - title: Public IP address prefix
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix
