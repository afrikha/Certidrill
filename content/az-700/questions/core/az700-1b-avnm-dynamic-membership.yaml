id: az700-1b-avnm-dynamic-membership
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses Azure Virtual Network Manager with a network manager whose scope is the management group **MG-Contoso**. A deployed mesh connectivity configuration targets a network group named **NG-Prod**.

    Application teams create new virtual networks every week. Every virtual network in the scope that has the tag `env=prod` must join NG-Prod automatically, including virtual networks that will be created later.

    What should you do?
  fr: |
    Contoso utilise Azure Virtual Network Manager avec un gestionnaire de réseau dont l'étendue est le groupe d'administration **MG-Contoso**. Une configuration de connectivité en maillage déployée cible un groupe réseau nommé **NG-Prod**.

    Les équipes applicatives créent de nouveaux réseaux virtuels chaque semaine. Chaque réseau virtuel de l'étendue qui porte l'étiquette `env=prod` doit rejoindre NG-Prod automatiquement, y compris les réseaux virtuels qui seront créés plus tard.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add the virtual networks that have the tag to NG-Prod as static members.", fr: "Ajouter à NG-Prod les réseaux virtuels qui portent l'étiquette, comme membres statiques." }
    - id: b
      text: { en: "Assign an Azure Policy definition that uses the addToNetworkGroup effect for the tag.", fr: "Attribuer une définition Azure Policy qui utilise l'effet addToNetworkGroup pour l'étiquette." }
    - id: c
      text: { en: "Save an Azure Resource Graph query that lists the tagged virtual networks in NG-Prod.", fr: "Enregistrer dans NG-Prod une requête Azure Resource Graph qui liste les réseaux virtuels étiquetés." }
    - id: d
      text: { en: "Create a management group for the tagged virtual networks and make it the network manager scope.", fr: "Créer un groupe d'administration pour les réseaux virtuels étiquetés et en faire l'étendue du gestionnaire de réseau." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Dynamic membership of a network group relies on Azure Policy. A custom definition in the Microsoft.Network.Data mode with the addToNetworkGroup effect evaluates a condition, such as a tag, and adds every matching virtual network in the assignment scope to the network group, including virtual networks created later. The active configuration then applies to the new members without a new deployment.
    fr: |
      L'appartenance dynamique à un groupe réseau repose sur Azure Policy. Une définition personnalisée en mode Microsoft.Network.Data avec l'effet addToNetworkGroup évalue une condition, par exemple une étiquette, et ajoute au groupe réseau chaque réseau virtuel correspondant de l'étendue de l'attribution, y compris ceux créés plus tard. La configuration active s'applique ensuite aux nouveaux membres sans nouveau déploiement.
  options:
    a: { en: "Static members are selected one by one; virtual networks created later wouldn't join the group.", fr: "Les membres statiques sont sélectionnés un par un ; les réseaux virtuels créés plus tard ne rejoindraient pas le groupe." }
    c: { en: "Azure Resource Graph records the group memberships, but a query doesn't define membership.", fr: "Azure Resource Graph enregistre les appartenances aux groupes, mais une requête ne définit pas l'appartenance." }
    d: { en: "The scope defines what the network manager can manage; it doesn't add virtual networks to a network group.", fr: "L'étendue définit ce que le gestionnaire de réseau peut gérer ; elle n'ajoute pas de réseaux virtuels à un groupe réseau." }
references:
  - title: Configuring network groups with Azure Policy in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-azure-policy-integration
  - title: What is a network group in Azure Virtual Network Manager?
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-network-groups
