id: az700-1a-01-new-vnet-range
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has the following networks:

    | Network | Location | Address space |
    | --- | --- | --- |
    | HQ (on-premises) | Paris | 10.0.0.0/16, 192.168.10.0/24 |
    | VNet-Hub | Azure, West Europe | 10.1.0.0/16 |
    | VNet-App | Azure, West Europe | 172.16.0.0/16 |

    VNet-Hub has a site-to-site VPN connection to HQ. You plan to create a virtual network named VNet-Data in West Europe. VNet-Data will be peered with VNet-Hub and VNet-App, and it must reach HQ through the VPN gateway of VNet-Hub.

    Which address space should you assign to VNet-Data?
  fr: |
    Contoso dispose des réseaux suivants :

    | Réseau | Emplacement | Espace d'adressage |
    | --- | --- | --- |
    | HQ (local) | Paris | 10.0.0.0/16, 192.168.10.0/24 |
    | VNet-Hub | Azure, West Europe | 10.1.0.0/16 |
    | VNet-App | Azure, West Europe | 172.16.0.0/16 |

    VNet-Hub dispose d'une connexion VPN de site à site vers HQ. Vous prévoyez de créer un réseau virtuel nommé VNet-Data dans la région West Europe. VNet-Data sera relié par peering à VNet-Hub et à VNet-App, et il doit joindre HQ par la passerelle VPN de VNet-Hub.

    Quel espace d'adressage devez-vous attribuer à VNet-Data ?
body:
  options:
    - { id: a, text: 10.1.128.0/17 }
    - { id: b, text: 172.16.64.0/18 }
    - { id: c, text: 192.168.0.0/16 }
    - { id: d, text: 10.2.0.0/16 }
answer: { optionId: d }
explanation:
  correct:
    en: The address space of a virtual network must not overlap the address space of any network it is peered with, nor the on-premises ranges it reaches through a gateway. 10.2.0.0/16 overlaps neither 10.0.0.0/16, 192.168.10.0/24, 10.1.0.0/16 nor 172.16.0.0/16.
    fr: L'espace d'adressage d'un réseau virtuel ne doit chevaucher ni celui des réseaux avec lesquels il est relié par peering, ni les plages locales qu'il joint par une passerelle. 10.2.0.0/16 ne chevauche ni 10.0.0.0/16, ni 192.168.10.0/24, ni 10.1.0.0/16, ni 172.16.0.0/16.
  options:
    a: { en: "10.1.128.0/17 is inside the address space of VNet-Hub; overlapping virtual networks can't be peered.", fr: "10.1.128.0/17 est inclus dans l'espace d'adressage de VNet-Hub ; des réseaux virtuels qui se chevauchent ne peuvent pas être reliés par peering." }
    b: { en: "172.16.64.0/18 is inside the address space of VNet-App, so the peering with VNet-App would fail.", fr: "172.16.64.0/18 est inclus dans l'espace d'adressage de VNet-App : le peering avec VNet-App échouerait." }
    c: { en: "192.168.0.0/16 contains the on-premises range 192.168.10.0/24, so traffic to that part of HQ would not be routed through the gateway.", fr: "192.168.0.0/16 contient la plage locale 192.168.10.0/24 : le trafic vers cette partie de HQ ne serait pas routé par la passerelle." }
references:
  - title: Azure Virtual Network FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
