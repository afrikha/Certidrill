id: az700-1b-transit-topology
objective: "1.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has the following virtual networks:

    | Virtual network | Content | Peering settings |
    | --- | --- | --- |
    | VNet-Hub | VPN gateway (VpnGw2AZ), connected to the on-premises network by a site-to-site VPN with BGP | Gateway transit allowed on both peerings |
    | VNet-Spoke1 | Virtual machines | Peered with VNet-Hub; uses the remote gateway |
    | VNet-Spoke2 | Virtual machines | Peered with VNet-Hub; doesn't use the remote gateway |

    VNet-Spoke1 and VNet-Spoke2 aren't peered with each other. No route table exists.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose des réseaux virtuels suivants :

    | Réseau virtuel | Contenu | Paramètres de peering |
    | --- | --- | --- |
    | VNet-Hub | Passerelle VPN (VpnGw2AZ), connectée au réseau local par un VPN site à site avec BGP | Transit par passerelle autorisé sur les deux peerings |
    | VNet-Spoke1 | Machines virtuelles | Relié par peering à VNet-Hub ; utilise la passerelle distante |
    | VNet-Spoke2 | Machines virtuelles | Relié par peering à VNet-Hub ; n'utilise pas la passerelle distante |

    VNet-Spoke1 et VNet-Spoke2 ne sont pas reliés entre eux par peering. Aucune table de routage n'existe.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The effective routes of the virtual machines in VNet-Spoke1 contain the on-premises prefixes with the next hop type Virtual network gateway.
        fr: Les itinéraires effectifs des machines virtuelles de VNet-Spoke1 contiennent les préfixes locaux avec le type de tronçon suivant Passerelle de réseau virtuel.
    - id: s2
      text:
        en: The virtual machines in VNet-Spoke1 can communicate with the virtual machines in VNet-Spoke2 through VNet-Hub.
        fr: Les machines virtuelles de VNet-Spoke1 peuvent communiquer avec les machines virtuelles de VNet-Spoke2 par VNet-Hub.
    - id: s3
      text:
        en: The virtual machines in VNet-Spoke2 can communicate with the on-premises network.
        fr: Les machines virtuelles de VNet-Spoke2 peuvent communiquer avec le réseau local.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      With gateway transit allowed on the hub and the remote gateway used by VNet-Spoke1, the routes of the hub gateway propagate to VNet-Spoke1 with the next hop type Virtual network gateway. Gateway transit concerns only the gateway: peering stays non-transitive, so the spokes can't reach each other through the hub without an NVA or gateway route. VNet-Spoke2 doesn't use the remote gateway, so it receives no on-premises route.
    fr: |
      Avec le transit par passerelle autorisé sur le hub et la passerelle distante utilisée par VNet-Spoke1, les itinéraires de la passerelle du hub se propagent vers VNet-Spoke1 avec le type de tronçon suivant Passerelle de réseau virtuel. Le transit par passerelle ne concerne que la passerelle : le peering reste non transitif, et les spokes ne peuvent pas se joindre par le hub sans NVA ni itinéraire vers une passerelle. VNet-Spoke2 n'utilise pas la passerelle distante : il ne reçoit aucun itinéraire local.
references:
  - title: Configure VPN gateway transit for virtual network peering
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-peering-gateway-transit
  - title: Create, change, or delete Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
