id: az700-1a-15-service-subnet-names
objective: "1.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys is preparing a hub virtual network for four network services.

    Which subnet name should you use for each service? To answer, drag the appropriate subnet names to the correct services. Each subnet name may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prépare un réseau virtuel hub pour quatre services réseau.

    Quel nom de sous-réseau devez-vous utiliser pour chaque service ? Pour répondre, faites glisser les noms de sous-réseaux appropriés vers les services correspondants. Chaque nom de sous-réseau peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: gw, text: GatewaySubnet }
    - { id: rs, text: RouteServerSubnet }
    - { id: fwm, text: AzureFirewallManagementSubnet }
    - { id: fw, text: AzureFirewallSubnet }
    - { id: any, text: { en: "Any name, such as snet-appgw", fr: "N'importe quel nom, par exemple snet-appgw" } }
  targets:
    - { id: t1, text: { en: "ExpressRoute virtual network gateway", fr: "Passerelle de réseau virtuel ExpressRoute" } }
    - { id: t2, text: { en: "Azure Route Server", fr: "Azure Route Server" } }
    - { id: t3, text: { en: "Management interface of Azure Firewall in forced tunneling mode", fr: "Interface de gestion du Pare-feu Azure en mode de tunneling forcé" } }
    - { id: t4, text: { en: "Application Gateway v2", fr: "Application Gateway v2" } }
answer:
  mapping: { t1: gw, t2: rs, t3: fwm, t4: any }
explanation:
  correct:
    en: VPN and ExpressRoute gateways deploy into GatewaySubnet, Azure Route Server into RouteServerSubnet, and the management interface that forced tunneling requires into AzureFirewallManagementSubnet. Application Gateway needs a dedicated subnet but no reserved name.
    fr: Les passerelles VPN et ExpressRoute se déploient dans GatewaySubnet, Azure Route Server dans RouteServerSubnet, et l'interface de gestion qu'exige le tunneling forcé dans AzureFirewallManagementSubnet. Application Gateway a besoin d'un sous-réseau dédié, mais pas d'un nom réservé.
  options:
    fw: { en: "AzureFirewallSubnet hosts the data path of Azure Firewall, not its management interface.", fr: "AzureFirewallSubnet héberge le chemin de données du Pare-feu Azure, pas son interface de gestion." }
references:
  - title: Azure Firewall FAQ
    url: https://learn.microsoft.com/en-us/azure/firewall/firewall-faq
  - title: Azure Application Gateway infrastructure configuration
    url: https://learn.microsoft.com/en-us/azure/application-gateway/configuration-infrastructure
