id: az700-1c-mdc-jit-plan
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware's secure score in Microsoft Defender for Cloud is lowered by the recommendation **Management ports of virtual machines should be protected with just-in-time network access control** for 25 virtual machines. Only the foundational CSPM capabilities are enabled on the subscription.

    You need to enable just-in-time VM access on the virtual machines. Defender for Cloud will then manage the NSG rules for RDP and SSH.

    Which plan should you enable on the subscription?
  fr: |
    Le degré de sécurisation de Litware dans Microsoft Defender for Cloud est réduit par la recommandation **Management ports of virtual machines should be protected with just-in-time network access control** pour 25 machines virtuelles. Seules les fonctionnalités CSPM de base (foundational CSPM) sont activées sur l'abonnement.

    Vous devez activer l'accès juste-à-temps (JIT) aux machines virtuelles. Defender for Cloud gérera ensuite les règles NSG pour RDP et SSH.

    Quel plan devez-vous activer sur l'abonnement ?
body:
  options:
    - id: a
      text: Defender for Servers Plan 1
    - id: b
      text: Defender for Servers Plan 2
    - id: c
      text: Defender CSPM
    - id: d
      text: Defender for Resource Manager
answer: { optionId: b }
explanation:
  correct:
    en: Just-in-time machine access is a feature of Defender for Servers Plan 2. When it is enabled, Defender for Cloud ensures that deny rules exist for the selected ports in the NSGs (and Azure Firewall rules), adds temporary allow rules for approved requests, and restores the NSGs when the access period expires.
    fr: "L'accès juste-à-temps aux machines est une fonctionnalité de Defender for Servers Plan 2. Lorsqu'il est activé, Defender for Cloud s'assure que des règles de refus existent pour les ports sélectionnés dans les NSG (et les règles du Pare-feu Azure), ajoute des règles d'autorisation temporaires pour les demandes approuvées, puis restaure les NSG à l'expiration de la période d'accès."
  options:
    a: { en: "Plan 1 doesn't include just-in-time machine access.", fr: "Le Plan 1 n'inclut pas l'accès juste-à-temps aux machines." }
    c: { en: "Defender CSPM adds posture features such as attack path analysis and cloud security explorer, not just-in-time access.", fr: "Defender CSPM ajoute des fonctionnalités de posture comme l'analyse du chemin d'attaque et l'explorateur de sécurité du cloud, pas l'accès juste-à-temps." }
    d: { en: "Defender for Resource Manager monitors resource management operations for suspicious activity; it doesn't control management port access.", fr: "Defender for Resource Manager surveille les opérations de gestion des ressources pour détecter des activités suspectes ; il ne contrôle pas l'accès aux ports de gestion." }
references:
  - title: Just-in-time machine access in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/just-in-time-access-overview
