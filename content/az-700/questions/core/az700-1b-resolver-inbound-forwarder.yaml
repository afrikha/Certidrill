id: az700-1b-resolver-inbound-forwarder
objective: "1.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind has an on-premises network connected to a hub virtual network named **VNet-Hub** by an ExpressRoute circuit. A private DNS zone named **nw.internal** is linked to VNet-Hub.

    You deploy Azure DNS Private Resolver in VNet-Hub with an inbound endpoint at 10.0.10.4 and an outbound endpoint.

    On-premises clients must resolve the records of nw.internal. You add a conditional forwarder for nw.internal on the on-premises DNS servers.

    Which address should the conditional forwarder target?
  fr: |
    Northwind dispose d'un réseau local connecté à un réseau virtuel hub nommé **VNet-Hub** par un circuit ExpressRoute. Une zone DNS privée nommée **nw.internal** est liée à VNet-Hub.

    Vous déployez Azure DNS Private Resolver dans VNet-Hub, avec un point de terminaison entrant à l'adresse 10.0.10.4 et un point de terminaison sortant.

    Les clients locaux doivent résoudre les enregistrements de nw.internal. Vous ajoutez un redirecteur conditionnel pour nw.internal sur les serveurs DNS locaux.

    Quelle adresse le redirecteur conditionnel doit-il cibler ?
body:
  options:
    - id: a
      text: { en: "168.63.129.16", fr: "168.63.129.16" }
    - id: b
      text: { en: "10.0.10.4, the inbound endpoint", fr: "10.0.10.4, le point de terminaison entrant" }
    - id: c
      text: { en: "The subnet of the outbound endpoint", fr: "Le sous-réseau du point de terminaison sortant" }
    - id: d
      text: { en: "The four Azure DNS name servers of the zone", fr: "Les quatre serveurs de noms Azure DNS de la zone" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An inbound endpoint gives the resolver a private IP address in the virtual network that receives queries from on-premises or other networks and resolves them with Azure DNS, including the private zones linked to the resolver's virtual network. The on-premises conditional forwarder for nw.internal therefore targets 10.0.10.4.
    fr: |
      Un point de terminaison entrant donne au résolveur une adresse IP privée dans le réseau virtuel, qui reçoit les requêtes du réseau local ou d'autres réseaux et les résout avec Azure DNS, y compris les zones privées liées au réseau virtuel du résolveur. Le redirecteur conditionnel local pour nw.internal cible donc 10.0.10.4.
  options:
    a: { en: "168.63.129.16 answers only from inside Azure; on-premises servers can't use it.", fr: "168.63.129.16 ne répond que depuis l'intérieur d'Azure ; les serveurs locaux ne peuvent pas l'utiliser." }
    c: { en: "The outbound endpoint has no IP address that accepts queries; it carries forwarded queries from Azure to other DNS servers.", fr: "Le point de terminaison sortant n'a pas d'adresse IP qui accepte des requêtes ; il achemine les requêtes transférées d'Azure vers d'autres serveurs DNS." }
    d: { en: "Private zones aren't served by the public Azure DNS name servers.", fr: "Les zones privées ne sont pas servies par les serveurs de noms publics d'Azure DNS." }
references:
  - title: Azure DNS Private Resolver endpoints and rulesets
    url: https://learn.microsoft.com/en-us/azure/dns/private-resolver-endpoints-rulesets
  - title: What is Azure DNS Private Resolver?
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
