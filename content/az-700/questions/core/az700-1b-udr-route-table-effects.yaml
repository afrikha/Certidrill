id: az700-1b-udr-route-table-effects
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a virtual network named **VNet1** (10.0.0.0/16) in West Europe with the following subnets: Subnet1 (10.0.1.0/24), Subnet2 (10.0.2.0/24), Subnet3 (10.0.3.0/24) and GatewaySubnet. GatewaySubnet contains a VPN gateway that learns the on-premises prefixes by BGP. A network virtual appliance in Subnet3 uses the address 10.0.3.4.

    A route table named **RT1** is associated only with Subnet1. **Propagate gateway routes** is set to **No** on RT1, and RT1 contains the following routes:

    | Name | Address prefix | Next hop type | Next hop IP address |
    | --- | --- | --- | --- |
    | Default | 0.0.0.0/0 | Virtual appliance | 10.0.3.4 |
    | Block-Subnet2 | 10.0.2.0/24 | None | - |

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un réseau virtuel nommé **VNet1** (10.0.0.0/16) en West Europe, avec les sous-réseaux suivants : Subnet1 (10.0.1.0/24), Subnet2 (10.0.2.0/24), Subnet3 (10.0.3.0/24) et GatewaySubnet. GatewaySubnet contient une passerelle VPN qui apprend les préfixes locaux par BGP. Une appliance virtuelle réseau de Subnet3 utilise l'adresse 10.0.3.4.

    Une table de routage nommée **RT1** est associée uniquement à Subnet1. **Propagate gateway routes** est défini sur **No** pour RT1, et RT1 contient les itinéraires suivants :

    | Nom | Préfixe d'adresse | Type de tronçon suivant | Adresse IP du tronçon suivant |
    | --- | --- | --- | --- |
    | Default | 0.0.0.0/0 | Appliance virtuelle | 10.0.3.4 |
    | Block-Subnet2 | 10.0.2.0/24 | None | - |

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Traffic from Subnet1 to 10.0.2.10 is dropped.", fr: "Le trafic de Subnet1 vers 10.0.2.10 est abandonné." } }
    - { id: b, text: { en: "Traffic from Subnet1 to 10.0.3.5 is sent to 10.0.3.4.", fr: "Le trafic de Subnet1 vers 10.0.3.5 est envoyé à 10.0.3.4." } }
    - { id: c, text: { en: "Traffic from Subnet2 to 10.0.2.10 is dropped.", fr: "Le trafic de Subnet2 vers 10.0.2.10 est abandonné." } }
    - { id: d, text: { en: "Subnet1 receives no BGP route from the VPN gateway.", fr: "Subnet1 ne reçoit aucun itinéraire BGP de la passerelle VPN." } }
    - { id: e, text: { en: "RT1 can also serve a subnet of a North Europe network.", fr: "RT1 peut aussi servir un sous-réseau d'un réseau de North Europe." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      For Subnet1, the /24 route with the next hop None is more specific than the system route for 10.0.0.0/16, so traffic to Subnet2 is dropped. With gateway route propagation disabled, neither the static nor the BGP routes of the gateway are added to the subnets associated with RT1.
    fr: |
      Pour Subnet1, l'itinéraire /24 avec le tronçon suivant None est plus spécifique que l'itinéraire système pour 10.0.0.0/16 : le trafic vers Subnet2 est abandonné. Avec la propagation des itinéraires de passerelle désactivée, ni les itinéraires statiques ni les itinéraires BGP de la passerelle ne sont ajoutés aux sous-réseaux associés à RT1.
  options:
    b: { en: "10.0.3.5 matches the system route 10.0.0.0/16 (next hop Virtual network), which is more specific than 0.0.0.0/0.", fr: "10.0.3.5 correspond à l'itinéraire système 10.0.0.0/16 (tronçon suivant Réseau virtuel), plus spécifique que 0.0.0.0/0." }
    c: { en: "RT1 isn't associated with Subnet2, so traffic from Subnet2 uses the system routes.", fr: "RT1 n'est pas associée à Subnet2 : le trafic de Subnet2 utilise les itinéraires système." }
    e: { en: "A route table can be associated only with subnets of virtual networks in its own region and subscription.", fr: "Une table de routage ne peut être associée qu'aux sous-réseaux de réseaux virtuels de sa région et de son abonnement." }
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
