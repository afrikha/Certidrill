id: az700-1c-ars-branch-to-branch
objective: "1.3.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a hub virtual network named **VNet-Hub** that contains the following gateways:

    | Gateway | Type | Configuration | Connected site |
    | --- | --- | --- | --- |
    | ERGW1 | ExpressRoute | ErGw1AZ | Datacenter DC1 (ExpressRoute circuit) |
    | VPNGW1 | VPN | VpnGw2AZ, route-based, active-active, ASN 65515 | Branch office B1 (site-to-site) |

    By default, DC1 and B1 can each reach VNet-Hub, but they cannot reach each other through Azure.

    You need DC1 and B1 to exchange routes and communicate through Azure. The solution must not require deploying network virtual appliances.

    What should you do?
  fr: |
    Contoso dispose d'un réseau virtuel hub nommé **VNet-Hub** qui contient les passerelles suivantes :

    | Passerelle | Type | Configuration | Site connecté |
    | --- | --- | --- | --- |
    | ERGW1 | ExpressRoute | ErGw1AZ | Centre de données DC1 (circuit ExpressRoute) |
    | VPNGW1 | VPN | VpnGw2AZ, basée sur des routes, actif-actif, ASN 65515 | Agence B1 (site à site) |

    Par défaut, DC1 et B1 peuvent chacun joindre VNet-Hub, mais ils ne peuvent pas se joindre l'un l'autre via Azure.

    Vous devez faire en sorte que DC1 et B1 échangent des itinéraires et communiquent via Azure. La solution ne doit pas nécessiter le déploiement d'appliances virtuelles réseau.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Enable ExpressRoute Global Reach between the DC1 circuit and the B1 connection.", fr: "Activer ExpressRoute Global Reach entre le circuit de DC1 et la connexion de B1." }
    - id: b
      text: { en: "Enable Allow gateway transit on the peerings of VNet-Hub.", fr: "Activer Allow gateway transit (autoriser le transit par passerelle) sur les peerings de VNet-Hub." }
    - id: c
      text: { en: "Deploy Azure Route Server in VNet-Hub and enable branch-to-branch route exchange.", fr: "Déployer le Serveur de routes Azure dans VNet-Hub et activer l'échange d'itinéraires de branche à branche." }
    - id: d
      text: { en: "Associate with GatewaySubnet a route table that contains the DC1 and B1 prefixes.", fr: "Associer à GatewaySubnet une table de routage contenant les préfixes de DC1 et de B1." }
answer: { optionId: c }
explanation:
  correct:
    en: When route exchange (branch-to-branch) is enabled, Route Server acts as a route reflector between the gateways in its virtual network, so the ExpressRoute gateway and the VPN gateway learn each other's on-premises routes. The VPN gateway must be active-active with the ASN 65515, which VPNGW1 already is; BGP on the VPN gateway is not required. Note that creating the route server in a virtual network that has gateways causes downtime until the operation completes.
    fr: "Lorsque l'échange d'itinéraires (branche à branche) est activé, le Serveur de routes agit comme réflecteur de routage entre les passerelles de son réseau virtuel : la passerelle ExpressRoute et la passerelle VPN apprennent les itinéraires locaux l'une de l'autre. La passerelle VPN doit être en mode actif-actif avec l'ASN 65515, ce qui est déjà le cas de VPNGW1 ; BGP n'est pas obligatoire sur la passerelle VPN. Notez que la création du serveur de routes dans un réseau virtuel qui contient des passerelles entraîne une interruption jusqu'à la fin de l'opération."
  options:
    a: { en: "Global Reach connects ExpressRoute circuits to each other; it does not connect a circuit to a site-to-site VPN.", fr: "Global Reach relie des circuits ExpressRoute entre eux ; il ne relie pas un circuit à un VPN de site à site." }
    b: { en: "Gateway transit lets peered spoke networks use the hub gateways; it does not make the two hub gateways exchange routes.", fr: "Le transit par passerelle permet aux spokes reliés par peering d'utiliser les passerelles du hub ; il ne fait pas échanger d'itinéraires aux deux passerelles du hub." }
    d: { en: "A route table does not make a gateway advertise routes to its on-premises peer; transit between ExpressRoute and VPN requires Route Server route exchange.", fr: "Une table de routage ne fait pas publier d'itinéraires par une passerelle vers son homologue local ; le transit entre ExpressRoute et VPN nécessite l'échange d'itinéraires du Serveur de routes." }
references:
  - title: Azure Route Server support for ExpressRoute and Azure VPN
    url: https://learn.microsoft.com/en-us/azure/route-server/expressroute-vpn-support
