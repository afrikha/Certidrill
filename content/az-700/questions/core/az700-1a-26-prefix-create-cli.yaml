id: az700-1a-26-prefix-create-cli
objective: "1.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to give a Standard NAT gateway named natgw-prod 16 outbound public IPv4 addresses. A partner will allow the whole range in a single firewall rule. The range must be zone-redundant in West Europe.

    You need to create the range by using the Azure CLI.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit de donner 16 adresses IPv4 publiques sortantes à une passerelle NAT Standard nommée natgw-prod. Un partenaire autorisera toute la plage avec une seule règle de pare-feu. La plage doit être redondante interzone dans la région West Europe.

    Vous devez créer la plage avec Azure CLI.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    [[cmd]] --resource-group RG-Net \
      --name ippre-natgw --location westeurope \
      --length [[len]] --version IPv4 \
      --sku [[sku]] --zone 1 2 3
  slots:
    - id: cmd
      options:
        - { id: prefix, text: az network public-ip prefix create }
        - { id: pip, text: az network public-ip create }
        - { id: cip, text: az network custom-ip prefix create }
    - id: len
      options:
        - { id: l27, text: "27" }
        - { id: l28, text: "28" }
        - { id: l29, text: "29" }
        - { id: l30, text: "30" }
    - id: sku
      options:
        - { id: std, text: Standard }
        - { id: stdv2, text: StandardV2 }
        - { id: basic, text: Basic }
answer:
  values: { cmd: prefix, len: l28, sku: std }
explanation:
  correct:
    en: "`az network public-ip prefix create` reserves a contiguous range of public IP addresses; `--length 28` gives 16 addresses, which is also the maximum a NAT gateway can use. A Standard NAT gateway works with Standard public IP addresses and prefixes."
    fr: "`az network public-ip prefix create` réserve une plage contiguë d'adresses IP publiques ; `--length 28` donne 16 adresses, ce qui est aussi le maximum qu'une passerelle NAT peut utiliser. Une passerelle NAT Standard fonctionne avec des adresses et des préfixes d'adresses IP publiques Standard."
  options:
    pip: { en: "az network public-ip create creates a single public IP address and has no --length parameter.", fr: "az network public-ip create crée une seule adresse IP publique et n'a pas de paramètre --length." }
    cip: { en: "A custom IP prefix onboards a range that your organization owns (BYOIP).", fr: "Un préfixe d'adresse IP personnalisé intègre une plage qui appartient à votre organisation (BYOIP)." }
    l27: { en: "A /27 is 32 addresses: beyond the default limit of Microsoft-owned prefixes and beyond what a NAT gateway can use.", fr: "Un /27 représente 32 adresses : au-delà de la limite par défaut des préfixes appartenant à Microsoft et de ce qu'une passerelle NAT peut utiliser." }
    l29: { en: "A /29 is only 8 addresses.", fr: "Un /29 ne représente que 8 adresses." }
    l30: { en: "A /30 is only 4 addresses.", fr: "Un /30 ne représente que 4 adresses." }
    stdv2: { en: "StandardV2 prefixes work only with a StandardV2 NAT gateway.", fr: "Les préfixes StandardV2 ne fonctionnent qu'avec une passerelle NAT StandardV2." }
    basic: { en: "Basic public IP addresses are retired, and NAT gateways don't support the Basic SKU.", fr: "Les adresses IP publiques Basic sont retirées, et les passerelles NAT ne prennent pas en charge le SKU Basic." }
references:
  - title: az network public-ip prefix
    url: https://learn.microsoft.com/en-us/cli/azure/network/public-ip/prefix
  - title: Public IP address prefix
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix
