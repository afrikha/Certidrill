id: az700-1c-nat-cli-create
objective: "1.3.10"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a resource group named **RG1** that contains a virtual network named **VNet1** with a subnet named **Apps**, and an IPv4 public IP address named **pip-natgw1** that uses the StandardV2 SKU.

    You need to use the Azure CLI to create a NAT gateway named **natgw1** that meets the following requirements:

    - Outbound traffic uses pip-natgw1.
    - Idle TCP flows are kept for 10 minutes.
    - The virtual machines in Apps use natgw1 for outbound internet traffic.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un groupe de ressources nommé **RG1** qui contient un réseau virtuel nommé **VNet1** avec un sous-réseau nommé **Apps**, ainsi qu'une adresse IP publique IPv4 nommée **pip-natgw1** qui utilise la référence SKU StandardV2.

    Vous devez utiliser Azure CLI pour créer une passerelle NAT nommée **natgw1** qui répond aux exigences suivantes :

    - Le trafic sortant utilise pip-natgw1.
    - Les flux TCP inactifs sont conservés pendant 10 minutes.
    - Les machines virtuelles de Apps utilisent natgw1 pour le trafic sortant vers Internet.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network nat gateway create \
      --resource-group RG1 --name natgw1 \
      --sku StandardV2 \
      [[ipparam]] pip-natgw1 \
      --idle-timeout [[timeout]]

    az network vnet subnet update \
      --resource-group RG1 --vnet-name VNet1 --name Apps \
      [[subparam]] natgw1
  slots:
    - id: ipparam
      options:
        - { id: pips, text: --public-ip-addresses }
        - { id: prefixes, text: --public-ip-prefixes }
        - { id: v6, text: --pip-addresses-v6 }
        - { id: srcvnet, text: --source-vnet }
    - id: timeout
      options:
        - { id: t4, text: "4" }
        - { id: t10, text: "10" }
        - { id: t600, text: "600" }
        - { id: t120, text: "120" }
    - id: subparam
      options:
        - { id: rt, text: --route-table }
        - { id: deleg, text: --delegations }
        - { id: natgw, text: --nat-gateway }
        - { id: se, text: --service-endpoints }
answer:
  values: { ipparam: pips, timeout: t10, subparam: natgw }
explanation:
  correct:
    en: "`--public-ip-addresses` attaches IPv4 public IP addresses to the NAT gateway. `--idle-timeout` is expressed in minutes; the TCP idle timeout ranges from 4 (default) to 120 minutes, so 10 keeps idle flows for 10 minutes. The NAT gateway is then attached to the subnet with `az network vnet subnet update --nat-gateway`."
    fr: "`--public-ip-addresses` attache des adresses IP publiques IPv4 à la passerelle NAT. `--idle-timeout` s'exprime en minutes ; le délai d'inactivité TCP va de 4 (valeur par défaut) à 120 minutes : 10 conserve les flux inactifs pendant 10 minutes. La passerelle NAT est ensuite attachée au sous-réseau avec `az network vnet subnet update --nat-gateway`."
  options:
    prefixes: { en: "pip-natgw1 is a public IP address, not a public IP prefix.", fr: "pip-natgw1 est une adresse IP publique, pas un préfixe d'adresse IP publique." }
    v6: { en: "--pip-addresses-v6 is for IPv6 public IP addresses; pip-natgw1 is IPv4.", fr: "--pip-addresses-v6 concerne les adresses IP publiques IPv6 ; pip-natgw1 est en IPv4." }
    srcvnet: { en: "--source-vnet references a virtual network, not a public IP address.", fr: "--source-vnet référence un réseau virtuel, pas une adresse IP publique." }
    t4: { en: "4 minutes is the default timeout, not the required 10 minutes.", fr: "4 minutes est le délai par défaut, pas les 10 minutes exigées." }
    t600: { en: "The value is in minutes, not seconds, and 600 exceeds the 120-minute maximum.", fr: "La valeur est en minutes, pas en secondes, et 600 dépasse le maximum de 120 minutes." }
    t120: { en: "120 minutes is the maximum, not the required value, and long timeouts increase the risk of SNAT port exhaustion.", fr: "120 minutes est le maximum, pas la valeur exigée, et les délais longs augmentent le risque d'épuisement des ports SNAT." }
    rt: { en: "--route-table associates a route table; a NAT gateway is not configured through a route.", fr: "--route-table associe une table de routage ; une passerelle NAT ne se configure pas par un itinéraire." }
    deleg: { en: "--delegations delegates the subnet to an Azure service.", fr: "--delegations délègue le sous-réseau à un service Azure." }
    se: { en: "--service-endpoints enables service endpoints, not outbound internet connectivity.", fr: "--service-endpoints active des points de terminaison de service, pas la connectivité sortante vers Internet." }
references:
  - title: az network nat gateway
    url: https://learn.microsoft.com/en-us/cli/azure/network/nat/gateway
  - title: NAT gateway resource
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-gateway-resource
