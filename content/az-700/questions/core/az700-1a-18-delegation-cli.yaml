id: az700-1a-18-delegation-cli
objective: "1.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have a virtual network named VNet-App that contains an empty subnet named snet-integration (10.70.4.0/26). You plan to connect an App Service web app to VNet-App by using regional virtual network integration with snet-integration.

    You need to prepare snet-integration by using the Azure CLI.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un réseau virtuel nommé VNet-App qui contient un sous-réseau vide nommé snet-integration (10.70.4.0/26). Vous prévoyez de connecter une application web App Service à VNet-App par l'intégration au réseau virtuel régional avec snet-integration.

    Vous devez préparer snet-integration avec Azure CLI.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network vnet subnet update --resource-group RG-App \
      --vnet-name VNet-App --name snet-integration \
      [[param]] [[value]]
  slots:
    - id: param
      options:
        - { id: deleg, text: --delegations }
        - { id: se, text: --service-endpoints }
        - { id: pep, text: --private-endpoint-network-policies }
    - id: value
      options:
        - { id: web, text: Microsoft.Web }
        - { id: farms, text: Microsoft.Web/serverFarms }
        - { id: env, text: Microsoft.Web/hostingEnvironments }
        - { id: sqlmi, text: Microsoft.Sql/managedInstances }
answer:
  values: { param: deleg, value: farms }
explanation:
  correct:
    en: Regional virtual network integration of App Service uses a dedicated subnet delegated to Microsoft.Web/serverFarms. With the Azure CLI, the delegation is set by `az network vnet subnet update --delegations`.
    fr: L'intégration au réseau virtuel régional d'App Service utilise un sous-réseau dédié délégué à Microsoft.Web/serverFarms. Avec Azure CLI, la délégation se définit par `az network vnet subnet update --delegations`.
  options:
    se: { en: "Service endpoints give the subnet a direct path to a service; they don't let App Service place its integration in the subnet.", fr: "Les points de terminaison de service donnent au sous-réseau un chemin direct vers un service ; ils ne permettent pas à App Service d'y placer son intégration." }
    pep: { en: "This parameter only controls whether NSGs and route tables apply to private endpoints.", fr: "Ce paramètre contrôle seulement si les NSG et les tables de routage s'appliquent aux points de terminaison privés." }
    web: { en: "Microsoft.Web is the name of the App Service service endpoint, not a delegation.", fr: "Microsoft.Web est le nom du point de terminaison de service d'App Service, pas une délégation." }
    env: { en: "Microsoft.Web/hostingEnvironments is used by App Service Environment, not by regional virtual network integration.", fr: "Microsoft.Web/hostingEnvironments est utilisé par App Service Environment, pas par l'intégration au réseau virtuel régional." }
    sqlmi: { en: "Microsoft.Sql/managedInstances is the delegation of SQL Managed Instance.", fr: "Microsoft.Sql/managedInstances est la délégation de SQL Managed Instance." }
references:
  - title: Integrate your app with an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-vnet-integration
  - title: az network vnet subnet
    url: https://learn.microsoft.com/en-us/cli/azure/network/vnet/subnet
