id: az700-1a-21-shared-subnet-candidates
objective: "1.1.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a subnet named snet-workload (10.12.4.0/24) that hosts six virtual machines. About 200 addresses of the subnet are free. To limit the number of subnets, you want to deploy new resources in snet-workload when the service allows it.

    Which two resources can you deploy in snet-workload?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un sous-réseau nommé snet-workload (10.12.4.0/24) qui héberge six machines virtuelles. Environ 200 adresses du sous-réseau sont libres. Pour limiter le nombre de sous-réseaux, vous voulez déployer les nouvelles ressources dans snet-workload lorsque le service le permet.

    Quelles sont les deux ressources que vous pouvez déployer dans snet-workload ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The frontend of an internal Standard load balancer", fr: "L'adresse frontale d'un équilibreur de charge interne Standard" } }
    - { id: b, text: { en: "An Application Gateway v2 instance", fr: "Une instance Application Gateway v2" } }
    - { id: c, text: { en: "A private endpoint for an Azure SQL database", fr: "Un point de terminaison privé pour une base de données Azure SQL" } }
    - { id: d, text: { en: "An Azure SQL Managed Instance", fr: "Une instance Azure SQL Managed Instance" } }
    - { id: e, text: { en: "An Azure Database for PostgreSQL flexible server with private access", fr: "Un serveur flexible Azure Database pour PostgreSQL avec accès privé" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Internal load balancer frontends and private endpoints only consume private IP addresses and can share a subnet with virtual machines.
    fr: Les adresses frontales d'équilibreur de charge interne et les points de terminaison privés ne consomment que des adresses IP privées et peuvent partager un sous-réseau avec des machines virtuelles.
  options:
    b: { en: "An Application Gateway subnet can contain only application gateways.", fr: "Un sous-réseau Application Gateway ne peut contenir que des passerelles d'application." }
    d: { en: "SQL Managed Instance requires a dedicated subnet.", fr: "SQL Managed Instance exige un sous-réseau dédié." }
    e: { en: "A flexible server with private access (virtual network integration) requires a dedicated subnet.", fr: "Un serveur flexible avec accès privé (intégration au réseau virtuel) exige un sous-réseau dédié." }
references:
  - title: Integrate Azure services with virtual networks for network isolation
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-for-azure-services
