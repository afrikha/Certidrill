id: az700-1c-nw-vpn-troubleshoot-scope
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has the following virtual network gateways:

    | Gateway | Gateway type | VPN type | Connection |
    | --- | --- | --- | --- |
    | VNG1 | VPN | Route-based | Site-to-site (IPsec) to Paris |
    | VNG2 | VPN | Policy-based | Site-to-site (IPsec) to Madrid |
    | VNG3 | ExpressRoute | Not applicable | Private peering to Frankfurt |

    All three connections report intermittent outages. You plan to use Network Watcher VPN troubleshoot and store the results in a storage account.

    Which gateways can you diagnose by using VPN troubleshoot?
  fr: |
    Tailspin dispose des passerelles de réseau virtuel suivantes :

    | Passerelle | Type de passerelle | Type de VPN | Connexion |
    | --- | --- | --- | --- |
    | VNG1 | VPN | Basé sur des routes | Site à site (IPsec) vers Paris |
    | VNG2 | VPN | Basé sur des stratégies | Site à site (IPsec) vers Madrid |
    | VNG3 | ExpressRoute | Non applicable | Peering privé vers Francfort |

    Les trois connexions signalent des coupures intermittentes. Vous prévoyez d'utiliser la résolution des problèmes de VPN de Network Watcher et de stocker les résultats dans un compte de stockage.

    Quelles passerelles pouvez-vous diagnostiquer à l'aide de la résolution des problèmes de VPN ?
body:
  options:
    - id: a
      text: { en: "VNG1 only", fr: "VNG1 uniquement" }
    - id: b
      text: { en: "VNG1 and VNG2 only", fr: "VNG1 et VNG2 uniquement" }
    - id: c
      text: { en: "VNG1 and VNG3 only", fr: "VNG1 et VNG3 uniquement" }
    - id: d
      text: { en: "VNG1, VNG2 and VNG3", fr: "VNG1, VNG2 et VNG3" }
answer: { optionId: a }
explanation:
  correct:
    en: VPN troubleshoot supports gateways of type VPN with a route-based VPN type, and IPsec and VNet-to-VNet connections. Policy-based VPN gateways and ExpressRoute gateways or connections are not supported. Only one VPN troubleshoot operation can run at a time per subscription.
    fr: La résolution des problèmes de VPN prend en charge les passerelles de type VPN dont le type de VPN est basé sur des routes, ainsi que les connexions IPsec et de réseau virtuel à réseau virtuel. Les passerelles VPN basées sur des stratégies et les passerelles ou connexions ExpressRoute ne sont pas prises en charge. Une seule opération de résolution des problèmes de VPN peut s'exécuter à la fois par abonnement.
  options:
    b: { en: "Policy-based VPN gateways are not supported by VPN troubleshoot.", fr: "Les passerelles VPN basées sur des stratégies ne sont pas prises en charge par la résolution des problèmes de VPN." }
    c: { en: "ExpressRoute gateways and connections are not supported by VPN troubleshoot.", fr: "Les passerelles et connexions ExpressRoute ne sont pas prises en charge par la résolution des problèmes de VPN." }
    d: { en: "Neither the policy-based gateway nor the ExpressRoute gateway is supported.", fr: "Ni la passerelle basée sur des stratégies ni la passerelle ExpressRoute ne sont prises en charge." }
references:
  - title: VPN troubleshoot overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vpn-troubleshoot-overview
