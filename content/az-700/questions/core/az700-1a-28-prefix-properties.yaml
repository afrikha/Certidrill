id: az700-1a-28-prefix-properties
objective: "1.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum created a public IP prefix named ippre-web with the following settings: region North Europe, IP version IPv4, SKU Standard, prefix size /29, zone-redundant. No public IP address has been created from ippre-web yet.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum a créé un préfixe d'adresse IP publique nommé ippre-web avec les paramètres suivants : région North Europe, version IP IPv4, SKU Standard, taille de préfixe /29, redondant interzone. Aucune adresse IP publique n'a encore été créée à partir d'ippre-web.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: ippre-web already counts as eight addresses against the public IP address quota of the subscription in North Europe.
        fr: ippre-web compte déjà pour huit adresses dans le quota d'adresses IP publiques de l'abonnement dans la région North Europe.
    - id: s2
      text:
        en: When you create a public IP address from ippre-web, you can specify which address of the range it receives.
        fr: Lorsque vous créez une adresse IP publique à partir d'ippre-web, vous pouvez indiquer quelle adresse de la plage elle reçoit.
    - id: s3
      text:
        en: You can change the size of ippre-web to /28 when more addresses are needed.
        fr: Vous pouvez passer la taille d'ippre-web à /28 lorsque davantage d'adresses sont nécessaires.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: The whole prefix counts against the regional public IP quota as soon as it is created, even if no address is allocated. The size of a prefix can't be changed after creation. Azure chooses the range of the prefix, but you can choose which address of the prefix a new public IP address takes, for example with `--ip-address`.
    fr: Le préfixe entier compte dans le quota régional d'adresses IP publiques dès sa création, même si aucune adresse n'est allouée. La taille d'un préfixe ne peut pas être modifiée après la création. Azure choisit la plage du préfixe, mais vous pouvez choisir quelle adresse du préfixe prend une nouvelle adresse IP publique, par exemple avec `--ip-address`.
references:
  - title: Public IP address prefix
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix
  - title: az network public-ip
    url: https://learn.microsoft.com/en-us/cli/azure/network/public-ip
