id: az700-1c-mdc-secure-score-calc
objective: "1.4.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam uses the classic secure score of Microsoft Defender for Cloud in the Azure portal. For the virtual machine **VM1**, the security control **Restrict unauthorized network access** lists two unhealthy recommendations:

    - All network ports should be restricted on network security groups associated to your virtual machine
    - IP forwarding on your virtual machine should be disabled

    Another networking recommendation in the subscription is flagged as **Preview**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise le degré de sécurisation classique de Microsoft Defender for Cloud dans le portail Azure. Pour la machine virtuelle **VM1**, le contrôle de sécurité **Restreindre l'accès réseau non autorisé** (Restrict unauthorized network access) liste deux recommandations non saines :

    - All network ports should be restricted on network security groups associated to your virtual machine
    - IP forwarding on your virtual machine should be disabled

    Une autre recommandation réseau de l'abonnement est signalée comme **Preview** (préversion).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Remediating only the IP forwarding recommendation for VM1 increases the points earned by the control.
        fr: Corriger uniquement la recommandation sur le transfert IP pour VM1 augmente les points obtenus par le contrôle.
    - id: s2
      text:
        en: Remediating the Preview recommendation increases the secure score.
        fr: Corriger la recommandation en préversion augmente le degré de sécurisation.
    - id: s3
      text:
        en: If you exempt VM1 from both recommendations with the Risk accepted (waiver) category, VM1 is excluded from the secure score calculation.
        fr: Si vous exemptez VM1 des deux recommandations avec la catégorie Risk accepted (waiver), VM1 est exclue du calcul du degré de sécurisation.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: A control's score is the score per resource multiplied by the number of healthy resources, and a resource becomes healthy for a control only when all the control's recommendations are remediated for it, so fixing one of the two doesn't add points. Recommendations flagged as Preview aren't included in the secure score calculation. A waiver (risk accepted) exemption lists the resource as Not applicable with the reason Exempted and excludes it from the calculation.
    fr: "Le score d'un contrôle est égal au score par ressource multiplié par le nombre de ressources saines, et une ressource ne devient saine pour un contrôle que lorsque toutes les recommandations du contrôle sont corrigées pour elle : en corriger une sur deux n'ajoute aucun point. Les recommandations signalées comme préversion ne sont pas incluses dans le calcul du degré de sécurisation. Une exemption de catégorie Risk accepted (waiver) classe la ressource comme Non applicable avec le motif Exempted et l'exclut du calcul."
references:
  - title: Cloud Secure Score in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/secure-score-security-controls
  - title: Exempt resources from recommendations
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/exempt-resource
