id: az700-1c-nat-snat-prefix-size
objective: "1.3.10"
type: single
difficulty: 3
shuffle: false
status: draft
stem:
  en: |
    Contoso is deploying a NAT gateway named **natgw-crawl** for a subnet that hosts a web crawling application. Load tests show that, at peak, the application needs up to 450,000 concurrent outbound TCP connections spread across thousands of destination endpoints.

    The public IP addresses used by natgw-crawl must come from a single public IP prefix so that partners can allowlist them. The solution must provide enough SNAT ports for the peak and use the smallest possible prefix.

    Which prefix size should you create?
  fr: |
    Contoso déploie une passerelle NAT nommée **natgw-crawl** pour un sous-réseau qui héberge une application d'exploration web. Les tests de charge montrent qu'au pic, l'application a besoin de jusqu'à 450 000 connexions TCP sortantes simultanées réparties sur des milliers de points de terminaison de destination.

    Les adresses IP publiques utilisées par natgw-crawl doivent provenir d'un seul préfixe d'adresse IP publique afin que des partenaires puissent les autoriser. La solution doit fournir suffisamment de ports SNAT pour le pic et utiliser le plus petit préfixe possible.

    Quelle taille de préfixe devez-vous créer ?
body:
  options:
    - id: a
      text: { en: "/31 (2 addresses)", fr: "/31 (2 adresses)" }
    - id: b
      text: { en: "/30 (4 addresses)", fr: "/30 (4 adresses)" }
    - id: c
      text: { en: "/29 (8 addresses)", fr: "/29 (8 adresses)" }
    - id: d
      text: { en: "/28 (16 addresses)", fr: "/28 (16 adresses)" }
answer: { optionId: c }
explanation:
  correct:
    en: Each public IP address of a NAT gateway provides 64,512 SNAT ports. 450,000 / 64,512 ≈ 6.98, so seven addresses are needed, and the smallest prefix that contains at least seven addresses is a /29 (eight addresses, 516,096 ports). A NAT gateway supports up to 16 IPv4 addresses, so a /28 would also work but is larger than necessary.
    fr: "Chaque adresse IP publique d'une passerelle NAT fournit 64 512 ports SNAT. 450 000 / 64 512 ≈ 6,98 : il faut sept adresses, et le plus petit préfixe qui en contient au moins sept est un /29 (huit adresses, 516 096 ports). Une passerelle NAT prend en charge jusqu'à 16 adresses IPv4 : un /28 fonctionnerait aussi, mais il est plus grand que nécessaire."
  options:
    a: { en: "Two addresses provide 129,024 SNAT ports, far below the 450,000 needed.", fr: "Deux adresses fournissent 129 024 ports SNAT, bien en dessous des 450 000 nécessaires." }
    b: { en: "Four addresses provide 258,048 SNAT ports, which is not enough for the peak.", fr: "Quatre adresses fournissent 258 048 ports SNAT, ce qui ne suffit pas pour le pic." }
    d: { en: "Sixteen addresses provide enough ports, but the requirement is the smallest possible prefix.", fr: "Seize adresses fournissent assez de ports, mais l'exigence est le plus petit préfixe possible." }
references:
  - title: NAT gateway resource
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-gateway-resource
