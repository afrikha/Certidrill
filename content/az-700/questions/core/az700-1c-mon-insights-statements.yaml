id: az700-1c-mon-insights-statements
objective: "1.4.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware's network team starts using Azure Monitor Network insights. The subscription contains application gateways, Azure Firewall instances, NAT gateways and VPN gateways. No monitoring agent has been deployed and no data collection has been configured for these resources.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe réseau de Litware commence à utiliser les insights réseau (Network insights) d'Azure Monitor. L'abonnement contient des passerelles d'application, des instances de Pare-feu Azure, des passerelles NAT et des passerelles VPN. Aucun agent de supervision n'a été déployé et aucune collecte de données n'a été configurée pour ces ressources.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Network insights displays the topology, health and metrics of these resources only after you deploy an agent or configure data collection.
        fr: Les insights réseau n'affichent la topologie, l'intégrité et les métriques de ces ressources qu'après le déploiement d'un agent ou la configuration d'une collecte de données.
    - id: s2
      text:
        en: For an application gateway, the resource view shows how the frontend IP addresses connect to listeners, rules and backend pools.
        fr: Pour une passerelle d'application, la vue de ressource montre comment les adresses IP frontales sont reliées aux écouteurs, aux règles et aux pools principaux.
    - id: s3
      text:
        en: You can start a packet capture from the Diagnostic Toolkit tab.
        fr: Vous pouvez démarrer une capture de paquets depuis l'onglet Diagnostic Toolkit.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Network insights shows the topology, health and metrics of all deployed networking resources without requiring any configuration. The resource view of an application gateway displays frontend IPs, listeners, rules and backend pools, with lines colored by backend pool health. The Diagnostic Toolkit tab gives access to packet capture, VPN troubleshoot, connection troubleshoot, next hop and IP flow verify.
    fr: "Les insights réseau affichent la topologie, l'intégrité et les métriques de toutes les ressources réseau déployées sans aucune configuration. La vue de ressource d'une passerelle d'application affiche les adresses IP frontales, les écouteurs, les règles et les pools principaux, avec des liaisons colorées selon l'intégrité des pools principaux. L'onglet Diagnostic Toolkit donne accès à la capture de paquets, à la résolution des problèmes de VPN, à la résolution des problèmes de connexion, au tronçon suivant et à la vérification des flux IP."
references:
  - title: Network insights
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-insights-overview
