id: az700-1c-cse-prerequisites
objective: "1.4.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has three Azure subscriptions that use only the foundational CSPM capabilities of Microsoft Defender for Cloud, and an AWS account that hosts part of the front-end network. The security team wants to use cloud security explorer to find internet-exposed resources in both clouds with a single query.

    How should you complete the prerequisites? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose de trois abonnements Azure qui n'utilisent que les fonctionnalités CSPM de base (foundational CSPM) de Microsoft Defender for Cloud, et d'un compte AWS qui héberge une partie du réseau frontal. L'équipe de sécurité souhaite utiliser l'explorateur de sécurité du cloud pour trouver les ressources exposées à Internet dans les deux clouds avec une seule requête.

    Comment devez-vous compléter les prérequis ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      On the Azure subscriptions, enable [[plan]].
      In the same plan settings, turn on [[scan]].
      For the AWS account, [[aws]].
    fr: |
      Sur les abonnements Azure, activez [[plan]].
      Dans les paramètres de ce même plan, activez [[scan]].
      Pour le compte AWS, [[aws]].
  slots:
    - id: plan
      options:
        - { id: servers1, text: "Defender for Servers Plan 1" }
        - { id: cspm, text: "Defender CSPM" }
        - { id: storage, text: "Defender for Storage" }
    - id: scan
      options:
        - { id: agentless, text: { en: "agentless scanning", fr: "l'analyse sans agent" } }
        - { id: ama, text: { en: "automatic deployment of the Azure Monitor Agent", fr: "le déploiement automatique de l'agent Azure Monitor" } }
        - { id: nwagent, text: { en: "automatic deployment of the Network Watcher Agent extension", fr: "le déploiement automatique de l'extension Network Watcher Agent" } }
    - id: aws
      options:
        - { id: arc, text: { en: "onboard the EC2 instances to Azure Arc", fr: "intégrez les instances EC2 à Azure Arc" } }
        - { id: vpn, text: { en: "create a site-to-site VPN between Azure and AWS", fr: "créez un VPN de site à site entre Azure et AWS" } }
        - { id: connector, text: { en: "create an AWS connector and enable Defender CSPM on it", fr: "créez un connecteur AWS et activez Defender CSPM sur celui-ci" } }
answer:
  values: { plan: cspm, scan: agentless, aws: connector }
explanation:
  correct:
    en: Cloud security explorer ("risk hunting with security explorer") is a Defender CSPM capability, not available with foundational CSPM, and it requires agentless scanning. Multicloud queries require an active AWS or GCP connector with Defender CSPM enabled on that account, so the AWS resources are added to the cloud security graph.
    fr: "L'explorateur de sécurité du cloud (recherche des risques avec l'explorateur de sécurité) est une fonctionnalité de Defender CSPM, non disponible avec le CSPM de base, et il nécessite l'analyse sans agent. Les requêtes multicloud nécessitent un connecteur AWS ou GCP actif avec Defender CSPM activé sur ce compte, afin que les ressources AWS soient ajoutées au graphique de sécurité cloud."
  options:
    servers1: { en: "Defender for Servers Plan 1 doesn't provide cloud security explorer.", fr: "Defender for Servers Plan 1 ne fournit pas l'explorateur de sécurité du cloud." }
    storage: { en: "Defender for Storage protects storage accounts; it doesn't provide cloud security explorer.", fr: "Defender for Storage protège les comptes de stockage ; il ne fournit pas l'explorateur de sécurité du cloud." }
    ama: { en: "The Azure Monitor Agent collects monitoring data; the explorer relies on agentless scanning.", fr: "L'agent Azure Monitor collecte des données de supervision ; l'explorateur repose sur l'analyse sans agent." }
    nwagent: { en: "The Network Watcher Agent is used by Network Watcher tools, not by Defender for Cloud.", fr: "L'agent Network Watcher est utilisé par les outils Network Watcher, pas par Defender for Cloud." }
    arc: { en: "Azure Arc onboards servers, but multicloud posture data comes from the AWS connector.", fr: "Azure Arc intègre des serveurs, mais les données de posture multicloud proviennent du connecteur AWS." }
    vpn: { en: "Network connectivity between clouds has no role in Defender for Cloud posture management.", fr: "La connectivité réseau entre clouds ne joue aucun rôle dans la gestion de la posture de Defender for Cloud." }
references:
  - title: Build queries with cloud security explorer
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/how-to-manage-cloud-security-explorer
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
