id: az700-1b-dns-servers-behaviour
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware has two peered virtual networks:

    | Virtual network | DNS servers setting |
    | --- | --- |
    | VNet1 | Custom: 10.1.0.4 |
    | VNet2 | Default (Azure-provided) |

    The DNS server at 10.1.0.4 runs on a virtual machine in VNet1. All the network interfaces inherit the DNS settings of their virtual network, and all the virtual machines have renewed their DHCP lease.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose de deux réseaux virtuels reliés par peering :

    | Réseau virtuel | Paramètre Serveurs DNS |
    | --- | --- |
    | VNet1 | Personnalisé : 10.1.0.4 |
    | VNet2 | Par défaut (fourni par Azure) |

    Le serveur DNS 10.1.0.4 s'exécute sur une machine virtuelle de VNet1. Toutes les interfaces réseau héritent les paramètres DNS de leur réseau virtuel, et toutes les machines virtuelles ont renouvelé leur bail DHCP.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The virtual machines in VNet1 receive the Azure-provided DNS suffix internal.cloudapp.net through DHCP.
        fr: Les machines virtuelles de VNet1 reçoivent par DHCP le suffixe DNS internal.cloudapp.net fourni par Azure.
    - id: s2
      text:
        en: If the Custom setting of a virtual network contains no DNS server address, its virtual machines use Azure-provided DNS.
        fr: Si le paramètre Personnalisé d'un réseau virtuel ne contient aucune adresse de serveur DNS, ses machines virtuelles utilisent le DNS fourni par Azure.
    - id: s3
      text:
        en: The virtual machines in VNet2 send their DNS queries to 10.1.0.4 because VNet2 is peered with VNet1.
        fr: Les machines virtuelles de VNet2 envoient leurs requêtes DNS à 10.1.0.4, car VNet2 est relié à VNet1 par peering.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      When a virtual network uses your own DNS servers, Azure doesn't supply its DNS suffix and gives a nonfunctioning placeholder instead, so clients must use FQDNs. A Custom setting without any address is ignored, and the virtual network falls back to Azure-provided DNS. DNS settings belong to each virtual network (or network interface); peering doesn't share them, so VNet2 keeps using 168.63.129.16.
    fr: |
      Quand un réseau virtuel utilise vos propres serveurs DNS, Azure ne fournit pas son suffixe DNS mais une valeur fictive non fonctionnelle : les clients doivent utiliser des FQDN. Un paramètre Personnalisé sans adresse est ignoré, et le réseau virtuel revient au DNS fourni par Azure. Les paramètres DNS appartiennent à chaque réseau virtuel (ou interface réseau) ; le peering ne les partage pas, et VNet2 continue d'utiliser 168.63.129.16.
references:
  - title: Configure DNS name resolution for Azure virtual networks
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-name-resolution-for-vms-and-role-instances
