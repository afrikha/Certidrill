id: az700-1c-rt-nva-drop-causes
objective: "1.3.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has a hub virtual network named **VNet-Hub** and a spoke virtual network named **VNet-Spoke1**. The networks are peered, and **Allow forwarded traffic** is enabled on both sides of the peering.

    A Linux virtual machine named **NVA1** in VNet-Hub acts as a network virtual appliance and has the IP address 10.0.1.4. Subnet **Web** in VNet-Spoke1 is associated with a route table that contains a route for 10.30.0.0/16 with the next hop type **Virtual appliance** and the next hop address 10.0.1.4. Next hop in Network Watcher confirms that traffic from a VM in Web to 10.30.1.10 uses this route.

    The traffic never reaches 10.30.1.10. NSG rules allow the traffic at every hop.

    Which two issues could cause the problem?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un réseau virtuel hub nommé **VNet-Hub** et d'un réseau virtuel spoke nommé **VNet-Spoke1**. Les réseaux ont un peering, et **Allow forwarded traffic** (autoriser le trafic transféré) est activé des deux côtés du peering.

    Une machine virtuelle Linux nommée **NVA1** dans VNet-Hub joue le rôle d'appliance virtuelle réseau et a l'adresse IP 10.0.1.4. Le sous-réseau **Web** de VNet-Spoke1 est associé à une table de routage qui contient un itinéraire pour 10.30.0.0/16 avec le type de tronçon suivant **Appliance virtuelle** et l'adresse de tronçon suivant 10.0.1.4. L'outil Tronçon suivant de Network Watcher confirme que le trafic d'une machine virtuelle de Web vers 10.30.1.10 utilise cet itinéraire.

    Le trafic n'atteint jamais 10.30.1.10. Les règles NSG autorisent le trafic à chaque étape.

    Quels sont les deux problèmes qui pourraient en être la cause ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "IP forwarding is disabled on the network interface of NVA1.", fr: "Le transfert IP est désactivé sur l'interface réseau de NVA1." } }
    - { id: b, text: { en: "Gateway route propagation is disabled on the route table of the Web subnet.", fr: "La propagation des itinéraires de passerelle est désactivée sur la table de routage du sous-réseau Web." } }
    - { id: c, text: { en: "The operating system of NVA1 is not configured to forward packets.", fr: "Le système d'exploitation de NVA1 n'est pas configuré pour transférer les paquets." } }
    - { id: d, text: { en: "The route table is in a different resource group than VNet-Spoke1.", fr: "La table de routage se trouve dans un autre groupe de ressources que VNet-Spoke1." } }
    - { id: e, text: { en: "Use remote gateways is disabled on the peering of VNet-Spoke1.", fr: "Use remote gateways (utiliser les passerelles distantes) est désactivé sur le peering de VNet-Spoke1." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: When a user-defined route sends traffic to a virtual appliance, the appliance's network interface must have IP forwarding enabled in Azure, otherwise Azure drops packets that are not addressed to the NIC's own IP addresses. The appliance itself must also run software that forwards the traffic (routing enabled in the OS or a firewall application). Either missing piece explains why the route is selected but the traffic never arrives.
    fr: "Lorsqu'un itinéraire défini par l'utilisateur envoie le trafic vers une appliance virtuelle, l'interface réseau de l'appliance doit avoir le transfert IP activé dans Azure ; sinon Azure abandonne les paquets qui ne sont pas destinés aux adresses IP de la carte réseau. L'appliance doit aussi exécuter un logiciel qui transfère le trafic (routage activé dans le système d'exploitation ou application de pare-feu). L'absence de l'un ou l'autre explique que l'itinéraire soit sélectionné mais que le trafic n'arrive jamais."
  options:
    b: { en: "Gateway route propagation only controls routes learned from a virtual network gateway; it has no effect on a user-defined route to an NVA, and Next hop already shows the route in use.", fr: "La propagation des itinéraires de passerelle ne concerne que les itinéraires appris d'une passerelle de réseau virtuel ; elle n'a aucun effet sur un itinéraire défini par l'utilisateur vers une NVA, et Tronçon suivant montre déjà l'itinéraire utilisé." }
    d: { en: "A route table must be in the same region and subscription as the virtual network, but the resource group does not matter.", fr: "Une table de routage doit se trouver dans la même région et le même abonnement que le réseau virtuel, mais le groupe de ressources n'a pas d'importance." }
    e: { en: "Use remote gateways only lets the spoke use a gateway in the hub; it is not needed to reach an NVA over the peering.", fr: "Use remote gateways permet seulement au spoke d'utiliser une passerelle du hub ; ce n'est pas nécessaire pour joindre une NVA via le peering." }
references:
  - title: Diagnose a virtual machine routing problem
    url: https://learn.microsoft.com/en-us/azure/virtual-network/diagnose-network-routing-problem
  - title: Create, change, or delete a network interface
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface
