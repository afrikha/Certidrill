id: az700-1c-cse-custom-query
objective: "1.4.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware uses Defender CSPM with agentless scanning across its Azure subscriptions. The network security lead wants to build a query that finds all virtual machines that are exposed to the internet, have high-severity vulnerabilities and can access a storage account that contains sensitive data. The results must be downloadable as a CSV file and the query must be shareable with colleagues.

    What should the lead use?
  fr: |
    Proseware utilise Defender CSPM avec l'analyse sans agent dans ses abonnements Azure. Le responsable de la sécurité réseau souhaite créer une requête qui trouve toutes les machines virtuelles exposées à Internet, présentant des vulnérabilités de gravité élevée et pouvant accéder à un compte de stockage contenant des données sensibles. Les résultats doivent pouvoir être téléchargés au format CSV et la requête doit pouvoir être partagée avec des collègues.

    Qu'est-ce que le responsable doit utiliser ?
body:
  options:
    - id: a
      text: { en: "Traffic analytics in Network Watcher with the open internet ports view", fr: "Traffic analytics dans Network Watcher avec la vue des ports Internet ouverts" }
    - id: b
      text: { en: "Azure Resource Graph Explorer with a KQL query on the Resources table", fr: "L'Explorateur Azure Resource Graph avec une requête KQL sur la table Resources" }
    - id: c
      text: { en: "The asset inventory of Microsoft Defender for Cloud filtered by resource type", fr: "L'inventaire des ressources de Microsoft Defender for Cloud filtré par type de ressource" }
    - id: d
      text: { en: "Cloud security explorer in Microsoft Defender for Cloud", fr: "L'explorateur de sécurité du cloud (Cloud security explorer) de Microsoft Defender for Cloud" }
answer: { optionId: d }
explanation:
  correct:
    en: Cloud security explorer runs graph-based queries on the cloud security graph, which combines asset inventory, internet exposure, vulnerabilities, permissions and lateral movement. You select a resource type, add conditions and relationships with +, and select Search; Download CSV report exports the results and Share query link copies a link to the query. It requires Defender CSPM.
    fr: "L'explorateur de sécurité du cloud exécute des requêtes basées sur le graphique de sécurité cloud, qui combine l'inventaire des ressources, l'exposition à Internet, les vulnérabilités, les autorisations et les mouvements latéraux. Vous sélectionnez un type de ressource, ajoutez des conditions et des relations avec +, puis sélectionnez Search ; Download CSV report exporte les résultats et Share query link copie un lien vers la requête. Il nécessite Defender CSPM."
  options:
    b: { en: "Resource Graph queries resource properties; it doesn't evaluate internet exposure, vulnerabilities and access relationships of the security graph.", fr: "Resource Graph interroge les propriétés des ressources ; il n'évalue pas l'exposition à Internet, les vulnérabilités et les relations d'accès du graphique de sécurité." }
    c: { en: "The asset inventory lists resources and their recommendations; it can't combine exposure, vulnerabilities and access to sensitive data in one query.", fr: "L'inventaire des ressources liste les ressources et leurs recommandations ; il ne peut pas combiner exposition, vulnérabilités et accès aux données sensibles dans une seule requête." }
    a: { en: "Traffic analytics analyzes flow logs; it doesn't know about vulnerabilities or identity permissions.", fr: "Traffic analytics analyse les journaux de flux ; il ne connaît ni les vulnérabilités ni les autorisations des identités." }
references:
  - title: Build queries with cloud security explorer
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/how-to-manage-cloud-security-explorer
