id: az700-1a-14-appgw-subnet-size
objective: "1.1.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You plan to deploy an Application Gateway Standard_v2 instance named AGW1 in a new subnet. AGW1 will have a public frontend IP address and a private frontend IP address, and autoscaling will be configured with a maximum of 125 instances. No other application gateway will use the subnet.

    What is the smallest subnet that supports this configuration?
  fr: |
    Vous prévoyez de déployer une instance Application Gateway Standard_v2 nommée AGW1 dans un nouveau sous-réseau. AGW1 aura une adresse IP frontale publique et une adresse IP frontale privée, et la mise à l'échelle automatique sera configurée avec un maximum de 125 instances. Aucune autre passerelle d'application n'utilisera le sous-réseau.

    Quel est le plus petit sous-réseau qui prend en charge cette configuration ?
body:
  options:
    - { id: a, text: /27 }
    - { id: b, text: /26 }
    - { id: c, text: /25 }
    - { id: d, text: /24 }
answer: { optionId: d }
explanation:
  correct:
    en: Each Application Gateway v2 instance uses one private IP address of the subnet, the private frontend uses one more, and Azure reserves five addresses. 125 + 1 + 5 = 131 addresses, which is more than the 128 addresses of a /25, so a /24 is required.
    fr: |
      Chaque instance d'Application Gateway v2 utilise une adresse IP privée du sous-réseau, l'adresse frontale privée en utilise une de plus, et Azure réserve cinq adresses. 125 + 1 + 5 = 131 adresses, soit plus que les 128 adresses d'un /25 : un /24 est nécessaire.
  options:
    a: { en: "A /27 provides 27 usable addresses, far fewer than 126.", fr: "Un /27 fournit 27 adresses utilisables, bien moins que 126." }
    b: { en: "A /26 provides 59 usable addresses, far fewer than 126.", fr: "Un /26 fournit 59 adresses utilisables, bien moins que 126." }
    c: { en: "A /25 provides 123 usable addresses, three fewer than the 125 instances plus the private frontend need.", fr: "Un /25 fournit 123 adresses utilisables, trois de moins que ce qu'exigent les 125 instances et l'adresse frontale privée." }
references:
  - title: Azure Application Gateway infrastructure configuration
    url: https://learn.microsoft.com/en-us/azure/application-gateway/configuration-infrastructure
