id: az700-1a-16-sqlmi-delegation
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to deploy Azure SQL Managed Instance in an existing virtual network named VNet-Data. VNet-Data contains an empty subnet named snet-sqlmi (10.20.8.0/26).

    You need to prepare snet-sqlmi so that the managed instance can be deployed into it.

    What should you configure on snet-sqlmi?
  fr: |
    Contoso prévoit de déployer Azure SQL Managed Instance dans un réseau virtuel existant nommé VNet-Data. VNet-Data contient un sous-réseau vide nommé snet-sqlmi (10.20.8.0/26).

    Vous devez préparer snet-sqlmi pour que l'instance managée puisse y être déployée.

    Que devez-vous configurer sur snet-sqlmi ?
body:
  options:
    - { id: a, text: { en: "A service endpoint for Microsoft.Sql", fr: "Un point de terminaison de service pour Microsoft.Sql" } }
    - { id: b, text: { en: "A private endpoint for the managed instance", fr: "Un point de terminaison privé pour l'instance managée" } }
    - { id: c, text: { en: "A subnet delegation to Microsoft.Sql/managedInstances", fr: "Une délégation de sous-réseau à Microsoft.Sql/managedInstances" } }
    - { id: d, text: { en: "The private endpoint network policy set to Enabled", fr: "La stratégie réseau des points de terminaison privés définie sur Enabled" } }
answer: { optionId: c }
explanation:
  correct:
    en: SQL Managed Instance is injected into the virtual network. Its subnet is delegated to Microsoft.Sql/managedInstances, which gives the service the permission to create its resources in the subnet and to apply the network policies it needs. A /26 is larger than the /27 minimum.
    fr: SQL Managed Instance est injecté dans le réseau virtuel. Son sous-réseau est délégué à Microsoft.Sql/managedInstances, ce qui donne au service l'autorisation de créer ses ressources dans le sous-réseau et d'appliquer les stratégies réseau dont il a besoin. Un /26 dépasse le minimum de /27.
  options:
    a: { en: "A Microsoft.Sql service endpoint gives subnets a direct path to Azure SQL Database; it doesn't host a managed instance.", fr: "Un point de terminaison de service Microsoft.Sql donne aux sous-réseaux un chemin direct vers Azure SQL Database ; il n'héberge pas d'instance managée." }
    b: { en: "A private endpoint gives private access to a service that stays outside the virtual network; the managed instance itself is deployed inside the subnet.", fr: "Un point de terminaison privé donne un accès privé à un service qui reste hors du réseau virtuel ; l'instance managée, elle, est déployée dans le sous-réseau." }
    d: { en: "This policy only makes NSGs and route tables apply to private endpoints in the subnet.", fr: "Cette stratégie fait seulement s'appliquer les NSG et les tables de routage aux points de terminaison privés du sous-réseau." }
references:
  - title: Add or remove subnet delegation in Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-subnet-delegation
  - title: Determine required subnet size and range for Azure SQL Managed Instance
    url: https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/vnet-subnet-determine-size
