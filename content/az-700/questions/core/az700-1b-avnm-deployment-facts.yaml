id: az700-1b-avnm-deployment-facts
objective: "1.3.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Litware uses Azure Virtual Network Manager. The following connectivity configurations are deployed to East US:

    | Configuration | Topology | Network group | Membership of the network group |
    | --- | --- | --- | --- |
    | CC-Mesh | Mesh | NG-Data | Dynamic (Azure Policy condition on a tag) |
    | CC-Hub | Hub and spoke | NG-Web | Static |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise Azure Virtual Network Manager. Les configurations de connectivité suivantes sont déployées dans East US :

    | Configuration | Topologie | Groupe réseau | Appartenance au groupe réseau |
    | --- | --- | --- | --- |
    | CC-Mesh | Maillage | NG-Data | Dynamique (condition Azure Policy sur une étiquette) |
    | CC-Hub | Hub-and-spoke | NG-Web | Statique |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A virtual network that is created in East US with the matching tag receives the CC-Mesh connectivity without a new deployment.
        fr: Un réseau virtuel créé dans East US avec l'étiquette correspondante reçoit la connectivité de CC-Mesh sans nouveau déploiement.
    - id: s2
      text:
        en: After you add a spoke network group to CC-Hub and save CC-Hub, the new spokes are peered with the hub without a new deployment.
        fr: Après l'ajout d'un groupe réseau spoke à CC-Hub et l'enregistrement de CC-Hub, les nouveaux spokes sont reliés au hub par peering sans nouveau déploiement.
    - id: s3
      text:
        en: The virtual networks of NG-Data show a peering to each other on their Peerings page.
        fr: Les réseaux virtuels de NG-Data affichent un peering entre eux dans leur page Peerings.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A virtual network that joins a network group targeted by a configuration already active in its region receives the configuration automatically; with Azure Policy, membership is updated after a few minutes. A change to a configuration itself takes effect only when you deploy it to the region again. A mesh uses a connected group, which creates no peering resources: the effective routes show the next hop type ConnectedGroup instead.
    fr: |
      Un réseau virtuel qui rejoint un groupe réseau ciblé par une configuration déjà active dans sa région reçoit automatiquement la configuration ; avec Azure Policy, l'appartenance est mise à jour après quelques minutes. Une modification de la configuration elle-même ne s'applique que lorsque vous la déployez de nouveau dans la région. Un maillage utilise un groupe connecté, qui ne crée pas de ressources de peering : les itinéraires effectifs affichent à la place le type de tronçon suivant ConnectedGroup.
references:
  - title: Manage configuration deployments in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-deployments
  - title: Connectivity configurations in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-connectivity-configuration
