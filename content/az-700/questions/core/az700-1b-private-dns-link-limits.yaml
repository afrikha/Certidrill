id: az700-1b-private-dns-link-limits
objective: "1.2.4"
type: dropdown
difficulty: 1
shuffle: false
status: draft
stem:
  en: |
    Northwind plans a hub-and-spoke network with 350 spoke virtual networks. You are evaluating whether a single private DNS zone named **nw.internal** can serve all the spokes, both for name resolution and for the automatic registration of their virtual machines.

    Complete the design statements by selecting the correct limits in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind prévoit un réseau hub-and-spoke de 350 réseaux virtuels spokes. Vous évaluez si une seule zone DNS privée nommée **nw.internal** peut servir tous les spokes, à la fois pour la résolution de noms et pour l'inscription automatique de leurs machines virtuelles.

    Complétez les affirmations de conception en sélectionnant les limites correctes dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A private DNS zone supports at most [[auto]] virtual network links with autoregistration enabled, so a single zone can't register the virtual machines of all 350 spokes.

      A private DNS zone supports at most [[total]] virtual network links in total, so all 350 spokes can resolve nw.internal through links without autoregistration.
    fr: |
      Une zone DNS privée prend en charge au plus [[auto]] liens de réseau virtuel avec l'inscription automatique activée : une seule zone ne peut donc pas inscrire les machines virtuelles des 350 spokes.

      Une zone DNS privée prend en charge au plus [[total]] liens de réseau virtuel au total : les 350 spokes peuvent donc résoudre nw.internal par des liens sans inscription automatique.
  slots:
    - id: auto
      options:
        - { id: v10, text: "10" }
        - { id: v100, text: "100" }
        - { id: v500, text: "500" }
        - { id: v1000, text: { en: "1,000", fr: "1 000" } }
    - id: total
      options:
        - { id: v100, text: "100" }
        - { id: v500, text: "500" }
        - { id: v1000, text: { en: "1,000", fr: "1 000" } }
        - { id: v3000, text: { en: "3,000", fr: "3 000" } }
answer:
  values: { auto: v100, total: v1000 }
explanation:
  correct:
    en: |
      A private DNS zone accepts up to 1,000 virtual network links, of which up to 100 can have autoregistration enabled. With 350 spokes, all of them can resolve the zone, but automatic registration must be split across several zones or replaced by manual records for some spokes.
    fr: |
      Une zone DNS privée accepte jusqu'à 1 000 liens de réseau virtuel, dont 100 au plus avec l'inscription automatique activée. Avec 350 spokes, tous peuvent résoudre la zone, mais l'inscription automatique doit être répartie entre plusieurs zones ou remplacée par des enregistrements manuels pour certains spokes.
references:
  - title: Azure subscription and service limits, quotas, and constraints
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/azure-subscription-service-limits
  - title: What is a virtual network link?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-virtual-network-links
