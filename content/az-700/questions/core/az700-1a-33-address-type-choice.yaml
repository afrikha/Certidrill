id: az700-1a-33-address-type-choice
objective: "1.1.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has four public addressing requirements for workloads in Azure.

    What should you use for each requirement? To answer, drag the appropriate address types to the correct requirements. Each address type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam a quatre besoins d'adressage public pour des charges de travail dans Azure.

    Que devez-vous utiliser pour chaque besoin ? Pour répondre, faites glisser les types d'adresses appropriés vers les besoins correspondants. Chaque type d'adresse peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: prefix, text: { en: "A public IP prefix", fr: "Un préfixe d'adresse IP publique" } }
    - { id: custom, text: { en: "A custom IP prefix", fr: "Un préfixe d'adresse IP personnalisé" } }
    - { id: global, text: { en: "A Standard public IP address in the Global tier", fr: "Une adresse IP publique Standard de niveau Global" } }
    - { id: single, text: { en: "A single Standard public IP address in the Regional tier", fr: "Une seule adresse IP publique Standard de niveau Régional" } }
    - { id: v2, text: { en: "A Standard v2 public IP address", fr: "Une adresse IP publique Standard v2" } }
  targets:
    - { id: t1, text: { en: "Customers already allow 198.51.100.0/24, a range registered to Fabrikam, in their firewalls", fr: "Des clients autorisent déjà dans leurs pare-feu 198.51.100.0/24, une plage enregistrée au nom de Fabrikam" } }
    - { id: t2, text: { en: "A NAT gateway (Standard SKU) needs 16 outbound addresses that a partner allows with one rule", fr: "Une passerelle NAT (SKU Standard) a besoin de 16 adresses sortantes qu'un partenaire autorise par une seule règle" } }
    - { id: t3, text: { en: "A cross-region load balancer needs a static anycast frontend", fr: "Un équilibreur de charge inter-régions a besoin d'une adresse frontale anycast statique" } }
    - { id: t4, text: { en: "An Application Gateway v2 instance needs one public frontend; no growth is planned", fr: "Une instance Application Gateway v2 a besoin d'une adresse frontale publique ; aucune croissance n'est prévue" } }
answer:
  mapping: { t1: custom, t2: prefix, t3: global, t4: single }
explanation:
  correct:
    en: A custom IP prefix (BYOIP) brings a range that the company owns, so existing allowlists keep working. A public IP prefix gives a contiguous range that a NAT gateway can use whole. A cross-region load balancer needs a Global tier public IP address, which is a static anycast address. A single frontend without growth needs only one regional Standard address.
    fr: |
      Un préfixe d'adresse IP personnalisé (BYOIP) apporte une plage que l'entreprise possède : les listes d'autorisation existantes continuent de fonctionner. Un préfixe d'adresse IP publique fournit une plage contiguë qu'une passerelle NAT peut utiliser entièrement. Un équilibreur de charge inter-régions a besoin d'une adresse IP publique de niveau Global, qui est une adresse anycast statique. Une seule adresse frontale sans croissance n'exige qu'une adresse Standard régionale.
  options:
    v2: { en: "Standard v2 public IP addresses currently work only with a StandardV2 NAT gateway.", fr: "Les adresses IP publiques Standard v2 ne fonctionnent actuellement qu'avec une passerelle NAT StandardV2." }
references:
  - title: Public IP addresses in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses
  - title: Custom IP address prefix (BYOIP)
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/custom-ip-address-prefix
