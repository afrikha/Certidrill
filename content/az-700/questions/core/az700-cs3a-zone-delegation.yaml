id: az700-cs3a-zone-delegation
objective: "1.2.3"
type: single
caseStudy: az700-cs3a-southridge
difficulty: 1
status: draft
stem:
  en: |
    You create a public DNS zone named southridgevideo.com in Azure DNS and import the records from the registrar's DNS service.

    You need to make Azure DNS answer the public queries for the zone. What should you do next?
  fr: |
    Vous créez une zone DNS publique nommée southridgevideo.com dans Azure DNS et vous importez les enregistrements du service DNS du bureau d'enregistrement.

    Vous devez faire en sorte qu'Azure DNS réponde aux requêtes publiques de la zone. Que devez-vous faire ensuite ?
body:
  options:
    - { id: a, text: { en: "At the registrar, replace the name servers of the domain with the four Azure DNS name servers assigned to the zone", fr: "Chez le bureau d'enregistrement, remplacer les serveurs de noms du domaine par les quatre serveurs de noms Azure DNS attribués à la zone" } }
    - { id: b, text: { en: "In the Azure zone, add an NS record set named @ that lists the name servers of the registrar's DNS service", fr: "Dans la zone Azure, ajouter un jeu d'enregistrements NS nommé @ qui liste les serveurs de noms du service DNS du bureau d'enregistrement" } }
    - { id: c, text: { en: "At the registrar, add the first Azure DNS name server of the zone next to the current name servers", fr: "Chez le bureau d'enregistrement, ajouter le premier serveur de noms Azure DNS de la zone à côté des serveurs de noms actuels" } }
    - { id: d, text: { en: "In the Azure zone, edit the SOA record so that its host is the name server of the registrar's DNS service", fr: "Dans la zone Azure, modifier l'enregistrement SOA pour que son hôte soit le serveur de noms du service DNS du bureau d'enregistrement" } }
answer: { optionId: a }
explanation:
  correct:
    en: Azure DNS becomes authoritative when the parent zone (.com) delegates the domain to it, and the registrar stores those NS records in the parent zone. You must use all four name servers that Azure DNS assigned to the zone, which are listed in the zone's NS record set.
    fr: Azure DNS fait autorité pour la zone lorsque la zone parente (.com) lui délègue le domaine, et le bureau d'enregistrement stocke ces enregistrements NS dans la zone parente. Vous devez utiliser les quatre serveurs de noms qu'Azure DNS a attribués à la zone, listés dans le jeu d'enregistrements NS de la zone.
  options:
    b: { en: "NS records inside the Azure zone don't change the delegation in the parent zone, and pointing them to the old provider would not move the zone.", fr: "Des enregistrements NS dans la zone Azure ne modifient pas la délégation dans la zone parente, et les faire pointer vers l'ancien fournisseur ne déplacerait pas la zone." }
    c: { en: "Microsoft requires all four Azure DNS name servers for a delegation; mixing them with the old servers leaves resolvers querying the previous provider.", fr: "Microsoft exige les quatre serveurs de noms Azure DNS pour une délégation ; les mélanger avec les anciens serveurs laisse les résolveurs interroger l'ancien fournisseur." }
    d: { en: "The SOA record describes the zone but doesn't delegate it; resolvers find the authoritative servers through the NS records of the parent zone.", fr: "L'enregistrement SOA décrit la zone mais ne la délègue pas ; les résolveurs trouvent les serveurs faisant autorité grâce aux enregistrements NS de la zone parente." }
references:
  - title: "Tutorial: Host your domain in Azure DNS"
    url: https://learn.microsoft.com/en-us/azure/dns/dns-delegate-domain-azure-dns
