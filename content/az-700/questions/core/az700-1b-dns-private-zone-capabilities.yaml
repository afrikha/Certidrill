id: az700-1b-dns-private-zone-capabilities
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin uses Azure-provided DNS in a virtual network named **VNet1**. The network team considers replacing it with an Azure private DNS zone linked to VNet1.

    Which two capabilities does the private DNS zone provide that Azure-provided DNS doesn't?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin utilise le DNS fourni par Azure dans un réseau virtuel nommé **VNet1**. L'équipe réseau envisage de le remplacer par une zone DNS privée Azure liée à VNet1.

    Quelles sont les deux fonctionnalités qu'apporte la zone DNS privée et que n'offre pas le DNS fourni par Azure ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A domain suffix chosen by Tailspin, such as tailspin.internal", fr: "Un suffixe de domaine choisi par Tailspin, par exemple tailspin.internal" } }
    - { id: b, text: { en: "DNSSEC validation of the answers returned to the virtual machines", fr: "La validation DNSSEC des réponses renvoyées aux machines virtuelles" } }
    - { id: c, text: { en: "Resolution of public internet names from the virtual machines", fr: "La résolution des noms Internet publics depuis les machines virtuelles" } }
    - { id: d, text: { en: "Resolution of on-premises names through the site-to-site VPN, without forwarding", fr: "La résolution des noms locaux à travers le VPN site à site, sans transfert" } }
    - { id: e, text: { en: "Records created manually, such as an A record for an internal load balancer", fr: "Des enregistrements créés manuellement, par exemple un enregistrement A pour un équilibreur de charge interne" } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      Azure-provided DNS uses a suffix that can't be modified and doesn't allow manual records. A private DNS zone uses your own domain name and accepts manual records (A, AAAA, CNAME, MX, PTR, SRV, TXT), for example for resources that autoregistration doesn't cover, such as internal load balancers.
    fr: |
      Le DNS fourni par Azure utilise un suffixe non modifiable et n'autorise pas d'enregistrements manuels. Une zone DNS privée utilise votre propre nom de domaine et accepte des enregistrements manuels (A, AAAA, CNAME, MX, PTR, SRV, TXT), par exemple pour les ressources que l'inscription automatique ne couvre pas, comme les équilibreurs de charge internes.
  options:
    c: { en: "Both resolve public names: a query that doesn't match a linked zone is resolved by Azure DNS as a public name.", fr: "Les deux résolvent les noms publics : une requête qui ne correspond à aucune zone liée est résolue par Azure DNS comme un nom public." }
    d: { en: "Neither forwards queries to on-premises servers; conditional forwarding requires DNS Private Resolver or your own DNS servers.", fr: "Aucun des deux ne transfère de requêtes vers des serveurs locaux ; le transfert conditionnel exige DNS Private Resolver ou vos propres serveurs DNS." }
    b: { en: "The Azure-provided recursive resolver doesn't perform DNSSEC validation, whether or not a private zone is linked.", fr: "Le résolveur récursif fourni par Azure n'effectue pas de validation DNSSEC, qu'une zone privée soit liée ou non." }
references:
  - title: What is Azure Private DNS?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-overview
  - title: Configure DNS name resolution for Azure virtual networks
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-name-resolution-for-vms-and-role-instances
