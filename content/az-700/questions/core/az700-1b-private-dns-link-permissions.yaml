id: az700-1b-private-dns-link-permissions
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has two subscriptions in the same Microsoft Entra tenant:

    | Subscription | Resource |
    | --- | --- |
    | Sub1 | Private DNS zone **corp.contoso.internal** in the resource group RG-DNS |
    | Sub2 | Virtual network **VNet3** in the resource group RG-App |

    A user named **Admin1** has the Private DNS Zone Contributor role on RG-DNS and the Reader role on RG-App. Admin1 tries to link corp.contoso.internal to VNet3, and the operation fails with an authorization error.

    You need Admin1 to be able to create the link. The solution must follow the principle of least privilege.

    Which role should you assign to Admin1?
  fr: |
    Contoso dispose de deux abonnements dans le même locataire Microsoft Entra :

    | Abonnement | Ressource |
    | --- | --- |
    | Sub1 | Zone DNS privée **corp.contoso.internal** dans le groupe de ressources RG-DNS |
    | Sub2 | Réseau virtuel **VNet3** dans le groupe de ressources RG-App |

    Un utilisateur nommé **Admin1** a le rôle Private DNS Zone Contributor sur RG-DNS et le rôle Reader sur RG-App. Admin1 tente de lier corp.contoso.internal à VNet3, et l'opération échoue avec une erreur d'autorisation.

    Vous devez faire en sorte qu'Admin1 puisse créer le lien. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à Admin1 ?
body:
  options:
    - id: a
      text: { en: "Contributor on Sub2", fr: "Contributor sur Sub2" }
    - id: b
      text: { en: "DNS Zone Contributor on RG-DNS", fr: "DNS Zone Contributor sur RG-DNS" }
    - id: c
      text: { en: "Private DNS Zone Contributor on Sub2", fr: "Private DNS Zone Contributor sur Sub2" }
    - id: d
      text: { en: "Network Contributor on VNet3", fr: "Network Contributor sur VNet3" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Linking a private DNS zone to a virtual network in another subscription is supported, but it requires write permission on both the zone and the virtual network. Admin1 already has it on the zone; Network Contributor scoped to VNet3 adds the missing permission on the virtual network and nothing more.
    fr: |
      La liaison d'une zone DNS privée à un réseau virtuel d'un autre abonnement est prise en charge, mais elle exige une autorisation en écriture sur la zone et sur le réseau virtuel. Admin1 l'a déjà sur la zone ; Network Contributor limité à VNet3 ajoute l'autorisation manquante sur le réseau virtuel, sans rien de plus.
  options:
    b: { en: "DNS Zone Contributor manages public DNS zones, and Admin1 already has the required permission on the private zone.", fr: "DNS Zone Contributor gère les zones DNS publiques, et Admin1 a déjà l'autorisation requise sur la zone privée." }
    c: { en: "Private DNS Zone Contributor grants permissions on private zones, not on the virtual network.", fr: "Private DNS Zone Contributor accorde des autorisations sur les zones privées, pas sur le réseau virtuel." }
    a: { en: "Contributor on the whole subscription would work but grants far more than needed.", fr: "Contributor sur tout l'abonnement fonctionnerait mais accorde bien plus que nécessaire." }
references:
  - title: Azure Private DNS FAQ
    url: https://learn.microsoft.com/en-us/azure/dns/dns-faq-private
