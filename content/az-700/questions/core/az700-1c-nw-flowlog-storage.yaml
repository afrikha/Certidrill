id: az700-1c-nw-flowlog-storage
objective: "1.4.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a virtual network named **VNet1** in North Europe, in a subscription named **Sub-Prod**. All the logs of the company must be stored in storage accounts of a subscription named **Sub-Logs**. Both subscriptions are in the same Microsoft Entra tenant.

    You plan to enable a virtual network flow log on VNet1 and to select a new storage account to receive the flow log data.

    Which two requirements must the storage account meet?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un réseau virtuel nommé **VNet1** dans la région North Europe, dans un abonnement nommé **Sub-Prod**. Tous les journaux de l'entreprise doivent être stockés dans des comptes de stockage d'un abonnement nommé **Sub-Logs**. Les deux abonnements font partie du même locataire Microsoft Entra.

    Vous prévoyez d'activer un journal de flux de réseau virtuel sur VNet1 et de sélectionner un nouveau compte de stockage pour recevoir les données du journal de flux.

    Quelles sont les deux exigences que le compte de stockage doit respecter ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It must be in the North Europe region.", fr: "Il doit se trouver dans la région North Europe." } }
    - { id: b, text: { en: "It must use the Standard performance tier.", fr: "Il doit utiliser le niveau de performance Standard." } }
    - { id: c, text: { en: "It must be in the same resource group as VNet1.", fr: "Il doit se trouver dans le même groupe de ressources que VNet1." } }
    - { id: d, text: { en: "It must be in Sub-Prod.", fr: "Il doit se trouver dans Sub-Prod." } }
    - { id: e, text: { en: "It must use the Premium performance tier with block blobs.", fr: "Il doit utiliser le niveau de performance Premium avec des objets blob de blocs." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: The storage account of a virtual network flow log must be in the same region as the virtual network, and Premium storage accounts aren't supported, so it must use the Standard performance tier. It can be in the same subscription as the virtual network or in another subscription associated with the same Microsoft Entra tenant, so Sub-Logs is allowed.
    fr: "Le compte de stockage d'un journal de flux de réseau virtuel doit se trouver dans la même région que le réseau virtuel, et les comptes de stockage Premium ne sont pas pris en charge : il doit donc utiliser le niveau de performance Standard. Il peut se trouver dans le même abonnement que le réseau virtuel ou dans un autre abonnement associé au même locataire Microsoft Entra : Sub-Logs est donc autorisé."
  options:
    c: { en: "The resource group of the storage account doesn't matter.", fr: "Le groupe de ressources du compte de stockage n'a pas d'importance." }
    d: { en: "Another subscription of the same Microsoft Entra tenant, such as Sub-Logs, is supported.", fr: "Un autre abonnement du même locataire Microsoft Entra, comme Sub-Logs, est pris en charge." }
    e: { en: "Premium storage accounts aren't supported for flow logs.", fr: "Les comptes de stockage Premium ne sont pas pris en charge pour les journaux de flux." }
references:
  - title: Virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
