id: az700-1c-rt-effective-routes-view
objective: "1.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a virtual machine named **VM1** that runs in a subnet named **Subnet1**. Subnet1 is associated with a route table named **RT1**. The virtual network of VM1 is peered with a hub that contains an ExpressRoute gateway, and the hub peering uses the remote gateway.

    Users report that VM1 cannot reach an on-premises server. You need to review the complete list of routes that apply to VM1, including the system routes, the routes learned over BGP and the user-defined routes.

    What should you use?
  fr: |
    Adatum dispose d'une machine virtuelle nommée **VM1** qui s'exécute dans un sous-réseau nommé **Subnet1**. Subnet1 est associé à une table de routage nommée **RT1**. Le réseau virtuel de VM1 a un peering avec un hub qui contient une passerelle ExpressRoute, et ce peering utilise la passerelle distante.

    Des utilisateurs signalent que VM1 ne peut pas joindre un serveur local. Vous devez examiner la liste complète des itinéraires qui s'appliquent à VM1, y compris les itinéraires système, les itinéraires appris par BGP et les itinéraires définis par l'utilisateur.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "The Routes page of RT1", fr: "La page Routes de RT1" }
    - id: b
      text: { en: "The Effective routes page of the network interface of VM1", fr: "La page Itinéraires effectifs de l'interface réseau de VM1" }
    - id: c
      text: { en: "The Effective security rules page of the network interface of VM1", fr: "La page Règles de sécurité effectives de l'interface réseau de VM1" }
    - id: d
      text: { en: "The Peerings page of the virtual network of VM1", fr: "La page Peerings du réseau virtuel de VM1" }
answer: { optionId: b }
explanation:
  correct:
    en: Effective routes are shown per network interface and combine the default system routes, the routes propagated over BGP by the virtual network gateway and the user-defined routes, keeping only the routes that apply. The VM must be running for the list to be returned. The same data is available with `az network nic show-effective-route-table` or `Get-AzEffectiveRouteTable`.
    fr: "Les itinéraires effectifs s'affichent par interface réseau et combinent les itinéraires système par défaut, les itinéraires propagés par BGP par la passerelle de réseau virtuel et les itinéraires définis par l'utilisateur, en ne gardant que ceux qui s'appliquent. La machine virtuelle doit être en cours d'exécution pour que la liste soit renvoyée. Les mêmes données sont disponibles avec `az network nic show-effective-route-table` ou `Get-AzEffectiveRouteTable`."
  options:
    a: { en: "A route table only lists the user-defined routes it contains, not the system or BGP routes.", fr: "Une table de routage ne liste que les itinéraires définis par l'utilisateur qu'elle contient, pas les itinéraires système ni BGP." }
    c: { en: "Effective security rules show the NSG rules that filter traffic, not the routes.", fr: "Les règles de sécurité effectives montrent les règles NSG qui filtrent le trafic, pas les itinéraires." }
    d: { en: "The peering page shows the peering status and settings, not the routes applied to the network interface.", fr: "La page de peering affiche l'état et les paramètres du peering, pas les itinéraires appliqués à l'interface réseau." }
references:
  - title: Diagnose a virtual machine routing problem
    url: https://learn.microsoft.com/en-us/azure/virtual-network/diagnose-network-routing-problem
