id: az700-1a-12-hub-subnet-blockers
objective: "1.1.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank prepared the subnets of a hub virtual network named VNet-Hub (10.100.0.0/22). Route tables have these routes:

    - RT-Hub: 0.0.0.0/0, next hop type **Virtual appliance**, next hop address 10.100.0.68
    - RT-FW: 0.0.0.0/0, next hop type **Internet**

    You plan to deploy a zone-redundant VPN gateway (VpnGw2AZ), Azure Firewall, Azure Bastion and Azure Route Server. Two settings in the table will make deployments fail.

    Answer each prompt by selecting the setting that you must change.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank a préparé les sous-réseaux d'un réseau virtuel hub nommé VNet-Hub (10.100.0.0/22). Les tables de routage contiennent ces itinéraires :

    - RT-Hub : 0.0.0.0/0, type de tronçon suivant **Appliance virtuelle**, adresse du tronçon suivant 10.100.0.68
    - RT-FW : 0.0.0.0/0, type de tronçon suivant **Internet**

    Vous prévoyez de déployer une passerelle VPN redondante interzone (VpnGw2AZ), le Pare-feu Azure, Azure Bastion et Azure Route Server. Deux paramètres du tableau feront échouer des déploiements.

    Répondez à chaque consigne en sélectionnant le paramètre que vous devez modifier.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Setting to change before you deploy the VPN gateway", fr: "Paramètre à modifier avant de déployer la passerelle VPN" }
    - id: p2
      text: { en: "Setting to change before you deploy Azure Route Server", fr: "Paramètre à modifier avant de déployer Azure Route Server" }
  grid:
    header: [{ en: "Subnet", fr: "Sous-réseau" }, { en: "Address range", fr: "Plage d'adresses" }, { en: "Route table", fr: "Table de routage" }]
    rows:
      - [{ text: GatewaySubnet }, { text: 10.100.0.0/27, area: gw-range }, { text: RT-Hub, area: gw-rt }]
      - [{ text: AzureFirewallSubnet }, { text: 10.100.0.64/26, area: fw-range }, { text: RT-FW, area: fw-rt }]
      - [{ text: AzureBastionSubnet }, { text: 10.100.0.128/26, area: bas-range }, { text: { en: "None", fr: "Aucune" } }]
      - [{ text: RouteServerSubnet }, { text: 10.100.0.192/27, area: rs-range }, { text: { en: "None", fr: "Aucune" } }]
answer:
  values: { p1: gw-rt, p2: rs-range }
explanation:
  correct:
    en: |
      A user-defined route for 0.0.0.0/0 isn't supported on GatewaySubnet, so RT-Hub must be removed from it; /27 is the right minimum size for a VpnGw2AZ gateway. RouteServerSubnet must be /26 or larger, so its /27 range must be changed. A 0.0.0.0/0 route with the next hop Internet on AzureFirewallSubnet is a supported configuration, and AzureFirewallSubnet and AzureBastionSubnet are /26 as required.
    fr: |
      Un itinéraire défini par l'utilisateur pour 0.0.0.0/0 n'est pas pris en charge sur GatewaySubnet : RT-Hub doit en être dissocié ; /27 est bien la taille minimale pour une passerelle VpnGw2AZ. RouteServerSubnet doit être en /26 ou plus grand : sa plage /27 doit être modifiée. Un itinéraire 0.0.0.0/0 avec le tronçon suivant Internet sur AzureFirewallSubnet est une configuration prise en charge, et AzureFirewallSubnet et AzureBastionSubnet sont en /26 comme exigé.
references:
  - title: About VPN Gateway configuration settings
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-gateway-settings
  - title: "Quickstart: Create an Azure Route Server using Azure portal"
    url: https://learn.microsoft.com/en-us/azure/route-server/quickstart-create-route-server-portal
