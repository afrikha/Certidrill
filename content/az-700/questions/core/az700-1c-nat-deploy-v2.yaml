id: az700-1c-nat-deploy-v2
objective: "1.3.10"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove has a virtual network named **VNet1** in Sweden Central. VNet1 contains a subnet named **Workers** whose virtual machines have no public IP addresses.

    You need to provide outbound internet connectivity for the Workers subnet by using Azure NAT Gateway. The NAT gateway must remain available if an availability zone fails.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove dispose d'un réseau virtuel nommé **VNet1** dans la région Sweden Central. VNet1 contient un sous-réseau nommé **Workers** dont les machines virtuelles n'ont pas d'adresse IP publique.

    Vous devez fournir une connectivité sortante vers Internet au sous-réseau Workers à l'aide d'Azure NAT Gateway. La passerelle NAT doit rester disponible en cas de panne d'une zone de disponibilité.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: pip, text: { en: "Create a public IP address that uses the StandardV2 SKU.", fr: "Créer une adresse IP publique qui utilise la référence SKU StandardV2." } }
    - { id: natgw, text: { en: "Create a StandardV2 NAT gateway that uses the new public IP address.", fr: "Créer une passerelle NAT StandardV2 qui utilise la nouvelle adresse IP publique." } }
    - { id: assoc, text: { en: "Associate the NAT gateway with the Workers subnet.", fr: "Associer la passerelle NAT au sous-réseau Workers." } }
    - { id: pipstd, text: { en: "Create a public IP address that uses the Standard SKU in zone 1.", fr: "Créer une adresse IP publique qui utilise la référence SKU Standard dans la zone 1." } }
    - { id: route, text: { en: "Create a route table with a 0.0.0.0/0 route to the NAT gateway and associate it with Workers.", fr: "Créer une table de routage avec un itinéraire 0.0.0.0/0 vers la passerelle NAT et l'associer à Workers." } }
    - { id: gwsub, text: { en: "Associate the NAT gateway with GatewaySubnet.", fr: "Associer la passerelle NAT à GatewaySubnet." } }
answer:
  sequence: [ pip, natgw, assoc ]
explanation:
  correct:
    en: |
      Zone resiliency requires the StandardV2 NAT gateway, which works only with StandardV2 public IP addresses or prefixes. You create the public IP address, create the NAT gateway that uses it, and associate the NAT gateway with the subnet. The NAT gateway then becomes the default path to the internet for the subnet, with no route table required.
    fr: |
      La résilience aux pannes de zone exige une passerelle NAT StandardV2, qui ne fonctionne qu'avec des adresses ou préfixes d'adresse IP publique StandardV2. Vous créez l'adresse IP publique, puis la passerelle NAT qui l'utilise, et vous associez la passerelle NAT au sous-réseau. La passerelle NAT devient alors le chemin par défaut du sous-réseau vers Internet, sans table de routage.
  options:
    pipstd: { en: "A StandardV2 NAT gateway doesn't support Standard SKU public IP addresses, and a Standard NAT gateway is zonal.", fr: "Une passerelle NAT StandardV2 ne prend pas en charge les adresses IP publiques de référence SKU Standard, et une passerelle NAT Standard est zonale." }
    route: { en: "No route is needed, and a NAT gateway is not a next hop type you can use in a user-defined route.", fr: "Aucun itinéraire n'est nécessaire, et une passerelle NAT n'est pas un type de tronçon suivant utilisable dans un itinéraire défini par l'utilisateur." }
    gwsub: { en: "A NAT gateway can't be associated with a gateway subnet, and the requirement concerns Workers.", fr: "Une passerelle NAT ne peut pas être associée à un sous-réseau de passerelle, et l'exigence concerne Workers." }
references:
  - title: What is Azure NAT Gateway?
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
  - title: NAT gateway resource
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-gateway-resource
