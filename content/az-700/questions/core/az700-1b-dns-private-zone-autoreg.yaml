id: az700-1b-dns-private-zone-autoreg
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has two virtual networks in the same subscription:

    | Name | Region | Address space | DNS servers |
    | --- | --- | --- | --- |
    | VNet1 | West Europe | 10.1.0.0/16 | Default (Azure-provided) |
    | VNet2 | North Europe | 10.2.0.0/16 | Default (Azure-provided) |

    VNet1 and VNet2 are peered. Virtual machines are created and deleted in both virtual networks every week.

    You need to ensure that every virtual machine can resolve the name of any other virtual machine in both virtual networks by using the domain suffix `fabrikam.internal`. Records must be created and removed automatically. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Fabrikam dispose de deux réseaux virtuels dans le même abonnement :

    | Nom | Région | Espace d'adressage | Serveurs DNS |
    | --- | --- | --- | --- |
    | VNet1 | West Europe | 10.1.0.0/16 | Par défaut (fourni par Azure) |
    | VNet2 | North Europe | 10.2.0.0/16 | Par défaut (fourni par Azure) |

    Un peering relie VNet1 et VNet2. Des machines virtuelles sont créées et supprimées chaque semaine dans les deux réseaux virtuels.

    Vous devez faire en sorte que chaque machine virtuelle puisse résoudre le nom de n'importe quelle autre machine virtuelle des deux réseaux virtuels avec le suffixe de domaine `fabrikam.internal`. Les enregistrements doivent être créés et supprimés automatiquement. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a private DNS zone fabrikam.internal linked to both networks with autoregistration.", fr: "Créer une zone DNS privée fabrikam.internal liée aux deux réseaux avec l'inscription automatique." }
    - id: b
      text: { en: "Keep Azure-provided DNS and enable Allow forwarded traffic on both peerings between VNet1 and VNet2.", fr: "Conserver le DNS fourni par Azure et activer l'autorisation du trafic transféré sur les deux peerings entre VNet1 et VNet2." }
    - id: c
      text: { en: "Deploy Azure DNS Private Resolver in VNet1 and set the DNS servers of VNet2 to its inbound endpoint.", fr: "Déployer Azure DNS Private Resolver dans VNet1 et définir les serveurs DNS de VNet2 sur son point de terminaison entrant." }
    - id: d
      text: { en: "Create a public DNS zone named fabrikam.internal and add an A record for each virtual machine.", fr: "Créer une zone DNS publique nommée fabrikam.internal et y ajouter un enregistrement A pour chaque machine virtuelle." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A private DNS zone provides the custom suffix, and every virtual network linked to it resolves its records, whatever the region. With autoregistration enabled on both links, Azure creates an A record when a virtual machine is deployed and removes it when the machine is deleted or stopped, so there is nothing to maintain.
    fr: |
      Une zone DNS privée fournit le suffixe personnalisé, et chaque réseau virtuel qui lui est lié résout ses enregistrements, quelle que soit la région. Avec l'inscription automatique activée sur les deux liens, Azure crée un enregistrement A au déploiement d'une machine virtuelle et le supprime quand la machine est supprimée ou arrêtée : il n'y a rien à maintenir.
  options:
    b: { en: "Azure-provided name resolution is scoped to one virtual network and has no custom suffix; peering settings don't change name resolution.", fr: "La résolution de noms fournie par Azure est limitée à un réseau virtuel et n'a pas de suffixe personnalisé ; les paramètres de peering ne changent pas la résolution de noms." }
    c: { en: "A resolver forwards queries but hosts no zone and registers no records; the fabrikam.internal names would still not exist.", fr: "Un résolveur transfère les requêtes mais n'héberge aucune zone et n'inscrit aucun enregistrement : les noms fabrikam.internal n'existeraient toujours pas." }
    d: { en: "A public zone publishes private addresses on the internet and its records must be maintained manually.", fr: "Une zone publique publie des adresses privées sur Internet, et ses enregistrements doivent être gérés manuellement." }
references:
  - title: What is the autoregistration feature in Azure DNS private zones?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-autoregistration
  - title: What is Azure Private DNS?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-overview
