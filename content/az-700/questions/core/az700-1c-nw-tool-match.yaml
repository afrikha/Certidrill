id: az700-1c-nw-tool-match
objective: "1.4.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    The network operations team of Fabrikam must troubleshoot four issues in an Azure environment.

    Which Network Watcher tool should the team use for each issue? To answer, drag the appropriate tools to the correct issues. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe d'exploitation réseau de Fabrikam doit résoudre quatre problèmes dans un environnement Azure.

    Quel outil Network Watcher l'équipe doit-elle utiliser pour chaque problème ? Pour répondre, faites glisser les outils appropriés vers les problèmes correspondants. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: hop, text: { en: "Next hop", fr: "Tronçon suivant" } }
    - { id: pcap, text: { en: "Packet capture", fr: "Capture de paquets" } }
    - { id: vpn, text: { en: "VPN troubleshoot", fr: "Résolution des problèmes de VPN" } }
    - { id: nsgd, text: { en: "NSG diagnostics", fr: "Diagnostics NSG" } }
    - { id: ipfv, text: { en: "IP flow verify", fr: "Vérification des flux IP" } }
    - { id: cm, text: { en: "Connection monitor", fr: "Moniteur de connexion" } }
  targets:
    - id: t1
      text: { en: "Find which route table sends traffic from VM1 to 10.50.1.1 to an unexpected appliance.", fr: "Trouver quelle table de routage envoie le trafic de VM1 vers 10.50.1.1 à une appliance inattendue." }
    - id: t2
      text: { en: "Record the packets exchanged between VM2 and a database server to analyze them in a protocol analyzer.", fr: "Enregistrer les paquets échangés entre VM2 et un serveur de base de données pour les analyser dans un analyseur de protocole." }
    - id: t3
      text: { en: "Collect IKE logs to find why a site-to-site connection of a route-based VPN gateway stays disconnected.", fr: "Collecter les journaux IKE pour savoir pourquoi une connexion de site à site d'une passerelle VPN basée sur des routes reste déconnectée." }
    - id: t4
      text: { en: "Check whether NSG rules allow ICMP from VM3 to the instances of a virtual machine scale set.", fr: "Vérifier si les règles NSG autorisent ICMP depuis VM3 vers les instances d'un groupe de machines virtuelles identiques." }
answer:
  mapping: { t1: hop, t2: pcap, t3: vpn, t4: nsgd }
explanation:
  correct:
    en: Next hop returns the next hop type, IP address and route table ID for a destination. Packet capture records the traffic of a VM or scale set to a file. VPN troubleshoot diagnoses a virtual network gateway or connection and stores logs such as IKE logs in a storage account. NSG diagnostics evaluates NSG rules for VMs, network interfaces, scale set network interfaces and application gateways v2, and it supports ICMP. IP flow verify only tests TCP and UDP on a VM's network interface, and Connection monitor tracks connectivity over time.
    fr: "Tronçon suivant renvoie le type de tronçon suivant, l'adresse IP et l'ID de la table de routage pour une destination. La capture de paquets enregistre le trafic d'une machine virtuelle ou d'un groupe identique dans un fichier. La résolution des problèmes de VPN diagnostique une passerelle de réseau virtuel ou une connexion et stocke des journaux, comme les journaux IKE, dans un compte de stockage. Les diagnostics NSG évaluent les règles NSG pour les machines virtuelles, les interfaces réseau, les interfaces réseau de groupes identiques et les passerelles d'application v2, et prennent en charge ICMP. La vérification des flux IP ne teste que TCP et UDP sur l'interface réseau d'une machine virtuelle, et le Moniteur de connexion suit la connectivité dans la durée."
references:
  - title: What is Azure Network Watcher?
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview
  - title: IP flow verify overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview
