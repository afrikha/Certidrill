id: az700-cs2a-megeve-diagnostics
objective: "1.4.2"
type: single
caseStudy: az700-cs2a-alpine-ski-house
difficulty: 1
status: draft
stem:
  en: |
    You need to identify why the IPsec tunnel of cn-megeve doesn't establish. The solution must meet the requirements for VPN diagnostics.

    What should you use?
  fr: |
    Vous devez identifier pourquoi le tunnel IPsec de cn-megeve ne s'établit pas. La solution doit respecter les exigences relatives au diagnostic VPN.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Network Watcher connection troubleshoot from VM-BOOK1 to the public IP address of the Megève firewall", fr: "La résolution des problèmes de connexion de Network Watcher depuis VM-BOOK1 vers l'adresse IP publique du pare-feu de Megève" } }
    - { id: b, text: { en: "Network Watcher IP flow verify on the network interface of VM-BOOK1", fr: "La vérification des flux IP de Network Watcher sur l'interface réseau de VM-BOOK1" } }
    - { id: c, text: { en: "Network Watcher VPN troubleshoot on the connection cn-megeve", fr: "La résolution des problèmes VPN de Network Watcher sur la connexion cn-megeve" } }
    - { id: d, text: { en: "The effective routes of the network interface of VM-BOOK1", fr: "Les itinéraires effectifs de l'interface réseau de VM-BOOK1" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      VPN troubleshoot diagnoses the health of a virtual network gateway or of one of its connections and returns fault types such as an authentication (preshared key) mismatch or an unsupported IKE policy, with recommended actions. It also stores IKE logs in a storage account. It supports route-based VPN gateways such as VGW-Hub and IPsec connections such as cn-megeve.
    fr: |
      La résolution des problèmes VPN diagnostique l'intégrité d'une passerelle de réseau virtuel ou de l'une de ses connexions et renvoie des types d'erreur, comme une clé prépartagée qui ne correspond pas ou une stratégie IKE non prise en charge, avec des actions recommandées. Elle stocke aussi les journaux IKE dans un compte de stockage. Elle prend en charge les passerelles VPN basées sur des routes comme VGW-Hub et les connexions IPsec comme cn-megeve.
  options:
    a: { en: "Connection troubleshoot tests reachability from a virtual machine to an endpoint; it doesn't analyze the IKE negotiation of a gateway connection.", fr: "La résolution des problèmes de connexion teste l'accessibilité d'un point de terminaison depuis une machine virtuelle ; elle n'analyse pas la négociation IKE d'une connexion de passerelle." }
    b: { en: "IP flow verify checks whether NSG rules allow or deny a flow for a virtual machine; the tunnel is negotiated by the gateway, not by VM-BOOK1.", fr: "La vérification des flux IP indique si les règles de NSG autorisent ou refusent un flux pour une machine virtuelle ; le tunnel est négocié par la passerelle, pas par VM-BOOK1." }
    d: { en: "Effective routes show the next hops of a network interface; they can't explain why the tunnel doesn't establish.", fr: "Les itinéraires effectifs indiquent les tronçons suivants d'une interface réseau ; ils ne peuvent pas expliquer pourquoi le tunnel ne s'établit pas." }
references:
  - title: VPN troubleshoot overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vpn-troubleshoot-overview
