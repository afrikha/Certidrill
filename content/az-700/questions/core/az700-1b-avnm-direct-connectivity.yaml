id: az700-1b-avnm-direct-connectivity
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Azure Virtual Network Manager. A deployed hub-and-spoke connectivity configuration named **CC1** uses **VNet-Hub** as the hub and a network group named **NG-Apps** as the spokes. NG-Apps contains 12 virtual networks in North Europe. VNet-Hub contains a VPN gateway that the spokes use.

    The virtual networks of NG-Apps must communicate with each other directly, without traffic going through VNet-Hub. They must keep their connectivity to VNet-Hub and to its VPN gateway. You must change only CC1.

    What should you do?
  fr: |
    Fabrikam utilise Azure Virtual Network Manager. Une configuration de connectivité hub-and-spoke déployée, nommée **CC1**, utilise **VNet-Hub** comme hub et un groupe réseau nommé **NG-Apps** comme spokes. NG-Apps contient 12 réseaux virtuels en North Europe. VNet-Hub contient une passerelle VPN que les spokes utilisent.

    Les réseaux virtuels de NG-Apps doivent communiquer directement entre eux, sans que le trafic passe par VNet-Hub. Ils doivent conserver leur connectivité avec VNet-Hub et sa passerelle VPN. Vous ne devez modifier que CC1.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Change the topology of CC1 to Mesh, add VNet-Hub to NG-Apps, and deploy CC1.", fr: "Passer la topologie de CC1 en maillage, ajouter VNet-Hub à NG-Apps et déployer CC1." }
    - id: b
      text: { en: "Enable Use hub as a gateway for NG-Apps in CC1, and deploy CC1.", fr: "Activer Use hub as a gateway pour NG-Apps dans CC1, puis déployer CC1." }
    - id: c
      text: { en: "Enable direct connectivity for NG-Apps in CC1, and deploy CC1.", fr: "Activer la connectivité directe pour NG-Apps dans CC1, puis déployer CC1." }
    - id: d
      text: { en: "Enable Delete existing peerings in CC1, and deploy CC1.", fr: "Activer Delete existing peerings dans CC1, puis déployer CC1." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Direct connectivity, enabled per spoke network group in a hub-and-spoke configuration, creates a connected group in which the spoke virtual networks communicate directly. The hub-and-spoke peerings, including the use of the hub gateway, stay in place, and the change takes effect when you deploy CC1 again.
    fr: |
      La connectivité directe, activée par groupe réseau spoke dans une configuration hub-and-spoke, crée un groupe connecté dans lequel les réseaux virtuels spokes communiquent directement. Les peerings hub-and-spoke, y compris l'utilisation de la passerelle du hub, restent en place, et la modification s'applique quand vous déployez de nouveau CC1.
  options:
    a: { en: "A mesh has no hub, so the spokes would lose the use of the VPN gateway of VNet-Hub.", fr: "Un maillage n'a pas de hub : les spokes perdraient l'utilisation de la passerelle VPN de VNet-Hub." }
    b: { en: "Use hub as a gateway lets spokes use the hub's VPN or ExpressRoute gateway, which they already do; it adds no spoke-to-spoke path.", fr: "Use hub as a gateway permet aux spokes d'utiliser la passerelle VPN ou ExpressRoute du hub, ce qu'ils font déjà ; il n'ajoute aucun chemin entre spokes." }
    d: { en: "This option removes peerings that don't match the configuration; it creates no connectivity between spokes.", fr: "Cette option supprime les peerings qui ne correspondent pas à la configuration ; elle ne crée aucune connectivité entre spokes." }
references:
  - title: Connectivity configurations in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-connectivity-configuration
