id: az700-1a-20-resolver-subnets
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum is deploying an Azure DNS Private Resolver in a hub virtual network named VNet-Hub. The resolver needs one inbound endpoint and one outbound endpoint. VNet-Hub has the IPv4 address space 10.0.0.0/22, of which 10.0.2.0/24 is free. The network team wants to keep as much of the free range as possible for future services.

    Which subnet plan should you use?
  fr: |
    Adatum déploie un Azure DNS Private Resolver dans un réseau virtuel hub nommé VNet-Hub. Le résolveur a besoin d'un point de terminaison entrant et d'un point de terminaison sortant. VNet-Hub a l'espace d'adressage IPv4 10.0.0.0/22, dont la plage 10.0.2.0/24 est libre. L'équipe réseau veut conserver le plus possible de la plage libre pour de futurs services.

    Quel plan de sous-réseaux devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: One /27 subnet delegated to Microsoft.Network/dnsResolvers, used by both endpoints
        fr: Un sous-réseau /27 délégué à Microsoft.Network/dnsResolvers, utilisé par les deux points de terminaison
    - id: b
      text:
        en: Two /29 subnets, each delegated to Microsoft.Network/dnsResolvers, one per endpoint
        fr: Deux sous-réseaux /29, chacun délégué à Microsoft.Network/dnsResolvers, un par point de terminaison
    - id: c
      text:
        en: Two /28 subnets, each delegated to Microsoft.Network/dnsResolvers, one per endpoint
        fr: Deux sous-réseaux /28, chacun délégué à Microsoft.Network/dnsResolvers, un par point de terminaison
    - id: d
      text:
        en: One /28 subnet delegated to Microsoft.Network/dnsResolvers for the inbound endpoint, and the outbound endpoint in the existing subnet of the DNS forwarder VMs
        fr: Un sous-réseau /28 délégué à Microsoft.Network/dnsResolvers pour le point de terminaison entrant, et le point de terminaison sortant dans le sous-réseau existant des machines virtuelles de redirecteurs DNS
answer: { optionId: c }
explanation:
  correct:
    en: Each resolver endpoint needs its own subnet, delegated to Microsoft.Network/dnsResolvers, with no other service in it. The subnet size must be between /28 and /24, so two /28 subnets use the least address space.
    fr: |
      Chaque point de terminaison du résolveur a besoin de son propre sous-réseau, délégué à Microsoft.Network/dnsResolvers, sans aucun autre service. La taille du sous-réseau doit être comprise entre /28 et /24 : deux sous-réseaux /28 consomment le moins d'espace d'adressage.
  options:
    a: { en: "Two resolver endpoints can't share a subnet.", fr: "Deux points de terminaison de résolveur ne peuvent pas partager un sous-réseau." }
    b: { en: "/28 is the smallest subnet size accepted for a resolver endpoint.", fr: "/28 est la plus petite taille de sous-réseau acceptée pour un point de terminaison de résolveur." }
    d: { en: "A resolver subnet must be delegated and must not contain other resources, such as virtual machines.", fr: "Un sous-réseau de résolveur doit être délégué et ne doit pas contenir d'autres ressources, par exemple des machines virtuelles." }
references:
  - title: What is Azure DNS Private Resolver?
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
