id: az700-1a-40-byoip-derived-rules
objective: "1.1.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a commissioned custom IP prefix named cip-wgb (203.0.113.0/24) in subscription Sub-Net. A public IP prefix named ippre-app (/26) was derived from cip-wgb, and three public IP addresses created from ippre-app are attached to virtual machines.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un préfixe d'adresse IP personnalisé mis en service nommé cip-wgb (203.0.113.0/24) dans l'abonnement Sub-Net. Un préfixe d'adresse IP publique nommé ippre-app (/26) a été dérivé de cip-wgb, et trois adresses IP publiques créées à partir d'ippre-app sont attachées à des machines virtuelles.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A team that has the required permissions can derive another public IP prefix from cip-wgb in a different subscription.
        fr: Une équipe disposant des autorisations nécessaires peut dériver un autre préfixe d'adresse IP publique de cip-wgb dans un autre abonnement.
    - id: s2
      text:
        en: You can create a public IP address with routing preference Internet from ippre-app.
        fr: Vous pouvez créer à partir d'ippre-app une adresse IP publique avec la préférence de routage Internet.
    - id: s3
      text:
        en: To decommission cip-wgb, you must first delete ippre-app.
        fr: Pour mettre hors service cip-wgb, vous devez d'abord supprimer ippre-app.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: A public IP prefix can be derived from a custom IP prefix in another subscription with the proper permissions. Addresses derived from a custom IP prefix support neither routing preference Internet nor the Global tier. Decommissioning fails while public IP prefixes derived from the custom IP prefix still exist, so they are deleted first.
    fr: |
      Un préfixe d'adresse IP publique peut être dérivé d'un préfixe personnalisé dans un autre abonnement avec les autorisations appropriées. Les adresses dérivées d'un préfixe personnalisé ne prennent en charge ni la préférence de routage Internet ni le niveau Global. La mise hors service échoue tant que des préfixes d'adresses IP publiques dérivés du préfixe personnalisé existent : ils sont supprimés en premier.
references:
  - title: Custom IP address prefix (BYOIP)
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/custom-ip-address-prefix
  - title: Manage a custom IP address prefix
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/manage-custom-ip-address-prefix
