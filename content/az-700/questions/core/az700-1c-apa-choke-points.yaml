id: az700-1c-apa-choke-points
objective: "1.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam uses Defender CSPM. Before a network hardening sprint, the security architect wants a view that shows the top five choke points, the top entry points and the top targets of the attack paths, and that lets the team filter the paths by risk level and remediation status.

    Where should the architect go?
  fr: |
    Fabrikam utilise Defender CSPM. Avant un sprint de renforcement réseau, l'architecte sécurité souhaite une vue qui affiche les cinq principaux points d'étranglement (choke points), les principaux points d'entrée et les principales cibles des chemins d'attaque, et qui permette à l'équipe de filtrer les chemins par niveau de risque et par état de correction.

    Où l'architecte doit-il aller ?
body:
  options:
    - id: a
      text: { en: "Microsoft Defender portal: Exposure Management > Attack surface > Attack paths", fr: "Portail Microsoft Defender : Exposure Management > Attack surface > Attack paths" }
    - id: b
      text: { en: "Azure portal: Microsoft Defender for Cloud > Cloud security explorer", fr: "Portail Azure : Microsoft Defender for Cloud > Cloud security explorer" }
    - id: c
      text: { en: "Azure portal: Microsoft Defender for Cloud > Recommendations", fr: "Portail Azure : Microsoft Defender for Cloud > Recommendations" }
    - id: d
      text: { en: "Azure portal: Network Watcher > Topology", fr: "Portail Azure : Network Watcher > Topology" }
answer: { optionId: a }
explanation:
  correct:
    en: In the Defender portal, attack path analysis is part of Exposure Management. Its Overview tab shows attack paths over time, the top five choke points, top attack path scenarios, top targets and top entry points; the Attack paths list can be filtered by risk level, asset type, remediation status and time frame.
    fr: "Dans le portail Defender, l'analyse du chemin d'attaque fait partie d'Exposure Management. Son onglet Overview affiche l'évolution des chemins d'attaque, les cinq principaux points d'étranglement, les principaux scénarios, cibles et points d'entrée ; la liste Attack paths peut être filtrée par niveau de risque, type de ressource, état de correction et période."
  options:
    b: { en: "Cloud security explorer runs custom queries on the cloud security graph; it doesn't provide a choke point overview.", fr: "L'explorateur de sécurité du cloud exécute des requêtes personnalisées sur le graphique de sécurité cloud ; il ne fournit pas de vue d'ensemble des points d'étranglement." }
    c: { en: "The Recommendations page lists recommendations by resource; it doesn't summarize choke points and entry points of attack paths.", fr: "La page Recommendations liste les recommandations par ressource ; elle ne résume pas les points d'étranglement et les points d'entrée des chemins d'attaque." }
    d: { en: "Network Watcher Topology shows network resources and their relationships, not attack paths.", fr: "La topologie Network Watcher montre les ressources réseau et leurs relations, pas les chemins d'attaque." }
references:
  - title: Identify and remediate attack paths in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/how-to-manage-attack-path
