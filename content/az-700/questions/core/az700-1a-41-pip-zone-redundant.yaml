id: az700-1a-41-pip-zone-redundant
objective: "1.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You plan to deploy a public Standard load balancer in the North Europe region, which has three availability zones. Its backend virtual machines are spread across zones 1, 2 and 3.

    You need to create the public IPv4 address of the load balancer frontend. The frontend must keep working if any single zone fails.

    Which public IP address should you create?
  fr: |
    Vous prévoyez de déployer un équilibreur de charge public Standard dans la région North Europe, qui compte trois zones de disponibilité. Ses machines virtuelles principales sont réparties entre les zones 1, 2 et 3.

    Vous devez créer l'adresse IPv4 publique de la configuration frontale de l'équilibreur de charge. L'adresse frontale doit continuer de fonctionner en cas de défaillance d'une seule zone.

    Quelle adresse IP publique devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "Standard SKU, zonal in zone 1", fr: "SKU Standard, zonale dans la zone 1" } }
    - { id: b, text: { en: "Standard SKU, zone-redundant", fr: "SKU Standard, redondante interzone" } }
    - { id: c, text: { en: "Basic SKU, static allocation", fr: "SKU Basic, allocation statique" } }
    - { id: d, text: { en: "Standard v2 SKU, zone-redundant", fr: "SKU Standard v2, redondante interzone" } }
answer: { optionId: b }
explanation:
  correct:
    en: A zone-redundant Standard public IP address is created across the zones of the region and survives the failure of a single zone. The zone setting is chosen at creation and can't be changed afterwards.
    fr: Une adresse IP publique Standard redondante interzone est créée dans toutes les zones de la région et survit à la défaillance d'une seule zone. Le paramètre de zone est choisi à la création et ne peut plus être modifié ensuite.
  options:
    a: { en: "A zonal address shares the fate of its zone: if zone 1 fails, the frontend fails.", fr: "Une adresse zonale partage le sort de sa zone : si la zone 1 tombe en panne, l'adresse frontale aussi." }
    c: { en: "Basic SKU public IP addresses were retired on September 30, 2025, and don't support availability zones.", fr: "Les adresses IP publiques de SKU Basic ont été retirées le 30 septembre 2025 et ne prennent pas en charge les zones de disponibilité." }
    d: { en: "Standard v2 public IP addresses currently work only with a StandardV2 NAT gateway, not with a load balancer.", fr: "Les adresses IP publiques Standard v2 ne fonctionnent actuellement qu'avec une passerelle NAT StandardV2, pas avec un équilibreur de charge." }
references:
  - title: Public IP addresses in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses
