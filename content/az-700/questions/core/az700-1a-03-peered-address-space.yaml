id: az700-1a-03-peered-address-space
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has two virtual networks in the same region:

    | Name | Address space | Subnets |
    | --- | --- | --- |
    | VNet1 | 10.10.0.0/16 | Subnet1 (10.10.1.0/24): contains VM1 |
    | VNet2 | 10.20.0.0/16 | Subnet2 (10.20.1.0/24): contains VM2 |

    VNet1 and VNet2 are peered. VNet1 needs more addresses for a new workload.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose de deux réseaux virtuels dans la même région :

    | Nom | Espace d'adressage | Sous-réseaux |
    | --- | --- | --- |
    | VNet1 | 10.10.0.0/16 | Subnet1 (10.10.1.0/24) : contient VM1 |
    | VNet2 | 10.20.0.0/16 | Subnet2 (10.20.1.0/24) : contient VM2 |

    VNet1 et VNet2 sont reliés par peering. VNet1 a besoin de plus d'adresses pour une nouvelle charge de travail.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can add the range 10.30.0.0/16 to VNet1 without deleting the peering.
        fr: Vous pouvez ajouter la plage 10.30.0.0/16 à VNet1 sans supprimer le peering.
    - id: s2
      text:
        en: You can replace the range 10.10.0.0/16 of VNet1 with 10.10.128.0/17.
        fr: Vous pouvez remplacer la plage 10.10.0.0/16 de VNet1 par 10.10.128.0/17.
    - id: s3
      text:
        en: After you change the address space of VNet1, VM2 can reach the new range of VNet1 once the peering is synced.
        fr: Après la modification de l'espace d'adressage de VNet1, VM2 peut joindre la nouvelle plage de VNet1 une fois le peering synchronisé.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The address space of a peered virtual network can be modified without downtime, as long as the new range doesn't overlap the peer. You then select Sync on the peering so that the peer learns the new address space. A range can shrink only if it still contains all the subnets that use it, and 10.10.128.0/17 doesn't contain Subnet1 (10.10.1.0/24), which holds VM1.
    fr: L'espace d'adressage d'un réseau virtuel relié par peering peut être modifié sans interruption, à condition que la nouvelle plage ne chevauche pas le pair. Vous sélectionnez ensuite Synchroniser (Sync) sur le peering pour que le pair prenne en compte le nouvel espace d'adressage. Une plage ne peut être réduite que si elle contient toujours tous les sous-réseaux qui l'utilisent, et 10.10.128.0/17 ne contient pas Subnet1 (10.10.1.0/24), qui héberge VM1.
references:
  - title: Update the address space for a peered virtual network - Azure portal
    url: https://learn.microsoft.com/en-us/azure/virtual-network/update-virtual-network-peering-address-space
  - title: Create, change, or delete an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-virtual-network
