id: az700-1a-08-vnet-create-facts
objective: "1.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an Azure subscription named Sub1. You create a virtual network named VNet1 in a resource group named RG-Net in the North Europe region, with the address space 10.8.0.0/16 and a subnet named Subnet1 (10.8.1.0/24).

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un abonnement Azure nommé Sub1. Vous créez un réseau virtuel nommé VNet1 dans un groupe de ressources nommé RG-Net, dans la région North Europe, avec l'espace d'adressage 10.8.0.0/16 et un sous-réseau nommé Subnet1 (10.8.1.0/24).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A virtual machine in North Europe whose resources are in a resource group named RG-App can connect to Subnet1.
        fr: Une machine virtuelle de la région North Europe dont les ressources sont dans un groupe de ressources nommé RG-App peut être connectée à Subnet1.
    - id: s2
      text:
        en: The first IP address that Azure can assign to a network interface in Subnet1 is 10.8.1.4.
        fr: La première adresse IP qu'Azure peut attribuer à une interface réseau dans Subnet1 est 10.8.1.4.
    - id: s3
      text:
        en: You can rename VNet1 to VNet-Prod1 from the Overview page of the virtual network.
        fr: Vous pouvez renommer VNet1 en VNet-Prod1 depuis la page Vue d'ensemble du réseau virtuel.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Resources connected to a virtual network must be in the same region and subscription, but they can be in another resource group. The name of a virtual network can't be changed after creation. Azure reserves the first four addresses and the last address of each subnet, so 10.8.1.4 is the first assignable address.
    fr: |
      Les ressources connectées à un réseau virtuel doivent se trouver dans la même région et le même abonnement, mais peuvent appartenir à un autre groupe de ressources. Le nom d'un réseau virtuel ne peut pas être modifié après la création. Azure réserve les quatre premières adresses et la dernière adresse de chaque sous-réseau : 10.8.1.4 est donc la première adresse attribuable.
references:
  - title: Create, change, or delete an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-virtual-network
  - title: Azure Virtual Network FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
