id: az700-cs1a-dns-resolver
objective: "1.2.7"
type: dragdrop
caseStudy: az700-cs1a-litware-energy
difficulty: 2
status: draft
stem:
  en: |
    You need to configure dnspr-hub and its related resources to meet the name resolution requirements. DC1 and DC2 will be configured with conditional forwarders for blob.core.windows.net.

    Which component should you use for each function? To answer, drag the appropriate components to the correct functions. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer dnspr-hub et les ressources associées pour respecter les exigences de résolution de noms. DC1 et DC2 seront configurés avec des redirecteurs conditionnels pour blob.core.windows.net.

    Quel composant devez-vous utiliser pour chaque fonction ? Pour répondre, faites glisser les composants appropriés vers les fonctions correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: inbound, text: { en: "An inbound endpoint in snet-dns-in", fr: "Un point de terminaison entrant dans snet-dns-in" } }
    - { id: outbound, text: { en: "An outbound endpoint in snet-dns-out", fr: "Un point de terminaison sortant dans snet-dns-out" } }
    - { id: ruleset, text: { en: "A DNS forwarding ruleset", fr: "Un ensemble de règles de transfert DNS" } }
    - { id: rslink, text: { en: "Virtual network links of the DNS forwarding ruleset", fr: "Des liens de réseau virtuel de l'ensemble de règles de transfert DNS" } }
    - { id: zonelink, text: { en: "Virtual network links of a private DNS zone named corp.litware.com", fr: "Des liens de réseau virtuel d'une zone DNS privée nommée corp.litware.com" } }
    - { id: customdns, text: { en: "Custom DNS servers on VNet-Scada and VNet-Billing set to the inbound endpoint IP address", fr: "Des serveurs DNS personnalisés sur VNet-Scada et VNet-Billing définis sur l'adresse IP du point de terminaison entrant" } }
  targets:
    - { id: fromdc, text: { en: "Receives the queries that DC1 and DC2 forward to Azure", fr: "Reçoit les requêtes que DC1 et DC2 transfèrent vers Azure" } }
    - { id: todc, text: { en: "Sends the queries for corp.litware.com out of Azure toward DC1 and DC2", fr: "Envoie les requêtes pour corp.litware.com hors d'Azure vers DC1 et DC2" } }
    - { id: rule, text: { en: "Contains the rule that maps corp.litware.com to 192.168.10.10 and 192.168.10.11", fr: "Contient la règle qui associe corp.litware.com à 192.168.10.10 et 192.168.10.11" } }
    - { id: scope, text: { en: "Makes the rule apply to the virtual machines in VNet-Scada and VNet-Billing", fr: "Applique la règle aux machines virtuelles de VNet-Scada et de VNet-Billing" } }
answer:
  mapping: { fromdc: inbound, todc: outbound, rule: ruleset, scope: rslink }
explanation:
  correct:
    en: The conditional forwarders of DC1 and DC2 target the IP address of the inbound endpoint, which resolves the queries with Azure DNS and the private zone linked to VNet-Hub. Queries from Azure to corp.litware.com leave through the outbound endpoint, according to a rule stored in a DNS forwarding ruleset. Linking the ruleset to VNet-Scada and VNet-Billing applies the rule to their virtual machines while the virtual networks keep the Azure-provided DNS service.
    fr: Les redirecteurs conditionnels de DC1 et DC2 ciblent l'adresse IP du point de terminaison entrant, qui résout les requêtes avec Azure DNS et la zone privée liée à VNet-Hub. Les requêtes d'Azure vers corp.litware.com sortent par le point de terminaison sortant, selon une règle stockée dans un ensemble de règles de transfert DNS. Lier l'ensemble de règles à VNet-Scada et VNet-Billing applique la règle à leurs machines virtuelles tout en conservant le service DNS fourni par Azure sur les réseaux virtuels.
  options:
    zonelink:
      en: A private DNS zone named corp.litware.com would answer from Azure instead of forwarding to DC1 and DC2, and its records would have to be maintained separately from AD DS.
      fr: Une zone DNS privée nommée corp.litware.com répondrait depuis Azure au lieu de transférer vers DC1 et DC2, et ses enregistrements devraient être gérés séparément d'AD DS.
    customdns:
      en: The requirements state that the virtual networks must keep the Azure-provided DNS service, so custom DNS servers can't be configured.
      fr: Les exigences imposent que les réseaux virtuels conservent le service DNS fourni par Azure ; des serveurs DNS personnalisés ne peuvent donc pas être configurés.
references:
  - title: What is Azure DNS Private Resolver?
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
