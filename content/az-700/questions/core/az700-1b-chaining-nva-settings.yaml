id: az700-1b-chaining-nva-settings
objective: "1.3.1"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Contoso has the following virtual networks:

    | Virtual network | Address space | Content |
    | --- | --- | --- |
    | VNet-Hub | 10.0.0.0/16 | NVA1, a Linux network virtual appliance at 10.0.1.4 with IP forwarding enabled in the operating system |
    | VNet-Spoke1 | 10.1.0.0/16 | Application servers |
    | VNet-Spoke2 | 10.2.0.0/16 | Database servers |

    Each spoke is peered with VNet-Hub, with default peering settings. The spokes aren't peered with each other. Traffic from VNet-Spoke1 to VNet-Spoke2 must go through NVA1. The return traffic is handled by a matching configuration on VNet-Spoke2.

    What should you configure on each resource for the traffic from VNet-Spoke1 to VNet-Spoke2? To answer, drag the appropriate settings to the correct resources. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose des réseaux virtuels suivants :

    | Réseau virtuel | Espace d'adressage | Contenu |
    | --- | --- | --- |
    | VNet-Hub | 10.0.0.0/16 | NVA1, une appliance virtuelle réseau Linux à l'adresse 10.0.1.4, avec le transfert IP activé dans le système d'exploitation |
    | VNet-Spoke1 | 10.1.0.0/16 | Serveurs d'applications |
    | VNet-Spoke2 | 10.2.0.0/16 | Serveurs de bases de données |

    Chaque spoke est relié par peering à VNet-Hub, avec les paramètres de peering par défaut. Les spokes ne sont pas reliés entre eux par peering. Le trafic de VNet-Spoke1 vers VNet-Spoke2 doit passer par NVA1. Le trafic de retour est géré par une configuration équivalente sur VNet-Spoke2.

    Que devez-vous configurer sur chaque ressource pour le trafic de VNet-Spoke1 vers VNet-Spoke2 ? Pour répondre, faites glisser les paramètres appropriés vers les ressources correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: udr, text: { en: "Route 10.2.0.0/16, next hop type Virtual appliance, address 10.0.1.4", fr: "Itinéraire 10.2.0.0/16, type de tronçon suivant Appliance virtuelle, adresse 10.0.1.4" } }
    - { id: udrgw, text: { en: "Route 10.2.0.0/16, next hop type Virtual network gateway", fr: "Itinéraire 10.2.0.0/16, type de tronçon suivant Passerelle de réseau virtuel" } }
    - { id: ipfwd, text: { en: "IP forwarding enabled", fr: "Transfert IP activé" } }
    - { id: fwd, text: { en: "Receive forwarded traffic from the peered virtual network", fr: "Recevoir le trafic transféré depuis le réseau virtuel relié par peering" } }
    - { id: remote, text: { en: "Use the peered virtual network's remote gateway", fr: "Utiliser la passerelle distante du réseau virtuel relié par peering" } }
  targets:
    - id: rt
      text: { en: "Route table associated with the subnets of VNet-Spoke1", fr: "Table de routage associée aux sous-réseaux de VNet-Spoke1" }
    - id: nic
      text: { en: "Network interface of NVA1", fr: "Interface réseau de NVA1" }
    - id: peer
      text: { en: "Peering from VNet-Spoke2 to VNet-Hub", fr: "Peering de VNet-Spoke2 vers VNet-Hub" }
answer:
  mapping: { rt: udr, nic: ipfwd, peer: fwd }
explanation:
  correct:
    en: |
      Service chaining uses a user-defined route whose next hop is the private IP address of the NVA in the peered hub. Azure delivers transit traffic to the NVA only if IP forwarding is enabled on its network interface, in addition to forwarding in the operating system. Packets that NVA1 forwards keep their VNet-Spoke1 source address, which is outside VNet-Hub, so VNet-Spoke2 must accept forwarded traffic on its peering to the hub.
    fr: |
      Le chaînage de services utilise un itinéraire défini par l'utilisateur dont le tronçon suivant est l'adresse IP privée de la NVA dans le hub relié par peering. Azure ne remet le trafic de transit à la NVA que si le transfert IP est activé sur son interface réseau, en plus du transfert dans le système d'exploitation. Les paquets que NVA1 transfère conservent leur adresse source de VNet-Spoke1, extérieure à VNet-Hub : VNet-Spoke2 doit donc accepter le trafic transféré sur son peering vers le hub.
  options:
    udrgw: { en: "The Virtual network gateway next hop sends traffic to a VPN gateway, and VNet-Hub has none.", fr: "Le tronçon suivant Passerelle de réseau virtuel envoie le trafic à une passerelle VPN, et VNet-Hub n'en a pas." }
    remote: { en: "Remote gateway use shares a hub VPN or ExpressRoute gateway; it doesn't route traffic through an NVA.", fr: "L'utilisation d'une passerelle distante partage une passerelle VPN ou ExpressRoute du hub ; elle ne route pas le trafic par une NVA." }
references:
  - title: Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
