id: az700-1a-24-aci-dedicated-subnet
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a virtual network named VNet-Ops with the following subnets:

    | Subnet | Range | Resources |
    | --- | --- | --- |
    | snet-shared | 10.9.1.0/24 | 14 virtual machines, an internal load balancer, 3 private endpoints |
    | snet-free | 10.9.2.0/24 | None |

    You need to deploy Azure Container Instances container groups into VNet-Ops so that they can reach the virtual machines by using private IP addresses.

    What should you do?
  fr: |
    Proseware dispose d'un réseau virtuel nommé VNet-Ops avec les sous-réseaux suivants :

    | Sous-réseau | Plage | Ressources |
    | --- | --- | --- |
    | snet-shared | 10.9.1.0/24 | 14 machines virtuelles, un équilibreur de charge interne, 3 points de terminaison privés |
    | snet-free | 10.9.2.0/24 | Aucune |

    Vous devez déployer des groupes de conteneurs Azure Container Instances dans VNet-Ops pour qu'ils puissent joindre les machines virtuelles avec des adresses IP privées.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Deploy the container groups in snet-shared and add an NSG rule that allows their traffic.
        fr: Déployer les groupes de conteneurs dans snet-shared et ajouter une règle NSG qui autorise leur trafic.
    - id: b
      text:
        en: Deploy the container groups in snet-free, which is dedicated to them.
        fr: Déployer les groupes de conteneurs dans snet-free, qui leur est dédié.
    - id: c
      text:
        en: Delegate snet-shared to Azure Container Instances, then deploy the container groups in it.
        fr: Déléguer snet-shared à Azure Container Instances, puis y déployer les groupes de conteneurs.
    - id: d
      text:
        en: Create a private endpoint for each container group in snet-shared.
        fr: Créer un point de terminaison privé pour chaque groupe de conteneurs dans snet-shared.
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Container Instances requires a dedicated subnet: only container groups can be deployed in it, and it can't be combined with customer virtual machines. snet-free is empty, so it can be used for the container groups, which then reach the virtual machines over the virtual network.
    fr: |
      Azure Container Instances exige un sous-réseau dédié, dans lequel seuls des groupes de conteneurs peuvent être déployés, sans machines virtuelles du client. snet-free est vide : il peut accueillir les groupes de conteneurs, qui joignent ensuite les machines virtuelles par le réseau virtuel.
  options:
    a: { en: "An NSG rule doesn't lift the restriction: container groups can't share a subnet with virtual machines.", fr: "Une règle NSG ne lève pas la restriction : les groupes de conteneurs ne peuvent pas partager un sous-réseau avec des machines virtuelles." }
    c: { en: "The subnet would still contain virtual machines, load balancer frontends and private endpoints, and a delegated subnet can't host private endpoints.", fr: "Le sous-réseau contiendrait toujours des machines virtuelles, des adresses frontales d'équilibreur de charge et des points de terminaison privés, et un sous-réseau délégué ne peut pas héberger de points de terminaison privés." }
    d: { en: "Container groups deployed into a virtual network receive private IP addresses directly; private endpoints don't place container groups in a subnet.", fr: "Les groupes de conteneurs déployés dans un réseau virtuel reçoivent directement des adresses IP privées ; des points de terminaison privés ne placent pas de groupes de conteneurs dans un sous-réseau." }
references:
  - title: Integrate Azure services with virtual networks for network isolation
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-for-azure-services
