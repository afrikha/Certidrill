id: az700-1b-private-dns-one-registration-zone
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has the following private DNS zones and virtual network links:

    | Private DNS zone | Virtual network link | Autoregistration |
    | --- | --- | --- |
    | apps.adatum.internal | VNet1 | Enabled |
    | apps.adatum.internal | VNet2 | Disabled |
    | data.adatum.internal | VNet2 | Enabled |

    You try to link **data.adatum.internal** to VNet1 with autoregistration enabled, and the operation fails.

    What is the cause of the failure?
  fr: |
    Adatum dispose des zones DNS privées et des liens de réseau virtuel suivants :

    | Zone DNS privée | Lien de réseau virtuel | Inscription automatique |
    | --- | --- | --- |
    | apps.adatum.internal | VNet1 | Activée |
    | apps.adatum.internal | VNet2 | Désactivée |
    | data.adatum.internal | VNet2 | Activée |

    Vous tentez de lier **data.adatum.internal** à VNet1 avec l'inscription automatique activée, et l'opération échoue.

    Quelle est la cause de l'échec ?
body:
  options:
    - id: a
      text: { en: "data.adatum.internal already has a link with autoregistration enabled.", fr: "data.adatum.internal possède déjà un lien avec l'inscription automatique activée." }
    - id: b
      text: { en: "VNet1 is already a registration virtual network for apps.adatum.internal.", fr: "VNet1 est déjà un réseau virtuel d'inscription pour apps.adatum.internal." }
    - id: c
      text: { en: "VNet1 isn't peered with VNet2, which is already linked to data.adatum.internal.", fr: "VNet1 n'est pas relié par peering à VNet2, qui est déjà lié à data.adatum.internal." }
    - id: d
      text: { en: "VNet1 is already a resolution virtual network for another private DNS zone.", fr: "VNet1 est déjà un réseau virtuel de résolution pour une autre zone DNS privée." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A virtual network can have only one registration zone, that is, one private DNS zone linked with autoregistration enabled. VNet1 already registers its virtual machines in apps.adatum.internal, so it can be linked to data.adatum.internal only as a resolution virtual network.
    fr: |
      Un réseau virtuel ne peut avoir qu'une seule zone d'inscription, c'est-à-dire une seule zone DNS privée liée avec l'inscription automatique activée. VNet1 inscrit déjà ses machines virtuelles dans apps.adatum.internal : il ne peut être lié à data.adatum.internal que comme réseau virtuel de résolution.
  options:
    a: { en: "A private DNS zone can have multiple registration virtual networks (up to 100 links with autoregistration).", fr: "Une zone DNS privée peut avoir plusieurs réseaux virtuels d'inscription (jusqu'à 100 liens avec inscription automatique)." }
    c: { en: "Private DNS zones don't require peering between the linked virtual networks.", fr: "Les zones DNS privées n'exigent pas de peering entre les réseaux virtuels liés." }
    d: { en: "A virtual network can be a resolution virtual network for many zones; the limit concerns registration.", fr: "Un réseau virtuel peut être réseau virtuel de résolution pour de nombreuses zones ; la limite concerne l'inscription." }
references:
  - title: What is a virtual network link?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-virtual-network-links
