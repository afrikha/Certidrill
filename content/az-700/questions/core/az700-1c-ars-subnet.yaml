id: az700-1c-ars-subnet
objective: "1.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind has a hub virtual network named **VNet-Hub** with the address space 10.0.0.0/16. VNet-Hub contains a GatewaySubnet (10.0.255.0/27) and two SD-WAN network virtual appliances.

    You plan to deploy Azure Route Server in VNet-Hub so that the appliances can exchange routes with the virtual network over BGP. The solution must use the smallest supported subnet.

    Which subnet should you create for the route server?
  fr: |
    Northwind dispose d'un réseau virtuel hub nommé **VNet-Hub** dont l'espace d'adressage est 10.0.0.0/16. VNet-Hub contient un GatewaySubnet (10.0.255.0/27) et deux appliances virtuelles réseau SD-WAN.

    Vous prévoyez de déployer le Serveur de routes Azure (Azure Route Server) dans VNet-Hub afin que les appliances puissent échanger des itinéraires avec le réseau virtuel par BGP. La solution doit utiliser le plus petit sous-réseau pris en charge.

    Quel sous-réseau devez-vous créer pour le serveur de routes ?
body:
  options:
    - id: a
      text: { en: "A subnet named RouteServerSubnet with the prefix 10.0.1.0/27", fr: "Un sous-réseau nommé RouteServerSubnet avec le préfixe 10.0.1.0/27" }
    - id: b
      text: { en: "A subnet named RouteServerSubnet with the prefix 10.0.1.0/26", fr: "Un sous-réseau nommé RouteServerSubnet avec le préfixe 10.0.1.0/26" }
    - id: c
      text: { en: "A subnet named AzureRouteServerSubnet with the prefix 10.0.1.0/26", fr: "Un sous-réseau nommé AzureRouteServerSubnet avec le préfixe 10.0.1.0/26" }
    - id: d
      text: { en: "No new subnet: deploy the route server in GatewaySubnet", fr: "Aucun nouveau sous-réseau : déployer le serveur de routes dans GatewaySubnet" }
answer: { optionId: b }
explanation:
  correct:
    en: Azure Route Server must be deployed in a dedicated subnet named exactly RouteServerSubnet, with a size of /26 or larger. Only one route server can exist per virtual network, and neither a route table nor an NSG can be associated with RouteServerSubnet.
    fr: Le Serveur de routes Azure doit être déployé dans un sous-réseau dédié nommé exactement RouteServerSubnet, d'une taille de /26 ou plus. Un seul serveur de routes peut exister par réseau virtuel, et ni une table de routage ni un NSG ne peuvent être associés à RouteServerSubnet.
  options:
    a: { en: "A /27 is smaller than the /26 minimum required for RouteServerSubnet.", fr: "Un /27 est plus petit que le minimum de /26 exigé pour RouteServerSubnet." }
    c: { en: "The subnet name is fixed: RouteServerSubnet. AzureRouteServerSubnet is not a recognized name.", fr: "Le nom du sous-réseau est imposé : RouteServerSubnet. AzureRouteServerSubnet n'est pas un nom reconnu." }
    d: { en: "GatewaySubnet is reserved for virtual network gateways; the route server needs its own dedicated subnet.", fr: "GatewaySubnet est réservé aux passerelles de réseau virtuel ; le serveur de routes a besoin de son propre sous-réseau dédié." }
references:
  - title: "Quickstart: Create an Azure Route Server using Azure portal"
    url: https://learn.microsoft.com/en-us/azure/route-server/quickstart-create-route-server-portal
  - title: Azure Route Server frequently asked questions
    url: https://learn.microsoft.com/en-us/azure/route-server/route-server-faq
