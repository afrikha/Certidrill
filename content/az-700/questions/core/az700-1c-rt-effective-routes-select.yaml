id: az700-1c-rt-effective-routes-select
objective: "1.3.7"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    A virtual machine named **VM1** runs in a virtual network named **VNet1** (10.1.0.0/16). VNet1 is peered with **VNet2** (10.2.0.0/16) and contains a VPN gateway that learns on-premises prefixes over BGP. A network virtual appliance (NVA) in VNet1 has the IP address 10.1.3.4.

    The following table shows the effective routes of the network interface of VM1.

    For each destination, select the route that Azure uses to forward the traffic.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une machine virtuelle nommée **VM1** s'exécute dans un réseau virtuel nommé **VNet1** (10.1.0.0/16). VNet1 a un peering avec **VNet2** (10.2.0.0/16) et contient une passerelle VPN qui apprend des préfixes locaux par BGP. Une appliance virtuelle réseau (NVA) de VNet1 a l'adresse IP 10.1.3.4.

    Le tableau suivant présente les itinéraires effectifs de l'interface réseau de VM1.

    Pour chaque destination, sélectionnez l'itinéraire qu'Azure utilise pour acheminer le trafic.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Traffic from VM1 to 10.20.5.10", fr: "Trafic de VM1 vers 10.20.5.10" }
    - id: p2
      text: { en: "Traffic from VM1 to 10.20.9.9", fr: "Trafic de VM1 vers 10.20.9.9" }
  grid:
    caption: { en: "Effective routes of VM1's network interface", fr: "Itinéraires effectifs de l'interface réseau de VM1" }
    header: [Source, { en: State, fr: État }, { en: "Address prefixes", fr: "Préfixes d'adresse" }, { en: "Next hop type", fr: "Type de tronçon suivant" }, { en: "Next hop IP address", fr: "Adresse IP du tronçon suivant" }]
    rows:
      - [{ text: Default }, { text: Active }, { text: 10.1.0.0/16, area: r1 }, { text: Virtual network }, { text: "-" }]
      - [{ text: Default }, { text: Active }, { text: 10.2.0.0/16, area: r2 }, { text: VNet peering }, { text: "-" }]
      - [{ text: Virtual network gateway }, { text: Active }, { text: 10.20.0.0/16, area: r3 }, { text: Virtual network gateway }, { text: 10.1.255.4 }]
      - [{ text: User }, { text: Active }, { text: 10.20.5.0/24, area: r4 }, { text: Virtual appliance }, { text: 10.1.3.4 }]
      - [{ text: Default }, { text: Invalid }, { text: 0.0.0.0/0, area: r5 }, { text: Internet }, { text: "-" }]
      - [{ text: User }, { text: Active }, { text: 0.0.0.0/0, area: r6 }, { text: Virtual appliance }, { text: 10.1.3.4 }]
answer:
  values: { p1: r4, p2: r3 }
explanation:
  correct:
    en: Azure selects the route with the longest prefix that matches the destination. 10.20.5.10 matches both 10.20.0.0/16 (BGP) and 10.20.5.0/24 (user-defined), and the /24 is more specific, so the traffic goes to the NVA. 10.20.9.9 only matches 10.20.0.0/16 and 0.0.0.0/0, so the BGP route through the VPN gateway is used. Precedence between user-defined, BGP and system routes only matters when the prefixes are identical.
    fr: "Azure choisit l'itinéraire dont le préfixe correspondant à la destination est le plus long. 10.20.5.10 correspond à 10.20.0.0/16 (BGP) et à 10.20.5.0/24 (défini par l'utilisateur) ; le /24 est plus spécifique, donc le trafic part vers la NVA. 10.20.9.9 ne correspond qu'à 10.20.0.0/16 et 0.0.0.0/0 : c'est l'itinéraire BGP via la passerelle VPN qui est utilisé. La priorité entre itinéraires définis par l'utilisateur, BGP et système n'intervient que lorsque les préfixes sont identiques."
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
  - title: Diagnose a virtual machine routing problem
    url: https://learn.microsoft.com/en-us/azure/virtual-network/diagnose-network-routing-problem
