id: az700-1c-apa-plan
objective: "1.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum's security team wants Microsoft Defender for Cloud to show how an attacker could move from an internet-exposed virtual machine to a storage account that contains sensitive data, and which recommendations break that path. The subscription currently has only the foundational CSPM capabilities.

    You need to enable attack path analysis.

    What should you enable on the subscription?
  fr: |
    L'équipe de sécurité d'Adatum souhaite que Microsoft Defender for Cloud montre comment un attaquant pourrait passer d'une machine virtuelle exposée à Internet à un compte de stockage contenant des données sensibles, et quelles recommandations coupent ce chemin. L'abonnement ne dispose actuellement que des fonctionnalités CSPM de base (foundational CSPM).

    Vous devez activer l'analyse du chemin d'attaque.

    Que devez-vous activer sur l'abonnement ?
body:
  options:
    - id: a
      text: { en: "Network Watcher traffic analytics with a Log Analytics workspace", fr: "Traffic analytics de Network Watcher avec un espace de travail Log Analytics" }
    - id: b
      text: { en: "The Defender for Servers Plan 1 with the Azure Monitor Agent", fr: "Le plan Defender for Servers Plan 1 avec l'agent Azure Monitor" }
    - id: c
      text: { en: "The Defender CSPM plan with agentless scanning for machines", fr: "Le plan Defender CSPM avec l'analyse sans agent des machines" }
    - id: d
      text: { en: "The Microsoft cloud security benchmark initiative with all policies", fr: "L'initiative Microsoft cloud security benchmark avec toutes les stratégies" }
answer: { optionId: c }
explanation:
  correct:
    en: Attack path analysis and cloud security explorer are part of the Defender CSPM plan; they are not available with foundational CSPM. They also need agentless scanning for VMs or the vulnerability assessment capability of Defender for Servers, so that vulnerabilities and internet exposure feed the cloud security graph.
    fr: "L'analyse du chemin d'attaque et l'explorateur de sécurité du cloud font partie du plan Defender CSPM ; ils ne sont pas disponibles avec le CSPM de base. Ils nécessitent aussi l'analyse sans agent des machines virtuelles ou la fonctionnalité d'évaluation des vulnérabilités de Defender for Servers, afin que les vulnérabilités et l'exposition à Internet alimentent le graphique de sécurité cloud."
  options:
    b: { en: "Defender for Servers alone doesn't provide attack path analysis, which requires Defender CSPM.", fr: "Defender for Servers seul ne fournit pas l'analyse du chemin d'attaque, qui nécessite Defender CSPM." }
    a: { en: "Traffic analytics analyzes flow logs; it doesn't build attack paths.", fr: "Traffic analytics analyse les journaux de flux ; il ne construit pas de chemins d'attaque." }
    d: { en: "The Microsoft cloud security benchmark is assigned by default and produces recommendations and the secure score, not attack paths.", fr: "Le Microsoft cloud security benchmark est attribué par défaut et produit les recommandations et le degré de sécurisation, pas les chemins d'attaque." }
references:
  - title: Security explorer and attack paths in Microsoft Defender for Cloud
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-attack-path
  - title: What is Cloud Security Posture Management (CSPM)
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/concept-cloud-security-posture-management
