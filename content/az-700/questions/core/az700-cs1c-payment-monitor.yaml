id: az700-cs1c-payment-monitor
objective: "1.4.2"
type: single
caseStudy: az700-cs1c-wingtip-toys
difficulty: 1
status: draft
stem:
  en: You need to meet the monitoring requirement for the Fabrikam API. Which Network Watcher feature should you use?
  fr: Vous devez respecter l'exigence de supervision concernant l'API Fabrikam. Quelle fonctionnalité de Network Watcher devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Connection troubleshoot", fr: "Résolution des problèmes de connexion (Connection troubleshoot)" } }
    - { id: b, text: { en: "IP flow verify", fr: "Vérification des flux IP (IP flow verify)" } }
    - { id: c, text: { en: "Connection monitor", fr: "Moniteur de connexion (Connection monitor)" } }
    - { id: d, text: { en: "Traffic analytics", fr: "Traffic analytics" } }
answer: { optionId: c }
explanation:
  correct:
    en: Connection monitor runs TCP, HTTP or ICMP checks continuously from an Azure VM, such as VM-POSAPI1, to a destination that can be an external URL or FQDN. It records the percentage of failed checks and the round-trip time as Azure Monitor metrics, and a metric alert on ChecksFailedPercent raises the alert above 10 percent.
    fr: Le Moniteur de connexion exécute en continu des vérifications TCP, HTTP ou ICMP depuis une machine virtuelle Azure, comme VM-POSAPI1, vers une destination qui peut être une URL ou un nom de domaine complet externe. Il enregistre le pourcentage de vérifications en échec et la durée d'aller-retour sous forme de métriques Azure Monitor, et une alerte de métrique sur ChecksFailedPercent déclenche l'alerte au-delà de 10 %.
  options:
    a:
      en: Connection troubleshoot runs a one-time check of a connection; it doesn't measure packet loss and latency continuously or raise alerts.
      fr: La résolution des problèmes de connexion effectue une vérification ponctuelle d'une connexion ; elle ne mesure pas en continu la perte de paquets et la latence et ne déclenche pas d'alerte.
    b:
      en: IP flow verify only tells whether a packet is allowed or denied by a security rule; it measures neither packet loss nor round-trip time.
      fr: La vérification des flux IP indique seulement si un paquet est autorisé ou refusé par une règle de sécurité ; elle ne mesure ni la perte de paquets ni le temps aller-retour.
    d:
      en: Traffic analytics analyzes flow logs to show traffic patterns; it doesn't send test probes or measure the round-trip time to an endpoint.
      fr: Traffic analytics analyse les journaux de flux pour montrer les tendances du trafic ; il n'envoie pas de sondes de test et ne mesure pas le temps aller-retour vers un point de terminaison.
references:
  - title: Connection monitor overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview
