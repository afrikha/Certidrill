id: az700-1b-private-dns-split-horizon
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam hosts the public zone **fabrikam.com** in Azure DNS. The zone contains about 300 record sets, including `www`, `api` and `portal`, which are updated by several teams.

    An application in a virtual network named **VNet1** must reach `portal.fabrikam.com` at the private IP address 10.1.4.20. All the other fabrikam.com names must resolve from VNet1 exactly as they do on the internet. The private IP address must not be published in public DNS, and you must not maintain a copy of the public records.

    What should you do?
  fr: |
    Fabrikam héberge la zone publique **fabrikam.com** dans Azure DNS. La zone contient environ 300 jeux d'enregistrements, dont `www`, `api` et `portal`, mis à jour par plusieurs équipes.

    Une application d'un réseau virtuel nommé **VNet1** doit joindre `portal.fabrikam.com` à l'adresse IP privée 10.1.4.20. Tous les autres noms de fabrikam.com doivent être résolus depuis VNet1 exactement comme sur Internet. L'adresse IP privée ne doit pas être publiée dans le DNS public, et vous ne devez pas maintenir de copie des enregistrements publics.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a private DNS zone named fabrikam.com with an A record portal, and link it to VNet1.", fr: "Créer une zone DNS privée nommée fabrikam.com avec un enregistrement A portal, et la lier à VNet1." }
    - id: b
      text: { en: "Create a private DNS zone named fabrikam.com with an A record portal, and enable fallback to internet on its link.", fr: "Créer une zone DNS privée nommée fabrikam.com avec un enregistrement A portal, et activer l'option Enable fallback to internet sur son lien." }
    - id: c
      text: { en: "Create a private DNS zone named portal.fabrikam.com with an A record at its apex, and link it to VNet1.", fr: "Créer une zone DNS privée nommée portal.fabrikam.com avec un enregistrement A à son apex, et la lier à VNet1." }
    - id: d
      text: { en: "Add a second A record with the address 10.1.4.20 to the portal record set of the public zone.", fr: "Ajouter un second enregistrement A avec l'adresse 10.1.4.20 au jeu d'enregistrements portal de la zone publique." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A linked private zone is authoritative for its whole namespace in VNet1. A zone named portal.fabrikam.com covers only that name, so the apex record answers portal.fabrikam.com with the private address, and every other fabrikam.com name doesn't match the zone and is resolved publicly.
    fr: |
      Une zone privée liée fait autorité pour tout son espace de noms dans VNet1. Une zone nommée portal.fabrikam.com ne couvre que ce nom : l'enregistrement de l'apex répond à portal.fabrikam.com avec l'adresse privée, et tous les autres noms de fabrikam.com ne correspondent pas à la zone et sont résolus publiquement.
  options:
    a: { en: "A private zone named fabrikam.com answers for all of fabrikam.com in VNet1: www, api and the other names would fail unless you copy them into the private zone.", fr: "Une zone privée nommée fabrikam.com répond pour tout fabrikam.com dans VNet1 : www, api et les autres noms échoueraient, sauf à les copier dans la zone privée." }
    b: { en: "Fallback to internet is available only for private DNS zones associated with Private Link resources, not for a zone named fabrikam.com.", fr: "L'option Enable fallback to internet n'est disponible que pour les zones DNS privées associées à des ressources Private Link, pas pour une zone nommée fabrikam.com." }
    d: { en: "The private address would be published in the public zone, and clients would receive both addresses.", fr: "L'adresse privée serait publiée dans la zone publique, et les clients recevraient les deux adresses." }
references:
  - title: What is Azure Private DNS?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-overview
  - title: Fallback to internet for Azure Private DNS zones
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-fallback
