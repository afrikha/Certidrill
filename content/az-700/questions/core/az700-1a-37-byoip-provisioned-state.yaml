id: az700-1a-37-byoip-provisioned-state
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso onboarded its range 198.51.100.0/24 as a custom IP prefix named cip-contoso in West Europe. The Commissioned state field of cip-contoso shows **Provisioned**.

    You derived a public IP prefix from cip-contoso, created a public IP address named pip-web from it, and associated pip-web with the network interface of a web server. The NSG of the web server allows TCP 443 from the internet. The range is not advertised from any other network.

    Clients on the internet can't reach the web server at the address of pip-web. You need to make the web server reachable.

    What should you do?
  fr: |
    Contoso a intégré sa plage 198.51.100.0/24 sous la forme d'un préfixe d'adresse IP personnalisé nommé cip-contoso dans la région West Europe. Le champ Commissioned state de cip-contoso indique **Provisioned**.

    Vous avez dérivé un préfixe d'adresse IP publique de cip-contoso, créé à partir de celui-ci une adresse IP publique nommée pip-web, et associé pip-web à l'interface réseau d'un serveur web. Le NSG du serveur web autorise TCP 443 depuis Internet. La plage n'est publiée par aucun autre réseau.

    Les clients sur Internet ne peuvent pas joindre le serveur web à l'adresse de pip-web. Vous devez rendre le serveur web joignable.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Commission cip-contoso.", fr: "Mettre en service cip-contoso." } }
    - { id: b, text: { en: "Associate cip-contoso with the network interface of the web server.", fr: "Associer cip-contoso à l'interface réseau du serveur web." } }
    - { id: c, text: { en: "Recreate pip-web with the routing preference set to Internet.", fr: "Recréer pip-web avec la préférence de routage définie sur Internet." } }
    - { id: d, text: { en: "Deprovision cip-contoso, then create it again as a zonal prefix.", fr: "Déprovisionner cip-contoso, puis le recréer comme préfixe zonal." } }
answer: { optionId: a }
explanation:
  correct:
    en: In the Provisioned state, addresses derived from a custom IP prefix can be attached to resources, but the range isn't advertised, so the addresses aren't reachable. Commissioning starts the advertisement from the Azure region, then to the internet through the Microsoft WAN.
    fr: |
      À l'état Provisioned, les adresses dérivées d'un préfixe d'adresse IP personnalisé peuvent être attachées à des ressources, mais la plage n'est pas publiée : les adresses ne sont pas joignables. La mise en service démarre la publication depuis la région Azure, puis vers Internet par le WAN de Microsoft.
  options:
    b: { en: "A custom IP prefix can't be attached directly to a resource.", fr: "Un préfixe d'adresse IP personnalisé ne peut pas être attaché directement à une ressource." }
    c: { en: "Addresses derived from a custom IP prefix don't support routing preference Internet, and the routing preference doesn't make a range advertised.", fr: "Les adresses dérivées d'un préfixe d'adresse IP personnalisé ne prennent pas en charge la préférence de routage Internet, et la préférence de routage ne fait pas publier une plage." }
    d: { en: "Zonal or zone-redundant, the range stays unreachable until it is commissioned.", fr: "Zonale ou redondante interzone, la plage reste injoignable tant qu'elle n'est pas mise en service." }
references:
