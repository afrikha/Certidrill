id: az700-1b-public-dns-wildcard
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam hosts the public zone **fabrikam.com** in Azure DNS. The zone contains the A record sets `www` and `api`.

    A marketing platform creates new subdomains of fabrikam.com every day. You need every name under fabrikam.com that has no record set of its own to resolve to 203.0.113.50. The existing records must keep their current values.

    What should you create in the zone?
  fr: |
    Fabrikam héberge la zone publique **fabrikam.com** dans Azure DNS. La zone contient les jeux d'enregistrements A `www` et `api`.

    Une plateforme marketing crée chaque jour de nouveaux sous-domaines de fabrikam.com. Vous devez faire en sorte que chaque nom sous fabrikam.com qui n'a pas son propre jeu d'enregistrements soit résolu en 203.0.113.50. Les enregistrements existants doivent conserver leurs valeurs actuelles.

    Que devez-vous créer dans la zone ?
body:
  options:
    - id: a
      text: { en: "An A record set named @ with the address 203.0.113.50", fr: "Un jeu d'enregistrements A nommé @ avec l'adresse 203.0.113.50" } 
    - id: b
      text: { en: "An alias record set at the apex that targets the public IP address", fr: "Un jeu d'enregistrements d'alias à l'apex qui cible l'adresse IP publique" }
    - id: c
      text: { en: "An A record set named * with the address 203.0.113.50", fr: "Un jeu d'enregistrements A nommé * avec l'adresse 203.0.113.50" }
    - id: d
      text: { en: "A child zone named marketing.fabrikam.com with an A record at its apex", fr: "Une zone enfant nommée marketing.fabrikam.com avec un enregistrement A à son apex" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A record set named `*` is a wildcard: it answers for any name in the zone that has no more specific record set, while `www` and `api` keep answering with their own records. Azure DNS supports wildcard record sets for every type except NS and SOA.
    fr: |
      Un jeu d'enregistrements nommé `*` est un caractère générique : il répond pour tout nom de la zone qui n'a pas de jeu d'enregistrements plus spécifique, tandis que `www` et `api` continuent de répondre avec leurs propres enregistrements. Azure DNS prend en charge les jeux d'enregistrements génériques pour tous les types sauf NS et SOA.
  options:
    a: { en: "@ is the zone apex: the record answers only for fabrikam.com itself, not for its subdomains.", fr: "@ désigne l'apex de la zone : l'enregistrement ne répond que pour fabrikam.com lui-même, pas pour ses sous-domaines." }
    b: { en: "An apex alias record also answers only for fabrikam.com, not for the names below it.", fr: "Un enregistrement d'alias à l'apex ne répond lui aussi que pour fabrikam.com, pas pour les noms situés en dessous." }
    d: { en: "A child zone covers only names under marketing.fabrikam.com, and the new subdomains are created directly under fabrikam.com.", fr: "Une zone enfant ne couvre que les noms situés sous marketing.fabrikam.com, alors que les nouveaux sous-domaines sont créés directement sous fabrikam.com." }
references:
  - title: Overview of DNS zones and records
    url: https://learn.microsoft.com/en-us/azure/dns/dns-zones-records
