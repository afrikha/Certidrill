id: az700-cs4b-etl-routes
objective: "1.3.7"
type: yesno_statements
caseStudy: az700-cs4b-fernhill
difficulty: 3
status: draft
stem:
  en: |
    Before you change anything, you review the effective routes of the network interface of VM-ETL1 to check the security requirement. A host in the Paris datacenter uses the IP address 10.10.5.20.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Avant toute modification, vous examinez les itinéraires effectifs de l'interface réseau de VM-ETL1 pour vérifier l'exigence de sécurité. Un hôte du centre de données de Paris utilise l'adresse IP 10.10.5.20.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: With the current configuration, traffic from VM-ETL1 to 10.10.5.20 is sent to FW1.
        fr: Avec la configuration actuelle, le trafic de VM-ETL1 vers 10.10.5.20 est envoyé à FW1.
    - id: s2
      text:
        en: If you set Propagate gateway routes to No on RT-Data, traffic from VM-ETL1 to 10.10.5.20 is sent to FW1.
        fr: Si vous définissez Propager les itinéraires de passerelle sur Non dans RT-Data, le trafic de VM-ETL1 vers 10.10.5.20 est envoyé à FW1.
    - id: s3
      text:
        en: With the current configuration, traffic from VM-ETL1 to VM-SQL1 is sent to FW1.
        fr: Avec la configuration actuelle, le trafic de VM-ETL1 vers VM-SQL1 est envoyé à FW1.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Azure first selects the route with the longest prefix match, and uses the route type (user-defined, then BGP, then system) only to break a tie between identical prefixes. Because VNet-Data uses the remote gateway and gateway route propagation is enabled, snet-etl learns 10.10.0.0/16 from ERGW1 with next hop type Virtual network gateway; this /16 is more specific than the 0.0.0.0/0 user-defined route, so the traffic to Paris bypasses FW1. When you disable gateway route propagation on RT-Data, the BGP routes are no longer added to snet-etl and only 0.0.0.0/0 matches, so the traffic goes to 10.0.1.4. Traffic to VM-SQL1 (10.2.2.4) matches the system route of the virtual network address space 10.2.0.0/16, which is more specific than 0.0.0.0/0.
    fr: |
      Azure sélectionne d'abord l'itinéraire dont le préfixe correspond le plus longuement, et n'utilise le type d'itinéraire (défini par l'utilisateur, puis BGP, puis système) que pour départager des préfixes identiques. Comme VNet-Data utilise la passerelle distante et que la propagation des itinéraires de passerelle est activée, snet-etl apprend 10.10.0.0/16 d'ERGW1 avec le type de tronçon suivant Virtual network gateway ; ce /16 est plus spécifique que l'itinéraire défini par l'utilisateur 0.0.0.0/0 : le trafic vers Paris contourne donc FW1. Quand vous désactivez la propagation des itinéraires de passerelle dans RT-Data, les itinéraires BGP ne sont plus ajoutés à snet-etl et seul 0.0.0.0/0 correspond : le trafic part vers 10.0.1.4. Le trafic vers VM-SQL1 (10.2.2.4) correspond à l'itinéraire système de l'espace d'adressage du réseau virtuel, 10.2.0.0/16, plus spécifique que 0.0.0.0/0.
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
