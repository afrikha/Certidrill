id: az700-1a-34-prefix-use-design
objective: "1.1.7"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank created three Standard, zone-redundant public IP prefixes in the region of its hub virtual network: ippre-fw (/30), ippre-nat (/28) and ippre-lb (/29). Each resource of the hub must take its public addresses from its own prefix, and the number of public IP address resources to manage must be as small as possible.

    How should each resource use its prefix? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank a créé trois préfixes d'adresses IP publiques Standard redondants interzone dans la région de son réseau virtuel hub : ippre-fw (/30), ippre-nat (/28) et ippre-lb (/29). Chaque ressource du hub doit prendre ses adresses publiques dans son propre préfixe, et le nombre de ressources d'adresse IP publique à gérer doit être le plus faible possible.

    Comment chaque ressource doit-elle utiliser son préfixe ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Azure Firewall Premium with four public IP addresses from ippre-fw: [[fw]]

      Standard NAT gateway that uses ippre-nat for the outbound traffic of a subnet: [[nat]]

      Outbound rules of a public Standard load balancer that use ippre-lb: [[lb]]
    fr: |
      Pare-feu Azure Premium avec quatre adresses IP publiques issues d'ippre-fw : [[fw]]

      Passerelle NAT Standard qui utilise ippre-nat pour le trafic sortant d'un sous-réseau : [[nat]]

      Règles de trafic sortant d'un équilibreur de charge public Standard qui utilisent ippre-lb : [[lb]]
  slots:
    - id: fw
      options:
        - { id: direct, text: { en: "Reference the prefix directly", fr: "Référencer le préfixe directement" } }
        - { id: addr, text: { en: "Use public IP addresses created from the prefix", fr: "Utiliser des adresses IP publiques créées à partir du préfixe" } }
        - { id: custom, text: { en: "Use a custom IP prefix derived from the prefix", fr: "Utiliser un préfixe d'adresse IP personnalisé dérivé du préfixe" } }
    - id: nat
      options:
        - { id: direct, text: { en: "Reference the prefix directly", fr: "Référencer le préfixe directement" } }
        - { id: addr, text: { en: "Use public IP addresses created from the prefix", fr: "Utiliser des adresses IP publiques créées à partir du préfixe" } }
        - { id: custom, text: { en: "Use a custom IP prefix derived from the prefix", fr: "Utiliser un préfixe d'adresse IP personnalisé dérivé du préfixe" } }
    - id: lb
      options:
        - { id: direct, text: { en: "Reference the prefix directly", fr: "Référencer le préfixe directement" } }
        - { id: addr, text: { en: "Use public IP addresses created from the prefix", fr: "Utiliser des adresses IP publiques créées à partir du préfixe" } }
        - { id: custom, text: { en: "Use a custom IP prefix derived from the prefix", fr: "Utiliser un préfixe d'adresse IP personnalisé dérivé du préfixe" } }
answer:
  values: { fw: addr, nat: direct, lb: direct }
explanation:
  correct:
    en: Azure Firewall can't be attached to a prefix, but it can use Standard public IP addresses created from one. A NAT gateway and the outbound rules of a Standard load balancer can reference a prefix directly, which avoids creating one public IP address resource per address.
    fr: Le Pare-feu Azure ne peut pas être attaché à un préfixe, mais il peut utiliser des adresses IP publiques Standard créées à partir d'un préfixe. Une passerelle NAT et les règles de trafic sortant d'un équilibreur de charge Standard peuvent référencer un préfixe directement, ce qui évite de créer une ressource d'adresse IP publique par adresse.
  options:
    custom: { en: "Custom IP prefixes come from ranges that an organization owns; public IP prefixes are derived from them, not the reverse.", fr: "Les préfixes d'adresses IP personnalisés proviennent de plages qu'une organisation possède ; les préfixes d'adresses IP publiques en sont dérivés, pas l'inverse." }
references:
  - title: Public IP address prefix
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix
  - title: Outbound rules for Azure Load Balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/outbound-rules
