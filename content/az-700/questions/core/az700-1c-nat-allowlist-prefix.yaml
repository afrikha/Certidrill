id: az700-1c-nat-allowlist-prefix
objective: "1.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs 40 virtual machines in a subnet named **Batch** in a virtual network created in 2026. The virtual machines have no public IP addresses.

    The virtual machines must call a partner API on the internet. The partner allows traffic only from a contiguous range of source IP addresses that Fabrikam declares in advance. The virtual machines must not accept unsolicited inbound connections from the internet, and the solution must minimize administrative effort.

    What should you use?
  fr: |
    Fabrikam exécute 40 machines virtuelles dans un sous-réseau nommé **Batch** d'un réseau virtuel créé en 2026. Les machines virtuelles n'ont pas d'adresse IP publique.

    Les machines virtuelles doivent appeler une API d'un partenaire sur Internet. Le partenaire n'autorise que le trafic provenant d'une plage contiguë d'adresses IP sources que Fabrikam déclare à l'avance. Les machines virtuelles ne doivent pas accepter de connexions entrantes non sollicitées depuis Internet, et la solution doit réduire au minimum l'effort d'administration.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "A VPN gateway that has a point-to-site configuration for the Batch subnet", fr: "Une passerelle VPN avec une configuration de point à site pour le sous-réseau Batch" }
    - id: b
      text: { en: "A Standard public load balancer that has inbound NAT rules for the virtual machines", fr: "Un équilibreur de charge public Standard avec des règles NAT entrantes pour les machines virtuelles" }
    - id: c
      text: { en: "A private endpoint in the Batch subnet for the partner API", fr: "Un point de terminaison privé dans le sous-réseau Batch pour l'API du partenaire" }
    - id: d
      text: { en: "A NAT gateway that uses a public IP prefix, associated with the Batch subnet", fr: "Une passerelle NAT qui utilise un préfixe d'adresse IP publique, associée au sous-réseau Batch" }
answer: { optionId: d }
explanation:
  correct:
    en: A NAT gateway gives every instance of the subnet outbound internet access through its public IP addresses while keeping the VMs private, and it never allows unsolicited inbound connections. With a public IP prefix, the source addresses form a contiguous, predictable range that the partner can allowlist. Since March 31, 2026, new virtual networks have private subnets without default outbound access, so an explicit outbound method is needed anyway.
    fr: "Une passerelle NAT fournit à toutes les instances du sous-réseau un accès sortant à Internet via ses adresses IP publiques tout en gardant les machines virtuelles privées, et elle n'autorise jamais de connexions entrantes non sollicitées. Avec un préfixe d'adresse IP publique, les adresses sources forment une plage contiguë et prévisible que le partenaire peut autoriser. Depuis le 31 mars 2026, les nouveaux réseaux virtuels ont des sous-réseaux privés sans accès sortant par défaut : une méthode sortante explicite est de toute façon nécessaire."
  options:
    b: { en: "Inbound NAT rules publish the VMs to the internet for inbound connections, which the requirements forbid; they do not provide outbound connectivity.", fr: "Les règles NAT entrantes publient les machines virtuelles sur Internet pour des connexions entrantes, ce que les exigences interdisent ; elles ne fournissent pas de connectivité sortante." }
    c: { en: "A private endpoint gives private access to a Private Link resource; it cannot reach an arbitrary API on the internet.", fr: "Un point de terminaison privé donne un accès privé à une ressource Private Link ; il ne permet pas de joindre une API quelconque sur Internet." }
    a: { en: "Point-to-site VPN connects individual clients to the virtual network; it does not give the VMs outbound internet access.", fr: "Le VPN de point à site connecte des clients individuels au réseau virtuel ; il ne donne pas aux machines virtuelles d'accès sortant à Internet." }
references:
  - title: What is Azure NAT Gateway?
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
