id: az700-1b-rt-assoc-region
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has the following resources in a subscription named **Sub1**:

    | Name | Type | Region | Resource group |
    | --- | --- | --- | --- |
    | RT1 | Route table | West Europe | RG-Network |
    | VNet1 | Virtual network | West Europe | RG-Network |
    | VNet2 | Virtual network | North Europe | RG-Network |

    RT1 is associated with a subnet of VNet1. You need the subnet App2 of VNet2 to use the same routes as RT1. When you open the settings of App2, RT1 isn't listed in **Route table**.

    What should you do?
  fr: |
    Contoso dispose des ressources suivantes dans un abonnement nommé **Sub1** :

    | Nom | Type | Région | Groupe de ressources |
    | --- | --- | --- | --- |
    | RT1 | Table de routage | West Europe | RG-Network |
    | VNet1 | Réseau virtuel | West Europe | RG-Network |
    | VNet2 | Réseau virtuel | North Europe | RG-Network |

    RT1 est associée à un sous-réseau de VNet1. Vous devez faire en sorte que le sous-réseau App2 de VNet2 utilise les mêmes itinéraires que RT1. Quand vous ouvrez les paramètres d'App2, RT1 ne figure pas dans **Route table**.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a route table in North Europe with the same routes, and associate it with App2.", fr: "Créer une table de routage en North Europe avec les mêmes itinéraires et l'associer à App2." }
    - id: b
      text: { en: "Move RT1 to a resource group whose location is North Europe, and associate it with App2.", fr: "Déplacer RT1 dans un groupe de ressources situé en North Europe et l'associer à App2." }
    - id: c
      text: { en: "Peer VNet1 and VNet2, and associate RT1 with App2.", fr: "Relier VNet1 et VNet2 par peering, puis associer RT1 à App2." }
    - id: d
      text: { en: "Dissociate RT1 from the subnet of VNet1, and associate it with App2.", fr: "Dissocier RT1 du sous-réseau de VNet1, puis l'associer à App2." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A route table can be associated only with subnets of virtual networks in the same Azure region and subscription as the route table. App2 is in North Europe, so it needs its own route table in that region, with the same routes.
    fr: |
      Une table de routage ne peut être associée qu'aux sous-réseaux de réseaux virtuels situés dans la même région Azure et le même abonnement qu'elle. App2 est en North Europe : il lui faut sa propre table de routage dans cette région, avec les mêmes itinéraires.
  options:
    b: { en: "The location of a resource group doesn't change the region of the resources it contains.", fr: "L'emplacement d'un groupe de ressources ne change pas la région des ressources qu'il contient." }
    c: { en: "Peering doesn't change the region rule for route table associations.", fr: "Le peering ne change pas la règle de région des associations de tables de routage." }
    d: { en: "A route table can serve several subnets; the problem is the region, not an existing association.", fr: "Une table de routage peut servir plusieurs sous-réseaux ; le problème est la région, pas une association existante." }
references:
  - title: Create, change, or delete a route table
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-route-table
