id: az700-1b-resolver-outbound-steps
objective: "1.2.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a virtual network named **VNet1** in West Europe that uses Azure-provided DNS. VNet1 is connected to the on-premises network by a site-to-site VPN, and it contains an empty subnet named **snet-dns-out** that is delegated to `Microsoft.Network/dnsResolvers`.

    The virtual machines of VNet1 must resolve the names of the zone **onprem.contoso.com**, hosted on the on-premises DNS server 192.168.1.10. You must not deploy DNS server virtual machines.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'un réseau virtuel nommé **VNet1** en West Europe qui utilise le DNS fourni par Azure. VNet1 est connecté au réseau local par un VPN site à site et contient un sous-réseau vide nommé **snet-dns-out**, délégué à `Microsoft.Network/dnsResolvers`.

    Les machines virtuelles de VNet1 doivent résoudre les noms de la zone **onprem.contoso.com**, hébergée sur le serveur DNS local 192.168.1.10. Vous ne devez pas déployer de machines virtuelles serveurs DNS.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: resolver, text: { en: "Create a DNS private resolver in VNet1.", fr: "Créer un résolveur DNS privé dans VNet1." } }
    - { id: outbound, text: { en: "Create an outbound endpoint in snet-dns-out.", fr: "Créer un point de terminaison sortant dans snet-dns-out." } }
    - { id: ruleset, text: { en: "Create a DNS forwarding ruleset that uses the outbound endpoint, with a rule for onprem.contoso.com. that targets 192.168.1.10:53.", fr: "Créer un ensemble de règles de transfert DNS qui utilise le point de terminaison sortant, avec une règle pour onprem.contoso.com. qui cible 192.168.1.10:53." } }
    - { id: link, text: { en: "Link the DNS forwarding ruleset to VNet1.", fr: "Lier l'ensemble de règles de transfert DNS à VNet1." } }
    - { id: inbound, text: { en: "Create an inbound endpoint and add it as a conditional forwarder on 192.168.1.10.", fr: "Créer un point de terminaison entrant et l'ajouter comme redirecteur conditionnel sur 192.168.1.10." } }
    - { id: dns, text: { en: "Set the DNS servers of VNet1 to 192.168.1.10.", fr: "Définir les serveurs DNS de VNet1 sur 192.168.1.10." } }
answer:
  sequence: [ resolver, outbound, ruleset, link ]
explanation:
  correct:
    en: |
      The outbound endpoint belongs to a resolver, so the resolver comes first, then the endpoint in its delegated subnet. A forwarding ruleset is attached to an outbound endpoint and holds the rule (the domain name ends with a dot, the target is an IP address and port). The ruleset applies only to the virtual networks it is linked to, so you link it to VNet1 last.
    fr: |
      Le point de terminaison sortant appartient à un résolveur : le résolveur vient en premier, puis le point de terminaison dans son sous-réseau délégué. Un ensemble de règles de transfert est associé à un point de terminaison sortant et contient la règle (le nom de domaine se termine par un point, la cible est une adresse IP et un port). L'ensemble de règles ne s'applique qu'aux réseaux virtuels auxquels il est lié : vous le liez donc à VNet1 en dernier.
  options:
    inbound: { en: "An inbound endpoint serves queries that come from on-premises to Azure; it isn't needed for Azure to on-premises resolution.", fr: "Un point de terminaison entrant sert les requêtes qui vont du réseau local vers Azure ; il n'est pas nécessaire pour la résolution d'Azure vers le réseau local." }
    dns: { en: "Pointing VNet1 at the on-premises server would send every query on premises and would bypass Azure DNS and the ruleset.", fr: "Faire pointer VNet1 vers le serveur local enverrait toutes les requêtes vers le réseau local et contournerait Azure DNS et l'ensemble de règles." }
references:
  - title: Azure DNS Private Resolver endpoints and rulesets
    url: https://learn.microsoft.com/en-us/azure/dns/private-resolver-endpoints-rulesets
