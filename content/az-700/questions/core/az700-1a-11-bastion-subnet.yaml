id: az700-1a-11-bastion-subnet
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You plan to deploy Azure Bastion with the Standard SKU in a virtual network named VNet-Hub. Administrators will use it to connect to virtual machines in peered virtual networks. You want the deployment to support host scaling later without changing the subnet.

    Which subnet should you create in VNet-Hub?
  fr: |
    Vous prévoyez de déployer Azure Bastion avec le SKU Standard dans un réseau virtuel nommé VNet-Hub. Les administrateurs l'utiliseront pour se connecter à des machines virtuelles de réseaux virtuels reliés par peering. Vous voulez que le déploiement prenne en charge plus tard la mise à l'échelle de l'hôte sans modifier le sous-réseau.

    Quel sous-réseau devez-vous créer dans VNet-Hub ?
body:
  options:
    - { id: a, text: { en: "A /27 subnet named AzureBastionSubnet", fr: "Un sous-réseau /27 nommé AzureBastionSubnet" } }
    - { id: b, text: { en: "A /26 subnet named AzureBastionSubnet", fr: "Un sous-réseau /26 nommé AzureBastionSubnet" } }
    - { id: c, text: { en: "A /26 subnet named BastionSubnet", fr: "Un sous-réseau /26 nommé BastionSubnet" } }
    - { id: d, text: { en: "A /27 subnet named GatewaySubnet", fr: "Un sous-réseau /27 nommé GatewaySubnet" } }
answer: { optionId: b }
explanation:
  correct:
    en: Azure Bastion deploys only into a subnet named exactly AzureBastionSubnet, in the virtual network and resource group of the Bastion host. For deployments since November 2, 2021, the subnet must be /26 or larger, which leaves room for host scaling.
    fr: Azure Bastion se déploie uniquement dans un sous-réseau nommé exactement AzureBastionSubnet, dans le réseau virtuel et le groupe de ressources de l'hôte Bastion. Pour les déploiements depuis le 2 novembre 2021, le sous-réseau doit être en /26 ou plus grand, ce qui laisse de la place pour la mise à l'échelle de l'hôte.
  options:
    a: { en: "/27 is accepted only for subnets that existed before November 2, 2021; new deployments need /26 or larger.", fr: "/27 n'est accepté que pour les sous-réseaux existant avant le 2 novembre 2021 ; les nouveaux déploiements exigent /26 ou plus." }
    c: { en: "The subnet name must be exactly AzureBastionSubnet.", fr: "Le nom du sous-réseau doit être exactement AzureBastionSubnet." }
    d: { en: "GatewaySubnet is reserved for VPN and ExpressRoute gateways.", fr: "GatewaySubnet est réservé aux passerelles VPN et ExpressRoute." }
references:
  - title: About Azure Bastion configuration settings
    url: https://learn.microsoft.com/en-us/azure/bastion/configuration-settings
