id: az700-1b-public-dns-record-types
objective: "1.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin hosts the public zone **tailspin.com** in Azure DNS. You are designing the records of the zone.

    Which record set should you create for each requirement? To answer, drag the appropriate record sets to the correct requirements. Each record set may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin héberge la zone publique **tailspin.com** dans Azure DNS. Vous concevez les enregistrements de la zone.

    Quel jeu d'enregistrements devez-vous créer pour chaque exigence ? Pour répondre, faites glisser les jeux d'enregistrements appropriés vers les exigences correspondantes. Chaque jeu d'enregistrements peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: alias, text: { en: "Alias A record set", fr: "Jeu d'enregistrements d'alias A" } }
    - { id: arec, text: { en: "A record set with a static IP address", fr: "Jeu d'enregistrements A avec une adresse IP statique" } }
    - { id: cname, text: { en: "CNAME record set", fr: "Jeu d'enregistrements CNAME" } }
    - { id: caa, text: { en: "CAA record set", fr: "Jeu d'enregistrements CAA" } }
    - { id: mx, text: { en: "MX record set", fr: "Jeu d'enregistrements MX" } }
    - { id: txt, text: { en: "TXT record set", fr: "Jeu d'enregistrements TXT" } }
  targets:
    - id: apex
      text: { en: "tailspin.com must resolve to the Standard public IP address of a load balancer, follow any change of that address, and stop answering if the public IP address is deleted", fr: "tailspin.com doit être résolu en l'adresse IP publique Standard d'un équilibreur de charge, suivre tout changement de cette adresse et ne plus répondre si l'adresse IP publique est supprimée" }
    - id: shop
      text: { en: "shop.tailspin.com must resolve through the host name tailspin-shop.azurewebsites.net", fr: "shop.tailspin.com doit être résolu par le nom d'hôte tailspin-shop.azurewebsites.net" }
    - id: ca
      text: { en: "Only one certificate authority may issue certificates for tailspin.com", fr: "Une seule autorité de certification doit pouvoir émettre des certificats pour tailspin.com" }
    - id: mail
      text: { en: "Email sent to tailspin.com must be delivered to the mail service of the company", fr: "Le courrier envoyé à tailspin.com doit être remis au service de messagerie de l'entreprise" }
answer:
  mapping: { apex: alias, shop: cname, ca: caa, mail: mx }
explanation:
  correct:
    en: |
      An alias A record set can target a Standard public IP resource, even at the apex; it updates when the address changes and becomes empty when the resource is deleted, which prevents a dangling record. A CNAME maps a subdomain to another host name, a CAA record set lists the certificate authorities allowed to issue certificates, and an MX record set routes email for the domain.
    fr: |
      Un jeu d'enregistrements d'alias A peut cibler une ressource d'adresse IP publique Standard, même à l'apex ; il est mis à jour quand l'adresse change et devient vide quand la ressource est supprimée, ce qui évite un enregistrement orphelin. Un CNAME associe un sous-domaine à un autre nom d'hôte, un jeu CAA répertorie les autorités de certification autorisées à émettre des certificats, et un jeu MX achemine le courrier du domaine.
  options:
    arec: { en: "A static A record keeps the old address after a change and keeps answering after the public IP address is deleted.", fr: "Un enregistrement A statique conserve l'ancienne adresse après un changement et continue de répondre après la suppression de l'adresse IP publique." }
    txt: { en: "TXT records carry free text such as domain verification values; they don't route mail or restrict certificate issuance.", fr: "Les enregistrements TXT contiennent du texte libre, par exemple des valeurs de vérification de domaine ; ils n'acheminent pas le courrier et ne limitent pas l'émission de certificats." }
references:
  - title: Azure DNS alias records overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-alias
  - title: Overview of DNS zones and records
    url: https://learn.microsoft.com/en-us/azure/dns/dns-zones-records
