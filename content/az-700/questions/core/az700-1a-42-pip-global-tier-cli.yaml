id: az700-1a-42-pip-global-tier-cli
objective: "1.1.9"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans a global (cross-region) load balancer in front of regional Standard load balancers in France Central and Germany West Central. The global load balancer and its frontend IP address must be deployed in a supported home region in Europe.

    You need to create the frontend public IP address by using the Azure CLI.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit un équilibreur de charge global (inter-régions) devant des équilibreurs de charge Standard régionaux dans les régions France Central et Germany West Central. L'équilibreur de charge global et son adresse IP frontale doivent être déployés dans une région d'accueil prise en charge en Europe.

    Vous devez créer l'adresse IP publique frontale avec Azure CLI.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network public-ip create --resource-group RG-Global \
      --name pip-glb-frontend --location [[loc]] \
      --sku [[sku]] --tier [[tier]] --version IPv4
  slots:
    - id: loc
      options:
        - { id: fr, text: francecentral }
        - { id: we, text: westeurope }
        - { id: de, text: germanywestcentral }
    - id: sku
      options:
        - { id: std, text: Standard }
        - { id: stdv2, text: StandardV2 }
        - { id: basic, text: Basic }
    - id: tier
      options:
        - { id: global, text: Global }
        - { id: regional, text: Regional }
answer:
  values: { loc: we, sku: std, tier: global }
explanation:
  correct:
    en: A global load balancer uses a static anycast public IP address of the Global tier, which only the Standard SKU supports. The global load balancer and its Global tier address can be deployed only in a home region; West Europe is one, unlike France Central and Germany West Central, which can still host the regional backends.
    fr: Un équilibreur de charge global utilise une adresse IP publique anycast statique de niveau Global, que seul le SKU Standard prend en charge. L'équilibreur de charge global et son adresse de niveau Global ne peuvent être déployés que dans une région d'accueil ; West Europe en est une, contrairement à France Central et Germany West Central, qui peuvent toutefois héberger les équilibreurs régionaux principaux.
  options:
    stdv2: { en: "The Global tier isn't supported for Standard v2 public IP addresses.", fr: "Le niveau Global n'est pas pris en charge pour les adresses IP publiques Standard v2." }
    basic: { en: "Basic public IP addresses are retired and never supported the Global tier.", fr: "Les adresses IP publiques Basic sont retirées et n'ont jamais pris en charge le niveau Global." }
    regional: { en: "A Regional tier address can't be the frontend of a global load balancer.", fr: "Une adresse de niveau Régional ne peut pas être l'adresse frontale d'un équilibreur de charge global." }
references:
  - title: Global load balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/cross-region-overview
  - title: az network public-ip
    url: https://learn.microsoft.com/en-us/cli/azure/network/public-ip
