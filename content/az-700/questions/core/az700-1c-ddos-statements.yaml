id: az700-1c-ddos-statements
objective: "1.4.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has the following resources in a Microsoft Entra tenant that contains the subscriptions **Sub-Hub** and **Sub-Apps**:

    | Resource | Subscription | Details |
    | --- | --- | --- |
    | DDoSPlan1 | Sub-Hub | DDoS protection plan in West Europe |
    | VNet-Hub | Sub-Hub | DDoS Network Protection enabled with DDoSPlan1 |
    | VNet-Apps | Sub-Apps | North Europe, no DDoS protection |
    | pip-nat | Sub-Apps | Standard public IP address used by a NAT gateway in VNet-Apps |

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose des ressources suivantes dans un locataire Microsoft Entra qui contient les abonnements **Sub-Hub** et **Sub-Apps** :

    | Ressource | Abonnement | Détails |
    | --- | --- | --- |
    | DDoSPlan1 | Sub-Hub | Plan de protection DDoS dans West Europe |
    | VNet-Hub | Sub-Hub | DDoS Network Protection activée avec DDoSPlan1 |
    | VNet-Apps | Sub-Apps | North Europe, aucune protection DDoS |
    | pip-nat | Sub-Apps | Adresse IP publique Standard utilisée par une passerelle NAT de VNet-Apps |

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "You can enable DDoS Network Protection on VNet-Apps by using DDoSPlan1.", fr: "Vous pouvez activer DDoS Network Protection sur VNet-Apps en utilisant DDoSPlan1." } }
    - { id: b, text: { en: "Enabling DDoS protection for VNet-Apps protects pip-nat.", fr: "L'activation de la protection DDoS pour VNet-Apps protège pip-nat." } }
    - { id: c, text: { en: "You can move VNet-Hub to another resource group while DDoS Network Protection stays enabled.", fr: "Vous pouvez déplacer VNet-Hub vers un autre groupe de ressources tout en laissant DDoS Network Protection activée." } }
    - { id: d, text: { en: "Disabling DDoS Network Protection on VNet-Hub stops the charges for DDoSPlan1.", fr: "La désactivation de DDoS Network Protection sur VNet-Hub arrête la facturation de DDoSPlan1." } }
    - { id: e, text: { en: "You can enable DDoS IP Protection on a public IP address in Sub-Apps without creating a DDoS protection plan.", fr: "Vous pouvez activer DDoS IP Protection sur une adresse IP publique de Sub-Apps sans créer de plan de protection DDoS." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: A DDoS protection plan can protect virtual networks in other regions and other subscriptions of the same Microsoft Entra tenant, so DDoSPlan1 can be used for VNet-Apps. DDoS IP Protection is enabled directly on a public IP resource and doesn't require a DDoS protection plan.
    fr: "Un plan de protection DDoS peut protéger des réseaux virtuels d'autres régions et d'autres abonnements du même locataire Microsoft Entra : DDoSPlan1 peut donc être utilisé pour VNet-Apps. DDoS IP Protection s'active directement sur une ressource adresse IP publique et ne nécessite pas de plan de protection DDoS."
  options:
    b: { en: "Public IP resources attached to a NAT gateway are not supported by DDoS Protection.", fr: "Les ressources adresse IP publique attachées à une passerelle NAT ne sont pas prises en charge par la protection DDoS." }
    c: { en: "A virtual network with DDoS Protection enabled can't be moved; you must disable protection, move it, and enable protection again.", fr: "Un réseau virtuel dont la protection DDoS est activée ne peut pas être déplacé : vous devez désactiver la protection, le déplacer, puis réactiver la protection." }
    d: { en: "Disabling protection doesn't delete the plan, which keeps incurring costs until you delete it.", fr: "Désactiver la protection ne supprime pas le plan, qui continue à générer des coûts jusqu'à sa suppression." }
references:
  - title: "Quickstart: Create and configure Azure DDoS Network Protection using the Azure portal"
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/manage-ddos-protection
  - title: About Azure DDoS Protection Tier Comparison
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-sku-comparison
