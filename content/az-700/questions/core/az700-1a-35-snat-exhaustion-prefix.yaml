id: az700-1a-35-snat-exhaustion-prefix
objective: "1.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has a subnet named snet-workers that hosts 60 virtual machines without public IP addresses. snet-workers is associated with a Standard NAT gateway named natgw1 that has two individual Standard public IP addresses.

    The virtual machines open many connections to a partner API, and natgw1 runs out of SNAT ports during peaks. The partner allows source addresses only through rules in its firewall, and adding a rule takes a month.

    You need to give natgw1 the largest possible number of SNAT ports while asking the partner for a single new firewall rule.

    What should you do?
  fr: |
    Tailspin Toys dispose d'un sous-réseau nommé snet-workers qui héberge 60 machines virtuelles sans adresse IP publique. snet-workers est associé à une passerelle NAT Standard nommée natgw1 qui a deux adresses IP publiques Standard individuelles.

    Les machines virtuelles ouvrent de nombreuses connexions vers une API partenaire, et natgw1 manque de ports SNAT pendant les pics. Le partenaire n'autorise des adresses sources que par des règles dans son pare-feu, et l'ajout d'une règle prend un mois.

    Vous devez donner à natgw1 le plus grand nombre possible de ports SNAT tout en ne demandant qu'une seule nouvelle règle de pare-feu au partenaire.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Add fourteen individual Standard public IP addresses to natgw1.
        fr: Ajouter quatorze adresses IP publiques Standard individuelles à natgw1.
    - id: b
      text:
        en: Assign an instance-level Standard public IP address to each virtual machine.
        fr: Attribuer une adresse IP publique Standard au niveau de l'instance à chaque machine virtuelle.
    - id: c
      text:
        en: Create a /28 public IP prefix, have the partner allow it, and replace the two addresses of natgw1 with the prefix.
        fr: Créer un préfixe d'adresse IP publique /28, le faire autoriser par le partenaire, puis remplacer les deux adresses de natgw1 par le préfixe.
    - id: d
      text:
        en: Add the virtual machines to the backend pool of a public load balancer with outbound rules.
        fr: Ajouter les machines virtuelles au pool principal d'un équilibreur de charge public doté de règles de trafic sortant.
answer: { optionId: c }
explanation:
  correct:
    en: Each public IP address gives a NAT gateway 64,512 SNAT ports, and a NAT gateway can use up to 16 addresses. A /28 prefix provides the 16 addresses in one contiguous range that the partner allows with a single rule; it replaces the two existing addresses, because the total can't exceed 16.
    fr: Chaque adresse IP publique apporte 64 512 ports SNAT à une passerelle NAT, et une passerelle NAT peut utiliser jusqu'à 16 adresses. Un préfixe /28 fournit les 16 adresses dans une plage contiguë que le partenaire autorise par une seule règle ; il remplace les deux adresses existantes, car le total ne peut pas dépasser 16.
  options:
    a: { en: "Fourteen individual addresses would reach the maximum of 16, but they aren't contiguous: each one needs its own rule at the partner.", fr: "Quatorze adresses individuelles atteindraient le maximum de 16, mais elles ne sont pas contiguës : chacune exige sa propre règle chez le partenaire." }
    b: { en: "NAT gateway takes precedence over instance-level public IP addresses for new outbound connections, and the partner would need 60 new addresses.", fr: "La passerelle NAT a priorité sur les adresses IP publiques au niveau de l'instance pour les nouvelles connexions sortantes, et le partenaire devrait autoriser 60 nouvelles adresses." }
    d: { en: "NAT gateway takes precedence over load balancer outbound rules for new connections, so the outbound path wouldn't change.", fr: "La passerelle NAT a priorité sur les règles de trafic sortant de l'équilibreur de charge pour les nouvelles connexions : le chemin sortant ne changerait pas." }
references:
  - title: What is Azure NAT Gateway?
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
  - title: NAT gateway resource
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-gateway-resource
