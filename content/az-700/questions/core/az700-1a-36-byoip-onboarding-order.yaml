id: az700-1a-36-byoip-onboarding-order
objective: "1.1.8"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam owns the range 203.0.113.0/24, registered in its name with RIPE NCC. The range is currently advertised by Fabrikam's on-premises routers, and customers allow it in their firewalls. Fabrikam will move the public services that use this range to the Azure public cloud, in one region.

    The public IP addresses for the Azure services must be ready before Azure starts advertising the range. You have already generated a self-signed certificate and published it in the RIPE record.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam possède la plage 203.0.113.0/24, enregistrée à son nom auprès du RIPE NCC. La plage est actuellement publiée par les routeurs locaux de Fabrikam, et des clients l'autorisent dans leurs pare-feu. Fabrikam va déplacer les services publics qui utilisent cette plage vers le cloud public Azure, dans une seule région.

    Les adresses IP publiques des services Azure doivent être prêtes avant qu'Azure ne commence à publier la plage. Vous avez déjà généré un certificat auto-signé et l'avez publié dans l'enregistrement RIPE.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: roa, text: { en: "Create a Route Origin Authorization (ROA) for origin AS 8075 at RIPE NCC.", fr: "Créer une autorisation d'origine de route (ROA) pour l'AS d'origine 8075 auprès du RIPE NCC." } }
    - { id: sign, text: { en: "Sign the message subscriptionId|203.0.113.0/24|expiration date with the private key of the certificate.", fr: "Signer le message subscriptionId|203.0.113.0/24|date d'expiration avec la clé privée du certificat." } }
    - { id: create, text: { en: "Create the custom IP prefix in Azure with the signed message, and wait for the Provisioned state.", fr: "Créer le préfixe d'adresse IP personnalisé dans Azure avec le message signé, puis attendre l'état Provisioned." } }
    - { id: derive, text: { en: "Derive a public IP prefix from the custom IP prefix, then create and attach the public IP addresses.", fr: "Dériver un préfixe d'adresse IP publique du préfixe personnalisé, puis créer et attacher les adresses IP publiques." } }
    - { id: commission, text: { en: "Commission the custom IP prefix.", fr: "Mettre en service le préfixe d'adresse IP personnalisé." } }
    - { id: roa8070, text: { en: "Create a Route Origin Authorization (ROA) for origin AS 8070 at RIPE NCC.", fr: "Créer une autorisation d'origine de route (ROA) pour l'AS d'origine 8070 auprès du RIPE NCC." } }
    - { id: attachcip, text: { en: "Attach the custom IP prefix to the network interfaces of the Azure services.", fr: "Attacher le préfixe d'adresse IP personnalisé aux interfaces réseau des services Azure." } }
answer:
  sequence: [ roa, sign, create, derive, commission ]
explanation:
  correct:
    en: |
      The ROA authorizes AS 8075 (Microsoft public cloud) to originate the prefix, and the signed message includes the ROA's expiration date. With the signed message, Microsoft validates the range and provisions the custom IP prefix. In the Provisioned state, public IP prefixes and addresses can be derived and attached but aren't advertised, so the services are ready before you commission the prefix, which starts the advertisement.
    fr: |
      La ROA autorise l'AS 8075 (cloud public Microsoft) à être l'origine du préfixe, et le message signé contient la date d'expiration de la ROA. Avec le message signé, Microsoft valide la plage et provisionne le préfixe d'adresse IP personnalisé. À l'état Provisioned, des préfixes et des adresses IP publiques peuvent être dérivés et attachés sans être publiés : les services sont prêts avant la mise en service du préfixe, qui démarre la publication.
  options:
    roa8070: { en: "AS 8070 is used for the US Government cloud; the public cloud uses AS 8075.", fr: "L'AS 8070 est utilisé pour le cloud US Government ; le cloud public utilise l'AS 8075." }
    attachcip: { en: "A custom IP prefix can't be attached to a resource; resources use addresses derived from it.", fr: "Un préfixe d'adresse IP personnalisé ne peut pas être attaché à une ressource ; les ressources utilisent des adresses qui en sont dérivées." }
references:
  - title: Create a custom IPv4 address prefix in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/create-custom-ip-address-prefix-cli
  - title: Custom IP address prefix (BYOIP)
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/custom-ip-address-prefix
