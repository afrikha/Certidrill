id: az700-1a-29-prefix-to-vm-order
objective: "1.1.6"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a virtual machine named VM1 in West Europe. VM1 has one network interface with an IP configuration named ipconfig1 and no public IP address.

    VM1 must receive a public IPv4 address that belongs to a new contiguous range reserved for Wingtip Toys in Azure. More virtual machines will receive addresses from the same range later.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys dispose d'une machine virtuelle nommée VM1 dans la région West Europe. VM1 a une interface réseau avec une configuration IP nommée ipconfig1 et aucune adresse IP publique.

    VM1 doit recevoir une adresse IPv4 publique qui appartient à une nouvelle plage contiguë réservée à Wingtip Toys dans Azure. D'autres machines virtuelles recevront plus tard des adresses de la même plage.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: prefix, text: { en: "Create a public IP prefix in West Europe.", fr: "Créer un préfixe d'adresse IP publique dans la région West Europe." } }
    - { id: pip, text: { en: "Create a Standard public IP address from the prefix.", fr: "Créer une adresse IP publique Standard à partir du préfixe." } }
    - { id: assoc, text: { en: "Associate the public IP address with ipconfig1.", fr: "Associer l'adresse IP publique à ipconfig1." } }
    - { id: prefixnic, text: { en: "Associate the public IP prefix with the network interface of VM1.", fr: "Associer le préfixe d'adresse IP publique à l'interface réseau de VM1." } }
    - { id: cip, text: { en: "Create a custom IP prefix in West Europe.", fr: "Créer un préfixe d'adresse IP personnalisé dans la région West Europe." } }
    - { id: dealloc, text: { en: "Stop and deallocate VM1.", fr: "Arrêter et libérer VM1." } }
answer:
  sequence: [ prefix, pip, assoc ]
explanation:
  correct:
    en: |
      A public IP prefix reserves a range in the region. A virtual machine doesn't use the prefix directly: you create a static Standard public IP address from the prefix, in the same region and subscription, and associate it with the IP configuration of the network interface.
    fr: |
      Un préfixe d'adresse IP publique réserve une plage dans la région. Une machine virtuelle n'utilise pas le préfixe directement : vous créez à partir du préfixe une adresse IP publique Standard statique, dans la même région et le même abonnement, puis vous l'associez à la configuration IP de l'interface réseau.
  options:
    prefixnic: { en: "A prefix can't be associated with a network interface; virtual machines use individual addresses created from the prefix.", fr: "Un préfixe ne peut pas être associé à une interface réseau ; les machines virtuelles utilisent des adresses individuelles créées à partir du préfixe." }
    cip: { en: "A custom IP prefix is for a range that Wingtip Toys already owns (BYOIP), not for a range reserved from Azure.", fr: "Un préfixe d'adresse IP personnalisé concerne une plage que Wingtip Toys possède déjà (BYOIP), pas une plage réservée auprès d'Azure." }
    dealloc: { en: "A public IP address can be associated with a running virtual machine.", fr: "Une adresse IP publique peut être associée à une machine virtuelle en cours d'exécution." }
references:
  - title: Public IP address prefix
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix
  - title: Associate a public IP address to a virtual machine
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/associate-public-ip-address-vm
