id: az700-1c-ft-bgp-dmz-bypass
objective: "1.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has a virtual network named **VNet1** that contains the subnets **App**, **Data** and **DMZ**. A VPN gateway in VNet1 has a BGP-enabled site-to-site connection to the on-premises network. The on-premises routers advertise the following prefixes over BGP:

    - 192.168.0.0/16 (on-premises servers)
    - 0.0.0.0/0 (internet breakout through the on-premises proxy)

    No route table is associated with any subnet. You have the following requirements:

    - Virtual machines in the DMZ subnet must reach the internet directly from Azure.
    - Virtual machines in the DMZ subnet must still reach 192.168.0.0/16 through the VPN gateway.
    - Internet-bound traffic from the App and Data subnets must continue to go on-premises.

    What should you do?
  fr: |
    Tailspin dispose d'un réseau virtuel nommé **VNet1** qui contient les sous-réseaux **App**, **Data** et **DMZ**. Une passerelle VPN de VNet1 possède une connexion de site à site avec BGP vers le réseau local. Les routeurs locaux publient les préfixes suivants par BGP :

    - 192.168.0.0/16 (serveurs locaux)
    - 0.0.0.0/0 (sortie Internet via le proxy local)

    Aucune table de routage n'est associée aux sous-réseaux. Vous avez les exigences suivantes :

    - Les machines virtuelles du sous-réseau DMZ doivent accéder à Internet directement depuis Azure.
    - Les machines virtuelles du sous-réseau DMZ doivent toujours joindre 192.168.0.0/16 via la passerelle VPN.
    - Le trafic à destination d'Internet des sous-réseaux App et Data doit continuer à partir vers le site local.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Associate with DMZ a route table that has gateway route propagation disabled.", fr: "Associer à DMZ une table de routage dont la propagation des itinéraires de passerelle est désactivée." }
    - id: b
      text: { en: "Associate with DMZ a route table that contains a 0.0.0.0/0 route with the next hop type Internet.", fr: "Associer à DMZ une table de routage contenant un itinéraire 0.0.0.0/0 avec le type de tronçon suivant Internet." }
    - id: c
      text: { en: "Assign a Standard SKU public IP address to each virtual machine in the DMZ subnet.", fr: "Attribuer une adresse IP publique de référence SKU Standard à chaque machine virtuelle du sous-réseau DMZ." }
    - id: d
      text: { en: "Ask the network team to stop advertising 0.0.0.0/0 over the BGP session.", fr: "Demander à l'équipe réseau de cesser de publier 0.0.0.0/0 sur la session BGP." }
answer: { optionId: b }
explanation:
  correct:
    en: When a user-defined route and a BGP route have the same prefix, the user-defined route wins. A 0.0.0.0/0 route with the next hop Internet in a route table associated only with DMZ overrides the BGP default route for that subnet, while gateway route propagation stays enabled so that the 192.168.0.0/16 BGP route is still applied. App and Data keep the BGP default route.
    fr: "Lorsqu'un itinéraire défini par l'utilisateur et un itinéraire BGP ont le même préfixe, l'itinéraire défini par l'utilisateur l'emporte. Un itinéraire 0.0.0.0/0 avec le tronçon suivant Internet, dans une table de routage associée uniquement à DMZ, remplace l'itinéraire par défaut BGP pour ce sous-réseau, tandis que la propagation des itinéraires de passerelle reste activée : l'itinéraire BGP 192.168.0.0/16 continue de s'appliquer. App et Data conservent l'itinéraire par défaut BGP."
  options:
    a: { en: "Disabling propagation removes every gateway-learned route from DMZ, including 192.168.0.0/16, so DMZ could no longer reach the on-premises servers.", fr: "Désactiver la propagation supprime de DMZ tous les itinéraires appris de la passerelle, y compris 192.168.0.0/16 : DMZ ne pourrait plus joindre les serveurs locaux." }
    c: { en: "A public IP address does not change routing: the BGP 0.0.0.0/0 route still sends outbound internet traffic from DMZ to the VPN gateway.", fr: "Une adresse IP publique ne modifie pas le routage : l'itinéraire BGP 0.0.0.0/0 envoie toujours le trafic Internet sortant de DMZ vers la passerelle VPN." }
    d: { en: "Withdrawing the default route would also stop forced tunneling for App and Data, which must keep going on-premises.", fr: "Retirer l'itinéraire par défaut arrêterait aussi le tunneling forcé pour App et Data, qui doivent continuer à passer par le site local." }
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
  - title: About forced tunneling for site-to-site configurations
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-site-to-site-tunneling
