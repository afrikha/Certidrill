id: az700-1a-05-segmentation-design
objective: "1.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is redesigning its Azure network. The architects listed three requirements.

    Which design should you use for each requirement? To answer, drag the appropriate designs to the correct requirements. Each design may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys revoit la conception de son réseau Azure. Les architectes ont listé trois exigences.

    Quelle conception devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les conceptions appropriées vers les exigences correspondantes. Chaque conception peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ipam, text: { en: "IP address pools in Azure Virtual Network Manager", fr: "Pools d'adresses IP dans Azure Virtual Network Manager" } }
    - { id: vnets, text: { en: "Separate virtual networks", fr: "Réseaux virtuels distincts" } }
    - { id: subnets, text: { en: "Separate subnets in one virtual network", fr: "Sous-réseaux distincts dans un même réseau virtuel" } }
    - { id: asg, text: { en: "Application security groups in one subnet", fr: "Groupes de sécurité d'application dans un même sous-réseau" } }
    - { id: sep, text: { en: "Service endpoint policies", fr: "Stratégies de point de terminaison de service" } }
  targets:
    - id: t1
      text: { en: "Twenty application teams create their own virtual networks; each new network must receive a range that overlaps no other Azure or on-premises range, without manual tracking", fr: "Vingt équipes applicatives créent leurs propres réseaux virtuels ; chaque nouveau réseau doit recevoir une plage qui ne chevauche aucune autre plage Azure ou locale, sans suivi manuel" }
    - id: t2
      text: { en: "Production and development run in different subscriptions and must be isolated from each other by default", fr: "La production et le développement sont dans des abonnements différents et doivent être isolés l'un de l'autre par défaut" }
    - id: t3
      text: { en: "In the same virtual network, the batch servers must use a NAT gateway for outbound traffic, but the web servers must not", fr: "Dans le même réseau virtuel, les serveurs de traitement par lots doivent utiliser une passerelle NAT pour le trafic sortant, mais pas les serveurs web" }
answer:
  mapping: { t1: ipam, t2: vnets, t3: subnets }
explanation:
  correct:
    en: IPAM in Azure Virtual Network Manager allocates non-overlapping CIDRs from pools automatically, and static allocations can reserve the on-premises ranges. A virtual network belongs to one subscription and is isolated from other virtual networks unless you connect them. A NAT gateway is associated with a subnet, so workloads that need different outbound behavior must be in different subnets.
    fr: |
      L'IPAM d'Azure Virtual Network Manager alloue automatiquement depuis des pools des plages CIDR sans chevauchement, et des allocations statiques peuvent réserver les plages locales. Un réseau virtuel appartient à un seul abonnement et reste isolé des autres réseaux virtuels tant que vous ne les connectez pas. Une passerelle NAT est associée à un sous-réseau : des charges de travail qui ont besoin d'un comportement sortant différent doivent se trouver dans des sous-réseaux différents.
  options:
    asg: { en: "Application security groups group NICs in NSG rules; they don't change outbound connectivity.", fr: "Les groupes de sécurité d'application regroupent des interfaces réseau dans les règles NSG ; ils ne changent pas la connectivité sortante." }
    sep: { en: "Service endpoint policies filter which Azure service resources are reachable over service endpoints.", fr: "Les stratégies de point de terminaison de service filtrent les ressources de service Azure joignables par les points de terminaison de service." }
references:
  - title: What is IP address management (IPAM) in Azure Virtual Network Manager?
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-ip-address-management
  - title: NAT gateway resource
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-gateway-resource
