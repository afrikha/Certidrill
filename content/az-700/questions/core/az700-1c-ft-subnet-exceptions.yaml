id: az700-1c-ft-subnet-exceptions
objective: "1.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware has a virtual network named **VNet1** in West Europe. VNet1 contains a route-based VPN gateway named **VNG1** that has a site-to-site connection to a local network gateway named **LNG-HQ**. LNG-HQ is configured as the Default Site of VNG1.

    VNet1 contains the following subnets:

    | Subnet | Route table | Service endpoints |
    | --- | --- | --- |
    | Frontend | RT1: 0.0.0.0/0, next hop type Internet | None |
    | Backend | None | Microsoft.Storage |

    A storage account named **stlitware** is in West Europe and allows access from the Backend subnet.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un réseau virtuel nommé **VNet1** dans la région West Europe. VNet1 contient une passerelle VPN basée sur des routes nommée **VNG1**, qui possède une connexion de site à site vers une passerelle de réseau local nommée **LNG-HQ**. LNG-HQ est configurée comme site par défaut (Default Site) de VNG1.

    VNet1 contient les sous-réseaux suivants :

    | Sous-réseau | Table de routage | Points de terminaison de service |
    | --- | --- | --- |
    | Frontend | RT1 : 0.0.0.0/0, type de tronçon suivant Internet | Aucun |
    | Backend | Aucune | Microsoft.Storage |

    Un compte de stockage nommé **stlitware** se trouve dans la région West Europe et autorise l'accès depuis le sous-réseau Backend.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Virtual machines in the Frontend subnet send their internet-bound traffic directly to the internet.
        fr: Les machines virtuelles du sous-réseau Frontend envoient leur trafic à destination d'Internet directement vers Internet.
    - id: s2
      text:
        en: Traffic from virtual machines in the Backend subnet to stlitware is sent through the tunnel to LNG-HQ.
        fr: Le trafic des machines virtuelles du sous-réseau Backend vers stlitware est envoyé dans le tunnel vers LNG-HQ.
    - id: s3
      text:
        en: You can change the Default Site of VNG1 from the gateway's Configuration page in the Azure portal.
        fr: Vous pouvez changer le site par défaut de VNG1 depuis la page Configuration de la passerelle dans le portail Azure.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: With a Default Site, internet traffic of every subnet is forced to the site, except subnets whose route table contains a 0.0.0.0/0 user-defined route with the next hop Internet, as Frontend does. Service endpoint routes have longer prefixes than 0.0.0.0/0, so Backend traffic to the storage service stays on the Azure backbone. The Default Site can't be configured in the Azure portal; you set it with PowerShell.
    fr: "Avec un site par défaut, le trafic Internet de tous les sous-réseaux est forcé vers ce site, sauf pour les sous-réseaux dont la table de routage contient un itinéraire défini par l'utilisateur 0.0.0.0/0 avec le tronçon suivant Internet, comme Frontend. Les itinéraires des points de terminaison de service ont des préfixes plus longs que 0.0.0.0/0 : le trafic de Backend vers le service de stockage reste sur le réseau principal Azure. Le site par défaut ne peut pas être configuré dans le portail Azure ; il se définit avec PowerShell."
references:
  - title: Configure forced tunneling using Default Site for site-to-site connections
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/site-to-site-tunneling
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
