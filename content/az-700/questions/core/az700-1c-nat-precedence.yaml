id: az700-1c-nat-precedence
objective: "1.3.9"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has a virtual network named **VNet1** that contains the following subnets:

    | Subnet | Outbound configuration |
    | --- | --- |
    | Web | VMs in the backend pool of a Standard public load balancer that has an outbound rule; NAT gateway **NATGW1** associated with the subnet |
    | App | NAT gateway **NATGW2** associated with the subnet; route table with a 0.0.0.0/0 route, next hop type Virtual appliance, 10.0.9.4 (an NVA) |
    | Jobs | No NAT gateway, no route table |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un réseau virtuel nommé **VNet1** qui contient les sous-réseaux suivants :

    | Sous-réseau | Configuration sortante |
    | --- | --- |
    | Web | Machines virtuelles dans le pool principal d'un équilibreur de charge public Standard doté d'une règle sortante ; passerelle NAT **NATGW1** associée au sous-réseau |
    | App | Passerelle NAT **NATGW2** associée au sous-réseau ; table de routage avec un itinéraire 0.0.0.0/0, type de tronçon suivant Appliance virtuelle, 10.0.9.4 (une NVA) |
    | Jobs | Aucune passerelle NAT, aucune table de routage |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: New outbound internet connections from the Web subnet use the public IP addresses of NATGW1.
        fr: Les nouvelles connexions sortantes vers Internet du sous-réseau Web utilisent les adresses IP publiques de NATGW1.
    - id: s2
      text:
        en: Internet-bound traffic from the App subnet leaves Azure through NATGW2.
        fr: Le trafic à destination d'Internet du sous-réseau App sort d'Azure via NATGW2.
    - id: s3
      text:
        en: To use NATGW1 for the Jobs subnet, you must also add a 0.0.0.0/0 route with the next hop type Internet to the Jobs subnet.
        fr: Pour utiliser NATGW1 pour le sous-réseau Jobs, vous devez aussi ajouter au sous-réseau Jobs un itinéraire 0.0.0.0/0 avec le type de tronçon suivant Internet.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "A NAT gateway takes precedence over load balancer outbound rules and instance-level public IPs for new connections. However, a user-defined route that sends 0.0.0.0/0 to a virtual appliance or a virtual network gateway overrides NAT gateway internet connectivity, so App traffic goes to the NVA. A NAT gateway needs no route table: once associated with a subnet (Jobs can share NATGW1 because it is in the same virtual network), it becomes the subnet's default path to the internet."
    fr: "Une passerelle NAT est prioritaire sur les règles sortantes d'équilibreur de charge et les adresses IP publiques au niveau de l'instance pour les nouvelles connexions. En revanche, un itinéraire défini par l'utilisateur qui envoie 0.0.0.0/0 vers une appliance virtuelle ou une passerelle de réseau virtuel remplace la connectivité Internet de la passerelle NAT : le trafic de App part vers la NVA. Une passerelle NAT n'a besoin d'aucune table de routage : une fois associée à un sous-réseau (Jobs peut partager NATGW1, car il est dans le même réseau virtuel), elle devient le chemin par défaut du sous-réseau vers Internet."
references:
  - title: What is Azure NAT Gateway?
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
  - title: NAT gateway resource
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-gateway-resource
