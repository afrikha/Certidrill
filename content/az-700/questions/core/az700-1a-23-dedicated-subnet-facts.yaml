id: az700-1a-23-dedicated-subnet-facts
objective: "1.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a hub virtual network named VNet-Hub that contains a VPN gateway in GatewaySubnet (10.0.0.0/26) and an Azure Firewall instance in AzureFirewallSubnet (10.0.1.0/26). A spoke subnet named snet-app contains standalone virtual machines.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un réseau virtuel hub nommé VNet-Hub qui contient une passerelle VPN dans GatewaySubnet (10.0.0.0/26) et une instance du Pare-feu Azure dans AzureFirewallSubnet (10.0.1.0/26). Un sous-réseau spoke nommé snet-app contient des machines virtuelles autonomes.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can deploy a network virtual appliance VM in AzureFirewallSubnet to inspect traffic in addition to Azure Firewall.
        fr: Vous pouvez déployer une machine virtuelle d'appliance virtuelle réseau dans AzureFirewallSubnet pour inspecter le trafic en plus du Pare-feu Azure.
    - id: s2
      text:
        en: You can deploy an ExpressRoute gateway in GatewaySubnet next to the VPN gateway.
        fr: Vous pouvez déployer une passerelle ExpressRoute dans GatewaySubnet à côté de la passerelle VPN.
    - id: s3
      text:
        en: You can deploy a virtual machine scale set in snet-app next to the standalone virtual machines.
        fr: Vous pouvez déployer un groupe de machines virtuelles identiques dans snet-app à côté des machines virtuelles autonomes.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: GatewaySubnet is dedicated to virtual network gateways, and a VPN gateway and an ExpressRoute gateway can coexist in it. AzureFirewallSubnet is dedicated to Azure Firewall, so a network virtual appliance needs its own subnet. Virtual machines and virtual machine scale sets don't require a dedicated subnet.
    fr: |
      GatewaySubnet est dédié aux passerelles de réseau virtuel, et une passerelle VPN et une passerelle ExpressRoute peuvent y coexister. AzureFirewallSubnet est dédié au Pare-feu Azure : une appliance virtuelle réseau a besoin de son propre sous-réseau. Les machines virtuelles et les groupes de machines virtuelles identiques n'exigent pas de sous-réseau dédié.
references:
  - title: About VPN Gateway configuration settings
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-gateway-settings
  - title: Integrate Azure services with virtual networks for network isolation
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-for-azure-services
