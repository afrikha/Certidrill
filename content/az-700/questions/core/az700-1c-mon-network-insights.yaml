id: az700-1c-mon-network-insights
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has networking resources in five subscriptions: virtual networks, application gateways, ExpressRoute and VPN connections, load balancers and NAT gateways.

    The network operations manager wants a single place to see the health status and key metrics of all these resources, with the alerts raised for each resource type, without installing agents or configuring data collection first.

    What should you use?
  fr: |
    Contoso possède des ressources réseau dans cinq abonnements : réseaux virtuels, passerelles d'application, connexions ExpressRoute et VPN, équilibreurs de charge et passerelles NAT.

    Le responsable de l'exploitation réseau souhaite un emplacement unique pour voir l'état d'intégrité et les principales métriques de toutes ces ressources, avec les alertes déclenchées pour chaque type de ressource, sans installer d'agents ni configurer au préalable une collecte de données.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Network insights in Azure Monitor", fr: "Les insights réseau (Network insights) d'Azure Monitor" }
    - id: b
      text: { en: "Traffic analytics in Network Watcher", fr: "Traffic analytics dans Network Watcher" }
    - id: c
      text: { en: "Connection monitor in Network Watcher", fr: "Le Moniteur de connexion dans Network Watcher" }
    - id: d
      text: { en: "Azure Resource Graph Explorer", fr: "L'Explorateur Azure Resource Graph" }
answer: { optionId: a }
explanation:
  correct:
    en: Azure Monitor Network insights gives a visual view of the topology, health and metrics of all deployed networking resources across subscriptions without requiring any configuration. Its Network health view shows one tile per resource type with health status, an alert box, and resource views; it also links to Connection monitor, flow logs, traffic analytics and the Network Watcher diagnostic tools.
    fr: "Les insights réseau d'Azure Monitor offrent une vue visuelle de la topologie, de l'intégrité et des métriques de toutes les ressources réseau déployées dans plusieurs abonnements, sans aucune configuration. La vue Network health affiche une vignette par type de ressource avec l'état d'intégrité, une zone d'alertes et des vues de ressource ; elle donne aussi accès au Moniteur de connexion, aux journaux de flux, à traffic analytics et aux outils de diagnostic de Network Watcher."
  options:
    b: { en: "Traffic analytics requires flow logs and a Log Analytics workspace, and it analyzes traffic flows rather than resource health.", fr: "Traffic analytics nécessite des journaux de flux et un espace de travail Log Analytics, et il analyse les flux de trafic plutôt que l'intégrité des ressources." }
    c: { en: "Connection monitor tests connectivity between endpoints that you configure; it doesn't show the health of every resource type.", fr: "Le Moniteur de connexion teste la connectivité entre des points de terminaison que vous configurez ; il n'affiche pas l'intégrité de chaque type de ressource." }
    d: { en: "Resource Graph queries resource properties; it doesn't provide health status, metrics and alerts dashboards.", fr: "Resource Graph interroge les propriétés des ressources ; il ne fournit pas de tableaux de bord d'intégrité, de métriques et d'alertes." }
references:
  - title: Network insights
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-insights-overview
