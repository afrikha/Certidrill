id: az700-1c-mdc-subnet-nsg-rec
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a virtual network named **VNet-Hub** that contains the following subnets:

    | Subnet | Network security group |
    | --- | --- |
    | Shared | None |
    | GatewaySubnet | None |
    | AzureFirewallSubnet | None |
    | AzureBastionSubnet | NSG-Bastion |

    Microsoft Defender for Cloud displays the recommendation **Subnets should be associated with a network security group** for VNet-Hub. You need to remediate the recommendation without associating an NSG with a subnet where the recommendation doesn't apply.

    Which subnets should you associate with an NSG?
  fr: |
    Northwind dispose d'un réseau virtuel nommé **VNet-Hub** qui contient les sous-réseaux suivants :

    | Sous-réseau | Groupe de sécurité réseau |
    | --- | --- |
    | Shared | Aucun |
    | GatewaySubnet | Aucun |
    | AzureFirewallSubnet | Aucun |
    | AzureBastionSubnet | NSG-Bastion |

    Microsoft Defender for Cloud affiche la recommandation **Subnets should be associated with a network security group** pour VNet-Hub. Vous devez corriger la recommandation sans associer de NSG à un sous-réseau auquel la recommandation ne s'applique pas.

    À quels sous-réseaux devez-vous associer un NSG ?
body:
  options:
    - id: a
      text: { en: "Shared only", fr: "Shared uniquement" }
    - id: b
      text: { en: "Shared and GatewaySubnet only", fr: "Shared et GatewaySubnet uniquement" }
    - id: c
      text: { en: "Shared and AzureFirewallSubnet only", fr: "Shared et AzureFirewallSubnet uniquement" }
    - id: d
      text: { en: "Shared, GatewaySubnet and AzureFirewallSubnet", fr: "Shared, GatewaySubnet et AzureFirewallSubnet" }
answer: { optionId: a }
explanation:
  correct:
    en: The recommendation asks that subnets be protected by a network security group, but GatewaySubnet, AzureFirewallSubnet and AzureBastionSubnet are not applicable to it. Only Shared is a regular subnet without an NSG, so associating an NSG with Shared remediates the recommendation for VNet-Hub.
    fr: "La recommandation demande que les sous-réseaux soient protégés par un groupe de sécurité réseau, mais GatewaySubnet, AzureFirewallSubnet et AzureBastionSubnet n'y sont pas concernés. Seul Shared est un sous-réseau ordinaire sans NSG : associer un NSG à Shared corrige la recommandation pour VNet-Hub."
  options:
    b: { en: "GatewaySubnet is not applicable to this recommendation, and NSGs on the gateway subnet can disrupt the gateway.", fr: "GatewaySubnet n'est pas concerné par cette recommandation, et un NSG sur le sous-réseau de passerelle peut perturber la passerelle." }
    c: { en: "AzureFirewallSubnet is not applicable to this recommendation; Azure Firewall filters traffic itself.", fr: "AzureFirewallSubnet n'est pas concerné par cette recommandation ; le Pare-feu Azure filtre lui-même le trafic." }
    d: { en: "Neither GatewaySubnet nor AzureFirewallSubnet is in scope of the recommendation.", fr: "Ni GatewaySubnet ni AzureFirewallSubnet ne sont dans le périmètre de la recommandation." }
references:
  - title: Networking security recommendations
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/recommendations-reference-networking
