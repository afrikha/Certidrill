id: az700-1c-ddos-alert-config
objective: "1.4.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has enabled DDoS Network Protection on a virtual network that hosts a public load balancer with the frontend public IP address **pip-lb-web**.

    You need to create an Azure Monitor alert rule that notifies the security team as soon as an attack mitigation starts on pip-lb-web.

    How should you configure the alert rule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam a activé DDoS Network Protection sur un réseau virtuel qui héberge un équilibreur de charge public dont l'adresse IP publique frontale est **pip-lb-web**.

    Vous devez créer une règle d'alerte Azure Monitor qui avertit l'équipe de sécurité dès qu'une atténuation d'attaque commence sur pip-lb-web.

    Comment devez-vous configurer la règle d'alerte ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Scope, resource type: [[scope]]
      Condition, signal name: [[signal]]
      Aggregation type: [[agg]]
      Operator and threshold value: [[thr]]
    fr: |
      Étendue, type de ressource : [[scope]]
      Condition, nom du signal : [[signal]]
      Type d'agrégation : [[agg]]
      Opérateur et valeur de seuil : [[thr]]
  slots:
    - id: scope
      options:
        - { id: pip, text: Public IP addresses }
        - { id: plan, text: DDoS protection plans }
        - { id: vnet, text: Virtual networks }
    - id: signal
      options:
        - { id: under, text: Under DDoS attack or not }
        - { id: avail, text: Data Path Availability }
        - { id: dropped, text: Inbound packets dropped DDoS }
    - id: agg
      options:
        - { id: avg, text: Average }
        - { id: max, text: Maximum }
        - { id: total, text: Total }
    - id: thr
      options:
        - { id: lt1, text: { en: "Less than 1", fr: "Less than (inférieur à) 1" } }
        - { id: ge100, text: { en: "Greater than or equal to 100", fr: "Greater than or equal to (supérieur ou égal à) 100" } }
        - { id: ge1, text: { en: "Greater than or equal to 1", fr: "Greater than or equal to (supérieur ou égal à) 1" } }
answer:
  values: { scope: pip, signal: under, agg: max, thr: ge1 }
explanation:
  correct:
    en: DDoS metrics are emitted by the protected public IP address resource. The Under DDoS attack or not metric (IfUnderDDoSAttack) is 0 when the IP address is not under attack and 1 when it is, and it supports only the Maximum aggregation. An alert with Maximum, Greater than or equal to 1 therefore fires when mitigation starts.
    fr: "Les métriques DDoS sont émises par la ressource adresse IP publique protégée. La métrique Under DDoS attack or not (IfUnderDDoSAttack) vaut 0 lorsque l'adresse IP n'est pas attaquée et 1 lorsqu'elle l'est, et elle ne prend en charge que l'agrégation Maximum. Une alerte avec Maximum, supérieur ou égal à 1 se déclenche donc au début de l'atténuation."
  options:
    plan: { en: "The protection plan doesn't emit the per-IP attack metrics.", fr: "Le plan de protection n'émet pas les métriques d'attaque par adresse IP." }
    vnet: { en: "The virtual network doesn't emit the DDoS attack metrics; the public IP address does.", fr: "Le réseau virtuel n'émet pas les métriques d'attaque DDoS ; c'est l'adresse IP publique qui les émet." }
    avail: { en: "Data Path Availability measures availability of the frontend, not whether an attack is in progress.", fr: "Data Path Availability mesure la disponibilité du frontal, pas l'existence d'une attaque en cours." }
    dropped: { en: "Inbound packets dropped DDoS measures the rate of scrubbed packets, not the attack state; the signal that reports whether the IP address is under attack is Under DDoS attack or not.", fr: "Inbound packets dropped DDoS mesure le débit de paquets nettoyés, pas l'état d'attaque ; le signal qui indique si l'adresse IP est attaquée est Under DDoS attack or not." }
    avg: { en: "Only the Maximum aggregation is supported for this metric.", fr: "Seule l'agrégation Maximum est prise en charge pour cette métrique." }
    lt1: { en: "Less than 1 would fire when the IP address is not under attack.", fr: "Inférieur à 1 se déclencherait lorsque l'adresse IP n'est pas attaquée." }
    ge100: { en: "The metric only takes the values 0 and 1, so this condition would never be met.", fr: "La métrique ne prend que les valeurs 0 et 1 : cette condition ne serait jamais remplie." }
references:
  - title: "Tutorial: Configure Azure DDoS Protection metric alerts through portal"
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/alerts
  - title: Azure DDoS Protection monitoring data reference
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/monitor-ddos-protection-reference
