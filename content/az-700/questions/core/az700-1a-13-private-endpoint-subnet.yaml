id: az700-1a-13-private-endpoint-subnet
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a virtual network named VNet1 that contains a subnet named Subnet3 (10.30.3.0/24). Subnet3 hosts virtual machines and has a network security group named NSG3. The private endpoint network policy of Subnet3 is left at its default value.

    You plan to create a private endpoint for a storage account in Subnet3.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un réseau virtuel nommé VNet1 qui contient un sous-réseau nommé Subnet3 (10.30.3.0/24). Subnet3 héberge des machines virtuelles et est associé à un groupe de sécurité réseau nommé NSG3. La stratégie réseau des points de terminaison privés de Subnet3 est conservée à sa valeur par défaut.

    Vous prévoyez de créer un point de terminaison privé pour un compte de stockage dans Subnet3.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: The private endpoint receives a private IP address from the range of Subnet3.
        fr: Le point de terminaison privé reçoit une adresse IP privée de la plage de Subnet3.
    - id: b
      text:
        en: The inbound rules of NSG3 filter the traffic that reaches the private endpoint.
        fr: Les règles entrantes de NSG3 filtrent le trafic qui atteint le point de terminaison privé.
    - id: c
      text:
        en: The virtual machines must be moved out of Subnet3 before the private endpoint can be created.
        fr: Les machines virtuelles doivent être déplacées hors de Subnet3 avant de pouvoir créer le point de terminaison privé.
    - id: d
      text:
        en: If Subnet3 were delegated to Microsoft.Web/serverFarms, the private endpoint couldn't be created in it.
        fr: Si Subnet3 était délégué à Microsoft.Web/serverFarms, le point de terminaison privé ne pourrait pas y être créé.
    - id: e
      text:
        en: The private endpoint requires the Microsoft.Storage service endpoint on Subnet3.
        fr: Le point de terminaison privé exige le point de terminaison de service Microsoft.Storage sur Subnet3.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: A private endpoint is a network interface that takes a private IP address from the subnet in which you create it. A delegated subnet can't be used for a private endpoint.
    fr: Un point de terminaison privé est une interface réseau qui prend une adresse IP privée dans le sous-réseau où vous le créez. Un sous-réseau délégué ne peut pas être utilisé pour un point de terminaison privé.
  options:
    b: { en: "By default, network policies are disabled for private endpoints: NSG rules apply to them only when the policy is set to Enabled or NetworkSecurityGroupEnabled.", fr: "Par défaut, les stratégies réseau sont désactivées pour les points de terminaison privés : les règles NSG ne s'y appliquent que si la stratégie vaut Enabled ou NetworkSecurityGroupEnabled." }
    c: { en: "Private endpoints can share a subnet with virtual machines and other resources.", fr: "Les points de terminaison privés peuvent partager un sous-réseau avec des machines virtuelles et d'autres ressources." }
    e: { en: "Service endpoints and private endpoints are independent features; a private endpoint doesn't need a service endpoint.", fr: "Les points de terminaison de service et les points de terminaison privés sont des fonctionnalités indépendantes ; un point de terminaison privé n'a pas besoin d'un point de terminaison de service." }
references:
  - title: Manage network policies for private endpoints
    url: https://learn.microsoft.com/en-us/azure/private-link/disable-private-endpoint-network-policy
  - title: What is subnet delegation?
    url: https://learn.microsoft.com/en-us/azure/virtual-network/subnet-delegation-overview
