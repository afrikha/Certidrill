id: az700-1c-nw-packet-capture-prereq
objective: "1.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a Windows virtual machine named **VM1** and a storage account named **stcapture**. No VM extension is installed on VM1, and **Allow storage account key access** is disabled on stcapture.

    You need to start a Network Watcher packet capture on VM1 that saves the capture file to a container in stcapture.

    Which two actions should you perform?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'une machine virtuelle Windows nommée **VM1** et d'un compte de stockage nommé **stcapture**. Aucune extension de machine virtuelle n'est installée sur VM1, et **Allow storage account key access** (autoriser l'accès par clé du compte de stockage) est désactivé sur stcapture.

    Vous devez démarrer une capture de paquets Network Watcher sur VM1 qui enregistre le fichier de capture dans un conteneur de stcapture.

    Quelles sont les deux actions à effectuer ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install the Network Watcher Agent extension on VM1.", fr: "Installer l'extension Network Watcher Agent sur VM1." } }
    - { id: b, text: { en: "Enable storage account key access on stcapture.", fr: "Activer l'accès par clé du compte de stockage sur stcapture." } }
    - { id: c, text: { en: "Install the Azure Monitor Agent on VM1 and create a data collection rule.", fr: "Installer l'agent Azure Monitor sur VM1 et créer une règle de collecte de données." } }
    - { id: d, text: { en: "Enable IP forwarding on the network interface of VM1.", fr: "Activer le transfert IP sur l'interface réseau de VM1." } }
    - { id: e, text: { en: "Create a virtual network flow log for the virtual network of VM1.", fr: "Créer un journal de flux de réseau virtuel pour le réseau virtuel de VM1." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: Packet capture requires the Network Watcher Agent VM extension (AzureNetworkWatcherExtension) on the target VM. To write the capture to Azure Storage, packet capture uses SAS tokens, so key access must be enabled on the storage account; otherwise the capture can only be saved to the VM's local disk.
    fr: "La capture de paquets nécessite l'extension de machine virtuelle Network Watcher Agent (AzureNetworkWatcherExtension) sur la machine virtuelle cible. Pour écrire la capture dans Stockage Azure, la capture de paquets utilise des jetons SAS : l'accès par clé doit donc être activé sur le compte de stockage ; sinon, la capture ne peut être enregistrée que sur le disque local de la machine virtuelle."
  options:
    c: { en: "The Azure Monitor Agent collects logs and metrics; packet capture uses the Network Watcher Agent extension.", fr: "L'agent Azure Monitor collecte des journaux et des métriques ; la capture de paquets utilise l'extension Network Watcher Agent." }
    d: { en: "IP forwarding lets a VM forward traffic for other destinations; it isn't required to capture packets.", fr: "Le transfert IP permet à une machine virtuelle de transférer du trafic vers d'autres destinations ; il n'est pas nécessaire pour capturer des paquets." }
    e: { en: "A flow log records flow metadata and is independent of packet capture.", fr: "Un journal de flux enregistre les métadonnées des flux et est indépendant de la capture de paquets." }
references:
  - title: Packet capture overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/packet-capture-overview
