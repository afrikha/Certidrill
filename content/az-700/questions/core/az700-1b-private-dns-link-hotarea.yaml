id: az700-1b-private-dns-link-hotarea
objective: "1.2.6"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has a private DNS zone named **corp.woodgrove.internal**. The following table shows four virtual networks, their link to the zone and their DNS settings. The DNS server 10.20.0.4 is a virtual machine in VNet2 that forwards every query to the on-premises DNS server 192.168.10.4. The on-premises DNS server doesn't host corp.woodgrove.internal.

    Answer each prompt by selecting the appropriate virtual network in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'une zone DNS privée nommée **corp.woodgrove.internal**. Le tableau suivant présente quatre réseaux virtuels, leur lien avec la zone et leurs paramètres DNS. Le serveur DNS 10.20.0.4 est une machine virtuelle de VNet2 qui transfère toutes les requêtes au serveur DNS local 192.168.10.4. Le serveur DNS local n'héberge pas corp.woodgrove.internal.

    Répondez à chaque consigne en sélectionnant le réseau virtuel approprié dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The virtual network whose virtual machines get A records in corp.woodgrove.internal automatically", fr: "Le réseau virtuel dont les machines virtuelles obtiennent automatiquement des enregistrements A dans corp.woodgrove.internal" }
    - id: p2
      text: { en: "The virtual network whose virtual machines can resolve corp.woodgrove.internal only after you change its DNS settings", fr: "Le réseau virtuel dont les machines virtuelles ne peuvent résoudre corp.woodgrove.internal qu'après une modification de ses paramètres DNS" }
  grid:
    header: [{ en: "Virtual network", fr: "Réseau virtuel" }, { en: "Linked to the zone", fr: "Lié à la zone" }, { en: "Autoregistration", fr: "Inscription automatique" }, { en: "DNS servers", fr: "Serveurs DNS" }]
    rows:
      - [{ text: VNet1, area: vnet1 }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: "Disabled", fr: "Désactivée" } }, { text: { en: "Default (Azure-provided)", fr: "Par défaut (fourni par Azure)" } }]
      - [{ text: VNet2, area: vnet2 }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: "Disabled", fr: "Désactivée" } }, { text: { en: "Custom: 10.20.0.4", fr: "Personnalisé : 10.20.0.4" } }]
      - [{ text: VNet3, area: vnet3 }, { text: { en: "Yes", fr: "Oui" } }, { text: { en: "Enabled", fr: "Activée" } }, { text: { en: "Default (Azure-provided)", fr: "Par défaut (fourni par Azure)" } }]
      - [{ text: VNet4, area: vnet4 }, { text: { en: "No", fr: "Non" } }, { text: "-" }, { text: { en: "Default (Azure-provided)", fr: "Par défaut (fourni par Azure)" } }]
answer:
  values: { p1: vnet3, p2: vnet2 }
explanation:
  correct:
    en: |
      Only a link with autoregistration enabled makes a virtual network a registration virtual network, so only VNet3's virtual machines get records. VNet2 is linked, but its virtual machines send their queries to 10.20.0.4, which forwards everything on premises instead of to 168.63.129.16; switching VNet2 to Azure-provided DNS (or making its DNS server forward the zone to 168.63.129.16) is needed. VNet4 isn't linked, so changing its DNS settings alone isn't enough.
    fr: |
      Seul un lien avec l'inscription automatique activée fait d'un réseau virtuel un réseau virtuel d'inscription : seules les machines virtuelles de VNet3 obtiennent des enregistrements. VNet2 est lié, mais ses machines virtuelles envoient leurs requêtes à 10.20.0.4, qui transfère tout vers le réseau local au lieu de 168.63.129.16 ; il faut passer VNet2 au DNS fourni par Azure (ou faire transférer la zone à 168.63.129.16 par son serveur DNS). VNet4 n'est pas lié : modifier ses paramètres DNS ne suffit pas.
references:
  - title: What is a virtual network link?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-virtual-network-links
  - title: What is Azure DNS Private Resolver?
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
