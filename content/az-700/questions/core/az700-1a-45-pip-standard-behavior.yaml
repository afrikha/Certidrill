id: az700-1a-45-pip-standard-behavior
objective: "1.1.9"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum created a public IP address named pip-vm1 in West Europe with the following settings: SKU Standard, IPv4, zone-redundant, DNS name label adatum-vm1. pip-vm1 is associated with the network interface of a Windows virtual machine named VM1. No network security group is associated with the network interface of VM1 or with its subnet.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum a créé une adresse IP publique nommée pip-vm1 dans la région West Europe avec les paramètres suivants : SKU Standard, IPv4, redondante interzone, étiquette de nom DNS adatum-vm1. pip-vm1 est associée à l'interface réseau d'une machine virtuelle Windows nommée VM1. Aucun groupe de sécurité réseau n'est associé à l'interface réseau de VM1 ni à son sous-réseau.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An administrator on the internet can connect to VM1 by using RDP on TCP 3389 through pip-vm1.
        fr: Un administrateur sur Internet peut se connecter à VM1 en RDP sur TCP 3389 par pip-vm1.
    - id: s2
      text:
        en: If VM1 is stopped and deallocated, pip-vm1 keeps its IP address.
        fr: Si VM1 est arrêtée et libérée, pip-vm1 conserve son adresse IP.
    - id: s3
      text:
        en: Clients can resolve the name adatum-vm1.westeurope.cloudapp.azure.com to the address of pip-vm1.
        fr: Des clients peuvent résoudre le nom adatum-vm1.westeurope.cloudapp.azure.com en l'adresse de pip-vm1.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Standard public IP addresses are secure by default and closed to inbound traffic; an NSG must allow the flow, so RDP isn't possible here. Standard addresses are static: the address is released only when the public IP address resource is deleted. A DNS name label creates the name label.region.cloudapp.azure.com in Azure-managed DNS.
    fr: |
      Les adresses IP publiques Standard sont sécurisées par défaut et fermées au trafic entrant ; un NSG doit autoriser le flux : RDP n'est donc pas possible ici. Les adresses Standard sont statiques : l'adresse n'est libérée qu'à la suppression de la ressource d'adresse IP publique. Une étiquette de nom DNS crée le nom étiquette.région.cloudapp.azure.com dans le DNS géré par Azure.
references:
  - title: Public IP addresses in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses
