id: az700-cs2b-nat-precedence
objective: "1.3.10"
type: single
caseStudy: az700-cs2b-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You deploy natgw-ops by using the Standard SKU, associate ippre-ops with it, and associate natgw-ops with snet-ops. You make no other change.

    VM-SFTP1 then opens a new connection to the SFTP server of Fabrikam Freight. Which source IP address does the SFTP server see?
  fr: |
    Vous déployez natgw-ops avec la référence SKU Standard, vous lui associez ippre-ops et vous associez natgw-ops à snet-ops. Vous n'effectuez aucune autre modification.

    VM-SFTP1 ouvre ensuite une nouvelle connexion vers le serveur SFTP de Fabrikam Freight. Quelle adresse IP source le serveur SFTP voit-il ?
body:
  options:
    - { id: a, text: { en: "The address of pip-sftp1", fr: "L'adresse de pip-sftp1" } }
    - { id: b, text: { en: "An address of ippre-ops", fr: "Une adresse de ippre-ops" } }
    - { id: c, text: { en: "The frontend address used by the outbound rule of lb-ops", fr: "L'adresse frontale utilisée par la règle de trafic sortant de lb-ops" } }
    - { id: d, text: { en: "A public address of the Rotterdam proxies, reached over ER-AMS", fr: "Une adresse publique des proxys de Rotterdam, atteints par ER-AMS" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For new connections, a NAT gateway takes precedence over the other outbound methods of the subnet, including instance-level public IP addresses and load balancer outbound rules. Only a user-defined route that sends 0.0.0.0/0 to a virtual appliance or a virtual network gateway would override it, and snet-ops has no route table. A NAT gateway doesn't accept unsolicited inbound connections, but the inbound pushes of Fabrikam Freight still arrive on pip-sftp1.
    fr: |
      Pour les nouvelles connexions, une passerelle NAT est prioritaire sur les autres méthodes de sortie du sous-réseau, y compris les adresses IP publiques au niveau de l'instance et les règles de trafic sortant d'un équilibreur de charge. Seul un itinéraire défini par l'utilisateur qui envoie 0.0.0.0/0 vers une appliance virtuelle ou une passerelle de réseau virtuel la supplanterait, et snet-ops n'a pas de table de routage. Une passerelle NAT n'accepte pas de connexions entrantes non sollicitées, mais les dépôts entrants de Fabrikam Freight arrivent toujours sur pip-sftp1.
  options:
    a: { en: "Before the change, VM-SFTP1 used pip-sftp1 for outbound connections; the NAT gateway now takes precedence over the instance-level public IP address.", fr: "Avant la modification, VM-SFTP1 utilisait pip-sftp1 pour ses connexions sortantes ; la passerelle NAT est désormais prioritaire sur l'adresse IP publique au niveau de l'instance." }
    c: { en: "Load balancer outbound rules come after the NAT gateway and after instance-level public IP addresses.", fr: "Les règles de trafic sortant de l'équilibreur de charge passent après la passerelle NAT et après les adresses IP publiques au niveau de l'instance." }
    d: { en: "VNet-Ops doesn't use the remote gateway of VNet-Hub, so it doesn't learn the 0.0.0.0/0 route advertised over ER-AMS.", fr: "VNet-Ops n'utilise pas la passerelle distante de VNet-Hub : il n'apprend donc pas l'itinéraire 0.0.0.0/0 publié sur ER-AMS." }
references:
  - title: What is Azure NAT Gateway?
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
