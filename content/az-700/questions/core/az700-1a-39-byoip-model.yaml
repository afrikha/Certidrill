id: az700-1a-39-byoip-model
objective: "1.1.8"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum owns the range 192.0.2.0/24 and wants to bring it to Azure. Half of the range will be used by workloads in West Europe, managed in subscription Sub-EU, and the other half by workloads in East US, managed in subscription Sub-US. Both subscriptions are in the same Microsoft Entra tenant.

    How should you plan the custom IP prefixes? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum possède la plage 192.0.2.0/24 et veut l'apporter dans Azure. La moitié de la plage sera utilisée par des charges de travail de la région West Europe, gérées dans l'abonnement Sub-EU, et l'autre moitié par des charges de travail de la région East US, gérées dans l'abonnement Sub-US. Les deux abonnements font partie du même locataire Microsoft Entra.

    Comment devez-vous planifier les préfixes d'adresses IP personnalisés ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      192.0.2.0/24 is created as: [[parent]]

      Validation with the ROA and the signed message is required for: [[valid]]

      Size of the prefix created in each region: [[child]]
    fr: |
      192.0.2.0/24 est créé en tant que : [[parent]]

      La validation par la ROA et le message signé est requise pour : [[valid]]

      Taille du préfixe créé dans chaque région : [[child]]
  slots:
    - id: parent
      options:
        - { id: global, text: { en: "A global custom IP prefix", fr: "Un préfixe d'adresse IP personnalisé global" } }
        - { id: regional, text: { en: "A regional custom IP prefix", fr: "Un préfixe d'adresse IP personnalisé régional" } }
        - { id: unified, text: { en: "A unified custom IP prefix", fr: "Un préfixe d'adresse IP personnalisé unifié" } }
        - { id: pubprefix, text: { en: "A public IP prefix", fr: "Un préfixe d'adresse IP publique" } }
    - id: valid
      options:
        - { id: parentonly, text: { en: "The global prefix only", fr: "Le préfixe global uniquement" } }
        - { id: childonly, text: { en: "Each regional prefix only", fr: "Chaque préfixe régional uniquement" } }
        - { id: both, text: { en: "The global prefix and each regional prefix", fr: "Le préfixe global et chaque préfixe régional" } }
    - id: child
      options:
        - { id: c24, text: /24 }
        - { id: c25, text: /25 }
        - { id: c28, text: /28 }
answer:
  values: { parent: global, valid: parentonly, child: c25 }
explanation:
  correct:
    en: The global/regional model fits a range split across regions or teams. The /24 is created as the global (parent) custom IP prefix, advertised by the Microsoft WAN, and only this global range is validated. Regional (child) prefixes from /22 to /26, at least one size smaller than the parent, are derived in each region and can be in other subscriptions of the same tenant. Two /25 halves cover the range.
    fr: Le modèle global/régional convient à une plage répartie entre régions ou équipes. Le /24 est créé en tant que préfixe d'adresse IP personnalisé global (parent), publié par le WAN de Microsoft, et seule cette plage globale est validée. Des préfixes régionaux (enfants) de /22 à /26, au moins une taille plus petits que le parent, sont dérivés dans chaque région et peuvent se trouver dans d'autres abonnements du même locataire. Deux moitiés /25 couvrent la plage.
  options:
    unified: { en: "A unified prefix is advertised by a single Azure region, so it doesn't fit a range split between two regions.", fr: "Un préfixe unifié est publié par une seule région Azure : il ne convient pas à une plage répartie entre deux régions." }
    childonly: { en: "Regional ranges are derived from the global range without their own validation.", fr: "Les plages régionales sont dérivées de la plage globale sans validation propre." }
    both: { en: "Only the global range is validated during provisioning.", fr: "Seule la plage globale est validée lors du provisionnement." }
    regional: { en: "The /24 must be the parent; regional prefixes are the children carved from it.", fr: "Le /24 doit être le parent ; les préfixes régionaux sont les enfants qui en sont issus." }
    pubprefix: { en: "Public IP prefixes are derived from a custom IP prefix; they don't onboard the range.", fr: "Les préfixes d'adresses IP publiques sont dérivés d'un préfixe personnalisé ; ils n'intègrent pas la plage." }
    c24: { en: "A regional prefix must be at least one size smaller than its parent.", fr: "Un préfixe régional doit être au moins une taille plus petit que son parent." }
    c28: { en: "Regional IPv4 prefixes range from /22 to /26.", fr: "Les préfixes IPv4 régionaux vont de /22 à /26." }
references:
  - title: Create a custom IPv4 address prefix in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/create-custom-ip-address-prefix-cli
  - title: Custom IP address prefix (BYOIP)
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/custom-ip-address-prefix
