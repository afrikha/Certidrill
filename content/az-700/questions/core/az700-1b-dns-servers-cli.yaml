id: az700-1b-dns-servers-cli
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has a virtual network named **VNet1** in a resource group named **RG1**. VNet1 contains 40 virtual machines, including **VM5**, whose network interface is named **vm5-nic**.

    You need to configure the following DNS settings by using Azure CLI:

    - All the virtual machines of VNet1 must use the DNS servers 10.1.0.4 and 10.1.0.5.
    - VM5 only must use the DNS server 10.1.0.6.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un réseau virtuel nommé **VNet1** dans un groupe de ressources nommé **RG1**. VNet1 contient 40 machines virtuelles, dont **VM5**, dont l'interface réseau se nomme **vm5-nic**.

    Vous devez configurer les paramètres DNS suivants avec Azure CLI :

    - Toutes les machines virtuelles de VNet1 doivent utiliser les serveurs DNS 10.1.0.4 et 10.1.0.5.
    - Seule VM5 doit utiliser le serveur DNS 10.1.0.6.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network [[cmd1]] --resource-group RG1 --name VNet1 \
      --dns-servers 10.1.0.4 10.1.0.5

    az network [[cmd2]] --resource-group RG1 --name vm5-nic \
      --dns-servers 10.1.0.6
  slots:
    - id: cmd1
      options:
        - { id: vnet, text: vnet update }
        - { id: subnet, text: vnet subnet update }
        - { id: nic, text: nic update }
        - { id: link, text: private-dns link vnet update }
    - id: cmd2
      options:
        - { id: vnet, text: vnet update }
        - { id: subnet, text: vnet subnet update }
        - { id: nic, text: nic update }
        - { id: link, text: private-dns link vnet update }
answer:
  values: { cmd1: vnet, cmd2: nic }
explanation:
  correct:
    en: |
      DNS servers are set on the virtual network (`az network vnet update --dns-servers`) and apply to every network interface that inherits them. A network interface can override them with its own list (`az network nic update --dns-servers`), and that list takes precedence over the virtual network's.
    fr: |
      Les serveurs DNS se définissent sur le réseau virtuel (`az network vnet update --dns-servers`) et s'appliquent à toutes les interfaces réseau qui en héritent. Une interface réseau peut les remplacer par sa propre liste (`az network nic update --dns-servers`), qui est prioritaire sur celle du réseau virtuel.
  options:
    subnet: { en: "DNS servers aren't a subnet setting: they exist on the virtual network and on the network interface.", fr: "Les serveurs DNS ne sont pas un paramètre de sous-réseau : ils existent sur le réseau virtuel et sur l'interface réseau." }
    link: { en: "A private DNS zone link controls registration and resolution of a zone, not the DNS servers of the virtual machines.", fr: "Un lien de zone DNS privée contrôle l'inscription et la résolution d'une zone, pas les serveurs DNS des machines virtuelles." }
references:
  - title: Configure DNS name resolution for Azure virtual networks
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-name-resolution-for-vms-and-role-instances
  - title: az network nic
    url: https://learn.microsoft.com/en-us/cli/azure/network/nic
