seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You associate a NAT gateway that uses a /30 public IP prefix with Subnet1.
  fr: Vous associez à Subnet1 une passerelle NAT qui utilise un préfixe d'adresse IP publique /30.
body:
  solution:
    en: |
      You create a Standard public IP prefix of size /30 and a Standard NAT gateway. You associate the prefix with the NAT gateway and the NAT gateway with Subnet1. You add the first two addresses of the prefix to the Fabrikam allowlist.
    fr: |
      Vous créez un préfixe d'adresse IP publique Standard de taille /30 et une passerelle NAT Standard. Vous associez le préfixe à la passerelle NAT, puis la passerelle NAT à Subnet1. Vous ajoutez les deux premières adresses du préfixe à la liste d'autorisation de Fabrikam.
answer: { value: false }
explanation:
  correct:
    en: |
      When a public IP prefix is associated with a NAT gateway, the entire prefix is used for outbound connections. A /30 prefix contains four addresses, so some connections leave from the two addresses that aren't in the allowlist and are rejected by Fabrikam. A /31 prefix (two addresses) or a single public IP address would fit the allowlist.
    fr: |
      Lorsqu'un préfixe d'adresse IP publique est associé à une passerelle NAT, la totalité du préfixe est utilisée pour les connexions sortantes. Un préfixe /30 contient quatre adresses : certaines connexions sortent donc par les deux adresses absentes de la liste d'autorisation et sont refusées par Fabrikam. Un préfixe /31 (deux adresses) ou une seule adresse IP publique respecterait la liste d'autorisation.
references:
