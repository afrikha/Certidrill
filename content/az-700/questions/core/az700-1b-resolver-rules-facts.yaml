id: az700-1b-resolver-rules-facts
objective: "1.2.7"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Tailspin deploys Azure DNS Private Resolver in a virtual network named **VNet-Hub** in East US. The resolver has an inbound endpoint in the subnet snet-in (/28) and an outbound endpoint in the subnet snet-out (/28). A DNS forwarding ruleset named **RS1** uses the outbound endpoint and contains the following rules:

    | Rule | Domain name | Target DNS servers |
    | --- | --- | --- |
    | rule1 | tailspin.com. | 192.168.1.10:53 |
    | rule2 | dev.tailspin.com. | 192.168.2.10:53 |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin déploie Azure DNS Private Resolver dans un réseau virtuel nommé **VNet-Hub** en East US. Le résolveur possède un point de terminaison entrant dans le sous-réseau snet-in (/28) et un point de terminaison sortant dans le sous-réseau snet-out (/28). Un ensemble de règles de transfert DNS nommé **RS1** utilise le point de terminaison sortant et contient les règles suivantes :

    | Règle | Nom de domaine | Serveurs DNS cibles |
    | --- | --- | --- |
    | rule1 | tailspin.com. | 192.168.1.10:53 |
    | rule2 | dev.tailspin.com. | 192.168.2.10:53 |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can link RS1 to a virtual network in West US.
        fr: Vous pouvez lier RS1 à un réseau virtuel situé en West US.
    - id: s2
      text:
        en: You can deploy a virtual machine in snet-out next to the outbound endpoint.
        fr: Vous pouvez déployer une machine virtuelle dans snet-out à côté du point de terminaison sortant.
    - id: s3
      text:
        en: From a virtual network linked to RS1, a query for app.dev.tailspin.com is forwarded to 192.168.2.10.
        fr: Depuis un réseau virtuel lié à RS1, une requête pour app.dev.tailspin.com est transférée à 192.168.2.10.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      A ruleset can be linked to up to 500 virtual networks, but only in its own region. Each resolver endpoint needs a dedicated subnet, delegated to Microsoft.Network/dnsResolvers, where no other resource can exist. When several rules match a name, the longest suffix wins, so dev.tailspin.com. is used for app.dev.tailspin.com.
    fr: |
      Un ensemble de règles peut être lié à 500 réseaux virtuels au plus, mais uniquement dans sa propre région. Chaque point de terminaison du résolveur exige un sous-réseau dédié, délégué à Microsoft.Network/dnsResolvers, où aucune autre ressource ne peut exister. Quand plusieurs règles correspondent à un nom, le suffixe le plus long l'emporte : dev.tailspin.com. est utilisée pour app.dev.tailspin.com.
references:
  - title: Azure DNS Private Resolver endpoints and rulesets
    url: https://learn.microsoft.com/en-us/azure/dns/private-resolver-endpoints-rulesets
  - title: What is Azure DNS Private Resolver?
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
