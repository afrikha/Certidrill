id: az700-1a-06-vnet-create-cli
objective: "1.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You need to create a virtual network named VNet-Spoke1 in West Europe by using the Azure CLI. The virtual network must meet the following requirements:

    - The address space is 10.50.0.0/16.
    - It contains a subnet named snet-app with the range 10.50.1.0/24.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer un réseau virtuel nommé VNet-Spoke1 dans la région West Europe avec Azure CLI. Le réseau virtuel doit répondre aux exigences suivantes :

    - L'espace d'adressage est 10.50.0.0/16.
    - Il contient un sous-réseau nommé snet-app avec la plage 10.50.1.0/24.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    [[cmd]] --resource-group RG-Network --name VNet-Spoke1 \
      --location westeurope \
      [[space]] 10.50.0.0/16 \
      --subnet-name snet-app \
      [[subnet]] 10.50.1.0/24
  slots:
    - id: cmd
      options:
        - { id: create, text: az network vnet create }
        - { id: update, text: az network vnet update }
        - { id: subcreate, text: az network vnet subnet create }
    - id: space
      options:
        - { id: ap, text: --address-prefixes }
        - { id: sp, text: --subnet-prefixes }
        - { id: dns, text: --dns-servers }
    - id: subnet
      options:
        - { id: sp2, text: --subnet-prefixes }
        - { id: ap2, text: --address-prefixes }
        - { id: ipam, text: --ipam-allocations }
answer:
  values: { cmd: create, space: ap, subnet: sp2 }
explanation:
  correct:
    en: "`az network vnet create` creates the virtual network and, with `--subnet-name` and `--subnet-prefixes`, its first subnet. `--address-prefixes` sets the address space; without it, the command uses 10.0.0.0/16."
    fr: "`az network vnet create` crée le réseau virtuel et, avec `--subnet-name` et `--subnet-prefixes`, son premier sous-réseau. `--address-prefixes` définit l'espace d'adressage ; sans ce paramètre, la commande utilise 10.0.0.0/16."
  options:
    update: { en: "az network vnet update changes an existing virtual network and has no --location or --subnet-name parameter.", fr: "az network vnet update modifie un réseau virtuel existant et n'a pas de paramètre --location ni --subnet-name." }
    subcreate: { en: "az network vnet subnet create adds a subnet to a virtual network that already exists.", fr: "az network vnet subnet create ajoute un sous-réseau à un réseau virtuel qui existe déjà." }
    dns: { en: "--dns-servers sets custom DNS server addresses, not the address space.", fr: "--dns-servers définit des adresses de serveurs DNS personnalisés, pas l'espace d'adressage." }
    ipam: { en: "--ipam-allocations requests address space from an IPAM pool of Azure Virtual Network Manager.", fr: "--ipam-allocations demande un espace d'adressage à un pool IPAM d'Azure Virtual Network Manager." }
references:
  - title: az network vnet
    url: https://learn.microsoft.com/en-us/cli/azure/network/vnet
