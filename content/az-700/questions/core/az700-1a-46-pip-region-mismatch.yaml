id: az700-1a-46-pip-region-mismatch
objective: "1.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has the following resources in a subscription named Sub1:

    | Name | Type | Region | Resource group |
    | --- | --- | --- | --- |
    | VM1 | Virtual machine | West Europe | RG-App |
    | pip-ne | Public IP address, Standard, not associated | North Europe | RG-Net |
    | pip-we | Public IP address, Standard, associated with an application gateway | West Europe | RG-Net |

    You open **Edit IP configuration** for the network interface of VM1, select **Associate public IP address**, and neither pip-ne nor pip-we can be selected.

    You need to give VM1 a public IP address. The application gateway must keep its frontend.

    What should you do?
  fr: |
    Contoso dispose des ressources suivantes dans un abonnement nommé Sub1 :

    | Nom | Type | Région | Groupe de ressources |
    | --- | --- | --- | --- |
    | VM1 | Machine virtuelle | West Europe | RG-App |
    | pip-ne | Adresse IP publique Standard, non associée | North Europe | RG-Net |
    | pip-we | Adresse IP publique Standard, associée à une passerelle d'application | West Europe | RG-Net |

    Vous ouvrez **Edit IP configuration** pour l'interface réseau de VM1, sélectionnez **Associate public IP address**, et ni pip-ne ni pip-we ne peuvent être sélectionnées.

    Vous devez donner une adresse IP publique à VM1. La passerelle d'application doit conserver son adresse frontale.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Move pip-ne to the RG-App resource group.", fr: "Déplacer pip-ne vers le groupe de ressources RG-App." } }
    - { id: b, text: { en: "Create a Standard public IP address in West Europe.", fr: "Créer une adresse IP publique Standard dans la région West Europe." } }
    - { id: c, text: { en: "Stop and deallocate VM1, then select pip-ne.", fr: "Arrêter et libérer VM1, puis sélectionner pip-ne." } }
    - { id: d, text: { en: "Associate pip-we with both the application gateway and VM1.", fr: "Associer pip-we à la fois à la passerelle d'application et à VM1." } }
answer: { optionId: b }
explanation:
  correct:
    en: A public IP address must be in the same region and subscription as the resource it is associated with, and only addresses of the virtual machine's region are listed. An address that is already associated with another resource is grayed out. A new Standard address in West Europe is required.
    fr: Une adresse IP publique doit se trouver dans la même région et le même abonnement que la ressource à laquelle elle est associée, et seules les adresses de la région de la machine virtuelle sont proposées. Une adresse déjà associée à une autre ressource est grisée. Une nouvelle adresse Standard dans la région West Europe est nécessaire.
  options:
    a: { en: "The resource group doesn't matter; the region of pip-ne still differs from the region of VM1.", fr: "Le groupe de ressources n'a pas d'importance ; la région de pip-ne reste différente de celle de VM1." }
    c: { en: "The state of the virtual machine doesn't change the region rule.", fr: "L'état de la machine virtuelle ne change pas la règle de région." }
    d: { en: "A public IP address is associated with one resource at a time.", fr: "Une adresse IP publique n'est associée qu'à une seule ressource à la fois." }
references:
  - title: Associate a public IP address to a virtual machine
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/associate-public-ip-address-vm
