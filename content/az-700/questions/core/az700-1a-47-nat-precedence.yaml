id: az700-1a-47-nat-precedence
objective: "1.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a subnet named Subnet1 in a virtual network named VNet1. The following public IP addresses are associated with resources:

    | Public IP address | Associated with |
    | --- | --- |
    | pip-vm2 (20.50.1.10) | The IP configuration of the network interface of VM2, in Subnet1 |
    | pip-lb (20.50.1.20) | The frontend of a public Standard load balancer whose outbound rule includes VM2 in its backend pool |
    | pip-nat (20.50.1.30) | A Standard NAT gateway named natgw1 |

    Yesterday, you associated natgw1 with Subnet1. The route table of Subnet1 contains no route for 0.0.0.0/0.

    Today, VM2 opens a new HTTPS connection to a partner on the internet. Which source IP address does the partner see?
  fr: |
    Fabrikam dispose d'un sous-réseau nommé Subnet1 dans un réseau virtuel nommé VNet1. Les adresses IP publiques suivantes sont associées à des ressources :

    | Adresse IP publique | Associée à |
    | --- | --- |
    | pip-vm2 (20.50.1.10) | La configuration IP de l'interface réseau de VM2, dans Subnet1 |
    | pip-lb (20.50.1.20) | La configuration frontale d'un équilibreur de charge public Standard dont la règle de trafic sortant inclut VM2 dans son pool principal |
    | pip-nat (20.50.1.30) | Une passerelle NAT Standard nommée natgw1 |

    Hier, vous avez associé natgw1 à Subnet1. La table de routage de Subnet1 ne contient aucun itinéraire pour 0.0.0.0/0.

    Aujourd'hui, VM2 ouvre une nouvelle connexion HTTPS vers un partenaire sur Internet. Quelle adresse IP source le partenaire voit-il ?
body:
  options:
    - { id: a, text: 20.50.1.10 }
    - { id: b, text: 20.50.1.20 }
    - { id: c, text: 20.50.1.30 }
    - { id: d, text: { en: "An address chosen from the Microsoft-owned default outbound pool", fr: "Une adresse choisie dans le pool sortant par défaut appartenant à Microsoft" } }
answer: { optionId: c }
explanation:
  correct:
    en: When a NAT gateway is associated with a subnet, it takes precedence for all new outbound connections over instance-level public IP addresses, load balancer outbound rules and Azure Firewall. Only a user-defined route for 0.0.0.0/0 to a virtual appliance or a virtual network gateway would override it.
    fr: Lorsqu'une passerelle NAT est associée à un sous-réseau, elle est prioritaire pour toutes les nouvelles connexions sortantes sur les adresses IP publiques au niveau de l'instance, les règles de trafic sortant de l'équilibreur de charge et le Pare-feu Azure. Seul un itinéraire défini par l'utilisateur pour 0.0.0.0/0 vers une appliance virtuelle ou une passerelle de réseau virtuel la remplacerait.
  options:
    a: { en: "The instance-level public IP address of VM2 is no longer used for new outbound connections once the NAT gateway is on the subnet.", fr: "L'adresse IP publique au niveau de l'instance de VM2 n'est plus utilisée pour les nouvelles connexions sortantes une fois la passerelle NAT présente sur le sous-réseau." }
    b: { en: "The NAT gateway also takes precedence over load balancer outbound rules.", fr: "La passerelle NAT est également prioritaire sur les règles de trafic sortant de l'équilibreur de charge." }
    d: { en: "Default outbound access is never used by a virtual machine that has an explicit outbound method.", fr: "L'accès sortant par défaut n'est jamais utilisé par une machine virtuelle qui dispose d'une méthode sortante explicite." }
references:
  - title: What is Azure NAT Gateway?
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
