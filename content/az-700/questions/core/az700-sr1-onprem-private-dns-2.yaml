id: az700-sr1-onprem-private-dns-2
objective: "1.2.7"
type: series_yesno
series: az700-sr1-onprem-private-dns
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You deploy DNS Private Resolver with an outbound endpoint and a forwarding ruleset.
  fr: |
    Vous déployez DNS Private Resolver avec un point de terminaison sortant et un ensemble de règles de transfert.
body:
  solution:
    en: |
      You deploy an **Azure DNS Private Resolver** in VNet-Hub with an **outbound endpoint** in a dedicated subnet. You create a DNS forwarding ruleset that contains a rule for **blob.core.windows.net.** whose targets are the IP addresses of the two on-premises DNS servers, and you link the ruleset to VNet-Hub.
    fr: |
      Vous déployez un **Azure DNS Private Resolver** dans VNet-Hub avec un **point de terminaison sortant** dans un sous-réseau dédié. Vous créez un ensemble de règles de transfert DNS qui contient une règle pour **blob.core.windows.net.** dont les cibles sont les adresses IP des deux serveurs DNS locaux, et vous liez l'ensemble de règles à VNet-Hub.
answer: { value: false }
explanation:
  correct:
    en: |
      An outbound endpoint and its forwarding ruleset handle the opposite direction: they forward queries from the linked virtual network to other DNS servers, such as the on-premises ones. Here they would even send the queries of VNet-Hub for blob.core.windows.net to the on-premises servers, which don't host the private zone. On-premises clients need an inbound endpoint that receives their queries in VNet-Hub.
    fr: |
      Un point de terminaison sortant et son ensemble de règles de transfert traitent le sens inverse : ils transfèrent les requêtes du réseau virtuel lié vers d'autres serveurs DNS, comme les serveurs locaux. Ici, ils enverraient même les requêtes de VNet-Hub pour blob.core.windows.net aux serveurs locaux, qui n'hébergent pas la zone privée. Les clients locaux ont besoin d'un point de terminaison entrant qui reçoit leurs requêtes dans VNet-Hub.
references:
  - title: What is Azure DNS Private Resolver?
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
