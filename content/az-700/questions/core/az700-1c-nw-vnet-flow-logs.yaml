id: az700-1c-nw-vnet-flow-logs
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has a virtual network named **VNet1** that contains 120 virtual machines in six subnets. Some subnets have a network security group (NSG) and some virtual machines also have an NSG on their network interface.

    The security team needs a record of every IP flow in VNet1, including whether each flow was allowed or denied, stored in an Azure Storage account and available to traffic analytics. The solution must minimize the number of resources to configure.

    What should you configure?
  fr: |
    Proseware dispose d'un réseau virtuel nommé **VNet1** qui contient 120 machines virtuelles réparties sur six sous-réseaux. Certains sous-réseaux ont un groupe de sécurité réseau (NSG) et certaines machines virtuelles ont aussi un NSG sur leur interface réseau.

    L'équipe de sécurité a besoin d'un enregistrement de chaque flux IP de VNet1, indiquant si chaque flux a été autorisé ou refusé, stocké dans un compte Stockage Azure et exploitable par traffic analytics. La solution doit réduire au minimum le nombre de ressources à configurer.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "NSG flow logs on each network security group", fr: "Des journaux de flux NSG sur chaque groupe de sécurité réseau" }
    - id: b
      text: { en: "A virtual network flow log on VNet1", fr: "Un journal de flux de réseau virtuel sur VNet1" }
    - id: c
      text: { en: "A connection monitor with VNet1 as the source", fr: "Un moniteur de connexion avec VNet1 comme source" }
    - id: d
      text: { en: "A packet capture session on each virtual machine", fr: "Une session de capture de paquets sur chaque machine virtuelle" }
answer: { optionId: b }
explanation:
  correct:
    en: Virtual network flow logs are enabled once at the virtual network level and record Layer 4 flows of all supported workloads, with their flow state and whether NSG or Azure Virtual Network Manager security admin rules allowed or denied them. The data is written to a storage account and can be processed by traffic analytics.
    fr: Les journaux de flux de réseau virtuel s'activent une seule fois au niveau du réseau virtuel et enregistrent les flux de couche 4 de toutes les charges de travail prises en charge, avec leur état et le fait que des règles NSG ou des règles d'administration de sécurité d'Azure Virtual Network Manager les ont autorisés ou refusés. Les données sont écrites dans un compte de stockage et peuvent être traitées par traffic analytics.
  options:
    a: { en: "Creating new NSG flow logs is no longer supported (they retire on September 30, 2027), and they would require configuration on every NSG.", fr: "La création de nouveaux journaux de flux NSG n'est plus prise en charge (ils sont mis hors service le 30 septembre 2027), et ils nécessiteraient une configuration sur chaque NSG." }
    c: { en: "Connection monitor measures reachability and latency between defined endpoints; it doesn't log every IP flow.", fr: "Le moniteur de connexion mesure l'accessibilité et la latence entre des points de terminaison définis ; il ne journalise pas chaque flux IP." }
    d: { en: "Packet capture records packet contents of a VM for a limited time; it is not a flow log for traffic analytics.", fr: "La capture de paquets enregistre le contenu des paquets d'une machine virtuelle pendant une durée limitée ; ce n'est pas un journal de flux pour traffic analytics." }
references:
  - title: Virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
  - title: What is Azure Network Watcher?
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview
