id: az700-1a-38-byoip-prerequisites
objective: "1.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware wants to bring a public IPv4 range that it owns to Azure as a custom IP prefix by using the unified model.

    Which two conditions must the range meet?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware veut apporter dans Azure une plage IPv4 publique qu'elle possède, sous la forme d'un préfixe d'adresse IP personnalisé selon le modèle unifié.

    Quelles sont les deux conditions que la plage doit remplir ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It is registered in Litware's name with a Regional Internet Registry such as ARIN or RIPE NCC.", fr: "Elle est enregistrée au nom de Litware auprès d'un registre Internet régional tel que l'ARIN ou le RIPE NCC." } }
    - { id: b, text: { en: "It is a /28 or smaller, the maximum size of a public IP prefix.", fr: "C'est un /28 ou plus petit, la taille maximale d'un préfixe d'adresse IP publique." } }
    - { id: c, text: { en: "It is a /24 or larger.", fr: "C'est un /24 ou plus grand." } }
    - { id: d, text: { en: "It is covered by a ROA that authorizes origin AS 65515.", fr: "Elle est couverte par une ROA qui autorise l'AS d'origine 65515." } }
    - { id: e, text: { en: "It is already advertised to the internet by Microsoft's network.", fr: "Elle est déjà publiée sur Internet par le réseau de Microsoft." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: The range must be owned by the customer and registered in its name with one of the five Regional Internet Registries, and it must be no smaller than a /24. A unified custom IPv4 prefix is between /21 and /24.
    fr: La plage doit appartenir au client et être enregistrée à son nom auprès de l'un des cinq registres Internet régionaux, et elle ne doit pas être plus petite qu'un /24. Un préfixe IPv4 personnalisé unifié est compris entre /21 et /24.
  options:
    b: { en: "The /28 limit applies to public IP prefixes owned by Microsoft; a custom IP prefix must be at least a /24.", fr: "La limite /28 s'applique aux préfixes d'adresses IP publiques appartenant à Microsoft ; un préfixe personnalisé doit être au moins un /24." }
    d: { en: "The ROA must authorize AS 8075, the Microsoft public cloud.", fr: "La ROA doit autoriser l'AS 8075, celui du cloud public Microsoft." }
    e: { en: "Microsoft advertises the range only after you commission the custom IP prefix.", fr: "Microsoft ne publie la plage qu'après la mise en service du préfixe d'adresse IP personnalisé." }
references:
  - title: Create a custom IPv4 address prefix in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/create-custom-ip-address-prefix-cli
