id: az700-1a-30-prefix-region-scope
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has the following public IP prefix:

    | Name | Subscription | Region | Size | Addresses in use |
    | --- | --- | --- | --- | --- |
    | ippre-eu | Sub1 | West Europe | /28 | 10 |

    A partner allows ippre-eu in its firewall. Contoso deploys a new application on virtual machines in Sub1 in the Sweden Central region. The application must reach the partner from public IP addresses that the partner allows through a rule for one contiguous range.

    What should you do?
  fr: |
    Contoso dispose du préfixe d'adresse IP publique suivant :

    | Nom | Abonnement | Région | Taille | Adresses utilisées |
    | --- | --- | --- | --- | --- |
    | ippre-eu | Sub1 | West Europe | /28 | 10 |

    Un partenaire autorise ippre-eu dans son pare-feu. Contoso déploie une nouvelle application sur des machines virtuelles de Sub1 dans la région Sweden Central. L'application doit joindre le partenaire depuis des adresses IP publiques que le partenaire autorise par une règle portant sur une seule plage contiguë.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Create public IP addresses in Sweden Central from ippre-eu, and associate them with the virtual machines.
        fr: Créer des adresses IP publiques dans la région Sweden Central à partir d'ippre-eu, puis les associer aux machines virtuelles.
    - id: b
      text:
        en: Create a public IP prefix in Sweden Central, and ask the partner to add it to its firewall.
        fr: Créer un préfixe d'adresse IP publique dans la région Sweden Central, puis demander au partenaire de l'ajouter à son pare-feu.
    - id: c
      text:
        en: Move ippre-eu to Sweden Central, then create public IP addresses from it.
        fr: Déplacer ippre-eu vers la région Sweden Central, puis créer des adresses IP publiques à partir de celui-ci.
    - id: d
      text:
        en: Change the size of ippre-eu to /27, then create public IP addresses from it in Sweden Central.
        fr: Passer la taille d'ippre-eu à /27, puis créer des adresses IP publiques à partir de celui-ci dans la région Sweden Central.
answer: { optionId: b }
explanation:
  correct:
    en: A public IP prefix and the addresses created from it must be in the same region and subscription. Virtual machines in Sweden Central need addresses from a prefix created in Sweden Central, and the partner must allow that new range.
    fr: Un préfixe d'adresse IP publique et les adresses créées à partir de celui-ci doivent se trouver dans la même région et le même abonnement. Les machines virtuelles de Sweden Central ont besoin d'adresses issues d'un préfixe créé dans Sweden Central, et le partenaire doit autoriser cette nouvelle plage.
  options:
    a: { en: "Addresses created from ippre-eu are in West Europe, and a public IP address must be in the region of the resource it is associated with.", fr: "Les adresses créées à partir d'ippre-eu sont dans la région West Europe, et une adresse IP publique doit se trouver dans la région de la ressource à laquelle elle est associée." }
    c: { en: "A public IP prefix is allocated from a regional pool and can't be moved to another region.", fr: "Un préfixe d'adresse IP publique est alloué depuis un pool régional et ne peut pas être déplacé vers une autre région." }
    d: { en: "The size of a prefix can't be changed after creation, and the region would still be West Europe.", fr: "La taille d'un préfixe ne peut pas être modifiée après la création, et la région resterait West Europe." }
references:
  - title: Public IP address prefix
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix
