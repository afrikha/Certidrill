id: az700-1b-rt-join-permission
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has the following resources in a subscription named **Sub1**, all in West Europe:

    | Resource | Resource group | Permissions of User1 |
    | --- | --- | --- |
    | VNet1, with the subnet App1 | RG-App | Network Contributor on RG-App |
    | Route table RT-Shared | RG-Hub | Reader on RG-Hub |

    User1 must associate RT-Shared with App1. User1 must not be able to change the routes of RT-Shared. You plan to create a custom role that User1 will receive on RT-Shared.

    Which action should the custom role contain?
  fr: |
    Adatum dispose des ressources suivantes dans un abonnement nommé **Sub1**, toutes en West Europe :

    | Ressource | Groupe de ressources | Autorisations de User1 |
    | --- | --- | --- |
    | VNet1, avec le sous-réseau App1 | RG-App | Network Contributor sur RG-App |
    | Table de routage RT-Shared | RG-Hub | Reader sur RG-Hub |

    User1 doit associer RT-Shared à App1. User1 ne doit pas pouvoir modifier les itinéraires de RT-Shared. Vous prévoyez de créer un rôle personnalisé que User1 recevra sur RT-Shared.

    Quelle action le rôle personnalisé doit-il contenir ?
body:
  options:
    - id: a
      text: Microsoft.Network/routeTables/write
    - id: b
      text: Microsoft.Network/virtualNetworks/subnets/join/action
    - id: c
      text: Microsoft.Network/routeTables/routes/write
    - id: d
      text: Microsoft.Network/routeTables/join/action
answer: { optionId: d }
explanation:
  correct:
    en: |
      Associating a route table with a subnet requires write permission on the subnet, which Network Contributor on RG-App already grants, and the join action on the route table. Microsoft.Network/routeTables/join/action allows the association without allowing changes to the table or its routes.
    fr: |
      L'association d'une table de routage à un sous-réseau exige l'autorisation d'écriture sur le sous-réseau, que Network Contributor sur RG-App accorde déjà, et l'action join sur la table de routage. Microsoft.Network/routeTables/join/action autorise l'association sans permettre de modifier la table ni ses itinéraires.
  options:
    a: { en: "Write on the route table would let User1 change the table, including its routes, which is not allowed.", fr: "L'écriture sur la table de routage permettrait à User1 de modifier la table, y compris ses itinéraires, ce qui est interdit." }
    c: { en: "This action creates and modifies routes; it doesn't allow the association.", fr: "Cette action crée et modifie des itinéraires ; elle n'autorise pas l'association." }
    b: { en: "This action joins resources to a subnet and applies to the subnet, not to the route table; User1 already has it through Network Contributor.", fr: "Cette action joint des ressources à un sous-réseau et s'applique au sous-réseau, pas à la table de routage ; User1 l'a déjà avec Network Contributor." }
references:
  - title: Create, change, or delete a route table
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-route-table
