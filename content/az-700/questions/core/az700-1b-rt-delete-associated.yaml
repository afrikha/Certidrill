id: az700-1b-rt-delete-associated
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has a route table named **RT-Legacy** that is associated with three subnets in two virtual networks. The workloads of these subnets no longer need custom routes.

    When you try to delete RT-Legacy, the operation fails.

    What should you do first?
  fr: |
    Litware dispose d'une table de routage nommée **RT-Legacy**, associée à trois sous-réseaux de deux réseaux virtuels. Les charges de travail de ces sous-réseaux n'ont plus besoin d'itinéraires personnalisés.

    Quand vous tentez de supprimer RT-Legacy, l'opération échoue.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Delete every route in RT-Legacy.", fr: "Supprimer tous les itinéraires de RT-Legacy." }
    - id: b
      text: { en: "Set Propagate gateway routes to Yes on RT-Legacy.", fr: "Définir Propagate gateway routes sur Yes pour RT-Legacy." }
    - id: c
      text: { en: "Dissociate RT-Legacy from the three subnets.", fr: "Dissocier RT-Legacy des trois sous-réseaux." }
    - id: d
      text: { en: "Delete the peering between the two virtual networks.", fr: "Supprimer le peering entre les deux réseaux virtuels." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure doesn't let you delete a route table that is associated with any subnet. Set the route table of each subnet to None (or associate another table), and then delete RT-Legacy; the subnets then use the default routes.
    fr: |
      Azure ne permet pas de supprimer une table de routage associée à un sous-réseau. Définissez la table de routage de chaque sous-réseau sur None (ou associez une autre table), puis supprimez RT-Legacy ; les sous-réseaux utilisent alors les itinéraires par défaut.
  options:
    a: { en: "An empty route table is still associated with the subnets, so it still can't be deleted.", fr: "Une table de routage vide reste associée aux sous-réseaux : elle ne peut toujours pas être supprimée." }
    b: { en: "Route propagation controls which gateway routes reach the subnets; it has no effect on deletion.", fr: "La propagation des itinéraires contrôle les itinéraires de passerelle qui atteignent les sous-réseaux ; elle n'a aucun effet sur la suppression." }
    d: { en: "Peerings don't depend on route tables and don't block their deletion.", fr: "Les peerings ne dépendent pas des tables de routage et n'empêchent pas leur suppression." }
references:
  - title: Create, change, or delete a route table
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-route-table
