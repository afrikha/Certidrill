id: az700-1b-private-dns-ilb-record
objective: "1.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has a private DNS zone named **tailspin.internal** that is linked to a virtual network named **VNet1** with autoregistration enabled. The virtual machines of VNet1 are registered in the zone.

    You deploy an internal Standard load balancer named **ILB1** in VNet1, with the frontend IP address 10.1.3.10. Clients in VNet1 must reach it by using the name `api.tailspin.internal`.

    What should you do?
  fr: |
    Tailspin dispose d'une zone DNS privée nommée **tailspin.internal**, liée à un réseau virtuel nommé **VNet1** avec l'inscription automatique activée. Les machines virtuelles de VNet1 sont inscrites dans la zone.

    Vous déployez dans VNet1 un équilibreur de charge interne Standard nommé **ILB1**, dont l'adresse IP frontale est 10.1.3.10. Les clients de VNet1 doivent le joindre avec le nom `api.tailspin.internal`.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create an A record set named api with the address 10.1.3.10 in tailspin.internal.", fr: "Créer dans tailspin.internal un jeu d'enregistrements A nommé api avec l'adresse 10.1.3.10." }
    - id: b
      text: { en: "Create an alias record set named api that targets ILB1 in tailspin.internal.", fr: "Créer dans tailspin.internal un jeu d'enregistrements d'alias nommé api qui cible ILB1." }
    - id: c
      text: { en: "Set the name of the frontend IP configuration of ILB1 to api and wait for autoregistration.", fr: "Nommer api la configuration IP frontale d'ILB1 et attendre l'inscription automatique." }
    - id: d
      text: { en: "Delete the virtual network link and re-create it with autoregistration enabled.", fr: "Supprimer le lien de réseau virtuel et le recréer avec l'inscription automatique activée." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Autoregistration covers only virtual machines. For other resources, such as internal load balancers, you create the records manually in the private DNS zone linked to the virtual network, here an A record set api with the frontend address.
    fr: |
      L'inscription automatique ne couvre que les machines virtuelles. Pour les autres ressources, comme les équilibreurs de charge internes, vous créez les enregistrements manuellement dans la zone DNS privée liée au réseau virtuel, ici un jeu d'enregistrements A api avec l'adresse frontale.
  options:
    b: { en: "Alias record sets target resources such as Standard public IP addresses, Traffic Manager, Front Door or another record set, not an internal load balancer.", fr: "Les jeux d'enregistrements d'alias ciblent des ressources comme les adresses IP publiques Standard, Traffic Manager, Front Door ou un autre jeu d'enregistrements, pas un équilibreur de charge interne." }
    c: { en: "Autoregistration ignores load balancers, whatever the name of their frontend configuration.", fr: "L'inscription automatique ignore les équilibreurs de charge, quel que soit le nom de leur configuration frontale." }
    d: { en: "Autoregistration is already enabled; re-creating the link doesn't extend it to load balancers.", fr: "L'inscription automatique est déjà activée ; recréer le lien ne l'étend pas aux équilibreurs de charge." }
references:
  - title: What is the autoregistration feature in Azure DNS private zones?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-autoregistration
