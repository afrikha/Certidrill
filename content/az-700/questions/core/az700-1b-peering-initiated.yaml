id: az700-1b-peering-initiated
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has two virtual networks, **VNet1** (10.1.0.0/16) and **VNet2** (10.2.0.0/16), in different subscriptions. An administrator creates a peering named VNet1-to-VNet2 from VNet1. The peering status shown on VNet1 is **Initiated**, and the virtual machines of VNet1 can't reach those of VNet2.

    You need to establish the peering.

    What should you do?
  fr: |
    Proseware dispose de deux réseaux virtuels, **VNet1** (10.1.0.0/16) et **VNet2** (10.2.0.0/16), dans des abonnements différents. Un administrateur crée depuis VNet1 un peering nommé VNet1-to-VNet2. L'état du peering affiché sur VNet1 est **Initiated**, et les machines virtuelles de VNet1 ne peuvent pas joindre celles de VNet2.

    Vous devez établir le peering.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Sync the VNet1-to-VNet2 peering.", fr: "Synchroniser le peering VNet1-to-VNet2." }
    - id: b
      text: { en: "Move VNet2 to the subscription of VNet1.", fr: "Déplacer VNet2 dans l'abonnement de VNet1." }
    - id: c
      text: { en: "Enable Allow forwarded traffic on VNet1-to-VNet2.", fr: "Activer l'autorisation du trafic transféré sur VNet1-to-VNet2." }
    - id: d
      text: { en: "Create a peering from VNet2 to VNet1.", fr: "Créer un peering de VNet2 vers VNet1." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A peering consists of two links, one on each virtual network. The status stays Initiated until the peering from the remote virtual network exists; when both sides are created, both show Connected and traffic flows.
    fr: |
      Un peering se compose de deux liens, un sur chaque réseau virtuel. L'état reste Initiated tant que le peering depuis le réseau virtuel distant n'existe pas ; quand les deux côtés sont créés, les deux affichent Connected et le trafic circule.
  options:
    a: { en: "Sync updates a peering after an address space change; it doesn't create the missing side.", fr: "La synchronisation met à jour un peering après une modification d'espace d'adressage ; elle ne crée pas le côté manquant." }
    c: { en: "Forwarded traffic concerns traffic that doesn't originate in the peered network; it doesn't complete the peering.", fr: "Le trafic transféré concerne le trafic qui ne provient pas du réseau relié par peering ; il ne complète pas le peering." }
    b: { en: "Peering works across subscriptions and tenants; moving a virtual network even requires deleting its peerings first.", fr: "Le peering fonctionne entre abonnements et locataires ; déplacer un réseau virtuel exige même de supprimer d'abord ses peerings." }
references:
  - title: Create, change, or delete Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
