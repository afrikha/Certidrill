id: az700-1b-dns-custom-dc-forwarder
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a virtual network named **VNet1** that contains two domain controllers, DC1 (10.1.0.4) and DC2 (10.1.0.5), which also run the DNS Server role. The DNS servers of VNet1 are set to 10.1.0.4 and 10.1.0.5. DC1 and DC2 resolve external names by using root hints.

    You create a private endpoint in VNet1 for a storage account named **stadatum01**. The private DNS zone `privatelink.blob.core.windows.net` contains the A record of the private endpoint and is linked to VNet1.

    The virtual machines in VNet1 resolve `stadatum01.blob.core.windows.net` to a public IP address. You need them to resolve it to the private IP address of the private endpoint. The virtual machines must keep using DC1 and DC2 for the Active Directory domain.

    What should you do?
  fr: |
    Adatum dispose d'un réseau virtuel nommé **VNet1** qui contient deux contrôleurs de domaine, DC1 (10.1.0.4) et DC2 (10.1.0.5), qui exécutent aussi le rôle Serveur DNS. Les serveurs DNS de VNet1 sont 10.1.0.4 et 10.1.0.5. DC1 et DC2 résolvent les noms externes avec les indications de racine.

    Vous créez dans VNet1 un point de terminaison privé pour un compte de stockage nommé **stadatum01**. La zone DNS privée `privatelink.blob.core.windows.net` contient l'enregistrement A du point de terminaison privé et elle est liée à VNet1.

    Les machines virtuelles de VNet1 résolvent `stadatum01.blob.core.windows.net` en une adresse IP publique. Vous devez faire en sorte qu'elles la résolvent en l'adresse IP privée du point de terminaison privé. Les machines virtuelles doivent continuer à utiliser DC1 et DC2 pour le domaine Active Directory.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Change the DNS servers of VNet1 to Default (Azure-provided).", fr: "Remplacer les serveurs DNS de VNet1 par Par défaut (fourni par Azure)." }
    - id: b
      text: { en: "On DC1 and DC2, add a conditional forwarder for blob.core.windows.net to the Azure DNS name servers.", fr: "Sur DC1 et DC2, ajouter un redirecteur conditionnel pour blob.core.windows.net vers les serveurs de noms Azure DNS." }
    - id: c
      text: { en: "Enable autoregistration on the link between the private DNS zone and VNet1.", fr: "Activer l'inscription automatique sur le lien entre la zone DNS privée et VNet1." }
    - id: d
      text: { en: "On DC1 and DC2, add a conditional forwarder for blob.core.windows.net to 168.63.129.16.", fr: "Sur DC1 et DC2, ajouter un redirecteur conditionnel pour blob.core.windows.net vers 168.63.129.16." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When a virtual network uses custom DNS servers, its queries go only to those servers, and the private zones linked to the virtual network are consulted only when the servers forward the query to 168.63.129.16 from that network. A conditional forwarder for the public zone sends the query to Azure DNS, which follows the CNAME to the privatelink zone and returns the private IP address, while the domain controllers keep serving the Active Directory domain.
    fr: |
      Quand un réseau virtuel utilise des serveurs DNS personnalisés, ses requêtes ne vont qu'à ces serveurs, et les zones privées liées au réseau virtuel ne sont consultées que si les serveurs transfèrent la requête à 168.63.129.16 depuis ce réseau. Un redirecteur conditionnel pour la zone publique envoie la requête à Azure DNS, qui suit le CNAME vers la zone privatelink et renvoie l'adresse IP privée, tandis que les contrôleurs de domaine continuent à servir le domaine Active Directory.
  options:
    a: { en: "Azure-provided DNS would resolve the private zone, but the virtual machines would lose the domain controllers as DNS servers and could no longer locate the domain.", fr: "Le DNS fourni par Azure résoudrait la zone privée, mais les machines virtuelles perdraient les contrôleurs de domaine comme serveurs DNS et ne trouveraient plus le domaine." }
    c: { en: "Autoregistration creates A records for virtual machines only; the record of the private endpoint already exists and the issue is the query path.", fr: "L'inscription automatique crée des enregistrements A pour les machines virtuelles uniquement ; l'enregistrement du point de terminaison privé existe déjà et le problème est le chemin de la requête." }
    b: { en: "The public Azure DNS name servers know nothing about private zones; they return the public address.", fr: "Les serveurs de noms publics d'Azure DNS ne connaissent pas les zones privées : ils renvoient l'adresse publique." }
references:
  - title: Configure DNS name resolution for Azure virtual networks
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-name-resolution-for-vms-and-role-instances
  - title: What is Azure DNS Private Resolver?
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
