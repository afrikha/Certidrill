id: az700-1b-private-dns-link-troubleshoot
objective: "1.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has a private DNS zone named **litware.internal**. VNet1 is linked to the zone with autoregistration enabled and contains a virtual machine named **VM-DB1**. VNet2 uses Azure-provided DNS.

    From a virtual machine in VNet2, the query for `vm-db1.litware.internal` returns NXDOMAIN.

    Which two issues could cause this result?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'une zone DNS privée nommée **litware.internal**. VNet1 est lié à la zone avec l'inscription automatique activée et contient une machine virtuelle nommée **VM-DB1**. VNet2 utilise le DNS fourni par Azure.

    Depuis une machine virtuelle de VNet2, la requête pour `vm-db1.litware.internal` renvoie NXDOMAIN.

    Quels sont les deux problèmes qui peuvent provoquer ce résultat ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The link of VNet2 has autoregistration disabled.", fr: "Le lien de VNet2 a l'inscription automatique désactivée." } }
    - { id: b, text: { en: "VM-DB1 is stopped (deallocated).", fr: "VM-DB1 est arrêtée (désallouée)." } }
    - { id: c, text: { en: "VNet2 has no virtual network link to litware.internal.", fr: "VNet2 n'a aucun lien de réseau virtuel vers litware.internal." } }
    - { id: d, text: { en: "VNet1 and VNet2 aren't peered.", fr: "VNet1 et VNet2 ne sont pas reliés par peering." } }
    - { id: e, text: { en: "VNet2 is in a different region from VNet1.", fr: "VNet2 se trouve dans une région différente de celle de VNet1." } }
answer: { optionIds: [ c, b ] }
explanation:
  correct:
    en: |
      A private zone is resolved only from linked virtual networks, so without a link VNet2 resolves the name as a public name and gets NXDOMAIN. An autoregistered record is removed when the virtual machine is stopped or deleted, so a deallocated VM-DB1 has no record in the zone.
    fr: |
      Une zone privée n'est résolue que depuis les réseaux virtuels liés : sans lien, VNet2 résout le nom comme un nom public et obtient NXDOMAIN. Un enregistrement inscrit automatiquement est supprimé quand la machine virtuelle est arrêtée ou supprimée : une VM-DB1 désallouée n'a pas d'enregistrement dans la zone.
  options:
    a: { en: "A link without autoregistration is a resolution link: VNet2 still resolves every record of the zone.", fr: "Un lien sans inscription automatique est un lien de résolution : VNet2 résout quand même tous les enregistrements de la zone." }
    d: { en: "Private zones work without peering; every virtual network only needs its own link.", fr: "Les zones privées fonctionnent sans peering ; chaque réseau virtuel a seulement besoin de son propre lien." }
    e: { en: "Private zones are global and support resolution between virtual networks of different regions.", fr: "Les zones privées sont globales et prennent en charge la résolution entre réseaux virtuels de régions différentes." }
references:
  - title: What is the autoregistration feature in Azure DNS private zones?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-autoregistration
  - title: Azure Private DNS FAQ
    url: https://learn.microsoft.com/en-us/azure/dns/dns-faq-private
