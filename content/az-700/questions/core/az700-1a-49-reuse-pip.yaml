id: az700-1a-49-reuse-pip
objective: "1.1.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has a public IP address named pip-legacy (Standard, static, zone-redundant) in West Europe. pip-legacy is the only frontend IP configuration of a public load balancer named LB-Old, which is being retired. Customers reach a service at the address of pip-legacy.

    The service moves to a virtual machine named VM-New in West Europe, in the same subscription. You need customers to keep using the same address.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'une adresse IP publique nommée pip-legacy (Standard, statique, redondante interzone) dans la région West Europe. pip-legacy est la seule configuration IP frontale d'un équilibreur de charge public nommé LB-Old, qui est en cours de retrait. Des clients joignent un service à l'adresse de pip-legacy.

    Le service est déplacé vers une machine virtuelle nommée VM-New dans la région West Europe, dans le même abonnement. Les clients doivent continuer d'utiliser la même adresse.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Delete LB-Old without deleting pip-legacy.", fr: "Supprimer LB-Old sans supprimer pip-legacy." } }
    - { id: b, text: { en: "Delete pip-legacy, then create a public IP address with the same name for VM-New.", fr: "Supprimer pip-legacy, puis créer une adresse IP publique du même nom pour VM-New." } }
    - { id: c, text: { en: "Associate pip-legacy with the IP configuration of the network interface of VM-New.", fr: "Associer pip-legacy à la configuration IP de l'interface réseau de VM-New." } }
    - { id: d, text: { en: "Change pip-legacy to a zonal address in the zone of VM-New.", fr: "Transformer pip-legacy en adresse zonale dans la zone de VM-New." } }
    - { id: e, text: { en: "Move pip-legacy to the resource group of VM-New.", fr: "Déplacer pip-legacy vers le groupe de ressources de VM-New." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: A public IP address is associated with one resource at a time, so it must be released by LB-Old before it can be attached elsewhere. Deleting the load balancer removes the association but keeps the public IP address resource and its static address, which can then be associated with the IP configuration of VM-New.
    fr: |
      Une adresse IP publique n'est associée qu'à une seule ressource à la fois : elle doit être libérée par LB-Old avant de pouvoir être attachée ailleurs. Supprimer l'équilibreur de charge supprime l'association mais conserve la ressource d'adresse IP publique et son adresse statique, qui peut ensuite être associée à la configuration IP de VM-New.
  options:
    b: { en: "A deleted public IP address can't be recovered; a new resource receives a different address.", fr: "Une adresse IP publique supprimée ne peut pas être récupérée ; une nouvelle ressource reçoit une adresse différente." }
    d: { en: "The zone setting of a public IP address can't be changed, and a zone-redundant address works with a virtual machine in any zone.", fr: "Le paramètre de zone d'une adresse IP publique ne peut pas être modifié, et une adresse redondante interzone fonctionne avec une machine virtuelle de n'importe quelle zone." }
    e: { en: "The address and the virtual machine can be in different resource groups; only the region and the subscription must match.", fr: "L'adresse et la machine virtuelle peuvent être dans des groupes de ressources différents ; seules la région et l'abonnement doivent concorder." }
references:
  - title: Public IP addresses in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses
  - title: Associate a public IP address to a virtual machine
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/associate-public-ip-address-vm
