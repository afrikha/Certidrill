id: az700-cs3c-route-server
objective: "1.3.8"
type: yesno_statements
caseStudy: az700-cs3c-munsons
difficulty: 2
status: draft
stem:
  en: |
    You plan to deploy an Azure Route Server named **RS1** in Hub-VNet and to establish BGP peering between RS1 and NVA1 to meet routing requirement 1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de déployer un serveur de routes Azure nommé **RS1** dans Hub-VNet et d'établir un peering BGP entre RS1 et NVA1 pour respecter l'exigence de routage 1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can deploy RS1 in a /27 subnet named RouteServerSubnet.
        fr: Vous pouvez déployer RS1 dans un sous-réseau /27 nommé RouteServerSubnet.
    - id: s2
      text:
        en: For high availability, NVA1 must establish a BGP session with each of the two peer IP addresses of RS1.
        fr: Pour la haute disponibilité, NVA1 doit établir une session BGP avec chacune des deux adresses IP d'homologue de RS1.
    - id: s3
      text:
        en: Packets from a VM in Spoke-ERP to a prefix advertised by NVA1 are forwarded by RS1 to NVA1.
        fr: Les paquets d'une machine virtuelle de Spoke-ERP vers un préfixe publié par NVA1 sont transférés par RS1 vers NVA1.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Route Server needs a dedicated subnet named RouteServerSubnet of at least /26. It runs two instances, and the NVA must peer with both instance IP addresses so that routes keep being exchanged if one instance fails; NVA1 can keep ASN 65020 because only the Route Server ASN 65515 and other reserved values are forbidden. Route Server only exchanges BGP routes and programs them into the virtual network and, through gateway transit, into the spokes; data traffic goes directly from the VMs to NVA1.
    fr: |
      Le serveur de routes a besoin d'un sous-réseau dédié nommé RouteServerSubnet d'au moins /26. Il exécute deux instances, et la NVA doit établir un peering avec les deux adresses IP d'instance afin que l'échange de routes continue si une instance tombe en panne ; NVA1 peut conserver l'ASN 65020, car seuls l'ASN 65515 du serveur de routes et d'autres valeurs réservées sont interdits. Le serveur de routes échange seulement des routes BGP et les programme dans le réseau virtuel et, par le transit de passerelle, dans les spokes ; le trafic de données va directement des machines virtuelles vers NVA1.
  options:
    s1: { en: "The subnet must be /26 or larger.", fr: "Le sous-réseau doit être un /26 ou plus grand." }
    s3: { en: "Route Server isn't in the data path.", fr: "Le serveur de routes ne se trouve pas dans le chemin des données." }
references:
  - title: Azure Route Server frequently asked questions
    url: https://learn.microsoft.com/en-us/azure/route-server/route-server-faq
  - title: "Quickstart: Create an Azure Route Server using Azure portal"
    url: https://learn.microsoft.com/en-us/azure/route-server/quickstart-create-route-server-portal
