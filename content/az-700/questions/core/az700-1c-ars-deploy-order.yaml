id: az700-1c-ars-deploy-order
objective: "1.3.8"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a hub virtual network named **VNet-Hub** (10.10.0.0/16). A firewall network virtual appliance named **NVA1** in VNet-Hub has the IP address 10.10.2.4, uses the BGP ASN 65020 and supports multi-hop eBGP.

    You need NVA1 to advertise a default route to the virtual machines of VNet-Hub by using Azure Route Server. The NVA team will configure the BGP sessions on NVA1 as soon as you give them the IP addresses and the ASN of the route server.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'un réseau virtuel hub nommé **VNet-Hub** (10.10.0.0/16). Une appliance virtuelle réseau de pare-feu nommée **NVA1** dans VNet-Hub a l'adresse IP 10.10.2.4, utilise l'ASN BGP 65020 et prend en charge l'eBGP multisaut.

    Vous devez faire en sorte que NVA1 publie un itinéraire par défaut vers les machines virtuelles de VNet-Hub à l'aide du Serveur de routes Azure. L'équipe NVA configurera les sessions BGP sur NVA1 dès que vous lui aurez fourni les adresses IP et l'ASN du serveur de routes.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: subnet, text: { en: "Create a subnet named RouteServerSubnet with the prefix 10.10.1.0/26.", fr: "Créer un sous-réseau nommé RouteServerSubnet avec le préfixe 10.10.1.0/26." } }
    - { id: ars, text: { en: "Create the route server in RouteServerSubnet with a Standard public IP address.", fr: "Créer le serveur de routes dans RouteServerSubnet avec une adresse IP publique Standard." } }
    - { id: peer, text: { en: "On the route server, add a peer with the ASN 65020 and the IPv4 address 10.10.2.4.", fr: "Sur le serveur de routes, ajouter un homologue avec l'ASN 65020 et l'adresse IPv4 10.10.2.4." } }
    - { id: rt, text: { en: "Associate with RouteServerSubnet a route table that contains a 0.0.0.0/0 route to 10.10.2.4.", fr: "Associer à RouteServerSubnet une table de routage contenant un itinéraire 0.0.0.0/0 vers 10.10.2.4." } }
    - { id: nsg, text: { en: "Associate with RouteServerSubnet a network security group that allows TCP port 179 from 10.10.2.4.", fr: "Associer à RouteServerSubnet un groupe de sécurité réseau autorisant le port TCP 179 depuis 10.10.2.4." } }
    - { id: vng, text: { en: "Create a VPN gateway in VNet-Hub and enable BGP on it.", fr: "Créer une passerelle VPN dans VNet-Hub et y activer BGP." } }
answer:
  sequence: [ subnet, ars, peer ]
explanation:
  correct:
    en: |
      The route server needs a dedicated RouteServerSubnet of /26 or larger, so the subnet comes first. You then create the route server with a Standard public IP address, which the platform uses to manage it. Finally, under Settings > Peers you add NVA1 with its ASN and IP address; the NVA team then peers NVA1 with both IP addresses shown in the route server's virtualRouterIps, using the ASN 65515.
    fr: |
      Le serveur de routes nécessite un sous-réseau dédié RouteServerSubnet de /26 ou plus : le sous-réseau vient en premier. Vous créez ensuite le serveur de routes avec une adresse IP publique Standard, utilisée par la plateforme pour le gérer. Enfin, sous Paramètres > Homologues (Peers), vous ajoutez NVA1 avec son ASN et son adresse IP ; l'équipe NVA établit alors le peering de NVA1 avec les deux adresses IP indiquées dans virtualRouterIps, avec l'ASN 65515.
  options:
    rt: { en: "Route tables are not supported on RouteServerSubnet, and the default route is learned over BGP, not configured as a user-defined route.", fr: "Les tables de routage ne sont pas prises en charge sur RouteServerSubnet, et l'itinéraire par défaut est appris par BGP, pas configuré comme itinéraire défini par l'utilisateur." }
    nsg: { en: "Network security groups are not supported on RouteServerSubnet.", fr: "Les groupes de sécurité réseau ne sont pas pris en charge sur RouteServerSubnet." }
    vng: { en: "Route Server peers directly with NVAs; a virtual network gateway is not required.", fr: "Le Serveur de routes établit directement le peering avec les NVA ; une passerelle de réseau virtuel n'est pas nécessaire." }
references:
  - title: "Quickstart: Create an Azure Route Server using Azure portal"
    url: https://learn.microsoft.com/en-us/azure/route-server/quickstart-create-route-server-portal
  - title: Azure Route Server frequently asked questions
    url: https://learn.microsoft.com/en-us/azure/route-server/route-server-faq
