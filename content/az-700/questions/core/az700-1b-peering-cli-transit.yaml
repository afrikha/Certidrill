id: az700-1b-peering-cli-transit
objective: "1.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has two virtual networks in a resource group named **RG1**:

    - **Hub**, which contains a VPN gateway connected to the on-premises network.
    - **Spoke1**, which contains no gateway.

    You need to peer the virtual networks by using Azure CLI. The virtual machines of Spoke1 must reach the on-premises network through the VPN gateway of Hub.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose de deux réseaux virtuels dans un groupe de ressources nommé **RG1** :

    - **Hub**, qui contient une passerelle VPN connectée au réseau local.
    - **Spoke1**, qui ne contient aucune passerelle.

    Vous devez relier les réseaux virtuels par peering avec Azure CLI. Les machines virtuelles de Spoke1 doivent joindre le réseau local par la passerelle VPN de Hub.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network vnet peering create --resource-group RG1 --name Hub-to-Spoke1 \
      --vnet-name Hub --remote-vnet Spoke1 --allow-vnet-access true [[hub]]

    az network vnet peering create --resource-group RG1 --name Spoke1-to-Hub \
      --vnet-name Spoke1 --remote-vnet Hub --allow-vnet-access true [[spoke]]
  slots:
    - id: hub
      options:
        - { id: transit, text: --allow-gateway-transit true }
        - { id: remote, text: --use-remote-gateways true }
        - { id: fwd, text: --allow-forwarded-traffic true }
        - { id: full, text: --peer-complete-vnets true }
    - id: spoke
      options:
        - { id: transit, text: --allow-gateway-transit true }
        - { id: remote, text: --use-remote-gateways true }
        - { id: fwd, text: --allow-forwarded-traffic true }
        - { id: full, text: --peer-complete-vnets true }
answer:
  values: { hub: transit, spoke: remote }
explanation:
  correct:
    en: "Gateway transit needs both sides: the peering on the network that owns the gateway allows gateway transit (`--allow-gateway-transit`), and the peering on the spoke uses the remote gateway (`--use-remote-gateways`). Only one peering of the pair can use the remote gateway, and only if the spoke has no gateway of its own."
    fr: "Le transit par passerelle exige les deux côtés : le peering du réseau qui possède la passerelle autorise le transit par passerelle (`--allow-gateway-transit`), et le peering du spoke utilise la passerelle distante (`--use-remote-gateways`). Un seul peering de la paire peut utiliser la passerelle distante, et seulement si le spoke n'a pas sa propre passerelle."
  options:
    fwd: { en: "Forwarded traffic concerns traffic relayed by an NVA or a gateway; it doesn't give Spoke1 the routes of the hub gateway.", fr: "Le trafic transféré concerne le trafic relayé par une NVA ou une passerelle ; il ne donne pas à Spoke1 les itinéraires de la passerelle du hub." }
    full: { en: "--peer-complete-vnets controls whether the whole address space or only some subnets are peered (true is already the default).", fr: "--peer-complete-vnets indique si tout l'espace d'adressage ou seulement certains sous-réseaux sont reliés (true est déjà la valeur par défaut)." }
references:
  - title: az network vnet peering
    url: https://learn.microsoft.com/en-us/cli/azure/network/vnet/peering
  - title: Configure VPN gateway transit for virtual network peering
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-peering-gateway-transit
