id: az700-1a-17-delegation-rules
objective: "1.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a virtual network named VNet1 with the following subnets:

    | Subnet | Delegation | Resources |
    | --- | --- | --- |
    | snet-web | Microsoft.Web/serverFarms | Regional virtual network integration of an App Service plan named ASP1 |
    | snet-dns | None | None |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un réseau virtuel nommé VNet1 avec les sous-réseaux suivants :

    | Sous-réseau | Délégation | Ressources |
    | --- | --- | --- |
    | snet-web | Microsoft.Web/serverFarms | Intégration au réseau virtuel régional d'un plan App Service nommé ASP1 |
    | snet-dns | Aucune | Aucune |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can create a private endpoint for a Key Vault in snet-web.
        fr: Vous pouvez créer un point de terminaison privé pour un coffre de clés dans snet-web.
    - id: s2
      text:
        en: After you delegate snet-dns to Microsoft.Network/dnsResolvers, you can use it for the inbound endpoint of an Azure DNS Private Resolver.
        fr: Après avoir délégué snet-dns à Microsoft.Network/dnsResolvers, vous pouvez l'utiliser pour le point de terminaison entrant d'un Azure DNS Private Resolver.
    - id: s3
      text:
        en: While ASP1 is still integrated with snet-web, you can set the delegation of snet-web to None.
        fr: Tant qu'ASP1 est intégré à snet-web, vous pouvez définir la délégation de snet-web sur None.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: A delegated subnet can't host a private endpoint. Each DNS Private Resolver endpoint needs its own subnet delegated to Microsoft.Network/dnsResolvers. A delegation can't be added or removed while resources of the delegated service are deployed in the subnet, so the integration must be removed first.
    fr: |
      Un sous-réseau délégué ne peut pas héberger de point de terminaison privé. Chaque point de terminaison d'Azure DNS Private Resolver a besoin de son propre sous-réseau délégué à Microsoft.Network/dnsResolvers. Une délégation ne peut être ni ajoutée ni supprimée tant que des ressources du service délégué sont déployées dans le sous-réseau : l'intégration doit d'abord être supprimée.
references:
  - title: Add, change, or delete a virtual network subnet
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-subnet
  - title: What is Azure DNS Private Resolver?
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
