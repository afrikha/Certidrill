id: az700-cs3b-lab-connectivity
objective: "1.3.3"
type: dropdown
caseStudy: az700-cs3b-bellows
difficulty: 2
status: draft
stem:
  en: |
    You plan to use AVNM1 to meet the requirement for the lab virtual networks. You create a network group named **NG-Labs** and a connectivity configuration, and you will deploy the configuration to West Europe.

    How should you configure NG-Labs and the connectivity configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser AVNM1 pour respecter l'exigence relative aux réseaux virtuels de travaux pratiques. Vous créez un groupe réseau nommé **NG-Labs** et une configuration de connectivité, que vous déploierez dans West Europe.

    Comment devez-vous configurer NG-Labs et la configuration de connectivité ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Membership of NG-Labs: [[member]]

      Topology: [[topo]]

      Setting to enable for the spoke network group: [[setting]]
    fr: |
      Appartenance à NG-Labs : [[member]]

      Topologie : [[topo]]

      Paramètre à activer pour le groupe réseau spoke : [[setting]]
  slots:
    - id: member
      options:
        - { id: static, text: { en: "Static members added at the start of each semester", fr: "Membres statiques ajoutés au début de chaque semestre" } }
        - { id: dynamic, text: { en: "Dynamic membership with an Azure Policy condition on the tag Purpose = Lab", fr: "Appartenance dynamique avec une condition Azure Policy sur l'étiquette Purpose = Lab" } }
        - { id: dynsub, text: { en: "Dynamic membership with an Azure Policy condition on the subscription Sub-Core", fr: "Appartenance dynamique avec une condition Azure Policy sur l'abonnement Sub-Core" } }
    - id: topo
      options:
        - { id: mesh, text: { en: "Mesh", fr: "Maillage (Mesh)" } }
        - { id: hubdirect, text: { en: "Hub and spoke with Hub-VNet as the hub and direct connectivity enabled for NG-Labs", fr: "Hub and spoke avec Hub-VNet comme hub et connectivité directe activée pour NG-Labs" } }
        - { id: hub, text: { en: "Hub and spoke with Hub-VNet as the hub and direct connectivity disabled for NG-Labs", fr: "Hub and spoke avec Hub-VNet comme hub et connectivité directe désactivée pour NG-Labs" } }
    - id: setting
      options:
        - { id: gateway, text: Use hub as a gateway }
        - { id: delete, text: Delete existing peerings }
        - { id: global, text: Enable mesh connectivity across regions }
        - { id: enforce, text: Enforce peering }
answer:
  values: { member: dynamic, topo: hub, setting: gateway }
explanation:
  correct:
    en: |
      With dynamic membership, Azure Policy evaluates a condition such as the Purpose = Lab tag and adds every matching virtual network to NG-Labs as instructors create them, without manual work. A hub-and-spoke configuration makes AVNM create the peerings between Hub-VNet and each spoke; leaving direct connectivity disabled keeps the lab virtual networks from talking to each other. Use hub as a gateway lets the spokes use GW-VPN to reach the campuses.
    fr: |
      Avec l'appartenance dynamique, Azure Policy évalue une condition comme l'étiquette Purpose = Lab et ajoute à NG-Labs chaque réseau virtuel correspondant au fur et à mesure que les enseignants les créent, sans travail manuel. Une configuration hub and spoke fait créer par AVNM les peerings entre Hub-VNet et chaque spoke ; laisser la connectivité directe désactivée empêche les réseaux virtuels de travaux pratiques de communiquer entre eux. Use hub as a gateway permet aux spokes d'utiliser GW-VPN pour atteindre les campus.
  options:
    dynsub: { en: "The lab virtual networks are created in Sub-Labs, not in Sub-Core; this condition would also add Hub-VNet and VNet-LMS.", fr: "Les réseaux virtuels de travaux pratiques sont créés dans Sub-Labs, pas dans Sub-Core ; cette condition ajouterait aussi Hub-VNet et VNet-LMS." }
    static: { en: "Static members must be added by hand each semester, which doesn't meet the as-soon-as-created requirement and adds effort.", fr: "Les membres statiques doivent être ajoutés à la main chaque semestre, ce qui ne respecte pas l'exigence de connexion dès la création et ajoute de l'effort." }
    mesh: { en: "A mesh connects every member to every other member, so the lab virtual networks could communicate with each other, and it provides no gateway transit through Hub-VNet.", fr: "Un maillage relie chaque membre à tous les autres : les réseaux virtuels de travaux pratiques pourraient communiquer entre eux, et il n'apporte aucun transit de passerelle par Hub-VNet." }
    hubdirect: { en: "Direct connectivity lets the virtual networks of the spoke group talk directly to each other.", fr: "La connectivité directe permet aux réseaux virtuels du groupe spoke de communiquer directement entre eux." }
    delete: { en: "Deleting existing peerings removes peerings that the configuration doesn't define; it doesn't give access to GW-VPN.", fr: "La suppression des peerings existants retire les peerings que la configuration ne définit pas ; elle ne donne pas accès à GW-VPN." }
references:
  - title: Connectivity configurations in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-connectivity-configuration
  - title: What is a network group in Azure Virtual Network Manager?
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-network-groups
