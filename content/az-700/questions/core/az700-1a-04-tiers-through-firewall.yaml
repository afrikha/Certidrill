id: az700-1a-04-tiers-through-firewall
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has a virtual network named VNet1 with the address space 10.40.0.0/16. VNet1 contains an Azure Firewall instance in AzureFirewallSubnet (private IP address 10.40.0.4) and a subnet named Apps (10.40.1.0/24) that hosts the web servers and the database servers of an application.

    A new security policy requires that all the traffic between the web servers and the database servers be inspected by Azure Firewall. The servers must stay in VNet1.

    What should you do?
  fr: |
    Litware dispose d'un réseau virtuel nommé VNet1 dont l'espace d'adressage est 10.40.0.0/16. VNet1 contient une instance du Pare-feu Azure dans AzureFirewallSubnet (adresse IP privée 10.40.0.4) et un sous-réseau nommé Apps (10.40.1.0/24) qui héberge les serveurs web et les serveurs de base de données d'une application.

    Une nouvelle stratégie de sécurité exige que tout le trafic entre les serveurs web et les serveurs de base de données soit inspecté par le Pare-feu Azure. Les serveurs doivent rester dans VNet1.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Move the database servers to a new subnet, and associate route tables that send the traffic between the two subnets to 10.40.0.4.
        fr: Déplacer les serveurs de base de données vers un nouveau sous-réseau et associer des tables de routage qui envoient le trafic entre les deux sous-réseaux vers 10.40.0.4.
    - id: b
      text:
        en: Keep the servers in Apps, create two application security groups, and add NSG rules that allow only SQL traffic between them.
        fr: Conserver les serveurs dans Apps, créer deux groupes de sécurité d'application et ajouter des règles NSG qui n'autorisent que le trafic SQL entre eux.
    - id: c
      text:
        en: Keep the servers in Apps, and associate a route table with AzureFirewallSubnet that sends 10.40.1.0/24 to 10.40.0.4.
        fr: Conserver les serveurs dans Apps et associer à AzureFirewallSubnet une table de routage qui envoie 10.40.1.0/24 vers 10.40.0.4.
    - id: d
      text:
        en: Move the database servers to a new subnet, and associate an NSG with each subnet that denies the traffic between the two subnets.
        fr: Déplacer les serveurs de base de données vers un nouveau sous-réseau et associer à chaque sous-réseau un NSG qui refuse le trafic entre les deux sous-réseaux.
answer: { optionId: a }
explanation:
  correct:
    en: Routing decisions are made per destination prefix, and Azure routes traffic between subnets directly by default. Separating the tiers into two subnets and associating route tables whose routes send the other subnet's prefix to the firewall as a virtual appliance forces the traffic in both directions through Azure Firewall.
    fr: Les décisions de routage se prennent par préfixe de destination, et Azure route par défaut le trafic directement entre les sous-réseaux. Séparer les niveaux dans deux sous-réseaux et associer des tables de routage dont les itinéraires envoient le préfixe de l'autre sous-réseau vers le pare-feu comme appliance virtuelle force le trafic dans les deux sens à traverser le Pare-feu Azure.
  options:
    b: { en: "NSGs and application security groups filter the traffic but never send it to the firewall for inspection.", fr: "Les NSG et les groupes de sécurité d'application filtrent le trafic mais ne l'envoient jamais au pare-feu pour inspection." }
    c: { en: "A route table applies to the traffic that leaves the subnet it is associated with. On AzureFirewallSubnet it doesn't change the path of the traffic between the servers of Apps, and it would send the firewall's own traffic back to itself.", fr: "Une table de routage s'applique au trafic qui quitte le sous-réseau auquel elle est associée. Sur AzureFirewallSubnet, elle ne change pas le chemin du trafic entre les serveurs d'Apps, et elle renverrait le trafic du pare-feu vers lui-même." }
    d: { en: "Denying the traffic breaks the application instead of having it inspected by the firewall.", fr: "Refuser le trafic casse l'application au lieu de le faire inspecter par le pare-feu." }
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
