id: az700-1b-private-dns-autoreg-scope
objective: "1.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a private DNS zone named **corp.contoso.internal** with the following virtual network links:

    | Virtual network | Autoregistration |
    | --- | --- |
    | VNet1 | Enabled |
    | VNet2 | Disabled |

    VNet1 and VNet2 aren't peered, and both use Azure-provided DNS. VNet1 contains:

    - A virtual machine named **VM1** with two network interfaces, nic1 (primary) and nic2.
    - An internal load balancer named **ILB1** with the frontend IP address 10.1.2.10.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une zone DNS privée nommée **corp.contoso.internal** avec les liens de réseau virtuel suivants :

    | Réseau virtuel | Inscription automatique |
    | --- | --- |
    | VNet1 | Activée |
    | VNet2 | Désactivée |

    VNet1 et VNet2 ne sont pas reliés par peering, et les deux utilisent le DNS fourni par Azure. VNet1 contient :

    - Une machine virtuelle nommée **VM1** avec deux interfaces réseau, nic1 (principale) et nic2.
    - Un équilibreur de charge interne nommé **ILB1** dont l'adresse IP frontale est 10.1.2.10.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An A record is created automatically for the IP address of nic2.
        fr: Un enregistrement A est créé automatiquement pour l'adresse IP de nic2.
    - id: s2
      text:
        en: An A record is created automatically for the frontend IP address of ILB1.
        fr: Un enregistrement A est créé automatiquement pour l'adresse IP frontale d'ILB1.
    - id: s3
      text:
        en: A virtual machine in VNet2 can resolve the record that was registered for VM1.
        fr: Une machine virtuelle de VNet2 peut résoudre l'enregistrement inscrit pour VM1.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Autoregistration creates A records only for virtual machines, and only for their primary network interface; records for other network interfaces or for resources such as internal load balancers must be created manually. A resolution link lets VNet2 resolve every record of the zone, including those registered from VNet1, and private zones don't require peering.
    fr: |
      L'inscription automatique ne crée des enregistrements A que pour les machines virtuelles, et seulement pour leur interface réseau principale ; les enregistrements des autres interfaces réseau ou de ressources comme les équilibreurs de charge internes doivent être créés manuellement. Un lien de résolution permet à VNet2 de résoudre tous les enregistrements de la zone, y compris ceux inscrits depuis VNet1, et les zones privées n'exigent pas de peering.
references:
  - title: What is the autoregistration feature in Azure DNS private zones?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-autoregistration
  - title: Azure Private DNS FAQ
    url: https://learn.microsoft.com/en-us/azure/dns/dns-faq-private
