id: az700-1a-43-pip-routing-preference
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a virtual machine named VM-Batch that uploads large result files to clients on the internet. VM-Batch uses a public IP address named pip-batch with the following settings: SKU Standard, IPv4, zone-redundant, routing preference **Microsoft network**.

    You need to reduce the internet egress data transfer cost of VM-Batch. Latency isn't a concern.

    What should you do?
  fr: |
    Proseware dispose d'une machine virtuelle nommée VM-Batch qui envoie des fichiers de résultats volumineux à des clients sur Internet. VM-Batch utilise une adresse IP publique nommée pip-batch avec les paramètres suivants : SKU Standard, IPv4, redondante interzone, préférence de routage **Réseau Microsoft**.

    Vous devez réduire le coût de transfert de données en sortie vers Internet de VM-Batch. La latence n'est pas un critère.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Change the routing preference of pip-batch to Internet.
        fr: Passer la préférence de routage de pip-batch sur Internet.
    - id: b
      text:
        en: Create a zone-redundant Standard public IP address with routing preference Internet, and associate it with VM-Batch instead of pip-batch.
        fr: Créer une adresse IP publique Standard redondante interzone avec la préférence de routage Internet, puis l'associer à VM-Batch à la place de pip-batch.
    - id: c
      text:
        en: Create a Standard v2 public IP address with routing preference Internet, and associate it with VM-Batch instead of pip-batch.
        fr: Créer une adresse IP publique Standard v2 avec la préférence de routage Internet, puis l'associer à VM-Batch à la place de pip-batch.
    - id: d
      text:
        en: Create a Standard public IP address in the Global tier, and associate it with VM-Batch instead of pip-batch.
        fr: Créer une adresse IP publique Standard de niveau Global, puis l'associer à VM-Batch à la place de pip-batch.
answer: { optionId: b }
explanation:
  correct:
    en: Routing preference Internet sends traffic through transit ISP networks and lowers the egress data transfer price. It is supported for virtual machines with zone-redundant Standard IPv4 addresses, and it can only be chosen when the public IP address is created, so a new address is needed.
    fr: |
      La préférence de routage Internet fait passer le trafic par les réseaux des FAI de transit et réduit le prix du transfert de données en sortie. Elle est prise en charge pour les machines virtuelles avec des adresses IPv4 Standard redondantes interzone, et elle ne se choisit qu'à la création de l'adresse IP publique : une nouvelle adresse est nécessaire.
  options:
    a: { en: "The routing preference of a public IP address can't be changed after creation.", fr: "La préférence de routage d'une adresse IP publique ne peut pas être modifiée après la création." }
    c: { en: "Standard v2 public IP addresses don't support routing preference Internet and work only with a StandardV2 NAT gateway.", fr: "Les adresses IP publiques Standard v2 ne prennent pas en charge la préférence de routage Internet et ne fonctionnent qu'avec une passerelle NAT StandardV2." }
    d: { en: "The Global tier provides an anycast address for a global load balancer; it doesn't reduce egress cost and isn't used on a virtual machine.", fr: "Le niveau Global fournit une adresse anycast pour un équilibreur de charge global ; il ne réduit pas le coût en sortie et ne s'utilise pas sur une machine virtuelle." }
references:
  - title: Routing preference in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/routing-preference-overview
