id: az700-1b-udr-route-selection
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a virtual network named **VNet1** (10.1.0.0/16) that contains a VPN gateway connected to the on-premises network by using BGP, and a network virtual appliance at 10.1.9.4. The following exhibit shows the effective routes of the network interface of a virtual machine named **VM1** in VNet1.

    VM1 sends traffic to 10.50.1.20 and to 10.50.2.20.

    Which next hop does Azure use for each destination?
  fr: |
    Adatum dispose d'un réseau virtuel nommé **VNet1** (10.1.0.0/16) qui contient une passerelle VPN connectée au réseau local avec BGP, et une appliance virtuelle réseau à l'adresse 10.1.9.4. La pièce suivante présente les itinéraires effectifs de l'interface réseau d'une machine virtuelle nommée **VM1** dans VNet1.

    VM1 envoie du trafic vers 10.50.1.20 et vers 10.50.2.20.

    Quel tronçon suivant Azure utilise-t-il pour chaque destination ?
exhibits:
  - id: routes
    title: { en: "Effective routes of VM1", fr: "Itinéraires effectifs de VM1" }
    body:
      en: |
        | Source | State | Address prefixes | Next hop type | Next hop IP address |
        | --- | --- | --- | --- | --- |
        | Default | Active | 10.1.0.0/16 | Virtual network | - |
        | Virtual network gateway | Active | 10.50.1.0/24 | Virtual network gateway | 10.1.255.4 |
        | Virtual network gateway | Invalid | 10.50.0.0/16 | Virtual network gateway | 10.1.255.4 |
        | User | Active | 10.50.0.0/16 | Virtual appliance | 10.1.9.4 |
        | Default | Active | 0.0.0.0/0 | Internet | - |
      fr: |
        | Source | État | Préfixes d'adresse | Type de tronçon suivant | Adresse IP du tronçon suivant |
        | --- | --- | --- | --- | --- |
        | Par défaut | Active | 10.1.0.0/16 | Réseau virtuel | - |
        | Passerelle de réseau virtuel | Active | 10.50.1.0/24 | Passerelle de réseau virtuel | 10.1.255.4 |
        | Passerelle de réseau virtuel | Invalid | 10.50.0.0/16 | Passerelle de réseau virtuel | 10.1.255.4 |
        | Utilisateur | Active | 10.50.0.0/16 | Appliance virtuelle | 10.1.9.4 |
        | Par défaut | Active | 0.0.0.0/0 | Internet | - |
body:
  options:
    - id: a
      text: { en: "10.50.1.20: the network virtual appliance; 10.50.2.20: the network virtual appliance", fr: "10.50.1.20 : l'appliance virtuelle réseau ; 10.50.2.20 : l'appliance virtuelle réseau" }
    - id: b
      text: { en: "10.50.1.20: the network virtual appliance; 10.50.2.20: the VPN gateway", fr: "10.50.1.20 : l'appliance virtuelle réseau ; 10.50.2.20 : la passerelle VPN" }
    - id: c
      text: { en: "10.50.1.20: the VPN gateway; 10.50.2.20: the VPN gateway", fr: "10.50.1.20 : la passerelle VPN ; 10.50.2.20 : la passerelle VPN" }
    - id: d
      text: { en: "10.50.1.20: the VPN gateway; 10.50.2.20: the network virtual appliance", fr: "10.50.1.20 : la passerelle VPN ; 10.50.2.20 : l'appliance virtuelle réseau" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure first selects the route with the longest prefix that matches the destination. 10.50.1.20 matches the BGP route 10.50.1.0/24, which is more specific than the user-defined 10.50.0.0/16, so it goes to the VPN gateway. 10.50.2.20 matches only the /16 prefixes; for identical prefixes a user-defined route wins over a BGP route, which is why the BGP 10.50.0.0/16 route is Invalid and the traffic goes to the appliance.
    fr: |
      Azure sélectionne d'abord l'itinéraire dont le préfixe le plus long correspond à la destination. 10.50.1.20 correspond à l'itinéraire BGP 10.50.1.0/24, plus spécifique que l'itinéraire défini par l'utilisateur 10.50.0.0/16 : il part vers la passerelle VPN. 10.50.2.20 ne correspond qu'aux préfixes /16 ; à préfixe identique, un itinéraire défini par l'utilisateur l'emporte sur un itinéraire BGP, c'est pourquoi l'itinéraire BGP 10.50.0.0/16 est Invalid et le trafic part vers l'appliance.
  options:
    a: { en: "The user-defined route doesn't override a longer BGP prefix: longest prefix match is applied before the source of the route.", fr: "L'itinéraire défini par l'utilisateur ne remplace pas un préfixe BGP plus long : la correspondance du préfixe le plus long est appliquée avant la source de l'itinéraire." }
    b: { en: "This reverses the result: the /24 BGP route covers 10.50.1.20, and only the /16 routes cover 10.50.2.20.", fr: "Cette réponse inverse le résultat : l'itinéraire BGP /24 couvre 10.50.1.20, et seuls les itinéraires /16 couvrent 10.50.2.20." }
    c: { en: "The BGP 10.50.0.0/16 route is Invalid because a user-defined route with the same prefix takes precedence.", fr: "L'itinéraire BGP 10.50.0.0/16 est Invalid, car un itinéraire défini par l'utilisateur de même préfixe est prioritaire." }
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
