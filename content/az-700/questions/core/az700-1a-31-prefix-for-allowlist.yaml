id: az700-1a-31-prefix-for-allowlist
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders hosts twelve web servers on Azure virtual machines in East US. Each server needs its own public IPv4 address, and up to four more servers will be added within a year. A payment provider calls back the servers only at addresses listed in its firewall, and each change to that list takes several weeks of approval. Northwind Traders doesn't own a public IP range.

    You need to minimize the number of changes requested from the payment provider.

    What should you use?
  fr: |
    Northwind Traders héberge douze serveurs web sur des machines virtuelles Azure dans la région East US. Chaque serveur a besoin de sa propre adresse IPv4 publique, et jusqu'à quatre serveurs supplémentaires seront ajoutés dans l'année. Un prestataire de paiement ne rappelle les serveurs qu'aux adresses inscrites dans son pare-feu, et chaque modification de cette liste demande plusieurs semaines d'approbation. Northwind Traders ne possède pas de plage d'adresses IP publiques.

    Vous devez réduire au minimum le nombre de modifications demandées au prestataire de paiement.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Twelve individual Standard public IP addresses", fr: "Douze adresses IP publiques Standard individuelles" } }
    - { id: b, text: { en: "A /28 public IP prefix", fr: "Un préfixe d'adresse IP publique /28" } }
    - { id: c, text: { en: "A custom IP prefix", fr: "Un préfixe d'adresse IP personnalisé" } }
    - { id: d, text: { en: "A NAT gateway with one public IP address", fr: "Une passerelle NAT dotée d'une adresse IP publique" } }
answer: { optionId: b }
explanation:
  correct:
    en: A /28 public IP prefix reserves 16 contiguous addresses, enough for the twelve servers and the four planned ones. The provider allows the range once, and every address later created from the prefix is already covered.
    fr: Un préfixe d'adresse IP publique /28 réserve 16 adresses contiguës, assez pour les douze serveurs et les quatre prévus. Le prestataire autorise la plage une seule fois, et chaque adresse créée ensuite à partir du préfixe est déjà couverte.
  options:
    a: { en: "Individual addresses aren't contiguous: each new server would require another change to the provider's list.", fr: "Des adresses individuelles ne sont pas contiguës : chaque nouveau serveur exigerait une nouvelle modification de la liste du prestataire." }
    c: { en: "A custom IP prefix onboards a range that the company owns, and Northwind Traders owns none.", fr: "Un préfixe d'adresse IP personnalisé intègre une plage que l'entreprise possède, et Northwind Traders n'en possède aucune." }
    d: { en: "A NAT gateway provides outbound connections only; the provider must reach each server individually.", fr: "Une passerelle NAT ne fournit que des connexions sortantes ; le prestataire doit joindre chaque serveur individuellement." }
references:
  - title: Public IP address prefix
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix
