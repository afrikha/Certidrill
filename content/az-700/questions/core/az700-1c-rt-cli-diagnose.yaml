id: az700-1c-rt-cli-diagnose
objective: "1.3.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A virtual machine named **VM1** in resource group **RG1** has a network interface named **vm1-nic** with the private IP address 10.1.0.4. VM1 cannot reach the host 10.20.5.10.

    You need to use the Azure CLI to:

    - list every route that applies to vm1-nic, whatever its source;
    - identify the next hop type and the route table used for traffic from VM1 to 10.20.5.10.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une machine virtuelle nommée **VM1** dans le groupe de ressources **RG1** possède une interface réseau nommée **vm1-nic** dont l'adresse IP privée est 10.1.0.4. VM1 ne parvient pas à joindre l'hôte 10.20.5.10.

    Vous devez utiliser Azure CLI pour :

    - lister tous les itinéraires qui s'appliquent à vm1-nic, quelle que soit leur origine ;
    - identifier le type de tronçon suivant et la table de routage utilisés pour le trafic de VM1 vers 10.20.5.10.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network nic [[cmd1]] \
      --resource-group RG1 --name vm1-nic

    az network watcher [[cmd2]] \
      --resource-group RG1 --vm VM1 \
      --source-ip 10.1.0.4 --dest-ip 10.20.5.10
  slots:
    - id: cmd1
      options:
        - { id: route, text: show-effective-route-table }
        - { id: nsg, text: list-effective-nsg }
        - { id: show, text: show }
        - { id: update, text: update }
    - id: cmd2
      options:
        - { id: topo, text: show-topology }
        - { id: flow, text: test-ip-flow }
        - { id: hop, text: show-next-hop }
        - { id: conn, text: test-connectivity }
answer:
  values: { cmd1: route, cmd2: hop }
explanation:
  correct:
    en: "`az network nic show-effective-route-table` returns the effective routes of a network interface (system, BGP and user-defined). `az network watcher show-next-hop` takes the VM, a source IP and a destination IP, and returns the next hop type, the next hop IP address and the route table ID, or System Route when no user-defined route applies."
    fr: "`az network nic show-effective-route-table` renvoie les itinéraires effectifs d'une interface réseau (système, BGP et définis par l'utilisateur). `az network watcher show-next-hop` prend la machine virtuelle, une adresse IP source et une adresse IP de destination, et renvoie le type de tronçon suivant, l'adresse IP du tronçon suivant et l'ID de la table de routage, ou System Route si aucun itinéraire défini par l'utilisateur ne s'applique."
  options:
    nsg: { en: "list-effective-nsg returns the effective security rules, not the routes.", fr: "list-effective-nsg renvoie les règles de sécurité effectives, pas les itinéraires." }
    show: { en: "show returns the NIC configuration, which does not include the effective routes.", fr: "show renvoie la configuration de la carte réseau, qui n'inclut pas les itinéraires effectifs." }
    update: { en: "update modifies the NIC; it does not report routes.", fr: "update modifie la carte réseau ; elle ne renvoie pas d'itinéraires." }
    topo: { en: "show-topology describes the resources of a resource group and their relationships, not the route used by a flow.", fr: "show-topology décrit les ressources d'un groupe de ressources et leurs relations, pas l'itinéraire utilisé par un flux." }
    flow: { en: "test-ip-flow checks whether security rules allow or deny a flow; it does not return the next hop.", fr: "test-ip-flow vérifie si les règles de sécurité autorisent ou refusent un flux ; elle ne renvoie pas le tronçon suivant." }
    conn: { en: "test-connectivity tests a connection end to end; it does not take --source-ip and --dest-ip to return the route table used.", fr: "test-connectivity teste une connexion de bout en bout ; elle ne prend pas --source-ip et --dest-ip pour renvoyer la table de routage utilisée." }
references:
  - title: Diagnose a virtual machine routing problem
    url: https://learn.microsoft.com/en-us/azure/virtual-network/diagnose-network-routing-problem
  - title: Next hop overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/next-hop-overview
