id: az700-1c-ddos-tier-choice
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso hosts an e-commerce platform in two virtual networks of different subscriptions in the same Microsoft Entra tenant. The platform exposes 12 Standard public IP addresses through application gateways and load balancers.

    Management requires the following during volumetric attacks:

    - access to the DDoS Rapid Response team during an active attack;
    - service credits for the scale-out and data transfer costs caused by a documented attack.

    Which protection should you enable?
  fr: |
    Contoso héberge une plateforme de commerce électronique dans deux réseaux virtuels d'abonnements différents du même locataire Microsoft Entra. La plateforme expose 12 adresses IP publiques Standard via des passerelles d'application et des équilibreurs de charge.

    La direction exige les éléments suivants en cas d'attaque volumétrique :

    - l'accès à l'équipe DDoS Rapid Response pendant une attaque active ;
    - des crédits de service pour les coûts de scale-out et de transfert de données causés par une attaque documentée.

    Quelle protection devez-vous activer ?
body:
  options:
    - id: a
      text: { en: "DDoS IP Protection on each of the 12 public IP addresses", fr: "DDoS IP Protection sur chacune des 12 adresses IP publiques" }
    - id: b
      text: { en: "DDoS Network Protection with one plan linked to both virtual networks", fr: "DDoS Network Protection avec un seul plan lié aux deux réseaux virtuels" }
    - id: c
      text: { en: "The default infrastructure DDoS protection of the Azure platform", fr: "La protection DDoS d'infrastructure par défaut de la plateforme Azure" }
    - id: d
      text: { en: "The WAF v2 tier on each application gateway with bot protection rules", fr: "Le niveau WAF v2 sur chaque passerelle d'application avec des règles de protection contre les bots" }
answer: { optionId: b }
explanation:
  correct:
    en: DDoS rapid response support and cost protection are available only with DDoS Network Protection; DDoS IP Protection has the same core mitigation features but not these two. A single DDoS protection plan can protect virtual networks in multiple subscriptions of the same tenant, so one plan linked to both virtual networks is enough.
    fr: "Le support DDoS Rapid Response et la protection des coûts ne sont disponibles qu'avec DDoS Network Protection ; DDoS IP Protection offre les mêmes fonctionnalités d'atténuation de base, mais pas ces deux-là. Un même plan de protection DDoS peut protéger des réseaux virtuels de plusieurs abonnements du même locataire : un seul plan lié aux deux réseaux virtuels suffit."
  options:
    a: { en: "DDoS IP Protection doesn't include DDoS rapid response support or cost protection.", fr: "DDoS IP Protection n'inclut ni le support DDoS Rapid Response ni la protection des coûts." }
    c: { en: "The default infrastructure protection offers no rapid response support, no cost protection and no tuning to your application.", fr: "La protection d'infrastructure par défaut n'offre ni support Rapid Response, ni protection des coûts, ni réglage adapté à votre application." }
    d: { en: "A WAF protects against layer 7 attacks; it doesn't provide DDoS rapid response or cost protection for volumetric attacks.", fr: "Un WAF protège contre les attaques de couche 7 ; il ne fournit ni Rapid Response ni protection des coûts pour les attaques volumétriques." }
references:
  - title: About Azure DDoS Protection Tier Comparison
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-sku-comparison
  - title: What is Azure DDoS Protection?
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/ddos-protection-overview
