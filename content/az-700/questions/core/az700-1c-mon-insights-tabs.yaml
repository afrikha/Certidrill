id: az700-1c-mon-insights-tabs
objective: "1.4.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Azure Monitor Network insights to operate its Azure networks. An engineer must perform the following tasks from Network insights.

    Which part of Network insights should the engineer use for each task? To answer, drag the appropriate parts to the correct tasks. Each part may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise les insights réseau (Network insights) d'Azure Monitor pour exploiter ses réseaux Azure. Un ingénieur doit effectuer les tâches suivantes depuis Network insights.

    Quelle partie de Network insights l'ingénieur doit-il utiliser pour chaque tâche ? Pour répondre, faites glisser les parties appropriées vers les tâches correspondantes. Chaque partie peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: health, text: Network health }
    - { id: conn, text: Connectivity }
    - { id: traffic, text: Traffic }
    - { id: toolkit, text: Diagnostic Toolkit }
    - { id: topo, text: Topology }
  targets:
    - id: t1
      text: { en: "See how many ExpressRoute and VPN connections are unavailable across the selected subscriptions.", fr: "Voir combien de connexions ExpressRoute et VPN sont indisponibles dans les abonnements sélectionnés." }
    - id: t2
      text: { en: "Review the reachability status of the tests configured in Connection monitor, grouped by sources and destinations.", fr: "Consulter l'état d'accessibilité des tests configurés dans le Moniteur de connexion, regroupés par sources et destinations." }
    - id: t3
      text: { en: "Find the network security groups that are not configured for flow logs and traffic analytics.", fr: "Trouver les groupes de sécurité réseau qui ne sont pas configurés pour les journaux de flux et traffic analytics." }
    - id: t4
      text: { en: "Start a VPN troubleshoot or IP flow verify operation from a drop-down list.", fr: "Lancer une résolution des problèmes de VPN ou une vérification des flux IP à partir d'une liste déroulante." }
answer:
  mapping: { t1: health, t2: conn, t3: traffic, t4: toolkit }
explanation:
  correct:
    en: The Network health view shows a tile per resource type with instance counts and health, for example healthy and unavailable connections. The Connectivity tab lists Connection monitor tests by Sources and Destinations with their reachability. The Traffic tab lists the NSGs and shows which ones are configured for flow logs and traffic analytics. The Diagnostic Toolkit tab offers packet capture, VPN troubleshoot, connection troubleshoot, next hop and IP flow verify. Topology visualizes resources and their relationships.
    fr: "La vue Network health affiche une vignette par type de ressource avec le nombre d'instances et leur intégrité, par exemple les connexions saines et indisponibles. L'onglet Connectivity liste les tests du Moniteur de connexion par sources (Sources) et destinations (Destinations) avec leur accessibilité. L'onglet Traffic liste les NSG et indique ceux qui sont configurés pour les journaux de flux et traffic analytics. L'onglet Diagnostic Toolkit propose la capture de paquets, la résolution des problèmes de VPN, la résolution des problèmes de connexion, le tronçon suivant et la vérification des flux IP. Topology représente les ressources et leurs relations."
references:
  - title: Network insights
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-insights-overview
