id: az700-1a-22-dedicated-batch-subnet
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs web servers in a subnet named snet-apps (10.5.1.0/24) of a virtual network named VNet1. About 180 addresses of snet-apps are free, and VNet1 has an unused /22 range for new subnets. The team plans to add an Azure Batch pool whose nodes will scale between 20 and 400 virtual machines.

    The solution must meet the following requirements:

    - A scale-out of the Batch pool must never prevent the web servers from scaling.
    - The outbound traffic of the Batch nodes must use a NAT gateway; the web servers must keep their current outbound method.

    What should you do?
  fr: |
    Tailspin Toys exécute des serveurs web dans un sous-réseau nommé snet-apps (10.5.1.0/24) d'un réseau virtuel nommé VNet1. Environ 180 adresses de snet-apps sont libres, et VNet1 dispose d'une plage /22 inutilisée pour de nouveaux sous-réseaux. L'équipe prévoit d'ajouter un pool Azure Batch dont les nœuds varieront entre 20 et 400 machines virtuelles.

    La solution doit répondre aux exigences suivantes :

    - Une montée en charge du pool Batch ne doit jamais empêcher les serveurs web de monter en charge.
    - Le trafic sortant des nœuds Batch doit utiliser une passerelle NAT ; les serveurs web doivent conserver leur méthode sortante actuelle.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: Deploy the pool in snet-apps and associate a NAT gateway with snet-apps.
        fr: Déployer le pool dans snet-apps et associer une passerelle NAT à snet-apps.
    - id: b
      text:
        en: Deploy the pool in a new /23 subnet and associate a NAT gateway with the new subnet.
        fr: Déployer le pool dans un nouveau sous-réseau /23 et associer une passerelle NAT au nouveau sous-réseau.
    - id: c
      text:
        en: Deploy the pool in snet-apps and add the Batch nodes to an application security group that is used by an outbound NSG rule.
        fr: Déployer le pool dans snet-apps et ajouter les nœuds Batch à un groupe de sécurité d'application utilisé par une règle NSG sortante.
    - id: d
      text:
        en: Deploy the pool in a new /24 subnet and associate a NAT gateway with the new subnet.
        fr: Déployer le pool dans un nouveau sous-réseau /24 et associer une passerelle NAT au nouveau sous-réseau.
answer: { optionId: b }
explanation:
  correct:
    en: Azure Batch can share a subnet, but a dedicated subnet is the recommended practice. Here, a NAT gateway applies to a whole subnet, and a pool that can reach 400 nodes would exhaust the addresses of snet-apps. A /23 provides 507 usable addresses, enough for 400 nodes.
    fr: Azure Batch peut partager un sous-réseau, mais un sous-réseau dédié est la pratique recommandée. Ici, une passerelle NAT s'applique à tout un sous-réseau, et un pool qui peut atteindre 400 nœuds épuiserait les adresses de snet-apps. Un /23 fournit 507 adresses utilisables, assez pour 400 nœuds.
  options:
    a: { en: "The NAT gateway would also change the outbound method of the web servers, and the pool could consume the free addresses of snet-apps.", fr: "La passerelle NAT changerait aussi la méthode sortante des serveurs web, et le pool pourrait consommer les adresses libres de snet-apps." }
    c: { en: "An NSG rule filters traffic but doesn't select an outbound method, and the pool would still compete for the addresses of snet-apps.", fr: "Une règle NSG filtre le trafic mais ne choisit pas de méthode sortante, et le pool consommerait toujours les adresses de snet-apps." }
    d: { en: "A /24 offers 251 usable addresses, fewer than the 400 nodes of the pool at maximum scale.", fr: "Un /24 offre 251 adresses utilisables, moins que les 400 nœuds du pool à son échelle maximale." }
references:
  - title: Integrate Azure services with virtual networks for network isolation
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-for-azure-services
  - title: NAT gateway resource
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-gateway-resource
