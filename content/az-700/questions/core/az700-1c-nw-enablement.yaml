id: az700-1c-nw-enablement
objective: "1.4.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Wingtip has an Azure subscription named **Sub1** that never opted out of Network Watcher automatic enablement. Sub1 contains virtual networks in East US and West Europe, and the instance **NetworkWatcher_eastus** in the resource group **NetworkWatcherRG** hosts several flow logs and connection monitors.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip dispose d'un abonnement Azure nommé **Sub1** qui n'a jamais désactivé l'activation automatique de Network Watcher. Sub1 contient des réseaux virtuels dans les régions East US et West Europe, et l'instance **NetworkWatcher_eastus** du groupe de ressources **NetworkWatcherRG** héberge plusieurs journaux de flux et moniteurs de connexion.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When you create a virtual network in Sweden Central in Sub1, Network Watcher is enabled in Sweden Central automatically.
        fr: Lorsque vous créez un réseau virtuel dans la région Sweden Central dans Sub1, Network Watcher est automatiquement activé dans Sweden Central.
    - id: s2
      text:
        en: You can create a second Network Watcher instance in East US in Sub1 to separate the monitoring of production and test.
        fr: Vous pouvez créer une deuxième instance Network Watcher dans East US dans Sub1 pour séparer la supervision de la production et des tests.
    - id: s3
      text:
        en: Deleting NetworkWatcher_eastus also deletes the flow logs and connection monitors in East US.
        fr: La suppression de NetworkWatcher_eastus supprime aussi les journaux de flux et les moniteurs de connexion d'East US.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Network Watcher is enabled automatically in a region when you create or update a virtual network there, unless the subscription opted out, at no charge. A subscription can have only one Network Watcher instance per region. Deleting an instance removes its running operations and historical data, including the flow logs, connection monitors and packet captures of that region, with no way to revert.
    fr: "Network Watcher est activé automatiquement dans une région lorsque vous y créez ou mettez à jour un réseau virtuel, sauf si l'abonnement a désactivé cette option, et sans frais. Un abonnement ne peut avoir qu'une seule instance Network Watcher par région. La suppression d'une instance supprime ses opérations en cours et ses données historiques, y compris les journaux de flux, moniteurs de connexion et captures de paquets de cette région, sans retour arrière possible."
references:
  - title: Enable or disable Azure Network Watcher
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-create
  - title: What is Azure Network Watcher?
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview
