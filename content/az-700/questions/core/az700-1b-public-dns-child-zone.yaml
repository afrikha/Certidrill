id: az700-1b-public-dns-child-zone
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware hosts the public zone **litware.com** in Azure DNS, in a resource group named **RG-DNS**. The domain is delegated to Azure DNS at the registrar.

    The European team must manage the records of **eu.litware.com** in its own resource group, without any permission on the litware.com zone. Internet clients must resolve the names under eu.litware.com.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware héberge la zone publique **litware.com** dans Azure DNS, dans un groupe de ressources nommé **RG-DNS**. Le domaine est délégué à Azure DNS auprès du bureau d'enregistrement.

    L'équipe européenne doit gérer les enregistrements de **eu.litware.com** dans son propre groupe de ressources, sans aucune autorisation sur la zone litware.com. Les clients Internet doivent résoudre les noms situés sous eu.litware.com.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a public DNS zone named eu.litware.com in the resource group of the European team.", fr: "Créer une zone DNS publique nommée eu.litware.com dans le groupe de ressources de l'équipe européenne." } }
    - { id: b, text: { en: "In litware.com, create a CNAME record set named eu that points to the zone eu.litware.com.", fr: "Dans litware.com, créer un jeu d'enregistrements CNAME nommé eu qui pointe vers la zone eu.litware.com." } }
    - { id: c, text: { en: "In litware.com, create an NS record set named eu that lists the name servers of eu.litware.com.", fr: "Dans litware.com, créer un jeu d'enregistrements NS nommé eu qui répertorie les serveurs de noms de eu.litware.com." } }
    - { id: d, text: { en: "At the registrar, add the name servers of eu.litware.com to the delegation of litware.com.", fr: "Auprès du bureau d'enregistrement, ajouter les serveurs de noms de eu.litware.com à la délégation de litware.com." } }
    - { id: e, text: { en: "In eu.litware.com, add the name servers of litware.com to the NS record set at the apex.", fr: "Dans eu.litware.com, ajouter les serveurs de noms de litware.com au jeu d'enregistrements NS de l'apex." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A child zone is a separate zone resource, so the European team can manage it with permissions on its own resource group. The parent zone delegates the subdomain with an NS record set named after the child (eu) that lists the four name servers assigned to the child zone; the **Child zone** option of the parent zone creates both.
    fr: |
      Une zone enfant est une ressource de zone distincte : l'équipe européenne peut la gérer avec des autorisations sur son propre groupe de ressources. La zone parente délègue le sous-domaine avec un jeu d'enregistrements NS portant le nom de l'enfant (eu) qui répertorie les quatre serveurs de noms attribués à la zone enfant ; l'option **Child zone** de la zone parente crée les deux.
  options:
    b: { en: "A CNAME aliases one name to another; it doesn't delegate a subdomain to other name servers.", fr: "Un CNAME fait d'un nom l'alias d'un autre ; il ne délègue pas un sous-domaine à d'autres serveurs de noms." }
    d: { en: "The registrar delegates only litware.com; delegations below it are made in the parent zone, which Azure DNS hosts.", fr: "Le bureau d'enregistrement ne délègue que litware.com ; les délégations inférieures se font dans la zone parente, hébergée par Azure DNS." }
    e: { en: "The child zone doesn't need the parent's name servers; the delegation is the NS record set in the parent.", fr: "La zone enfant n'a pas besoin des serveurs de noms du parent ; la délégation est le jeu d'enregistrements NS du parent." }
references:
  - title: "Tutorial: Create a child DNS zone"
    url: https://learn.microsoft.com/en-us/azure/dns/tutorial-public-dns-zones-child
