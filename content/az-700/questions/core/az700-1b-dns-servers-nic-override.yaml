id: az700-1b-dns-servers-nic-override
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip has a virtual network named **VNet1** that uses the default (Azure-provided) DNS settings. VNet1 contains 30 virtual machines, including a virtual machine named **VM4**.

    The DNS team deploys a test DNS server at 10.1.5.4. You need VM4 to use this DNS server. The other virtual machines must keep using Azure-provided DNS. The setting must persist across service heals of VM4.

    What should you do?
  fr: |
    Wingtip dispose d'un réseau virtuel nommé **VNet1** qui utilise les paramètres DNS par défaut (fournis par Azure). VNet1 contient 30 machines virtuelles, dont une machine virtuelle nommée **VM4**.

    L'équipe DNS déploie un serveur DNS de test à l'adresse 10.1.5.4. Vous devez faire en sorte que VM4 utilise ce serveur DNS. Les autres machines virtuelles doivent continuer à utiliser le DNS fourni par Azure. Le paramètre doit être conservé lors des réparations de service de VM4.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set the DNS servers of VNet1 to Custom with the address 10.1.5.4.", fr: "Définir les serveurs DNS de VNet1 sur Personnalisé avec l'adresse 10.1.5.4." }
    - id: b
      text: { en: "Set the DNS servers of the network interface of VM4 to Custom with 10.1.5.4.", fr: "Définir les serveurs DNS de l'interface réseau de VM4 sur Personnalisé avec 10.1.5.4." }
    - id: c
      text: { en: "Type 10.1.5.4 as the DNS server in the network adapter settings inside VM4.", fr: "Saisir 10.1.5.4 comme serveur DNS dans les paramètres de la carte réseau dans VM4." }
    - id: d
      text: { en: "Create a private DNS zone and link it to VNet1 with autoregistration enabled.", fr: "Créer une zone DNS privée et la lier à VNet1 avec l'inscription automatique activée." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      DNS servers set on a network interface take precedence over those of the virtual network. Setting VM4's network interface to Custom changes only VM4, and Azure delivers the setting through DHCP, so it survives service heals.
    fr: |
      Les serveurs DNS définis sur une interface réseau sont prioritaires sur ceux du réseau virtuel. Définir l'interface réseau de VM4 sur Personnalisé ne modifie que VM4, et Azure distribue le paramètre par DHCP : il est conservé lors des réparations de service.
  options:
    a: { en: "The virtual network setting applies to every network interface that inherits it, so all 30 virtual machines would change.", fr: "Le paramètre du réseau virtuel s'applique à toutes les interfaces réseau qui en héritent : les 30 machines virtuelles changeraient." }
    c: { en: "Settings edited in the guest operating system can be erased during a service heal.", fr: "Les paramètres modifiés dans le système d'exploitation invité peuvent être effacés lors d'une réparation de service." }
    d: { en: "A private DNS zone adds records; it doesn't change which DNS server VM4 queries.", fr: "Une zone DNS privée ajoute des enregistrements ; elle ne change pas le serveur DNS interrogé par VM4." }
references:
  - title: Configure DNS name resolution for Azure virtual networks
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-name-resolution-for-vms-and-role-instances
