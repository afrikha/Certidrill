id: az700-1b-avnm-hub-spoke-steps
objective: "1.3.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Northwind has 40 virtual networks in West Europe, spread across three subscriptions of a management group named **MG-Prod**. One of them, **VNet-Hub**, must become the hub of a hub-and-spoke topology, and the other 39 must become spokes. No peering exists today.

    You decide to use Azure Virtual Network Manager to create and maintain the peerings.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind dispose de 40 réseaux virtuels en West Europe, répartis entre trois abonnements d'un groupe d'administration nommé **MG-Prod**. L'un d'eux, **VNet-Hub**, doit devenir le hub d'une topologie hub-and-spoke, et les 39 autres doivent devenir des spokes. Aucun peering n'existe aujourd'hui.

    Vous décidez d'utiliser Azure Virtual Network Manager pour créer et maintenir les peerings.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: manager, text: { en: "Create a network manager whose scope is MG-Prod.", fr: "Créer un gestionnaire de réseau dont l'étendue est MG-Prod." } }
    - { id: group, text: { en: "Create a network group and add the 39 spoke virtual networks to it.", fr: "Créer un groupe réseau et y ajouter les 39 réseaux virtuels spokes." } }
    - { id: config, text: { en: "Create a hub-and-spoke connectivity configuration with VNet-Hub as the hub and the network group as the spokes.", fr: "Créer une configuration de connectivité hub-and-spoke avec VNet-Hub comme hub et le groupe réseau comme spokes." } }
    - { id: deploy, text: { en: "Deploy the connectivity configuration to West Europe.", fr: "Déployer la configuration de connectivité dans West Europe." } }
    - { id: peer, text: { en: "Create a peering from each spoke virtual network to VNet-Hub.", fr: "Créer un peering de chaque réseau virtuel spoke vers VNet-Hub." } }
    - { id: admin, text: { en: "Create a security admin configuration for the network group.", fr: "Créer une configuration d'administrateur de sécurité pour le groupe réseau." } }
answer:
  sequence: [ manager, group, config, deploy ]
explanation:
  correct:
    en: |
      The network manager defines the scope (here MG-Prod) in which it can see and configure virtual networks. Network groups collect the virtual networks, a connectivity configuration describes the topology for those groups, and nothing takes effect until the configuration is deployed to the regions that contain the virtual networks.
    fr: |
      Le gestionnaire de réseau définit l'étendue (ici MG-Prod) dans laquelle il peut voir et configurer les réseaux virtuels. Les groupes réseau rassemblent les réseaux virtuels, une configuration de connectivité décrit la topologie pour ces groupes, et rien ne s'applique tant que la configuration n'est pas déployée dans les régions qui contiennent les réseaux virtuels.
  options:
    peer: { en: "Azure Virtual Network Manager creates the hub-and-spoke peerings itself when the configuration is deployed.", fr: "Azure Virtual Network Manager crée lui-même les peerings hub-and-spoke au déploiement de la configuration." }
    admin: { en: "Security admin rules filter traffic; they create no connectivity.", fr: "Les règles d'administrateur de sécurité filtrent le trafic ; elles ne créent aucune connectivité." }
references:
  - title: What is Azure Virtual Network Manager?
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/overview
  - title: Connectivity configurations in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-connectivity-configuration
