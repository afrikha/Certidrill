id: az700-1c-ft-default-site
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure virtual network named **VNet1** that contains three workload subnets and a subnet named GatewaySubnet. A route-based VPN gateway named **VNG1** in VNet1 has site-to-site IPsec connections to two local network gateways:

    | Local network gateway | Location |
    | --- | --- |
    | LNG-HQ | Paris headquarters (internet breakout and proxy) |
    | LNG-Branch | Lyon branch office |

    The on-premises VPN devices do not support BGP, and the device at the headquarters uses 0.0.0.0/0 as its traffic selectors.

    You need to ensure that internet-bound traffic from all the workload subnets in VNet1 is sent to the headquarters for inspection.

    What should you do?
  fr: |
    Contoso dispose d'un réseau virtuel Azure nommé **VNet1** qui contient trois sous-réseaux de charge de travail et un sous-réseau nommé GatewaySubnet. Une passerelle VPN basée sur des routes nommée **VNG1** dans VNet1 possède des connexions IPsec de site à site vers deux passerelles de réseau local :

    | Passerelle de réseau local | Emplacement |
    | --- | --- |
    | LNG-HQ | Siège de Paris (sortie Internet et proxy) |
    | LNG-Branch | Agence de Lyon |

    Les périphériques VPN locaux ne prennent pas en charge BGP, et le périphérique du siège utilise 0.0.0.0/0 comme sélecteurs de trafic.

    Vous devez faire en sorte que le trafic à destination d'Internet de tous les sous-réseaux de charge de travail de VNet1 soit envoyé au siège pour inspection.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Run Set-AzVirtualNetworkGatewayDefaultSite to set LNG-HQ as the default site of VNG1.", fr: "Exécuter Set-AzVirtualNetworkGatewayDefaultSite pour définir LNG-HQ comme site par défaut de VNG1." }
    - id: b
      text: { en: "Associate a route table that contains a 0.0.0.0/0 route with the next hop type Virtual network gateway with GatewaySubnet.", fr: "Associer à GatewaySubnet une table de routage contenant un itinéraire 0.0.0.0/0 avec le type de tronçon suivant Passerelle de réseau virtuel." }
    - id: c
      text: { en: "Enable BGP on VNG1 and configure the BGP settings of LNG-HQ so that the site advertises 0.0.0.0/0.", fr: "Activer BGP sur VNG1 et configurer les paramètres BGP de LNG-HQ pour que le site publie 0.0.0.0/0." }
    - id: d
      text: { en: "Disable gateway route propagation on the route tables of the workload subnets.", fr: "Désactiver la propagation des itinéraires de passerelle sur les tables de routage des sous-réseaux de charge de travail." }
answer: { optionId: a }
explanation:
  correct:
    en: Without BGP, forced tunneling on a route-based VPN gateway is configured by assigning a Default Site, which is one of the local network gateways. All internet-bound traffic from the subnets is then sent through the tunnel to that site, whose device must use 0.0.0.0/0 as traffic selectors. The Default Site is set with PowerShell (Set-AzVirtualNetworkGatewayDefaultSite); it cannot be configured in the Azure portal.
    fr: "Sans BGP, le tunneling forcé sur une passerelle VPN basée sur des routes se configure en désignant un site par défaut (Default Site), qui est l'une des passerelles de réseau local. Tout le trafic à destination d'Internet des sous-réseaux est alors envoyé dans le tunnel vers ce site, dont le périphérique doit utiliser 0.0.0.0/0 comme sélecteurs de trafic. Le site par défaut se définit avec PowerShell (Set-AzVirtualNetworkGatewayDefaultSite) ; il ne peut pas être configuré dans le portail Azure."
  options:
    b: { en: "A route table with a 0.0.0.0/0 route must not be associated with GatewaySubnet: it can prevent the gateway from working, and it does not tell the gateway which tunnel to use.", fr: "Une table de routage contenant un itinéraire 0.0.0.0/0 ne doit pas être associée à GatewaySubnet : elle peut empêcher la passerelle de fonctionner et n'indique pas à la passerelle quel tunnel utiliser." }
    c: { en: "Advertising a default route over BGP is the other forced tunneling method, but the on-premises devices do not support BGP, so no route can be advertised.", fr: "Publier un itinéraire par défaut par BGP est l'autre méthode de tunneling forcé, mais les périphériques locaux ne prennent pas en charge BGP : aucun itinéraire ne peut être publié." }
    d: { en: "Disabling gateway route propagation removes the routes learned from the gateway; it never sends internet traffic to the headquarters.", fr: "Désactiver la propagation des itinéraires de passerelle supprime les itinéraires appris de la passerelle ; cela n'envoie jamais le trafic Internet vers le siège." }
references:
  - title: About forced tunneling for site-to-site configurations
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-site-to-site-tunneling
  - title: Configure forced tunneling using Default Site for site-to-site connections
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/site-to-site-tunneling
