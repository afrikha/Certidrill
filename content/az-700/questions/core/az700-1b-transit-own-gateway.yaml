id: az700-1b-transit-own-gateway
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a hub virtual network named **VNet-Hub** that contains a VPN gateway connected to the on-premises network. Three spoke virtual networks are peered with VNet-Hub, and each spoke-to-hub peering has the setting **Enable 'spoke' to use the peered virtual networks' remote gateway or route server** selected.

    A partner requires a dedicated site-to-site VPN that terminates in **VNet-Spoke3**. VNet-Spoke3 already contains an empty GatewaySubnet (/27). VNet-Spoke3 no longer needs to reach the on-premises network through the hub, and the other spokes must keep their current connectivity.

    What should you do before you deploy a VPN gateway in VNet-Spoke3?
  fr: |
    Adatum dispose d'un réseau virtuel hub nommé **VNet-Hub** qui contient une passerelle VPN connectée au réseau local. Trois réseaux virtuels spokes sont reliés par peering à VNet-Hub, et le paramètre **Enable 'spoke' to use the peered virtual networks' remote gateway or route server** est sélectionné sur chaque peering du spoke vers le hub.

    Un partenaire exige un VPN site à site dédié qui se termine dans **VNet-Spoke3**. VNet-Spoke3 contient déjà un GatewaySubnet vide (/27). VNet-Spoke3 n'a plus besoin de joindre le réseau local par le hub, et les autres spokes doivent conserver leur connectivité actuelle.

    Que devez-vous faire avant de déployer une passerelle VPN dans VNet-Spoke3 ?
body:
  options:
    - id: a
      text: { en: "Clear the remote gateway setting on the peering from VNet-Spoke3 to VNet-Hub.", fr: "Désélectionner le paramètre de passerelle distante sur le peering de VNet-Spoke3 vers VNet-Hub." }
    - id: b
      text: { en: "Select Allow gateway or route server in 'VNet-Spoke3' to forward traffic on the peering from VNet-Spoke3.", fr: "Sélectionner Allow gateway or route server in 'VNet-Spoke3' to forward traffic sur le peering de VNet-Spoke3." }
    - id: c
      text: { en: "Delete the VPN gateway of VNet-Hub and deploy one gateway in each spoke.", fr: "Supprimer la passerelle VPN de VNet-Hub et déployer une passerelle dans chaque spoke." }
    - id: d
      text: { en: "Clear the access setting on the peering from VNet-Spoke3 to VNet-Hub.", fr: "Désélectionner le paramètre d'accès sur le peering de VNet-Spoke3 vers VNet-Hub." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A virtual network that uses a remote gateway through peering can't have its own gateway, and the remote gateway option can't be set on a network that already has one. Clearing the remote gateway setting on the VNet-Spoke3 peering frees VNet-Spoke3 to host its own VPN gateway, while the other spokes keep using the hub gateway.
    fr: |
      Un réseau virtuel qui utilise une passerelle distante par peering ne peut pas avoir sa propre passerelle, et l'option de passerelle distante ne peut pas être définie sur un réseau qui en possède déjà une. Désélectionner le paramètre de passerelle distante sur le peering de VNet-Spoke3 permet à VNet-Spoke3 d'héberger sa propre passerelle VPN, tandis que les autres spokes continuent d'utiliser la passerelle du hub.
  options:
    b: { en: "This is the gateway transit setting for a network that offers its gateway; it doesn't remove VNet-Spoke3's use of the hub gateway.", fr: "C'est le paramètre de transit par passerelle d'un réseau qui offre sa passerelle ; il ne supprime pas l'utilisation de la passerelle du hub par VNet-Spoke3." }
    c: { en: "Deleting the hub gateway breaks the on-premises connectivity of the other spokes.", fr: "Supprimer la passerelle du hub coupe la connectivité locale des autres spokes." }
    d: { en: "Clearing access blocks traffic between VNet-Spoke3 and the hub but leaves the remote gateway setting in place.", fr: "Désélectionner l'accès bloque le trafic entre VNet-Spoke3 et le hub, mais laisse le paramètre de passerelle distante en place." }
references:
  - title: Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
  - title: Create, change, or delete Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
