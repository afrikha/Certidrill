id: az700-1a-48-associate-pip-cli
objective: "1.1.10"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A virtual machine named VM3 has a network interface named vm3-nic with one IP configuration named ipconfig1. You created a Standard public IP address named pip-vm3 in the same region and subscription as VM3.

    You need to associate pip-vm3 with VM3 by using the Azure CLI.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une machine virtuelle nommée VM3 a une interface réseau nommée vm3-nic avec une seule configuration IP nommée ipconfig1. Vous avez créé une adresse IP publique Standard nommée pip-vm3 dans la même région et le même abonnement que VM3.

    Vous devez associer pip-vm3 à VM3 avec Azure CLI.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    [[cmd]] --resource-group RG-App \
      --nic-name vm3-nic --name [[target]] \
      [[param]] pip-vm3
  slots:
    - id: cmd
      options:
        - { id: ipconfig, text: az network nic ip-config update }
        - { id: pipupdate, text: az network public-ip update }
        - { id: subnet, text: az network vnet subnet update }
    - id: target
      options:
        - { id: ipc, text: ipconfig1 }
        - { id: vm, text: VM3 }
        - { id: pip, text: pip-vm3 }
    - id: param
      options:
        - { id: pubip, text: --public-ip-address }
        - { id: prefix, text: --public-ip-prefix }
        - { id: priv, text: --private-ip-address }
answer:
  values: { cmd: ipconfig, target: ipc, param: pubip }
explanation:
  correct:
    en: "A public IP address is associated with an IP configuration of a network interface, not with the virtual machine itself. `az network nic ip-config update` takes the NIC name in `--nic-name`, the IP configuration name in `--name`, and the public IP address in `--public-ip-address`."
    fr: "Une adresse IP publique est associée à une configuration IP d'une interface réseau, pas à la machine virtuelle elle-même. `az network nic ip-config update` prend le nom de l'interface réseau dans `--nic-name`, le nom de la configuration IP dans `--name` et l'adresse IP publique dans `--public-ip-address`."
  options:
    pipupdate: { en: "az network public-ip update changes the settings of the address; it has no --nic-name parameter.", fr: "az network public-ip update modifie les paramètres de l'adresse ; il n'a pas de paramètre --nic-name." }
    subnet: { en: "Subnets don't receive public IP addresses.", fr: "Les sous-réseaux ne reçoivent pas d'adresses IP publiques." }
    vm: { en: "--name expects the name of the IP configuration.", fr: "--name attend le nom de la configuration IP." }
    pip: { en: "--name expects the name of the IP configuration, not the public IP address.", fr: "--name attend le nom de la configuration IP, pas celui de l'adresse IP publique." }
    prefix: { en: "--public-ip-prefix belongs to az network public-ip create, to create an address from a prefix.", fr: "--public-ip-prefix appartient à az network public-ip create, pour créer une adresse à partir d'un préfixe." }
    priv: { en: "--private-ip-address sets a static private address.", fr: "--private-ip-address définit une adresse privée statique." }
references:
  - title: az network nic ip-config
    url: https://learn.microsoft.com/en-us/cli/azure/network/nic/ip-config
  - title: Associate a public IP address to a virtual machine
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/associate-public-ip-address-vm
