id: az700-1c-ddos-enable-order
objective: "1.4.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove has an existing virtual network named **VNet-Web** that hosts an application gateway with a Standard public IP address named **pip-agw**. No DDoS protection plan exists in the tenant.

    You need to protect all the public IP addresses in VNet-Web with Azure DDoS Network Protection and notify the operations team by email when pip-agw is under attack.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove dispose d'un réseau virtuel existant nommé **VNet-Web** qui héberge une passerelle d'application dotée d'une adresse IP publique Standard nommée **pip-agw**. Aucun plan de protection DDoS n'existe dans le locataire.

    Vous devez protéger toutes les adresses IP publiques de VNet-Web avec Azure DDoS Network Protection et avertir l'équipe d'exploitation par e-mail lorsque pip-agw est attaquée.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: plan, text: { en: "Create a DDoS protection plan.", fr: "Créer un plan de protection DDoS." } }
    - { id: enable, text: { en: "On the DDoS protection page of VNet-Web, enable DDoS Network Protection and select the plan.", fr: "Dans la page DDoS protection de VNet-Web, activer DDoS Network Protection et sélectionner le plan." } }
    - { id: alert, text: { en: "Create a metric alert rule on pip-agw that uses the Under DDoS attack or not signal and an email action group.", fr: "Créer une règle d'alerte de métrique sur pip-agw qui utilise le signal Under DDoS attack or not et un groupe d'actions par e-mail." } }
    - { id: ipprot, text: { en: "Enable DDoS IP Protection on pip-agw.", fr: "Activer DDoS IP Protection sur pip-agw." } }
    - { id: waf, text: { en: "Upgrade the application gateway to the WAF v2 tier.", fr: "Mettre à niveau la passerelle d'application vers le niveau WAF v2." } }
    - { id: moverg, text: { en: "Move VNet-Web to the resource group of the DDoS protection plan.", fr: "Déplacer VNet-Web vers le groupe de ressources du plan de protection DDoS." } }
answer:
  sequence: [ plan, enable, alert ]
explanation:
  correct:
    en: |
      DDoS Network Protection relies on a DDoS protection plan, which you create first and then select when you enable protection on the virtual network. Once the public IP addresses of the virtual network are protected, you create a metric alert on the public IP address with the signal Under DDoS attack or not (Maximum, greater than or equal to 1), which requires protection to be enabled.
    fr: |
      DDoS Network Protection repose sur un plan de protection DDoS, que vous créez d'abord puis sélectionnez lorsque vous activez la protection sur le réseau virtuel. Une fois les adresses IP publiques du réseau virtuel protégées, vous créez une alerte de métrique sur l'adresse IP publique avec le signal Under DDoS attack or not (Maximum, supérieur ou égal à 1), ce qui nécessite que la protection soit activée.
  options:
    ipprot: { en: "DDoS IP Protection protects individual public IPs without a plan; the requirement is Network Protection for the whole virtual network.", fr: "DDoS IP Protection protège des adresses IP publiques individuelles sans plan ; l'exigence est Network Protection pour tout le réseau virtuel." }
    waf: { en: "A WAF protects at layer 7; it is not required to enable DDoS Network Protection.", fr: "Un WAF protège au niveau de la couche 7 ; il n'est pas nécessaire pour activer DDoS Network Protection." }
    moverg: { en: "The plan can be in any resource group or subscription of the same Microsoft Entra tenant.", fr: "Le plan peut se trouver dans n'importe quel groupe de ressources ou abonnement du même locataire Microsoft Entra." }
references:
  - title: "Quickstart: Create and configure Azure DDoS Network Protection using the Azure portal"
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/manage-ddos-protection
  - title: "Tutorial: Configure Azure DDoS Protection metric alerts through portal"
    url: https://learn.microsoft.com/en-us/azure/ddos-protection/alerts
