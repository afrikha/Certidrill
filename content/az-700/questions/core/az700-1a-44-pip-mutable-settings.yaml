id: az700-1a-44-pip-mutable-settings
objective: "1.1.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders created a public IP address named pip-app with the following settings: SKU Standard, IPv4, tier Regional, zone-redundant, routing preference Microsoft network, idle timeout 4 minutes, no DNS name label. pip-app is associated with a virtual machine.

    The application team asks for several changes to pip-app. You don't want to replace the address.

    Which two settings can you change on pip-app?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders a créé une adresse IP publique nommée pip-app avec les paramètres suivants : SKU Standard, IPv4, niveau Régional, redondante interzone, préférence de routage Réseau Microsoft, délai d'inactivité de 4 minutes, aucune étiquette de nom DNS. pip-app est associée à une machine virtuelle.

    L'équipe applicative demande plusieurs modifications de pip-app. Vous ne voulez pas remplacer l'adresse.

    Quels sont les deux paramètres que vous pouvez modifier sur pip-app ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The idle timeout, set to 15 minutes", fr: "Le délai d'inactivité, défini sur 15 minutes" } }
    - { id: b, text: { en: "The availability zone, set to zone 2 only", fr: "La zone de disponibilité, définie sur la zone 2 uniquement" } }
    - { id: c, text: { en: "The DNS name label, set to northwind-app", fr: "L'étiquette de nom DNS, définie sur northwind-app" } }
    - { id: d, text: { en: "The routing preference, set to Internet", fr: "La préférence de routage, définie sur Internet" } }
    - { id: e, text: { en: "The tier, set to Global", fr: "Le niveau, défini sur Global" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: The idle timeout (4 to 30 minutes for inbound-originated flows) and the DNS name label can be updated on an existing public IP address, for example with `az network public-ip update --idle-timeout` or `--dns-name`.
    fr: Le délai d'inactivité (4 à 30 minutes pour les flux d'origine entrante) et l'étiquette de nom DNS peuvent être modifiés sur une adresse IP publique existante, par exemple avec `az network public-ip update --idle-timeout` ou `--dns-name`.
  options:
    b: { en: "The availability zone of a public IP address can't be changed after creation.", fr: "La zone de disponibilité d'une adresse IP publique ne peut pas être modifiée après la création." }
    d: { en: "The routing preference is chosen at creation and can't be changed.", fr: "La préférence de routage se choisit à la création et ne peut pas être modifiée." }
    e: { en: "The tier is chosen at creation; a Global tier address must be created as such.", fr: "Le niveau se choisit à la création ; une adresse de niveau Global doit être créée comme telle." }
references:
  - title: az network public-ip
    url: https://learn.microsoft.com/en-us/cli/azure/network/public-ip
  - title: Public IP addresses in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-addresses
