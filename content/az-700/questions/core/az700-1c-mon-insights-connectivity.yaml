id: az700-1c-mon-insights-connectivity
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum opens Azure Monitor Network insights for its production subscription. The Network health view shows all the virtual networks, gateways and load balancers, but the Connectivity tab shows no data.

    You need the Connectivity tab to show whether the web servers in Azure can reach an on-premises SQL Server on TCP 1433, with checks failed (%) and round-trip time (ms) thresholds.

    What should you do first?
  fr: |
    Adatum ouvre les insights réseau (Network insights) d'Azure Monitor pour son abonnement de production. La vue Network health affiche tous les réseaux virtuels, passerelles et équilibreurs de charge, mais l'onglet Connectivity n'affiche aucune donnée.

    Vous devez faire en sorte que l'onglet Connectivity indique si les serveurs web d'Azure peuvent joindre un serveur SQL Server local sur TCP 1433, avec des seuils de pourcentage de vérifications en échec et de durée aller-retour (ms).

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Create a diagnostic setting on each web server's network interface that sends metrics to Log Analytics.", fr: "Créer un paramètre de diagnostic sur l'interface réseau de chaque serveur web qui envoie les métriques vers Log Analytics." }
    - id: b
      text: { en: "Enable traffic analytics on a virtual network flow log for the web servers' virtual network.", fr: "Activer traffic analytics sur un journal de flux de réseau virtuel pour le réseau virtuel des serveurs web." }
    - id: c
      text: { en: "Run connection troubleshoot from each web server to the SQL Server on TCP 1433.", fr: "Exécuter la résolution des problèmes de connexion depuis chaque serveur web vers le serveur SQL Server sur TCP 1433." }
    - id: d
      text: { en: "Create a connection monitor with a test group that uses a TCP 1433 test configuration.", fr: "Créer un moniteur de connexion avec un groupe de tests qui utilise une configuration de test TCP 1433." }
answer: { optionId: d }
explanation:
  correct:
    en: The Connectivity tab of Network insights displays the tests configured in Connection monitor, grouped by sources and destinations, with reachability evaluated against checks failed (%) and RTT (ms). Without a connection monitor, there is nothing to show. The monitor needs the Network Watcher extension on the Azure VMs and stores its results in a Log Analytics workspace.
    fr: "L'onglet Connectivity des insights réseau affiche les tests configurés dans le Moniteur de connexion, regroupés par sources et destinations, avec une accessibilité évaluée selon le pourcentage de vérifications en échec et la durée aller-retour (RTT). Sans moniteur de connexion, il n'y a rien à afficher. Le moniteur nécessite l'extension Network Watcher sur les machines virtuelles Azure et stocke ses résultats dans un espace de travail Log Analytics."
  options:
    b: { en: "Traffic analytics feeds the Traffic tab with flow data; it doesn't create reachability tests.", fr: "Traffic analytics alimente l'onglet Traffic avec des données de flux ; il ne crée pas de tests d'accessibilité." }
    c: { en: "Connection troubleshoot is a one-time test; its results don't appear as continuous tests in the Connectivity tab.", fr: "La résolution des problèmes de connexion est un test ponctuel ; ses résultats n'apparaissent pas comme des tests continus dans l'onglet Connectivity." }
    a: { en: "Network interface metrics don't measure reachability or round-trip time to a remote server.", fr: "Les métriques d'interface réseau ne mesurent ni l'accessibilité ni la durée aller-retour vers un serveur distant." }
references:
  - title: Network insights
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-insights-overview
  - title: Connection monitor overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview
