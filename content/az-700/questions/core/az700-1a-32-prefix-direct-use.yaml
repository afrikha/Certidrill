id: az700-1a-32-prefix-direct-use
objective: "1.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a public IP prefix named ippre1 (/28, Standard) in West Europe. The network team wants to use ippre1 without creating an individual public IP address resource for each address.

    Which two resources can reference ippre1 directly?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un préfixe d'adresse IP publique nommé ippre1 (/28, Standard) dans la région West Europe. L'équipe réseau veut utiliser ippre1 sans créer une ressource d'adresse IP publique individuelle pour chaque adresse.

    Quelles sont les deux ressources qui peuvent référencer ippre1 directement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A Standard NAT gateway", fr: "Une passerelle NAT Standard" } }
    - { id: b, text: { en: "Azure Firewall", fr: "Le Pare-feu Azure" } }
    - { id: c, text: { en: "A virtual machine scale set", fr: "Un groupe de machines virtuelles identiques" } }
    - { id: d, text: { en: "A zone-redundant VPN gateway", fr: "Une passerelle VPN redondante interzone" } }
    - { id: e, text: { en: "Application Gateway v2", fr: "Application Gateway v2" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: A NAT gateway can use a whole prefix for its outbound connections, and a virtual machine scale set can generate instance-level public IP addresses from a prefix. Both use the prefix without individual public IP address resources.
    fr: Une passerelle NAT peut utiliser un préfixe entier pour ses connexions sortantes, et un groupe de machines virtuelles identiques peut générer des adresses IP publiques au niveau des instances à partir d'un préfixe. Tous deux utilisent le préfixe sans ressources d'adresse IP publique individuelles.
  options:
    b: { en: "Azure Firewall can't use a prefix directly; it uses individual Standard public IP addresses created from the prefix.", fr: "Le Pare-feu Azure ne peut pas utiliser un préfixe directement ; il utilise des adresses IP publiques Standard individuelles créées à partir du préfixe." }
    d: { en: "A VPN gateway uses public IP addresses created from the prefix, selected when you deploy the gateway.", fr: "Une passerelle VPN utilise des adresses IP publiques créées à partir du préfixe, choisies lors du déploiement de la passerelle." }
    e: { en: "Application Gateway v2 uses a public IP address created from the prefix as its frontend.", fr: "Application Gateway v2 utilise comme adresse frontale une adresse IP publique créée à partir du préfixe." }
references:
  - title: Public IP address prefix
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix
