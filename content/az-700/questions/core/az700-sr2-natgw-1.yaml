stem:
  en: You assign a public IP address to each VMSS1 instance.
  fr: Vous attribuez une adresse IP publique à chaque instance de VMSS1.
body:
  solution:
    en: |
      You configure VMSS1 so that each instance receives its own Standard SKU static public IP address, and you add those addresses to the Fabrikam allowlist.
    fr: |
      Vous configurez VMSS1 pour que chaque instance reçoive sa propre adresse IP publique statique de référence SKU Standard, et vous ajoutez ces adresses à la liste d'autorisation de Fabrikam.
answer: { value: false }
explanation:
  correct:
    en: |
      With one public IP address per instance, VMSS1 can use up to 20 different source addresses, and new instances get new addresses, which exceeds the two-address allowlist. A NAT gateway or a public load balancer outbound rule would share a few static addresses instead.
    fr: |
      Avec une adresse IP publique par instance, VMSS1 peut utiliser jusqu'à 20 adresses sources différentes, et chaque nouvelle instance reçoit une nouvelle adresse, ce qui dépasse la liste d'autorisation limitée à deux adresses. Une passerelle NAT ou une règle de trafic sortant d'un équilibreur de charge public partagerait au contraire quelques adresses statiques.
references:
  - title: Azure Public IP address prefix
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/public-ip-address-prefix
  - title: What is Azure NAT Gateway?
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
