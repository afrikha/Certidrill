id: az700-1c-mdc-rec-remediation
objective: "1.4.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso reviews the networking recommendations that lower its secure score in Microsoft Defender for Cloud. The team plans the following remediation actions:

    - Associate an NSG with the network interface of **VM2**, which has a public IP address and no NSG on its subnet or network interface.
    - Disable IP forwarding on the network interface of **VM3**, an application server.
    - Enable just-in-time VM access for the RDP port of **VM4**.
    - Enable DDoS Network Protection on the virtual network that hosts **AGW1**, an application gateway with a public IP address.

    Which recommendation does each action remediate? To answer, drag the appropriate recommendations to the correct actions. Each recommendation may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso examine les recommandations réseau qui font baisser son degré de sécurisation dans Microsoft Defender for Cloud. L'équipe prévoit les actions de correction suivantes :

    - Associer un NSG à l'interface réseau de **VM2**, qui possède une adresse IP publique et aucun NSG sur son sous-réseau ni sur son interface réseau.
    - Désactiver le transfert IP sur l'interface réseau de **VM3**, un serveur d'applications.
    - Activer l'accès juste-à-temps (JIT) aux machines virtuelles pour le port RDP de **VM4**.
    - Activer DDoS Network Protection sur le réseau virtuel qui héberge **AGW1**, une passerelle d'application dotée d'une adresse IP publique.

    Quelle recommandation chaque action corrige-t-elle ? Pour répondre, faites glisser les recommandations appropriées vers les actions correspondantes. Chaque recommandation peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: inet, text: Internet-facing virtual machines should be protected with network security groups }
    - { id: noninet, text: Non-internet-facing virtual machines should be protected with network security groups }
    - { id: ipfwd, text: IP forwarding on your virtual machine should be disabled }
    - { id: jit, text: Management ports of virtual machines should be protected with just-in-time network access control }
    - { id: ddos, text: Azure DDoS Protection Standard should be enabled }
    - { id: subnet, text: Subnets should be associated with a network security group }
  targets:
    - { id: t1, text: { en: "Associate an NSG with the network interface of VM2", fr: "Associer un NSG à l'interface réseau de VM2" } }
    - { id: t2, text: { en: "Disable IP forwarding on VM3", fr: "Désactiver le transfert IP sur VM3" } }
    - { id: t3, text: { en: "Enable just-in-time VM access on VM4", fr: "Activer l'accès JIT sur VM4" } }
    - { id: t4, text: { en: "Enable DDoS Network Protection on the virtual network of AGW1", fr: "Activer DDoS Network Protection sur le réseau virtuel d'AGW1" } }
answer:
  mapping: { t1: inet, t2: ipfwd, t3: jit, t4: ddos }
explanation:
  correct:
    en: VM2 is internet-facing and has no NSG, which is the condition of the high-severity recommendation for internet-facing VMs; an NSG on its network interface resolves it. IP forwarding is rarely needed outside network appliances and is flagged by its own recommendation. Just-in-time access protects management ports against brute-force attacks. Virtual networks that contain resources with public IPs, such as application gateways, are flagged until DDoS Protection is enabled.
    fr: "VM2 est exposée à Internet et n'a pas de NSG, ce qui correspond à la recommandation de gravité élevée concernant les machines virtuelles exposées à Internet ; un NSG sur son interface réseau la corrige. Le transfert IP est rarement nécessaire en dehors des appliances réseau et fait l'objet de sa propre recommandation. L'accès juste-à-temps protège les ports de gestion contre les attaques par force brute. Les réseaux virtuels qui contiennent des ressources dotées d'adresses IP publiques, comme les passerelles d'application, sont signalés tant que la protection DDoS n'est pas activée."
references:
  - title: Networking security recommendations
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/recommendations-reference-networking
