id: az700-cs1a-gateway-transit
objective: "1.3.2"
type: dropdown
caseStudy: az700-cs1a-litware-energy
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the peering between VNet-Hub and VNet-Scada and to deploy VpnGw-Hub. The solution must meet the connectivity requirements.

    What should you configure? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer le peering entre VNet-Hub et VNet-Scada et déployer VpnGw-Hub. La solution doit respecter les exigences de connectivité.

    Que devez-vous configurer ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Setting to enable on the peering link from VNet-Hub to VNet-Scada: [[hub]]

      Setting to enable on the peering link from VNet-Scada to VNet-Hub: [[spoke]]

      VPN type and SKU of VpnGw-Hub: [[vpn]]
    fr: |
      Paramètre à activer sur le lien de peering de VNet-Hub vers VNet-Scada : [[hub]]

      Paramètre à activer sur le lien de peering de VNet-Scada vers VNet-Hub : [[spoke]]

      Type de VPN et référence SKU de VpnGw-Hub : [[vpn]]
  slots:
    - id: hub
      options:
        - { id: transit, text: "Allow gateway or route server in this virtual network to forward traffic to the peered virtual network" }
        - { id: remote, text: "Enable this virtual network to use the peered virtual network's remote gateway or route server" }
        - { id: forwarded, text: "Allow this virtual network to receive forwarded traffic from the peered virtual network" }
    - id: spoke
      options:
        - { id: transit, text: "Allow gateway or route server in this virtual network to forward traffic to the peered virtual network" }
        - { id: remote, text: "Enable this virtual network to use the peered virtual network's remote gateway or route server" }
        - { id: forwarded, text: "Allow this virtual network to receive forwarded traffic from the peered virtual network" }
    - id: vpn
      options:
        - { id: policy, text: { en: "Policy-based, Basic SKU", fr: "Basé sur une stratégie (Policy-based), référence SKU Basic" } }
        - { id: routebasic, text: { en: "Route-based, Basic SKU", fr: "Basé sur l'itinéraire (Route-based), référence SKU Basic" } }
        - { id: routegw2, text: { en: "Route-based, VpnGw2AZ SKU", fr: "Basé sur l'itinéraire (Route-based), référence SKU VpnGw2AZ" } }
answer:
  values: { hub: transit, spoke: remote, vpn: routegw2 }
explanation:
  correct:
    en: Gateway transit is enabled on the hub side, which allows the gateways of VNet-Hub to serve the peered network, and the spoke side is set to use the remote gateways of VNet-Hub. Forwarded traffic is already allowed on every link and doesn't give access to the gateways. VpnGw-Hub coexists with an ExpressRoute gateway in GatewaySubnet, and a coexistence configuration requires a route-based VPN gateway that isn't the Basic SKU.
    fr: Le transit par passerelle est activé côté hub, ce qui permet aux passerelles de VNet-Hub de servir l'autre réseau virtuel du peering, et le côté spoke est configuré pour utiliser les passerelles distantes de VNet-Hub. Le trafic transféré est déjà autorisé sur chaque lien et ne donne pas accès aux passerelles. VpnGw-Hub coexiste avec une passerelle ExpressRoute dans GatewaySubnet, et une configuration de coexistence exige une passerelle VPN basée sur l'itinéraire qui n'utilise pas la référence SKU Basic.
  options:
    transit:
      en: Gateway transit is offered by the virtual network that hosts the gateways, VNet-Hub. VNet-Scada has no gateway to share, so this setting belongs only on the hub side.
      fr: "Le transit par passerelle est offert par le réseau virtuel qui héberge les passerelles, VNet-Hub. VNet-Scada n'a aucune passerelle à partager : ce paramètre n'a sa place que côté hub."
    remote:
      en: Using remote gateways is enabled on the virtual network that has no gateway, VNet-Scada. VNet-Hub hosts the gateways and offers them through gateway transit.
      fr: L'utilisation des passerelles distantes s'active sur le réseau virtuel qui n'a pas de passerelle, VNet-Scada. VNet-Hub héberge les passerelles et les offre par le transit par passerelle.
    forwarded:
      en: Forwarded traffic is already allowed on every link. It accepts traffic that doesn't originate in the other virtual network of the peering, but it doesn't share a gateway.
      fr: Le trafic transféré est déjà autorisé sur chaque lien. Il accepte le trafic qui ne provient pas de l'autre réseau virtuel du peering, mais il ne partage aucune passerelle.
    policy:
      en: A policy-based VPN gateway can't coexist with an ExpressRoute gateway, and the Basic SKU doesn't support coexistence or gateway transit.
      fr: Une passerelle VPN basée sur une stratégie ne peut pas coexister avec une passerelle ExpressRoute, et la référence SKU Basic ne prend en charge ni la coexistence ni le transit par passerelle.
    routebasic:
      en: The Basic SKU isn't supported in an ExpressRoute and VPN coexistence configuration.
      fr: La référence SKU Basic n'est pas prise en charge dans une configuration de coexistence ExpressRoute et VPN.
references:
  - title: Configure VPN gateway transit for virtual network peering
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-peering-gateway-transit
  - title: Configure ExpressRoute and site-to-site coexisting connections using PowerShell
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-coexist-resource-manager
