id: az700-1c-cse-exposed-ip-query
objective: "1.4.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware uses Defender CSPM. You need to use cloud security explorer to list the IP addresses that Defender External Attack Surface Management (EASM) found exposed on the internet and that route traffic to virtual machines.

    How should you build the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise Defender CSPM. Vous devez utiliser l'explorateur de sécurité du cloud pour lister les adresses IP que Defender External Attack Surface Management (EASM) a trouvées exposées sur Internet et qui acheminent le trafic vers des machines virtuelles.

    Comment devez-vous construire la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      1. In the resource drop-down menu, select [[res]], and then select Done.
      2. Select +, and add the condition [[cond1]].
      3. Select +, add the condition Routes traffic to, and select the resource type Virtual machine.
      4. Select Search.
      5. To send the results to the audit team as a file, select [[export]].
    fr: |
      1. Dans le menu déroulant des ressources, sélectionnez [[res]], puis Done.
      2. Sélectionnez +, et ajoutez la condition [[cond1]].
      3. Sélectionnez +, ajoutez la condition Routes traffic to, et sélectionnez le type de ressource Virtual machine.
      4. Sélectionnez Search.
      5. Pour envoyer les résultats à l'équipe d'audit sous forme de fichier, sélectionnez [[export]].
  slots:
    - id: res
      options:
        - { id: vm, text: Virtual machines }
        - { id: ip, text: IP addresses }
        - { id: nsg, text: Network security groups }
    - id: cond1
      options:
        - { id: trusted, text: Trusted Exposure }
        - { id: width, text: Exposure width }
        - { id: deasm, text: DEASM Findings }
    - id: export
      options:
        - { id: share, text: Share query link }
        - { id: csv, text: Download CSV report }
        - { id: open, text: Open query }
answer:
  values: { res: ip, cond1: deasm, export: csv }
explanation:
  correct:
    en: "To detect internet-exposed IP addresses, you start from the IP addresses resource type, add the DEASM Findings condition (the EASM results shown in cloud security explorer), and then add the Routes traffic to relationship toward Virtual machine. The query returns the exposed IP addresses with the virtual machines they reach, and Download CSV report saves the results as a CSV file."
    fr: "Pour détecter les adresses IP exposées à Internet, vous partez du type de ressource IP addresses, ajoutez la condition DEASM Findings (les résultats d'EASM présentés dans l'explorateur de sécurité du cloud), puis ajoutez la relation Routes traffic to vers Virtual machine. La requête renvoie les adresses IP exposées avec les machines virtuelles qu'elles atteignent, et Download CSV report enregistre les résultats dans un fichier CSV."
  options:
    vm: { en: "Starting from virtual machines would list VMs, not the IP addresses that the requirement asks for.", fr: "Partir des machines virtuelles listerait des machines virtuelles, pas les adresses IP demandées." }
    trusted: { en: "Trusted Exposure marks VMs exposed only to trusted IP ranges; it isn't the EASM finding.", fr: "Trusted Exposure signale les machines virtuelles exposées uniquement à des plages d'adresses IP approuvées ; ce n'est pas le résultat d'EASM." }
    width: { en: "Exposure width tags compute resources as widely or narrowly exposed; it isn't the EASM finding on IP addresses.", fr: "Exposure width classe les ressources de calcul comme largement ou faiblement exposées ; ce n'est pas le résultat d'EASM sur les adresses IP." }
    share: { en: "Share query link copies a link to the query, not a file with the results.", fr: "Share query link copie un lien vers la requête, pas un fichier contenant les résultats." }
    open: { en: "Open query loads a query template into the query builder.", fr: "Open query charge un modèle de requête dans le générateur de requêtes." }
references:
  - title: Detect internet exposed IP addresses
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/detect-exposed-ip-addresses
  - title: Internet exposure analysis
    url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/internet-exposure-analysis
