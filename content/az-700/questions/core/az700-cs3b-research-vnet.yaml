id: az700-cs3b-research-vnet
objective: "1.1.1"
type: single
caseStudy: az700-cs3b-bellows
difficulty: 1
status: draft
stem:
  en: You need to choose the address space of VNet-Research. Which address space should you use?
  fr: Vous devez choisir l'espace d'adressage de VNet-Research. Quel espace d'adressage devez-vous utiliser ?
body:
  options:
    - { id: a, text: "10.200.8.0/22" }
    - { id: b, text: "10.220.0.0/24" }
    - { id: c, text: "10.30.64.0/22" }
    - { id: d, text: "10.221.0.0/22" }
answer: { optionId: d }
explanation:
  correct:
    en: VNet-Research needs room for four /24 subnets, so at least a /22. A virtual network that you connect to another virtual network or to an on-premises network must have a unique address space, so the range must not overlap Hub-VNet or the campuses. 10.221.0.0/22 contains exactly four /24 subnets and overlaps none of these ranges.
    fr: VNet-Research a besoin de la place de quatre sous-réseaux /24, donc d'au moins un /22. Un réseau virtuel que vous connectez à un autre réseau virtuel ou à un réseau local doit avoir un espace d'adressage unique ; la plage ne doit donc chevaucher ni Hub-VNet, ni les campus. 10.221.0.0/22 contient exactement quatre sous-réseaux /24 et ne chevauche aucune de ces plages.
  options:
    a: { en: "10.200.8.0/22 is inside 10.200.0.0/20, the address space of Hub-VNet, so the two virtual networks couldn't be peered.", fr: "10.200.8.0/22 est inclus dans 10.200.0.0/20, l'espace d'adressage de Hub-VNet : les deux réseaux virtuels ne pourraient pas être reliés par peering." }
    b: { en: "A /24 address space holds only one /24 subnet.", fr: "Un espace d'adressage /24 ne contient qu'un seul sous-réseau /24." }
    c: { en: "10.30.64.0/22 is inside 10.30.0.0/16, the range of the South campus, which VNet-Research must reach through GW-VPN.", fr: "10.30.64.0/22 est inclus dans 10.30.0.0/16, la plage du campus South, que VNet-Research doit atteindre par GW-VPN." }
references:
  - title: Plan virtual networks
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-vnet-plan-design-arm
