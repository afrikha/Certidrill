id: az700-sr1-onprem-private-dns-1
objective: "1.2.7"
type: series_yesno
series: az700-sr1-onprem-private-dns
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: |
    You create a conditional forwarder that targets 168.63.129.16.
  fr: |
    Vous créez un redirecteur conditionnel qui cible 168.63.129.16.
body:
  solution:
    en: |
      On the two on-premises DNS servers, you create a conditional forwarder for **blob.core.windows.net** that forwards the queries to **168.63.129.16**.
    fr: |
      Sur les deux serveurs DNS locaux, vous créez un redirecteur conditionnel pour **blob.core.windows.net** qui transfère les requêtes à **168.63.129.16**.
answer: { value: false }
explanation:
  correct:
    en: |
      168.63.129.16 is a virtual IP address of the Azure platform that answers DNS queries for resources inside Azure virtual networks; an on-premises DNS server can't use it as a forwarder target. Queries for a private endpoint must originate from a virtual network that is linked to the private DNS zone, so the on-premises servers must forward to a component deployed in VNet-Hub, such as an inbound endpoint of Azure DNS Private Resolver.
    fr: |
      168.63.129.16 est une adresse IP virtuelle de la plateforme Azure qui répond aux requêtes DNS des ressources situées dans les réseaux virtuels Azure ; un serveur DNS local ne peut pas l'utiliser comme cible de redirection. Les requêtes relatives à un point de terminaison privé doivent provenir d'un réseau virtuel lié à la zone DNS privée : les serveurs locaux doivent donc transférer vers un composant déployé dans VNet-Hub, comme un point de terminaison entrant d'Azure DNS Private Resolver.
references:
  - title: Azure Private Endpoint DNS integration Scenarios
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
  - title: Azure IP address 168.63.129.16 overview
