series: az700-sr2-natgw
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You associate a NAT gateway that has one public IP address with Subnet1.
  fr: Vous associez à Subnet1 une passerelle NAT dotée d'une adresse IP publique.
body:
  solution:
    en: |
      You create a Standard NAT gateway, you associate one Standard SKU static public IP address with it, and you associate the NAT gateway with Subnet1. You add that address to the Fabrikam allowlist.
    fr: |
      Vous créez une passerelle NAT Standard, vous lui associez une adresse IP publique statique de référence SKU Standard, puis vous associez la passerelle NAT à Subnet1. Vous ajoutez cette adresse à la liste d'autorisation de Fabrikam.
answer: { value: true }
explanation:
  correct:
    en: |
      A NAT gateway provides outbound connectivity at the subnet level, so every current and future instance in Subnet1 uses the single static address, which fits the allowlist. A NAT gateway doesn't permit unsolicited inbound connections from the internet: only response packets to outbound connections pass through it.
    fr: |
      Une passerelle NAT fournit la connectivité sortante au niveau du sous-réseau : toutes les instances actuelles et futures de Subnet1 utilisent l'unique adresse statique, qui tient dans la liste d'autorisation. Une passerelle NAT n'autorise aucune connexion entrante non sollicitée depuis Internet : seuls les paquets de réponse aux connexions sortantes la traversent.
references:
  - title: What is Azure NAT Gateway?
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
