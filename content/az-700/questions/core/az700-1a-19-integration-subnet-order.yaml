id: az700-1a-19-integration-subnet-order
objective: "1.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware has a virtual network named VNet-Web with free address space. You plan to connect two App Service plans, ASP-A and ASP-B, to VNet-Web by using regional virtual network integration with one shared subnet (multi plan subnet join).

    You need to prepare the network so that both plans can be integrated and can reach their maximum scale. You prepare the subnet yourself before you configure the apps.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware dispose d'un réseau virtuel nommé VNet-Web avec de l'espace d'adressage libre. Vous prévoyez de connecter deux plans App Service, ASP-A et ASP-B, à VNet-Web par l'intégration au réseau virtuel régional avec un seul sous-réseau partagé (jonction de sous-réseau à plusieurs plans, MPSJ).

    Vous devez préparer le réseau pour que les deux plans puissent être intégrés et atteindre leur échelle maximale. Vous préparez vous-même le sous-réseau avant de configurer les applications.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create26, text: { en: "Create a /26 subnet named snet-integration.", fr: "Créer un sous-réseau /26 nommé snet-integration." } }
    - { id: create28, text: { en: "Create a /28 subnet named snet-integration.", fr: "Créer un sous-réseau /28 nommé snet-integration." } }
    - { id: deleg, text: { en: "Delegate snet-integration to Microsoft.Web/serverFarms.", fr: "Déléguer snet-integration à Microsoft.Web/serverFarms." } }
    - { id: integrate, text: { en: "Enable virtual network integration with snet-integration on the apps of ASP-A and ASP-B.", fr: "Activer l'intégration au réseau virtuel avec snet-integration sur les applications d'ASP-A et d'ASP-B." } }
    - { id: pe, text: { en: "Create a private endpoint for each app in snet-integration.", fr: "Créer un point de terminaison privé pour chaque application dans snet-integration." } }
    - { id: resize, text: { en: "Extend the range of snet-integration after the apps scale out.", fr: "Étendre la plage de snet-integration après la montée en charge des applications." } }
answer:
  sequence: [ create26, deleg, integrate ]
explanation:
  correct:
    en: |
      Multi plan subnet join requires a subnet of at least /26, and a /26 also covers the maximum scale of a plan. The subnet is delegated to Microsoft.Web/serverFarms, then the apps are integrated with it. The size must be right from the start because the range of a subnet can't be changed while it is in use.
    fr: |
      La jonction de sous-réseau à plusieurs plans exige un sous-réseau d'au moins /26, et un /26 couvre aussi l'échelle maximale d'un plan. Le sous-réseau est délégué à Microsoft.Web/serverFarms, puis les applications y sont intégrées. La taille doit être correcte dès le départ, car la plage d'un sous-réseau ne peut pas être modifiée tant qu'il est utilisé.
  options:
    create28: { en: "/28 is the minimum for a single plan; multi plan subnet join needs /26 or larger.", fr: "/28 est le minimum pour un seul plan ; la jonction à plusieurs plans exige /26 ou plus." }
    pe: { en: "Private endpoints serve inbound private access to an app and can't be placed in a delegated subnet.", fr: "Les points de terminaison privés servent à l'accès privé entrant à une application et ne peuvent pas être placés dans un sous-réseau délégué." }
    resize: { en: "A subnet range can't be changed while resources use it.", fr: "La plage d'un sous-réseau ne peut pas être modifiée tant que des ressources l'utilisent." }
references:
  - title: Integrate your app with an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-vnet-integration
