id: az700-1b-peering-sync
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has two peered virtual networks, **VNet-Hub** (10.0.0.0/16) and **VNet-Spoke1** (10.1.0.0/16). Production traffic flows continuously between them.

    You add the address range 10.21.0.0/16 to VNet-Spoke1 and create a subnet in it. The peering shows that a sync is required, and the virtual machines of VNet-Hub can't reach the new subnet.

    You need to restore full connectivity without interrupting the existing traffic between the virtual networks.

    What should you do?
  fr: |
    Litware dispose de deux réseaux virtuels reliés par peering, **VNet-Hub** (10.0.0.0/16) et **VNet-Spoke1** (10.1.0.0/16). Du trafic de production circule en permanence entre eux.

    Vous ajoutez la plage d'adresses 10.21.0.0/16 à VNet-Spoke1 et y créez un sous-réseau. Le peering indique qu'une synchronisation est nécessaire, et les machines virtuelles de VNet-Hub ne peuvent pas joindre le nouveau sous-réseau.

    Vous devez rétablir la connectivité complète sans interrompre le trafic existant entre les réseaux virtuels.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Delete both peering links and re-create them.", fr: "Supprimer les deux liens de peering et les recréer." }
    - id: b
      text: { en: "Add a route for 10.21.0.0/16 with the next hop type Virtual network in VNet-Hub.", fr: "Ajouter dans VNet-Hub un itinéraire pour 10.21.0.0/16 avec le type de tronçon suivant Réseau virtuel." }
    - id: c
      text: { en: "Run az network vnet peering sync for the peering from VNet-Hub.", fr: "Exécuter az network vnet peering sync pour le peering depuis VNet-Hub." }
    - id: d
      text: { en: "Restart the virtual machines of VNet-Hub to renew their routes.", fr: "Redémarrer les machines virtuelles de VNet-Hub pour renouveler leurs itinéraires." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      You can resize the address space of a peered virtual network without downtime, but the peering must then be synced so that the remote side learns the new range. Syncing the peering (in the portal or with `az network vnet peering sync`) updates it without interrupting the traffic on the existing ranges.
    fr: |
      Vous pouvez redimensionner l'espace d'adressage d'un réseau virtuel relié par peering sans interruption, mais le peering doit ensuite être synchronisé pour que le côté distant connaisse la nouvelle plage. La synchronisation du peering (dans le portail ou avec `az network vnet peering sync`) le met à jour sans interrompre le trafic sur les plages existantes.
  options:
    a: { en: "Re-creating the peering would restore connectivity, but traffic would stop while the links are deleted.", fr: "Recréer le peering rétablirait la connectivité, mais le trafic s'arrêterait pendant la suppression des liens." }
    b: { en: "The missing piece is the peering's knowledge of the new range; a route with the Virtual network next hop only overrides routing inside the address space of VNet-Hub.", fr: "Ce qui manque, c'est la connaissance de la nouvelle plage par le peering ; un itinéraire avec le tronçon suivant Réseau virtuel ne remplace que le routage dans l'espace d'adressage de VNet-Hub." }
    d: { en: "Routes aren't delivered through DHCP; restarting virtual machines doesn't update the peering.", fr: "Les itinéraires ne sont pas distribués par DHCP ; redémarrer des machines virtuelles ne met pas à jour le peering." }
references:
  - title: Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
  - title: az network vnet peering
    url: https://learn.microsoft.com/en-us/cli/azure/network/vnet/peering
