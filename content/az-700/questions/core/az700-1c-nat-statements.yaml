id: az700-1c-nat-statements
objective: "1.3.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum evaluates Azure NAT Gateway for its workloads in the France Central region. The workloads use two virtual networks, **VNet-Prod** and **VNet-Test**. Some virtual machines in VNet-Prod already have instance-level public IP addresses, and the workloads must keep outbound connectivity during the failure of a single availability zone.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum évalue Azure NAT Gateway pour ses charges de travail dans la région France Central. Les charges de travail utilisent deux réseaux virtuels, **VNet-Prod** et **VNet-Test**. Certaines machines virtuelles de VNet-Prod disposent déjà d'adresses IP publiques au niveau de l'instance, et les charges de travail doivent conserver leur connectivité sortante en cas de panne d'une seule zone de disponibilité.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A StandardV2 NAT gateway keeps providing outbound connectivity when a single availability zone fails.", fr: "Une passerelle NAT StandardV2 continue de fournir la connectivité sortante en cas de panne d'une seule zone de disponibilité." } }
    - { id: b, text: { en: "A single NAT gateway can be associated with subnets in both VNet-Prod and VNet-Test.", fr: "Une même passerelle NAT peut être associée à des sous-réseaux de VNet-Prod et de VNet-Test." } }
    - { id: c, text: { en: "After a NAT gateway is associated with their subnet, new outbound connections of VMs that have instance-level public IP addresses use the NAT gateway.", fr: "Une fois une passerelle NAT associée à leur sous-réseau, les nouvelles connexions sortantes des machines virtuelles disposant d'une adresse IP publique au niveau de l'instance utilisent la passerelle NAT." } }
    - { id: d, text: { en: "A Standard NAT gateway deployed with No zone is zone redundant.", fr: "Une passerelle NAT Standard déployée avec l'option Aucune zone (No zone) est redondante interzone." } }
    - { id: e, text: { en: "A NAT gateway allows internet clients to initiate connections to the VMs through its public IP addresses.", fr: "Une passerelle NAT permet à des clients Internet d'initier des connexions vers les machines virtuelles via ses adresses IP publiques." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: The StandardV2 SKU is zone redundant and maintains outbound connectivity during a single zone failure. A NAT gateway takes precedence over other outbound methods, including instance-level public IPs and load balancer outbound rules, for all new connections; existing connections are not dropped.
    fr: "La référence SKU StandardV2 est redondante interzone et maintient la connectivité sortante en cas de panne d'une seule zone. Une passerelle NAT est prioritaire sur les autres méthodes sortantes, y compris les adresses IP publiques au niveau de l'instance et les règles sortantes d'équilibreur de charge, pour toutes les nouvelles connexions ; les connexions existantes ne sont pas interrompues."
  options:
    b: { en: "A NAT gateway can serve several subnets of one virtual network only; it can't span virtual networks.", fr: "Une passerelle NAT ne peut desservir que plusieurs sous-réseaux d'un même réseau virtuel ; elle ne peut pas couvrir plusieurs réseaux virtuels." }
    d: { en: "The Standard SKU is zonal: with No zone, Azure places it in a zone for you, and an outage of that zone affects it.", fr: "La référence SKU Standard est zonale : avec Aucune zone, Azure la place dans une zone à votre place, et une panne de cette zone l'affecte." }
    e: { en: "A NAT gateway doesn't permit unsolicited inbound connections; only responses to outbound flows come back through it.", fr: "Une passerelle NAT n'autorise pas les connexions entrantes non sollicitées ; seules les réponses aux flux sortants reviennent par elle." }
references:
  - title: What is Azure NAT Gateway?
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
  - title: NAT gateway resource
    url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-gateway-resource
