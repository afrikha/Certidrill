id: az700-1b-udr-next-hop-types
objective: "1.3.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has a virtual network named **VNet1** (10.1.0.0/16) that contains a VPN gateway and an Azure Firewall instance with the private IP address 10.1.0.4. You are creating a route table for a subnet of VNet1. The route table already contains a route for 10.1.0.0/16 with the next hop type Virtual appliance and the address 10.1.0.4.

    Which next hop type should you use for each route? To answer, drag the appropriate next hop types to the correct routes. Each next hop type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un réseau virtuel nommé **VNet1** (10.1.0.0/16) qui contient une passerelle VPN et une instance du Pare-feu Azure d'adresse IP privée 10.1.0.4. Vous créez une table de routage pour un sous-réseau de VNet1. La table contient déjà un itinéraire pour 10.1.0.0/16 avec le type de tronçon suivant Appliance virtuelle et l'adresse 10.1.0.4.

    Quel type de tronçon suivant devez-vous utiliser pour chaque itinéraire ? Pour répondre, faites glisser les types de tronçon suivant appropriés vers les itinéraires correspondants. Chaque type de tronçon suivant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: va, text: VirtualAppliance }
    - { id: vgw, text: VirtualNetworkGateway }
    - { id: none, text: None }
    - { id: vnetlocal, text: VnetLocal }
    - { id: internet, text: Internet }
    - { id: peering, text: { en: "Virtual network peering", fr: "Peering de réseau virtuel" } }
  targets:
    - id: drop
      text: { en: "Traffic to 10.99.0.0/16 must be dropped", fr: "Le trafic vers 10.99.0.0/16 doit être abandonné" }
    - id: fw
      text: { en: "Traffic to 10.30.0.0/16 must be sent to the firewall", fr: "Le trafic vers 10.30.0.0/16 doit être envoyé au pare-feu" }
    - id: vpn
      text: { en: "Traffic to 172.16.0.0/16 must be sent to the VPN gateway", fr: "Le trafic vers 172.16.0.0/16 doit être envoyé à la passerelle VPN" }
    - id: local
      text: { en: "Traffic to 10.1.4.0/24 must be delivered directly, without the firewall", fr: "Le trafic vers 10.1.4.0/24 doit être remis directement, sans le pare-feu" }
answer:
  mapping: { drop: none, fw: va, vpn: vgw, local: vnetlocal }
explanation:
  correct:
    en: |
      None drops the traffic. VirtualAppliance needs the next hop IP address of the firewall. VirtualNetworkGateway sends the traffic to the VPN gateway of the virtual network. VnetLocal (Virtual network) overrides the broader user-defined route for 10.1.4.0/24, because the longer prefix wins, so this traffic stays inside the virtual network.
    fr: |
      None abandonne le trafic. VirtualAppliance exige l'adresse IP du pare-feu comme tronçon suivant. VirtualNetworkGateway envoie le trafic à la passerelle VPN du réseau virtuel. VnetLocal (Réseau virtuel) remplace pour 10.1.4.0/24 l'itinéraire défini par l'utilisateur plus large, car le préfixe le plus long l'emporte : ce trafic reste dans le réseau virtuel.
  options:
    internet: { en: "Internet sends traffic to the internet edge; it's not the right next hop for any of these private ranges.", fr: "Internet envoie le trafic vers la périphérie Internet ; ce n'est le bon tronçon suivant pour aucune de ces plages privées." }
    peering: { en: "Virtual network peering routes are created by Azure when you peer networks; you can't specify this next hop in a user-defined route.", fr: "Les itinéraires de peering de réseaux virtuels sont créés par Azure au moment du peering ; vous ne pouvez pas spécifier ce tronçon suivant dans un itinéraire défini par l'utilisateur." }
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
