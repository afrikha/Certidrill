id: az700-cs4a-network-watcher
objective: "1.4.2"
type: dragdrop
caseStudy: az700-cs4a-coho-resorts
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend an Azure Network Watcher feature for each operations requirement of the network engineers.

    Which feature should you recommend for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une fonctionnalité d'Azure Network Watcher pour chaque exigence d'exploitation des ingénieurs réseau.

    Quelle fonctionnalité devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ipflow, text: { en: "IP flow verify", fr: "Vérification des flux IP (IP flow verify)" } }
    - { id: nexthop, text: { en: "Next hop", fr: "Tronçon suivant (Next hop)" } }
    - { id: connmon, text: { en: "Connection monitor", fr: "Moniteur de connexion (Connection monitor)" } }
    - { id: flowlogs, text: { en: "Virtual network flow logs", fr: "Journaux de flux de réseau virtuel" } }
    - { id: pcap, text: { en: "Packet capture", fr: "Capture de paquets" } }
    - { id: vpnts, text: { en: "VPN troubleshoot", fr: "Résolution des problèmes VPN (VPN troubleshoot)" } }
  targets:
    - { id: t1, text: { en: "Check whether the NSGs allow a given packet to or from a virtual machine, and identify the rule", fr: "Vérifier si les NSG autorisent un paquet donné vers ou depuis une machine virtuelle, et identifier la règle" } }
    - { id: t2, text: { en: "Identify the next hop that a virtual machine uses to reach a given IP address", fr: "Identifier le tronçon suivant qu'une machine virtuelle utilise pour joindre une adresse IP donnée" } }
    - { id: t3, text: { en: "Continuously measure latency and packet loss to the payment providers, with alerts", fr: "Mesurer en continu la latence et la perte de paquets vers les prestataires de paiement, avec des alertes" } }
    - { id: t4, text: { en: "Record the IP flows of VNet-App for traffic analytics", fr: "Enregistrer les flux IP de VNet-App pour traffic analytics" } }
answer:
  mapping: { t1: ipflow, t2: nexthop, t3: connmon, t4: flowlogs }
explanation:
  correct:
    en: IP flow verify tests a packet (direction, protocol, addresses, ports) against the effective NSG rules of a virtual machine and returns Allow or Deny with the rule name. Next hop returns the next hop type and IP address, and the route used, for a destination. Connection monitor tests Azure and hybrid endpoints continuously, measures latency and packet loss, and raises alerts through Azure Monitor. Virtual network flow logs record the IP traffic of a virtual network to a storage account, and traffic analytics visualizes them; NSG flow logs are being retired in favor of virtual network flow logs.
    fr: La vérification des flux IP teste un paquet (sens, protocole, adresses, ports) par rapport aux règles NSG effectives d'une machine virtuelle et renvoie Allow ou Deny avec le nom de la règle. Le tronçon suivant renvoie le type et l'adresse IP du tronçon suivant, ainsi que l'itinéraire utilisé, pour une destination. Le moniteur de connexion teste en continu des points de terminaison Azure et hybrides, mesure la latence et la perte de paquets, et déclenche des alertes par Azure Monitor. Les journaux de flux de réseau virtuel enregistrent le trafic IP d'un réseau virtuel dans un compte de stockage, et traffic analytics les visualise ; les journaux de flux NSG sont mis hors service au profit des journaux de flux de réseau virtuel.
  options:
    pcap: { en: "Packet capture records the packets of one VM or scale set for a session; it doesn't evaluate NSG rules or monitor endpoints continuously.", fr: "La capture de paquets enregistre les paquets d'une machine virtuelle ou d'un groupe identique pendant une session ; elle n'évalue pas les règles NSG et ne supervise pas des points de terminaison en continu." }
    vpnts: { en: "VPN troubleshoot diagnoses virtual network gateways and their connections, not VM traffic to internet endpoints.", fr: "La résolution des problèmes VPN diagnostique les passerelles de réseau virtuel et leurs connexions, pas le trafic des machines virtuelles vers des points de terminaison Internet." }
references:
  - title: What is Azure Network Watcher?
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview
