id: az700-1a-02-reserved-ranges
objective: "1.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are planning the address space of a new virtual network named VNet1. The network team proposes several ranges.

    Which two ranges will Azure reject if you add them to the address space of VNet1?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez l'espace d'adressage d'un nouveau réseau virtuel nommé VNet1. L'équipe réseau propose plusieurs plages.

    Quelles sont les deux plages qu'Azure refusera si vous les ajoutez à l'espace d'adressage de VNet1 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: 100.64.0.0/16 }
    - { id: b, text: 169.254.0.0/16 }
    - { id: c, text: 172.20.0.0/16 }
    - { id: d, text: 127.0.0.0/8 }
    - { id: e, text: 203.0.113.0/24 }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Azure doesn't accept the multicast (224.0.0.0/4), broadcast (255.255.255.255/32), loopback (127.0.0.0/8) and link-local (169.254.0.0/16) ranges, nor 168.63.129.16/32. The other ranges are accepted.
    fr: Azure n'accepte pas les plages de multidiffusion (224.0.0.0/4), de diffusion (255.255.255.255/32), de bouclage (127.0.0.0/8) et de lien local (169.254.0.0/16), ni 168.63.129.16/32. Les autres plages sont acceptées.
  options:
    a: { en: "The RFC 6598 shared range 100.64.0.0/10 is supported and treated as private.", fr: "La plage partagée RFC 6598 100.64.0.0/10 est prise en charge et traitée comme privée." }
    c: { en: "172.20.0.0/16 is part of the RFC 1918 range 172.16.0.0/12.", fr: "172.20.0.0/16 fait partie de la plage RFC 1918 172.16.0.0/12." }
    e: { en: "A public range can be used in a virtual network; it is then reachable only from the virtual network and the networks connected to it.", fr: "Une plage publique peut être utilisée dans un réseau virtuel ; elle n'est alors joignable que depuis le réseau virtuel et les réseaux qui y sont connectés." }
references:
  - title: Azure Virtual Network FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
  - title: Create, change, or delete an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-virtual-network
