id: az700-1c-ft-firewall-mgmt-nic
objective: "1.3.6"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a hub virtual network named **VNet-Hub** that contains:

    - an Azure Firewall Standard named **FW1**, deployed in AzureFirewallSubnet without the Firewall Management network interface;
    - a VPN gateway that has a site-to-site connection to the on-premises datacenter;
    - a subnet named AzureFirewallManagementSubnet (/26) and a Standard public IP address named **pip-fw-mgmt**, created for this change.

    Security policy requires that internet-bound traffic leaving FW1 be sent to the on-premises datacenter through the VPN gateway. You plan to keep the existing firewall instead of redeploying it.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'un réseau virtuel hub nommé **VNet-Hub** qui contient :

    - un Pare-feu Azure Standard nommé **FW1**, déployé dans AzureFirewallSubnet sans l'interface réseau de gestion du pare-feu (Firewall Management) ;
    - une passerelle VPN disposant d'une connexion de site à site vers le centre de données local ;
    - un sous-réseau nommé AzureFirewallManagementSubnet (/26) et une adresse IP publique Standard nommée **pip-fw-mgmt**, créés pour cette modification.

    La stratégie de sécurité exige que le trafic à destination d'Internet sortant de FW1 soit envoyé au centre de données local via la passerelle VPN. Vous prévoyez de conserver le pare-feu existant plutôt que de le redéployer.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: stop, text: { en: "Stop FW1 by calling the Deallocate() method and running Set-AzFirewall.", fr: "Arrêter FW1 en appelant la méthode Deallocate() puis en exécutant Set-AzFirewall." } }
    - { id: start, text: { en: "Start FW1 by calling Allocate() with VNet-Hub, the data public IP address and pip-fw-mgmt, and then running Set-AzFirewall.", fr: "Démarrer FW1 en appelant Allocate() avec VNet-Hub, l'adresse IP publique de données et pip-fw-mgmt, puis en exécutant Set-AzFirewall." } }
    - { id: route, text: { en: "Associate with AzureFirewallSubnet a route table that contains a 0.0.0.0/0 route with the next hop type Virtual network gateway.", fr: "Associer à AzureFirewallSubnet une table de routage contenant un itinéraire 0.0.0.0/0 avec le type de tronçon suivant Passerelle de réseau virtuel." } }
    - { id: mgmtroute, text: { en: "Associate with AzureFirewallManagementSubnet a route table that contains a 0.0.0.0/0 route with the next hop type Virtual network gateway.", fr: "Associer à AzureFirewallManagementSubnet une table de routage contenant un itinéraire 0.0.0.0/0 avec le type de tronçon suivant Passerelle de réseau virtuel." } }
    - { id: noprop, text: { en: "Disable gateway route propagation on the route table of AzureFirewallSubnet.", fr: "Désactiver la propagation des itinéraires de passerelle sur la table de routage d'AzureFirewallSubnet." } }
    - { id: ipfwd, text: { en: "Enable IP forwarding on the network interface of FW1.", fr: "Activer le transfert IP sur l'interface réseau de FW1." } }
answer:
  sequence: [ stop, start, route ]
explanation:
  correct:
    en: |
      Forced tunneling requires the Firewall Management network interface. For an existing Standard or Premium firewall, you enable it by stopping the firewall (Deallocate) and starting it again with Allocate() and a management public IP address. Once the management traffic has its own path through AzureFirewallManagementSubnet, you can add a default route on AzureFirewallSubnet that points to the VPN gateway, so the firewall's internet-bound traffic goes on-premises.
    fr: |
      Le tunneling forcé nécessite l'interface réseau de gestion du pare-feu. Pour un pare-feu Standard ou Premium existant, vous l'activez en arrêtant le pare-feu (Deallocate) puis en le redémarrant avec Allocate() et une adresse IP publique de gestion. Une fois que le trafic de gestion dispose de son propre chemin via AzureFirewallManagementSubnet, vous pouvez ajouter sur AzureFirewallSubnet un itinéraire par défaut vers la passerelle VPN, afin que le trafic Internet du pare-feu parte vers le site local.
  options:
    mgmtroute: { en: "The only route allowed on AzureFirewallManagementSubnet is a default route to the internet; sending management traffic on-premises breaks the firewall.", fr: "Le seul itinéraire autorisé sur AzureFirewallManagementSubnet est un itinéraire par défaut vers Internet ; envoyer le trafic de gestion vers le site local perturbe le pare-feu." }
    noprop: { en: "Gateway route propagation must stay enabled on AzureFirewallSubnet so that the firewall learns the on-premises routes; it is the management subnet that must have propagation disabled.", fr: "La propagation des itinéraires de passerelle doit rester activée sur AzureFirewallSubnet pour que le pare-feu apprenne les itinéraires locaux ; c'est le sous-réseau de gestion qui doit avoir la propagation désactivée." }
    ipfwd: { en: "Azure Firewall is a managed service: you do not manage its network interfaces, and IP forwarding is not a setting you configure on it.", fr: "Le Pare-feu Azure est un service managé : vous ne gérez pas ses interfaces réseau, et le transfert IP n'est pas un paramètre que vous configurez sur lui." }
references:
  - title: Azure Firewall forced tunneling
    url: https://learn.microsoft.com/en-us/azure/firewall/forced-tunneling
  - title: Azure Firewall Management NIC
    url: https://learn.microsoft.com/en-us/azure/firewall/management-nic
