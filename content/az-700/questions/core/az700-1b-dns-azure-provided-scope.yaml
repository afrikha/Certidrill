id: az700-1b-dns-azure-provided-scope
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has the following virtual networks. Both use the default (Azure-provided) DNS settings, and no private DNS zone exists.

    | Virtual network | Address space | Virtual machine | Private IP address |
    | --- | --- | --- | --- |
    | VNet1 | 10.10.0.0/16 | VM1, VM2 | 10.10.1.4, 10.10.1.5 |
    | VNet2 | 10.20.0.0/16 | VM3 | 10.20.1.4 |

    VNet1 and VNet2 are peered, and the peering status is Connected on both sides.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose des réseaux virtuels suivants. Les deux utilisent les paramètres DNS par défaut (fournis par Azure), et aucune zone DNS privée n'existe.

    | Réseau virtuel | Espace d'adressage | Machine virtuelle | Adresse IP privée |
    | --- | --- | --- | --- |
    | VNet1 | 10.10.0.0/16 | VM1, VM2 | 10.10.1.4, 10.10.1.5 |
    | VNet2 | 10.20.0.0/16 | VM3 | 10.20.1.4 |

    Un peering relie VNet1 et VNet2, et son état est Connected des deux côtés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: VM1 can resolve the host name VM2 to 10.10.1.5.
        fr: VM1 peut résoudre le nom d'hôte VM2 en 10.10.1.5.
    - id: s2
      text:
        en: VM1 can resolve the host name VM3 to 10.20.1.4.
        fr: VM1 peut résoudre le nom d'hôte VM3 en 10.20.1.4.
    - id: s3
      text:
        en: A reverse DNS lookup of 10.20.1.4 from VM1 returns the name of VM3.
        fr: Une recherche DNS inversée de 10.20.1.4 depuis VM1 renvoie le nom de VM3.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Azure-provided name resolution works without configuration for virtual machines of the same virtual network, by host name or FQDN. Its scope is one virtual network, even when that network is peered, so VM1 can't resolve VM3, and reverse lookups for addresses in a peered virtual network return NXDOMAIN. A private DNS zone linked to both networks, or your own DNS servers, is needed for cross-network resolution.
    fr: |
      La résolution de noms fournie par Azure fonctionne sans configuration entre les machines virtuelles d'un même réseau virtuel, par nom d'hôte ou par FQDN. Sa portée est un seul réseau virtuel, même relié par peering : VM1 ne peut donc pas résoudre VM3, et les recherches inversées d'adresses d'un réseau virtuel relié par peering renvoient NXDOMAIN. Une zone DNS privée liée aux deux réseaux, ou vos propres serveurs DNS, est nécessaire pour la résolution entre réseaux.
references:
  - title: Configure DNS name resolution for Azure virtual networks
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-name-resolution-for-vms-and-role-instances
