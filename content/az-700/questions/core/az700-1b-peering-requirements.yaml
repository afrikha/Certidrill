id: az700-1b-peering-requirements
objective: "1.3.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to peer the following virtual networks:

    | Virtual network | Microsoft Entra tenant | Subscription | Region | Address space |
    | --- | --- | --- | --- | --- |
    | VNet-A | contoso.com | Sub-Contoso | West Europe | 10.10.0.0/16 |
    | VNet-B | fabrikam.com | Sub-Fabrikam | East US | 10.20.0.0/16 |

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit de relier par peering les réseaux virtuels suivants :

    | Réseau virtuel | Locataire Microsoft Entra | Abonnement | Région | Espace d'adressage |
    | --- | --- | --- | --- | --- |
    | VNet-A | contoso.com | Sub-Contoso | West Europe | 10.10.0.0/16 |
    | VNet-B | fabrikam.com | Sub-Fabrikam | East US | 10.20.0.0/16 |

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The peering is supported even though the virtual networks are in different tenants.", fr: "Le peering est pris en charge même si les réseaux virtuels sont dans des locataires différents." } }
    - { id: b, text: { en: "VNet-B must be moved to Sub-Contoso before the peering can be created.", fr: "VNet-B doit être déplacé dans Sub-Contoso avant de pouvoir créer le peering." } }
    - { id: c, text: { en: "Each virtual network must contain a VPN gateway for the peering to carry traffic.", fr: "Chaque réseau virtuel doit contenir une passerelle VPN pour que le peering achemine du trafic." } }
    - { id: d, text: { en: "Traffic between VNet-A and VNet-B doesn't cross the public internet.", fr: "Le trafic entre VNet-A et VNet-B ne traverse pas Internet." } }
    - { id: e, text: { en: "Default Azure name resolution works across the peering after it is connected.", fr: "La résolution de noms Azure par défaut fonctionne à travers le peering une fois celui-ci connecté." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Peering works across subscriptions, Microsoft Entra tenants and regions (global peering), provided the address spaces don't overlap. The traffic stays on the Microsoft backbone, even between regions, and needs no gateway or encryption.
    fr: |
      Le peering fonctionne entre abonnements, locataires Microsoft Entra et régions (peering mondial), à condition que les espaces d'adressage ne se chevauchent pas. Le trafic reste sur le réseau principal de Microsoft, même entre régions, sans passerelle ni chiffrement.
  options:
    b: { en: "Cross-subscription peering is supported; moving a virtual network even requires deleting its peerings first.", fr: "Le peering entre abonnements est pris en charge ; déplacer un réseau virtuel exige même de supprimer d'abord ses peerings." }
    c: { en: "Peering needs no gateway; gateways are optional, for example to share on-premises connectivity.", fr: "Le peering ne nécessite aucune passerelle ; les passerelles sont facultatives, par exemple pour partager la connectivité locale." }
    e: { en: "Azure-provided name resolution is scoped to one virtual network; use Azure Private DNS or custom DNS servers.", fr: "La résolution de noms fournie par Azure est limitée à un réseau virtuel ; utilisez Azure Private DNS ou des serveurs DNS personnalisés." }
references:
  - title: Create, change, or delete Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
  - title: Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
