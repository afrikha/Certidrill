id: az700-1c-ars-behavior
objective: "1.3.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip deploys Azure Route Server named **ARS1** in a hub virtual network. Two SD-WAN network virtual appliances, **NVA1** and **NVA2**, run in the hub and advertise the on-premises prefix 172.16.0.0/12 to ARS1 over BGP.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip déploie un Serveur de routes Azure nommé **ARS1** dans un réseau virtuel hub. Deux appliances virtuelles réseau SD-WAN, **NVA1** et **NVA2**, s'exécutent dans le hub et publient le préfixe local 172.16.0.0/12 vers ARS1 par BGP.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Traffic from a hub virtual machine to 172.16.10.5 passes through the ARS1 instances before it reaches NVA1 or NVA2.
        fr: Le trafic d'une machine virtuelle du hub vers 172.16.10.5 traverse les instances d'ARS1 avant d'atteindre NVA1 ou NVA2.
    - id: s2
      text:
        en: If NVA1 and NVA2 advertise 172.16.0.0/12 with the same AS path length, the hub virtual machines can send traffic for that prefix to both appliances.
        fr: Si NVA1 et NVA2 publient 172.16.0.0/12 avec la même longueur d'AS path, les machines virtuelles du hub peuvent envoyer le trafic de ce préfixe vers les deux appliances.
    - id: s3
      text:
        en: NVA1 can use the ASN 65515 for its BGP session with ARS1.
        fr: NVA1 peut utiliser l'ASN 65515 pour sa session BGP avec ARS1.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Route Server is only a control-plane component; it exchanges routes over BGP and is not in the data path, so traffic flows directly from the VMs to the NVA. When several NVAs advertise the same prefix with equal AS path length, Route Server programs multiple next hops and the VMs use ECMP. Route Server uses the ASN 65515, and the NVA must use a different ASN.
    fr: "Le Serveur de routes n'est qu'un composant du plan de contrôle : il échange des itinéraires par BGP et ne se trouve pas dans le chemin des données ; le trafic va directement des machines virtuelles à la NVA. Lorsque plusieurs NVA publient le même préfixe avec une longueur d'AS path égale, le Serveur de routes programme plusieurs tronçons suivants et les machines virtuelles utilisent ECMP. Le Serveur de routes utilise l'ASN 65515, et la NVA doit utiliser un ASN différent."
references:
  - title: Azure Route Server frequently asked questions
    url: https://learn.microsoft.com/en-us/azure/route-server/route-server-faq
  - title: What is Azure Route Server?
    url: https://learn.microsoft.com/en-us/azure/route-server/overview
