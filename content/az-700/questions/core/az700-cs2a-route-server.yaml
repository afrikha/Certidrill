id: az700-cs2a-route-server
objective: "1.3.8"
type: multi
caseStudy: az700-cs2a-alpine-ski-house
difficulty: 3
status: draft
stem:
  en: |
    You deploy rs-hub in a subnet named RouteServerSubnet of VNet-Hub. The BGP peering between rs-hub and nva-sdwan1 is established, and the virtual machines of VNet-Hub receive the 10.120.0.0/16 routes.

    You need to meet the routing and connectivity requirements for the SD-WAN resorts and VNet-Booking.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez rs-hub dans un sous-réseau nommé RouteServerSubnet de VNet-Hub. Le peering BGP entre rs-hub et nva-sdwan1 est établi, et les machines virtuelles de VNet-Hub reçoivent les routes 10.120.0.0/16.

    Vous devez respecter les exigences de routage et de connectivité relatives aux stations SD-WAN et à VNet-Booking.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable branch-to-branch traffic on rs-hub.", fr: "Activer le trafic de branche à branche (branch-to-branch) sur rs-hub." } }
    - { id: b, text: { en: "Change the ASN of VGW-Hub to 65020, the ASN of nva-sdwan1.", fr: "Remplacer l'ASN de VGW-Hub par 65020, l'ASN de nva-sdwan1." } }
    - { id: c, text: { en: "Enable gateway transit on the peering between VNet-Hub and VNet-Booking.", fr: "Activer le transit de passerelle sur le peering entre VNet-Hub et VNet-Booking." } }
    - { id: d, text: { en: "Associate a route table with RouteServerSubnet that sends 10.120.0.0/16 to 10.10.2.4.", fr: "Associer à RouteServerSubnet une table de routage qui envoie 10.120.0.0/16 vers 10.10.2.4." } }
    - { id: e, text: { en: "Create a route table that sends 10.120.0.0/16 to 10.10.2.4 and associate it with snet-app.", fr: "Créer une table de routage qui envoie 10.120.0.0/16 vers 10.10.2.4 et l'associer à snet-app." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      By default, Route Server doesn't exchange the routes that it learns from an NVA with a virtual network gateway; branch-to-branch makes rs-hub pass the SD-WAN prefixes to VGW-Hub, which advertises them to Annecy, and the head office prefixes to nva-sdwan1. With gateway transit on the peering (the VNet-Hub side allows its gateway or Route Server to forward traffic, and VNet-Booking uses the remote gateway or Route Server), the NVA routes are programmed into the virtual machines of VNet-Booking and VNet-Booking reaches the VPN sites through VGW-Hub.
    fr: |
      Par défaut, Route Server n'échange pas avec une passerelle de réseau virtuel les routes qu'il apprend d'une NVA ; le mode branche à branche fait transmettre par rs-hub les préfixes SD-WAN à VGW-Hub, qui les publie vers Annecy, et les préfixes du siège à nva-sdwan1. Avec le transit de passerelle sur le peering (le côté VNet-Hub autorise sa passerelle ou son serveur de routes à transférer le trafic, et VNet-Booking utilise la passerelle ou le serveur de routes distant), les routes de la NVA sont programmées dans les machines virtuelles de VNet-Booking, et VNet-Booking atteint les sites VPN par VGW-Hub.
  options:
    b: { en: "A VPN gateway that interoperates with Route Server must keep ASN 65515, and the NVA must use a different ASN.", fr: "Une passerelle VPN qui interagit avec Route Server doit conserver l'ASN 65515, et la NVA doit utiliser un autre ASN." }
    d: { en: "Route Server doesn't support a user-defined route on RouteServerSubnet, and it isn't in the data path.", fr: "Route Server ne prend pas en charge d'itinéraire défini par l'utilisateur sur RouteServerSubnet, et il ne se trouve pas sur le chemin des données." }
    e: { en: "The requirements forbid user-defined routes for these prefixes, and a route table doesn't make the head office learn them.", fr: "Les exigences interdisent les itinéraires définis par l'utilisateur pour ces préfixes, et une table de routage ne les fait pas apprendre au siège." }
references:
  - title: Azure Route Server frequently asked questions
    url: https://learn.microsoft.com/en-us/azure/route-server/route-server-faq
  - title: Create, change, or delete Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
