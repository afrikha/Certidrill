id: az700-cs3c-forced-tunneling
objective: "1.3.6"
type: single
caseStudy: az700-cs3c-munsons
difficulty: 2
status: draft
stem:
  en: You need to meet the routing requirement for the internet-bound traffic of the spokes. What should you do?
  fr: Vous devez respecter l'exigence de routage relative au trafic à destination d'Internet des spokes. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Associate with the spoke subnets a route table that sends 0.0.0.0/0 to the next hop type Virtual network gateway", fr: "Associer aux sous-réseaux des spokes une table de routage qui envoie 0.0.0.0/0 vers le type de tronçon suivant Passerelle de réseau virtuel" } }
    - { id: b, text: { en: "Configure Microsoft peering on ER-AMS and advertise 0.0.0.0/0 from the datacenter over it", fr: "Configurer le peering Microsoft sur ER-AMS et y publier 0.0.0.0/0 depuis le centre de données" } }
    - { id: c, text: { en: "Advertise 0.0.0.0/0 from the datacenter edge routers to Azure over the private peering of ER-AMS", fr: "Publier 0.0.0.0/0 depuis les routeurs de périphérie du centre de données vers Azure par le peering privé d'ER-AMS" } }
    - { id: d, text: { en: "Associate with GatewaySubnet a route table that sends 0.0.0.0/0 to the next hop type Virtual appliance", fr: "Associer à GatewaySubnet une table de routage qui envoie 0.0.0.0/0 vers le type de tronçon suivant Appliance virtuelle" } }
answer: { optionId: c }
explanation:
  correct:
    en: With ExpressRoute, forced tunneling is done over BGP. When the datacenter advertises a default route over private peering, GW-ER learns it, and the gateway transit of the peerings propagates it to the spokes, where it replaces the system route to the internet. Internet-bound traffic then goes to the datacenter proxies, while service endpoint routes, which are more specific, still apply.
    fr: Avec ExpressRoute, le tunnel forcé se fait par BGP. Quand le centre de données publie un itinéraire par défaut par le peering privé, GW-ER l'apprend, et le transit de passerelle des peerings le propage aux spokes, où il remplace l'itinéraire système vers Internet. Le trafic à destination d'Internet part alors vers les proxys du centre de données, tandis que les itinéraires de point de terminaison de service, plus spécifiques, continuent de s'appliquer.
  options:
    a: { en: "A user-defined route can't force traffic to an ExpressRoute gateway; the default route must be learned over BGP.", fr: "Un itinéraire défini par l'utilisateur ne peut pas forcer le trafic vers une passerelle ExpressRoute ; l'itinéraire par défaut doit être appris par BGP." }
    b: { en: "Microsoft peering carries traffic to Microsoft public services, and default routes must be filtered out of that path; it doesn't bring routes to the virtual networks.", fr: "Le peering Microsoft transporte le trafic vers les services publics de Microsoft, et les itinéraires par défaut doivent être filtrés sur ce chemin ; il n'apporte pas d'itinéraires aux réseaux virtuels." }
    d: { en: "A 0.0.0.0/0 route on GatewaySubnet can stop the gateway from working, and it would not change the routes of the spoke VMs.", fr: "Un itinéraire 0.0.0.0/0 sur GatewaySubnet peut empêcher la passerelle de fonctionner, et il ne modifierait pas les itinéraires des machines virtuelles des spokes." }
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
