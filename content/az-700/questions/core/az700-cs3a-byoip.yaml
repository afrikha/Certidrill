id: az700-cs3a-byoip
objective: "1.1.8"
type: ordering
caseStudy: az700-cs3a-southridge
difficulty: 2
status: draft
stem:
  en: |
    You need to prepare the addresses for LB-Ingest. The solution must meet the live ingest requirements.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez préparer les adresses de LB-Ingest. La solution doit respecter les exigences de réception en direct.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: roa, text: { en: "Create a Route Origin Authorization (ROA) with RIPE NCC that authorizes ASN 8075 to originate 203.0.113.0/24.", fr: "Créer auprès du RIPE NCC une autorisation d'origine de route (ROA) qui autorise l'ASN 8075 à annoncer 203.0.113.0/24." } }
    - { id: custom, text: { en: "Create a custom IP prefix for 203.0.113.0/24 with the signed authorization message.", fr: "Créer un préfixe d'adresse IP personnalisé pour 203.0.113.0/24 avec le message d'autorisation signé." } }
    - { id: child, text: { en: "Create a public IP prefix from the custom IP prefix.", fr: "Créer un préfixe d'adresse IP publique à partir du préfixe d'adresse IP personnalisé." } }
    - { id: commission, text: { en: "Commission the custom IP prefix.", fr: "Mettre en service (Commission) le préfixe d'adresse IP personnalisé." } }
    - { id: attach, text: { en: "Associate the custom IP prefix directly with the frontend IP configuration of LB-Ingest.", fr: "Associer directement le préfixe d'adresse IP personnalisé à la configuration IP frontale de LB-Ingest." } }
    - { id: msprefix, text: { en: "Create a public IP prefix with the prefix ownership set to Microsoft owned.", fr: "Créer un préfixe d'adresse IP publique dont la propriété est définie sur Microsoft owned." } }
answer:
  sequence: [ roa, custom, child, commission ]
explanation:
  correct:
    en: Microsoft must first be authorized to advertise the range, through a ROA for ASN 8075 at the registry. You then create the custom IP prefix with the signed message; after validation it reaches the Provisioned state, in which the range isn't advertised yet. A child public IP prefix can be derived in that state, and commissioning comes last, which keeps the range unadvertised until the prefix for LB-Ingest exists.
    fr: Microsoft doit d'abord être autorisé à publier la plage, par une ROA pour l'ASN 8075 auprès du registre. Vous créez ensuite le préfixe d'adresse IP personnalisé avec le message signé ; après validation, il atteint l'état Provisioned, dans lequel la plage n'est pas encore publiée. Un préfixe d'adresse IP publique enfant peut être dérivé dans cet état, et la mise en service (Commission) vient en dernier, ce qui garde la plage non publiée jusqu'à ce que le préfixe de LB-Ingest existe.
  options:
    attach: { en: "A custom IP prefix can't be attached to a resource directly; resources use public IP addresses derived from a public IP prefix.", fr: "Un préfixe d'adresse IP personnalisé ne peut pas être attaché directement à une ressource ; les ressources utilisent des adresses IP publiques issues d'un préfixe d'adresse IP publique." }
    msprefix: { en: "A Microsoft-owned prefix comes from Azure's own ranges, not from 203.0.113.0/24, so the producers' allowlists would no longer match.", fr: "Un préfixe Microsoft owned provient des plages d'Azure, pas de 203.0.113.0/24 : les listes d'autorisation des producteurs ne correspondraient plus." }
references:
  - title: Create a custom IPv4 address prefix in Azure
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/create-custom-ip-address-prefix-portal
  - title: Custom IP address prefix (BYOIP)
    url: https://learn.microsoft.com/en-us/azure/virtual-network/ip-services/custom-ip-address-prefix
