id: az700-1c-nw-connection-troubleshoot
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A virtual machine named **VM1** cannot open a TCP 443 connection to the FQDN **api.contoso.com**. The cause could be DNS resolution, an NSG rule, a user-defined route or the guest firewall of VM1.

    You need to test the connection immediately and obtain the hop-by-hop path, the latency and the type of fault detected. You don't want to create a resource that keeps testing the connection afterwards.

    What should you use?
  fr: |
    Une machine virtuelle nommée **VM1** ne parvient pas à ouvrir une connexion TCP 443 vers le nom de domaine complet **api.contoso.com**. La cause peut être la résolution DNS, une règle NSG, un itinéraire défini par l'utilisateur ou le pare-feu invité de VM1.

    Vous devez tester la connexion immédiatement et obtenir le chemin tronçon par tronçon, la latence et le type de problème détecté. Vous ne voulez pas créer de ressource qui continue à tester la connexion ensuite.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Network Watcher IP flow verify", fr: "La vérification des flux IP de Network Watcher" }
    - id: b
      text: { en: "A Network Watcher connection monitor", fr: "Un moniteur de connexion Network Watcher" }
    - id: c
      text: { en: "Network Watcher connection troubleshoot", fr: "La résolution des problèmes de connexion de Network Watcher" }
    - id: d
      text: { en: "Network Watcher next hop", fr: "Le tronçon suivant de Network Watcher" }
answer: { optionId: c }
explanation:
  correct:
    en: Connection troubleshoot runs a point-in-time TCP or ICMP test from a VM, scale set, Bastion host or application gateway to a VM, FQDN, URI or IP address. It reports reachability, latency and the hops, with fault types such as DNSResolution, NetworkSecurityRule, UserDefinedRoute and GuestFirewall.
    fr: "La résolution des problèmes de connexion exécute un test TCP ou ICMP ponctuel depuis une machine virtuelle, un groupe identique, un hôte Bastion ou une passerelle d'application vers une machine virtuelle, un FQDN, un URI ou une adresse IP. Elle indique l'accessibilité, la latence et les tronçons, avec des types de problèmes comme DNSResolution, NetworkSecurityRule, UserDefinedRoute et GuestFirewall."
  options:
    b: { en: "Connection monitor continuously tests connectivity over time and stores the results in Log Analytics, which the requirement excludes.", fr: "Le moniteur de connexion teste la connectivité en continu et stocke les résultats dans Log Analytics, ce que l'exigence exclut." }
    a: { en: "IP flow verify only checks NSG and admin rules for a 5-tuple; it doesn't test DNS, routes or the guest firewall.", fr: "La vérification des flux IP ne contrôle que les règles NSG et d'administration pour un quintuplet ; elle ne teste ni le DNS, ni les itinéraires, ni le pare-feu invité." }
    d: { en: "Next hop only shows the routing decision for a destination IP address.", fr: "Le tronçon suivant n'indique que la décision de routage pour une adresse IP de destination." }
references:
  - title: Connection troubleshoot overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-troubleshoot-overview
