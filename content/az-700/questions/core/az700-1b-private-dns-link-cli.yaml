id: az700-1b-private-dns-link-cli
objective: "1.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a private DNS zone named **fabrikam.internal** in a resource group named **RG-DNS** of the subscription Sub1. A virtual network named **VNet2** is in the resource group RG-Spoke of the subscription Sub2. VNet2 isn't linked to any private DNS zone.

    You need to link the zone to VNet2 by running the following command from the context of Sub1. The virtual machines of VNet2 must get records in the zone automatically.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une zone DNS privée nommée **fabrikam.internal** dans un groupe de ressources nommé **RG-DNS** de l'abonnement Sub1. Un réseau virtuel nommé **VNet2** se trouve dans le groupe de ressources RG-Spoke de l'abonnement Sub2. VNet2 n'est lié à aucune zone DNS privée.

    Vous devez lier la zone à VNet2 en exécutant la commande suivante dans le contexte de Sub1. Les machines virtuelles de VNet2 doivent obtenir automatiquement des enregistrements dans la zone.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network [[grp]] create --resource-group RG-DNS \
      --zone-name fabrikam.internal --name link-vnet2 \
      --virtual-network [[vnet]] \
      [[reg]]
  slots:
    - id: grp
      options:
        - { id: pdnslink, text: private-dns link vnet }
        - { id: peering, text: vnet peering }
        - { id: pdnszone, text: private-dns zone }
        - { id: dnszone, text: dns zone }
    - id: vnet
      options:
        - { id: name, text: VNet2 }
        - { id: rid, text: /subscriptions/00000000-0000-0000-0000-000000000002/resourceGroups/RG-Spoke/providers/Microsoft.Network/virtualNetworks/VNet2 }
        - { id: prefix, text: 10.20.0.0/16 }
    - id: reg
      options:
        - { id: regtrue, text: --registration-enabled true }
        - { id: regfalse, text: --registration-enabled false }
        - { id: vnetaccess, text: --allow-vnet-access true }
answer:
  values: { grp: pdnslink, vnet: rid, reg: regtrue }
explanation:
  correct:
    en: "A virtual network link is a child resource of the private zone, created with `az network private-dns link vnet create`. A virtual network in another subscription is identified by its full resource ID, and `--registration-enabled true` makes VNet2 a registration virtual network, so its virtual machines get A records automatically."
    fr: "Un lien de réseau virtuel est une ressource enfant de la zone privée, créée avec `az network private-dns link vnet create`. Un réseau virtuel d'un autre abonnement est identifié par son ID de ressource complet, et `--registration-enabled true` fait de VNet2 un réseau virtuel d'inscription : ses machines virtuelles obtiennent automatiquement des enregistrements A."
  options:
    name: { en: "A name alone is looked up in the current subscription and resource group, where VNet2 doesn't exist.", fr: "Un nom seul est recherché dans l'abonnement et le groupe de ressources courants, où VNet2 n'existe pas." }
    regfalse: { en: "Without registration, VNet2 only resolves the zone and its virtual machines get no record.", fr: "Sans inscription, VNet2 résout seulement la zone et ses machines virtuelles n'obtiennent aucun enregistrement." }
    vnetaccess: { en: "--allow-vnet-access is a parameter of virtual network peering, not of private DNS links.", fr: "--allow-vnet-access est un paramètre du peering de réseaux virtuels, pas des liens DNS privés." }
references:
  - title: What is a virtual network link?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-virtual-network-links
  - title: Azure Private DNS FAQ
    url: https://learn.microsoft.com/en-us/azure/dns/dns-faq-private
