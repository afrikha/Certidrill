id: az700-1c-nw-traffic-analytics
objective: "1.4.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware is creating a virtual network flow log for a virtual network named **VNet-Retail** in the Azure portal. The network team wants traffic analytics insights, such as top talkers and blocked flows, to be refreshed as often as possible, and wants to write KQL queries against the processed flow data.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware crée un journal de flux de réseau virtuel pour un réseau virtuel nommé **VNet-Retail** dans le portail Azure. L'équipe réseau souhaite que les informations de traffic analytics, comme les hôtes les plus bavards et les flux bloqués, soient actualisées aussi souvent que possible, et veut écrire des requêtes KQL sur les données de flux traitées.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      On the Analytics tab, select Enable traffic analytics and set Traffic analytics processing interval to [[interval]].
      Traffic analytics writes the processed data to [[dest]].
      The KQL queries read the [[table]] table.
    fr: |
      Dans l'onglet Analytics, sélectionnez Enable traffic analytics et définissez Traffic analytics processing interval sur [[interval]].
      Traffic analytics écrit les données traitées dans [[dest]].
      Les requêtes KQL lisent la table [[table]].
  slots:
    - id: interval
      options:
        - { id: m1, text: { en: "Every 1 min", fr: "Every 1 min" } }
        - { id: m10, text: { en: "Every 10 mins", fr: "Every 10 mins" } }
        - { id: h1, text: { en: "Every 1 hour", fr: "Every 1 hour" } }
    - id: dest
      options:
        - { id: law, text: { en: "a Log Analytics workspace", fr: "un espace de travail Log Analytics" } }
        - { id: sa, text: { en: "the storage account of the flow log", fr: "le compte de stockage du journal de flux" } }
        - { id: eh, text: { en: "an event hub", fr: "un hub d'événements" } }
    - id: table
      options:
        - { id: nta, text: NTANetAnalytics }
        - { id: cl, text: AzureNetworkAnalytics_CL }
        - { id: diag, text: AzureDiagnostics }
answer:
  values: { interval: m10, dest: law, table: nta }
explanation:
  correct:
    en: "The traffic analytics processing interval can be Every 1 hour (default) or Every 10 mins, so 10 minutes is the fastest refresh. Traffic analytics reads the flow log blobs from the storage account and writes the aggregated results to the selected Log Analytics workspace. For virtual network flow logs, the main table is NTANetAnalytics, which replaces AzureNetworkAnalytics_CL used with NSG flow logs."
    fr: "L'intervalle de traitement de traffic analytics peut être Every 1 hour (par défaut) ou Every 10 mins : 10 minutes est donc l'actualisation la plus rapide. Traffic analytics lit les objets blob du journal de flux dans le compte de stockage et écrit les résultats agrégés dans l'espace de travail Log Analytics sélectionné. Pour les journaux de flux de réseau virtuel, la table principale est NTANetAnalytics, qui remplace AzureNetworkAnalytics_CL utilisée avec les journaux de flux NSG."
  options:
    m1: { en: "One minute is the interval at which flow logs are collected, not a traffic analytics processing option.", fr: "Une minute est l'intervalle de collecte des journaux de flux, pas une option de traitement de traffic analytics." }
    sa: { en: "The storage account holds the raw flow logs, not the traffic analytics results.", fr: "Le compte de stockage contient les journaux de flux bruts, pas les résultats de traffic analytics." }
    cl: { en: "AzureNetworkAnalytics_CL is the table used with NSG flow logs.", fr: "AzureNetworkAnalytics_CL est la table utilisée avec les journaux de flux NSG." }
references:
  - title: Traffic analytics schema and data aggregation
    url: https://learn.microsoft.com/en-us/azure/network-watcher/traffic-analytics-schema
  - title: Create, change, enable, disable, or delete virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-portal
