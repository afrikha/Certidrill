id: az700-1b-dns-delegate-steps
objective: "1.2.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Adatum buys the domain **adatum-travel.com** from a third-party registrar. You need internet clients to resolve the domain by using Azure DNS. The records of the domain are already prepared in a zone file that a script will import later.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum achète le domaine **adatum-travel.com** auprès d'un bureau d'enregistrement tiers. Vous devez faire en sorte que les clients Internet résolvent le domaine avec Azure DNS. Les enregistrements du domaine sont déjà préparés dans un fichier de zone qu'un script importera plus tard.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: zone, text: { en: "Create a public DNS zone named adatum-travel.com.", fr: "Créer une zone DNS publique nommée adatum-travel.com." } }
    - { id: ns, text: { en: "Note the four name servers in the NS record set at the apex of the zone.", fr: "Noter les quatre serveurs de noms du jeu d'enregistrements NS de l'apex de la zone." } }
    - { id: registrar, text: { en: "At the registrar, replace the name servers of the domain with the four Azure DNS name servers.", fr: "Auprès du bureau d'enregistrement, remplacer les serveurs de noms du domaine par les quatre serveurs de noms Azure DNS." } }
    - { id: verify, text: { en: "Run nslookup -type=SOA adatum-travel.com and check the primary name server.", fr: "Exécuter nslookup -type=SOA adatum-travel.com et vérifier le serveur de noms principal." } }
    - { id: link, text: { en: "Link the zone to the virtual network that hosts the web servers.", fr: "Lier la zone au réseau virtuel qui héberge les serveurs web." } }
    - { id: regns, text: { en: "Add the name servers of the registrar to the NS record set at the apex of the zone.", fr: "Ajouter les serveurs de noms du bureau d'enregistrement au jeu d'enregistrements NS de l'apex de la zone." } }
answer:
  sequence: [ zone, ns, registrar, verify ]
explanation:
  correct:
    en: |
      Azure DNS isn't a registrar, so you host the zone and delegate the domain to it. Creating the zone assigns four name servers, listed in the NS record set at the apex; you replace the domain's name servers with all four at the registrar, and then check the delegation with an SOA query, which returns an Azure DNS primary name server.
    fr: |
      Azure DNS n'est pas un bureau d'enregistrement : vous hébergez la zone et vous lui déléguez le domaine. La création de la zone attribue quatre serveurs de noms, répertoriés dans le jeu NS de l'apex ; vous remplacez les serveurs de noms du domaine par ces quatre serveurs auprès du bureau d'enregistrement, puis vous vérifiez la délégation avec une requête SOA, qui renvoie un serveur de noms principal Azure DNS.
  options:
    link: { en: "Virtual network links exist only for private DNS zones; a public zone answers internet clients without any link.", fr: "Les liens de réseau virtuel n'existent que pour les zones DNS privées ; une zone publique répond aux clients Internet sans lien." }
    regns: { en: "The delegation points to Azure DNS; adding the registrar's name servers would make them authoritative without hosting the records.", fr: "La délégation pointe vers Azure DNS ; ajouter les serveurs de noms du bureau d'enregistrement les rendrait faisant autorité sans qu'ils hébergent les enregistrements." }
references:
  - title: "Tutorial: Host your domain in Azure DNS"
    url: https://learn.microsoft.com/en-us/azure/dns/dns-delegate-domain-azure-dns
