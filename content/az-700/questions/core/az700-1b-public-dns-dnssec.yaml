id: az700-1b-public-dns-dnssec
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso hosts the public zone **contoso.com** in Azure DNS. The domain is delegated to the four Azure DNS name servers at the registrar.

    A security audit requires that validating DNS resolvers on the internet be able to verify that the answers for contoso.com come from the authoritative zone and weren't modified in transit.

    What should you do?
  fr: |
    Contoso héberge la zone publique **contoso.com** dans Azure DNS. Le domaine est délégué aux quatre serveurs de noms Azure DNS auprès du bureau d'enregistrement.

    Un audit de sécurité exige que les résolveurs DNS validants sur Internet puissent vérifier que les réponses pour contoso.com proviennent de la zone faisant autorité et n'ont pas été modifiées en transit.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add CAA records that list the certificate authorities allowed for contoso.com.", fr: "Ajouter des enregistrements CAA qui répertorient les autorités de certification autorisées pour contoso.com." }
    - id: b
      text: { en: "Sign the zone with DNSSEC, then add its DS record to the parent zone through the registrar.", fr: "Signer la zone avec DNSSEC, puis ajouter son enregistrement DS dans la zone parente via le bureau d'enregistrement." }
    - id: c
      text: { en: "Replace the A record sets of the zone with alias record sets that target Azure resources.", fr: "Remplacer les jeux d'enregistrements A de la zone par des jeux d'enregistrements d'alias qui ciblent des ressources Azure." }
    - id: d
      text: { en: "Create a private DNS zone named contoso.com and link it to every virtual network.", fr: "Créer une zone DNS privée nommée contoso.com et la lier à chaque réseau virtuel." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      DNSSEC adds origin authentication and data integrity to DNS answers. After you sign the zone, the parent zone must hold a DS record that matches the zone's key signing key; otherwise the chain of trust is broken and validating resolvers can't verify the answers.
    fr: |
      DNSSEC ajoute l'authentification de l'origine et l'intégrité des données aux réponses DNS. Après la signature de la zone, la zone parente doit contenir un enregistrement DS qui correspond à la clé de signature de clé de la zone ; sinon, la chaîne de confiance est rompue et les résolveurs validants ne peuvent pas vérifier les réponses.
  options:
    a: { en: "CAA records restrict which certificate authorities may issue certificates; they don't sign DNS answers.", fr: "Les enregistrements CAA limitent les autorités de certification autorisées à émettre des certificats ; ils ne signent pas les réponses DNS." }
    c: { en: "Alias records keep records in sync with Azure resources and prevent dangling records, but they add no cryptographic protection.", fr: "Les enregistrements d'alias synchronisent les enregistrements avec des ressources Azure et évitent les enregistrements orphelins, mais n'ajoutent aucune protection cryptographique." }
    d: { en: "A private zone answers only linked virtual networks; internet resolvers would still receive unsigned answers.", fr: "Une zone privée ne répond qu'aux réseaux virtuels liés ; les résolveurs Internet recevraient toujours des réponses non signées." }
references:
  - title: DNSSEC overview
    url: https://learn.microsoft.com/en-us/azure/dns/dnssec
