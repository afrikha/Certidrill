id: az700-3a-lb-floating-ip-port-reuse
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware runs two HTTPS applications, App1 and App2, on the same two virtual machines. Each application listens on TCP port 443 on its own IP address, which is configured on a loopback interface of the guest operating system.

    An internal Standard load balancer named **ILB1** has two frontend IP configurations, FE1 and FE2, and one backend pool that contains both virtual machines. The following load-balancing rule exists:

    | Rule | Frontend | Frontend port | Backend port | Floating IP |
    | --- | --- | --- | --- | --- |
    | Rule1 | FE1 | 443 | 443 | Disabled |

    You need to add a rule named Rule2 that forwards FE2:443 to port 443 of the same backend pool, so that App1 receives the traffic sent to FE1 and App2 receives the traffic sent to FE2.

    What should you do?
  fr: |
    Litware exécute deux applications HTTPS, App1 et App2, sur les deux mêmes machines virtuelles. Chaque application écoute sur le port TCP 443 de sa propre adresse IP, configurée sur une interface de bouclage du système d'exploitation invité.

    Un équilibreur de charge interne Standard nommé **ILB1** dispose de deux configurations IP frontales, FE1 et FE2, et d'un pool principal qui contient les deux machines virtuelles. La règle d'équilibrage de charge suivante existe :

    | Règle | Front-end | Port frontal | Port principal | IP flottante |
    | --- | --- | --- | --- | --- |
    | Rule1 | FE1 | 443 | 443 | Désactivée |

    Vous devez ajouter une règle nommée Rule2 qui transfère FE2:443 vers le port 443 du même pool principal, afin qu'App1 reçoive le trafic envoyé à FE1 et App2 le trafic envoyé à FE2.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace Rule1 with an HA ports rule that uses both frontends.", fr: "Remplacer Rule1 par une règle de ports HA qui utilise les deux front-ends." } }
    - { id: b, text: { en: "Set session persistence to Client IP and protocol on Rule1 and on Rule2.", fr: "Définir la persistance de session Client IP and protocol sur Rule1 et sur Rule2." } }
    - { id: c, text: { en: "Create an inbound NAT rule that maps FE2:443 to port 443 of the backend pool.", fr: "Créer une règle NAT de trafic entrant qui associe FE2:443 au port 443 du pool principal." } }
    - { id: d, text: { en: "Enable Floating IP on Rule1 and on Rule2.", fr: "Activer l'IP flottante sur Rule1 et sur Rule2." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Reusing the same backend port in several load-balancing rules requires Floating IP on those rules. With Floating IP, the VM receives packets addressed to the frontend IP (FE1 or FE2), which matches the loopback addresses used by App1 and App2. The Azure CLI reference states that Floating IP can't be changed after a rule is created, so Rule1 may have to be re-created with it enabled.
    fr: |
      La réutilisation du même port principal dans plusieurs règles d'équilibrage de charge exige l'IP flottante sur ces règles. Avec l'IP flottante, la machine virtuelle reçoit les paquets adressés à l'IP frontale (FE1 ou FE2), ce qui correspond aux adresses de bouclage utilisées par App1 et App2. La référence Azure CLI indique que l'IP flottante ne peut plus être modifiée après la création d'une règle : il faudra peut-être recréer Rule1 avec cette option activée.
  options:
    a: { en: "An HA ports rule balances all ports of one frontend; it neither separates App1 from App2 nor removes the need for Floating IP when several rules share backends.", fr: "Une règle de ports HA équilibre tous les ports d'un front-end ; elle ne sépare pas App1 d'App2 et ne dispense pas de l'IP flottante quand plusieurs règles partagent des back-ends." }
    b: { en: "Session persistence changes how flows are hashed to instances; it does not allow two rules to use the same backend port.", fr: "La persistance de session modifie la répartition des flux entre instances ; elle ne permet pas à deux règles d'utiliser le même port principal." }
    c: { en: "An inbound NAT rule forwards traffic to individual instances for port forwarding; it does not load-balance App2 across the pool.", fr: "Une règle NAT de trafic entrant transfère le trafic vers des instances individuelles (redirection de port) ; elle n'équilibre pas App2 sur le pool." }
references:
  - title: Azure Load Balancer Floating IP configuration
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-floating-ip
