id: az700-3a-usecase-service-matching
objective: "3.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind is planning four workloads. Each workload has a single region or a hybrid deployment, as described in the requirements.

    You need to recommend a service for each requirement.

    Which service should you recommend for each requirement? To answer, drag the appropriate services to the correct requirements. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind prévoit quatre charges de travail. Chacune est déployée dans une seule région ou de manière hybride, comme le décrivent les exigences.

    Vous devez recommander un service pour chaque exigence.

    Quel service devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les services appropriés vers les exigences correspondantes. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: lb, text: Azure Load Balancer }
    - { id: agw, text: Azure Application Gateway }
    - { id: tm, text: Azure Traffic Manager }
    - { id: afd, text: Azure Front Door }
    - { id: gwlb, text: { en: "Gateway Load Balancer", fr: "Équilibreur de charge de passerelle" } }
  targets:
    - id: t1
      text: { en: "Distribute syslog traffic on UDP port 514 from servers to three collector VMs in the same virtual network", fr: "Répartir le trafic syslog sur le port UDP 514 entre trois machines virtuelles collectrices du même réseau virtuel" }
    - id: t2
      text: { en: "In one Azure region, send requests for /images/* to image servers and inspect every request with a web application firewall", fr: "Dans une région Azure, envoyer les requêtes /images/* vers des serveurs d'images et inspecter chaque requête avec un pare-feu d'applications web" }
    - id: t3
      text: { en: "Fail over a non-HTTP application from an on-premises datacenter to Azure by returning the address of the healthy deployment in DNS responses", fr: "Basculer une application non HTTP d'un centre de données local vers Azure en renvoyant l'adresse du déploiement sain dans les réponses DNS" }
    - id: t4
      text: { en: "Insert a cluster of third-party firewall appliances transparently in front of an existing public Standard load balancer", fr: "Insérer de manière transparente un cluster d'appliances de pare-feu tierces devant un équilibreur de charge public Standard existant" }
answer:
  mapping: { t1: lb, t2: agw, t3: tm, t4: gwlb }
explanation:
  correct:
    en: |
      Azure Load Balancer is the regional layer 4 option for UDP traffic. Application Gateway is the regional layer 7 option with path-based routing and WAF. Traffic Manager is DNS-based and supports external (on-premises) endpoints for any protocol. Gateway Load Balancer chains third-party NVAs to a Standard public load balancer frontend. Azure Front Door is a global HTTP(S) service that none of these requirements needs.
    fr: |
      Azure Load Balancer est l'option régionale de couche 4 pour le trafic UDP. Application Gateway est l'option régionale de couche 7 avec routage basé sur le chemin et WAF. Traffic Manager repose sur le DNS et prend en charge des points de terminaison externes (locaux) pour tout protocole. L'équilibreur de charge de passerelle chaîne des NVA tierces au front-end d'un équilibreur de charge public Standard. Azure Front Door est un service HTTP(S) mondial dont aucune de ces exigences n'a besoin.
references:
  - title: Load balancing options
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/load-balancing-overview
  - title: Gateway load balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/gateway-overview
