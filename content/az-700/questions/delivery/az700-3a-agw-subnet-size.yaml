id: az700-3a-agw-subnet-size
objective: "3.2.3"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Adatum plans to deploy an Application Gateway WAF_v2 named **AGW1** with autoscaling and a maximum instance count of 125. AGW1 will have both a public and a private frontend IP configuration.

    You need to create the subnet for AGW1. The subnet must allow AGW1 to scale to its maximum instance count.

    What is the smallest subnet size that you can use?
  fr: |
    Adatum prévoit de déployer un Application Gateway WAF_v2 nommé **AGW1** avec la mise à l'échelle automatique et un nombre maximal d'instances de 125. AGW1 disposera d'une configuration IP frontale publique et d'une configuration IP frontale privée.

    Vous devez créer le sous-réseau d'AGW1. Le sous-réseau doit permettre à AGW1 d'atteindre son nombre maximal d'instances.

    Quelle est la plus petite taille de sous-réseau que vous pouvez utiliser ?
body:
  options:
    - { id: a, text: "/26" }
    - { id: b, text: "/25" }
    - { id: c, text: "/24" }
    - { id: d, text: "/23" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Each instance uses one private IP address, the private frontend uses one more, and Azure reserves five addresses per subnet, so AGW1 needs 125 + 1 + 5 = 131 addresses. A /25 provides only 128 addresses; a /24 (256 addresses) is the smallest size that fits, and it is also the minimum size that Microsoft recommends for v2 gateways that can scale to 125 instances.
    fr: |
      Chaque instance utilise une adresse IP privée, le front-end privé en utilise une de plus, et Azure réserve cinq adresses par sous-réseau : AGW1 a donc besoin de 125 + 1 + 5 = 131 adresses. Un /25 ne fournit que 128 adresses ; un /24 (256 adresses) est la plus petite taille qui convient, et c'est aussi la taille minimale recommandée par Microsoft pour les passerelles v2 pouvant aller jusqu'à 125 instances.
  options:
    a: { en: "A /26 provides 64 addresses, the minimum for a v1 gateway with up to 32 instances.", fr: "Un /26 fournit 64 adresses, le minimum pour une passerelle v1 de 32 instances au plus." }
    b: { en: "A /25 provides 128 addresses, fewer than the 131 required.", fr: "Un /25 fournit 128 adresses, moins que les 131 nécessaires." }
    d: { en: "A /23 works but is larger than necessary.", fr: "Un /23 convient, mais il est plus grand que nécessaire." }
references:
  - title: Application Gateway infrastructure configuration
    url: https://learn.microsoft.com/en-us/azure/application-gateway/configuration-infrastructure
