id: az700-3a-xregion-create-order
objective: "3.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has two regional public Standard load balancers, LB-WEU in West Europe and LB-SEA in Southeast Asia. Each one already has a backend pool of virtual machines, a health probe and a load-balancing rule for TCP port 443.

    You need to publish the application through a global load balancer that has a single anycast public IP address.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose de deux équilibreurs de charge publics Standard régionaux, LB-WEU dans West Europe et LB-SEA dans Southeast Asia. Chacun possède déjà un pool principal de machines virtuelles, une sonde d'intégrité et une règle d'équilibrage de charge pour le port TCP 443.

    Vous devez publier l'application au moyen d'un équilibreur de charge global doté d'une seule adresse IP publique anycast.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Create a load balancer with the Public type, the Standard SKU and the Global tier in a home region, with a frontend IP configuration.", fr: "Créer un équilibreur de charge de type Public, de référence SKU Standard et de niveau Global dans une région d'accueil, avec une configuration IP frontale." } }
    - { id: pool, text: { en: "Add LB-WEU and LB-SEA to the backend pool of the global load balancer.", fr: "Ajouter LB-WEU et LB-SEA au pool principal de l'équilibreur de charge global." } }
    - { id: rule, text: { en: "Create a load-balancing rule for TCP port 443 on the global load balancer.", fr: "Créer une règle d'équilibrage de charge pour le port TCP 443 sur l'équilibreur de charge global." } }
    - { id: probe, text: { en: "Create a health probe on the global load balancer for each regional load balancer.", fr: "Créer sur l'équilibreur de charge global une sonde d'intégrité pour chaque équilibreur de charge régional." } }
    - { id: upgrade, text: { en: "Change the tier of LB-WEU to Global.", fr: "Faire passer LB-WEU au niveau Global." } }
    - { id: outbound, text: { en: "Create an outbound rule on the global load balancer.", fr: "Créer une règle de trafic sortant sur l'équilibreur de charge global." } }
answer:
  sequence: [ create, pool, rule ]
explanation:
  correct:
    en: |
      You create a new Standard load balancer with the Global tier (in a home region) and its frontend, add the regional load balancers to its backend pool, and then create the load-balancing rule that links the frontend to that pool. The global load balancer checks the regional load balancers automatically every 5 seconds, based on the health probes configured on them.
    fr: |
      Vous créez un nouvel équilibreur de charge Standard de niveau Global (dans une région d'accueil) avec son front-end, vous ajoutez les équilibreurs de charge régionaux à son pool principal, puis vous créez la règle d'équilibrage de charge qui relie le front-end à ce pool. L'équilibreur de charge global vérifie automatiquement les équilibreurs de charge régionaux toutes les 5 secondes, à partir des sondes d'intégrité configurées sur ceux-ci.
  options:
    probe: { en: "The global load balancer relies on the probes of the regional load balancers; no probe is configured for it.", fr: "L'équilibreur de charge global s'appuie sur les sondes des équilibreurs de charge régionaux ; aucune sonde n'est configurée pour lui." }
    upgrade: { en: "An existing regional load balancer cannot be upgraded to the Global tier.", fr: "Un équilibreur de charge régional existant ne peut pas passer au niveau Global." }
    outbound: { en: "Global load balancers do not support outbound rules.", fr: "Les équilibreurs de charge globaux ne prennent pas en charge les règles de trafic sortant." }
references:
  - title: "Tutorial: Create an Azure Global Load Balancer"
    url: https://learn.microsoft.com/en-us/azure/load-balancer/tutorial-cross-region-portal
  - title: Global load balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/cross-region-overview
