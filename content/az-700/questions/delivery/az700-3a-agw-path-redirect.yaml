id: az700-3a-agw-path-redirect
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso publishes **www.contoso.com** through an Application Gateway Standard_v2 named **AGW1**. AGW1 has an HTTPS listener on port 443 and three backend pools: ApiPool, ImagePool and DefaultPool.

    You need to configure AGW1 to meet the following requirements:

    - Requests for /api/* go to ApiPool, requests for /images/* go to ImagePool, and all other requests go to DefaultPool.
    - Requests sent to http://www.contoso.com on port 80 are sent back to the client with an instruction to use https://www.contoso.com.

    Which two features should you configure? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso publie **www.contoso.com** au moyen d'un Application Gateway Standard_v2 nommé **AGW1**. AGW1 dispose d'un écouteur HTTPS sur le port 443 et de trois pools principaux : ApiPool, ImagePool et DefaultPool.

    Vous devez configurer AGW1 pour répondre aux exigences suivantes :

    - Les requêtes /api/* vont vers ApiPool, les requêtes /images/* vers ImagePool, et toutes les autres requêtes vers DefaultPool.
    - Les requêtes envoyées à http://www.contoso.com sur le port 80 sont renvoyées au client avec l'instruction d'utiliser https://www.contoso.com.

    Quelles sont les deux fonctionnalités à configurer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A path-based routing rule with a URL path map", fr: "Une règle de routage basée sur le chemin avec un mappage de chemins d'URL" } }
    - { id: b, text: { en: "Multi-site listeners for each backend pool", fr: "Des écouteurs multisites pour chaque pool principal" } }
    - { id: c, text: { en: "Cookie-based affinity in the backend settings", fr: "L'affinité basée sur les cookies dans les paramètres de back-end" } }
    - { id: d, text: { en: "A redirection from an HTTP listener on port 80 to the HTTPS listener", fr: "Une redirection d'un écouteur HTTP sur le port 80 vers l'écouteur HTTPS" } }
    - { id: e, text: { en: "A rewrite rule set that adds an X-Forwarded-Proto request header", fr: "Un ensemble de règles de réécriture qui ajoute un en-tête de requête X-Forwarded-Proto" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A path-based rule uses a URL path map to send /api/* and /images/* to specific pools, with a default pool for other paths. Redirection lets the gateway answer HTTP requests with a redirect to the HTTPS listener, the usual way to enforce HTTPS.
    fr: |
      Une règle basée sur le chemin utilise un mappage de chemins d'URL pour envoyer /api/* et /images/* vers des pools précis, avec un pool par défaut pour les autres chemins. La redirection permet à la passerelle de répondre aux requêtes HTTP par une redirection vers l'écouteur HTTPS, méthode habituelle pour imposer HTTPS.
  options:
    b: { en: "Multi-site listeners route by host name; here all requests use the same host name and differ by path.", fr: "Les écouteurs multisites routent selon le nom d'hôte ; ici, toutes les requêtes utilisent le même nom d'hôte et ne diffèrent que par le chemin." }
    c: { en: "Cookie-based affinity keeps a user on the same backend server; it neither routes by path nor redirects.", fr: "L'affinité basée sur les cookies maintient un utilisateur sur le même serveur principal ; elle ne route pas selon le chemin et ne redirige pas." }
    e: { en: "Adding a header informs the backend of the original protocol, but the client is not redirected to HTTPS.", fr: "L'ajout d'un en-tête informe le back-end du protocole d'origine, mais le client n'est pas redirigé vers HTTPS." }
references:
  - title: Azure Application Gateway features
    url: https://learn.microsoft.com/en-us/azure/application-gateway/features
