id: az700-cs3a-private-origin
objective: "3.3.9"
type: ordering
caseStudy: az700-cs3a-southridge
difficulty: 2
status: draft
stem:
  en: |
    You deploy the entry point for the catalog website. You need to add ILB-WE as an origin while meeting the requirement for the web VMs.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous déployez le point d'entrée du site de catalogue. Vous devez ajouter ILB-WE comme origine tout en respectant l'exigence relative aux machines virtuelles web.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: pls, text: { en: "Create a Private Link service that uses the frontend IP configuration of ILB-WE.", fr: "Créer un service Private Link qui utilise la configuration IP frontale d'ILB-WE." } }
    - { id: origin, text: { en: "Add an origin with **Private link** enabled that targets the Private Link service.", fr: "Ajouter une origine avec **Private link** activé qui cible le service Private Link." } }
    - { id: approve, text: { en: "Approve the pending private endpoint connection on the Private Link service.", fr: "Approuver la connexion de point de terminaison privé en attente sur le service Private Link." } }
    - { id: pe, text: { en: "Create a private endpoint for the Front Door profile in VNet-WE.", fr: "Créer un point de terminaison privé pour le profil Front Door dans VNet-WE." } }
    - { id: zone, text: { en: "Create a private DNS zone named privatelink.azurefd.net and link it to VNet-WE.", fr: "Créer une zone DNS privée nommée privatelink.azurefd.net et la lier à VNet-WE." } }
    - { id: pip, text: { en: "Add an origin whose host name is the private IP address of ILB-WE, with **Private link** left disabled.", fr: "Ajouter une origine dont le nom d'hôte est l'adresse IP privée d'ILB-WE, en laissant **Private link** désactivé." } }
answer:
  sequence: [ pls, origin, approve ]
explanation:
  correct:
    en: Front Door Premium reaches an internal load balancer through a Private Link service, so you create the service on the frontend of ILB-WE first. You then add the origin with Private link enabled; Front Door creates a managed private endpoint and sends a connection request, which stays pending until you approve it on the Private Link service. Private and public origins can't share an origin group.
    fr: Front Door Premium atteint un équilibreur de charge interne par un service Private Link ; vous créez donc d'abord ce service sur la configuration frontale d'ILB-WE. Vous ajoutez ensuite l'origine avec Private link activé ; Front Door crée un point de terminaison privé managé et envoie une demande de connexion, qui reste en attente jusqu'à ce que vous l'approuviez sur le service Private Link. Des origines privées et publiques ne peuvent pas partager un groupe d'origines.
  options:
    pe: { en: "Front Door creates and manages its private endpoint itself; you don't deploy one in your virtual network.", fr: "Front Door crée et gère lui-même son point de terminaison privé ; vous n'en déployez pas dans votre réseau virtuel." }
    zone: { en: "No private DNS zone is needed: Front Door connects to the Private Link service selected on the origin, and viewers keep using public DNS.", fr: "Aucune zone DNS privée n'est nécessaire : Front Door se connecte au service Private Link sélectionné sur l'origine, et les spectateurs continuent d'utiliser le DNS public." }
    pip: { en: "Without Private Link, Front Door connects to origins over the internet and can't reach a private IP address in VNet-WE.", fr: "Sans Private Link, Front Door se connecte aux origines par Internet et ne peut pas atteindre une adresse IP privée de VNet-WE." }
references:
  - title: Connect Azure Front Door Premium to an internal load balancer origin with Private Link
    url: https://learn.microsoft.com/en-us/azure/frontdoor/standard-premium/how-to-enable-private-link-internal-load-balancer
