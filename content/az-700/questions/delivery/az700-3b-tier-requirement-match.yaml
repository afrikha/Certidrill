id: az700-3b-tier-requirement-match
objective: "3.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum plans four Azure Front Door profiles. Each profile has one requirement, listed in the answer area.

    You need to choose a tier for each profile. The solution must minimize cost.

    Which tier should you choose for each profile? To answer, drag the appropriate tiers to the correct requirements. Each tier may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit quatre profils Azure Front Door. Chaque profil a une exigence, listée dans la zone de réponse.

    Vous devez choisir un niveau pour chaque profil. La solution doit réduire les coûts au minimum.

    Quel niveau devez-vous choisir pour chaque profil ? Pour répondre, faites glisser les niveaux appropriés vers les exigences correspondantes. Chaque niveau peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: std, text: Standard }
    - { id: prem, text: Premium }
  targets:
    - id: t1
      text: { en: "Block requests from specific countries with a WAF custom rule.", fr: "Bloquer les requêtes de certains pays avec une règle WAF personnalisée." }
    - id: t2
      text: { en: "Reach an App Service origin whose public network access is disabled.", fr: "Joindre une origine App Service dont l'accès réseau public est désactivé." }
    - id: t3
      text: { en: "Detect and block bad bots based on Microsoft Threat Intelligence.", fr: "Détecter et bloquer les bots malveillants à partir de Microsoft Threat Intelligence." }
    - id: t4
      text: { en: "Compress text files at the edge and purge cached content on demand.", fr: "Compresser les fichiers texte en périphérie et purger le contenu mis en cache à la demande." }
answer:
  mapping: { t1: std, t2: prem, t3: prem, t4: std }
explanation:
  correct:
    en: Geo-filtering custom rules, caching, compression and purge are available in both tiers, so Standard is enough. Private Link connections to an origin without public access and the bot protection rule set require Premium.
    fr: "Les règles personnalisées de filtrage géographique, la mise en cache, la compression et la purge sont disponibles dans les deux niveaux : Standard suffit. Les connexions Private Link vers une origine sans accès public et l'ensemble de règles de protection contre les bots exigent Premium."
references:
  - title: Comparison between Azure Front Door and Azure Content Delivery Network
    url: https://learn.microsoft.com/en-us/azure/frontdoor/standard-premium/tier-comparison
