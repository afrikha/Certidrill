id: az700-3a-sku-web-tier-zones
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware is deploying an internet-facing web tier on virtual machines spread across three availability zones in the North Europe region.

    You need to deploy a load balancer for the web tier. The solution must meet the following requirements:

    - The frontend IP address must remain available if one availability zone fails.
    - The load balancer must be covered by an SLA.
    - Inbound access must be controlled by network security groups.

    Which load balancer SKU and tier should you deploy?
  fr: |
    Proseware déploie un niveau web exposé à Internet sur des machines virtuelles réparties sur trois zones de disponibilité de la région North Europe.

    Vous devez déployer un équilibreur de charge pour le niveau web. La solution doit répondre aux exigences suivantes :

    - L'adresse IP frontale doit rester disponible en cas de défaillance d'une zone de disponibilité.
    - L'équilibreur de charge doit être couvert par un contrat SLA.
    - L'accès entrant doit être contrôlé par des groupes de sécurité réseau.

    Quelle référence SKU et quel niveau d'équilibreur de charge devez-vous déployer ?
body:
  options:
    - { id: a, text: { en: "Standard SKU, Global tier", fr: "Référence SKU Standard, niveau Global" } }
    - { id: b, text: { en: "Gateway SKU", fr: "Référence SKU Gateway" } }
    - { id: c, text: { en: "Standard SKU, Regional tier", fr: "Référence SKU Standard, niveau Regional" } }
    - { id: d, text: { en: "Basic SKU", fr: "Référence SKU Basic" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A regional Standard load balancer supports zone-redundant frontend IP configurations, has an SLA, and is closed to inbound traffic unless a network security group allows it. It balances traffic directly to VMs or scale set instances in one virtual network.
    fr: |
      Un équilibreur de charge Standard régional prend en charge les configurations IP frontales redondantes interzones, bénéficie d'un contrat SLA et refuse le trafic entrant tant qu'un groupe de sécurité réseau ne l'autorise pas. Il répartit le trafic directement vers des machines virtuelles ou des instances de groupe identique d'un même réseau virtuel.
  options:
    a: { en: "The Global tier distributes traffic across regional load balancers in several regions; its backend pool cannot contain VMs.", fr: "Le niveau Global répartit le trafic entre des équilibreurs de charge régionaux de plusieurs régions ; son pool principal ne peut pas contenir de machines virtuelles." }
    b: { en: "The Gateway SKU inserts network virtual appliances in the path of another load balancer; its frontend is private only.", fr: "La référence SKU Gateway insère des appliances virtuelles réseau dans le chemin d'un autre équilibreur de charge ; son front-end est uniquement privé." }
    d: { en: "The Basic SKU was retired on September 30, 2025, and never supported availability zones or an SLA.", fr: "La référence SKU Basic a été mise hors service le 30 septembre 2025 et n'a jamais pris en charge les zones de disponibilité ni de contrat SLA." }
references:
  - title: Azure Load Balancer SKUs
    url: https://learn.microsoft.com/en-us/azure/load-balancer/skus
