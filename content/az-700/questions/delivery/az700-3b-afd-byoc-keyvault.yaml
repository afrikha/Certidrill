id: az700-3b-afd-byoc-keyvault
objective: "3.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Front Door Premium profile named **afd-fabrikam** in a subscription named **Sub-Web**. Fabrikam's security policy requires the certificate of **shop.fabrikam.com** to be issued by its public certificate authority and stored in Azure Key Vault. The certificate must be renewed in Key Vault without any change in Front Door.

    You plan to use this certificate for the custom domain shop.fabrikam.com.

    Which two requirements must the certificate and the key vault meet?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un profil Azure Front Door Premium nommé **afd-fabrikam** dans un abonnement nommé **Sub-Web**. La stratégie de sécurité de Fabrikam exige que le certificat de **shop.fabrikam.com** soit émis par son autorité de certification publique et stocké dans Azure Key Vault. Le certificat doit être renouvelé dans Key Vault sans aucune modification dans Front Door.

    Vous prévoyez d'utiliser ce certificat pour le domaine personnalisé shop.fabrikam.com.

    Quelles sont les deux exigences auxquelles le certificat et le coffre de clés doivent satisfaire ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The key vault is in the same Azure region as the origins of afd-fabrikam.", fr: "Le coffre de clés se trouve dans la même région Azure que les origines d'afd-fabrikam." } }
    - { id: b, text: { en: "The key vault is in Sub-Web.", fr: "Le coffre de clés se trouve dans Sub-Web." } }
    - { id: c, text: { en: "The secret version selected in Front Door is the current version of the certificate.", fr: "La version de secret sélectionnée dans Front Door est la version actuelle du certificat." } }
    - { id: d, text: { en: "The certificate uses an RSA key rather than an elliptic curve key.", fr: "Le certificat utilise une clé RSA plutôt qu'une clé à courbe elliptique." } }
    - { id: e, text: { en: "The certificate contains only the leaf certificate, without intermediate certificates.", fr: "Le certificat ne contient que le certificat feuille, sans certificats intermédiaires." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Front Door can only use a key vault in the same subscription as the profile; selecting a vault in another subscription fails. Certificates that use elliptic curve cryptography aren't supported. The certificate must also contain a complete chain, and the secret version must be set to Latest for renewals to be picked up automatically.
    fr: "Front Door ne peut utiliser qu'un coffre de clés situé dans le même abonnement que le profil ; la sélection d'un coffre d'un autre abonnement échoue. Les certificats qui utilisent la cryptographie à courbe elliptique ne sont pas pris en charge. Le certificat doit aussi contenir une chaîne complète, et la version de secret doit être Latest pour que les renouvellements soient pris en compte automatiquement."
  options:
    a: { en: "Front Door is a global service; no region requirement applies to the key vault.", fr: "Front Door est un service mondial ; aucune exigence de région ne s'applique au coffre de clés." }
    c: { en: "A specific version disables automatic rotation; select Latest instead.", fr: "Une version précise désactive la rotation automatique ; sélectionnez plutôt Latest." }
    e: { en: "The certificate must include the leaf and intermediate certificates, chaining to a trusted root.", fr: "Le certificat doit inclure le certificat feuille et les intermédiaires, jusqu'à une racine approuvée." }
references:
  - title: Configure HTTPS on an Azure Front Door custom domain
    url: https://learn.microsoft.com/en-us/azure/frontdoor/standard-premium/how-to-configure-https-custom-domain
  - title: TLS encryption with Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/frontdoor/end-to-end-tls
