id: az700-3b-rule-type-match
objective: "3.2.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are configuring the routing rules of an Application Gateway Standard_v2 named **AGW1**. Each listener has one rule.

    Which rule configuration should you use for each requirement? To answer, drag the appropriate configurations to the correct requirements. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez les règles de routage d'un Application Gateway Standard_v2 nommé **AGW1**. Chaque écouteur a une seule règle.

    Quelle configuration de règle devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les configurations appropriées vers les exigences correspondantes. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: basic, text: { en: "Basic rule with a backend pool", fr: "Règle de base avec un pool principal" } }
    - { id: path, text: { en: "Path-based rule with a URL path map", fr: "Règle basée sur le chemin avec un mappage de chemins d'URL" } }
    - { id: redlistener, text: { en: "Redirection to a listener", fr: "Redirection vers un écouteur" } }
    - { id: redexternal, text: { en: "Redirection to an external site", fr: "Redirection vers un site externe" } }
    - { id: rewrite, text: { en: "Rewrite set with a URL path rewrite", fr: "Ensemble de réécriture avec une réécriture du chemin d'URL" } }
  targets:
    - id: t1
      text: { en: "All requests received by lst-api go to pool-api.", fr: "Toutes les requêtes reçues par lst-api vont vers pool-api." }
    - id: t2
      text: { en: "Requests for /video/* go to pool-video and all other requests go to pool-web.", fr: "Les requêtes pour /video/* vont vers pool-video et toutes les autres vers pool-web." }
    - id: t3
      text: { en: "Clients that request old.contoso.com are sent to https://www.fabrikam.com.", fr: "Les clients qui demandent old.contoso.com sont envoyés vers https://www.fabrikam.com." }
    - id: t4
      text: { en: "Clients that connect on HTTP port 80 are sent to the HTTPS listener of the same site.", fr: "Les clients qui se connectent sur le port HTTP 80 sont envoyés vers l'écouteur HTTPS du même site." }
answer:
  mapping: { t1: basic, t2: path, t3: redexternal, t4: redlistener }
explanation:
  correct:
    en: A basic rule sends every request of its listener to one pool. A path-based rule uses a URL path map with path rules and a default pool. Redirection replaces the backend target and sends the client either to another listener, the usual HTTP to HTTPS pattern, or to an external site.
    fr: "Une règle de base envoie toutes les requêtes de son écouteur vers un seul pool. Une règle basée sur le chemin utilise un mappage de chemins d'URL avec des règles de chemin et un pool par défaut. La redirection remplace la cible de back-end et envoie le client soit vers un autre écouteur, schéma habituel de HTTP vers HTTPS, soit vers un site externe."
  options:
    rewrite: { en: "A URL rewrite changes the path sent to the backend without the client knowing; it does not send the client elsewhere or choose a pool by itself.", fr: "Une réécriture d'URL modifie le chemin envoyé au back-end à l'insu du client ; elle n'envoie pas le client ailleurs et ne choisit pas un pool à elle seule." }
references:
  - title: Application Gateway redirect overview
    url: https://learn.microsoft.com/en-us/azure/application-gateway/redirect-overview
  - title: URL Path Based Routing overview
    url: https://learn.microsoft.com/en-us/azure/application-gateway/url-route-overview
