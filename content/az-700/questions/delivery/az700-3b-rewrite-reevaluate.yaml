id: az700-3b-rewrite-reevaluate
objective: "3.2.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Application Gateway Standard_v2 named **AGW1** has a path-based routing rule named **rule-api**. Its URL path map sends `/v2/*` to **pool-v2**, and its default backend pool is **pool-v1**.

    A rewrite set associated with rule-api contains a URL rewrite rule that changes the path of requests from `/legacy/orders` to `/v2/orders`. The servers of pool-v1 receive the rewritten requests for `/v2/orders`, which they cannot serve.

    You need the rewritten requests to be served by pool-v2.

    What should you do?
  fr: |
    Un Application Gateway Standard_v2 nommé **AGW1** possède une règle de routage basée sur le chemin nommée **rule-api**. Son mappage de chemins d'URL envoie `/v2/*` vers **pool-v2**, et son pool principal par défaut est **pool-v1**.

    Un ensemble de réécriture associé à rule-api contient une règle de réécriture d'URL qui remplace le chemin des requêtes `/legacy/orders` par `/v2/orders`. Les serveurs de pool-v1 reçoivent les requêtes réécrites pour `/v2/orders`, qu'ils ne peuvent pas servir.

    Les requêtes réécrites doivent être servies par pool-v2.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable Re-evaluate path map in the URL rewrite action.", fr: "Activer Réévaluer le mappage de chemins dans l'action de réécriture d'URL." } }
    - { id: b, text: { en: "Set the rule sequence of the URL rewrite rule to 1.", fr: "Définir la séquence de la règle de réécriture d'URL sur 1." } }
    - { id: c, text: { en: "Set Override backend path to /v2/ in the backend settings of pool-v1.", fr: "Définir Remplacer le chemin du back-end sur /v2/ dans les paramètres de back-end de pool-v1." } }
    - { id: d, text: { en: "Lower the priority number of rule-api.", fr: "Diminuer le numéro de priorité de rule-api." } }
answer: { optionId: a }
explanation:
  correct:
    en: By default, the path map is matched on the original URL path, so `/legacy/orders` falls to the default pool even after the rewrite. With Re-evaluate path map enabled, the gateway matches the rewritten path against the path map and routes `/v2/orders` to pool-v2. This option is available on path-based rules, not on basic rules.
    fr: "Par défaut, le mappage de chemins est comparé au chemin d'URL d'origine : `/legacy/orders` tombe donc dans le pool par défaut même après la réécriture. Avec Réévaluer le mappage de chemins activé, la passerelle compare le chemin réécrit au mappage et route `/v2/orders` vers pool-v2. Cette option est disponible sur les règles basées sur le chemin, pas sur les règles de base."
  options:
    b: { en: "The sequence orders rewrite rules within the set; the pool is still chosen from the original path.", fr: "La séquence ordonne les règles de réécriture de l'ensemble ; le pool reste choisi à partir du chemin d'origine." }
    c: { en: "Override backend path changes the path sent to pool-v1 but never changes the pool.", fr: "Remplacer le chemin du back-end modifie le chemin envoyé à pool-v1 mais ne change jamais le pool." }
    d: { en: "Rule priority orders listeners; rule-api is already the rule that processes these requests.", fr: "La priorité des règles ordonne les écouteurs ; rule-api est déjà la règle qui traite ces requêtes." }
references:
  - title: Rewrite HTTP headers and URL with Application Gateway
    url: https://learn.microsoft.com/en-us/azure/application-gateway/rewrite-http-headers-url
