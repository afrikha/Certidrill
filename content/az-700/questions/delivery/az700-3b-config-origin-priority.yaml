id: az700-3b-config-origin-priority
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Azure Front Door Premium profile has an origin group named **og-web** whose latency sensitivity is set to 1000 milliseconds. og-web contains the following origins:

    | Origin | Region | Priority | Weight | Health |
    | --- | --- | --- | --- | --- |
    | app-we | West Europe | 1 | 50 | Healthy |
    | app-ne | North Europe | 2 | 50 | Healthy |

    All the traffic goes to app-we. You need both origins to receive about the same share of the traffic while both are healthy.

    What should you do?
  fr: |
    Un profil Azure Front Door Premium possède un groupe d'origines nommé **og-web** dont la sensibilité de latence est définie sur 1000 millisecondes. og-web contient les origines suivantes :

    | Origine | Région | Priorité | Poids | Intégrité |
    | --- | --- | --- | --- | --- |
    | app-we | West Europe | 1 | 50 | Saine |
    | app-ne | North Europe | 2 | 50 | Saine |

    Tout le trafic va vers app-we. Les deux origines doivent recevoir à peu près la même part du trafic tant qu'elles sont saines.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the weight of app-we to 25.", fr: "Définir le poids d'app-we sur 25." } }
    - { id: b, text: { en: "Set the latency sensitivity of og-web to 0 milliseconds.", fr: "Définir la sensibilité de latence d'og-web sur 0 milliseconde." } }
    - { id: c, text: { en: "Enable session affinity on og-web.", fr: "Activer l'affinité de session sur og-web." } }
    - { id: d, text: { en: "Set the priority of app-ne to 1.", fr: "Définir la priorité d'app-ne sur 1." } }
answer: { optionId: d }
explanation:
  correct:
    en: Front Door first keeps the healthy origins, then only the ones with the lowest priority value, then the ones within the latency sensitivity, and only then splits traffic by weight. app-ne has priority 2, so it is a standby origin and its weight never applies. With both origins at priority 1 and a latency sensitivity of 1000 ms, the equal weights split the traffic.
    fr: "Front Door conserve d'abord les origines saines, puis seulement celles de valeur de priorité la plus faible, puis celles qui sont dans la sensibilité de latence, et ensuite seulement répartit le trafic selon les poids. app-ne a la priorité 2 : c'est une origine de secours et son poids ne s'applique jamais. Avec les deux origines en priorité 1 et une sensibilité de latence de 1000 ms, les poids égaux répartissent le trafic."
  options:
    a: { en: "Weights only split traffic among origins of the same priority; app-ne stays on standby.", fr: "Les poids ne répartissent le trafic qu'entre origines de même priorité ; app-ne reste en secours." }
    b: { en: "A latency sensitivity of 0 ms sends traffic only to the fastest origin, and app-ne would still be excluded by its priority.", fr: "Une sensibilité de latence de 0 ms n'envoie le trafic qu'à l'origine la plus rapide, et app-ne resterait exclue par sa priorité." }
    c: { en: "Session affinity keeps users on the first origin selected; it does not add app-ne to the selection.", fr: "L'affinité de session maintient les utilisateurs sur la première origine choisie ; elle n'ajoute pas app-ne à la sélection." }
references:
  - title: Traffic routing methods for origins
    url: https://learn.microsoft.com/en-us/azure/frontdoor/routing-methods
