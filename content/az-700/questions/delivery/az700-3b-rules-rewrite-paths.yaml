id: az700-3b-rules-rewrite-paths
objective: "3.3.8"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    An Azure Front Door Standard route for **www.contoso.com** has the pattern to match `/*`. A rule set associated with the route contains two rules, each with a URL rewrite action:

    | Rule | Condition | Source pattern | Destination | Preserve unmatched path |
    | --- | --- | --- | --- | --- |
    | rw-assets | Request path begins with `assets/` | /assets/ | /static/ | Yes |
    | rw-promo | Request path begins with `promo/` | /promo/ | /campaign/index.html | No |

    A user browses to the URLs in the answer area. Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un itinéraire Azure Front Door Standard pour **www.contoso.com** a le modèle de correspondance `/*`. Un ensemble de règles associé à l'itinéraire contient deux règles, chacune avec une action de réécriture d'URL :

    | Règle | Condition | Modèle source | Destination | Conserver le chemin sans correspondance |
    | --- | --- | --- | --- | --- |
    | rw-assets | Le chemin de la requête commence par `assets/` | /assets/ | /static/ | Oui |
    | rw-promo | Le chemin de la requête commence par `promo/` | /promo/ | /campaign/index.html | Non |

    Un utilisateur accède aux URL de la zone de réponse. Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Path received by the origin for https://www.contoso.com/assets/img/logo.png: [[p1]]

      Path received by the origin for https://www.contoso.com/promo/summer/day1: [[p2]]

      URL displayed by the browser after it requests https://www.contoso.com/promo/summer/day1: [[p3]]
    fr: |
      Chemin reçu par l'origine pour https://www.contoso.com/assets/img/logo.png : [[p1]]

      Chemin reçu par l'origine pour https://www.contoso.com/promo/summer/day1 : [[p2]]

      URL affichée par le navigateur après sa requête vers https://www.contoso.com/promo/summer/day1 : [[p3]]
  slots:
    - id: p1
      options:
        - { id: static, text: /static/img/logo.png }
        - { id: staticassets, text: /static/assets/img/logo.png }
        - { id: staticroot, text: /static/ }
        - { id: original, text: /assets/img/logo.png }
    - id: p2
      options:
        - { id: index, text: /campaign/index.html }
        - { id: indexpath, text: /campaign/index.html/summer/day1 }
        - { id: original, text: /promo/summer/day1 }
        - { id: campaign, text: /campaign/summer/day1 }
    - id: p3
      options:
        - { id: originalurl, text: "https://www.contoso.com/promo/summer/day1" }
        - { id: rewritten, text: "https://www.contoso.com/campaign/index.html" }
        - { id: rewrittenpath, text: "https://www.contoso.com/campaign/summer/day1" }
answer:
  values: { p1: static, p2: index, p3: originalurl }
explanation:
  correct:
    en: "The source pattern is a prefix match: with Preserve unmatched path set to Yes, the part after `/assets/` is appended to the destination, giving `/static/img/logo.png`. With No (the default), the unmatched path is dropped and the origin receives only `/campaign/index.html`. A URL rewrite happens between Front Door and the origin, so the browser keeps displaying the URL it requested; only a URL redirect changes it."
    fr: "Le modèle source est une correspondance de préfixe : avec Conserver le chemin sans correspondance sur Oui, la partie située après `/assets/` est ajoutée à la destination, ce qui donne `/static/img/logo.png`. Avec Non (la valeur par défaut), le chemin sans correspondance est supprimé et l'origine ne reçoit que `/campaign/index.html`. Une réécriture d'URL a lieu entre Front Door et l'origine : le navigateur continue d'afficher l'URL qu'il a demandée ; seule une redirection d'URL la modifie."
references:
  - title: URL rewrite
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-url-rewrite
