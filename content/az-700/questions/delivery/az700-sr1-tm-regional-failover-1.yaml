id: az700-sr1-tm-regional-failover-1
objective: "3.1.7"
type: series_yesno
series: az700-sr1-tm-regional-failover
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: |
    You create a Geographic parent profile whose endpoints are two Priority child profiles.
  fr: |
    Vous créez un profil parent Geographic dont les points de terminaison sont deux profils enfants Priority.
body:
  solution:
    en: |
      You create two Traffic Manager profiles that use the **Priority** routing method: **TM-EU** (App-WE priority 1, App-EUS priority 2) and **TM-Other** (App-EUS priority 1, App-WE priority 2). You create a parent profile that uses the **Geographic** routing method, with a nested endpoint for TM-EU mapped to **Europe** and a nested endpoint for TM-Other mapped to **World**.
    fr: |
      Vous créez deux profils Traffic Manager qui utilisent la méthode de routage **Priority** : **TM-EU** (App-WE priorité 1, App-EUS priorité 2) et **TM-Other** (App-EUS priorité 1, App-WE priorité 2). Vous créez un profil parent qui utilise la méthode de routage **Geographic**, avec un point de terminaison imbriqué pour TM-EU associé à **Europe** et un point de terminaison imbriqué pour TM-Other associé à **World**.
answer: { value: true }
explanation:
  correct:
    en: |
      The Geographic parent sends queries from Europe to TM-EU and every other location to TM-Other, because World catches any location that isn't mapped more specifically. Each child profile uses Priority routing, so it returns its primary deployment while it's healthy and fails over to the other deployment when it isn't. Nested child profiles with at least two endpoints are the recommended way to add failover to Geographic routing.
    fr: |
      Le parent Geographic envoie les requêtes venant d'Europe vers TM-EU et toutes les autres provenances vers TM-Other, car World couvre tout emplacement qui n'est pas associé de façon plus précise. Chaque profil enfant utilise le routage Priority : il renvoie son déploiement principal tant que celui-ci est intègre et bascule vers l'autre déploiement dans le cas contraire. Des profils enfants imbriqués comportant au moins deux points de terminaison sont la méthode recommandée pour ajouter un basculement au routage Geographic.
references:
  - title: Traffic Manager routing methods
    url: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-routing-methods
