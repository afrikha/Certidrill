id: az700-3b-rules-override-order
objective: "3.3.8"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An Azure Front Door Standard endpoint has one route, **route-web** (`/*`), that sends all the traffic to an origin group named **og-web**. A new App Service app named **app-mobile** must serve the requests whose User-Agent identifies the Contoso mobile app; all other requests must still reach og-web.

    You must meet the requirement by using a rule set. You must not create new routes.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un point de terminaison Azure Front Door Standard possède un itinéraire, **route-web** (`/*`), qui envoie tout le trafic vers un groupe d'origines nommé **og-web**. Une nouvelle application App Service nommée **app-mobile** doit servir les requêtes dont l'en-tête User-Agent identifie l'application mobile Contoso ; toutes les autres requêtes doivent toujours atteindre og-web.

    Vous devez répondre à l'exigence au moyen d'un ensemble de règles. Vous ne devez pas créer de nouveaux itinéraires.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: og, text: { en: "Create an origin group named og-mobile that contains app-mobile.", fr: "Créer un groupe d'origines nommé og-mobile qui contient app-mobile." } }
    - { id: ruleset, text: { en: "Create a rule set with a rule whose condition matches the User-Agent request header and whose action is a route configuration override to og-mobile.", fr: "Créer un ensemble de règles avec une règle dont la condition porte sur l'en-tête de requête User-Agent et dont l'action est un remplacement de la configuration d'itinéraire vers og-mobile." } }
    - { id: assoc, text: { en: "Associate the rule set with route-web.", fr: "Associer l'ensemble de règles à route-web." } }
    - { id: addorigin, text: { en: "Add app-mobile as an origin of og-web with priority 1.", fr: "Ajouter app-mobile comme origine d'og-web avec la priorité 1." } }
    - { id: waf, text: { en: "Create a WAF custom rule that matches the User-Agent header and allows the request.", fr: "Créer une règle WAF personnalisée qui porte sur l'en-tête User-Agent et autorise la requête." } }
    - { id: endpoint, text: { en: "Create a second endpoint for the mobile app.", fr: "Créer un second point de terminaison pour l'application mobile." } }
answer:
  sequence: [ og, ruleset, assoc ]
explanation:
  correct:
    en: The route configuration override action selects an existing origin group, so og-mobile must exist before the rule is written. The rule set takes effect only once it is associated with a route; for matching requests the origin group set by the rules engine overrides the route's origin group, and other requests keep using og-web.
    fr: "L'action de remplacement de la configuration d'itinéraire sélectionne un groupe d'origines existant : og-mobile doit donc exister avant l'écriture de la règle. L'ensemble de règles ne s'applique qu'une fois associé à un itinéraire ; pour les requêtes qui correspondent, le groupe d'origines défini par le moteur de règles remplace celui de l'itinéraire, et les autres requêtes continuent d'utiliser og-web."
  options:
    addorigin: { en: "Origins of one group share the traffic of every request; the User-Agent would not be taken into account.", fr: "Les origines d'un même groupe se partagent le trafic de toutes les requêtes ; l'en-tête User-Agent ne serait pas pris en compte." }
    waf: { en: "A WAF rule allows or blocks requests; it does not choose an origin group.", fr: "Une règle WAF autorise ou bloque des requêtes ; elle ne choisit pas de groupe d'origines." }
    endpoint: { en: "A new endpoint would need its own route and host name, which the requirement excludes.", fr: "Un nouveau point de terminaison exigerait son propre itinéraire et son propre nom d'hôte, ce que l'exigence exclut." }
references:
  - title: What is a rule set in Azure Front Door?
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-rules-engine
  - title: Traffic routing methods for origins
    url: https://learn.microsoft.com/en-us/azure/frontdoor/routing-methods
