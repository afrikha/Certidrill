id: az700-3a-pubint-two-tier
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind is deploying a two-tier application in a virtual network named **VNet1**:

    | Tier | Subnet | Clients |
    | --- | --- | --- |
    | Web | WebSubnet | Users on the internet |
    | Business logic | AppSubnet | Web tier VMs only |

    Each tier runs on three virtual machines and uses a non-HTTP TCP protocol between tiers. You need to load-balance both tiers. The business logic tier must not be reachable from the internet.

    Which load balancers should you deploy?
  fr: |
    Northwind déploie une application à deux niveaux dans un réseau virtuel nommé **VNet1** :

    | Niveau | Sous-réseau | Clients |
    | --- | --- | --- |
    | Web | WebSubnet | Utilisateurs sur Internet |
    | Logique métier | AppSubnet | Machines virtuelles du niveau web uniquement |

    Chaque niveau s'exécute sur trois machines virtuelles, et les niveaux communiquent par un protocole TCP non HTTP. Vous devez équilibrer la charge des deux niveaux. Le niveau logique métier ne doit pas être accessible depuis Internet.

    Quels équilibreurs de charge devez-vous déployer ?
body:
  options:
    - { id: a, text: { en: "A public load balancer for the web tier and another public load balancer for the business logic tier", fr: "Un équilibreur de charge public pour le niveau web et un autre équilibreur de charge public pour le niveau logique métier" } }
    - { id: b, text: { en: "An internal load balancer for the web tier and another internal load balancer for the business logic tier", fr: "Un équilibreur de charge interne pour le niveau web et un autre équilibreur de charge interne pour le niveau logique métier" } }
    - { id: c, text: { en: "An internal load balancer for the web tier and a public load balancer for the business logic tier", fr: "Un équilibreur de charge interne pour le niveau web et un équilibreur de charge public pour le niveau logique métier" } }
    - { id: d, text: { en: "A public load balancer for the web tier and an internal load balancer for the business logic tier", fr: "Un équilibreur de charge public pour le niveau web et un équilibreur de charge interne pour le niveau logique métier" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A public load balancer has a public frontend IP and receives internet traffic, which suits the web tier. An internal load balancer has a private frontend IP that is never exposed to the internet, so only clients inside the virtual network (or connected networks) such as the web tier can reach the business logic tier.
    fr: |
      Un équilibreur de charge public dispose d'une IP frontale publique et reçoit le trafic Internet, ce qui convient au niveau web. Un équilibreur de charge interne dispose d'une IP frontale privée jamais exposée à Internet : seuls les clients du réseau virtuel (ou des réseaux connectés), comme le niveau web, peuvent joindre le niveau logique métier.
  options:
    a: { en: "A public frontend would expose the business logic tier to the internet.", fr: "Un front-end public exposerait le niveau logique métier à Internet." }
    b: { en: "An internal load balancer cannot receive traffic from internet users.", fr: "Un équilibreur de charge interne ne peut pas recevoir de trafic des utilisateurs d'Internet." }
    c: { en: "The roles are inverted: internet users could not reach the web tier, and the business logic tier would be exposed.", fr: "Les rôles sont inversés : les utilisateurs d'Internet ne pourraient pas joindre le niveau web, et le niveau logique métier serait exposé." }
references:
  - title: Azure Load Balancer Components Overview
    url: https://learn.microsoft.com/en-us/azure/load-balancer/components
