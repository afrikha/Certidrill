id: az700-3b-listener-priority-hotarea
objective: "3.2.6"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    An Application Gateway Standard_v2 named **AGW1** has the HTTPS listeners and routing rules shown in the following table. All the listeners use the same public frontend IP address and port 443, and each certificate covers the host names of its listener.

    Answer each prompt by selecting the routing rule that processes the request.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un Application Gateway Standard_v2 nommé **AGW1** possède les écouteurs HTTPS et les règles de routage indiqués dans le tableau suivant. Tous les écouteurs utilisent la même adresse IP frontale publique et le port 443, et chaque certificat couvre les noms d'hôte de son écouteur.

    Répondez à chaque consigne en sélectionnant la règle de routage qui traite la requête.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "A request for https://shop.contoso.com/cart", fr: "Une requête pour https://shop.contoso.com/cart" }
    - id: p2
      text: { en: "A request for https://shop.fabrikam.com/", fr: "Une requête pour https://shop.fabrikam.com/" }
  grid:
    header: [{ en: "Rule priority", fr: "Priorité de la règle" }, { en: "Rule", fr: "Règle" }, { en: "Listener type", fr: "Type d'écouteur" }, { en: "Host names", fr: "Noms d'hôte" }]
    rows:
      - [{ text: "100" }, { text: rule-wildcard, area: r100 }, { text: { en: "Multi-site", fr: "Multisite" } }, { text: "*.contoso.com" }]
      - [{ text: "200" }, { text: rule-shop, area: r200 }, { text: { en: "Multi-site", fr: "Multisite" } }, { text: shop.contoso.com }]
      - [{ text: "300" }, { text: rule-fabrikam, area: r300 }, { text: { en: "Multi-site", fr: "Multisite" } }, { text: "www.fabrikam.com, fabrikam.com" }]
      - [{ text: "400" }, { text: rule-default, area: r400 }, { text: { en: "Basic", fr: "De base" } }, { text: { en: "(any)", fr: "(tous)" } }]
answer:
  values: { p1: r100, p2: r400 }
explanation:
  correct:
    en: On v2, the rule priority decides the order in which listeners are processed, from 1 (highest) to 20000. The wildcard listener `*.contoso.com` (priority 100) is evaluated before `shop.contoso.com` (200), so it captures shop.contoso.com and rule-shop never receives traffic; the specific listener needs a lower number than the wildcard one. shop.fabrikam.com matches neither Contoso listener nor the Fabrikam host names, so the basic listener of rule-default accepts it.
    fr: "En v2, la priorité de la règle détermine l'ordre de traitement des écouteurs, de 1 (la plus élevée) à 20000. L'écouteur générique `*.contoso.com` (priorité 100) est évalué avant `shop.contoso.com` (200) : il capte shop.contoso.com et rule-shop ne reçoit jamais de trafic ; l'écouteur spécifique doit avoir un numéro inférieur à celui de l'écouteur générique. shop.fabrikam.com ne correspond à aucun écouteur Contoso ni aux noms d'hôte Fabrikam : l'écouteur de base de rule-default l'accepte."
  options:
    r200: { en: "rule-shop would be used only if its priority number were lower than 100.", fr: "rule-shop ne serait utilisée que si son numéro de priorité était inférieur à 100." }
    r300: { en: "rule-fabrikam lists only www.fabrikam.com and fabrikam.com; shop.fabrikam.com is not one of them.", fr: "rule-fabrikam ne liste que www.fabrikam.com et fabrikam.com ; shop.fabrikam.com n'en fait pas partie." }
references:
  - title: Application Gateway multi-site hosting
    url: https://learn.microsoft.com/en-us/azure/application-gateway/multiple-site-overview
  - title: Application Gateway listener configuration
    url: https://learn.microsoft.com/en-us/azure/application-gateway/configuration-listeners
