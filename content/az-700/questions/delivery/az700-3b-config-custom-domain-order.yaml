id: az700-3b-config-custom-domain-order
objective: "3.3.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Azure Front Door Standard profile named **afd-contoso** with an endpoint named **contoso-web** and a route named **route-default**. The DNS zone contoso.com is hosted by a third-party DNS provider.

    You need users to reach the website through **www.contoso.com** with a Front Door-managed certificate.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un profil Azure Front Door Standard nommé **afd-contoso** avec un point de terminaison nommé **contoso-web** et un itinéraire nommé **route-default**. La zone DNS contoso.com est hébergée par un fournisseur DNS tiers.

    Les utilisateurs doivent atteindre le site web par **www.contoso.com** avec un certificat managé par Front Door.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: add, text: { en: "Add www.contoso.com as a custom domain of afd-contoso, with a Front Door-managed certificate.", fr: "Ajouter www.contoso.com comme domaine personnalisé d'afd-contoso, avec un certificat managé par Front Door." } }
    - { id: txt, text: { en: "Create the TXT record _dnsauth.www with the value shown in the portal, and wait for the Approved state.", fr: "Créer l'enregistrement TXT _dnsauth.www avec la valeur indiquée dans le portail, et attendre l'état Approuvé." } }
    - { id: assoc, text: { en: "Associate www.contoso.com with the contoso-web endpoint and route-default.", fr: "Associer www.contoso.com au point de terminaison contoso-web et à route-default." } }
    - { id: cname, text: { en: "Create a CNAME record for www that points to the host name of the contoso-web endpoint.", fr: "Créer un enregistrement CNAME pour www qui pointe vers le nom d'hôte du point de terminaison contoso-web." } }
    - { id: arecord, text: { en: "Create an A record for www that points to the current IP address of the contoso-web endpoint.", fr: "Créer un enregistrement A pour www qui pointe vers l'adresse IP actuelle du point de terminaison contoso-web." } }
    - { id: kv, text: { en: "Import a certificate for www.contoso.com into Azure Key Vault.", fr: "Importer un certificat pour www.contoso.com dans Azure Key Vault." } }
answer:
  sequence: [ add, txt, assoc, cname ]
explanation:
  correct:
    en: You add the domain to the profile, which gives it the Pending validation state and a TXT value to publish as `_dnsauth.www`. Once the domain is Approved, you associate it with the endpoint and its routes, and then point www to the endpoint host name with a CNAME record so that traffic starts flowing; the managed certificate is then issued and later rotated automatically because the CNAME points directly to the endpoint.
    fr: "Vous ajoutez le domaine au profil, qui lui donne l'état de validation En attente et une valeur TXT à publier sous `_dnsauth.www`. Une fois le domaine Approuvé, vous l'associez au point de terminaison et à ses itinéraires, puis vous dirigez www vers le nom d'hôte du point de terminaison avec un enregistrement CNAME pour que le trafic commence à circuler ; le certificat managé est alors émis, puis renouvelé automatiquement car le CNAME pointe directement vers le point de terminaison."
  options:
    arecord: { en: "The IP address of an endpoint can change without notice; use a CNAME (or an alias record at the apex).", fr: "L'adresse IP d'un point de terminaison peut changer sans préavis ; utilisez un CNAME (ou un enregistrement d'alias à l'apex)." }
    kv: { en: "Key Vault is only needed when you bring your own certificate, not with a managed certificate.", fr: "Key Vault n'est nécessaire que si vous apportez votre propre certificat, pas avec un certificat managé." }
references:
  - title: Configure a custom domain on Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/frontdoor/standard-premium/how-to-add-custom-domain
