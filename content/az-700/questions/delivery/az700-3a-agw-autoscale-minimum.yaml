id: az700-3a-agw-autoscale-minimum
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is deploying an Application Gateway Standard_v2 named **AGW1**. Normal traffic requires two instances. A few times each week, at unpredictable times, traffic peaks require up to eight instances.

    You need to configure the scaling of AGW1. The solution must meet the following requirements:

    - At least two instances must always be provisioned.
    - Peaks must be handled without administrator intervention.
    - Costs must be minimized outside peak periods.

    Which configuration should you use?
  fr: |
    Contoso déploie un Application Gateway Standard_v2 nommé **AGW1**. Le trafic normal nécessite deux instances. Quelques fois par semaine, à des moments imprévisibles, des pics de trafic nécessitent jusqu'à huit instances.

    Vous devez configurer la mise à l'échelle d'AGW1. La solution doit répondre aux exigences suivantes :

    - Au moins deux instances doivent toujours être provisionnées.
    - Les pics doivent être absorbés sans intervention d'un administrateur.
    - Les coûts doivent être réduits au minimum en dehors des pics.

    Quelle configuration devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Autoscaling with a minimum instance count of 2 and a maximum instance count of 8", fr: "Mise à l'échelle automatique avec un nombre minimal d'instances de 2 et un nombre maximal d'instances de 8" } }
    - { id: b, text: { en: "Autoscaling with a minimum instance count of 0 and a maximum instance count of 8", fr: "Mise à l'échelle automatique avec un nombre minimal d'instances de 0 et un nombre maximal d'instances de 8" } }
    - { id: c, text: { en: "Manual scaling with an instance count of 8", fr: "Mise à l'échelle manuelle avec un nombre d'instances de 8" } }
    - { id: d, text: { en: "Manual scaling with an instance count of 2", fr: "Mise à l'échelle manuelle avec un nombre d'instances de 2" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In autoscaling mode, the minimum instance count reserves capacity that is always provisioned, and the gateway scales out up to the maximum when traffic grows, then scales back in. A minimum of 2 keeps two instances ready, and a maximum of 8 covers the peaks without paying for eight instances all the time.
    fr: |
      En mode de mise à l'échelle automatique, le nombre minimal d'instances réserve une capacité toujours provisionnée, et la passerelle monte jusqu'au nombre maximal quand le trafic augmente, puis redescend. Un minimum de 2 maintient deux instances prêtes, et un maximum de 8 couvre les pics sans payer huit instances en permanence.
  options:
    b: { en: "A minimum of 0 reserves no capacity, which does not guarantee that two instances are always provisioned.", fr: "Un minimum de 0 ne réserve aucune capacité, ce qui ne garantit pas que deux instances soient toujours provisionnées." }
    c: { en: "Eight fixed instances handle the peaks but are billed all the time, which does not minimize costs.", fr: "Huit instances fixes absorbent les pics, mais sont facturées en permanence, ce qui ne réduit pas les coûts au minimum." }
    d: { en: "In manual mode the gateway never adds instances; traffic beyond the capacity of two instances can be lost.", fr: "En mode manuel, la passerelle n'ajoute jamais d'instances ; le trafic qui dépasse la capacité de deux instances peut être perdu." }
references:
  - title: Scaling Application Gateway v2 and WAF v2
    url: https://learn.microsoft.com/en-us/azure/application-gateway/application-gateway-autoscaling-zone-redundant
