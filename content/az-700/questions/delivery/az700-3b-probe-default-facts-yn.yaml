id: az700-3b-probe-default-facts-yn
objective: "3.2.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    An Application Gateway Standard_v2 named **AGW1** runs on three instances. Its routing rule uses backend settings named **bs-http** (HTTP, port 80, no host name configured) and a backend pool named **Pool1**. No custom probe is configured.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un Application Gateway Standard_v2 nommé **AGW1** s'exécute sur trois instances. Sa règle de routage utilise des paramètres de back-end nommés **bs-http** (HTTP, port 80, aucun nom d'hôte configuré) et un pool principal nommé **Pool1**. Aucune sonde personnalisée n'est configurée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: AGW1 probes the servers of Pool1 by sending requests to http://127.0.0.1:80/.
        fr: AGW1 sonde les serveurs de Pool1 en envoyant des requêtes à http://127.0.0.1:80/.
    - id: s2
      text:
        en: A server that you add to Pool1 receives client requests before its first probe completes.
        fr: Un serveur que vous ajoutez à Pool1 reçoit des requêtes clientes avant la fin de sa première sonde.
    - id: s3
      text:
        en: Each of the three instances of AGW1 probes the servers of Pool1 independently.
        fr: Chacune des trois instances d'AGW1 sonde les serveurs de Pool1 de manière indépendante.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The default probe targets `<protocol>://127.0.0.1:<port>/`, taking the protocol and port from the backend settings, every 30 seconds. A backend server is considered unhealthy until it returns a successful probe response, so a new server gets no traffic before that. All the instances of the gateway probe the servers independently of each other.
    fr: "La sonde par défaut cible `<protocole>://127.0.0.1:<port>/`, avec le protocole et le port des paramètres de back-end, toutes les 30 secondes. Un serveur principal est considéré comme non sain jusqu'à ce qu'il renvoie une réponse de sonde réussie : un nouveau serveur ne reçoit donc aucun trafic avant. Toutes les instances de la passerelle sondent les serveurs indépendamment les unes des autres."
references:
  - title: Application Gateway health probes overview
    url: https://learn.microsoft.com/en-us/azure/application-gateway/application-gateway-probe-overview
