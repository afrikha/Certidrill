id: az700-3b-afd-tls-end-to-end
objective: "3.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso publishes **www.contoso.com** through Azure Front Door Standard. The origin is a pool of web servers behind a public Standard load balancer, reached with the origin host name **web-origin.contoso.com**. The servers currently listen only on HTTP port 80, and the route uses **HTTP only** as its forwarding protocol.

    You need the traffic between Front Door and the web servers to be encrypted.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso publie **www.contoso.com** au moyen d'Azure Front Door Standard. L'origine est un ensemble de serveurs web derrière un équilibreur de charge Standard public, joint avec le nom d'hôte d'origine **web-origin.contoso.com**. Les serveurs écoutent actuellement uniquement sur le port HTTP 80, et l'itinéraire utilise **HTTP uniquement** comme protocole de transfert.

    Le trafic entre Front Door et les serveurs web doit être chiffré.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the forwarding protocol of the route to HTTPS only.", fr: "Définir le protocole de transfert de l'itinéraire sur HTTPS uniquement." } }
    - { id: b, text: { en: "Upload the root certificate of the servers' internal CA to the Front Door profile.", fr: "Charger le certificat racine de l'autorité de certification interne des serveurs dans le profil Front Door." } }
    - { id: c, text: { en: "Configure the servers for HTTPS with a certificate for web-origin.contoso.com issued by a CA in the Microsoft Trusted CA List.", fr: "Configurer les serveurs pour HTTPS avec un certificat pour web-origin.contoso.com émis par une autorité de la liste Microsoft Trusted CA List." } }
    - { id: d, text: { en: "Enable mutual TLS between Front Door and the origin.", fr: "Activer le TLS mutuel entre Front Door et l'origine." } }
    - { id: e, text: { en: "Set the minimum TLS version of the www.contoso.com domain to TLS 1.2.", fr: "Définir la version TLS minimale du domaine www.contoso.com sur TLS 1.2." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Front Door opens a separate connection to the origin, and the forwarding protocol of the route decides whether it uses TLS; HTTPS only gives end-to-end encryption. The origin must then present a certificate with a complete chain to a CA in the Microsoft Trusted CA List, with a subject name that matches the origin host name.
    fr: "Front Door ouvre une connexion distincte vers l'origine, et le protocole de transfert de l'itinéraire détermine si elle utilise TLS ; HTTPS uniquement donne un chiffrement de bout en bout. L'origine doit alors présenter un certificat avec une chaîne complète jusqu'à une autorité de la liste Microsoft Trusted CA List, et un nom d'objet qui correspond au nom d'hôte de l'origine."
  options:
    b: { en: "Front Door doesn't accept origin certificates from internal CAs; you cannot add your own trusted root.", fr: "Front Door n'accepte pas les certificats d'origine émis par des autorités internes ; vous ne pouvez pas ajouter votre propre racine approuvée." }
    d: { en: "Front Door doesn't support mutual TLS on connections to origins; mTLS in Premium applies to clients.", fr: "Front Door ne prend pas en charge le TLS mutuel sur les connexions vers les origines ; le mTLS de Premium s'applique aux clients." }
    e: { en: "The domain TLS policy applies to the client connections, and TLS 1.2 is already the minimum.", fr: "La stratégie TLS du domaine s'applique aux connexions clientes, et TLS 1.2 est déjà le minimum." }
references:
  - title: TLS encryption with Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/frontdoor/end-to-end-tls
