id: az700-3a-tm-nested-profile
objective: "3.1.7"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware has a Traffic Manager profile named **TM-Global** that uses the Performance routing method with endpoints in East US and Japan East.

    In West Europe, Litware deploys two endpoints, **weu-prod** and **weu-test**. Users routed to West Europe must be split 90/10 between them, so you create a child profile named **TM-WEU** that uses the Weighted routing method and contains both endpoints.

    You need to add TM-WEU to TM-Global. If fewer than two West Europe endpoints are healthy, TM-Global must send West Europe users to the other regions.

    How should you configure the endpoint in TM-Global? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un profil Traffic Manager nommé **TM-Global** qui utilise la méthode de routage Performance, avec des points de terminaison dans East US et Japan East.

    Dans West Europe, Litware déploie deux points de terminaison, **weu-prod** et **weu-test**. Les utilisateurs dirigés vers West Europe doivent être répartis à 90/10 entre eux : vous créez donc un profil enfant nommé **TM-WEU**, qui utilise la méthode de routage Weighted et contient les deux points de terminaison.

    Vous devez ajouter TM-WEU à TM-Global. Si moins de deux points de terminaison de West Europe sont sains, TM-Global doit envoyer les utilisateurs de West Europe vers les autres régions.

    Comment devez-vous configurer le point de terminaison dans TM-Global ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Endpoint type: [[type]]

      Minimum child endpoints: [[min]]

      Other required setting: [[setting]]
    fr: |
      Type de point de terminaison : [[type]]

      Nombre minimal de points de terminaison enfants : [[min]]

      Autre paramètre obligatoire : [[setting]]
  slots:
    - id: type
      options:
        - { id: azure, text: { en: "Azure endpoint", fr: "Point de terminaison Azure" } }
        - { id: external, text: { en: "External endpoint", fr: "Point de terminaison externe" } }
        - { id: nested, text: { en: "Nested endpoint", fr: "Point de terminaison imbriqué" } }
    - id: min
      options:
        - { id: m1, text: "1" }
        - { id: m2, text: "2" }
        - { id: m3, text: "3" }
    - id: setting
      options:
        - { id: location, text: { en: "Endpoint location: West Europe", fr: "Emplacement du point de terminaison : West Europe" } }
        - { id: weight, text: { en: "Weight: 90", fr: "Poids : 90" } }
        - { id: priority, text: { en: "Priority: 1", fr: "Priorité : 1" } }
        - { id: geo, text: { en: "Geographic mapping: Europe", fr: "Mappage géographique : Europe" } }
answer:
  values: { type: nested, min: m2, setting: location }
explanation:
  correct:
    en: |
      A child profile is added to a parent profile as a nested endpoint. MinChildEndpoints (default 1) is the minimum number of healthy child endpoints for the nested endpoint to be considered available; with 2, the loss of one West Europe endpoint makes TM-Global route those users elsewhere. Because the parent uses Performance routing, a nested or external endpoint must be given a location.
    fr: |
      Un profil enfant est ajouté à un profil parent en tant que point de terminaison imbriqué. MinChildEndpoints (1 par défaut) est le nombre minimal de points de terminaison enfants sains pour que le point de terminaison imbriqué soit considéré comme disponible ; avec 2, la perte d'un point de terminaison de West Europe amène TM-Global à diriger ces utilisateurs ailleurs. Comme le parent utilise le routage Performance, un point de terminaison imbriqué ou externe doit recevoir un emplacement.
  options:
    azure: { en: "Azure endpoints reference Azure resources such as web apps or public IP addresses, not Traffic Manager profiles.", fr: "Les points de terminaison Azure référencent des ressources Azure, comme des applications web ou des adresses IP publiques, pas des profils Traffic Manager." }
    m1: { en: "With the default value 1, the child stays available while only one West Europe endpoint is healthy.", fr: "Avec la valeur par défaut 1, le profil enfant reste disponible tant qu'un seul point de terminaison de West Europe est sain." }
    weight: { en: "Weights are used by the child profile (Weighted); the parent uses Performance.", fr: "Les poids sont utilisés par le profil enfant (Weighted) ; le parent utilise Performance." }
references:
  - title: Nested Traffic Manager profiles
    url: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-nested-profiles
