id: az700-3a-agw-vmss-pool-order
objective: "3.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind has an Application Gateway Standard_v2 named **AGW1**. A request routing rule named **Rule1** currently sends all traffic to a backend pool named **LegacyPool**.

    Northwind deploys a virtual machine scale set named **VMSS1** in the same virtual network as AGW1. The upgrade policy of VMSS1 is set to **Manual**.

    You need Rule1 to send traffic to the instances of VMSS1. Rule1 must be switched only when the instances of VMSS1 can be reported healthy by AGW1.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind dispose d'un Application Gateway Standard_v2 nommé **AGW1**. Une règle de routage des requêtes nommée **Rule1** envoie actuellement tout le trafic vers un pool principal nommé **LegacyPool**.

    Northwind déploie un groupe de machines virtuelles identiques nommé **VMSS1** dans le même réseau virtuel qu'AGW1. La stratégie de mise à niveau de VMSS1 est définie sur **Manual**.

    Rule1 doit envoyer le trafic vers les instances de VMSS1. Rule1 ne doit être modifiée que lorsque les instances de VMSS1 peuvent être signalées comme saines par AGW1.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: pool, text: { en: "Create a backend pool named VmssPool on AGW1 without targets.", fr: "Créer sur AGW1 un pool principal nommé VmssPool sans cibles." } }
    - { id: assoc, text: { en: "Add VmssPool to the IP configuration of the VMSS1 network profile.", fr: "Ajouter VmssPool à la configuration IP du profil réseau de VMSS1." } }
    - { id: upgrade, text: { en: "Upgrade the instances of VMSS1 to the latest model.", fr: "Mettre à niveau les instances de VMSS1 vers le dernier modèle." } }
    - { id: rule, text: { en: "Update Rule1 to use VmssPool as its backend target.", fr: "Modifier Rule1 pour qu'elle utilise VmssPool comme cible de back-end." } }
    - { id: pip, text: { en: "Assign a public IP address to each instance of VMSS1.", fr: "Attribuer une adresse IP publique à chaque instance de VMSS1." } }
    - { id: affinity, text: { en: "Enable cookie-based affinity in the backend settings of Rule1.", fr: "Activer l'affinité basée sur les cookies dans les paramètres de back-end de Rule1." } }
answer:
  sequence: [ pool, assoc, upgrade, rule ]
explanation:
  correct:
    en: |
      The backend pool must exist before the scale set can reference it. Adding the pool to the scale set model does not change the existing instances: with a Manual upgrade policy, the backend stays unhealthy until you upgrade the instances. Once AGW1 can probe the instances, you switch Rule1 to the new pool.
    fr: |
      Le pool principal doit exister avant que le groupe identique puisse le référencer. L'ajout du pool au modèle du groupe identique ne modifie pas les instances existantes : avec une stratégie de mise à niveau Manual, le back-end reste non sain tant que vous n'avez pas mis à niveau les instances. Une fois qu'AGW1 peut sonder les instances, vous basculez Rule1 vers le nouveau pool.
  options:
    pip: { en: "AGW1 reaches the instances through their private IP addresses in the virtual network; public IPs are not needed.", fr: "AGW1 joint les instances par leurs adresses IP privées dans le réseau virtuel ; des IP publiques sont inutiles." }
    affinity: { en: "Cookie-based affinity is optional and unrelated to adding the scale set to the pool.", fr: "L'affinité basée sur les cookies est facultative et sans rapport avec l'ajout du groupe identique au pool." }
references:
  - title: Application gateway components
    url: https://learn.microsoft.com/en-us/azure/application-gateway/application-gateway-components
