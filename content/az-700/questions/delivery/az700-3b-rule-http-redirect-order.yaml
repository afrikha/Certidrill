id: az700-3b-rule-http-redirect-order
objective: "3.2.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An Application Gateway Standard_v2 named **AGW1** publishes **www.contoso.com**. AGW1 has one frontend port, **port-443**, and an HTTPS listener named **lst-https** on that port. A basic routing rule sends the requests of lst-https to a backend pool.

    You need requests sent to http://www.contoso.com on port 80 to be answered with a redirect to https://www.contoso.com, keeping the path and the query string.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un Application Gateway Standard_v2 nommé **AGW1** publie **www.contoso.com**. AGW1 possède un port frontal, **port-443**, et un écouteur HTTPS nommé **lst-https** sur ce port. Une règle de routage de base envoie les requêtes de lst-https vers un pool principal.

    Les requêtes envoyées à http://www.contoso.com sur le port 80 doivent recevoir une redirection vers https://www.contoso.com, en conservant le chemin et la chaîne de requête.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: port, text: { en: "Add a frontend port named port-80 for port 80.", fr: "Ajouter un port frontal nommé port-80 pour le port 80." } }
    - { id: listener, text: { en: "Create an HTTP listener named lst-http that uses port-80.", fr: "Créer un écouteur HTTP nommé lst-http qui utilise port-80." } }
    - { id: rule, text: { en: "Create a routing rule for lst-http whose target type is Redirection to the listener lst-https, with the path and query string included.", fr: "Créer une règle de routage pour lst-http dont le type de cible est Redirection vers l'écouteur lst-https, avec le chemin et la chaîne de requête inclus." } }
    - { id: bs80, text: { en: "Create backend settings that use HTTP on port 80.", fr: "Créer des paramètres de back-end qui utilisent HTTP sur le port 80." } }
    - { id: rewrite, text: { en: "Create a rewrite set that sets the Location response header to https://www.contoso.com.", fr: "Créer un ensemble de réécriture qui définit l'en-tête de réponse Location sur https://www.contoso.com." } }
    - { id: multisite, text: { en: "Convert lst-https to a multi-site listener for www.contoso.com.", fr: "Convertir lst-https en écouteur multisite pour www.contoso.com." } }
answer:
  sequence: [ port, listener, rule ]
explanation:
  correct:
    en: A listener needs a frontend port, so you add port 80 first, then create the HTTP listener on it. A routing rule whose target is a redirection to another listener answers the client with a redirect (301 is recommended for HTTP to HTTPS) and can include the path and query string. No backend pool or backend settings are used by a redirect.
    fr: "Un écouteur a besoin d'un port frontal : vous ajoutez d'abord le port 80, puis vous créez l'écouteur HTTP sur ce port. Une règle de routage dont la cible est une redirection vers un autre écouteur répond au client par une redirection (301 est recommandé pour HTTP vers HTTPS) et peut inclure le chemin et la chaîne de requête. Une redirection n'utilise ni pool principal ni paramètres de back-end."
  options:
    bs80: { en: "Backend settings define the connection to servers; a redirect never reaches a server.", fr: "Les paramètres de back-end définissent la connexion vers les serveurs ; une redirection n'atteint jamais de serveur." }
    rewrite: { en: "Rewrites are not supported on redirected requests, and rewriting Location does not create a redirect by itself.", fr: "Les réécritures ne sont pas prises en charge sur les requêtes redirigées, et réécrire Location ne crée pas de redirection en soi." }
    multisite: { en: "A single site on port 443 works with the existing listener; the listener type does not create the redirect.", fr: "Un seul site sur le port 443 fonctionne avec l'écouteur existant ; le type d'écouteur ne crée pas la redirection." }
references:
  - title: Application Gateway redirect overview
    url: https://learn.microsoft.com/en-us/azure/application-gateway/redirect-overview
