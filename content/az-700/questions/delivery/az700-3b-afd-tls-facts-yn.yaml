id: az700-3b-afd-tls-facts-yn
objective: "3.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an Azure Front Door Standard profile. The custom domain **www.tailspin.com** uses a Front Door-managed certificate, and its DNS record is a CNAME that points to a Traffic Manager profile, which in turn points to the Front Door endpoint.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un profil Azure Front Door Standard. Le domaine personnalisé **www.tailspin.com** utilise un certificat managé par Front Door, et son enregistrement DNS est un CNAME qui pointe vers un profil Traffic Manager, lequel pointe vers le point de terminaison Front Door.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The managed certificate of www.tailspin.com requires a manual action to be renewed.
        fr: Le certificat managé de www.tailspin.com exige une action manuelle pour être renouvelé.
    - id: s2
      text:
        en: You can set the minimum TLS version of www.tailspin.com to TLS 1.0 for legacy clients.
        fr: Vous pouvez définir la version TLS minimale de www.tailspin.com sur TLS 1.0 pour les clients hérités.
    - id: s3
      text:
        en: You can require client certificates (mutual TLS) on www.tailspin.com without changing the tier of the profile.
        fr: Vous pouvez exiger des certificats clients (TLS mutuel) sur www.tailspin.com sans changer le niveau du profil.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Front Door rotates managed certificates automatically only when the custom domain CNAME points directly to the Front Door endpoint; otherwise the domain must be revalidated. TLS 1.0 and 1.1 are not supported by Front Door, which accepts TLS 1.2 and 1.3. Client mTLS is supported by Front Door Premium only, so this Standard profile must be upgraded first.
    fr: "Front Door ne renouvelle automatiquement les certificats managés que si le CNAME du domaine personnalisé pointe directement vers le point de terminaison Front Door ; sinon, le domaine doit être revalidé. TLS 1.0 et 1.1 ne sont pas pris en charge par Front Door, qui accepte TLS 1.2 et 1.3. Le mTLS client n'est pris en charge que par Front Door Premium : ce profil Standard doit d'abord être mis à niveau."
references:
  - title: TLS encryption with Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/frontdoor/end-to-end-tls
