id: az700-3a-agw-usecase-waf
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin hosts a customer portal on virtual machines in the East US region only. The portal is published over HTTPS.

    You need a solution that meets the following requirements:

    - Block SQL injection and cross-site scripting attacks before they reach the virtual machines.
    - Decrypt TLS before the traffic reaches the virtual machines.
    - Minimize the number of Azure services used.

    What should you deploy?
  fr: |
    Tailspin héberge un portail client sur des machines virtuelles de la seule région East US. Le portail est publié en HTTPS.

    Vous avez besoin d'une solution qui répond aux exigences suivantes :

    - Bloquer les attaques par injection SQL et par script intersite avant qu'elles n'atteignent les machines virtuelles.
    - Déchiffrer le TLS avant que le trafic n'atteigne les machines virtuelles.
    - Réduire au minimum le nombre de services Azure utilisés.

    Que devez-vous déployer ?
body:
  options:
    - { id: a, text: { en: "An Application Gateway Standard_v2", fr: "Un Application Gateway Standard_v2" } }
    - { id: b, text: { en: "A public Standard load balancer", fr: "Un équilibreur de charge public Standard" } }
    - { id: c, text: { en: "A Traffic Manager profile", fr: "Un profil Traffic Manager" } }
    - { id: d, text: { en: "An Application Gateway WAF_v2", fr: "Un Application Gateway WAF_v2" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Application Gateway is the regional layer 7 load balancer that terminates TLS. The WAF_v2 SKU adds Azure Web Application Firewall, which inspects requests against managed rule sets that detect attacks such as SQL injection and cross-site scripting. One service meets all the requirements.
    fr: |
      Application Gateway est l'équilibreur de charge régional de couche 7 qui termine le TLS. La référence SKU WAF_v2 ajoute Azure Web Application Firewall, qui inspecte les requêtes à l'aide d'ensembles de règles gérés détectant des attaques comme l'injection SQL et le script intersite. Un seul service répond donc à toutes les exigences.
  options:
    a: { en: "Standard_v2 terminates TLS but does not include the web application firewall.", fr: "Standard_v2 termine le TLS, mais n'inclut pas le pare-feu d'applications web." }
    b: { en: "A load balancer works at layer 4; it neither decrypts TLS nor inspects HTTP requests.", fr: "Un équilibreur de charge fonctionne en couche 4 ; il ne déchiffre pas le TLS et n'inspecte pas les requêtes HTTP." }
    c: { en: "Traffic Manager only answers DNS queries; traffic never passes through it.", fr: "Traffic Manager se contente de répondre aux requêtes DNS ; le trafic ne passe jamais par lui." }
references:
  - title: What is Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/application-gateway/overview
  - title: What is Azure Application Gateway v2?
    url: https://learn.microsoft.com/en-us/azure/application-gateway/overview-v2
