id: az700-3a-nat-vmss-ssh
objective: "3.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a Linux virtual machine scale set named **VMSS1** that currently has 20 instances and can scale out to 50 instances. The instances are in the backend pool **Pool1** of a public Standard load balancer named **LB1**.

    Administrators must connect over SSH to a specific instance by using the frontend IP address of LB1 and a distinct frontend port per instance, starting at port 50000. Instances added by scale-out must get their own port without any manual change to LB1.

    You are configuring LB1 in November 2026. What should you create?
  fr: |
    Proseware dispose d'un groupe de machines virtuelles identiques Linux nommé **VMSS1**, qui compte actuellement 20 instances et peut monter jusqu'à 50 instances. Les instances font partie du pool principal **Pool1** d'un équilibreur de charge public Standard nommé **LB1**.

    Les administrateurs doivent se connecter en SSH à une instance précise en utilisant l'adresse IP frontale de LB1 et un port frontal distinct par instance, à partir du port 50000. Les instances ajoutées par un scale-out doivent obtenir leur propre port sans aucune modification manuelle de LB1.

    Vous configurez LB1 en novembre 2026. Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An inbound NAT pool for VMSS1 with the frontend port range 50000 to 50049", fr: "Un pool NAT de trafic entrant pour VMSS1 avec la plage de ports frontaux 50000 à 50049" } }
    - { id: b, text: { en: "An inbound NAT rule that targets Pool1, with a frontend port range start of 50000 and a maximum number of machines of 50", fr: "Une règle NAT de trafic entrant qui cible Pool1, avec un début de plage de ports frontaux à 50000 et un nombre maximal de machines de 50" } }
    - { id: c, text: { en: "A load-balancing rule for TCP port 50000 to backend port 22, with session persistence set to Client IP", fr: "Une règle d'équilibrage de charge du port TCP 50000 vers le port principal 22, avec la persistance de session Client IP" } }
    - { id: d, text: { en: "An outbound rule on Pool1 with 1,000 allocated ports per instance", fr: "Une règle de trafic sortant sur Pool1 avec 1 000 ports alloués par instance" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An inbound NAT rule (V2) that references a backend pool preallocates frontend ports from the range start and the maximum number of machines, and maps one port to each instance. New instances receive a mapping automatically when the pool scales out. Sizing the range for 50 machines prevents scale-out from being blocked by a lack of free ports.
    fr: |
      Une règle NAT de trafic entrant (V2) qui référence un pool principal préalloue des ports frontaux à partir du début de plage et du nombre maximal de machines, et associe un port à chaque instance. Les nouvelles instances reçoivent automatiquement une association lors d'un scale-out. Dimensionner la plage pour 50 machines évite que le scale-out soit bloqué faute de ports libres.
  options:
    a: { en: "Inbound NAT pools (V1) can no longer be created since November 15, 2026, and they retire on September 30, 2027; Microsoft recommends inbound NAT rules V2.", fr: "Les pools NAT de trafic entrant (V1) ne peuvent plus être créés depuis le 15 novembre 2026 et seront mis hors service le 30 septembre 2027 ; Microsoft recommande les règles NAT de trafic entrant V2." }
    c: { en: "A load-balancing rule spreads connections across the healthy instances; administrators could not choose the instance they reach.", fr: "Une règle d'équilibrage de charge répartit les connexions entre les instances saines ; les administrateurs ne pourraient pas choisir l'instance atteinte." }
    d: { en: "Outbound rules configure SNAT for connections initiated by the instances; they forward no inbound traffic.", fr: "Les règles de trafic sortant configurent la SNAT des connexions initiées par les instances ; elles ne transfèrent aucun trafic entrant." }
references:
  - title: Inbound NAT rules
    url: https://learn.microsoft.com/en-us/azure/load-balancer/inbound-nat-rules
