id: az700-3a-agw-pool-targets
objective: "3.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Application Gateway Standard_v2 named **AGW1** in the subscription **Sub1**. You are adding backend targets to the backend pools of AGW1 by using the Azure portal.

    Which target type should you use for each backend? To answer, drag the appropriate target types to the correct backends. Each target type may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un Application Gateway Standard_v2 nommé **AGW1** dans l'abonnement **Sub1**. Vous ajoutez des cibles aux pools principaux d'AGW1 à l'aide du portail Azure.

    Quel type de cible devez-vous utiliser pour chaque back-end ? Pour répondre, faites glisser les types de cibles appropriés vers les back-ends correspondants. Chaque type de cible peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: appsvc, text: { en: "App Services (select the app)", fr: "App Services (sélection de l'application)" } }
    - { id: ipfqdn, text: { en: "IP address or host name", fr: "Adresse IP ou nom d'hôte" } }
    - { id: vm, text: { en: "Virtual machine (select the network interface)", fr: "Machine virtuelle (sélection de l'interface réseau)" } }
  targets:
    - id: t1
      text: { en: "An App Service app named app1 in Sub1", fr: "Une application App Service nommée app1 dans Sub1" }
    - id: t2
      text: { en: "An App Service app named app2 in another subscription, reached through app2.azurewebsites.net", fr: "Une application App Service nommée app2 dans un autre abonnement, jointe par app2.azurewebsites.net" }
    - id: t3
      text: { en: "A virtual machine named VM1 in the virtual network of AGW1", fr: "Une machine virtuelle nommée VM1 dans le réseau virtuel d'AGW1" }
    - id: t4
      text: { en: "An App Service app named app3 that is reached through a private endpoint", fr: "Une application App Service nommée app3 jointe par un point de terminaison privé" }
answer:
  mapping: { t1: appsvc, t2: ipfqdn, t3: vm, t4: ipfqdn }
explanation:
  correct:
    en: |
      The App Services target type lists only apps in the same subscription as the gateway. For an app in another subscription, you enter its host name (for example app2.azurewebsites.net) as an IP address or host name target, and for an app behind a private endpoint you enter the endpoint's FQDN or IP address. A VM in the virtual network is added through its network interface with the Virtual machine target type.
    fr: |
      Le type de cible App Services ne liste que les applications du même abonnement que la passerelle. Pour une application d'un autre abonnement, vous saisissez son nom d'hôte (par exemple app2.azurewebsites.net) comme cible de type adresse IP ou nom d'hôte, et pour une application derrière un point de terminaison privé, vous saisissez le FQDN ou l'adresse IP du point de terminaison. Une machine virtuelle du réseau virtuel s'ajoute par son interface réseau avec le type de cible Machine virtuelle.
references:
  - title: Manage traffic to App Service
    url: https://learn.microsoft.com/en-us/azure/application-gateway/configure-web-app
  - title: Application gateway components
    url: https://learn.microsoft.com/en-us/azure/application-gateway/application-gateway-components
