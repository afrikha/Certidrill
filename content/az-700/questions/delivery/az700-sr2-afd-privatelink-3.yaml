stem:
  en: You use a Premium profile with a Private Link origin.
  fr: Vous utilisez un profil Premium avec une origine Private Link.
body:
  solution:
    en: |
      You create an Azure Front Door Premium profile and add app1 as an origin with Private Link enabled in the East US region. On app1, you approve the pending private endpoint connection from Front Door, and you set **Public network access** to **Disabled**.
    fr: |
      Vous créez un profil Azure Front Door Premium et ajoutez app1 comme origine avec Private Link activé dans la région East US. Sur app1, vous approuvez la connexion de point de terminaison privé de Front Door qui attend votre approbation, et vous définissez **Public network access** sur **Disabled**.
answer: { value: true }
explanation:
  correct:
    en: |
      Front Door Premium can reach an App Service origin through a private endpoint in a network that Front Door manages; traffic flows after you approve the private endpoint connection on app1. Private endpoints and public access can coexist on an app, so disabling public network access is what blocks the public endpoint.
    fr: |
      Front Door Premium peut joindre une origine App Service par un point de terminaison privé situé dans un réseau géré par Front Door ; le trafic passe une fois la connexion de point de terminaison privé approuvée sur app1. Les points de terminaison privés et l'accès public peuvent coexister sur une application : c'est la désactivation de l'accès réseau public qui bloque le point de terminaison public.
references:
  - title: Secure your origin with Private Link in Azure Front Door Premium
    url: https://learn.microsoft.com/en-us/azure/frontdoor/private-link
  - title: "Use Private Endpoints for Apps"
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-private-endpoint
