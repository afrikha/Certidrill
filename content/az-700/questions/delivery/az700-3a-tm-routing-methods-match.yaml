id: az700-3a-tm-routing-methods-match
objective: "3.1.7"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Azure Traffic Manager for four applications. Each application has its own Traffic Manager profile.

    You need to select the routing method of each profile.

    Which routing method should you use for each requirement? To answer, drag the appropriate routing methods to the correct requirements. Each routing method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise Azure Traffic Manager pour quatre applications. Chaque application dispose de son propre profil Traffic Manager.

    Vous devez choisir la méthode de routage de chaque profil.

    Quelle méthode de routage devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les méthodes de routage appropriées vers les exigences correspondantes. Chaque méthode de routage peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: priority, text: Priority }
    - { id: weighted, text: Weighted }
    - { id: performance, text: Performance }
    - { id: geographic, text: Geographic }
    - { id: multivalue, text: MultiValue }
    - { id: subnet, text: Subnet }
  targets:
    - id: t1
      text: { en: "Send about 10 percent of DNS queries to a new version of the site while it is tested", fr: "Envoyer environ 10 % des requêtes DNS vers une nouvelle version du site pendant son test" }
    - id: t2
      text: { en: "For data residency, always answer queries from Germany with the deployment hosted in Germany West Central", fr: "Pour des raisons de résidence des données, toujours répondre aux requêtes provenant d'Allemagne avec le déploiement hébergé dans Germany West Central" }
    - id: t3
      text: { en: "Answer queries from the corporate office range 203.0.113.0/24 with an internal version of the application", fr: "Répondre aux requêtes provenant de la plage du siège 203.0.113.0/24 avec une version interne de l'application" }
    - id: t4
      text: { en: "Return all healthy IPv4 addresses of the external endpoints in a single DNS response so that clients can retry another address", fr: "Renvoyer toutes les adresses IPv4 saines des points de terminaison externes dans une seule réponse DNS pour que les clients puissent essayer une autre adresse" }
answer:
  mapping: { t1: weighted, t2: geographic, t3: subnet, t4: multivalue }
explanation:
  correct:
    en: |
      Weighted distributes queries according to endpoint weights (for example 90 and 10). Geographic maps the geographic origin of the DNS query to an endpoint. Subnet maps source IP ranges to endpoints. MultiValue returns all healthy endpoints, which must be external endpoints defined by IPv4 or IPv6 addresses. Priority and Performance meet none of these requirements.
    fr: |
      Weighted répartit les requêtes selon le poids des points de terminaison (par exemple 90 et 10). Geographic associe l'origine géographique de la requête DNS à un point de terminaison. Subnet associe des plages d'adresses IP sources à des points de terminaison. MultiValue renvoie tous les points de terminaison sains, qui doivent être des points de terminaison externes définis par des adresses IPv4 ou IPv6. Priority et Performance ne répondent à aucune de ces exigences.
references:
  - title: Traffic Manager Routing Methods
    url: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-routing-methods
