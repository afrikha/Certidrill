id: az700-3a-snat-default-ports
objective: "3.1.11"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Northwind has a public Standard load balancer named **LB1** with one frontend IP configuration. The backend pool of LB1 contains 80 virtual machines, which have no instance-level public IP addresses. Their subnet has no NAT gateway.

    LB1 has a load-balancing rule for TCP port 443 with outbound SNAT enabled. LB1 has no outbound rule.

    How many SNAT ports does each virtual machine receive by default?
  fr: |
    Northwind dispose d'un équilibreur de charge public Standard nommé **LB1** avec une seule configuration IP frontale. Le pool principal de LB1 contient 80 machines virtuelles, qui n'ont pas d'adresse IP publique au niveau de l'instance. Leur sous-réseau n'a pas de passerelle NAT.

    LB1 dispose d'une règle d'équilibrage de charge pour le port TCP 443, avec la SNAT sortante activée. LB1 n'a aucune règle de trafic sortant.

    Combien de ports SNAT chaque machine virtuelle reçoit-elle par défaut ?
body:
  options:
    - { id: a, text: "256" }
    - { id: b, text: "512" }
    - { id: c, text: "800" }
    - { id: d, text: { en: "1,024", fr: "1 024" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With default port allocation and a single frontend IP, the number of SNAT ports per instance depends on the backend pool size; a pool of 51 to 100 instances gets 512 ports per instance. Microsoft recommends against default allocation for production and suggests a NAT gateway or outbound rules with manual allocation.
    fr: |
      Avec l'allocation de ports par défaut et une seule IP frontale, le nombre de ports SNAT par instance dépend de la taille du pool principal ; un pool de 51 à 100 instances reçoit 512 ports par instance. Microsoft déconseille l'allocation par défaut en production et recommande une passerelle NAT ou des règles de trafic sortant avec allocation manuelle.
  options:
    a: { en: "256 ports per instance apply to pools of 101 to 200 instances.", fr: "256 ports par instance s'appliquent aux pools de 101 à 200 instances." }
    c: { en: "Default allocation uses fixed tiers by pool size; it does not divide 64,000 by the number of VMs.", fr: "L'allocation par défaut utilise des paliers fixes selon la taille du pool ; elle ne divise pas 64 000 par le nombre de machines virtuelles." }
    d: { en: "1,024 ports per instance apply to pools of 1 to 50 instances.", fr: "1 024 ports par instance s'appliquent aux pools de 1 à 50 instances." }
references:
  - title: Source Network Address Translation (SNAT) for outbound connections
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-outbound-connections
