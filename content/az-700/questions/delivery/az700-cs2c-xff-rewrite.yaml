id: az700-cs2c-xff-rewrite
objective: "3.2.10"
type: dropdown
caseStudy: az700-cs2c-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You create a rewrite set named **rws-xff** on appgw-orders. You need to configure rws-xff to meet the requirement for the X-Forwarded-For header.

    How should you configure rws-xff? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un ensemble de réécritures nommé **rws-xff** sur appgw-orders. Vous devez configurer rws-xff pour respecter l'exigence relative à l'en-tête X-Forwarded-For.

    Comment devez-vous configurer rws-xff ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Associate rws-xff with: [[assoc]]

      Rewrite type of the action: [[type]]

      Value of the X-Forwarded-For header: [[value]]
    fr: |
      Associer rws-xff à : [[assoc]]

      Type de réécriture de l'action : [[type]]

      Valeur de l'en-tête X-Forwarded-For : [[value]]
  slots:
    - id: assoc
      options:
        - { id: listener, text: { en: "The listener lst-orders", fr: "L'écouteur lst-orders" } }
        - { id: rule, text: { en: "The routing rule rr-orders", fr: "La règle de routage rr-orders" } }
        - { id: settings, text: { en: "The backend settings bs-orders", fr: "Les paramètres de back-end bs-orders" } }
    - id: type
      options:
        - { id: req, text: { en: "Request header", fr: "En-tête de requête" } }
        - { id: resp, text: { en: "Response header", fr: "En-tête de réponse" } }
        - { id: url, text: "URL" }
    - id: value
      options:
        - { id: clientip, text: "{var_client_ip}" }
        - { id: addxff, text: "{var_add_x_forwarded_for_proxy}" }
        - { id: reqxff, text: "{http_req_X-Forwarded-For}" }
        - { id: host, text: "{var_host}" }
answer:
  values: { assoc: rule, type: req, value: addxff }
explanation:
  correct:
    en: |
      A rewrite set is associated with a routing rule; with the basic routing rule rr-orders, it applies to all the requests of lst-orders and of no other site. The header goes from appgw-orders to the backend, so the action rewrites a request header. The server variable add_x_forwarded_for_proxy contains the incoming X-Forwarded-For header with client_ip appended, without port information, so it keeps the upstream proxy addresses.
    fr: |
      Un ensemble de réécritures est associé à une règle de routage ; avec la règle de routage de base rr-orders, il s'applique à toutes les requêtes de lst-orders et à celles d'aucun autre site. L'en-tête va de appgw-orders vers le back-end : l'action réécrit donc un en-tête de requête. La variable serveur add_x_forwarded_for_proxy contient l'en-tête X-Forwarded-For entrant auquel est ajouté client_ip, sans information de port : elle conserve donc les adresses des proxys en amont.
  options:
    listener: { en: "A rewrite set isn't associated directly with a listener or with backend settings, but with a routing rule.", fr: "Un ensemble de réécritures ne s'associe pas directement à un écouteur ni à des paramètres de back-end, mais à une règle de routage." }
    resp: { en: "A response header goes back to the client; the application must receive the header in the request.", fr: "Un en-tête de réponse repart vers le client ; l'application doit recevoir l'en-tête dans la requête." }
    clientip: { en: "client_ip contains only the address of the client that connected to the gateway, so the upstream proxy addresses would be lost.", fr: "client_ip ne contient que l'adresse du client connecté à la passerelle : les adresses des proxys en amont seraient perdues." }
    reqxff: { en: "Copying the incoming header doesn't add the address of the client that connected to appgw-orders.", fr: "Copier l'en-tête entrant n'ajoute pas l'adresse du client qui s'est connecté à appgw-orders." }
references:
  - title: Rewrite HTTP headers and URL with Application Gateway
    url: https://learn.microsoft.com/en-us/azure/application-gateway/rewrite-http-headers-url
