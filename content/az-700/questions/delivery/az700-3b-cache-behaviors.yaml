id: az700-3b-cache-behaviors
objective: "3.3.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind publishes its catalog website through Azure Front Door Standard, with caching enabled on two routes:

    - **route-images** (`/images/*`): the image URLs carry a random query string added by the mobile app, such as `/images/p1.jpg?r=8342`; the image is the same whatever the query string.
    - **route-search** (`/search/*`): each query string, such as `/search?q=tea`, returns different results.

    The origin of the images sends no caching headers for some files. Northwind wants those files cached for 7 days, while files that have a `Cache-Control: max-age` header keep the duration set by the origin. You add a rule with a route configuration override action to route-images.

    How should you configure the caching? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind publie son site de catalogue au moyen d'Azure Front Door Standard, avec la mise en cache activée sur deux itinéraires :

    - **route-images** (`/images/*`) : les URL des images portent une chaîne de requête aléatoire ajoutée par l'application mobile, comme `/images/p1.jpg?r=8342` ; l'image est la même quelle que soit la chaîne de requête.
    - **route-search** (`/search/*`) : chaque chaîne de requête, comme `/search?q=tea`, renvoie des résultats différents.

    L'origine des images n'envoie aucun en-tête de mise en cache pour certains fichiers. Northwind veut que ces fichiers soient mis en cache pendant 7 jours, tandis que les fichiers qui ont un en-tête `Cache-Control: max-age` conservent la durée définie par l'origine. Vous ajoutez à route-images une règle avec une action de remplacement de la configuration d'itinéraire.

    Comment devez-vous configurer la mise en cache ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Query string caching behavior of route-images: [[img]]

      Query string caching behavior of route-search: [[search]]

      Cache behavior of the override action, with a duration of 7 days: [[duration]]
    fr: |
      Comportement de mise en cache des chaînes de requête de route-images : [[img]]

      Comportement de mise en cache des chaînes de requête de route-search : [[search]]

      Comportement du cache de l'action de remplacement, avec une durée de 7 jours : [[duration]]
  slots:
    - id: img
      options:
        - { id: ignore, text: Ignore Query String }
        - { id: use, text: Use Query String }
        - { id: include, text: Include Specified Query Strings }
    - id: search
      options:
        - { id: ignore, text: Ignore Query String }
        - { id: use, text: Use Query String }
        - { id: ignorespec, text: Ignore Specified Query Strings }
    - id: duration
      options:
        - { id: honor, text: Honor origin }
        - { id: always, text: Override always }
        - { id: missing, text: Override if origin missing }
answer:
  values: { img: ignore, search: use, duration: missing }
explanation:
  correct:
    en: With Ignore Query String, one cached copy serves every query string variation of an image. With Use Query String, each unique URL, including its query string, is a separate cached asset, which suits search results. Override if origin missing applies the 7-day duration only when the origin returns no caching TTL, so files with max-age keep their own duration.
    fr: "Avec Ignorer la chaîne de requête (Ignore Query String), une seule copie en cache sert toutes les variantes de chaîne de requête d'une image. Avec Utiliser la chaîne de requête (Use Query String), chaque URL unique, chaîne de requête comprise, est un élément mis en cache distinct, ce qui convient aux résultats de recherche. Remplacer si l'origine est absente (Override if origin missing) applique la durée de 7 jours uniquement quand l'origine ne renvoie aucune durée de mise en cache : les fichiers avec max-age conservent leur propre durée."
  options:
    use: { en: "For route-images, every random query string would create a new cache entry and a new origin request.", fr: "Pour route-images, chaque chaîne de requête aléatoire créerait une nouvelle entrée de cache et une nouvelle requête vers l'origine." }
    include: { en: "No parameter of the image URLs changes the content, so there is nothing to include.", fr: "Aucun paramètre des URL d'images ne change le contenu : il n'y a rien à inclure." }
    ignorespec: { en: "Search pages vary on every parameter; there is no parameter to exclude.", fr: "Les pages de recherche varient selon chaque paramètre ; il n'y a aucun paramètre à exclure." }
    honor: { en: "Honor origin caches files without headers for a random 1 to 3 days, not 7 days.", fr: "Honor origin met en cache les fichiers sans en-têtes pendant une durée aléatoire de 1 à 3 jours, pas 7 jours." }
    always: { en: "Override always would replace the max-age duration set by the origin.", fr: "Override always remplacerait la durée max-age définie par l'origine." }
references:
  - title: Caching with Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-caching
