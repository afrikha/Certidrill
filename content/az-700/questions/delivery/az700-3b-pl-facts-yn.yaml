id: az700-3b-pl-facts-yn
objective: "3.3.9"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Front Door Premium profile named **afd-litware**. Two origins, in two different origin groups, point to the same storage account **stlitware** with the target subresource `blob`, and both use the Private Link region **West Europe**. You have just enabled Private Link on these origins.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un profil Azure Front Door Premium nommé **afd-litware**. Deux origines, dans deux groupes d'origines différents, pointent vers le même compte de stockage **stlitware** avec la sous-ressource cible `blob`, et utilisent toutes deux la région Private Link **West Europe**. Vous venez d'activer Private Link sur ces origines.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The owner of stlitware approves a single private endpoint connection for the two origins.
        fr: Le propriétaire de stlitware approuve une seule connexion de point de terminaison privé pour les deux origines.
    - id: s2
      text:
        en: Internet clients of afd-litware reach the Front Door edge through Private Link.
        fr: Les clients Internet d'afd-litware joignent la périphérie Front Door par Private Link.
    - id: s3
      text:
        en: Until the connection is approved, requests routed to these origins receive a Front Door error.
        fr: Tant que la connexion n'est pas approuvée, les requêtes routées vers ces origines reçoivent une erreur Front Door.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Within one profile, Private Link origins with the same resource ID, group ID and region share one private endpoint, so one approval covers both origins. Private Link only secures the leg from Front Door to the origin; clients still connect to the edge over the internet. Traffic flows privately only after the connection is approved, and requests receive a Front Door error until then.
    fr: "Dans un même profil, les origines Private Link qui ont le même ID de ressource, le même ID de groupe et la même région partagent un seul point de terminaison privé : une seule approbation couvre les deux origines. Private Link ne sécurise que le tronçon de Front Door vers l'origine ; les clients se connectent toujours à la périphérie par Internet. Le trafic ne circule en privé qu'après l'approbation de la connexion, et les requêtes reçoivent une erreur Front Door jusque-là."
references:
  - title: Secure your origin with Private Link in Azure Front Door Premium
    url: https://learn.microsoft.com/en-us/azure/frontdoor/private-link
