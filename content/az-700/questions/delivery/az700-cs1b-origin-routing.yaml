id: az700-cs1b-origin-routing
objective: "3.3.5"
type: yesno_statements
caseStudy: az700-cs1b-proseware
difficulty: 2
status: draft
stem:
  en: |
    You are configuring the origins of og-portal. The latency sensitivity of og-portal keeps its default value.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez les origines d'og-portal. La sensibilité à la latence d'og-portal conserve sa valeur par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If both origins have priority 1, each request is sent to the healthy origin that has the lowest latency from the Front Door environment that received the request.
        fr: Si les deux origines ont la priorité 1, chaque requête est envoyée à l'origine intègre dont la latence est la plus faible depuis l'environnement Front Door qui a reçu la requête.
    - id: s2
      text:
        en: If app-portal-ne has priority 1 and app-portal-eus has priority 2, students in North America are served by app-portal-eus while app-portal-ne is healthy.
        fr: Si app-portal-ne a la priorité 1 et app-portal-eus la priorité 2, les étudiants d'Amérique du Nord sont servis par app-portal-eus tant qu'app-portal-ne est intègre.
    - id: s3
      text:
        en: If both origins have priority 1 and app-portal-ne fails its health probes, requests from students in Europe are sent to app-portal-eus.
        fr: Si les deux origines ont la priorité 1 et qu'app-portal-ne échoue à ses sondes d'intégrité, les requêtes des étudiants européens sont envoyées à app-portal-eus.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Front Door first keeps the healthy origins, then the ones with the highest priority, then those within the latency sensitivity range of the fastest one, and finally applies the weights. With the default latency sensitivity of 0 ms and equal priorities, the fastest healthy origin receives the request, and an origin that fails its probes is skipped. With priorities 1 and 2, the priority 2 origin receives traffic only when no priority 1 origin is available, whatever the latency.
    fr: Front Door conserve d'abord les origines intègres, puis celles de plus haute priorité, puis celles qui sont dans la plage de sensibilité à la latence de la plus rapide, et applique enfin les poids. Avec la sensibilité à la latence par défaut de 0 ms et des priorités égales, l'origine intègre la plus rapide reçoit la requête, et une origine qui échoue à ses sondes est ignorée. Avec les priorités 1 et 2, l'origine de priorité 2 ne reçoit du trafic que lorsqu'aucune origine de priorité 1 n'est disponible, quelle que soit la latence.
references:
  - title: Traffic routing methods for origins
    url: https://learn.microsoft.com/en-us/azure/frontdoor/routing-methods
