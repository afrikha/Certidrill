id: az700-3a-agw-scaling-facts-yn
objective: "3.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has two application gateways:

    | Name | SKU | Scaling mode | Settings |
    | --- | --- | --- | --- |
    | AGW1 | Standard_v2 | Manual | Instance count: 3 |
    | AGW2 | WAF_v2 | Autoscaling | Minimum: 0, maximum: 20 |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose de deux passerelles d'application :

    | Nom | Référence SKU | Mode de mise à l'échelle | Paramètres |
    | --- | --- | --- | --- |
    | AGW1 | Standard_v2 | Manuel | Nombre d'instances : 3 |
    | AGW2 | WAF_v2 | Mise à l'échelle automatique | Minimum : 0, maximum : 20 |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If the traffic of AGW1 exceeds the capacity of three instances, AGW1 adds instances automatically.
        fr: Si le trafic d'AGW1 dépasse la capacité de trois instances, AGW1 ajoute automatiquement des instances.
    - id: s2
      text:
        en: AGW2 remains highly available even though its minimum instance count is 0.
        fr: AGW2 reste hautement disponible bien que son nombre minimal d'instances soit 0.
    - id: s3
      text:
        en: When AGW2 scales in, the existing connections of an instance being removed are drained before the instance is removed.
        fr: Lorsqu'AGW2 réduit son nombre d'instances, les connexions existantes d'une instance en cours de suppression sont drainées avant sa suppression.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      In manual mode the gateway does not autoscale, so traffic above the capacity of the configured instances can be lost. An autoscaling gateway with a minimum of 0 has no reserved capacity but is still highly available, which is included in the fixed price. On scale-in, the connections of the instance being removed are drained for 5 minutes before it is removed.
    fr: |
      En mode manuel, la passerelle ne se met pas à l'échelle automatiquement : le trafic qui dépasse la capacité des instances configurées peut être perdu. Une passerelle en mise à l'échelle automatique avec un minimum de 0 n'a pas de capacité réservée, mais reste hautement disponible, ce qui est inclus dans le prix fixe. Lors d'une réduction, les connexions de l'instance supprimée sont drainées pendant 5 minutes avant sa suppression.
references:
  - title: Scaling Application Gateway v2 and WAF v2
    url: https://learn.microsoft.com/en-us/azure/application-gateway/application-gateway-autoscaling-zone-redundant
