id: az700-3b-tier-upgrade
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware uses an Azure Front Door Standard profile named **afd-litware**. A WAF policy with custom rules is associated with its domains. Litware's security team now requires the Microsoft-managed default rule set.

    You need to meet the new requirement. The solution must avoid any downtime and keep the existing endpoints and custom domains.

    What should you do?
  fr: |
    Litware utilise un profil Azure Front Door Standard nommé **afd-litware**. Une stratégie WAF avec des règles personnalisées est associée à ses domaines. L'équipe de sécurité de Litware exige désormais l'ensemble de règles par défaut managé par Microsoft.

    Vous devez répondre à la nouvelle exigence. La solution doit éviter toute interruption et conserver les points de terminaison et les domaines personnalisés existants.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable the managed rule set in the existing WAF policy of afd-litware.", fr: "Activer l'ensemble de règles managé dans la stratégie WAF existante d'afd-litware." } }
    - { id: b, text: { en: "Create a Premium profile, re-create the endpoints and move the custom domains to it.", fr: "Créer un profil Premium, y recréer les points de terminaison et y déplacer les domaines personnalisés." } }
    - { id: c, text: { en: "Upgrade afd-litware to Premium, and then enable the managed rules in the copied WAF policy.", fr: "Mettre à niveau afd-litware vers Premium, puis activer les règles managées dans la stratégie WAF copiée." } }
    - { id: d, text: { en: "Associate an Application Gateway WAF policy with the domains of afd-litware.", fr: "Associer une stratégie WAF d'Application Gateway aux domaines d'afd-litware." } }
answer: { optionId: c }
explanation:
  correct:
    en: A Standard profile upgrades in place to Premium without downtime, keeping its endpoints and domains. During the upgrade, the WAF policies are copied to new Premium policies; you then enable the managed rules in those copies manually.
    fr: "Un profil Standard se met à niveau sur place vers Premium sans interruption, en conservant ses points de terminaison et ses domaines. Pendant la mise à niveau, les stratégies WAF sont copiées dans de nouvelles stratégies Premium ; vous activez ensuite manuellement les règles managées dans ces copies."
  options:
    a: { en: "Managed rule sets are not available in Front Door Standard.", fr: "Les ensembles de règles managés ne sont pas disponibles dans Front Door Standard." }
    b: { en: "A new profile and a domain move cause unnecessary work and a risk of downtime; the in-place upgrade avoids both.", fr: "Un nouveau profil et le déplacement des domaines entraînent un travail inutile et un risque d'interruption ; la mise à niveau sur place évite les deux." }
    d: { en: "Front Door uses Front Door WAF policies; an Application Gateway WAF policy cannot be associated with its domains.", fr: "Front Door utilise des stratégies WAF Front Door ; une stratégie WAF d'Application Gateway ne peut pas être associée à ses domaines." }
references:
  - title: Upgrade from Azure Front Door Standard to Premium
    url: https://learn.microsoft.com/en-us/azure/frontdoor/tier-upgrade
