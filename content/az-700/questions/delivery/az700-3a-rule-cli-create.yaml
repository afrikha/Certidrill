id: az700-3a-rule-cli-create
objective: "3.1.9"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a public Standard load balancer named **LB1** with a frontend IP configuration named **FE1**, a backend pool named **Pool1** and a health probe named **Probe8443**. The application on the backend virtual machines listens on TCP port 8443.

    You need to create a load-balancing rule that meets the following requirements:

    - Clients connect to FE1 on TCP port 443.
    - Requests from the same client IP address and protocol are sent to the same virtual machine.
    - Outbound connectivity of the virtual machines will be provided by an outbound rule that you will create on FE1.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un équilibreur de charge public Standard nommé **LB1**, avec une configuration IP frontale nommée **FE1**, un pool principal nommé **Pool1** et une sonde d'intégrité nommée **Probe8443**. L'application des machines virtuelles principales écoute sur le port TCP 8443.

    Vous devez créer une règle d'équilibrage de charge qui répond aux exigences suivantes :

    - Les clients se connectent à FE1 sur le port TCP 443.
    - Les requêtes provenant d'une même adresse IP cliente et d'un même protocole sont envoyées vers la même machine virtuelle.
    - La connectivité sortante des machines virtuelles sera fournie par une règle de trafic sortant que vous créerez sur FE1.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network lb rule create \
      --resource-group RG1 \
      --lb-name LB1 \
      --name Rule443 \
      --protocol Tcp \
      --frontend-ip FE1 \
      --frontend-port 443 \
      --backend-pool-name Pool1 \
      --backend-port [[bport]] \
      --probe-name Probe8443 \
      --load-distribution [[dist]] \
      --disable-outbound-snat [[snat]]
  slots:
    - id: bport
      options:
        - { id: p443, text: "443" }
        - { id: p8443, text: "8443" }
        - { id: p0, text: "0" }
    - id: dist
      options:
        - { id: default, text: Default }
        - { id: sourceip, text: SourceIP }
        - { id: sourceipproto, text: SourceIPProtocol }
    - id: snat
      options:
        - { id: strue, text: "true" }
        - { id: sfalse, text: "false" }
answer:
  values: { bport: p8443, dist: sourceipproto, snat: strue }
explanation:
  correct:
    en: |
      The backend port is the port the application listens on (8443), while the frontend port is the one clients use (443). SourceIPProtocol is the three-tuple distribution (client IP and protocol). An outbound rule can reuse the frontend IP of a load-balancing rule only if outbound SNAT is disabled on that rule, so `--disable-outbound-snat true` is required.
    fr: |
      Le port principal est celui sur lequel l'application écoute (8443), tandis que le port frontal est celui qu'utilisent les clients (443). SourceIPProtocol correspond à la distribution à trois tuples (IP cliente et protocole). Une règle de trafic sortant ne peut réutiliser l'IP frontale d'une règle d'équilibrage de charge que si la SNAT sortante est désactivée sur cette règle : `--disable-outbound-snat true` est donc obligatoire.
  options:
    p443: { en: "Nothing listens on port 443 on the VMs.", fr: "Rien n'écoute sur le port 443 des machines virtuelles." }
    p0: { en: "Port 0 is used with the protocol All for HA ports rules on internal load balancers.", fr: "Le port 0 s'utilise avec le protocole All pour les règles de ports HA des équilibreurs de charge internes." }
    default: { en: "Default is the five-tuple hash, without client affinity.", fr: "Default correspond au hachage à cinq tuples, sans affinité client." }
    sourceip: { en: "SourceIP is the two-tuple mode; it ignores the protocol.", fr: "SourceIP correspond au mode à deux tuples ; il ignore le protocole." }
    sfalse: { en: "With implicit SNAT left enabled, defining FE1 in an outbound rule fails.", fr: "Si la SNAT implicite reste activée, la définition de FE1 dans une règle de trafic sortant échoue." }
references:
  - title: az network lb rule
    url: https://learn.microsoft.com/en-us/cli/azure/network/lb/rule?view=azure-cli-latest
  - title: Outbound rules for Azure Load Balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/outbound-rules
