id: az700-3a-agw-pool-onprem
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has an Application Gateway Standard_v2 named **AGW1** in a virtual network that is connected to the on-premises network by ExpressRoute. Two web servers remain on-premises at 192.168.20.11 and 192.168.20.12. Network security groups and on-premises firewalls allow traffic from the AGW1 subnet to the servers.

    You need AGW1 to load-balance requests to the two on-premises servers.

    What should you do?
  fr: |
    Litware dispose d'un Application Gateway Standard_v2 nommé **AGW1** dans un réseau virtuel connecté au réseau local par ExpressRoute. Deux serveurs web restent en local, aux adresses 192.168.20.11 et 192.168.20.12. Les groupes de sécurité réseau et les pare-feu locaux autorisent le trafic du sous-réseau d'AGW1 vers les serveurs.

    AGW1 doit équilibrer la charge des requêtes entre les deux serveurs locaux.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the ExpressRoute virtual network gateway to a backend pool of AGW1.", fr: "Ajouter la passerelle de réseau virtuel ExpressRoute à un pool principal d'AGW1." } }
    - { id: b, text: { en: "Add 192.168.20.11 and 192.168.20.12 to a backend pool of AGW1 as IP address targets.", fr: "Ajouter 192.168.20.11 et 192.168.20.12 à un pool principal d'AGW1 en tant que cibles de type adresse IP." } }
    - { id: c, text: { en: "Create a Traffic Manager profile with the servers as external endpoints and add the profile to a backend pool of AGW1.", fr: "Créer un profil Traffic Manager avec les serveurs comme points de terminaison externes et ajouter le profil à un pool principal d'AGW1." } }
    - { id: d, text: { en: "Deploy an internal Standard load balancer whose backend pool contains the two on-premises IP addresses.", fr: "Déployer un équilibreur de charge interne Standard dont le pool principal contient les deux adresses IP locales." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An Application Gateway backend pool can contain internal IP addresses or FQDNs of servers outside the gateway's virtual network, including on-premises servers reached over ExpressRoute or VPN, as long as there is IP connectivity.
    fr: |
      Un pool principal Application Gateway peut contenir des adresses IP internes ou des noms de domaine complets (FQDN) de serveurs situés hors du réseau virtuel de la passerelle, y compris des serveurs locaux joints par ExpressRoute ou VPN, tant que la connectivité IP existe.
  options:
    a: { en: "The ExpressRoute gateway routes traffic; it does not host the web application.", fr: "La passerelle ExpressRoute route le trafic ; elle n'héberge pas l'application web." }
    c: { en: "Traffic Manager only answers DNS queries and is not needed: AGW1 can target the servers directly.", fr: "Traffic Manager se contente de répondre aux requêtes DNS et n'est pas nécessaire : AGW1 peut cibler directement les serveurs." }
    d: { en: "The backend pool of an Azure load balancer is limited to resources in a single virtual network; it cannot contain on-premises servers.", fr: "Le pool principal d'un équilibreur de charge Azure est limité aux ressources d'un même réseau virtuel ; il ne peut pas contenir de serveurs locaux." }
references:
  - title: Application gateway components
    url: https://learn.microsoft.com/en-us/azure/application-gateway/application-gateway-components
