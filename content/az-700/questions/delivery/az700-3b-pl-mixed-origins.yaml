id: az700-3b-pl-mixed-origins
objective: "3.3.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an Azure Front Door Premium profile. The route of www.contoso.com uses an origin group named **og-web** that contains one origin, **app-we**, an App Service app in West Europe reached over its public endpoint.

    Contoso deploys a second App Service app, **app-ne**, in North Europe with public network access disabled. You need app-ne to serve part of the traffic of www.contoso.com, both apps receiving traffic at the same time. Front Door must reach app-ne only through Private Link.

    What should you do?
  fr: |
    Contoso dispose d'un profil Azure Front Door Premium. L'itinéraire de www.contoso.com utilise un groupe d'origines nommé **og-web** qui contient une origine, **app-we**, une application App Service en West Europe jointe par son point de terminaison public.

    Contoso déploie une seconde application App Service, **app-ne**, en North Europe avec l'accès réseau public désactivé. app-ne doit servir une partie du trafic de www.contoso.com, les deux applications recevant du trafic en même temps. Front Door doit joindre app-ne uniquement par Private Link.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add app-ne to og-web with Private Link enabled, and keep app-we on its public endpoint.", fr: "Ajouter app-ne à og-web avec Private Link activé, et conserver app-we sur son point de terminaison public." } }
    - { id: b, text: { en: "Create a private endpoint for app-ne in a Contoso virtual network, and add its private IP address to og-web as a custom origin.", fr: "Créer un point de terminaison privé pour app-ne dans un réseau virtuel Contoso, et ajouter son adresse IP privée à og-web comme origine personnalisée." } }
    - { id: c, text: { en: "Create an origin group named og-private for app-ne, and add it to the route of www.contoso.com next to og-web.", fr: "Créer un groupe d'origines nommé og-private pour app-ne, et l'ajouter à l'itinéraire de www.contoso.com à côté d'og-web." } }
    - { id: d, text: { en: "Enable Private Link on app-we, approve its connection, and then add app-ne to og-web with Private Link enabled.", fr: "Activer Private Link sur app-we, approuver sa connexion, puis ajouter app-ne à og-web avec Private Link activé." } }
answer: { optionId: d }
explanation:
  correct:
    en: Front Door doesn't allow public and private origins in the same origin group, and a route sends its traffic to one origin group. Converting app-we to a Private Link origin first, then adding app-ne with Private Link, keeps both apps in og-web so that they share the traffic. Enabling Private Link on the origins one at a time, approving each connection, avoids the mixed-state error.
    fr: "Front Door n'autorise pas des origines publiques et privées dans le même groupe d'origines, et un itinéraire envoie son trafic vers un seul groupe d'origines. Convertir d'abord app-we en origine Private Link, puis ajouter app-ne avec Private Link, conserve les deux applications dans og-web pour qu'elles se partagent le trafic. Activer Private Link sur les origines une par une, en approuvant chaque connexion, évite l'erreur d'état mixte."
  options:
    a: { en: "An origin group cannot mix a public origin and a Private Link origin.", fr: "Un groupe d'origines ne peut pas mélanger une origine publique et une origine Private Link." }
    b: { en: "Front Door cannot reach a private IP address in your virtual network; Private Link origins use endpoints that Front Door creates and manages.", fr: "Front Door ne peut pas joindre une adresse IP privée de votre réseau virtuel ; les origines Private Link utilisent des points de terminaison que Front Door crée et gère." }
    c: { en: "A route has a single origin group, so app-ne would not share the traffic of www.contoso.com.", fr: "Un itinéraire n'a qu'un seul groupe d'origines : app-ne ne partagerait pas le trafic de www.contoso.com." }
references:
  - title: Secure your origin with Private Link in Azure Front Door Premium
    url: https://learn.microsoft.com/en-us/azure/frontdoor/private-link
