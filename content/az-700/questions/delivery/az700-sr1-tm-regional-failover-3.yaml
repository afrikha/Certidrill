id: az700-sr1-tm-regional-failover-3
objective: "3.1.7"
type: series_yesno
series: az700-sr1-tm-regional-failover
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You create one profile that uses the Geographic routing method with the two deployments as endpoints.
  fr: |
    Vous créez un profil qui utilise la méthode de routage Geographic avec les deux déploiements comme points de terminaison.
body:
  solution:
    en: |
      You create one Traffic Manager profile that uses the **Geographic** routing method. You add App-WE as an external endpoint mapped to **Europe**, and App-EUS as an external endpoint mapped to **World**.
    fr: |
      Vous créez un profil Traffic Manager qui utilise la méthode de routage **Geographic**. Vous ajoutez App-WE comme point de terminaison externe associé à **Europe**, et App-EUS comme point de terminaison externe associé à **World**.
answer: { value: false }
explanation:
  correct:
    en: |
      The mapping meets the first requirement, but with Geographic routing a region can be mapped to only one endpoint, and Traffic Manager returns that endpoint whether it's healthy or not. If App-WE becomes unhealthy, users from Europe are still sent to it, so there's no failover. Each geographic mapping must point to a nested child profile that contains both deployments.
    fr: |
      L'association répond à la première exigence, mais avec le routage Geographic une région ne peut être associée qu'à un seul point de terminaison, et Traffic Manager renvoie ce point de terminaison qu'il soit intègre ou non. Si App-WE devient non intègre, les utilisateurs d'Europe y sont toujours envoyés : il n'y a pas de basculement. Chaque association géographique doit pointer vers un profil enfant imbriqué qui contient les deux déploiements.
references:
  - title: Traffic Manager routing methods
    url: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-routing-methods
