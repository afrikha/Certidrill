id: az700-3b-cache-purge
objective: "3.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso serves the JavaScript files of its website from the `/scripts/` folder through an Azure Front Door Standard route with caching enabled. The origin sets `Cache-Control: max-age=604800` on these files.

    Developers have just deployed a fix to several files in `/scripts/` without changing their names. Users must receive the new files as soon as possible. Other cached content must stay in the cache.

    What should you do?
  fr: |
    Contoso sert les fichiers JavaScript de son site web depuis le dossier `/scripts/` au moyen d'un itinéraire Azure Front Door Standard avec la mise en cache activée. L'origine définit `Cache-Control: max-age=604800` sur ces fichiers.

    Les développeurs viennent de déployer un correctif sur plusieurs fichiers de `/scripts/` sans changer leur nom. Les utilisateurs doivent recevoir les nouveaux fichiers dès que possible. Le reste du contenu mis en cache doit rester dans le cache.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Purge the endpoint for the path /*.", fr: "Purger le point de terminaison pour le chemin /*." } }
    - { id: b, text: { en: "Purge the endpoint for the path /scripts/*.", fr: "Purger le point de terminaison pour le chemin /scripts/*." } }
    - { id: c, text: { en: "Change the query string caching behavior of the route to Use Query String.", fr: "Remplacer le comportement de mise en cache des chaînes de requête de l'itinéraire par Use Query String." } }
    - { id: d, text: { en: "Disable caching on the route, and then enable it again.", fr: "Désactiver la mise en cache sur l'itinéraire, puis la réactiver." } }
answer: { optionId: b }
explanation:
  correct:
    en: A purge removes cached assets before their TTL expires. A wildcard purge such as `/scripts/*` removes every file under that folder, including all query string variations, and leaves the rest of the cache untouched.
    fr: "Une purge supprime les éléments mis en cache avant l'expiration de leur durée de vie. Une purge générique comme `/scripts/*` supprime tous les fichiers de ce dossier, y compris toutes les variantes de chaîne de requête, et laisse le reste du cache intact."
  options:
    a: { en: "Purging /* removes all the cached content, which the requirements forbid.", fr: "Purger /* supprime tout le contenu mis en cache, ce que les exigences interdisent." }
    c: { en: "Changing the cache key does not remove the cached copies requested without a query string.", fr: "Modifier la clé de cache ne supprime pas les copies mises en cache demandées sans chaîne de requête." }
    d: { en: "Toggling caching on the route is not a way to remove content from the PoP caches, and it affects every file of the route.", fr: "Désactiver puis réactiver la mise en cache n'est pas un moyen de supprimer le contenu des caches des POP, et cela touche tous les fichiers de l'itinéraire." }
references:
  - title: Caching with Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-caching
