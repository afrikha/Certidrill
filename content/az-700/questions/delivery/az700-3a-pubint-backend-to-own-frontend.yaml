id: az700-3a-pubint-backend-to-own-frontend
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has an internal Standard load balancer named **ILB1** with the frontend IP address 10.1.2.10. A load-balancing rule forwards TCP port 8080 to a backend pool that contains VM1, VM2 and VM3. The network security groups allow all traffic inside the virtual network.

    An administrator reports the following:

    - VM4, which is in the same subnet but not in the backend pool, connects successfully to 10.1.2.10:8080.
    - A scheduled job on VM3 that calls 10.1.2.10:8080 fails intermittently or completely.

    What is the cause of the issue?
  fr: |
    Litware dispose d'un équilibreur de charge interne Standard nommé **ILB1**, dont l'adresse IP frontale est 10.1.2.10. Une règle d'équilibrage de charge transfère le port TCP 8080 vers un pool principal qui contient VM1, VM2 et VM3. Les groupes de sécurité réseau autorisent tout le trafic à l'intérieur du réseau virtuel.

    Un administrateur signale ce qui suit :

    - VM4, qui se trouve dans le même sous-réseau mais pas dans le pool principal, se connecte correctement à 10.1.2.10:8080.
    - Une tâche planifiée sur VM3 qui appelle 10.1.2.10:8080 échoue par intermittence ou totalement.

    Quelle est la cause du problème ?
body:
  options:
    - { id: a, text: { en: "The AzureLoadBalancer service tag must be allowed as a source in the NSG of VM3 for outbound traffic.", fr: "L'étiquette de service AzureLoadBalancer doit être autorisée comme source dans le NSG de VM3 pour le trafic sortant." } }
    - { id: b, text: { en: "Session persistence is set to None, so the flows from VM3 are hashed to an unhealthy instance.", fr: "La persistance de session est définie sur None : les flux de VM3 sont donc hachés vers une instance non saine." } }
    - { id: c, text: { en: "A flow from a backend instance to the frontend of the internal load balancer that it belongs to is not supported.", fr: "Un flux d'une instance principale vers le front-end de l'équilibreur de charge interne auquel elle appartient n'est pas pris en charge." } }
    - { id: d, text: { en: "An internal load balancer accepts traffic only from subnets other than the subnet of its backend pool.", fr: "Un équilibreur de charge interne n'accepte le trafic que depuis des sous-réseaux autres que celui de son pool principal." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure Load Balancer documents that an outbound flow from a backend VM to the frontend of the internal load balancer it is a member of fails. When the hash selects VM3 itself, the connection breaks. The job should call the application on the local VM or through a separate frontend or load balancer whose pool does not contain VM3.
    fr: |
      La documentation d'Azure Load Balancer indique qu'un flux sortant d'une machine virtuelle principale vers le front-end de l'équilibreur de charge interne dont elle est membre échoue. Lorsque le hachage sélectionne VM3 elle-même, la connexion échoue. La tâche devrait appeler l'application localement ou par un autre équilibreur de charge dont le pool ne contient pas VM3.
  options:
    a: { en: "Rules that use the AzureLoadBalancer tag concern inbound health probe traffic, and the NSGs already allow all virtual network traffic.", fr: "Les règles utilisant l'étiquette AzureLoadBalancer concernent le trafic entrant des sondes d'intégrité, et les NSG autorisent déjà tout le trafic du réseau virtuel." }
    b: { en: "Unhealthy instances never receive new flows, whatever the distribution mode; nothing indicates that a probe is failing.", fr: "Les instances non saines ne reçoivent jamais de nouveaux flux, quel que soit le mode de distribution ; rien n'indique qu'une sonde échoue." }
    d: { en: "VM4 is in the same subnet and connects successfully, so the subnet is not the issue.", fr: "VM4 se trouve dans le même sous-réseau et se connecte correctement : le sous-réseau n'est pas en cause." }
references:
  - title: Azure Load Balancer Components Overview
    url: https://learn.microsoft.com/en-us/azure/load-balancer/components
