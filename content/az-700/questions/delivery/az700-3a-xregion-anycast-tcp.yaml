id: az700-3a-xregion-anycast-tcp
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin runs a TCP application on port 6000 in two regions. In each region, the virtual machines are behind a regional public Standard load balancer.

    You need to provide global access to the application. The solution must meet the following requirements:

    - Clients must use one static public IP address, whatever their location.
    - Clients must be routed to the closest healthy region, and failover must not depend on DNS caching.
    - The virtual machines must see the original client IP address.

    What should you deploy?
  fr: |
    Tailspin exécute une application TCP sur le port 6000 dans deux régions. Dans chaque région, les machines virtuelles se trouvent derrière un équilibreur de charge public Standard régional.

    Vous devez fournir un accès mondial à l'application. La solution doit répondre aux exigences suivantes :

    - Les clients doivent utiliser une seule adresse IP publique statique, quel que soit leur emplacement.
    - Les clients doivent être dirigés vers la région saine la plus proche, et le basculement ne doit pas dépendre de la mise en cache DNS.
    - Les machines virtuelles doivent voir l'adresse IP d'origine du client.

    Que devez-vous déployer ?
body:
  options:
    - { id: a, text: { en: "A Traffic Manager profile with the Performance routing method and the two regional frontends as endpoints", fr: "Un profil Traffic Manager avec la méthode de routage Performance et les deux front-ends régionaux comme points de terminaison" } }
    - { id: b, text: { en: "An Azure Front Door Premium profile with the two regional frontends as origins", fr: "Un profil Azure Front Door Premium avec les deux front-ends régionaux comme origines" } }
    - { id: c, text: { en: "An Application Gateway Standard_v2 in each region with a TCP listener on port 6000", fr: "Un Application Gateway Standard_v2 dans chaque région avec un écouteur TCP sur le port 6000" } }
    - { id: d, text: { en: "A global (cross-region) load balancer whose backend pool contains the two regional load balancers", fr: "Un équilibreur de charge global (interrégions) dont le pool principal contient les deux équilibreurs de charge régionaux" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A global load balancer (Standard SKU, Global tier) advertises a static anycast public IP from many Azure regions, sends each client to the closest healthy regional load balancer, and fails over without DNS changes. As a layer 4 pass-through service, it preserves the client IP address.
    fr: |
      Un équilibreur de charge global (référence SKU Standard, niveau Global) annonce une IP publique anycast statique depuis de nombreuses régions Azure, envoie chaque client vers l'équilibreur de charge régional sain le plus proche et bascule sans modification DNS. En tant que service pass-through de couche 4, il conserve l'adresse IP du client.
  options:
    a: { en: "Traffic Manager returns a different IP address per region and relies on DNS, so failover is delayed by DNS caching.", fr: "Traffic Manager renvoie une adresse IP différente selon la région et repose sur le DNS : le basculement est retardé par la mise en cache DNS." }
    b: { en: "Azure Front Door handles HTTP(S) traffic only, not a custom TCP protocol on port 6000.", fr: "Azure Front Door ne traite que le trafic HTTP(S), pas un protocole TCP personnalisé sur le port 6000." }
    c: { en: "Two regional gateways give two IP addresses and no global routing, and a terminating proxy does not pass the client IP as the TCP source.", fr: "Deux passerelles régionales fournissent deux adresses IP sans routage mondial, et un proxy de terminaison ne transmet pas l'adresse IP du client comme source TCP." }
references:
  - title: Global load balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/cross-region-overview
