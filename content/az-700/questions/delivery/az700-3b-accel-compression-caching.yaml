id: az700-3b-accel-compression-caching
objective: "3.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You manage an Azure Front Door Standard profile. A route named **route-docs** serves large HTML and CSS files from an App Service origin. Caching is disabled on route-docs.

    You need Front Door to compress the HTML and CSS files before it sends them to the browsers. In the route settings, the **Enable compression** option is not displayed.

    What should you do first?
  fr: |
    Vous gérez un profil Azure Front Door Standard. Un itinéraire nommé **route-docs** sert des fichiers HTML et CSS volumineux depuis une origine App Service. La mise en cache est désactivée sur route-docs.

    Front Door doit compresser les fichiers HTML et CSS avant de les envoyer aux navigateurs. Dans les paramètres de l'itinéraire, l'option **Activer la compression** n'apparaît pas.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Upgrade the profile to Premium.", fr: "Mettre à niveau le profil vers Premium." } }
    - { id: b, text: { en: "Add a rule that sets the Accept-Encoding request header to gzip.", fr: "Ajouter une règle qui définit l'en-tête de requête Accept-Encoding sur gzip." } }
    - { id: c, text: { en: "Select Enable caching on route-docs.", fr: "Sélectionner Activer la mise en cache sur route-docs." } }
    - { id: d, text: { en: "Set the forwarding protocol of route-docs to HTTPS only.", fr: "Définir le protocole de transfert de route-docs sur HTTPS uniquement." } }
answer: { optionId: c }
explanation:
  correct:
    en: In Front Door Standard and Premium, compression is part of the caching settings of the route; the Enable compression checkbox appears only once Enable caching is selected. You can then adjust the list of MIME types to compress.
    fr: "Dans Front Door Standard et Premium, la compression fait partie des paramètres de mise en cache de l'itinéraire ; la case Activer la compression n'apparaît qu'une fois Activer la mise en cache sélectionnée. Vous pouvez ensuite ajuster la liste des types MIME à compresser."
  options:
    a: { en: "Compression with gzip and Brotli is available in both tiers.", fr: "La compression gzip et Brotli est disponible dans les deux niveaux." }
    b: { en: "Accept-Encoding only tells the server which encodings the client supports; it doesn't enable compression in Front Door.", fr: "Accept-Encoding indique seulement au serveur les encodages pris en charge par le client ; il n'active pas la compression dans Front Door." }
    d: { en: "The forwarding protocol encrypts the origin leg; it has no effect on compression.", fr: "Le protocole de transfert chiffre le tronçon vers l'origine ; il n'a aucun effet sur la compression." }
references:
  - title: Improve performance by compressing files in Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/frontdoor/standard-premium/how-to-compression
