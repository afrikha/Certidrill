id: az700-3a-lb-standard-behaviors-yn
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a public Standard load balancer named **LB1**. The backend pool of LB1 contains three virtual machines in a subnet named **Web**. LB1 has one load-balancing rule for TCP port 443 that uses a TCP health probe on port 443.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un équilibreur de charge public Standard nommé **LB1**. Le pool principal de LB1 contient trois machines virtuelles dans un sous-réseau nommé **Web**. LB1 dispose d'une règle d'équilibrage de charge pour le port TCP 443, qui utilise une sonde d'intégrité TCP sur le port 443.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If the health probe of one virtual machine fails, the TCP connections already established to that virtual machine continue.
        fr: Si la sonde d'intégrité d'une machine virtuelle échoue, les connexions TCP déjà établies vers cette machine virtuelle se poursuivent.
    - id: s2
      text:
        en: If no network security group is associated with the Web subnet or with the network interfaces of the virtual machines, internet clients can reach the virtual machines through the frontend of LB1.
        fr: Si aucun groupe de sécurité réseau n'est associé au sous-réseau Web ni aux interfaces réseau des machines virtuelles, les clients Internet peuvent joindre les machines virtuelles par le front-end de LB1.
    - id: s3
      text:
        en: The health probe requests received by the virtual machines originate from the IP address 168.63.129.16.
        fr: Les requêtes de sonde d'intégrité reçues par les machines virtuelles proviennent de l'adresse IP 168.63.129.16.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      When a probe fails, a Standard load balancer stops sending new connections to the instance but lets established TCP connections continue. Standard load balancers and Standard public IP addresses are secure by default, so inbound traffic is blocked unless a network security group explicitly allows it; without any NSG, the traffic is not allowed. All IPv4 health probes originate from 168.63.129.16, which the AzureLoadBalancer service tag covers.
    fr: |
      Lorsqu'une sonde échoue, un équilibreur de charge Standard n'envoie plus de nouvelles connexions à l'instance, mais laisse les connexions TCP établies se poursuivre. Les équilibreurs de charge et les adresses IP publiques Standard sont sécurisés par défaut : le trafic entrant est bloqué tant qu'un groupe de sécurité réseau ne l'autorise pas explicitement ; sans NSG, il n'est pas autorisé. Toutes les sondes d'intégrité IPv4 proviennent de 168.63.129.16, couverte par l'étiquette de service AzureLoadBalancer.
  options:
    s2: { en: "Secure by default: without an NSG that allows it, inbound traffic to a Standard load balancer backend is blocked.", fr: "Sécurisé par défaut : sans NSG qui l'autorise, le trafic entrant vers le back-end d'un équilibreur de charge Standard est bloqué." }
references:
  - title: Azure Load Balancer health probes
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview
  - title: What is Azure Load Balancer?
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-overview
