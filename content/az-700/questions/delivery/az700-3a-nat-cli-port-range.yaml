id: az700-3a-nat-cli-port-range
objective: "3.1.10"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a public Standard load balancer named **LB1** with a frontend IP configuration named **FE1** and a backend pool named **Pool1** that contains up to 100 Windows Server virtual machines.

    You need administrators to reach each virtual machine by using Remote Desktop on FE1, with one frontend port per virtual machine in the range 50000 to 50099.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un équilibreur de charge public Standard nommé **LB1**, avec une configuration IP frontale nommée **FE1** et un pool principal nommé **Pool1** qui contient jusqu'à 100 machines virtuelles Windows Server.

    Les administrateurs doivent pouvoir joindre chaque machine virtuelle en Bureau à distance par FE1, avec un port frontal par machine virtuelle dans la plage 50000 à 50099.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network lb inbound-nat-rule create \
      --resource-group RG1 \
      --lb-name LB1 \
      --name NatRdp \
      --protocol Tcp \
      --frontend-ip FE1 \
      [[start]] 50000 \
      --frontend-port-range-end 50099 \
      --backend-port [[bport]] \
      --backend-pool-name Pool1
  slots:
    - id: start
      options:
        - { id: rangestart, text: "--frontend-port-range-start" }
        - { id: fport, text: "--frontend-port" }
        - { id: idle, text: "--idle-timeout" }
    - id: bport
      options:
        - { id: rdp, text: "3389" }
        - { id: ssh, text: "22" }
        - { id: same, text: "50000" }
answer:
  values: { start: rangestart, bport: rdp }
explanation:
  correct:
    en: |
      When an inbound NAT rule targets a backend pool, `--frontend-port-range-start` and `--frontend-port-range-end` define the frontend ports, and a mapping is created for each backend address. All the mappings forward to the same backend port, 3389 for Remote Desktop.
    fr: |
      Lorsqu'une règle NAT de trafic entrant cible un pool principal, `--frontend-port-range-start` et `--frontend-port-range-end` définissent les ports frontaux, et une association est créée pour chaque adresse principale. Toutes les associations transfèrent vers le même port principal, 3389 pour le Bureau à distance.
  options:
    fport: { en: "--frontend-port defines a single port for a rule that targets one VM.", fr: "--frontend-port définit un port unique pour une règle qui cible une seule machine virtuelle." }
    idle: { en: "--idle-timeout sets the TCP idle timeout in minutes, not a port.", fr: "--idle-timeout définit le délai d'inactivité TCP en minutes, pas un port." }
    ssh: { en: "Port 22 is SSH, not Remote Desktop.", fr: "Le port 22 correspond à SSH, pas au Bureau à distance." }
    same: { en: "The VMs listen for RDP on 3389; the frontend ports are translated to that backend port.", fr: "Les machines virtuelles écoutent RDP sur le port 3389 ; les ports frontaux sont traduits vers ce port principal." }
references:
  - title: az network lb inbound-nat-rule
    url: https://learn.microsoft.com/en-us/cli/azure/network/lb/inbound-nat-rule?view=azure-cli-latest
