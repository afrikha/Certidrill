id: az700-3a-agw-v2-facts-yn
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum deploys an Application Gateway Standard_v2 named **AGW1** with a public frontend IP address. AGW1 publishes a chat application that uses WebSocket and a web portal that uses HTTPS.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum déploie un Application Gateway Standard_v2 nommé **AGW1** avec une adresse IP frontale publique. AGW1 publie une application de conversation qui utilise WebSocket et un portail web qui utilise HTTPS.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The frontend public IP address of AGW1 stays the same after AGW1 is stopped and started.
        fr: L'adresse IP publique frontale d'AGW1 reste la même après un arrêt et un redémarrage d'AGW1.
    - id: s2
      text:
        en: WebSocket support must be enabled on the listener before AGW1 accepts WebSocket connections.
        fr: La prise en charge de WebSocket doit être activée sur l'écouteur avant qu'AGW1 accepte des connexions WebSocket.
    - id: s3
      text:
        en: You can deploy virtual machines in the subnet of AGW1 if the subnet has enough free IP addresses.
        fr: Vous pouvez déployer des machines virtuelles dans le sous-réseau d'AGW1 s'il contient suffisamment d'adresses IP libres.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The v2 SKU supports only a static VIP, which doesn't change over the life of the deployment, even after a restart. WebSocket is natively supported and there is no setting to enable or disable it. Application Gateway requires a dedicated subnet; other application gateways can share it, but no other resource can be deployed there.
    fr: |
      La référence SKU v2 ne prend en charge qu'une adresse VIP statique, qui ne change pas pendant toute la durée de vie du déploiement, même après un redémarrage. WebSocket est pris en charge nativement et aucun paramètre ne permet de l'activer ou de le désactiver. Application Gateway nécessite un sous-réseau dédié ; d'autres passerelles d'application peuvent le partager, mais aucune autre ressource ne peut y être déployée.
references:
  - title: What is Azure Application Gateway v2?
    url: https://learn.microsoft.com/en-us/azure/application-gateway/overview-v2
  - title: Application Gateway infrastructure configuration
    url: https://learn.microsoft.com/en-us/azure/application-gateway/configuration-infrastructure
