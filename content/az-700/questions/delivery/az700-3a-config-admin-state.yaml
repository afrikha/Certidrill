id: az700-3a-config-admin-state
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a public Standard load balancer named **LB1**. A load-balancing rule for TCP port 443 uses an HTTPS health probe and a NIC-based backend pool that contains VM1, VM2 and VM3.

    You must patch VM2. During the maintenance:

    - VM2 must stop receiving new connections from LB1, even if it still answers the health probe;
    - established TCP connections to VM2 must be allowed to finish;
    - VM2 must remain a member of the backend pool, and the probe and network security group configurations must not change.

    What should you do?
  fr: |
    Northwind dispose d'un équilibreur de charge public Standard nommé **LB1**. Une règle d'équilibrage de charge pour le port TCP 443 utilise une sonde d'intégrité HTTPS et un pool principal basé sur les cartes réseau qui contient VM1, VM2 et VM3.

    Vous devez appliquer des correctifs à VM2. Pendant la maintenance :

    - VM2 ne doit plus recevoir de nouvelles connexions de LB1, même si elle répond toujours à la sonde d'intégrité ;
    - les connexions TCP établies vers VM2 doivent pouvoir se terminer ;
    - VM2 doit rester membre du pool principal, et les configurations de la sonde et des groupes de sécurité réseau ne doivent pas changer.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the admin state of VM2 in the backend pool to Down.", fr: "Définir l'état d'administration (Admin State) de VM2 dans le pool principal sur Down." } }
    - { id: b, text: { en: "Set the admin state of VM2 in the backend pool to Up.", fr: "Définir l'état d'administration (Admin State) de VM2 dans le pool principal sur Up." } }
    - { id: c, text: { en: "Set session persistence on the rule to Client IP.", fr: "Définir la persistance de session de la règle sur Client IP." } }
    - { id: d, text: { en: "Disable TCP reset on the load-balancing rule.", fr: "Désactiver TCP reset sur la règle d'équilibrage de charge." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Admin state overrides the health probe for one backend pool instance. Down stops new connections whatever the probe returns, while established TCP connections persist, like a probe-down. It applies to probed load-balancing rules, which is the case here, and VM2 stays in the pool.
    fr: |
      L'état d'administration remplace le résultat de la sonde d'intégrité pour une instance du pool principal. Down bloque les nouvelles connexions quel que soit le résultat de la sonde, tandis que les connexions TCP établies se poursuivent, comme lors d'un échec de sonde. Il s'applique aux règles d'équilibrage de charge dotées d'une sonde, ce qui est le cas ici, et VM2 reste dans le pool.
  options:
    b: { en: "Up forces the instance to be eligible for new connections even if the probe fails, which is the opposite of the goal.", fr: "Up rend l'instance éligible aux nouvelles connexions même si la sonde échoue, soit l'inverse de l'objectif." }
    c: { en: "Session persistence would keep sending returning clients to VM2; it cannot exclude an instance.", fr: "La persistance de session continuerait d'envoyer les clients récurrents vers VM2 ; elle ne peut pas exclure une instance." }
    d: { en: "TCP reset only controls whether idle flows are reset at idle timeout; it does not stop new connections.", fr: "TCP reset détermine seulement si les flux inactifs sont réinitialisés à l'expiration du délai ; il n'empêche pas les nouvelles connexions." }
references:
  - title: Administrative State (Admin State) in Azure Load Balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/admin-state-overview
