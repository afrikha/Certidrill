id: az700-3b-cache-private-header
objective: "3.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum publishes a product catalog API through Azure Front Door Premium. The route for `/api/catalog/*` has caching enabled. A rule set associated with the route contains a route configuration override action with caching enabled, the cache behavior **Override always** and a cache duration of 1 hour.

    The responses for `GET /api/catalog/products` are never served from the cache. The `X-Cache` response header shows `PRIVATE_NOSTORE`, and the origin returns `Cache-Control: private`.

    You need the responses to be cached at the edge for 1 hour. The product data is the same for every user.

    What should you do?
  fr: |
    Adatum publie une API de catalogue de produits au moyen d'Azure Front Door Premium. L'itinéraire pour `/api/catalog/*` a la mise en cache activée. Un ensemble de règles associé à l'itinéraire contient une action de remplacement de la configuration d'itinéraire avec la mise en cache activée, le comportement de cache **Override always** et une durée de cache de 1 heure.

    Les réponses à `GET /api/catalog/products` ne sont jamais servies depuis le cache. L'en-tête de réponse `X-Cache` indique `PRIVATE_NOSTORE`, et l'origine renvoie `Cache-Control: private`.

    Les réponses doivent être mises en cache en périphérie pendant 1 heure. Les données des produits sont les mêmes pour tous les utilisateurs.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the cache behavior of the override action to Override if origin missing.", fr: "Remplacer le comportement de cache de l'action de remplacement par Override if origin missing." } }
    - { id: b, text: { en: "Add a rule that overwrites the Cache-Control request header with public.", fr: "Ajouter une règle qui remplace l'en-tête de requête Cache-Control par public." } }
    - { id: c, text: { en: "Change the query string caching behavior of the route to Ignore Query String.", fr: "Remplacer le comportement de mise en cache des chaînes de requête de l'itinéraire par Ignore Query String." } }
    - { id: d, text: { en: "Configure the origin to return Cache-Control: public, max-age=3600 for these responses.", fr: "Configurer l'origine pour qu'elle renvoie Cache-Control: public, max-age=3600 pour ces réponses." } }
answer: { optionId: d }
explanation:
  correct:
    en: Front Door honors the `private`, `no-cache` and `no-store` values of Cache-Control and never caches such responses, even when a rule overrides the caching behavior; `PRIVATE_NOSTORE` in X-Cache confirms it. The origin must mark the responses as cacheable, for example with `public, max-age=3600`.
    fr: "Front Door respecte les valeurs `private`, `no-cache` et `no-store` de Cache-Control et ne met jamais ces réponses en cache, même quand une règle remplace le comportement de mise en cache ; `PRIVATE_NOSTORE` dans X-Cache le confirme. L'origine doit marquer les réponses comme pouvant être mises en cache, par exemple avec `public, max-age=3600`."
  options:
    a: { en: "Every override behavior applies only to cacheable responses; a private response stays uncached.", fr: "Chaque comportement de remplacement ne s'applique qu'aux réponses pouvant être mises en cache ; une réponse privée reste hors du cache." }
    b: { en: "The decision is based on the Cache-Control header of the response, not of the request.", fr: "La décision repose sur l'en-tête Cache-Control de la réponse, pas de la requête." }
    c: { en: "The cache key is not the problem; the responses are refused by the cache whatever their URL.", fr: "La clé de cache n'est pas en cause ; les réponses sont refusées par le cache quelle que soit leur URL." }
references:
  - title: Caching with Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-caching
