id: az700-3a-sku-global-home-region
objective: "3.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso runs a TCP application behind two regional public Standard load balancers: one in East US and one in West Europe. Contoso has no resources in other regions.

    You need to expose the application through a single static anycast public IP address that routes clients to the closest healthy region. The new load balancer must be created in a region where Contoso already has resources.

    How should you configure the new load balancer? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute une application TCP derrière deux équilibreurs de charge publics Standard régionaux : l'un dans East US et l'autre dans West Europe. Contoso ne dispose d'aucune ressource dans d'autres régions.

    Vous devez exposer l'application par une seule adresse IP publique anycast statique qui dirige les clients vers la région saine la plus proche. Le nouvel équilibreur de charge doit être créé dans une région où Contoso dispose déjà de ressources.

    Comment devez-vous configurer le nouvel équilibreur de charge ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      SKU: [[sku]]

      Tier: [[tier]]

      Region: [[region]]
    fr: |
      Référence SKU : [[sku]]

      Niveau : [[tier]]

      Région : [[region]]
  slots:
    - id: sku
      options:
        - { id: std, text: Standard }
        - { id: gw, text: Gateway }
        - { id: basic, text: Basic }
    - id: tier
      options:
        - { id: regional, text: Regional }
        - { id: global, text: Global }
    - id: region
      options:
        - { id: eus, text: East US }
        - { id: weu, text: West Europe }
        - { id: frc, text: France Central }
        - { id: gwc, text: Germany West Central }
answer:
  values: { sku: std, tier: global, region: weu }
explanation:
  correct:
    en: |
      A global load balancer is a Standard SKU load balancer with the Global tier. Its backend pool contains the regional Standard load balancers, and its static anycast frontend routes clients to the closest healthy region. It can only be deployed in a home region; West Europe is a home region, while East US is not (East US 2 is).
    fr: |
      Un équilibreur de charge global est un équilibreur de charge de référence SKU Standard avec le niveau Global. Son pool principal contient les équilibreurs de charge Standard régionaux, et son front-end anycast statique dirige les clients vers la région saine la plus proche. Il ne peut être déployé que dans une région d'accueil (home region) ; West Europe en fait partie, contrairement à East US (c'est East US 2 qui en fait partie).
  options:
    gw: { en: "The Gateway SKU chains NVAs to a frontend; it does not distribute traffic across regions.", fr: "La référence SKU Gateway chaîne des NVA à un front-end ; elle ne répartit pas le trafic entre régions." }
    basic: { en: "The Basic SKU is retired and never offered a global tier.", fr: "La référence SKU Basic est mise hors service et n'a jamais proposé de niveau global." }
    regional: { en: "A regional load balancer serves a single region and cannot have other load balancers as backends.", fr: "Un équilibreur de charge régional dessert une seule région et ne peut pas avoir d'autres équilibreurs de charge comme back-ends." }
    eus: { en: "East US is a participating region but not a home region, so the global load balancer cannot be created there.", fr: "East US est une région participante, mais pas une région d'accueil : l'équilibreur de charge global ne peut pas y être créé." }
references:
  - title: Global load balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/cross-region-overview
