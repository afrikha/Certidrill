id: az700-3a-usecase-udp-game
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin hosts a multiplayer game service on 12 virtual machines in a single virtual network in the West Europe region. Players connect from the internet by using UDP port 7777.

    You need to distribute the player traffic across the virtual machines. The solution must meet the following requirements:

    - Players must connect to a single public IP address.
    - Only healthy virtual machines must receive new traffic.

    Which service should you use?
  fr: |
    Tailspin héberge un service de jeu multijoueur sur 12 machines virtuelles d'un même réseau virtuel dans la région West Europe. Les joueurs se connectent depuis Internet sur le port UDP 7777.

    Vous devez répartir le trafic des joueurs entre les machines virtuelles. La solution doit répondre aux exigences suivantes :

    - Les joueurs doivent se connecter à une seule adresse IP publique.
    - Seules les machines virtuelles saines doivent recevoir du nouveau trafic.

    Quel service devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "An Application Gateway Standard_v2", fr: "Un Application Gateway Standard_v2" } }
    - { id: b, text: { en: "An Azure Front Door Standard profile", fr: "Un profil Azure Front Door Standard" } }
    - { id: c, text: { en: "A public Standard load balancer", fr: "Un équilibreur de charge public Standard" } }
    - { id: d, text: { en: "An Azure Traffic Manager profile", fr: "Un profil Azure Traffic Manager" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure Load Balancer is a layer 4 pass-through load balancer for TCP and UDP. A public Standard load balancer exposes one frontend public IP address and uses health probes to send new flows only to healthy backend instances in the virtual network.
    fr: |
      Azure Load Balancer est un équilibreur de charge de couche 4 en mode pass-through pour TCP et UDP. Un équilibreur de charge public Standard expose une seule adresse IP publique frontale et utilise des sondes d'intégrité pour n'envoyer les nouveaux flux qu'aux instances principales saines du réseau virtuel.
  options:
    a: { en: "Application Gateway handles HTTP(S), TCP and TLS traffic, not UDP.", fr: "Application Gateway traite le trafic HTTP(S), TCP et TLS, pas UDP." }
    b: { en: "Azure Front Door is a global HTTP(S) service; it cannot carry a UDP game protocol.", fr: "Azure Front Door est un service HTTP(S) mondial ; il ne peut pas transporter un protocole de jeu UDP." }
    d: { en: "Traffic Manager answers DNS queries with endpoint addresses; clients would connect to several different IP addresses, and it does not handle the packets itself.", fr: "Traffic Manager répond aux requêtes DNS avec les adresses des points de terminaison ; les clients se connecteraient à plusieurs adresses IP différentes, et il ne traite pas lui-même les paquets." }
references:
  - title: What is Azure Load Balancer?
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-overview
  - title: Load balancing options
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/load-balancing-overview
