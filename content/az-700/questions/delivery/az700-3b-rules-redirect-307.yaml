id: az700-3b-rules-redirect-307
objective: "3.3.8"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Woodgrove publishes **api.woodgrove.com** through Azure Front Door Premium. During a two-week maintenance, the requests for `/payments/*` must be sent to **api-dr.woodgrove.com**. Client applications send these requests with the POST method, and the redirected requests must still use POST. After the maintenance, clients must keep using api.woodgrove.com.

    You add a rule with a URL redirect action to the rule set of the route.

    Which redirect type should you use?
  fr: |
    Woodgrove publie **api.woodgrove.com** au moyen d'Azure Front Door Premium. Pendant une maintenance de deux semaines, les requêtes pour `/payments/*` doivent être envoyées vers **api-dr.woodgrove.com**. Les applications clientes envoient ces requêtes avec la méthode POST, et les requêtes redirigées doivent toujours utiliser POST. Après la maintenance, les clients doivent continuer d'utiliser api.woodgrove.com.

    Vous ajoutez une règle avec une action de redirection d'URL à l'ensemble de règles de l'itinéraire.

    Quel type de redirection devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Moved (301)", fr: "Déplacé (301)" } }
    - { id: b, text: { en: "Found (302)", fr: "Trouvé (302)" } }
    - { id: c, text: { en: "Temporary redirect (307)", fr: "Redirection temporaire (307)" } }
    - { id: d, text: { en: "Permanent redirect (308)", fr: "Redirection permanente (308)" } }
answer: { optionId: c }
explanation:
  correct:
    en: A 307 Temporary redirect tells the client that the move is temporary, so it keeps using the original URI for later requests, and the user agent must not change the request method when it follows the redirect. The POST requests therefore remain POST requests during the maintenance.
    fr: "Une redirection temporaire 307 indique au client que le déplacement est temporaire : il continue d'utiliser l'URI d'origine pour les requêtes suivantes, et l'agent utilisateur ne doit pas changer la méthode de la requête en suivant la redirection. Les requêtes POST restent donc des requêtes POST pendant la maintenance."
  options:
    a: { en: "301 announces a permanent move, so clients may stop using api.woodgrove.com.", fr: "301 annonce un déplacement permanent : les clients pourraient cesser d'utiliser api.woodgrove.com." }
    b: { en: "302 is temporary, but it does not guarantee that the client keeps the POST method.", fr: "302 est temporaire, mais il ne garantit pas que le client conserve la méthode POST." }
    d: { en: "308 announces a permanent move; future references would use the new URI.", fr: "308 annonce un déplacement permanent ; les références futures utiliseraient le nouvel URI." }
references:
  - title: URL redirect
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-url-redirect
