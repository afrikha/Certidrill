id: az700-cs2c-snat-ports
objective: "3.1.11"
type: single
caseStudy: az700-cs2c-fourth-coffee
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You plan to configure the outbound rule of lb-out to allocate SNAT ports manually to the instances of vmss-orders. The frontend IP addresses of the outbound rule aren't used by any other rule.

    You need to meet the requirement for SNAT ports. What is the minimum number of public IP addresses that the outbound rule must use?
  fr: |
    Vous prévoyez de configurer la règle de trafic sortant de lb-out pour allouer manuellement les ports SNAT aux instances de vmss-orders. Les adresses IP frontales de la règle de trafic sortant ne sont utilisées par aucune autre règle.

    Vous devez respecter l'exigence relative aux ports SNAT. Quel est le nombre minimal d'adresses IP publiques que la règle de trafic sortant doit utiliser ?
body:
  options:
    - { id: a, text: "2" }
    - { id: b, text: "3" }
    - { id: c, text: "4" }
    - { id: d, text: "5" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Each frontend public IP address gives the load balancer 64,000 SNAT ports, and a manual allocation is rejected if the ports per instance multiplied by the instances exceed the available ports. vmss-orders can scale to 20 instances, so 20 × 8,000 = 160,000 ports are needed; three addresses provide 192,000 ports, while two provide only 128,000. The value 8,000 is a multiple of 8, as the load balancer requires.
    fr: |
      Chaque adresse IP publique frontale donne à l'équilibreur de charge 64 000 ports SNAT, et une allocation manuelle est refusée si le nombre de ports par instance multiplié par le nombre d'instances dépasse les ports disponibles. vmss-orders peut monter à 20 instances : il faut donc 20 × 8 000 = 160 000 ports ; trois adresses fournissent 192 000 ports, alors que deux n'en fournissent que 128 000. La valeur 8 000 est un multiple de 8, comme l'exige l'équilibreur de charge.
  options:
    a: { en: "Two addresses provide 128,000 ports, which covers only 16 instances at 8,000 ports each.", fr: "Deux adresses fournissent 128 000 ports, ce qui ne couvre que 16 instances à 8 000 ports chacune." }
    c: { en: "Four addresses would work, but three are enough and the number of addresses must be minimized.", fr: "Quatre adresses fonctionneraient, mais trois suffisent et le nombre d'adresses doit être réduit au minimum." }
    d: { en: "Five addresses provide 320,000 ports, far more than the 160,000 needed.", fr: "Cinq adresses fournissent 320 000 ports, bien plus que les 160 000 nécessaires." }
references:
  - title: Outbound rules for Azure Load Balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/outbound-rules
