id: az700-3a-rule-behaviors-yn
objective: "3.1.9"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Tailspin is designing load-balancing rules for Standard load balancers that serve several applications.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin conçoit des règles d'équilibrage de charge pour des équilibreurs de charge Standard qui servent plusieurs applications.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Two load-balancing rules that target the same backend pool must have Floating IP enabled to use the same backend port.
        fr: Deux règles d'équilibrage de charge qui ciblent le même pool principal doivent avoir l'IP flottante activée pour utiliser le même port principal.
    - id: s2
      text:
        en: You can create an HA ports rule on a public Standard load balancer.
        fr: Vous pouvez créer une règle de ports HA sur un équilibreur de charge public Standard.
    - id: s3
      text:
        en: A load-balancing rule can forward traffic to backend instances located in two different virtual networks.
        fr: Une règle d'équilibrage de charge peut transférer le trafic vers des instances principales situées dans deux réseaux virtuels différents.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Reusing a backend port across several rules requires Floating IP. HA ports rules are available only on internal Standard load balancers. A load-balancing rule cannot span two virtual networks; the frontend and all its backend instances must be in a single virtual network.
    fr: |
      La réutilisation d'un port principal par plusieurs règles exige l'IP flottante. Les règles de ports HA ne sont disponibles que sur les équilibreurs de charge internes Standard. Une règle d'équilibrage de charge ne peut pas couvrir deux réseaux virtuels ; le front-end et toutes ses instances principales doivent se trouver dans un seul réseau virtuel.
references:
  - title: Azure Load Balancer Floating IP configuration
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-floating-ip
  - title: Azure Load Balancer Components Overview
    url: https://learn.microsoft.com/en-us/azure/load-balancer/components
