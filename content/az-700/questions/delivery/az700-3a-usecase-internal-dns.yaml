id: az700-3a-usecase-internal-dns
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs three DNS server virtual machines in a subnet of a hub virtual network. The servers answer queries on UDP port 53 and TCP port 53.

    Clients in peered spoke virtual networks and in an on-premises network connected by a site-to-site VPN must use the DNS servers. You need to provide a single private IP address for the clients, and queries must be sent only to DNS servers that are responding.

    What should you deploy?
  fr: |
    Adatum exécute trois machines virtuelles serveurs DNS dans un sous-réseau d'un réseau virtuel hub. Les serveurs répondent aux requêtes sur le port UDP 53 et le port TCP 53.

    Les clients des réseaux virtuels spoke reliés par peering et d'un réseau local connecté par un VPN site à site doivent utiliser ces serveurs DNS. Vous devez fournir une seule adresse IP privée aux clients, et les requêtes ne doivent être envoyées qu'aux serveurs DNS qui répondent.

    Que devez-vous déployer ?
body:
  options:
    - { id: a, text: { en: "An internal Standard load balancer with load-balancing rules for UDP 53 and TCP 53", fr: "Un équilibreur de charge interne Standard avec des règles d'équilibrage de charge pour UDP 53 et TCP 53" } }
    - { id: b, text: { en: "An Application Gateway Standard_v2 with a private frontend IP and listeners on port 53", fr: "Un Application Gateway Standard_v2 avec une IP frontale privée et des écouteurs sur le port 53" } }
    - { id: c, text: { en: "A Traffic Manager profile with an external endpoint for each DNS server", fr: "Un profil Traffic Manager avec un point de terminaison externe pour chaque serveur DNS" } }
    - { id: d, text: { en: "A Gateway Load Balancer with the DNS servers in its backend pool", fr: "Un équilibreur de charge de passerelle avec les serveurs DNS dans son pool principal" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An internal load balancer exposes a private frontend IP that is reachable from peered virtual networks and from on-premises networks connected through a gateway. It balances both UDP and TCP, and its health probes remove servers that stop responding.
    fr: |
      Un équilibreur de charge interne expose une IP frontale privée accessible depuis les réseaux virtuels reliés par peering et depuis les réseaux locaux connectés par une passerelle. Il équilibre UDP comme TCP, et ses sondes d'intégrité écartent les serveurs qui ne répondent plus.
  options:
    b: { en: "Application Gateway does not support UDP, and DNS queries mostly use UDP.", fr: "Application Gateway ne prend pas en charge UDP, alors que les requêtes DNS utilisent surtout UDP." }
    c: { en: "Traffic Manager returns the endpoints' addresses in DNS answers and monitors internet-facing endpoints; it gives clients no single private IP address.", fr: "Traffic Manager renvoie les adresses des points de terminaison dans ses réponses DNS et surveille des points de terminaison exposés à Internet ; il ne fournit pas aux clients une adresse IP privée unique." }
    d: { en: "A Gateway Load Balancer inserts NVAs in front of a public endpoint; clients cannot send traffic directly to it.", fr: "Un équilibreur de charge de passerelle insère des NVA devant un point de terminaison public ; les clients ne peuvent pas lui envoyer directement du trafic." }
references:
  - title: What is Azure Load Balancer?
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-overview
  - title: Azure Load Balancer Components Overview
    url: https://learn.microsoft.com/en-us/azure/load-balancer/components
