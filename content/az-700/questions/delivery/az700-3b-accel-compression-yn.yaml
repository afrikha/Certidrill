id: az700-3b-accel-compression-yn
objective: "3.3.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    An Azure Front Door Premium route has **Enable caching** and **Enable compression** selected. The MIME types `text/html`, `application/json` and `application/javascript` are in the compression list. The origin sends uncompressed responses with a Content-Length header.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un itinéraire Azure Front Door Premium a les options **Activer la mise en cache** et **Activer la compression** sélectionnées. Les types MIME `text/html`, `application/json` et `application/javascript` figurent dans la liste de compression. L'origine envoie des réponses non compressées avec un en-tête Content-Length.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A browser that accepts both gzip and Brotli receives a 200 KB JavaScript file compressed with Brotli.
        fr: Un navigateur qui accepte à la fois gzip et Brotli reçoit un fichier JavaScript de 200 Ko compressé avec Brotli.
    - id: s2
      text:
        en: A 12 MB JSON file is compressed by Front Door before it is sent to the browser.
        fr: Un fichier JSON de 12 Mo est compressé par Front Door avant d'être envoyé au navigateur.
    - id: s3
      text:
        en: A 600-byte HTML file is compressed by Front Door before it is sent to the browser.
        fr: Un fichier HTML de 600 octets est compressé par Front Door avant d'être envoyé au navigateur.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Front Door compresses on the fly only files of a listed MIME type that are larger than 1 KB and smaller than 8 MB. When the request supports more than one compression type, Brotli takes precedence over gzip. The 12 MB file is too large and the 600-byte file too small, so both are sent uncompressed."
    fr: "Front Door ne compresse à la volée que les fichiers d'un type MIME listé dont la taille est supérieure à 1 Ko et inférieure à 8 Mo. Quand la requête prend en charge plusieurs types de compression, Brotli l'emporte sur gzip. Le fichier de 12 Mo est trop volumineux et celui de 600 octets trop petit : tous deux sont envoyés sans compression."
references:
  - title: Improve performance by compressing files in Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/frontdoor/standard-premium/how-to-compression
