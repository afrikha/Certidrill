id: az700-3a-sku-private-link-service
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam provides a SaaS application that runs on virtual machines in a virtual network named **VNet-SaaS**. Customers must reach the application privately from their own virtual networks through private endpoints, by using an Azure Private Link service that Fabrikam will create.

    You need to deploy the load balancer that the Private Link service will reference.

    Which load balancer should you deploy?
  fr: |
    Fabrikam fournit une application SaaS qui s'exécute sur des machines virtuelles d'un réseau virtuel nommé **VNet-SaaS**. Les clients doivent accéder à l'application de manière privée depuis leurs propres réseaux virtuels via des points de terminaison privés, au moyen d'un service Azure Private Link que Fabrikam va créer.

    Vous devez déployer l'équilibreur de charge que le service Private Link référencera.

    Quel équilibreur de charge devez-vous déployer ?
body:
  options:
    - { id: a, text: { en: "A Standard SKU public load balancer", fr: "Un équilibreur de charge public de référence SKU Standard" } }
    - { id: b, text: { en: "A Standard SKU internal load balancer", fr: "Un équilibreur de charge interne de référence SKU Standard" } }
    - { id: c, text: { en: "A Gateway SKU load balancer", fr: "Un équilibreur de charge de référence SKU Gateway" } }
    - { id: d, text: { en: "A Standard SKU load balancer in the Global tier", fr: "Un équilibreur de charge de référence SKU Standard au niveau Global" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An Azure Private Link service is attached to the frontend IP configuration of a Standard internal load balancer. Among the load balancer options, only the Standard internal load balancer supports Private Link.
    fr: |
      Un service Azure Private Link est associé à la configuration IP frontale d'un équilibreur de charge interne Standard. Parmi les options d'équilibreur de charge, seul l'équilibreur de charge interne Standard prend en charge Private Link.
  options:
    a: { en: "Private Link is supported only with a Standard internal load balancer, not with a public frontend.", fr: "Private Link n'est pris en charge qu'avec un équilibreur de charge interne Standard, pas avec un front-end public." }
    c: { en: "A Gateway Load Balancer chains NVAs to public frontends; it is not used by a Private Link service.", fr: "Un équilibreur de charge de passerelle chaîne des NVA à des front-ends publics ; il n'est pas utilisé par un service Private Link." }
    d: { en: "The Global tier exists only for public load balancers that distribute traffic across regions.", fr: "Le niveau Global n'existe que pour les équilibreurs de charge publics qui répartissent le trafic entre régions." }
references:
  - title: Azure Load Balancer SKUs
    url: https://learn.microsoft.com/en-us/azure/load-balancer/skus
