id: az700-3a-config-http-probe
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware is configuring a public Standard load balancer for a web API that listens on HTTP port 8080 on three virtual machines. When the API loses its connection to the database, the process keeps listening on port 8080, but the URL path /health returns HTTP status 503.

    You need to configure a health probe so that a virtual machine stops receiving new connections when its API cannot reach the database.

    Which health probe should you configure?
  fr: |
    Proseware configure un équilibreur de charge public Standard pour une API web qui écoute sur le port HTTP 8080 de trois machines virtuelles. Quand l'API perd sa connexion à la base de données, le processus continue d'écouter sur le port 8080, mais le chemin d'URL /health renvoie le code d'état HTTP 503.

    Vous devez configurer une sonde d'intégrité pour qu'une machine virtuelle ne reçoive plus de nouvelles connexions lorsque son API ne peut plus joindre la base de données.

    Quelle sonde d'intégrité devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Protocol TCP, port 8080", fr: "Protocole TCP, port 8080" } }
    - { id: b, text: { en: "Protocol HTTP, port 8080, path /health", fr: "Protocole HTTP, port 8080, chemin /health" } }
    - { id: c, text: { en: "Protocol HTTP, port 80, path /health", fr: "Protocole HTTP, port 80, chemin /health" } }
    - { id: d, text: { en: "Protocol HTTPS, port 8080, path /health", fr: "Protocole HTTPS, port 8080, chemin /health" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An HTTP probe sends a GET request to the configured port and path and marks the instance healthy only when it returns HTTP 200. A 503 response from /health immediately marks the instance down, so it stops receiving new connections.
    fr: |
      Une sonde HTTP envoie une requête GET au port et au chemin configurés et ne considère l'instance comme saine que si elle renvoie HTTP 200. Une réponse 503 de /health marque immédiatement l'instance comme défaillante : elle ne reçoit plus de nouvelles connexions.
  options:
    a: { en: "A TCP probe only checks that the port accepts a connection; the process still listens on 8080, so the probe would succeed.", fr: "Une sonde TCP vérifie seulement que le port accepte une connexion ; le processus écoute toujours sur 8080, donc la sonde réussirait." }
    c: { en: "Nothing listens on port 80, so every instance would be marked unhealthy permanently.", fr: "Rien n'écoute sur le port 80 : toutes les instances seraient marquées comme non saines en permanence." }
    d: { en: "The API serves plain HTTP on port 8080; a TLS handshake would fail and mark every instance down.", fr: "L'API sert du HTTP simple sur le port 8080 ; la négociation TLS échouerait et marquerait toutes les instances comme défaillantes." }
references:
  - title: Azure Load Balancer health probes
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview
