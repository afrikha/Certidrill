id: az700-3a-config-nsg-probe-hotarea
objective: "3.1.6"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has a public Standard load balancer named **LB1** with a load-balancing rule for TCP port 80 and a TCP health probe on port 80. The backend virtual machines are in a subnet associated with a network security group named **NSG-Web**. No other NSG applies to the virtual machines. The inbound security rules of NSG-Web are shown in the following table.

    Answer each prompt by selecting the rule that processes the traffic when it reaches the virtual machines.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un équilibreur de charge public Standard nommé **LB1**, avec une règle d'équilibrage de charge pour le port TCP 80 et une sonde d'intégrité TCP sur le port 80. Les machines virtuelles principales se trouvent dans un sous-réseau associé à un groupe de sécurité réseau nommé **NSG-Web**. Aucun autre NSG ne s'applique aux machines virtuelles. Les règles de sécurité entrantes de NSG-Web figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la règle qui traite le trafic lorsqu'il atteint les machines virtuelles.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Health probe traffic sent by LB1 to TCP port 80", fr: "Trafic de la sonde d'intégrité envoyé par LB1 vers le port TCP 80" }
    - id: p2
      text: { en: "A request from an internet client at 198.51.100.7 to the frontend IP of LB1 on TCP port 80", fr: "Une requête d'un client Internet d'adresse 198.51.100.7 vers l'IP frontale de LB1 sur le port TCP 80" }
  grid:
    header: [{ en: "Priority", fr: "Priorité" }, { en: Name, fr: Nom }, Port, { en: Source, fr: Source }, Action]
    rows:
      - [{ text: "100" }, { text: Allow-HTTP-Partners, area: r100 }, { text: "80" }, { text: 203.0.113.0/24 }, { text: Allow }]
      - [{ text: "200" }, { text: Allow-LB, area: r200 }, { text: Any }, { text: AzureLoadBalancer }, { text: Allow }]
      - [{ text: "300" }, { text: Deny-HTTP-Internet, area: r300 }, { text: "80" }, { text: Internet }, { text: Deny }]
      - [{ text: "400" }, { text: Allow-HTTP-Any, area: r400 }, { text: "80" }, { text: Any }, { text: Allow }]
      - [{ text: "65000" }, { text: AllowVNetInBound, area: r65000 }, { text: Any }, { text: VirtualNetwork }, { text: Allow }]
      - [{ text: "65001" }, { text: AllowAzureLoadBalancerInBound, area: r65001 }, { text: Any }, { text: AzureLoadBalancer }, { text: Allow }]
      - [{ text: "65500" }, { text: DenyAllInbound, area: r65500 }, { text: Any }, { text: Any }, { text: Deny }]
answer:
  values: { p1: r200, p2: r300 }
explanation:
  correct:
    en: |
      Health probes originate from 168.63.129.16, which the AzureLoadBalancer service tag represents, so the probe matches Allow-LB (200) first. Azure Load Balancer is pass-through and does not translate the client's source address, so the internet request keeps the source 198.51.100.7; it does not match rule 100 or the AzureLoadBalancer tag and is denied by Deny-HTTP-Internet (300) before rule 400 is evaluated.
    fr: |
      Les sondes d'intégrité proviennent de 168.63.129.16, représentée par l'étiquette de service AzureLoadBalancer : la sonde correspond d'abord à Allow-LB (200). Azure Load Balancer fonctionne en mode pass-through et ne traduit pas l'adresse source du client : la requête Internet conserve la source 198.51.100.7 ; elle ne correspond ni à la règle 100 ni à l'étiquette AzureLoadBalancer et elle est refusée par Deny-HTTP-Internet (300) avant l'évaluation de la règle 400.
references:
  - title: Azure Load Balancer health probes
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
