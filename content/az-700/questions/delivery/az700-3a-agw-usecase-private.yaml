id: az700-3a-agw-usecase-private
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove runs an internal HR web application on virtual machines in a virtual network named **VNet-HR** in the France Central region. Employees reach VNet-HR from on-premises over ExpressRoute.

    You need to publish the application. The solution must meet the following requirements:

    - Route requests to different backend pools based on the URL path.
    - Inspect requests with a web application firewall.
    - The application must be reachable only from VNet-HR and from the on-premises network, never from the internet.

    What should you deploy?
  fr: |
    Woodgrove exécute une application web RH interne sur des machines virtuelles d'un réseau virtuel nommé **VNet-HR** dans la région France Central. Les employés accèdent à VNet-HR depuis le réseau local par ExpressRoute.

    Vous devez publier l'application. La solution doit répondre aux exigences suivantes :

    - Router les requêtes vers différents pools principaux selon le chemin d'URL.
    - Inspecter les requêtes avec un pare-feu d'applications web.
    - L'application ne doit être accessible que depuis VNet-HR et depuis le réseau local, jamais depuis Internet.

    Que devez-vous déployer ?
body:
  options:
    - { id: a, text: { en: "An Azure Front Door Premium profile that reaches the virtual machines through Private Link", fr: "Un profil Azure Front Door Premium qui atteint les machines virtuelles via Private Link" } }
    - { id: b, text: { en: "An internal Standard load balancer with a rule for TCP port 443", fr: "Un équilibreur de charge interne Standard avec une règle pour le port TCP 443" } }
    - { id: c, text: { en: "An Application Gateway WAF_v2 whose listeners use only a private frontend IP address in VNet-HR", fr: "Un Application Gateway WAF_v2 dont les écouteurs n'utilisent qu'une adresse IP frontale privée dans VNet-HR" } }
    - { id: d, text: { en: "A Traffic Manager profile with external endpoints that use the private IP addresses of the virtual machines", fr: "Un profil Traffic Manager avec des points de terminaison externes qui utilisent les adresses IP privées des machines virtuelles" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Application Gateway can use a private frontend IP address in the virtual network, which clients in VNet-HR and on-premises (over ExpressRoute) can reach. With listeners only on the private frontend, nothing is published to the internet, while path-based routing and WAF_v2 inspection still apply.
    fr: |
      Application Gateway peut utiliser une adresse IP frontale privée dans le réseau virtuel, accessible aux clients de VNet-HR et du réseau local (par ExpressRoute). Avec des écouteurs uniquement sur le front-end privé, rien n'est publié sur Internet, tandis que le routage basé sur le chemin et l'inspection WAF_v2 s'appliquent toujours.
  options:
    a: { en: "Azure Front Door endpoints are public, internet-facing endpoints, so the application would be reachable from the internet.", fr: "Les points de terminaison Azure Front Door sont publics et exposés à Internet : l'application serait accessible depuis Internet." }
    b: { en: "A load balancer works at layer 4: it cannot route by URL path or provide a web application firewall.", fr: "Un équilibreur de charge fonctionne en couche 4 : il ne peut pas router selon le chemin d'URL ni fournir de pare-feu d'applications web." }
    d: { en: "Traffic Manager is a DNS-based service for internet-facing endpoints; it provides neither path routing nor WAF.", fr: "Traffic Manager est un service DNS destiné à des points de terminaison exposés à Internet ; il ne fournit ni routage par chemin ni WAF." }
references:
  - title: Application gateway components
    url: https://learn.microsoft.com/en-us/azure/application-gateway/application-gateway-components
  - title: What is Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/application-gateway/overview
