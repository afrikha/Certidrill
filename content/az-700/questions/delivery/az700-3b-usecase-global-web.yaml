id: az700-3b-usecase-global-web
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind runs an HTTPS e-commerce website on App Service apps in three Azure regions. Customers are located worldwide.

    You need a solution that meets the following requirements:

    - Customers connect to a single host name and are served by the closest healthy region.
    - Static images and scripts are cached close to the customers.
    - One web application firewall (WAF) policy protects the three regions.

    What should you use?
  fr: |
    Northwind exécute un site de commerce électronique HTTPS sur des applications App Service dans trois régions Azure. Les clients se trouvent dans le monde entier.

    Vous avez besoin d'une solution qui répond aux exigences suivantes :

    - Les clients se connectent à un seul nom d'hôte et sont servis par la région saine la plus proche.
    - Les images et les scripts statiques sont mis en cache près des clients.
    - Une seule stratégie de pare-feu d'applications web (WAF) protège les trois régions.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: Azure Traffic Manager }
    - { id: b, text: Azure Front Door }
    - { id: c, text: Azure Application Gateway }
    - { id: d, text: { en: "Azure Load Balancer (global tier)", fr: "Azure Load Balancer (niveau global)" } }
answer: { optionId: b }
explanation:
  correct:
    en: Azure Front Door is a global layer 7 entry point that routes HTTP and HTTPS requests to the best healthy origin, caches content in its edge locations and applies one WAF policy at the edge for all origins.
    fr: "Azure Front Door est un point d'entrée mondial de couche 7 qui route les requêtes HTTP et HTTPS vers la meilleure origine saine, met le contenu en cache dans ses emplacements de périphérie et applique une seule stratégie WAF en périphérie pour toutes les origines."
  options:
    a: { en: "Traffic Manager is DNS-based: it neither caches content nor runs a WAF.", fr: "Traffic Manager repose sur le DNS : il ne met pas le contenu en cache et n'exécute pas de WAF." }
    c: { en: "Application Gateway is regional; it cannot serve three regions from one deployment or cache content at the edge.", fr: "Application Gateway est régional : il ne peut pas servir trois régions à partir d'un seul déploiement ni mettre en cache en périphérie." }
    d: { en: "The global tier of Load Balancer works at layer 4, without caching or WAF.", fr: "Le niveau global de Load Balancer fonctionne en couche 4, sans mise en cache ni WAF." }
references:
  - title: What is Azure Front Door?
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-overview
