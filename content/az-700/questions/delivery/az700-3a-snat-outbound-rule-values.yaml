id: az700-3a-snat-outbound-rule-values
objective: "3.1.11"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware has a public Standard load balancer named **LB-Out** with a single frontend IP configuration. The backend pool contains four virtual machines that are not load balanced for inbound traffic. You are creating an outbound rule for the pool.

    The outbound rule must meet the following requirements:

    - Provide outbound SNAT for both TCP and UDP traffic.
    - Give every virtual machine the same number of SNAT ports, as many as possible.
    - Keep idle outbound flows open for two hours.

    How should you configure the outbound rule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un équilibreur de charge public Standard nommé **LB-Out** avec une seule configuration IP frontale. Le pool principal contient quatre machines virtuelles qui ne reçoivent pas de trafic entrant équilibré. Vous créez une règle de trafic sortant pour ce pool.

    La règle de trafic sortant doit répondre aux exigences suivantes :

    - Fournir la SNAT sortante pour le trafic TCP et le trafic UDP.
    - Donner à chaque machine virtuelle le même nombre de ports SNAT, le plus élevé possible.
    - Maintenir ouverts pendant deux heures les flux sortants inactifs.

    Comment devez-vous configurer la règle de trafic sortant ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Protocol: [[proto]]

      Ports per instance: [[ports]]

      Idle timeout (minutes): [[idle]]
    fr: |
      Protocole : [[proto]]

      Ports par instance : [[ports]]

      Délai d'inactivité (minutes) : [[idle]]
  slots:
    - id: proto
      options:
        - { id: tcp, text: TCP }
        - { id: udp, text: UDP }
        - { id: all, text: All }
    - id: ports
      options:
        - { id: p15999, text: "15999" }
        - { id: p16000, text: "16000" }
        - { id: p16384, text: "16384" }
        - { id: p64000, text: "64000" }
    - id: idle
      options:
        - { id: i30, text: "30" }
        - { id: i100, text: "100" }
        - { id: i120, text: "120" }
answer:
  values: { proto: all, ports: p16000, idle: i120 }
explanation:
  correct:
    en: |
      The protocol All covers both TCP and UDP. One frontend IP provides 64,000 SNAT ports, so four VMs can receive at most 16,000 ports each, and 16,000 is a multiple of 8 as required. The outbound idle timeout ranges from 4 to 120 minutes, so 120 keeps idle flows for two hours.
    fr: |
      Le protocole All couvre TCP et UDP. Une IP frontale fournit 64 000 ports SNAT : quatre machines virtuelles peuvent donc recevoir au plus 16 000 ports chacune, et 16 000 est bien un multiple de 8. Le délai d'inactivité sortant va de 4 à 120 minutes : 120 maintient les flux inactifs pendant deux heures.
  options:
    p15999: { en: "Port allocations must be multiples of 8; other values are rejected.", fr: "Les allocations de ports doivent être des multiples de 8 ; les autres valeurs sont rejetées." }
    p16384: { en: "4 × 16,384 = 65,536 ports, more than the 64,000 available on one frontend IP.", fr: "4 × 16 384 = 65 536 ports, soit plus que les 64 000 disponibles sur une IP frontale." }
    p64000: { en: "64,000 ports is the total for one frontend IP, not a per-instance value for four VMs.", fr: "64 000 ports est le total d'une IP frontale, pas une valeur par instance pour quatre machines virtuelles." }
    i100: { en: "100 minutes is the maximum for inbound rules; outbound rules allow up to 120 minutes, which two hours requires.", fr: "100 minutes est le maximum des règles entrantes ; les règles de trafic sortant permettent jusqu'à 120 minutes, ce qu'exigent deux heures." }
references:
  - title: Outbound rules for Azure Load Balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/outbound-rules
