id: az700-3b-settings-affinity
objective: "3.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware publishes a web shop through an Application Gateway Standard_v2 named **AGW1**. The backend pool contains four virtual machines. The application keeps each user's shopping cart in the memory of the server that created the session.

    Users report that their cart is often empty after they browse to another page. The browsers of the users accept cookies.

    You need to ensure that all the requests of a user session reach the same server.

    What should you configure in the backend settings of the rule?
  fr: |
    Litware publie une boutique en ligne au moyen d'un Application Gateway Standard_v2 nommé **AGW1**. Le pool principal contient quatre machines virtuelles. L'application conserve le panier de chaque utilisateur dans la mémoire du serveur qui a créé la session.

    Les utilisateurs signalent que leur panier est souvent vide lorsqu'ils passent à une autre page. Les navigateurs des utilisateurs acceptent les cookies.

    Vous devez vous assurer que toutes les requêtes d'une session utilisateur atteignent le même serveur.

    Que devez-vous configurer dans les paramètres de back-end de la règle ?
body:
  options:
    - { id: a, text: { en: "Enable cookie-based affinity.", fr: "Activer l'affinité basée sur les cookies." } }
    - { id: b, text: { en: "Increase the request timeout to 300 seconds.", fr: "Augmenter le délai d'expiration de la requête à 300 secondes." } }
    - { id: c, text: { en: "Enable connection draining with a timeout of 300 seconds.", fr: "Activer le drainage de connexion avec un délai de 300 secondes." } }
    - { id: d, text: { en: "Enable Pick host name from backend target.", fr: "Activer Choisir le nom d'hôte de la cible de back-end." } }
answer: { optionId: a }
explanation:
  correct:
    en: Cookie-based affinity makes the gateway insert the ApplicationGatewayAffinity cookie and send the following requests that carry it to the same backend server. It works only when the clients accept cookies, which is the case here.
    fr: "L'affinité basée sur les cookies fait insérer par la passerelle le cookie ApplicationGatewayAffinity et envoyer vers le même serveur principal les requêtes suivantes qui le portent. Elle ne fonctionne que si les clients acceptent les cookies, ce qui est le cas ici."
  options:
    b: { en: "The request timeout limits how long the gateway waits for a response; requests still spread across servers.", fr: "Le délai d'expiration limite la durée d'attente d'une réponse par la passerelle ; les requêtes restent réparties entre les serveurs." }
    c: { en: "Connection draining protects in-flight requests of a server being removed from the pool; it does not pin sessions.", fr: "Le drainage de connexion protège les requêtes en cours d'un serveur retiré du pool ; il n'attache pas les sessions." }
    d: { en: "This option sets the Host header sent to multitenant backends; it does not keep a user on one server.", fr: "Cette option définit l'en-tête Host envoyé aux back-ends multilocataires ; elle ne maintient pas un utilisateur sur un serveur." }
references:
  - title: Azure Application Gateway Backend Settings configuration
    url: https://learn.microsoft.com/en-us/azure/application-gateway/configuration-http-settings
