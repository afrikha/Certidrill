id: az700-3a-xregion-facts-yn
objective: "3.1.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso has the following load balancers:

    | Name | Region | Type | SKU and tier |
    | --- | --- | --- | --- |
    | LB-EU | West Europe | Public | Standard, Regional |
    | LB-US | Central US | Public | Standard, Regional |
    | ILB-EU | West Europe | Internal | Standard, Regional |

    Contoso plans to deploy a global load balancer named **GLB1** for an application that is currently published by LB-EU and LB-US.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose des équilibreurs de charge suivants :

    | Nom | Région | Type | Référence SKU et niveau |
    | --- | --- | --- | --- |
    | LB-EU | West Europe | Public | Standard, Regional |
    | LB-US | Central US | Public | Standard, Regional |
    | ILB-EU | West Europe | Interne | Standard, Regional |

    Contoso prévoit de déployer un équilibreur de charge global nommé **GLB1** pour une application actuellement publiée par LB-EU et LB-US.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can add ILB-EU to the backend pool of GLB1.
        fr: Vous pouvez ajouter ILB-EU au pool principal de GLB1.
    - id: s2
      text:
        en: The virtual machines behind LB-EU see the original IP address of the clients that connect through GLB1.
        fr: Les machines virtuelles situées derrière LB-EU voient l'adresse IP d'origine des clients qui se connectent par GLB1.
    - id: s3
      text:
        en: You can deploy GLB1 by changing the tier of LB-EU from Regional to Global.
        fr: Vous pouvez déployer GLB1 en faisant passer le niveau de LB-EU de Regional à Global.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The backend pool of a global load balancer accepts only regional public Standard load balancers; internal load balancers cannot be added. The global load balancer is a layer 4 pass-through service, so the client IP address is preserved up to the backend VMs. An existing regional load balancer cannot be upgraded to the Global tier; you must create a new global-tier load balancer.
    fr: |
      Le pool principal d'un équilibreur de charge global n'accepte que des équilibreurs de charge publics Standard régionaux ; les équilibreurs de charge internes ne peuvent pas y être ajoutés. L'équilibreur de charge global est un service pass-through de couche 4 : l'adresse IP du client est conservée jusqu'aux machines virtuelles principales. Un équilibreur de charge régional existant ne peut pas passer au niveau Global ; vous devez créer un nouvel équilibreur de charge de niveau Global.
references:
  - title: Global load balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/cross-region-overview
