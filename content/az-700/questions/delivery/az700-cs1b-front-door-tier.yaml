id: az700-cs1b-front-door-tier
objective: "3.3.3"
type: single
caseStudy: az700-cs1b-proseware
difficulty: 1
status: draft
stem:
  en: You need to select the tier of fd-proseware. The solution must meet the delivery and security requirements and minimize costs. Which tier should you select?
  fr: Vous devez sélectionner le niveau de fd-proseware. La solution doit respecter les exigences de distribution et de sécurité, et réduire les coûts au minimum. Quel niveau devez-vous sélectionner ?
body:
  options:
    - { id: a, text: { en: "Azure Front Door Standard", fr: "Azure Front Door Standard" } }
    - { id: b, text: { en: "Azure Front Door Premium", fr: "Azure Front Door Premium" } }
    - { id: c, text: { en: "Azure Front Door (classic)", fr: "Azure Front Door (classique)" } }
    - { id: d, text: { en: "Azure Front Door Standard with a WAF policy that contains custom rules", fr: "Azure Front Door Standard avec une stratégie WAF qui contient des règles personnalisées" } }
answer: { optionId: b }
explanation:
  correct:
    en: Private Link connections to origins, the Microsoft-managed Default Rule Set and bot protection are available only in Azure Front Door Premium. The requirements need all three, so Premium is the least expensive tier that meets them.
    fr: "Les connexions Private Link vers les origines, l'ensemble de règles par défaut (Default Rule Set) géré par Microsoft et la protection contre les bots ne sont disponibles que dans Azure Front Door Premium. Les exigences demandent les trois : Premium est donc le niveau le moins coûteux qui les respecte."
  options:
    a:
      en: The Standard tier doesn't support Private Link origins, managed rule sets or bot protection.
      fr: Le niveau Standard ne prend en charge ni les origines Private Link, ni les ensembles de règles managés, ni la protection contre les bots.
    c:
      en: New Azure Front Door (classic) profiles can no longer be created, and the classic tier is being retired.
      fr: Il n'est plus possible de créer de profils Azure Front Door (classique), et ce niveau est en cours de mise hors service.
    d:
      en: Custom rules are written and maintained by Proseware, not managed by Microsoft, and Standard still offers no Private Link origin.
      fr: Les règles personnalisées sont écrites et gérées par Proseware, pas par Microsoft, et Standard n'offre toujours pas d'origine Private Link.
references:
  - title: Comparison between Azure Front Door and Azure Content Delivery Network
    url: https://learn.microsoft.com/en-us/azure/frontdoor/standard-premium/tier-comparison
  - title: Secure your origin with Private Link in Azure Front Door Premium
    url: https://learn.microsoft.com/en-us/azure/frontdoor/private-link
