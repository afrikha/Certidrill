id: az700-3b-pl-supported-origins
objective: "3.3.9"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam uses Azure Front Door Premium. Fabrikam wants to connect the following resources as origins through Private Link, without creating any other Azure resource.

    | Resource | Type |
    | --- | --- |
    | app-orders | App Service web app |
    | app-orders/staging | Deployment slot of app-orders |
    | swa-docs | Azure Static Web Apps |
    | stmedia | Storage account (Blob service) |
    | vm-api | Virtual machine with a private IP address only |

    Which two resources can be connected as Private Link origins?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise Azure Front Door Premium. Fabrikam veut connecter les ressources suivantes comme origines par Private Link, sans créer aucune autre ressource Azure.

    | Ressource | Type |
    | --- | --- |
    | app-orders | Application web App Service |
    | app-orders/staging | Emplacement de déploiement d'app-orders |
    | swa-docs | Azure Static Web Apps |
    | stmedia | Compte de stockage (service Blob) |
    | vm-api | Machine virtuelle avec une adresse IP privée uniquement |

    Quelles sont les deux ressources qui peuvent être connectées comme origines Private Link ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: app-orders }
    - { id: b, text: app-orders/staging }
    - { id: c, text: swa-docs }
    - { id: d, text: stmedia }
    - { id: e, text: vm-api }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: App Service web apps and Blob Storage are supported Private Link origins, with the target subresource `sites` or `blob`. Front Door creates the private endpoint and the resource owner approves the connection.
    fr: "Les applications web App Service et le Stockage Blob sont des origines Private Link prises en charge, avec la sous-ressource cible `sites` ou `blob`. Front Door crée le point de terminaison privé et le propriétaire de la ressource approuve la connexion."
  options:
    b: { en: "App Service deployment slots aren't supported with Front Door Private Link.", fr: "Les emplacements de déploiement App Service ne sont pas pris en charge avec Private Link de Front Door." }
    c: { en: "Azure Static Web Apps isn't supported with Front Door Private Link.", fr: "Azure Static Web Apps n'est pas pris en charge avec Private Link de Front Door." }
    e: { en: "A VM is reached through an internal load balancer with a Private Link service, which would be another resource to create.", fr: "Une machine virtuelle se joint par un équilibreur de charge interne doté d'un service Private Link, soit une autre ressource à créer." }
references:
  - title: Secure your origin with Private Link in Azure Front Door Premium
    url: https://learn.microsoft.com/en-us/azure/frontdoor/private-link
