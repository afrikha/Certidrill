id: az700-cs3a-media-caching
objective: "3.3.6"
type: dropdown
caseStudy: az700-cs3a-southridge
difficulty: 2
status: draft
stem:
  en: |
    In fd-southridge, you create an origin group named **og-web** that contains ILB-WE and ILB-EUS, and an origin group named **og-media** that contains stsrposters. You add a route for the pattern `/media/*` and enable caching on it.

    You need to complete the configuration of the route to meet the requirement for `/media/*`. How should you configure the route? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Dans fd-southridge, vous créez un groupe d'origines nommé **og-web** qui contient ILB-WE et ILB-EUS, et un groupe d'origines nommé **og-media** qui contient stsrposters. Vous ajoutez un itinéraire pour le modèle `/media/*` et vous y activez la mise en cache.

    Vous devez terminer la configuration de l'itinéraire pour respecter l'exigence relative à `/media/*`. Comment devez-vous configurer l'itinéraire ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Origin group: [[og]]

      Query string caching behavior: [[qs]]

      Query parameters: [[params]]
    fr: |
      Groupe d'origines : [[og]]

      Comportement de mise en cache des chaînes de requête : [[qs]]

      Paramètres de requête : [[params]]
  slots:
    - id: og
      options:
        - { id: media, text: og-media }
        - { id: web, text: og-web }
        - { id: both, text: { en: "A new origin group that contains ILB-WE, ILB-EUS and stsrposters", fr: "Un nouveau groupe d'origines qui contient ILB-WE, ILB-EUS et stsrposters" } }
    - id: qs
      options:
        - { id: ignore, text: Ignore Query String }
        - { id: use, text: Use Query String }
        - { id: ignorespec, text: Ignore Specified Query Strings }
        - { id: includespec, text: Include Specified Query Strings }
    - id: params
      options:
        - { id: v, text: v }
        - { id: utm, text: "utm_source, utm_campaign" }
        - { id: none, text: { en: "None", fr: "Aucun" } }
answer:
  values: { og: media, qs: includespec, params: v }
explanation:
  correct:
    en: |
      The posters and thumbnails are in stsrposters, so the route forwards to og-media. Include Specified Query Strings builds the cache key from the listed parameters only: listing v gives each version its own cache entry, while any other parameter, whatever its name, is left out of the key.
    fr: |
      Les affiches et les miniatures se trouvent dans stsrposters : l'itinéraire transfère donc vers og-media. Include Specified Query Strings construit la clé de cache à partir des seuls paramètres listés : lister v donne à chaque version sa propre entrée de cache, tandis que tout autre paramètre, quel que soit son nom, reste hors de la clé.
  options:
    both: { en: "Front Door would spread /media/* requests across all the origins of the group, including the web VMs, which don't hold the posters.", fr: "Front Door répartirait les requêtes /media/* entre toutes les origines du groupe, y compris les machines virtuelles web, qui ne contiennent pas les affiches." }
    ignore: { en: "Ignore Query String caches one copy per path and keeps serving it until it expires, even after v changes.", fr: "Ignore Query String met en cache une copie par chemin et la sert jusqu'à son expiration, même après un changement de v." }
    use: { en: "Use Query String treats every unique query string as a separate asset, so tracking parameters would create separate cache entries.", fr: "Use Query String traite chaque chaîne de requête unique comme une ressource distincte : les paramètres de suivi créeraient des entrées de cache distinctes." }
    ignorespec: { en: "Ignoring specified parameters requires knowing their names in advance, but the tracking parameter names change with every campaign.", fr: "Ignorer des paramètres spécifiés exige de connaître leur nom à l'avance, or les noms des paramètres de suivi changent à chaque campagne." }
references:
  - title: Caching with Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-caching
