id: az700-3a-snat-add-frontend-order
objective: "3.1.11"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a public Standard load balancer named **LB1** with the following configuration:

    - Frontend IP configuration **FE1**, which uses the public IP address **PIP1**
    - Backend pool **Pool1**, which contains 10 virtual machines
    - Load-balancing rule **Rule1** for TCP port 443 on FE1, with outbound SNAT already disabled

    Each virtual machine must be able to use 8,000 SNAT ports for its outbound connections. The solution must use outbound rules of LB1.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'un équilibreur de charge public Standard nommé **LB1**, configuré comme suit :

    - Configuration IP frontale **FE1**, qui utilise l'adresse IP publique **PIP1**
    - Pool principal **Pool1**, qui contient 10 machines virtuelles
    - Règle d'équilibrage de charge **Rule1** pour le port TCP 443 sur FE1, avec la SNAT sortante déjà désactivée

    Chaque machine virtuelle doit pouvoir utiliser 8 000 ports SNAT pour ses connexions sortantes. La solution doit utiliser des règles de trafic sortant de LB1.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: pip, text: { en: "Create a Standard SKU public IP address named PIP2.", fr: "Créer une adresse IP publique de référence SKU Standard nommée PIP2." } }
    - { id: fe, text: { en: "Add a frontend IP configuration named FE2 that uses PIP2 to LB1.", fr: "Ajouter à LB1 une configuration IP frontale nommée FE2 qui utilise PIP2." } }
    - { id: out2, text: { en: "Create an outbound rule for Pool1 that uses FE1 and FE2 and allocates 8,000 ports per instance.", fr: "Créer une règle de trafic sortant pour Pool1 qui utilise FE1 et FE2 et alloue 8 000 ports par instance." } }
    - { id: out1, text: { en: "Create an outbound rule for Pool1 that uses only FE1 and allocates 8,000 ports per instance.", fr: "Créer une règle de trafic sortant pour Pool1 qui utilise uniquement FE1 et alloue 8 000 ports par instance." } }
    - { id: fip, text: { en: "Enable Floating IP on Rule1.", fr: "Activer l'IP flottante sur Rule1." } }
    - { id: nat, text: { en: "Create an inbound NAT rule for Pool1 that uses FE2.", fr: "Créer une règle NAT de trafic entrant pour Pool1 qui utilise FE2." } }
answer:
  sequence: [ pip, fe, out2 ]
explanation:
  correct:
    en: |
      Each frontend IP address provides 64,000 SNAT ports. Ten VMs at 8,000 ports need 80,000 ports, so one IP is not enough and the configuration would be rejected. You create a second Standard public IP, add it as a frontend of LB1, and then create the outbound rule that uses both frontends (128,000 ports) and allocates 8,000 ports, a multiple of 8, per instance. FE1 can be used because outbound SNAT is disabled on Rule1.
    fr: |
      Chaque adresse IP frontale fournit 64 000 ports SNAT. Dix machines virtuelles à 8 000 ports nécessitent 80 000 ports : une seule IP ne suffit pas et la configuration serait rejetée. Vous créez une deuxième IP publique Standard, vous l'ajoutez comme front-end de LB1, puis vous créez la règle de trafic sortant qui utilise les deux front-ends (128 000 ports) et alloue 8 000 ports, un multiple de 8, par instance. FE1 peut être utilisé, car la SNAT sortante est désactivée sur Rule1.
  options:
    out1: { en: "FE1 alone offers 64,000 ports, fewer than the 80,000 required.", fr: "FE1 seul offre 64 000 ports, moins que les 80 000 nécessaires." }
    fip: { en: "Floating IP concerns inbound delivery to the VMs, not SNAT capacity.", fr: "L'IP flottante concerne la remise du trafic entrant aux machines virtuelles, pas la capacité SNAT." }
    nat: { en: "Inbound NAT rules forward inbound connections; they add no SNAT capacity.", fr: "Les règles NAT de trafic entrant transfèrent des connexions entrantes ; elles n'ajoutent aucune capacité SNAT." }
references:
  - title: Outbound rules for Azure Load Balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/outbound-rules
