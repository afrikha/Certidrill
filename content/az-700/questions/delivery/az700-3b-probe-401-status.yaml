id: az700-3b-probe-401-status
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam publishes an internal expense application through an Application Gateway Standard_v2 named **AGW1**. The backend pool contains three virtual machines that run the application on HTTP port 8080.

    Every path of the application, including `/`, requires authentication: an anonymous request receives **HTTP 401 Unauthorized**. The **Backend health** page of AGW1 reports all three servers as **Unhealthy**, although the application works when users connect directly to the servers.

    You need the servers to be reported as healthy while the application runs. A server whose application stops responding must still stop receiving requests. You cannot modify the application.

    What should you do?
  fr: |
    Fabrikam publie une application interne de notes de frais au moyen d'un Application Gateway Standard_v2 nommé **AGW1**. Le pool principal contient trois machines virtuelles qui exécutent l'application sur le port HTTP 8080.

    Tous les chemins de l'application, y compris `/`, exigent une authentification : une requête anonyme reçoit **HTTP 401 Unauthorized**. La page **Intégrité du back-end** d'AGW1 indique que les trois serveurs sont **Non sain**, bien que l'application fonctionne quand les utilisateurs se connectent directement aux serveurs.

    Les serveurs doivent être signalés comme sains tant que l'application s'exécute. Un serveur dont l'application ne répond plus doit toujours cesser de recevoir des requêtes. Vous ne pouvez pas modifier l'application.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a custom probe whose unhealthy threshold is 20, and associate it with the backend settings.", fr: "Créer une sonde personnalisée dont le seuil de défaillance est de 20, et l'associer aux paramètres de back-end." } }
    - { id: b, text: { en: "Create a custom probe whose match condition accepts status codes 200-399 and 401, and associate it with the backend settings.", fr: "Créer une sonde personnalisée dont la condition de correspondance accepte les codes d'état 200-399 et 401, et l'associer aux paramètres de back-end." } }
    - { id: c, text: { en: "Create a custom probe whose MinServers value is 3, and associate it with the backend settings.", fr: "Créer une sonde personnalisée dont la valeur MinServers est 3, et l'associer aux paramètres de back-end." } }
    - { id: d, text: { en: "Create a custom probe whose timeout is 120 seconds, and associate it with the backend settings.", fr: "Créer une sonde personnalisée dont le délai d'expiration est de 120 secondes, et l'associer aux paramètres de back-end." } }
answer: { optionId: b }
explanation:
  correct:
    en: The default probe treats only status codes 200 to 399 as healthy, so a 401 answer marks every server down. A custom probe can define the healthy status codes, as a list or ranges, so 401 proves that the application answers while a server that does not respond still fails its probes. The custom probe is used once it is referenced by the backend settings of a rule.
    fr: "La sonde par défaut ne considère comme sains que les codes d'état 200 à 399 : une réponse 401 marque donc chaque serveur comme défaillant. Une sonde personnalisée peut définir les codes d'état sains, sous forme de liste ou de plages : le code 401 prouve alors que l'application répond, tandis qu'un serveur qui ne répond pas échoue toujours à ses sondes. La sonde personnalisée est utilisée dès que les paramètres de back-end d'une règle la référencent."
  options:
    a: { en: "Every probe still receives 401, so raising the threshold only delays the moment the server is marked down.", fr: "Chaque sonde reçoit toujours 401 : relever le seuil ne fait que retarder le moment où le serveur est marqué comme défaillant." }
    c: { en: "MinServers keeps servers marked healthy even when they fail, so a server whose application stops would keep receiving requests.", fr: "MinServers maintient des serveurs marqués comme sains même en cas d'échec : un serveur dont l'application s'arrête continuerait à recevoir des requêtes." }
    d: { en: "The 401 response arrives quickly; a longer timeout does not change the fact that 401 is outside the accepted range.", fr: "La réponse 401 arrive rapidement ; un délai plus long ne change rien au fait que 401 est hors de la plage acceptée." }
references:
  - title: Application Gateway health probes overview
    url: https://learn.microsoft.com/en-us/azure/application-gateway/application-gateway-probe-overview
