id: az700-3a-usecase-tls-passthrough
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank exposes a trading API that runs on six virtual machines in the East US region. Clients connect from the internet over HTTPS (TCP port 443).

    The solution must meet the following requirements:

    - TLS traffic must be decrypted only on the virtual machines. No intermediate service may terminate or re-encrypt the TLS sessions.
    - The virtual machines must see the original client IP address as the source of each TCP connection.
    - Clients must connect to a single public IP address.
    - Traffic must be sent only to healthy virtual machines.

    Which service should you use?
  fr: |
    Woodgrove Bank expose une API de trading qui s'exécute sur six machines virtuelles dans la région East US. Les clients se connectent depuis Internet en HTTPS (port TCP 443).

    La solution doit répondre aux exigences suivantes :

    - Le trafic TLS ne doit être déchiffré que sur les machines virtuelles. Aucun service intermédiaire ne doit terminer ni rechiffrer les sessions TLS.
    - Les machines virtuelles doivent voir l'adresse IP d'origine du client comme source de chaque connexion TCP.
    - Les clients doivent se connecter à une seule adresse IP publique.
    - Le trafic ne doit être envoyé qu'aux machines virtuelles saines.

    Quel service devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "An Application Gateway Standard_v2 configured for end-to-end TLS", fr: "Un Application Gateway Standard_v2 configuré pour le chiffrement TLS de bout en bout" } }
    - { id: b, text: { en: "A public Standard load balancer", fr: "Un équilibreur de charge public Standard" } }
    - { id: c, text: { en: "A Traffic Manager profile that uses the Performance routing method", fr: "Un profil Traffic Manager qui utilise la méthode de routage Performance" } }
    - { id: d, text: { en: "An Azure Front Door Premium profile with the VMs as origins", fr: "Un profil Azure Front Door Premium avec les machines virtuelles comme origines" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Load Balancer is a layer 4 pass-through service. It forwards the TCP flows without inspecting or decrypting them, preserves the client source IP, exposes one frontend public IP and uses health probes to select healthy instances.
    fr: |
      Azure Load Balancer est un service pass-through de couche 4. Il transfère les flux TCP sans les inspecter ni les déchiffrer, conserve l'adresse IP source du client, expose une seule IP publique frontale et utilise des sondes d'intégrité pour sélectionner les instances saines.
  options:
    a: { en: "With end-to-end TLS, Application Gateway still terminates the client session and opens a new encrypted session to the backend, and the backend sees the gateway as the TCP source.", fr: "Avec le TLS de bout en bout, Application Gateway termine quand même la session du client et ouvre une nouvelle session chiffrée vers le back-end, qui voit la passerelle comme source TCP." }
    c: { en: "Traffic Manager is DNS-based: clients would connect directly to the address of each endpoint instead of a single public IP address.", fr: "Traffic Manager repose sur le DNS : les clients se connecteraient directement à l'adresse de chaque point de terminaison au lieu d'une seule adresse IP publique." }
    d: { en: "Azure Front Door terminates TLS at the edge and opens new connections to the origins.", fr: "Azure Front Door termine le TLS en périphérie et ouvre de nouvelles connexions vers les origines." }
references:
  - title: Load balancing options
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/load-balancing-overview
  - title: Application Gateway TCP/TLS proxy overview
    url: https://learn.microsoft.com/en-us/azure/application-gateway/tcp-tls-proxy-overview
