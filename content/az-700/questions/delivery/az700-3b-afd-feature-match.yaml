id: az700-3b-afd-feature-match
objective: "3.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin publishes its travel website through an Azure Front Door Standard profile. The website runs on App Service apps in West Europe and North Europe.

    Which Front Door feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin publie son site web de voyages au moyen d'un profil Azure Front Door Standard. Le site s'exécute sur des applications App Service en West Europe et en North Europe.

    Quelle fonctionnalité de Front Door devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: cache, text: { en: "Caching on the route", fr: "Mise en cache sur l'itinéraire" } }
    - { id: geo, text: { en: "WAF custom rule with a geo match condition", fr: "Règle WAF personnalisée avec une condition de correspondance géographique" } }
    - { id: priority, text: { en: "Origin priority in the origin group", fr: "Priorité des origines dans le groupe d'origines" } }
    - { id: rules, text: { en: "Rule set with a Modify response header action", fr: "Ensemble de règles avec une action Modifier l'en-tête de réponse" } }
    - { id: affinity, text: { en: "Session affinity on the origin group", fr: "Affinité de session sur le groupe d'origines" } }
  targets:
    - id: t1
      text: { en: "Serve the destination photos from the edge without contacting the origins for each request.", fr: "Servir les photos des destinations depuis la périphérie sans contacter les origines à chaque requête." }
    - id: t2
      text: { en: "Block requests that come from two specific countries.", fr: "Bloquer les requêtes provenant de deux pays précis." }
    - id: t3
      text: { en: "Send all traffic to West Europe, and to North Europe only when West Europe is unhealthy.", fr: "Envoyer tout le trafic vers West Europe, et vers North Europe uniquement quand West Europe n'est pas sain." }
    - id: t4
      text: { en: "Add a Content-Security-Policy header to every response.", fr: "Ajouter un en-tête Content-Security-Policy à chaque réponse." }
answer:
  mapping: { t1: cache, t2: geo, t3: priority, t4: rules }
explanation:
  correct:
    en: Caching is enabled per route and lets the PoPs answer from their cache. Geo-filtering is a WAF custom rule, available in Standard and Premium. Origins with a lower priority value receive all the traffic while they are healthy, which gives active/passive failover. A rule set action modifies headers of the responses at the edge.
    fr: "La mise en cache s'active par itinéraire et permet aux POP de répondre depuis leur cache. Le filtrage géographique est une règle WAF personnalisée, disponible en Standard et en Premium. Les origines de valeur de priorité la plus faible reçoivent tout le trafic tant qu'elles sont saines, ce qui donne un basculement actif/passif. Une action d'ensemble de règles modifie les en-têtes des réponses en périphérie."
  options:
    affinity: { en: "Session affinity keeps a user on the origin chosen for the first request; it doesn't meet any of these requirements.", fr: "L'affinité de session maintient un utilisateur sur l'origine choisie pour la première requête ; elle ne répond à aucune de ces exigences." }
references:
  - title: What is Azure Front Door?
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-overview
  - title: Traffic routing methods for origins
    url: https://learn.microsoft.com/en-us/azure/frontdoor/routing-methods
