id: az700-sr2-afd-privatelink-2
objective: "3.3.9"
type: series_yesno
series: az700-sr2-afd-privatelink
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You integrate app1 with VNet1 and use a Premium profile.
  fr: Vous intégrez app1 à VNet1 et utilisez un profil Premium.
body:
  solution:
    en: |
      You enable virtual network integration on app1 by using Subnet-Int, and you set **Public network access** of app1 to **Disabled**. You create an Azure Front Door Premium profile and add app1 as an origin by using its default host name, without enabling Private Link.
    fr: |
      Vous activez l'intégration au réseau virtuel sur app1 en utilisant Subnet-Int, et vous définissez **Public network access** d'app1 sur **Disabled**. Vous créez un profil Azure Front Door Premium et ajoutez app1 comme origine par son nom d'hôte par défaut, sans activer Private Link.
answer: { value: false }
explanation:
  correct:
    en: |
      Virtual network integration is used only for outbound calls from app1 into the virtual network; it doesn't give inbound private access to the app. Front Door still targets the public host name, which is now blocked, so Front Door can't reach app1 and no private endpoint is involved.
    fr: |
      L'intégration au réseau virtuel ne sert qu'aux appels sortants d'app1 vers le réseau virtuel ; elle ne donne pas d'accès privé entrant à l'application. Front Door cible toujours le nom d'hôte public, désormais bloqué : Front Door ne peut pas joindre app1 et aucun point de terminaison privé n'est utilisé.
references:
  - title: Integrate your app with an Azure virtual network
    url: https://learn.microsoft.com/en-us/azure/app-service/overview-vnet-integration
