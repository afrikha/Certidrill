id: az700-cs2c-backend-tls
objective: "3.2.9"
type: single
caseStudy: az700-cs2c-fourth-coffee
difficulty: 1
status: draft
stem:
  en: |
    Health probes report the instances of vmss-orders as unhealthy, and the backend health page of appgw-orders reports a certificate trust error. You need to meet the requirement for the traffic between appgw-orders and vmss-orders.

    What should you do?
  fr: |
    Les sondes d'intégrité signalent les instances de vmss-orders comme défaillantes, et la page d'intégrité du back-end de appgw-orders signale une erreur d'approbation de certificat. Vous devez respecter l'exigence relative au trafic entre appgw-orders et vmss-orders.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Upload the public certificate of each instance to bs-orders as an authentication certificate.", fr: "Charger le certificat public de chaque instance dans bs-orders comme certificat d'authentification." } }
    - { id: b, text: { en: "Change the protocol of bs-orders to HTTP on port 80.", fr: "Remplacer le protocole de bs-orders par HTTP sur le port 80." } }
    - { id: c, text: { en: "Upload the root certificate of FC-Root-CA to bs-orders as a trusted root certificate.", fr: "Charger le certificat racine de FC-Root-CA dans bs-orders comme certificat racine approuvé." } }
    - { id: d, text: { en: "Upload the PFX certificate of order.fourthcoffee.com to the listener lst-orders.", fr: "Charger le certificat PFX de order.fourthcoffee.com dans l'écouteur lst-orders." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With the v2 SKU, a backend certificate signed by a well-known CA needs no extra step, but a certificate issued by an enterprise CA requires its base64-encoded root certificate to be uploaded as a trusted root certificate in the backend settings. Application Gateway also checks that the host name of bs-orders matches the common name of the backend certificate, which is the case here.
    fr: |
      Avec la référence SKU v2, un certificat de back-end signé par une autorité de certification connue ne demande aucune étape supplémentaire, mais un certificat émis par une autorité de certification d'entreprise exige de charger son certificat racine encodé en base64 comme certificat racine approuvé dans les paramètres de back-end. Application Gateway vérifie aussi que le nom d'hôte de bs-orders correspond au nom commun du certificat de back-end, ce qui est le cas ici.
  options:
    a: { en: "Authentication certificates belong to the v1 SKU; the v2 SKU replaced them with trusted root certificates.", fr: "Les certificats d'authentification appartiennent à la référence SKU v1 ; la v2 les a remplacés par des certificats racines approuvés." }
    b: { en: "HTTP to the backend would remove the encryption that the requirement asks for.", fr: "HTTP vers le back-end supprimerait le chiffrement que l'exigence demande." }
    d: { en: "The listener certificate secures the client side of the gateway; it doesn't make the gateway trust the backend certificates.", fr: "Le certificat de l'écouteur sécurise le côté client de la passerelle ; il ne fait pas approuver les certificats du back-end par la passerelle." }
references:
  - title: Overview of TLS termination and end to end TLS with Application Gateway
    url: https://learn.microsoft.com/en-us/azure/application-gateway/ssl-overview
