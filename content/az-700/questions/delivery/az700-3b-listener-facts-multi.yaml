id: az700-3b-listener-facts-multi
objective: "3.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are designing the listeners of an Application Gateway WAF_v2 named **AGW1**. AGW1 has a public and a private IPv4 frontend IP configuration. HTTP/2 is enabled on AGW1.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez les écouteurs d'un Application Gateway WAF_v2 nommé **AGW1**. AGW1 possède une configuration IP frontale IPv4 publique et une configuration IP frontale IPv4 privée. HTTP/2 est activé sur AGW1.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A multi-site listener can contain host names such as *.contoso.com and app?.fabrikam.com.", fr: "Un écouteur multisite peut contenir des noms d'hôte tels que *.contoso.com et app?.fabrikam.com." } }
    - { id: b, text: { en: "A public listener and a private listener must use different frontend ports.", fr: "Un écouteur public et un écouteur privé doivent utiliser des ports frontaux différents." } }
    - { id: c, text: { en: "An HTTPS listener can use a .cer file that contains only the public key of the certificate.", fr: "Un écouteur HTTPS peut utiliser un fichier .cer qui ne contient que la clé publique du certificat." } }
    - { id: d, text: { en: "HTTP/2 is also used for the connections from AGW1 to the backend servers.", fr: "HTTP/2 est également utilisé pour les connexions d'AGW1 vers les serveurs principaux." } }
    - { id: e, text: { en: "A multi-site listener can contain up to five host names.", fr: "Un écouteur multisite peut contenir jusqu'à cinq noms d'hôte." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: On the v2 SKUs, multi-site listeners accept the wildcard characters `*` and `?` in host names, and each multi-site listener can list up to five host names.
    fr: "Sur les SKU v2, les écouteurs multisites acceptent les caractères génériques `*` et `?` dans les noms d'hôte, et chaque écouteur multisite peut répertorier jusqu'à cinq noms d'hôte."
  options:
    b: { en: "On v2, public and private IPv4 listeners can share the same frontend port; only IPv6 public and private listeners need different ports.", fr: "En v2, les écouteurs IPv4 public et privé peuvent partager le même port frontal ; seuls les écouteurs IPv6 public et privé exigent des ports différents." }
    c: { en: "The listener certificate must be a PFX file that contains the private key.", fr: "Le certificat de l'écouteur doit être un fichier PFX qui contient la clé privée." }
    d: { en: "HTTP/2 applies to client connections only; the backend connections always use HTTP/1.1.", fr: "HTTP/2 ne s'applique qu'aux connexions clientes ; les connexions vers le back-end utilisent toujours HTTP/1.1." }
references:
  - title: Application Gateway listener configuration
    url: https://learn.microsoft.com/en-us/azure/application-gateway/configuration-listeners
  - title: Application Gateway multi-site hosting
    url: https://learn.microsoft.com/en-us/azure/application-gateway/multiple-site-overview
