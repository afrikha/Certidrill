id: az700-sr1-tm-regional-failover-2
objective: "3.1.7"
type: series_yesno
series: az700-sr1-tm-regional-failover
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    You create one profile that uses the Performance routing method.
  fr: |
    Vous créez un profil qui utilise la méthode de routage Performance.
body:
  solution:
    en: |
      You create one Traffic Manager profile that uses the **Performance** routing method, with App-WE and App-EUS as external endpoints and their locations set to West Europe and East US.
    fr: |
      Vous créez un profil Traffic Manager qui utilise la méthode de routage **Performance**, avec App-WE et App-EUS comme points de terminaison externes et leurs emplacements définis sur West Europe et East US.
answer: { value: false }
explanation:
  correct:
    en: |
      Performance routing fails over to a healthy endpoint, but it sends each user to the endpoint with the lowest network latency, not according to where the query comes from. Users outside Europe who are closer to West Europe, for example in parts of Africa or the Middle East, would be sent to App-WE, which breaks the first requirement. Mapping users to endpoints by location requires Geographic routing.
    fr: |
      Le routage Performance bascule vers un point de terminaison intègre, mais il envoie chaque utilisateur vers le point de terminaison qui offre la latence réseau la plus faible, et non selon la provenance de la requête. Des utilisateurs hors d'Europe plus proches de West Europe, par exemple dans une partie de l'Afrique ou du Moyen-Orient, seraient envoyés vers App-WE, ce qui ne respecte pas la première exigence. Associer les utilisateurs aux points de terminaison selon leur emplacement exige le routage Geographic.
references:
  - title: Traffic Manager routing methods
    url: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-routing-methods
