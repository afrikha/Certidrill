id: az700-3b-usecase-failover-dns
objective: "3.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs an HTTPS customer portal on App Service apps in two Azure regions. Today, Azure Traffic Manager with the Priority routing method sends users to the primary region. During the last regional outage, many users kept reaching the failed region for several minutes after Traffic Manager had detected the failure, because their devices cached the DNS answer.

    You need to replace Traffic Manager with a solution that meets the following requirements:

    - Failover to the secondary region does not depend on the DNS cache of the clients.
    - TLS from the clients is terminated before the traffic reaches the regions.
    - A web application firewall inspects the requests.

    What should you use?
  fr: |
    Fabrikam exécute un portail client HTTPS sur des applications App Service dans deux régions Azure. Aujourd'hui, Azure Traffic Manager avec la méthode de routage Priorité envoie les utilisateurs vers la région principale. Lors de la dernière panne régionale, de nombreux utilisateurs ont continué d'atteindre la région défaillante pendant plusieurs minutes après que Traffic Manager a détecté la panne, car leurs appareils avaient mis en cache la réponse DNS.

    Vous devez remplacer Traffic Manager par une solution qui répond aux exigences suivantes :

    - Le basculement vers la région secondaire ne dépend pas du cache DNS des clients.
    - Le TLS des clients prend fin avant que le trafic n'atteigne les régions.
    - Un pare-feu d'applications web inspecte les requêtes.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Load Balancer (global tier) with the regional apps behind regional load balancers", fr: "Azure Load Balancer (niveau global) avec les applications régionales derrière des équilibreurs de charge régionaux" } }
    - { id: b, text: { en: "Traffic Manager with a lower DNS TTL and the Performance routing method", fr: "Traffic Manager avec une durée de vie DNS plus courte et la méthode de routage Performances" } }
    - { id: c, text: { en: "Azure Front Door with both apps in one origin group", fr: "Azure Front Door avec les deux applications dans un même groupe d'origines" } }
    - { id: d, text: { en: "An Application Gateway WAF_v2 in each region behind Traffic Manager", fr: "Un Application Gateway WAF_v2 dans chaque région derrière Traffic Manager" } }
answer: { optionId: c }
explanation:
  correct:
    en: Clients keep connecting to the same Front Door endpoint; the edge selects a healthy origin for each request based on health probes, so failover doesn't wait for DNS caches to expire. Front Door also terminates TLS at the edge and runs a WAF policy.
    fr: "Les clients continuent de se connecter au même point de terminaison Front Door ; la périphérie choisit une origine saine pour chaque requête d'après les sondes d'intégrité : le basculement n'attend donc pas l'expiration des caches DNS. Front Door met aussi fin à TLS en périphérie et exécute une stratégie WAF."
  options:
    a: { en: "The global load balancer works at layer 4: it does not terminate TLS or run a WAF.", fr: "L'équilibreur de charge global fonctionne en couche 4 : il ne met pas fin à TLS et n'exécute pas de WAF." }
    b: { en: "Any Traffic Manager design still depends on how long clients cache the DNS answer.", fr: "Toute conception Traffic Manager dépend toujours de la durée pendant laquelle les clients mettent en cache la réponse DNS." }
    d: { en: "The regional gateways add a WAF, but failover still relies on Traffic Manager DNS answers.", fr: "Les passerelles régionales ajoutent un WAF, mais le basculement repose toujours sur les réponses DNS de Traffic Manager." }
references:
  - title: What is Azure Front Door?
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-overview
  - title: Traffic routing methods for origins
    url: https://learn.microsoft.com/en-us/azure/frontdoor/routing-methods
