id: az700-3a-nat-v2-facts-multi
objective: "3.1.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove creates an inbound NAT rule named **NatSsh** on a public Standard load balancer. NatSsh targets the backend pool **Pool1**, with a frontend port range start of 60000, a maximum number of machines in the backend pool of 10, and a backend port of 22. Pool1 contains six virtual machines.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove crée une règle NAT de trafic entrant nommée **NatSsh** sur un équilibreur de charge public Standard. NatSsh cible le pool principal **Pool1**, avec un début de plage de ports frontaux à 60000, un nombre maximal de machines dans le pool principal de 10 et un port principal 22. Pool1 contient six machines virtuelles.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "NatSsh works without a health probe.", fr: "NatSsh fonctionne sans sonde d'intégrité." } }
    - { id: b, text: { en: "Connections to frontend port 60000 are distributed among all the healthy virtual machines of Pool1.", fr: "Les connexions au port frontal 60000 sont réparties entre toutes les machines virtuelles saines de Pool1." } }
    - { id: c, text: { en: "When a seventh virtual machine is added to Pool1, a port mapping is created for it automatically.", fr: "Quand une septième machine virtuelle est ajoutée à Pool1, une association de port est créée automatiquement pour elle." } }
    - { id: d, text: { en: "If Pool1 grows to 12 virtual machines, the frontend port range is extended automatically.", fr: "Si Pool1 passe à 12 machines virtuelles, la plage de ports frontaux est étendue automatiquement." } }
    - { id: e, text: { en: "NatSsh also provides outbound SNAT for the virtual machines of Pool1.", fr: "NatSsh fournit aussi la SNAT sortante aux machines virtuelles de Pool1." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Unlike load-balancing rules, inbound NAT rules don't need a health probe. With a rule that targets a backend pool, port mappings are made from the preallocated range, and new VMs get a mapping automatically as long as free ports remain in the range.
    fr: |
      Contrairement aux règles d'équilibrage de charge, les règles NAT de trafic entrant n'ont pas besoin de sonde d'intégrité. Avec une règle qui cible un pool principal, les associations de ports proviennent de la plage préallouée, et les nouvelles machines virtuelles reçoivent automatiquement une association tant que la plage contient des ports libres.
  options:
    b: { en: "Each frontend port maps to one specific VM; an inbound NAT rule does not load-balance.", fr: "Chaque port frontal est associé à une machine virtuelle précise ; une règle NAT de trafic entrant n'équilibre pas la charge." }
    d: { en: "The range is sized by the maximum number of machines (10); when no free port remains, scaling up the backend pool is blocked.", fr: "La plage est dimensionnée par le nombre maximal de machines (10) ; quand aucun port libre ne reste, l'augmentation du pool principal est bloquée." }
    e: { en: "Outbound SNAT is configured by outbound rules (or comes from a NAT gateway or instance public IPs), not by inbound NAT rules.", fr: "La SNAT sortante est configurée par des règles de trafic sortant (ou fournie par une passerelle NAT ou des IP publiques d'instance), pas par des règles NAT de trafic entrant." }
references:
  - title: Inbound NAT rules
    url: https://learn.microsoft.com/en-us/azure/load-balancer/inbound-nat-rules
