id: az700-3a-pubint-cli-internal
objective: "3.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You need to create a load balancer named **ILB1** for an application tier in the subnet **Apps** of the virtual network **VNet1**. The load balancer must meet the following requirements:

    - Clients inside VNet1 and in peered virtual networks must reach it on the static IP address 10.10.2.20.
    - It must not be reachable from the internet.
    - It must support availability zones and be covered by an SLA.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer un équilibreur de charge nommé **ILB1** pour un niveau applicatif dans le sous-réseau **Apps** du réseau virtuel **VNet1**. L'équilibreur de charge doit répondre aux exigences suivantes :

    - Les clients de VNet1 et des réseaux virtuels reliés par peering doivent le joindre sur l'adresse IP statique 10.10.2.20.
    - Il ne doit pas être accessible depuis Internet.
    - Il doit prendre en charge les zones de disponibilité et être couvert par un contrat SLA.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network lb create \
      --resource-group RG1 \
      --name ILB1 \
      --sku [[sku]] \
      --vnet-name VNet1 \
      --subnet Apps \
      [[fe]] 10.10.2.20 \
      --backend-pool-name AppPool
  slots:
    - id: sku
      options:
        - { id: std, text: Standard }
        - { id: basic, text: Basic }
        - { id: gw, text: Gateway }
    - id: fe
      options:
        - { id: priv, text: "--private-ip-address" }
        - { id: pub, text: "--public-ip-address" }
        - { id: fename, text: "--frontend-ip-name" }
answer:
  values: { sku: std, fe: priv }
explanation:
  correct:
    en: |
      The Standard SKU supports availability zones and has an SLA. Specifying a virtual network, a subnet and `--private-ip-address` creates an internal load balancer whose frontend uses the static private IP address 10.10.2.20, which is reachable from VNet1 and peered networks but never from the internet.
    fr: |
      La référence SKU Standard prend en charge les zones de disponibilité et dispose d'un contrat SLA. Indiquer un réseau virtuel, un sous-réseau et `--private-ip-address` crée un équilibreur de charge interne dont le front-end utilise l'adresse IP privée statique 10.10.2.20, accessible depuis VNet1 et les réseaux reliés par peering, mais jamais depuis Internet.
  options:
    basic: { en: "The Basic SKU is retired and had no availability zones or SLA.", fr: "La référence SKU Basic est mise hors service et ne proposait ni zones de disponibilité ni contrat SLA." }
    gw: { en: "The Gateway SKU is for chaining NVAs; clients do not connect to its frontend directly.", fr: "La référence SKU Gateway sert à chaîner des NVA ; les clients ne se connectent pas directement à son front-end." }
    pub: { en: "--public-ip-address expects a public IP resource name and would create an internet-facing load balancer.", fr: "--public-ip-address attend le nom d'une ressource d'IP publique et créerait un équilibreur de charge exposé à Internet." }
    fename: { en: "--frontend-ip-name sets the name of the frontend configuration, not its IP address.", fr: "--frontend-ip-name définit le nom de la configuration frontale, pas son adresse IP." }
references:
  - title: az network lb
    url: https://learn.microsoft.com/en-us/cli/azure/network/lb?view=azure-cli-latest
