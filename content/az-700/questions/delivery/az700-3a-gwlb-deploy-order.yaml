id: az700-3a-gwlb-deploy-order
objective: "3.1.8"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso publishes an application through a public Standard load balancer named **LB-Web**. Three third-party firewall virtual machines (NVA1 to NVA3) are already deployed in a virtual network named **VNet-Sec**.

    You need to insert the firewalls in the path of all the traffic of LB-Web by using a Gateway Load Balancer. Production traffic to LB-Web must not be interrupted at any step.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso publie une application au moyen d'un équilibreur de charge public Standard nommé **LB-Web**. Trois machines virtuelles de pare-feu tierces (NVA1 à NVA3) sont déjà déployées dans un réseau virtuel nommé **VNet-Sec**.

    Vous devez insérer les pare-feu dans le chemin de tout le trafic de LB-Web au moyen d'un équilibreur de charge de passerelle. Le trafic de production vers LB-Web ne doit être interrompu à aucune étape.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: lb, text: { en: "Create a load balancer with the Gateway SKU and a frontend IP configuration in VNet-Sec.", fr: "Créer un équilibreur de charge de référence SKU Gateway avec une configuration IP frontale dans VNet-Sec." } }
    - { id: pool, text: { en: "Create a backend pool with internal and external tunnel interfaces, and add NVA1 to NVA3 to it.", fr: "Créer un pool principal avec des interfaces de tunnel interne et externe, et y ajouter NVA1 à NVA3." } }
    - { id: rule, text: { en: "Create a health probe and an HA ports load-balancing rule that uses the backend pool.", fr: "Créer une sonde d'intégrité et une règle d'équilibrage de charge de ports HA qui utilise le pool principal." } }
    - { id: chain, text: { en: "In the frontend IP configuration of LB-Web, select the frontend of the Gateway Load Balancer.", fr: "Dans la configuration IP frontale de LB-Web, sélectionner le front-end de l'équilibreur de charge de passerelle." } }
    - { id: udr, text: { en: "Create a route table with a 0.0.0.0/0 route whose next hop is the Gateway Load Balancer frontend IP address.", fr: "Créer une table de routage avec un itinéraire 0.0.0.0/0 dont le tronçon suivant est l'adresse IP frontale de l'équilibreur de charge de passerelle." } }
    - { id: pip, text: { en: "Associate a Standard public IP address with the frontend of the Gateway Load Balancer.", fr: "Associer une adresse IP publique Standard au front-end de l'équilibreur de charge de passerelle." } }
answer:
  sequence: [ lb, pool, rule, chain ]
explanation:
  correct:
    en: |
      The Gateway Load Balancer needs a private frontend, then a backend pool whose tunnel interfaces (external for traffic arriving at the pool, internal for traffic returning to the application) receive the VXLAN-encapsulated packets, then a health probe and an HA ports rule so traffic actually reaches healthy NVAs. Chaining LB-Web comes last: chaining before the NVAs can process traffic would interrupt production.
    fr: |
      L'équilibreur de charge de passerelle a besoin d'un front-end privé, puis d'un pool principal dont les interfaces de tunnel (externe pour le trafic qui arrive au pool, interne pour le trafic qui retourne vers l'application) reçoivent les paquets encapsulés en VXLAN, puis d'une sonde d'intégrité et d'une règle de ports HA pour que le trafic atteigne réellement des NVA saines. Le chaînage de LB-Web vient en dernier : chaîner avant que les NVA puissent traiter le trafic interromprait la production.
  options:
    udr: { en: "A Gateway Load Balancer frontend cannot be used as the next hop of a UDR, and chaining makes routes unnecessary.", fr: "Le front-end d'un équilibreur de charge de passerelle ne peut pas servir de tronçon suivant dans un itinéraire défini par l'utilisateur, et le chaînage rend les itinéraires inutiles." }
    pip: { en: "The frontend IP configuration of a Gateway Load Balancer is private only.", fr: "La configuration IP frontale d'un équilibreur de charge de passerelle est uniquement privée." }
references:
  - title: "Tutorial: Create a gateway load balancer"
    url: https://learn.microsoft.com/en-us/azure/load-balancer/tutorial-create-gateway-load-balancer
  - title: Gateway load balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/gateway-overview
