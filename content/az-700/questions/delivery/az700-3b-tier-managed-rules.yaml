id: az700-3b-tier-managed-rules
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove is creating a new Azure Front Door profile for its online banking portal. The web application firewall must use a Microsoft-managed rule set against the OWASP top threats and must block malicious bots.

    You need to choose the offering for the new profile. The solution must minimize cost.

    Which offering should you choose?
  fr: |
    Woodgrove crée un nouveau profil Azure Front Door pour son portail de banque en ligne. Le pare-feu d'applications web doit utiliser un ensemble de règles managé par Microsoft contre les principales menaces OWASP et doit bloquer les bots malveillants.

    Vous devez choisir l'offre du nouveau profil. La solution doit réduire les coûts au minimum.

    Quelle offre devez-vous choisir ?
body:
  options:
    - { id: a, text: Azure Front Door Standard }
    - { id: b, text: Azure Front Door Premium }
    - { id: c, text: { en: "Azure Front Door (classic)", fr: "Azure Front Door (classique)" } }
    - { id: d, text: { en: "Azure CDN Standard from Microsoft (classic)", fr: "Azure CDN Standard from Microsoft (classique)" } }
answer: { optionId: b }
explanation:
  correct:
    en: Microsoft-managed WAF rule sets and bot protection are available in Front Door Premium only; Standard supports custom WAF rules but not managed rules. Premium is therefore the least expensive offering that meets the requirements.
    fr: "Les ensembles de règles WAF managés par Microsoft et la protection contre les bots ne sont disponibles qu'avec Front Door Premium ; Standard prend en charge les règles WAF personnalisées, mais pas les règles managées. Premium est donc l'offre la moins coûteuse qui répond aux exigences."
  options:
    a: { en: "Standard supports custom WAF rules only, without managed rule sets or bot protection.", fr: "Standard ne prend en charge que les règles WAF personnalisées, sans ensembles de règles managés ni protection contre les bots." }
    c: { en: "Front Door (classic) no longer accepts new profiles and retires on March 31, 2027.", fr: "Front Door (classique) n'accepte plus de nouveaux profils et sera mis hors service le 31 mars 2027." }
    d: { en: "Azure CDN Standard from Microsoft (classic) no longer accepts new resources and retires on September 30, 2027.", fr: "Azure CDN Standard from Microsoft (classique) n'accepte plus de nouvelles ressources et sera mis hors service le 30 septembre 2027." }
references:
  - title: Comparison between Azure Front Door and Azure Content Delivery Network
    url: https://learn.microsoft.com/en-us/azure/frontdoor/standard-premium/tier-comparison
