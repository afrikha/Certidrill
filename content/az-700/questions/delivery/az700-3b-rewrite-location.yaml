id: az700-3b-rewrite-location
objective: "3.2.10"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso publishes **www.contoso.com** through an Application Gateway Standard_v2 named **AGW1**. The backend is an App Service app named **contoso-web**, and the backend settings use **Pick host name from backend target**.

    When the app redirects users, for example after sign-in, the response contains a header such as `Location: https://contoso-web.azurewebsites.net/account`, and the browsers then bypass AGW1.

    You create a rewrite set that is associated with the routing rule of www.contoso.com. You need the browsers to be redirected to www.contoso.com with the same path. You cannot change the configuration of the app.

    How should you configure the rewrite rule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso publie **www.contoso.com** au moyen d'un Application Gateway Standard_v2 nommé **AGW1**. Le back-end est une application App Service nommée **contoso-web**, et les paramètres de back-end utilisent **Choisir le nom d'hôte de la cible de back-end**.

    Quand l'application redirige les utilisateurs, par exemple après la connexion, la réponse contient un en-tête tel que `Location: https://contoso-web.azurewebsites.net/account`, et les navigateurs contournent alors AGW1.

    Vous créez un ensemble de réécriture associé à la règle de routage de www.contoso.com. Les navigateurs doivent être redirigés vers www.contoso.com avec le même chemin. Vous ne pouvez pas modifier la configuration de l'application.

    Comment devez-vous configurer la règle de réécriture ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Condition: type of variable to check: [[cond]], header name `Location`, pattern `(https?):\/\/.*azurewebsites\.net(.*)$`

      Action type: [[action]], header name `Location`

      Header value: [[value]]
    fr: |
      Condition : type de variable à vérifier : [[cond]], nom d'en-tête `Location`, modèle `(https?):\/\/.*azurewebsites\.net(.*)$`

      Type d'action : [[action]], nom d'en-tête `Location`

      Valeur de l'en-tête : [[value]]
  slots:
    - id: cond
      options:
        - { id: resp, text: { en: "Response header", fr: "En-tête de réponse" } }
        - { id: req, text: { en: "Request header", fr: "En-tête de requête" } }
        - { id: var, text: { en: "Server variable", fr: "Variable de serveur" } }
    - id: action
      options:
        - { id: setresp, text: { en: "Set response header", fr: "Définir l'en-tête de réponse" } }
        - { id: setreq, text: { en: "Set request header", fr: "Définir l'en-tête de requête" } }
        - { id: delresp, text: { en: "Delete response header", fr: "Supprimer l'en-tête de réponse" } }
        - { id: urlrw, text: { en: "Rewrite URL path", fr: "Réécrire le chemin d'URL" } }
    - id: value
      options:
        - { id: capt, text: "{http_resp_Location_1}://www.contoso.com{http_resp_Location_2}" }
        - { id: reqhost, text: "{http_req_Host}://www.contoso.com{http_resp_Location_1}" }
        - { id: uripath, text: "https://www.contoso.com{var_uri_path}" }
        - { id: varhost, text: "{var_host}" }
answer:
  values: { cond: resp, action: setresp, value: capt }
explanation:
  correct:
    en: The Location header is sent by the app in its response, so the condition checks a response header and the action sets that response header. The two capture groups of the pattern hold the scheme and the path; `{http_resp_Location_1}` and `{http_resp_Location_2}` put them back around the public host name, so the browser is sent to https://www.contoso.com/account.
    fr: "L'en-tête Location est envoyé par l'application dans sa réponse : la condition vérifie donc un en-tête de réponse et l'action définit cet en-tête de réponse. Les deux groupes de capture du modèle contiennent le schéma et le chemin ; `{http_resp_Location_1}` et `{http_resp_Location_2}` les replacent autour du nom d'hôte public, et le navigateur est envoyé vers https://www.contoso.com/account."
  options:
    req: { en: "The redirect target is in the response, not in the client request.", fr: "La cible de la redirection se trouve dans la réponse, pas dans la requête du client." }
    delresp: { en: "Deleting Location would break the redirect instead of fixing its host name.", fr: "Supprimer Location casserait la redirection au lieu de corriger son nom d'hôte." }
    urlrw: { en: "A URL rewrite changes the request sent to the backend, not the redirect returned to the browser.", fr: "Une réécriture d'URL modifie la requête envoyée au back-end, pas la redirection renvoyée au navigateur." }
    reqhost: { en: "The Host header is not a scheme, and capture 1 holds the scheme, not the path.", fr: "L'en-tête Host n'est pas un schéma, et la capture 1 contient le schéma, pas le chemin." }
    uripath: { en: "var_uri_path is the path of the original request, not the path of the redirect target.", fr: "var_uri_path est le chemin de la requête d'origine, pas celui de la cible de la redirection." }
    varhost: { en: "The value would contain only a host name, without the scheme or the redirect path.", fr: "La valeur ne contiendrait qu'un nom d'hôte, sans le schéma ni le chemin de la redirection." }
references:
  - title: Rewrite HTTP headers and URL with Application Gateway
    url: https://learn.microsoft.com/en-us/azure/application-gateway/rewrite-http-headers-url
