id: az700-3a-gwlb-facts-multi
objective: "3.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to deploy a Gateway Load Balancer named **GWLB1** in front of a fleet of intrusion prevention appliances managed by the security team in a separate subscription. Application teams will chain their resources to GWLB1.

    Which two statements about GWLB1 are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit de déployer un équilibreur de charge de passerelle nommé **GWLB1** devant un parc d'appliances de prévention des intrusions gérées par l'équipe de sécurité dans un abonnement distinct. Les équipes applicatives chaîneront leurs ressources à GWLB1.

    Quelles sont les deux affirmations vraies au sujet de GWLB1 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The frontend IP address of GWLB1 can be used as the next hop of a user-defined route.", fr: "L'adresse IP frontale de GWLB1 peut servir de tronçon suivant dans un itinéraire défini par l'utilisateur." } }
    - { id: b, text: { en: "The frontend of a global (cross-region) load balancer can be chained to GWLB1.", fr: "Le front-end d'un équilibreur de charge global (interrégions) peut être chaîné à GWLB1." } }
    - { id: c, text: { en: "The frontend IP configuration of GWLB1 uses a private IP address.", fr: "La configuration IP frontale de GWLB1 utilise une adresse IP privée." } }
    - { id: d, text: { en: "A virtual machine IP configuration that has a Standard public IP address can be chained to GWLB1.", fr: "Une configuration IP de machine virtuelle dotée d'une adresse IP publique Standard peut être chaînée à GWLB1." } }
    - { id: e, text: { en: "Only resources in the subscription of GWLB1 can be chained to it.", fr: "Seules les ressources de l'abonnement de GWLB1 peuvent y être chaînées." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      The frontend of a Gateway Load Balancer is private only. Consumers are either the frontend of a Standard public load balancer or a Standard IP configuration of a VM network interface that has a public IP address.
    fr: |
      Le front-end d'un équilibreur de charge de passerelle est uniquement privé. Les consommateurs sont soit le front-end d'un équilibreur de charge public Standard, soit une configuration IP Standard d'une interface réseau de machine virtuelle dotée d'une adresse IP publique.
  options:
    a: { en: "Microsoft states that a Gateway Load Balancer frontend can't be configured as a next hop in UDRs; chaining replaces routing.", fr: "Microsoft indique que le front-end d'un équilibreur de charge de passerelle ne peut pas être configuré comme tronçon suivant d'un itinéraire défini par l'utilisateur ; le chaînage remplace le routage." }
    b: { en: "Gateway Load Balancer does not work with the global tier.", fr: "L'équilibreur de charge de passerelle ne fonctionne pas avec le niveau global." }
    e: { en: "Chaining is supported across subscriptions and even across tenants, given the join permission on the frontend configuration.", fr: "Le chaînage est pris en charge entre abonnements, et même entre locataires, à condition de disposer de l'autorisation join sur la configuration frontale." }
references:
  - title: Gateway load balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/gateway-overview
