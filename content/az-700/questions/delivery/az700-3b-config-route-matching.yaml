id: az700-3b-config-route-matching
objective: "3.3.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    An Azure Front Door Standard endpoint has the following routes. The only custom domain of the profile is **www.contoso.com**, and it is associated with the three routes.

    | Route | Patterns to match |
    | --- | --- |
    | route-a | /* |
    | route-b | /shop/* |
    | route-c | /shop |

    Which route serves each request? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un point de terminaison Azure Front Door Standard possède les itinéraires suivants. Le seul domaine personnalisé du profil est **www.contoso.com**, et il est associé aux trois itinéraires.

    | Itinéraire | Modèles de correspondance |
    | --- | --- |
    | route-a | /* |
    | route-b | /shop/* |
    | route-c | /shop |

    Quel itinéraire sert chaque requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      https://www.contoso.com/shop: [[q1]]

      https://www.contoso.com/shop/cart: [[q2]]

      https://www.contoso.com/shopping: [[q3]]

      https://contoso.com/shop: [[q4]]
    fr: |
      https://www.contoso.com/shop : [[q1]]

      https://www.contoso.com/shop/cart : [[q2]]

      https://www.contoso.com/shopping : [[q3]]

      https://contoso.com/shop : [[q4]]
  slots:
    - id: q1
      options:
        - { id: a, text: route-a }
        - { id: b, text: route-b }
        - { id: c, text: route-c }
        - { id: none, text: { en: "No route (HTTP 404)", fr: "Aucun itinéraire (HTTP 404)" } }
    - id: q2
      options:
        - { id: a, text: route-a }
        - { id: b, text: route-b }
        - { id: c, text: route-c }
        - { id: none, text: { en: "No route (HTTP 404)", fr: "Aucun itinéraire (HTTP 404)" } }
    - id: q3
      options:
        - { id: a, text: route-a }
        - { id: b, text: route-b }
        - { id: c, text: route-c }
        - { id: none, text: { en: "No route (HTTP 404)", fr: "Aucun itinéraire (HTTP 404)" } }
    - id: q4
      options:
        - { id: a, text: route-a }
        - { id: b, text: route-b }
        - { id: c, text: route-c }
        - { id: none, text: { en: "No route (HTTP 404)", fr: "Aucun itinéraire (HTTP 404)" } }
answer:
  values: { q1: c, q2: b, q3: a, q4: none }
explanation:
  correct:
    en: Front Door matches the most specific route, first on the domain and then on the path. An exact path wins over a wildcard, so `/shop` takes route-c, while `/shop/cart` matches the wildcard `/shop/*`. `/shopping` does not start with `/shop/`, so only the catch-all `/*` matches. contoso.com is not a domain of the profile, so no route matches and the request is rejected with a 404.
    fr: "Front Door retient l'itinéraire le plus précis, d'abord sur le domaine, puis sur le chemin. Un chemin exact l'emporte sur un chemin générique : `/shop` prend route-c, tandis que `/shop/cart` correspond au générique `/shop/*`. `/shopping` ne commence pas par `/shop/` : seul l'itinéraire fourre-tout `/*` correspond. contoso.com n'est pas un domaine du profil : aucun itinéraire ne correspond et la requête est rejetée avec un 404."
references:
  - title: How requests get matched to a route configuration
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-route-matching
