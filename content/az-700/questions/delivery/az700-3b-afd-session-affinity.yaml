id: az700-3b-afd-session-affinity
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip publishes a ticketing application through Azure Front Door Premium. The origin group **og-tickets** contains two App Service apps, in East US and West US, with the same priority and weight.

    The application stores the seat reservations of a user in the memory of the app instance that handled the first request. Users report that their reservations disappear when they move to the payment page.

    You need the requests of a user session to keep reaching the same origin, without changing the application.

    What should you do?
  fr: |
    Wingtip publie une application de billetterie au moyen d'Azure Front Door Premium. Le groupe d'origines **og-tickets** contient deux applications App Service, en East US et en West US, avec la même priorité et le même poids.

    L'application stocke les réservations de places d'un utilisateur dans la mémoire de l'instance qui a traité la première requête. Les utilisateurs signalent que leurs réservations disparaissent quand ils passent à la page de paiement.

    Les requêtes d'une session utilisateur doivent continuer d'atteindre la même origine, sans modifier l'application.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the latency sensitivity of og-tickets to 0 milliseconds.", fr: "Définir la sensibilité de latence d'og-tickets sur 0 milliseconde." } }
    - { id: b, text: { en: "Enable session affinity on og-tickets.", fr: "Activer l'affinité de session sur og-tickets." } }
    - { id: c, text: { en: "Enable caching on the route with the Use Query String behavior.", fr: "Activer la mise en cache sur l'itinéraire avec le comportement Utiliser la chaîne de requête." } }
    - { id: d, text: { en: "Set the priority of the West US origin to 2.", fr: "Définir la priorité de l'origine West US sur 2." } }
answer: { optionId: b }
explanation:
  correct:
    en: With session affinity, the first request of a session follows the normal origin selection, and Front Door then sends the following requests to the same origin by using its managed ASLBSA cookies. Both regions keep serving users, while each user stays on one origin.
    fr: "Avec l'affinité de session, la première requête d'une session suit la sélection d'origine normale, puis Front Door envoie les requêtes suivantes vers la même origine grâce à ses cookies managés ASLBSA. Les deux régions continuent de servir les utilisateurs, tandis que chaque utilisateur reste sur une origine."
  options:
    a: { en: "Latency selection can still change the origin for a user when measured latencies change; it does not bind a session.", fr: "La sélection par latence peut toujours changer l'origine d'un utilisateur quand les latences mesurées évoluent ; elle n'attache pas une session." }
    c: { en: "Caching serves stored GET responses; it does not keep a user's requests on one origin.", fr: "La mise en cache sert des réponses GET stockées ; elle ne maintient pas les requêtes d'un utilisateur sur une origine." }
    d: { en: "This sends every user to East US, which removes the second region instead of keeping sessions together.", fr: "Cela envoie tous les utilisateurs vers East US, ce qui supprime la seconde région au lieu de regrouper les sessions." }
references:
  - title: Traffic routing methods for origins
    url: https://learn.microsoft.com/en-us/azure/frontdoor/routing-methods
