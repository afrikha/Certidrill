id: az700-3b-tls-mtls-profile
objective: "3.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Application Gateway WAF_v2 named **AGW1** has two HTTPS listeners:

    | Listener | Host name | Clients |
    | --- | --- | --- |
    | lst-public | www.contoso.com | Internet users |
    | lst-partner | partners.contoso.com | Partner applications |

    AGW1 uses the default TLS policy. Partner applications have client certificates issued by a Contoso certificate authority (CA).

    You need lst-partner to reject any TLS connection that doesn't present a valid client certificate issued by the Contoso CA. lst-public must keep its current configuration.

    What should you do?
  fr: |
    Un Application Gateway WAF_v2 nommé **AGW1** possède deux écouteurs HTTPS :

    | Écouteur | Nom d'hôte | Clients |
    | --- | --- | --- |
    | lst-public | www.contoso.com | Utilisateurs d'Internet |
    | lst-partner | partners.contoso.com | Applications partenaires |

    AGW1 utilise la stratégie TLS par défaut. Les applications partenaires disposent de certificats clients émis par une autorité de certification (CA) Contoso.

    lst-partner doit rejeter toute connexion TLS qui ne présente pas de certificat client valide émis par la CA Contoso. lst-public doit conserver sa configuration actuelle.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the TLS policy of AGW1 to AppGwSslPolicy20220101S.", fr: "Remplacer la stratégie TLS d'AGW1 par AppGwSslPolicy20220101S." } }
    - { id: b, text: { en: "Upload the Contoso CA certificate as a trusted root certificate in the backend settings of lst-partner.", fr: "Charger le certificat de la CA Contoso comme certificat racine approuvé dans les paramètres de back-end de lst-partner." } }
    - { id: c, text: { en: "Create a WAF custom rule that blocks requests without a client certificate, and associate the policy with lst-partner.", fr: "Créer une règle WAF personnalisée qui bloque les requêtes sans certificat client, et associer la stratégie à lst-partner." } }
    - { id: d, text: { en: "Create an SSL profile with client authentication that trusts the Contoso CA certificate, and associate it with lst-partner.", fr: "Créer un profil SSL avec authentification du client qui approuve le certificat de la CA Contoso, et l'associer à lst-partner." } }
answer: { optionId: d }
explanation:
  correct:
    en: Mutual authentication on Standard_v2 and WAF_v2 is configured in an SSL profile, whose client authentication part holds the trusted client CA certificate chain. Associated with one listener only, the profile enforces client certificates in strict mode during the TLS handshake for that listener, while other listeners keep the gateway settings.
    fr: "L'authentification mutuelle sur Standard_v2 et WAF_v2 se configure dans un profil SSL, dont la partie authentification du client contient la chaîne de certificats de la CA cliente approuvée. Associé à un seul écouteur, le profil impose en mode strict les certificats clients pendant l'établissement de la liaison TLS pour cet écouteur, tandis que les autres écouteurs conservent les paramètres de la passerelle."
  options:
    a: { en: "A TLS policy sets protocol versions and ciphers for the whole gateway; it does not request client certificates.", fr: "Une stratégie TLS définit les versions de protocole et les chiffrements de toute la passerelle ; elle ne demande pas de certificats clients." }
    b: { en: "Trusted root certificates in backend settings validate the servers' certificates, not the clients'.", fr: "Les certificats racines approuvés des paramètres de back-end valident les certificats des serveurs, pas ceux des clients." }
    c: { en: "The WAF inspects HTTP requests after the TLS handshake; client certificate validation happens in the TLS handshake through an SSL profile.", fr: "Le WAF inspecte les requêtes HTTP après l'établissement de la liaison TLS ; la validation des certificats clients se fait pendant cette liaison, par un profil SSL." }
references:
  - title: Overview of mutual authentication with Application Gateway
    url: https://learn.microsoft.com/en-us/azure/application-gateway/mutual-authentication-overview
