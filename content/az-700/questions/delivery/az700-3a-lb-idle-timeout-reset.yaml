id: az700-3a-lb-idle-timeout-reset
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs a reporting application on virtual machines in the backend pool of an internal Standard load balancer named **ILB1**. Client applications keep TCP connections open to ILB1 on port 9000 and can stay idle for up to 20 minutes between requests.

    Users report that idle connections stop working after about four minutes, and that the client applications hang until their own timeout expires.

    You need to ensure that:

    - idle connections remain open for up to 20 minutes;
    - when an idle connection is closed by ILB1, both the client and the server are notified immediately.

    Which two actions should you perform on the load-balancing rule? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute une application de rapports sur des machines virtuelles du pool principal d'un équilibreur de charge interne Standard nommé **ILB1**. Les applications clientes maintiennent des connexions TCP ouvertes vers ILB1 sur le port 9000 et peuvent rester inactives jusqu'à 20 minutes entre deux requêtes.

    Les utilisateurs signalent que les connexions inactives cessent de fonctionner au bout d'environ quatre minutes et que les applications clientes restent bloquées jusqu'à l'expiration de leur propre délai.

    Vous devez faire en sorte que :

    - les connexions inactives restent ouvertes jusqu'à 20 minutes ;
    - lorsqu'ILB1 ferme une connexion inactive, le client et le serveur en soient avertis immédiatement.

    Quelles sont les deux actions à effectuer sur la règle d'équilibrage de charge ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable Floating IP.", fr: "Activer l'IP flottante." } }
    - { id: b, text: { en: "Set the idle timeout to 20 minutes.", fr: "Définir le délai d'inactivité sur 20 minutes." } }
    - { id: c, text: { en: "Set session persistence to Client IP.", fr: "Définir la persistance de session sur Client IP." } }
    - { id: d, text: { en: "Add an outbound rule with an idle timeout of 20 minutes.", fr: "Ajouter une règle de trafic sortant avec un délai d'inactivité de 20 minutes." } }
    - { id: e, text: { en: "Enable TCP reset.", fr: "Activer la réinitialisation TCP (TCP reset)." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      The idle timeout of a load-balancing rule defaults to 4 minutes and can be raised (inbound rules accept 4 to 100 minutes), so 20 minutes keeps the idle connections open. By default the load balancer silently drops a flow at idle timeout; enabling TCP reset makes it send a bidirectional TCP RST so both endpoints close the socket immediately.
    fr: |
      Le délai d'inactivité d'une règle d'équilibrage de charge est de 4 minutes par défaut et peut être augmenté (les règles entrantes acceptent de 4 à 100 minutes) ; 20 minutes maintient donc les connexions inactives ouvertes. Par défaut, l'équilibreur de charge abandonne silencieusement un flux à l'expiration du délai ; l'activation de TCP reset lui fait envoyer un TCP RST bidirectionnel pour que les deux points de terminaison ferment immédiatement le socket.
  options:
    a: { en: "Floating IP lets several rules reuse a backend port; it does not affect idle timeouts.", fr: "L'IP flottante permet à plusieurs règles de réutiliser un port principal ; elle n'a aucun effet sur les délais d'inactivité." }
    c: { en: "Session persistence controls which VM receives new connections, not how long idle connections live.", fr: "La persistance de session détermine quelle machine virtuelle reçoit les nouvelles connexions, pas la durée de vie des connexions inactives." }
    d: { en: "Outbound rules govern SNAT for connections initiated by the VMs; the clients' inbound connections use the load-balancing rule.", fr: "Les règles de trafic sortant régissent la SNAT des connexions initiées par les machines virtuelles ; les connexions entrantes des clients utilisent la règle d'équilibrage de charge." }
references:
  - title: Load Balancer TCP Reset and idle timeout in Azure
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-tcp-reset
