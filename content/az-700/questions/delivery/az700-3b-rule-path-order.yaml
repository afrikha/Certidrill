id: az700-3b-rule-path-order
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Application Gateway Standard_v2 named **AGW1** has a path-based routing rule named **rule-shop**. Its URL path map contains the following path rules, in this order:

    | Order | Path | Backend pool |
    | --- | --- | --- |
    | 1 | /* | pool-app |
    | 2 | /images/* | pool-img |

    The default backend pool of the path map is pool-app. Requests for `/images/logo.png` are served by pool-app instead of pool-img.

    You need requests for `/images/*` to reach pool-img. All other requests must still reach pool-app.

    What should you do?
  fr: |
    Un Application Gateway Standard_v2 nommé **AGW1** possède une règle de routage basée sur le chemin nommée **rule-shop**. Son mappage de chemins d'URL contient les règles de chemin suivantes, dans cet ordre :

    | Ordre | Chemin | Pool principal |
    | --- | --- | --- |
    | 1 | /* | pool-app |
    | 2 | /images/* | pool-img |

    Le pool principal par défaut du mappage de chemins est pool-app. Les requêtes pour `/images/logo.png` sont servies par pool-app au lieu de pool-img.

    Les requêtes pour `/images/*` doivent atteindre pool-img. Toutes les autres requêtes doivent toujours atteindre pool-app.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the priority of rule-shop to 1.", fr: "Définir la priorité de rule-shop sur 1." } }
    - { id: b, text: { en: "Change the path of the second path rule to /images/*.png.", fr: "Remplacer le chemin de la deuxième règle de chemin par /images/*.png." } }
    - { id: c, text: { en: "Enable Re-evaluate path map in a rewrite set of rule-shop.", fr: "Activer Réévaluer le mappage de chemins dans un ensemble de réécriture de rule-shop." } }
    - { id: d, text: { en: "Move the /images/* path rule above the /* path rule.", fr: "Déplacer la règle de chemin /images/* au-dessus de la règle de chemin /*." } }
answer: { optionId: d }
explanation:
  correct:
    en: Path rules of a URL path map are processed in the order they are listed, on v1 and v2 alike, and the first match wins. With `/*` at the top, it matches every path, including `/images/logo.png`. Placing the specific path first, and wildcard paths last, sends image requests to pool-img while the rest still reaches pool-app.
    fr: "Les règles de chemin d'un mappage de chemins d'URL sont traitées dans l'ordre où elles sont listées, en v1 comme en v2, et la première correspondance l'emporte. Placé en premier, `/*` correspond à tous les chemins, y compris `/images/logo.png`. Placer le chemin spécifique en premier, et les chemins génériques en dernier, envoie les requêtes d'images vers pool-img tandis que le reste atteint toujours pool-app."
  options:
    a: { en: "The rule priority orders listeners, not the path rules inside a path map.", fr: "La priorité de la règle ordonne les écouteurs, pas les règles de chemin d'un mappage." }
    b: { en: "A wildcard is allowed only at the end of a path, so /images/*.png is not a valid pattern.", fr: "Un caractère générique n'est autorisé qu'à la fin d'un chemin : /images/*.png n'est pas un modèle valide." }
    c: { en: "Re-evaluate path map applies after a URL rewrite; without a rewrite, the original path still matches /* first.", fr: "Réévaluer le mappage de chemins s'applique après une réécriture d'URL ; sans réécriture, le chemin d'origine correspond toujours d'abord à /*." }
references:
  - title: URL Path Based Routing overview
    url: https://learn.microsoft.com/en-us/azure/application-gateway/url-route-overview
