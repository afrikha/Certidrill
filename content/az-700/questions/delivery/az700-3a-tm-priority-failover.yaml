id: az700-3a-tm-priority-failover
objective: "3.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso publishes a web application from two App Service apps: **app-weu** in West Europe and **app-neu** in North Europe. Both apps run on a Premium App Service plan.

    You need to configure an Azure Traffic Manager profile so that all users are sent to app-weu, and users are sent to app-neu only when app-weu is unavailable.

    Which routing method should you use?
  fr: |
    Contoso publie une application web à partir de deux applications App Service : **app-weu** dans West Europe et **app-neu** dans North Europe. Les deux applications s'exécutent sur un plan App Service Premium.

    Vous devez configurer un profil Azure Traffic Manager pour que tous les utilisateurs soient envoyés vers app-weu, et qu'ils ne soient envoyés vers app-neu que si app-weu est indisponible.

    Quelle méthode de routage devez-vous utiliser ?
body:
  options:
    - { id: a, text: Weighted }
    - { id: b, text: Performance }
    - { id: c, text: Geographic }
    - { id: d, text: Priority }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Priority routing method sends all traffic to the endpoint with the highest priority (lowest value, from 1 to 1000) and fails over to the next endpoint only when the primary is degraded. Give app-weu priority 1 and app-neu priority 2.
    fr: |
      La méthode de routage Priority envoie tout le trafic au point de terminaison de priorité la plus élevée (valeur la plus basse, de 1 à 1000) et ne bascule vers le suivant que si le point de terminaison principal est dégradé. Attribuez la priorité 1 à app-weu et la priorité 2 à app-neu.
  options:
    a: { en: "Weighted distributes traffic across endpoints according to their weights; it does not keep a standby endpoint idle.", fr: "Weighted répartit le trafic entre les points de terminaison selon leur poids ; il ne laisse pas un point de terminaison en attente." }
    b: { en: "Performance sends each user to the lowest-latency endpoint, so some users would reach app-neu while app-weu is healthy.", fr: "Performance envoie chaque utilisateur vers le point de terminaison de plus faible latence : certains utilisateurs atteindraient app-neu alors qu'app-weu est sain." }
    c: { en: "Geographic maps the origin of DNS queries to endpoints; it does not fail over between endpoints mapped to different regions.", fr: "Geographic associe l'origine des requêtes DNS aux points de terminaison ; il n'assure pas de basculement entre des points de terminaison associés à des zones différentes." }
references:
  - title: Traffic Manager Routing Methods
    url: https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-routing-methods
