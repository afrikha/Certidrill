id: az700-3b-settings-ntlm
objective: "3.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum publishes an intranet application through an Application Gateway Standard_v2 named **AGW1**. The backend servers run IIS and authenticate users with Windows authentication (NTLM). HTTP/2 is disabled on AGW1, and cookie-based affinity is already enabled in the backend settings.

    Users who connect through AGW1 are repeatedly prompted for credentials and cannot sign in. The same users sign in successfully when they connect directly to a server.

    You need users to be able to sign in through AGW1.

    What should you configure in the backend settings?
  fr: |
    Adatum publie une application intranet au moyen d'un Application Gateway Standard_v2 nommé **AGW1**. Les serveurs principaux exécutent IIS et authentifient les utilisateurs avec l'authentification Windows (NTLM). HTTP/2 est désactivé sur AGW1, et l'affinité basée sur les cookies est déjà activée dans les paramètres de back-end.

    Les utilisateurs qui se connectent via AGW1 sont invités à plusieurs reprises à saisir leurs informations d'identification et ne parviennent pas à se connecter. Les mêmes utilisateurs se connectent sans problème quand ils accèdent directement à un serveur.

    Les utilisateurs doivent pouvoir se connecter via AGW1.

    Que devez-vous configurer dans les paramètres de back-end ?
body:
  options:
    - { id: a, text: { en: "Enable Dedicated backend connection.", fr: "Activer Connexion de back-end dédiée (Dedicated backend connection)." } }
    - { id: b, text: { en: "Set a custom name for the affinity cookie.", fr: "Définir un nom personnalisé pour le cookie d'affinité." } }
    - { id: c, text: { en: "Increase the request timeout to 120 seconds.", fr: "Augmenter le délai d'expiration de la requête à 120 secondes." } }
    - { id: d, text: { en: "Enable connection draining with a timeout of 120 seconds.", fr: "Activer le drainage de connexion avec un délai de 120 secondes." } }
answer: { optionId: a }
explanation:
  correct:
    en: NTLM and Kerberos passthrough authenticate a connection, not a request, so they require a one-to-one mapping between the client connection and the backend connection. By default the gateway reuses backend connections across clients; Dedicated backend connection gives each client connection its own backend connection. It isn't supported with HTTP/2, which is disabled here.
    fr: "L'authentification directe NTLM et Kerberos authentifie une connexion, pas une requête : elle exige une correspondance un-à-un entre la connexion cliente et la connexion de back-end. Par défaut, la passerelle réutilise les connexions de back-end entre clients ; Connexion de back-end dédiée attribue à chaque connexion cliente sa propre connexion de back-end. Cette option n'est pas prise en charge avec HTTP/2, désactivé ici."
  options:
    b: { en: "Affinity already sends the user to the same server, but not over the same connection; renaming the cookie changes nothing.", fr: "L'affinité envoie déjà l'utilisateur vers le même serveur, mais pas sur la même connexion ; renommer le cookie ne change rien." }
    c: { en: "The problem is not a slow response; requests still reach the server on shared connections.", fr: "Le problème n'est pas une réponse lente ; les requêtes atteignent toujours le serveur sur des connexions partagées." }
    d: { en: "Connection draining only applies when a server is removed from the pool.", fr: "Le drainage de connexion ne s'applique que lorsqu'un serveur est retiré du pool." }
references:
  - title: Azure Application Gateway Backend Settings configuration
    url: https://learn.microsoft.com/en-us/azure/application-gateway/configuration-http-settings
