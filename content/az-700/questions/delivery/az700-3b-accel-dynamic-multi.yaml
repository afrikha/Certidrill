id: az700-3b-accel-dynamic-multi
objective: "3.3.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware hosts a booking API on an App Service app in East US. The API is used by customers in Asia and Europe. Every response is personalized, so caching is disabled on the Azure Front Door route that publishes the API. Most calls are POST requests over HTTPS.

    After the migration to Front Door, the response time for distant customers improved.

    Which two Front Door mechanisms explain this improvement?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware héberge une API de réservation sur une application App Service en East US. L'API est utilisée par des clients en Asie et en Europe. Chaque réponse est personnalisée : la mise en cache est donc désactivée sur l'itinéraire Azure Front Door qui publie l'API. La plupart des appels sont des requêtes POST en HTTPS.

    Après la migration vers Front Door, le temps de réponse pour les clients éloignés s'est amélioré.

    Quels sont les deux mécanismes de Front Door qui expliquent cette amélioration ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The TCP and TLS handshakes of the clients complete with a nearby edge location (split TCP).", fr: "Les établissements de liaison TCP et TLS des clients se terminent auprès d'un emplacement de périphérie proche (TCP fractionné)." } }
    - { id: b, text: { en: "Responses to POST requests are cached at the edge for a short time.", fr: "Les réponses aux requêtes POST sont mises en cache en périphérie pendant une courte durée." } }
    - { id: c, text: { en: "The edge locations reuse long-lived connections to the origin across requests of different users.", fr: "Les emplacements de périphérie réutilisent des connexions de longue durée vers l'origine pour les requêtes de différents utilisateurs." } }
    - { id: d, text: { en: "Front Door compresses the API responses on the fly with Brotli.", fr: "Front Door compresse les réponses de l'API à la volée avec Brotli." } }
    - { id: e, text: { en: "The clients connect directly to the origin after Front Door resolves its IP address.", fr: "Les clients se connectent directement à l'origine une fois que Front Door a résolu son adresse IP." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: With split TCP, the round trips of the TCP and TLS handshakes happen over the short path to the closest edge location instead of the long path to East US. The connections from the edge to the origin are pre-established and reused across users, which saves their setup time; both benefits apply without caching.
    fr: "Avec le TCP fractionné, les allers-retours des établissements de liaison TCP et TLS ont lieu sur le court trajet vers l'emplacement de périphérie le plus proche, et non sur le long trajet vers East US. Les connexions de la périphérie vers l'origine sont établies à l'avance et réutilisées entre utilisateurs, ce qui économise leur temps d'établissement ; ces deux avantages s'appliquent sans mise en cache."
  options:
    b: { en: "Only GET requests are cacheable, and caching is disabled on this route.", fr: "Seules les requêtes GET peuvent être mises en cache, et la mise en cache est désactivée sur cet itinéraire." }
    d: { en: "Front Door compression requires caching on the route.", fr: "La compression de Front Door exige la mise en cache sur l'itinéraire." }
    e: { en: "Clients always connect to a Front Door edge location, never directly to the origin; that is how Traffic Manager works.", fr: "Les clients se connectent toujours à un emplacement de périphérie Front Door, jamais directement à l'origine ; c'est ainsi que fonctionne Traffic Manager." }
references:
  - title: Traffic acceleration
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-traffic-acceleration
  - title: Caching with Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-caching
