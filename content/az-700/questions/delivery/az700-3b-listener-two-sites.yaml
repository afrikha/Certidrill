id: az700-3b-listener-two-sites
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Application Gateway Standard_v2 named **AGW1** that has one public frontend IP address. You plan to publish two websites through AGW1:

    | Host name | Backend pool |
    | --- | --- |
    | app.contoso.com | PoolContoso |
    | app.fabrikam.com | PoolFabrikam |

    Both websites must be reachable on the same public IP address over HTTPS on port 443, and each request must reach the pool of its website.

    What should you configure?
  fr: |
    Vous disposez d'un Application Gateway Standard_v2 nommé **AGW1** qui a une adresse IP frontale publique. Vous prévoyez de publier deux sites web au moyen d'AGW1 :

    | Nom d'hôte | Pool principal |
    | --- | --- |
    | app.contoso.com | PoolContoso |
    | app.fabrikam.com | PoolFabrikam |

    Les deux sites doivent être joignables sur la même adresse IP publique en HTTPS sur le port 443, et chaque requête doit atteindre le pool de son site.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Two multi-site HTTPS listeners on port 443, each with the host name of one website", fr: "Deux écouteurs HTTPS multisites sur le port 443, chacun avec le nom d'hôte d'un site" } }
    - { id: b, text: { en: "One basic HTTPS listener on port 443 with a rewrite set that changes the Host header", fr: "Un écouteur HTTPS de base sur le port 443 avec un ensemble de réécriture qui modifie l'en-tête Host" } }
    - { id: c, text: { en: "One basic HTTPS listener on port 443 with a path-based routing rule", fr: "Un écouteur HTTPS de base sur le port 443 avec une règle de routage basée sur le chemin" } }
    - { id: d, text: { en: "Two basic HTTPS listeners on port 443, each with its own rule priority", fr: "Deux écouteurs HTTPS de base sur le port 443, chacun avec sa propre priorité de règle" } }
answer: { optionId: a }
explanation:
  correct:
    en: A multi-site listener matches requests on the host name in addition to the frontend IP, port and protocol, so several sites can share one IP address and port. Each listener then has its own rule that sends its requests to the pool of its site.
    fr: "Un écouteur multisite associe les requêtes selon le nom d'hôte, en plus de l'adresse IP frontale, du port et du protocole : plusieurs sites peuvent ainsi partager une adresse IP et un port. Chaque écouteur a ensuite sa propre règle, qui envoie ses requêtes vers le pool de son site."
  options:
    b: { en: "Rewriting the Host header does not change the backend pool chosen by the rule.", fr: "Réécrire l'en-tête Host ne change pas le pool principal choisi par la règle." }
    c: { en: "A path-based rule distinguishes requests by URL path, not by host name.", fr: "Une règle basée sur le chemin distingue les requêtes selon le chemin d'URL, pas selon le nom d'hôte." }
    d: { en: "A basic listener accepts every host name on its IP address and port, so two basic listeners cannot separate the two sites.", fr: "Un écouteur de base accepte tous les noms d'hôte sur son adresse IP et son port : deux écouteurs de base ne peuvent pas séparer les deux sites." }
references:
  - title: Application Gateway listener configuration
    url: https://learn.microsoft.com/en-us/azure/application-gateway/configuration-listeners
  - title: Application Gateway multi-site hosting
    url: https://learn.microsoft.com/en-us/azure/application-gateway/multiple-site-overview
