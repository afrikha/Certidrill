id: az700-cs3b-lms-probe
objective: "3.2.5"
type: single
caseStudy: az700-cs3b-bellows
difficulty: 2
status: draft
stem:
  en: You need to meet the requirement for AGW-LMS. What should you do?
  fr: Vous devez respecter l'exigence relative à AGW-LMS. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the host name override of the backend settings to lms.bellowscollege.edu and keep the default probe", fr: "Définir lms.bellowscollege.edu comme remplacement du nom d'hôte des paramètres de back-end et conserver la sonde par défaut" } }
    - { id: b, text: { en: "Change the listener of AGW-LMS to a multi-site listener for the host name lms.bellowscollege.edu", fr: "Transformer l'écouteur d'AGW-LMS en écouteur multisite pour le nom d'hôte lms.bellowscollege.edu" } }
    - { id: c, text: { en: "Associate with the backend settings a custom probe that uses the host lms.bellowscollege.edu and the path /health", fr: "Associer aux paramètres de back-end une sonde personnalisée qui utilise l'hôte lms.bellowscollege.edu et le chemin /health" } }
    - { id: d, text: { en: "Add an inbound rule to the NSG of AppGwSubnet that allows the GatewayManager service tag on TCP ports 65200-65535", fr: "Ajouter au NSG d'AppGwSubnet une règle entrante qui autorise l'étiquette de service GatewayManager sur les ports TCP 65200-65535" } }
answer: { optionId: c }
explanation:
  correct:
    en: The default probe sends a GET to / with the host 127.0.0.1 unless the backend settings specify a host name, and it expects a status code between 200 and 399. The LMS answers 401 on / and returns 200 on /health only for its own host name, so you need a custom probe that sets both the host and the path. When /health fails, the probe marks the VM unhealthy and AGW-LMS stops sending it traffic.
    fr: |
      La sonde par défaut envoie un GET vers / avec l'hôte 127.0.0.1, sauf si les paramètres de back-end précisent un nom d'hôte, et attend un code d'état entre 200 et 399. La plateforme LMS répond 401 sur / et ne renvoie 200 sur /health que pour son propre nom d'hôte : il faut donc une sonde personnalisée qui définit à la fois l'hôte et le chemin. Quand /health échoue, la sonde marque la machine virtuelle comme défaillante et AGW-LMS cesse de lui envoyer du trafic.
  options:
    a: { en: "The default probe would then send the right host, but it still requests /, which returns 401, so the VMs stay unhealthy.", fr: "La sonde par défaut enverrait alors le bon hôte, mais elle demande toujours /, qui renvoie 401 : les machines virtuelles resteraient défaillantes." }
    b: { en: "A listener controls how client requests are received; it doesn't change the requests that the health probe sends to the backend.", fr: "Un écouteur contrôle la réception des requêtes des clients ; il ne modifie pas les requêtes que la sonde d'intégrité envoie au back-end." }
    d: { en: "The GatewayManager ports concern the management of the v2 gateway itself; they don't change the host or path that the probe uses.", fr: "Les ports GatewayManager concernent la gestion de la passerelle v2 elle-même ; ils ne changent ni l'hôte, ni le chemin utilisés par la sonde." }
references:
  - title: Application Gateway health probes overview
    url: https://learn.microsoft.com/en-us/azure/application-gateway/application-gateway-probe-overview
