id: az700-3a-agw-usecase-scenarios
objective: "3.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Northwind is reviewing five networking requirements. All the workloads run in a single Azure region unless stated otherwise.

    For which two requirements should you use Azure Application Gateway?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind examine cinq exigences réseau. Toutes les charges de travail s'exécutent dans une seule région Azure, sauf mention contraire.

    Pour quelles deux exigences devez-vous utiliser Azure Application Gateway ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Publish an App Service app behind a web application firewall", fr: "Publier une application App Service derrière un pare-feu d'applications web" } }
    - { id: b, text: { en: "Load-balance RADIUS authentication traffic on UDP port 1812", fr: "Équilibrer la charge du trafic d'authentification RADIUS sur le port UDP 1812" } }
    - { id: c, text: { en: "Offload TLS for 30 HTTPS websites hosted on the same set of virtual machines", fr: "Décharger le TLS de 30 sites web HTTPS hébergés sur le même ensemble de machines virtuelles" } }
    - { id: d, text: { en: "Cache static content at edge locations close to users worldwide", fr: "Mettre en cache du contenu statique dans des emplacements de périphérie proches des utilisateurs du monde entier" } }
    - { id: e, text: { en: "Provide outbound internet connectivity for virtual machines that have no public IP address", fr: "Fournir une connectivité Internet sortante à des machines virtuelles sans adresse IP publique" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Application Gateway supports multitenant backends such as App Service and can add WAF protection (WAF_v2). It terminates TLS and uses multi-site listeners to host many websites, routing each request by host name to the right backend.
    fr: |
      Application Gateway prend en charge les back-ends multilocataires comme App Service et peut ajouter une protection WAF (WAF_v2). Il termine le TLS et utilise des écouteurs multisites pour héberger de nombreux sites web, en routant chaque requête vers le bon back-end selon le nom d'hôte.
  options:
    b: { en: "Application Gateway does not support UDP; Azure Load Balancer does.", fr: "Application Gateway ne prend pas en charge UDP, contrairement à Azure Load Balancer." }
    d: { en: "Edge caching for global users is an Azure Front Door capability.", fr: "La mise en cache en périphérie pour des utilisateurs mondiaux est une capacité d'Azure Front Door." }
    e: { en: "Outbound connectivity is provided by a NAT gateway, instance public IPs or load balancer outbound rules.", fr: "La connectivité sortante est fournie par une passerelle NAT, des IP publiques d'instance ou des règles de trafic sortant d'un équilibreur de charge." }
references:
  - title: Load balancing options
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/technology-choices/load-balancing-overview
  - title: Application gateway components
    url: https://learn.microsoft.com/en-us/azure/application-gateway/application-gateway-components
