id: az700-3a-gwlb-insert-firewall
objective: "3.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum publishes a web application through a public Standard load balancer named **LB-Web**. The security team wants all inbound and outbound traffic of the application to be inspected by a scale-out cluster of third-party firewall virtual appliances.

    The solution must meet the following requirements:

    - No user-defined routes must be created or maintained.
    - Each flow must traverse the same appliance in both directions.
    - The application virtual machines must see the original client IP address.

    What should you implement?
  fr: |
    Adatum publie une application web au moyen d'un équilibreur de charge public Standard nommé **LB-Web**. L'équipe de sécurité souhaite que tout le trafic entrant et sortant de l'application soit inspecté par un cluster évolutif d'appliances virtuelles de pare-feu tierces.

    La solution doit répondre aux exigences suivantes :

    - Aucun itinéraire défini par l'utilisateur ne doit être créé ni maintenu.
    - Chaque flux doit traverser la même appliance dans les deux sens.
    - Les machines virtuelles de l'application doivent voir l'adresse IP d'origine du client.

    Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "An internal Standard load balancer with an HA ports rule in front of the appliances, placed between LB-Web and the application", fr: "Un équilibreur de charge interne Standard avec une règle de ports HA devant les appliances, placé entre LB-Web et l'application" } }
    - { id: b, text: { en: "An Azure Route Server that peers with the appliances by using BGP", fr: "Un Azure Route Server qui établit des sessions BGP avec les appliances" } }
    - { id: c, text: { en: "A Gateway Load Balancer with the appliances in its backend pool, chained to the frontend IP configuration of LB-Web", fr: "Un équilibreur de charge de passerelle avec les appliances dans son pool principal, chaîné à la configuration IP frontale de LB-Web" } }
    - { id: d, text: { en: "A NAT gateway associated with the subnet of the application virtual machines", fr: "Une passerelle NAT associée au sous-réseau des machines virtuelles de l'application" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Gateway Load Balancer provides bump-in-the-wire insertion of NVAs. Once the frontend of LB-Web references the Gateway Load Balancer frontend, traffic is sent to the appliances over VXLAN without any UDR, flows stay sticky to one appliance in both directions, and the source IP is preserved.
    fr: |
      L'équilibreur de charge de passerelle insère des NVA de manière transparente (bump-in-the-wire). Dès que le front-end de LB-Web référence le front-end de l'équilibreur de charge de passerelle, le trafic est envoyé aux appliances par VXLAN sans aucun itinéraire défini par l'utilisateur, les flux restent associés à la même appliance dans les deux sens et l'adresse IP source est conservée.
  options:
    a: { en: "Steering traffic to an internal load balancer requires UDRs, and flow symmetry is not supported for NVAs placed between a public and an internal load balancer.", fr: "Diriger le trafic vers un équilibreur de charge interne nécessite des itinéraires définis par l'utilisateur, et la symétrie des flux n'est pas prise en charge pour des NVA placées entre un équilibreur de charge public et un équilibreur de charge interne." }
    b: { en: "Route Server exchanges routes with NVAs; it does not load-balance flows across appliances or guarantee symmetry for the public frontend.", fr: "Route Server échange des routes avec les NVA ; il n'équilibre pas les flux entre les appliances et ne garantit pas la symétrie pour le front-end public." }
    d: { en: "A NAT gateway provides outbound SNAT; it inserts no appliance in the traffic path.", fr: "Une passerelle NAT fournit la SNAT sortante ; elle n'insère aucune appliance dans le chemin du trafic." }
references:
  - title: Gateway load balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/gateway-overview
  - title: High availability ports overview
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-ha-ports-overview
