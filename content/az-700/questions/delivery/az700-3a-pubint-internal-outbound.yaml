id: az700-3a-pubint-internal-outbound
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has four virtual machines in a subnet named **AppSubnet**. The virtual machines are in the backend pool of an internal Standard load balancer named **ILB1** and have no public IP addresses. AppSubnet is a private subnet: default outbound access is disabled.

    The virtual machines must download updates from the internet. Clients must continue to reach the application only through ILB1.

    Which two actions can you perform to provide outbound internet connectivity? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose de quatre machines virtuelles dans un sous-réseau nommé **AppSubnet**. Les machines virtuelles appartiennent au pool principal d'un équilibreur de charge interne Standard nommé **ILB1** et n'ont pas d'adresse IP publique. AppSubnet est un sous-réseau privé : l'accès sortant par défaut est désactivé.

    Les machines virtuelles doivent télécharger des mises à jour depuis Internet. Les clients doivent continuer à accéder à l'application uniquement par ILB1.

    Quelles sont les deux actions qui permettent de fournir une connectivité Internet sortante ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Associate a NAT gateway that has a Standard public IP address with AppSubnet.", fr: "Associer à AppSubnet une passerelle NAT dotée d'une adresse IP publique Standard." } }
    - { id: b, text: { en: "Enable Floating IP on the load-balancing rule of ILB1 and add the frontend IP to a loopback interface on each VM.", fr: "Activer l'IP flottante sur la règle d'équilibrage de charge d'ILB1 et ajouter l'IP frontale à une interface de bouclage de chaque machine virtuelle." } }
    - { id: c, text: { en: "Add the VMs to the backend pool of a public Standard load balancer that has an outbound rule and no load-balancing rule.", fr: "Ajouter les machines virtuelles au pool principal d'un équilibreur de charge public Standard doté d'une règle de trafic sortant et d'aucune règle d'équilibrage de charge." } }
    - { id: d, text: { en: "Create an inbound NAT rule on ILB1 that maps a distinct frontend port to each VM.", fr: "Créer sur ILB1 une règle NAT de trafic entrant qui associe un port frontal distinct à chaque machine virtuelle." } }
    - { id: e, text: { en: "Replace the load-balancing rule of ILB1 with an HA ports rule that uses the protocol All.", fr: "Remplacer la règle d'équilibrage de charge d'ILB1 par une règle de ports HA qui utilise le protocole All." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      An internal load balancer provides no outbound internet connectivity. A NAT gateway on the subnet is the preferred explicit outbound method. Alternatively, an outbound-only configuration on a public Standard load balancer (backend pool plus outbound rule, no inbound rule) provides SNAT through its public frontend while clients keep using ILB1.
    fr: |
      Un équilibreur de charge interne ne fournit aucune connectivité Internet sortante. Une passerelle NAT sur le sous-réseau est la méthode sortante explicite recommandée. Une configuration sortante uniquement sur un équilibreur de charge public Standard (pool principal et règle de trafic sortant, sans règle entrante) fournit aussi la SNAT par son front-end public, tandis que les clients continuent d'utiliser ILB1.
  options:
    b: { en: "Floating IP changes how inbound packets are delivered to the VMs; it gives them no route to the internet.", fr: "L'IP flottante modifie la façon dont les paquets entrants sont remis aux machines virtuelles ; elle ne leur donne aucun accès à Internet." }
    d: { en: "Inbound NAT rules forward inbound connections from a private frontend; they provide no internet egress.", fr: "Les règles NAT de trafic entrant transfèrent des connexions entrantes depuis un front-end privé ; elles ne fournissent aucune sortie Internet." }
    e: { en: "HA ports balances all inbound ports on the private frontend; it does not translate outbound traffic to a public IP address.", fr: "Les ports HA équilibrent tous les ports entrants du front-end privé ; ils ne traduisent pas le trafic sortant vers une adresse IP publique." }
references:
  - title: Outbound rules for Azure Load Balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/outbound-rules
  - title: Source Network Address Translation (SNAT) for outbound connections
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-outbound-connections
