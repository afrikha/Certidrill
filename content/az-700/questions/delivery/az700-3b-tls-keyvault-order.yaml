id: az700-3b-tls-keyvault-order
objective: "3.2.9"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You have an Application Gateway Standard_v2 named **AGW1** and a key vault named **kv-contoso** that uses the **Vault access policy** permission model. The key vault firewall is disabled. kv-contoso stores a certificate for www.contoso.com with an exportable private key.

    You need an HTTPS listener of AGW1 to use the certificate stored in kv-contoso. Renewed versions of the certificate must be used automatically.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous disposez d'un Application Gateway Standard_v2 nommé **AGW1** et d'un coffre de clés nommé **kv-contoso** qui utilise le modèle d'autorisation **Stratégie d'accès du coffre** (Vault access policy). Le pare-feu du coffre est désactivé. kv-contoso stocke un certificat pour www.contoso.com avec une clé privée exportable.

    Un écouteur HTTPS d'AGW1 doit utiliser le certificat stocké dans kv-contoso. Les versions renouvelées du certificat doivent être utilisées automatiquement.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: uami, text: { en: "Create a user-assigned managed identity.", fr: "Créer une identité managée affectée par l'utilisateur." } }
    - { id: policy, text: { en: "Add an access policy to kv-contoso that grants the identity the Get permission on secrets.", fr: "Ajouter à kv-contoso une stratégie d'accès qui accorde à l'identité l'autorisation Get sur les secrets." } }
    - { id: listener, text: { en: "Configure the listener to use the certificate from kv-contoso through the identity, with a secret identifier that has no version.", fr: "Configurer l'écouteur pour qu'il utilise le certificat de kv-contoso par l'intermédiaire de l'identité, avec un identificateur de secret sans version." } }
    - { id: sami, text: { en: "Enable the system-assigned managed identity of AGW1.", fr: "Activer l'identité managée affectée par le système d'AGW1." } }
    - { id: rootcert, text: { en: "Export the certificate as a .cer file and upload it as a trusted root certificate in the backend settings.", fr: "Exporter le certificat dans un fichier .cer et le charger comme certificat racine approuvé dans les paramètres de back-end." } }
    - { id: pinned, text: { en: "Configure the listener with the secret identifier of the current certificate version.", fr: "Configurer l'écouteur avec l'identificateur de secret de la version actuelle du certificat." } }
answer:
  sequence: [ uami, policy, listener ]
explanation:
  correct:
    en: Application Gateway retrieves Key Vault certificates through one user-assigned managed identity. You create the identity, delegate access to the vault (Get on secrets with access policies, or Key Vault Secrets User with Azure RBAC), and then reference the certificate in the listener. A secret identifier without a version lets the instances pick up renewed versions when they poll the vault every four hours.
    fr: "Application Gateway récupère les certificats Key Vault par l'intermédiaire d'une identité managée affectée par l'utilisateur. Vous créez l'identité, vous lui déléguez l'accès au coffre (Get sur les secrets avec les stratégies d'accès, ou Key Vault Secrets User avec Azure RBAC), puis vous référencez le certificat dans l'écouteur. Un identificateur de secret sans version permet aux instances de récupérer les versions renouvelées quand elles interrogent le coffre toutes les quatre heures."
  options:
    sami: { en: "Application Gateway uses a user-assigned managed identity to access Key Vault.", fr: "Application Gateway utilise une identité managée affectée par l'utilisateur pour accéder à Key Vault." }
    rootcert: { en: "A trusted root certificate validates backend servers; it does not provide the listener certificate.", fr: "Un certificat racine approuvé valide les serveurs principaux ; il ne fournit pas le certificat de l'écouteur." }
    pinned: { en: "A versioned identifier keeps the gateway on that version, so renewals are not picked up.", fr: "Un identificateur avec version maintient la passerelle sur cette version : les renouvellements ne sont pas récupérés." }
references:
  - title: TLS termination with Key Vault certificates
    url: https://learn.microsoft.com/en-us/azure/application-gateway/key-vault-certs
