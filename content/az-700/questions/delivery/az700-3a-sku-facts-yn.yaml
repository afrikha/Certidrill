id: az700-3a-sku-facts-yn
objective: "3.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip is standardizing its Azure load balancers. The network team uses the Standard SKU for application traffic and the Gateway SKU for third-party network virtual appliances.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip standardise ses équilibreurs de charge Azure. L'équipe réseau utilise la référence SKU Standard pour le trafic applicatif et la référence SKU Gateway pour les appliances virtuelles réseau tierces.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The backend pool of a Standard load balancer can contain virtual machines from different availability sets, provided they are in the same virtual network.
        fr: Le pool principal d'un équilibreur de charge Standard peut contenir des machines virtuelles de différents groupes à haute disponibilité, à condition qu'elles se trouvent dans le même réseau virtuel.
    - id: s2
      text:
        en: A Gateway SKU load balancer can have a load-balancing rule that forwards only TCP port 443 to its backend pool.
        fr: Un équilibreur de charge de référence SKU Gateway peut avoir une règle d'équilibrage de charge qui transfère uniquement le port TCP 443 vers son pool principal.
    - id: s3
      text:
        en: A Standard load balancer can be moved to another subscription.
        fr: Un équilibreur de charge Standard peut être déplacé vers un autre abonnement.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The backend pool of a Standard load balancer can contain any VMs or scale set instances in a single virtual network; the availability set restriction applied to the retired Basic SKU. A Gateway Load Balancer supports only HA ports rules, which forward all ports and protocols. Standard load balancers can be moved between resource groups in the same subscription, but subscription moves are not supported.
    fr: |
      Le pool principal d'un équilibreur de charge Standard peut contenir n'importe quelles machines virtuelles ou instances de groupe identique d'un même réseau virtuel ; la restriction au groupe à haute disponibilité concernait la référence SKU Basic, mise hors service. Un équilibreur de charge de passerelle ne prend en charge que des règles de ports HA, qui transfèrent tous les ports et protocoles. Un équilibreur de charge Standard peut être déplacé entre groupes de ressources d'un même abonnement, mais pas vers un autre abonnement.
references:
  - title: Azure Load Balancer SKUs
    url: https://learn.microsoft.com/en-us/azure/load-balancer/skus
  - title: Gateway load balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/gateway-overview
