id: az700-3b-tls-facts-yn
objective: "3.2.9"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso deploys an Application Gateway Standard_v2 named **AGW1** by using an ARM template with API version 2024-05-01. No TLS policy is specified in the template. The HTTPS listener of AGW1 references a certificate in Azure Key Vault by a secret identifier without a version. The backend settings use HTTPS, and the backend servers present certificates issued by a well-known public certificate authority, whose common name matches the host name configured in the backend settings.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso déploie un Application Gateway Standard_v2 nommé **AGW1** au moyen d'un modèle ARM avec la version d'API 2024-05-01. Aucune stratégie TLS n'est indiquée dans le modèle. L'écouteur HTTPS d'AGW1 référence un certificat d'Azure Key Vault par un identificateur de secret sans version. Les paramètres de back-end utilisent HTTPS, et les serveurs principaux présentent des certificats émis par une autorité de certification publique connue, dont le nom commun correspond au nom d'hôte configuré dans les paramètres de back-end.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When the certificate is renewed in Key Vault, AGW1 starts using the new version without a change to the listener.
        fr: Quand le certificat est renouvelé dans Key Vault, AGW1 commence à utiliser la nouvelle version sans modification de l'écouteur.
    - id: s2
      text:
        en: You must upload the root certificate of the public certificate authority to the backend settings for end-to-end TLS to work.
        fr: Vous devez charger le certificat racine de l'autorité de certification publique dans les paramètres de back-end pour que le TLS de bout en bout fonctionne.
    - id: s3
      text:
        en: Clients can connect to the listener by using TLS 1.3, and connections that use TLS 1.1 are refused.
        fr: Les clients peuvent se connecter à l'écouteur avec TLS 1.3, et les connexions qui utilisent TLS 1.1 sont refusées.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "With a versionless secret identifier, the gateway instances poll Key Vault every four hours and use the renewed version. On v2, backend certificates issued by a well-known CA whose CN matches the host name of the backend settings need no trusted root certificate; that step is only for self-signed or private CA certificates. With API version 2023-02-01 or later, the default policy is AppGwSslPolicy20220101: minimum TLS 1.2, with TLS 1.3 supported."
    fr: "Avec un identificateur de secret sans version, les instances de la passerelle interrogent Key Vault toutes les quatre heures et utilisent la version renouvelée. En v2, les certificats de back-end émis par une CA connue dont le CN correspond au nom d'hôte des paramètres de back-end ne demandent aucun certificat racine approuvé ; cette étape ne concerne que les certificats auto-signés ou d'autorité privée. Avec la version d'API 2023-02-01 ou ultérieure, la stratégie par défaut est AppGwSslPolicy20220101 : TLS 1.2 minimum, avec prise en charge de TLS 1.3."
references:
  - title: Application Gateway TLS policy overview
    url: https://learn.microsoft.com/en-us/azure/application-gateway/application-gateway-ssl-policy-overview
  - title: Overview of TLS termination and end to end TLS with Application Gateway
    url: https://learn.microsoft.com/en-us/azure/application-gateway/ssl-overview
