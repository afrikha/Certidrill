id: az700-sr2-afd-privatelink-1
objective: "3.3.9"
type: series_yesno
series: az700-sr2-afd-privatelink
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: You use a Standard profile and restrict app1 to Front Door traffic.
  fr: Vous utilisez un profil Standard et limitez app1 au trafic de Front Door.
body:
  solution:
    en: |
      You create an Azure Front Door Standard profile and add app1 as an origin. On app1, you add an access restriction rule that allows only the `AzureFrontDoor.Backend` service tag with an `X-Azure-FDID` header that matches the ID of the profile, and you deny all other traffic.
    fr: |
      Vous créez un profil Azure Front Door Standard et ajoutez app1 comme origine. Sur app1, vous ajoutez une règle de restriction d'accès qui autorise uniquement l'étiquette de service `AzureFrontDoor.Backend` avec un en-tête `X-Azure-FDID` correspondant à l'ID du profil, et vous refusez tout autre trafic.
answer: { value: false }
explanation:
  correct:
    en: |
      Access restrictions filter who can use the public endpoint of app1, but Front Door still connects to that public endpoint, so neither requirement is met. Private connectivity from Front Door to an origin uses Private Link, which only Azure Front Door Premium supports.
    fr: |
      Les restrictions d'accès filtrent qui peut utiliser le point de terminaison public d'app1, mais Front Door se connecte toujours à ce point de terminaison public : aucune des deux exigences n'est satisfaite. La connectivité privée de Front Door vers une origine passe par Private Link, que seul Azure Front Door Premium prend en charge.
references:
  - title: Secure your origin with Private Link in Azure Front Door Premium
    url: https://learn.microsoft.com/en-us/azure/frontdoor/private-link
