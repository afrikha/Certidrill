id: az700-3b-afd-capabilities-yn
objective: "3.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Proseware plans to publish a web application through an Azure Front Door Standard profile. The application runs on web servers in its on-premises datacenter, which are reachable from the internet on a public IP address, and on an App Service app in Azure.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit de publier une application web au moyen d'un profil Azure Front Door Standard. L'application s'exécute sur des serveurs web de son centre de données local, joignables depuis Internet sur une adresse IP publique, et sur une application App Service dans Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The on-premises web servers can be origins of the profile, in the same origin group as the App Service app.
        fr: Les serveurs web locaux peuvent être des origines du profil, dans le même groupe d'origines que l'application App Service.
    - id: s2
      text:
        en: Front Door can terminate the clients' TLS connections at the edge and forward the requests to the origins over HTTP.
        fr: Front Door peut mettre fin aux connexions TLS des clients en périphérie et transférer les requêtes aux origines en HTTP.
    - id: s3
      text:
        en: To cache static content at the edge, you must deploy an Azure CDN profile in addition to the Front Door profile.
        fr: Pour mettre en cache le contenu statique en périphérie, vous devez déployer un profil Azure CDN en plus du profil Front Door.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Front Door load balances origins hosted in Azure or anywhere else, as long as public origins are reachable from the internet. It offloads TLS at the edge, and the forwarding protocol of the route can be HTTP only. Front Door is itself a content delivery network, so caching is a setting of the route, not a separate service.
    fr: "Front Door équilibre la charge entre des origines hébergées dans Azure ou ailleurs, tant que les origines publiques sont joignables depuis Internet. Il décharge TLS en périphérie, et le protocole de transfert de l'itinéraire peut être HTTP uniquement. Front Door est lui-même un réseau de distribution de contenu : la mise en cache est un paramètre de l'itinéraire, pas un service distinct."
references:
  - title: What is Azure Front Door?
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-overview
