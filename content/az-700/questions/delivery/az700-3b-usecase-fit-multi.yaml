id: az700-3b-usecase-fit-multi
objective: "3.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso is reviewing workloads that could be published through Azure Front Door.

    | Workload | Description |
    | --- | --- |
    | W1 | A REST API used by mobile apps worldwide; responses are personalized and must not be cached |
    | W2 | A static website hosted in an Azure Storage account, published on www.contoso.com over HTTPS |
    | W3 | Remote Desktop access (TCP 3389) to virtual machines in two regions |
    | W4 | An MQTT broker that IoT devices reach on TCP 8883 |
    | W5 | A human resources portal that must be reachable only from the corporate virtual networks, never from the internet |

    Which two workloads are appropriate use cases for Azure Front Door?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso étudie les charges de travail qui pourraient être publiées au moyen d'Azure Front Door.

    | Charge de travail | Description |
    | --- | --- |
    | W1 | Une API REST utilisée par des applications mobiles dans le monde entier ; les réponses sont personnalisées et ne doivent pas être mises en cache |
    | W2 | Un site web statique hébergé dans un compte Stockage Azure, publié sur www.contoso.com en HTTPS |
    | W3 | Un accès Bureau à distance (TCP 3389) à des machines virtuelles dans deux régions |
    | W4 | Un broker MQTT que des appareils IoT joignent sur TCP 8883 |
    | W5 | Un portail de ressources humaines qui doit être joignable uniquement depuis les réseaux virtuels de l'entreprise, jamais depuis Internet |

    Quelles sont les deux charges de travail qui constituent des cas d'usage appropriés pour Azure Front Door ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: W1 }
    - { id: b, text: W2 }
    - { id: c, text: W3 }
    - { id: d, text: W4 }
    - { id: e, text: W5 }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: A global API benefits from Front Door even without caching, through split TCP at the edge and reused connections to the origin over the Microsoft network. A static website in Azure Storage is a typical Front Door origin, with a custom domain, HTTPS and caching.
    fr: "Une API mondiale tire parti de Front Door même sans mise en cache, grâce au TCP fractionné en périphérie et aux connexions réutilisées vers l'origine sur le réseau Microsoft. Un site web statique dans Stockage Azure est une origine Front Door typique, avec un domaine personnalisé, HTTPS et la mise en cache."
  options:
    c: { en: "Front Door handles only HTTP and HTTPS; RDP needs another service, such as Azure Bastion or Load Balancer.", fr: "Front Door ne traite que HTTP et HTTPS ; RDP a besoin d'un autre service, comme Azure Bastion ou Load Balancer." }
    d: { en: "MQTT over TCP 8883 is not HTTP, so Front Door cannot carry it.", fr: "MQTT sur TCP 8883 n'est pas du HTTP : Front Door ne peut pas le transporter." }
    e: { en: "Front Door is an internet-facing entry point; a private-only application fits an internal Application Gateway.", fr: "Front Door est un point d'entrée exposé à Internet ; une application uniquement privée relève d'un Application Gateway interne." }
references:
  - title: What is Azure Front Door?
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-overview
  - title: Traffic acceleration
    url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-traffic-acceleration
