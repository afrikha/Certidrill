id: az700-3a-lb-persistence-media-upload
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso hosts a media ingestion service on four virtual machines (VM1 to VM4) in the backend pool of a public Standard load balancer named **LB1**.

    Each client opens a control session on TCP port 5000 and then uploads data on UDP port 5001. LB1 has two load-balancing rules that use the same frontend IP configuration and the same backend pool:

    | Rule | Protocol | Port |
    | --- | --- | --- |
    | Rule-Control | TCP | 5000 |
    | Rule-Upload | UDP | 5001 |

    You need to ensure that the TCP session and the UDP flows of a given client are always handled by the same virtual machine.

    Which session persistence setting should you configure on both rules?
  fr: |
    Contoso héberge un service d'ingestion multimédia sur quatre machines virtuelles (VM1 à VM4) dans le pool principal d'un équilibreur de charge public Standard nommé **LB1**.

    Chaque client ouvre une session de contrôle sur le port TCP 5000, puis charge des données sur le port UDP 5001. LB1 dispose de deux règles d'équilibrage de charge qui utilisent la même configuration IP frontale et le même pool principal :

    | Règle | Protocole | Port |
    | --- | --- | --- |
    | Rule-Control | TCP | 5000 |
    | Rule-Upload | UDP | 5001 |

    Vous devez faire en sorte que la session TCP et les flux UDP d'un même client soient toujours traités par la même machine virtuelle.

    Quel paramètre de persistance de session devez-vous configurer sur les deux règles ?
body:
  options:
    - { id: a, text: { en: "Client IP", fr: "Client IP" } }
    - { id: b, text: { en: "None (hash based)", fr: "None (basé sur le hachage)" } }
    - { id: c, text: { en: "Client IP and protocol", fr: "Client IP and protocol" } }
    - { id: d, text: { en: "Floating IP enabled, session persistence None", fr: "IP flottante activée, persistance de session None" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Client IP session persistence uses a two-tuple hash (source IP and destination IP). Both rules share the same frontend IP, so the TCP control session and the UDP upload of a client hash to the same backend instance. This is the media upload scenario that Microsoft documents for source IP affinity.
    fr: |
      La persistance de session Client IP utilise un hachage à deux tuples (adresse IP source et adresse IP de destination). Les deux règles partagent la même adresse IP frontale : la session de contrôle TCP et le chargement UDP d'un client aboutissent donc à la même instance principale. C'est le scénario de chargement multimédia documenté par Microsoft pour l'affinité d'adresse IP source.
  options:
    b: { en: "The default five-tuple hash includes the source port and the protocol, so the TCP and UDP flows can land on different VMs.", fr: "Le hachage par défaut à cinq tuples inclut le port source et le protocole : les flux TCP et UDP peuvent aboutir sur des machines virtuelles différentes." }
    c: { en: "The three-tuple hash includes the protocol, so TCP and UDP flows from the same client are hashed separately and can reach different VMs.", fr: "Le hachage à trois tuples inclut le protocole : les flux TCP et UDP d'un même client sont hachés séparément et peuvent atteindre des machines virtuelles différentes." }
    d: { en: "Floating IP changes the destination IP mapping seen by the VM; it does not provide any affinity, and None keeps the five-tuple distribution.", fr: "L'IP flottante modifie l'adresse IP de destination vue par la machine virtuelle ; elle ne fournit aucune affinité, et None conserve la distribution à cinq tuples." }
references:
  - title: Azure Load Balancer distribution modes
    url: https://learn.microsoft.com/en-us/azure/load-balancer/distribution-mode-concepts
