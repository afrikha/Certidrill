id: az700-3a-rule-ha-ports
objective: "3.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind has a hub virtual network that contains two firewall network virtual appliances (NVAs) in the backend pool of an internal Standard load balancer named **ILB-FW**. User-defined routes in the spoke virtual networks send all traffic to the frontend IP address of ILB-FW.

    You need ILB-FW to distribute all TCP and UDP flows, on every port, across the healthy NVAs by using a single load-balancing rule.

    How should you configure the rule?
  fr: |
    Northwind dispose d'un réseau virtuel hub qui contient deux appliances virtuelles réseau (NVA) de pare-feu dans le pool principal d'un équilibreur de charge interne Standard nommé **ILB-FW**. Des itinéraires définis par l'utilisateur dans les réseaux virtuels spoke envoient tout le trafic vers l'adresse IP frontale d'ILB-FW.

    Vous devez faire en sorte qu'ILB-FW répartisse tous les flux TCP et UDP, sur tous les ports, entre les NVA saines, au moyen d'une seule règle d'équilibrage de charge.

    Comment devez-vous configurer la règle ?
body:
  options:
    - { id: a, text: { en: "Protocol All, frontend port 0 and backend port 0 (HA ports)", fr: "Protocole All, port frontal 0 et port principal 0 (ports HA)" } }
    - { id: b, text: { en: "Protocol Tcp, frontend port 0 and backend port 0, with Floating IP enabled", fr: "Protocole Tcp, port frontal 0 et port principal 0, avec l'IP flottante activée" } }
    - { id: c, text: { en: "Protocol All, frontend port 443 and backend port 443, with session persistence Client IP", fr: "Protocole All, port frontal 443 et port principal 443, avec la persistance de session Client IP" } }
    - { id: d, text: { en: "Protocol Udp, frontend port 0 and backend port 0, with TCP reset enabled", fr: "Protocole Udp, port frontal 0 et port principal 0, avec TCP reset activé" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An HA ports rule is a load-balancing rule with the protocol All and the frontend and backend ports set to 0. It balances all TCP and UDP flows on all ports, per five-tuple flow, and is available only on an internal Standard load balancer, which is the typical design for NVAs in a hub.
    fr: |
      Une règle de ports HA est une règle d'équilibrage de charge avec le protocole All et les ports frontal et principal définis sur 0. Elle équilibre tous les flux TCP et UDP sur tous les ports, flux par flux (cinq tuples), et n'est disponible que sur un équilibreur de charge interne Standard, ce qui correspond à la conception habituelle des NVA dans un hub.
  options:
    b: { en: "With the protocol Tcp, UDP flows would not be balanced; HA ports requires the protocol All.", fr: "Avec le protocole Tcp, les flux UDP ne seraient pas équilibrés ; les ports HA exigent le protocole All." }
    c: { en: "A rule on port 443 only balances that port, so the other ports would not be forwarded to the NVAs.", fr: "Une règle sur le port 443 n'équilibre que ce port : les autres ports ne seraient pas transférés vers les NVA." }
    d: { en: "With the protocol Udp, TCP flows would not be balanced, and TCP reset applies only to TCP.", fr: "Avec le protocole Udp, les flux TCP ne seraient pas équilibrés, et TCP reset ne s'applique qu'à TCP." }
references:
  - title: High availability ports overview
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-ha-ports-overview
