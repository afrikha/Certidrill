id: az700-3b-rewrite-action-match
objective: "3.2.10"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You create a rewrite set for an Application Gateway Standard_v2 named **AGW1** and associate it with a basic routing rule.

    Which rewrite action should you use for each requirement? To answer, drag the appropriate actions to the correct requirements. Each action may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un ensemble de réécriture pour un Application Gateway Standard_v2 nommé **AGW1** et l'associez à une règle de routage de base.

    Quelle action de réécriture devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les actions appropriées vers les exigences correspondantes. Chaque action peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: setreq, text: { en: "Set a request header", fr: "Définir un en-tête de requête" } }
    - { id: setresp, text: { en: "Set a response header", fr: "Définir un en-tête de réponse" } }
    - { id: delresp, text: { en: "Delete a response header", fr: "Supprimer un en-tête de réponse" } }
    - { id: url, text: { en: "Rewrite the URL path and query string", fr: "Réécrire le chemin d'URL et la chaîne de requête" } }
    - { id: delreq, text: { en: "Delete a request header", fr: "Supprimer un en-tête de requête" } }
  targets:
    - id: t1
      text: { en: "Add Strict-Transport-Security to every response sent to the clients.", fr: "Ajouter Strict-Transport-Security à chaque réponse envoyée aux clients." }
    - id: t2
      text: { en: "Hide the X-Powered-By header returned by the servers.", fr: "Masquer l'en-tête X-Powered-By renvoyé par les serveurs." }
    - id: t3
      text: { en: "Send the client IP address without its port number to the servers in X-Forwarded-For.", fr: "Envoyer aux serveurs l'adresse IP du client sans son numéro de port dans X-Forwarded-For." }
    - id: t4
      text: { en: "Forward requests for /shop/item?id=5 to the servers as /item/5, without the client noticing.", fr: "Transférer aux serveurs les requêtes pour /shop/item?id=5 sous la forme /item/5, sans que le client s'en aperçoive." }
answer:
  mapping: { t1: setresp, t2: delresp, t3: setreq, t4: url }
explanation:
  correct:
    en: Security headers such as HSTS are added by setting a response header, and a header that reveals the server technology is removed by deleting the response header. X-Forwarded-For is a request header that the gateway sets for the backend, for example to `{var_client_ip}`. Changing the path and query string sent to the backend is a URL rewrite, invisible to the client.
    fr: "Les en-têtes de sécurité tels que HSTS s'ajoutent en définissant un en-tête de réponse, et un en-tête qui révèle la technologie du serveur se retire en supprimant l'en-tête de réponse. X-Forwarded-For est un en-tête de requête que la passerelle définit pour le back-end, par exemple sur `{var_client_ip}`. Modifier le chemin et la chaîne de requête envoyés au back-end relève de la réécriture d'URL, invisible pour le client."
  options:
    delreq: { en: "Deleting X-Forwarded-For would remove the client address instead of sending it without the port.", fr: "Supprimer X-Forwarded-For retirerait l'adresse du client au lieu de l'envoyer sans le port." }
references:
  - title: Rewrite HTTP headers and URL with Application Gateway
    url: https://learn.microsoft.com/en-us/azure/application-gateway/rewrite-http-headers-url
