id: az700-3a-agw-feature-match
objective: "3.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam uses an Application Gateway WAF_v2 named **AGW1** to publish several websites.

    You need to identify the feature of AGW1 that meets each requirement.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise un Application Gateway WAF_v2 nommé **AGW1** pour publier plusieurs sites web.

    Vous devez identifier la fonctionnalité d'AGW1 qui répond à chaque exigence.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rewrite, text: { en: "Rewrite rule set", fr: "Ensemble de règles de réécriture" } }
    - { id: drain, text: { en: "Connection draining", fr: "Drainage de connexion" } }
    - { id: multisite, text: { en: "Multi-site listener", fr: "Écouteur multisite" } }
    - { id: errorpage, text: { en: "Custom error pages", fr: "Pages d'erreur personnalisées" } }
    - { id: affinity, text: { en: "Cookie-based affinity", fr: "Affinité basée sur les cookies" } }
    - { id: path, text: { en: "URL path-based routing", fr: "Routage basé sur le chemin d'URL" } }
  targets:
    - id: t1
      text: { en: "Add a Strict-Transport-Security header to every response sent to clients", fr: "Ajouter un en-tête Strict-Transport-Security à chaque réponse envoyée aux clients" }
    - id: t2
      text: { en: "Let in-flight requests complete when a server is removed from a backend pool", fr: "Laisser se terminer les requêtes en cours lorsqu'un serveur est retiré d'un pool principal" }
    - id: t3
      text: { en: "Publish www.fabrikam.com and www.tailspin.com on the same frontend IP address and port", fr: "Publier www.fabrikam.com et www.tailspin.com sur la même adresse IP frontale et le même port" }
    - id: t4
      text: { en: "Show a branded page instead of the default page when the gateway returns a 502 error", fr: "Afficher une page à l'image de l'entreprise au lieu de la page par défaut quand la passerelle renvoie une erreur 502" }
answer:
  mapping: { t1: rewrite, t2: drain, t3: multisite, t4: errorpage }
explanation:
  correct:
    en: |
      Rewrite rule sets add, remove or update request and response headers. Connection draining, configured in the backend settings, lets existing requests finish when members are removed. A multi-site listener routes by host name, so several sites share one IP address and port. Custom error pages replace the default error pages. Cookie-based affinity and path-based routing meet none of these requirements.
    fr: |
      Les ensembles de règles de réécriture ajoutent, suppriment ou modifient les en-têtes de requête et de réponse. Le drainage de connexion, configuré dans les paramètres de back-end, laisse les requêtes existantes se terminer lors du retrait de membres. Un écouteur multisite route selon le nom d'hôte : plusieurs sites partagent ainsi une adresse IP et un port. Les pages d'erreur personnalisées remplacent les pages d'erreur par défaut. L'affinité basée sur les cookies et le routage basé sur le chemin ne répondent à aucune de ces exigences.
references:
  - title: Azure Application Gateway features
    url: https://learn.microsoft.com/en-us/azure/application-gateway/features
