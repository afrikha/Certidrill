id: az700-5b-fw-rules-nat-cli
objective: "5.2.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    An Azure Firewall named **FW1** has the public IP address 20.80.4.10 and the private IP address 10.0.1.4. It's associated with a firewall policy named **FWP1** that contains a rule collection group named **RCG-Inbound**.

    You need to publish an internal web server that has the IP address 10.40.2.15 so that internet users reach it on TCP port 8443 of the public IP address of FW1. The server listens on TCP port 443.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un Pare-feu Azure nommé **FW1** a l'adresse IP publique 20.80.4.10 et l'adresse IP privée 10.0.1.4. Il est associé à une stratégie de pare-feu nommée **FWP1** qui contient un groupe de collections de règles nommé **RCG-Inbound**.

    Vous devez publier un serveur web interne d'adresse IP 10.40.2.15 pour que les utilisateurs d'Internet le joignent sur le port TCP 8443 de l'adresse IP publique de FW1. Le serveur écoute sur le port TCP 443.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network firewall policy rule-collection-group collection add-nat-collection \
      -g RG-Hub --policy-name FWP1 --rule-collection-group-name RCG-Inbound \
      --name NAT-Web --collection-priority 110 --action [[act]] \
      --rule-name Web01 --source-addresses "*" --ip-protocols TCP \
      --destination-addresses [[dest]] --destination-ports 8443 \
      --translated-address [[trans]] --translated-port 443
  slots:
    - id: act
      options:
        - { id: dnat, text: DNAT }
        - { id: snat, text: SNAT }
        - { id: allow, text: Allow }
    - id: dest
      options:
        - { id: pub, text: 20.80.4.10 }
        - { id: priv, text: 10.0.1.4 }
        - { id: srv, text: 10.40.2.15 }
    - id: trans
      options:
        - { id: srv, text: 10.40.2.15 }
        - { id: priv, text: 10.0.1.4 }
        - { id: pub, text: 20.80.4.10 }
answer:
  values: { act: dnat, dest: pub, trans: srv }
explanation:
  correct:
    en: |
      A NAT rule collection that publishes a server uses the DNAT action. The destination is the address and port that clients connect to, here the firewall's public IP address on port 8443, and the translated address and port identify the internal server (10.40.2.15:443).
    fr: |
      Une collection de règles NAT qui publie un serveur utilise l'action DNAT. La destination est l'adresse et le port auxquels les clients se connectent, ici l'adresse IP publique du pare-feu sur le port 8443, et l'adresse et le port traduits désignent le serveur interne (10.40.2.15:443).
  options:
    snat: { en: "SNAT translates source addresses; publishing a server inbound requires destination NAT.", fr: "La SNAT traduit les adresses sources ; publier un serveur en entrée exige une traduction de destination." }
    allow: { en: "Allow and Deny are the actions of filter (network or application) collections, not of NAT collections.", fr: "Allow et Deny sont les actions des collections de filtrage (réseau ou application), pas des collections NAT." }
references:
  - title: az network firewall policy rule-collection-group collection
    url: https://learn.microsoft.com/en-us/cli/azure/network/firewall/policy/rule-collection-group/collection?view=azure-cli-latest
  - title: Azure Firewall rule processing logic
    url: https://learn.microsoft.com/en-us/azure/firewall/rule-processing
