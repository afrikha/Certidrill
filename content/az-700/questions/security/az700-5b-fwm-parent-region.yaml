id: az700-5b-fwm-parent-region
objective: "5.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses Azure Firewall Manager. The central security team created a firewall policy named **FWP-Base** in the East US region. FWP-Base contains network and application rule collections that every firewall must enforce.

    An application team operates an Azure Firewall named **FW-WEU** in the West Europe region. The team must manage its own rule collections for FW-WEU, and the rule collections of FWP-Base must always be processed before the team's rule collections. Changes that the security team makes to FWP-Base must apply to FW-WEU automatically.

    What should you do?
  fr: |
    Woodgrove Bank utilise Azure Firewall Manager. L'équipe de sécurité centrale a créé une stratégie de pare-feu nommée **FWP-Base** dans la région East US. FWP-Base contient des collections de règles de réseau et d'application que chaque pare-feu doit appliquer.

    Une équipe applicative exploite un Pare-feu Azure nommé **FW-WEU** dans la région West Europe. L'équipe doit gérer ses propres collections de règles pour FW-WEU, et les collections de règles de FWP-Base doivent toujours être traitées avant celles de l'équipe. Les modifications que l'équipe de sécurité apporte à FWP-Base doivent s'appliquer automatiquement à FW-WEU.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a policy named FWP-WEU in West Europe with FWP-Base as its parent policy, and associate FWP-WEU with FW-WEU.", fr: "Créer dans West Europe une stratégie nommée FWP-WEU dont FWP-Base est la stratégie parente, et associer FWP-WEU à FW-WEU." }
    - id: b
      text: { en: "Create a policy named FWP-WEU in East US with FWP-Base as its parent policy, and associate FWP-WEU with FW-WEU.", fr: "Créer dans East US une stratégie nommée FWP-WEU dont FWP-Base est la stratégie parente, et associer FWP-WEU à FW-WEU." }
    - id: c
      text: { en: "Associate both FWP-Base and a new West Europe policy named FWP-WEU with FW-WEU, and give FWP-Base the lower priority number.", fr: "Associer à FW-WEU à la fois FWP-Base et une nouvelle stratégie West Europe nommée FWP-WEU, et donner à FWP-Base le plus petit numéro de priorité." }
    - id: d
      text: { en: "Copy the rule collections of FWP-Base into a new West Europe policy named FWP-WEU, and assign the team the Contributor role on FWP-WEU.", fr: "Copier les collections de règles de FWP-Base dans une nouvelle stratégie West Europe nommée FWP-WEU, et attribuer à l'équipe le rôle Contributor sur FWP-WEU." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A child policy inherits the network and application rule collections of its parent (NAT rule collections aren't inherited), the inherited collections are always processed before the child's, and changes to the parent flow down automatically. The parent and child policies must be in the same region, but a policy can be associated with firewalls in any region, so the child is created in East US and associated with FW-WEU.
    fr: |
      Une stratégie enfant hérite des collections de règles de réseau et d'application de sa stratégie parente (les collections de règles NAT ne sont pas héritées), les collections héritées sont toujours traitées avant celles de l'enfant, et les modifications de la stratégie parente se propagent automatiquement. Les stratégies parente et enfant doivent se trouver dans la même région, mais une stratégie peut être associée à des pare-feu de n'importe quelle région : l'enfant est donc créé dans East US et associé à FW-WEU.
  options:
    a: { en: "A child policy must be in the same region as its parent policy.", fr: "Une stratégie enfant doit se trouver dans la même région que sa stratégie parente." }
    c: { en: "A firewall is associated with one firewall policy; layering is done through the parent-child hierarchy, not by associating two policies.", fr: "Un pare-feu est associé à une seule stratégie de pare-feu ; la superposition passe par la hiérarchie parent-enfant, pas par l'association de deux stratégies." }
    d: { en: "A copy doesn't receive later changes to FWP-Base, and the team could modify or reorder the copied rules.", fr: "Une copie ne reçoit pas les modifications ultérieures de FWP-Base, et l'équipe pourrait modifier ou réordonner les règles copiées." }
references:
  - title: Azure Firewall Manager policy overview
    url: https://learn.microsoft.com/en-us/azure/firewall-manager/policy-overview
