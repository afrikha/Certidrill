id: az700-5a-fw-fqdn-network
objective: "5.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An Azure Firewall Standard instance named **FW1** is deployed in a hub virtual network and has the private IP address 10.0.1.4. FW1 is managed by a firewall policy named **FWP1**. The spoke virtual networks use the Azure-provided DNS servers, and their route tables send all traffic to FW1.

    You plan to add a network rule to FWP1 that allows SFTP (TCP 22) from the spokes to the destination FQDN **sftp.fabrikam.com** only. The firewall and the virtual machines must resolve the name to the same IP addresses.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une instance du Pare-feu Azure Standard nommée **FW1** est déployée dans un réseau virtuel hub et a l'adresse IP privée 10.0.1.4. FW1 est gérée par une stratégie de pare-feu nommée **FWP1**. Les réseaux virtuels spoke utilisent les serveurs DNS fournis par Azure, et leurs tables de routage envoient tout le trafic à FW1.

    Vous prévoyez d'ajouter à FWP1 une règle de réseau qui autorise SFTP (TCP 22) depuis les spokes vers le FQDN de destination **sftp.fabrikam.com** uniquement. Le pare-feu et les machines virtuelles doivent résoudre le nom vers les mêmes adresses IP.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable DNS proxy in the DNS settings of FWP1.", fr: "Activer le proxy DNS dans les paramètres DNS de FWP1." } }
    - { id: b, text: { en: "Create an application rule with the protocol SSH:22 and the target FQDN sftp.fabrikam.com.", fr: "Créer une règle d'application avec le protocole SSH:22 et le FQDN cible sftp.fabrikam.com." } }
    - { id: c, text: { en: "Set the DNS servers of the spoke virtual networks to 10.0.1.4 and restart the virtual machines.", fr: "Définir 10.0.1.4 comme serveur DNS des réseaux virtuels spoke et redémarrer les machines virtuelles." } }
    - { id: d, text: { en: "Upgrade FW1 and FWP1 to the Premium SKU.", fr: "Mettre à niveau FW1 et FWP1 vers la référence SKU Premium." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      FQDNs in network rules require the DNS proxy, which is available in Standard and Premium and is set in the firewall policy for firewalls managed by a policy. To get consistent resolution, the clients must use the firewall as their DNS server: set the virtual network DNS servers to the firewall's private IP address, then restart the VMs so that they pick up the change.
    fr: |
      Les FQDN dans les règles de réseau exigent le proxy DNS, disponible en Standard et en Premium et défini dans la stratégie de pare-feu pour les pare-feu gérés par une stratégie. Pour une résolution cohérente, les clients doivent utiliser le pare-feu comme serveur DNS : définissez l'adresse IP privée du pare-feu comme serveur DNS des réseaux virtuels, puis redémarrez les machines virtuelles pour qu'elles prennent en compte le changement.
  options:
    b: { en: "Application rules filter HTTP, HTTPS and Azure SQL traffic; SSH needs a network rule.", fr: "Les règles d'application filtrent le trafic HTTP, HTTPS et Azure SQL ; SSH exige une règle de réseau." }
    d: { en: "Network-level FQDN filtering and the DNS proxy are already available in Standard.", fr: "Le filtrage FQDN au niveau réseau et le proxy DNS sont déjà disponibles en Standard." }
references:
  - title: Azure Firewall DNS settings
    url: https://learn.microsoft.com/en-us/azure/firewall/dns-settings
  - title: Azure Firewall features by SKU
    url: https://learn.microsoft.com/en-us/azure/firewall/features-by-sku
