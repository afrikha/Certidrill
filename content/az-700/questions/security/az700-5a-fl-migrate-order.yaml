id: az700-5a-fl-migrate-order
objective: "5.1.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A virtual network named **VNet1** has one subnet associated with a network security group named **NSG1**. An NSG flow log named **fl-nsg1** records the flows of NSG1, and traffic analytics is enabled on fl-nsg1. The Microsoft.Insights resource provider is registered.

    You need to move the logging of VNet1 to virtual network flow logs, with traffic analytics. The solution must avoid duplicate flow records and keep the existing log data.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un réseau virtuel nommé **VNet1** possède un sous-réseau associé à un groupe de sécurité réseau nommé **NSG1**. Un journal de flux NSG nommé **fl-nsg1** enregistre les flux de NSG1, et l'analyse du trafic est activée sur fl-nsg1. Le fournisseur de ressources Microsoft.Insights est inscrit.

    Vous devez faire passer la journalisation de VNet1 aux journaux de flux de réseau virtuel, avec l'analyse du trafic. La solution doit éviter les enregistrements de flux en double et conserver les données de journal existantes.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: ta, text: { en: "Disable traffic analytics on fl-nsg1.", fr: "Désactiver l'analyse du trafic sur fl-nsg1." } }
    - { id: dis, text: { en: "Disable fl-nsg1.", fr: "Désactiver fl-nsg1." } }
    - { id: create, text: { en: "Create a flow log of type Virtual network that targets VNet1, with traffic analytics enabled.", fr: "Créer un journal de flux de type Réseau virtuel qui cible VNet1, avec l'analyse du trafic activée." } }
    - { id: reg, text: { en: "Register the Microsoft.Insights resource provider.", fr: "Inscrire le fournisseur de ressources Microsoft.Insights." } }
    - { id: delst, text: { en: "Delete the storage account that contains the logs of fl-nsg1.", fr: "Supprimer le compte de stockage qui contient les journaux de fl-nsg1." } }
    - { id: newnsg, text: { en: "Create a new NSG flow log for NSG1 with version 2.", fr: "Créer un nouveau journal de flux NSG version 2 pour NSG1." } }
answer:
  sequence: [ ta, dis, create ]
explanation:
  correct:
    en: |
      When traffic analytics is enabled on a flow log, you must disable it before you disable the flow log. Disable the NSG flow log before enabling the virtual network flow log on the same workloads, to avoid duplicate records and extra cost. Disabling keeps the existing log data in storage.
    fr: |
      Quand l'analyse du trafic est activée sur un journal de flux, vous devez la désactiver avant de désactiver le journal de flux. Désactivez le journal de flux NSG avant d'activer le journal de flux de réseau virtuel sur les mêmes charges de travail, pour éviter les doublons et les coûts supplémentaires. La désactivation conserve les données de journal existantes dans le stockage.
  options:
    reg: { en: "The provider is already registered.", fr: "Le fournisseur est déjà inscrit." }
    delst: { en: "The existing log data must be kept.", fr: "Les données de journal existantes doivent être conservées." }
    newnsg: { en: "NSG flow logs no longer accept new creations and retire on September 30, 2027.", fr: "Les journaux de flux NSG n'acceptent plus de nouvelles créations et sont mis hors service le 30 septembre 2027." }
references:
  - title: Create, change, enable, disable, or delete virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-manage
  - title: Virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
