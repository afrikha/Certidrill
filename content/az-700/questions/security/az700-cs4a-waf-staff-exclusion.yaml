id: az700-cs4a-waf-staff-exclusion
objective: "5.3.7"
type: single
caseStudy: az700-cs4a-coho-resorts
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the web requirement for the liftSession cookie. The solution must minimize administrative effort. What should you do?
  fr: |
    Vous devez respecter l'exigence web relative au cookie liftSession. La solution doit réduire au minimum l'effort d'administration. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add an exclusion for the liftSession cookie to WAFP-Global", fr: "Ajouter à WAFP-Global une exclusion pour le cookie liftSession" } }
    - { id: b, text: { en: "Create a WAF policy that excludes the liftSession cookie, and associate it with AGW-Coho", fr: "Créer une stratégie WAF qui exclut le cookie liftSession, et l'associer à AGW-Coho" } }
    - { id: c, text: { en: "Create a WAF policy that excludes the liftSession cookie, and associate it with lst-staff", fr: "Créer une stratégie WAF qui exclut le cookie liftSession, et l'associer à lst-staff" } }
    - { id: d, text: { en: "Change the mode of WAFP-Global to Detection, and keep it associated with AGW-Coho", fr: "Passer WAFP-Global en mode Détection, et la laisser associée à AGW-Coho" } }
answer: { optionId: c }
explanation:
  correct:
    en: On Application Gateway WAF_v2, a WAF policy can be associated with the gateway, with a listener or with a path-based rule, and the most specific policy wins. A policy associated with lst-staff overrides WAFP-Global for staff.cohoresorts.com only; create it with the same managed rule set and add the cookie exclusion. lst-booking has no policy of its own, so it keeps WAFP-Global.
    fr: |
      Sur Application Gateway WAF_v2, une stratégie WAF peut être associée à la passerelle, à un écouteur ou à une règle basée sur le chemin, et la stratégie la plus spécifique l'emporte. Une stratégie associée à lst-staff remplace WAFP-Global pour staff.cohoresorts.com uniquement ; créez-la avec le même ensemble de règles managé et ajoutez l'exclusion du cookie. lst-booking n'a pas de stratégie propre : il conserve WAFP-Global.
  options:
    a: { en: "WAFP-Global applies to every listener that has no policy of its own, so the exclusion would also apply to booking.cohoresorts.com.", fr: "WAFP-Global s'applique à chaque écouteur qui n'a pas de stratégie propre : l'exclusion s'appliquerait donc aussi à booking.cohoresorts.com." }
    b: { en: "A policy associated with the gateway replaces WAFP-Global as the global policy, so the exclusion would also apply to booking.cohoresorts.com.", fr: "Une stratégie associée à la passerelle remplace WAFP-Global comme stratégie globale : l'exclusion s'appliquerait donc aussi à booking.cohoresorts.com." }
    d: { en: "Detection mode only logs matches for both sites, so booking.cohoresorts.com would lose its protection against web attacks.", fr: "Le mode Détection ne fait que journaliser les correspondances pour les deux sites : booking.cohoresorts.com perdrait sa protection contre les attaques web." }
references:
  - title: Configure per-site WAF policies using Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/per-site-policies
