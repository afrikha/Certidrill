id: az700-5a-rule-service-tags
objective: "5.1.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are configuring inbound rules in the network security groups of several workloads.

    Which service tag should you use as the source of each rule? To answer, drag the appropriate service tags to the correct requirements. Each service tag may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez des règles entrantes dans les groupes de sécurité réseau de plusieurs charges de travail.

    Quelle étiquette de service devez-vous utiliser comme source de chaque règle ? Pour répondre, faites glisser les étiquettes de service appropriées vers les exigences correspondantes. Chaque étiquette de service peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: alb, text: AzureLoadBalancer }
    - { id: afd, text: AzureFrontDoor.Backend }
    - { id: gwm, text: GatewayManager }
    - { id: vnet, text: VirtualNetwork }
    - { id: inet, text: Internet }
    - { id: cloud, text: AzureCloud }
  targets:
    - id: t1
      text: { en: "Allow the health probes of a Standard load balancer to reach the back-end virtual machines", fr: "Autoriser les sondes d'intégrité d'un équilibreur de charge Standard à atteindre les machines virtuelles du pool principal" }
    - id: t2
      text: { en: "Allow only Azure Front Door to reach the origin web servers", fr: "Autoriser uniquement Azure Front Door à atteindre les serveurs web d'origine" }
    - id: t3
      text: { en: "Allow the infrastructure management traffic that an Application Gateway v2 subnet requires", fr: "Autoriser le trafic de gestion de l'infrastructure qu'exige un sous-réseau Application Gateway v2" }
    - id: t4
      text: { en: "Allow traffic from peered virtual networks and from on-premises networks connected through a site-to-site VPN", fr: "Autoriser le trafic des réseaux virtuels reliés par peering et des réseaux locaux connectés par un VPN de site à site" }
answer:
  mapping: { t1: alb, t2: afd, t3: gwm, t4: vnet }
explanation:
  correct:
    en: |
      AzureLoadBalancer represents the Azure infrastructure health probes, not client traffic. AzureFrontDoor.Backend contains the addresses Front Door uses to reach origins. GatewayManager carries the management traffic of Application Gateway and VPN Gateway. VirtualNetwork includes the virtual network, peered virtual networks and on-premises ranges connected through a gateway.
    fr: |
      AzureLoadBalancer représente les sondes d'intégrité de l'infrastructure Azure, pas le trafic des clients. AzureFrontDoor.Backend contient les adresses qu'utilise Front Door pour atteindre les origines. GatewayManager transporte le trafic de gestion d'Application Gateway et de VPN Gateway. VirtualNetwork inclut le réseau virtuel, les réseaux virtuels reliés par peering et les plages locales connectées par une passerelle.
  options:
    inet: { en: "Internet would allow any public source, not only Front Door or the platform.", fr: "Internet autoriserait n'importe quelle source publique, pas seulement Front Door ou la plateforme." }
    cloud: { en: "AzureCloud covers all Azure public addresses, including other customers' resources.", fr: "AzureCloud couvre toutes les adresses publiques Azure, y compris les ressources d'autres clients." }
references:
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
