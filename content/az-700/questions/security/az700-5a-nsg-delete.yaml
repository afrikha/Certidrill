id: az700-5a-nsg-delete
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A network security group named **NSG-Old** is associated with a subnet named **Subnet2** and with the network interface of a virtual machine named **VM5**. You try to delete NSG-Old, and the operation fails.

    You need to delete NSG-Old.

    What should you do first?
  fr: |
    Un groupe de sécurité réseau nommé **NSG-Old** est associé à un sous-réseau nommé **Subnet2** et à l'interface réseau d'une machine virtuelle nommée **VM5**. Vous essayez de supprimer NSG-Old et l'opération échoue.

    Vous devez supprimer NSG-Old.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Delete every custom security rule in NSG-Old.", fr: "Supprimer toutes les règles de sécurité personnalisées de NSG-Old." } }
    - { id: b, text: { en: "Stop and deallocate VM5 and the other VMs of Subnet2.", fr: "Arrêter et libérer VM5 et les autres machines virtuelles de Subnet2." } }
    - { id: c, text: { en: "Dissociate NSG-Old from Subnet2 and from VM5's interface.", fr: "Dissocier NSG-Old de Subnet2 et de l'interface de VM5." } }
    - { id: d, text: { en: "Disable the virtual network flow log that targets Subnet2.", fr: "Désactiver le journal de flux de réseau virtuel qui cible Subnet2." } }
answer: { optionId: c }
explanation:
  correct:
    en: A network security group can't be deleted while it's associated with a subnet or a network interface. Dissociate it from every subnet and interface (select None on the interface, or Dissociate on the NSG's Subnets page), then delete it.
    fr: Un groupe de sécurité réseau ne peut pas être supprimé tant qu'il est associé à un sous-réseau ou à une interface réseau. Dissociez-le de chaque sous-réseau et de chaque interface (sélectionnez None sur l'interface, ou Dissocier sur la page Sous-réseaux du NSG), puis supprimez-le.
  options:
    a: { en: "The rules don't block deletion; the associations do.", fr: "Les règles n'empêchent pas la suppression ; ce sont les associations qui l'empêchent." }
    b: { en: "Stopping VMs doesn't remove the association between the NSG and the subnet or interface.", fr: "Arrêter les machines virtuelles ne supprime pas l'association entre le NSG et le sous-réseau ou l'interface." }
    d: { en: "A flow log doesn't prevent the deletion of a network security group.", fr: "Un journal de flux n'empêche pas la suppression d'un groupe de sécurité réseau." }
references:
  - title: Create, Change, or Delete Azure Network Security Groups
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-network-security-group
