id: az700-5b-waf-afd-remoteaddr
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso publishes a partner portal through an Azure Front Door Premium profile. All the users of a partner named Fabrikam reach the portal through Fabrikam's outbound proxy, which has the public IP address 198.51.100.7 and adds the `X-Forwarded-For` header with the original client address.

    A Fabrikam workstation that uses the public address 203.0.113.25 is compromised. You need to block the requests from this workstation without blocking the other Fabrikam users.

    In the WAF policy, you create a custom rule that uses the IPMatch operator with the value 203.0.113.25.

    Which match variable should you use?
  fr: |
    Contoso publie un portail partenaires par un profil Azure Front Door Premium. Tous les utilisateurs d'un partenaire nommé Fabrikam accèdent au portail par le proxy sortant de Fabrikam, qui a l'adresse IP publique 198.51.100.7 et ajoute l'en-tête `X-Forwarded-For` avec l'adresse d'origine du client.

    Un poste de travail Fabrikam qui utilise l'adresse publique 203.0.113.25 est compromis. Vous devez bloquer les requêtes de ce poste sans bloquer les autres utilisateurs de Fabrikam.

    Dans la stratégie WAF, vous créez une règle personnalisée qui utilise l'opérateur IPMatch avec la valeur 203.0.113.25.

    Quelle variable de correspondance devez-vous utiliser ?
body:
  options:
    - { id: a, text: SocketAddr }
    - { id: b, text: RemoteAddr }
    - { id: c, text: RequestUri }
    - { id: d, text: PostArgs }
answer: { optionId: b }
explanation:
  correct:
    en: |
      On Front Door, `RemoteAddr` is the original client IP address, usually taken from the `X-Forwarded-For` header, while `SocketAddr` is the address that opens the connection to the edge, here the proxy. Matching `RemoteAddr` targets the compromised workstation only.
    fr: |
      Sur Front Door, `RemoteAddr` est l'adresse IP d'origine du client, généralement tirée de l'en-tête `X-Forwarded-For`, tandis que `SocketAddr` est l'adresse qui ouvre la connexion vers la périphérie, ici le proxy. Une correspondance sur `RemoteAddr` ne cible que le poste compromis.
  options:
    a: { en: "SocketAddr is the proxy address 198.51.100.7 for every Fabrikam user, so 203.0.113.25 would never match it.", fr: "SocketAddr est l'adresse du proxy 198.51.100.7 pour tous les utilisateurs de Fabrikam : 203.0.113.25 n'y correspondrait jamais." }
    c: { en: "RequestUri contains the requested URI, not the client address.", fr: "RequestUri contient l'URI demandé, pas l'adresse du client." }
    d: { en: "PostArgs contains the arguments of the POST body, not the client address.", fr: "PostArgs contient les arguments du corps POST, pas l'adresse du client." }
references:
