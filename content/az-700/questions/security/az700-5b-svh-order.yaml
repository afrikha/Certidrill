id: az700-5b-svh-order
objective: "5.2.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Standard Azure Virtual WAN named **vwan1** with a virtual hub named **hub-neu**. hub-neu has no security provider. Two spoke virtual networks, **Spoke-A** and **Spoke-B**, are already connected to hub-neu. A firewall policy named **FWP-NEU** exists.

    You need to ensure that the traffic between Spoke-A and Spoke-B and their internet-bound traffic are filtered by an Azure Firewall in hub-neu by using FWP-NEU. Traffic must not be routed through the firewall before FWP-NEU applies to it.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose d'un Azure Virtual WAN Standard nommé **vwan1** avec un hub virtuel nommé **hub-neu**. hub-neu n'a aucun fournisseur de sécurité. Deux réseaux virtuels spokes, **Spoke-A** et **Spoke-B**, sont déjà connectés à hub-neu. Une stratégie de pare-feu nommée **FWP-NEU** existe.

    Vous devez vous assurer que le trafic entre Spoke-A et Spoke-B et leur trafic à destination d'Internet sont filtrés par un Pare-feu Azure dans hub-neu avec FWP-NEU. Le trafic ne doit pas être routé par le pare-feu avant que FWP-NEU ne s'y applique.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: conv, text: { en: "In Firewall Manager, convert hub-neu to a secured virtual hub that has Azure Firewall enabled.", fr: "Dans Firewall Manager, convertir hub-neu en hub virtuel sécurisé avec le Pare-feu Azure activé." } }
    - { id: assoc, text: { en: "Associate FWP-NEU with hub-neu by using **Manage associations**.", fr: "Associer FWP-NEU à hub-neu avec **Manage associations**." } }
    - { id: sec, text: { en: "In the **Security configuration** of hub-neu, send the internet traffic and the private traffic via Azure Firewall.", fr: "Dans la **Security configuration** de hub-neu, envoyer le trafic Internet et le trafic privé via le Pare-feu Azure." } }
    - { id: udr, text: { en: "Associate the subnets of Spoke-A and Spoke-B with a route table that sends 0.0.0.0/0 to the firewall.", fr: "Associer les sous-réseaux de Spoke-A et Spoke-B à une table de routage qui envoie 0.0.0.0/0 vers le pare-feu." } }
    - { id: subnet, text: { en: "Create a subnet named AzureFirewallSubnet in hub-neu.", fr: "Créer un sous-réseau nommé AzureFirewallSubnet dans hub-neu." } }
    - { id: peer, text: { en: "Peer Spoke-A with Spoke-B.", fr: "Relier Spoke-A à Spoke-B par un peering." } }
answer:
  sequence: [ conv, assoc, sec ]
explanation:
  correct:
    en: |
      A secured virtual hub is created by converting a Virtual WAN hub and enabling Azure Firewall in it. You then associate the firewall policy with the hub, and finally use the hub's security configuration (routing intent) to send internet and private traffic through the firewall. The hub programs the routes itself, so no user-defined routes are needed on the spokes.
    fr: |
      Un hub virtuel sécurisé se crée en convertissant un hub Virtual WAN et en y activant le Pare-feu Azure. Vous associez ensuite la stratégie de pare-feu au hub, puis vous utilisez la configuration de sécurité du hub (intention de routage) pour envoyer le trafic Internet et le trafic privé par le pare-feu. Le hub programme lui-même les routes : aucun itinéraire défini par l'utilisateur n'est nécessaire sur les spokes.
  options:
    udr: { en: "Firewall Manager routes traffic to the secured hub without user-defined routes on the spokes.", fr: "Firewall Manager route le trafic vers le hub sécurisé sans itinéraires définis par l'utilisateur sur les spokes." }
    subnet: { en: "A Virtual WAN hub is Microsoft-managed; you don't create subnets in it.", fr: "Un hub Virtual WAN est géré par Microsoft ; vous n'y créez pas de sous-réseaux." }
    peer: { en: "A direct peering would let the spokes talk to each other without crossing the hub firewall.", fr: "Un peering direct permettrait aux spokes de communiquer sans traverser le pare-feu du hub." }
references:
  - title: "Tutorial: Secure your virtual hub using Azure Firewall Manager"
    url: https://learn.microsoft.com/en-us/azure/firewall-manager/secure-cloud-network
  - title: Azure Firewall Manager deployment overview
    url: https://learn.microsoft.com/en-us/azure/firewall-manager/deployment-overview
