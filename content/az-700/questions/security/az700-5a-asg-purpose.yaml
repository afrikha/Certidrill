id: az700-5a-asg-purpose
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a subnet named **Subnet-Front** that hosts about 30 web servers and several other virtual machines. A network security group named **NSG-Front** is associated with Subnet-Front. Web servers are added and removed every week, and their private IP addresses change.

    You need to add a rule to NSG-Front that allows TCP 443 from the internet to the web servers only. The rule must keep working when web servers are added or removed, without editing the rule. The solution must minimize administrative effort.

    What should you use as the destination of the rule?
  fr: |
    Contoso possède un sous-réseau nommé **Subnet-Front** qui héberge une trentaine de serveurs web et plusieurs autres machines virtuelles. Un groupe de sécurité réseau nommé **NSG-Front** est associé à Subnet-Front. Des serveurs web sont ajoutés et retirés chaque semaine, et leurs adresses IP privées changent.

    Vous devez ajouter à NSG-Front une règle qui autorise TCP 443 depuis Internet vers les serveurs web uniquement. La règle doit continuer de fonctionner quand des serveurs web sont ajoutés ou retirés, sans modifier la règle. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous utiliser comme destination de la règle ?
body:
  options:
    - { id: a, text: { en: "An application security group that contains the web servers' network interfaces", fr: "Un groupe de sécurité d'application qui contient les interfaces réseau des serveurs web" } }
    - { id: b, text: { en: "An IP Group that lists the private IP addresses of the web servers", fr: "Un groupe IP qui liste les adresses IP privées des serveurs web" } }
    - { id: c, text: { en: "The VirtualNetwork service tag, which covers the address space of the subnet", fr: "L'étiquette de service VirtualNetwork, qui couvre l'espace d'adressage du sous-réseau" } }
    - { id: d, text: { en: "A network group of Azure Virtual Network Manager that contains Subnet-Front", fr: "Un groupe réseau d'Azure Virtual Network Manager qui contient Subnet-Front" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An application security group (ASG) groups network interface IP configurations by role. An NSG rule that uses the ASG as destination applies only to its members, so a new web server is covered as soon as its interface joins the ASG, without changing the rule or tracking IP addresses.
    fr: |
      Un groupe de sécurité d'application (ASG) regroupe des configurations IP d'interfaces réseau par rôle. Une règle NSG qui utilise l'ASG comme destination ne s'applique qu'à ses membres : un nouveau serveur web est couvert dès que son interface rejoint l'ASG, sans modifier la règle ni suivre les adresses IP.
  options:
    b: { en: "IP Groups are an Azure Firewall feature, not an NSG rule target, and the list would need updating.", fr: "Les groupes IP sont une fonctionnalité du Pare-feu Azure, pas une cible de règle NSG, et la liste devrait être mise à jour." }
    c: { en: "VirtualNetwork would also cover the other virtual machines of the subnet and the whole virtual network.", fr: "VirtualNetwork couvrirait aussi les autres machines virtuelles du sous-réseau et tout le réseau virtuel." }
    d: { en: "Network groups contain virtual networks and target Virtual Network Manager configurations, not NSG rules.", fr: "Les groupes réseau contiennent des réseaux virtuels et servent de cible aux configurations Virtual Network Manager, pas aux règles NSG." }
references:
  - title: Application security groups
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
