id: az700-5a-nsg-default-peered
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have the following virtual networks.

    | Name | Address space | Peered with |
    | --- | --- | --- |
    | VNet1 | 10.1.0.0/16 | VNet2 |
    | VNet2 | 10.2.0.0/16 | VNet1 |

    VNet1 contains a subnet named **Subnet1** that hosts a virtual machine named **VM1** (10.1.1.4). VM1 has a Standard SKU public IP address. VNet2 hosts a virtual machine named **VM2** (10.2.1.4).

    You create a network security group named **NSG1** that contains no custom security rules, and you associate NSG1 with Subnet1. No other network security group applies to VM1.

    Which connection to VM1 is allowed?
  fr: |
    Vous disposez des réseaux virtuels suivants.

    | Nom | Espace d'adressage | Peering avec |
    | --- | --- | --- |
    | VNet1 | 10.1.0.0/16 | VNet2 |
    | VNet2 | 10.2.0.0/16 | VNet1 |

    VNet1 contient un sous-réseau nommé **Subnet1** qui héberge une machine virtuelle nommée **VM1** (10.1.1.4). VM1 possède une adresse IP publique de référence SKU Standard. VNet2 héberge une machine virtuelle nommée **VM2** (10.2.1.4).

    Vous créez un groupe de sécurité réseau nommé **NSG1** qui ne contient aucune règle de sécurité personnalisée, et vous l'associez à Subnet1. Aucun autre groupe de sécurité réseau ne s'applique à VM1.

    Quelle connexion vers VM1 est autorisée ?
body:
  options:
    - { id: a, text: { en: "TCP 3389 from a computer on the internet to the public IP address of VM1", fr: "TCP 3389 depuis un ordinateur sur Internet vers l'adresse IP publique de VM1" } }
    - { id: b, text: { en: "TCP 1433 from VM2 to the private IP address of VM1", fr: "TCP 1433 depuis VM2 vers l'adresse IP privée de VM1" } }
    - { id: c, text: { en: "TCP 443 from a computer on the internet to the public IP address of VM1", fr: "TCP 443 depuis un ordinateur sur Internet vers l'adresse IP publique de VM1" } }
    - { id: d, text: { en: "TCP 22 from an Azure virtual machine in a non-peered network to the public IP address of VM1", fr: "TCP 22 depuis une machine virtuelle Azure d'un réseau sans peering vers l'adresse IP publique de VM1" } }
answer: { optionId: b }
explanation:
  correct:
    en: A new NSG contains only the default rules. AllowVNetInBound (priority 65000) allows traffic whose source and destination belong to the VirtualNetwork service tag, which includes the address spaces of peered virtual networks, so VM2 can reach VM1 on any port. All other inbound traffic falls through to DenyAllInbound (65500).
    fr: Un nouveau NSG ne contient que les règles par défaut. AllowVNetInBound (priorité 65000) autorise le trafic dont la source et la destination appartiennent à l'étiquette de service VirtualNetwork, qui inclut les espaces d'adressage des réseaux virtuels reliés par peering ; VM2 peut donc joindre VM1 sur n'importe quel port. Tout autre trafic entrant aboutit à DenyAllInbound (65500).
  options:
    a: { en: "Traffic from the internet isn't in the VirtualNetwork tag, so DenyAllInbound blocks it.", fr: "Le trafic issu d'Internet ne fait pas partie de l'étiquette VirtualNetwork : DenyAllInbound le bloque." }
    c: { en: "No custom rule allows HTTPS from the internet; DenyAllInbound blocks it.", fr: "Aucune règle personnalisée n'autorise HTTPS depuis Internet ; DenyAllInbound le bloque." }
    d: { en: "A virtual machine in a non-peered network reaches the public IP address from outside the VirtualNetwork tag, so DenyAllInbound blocks it.", fr: "Une machine virtuelle d'un réseau sans peering arrive sur l'adresse IP publique depuis l'extérieur de l'étiquette VirtualNetwork : DenyAllInbound la bloque." }
references:
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
