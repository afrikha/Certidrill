id: az700-5a-assoc-cli
objective: "5.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You need to associate a network security group named **nsg-web** with a subnet named **snet-web** of a virtual network named **VNet-App**. You also need to associate a network security group named **nsg-mgmt** with a network interface named **vm-jump-nic**.

    How should you complete the Azure CLI commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez associer un groupe de sécurité réseau nommé **nsg-web** à un sous-réseau nommé **snet-web** d'un réseau virtuel nommé **VNet-App**. Vous devez aussi associer un groupe de sécurité réseau nommé **nsg-mgmt** à une interface réseau nommée **vm-jump-nic**.

    Comment devez-vous compléter les commandes Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network [[sub]] \
      --resource-group RG-Net --vnet-name VNet-App --name snet-web \
      --network-security-group nsg-web

    az network [[nic]] \
      --resource-group RG-Net --name vm-jump-nic \
      [[param]] nsg-mgmt
  slots:
    - id: sub
      options:
        - { id: subupd, text: vnet subnet update }
        - { id: vnetupd, text: vnet update }
        - { id: nsgupd, text: nsg update }
    - id: nic
      options:
        - { id: nicupd, text: nic update }
        - { id: ipcfg, text: nic ip-config update }
        - { id: asgupd, text: asg update }
    - id: param
      options:
        - { id: nsgp, text: --network-security-group }
        - { id: nsgname, text: --nsg-name }
        - { id: asgs, text: --asgs }
answer:
  values: { sub: subupd, nic: nicupd, param: nsgp }
explanation:
  correct:
    en: |
      The NSG is a property of the subnet, so you set it with `az network vnet subnet update --network-security-group`. For a network interface, `az network nic update --network-security-group` sets the NSG of the interface.
    fr: |
      Le NSG est une propriété du sous-réseau : vous le définissez avec `az network vnet subnet update --network-security-group`. Pour une interface réseau, `az network nic update --network-security-group` définit le NSG de l'interface.
  options:
    vnetupd: { en: "The association is set on the subnet, not on the virtual network resource.", fr: "L'association se définit sur le sous-réseau, pas sur la ressource de réseau virtuel." }
    nsgupd: { en: "az network nsg update changes the NSG itself; the association is a property of the subnet or interface.", fr: "az network nsg update modifie le NSG lui-même ; l'association est une propriété du sous-réseau ou de l'interface." }
    ipcfg: { en: "IP configurations carry application security group memberships, not the interface's NSG.", fr: "Les configurations IP portent les appartenances aux groupes de sécurité d'application, pas le NSG de l'interface." }
    asgupd: { en: "az network asg update modifies an application security group.", fr: "az network asg update modifie un groupe de sécurité d'application." }
    nsgname: { en: "--nsg-name is used by az network nsg rule commands to name the parent NSG.", fr: "--nsg-name sert aux commandes az network nsg rule pour désigner le NSG parent." }
    asgs: { en: "--asgs assigns application security groups, not a network security group.", fr: "--asgs attribue des groupes de sécurité d'application, pas un groupe de sécurité réseau." }
references:
  - title: Create, Change, or Delete Azure Network Security Groups
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-network-security-group
  - title: az network nic
    url: https://learn.microsoft.com/en-us/cli/azure/network/nic?view=azure-cli-latest
