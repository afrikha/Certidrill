id: az700-5b-waf-assoc-agw-dragdrop
objective: "5.3.7"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    An Azure Application Gateway WAF_v2 named **AGW-Web** has the following configuration:

    | Element | Configuration | Associated WAF policy |
    | --- | --- | --- |
    | AGW-Web | Gateway | WAFP-Global |
    | lst-shop | Multi-site listener for shop.contoso.com, with a path-based rule | WAFP-Shop |
    | Path rule /checkout/* | Path of the path-based rule of lst-shop | WAFP-Checkout |
    | Path rule /images/* | Path of the path-based rule of lst-shop | None |
    | lst-blog | Multi-site listener for blog.contoso.com, with a basic rule | None |

    Which WAF policy processes each request? To answer, drag the appropriate policies to the correct requests. Each policy may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une passerelle Azure Application Gateway WAF_v2 nommée **AGW-Web** a la configuration suivante :

    | Élément | Configuration | Stratégie WAF associée |
    | --- | --- | --- |
    | AGW-Web | Passerelle | WAFP-Global |
    | lst-shop | Écouteur multisite pour shop.contoso.com, avec une règle basée sur le chemin | WAFP-Shop |
    | Règle de chemin /checkout/* | Chemin de la règle basée sur le chemin de lst-shop | WAFP-Checkout |
    | Règle de chemin /images/* | Chemin de la règle basée sur le chemin de lst-shop | Aucune |
    | lst-blog | Écouteur multisite pour blog.contoso.com, avec une règle de base | Aucune |

    Quelle stratégie WAF traite chaque requête ? Pour répondre, faites glisser les stratégies appropriées vers les requêtes correspondantes. Chaque stratégie peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: global, text: WAFP-Global }
    - { id: shop, text: WAFP-Shop }
    - { id: checkout, text: WAFP-Checkout }
    - { id: none, text: { en: "No WAF policy", fr: "Aucune stratégie WAF" } }
  targets:
    - { id: t1, text: "https://shop.contoso.com/checkout/pay" }
    - { id: t2, text: "https://shop.contoso.com/images/logo.png" }
    - { id: t3, text: "https://blog.contoso.com/posts/1" }
answer:
  mapping: { t1: checkout, t2: shop, t3: global }
explanation:
  correct:
    en: |
      The most specific associated policy applies: a per-URI policy overrides the per-site policy, which overrides the global policy. /checkout/* has its own policy (WAFP-Checkout). /images/* has none, so the per-site policy of lst-shop (WAFP-Shop) applies. lst-blog has no policy of its own, so the gateway's global policy (WAFP-Global) applies; on a WAF_v2 gateway with a global policy, no request is left without a policy.
    fr: |
      La stratégie associée la plus spécifique s'applique : une stratégie par URI prime sur la stratégie par site, qui prime sur la stratégie globale. /checkout/* a sa propre stratégie (WAFP-Checkout). /images/* n'en a pas : la stratégie par site de lst-shop (WAFP-Shop) s'applique. lst-blog n'a pas de stratégie propre : la stratégie globale de la passerelle (WAFP-Global) s'applique ; sur une passerelle WAF_v2 dotée d'une stratégie globale, aucune requête ne reste sans stratégie.
references:
  - title: Azure Web Application Firewall (WAF) policy overview
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/policy-overview
