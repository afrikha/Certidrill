id: az700-5b-fwm-hubvnet-order
objective: "5.2.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a virtual network named **VNet-Hub** that is peered with three spoke virtual networks. VNet-Hub contains a subnet named AzureFirewallSubnet and no firewall. Northwind doesn't use Azure Virtual WAN.

    You need to use Azure Firewall Manager to deploy an Azure Firewall in VNet-Hub that is managed by a central firewall policy, and to send the traffic of the spoke subnets to it.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders dispose d'un réseau virtuel nommé **VNet-Hub** relié par peering à trois réseaux virtuels spokes. VNet-Hub contient un sous-réseau nommé AzureFirewallSubnet et aucun pare-feu. Northwind n'utilise pas Azure Virtual WAN.

    Vous devez utiliser Azure Firewall Manager pour déployer dans VNet-Hub un Pare-feu Azure géré par une stratégie de pare-feu centrale, et pour lui envoyer le trafic des sous-réseaux spokes.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: pol, text: { en: "Create a firewall policy in Firewall Manager.", fr: "Créer une stratégie de pare-feu dans Firewall Manager." } }
    - { id: conv, text: { en: "Convert VNet-Hub to a hub virtual network, select Azure Firewall as the security provider and associate the policy.", fr: "Convertir VNet-Hub en réseau virtuel hub, sélectionner le Pare-feu Azure comme fournisseur de sécurité et associer la stratégie." } }
    - { id: udr, text: { en: "Configure user-defined routes on the spoke subnets that send traffic to the private IP address of the firewall.", fr: "Configurer sur les sous-réseaux spokes des itinéraires définis par l'utilisateur qui envoient le trafic vers l'adresse IP privée du pare-feu." } }
    - { id: svh, text: { en: "Convert VNet-Hub to a secured virtual hub.", fr: "Convertir VNet-Hub en hub virtuel sécurisé." } }
    - { id: ri, text: { en: "Enable routing intent with a private traffic policy on VNet-Hub.", fr: "Activer l'intention de routage avec une stratégie de trafic privé sur VNet-Hub." } }
    - { id: conn, text: { en: "Replace the peerings with virtual network connections to VNet-Hub.", fr: "Remplacer les peerings par des connexions de réseau virtuel à VNet-Hub." } }
answer:
  sequence: [ pol, conv, udr ]
explanation:
  correct:
    en: |
      In the hub virtual network architecture, you first create the firewall policy, then select Azure Firewall as the security provider and associate the policy, either while you create a hub virtual network or by converting an existing virtual network. Firewall Manager doesn't manage routing for a hub virtual network, so you finish with user-defined routes on the spokes.
    fr: |
      Dans l'architecture de réseau virtuel hub, vous créez d'abord la stratégie de pare-feu, puis vous sélectionnez le Pare-feu Azure comme fournisseur de sécurité et associez la stratégie, soit en créant un réseau virtuel hub, soit en convertissant un réseau virtuel existant. Firewall Manager ne gère pas le routage d'un réseau virtuel hub : vous terminez par des itinéraires définis par l'utilisateur sur les spokes.
  options:
    svh: { en: "A secured virtual hub is a Virtual WAN hub; a regular virtual network can't become one.", fr: "Un hub virtuel sécurisé est un hub Virtual WAN ; un réseau virtuel ordinaire ne peut pas le devenir." }
    ri: { en: "Routing intent is a Virtual WAN hub feature, not a virtual network setting.", fr: "L'intention de routage est une fonctionnalité des hubs Virtual WAN, pas un paramètre de réseau virtuel." }
    conn: { en: "Virtual network connections link virtual networks to a Virtual WAN hub; a hub virtual network keeps its peerings.", fr: "Les connexions de réseau virtuel relient des réseaux virtuels à un hub Virtual WAN ; un réseau virtuel hub conserve ses peerings." }
references:
  - title: Azure Firewall Manager deployment overview
    url: https://learn.microsoft.com/en-us/azure/firewall-manager/deployment-overview
  - title: What is Azure Firewall Manager?
    url: https://learn.microsoft.com/en-us/azure/firewall-manager/overview
