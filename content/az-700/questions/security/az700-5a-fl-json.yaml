id: az700-5a-fl-json
objective: "5.1.7"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    A virtual network flow log contains the following extract for the network interface of a virtual machine that has the private IP address 10.2.1.5. The `aclID` refers to a network security group named **NSG-Web**.

    ```json
    "flows": [
      {
        "aclID": "<resource ID of NSG-Web>",
        "flowGroups": [
          {
            "rule": "UserRule_Allow-HTTPS-Internet",
            "flowTuples": [
              "1763384400,198.51.100.7,10.2.1.5,52010,443,6,I,B,NX,0,0,0,0",
              "1763384460,198.51.100.7,10.2.1.5,52010,443,6,I,C,NX,10,1300,12,15000",
              "1763384520,198.51.100.7,10.2.1.5,52010,443,6,I,E,NX,4,520,10,9750"
            ]
          },
          {
            "rule": "DefaultRule_DenyAllInBound",
            "flowTuples": [
              "1763384430,203.0.113.80,10.2.1.5,61022,22,6,I,D,NX,0,0,0,0"
            ]
          }
        ]
      }
    ]
    ```

    Use the drop-down menus to complete the statements based on the extract.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un journal de flux de réseau virtuel contient l'extrait suivant pour l'interface réseau d'une machine virtuelle d'adresse IP privée 10.2.1.5. L'`aclID` désigne un groupe de sécurité réseau nommé **NSG-Web**.

    ```json
    "flows": [
      {
        "aclID": "<resource ID of NSG-Web>",
        "flowGroups": [
          {
            "rule": "UserRule_Allow-HTTPS-Internet",
            "flowTuples": [
              "1763384400,198.51.100.7,10.2.1.5,52010,443,6,I,B,NX,0,0,0,0",
              "1763384460,198.51.100.7,10.2.1.5,52010,443,6,I,C,NX,10,1300,12,15000",
              "1763384520,198.51.100.7,10.2.1.5,52010,443,6,I,E,NX,4,520,10,9750"
            ]
          },
          {
            "rule": "DefaultRule_DenyAllInBound",
            "flowTuples": [
              "1763384430,203.0.113.80,10.2.1.5,61022,22,6,I,D,NX,0,0,0,0"
            ]
          }
        ]
      }
    ]
    ```

    Utilisez les menus déroulants pour compléter les affirmations à partir de l'extrait.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The SSH connection attempt from 203.0.113.80 was blocked by [[rule]].

      Over the whole HTTPS session with 198.51.100.7, the virtual machine sent [[bytes]] bytes to the client.
    fr: |
      La tentative de connexion SSH depuis 203.0.113.80 a été bloquée par [[rule]].

      Sur l'ensemble de la session HTTPS avec 198.51.100.7, la machine virtuelle a envoyé [[bytes]] octets au client.
  slots:
    - id: rule
      options:
        - { id: deny, text: { en: "the DenyAllInBound default rule of NSG-Web", fr: "la règle par défaut DenyAllInBound de NSG-Web" } }
        - { id: user, text: { en: "the Allow-HTTPS-Internet rule of NSG-Web", fr: "la règle Allow-HTTPS-Internet de NSG-Web" } }
        - { id: avnm, text: { en: "a security admin rule of Azure Virtual Network Manager", fr: "une règle d'administration de sécurité d'Azure Virtual Network Manager" } }
    - id: bytes
      options:
        - { id: b1820, text: "1820" }
        - { id: b9750, text: "9750" }
        - { id: b15000, text: "15000" }
        - { id: b24750, text: "24750" }
answer:
  values: { rule: deny, bytes: b24750 }
explanation:
  correct:
    en: |
      The D (deny) tuple for port 22 is in the flow group whose rule is DefaultRule_DenyAllInBound, and the aclID is NSG-Web, so the NSG's default deny rule blocked it. In the HTTPS flow, the virtual machine is the destination, so what it sent is in the "bytes received" field. C and E records count traffic since the previous record of the flow: 15000 + 9750 = 24750.
    fr: |
      Le tuple D (refus) pour le port 22 se trouve dans le groupe de flux dont la règle est DefaultRule_DenyAllInBound, et l'aclID est NSG-Web : c'est donc la règle de refus par défaut du NSG qui l'a bloqué. Dans le flux HTTPS, la machine virtuelle est la destination : ce qu'elle a envoyé figure dans le champ « octets reçus ». Les enregistrements C et E comptent le trafic depuis l'enregistrement précédent du flux : 15000 + 9750 = 24750.
  options:
    user: { en: "Allow-HTTPS-Internet allowed the HTTPS flow; it isn't the group of the D tuple.", fr: "Allow-HTTPS-Internet a autorisé le flux HTTPS ; ce n'est pas le groupe du tuple D." }
    avnm: { en: "The aclID identifies NSG-Web; a security admin rule would show a Virtual Network Manager configuration.", fr: "L'aclID identifie NSG-Web ; une règle d'administration de sécurité afficherait une configuration Virtual Network Manager." }
    b1820: { en: "1820 (1300 + 520) is what the client sent to the virtual machine.", fr: "1820 (1300 + 520) correspond à ce que le client a envoyé à la machine virtuelle." }
    b9750: { en: "9750 counts only the traffic since the C record; add the counters of the C and E records.", fr: "9750 ne compte que le trafic depuis l'enregistrement C ; additionnez les compteurs des enregistrements C et E." }
    b15000: { en: "15000 counts only the traffic up to the C record; the E record adds 9750.", fr: "15000 ne compte que le trafic jusqu'à l'enregistrement C ; l'enregistrement E ajoute 9750." }
references:
  - title: Virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
