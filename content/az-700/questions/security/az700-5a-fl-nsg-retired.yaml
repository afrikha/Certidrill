id: az700-5a-fl-nsg-retired
objective: "5.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A subnet named **Subnet1** in a virtual network named **VNet1** is associated with a network security group named **NSG1**. No flow logging is configured.

    The security team asks you to start recording the IP flows that NSG1 allows and denies for the virtual machines in Subnet1, and to keep the records in a storage account.

    What should you create?
  fr: |
    Un sous-réseau nommé **Subnet1** d'un réseau virtuel nommé **VNet1** est associé à un groupe de sécurité réseau nommé **NSG1**. Aucune journalisation des flux n'est configurée.

    L'équipe de sécurité vous demande de commencer à enregistrer les flux IP que NSG1 autorise et refuse pour les machines virtuelles de Subnet1, et de conserver les enregistrements dans un compte de stockage.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An NSG flow log that targets NSG1", fr: "Un journal de flux NSG qui cible NSG1" } }
    - { id: b, text: { en: "A diagnostic setting that sends the resource logs of NSG1 to storage", fr: "Un paramètre de diagnostic qui envoie les journaux de ressources de NSG1 vers un stockage" } }
    - { id: c, text: { en: "A virtual network flow log that targets Subnet1", fr: "Un journal de flux de réseau virtuel qui cible Subnet1" } }
    - { id: d, text: { en: "A Network Watcher packet capture on each VM of Subnet1", fr: "Une capture de paquets Network Watcher sur chaque machine virtuelle de Subnet1" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Virtual network flow logs record the IP flows of a virtual network, a subnet or a network interface, with the NSG (or security admin) rule that allowed or denied each one. NSG flow logs no longer accept new creations and retire on September 30, 2027.
    fr: |
      Les journaux de flux de réseau virtuel enregistrent les flux IP d'un réseau virtuel, d'un sous-réseau ou d'une interface réseau, avec la règle NSG (ou d'administration de sécurité) qui a autorisé ou refusé chacun d'eux. Les journaux de flux NSG n'acceptent plus de nouvelles créations et sont mis hors service le 30 septembre 2027.
  options:
    a: { en: "New NSG flow logs can no longer be created; virtual network flow logs replace them.", fr: "Il n'est plus possible de créer des journaux de flux NSG ; les journaux de flux de réseau virtuel les remplacent." }
    b: { en: "NSG resource logs describe rule events and counters, not individual IP flows.", fr: "Les journaux de ressources d'un NSG décrivent les événements et les compteurs des règles, pas les flux IP individuels." }
    d: { en: "Packet capture records packets during a limited session; it isn't continuous flow logging.", fr: "La capture de paquets enregistre des paquets pendant une session limitée ; ce n'est pas une journalisation continue des flux." }
references:
  - title: Flow logging for network security groups
    url: https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-overview
  - title: Virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
