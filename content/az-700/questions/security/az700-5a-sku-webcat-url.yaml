id: az700-5a-sku-webcat-url
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank routes the outbound internet traffic of its virtual machines through Azure Firewall. The virtual machines trust a certification authority that Woodgrove can use to issue an intermediate CA certificate.

    The compliance team requires that employees be blocked from the **News** web category, including news pages published under a path of a search engine site (for example, `https://www.fabrikam-search.example/news`), while the search pages of the same site stay allowed.

    What should you deploy?
  fr: |
    Woodgrove Bank fait passer le trafic Internet sortant de ses machines virtuelles par le Pare-feu Azure. Les machines virtuelles approuvent une autorité de certification que Woodgrove peut utiliser pour émettre un certificat d'autorité de certification intermédiaire.

    L'équipe de conformité exige que les employés soient bloqués sur la catégorie web **News**, y compris les pages d'actualités publiées sous un chemin d'un site de moteur de recherche (par exemple, `https://www.fabrikam-search.example/news`), tandis que les pages de recherche du même site restent autorisées.

    Que devez-vous déployer ?
body:
  options:
    - { id: a, text: { en: "Azure Firewall Standard with a web category rule that denies News", fr: "Le Pare-feu Azure Standard avec une règle de catégorie web qui refuse News" } }
    - { id: b, text: { en: "Azure Firewall Basic with an application rule that uses an FQDN tag for news sites", fr: "Le Pare-feu Azure Basic avec une règle d'application qui utilise une balise FQDN pour les sites d'actualités" } }
    - { id: c, text: { en: "Azure Firewall Standard with an application rule that denies the FQDN of the search site", fr: "Le Pare-feu Azure Standard avec une règle d'application qui refuse le FQDN du site de recherche" } }
    - { id: d, text: { en: "Azure Firewall Premium with TLS inspection and a web category rule that denies News", fr: "Le Pare-feu Azure Premium avec l'inspection TLS et une règle de catégorie web qui refuse News" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Standard categorizes web traffic by FQDN only, so a news path under a search engine is classified with the rest of the site. Premium categorizes by full URL; for HTTPS traffic it must decrypt the requests, which requires TLS inspection with an intermediate CA certificate. Web categories also require a Premium firewall policy for a Premium firewall.
    fr: |
      Standard catégorise le trafic web uniquement par FQDN : un chemin d'actualités sous un moteur de recherche est classé avec le reste du site. Premium catégorise par URL complète ; pour le trafic HTTPS, il doit déchiffrer les requêtes, ce qui exige l'inspection TLS avec un certificat d'autorité de certification intermédiaire. Les catégories web d'un pare-feu Premium exigent aussi une stratégie de pare-feu Premium.
  options:
    a: { en: "Standard would classify the whole search site by its FQDN, so the news path wouldn't be blocked on its own.", fr: "Standard classerait tout le site de recherche selon son FQDN : le chemin d'actualités ne serait pas bloqué séparément." }
    c: { en: "Denying the FQDN would also block the search pages, which must stay allowed.", fr: "Refuser le FQDN bloquerait aussi les pages de recherche, qui doivent rester autorisées." }
    b: { en: "Basic doesn't support web categories, and FQDN tags only cover well-known Microsoft services.", fr: "Basic ne prend pas en charge les catégories web, et les balises FQDN ne couvrent que des services Microsoft connus." }
references:
  - title: Azure Firewall Premium features implementation guide
    url: https://learn.microsoft.com/en-us/azure/firewall/premium-features
