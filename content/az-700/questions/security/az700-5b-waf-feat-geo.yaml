id: az700-5b-waf-feat-geo
objective: "5.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys publishes a web application through an Azure Application Gateway WAF_v2 named **AGW1** that has a WAF policy in Prevention mode.

    For legal reasons, the application must accept requests only from clients located in Canada and the United States.

    What should you add to the WAF policy?
  fr: |
    Wingtip Toys publie une application web par une passerelle Azure Application Gateway WAF_v2 nommée **AGW1** dotée d'une stratégie WAF en mode de prévention.

    Pour des raisons légales, l'application ne doit accepter que les requêtes des clients situés au Canada et aux États-Unis.

    Que devez-vous ajouter à la stratégie WAF ?
body:
  options:
    - id: a
      text: { en: "The Bot Manager rule set", fr: "L'ensemble de règles Bot Manager" }
    - id: b
      text: { en: "An exclusion on the managed rule set", fr: "Une exclusion sur l'ensemble de règles managé" }
    - id: c
      text: { en: "A rate limit rule grouped by GeoLocation", fr: "Une règle de limitation de débit regroupée par GeoLocation" }
    - id: d
      text: { en: "A custom rule that uses the GeoMatch operator", fr: "Une règle personnalisée qui utilise l'opérateur GeoMatch" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Geo-filtering is done with a custom rule whose condition uses the GeoMatch operator on the client address. Here, a rule that blocks requests whose country isn't CA or US (negated condition) meets the requirement, and custom rules are evaluated before the managed rules.
    fr: |
      Le géofiltrage se fait avec une règle personnalisée dont la condition utilise l'opérateur GeoMatch sur l'adresse du client. Ici, une règle qui bloque les requêtes dont le pays n'est ni CA ni US (condition inversée) répond à l'exigence, et les règles personnalisées sont évaluées avant les règles managées.
  options:
    a: { en: "Bot Manager classifies bots as bad, good or unknown; it doesn't filter clients by country.", fr: "Bot Manager classe les bots en malveillants, bons ou inconnus ; il ne filtre pas les clients par pays." }
    b: { en: "An exclusion removes request attributes from managed rule evaluation; it doesn't block anything.", fr: "Une exclusion retire des attributs de la requête de l'évaluation des règles managées ; elle ne bloque rien." }
    c: { en: "Grouping by GeoLocation counts requests per geography to throttle them; it still lets clients of every country in up to the threshold.", fr: "Le regroupement par GeoLocation compte les requêtes par zone géographique pour les limiter ; il laisse quand même passer les clients de tous les pays jusqu'au seuil." }
references:
  - title: Custom rules for Web Application Firewall v2 on Azure Application Gateway
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/custom-waf-rules-overview
