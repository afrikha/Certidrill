id: az700-5a-asg-portal
objective: "5.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    A virtual network named **VNet1** in the West Europe region contains the following resources:

    - Two application security groups named **asg-web** and **asg-mgmt**, both in West Europe.
    - A virtual machine named **VM1** that has a network interface named **NIC1**.
    - A network interface named **NIC5** that isn't attached to any virtual machine.

    No network interface is a member of an application security group yet.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un réseau virtuel nommé **VNet1** de la région West Europe contient les ressources suivantes :

    - Deux groupes de sécurité d'application nommés **asg-web** et **asg-mgmt**, tous deux dans West Europe.
    - Une machine virtuelle nommée **VM1** qui possède une interface réseau nommée **NIC1**.
    - Une interface réseau nommée **NIC5** qui n'est attachée à aucune machine virtuelle.

    Aucune interface réseau n'est encore membre d'un groupe de sécurité d'application.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can add NIC1 to asg-web from the Networking page of VM1 in the Azure portal.
        fr: Vous pouvez ajouter NIC1 à asg-web depuis la page Mise en réseau de VM1 dans le portail Azure.
    - id: s2
      text:
        en: You can add NIC5 to asg-web by using the Azure portal.
        fr: Vous pouvez ajouter NIC5 à asg-web à l'aide du portail Azure.
    - id: s3
      text:
        en: The IP configuration of NIC1 can be a member of asg-web and asg-mgmt at the same time.
        fr: La configuration IP de NIC1 peut être membre d'asg-web et d'asg-mgmt en même temps.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      In the portal, you add an interface to application security groups from the virtual machine's Networking page (Application security groups tab), which works only for an interface attached to a virtual machine. For NIC5, use Azure CLI or PowerShell. A network interface can be a member of several application security groups.
    fr: |
      Dans le portail, vous ajoutez une interface à des groupes de sécurité d'application depuis la page Mise en réseau de la machine virtuelle (onglet Groupes de sécurité d'application), ce qui ne fonctionne que pour une interface attachée à une machine virtuelle. Pour NIC5, utilisez Azure CLI ou PowerShell. Une interface réseau peut être membre de plusieurs groupes de sécurité d'application.
references:
  - title: Create, change, or delete a network interface
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface
  - title: Application security groups
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
