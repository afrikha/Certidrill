id: az700-5b-fwm-policy-vs-classic
objective: "5.2.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware is deciding whether to manage its Azure Firewall instances by using firewall policies or classic rules.

    Which configuration method meets each requirement? To answer, drag the appropriate methods to the correct requirements. Each method may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware doit choisir de gérer ses instances de Pare-feu Azure avec des stratégies de pare-feu ou avec des règles classiques.

    Quelle méthode de configuration répond à chaque exigence ? Pour répondre, faites glisser les méthodes appropriées vers les exigences correspondantes. Chaque méthode peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: policy, text: { en: "Firewall policy only", fr: "Stratégie de pare-feu uniquement" } }
    - { id: classic, text: { en: "Classic rules only", fr: "Règles classiques uniquement" } }
    - { id: both, text: { en: "Both methods", fr: "Les deux méthodes" } }
  targets:
    - id: t1
      text: { en: "Protect an Azure Firewall deployed in a secured virtual hub", fr: "Protéger un Pare-feu Azure déployé dans un hub virtuel sécurisé" }
    - id: t2
      text: { en: "Configure TLS inspection and IDPS", fr: "Configurer l'inspection TLS et l'IDPS" }
    - id: t3
      text: { en: "Define NAT, network and application rules and use IP Groups", fr: "Définir des règles NAT, de réseau et d'application et utiliser des groupes IP" }
    - id: t4
      text: { en: "Keep the configuration free of charge when it's applied to several firewalls", fr: "Conserver une configuration gratuite quand elle s'applique à plusieurs pare-feu" }
answer:
  mapping: { t1: policy, t2: policy, t3: both, t4: classic }
explanation:
  correct:
    en: |
      Firewall policies protect both virtual networks and Virtual WAN hubs, while classic rules protect virtual networks only. TLS inspection, IDPS, web categories and URL filtering exist only in policies. Both methods support NAT, network and application rules, custom DNS, IP Groups and threat intelligence. Classic rules are free; a policy is billed when it's associated with more than one firewall.
    fr: |
      Les stratégies de pare-feu protègent les réseaux virtuels comme les hubs Virtual WAN, tandis que les règles classiques ne protègent que les réseaux virtuels. L'inspection TLS, l'IDPS, les catégories web et le filtrage d'URL n'existent que dans les stratégies. Les deux méthodes prennent en charge les règles NAT, de réseau et d'application, le DNS personnalisé, les groupes IP et le renseignement sur les menaces. Les règles classiques sont gratuites ; une stratégie est facturée quand elle est associée à plus d'un pare-feu.
references:
  - title: Azure Firewall Manager policy overview
    url: https://learn.microsoft.com/en-us/azure/firewall-manager/policy-overview
