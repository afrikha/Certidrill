id: az700-cs1b-waf-policy
objective: "5.3.4"
type: dropdown
caseStudy: az700-cs1b-proseware
difficulty: 2
status: draft
stem:
  en: |
    You create a WAF policy named **waf-portal** for fd-proseware. You need to configure waf-portal for the first two weeks after go-live. The solution must meet the security requirements.

    How should you configure waf-portal? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une stratégie WAF nommée **waf-portal** pour fd-proseware. Vous devez configurer waf-portal pour les deux premières semaines après la mise en service. La solution doit respecter les exigences de sécurité.

    Comment devez-vous configurer waf-portal ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Policy mode: [[mode]]

      Managed rule sets: [[rules]]

      Apply waf-portal by using: [[assoc]]
    fr: |
      Mode de la stratégie : [[mode]]

      Ensembles de règles managés : [[rules]]

      Appliquer waf-portal au moyen de : [[assoc]]
  slots:
    - id: mode
      options:
        - { id: detection, text: "Detection" }
        - { id: prevention, text: "Prevention" }
        - { id: prev200, text: { en: "Prevention, with a custom response status code of 200", fr: "Prevention, avec un code d'état de réponse personnalisé 200" } }
    - id: rules
      options:
        - { id: drs, text: { en: "Default Rule Set only", fr: "Default Rule Set uniquement" } }
        - { id: drsbot, text: { en: "Default Rule Set and Bot Manager rule set", fr: "Default Rule Set et ensemble de règles Bot Manager" } }
        - { id: crsbot, text: { en: "OWASP CRS 3.2 and Bot Manager rule set", fr: "OWASP CRS 3.2 et ensemble de règles Bot Manager" } }
        - { id: custom, text: { en: "No managed rule set; custom rules only", fr: "Aucun ensemble de règles managé ; règles personnalisées uniquement" } }
    - id: assoc
      options:
        - { id: secpol, text: { en: "A security policy of fd-proseware that includes the proseware.com and www.proseware.com domains", fr: "Une stratégie de sécurité de fd-proseware qui inclut les domaines proseware.com et www.proseware.com" } }
        - { id: og, text: { en: "The origin group og-portal", fr: "Le groupe d'origines og-portal" } }
        - { id: access, text: { en: "Access restrictions on app-portal-ne and app-portal-eus", fr: "Des restrictions d'accès sur app-portal-ne et app-portal-eus" } }
answer:
  values: { mode: detection, rules: drsbot, assoc: secpol }
explanation:
  correct:
    en: In Detection mode, the WAF evaluates requests and logs the matched rules without blocking anything, which is the usual way to review false positives before switching to Prevention. The Microsoft-managed Default Rule Set covers common web attacks such as the OWASP Top 10, and the Bot Manager rule set adds protection against malicious bots. In Front Door Standard and Premium, a security policy associates a WAF policy with the domains of the profile.
    fr: En mode Detection, le WAF évalue les requêtes et journalise les règles correspondantes sans rien bloquer ; c'est la méthode habituelle pour examiner les faux positifs avant de passer en mode Prevention. L'ensemble Default Rule Set géré par Microsoft couvre les attaques web courantes comme celles du Top 10 de l'OWASP, et l'ensemble de règles Bot Manager ajoute la protection contre les bots malveillants. Dans Front Door Standard et Premium, une stratégie de sécurité associe une stratégie WAF aux domaines du profil.
  options:
    prevention:
      en: Prevention mode applies the action of the matching rules, so requests would be blocked during the first two weeks.
      fr: "Le mode Prevention applique l'action des règles correspondantes : des requêtes seraient bloquées pendant les deux premières semaines."
    prev200:
      en: A custom response status code only changes the response that blocked requests receive; the requests are still blocked.
      fr: Un code d'état de réponse personnalisé modifie seulement la réponse reçue par les requêtes bloquées ; les requêtes restent bloquées.
    drs:
      en: The Default Rule Set alone doesn't include the bot protection rules.
      fr: L'ensemble Default Rule Set seul n'inclut pas les règles de protection contre les bots.
    crsbot:
      en: OWASP CRS rule sets are offered by WAF on Application Gateway; WAF on Azure Front Door uses the Default Rule Set.
      fr: Les ensembles de règles OWASP CRS sont proposés par le WAF sur Application Gateway ; le WAF sur Azure Front Door utilise le Default Rule Set.
    custom:
      en: Custom rules are written and maintained by Proseware, while the requirement asks for rules that Microsoft manages.
      fr: Les règles personnalisées sont écrites et gérées par Proseware, alors que l'exigence demande des règles gérées par Microsoft.
    og:
      en: A WAF policy isn't attached to an origin group; Front Door applies it to domains through a security policy.
      fr: Une stratégie WAF ne s'attache pas à un groupe d'origines ; Front Door l'applique à des domaines au moyen d'une stratégie de sécurité.
    access:
      en: Access restrictions filter traffic on the web apps themselves; they don't apply a WAF policy.
      fr: Les restrictions d'accès filtrent le trafic sur les applications web elles-mêmes ; elles n'appliquent pas de stratégie WAF.
references:
  - title: Policy settings for Web Application Firewall in Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-policy-settings
  - title: Azure Front Door WAF DRS rule groups and rules
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-drs
