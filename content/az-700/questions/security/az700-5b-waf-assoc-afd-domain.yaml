id: az700-5b-waf-assoc-afd-domain
objective: "5.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Front Door Premium profile named **afd-fab** with the custom domains www.fabrikam.com and api.fabrikam.com. A WAF policy named **wafWeb** is associated with both domains.

    You create a WAF policy named **wafApi** that must protect api.fabrikam.com only. wafWeb must keep protecting www.fabrikam.com. On the **Association** tab of wafApi, api.fabrikam.com appears grayed out.

    What should you do?
  fr: |
    Fabrikam dispose d'un profil Azure Front Door Premium nommé **afd-fab** avec les domaines personnalisés www.fabrikam.com et api.fabrikam.com. Une stratégie WAF nommée **wafWeb** est associée aux deux domaines.

    Vous créez une stratégie WAF nommée **wafApi** qui doit protéger api.fabrikam.com uniquement. wafWeb doit continuer à protéger www.fabrikam.com. Sous l'onglet **Association** de wafApi, api.fabrikam.com apparaît grisé.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Associate wafApi with afd-fab at the profile scope.", fr: "Associer wafApi à afd-fab dans l'étendue du profil." }
    - id: b
      text: { en: "Switch wafWeb to Detection mode, and then associate wafApi with api.fabrikam.com.", fr: "Passer wafWeb en mode de détection, puis associer wafApi à api.fabrikam.com." }
    - id: c
      text: { en: "Remove api.fabrikam.com from the association of wafWeb, and then associate it with wafApi.", fr: "Retirer api.fabrikam.com de l'association de wafWeb, puis l'associer à wafApi." }
    - id: d
      text: { en: "Create a second endpoint in afd-fab, and then move api.fabrikam.com to it.", fr: "Créer un second point de terminaison dans afd-fab, puis y déplacer api.fabrikam.com." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A domain can be associated with only one WAF policy at a time; a domain that's already associated appears grayed out. You must remove it from its existing association before you can associate it with another policy.
    fr: |
      Un domaine ne peut être associé qu'à une seule stratégie WAF à la fois ; un domaine déjà associé apparaît grisé. Vous devez le retirer de son association existante avant de pouvoir l'associer à une autre stratégie.
  options:
    a: { en: "When several scopes apply, the domain association (wafWeb) takes precedence over the profile association.", fr: "Quand plusieurs étendues s'appliquent, l'association au domaine (wafWeb) prime sur l'association au profil." }
    b: { en: "The mode doesn't release the domain association, and it would stop wafWeb from blocking attacks.", fr: "Le mode ne libère pas l'association du domaine, et il empêcherait wafWeb de bloquer les attaques." }
    d: { en: "The WAF association is made on the domain; moving it to another endpoint doesn't remove its existing association.", fr: "L'association WAF se fait sur le domaine ; le déplacer vers un autre point de terminaison ne supprime pas son association existante." }
references:
  - title: "Tutorial: Create a WAF policy on Azure Front Door by using the Azure portal"
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-create-portal
  - title: Policy settings for Web Application Firewall in Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-policy-settings
