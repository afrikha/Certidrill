id: az700-5a-bastion-outbound
objective: "5.1.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An Azure Bastion host that uses the Standard SKU is deployed to the **AzureBastionSubnet** subnet of a virtual network named **VNet-Hub**. You associate a network security group named **NSG-Bas** with AzureBastionSubnet. NSG-Bas contains the following custom rules.

    | Direction | Priority | Source | Destination | Ports | Access |
    | --- | --- | --- | --- | --- | --- |
    | Inbound | 100 | Internet | Any | TCP 443 | Allow |
    | Inbound | 110 | GatewayManager | Any | TCP 443 | Allow |
    | Inbound | 120 | AzureLoadBalancer | Any | TCP 443 | Allow |
    | Inbound | 130 | VirtualNetwork | VirtualNetwork | 8080, 5701 | Allow |
    | Outbound | 100 | Any | VirtualNetwork | 22, 3389 | Allow |
    | Outbound | 110 | Any | Internet | 80 | Allow |
    | Outbound | 4000 | Any | Any | Any | Deny |

    You need to complete NSG-Bas so that Bastion works and continues to receive platform updates.

    Which two outbound rules should you add with a priority lower than 4000? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un hôte Azure Bastion de référence SKU Standard est déployé dans le sous-réseau **AzureBastionSubnet** d'un réseau virtuel nommé **VNet-Hub**. Vous associez un groupe de sécurité réseau nommé **NSG-Bas** à AzureBastionSubnet. NSG-Bas contient les règles personnalisées suivantes.

    | Direction | Priorité | Source | Destination | Ports | Accès |
    | --- | --- | --- | --- | --- | --- |
    | Entrant | 100 | Internet | Any | TCP 443 | Allow |
    | Entrant | 110 | GatewayManager | Any | TCP 443 | Allow |
    | Entrant | 120 | AzureLoadBalancer | Any | TCP 443 | Allow |
    | Entrant | 130 | VirtualNetwork | VirtualNetwork | 8080, 5701 | Allow |
    | Sortant | 100 | Any | VirtualNetwork | 22, 3389 | Allow |
    | Sortant | 110 | Any | Internet | 80 | Allow |
    | Sortant | 4000 | Any | Any | Any | Deny |

    Vous devez compléter NSG-Bas pour que Bastion fonctionne et continue de recevoir les mises à jour de la plateforme.

    Quelles sont les deux règles sortantes à ajouter avec une priorité inférieure à 4000 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Allow TCP 443 to the AzureCloud service tag", fr: "Autoriser TCP 443 vers l'étiquette de service AzureCloud" } }
    - { id: b, text: { en: "Allow ports 3389 and 22 to the Internet service tag", fr: "Autoriser les ports 3389 et 22 vers l'étiquette de service Internet" } }
    - { id: c, text: { en: "Allow ports 8080 and 5701 from VirtualNetwork to VirtualNetwork", fr: "Autoriser les ports 8080 et 5701 de VirtualNetwork vers VirtualNetwork" } }
    - { id: d, text: { en: "Allow TCP 443 to the GatewayManager service tag", fr: "Autoriser TCP 443 vers l'étiquette de service GatewayManager" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Outbound from AzureBastionSubnet, Bastion needs 22 and 3389 to VirtualNetwork (present), 80 to Internet (present), TCP 443 to AzureCloud for diagnostics and metering, and 8080 and 5701 within VirtualNetwork for communication between Bastion components. The last two are missing and are blocked by the deny rule at priority 4000.
    fr: |
      En sortie d'AzureBastionSubnet, Bastion a besoin des ports 22 et 3389 vers VirtualNetwork (présents), du port 80 vers Internet (présent), de TCP 443 vers AzureCloud pour les diagnostics et la mesure, et des ports 8080 et 5701 au sein de VirtualNetwork pour la communication entre les composants Bastion. Les deux derniers manquent et sont bloqués par la règle de refus de priorité 4000.
  options:
    b: { en: "Bastion reaches the target VMs over their private IP addresses (VirtualNetwork), never over the internet.", fr: "Bastion atteint les machines virtuelles cibles par leurs adresses IP privées (VirtualNetwork), jamais par Internet." }
    d: { en: "GatewayManager is the source of inbound control plane traffic; that rule already exists inbound.", fr: "GatewayManager est la source du trafic entrant du plan de contrôle ; cette règle existe déjà en entrée." }
references:
  - title: Configure NSG rules for Azure Bastion
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-nsg
