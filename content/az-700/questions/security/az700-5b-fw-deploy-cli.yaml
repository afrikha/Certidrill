id: az700-5b-fw-deploy-cli
objective: "5.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A virtual network named **VNet-Hub** contains a subnet named AzureFirewallSubnet (10.0.1.0/26). A Standard SKU public IP address named **pip-fw1** has the address 20.61.15.7. A firewall policy named **FWP1** exists.

    You run the following commands to deploy an Azure Firewall named **FW1** in VNet-Hub and to send the internet-bound traffic of a spoke subnet through it. After the deployment, FW1 has the private IP address 10.0.1.4.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un réseau virtuel nommé **VNet-Hub** contient un sous-réseau nommé AzureFirewallSubnet (10.0.1.0/26). Une adresse IP publique de référence SKU Standard nommée **pip-fw1** a l'adresse 20.61.15.7. Une stratégie de pare-feu nommée **FWP1** existe.

    Vous exécutez les commandes suivantes pour déployer un Pare-feu Azure nommé **FW1** dans VNet-Hub et pour faire passer par lui le trafic à destination d'Internet d'un sous-réseau spoke. Après le déploiement, FW1 a l'adresse IP privée 10.0.1.4.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network firewall create -g RG-Hub -n FW1 \
      --sku [[sku]] --tier Standard \
      --vnet-name VNet-Hub --public-ip pip-fw1 \
      --firewall-policy FWP1

    az network route-table route create -g RG-Spoke --route-table-name RT-Web \
      -n Default-to-FW1 --address-prefix 0.0.0.0/0 \
      --next-hop-type [[nht]] --next-hop-ip-address [[ip]]
  slots:
    - id: sku
      options:
        - { id: vnet, text: AZFW_VNet }
        - { id: hub, text: AZFW_Hub }
        - { id: std, text: Standard }
    - id: nht
      options:
        - { id: va, text: VirtualAppliance }
        - { id: vng, text: VirtualNetworkGateway }
        - { id: inet, text: Internet }
        - { id: local, text: VnetLocal }
    - id: ip
      options:
        - { id: priv, text: 10.0.1.4 }
        - { id: pub, text: 20.61.15.7 }
        - { id: gwip, text: 10.0.1.1 }
        - { id: net, text: 10.0.1.0 }
answer:
  values: { sku: vnet, nht: va, ip: priv }
explanation:
  correct:
    en: |
      The `--sku` value AZFW_VNet deploys the firewall in a virtual network (AZFW_Hub is for a Virtual WAN hub), and the tier is set separately with `--tier`. The user-defined route uses the next hop type VirtualAppliance with the private IP address of the firewall.
    fr: |
      La valeur `--sku` AZFW_VNet déploie le pare-feu dans un réseau virtuel (AZFW_Hub est destiné à un hub Virtual WAN), et le niveau se définit à part avec `--tier`. L'itinéraire défini par l'utilisateur utilise le type de tronçon suivant VirtualAppliance avec l'adresse IP privée du pare-feu.
  options:
    hub: { en: "AZFW_Hub attaches the firewall to a Virtual WAN hub, not to a virtual network.", fr: "AZFW_Hub attache le pare-feu à un hub Virtual WAN, pas à un réseau virtuel." }
    std: { en: "Standard is a value of `--tier`, not of `--sku`.", fr: "Standard est une valeur de `--tier`, pas de `--sku`." }
    vng: { en: "VirtualNetworkGateway sends traffic to a VPN or ExpressRoute gateway, not to the firewall.", fr: "VirtualNetworkGateway envoie le trafic vers une passerelle VPN ou ExpressRoute, pas vers le pare-feu." }
    inet: { en: "Internet keeps the default behavior and bypasses the firewall.", fr: "Internet conserve le comportement par défaut et contourne le pare-feu." }
    local: { en: "VnetLocal only applies to the virtual network's own address space and takes no next hop address.", fr: "VnetLocal ne s'applique qu'à l'espace d'adressage du réseau virtuel et n'accepte pas d'adresse de tronçon suivant." }
    pub: { en: "The next hop of a route must be the firewall's private IP address, not its public IP address.", fr: "Le tronçon suivant d'un itinéraire doit être l'adresse IP privée du pare-feu, pas son adresse IP publique." }
    gwip: { en: "10.0.1.1 is reserved by Azure as the default gateway of the subnet.", fr: "10.0.1.1 est réservée par Azure comme passerelle par défaut du sous-réseau." }
    net: { en: "10.0.1.0 is the network address of the subnet.", fr: "10.0.1.0 est l'adresse réseau du sous-réseau." }
references:
  - title: az network firewall
    url: https://learn.microsoft.com/en-us/cli/azure/network/firewall?view=azure-cli-latest
  - title: Deploy and configure Azure Firewall in a hybrid network by using the Azure portal
    url: https://learn.microsoft.com/en-us/azure/firewall/tutorial-hybrid-portal
