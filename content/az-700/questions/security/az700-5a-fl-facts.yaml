id: az700-5a-fl-facts
objective: "5.1.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A virtual network named **VNet1** contains a virtual machine named **VM1**. The following virtual network flow logs are enabled.

    | Flow log | Target | Storage account | Retention |
    | --- | --- | --- | --- |
    | fl-vnet1 | VNet1 | stA | 30 days |
    | fl-vm1 | Network interface of VM1 | stB | 7 days |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un réseau virtuel nommé **VNet1** contient une machine virtuelle nommée **VM1**. Les journaux de flux de réseau virtuel suivants sont activés.

    | Journal de flux | Cible | Compte de stockage | Rétention |
    | --- | --- | --- | --- |
    | fl-vnet1 | VNet1 | stA | 30 jours |
    | fl-vm1 | Interface réseau de VM1 | stB | 7 jours |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The flows of VM1 are recorded according to the settings of fl-vm1.
        fr: Les flux de VM1 sont enregistrés selon les paramètres de fl-vm1.
    - id: s2
      text:
        en: A flow tuple of VM1 whose protocol field is 17 describes a UDP flow.
        fr: Un tuple de flux de VM1 dont le champ de protocole vaut 17 décrit un flux UDP.
    - id: s3
      text:
        en: A flow tuple of VM1 whose flow state is C indicates that the connection was closed.
        fr: Un tuple de flux de VM1 dont l'état du flux est C indique que la connexion a été fermée.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      When flow logs exist at several levels, the most specific one applies: network interface, then subnet, then virtual network. The protocol field holds the IANA protocol number (6 for TCP, 17 for UDP). State C means the flow is continuing; E marks its end.
    fr: |
      Quand des journaux de flux existent à plusieurs niveaux, le plus spécifique s'applique : interface réseau, puis sous-réseau, puis réseau virtuel. Le champ de protocole contient le numéro de protocole IANA (6 pour TCP, 17 pour UDP). L'état C signifie que le flux continue ; E marque sa fin.
references:
  - title: Virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
  - title: Create, change, enable, disable, or delete virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-manage
