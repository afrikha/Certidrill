id: az700-cs4a-bastion-nsg
objective: "5.1.9"
type: yesno_statements
caseStudy: az700-cs4a-coho-resorts
difficulty: 1
status: draft
stem:
  en: |
    You create an NSG named **NSG-Bastion** to associate with AzureBastionSubnet. You need to define the rules of NSG-Bastion so that the security and operations requirements are met.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un NSG nommé **NSG-Bastion** à associer à AzureBastionSubnet. Vous devez définir les règles de NSG-Bastion de sorte que les exigences de sécurité et d'exploitation soient respectées.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: NSG-Bastion must contain an inbound rule that allows TCP 443 from the Internet service tag.
        fr: NSG-Bastion doit contenir une règle de trafic entrant qui autorise TCP 443 depuis l'étiquette de service Internet.
    - id: s2
      text:
        en: NSG-Bastion must contain an inbound rule that allows TCP 3389 from the Internet service tag.
        fr: NSG-Bastion doit contenir une règle de trafic entrant qui autorise TCP 3389 depuis l'étiquette de service Internet.
    - id: s3
      text:
        en: NSG-Bastion must contain an outbound rule that allows TCP 3389 to the VirtualNetwork service tag.
        fr: NSG-Bastion doit contenir une règle de trafic sortant qui autorise TCP 3389 vers l'étiquette de service VirtualNetwork.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Users reach Azure Bastion over HTTPS, so the subnet NSG must allow TCP 443 inbound from Internet, together with the GatewayManager, AzureLoadBalancer and Bastion host communication rules. RDP isn't exposed to the internet: the Bastion hosts open the RDP session to the virtual machines over their private IP addresses, which requires outbound TCP 3389 (and 22 for SSH) to VirtualNetwork. Omitting any of the required rules blocks the service or its platform updates.
    fr: |
      Les utilisateurs accèdent à Azure Bastion en HTTPS : le NSG du sous-réseau doit donc autoriser TCP 443 en entrée depuis Internet, ainsi que les règles GatewayManager, AzureLoadBalancer et de communication entre hôtes Bastion. RDP n'est pas exposé à Internet : les hôtes Bastion ouvrent la session RDP vers les machines virtuelles par leurs adresses IP privées, ce qui exige TCP 3389 (et 22 pour SSH) en sortie vers VirtualNetwork. L'omission de l'une des règles requises bloque le service ou ses mises à jour de plateforme.
  options:
    s2: { en: "The required inbound rules use TCP 443 (Internet, GatewayManager, AzureLoadBalancer) and 8080/5701 within the virtual network. RDP from the internet isn't part of them.", fr: "Les règles de trafic entrant requises utilisent TCP 443 (Internet, GatewayManager, AzureLoadBalancer) et 8080/5701 au sein du réseau virtuel. RDP depuis Internet n'en fait pas partie." }
references:
  - title: Configure NSG rules for Azure Bastion
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-nsg
