id: az700-5b-waf-assoc-peruri-multi
objective: "5.3.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An Azure Application Gateway WAF_v2 named **AGW-Pay** has a listener named **lst-adatum** for app.adatum.com. lst-adatum uses a basic request routing rule that sends all requests to a backend pool named **pool-app**. A WAF policy named **WAFP-Base** is associated with AGW-Pay at the gateway level.

    You create a stricter WAF policy named **WAFP-Payments**. You need to apply WAFP-Payments to the requests for app.adatum.com/payments/* only. The other requests for app.adatum.com must still be processed by WAFP-Base.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une passerelle Azure Application Gateway WAF_v2 nommée **AGW-Pay** possède un écouteur nommé **lst-adatum** pour app.adatum.com. lst-adatum utilise une règle de routage des requêtes de base qui envoie toutes les requêtes vers un pool principal nommé **pool-app**. Une stratégie WAF nommée **WAFP-Base** est associée à AGW-Pay au niveau de la passerelle.

    Vous créez une stratégie WAF plus stricte nommée **WAFP-Payments**. Vous devez appliquer WAFP-Payments aux seules requêtes vers app.adatum.com/payments/*. Les autres requêtes vers app.adatum.com doivent toujours être traitées par WAFP-Base.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Associate WAFP-Payments with lst-adatum.", fr: "Associer WAFP-Payments à lst-adatum." } }
    - { id: b, text: { en: "Replace the basic rule with a path-based rule whose URL path map contains a path rule for /payments/*.", fr: "Remplacer la règle de base par une règle basée sur le chemin dont le mappage de chemins d'URL contient une règle de chemin pour /payments/*." } }
    - { id: d, text: { en: "Associate WAFP-Payments with AGW-Pay at the gateway level.", fr: "Associer WAFP-Payments à AGW-Pay au niveau de la passerelle." } }
    - { id: c, text: { en: "Associate WAFP-Payments with the /payments/* path rule.", fr: "Associer WAFP-Payments à la règle de chemin /payments/*." } }
    - { id: e, text: { en: "Create a second listener for app.adatum.com/payments and associate WAFP-Payments with it.", fr: "Créer un second écouteur pour app.adatum.com/payments et lui associer WAFP-Payments." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      A per-URI policy is associated with a path rule of a URL path map, so the basic rule must first become a path-based rule with a /payments/* path. The per-URI policy then overrides the policies above it for that path only, and the other paths of app.adatum.com keep using WAFP-Base.
    fr: |
      Une stratégie par URI s'associe à une règle de chemin d'un mappage de chemins d'URL : la règle de base doit d'abord devenir une règle basée sur le chemin avec un chemin /payments/*. La stratégie par URI prime alors sur les stratégies de niveau supérieur pour ce seul chemin, et les autres chemins d'app.adatum.com continuent d'utiliser WAFP-Base.
  options:
    a: { en: "A per-site policy on the listener would apply to every path of app.adatum.com.", fr: "Une stratégie par site sur l'écouteur s'appliquerait à tous les chemins d'app.adatum.com." }
    d: { en: "A new gateway-level association replaces WAFP-Base for the whole gateway.", fr: "Une nouvelle association au niveau de la passerelle remplace WAFP-Base pour toute la passerelle." }
    e: { en: "Listeners match on frontend IP, port and host name, not on URL paths.", fr: "Les écouteurs correspondent sur l'IP frontale, le port et le nom d'hôte, pas sur les chemins d'URL." }
references:
  - title: Azure Web Application Firewall (WAF) policy overview
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/policy-overview
  - title: Create Web Application Firewall policies for Application Gateway
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/create-waf-policy-ag
