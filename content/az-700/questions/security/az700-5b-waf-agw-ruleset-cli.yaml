id: az700-5b-waf-agw-ruleset-cli
objective: "5.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You have an Application Gateway WAF policy named **WAFP-Portal** that currently has no managed rule set.

    You need to add to WAFP-Portal the Default Rule Set version that Microsoft recommends for new policies, and protection against malicious bots.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'une stratégie WAF Application Gateway nommée **WAFP-Portal** qui n'a actuellement aucun ensemble de règles managé.

    Vous devez ajouter à WAFP-Portal la version du Default Rule Set que Microsoft recommande pour les nouvelles stratégies, ainsi qu'une protection contre les bots malveillants.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network application-gateway waf-policy managed-rule rule-set add \
      -g RG-Web --policy-name WAFP-Portal \
      --type [[t1]] --version [[v1]]

    az network application-gateway waf-policy managed-rule rule-set add \
      -g RG-Web --policy-name WAFP-Portal \
      --type [[t2]] --version 1.1
  slots:
    - id: t1
      options:
        - { id: drs, text: Microsoft_DefaultRuleSet }
        - { id: owasp, text: OWASP }
        - { id: ddos, text: Microsoft_HTTPDDoSRuleSet }
    - id: v1
      options:
        - { id: v21, text: "2.1" }
        - { id: v22, text: "2.2" }
        - { id: v32, text: "3.2" }
    - id: t2
      options:
        - { id: bot, text: Microsoft_BotManagerRuleSet }
        - { id: drs, text: Microsoft_DefaultRuleSet }
        - { id: owasp, text: OWASP }
answer:
  values: { t1: drs, v1: v22, t2: bot }
explanation:
  correct:
    en: |
      The Default Rule Set has the type `Microsoft_DefaultRuleSet`, and DRS 2.2 is the version recommended for new policies. Bot protection is a separate managed rule set of type `Microsoft_BotManagerRuleSet` (versions 0.1, 1.0 and 1.1), which runs alongside the DRS.
    fr: |
      Le Default Rule Set a le type `Microsoft_DefaultRuleSet`, et DRS 2.2 est la version recommandée pour les nouvelles stratégies. La protection contre les bots est un ensemble de règles managé distinct, de type `Microsoft_BotManagerRuleSet` (versions 0.1, 1.0 et 1.1), qui s'exécute en complément du DRS.
  options:
    owasp: { en: "OWASP is the type of the CRS rule sets (3.x), not of the DRS or of Bot Manager.", fr: "OWASP est le type des ensembles de règles CRS (3.x), pas du DRS ni de Bot Manager." }
    ddos: { en: "Microsoft_HTTPDDoSRuleSet is a separate HTTP DDoS rule set, not the DRS.", fr: "Microsoft_HTTPDDoSRuleSet est un ensemble de règles HTTP DDoS distinct, pas le DRS." }
    v21: { en: "DRS 2.1 is still supported, but DRS 2.2 is the recommended version.", fr: "DRS 2.1 reste pris en charge, mais DRS 2.2 est la version recommandée." }
    v32: { en: "3.2 is a CRS version, used with the OWASP type.", fr: "3.2 est une version de CRS, utilisée avec le type OWASP." }
references:
  - title: az network application-gateway waf-policy managed-rule rule-set
    url: https://learn.microsoft.com/en-us/cli/azure/network/application-gateway/waf-policy/managed-rule/rule-set?view=azure-cli-latest
  - title: Application Gateway WAF CRS and DRS rule groups and rules
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/application-gateway-crs-rulegroups-rules
