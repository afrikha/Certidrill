id: az700-5b-waf-feat-order-yn
objective: "5.3.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    An Azure Application Gateway WAF_v2 uses a WAF policy in Prevention mode with the Default Rule Set (DRS) 2.2 and the following custom rules:

    | Priority | Name | Condition | Action |
    | --- | --- | --- | --- |
    | 10 | Allow-Scanner | `RemoteAddr` IPMatch 10.5.0.20 | Allow |
    | 20 | Log-Admin | `RequestUri` Contains /admin | Log |
    | 30 | Block-Legacy | `RequestHeaders` User-Agent Contains legacyclient | Block |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une passerelle Azure Application Gateway WAF_v2 utilise une stratégie WAF en mode de prévention avec le Default Rule Set (DRS) 2.2 et les règles personnalisées suivantes :

    | Priorité | Nom | Condition | Action |
    | --- | --- | --- | --- |
    | 10 | Allow-Scanner | `RemoteAddr` IPMatch 10.5.0.20 | Allow |
    | 20 | Log-Admin | `RequestUri` Contains /admin | Log |
    | 30 | Block-Legacy | `RequestHeaders` User-Agent Contains legacyclient | Block |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A request from 10.5.0.20 that contains a SQL injection payload is blocked by DRS 2.2.
        fr: Une requête de 10.5.0.20 qui contient une charge utile d'injection SQL est bloquée par DRS 2.2.
    - id: s2
      text:
        en: A request to /admin/users from another client with the User-Agent `legacyclient/2.0` is blocked.
        fr: Une requête vers /admin/users venant d'un autre client avec le User-Agent `legacyclient/2.0` est bloquée.
    - id: s3
      text:
        en: A request from another client that matches no custom rule and triggers a Critical DRS rule is blocked.
        fr: Une requête d'un autre client qui ne correspond à aucune règle personnalisée et déclenche une règle DRS de gravité Critical est bloquée.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Custom rules are evaluated first, in priority order. An Allow match skips all the remaining custom and managed rules, so DRS doesn't block the scanner's request. A Log match writes a log entry and lets evaluation continue, so Block-Legacy still blocks the /admin request with the legacy User-Agent. A request that matches no custom rule goes to DRS, where one Critical match (score 5) reaches the anomaly threshold and is blocked in Prevention mode.
    fr: |
      Les règles personnalisées sont évaluées en premier, par ordre de priorité. Une correspondance Allow ignore toutes les règles personnalisées et managées restantes : DRS ne bloque pas la requête du scanner. Une correspondance Log écrit une entrée de journal et laisse l'évaluation continuer : Block-Legacy bloque donc quand même la requête /admin avec l'ancien User-Agent. Une requête qui ne correspond à aucune règle personnalisée passe à DRS, où une seule correspondance Critical (score 5) atteint le seuil d'anomalie et est bloquée en mode de prévention.
references:
  - title: Custom rules for Web Application Firewall v2 on Azure Application Gateway
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/custom-waf-rules-overview
  - title: What is Azure Web Application Firewall on Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
