id: az700-5a-bastion-facts
objective: "5.1.9"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You deploy Azure Bastion with the Basic SKU to a virtual network named **VNet1**. You plan to associate a network security group with **AzureBastionSubnet**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez Azure Bastion avec la référence SKU Basic dans un réseau virtuel nommé **VNet1**. Vous prévoyez d'associer un groupe de sécurité réseau à **AzureBastionSubnet**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The network security group must allow inbound TCP 443 from the GatewayManager service tag.
        fr: Le groupe de sécurité réseau doit autoriser le trafic TCP 443 entrant depuis l'étiquette de service GatewayManager.
    - id: s2
      text:
        en: The network security group must allow inbound TCP 3389 from the Internet service tag so that users can open RDP sessions.
        fr: Le groupe de sécurité réseau doit autoriser le trafic TCP 3389 entrant depuis l'étiquette de service Internet pour que les utilisateurs puissent ouvrir des sessions RDP.
    - id: s3
      text:
        en: The network security group must allow outbound traffic on port 80 to the Internet service tag.
        fr: Le groupe de sécurité réseau doit autoriser le trafic sortant sur le port 80 vers l'étiquette de service Internet.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      If you associate an NSG with AzureBastionSubnet, it must contain every required rule. Inbound TCP 443 from GatewayManager carries the control plane. Users reach Bastion over HTTPS (443), so 3389 and 22 aren't needed inbound on AzureBastionSubnet; only the target VM subnets allow them, from the Bastion subnet. Outbound port 80 to Internet is used for session and certificate validation.
    fr: |
      Si vous associez un NSG à AzureBastionSubnet, il doit contenir toutes les règles requises. Le trafic TCP 443 entrant depuis GatewayManager transporte le plan de contrôle. Les utilisateurs joignent Bastion en HTTPS (443) : les ports 3389 et 22 ne sont pas nécessaires en entrée sur AzureBastionSubnet ; seuls les sous-réseaux des machines virtuelles cibles les autorisent, depuis le sous-réseau Bastion. Le port 80 sortant vers Internet sert à la validation des sessions et des certificats.
references:
  - title: Configure NSG rules for Azure Bastion
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-nsg
