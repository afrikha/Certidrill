id: az700-5b-fw-rules-dnat-multi
objective: "5.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An Azure Firewall named **FW1** has the public IP address 20.80.4.10 and the private IP address 10.0.1.4. A virtual machine named **VM-SFTP** (10.30.1.10) runs an SFTP server in a spoke subnet that routes 0.0.0.0/0 to FW1.

    Partners in 198.51.100.0/24 must connect to VM-SFTP over the internet by using TCP port 2222 on the public IP address of FW1. In the firewall policy of FW1, you create a DNAT rule with the source 198.51.100.0/24, the destination 20.80.4.10:2222 and the translated address 10.30.1.10:22.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Un Pare-feu Azure nommé **FW1** a l'adresse IP publique 20.80.4.10 et l'adresse IP privée 10.0.1.4. Une machine virtuelle nommée **VM-SFTP** (10.30.1.10) exécute un serveur SFTP dans un sous-réseau spoke qui route 0.0.0.0/0 vers FW1.

    Des partenaires de 198.51.100.0/24 doivent se connecter à VM-SFTP par Internet sur le port TCP 2222 de l'adresse IP publique de FW1. Dans la stratégie de pare-feu de FW1, vous créez une règle DNAT avec la source 198.51.100.0/24, la destination 20.80.4.10:2222 et l'adresse traduite 10.30.1.10:22.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A network rule that allows TCP 22 from 198.51.100.0/24 to 10.30.1.10 is also required.", fr: "Une règle de réseau qui autorise TCP 22 de 198.51.100.0/24 vers 10.30.1.10 est aussi nécessaire." } }
    - { id: b, text: { en: "Connections that match the DNAT rule aren't evaluated against the network rule collections.", fr: "Les connexions qui correspondent à la règle DNAT ne sont pas évaluées par les collections de règles de réseau." } }
    - { id: c, text: { en: "An application rule can filter the SFTP sessions by FQDN after the translation.", fr: "Une règle d'application peut filtrer les sessions SFTP par FQDN après la traduction." } }
    - { id: d, text: { en: "If forced tunneling were enabled on FW1, the partners couldn't use this DNAT rule.", fr: "Si le tunneling forcé était activé sur FW1, les partenaires ne pourraient pas utiliser cette règle DNAT." } }
    - { id: e, text: { en: "The translated address of the rule must be the private IP address of FW1.", fr: "L'adresse traduite de la règle doit être l'adresse IP privée de FW1." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      DNAT rules are processed before network rules; when a connection matches, the firewall translates it and allows it, without further network rule processing. DNAT isn't supported when forced tunneling is enabled, because inbound internet connections would return through the on-premises path (asymmetric routing).
    fr: |
      Les règles DNAT sont traitées avant les règles de réseau ; quand une connexion correspond, le pare-feu la traduit et l'autorise, sans autre traitement par les règles de réseau. Le DNAT n'est pas pris en charge quand le tunneling forcé est activé, car les connexions entrantes depuis Internet repartiraient par le chemin local (routage asymétrique).
  options:
    a: { en: "A DNAT match already allows the translated traffic; no network rule is needed.", fr: "Une correspondance DNAT autorise déjà le trafic traduit ; aucune règle de réseau n'est nécessaire." }
    c: { en: "Application rules don't apply to inbound connections, and they only handle HTTP, HTTPS and MSSQL.", fr: "Les règles d'application ne s'appliquent pas aux connexions entrantes, et elles ne gèrent que HTTP, HTTPS et MSSQL." }
    e: { en: "The translated address is the internal server (10.30.1.10); the firewall's address is the destination the partners connect to.", fr: "L'adresse traduite est celle du serveur interne (10.30.1.10) ; l'adresse du pare-feu est la destination à laquelle les partenaires se connectent." }
references:
  - title: Azure Firewall rule processing logic
    url: https://learn.microsoft.com/en-us/azure/firewall/rule-processing
  - title: Azure Firewall forced tunneling
    url: https://learn.microsoft.com/en-us/azure/firewall/forced-tunneling
