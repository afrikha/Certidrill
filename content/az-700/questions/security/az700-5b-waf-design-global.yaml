id: az700-5b-waf-design-global
objective: "5.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs a public web application in the East US and Southeast Asia regions. Its users are located worldwide.

    You need to design a web application firewall solution that:

    - blocks malicious requests close to the users, before they reach the Azure regions;
    - uses Microsoft-managed rule sets and bot protection.

    What should you include in the design?
  fr: |
    Fabrikam exécute une application web publique dans les régions East US et Southeast Asia. Ses utilisateurs se trouvent dans le monde entier.

    Vous devez concevoir une solution de pare-feu d'applications web qui :

    - bloque les requêtes malveillantes près des utilisateurs, avant qu'elles n'atteignent les régions Azure ;
    - utilise des ensembles de règles managés par Microsoft et une protection contre les bots.

    Que devez-vous inclure dans la conception ?
body:
  options:
    - id: c
      text: { en: "An Application Gateway WAF_v2 with a WAF policy in each region", fr: "Une passerelle Application Gateway WAF_v2 avec une stratégie WAF dans chaque région" }
    - id: b
      text: { en: "An Azure Front Door Standard profile with a WAF policy", fr: "Un profil Azure Front Door Standard avec une stratégie WAF" }
    - id: a
      text: { en: "An Azure Front Door Premium profile with a WAF policy", fr: "Un profil Azure Front Door Premium avec une stratégie WAF" }
    - id: d
      text: { en: "An Azure Firewall Premium with IDPS in each regional hub", fr: "Un Pare-feu Azure Premium avec IDPS dans chaque hub régional" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Front Door applies its WAF policy at the Microsoft edge locations, so requests are filtered near the clients before they reach the origins. Managed rule sets (DRS) and Bot Manager are available on Front Door Premium.
    fr: |
      Front Door applique sa stratégie WAF dans les emplacements de périphérie Microsoft : les requêtes sont filtrées près des clients, avant d'atteindre les origines. Les ensembles de règles managés (DRS) et Bot Manager sont disponibles sur Front Door Premium.
  options:
    c: { en: "Application Gateway is regional: attacks are only stopped once they reach each region.", fr: "Application Gateway est régional : les attaques ne sont arrêtées qu'une fois arrivées dans chaque région." }
    b: { en: "On Front Door Standard, the WAF supports custom rules only, without managed rule sets or bot protection.", fr: "Sur Front Door Standard, le WAF ne prend en charge que les règles personnalisées, sans ensembles de règles managés ni protection contre les bots." }
    d: { en: "Azure Firewall runs in the regions and isn't an edge web application firewall.", fr: "Le Pare-feu Azure s'exécute dans les régions et n'est pas un pare-feu d'applications web en périphérie." }
references:
  - title: Azure Web Application Firewall on Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/afds-overview
