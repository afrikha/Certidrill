id: az700-5a-assoc-replace-nsg
objective: "5.1.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    A subnet named **snet-web** in a virtual network named **VNet1** (West Europe) is associated with a network security group named **NSG-Legacy**. NSG-Legacy allows TCP 443 from the internet and contains many obsolete rules. The web servers in snet-web have Standard SKU public IP addresses, and their network interfaces have no network security group.

    You need to replace NSG-Legacy with a new network security group named **NSG-Web** that allows only TCP 443 from the internet, and then remove NSG-Legacy. New HTTPS connections to the web servers must be accepted during the entire change.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un sous-réseau nommé **snet-web** d'un réseau virtuel nommé **VNet1** (West Europe) est associé à un groupe de sécurité réseau nommé **NSG-Legacy**. NSG-Legacy autorise TCP 443 depuis Internet et contient de nombreuses règles obsolètes. Les serveurs web de snet-web possèdent des adresses IP publiques de référence SKU Standard, et leurs interfaces réseau n'ont pas de groupe de sécurité réseau.

    Vous devez remplacer NSG-Legacy par un nouveau groupe de sécurité réseau nommé **NSG-Web** qui n'autorise que TCP 443 depuis Internet, puis supprimer NSG-Legacy. Les nouvelles connexions HTTPS vers les serveurs web doivent être acceptées pendant toute la durée du changement.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create NSG-Web in the West Europe region.", fr: "Créer NSG-Web dans la région West Europe." } }
    - { id: rule, text: { en: "Add an inbound rule to NSG-Web that allows TCP 443 from the Internet service tag.", fr: "Ajouter à NSG-Web une règle entrante qui autorise TCP 443 depuis l'étiquette de service Internet." } }
    - { id: assoc, text: { en: "Associate NSG-Web with snet-web.", fr: "Associer NSG-Web à snet-web." } }
    - { id: del, text: { en: "Delete NSG-Legacy.", fr: "Supprimer NSG-Legacy." } }
    - { id: dis, text: { en: "Dissociate NSG-Legacy from snet-web.", fr: "Dissocier NSG-Legacy de snet-web." } }
    - { id: nic, text: { en: "Associate NSG-Web with the network interface of each web server.", fr: "Associer NSG-Web à l'interface réseau de chaque serveur web." } }
    - { id: deny, text: { en: "Add an inbound rule to NSG-Web that denies all traffic with priority 100.", fr: "Ajouter à NSG-Web une règle entrante qui refuse tout le trafic avec la priorité 100." } }
answer:
  sequence: [ create, rule, assoc, del ]
explanation:
  correct:
    en: |
      Add the HTTPS rule before you associate NSG-Web; otherwise DenyAllInbound would reject new connections as soon as the NSG is applied. A subnet has at most one NSG, so associating NSG-Web replaces NSG-Legacy in one step. NSG-Legacy then has no association left and can be deleted.
    fr: |
      Ajoutez la règle HTTPS avant d'associer NSG-Web ; sinon, DenyAllInbound rejetterait les nouvelles connexions dès l'application du NSG. Un sous-réseau a au plus un NSG : associer NSG-Web remplace NSG-Legacy en une seule étape. NSG-Legacy n'a alors plus d'association et peut être supprimé.
  options:
    dis: { en: "Dissociating first leaves the subnet without an NSG; Standard public IP addresses then block inbound traffic.", fr: "Dissocier d'abord laisse le sous-réseau sans NSG ; les adresses IP publiques Standard bloquent alors le trafic entrant." }
    nic: { en: "The requirement is a subnet-level replacement; interface NSGs would add a second evaluation level.", fr: "L'exigence porte sur un remplacement au niveau du sous-réseau ; des NSG d'interface ajouteraient un second niveau d'évaluation." }
    deny: { en: "A deny-all rule at priority 100 would be evaluated before the HTTPS rule and block it.", fr: "Une règle de refus total de priorité 100 serait évaluée avant la règle HTTPS et la bloquerait." }
references:
  - title: Create, Change, or Delete Azure Network Security Groups
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-network-security-group
  - title: How network security groups filter network traffic
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works
