id: az700-sr2-fw-fqdn-3
objective: "5.2.5"
type: series_yesno
series: az700-sr2-fw-fqdn
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You enable DNS proxy and add a network rule with an FQDN destination.
  fr: Vous activez le proxy DNS et ajoutez une règle réseau avec une destination FQDN.
body:
  solution:
    en: |
      You enable DNS proxy in the DNS settings of FWPolicy1. You set the DNS servers of Spoke1 to the custom address 10.0.1.4 and restart the virtual machines. In RCG-Platform, you create a network rule collection named NRC-Updates with priority 200 and action Allow. It contains a rule with source 10.20.1.0/24, protocol TCP, destination type FQDN `updates.fabrikam.com`, and port 443.
    fr: |
      Vous activez le proxy DNS dans les paramètres DNS de FWPolicy1. Vous définissez les serveurs DNS de Spoke1 sur l'adresse personnalisée 10.0.1.4 et redémarrez les machines virtuelles. Dans RCG-Platform, vous créez une collection de règles réseau nommée NRC-Updates de priorité 200 et d'action Allow. Elle contient une règle avec la source 10.20.1.0/24, le protocole TCP, une destination de type FQDN `updates.fabrikam.com` et le port 443.
answer: { value: true }
explanation:
  correct:
    en: |
      With DNS proxy enabled and the virtual machines using the firewall as their DNS server, FW1 can resolve the FQDN of the network rule consistently with the clients. Inside RCG-Platform, NRC-Updates (priority 200) is processed before NRC-DenyWeb (priority 300), so the HTTPS connection is allowed and NRC-DenyWeb stays unchanged.
    fr: |
      Avec le proxy DNS activé et des machines virtuelles qui utilisent le pare-feu comme serveur DNS, FW1 résout le FQDN de la règle réseau de manière cohérente avec les clients. Dans RCG-Platform, NRC-Updates (priorité 200) est traitée avant NRC-DenyWeb (priorité 300) : la connexion HTTPS est autorisée et NRC-DenyWeb reste inchangée.
references:
