id: az700-5b-waf-mode-afd-cli
objective: "5.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank publishes its website through an Azure Front Door Premium profile. You need to create a WAF policy for the profile that meets the following requirements:

    - Requests that match the rules must be stopped, not only logged.
    - Blocked clients must receive the HTTP status code 429 instead of the default status code.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank publie son site web par un profil Azure Front Door Premium. Vous devez créer pour ce profil une stratégie WAF qui répond aux exigences suivantes :

    - Les requêtes qui correspondent aux règles doivent être arrêtées, pas seulement journalisées.
    - Les clients bloqués doivent recevoir le code d'état HTTP 429 au lieu du code d'état par défaut.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network front-door waf-policy create -g RG-Edge -n wafWoodgrove \
      --sku [[sku]] \
      --mode [[mode]] \
      --custom-block-response-status-code [[code]]
  slots:
    - id: sku
      options:
        - { id: prem, text: Premium_AzureFrontDoor }
        - { id: std, text: Standard_AzureFrontDoor }
        - { id: classic, text: Classic_AzureFrontDoor }
    - id: mode
      options:
        - { id: prev, text: Prevention }
        - { id: det, text: Detection }
        - { id: enabled, text: Enabled }
    - id: code
      options:
        - { id: c403, text: "403" }
        - { id: c429, text: "429" }
        - { id: c503, text: "503" }
answer:
  values: { sku: prem, mode: prev, code: c429 }
explanation:
  correct:
    en: |
      The policy SKU must match the tier of the Front Door profile, here Premium_AzureFrontDoor. Prevention mode applies the rule actions (block), while Detection only logs. The custom block response status code replaces the default 403; 429 Too many requests is one of the allowed values (200, 403, 405, 406, 429).
    fr: |
      La SKU de la stratégie doit correspondre au niveau du profil Front Door, ici Premium_AzureFrontDoor. Le mode de prévention applique les actions des règles (blocage), alors que le mode de détection se contente de journaliser. Le code d'état de la réponse de blocage personnalisée remplace le 403 par défaut ; 429 Too many requests fait partie des valeurs autorisées (200, 403, 405, 406, 429).
  options:
    std: { en: "The policy is for a Premium profile.", fr: "La stratégie est destinée à un profil Premium." }
    classic: { en: "Classic_AzureFrontDoor is for Front Door (classic) profiles.", fr: "Classic_AzureFrontDoor est destiné aux profils Front Door (classique)." }
    det: { en: "Detection mode logs matching requests without blocking them.", fr: "Le mode de détection journalise les requêtes correspondantes sans les bloquer." }
    enabled: { en: "Enabled is a policy state, not a mode.", fr: "Enabled est un état de stratégie, pas un mode." }
    c403: { en: "403 is the default status code, which must be replaced.", fr: "403 est le code d'état par défaut, qu'il faut remplacer." }
    c503: { en: "503 isn't one of the status codes allowed for a custom block response.", fr: "503 ne fait pas partie des codes d'état autorisés pour une réponse de blocage personnalisée." }
references:
  - title: az network front-door waf-policy
    url: https://learn.microsoft.com/en-us/cli/azure/network/front-door/waf-policy?view=azure-cli-latest
  - title: Policy settings for Web Application Firewall in Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-policy-settings
