id: az700-5a-bastion-subnet
objective: "5.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A virtual network named **VNet-Hub** has the address space 10.0.0.0/16. The range 10.0.255.0/24 is unused.

    You need to deploy Azure Bastion with the Standard SKU to VNet-Hub so that administrators can manage virtual machines without exposing RDP or SSH to the internet. The solution must minimize the address space used.

    Which subnet should you create?
  fr: |
    Un réseau virtuel nommé **VNet-Hub** a l'espace d'adressage 10.0.0.0/16. La plage 10.0.255.0/24 est inutilisée.

    Vous devez déployer Azure Bastion avec la référence SKU Standard dans VNet-Hub pour que les administrateurs gèrent les machines virtuelles sans exposer RDP ni SSH sur Internet. La solution doit utiliser le moins d'espace d'adressage possible.

    Quel sous-réseau devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A subnet named AzureBastionSubnet with the prefix 10.0.255.0/27", fr: "Un sous-réseau nommé AzureBastionSubnet avec le préfixe 10.0.255.0/27" } }
    - { id: b, text: { en: "A subnet named AzureBastionSubnet with the prefix 10.0.255.0/26", fr: "Un sous-réseau nommé AzureBastionSubnet avec le préfixe 10.0.255.0/26" } }
    - { id: c, text: { en: "A subnet named BastionSubnet with the prefix 10.0.255.0/26", fr: "Un sous-réseau nommé BastionSubnet avec le préfixe 10.0.255.0/26" } }
    - { id: d, text: { en: "A subnet named AzureBastionSubnet with the prefix 10.0.255.0/28", fr: "Un sous-réseau nommé AzureBastionSubnet avec le préfixe 10.0.255.0/28" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Every Bastion SKU except Developer is deployed to a dedicated subnet that must be named AzureBastionSubnet. New deployments require a prefix of /26 or larger, so /26 is the smallest valid choice.
    fr: |
      Toutes les références SKU de Bastion sauf Developer se déploient dans un sous-réseau dédié qui doit s'appeler AzureBastionSubnet. Les nouveaux déploiements exigent un préfixe /26 ou plus grand : /26 est donc le plus petit choix valide.
  options:
    a: { en: "Existing /27 subnets keep working, but new deployments require /26 or larger.", fr: "Les sous-réseaux /27 existants continuent de fonctionner, mais les nouveaux déploiements exigent /26 ou plus." }
    c: { en: "The subnet name must be exactly AzureBastionSubnet.", fr: "Le sous-réseau doit s'appeler exactement AzureBastionSubnet." }
    d: { en: "A /28 is smaller than the /26 minimum.", fr: "Un /28 est plus petit que le minimum de /26." }
references:
  - title: About Azure Bastion configuration settings
    url: https://learn.microsoft.com/en-us/azure/bastion/configuration-settings
