id: az700-5b-waf-feat-dragdrop
objective: "5.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware publishes a customer portal through an Azure Application Gateway WAF_v2 that uses a WAF policy with the Default Rule Set (DRS) 2.2. You need to meet the following requirements.

    Which WAF feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware publie un portail client par une passerelle Azure Application Gateway WAF_v2 qui utilise une stratégie WAF avec le Default Rule Set (DRS) 2.2. Vous devez répondre aux exigences suivantes.

    Quelle fonctionnalité WAF devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: rate, text: { en: "A rate limit custom rule", fr: "Une règle personnalisée de limitation de débit" } }
    - { id: match, text: { en: "A match custom rule", fr: "Une règle personnalisée de correspondance" } }
    - { id: excl, text: { en: "An exclusion", fr: "Une exclusion" } }
    - { id: bot, text: { en: "The Bot Manager rule set", fr: "L'ensemble de règles Bot Manager" } }
    - { id: upload, text: { en: "The file upload limit", fr: "La limite de chargement de fichiers" } }
    - { id: detect, text: { en: "Detection mode", fr: "Le mode de détection" } }
  targets:
    - id: t1
      text: { en: "Limit each client IP address to 100 requests per minute on the /signin path", fr: "Limiter chaque adresse IP cliente à 100 requêtes par minute sur le chemin /signin" }
    - id: t2
      text: { en: "Block every request to /partner/* whose `X-Client-Version` header equals `1.0`", fr: "Bloquer toute requête vers /partner/* dont l'en-tête `X-Client-Version` vaut `1.0`" }
    - id: t3
      text: { en: "Stop the managed rules from flagging a `__RequestToken` form field that legitimately contains special characters", fr: "Empêcher les règles managées de signaler un champ de formulaire `__RequestToken` qui contient légitimement des caractères spéciaux" }
    - id: t4
      text: { en: "Block known malicious crawlers while still allowing verified search engine crawlers", fr: "Bloquer les robots d'exploration malveillants connus tout en autorisant les robots des moteurs de recherche vérifiés" }
answer:
  mapping: { t1: rate, t2: match, t3: excl, t4: bot }
explanation:
  correct:
    en: |
      A rate limit rule counts the requests that match its condition (here the /signin path), grouped by client address by default, against a threshold. A match rule with one condition on the URI and one on the header (conditions in a rule are combined with AND) blocks the old clients. An exclusion removes a specific request attribute from managed rule evaluation to fix a false positive. The Bot Manager rule set blocks bad bots and allows verified good bots such as search engine crawlers by default.
    fr: |
      Une règle de limitation de débit compte les requêtes qui correspondent à sa condition (ici le chemin /signin), regroupées par défaut par adresse du client, par rapport à un seuil. Une règle de correspondance avec une condition sur l'URI et une sur l'en-tête (les conditions d'une règle se combinent par AND) bloque les anciens clients. Une exclusion retire un attribut précis de la requête de l'évaluation des règles managées pour corriger un faux positif. L'ensemble de règles Bot Manager bloque par défaut les bots malveillants et autorise les bons bots vérifiés comme les robots des moteurs de recherche.
references:
  - title: Rate limiting for Azure Web Application Firewall on Azure Application Gateway
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/rate-limiting-overview
  - title: What is Azure Web Application Firewall on Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
