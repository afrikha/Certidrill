id: az700-sr1-firewall-url-idps-2
objective: "5.2.2"
type: series_yesno
series: az700-sr1-firewall-url-idps
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: |
    You deploy Azure Firewall Premium with IDPS and a URL rule, without TLS inspection.
  fr: |
    Vous déployez Pare-feu Azure Premium avec l'IDPS et une règle d'URL, sans inspection TLS.
body:
  solution:
    en: |
      You deploy **Azure Firewall Premium** with a Premium firewall policy. In the policy, you set the IDPS mode to **Alert and deny**, and you create an application rule for HTTPS whose destination is the target URL **api.fabrikam.com/v2/orders**. You don't configure an intermediate CA certificate or TLS inspection.
    fr: |
      Vous déployez **Pare-feu Azure Premium** avec une stratégie de pare-feu Premium. Dans la stratégie, vous définissez le mode IDPS sur **Alert and deny**, et vous créez une règle d'application pour HTTPS dont la destination est l'URL cible **api.fabrikam.com/v2/orders**. Vous ne configurez ni certificat d'autorité de certification intermédiaire ni inspection TLS.
answer: { value: false }
explanation:
  correct:
    en: |
      The path of an HTTPS request is encrypted: to filter HTTPS on a full URL, Azure Firewall Premium must decrypt the traffic, which requires TLS inspection enabled on the application rule and an intermediate CA certificate in the policy. Without decryption, IDPS also sees only the encrypted payload of HTTPS sessions and can't match attack signatures inside it. Both requirements depend on TLS inspection.
    fr: |
      Le chemin d'une requête HTTPS est chiffré : pour filtrer HTTPS sur une URL complète, Pare-feu Azure Premium doit déchiffrer le trafic, ce qui exige l'inspection TLS activée sur la règle d'application et un certificat d'autorité de certification intermédiaire dans la stratégie. Sans déchiffrement, l'IDPS ne voit lui aussi que la charge utile chiffrée des sessions HTTPS et ne peut pas y détecter de signatures d'attaques. Les deux exigences dépendent de l'inspection TLS.
references:
  - title: Azure Firewall Premium features implementation guide
    url: https://learn.microsoft.com/en-us/azure/firewall/premium-features
