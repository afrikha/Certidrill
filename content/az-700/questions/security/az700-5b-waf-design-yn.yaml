id: az700-5b-waf-design-yn
objective: "5.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso is designing web application protection for two workloads: a global website behind an Azure Front Door Premium profile named **afd-contoso**, and a regional portal behind an Azure Application Gateway named **agw-portal**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso conçoit la protection des applications web de deux charges de travail : un site web mondial derrière un profil Azure Front Door Premium nommé **afd-contoso**, et un portail régional derrière une passerelle Azure Application Gateway nommée **agw-portal**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can associate one Regional WAF (Application Gateway) policy with both afd-contoso and agw-portal.
        fr: Vous pouvez associer une même stratégie Regional WAF (Application Gateway) à afd-contoso et à agw-portal.
    - id: s2
      text:
        en: To associate WAF policies with the listeners of agw-portal, agw-portal must use the WAF_v2 SKU.
        fr: Pour associer des stratégies WAF aux écouteurs d'agw-portal, agw-portal doit utiliser la référence SKU WAF_v2.
    - id: s3
      text:
        en: A rate limit rule in the WAF policy of afd-contoso counts the requests of a client across all Front Door edge locations together.
        fr: Une règle de limitation de débit de la stratégie WAF d'afd-contoso compte les requêtes d'un client sur l'ensemble des emplacements de périphérie Front Door réunis.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      WAF policies are created for one platform: Global WAF (Front Door) policies for Front Door and Regional WAF (Application Gateway) policies for Application Gateway. Policy associations with a gateway, listener or path-based rule are supported only on WAF_v2. Front Door rate limit counters are kept per edge location and aren't aggregated globally, so a client can reach the threshold at each location.
    fr: |
      Les stratégies WAF sont créées pour une plateforme : stratégies Global WAF (Front Door) pour Front Door et stratégies Regional WAF (Application Gateway) pour Application Gateway. Les associations de stratégies à une passerelle, un écouteur ou une règle basée sur le chemin ne sont prises en charge que sur WAF_v2. Les compteurs de limitation de débit de Front Door sont tenus par emplacement de périphérie et ne sont pas agrégés globalement : un client peut atteindre le seuil dans chaque emplacement.
references:
  - title: What is rate limiting for Azure Front Door?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-rate-limit
  - title: Azure Web Application Firewall (WAF) policy overview
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/policy-overview
