id: az700-cs3b-policy-inheritance
objective: "5.2.6"
type: multi
caseStudy: az700-cs3b-bellows
difficulty: 2
status: draft
stem:
  en: |
    The security team adds a network rule collection to Policy-Base. The central IT team adds to Policy-Hub a network rule collection that has a lower priority number and an application rule collection.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe sécurité ajoute une collection de règles réseau à Policy-Base. L'équipe informatique centrale ajoute à Policy-Hub une collection de règles réseau dont le numéro de priorité est plus petit, ainsi qu'une collection de règles d'application.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "FW-Hub processes the network rule collection of Policy-Base before the network rule collection of Policy-Hub.", fr: "FW-Hub traite la collection de règles réseau de Policy-Base avant la collection de règles réseau de Policy-Hub." } }
    - { id: b, text: { en: "FW-Hub processes the application rule collection of Policy-Hub before the network rule collection of Policy-Base.", fr: "FW-Hub traite la collection de règles d'application de Policy-Hub avant la collection de règles réseau de Policy-Base." } }
    - { id: c, text: { en: "The central IT team can set the threat intelligence mode of Policy-Hub to Alert and deny.", fr: "L'équipe informatique centrale peut définir le mode de renseignement sur les menaces de Policy-Hub sur Alert and deny." } }
    - { id: d, text: { en: "The central IT team can set the threat intelligence mode of Policy-Hub to Off.", fr: "L'équipe informatique centrale peut définir le mode de renseignement sur les menaces de Policy-Hub sur Off." } }
    - { id: e, text: { en: "A DNAT rule collection that the security team adds to Policy-Base applies to FW-Hub.", fr: "Une collection de règles DNAT que l'équipe sécurité ajoute à Policy-Base s'applique à FW-Hub." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Network rule collections inherited from a parent policy always take precedence over the network rule collections of the child policy, whatever their priority numbers. A child policy inherits the threat intelligence mode and can only make it stricter, so Alert and deny is allowed but Off isn't.
    fr: |
      Les collections de règles réseau héritées d'une stratégie parente sont toujours prioritaires sur les collections de règles réseau de la stratégie enfant, quels que soient leurs numéros de priorité. Une stratégie enfant hérite du mode de renseignement sur les menaces et ne peut que le rendre plus strict : Alert and deny est autorisé, mais pas Off.
  options:
    b: { en: "Network rule collections are processed before application rule collections, regardless of inheritance.", fr: "Les collections de règles réseau sont traitées avant les collections de règles d'application, quel que soit l'héritage." }
    d: { en: "A child policy can't weaken the inherited threat intelligence mode, and Off would disable it.", fr: "Une stratégie enfant ne peut pas affaiblir le mode de renseignement sur les menaces hérité, et Off le désactiverait." }
    e: { en: "NAT rule collections aren't inherited because they're specific to each firewall; DNAT rules must be defined in Policy-Hub.", fr: "Les collections de règles NAT ne sont pas héritées, car elles sont propres à chaque pare-feu ; les règles DNAT doivent être définies dans Policy-Hub." }
references:
  - title: Azure Firewall Manager policy overview
    url: https://learn.microsoft.com/en-us/azure/firewall-manager/policy-overview
