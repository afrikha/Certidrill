id: az700-cs1c-routing-intent
objective: "5.2.7"
type: single
caseStudy: az700-cs1c-wingtip-toys
difficulty: 3
status: draft
stem:
  en: FW-Hub is deployed to hub-gwc. You need to meet the security requirements. What should you configure?
  fr: FW-Hub est déployé dans hub-gwc. Vous devez respecter les exigences de sécurité. Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Routing intent on hub-gwc with a Private traffic routing policy only, with FW-Hub as the next hop", fr: "L'intention de routage sur hub-gwc avec une stratégie de routage du trafic privé (Private) uniquement, avec FW-Hub comme tronçon suivant" } }
    - { id: b, text: { en: "Routing intent on hub-gwc with an Internet traffic routing policy and a Private traffic routing policy, both with FW-Hub as the next hop", fr: "L'intention de routage sur hub-gwc avec une stratégie de routage du trafic Internet et une stratégie de routage du trafic privé (Private), toutes deux avec FW-Hub comme tronçon suivant" } }
    - { id: c, text: { en: "Routing intent on hub-gwc with an Internet traffic routing policy only, with FW-Hub as the next hop", fr: "L'intention de routage sur hub-gwc avec une stratégie de routage du trafic Internet uniquement, avec FW-Hub comme tronçon suivant" } }
    - { id: d, text: { en: "A static route for 0.0.0.0/0 with FW-Hub as the next hop in the default route table of hub-gwc", fr: "Un itinéraire statique pour 0.0.0.0/0 avec FW-Hub comme tronçon suivant dans la table de routage par défaut de hub-gwc" } }
answer: { optionId: b }
explanation:
  correct:
    en: The Private traffic routing policy sends branch-to-VNet and VNet-to-VNet traffic through FW-Hub, and the Internet traffic routing policy sends the internet-bound traffic of the virtual networks through it by advertising 0.0.0.0/0 to the connections. Routing intent manages the hub routing, so nothing has to be configured inside VNet-POS or VNet-Inventory.
    fr: "La stratégie de routage du trafic privé fait passer par FW-Hub le trafic entre les branches et les réseaux virtuels et entre réseaux virtuels, et la stratégie de routage du trafic Internet y fait passer le trafic à destination d'Internet des réseaux virtuels en annonçant 0.0.0.0/0 aux connexions. L'intention de routage gère le routage du hub : rien n'est à configurer dans VNet-POS ni dans VNet-Inventory."
  options:
    a:
      en: A Private traffic routing policy alone doesn't send the internet-bound traffic of the virtual networks to FW-Hub.
      fr: Une stratégie de routage du trafic privé seule n'envoie pas à FW-Hub le trafic à destination d'Internet des réseaux virtuels.
    c:
      en: An Internet traffic routing policy alone doesn't inspect the traffic between the stores and the virtual networks or between the two virtual networks.
      fr: Une stratégie de routage du trafic Internet seule n'inspecte ni le trafic entre les magasins et les réseaux virtuels, ni le trafic entre les deux réseaux virtuels.
    d:
      en: A default route only matches internet-bound traffic. The traffic between the stores and the virtual networks and between the two virtual networks uses more specific routes and would still bypass FW-Hub.
      fr: Un itinéraire par défaut ne correspond qu'au trafic à destination d'Internet. Le trafic entre les magasins et les réseaux virtuels et entre les deux réseaux virtuels utilise des itinéraires plus spécifiques et contournerait toujours FW-Hub.
references:
  - title: How to configure Virtual WAN Hub routing intent and routing policies
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies
