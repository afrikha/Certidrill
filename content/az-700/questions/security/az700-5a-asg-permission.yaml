id: az700-5a-asg-permission
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The security team of Fabrikam manages two application security groups named **asg-web** and **asg-app**. The application operations team must be able to add the network interfaces of its virtual machines to these existing application security groups. It must not be able to modify the groups or use them in security rules.

    You create a custom role for the operations team. The role already includes `Microsoft.Network/networkInterfaces/read` and `Microsoft.Network/networkInterfaces/write`.

    Which action on the application security groups should you add to the role?
  fr: |
    L'équipe de sécurité de Fabrikam gère deux groupes de sécurité d'application nommés **asg-web** et **asg-app**. L'équipe d'exploitation des applications doit pouvoir ajouter les interfaces réseau de ses machines virtuelles à ces groupes existants. Elle ne doit pas pouvoir modifier les groupes ni les utiliser dans des règles de sécurité.

    Vous créez un rôle personnalisé pour l'équipe d'exploitation. Le rôle inclut déjà `Microsoft.Network/networkInterfaces/read` et `Microsoft.Network/networkInterfaces/write`.

    Quelle action sur les groupes de sécurité d'application devez-vous ajouter au rôle ?
body:
  options:
    - { id: a, text: "Microsoft.Network/applicationSecurityGroups/write" }
    - { id: b, text: "Microsoft.Network/applicationSecurityGroups/joinNetworkSecurityRule/action" }
    - { id: c, text: "Microsoft.Network/networkSecurityGroups/join/action" }
    - { id: d, text: "Microsoft.Network/applicationSecurityGroups/joinIpConfiguration/action" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Adding a network interface IP configuration to an application security group requires the `joinIpConfiguration/action` permission on the ASG, in addition to write access to the interface. It doesn't allow changing the ASG or referencing it in rules.
    fr: |
      Ajouter une configuration IP d'interface réseau à un groupe de sécurité d'application exige l'autorisation `joinIpConfiguration/action` sur l'ASG, en plus de l'accès en écriture à l'interface. Elle ne permet ni de modifier l'ASG ni de le référencer dans des règles.
  options:
    a: { en: "write lets the team create and modify the application security groups.", fr: "write permet à l'équipe de créer et de modifier les groupes de sécurité d'application." }
    b: { en: "joinNetworkSecurityRule/action is needed to reference an ASG in a security rule, which the team must not do.", fr: "joinNetworkSecurityRule/action sert à référencer un ASG dans une règle de sécurité, ce que l'équipe ne doit pas faire." }
    c: { en: "This action associates a network security group with a subnet or an interface, not an ASG.", fr: "Cette action associe un groupe de sécurité réseau à un sous-réseau ou à une interface, pas un ASG." }
references:
  - title: Create, Change, or Delete Azure Network Security Groups
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-network-security-group
