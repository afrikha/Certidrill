id: az700-5b-waf-mode-anomaly
objective: "5.3.3"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    An Azure Application Gateway WAF_v2 uses a WAF policy in Prevention mode with the Default Rule Set (DRS) 2.2 and its default anomaly scoring settings. The policy has no custom rules.

    You send four test requests. Each request matches only the managed rules shown in the following table, and each matched rule is a different rule.

    | Request | Matched managed rules |
    | --- | --- |
    | R1 | One rule of severity Warning |
    | R2 | Two rules of severity Notice |
    | R3 | One rule of severity Error |
    | R4 | One rule of severity Warning and one rule of severity Notice |

    Which request is blocked?
  fr: |
    Une passerelle Azure Application Gateway WAF_v2 utilise une stratégie WAF en mode de prévention avec le Default Rule Set (DRS) 2.2 et ses paramètres de scoring d'anomalie par défaut. La stratégie n'a aucune règle personnalisée.

    Vous envoyez quatre requêtes de test. Chaque requête ne correspond qu'aux règles managées figurant dans le tableau suivant, et chaque règle correspondante est une règle différente.

    | Requête | Règles managées correspondantes |
    | --- | --- |
    | R1 | Une règle de gravité Warning |
    | R2 | Deux règles de gravité Notice |
    | R3 | Une règle de gravité Error |
    | R4 | Une règle de gravité Warning et une règle de gravité Notice |

    Quelle requête est bloquée ?
body:
  options:
    - { id: r1, text: R1 }
    - { id: r2, text: R2 }
    - { id: r3, text: R3 }
    - { id: r4, text: R4 }
answer: { optionId: r4 }
explanation:
  correct:
    en: |
      With anomaly scoring, each matched rule adds to the request's score according to its severity: Critical 5, Error 4, Warning 3, Notice 2. The request is blocked in Prevention mode only when the total reaches 5. R4 scores 3 + 2 = 5 and is blocked; R1 scores 3, R2 scores 4 and R3 scores 4, so they're only logged as Matched.
    fr: |
      Avec le scoring d'anomalie, chaque règle correspondante ajoute au score de la requête une valeur selon sa gravité : Critical 5, Error 4, Warning 3, Notice 2. La requête n'est bloquée en mode de prévention que lorsque le total atteint 5. R4 obtient 3 + 2 = 5 et est bloquée ; R1 obtient 3, R2 obtient 4 et R3 obtient 4 : elles sont seulement journalisées comme Matched.
  options:
    r1: { en: "A single Warning match adds 3, below the threshold of 5.", fr: "Une seule correspondance Warning ajoute 3, sous le seuil de 5." }
    r2: { en: "Two Notice matches add 2 + 2 = 4, below the threshold of 5.", fr: "Deux correspondances Notice ajoutent 2 + 2 = 4, sous le seuil de 5." }
    r3: { en: "An Error match adds 4, below the threshold of 5.", fr: "Une correspondance Error ajoute 4, sous le seuil de 5." }
references:
  - title: Application Gateway WAF CRS and DRS rule groups and rules
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/application-gateway-crs-rulegroups-rules
