id: az700-5a-fl-cli
objective: "5.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You need to record the IP flows of every subnet and network interface in a virtual network named **VNet-Hub** (West Europe). The flows must be stored in a storage account named **stflweu** and processed by traffic analytics in a Log Analytics workspace named **law-net** every 10 minutes.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez enregistrer les flux IP de tous les sous-réseaux et de toutes les interfaces réseau d'un réseau virtuel nommé **VNet-Hub** (West Europe). Les flux doivent être stockés dans un compte de stockage nommé **stflweu** et traités par l'analyse du trafic dans un espace de travail Log Analytics nommé **law-net** toutes les 10 minutes.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network watcher flow-log create \
      --location westeurope --resource-group RG-Net --name fl-vnet-hub \
      [[target]] VNet-Hub \
      --storage-account stflweu \
      [[ws]] law-net \
      --interval [[int]]
  slots:
    - id: target
      options:
        - { id: vnet, text: --vnet }
        - { id: nsg, text: --nsg }
        - { id: subnet, text: --subnet }
    - id: ws
      options:
        - { id: wsp, text: --workspace }
        - { id: ret, text: --retention }
        - { id: ena, text: --enabled }
    - id: int
      options:
        - { id: i1, text: "1" }
        - { id: i10, text: "10" }
        - { id: i60, text: "60" }
        - { id: i600, text: "600" }
answer:
  values: { target: vnet, ws: wsp, int: i10 }
explanation:
  correct:
    en: |
      `--vnet` creates a virtual network flow log that covers all the subnets and interfaces of VNet-Hub. `--workspace` names the Log Analytics workspace and turns traffic analytics on. `--interval` is expressed in minutes and accepts 10 or 60 (the default).
    fr: |
      `--vnet` crée un journal de flux de réseau virtuel qui couvre tous les sous-réseaux et toutes les interfaces de VNet-Hub. `--workspace` désigne l'espace de travail Log Analytics et active l'analyse du trafic. `--interval` s'exprime en minutes et accepte 10 ou 60 (valeur par défaut).
  options:
    nsg: { en: "--nsg targets a network security group, which corresponds to the retiring NSG flow logs.", fr: "--nsg cible un groupe de sécurité réseau, ce qui correspond aux journaux de flux NSG en cours de mise hors service." }
    subnet: { en: "--subnet would log a single subnet, not the whole virtual network.", fr: "--subnet journaliserait un seul sous-réseau, pas tout le réseau virtuel." }
    ret: { en: "--retention sets a number of days, not a workspace.", fr: "--retention définit un nombre de jours, pas un espace de travail." }
    ena: { en: "--enabled takes a Boolean value that enables logging.", fr: "--enabled prend une valeur booléenne qui active la journalisation." }
    i1: { en: "The interval is in minutes; only 10 and 60 are allowed.", fr: "L'intervalle est en minutes ; seules les valeurs 10 et 60 sont autorisées." }
    i60: { en: "60 minutes is the default, not the required 10 minutes.", fr: "60 minutes est la valeur par défaut, pas les 10 minutes exigées." }
    i600: { en: "The interval is in minutes; only 10 and 60 are allowed.", fr: "L'intervalle est en minutes ; seules les valeurs 10 et 60 sont autorisées." }
references:
  - title: az network watcher flow-log
    url: https://learn.microsoft.com/en-us/cli/azure/network/watcher/flow-log?view=azure-cli-latest
