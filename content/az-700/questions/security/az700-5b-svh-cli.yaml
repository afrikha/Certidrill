id: az700-5b-svh-cli
objective: "5.2.7"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Virtual WAN hub named **hub-weu** and a firewall policy named **FWP-Global**.

    You need to deploy an Azure Firewall Standard named **FW-HubWEU** in hub-weu with two public IP addresses, managed by FWP-Global.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous disposez d'un hub Azure Virtual WAN nommé **hub-weu** et d'une stratégie de pare-feu nommée **FWP-Global**.

    Vous devez déployer dans hub-weu un Pare-feu Azure Standard nommé **FW-HubWEU** avec deux adresses IP publiques, géré par FWP-Global.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network firewall create -g RG-WAN -n FW-HubWEU \
      --sku [[sku]] --tier Standard \
      [[hub]] hub-weu \
      [[ips]] 2 \
      --firewall-policy FWP-Global
  slots:
    - id: sku
      options:
        - { id: hub, text: AZFW_Hub }
        - { id: vnet, text: AZFW_VNet }
        - { id: std, text: Standard }
    - id: hub
      options:
        - { id: vhub, text: "--vhub" }
        - { id: vnet, text: "--vnet-name" }
        - { id: rs, text: "--route-server-id" }
    - id: ips
      options:
        - { id: count, text: "--public-ip-count" }
        - { id: pip, text: "--public-ip" }
        - { id: mpip, text: "--m-public-ip" }
answer:
  values: { sku: hub, hub: vhub, ips: count }
explanation:
  correct:
    en: |
      A firewall in a Virtual WAN hub uses the SKU AZFW_Hub and is attached with `--vhub` (alias `--virtual-hub`). In a hub, the public IP addresses are generated for you: `--public-ip-count` sets how many the firewall gets.
    fr: |
      Un pare-feu dans un hub Virtual WAN utilise la SKU AZFW_Hub et s'attache avec `--vhub` (alias `--virtual-hub`). Dans un hub, les adresses IP publiques sont générées pour vous : `--public-ip-count` définit leur nombre.
  options:
    vnet: { en: "AZFW_VNet and `--vnet-name` deploy the firewall in a virtual network that contains AzureFirewallSubnet, not in a Virtual WAN hub.", fr: "AZFW_VNet et `--vnet-name` déploient le pare-feu dans un réseau virtuel qui contient AzureFirewallSubnet, pas dans un hub Virtual WAN." }
    std: { en: "Standard is a `--tier` value.", fr: "Standard est une valeur de `--tier`." }
    rs: { en: "`--route-server-id` links the firewall to an Azure Route Server, not to a hub.", fr: "`--route-server-id` relie le pare-feu à un Azure Route Server, pas à un hub." }
    pip: { en: "`--public-ip` names an existing public IP for the data IP configuration of a virtual network firewall.", fr: "`--public-ip` désigne une IP publique existante pour la configuration IP de données d'un pare-feu de réseau virtuel." }
    mpip: { en: "`--m-public-ip` is the public IP of the management IP configuration.", fr: "`--m-public-ip` est l'IP publique de la configuration IP de gestion." }
references:
  - title: az network firewall
    url: https://learn.microsoft.com/en-us/cli/azure/network/firewall?view=azure-cli-latest
