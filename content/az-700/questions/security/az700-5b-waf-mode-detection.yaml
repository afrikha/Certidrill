id: az700-5b-waf-mode-detection
objective: "5.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You create a WAF policy named **WAFP-Shop** in the Azure portal with its default settings and the Default Rule Set (DRS) 2.2, and you associate it with an Azure Application Gateway WAF_v2. WAF logs are sent to a Log Analytics workspace.

    During a penetration test, SQL injection payloads sent in the query string reach the backend servers. The WAF logs show the matching requests with the action **Detected**.

    You need to ensure that these requests are stopped by the WAF.

    What should you do?
  fr: |
    Vous créez dans le portail Azure une stratégie WAF nommée **WAFP-Shop** avec ses paramètres par défaut et le Default Rule Set (DRS) 2.2, et vous l'associez à une passerelle Azure Application Gateway WAF_v2. Les journaux WAF sont envoyés à un espace de travail Log Analytics.

    Pendant un test d'intrusion, des charges utiles d'injection SQL envoyées dans la chaîne de requête atteignent les serveurs principaux. Les journaux WAF affichent les requêtes correspondantes avec l'action **Detected**.

    Vous devez vous assurer que ces requêtes sont arrêtées par le WAF.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a custom rule that blocks query strings that contain SELECT.", fr: "Ajouter une règle personnalisée qui bloque les chaînes de requête contenant SELECT." }
    - id: b
      text: { en: "Change the mode of WAFP-Shop to Prevention.", fr: "Passer WAFP-Shop en mode de prévention." }
    - id: c
      text: { en: "Enable request body inspection in WAFP-Shop.", fr: "Activer l'inspection du corps de la requête dans WAFP-Shop." }
    - id: d
      text: { en: "Replace DRS 2.2 with the OWASP CRS 3.2 rule set.", fr: "Remplacer DRS 2.2 par l'ensemble de règles OWASP CRS 3.2." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A WAF policy created in the portal starts in Detection mode, which only logs the requests that reach the anomaly threshold (action Detected). In Prevention mode, the same requests are blocked with a 403 response and logged as Blocked.
    fr: |
      Une stratégie WAF créée dans le portail démarre en mode de détection, qui se contente de journaliser les requêtes qui atteignent le seuil d'anomalie (action Detected). En mode de prévention, les mêmes requêtes sont bloquées avec une réponse 403 et journalisées comme Blocked.
  options:
    a: { en: "In Detection mode, a custom Block rule is also only logged; and DRS already detects these payloads.", fr: "En mode de détection, une règle personnalisée Block est elle aussi seulement journalisée ; et DRS détecte déjà ces charges utiles." }
    c: { en: "The payloads are in the query string and are already detected; body inspection doesn't change the mode.", fr: "Les charges utiles se trouvent dans la chaîne de requête et sont déjà détectées ; l'inspection du corps ne change pas le mode." }
    d: { en: "The rule set already detects the attack; changing it doesn't make the WAF block.", fr: "L'ensemble de règles détecte déjà l'attaque ; le changer ne fait pas bloquer le WAF." }
references:
  - title: Create Web Application Firewall policies for Application Gateway
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/create-waf-policy-ag
  - title: What is Azure Web Application Firewall on Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
