id: az700-5a-asg-add-member
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A virtual network named **VNet1** has one subnet named **Subnet1** that is associated with a network security group named **NSG1**. Subnet1 hosts the following virtual machines.

    | Virtual machine | Role | Application security group |
    | --- | --- | --- |
    | VM2, VM3 | Application servers | asg-app |
    | VM4 | SQL Server | asg-db |

    NSG1 contains the following inbound rules in addition to the default rules.

    | Priority | Name | Source | Destination | Port | Access |
    | --- | --- | --- | --- | --- | --- |
    | 110 | Allow-App-Db | asg-app | asg-db | TCP 1433 | Allow |
    | 120 | Deny-Db | Any | asg-db | 1433 (any protocol) | Deny |

    You deploy a new application server named **VM8** to Subnet1. VM8 must have the same database access as the other application servers. The solution must minimize changes to NSG1.

    What should you do?
  fr: |
    Un réseau virtuel nommé **VNet1** possède un sous-réseau nommé **Subnet1**, associé à un groupe de sécurité réseau nommé **NSG1**. Subnet1 héberge les machines virtuelles suivantes.

    | Machine virtuelle | Rôle | Groupe de sécurité d'application |
    | --- | --- | --- |
    | VM2, VM3 | Serveurs d'applications | asg-app |
    | VM4 | SQL Server | asg-db |

    Outre les règles par défaut, NSG1 contient les règles entrantes suivantes.

    | Priorité | Nom | Source | Destination | Port | Accès |
    | --- | --- | --- | --- | --- | --- |
    | 110 | Allow-App-Db | asg-app | asg-db | TCP 1433 | Allow |
    | 120 | Deny-Db | Any | asg-db | 1433 (tout protocole) | Deny |

    Vous déployez un nouveau serveur d'applications nommé **VM8** dans Subnet1. VM8 doit avoir le même accès à la base de données que les autres serveurs d'applications. La solution doit réduire au minimum les modifications de NSG1.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the network interface of VM8 to asg-db.", fr: "Ajouter l'interface réseau de VM8 à asg-db." } }
    - { id: b, text: { en: "Change the priority of Deny-Db to 4000.", fr: "Changer la priorité de Deny-Db en 4000." } }
    - { id: c, text: { en: "Add a rule with priority 130 that allows TCP 1433 from VM8 to asg-db.", fr: "Ajouter une règle de priorité 130 qui autorise TCP 1433 depuis VM8 vers asg-db." } }
    - { id: d, text: { en: "Add the network interface of VM8 to asg-app.", fr: "Ajouter l'interface réseau de VM8 à asg-app." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Rules that reference an ASG follow its members. Once the interface of VM8 joins asg-app, Allow-App-Db (110) matches its traffic to asg-db before Deny-Db (120), with no change to NSG1.
    fr: |
      Les règles qui référencent un ASG suivent ses membres. Dès que l'interface de VM8 rejoint asg-app, Allow-App-Db (110) correspond à son trafic vers asg-db avant Deny-Db (120), sans aucune modification de NSG1.
  options:
    a: { en: "Membership of asg-db makes VM8 a destination of the database rules, not a source allowed by Allow-App-Db.", fr: "Être membre d'asg-db fait de VM8 une destination des règles de base de données, pas une source autorisée par Allow-App-Db." }
    b: { en: "Deny-Db would still be evaluated before any allow rule for VM8, and the change modifies NSG1.", fr: "Deny-Db serait toujours évaluée avant toute règle d'autorisation pour VM8, et la modification touche NSG1." }
    c: { en: "A rule with priority 130 is evaluated after Deny-Db (120), which already denies the traffic.", fr: "Une règle de priorité 130 est évaluée après Deny-Db (120), qui refuse déjà le trafic." }
references:
  - title: Application security groups
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
