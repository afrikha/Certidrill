id: az700-5a-sku-facts
objective: "5.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are comparing the Azure Firewall SKUs for several projects. All the firewalls will be managed by firewall policies.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous comparez les références SKU du Pare-feu Azure pour plusieurs projets. Tous les pare-feu seront gérés par des stratégies de pare-feu.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure Firewall Basic can use threat intelligence to deny traffic from known malicious IP addresses.
        fr: Le Pare-feu Azure Basic peut utiliser le renseignement sur les menaces pour refuser le trafic issu d'adresses IP malveillantes connues.
    - id: s2
      text:
        en: When it's available for the firewall, the easy SKU change from Standard to Premium completes without downtime.
        fr: Quand il est disponible pour le pare-feu, le changement de SKU simplifié de Standard vers Premium s'effectue sans interruption.
    - id: s3
      text:
        en: You can change an existing Azure Firewall Basic to the Standard SKU in place.
        fr: Vous pouvez faire passer sur place un Pare-feu Azure Basic existant à la référence SKU Standard.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Threat intelligence in Basic works in alert mode only; Standard and Premium can alert and deny. The easy SKU change between Standard and Premium has zero downtime and usually completes in a few minutes. Basic doesn't support an in-place SKU change, and moving from Basic to Standard isn't supported.
    fr: |
      Le renseignement sur les menaces de Basic ne fonctionne qu'en mode alerte ; Standard et Premium peuvent alerter et refuser. Le changement de SKU simplifié entre Standard et Premium se fait sans interruption et se termine généralement en quelques minutes. Basic ne prend pas en charge le changement de SKU sur place, et le passage de Basic à Standard n'est pas pris en charge.
references:
  - title: Change Azure Firewall SKU
    url: https://learn.microsoft.com/en-us/azure/firewall/change-sku
  - title: Azure Firewall features by SKU
    url: https://learn.microsoft.com/en-us/azure/firewall/features-by-sku
