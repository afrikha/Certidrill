id: az700-5a-fl-tuple
objective: "5.1.7"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    A virtual network flow log (version 2) contains the following flow tuple in a flow group whose rule is `UserRule_Allow-Web`:

    `1763380800,198.51.100.23,10.3.1.5,50412,443,6,I,E,NX,18,2150,24,31800`

    The following table shows the fields of the tuple in order.

    Answer each prompt by selecting the appropriate value.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un journal de flux de réseau virtuel (version 2) contient le tuple de flux suivant, dans un groupe de flux dont la règle est `UserRule_Allow-Web` :

    `1763380800,198.51.100.23,10.3.1.5,50412,443,6,I,E,NX,18,2150,24,31800`

    Le tableau suivant présente les champs du tuple dans l'ordre.

    Répondez à chaque consigne en sélectionnant la valeur appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The value that shows that the connection has ended", fr: "La valeur qui indique que la connexion est terminée" }
    - id: p2
      text: { en: "The number of bytes that 10.3.1.5 sent to 198.51.100.23 since the previous record of this flow", fr: "Le nombre d'octets envoyés par 10.3.1.5 à 198.51.100.23 depuis l'enregistrement précédent de ce flux" }
  grid:
    header: [{ en: Position, fr: Position }, { en: Value, fr: Valeur }]
    rows:
      - [{ text: "1" }, { text: "1763380800", area: f1 }]
      - [{ text: "2" }, { text: "198.51.100.23", area: f2 }]
      - [{ text: "3" }, { text: "10.3.1.5", area: f3 }]
      - [{ text: "4" }, { text: "50412", area: f4 }]
      - [{ text: "5" }, { text: "443", area: f5 }]
      - [{ text: "6" }, { text: "6", area: f6 }]
      - [{ text: "7" }, { text: I, area: f7 }]
      - [{ text: "8" }, { text: E, area: f8 }]
      - [{ text: "9" }, { text: NX, area: f9 }]
      - [{ text: "10" }, { text: "18", area: f10 }]
      - [{ text: "11" }, { text: "2150", area: f11 }]
      - [{ text: "12" }, { text: "24", area: f12 }]
      - [{ text: "13" }, { text: "31800", area: f13 }]
answer:
  values: { p1: f8, p2: f13 }
explanation:
  correct:
    en: |
      Field 8 is the flow state: B (begin), C (continuing), E (end) or D (deny), so E marks the end of the connection. Fields 10 to 13 are packets sent, bytes sent, packets received and bytes received, where "sent" is from source to destination. 10.3.1.5 is the destination, so the bytes it sent to the client are the bytes received, field 13 (31800), counted since the previous record of the flow.
    fr: |
      Le champ 8 est l'état du flux : B (début), C (continuation), E (fin) ou D (refus) ; E marque donc la fin de la connexion. Les champs 10 à 13 sont les paquets envoyés, les octets envoyés, les paquets reçus et les octets reçus, « envoyé » désignant le sens source vers destination. 10.3.1.5 est la destination : les octets qu'elle a envoyés au client sont les octets reçus, champ 13 (31800), comptés depuis l'enregistrement précédent du flux.
  options:
    f7: { en: "I is the direction (inbound), not the state.", fr: "I est la direction (entrant), pas l'état." }
    f9: { en: "NX is the encryption status (unencrypted).", fr: "NX est l'état du chiffrement (non chiffré)." }
    f11: { en: "2150 is the bytes sent from the source (the client) to the destination.", fr: "2150 correspond aux octets envoyés de la source (le client) vers la destination." }
references:
  - title: Virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
