id: az700-5a-assoc-http-vms
objective: "5.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A virtual network named **VNet1** contains two subnets. **Subnet1** is associated with a network security group named **NSG-S1**. **Subnet2** has no network security group. VNet1 hosts the following virtual machines. Each virtual machine has a Standard SKU public IP address and runs a web server on TCP 80.

    | Virtual machine | Subnet | NSG of the network interface |
    | --- | --- | --- |
    | VM1 | Subnet1 | NSG-N1 |
    | VM2 | Subnet1 | None |
    | VM3 | Subnet2 | NSG-N1 |
    | VM4 | Subnet2 | None |
    | VM5 | Subnet2 | NSG-N2 |

    NSG-S1 and NSG-N2 each contain an inbound rule that allows TCP 80 from the Internet service tag. NSG-N1 contains only the default rules.

    Users on the internet connect to the public IP address of each virtual machine on TCP 80.

    Which two virtual machines receive the traffic?

    NOTE: Each correct selection is worth one point.
  fr: |
    Un réseau virtuel nommé **VNet1** contient deux sous-réseaux. **Subnet1** est associé à un groupe de sécurité réseau nommé **NSG-S1**. **Subnet2** n'a pas de groupe de sécurité réseau. VNet1 héberge les machines virtuelles suivantes. Chaque machine virtuelle possède une adresse IP publique de référence SKU Standard et exécute un serveur web sur TCP 80.

    | Machine virtuelle | Sous-réseau | NSG de l'interface réseau |
    | --- | --- | --- |
    | VM1 | Subnet1 | NSG-N1 |
    | VM2 | Subnet1 | Aucun |
    | VM3 | Subnet2 | NSG-N1 |
    | VM4 | Subnet2 | Aucun |
    | VM5 | Subnet2 | NSG-N2 |

    NSG-S1 et NSG-N2 contiennent chacun une règle entrante qui autorise TCP 80 depuis l'étiquette de service Internet. NSG-N1 ne contient que les règles par défaut.

    Des utilisateurs sur Internet se connectent à l'adresse IP publique de chaque machine virtuelle sur TCP 80.

    Quelles sont les deux machines virtuelles qui reçoivent le trafic ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: VM1 }
    - { id: b, text: VM2 }
    - { id: c, text: VM3 }
    - { id: d, text: VM4 }
    - { id: e, text: VM5 }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Inbound traffic is evaluated by the subnet NSG, then by the network interface NSG, and it must be allowed at every level that has an NSG. VM2 is filtered only by NSG-S1, which allows TCP 80. VM5 is filtered only by NSG-N2, which allows TCP 80.
    fr: |
      Le trafic entrant est évalué par le NSG du sous-réseau, puis par celui de l'interface réseau, et il doit être autorisé à chaque niveau qui possède un NSG. VM2 n'est filtrée que par NSG-S1, qui autorise TCP 80. VM5 n'est filtrée que par NSG-N2, qui autorise TCP 80.
  options:
    a: { en: "NSG-S1 allows the traffic, but NSG-N1 on the interface then denies it with DenyAllInbound.", fr: "NSG-S1 autorise le trafic, mais NSG-N1 sur l'interface le refuse ensuite avec DenyAllInbound." }
    c: { en: "Subnet2 has no NSG, but NSG-N1 on the interface denies the traffic with DenyAllInbound.", fr: "Subnet2 n'a pas de NSG, mais NSG-N1 sur l'interface refuse le trafic avec DenyAllInbound." }
    d: { en: "A Standard SKU public IP address is secure by default: with no NSG at either level, inbound traffic is blocked.", fr: "Une adresse IP publique de référence SKU Standard est sécurisée par défaut : sans NSG à aucun niveau, le trafic entrant est bloqué." }
references:
  - title: How network security groups filter network traffic
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works
