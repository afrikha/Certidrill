id: az700-5b-waf-mode-yn
objective: "5.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    An Azure Application Gateway WAF_v2 uses a WAF policy named **WAFP-Web** in Detection mode with the Default Rule Set (DRS) 2.2. WAFP-Web contains a custom rule with priority 5 that has the action **Block** for requests whose query string contains `debug=true`. WAF logs are sent to Log Analytics.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une passerelle Azure Application Gateway WAF_v2 utilise une stratégie WAF nommée **WAFP-Web** en mode de détection avec le Default Rule Set (DRS) 2.2. WAFP-Web contient une règle personnalisée de priorité 5 avec l'action **Block** pour les requêtes dont la chaîne de requête contient `debug=true`. Les journaux WAF sont envoyés à Log Analytics.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A request whose query string contains `debug=true` is blocked.
        fr: Une requête dont la chaîne de requête contient `debug=true` est bloquée.
    - id: s2
      text:
        en: A request whose anomaly score reaches 5 appears in the WAF log with the action Detected.
        fr: Une requête dont le score d'anomalie atteint 5 apparaît dans le journal WAF avec l'action Detected.
    - id: s3
      text:
        en: After you switch WAFP-Web to Prevention mode, the requests that it blocks receive an HTTP 403 response by default.
        fr: Après le passage de WAFP-Web en mode de prévention, les requêtes qu'il bloque reçoivent par défaut une réponse HTTP 403.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      In Detection mode, the WAF logs matches but blocks nothing; even a custom rule with the Block action is only logged. When the anomaly score reaches the threshold in Detection mode, the log shows the action Detected (Blocked in Prevention mode). In Prevention mode, blocked requests get a 403 response.
    fr: |
      En mode de détection, le WAF journalise les correspondances mais ne bloque rien ; même une règle personnalisée avec l'action Block est seulement journalisée. Quand le score d'anomalie atteint le seuil en mode de détection, le journal affiche l'action Detected (Blocked en mode de prévention). En mode de prévention, les requêtes bloquées reçoivent une réponse 403.
references:
  - title: What is Azure Web Application Firewall on Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
  - title: Custom rules for Web Application Firewall v2 on Azure Application Gateway
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/custom-waf-rules-overview
