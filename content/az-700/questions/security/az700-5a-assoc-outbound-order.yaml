id: az700-5a-assoc-outbound-order
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A virtual machine named **VM1** is connected to a subnet named **Subnet1**. Subnet1 is associated with a network security group named **NSG-A**, and the network interface of VM1 is associated with a network security group named **NSG-B**. The NSGs contain the following outbound rules in addition to the default rules.

    | NSG | Priority | Destination | Port | Access |
    | --- | --- | --- | --- | --- |
    | NSG-A | 100 | Internet | TCP 443 | Allow |
    | NSG-B | 200 | Internet | TCP 443 | Deny |

    VM1 opens an HTTPS connection to a public website.

    What happens to the connection?
  fr: |
    Une machine virtuelle nommée **VM1** est connectée à un sous-réseau nommé **Subnet1**. Subnet1 est associé à un groupe de sécurité réseau nommé **NSG-A**, et l'interface réseau de VM1 est associée à un groupe de sécurité réseau nommé **NSG-B**. Outre les règles par défaut, les NSG contiennent les règles sortantes suivantes.

    | NSG | Priorité | Destination | Port | Accès |
    | --- | --- | --- | --- | --- |
    | NSG-A | 100 | Internet | TCP 443 | Allow |
    | NSG-B | 200 | Internet | TCP 443 | Deny |

    VM1 ouvre une connexion HTTPS vers un site web public.

    Qu'advient-il de la connexion ?
body:
  options:
    - { id: a, text: { en: "It's denied by the rule of NSG-B, because the interface NSG is evaluated first for outbound traffic.", fr: "Elle est refusée par la règle de NSG-B, car le NSG de l'interface est évalué en premier pour le trafic sortant." } }
    - { id: b, text: { en: "It's allowed by the rule of NSG-A, because priority 100 is evaluated before priority 200.", fr: "Elle est autorisée par la règle de NSG-A, car la priorité 100 est évaluée avant la priorité 200." } }
    - { id: c, text: { en: "It's allowed by the rule of NSG-A, because the subnet NSG is evaluated last and overrides the interface NSG.", fr: "Elle est autorisée par la règle de NSG-A, car le NSG du sous-réseau est évalué en dernier et remplace le NSG de l'interface." } }
    - { id: d, text: { en: "It's denied by the DenyAllOutBound default rule of NSG-A, because NSG-B has already processed the packet.", fr: "Elle est refusée par la règle par défaut DenyAllOutBound de NSG-A, car NSG-B a déjà traité le paquet." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For outbound traffic, Azure evaluates the NSG of the network interface first, then the NSG of the subnet, and the traffic must be allowed by both. NSG-B denies TCP 443 to the internet, so the packet never reaches NSG-A.
    fr: |
      Pour le trafic sortant, Azure évalue d'abord le NSG de l'interface réseau, puis celui du sous-réseau, et le trafic doit être autorisé par les deux. NSG-B refuse TCP 443 vers Internet : le paquet n'atteint jamais NSG-A.
  options:
    b: { en: "Priorities are compared only inside one NSG; each NSG is evaluated separately and both must allow the traffic.", fr: "Les priorités ne se comparent qu'au sein d'un même NSG ; chaque NSG est évalué séparément et les deux doivent autoriser le trafic." }
    c: { en: "No NSG overrides the other: a deny at either level blocks the traffic.", fr: "Aucun NSG ne remplace l'autre : un refus à l'un ou l'autre niveau bloque le trafic." }
    d: { en: "NSG-A never sees the packet, and its default rules would allow internet traffic anyway (AllowInternetOutBound).", fr: "NSG-A ne voit jamais le paquet, et ses règles par défaut autoriseraient de toute façon le trafic Internet (AllowInternetOutBound)." }
references:
  - title: How network security groups filter network traffic
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works
