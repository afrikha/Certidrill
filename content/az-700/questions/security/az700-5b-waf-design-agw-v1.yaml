id: az700-5b-waf-design-agw-v1
objective: "5.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys still documents an Azure Application Gateway WAF (v1) design for a regional web application. You are updating the design in November 2026.

    The application must be protected by a WAF policy that uses the Default Rule Set (DRS) 2.2, with different custom rules for two of its listeners.

    What should the design use?
  fr: |
    Tailspin Toys documente encore une conception Azure Application Gateway WAF (v1) pour une application web régionale. Vous mettez à jour cette conception en novembre 2026.

    L'application doit être protégée par une stratégie WAF qui utilise le Default Rule Set (DRS) 2.2, avec des règles personnalisées différentes pour deux de ses écouteurs.

    Que doit utiliser la conception ?
body:
  options:
    - id: a
      text: { en: "Application Gateway WAF v1 with a Regional WAF policy associated with each listener", fr: "Application Gateway WAF v1 avec une stratégie WAF Regional associée à chaque écouteur" }
    - id: b
      text: { en: "Application Gateway Standard_v2 with network security groups on the backend subnets", fr: "Application Gateway Standard_v2 avec des groupes de sécurité réseau sur les sous-réseaux principaux" }
    - id: c
      text: { en: "Application Gateway WAF_v2 with Regional WAF policies associated with the listeners", fr: "Application Gateway WAF_v2 avec des stratégies WAF Regional associées aux écouteurs" }
    - id: d
      text: { en: "Azure Front Door Standard with a Global WAF policy associated with each route", fr: "Azure Front Door Standard avec une stratégie WAF Global associée à chaque itinéraire" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Application Gateway v1 (Standard and WAF) retired on April 28, 2026, so new designs use v2. WAF policy associations, at gateway, listener or path level, are supported only on the WAF_v2 SKU, which runs DRS 2.2 and lets each listener have its own policy.
    fr: |
      Application Gateway v1 (Standard et WAF) a été mis hors service le 28 avril 2026 : les nouvelles conceptions utilisent v2. Les associations de stratégies WAF, au niveau de la passerelle, de l'écouteur ou du chemin, ne sont prises en charge que sur la référence SKU WAF_v2, qui exécute DRS 2.2 et permet à chaque écouteur d'avoir sa propre stratégie.
  options:
    a: { en: "v1 is retired, and WAF policies can't be associated with a WAF v1 gateway.", fr: "v1 est mis hors service, et les stratégies WAF ne peuvent pas être associées à une passerelle WAF v1." }
    b: { en: "Standard_v2 has no WAF, and NSGs don't inspect HTTP requests.", fr: "Standard_v2 n'a pas de WAF, et les NSG n'inspectent pas les requêtes HTTP." }
    d: { en: "A Front Door Standard WAF policy supports custom rules only, without DRS.", fr: "Une stratégie WAF Front Door Standard ne prend en charge que les règles personnalisées, sans DRS." }
references:
  - title: Migrate from Application Gateway V1 to V2
    url: https://learn.microsoft.com/en-us/azure/application-gateway/v1-retirement
  - title: Azure Web Application Firewall (WAF) policy overview
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/policy-overview
