id: az700-5a-fw-features
objective: "5.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys deploys Azure Firewall Standard in the hub virtual network of each region. All the firewalls are managed by firewall policies.

    Which feature should you use to meet each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys déploie le Pare-feu Azure Standard dans le réseau virtuel hub de chaque région. Tous les pare-feu sont gérés par des stratégies de pare-feu.

    Quelle fonctionnalité devez-vous utiliser pour répondre à chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dnat, text: { en: "DNAT rule", fr: "Règle DNAT" } }
    - { id: ti, text: { en: "Threat intelligence in Alert and deny mode", fr: "Renseignement sur les menaces en mode Alerte et refus" } }
    - { id: ipg, text: { en: "IP Groups", fr: "Groupes IP" } }
    - { id: webcat, text: { en: "Web categories", fr: "Catégories web" } }
    - { id: fqdntag, text: { en: "FQDN tags", fr: "Balises FQDN" } }
    - { id: svctag, text: { en: "Service tags", fr: "Étiquettes de service" } }
  targets:
    - id: t1
      text: { en: "Publish an internal web server through the public IP address of the firewall", fr: "Publier un serveur web interne via l'adresse IP publique du pare-feu" }
    - id: t2
      text: { en: "Block traffic to and from known malicious IP addresses and domains", fr: "Bloquer le trafic à destination et en provenance d'adresses IP et de domaines malveillants connus" }
    - id: t3
      text: { en: "Maintain one list of 40 branch office ranges used as the source of rules in the firewalls of several regions", fr: "Gérer une seule liste de 40 plages d'agences utilisée comme source de règles dans les pare-feu de plusieurs régions" }
    - id: t4
      text: { en: "Block user access to gambling websites", fr: "Bloquer l'accès des utilisateurs aux sites de jeux d'argent" }
answer:
  mapping: { t1: dnat, t2: ti, t3: ipg, t4: webcat }
explanation:
  correct:
    en: |
      A DNAT rule translates inbound traffic to the firewall's public IP address to a private address. Threat intelligence uses the Microsoft Threat Intelligence feed and, in Alert and deny mode, blocks the matching traffic. An IP Group holds addresses and ranges that rules of several firewalls, across regions and subscriptions, can reference. Web categories allow or deny access by category, such as gambling.
    fr: |
      Une règle DNAT traduit le trafic entrant vers l'adresse IP publique du pare-feu en une adresse privée. Le renseignement sur les menaces utilise le flux Microsoft Threat Intelligence et, en mode Alerte et refus, bloque le trafic correspondant. Un groupe IP contient des adresses et des plages que des règles de plusieurs pare-feu, dans plusieurs régions et abonnements, peuvent référencer. Les catégories web autorisent ou refusent l'accès par catégorie, comme les jeux d'argent.
  options:
    fqdntag: { en: "FQDN tags group the domain names of well-known Microsoft services, such as Windows Update.", fr: "Les balises FQDN regroupent les noms de domaine de services Microsoft connus, comme Windows Update." }
    svctag: { en: "Service tags are address prefixes of Microsoft services that Microsoft maintains; you can't put your branch ranges in them.", fr: "Les étiquettes de service sont des préfixes d'adresses de services Microsoft tenus à jour par Microsoft ; vous ne pouvez pas y placer vos plages d'agences." }
references:
  - title: Azure Firewall features by SKU
    url: https://learn.microsoft.com/en-us/azure/firewall/features-by-sku
  - title: IP Groups in Azure Firewall
    url: https://learn.microsoft.com/en-us/azure/firewall/ip-groups
