id: az700-5a-nsg-cli-create
objective: "5.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You need to create a network security group named **nsg-app** in the West Europe region. You then need to add a rule that denies outbound SMTP traffic (TCP 25) to the internet. The rule must be evaluated after every other custom rule that you might add to nsg-app later, but before the default rules.

    How should you complete the Azure CLI commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer un groupe de sécurité réseau nommé **nsg-app** dans la région West Europe. Vous devez ensuite ajouter une règle qui refuse le trafic SMTP sortant (TCP 25) vers Internet. La règle doit être évaluée après toutes les autres règles personnalisées que vous pourriez ajouter plus tard à nsg-app, mais avant les règles par défaut.

    Comment devez-vous compléter les commandes Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network [[cmd]] create \
      --resource-group RG-Net --name nsg-app --location westeurope

    az network nsg rule create \
      --resource-group RG-Net --nsg-name nsg-app --name Deny-SMTP-Out \
      --priority [[prio]] --direction [[dir]] --access Deny --protocol Tcp \
      --destination-address-prefixes Internet --destination-port-ranges 25
  slots:
    - id: cmd
      options:
        - { id: nsg, text: nsg }
        - { id: asg, text: asg }
        - { id: fwp, text: firewall policy }
    - id: prio
      options:
        - { id: p100, text: "100" }
        - { id: p4096, text: "4096" }
        - { id: p65000, text: "65000" }
        - { id: p65500, text: "65500" }
    - id: dir
      options:
        - { id: in, text: Inbound }
        - { id: out, text: Outbound }
answer:
  values: { cmd: nsg, prio: p4096, dir: out }
explanation:
  correct:
    en: "`az network nsg create` creates the network security group. Custom rule priorities range from 100 to 4096 and the lowest number is evaluated first, so 4096 is evaluated after any other custom rule and before the default rules (65000 to 65500). SMTP to the internet is outbound traffic."
    fr: "`az network nsg create` crée le groupe de sécurité réseau. Les priorités des règles personnalisées vont de 100 à 4096 et le plus petit numéro est évalué en premier : 4096 est donc évaluée après toute autre règle personnalisée et avant les règles par défaut (65000 à 65500). Le SMTP vers Internet est du trafic sortant."
  options:
    asg: { en: "az network asg create creates an application security group, which has no rules.", fr: "az network asg create crée un groupe de sécurité d'application, qui ne contient pas de règles." }
    fwp: { en: "A firewall policy holds Azure Firewall rules, not NSG rules.", fr: "Une stratégie de pare-feu contient des règles du Pare-feu Azure, pas des règles NSG." }
    p100: { en: "100 is the highest priority: the rule would be evaluated before every other custom rule.", fr: "100 est la priorité la plus haute : la règle serait évaluée avant toutes les autres règles personnalisées." }
    p65000: { en: "Custom rules can't use priorities above 4096; 65000 and above are reserved for default rules.", fr: "Les règles personnalisées ne peuvent pas dépasser la priorité 4096 ; 65000 et plus sont réservées aux règles par défaut." }
    p65500: { en: "Custom rules can't use priorities above 4096; 65500 is the DenyAll default rule.", fr: "Les règles personnalisées ne peuvent pas dépasser la priorité 4096 ; 65500 est la règle par défaut DenyAll." }
    in: { en: "Traffic leaving the virtual machines to the internet is outbound.", fr: "Le trafic qui quitte les machines virtuelles vers Internet est sortant." }
references:
  - title: az network nsg rule
    url: https://learn.microsoft.com/en-us/cli/azure/network/nsg/rule?view=azure-cli-latest
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
