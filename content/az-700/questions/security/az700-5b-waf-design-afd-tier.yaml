id: az700-5b-waf-design-afd-tier
objective: "5.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders publishes its web shop through an Azure Front Door Standard profile named **afd-nw**. A WAF policy that contains custom rules is associated with afd-nw.

    A new requirement states that the shop must be protected by Microsoft-managed rules against the OWASP top attacks and by bot protection, at the edge. The change must not cause downtime.

    What should you do?
  fr: |
    Northwind Traders publie sa boutique web par un profil Azure Front Door Standard nommé **afd-nw**. Une stratégie WAF qui contient des règles personnalisées est associée à afd-nw.

    Une nouvelle exigence impose que la boutique soit protégée en périphérie par des règles managées par Microsoft contre les principales attaques OWASP et par une protection contre les bots. La modification ne doit pas provoquer d'interruption de service.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Upgrade afd-nw to the Premium tier, and then enable the managed rules in its premium WAF policy.", fr: "Faire passer afd-nw au niveau Premium, puis activer les règles managées dans sa stratégie WAF Premium." }
    - id: b
      text: { en: "Assign the Default Rule Set and Bot Manager to the existing WAF policy of afd-nw.", fr: "Attribuer le Default Rule Set et Bot Manager à la stratégie WAF existante d'afd-nw." }
    - id: c
      text: { en: "Associate a Regional WAF policy that uses DRS 2.2 and Bot Manager with afd-nw.", fr: "Associer à afd-nw une stratégie WAF Regional qui utilise DRS 2.2 et Bot Manager." }
    - id: d
      text: { en: "Switch the existing WAF policy of afd-nw from Detection mode to Prevention mode.", fr: "Faire passer la stratégie WAF existante d'afd-nw du mode de détection au mode de prévention." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      On Azure Front Door Standard, a WAF policy supports custom rules only; managed rule sets and bot protection require Premium. A Standard profile can be upgraded to Premium without downtime: the upgrade copies the associated WAF policies to premium policies (or uses an existing premium policy), and you then enable the managed rules on them.
    fr: |
      Sur Azure Front Door Standard, une stratégie WAF ne prend en charge que les règles personnalisées ; les ensembles de règles managés et la protection contre les bots exigent Premium. Un profil Standard peut passer à Premium sans interruption : la mise à niveau copie les stratégies WAF associées en stratégies Premium (ou utilise une stratégie Premium existante), puis vous y activez les règles managées.
  options:
    b: { en: "A WAF policy of a Standard profile can't use managed rule sets or Bot Manager.", fr: "La stratégie WAF d'un profil Standard ne peut pas utiliser d'ensembles de règles managés ni Bot Manager." }
    c: { en: "Regional WAF policies are for Application Gateway; Front Door uses Global WAF policies.", fr: "Les stratégies WAF Regional sont destinées à Application Gateway ; Front Door utilise des stratégies WAF Global." }
    d: { en: "The mode only decides whether matches are blocked; it doesn't add managed rules.", fr: "Le mode décide seulement si les correspondances sont bloquées ; il n'ajoute pas de règles managées." }
references:
  - title: Upgrade from Azure Front Door Standard to Premium
    url: https://learn.microsoft.com/en-us/azure/frontdoor/tier-upgrade
  - title: Azure Web Application Firewall on Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/afds-overview
