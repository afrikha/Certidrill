id: az700-5a-ipfv-cli
objective: "5.1.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A virtual machine named **VM1** in a resource group named **RG-App** has the private IP address 10.1.2.4. Administrators report that they can't connect to VM1 by using RDP from the public IP address 203.0.113.50.

    You need to use IP flow verify to test whether the security rules allow RDP from 203.0.113.50, whatever the source port of the client.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une machine virtuelle nommée **VM1** d'un groupe de ressources nommé **RG-App** possède l'adresse IP privée 10.1.2.4. Des administrateurs signalent qu'ils ne parviennent pas à se connecter à VM1 en RDP depuis l'adresse IP publique 203.0.113.50.

    Vous devez utiliser la vérification du flux IP pour tester si les règles de sécurité autorisent RDP depuis 203.0.113.50, quel que soit le port source du client.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network watcher test-ip-flow \
      --resource-group RG-App --vm VM1 \
      --direction [[dir]] --protocol TCP \
      --local [[local]] \
      --remote [[remote]]
  slots:
    - id: dir
      options:
        - { id: in, text: Inbound }
        - { id: out, text: Outbound }
    - id: local
      options:
        - { id: l3389, text: "10.1.2.4:3389" }
        - { id: lstar, text: "10.1.2.4:*" }
        - { id: lpub, text: "203.0.113.50:3389" }
    - id: remote
      options:
        - { id: rstar, text: "203.0.113.50:*" }
        - { id: r3389, text: "203.0.113.50:3389" }
        - { id: rvm, text: "10.1.2.4:3389" }
answer:
  values: { dir: in, local: l3389, remote: rstar }
explanation:
  correct:
    en: |
      The connection comes into VM1, so the direction is Inbound. `--local` is the private IP address of the VM's interface with the destination port 3389. `--remote` is the client address; with the Inbound direction, `*` is allowed for the remote port, which covers any source port.
    fr: |
      La connexion arrive sur VM1 : la direction est Inbound. `--local` est l'adresse IP privée de l'interface de la machine virtuelle avec le port de destination 3389. `--remote` est l'adresse du client ; avec la direction Inbound, `*` est accepté pour le port distant, ce qui couvre tout port source.
  options:
    out: { en: "Outbound would test traffic that VM1 initiates.", fr: "Outbound testerait le trafic initié par VM1." }
    lstar: { en: "The local port must be 3389; `*` is allowed for the local port only with the Outbound direction.", fr: "Le port local doit être 3389 ; `*` n'est accepté pour le port local qu'avec la direction Outbound." }
    lpub: { en: "--local is the private IP address of the VM, not the client.", fr: "--local est l'adresse IP privée de la machine virtuelle, pas celle du client." }
    r3389: { en: "3389 is the destination port on VM1; the client uses an ephemeral source port.", fr: "3389 est le port de destination sur VM1 ; le client utilise un port source éphémère." }
    rvm: { en: "--remote is the other side of the flow, the client at 203.0.113.50.", fr: "--remote est l'autre extrémité du flux, le client à l'adresse 203.0.113.50." }
references:
  - title: az network watcher
    url: https://learn.microsoft.com/en-us/cli/azure/network/watcher?view=azure-cli-latest
  - title: IP flow verify overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview
