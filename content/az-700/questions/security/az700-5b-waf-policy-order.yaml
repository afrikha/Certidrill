id: az700-5b-waf-policy-order
objective: "5.3.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso is launching a new site on an existing Azure Application Gateway WAF_v2 named **AGW-Shop**. The site has its own multi-site listener. Diagnostic settings already send the WAF logs of AGW-Shop to a Log Analytics workspace.

    You need to protect the site with a new WAF policy that uses the Default Rule Set (DRS) 2.2. Legitimate users must not be blocked while you identify false positives during the first weeks, and attacks must be blocked afterward.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso lance un nouveau site sur une passerelle Azure Application Gateway WAF_v2 existante nommée **AGW-Shop**. Le site a son propre écouteur multisite. Des paramètres de diagnostic envoient déjà les journaux WAF d'AGW-Shop à un espace de travail Log Analytics.

    Vous devez protéger le site avec une nouvelle stratégie WAF qui utilise le Default Rule Set (DRS) 2.2. Les utilisateurs légitimes ne doivent pas être bloqués pendant que vous identifiez les faux positifs au cours des premières semaines, et les attaques doivent être bloquées ensuite.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create a Regional WAF (Application Gateway) policy that uses DRS 2.2 in Detection mode.", fr: "Créer une stratégie Regional WAF (Application Gateway) qui utilise DRS 2.2 en mode de détection." } }
    - { id: assoc, text: { en: "Associate the policy with the listener of the new site.", fr: "Associer la stratégie à l'écouteur du nouveau site." } }
    - { id: tune, text: { en: "Review the WAF logs and add exclusions for the false positives.", fr: "Examiner les journaux WAF et ajouter des exclusions pour les faux positifs." } }
    - { id: prev, text: { en: "Switch the policy to Prevention mode.", fr: "Passer la stratégie en mode de prévention." } }
    - { id: global, text: { en: "Create a Global WAF (Front Door) policy that uses DRS 2.2 in Detection mode.", fr: "Créer une stratégie Global WAF (Front Door) qui utilise DRS 2.2 en mode de détection." } }
    - { id: body, text: { en: "Disable request body inspection in the policy.", fr: "Désactiver l'inspection du corps de la requête dans la stratégie." } }
    - { id: gw, text: { en: "Associate the policy with AGW-Shop at the gateway level.", fr: "Associer la stratégie à AGW-Shop au niveau de la passerelle." } }
answer:
  sequence: [ create, assoc, tune, prev ]
explanation:
  correct:
    en: |
      A Regional WAF policy is created for Application Gateway, and starting in Detection mode logs matches without blocking anything. Associating it with the site's listener applies it to that site only. After reviewing the logs and adding exclusions for false positives, you switch to Prevention mode so that attacks are blocked.
    fr: |
      Une stratégie Regional WAF se crée pour Application Gateway, et démarrer en mode de détection journalise les correspondances sans rien bloquer. L'associer à l'écouteur du site l'applique à ce site seulement. Après avoir examiné les journaux et ajouté des exclusions pour les faux positifs, vous passez en mode de prévention pour que les attaques soient bloquées.
  options:
    global: { en: "Global WAF policies are for Azure Front Door, not Application Gateway.", fr: "Les stratégies Global WAF sont destinées à Azure Front Door, pas à Application Gateway." }
    body: { en: "Disabling body inspection would let attacks in request bodies through; tuning is done with exclusions.", fr: "Désactiver l'inspection du corps laisserait passer les attaques contenues dans le corps des requêtes ; l'ajustement se fait avec des exclusions." }
    gw: { en: "A gateway-level association would apply the policy to every site of AGW-Shop and replace any existing global policy.", fr: "Une association au niveau de la passerelle appliquerait la stratégie à tous les sites d'AGW-Shop et remplacerait toute stratégie globale existante." }
references:
  - title: Create Web Application Firewall policies for Application Gateway
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/create-waf-policy-ag
  - title: What is Azure Web Application Firewall on Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
