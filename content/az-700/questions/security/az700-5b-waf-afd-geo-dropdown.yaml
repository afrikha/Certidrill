id: az700-5b-waf-afd-geo-dropdown
objective: "5.3.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank publishes its website through an Azure Front Door Premium profile. You need to configure a custom rule in the WAF policy that meets the following requirements:

    - Only clients located in France or Belgium can access the paths that contain `/banking/`.
    - The other paths remain available to clients in every country.
    - Legitimate clients whose IP address isn't mapped to a country or region must not be blocked.

    How should you complete the rule? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank publie son site web par un profil Azure Front Door Premium. Vous devez configurer dans la stratégie WAF une règle personnalisée qui répond aux exigences suivantes :

    - Seuls les clients situés en France ou en Belgique peuvent accéder aux chemins qui contiennent `/banking/`.
    - Les autres chemins restent accessibles aux clients de tous les pays.
    - Les clients légitimes dont l'adresse IP n'est associée à aucun pays ou région ne doivent pas être bloqués.

    Comment devez-vous compléter la règle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Rule type: Match

      Condition 1: match variable `RemoteAddr`, operator [[op]], values `FR`, `BE` and [[zz]]

      Condition 2: match variable [[mv]], operator `Contains`, value `/banking/`

      Action: [[act]]
    fr: |
      Type de règle : Match

      Condition 1 : variable de correspondance `RemoteAddr`, opérateur [[op]], valeurs `FR`, `BE` et [[zz]]

      Condition 2 : variable de correspondance [[mv]], opérateur `Contains`, valeur `/banking/`

      Action : [[act]]
  slots:
    - id: op
      options:
        - { id: geoneg, text: { en: "GeoMatch with negation", fr: "GeoMatch avec négation" } }
        - { id: geo, text: { en: "GeoMatch without negation", fr: "GeoMatch sans négation" } }
        - { id: ipneg, text: { en: "IPMatch with negation", fr: "IPMatch avec négation" } }
    - id: zz
      options:
        - { id: zz, text: ZZ }
        - { id: eu, text: EU }
        - { id: xx, text: XX }
    - id: mv
      options:
        - { id: uri, text: RequestUri }
        - { id: qs, text: QueryString }
        - { id: cookies, text: Cookies }
    - id: act
      options:
        - { id: block, text: Block }
        - { id: allow, text: Allow }
        - { id: log, text: Log }
answer:
  values: { op: geoneg, zz: zz, mv: uri, act: block }
explanation:
  correct:
    en: |
      The conditions of a rule are combined with AND, so the rule must match "not from the allowed countries AND path contains /banking/" and block it. A negated GeoMatch matches every client outside the listed codes. Adding ZZ (unknown country or region) to the list keeps unmapped addresses out of the match, which avoids false positives. The path is evaluated with the `RequestUri` variable.
    fr: |
      Les conditions d'une règle se combinent par AND : la règle doit correspondre à « hors des pays autorisés ET chemin contenant /banking/ » et bloquer. Un GeoMatch avec négation correspond à tout client extérieur aux codes listés. Ajouter ZZ (pays ou région inconnu) à la liste exclut de la correspondance les adresses non associées, ce qui évite les faux positifs. Le chemin s'évalue avec la variable `RequestUri`.
  options:
    geo: { en: "Without negation, the rule would match French and Belgian clients, the ones that must be allowed.", fr: "Sans négation, la règle correspondrait aux clients français et belges, ceux qu'il faut autoriser." }
    ipneg: { en: "IPMatch compares IP addresses or ranges, not country codes.", fr: "IPMatch compare des adresses ou plages IP, pas des codes de pays." }
    eu: { en: "The code for addresses that aren't mapped to a country or region is ZZ.", fr: "Le code des adresses non associées à un pays ou une région est ZZ." }
    allow: { en: "Allow would let the other countries in and skip the remaining rules for them.", fr: "Allow laisserait entrer les autres pays et leur ferait ignorer les règles restantes." }
    log: { en: "Log only records the match and lets the request continue.", fr: "Log se contente d'enregistrer la correspondance et laisse la requête continuer." }
references:
  - title: What is geo-filtering on a domain for Azure Front Door?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-geo-filtering
  - title: Custom rules for Azure Web Application Firewall on Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-custom-rules
