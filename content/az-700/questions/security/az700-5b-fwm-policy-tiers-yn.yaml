id: az700-5b-fwm-policy-tiers-yn
objective: "5.2.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    You use Azure Firewall Manager to manage the following firewalls in hub virtual networks:

    | Name | Tier |
    | --- | --- |
    | FW-A | Standard |
    | FW-B | Premium |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez Azure Firewall Manager pour gérer les pare-feu suivants dans des réseaux virtuels hubs :

    | Nom | Niveau |
    | --- | --- |
    | FW-A | Standard |
    | FW-B | Premium |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can associate a Standard firewall policy with FW-B.
        fr: Vous pouvez associer une stratégie de pare-feu Standard à FW-B.
    - id: s2
      text:
        en: You can associate a Premium firewall policy with FW-A to enable IDPS.
        fr: Vous pouvez associer une stratégie de pare-feu Premium à FW-A pour activer l'IDPS.
    - id: s3
      text:
        en: A firewall policy that is associated with both FW-A and FW-B is free of charge.
        fr: Une stratégie de pare-feu associée à la fois à FW-A et à FW-B est gratuite.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A Standard policy (adding custom DNS, DNS proxy and web categories to the Basic features) can be used by Standard or Premium firewalls. A Premium policy, which adds TLS inspection, URL filtering and IDPS, applies to Premium firewalls only. Policies are billed by firewall association: zero or one association is free, and a policy associated with several firewalls is billed at a fixed rate.
    fr: |
      Une stratégie Standard (qui ajoute le DNS personnalisé, le proxy DNS et les catégories web aux fonctionnalités Basic) peut être utilisée par des pare-feu Standard ou Premium. Une stratégie Premium, qui ajoute l'inspection TLS, le filtrage d'URL et l'IDPS, ne s'applique qu'aux pare-feu Premium. Les stratégies sont facturées selon les associations de pare-feu : zéro ou une association est gratuite, et une stratégie associée à plusieurs pare-feu est facturée à un tarif fixe.
references:
  - title: Azure Firewall Manager policy overview
    url: https://learn.microsoft.com/en-us/azure/firewall-manager/policy-overview
