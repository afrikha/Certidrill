id: az700-5b-waf-agw-ruleset-yn
objective: "5.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    An Application Gateway WAF policy named **WAFP-Legacy** uses the OWASP CRS 3.1 rule set. It contains custom rules, managed rule overrides and rule-level exclusions. You plan to upgrade it to a newer rule set version.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une stratégie WAF Application Gateway nommée **WAFP-Legacy** utilise l'ensemble de règles OWASP CRS 3.1. Elle contient des règles personnalisées, des remplacements de règles managées et des exclusions au niveau des règles. Vous prévoyez de la mettre à niveau vers une version plus récente de l'ensemble de règles.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After you upgrade WAFP-Legacy to CRS 3.2, you can downgrade it back to CRS 3.1 if needed.
        fr: Après la mise à niveau de WAFP-Legacy vers CRS 3.2, vous pouvez revenir à CRS 3.1 si nécessaire.
    - id: s2
      text:
        en: If you change the rule set version in the Azure portal, the managed rule overrides are kept.
        fr: Si vous changez la version de l'ensemble de règles dans le portail Azure, les remplacements de règles managées sont conservés.
    - id: s3
      text:
        en: If you change the rule set version in the Azure portal, the custom rules of WAFP-Legacy are kept.
        fr: Si vous changez la version de l'ensemble de règles dans le portail Azure, les règles personnalisées de WAFP-Legacy sont conservées.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      CRS 3.2 runs on the new WAF engine, so a policy can't be downgraded from CRS 3.2 to 3.1 or earlier. An upgrade in the portal resets the rule customizations (rule state, actions, rule-level exclusions) to the defaults of the new version; to preserve them, use PowerShell, the Azure CLI, the REST API or a template. Custom rules, policy settings and global exclusions aren't affected by the version change.
    fr: |
      CRS 3.2 s'exécute sur le nouveau moteur WAF : une stratégie ne peut pas revenir de CRS 3.2 à 3.1 ou antérieur. Une mise à niveau dans le portail réinitialise les personnalisations des règles (état, actions, exclusions au niveau des règles) aux valeurs par défaut de la nouvelle version ; pour les conserver, utilisez PowerShell, Azure CLI, l'API REST ou un modèle. Les règles personnalisées, les paramètres de stratégie et les exclusions globales ne sont pas touchés par le changement de version.
references:
  - title: Application Gateway WAF CRS and DRS rule groups and rules
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/application-gateway-crs-rulegroups-rules
