id: az700-5b-fw-deploy-mgmt-nic
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum deployed an Azure Firewall Standard named **FW1** last year in a hub virtual network. FW1 has one public IP address and was created without the Firewall Management NIC.

    A new requirement states that FW1 must send all its internet-bound traffic to an on-premises network virtual appliance over ExpressRoute (forced tunneling).

    You need to prepare FW1 before you add the default route to AzureFirewallSubnet.

    What should you do?
  fr: |
    Adatum a déployé l'an dernier un Pare-feu Azure Standard nommé **FW1** dans un réseau virtuel hub. FW1 possède une adresse IP publique et a été créé sans la carte réseau de gestion (Firewall Management NIC).

    Une nouvelle exigence impose que FW1 envoie tout son trafic à destination d'Internet vers une appliance virtuelle réseau locale via ExpressRoute (tunneling forcé).

    Vous devez préparer FW1 avant d'ajouter la route par défaut à AzureFirewallSubnet.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Upgrade FW1 to the Premium tier by using the SKU change option in the portal.", fr: "Faire passer FW1 au niveau Premium avec l'option de changement de SKU du portail." }
    - id: b
      text: { en: "Associate a NAT gateway that has a public IP address with AzureFirewallSubnet.", fr: "Associer à AzureFirewallSubnet une passerelle NAT dotée d'une adresse IP publique." }
    - id: c
      text: { en: "Enable Propagate gateway routes on a route table associated with AzureFirewallManagementSubnet.", fr: "Activer Propager les routes de passerelle sur une table de routage associée à AzureFirewallManagementSubnet." }
    - id: d
      text: { en: "Create AzureFirewallManagementSubnet and a management public IP address, then deallocate and reallocate FW1 with them.", fr: "Créer AzureFirewallManagementSubnet et une adresse IP publique de gestion, puis désallouer et réallouer FW1 avec elles." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Forced tunneling requires the management NIC, which separates the firewall's operational traffic onto AzureFirewallManagementSubnet (at least /26) and its own public IP address. On an existing Standard or Premium firewall, you enable it by stopping (deallocating) the firewall and starting it again with the management subnet and public IP, during a maintenance window.
    fr: |
      Le tunneling forcé exige la carte réseau de gestion, qui isole le trafic d'exploitation du pare-feu sur AzureFirewallManagementSubnet (au moins /26) avec sa propre adresse IP publique. Sur un pare-feu Standard ou Premium existant, vous l'activez en arrêtant (désallouant) le pare-feu, puis en le redémarrant avec le sous-réseau et l'adresse IP publique de gestion, pendant une fenêtre de maintenance.
  options:
    a: { en: "The tier doesn't add a management NIC; Standard and Premium both need it to be enabled.", fr: "Le niveau n'ajoute pas de carte réseau de gestion ; Standard comme Premium doivent l'activer." }
    b: { en: "A NAT gateway adds SNAT ports for direct internet egress; it's the opposite of forced tunneling.", fr: "Une passerelle NAT ajoute des ports SNAT pour une sortie Internet directe ; c'est l'inverse du tunneling forcé." }
    c: { en: "The management subnet only accepts a default route to the internet, and Propagate gateway routes must be disabled on it.", fr: "Le sous-réseau de gestion n'accepte qu'une route par défaut vers Internet, et Propager les routes de passerelle doit y être désactivé." }
references:
  - title: Azure Firewall Management NIC
    url: https://learn.microsoft.com/en-us/azure/firewall/management-nic
  - title: Azure Firewall forced tunneling
    url: https://learn.microsoft.com/en-us/azure/firewall/forced-tunneling
