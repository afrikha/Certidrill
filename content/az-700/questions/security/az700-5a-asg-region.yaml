id: az700-5a-asg-region
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A virtual machine named **VM-App1** has a network interface in a virtual network named **VNet-Prod** in the West Europe region. A colleague created an application security group named **asg-app** in the North Europe region for the application servers.

    When you configure the application security groups on the **Networking** page of VM-App1, asg-app isn't listed.

    You need to add the network interface of VM-App1 to an application security group for the application servers.

    What should you do?
  fr: |
    Une machine virtuelle nommée **VM-App1** possède une interface réseau dans un réseau virtuel nommé **VNet-Prod** de la région West Europe. Un collègue a créé un groupe de sécurité d'application nommé **asg-app** dans la région North Europe pour les serveurs d'applications.

    Quand vous configurez les groupes de sécurité d'application sur la page **Mise en réseau** de VM-App1, asg-app n'est pas proposé.

    Vous devez ajouter l'interface réseau de VM-App1 à un groupe de sécurité d'application destiné aux serveurs d'applications.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Move asg-app to the resource group that contains VM-App1.", fr: "Déplacer asg-app vers le groupe de ressources qui contient VM-App1." } }
    - { id: b, text: { en: "Peer VNet-Prod with a virtual network in North Europe.", fr: "Relier VNet-Prod par peering à un réseau virtuel de North Europe." } }
    - { id: c, text: { en: "Create an application security group in West Europe and use it.", fr: "Créer un groupe de sécurité d'application dans West Europe et l'utiliser." } }
    - { id: d, text: { en: "Associate a North Europe NSG with the interface of VM-App1.", fr: "Associer un NSG de North Europe à l'interface de VM-App1." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A network interface can join only an application security group in the same location (and the same virtual network as the group's other members). The ASG is in North Europe and the interface in West Europe, so you need an ASG created in West Europe.
    fr: |
      Une interface réseau ne peut rejoindre qu'un groupe de sécurité d'application situé au même emplacement (et dans le même réseau virtuel que les autres membres du groupe). L'ASG est dans North Europe et l'interface dans West Europe : il faut un ASG créé dans West Europe.
  options:
    a: { en: "Moving a resource to another resource group doesn't change its region.", fr: "Déplacer une ressource vers un autre groupe de ressources ne change pas sa région." }
    b: { en: "Peering doesn't let an interface join an ASG of another region.", fr: "Le peering ne permet pas à une interface de rejoindre un ASG d'une autre région." }
    d: { en: "An NSG filters traffic; associating one doesn't make the interface a member of an ASG.", fr: "Un NSG filtre le trafic ; en associer un ne rend pas l'interface membre d'un ASG." }
references:
  - title: Create, change, or delete a network interface
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-network-interface
