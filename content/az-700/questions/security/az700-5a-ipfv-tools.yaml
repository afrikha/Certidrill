id: az700-5a-ipfv-tools
objective: "5.1.8"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are troubleshooting connectivity for a virtual machine named **VM1** (10.1.1.4). VM1 is connected to a subnet that has a network security group and a route table, and its network interface also has a network security group.

    Which Network Watcher feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous résolvez des problèmes de connectivité d'une machine virtuelle nommée **VM1** (10.1.1.4). VM1 est connectée à un sous-réseau doté d'un groupe de sécurité réseau et d'une table de routage, et son interface réseau possède elle aussi un groupe de sécurité réseau.

    Quelle fonctionnalité de Network Watcher devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ipfv, text: { en: "IP flow verify", fr: "Vérification du flux IP" } }
    - { id: nsgdiag, text: { en: "NSG diagnostics", fr: "Diagnostics NSG" } }
    - { id: nexthop, text: { en: "Next hop", fr: "Tronçon suivant" } }
    - { id: effective, text: { en: "Effective security rules", fr: "Règles de sécurité effectives" } }
    - { id: conn, text: { en: "Connection troubleshoot", fr: "Résolution des problèmes de connexion" } }
    - { id: pcap, text: { en: "Packet capture", fr: "Capture de paquets" } }
  targets:
    - id: t1
      text: { en: "Determine whether inbound TCP 443 from 203.0.113.9 to VM1 is allowed, and which security rule decides", fr: "Déterminer si le trafic TCP 443 entrant depuis 203.0.113.9 vers VM1 est autorisé, et quelle règle de sécurité en décide" }
    - id: t2
      text: { en: "Determine whether ICMP traffic from VM2 to VM1 is allowed by the security rules", fr: "Déterminer si le trafic ICMP de VM2 vers VM1 est autorisé par les règles de sécurité" }
    - id: t3
      text: { en: "Determine whether a user-defined route sends the traffic from VM1 to 10.20.0.4 to a network virtual appliance", fr: "Déterminer si un itinéraire défini par l'utilisateur envoie le trafic de VM1 vers 10.20.0.4 à une appliance virtuelle réseau" }
    - id: t4
      text: { en: "List the merged rules of the subnet NSG and the interface NSG that apply to VM1", fr: "Lister les règles fusionnées du NSG du sous-réseau et du NSG de l'interface qui s'appliquent à VM1" }
answer:
  mapping: { t1: ipfv, t2: nsgdiag, t3: nexthop, t4: effective }
explanation:
  correct:
    en: |
      IP flow verify tests one TCP or UDP flow against the NSG rules and security admin rules and names the deciding rule. It doesn't support ICMP: NSG diagnostics covers ICMP and scale sets. Next hop returns the next hop type and address for a destination, which reveals a user-defined route. Effective security rules shows the merged rules of all the NSGs that apply to a network interface.
    fr: |
      La vérification du flux IP teste un flux TCP ou UDP par rapport aux règles NSG et aux règles d'administration de sécurité, et nomme la règle décisive. Elle ne prend pas en charge ICMP : les diagnostics NSG couvrent ICMP et les groupes de machines virtuelles identiques. Le tronçon suivant renvoie le type et l'adresse du tronçon suivant pour une destination, ce qui révèle un itinéraire défini par l'utilisateur. Les règles de sécurité effectives affichent les règles fusionnées de tous les NSG qui s'appliquent à une interface réseau.
  options:
    conn: { en: "Connection troubleshoot tests end-to-end reachability and latency; it isn't the tool that names a rule or a route.", fr: "La résolution des problèmes de connexion teste l'accessibilité de bout en bout et la latence ; ce n'est pas l'outil qui nomme une règle ou un itinéraire." }
    pcap: { en: "Packet capture records packets; it doesn't evaluate rules or routes.", fr: "La capture de paquets enregistre des paquets ; elle n'évalue ni les règles ni les itinéraires." }
references:
  - title: IP flow verify overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview
  - title: How network security groups filter network traffic
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-group-how-it-works
