id: az700-5b-waf-policy-migrate
objective: "5.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure Application Gateway WAF_v2 named **AGW-Legacy** that was deployed years ago. Its WAF settings (managed rule settings, custom rules and exclusions) are stored in the gateway's WAF configuration, and no WAF policy is associated with it.

    You need to associate a separate WAF policy with a new listener of AGW-Legacy.

    What should you do first?
  fr: |
    Fabrikam dispose d'une passerelle Azure Application Gateway WAF_v2 nommée **AGW-Legacy**, déployée il y a plusieurs années. Ses paramètres WAF (paramètres des règles managées, règles personnalisées et exclusions) sont stockés dans la configuration WAF de la passerelle, et aucune stratégie WAF ne lui est associée.

    Vous devez associer une stratégie WAF distincte à un nouvel écouteur d'AGW-Legacy.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Create a Global WAF (Front Door) policy and associate it with the new listener.", fr: "Créer une stratégie Global WAF (Front Door) et l'associer au nouvel écouteur." }
    - id: b
      text: { en: "Migrate the WAF configuration of AGW-Legacy to a WAF policy associated with the gateway.", fr: "Migrer la configuration WAF d'AGW-Legacy vers une stratégie WAF associée à la passerelle." }
    - id: c
      text: { en: "Change the SKU of AGW-Legacy to Standard_v2, and then back to WAF_v2.", fr: "Faire passer AGW-Legacy à la référence SKU Standard_v2, puis revenir à WAF_v2." }
    - id: d
      text: { en: "Add a custom rule in the WAF configuration that matches the host name of the new listener.", fr: "Ajouter dans la configuration WAF une règle personnalisée qui correspond au nom d'hôte du nouvel écouteur." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Per-site and per-URI policies are features of WAF policies. Settings kept in the older WAF configuration must first be moved to a WAF policy that exactly reproduces them (by using the portal migration or PowerShell), and that policy is associated with the gateway. You can then associate other policies with listeners or path rules.
    fr: |
      Les stratégies par site et par URI sont des fonctionnalités des stratégies WAF. Les paramètres conservés dans l'ancienne configuration WAF doivent d'abord être déplacés vers une stratégie WAF qui les reproduit à l'identique (avec la migration du portail ou PowerShell), et cette stratégie est associée à la passerelle. Vous pouvez ensuite associer d'autres stratégies à des écouteurs ou à des règles de chemin.
  options:
    a: { en: "Global WAF policies are for Front Door; Application Gateway uses Regional WAF policies.", fr: "Les stratégies Global WAF sont destinées à Front Door ; Application Gateway utilise des stratégies Regional WAF." }
    c: { en: "Changing the SKU doesn't create a WAF policy, and Standard_v2 would remove WAF protection in the meantime.", fr: "Changer la référence SKU ne crée pas de stratégie WAF, et Standard_v2 supprimerait la protection WAF entre-temps." }
    d: { en: "A rule in the WAF configuration applies to the whole gateway; it isn't a per-site policy.", fr: "Une règle de la configuration WAF s'applique à toute la passerelle ; ce n'est pas une stratégie par site." }
references:
  - title: Create Web Application Firewall policies for Application Gateway
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/create-waf-policy-ag
  - title: Azure Web Application Firewall (WAF) policy overview
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/policy-overview
