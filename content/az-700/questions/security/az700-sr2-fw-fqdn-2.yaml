id: az700-sr2-fw-fqdn-2
objective: "5.2.5"
type: series_yesno
series: az700-sr2-fw-fqdn
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You add a network rule with an FQDN destination and keep the DNS settings unchanged.
  fr: Vous ajoutez une règle réseau avec une destination FQDN sans modifier les paramètres DNS.
body:
  solution:
    en: |
      In RCG-Platform, you create a network rule collection named NRC-Updates with priority 200 and action Allow. It contains a rule with source 10.20.1.0/24, protocol TCP, destination type FQDN `updates.fabrikam.com`, and port 443. You don't change the DNS settings of FWPolicy1 or Spoke1.
    fr: |
      Dans RCG-Platform, vous créez une collection de règles réseau nommée NRC-Updates de priorité 200 et d'action Allow. Elle contient une règle avec la source 10.20.1.0/24, le protocole TCP, une destination de type FQDN `updates.fabrikam.com` et le port 443. Vous ne modifiez pas les paramètres DNS de FWPolicy1 ni de Spoke1.
answer: { value: false }
explanation:
  correct:
    en: |
      NRC-Updates would be processed before NRC-DenyWeb, but FQDNs in network rules require DNS proxy to be enabled, with the clients using the firewall as their DNS server. DNS proxy stays disabled in FWPolicy1, so the FQDN network rule can't be used.
    fr: |
      NRC-Updates serait traitée avant NRC-DenyWeb, mais les FQDN dans les règles réseau exigent l'activation du proxy DNS, avec des clients qui utilisent le pare-feu comme serveur DNS. Le proxy DNS reste désactivé dans FWPolicy1 : la règle réseau FQDN ne peut pas être utilisée.
references:
  - title: Azure Firewall FQDN filtering in network rules
    url: https://learn.microsoft.com/en-us/azure/firewall/fqdn-filtering-network-rules
