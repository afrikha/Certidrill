id: az700-5a-asg-cross-vnet
objective: "5.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You have the following virtual networks, which are peered with each other.

    | Virtual network | Address space | Subnet | Workload | Application security group |
    | --- | --- | --- | --- | --- |
    | VNet1 | 10.1.0.0/16 | Subnet-Web (10.1.1.0/24) | Web servers only | asg-web |
    | VNet1 | 10.1.0.0/16 | Subnet-Tools (10.1.2.0/24) | Build agents | None |
    | VNet2 | 10.2.0.0/16 | Subnet-Db (10.2.1.0/24) | SQL Server VMs | asg-db |

    The network interfaces of the web servers are members of asg-web, and the network interfaces of the SQL Server VMs are members of asg-db. A network security group named **NSG-Db** is associated with Subnet-Db.

    You need to add an inbound rule to NSG-Db that allows TCP 1433 from the web servers to the SQL Server VMs only.

    What should you configure as the source and the destination of the rule?
  fr: |
    Vous disposez des réseaux virtuels suivants, reliés entre eux par peering.

    | Réseau virtuel | Espace d'adressage | Sous-réseau | Charge de travail | Groupe de sécurité d'application |
    | --- | --- | --- | --- | --- |
    | VNet1 | 10.1.0.0/16 | Subnet-Web (10.1.1.0/24) | Serveurs web uniquement | asg-web |
    | VNet1 | 10.1.0.0/16 | Subnet-Tools (10.1.2.0/24) | Agents de build | Aucun |
    | VNet2 | 10.2.0.0/16 | Subnet-Db (10.2.1.0/24) | Machines virtuelles SQL Server | asg-db |

    Les interfaces réseau des serveurs web sont membres d'asg-web, et celles des machines virtuelles SQL Server sont membres d'asg-db. Un groupe de sécurité réseau nommé **NSG-Db** est associé à Subnet-Db.

    Vous devez ajouter à NSG-Db une règle entrante qui autorise TCP 1433 uniquement depuis les serveurs web vers les machines virtuelles SQL Server.

    Que devez-vous configurer comme source et comme destination de la règle ?
body:
  options:
    - { id: a, text: { en: "Source: asg-web. Destination: asg-db.", fr: "Source : asg-web. Destination : asg-db." } }
    - { id: b, text: { en: "Source: 10.1.1.0/24. Destination: asg-db.", fr: "Source : 10.1.1.0/24. Destination : asg-db." } }
    - { id: c, text: { en: "Source: VirtualNetwork. Destination: asg-db.", fr: "Source : VirtualNetwork. Destination : asg-db." } }
    - { id: d, text: { en: "Source: 10.1.0.0/16. Destination: 10.2.0.0/16.", fr: "Source : 10.1.0.0/16. Destination : 10.2.0.0/16." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When a rule uses application security groups as both source and destination, the network interfaces of both groups must be in the same virtual network, which isn't the case for asg-web (VNet1) and asg-db (VNet2). Subnet-Web contains only the web servers, so its prefix identifies them exactly, and asg-db limits the destination to the SQL Server VMs.
    fr: |
      Quand une règle utilise des groupes de sécurité d'application à la fois comme source et comme destination, les interfaces réseau des deux groupes doivent se trouver dans le même réseau virtuel, ce qui n'est pas le cas d'asg-web (VNet1) et d'asg-db (VNet2). Subnet-Web ne contient que les serveurs web : son préfixe les identifie exactement, et asg-db limite la destination aux machines virtuelles SQL Server.
  options:
    a: { en: "Both ASGs of one rule must contain interfaces of the same virtual network; these are in VNet1 and VNet2.", fr: "Les deux ASG d'une même règle doivent contenir des interfaces du même réseau virtuel ; ici, elles sont dans VNet1 et VNet2." }
    c: { en: "VirtualNetwork includes both peered networks, so the build agents and any other VM could reach SQL Server.", fr: "VirtualNetwork inclut les deux réseaux reliés par peering : les agents de build et toute autre machine virtuelle pourraient joindre SQL Server." }
    d: { en: "10.1.0.0/16 also includes the build agents of Subnet-Tools.", fr: "10.1.0.0/16 inclut aussi les agents de build de Subnet-Tools." }
references:
  - title: Application security groups
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
