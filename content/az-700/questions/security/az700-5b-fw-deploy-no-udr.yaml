id: az700-5b-fw-deploy-no-udr
objective: "5.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You deploy an Azure Firewall named **FW1** in a hub virtual network that is peered with a spoke virtual network named **VNet-Spoke1**. VNet-Spoke1 contains a subnet named **App**.

    The firewall policy of FW1 contains a single application rule collection that allows HTTPS to `*.contoso.com` from App.

    The virtual machines in App can still browse any website, and the logs of FW1 show no traffic from App.

    You need to ensure that FW1 filters the internet-bound traffic of App.

    What should you do?
  fr: |
    Vous déployez un Pare-feu Azure nommé **FW1** dans un réseau virtuel hub relié par un peering à un réseau virtuel spoke nommé **VNet-Spoke1**. VNet-Spoke1 contient un sous-réseau nommé **App**.

    La stratégie de pare-feu de FW1 contient une seule collection de règles d'application, qui autorise le HTTPS vers `*.contoso.com` depuis App.

    Les machines virtuelles d'App peuvent toujours consulter n'importe quel site web, et les journaux de FW1 ne montrent aucun trafic venant d'App.

    Vous devez vous assurer que FW1 filtre le trafic à destination d'Internet d'App.

    Que devez-vous faire ?
body:
  options:
    - id: c
      text: { en: "Set the DNS servers of VNet-Spoke1 to the private IP address of FW1.", fr: "Définir les serveurs DNS de VNet-Spoke1 sur l'adresse IP privée de FW1." }
    - id: b
      text: { en: "Enable the gateway transit setting on the peering from the hub to VNet-Spoke1.", fr: "Activer le paramètre de transit par passerelle sur le peering du hub vers VNet-Spoke1." }
    - id: a
      text: { en: "Associate App with a route table that sends 0.0.0.0/0 to the private IP address of FW1.", fr: "Associer à App une table de routage qui envoie 0.0.0.0/0 vers l'adresse IP privée de FW1." }
    - id: d
      text: { en: "Change the priority of the application rule collection to 100.", fr: "Changer la priorité de la collection de règles d'application en 100." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Deploying a firewall doesn't route anything to it. Without a user-defined route, the App subnet keeps the system route 0.0.0.0/0 to the internet. A route table with a default route whose next hop is the virtual appliance at the firewall's private IP address sends the traffic to FW1, where the default deny applies to everything the application rule doesn't allow.
    fr: |
      Déployer un pare-feu n'y route rien. Sans itinéraire défini par l'utilisateur, le sous-réseau App conserve la route système 0.0.0.0/0 vers Internet. Une table de routage avec une route par défaut dont le tronçon suivant est l'appliance virtuelle à l'adresse IP privée du pare-feu envoie le trafic vers FW1, où le refus par défaut s'applique à tout ce que la règle d'application n'autorise pas.
  options:
    c: { en: "Pointing DNS to the firewall only matters for DNS proxy; it doesn't change where the HTTPS packets are routed.", fr: "Faire pointer le DNS vers le pare-feu ne compte que pour le proxy DNS ; cela ne change pas la route des paquets HTTPS." }
    b: { en: "Gateway transit shares a VPN or ExpressRoute gateway with the spoke; it doesn't send internet traffic to the firewall.", fr: "Le transit par passerelle partage une passerelle VPN ou ExpressRoute avec le spoke ; il n'envoie pas le trafic Internet vers le pare-feu." }
    d: { en: "Priorities order the rules the firewall evaluates, but the firewall receives no traffic to evaluate.", fr: "Les priorités ordonnent les règles que le pare-feu évalue, mais le pare-feu ne reçoit aucun trafic à évaluer." }
references:
  - title: Deploy and configure Azure Firewall in a hybrid network by using the Azure portal
    url: https://learn.microsoft.com/en-us/azure/firewall/tutorial-hybrid-portal
