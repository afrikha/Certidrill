id: az700-5b-fw-deploy-order
objective: "5.2.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has a hub virtual network named **VNet-Hub** that has the free address range 10.0.1.0/26. A spoke virtual network named **VNet-Spoke1** is peered with VNet-Hub and contains a subnet named **Web**.

    A firewall policy named **FWP1** and a Standard SKU public IP address named **pip-fw1** already exist.

    You need to deploy an Azure Firewall Standard named **FW1** and ensure that the internet-bound traffic from the Web subnet is filtered by FW1.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys dispose d'un réseau virtuel hub nommé **VNet-Hub** qui possède la plage d'adresses libre 10.0.1.0/26. Un réseau virtuel spoke nommé **VNet-Spoke1** est relié à VNet-Hub par un peering et contient un sous-réseau nommé **Web**.

    Une stratégie de pare-feu nommée **FWP1** et une adresse IP publique de référence SKU Standard nommée **pip-fw1** existent déjà.

    Vous devez déployer un Pare-feu Azure Standard nommé **FW1** et vous assurer que le trafic à destination d'Internet issu du sous-réseau Web est filtré par FW1.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: sub, text: { en: "Create a subnet named AzureFirewallSubnet that uses 10.0.1.0/26 in VNet-Hub.", fr: "Créer dans VNet-Hub un sous-réseau nommé AzureFirewallSubnet qui utilise 10.0.1.0/26." } }
    - { id: fw, text: { en: "Deploy FW1 in VNet-Hub with pip-fw1 and FWP1, and note its private IP address.", fr: "Déployer FW1 dans VNet-Hub avec pip-fw1 et FWP1, puis noter son adresse IP privée." } }
    - { id: rt, text: { en: "Create a route table that has a route for 0.0.0.0/0 with the next hop type **Virtual appliance** and the private IP address of FW1.", fr: "Créer une table de routage qui contient un itinéraire pour 0.0.0.0/0 avec le type de tronçon suivant **Appliance virtuelle** et l'adresse IP privée de FW1." } }
    - { id: assoc, text: { en: "Associate the route table with the Web subnet.", fr: "Associer la table de routage au sous-réseau Web." } }
    - { id: nsg, text: { en: "Associate a network security group with AzureFirewallSubnet.", fr: "Associer un groupe de sécurité réseau à AzureFirewallSubnet." } }
    - { id: mgmt, text: { en: "Create a subnet named AzureFirewallManagementSubnet in VNet-Hub.", fr: "Créer dans VNet-Hub un sous-réseau nommé AzureFirewallManagementSubnet." } }
    - { id: rtfw, text: { en: "Associate the route table with AzureFirewallSubnet.", fr: "Associer la table de routage à AzureFirewallSubnet." } }
answer:
  sequence: [ sub, fw, rt, assoc ]
explanation:
  correct:
    en: |
      The firewall needs a subnet named AzureFirewallSubnet (a /26 covers every scaling scenario) before it can be deployed. Once FW1 exists, you know its private IP address, which is the next hop of the default route. The route table only affects the subnets it's associated with, so it goes on the Web subnet.
    fr: |
      Le pare-feu a besoin d'un sous-réseau nommé AzureFirewallSubnet (un /26 couvre tous les scénarios de mise à l'échelle) avant de pouvoir être déployé. Une fois FW1 créé, vous connaissez son adresse IP privée, qui est le tronçon suivant de la route par défaut. La table de routage ne s'applique qu'aux sous-réseaux auxquels elle est associée : elle va sur le sous-réseau Web.
  options:
    nsg: { en: "NSGs aren't supported on AzureFirewallSubnet.", fr: "Les NSG ne sont pas pris en charge sur AzureFirewallSubnet." }
    mgmt: { en: "The management subnet is needed for forced tunneling or a Basic firewall, not for this Standard deployment.", fr: "Le sous-réseau de gestion est nécessaire au tunneling forcé ou à un pare-feu Basic, pas à ce déploiement Standard." }
    rtfw: { en: "A default route to the firewall on its own subnet would loop; the firewall needs direct internet access.", fr: "Une route par défaut vers le pare-feu sur son propre sous-réseau créerait une boucle ; le pare-feu a besoin d'un accès Internet direct." }
references:
  - title: Azure Firewall FAQ
    url: https://learn.microsoft.com/en-us/azure/firewall/firewall-faq
  - title: Deploy and configure Azure Firewall in a hybrid network by using the Azure portal
    url: https://learn.microsoft.com/en-us/azure/firewall/tutorial-hybrid-portal
