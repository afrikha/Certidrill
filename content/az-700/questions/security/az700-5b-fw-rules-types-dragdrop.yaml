id: az700-5b-fw-rules-types-dragdrop
objective: "5.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You manage an Azure Firewall Standard named **FW1** that filters the traffic of several spoke virtual networks. DNS proxy is disabled.

    You need to configure FW1 to meet the following requirements. The solution must minimize administrative effort.

    Which rule should you configure for each requirement? To answer, drag the appropriate rules to the correct requirements. Each rule may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez un Pare-feu Azure Standard nommé **FW1** qui filtre le trafic de plusieurs réseaux virtuels spokes. Le proxy DNS est désactivé.

    Vous devez configurer FW1 pour répondre aux exigences suivantes. La solution doit réduire au minimum l'effort d'administration.

    Quelle règle devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les règles appropriées vers les exigences correspondantes. Chaque règle peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: appfqdn, text: { en: "An application rule with target FQDNs", fr: "Une règle d'application avec des FQDN cibles" } }
    - { id: apptag, text: { en: "An application rule with an FQDN tag", fr: "Une règle d'application avec une balise FQDN" } }
    - { id: netsvc, text: { en: "A network rule with a service tag", fr: "Une règle de réseau avec une étiquette de service" } }
    - { id: netipg, text: { en: "A network rule with an IP Group", fr: "Une règle de réseau avec un groupe IP" } }
    - { id: dnat, text: { en: "A DNAT rule", fr: "Une règle DNAT" } }
  targets:
    - id: t1
      text: { en: "Allow the virtual machines to download Windows updates without maintaining the list of Microsoft domain names yourself", fr: "Autoriser les machines virtuelles à télécharger les mises à jour Windows sans gérer vous-même la liste des noms de domaine Microsoft" } 
    - id: t2
      text: { en: "Allow outbound HTTPS only to `api.fabrikam.com` and to every host under `fabrikam.net`", fr: "Autoriser le HTTPS sortant uniquement vers `api.fabrikam.com` et vers tous les hôtes sous `fabrikam.net`" }
    - id: t3
      text: { en: "Allow TCP 1433 to the Azure SQL Database address ranges of West Europe, which Microsoft maintains", fr: "Autoriser TCP 1433 vers les plages d'adresses d'Azure SQL Database de West Europe, que Microsoft tient à jour" }
    - id: t4
      text: { en: "Make an internal web server reachable on the public IP address of FW1", fr: "Rendre un serveur web interne joignable sur l'adresse IP publique de FW1" }
answer:
  mapping: { t1: apptag, t2: appfqdn, t3: netsvc, t4: dnat }
explanation:
  correct:
    en: |
      FQDN tags (such as WindowsUpdate) are Microsoft-maintained groups of domain names used in application rules. Application rules match HTTP and HTTPS by target FQDN, with wildcards such as `*.fabrikam.net`, and don't need DNS proxy. Service tags (such as Sql.WestEurope) are Microsoft-maintained groups of IP prefixes used in network rules. Publishing an internal server on the firewall's public IP address is the job of a DNAT rule. An IP Group is a list of addresses that you maintain yourself.
    fr: |
      Les balises FQDN (comme WindowsUpdate) sont des groupes de noms de domaine tenus à jour par Microsoft et utilisés dans les règles d'application. Les règles d'application filtrent HTTP et HTTPS par FQDN cible, avec des caractères génériques comme `*.fabrikam.net`, sans proxy DNS. Les étiquettes de service (comme Sql.WestEurope) sont des groupes de préfixes IP tenus à jour par Microsoft et utilisés dans les règles de réseau. Publier un serveur interne sur l'adresse IP publique du pare-feu est le rôle d'une règle DNAT. Un groupe IP est une liste d'adresses que vous gérez vous-même.
references:
  - title: Azure Firewall rule processing logic
    url: https://learn.microsoft.com/en-us/azure/firewall/rule-processing
