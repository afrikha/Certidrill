id: az700-5a-ipfv-allowed-fails
objective: "5.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A hub-and-spoke network contains the following resources:

    - **VM1** (10.1.1.4) in a spoke named **Spoke1**. The subnet of VM1 has a route table and a network security group.
    - **VM2** (10.2.1.4) in a spoke named **Spoke2**. The subnet of VM2 has a network security group.

    An application on VM1 can't connect to VM2 on TCP 8443. You run IP flow verify for the outbound flow from VM1 and for the inbound flow to VM2. Both tests return **Access allowed**. The guest firewalls of both VMs allow TCP 8443.

    What should you do next to identify the cause?
  fr: |
    Un réseau en étoile (hub-and-spoke) contient les ressources suivantes :

    - **VM1** (10.1.1.4) dans un spoke nommé **Spoke1**. Le sous-réseau de VM1 possède une table de routage et un groupe de sécurité réseau.
    - **VM2** (10.2.1.4) dans un spoke nommé **Spoke2**. Le sous-réseau de VM2 possède un groupe de sécurité réseau.

    Une application de VM1 ne parvient pas à se connecter à VM2 sur TCP 8443. Vous exécutez la vérification du flux IP pour le flux sortant de VM1 et pour le flux entrant vers VM2. Les deux tests renvoient **Accès autorisé**. Les pare-feu invités des deux machines virtuelles autorisent TCP 8443.

    Que devez-vous faire ensuite pour identifier la cause ?
body:
  options:
    - { id: a, text: { en: "Add an NSG rule with priority 100 that allows TCP 8443 on both subnets.", fr: "Ajouter sur les deux sous-réseaux une règle NSG de priorité 100 qui autorise TCP 8443." } }
    - { id: b, text: { en: "Run IP flow verify again for the same flows by using the UDP protocol.", fr: "Exécuter de nouveau la vérification du flux IP pour les mêmes flux avec le protocole UDP." } }
    - { id: c, text: { en: "Review the effective security rules of the network interface of VM2.", fr: "Examiner les règles de sécurité effectives de l'interface réseau de VM2." } }
    - { id: d, text: { en: "Run Next hop from VM1 to 10.2.1.4 to see where the effective route sends the traffic.", fr: "Exécuter Tronçon suivant de VM1 vers 10.2.1.4 pour voir où l'itinéraire effectif envoie le trafic." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      IP flow verify evaluates only security rules (NSG rules and security admin rules), not routing. With both directions allowed and the guest firewalls open, the next suspect is the route table of VM1's subnet: Next hop shows whether the traffic goes to an appliance, to a gateway or nowhere (None).
    fr: |
      La vérification du flux IP n'évalue que les règles de sécurité (règles NSG et règles d'administration de sécurité), pas le routage. Les deux sens étant autorisés et les pare-feu invités ouverts, le suspect suivant est la table de routage du sous-réseau de VM1 : le tronçon suivant montre si le trafic part vers une appliance, vers une passerelle ou nulle part (None).
  options:
    a: { en: "IP flow verify already shows that the security rules allow the flow.", fr: "La vérification du flux IP montre déjà que les règles de sécurité autorisent le flux." }
    b: { en: "The application uses TCP; testing UDP doesn't explain a TCP failure.", fr: "L'application utilise TCP ; tester UDP n'explique pas un échec en TCP." }
    c: { en: "Effective security rules show the same NSG rules that IP flow verify already evaluated.", fr: "Les règles de sécurité effectives montrent les mêmes règles NSG que la vérification du flux IP a déjà évaluées." }
references:
  - title: IP flow verify overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview
