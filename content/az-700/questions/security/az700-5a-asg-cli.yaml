id: az700-5a-asg-cli
objective: "5.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A virtual machine named **VM-Web1** has a network interface named **vm-web1-nic** whose IP configuration is named **ipconfig1**. An application security group named **asg-web** and a network security group named **nsg-app** already exist.

    You need to add VM-Web1 to asg-web, and then create a rule in nsg-app that allows HTTPS from the internet to every member of asg-web.

    How should you complete the Azure CLI commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une machine virtuelle nommée **VM-Web1** possède une interface réseau nommée **vm-web1-nic** dont la configuration IP s'appelle **ipconfig1**. Un groupe de sécurité d'application nommé **asg-web** et un groupe de sécurité réseau nommé **nsg-app** existent déjà.

    Vous devez ajouter VM-Web1 à asg-web, puis créer dans nsg-app une règle qui autorise HTTPS depuis Internet vers tous les membres d'asg-web.

    Comment devez-vous compléter les commandes Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network [[cmd]] \
      --resource-group RG-App --nic-name vm-web1-nic --name ipconfig1 \
      --asgs asg-web

    az network nsg rule create \
      --resource-group RG-Net --nsg-name nsg-app --name Allow-HTTPS-Web \
      --priority 110 --direction Inbound --access Allow --protocol Tcp \
      --source-address-prefixes Internet \
      [[dest]] asg-web --destination-port-ranges 443
  slots:
    - id: cmd
      options:
        - { id: ipcfg, text: nic ip-config update }
        - { id: nicupd, text: nic update }
        - { id: asgupd, text: asg update }
    - id: dest
      options:
        - { id: dasg, text: --destination-asgs }
        - { id: sasg, text: --source-asgs }
        - { id: dpref, text: --destination-address-prefixes }
answer:
  values: { cmd: ipcfg, dest: dasg }
explanation:
  correct:
    en: |
      ASG membership is a property of a network interface IP configuration, set with `az network nic ip-config update --asgs` (`--nic-name` and `--name` identify the IP configuration). In the rule, `--destination-asgs` makes the members of asg-web the destination, while the source stays the Internet service tag.
    fr: |
      L'appartenance à un ASG est une propriété d'une configuration IP d'interface réseau, définie avec `az network nic ip-config update --asgs` (`--nic-name` et `--name` identifient la configuration IP). Dans la règle, `--destination-asgs` fait des membres d'asg-web la destination, tandis que la source reste l'étiquette de service Internet.
  options:
    nicupd: { en: "az network nic update has no --asgs parameter and no --nic-name parameter.", fr: "az network nic update n'a ni paramètre --asgs ni paramètre --nic-name." }
    asgupd: { en: "az network asg update changes the ASG resource; membership is set on the IP configuration.", fr: "az network asg update modifie la ressource ASG ; l'appartenance se définit sur la configuration IP." }
    sasg: { en: "--source-asgs would make the web servers the source of the traffic.", fr: "--source-asgs ferait des serveurs web la source du trafic." }
    dpref: { en: "--destination-address-prefixes expects IP prefixes or service tags, not an ASG name.", fr: "--destination-address-prefixes attend des préfixes IP ou des étiquettes de service, pas un nom d'ASG." }
references:
  - title: az network nic ip-config
    url: https://learn.microsoft.com/en-us/cli/azure/network/nic/ip-config?view=azure-cli-latest
  - title: az network nsg rule
    url: https://learn.microsoft.com/en-us/cli/azure/network/nsg/rule?view=azure-cli-latest
