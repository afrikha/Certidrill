id: az700-cs1a-firewall-sku
objective: "5.2.2"
type: single
caseStudy: az700-cs1a-litware-energy
difficulty: 1
status: draft
stem:
  en: You need to select the SKU of FW1. The solution must meet the security requirements. Which SKU should you select?
  fr: Vous devez sélectionner la référence SKU de FW1. La solution doit respecter les exigences de sécurité. Quelle référence SKU devez-vous sélectionner ?
body:
  options:
    - { id: a, text: { en: "Azure Firewall Basic", fr: "Pare-feu Azure Basic" } }
    - { id: b, text: { en: "Azure Firewall Standard", fr: "Pare-feu Azure Standard" } }
    - { id: c, text: { en: "Azure Firewall Standard with threat intelligence in Alert and deny mode", fr: "Pare-feu Azure Standard avec le renseignement sur les menaces en mode Alert and deny" } }
    - { id: d, text: { en: "Azure Firewall Premium", fr: "Pare-feu Azure Premium" } }
answer: { optionId: d }
explanation:
  correct:
    en: Only Azure Firewall Premium offers TLS inspection of outbound traffic, URL filtering on the full path and a fully managed signature-based intrusion detection and prevention system (IDPS). Filtering HTTPS traffic on the URL path requires TLS inspection, which decrypts the traffic first.
    fr: Seul Pare-feu Azure Premium offre l'inspection TLS du trafic sortant, le filtrage d'URL sur le chemin complet et un système de détection et de prévention d'intrusion (IDPS) entièrement managé fondé sur des signatures. Filtrer le trafic HTTPS sur le chemin d'URL exige l'inspection TLS, qui déchiffre d'abord le trafic.
  options:
    a:
      en: The Basic SKU offers no TLS inspection, no IDPS and no URL filtering, and its threat intelligence only raises alerts.
      fr: La référence SKU Basic n'offre ni inspection TLS, ni IDPS, ni filtrage d'URL, et son renseignement sur les menaces se limite à des alertes.
    b:
      en: The Standard SKU filters on FQDNs and web categories, but it can't decrypt HTTPS, filter on the URL path or run IDPS.
      fr: La référence SKU Standard filtre sur les noms de domaine complets et les catégories web, mais elle ne peut ni déchiffrer HTTPS, ni filtrer sur le chemin d'URL, ni exécuter l'IDPS.
    c:
      en: Threat intelligence blocks known malicious IP addresses and domains; it isn't signature-based intrusion detection and doesn't add TLS inspection or URL filtering.
      fr: Le renseignement sur les menaces bloque des adresses IP et des domaines malveillants connus ; ce n'est pas une détection d'intrusion par signatures et il n'ajoute ni inspection TLS ni filtrage d'URL.
references:
  - title: Choose the right Azure Firewall SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/firewall/choose-firewall-sku
  - title: Azure Firewall Premium features implementation guide
    url: https://learn.microsoft.com/en-us/azure/firewall/premium-features
