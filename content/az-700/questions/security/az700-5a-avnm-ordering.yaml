id: az700-5a-avnm-ordering
objective: "5.1.10"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso has about 40 virtual networks in three subscriptions under a management group named **MG-Prod**. The production virtual networks have the tag `env=prod`. Application teams manage the network security groups of their subnets.

    You need to block inbound TCP 3389 from the internet on every production virtual network, including the production virtual networks created later. Application teams must not be able to override the block by editing their network security groups.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso possède une quarantaine de réseaux virtuels répartis dans trois abonnements sous un groupe d'administration nommé **MG-Prod**. Les réseaux virtuels de production portent l'étiquette `env=prod`. Les équipes d'application gèrent les groupes de sécurité réseau de leurs sous-réseaux.

    Vous devez bloquer le trafic TCP 3389 entrant depuis Internet sur tous les réseaux virtuels de production, y compris ceux qui seront créés plus tard. Les équipes d'application ne doivent pas pouvoir contourner le blocage en modifiant leurs groupes de sécurité réseau.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: nm, text: { en: "Create a network manager whose scope is MG-Prod.", fr: "Créer un gestionnaire de réseau dont l'étendue est MG-Prod." } }
    - { id: ng, text: { en: "Create a network group with dynamic membership based on the tag env=prod.", fr: "Créer un groupe réseau à appartenance dynamique fondée sur l'étiquette env=prod." } }
    - { id: cfg, text: { en: "Create a security admin configuration with a rule collection that targets the network group and contains a Deny rule for TCP 3389 from Internet.", fr: "Créer une configuration d'administration de sécurité avec un regroupement de règles qui cible le groupe réseau et contient une règle Deny pour TCP 3389 depuis Internet." } }
    - { id: dep, text: { en: "Deploy the security admin configuration to the regions that contain the production virtual networks.", fr: "Déployer la configuration d'administration de sécurité dans les régions qui contiennent les réseaux virtuels de production." } }
    - { id: pol, text: { en: "Assign an Azure Policy definition that audits NSG rules allowing TCP 3389.", fr: "Attribuer une définition Azure Policy qui audite les règles NSG autorisant TCP 3389." } }
    - { id: conn, text: { en: "Create a connectivity configuration with a hub-and-spoke topology.", fr: "Créer une configuration de connectivité avec une topologie hub-and-spoke." } }
    - { id: nsg, text: { en: "Associate a network security group that denies TCP 3389 with every subnet.", fr: "Associer à chaque sous-réseau un groupe de sécurité réseau qui refuse TCP 3389." } }
answer:
  sequence: [ nm, ng, cfg, dep ]
explanation:
  correct:
    en: |
      The network manager defines the scope (MG-Prod). A network group with dynamic membership, evaluated through Azure Policy, picks up every virtual network tagged env=prod, now and later. The security admin configuration holds a rule collection that targets the group, and nothing applies until you deploy it to the regions. Security admin Deny rules are evaluated before NSG rules, so application teams can't override them.
    fr: |
      Le gestionnaire de réseau définit l'étendue (MG-Prod). Un groupe réseau à appartenance dynamique, évaluée par Azure Policy, inclut tous les réseaux virtuels étiquetés env=prod, aujourd'hui et plus tard. La configuration d'administration de sécurité contient un regroupement de règles qui cible le groupe, et rien ne s'applique tant que vous ne l'avez pas déployée dans les régions. Les règles d'administration de sécurité Deny sont évaluées avant les règles NSG : les équipes d'application ne peuvent pas les contourner.
  options:
    pol: { en: "An audit policy reports non-compliant rules but doesn't block the traffic.", fr: "Une stratégie d'audit signale les règles non conformes mais ne bloque pas le trafic." }
    conn: { en: "A connectivity configuration builds peerings; it doesn't filter traffic.", fr: "Une configuration de connectivité crée des peerings ; elle ne filtre pas le trafic." }
    nsg: { en: "Application teams manage their NSGs and could edit the rule; new virtual networks wouldn't be covered.", fr: "Les équipes d'application gèrent leurs NSG et pourraient modifier la règle ; les nouveaux réseaux virtuels ne seraient pas couverts." }
references:
  - title: How to block network traffic with Azure Virtual Network Manager - Azure portal
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/how-to-block-network-traffic-portal
  - title: What is a network group in Azure Virtual Network Manager?
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-network-groups
