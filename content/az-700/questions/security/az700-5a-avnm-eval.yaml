id: az700-5a-avnm-eval
objective: "5.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Azure Virtual Network Manager deployed the following security admin rules to a virtual network named **VNet1**. VNet1 is peered with a hub that contains the monitoring servers (10.100.0.0/24).

    | Priority | Name | Action | Source | Destination port |
    | --- | --- | --- | --- | --- |
    | 10 | AllowMonitoring | Always Allow | 10.100.0.0/24 | TCP 5986 |
    | 20 | DenyMgmtInternet | Deny | Internet | TCP 22, 3389 |
    | 30 | AllowWeb | Allow | Any | TCP 443 |

    All the rules are inbound. A virtual machine named **VM1** in VNet1 has a public IP address and is connected to a subnet associated with a network security group named **NSG1**. NSG1 contains the following inbound rules in addition to the default rules.

    | Priority | Source | Destination port | Access |
    | --- | --- | --- | --- |
    | 100 | Any | TCP 5986 | Deny |
    | 200 | Internet | TCP 3389 | Allow |

    Which connection reaches VM1?
  fr: |
    Azure Virtual Network Manager a déployé les règles d'administration de sécurité suivantes sur un réseau virtuel nommé **VNet1**. VNet1 est relié par peering à un hub qui contient les serveurs de supervision (10.100.0.0/24).

    | Priorité | Nom | Action | Source | Port de destination |
    | --- | --- | --- | --- | --- |
    | 10 | AllowMonitoring | Always Allow | 10.100.0.0/24 | TCP 5986 |
    | 20 | DenyMgmtInternet | Deny | Internet | TCP 22, 3389 |
    | 30 | AllowWeb | Allow | Any | TCP 443 |

    Toutes les règles sont entrantes. Une machine virtuelle nommée **VM1** de VNet1 possède une adresse IP publique et est connectée à un sous-réseau associé à un groupe de sécurité réseau nommé **NSG1**. Outre les règles par défaut, NSG1 contient les règles entrantes suivantes.

    | Priorité | Source | Port de destination | Accès |
    | --- | --- | --- | --- |
    | 100 | Any | TCP 5986 | Deny |
    | 200 | Internet | TCP 3389 | Allow |

    Quelle connexion atteint VM1 ?
body:
  options:
    - { id: a, text: { en: "TCP 3389 from 203.0.113.7 on the internet", fr: "TCP 3389 depuis 203.0.113.7 sur Internet" } }
    - { id: b, text: { en: "TCP 443 from 203.0.113.7 on the internet", fr: "TCP 443 depuis 203.0.113.7 sur Internet" } }
    - { id: c, text: { en: "TCP 5986 from the monitoring server 10.100.0.10", fr: "TCP 5986 depuis le serveur de supervision 10.100.0.10" } }
    - { id: d, text: { en: "TCP 5986 from a virtual machine of VNet1 in another subnet", fr: "TCP 5986 depuis une machine virtuelle de VNet1 d'un autre sous-réseau" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Security admin rules are evaluated before NSG rules. AllowMonitoring uses Always Allow, so the traffic from 10.100.0.10 is delivered and NSG1's deny rule for 5986 is never evaluated.
    fr: |
      Les règles d'administration de sécurité sont évaluées avant les règles NSG. AllowMonitoring utilise Always Allow : le trafic issu de 10.100.0.10 est remis, et la règle de refus de NSG1 pour le port 5986 n'est jamais évaluée.
  options:
    a: { en: "DenyMgmtInternet drops the traffic before NSG1 is evaluated, so NSG1's allow rule doesn't matter.", fr: "DenyMgmtInternet abandonne le trafic avant l'évaluation de NSG1 : la règle d'autorisation de NSG1 ne compte pas." }
    b: { en: "AllowWeb only passes the traffic to NSG1, which has no rule allowing 443 from the internet, so DenyAllInbound blocks it.", fr: "AllowWeb ne fait que transmettre le trafic à NSG1, qui n'a aucune règle autorisant 443 depuis Internet : DenyAllInbound le bloque." }
    d: { en: "The source isn't in 10.100.0.0/24, so no security admin rule matches and NSG1's rule 100 denies it.", fr: "La source n'est pas dans 10.100.0.0/24 : aucune règle d'administration de sécurité ne correspond, et la règle 100 de NSG1 la refuse." }
references:
  - title: Security Admin Rules in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins
