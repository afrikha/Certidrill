id: az700-5a-nsg-stateful-facts
objective: "5.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A virtual machine named **VM1** is connected to a subnet associated with a network security group named **NSG1**. No other network security group applies to VM1. NSG1 contains the following custom rules in addition to the default rules.

    | Direction | Priority | Source | Destination | Port | Access |
    | --- | --- | --- | --- | --- | --- |
    | Inbound | 200 | 198.51.100.0/24 | Any | TCP 22 | Allow |
    | Outbound | 4000 | Any | Any | Any | Deny |

    An administrator at 198.51.100.15 has an open SSH session to VM1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une machine virtuelle nommée **VM1** est connectée à un sous-réseau associé à un groupe de sécurité réseau nommé **NSG1**. Aucun autre groupe de sécurité réseau ne s'applique à VM1. Outre les règles par défaut, NSG1 contient les règles personnalisées suivantes.

    | Direction | Priorité | Source | Destination | Port | Accès |
    | --- | --- | --- | --- | --- | --- |
    | Entrant | 200 | 198.51.100.0/24 | Any | TCP 22 | Allow |
    | Sortant | 4000 | Any | Any | Any | Deny |

    Un administrateur situé à l'adresse 198.51.100.15 a une session SSH ouverte vers VM1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If you delete the inbound rule that has priority 200, the open SSH session from 198.51.100.15 is disconnected immediately.
        fr: Si vous supprimez la règle entrante de priorité 200, la session SSH ouverte depuis 198.51.100.15 est immédiatement déconnectée.
    - id: s2
      text:
        en: The responses that VM1 sends to SSH clients in 198.51.100.0/24 are allowed even though the outbound rule that has priority 4000 denies all traffic.
        fr: Les réponses que VM1 envoie aux clients SSH de 198.51.100.0/24 sont autorisées, même si la règle sortante de priorité 4000 refuse tout le trafic.
    - id: s3
      text:
        en: The outbound rule that has priority 4000 prevents VM1 from resolving names by using the Azure-provided DNS service at 168.63.129.16.
        fr: La règle sortante de priorité 4000 empêche VM1 de résoudre des noms avec le service DNS fourni par Azure à l'adresse 168.63.129.16.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      NSG rules affect only new connections, so removing the allow rule doesn't cut an established session; new SSH connections are then blocked. An NSG is stateful: the return traffic of an allowed inbound flow needs no outbound rule. Traffic to the host IP 168.63.129.16 (DHCP, DNS, health monitoring) isn't filtered by NSG rules unless a rule targets the AzurePlatformDNS, AzurePlatformIMDS or AzurePlatformLKM service tags.
    fr: "Les règles NSG ne s'appliquent qu'aux nouvelles connexions : supprimer la règle d'autorisation ne coupe pas une session établie, mais les nouvelles connexions SSH sont ensuite bloquées. Un NSG est avec état : le trafic de retour d'un flux entrant autorisé n'a besoin d'aucune règle sortante. Le trafic vers l'IP hôte 168.63.129.16 (DHCP, DNS, surveillance de l'intégrité) n'est pas filtré par les règles NSG, sauf si une règle cible les étiquettes de service AzurePlatformDNS, AzurePlatformIMDS ou AzurePlatformLKM."
references:
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
