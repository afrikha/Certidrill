id: az700-cs1a-billing-egress
objective: "5.2.4"
type: ordering
caseStudy: az700-cs1a-litware-energy
difficulty: 2
status: draft
stem:
  en: |
    You need to implement the requirement for the internet-bound traffic of snet-app. The virtual machines in snet-app must not lose internet access while you make the change.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez mettre en œuvre l'exigence relative au trafic à destination d'Internet de snet-app. Les machines virtuelles de snet-app ne doivent pas perdre l'accès à Internet pendant la modification.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: deploy, text: { en: "Deploy FW1 to AzureFirewallSubnet with a firewall policy that allows the required outbound traffic.", fr: "Déployer FW1 dans AzureFirewallSubnet avec une stratégie de pare-feu qui autorise le trafic sortant requis." } }
    - { id: rt, text: { en: "Create a route table that contains a route for 0.0.0.0/0 with the next hop type **Virtual appliance** and the next hop address 10.20.1.4.", fr: "Créer une table de routage qui contient un itinéraire pour 0.0.0.0/0 avec le type de tronçon suivant **Appliance virtuelle** et l'adresse de tronçon suivant 10.20.1.4." } }
    - { id: assoc, text: { en: "Associate the route table with snet-app.", fr: "Associer la table de routage à snet-app." } }
    - { id: gw, text: { en: "Associate the route table with GatewaySubnet.", fr: "Associer la table de routage à GatewaySubnet." } }
    - { id: fwsub, text: { en: "Associate the route table with AzureFirewallSubnet.", fr: "Associer la table de routage à AzureFirewallSubnet." } }
    - { id: vgw, text: { en: "Create a route table that contains a route for 0.0.0.0/0 with the next hop type **Virtual network gateway**.", fr: "Créer une table de routage qui contient un itinéraire pour 0.0.0.0/0 avec le type de tronçon suivant **Passerelle de réseau virtuel**." } }
answer:
  sequence: [ deploy, rt, assoc ]
explanation:
  correct:
    en: FW1 must exist, with rules that allow the required traffic, before any route points to 10.20.1.4; otherwise the traffic of snet-app would be dropped. The user-defined route for 0.0.0.0/0 with the next hop type Virtual appliance overrides the default internet route only for the subnets associated with its route table, so the table is then associated with snet-app.
    fr: "FW1 doit exister, avec des règles qui autorisent le trafic requis, avant qu'un itinéraire ne pointe vers 10.20.1.4 ; sinon, le trafic de snet-app serait abandonné. L'itinéraire défini par l'utilisateur pour 0.0.0.0/0 avec le type de tronçon suivant Appliance virtuelle remplace l'itinéraire Internet par défaut uniquement pour les sous-réseaux associés à sa table de routage : la table est ensuite associée à snet-app."
  options:
    gw:
      en: A route table that sends 0.0.0.0/0 elsewhere must not be associated with GatewaySubnet, and it wouldn't change the routing of snet-app.
      fr: Une table de routage qui envoie 0.0.0.0/0 ailleurs ne doit pas être associée à GatewaySubnet, et elle ne modifierait pas le routage de snet-app.
    fwsub:
      en: Sending the default route of AzureFirewallSubnet back to FW1 would create a loop; the firewall subnet keeps its direct internet route.
      fr: Renvoyer l'itinéraire par défaut d'AzureFirewallSubnet vers FW1 créerait une boucle ; le sous-réseau du pare-feu conserve son itinéraire Internet direct.
    vgw:
      en: A next hop of type Virtual network gateway would force the traffic toward the datacenter through the gateways of VNet-Hub instead of sending it to FW1.
      fr: Un tronçon suivant de type Passerelle de réseau virtuel forcerait le trafic vers le centre de données par les passerelles de VNet-Hub au lieu de l'envoyer à FW1.
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
