id: az700-5a-rule-vnet-tag-onprem
objective: "5.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A virtual network named **VNet-Hub** (10.0.0.0/16) has a VPN gateway with a site-to-site connection to the on-premises network 10.50.0.0/16. The on-premises administrators use the range 10.50.8.0/24.

    A virtual machine named **VM-Mgmt1** (10.0.2.4) is connected to a subnet that is associated with a network security group named **NSG-Mgmt**. NSG-Mgmt contains the following inbound rules in addition to the default rules.

    | Priority | Name | Source | Port | Access |
    | --- | --- | --- | --- | --- |
    | 100 | Allow-RDP-Partner | 203.0.113.0/24 | TCP 3389 | Allow |
    | 150 | Deny-RDP-VNet | VirtualNetwork | TCP 3389 | Deny |
    | 200 | Allow-RDP-Admins | 10.50.8.0/24 | TCP 3389 | Allow |

    An administrator at 10.50.8.25 opens an RDP connection to 10.0.2.4 over the VPN.

    What happens to the connection?
  fr: |
    Un réseau virtuel nommé **VNet-Hub** (10.0.0.0/16) possède une passerelle VPN avec une connexion de site à site vers le réseau local 10.50.0.0/16. Les administrateurs locaux utilisent la plage 10.50.8.0/24.

    Une machine virtuelle nommée **VM-Mgmt1** (10.0.2.4) est connectée à un sous-réseau associé à un groupe de sécurité réseau nommé **NSG-Mgmt**. Outre les règles par défaut, NSG-Mgmt contient les règles entrantes suivantes.

    | Priorité | Nom | Source | Port | Accès |
    | --- | --- | --- | --- | --- |
    | 100 | Allow-RDP-Partner | 203.0.113.0/24 | TCP 3389 | Allow |
    | 150 | Deny-RDP-VNet | VirtualNetwork | TCP 3389 | Deny |
    | 200 | Allow-RDP-Admins | 10.50.8.0/24 | TCP 3389 | Allow |

    Un administrateur situé à l'adresse 10.50.8.25 ouvre une connexion RDP vers 10.0.2.4 par le VPN.

    Qu'advient-il de la connexion ?
body:
  options:
    - { id: a, text: { en: "It's allowed by Allow-RDP-Admins.", fr: "Elle est autorisée par Allow-RDP-Admins." } }
    - { id: b, text: { en: "It's allowed by AllowVNetInBound.", fr: "Elle est autorisée par AllowVNetInBound." } }
    - { id: c, text: { en: "It's denied by DenyAllInbound.", fr: "Elle est refusée par DenyAllInbound." } }
    - { id: d, text: { en: "It's denied by Deny-RDP-VNet.", fr: "Elle est refusée par Deny-RDP-VNet." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The VirtualNetwork service tag includes on-premises address ranges connected through a virtual network gateway. The packet from 10.50.8.25 therefore matches Deny-RDP-VNet (150) before Allow-RDP-Admins (200), and processing stops at the first match. To fix it, give Allow-RDP-Admins a lower priority number than 150.
    fr: |
      L'étiquette de service VirtualNetwork inclut les plages d'adresses locales connectées par une passerelle de réseau virtuel. Le paquet issu de 10.50.8.25 correspond donc à Deny-RDP-VNet (150) avant Allow-RDP-Admins (200), et le traitement s'arrête à la première correspondance. Pour corriger, donnez à Allow-RDP-Admins un numéro de priorité inférieur à 150.
  options:
    a: { en: "Allow-RDP-Admins matches, but only after Deny-RDP-VNet, which already denied the packet.", fr: "Allow-RDP-Admins correspond, mais seulement après Deny-RDP-VNet, qui a déjà refusé le paquet." }
    b: { en: "Default rules (65000) are evaluated after every custom rule, so Deny-RDP-VNet is reached first.", fr: "Les règles par défaut (65000) sont évaluées après toutes les règles personnalisées : Deny-RDP-VNet est atteinte avant." }
    c: { en: "A custom rule matches before the default deny rule is reached.", fr: "Une règle personnalisée correspond avant que la règle de refus par défaut soit atteinte." }
references:
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
