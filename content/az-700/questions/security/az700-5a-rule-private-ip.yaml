id: az700-5a-rule-private-ip
objective: "5.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A virtual machine named **VM1** is connected to a subnet named **Subnet1**, which hosts several other virtual machines. VM1 has the private IP address 10.1.1.4 and a Standard SKU public IP address of 198.51.100.40. A network security group named **NSG1** is associated with Subnet1.

    A partner connects from the range 203.0.113.0/24 to the public IP address of VM1 over HTTPS.

    You need to add an inbound rule to NSG1 that allows HTTPS from the partner to VM1 only.

    What should you specify as the destination of the rule?
  fr: |
    Une machine virtuelle nommée **VM1** est connectée à un sous-réseau nommé **Subnet1**, qui héberge plusieurs autres machines virtuelles. VM1 possède l'adresse IP privée 10.1.1.4 et une adresse IP publique de référence SKU Standard, 198.51.100.40. Un groupe de sécurité réseau nommé **NSG1** est associé à Subnet1.

    Un partenaire se connecte depuis la plage 203.0.113.0/24 à l'adresse IP publique de VM1 en HTTPS.

    Vous devez ajouter à NSG1 une règle entrante qui autorise HTTPS depuis le partenaire vers VM1 uniquement.

    Que devez-vous indiquer comme destination de la règle ?
body:
  options:
    - { id: a, text: "198.51.100.40" }
    - { id: b, text: { en: "The VirtualNetwork service tag", fr: "L'étiquette de service VirtualNetwork" } }
    - { id: c, text: { en: "The Internet service tag", fr: "L'étiquette de service Internet" } }
    - { id: d, text: "10.1.1.4" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      For inbound traffic, network security groups process packets after Azure translates the public IP address to the private IP address of the resource. A rule that targets VM1 must therefore use its private address, 10.1.1.4.
    fr: |
      Pour le trafic entrant, les groupes de sécurité réseau traitent les paquets après la traduction par Azure de l'adresse IP publique en adresse IP privée de la ressource. Une règle qui cible VM1 doit donc utiliser son adresse privée, 10.1.1.4.
  options:
    a: { en: "The NSG sees the destination after translation, so a rule on the public IP address never matches.", fr: "Le NSG voit la destination après traduction : une règle sur l'adresse IP publique ne correspond jamais." }
    c: { en: "Internet describes addresses outside the virtual network; it can't designate VM1 as a destination.", fr: "Internet désigne des adresses hors du réseau virtuel ; cette étiquette ne peut pas désigner VM1 comme destination." }
    b: { en: "VirtualNetwork would allow the partner to reach every virtual machine of the subnet.", fr: "VirtualNetwork permettrait au partenaire d'atteindre toutes les machines virtuelles du sous-réseau." }
references:
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
