id: az700-5a-ipfv-network-watcher
objective: "5.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A subscription named **Sub1** contains virtual machines in the West Europe and Sweden Central regions. Network Watcher is enabled in Sub1 only for West Europe.

    You need to use IP flow verify to test inbound traffic to a virtual machine named **VM-SE1** in Sweden Central.

    What should you do first?
  fr: |
    Un abonnement nommé **Sub1** contient des machines virtuelles dans les régions West Europe et Sweden Central. Network Watcher n'est activé dans Sub1 que pour West Europe.

    Vous devez utiliser la vérification du flux IP pour tester le trafic entrant vers une machine virtuelle nommée **VM-SE1** située dans Sweden Central.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Enable Network Watcher for Sweden Central in Sub1.", fr: "Activer Network Watcher pour Sweden Central dans Sub1." } }
    - { id: b, text: { en: "Install the Network Watcher Agent extension on VM-SE1.", fr: "Installer l'extension Network Watcher Agent sur VM-SE1." } }
    - { id: c, text: { en: "Create a virtual network flow log for the VNet of VM-SE1.", fr: "Créer un journal de flux de réseau virtuel pour le réseau de VM-SE1." } }
    - { id: d, text: { en: "Peer the VNet of VM-SE1 with a virtual network in West Europe.", fr: "Relier par peering le réseau de VM-SE1 à un réseau virtuel de West Europe." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      IP flow verify requires a Network Watcher instance in the same subscription and region as the virtual machine. Enabling Network Watcher for Sweden Central in Sub1 makes the test available for VM-SE1.
    fr: |
      La vérification du flux IP exige une instance Network Watcher dans le même abonnement et la même région que la machine virtuelle. Activer Network Watcher pour Sweden Central dans Sub1 rend le test disponible pour VM-SE1.
  options:
    b: { en: "IP flow verify evaluates the security rules on the platform side; it doesn't need an agent in the VM.", fr: "La vérification du flux IP évalue les règles de sécurité côté plateforme ; elle n'a pas besoin d'agent dans la machine virtuelle." }
    c: { en: "Flow logs record traffic over time; they aren't a prerequisite of IP flow verify, and they also need Network Watcher in the region.", fr: "Les journaux de flux enregistrent le trafic dans le temps ; ils ne sont pas un prérequis de la vérification du flux IP et exigent eux aussi Network Watcher dans la région." }
    d: { en: "Peering doesn't make a Network Watcher instance of another region available to the VM.", fr: "Le peering ne rend pas disponible pour la machine virtuelle une instance Network Watcher d'une autre région." }
references:
  - title: IP flow verify overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview
