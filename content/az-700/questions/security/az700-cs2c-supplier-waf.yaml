id: az700-cs2c-supplier-waf
objective: "5.3.7"
type: multi
caseStudy: az700-cs2c-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You need to publish the supplier portal and protect it with wafpol-suppliers. The solution must meet the requirements.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez publier le portail fournisseurs et le protéger avec wafpol-suppliers. La solution doit respecter les exigences.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Associate wafpol-suppliers with appgw-orders.", fr: "Associer wafpol-suppliers à appgw-orders." } }
    - { id: b, text: { en: "Create a multi-site listener for suppliers.fourthcoffee.com on port 443 of pip-agw.", fr: "Créer un écouteur multisite pour suppliers.fourthcoffee.com sur le port 443 de pip-agw." } }
    - { id: c, text: { en: "Associate wafpol-suppliers with the backend pool vmss-suppliers.", fr: "Associer wafpol-suppliers au pool principal vmss-suppliers." } }
    - { id: d, text: { en: "Associate wafpol-suppliers with the listener of suppliers.fourthcoffee.com.", fr: "Associer wafpol-suppliers à l'écouteur de suppliers.fourthcoffee.com." } }
    - { id: e, text: { en: "Deploy a second WAF_v2 application gateway for suppliers.fourthcoffee.com.", fr: "Déployer une seconde passerelle d'application WAF_v2 pour suppliers.fourthcoffee.com." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Several sites share the same frontend IP address and port through multi-site listeners, each matching its own host name. A WAF policy can be associated with the whole gateway, with a listener (per-site policy) or with a path-based rule (per-URI policy), and the most specific policy wins; associating wafpol-suppliers with the supplier listener protects only that site, while lst-orders keeps the global wafpol-orders.
    fr: |
      Plusieurs sites partagent la même adresse IP frontale et le même port grâce à des écouteurs multisites, chacun correspondant à son propre nom d'hôte. Une stratégie WAF peut être associée à toute la passerelle, à un écouteur (stratégie par site) ou à une règle basée sur le chemin (stratégie par URI), et la stratégie la plus spécifique l'emporte ; associer wafpol-suppliers à l'écouteur des fournisseurs protège uniquement ce site, tandis que lst-orders conserve la stratégie globale wafpol-orders.
  options:
    a: { en: "A policy associated with the gateway applies to every listener that has no policy of its own, including lst-orders.", fr: "Une stratégie associée à la passerelle s'applique à chaque écouteur qui n'a pas sa propre stratégie, y compris lst-orders." }
    c: { en: "A WAF policy is associated with the gateway, a listener or a path-based rule, not with a backend pool.", fr: "Une stratégie WAF s'associe à la passerelle, à un écouteur ou à une règle basée sur le chemin, pas à un pool principal." }
    e: { en: "A second gateway would need another public IP address and increases administrative effort.", fr: "Une seconde passerelle exigerait une autre adresse IP publique et augmente l'effort d'administration." }
references:
  - title: Configure per-site WAF policies using Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/per-site-policies
  - title: Application Gateway listener configuration
    url: https://learn.microsoft.com/en-us/azure/application-gateway/configuration-listeners
