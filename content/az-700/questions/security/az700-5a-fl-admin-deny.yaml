id: az700-5a-fl-admin-deny
objective: "5.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso uses Azure Virtual Network Manager to deploy security admin rules to its virtual networks. A virtual machine named **VM-App1** is connected to a subnet of a virtual network named **VNet-App**. The network security group of the subnet contains an inbound rule with priority 100 that allows TCP 22 from 198.51.100.0/24.

    Engineers at 198.51.100.30 can't open SSH sessions to VM-App1. In the virtual network flow log of VNet-App, the attempts appear as tuples with the flow state D in a flow group whose rule is `Deny-Mgmt-Internet`. The `aclID` of the flows entry refers to a security admin configuration of the network manager.

    You need to allow SSH from 198.51.100.0/24 to VM-App1 while keeping the restriction for all other sources.

    What should you do?
  fr: |
    Contoso utilise Azure Virtual Network Manager pour déployer des règles d'administration de sécurité sur ses réseaux virtuels. Une machine virtuelle nommée **VM-App1** est connectée à un sous-réseau d'un réseau virtuel nommé **VNet-App**. Le groupe de sécurité réseau du sous-réseau contient une règle entrante de priorité 100 qui autorise TCP 22 depuis 198.51.100.0/24.

    Les ingénieurs situés à l'adresse 198.51.100.30 ne parviennent pas à ouvrir de sessions SSH vers VM-App1. Dans le journal de flux de réseau virtuel de VNet-App, les tentatives apparaissent sous forme de tuples d'état D dans un groupe de flux dont la règle est `Deny-Mgmt-Internet`. L'`aclID` de l'entrée flows désigne une configuration d'administration de sécurité du gestionnaire de réseau.

    Vous devez autoriser SSH depuis 198.51.100.0/24 vers VM-App1 tout en conservant la restriction pour toutes les autres sources.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add an NSG rule with priority 90 that allows TCP 22 from 198.51.100.0/24.", fr: "Ajouter une règle NSG de priorité 90 qui autorise TCP 22 depuis 198.51.100.0/24." } }
    - { id: b, text: { en: "Add a higher-priority security admin rule that allows TCP 22 from 198.51.100.0/24, then redeploy.", fr: "Ajouter une règle d'administration de sécurité de priorité plus haute qui autorise TCP 22 depuis 198.51.100.0/24, puis redéployer." } }
    - { id: c, text: { en: "Dissociate the network security group from the subnet of VM-App1.", fr: "Dissocier le groupe de sécurité réseau du sous-réseau de VM-App1." } }
    - { id: d, text: { en: "Add VM-App1 to an application security group referenced by an allow rule of the NSG.", fr: "Ajouter VM-App1 à un groupe de sécurité d'application référencé par une règle d'autorisation du NSG." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The aclID shows that a security admin rule, not the NSG, denied the flow. Security admin rules are evaluated before NSG rules, and a Deny ends the evaluation. A security admin rule with the Allow action and a lower priority number than Deny-Mgmt-Internet lets the traffic continue to the NSG, which allows it with rule 100. Changes apply only after you deploy the configuration again.
    fr: |
      L'aclID montre qu'une règle d'administration de sécurité, et non le NSG, a refusé le flux. Les règles d'administration de sécurité sont évaluées avant les règles NSG, et un refus (Deny) met fin à l'évaluation. Une règle d'administration de sécurité d'action Allow, de numéro de priorité inférieur à celui de Deny-Mgmt-Internet, laisse le trafic continuer vers le NSG, qui l'autorise avec la règle 100. Les modifications ne s'appliquent qu'après un nouveau déploiement de la configuration.
  options:
    a: { en: "The NSG already allows the traffic; the security admin Deny is applied before any NSG rule.", fr: "Le NSG autorise déjà le trafic ; le refus d'administration de sécurité s'applique avant toute règle NSG." }
    c: { en: "Removing the NSG doesn't remove the security admin rule, which still denies the flow.", fr: "Retirer le NSG ne retire pas la règle d'administration de sécurité, qui refuse toujours le flux." }
    d: { en: "NSG changes can't override a security admin Deny.", fr: "Aucune modification du NSG ne peut l'emporter sur un refus d'administration de sécurité." }
references:
  - title: Security Admin Rules in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins
  - title: Virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
