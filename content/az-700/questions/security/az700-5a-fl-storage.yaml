id: az700-5a-fl-storage
objective: "5.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Microsoft Entra tenant named **contoso.com**. A subscription named **Sub1**, linked to contoso.com, contains a virtual network named **VNet1** in the West Europe region.

    You plan to create a virtual network flow log for VNet1 with a retention of 90 days. You have the following storage accounts.

    | Name | Region | Subscription (tenant) | Performance | Account kind |
    | --- | --- | --- | --- | --- |
    | st1 | West Europe | Sub1 (contoso.com) | Standard | General-purpose v2 |
    | st2 | North Europe | Sub1 (contoso.com) | Standard | General-purpose v2 |
    | st3 | West Europe | Sub1 (contoso.com) | Premium | BlockBlobStorage |
    | st4 | West Europe | Sub2 (contoso.com) | Standard | General-purpose v2 |
    | st5 | West Europe | Sub3 (fabrikam.com) | Standard | General-purpose v2 |

    Which two storage accounts can you use?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso possède un locataire Microsoft Entra nommé **contoso.com**. Un abonnement nommé **Sub1**, lié à contoso.com, contient un réseau virtuel nommé **VNet1** dans la région West Europe.

    Vous prévoyez de créer un journal de flux de réseau virtuel pour VNet1 avec une rétention de 90 jours. Vous disposez des comptes de stockage suivants.

    | Nom | Région | Abonnement (locataire) | Performances | Type de compte |
    | --- | --- | --- | --- | --- |
    | st1 | West Europe | Sub1 (contoso.com) | Standard | Usage général v2 |
    | st2 | North Europe | Sub1 (contoso.com) | Standard | Usage général v2 |
    | st3 | West Europe | Sub1 (contoso.com) | Premium | BlockBlobStorage |
    | st4 | West Europe | Sub2 (contoso.com) | Standard | Usage général v2 |
    | st5 | West Europe | Sub3 (fabrikam.com) | Standard | Usage général v2 |

    Quels sont les deux comptes de stockage que vous pouvez utiliser ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: st1 }
    - { id: b, text: st2 }
    - { id: c, text: st3 }
    - { id: d, text: st4 }
    - { id: e, text: st5 }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      The storage account of a virtual network flow log must be in the same region as the virtual network, in the same subscription or in a subscription associated with the same Microsoft Entra tenant, and use Standard performance. Setting a retention period requires a Standard general-purpose v2 account. st1 and st4 meet every condition.
    fr: |
      Le compte de stockage d'un journal de flux de réseau virtuel doit se trouver dans la même région que le réseau virtuel, dans le même abonnement ou dans un abonnement associé au même locataire Microsoft Entra, et utiliser les performances Standard. Définir une durée de rétention exige un compte Standard à usage général v2. st1 et st4 remplissent toutes les conditions.
  options:
    b: { en: "st2 is in North Europe; the account must be in the region of the virtual network.", fr: "st2 est dans North Europe ; le compte doit être dans la région du réseau virtuel." }
    c: { en: "Premium storage accounts aren't supported for flow logs.", fr: "Les comptes de stockage Premium ne sont pas pris en charge pour les journaux de flux." }
    e: { en: "st5 belongs to another Microsoft Entra tenant.", fr: "st5 appartient à un autre locataire Microsoft Entra." }
references:
  - title: Virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
  - title: Create, change, enable, disable, or delete virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-manage
