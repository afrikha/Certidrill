id: az700-5b-waf-afd-standard-multi
objective: "5.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum publishes a web shop through an Azure Front Door Standard profile named **afd-shop**. The profile can't be upgraded this quarter.

    You need to configure protections in the WAF policy associated with afd-shop.

    Which two protections can you configure?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum publie une boutique web par un profil Azure Front Door Standard nommé **afd-shop**. Le profil ne peut pas être mis à niveau ce trimestre.

    Vous devez configurer des protections dans la stratégie WAF associée à afd-shop.

    Quelles sont les deux protections que vous pouvez configurer ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A rate limit rule that limits each socket IP address to 500 requests per minute on /cart", fr: "Une règle de limitation de débit qui limite chaque adresse IP de socket à 500 requêtes par minute sur /cart" } }
    - { id: b, text: { en: "The Default Rule Set 2.1 with anomaly scoring", fr: "Le Default Rule Set 2.1 avec scoring d'anomalie" } }
    - { id: c, text: { en: "A rate limit rule that groups the requests by country or region", fr: "Une règle de limitation de débit qui regroupe les requêtes par pays ou région" } }
    - { id: d, text: { en: "A custom rule that blocks requests from a list of countries", fr: "Une règle personnalisée qui bloque les requêtes d'une liste de pays" } }
    - { id: e, text: { en: "The Bot Manager 1.1 rule set", fr: "L'ensemble de règles Bot Manager 1.1" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Front Door Standard supports custom rules only. Rate limit rules grouped by socket address (the default) and geo-filtering rules with GeoMatch are custom rules, so both are available on Standard.
    fr: |
      Front Door Standard ne prend en charge que les règles personnalisées. Les règles de limitation de débit regroupées par adresse de socket (par défaut) et les règles de géofiltrage avec GeoMatch sont des règles personnalisées : elles sont donc disponibles sur Standard.
  options:
    b: { en: "Managed rule sets such as DRS 2.1 are available on Front Door Premium only.", fr: "Les ensembles de règles managés comme DRS 2.1 ne sont disponibles que sur Front Door Premium." }
    c: { en: "Grouping by country or region (like AS number or JA4) is a Premium-only option; Standard groups by socket address.", fr: "Le regroupement par pays ou région (comme par numéro AS ou JA4) est une option réservée à Premium ; Standard regroupe par adresse de socket." }
    e: { en: "Bot protection is a managed rule set, available on Front Door Premium.", fr: "La protection contre les bots est un ensemble de règles managé, disponible sur Front Door Premium." }
references:
  - title: What is rate limiting for Azure Front Door?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-rate-limit
  - title: Azure Web Application Firewall on Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/afds-overview
