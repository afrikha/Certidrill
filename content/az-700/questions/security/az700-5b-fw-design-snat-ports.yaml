id: az700-5b-fw-design-snat-ports
objective: "5.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an Azure Firewall Standard named **FW1** in a hub virtual network. FW1 has one Standard SKU public IP address. The spoke subnets send all their internet-bound traffic to FW1.

    Batch servers in the spokes open thousands of concurrent outbound connections to the same public IP address and port of a SaaS API. The firewall logs show SNAT port exhaustion during the batch window.

    You need to increase the number of SNAT ports available for this traffic.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un Pare-feu Azure Standard nommé **FW1** dans un réseau virtuel hub. FW1 possède une adresse IP publique de référence SKU Standard. Les sous-réseaux spokes envoient tout leur trafic à destination d'Internet vers FW1.

    Des serveurs de traitement par lots situés dans les spokes ouvrent des milliers de connexions sortantes simultanées vers la même adresse IP publique et le même port d'une API SaaS. Les journaux du pare-feu indiquent un épuisement des ports SNAT pendant la fenêtre de traitement.

    Vous devez augmenter le nombre de ports SNAT disponibles pour ce trafic.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Change the prefix of AzureFirewallSubnet from /26 to /24.", fr: "Faire passer le préfixe d'AzureFirewallSubnet de /26 à /24." } }
    - { id: b, text: { en: "Associate additional Standard SKU public IP addresses with FW1.", fr: "Associer des adresses IP publiques supplémentaires de référence SKU Standard à FW1." } }
    - { id: c, text: { en: "Upgrade FW1 from the Standard tier to the Premium tier.", fr: "Faire passer FW1 du niveau Standard au niveau Premium." } }
    - { id: d, text: { en: "Associate a StandardV2 NAT gateway with AzureFirewallSubnet.", fr: "Associer une passerelle NAT StandardV2 à AzureFirewallSubnet." } }
    - { id: e, text: { en: "Enable DNS proxy in the firewall policy of FW1.", fr: "Activer le proxy DNS dans la stratégie de pare-feu de FW1." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Azure Firewall provides 2,496 SNAT ports per public IP address for each backend instance, so adding public IP addresses (up to 250) adds ports. A NAT gateway associated with AzureFirewallSubnet allocates SNAT ports dynamically, 64,512 per public IP address, with no change to the user-defined routes; a StandardV2 NAT gateway is the one to use with a zone-redundant firewall.
    fr: Le Pare-feu Azure fournit 2 496 ports SNAT par adresse IP publique et par instance principale ; ajouter des adresses IP publiques (jusqu'à 250) ajoute donc des ports. Une passerelle NAT associée à AzureFirewallSubnet alloue les ports SNAT de façon dynamique, 64 512 par adresse IP publique, sans modifier les itinéraires définis par l'utilisateur ; une passerelle NAT StandardV2 est celle à utiliser avec un pare-feu redondant interzone.
  options:
    a: { en: "A /26 subnet is sufficient for every scaling scenario, and the subnet size doesn't change the number of SNAT ports.", fr: "Un sous-réseau /26 suffit pour tous les scénarios de mise à l'échelle, et la taille du sous-réseau ne change pas le nombre de ports SNAT." }
    c: { en: "Premium adds TLS inspection, IDPS and URL filtering; the SNAT ports still depend on the public IP addresses.", fr: "Premium ajoute l'inspection TLS, l'IDPS et le filtrage d'URL ; les ports SNAT dépendent toujours des adresses IP publiques." }
    e: { en: "DNS proxy enables FQDN filtering in network rules; it has no effect on SNAT.", fr: "Le proxy DNS permet le filtrage par FQDN dans les règles de réseau ; il n'a aucun effet sur la SNAT." }
references:
  - title: Scale SNAT ports with Azure NAT Gateway
    url: https://learn.microsoft.com/en-us/azure/firewall/integrate-with-nat-gateway
  - title: Azure Firewall FAQ
    url: https://learn.microsoft.com/en-us/azure/firewall/firewall-faq
