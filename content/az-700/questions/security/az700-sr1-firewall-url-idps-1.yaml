id: az700-sr1-firewall-url-idps-1
objective: "5.2.2"
type: series_yesno
series: az700-sr1-firewall-url-idps
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: |
    You deploy Azure Firewall Standard with an FQDN application rule and threat intelligence.
  fr: |
    Vous déployez Pare-feu Azure Standard avec une règle d'application FQDN et le renseignement sur les menaces.
body:
  solution:
    en: |
      You deploy **Azure Firewall Standard** with a Standard firewall policy. In the policy, you create an application rule that allows HTTPS to the FQDN **api.fabrikam.com**, and you set threat intelligence-based filtering to **Alert and deny**.
    fr: |
      Vous déployez **Pare-feu Azure Standard** avec une stratégie de pare-feu Standard. Dans la stratégie, vous créez une règle d'application qui autorise HTTPS vers le FQDN **api.fabrikam.com**, et vous définissez le filtrage basé sur le renseignement sur les menaces sur **Alert and deny**.
answer: { value: false }
explanation:
  correct:
    en: |
      Azure Firewall Standard filters HTTPS on the FQDN only, from the SNI of the TLS handshake, so the rule allows every path of api.fabrikam.com. Threat intelligence blocks known malicious IP addresses and domains; it doesn't inspect traffic for attack signatures. Full-URL filtering, TLS inspection and IDPS are Premium features.
    fr: |
      Pare-feu Azure Standard filtre HTTPS uniquement sur le FQDN, à partir du SNI de la négociation TLS : la règle autorise donc tous les chemins d'api.fabrikam.com. Le renseignement sur les menaces bloque des adresses IP et des domaines malveillants connus ; il n'inspecte pas le trafic à la recherche de signatures d'attaques. Le filtrage d'URL complète, l'inspection TLS et l'IDPS sont des fonctionnalités Premium.
references:
  - title: Choose the right Azure Firewall SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/firewall/choose-firewall-sku
