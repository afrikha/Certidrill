id: az700-cs1c-flow-logs
objective: "5.1.7"
type: yesno_statements
caseStudy: az700-cs1c-wingtip-toys
difficulty: 2
status: draft
stem:
  en: |
    You plan to enable a virtual network flow log for VNet-POS to meet the monitoring requirements. After the flow log is enabled, it contains the following flow tuple.

    `1763380800,10.100.17.20,10.60.1.4,51544,443,6,I,D,NX,0,0,0,0`

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'activer un journal de flux de réseau virtuel pour VNet-POS afin de respecter les exigences de supervision. Une fois le journal de flux activé, il contient le tuple de flux suivant.

    `1763380800,10.100.17.20,10.60.1.4,51544,443,6,I,D,NX,0,0,0,0`

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The tuple shows an inbound TCP flow from a store device to VM-POSAPI1 on port 443 that was denied.
        fr: Le tuple montre un flux TCP entrant d'un appareil de magasin vers VM-POSAPI1 sur le port 443 qui a été refusé.
    - id: s2
      text:
        en: You can configure the flow log of VNet-POS to store its data in stwtlogsweu.
        fr: Vous pouvez configurer le journal de flux de VNet-POS pour qu'il stocke ses données dans stwtlogsweu.
    - id: s3
      text:
        en: To record the flows denied by network security group rules, you must also enable NSG flow logs on the network security groups of VNet-POS.
        fr: Pour enregistrer les flux refusés par des règles de groupe de sécurité réseau, vous devez aussi activer des journaux de flux NSG sur les groupes de sécurité réseau de VNet-POS.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: In the tuple, 10.100.17.20 is a store address, 10.60.1.4 is VM-POSAPI1, 443 is the destination port, 6 is TCP, I means inbound and D means the flow was denied. The storage account of a flow log must be in the same region as the virtual network, so stwtlogsgwc must be used, not stwtlogsweu. Virtual network flow logs record the flows allowed and denied by NSG rules and by security admin rules on their own, and NSG flow logs can no longer be created.
    fr: "Dans le tuple, 10.100.17.20 est une adresse de magasin, 10.60.1.4 est VM-POSAPI1, 443 est le port de destination, 6 correspond à TCP, I signifie entrant et D indique que le flux a été refusé. Le compte de stockage d'un journal de flux doit se trouver dans la même région que le réseau virtuel : il faut utiliser stwtlogsgwc, pas stwtlogsweu. Les journaux de flux de réseau virtuel enregistrent à eux seuls les flux autorisés et refusés par les règles NSG et par les règles d'administration de la sécurité, et les journaux de flux NSG ne peuvent plus être créés."
references:
  - title: Virtual network flow logs
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
