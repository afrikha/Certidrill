id: az700-5b-fw-design-gw-udr
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has the following virtual networks in Azure:

    | Virtual network | Address space | Contents |
    | --- | --- | --- |
    | VNet-Hub | 10.0.0.0/16 | GatewaySubnet with a site-to-site VPN gateway named **VPNGW1**; AzureFirewallSubnet with an Azure Firewall named **FW1** (private IP address 10.0.1.4) |
    | VNet-Spoke1 | 10.10.0.0/16 | A subnet named **Apps** |

    VNet-Spoke1 is peered with VNet-Hub and uses the remote gateway. The on-premises network (192.168.0.0/16) is connected to VPNGW1 and advertises its routes by using BGP.

    The Apps subnet is associated with a route table that contains a route for 0.0.0.0/0 with the next hop type **Virtual appliance** and the address 10.0.1.4. Gateway route propagation is disabled on this route table.

    Traffic from Apps to the on-premises network is inspected by FW1, but traffic initiated from the on-premises network to Apps bypasses FW1.

    You need to ensure that FW1 inspects the traffic initiated from the on-premises network to Apps.

    What should you do?
  fr: |
    Contoso dispose des réseaux virtuels suivants dans Azure :

    | Réseau virtuel | Espace d'adressage | Contenu |
    | --- | --- | --- |
    | VNet-Hub | 10.0.0.0/16 | GatewaySubnet avec une passerelle VPN site à site nommée **VPNGW1** ; AzureFirewallSubnet avec un Pare-feu Azure nommé **FW1** (adresse IP privée 10.0.1.4) |
    | VNet-Spoke1 | 10.10.0.0/16 | Un sous-réseau nommé **Apps** |

    VNet-Spoke1 est relié à VNet-Hub par un peering et utilise la passerelle distante. Le réseau local (192.168.0.0/16) est connecté à VPNGW1 et annonce ses routes par BGP.

    Le sous-réseau Apps est associé à une table de routage qui contient un itinéraire pour 0.0.0.0/0 avec le type de tronçon suivant **Appliance virtuelle** et l'adresse 10.0.1.4. La propagation des routes de passerelle est désactivée sur cette table de routage.

    Le trafic d'Apps vers le réseau local est inspecté par FW1, mais le trafic initié depuis le réseau local vers Apps contourne FW1.

    Vous devez vous assurer que FW1 inspecte le trafic initié depuis le réseau local vers Apps.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a route for 192.168.0.0/16 with the next hop 10.0.1.4 to the route table of the Apps subnet.", fr: "Ajouter un itinéraire pour 192.168.0.0/16 avec le tronçon suivant 10.0.1.4 à la table de routage du sous-réseau Apps." }
    - id: b
      text: { en: "Associate GatewaySubnet with a route table that has a route for 10.10.0.0/16 with the next hop 10.0.1.4.", fr: "Associer à GatewaySubnet une table de routage qui contient un itinéraire pour 10.10.0.0/16 avec le tronçon suivant 10.0.1.4." }
    - id: c
      text: { en: "Associate AzureFirewallSubnet with a route table that has a route for 192.168.0.0/16 with the next hop 10.0.1.4.", fr: "Associer à AzureFirewallSubnet une table de routage qui contient un itinéraire pour 192.168.0.0/16 avec le tronçon suivant 10.0.1.4." }
    - id: d
      text: { en: "Enable gateway route propagation on the route table that is associated with the Apps subnet.", fr: "Activer la propagation des routes de passerelle sur la table de routage associée au sous-réseau Apps." }
answer: { optionId: b }
explanation:
  correct:
    en: Traffic that arrives from on-premises through VPNGW1 is routed from GatewaySubnet, which uses the peering system route to reach 10.10.0.0/16 directly. A route table on GatewaySubnet that sends the spoke prefix to the firewall's private IP address makes this traffic cross FW1, which gives a symmetric path with the default route on Apps.
    fr: "Le trafic qui arrive du réseau local par VPNGW1 est routé depuis GatewaySubnet, qui utilise la route système du peering pour joindre directement 10.10.0.0/16. Une table de routage sur GatewaySubnet qui envoie le préfixe du spoke vers l'adresse IP privée du pare-feu fait traverser FW1 à ce trafic, ce qui donne un chemin symétrique avec la route par défaut d'Apps."
  options:
    a: { en: "This route only affects traffic leaving Apps, which already goes to FW1 through the default route; it doesn't change the path of traffic coming from VPNGW1.", fr: "Cet itinéraire ne concerne que le trafic qui quitte Apps, déjà envoyé à FW1 par la route par défaut ; il ne change pas le chemin du trafic qui vient de VPNGW1." }
    c: { en: "A route on AzureFirewallSubnet controls where the firewall sends traffic; pointing the on-premises prefix to the firewall itself would loop and doesn't affect the gateway's path to the spoke.", fr: "Un itinéraire sur AzureFirewallSubnet détermine où le pare-feu envoie le trafic ; faire pointer le préfixe local vers le pare-feu lui-même créerait une boucle et ne modifie pas le chemin de la passerelle vers le spoke." }
    d: { en: "Propagation would let the BGP routes of the on-premises network override the default route on Apps, so the outbound traffic would also bypass FW1.", fr: "La propagation laisserait les routes BGP du réseau local primer sur la route par défaut d'Apps : le trafic sortant contournerait lui aussi FW1." }
references:
  - title: Deploy and configure Azure Firewall in a hybrid network by using the Azure portal
    url: https://learn.microsoft.com/en-us/azure/firewall/tutorial-hybrid-portal
