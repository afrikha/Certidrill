id: az700-5a-avnm-facts
objective: "5.1.10"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    A network manager named **NM1** has a security admin configuration named **SAC1** that targets a network group named **NG-Prod**. NG-Prod uses dynamic membership. SAC1 is deployed to the West Europe region.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un gestionnaire de réseau nommé **NM1** possède une configuration d'administration de sécurité nommée **SAC1** qui cible un groupe réseau nommé **NG-Prod**. NG-Prod utilise une appartenance dynamique. SAC1 est déployée dans la région West Europe.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can deploy a second security admin configuration from NM1 to West Europe while SAC1 remains deployed there.
        fr: Vous pouvez déployer depuis NM1 une seconde configuration d'administration de sécurité dans West Europe tout en y conservant SAC1.
    - id: s2
      text:
        en: A virtual network in West Europe that starts meeting the membership condition of NG-Prod receives the rules of SAC1 without a new deployment.
        fr: Un réseau virtuel de West Europe qui commence à remplir la condition d'appartenance de NG-Prod reçoit les règles de SAC1 sans nouveau déploiement.
    - id: s3
      text:
        en: Deploying None to West Europe removes the configurations of NM1 from that region.
        fr: Déployer None dans West Europe retire les configurations de NM1 de cette région.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A network manager can deploy only one security admin configuration per region; to add rules, add rule collections to that configuration. A virtual network added to a network group that has an active configuration in its region receives it without redeployment. A deployment sets the region's goal state, and deploying None removes the configurations.
    fr: |
      Un gestionnaire de réseau ne peut déployer qu'une seule configuration d'administration de sécurité par région ; pour ajouter des règles, ajoutez des regroupements de règles à cette configuration. Un réseau virtuel ajouté à un groupe réseau qui a une configuration active dans sa région la reçoit sans redéploiement. Un déploiement fixe l'état cible de la région, et déployer None retire les configurations.
references:
  - title: Manage configuration deployments in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-deployments
