id: az700-5a-rule-storage-only
objective: "5.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A subnet named **Subnet-App** in a virtual network in the West Europe region is associated with a network security group named **NSG-App**. NSG-App contains only the default rules.

    You need to configure NSG-App to meet the following requirements:

    - The virtual machines in Subnet-App can connect over HTTPS to Azure Storage accounts in West Europe.
    - The virtual machines can't connect to any other internet destination.
    - Traffic inside the virtual network continues to be allowed.

    Which two rules should you add? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un sous-réseau nommé **Subnet-App** d'un réseau virtuel de la région West Europe est associé à un groupe de sécurité réseau nommé **NSG-App**. NSG-App ne contient que les règles par défaut.

    Vous devez configurer NSG-App pour répondre aux exigences suivantes :

    - Les machines virtuelles de Subnet-App peuvent se connecter en HTTPS aux comptes Stockage Azure de West Europe.
    - Les machines virtuelles ne peuvent se connecter à aucune autre destination Internet.
    - Le trafic à l'intérieur du réseau virtuel reste autorisé.

    Quelles sont les deux règles à ajouter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Outbound, priority 100: allow TCP 443 to Storage.WestEurope", fr: "Sortante, priorité 100 : autoriser TCP 443 vers Storage.WestEurope" } }
    - { id: b, text: { en: "Outbound, priority 200: deny any protocol to Internet", fr: "Sortante, priorité 200 : refuser tout protocole vers Internet" } }
    - { id: c, text: { en: "Outbound, priority 50: deny any protocol to Internet", fr: "Sortante, priorité 50 : refuser tout protocole vers Internet" } }
    - { id: d, text: { en: "Outbound, priority 200: deny any protocol to Any", fr: "Sortante, priorité 200 : refuser tout protocole vers Any" } }
    - { id: e, text: { en: "Inbound, priority 300: allow TCP 443 from Storage.WestEurope", fr: "Entrante, priorité 300 : autoriser TCP 443 depuis Storage.WestEurope" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      The allow rule for the regional Storage.WestEurope service tag must be evaluated before the deny rule for the Internet tag, because the public addresses of Azure Storage are part of Internet. The default AllowVnetOutBound rule (65000) keeps traffic inside the virtual network allowed, since the deny rule targets only Internet.
    fr: |
      La règle d'autorisation pour l'étiquette de service régionale Storage.WestEurope doit être évaluée avant la règle de refus pour l'étiquette Internet, car les adresses publiques de Stockage Azure font partie d'Internet. La règle par défaut AllowVnetOutBound (65000) maintient l'autorisation du trafic interne au réseau virtuel, puisque la règle de refus ne cible qu'Internet.
  options:
    c: { en: "Priorities start at 100, and a deny evaluated before the storage rule would block Azure Storage too.", fr: "Les priorités commencent à 100, et un refus évalué avant la règle de stockage bloquerait aussi Stockage Azure." }
    d: { en: "Denying Any would override AllowVnetOutBound and block traffic inside the virtual network.", fr: "Refuser Any l'emporterait sur AllowVnetOutBound et bloquerait le trafic interne au réseau virtuel." }
    e: { en: "NSGs are stateful: the responses from Azure Storage are allowed without an inbound rule.", fr: "Les NSG sont avec état : les réponses de Stockage Azure sont autorisées sans règle entrante." }
references:
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
