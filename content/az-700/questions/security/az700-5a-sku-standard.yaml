id: az700-5a-sku-standard
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to deploy Azure Firewall in a hub virtual network. The firewall must meet the following requirements:

    - Allow NTP (UDP 123) from the spokes only to the destination FQDN **time.fabrikam.com**.
    - Block, and not only log, the traffic to and from known malicious IP addresses.
    - Support an expected throughput of 1.2 Gbps.

    TLS inspection and IDPS aren't required. The solution must minimize costs.

    Which SKU should you choose?
  fr: |
    Fabrikam prévoit de déployer le Pare-feu Azure dans un réseau virtuel hub. Le pare-feu doit répondre aux exigences suivantes :

    - Autoriser NTP (UDP 123) depuis les spokes uniquement vers le FQDN de destination **time.fabrikam.com**.
    - Bloquer, et pas seulement journaliser, le trafic à destination et en provenance d'adresses IP malveillantes connues.
    - Prendre en charge un débit attendu de 1,2 Gbit/s.

    L'inspection TLS et l'IDPS ne sont pas nécessaires. La solution doit réduire les coûts au minimum.

    Quelle référence SKU devez-vous choisir ?
body:
  shuffle: false
  options:
    - { id: a, text: Basic }
    - { id: b, text: Standard }
    - { id: c, text: Premium }
answer: { optionId: b }
explanation:
  correct:
    en: |
      FQDN filtering for a non-HTTP protocol such as NTP requires network rules with FQDNs and the DNS proxy, and blocking known malicious addresses requires threat intelligence in alert and deny mode. Both are in Standard, which scales up to 30 Gbps. Premium adds TLS inspection, IDPS and URL filtering, which aren't required and cost more.
    fr: |
      Le filtrage FQDN d'un protocole non HTTP comme NTP exige des règles de réseau avec FQDN et le proxy DNS, et le blocage des adresses malveillantes connues exige le renseignement sur les menaces en mode alerte et refus. Les deux figurent dans Standard, qui monte jusqu'à 30 Gbit/s. Premium ajoute l'inspection TLS, l'IDPS et le filtrage d'URL, qui ne sont pas nécessaires et coûtent plus cher.
  options:
    a: { en: "Basic is limited to 250 Mbps, has no network-level FQDN filtering or DNS proxy, and its threat intelligence only alerts.", fr: "Basic est limité à 250 Mbit/s, n'a ni filtrage FQDN au niveau réseau ni proxy DNS, et son renseignement sur les menaces ne fait qu'alerter." }
    c: { en: "Premium meets the requirements but costs more than Standard for features that aren't needed.", fr: "Premium répond aux exigences mais coûte plus cher que Standard pour des fonctionnalités inutiles." }
references:
  - title: Choose the right Azure Firewall SKU to meet your needs
    url: https://learn.microsoft.com/en-us/azure/firewall/choose-firewall-sku
  - title: Azure Firewall features by SKU
