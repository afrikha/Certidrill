id: az700-5a-avnm-actions
objective: "5.1.10"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses Azure Virtual Network Manager to govern network security across its subscriptions. Application teams manage the network security groups of their own subnets.

    What should you use to meet each requirement? To answer, drag the appropriate rule types to the correct requirements. Each rule type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise Azure Virtual Network Manager pour gouverner la sécurité réseau de ses abonnements. Les équipes d'application gèrent les groupes de sécurité réseau de leurs propres sous-réseaux.

    Que devez-vous utiliser pour répondre à chaque exigence ? Pour répondre, faites glisser les types de règles appropriés vers les exigences correspondantes. Chaque type de règle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: saallow, text: { en: "Security admin rule with the Allow action", fr: "Règle d'administration de sécurité d'action Allow" } }
    - { id: sadeny, text: { en: "Security admin rule with the Deny action", fr: "Règle d'administration de sécurité d'action Deny" } }
    - { id: saalways, text: { en: "Security admin rule with the Always Allow action", fr: "Règle d'administration de sécurité d'action Always Allow" } }
    - { id: nsgallow, text: { en: "NSG rule with the Allow action", fr: "Règle NSG d'action Allow" } }
    - { id: nsgdeny, text: { en: "NSG rule with the Deny action", fr: "Règle NSG d'action Deny" } }
  targets:
    - id: t1
      text: { en: "Block inbound SSH and RDP from the internet on all virtual networks; application teams must not be able to reopen them", fr: "Bloquer SSH et RDP entrants depuis Internet sur tous les réseaux virtuels ; les équipes d'application ne doivent pas pouvoir les rouvrir" }
    - id: t2
      text: { en: "Ensure that the monitoring servers in 10.100.0.0/24 always reach the VMs on TCP 5986, even if an application team's NSG denies it", fr: "Garantir que les serveurs de supervision de 10.100.0.0/24 atteignent toujours les machines virtuelles sur TCP 5986, même si le NSG d'une équipe d'application le refuse" }
    - id: t3
      text: { en: "Allow inbound HTTPS centrally on the web virtual networks while letting each application team's NSG make the final decision", fr: "Autoriser HTTPS entrant de façon centralisée sur les réseaux virtuels web tout en laissant le NSG de chaque équipe d'application prendre la décision finale" }
    - id: t4
      text: { en: "Block TCP 8080 between two subnets of one application team's virtual network, without affecting other teams", fr: "Bloquer TCP 8080 entre deux sous-réseaux du réseau virtuel d'une équipe d'application, sans affecter les autres équipes" }
answer:
  mapping: { t1: sadeny, t2: saalways, t3: saallow, t4: nsgdeny }
explanation:
  correct:
    en: |
      Security admin rules are evaluated before NSG rules. Deny drops the traffic and Always Allow delivers it, and in both cases the NSGs aren't evaluated. Allow lets the traffic continue to the NSGs, which can still deny it. A filtering need local to one team's subnets stays in that team's NSG.
    fr: |
      Les règles d'administration de sécurité sont évaluées avant les règles NSG. Deny abandonne le trafic et Always Allow le remet, et dans les deux cas les NSG ne sont pas évalués. Allow laisse le trafic continuer vers les NSG, qui peuvent encore le refuser. Un besoin de filtrage propre aux sous-réseaux d'une équipe reste dans le NSG de cette équipe.
  options:
    nsgallow: { en: "An NSG allow rule can't override a deny decided elsewhere, and it isn't needed for any requirement.", fr: "Une règle NSG d'autorisation ne peut pas l'emporter sur un refus décidé ailleurs, et aucune exigence n'en a besoin." }
references:
  - title: Security Admin Rules in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins
