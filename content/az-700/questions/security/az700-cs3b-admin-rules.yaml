id: az700-cs3b-admin-rules
objective: "5.1.10"
type: yesno_statements
caseStudy: az700-cs3b-bellows
difficulty: 3
status: draft
stem:
  en: |
    You create a security admin configuration in AVNM1 that targets NG-Labs, and you deploy it to West Europe. The configuration contains an inbound rule collection with the following rules:

    | Priority | Name | Source | Destination ports | Action |
    | --- | --- | --- | --- | --- |
    | 10 | Scanner | 10.10.5.50 | Any | Allow |
    | 20 | Block-Mgmt | Internet (service tag) | 22, 3389 | Deny |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez dans AVNM1 une configuration d'administrateur de sécurité qui cible NG-Labs, et vous la déployez dans West Europe. La configuration contient une collection de règles entrantes avec les règles suivantes :

    | Priorité | Nom | Source | Ports de destination | Action |
    | --- | --- | --- | --- | --- |
    | 10 | Scanner | 10.10.5.50 | Any | Allow |
    | 20 | Block-Mgmt | Internet (étiquette de service) | 22, 3389 | Deny |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Scanner rule meets the requirement for the vulnerability scanner.
        fr: La règle Scanner respecte l'exigence relative au scanner de vulnérabilités.
    - id: s2
      text:
        en: An RDP connection from the internet to a lab VM is dropped even if an instructor adds an NSG rule that allows TCP 3389 from Any.
        fr: Une connexion RDP depuis Internet vers une machine virtuelle de travaux pratiques est abandonnée même si un enseignant ajoute une règle NSG qui autorise TCP 3389 depuis Any.
    - id: s3
      text:
        en: The Block-Mgmt rule drops the RDP sessions that administrators open to lab VMs through Bastion-Hub.
        fr: La règle Block-Mgmt abandonne les sessions RDP que les administrateurs ouvrent vers les machines virtuelles de travaux pratiques par Bastion-Hub.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Security admin rules are evaluated before NSG rules. An Allow action lets the traffic continue to the NSGs, which can still deny it, so the scanner needs an Always allow rule, which ends evaluation and bypasses the NSGs. A Deny action also ends evaluation, so no NSG rule can let internet RDP through. Bastion connects to the VMs from its private address in AzureBastionSubnet, which doesn't match the Internet service tag.
    fr: |
      Les règles d'administrateur de sécurité sont évaluées avant les règles NSG. L'action Allow laisse le trafic continuer vers les NSG, qui peuvent encore le refuser : le scanner a donc besoin d'une règle Always allow, qui arrête l'évaluation et contourne les NSG. L'action Deny arrête elle aussi l'évaluation : aucune règle NSG ne peut laisser passer le RDP venant d'Internet. Bastion se connecte aux machines virtuelles depuis son adresse privée dans AzureBastionSubnet, qui ne correspond pas à l'étiquette de service Internet.
  options:
    s1: { en: "With Allow, an instructor's NSG can still deny the scanner; the requirement needs Always allow.", fr: "Avec Allow, le NSG d'un enseignant peut encore refuser le scanner ; l'exigence demande Always allow." }
    s3: { en: "Bastion traffic comes from the private range of AzureBastionSubnet, not from the internet.", fr: "Le trafic de Bastion provient de la plage privée d'AzureBastionSubnet, pas d'Internet." }
references:
  - title: Security admin rules in Azure Virtual Network Manager
    url: https://learn.microsoft.com/en-us/azure/virtual-network-manager/concept-security-admins
