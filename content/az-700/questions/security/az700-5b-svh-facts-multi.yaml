id: az700-5b-svh-facts-multi
objective: "5.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Virtual WAN that contains two secured virtual hubs named **hub-weu** and **hub-neu**. Each hub has an Azure Firewall and routing intent with an Internet traffic policy and a Private traffic policy. Inter-hub is enabled. Spoke virtual networks are connected to each hub.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un Azure Virtual WAN qui contient deux hubs virtuels sécurisés nommés **hub-weu** et **hub-neu**. Chaque hub possède un Pare-feu Azure et une intention de routage avec une stratégie de trafic Internet et une stratégie de trafic privé. Inter-hub est activé. Des réseaux virtuels spokes sont connectés à chaque hub.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The spoke subnets connected to hub-weu need no user-defined routes to send their traffic to the hub firewall.", fr: "Les sous-réseaux des spokes connectés à hub-weu n'ont besoin d'aucun itinéraire défini par l'utilisateur pour envoyer leur trafic au pare-feu du hub." } }
    - { id: b, text: { en: "You can associate a NAT gateway with the firewall in hub-weu to add SNAT ports.", fr: "Vous pouvez associer une passerelle NAT au pare-feu de hub-weu pour ajouter des ports SNAT." } }
    - { id: c, text: { en: "The internet-bound traffic of the spokes connected to hub-neu leaves through the firewall in hub-neu.", fr: "Le trafic à destination d'Internet des spokes connectés à hub-neu sort par le pare-feu de hub-neu." } }
    - { id: d, text: { en: "The firewall in hub-weu supports up to 250 auto-generated public IP addresses.", fr: "Le pare-feu de hub-weu prend en charge jusqu'à 250 adresses IP publiques générées automatiquement." } }
    - { id: e, text: { en: "Traffic between a spoke of hub-weu and a spoke of hub-neu bypasses both firewalls.", fr: "Le trafic entre un spoke de hub-weu et un spoke de hub-neu contourne les deux pare-feu." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A secured virtual hub programs the routes to its firewall, so the spokes don't need user-defined routes. The 0.0.0.0/0 route of an Internet traffic policy isn't advertised across hubs, so each hub's spokes reach the internet through their local hub firewall.
    fr: |
      Un hub virtuel sécurisé programme les routes vers son pare-feu : les spokes n'ont pas besoin d'itinéraires définis par l'utilisateur. La route 0.0.0.0/0 d'une stratégie de trafic Internet n'est pas annoncée d'un hub à l'autre : les spokes de chaque hub joignent Internet par le pare-feu de leur hub local.
  options:
    b: { en: "A NAT gateway isn't supported in a secured virtual hub; it can be configured on the spoke virtual networks instead.", fr: "Une passerelle NAT n'est pas prise en charge dans un hub virtuel sécurisé ; elle peut être configurée sur les réseaux virtuels spokes." }
    d: { en: "A firewall in a secured virtual hub supports up to 80 public IP addresses in a standard deployment; 250 applies to customer-provided addresses (preview).", fr: "Un pare-feu dans un hub virtuel sécurisé prend en charge jusqu'à 80 adresses IP publiques dans un déploiement standard ; 250 s'applique aux adresses fournies par le client (préversion)." }
    e: { en: "With Private traffic policies on both hubs, inter-hub traffic is sent through the hub firewalls.", fr: "Avec des stratégies de trafic privé sur les deux hubs, le trafic inter-hub est envoyé par les pare-feu des hubs." }
references:
  - title: What is a secured virtual hub?
    url: https://learn.microsoft.com/en-us/azure/firewall-manager/secured-virtual-hub
  - title: How to configure Virtual WAN Hub routing policies
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies
