id: az700-5a-fw-inbound-waf
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso publishes a public web application that runs on virtual machines in a spoke virtual network. Today, inbound HTTPS traffic reaches the web servers through a DNAT rule of an Azure Firewall Standard instance in the hub.

    A new security requirement states that inbound HTTPS requests must be decrypted and inspected against OWASP-based rules to block attacks such as SQL injection and cross-site scripting before they reach the web servers.

    What should you add to the solution?
  fr: |
    Contoso publie une application web publique qui s'exécute sur des machines virtuelles d'un réseau virtuel spoke. Aujourd'hui, le trafic HTTPS entrant atteint les serveurs web par une règle DNAT d'une instance du Pare-feu Azure Standard située dans le hub.

    Une nouvelle exigence de sécurité impose que les requêtes HTTPS entrantes soient déchiffrées et inspectées selon des règles fondées sur l'OWASP, afin de bloquer des attaques comme l'injection SQL et le cross-site scripting avant qu'elles atteignent les serveurs web.

    Que devez-vous ajouter à la solution ?
body:
  options:
    - { id: a, text: { en: "Azure Firewall Premium with TLS inspection enabled for the inbound DNAT traffic", fr: "Le Pare-feu Azure Premium avec l'inspection TLS activée pour le trafic DNAT entrant" } }
    - { id: b, text: { en: "Application rules in the firewall policy that target the FQDN of the web application", fr: "Des règles d'application dans la stratégie de pare-feu qui ciblent le FQDN de l'application web" } }
    - { id: c, text: { en: "An Application Gateway with the WAF v2 SKU in front of the web servers", fr: "Une passerelle Application Gateway de référence SKU WAF v2 devant les serveurs web" } }
    - { id: d, text: { en: "A network security group on the web subnet that allows only TCP 443 from the Internet tag", fr: "Un groupe de sécurité réseau sur le sous-réseau web qui n'autorise que TCP 443 depuis l'étiquette Internet" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure Firewall doesn't support inbound TLS inspection; Microsoft directs inbound HTTPS inspection to Web Application Firewall on Application Gateway, which terminates TLS and applies managed rule sets against SQL injection and cross-site scripting.
    fr: |
      Le Pare-feu Azure ne prend pas en charge l'inspection TLS entrante ; Microsoft oriente l'inspection HTTPS entrante vers le pare-feu d'applications web (WAF) d'Application Gateway, qui termine TLS et applique des ensembles de règles managés contre l'injection SQL et le cross-site scripting.
  options:
    a: { en: "TLS inspection in Azure Firewall Premium covers outbound and east-west traffic, not inbound traffic.", fr: "L'inspection TLS du Pare-feu Azure Premium couvre le trafic sortant et est-ouest, pas le trafic entrant." }
    b: { en: "Application rules filter outbound and east-west traffic by FQDN; they don't inspect inbound requests.", fr: "Les règles d'application filtrent le trafic sortant et est-ouest par FQDN ; elles n'inspectent pas les requêtes entrantes." }
    d: { en: "An NSG filters on layers 3 and 4; it can't detect SQL injection in HTTP requests.", fr: "Un NSG filtre aux couches 3 et 4 ; il ne peut pas détecter une injection SQL dans des requêtes HTTP." }
references:
  - title: Azure Firewall Premium features implementation guide
    url: https://learn.microsoft.com/en-us/azure/firewall/premium-features
