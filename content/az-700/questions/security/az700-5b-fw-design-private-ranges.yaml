id: az700-5b-fw-design-private-ranges
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware has an on-premises datacenter that uses the publicly registered range 131.107.0.0/16 for its internal servers. The datacenter is connected to a hub virtual network by ExpressRoute.

    An Azure Firewall named **FW1** in the hub is associated with a firewall policy named **FWP-Hub**. The spoke subnets route all their traffic to FW1. Network rules in FWP-Hub allow the spokes to reach 131.107.0.0/16 on TCP port 1433. The SNAT settings are the defaults.

    You need to ensure that:

    - the on-premises firewall sees the original private IP addresses of the spoke virtual machines for the traffic to 131.107.0.0/16;
    - the spoke traffic to the internet is still translated to the public IP address of FW1.

    What should you do?
  fr: |
    Litware dispose d'un centre de données local qui utilise la plage enregistrée publiquement 131.107.0.0/16 pour ses serveurs internes. Le centre de données est connecté à un réseau virtuel hub par ExpressRoute.

    Un Pare-feu Azure nommé **FW1** dans le hub est associé à une stratégie de pare-feu nommée **FWP-Hub**. Les sous-réseaux spokes routent tout leur trafic vers FW1. Des règles de réseau de FWP-Hub autorisent les spokes à joindre 131.107.0.0/16 sur le port TCP 1433. Les paramètres SNAT sont ceux par défaut.

    Vous devez vous assurer que :

    - le pare-feu local voit les adresses IP privées d'origine des machines virtuelles spokes pour le trafic vers 131.107.0.0/16 ;
    - le trafic des spokes vers Internet est toujours traduit vers l'adresse IP publique de FW1.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "In FWP-Hub, set the SNAT private IP ranges to 0.0.0.0/0.", fr: "Dans FWP-Hub, définir les plages d'adresses IP privées SNAT sur 0.0.0.0/0." }
    - id: b
      text: { en: "On FW1, set the PrivateRange property to IANAPrivateRanges and 131.107.0.0/16 by using Set-AzFirewall.", fr: "Sur FW1, définir la propriété PrivateRange sur IANAPrivateRanges et 131.107.0.0/16 avec Set-AzFirewall." }
    - id: c
      text: { en: "In FWP-Hub, set the SNAT private IP ranges to IANAPrivateRanges and 131.107.0.0/16.", fr: "Dans FWP-Hub, définir les plages d'adresses IP privées SNAT sur IANAPrivateRanges et 131.107.0.0/16." }
    - id: d
      text: { en: "Replace the network rules with application rules that use the MSSQL protocol.", fr: "Remplacer les règles de réseau par des règles d'application qui utilisent le protocole MSSQL." }
answer: { optionId: c }
explanation:
  correct:
    en: By default, network rule traffic is SNATed unless the destination is in IANA RFC 1918 or RFC 6598, so traffic to 131.107.0.0/16 is translated. Adding that range to the private ranges, together with IANAPrivateRanges to keep the defaults, stops the translation for it while internet traffic is still SNATed. For a firewall associated with a policy, the range is set in the policy's SNAT settings.
    fr: Par défaut, le trafic des règles de réseau est traduit (SNAT) sauf si la destination appartient à IANA RFC 1918 ou RFC 6598 ; le trafic vers 131.107.0.0/16 est donc traduit. Ajouter cette plage aux plages privées, avec IANAPrivateRanges pour conserver les valeurs par défaut, supprime la traduction pour elle, tandis que le trafic Internet reste traduit. Pour un pare-feu associé à une stratégie, la plage se définit dans les paramètres SNAT de la stratégie.
  options:
    a: { en: "0.0.0.0/0 disables SNAT for every destination, so FW1 could no longer send traffic directly to the internet.", fr: "0.0.0.0/0 désactive la SNAT pour toutes les destinations : FW1 ne pourrait plus envoyer de trafic directement vers Internet." }
    b: { en: "When a firewall is associated with a firewall policy, its own PrivateRange property is ignored; the setting must be made in the policy.", fr: "Quand un pare-feu est associé à une stratégie de pare-feu, sa propre propriété PrivateRange est ignorée ; le paramètre doit être défini dans la stratégie." }
    d: { en: "Application rules always SNAT the traffic, whatever the destination, so the original source would be hidden.", fr: "Les règles d'application traduisent toujours le trafic (SNAT), quelle que soit la destination : la source d'origine serait masquée." }
references:
  - title: Azure Firewall SNAT private IP address ranges
    url: https://learn.microsoft.com/en-us/azure/firewall/snat-private-range
