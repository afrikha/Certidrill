id: az700-5b-waf-afd-bots
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware publishes an online store through an Azure Front Door Premium profile. Its WAF policy is in Prevention mode and uses the Bot Manager 1.1 rule set with the default actions.

    The WAF logs show a large number of requests from unknown bots on the product search pages. You need to make these clients complete a JavaScript challenge. Verified search engine crawlers must still be allowed, and bad bots must still be blocked.

    What should you do?
  fr: |
    Proseware publie une boutique en ligne par un profil Azure Front Door Premium. Sa stratégie WAF est en mode de prévention et utilise l'ensemble de règles Bot Manager 1.1 avec les actions par défaut.

    Les journaux WAF montrent un grand nombre de requêtes de bots inconnus sur les pages de recherche de produits. Vous devez faire passer à ces clients une question JavaScript (JavaScript challenge). Les robots des moteurs de recherche vérifiés doivent rester autorisés, et les bots malveillants doivent rester bloqués.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set the action of the GoodBots rule group to JS challenge.", fr: "Définir l'action du groupe de règles GoodBots sur JS challenge." }
    - id: b
      text: { en: "Add a rate limit custom rule grouped by socket address with the action Block.", fr: "Ajouter une règle personnalisée de limitation de débit regroupée par adresse de socket avec l'action Block." }
    - id: c
      text: { en: "Change the anomaly score action of the Default Rule Set to Redirect.", fr: "Changer l'action du score d'anomalie du Default Rule Set en Redirect." }
    - id: d
      text: { en: "Set the action of the UnknownBots rule group to JS challenge.", fr: "Définir l'action du groupe de règles UnknownBots sur JS challenge." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Bot Manager classifies requests into bad, good and unknown bots; by default bad bots are blocked, good bots are allowed and unknown bots are logged. You can set a custom action for each category, so changing the UnknownBots action to JS challenge challenges those clients without changing the other categories.
    fr: |
      Bot Manager classe les requêtes en bots malveillants, bons et inconnus ; par défaut, les bots malveillants sont bloqués, les bons bots autorisés et les bots inconnus journalisés. Vous pouvez définir une action personnalisée par catégorie : passer l'action d'UnknownBots à JS challenge met ces clients à l'épreuve sans modifier les autres catégories.
  options:
    a: { en: "GoodBots contains the verified crawlers, which must stay allowed.", fr: "GoodBots contient les robots vérifiés, qui doivent rester autorisés." }
    b: { en: "A rate limit rule blocks clients above a threshold; it doesn't challenge unknown bots.", fr: "Une règle de limitation de débit bloque les clients au-delà d'un seuil ; elle ne met pas les bots inconnus à l'épreuve." }
    c: { en: "The anomaly score action applies to the Default Rule Set, not to Bot Manager.", fr: "L'action du score d'anomalie s'applique au Default Rule Set, pas à Bot Manager." }
references:
  - title: Azure Web Application Firewall on Azure Front Door
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/afds-overview
  - title: Azure Front Door WAF DRS rule groups and rules
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-drs
