id: az700-5a-bastion-vm-rule
objective: "5.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A virtual network named **VNet-Hub** contains an Azure Bastion host deployed to **AzureBastionSubnet** (10.0.254.0/26). A spoke virtual network named **VNet-App** is peered with VNet-Hub. The virtual machines of VNet-App have no public IP addresses and are in a subnet associated with a network security group named **NSG-App**.

    Administrators connect from their office (198.51.100.0/24) to the Azure portal and open RDP sessions to the VNet-App virtual machines through Bastion.

    You need to add an inbound rule to NSG-App that allows these sessions. The solution must grant the least access.

    Which rule should you add?
  fr: |
    Un réseau virtuel nommé **VNet-Hub** contient un hôte Azure Bastion déployé dans **AzureBastionSubnet** (10.0.254.0/26). Un réseau virtuel spoke nommé **VNet-App** est relié à VNet-Hub par peering. Les machines virtuelles de VNet-App n'ont pas d'adresse IP publique et se trouvent dans un sous-réseau associé à un groupe de sécurité réseau nommé **NSG-App**.

    Les administrateurs se connectent depuis leurs bureaux (198.51.100.0/24) au portail Azure et ouvrent des sessions RDP vers les machines virtuelles de VNet-App via Bastion.

    Vous devez ajouter à NSG-App une règle entrante qui autorise ces sessions. La solution doit accorder le moins d'accès possible.

    Quelle règle devez-vous ajouter ?
body:
  options:
    - { id: a, text: { en: "Allow TCP 3389 from 198.51.100.0/24", fr: "Autoriser TCP 3389 depuis 198.51.100.0/24" } }
    - { id: b, text: { en: "Allow TCP 443 from 10.0.254.0/26", fr: "Autoriser TCP 443 depuis 10.0.254.0/26" } }
    - { id: c, text: { en: "Allow TCP 3389 from 10.0.254.0/26", fr: "Autoriser TCP 3389 depuis 10.0.254.0/26" } }
    - { id: d, text: { en: "Allow TCP 3389 from GatewayManager", fr: "Autoriser TCP 3389 depuis GatewayManager" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The RDP session reaches the target virtual machine from the private IP addresses of Bastion, so the target subnet must allow TCP 3389 from the AzureBastionSubnet range. Scoping the source to that range rather than to a broad tag grants the least access.
    fr: |
      La session RDP arrive sur la machine virtuelle cible depuis les adresses IP privées de Bastion : le sous-réseau cible doit donc autoriser TCP 3389 depuis la plage d'AzureBastionSubnet. Limiter la source à cette plage plutôt qu'à une étiquette large accorde le moins d'accès possible.
  options:
    a: { en: "The users' public addresses reach Bastion on 443; they never connect directly to the virtual machines.", fr: "Les adresses publiques des utilisateurs atteignent Bastion sur le port 443 ; elles ne se connectent jamais directement aux machines virtuelles." }
    b: { en: "Bastion connects to the virtual machines on 3389 (or 22), not on 443.", fr: "Bastion se connecte aux machines virtuelles sur le port 3389 (ou 22), pas sur le port 443." }
    d: { en: "GatewayManager is the control plane source used on AzureBastionSubnet, not the source of RDP sessions.", fr: "GatewayManager est la source du plan de contrôle utilisée sur AzureBastionSubnet, pas la source des sessions RDP." }
references:
  - title: Configure NSG rules for Azure Bastion
    url: https://learn.microsoft.com/en-us/azure/bastion/bastion-nsg
