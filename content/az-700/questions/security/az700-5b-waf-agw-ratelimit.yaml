id: az700-5b-waf-agw-ratelimit
objective: "5.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Azure Application Gateway WAF_v2 named **AGW-API** uses a WAF policy named **WAFP-API**. WAFP-API uses the OWASP CRS 3.1 managed rule set in Prevention mode.

    You need to limit each client IP address to 300 requests per minute on the /api/login path. When you try to add a custom rule of type **Rate limit** to WAFP-API, the option isn't available.

    What should you do first?
  fr: |
    Une passerelle Azure Application Gateway WAF_v2 nommée **AGW-API** utilise une stratégie WAF nommée **WAFP-API**. WAFP-API utilise l'ensemble de règles managé OWASP CRS 3.1 en mode de prévention.

    Vous devez limiter chaque adresse IP cliente à 300 requêtes par minute sur le chemin /api/login. Quand vous essayez d'ajouter à WAFP-API une règle personnalisée de type **Rate limit**, l'option n'est pas disponible.

    Que devez-vous faire en premier ?
body:
  options:
    - id: c
      text: { en: "Associate WAFP-API with the listener of the API instead of the gateway.", fr: "Associer WAFP-API à l'écouteur de l'API plutôt qu'à la passerelle." }
    - id: b
      text: { en: "Add the Bot Manager rule set to WAFP-API.", fr: "Ajouter l'ensemble de règles Bot Manager à WAFP-API." }
    - id: a
      text: { en: "Upgrade the managed rule set of WAFP-API to CRS 3.2 or a later version.", fr: "Mettre à niveau l'ensemble de règles managé de WAFP-API vers CRS 3.2 ou une version ultérieure." }
    - id: d
      text: { en: "Switch WAFP-API to Detection mode while you create the rule.", fr: "Passer WAFP-API en mode de détection pendant la création de la règle." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Rate limit rules are supported only on the latest WAF engine, which you get by selecting CRS 3.2 or a later rule set (DRS 2.2 is the recommended version for new policies). The rule then counts the matching requests per client address (ClientAddr, the default grouping) against the threshold.
    fr: |
      Les règles de limitation de débit ne sont prises en charge que sur le dernier moteur WAF, que vous obtenez en sélectionnant CRS 3.2 ou un ensemble de règles ultérieur (DRS 2.2 est la version recommandée pour les nouvelles stratégies). La règle compte ensuite les requêtes correspondantes par adresse cliente (ClientAddr, le regroupement par défaut) par rapport au seuil.
  options:
    c: { en: "The association scope doesn't enable rate limiting; the rule set version does.", fr: "L'étendue d'association n'active pas la limitation de débit ; c'est la version de l'ensemble de règles qui le fait." }
    b: { en: "Bot Manager classifies bots; it doesn't enable rate limit custom rules.", fr: "Bot Manager classe les bots ; il n'active pas les règles personnalisées de limitation de débit." }
    d: { en: "The mode has no effect on which rule types are available.", fr: "Le mode n'a aucun effet sur les types de règles disponibles." }
references:
  - title: Rate limiting for Azure Web Application Firewall on Azure Application Gateway
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/rate-limiting-overview
