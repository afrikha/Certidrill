id: az700-5b-fw-design-facts-yn
objective: "5.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You plan to deploy an Azure Firewall Standard named **FW1** in a hub virtual network named **VNet-Hub**. The spoke virtual machines use addresses in 10.20.0.0/16, and the on-premises network uses 172.16.0.0/16. The firewall policy of FW1 will use network rules only, with the default SNAT settings.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de déployer un Pare-feu Azure Standard nommé **FW1** dans un réseau virtuel hub nommé **VNet-Hub**. Les machines virtuelles des spokes utilisent des adresses de 10.20.0.0/16, et le réseau local utilise 172.16.0.0/16. La stratégie de pare-feu de FW1 n'utilisera que des règles de réseau, avec les paramètres SNAT par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can associate a public IP prefix directly with FW1 to provide its outbound public addresses.
        fr: Vous pouvez associer directement un préfixe d'adresses IP publiques à FW1 pour fournir ses adresses publiques sortantes.
    - id: s2
      text:
        en: When a network rule allows traffic from a spoke virtual machine to 172.16.10.5, the on-premises server sees the private IP address of the virtual machine as the source.
        fr: Quand une règle de réseau autorise le trafic d'une machine virtuelle spoke vers 172.16.10.5, le serveur local voit l'adresse IP privée de la machine virtuelle comme source.
    - id: s3
      text:
        en: You can associate a network security group with AzureFirewallSubnet to restrict which sources can reach FW1.
        fr: Vous pouvez associer un groupe de sécurité réseau à AzureFirewallSubnet pour restreindre les sources qui peuvent joindre FW1.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Azure Firewall can't use a public IP prefix directly, but it can use Standard SKU public IP addresses created from a prefix. With network rules, the firewall doesn't SNAT traffic to IANA RFC 1918 or RFC 6598 destinations, and 172.16.0.0/16 is in RFC 1918, so the original source is kept. Network security groups aren't supported on AzureFirewallSubnet; the firewall uses platform-level NSGs that you can't see.
    fr: |
      Le Pare-feu Azure ne peut pas utiliser directement un préfixe d'adresses IP publiques, mais il peut utiliser des adresses IP publiques de référence SKU Standard créées à partir d'un préfixe. Avec les règles de réseau, le pare-feu ne traduit pas (SNAT) le trafic vers les destinations IANA RFC 1918 ou RFC 6598, et 172.16.0.0/16 appartient à RFC 1918 : la source d'origine est conservée. Les groupes de sécurité réseau ne sont pas pris en charge sur AzureFirewallSubnet ; le pare-feu utilise des NSG au niveau de la plateforme, que vous ne voyez pas.
references:
  - title: Azure Firewall SNAT private IP address ranges
    url: https://learn.microsoft.com/en-us/azure/firewall/snat-private-range
  - title: Azure Firewall FAQ
    url: https://learn.microsoft.com/en-us/azure/firewall/firewall-faq
