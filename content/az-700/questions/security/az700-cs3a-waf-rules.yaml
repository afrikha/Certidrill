id: az700-cs3a-waf-rules
objective: "5.3.4"
type: yesno_statements
caseStudy: az700-cs3a-southridge
difficulty: 3
status: draft
stem:
  en: |
    You associate a WAF policy in Prevention mode with the domains of fd-southridge. The policy uses the Default Rule Set (DRS) 2.1 managed rule set with its default anomaly scoring settings, and a rate limit custom rule that matches the /login path.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous associez une stratégie WAF en mode Prévention aux domaines de fd-southridge. La stratégie utilise l'ensemble de règles managé Default Rule Set (DRS) 2.1 avec ses paramètres de notation d'anomalies par défaut, ainsi qu'une règle personnalisée de limitation de débit qui correspond au chemin /login.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A request whose only match is one DRS rule of Critical severity is blocked.
        fr: Une requête dont la seule correspondance est une règle DRS de gravité Critical est bloquée.
    - id: s2
      text:
        en: A request whose only match is one DRS rule of Warning severity is blocked.
        fr: Une requête dont la seule correspondance est une règle DRS de gravité Warning est bloquée.
    - id: s3
      text:
        en: A request to /login that exceeds the rate limit threshold is handled by the rate limit rule before the DRS rules evaluate it.
        fr: Une requête vers /login qui dépasse le seuil de limitation de débit est traitée par la règle de limitation de débit avant que les règles DRS ne l'évaluent.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      With anomaly scoring, the WAF acts on a request only when its anomaly score reaches 5. A Critical match adds 5, so one Critical match is enough to block the request, whereas a Warning match adds only 3. Custom rules, including rate limit rules, are evaluated before the managed rules, and a match stops further processing.
    fr: |
      Avec la notation d'anomalies, le WAF n'agit sur une requête que lorsque son score d'anomalie atteint 5. Une correspondance Critical ajoute 5 : une seule suffit à bloquer la requête, alors qu'une correspondance Warning n'ajoute que 3. Les règles personnalisées, y compris les règles de limitation de débit, sont évaluées avant les règles managées, et une correspondance arrête le traitement.
  options:
    s2: { en: "A Warning match contributes 3 to the anomaly score, below the threshold of 5.", fr: "Une correspondance Warning ajoute 3 au score d'anomalie, sous le seuil de 5." }
references:
  - title: Azure Front Door WAF DRS rule groups and rules
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-drs
  - title: What is rate limiting for Azure Front Door?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-rate-limit
