id: az700-5b-waf-feat-scope-multi
objective: "5.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware hosts a web application on virtual machines in a virtual network. The application is published to the internet through an Azure Application Gateway WAF_v2 named **AGW-Web**. Administrators also connect to the virtual machines by using SSH.

    The security team lists several requirements.

    Which two requirements can you meet by configuring the WAF policy of AGW-Web?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware héberge une application web sur des machines virtuelles d'un réseau virtuel. L'application est publiée sur Internet par une passerelle Azure Application Gateway WAF_v2 nommée **AGW-Web**. Les administrateurs se connectent aussi aux machines virtuelles en SSH.

    L'équipe de sécurité énumère plusieurs exigences.

    À quelles deux exigences pouvez-vous répondre en configurant la stratégie WAF d'AGW-Web ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: b, text: { en: "Restrict SSH connections to the virtual machines to the administrators' IP addresses.", fr: "Restreindre les connexions SSH aux machines virtuelles aux adresses IP des administrateurs." } }
    - { id: a, text: { en: "Block HTTP requests that contain SQL injection attempts in the query string.", fr: "Bloquer les requêtes HTTP qui contiennent des tentatives d'injection SQL dans la chaîne de requête." } }
    - { id: c, text: { en: "Inspect the HTTPS connections that the virtual machines open to internet sites.", fr: "Inspecter les connexions HTTPS que les machines virtuelles ouvrent vers des sites Internet." } }
    - { id: d, text: { en: "Limit the number of HTTP requests that each client IP address sends per minute.", fr: "Limiter le nombre de requêtes HTTP que chaque adresse IP cliente envoie par minute." } }
    - { id: e, text: { en: "Absorb volumetric UDP flood attacks against the public IP address of AGW-Web.", fr: "Absorber les attaques volumétriques par inondation UDP contre l'adresse IP publique d'AGW-Web." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A WAF policy inspects the HTTP and HTTPS requests that reach the gateway: managed rule sets detect SQL injection, and rate limit custom rules throttle each client address. It doesn't filter other protocols or the outbound traffic of the backends.
    fr: |
      Une stratégie WAF inspecte les requêtes HTTP et HTTPS qui atteignent la passerelle : les ensembles de règles managés détectent l'injection SQL, et les règles personnalisées de limitation de débit limitent chaque adresse cliente. Elle ne filtre ni les autres protocoles ni le trafic sortant des serveurs principaux.
  options:
    b: { en: "SSH isn't HTTP traffic and doesn't go through the gateway; use an NSG or Azure Firewall.", fr: "SSH n'est pas du trafic HTTP et ne passe pas par la passerelle ; utilisez un NSG ou le Pare-feu Azure." }
    c: { en: "Outbound HTTPS inspection from the virtual machines is a job for Azure Firewall Premium with TLS inspection.", fr: "L'inspection du HTTPS sortant des machines virtuelles relève du Pare-feu Azure Premium avec inspection TLS." }
    e: { en: "Volumetric network-layer floods are mitigated by Azure DDoS Protection, not by a WAF.", fr: "Les inondations volumétriques de couche réseau sont atténuées par Azure DDoS Protection, pas par un WAF." }
references:
  - title: What is Azure Web Application Firewall on Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
