id: az700-sr2-fw-fqdn-1
objective: "5.2.5"
type: series_yesno
series: az700-sr2-fw-fqdn
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: You add an application rule in a rule collection group that has a higher priority.
  fr: Vous ajoutez une règle d'application dans un groupe de collections de règles de priorité plus élevée.
body:
  solution:
    en: |
      In FWPolicy1, you create a rule collection group named RCG-Updates with priority 100. In RCG-Updates, you create an application rule collection with priority 100 and action Allow that contains a rule with source 10.20.1.0/24, protocol `Https:443`, and target FQDN `updates.fabrikam.com`.
    fr: |
      Dans FWPolicy1, vous créez un groupe de collections de règles nommé RCG-Updates de priorité 100. Dans RCG-Updates, vous créez une collection de règles d'application de priorité 100 et d'action Allow qui contient une règle avec la source 10.20.1.0/24, le protocole `Https:443` et le nom de domaine complet (FQDN) cible `updates.fabrikam.com`.
answer: { value: false }
explanation:
  correct:
    en: |
      Azure Firewall always processes network rules before application rules, whatever the priority of the rule collection groups. The HTTPS connection matches the NRC-DenyWeb network rule first, and rules are terminating, so the application rule is never evaluated.
    fr: |
      Le Pare-feu Azure traite toujours les règles réseau avant les règles d'application, quelle que soit la priorité des groupes de collections de règles. La connexion HTTPS correspond d'abord à la règle réseau de NRC-DenyWeb et le traitement s'arrête à la première correspondance : la règle d'application n'est jamais évaluée.
references:
  - title: Azure Firewall rule processing logic
    url: https://learn.microsoft.com/en-us/azure/firewall/rule-processing
