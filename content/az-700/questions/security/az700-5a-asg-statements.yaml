id: az700-5a-asg-statements
objective: "5.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You create an application security group named **asg-web** in the West Europe region. The first network interface that you add to asg-web belongs to a virtual machine named **VM1** in a virtual network named **VNet1** (West Europe). A network security group named **NSG1** is associated with the subnet of VM1, and one of its rules uses asg-web as the destination.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un groupe de sécurité d'application nommé **asg-web** dans la région West Europe. La première interface réseau que vous ajoutez à asg-web appartient à une machine virtuelle nommée **VM1** d'un réseau virtuel nommé **VNet1** (West Europe). Un groupe de sécurité réseau nommé **NSG1** est associé au sous-réseau de VM1, et l'une de ses règles utilise asg-web comme destination.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "You can add to asg-web the network interface of a virtual machine in VNet3, which is peered with VNet1.", fr: "Vous pouvez ajouter à asg-web l'interface réseau d'une machine virtuelle de VNet3, relié à VNet1 par peering." } }
    - { id: b, text: { en: "The rule of NSG1 that targets asg-web applies only to the network interfaces that are members of asg-web.", fr: "La règle de NSG1 qui cible asg-web ne s'applique qu'aux interfaces réseau membres d'asg-web." } }
    - { id: c, text: { en: "You can delete asg-web while it contains network interfaces; Azure removes the members automatically.", fr: "Vous pouvez supprimer asg-web alors qu'il contient des interfaces réseau ; Azure retire automatiquement les membres." } }
    - { id: d, text: { en: "The network interface of VM1 can be a member of asg-web and of another application security group.", fr: "L'interface réseau de VM1 peut être membre d'asg-web et d'un autre groupe de sécurité d'application." } }
    - { id: e, text: { en: "asg-web can contain network interfaces located in West Europe and in North Europe.", fr: "asg-web peut contenir des interfaces réseau situées dans West Europe et dans North Europe." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A rule that references an ASG applies only to the interfaces that are members of that ASG, even though the NSG is associated with the whole subnet. A network interface can be a member of several ASGs, up to the Azure limits.
    fr: |
      Une règle qui référence un ASG ne s'applique qu'aux interfaces membres de cet ASG, même si le NSG est associé à tout le sous-réseau. Une interface réseau peut être membre de plusieurs ASG, dans la limite des quotas Azure.
  options:
    a: { en: "All members of an ASG must be in the virtual network of its first member; peering doesn't change this.", fr: "Tous les membres d'un ASG doivent se trouver dans le réseau virtuel de son premier membre ; le peering n'y change rien." }
    c: { en: "An ASG that still contains network interfaces can't be deleted: remove or delete the interfaces first.", fr: "Un ASG qui contient encore des interfaces réseau ne peut pas être supprimé : retirez ou supprimez d'abord les interfaces." }
    e: { en: "Members must be in the same virtual network and location as the ASG.", fr: "Les membres doivent se trouver dans le même réseau virtuel et le même emplacement que l'ASG." }
references:
  - title: Application security groups
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
  - title: Create, Change, or Delete Azure Network Security Groups
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-network-security-group
