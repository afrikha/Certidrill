id: az700-5b-waf-policy-create-afd
objective: "5.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware publishes its website through an Azure Front Door Premium profile named **afd-litware**. You create a WAF policy for afd-litware in the Azure portal by selecting **Create a resource** > **Web Application Firewall (WAF)**.

    Which values should you select on the **Basics** tab?
  fr: |
    Litware publie son site web par un profil Azure Front Door Premium nommé **afd-litware**. Vous créez une stratégie WAF pour afd-litware dans le portail Azure en sélectionnant **Create a resource** > **Web Application Firewall (WAF)**.

    Quelles valeurs devez-vous sélectionner sous l'onglet **Basics** ?
body:
  options:
    - id: a
      text: { en: "Policy for: Regional WAF (Application Gateway); Front door tier: Premium", fr: "Policy for : Regional WAF (Application Gateway) ; Front door tier : Premium" }
    - id: b
      text: { en: "Policy for: Global WAF (Front Door); Front door tier: Standard", fr: "Policy for : Global WAF (Front Door) ; Front door tier : Standard" }
    - id: c
      text: { en: "Policy for: Global WAF (Front Door); Front door tier: Classic", fr: "Policy for : Global WAF (Front Door) ; Front door tier : Classic" }
    - id: d
      text: { en: "Policy for: Global WAF (Front Door); Front door tier: Premium", fr: "Policy for : Global WAF (Front Door) ; Front door tier : Premium" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A WAF policy for Front Door is a Global WAF (Front Door) policy, and you choose the Front Door tier of the profile it will protect: Classic, Standard or Premium. The Premium tier gives the policy access to the managed rule sets and bot protection of a Premium profile.
    fr: |
      Une stratégie WAF pour Front Door est une stratégie Global WAF (Front Door), et vous choisissez le niveau Front Door du profil qu'elle protégera : Classic, Standard ou Premium. Le niveau Premium donne à la stratégie l'accès aux ensembles de règles managés et à la protection contre les bots d'un profil Premium.
  options:
    a: { en: "Regional WAF policies are for Application Gateway and can't be associated with Front Door.", fr: "Les stratégies Regional WAF sont destinées à Application Gateway et ne peuvent pas être associées à Front Door." }
    b: { en: "The tier must match the Premium profile; a Standard policy supports custom rules only.", fr: "Le niveau doit correspondre au profil Premium ; une stratégie Standard ne prend en charge que les règles personnalisées." }
    c: { en: "Classic is for Front Door (classic) profiles.", fr: "Classic est destiné aux profils Front Door (classique)." }
references:
  - title: "Tutorial: Create a WAF policy on Azure Front Door by using the Azure portal"
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/afds/waf-front-door-create-portal
