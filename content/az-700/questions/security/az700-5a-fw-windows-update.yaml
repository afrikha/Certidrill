id: az700-5a-fw-windows-update
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The route tables of your spoke virtual networks send all internet-bound traffic to an Azure Firewall Standard instance. The firewall denies everything that isn't explicitly allowed.

    You need to allow the virtual machines to download updates from Windows Update. Microsoft changes the Windows Update endpoints over time. The solution must minimize administrative effort.

    What should you add to the firewall policy?
  fr: |
    Les tables de routage de vos réseaux virtuels spoke envoient tout le trafic à destination d'Internet vers une instance du Pare-feu Azure Standard. Le pare-feu refuse tout ce qui n'est pas explicitement autorisé.

    Vous devez permettre aux machines virtuelles de télécharger des mises à jour depuis Windows Update. Microsoft modifie les points de terminaison de Windows Update au fil du temps. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous ajouter à la stratégie de pare-feu ?
body:
  options:
    - { id: a, text: { en: "An application rule that uses the WindowsUpdate FQDN tag", fr: "Une règle d'application qui utilise la balise FQDN WindowsUpdate" } }
    - { id: b, text: { en: "A network rule that uses the AzureCloud service tag", fr: "Une règle de réseau qui utilise l'étiquette de service AzureCloud" } }
    - { id: c, text: { en: "An application rule that lists each Windows Update FQDN", fr: "Une règle d'application qui liste chaque FQDN de Windows Update" } }
    - { id: d, text: { en: "A DNAT rule that targets the Windows Update endpoints", fr: "Une règle DNAT qui cible les points de terminaison de Windows Update" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An FQDN tag represents the domain names of a well-known Microsoft service. Microsoft maintains the FQDNs of the WindowsUpdate tag, so one application rule allows the traffic and stays current without any change on your side.
    fr: |
      Une balise FQDN représente les noms de domaine d'un service Microsoft connu. Microsoft tient à jour les FQDN de la balise WindowsUpdate : une seule règle d'application autorise le trafic et reste à jour sans aucune modification de votre part.
  options:
    b: { en: "A rule on AzureCloud allows far more than Windows Update and doesn't track its domain names.", fr: "Une règle sur AzureCloud autorise bien plus que Windows Update et ne suit pas ses noms de domaine." }
    c: { en: "A manual FQDN list must be updated each time Microsoft changes the endpoints.", fr: "Une liste manuelle de FQDN doit être mise à jour chaque fois que Microsoft modifie les points de terminaison." }
    d: { en: "DNAT publishes internal services for inbound traffic; it doesn't allow outbound access.", fr: "Le DNAT publie des services internes pour le trafic entrant ; il n'autorise pas l'accès sortant." }
references:
  - title: FQDN tags overview
    url: https://learn.microsoft.com/en-us/azure/firewall/fqdn-tags
