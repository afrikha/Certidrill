id: az700-sr1-firewall-url-idps-3
objective: "5.2.2"
type: series_yesno
series: az700-sr1-firewall-url-idps
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You deploy Azure Firewall Premium with TLS inspection, a URL rule and IDPS.
  fr: |
    Vous déployez Pare-feu Azure Premium avec l'inspection TLS, une règle d'URL et l'IDPS.
body:
  solution:
    en: |
      You store an intermediate CA certificate issued by the enterprise CA in Azure Key Vault and grant a user-assigned managed identity access to it. You deploy **Azure Firewall Premium** with a Premium firewall policy that enables **TLS inspection** with this certificate and identity. In the policy, you create an application rule for HTTPS with TLS inspection enabled whose destination is the target URL **api.fabrikam.com/v2/orders**, and you set the IDPS mode to **Alert and deny**.
    fr: |
      Vous stockez dans Azure Key Vault un certificat d'autorité de certification intermédiaire émis par l'autorité de certification d'entreprise et accordez l'accès à ce certificat à une identité managée affectée à l'utilisateur. Vous déployez **Pare-feu Azure Premium** avec une stratégie de pare-feu Premium qui active l'**inspection TLS** avec ce certificat et cette identité. Dans la stratégie, vous créez une règle d'application pour HTTPS, avec l'inspection TLS activée, dont la destination est l'URL cible **api.fabrikam.com/v2/orders**, et vous définissez le mode IDPS sur **Alert and deny**.
answer: { value: true }
explanation:
  correct:
    en: |
      TLS inspection lets the firewall decrypt outbound HTTPS by issuing certificates signed by the intermediate CA, which the virtual machines accept because they trust the root CA. The firewall can then match the full URL, so only /v2/orders is allowed on api.fabrikam.com, and IDPS in Alert and deny mode can detect and block attack signatures inside the decrypted traffic. Azure Firewall retrieves the certificate from Key Vault through the user-assigned managed identity.
    fr: |
      L'inspection TLS permet au pare-feu de déchiffrer le trafic HTTPS sortant en émettant des certificats signés par l'autorité de certification intermédiaire, que les machines virtuelles acceptent puisqu'elles approuvent le certificat racine. Le pare-feu peut alors comparer l'URL complète : seul /v2/orders est autorisé sur api.fabrikam.com, et l'IDPS en mode Alert and deny peut détecter et bloquer les signatures d'attaques dans le trafic déchiffré. Pare-feu Azure récupère le certificat dans Key Vault par l'identité managée affectée à l'utilisateur.
