id: az700-5b-waf-agw-exclusion
objective: "5.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Azure Application Gateway WAF_v2 uses a WAF policy named **WAFP-CRM** in Prevention mode with the Default Rule Set (DRS) 2.1.

    Legitimate requests are blocked. The WAF logs show that rule 942430 of the SQLI rule group matches the value of the request header `X-Crm-Context`, which legitimately contains many special characters.

    You need to stop this false positive. The header value must still be evaluated by every other managed rule, and the solution must keep the exclusion as narrow as possible.

    Which exclusion should you configure?
  fr: |
    Une passerelle Azure Application Gateway WAF_v2 utilise une stratégie WAF nommée **WAFP-CRM** en mode de prévention avec le Default Rule Set (DRS) 2.1.

    Des requêtes légitimes sont bloquées. Les journaux WAF montrent que la règle 942430 du groupe de règles SQLI correspond à la valeur de l'en-tête de requête `X-Crm-Context`, qui contient légitimement de nombreux caractères spéciaux.

    Vous devez supprimer ce faux positif. La valeur de l'en-tête doit rester évaluée par toutes les autres règles managées, et la solution doit limiter l'exclusion au strict nécessaire.

    Quelle exclusion devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "Match variable RequestHeaderKeys, operator Equals, selector X-Crm-Context, applied to rule 942430", fr: "Variable de correspondance RequestHeaderKeys, opérateur Equals, sélecteur X-Crm-Context, appliquée à la règle 942430" }
    - id: b
      text: { en: "Match variable RequestHeaderValues, operator Equals, selector X-Crm-Context, applied globally", fr: "Variable de correspondance RequestHeaderValues, opérateur Equals, sélecteur X-Crm-Context, appliquée globalement" }
    - id: c
      text: { en: "Match variable RequestHeaderValues, operator Equals, selector X-Crm-Context, applied to rule 942430", fr: "Variable de correspondance RequestHeaderValues, opérateur Equals, sélecteur X-Crm-Context, appliquée à la règle 942430" }
    - id: d
      text: { en: "Match variable RequestHeaderValues, operator Equals any, applied to the SQLI rule group", fr: "Variable de correspondance RequestHeaderValues, opérateur Equals any, appliquée au groupe de règles SQLI" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The false positive is on the header's value, so the match variable is RequestHeaderValues with the header name as the selector. A per-rule exclusion (available with CRS 3.2 or later and DRS) limits the exclusion to rule 942430, so all the other rules keep inspecting the header.
    fr: |
      Le faux positif porte sur la valeur de l'en-tête : la variable de correspondance est RequestHeaderValues avec le nom de l'en-tête comme sélecteur. Une exclusion par règle (disponible avec CRS 3.2 ou ultérieur et avec DRS) limite l'exclusion à la règle 942430 : toutes les autres règles continuent d'inspecter l'en-tête.
  options:
    a: { en: "RequestHeaderKeys excludes the header name from evaluation, not its value, which is what triggers the rule.", fr: "RequestHeaderKeys exclut le nom de l'en-tête de l'évaluation, pas sa valeur, qui est ce qui déclenche la règle." }
    b: { en: "A global exclusion removes the header value from every managed rule, which is broader than needed.", fr: "Une exclusion globale retire la valeur de l'en-tête de toutes les règles managées, ce qui est plus large que nécessaire." }
    d: { en: "Equals any excludes the values of all request headers from every rule of the group.", fr: "Equals any exclut les valeurs de tous les en-têtes de requête de toutes les règles du groupe." }
references:
  - title: Web Application Firewall exclusion lists
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/application-gateway-waf-configuration
