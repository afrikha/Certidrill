id: az700-5a-sku-migration
objective: "5.2.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    An Azure Firewall Standard instance named **FW1** is deployed in a hub virtual network. FW1 uses classic rules.

    You need to move FW1 to the Premium SKU so that you can enable IDPS and TLS inspection. You plan to use the manual (stop and start) migration during a maintenance window.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une instance du Pare-feu Azure Standard nommée **FW1** est déployée dans un réseau virtuel hub. FW1 utilise des règles classiques.

    Vous devez faire passer FW1 à la référence SKU Premium pour pouvoir activer l'IDPS et l'inspection TLS. Vous prévoyez d'utiliser la migration manuelle (arrêt et démarrage) pendant une fenêtre de maintenance.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: mig, text: { en: "Migrate the classic rules of FW1 to a Standard firewall policy.", fr: "Migrer les règles classiques de FW1 vers une stratégie de pare-feu Standard." } }
    - { id: prem, text: { en: "Create a Premium firewall policy from the Standard policy.", fr: "Créer une stratégie de pare-feu Premium à partir de la stratégie Standard." } }
    - { id: dealloc, text: { en: "Deallocate FW1.", fr: "Libérer FW1." } }
    - { id: alloc, text: { en: "Allocate FW1 with the Premium SKU tier.", fr: "Allouer FW1 avec le niveau de référence SKU Premium." } }
    - { id: attach, text: { en: "Attach the Premium firewall policy to FW1.", fr: "Attacher la stratégie de pare-feu Premium à FW1." } }
    - { id: easy, text: { en: "Select Change SKU on the Overview page of FW1.", fr: "Sélectionner Change SKU sur la page Vue d'ensemble de FW1." } }
    - { id: pip, text: { en: "Delete the public IP address of FW1.", fr: "Supprimer l'adresse IP publique de FW1." } }
answer:
  sequence: [ mig, prem, dealloc, alloc, attach ]
explanation:
  correct:
    en: |
      Premium features are configured only through a Premium firewall policy, so the classic rules are first migrated to a Standard policy, from which a Premium policy is created. The firewall is then deallocated and allocated again with the Premium tier (Az PowerShell), and finally the Premium policy is attached. The firewall is down between deallocation and allocation, about 20 to 30 minutes.
    fr: |
      Les fonctionnalités Premium ne se configurent que par une stratégie de pare-feu Premium : les règles classiques sont d'abord migrées vers une stratégie Standard, à partir de laquelle une stratégie Premium est créée. Le pare-feu est ensuite libéré puis alloué de nouveau avec le niveau Premium (Az PowerShell), et la stratégie Premium est enfin attachée. Le pare-feu est indisponible entre la libération et l'allocation, environ 20 à 30 minutes.
  options:
    easy: { en: "Change SKU is the easy method; it isn't available for firewalls that use classic rules, and it isn't the stop and start migration.", fr: "Change SKU est la méthode simplifiée ; elle n'est pas disponible pour les pare-feu à règles classiques, et ce n'est pas la migration par arrêt et démarrage." }
    pip: { en: "Deleting the public IP address isn't a step of the migration.", fr: "Supprimer l'adresse IP publique n'est pas une étape de la migration." }
references:
  - title: Change Azure Firewall SKU
    url: https://learn.microsoft.com/en-us/azure/firewall/change-sku
