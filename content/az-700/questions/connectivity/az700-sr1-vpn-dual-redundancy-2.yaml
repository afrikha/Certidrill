id: az700-sr1-vpn-dual-redundancy-2
objective: "2.1.1"
type: series_yesno
series: az700-sr1-vpn-dual-redundancy
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You deploy VGW1 in active-standby mode and create two BGP-enabled connections.
  fr: |
    Vous déployez VGW1 en mode actif-passif (active-standby) et créez deux connexions avec BGP activé.
body:
  solution:
    en: |
      You deploy VGW1 in the default **active-standby** mode, with BGP enabled. You create two local network gateways, one for Dev1 and one for Dev2, each with the public IP address, the BGP peer IP address and the ASN of its device. You create one connection to each local network gateway with **BGP enabled**, and both devices advertise 10.50.0.0/16.
    fr: |
      Vous déployez VGW1 dans le mode **actif-passif (active-standby)** par défaut, avec BGP activé. Vous créez deux passerelles de réseau local, une pour Dev1 et une pour Dev2, chacune avec l'adresse IP publique, l'adresse IP d'homologue BGP et l'ASN de son périphérique. Vous créez une connexion vers chaque passerelle de réseau local avec **BGP activé**, et les deux périphériques publient 10.50.0.0/16.
answer: { value: false }
explanation:
  correct:
    en: |
      Two BGP connections to two devices protect against the failure of one on-premises device, so the first requirement is met. However, an active-standby gateway terminates every tunnel on its active instance only: if that instance fails, the standby instance must take over, which takes up to about 1 to 3 minutes for an unplanned event. Only active-active mode uses both gateway instances at the same time.
    fr: |
      Deux connexions BGP vers deux périphériques protègent contre la panne d'un périphérique local : la première exigence est donc respectée. En revanche, une passerelle actif-passif termine tous les tunnels sur sa seule instance active : si celle-ci tombe en panne, l'instance de secours doit prendre le relais, ce qui prend jusqu'à environ 1 à 3 minutes lors d'un événement non planifié. Seul le mode actif-actif utilise simultanément les deux instances de passerelle.
references:
  - title: Design highly available gateway connectivity for cross-premises and VNet-to-VNet connections
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-highlyavailable
