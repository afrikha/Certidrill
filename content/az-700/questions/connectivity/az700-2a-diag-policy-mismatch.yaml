id: az700-2a-diag-policy-mismatch
objective: "2.1.8"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has a site-to-site connection named **Hub-to-Lab** with a custom IPsec/IKE policy. The tunnel doesn't establish. The preshared key and the public IP addresses are confirmed to match on both sides.

    The following table compares the Azure connection configuration with the on-premises device configuration.

    Answer each prompt by selecting the setting that you must correct.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'une connexion de site à site nommée **Hub-to-Lab** avec une stratégie IPsec/IKE personnalisée. Le tunnel ne s'établit pas. La clé prépartagée et les adresses IP publiques sont confirmées identiques des deux côtés.

    Le tableau suivant compare la configuration de la connexion Azure à celle du périphérique local.

    Répondez à chaque consigne en sélectionnant le paramètre que vous devez corriger.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Setting that prevents IKE Phase 1 (Main Mode) from completing", fr: "Paramètre qui empêche la phase 1 IKE (mode principal) d'aboutir" }
    - id: p2
      text: { en: "Setting that prevents IPsec Phase 2 (Quick Mode) from completing", fr: "Paramètre qui empêche la phase 2 IPsec (mode rapide) d'aboutir" }
  grid:
    header: [{ en: Setting, fr: Paramètre }, { en: "Azure connection Hub-to-Lab", fr: "Connexion Azure Hub-to-Lab" }, { en: "On-premises device", fr: "Périphérique local" }]
    rows:
      - [{ text: { en: "IKE version", fr: "Version IKE" }, area: ikever }, { text: IKEv2 }, { text: IKEv2 }]
      - [{ text: { en: "IKE encryption", fr: "Chiffrement IKE" }, area: ikeenc }, { text: AES256 }, { text: AES256 }]
      - [{ text: { en: "IKE integrity", fr: "Intégrité IKE" }, area: ikeint }, { text: SHA384 }, { text: SHA384 }]
      - [{ text: { en: "DH group", fr: "Groupe DH" }, area: dh }, { text: DHGroup24 }, { text: { en: "Group 14", fr: "Groupe 14" } }]
      - [{ text: { en: "IPsec encryption", fr: "Chiffrement IPsec" }, area: ipenc }, { text: AES256 }, { text: AES256 }]
      - [{ text: { en: "IPsec integrity", fr: "Intégrité IPsec" }, area: ipint }, { text: SHA256 }, { text: SHA256 }]
      - [{ text: { en: "PFS group", fr: "Groupe PFS" }, area: pfs }, { text: PFS2048 }, { text: { en: "None (PFS disabled)", fr: "Aucun (PFS désactivée)" } }]
      - [{ text: { en: "Quick Mode SA lifetime", fr: "Durée de vie de la SA en mode rapide" }, area: salife }, { text: { en: "27,000 seconds", fr: "27 000 secondes" } }, { text: { en: "3,600 seconds", fr: "3 600 secondes" } }]
answer:
  values: { p1: dh, p2: pfs }
explanation:
  correct:
    en: |
      The on-premises device must match or contain the IKE encryption, IKE integrity and DH group of Phase 1, and the IPsec encryption, IPsec integrity and PFS group of Phase 2. DHGroup24 and group 14 are different Diffie-Hellman groups, so Main Mode fails; PFS2048 against PFS disabled makes Quick Mode fail. SA lifetimes are local specifications that don't need to match.
    fr: |
      Le périphérique local doit correspondre ou contenir le chiffrement IKE, l'intégrité IKE et le groupe DH de la phase 1, ainsi que le chiffrement IPsec, l'intégrité IPsec et le groupe PFS de la phase 2. DHGroup24 et le groupe 14 sont des groupes Diffie-Hellman différents : le mode principal échoue ; PFS2048 face à une PFS désactivée fait échouer le mode rapide. Les durées de vie des SA sont des valeurs locales qui n'ont pas besoin de correspondre.
  options:
    salife: { en: "SA lifetimes don't need to match between the two sides.", fr: "Les durées de vie des SA n'ont pas besoin de correspondre entre les deux côtés." }
references:
  - title: "Configure custom IPsec/IKE connection policies for S2S VPN and VNet-to-VNet: Azure portal"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/ipsec-ike-policy-howto
  - title: VPN Gateway FAQ
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-vpn-faq
