id: az700-sr2-globalreach-2
objective: "2.3.4"
type: series_yesno
series: az700-sr2-globalreach
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You enable Global Reach between the two circuits.
  fr: Vous activez Global Reach entre les deux circuits.
body:
  solution:
    en: |
      On ER-PAR, you add a Global Reach connection to the Azure private peering of ER-AMS, and you specify 192.168.100.0/29 as the address prefix. You keep both circuits on the Standard tier.
    fr: |
      Sur ER-PAR, vous ajoutez une connexion Global Reach vers le peering privé Azure d'ER-AMS, et vous indiquez 192.168.100.0/29 comme préfixe d'adresse. Vous conservez le niveau Standard sur les deux circuits.
answer: { value: true }
explanation:
  correct:
    en: |
      Global Reach links the private peerings of two circuits created at different peering locations, so the two offices exchange traffic over the Microsoft global network. It is configured on one circuit and needs an unused /29 subnet. Paris and Amsterdam are in the same geopolitical region, so Premium isn't required.
    fr: |
      Global Reach relie les peerings privés de deux circuits créés dans des emplacements de peering différents : les deux bureaux échangent leur trafic par le réseau mondial de Microsoft. Il se configure sur un seul circuit et nécessite un sous-réseau /29 inutilisé. Paris et Amsterdam sont dans la même région géopolitique, Premium n'est donc pas nécessaire.
references:
