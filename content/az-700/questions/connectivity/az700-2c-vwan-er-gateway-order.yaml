id: az700-2c-vwan-er-gateway-order
objective: "2.4.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Standard virtual WAN with a virtual hub named **Hub-WE**. Hub-WE has no gateways. Five spoke virtual networks are connected to Hub-WE.

    An ExpressRoute circuit named **ER-DC1** is in a subscription managed by another team. Private peering is configured on ER-DC1, and the circuit owner has sent you an authorization key and the resource ID of the circuit.

    You need to connect ER-DC1 to Hub-WE.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'un réseau étendu virtuel Standard avec un hub virtuel nommé **Hub-WE**. Hub-WE n'a aucune passerelle. Cinq réseaux virtuels spoke sont connectés à Hub-WE.

    Un circuit ExpressRoute nommé **ER-DC1** se trouve dans un abonnement géré par une autre équipe. Le peering privé est configuré sur ER-DC1, et le propriétaire du circuit vous a envoyé une clé d'autorisation et l'ID de ressource du circuit.

    Vous devez connecter ER-DC1 à Hub-WE.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: redeem, text: { en: "On the ExpressRoute page of Hub-WE, redeem the authorization key of ER-DC1.", fr: "Dans la page ExpressRoute de Hub-WE, utiliser (Redeem) la clé d'autorisation d'ER-DC1." } }
    - { id: vnetgw, text: { en: "Create an ExpressRoute virtual network gateway in the GatewaySubnet of one of the spoke virtual networks.", fr: "Créer une passerelle de réseau virtuel ExpressRoute dans le GatewaySubnet de l'un des réseaux virtuels spoke." } }
    - { id: edit, text: { en: "Edit Hub-WE, select Include ExpressRoute gateway, and choose the gateway scale units.", fr: "Modifier Hub-WE, sélectionner Include ExpressRoute gateway et choisir les unités d'échelle de la passerelle." } }
    - { id: site, text: { en: "Create a VPN site that represents the datacenter of ER-DC1.", fr: "Créer un site VPN qui représente le centre de données d'ER-DC1." } }
    - { id: connect, text: { en: "Select ER-DC1 and connect the circuit to the hub.", fr: "Sélectionner ER-DC1 et connecter le circuit au hub." } }
    - { id: premium, text: { en: "Upgrade ER-DC1 to the Premium SKU.", fr: "Mettre à niveau ER-DC1 vers la référence SKU Premium." } }
answer:
  sequence: [ edit, redeem, connect ]
explanation:
  correct:
    en: |
      You first add an ExpressRoute gateway to the existing hub by editing it (about 30 minutes). Because the circuit is in another subscription, you then redeem its authorization key on the hub's ExpressRoute page, and finally select the circuit and connect it to the hub gateway.
    fr: |
      Vous ajoutez d'abord une passerelle ExpressRoute au hub existant en le modifiant (environ 30 minutes). Comme le circuit se trouve dans un autre abonnement, vous utilisez ensuite sa clé d'autorisation dans la page ExpressRoute du hub, puis vous sélectionnez le circuit et le connectez à la passerelle du hub.
  options:
    vnetgw:
      en: |
        A virtual network connected to a hub can't have its own virtual network gateway; the circuit connects to the hub gateway.
      fr: |
        Un réseau virtuel connecté à un hub ne peut pas avoir sa propre passerelle de réseau virtuel ; le circuit se connecte à la passerelle du hub.
    site:
      en: |
        VPN sites are used for site-to-site VPN connections only.
      fr: |
        Les sites VPN ne servent qu'aux connexions VPN de site à site.
    premium:
      en: |
        Local, Standard and Premium circuits can all connect to a hub ExpressRoute gateway.
      fr: |
        Les circuits Local, Standard et Premium peuvent tous se connecter à une passerelle ExpressRoute de hub.
references:
  - title: "Tutorial: Create an ExpressRoute association to Virtual WAN - Azure portal"
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-expressroute-portal
