id: az700-2c-nva-hub-statements
objective: "2.4.7"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has a virtual WAN named **VWAN1** with a virtual hub named **Hub1**. Tailspin plans to deploy a partner SD-WAN network virtual appliance (NVA) in Hub1 to terminate SD-WAN tunnels from 200 branch offices.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un réseau étendu virtuel nommé **VWAN1** avec un hub virtuel nommé **Hub1**. Tailspin prévoit de déployer dans Hub1 une appliance virtuelle réseau (NVA) SD-WAN d'un partenaire pour terminer les tunnels SD-WAN de 200 succursales.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If VWAN1 is a Basic virtual WAN, you can deploy the NVA in Hub1 without changing the type of VWAN1.
        fr: Si VWAN1 est un réseau étendu virtuel Basic, vous pouvez déployer la NVA dans Hub1 sans changer le type de VWAN1.
    - id: s2
      text:
        en: One NVA infrastructure unit corresponds to 500 Mbps of aggregate bandwidth capacity.
        fr: Une unité d'infrastructure NVA correspond à 500 Mbit/s de capacité de bande passante agrégée.
    - id: s3
      text:
        en: After the deployment, you configure the SD-WAN policies by connecting to the NVA instances over SSH from a virtual machine in a spoke.
        fr: Après le déploiement, vous configurez les stratégies SD-WAN en vous connectant en SSH aux instances de la NVA depuis une machine virtuelle d'un spoke.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      An NVA can be deployed only in a Standard hub. Its capacity is expressed in NVA infrastructure units, where one unit is 500 Mbps of aggregate bandwidth (actual throughput depends on the vendor's software). The NVA is deployed as a managed application and configured through the partner's portal or management application; you can't access the NVA directly for configuration.
    fr: |
      Une NVA ne peut être déployée que dans un hub Standard. Sa capacité s'exprime en unités d'infrastructure NVA, une unité valant 500 Mbit/s de bande passante agrégée (le débit réel dépend du logiciel du fabricant). La NVA est déployée comme application managée et se configure par le portail ou l'application de gestion du partenaire ; vous ne pouvez pas accéder directement à la NVA pour la configurer.
references:
  - title: About NVAs in a Virtual WAN hub
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/about-nva-hub
