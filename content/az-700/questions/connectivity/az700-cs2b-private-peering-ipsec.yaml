id: az700-cs2b-private-peering-ipsec
objective: "2.3.11"
type: ordering
caseStudy: az700-cs2b-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You create a local network gateway named **lng-rtm-private** that contains the private IP address of the Rotterdam firewall and the prefixes of the datacenter. As a first stage of the encryption requirement, you need to establish an IPsec tunnel between the Rotterdam firewall and VNet-Hub. You will adjust the route advertisements later.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous créez une passerelle de réseau local nommée **lng-rtm-private** qui contient l'adresse IP privée du pare-feu de Rotterdam et les préfixes du centre de données. Comme première étape de l'exigence de chiffrement, vous devez établir un tunnel IPsec entre le pare-feu de Rotterdam et VNet-Hub. Vous ajusterez les publications de routes plus tard.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: vgw, text: { en: "Deploy a VPN gateway named vgw-weu in GatewaySubnet of VNet-Hub, with a Standard public IP address.", fr: "Déployer une passerelle VPN nommée vgw-weu dans GatewaySubnet de VNet-Hub, avec une adresse IP publique Standard." } }
    - { id: privip, text: { en: "Set Gateway Private IPs to Enabled on vgw-weu.", fr: "Définir Gateway Private IPs sur Enabled sur vgw-weu." } }
    - { id: conn, text: { en: "Create a site-to-site connection from vgw-weu to lng-rtm-private and set Use Azure Private IP Address to Enabled.", fr: "Créer une connexion de site à site de vgw-weu vers lng-rtm-private et définir Use Azure Private IP Address sur Enabled." } }
    - { id: msft, text: { en: "Configure Microsoft peering on ER-AMS and associate a route filter.", fr: "Configurer le peering Microsoft sur ER-AMS et lui associer un filtre de routage." } }
    - { id: macsec, text: { en: "Enable MACsec on ER-AMS.", fr: "Activer MACsec sur ER-AMS." } }
    - { id: fastpath, text: { en: "Enable FastPath on the connection between ergw-weu and ER-AMS.", fr: "Activer FastPath sur la connexion entre ergw-weu et ER-AMS." } }
answer:
  sequence: [vgw, privip, conn]
explanation:
  correct:
    en: |
      A site-to-site VPN over ExpressRoute private peering terminates on a VPN gateway that uses private IP addresses. The VPN gateway coexists with ergw-weu in GatewaySubnet and requires a Standard public IP address. You then enable Gateway Private IPs on the gateway, and create the connection with Use Azure Private IP Address enabled, so that the tunnel uses the private address of the gateway across the circuit. Because Azure prefers ExpressRoute when the same prefixes are advertised on both paths, the route advertisements must then send the protected prefixes through the VPN.
    fr: |
      Un VPN de site à site sur le peering privé ExpressRoute aboutit sur une passerelle VPN qui utilise des adresses IP privées. La passerelle VPN coexiste avec ergw-weu dans GatewaySubnet et exige une adresse IP publique Standard. Vous activez ensuite Gateway Private IPs sur la passerelle, puis vous créez la connexion avec Use Azure Private IP Address activé, afin que le tunnel utilise l'adresse privée de la passerelle sur le circuit. Comme Azure préfère ExpressRoute quand les mêmes préfixes sont publiés sur les deux chemins, les publications de routes devront ensuite faire passer les préfixes protégés par le VPN.
  options:
    msft: { en: "A VPN over Microsoft peering is another design, but the requirements forbid Microsoft peering.", fr: "Un VPN sur le peering Microsoft est une autre conception, mais les exigences interdisent le peering Microsoft." }
    macsec: { en: "MACsec is configured on ExpressRoute Direct ports; ER-AMS is a provider circuit.", fr: "MACsec se configure sur des ports ExpressRoute Direct ; ER-AMS est un circuit de fournisseur." }
    fastpath: { en: "FastPath changes the data path of the gateway and requires ErGw3AZ or equivalent; it doesn't encrypt anything.", fr: "FastPath modifie le chemin des données de la passerelle et exige ErGw3AZ ou équivalent ; il ne chiffre rien." }
references:
  - title: Configure a Site-to-Site VPN connection over ExpressRoute private peering
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/site-to-site-vpn-private-peering
