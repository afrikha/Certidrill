id: az700-2c-er-vpn-private-peering
objective: "2.3.11"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has a virtual network named **VNet1** that contains an ExpressRoute gateway linked to a provider circuit, and a VPN gateway named **VPNGW1** that uses a Standard public IP address. The on-premises network advertises 10.20.0.0/16 to Azure over ExpressRoute. The on-premises VPN device doesn't support BGP.

    You need to create an IPsec tunnel from the on-premises VPN device to VPNGW1 over the ExpressRoute private peering. Traffic from VNet1 to the on-premises subnet 10.20.8.0/24 must go through the tunnel.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un réseau virtuel nommé **VNet1** qui contient une passerelle ExpressRoute liée à un circuit de fournisseur, et une passerelle VPN nommée **VPNGW1** qui utilise une adresse IP publique Standard. Le réseau local publie 10.20.0.0/16 vers Azure par ExpressRoute. Le périphérique VPN local ne prend pas en charge BGP.

    Vous devez créer un tunnel IPsec entre le périphérique VPN local et VPNGW1 sur le peering privé ExpressRoute. Le trafic de VNet1 vers le sous-réseau local 10.20.8.0/24 doit passer par le tunnel.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      On VPNGW1, set [[gwset]] to Enabled.

      On the site-to-site connection, set [[connset]] to Enabled.

      In the local network gateway that represents the on-premises device, the address space is [[prefix]].
    fr: |
      Sur VPNGW1, réglez [[gwset]] sur Enabled.

      Sur la connexion de site à site, réglez [[connset]] sur Enabled.

      Dans la passerelle de réseau local qui représente le périphérique local, l'espace d'adressage est [[prefix]].
  slots:
    - id: gwset
      options:
        - { id: aa, text: { en: "Active-active mode", fr: "Mode actif-actif (Active-active mode)" } }
        - { id: privip, text: Gateway Private IPs }
        - { id: bgp, text: { en: "Configure BGP", fr: "Configurer BGP (Configure BGP)" } }
    - id: connset
      options:
        - { id: pbts, text: Use policy based traffic selector }
        - { id: connbgp, text: BGP }
        - { id: useprivip, text: Use Azure Private IP Address }
    - id: prefix
      options:
        - { id: same, text: { en: "10.20.0.0/16", fr: "10.20.0.0/16" } }
        - { id: specific, text: { en: "10.20.8.0/24", fr: "10.20.8.0/24" } }
        - { id: summary, text: { en: "10.0.0.0/8", fr: "10.0.0.0/8" } }
answer:
  values: { gwset: privip, connset: useprivip, prefix: specific }
explanation:
  correct:
    en: "Gateway Private IPs gives VPNGW1 a private address reachable over private peering, and Use Azure Private IP Address makes the connection use it as the tunnel endpoint. Azure picks the longest prefix: the VPN path must carry a prefix more specific than the one learned over ExpressRoute, here 10.20.8.0/24 in the local network gateway, otherwise Azure sends the traffic directly over ExpressRoute, unencrypted."
    fr: "Gateway Private IPs donne à VPNGW1 une adresse privée joignable par le peering privé, et Use Azure Private IP Address fait utiliser cette adresse comme extrémité du tunnel par la connexion. Azure choisit le préfixe le plus long : le chemin VPN doit porter un préfixe plus spécifique que celui appris par ExpressRoute, ici 10.20.8.0/24 dans la passerelle de réseau local, sinon Azure envoie le trafic directement par ExpressRoute, sans chiffrement."
  options:
    same: { en: "With the same prefix as over ExpressRoute, Azure uses the ExpressRoute path directly, without VPN protection.", fr: "Avec le même préfixe que sur ExpressRoute, Azure emprunte directement le chemin ExpressRoute, sans protection VPN." }
    summary: { en: "A less specific prefix loses to 10.20.0.0/16 learned over ExpressRoute.", fr: "Un préfixe moins spécifique perd face à 10.20.0.0/16 appris par ExpressRoute." }
    aa: { en: "Active-active mode adds a second gateway instance; it doesn't expose a private tunnel address.", fr: "Le mode actif-actif ajoute une seconde instance de passerelle ; il n'expose pas d'adresse de tunnel privée." }
references:
  - title: Configure a Site-to-Site VPN connection over ExpressRoute private peering
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/site-to-site-vpn-private-peering
