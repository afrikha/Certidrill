id: az700-2a-pb-gateway-behavior
objective: "2.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has an existing policy-based VPN gateway named **GW-Legacy** that uses the Basic SKU. GW-Legacy has one site-to-site connection to a branch office.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'une passerelle VPN basée sur des stratégies nommée **GW-Legacy**, de référence SKU Basic. GW-Legacy a une connexion de site à site vers une succursale.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: GW-Legacy can accept point-to-site connections from remote users.
        fr: GW-Legacy peut accepter des connexions de point à site d'utilisateurs distants.
    - id: s2
      text:
        en: The connection of GW-Legacy uses IKEv1.
        fr: La connexion de GW-Legacy utilise IKEv1.
    - id: s3
      text:
        en: If no traffic crosses the tunnel for more than five minutes, the tunnel is torn down and is reestablished when traffic resumes.
        fr: Si aucun trafic ne traverse le tunnel pendant plus de cinq minutes, le tunnel est fermé, puis rétabli dès que le trafic reprend.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Point-to-site requires a route-based gateway; a policy-based gateway has no point-to-site support. A policy-based gateway uses the Basic SKU with IKEv1 and a single site-to-site tunnel. Tearing down an idle tunnel after five minutes is the expected behavior of policy-based (static routing) gateways.
    fr: |
      Le point à site exige une passerelle basée sur des itinéraires ; une passerelle basée sur des stratégies ne le prend pas en charge. Une passerelle basée sur des stratégies utilise la référence Basic avec IKEv1 et un seul tunnel de site à site. La fermeture d'un tunnel inactif après cinq minutes est le comportement attendu des passerelles basées sur des stratégies (routage statique).
references:
  - title: VPN Gateway FAQ
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-vpn-faq
  - title: About gateway SKUs
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-gateway-skus
