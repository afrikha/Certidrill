id: az700-2a-s2s-ha-modes
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware connects its head office to a virtual network named **VNet1** by using a site-to-site VPN. The head office has one VPN device. Litware is comparing the active-standby and active-active modes of a VpnGw2AZ gateway.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware relie son siège à un réseau virtuel nommé **VNet1** par un VPN de site à site. Le siège dispose d'un seul périphérique VPN. Litware compare les modes actif/passif et actif/actif d'une passerelle VpnGw2AZ.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: In active-standby mode, if the active instance fails unexpectedly, the standby instance resumes the site-to-site connection automatically after a brief interruption.
        fr: En mode actif/passif, si l'instance active tombe en panne de manière imprévue, l'instance de secours reprend automatiquement la connexion de site à site après une brève interruption.
    - id: s2
      text:
        en: In active-active mode, the two tunnels from the gateway instances to the head office device belong to the same connection resource.
        fr: En mode actif/actif, les deux tunnels établis entre les instances de passerelle et le périphérique du siège appartiennent à la même ressource de connexion.
    - id: s3
      text:
        en: An active-active gateway costs twice as much as an active-standby gateway of the same SKU.
        fr: Une passerelle actif/actif coûte deux fois plus cher qu'une passerelle actif/passif de même référence SKU.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Every VPN gateway has two instances; in active-standby mode the standby instance takes over automatically, with about 1 to 3 minutes of interruption for an unplanned event. In active-active mode, each instance has its own public IP address and establishes its own tunnel, but both tunnels are part of the same connection. The gateway costs the same in both modes; active-active only needs a second Standard public IP address.
    fr: |
      Chaque passerelle VPN comporte deux instances ; en mode actif/passif, l'instance de secours prend le relais automatiquement, avec environ 1 à 3 minutes d'interruption pour un incident imprévu. En mode actif/actif, chaque instance a sa propre adresse IP publique et établit son propre tunnel, mais les deux tunnels font partie de la même connexion. La passerelle coûte le même prix dans les deux modes ; le mode actif/actif demande seulement une seconde adresse IP publique Standard.
references:
  - title: About active-active mode VPN gateways
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-active-active-gateways
