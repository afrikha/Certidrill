id: az700-2a-s2s-impl-sequence
objective: "2.1.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a virtual network named **VNet1** with the address space 10.1.0.0/16 and a subnet named **FrontEnd** (10.1.0.0/24). A local network gateway named **Site1** that represents the on-premises VPN device already exists, and the device is configured with the shared key.

    You need to establish a site-to-site VPN connection between VNet1 and Site1 and confirm that it works.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank dispose d'un réseau virtuel nommé **VNet1**, d'espace d'adressage 10.1.0.0/16, avec un sous-réseau nommé **FrontEnd** (10.1.0.0/24). Une passerelle de réseau local nommée **Site1**, qui représente le périphérique VPN local, existe déjà, et la clé partagée est configurée sur le périphérique.

    Vous devez établir une connexion VPN de site à site entre VNet1 et Site1, puis vérifier qu'elle fonctionne.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: sub, text: { en: "Add a subnet named GatewaySubnet with the range 10.1.255.0/27 to VNet1.", fr: "Ajouter à VNet1 un sous-réseau nommé GatewaySubnet de plage 10.1.255.0/27." } }
    - { id: gw, text: { en: "Create a virtual network gateway of type VPN in VNet1.", fr: "Créer une passerelle de réseau virtuel de type VPN dans VNet1." } }
    - { id: conn, text: { en: "Create a connection of type Site-to-site (IPsec) to Site1 with the shared key.", fr: "Créer une connexion de type Site-to-site (IPsec) vers Site1 avec la clé partagée." } }
    - { id: verify, text: { en: "Check that the connection status is Connected.", fr: "Vérifier que l'état de la connexion est Connected." } }
    - { id: nsg, text: { en: "Associate a network security group with GatewaySubnet.", fr: "Associer un groupe de sécurité réseau à GatewaySubnet." } }
    - { id: udr, text: { en: "Associate a route table with a 0.0.0.0/0 route with GatewaySubnet.", fr: "Associer à GatewaySubnet une table de routage contenant un itinéraire 0.0.0.0/0." } }
answer:
  sequence: [ sub, gw, conn, verify ]
explanation:
  correct:
    en: |
      The gateway VMs are deployed into a subnet that must be named GatewaySubnet, so the subnet comes first. The connection references the virtual network gateway and the local network gateway, so it's created once the gateway is deployed (45 minutes or more). The connection status then moves to Connected when the tunnel is up.
    fr: |
      Les machines virtuelles de la passerelle sont déployées dans un sous-réseau qui doit s'appeler GatewaySubnet : le sous-réseau vient donc en premier. La connexion référence la passerelle de réseau virtuel et la passerelle de réseau local ; elle est créée une fois la passerelle déployée (45 minutes ou plus). L'état de la connexion passe ensuite à Connected quand le tunnel est établi.
  options:
    nsg: { en: "NSGs on the gateway subnet aren't supported and can stop the gateway from working.", fr: "Les groupes de sécurité réseau sur le sous-réseau de passerelle ne sont pas pris en charge et peuvent empêcher la passerelle de fonctionner." }
    udr: { en: "A user-defined route with a 0.0.0.0/0 destination on the gateway subnet isn't supported.", fr: "Un itinéraire défini par l'utilisateur de destination 0.0.0.0/0 sur le sous-réseau de passerelle n'est pas pris en charge." }
references:
  - title: "Tutorial: Create a site-to-site VPN connection in the Azure portal"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/tutorial-site-to-site-portal
  - title: About VPN Gateway configuration settings
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-gateway-settings
