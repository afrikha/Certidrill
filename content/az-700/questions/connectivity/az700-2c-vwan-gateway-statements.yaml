id: az700-2c-vwan-gateway-statements
objective: "2.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum is deploying gateways in a virtual hub named **Hub-US** of a Standard virtual WAN. Hub-US must terminate site-to-site VPN connections from branch offices, point-to-site connections from remote users, and an ExpressRoute circuit.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum déploie des passerelles dans un hub virtuel nommé **Hub-US** d'un réseau étendu virtuel Standard. Hub-US doit terminer les connexions VPN de site à site des succursales, les connexions point à site des utilisateurs nomades et un circuit ExpressRoute.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Hub-US can contain a site-to-site VPN gateway, a User VPN gateway and an ExpressRoute gateway at the same time.", fr: "Hub-US peut contenir en même temps une passerelle VPN de site à site, une passerelle VPN utilisateur et une passerelle ExpressRoute." } }
    - { id: b, text: { en: "You must create a subnet named GatewaySubnet in Hub-US before you deploy the gateways.", fr: "Vous devez créer un sous-réseau nommé GatewaySubnet dans Hub-US avant de déployer les passerelles." } }
    - { id: c, text: { en: "The device configuration scripts downloaded for VPN Gateway can be used to configure the branch devices.", fr: "Les scripts de configuration de périphérique téléchargés pour la passerelle VPN classique peuvent servir à configurer les périphériques des succursales." } }
    - { id: d, text: { en: "To remove the ExpressRoute gateway later, you must first delete its ExpressRoute connections.", fr: "Pour supprimer ultérieurement la passerelle ExpressRoute, vous devez d'abord supprimer ses connexions ExpressRoute." } }
    - { id: e, text: { en: "Each gateway in Hub-US requires a Standard public IP address resource that you create first.", fr: "Chaque passerelle de Hub-US exige une ressource d'adresse IP publique Standard que vous créez au préalable." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A Standard hub can host site-to-site, User VPN and ExpressRoute gateways together. When you clean up, ExpressRoute connections must be deleted before the ExpressRoute gateway.
    fr: |
      Un hub Standard peut héberger ensemble des passerelles de site à site, VPN utilisateur et ExpressRoute. Lors du nettoyage, les connexions ExpressRoute doivent être supprimées avant la passerelle ExpressRoute.
  options:
    b:
      en: |
        The hub is a Microsoft-managed virtual network; Azure assigns the gateway subnets from the hub address space automatically.
      fr: |
        Le hub est un réseau virtuel géré par Microsoft ; Azure attribue automatiquement les sous-réseaux des passerelles à partir de l'espace d'adressage du hub.
    c:
      en: |
        The device configuration scripts of VPN Gateway don't work for Virtual WAN; you download the Virtual WAN VPN configuration instead.
      fr: |
        Les scripts de configuration de périphérique de la passerelle VPN classique ne fonctionnent pas pour Virtual WAN ; vous téléchargez plutôt la configuration VPN de Virtual WAN.
    e:
      en: |
        Hub gateway addresses are assigned by Azure; you don't create public IP resources for them.
      fr: |
        Les adresses des passerelles du hub sont attribuées par Azure ; vous ne créez pas de ressources d'adresse IP publique pour elles.
references:
  - title: "Tutorial: Create an ExpressRoute association to Virtual WAN - Azure portal"
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-expressroute-portal
  - title: About virtual hub settings
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/hub-settings
