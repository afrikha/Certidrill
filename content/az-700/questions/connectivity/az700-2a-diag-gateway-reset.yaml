id: az700-2a-diag-gateway-reset
objective: "2.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an active-standby VPN gateway named **GW-North** with several site-to-site connections. One tunnel stopped working. You verified that the public IP addresses, the preshared key and the IPsec/IKE settings match on both sides, and the on-premises device works correctly.

    You plan to reset GW-North from the Azure portal.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'une passerelle VPN actif/passif nommée **GW-North** avec plusieurs connexions de site à site. Un tunnel ne fonctionne plus. Vous avez vérifié que les adresses IP publiques, la clé prépartagée et les paramètres IPsec/IKE correspondent des deux côtés, et que le périphérique local fonctionne correctement.

    Vous prévoyez de réinitialiser GW-North depuis le portail Azure.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "GW-North keeps its public IP address after the reset.", fr: "GW-North conserve son adresse IP publique après la réinitialisation." } }
    - { id: b, text: { en: "The on-premises devices must be updated with a new gateway public IP address after the reset.", fr: "Les périphériques locaux doivent être mis à jour avec une nouvelle adresse IP publique de passerelle après la réinitialisation." } }
    - { id: c, text: { en: "The current active instance is rebooted, which causes a brief disruption during the failover to the standby instance.", fr: "L'instance active actuelle est redémarrée, ce qui provoque une brève interruption pendant le basculement vers l'instance de secours." } }
    - { id: d, text: { en: "The reset deletes the connections of GW-North, which you must then recreate.", fr: "La réinitialisation supprime les connexions de GW-North, qu'il faut ensuite recréer." } }
    - { id: e, text: { en: "The reset reboots both instances at the same time, so all tunnels are down for about 45 minutes.", fr: "La réinitialisation redémarre les deux instances en même temps : tous les tunnels sont coupés pendant environ 45 minutes." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Resetting a VPN gateway reboots it and reapplies the cross-premises configuration; the gateway keeps its public IP address, so the on-premises devices need no change. On an active-standby gateway, the current active instance is rebooted immediately, with a brief disruption while the standby instance takes over. If the connection isn't restored, running the reset again reboots the other instance.
    fr: |
      La réinitialisation d'une passerelle VPN la redémarre et réapplique la configuration intersite ; la passerelle conserve son adresse IP publique, et les périphériques locaux n'ont rien à modifier. Sur une passerelle actif/passif, l'instance active actuelle est redémarrée immédiatement, avec une brève interruption pendant que l'instance de secours prend le relais. Si la connexion n'est pas rétablie, une nouvelle réinitialisation redémarre l'autre instance.
  options:
    b: { en: "The public IP address doesn't change on a reset.", fr: "L'adresse IP publique ne change pas lors d'une réinitialisation." }
    d: { en: "A reset reapplies the existing connections; it doesn't delete them.", fr: "Une réinitialisation réapplique les connexions existantes ; elle ne les supprime pas." }
    e: { en: "Only one instance is rebooted per reset; 45 minutes is the order of magnitude of a gateway deployment, not of a reset.", fr: "Une seule instance est redémarrée par réinitialisation ; 45 minutes est l'ordre de grandeur d'un déploiement de passerelle, pas d'une réinitialisation." }
references:
  - title: Reset a VPN gateway or a connection
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/reset-gateway
