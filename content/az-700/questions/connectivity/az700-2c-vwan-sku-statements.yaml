id: az700-2c-vwan-sku-statements
objective: "2.4.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a virtual WAN named **VWAN-Contoso** of type Basic. VWAN-Contoso contains two virtual hubs, each with a site-to-site VPN gateway that connects 40 branch offices. Contoso plans to change the type of VWAN-Contoso to Standard.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un réseau étendu virtuel nommé **VWAN-Contoso** de type Basic. VWAN-Contoso contient deux hubs virtuels, chacun avec une passerelle VPN de site à site qui connecte 40 succursales. Contoso prévoit de passer VWAN-Contoso au type Standard.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After the change, both hubs of VWAN-Contoso become Standard hubs.
        fr: Après le changement, les deux hubs de VWAN-Contoso deviennent des hubs Standard.
    - id: s2
      text:
        en: Before the change, you can increase the gateway scale units of the site-to-site VPN gateways to raise their throughput.
        fr: Avant le changement, vous pouvez augmenter les unités d'échelle des passerelles VPN de site à site pour accroître leur débit.
    - id: s3
      text:
        en: If the Standard features are not used, you can change VWAN-Contoso back to Basic to reduce costs.
        fr: Si les fonctionnalités Standard ne sont pas utilisées, vous pouvez repasser VWAN-Contoso en Basic pour réduire les coûts.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Upgrading a virtual WAN from Basic to Standard upgrades all its hubs to Standard hubs. A Basic virtual WAN doesn't support adjusting gateway scale units; higher aggregate throughput requires Standard. The upgrade is one way: a Standard virtual WAN can't be reverted to Basic.
    fr: |
      La mise à niveau d'un réseau étendu virtuel de Basic vers Standard fait passer tous ses hubs en hubs Standard. Un réseau étendu virtuel Basic ne permet pas d'ajuster les unités d'échelle des passerelles ; un débit agrégé supérieur exige Standard. La mise à niveau est irréversible : un réseau étendu virtuel Standard ne peut pas revenir en Basic.
references:
  - title: Upgrade a virtual WAN from Basic to Standard
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/upgrade-virtual-wan
  - title: What is Azure Virtual WAN?
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-about
