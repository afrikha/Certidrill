id: az700-sr1-vwan-remote-users-3
objective: "2.4.1"
type: series_yesno
series: az700-sr1-vwan-remote-users
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You upgrade VWAN1 to Standard and add a point-to-site gateway that uses OpenVPN with Microsoft Entra authentication.
  fr: |
    Vous mettez VWAN1 à niveau vers Standard et ajoutez une passerelle de point à site qui utilise OpenVPN avec l'authentification Microsoft Entra.
body:
  solution:
    en: |
      You change the **Virtual WAN type** of VWAN1 to **Standard**. You create a user VPN configuration that uses the **OpenVPN** tunnel type and Microsoft Entra authentication, and you add a point-to-site gateway that uses this configuration to Hub1. You connect Spoke1, Spoke2 and Spoke3 to Hub1.
    fr: |
      Vous définissez le paramètre **Virtual WAN type** de VWAN1 sur **Standard**. Vous créez une configuration VPN utilisateur qui utilise le type de tunnel **OpenVPN** et l'authentification Microsoft Entra, et vous ajoutez à Hub1 une passerelle de point à site qui utilise cette configuration. Vous connectez Spoke1, Spoke2 et Spoke3 à Hub1.
answer: { value: true }
explanation:
  correct:
    en: |
      A Basic virtual WAN can be upgraded in place to Standard, and all its hubs become Standard hubs, so the branch connections stay on Hub1. A Standard hub supports user VPN, and Microsoft Entra authentication works with the OpenVPN tunnel type. Spoke virtual networks connected to a Standard hub can reach each other, the branches and the remote users through the hub.
    fr: |
      Un virtual WAN Basic peut être mis à niveau sur place vers Standard, et tous ses hubs deviennent des hubs Standard : les connexions des succursales restent sur Hub1. Un hub Standard prend en charge le VPN utilisateur, et l'authentification Microsoft Entra fonctionne avec le type de tunnel OpenVPN. Les réseaux virtuels spoke connectés à un hub Standard peuvent s'atteindre entre eux et atteindre les succursales et les utilisateurs distants par le hub.
references:
  - title: Upgrade a virtual WAN from Basic to Standard
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/upgrade-virtual-wan
  - title: What is Azure Virtual WAN?
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-about
