id: az700-cs4a-policy-based-sites
objective: "2.1.4"
type: single
caseStudy: az700-cs4a-coho-resorts
difficulty: 2
status: draft
stem:
  en: |
    You create a local network gateway for each of the Valfroide and Pic-Blanc resorts.

    You need to connect both resorts to VGW-HQ. The solution must meet the connectivity requirement. What should you do?
  fr: |
    Vous créez une passerelle réseau locale pour chacune des stations de Valfroide et de Pic-Blanc.

    Vous devez connecter les deux stations à VGW-HQ. La solution doit respecter l'exigence de connectivité. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the VPN type of VGW-HQ to PolicyBased, and then create a connection for each resort", fr: "Changer le type de VPN de VGW-HQ en PolicyBased, puis créer une connexion pour chaque station" } }
    - { id: b, text: { en: "Create a connection for each resort with a custom IPsec/IKE policy and policy-based traffic selectors", fr: "Créer pour chaque station une connexion avec une stratégie IPsec/IKE personnalisée et des sélecteurs de trafic basés sur des stratégies" } }
    - { id: c, text: { en: "Deploy a second VPN gateway of type PolicyBased in VNet-Hub, and then connect it to each resort", fr: "Déployer une seconde passerelle VPN de type PolicyBased dans VNet-Hub, puis la connecter à chaque station" } }
    - { id: d, text: { en: "Create a connection for each resort that uses the IKEv1 protocol and the default IPsec/IKE policy", fr: "Créer pour chaque station une connexion qui utilise le protocole IKEv1 et la stratégie IPsec/IKE par défaut" } }
answer: { optionId: b }
explanation:
  correct:
    en: A route-based gateway such as VGW-HQ can connect to several policy-based devices when each connection uses a custom IPsec/IKE policy with the policy-based traffic selectors option (UsePolicyBasedTrafficSelectors). The option requires the complete custom policy, and the on-premises devices must support IKEv2, which both firewalls do. The other connections of VGW-HQ keep their route-based configuration and BGP.
    fr: Une passerelle basée sur des routes comme VGW-HQ peut se connecter à plusieurs périphériques basés sur des stratégies quand chaque connexion utilise une stratégie IPsec/IKE personnalisée avec l'option des sélecteurs de trafic basés sur des stratégies (UsePolicyBasedTrafficSelectors). Cette option exige la stratégie personnalisée complète, et les périphériques locaux doivent prendre en charge IKEv2, ce qui est le cas des deux pare-feu. Les autres connexions de VGW-HQ conservent leur configuration basée sur des routes et BGP.
  options:
    a: { en: "The VPN type of an existing gateway can't be changed: you would have to delete and recreate VGW-HQ. A policy-based gateway exists only in the Basic SKU, connects to a single device and would break the BGP connections of the other sites.", fr: "Le type de VPN d'une passerelle existante ne peut pas être modifié : il faudrait supprimer et recréer VGW-HQ. Une passerelle basée sur des stratégies n'existe qu'avec le SKU Basic, ne se connecte qu'à un seul périphérique et casserait les connexions BGP des autres sites." }
    c: { en: "A virtual network can have only one VPN gateway (plus one ExpressRoute gateway), and the requirement forbids another VPN gateway anyway.", fr: "Un réseau virtuel ne peut avoir qu'une seule passerelle VPN (plus une passerelle ExpressRoute), et l'exigence interdit de toute façon une autre passerelle VPN." }
    d: { en: "With the default policy, the connection proposes any-to-any traffic selectors, which policy-based firewalls reject. Connecting policy-based devices to a route-based gateway also requires IKEv2 on the devices.", fr: "Avec la stratégie par défaut, la connexion propose des sélecteurs de trafic « any-to-any », que les pare-feu basés sur des stratégies refusent. La connexion de périphériques basés sur des stratégies à une passerelle basée sur des routes exige en outre IKEv2 sur ces périphériques." }
references:
  - title: Connect a VPN gateway to multiple on-premises policy-based VPN devices
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-connect-multiple-policybased-rm-ps
  - title: About VPN Gateway configuration settings
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-gateway-settings
