id: az700-2a-ipsec-connection-settings
objective: "2.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a route-based VPN gateway (VpnGw3AZ) with a site-to-site connection to each of three sites. Each site has a specific requirement.

    Which setting on the **Configuration** page of each connection should you change? To answer, drag the appropriate settings to the correct sites. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'une passerelle VPN basée sur des itinéraires (VpnGw3AZ) avec une connexion de site à site vers chacun de trois sites. Chaque site a une exigence précise.

    Quel paramètre de la page **Configuration** de chaque connexion devez-vous modifier ? Pour répondre, faites glisser les paramètres appropriés vers les sites correspondants. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: policy, text: { en: "IPsec / IKE policy: Custom", fr: "IPsec / IKE policy : Custom" } }
    - { id: pbts, text: "Use policy based traffic selector" }
    - { id: dpd, text: { en: "DPD timeout in seconds", fr: "DPD timeout in seconds (délai d'expiration DPD)" } }
    - { id: mode, text: "Connection Mode" }
    - { id: privip, text: "Use Azure Private IP Address" }
  targets:
    - id: t1
      text: { en: "Site A: Azure must send and accept only the AES256, SHA256 and DH group 14 proposals defined by the security team.", fr: "Site A : Azure doit envoyer et accepter uniquement les propositions AES256, SHA256 et groupe DH 14 définies par l'équipe de sécurité." }
    - id: t2
      text: { en: "Site B: the firewall defines its encryption domains as pairs of on-premises and Azure prefixes.", fr: "Site B : le pare-feu définit ses domaines de chiffrement comme des paires de préfixes locaux et Azure." }
    - id: t3
      text: { en: "Site C: an unresponsive peer must be detected within 30 seconds instead of the default interval.", fr: "Site C : un homologue qui ne répond plus doit être détecté en 30 secondes au lieu de l'intervalle par défaut." }
answer:
  mapping: { t1: policy, t2: pbts, t3: dpd }
explanation:
  correct:
    en: |
      A Custom IPsec/IKE policy restricts the connection to the specified algorithms and key strengths. Use policy based traffic selector makes the route-based gateway work with a policy-based device that uses prefix pairs. The DPD timeout defaults to 45 seconds and can be set from 9 to 3,600 seconds; Microsoft recommends 30 to 45 seconds.
    fr: |
      Une stratégie IPsec/IKE Custom limite la connexion aux algorithmes et longueurs de clé indiqués. Use policy based traffic selector permet à la passerelle basée sur des itinéraires de fonctionner avec un périphérique basé sur des stratégies qui utilise des paires de préfixes. Le délai DPD vaut 45 secondes par défaut et peut être réglé de 9 à 3 600 secondes ; Microsoft recommande 30 à 45 secondes.
  options:
    mode: { en: "Connection Mode only sets which side initiates the initial IKE negotiation.", fr: "Connection Mode définit seulement le côté qui lance la négociation IKE initiale." }
    privip: { en: "Use Azure Private IP Address is for site-to-site VPN over ExpressRoute private peering.", fr: "Use Azure Private IP Address sert au VPN de site à site sur le peering privé ExpressRoute." }
references:
  - title: "Configure custom IPsec/IKE connection policies for S2S VPN and VNet-to-VNet: Azure portal"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/ipsec-ike-policy-howto
  - title: VPN Gateway FAQ
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-vpn-faq
