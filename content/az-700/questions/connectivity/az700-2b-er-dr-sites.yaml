id: az700-2b-er-dr-sites
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs a mission-critical application in a virtual network named **VNet1** in West Europe. VNet1 has a zone-redundant ExpressRoute gateway connected to one ExpressRoute circuit at the Amsterdam peering location.

    Contoso requires that on-premises users keep private connectivity to VNet1 even if the whole Amsterdam peering location becomes unavailable.

    What should you add to the design?
  fr: |
    Contoso exécute une application stratégique dans un réseau virtuel nommé **VNet1** dans la région West Europe. VNet1 possède une passerelle ExpressRoute redondante interzone connectée à un circuit ExpressRoute à l'emplacement de peering Amsterdam.

    Contoso exige que les utilisateurs locaux conservent une connectivité privée vers VNet1 même si l'emplacement de peering Amsterdam devient entièrement indisponible.

    Que devez-vous ajouter à la conception ?
body:
  options:
    - { id: a, text: { en: "A second circuit at the Amsterdam peering location, linked to VNet1", fr: "Un second circuit à l'emplacement de peering Amsterdam, lié à VNet1" } }
    - { id: b, text: { en: "A second circuit at another peering location, linked to VNet1", fr: "Un second circuit dans un autre emplacement de peering, lié à VNet1" } }
    - { id: c, text: { en: "A second connection between the gateway and the existing circuit", fr: "Une seconde connexion entre la passerelle et le circuit existant" } }
    - { id: d, text: { en: "The Premium add-on on the existing circuit", fr: "Le module Premium sur le circuit existant" } }
answer: { optionId: b }
explanation:
  correct:
    en: One circuit already has two connections to two Microsoft edge routers, but both end at the same peering location. Maximum resiliency uses a pair of circuits at two distinct peering locations, both linked to the virtual network, so the loss of one site doesn't cut connectivity.
    fr: "Un circuit possède déjà deux connexions vers deux routeurs de périphérie Microsoft, mais elles aboutissent au même emplacement de peering. La résilience maximale repose sur une paire de circuits dans deux emplacements de peering distincts, tous deux liés au réseau virtuel : la perte d'un site ne coupe pas la connectivité."
  options:
    a: { en: "A second circuit at the same peering location shares the same site, so the loss of Amsterdam would cut both.", fr: "Un second circuit au même emplacement de peering partage le même site : la perte d'Amsterdam couperait les deux." }
    c: { en: "Another connection to the same circuit still depends on the Amsterdam peering location.", fr: "Une autre connexion au même circuit dépend toujours de l'emplacement de peering Amsterdam." }
    d: { en: "Premium extends the geographic reach and limits of the circuit; it doesn't add a second site.", fr: "Premium étend la portée géographique et les limites du circuit ; il n'ajoute pas de second site." }
references:
  - title: Design and architect Azure ExpressRoute for resiliency
    url: https://learn.microsoft.com/en-us/azure/expressroute/design-architecture-for-resiliency
