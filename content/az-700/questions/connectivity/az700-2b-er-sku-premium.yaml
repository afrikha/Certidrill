id: az700-2b-er-sku-premium
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an ExpressRoute circuit named **CKT1** with the following configuration:

    | Setting | Value |
    | --- | --- |
    | Peering location | Amsterdam |
    | Bandwidth | 1 Gbps |
    | SKU | Standard, MeteredData |
    | Linked virtual networks | 3 in West Europe, 2 in North Europe |

    Adatum deploys a new virtual network named **VNet-US** in the East US region. VNet-US has an ExpressRoute gateway.

    You need to link VNet-US to CKT1. What should you do first?
  fr: |
    Adatum dispose d'un circuit ExpressRoute nommé **CKT1** dont la configuration est la suivante :

    | Paramètre | Valeur |
    | --- | --- |
    | Emplacement de peering | Amsterdam |
    | Bande passante | 1 Gbit/s |
    | Référence SKU | Standard, MeteredData |
    | Réseaux virtuels liés | 3 dans West Europe, 2 dans North Europe |

    Adatum déploie un nouveau réseau virtuel nommé **VNet-US** dans la région East US. VNet-US possède une passerelle ExpressRoute.

    Vous devez lier VNet-US à CKT1. Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Change the billing model of CKT1 to UnlimitedData.", fr: "Changer le modèle de facturation de CKT1 en UnlimitedData." } }
    - { id: b, text: { en: "Enable ExpressRoute Global Reach on CKT1.", fr: "Activer ExpressRoute Global Reach sur CKT1." } }
    - { id: c, text: { en: "Increase the bandwidth of CKT1 to 2 Gbps.", fr: "Augmenter la bande passante de CKT1 à 2 Gbit/s." } }
    - { id: d, text: { en: "Upgrade CKT1 to the Premium tier.", fr: "Faire passer CKT1 au niveau Premium." } }
answer: { optionId: d }
explanation:
  correct:
    en: A Standard circuit gives access to the Azure regions of its geopolitical area only, here Europe, and all the virtual networks linked to it must be in that area. The Premium add-on extends connectivity to all Azure regions, so CKT1 must be upgraded to Premium before VNet-US in East US can be linked. The upgrade doesn't require recreating the circuit.
    fr: "Un circuit Standard ne donne accès qu'aux régions Azure de sa zone géopolitique, ici l'Europe, et tous les réseaux virtuels qui lui sont liés doivent s'y trouver. Le module Premium étend la connectivité à toutes les régions Azure : CKT1 doit donc passer en Premium avant de pouvoir lier VNet-US, situé dans East US. Ce changement n'exige pas de recréer le circuit."
  options:
    a: { en: "The billing model controls how data transfer is charged, not which regions the circuit reaches.", fr: "Le modèle de facturation détermine la facturation du transfert de données, pas les régions accessibles par le circuit." }
    b: { en: "Global Reach connects on-premises sites through two circuits; it doesn't extend a circuit to another geopolitical area.", fr: "Global Reach relie des sites locaux par deux circuits ; il n'étend pas un circuit à une autre zone géopolitique." }
    c: { en: "Bandwidth doesn't change the geographic scope, and a Standard circuit at any bandwidth accepts up to 10 virtual network links.", fr: "La bande passante ne change pas la portée géographique, et un circuit Standard accepte jusqu'à 10 liaisons de réseaux virtuels quelle que soit sa bande passante." }
references:
  - title: FAQ - Azure ExpressRoute
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-faqs
  - title: Connect a virtual network to an ExpressRoute circuit - Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-linkvnet-arm
