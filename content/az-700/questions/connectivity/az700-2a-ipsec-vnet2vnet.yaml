id: az700-2a-ipsec-vnet2vnet
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has two virtual networks, **VNet-East** and **VNet-West**, each with a route-based VPN gateway. The gateways are linked by a VNet-to-VNet connection, made of the connection resources **East-to-West** and **West-to-East**.

    You configure a custom IPsec/IKE policy (AES256, SHA256, DHGroup14, GCMAES256, PFS2048) on East-to-West and save it. Since then, the tunnel between the two virtual networks no longer establishes.

    You need to restore the connection while enforcing the custom policy.

    What should you do?
  fr: |
    Litware dispose de deux réseaux virtuels, **VNet-East** et **VNet-West**, chacun avec une passerelle VPN basée sur des itinéraires. Les passerelles sont reliées par une connexion de réseau virtuel à réseau virtuel, constituée des ressources de connexion **East-to-West** et **West-to-East**.

    Vous configurez une stratégie IPsec/IKE personnalisée (AES256, SHA256, DHGroup14, GCMAES256, PFS2048) sur East-to-West et l'enregistrez. Depuis, le tunnel entre les deux réseaux virtuels ne s'établit plus.

    Vous devez rétablir la connexion tout en appliquant la stratégie personnalisée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Reset both VPN gateways.", fr: "Réinitialiser les deux passerelles VPN." } }
    - { id: b, text: { en: "Apply the same custom policy to West-to-East.", fr: "Appliquer la même stratégie personnalisée à West-to-East." } }
    - { id: c, text: { en: "Enable policy-based traffic selectors on East-to-West.", fr: "Activer les sélecteurs de trafic basés sur des stratégies sur East-to-West." } }
    - { id: d, text: { en: "Set the DPD timeout of East-to-West to 45 seconds.", fr: "Définir le délai d'expiration DPD d'East-to-West sur 45 secondes." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A VNet-to-VNet tunnel consists of two connection resources, one for each direction. Once a custom policy is set on a connection, that gateway sends and accepts only the specified proposals, so both connection resources must carry the same policy for the tunnel to establish.
    fr: |
      Un tunnel de réseau virtuel à réseau virtuel est constitué de deux ressources de connexion, une par sens. Dès qu'une stratégie personnalisée est définie sur une connexion, cette passerelle n'envoie et n'accepte que les propositions indiquées : les deux ressources de connexion doivent porter la même stratégie pour que le tunnel s'établisse.
  options:
    a: { en: "A reset reboots the gateways but doesn't fix a policy mismatch between the two connection resources.", fr: "Une réinitialisation redémarre les passerelles mais ne corrige pas l'incohérence de stratégie entre les deux ressources de connexion." }
    c: { en: "Policy-based traffic selectors are for on-premises policy-based devices; they don't solve the algorithm mismatch.", fr: "Les sélecteurs de trafic basés sur des stratégies servent aux périphériques locaux basés sur des stratégies ; ils ne règlent pas l'incohérence d'algorithmes." }
    d: { en: "45 seconds is already the default DPD timeout and doesn't affect proposal negotiation.", fr: "45 secondes est déjà le délai DPD par défaut et n'agit pas sur la négociation des propositions." }
references:
  - title: "Configure custom IPsec/IKE connection policies for S2S VPN and VNet-to-VNet: Azure portal"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/ipsec-ike-policy-howto
