id: az700-cs1c-remote-staff
objective: "2.2.5"
type: single
caseStudy: az700-cs1c-wingtip-toys
difficulty: 2
status: draft
stem:
  en: You need to create the User VPN configuration of vwan-wingtip for the remote staff. The solution must meet the remote access requirements. How should you configure the User VPN configuration?
  fr: Vous devez créer la configuration de VPN utilisateur de vwan-wingtip pour le personnel à distance. La solution doit respecter les exigences d'accès à distance. Comment devez-vous configurer la configuration de VPN utilisateur ?
body:
  options:
    - { id: a, text: { en: "Tunnel type IKEv2, Microsoft Entra ID authentication, and the native VPN client of each operating system", fr: "Type de tunnel IKEv2, authentification Microsoft Entra ID et client VPN natif de chaque système d'exploitation" } }
    - { id: b, text: { en: "Tunnel type OpenVPN, Microsoft Entra ID authentication, and the Azure VPN Client on each laptop", fr: "Type de tunnel OpenVPN, authentification Microsoft Entra ID et Azure VPN Client sur chaque ordinateur portable" } }
    - { id: c, text: { en: "Tunnel type IKEv2 and OpenVPN, Azure certificate authentication, and the Azure VPN Client on each laptop", fr: "Type de tunnel IKEv2 et OpenVPN, authentification par certificat Azure et Azure VPN Client sur chaque ordinateur portable" } }
    - { id: d, text: { en: "Tunnel type IKEv2, RADIUS authentication, and the native VPN client of each operating system", fr: "Type de tunnel IKEv2, authentification RADIUS et client VPN natif de chaque système d'exploitation" } }
answer: { optionId: b }
explanation:
  correct:
    en: Signing in with Microsoft Entra accounts, which lets Conditional Access apply, requires Microsoft Entra ID authentication. In Virtual WAN, Microsoft Entra ID authentication is available only with the OpenVPN tunnel type and the Azure VPN Client, which supports Windows and macOS.
    fr: Se connecter avec un compte Microsoft Entra, ce qui permet l'application de l'accès conditionnel, exige l'authentification Microsoft Entra ID. Dans Virtual WAN, l'authentification Microsoft Entra ID n'est disponible qu'avec le type de tunnel OpenVPN et l'Azure VPN Client, qui prend en charge Windows et macOS.
  options:
    a:
      en: Microsoft Entra ID authentication is available only for gateways that use the OpenVPN tunnel type, not IKEv2.
      fr: L'authentification Microsoft Entra ID n'est disponible que pour les passerelles qui utilisent le type de tunnel OpenVPN, pas IKEv2.
    c:
      en: Certificate authentication validates a client certificate, not the user's Microsoft Entra account, so Conditional Access doesn't apply to the sign-in.
      fr: L'authentification par certificat valide un certificat client, pas le compte Microsoft Entra de l'utilisateur ; l'accès conditionnel ne s'applique donc pas à la connexion.
    d:
      en: RADIUS authentication delegates the sign-in to a RADIUS server, usually with Active Directory credentials, so the Microsoft Entra Conditional Access policies don't evaluate the VPN sign-in.
      fr: L'authentification RADIUS délègue la connexion à un serveur RADIUS, généralement avec des identifiants Active Directory ; les stratégies d'accès conditionnel Microsoft Entra n'évaluent donc pas la connexion VPN.
references:
  - title: Configure P2S User VPN gateway for Microsoft Entra ID authentication – manually registered app
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-point-to-site-azure-ad
