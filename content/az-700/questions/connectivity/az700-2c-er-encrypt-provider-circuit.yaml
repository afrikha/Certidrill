id: az700-2c-er-encrypt-provider-circuit
objective: "2.3.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a 1 Gbps ExpressRoute circuit ordered from a connectivity provider. Azure private peering connects the on-premises datacenter to a virtual network named **VNet-Prod**.

    A new compliance rule requires that all traffic between the datacenter and VNet-Prod be encrypted end to end. The traffic must keep using the ExpressRoute circuit and must not use public IP addresses.

    What should you configure?
  fr: |
    Northwind Traders dispose d'un circuit ExpressRoute de 1 Gbit/s commandé auprès d'un fournisseur de connectivité. Le peering privé Azure relie le centre de données local à un réseau virtuel nommé **VNet-Prod**.

    Une nouvelle règle de conformité exige que tout le trafic entre le centre de données et VNet-Prod soit chiffré de bout en bout. Le trafic doit continuer d'emprunter le circuit ExpressRoute et ne doit pas utiliser d'adresses IP publiques.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "An IPsec site-to-site VPN tunnel over the private peering", fr: "Un tunnel VPN de site à site IPsec sur le peering privé" } }
    - { id: b, text: { en: "MACsec encryption on the physical links of the circuit", fr: "Le chiffrement MACsec sur les liaisons physiques du circuit" } }
    - { id: c, text: { en: "FastPath on the connection of the ExpressRoute gateway", fr: "FastPath sur la connexion de la passerelle ExpressRoute" } }
    - { id: d, text: { en: "ExpressRoute Global Reach with a second circuit", fr: "ExpressRoute Global Reach avec un second circuit" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      ExpressRoute traffic isn't encrypted by default. On a provider circuit, end-to-end encryption is an IPsec site-to-site VPN that runs over the private peering, with the VPN gateway's private IP address (Gateway Private IPs) as the tunnel endpoint, so no public address is used.
    fr: |
      Le trafic ExpressRoute n'est pas chiffré par défaut. Sur un circuit de fournisseur, le chiffrement de bout en bout est un VPN de site à site IPsec qui passe par le peering privé, avec l'adresse IP privée de la passerelle VPN (Gateway Private IPs) comme extrémité du tunnel : aucune adresse publique n'est utilisée.
  options:
    b: { en: "MACsec is available only on ExpressRoute Direct ports, not on circuits ordered from a provider, and it encrypts the physical links only, not end to end.", fr: "MACsec n'est disponible que sur les ports ExpressRoute Direct, pas sur les circuits commandés auprès d'un fournisseur, et il ne chiffre que les liaisons physiques, pas de bout en bout." }
    c: { en: "FastPath improves performance by bypassing the gateway in the data path; it doesn't encrypt anything.", fr: "FastPath améliore les performances en contournant la passerelle dans le chemin des données ; il ne chiffre rien." }
    d: { en: "Global Reach connects on-premises sites through their circuits; it adds no encryption.", fr: "Global Reach relie des sites locaux par leurs circuits ; il n'ajoute aucun chiffrement." }
references:
  - title: About encryption for Azure ExpressRoute
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-encryption
  - title: Configure a Site-to-Site VPN connection over ExpressRoute private peering
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/site-to-site-vpn-private-peering
