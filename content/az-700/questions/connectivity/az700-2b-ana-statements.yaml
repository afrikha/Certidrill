id: az700-2b-ana-statements
objective: "2.2.9"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a virtual network named **VNet1** with the address space 10.20.0.0/16. VNet1 has no virtual network gateway. The on-premises network uses 192.168.0.0/16.

    An administrator plans to connect an on-premises server named **SRV1** to VNet1 by using Azure Network Adapter in Windows Admin Center.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un réseau virtuel nommé **VNet1** avec l'espace d'adressage 10.20.0.0/16. VNet1 n'a pas de passerelle de réseau virtuel. Le réseau local utilise 192.168.0.0/16.

    Un administrateur prévoit de connecter un serveur local nommé **SRV1** à VNet1 avec Azure Network Adapter (Carte réseau Azure) dans Windows Admin Center.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Windows Admin Center can create the VPN gateway in VNet1 as part of adding the Azure Network Adapter.
        fr: Windows Admin Center peut créer la passerelle VPN dans VNet1 lors de l'ajout de la carte réseau Azure.
    - id: s2
      text:
        en: The administrator can use 10.20.250.0/24 as the client address space.
        fr: L'administrateur peut utiliser 10.20.250.0/24 comme espace d'adressage client.
    - id: s3
      text:
        en: SRV1 authenticates to the gateway with a client certificate issued from a root certificate whose public key is uploaded to Azure.
        fr: SRV1 s'authentifie auprès de la passerelle avec un certificat client émis par un certificat racine dont la clé publique est chargée dans Azure.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: When the virtual network has no gateway, Windows Admin Center creates the gateway subnet and the VPN gateway, which can take up to 25 minutes. The client address space must not overlap the target virtual network or the on-premises network, and 10.20.250.0/24 is inside VNet1's 10.20.0.0/16. Azure Network Adapter uses certificate authentication; the root public key is trusted by Azure and the client certificate is installed on the server.
    fr: "Quand le réseau virtuel n'a pas de passerelle, Windows Admin Center crée le sous-réseau de passerelle et la passerelle VPN, ce qui peut prendre jusqu'à 25 minutes. L'espace d'adressage client ne doit chevaucher ni le réseau virtuel cible ni le réseau local, et 10.20.250.0/24 fait partie de 10.20.0.0/16, l'espace de VNet1. Azure Network Adapter utilise l'authentification par certificat : la clé publique racine est approuvée par Azure et le certificat client est installé sur le serveur."
references:
  - title: Connect server to Azure Virtual Network - Azure Network Adapter
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/azure/use-azure-network-adapter
