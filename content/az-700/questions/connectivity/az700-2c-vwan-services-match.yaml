id: az700-2c-vwan-services-match
objective: "2.4.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware is designing a virtual hub in a Standard virtual WAN. The hub must meet the requirements in the answer area.

    Which hub resource should you include for each requirement? To answer, drag the appropriate resources to the correct requirements. Each resource may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware conçoit un hub virtuel dans un réseau étendu virtuel Standard. Le hub doit répondre aux exigences de la zone de réponse.

    Quelle ressource du hub devez-vous inclure pour chaque exigence ? Pour répondre, faites glisser les ressources appropriées vers les exigences correspondantes. Chaque ressource peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: s2s, text: { en: "Site-to-site VPN gateway", fr: "Passerelle VPN de site à site" } }
    - { id: p2s, text: { en: "User VPN (point-to-site) gateway", fr: "Passerelle VPN utilisateur (point à site)" } }
    - { id: er, text: { en: "ExpressRoute gateway", fr: "Passerelle ExpressRoute" } }
    - { id: fw, text: { en: "Azure Firewall", fr: "Pare-feu Azure" } }
    - { id: vnetconn, text: { en: "Hub virtual network connection", fr: "Connexion de réseau virtuel du hub" } }
  targets:
    - id: t1
      text: { en: "Connect 120 retail stores that each have an IPsec-capable router", fr: "Connecter 120 magasins équipés chacun d'un routeur compatible IPsec" }
    - id: t2
      text: { en: "Connect the laptops of 800 sales representatives by using the OpenVPN protocol", fr: "Connecter les ordinateurs portables de 800 commerciaux avec le protocole OpenVPN" }
    - id: t3
      text: { en: "Connect the headquarters through a private circuit from a connectivity provider", fr: "Connecter le siège par un circuit privé d'un fournisseur de connectivité" }
    - id: t4
      text: { en: "Inspect and filter internet-bound traffic from the spoke virtual networks in the hub", fr: "Inspecter et filtrer dans le hub le trafic à destination d'Internet issu des réseaux virtuels spoke" }
answer:
  mapping: { t1: s2s, t2: p2s, t3: er, t4: fw }
explanation:
  correct:
    en: |
      Branch sites with IPsec devices use the site-to-site VPN gateway, remote users use the User VPN (point-to-site) gateway, and a provider circuit uses the ExpressRoute gateway. Azure Firewall deployed in the hub (a secured virtual hub) inspects internet-bound traffic from the spokes. A hub virtual network connection only attaches a spoke to the hub; it doesn't inspect traffic.
    fr: |
      Les sites de branche équipés de périphériques IPsec utilisent la passerelle VPN de site à site, les utilisateurs nomades la passerelle VPN utilisateur (point à site) et un circuit de fournisseur la passerelle ExpressRoute. Le Pare-feu Azure déployé dans le hub (hub virtuel sécurisé) inspecte le trafic Internet des spokes. Une connexion de réseau virtuel du hub ne fait que rattacher un spoke au hub ; elle n'inspecte pas le trafic.
references:
  - title: What is Azure Virtual WAN?
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-about
