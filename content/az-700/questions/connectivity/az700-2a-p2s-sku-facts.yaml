id: az700-2a-p2s-sku-facts
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is choosing a VPN gateway configuration that will serve both site-to-site connections and point-to-site users.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys choisit une configuration de passerelle VPN qui servira à la fois des connexions de site à site et des utilisateurs de point à site.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An active-active gateway with point-to-site enabled requires three public IP addresses.", fr: "Une passerelle actif/actif avec le point à site activé exige trois adresses IP publiques." } }
    - { id: b, text: { en: "The Basic SKU supports RADIUS authentication for point-to-site users.", fr: "La référence Basic prend en charge l'authentification RADIUS pour les utilisateurs de point à site." } }
    - { id: c, text: { en: "The Basic SKU supports point-to-site connections that use IKEv2.", fr: "La référence Basic prend en charge les connexions de point à site qui utilisent IKEv2." } }
    - { id: d, text: { en: "A policy-based gateway supports point-to-site when it uses a VpnGw SKU.", fr: "Une passerelle basée sur des stratégies prend en charge le point à site quand elle utilise une référence VpnGw." } }
    - { id: e, text: { en: "Many point-to-site connections have no effect on the throughput available to site-to-site connections.", fr: "De nombreuses connexions de point à site n'ont aucun effet sur le débit disponible pour les connexions de site à site." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Each instance of an active-active gateway has its own public IP address, and point-to-site needs a third one for its endpoint. The Basic SKU supports IKEv2 for point-to-site, but neither RADIUS nor OpenVPN.
    fr: |
      Chaque instance d'une passerelle actif/actif a sa propre adresse IP publique, et le point à site en exige une troisième pour son point de terminaison. La référence Basic prend en charge IKEv2 pour le point à site, mais ni RADIUS ni OpenVPN.
  options:
    b: { en: "The Basic SKU doesn't support RADIUS authentication.", fr: "La référence Basic ne prend pas en charge l'authentification RADIUS." }
    d: { en: "Policy-based gateways exist only with the Basic SKU and never support point-to-site; point-to-site requires a route-based gateway.", fr: "Les passerelles basées sur des stratégies n'existent qu'en référence Basic et ne prennent jamais en charge le point à site ; celui-ci exige une passerelle basée sur des itinéraires." }
    e: { en: "All tunnels share the gateway bandwidth; numerous point-to-site connections can reduce site-to-site performance.", fr: "Tous les tunnels partagent la bande passante de la passerelle ; de nombreuses connexions de point à site peuvent réduire les performances de site à site." }
references:
  - title: About active-active mode VPN gateways
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-active-active-gateways
  - title: About gateway SKUs
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-gateway-skus
