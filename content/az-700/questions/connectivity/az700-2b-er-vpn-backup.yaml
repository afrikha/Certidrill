id: az700-2b-er-vpn-backup
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has a virtual network named **VNet1** that contains an ExpressRoute gateway named **ERGW1** (SKU ErGw1AZ). ERGW1 is deployed in GatewaySubnet (10.1.255.0/27) and connected to an ExpressRoute circuit through Azure private peering. The on-premises edge routers also have an internet connection.

    You need to add a site-to-site VPN connection that takes over if the ExpressRoute circuit fails. Traffic must not become asymmetric while the circuit is healthy.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un réseau virtuel nommé **VNet1** qui contient une passerelle ExpressRoute nommée **ERGW1** (référence SKU ErGw1AZ). ERGW1 est déployée dans GatewaySubnet (10.1.255.0/27) et connectée à un circuit ExpressRoute par le peering privé Azure. Les routeurs de périphérie locaux disposent aussi d'une connexion Internet.

    Vous devez ajouter une connexion VPN de site à site qui prenne le relais en cas de défaillance du circuit ExpressRoute. Le trafic ne doit pas devenir asymétrique tant que le circuit fonctionne.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deploy a policy-based VPN gateway in a new subnet named VpnGatewaySubnet.", fr: "Déployer une passerelle VPN basée sur des stratégies dans un nouveau sous-réseau nommé VpnGatewaySubnet." } }
    - { id: b, text: { en: "Deploy a route-based VPN gateway with the VpnGw1AZ SKU in GatewaySubnet.", fr: "Déployer une passerelle VPN basée sur des routes de référence SKU VpnGw1AZ dans GatewaySubnet." } }
    - { id: c, text: { en: "Configure Microsoft peering on the circuit for the VPN traffic.", fr: "Configurer le peering Microsoft sur le circuit pour le trafic VPN." } }
    - { id: e, text: { en: "Set a higher routing weight on the site-to-site VPN connection than on the ExpressRoute connection.", fr: "Définir un poids de routage plus élevé sur la connexion VPN de site à site que sur la connexion ExpressRoute." } }
    - { id: d, text: { en: "Set a higher local preference on the on-premises routers for routes received over ExpressRoute.", fr: "Définir une préférence locale plus élevée sur les routeurs locaux pour les routes reçues par ExpressRoute." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: A VPN gateway that coexists with an ExpressRoute gateway must be route-based, can't use the Basic SKU, and shares the same GatewaySubnet, which must be /27 or larger. Azure already prefers ExpressRoute over the VPN for the same prefix, so on-premises must prefer it too, with a higher local preference for the routes learned over ExpressRoute.
    fr: "Une passerelle VPN qui coexiste avec une passerelle ExpressRoute doit être basée sur des routes, ne peut pas utiliser la référence SKU Basic et partage le même GatewaySubnet, qui doit être en /27 ou plus grand. Azure préfère déjà ExpressRoute au VPN pour un même préfixe : le réseau local doit aussi le préférer, avec une préférence locale plus élevée pour les routes apprises par ExpressRoute."
  options:
    a: { en: "Coexistence requires a route-based VPN gateway, and every gateway of a virtual network goes in the subnet named GatewaySubnet.", fr: "La coexistence exige une passerelle VPN basée sur des routes, et toutes les passerelles d'un réseau virtuel vont dans le sous-réseau nommé GatewaySubnet." }
    c: { en: "The backup VPN runs over the internet; it doesn't need Microsoft peering.", fr: "Le VPN de secours passe par Internet ; il n'a pas besoin du peering Microsoft." }
    e: { en: "Making the VPN preferred would send traffic over the internet while the circuit is healthy, the opposite of a backup.", fr: "Rendre le VPN prioritaire enverrait le trafic par Internet alors que le circuit fonctionne, l'inverse d'un secours." }
references:
  - title: Configure ExpressRoute and S2S VPN coexisting connections with Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-coexist-resource-manager
