id: az700-2c-er-test-private-peering
objective: "2.3.13"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has an ExpressRoute circuit named **ER-Tail** with Azure private peering. A virtual machine named **VM1** (10.1.0.4) in a linked virtual network doesn't respond to an on-premises server named **SRV1** (10.40.1.10).

    You run **Test private-peering connectivity** from **Diagnose and solve problems** on ER-Tail while PsPing runs from SRV1 to VM1. The results are:

    | MSEE | Matches for traffic received from on-premises | Matches for traffic sent to on-premises |
    | --- | --- | --- |
    | Primary | Yes | No |
    | Secondary | Yes | No |

    What should you investigate next?
  fr: |
    Tailspin dispose d'un circuit ExpressRoute nommé **ER-Tail** avec le peering privé Azure. Une machine virtuelle nommée **VM1** (10.1.0.4) d'un réseau virtuel lié ne répond pas à un serveur local nommé **SRV1** (10.40.1.10).

    Vous exécutez **Tester la connectivité du peering privé** depuis **Diagnostiquer et résoudre les problèmes** sur ER-Tail pendant que PsPing s'exécute de SRV1 vers VM1. Les résultats sont les suivants :

    | MSEE | Correspondances pour le trafic reçu du réseau local | Correspondances pour le trafic envoyé vers le réseau local |
    | --- | --- | --- |
    | Principal | Oui | Non |
    | Secondaire | Oui | Non |

    Que devez-vous examiner ensuite ?
body:
  options:
    - { id: a, text: { en: "The VLAN tags configured by the connectivity provider", fr: "Les étiquettes VLAN configurées par le fournisseur de connectivité" } }
    - { id: b, text: { en: "The ARP table of the secondary path of ER-Tail", fr: "La table ARP du chemin secondaire d'ER-Tail" } }
    - { id: c, text: { en: "The user-defined routes that apply to the subnet of VM1", fr: "Les itinéraires définis par l'utilisateur qui s'appliquent au sous-réseau de VM1" } }
    - { id: d, text: { en: "The provider status of ER-Tail", fr: "L'état du fournisseur d'ER-Tail" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Both MSEEs see the packets arriving from on-premises but never see the replies, so the problem is on the return path inside Azure. Check the prefixes advertised to Azure and whether a user-defined route on the subnet of VM1 (for example, a default route to an NVA) overrides the route learned over ExpressRoute.
    fr: |
      Les deux MSEE voient les paquets arriver du réseau local mais ne voient jamais les réponses : le problème se trouve sur le chemin de retour dans Azure. Vérifiez les préfixes publiés vers Azure et si un itinéraire défini par l'utilisateur sur le sous-réseau de VM1 (par exemple, une route par défaut vers une NVA) remplace la route apprise par ExpressRoute.
  options:
    a: { en: "Traffic reaches both MSEEs from on-premises, so the provider's layer 2 path works in that direction.", fr: "Le trafic du réseau local atteint les deux MSEE : le chemin de couche 2 du fournisseur fonctionne dans ce sens." }
    b: { en: "Matches on the secondary MSEE prove that the secondary path is up at layer 2.", fr: "Les correspondances sur le MSEE secondaire prouvent que le chemin secondaire est opérationnel en couche 2." }
    d: { en: "A circuit that isn't provisioned carries no traffic at all, whereas here packets reach both MSEEs.", fr: "Un circuit non approvisionné ne transporte aucun trafic, alors qu'ici les paquets atteignent les deux MSEE." }
references:
  - title: Verify Azure ExpressRoute connectivity
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-troubleshooting-expressroute-overview
