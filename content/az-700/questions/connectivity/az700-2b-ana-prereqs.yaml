id: az700-2b-ana-prereqs
objective: "2.2.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has a branch office that contains a Windows Server 2022 server named **SRV1**. SRV1 has internet access. The branch office has no VPN device and no public IP address. Tailspin has an Azure subscription, but no virtual network has been created yet. Windows Admin Center runs on a management server at headquarters and manages SRV1.

    You plan to use Azure Network Adapter to connect SRV1 to a new Azure virtual network named **VNet1**.

    Which two actions should you perform before you add the Azure Network Adapter to SRV1? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'une succursale qui contient un serveur Windows Server 2022 nommé **SRV1**. SRV1 a accès à Internet. La succursale n'a ni périphérique VPN ni adresse IP publique. Tailspin dispose d'un abonnement Azure, mais aucun réseau virtuel n'a encore été créé. Windows Admin Center s'exécute sur un serveur d'administration du siège et gère SRV1.

    Vous prévoyez d'utiliser Azure Network Adapter (Carte réseau Azure) pour connecter SRV1 à un nouveau réseau virtuel Azure nommé **VNet1**.

    Quelles sont les deux actions à effectuer avant d'ajouter la carte réseau Azure à SRV1 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create VNet1 in the Azure subscription.", fr: "Créer VNet1 dans l'abonnement Azure." } }
    - { id: b, text: { en: "Create a VPN gateway in VNet1.", fr: "Créer une passerelle VPN dans VNet1." } }
    - { id: c, text: { en: "Register Windows Admin Center with Azure.", fr: "Inscrire Windows Admin Center auprès d'Azure." } }
    - { id: d, text: { en: "Assign a public IP address to SRV1.", fr: "Attribuer une adresse IP publique à SRV1." } }
    - { id: e, text: { en: "Install Windows Admin Center on SRV1.", fr: "Installer Windows Admin Center sur SRV1." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Azure Network Adapter connects a server to an existing virtual network, so VNet1 must be created first. Windows Admin Center must also be connected (registered) to Azure, because it creates the Azure resources and configures the point-to-site VPN on SRV1.
    fr: "Azure Network Adapter connecte un serveur à un réseau virtuel existant : VNet1 doit donc être créé d'abord. Windows Admin Center doit aussi être connecté (inscrit) à Azure, car il crée les ressources Azure et configure le VPN de point à site sur SRV1."
  options:
    b: { en: "If the virtual network has no gateway, Windows Admin Center creates the gateway subnet and the VPN gateway for you.", fr: "Si le réseau virtuel n'a pas de passerelle, Windows Admin Center crée pour vous le sous-réseau de passerelle et la passerelle VPN." }
    d: { en: "Azure Network Adapter uses a point-to-site VPN initiated by the server; it doesn't need a public IP address.", fr: "Azure Network Adapter utilise un VPN de point à site initié par le serveur ; il n'a pas besoin d'adresse IP publique." }
    e: { en: "Windows Admin Center doesn't have to run on the server being connected; it can manage SRV1 remotely.", fr: "Windows Admin Center n'a pas besoin de s'exécuter sur le serveur connecté ; il peut gérer SRV1 à distance." }
references:
  - title: Connect server to Azure Virtual Network - Azure Network Adapter
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/azure/use-azure-network-adapter
