id: az700-2c-er-bfd-statements
objective: "2.3.12"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has the following ExpressRoute circuits:

    | Circuit | Peering | Date the peering was configured |
    | --- | --- | --- |
    | ER-Lyon | IPv4 Azure private peering | March 2017 |
    | ER-Lille | IPv4 Azure private peering | March 2025 |

    Fabrikam plans to use Bidirectional Forwarding Detection (BFD) on both circuits.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose des circuits ExpressRoute suivants :

    | Circuit | Peering | Date de configuration du peering |
    | --- | --- | --- |
    | ER-Lyon | Peering privé Azure IPv4 | Mars 2017 |
    | ER-Lille | Peering privé Azure IPv4 | Mars 2025 |

    Fabrikam prévoit d'utiliser la détection de transfert bidirectionnel (BFD) sur les deux circuits.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          BFD is already configured on the Microsoft Enterprise Edge (MSEE) interfaces of the ER-Lille private peering.
        fr: |
          BFD est déjà configuré sur les interfaces MSEE (Microsoft Enterprise Edge) du peering privé d'ER-Lille.
    - id: s2
      text:
        en: |
          If you set a BFD interval of 100 ms on the Fabrikam routers, failures on ER-Lille are detected faster than with an interval of 300 ms.
        fr: |
          Si vous réglez un intervalle BFD de 100 ms sur les routeurs de Fabrikam, les pannes d'ER-Lille sont détectées plus vite qu'avec un intervalle de 300 ms.
    - id: s3
      text:
        en: |
          To use BFD on ER-Lyon, you must reset the private peering of the circuit.
        fr: |
          Pour utiliser BFD sur ER-Lyon, vous devez réinitialiser le peering privé du circuit.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      BFD is configured by default on the MSEE interfaces of IPv4 private peerings created after August 2018, so ER-Lille has it on the Microsoft side. The MSEEs use a 300 ms interval and the slower peer sets the rate, so you can make the interval longer but not shorter. For a private peering created before August 2018, such as ER-Lyon, you reset the peering to enable BFD on the MSEEs.
    fr: |
      BFD est configuré par défaut sur les interfaces MSEE des peerings privés IPv4 créés après août 2018 : ER-Lille en dispose donc côté Microsoft. Les MSEE utilisent un intervalle de 300 ms et l'homologue le plus lent fixe la cadence : vous pouvez allonger l'intervalle, pas le raccourcir. Pour un peering privé créé avant août 2018, comme celui d'ER-Lyon, vous réinitialisez le peering pour activer BFD sur les MSEE.
references:
  - title: Configure BFD over ExpressRoute
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-bfd
