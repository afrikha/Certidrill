id: az700-2b-er-peering-private-paas
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has an ExpressRoute circuit named **CKT1** with only Azure private peering configured. CKT1 is linked to a virtual network named **VNet1** in West Europe. Woodgrove has no registered public IP prefixes.

    On-premises applications must access a storage account named **stwoodgrove** in West Europe over ExpressRoute. The security team will disable public network access on stwoodgrove.

    You need to recommend a solution that meets the requirements. What should you recommend?
  fr: |
    Woodgrove dispose d'un circuit ExpressRoute nommé **CKT1** sur lequel seul le peering privé Azure est configuré. CKT1 est lié à un réseau virtuel nommé **VNet1** dans la région West Europe. Woodgrove ne possède aucun préfixe d'adresses IP publiques enregistré.

    Des applications locales doivent accéder à un compte de stockage nommé **stwoodgrove** dans West Europe par ExpressRoute. L'équipe de sécurité désactivera l'accès au réseau public sur stwoodgrove.

    Vous devez recommander une solution qui répond aux exigences. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Configure Microsoft peering on CKT1 with a route filter for the West Europe region.", fr: "Configurer le peering Microsoft sur CKT1 avec un filtre de routage pour la région West Europe." } }
    - { id: b, text: { en: "Create a private endpoint for stwoodgrove in VNet1 and resolve its name to the private IP address.", fr: "Créer un point de terminaison privé pour stwoodgrove dans VNet1 et résoudre son nom en l'adresse IP privée." } }
    - { id: c, text: { en: "Enable a service endpoint for Microsoft.Storage on GatewaySubnet of VNet1.", fr: "Activer un point de terminaison de service pour Microsoft.Storage sur GatewaySubnet de VNet1." } }
    - { id: d, text: { en: "Enable a service endpoint on a subnet of VNet1 and allow that subnet on stwoodgrove.", fr: "Activer un point de terminaison de service sur un sous-réseau de VNet1 et autoriser ce sous-réseau sur stwoodgrove." } }
answer: { optionId: b }
explanation:
  correct:
    en: A private endpoint gives stwoodgrove a private IP address in VNet1, which on-premises clients reach over Azure private peering, so public network access can be disabled. On-premises DNS must resolve the storage account name to that private IP address, for example through a DNS Private Resolver inbound endpoint.
    fr: "Un point de terminaison privé donne à stwoodgrove une adresse IP privée dans VNet1, que les clients locaux atteignent par le peering privé Azure : l'accès au réseau public peut donc être désactivé. Le DNS local doit résoudre le nom du compte de stockage en cette adresse IP privée, par exemple par un point de terminaison entrant de DNS Private Resolver."
  options:
    a: { en: "Microsoft peering reaches the public endpoint, which will be disabled, and it needs public prefixes that Woodgrove doesn't have.", fr: "Le peering Microsoft atteint le point de terminaison public, qui sera désactivé, et il exige des préfixes publics dont Woodgrove ne dispose pas." }
    c: { en: "Service endpoints secure traffic from Azure subnets to the public endpoint; they don't apply to on-premises traffic.", fr: "Les points de terminaison de service sécurisent le trafic des sous-réseaux Azure vers le point de terminaison public ; ils ne s'appliquent pas au trafic local." }
    d: { en: "A service endpoint still uses the public endpoint and only covers traffic that originates in the subnet, not on-premises clients.", fr: "Un point de terminaison de service utilise toujours le point de terminaison public et ne couvre que le trafic issu du sous-réseau, pas les clients locaux." }
references:
  - title: "Azure ExpressRoute: circuits and peering"
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-circuit-peerings
  - title: "Azure ExpressRoute: Routing requirements"
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-routing
