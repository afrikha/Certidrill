id: az700-2c-er-macsec-facts
objective: "2.3.11"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a pair of 10 Gbps ExpressRoute Direct ports named **ERD-Paris**. Two circuits are provisioned on the ports. The security team asks you to enable MACsec on ERD-Paris.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'une paire de ports ExpressRoute Direct de 10 Gbit/s nommée **ERD-Paris**. Deux circuits sont approvisionnés sur les ports. L'équipe de sécurité vous demande d'activer MACsec sur ERD-Paris.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "If the keys don't match on a link, traffic on that link falls back to unencrypted transmission.", fr: "Si les clés ne correspondent pas sur une liaison, le trafic de cette liaison repasse en transmission non chiffrée." } }
    - { id: b, text: { en: "Once MACsec is enabled, the BGP control traffic on the ports is encrypted as well as the customer data.", fr: "Une fois MACsec activé, le trafic de contrôle BGP des ports est chiffré, tout comme les données client." } }
    - { id: c, text: { en: "MACsec is enabled by default when the ExpressRoute Direct ports are provisioned.", fr: "MACsec est activé par défaut lors de l'approvisionnement des ports ExpressRoute Direct." } }
    - { id: d, text: { en: "You store the MACsec key in Azure Key Vault and decide when to rotate it.", fr: "Vous stockez la clé MACsec dans Azure Key Vault et décidez du moment de son renouvellement." } }
    - { id: e, text: { en: "You can encrypt one of the two circuits on the ports and leave the other circuit unencrypted.", fr: "Vous pouvez chiffrer l'un des deux circuits des ports et laisser l'autre circuit non chiffré." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      MACsec on ExpressRoute Direct uses a pre-shared key that you bring, store in Azure Key Vault and rotate when you decide. It encrypts everything on the physical link, network control traffic such as BGP included.
    fr: |
      MACsec sur ExpressRoute Direct utilise une clé prépartagée que vous fournissez, stockez dans Azure Key Vault et renouvelez quand vous le décidez. Il chiffre tout ce qui passe sur la liaison physique, y compris le trafic de contrôle réseau comme BGP.
  options:
    a: { en: "There is no fallback to clear text: a key mismatch causes a loss of connectivity, which is why keys are updated one link at a time.", fr: "Il n'y a pas de repli en clair : une incohérence de clés entraîne une perte de connectivité, d'où la mise à jour des clés une liaison à la fois." }
    c: { en: "MACsec is disabled on ExpressRoute Direct ports by default.", fr: "MACsec est désactivé par défaut sur les ports ExpressRoute Direct." }
    e: { en: "MACsec applies to the whole physical port; partial encryption of some circuits isn't possible.", fr: "MACsec s'applique à l'ensemble du port physique ; le chiffrement partiel de certains circuits est impossible." }
references:
  - title: About encryption for Azure ExpressRoute
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-encryption
  - title: Configure MACsec on ExpressRoute Direct ports
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-macsec
