id: az700-cs4b-feed-fastpath
objective: "2.3.4"
type: single
caseStudy: az700-cs4b-fernhill
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the connectivity requirement for the market feeds. The solution must minimize costs. What should you do?
  fr: |
    Vous devez respecter l'exigence de connectivité relative aux flux de cotations. La solution doit réduire les coûts au minimum. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable FastPath on the two connections of ERGW-Feed", fr: "Activer FastPath sur les deux connexions d'ERGW-Feed" } }
    - { id: b, text: { en: "Resize ERGW-Feed to ErGw2Az, and then enable FastPath on its two connections", fr: "Redimensionner ERGW-Feed en ErGw2Az, puis activer FastPath sur ses deux connexions" } }
    - { id: c, text: { en: "Resize ERGW-Feed to ErGw3Az, and then enable FastPath on its two connections", fr: "Redimensionner ERGW-Feed en ErGw3Az, puis activer FastPath sur ses deux connexions" } }
    - { id: d, text: { en: "Upgrade ER-Paris and ER-London to Premium, and then enable FastPath on the connections of ERGW-Feed", fr: "Mettre à niveau ER-Paris et ER-London vers Premium, puis activer FastPath sur les connexions d'ERGW-Feed" } }
answer: { optionId: c }
explanation:
  correct:
    en: FastPath sends the on-premises traffic directly to the virtual machines and bypasses the gateway in the data path; the gateway is still needed to exchange routes. It requires an Ultra Performance, ErGw3Az or ErGwScale (at least 10 scale units) gateway. ErGw1Az can be upgraded in place to ErGw3Az because both SKUs are zone-redundant, and FastPath is then enabled with the FastPath setting of each connection. VM-FEED1 to VM-FEED4 are in the virtual network of the gateway, so provider circuits are enough.
    fr: |
      FastPath envoie le trafic local directement aux machines virtuelles et contourne la passerelle dans le chemin des données ; la passerelle reste nécessaire pour échanger les routes. Il exige une passerelle Ultra Performance, ErGw3Az ou ErGwScale (au moins 10 unités d'échelle). ErGw1Az peut être mise à niveau sur place en ErGw3Az, car les deux SKU sont redondants interzones, puis FastPath est activé avec le paramètre FastPath de chaque connexion. VM-FEED1 à VM-FEED4 sont dans le réseau virtuel de la passerelle : des circuits de fournisseur suffisent.
  options:
    a: { en: "FastPath can't be enabled on an ErGw1Az gateway.", fr: "FastPath ne peut pas être activé sur une passerelle ErGw1Az." }
    b: { en: "ErGw2Az (High Performance) doesn't support FastPath either.", fr: "ErGw2Az (High Performance) ne prend pas non plus en charge FastPath." }
    d: { en: "The circuit SKU doesn't enable FastPath, which depends on the gateway SKU; Premium adds cost, and FastPath still couldn't be enabled on ErGw1Az.", fr: "Le SKU du circuit n'active pas FastPath, qui dépend du SKU de la passerelle ; Premium ajoute un coût, et FastPath ne pourrait toujours pas être activé sur ErGw1Az." }
references:
  - title: "Azure ExpressRoute FastPath: Features, availability, and limitations"
    url: https://learn.microsoft.com/en-us/azure/expressroute/about-fastpath
  - title: About ExpressRoute virtual network gateways
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-virtual-network-gateways
