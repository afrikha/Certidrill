id: az700-2a-vng-cli-create
objective: "2.1.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso needs a new gateway for site-to-site VPN connections in a virtual network named **VNet-Hub**. The gateway must meet the following requirements:

    - Zone redundancy
    - BGP, with the Azure-side autonomous system number 65020 (the on-premises routers use 65010)
    - An aggregate throughput benchmark of at least 1 Gbps
    - Minimize costs

    The public IP addresses GW-pip1 and GW-pip2 (Standard SKU, static) already exist.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso a besoin d'une nouvelle passerelle pour des connexions VPN de site à site dans un réseau virtuel nommé **VNet-Hub**. La passerelle doit respecter les exigences suivantes :

    - Redondance interzone
    - BGP, avec le numéro de système autonome 65020 côté Azure (les routeurs locaux utilisent 65010)
    - Un débit agrégé de référence d'au moins 1 Gbit/s
    - Réduire les coûts au minimum

    Les adresses IP publiques GW-pip1 et GW-pip2 (référence Standard, statiques) existent déjà.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network vnet-gateway create \
      --name GW-Hub \
      --resource-group RG-Hub \
      --vnet VNet-Hub \
      --public-ip-addresses GW-pip1 GW-pip2 \
      --gateway-type [[type]] \
      --vpn-type RouteBased \
      --sku [[sku]] \
      --vpn-gateway-generation Generation2 \
      [[bgp]]
  slots:
    - id: type
      options:
        - { id: vpn, text: Vpn }
        - { id: er, text: ExpressRoute }
        - { id: local, text: LocalGateway }
    - id: sku
      options:
        - { id: basic, text: Basic }
        - { id: gw1az, text: VpnGw1AZ }
        - { id: gw2, text: VpnGw2 }
        - { id: gw2az, text: VpnGw2AZ }
        - { id: gw3az, text: VpnGw3AZ }
    - id: bgp
      options:
        - { id: asn20, text: --asn 65020 }
        - { id: asn10, text: --asn 65010 }
        - { id: peer, text: --bgp-peering-address 65020 }
        - { id: weight, text: --peer-weight 65020 }
answer:
  values: { type: vpn, sku: gw2az, bgp: asn20 }
explanation:
  correct:
    en: |
      A VPN gateway uses `--gateway-type Vpn`. VpnGw2AZ in Generation2 is zone-redundant, supports BGP and has a 1.25 Gbps aggregate benchmark, which makes it the cheapest SKU that meets the requirements. `--asn` sets the Azure-side ASN, which must differ from the on-premises ASN.
    fr: |
      Une passerelle VPN utilise `--gateway-type Vpn`. VpnGw2AZ en Generation2 est redondante interzone, prend en charge BGP et offre un débit agrégé de référence de 1,25 Gbit/s : c'est la référence la moins chère qui répond aux exigences. `--asn` définit l'ASN côté Azure, qui doit être différent de l'ASN local.
  options:
    er: { en: "An ExpressRoute gateway terminates ExpressRoute circuits, not site-to-site VPN connections.", fr: "Une passerelle ExpressRoute termine des circuits ExpressRoute, pas des connexions VPN de site à site." }
    basic: { en: "Basic doesn't support BGP, isn't zone-redundant and is limited to 100 Mbps.", fr: "Basic ne prend pas en charge BGP, n'est pas redondante interzone et est limitée à 100 Mbit/s." }
    gw1az: { en: "VpnGw1AZ is a Generation1 SKU with a 650 Mbps benchmark.", fr: "VpnGw1AZ est une référence Generation1 avec un débit de référence de 650 Mbit/s." }
    gw2: { en: "Non-AZ SKUs can no longer be used to create new gateways and aren't zone-redundant.", fr: "Les références non AZ ne permettent plus de créer de nouvelles passerelles et ne sont pas redondantes interzones." }
    gw3az: { en: "VpnGw3AZ meets the requirements but costs more than VpnGw2AZ.", fr: "VpnGw3AZ répond aux exigences mais coûte plus cher que VpnGw2AZ." }
    asn10: { en: "65010 is the on-premises ASN; Azure and on-premises must use different ASNs.", fr: "65010 est l'ASN local ; Azure et le réseau local doivent utiliser des ASN différents." }
references:
  - title: Create a VPN gateway using CLI
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/create-routebased-vpn-gateway-cli
  - title: About gateway SKUs
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-gateway-skus
