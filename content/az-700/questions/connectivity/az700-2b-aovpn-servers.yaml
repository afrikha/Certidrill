id: az700-2b-aovpn-servers
objective: "2.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a route-based VPN gateway named **VPNGW1** configured for point-to-site connections with the tunnel type **IKEv2 and OpenVPN (SSL)** and Azure certificate authentication.

    You are writing the ProfileXML document of an Always On VPN user tunnel for Windows 11 computers. The `<Servers>` element must contain the name of the VPN gateway server.

    You download the VPN client profile package of VPNGW1. Which file contains the value to use?
  fr: |
    Fabrikam dispose d'une passerelle VPN basée sur des routes nommée **VPNGW1**, configurée pour les connexions de point à site avec le type de tunnel **IKEv2 et OpenVPN (SSL)** et l'authentification par certificat Azure.

    Vous rédigez le document ProfileXML d'un tunnel utilisateur VPN Always On pour des ordinateurs Windows 11. L'élément `<Servers>` doit contenir le nom du serveur de la passerelle VPN.

    Vous téléchargez le package de profil du client VPN de VPNGW1. Quel fichier contient la valeur à utiliser ?
body:
  options:
    - { id: a, text: { en: "azurevpnconfig_cert.xml in the AzureVPN folder", fr: "azurevpnconfig_cert.xml dans le dossier AzureVPN" } }
    - { id: b, text: { en: "VpnSettings.xml in the Generic folder", fr: "VpnSettings.xml dans le dossier Generic" } }
    - { id: c, text: { en: "vpnconfig.ovpn in the OpenVPN folder", fr: "vpnconfig.ovpn dans le dossier OpenVPN" } }
    - { id: d, text: { en: "VpnServerRoot.cer in the Generic folder", fr: "VpnServerRoot.cer dans le dossier Generic" } }
answer: { optionId: b }
explanation:
  correct:
    en: Always On VPN uses the built-in Windows IKEv2 client, configured through ProfileXML. The `<Servers>` value is the gateway name (azuregateway-…cloudapp.net) copied from VpnSettings.xml, which is in the Generic folder of the package when IKEv2 is configured on the gateway.
    fr: "Le VPN Always On utilise le client IKEv2 intégré à Windows, configuré par ProfileXML. La valeur de `<Servers>` est le nom de la passerelle (azuregateway-…cloudapp.net) copié depuis VpnSettings.xml, qui se trouve dans le dossier Generic du package quand IKEv2 est configuré sur la passerelle."
  options:
    a: { en: "The AzureVPN folder configures the Azure VPN Client over OpenVPN, which Always On VPN doesn't use.", fr: "Le dossier AzureVPN configure Azure VPN Client en OpenVPN, que le VPN Always On n'utilise pas." }
    c: { en: "vpnconfig.ovpn is the profile of an OpenVPN client, not of the built-in IKEv2 client.", fr: "vpnconfig.ovpn est le profil d'un client OpenVPN, pas du client IKEv2 intégré." }
    d: { en: "VpnServerRoot.cer is the root certificate the client uses to trust the gateway; it doesn't hold the server name to configure.", fr: "VpnServerRoot.cer est le certificat racine qui permet au client d'approuver la passerelle ; il ne contient pas le nom de serveur à configurer." }
references:
  - title: Configure an Always-On VPN user tunnel - Azure VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-howto-always-on-user-tunnel
