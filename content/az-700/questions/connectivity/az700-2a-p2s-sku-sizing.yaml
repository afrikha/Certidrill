id: az700-2a-p2s-sku-sizing
objective: "2.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank deploys a separate point-to-site VPN gateway for each of four business units. Each gateway must support the peak number of concurrent users shown, use a zone-redundant SKU, and minimize costs.

    Which SKU should you use for each business unit? To answer, drag the appropriate SKUs to the correct business units. Each SKU may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank déploie une passerelle VPN de point à site distincte pour chacune de quatre divisions. Chaque passerelle doit prendre en charge le pic d'utilisateurs simultanés indiqué, utiliser une référence redondante interzone et réduire les coûts au minimum.

    Quelle référence SKU devez-vous utiliser pour chaque division ? Pour répondre, faites glisser les références appropriées vers les divisions correspondantes. Chaque référence peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: gw1, text: VpnGw1AZ }
    - { id: gw2, text: VpnGw2AZ }
    - { id: gw3, text: VpnGw3AZ }
    - { id: gw4, text: VpnGw4AZ }
    - { id: gw5, text: VpnGw5AZ }
  targets:
    - id: t1
      text: { en: "Retail: 450 users over IKEv2", fr: "Commerce de détail : 450 utilisateurs en IKEv2" }
    - id: t2
      text: { en: "Markets: 200 users over OpenVPN", fr: "Marchés : 200 utilisateurs en OpenVPN" }
    - id: t3
      text: { en: "Operations: 4,000 users over IKEv2", fr: "Opérations : 4 000 utilisateurs en IKEv2" }
    - id: t4
      text: { en: "Group IT: 7,000 users over OpenVPN", fr: "DSI groupe : 7 000 utilisateurs en OpenVPN" }
answer:
  mapping: { t1: gw2, t2: gw1, t3: gw4, t4: gw5 }
explanation:
  correct:
    en: |
      The IKEv2/OpenVPN connection limits are 250 (VpnGw1AZ), 500 (VpnGw2AZ), 1,000 (VpnGw3AZ), 5,000 (VpnGw4AZ) and 10,000 (VpnGw5AZ). The cheapest SKU above each peak is VpnGw2AZ for 450, VpnGw1AZ for 200, VpnGw4AZ for 4,000 and VpnGw5AZ for 7,000. IKEv2 and OpenVPN share the same limit.
    fr: |
      Les limites de connexions IKEv2/OpenVPN sont de 250 (VpnGw1AZ), 500 (VpnGw2AZ), 1 000 (VpnGw3AZ), 5 000 (VpnGw4AZ) et 10 000 (VpnGw5AZ). La référence la moins chère au-dessus de chaque pic est VpnGw2AZ pour 450, VpnGw1AZ pour 200, VpnGw4AZ pour 4 000 et VpnGw5AZ pour 7 000. IKEv2 et OpenVPN partagent la même limite.
  options:
    gw3: { en: "VpnGw3AZ (1,000 connections) is never the cheapest fit for these peaks.", fr: "VpnGw3AZ (1 000 connexions) n'est jamais la référence la moins chère adaptée à ces pics." }
references:
  - title: About gateway SKUs
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-gateway-skus
