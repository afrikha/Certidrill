id: az700-2b-er-sku-changes
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip has an ExpressRoute circuit named **CKT1** with the following configuration:

    | Setting | Value |
    | --- | --- |
    | SKU | Premium, UnlimitedData |
    | Bandwidth | 2 Gbps |
    | Linked virtual networks | 6, all in the geopolitical area of the peering location |
    | IPv4 routes advertised on private peering | 2,500 |

    The provider port has enough spare capacity for any bandwidth up to 10 Gbps.

    Which two changes can you make to CKT1 without deleting and recreating the circuit?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip dispose d'un circuit ExpressRoute nommé **CKT1** dont la configuration est la suivante :

    | Paramètre | Valeur |
    | --- | --- |
    | Référence SKU | Premium, UnlimitedData |
    | Bande passante | 2 Gbit/s |
    | Réseaux virtuels liés | 6, tous dans la zone géopolitique de l'emplacement de peering |
    | Routes IPv4 publiées sur le peering privé | 2 500 |

    Le port du fournisseur dispose d'une capacité libre suffisante pour toute bande passante jusqu'à 10 Gbit/s.

    Quelles sont les deux modifications que vous pouvez apporter à CKT1 sans supprimer et recréer le circuit ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: b, text: { en: "Increase the bandwidth to 5 Gbps.", fr: "Augmenter la bande passante à 5 Gbit/s." } }
    - { id: a, text: { en: "Decrease the bandwidth to 1 Gbps.", fr: "Réduire la bande passante à 1 Gbit/s." } }
    - { id: c, text: { en: "Change the billing model to MeteredData.", fr: "Changer le modèle de facturation en MeteredData." } }
    - { id: d, text: { en: "Change the tier to Standard.", fr: "Changer le niveau en Standard." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Bandwidth can be increased in place when the port has capacity. Premium can be disabled because CKT1 already fits the Standard limits, with fewer than 10 linked virtual networks, all in the same geopolitical area, and fewer than 4,000 routes.
    fr: "La bande passante peut être augmentée sur place quand le port a de la capacité. Premium peut être désactivé, car CKT1 respecte déjà les limites Standard : moins de 10 réseaux virtuels liés, tous dans la même zone géopolitique, et moins de 4 000 routes."
  options:
    a: { en: "Bandwidth can't be decreased; a lower bandwidth requires a new circuit.", fr: "La bande passante ne peut pas être réduite ; une bande passante inférieure exige un nouveau circuit." }
    c: { en: "MeteredData can be changed to UnlimitedData, but not the reverse.", fr: "MeteredData peut passer à UnlimitedData, mais pas l'inverse." }
references:
  - title: "Quickstart: Create and modify an ExpressRoute circuit using Azure PowerShell"
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-circuit-arm
  - title: "Azure ExpressRoute: circuits and peering"
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-circuit-peerings
