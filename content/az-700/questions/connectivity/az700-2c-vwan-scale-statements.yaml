id: az700-2c-vwan-scale-statements
objective: "2.4.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Standard virtual WAN with a virtual hub named **Hub-NE**. Hub-NE uses the default virtual hub capacity and contains an ExpressRoute gateway with 2 scale units. The spoke virtual networks connected to Hub-NE are growing quickly.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un réseau étendu virtuel Standard avec un hub virtuel nommé **Hub-NE**. Hub-NE utilise la capacité de hub virtuel par défaut et contient une passerelle ExpressRoute avec 2 unités d'échelle. Les réseaux virtuels spoke connectés à Hub-NE se développent rapidement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Increasing the ExpressRoute gateway to 4 scale units increases the number of virtual machines that the Hub-NE router supports.
        fr: Passer la passerelle ExpressRoute à 4 unités d'échelle augmente le nombre de machines virtuelles pris en charge par le routeur de Hub-NE.
    - id: s2
      text:
        en: Changing the scale units of the ExpressRoute gateway might cause TCP reconnects.
        fr: La modification des unités d'échelle de la passerelle ExpressRoute peut provoquer des reconnexions TCP.
    - id: s3
      text:
        en: With its current capacity, the Hub-NE router supports 3 Gbps of aggregate throughput and 2,000 virtual machines in the connected virtual networks.
        fr: Avec sa capacité actuelle, le routeur de Hub-NE prend en charge un débit agrégé de 3 Gbit/s et 2 000 machines virtuelles dans les réseaux virtuels connectés.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Gateway scale units set the aggregate throughput of a gateway; the number of VMs the hub router supports depends on the routing infrastructure units of the virtual hub capacity. Changing the ExpressRoute scale units can cause TCP reconnects and minor disruptions. The default capacity of 2 routing infrastructure units supports 3 Gbps and 2,000 VMs.
    fr: |
      Les unités d'échelle de passerelle fixent le débit agrégé d'une passerelle ; le nombre de machines virtuelles pris en charge par le routeur du hub dépend des unités d'infrastructure de routage de la capacité du hub virtuel. Modifier les unités d'échelle ExpressRoute peut provoquer des reconnexions TCP et de légères perturbations. La capacité par défaut de 2 unités d'infrastructure de routage prend en charge 3 Gbit/s et 2 000 machines virtuelles.
references:
  - title: About virtual hub settings
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/hub-settings
  - title: Azure Virtual WAN FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-faq
