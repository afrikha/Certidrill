id: az700-cs1c-hub-gateways
objective: "2.4.4"
type: dropdown
caseStudy: az700-cs1c-wingtip-toys
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You need to create vwan-wingtip and the gateways of hub-gwc. The solution must meet the connectivity requirements.

    What should you configure? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer vwan-wingtip et les passerelles de hub-gwc. La solution doit respecter les exigences de connectivité.

    Que devez-vous configurer ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Type of vwan-wingtip: [[type]]

      Scale units of the site-to-site VPN gateway: [[s2s]]

      Scale units of the point-to-site VPN gateway: [[p2s]]

      Scale units of the ExpressRoute gateway: [[er]]
    fr: |
      Type de vwan-wingtip : [[type]]

      Unités d'échelle de la passerelle VPN de site à site : [[s2s]]

      Unités d'échelle de la passerelle VPN de point à site : [[p2s]]

      Unités d'échelle de la passerelle ExpressRoute : [[er]]
  slots:
    - id: type
      options:
        - { id: basic, text: "Basic" }
        - { id: standard, text: "Standard" }
    - id: s2s
      options:
        - { id: u1, text: "1" }
        - { id: u2, text: "2" }
        - { id: u3, text: "3" }
        - { id: u5, text: "5" }
    - id: p2s
      options:
        - { id: u1, text: "1" }
        - { id: u2, text: "2" }
        - { id: u4, text: "4" }
        - { id: u7, text: "7" }
    - id: er
      options:
        - { id: u1, text: "1" }
        - { id: u2, text: "2" }
        - { id: u5, text: "5" }
answer:
  values: { type: standard, s2s: u3, p2s: u1, er: u1 }
explanation:
  correct:
    en: Point-to-site VPN, ExpressRoute, Azure Firewall and transit between virtual networks through the hub require a Standard virtual WAN; a Basic virtual WAN supports only site-to-site VPN. One site-to-site scale unit provides 500 Mbps, so 1.4 Gbps needs three units (1.5 Gbps). One point-to-site scale unit supports 500 concurrent connections and 0.5 Gbps, which covers 420 users below 300 Mbps. One ExpressRoute scale unit provides 2 Gbps, which covers 1 Gbps.
    fr: "Le VPN de point à site, ExpressRoute, Pare-feu Azure et le transit entre réseaux virtuels par le hub exigent un WAN virtuel Standard ; un WAN virtuel Basic ne prend en charge que le VPN de site à site. Une unité d'échelle de site à site fournit 500 Mbit/s : 1,4 Gbit/s exige donc trois unités (1,5 Gbit/s). Une unité d'échelle de point à site prend en charge 500 connexions simultanées et 0,5 Gbit/s, ce qui couvre 420 utilisateurs sous 300 Mbit/s. Une unité d'échelle ExpressRoute fournit 2 Gbit/s, ce qui couvre 1 Gbit/s."
  options:
    basic:
      en: A Basic virtual WAN supports neither user VPN, ExpressRoute, Azure Firewall nor VNet-to-VNet transit through the hub, and it can't change gateway scale units.
      fr: Un WAN virtuel Basic ne prend en charge ni le VPN utilisateur, ni ExpressRoute, ni Pare-feu Azure, ni le transit entre réseaux virtuels par le hub, et il ne permet pas de modifier les unités d'échelle des passerelles.
    u2:
      en: Two site-to-site units provide only 1 Gbps, below the 1.4 Gbps peak; for the point-to-site and ExpressRoute gateways, two units exceed the minimum needed.
      fr: Deux unités de site à site ne fournissent que 1 Gbit/s, sous la pointe de 1,4 Gbit/s ; pour les passerelles de point à site et ExpressRoute, deux unités dépassent le minimum nécessaire.
references:
  - title: Virtual WAN FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-faq
  - title: What is Azure Virtual WAN?
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-about
