id: az700-2a-pb-multiple-firewalls
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has three branch offices. Each branch office uses a policy-based VPN firewall that supports IKEv2 and defines its encryption domains as pairs of prefixes. Each branch must connect to a virtual network named **VNet-Shared** by using a site-to-site VPN.

    You need to recommend a VPN gateway configuration for VNet-Shared.

    What should you recommend?
  fr: |
    Litware possède trois succursales. Chaque succursale utilise un pare-feu VPN basé sur des stratégies qui prend en charge IKEv2 et définit ses domaines de chiffrement sous forme de paires de préfixes. Chaque succursale doit se connecter à un réseau virtuel nommé **VNet-Shared** par un VPN de site à site.

    Vous devez recommander une configuration de passerelle VPN pour VNet-Shared.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A policy-based gateway with the Basic SKU and one connection for each branch", fr: "Une passerelle basée sur des stratégies de référence Basic, avec une connexion par succursale" } }
    - { id: b, text: { en: "A route-based VpnGw1AZ gateway with BGP enabled on each connection", fr: "Une passerelle VpnGw1AZ basée sur des itinéraires, avec BGP activé sur chaque connexion" } }
    - { id: c, text: { en: "A route-based VpnGw1AZ gateway with a custom IPsec/IKE policy and policy-based traffic selectors on each connection", fr: "Une passerelle VpnGw1AZ basée sur des itinéraires, avec une stratégie IPsec/IKE personnalisée et des sélecteurs de trafic basés sur des stratégies sur chaque connexion" } }
    - { id: d, text: { en: "Three policy-based gateways with the Basic SKU, one for each branch", fr: "Trois passerelles basées sur des stratégies de référence Basic, une par succursale" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A route-based gateway proposes any-to-any traffic selectors by default. To connect it to several on-premises policy-based devices, you apply a custom IPsec/IKE policy on each connection and enable UsePolicyBasedTrafficSelectors, which requires IKEv2 on the devices.
    fr: |
      Une passerelle basée sur des itinéraires propose par défaut des sélecteurs de trafic « any-to-any ». Pour la connecter à plusieurs périphériques locaux basés sur des stratégies, vous appliquez une stratégie IPsec/IKE personnalisée sur chaque connexion et activez UsePolicyBasedTrafficSelectors, ce qui exige IKEv2 sur les périphériques.
  options:
    a: { en: "A policy-based gateway supports only one site-to-site tunnel.", fr: "Une passerelle basée sur des stratégies ne prend en charge qu'un seul tunnel de site à site." }
    b: { en: "BGP doesn't change the any-to-any traffic selectors, which don't match the prefix pairs of policy-based devices.", fr: "BGP ne modifie pas les sélecteurs « any-to-any », qui ne correspondent pas aux paires de préfixes des périphériques basés sur des stratégies." }
    d: { en: "A virtual network can have only one VPN gateway.", fr: "Un réseau virtuel ne peut avoir qu'une seule passerelle VPN." }
references:
  - title: Connect a VPN gateway to multiple on-premises policy-based VPN devices
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-connect-multiple-policybased-rm-ps
