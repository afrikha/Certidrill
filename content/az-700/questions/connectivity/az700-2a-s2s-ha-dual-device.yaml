id: az700-2a-s2s-ha-dual-device
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a virtual network named **VNet1** that contains a route-based VPN gateway named **VNet1GW**. VNet1GW uses the VpnGw2AZ SKU in active-active mode.

    The on-premises network 10.50.0.0/16 is connected to the internet through two VPN devices:

    | Device | Public IP address | BGP support |
    | --- | --- | --- |
    | FW1 | 203.0.113.10 | Yes |
    | FW2 | 198.51.100.20 | Yes |

    A local network gateway named **LNG-FW1** represents FW1, and a site-to-site connection without BGP links VNet1GW to LNG-FW1. FW2 is not connected yet.

    You need to ensure that traffic between VNet1 and the on-premises network uses tunnels to both devices at the same time and continues to flow if either device fails.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un réseau virtuel nommé **VNet1** qui contient une passerelle VPN basée sur des itinéraires (route-based) nommée **VNet1GW**. VNet1GW utilise la référence SKU VpnGw2AZ en mode actif/actif.

    Le réseau local 10.50.0.0/16 est relié à Internet par deux périphériques VPN :

    | Périphérique | Adresse IP publique | Prise en charge de BGP |
    | --- | --- | --- |
    | FW1 | 203.0.113.10 | Oui |
    | FW2 | 198.51.100.20 | Oui |

    Une passerelle de réseau local nommée **LNG-FW1** représente FW1, et une connexion de site à site sans BGP relie VNet1GW à LNG-FW1. FW2 n'est pas encore connecté.

    Vous devez faire en sorte que le trafic entre VNet1 et le réseau local utilise simultanément des tunnels vers les deux périphériques et continue de circuler si l'un des périphériques tombe en panne.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add 198.51.100.20 as a second gateway IP address of LNG-FW1.", fr: "Ajouter 198.51.100.20 comme seconde adresse IP de passerelle de LNG-FW1." } }
    - { id: b, text: { en: "Create a local network gateway for FW2 and a connection from VNet1GW to it.", fr: "Créer une passerelle de réseau local pour FW2 et une connexion de VNet1GW vers celle-ci." } }
    - { id: c, text: { en: "Create a second VPN gateway in VNet1 and connect it to FW2.", fr: "Créer une seconde passerelle VPN dans VNet1 et la connecter à FW2." } }
    - { id: d, text: { en: "Configure BGP on both local network gateways and enable BGP on both connections.", fr: "Configurer BGP sur les deux passerelles de réseau local et activer BGP sur les deux connexions." } }
    - { id: e, text: { en: "Enable policy-based traffic selectors on both connections.", fr: "Activer les sélecteurs de trafic basés sur des stratégies sur les deux connexions." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Each on-premises VPN device needs its own local network gateway, with a unique public IP address, and its own connection from the Azure VPN gateway. Because both devices advertise the same on-premises prefixes, BGP is required on these connections, each local network gateway having a unique BGP peer IP address. With the active-active gateway, the result is a full mesh of four tunnels.
    fr: Chaque périphérique VPN local a besoin de sa propre passerelle de réseau local, avec une adresse IP publique unique, et de sa propre connexion depuis la passerelle VPN Azure. Comme les deux périphériques annoncent les mêmes préfixes locaux, BGP est obligatoire sur ces connexions, chaque passerelle de réseau local ayant une adresse IP de pair BGP unique. Avec la passerelle en mode actif/actif, on obtient un maillage complet de quatre tunnels.
  options:
    a: { en: "A local network gateway has a single endpoint (one IP address or one FQDN); a second device needs its own local network gateway.", fr: "Une passerelle de réseau local n'a qu'un point de terminaison (une adresse IP ou un FQDN) ; un second périphérique a besoin de sa propre passerelle de réseau local." }
    c: { en: "A virtual network can have only one VPN gateway; the existing active-active gateway accepts connections to both devices.", fr: "Un réseau virtuel ne peut avoir qu'une seule passerelle VPN ; la passerelle actif/actif existante accepte des connexions vers les deux périphériques." }
    e: { en: "Policy-based traffic selectors are for on-premises policy-based devices; they don't provide multipath routing to the same network.", fr: "Les sélecteurs de trafic basés sur des stratégies servent aux périphériques locaux basés sur des stratégies ; ils n'assurent pas le routage multichemin vers un même réseau." }
references:
  - title: Design highly available gateway connectivity for cross-premises and VNet-to-VNet connections
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-highlyavailable
