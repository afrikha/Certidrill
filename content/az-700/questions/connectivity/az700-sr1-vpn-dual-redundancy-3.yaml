id: az700-sr1-vpn-dual-redundancy-3
objective: "2.1.1"
type: series_yesno
series: az700-sr1-vpn-dual-redundancy
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You deploy VGW1 in active-active mode and create two connections that use static routing.
  fr: |
    Vous déployez VGW1 en mode actif-actif et créez deux connexions qui utilisent le routage statique.
body:
  solution:
    en: |
      You deploy VGW1 with **active-active mode** enabled and two public IP addresses, with BGP disabled. You create two local network gateways, one for Dev1 and one for Dev2, each with the public IP address of its device and the address space **10.50.0.0/16**. You create one connection to each local network gateway with **BGP disabled**.
    fr: |
      Vous déployez VGW1 avec le **mode actif-actif** activé et deux adresses IP publiques, avec BGP désactivé. Vous créez deux passerelles de réseau local, une pour Dev1 et une pour Dev2, chacune avec l'adresse IP publique de son périphérique et l'espace d'adressage **10.50.0.0/16**. Vous créez une connexion vers chaque passerelle de réseau local avec **BGP désactivé**.
answer: { value: false }
explanation:
  correct:
    en: |
      Active-active mode addresses the gateway-instance requirement, but two connections to two devices that front the same on-premises network require BGP. Without BGP, the two local network gateways declare the same static prefix and the gateway can't use both connections to 10.50.0.0/16 at the same time or reroute dynamically when a device fails. The design must enable BGP on the gateway, on both local network gateways and on both connections.
    fr: |
      Le mode actif-actif répond à l'exigence sur les instances de passerelle, mais deux connexions vers deux périphériques qui desservent le même réseau local exigent BGP. Sans BGP, les deux passerelles de réseau local déclarent le même préfixe statique, et la passerelle ne peut pas utiliser simultanément les deux connexions vers 10.50.0.0/16 ni réacheminer dynamiquement le trafic quand un périphérique tombe en panne. La conception doit activer BGP sur la passerelle, sur les deux passerelles de réseau local et sur les deux connexions.
references:
  - title: Design highly available gateway connectivity for cross-premises and VNet-to-VNet connections
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-highlyavailable
