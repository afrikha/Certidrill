id: az700-2b-entra-prereqs
objective: "2.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a route-based VPN gateway named **VPNGW1** (SKU VpnGw2AZ). The point-to-site configuration of VPNGW1 is the following:

    | Setting | Value |
    | --- | --- |
    | Address pool | 172.16.40.0/24 |
    | Tunnel type | IKEv2 |
    | Authentication type | Azure certificate |

    Users connect from Windows 11 laptops by using the native Windows VPN client.

    You need to replace certificate authentication with Microsoft Entra ID authentication so that the connections are subject to Conditional Access. You will use the Microsoft-registered Azure VPN Client app ID as the audience.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'une passerelle VPN basée sur des routes nommée **VPNGW1** (référence SKU VpnGw2AZ). La configuration de point à site de VPNGW1 est la suivante :

    | Paramètre | Valeur |
    | --- | --- |
    | Pool d'adresses | 172.16.40.0/24 |
    | Type de tunnel | IKEv2 |
    | Type d'authentification | Certificat Azure |

    Les utilisateurs se connectent depuis des ordinateurs portables Windows 11 avec le client VPN natif de Windows.

    Vous devez remplacer l'authentification par certificat par l'authentification Microsoft Entra ID, pour que les connexions soient soumises à l'accès conditionnel. Vous utiliserez l'ID d'application Azure VPN Client inscrit par Microsoft comme audience.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Grant admin consent to the Azure VPN application in the tenant.", fr: "Accorder le consentement administrateur à l'application Azure VPN dans le locataire." } }
    - { id: b, text: { en: "Change the tunnel type of VPNGW1 to OpenVPN (SSL).", fr: "Changer le type de tunnel de VPNGW1 en OpenVPN (SSL)." } }
    - { id: c, text: { en: "Resize VPNGW1 to the VpnGw4AZ SKU.", fr: "Redimensionner VPNGW1 vers la référence SKU VpnGw4AZ." } }
    - { id: d, text: { en: "Install the Azure VPN Client on the laptops.", fr: "Installer Azure VPN Client sur les ordinateurs portables." } }
    - { id: e, text: { en: "Deploy an NPS server with the Microsoft Entra multifactor authentication extension.", fr: "Déployer un serveur NPS avec l'extension d'authentification multifacteur Microsoft Entra." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Microsoft Entra ID authentication is supported only with the OpenVPN tunnel type, so IKEv2 must be replaced by OpenVPN (SSL). The native Windows client can't perform Entra ID authentication; users must connect with the Azure VPN Client, configured from the regenerated profile package.
    fr: "L'authentification Microsoft Entra ID n'est prise en charge qu'avec le type de tunnel OpenVPN : IKEv2 doit donc être remplacé par OpenVPN (SSL). Le client Windows natif ne sait pas effectuer l'authentification Entra ID ; les utilisateurs doivent se connecter avec Azure VPN Client, configuré à partir du package de profil régénéré."
  options:
    a: { en: "Admin consent applies only to the older manually registered app ID; the Microsoft-registered app ID needs no consent step.", fr: "Le consentement administrateur ne concerne que l'ancien ID d'application inscrit manuellement ; l'ID inscrit par Microsoft ne demande aucune étape de consentement." }
    c: { en: "Every route-based SKU except Basic supports Entra ID authentication; VpnGw2AZ is enough.", fr: "Toutes les références SKU basées sur des routes sauf Basic prennent en charge l'authentification Entra ID ; VpnGw2AZ suffit." }
    e: { en: "An NPS extension adds MFA to RADIUS authentication; it doesn't configure Microsoft Entra ID authentication on the gateway.", fr: "L'extension NPS ajoute l'authentification multifacteur à RADIUS ; elle ne configure pas l'authentification Microsoft Entra ID sur la passerelle." }
references:
  - title: "Configure P2S VPN gateway for Microsoft Entra ID authentication: Microsoft-registered client - Azure VPN Gateway"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-entra-gateway
  - title: About Azure Point-to-Site VPN connections - Azure VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about
