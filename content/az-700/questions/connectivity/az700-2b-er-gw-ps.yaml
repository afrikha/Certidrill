id: az700-2b-er-gw-ps
objective: "2.3.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip has a hub virtual network named **VNet-Hub** in West Europe. VNet-Hub contains a /26 subnet reserved for virtual network gateways.

    You need to deploy an ExpressRoute gateway named **ERGW-Hub** in VNet-Hub. The gateway must support FastPath and must use a fixed SKU, not scale units.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip dispose d'un réseau virtuel hub nommé **VNet-Hub** dans West Europe. VNet-Hub contient un sous-réseau /26 réservé aux passerelles de réseau virtuel.

    Vous devez déployer une passerelle ExpressRoute nommée **ERGW-Hub** dans VNet-Hub. La passerelle doit prendre en charge FastPath et utiliser une référence SKU fixe, pas des unités d'échelle.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $vnet = Get-AzVirtualNetwork -Name "VNet-Hub" -ResourceGroupName "RG1"
    $subnet = Get-AzVirtualNetworkSubnetConfig -Name [[subnet]] -VirtualNetwork $vnet
    $ipconf = New-AzVirtualNetworkGatewayIpConfig -Name "gwipconf" -SubnetId $subnet.Id
    New-AzVirtualNetworkGateway -Name "ERGW-Hub" -ResourceGroupName "RG1" -Location "westeurope" `
      -IpConfigurations $ipconf -GatewayType [[type]] -GatewaySku [[sku]]
  slots:
    - id: subnet
      options:
        - { id: gateway, text: "\"GatewaySubnet\"" }
        - { id: routeserver, text: "\"RouteServerSubnet\"" }
        - { id: firewall, text: "\"AzureFirewallSubnet\"" }
        - { id: bastion, text: "\"AzureBastionSubnet\"" }
    - id: type
      options:
        - { id: er, text: ExpressRoute }
        - { id: vpn, text: Vpn }
        - { id: local, text: LocalGateway }
    - id: sku
      options:
        - { id: er1, text: ErGw1AZ }
        - { id: er2, text: ErGw2AZ }
        - { id: er3, text: ErGw3AZ }
        - { id: vpn3, text: VpnGw3AZ }
answer:
  values: { subnet: gateway, type: er, sku: er3 }
explanation:
  correct:
    en: Virtual network gateways must be deployed in the subnet named exactly `GatewaySubnet`. An ExpressRoute gateway uses the gateway type `ExpressRoute`. Among the fixed SKUs, FastPath requires `ErGw3AZ` (or UltraPerformance); ErGwScale also supports it from 10 scale units, but the requirement excludes scale units.
    fr: "Les passerelles de réseau virtuel doivent être déployées dans le sous-réseau nommé exactement `GatewaySubnet`. Une passerelle ExpressRoute utilise le type de passerelle `ExpressRoute`. Parmi les références SKU fixes, FastPath exige `ErGw3AZ` (ou UltraPerformance) ; ErGwScale le prend aussi en charge à partir de 10 unités d'échelle, mais l'exigence exclut les unités d'échelle."
  options:
    routeserver: { en: "RouteServerSubnet is reserved for Azure Route Server.", fr: "RouteServerSubnet est réservé à Azure Route Server." }
    vpn: { en: "The Vpn type creates a VPN gateway, which can't connect to an ExpressRoute circuit.", fr: "Le type Vpn crée une passerelle VPN, qui ne peut pas se connecter à un circuit ExpressRoute." }
    er1: { en: "ErGw1AZ doesn't support FastPath.", fr: "ErGw1AZ ne prend pas en charge FastPath." }
    er2: { en: "ErGw2AZ doesn't support FastPath.", fr: "ErGw2AZ ne prend pas en charge FastPath." }
    vpn3: { en: "VpnGw3AZ is a VPN gateway SKU.", fr: "VpnGw3AZ est une référence SKU de passerelle VPN." }
references:
  - title: About ExpressRoute virtual network gateways
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-virtual-network-gateways
  - title: "Azure ExpressRoute FastPath: Features, availability, and limitations"
    url: https://learn.microsoft.com/en-us/azure/expressroute/about-fastpath
