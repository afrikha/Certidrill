id: az700-2c-er-premium-cross-geo
objective: "2.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an ExpressRoute circuit named **ER-AMS** that uses the Standard SKU and the Amsterdam peering location. Azure private peering is configured. Three virtual networks in West Europe are already linked to ER-AMS.

    Fabrikam deploys a new virtual network named **VNet-US** in the East US region. VNet-US contains an ExpressRoute gateway that uses the ErGw1AZ SKU.

    You need to link VNet-US to ER-AMS.

    What should you do first?
  fr: |
    Fabrikam dispose d'un circuit ExpressRoute nommé **ER-AMS** qui utilise la référence SKU Standard et l'emplacement de peering d'Amsterdam. Le peering privé Azure est configuré. Trois réseaux virtuels de la région West Europe sont déjà liés à ER-AMS.

    Fabrikam déploie un nouveau réseau virtuel nommé **VNet-US** dans la région East US. VNet-US contient une passerelle ExpressRoute qui utilise la référence SKU ErGw1AZ.

    Vous devez lier VNet-US à ER-AMS.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Enable ExpressRoute Global Reach on ER-AMS.", fr: "Activer ExpressRoute Global Reach sur ER-AMS." } }
    - { id: b, text: { en: "Resize the gateway of VNet-US to the ErGw3AZ SKU.", fr: "Redimensionner la passerelle de VNet-US vers la référence SKU ErGw3AZ." } }
    - { id: c, text: { en: "Enable the ExpressRoute Premium add-on on ER-AMS.", fr: "Activer le module complémentaire ExpressRoute Premium sur ER-AMS." } }
    - { id: d, text: { en: "Enable FastPath on the future connection to VNet-US.", fr: "Activer FastPath sur la future connexion à VNet-US." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Standard circuit can only link virtual networks in the same geopolitical region as its peering location, here Europe. The Premium add-on removes this restriction and lets the circuit link virtual networks in other geopolitical regions, such as East US.
    fr: |
      Un circuit Standard ne peut lier que des réseaux virtuels situés dans la même région géopolitique que son emplacement de peering, ici l'Europe. Le module complémentaire Premium lève cette restriction et permet au circuit de lier des réseaux virtuels d'autres régions géopolitiques, comme East US.
  options:
    a: { en: "Global Reach connects on-premises sites to each other through their circuits; it doesn't extend the geographic scope of virtual network links.", fr: "Global Reach relie des sites locaux entre eux par leurs circuits ; il n'étend pas la portée géographique des liaisons de réseaux virtuels." }
    b: { en: "The gateway SKU sets throughput and FastPath support, not the regions a circuit can reach.", fr: "La référence SKU de passerelle détermine le débit et la prise en charge de FastPath, pas les régions qu'un circuit peut atteindre." }
    d: { en: "FastPath bypasses the gateway in the data path; it requires an eligible gateway SKU and doesn't remove the geopolitical restriction.", fr: "FastPath contourne la passerelle dans le chemin des données ; il exige une référence SKU de passerelle éligible et ne lève pas la restriction géopolitique." }
references:
  - title: Connect a virtual network to an ExpressRoute circuit using Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-linkvnet-arm
