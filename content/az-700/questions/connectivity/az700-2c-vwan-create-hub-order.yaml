id: az700-2c-vwan-create-hub-order
objective: "2.4.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has an Azure subscription that contains a virtual network named **VNet-App** in West Europe. VNet-App has no virtual network gateway. Tailspin doesn't use Virtual WAN yet.

    You need VNet-App to be connected to a virtual hub in West Europe that will later host ExpressRoute and User VPN gateways.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin dispose d'un abonnement Azure qui contient un réseau virtuel nommé **VNet-App** dans West Europe. VNet-App n'a aucune passerelle de réseau virtuel. Tailspin n'utilise pas encore Virtual WAN.

    VNet-App doit être connecté à un hub virtuel dans West Europe qui hébergera ensuite des passerelles ExpressRoute et VPN utilisateur.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: conn, text: { en: "Add a virtual network connection between the hub and VNet-App.", fr: "Ajouter une connexion de réseau virtuel entre le hub et VNet-App." } }
    - { id: gwsub, text: { en: "Create a subnet named GatewaySubnet in VNet-App.", fr: "Créer un sous-réseau nommé GatewaySubnet dans VNet-App." } }
    - { id: wan, text: { en: "Create a virtual WAN of type Standard.", fr: "Créer un réseau étendu virtuel de type Standard." } }
    - { id: peer, text: { en: "Configure VNet-App peering with Use remote gateways enabled.", fr: "Configurer le peering de VNet-App avec Utiliser des passerelles distantes activé." } }
    - { id: hub, text: { en: "Create a virtual hub in West Europe.", fr: "Créer un hub virtuel dans West Europe." } }
    - { id: basic, text: { en: "Create a virtual WAN of type Basic.", fr: "Créer un réseau étendu virtuel de type Basic." } }
answer:
  sequence: [ wan, hub, conn ]
explanation:
  correct:
    en: |
      A virtual hub is created inside a virtual WAN, and ExpressRoute and User VPN require the Standard type. You then create the hub with a non-overlapping address space (/24 minimum) and attach VNet-App with a virtual network connection.
    fr: |
      Un hub virtuel se crée à l'intérieur d'un réseau étendu virtuel, et ExpressRoute et le VPN utilisateur exigent le type Standard. Vous créez ensuite le hub avec un espace d'adressage sans chevauchement (/24 au minimum) et rattachez VNet-App avec une connexion de réseau virtuel.
  options:
    basic:
      en: |
        A Basic virtual WAN supports site-to-site VPN only.
      fr: |
        Un réseau étendu virtuel Basic ne prend en charge que le VPN de site à site.
    peer:
      en: |
        The hub is a Microsoft-managed network: spokes attach with a virtual network connection, not with a peering you configure.
      fr: |
        Le hub est un réseau géré par Microsoft : les spokes s'y rattachent par une connexion de réseau virtuel, pas par un peering que vous configurez.
    gwsub:
      en: |
        The spoke doesn't need a gateway subnet; the gateways run in the hub.
      fr: |
        Le spoke n'a pas besoin de sous-réseau de passerelle ; les passerelles s'exécutent dans le hub.
references:
  - title: "Tutorial: Create an ExpressRoute association to Virtual WAN - Azure portal"
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-expressroute-portal
