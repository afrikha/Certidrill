id: az700-cs4b-route-preference
objective: "2.3.10"
type: multi
caseStudy: az700-cs4b-fernhill
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the connectivity requirement for the traffic from Azure to the Paris datacenter. The solution must not change how the traffic from Azure reaches the London datacenter.

    Which two actions can you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter l'exigence de connectivité pour le trafic d'Azure vers le centre de données de Paris. La solution ne doit pas modifier la façon dont le trafic d'Azure atteint le centre de données de Londres.

    Quelles sont les deux actions que vous pouvez effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure the Paris edge routers to also advertise 10.10.0.0/17 and 10.10.128.0/17 over ER-Paris", fr: "Configurer les routeurs de périphérie de Paris pour publier aussi 10.10.0.0/17 et 10.10.128.0/17 sur ER-Paris" } }
    - { id: b, text: { en: "Set the routing weight of the connection between ERGW1 and ER-Paris to 100", fr: "Définir le poids de routage de la connexion entre ERGW1 et ER-Paris sur 100" } }
    - { id: c, text: { en: "Configure the Paris edge routers to prepend their AS number to 10.10.0.0/16 on ER-Paris", fr: "Configurer les routeurs de périphérie de Paris pour ajouter leur numéro d'AS en tête du chemin de 10.10.0.0/16 sur ER-Paris" } }
    - { id: d, text: { en: "Configure the London edge routers to prepend their AS number to 10.10.0.0/16 on ER-London", fr: "Configurer les routeurs de périphérie de Londres pour ajouter leur numéro d'AS en tête du chemin de 10.10.0.0/16 sur ER-London" } }
    - { id: e, text: { en: "Configure the Paris edge routers with a higher local preference for the routes received from ER-Paris", fr: "Configurer les routeurs de périphérie de Paris avec une préférence locale plus élevée pour les routes reçues d'ER-Paris" } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      Toward on-premises, Azure first selects the longest prefix match. If Paris also advertises the two /17 halves over ER-Paris, every destination in Paris matches a /17 learned only from ER-Paris; if the circuit fails, the /17 routes are withdrawn and the /16 learned from ER-London takes over. With prefixes of the same length and equal connection weights, the shorter AS path wins: prepending the AS number to 10.10.0.0/16 on ER-London makes that path less preferred, so ER-Paris is used while it's available. Neither change affects the routes of 10.20.0.0/16. AS path prepending works on Azure private peering; Microsoft removes private AS numbers only on Microsoft peering.
    fr: |
      Vers l'environnement local, Azure sélectionne d'abord la correspondance de préfixe la plus longue. Si Paris publie aussi les deux moitiés /17 sur ER-Paris, chaque destination de Paris correspond à un /17 appris uniquement d'ER-Paris ; si le circuit tombe en panne, les routes /17 sont retirées et le /16 appris d'ER-London prend le relais. À longueur de préfixe égale et avec des poids de connexion égaux, le chemin AS le plus court l'emporte : ajouter le numéro d'AS en tête de 10.10.0.0/16 sur ER-London rend ce chemin moins préféré, et ER-Paris est utilisé tant qu'il est disponible. Aucune de ces modifications ne touche les routes de 10.20.0.0/16. L'allongement du chemin AS fonctionne sur le peering privé Azure ; Microsoft ne retire les numéros d'AS privés que sur le peering Microsoft.
  options:
    b: { en: "The connection weight applies to every prefix learned over the connection and is evaluated before the AS path. ERGW1 would also prefer ER-Paris for 10.20.0.0/16, which changes the London traffic.", fr: "Le poids de connexion s'applique à tous les préfixes appris par la connexion et est évalué avant le chemin AS. ERGW1 préférerait aussi ER-Paris pour 10.20.0.0/16, ce qui modifie le trafic vers Londres." }
    c: { en: "Prepending on ER-Paris lengthens the AS path of the preferred circuit, so Azure would send the Paris traffic over ER-London.", fr: "L'ajout en tête sur ER-Paris allonge le chemin AS du circuit préféré : Azure enverrait alors le trafic de Paris par ER-London." }
    e: { en: "Local preference on the on-premises routers controls the traffic from on-premises to Azure, not the path that Azure chooses toward on-premises.", fr: "La préférence locale sur les routeurs locaux contrôle le trafic de l'environnement local vers Azure, pas le chemin qu'Azure choisit vers l'environnement local." }
references:
  - title: Optimize routing for Azure ExpressRoute
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-optimize-routing
