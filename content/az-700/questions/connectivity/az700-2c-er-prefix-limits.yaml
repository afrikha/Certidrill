id: az700-2c-er-prefix-limits
objective: "2.3.10"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has an ExpressRoute circuit named **ER-Core** that uses the Standard SKU without add-ons. Azure private peering is configured. After a merger, the on-premises edge routers will advertise about 4,500 IPv4 prefixes to Azure over the private peering of ER-Core.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un circuit ExpressRoute nommé **ER-Core** qui utilise la référence SKU Standard sans module complémentaire. Le peering privé Azure est configuré. Après une fusion, les routeurs de périphérie locaux publieront environ 4 500 préfixes IPv4 vers Azure sur le peering privé d'ER-Core.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Azure accepts the first 4,000 prefixes and ignores the remaining ones, and the BGP session stays up.
        fr: |
          Azure accepte les 4 000 premiers préfixes et ignore les suivants, et la session BGP reste établie.
    - id: s2
      text:
        en: |
          Enabling the ExpressRoute Premium add-on on ER-Core raises the private peering limit to 10,000 IPv4 prefixes.
        fr: |
          L'activation du module complémentaire ExpressRoute Premium sur ER-Core porte la limite du peering privé à 10 000 préfixes IPv4.
    - id: s3
      text:
        en: |
          Tagging the prefixes with BGP communities on the on-premises routers lets you control which virtual networks receive them.
        fr: |
          Marquer les préfixes avec des communautés BGP sur les routeurs locaux permet de contrôler les réseaux virtuels qui les reçoivent.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Private peering accepts up to 4,000 IPv4 prefixes (10,000 with the Premium add-on); when the limit is exceeded, the BGP session drops instead of truncating the list. Microsoft doesn't honor community values tagged on the routes you advertise, so communities can't steer your prefixes inside Azure; summarize the prefixes or enable Premium instead.
    fr: |
      Le peering privé accepte jusqu'à 4 000 préfixes IPv4 (10 000 avec le module complémentaire Premium) ; au-delà, la session BGP est interrompue au lieu de tronquer la liste. Microsoft ne tient pas compte des valeurs de communauté posées sur les routes que vous publiez : les communautés ne peuvent pas orienter vos préfixes dans Azure. Résumez plutôt les préfixes ou activez Premium.
references:
  - title: ExpressRoute routing requirements
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-routing
