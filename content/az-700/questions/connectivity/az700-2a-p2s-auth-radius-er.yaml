id: az700-2a-p2s-auth-radius-er
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a virtual network named **VNet-Hub** that contains an ExpressRoute gateway and a route-based VPN gateway (VpnGw2AZ). The datacenter is connected to VNet-Hub only through an ExpressRoute circuit (private peering).

    Contoso configures point-to-site VPN with RADIUS authentication. The RADIUS servers are NPS servers in the datacenter, and their IP addresses and shared secret are entered correctly on the VPN gateway. Users can't authenticate, and the NPS servers receive no requests from the gateway.

    You need to ensure that users can authenticate by using the existing on-premises NPS servers.

    What should you do?
  fr: |
    Contoso dispose d'un réseau virtuel nommé **VNet-Hub** qui contient une passerelle ExpressRoute et une passerelle VPN basée sur des itinéraires (VpnGw2AZ). Le centre de données est relié à VNet-Hub uniquement par un circuit ExpressRoute (peering privé).

    Contoso configure un VPN de point à site avec l'authentification RADIUS. Les serveurs RADIUS sont des serveurs NPS du centre de données, et leurs adresses IP ainsi que le secret partagé sont correctement saisis sur la passerelle VPN. Les utilisateurs ne parviennent pas à s'authentifier, et les serveurs NPS ne reçoivent aucune requête de la passerelle.

    Vous devez faire en sorte que les utilisateurs puissent s'authentifier avec les serveurs NPS locaux existants.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Increase the RADIUS request timeout on the VPN gateway.", fr: "Augmenter le délai d'expiration des requêtes RADIUS sur la passerelle VPN." } }
    - { id: b, text: { en: "Create a site-to-site VPN connection from the VPN gateway to the datacenter.", fr: "Créer une connexion VPN de site à site de la passerelle VPN vers le centre de données." } }
    - { id: c, text: { en: "Enable FastPath on the ExpressRoute connection.", fr: "Activer FastPath sur la connexion ExpressRoute." } }
    - { id: d, text: { en: "Change the point-to-site tunnel type to OpenVPN (SSL).", fr: "Changer le type de tunnel de point à site en OpenVPN (SSL)." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The VPN gateway must be able to reach the RADIUS servers. For an on-premises RADIUS server, this requires a site-to-site VPN connection with the proper routes; traffic from the VPN gateway to an on-premises RADIUS server can't be routed over ExpressRoute.
    fr: |
      La passerelle VPN doit pouvoir joindre les serveurs RADIUS. Pour un serveur RADIUS local, il faut une connexion VPN de site à site avec les routes appropriées ; le trafic de la passerelle VPN vers un serveur RADIUS local ne peut pas emprunter ExpressRoute.
  options:
    a: { en: "The RADIUS timeout is fixed at 30 seconds and the requests never reach the servers anyway.", fr: "Le délai RADIUS est fixé à 30 secondes, et de toute façon les requêtes n'atteignent jamais les serveurs." }
    c: { en: "FastPath changes the ExpressRoute data path to VMs; it doesn't let the VPN gateway reach RADIUS over ExpressRoute.", fr: "FastPath modifie le chemin de données ExpressRoute vers les machines virtuelles ; il ne permet pas à la passerelle VPN de joindre RADIUS par ExpressRoute." }
    d: { en: "The tunnel type doesn't change the path between the gateway and the RADIUS servers.", fr: "Le type de tunnel ne change pas le chemin entre la passerelle et les serveurs RADIUS." }
references:
