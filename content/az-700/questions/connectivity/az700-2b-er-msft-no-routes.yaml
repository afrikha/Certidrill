id: az700-2b-er-msft-no-routes
objective: "2.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware created an ExpressRoute circuit named **CKT1** in March 2026 at the Amsterdam peering location (Standard SKU). You configured Microsoft peering on CKT1 with public prefixes registered to Proseware. `Get-AzExpressRouteCircuitPeeringConfig` shows `AdvertisedPublicPrefixesState` as `Configured`, and both BGP sessions are established.

    The on-premises edge routers receive no prefixes from Microsoft over the Microsoft peering. On-premises applications must reach the public endpoints of Azure services in West Europe over CKT1.

    What should you do?
  fr: |
    Proseware a créé un circuit ExpressRoute nommé **CKT1** en mars 2026 à l'emplacement de peering Amsterdam (référence SKU Standard). Vous avez configuré le peering Microsoft sur CKT1 avec des préfixes publics enregistrés au nom de Proseware. `Get-AzExpressRouteCircuitPeeringConfig` affiche `AdvertisedPublicPrefixesState` à `Configured`, et les deux sessions BGP sont établies.

    Les routeurs de périphérie locaux ne reçoivent aucun préfixe de Microsoft par le peering Microsoft. Des applications locales doivent joindre les points de terminaison publics de services Azure de West Europe par CKT1.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Upgrade CKT1 to the Premium SKU.", fr: "Faire passer CKT1 à la référence SKU Premium." } }
    - { id: b, text: { en: "Advertise a default route to Microsoft over the Microsoft peering.", fr: "Publier une route par défaut vers Microsoft par le peering Microsoft." } }
    - { id: c, text: { en: "Attach to the Microsoft peering a route filter that allows the West Europe community.", fr: "Attacher au peering Microsoft un filtre de routage qui autorise la communauté de West Europe." } }
    - { id: d, text: { en: "Configure Azure private peering and link a virtual network in West Europe.", fr: "Configurer le peering privé Azure et lier un réseau virtuel de West Europe." } }
answer: { optionId: c }
explanation:
  correct:
    en: For circuits configured on or after August 1, 2017, Microsoft peering advertises no prefix until a route filter is attached. The route filter's single Allow rule lists the BGP communities to receive, here the regional community of West Europe; once attached, the matching prefixes are advertised to the on-premises routers.
    fr: "Pour les circuits configurés à partir du 1er août 2017, le peering Microsoft ne publie aucun préfixe tant qu'un filtre de routage n'est pas attaché. L'unique règle Allow du filtre liste les communautés BGP à recevoir, ici la communauté régionale de West Europe ; une fois le filtre attaché, les préfixes correspondants sont publiés vers les routeurs locaux."
  options:
    a: { en: "A Standard circuit in Amsterdam already reaches the regions of Europe; Premium is for other geopolitical areas and Microsoft 365.", fr: "Un circuit Standard à Amsterdam atteint déjà les régions d'Europe ; Premium sert pour d'autres zones géopolitiques et pour Microsoft 365." }
    b: { en: "Default routes are accepted only on Azure private peering, and they wouldn't make Microsoft advertise prefixes.", fr: "Les routes par défaut ne sont acceptées que sur le peering privé Azure, et elles ne feraient pas publier de préfixes par Microsoft." }
    d: { en: "Private peering reaches virtual networks, not the public endpoints of Azure services.", fr: "Le peering privé atteint les réseaux virtuels, pas les points de terminaison publics des services Azure." }
references:
  - title: Configure route filters for Microsoft peering
    url: https://learn.microsoft.com/en-us/azure/expressroute/how-to-routefilter-portal
  - title: Configure peering for ExpressRoute circuit - Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-routing-arm
