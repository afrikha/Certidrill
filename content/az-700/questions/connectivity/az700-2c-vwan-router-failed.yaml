id: az700-2c-vwan-router-failed
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Standard virtual WAN. You create a virtual hub named **Hub-East** with a /23 address space. After the deployment, the Overview page of Hub-East shows the **Routing status** as **Failed**, and you can't update the routes of the hub.

    You need to bring the hub router back to a working state. The solution must minimize the impact on existing connections.

    What should you do?
  fr: |
    Contoso dispose d'un réseau étendu virtuel Standard. Vous créez un hub virtuel nommé **Hub-East** avec un espace d'adressage /23. Après le déploiement, la page Overview de Hub-East affiche l'état **Routing status** à **Failed**, et vous ne pouvez pas mettre à jour les routes du hub.

    Vous devez remettre le routeur du hub en état de fonctionnement. La solution doit réduire au minimum l'impact sur les connexions existantes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Increase the virtual hub capacity by one routing infrastructure unit.", fr: "Augmenter la capacité du hub virtuel d'une unité d'infrastructure de routage." } }
    - { id: b, text: { en: "Delete Hub-East and re-create it with a /22 address space.", fr: "Supprimer Hub-East et le recréer avec un espace d'adressage /22." } }
    - { id: c, text: { en: "Change the virtual WAN type on the Configuration page.", fr: "Changer le type de réseau étendu virtuel dans la page Configuration." } }
    - { id: d, text: { en: "Select Reset Router on the Overview page of Hub-East.", fr: "Sélectionner Reset Router dans la page Overview de Hub-East." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Failed routing status means the hub router failed during instantiation. The Reset Router option on the hub's Overview page brings the router back to its provisioning state; it typically takes less than 10 minutes and rarely disrupts traffic.
    fr: |
      Un état de routage Failed signifie que l'instanciation du routeur du hub a échoué. L'option Reset Router de la page Overview du hub ramène le routeur à son état d'approvisionnement ; l'opération prend généralement moins de 10 minutes et perturbe rarement le trafic.
  options:
    a:
      en: |
        Capacity sets the throughput and number of VMs the router supports; it doesn't repair a failed router.
      fr: |
        La capacité détermine le débit et le nombre de machines virtuelles pris en charge par le routeur ; elle ne répare pas un routeur en échec.
    b:
      en: |
        Re-creating the hub disrupts every connection; /22 is only required for Azure Firewall and isn't the cause of the failure.
      fr: |
        Recréer le hub interrompt toutes les connexions ; /22 n'est exigé que pour le Pare-feu Azure et n'est pas la cause de l'échec.
    c:
      en: |
        The virtual WAN is already Standard. A routing status of None, not Failed, is what a Basic virtual WAN shows.
      fr: |
        Le réseau étendu virtuel est déjà Standard. C'est l'état None, et non Failed, qu'affiche un réseau étendu virtuel Basic.
references:
  - title: About virtual hub routing
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/about-virtual-hub-routing
  - title: What is Azure Virtual WAN?
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-about
