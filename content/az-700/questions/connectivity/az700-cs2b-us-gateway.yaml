id: az700-cs2b-us-gateway
objective: "2.3.8"
type: dropdown
caseStudy: az700-cs2b-wide-world-importers
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You need to deploy ergw-eus2 in VNet-US. The solution must meet the requirements and minimize costs.

    What should you configure? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez déployer ergw-eus2 dans VNet-US. La solution doit respecter les exigences et réduire les coûts au minimum.

    Que devez-vous configurer ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Name of the subnet of ergw-eus2: [[subnet]]

      Smallest recommended size of the subnet: [[prefix]]

      Gateway SKU: [[sku]]
    fr: |
      Nom du sous-réseau de ergw-eus2 : [[subnet]]

      Plus petite taille recommandée du sous-réseau : [[prefix]]

      Référence SKU de la passerelle : [[sku]]
  slots:
    - id: subnet
      options:
        - { id: rss, text: RouteServerSubnet }
        - { id: gws, text: GatewaySubnet }
        - { id: afw, text: AzureFirewallSubnet }
    - id: prefix
      options:
        - { id: p29, text: /29 }
        - { id: p28, text: /28 }
        - { id: p27, text: /27 }
        - { id: p26, text: /26 }
    - id: sku
      options:
        - { id: gw1, text: ErGw1AZ }
        - { id: gw2, text: ErGw2AZ }
        - { id: gw3, text: ErGw3AZ }
        - { id: scale4, text: { en: "ErGwScale with 4 scale units", fr: "ErGwScale avec 4 unités d'échelle" } }
answer:
  values: { subnet: gws, prefix: p27, sku: gw3 }
explanation:
  correct:
    en: |
      An ExpressRoute gateway is deployed in a subnet that must be named GatewaySubnet, and Microsoft recommends /27 or larger (/26 to connect 16 circuits). ErGw1AZ supports about 1 Gbps and ErGw2AZ about 2 Gbps; ErGw3AZ supports 10 Gbps and is zone-redundant, so it is the only listed SKU that supports 5 Gbps.
    fr: |
      Une passerelle ExpressRoute est déployée dans un sous-réseau qui doit s'appeler GatewaySubnet, et Microsoft recommande /27 ou plus (/26 pour connecter 16 circuits). ErGw1AZ prend en charge environ 1 Gbit/s et ErGw2AZ environ 2 Gbit/s ; ErGw3AZ prend en charge 10 Gbit/s et est redondante interzone : c'est la seule référence SKU proposée qui prend en charge 5 Gbit/s.
  options:
    rss: { en: "RouteServerSubnet is reserved for Azure Route Server.", fr: "RouteServerSubnet est réservé à Azure Route Server." }
    afw: { en: "AzureFirewallSubnet is reserved for Azure Firewall.", fr: "AzureFirewallSubnet est réservé au Pare-feu Azure." }
    p28: { en: "A /28 is smaller than the /27 recommended for an ExpressRoute gateway.", fr: "Un /28 est plus petit que le /27 recommandé pour une passerelle ExpressRoute." }
    scale4: { en: "ErGwScale provides 1 Gbps per scale unit, so 4 scale units provide about 4 Gbps.", fr: "ErGwScale fournit 1 Gbit/s par unité d'échelle : 4 unités d'échelle fournissent donc environ 4 Gbit/s." }
references:
  - title: About ExpressRoute virtual network gateways
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-virtual-network-gateways
