id: az700-2c-vwan-routing-intent
objective: "2.4.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a Standard virtual WAN with two virtual hubs, **Hub-EU** and **Hub-US**. Each hub contains Azure Firewall, a site-to-site VPN gateway and an ExpressRoute gateway. All connections use the Default route table, and no custom route tables exist.

    Fabrikam wants Azure Firewall to inspect all traffic between virtual networks, between branches and virtual networks, and between the two hubs. You plan to configure routing intent and routing policies.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un réseau étendu virtuel Standard avec deux hubs virtuels, **Hub-EU** et **Hub-US**. Chaque hub contient un Pare-feu Azure, une passerelle VPN de site à site et une passerelle ExpressRoute. Toutes les connexions utilisent la table de routage Default, et il n'existe aucune table de routage personnalisée.

    Fabrikam souhaite que le Pare-feu Azure inspecte tout le trafic entre réseaux virtuels, entre branches et réseaux virtuels, et entre les deux hubs. Vous prévoyez de configurer l'intention de routage et des stratégies de routage.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Routing intent must be enabled on both Hub-EU and Hub-US for the inter-hub traffic to be inspected.", fr: "L'intention de routage doit être activée sur Hub-EU et sur Hub-US pour que le trafic entre les hubs soit inspecté." } }
    - { id: b, text: { en: "You must first create a custom route table in each hub to hold the routing policies.", fr: "Vous devez d'abord créer une table de routage personnalisée dans chaque hub pour contenir les stratégies de routage." } }
    - { id: c, text: { en: "Each hub can have at most one private traffic routing policy and one internet traffic routing policy.", fr: "Chaque hub peut avoir au plus une stratégie de routage du trafic privé et une stratégie de routage du trafic Internet." } }
    - { id: d, text: { en: "With an internet traffic routing policy on Hub-EU, the 0.0.0.0/0 route is also advertised to the connections of Hub-US.", fr: "Avec une stratégie de routage du trafic Internet sur Hub-EU, la route 0.0.0.0/0 est aussi publiée vers les connexions de Hub-US." } }
    - { id: e, text: { en: "You can keep static routes in the Default route table whose next hop is a virtual network connection.", fr: "Vous pouvez conserver dans la table de routage Default des routes statiques dont le tronçon suivant est une connexion de réseau virtuel." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Routing intent is the only way to inspect inter-hub traffic with a security appliance in the hub, and it must be enabled on all the hubs. Each hub supports at most one internet traffic routing policy and one private traffic routing policy, each with a single next hop resource.
    fr: |
      L'intention de routage est le seul moyen d'inspecter le trafic entre hubs avec une appliance de sécurité dans le hub, et elle doit être activée sur tous les hubs. Chaque hub prend en charge au plus une stratégie de routage du trafic Internet et une stratégie de routage du trafic privé, chacune avec une seule ressource de tronçon suivant.
  options:
    b:
      en: |
        Routing intent requires that no custom route tables be deployed in the hub; the policies populate the Default route table.
      fr: |
        L'intention de routage exige qu'aucune table de routage personnalisée ne soit déployée dans le hub ; les stratégies alimentent la table de routage Default.
    d:
      en: |
        The 0.0.0.0/0 route is never advertised across virtual hubs; each hub's internet policy applies to its own connections.
      fr: |
        La route 0.0.0.0/0 n'est jamais publiée d'un hub virtuel à l'autre ; la stratégie Internet de chaque hub s'applique à ses propres connexions.
    e:
      en: |
        Static routes in the Default route table that point to a virtual network connection can't be used with routing intent.
      fr: |
        Les routes statiques de la table de routage Default qui pointent vers une connexion de réseau virtuel ne peuvent pas être utilisées avec l'intention de routage.
references:
  - title: How to configure Virtual WAN Hub routing intent and routing policies
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/how-to-routing-policies
