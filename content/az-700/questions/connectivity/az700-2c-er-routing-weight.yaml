id: az700-2c-er-routing-weight
objective: "2.3.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a virtual network named **VNet1** that contains an ExpressRoute gateway. The gateway has the following connections:

    | Connection | Circuit | Peering location | Routing weight |
    | --- | --- | --- | --- |
    | Conn-AMS | ER-AMS | Amsterdam | 0 |
    | Conn-LON | ER-LON | London | 0 |

    The on-premises routers advertise the prefix 10.80.0.0/16 over the private peering of both circuits. The AS path received through ER-LON is shorter than the AS path received through ER-AMS, so VNet1 currently sends traffic for 10.80.0.0/16 through ER-LON.

    You need traffic from VNet1 to 10.80.0.0/16 to use ER-AMS while both circuits are available. The solution must not require any change to the on-premises routers.

    What should you do?
  fr: |
    Adatum dispose d'un réseau virtuel nommé **VNet1** qui contient une passerelle ExpressRoute. La passerelle a les connexions suivantes :

    | Connexion | Circuit | Emplacement de peering | Poids de routage |
    | --- | --- | --- | --- |
    | Conn-AMS | ER-AMS | Amsterdam | 0 |
    | Conn-LON | ER-LON | Londres | 0 |

    Les routeurs locaux publient le préfixe 10.80.0.0/16 sur le peering privé des deux circuits. Le chemin d'AS reçu par ER-LON est plus court que celui reçu par ER-AMS : VNet1 envoie donc actuellement le trafic à destination de 10.80.0.0/16 par ER-LON.

    Le trafic de VNet1 vers 10.80.0.0/16 doit emprunter ER-AMS tant que les deux circuits sont disponibles. La solution ne doit nécessiter aucune modification des routeurs locaux.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the routing weight of Conn-AMS to a value higher than the routing weight of Conn-LON.", fr: "Attribuer à Conn-AMS un poids de routage supérieur à celui de Conn-LON." } }
    - { id: b, text: { en: "Add a user-defined route for 10.80.0.0/16 with the next hop type Virtual network gateway to GatewaySubnet.", fr: "Ajouter à GatewaySubnet un itinéraire défini par l'utilisateur pour 10.80.0.0/16 avec le type de tronçon suivant Passerelle de réseau virtuel." } }
    - { id: c, text: { en: "Tag the 10.80.0.0/16 route on ER-AMS with the BGP community of the West Europe region.", fr: "Marquer la route 10.80.0.0/16 d'ER-AMS avec la communauté BGP de la région West Europe." } }
    - { id: d, text: { en: "Associate a route filter that allows 10.80.0.0/16 with the private peering of ER-AMS.", fr: "Associer au peering privé d'ER-AMS un filtre de routage qui autorise 10.80.0.0/16." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When the same prefix is received from several circuits, the gateway sends the traffic over the connection with the highest routing weight (0 to 32000, default 0). The weight is evaluated before the AS path length, so raising the weight of Conn-AMS makes it preferred without touching the on-premises routers.
    fr: |
      Quand le même préfixe est reçu par plusieurs circuits, la passerelle envoie le trafic par la connexion dont le poids de routage est le plus élevé (de 0 à 32000, 0 par défaut). Le poids est évalué avant la longueur du chemin d'AS : augmenter celui de Conn-AMS la rend préférée sans toucher aux routeurs locaux.
  options:
    d: { en: "Route filters select the Microsoft peering prefixes that you receive; they don't apply to private peering.", fr: "Les filtres de routage sélectionnent les préfixes du peering Microsoft que vous recevez ; ils ne s'appliquent pas au peering privé." }
    b: { en: "Such a route points to the gateway in general; it doesn't choose between the circuits linked to it.", fr: "Un tel itinéraire désigne la passerelle en général ; il ne choisit pas entre les circuits qui y sont liés." }
    c: { en: "Tagging routes requires a change on the on-premises routers, and Microsoft doesn't honor the community values you set on the routes you advertise.", fr: "Marquer les routes exige une modification des routeurs locaux, et Microsoft ne tient pas compte des valeurs de communauté que vous posez sur les routes que vous publiez." }
references:
