id: az700-cs1a-er-vpn-routing
objective: "2.1.2"
type: yesno_statements
caseStudy: az700-cs1a-litware-energy
difficulty: 3
status: draft
stem:
  en: |
    VpnGw-Hub and the site-to-site VPN connection are deployed as planned. Gateway transit is configured for VNet-Billing. ER-GRN and the VPN connection are both up.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    VpnGw-Hub et la connexion VPN de site à site sont déployées comme prévu. Le transit par passerelle est configuré pour VNet-Billing. ER-GRN et la connexion VPN sont tous deux actifs.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If the datacenter advertises 192.168.0.0/16 over both ER-GRN and the VPN connection, the virtual machines in VNet-Billing reach DC1 through ER-GRN.
        fr: Si le centre de données annonce 192.168.0.0/16 à la fois sur ER-GRN et sur la connexion VPN, les machines virtuelles de VNet-Billing joignent DC1 par ER-GRN.
    - id: s2
      text:
        en: If the datacenter advertises 192.168.0.0/16 over ER-GRN and 192.168.10.0/24 over the VPN connection, the virtual machines in VNet-Billing reach DC1 through ER-GRN.
        fr: Si le centre de données annonce 192.168.0.0/16 sur ER-GRN et 192.168.10.0/24 sur la connexion VPN, les machines virtuelles de VNet-Billing joignent DC1 par ER-GRN.
    - id: s3
      text:
        en: To make the datacenter send its traffic for Azure over ER-GRN rather than over the VPN connection, you can increase the routing weight of the ER-GRN connection in Azure.
        fr: Pour que le centre de données envoie son trafic destiné à Azure par ER-GRN plutôt que par la connexion VPN, vous pouvez augmenter le poids de routage de la connexion ER-GRN dans Azure.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: When the same prefix is learned over ExpressRoute and over a site-to-site VPN, Azure prefers the ExpressRoute path. Longest prefix match is evaluated first, so a more specific /24 learned over the VPN wins over the /16 learned over ExpressRoute, and traffic to DC1 uses the VPN. The routing weight of a connection only influences the path that Azure chooses toward on-premises; to make the datacenter prefer ExpressRoute, the on-premises routers raise the BGP local preference of the routes received over ExpressRoute.
    fr: Quand le même préfixe est appris par ExpressRoute et par un VPN de site à site, Azure préfère le chemin ExpressRoute. La correspondance de préfixe la plus longue est évaluée en premier ; un /24 plus spécifique appris par le VPN l'emporte donc sur le /16 appris par ExpressRoute, et le trafic vers DC1 utilise le VPN. Le poids de routage d'une connexion n'influence que le chemin choisi par Azure vers le site local ; pour que le centre de données préfère ExpressRoute, les routeurs locaux augmentent la préférence locale BGP des routes reçues par ExpressRoute.
references:
  - title: Using S2S VPN as a backup for ExpressRoute private peering
    url: https://learn.microsoft.com/en-us/azure/expressroute/use-s2s-vpn-as-backup-for-expressroute-privatepeering
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
