id: az700-2b-er-fastpath-spoke
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has the following resources in the West Europe region:

    | Resource | Configuration |
    | --- | --- |
    | VNet-Hub | ExpressRoute gateway with the ErGw3AZ SKU |
    | CKT1 | 10-Gbps ExpressRoute circuit bought from a connectivity provider, Standard SKU |
    | Conn1 | Connection between the gateway and CKT1, with FastPath enabled |
    | VNet-App | Spoke virtual network peered with VNet-Hub, **Use remote gateways** enabled |

    Connection Monitor shows that traffic from on-premises to the virtual machines in VNet-Hub bypasses the gateway, but traffic to the virtual machines in VNet-App still goes through the gateway.

    You need traffic from on-premises to the virtual machines in VNet-App to bypass the gateway.

    What should you do?
  fr: |
    Woodgrove dispose des ressources suivantes dans la région West Europe :

    | Ressource | Configuration |
    | --- | --- |
    | VNet-Hub | Passerelle ExpressRoute de référence SKU ErGw3AZ |
    | CKT1 | Circuit ExpressRoute de 10 Gbit/s acheté auprès d'un fournisseur de connectivité, référence SKU Standard |
    | Conn1 | Connexion entre la passerelle et CKT1, avec FastPath activé |
    | VNet-App | Réseau virtuel spoke relié par peering à VNet-Hub, **Utiliser des passerelles distantes** activé |

    Connection Monitor montre que le trafic du réseau local vers les machines virtuelles de VNet-Hub contourne la passerelle, mais que le trafic vers les machines virtuelles de VNet-App passe toujours par la passerelle.

    Vous devez faire en sorte que le trafic du réseau local vers les machines virtuelles de VNet-App contourne la passerelle.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace the gateway with an ErGwScale gateway that uses 10 scale units.", fr: "Remplacer la passerelle par une passerelle ErGwScale de 10 unités d'échelle." } }
    - { id: b, text: { en: "Upgrade CKT1 to the Premium SKU and recreate Conn1 with FastPath enabled.", fr: "Faire passer CKT1 à la référence SKU Premium et recréer Conn1 avec FastPath activé." } }
    - { id: c, text: { en: "Enable FastPath on the peering between VNet-App and VNet-Hub.", fr: "Activer FastPath sur le peering entre VNet-App et VNet-Hub." } }
    - { id: d, text: { en: "Connect VNet-Hub to an ExpressRoute Direct circuit and enable FastPath on that connection.", fr: "Connecter VNet-Hub à un circuit ExpressRoute Direct et activer FastPath sur cette connexion." } }
answer: { optionId: d }
explanation:
  correct:
    en: FastPath to virtual machines in the hub works with provider circuits, but virtual network peering over FastPath is supported only for ExpressRoute Direct circuits. Traffic to a spoke keeps going through the gateway until the hub is connected to an ExpressRoute Direct circuit with FastPath enabled on the connection.
    fr: "FastPath vers les machines virtuelles du hub fonctionne avec les circuits de fournisseur, mais le peering de réseaux virtuels avec FastPath n'est pris en charge que pour les circuits ExpressRoute Direct. Le trafic vers un spoke continue de passer par la passerelle tant que le hub n'est pas connecté à un circuit ExpressRoute Direct avec FastPath activé sur la connexion."
  options:
    a: { en: "ErGw3AZ already supports FastPath; ErGwScale doesn't add peering support for provider circuits.", fr: "ErGw3AZ prend déjà en charge FastPath ; ErGwScale n'ajoute pas la prise en charge du peering pour les circuits de fournisseur." }
    b: { en: "Premium changes the regional reach and limits of the circuit, not the FastPath features.", fr: "Premium modifie la portée régionale et les limites du circuit, pas les fonctionnalités de FastPath." }
    c: { en: "FastPath is a setting of the gateway connection, not of a virtual network peering.", fr: "FastPath est un paramètre de la connexion de passerelle, pas d'un peering de réseaux virtuels." }
references:
  - title: "Azure ExpressRoute FastPath: Features, availability, and limitations"
    url: https://learn.microsoft.com/en-us/azure/expressroute/about-fastpath
