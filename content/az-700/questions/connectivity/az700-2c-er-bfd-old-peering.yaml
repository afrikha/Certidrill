id: az700-2c-er-bfd-old-peering
objective: "2.3.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has an ExpressRoute circuit named **ER-Madrid**. Azure private peering was configured on the circuit in May 2018 and has not been modified since.

    The network engineers configure BFD on the interfaces of both on-premises edge routers and attach it to the BGP neighbors 192.168.30.2 and 192.168.30.6. The BGP sessions are established, but the BFD sessions never come up.

    You need BFD to protect both links of ER-Madrid.

    What should you do?
  fr: |
    Litware dispose d'un circuit ExpressRoute nommé **ER-Madrid**. Le peering privé Azure a été configuré sur le circuit en mai 2018 et n'a pas été modifié depuis.

    Les ingénieurs réseau configurent BFD sur les interfaces des deux routeurs de périphérie locaux et le rattachent aux voisins BGP 192.168.30.2 et 192.168.30.6. Les sessions BGP sont établies, mais les sessions BFD ne montent jamais.

    BFD doit protéger les deux liaisons d'ER-Madrid.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Delete and re-create the connection between the ExpressRoute gateway and ER-Madrid.", fr: "Supprimer puis recréer la connexion entre la passerelle ExpressRoute et ER-Madrid." } }
    - { id: b, text: { en: "Reset the Azure private peering of ER-Madrid.", fr: "Réinitialiser le peering privé Azure d'ER-Madrid." } }
    - { id: c, text: { en: "Enable BFD echo mode on both on-premises routers.", fr: "Activer le mode écho BFD sur les deux routeurs locaux." } }
    - { id: d, text: { en: "Resize the ExpressRoute gateway to a zone-redundant SKU.", fr: "Redimensionner la passerelle ExpressRoute vers une référence SKU redondante interzone." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      BFD is enabled by default on the MSEE interfaces only for IPv4 private peerings configured after August 2018. ER-Madrid's peering predates this, so the MSEEs don't run BFD and the customer-side sessions can't come up. Resetting the peering applies the current configuration, BFD included, to the MSEEs.
    fr: |
      BFD n'est activé par défaut sur les interfaces MSEE que pour les peerings privés IPv4 configurés après août 2018. Le peering d'ER-Madrid est antérieur : les MSEE n'exécutent pas BFD et les sessions côté client ne peuvent pas monter. La réinitialisation du peering applique la configuration actuelle, BFD compris, aux MSEE.
  options:
    a: { en: "BFD runs between the MSEEs and your edge routers on the peering; the gateway connection plays no part in it.", fr: "BFD fonctionne entre les MSEE et vos routeurs de périphérie sur le peering ; la connexion de la passerelle n'y joue aucun rôle." }
    c: { en: "Microsoft recommends disabling BFD echo mode for ExpressRoute because vendors handle it differently; it wouldn't enable BFD on the MSEEs.", fr: "Microsoft recommande de désactiver le mode écho BFD pour ExpressRoute, car les fabricants le gèrent différemment ; cela n'activerait pas BFD sur les MSEE." }
    d: { en: "The gateway SKU has no effect on BFD between the MSEEs and the on-premises routers.", fr: "La référence SKU de passerelle n'a aucun effet sur BFD entre les MSEE et les routeurs locaux." }
references:
  - title: Configure BFD over ExpressRoute
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-bfd
