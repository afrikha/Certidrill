id: az700-2a-p2s-tunnel-firewall
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders' sales staff connect to a virtual network named **VNet-CRM** from Windows 11 laptops, macOS laptops and Android tablets. They often work from hotels and customer sites whose networks allow only outbound TCP port 443.

    You need to select the point-to-site tunnel type for the VPN gateway.

    Which tunnel type should you select?
  fr: |
    Les commerciaux de Northwind Traders se connectent à un réseau virtuel nommé **VNet-CRM** depuis des ordinateurs portables Windows 11, des ordinateurs portables macOS et des tablettes Android. Ils travaillent souvent depuis des hôtels et des sites clients dont les réseaux n'autorisent en sortie que le port TCP 443.

    Vous devez sélectionner le type de tunnel de point à site de la passerelle VPN.

    Quel type de tunnel devez-vous sélectionner ?
body:
  options:
    - { id: a, text: IKEv2 }
    - { id: b, text: SSTP (SSL) }
    - { id: c, text: OpenVPN (SSL) }
    - { id: d, text: IKEv2 and SSTP (SSL) }
answer: { optionId: c }
explanation:
  correct:
    en: |
      OpenVPN is a TLS-based protocol that uses outbound TCP 443, which most firewalls allow, and it supports Windows, macOS, Linux, iOS and Android clients. It's the only option that covers every device type over port 443.
    fr: |
      OpenVPN est un protocole basé sur TLS qui utilise le port TCP 443 sortant, ouvert par la plupart des pare-feu, et il prend en charge les clients Windows, macOS, Linux, iOS et Android. C'est la seule option qui couvre tous les types d'appareils sur le port 443.
  options:
    a: { en: "IKEv2 uses UDP 500 and 4500, which the hotel and customer networks block.", fr: "IKEv2 utilise UDP 500 et 4500, bloqués par les réseaux des hôtels et des sites clients." }
    b: { en: "SSTP uses TCP 443 but supports only Windows clients, and it's being retired.", fr: "SSTP utilise TCP 443 mais ne prend en charge que les clients Windows, et il est en cours de mise hors service." }
    d: { en: "macOS and Android clients can't use SSTP, and IKEv2 is blocked by the hotel firewalls.", fr: "Les clients macOS et Android ne peuvent pas utiliser SSTP, et IKEv2 est bloqué par les pare-feu des hôtels." }
references:
  - title: About Point-to-Site VPN
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about
