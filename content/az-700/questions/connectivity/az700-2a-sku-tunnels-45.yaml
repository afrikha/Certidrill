id: az700-2a-sku-tunnels-45
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is deploying a new VPN gateway in a hub virtual network named **VNet-Hub**. The gateway must support the following:

    - 45 site-to-site VPN tunnels to branch offices
    - BGP
    - Zone redundancy

    You need to select the gateway SKU. The solution must minimize costs.

    Which SKU should you select?
  fr: |
    Tailspin Toys déploie une nouvelle passerelle VPN dans un réseau virtuel hub nommé **VNet-Hub**. La passerelle doit prendre en charge :

    - 45 tunnels VPN de site à site vers les succursales
    - BGP
    - La redondance interzone

    Vous devez sélectionner la référence SKU de la passerelle. La solution doit réduire les coûts au minimum.

    Quelle référence SKU devez-vous sélectionner ?
body:
  options:
    - { id: a, text: VpnGw1AZ }
    - { id: b, text: VpnGw2AZ }
    - { id: c, text: VpnGw3AZ }
    - { id: d, text: VpnGw4AZ }
    - { id: e, text: VpnGw5AZ }
shuffle: false
answer: { optionId: d }
explanation:
  correct:
    en: |
      VpnGw1AZ, VpnGw2AZ and VpnGw3AZ support a maximum of 30 site-to-site tunnels. VpnGw4AZ and VpnGw5AZ support up to 100 tunnels, and VpnGw4AZ is the cheaper of the two. All these AZ SKUs support BGP and zone redundancy.
    fr: |
      VpnGw1AZ, VpnGw2AZ et VpnGw3AZ prennent en charge 30 tunnels de site à site au maximum. VpnGw4AZ et VpnGw5AZ en acceptent jusqu'à 100, et VpnGw4AZ est la moins chère des deux. Toutes ces références AZ prennent en charge BGP et la redondance interzone.
  options:
    a: { en: "Limited to 30 site-to-site tunnels.", fr: "Limitée à 30 tunnels de site à site." }
    b: { en: "Limited to 30 site-to-site tunnels.", fr: "Limitée à 30 tunnels de site à site." }
    c: { en: "Limited to 30 site-to-site tunnels.", fr: "Limitée à 30 tunnels de site à site." }
    e: { en: "Supports the requirement but costs more than VpnGw4AZ.", fr: "Répond au besoin mais coûte plus cher que VpnGw4AZ." }
references:
  - title: About gateway SKUs
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-gateway-skus
