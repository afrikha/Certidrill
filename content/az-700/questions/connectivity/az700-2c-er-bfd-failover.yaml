id: az700-2c-er-bfd-failover
objective: "2.3.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an ExpressRoute circuit with Azure private peering configured in 2024. The primary and secondary links terminate on two on-premises edge routers. The routers use the default BGP timers.

    During a test, the provider shut down the primary link. Traffic took almost three minutes to move to the secondary link.

    You need to detect a link failure in less than one second. The solution must avoid adding processing load to the BGP process on the routers.

    What should you do?
  fr: |
    Contoso dispose d'un circuit ExpressRoute dont le peering privé Azure a été configuré en 2024. Les liaisons principale et secondaire aboutissent sur deux routeurs de périphérie locaux. Les routeurs utilisent les minuteurs BGP par défaut.

    Lors d'un test, le fournisseur a coupé la liaison principale. Le trafic a mis près de trois minutes à basculer sur la liaison secondaire.

    Vous devez détecter une panne de liaison en moins d'une seconde. La solution doit éviter d'ajouter de la charge de traitement au processus BGP des routeurs.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the BGP keepalive and hold time on both routers to 3 and 10 seconds.", fr: "Régler le keepalive et le temps de maintien BGP des deux routeurs sur 3 et 10 secondes." } }
    - { id: b, text: { en: "Enable FastPath on the connection between the gateway and the circuit.", fr: "Activer FastPath sur la connexion entre la passerelle et le circuit." } }
    - { id: c, text: { en: "Enable ExpressRoute Global Reach on the circuit.", fr: "Activer ExpressRoute Global Reach sur le circuit." } }
    - { id: d, text: { en: "Enable BFD on both routers and link it to their BGP sessions.", fr: "Activer BFD sur les deux routeurs et le lier à leurs sessions BGP." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With the default BGP timers (keepalive 60 seconds, hold time 180 seconds on the MSEEs), detecting a failure can take up to three minutes. BFD detects link failures in a subsecond interval with low overhead. It is already enabled on the MSEE interfaces of a private peering configured in 2024, so you only configure it on your routers' interfaces and attach it to the BGP neighbors.
    fr: |
      Avec les minuteurs BGP par défaut (keepalive de 60 secondes, temps de maintien de 180 secondes sur les MSEE), la détection d'une panne peut prendre jusqu'à trois minutes. BFD détecte les pannes de liaison en moins d'une seconde avec une faible surcharge. Il est déjà activé sur les interfaces MSEE d'un peering privé configuré en 2024 : vous le configurez seulement sur les interfaces de vos routeurs et le rattachez aux voisins BGP.
  options:
    a: { en: "Aggressive BGP timers still need several seconds to detect a failure and are not recommended because BGP is process intensive.", fr: "Des minuteurs BGP agressifs demandent encore plusieurs secondes pour détecter une panne et sont déconseillés, car BGP est gourmand en traitement." }
    b: { en: "FastPath bypasses the gateway for data traffic; it doesn't change failure detection between the routers and the MSEEs.", fr: "FastPath contourne la passerelle pour le trafic de données ; il ne change pas la détection des pannes entre les routeurs et les MSEE." }
    c: { en: "Global Reach links on-premises sites through circuits; it has no effect on failover between the two links of a circuit.", fr: "Global Reach relie des sites locaux par des circuits ; il n'a aucun effet sur le basculement entre les deux liaisons d'un circuit." }
references:
  - title: Configure BFD over ExpressRoute
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-bfd
