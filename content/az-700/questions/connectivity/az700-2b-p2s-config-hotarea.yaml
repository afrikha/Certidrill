id: az700-2b-p2s-config-hotarea
objective: "2.2.7"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Adatum has a route-based VPN gateway named **VPNGW1** (SKU VpnGw2AZ) in a hub virtual network. The point-to-site configuration of VPNGW1 and the related settings are shown in the following table. The root certificate isn't revoked and its public key was checked and is correct.

    Users report two problems:

    - Windows users who connect with IKEv2 and certificate authentication receive the error "The message received was unexpected or badly formatted. (Error 0x80090326)".
    - Users of the Azure VPN Client who use Microsoft Entra ID authentication can't connect.

    Answer each prompt by selecting the setting that you must change.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'une passerelle VPN basée sur des routes nommée **VPNGW1** (référence SKU VpnGw2AZ) dans un réseau virtuel hub. La configuration de point à site de VPNGW1 et les paramètres associés figurent dans le tableau suivant. Le certificat racine n'est pas révoqué et sa clé publique a été vérifiée : elle est correcte.

    Les utilisateurs signalent deux problèmes :

    - Les utilisateurs Windows qui se connectent en IKEv2 avec l'authentification par certificat reçoivent l'erreur « The message received was unexpected or badly formatted. (Error 0x80090326) ».
    - Les utilisateurs d'Azure VPN Client qui utilisent l'authentification Microsoft Entra ID ne parviennent pas à se connecter.

    Répondez à chaque consigne en sélectionnant le paramètre que vous devez modifier.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Resolves error 0x80090326 for the IKEv2 users", fr: "Résout l'erreur 0x80090326 des utilisateurs IKEv2" }
    - id: p2
      text: { en: "Resolves the connection failures of the Microsoft Entra ID users", fr: "Résout les échecs de connexion des utilisateurs Microsoft Entra ID" }
  grid:
    header: [{ en: "Setting", fr: "Paramètre" }, { en: "Value", fr: "Valeur" }]
    rows:
      - [{ text: { en: "Address pool", fr: "Pool d'adresses" } }, { text: "172.16.60.0/24", area: pool }]
      - [{ text: { en: "Tunnel type", fr: "Type de tunnel" } }, { text: { en: "IKEv2 and OpenVPN (SSL)", fr: "IKEv2 et OpenVPN (SSL)" }, area: tunnel }]
      - [{ text: { en: "Root certificate", fr: "Certificat racine" } }, { text: "P2SRootCert", area: root }]
      - [{ text: "Tenant" }, { text: "https://login.microsoftonline.com/6b1f0c2e-9a7d-4e35-8c41-d2f7a9b3e815", area: tenant }]
      - [{ text: "Audience" }, { text: "c632b3df-fb67-4d84-bdcf-b95ad541b5c8", area: audience }]
      - [{ text: "Issuer" }, { text: "https://sts.windows.net/6b1f0c2e-9a7d-4e35-8c41-d2f7a9b3e815", area: issuer }]
      - [{ text: { en: "Route table associated with GatewaySubnet", fr: "Table de routage associée à GatewaySubnet" } }, { text: { en: "RT-Hub: 0.0.0.0/0, next hop Virtual appliance 10.0.3.4", fr: "RT-Hub : 0.0.0.0/0, tronçon suivant Appliance virtuelle 10.0.3.4" }, area: udr }]
answer:
  values: { p1: udr, p2: issuer }
explanation:
  correct:
    en: Error 0x80090326 is caused either by a root certificate that is missing or corrupted, or by a user-defined route with a default route on GatewaySubnet. The root certificate is correct, so the RT-Hub default route must be removed from GatewaySubnet. For Microsoft Entra ID, the Issuer value must end with a trailing slash (`https://sts.windows.net/{TenantID}/`); without it, connections can fail.
    fr: "L'erreur 0x80090326 vient soit d'un certificat racine absent ou endommagé, soit d'un itinéraire défini par l'utilisateur avec une route par défaut sur GatewaySubnet. Le certificat racine est correct : il faut donc retirer l'itinéraire par défaut de RT-Hub sur GatewaySubnet. Pour Microsoft Entra ID, la valeur Issuer doit se terminer par une barre oblique (`https://sts.windows.net/{TenantID}/`) ; sans elle, les connexions peuvent échouer."
  options:
    tunnel: { en: "IKEv2 and OpenVPN (SSL) is a valid combination: IKEv2 serves certificate users and OpenVPN serves Entra ID users.", fr: "IKEv2 et OpenVPN (SSL) est une combinaison valide : IKEv2 sert les utilisateurs par certificat et OpenVPN les utilisateurs Entra ID." }
    audience: { en: "c632b3df-… is the Microsoft-registered Azure VPN Client audience and is correct.", fr: "c632b3df-… est l'audience d'Azure VPN Client inscrite par Microsoft ; elle est correcte." }
references:
  - title: Troubleshoot Azure point-to-site connection problems - Azure VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-troubleshoot-vpn-point-to-site-connection-problems
  - title: "Configure P2S VPN gateway for Microsoft Entra ID authentication: Microsoft-registered client - Azure VPN Gateway"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-entra-gateway
