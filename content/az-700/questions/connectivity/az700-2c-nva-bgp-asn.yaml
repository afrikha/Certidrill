id: az700-2c-nva-bgp-asn
objective: "2.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a Standard virtual WAN with a virtual hub named **Hub-EU**. A virtual network named **VNet-Transit** is directly connected to Hub-EU and contains a third-party firewall NVA named **NVA1**. NVA1 routes traffic to several virtual networks that are peered with VNet-Transit but not connected to the hub.

    You need NVA1 to advertise the prefixes of those virtual networks to Hub-EU dynamically, without static routes in the hub. You plan to configure BGP peering between NVA1 and the hub router.

    Which autonomous system number (ASN) should you configure on NVA1?
  fr: |
    Proseware dispose d'un réseau étendu virtuel Standard avec un hub virtuel nommé **Hub-EU**. Un réseau virtuel nommé **VNet-Transit** est directement connecté à Hub-EU et contient une NVA de pare-feu tierce nommée **NVA1**. NVA1 route le trafic vers plusieurs réseaux virtuels reliés à VNet-Transit par peering, mais non connectés au hub.

    NVA1 doit publier dynamiquement vers Hub-EU les préfixes de ces réseaux virtuels, sans routes statiques dans le hub. Vous prévoyez de configurer un peering BGP entre NVA1 et le routeur du hub.

    Quel numéro de système autonome (ASN) devez-vous configurer sur NVA1 ?
body:
  options:
    - { id: a, text: "65515" }
    - { id: b, text: "4200000100" }
    - { id: c, text: "12076" }
    - { id: d, text: "65010" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The virtual hub router supports only 16-bit ASNs, and the NVA's ASN must differ from the hub ASN and avoid the reserved ranges. 65010 is a 16-bit private ASN outside the Azure and IANA reserved values. NVA1 must then peer with both hub router IP addresses and advertise the same routes to both.
    fr: |
      Le routeur du hub virtuel ne prend en charge que des ASN 16 bits, et l'ASN de la NVA doit différer de celui du hub et éviter les plages réservées. 65010 est un ASN privé 16 bits hors des valeurs réservées par Azure et l'IANA. NVA1 doit ensuite établir le peering avec les deux adresses IP du routeur du hub et leur publier les mêmes routes.
  options:
    a:
      en: |
        65515 is in the private range that Azure reserves for its internal use (65515 to 65520).
      fr: |
        65515 appartient à la plage privée qu'Azure réserve à son usage interne (65515 à 65520).
    b:
      en: |
        This is a 32-bit ASN, and the virtual hub router supports only 16-bit ASNs.
      fr: |
        Il s'agit d'un ASN 32 bits, alors que le routeur du hub virtuel ne prend en charge que des ASN 16 bits.
    c:
      en: |
        12076 is a public ASN reserved by Azure (used by Microsoft for ExpressRoute).
      fr: |
        12076 est un ASN public réservé par Azure (utilisé par Microsoft pour ExpressRoute).
references:
  - title: "Scenario: BGP peering with a virtual hub"
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/scenario-bgp-peering-hub
