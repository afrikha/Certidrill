id: az700-2a-p2s-tunnel-facts
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    In November 2026, Adatum Corporation reviews the point-to-site configuration of a route-based VPN gateway named **GW-Adatum** (VpnGw3AZ). The tunnel type is currently **IKEv2 and OpenVPN (SSL)**, and the authentication types are **Azure certificate** and **Microsoft Entra ID**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    En novembre 2026, Adatum Corporation examine la configuration de point à site d'une passerelle VPN basée sur des itinéraires nommée **GW-Adatum** (VpnGw3AZ). Le type de tunnel est actuellement **IKEv2 and OpenVPN (SSL)**, et les types d'authentification sont **Azure certificate** et **Microsoft Entra ID**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Clients that authenticate with Microsoft Entra ID connect by using the OpenVPN tunnel.
        fr: Les clients qui s'authentifient avec Microsoft Entra ID se connectent par le tunnel OpenVPN.
    - id: s2
      text:
        en: IKEv2 clients need outbound UDP ports 500 and 4500 to be open on their network.
        fr: Les clients IKEv2 ont besoin que les ports UDP 500 et 4500 soient ouverts en sortie sur leur réseau.
    - id: s3
      text:
        en: You can change the tunnel type of GW-Adatum to IKEv2 and SSTP (SSL) to support older Windows clients.
        fr: Vous pouvez changer le type de tunnel de GW-Adatum en IKEv2 and SSTP (SSL) pour prendre en charge d'anciens clients Windows.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      When several tunnel and authentication types are selected, Microsoft Entra ID uses only OpenVPN, because IKEv2 doesn't support it. IKEv2 is an IPsec solution that uses outbound UDP 500 and 4500, which firewalls don't always open. SSTP is being retired: since August 31, 2026, enabling SSTP on a VPN gateway is no longer supported, and existing SSTP connections stop on March 31, 2027.
    fr: |
      Quand plusieurs types de tunnel et d'authentification sont sélectionnés, Microsoft Entra ID utilise uniquement OpenVPN, car IKEv2 ne le prend pas en charge. IKEv2 est une solution IPsec qui utilise les ports UDP 500 et 4500 en sortie, que les pare-feu n'ouvrent pas toujours. SSTP est en cours de mise hors service : depuis le 31 août 2026, l'activation de SSTP sur une passerelle VPN n'est plus prise en charge, et les connexions SSTP existantes s'arrêtent le 31 mars 2027.
references:
  - title: About Point-to-Site VPN
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about
  - title: SSTP protocol retirement and connections migration
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/ikev2-openvpn-from-sstp
