id: az700-2b-er-routefilter-order
objective: "2.3.7"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an ExpressRoute circuit named **CKT1** in West Europe with the Standard SKU. CKT1 is provisioned and enabled, and Microsoft peering is configured. No route filter exists.

    You need the on-premises network to receive only the prefixes of the Azure services in the West Europe and North Europe regions over the Microsoft peering.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'un circuit ExpressRoute nommé **CKT1** dans West Europe, de référence SKU Standard. CKT1 est approvisionné et activé, et le peering Microsoft est configuré. Aucun filtre de routage n'existe.

    Vous devez faire en sorte que le réseau local ne reçoive par le peering Microsoft que les préfixes des services Azure des régions West Europe et North Europe.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Create a route filter in the same location as CKT1.", fr: "Créer un filtre de routage au même emplacement que CKT1." } }
    - { id: rule, text: { en: "Add a rule of type Allow that lists the BGP communities of West Europe and North Europe.", fr: "Ajouter une règle de type Allow qui liste les communautés BGP de West Europe et de North Europe." } }
    - { id: attach, text: { en: "Attach the route filter to the Microsoft peering of CKT1.", fr: "Attacher le filtre de routage au peering Microsoft de CKT1." } }
    - { id: deny, text: { en: "Add a rule of type Deny for the communities of the other regions.", fr: "Ajouter une règle de type Deny pour les communautés des autres régions." } }
    - { id: private, text: { en: "Attach the route filter to the Azure private peering of CKT1.", fr: "Attacher le filtre de routage au peering privé Azure de CKT1." } }
    - { id: premium, text: { en: "Upgrade CKT1 to the Premium SKU.", fr: "Faire passer CKT1 à la référence SKU Premium." } }
answer:
  sequence: [ create, rule, attach ]
explanation:
  correct:
    en: A route filter is created in the location of the circuit, then given its rule, and finally attached to the circuit's Microsoft peering. It acts as an allowlist; once attached, Microsoft advertises the prefixes that match the listed communities.
    fr: "Un filtre de routage se crée à l'emplacement du circuit, reçoit ensuite sa règle, puis est attaché au peering Microsoft du circuit. Il fonctionne comme une liste d'autorisation ; une fois attaché, Microsoft publie les préfixes qui correspondent aux communautés listées."
  options:
    deny: { en: "A route filter has only one rule, and that rule must be of type Allow.", fr: "Un filtre de routage n'a qu'une règle, et cette règle doit être de type Allow." }
    private: { en: "Route filters apply to Microsoft peering only.", fr: "Les filtres de routage ne s'appliquent qu'au peering Microsoft." }
    premium: { en: "Both regions are in the circuit's geopolitical area, and no Microsoft 365 service is requested.", fr: "Les deux régions sont dans la zone géopolitique du circuit, et aucun service Microsoft 365 n'est demandé." }
references:
  - title: Configure route filters for Microsoft peering
    url: https://learn.microsoft.com/en-us/azure/expressroute/how-to-routefilter-portal
