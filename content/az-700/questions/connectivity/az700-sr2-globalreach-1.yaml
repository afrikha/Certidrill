id: az700-sr2-globalreach-1
objective: "2.3.4"
type: series_yesno
series: az700-sr2-globalreach
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You upgrade both circuits to the Premium tier.
  fr: Vous passez les deux circuits au niveau Premium.
body:
  solution:
    en: |
      You change the tier of ER-PAR and ER-AMS from Standard to Premium. You make no other change.
    fr: |
      Vous faites passer le niveau d'ER-PAR et d'ER-AMS de Standard à Premium. Vous n'apportez aucune autre modification.
answer: { value: false }
explanation:
  correct:
    en: |
      Premium extends the reach of a circuit to other geopolitical regions and raises its limits, but it doesn't connect on-premises networks to each other. Two sites that use two circuits linked to the same virtual network still can't communicate until the circuits are connected explicitly with Global Reach.
    fr: |
      Premium étend la portée d'un circuit aux autres régions géopolitiques et relève ses limites, mais il ne connecte pas les réseaux sur site entre eux. Deux sites qui utilisent deux circuits liés au même réseau virtuel ne peuvent toujours pas communiquer tant que les circuits ne sont pas connectés explicitement avec Global Reach.
references:
  - title: About ExpressRoute Global Reach
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-global-reach
