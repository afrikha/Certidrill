id: az700-2b-er-model-statements
objective: "2.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso is comparing ExpressRoute connectivity models before ordering a circuit. The network team wants to understand who configures routing in each model.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso compare les modèles de connectivité ExpressRoute avant de commander un circuit. L'équipe réseau veut comprendre qui configure le routage dans chaque modèle.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When a provider sells a managed Layer 3 IPVPN service, the provider can configure the ExpressRoute peerings on your behalf.
        fr: Quand un opérateur vend un service IPVPN de couche 3 managé, il peut configurer les peerings ExpressRoute pour votre compte.
    - id: s2
      text:
        en: With a Layer 2 point-to-point Ethernet connection, Contoso configures and manages the BGP sessions with Microsoft.
        fr: Avec une connexion Ethernet point à point de couche 2, Contoso configure et gère les sessions BGP avec Microsoft.
    - id: s3
      text:
        en: An ExpressRoute Direct port pair must be ordered through a connectivity provider that runs the routing with Microsoft.
        fr: Une paire de ports ExpressRoute Direct doit être commandée auprès d'un fournisseur de connectivité qui gère le routage avec Microsoft.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: With a managed Layer 3 service, the provider configures and manages routing, and you can ask it to enable private or Microsoft peering. With a Layer 2 provider, you configure and manage routing yourself, including both BGP sessions of each peering. ExpressRoute Direct connects your own equipment directly to the Microsoft global network at a peering location, so you create the circuits and run BGP yourself.
    fr: "Avec un service de couche 3 managé, l'opérateur configure et gère le routage, et vous pouvez lui demander d'activer le peering privé ou Microsoft. Avec un fournisseur de couche 2, vous configurez et gérez le routage vous-même, y compris les deux sessions BGP de chaque peering. ExpressRoute Direct relie vos propres équipements directement au réseau mondial de Microsoft dans un emplacement de peering : vous créez les circuits et gérez BGP vous-même."
references:
  - title: "Azure ExpressRoute: circuits and peering"
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-circuit-peerings
  - title: Configure peering for ExpressRoute circuit - Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-routing-arm
