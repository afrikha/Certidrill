id: az700-2b-profile-folders
objective: "2.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip has a route-based VPN gateway named **VPNGW1**. Its point-to-site configuration uses the tunnel type **IKEv2 and OpenVPN (SSL)** and two authentication types: **Azure certificate** and **Microsoft Entra ID**. You select **Download VPN client** and extract the generated zip file.

    You need to give each group of users the files that configure its VPN client.

    Which folder should you use for each group? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip dispose d'une passerelle VPN basée sur des routes nommée **VPNGW1**. Sa configuration de point à site utilise le type de tunnel **IKEv2 et OpenVPN (SSL)** et deux types d'authentification : **Certificat Azure** et **Microsoft Entra ID**. Vous sélectionnez **Télécharger le client VPN** et extrayez le fichier zip généré.

    Vous devez remettre à chaque groupe d'utilisateurs les fichiers qui configurent son client VPN.

    Quel dossier devez-vous utiliser pour chaque groupe ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Windows 11 users of the native Windows VPN client, certificate authentication: [[win]]

      macOS users of the native macOS VPN client, certificate authentication: [[mac]]

      Users of the Azure VPN Client, Microsoft Entra ID authentication: [[azvpn]]
    fr: |
      Utilisateurs Windows 11 du client VPN natif de Windows, authentification par certificat : [[win]]

      Utilisateurs macOS du client VPN natif de macOS, authentification par certificat : [[mac]]

      Utilisateurs d'Azure VPN Client, authentification Microsoft Entra ID : [[azvpn]]
  slots:
    - id: win
      options:
        - { id: windows, text: "WindowsAmd64 (VpnClientSetupAmd64)" }
        - { id: generic, text: "Generic (VpnSettings.xml)" }
        - { id: azurevpn, text: "AzureVPN (azurevpnconfig.xml)" }
        - { id: openvpn, text: "OpenVPN (vpnconfig.ovpn)" }
    - id: mac
      options:
        - { id: windows, text: "WindowsAmd64 (VpnClientSetupAmd64)" }
        - { id: generic, text: "Generic (VpnSettings.xml)" }
        - { id: azurevpn, text: "AzureVPN (azurevpnconfig.xml)" }
        - { id: openvpn, text: "OpenVPN (vpnconfig.ovpn)" }
    - id: azvpn
      options:
        - { id: windows, text: "WindowsAmd64 (VpnClientSetupAmd64)" }
        - { id: generic, text: "Generic (VpnSettings.xml)" }
        - { id: azurevpn, text: "AzureVPN (azurevpnconfig.xml)" }
        - { id: openvpn, text: "OpenVPN (vpnconfig.ovpn)" }
answer:
  values: { win: windows, mac: generic, azvpn: azurevpn }
explanation:
  correct:
    en: The native Windows client is configured by the installer in WindowsAmd64, which sets up an IKEv2 connection. Native macOS clients use IKEv2 and are configured manually from VpnSettings.xml and the server root certificate in the Generic folder. The Azure VPN Client imports azurevpnconfig.xml from the AzureVPN folder, which carries the Microsoft Entra ID settings.
    fr: "Le client Windows natif est configuré par le programme d'installation du dossier WindowsAmd64, qui crée une connexion IKEv2. Les clients macOS natifs utilisent IKEv2 et se configurent manuellement à partir de VpnSettings.xml et du certificat racine du serveur du dossier Generic. Azure VPN Client importe azurevpnconfig.xml depuis le dossier AzureVPN, qui contient les paramètres Microsoft Entra ID."
  options:
    openvpn: { en: "vpnconfig.ovpn configures an OpenVPN client with certificate authentication; no group here uses an OpenVPN client.", fr: "vpnconfig.ovpn configure un client OpenVPN avec authentification par certificat ; aucun groupe ici n'utilise de client OpenVPN." }
references:
  - title: Configure a VPN client for P2S certificate authentication connections - Azure VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-vpn-client-certificate-windows-native
  - title: P2S VPN client profile configuration files - Microsoft Entra authentication - Azure VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-vpn-profile-download
