id: az700-sr2-globalreach-3
objective: "2.3.4"
type: series_yesno
series: az700-sr2-globalreach
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You enable FastPath on the circuit connections of ERGW1.
  fr: Vous activez FastPath sur les connexions de circuit d'ERGW1.
body:
  solution:
    en: |
      You enable FastPath on the connection between ERGW1 and ER-PAR and on the connection between ERGW1 and ER-AMS.
    fr: |
      Vous activez FastPath sur la connexion entre ERGW1 et ER-PAR et sur la connexion entre ERGW1 et ER-AMS.
answer: { value: false }
explanation:
  correct:
    en: |
      FastPath only changes the data path between on-premises networks and the virtual machines, which then bypasses the gateway; ERGW1 still exchanges the routes. It doesn't make the circuits exchange routes with each other, so the offices still can't communicate. Global Reach is the feature that connects the two sites.
    fr: |
      FastPath modifie uniquement le chemin des données entre les réseaux sur site et les machines virtuelles, qui contourne alors la passerelle ; ERGW1 échange toujours les routes. Il ne fait pas échanger de routes entre les circuits : les bureaux ne peuvent toujours pas communiquer. C'est Global Reach qui connecte les deux sites.
references:
  - title: "Azure ExpressRoute FastPath: Features, availability, and limitations"
    url: https://learn.microsoft.com/en-us/azure/expressroute/about-fastpath
  - title: About ExpressRoute Global Reach
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-global-reach
