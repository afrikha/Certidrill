id: az700-2a-lng-add-prefix
objective: "2.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a local network gateway named **Site-Madrid** in a resource group named **RG-VPN**. Its address space currently contains 10.101.0.0/24. The Madrid office adds a new network, 10.101.1.0/24, that must also be reachable through the site-to-site VPN. The existing network must remain reachable. The other ranges of 10.101.0.0/16 are used by other offices.

    You need to update Site-Madrid by using Azure PowerShell.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une passerelle de réseau local nommée **Site-Madrid** dans un groupe de ressources nommé **RG-VPN**. Son espace d'adressage contient actuellement 10.101.0.0/24. Le bureau de Madrid ajoute un nouveau réseau, 10.101.1.0/24, qui doit aussi être joignable par le VPN de site à site. Le réseau existant doit rester joignable. Les autres plages de 10.101.0.0/16 sont utilisées par d'autres bureaux.

    Vous devez mettre à jour Site-Madrid avec Azure PowerShell.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $local = Get-AzLocalNetworkGateway -Name Site-Madrid -ResourceGroupName RG-VPN
    [[cmd]] -LocalNetworkGateway $local `
      -AddressPrefix [[pfx]]
  slots:
    - id: cmd
      options:
        - { id: setlng, text: Set-AzLocalNetworkGateway }
        - { id: setvng, text: Set-AzVirtualNetworkGateway }
        - { id: setconn, text: Set-AzVirtualNetworkGatewayConnection }
        - { id: newlng, text: New-AzLocalNetworkGateway }
    - id: pfx
      options:
        - { id: onlynew, text: "@('10.101.1.0/24')" }
        - { id: both, text: "@('10.101.0.0/24','10.101.1.0/24')" }
        - { id: summary, text: "@('10.101.0.0/16')" }
answer:
  values: { cmd: setlng, pfx: both }
explanation:
  correct:
    en: |
      `Set-AzLocalNetworkGateway` updates an existing local network gateway passed with `-LocalNetworkGateway`. The values of `-AddressPrefix` overwrite the previous list, so you must specify both the existing prefix and the new one.
    fr: |
      `Set-AzLocalNetworkGateway` met à jour une passerelle de réseau local existante passée avec `-LocalNetworkGateway`. Les valeurs de `-AddressPrefix` remplacent la liste précédente : vous devez indiquer à la fois le préfixe existant et le nouveau.
  options:
    setvng: { en: "Set-AzVirtualNetworkGateway updates the Azure VPN gateway, not the on-premises prefixes.", fr: "Set-AzVirtualNetworkGateway met à jour la passerelle VPN Azure, pas les préfixes locaux." }
    setconn: { en: "The on-premises prefixes are a property of the local network gateway, not of the connection.", fr: "Les préfixes locaux sont une propriété de la passerelle de réseau local, pas de la connexion." }
    newlng: { en: "New-AzLocalNetworkGateway has no -LocalNetworkGateway parameter; it takes a name, a location and a gateway IP address.", fr: "New-AzLocalNetworkGateway n'a pas de paramètre -LocalNetworkGateway ; il attend un nom, un emplacement et une adresse IP de passerelle." }
    onlynew: { en: "The list replaces the existing prefixes, so 10.101.0.0/24 would stop being routed to Madrid.", fr: "La liste remplace les préfixes existants : 10.101.0.0/24 ne serait plus routé vers Madrid." }
    summary: { en: "A /16 would route the whole 10.101.0.0/16 range to Madrid, including ranges used by other offices.", fr: "Un /16 routerait toute la plage 10.101.0.0/16 vers Madrid, y compris des plages utilisées par d'autres bureaux." }
references:
  - title: Create a site-to-site VPN connection - Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-create-site-to-site-rm-powershell
