id: az700-2a-sku-az-generation
objective: "2.1.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    In November 2026, Proseware plans to deploy VPN gateways for site-to-site connections in several Azure regions. Some of the regions don't support availability zones.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    En novembre 2026, Proseware prévoit de déployer des passerelles VPN pour des connexions de site à site dans plusieurs régions Azure. Certaines de ces régions ne prennent pas en charge les zones de disponibilité.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can create a new VPN gateway that uses the VpnGw2 SKU.
        fr: Vous pouvez créer une nouvelle passerelle VPN de référence SKU VpnGw2.
    - id: s2
      text:
        en: You can deploy a VpnGw2AZ gateway in a region that doesn't support availability zones.
        fr: Vous pouvez déployer une passerelle VpnGw2AZ dans une région qui ne prend pas en charge les zones de disponibilité.
    - id: s3
      text:
        en: A Generation2 VpnGw3AZ gateway has a higher aggregate throughput benchmark than a Generation1 VpnGw3AZ gateway.
        fr: Une passerelle VpnGw3AZ Generation2 a un débit agrégé de référence supérieur à celui d'une passerelle VpnGw3AZ Generation1.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Since November 1, 2025, new gateways can't use the non-AZ SKUs VpnGw1 to VpnGw5; new deployments use VpnGw1AZ to VpnGw5AZ. An AZ SKU can still be created in a region without availability zones: the deployment stays regional until the region supports zones. The aggregate throughput benchmark of VpnGw3AZ is 2.5 Gbps in Generation2 versus 1.25 Gbps in Generation1.
    fr: |
      Depuis le 1er novembre 2025, les nouvelles passerelles ne peuvent plus utiliser les références non AZ VpnGw1 à VpnGw5 ; les nouveaux déploiements utilisent VpnGw1AZ à VpnGw5AZ. Une référence AZ peut tout de même être créée dans une région sans zones de disponibilité : le déploiement reste régional jusqu'à ce que la région prenne en charge les zones. Le débit agrégé de référence de VpnGw3AZ est de 2,5 Gbit/s en Generation2, contre 1,25 Gbit/s en Generation1.
references:
  - title: VPN Gateway SKU consolidation and migration
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/gateway-sku-consolidation
  - title: About gateway SKUs
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-gateway-skus
