id: az700-2b-er-gw-coexist-subnet
objective: "2.3.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind has a virtual network named **VNet1** with the address space 10.10.0.0/16. VNet1 contains the following subnets:

    | Subnet | Prefix | Content |
    | --- | --- | --- |
    | GatewaySubnet | 10.10.255.0/28 | VPN gateway VPNGW1 (VpnGw1AZ), site-to-site connection to a branch |
    | Workload | 10.10.1.0/24 | Virtual machines |

    The range 10.10.254.0/24 isn't used. Northwind must add an ExpressRoute gateway named **ERGW1** to VNet1 and keep the site-to-site VPN.

    What should you do?
  fr: |
    Northwind dispose d'un réseau virtuel nommé **VNet1** avec l'espace d'adressage 10.10.0.0/16. VNet1 contient les sous-réseaux suivants :

    | Sous-réseau | Préfixe | Contenu |
    | --- | --- | --- |
    | GatewaySubnet | 10.10.255.0/28 | Passerelle VPN VPNGW1 (VpnGw1AZ), connexion de site à site vers une succursale |
    | Workload | 10.10.1.0/24 | Machines virtuelles |

    La plage 10.10.254.0/24 n'est pas utilisée. Northwind doit ajouter une passerelle ExpressRoute nommée **ERGW1** à VNet1 et conserver le VPN de site à site.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a subnet named GatewaySubnet2 with the prefix 10.10.254.0/27 and deploy ERGW1 in it.", fr: "Créer un sous-réseau nommé GatewaySubnet2 avec le préfixe 10.10.254.0/27 et y déployer ERGW1." } }
    - { id: b, text: { en: "Deploy ERGW1 in the existing GatewaySubnet without changing its prefix.", fr: "Déployer ERGW1 dans le GatewaySubnet existant sans modifier son préfixe." } }
    - { id: c, text: { en: "Delete VPNGW1, give GatewaySubnet a /27 or larger prefix, then recreate VPNGW1 and deploy ERGW1.", fr: "Supprimer VPNGW1, attribuer à GatewaySubnet un préfixe /27 ou plus grand, puis recréer VPNGW1 et déployer ERGW1." } }
    - { id: d, text: { en: "Resize VPNGW1 to VpnGw2AZ, then add an ExpressRoute connection to VPNGW1.", fr: "Redimensionner VPNGW1 en VpnGw2AZ, puis ajouter une connexion ExpressRoute à VPNGW1." } }
answer: { optionId: c }
explanation:
  correct:
    en: Both gateways of a virtual network must be in the single subnet named GatewaySubnet, and coexistence requires a /27 or larger prefix. When the existing GatewaySubnet is /28 or smaller, you must delete the existing gateway, resize the subnet, and recreate the gateways, which interrupts the site-to-site connection during the change.
    fr: "Les deux passerelles d'un réseau virtuel doivent se trouver dans l'unique sous-réseau nommé GatewaySubnet, et la coexistence exige un préfixe /27 ou plus grand. Quand le GatewaySubnet existant est en /28 ou plus petit, vous devez supprimer la passerelle existante, redimensionner le sous-réseau et recréer les passerelles, ce qui interrompt la connexion de site à site pendant l'opération."
  options:
    a: { en: "Gateways can be deployed only in the subnet named exactly GatewaySubnet, and a virtual network has only one.", fr: "Les passerelles ne se déploient que dans le sous-réseau nommé exactement GatewaySubnet, et un réseau virtuel n'en a qu'un." }
    b: { en: "Adding the ExpressRoute gateway to a /28 GatewaySubnet fails; the subnet must be /27 or larger.", fr: "L'ajout de la passerelle ExpressRoute dans un GatewaySubnet en /28 échoue ; le sous-réseau doit être en /27 ou plus grand." }
    d: { en: "A VPN gateway can't terminate an ExpressRoute circuit; ExpressRoute needs a gateway of type ExpressRoute.", fr: "Une passerelle VPN ne peut pas terminer un circuit ExpressRoute ; ExpressRoute exige une passerelle de type ExpressRoute." }
references:
  - title: Configure ExpressRoute and S2S VPN coexisting connections with Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-coexist-resource-manager
  - title: About ExpressRoute virtual network gateways
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-virtual-network-gateways
