id: az700-2a-lng-bgp-settings
objective: "2.1.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank is creating a local network gateway named **LNG-DC1** for a datacenter VPN device that will use BGP with an Azure VPN gateway (VpnGw2AZ, default ASN 65515).

    | Setting | Planned value |
    | --- | --- |
    | Device public IP address | 203.0.113.80 |
    | Device BGP peer IP address | 10.200.255.1 (loopback) |
    | On-premises prefixes advertised by BGP | 10.200.0.0/16 |

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank crée une passerelle de réseau local nommée **LNG-DC1** pour un périphérique VPN de centre de données qui utilisera BGP avec une passerelle VPN Azure (VpnGw2AZ, ASN par défaut 65515).

    | Paramètre | Valeur prévue |
    | --- | --- |
    | Adresse IP publique du périphérique | 203.0.113.80 |
    | Adresse IP du pair BGP du périphérique | 10.200.255.1 (bouclage) |
    | Préfixes locaux annoncés par BGP | 10.200.0.0/16 |

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You must add 10.200.255.1/32 to the Address space of LNG-DC1 so that the BGP session can be established.
        fr: Vous devez ajouter 10.200.255.1/32 à l'espace d'adressage de LNG-DC1 pour que la session BGP puisse s'établir.
    - id: s2
      text:
        en: If you add 10.210.0.0/16 to the Address space of LNG-DC1, the VPN gateway adds it as a static route in addition to the routes learned through BGP.
        fr: Si vous ajoutez 10.210.0.0/16 à l'espace d'adressage de LNG-DC1, la passerelle VPN l'ajoute comme route statique en plus des routes apprises par BGP.
    - id: s3
      text:
        en: You can set the ASN of LNG-DC1 to 65515.
        fr: Vous pouvez définir l'ASN de LNG-DC1 sur 65515.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The VPN gateway adds a host route to the on-premises BGP peer IP over the tunnel by itself, so the /32 is redundant in the Address space (this changed from earlier guidance). Any other prefix entered in the Address space becomes a static route on the gateway, in addition to the BGP-learned routes. The on-premises ASN must differ from the Azure ASN, and 65515 is reserved by Azure.
    fr: |
      La passerelle VPN ajoute d'elle-même une route d'hôte vers l'adresse IP du pair BGP local à travers le tunnel : le /32 est donc redondant dans l'espace d'adressage (c'est un changement par rapport aux anciennes consignes). Tout autre préfixe saisi dans l'espace d'adressage devient une route statique sur la passerelle, en plus des routes apprises par BGP. L'ASN local doit être différent de l'ASN Azure, et 65515 est réservé par Azure.
references:
  - title: VPN Gateway FAQ
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-vpn-faq
  - title: About BGP and VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-bgp-overview
