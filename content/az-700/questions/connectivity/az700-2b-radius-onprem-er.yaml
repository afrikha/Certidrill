id: az700-2b-radius-onprem-er
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a virtual network named **VNet1** in West Europe. VNet1 contains a route-based VPN gateway named **VPNGW1** (SKU VpnGw2AZ) and an ExpressRoute gateway. The on-premises datacenter is connected to VNet1 only through an ExpressRoute circuit that uses Azure private peering. The datacenter also has an internet connection and an edge VPN device with a public IP address.

    The point-to-site configuration of VPNGW1 uses the IKEv2 tunnel type and RADIUS authentication. The RADIUS server is a Network Policy Server (NPS) named **NPS1** that runs in the on-premises datacenter at 10.50.0.15. VPNGW1 is registered as a RADIUS client on NPS1 with the same shared secret as the one configured on the gateway. NPS1 must remain on-premises.

    Remote users report that their authentication always fails.

    You need to ensure that the remote users can authenticate. What should you do?
  fr: |
    Contoso dispose d'un réseau virtuel nommé **VNet1** dans la région West Europe. VNet1 contient une passerelle VPN basée sur des routes nommée **VPNGW1** (référence SKU VpnGw2AZ) et une passerelle ExpressRoute. Le centre de données local est connecté à VNet1 uniquement par un circuit ExpressRoute qui utilise le peering privé Azure. Le centre de données dispose aussi d'une connexion Internet et d'un périphérique VPN de périphérie doté d'une adresse IP publique.

    La configuration de point à site de VPNGW1 utilise le type de tunnel IKEv2 et l'authentification RADIUS. Le serveur RADIUS est un serveur NPS (Network Policy Server) nommé **NPS1** qui s'exécute dans le centre de données local à l'adresse 10.50.0.15. VPNGW1 est inscrite comme client RADIUS sur NPS1 avec le même secret partagé que celui configuré sur la passerelle. NPS1 doit rester en local.

    Les utilisateurs distants signalent que leur authentification échoue systématiquement.

    Vous devez faire en sorte que les utilisateurs distants puissent s'authentifier. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable FastPath on the connection between the ExpressRoute gateway and the circuit.", fr: "Activer FastPath sur la connexion entre la passerelle ExpressRoute et le circuit." } }
    - { id: b, text: { en: "Configure Microsoft peering on the ExpressRoute circuit and advertise the NPS1 address.", fr: "Configurer le peering Microsoft sur le circuit ExpressRoute et publier l'adresse de NPS1." } }
    - { id: c, text: { en: "Create a site-to-site VPN connection between VPNGW1 and the on-premises VPN device.", fr: "Créer une connexion VPN de site à site entre VPNGW1 et le périphérique VPN local." } }
    - { id: d, text: { en: "Replace the IP address of NPS1 on VPNGW1 with the FQDN of NPS1.", fr: "Remplacer l'adresse IP de NPS1 sur VPNGW1 par le nom de domaine complet de NPS1." } }
answer: { optionId: c }
explanation:
  correct:
    en: The VPN gateway acts as a pass-through between the VPN client and the RADIUS server, so it must reach the server itself. When the RADIUS server is on-premises, that path must be a site-to-site VPN connection; an ExpressRoute connection can't be used to reach an on-premises RADIUS server. Adding a site-to-site connection on VPNGW1 gives the gateway a route to NPS1.
    fr: "La passerelle VPN sert d'intermédiaire entre le client VPN et le serveur RADIUS : elle doit donc joindre le serveur elle-même. Quand le serveur RADIUS est en local, ce chemin doit être une connexion VPN de site à site ; une connexion ExpressRoute ne peut pas servir à joindre un serveur RADIUS local. L'ajout d'une connexion de site à site sur VPNGW1 donne à la passerelle une route vers NPS1."
  options:
    a: { en: "FastPath only changes the data path of ExpressRoute traffic to virtual machines; it doesn't let the VPN gateway reach a RADIUS server over ExpressRoute.", fr: "FastPath ne modifie que le chemin de données du trafic ExpressRoute vers les machines virtuelles ; il ne permet pas à la passerelle VPN de joindre un serveur RADIUS par ExpressRoute." }
    b: { en: "Microsoft peering gives access to Microsoft public endpoints, not a path from the VPN gateway to a private on-premises server.", fr: "Le peering Microsoft donne accès aux points de terminaison publics de Microsoft, pas à un chemin entre la passerelle VPN et un serveur local privé." }
    d: { en: "Microsoft recommends an IP address for an on-premises RADIUS server, and the problem is reachability, not name resolution.", fr: "Microsoft recommande une adresse IP pour un serveur RADIUS local, et le problème est l'accessibilité, pas la résolution de noms." }
references:
