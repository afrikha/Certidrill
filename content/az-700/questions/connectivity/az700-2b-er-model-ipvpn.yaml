id: az700-2b-er-model-ipvpn
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind has 85 branch offices and two datacenters connected by an MPLS IPVPN network that a telecommunications provider manages. The provider also runs the BGP routing of the WAN.

    Northwind plans to connect the WAN to Azure by using ExpressRoute. Azure must appear as one more site of the existing MPLS network, and Northwind doesn't want to manage BGP sessions with Microsoft.

    Which ExpressRoute connectivity model should you recommend?
  fr: |
    Northwind dispose de 85 succursales et de deux centres de données reliés par un réseau MPLS IPVPN géré par un opérateur de télécommunications. L'opérateur gère aussi le routage BGP du WAN.

    Northwind prévoit de connecter le WAN à Azure avec ExpressRoute. Azure doit apparaître comme un site de plus du réseau MPLS existant, et Northwind ne veut pas gérer de sessions BGP avec Microsoft.

    Quel modèle de connectivité ExpressRoute devez-vous recommander ?
body:
  options:
    - { id: b, text: { en: "Any-to-any (IPVPN) connection", fr: "Connexion universelle (IPVPN)" } }
    - { id: a, text: { en: "Point-to-point Ethernet connection", fr: "Connexion Ethernet point à point" } }
    - { id: c, text: { en: "Cloud exchange colocation", fr: "Colocalisation dans un échange cloud" } }
    - { id: d, text: { en: "ExpressRoute Direct", fr: "ExpressRoute Direct" } }
answer: { optionId: b }
explanation:
  correct:
    en: With the any-to-any (IPVPN) model, the WAN provider connects the Microsoft cloud to the MPLS VPN, so Azure looks like another branch office. These providers typically deliver managed Layer 3 connectivity, which means the provider configures the routing with Microsoft.
    fr: "Avec le modèle universel (IPVPN), l'opérateur du WAN connecte le cloud Microsoft au VPN MPLS : Azure ressemble à une succursale de plus. Ces opérateurs fournissent en général une connectivité de couche 3 managée, ce qui signifie que l'opérateur configure le routage avec Microsoft."
  options:
    a: { en: "Point-to-point Ethernet is a Layer 2 link from one site to the peering location; you manage the routing yourself.", fr: "L'Ethernet point à point est une liaison de couche 2 d'un site vers l'emplacement de peering ; vous gérez le routage vous-même." }
    c: { en: "Cloud exchange colocation suits equipment already hosted in a colocation facility with a cloud exchange, not a branch WAN.", fr: "La colocalisation dans un échange cloud convient à des équipements déjà hébergés dans un site doté d'un échange cloud, pas à un WAN de succursales." }
    d: { en: "ExpressRoute Direct provides physical ports on the Microsoft edge, and you run BGP yourself.", fr: "ExpressRoute Direct fournit des ports physiques sur la périphérie Microsoft, et vous gérez BGP vous-même." }
references:
  - title: "Azure ExpressRoute: Connectivity models"
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-connectivity-models
