id: az700-2a-s2s-connection-mode
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a site-to-site connection named **Azure-to-HQ** between a route-based VPN gateway (VpnGw2AZ) and the headquarters firewall. The connection uses IKEv2 and the default IPsec/IKE policy.

    The security team requires that the IKE negotiation that establishes the tunnel is always started by the headquarters firewall. The Azure VPN gateway must never start it.

    What should you configure on the Azure-to-HQ connection?
  fr: |
    Fabrikam dispose d'une connexion de site à site nommée **Azure-to-HQ** entre une passerelle VPN basée sur des itinéraires (VpnGw2AZ) et le pare-feu du siège. La connexion utilise IKEv2 et la stratégie IPsec/IKE par défaut.

    L'équipe de sécurité exige que la négociation IKE qui établit le tunnel soit toujours lancée par le pare-feu du siège. La passerelle VPN Azure ne doit jamais la lancer.

    Que devez-vous configurer sur la connexion Azure-to-HQ ?
body:
  options:
    - { id: a, text: { en: "Set Connection Mode to InitiatorOnly.", fr: "Définir le mode de connexion sur InitiatorOnly." } }
    - { id: b, text: { en: "Set Connection Mode to ResponderOnly.", fr: "Définir le mode de connexion sur ResponderOnly." } }
    - { id: c, text: { en: "Set Use policy based traffic selector to Enable.", fr: "Définir Use policy based traffic selector sur Enable." } }
    - { id: d, text: { en: "Set the DPD timeout to 3,600 seconds.", fr: "Définir le délai d'expiration DPD sur 3 600 secondes." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The connection mode applies to route-based gateways with IKEv2 connections and defines who starts the initial IKE connection. ResponderOnly means the on-premises device must initiate the connection; InitiatorOnly means Azure initiates it; Default accepts and dials whichever connects first.
    fr: |
      Le mode de connexion s'applique aux passerelles basées sur des itinéraires avec des connexions IKEv2 et définit qui lance la connexion IKE initiale. ResponderOnly signifie que la connexion doit être lancée par le périphérique local ; InitiatorOnly signifie qu'Azure la lance ; Default accepte et compose selon le premier qui se connecte.
  options:
    a: { en: "InitiatorOnly is the opposite: the connection must be initiated by Azure.", fr: "InitiatorOnly est l'inverse : la connexion doit être lancée par Azure." }
    c: { en: "Policy-based traffic selectors change the traffic selectors proposed, not which side starts IKE.", fr: "Les sélecteurs de trafic basés sur des stratégies modifient les sélecteurs proposés, pas le côté qui lance IKE." }
    d: { en: "The DPD timeout only controls dead peer detection.", fr: "Le délai DPD contrôle seulement la détection d'homologue inactif." }
references:
  - title: About VPN Gateway configuration settings
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-gateway-settings
