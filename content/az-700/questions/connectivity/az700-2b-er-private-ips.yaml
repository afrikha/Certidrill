id: az700-2b-er-private-ips
objective: "2.3.6"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Adatum is configuring Azure private peering on an ExpressRoute circuit bought from a Layer 2 connectivity provider. The network team reserves the subnet 192.168.50.32/29 for the peering and splits it into the primary and secondary /30 subnets in ascending order.

    You need to configure the interface of the **secondary** on-premises edge router that peers with Microsoft.

    Which IP address should you assign to the interface?
  fr: |
    Adatum configure le peering privé Azure sur un circuit ExpressRoute acheté auprès d'un fournisseur de connectivité de couche 2. L'équipe réseau réserve le sous-réseau 192.168.50.32/29 au peering et le découpe en sous-réseaux /30 principal et secondaire, dans l'ordre croissant.

    Vous devez configurer l'interface du routeur de périphérie local **secondaire** qui établit le peering avec Microsoft.

    Quelle adresse IP devez-vous attribuer à l'interface ?
body:
  options:
    - { id: a, text: "192.168.50.33" }
    - { id: b, text: "192.168.50.34" }
    - { id: c, text: "192.168.50.37" }
    - { id: d, text: "192.168.50.38" }
answer: { optionId: c }
explanation:
  correct:
    en: The /29 is split into 192.168.50.32/30 for the primary link and 192.168.50.36/30 for the secondary link. In each /30, your router uses the first usable address and Microsoft uses the second, so the secondary on-premises router gets 192.168.50.37 and the secondary Microsoft router uses 192.168.50.38.
    fr: "Le /29 se découpe en 192.168.50.32/30 pour la liaison principale et 192.168.50.36/30 pour la liaison secondaire. Dans chaque /30, votre routeur utilise la première adresse utilisable et Microsoft la seconde : le routeur local secondaire reçoit 192.168.50.37 et le routeur Microsoft secondaire utilise 192.168.50.38."
  options:
    a: { en: "192.168.50.33 is the address of your primary router.", fr: "192.168.50.33 est l'adresse de votre routeur principal." }
    b: { en: "192.168.50.34 is used by Microsoft on the primary link.", fr: "192.168.50.34 est utilisée par Microsoft sur la liaison principale." }
    d: { en: "192.168.50.38 is used by Microsoft on the secondary link.", fr: "192.168.50.38 est utilisée par Microsoft sur la liaison secondaire." }
references:
  - title: "Azure ExpressRoute: Routing requirements"
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-routing
