id: az700-2b-er-model-match
objective: "2.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Four subsidiaries of Fabrikam plan to connect to Azure by using ExpressRoute. Each subsidiary has different requirements.

    Which connectivity option should you recommend for each subsidiary? To answer, drag the appropriate options to the correct subsidiaries. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Quatre filiales de Fabrikam prévoient de se connecter à Azure avec ExpressRoute. Chaque filiale a des exigences différentes.

    Quelle option de connectivité devez-vous recommander pour chaque filiale ? Pour répondre, faites glisser les options appropriées vers les filiales correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: colo, text: { en: "Cloud exchange colocation", fr: "Colocalisation dans un échange cloud" } }
    - { id: p2p, text: { en: "Point-to-point Ethernet", fr: "Ethernet point à point" } }
    - { id: ipvpn, text: { en: "Any-to-any (IPVPN)", fr: "Universelle (IPVPN)" } }
    - { id: direct, text: "ExpressRoute Direct" }
    - { id: s2s, text: { en: "Site-to-site VPN", fr: "VPN de site à site" } }
  targets:
    - { id: t1, text: { en: "Subsidiary A: its routers are hosted in a colocation facility that offers an Ethernet cloud exchange.", fr: "Filiale A : ses routeurs sont hébergés dans un site de colocalisation qui propose un échange cloud Ethernet." } }
    - { id: t2, text: { en: "Subsidiary B: one datacenter needs a dedicated Layer 2 link to the peering location, and the network team will run BGP itself.", fr: "Filiale B : un centre de données a besoin d'une liaison de couche 2 dédiée vers l'emplacement de peering, et l'équipe réseau gérera BGP elle-même." } }
    - { id: t3, text: { en: "Subsidiary C: 60 shops are already on a provider's MPLS WAN, and Azure must be another site of that WAN.", fr: "Filiale C : 60 magasins sont déjà sur le WAN MPLS d'un opérateur, et Azure doit être un site de plus de ce WAN." } }
    - { id: t4, text: { en: "Subsidiary D: dual 100-Gbps ports directly into the Microsoft network to ingest data into Azure Storage.", fr: "Filiale D : des ports doubles de 100 Gbit/s directement dans le réseau Microsoft pour ingérer des données dans Stockage Azure." } }
answer:
  mapping: { t1: colo, t2: p2p, t3: ipvpn, t4: direct }
explanation:
  correct:
    en: Cloud exchange colocation provides virtual cross-connections from a colocation facility that hosts your equipment. Point-to-point Ethernet is a Layer 2 link from a datacenter, with routing managed by the customer. Any-to-any (IPVPN) integrates Azure into an existing MPLS WAN. ExpressRoute Direct gives dual 10, 100 or 400 Gbps ports directly into the Microsoft global network, a typical choice for massive data ingestion.
    fr: "La colocalisation dans un échange cloud fournit des interconnexions virtuelles depuis un site de colocalisation qui héberge vos équipements. L'Ethernet point à point est une liaison de couche 2 depuis un centre de données, avec un routage géré par le client. Le modèle universel (IPVPN) intègre Azure dans un WAN MPLS existant. ExpressRoute Direct offre des ports doubles de 10, 100 ou 400 Gbit/s directement dans le réseau mondial de Microsoft, un choix typique pour l'ingestion massive de données."
  options:
    s2s: { en: "A site-to-site VPN crosses the internet and isn't an ExpressRoute connectivity model.", fr: "Un VPN de site à site passe par Internet et n'est pas un modèle de connectivité ExpressRoute." }
references:
  - title: "Azure ExpressRoute: Connectivity models"
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-connectivity-models
  - title: About Azure ExpressRoute Direct
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-erdirect-about
