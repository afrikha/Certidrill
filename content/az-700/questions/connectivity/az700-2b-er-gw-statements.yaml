id: az700-2b-er-gw-statements
objective: "2.3.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to deploy an ExpressRoute virtual network gateway named **ERGW1** with the ErGw1AZ SKU in a virtual network named **VNet1**. VNet1 already contains a route-based VPN gateway in GatewaySubnet, which uses the prefix 10.1.255.0/26.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de déployer une passerelle de réseau virtuel ExpressRoute nommée **ERGW1**, de référence SKU ErGw1AZ, dans un réseau virtuel nommé **VNet1**. VNet1 contient déjà une passerelle VPN basée sur des routes dans GatewaySubnet, qui utilise le préfixe 10.1.255.0/26.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You must create a Standard SKU public IP address and reference it in the IP configuration of ERGW1.
        fr: Vous devez créer une adresse IP publique de référence SKU Standard et la référencer dans la configuration IP d'ERGW1.
    - id: s2
      text:
        en: ERGW1 can be deployed in the same GatewaySubnet as the existing VPN gateway.
        fr: ERGW1 peut être déployée dans le même GatewaySubnet que la passerelle VPN existante.
    - id: s3
      text:
        en: After deployment, ERGW1 can be resized to ErGw3AZ without deleting it.
        fr: Après le déploiement, ERGW1 peut être redimensionnée en ErGw3AZ sans être supprimée.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: New ExpressRoute gateways use a public IP address that Microsoft provisions and manages, so you don't create a public IP resource. An ExpressRoute gateway and a VPN gateway coexist in the same GatewaySubnet, which must be /27 or larger; /26 is enough. A gateway can be resized within its family, and ErGw1AZ to ErGw3AZ stays within the AZ family.
    fr: "Les nouvelles passerelles ExpressRoute utilisent une adresse IP publique que Microsoft approvisionne et gère : vous ne créez pas de ressource d'adresse IP publique. Une passerelle ExpressRoute et une passerelle VPN coexistent dans le même GatewaySubnet, qui doit être en /27 ou plus grand ; un /26 suffit. Une passerelle peut être redimensionnée au sein de sa famille, et passer d'ErGw1AZ à ErGw3AZ reste dans la famille AZ."
references:
  - title: About ExpressRoute virtual network gateways
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-virtual-network-gateways
  - title: Configure a virtual network gateway for ExpressRoute using PowerShell
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-add-gateway-resource-manager
