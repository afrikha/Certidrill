id: az700-2a-ipsec-policy-rules
objective: "2.1.6"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Proseware has a route-based VPN gateway (VpnGw2AZ) with five site-to-site connections. The compliance team requires a specific set of cryptographic algorithms on the connection to the payment processing site only.

    You plan to configure a custom IPsec/IKE policy.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'une passerelle VPN basée sur des itinéraires (VpnGw2AZ) avec cinq connexions de site à site. L'équipe de conformité exige un ensemble précis d'algorithmes de chiffrement uniquement sur la connexion vers le site de traitement des paiements.

    Vous prévoyez de configurer une stratégie IPsec/IKE personnalisée.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The custom policy is applied to that connection only; the other connections keep the default policy.", fr: "La stratégie personnalisée s'applique à cette seule connexion ; les autres connexions conservent la stratégie par défaut." } }
    - { id: b, text: { en: "You can specify only the IKE (Main Mode) algorithms and keep the default IPsec (Quick Mode) values.", fr: "Vous pouvez indiquer seulement les algorithmes IKE (mode principal) et conserver les valeurs IPsec (mode rapide) par défaut." } }
    - { id: c, text: { en: "You can assign two policy combinations to the connection so that Azure can fall back to the second one.", fr: "Vous pouvez affecter deux combinaisons de stratégie à la connexion pour qu'Azure puisse se replier sur la seconde." } }
    - { id: d, text: { en: "You must specify all the algorithms and parameters for both IKE (Main Mode) and IPsec (Quick Mode).", fr: "Vous devez indiquer tous les algorithmes et paramètres pour IKE (mode principal) et pour IPsec (mode rapide)." } }
    - { id: e, text: { en: "When you later remove the custom policy, the connection stays unencrypted until you apply a new one.", fr: "Quand vous supprimez ensuite la stratégie personnalisée, la connexion reste non chiffrée jusqu'à l'application d'une nouvelle stratégie." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A custom IPsec/IKE policy is set per connection, so the other connections of the same gateway keep using the default proposals. A policy must be complete: every IKE (Main Mode) and IPsec (Quick Mode) algorithm and parameter is specified, and only one policy combination is allowed per connection.
    fr: |
      Une stratégie IPsec/IKE personnalisée se définit par connexion : les autres connexions de la même passerelle continuent d'utiliser les propositions par défaut. Une stratégie doit être complète : chaque algorithme et paramètre IKE (mode principal) et IPsec (mode rapide) est indiqué, et une seule combinaison de stratégie est autorisée par connexion.
  options:
    b: { en: "Partial policy specification isn't allowed.", fr: "Une stratégie partielle n'est pas autorisée." }
    c: { en: "Only one policy combination can be specified for a given connection.", fr: "Une seule combinaison de stratégie peut être indiquée pour une connexion donnée." }
    e: { en: "Removing the custom policy reverts the connection to the default IPsec/IKE proposals; it stays protected.", fr: "Supprimer la stratégie personnalisée ramène la connexion aux propositions IPsec/IKE par défaut ; elle reste protégée." }
references:
  - title: VPN Gateway FAQ
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-vpn-faq
  - title: "Configure custom IPsec/IKE connection policies for S2S VPN and VNet-to-VNet: Azure portal"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/ipsec-ike-policy-howto
