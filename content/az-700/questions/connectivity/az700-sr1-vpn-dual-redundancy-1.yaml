id: az700-sr1-vpn-dual-redundancy-1
objective: "2.1.1"
type: series_yesno
series: az700-sr1-vpn-dual-redundancy
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You deploy VGW1 in active-active mode and create two BGP-enabled connections.
  fr: |
    Vous déployez VGW1 en mode actif-actif et créez deux connexions avec BGP activé.
body:
  solution:
    en: |
      You deploy VGW1 with **active-active mode** enabled and two public IP addresses, with BGP enabled. You create two local network gateways, one for Dev1 and one for Dev2, each with the public IP address, the BGP peer IP address and the ASN of its device. You create one connection to each local network gateway with **BGP enabled**, and both devices advertise 10.50.0.0/16.
    fr: |
      Vous déployez VGW1 avec le **mode actif-actif** activé et deux adresses IP publiques, avec BGP activé. Vous créez deux passerelles de réseau local, une pour Dev1 et une pour Dev2, chacune avec l'adresse IP publique, l'adresse IP d'homologue BGP et l'ASN de son périphérique. Vous créez une connexion vers chaque passerelle de réseau local avec **BGP activé**, et les deux périphériques publient 10.50.0.0/16.
answer: { value: true }
explanation:
  correct:
    en: |
      This is the dual-redundancy design: each gateway instance builds a tunnel to each device, which gives a full mesh of four active IPsec tunnels. If a device or a gateway instance fails, its tunnels drop and traffic continues on the remaining ones without a standby takeover. BGP with a unique peer IP address per local network gateway is what allows both connections to reach the same on-premises prefix at the same time.
    fr: |
      Il s'agit de la conception à double redondance : chaque instance de passerelle établit un tunnel vers chaque périphérique, ce qui donne un maillage complet de quatre tunnels IPsec actifs. Si un périphérique ou une instance de passerelle tombe en panne, ses tunnels tombent et le trafic continue sur les autres, sans prise de relais par une instance de secours. BGP, avec une adresse IP d'homologue unique par passerelle de réseau local, est ce qui permet aux deux connexions d'atteindre le même préfixe local simultanément.
references:
  - title: Design highly available gateway connectivity for cross-premises and VNet-to-VNet connections
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-highlyavailable
