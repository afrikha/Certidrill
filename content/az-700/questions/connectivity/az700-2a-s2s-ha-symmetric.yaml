id: az700-2a-s2s-ha-symmetric
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a branch office connected to a virtual network named **VNet-Prod** through a site-to-site VPN. The branch office has a single stateful firewall that terminates the VPN. The firewall drops any packet whose flow did not arrive through the same tunnel in both directions.

    You plan to deploy a new VPN gateway that uses the VpnGw2AZ SKU and BGP.

    You need to recommend a gateway configuration that avoids asymmetric routing between the tunnels.

    What should you recommend?
  fr: |
    Northwind Traders dispose d'une succursale reliée à un réseau virtuel nommé **VNet-Prod** par un VPN de site à site. La succursale possède un seul pare-feu avec état qui termine le VPN. Ce pare-feu rejette tout paquet dont le flux n'a pas emprunté le même tunnel dans les deux sens.

    Vous prévoyez de déployer une nouvelle passerelle VPN qui utilise la référence SKU VpnGw2AZ et BGP.

    Vous devez recommander une configuration de passerelle qui évite le routage asymétrique entre les tunnels.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Active-active mode, with ECMP enabled on the firewall", fr: "Le mode actif/actif, avec ECMP activé sur le pare-feu" } }
    - { id: b, text: { en: "Active-active mode, with the connection mode set to InitiatorOnly", fr: "Le mode actif/actif, avec le mode de connexion InitiatorOnly" } }
    - { id: c, text: { en: "Active-standby mode, with a single connection to the firewall", fr: "Le mode actif/passif, avec une seule connexion vers le pare-feu" } }
    - { id: d, text: { en: "Active-active mode, with a DPD timeout of 9 seconds", fr: "Le mode actif/actif, avec un délai d'expiration DPD de 9 secondes" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In active-active mode, Azure can send a flow over one tunnel while the return traffic arrives over the other, and Azure doesn't guarantee symmetric routing. When the on-premises device requires strict symmetry, Microsoft recommends adjusting the routing policy or using active-standby mode, where only one instance carries the tunnel at a time.
    fr: |
      En mode actif/actif, Azure peut envoyer un flux par un tunnel tandis que le trafic retour arrive par l'autre, et Azure ne garantit pas un routage symétrique. Quand le périphérique local exige une symétrie stricte, Microsoft recommande d'ajuster la stratégie de routage ou d'utiliser le mode actif/passif, où une seule instance porte le tunnel à un instant donné.
  options:
    a: { en: "ECMP spreads flows across both tunnels, which increases the risk of asymmetric paths.", fr: "ECMP répartit les flux sur les deux tunnels, ce qui augmente le risque de chemins asymétriques." }
    b: { en: "The connection mode only decides which side starts the initial IKE negotiation; it doesn't control which tunnel carries a flow.", fr: "Le mode de connexion décide seulement quel côté lance la négociation IKE initiale ; il ne contrôle pas le tunnel emprunté par un flux." }
    d: { en: "The DPD timeout controls dead peer detection; a very short value causes aggressive rekeys and doesn't make routing symmetric.", fr: "Le délai DPD contrôle la détection d'homologue inactif ; une valeur très courte provoque des renégociations agressives et ne rend pas le routage symétrique." }
references:
  - title: VPN Gateway FAQ
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-vpn-faq
  - title: About active-active mode VPN gateways
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-active-active-gateways
