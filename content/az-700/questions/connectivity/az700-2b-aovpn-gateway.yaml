id: az700-2b-aovpn-gateway
objective: "2.2.8"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove has a route-based VPN gateway named **VPNGW1** (SKU VpnGw2AZ). Woodgrove plans to deploy Always On VPN device tunnels on domain-joined Windows 11 Enterprise laptops so that the laptops connect to Azure before any user signs in.

    Which two settings should you configure on the **Point-to-site configuration** page of VPNGW1? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'une passerelle VPN basée sur des routes nommée **VPNGW1** (référence SKU VpnGw2AZ). Woodgrove prévoit de déployer des tunnels d'appareil VPN Always On sur des ordinateurs portables Windows 11 Entreprise joints au domaine, pour que les ordinateurs se connectent à Azure avant toute ouverture de session d'un utilisateur.

    Quels sont les deux paramètres à configurer sur la page **Configuration de point à site** de VPNGW1 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: b, text: { en: "Tunnel type: IKEv2", fr: "Type de tunnel : IKEv2" } }
    - { id: a, text: { en: "Tunnel type: OpenVPN (SSL)", fr: "Type de tunnel : OpenVPN (SSL)" } }
    - { id: c, text: { en: "Authentication type: Microsoft Entra ID", fr: "Type d'authentification : Microsoft Entra ID" } }
    - { id: d, text: { en: "Authentication type: RADIUS", fr: "Type d'authentification : RADIUS" } }
    - { id: e, text: { en: "Authentication type: Azure certificate", fr: "Type d'authentification : Certificat Azure" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: An Always On device tunnel uses the built-in Windows VPN client with IKEv2 and computer certificate authentication. On the Azure side, the gateway must therefore be configured for the IKEv2 tunnel type and Azure certificate authentication, with the root certificate that issued the computer certificates.
    fr: "Un tunnel d'appareil Always On utilise le client VPN intégré à Windows avec IKEv2 et l'authentification par certificat d'ordinateur. Côté Azure, la passerelle doit donc être configurée avec le type de tunnel IKEv2 et l'authentification par certificat Azure, avec le certificat racine qui a émis les certificats d'ordinateur."
  options:
    a: { en: "The built-in Windows client used by device tunnels doesn't use OpenVPN.", fr: "Le client Windows intégré utilisé par les tunnels d'appareil n'utilise pas OpenVPN." }
    c: { en: "Entra ID authentication requires OpenVPN and the Azure VPN Client, and a device tunnel connects before any user signs in.", fr: "L'authentification Entra ID exige OpenVPN et Azure VPN Client, et un tunnel d'appareil se connecte avant toute ouverture de session." }
    d: { en: "The device tunnel authenticates with a computer certificate validated by the gateway, not through RADIUS.", fr: "Le tunnel d'appareil s'authentifie avec un certificat d'ordinateur validé par la passerelle, pas par RADIUS." }
references:
  - title: Configure an Always-On VPN tunnel - Azure VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-howto-always-on-device-tunnel
