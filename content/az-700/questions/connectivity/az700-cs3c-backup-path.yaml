id: az700-cs3c-backup-path
objective: "2.3.7"
type: multi
caseStudy: az700-cs3c-munsons
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the requirement for the datacenter backup servers. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter l'exigence relative aux serveurs de sauvegarde du centre de données. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure Microsoft peering on ER-AMS by using subnets from 198.51.100.0/24 for the BGP sessions.", fr: "Configurer le peering Microsoft sur ER-AMS en utilisant des sous-réseaux de 198.51.100.0/24 pour les sessions BGP." } }
    - { id: b, text: { en: "Create a private endpoint for the blob service of stmunsonsbackup in Hub-VNet.", fr: "Créer un point de terminaison privé pour le service blob de stmunsonsbackup dans Hub-VNet." } }
    - { id: c, text: { en: "Create a route filter that allows the Azure Storage BGP community of West Europe and attach it to ER-AMS.", fr: "Créer un filtre de routage qui autorise la communauté BGP Azure Storage de West Europe et l'attacher à ER-AMS." } }
    - { id: d, text: { en: "Enable a service endpoint for Microsoft.Storage on the GatewaySubnet of Hub-VNet.", fr: "Activer un point de terminaison de service pour Microsoft.Storage sur le GatewaySubnet de Hub-VNet." } }
    - { id: e, text: { en: "Create a second connection between GW-ER and ER-AMS with a higher routing weight.", fr: "Créer une seconde connexion entre GW-ER et ER-AMS avec un poids de routage plus élevé." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Public endpoints of Azure services are reached over ExpressRoute through Microsoft peering, which uses public addresses that the customer owns and that Microsoft can verify in the registries, such as 198.51.100.0/24. On circuits configured after August 1, 2017, Microsoft advertises no prefixes over Microsoft peering until a route filter is attached; its single Allow rule lists the BGP communities to receive, here the storage community of West Europe.
    fr: |
      Les points de terminaison publics des services Azure s'atteignent par ExpressRoute grâce au peering Microsoft, qui utilise des adresses publiques appartenant au client et vérifiables par Microsoft dans les registres, comme 198.51.100.0/24. Sur les circuits configurés après le 1er août 2017, Microsoft ne publie aucun préfixe par le peering Microsoft tant qu'aucun filtre de routage n'est attaché ; son unique règle Allow liste les communautés BGP à recevoir, ici la communauté de stockage de West Europe.
  options:
    b: { en: "A private endpoint gives the account a private address reached over private peering; the requirement says that stmunsonsbackup keeps using its public endpoint.", fr: "Un point de terminaison privé donne au compte une adresse privée atteinte par le peering privé ; or l'exigence impose que stmunsonsbackup continue d'utiliser son point de terminaison public." }
    d: { en: "A service endpoint only changes the path of traffic that originates in the subnet; it doesn't route on-premises traffic to the public endpoint of Azure Storage.", fr: "Un point de terminaison de service ne modifie que le chemin du trafic issu du sous-réseau ; il n'achemine pas le trafic local vers le point de terminaison public de Stockage Azure." }
    e: { en: "Gateway connections use private peering; they don't carry traffic to the public endpoints of Azure services.", fr: "Les connexions de passerelle utilisent le peering privé ; elles ne transportent pas le trafic vers les points de terminaison publics des services Azure." }
references:
  - title: Configure route filters for Microsoft peering
    url: https://learn.microsoft.com/en-us/azure/expressroute/how-to-routefilter-portal
  - title: ExpressRoute routing requirements
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-routing
