id: az700-2a-lng-dynamic-ip
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders opens a small office whose internet service provider assigns a dynamic public IP address to the office VPN device. The address changes several times a year. Northwind registers the device with a dynamic DNS service under the name **vpn-office7.northwind.example**.

    You need to create the local network gateway for the office. The solution must minimize administrative effort when the address changes.

    What should you configure on the local network gateway?
  fr: |
    Northwind Traders ouvre un petit bureau dont le fournisseur d'accès Internet attribue une adresse IP publique dynamique au périphérique VPN du bureau. L'adresse change plusieurs fois par an. Northwind enregistre le périphérique auprès d'un service DNS dynamique sous le nom **vpn-office7.northwind.example**.

    Vous devez créer la passerelle de réseau local du bureau. La solution doit réduire au minimum l'effort d'administration quand l'adresse change.

    Que devez-vous configurer sur la passerelle de réseau local ?
body:
  options:
    - { id: a, text: { en: "An IP address endpoint, updated by an Azure Automation runbook", fr: "Un point de terminaison de type adresse IP, mis à jour par un runbook Azure Automation" } }
    - { id: b, text: { en: "An FQDN endpoint set to vpn-office7.northwind.example", fr: "Un point de terminaison de type FQDN défini sur vpn-office7.northwind.example" } }
    - { id: c, text: { en: "BGP settings with the ASN of the office network", fr: "Les paramètres BGP avec l'ASN du réseau du bureau" } }
    - { id: d, text: { en: "An address space that contains the ISP's public range", fr: "Un espace d'adressage qui contient la plage publique du fournisseur" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When the VPN device has a dynamic public IP address, you can select the FQDN endpoint type and use a dynamic DNS name. The VPN gateway resolves the FQDN to find the address to connect to, and refreshes its DNS cache every 5 minutes for disconnected tunnels.
    fr: |
      Quand le périphérique VPN a une adresse IP publique dynamique, vous pouvez choisir le type de point de terminaison FQDN et utiliser un nom DNS dynamique. La passerelle VPN résout le FQDN pour trouver l'adresse à laquelle se connecter et actualise son cache DNS toutes les 5 minutes pour les tunnels déconnectés.
  options:
    a: { en: "A runbook is custom code to maintain; the FQDN endpoint handles address changes natively.", fr: "Un runbook est du code à maintenir ; le point de terminaison FQDN gère nativement les changements d'adresse." }
    c: { en: "BGP exchanges routes inside the tunnel; it doesn't tell Azure the device's public address.", fr: "BGP échange des routes dans le tunnel ; il n'indique pas à Azure l'adresse publique du périphérique." }
    d: { en: "The address space lists the on-premises private prefixes routed through the tunnel, not the device endpoint.", fr: "L'espace d'adressage liste les préfixes privés locaux routés par le tunnel, pas le point de terminaison du périphérique." }
references:
  - title: "Tutorial: Create a site-to-site VPN connection in the Azure portal"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/tutorial-site-to-site-portal
  - title: Modify local network gateway settings using the Azure portal
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-modify-local-network-gateway-portal
