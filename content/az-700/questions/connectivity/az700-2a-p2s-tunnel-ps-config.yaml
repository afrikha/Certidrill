id: az700-2a-p2s-tunnel-ps-config
objective: "2.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a route-based VPN gateway named **GW-Hub** (VpnGw2AZ) in a virtual network named **VNet-Hub**.

    | Network | Address space |
    | --- | --- |
    | VNet-Hub | 10.10.0.0/16 |
    | On-premises network (site-to-site) | 10.20.0.0/16 |

    You need to configure point-to-site for the following clients:

    - Windows 11 laptops that use the Azure VPN Client with Microsoft Entra ID authentication
    - macOS laptops that use the native macOS VPN client with certificate authentication

    The authentication settings are configured separately.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une passerelle VPN basée sur des itinéraires nommée **GW-Hub** (VpnGw2AZ) dans un réseau virtuel nommé **VNet-Hub**.

    | Réseau | Espace d'adressage |
    | --- | --- |
    | VNet-Hub | 10.10.0.0/16 |
    | Réseau local (site à site) | 10.20.0.0/16 |

    Vous devez configurer le point à site pour les clients suivants :

    - Des ordinateurs portables Windows 11 qui utilisent Azure VPN Client avec l'authentification Microsoft Entra ID
    - Des ordinateurs portables macOS qui utilisent le client VPN natif de macOS avec l'authentification par certificat

    Les paramètres d'authentification sont configurés séparément.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $gw = Get-AzVirtualNetworkGateway -ResourceGroupName RG-Hub -Name GW-Hub
    Set-AzVirtualNetworkGateway -VirtualNetworkGateway $gw `
      -VpnClientAddressPool [[pool]] `
      -VpnClientProtocol [[proto]]
  slots:
    - id: pool
      options:
        - { id: invnet, text: "\"10.10.200.0/24\"" }
        - { id: inprem, text: "\"10.20.250.0/24\"" }
        - { id: free, text: "\"172.16.50.0/24\"" }
        - { id: whole, text: "\"10.10.0.0/16\"" }
    - id: proto
      options:
        - { id: ovpn, text: "OpenVPN" }
        - { id: ike, text: "IkeV2" }
        - { id: ikeovpn, text: "IkeV2, OpenVPN" }
        - { id: ikesstp, text: "IkeV2, SSTP" }
answer:
  values: { pool: free, proto: ikeovpn }
explanation:
  correct:
    en: |
      The client address pool must be a private range that overlaps neither the virtual network nor the on-premises networks, so 172.16.50.0/24. Microsoft Entra ID authentication works only over OpenVPN, while the native macOS client uses IKEv2, so the gateway needs both tunnel types: IkeV2 and OpenVPN.
    fr: |
      Le pool d'adresses des clients doit être une plage privée qui ne chevauche ni le réseau virtuel ni les réseaux locaux : 172.16.50.0/24. L'authentification Microsoft Entra ID ne fonctionne qu'avec OpenVPN, tandis que le client natif de macOS utilise IKEv2 : la passerelle a besoin des deux types de tunnel, IkeV2 et OpenVPN.
  options:
    invnet: { en: "10.10.200.0/24 overlaps the VNet-Hub address space.", fr: "10.10.200.0/24 chevauche l'espace d'adressage de VNet-Hub." }
    inprem: { en: "10.20.250.0/24 overlaps the on-premises network.", fr: "10.20.250.0/24 chevauche le réseau local." }
    whole: { en: "This is the virtual network's own address space.", fr: "Il s'agit de l'espace d'adressage du réseau virtuel lui-même." }
    ovpn: { en: "The native macOS client connects over IKEv2, not OpenVPN.", fr: "Le client natif de macOS se connecte en IKEv2, pas en OpenVPN." }
    ike: { en: "Microsoft Entra ID authentication requires OpenVPN.", fr: "L'authentification Microsoft Entra ID exige OpenVPN." }
    ikesstp: { en: "Microsoft Entra ID can't use SSTP, and enabling SSTP is no longer supported since August 31, 2026.", fr: "Microsoft Entra ID ne peut pas utiliser SSTP, et l'activation de SSTP n'est plus prise en charge depuis le 31 août 2026." }
references:
  - title: About Point-to-Site VPN
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about
  - title: Set-AzVirtualNetworkGateway
    url: https://learn.microsoft.com/en-us/powershell/module/az.network/set-azvirtualnetworkgateway
