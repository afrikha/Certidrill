id: az700-2c-vwan-design-statements
objective: "2.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware is replacing its self-managed hub-and-spoke network with a Standard virtual WAN. The design contains:

    - three virtual hubs, in West Europe, East US and Southeast Asia;
    - 30 spoke virtual networks, each connected to the hub in its region;
    - 150 branch offices connected by site-to-site VPN.

    Some spoke virtual networks currently contain a VPN gateway that was used for VNet-to-VNet connections.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware remplace son réseau hub-and-spoke autogéré par un réseau étendu virtuel Standard. La conception comprend :

    - trois hubs virtuels, dans West Europe, East US et Southeast Asia ;
    - 30 réseaux virtuels spoke, chacun connecté au hub de sa région ;
    - 150 succursales connectées par VPN de site à site.

    Certains réseaux virtuels spoke contiennent actuellement une passerelle VPN utilisée pour des connexions de réseau virtuel à réseau virtuel.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "You must create hub-to-hub connections manually between the three hubs.", fr: "Vous devez créer manuellement des connexions de hub à hub entre les trois hubs." } }
    - { id: b, text: { en: "A spoke must not contain a virtual network gateway when you connect it to a hub.", fr: "Un spoke ne doit contenir aucune passerelle de réseau virtuel quand vous le connectez à un hub." } }
    - { id: c, text: { en: "Each spoke virtual network can be connected to only one virtual hub.", fr: "Chaque réseau virtuel spoke ne peut être connecté qu'à un seul hub virtuel." } }
    - { id: d, text: { en: "You must enable Use remote gateways on each spoke so that it can reach the branches.", fr: "Vous devez activer Utiliser des passerelles distantes sur chaque spoke pour qu'il puisse joindre les succursales." } }
    - { id: e, text: { en: "Traffic between two spokes connected to the same hub requires a network virtual appliance.", fr: "Le trafic entre deux spokes connectés au même hub exige une appliance virtuelle réseau." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      A virtual network that you connect to a virtual hub can't already have a virtual network gateway, so the existing VPN gateways must be removed first. One virtual network can be connected to only one virtual hub.
    fr: |
      Un réseau virtuel que vous connectez à un hub virtuel ne peut pas déjà avoir de passerelle de réseau virtuel : les passerelles VPN existantes doivent d'abord être supprimées. Un réseau virtuel ne peut être connecté qu'à un seul hub virtuel.
  options:
    a:
      en: |
        In a Standard virtual WAN, hubs are automatically connected to each other in a full mesh.
      fr: |
        Dans un réseau étendu virtuel Standard, les hubs sont automatiquement reliés entre eux en maillage complet.
    d:
      en: |
        Virtual WAN enables gateway transit to the branches automatically; there are no peering settings to configure.
      fr: |
        Virtual WAN active automatiquement le transit par passerelle vers les branches ; il n'y a aucun paramètre de peering à configurer.
    e:
      en: |
        The hub router of a Standard virtual WAN provides VNet-to-VNet transit without any appliance.
      fr: |
        Le routeur du hub d'un réseau étendu virtuel Standard assure le transit entre réseaux virtuels sans aucune appliance.
references:
  - title: What is Azure Virtual WAN?
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-about
  - title: Global transit network architecture and Virtual WAN
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-global-transit-network-architecture
