id: az700-2a-s2s-gateway-subnet-size
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are preparing a virtual network named **VNet-App** for a site-to-site VPN. You will deploy a VPN gateway that uses the VpnGw2AZ SKU.

    You need to create the gateway subnet. The solution must use the smallest supported address range.

    Which prefix length should you use for GatewaySubnet?
  fr: |
    Vous préparez un réseau virtuel nommé **VNet-App** pour un VPN de site à site. Vous allez déployer une passerelle VPN de référence SKU VpnGw2AZ.

    Vous devez créer le sous-réseau de passerelle. La solution doit utiliser la plus petite plage d'adresses prise en charge.

    Quelle longueur de préfixe devez-vous utiliser pour GatewaySubnet ?
body:
  options:
    - { id: a, text: /26 }
    - { id: b, text: /27 }
    - { id: c, text: /28 }
    - { id: d, text: /29 }
shuffle: false
answer: { optionId: b }
explanation:
  correct:
    en: |
      A gateway subnet as small as /29 is possible only for the Basic SKU. All other VPN gateway SKUs require a GatewaySubnet of /27 or larger, so /27 is the smallest supported range for VpnGw2AZ.
    fr: |
      Un sous-réseau de passerelle aussi petit qu'un /29 n'est possible qu'avec la référence Basic. Toutes les autres références de passerelle VPN exigent un GatewaySubnet de /27 ou plus : /27 est donc la plus petite plage prise en charge pour VpnGw2AZ.
  options:
    a: { en: "A /26 works but is larger than the smallest supported range.", fr: "Un /26 fonctionne, mais il est plus grand que la plus petite plage prise en charge." }
    c: { en: "Smaller than the /27 minimum for SKUs other than Basic.", fr: "Plus petit que le minimum /27 des références autres que Basic." }
    d: { en: "A /29 is possible only for the Basic SKU.", fr: "Un /29 n'est possible qu'avec la référence Basic." }
references:
  - title: About VPN Gateway configuration settings
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-gateway-settings
