id: az700-2c-vwan-basic-hub-features
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders creates a virtual WAN named **VWAN1** of type Basic and a virtual hub named **Hub1** in VWAN1.

    The network team wants to connect on-premises locations to Hub1 without changing the type of VWAN1.

    Which type of connection can the team configure in Hub1?
  fr: |
    Northwind Traders crée un réseau étendu virtuel nommé **VWAN1** de type Basic et un hub virtuel nommé **Hub1** dans VWAN1.

    L'équipe réseau souhaite connecter des sites locaux à Hub1 sans changer le type de VWAN1.

    Quel type de connexion l'équipe peut-elle configurer dans Hub1 ?
body:
  options:
    - { id: a, text: { en: "ExpressRoute", fr: "ExpressRoute" } }
    - { id: b, text: { en: "User VPN (point-to-site)", fr: "VPN utilisateur (point à site)" } }
    - { id: c, text: { en: "Site-to-site VPN", fr: "VPN de site à site" } }
    - { id: d, text: { en: "SD-WAN through a network virtual appliance in the hub", fr: "SD-WAN par une appliance virtuelle réseau dans le hub" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Basic virtual WAN contains only Basic hubs, and a Basic hub supports site-to-site VPN only. ExpressRoute, User VPN, VNet-to-VNet transit through the hub, Azure Firewall and NVAs in the hub all require a Standard virtual WAN.
    fr: |
      Un réseau étendu virtuel Basic ne contient que des hubs Basic, et un hub Basic ne prend en charge que le VPN de site à site. ExpressRoute, le VPN utilisateur, le transit entre réseaux virtuels par le hub, le Pare-feu Azure et les NVA dans le hub exigent tous un réseau étendu virtuel Standard.
  options:
    a:
      en: |
        ExpressRoute connections to a virtual hub require a Standard virtual WAN.
      fr: |
        Les connexions ExpressRoute à un hub virtuel exigent un réseau étendu virtuel Standard.
    b:
      en: |
        User VPN (point-to-site) is available only in Standard hubs.
      fr: |
        Le VPN utilisateur (point à site) n'est disponible que dans les hubs Standard.
    d:
      en: |
        A network virtual appliance can be deployed only in a Standard hub.
      fr: |
        Une appliance virtuelle réseau ne peut être déployée que dans un hub Standard.
references:
  - title: What is Azure Virtual WAN?
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-about
