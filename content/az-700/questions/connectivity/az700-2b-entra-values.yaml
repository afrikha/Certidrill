id: az700-2b-entra-values
objective: "2.2.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Microsoft Entra tenant whose tenant ID is `3a7c9e10-52d4-4b8f-a1e6-0c9d8b7f6e54`. Adatum has a route-based VPN gateway named **VPNGW1** (SKU VpnGw2AZ) in the Azure public cloud. The point-to-site configuration of VPNGW1 uses the OpenVPN (SSL) tunnel type.

    You need to configure Microsoft Entra ID authentication on VPNGW1. Users will connect with the latest Azure VPN Client, and the gateway must use the Microsoft-registered Azure VPN Client app ID.

    Which value should you enter in each field? To answer, drag the appropriate values to the correct fields. Each value may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un locataire Microsoft Entra dont l'ID de locataire est `3a7c9e10-52d4-4b8f-a1e6-0c9d8b7f6e54`. Adatum dispose d'une passerelle VPN basée sur des routes nommée **VPNGW1** (référence SKU VpnGw2AZ) dans le cloud public Azure. La configuration de point à site de VPNGW1 utilise le type de tunnel OpenVPN (SSL).

    Vous devez configurer l'authentification Microsoft Entra ID sur VPNGW1. Les utilisateurs se connecteront avec la dernière version d'Azure VPN Client, et la passerelle doit utiliser l'ID d'application Azure VPN Client inscrit par Microsoft.

    Quelle valeur devez-vous saisir dans chaque champ ? Pour répondre, faites glisser les valeurs appropriées vers les champs correspondants. Chaque valeur peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: tenant, text: "`https://login.microsoftonline.com/3a7c9e10-52d4-4b8f-a1e6-0c9d8b7f6e54`" }
    - { id: issuer, text: "`https://sts.windows.net/3a7c9e10-52d4-4b8f-a1e6-0c9d8b7f6e54/`" }
    - { id: issuernoslash, text: "`https://sts.windows.net/3a7c9e10-52d4-4b8f-a1e6-0c9d8b7f6e54`" }
    - { id: msapp, text: "`c632b3df-fb67-4d84-bdcf-b95ad541b5c8`" }
    - { id: manualapp, text: "`41b23e61-6c1e-4545-b367-cd054e0ed4b4`" }
  targets:
    - { id: ftenant, text: "Tenant" }
    - { id: faudience, text: "Audience" }
    - { id: fissuer, text: "Issuer" }
answer:
  mapping: { ftenant: tenant, faudience: msapp, fissuer: issuer }
explanation:
  correct:
    en: The Tenant field takes the sign-in URL followed by the tenant ID, and the Issuer field takes the STS URL followed by the tenant ID and a trailing slash. The Audience of the Microsoft-registered Azure VPN Client is `c632b3df-fb67-4d84-bdcf-b95ad541b5c8`, which needs no manual app registration or admin consent.
    fr: "Le champ Tenant reçoit l'URL de connexion suivie de l'ID de locataire, et le champ Issuer l'URL du STS suivie de l'ID de locataire et d'une barre oblique finale. L'Audience d'Azure VPN Client inscrit par Microsoft est `c632b3df-fb67-4d84-bdcf-b95ad541b5c8`, qui ne demande ni inscription d'application manuelle ni consentement administrateur."
  options:
    issuernoslash: { en: "Without the trailing slash, the Issuer value doesn't match and the connection can fail.", fr: "Sans la barre oblique finale, la valeur Issuer ne correspond pas et la connexion peut échouer." }
    manualapp: { en: "41b23e61-… is the older manually registered app ID for the Azure public cloud; it requires admin consent and retires on March 31, 2028.", fr: "41b23e61-… est l'ancien ID d'application inscrit manuellement pour le cloud public Azure ; il exige un consentement administrateur et sera mis hors service le 31 mars 2028." }
references:
  - title: "Configure P2S VPN gateway for Microsoft Entra ID authentication: Microsoft-registered client - Azure VPN Gateway"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-entra-gateway
