id: az700-2b-er-msft-values
objective: "2.3.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam plans to configure Microsoft peering on an ExpressRoute circuit bought from a Layer 2 provider. Fabrikam owns the public prefix 198.51.100.0/24, registered in the RIPE NCC database to Fabrikam's public AS. The on-premises network uses 10.0.0.0/8 internally, and Fabrikam will translate the on-premises addresses to public addresses before they enter the Microsoft network.

    Which two values can you use in the Microsoft peering configuration? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit de configurer le peering Microsoft sur un circuit ExpressRoute acheté auprès d'un fournisseur de couche 2. Fabrikam possède le préfixe public 198.51.100.0/24, enregistré dans la base RIPE NCC au nom de l'AS public de Fabrikam. Le réseau local utilise 10.0.0.0/8 en interne, et Fabrikam traduira les adresses locales en adresses publiques avant leur entrée dans le réseau Microsoft.

    Quelles sont les deux valeurs que vous pouvez utiliser dans la configuration du peering Microsoft ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Primary and secondary peer subnets: 10.255.0.0/30 and 10.255.0.4/30", fr: "Sous-réseaux de peering principal et secondaire : 10.255.0.0/30 et 10.255.0.4/30" } }
    - { id: b, text: { en: "Primary and secondary peer subnets: 198.51.100.0/30 and 198.51.100.4/30", fr: "Sous-réseaux de peering principal et secondaire : 198.51.100.0/30 et 198.51.100.4/30" } }
    - { id: c, text: { en: "Advertised public prefixes: 10.0.0.0/8", fr: "Préfixes publics publiés : 10.0.0.0/8" } }
    - { id: d, text: { en: "Advertised public prefixes: 198.51.100.128/27", fr: "Préfixes publics publiés : 198.51.100.128/27" } }
    - { id: e, text: { en: "Advertised public prefixes: 0.0.0.0/0", fr: "Préfixes publics publiés : 0.0.0.0/0" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Microsoft peering needs two /30 public subnets that you own and that are registered in a routing registry, so they come from 198.51.100.0/24. The advertised public prefixes must also be registered to you; 198.51.100.128/27 can be the NAT range, kept separate from the peer link subnets. Microsoft checks the ownership of the prefixes in the registry before it accepts them.
    fr: "Le peering Microsoft exige deux sous-réseaux publics /30 qui vous appartiennent et qui sont enregistrés dans un registre de routage : ils proviennent donc de 198.51.100.0/24. Les préfixes publics publiés doivent aussi vous être attribués ; 198.51.100.128/27 peut servir de plage NAT, distincte des sous-réseaux des liaisons de peering. Microsoft vérifie la propriété des préfixes dans le registre avant de les accepter."
  options:
    a: { en: "Private addresses are allowed for private peering links, not for Microsoft peering links.", fr: "Les adresses privées sont autorisées pour les liaisons du peering privé, pas pour celles du peering Microsoft." }
    c: { en: "RFC 1918 prefixes aren't accepted on Microsoft peering; on-premises traffic must be translated to public addresses.", fr: "Les préfixes RFC 1918 ne sont pas acceptés sur le peering Microsoft ; le trafic local doit être traduit en adresses publiques." }
    e: { en: "Default routes are accepted only on Azure private peering.", fr: "Les routes par défaut ne sont acceptées que sur le peering privé Azure." }
references:
  - title: Configure peering for ExpressRoute circuit - Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-routing-arm
  - title: "Azure ExpressRoute: Routing requirements"
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-routing
