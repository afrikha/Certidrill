id: az700-2c-vwan-upgrade-for-expressroute
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a virtual WAN named **VWAN1** of type Basic. VWAN1 contains a virtual hub named **Hub-WE** in West Europe and a virtual hub named **Hub-NE** in North Europe. Each hub has a site-to-site VPN gateway. No static routes are configured in the hubs.

    Fabrikam orders an ExpressRoute circuit for its main datacenter. The circuit must connect to Hub-WE, and the branch offices connected to Hub-NE must keep their existing VPN connections.

    You need to prepare VWAN1 for the ExpressRoute connection. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Fabrikam dispose d'un réseau étendu virtuel nommé **VWAN1** de type Basic. VWAN1 contient un hub virtuel nommé **Hub-WE** dans West Europe et un hub virtuel nommé **Hub-NE** dans North Europe. Chaque hub possède une passerelle VPN de site à site. Aucune route statique n'est configurée dans les hubs.

    Fabrikam commande un circuit ExpressRoute pour son centre de données principal. Le circuit doit se connecter à Hub-WE, et les succursales connectées à Hub-NE doivent conserver leurs connexions VPN existantes.

    Vous devez préparer VWAN1 pour la connexion ExpressRoute. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a Standard hub in VWAN1 for the ExpressRoute gateway.", fr: "Créer un hub Standard dans VWAN1 pour la passerelle ExpressRoute." } }
    - { id: b, text: { en: "Create a Standard virtual WAN and move Hub-WE to it.", fr: "Créer un réseau étendu virtuel Standard et y déplacer Hub-WE." } }
    - { id: c, text: { en: "Add an ExpressRoute gateway to Hub-WE by editing the hub.", fr: "Ajouter une passerelle ExpressRoute à Hub-WE en modifiant le hub." } }
    - { id: d, text: { en: "Change the type of VWAN1 to Standard on its Configuration page.", fr: "Changer le type de VWAN1 en Standard dans sa page Configuration." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      ExpressRoute requires a Standard virtual WAN. Changing the Virtual WAN type to Standard on the Configuration page upgrades VWAN1 and all its hubs in place, so the existing VPN gateways and branch connections are kept. You can then add an ExpressRoute gateway to Hub-WE.
    fr: |
      ExpressRoute exige un réseau étendu virtuel Standard. Passer le type du réseau étendu virtuel à Standard dans la page Configuration met à niveau VWAN1 et tous ses hubs sur place : les passerelles VPN et les connexions des succursales existantes sont conservées. Vous pouvez ensuite ajouter une passerelle ExpressRoute à Hub-WE.
  options:
    a:
      en: |
        A Basic virtual WAN can contain only Basic hubs.
      fr: |
        Un réseau étendu virtuel Basic ne peut contenir que des hubs Basic.
    b:
      en: |
        A hub belongs to one virtual WAN and virtual WANs can't share hubs; rebuilding the topology in a new virtual WAN takes far more effort than an in-place upgrade.
      fr: |
        Un hub appartient à un seul réseau étendu virtuel et les réseaux étendus virtuels ne peuvent pas partager de hub ; reconstruire la topologie dans un nouveau réseau étendu virtuel demande bien plus d'effort qu'une mise à niveau sur place.
    c:
      en: |
        Hub-WE is a Basic hub, which supports site-to-site VPN only; the ExpressRoute gateway can be added only after the upgrade.
      fr: |
        Hub-WE est un hub Basic, qui ne prend en charge que le VPN de site à site ; la passerelle ExpressRoute ne peut être ajoutée qu'après la mise à niveau.
references:
  - title: Upgrade a virtual WAN from Basic to Standard
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/upgrade-virtual-wan
