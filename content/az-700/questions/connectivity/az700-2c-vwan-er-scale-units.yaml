id: az700-2c-vwan-er-scale-units
objective: "2.4.4"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Fabrikam has a Standard virtual WAN with a virtual hub named **Hub-Paris**. You plan to add an ExpressRoute gateway to Hub-Paris for two ExpressRoute circuits. Capacity planning shows that the gateway must support an aggregate throughput of 8 Gbps.

    You need to configure the gateway scale units of the ExpressRoute gateway. The solution must minimize costs.

    How many gateway scale units should you configure?
  fr: |
    Fabrikam dispose d'un réseau étendu virtuel Standard avec un hub virtuel nommé **Hub-Paris**. Vous prévoyez d'ajouter à Hub-Paris une passerelle ExpressRoute pour deux circuits ExpressRoute. La planification de capacité montre que la passerelle doit prendre en charge un débit agrégé de 8 Gbit/s.

    Vous devez configurer les unités d'échelle de la passerelle ExpressRoute. La solution doit réduire les coûts au minimum.

    Combien d'unités d'échelle de passerelle devez-vous configurer ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "4" }
    - { id: c, text: "8" }
    - { id: d, text: "10" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In a virtual hub, one ExpressRoute gateway scale unit provides 2 Gbps, from 1 to 10 units (20 Gbps). Four scale units provide the required 8 Gbps at the lowest cost.
    fr: |
      Dans un hub virtuel, une unité d'échelle de passerelle ExpressRoute fournit 2 Gbit/s, de 1 à 10 unités (20 Gbit/s). Quatre unités d'échelle fournissent les 8 Gbit/s requis au moindre coût.
  options:
    a:
      en: |
        One scale unit provides only 2 Gbps.
      fr: |
        Une unité d'échelle ne fournit que 2 Gbit/s.
    c:
      en: |
        Eight units provide 16 Gbps, twice the requirement, at a higher cost.
      fr: |
        Huit unités fournissent 16 Gbit/s, le double du besoin, pour un coût plus élevé.
    d:
      en: |
        Ten units, the maximum, provide 20 Gbps, which exceeds the requirement.
      fr: |
        Dix unités, le maximum, fournissent 20 Gbit/s, ce qui dépasse le besoin.
references:
  - title: Azure Virtual WAN FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-faq
