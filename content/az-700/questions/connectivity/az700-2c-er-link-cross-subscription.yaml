id: az700-2c-er-link-cross-subscription
objective: "2.3.9"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso has two Azure subscriptions:

    | Subscription | Resources |
    | --- | --- |
    | Sub1 | An ExpressRoute circuit named **ER-Circuit1**. The provider status is Provisioned and Azure private peering is configured. |
    | Sub2 | A virtual network named **VNet2** that contains an ExpressRoute gateway named **ERGW2** |

    The network team manages Sub1. The application team manages Sub2 and has no permissions in Sub1.

    You need to connect VNet2 to ER-Circuit1.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose de deux abonnements Azure :

    | Abonnement | Ressources |
    | --- | --- |
    | Sub1 | Un circuit ExpressRoute nommé **ER-Circuit1**. L'état du fournisseur est Provisioned et le peering privé Azure est configuré. |
    | Sub2 | Un réseau virtuel nommé **VNet2** qui contient une passerelle ExpressRoute nommée **ERGW2** |

    L'équipe réseau gère Sub1. L'équipe applicative gère Sub2 et ne dispose d'aucune autorisation dans Sub1.

    Vous devez connecter VNet2 à ER-Circuit1.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: svc, text: { en: "From Sub1, send the service key of ER-Circuit1 to the application team.", fr: "Depuis Sub1, envoyer la clé de service d'ER-Circuit1 à l'équipe applicative." } }
    - { id: auth, text: { en: "In Sub1, create an authorization on ER-Circuit1.", fr: "Dans Sub1, créer une autorisation sur ER-Circuit1." } }
    - { id: peer, text: { en: "Create a virtual network peering between VNet2 and a virtual network in Sub1.", fr: "Créer un peering de réseaux virtuels entre VNet2 et un réseau virtuel de Sub1." } }
    - { id: send, text: { en: "From Sub1, send the authorization key and the resource ID of ER-Circuit1 to the application team.", fr: "Depuis Sub1, envoyer la clé d'autorisation et l'ID de ressource d'ER-Circuit1 à l'équipe applicative." } }
    - { id: connsub1, text: { en: "In Sub1, create a connection of type ExpressRoute from ER-Circuit1 to ERGW2.", fr: "Dans Sub1, créer une connexion de type ExpressRoute d'ER-Circuit1 vers ERGW2." } }
    - { id: conn, text: { en: "In Sub2, create a connection of type ExpressRoute from ERGW2 that uses the authorization key and the circuit resource ID.", fr: "Dans Sub2, créer une connexion de type ExpressRoute depuis ERGW2 qui utilise la clé d'autorisation et l'ID de ressource du circuit." } }
answer:
  sequence: [ auth, send, conn ]
explanation:
  correct:
    en: |
      The circuit owner creates an authorization on the circuit, which generates an authorization key, and sends that key with the circuit resource ID (the peer ID) to the circuit user. The circuit user then creates the connection from its own gateway, in its own subscription, by supplying both values. Each authorization can be used by one connection only.
    fr: |
      Le propriétaire du circuit crée une autorisation sur le circuit, ce qui génère une clé d'autorisation, et envoie cette clé avec l'ID de ressource du circuit (l'ID d'homologue) à l'utilisateur du circuit. L'utilisateur du circuit crée ensuite la connexion depuis sa propre passerelle, dans son propre abonnement, en fournissant ces deux valeurs. Chaque autorisation ne peut servir qu'à une seule connexion.
  options:
    svc: { en: "The service key identifies the circuit to the connectivity provider; it doesn't let another subscription link a virtual network.", fr: "La clé de service identifie le circuit auprès du fournisseur de connectivité ; elle ne permet pas à un autre abonnement d'y lier un réseau virtuel." }
    peer: { en: "Peering isn't needed: VNet2 already has its own ExpressRoute gateway, which is linked directly to the circuit.", fr: "Le peering est inutile : VNet2 dispose déjà de sa propre passerelle ExpressRoute, qui est liée directement au circuit." }
    connsub1: { en: "The connection is created on the gateway side, in the subscription of the virtual network, not in the subscription of the circuit.", fr: "La connexion se crée côté passerelle, dans l'abonnement du réseau virtuel, pas dans celui du circuit." }
references:
  - title: Connect a virtual network to an ExpressRoute circuit using Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-linkvnet-arm
