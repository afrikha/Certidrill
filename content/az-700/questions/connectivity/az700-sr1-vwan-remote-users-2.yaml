id: az700-sr1-vwan-remote-users-2
objective: "2.4.1"
type: series_yesno
series: az700-sr1-vwan-remote-users
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: |
    You upgrade VWAN1 to Standard and add a point-to-site gateway that uses IKEv2 with Microsoft Entra authentication.
  fr: |
    Vous mettez VWAN1 à niveau vers Standard et ajoutez une passerelle de point à site qui utilise IKEv2 avec l'authentification Microsoft Entra.
body:
  solution:
    en: |
      You change the **Virtual WAN type** of VWAN1 to **Standard**. You create a user VPN configuration that uses the **IKEv2** tunnel type and Microsoft Entra authentication, and you add a point-to-site gateway that uses this configuration to Hub1. You connect Spoke1, Spoke2 and Spoke3 to Hub1.
    fr: |
      Vous définissez le paramètre **Virtual WAN type** de VWAN1 sur **Standard**. Vous créez une configuration VPN utilisateur qui utilise le type de tunnel **IKEv2** et l'authentification Microsoft Entra, et vous ajoutez à Hub1 une passerelle de point à site qui utilise cette configuration. Vous connectez Spoke1, Spoke2 et Spoke3 à Hub1.
answer: { value: false }
explanation:
  correct:
    en: |
      The upgrade to Standard is required and keeps Hub1, which becomes a Standard hub, so the spoke connections and transit through the hub are possible. However, Microsoft Entra ID authentication is available only for point-to-site gateways that use the OpenVPN protocol; it can't be combined with the IKEv2 tunnel type. The user VPN configuration must use OpenVPN.
    fr: |
      La mise à niveau vers Standard est nécessaire et conserve Hub1, qui devient un hub Standard : les connexions des spokes et le transit par le hub sont donc possibles. En revanche, l'authentification Microsoft Entra ID n'est disponible que pour les passerelles de point à site qui utilisent le protocole OpenVPN ; elle ne peut pas être combinée avec le type de tunnel IKEv2. La configuration VPN utilisateur doit utiliser OpenVPN.
references:
