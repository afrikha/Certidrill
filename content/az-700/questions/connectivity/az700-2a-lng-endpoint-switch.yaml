id: az700-2a-lng-endpoint-switch
objective: "2.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a local network gateway named **LNG-Berlin** that uses an IP address endpoint. A site-to-site connection named **Hub-to-Berlin** references LNG-Berlin.

    The Berlin office will move to an internet connection with a dynamic public IP address, published as **berlin-vpn.fabrikam.example**. You need the Azure VPN gateway to connect to the Berlin device by using that name.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'une passerelle de réseau local nommée **LNG-Berlin** qui utilise un point de terminaison de type adresse IP. Une connexion de site à site nommée **Hub-to-Berlin** référence LNG-Berlin.

    Le bureau de Berlin va passer à une connexion Internet avec une adresse IP publique dynamique, publiée sous le nom **berlin-vpn.fabrikam.example**. La passerelle VPN Azure doit se connecter au périphérique de Berlin en utilisant ce nom.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: delconn, text: { en: "Delete the Hub-to-Berlin connection.", fr: "Supprimer la connexion Hub-to-Berlin." } }
    - { id: newlng, text: { en: "Create a local network gateway with an FQDN endpoint set to berlin-vpn.fabrikam.example.", fr: "Créer une passerelle de réseau local avec un point de terminaison FQDN défini sur berlin-vpn.fabrikam.example." } }
    - { id: newconn, text: { en: "Create a site-to-site connection that references the new local network gateway.", fr: "Créer une connexion de site à site qui référence la nouvelle passerelle de réseau local." } }
    - { id: edit, text: { en: "On the Configuration page of LNG-Berlin, change the endpoint to FQDN and save.", fr: "Dans la page Configuration de LNG-Berlin, changer le point de terminaison en FQDN et enregistrer." } }
    - { id: reset, text: { en: "Reset the VPN gateway to force FQDN resolution.", fr: "Réinitialiser la passerelle VPN pour forcer la résolution du FQDN." } }
    - { id: delgw, text: { en: "Delete the virtual network gateway.", fr: "Supprimer la passerelle de réseau virtuel." } }
answer:
  sequence: [ delconn, newlng, newconn ]
explanation:
  correct:
    en: |
      A local network gateway can't be switched between an IP address endpoint and an FQDN endpoint. You must delete the connections associated with it, create a local network gateway with the new endpoint type, and then recreate the connections. The virtual network gateway itself is not affected.
    fr: |
      Une passerelle de réseau local ne peut pas passer d'un point de terminaison de type adresse IP à un point de terminaison FQDN. Il faut supprimer les connexions qui lui sont associées, créer une passerelle de réseau local avec le nouveau type de point de terminaison, puis recréer les connexions. La passerelle de réseau virtuel n'est pas concernée.
  options:
    edit: { en: "The endpoint type of an existing local network gateway can't be changed; only the IP address or the FQDN value can be edited.", fr: "Le type de point de terminaison d'une passerelle de réseau local existante ne peut pas être changé ; seule la valeur de l'adresse IP ou du FQDN est modifiable." }
    reset: { en: "A reset triggers FQDN resolution only for gateways that already use FQDN endpoints.", fr: "Une réinitialisation ne déclenche la résolution que pour des passerelles qui utilisent déjà des points de terminaison FQDN." }
    delgw: { en: "The VPN gateway doesn't need to be deleted; only the connection and the local network gateway change.", fr: "La passerelle VPN n'a pas à être supprimée ; seules la connexion et la passerelle de réseau local changent." }
references:
  - title: Modify local network gateway settings using the Azure portal
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-modify-local-network-gateway-portal
