id: az700-2a-p2s-sku-entra
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware needs point-to-site access to a virtual network named **VNet-Apps** for 600 remote employees. The employees must authenticate with their Microsoft Entra ID credentials by using the Azure VPN Client. No site-to-site connection is planned.

    You need to select the gateway SKU. The solution must minimize costs.

    Which SKU should you select?
  fr: |
    Proseware a besoin d'un accès de point à site à un réseau virtuel nommé **VNet-Apps** pour 600 employés distants. Les employés doivent s'authentifier avec leurs informations d'identification Microsoft Entra ID dans Azure VPN Client. Aucune connexion de site à site n'est prévue.

    Vous devez sélectionner la référence SKU de la passerelle. La solution doit réduire les coûts au minimum.

    Quelle référence SKU devez-vous sélectionner ?
body:
  options:
    - { id: a, text: Basic }
    - { id: b, text: VpnGw1AZ }
    - { id: c, text: VpnGw2AZ }
    - { id: d, text: VpnGw3AZ }
shuffle: false
answer: { optionId: d }
explanation:
  correct:
    en: |
      Microsoft Entra ID authentication is supported only with the OpenVPN tunnel type, which the Basic SKU doesn't support. VpnGw2AZ is limited to 500 IKEv2/OpenVPN connections, so VpnGw3AZ (1,000 connections) is the cheapest SKU that covers 600 users.
    fr: |
      L'authentification Microsoft Entra ID n'est prise en charge qu'avec le type de tunnel OpenVPN, que la référence Basic ne prend pas en charge. VpnGw2AZ est limitée à 500 connexions IKEv2/OpenVPN : VpnGw3AZ (1 000 connexions) est la référence la moins chère qui couvre 600 utilisateurs.
  options:
    a: { en: "Basic doesn't support OpenVPN, so it can't use Microsoft Entra ID authentication.", fr: "Basic ne prend pas en charge OpenVPN : il ne peut pas utiliser l'authentification Microsoft Entra ID." }
    b: { en: "VpnGw1AZ is limited to 250 IKEv2/OpenVPN connections.", fr: "VpnGw1AZ est limitée à 250 connexions IKEv2/OpenVPN." }
    c: { en: "VpnGw2AZ is limited to 500 IKEv2/OpenVPN connections.", fr: "VpnGw2AZ est limitée à 500 connexions IKEv2/OpenVPN." }
references:
  - title: About gateway SKUs
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-gateway-skus
  - title: About Point-to-Site VPN
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about
