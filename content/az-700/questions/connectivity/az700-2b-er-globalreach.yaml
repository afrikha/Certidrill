id: az700-2b-er-globalreach
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has two offices, in Paris and in Frankfurt. Each office is connected to Azure by its own ExpressRoute circuit:

    | Circuit | Peering location | SKU | Peering |
    | --- | --- | --- | --- |
    | CKT-PAR | Paris | Standard | Azure private peering |
    | CKT-FRA | Frankfurt | Standard | Azure private peering |

    Both offices can reach the virtual networks in Azure, but traffic between the offices still crosses the internet through a VPN.

    You need the traffic between the two offices to use the Microsoft network instead. The solution must minimize cost.

    What should you implement?
  fr: |
    Tailspin dispose de deux bureaux, à Paris et à Francfort. Chaque bureau est connecté à Azure par son propre circuit ExpressRoute :

    | Circuit | Emplacement de peering | Référence SKU | Peering |
    | --- | --- | --- | --- |
    | CKT-PAR | Paris | Standard | Peering privé Azure |
    | CKT-FRA | Frankfurt | Standard | Peering privé Azure |

    Les deux bureaux atteignent les réseaux virtuels d'Azure, mais le trafic entre les bureaux traverse encore Internet par un VPN.

    Vous devez faire passer le trafic entre les deux bureaux par le réseau Microsoft. La solution doit réduire les coûts au minimum.

    Que devez-vous implémenter ?
body:
  options:
    - { id: c, text: { en: "ExpressRoute Global Reach between the two circuits", fr: "ExpressRoute Global Reach entre les deux circuits" } }
    - { id: a, text: { en: "ExpressRoute FastPath on both connections", fr: "ExpressRoute FastPath sur les deux connexions" } }
    - { id: b, text: { en: "The Premium add-on on both circuits", fr: "Le module Premium sur les deux circuits" } }
    - { id: d, text: { en: "Virtual network peering between the linked virtual networks", fr: "Un peering entre les réseaux virtuels liés" } }
answer: { optionId: c }
explanation:
  correct:
    en: Global Reach links the private peerings of two circuits so that the on-premises sites behind them exchange traffic over the Microsoft network. The circuits are at different peering locations in the same geopolitical area, in supported countries, so the Standard SKU is enough and no Premium upgrade is needed.
    fr: "Global Reach relie les peerings privés de deux circuits pour que les sites locaux qui se trouvent derrière échangent leur trafic par le réseau Microsoft. Les circuits sont dans des emplacements de peering différents de la même zone géopolitique, dans des pays pris en charge : la référence SKU Standard suffit et aucun passage à Premium n'est nécessaire."
  options:
    a: { en: "FastPath bypasses the gateway between a circuit and virtual machines; it doesn't connect two on-premises sites.", fr: "FastPath contourne la passerelle entre un circuit et les machines virtuelles ; il ne relie pas deux sites locaux." }
    b: { en: "Premium is required for Global Reach only across geopolitical areas, and it doesn't connect the sites by itself.", fr: "Premium n'est exigé pour Global Reach qu'entre zones géopolitiques, et il ne relie pas les sites à lui seul." }
    d: { en: "Peering connects virtual networks to each other; it doesn't route traffic between two on-premises sites through their circuits.", fr: "Le peering relie des réseaux virtuels entre eux ; il n'achemine pas le trafic entre deux sites locaux par leurs circuits." }
references:
  - title: About Azure ExpressRoute Global Reach
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-global-reach
  - title: FAQ - Azure ExpressRoute
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-faqs
