id: az700-2a-vng-ps-sequence
objective: "2.1.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You are scripting the deployment of an active-standby VPN gateway named **GW-Dev** in a virtual network named **VNet-Dev** by using Azure PowerShell. VNet-Dev already contains a subnet named GatewaySubnet (/27), and the variable `$subnet` already holds its configuration.

    Which three cmdlets should you run in sequence? To answer, move the appropriate cmdlets from the list of cmdlets to the answer area and arrange them in the correct order.
  fr: |
    Vous écrivez un script Azure PowerShell qui déploie une passerelle VPN actif/passif nommée **GW-Dev** dans un réseau virtuel nommé **VNet-Dev**. VNet-Dev contient déjà un sous-réseau nommé GatewaySubnet (/27), et la variable `$subnet` contient déjà sa configuration.

    Quelles sont les trois cmdlets à exécuter dans l'ordre ? Pour répondre, déplacez les cmdlets appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: pip, text: "New-AzPublicIpAddress -AllocationMethod Static -Sku Standard" }
    - { id: ipconf, text: "New-AzVirtualNetworkGatewayIpConfig -SubnetId $subnet.Id -PublicIpAddressId $pip.Id" }
    - { id: gw, text: "New-AzVirtualNetworkGateway -GatewayType Vpn -VpnType RouteBased" }
    - { id: lng, text: "New-AzLocalNetworkGateway -GatewayIpAddress 203.0.113.5" }
    - { id: conn, text: "New-AzVirtualNetworkGatewayConnection -ConnectionType IPsec" }
    - { id: subnet, text: "Add-AzVirtualNetworkSubnetConfig -Name GatewaySubnet" }
answer:
  sequence: [ pip, ipconf, gw ]
explanation:
  correct:
    en: |
      The gateway IP configuration references both the gateway subnet and a public IP address, so the Standard static public IP address is created first. `New-AzVirtualNetworkGateway` then takes the IP configuration in `-IpConfigurations`. A local network gateway and a connection are needed later for a site-to-site connection, not to create the gateway.
    fr: |
      La configuration IP de la passerelle référence à la fois le sous-réseau de passerelle et une adresse IP publique : l'adresse IP publique Standard statique est donc créée en premier. `New-AzVirtualNetworkGateway` reçoit ensuite la configuration IP dans `-IpConfigurations`. Une passerelle de réseau local et une connexion seront nécessaires plus tard pour une connexion de site à site, pas pour créer la passerelle.
  options:
    lng: { en: "The local network gateway represents the on-premises site; it isn't part of the gateway creation.", fr: "La passerelle de réseau local représente le site local ; elle ne fait pas partie de la création de la passerelle." }
    conn: { en: "A connection can be created only after the gateway exists, and it isn't required here.", fr: "Une connexion ne peut être créée qu'après la passerelle, et elle n'est pas demandée ici." }
    subnet: { en: "GatewaySubnet already exists in VNet-Dev.", fr: "GatewaySubnet existe déjà dans VNet-Dev." }
references:
  - title: Create a VPN gateway using PowerShell
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/create-gateway-powershell
