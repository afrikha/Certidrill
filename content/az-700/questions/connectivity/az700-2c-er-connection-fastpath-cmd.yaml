id: az700-2c-er-connection-fastpath-cmd
objective: "2.3.9"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware has an ExpressRoute circuit named **ER-PAR** and a virtual network named **VNet-Hub**. Both are in the same subscription and in a resource group named **RG-Net**. Azure private peering is configured on ER-PAR. VNet-Hub contains an ExpressRoute gateway named **ERGW-Hub** that uses the ErGw3AZ SKU.

    You need to link VNet-Hub to ER-PAR. Traffic from on-premises to the virtual machines in VNet-Hub must bypass the gateway in the data path.

    How should you complete the Azure PowerShell script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un circuit ExpressRoute nommé **ER-PAR** et d'un réseau virtuel nommé **VNet-Hub**. Les deux se trouvent dans le même abonnement et dans un groupe de ressources nommé **RG-Net**. Le peering privé Azure est configuré sur ER-PAR. VNet-Hub contient une passerelle ExpressRoute nommée **ERGW-Hub** qui utilise la référence SKU ErGw3AZ.

    Vous devez lier VNet-Hub à ER-PAR. Le trafic du réseau local vers les machines virtuelles de VNet-Hub doit contourner la passerelle dans le chemin des données.

    Comment devez-vous compléter le script Azure PowerShell ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $ckt = Get-AzExpressRouteCircuit -Name "ER-PAR" -ResourceGroupName "RG-Net"
    $gw = Get-AzVirtualNetworkGateway -Name "ERGW-Hub" -ResourceGroupName "RG-Net"
    New-AzVirtualNetworkGatewayConnection -Name "Conn-PAR" -ResourceGroupName "RG-Net" `
      -Location "francecentral" -VirtualNetworkGateway1 $gw [[peer]] `
      -ConnectionType [[ct]] [[fp]]
  slots:
    - id: peer
      options:
        - { id: peerid, text: "-PeerId $ckt.Id" }
        - { id: authkey, text: "-AuthorizationKey $ckt.Id" }
        - { id: gw2, text: "-VirtualNetworkGateway2 $ckt" }
        - { id: lng2, text: "-LocalNetworkGateway2 $ckt" }
    - id: ct
      options:
        - { id: ipsec, text: IPsec }
        - { id: er, text: ExpressRoute }
        - { id: v2v, text: Vnet2Vnet }
        - { id: client, text: VPNClient }
    - id: fp
      options:
        - { id: bgp, text: "-EnableBgp $true" }
        - { id: localip, text: "-UseLocalAzureIpAddress" }
        - { id: bypass, text: "-ExpressRouteGatewayBypass" }
        - { id: pbts, text: "-UsePolicyBasedTrafficSelectors $true" }
answer:
  values: { peer: peerid, ct: er, fp: bypass }
explanation:
  correct:
    en: |
      An ExpressRoute connection references the circuit through `-PeerId` (the circuit resource ID) and uses the connection type `ExpressRoute`. FastPath is enabled on the connection with `-ExpressRouteGatewayBypass`, which requires an Ultra Performance or ErGw3AZ gateway, as here.
    fr: |
      Une connexion ExpressRoute référence le circuit avec `-PeerId` (l'ID de ressource du circuit) et utilise le type de connexion `ExpressRoute`. FastPath s'active sur la connexion avec `-ExpressRouteGatewayBypass`, ce qui exige une passerelle Ultra Performance ou ErGw3AZ, comme ici.
  options:
    authkey: { en: "An authorization key is a GUID used only when the circuit is in another subscription, together with -PeerId.", fr: "Une clé d'autorisation est un GUID utilisé seulement quand le circuit se trouve dans un autre abonnement, en plus de -PeerId." }
    ipsec: { en: "IPsec is the connection type of a site-to-site VPN.", fr: "IPsec est le type de connexion d'un VPN de site à site." }
    localip: { en: "-UseLocalAzureIpAddress makes a VPN connection use the private IP of a VPN gateway; it doesn't apply to ExpressRoute.", fr: "-UseLocalAzureIpAddress fait utiliser l'adresse IP privée d'une passerelle VPN à une connexion VPN ; il ne s'applique pas à ExpressRoute." }
references:
  - title: Connect a virtual network to an ExpressRoute circuit using Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-linkvnet-arm
