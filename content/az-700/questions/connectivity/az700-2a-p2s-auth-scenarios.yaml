id: az700-2a-p2s-auth-scenarios
objective: "2.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam deploys three point-to-site VPN gateways (VpnGw2AZ, tunnel type IKEv2 and OpenVPN) for three groups of users. Each group has a different requirement.

    Which authentication type should you configure for each group? To answer, drag the appropriate authentication types to the correct groups. Each authentication type may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam déploie trois passerelles VPN de point à site (VpnGw2AZ, type de tunnel IKEv2 et OpenVPN) pour trois groupes d'utilisateurs. Chaque groupe a une exigence différente.

    Quel type d'authentification devez-vous configurer pour chaque groupe ? Pour répondre, faites glisser les types d'authentification appropriés vers les groupes correspondants. Chaque type d'authentification peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: cert, text: "Azure certificate" }
    - { id: entra, text: "Microsoft Entra ID" }
    - { id: radius, text: "RADIUS" }
    - { id: psk, text: { en: "Preshared key", fr: "Clé prépartagée" } }
  targets:
    - id: t1
      text: { en: "Contractors: no accounts in any directory; access must be revocable device by device.", fr: "Prestataires : aucun compte dans un annuaire ; l'accès doit pouvoir être révoqué appareil par appareil." }
    - id: t2
      text: { en: "Factory staff: sign in with their Active Directory Domain Services credentials, validated by the existing NPS servers.", fr: "Personnel d'usine : connexion avec leurs informations d'identification Active Directory Domain Services, validées par les serveurs NPS existants." }
    - id: t3
      text: { en: "Executives: a Conditional Access policy must require multifactor authentication for the VPN.", fr: "Direction : une stratégie d'accès conditionnel doit exiger l'authentification multifacteur pour le VPN." }
answer:
  mapping: { t1: cert, t2: radius, t3: entra }
explanation:
  correct:
    en: |
      Azure certificate authentication needs no identity infrastructure: each device holds a client certificate, and one certificate can be revoked on the gateway by its thumbprint. RADIUS forwards the authentication to a RADIUS server such as NPS integrated with AD DS. Microsoft Entra ID authentication, through the Azure VPN Client over OpenVPN, brings Conditional Access and multifactor authentication.
    fr: |
      L'authentification par certificat Azure n'exige aucune infrastructure d'identité : chaque appareil détient un certificat client, et un certificat peut être révoqué sur la passerelle par son empreinte. RADIUS transmet l'authentification à un serveur RADIUS comme NPS intégré à AD DS. L'authentification Microsoft Entra ID, par Azure VPN Client sur OpenVPN, apporte l'accès conditionnel et l'authentification multifacteur.
  options:
    psk: { en: "A preshared key authenticates site-to-site tunnels, not point-to-site users.", fr: "Une clé prépartagée authentifie les tunnels de site à site, pas les utilisateurs de point à site." }
references:
  - title: About Point-to-Site VPN
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about
