id: az700-2a-pb-convert-route-based
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a virtual network named **VNet-Ops** with a policy-based VPN gateway named **GW-Ops**. GW-Ops has one site-to-site connection.

    Contoso now needs point-to-site access to VNet-Ops for its support engineers, through the same gateway.

    What should you do?
  fr: |
    Contoso dispose d'un réseau virtuel nommé **VNet-Ops** avec une passerelle VPN basée sur des stratégies nommée **GW-Ops**. GW-Ops a une connexion de site à site.

    Contoso a maintenant besoin d'un accès de point à site à VNet-Ops pour ses ingénieurs du support, par la même passerelle.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the VPN type of GW-Ops to route-based on its Configuration page.", fr: "Changer le type de VPN de GW-Ops en basé sur des itinéraires dans sa page Configuration." } }
    - { id: b, text: { en: "Resize GW-Ops to the VpnGw1AZ SKU.", fr: "Redimensionner GW-Ops vers la référence SKU VpnGw1AZ." } }
    - { id: c, text: { en: "Enable policy-based traffic selectors on the existing connection.", fr: "Activer les sélecteurs de trafic basés sur des stratégies sur la connexion existante." } }
    - { id: d, text: { en: "Delete GW-Ops and its connection, then create a route-based gateway.", fr: "Supprimer GW-Ops et sa connexion, puis créer une passerelle basée sur des itinéraires." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The VPN type of a gateway can't be changed. To move from policy-based to route-based, you delete the connections and the gateway, then create a new route-based gateway (about 60 minutes in total, and the original public IP address isn't kept). Point-to-site requires a route-based gateway.
    fr: |
      Le type de VPN d'une passerelle ne peut pas être modifié. Pour passer de « basé sur des stratégies » à « basé sur des itinéraires », vous supprimez les connexions et la passerelle, puis créez une nouvelle passerelle basée sur des itinéraires (environ 60 minutes au total, et l'adresse IP publique d'origine n'est pas conservée). Le point à site exige une passerelle basée sur des itinéraires.
  options:
    a: { en: "A policy-based gateway can't be converted to route-based in place.", fr: "Une passerelle basée sur des stratégies ne peut pas être convertie sur place en passerelle basée sur des itinéraires." }
    b: { en: "Policy-based gateways exist only with the Basic SKU; a SKU change doesn't change the VPN type.", fr: "Les passerelles basées sur des stratégies n'existent qu'en référence Basic ; un changement de référence ne change pas le type de VPN." }
    c: { en: "This connection option belongs to route-based gateways and doesn't add point-to-site support.", fr: "Cette option de connexion concerne les passerelles basées sur des itinéraires et n'ajoute pas le point à site." }
references:
  - title: VPN Gateway FAQ
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-vpn-faq
  - title: About VPN Gateway configuration settings
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-gateway-settings
