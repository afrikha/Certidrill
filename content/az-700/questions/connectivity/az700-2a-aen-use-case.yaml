id: az700-2a-aen-use-case
objective: "2.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is moving a group of on-premises virtual machines to Azure in several waves. During the migration, some VMs of the subnet 10.30.8.0/24 will run in Azure while the others remain on-premises. The VMs must keep their original private IP addresses, and VMs on both sides must communicate as if they were on the same subnet.

    What should you use?
  fr: |
    Fabrikam déplace un ensemble de machines virtuelles locales vers Azure en plusieurs vagues. Pendant la migration, certaines machines virtuelles du sous-réseau 10.30.8.0/24 s'exécuteront dans Azure tandis que les autres resteront en local. Les machines virtuelles doivent conserver leurs adresses IP privées d'origine, et celles des deux côtés doivent communiquer comme si elles étaient sur le même sous-réseau.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: "Azure Network Adapter" }
    - { id: b, text: "Azure Extended Network" }
    - { id: c, text: "Azure Route Server" }
    - { id: d, text: { en: "Virtual network peering", fr: "Le peering de réseaux virtuels" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Extended network for Azure stretches an on-premises subnet into Azure so that migrated VMs keep their on-premises private IP addresses. A pair of Windows Server virtual appliances, one on-premises and one in Azure, carries the traffic of the extended subnet through a VXLAN tunnel.
    fr: |
      Le réseau étendu pour Azure étend un sous-réseau local dans Azure pour que les machines virtuelles migrées conservent leurs adresses IP privées locales. Une paire d'appliances virtuelles Windows Server, l'une en local et l'autre dans Azure, transporte le trafic du sous-réseau étendu dans un tunnel VXLAN.
  options:
    a: { en: "Azure Network Adapter connects a Windows Server to a virtual network through a point-to-site VPN; it doesn't stretch a subnet.", fr: "La Carte réseau Azure connecte un serveur Windows Server à un réseau virtuel par un VPN de point à site ; elle n'étend pas de sous-réseau." }
    c: { en: "Route Server exchanges routes with NVAs; the same prefix can't exist in two routed locations.", fr: "Route Server échange des routes avec des appliances virtuelles réseau ; un même préfixe ne peut pas exister à deux emplacements routés." }
    d: { en: "Peering connects virtual networks with distinct, non-overlapping address spaces.", fr: "Le peering relie des réseaux virtuels aux espaces d'adressage distincts et sans chevauchement." }
references:
  - title: Extend your on-premises subnets into Azure using extended network for Azure
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/azure/azure-extended-network
