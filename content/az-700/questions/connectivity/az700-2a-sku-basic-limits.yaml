id: az700-2a-sku-basic-limits
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation plans a VPN gateway for a proof-of-concept environment and wants to use the Basic SKU to reduce costs. The project team lists the following requirements:

    - Eight site-to-site connections to partner sites
    - BGP route exchange with the on-premises routers
    - A custom IPsec/IKE policy on one connection
    - Point-to-site access over IKEv2 for administrators
    - Deployment by using an Azure PowerShell script

    Which two requirements prevent the use of the Basic SKU?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation prévoit une passerelle VPN pour un environnement de preuve de concept et souhaite utiliser la référence SKU Basic pour réduire les coûts. L'équipe projet liste les exigences suivantes :

    - Huit connexions de site à site vers des sites partenaires
    - L'échange de routes BGP avec les routeurs locaux
    - Une stratégie IPsec/IKE personnalisée sur une connexion
    - Un accès de point à site en IKEv2 pour les administrateurs
    - Un déploiement par un script Azure PowerShell

    Quelles sont les deux exigences qui empêchent d'utiliser la référence SKU Basic ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Eight site-to-site connections", fr: "Huit connexions de site à site" } }
    - { id: b, text: { en: "BGP route exchange", fr: "L'échange de routes BGP" } }
    - { id: c, text: { en: "A custom IPsec/IKE policy", fr: "Une stratégie IPsec/IKE personnalisée" } }
    - { id: d, text: { en: "Point-to-site access over IKEv2", fr: "L'accès de point à site en IKEv2" } }
    - { id: e, text: { en: "Deployment by using Azure PowerShell", fr: "Le déploiement par Azure PowerShell" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      BGP and custom IPsec/IKE policies are supported on every VPN Gateway SKU except Basic. A route-based Basic gateway still supports up to 10 site-to-site tunnels and IKEv2 point-to-site connections.
    fr: |
      BGP et les stratégies IPsec/IKE personnalisées sont pris en charge sur toutes les références SKU de VPN Gateway sauf Basic. Une passerelle Basic basée sur des itinéraires prend tout de même en charge jusqu'à 10 tunnels de site à site et les connexions de point à site IKEv2.
  options:
    a: { en: "A route-based Basic gateway supports up to 10 site-to-site tunnels.", fr: "Une passerelle Basic basée sur des itinéraires prend en charge jusqu'à 10 tunnels de site à site." }
    d: { en: "The Basic SKU supports IKEv2 for point-to-site; it lacks OpenVPN and RADIUS, not IKEv2.", fr: "La référence Basic prend en charge IKEv2 en point à site ; il lui manque OpenVPN et RADIUS, pas IKEv2." }
    e: { en: "The Basic SKU can be created only with PowerShell or the Azure CLI, so a PowerShell script is the required method.", fr: "La référence Basic ne peut être créée qu'avec PowerShell ou Azure CLI : un script PowerShell est justement la méthode requise." }
references:
  - title: About gateway SKUs
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-gateway-skus
  - title: VPN Gateway FAQ
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-vpn-faq
