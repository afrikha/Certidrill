id: az700-2a-s2s-ha-tunnel-count
objective: "2.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam plans the most resilient site-to-site design between its datacenter and a virtual network named **VNet-Hub**:

    - VNet-Hub will have one VPN gateway named **GW-Hub** (VpnGw3AZ, active-active mode).
    - The datacenter will use two VPN devices, **VPN-A** and **VPN-B**, for the same on-premises network.
    - BGP will be enabled on every connection.

    You need to identify the resources required and the resulting number of IPsec tunnels.

    How should you complete the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit la conception de site à site la plus résiliente possible entre son centre de données et un réseau virtuel nommé **VNet-Hub** :

    - VNet-Hub aura une passerelle VPN nommée **GW-Hub** (VpnGw3AZ, mode actif/actif).
    - Le centre de données utilisera deux périphériques VPN, **VPN-A** et **VPN-B**, pour le même réseau local.
    - BGP sera activé sur chaque connexion.

    Vous devez identifier les ressources nécessaires et le nombre de tunnels IPsec qui en résulte.

    Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Number of local network gateways to create: [[lng]]

      Number of site-to-site connections to create on GW-Hub: [[conn]]

      Number of IPsec tunnels established between Azure and the datacenter: [[tun]]
    fr: |
      Nombre de passerelles de réseau local à créer : [[lng]]

      Nombre de connexions de site à site à créer sur GW-Hub : [[conn]]

      Nombre de tunnels IPsec établis entre Azure et le centre de données : [[tun]]
  slots:
    - id: lng
      options:
        - { id: l1, text: "1" }
        - { id: l2, text: "2" }
        - { id: l4, text: "4" }
    - id: conn
      options:
        - { id: c1, text: "1" }
        - { id: c2, text: "2" }
        - { id: c4, text: "4" }
    - id: tun
      options:
        - { id: t2, text: "2" }
        - { id: t4, text: "4" }
        - { id: t8, text: "8" }
shuffle: false
answer:
  values: { lng: l2, conn: c2, tun: t4 }
explanation:
  correct:
    en: |
      You create one local network gateway per on-premises VPN device (two) and one connection from the VPN gateway to each local network gateway (two). In active-active mode, each of the two gateway instances establishes a tunnel for every connection, so the dual-redundancy design gives a full mesh of four IPsec tunnels, all of which count against the tunnel limit of the SKU.
    fr: |
      Vous créez une passerelle de réseau local par périphérique VPN local (deux) et une connexion de la passerelle VPN vers chaque passerelle de réseau local (deux). En mode actif/actif, chacune des deux instances de passerelle établit un tunnel pour chaque connexion : la conception à double redondance donne un maillage complet de quatre tunnels IPsec, qui comptent tous dans la limite de tunnels de la référence SKU.
  options:
    l1: { en: "One local network gateway represents a single device endpoint.", fr: "Une passerelle de réseau local représente le point de terminaison d'un seul périphérique." }
    c4: { en: "Both tunnels of an active-active gateway to one device belong to the same connection.", fr: "Les deux tunnels d'une passerelle actif/actif vers un même périphérique appartiennent à la même connexion." }
    t2: { en: "Two tunnels is the active-active result with a single on-premises device.", fr: "Deux tunnels correspondent au mode actif/actif avec un seul périphérique local." }
references:
  - title: About active-active mode VPN gateways
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-active-active-gateways
  - title: Design highly available gateway connectivity for cross-premises and VNet-to-VNet connections
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-highlyavailable
