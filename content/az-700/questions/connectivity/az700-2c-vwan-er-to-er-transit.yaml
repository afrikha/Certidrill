id: az700-2c-vwan-er-to-er-transit
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a Standard virtual WAN with a virtual hub named **Hub1**. Two datacenters, DC-Paris and DC-Frankfurt, each connect to Hub1 through their own ExpressRoute Premium circuit. Twenty branch offices connect to Hub1 by using site-to-site VPN.

    You need to enable traffic between DC-Paris and DC-Frankfurt over the Microsoft network. The solution must use the most direct path between the circuits and must not require a firewall or a network virtual appliance in Hub1.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un réseau étendu virtuel Standard avec un hub virtuel nommé **Hub1**. Deux centres de données, DC-Paris et DC-Frankfurt, se connectent chacun à Hub1 par leur propre circuit ExpressRoute Premium. Vingt succursales se connectent à Hub1 par VPN de site à site.

    Vous devez permettre le trafic entre DC-Paris et DC-Frankfurt par le réseau Microsoft. La solution doit utiliser le chemin le plus direct entre les circuits et ne doit nécessiter ni pare-feu ni appliance virtuelle réseau dans Hub1.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable Allow branch-to-branch traffic in the virtual WAN configuration.", fr: "Activer Allow branch-to-branch traffic dans la configuration du réseau étendu virtuel." } }
    - { id: b, text: { en: "Enable ExpressRoute Global Reach between the two circuits.", fr: "Activer ExpressRoute Global Reach entre les deux circuits." } }
    - { id: c, text: { en: "Configure a private traffic routing policy for Hub1.", fr: "Configurer une stratégie de routage du trafic privé pour Hub1." } }
    - { id: d, text: { en: "Set the hub routing preference of Hub1 to AS Path.", fr: "Régler la préférence de routage du hub de Hub1 sur AS Path." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Global Reach links the two circuits directly over the Microsoft backbone, so DC-Paris and DC-Frankfurt exchange traffic without transiting the virtual hub, which is the more direct path. No security appliance is needed.
    fr: |
      Global Reach relie directement les deux circuits par le réseau principal de Microsoft : DC-Paris et DC-Frankfurt échangent leur trafic sans transiter par le hub virtuel, ce qui constitue le chemin le plus direct. Aucune appliance de sécurité n'est nécessaire.
  options:
    a:
      en: |
        Branch-to-branch provides transit between VPN branches, and between VPN and ExpressRoute sites; it doesn't provide transit between two ExpressRoute circuits.
      fr: |
        Le transit de branche à branche relie les branches VPN entre elles, et les sites VPN aux sites ExpressRoute ; il n'assure pas le transit entre deux circuits ExpressRoute.
    c:
      en: |
        A private traffic routing policy can provide ExpressRoute-to-ExpressRoute transit, but only through a firewall or security NVA in the hub, which the requirements exclude.
      fr: |
        Une stratégie de routage du trafic privé peut assurer le transit entre circuits ExpressRoute, mais uniquement par un pare-feu ou une NVA de sécurité dans le hub, ce que les exigences excluent.
    d:
      en: |
        The hub routing preference chooses among routes to on-premises prefixes; it doesn't create transit between the circuits.
      fr: |
        La préférence de routage du hub choisit parmi les routes vers les préfixes locaux ; elle ne crée pas de transit entre les circuits.
references:
  - title: Global transit network architecture and Virtual WAN
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-global-transit-network-architecture
  - title: Azure Virtual WAN FAQ
