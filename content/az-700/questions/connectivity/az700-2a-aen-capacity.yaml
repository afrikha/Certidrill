id: az700-2a-aen-capacity
objective: "2.1.9"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware deployed Azure Extended Network between its datacenter and a virtual network named **VNet-Ext**. A firewall sits between the two virtual appliances, and Litware plans to extend more addresses and subnets.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware a déployé Azure Extended Network entre son centre de données et un réseau virtuel nommé **VNet-Ext**. Un pare-feu se trouve entre les deux appliances virtuelles, et Litware prévoit d'étendre davantage d'adresses et de sous-réseaux.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The existing pair of virtual appliances can extend two more on-premises subnets.
        fr: La paire d'appliances virtuelles existante peut étendre deux sous-réseaux locaux supplémentaires.
    - id: s2
      text:
        en: You can configure up to 250 IP addresses to be extended.
        fr: Vous pouvez configurer jusqu'à 250 adresses IP à étendre.
    - id: s3
      text:
        en: The firewall must allow UDP traffic between the appliances on the configured port, which is 4789 by default.
        fr: Le pare-feu doit autoriser le trafic UDP entre les appliances sur le port configuré, qui est 4789 par défaut.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Each extended subnet requires its own pair of appliances, so more subnets require more pairs. Up to 250 IP addresses can be configured for extension, each added explicitly or selected from the discovered addresses. The appliances use a VXLAN tunnel over UDP, port 4789 by default, which a firewall between them must allow, along with asymmetric routing.
    fr: |
      Chaque sous-réseau étendu exige sa propre paire d'appliances : davantage de sous-réseaux impose davantage de paires. Jusqu'à 250 adresses IP peuvent être configurées pour l'extension, chacune ajoutée explicitement ou choisie parmi les adresses découvertes. Les appliances utilisent un tunnel VXLAN sur UDP, port 4789 par défaut, qu'un pare-feu placé entre elles doit autoriser, ainsi que le routage asymétrique.
references:
  - title: Extend your on-premises subnets into Azure using extended network for Azure
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/azure/azure-extended-network
