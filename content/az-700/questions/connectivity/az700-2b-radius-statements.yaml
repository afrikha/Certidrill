id: az700-2b-radius-statements
objective: "2.2.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Litware plans to configure point-to-site VPN connections on Azure VPN gateways so that users sign in with their Active Directory Domain Services credentials through a RADIUS server.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de configurer des connexions VPN de point à site sur des passerelles VPN Azure pour que les utilisateurs se connectent avec leurs identifiants Active Directory Domain Services par l'intermédiaire d'un serveur RADIUS.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A VPN gateway that uses the Basic SKU supports RADIUS authentication for point-to-site connections.
        fr: Une passerelle VPN de référence SKU Basic prend en charge l'authentification RADIUS pour les connexions de point à site.
    - id: s2
      text:
        en: During authentication, the VPN gateway forwards the authentication messages between the VPN client and the RADIUS server.
        fr: Pendant l'authentification, la passerelle VPN relaie les messages d'authentification entre le client VPN et le serveur RADIUS.
    - id: s3
      text:
        en: A RADIUS server integrated with Active Directory Certificate Services can authenticate clients by certificate without the root certificate being uploaded to Azure.
        fr: Un serveur RADIUS intégré à Active Directory Certificate Services peut authentifier les clients par certificat sans que le certificat racine soit chargé dans Azure.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: The Basic SKU doesn't support RADIUS authentication; any other route-based VPN gateway SKU does. With RADIUS, the gateway is a pass-through that forwards authentication messages between the client and the RADIUS server. When the RADIUS server is integrated with AD Certificate Services, certificate authentication is handled by RADIUS, so root and revoked certificates don't have to be uploaded to Azure.
    fr: "La référence SKU Basic ne prend pas en charge l'authentification RADIUS ; les autres références SKU de passerelle VPN basée sur des routes la prennent en charge. Avec RADIUS, la passerelle est un intermédiaire qui relaie les messages d'authentification entre le client et le serveur RADIUS. Quand le serveur RADIUS est intégré à AD Certificate Services, l'authentification par certificat est gérée par RADIUS : il n'est pas nécessaire de charger les certificats racines et révoqués dans Azure."
references:
  - title: About Azure Point-to-Site VPN connections - Azure VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about
  - title: About gateway SKUs
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-gateway-skus
