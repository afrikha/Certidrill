id: az700-2b-ana-choice
objective: "2.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has a retail store that contains two Windows Server 2022 servers. The servers are managed by Windows Admin Center, which is registered with Azure. The store has an internet connection, but no VPN device and no public IP address.

    The two servers must access virtual machines in an Azure virtual network named **VNet1** by using private IP addresses. The solution must minimize administrative effort.

    What should you use?
  fr: |
    Litware dispose d'un magasin qui contient deux serveurs Windows Server 2022. Les serveurs sont gérés par Windows Admin Center, inscrit auprès d'Azure. Le magasin a une connexion Internet, mais ni périphérique VPN ni adresse IP publique.

    Les deux serveurs doivent accéder à des machines virtuelles d'un réseau virtuel Azure nommé **VNet1** par leurs adresses IP privées. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A site-to-site VPN connection to a VPN gateway in VNet1", fr: "Une connexion VPN de site à site vers une passerelle VPN dans VNet1" } }
    - { id: b, text: { en: "Azure Bastion deployed in VNet1", fr: "Azure Bastion déployé dans VNet1" } }
    - { id: c, text: { en: "An ExpressRoute circuit linked to VNet1", fr: "Un circuit ExpressRoute lié à VNet1" } }
    - { id: d, text: { en: "Azure Network Adapter added from Windows Admin Center", fr: "Azure Network Adapter ajouté depuis Windows Admin Center" } }
answer: { optionId: d }
explanation:
  correct:
    en: Azure Network Adapter connects a few servers to a virtual network over a point-to-site VPN, without a VPN device or a public IP address. Windows Admin Center configures both the Azure gateway and the VPN client on each server, which keeps the administrative effort low.
    fr: "Azure Network Adapter connecte quelques serveurs à un réseau virtuel par un VPN de point à site, sans périphérique VPN ni adresse IP publique. Windows Admin Center configure à la fois la passerelle Azure et le client VPN de chaque serveur, ce qui limite l'effort d'administration."
  options:
    a: { en: "A site-to-site VPN needs an on-premises VPN device with a public IP address, which the store doesn't have.", fr: "Un VPN de site à site exige un périphérique VPN local doté d'une adresse IP publique, dont le magasin ne dispose pas." }
    b: { en: "Azure Bastion provides RDP and SSH access to VMs from a browser; it doesn't give the servers network access to VNet1.", fr: "Azure Bastion fournit un accès RDP et SSH aux machines virtuelles depuis un navigateur ; il ne donne pas aux serveurs un accès réseau à VNet1." }
    c: { en: "ExpressRoute requires a connectivity provider and edge routers, far more effort than two servers justify.", fr: "ExpressRoute exige un fournisseur de connectivité et des routeurs de périphérie, un effort démesuré pour deux serveurs." }
references:
  - title: Connect server to Azure Virtual Network - Azure Network Adapter
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/azure/use-azure-network-adapter
