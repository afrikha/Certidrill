id: az700-2b-er-dr-steering
objective: "2.3.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a virtual network named **VNet1** whose ExpressRoute gateway has two connections:

    | Connection | Circuit | Peering location | Routing weight |
    | --- | --- | --- | --- |
    | Conn-Paris | CKT-Paris | Paris | 0 |
    | Conn-Marseille | CKT-Marseille | Marseille | 0 |

    The on-premises routers advertise the same prefix, 10.20.0.0/16, with the same AS path over both circuits. The on-premises network uses iBGP between the edge routers.

    You need to ensure that CKT-Paris carries the traffic in both directions and that CKT-Marseille is used only if CKT-Paris fails. The traffic must stay symmetric.

    What should you configure for each direction? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un réseau virtuel nommé **VNet1** dont la passerelle ExpressRoute a deux connexions :

    | Connexion | Circuit | Emplacement de peering | Poids de routage |
    | --- | --- | --- | --- |
    | Conn-Paris | CKT-Paris | Paris | 0 |
    | Conn-Marseille | CKT-Marseille | Marseille | 0 |

    Les routeurs locaux publient le même préfixe, 10.20.0.0/16, avec le même chemin d'AS sur les deux circuits. Le réseau local utilise iBGP entre les routeurs de périphérie.

    Vous devez faire en sorte que CKT-Paris transporte le trafic dans les deux sens et que CKT-Marseille ne soit utilisé qu'en cas de défaillance de CKT-Paris. Le trafic doit rester symétrique.

    Que devez-vous configurer pour chaque sens ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Traffic from VNet1 to on-premises: [[azure]]

      Traffic from on-premises to VNet1: [[onprem]]
    fr: |
      Trafic de VNet1 vers le réseau local : [[azure]]

      Trafic du réseau local vers VNet1 : [[onprem]]
  slots:
    - id: azure
      options:
        - { id: weightparis, text: { en: "A higher routing weight on Conn-Paris", fr: "Un poids de routage plus élevé sur Conn-Paris" } }
        - { id: weightmrs, text: { en: "A higher routing weight on Conn-Marseille", fr: "Un poids de routage plus élevé sur Conn-Marseille" } }
        - { id: prependparis, text: { en: "AS path prepending on the routes advertised over CKT-Paris", fr: "Un allongement du chemin d'AS sur les routes publiées par CKT-Paris" } }
        - { id: lpparis, text: { en: "A higher local preference on the on-premises routers for routes received over CKT-Paris", fr: "Une préférence locale plus élevée sur les routeurs locaux pour les routes reçues par CKT-Paris" } }
    - id: onprem
      options:
        - { id: lpparis, text: { en: "A higher local preference on the on-premises routers for routes received over CKT-Paris", fr: "Une préférence locale plus élevée sur les routeurs locaux pour les routes reçues par CKT-Paris" } }
        - { id: weightparis, text: { en: "A higher routing weight on Conn-Paris", fr: "Un poids de routage plus élevé sur Conn-Paris" } }
        - { id: specificparis, text: { en: "More specific on-premises prefixes advertised over CKT-Paris", fr: "Des préfixes locaux plus spécifiques publiés par CKT-Paris" } }
        - { id: prependmrs, text: { en: "AS path prepending on the routes advertised over CKT-Marseille", fr: "Un allongement du chemin d'AS sur les routes publiées par CKT-Marseille" } }
answer:
  values: { azure: weightparis, onprem: lpparis }
explanation:
  correct:
    en: For traffic leaving Azure, the gateway prefers the connection with the highest routing weight, so Conn-Paris gets the higher weight. For traffic leaving on-premises, the edge routers choose the path; a higher iBGP local preference for the routes learned over CKT-Paris makes them prefer that circuit. Configuring both keeps the flows symmetric.
    fr: "Pour le trafic qui sort d'Azure, la passerelle préfère la connexion de poids de routage le plus élevé : Conn-Paris reçoit donc le poids le plus élevé. Pour le trafic qui sort du réseau local, ce sont les routeurs de périphérie qui choisissent ; une préférence locale iBGP plus élevée pour les routes apprises par CKT-Paris leur fait préférer ce circuit. Configurer les deux garde des flux symétriques."
  options:
    prependparis: { en: "Prepending on CKT-Paris makes Azure prefer CKT-Marseille, the opposite of the goal.", fr: "Allonger le chemin sur CKT-Paris fait préférer CKT-Marseille par Azure, l'inverse de l'objectif." }
    specificparis: { en: "More specific prefixes advertised by on-premises influence the path Azure chooses, not the path on-premises chooses.", fr: "Des préfixes plus spécifiques publiés par le réseau local influencent le chemin choisi par Azure, pas celui choisi par le réseau local." }
    prependmrs: { en: "Prepending on routes that on-premises advertises influences Azure's choice, not the on-premises routers' choice.", fr: "Allonger le chemin des routes publiées par le réseau local influence le choix d'Azure, pas celui des routeurs locaux." }
references:
  - title: "Azure ExpressRoute: Designing for disaster recovery"
    url: https://learn.microsoft.com/en-us/azure/expressroute/designing-for-disaster-recovery-with-expressroute-privatepeering
