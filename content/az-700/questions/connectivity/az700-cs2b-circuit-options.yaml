id: az700-cs2b-circuit-options
objective: "2.3.2"
type: dragdrop
caseStudy: az700-cs2b-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You need to choose the ExpressRoute options for the planned connections. The solution must meet the requirements.

    Which option should you use for each connection? To answer, drag the appropriate options to the correct connections. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez choisir les options ExpressRoute des connexions prévues. La solution doit respecter les exigences.

    Quelle option devez-vous utiliser pour chaque connexion ? Pour répondre, faites glisser les options appropriées vers les connexions correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: local, text: { en: "Local tier", fr: "Niveau Local" } }
    - { id: standard, text: { en: "Standard tier", fr: "Niveau Standard" } }
    - { id: premium, text: { en: "Premium tier", fr: "Niveau Premium" } }
    - { id: direct, text: "ExpressRoute Direct" }
    - { id: globalreach, text: "ExpressRoute Global Reach" }
  targets:
    - { id: ams, text: { en: "ER-AMS, after VNet-US is linked", fr: "ER-AMS, une fois VNet-US lié" } }
    - { id: bulk, text: "ER-AMS-Bulk" }
    - { id: platform, text: { en: "The data platform connection", fr: "La connexion de la plateforme de données" } }
answer:
  mapping: { ams: premium, bulk: local, platform: direct }
explanation:
  correct:
    en: |
      A Standard circuit reaches only the Azure regions of its geopolitical area; linking VNet-US in East US 2 to a circuit at Amsterdam requires Premium. A Local circuit reaches only the region or regions near its peering location, here West Europe, and includes outbound data transfer, which minimizes the cost of 150 TB a month leaving Azure. ExpressRoute Direct provides dedicated 10, 100 or 400 Gbps port pairs into the Microsoft network, and MACsec is configured on these ports to encrypt the links between the edge routers.
    fr: |
      Un circuit Standard n'atteint que les régions Azure de sa zone géopolitique ; lier VNet-US dans East US 2 à un circuit d'Amsterdam exige Premium. Un circuit Local n'atteint que la ou les régions proches de son emplacement de peering, ici West Europe, et inclut le transfert de données sortant, ce qui réduit au minimum le coût de 150 To par mois qui quittent Azure. ExpressRoute Direct fournit des paires de ports dédiés de 10, 100 ou 400 Gbit/s vers le réseau Microsoft, et MACsec se configure sur ces ports pour chiffrer les liaisons entre les routeurs de périphérie.
  options:
    standard: { en: "Standard is the current tier of ER-AMS; it can't link a virtual network of another geopolitical area, and on ER-AMS-Bulk it would charge the outbound data.", fr: "Standard est le niveau actuel de ER-AMS ; il ne peut pas lier un réseau virtuel d'une autre zone géopolitique et, sur ER-AMS-Bulk, il facturerait les données sortantes." }
    globalreach: { en: "Global Reach connects two on-premises sites through their circuits; it doesn't connect virtual networks or encrypt links.", fr: "Global Reach relie deux sites locaux par leurs circuits ; il ne connecte pas de réseaux virtuels et ne chiffre pas les liaisons." }
references:
  - title: ExpressRoute FAQ
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-faqs
  - title: Configure MACsec on ExpressRoute Direct ports
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-macsec
