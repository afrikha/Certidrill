id: az700-2a-aen-requirements
objective: "2.1.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso is migrating a legacy application from its datacenter to Azure. The application servers are on the on-premises subnet 192.168.40.0/24 and can't change their IP addresses. Contoso plans to use Azure Extended Network to stretch the subnet into a virtual network named **VNet-Migr**. VNet-Migr already contains a subnet that uses 192.168.40.0/24 and a routable subnet.

    Which two actions should you perform in Azure before you deploy the extended network from Windows Admin Center? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso migre une application héritée de son centre de données vers Azure. Les serveurs de l'application se trouvent sur le sous-réseau local 192.168.40.0/24 et ne peuvent pas changer d'adresse IP. Contoso prévoit d'utiliser Azure Extended Network pour étendre ce sous-réseau dans un réseau virtuel nommé **VNet-Migr**. VNet-Migr contient déjà un sous-réseau qui utilise 192.168.40.0/24 et un sous-réseau routable.

    Quelles sont les deux actions à effectuer dans Azure avant de déployer le réseau étendu depuis Windows Admin Center ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Connect VNet-Migr to the datacenter by using a site-to-site VPN or ExpressRoute connection.", fr: "Relier VNet-Migr au centre de données par une connexion VPN de site à site ou ExpressRoute." } }
    - { id: b, text: { en: "Deploy Azure Route Server in VNet-Migr and peer it with the datacenter routers.", fr: "Déployer Azure Route Server dans VNet-Migr et établir un peering BGP avec les routeurs du centre de données." } }
    - { id: c, text: { en: "Deploy a Windows Server 2022 Azure Edition VM that supports nested virtualization, with one NIC in each of the two subnets.", fr: "Déployer une machine virtuelle Windows Server 2022 Azure Edition qui prend en charge la virtualisation imbriquée, avec une carte réseau dans chacun des deux sous-réseaux." } }
    - { id: d, text: { en: "Deploy a Windows Server 2019 Datacenter VM that supports nested virtualization, with one NIC in each of the two subnets.", fr: "Déployer une machine virtuelle Windows Server 2019 Datacenter qui prend en charge la virtualisation imbriquée, avec une carte réseau dans chacun des deux sous-réseaux." } }
    - { id: e, text: { en: "Create a Virtual WAN hub and connect VNet-Migr and the datacenter to it.", fr: "Créer un hub Virtual WAN et y connecter VNet-Migr et le centre de données." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Extended network for Azure needs a virtual network gateway that connects the virtual network to the on-premises network over site-to-site VPN or ExpressRoute. The Azure virtual appliance must run Windows Server 2022 Azure Edition on a VM size that supports nested virtualization, with its primary NIC on the routable subnet and a second NIC on the extended subnet. The two appliances then build a VXLAN tunnel between them.
    fr: |
      Le réseau étendu pour Azure exige une passerelle de réseau virtuel qui relie le réseau virtuel au réseau local par un VPN de site à site ou ExpressRoute. L'appliance virtuelle Azure doit exécuter Windows Server 2022 Azure Edition sur une taille de machine virtuelle qui prend en charge la virtualisation imbriquée, avec sa carte réseau principale sur le sous-réseau routable et une seconde carte réseau sur le sous-réseau étendu. Les deux appliances établissent ensuite un tunnel VXLAN entre elles.
  options:
    b: { en: "Route Server exchanges BGP routes with NVAs; it doesn't stretch a layer 2 subnet.", fr: "Route Server échange des routes BGP avec des appliances virtuelles réseau ; il n'étend pas un sous-réseau de couche 2." }
    d: { en: "The Azure appliance requires Windows Server 2022 Azure Edition; Windows Server 2019 is supported only for the on-premises appliance.", fr: "L'appliance Azure exige Windows Server 2022 Azure Edition ; Windows Server 2019 n'est pris en charge que pour l'appliance locale." }
    e: { en: "Virtual WAN isn't a requirement; a VPN or ExpressRoute gateway connection to the virtual network is enough.", fr: "Virtual WAN n'est pas requis ; une connexion par passerelle VPN ou ExpressRoute vers le réseau virtuel suffit." }
references:
  - title: Extend your on-premises subnets into Azure using extended network for Azure
    url: https://learn.microsoft.com/en-us/windows-server/manage/windows-admin-center/azure/azure-extended-network
