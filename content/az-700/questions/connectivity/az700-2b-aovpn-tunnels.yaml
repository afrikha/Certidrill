id: az700-2b-aovpn-tunnels
objective: "2.2.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a route-based VPN gateway named **VPNGW1** configured for point-to-site connections with IKEv2 and certificate authentication. Contoso plans to configure both an Always On VPN device tunnel and an Always On VPN user tunnel on its domain-joined Windows 11 Enterprise computers.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une passerelle VPN basée sur des routes nommée **VPNGW1**, configurée pour les connexions de point à site avec IKEv2 et l'authentification par certificat. Contoso prévoit de configurer à la fois un tunnel d'appareil VPN Always On et un tunnel utilisateur VPN Always On sur ses ordinateurs Windows 11 Entreprise joints au domaine.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The device tunnel can connect to VPNGW1 before a user signs in to the computer.
        fr: Le tunnel d'appareil peut se connecter à VPNGW1 avant qu'un utilisateur ouvre une session sur l'ordinateur.
    - id: s2
      text:
        en: The client certificate used by the device tunnel must be installed in the Current User certificate store.
        fr: Le certificat client utilisé par le tunnel d'appareil doit être installé dans le magasin de certificats Current User.
    - id: s3
      text:
        en: The device tunnel and the user tunnel can be connected at the same time.
        fr: Le tunnel d'appareil et le tunnel utilisateur peuvent être connectés en même temps.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: A device tunnel connects to the VPN gateway before users sign in, for pre-sign-in connectivity and device management. It authenticates with a computer certificate stored in the Local Machine store, and its profile is deployed in the LOCAL SYSTEM context; the user certificate in the Current User store is used by the user tunnel. The two tunnels operate independently and can be connected simultaneously.
    fr: "Un tunnel d'appareil se connecte à la passerelle VPN avant l'ouverture de session des utilisateurs, pour la connectivité préalable et la gestion des appareils. Il s'authentifie avec un certificat d'ordinateur stocké dans le magasin Local Machine, et son profil est déployé dans le contexte LOCAL SYSTEM ; le certificat utilisateur du magasin Current User sert au tunnel utilisateur. Les deux tunnels fonctionnent indépendamment et peuvent être connectés simultanément."
references:
  - title: Configure an Always-On VPN tunnel - Azure VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-howto-always-on-device-tunnel
  - title: Configure an Always-On VPN user tunnel - Azure VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-howto-always-on-user-tunnel
