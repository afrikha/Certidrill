id: az700-2c-vwan-isolate-vnets
objective: "2.4.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a Standard virtual WAN with a virtual hub named **Hub1**. Hub1 has the following connections:

    - virtual network connections to VNet-A, VNet-B and VNet-C;
    - site-to-site VPN connections to 25 branch offices;
    - an ExpressRoute connection to the headquarters.

    You create a custom route table named **RT_VNet** in Hub1. You need to configure routing so that:

    - VNet-A, VNet-B and VNet-C can't communicate with each other through Hub1;
    - each virtual network can communicate with all the branch offices and the headquarters;
    - the branch offices and the headquarters keep communicating with each other through Hub1;
    - no firewall or network virtual appliance is used.

    How should you configure association and propagation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un réseau étendu virtuel Standard avec un hub virtuel nommé **Hub1**. Hub1 possède les connexions suivantes :

    - des connexions de réseau virtuel vers VNet-A, VNet-B et VNet-C ;
    - des connexions VPN de site à site vers 25 succursales ;
    - une connexion ExpressRoute vers le siège.

    Vous créez dans Hub1 une table de routage personnalisée nommée **RT_VNet**. Vous devez configurer le routage pour que :

    - VNet-A, VNet-B et VNet-C ne puissent pas communiquer entre eux par Hub1 ;
    - chaque réseau virtuel puisse communiquer avec toutes les succursales et le siège ;
    - les succursales et le siège continuent de communiquer entre eux par Hub1 ;
    - aucun pare-feu ni aucune appliance virtuelle réseau ne soient utilisés.

    Comment devez-vous configurer l'association et la propagation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Virtual network connections, associated route table: [[vassoc]]

      Virtual network connections, propagate to: [[vprop]]

      Branch connections (VPN and ExpressRoute), propagate to: [[bprop]]
    fr: |
      Connexions de réseau virtuel, table de routage associée : [[vassoc]]

      Connexions de réseau virtuel, propagation vers : [[vprop]]

      Connexions de branche (VPN et ExpressRoute), propagation vers : [[bprop]]
  slots:
    - id: vassoc
      options:
        - { id: a-def, text: Default }
        - { id: a-rtv, text: RT_VNet }
        - { id: a-none, text: None }
    - id: vprop
      options:
        - { id: p-def, text: Default }
        - { id: p-rtv, text: RT_VNet }
        - { id: p-both, text: { en: "Default and RT_VNet", fr: "Default et RT_VNet" } }
    - id: bprop
      options:
        - { id: b-def, text: { en: "Default only", fr: "Default uniquement" } }
        - { id: b-rtv, text: { en: "RT_VNet only", fr: "RT_VNet uniquement" } }
        - { id: b-both, text: { en: "Default and RT_VNet", fr: "Default et RT_VNet" } }
        - { id: b-none, text: None }
answer:
  values: { vassoc: a-rtv, vprop: p-def, bprop: b-both }
explanation:
  correct:
    en: |
      The virtual networks are associated with RT_VNet, so they route by using only the routes in that table. Only the branches propagate to RT_VNet, so the virtual networks learn the branch prefixes but not each other's. The virtual networks propagate to Default, which is associated with the branch connections, so the branches can reach every virtual network. Branches propagate to Default as well so that all branches keep learning each other's routes.
    fr: |
      Les réseaux virtuels sont associés à RT_VNet : ils routent uniquement avec les routes de cette table. Seules les branches propagent vers RT_VNet : les réseaux virtuels apprennent les préfixes des branches, mais pas ceux des autres réseaux virtuels. Les réseaux virtuels propagent vers Default, associée aux connexions de branche : les branches peuvent joindre chaque réseau virtuel. Les branches propagent aussi vers Default afin de continuer à apprendre leurs routes mutuelles.
  options:
    p-rtv:
      en: |
        If the virtual networks propagated to RT_VNet, which they are associated with, they would learn each other's prefixes.
      fr: |
        Si les réseaux virtuels propageaient vers RT_VNet, à laquelle ils sont associés, ils apprendraient leurs préfixes mutuels.
    b-rtv:
      en: |
        If the branches propagated only to RT_VNet, the Default route table, which the branch connections are associated with, would no longer contain the branch prefixes, and the branches couldn't reach each other.
      fr: |
        Si les branches ne propageaient que vers RT_VNet, la table de routage Default, à laquelle les connexions de branche sont associées, ne contiendrait plus les préfixes des branches, et les branches ne pourraient plus se joindre.
    a-def:
      en: |
        The Default route table receives the routes of all the virtual networks, so associating the virtual networks with it lets them reach each other.
      fr: |
        La table de routage Default reçoit les routes de tous les réseaux virtuels : y associer les réseaux virtuels leur permet de se joindre.
references:
  - title: "Scenario: Isolating VNets"
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/scenario-isolate-vnets
  - title: About virtual hub routing
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/about-virtual-hub-routing
