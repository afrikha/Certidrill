id: az700-2c-vwan-hub-basics
objective: "2.4.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Standard virtual WAN named **VWAN1**. You are creating a virtual hub named **Hub-FR** in France Central. The environment uses the following address ranges:

    | Network | Address space |
    | --- | --- |
    | Spoke virtual networks | 10.1.0.0/16, 10.2.0.0/16, 10.3.0.0/16 |
    | On-premises datacenter | 10.200.0.0/16, 192.168.0.0/16 |

    Hub-FR must meet the following requirements:

    - Azure Firewall will be deployed in the hub; the hub address space must be as small as possible.
    - The spoke virtual networks will contain up to 4,000 virtual machines; minimize the hub router capacity cost.
    - When the hub learns the same on-premises prefix from an ExpressRoute connection and a site-to-site VPN connection, it must use the VPN connection.

    How should you configure the Basics tab of Hub-FR? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un réseau étendu virtuel Standard nommé **VWAN1**. Vous créez un hub virtuel nommé **Hub-FR** dans France Central. L'environnement utilise les plages d'adresses suivantes :

    | Réseau | Espace d'adressage |
    | --- | --- |
    | Réseaux virtuels spoke | 10.1.0.0/16, 10.2.0.0/16, 10.3.0.0/16 |
    | Centre de données local | 10.200.0.0/16, 192.168.0.0/16 |

    Hub-FR doit répondre aux exigences suivantes :

    - Le Pare-feu Azure sera déployé dans le hub ; l'espace d'adressage du hub doit être le plus petit possible.
    - Les réseaux virtuels spoke contiendront jusqu'à 4 000 machines virtuelles ; réduisez au minimum le coût de capacité du routeur du hub.
    - Quand le hub apprend le même préfixe local par une connexion ExpressRoute et par une connexion VPN de site à site, il doit utiliser la connexion VPN.

    Comment devez-vous configurer l'onglet Basics de Hub-FR ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Hub private address space: [[space]]

      Virtual hub capacity: [[capacity]]

      Hub routing preference: [[pref]]
    fr: |
      Espace d'adressage privé du hub (Hub private address space) : [[space]]

      Capacité du hub virtuel (Virtual hub capacity) : [[capacity]]

      Préférence de routage du hub (Hub routing preference) : [[pref]]
  slots:
    - id: space
      options:
        - { id: s24, text: 10.250.0.0/24 }
        - { id: s22, text: 10.250.0.0/22 }
        - { id: s22overlap, text: 10.200.0.0/22 }
        - { id: s20, text: 10.250.0.0/20 }
    - id: capacity
      options:
        - { id: riu2, text: { en: "2 routing infrastructure units", fr: "2 unités d'infrastructure de routage" } }
        - { id: riu3, text: { en: "3 routing infrastructure units", fr: "3 unités d'infrastructure de routage" } }
        - { id: riu4, text: { en: "4 routing infrastructure units", fr: "4 unités d'infrastructure de routage" } }
        - { id: riu8, text: { en: "8 routing infrastructure units", fr: "8 unités d'infrastructure de routage" } }
    - id: pref
      options:
        - { id: er, text: ExpressRoute }
        - { id: vpn, text: VPN }
        - { id: aspath, text: AS Path }
answer:
  values: { space: s22, capacity: riu4, pref: vpn }
explanation:
  correct:
    en: |
      A hub that hosts Azure Firewall needs at least a /22 address space, which must not overlap with the spokes or on-premises ranges, so 10.250.0.0/22. The default capacity of 2 routing infrastructure units supports 2,000 VMs and each additional unit adds 1,000 VMs, so 4 units support 4,000 VMs. The VPN hub routing preference makes the hub choose site-to-site VPN routes over ExpressRoute routes for the same prefix.
    fr: |
      Un hub qui héberge le Pare-feu Azure exige un espace d'adressage d'au moins /22, sans chevauchement avec les spokes ni avec les plages locales : 10.250.0.0/22. La capacité par défaut de 2 unités d'infrastructure de routage prend en charge 2 000 machines virtuelles et chaque unité supplémentaire en ajoute 1 000 : 4 unités prennent en charge 4 000 machines virtuelles. La préférence de routage VPN fait choisir au hub les routes VPN de site à site plutôt que les routes ExpressRoute pour un même préfixe.
  options:
    s24:
      en: |
        /24 is the minimum for a hub without Azure Firewall.
      fr: |
        /24 est le minimum pour un hub sans Pare-feu Azure.
    s22overlap:
      en: |
        10.200.0.0/22 overlaps with the on-premises range 10.200.0.0/16.
      fr: |
        10.200.0.0/22 chevauche la plage locale 10.200.0.0/16.
    aspath:
      en: |
        AS Path prefers the shortest AS path whatever the source, and chooses ExpressRoute when local routes are equal.
      fr: |
        AS Path préfère le chemin d'AS le plus court quelle que soit la source, et choisit ExpressRoute quand les routes locales sont équivalentes.
references:
  - title: About virtual hub settings
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/hub-settings
  - title: Virtual hub routing preference
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/about-virtual-hub-routing-preference
