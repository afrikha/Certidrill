id: az700-2c-vwan-vpn-scale-units
objective: "2.4.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has a Standard virtual WAN with a virtual hub named **Hub1**. You plan to deploy the following gateways in Hub1:

    - A site-to-site VPN gateway for 60 stores. Each store sends up to 50 Mbps at peak, and all stores can peak at the same time.
    - A User VPN (point-to-site) gateway for up to 8,000 concurrent remote users.

    You need to select the gateway scale units for each gateway. The solution must minimize costs.

    Which number of scale units should you select for each gateway? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un réseau étendu virtuel Standard avec un hub virtuel nommé **Hub1**. Vous prévoyez de déployer les passerelles suivantes dans Hub1 :

    - Une passerelle VPN de site à site pour 60 magasins. Chaque magasin envoie jusqu'à 50 Mbit/s en pointe, et tous les magasins peuvent être en pointe en même temps.
    - Une passerelle VPN utilisateur (point à site) pour 8 000 utilisateurs nomades simultanés au maximum.

    Vous devez choisir les unités d'échelle de chaque passerelle. La solution doit réduire les coûts au minimum.

    Quel nombre d'unités d'échelle devez-vous choisir pour chaque passerelle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Site-to-site VPN gateway: [[s2s]] scale units

      User VPN (point-to-site) gateway: [[p2s]] scale units
    fr: |
      Passerelle VPN de site à site : [[s2s]] unités d'échelle

      Passerelle VPN utilisateur (point à site) : [[p2s]] unités d'échelle
  slots:
    - id: s2s
      options:
        - { id: u3, text: "3" }
        - { id: u6, text: "6" }
        - { id: u10, text: "10" }
        - { id: u20, text: "20" }
    - id: p2s
      options:
        - { id: p1, text: "1" }
        - { id: p10, text: "10" }
        - { id: p20, text: "20" }
        - { id: p100, text: "100" }
answer:
  values: { s2s: u6, p2s: p20 }
explanation:
  correct:
    en: |
      The stores need 60 × 50 Mbps = 3 Gbps of aggregate throughput, and one site-to-site VPN scale unit equals 500 Mbps, so 6 units are enough. For User VPN, 7 to 10 scale units support 5,000 concurrent connections and 11 to 20 scale units support 10,000, so 8,000 users need at least 11 units: of the values offered, 20 is the smallest that is enough.
    fr: |
      Les magasins ont besoin de 60 × 50 Mbit/s = 3 Gbit/s de débit agrégé, et une unité d'échelle VPN de site à site vaut 500 Mbit/s : 6 unités suffisent. Pour le VPN utilisateur, 7 à 10 unités d'échelle prennent en charge 5 000 connexions simultanées et 11 à 20 unités 10 000 : 8 000 utilisateurs exigent au moins 11 unités, et parmi les valeurs proposées, 20 est la plus petite qui suffit.
  options:
    u3:
      en: |
        Three units provide 1.5 Gbps, half of the 3 Gbps required.
      fr: |
        Trois unités fournissent 1,5 Gbit/s, la moitié des 3 Gbit/s requis.
    p10:
      en: |
        Ten units support 5,000 concurrent connections only.
      fr: |
        Dix unités ne prennent en charge que 5 000 connexions simultanées.
    p100:
      en: |
        One hundred units support 50,000 connections, far more than needed.
      fr: |
        Cent unités prennent en charge 50 000 connexions, bien plus que nécessaire.
references:
  - title: Azure Virtual WAN FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-faq
  - title: About Virtual WAN gateway settings
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/gateway-settings
