id: az700-2c-vwan-route-selection
objective: "2.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Standard virtual WAN with a virtual hub named **Hub-WE**. The hub routing preference of Hub-WE is ExpressRoute. No static routes are configured. The Default route table of Hub-WE contains the following routes learned from the headquarters:

    | Prefix | Learned from | AS path |
    | --- | --- | --- |
    | 10.20.0.0/16 | ExpressRoute connection | 65020 |
    | 10.20.0.0/16 | Site-to-site VPN connection | 65020 |
    | 10.20.5.0/24 | Site-to-site VPN connection | 65020 |

    A virtual machine in a spoke virtual network connected to Hub-WE sends traffic to 10.20.5.10.

    Which path does the traffic use?
  fr: |
    Contoso dispose d'un réseau étendu virtuel Standard avec un hub virtuel nommé **Hub-WE**. La préférence de routage du hub de Hub-WE est ExpressRoute. Aucune route statique n'est configurée. La table de routage Default de Hub-WE contient les routes suivantes, apprises du siège :

    | Préfixe | Appris de | Chemin d'AS |
    | --- | --- | --- |
    | 10.20.0.0/16 | Connexion ExpressRoute | 65020 |
    | 10.20.0.0/16 | Connexion VPN de site à site | 65020 |
    | 10.20.5.0/24 | Connexion VPN de site à site | 65020 |

    Une machine virtuelle d'un réseau virtuel spoke connecté à Hub-WE envoie du trafic vers 10.20.5.10.

    Quel chemin le trafic emprunte-t-il ?
body:
  options:
    - { id: a, text: { en: "The ExpressRoute connection, because the hub routing preference is ExpressRoute", fr: "La connexion ExpressRoute, car la préférence de routage du hub est ExpressRoute" } }
    - { id: b, text: { en: "The site-to-site VPN connection, because its route has the longest prefix", fr: "La connexion VPN de site à site, car sa route a le préfixe le plus long" } }
    - { id: c, text: { en: "Both connections, because the AS paths have the same length", fr: "Les deux connexions, car les chemins d'AS ont la même longueur" } }
    - { id: d, text: { en: "Neither connection, because the hub drops prefixes learned from two sources", fr: "Aucune connexion, car le hub rejette les préfixes appris de deux sources" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The virtual hub first selects the routes with the longest prefix match, then prefers static routes over BGP routes, and only then applies the hub routing preference. 10.20.5.10 matches 10.20.5.0/24, which only the VPN connection advertises, so the VPN path is used. Traffic to other addresses in 10.20.0.0/16 uses ExpressRoute because of the routing preference.
    fr: |
      Le hub virtuel sélectionne d'abord les routes ayant la correspondance de préfixe la plus longue, préfère ensuite les routes statiques aux routes BGP, et n'applique qu'ensuite la préférence de routage du hub. 10.20.5.10 correspond à 10.20.5.0/24, que seule la connexion VPN publie : le chemin VPN est utilisé. Le trafic vers les autres adresses de 10.20.0.0/16 emprunte ExpressRoute en raison de la préférence de routage.
  options:
    a:
      en: |
        The routing preference only breaks ties between routes with the same prefix length; the longest prefix match is evaluated first.
      fr: |
        La préférence de routage ne départage que des routes de même longueur de préfixe ; la correspondance de préfixe la plus longue est évaluée en premier.
    c:
      en: |
        Only the VPN connection advertises the /24, and AS path length is evaluated after the longest prefix match.
      fr: |
        Seule la connexion VPN publie le /24, et la longueur du chemin d'AS est évaluée après la correspondance de préfixe la plus longue.
    d:
      en: |
        Learning the same prefix from ExpressRoute and VPN is normal; the hub selects the best route and keeps the other as an alternative.
      fr: |
        Apprendre le même préfixe par ExpressRoute et par VPN est normal ; le hub sélectionne la meilleure route et conserve l'autre en secours.
references:
  - title: Virtual hub routing preference
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/about-virtual-hub-routing-preference
