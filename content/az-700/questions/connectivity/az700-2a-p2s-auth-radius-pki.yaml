id: az700-2a-p2s-auth-radius-pki
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has an enterprise PKI based on Active Directory Certificate Services. Every corporate laptop has a certificate issued by this PKI, and Network Policy Server (NPS) servers already validate these certificates for the Wi-Fi network. The NPS servers are deployed in a virtual network named **VNet-Core**.

    You are configuring point-to-site VPN on a route-based VPN gateway (VpnGw2AZ) in VNet-Core. Users must authenticate with their existing certificates. The security team doesn't want to upload root certificates or maintain a list of revoked certificates in Azure.

    Which authentication type should you configure?
  fr: |
    Litware dispose d'une PKI d'entreprise basée sur les services de certificats Active Directory. Chaque ordinateur portable de l'entreprise possède un certificat émis par cette PKI, et des serveurs NPS (Network Policy Server) valident déjà ces certificats pour le réseau Wi-Fi. Les serveurs NPS sont déployés dans un réseau virtuel nommé **VNet-Core**.

    Vous configurez le VPN de point à site sur une passerelle VPN basée sur des itinéraires (VpnGw2AZ) dans VNet-Core. Les utilisateurs doivent s'authentifier avec leurs certificats existants. L'équipe de sécurité ne veut ni charger de certificats racines ni tenir une liste de certificats révoqués dans Azure.

    Quel type d'authentification devez-vous configurer ?
body:
  options:
    - { id: a, text: "Azure certificate" }
    - { id: b, text: "RADIUS" }
    - { id: c, text: "Microsoft Entra ID" }
    - { id: d, text: { en: "Azure certificate and Microsoft Entra ID", fr: "Azure certificate et Microsoft Entra ID" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With RADIUS authentication, the VPN gateway forwards the authentication requests to the RADIUS server, which validates the certificates against the existing enterprise PKI. Root certificates and revoked certificates don't need to be uploaded to Azure. RADIUS is supported on every SKU except Basic.
    fr: |
      Avec l'authentification RADIUS, la passerelle VPN transmet les demandes d'authentification au serveur RADIUS, qui valide les certificats auprès de la PKI d'entreprise existante. Il n'est pas nécessaire de charger dans Azure les certificats racines ni les certificats révoqués. RADIUS est pris en charge sur toutes les références sauf Basic.
  options:
    a: { en: "With Azure certificate authentication, the gateway validates the certificates itself, which requires uploading the root certificate and managing revoked certificates on the gateway.", fr: "Avec l'authentification par certificat Azure, la passerelle valide elle-même les certificats, ce qui exige de charger le certificat racine et de gérer les certificats révoqués sur la passerelle." }
    c: { en: "Microsoft Entra ID authentication uses Entra credentials in the Azure VPN Client, not the existing device certificates.", fr: "L'authentification Microsoft Entra ID utilise des informations d'identification Entra dans Azure VPN Client, pas les certificats existants des appareils." }
    d: { en: "The certificate part still requires uploading the root certificate to Azure.", fr: "La partie certificat exige toujours de charger le certificat racine dans Azure." }
references:
  - title: About Point-to-Site VPN
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about
  - title: VPN Gateway FAQ
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-vpn-faq
