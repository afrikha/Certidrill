id: az700-2b-er-peering-match
objective: "2.3.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an ExpressRoute circuit with the Premium add-on. Contoso is authorized to use Microsoft 365 services over ExpressRoute and owns public IP prefixes registered in a routing registry.

    Several on-premises workloads must use the circuit.

    Which peering should each workload use? To answer, drag the appropriate peerings to the correct workloads. Each peering may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un circuit ExpressRoute avec le module Premium. Contoso est autorisée à utiliser les services Microsoft 365 par ExpressRoute et possède des préfixes d'adresses IP publiques enregistrés dans un registre de routage.

    Plusieurs charges de travail locales doivent utiliser le circuit.

    Quel peering chaque charge de travail doit-elle utiliser ? Pour répondre, faites glisser les peerings appropriés vers les charges de travail correspondantes. Chaque peering peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: private, text: { en: "Azure private peering", fr: "Peering privé Azure" } }
    - { id: microsoft, text: { en: "Microsoft peering", fr: "Peering Microsoft" } }
    - { id: globalreach, text: "ExpressRoute Global Reach" }
    - { id: public, text: { en: "Azure public peering", fr: "Peering public Azure" } }
  targets:
    - { id: t1, text: { en: "Reach virtual machines in a virtual network by their private IP addresses", fr: "Joindre des machines virtuelles d'un réseau virtuel par leurs adresses IP privées" } }
    - { id: t2, text: { en: "Reach Exchange Online", fr: "Joindre Exchange Online" } }
    - { id: t3, text: { en: "Reach the public endpoint of an Azure Storage account from NAT public addresses", fr: "Joindre le point de terminaison public d'un compte Stockage Azure depuis des adresses publiques NAT" } }
    - { id: t4, text: { en: "Reach an Azure SQL database through a private endpoint in a virtual network", fr: "Joindre une base de données Azure SQL par un point de terminaison privé dans un réseau virtuel" } }
answer:
  mapping: { t1: private, t2: microsoft, t3: microsoft, t4: private }
explanation:
  correct:
    en: Azure private peering extends the core network into virtual networks, so it reaches virtual machines and private endpoints by private IP address. Microsoft peering exchanges public routes and gives access to Microsoft 365 and to the public endpoints of Azure PaaS services, with on-premises traffic translated to public addresses.
    fr: "Le peering privé Azure prolonge le réseau principal dans les réseaux virtuels : il atteint les machines virtuelles et les points de terminaison privés par leurs adresses IP privées. Le peering Microsoft échange des routes publiques et donne accès à Microsoft 365 et aux points de terminaison publics des services PaaS Azure, avec un trafic local traduit en adresses publiques."
  options:
    globalreach: { en: "Global Reach links two circuits to connect on-premises sites; it isn't a peering that reaches Azure services.", fr: "Global Reach relie deux circuits pour connecter des sites locaux ; ce n'est pas un peering qui atteint les services Azure." }
    public: { en: "Azure public peering is deprecated and can't be created on new circuits; Azure public endpoints are reached through Microsoft peering.", fr: "Le peering public Azure est déprécié et ne peut pas être créé sur les nouveaux circuits ; les points de terminaison publics Azure s'atteignent par le peering Microsoft." }
references:
  - title: "Azure ExpressRoute: circuits and peering"
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-circuit-peerings
