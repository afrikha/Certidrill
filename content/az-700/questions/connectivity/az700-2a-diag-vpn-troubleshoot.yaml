id: az700-2a-diag-vpn-troubleshoot
objective: "2.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a route-based VPN gateway named **GW-Prod** with a site-to-site connection named **Prod-to-Branch3**. The connection status shows **Not connected** since the branch firewall was replaced.

    You need to run a diagnosis that reports whether the cause is a preshared key mismatch, an unreachable peer or an IKE policy mismatch, and that saves the detailed logs to a storage account.

    What should you use?
  fr: |
    Fabrikam dispose d'une passerelle VPN basée sur des itinéraires nommée **GW-Prod** avec une connexion de site à site nommée **Prod-to-Branch3**. L'état de la connexion indique **Not connected** depuis le remplacement du pare-feu de la succursale.

    Vous devez lancer un diagnostic qui indique si la cause est une clé prépartagée incohérente, un homologue injoignable ou une stratégie IKE incompatible, et qui enregistre les journaux détaillés dans un compte de stockage.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Network Watcher IP flow verify", fr: "La vérification des flux IP de Network Watcher" } }
    - { id: b, text: { en: "Network Watcher next hop", fr: "Le tronçon suivant de Network Watcher" } }
    - { id: c, text: { en: "Network Watcher VPN troubleshoot", fr: "La résolution des problèmes VPN de Network Watcher" } }
    - { id: d, text: { en: "Network Watcher connection monitor", fr: "Le moniteur de connexion de Network Watcher" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      VPN troubleshoot diagnoses a virtual network gateway or a connection and returns fault types such as Authentication (preshared key mismatch), PeerReachability and IkePolicyMismatch. Its log files, such as ConnectionStats.txt and IKElogs.txt, are written to a storage account. It supports route-based VPN gateways and IPsec or VNet-to-VNet connections.
    fr: |
      La résolution des problèmes VPN diagnostique une passerelle de réseau virtuel ou une connexion et renvoie des types d'erreur comme Authentication (clé prépartagée incohérente), PeerReachability et IkePolicyMismatch. Ses fichiers journaux, comme ConnectionStats.txt et IKElogs.txt, sont écrits dans un compte de stockage. Elle prend en charge les passerelles VPN basées sur des itinéraires et les connexions IPsec ou de réseau virtuel à réseau virtuel.
  options:
    a: { en: "IP flow verify checks whether NSG rules allow a packet to or from a VM; it doesn't analyze IKE negotiation.", fr: "La vérification des flux IP contrôle si les règles NSG autorisent un paquet vers ou depuis une machine virtuelle ; elle n'analyse pas la négociation IKE." }
    b: { en: "Next hop shows the route chosen for a VM's traffic, not why a tunnel fails.", fr: "Le tronçon suivant montre la route choisie pour le trafic d'une machine virtuelle, pas la raison de l'échec d'un tunnel." }
    d: { en: "Connection monitor measures reachability and latency over time; it doesn't identify a preshared key mismatch.", fr: "Le moniteur de connexion mesure l'accessibilité et la latence dans le temps ; il n'identifie pas une clé prépartagée incohérente." }
references:
  - title: VPN troubleshoot overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vpn-troubleshoot-overview
