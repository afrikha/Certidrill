id: az700-2b-er-private-order
objective: "2.3.6"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has a virtual network named **VNet1** that already contains an ExpressRoute gateway named **ERGW1**. Tailspin plans to connect its datacenter to VNet1 through a new ExpressRoute circuit bought from a Layer 2 connectivity provider. The circuit and VNet1 will be in the same subscription.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin dispose d'un réseau virtuel nommé **VNet1** qui contient déjà une passerelle ExpressRoute nommée **ERGW1**. Tailspin prévoit de connecter son centre de données à VNet1 par un nouveau circuit ExpressRoute acheté auprès d'un fournisseur de connectivité de couche 2. Le circuit et VNet1 seront dans le même abonnement.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: create, text: { en: "Create the ExpressRoute circuit and note its service key.", fr: "Créer le circuit ExpressRoute et noter sa clé de service." } }
    - { id: key, text: { en: "Send the service key to the connectivity provider.", fr: "Envoyer la clé de service au fournisseur de connectivité." } }
    - { id: wait, text: { en: "Verify that the provider status of the circuit is Provisioned.", fr: "Vérifier que l'état du fournisseur du circuit est Provisioned." } }
    - { id: peering, text: { en: "Configure Azure private peering on the circuit.", fr: "Configurer le peering privé Azure sur le circuit." } }
    - { id: connection, text: { en: "Create a connection between ERGW1 and the circuit.", fr: "Créer une connexion entre ERGW1 et le circuit." } }
    - { id: routefilter, text: { en: "Create a route filter and attach it to the circuit.", fr: "Créer un filtre de routage et l'attacher au circuit." } }
    - { id: auth, text: { en: "Create an authorization on the circuit and redeem its key on ERGW1.", fr: "Créer une autorisation sur le circuit et utiliser sa clé sur ERGW1." } }
answer:
  sequence: [ create, key, wait, peering, connection ]
explanation:
  correct:
    en: Creating the circuit returns the service key, which the provider needs to provision its side. Peerings can be configured only once the circuit is provisioned and enabled, and with a Layer 2 provider you configure them yourself. A virtual network can be linked only after private peering is configured, by creating the connection between the gateway and the circuit.
    fr: "La création du circuit renvoie la clé de service, dont le fournisseur a besoin pour approvisionner son côté. Les peerings ne peuvent être configurés qu'une fois le circuit approvisionné et activé, et avec un fournisseur de couche 2 vous les configurez vous-même. Un réseau virtuel ne peut être lié qu'une fois le peering privé configuré, en créant la connexion entre la passerelle et le circuit."
  options:
    routefilter: { en: "Route filters apply to Microsoft peering, not to private peering.", fr: "Les filtres de routage s'appliquent au peering Microsoft, pas au peering privé." }
    auth: { en: "Authorizations are needed only when the gateway and the circuit are in different subscriptions.", fr: "Les autorisations ne sont nécessaires que si la passerelle et le circuit sont dans des abonnements différents." }
references:
  - title: "Quickstart: Create and modify an ExpressRoute circuit using Azure PowerShell"
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-circuit-arm
  - title: Configure peering for ExpressRoute circuit - Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-routing-arm
