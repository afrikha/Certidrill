id: az700-2a-vng-active-active-ips
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys is creating a VPN gateway named **GW-Retail** (VpnGw2AZ, route-based) in active-active mode. GW-Retail will be used only for site-to-site connections. Point-to-site won't be configured.

    How many public IP addresses must you assign to GW-Retail?
  fr: |
    Wingtip Toys crée une passerelle VPN nommée **GW-Retail** (VpnGw2AZ, basée sur des itinéraires) en mode actif/actif. GW-Retail servira uniquement aux connexions de site à site. Le point à site ne sera pas configuré.

    Combien d'adresses IP publiques devez-vous affecter à GW-Retail ?
body:
  options:
    - { id: a, text: { en: "One Standard SKU static public IP address", fr: "Une adresse IP publique statique de référence Standard" } }
    - { id: b, text: { en: "Two Standard SKU static public IP addresses", fr: "Deux adresses IP publiques statiques de référence Standard" } }
    - { id: c, text: { en: "Three Standard SKU static public IP addresses", fr: "Trois adresses IP publiques statiques de référence Standard" } }
    - { id: d, text: { en: "Four Standard SKU static public IP addresses", fr: "Quatre adresses IP publiques statiques de référence Standard" } }
shuffle: false
answer: { optionId: b }
explanation:
  correct:
    en: |
      In active-active mode, each of the two gateway instances has its own public IP address, so the gateway needs two Standard SKU public IP addresses assigned as Static. A third public IP address is needed only when point-to-site is enabled on an active-active gateway.
    fr: |
      En mode actif/actif, chacune des deux instances de passerelle a sa propre adresse IP publique : la passerelle a besoin de deux adresses IP publiques de référence Standard affectées en Static. Une troisième adresse IP publique n'est nécessaire que si le point à site est activé sur une passerelle actif/actif.
  options:
    a: { en: "One public IP address is the active-standby configuration.", fr: "Une seule adresse IP publique correspond à la configuration actif/passif." }
    c: { en: "The third public IP address is required only for point-to-site.", fr: "La troisième adresse IP publique n'est exigée que pour le point à site." }
    d: { en: "An active-active gateway has two instances, one public IP address each.", fr: "Une passerelle actif/actif a deux instances, avec une adresse IP publique chacune." }
references:
  - title: About active-active mode VPN gateways
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-active-active-gateways
