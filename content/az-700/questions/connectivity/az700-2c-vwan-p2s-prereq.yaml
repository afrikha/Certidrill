id: az700-2c-vwan-p2s-prereq
objective: "2.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has a Standard virtual WAN named **VWAN1** with a virtual hub named **Hub1**. Hub1 contains a site-to-site VPN gateway.

    You plan to add a User VPN (point-to-site) gateway to Hub1. Remote users must authenticate by using their Microsoft Entra ID accounts.

    What should you create before you add the gateway to Hub1?
  fr: |
    Litware dispose d'un réseau étendu virtuel Standard nommé **VWAN1** avec un hub virtuel nommé **Hub1**. Hub1 contient une passerelle VPN de site à site.

    Vous prévoyez d'ajouter à Hub1 une passerelle VPN utilisateur (point à site). Les utilisateurs nomades doivent s'authentifier avec leur compte Microsoft Entra ID.

    Que devez-vous créer avant d'ajouter la passerelle à Hub1 ?
body:
  options:
    - { id: a, text: { en: "A User VPN configuration that uses the OpenVPN tunnel type and Microsoft Entra ID authentication", fr: "Une configuration VPN utilisateur qui utilise le type de tunnel OpenVPN et l'authentification Microsoft Entra ID" } }
    - { id: b, text: { en: "A VPN site in VWAN1 that contains one link per group of remote users", fr: "Un site VPN dans VWAN1 qui contient une liaison par groupe d'utilisateurs nomades" } }
    - { id: c, text: { en: "A local network gateway that contains the client address pool of the remote users", fr: "Une passerelle de réseau local qui contient le pool d'adresses des clients nomades" } }
    - { id: d, text: { en: "A User VPN configuration that uses the IKEv2 tunnel type and Microsoft Entra ID authentication", fr: "Une configuration VPN utilisateur qui utilise le type de tunnel IKEv2 et l'authentification Microsoft Entra ID" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A User VPN gateway in a virtual hub references a User VPN configuration created at the virtual WAN level, which defines the tunnel type and the authentication method. Microsoft Entra ID authentication is supported only with OpenVPN.
    fr: |
      Une passerelle VPN utilisateur d'un hub virtuel référence une configuration VPN utilisateur créée au niveau du réseau étendu virtuel, qui définit le type de tunnel et la méthode d'authentification. L'authentification Microsoft Entra ID n'est prise en charge qu'avec OpenVPN.
  options:
    d:
      en: |
        Microsoft Entra ID authentication requires the OpenVPN tunnel type; it isn't supported with IKEv2 alone.
      fr: |
        L'authentification Microsoft Entra ID exige le type de tunnel OpenVPN ; elle n'est pas prise en charge avec IKEv2 seul.
    b:
      en: |
        A VPN site represents an on-premises VPN device for site-to-site connections, not remote users.
      fr: |
        Un site VPN représente un périphérique VPN local pour les connexions de site à site, pas des utilisateurs nomades.
    c:
      en: |
        Local network gateways belong to VPN Gateway, not to Virtual WAN; the client address pool is set on the User VPN gateway itself.
      fr: |
        Les passerelles de réseau local appartiennent à la passerelle VPN classique, pas à Virtual WAN ; le pool d'adresses des clients se définit sur la passerelle VPN utilisateur elle-même.
references:
  - title: "Tutorial: Create a P2S User VPN connection using Azure Virtual WAN - Certificate or RADIUS authentication"
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-point-to-site-portal
