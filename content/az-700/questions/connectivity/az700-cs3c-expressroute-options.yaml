id: az700-cs3c-expressroute-options
objective: "2.3.4"
type: dragdrop
caseStudy: az700-cs3c-munsons
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend an ExpressRoute capability for each ExpressRoute requirement.

    What should you recommend? To answer, drag the appropriate capabilities to the correct requirements. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une fonctionnalité ExpressRoute pour chaque exigence ExpressRoute.

    Que devez-vous recommander ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: reach, text: ExpressRoute Global Reach }
    - { id: premium, text: { en: "ExpressRoute Premium add-on", fr: "Module complémentaire ExpressRoute Premium" } }
    - { id: fastpath, text: ExpressRoute FastPath }
    - { id: direct, text: ExpressRoute Direct }
    - { id: bfd, text: { en: "Bidirectional Forwarding Detection (BFD)", fr: "Détection de transfert bidirectionnel (BFD)" } }
    - { id: local, text: { en: "ExpressRoute Local SKU", fr: "Référence SKU ExpressRoute Local" } }
  targets:
    - { id: r3, text: { en: "Requirement 3: Singapore plant circuit", fr: "Exigence 3 : circuit de l'usine de Singapour" } }
    - { id: r4, text: { en: "Requirement 4: Amsterdam to Singapore plant traffic", fr: "Exigence 4 : trafic entre Amsterdam et l'usine de Singapour" } }
    - { id: r5, text: { en: "Requirement 5: Southeast Asia virtual network linked to ER-AMS", fr: "Exigence 5 : réseau virtuel de Southeast Asia lié à ER-AMS" } }
answer:
  mapping: { r3: direct, r4: reach, r5: premium }
explanation:
  correct:
    en: |
      ExpressRoute Direct provides a dedicated pair of 10-Gbps, 100-Gbps or 400-Gbps ports that connect directly into the Microsoft global network at a peering location. Global Reach links two ExpressRoute circuits so that the on-premises sites behind them exchange traffic over the Microsoft network; because Amsterdam and Singapore are in different geopolitical regions, both circuits need Premium. A Standard circuit only reaches the regions of its own geopolitical region, so linking a Southeast Asia virtual network to ER-AMS requires the Premium add-on.
    fr: |
      ExpressRoute Direct fournit une paire dédiée de ports de 10, 100 ou 400 Gbit/s qui se connectent directement au réseau mondial de Microsoft à un emplacement de peering. Global Reach relie deux circuits ExpressRoute afin que les sites locaux situés derrière eux échangent du trafic par le réseau de Microsoft ; comme Amsterdam et Singapour sont dans des zones géopolitiques différentes, les deux circuits ont besoin de Premium. Un circuit Standard n'atteint que les régions de sa propre zone géopolitique : lier un réseau virtuel de Southeast Asia à ER-AMS exige donc le module complémentaire Premium.
  options:
    fastpath: { en: "FastPath bypasses the ExpressRoute gateway in the data path to the VMs; it doesn't connect sites or add regions.", fr: "FastPath contourne la passerelle ExpressRoute dans le chemin des données vers les machines virtuelles ; il ne relie pas de sites et n'ajoute pas de régions." }
    bfd: { en: "BFD speeds up the detection of a failed link; it doesn't change which networks are reachable.", fr: "BFD accélère la détection d'une liaison défaillante ; il ne change pas les réseaux accessibles." }
    local: { en: "A Local circuit reaches only the Azure regions near its peering location and doesn't support Global Reach.", fr: "Un circuit Local n'atteint que les régions Azure proches de son emplacement de peering et ne prend pas en charge Global Reach." }
references:
  - title: About ExpressRoute Global Reach
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-global-reach
  - title: About ExpressRoute Direct
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-erdirect-about
