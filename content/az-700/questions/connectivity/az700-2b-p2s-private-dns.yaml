id: az700-2b-p2s-private-dns
objective: "2.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has a virtual network named **VNet1** that uses the default Azure-provided DNS. VNet1 contains:

    - a VPN gateway named **VPNGW1** that accepts point-to-site connections over OpenVPN with Microsoft Entra ID authentication;
    - a private endpoint for a storage account named **stwoodgrove**;
    - a link to the private DNS zone **privatelink.blob.core.windows.net**, which contains the A record of the private endpoint.

    Virtual machines in VNet1 resolve `stwoodgrove.blob.core.windows.net` to the private IP address of the private endpoint. Point-to-site users resolve the same name to a public IP address, and their traffic to the storage account doesn't go through the VPN.

    You need to ensure that point-to-site users resolve the storage account to its private IP address.

    What should you include in the solution?
  fr: |
    Woodgrove dispose d'un réseau virtuel nommé **VNet1** qui utilise le DNS fourni par Azure par défaut. VNet1 contient :

    - une passerelle VPN nommée **VPNGW1** qui accepte les connexions de point à site en OpenVPN avec l'authentification Microsoft Entra ID ;
    - un point de terminaison privé pour un compte de stockage nommé **stwoodgrove** ;
    - une liaison vers la zone DNS privée **privatelink.blob.core.windows.net**, qui contient l'enregistrement A du point de terminaison privé.

    Les machines virtuelles de VNet1 résolvent `stwoodgrove.blob.core.windows.net` en l'adresse IP privée du point de terminaison privé. Les utilisateurs de point à site résolvent le même nom en une adresse IP publique, et leur trafic vers le compte de stockage ne passe pas par le VPN.

    Vous devez faire en sorte que les utilisateurs de point à site résolvent le compte de stockage en son adresse IP privée.

    Que devez-vous inclure dans la solution ?
body:
  options:
    - { id: a, text: { en: "Configure 168.63.129.16 as the DNS server of the VPN connection on the user devices.", fr: "Configurer 168.63.129.16 comme serveur DNS de la connexion VPN sur les appareils des utilisateurs." } }
    - { id: b, text: { en: "Deploy Azure DNS Private Resolver with an outbound endpoint and link a forwarding ruleset to VNet1.", fr: "Déployer Azure DNS Private Resolver avec un point de terminaison sortant et lier un ensemble de règles de transfert à VNet1." } }
    - { id: c, text: { en: "Deploy Azure DNS Private Resolver with an inbound endpoint and set that endpoint as the DNS server of VNet1.", fr: "Déployer Azure DNS Private Resolver avec un point de terminaison entrant et définir ce point de terminaison comme serveur DNS de VNet1." } }
    - { id: d, text: { en: "Link the private DNS zone to the point-to-site address pool of VPNGW1.", fr: "Lier la zone DNS privée au pool d'adresses de point à site de VPNGW1." } }
answer: { optionId: c }
explanation:
  correct:
    en: Only the Azure platform can query 168.63.129.16, so point-to-site clients can't use Azure-provided DNS to read the private DNS zone. An inbound endpoint of DNS Private Resolver gives a private IP address that resolves the zones linked to VNet1; set as the custom DNS server of VNet1, it is pushed by the gateway to the clients once they get the updated client configuration.
    fr: "Seule la plateforme Azure peut interroger 168.63.129.16 : les clients de point à site ne peuvent donc pas lire la zone DNS privée par le DNS fourni par Azure. Un point de terminaison entrant de DNS Private Resolver offre une adresse IP privée qui résout les zones liées à VNet1 ; défini comme serveur DNS personnalisé de VNet1, il est poussé par la passerelle vers les clients une fois qu'ils ont reçu la configuration client mise à jour."
  options:
    a: { en: "168.63.129.16 is reachable only from inside Azure, not from a client connected over point-to-site.", fr: "168.63.129.16 n'est joignable que depuis Azure, pas depuis un client connecté en point à site." }
    b: { en: "An outbound endpoint forwards queries from Azure to other DNS servers; it doesn't accept queries from clients.", fr: "Un point de terminaison sortant transfère les requêtes d'Azure vers d'autres serveurs DNS ; il n'accepte pas les requêtes des clients." }
    d: { en: "A private DNS zone can be linked only to virtual networks, not to an address pool.", fr: "Une zone DNS privée ne peut être liée qu'à des réseaux virtuels, pas à un pool d'adresses." }
references:
  - title: Troubleshoot Azure point-to-site connection problems - Azure VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-troubleshoot-vpn-point-to-site-connection-problems
