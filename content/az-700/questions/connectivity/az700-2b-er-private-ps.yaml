id: az700-2b-er-private-ps
objective: "2.3.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware has a provisioned ExpressRoute circuit named **CKT1** in a resource group named **RG1**. The virtual networks linked to the circuit use addresses in 10.0.0.0/8. The on-premises routers use AS 64610, and the network team reserves 172.31.10.0/29 for the peering links.

    You need to configure Azure private peering on CKT1 by using Azure PowerShell.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un circuit ExpressRoute approvisionné nommé **CKT1** dans un groupe de ressources nommé **RG1**. Les réseaux virtuels liés au circuit utilisent des adresses de 10.0.0.0/8. Les routeurs locaux utilisent l'AS 64610, et l'équipe réseau réserve 172.31.10.0/29 aux liaisons de peering.

    Vous devez configurer le peering privé Azure sur CKT1 avec Azure PowerShell.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $ckt = Get-AzExpressRouteCircuit -Name "CKT1" -ResourceGroupName "RG1"
    Add-AzExpressRouteCircuitPeeringConfig -Name "AzurePrivatePeering" -ExpressRouteCircuit $ckt `
      -PeeringType [[type]] -PeerASN 64610 `
      -PrimaryPeerAddressPrefix "172.31.10.0/30" -SecondaryPeerAddressPrefix [[secondary]] `
      -VlanId 210
    [[save]] -ExpressRouteCircuit $ckt
  slots:
    - id: type
      options:
        - { id: private, text: AzurePrivatePeering }
        - { id: microsoft, text: MicrosoftPeering }
        - { id: public, text: AzurePublicPeering }
    - id: secondary
      options:
        - { id: next, text: "\"172.31.10.4/30\"" }
        - { id: same, text: "\"172.31.10.0/30\"" }
        - { id: outside, text: "\"172.31.10.8/30\"" }
        - { id: vnet, text: "\"10.255.0.0/30\"" }
    - id: save
      options:
        - { id: setcircuit, text: Set-AzExpressRouteCircuit }
        - { id: setpeering, text: Set-AzExpressRouteCircuitPeeringConfig }
        - { id: newconn, text: New-AzVirtualNetworkGatewayConnection }
answer:
  values: { type: private, secondary: next, save: setcircuit }
explanation:
  correct:
    en: The peering type for virtual networks is `AzurePrivatePeering`. The reserved /29 is split into two /30 subnets, 172.31.10.0/30 for the primary link and 172.31.10.4/30 for the secondary link, and neither may overlap the address space of the virtual networks. `Add-AzExpressRouteCircuitPeeringConfig` only changes the local circuit object; `Set-AzExpressRouteCircuit` saves it.
    fr: "Le type de peering pour les réseaux virtuels est `AzurePrivatePeering`. Le /29 réservé se découpe en deux sous-réseaux /30, 172.31.10.0/30 pour la liaison principale et 172.31.10.4/30 pour la liaison secondaire, et aucun ne doit chevaucher l'espace d'adressage des réseaux virtuels. `Add-AzExpressRouteCircuitPeeringConfig` ne modifie que l'objet circuit local ; `Set-AzExpressRouteCircuit` l'enregistre."
  options:
    microsoft: { en: "Microsoft peering reaches Microsoft public endpoints and needs public addresses, not the virtual networks.", fr: "Le peering Microsoft atteint les points de terminaison publics de Microsoft et exige des adresses publiques ; il n'atteint pas les réseaux virtuels." }
    same: { en: "The primary and secondary links need two different /30 subnets.", fr: "Les liaisons principale et secondaire ont besoin de deux sous-réseaux /30 différents." }
    outside: { en: "172.31.10.8/30 is outside the reserved 172.31.10.0/29.", fr: "172.31.10.8/30 est en dehors du 172.31.10.0/29 réservé." }
    vnet: { en: "10.255.0.0/30 is inside 10.0.0.0/8, the address space of the virtual networks.", fr: "10.255.0.0/30 fait partie de 10.0.0.0/8, l'espace d'adressage des réseaux virtuels." }
    setpeering: { en: "Set-AzExpressRouteCircuitPeeringConfig modifies an existing peering in the local object; it doesn't save the circuit.", fr: "Set-AzExpressRouteCircuitPeeringConfig modifie un peering existant dans l'objet local ; il n'enregistre pas le circuit." }
references:
  - title: Configure peering for ExpressRoute circuit - Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-routing-arm
