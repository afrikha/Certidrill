id: az700-2c-er-diag-results
objective: "2.3.13"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an ExpressRoute circuit named **ER-Adatum** with Azure private peering. The primary link uses the subnet 192.168.20.0/30 and the secondary link uses 192.168.20.4/30. The on-premises network contains the subnets 10.40.0.0/16 and 10.50.0.0/16.

    Virtual machines in a linked virtual network can reach 10.40.0.0/16 but not 10.50.0.0/16. You collect the results shown in the following table.

    Answer each prompt by selecting the result that identifies the problem.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un circuit ExpressRoute nommé **ER-Adatum** avec le peering privé Azure. La liaison principale utilise le sous-réseau 192.168.20.0/30 et la liaison secondaire 192.168.20.4/30. Le réseau local contient les sous-réseaux 10.40.0.0/16 et 10.50.0.0/16.

    Les machines virtuelles d'un réseau virtuel lié peuvent joindre 10.40.0.0/16, mais pas 10.50.0.0/16. Vous collectez les résultats présentés dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le résultat qui identifie le problème.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "A layer 2 problem to investigate with the connectivity provider", fr: "Un problème de couche 2 à examiner avec le fournisseur de connectivité" }
    - id: p2
      text: { en: "The reason why 10.50.0.0/16 is unreachable from the virtual network", fr: "La raison pour laquelle 10.50.0.0/16 est injoignable depuis le réseau virtuel" }
  grid:
    header: [{ en: "Check", fr: "Vérification" }, { en: "Result", fr: "Résultat" }]
    rows:
      - [{ text: { en: "Circuit", fr: "Circuit" } }, { text: "CircuitProvisioningState: Enabled; ServiceProviderProvisioningState: Provisioned", area: r1 }]
      - [{ text: { en: "Peering configuration", fr: "Configuration du peering" } }, { text: "ProvisioningState: Succeeded; VlanId: 200; PeerASN: 65010", area: r2 }]
      - [{ text: { en: "ARP table, Primary", fr: "Table ARP, Primary" } }, { text: { en: "On-premises 192.168.20.1 with a MAC address; Microsoft 192.168.20.2 with a MAC address", fr: "On-premises 192.168.20.1 avec une adresse MAC ; Microsoft 192.168.20.2 avec une adresse MAC" }, area: r3 }]
      - [{ text: { en: "ARP table, Secondary", fr: "Table ARP, Secondary" } }, { text: { en: "Microsoft 192.168.20.6 with a MAC address; no other entry", fr: "Microsoft 192.168.20.6 avec une adresse MAC ; aucune autre entrée" }, area: r4 }]
      - [{ text: { en: "Route table, Primary", fr: "Table de routage, Primary" } }, { text: { en: "Neighbor 192.168.20.1 Established; network 10.40.0.0/16 only", fr: "Voisin 192.168.20.1 Established ; réseau 10.40.0.0/16 uniquement" }, area: r5 }]
      - [{ text: { en: "Statistics", fr: "Statistiques" } }, { text: { en: "PrimaryBytesIn increasing", fr: "PrimaryBytesIn en augmentation" }, area: r6 }]
answer:
  values: { p1: r4, p2: r5 }
explanation:
  correct:
    en: |
      An ARP table that contains only the Microsoft entry (no on-premises MAC address) shows a layer 2 problem on that path, typically a VLAN issue to investigate with the provider; here the secondary link is down. The primary BGP session is established but the MSEE receives only 10.40.0.0/16, so 10.50.0.0/16 isn't advertised by the on-premises routers or is filtered by an outbound policy.
    fr: |
      Une table ARP qui ne contient que l'entrée Microsoft (pas d'adresse MAC côté local) révèle un problème de couche 2 sur ce chemin, généralement un problème de VLAN à examiner avec le fournisseur ; ici, la liaison secondaire est hors service. La session BGP principale est établie, mais le MSEE ne reçoit que 10.40.0.0/16 : 10.50.0.0/16 n'est donc pas publié par les routeurs locaux ou est filtré par une stratégie sortante.
references:
  - title: Verify Azure ExpressRoute connectivity
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-troubleshooting-expressroute-overview
