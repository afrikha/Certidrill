id: az700-2a-pb-selector-pairs
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys connects a virtual network named **VNet-ERP** to a branch office through a route-based VPN gateway. The connection has a custom IPsec/IKE policy and **UsePolicyBasedTrafficSelectors** set to `$True`.

    | Network | Address prefixes |
    | --- | --- |
    | VNet-ERP | 192.168.0.0/16, 172.16.0.0/16 |
    | Branch office (local network gateway) | 10.1.0.0/16, 10.2.0.0/16 |

    You need to configure the traffic selectors on the branch office's policy-based VPN device.

    How many traffic selector pairs must you define on the device?
  fr: |
    Tailspin Toys relie un réseau virtuel nommé **VNet-ERP** à une succursale par une passerelle VPN basée sur des itinéraires. La connexion possède une stratégie IPsec/IKE personnalisée et **UsePolicyBasedTrafficSelectors** défini sur `$True`.

    | Réseau | Préfixes d'adresse |
    | --- | --- |
    | VNet-ERP | 192.168.0.0/16, 172.16.0.0/16 |
    | Succursale (passerelle de réseau local) | 10.1.0.0/16, 10.2.0.0/16 |

    Vous devez configurer les sélecteurs de trafic sur le périphérique VPN basé sur des stratégies de la succursale.

    Combien de paires de sélecteurs de trafic devez-vous définir sur le périphérique ?
body:
  options:
    - { id: a, text: { en: "1 (any-to-any)", fr: "1 (« any-to-any »)" } }
    - { id: b, text: "2" }
    - { id: c, text: "4" }
    - { id: d, text: "8" }
shuffle: false
answer: { optionId: c }
explanation:
  correct:
    en: |
      With policy-based traffic selectors, the device must define every combination of the local network gateway prefixes with the virtual network prefixes, instead of any-to-any: 10.1.0.0/16 and 10.2.0.0/16 each paired with 192.168.0.0/16 and with 172.16.0.0/16, which gives 2 × 2 = 4 pairs.
    fr: |
      Avec des sélecteurs de trafic basés sur des stratégies, le périphérique doit définir toutes les combinaisons des préfixes de la passerelle de réseau local avec ceux du réseau virtuel, au lieu de « any-to-any » : 10.1.0.0/16 et 10.2.0.0/16, chacun associé à 192.168.0.0/16 et à 172.16.0.0/16, soit 2 × 2 = 4 paires.
  options:
    a: { en: "Any-to-any is the behavior of route-based selectors, not of a policy-based device.", fr: "« Any-to-any » est le comportement des sélecteurs basés sur des itinéraires, pas celui d'un périphérique basé sur des stratégies." }
    b: { en: "Two pairs would leave out half of the prefix combinations.", fr: "Deux paires laisseraient de côté la moitié des combinaisons de préfixes." }
    d: { en: "A pair covers both directions; there is no separate pair per direction.", fr: "Une paire couvre les deux sens ; il n'y a pas de paire distincte par sens." }
references:
  - title: "Configure custom IPsec/IKE connection policies for S2S VPN and VNet-to-VNet: Azure portal"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/ipsec-ike-policy-howto
  - title: Connect a VPN gateway to multiple on-premises policy-based VPN devices
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-connect-multiple-policybased-rm-ps
