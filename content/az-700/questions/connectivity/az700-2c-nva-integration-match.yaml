id: az700-2c-nva-integration-match
objective: "2.4.7"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Standard virtual WAN with a virtual hub named **Hub1**. Contoso has three projects that use third-party network virtual appliances (NVAs):

    - **Project1**: 300 branch offices must connect through SD-WAN tunnels that terminate in Hub1 on a supported partner SD-WAN appliance that is managed jointly by Microsoft and the vendor.
    - **Project2**: a firewall NVA in a spoke virtual network connected to Hub1 must advertise the prefixes of the virtual networks behind it, and the hub must learn new prefixes without any manual route update.
    - **Project3**: a Check Point CloudGuard NVA deployed in Hub1 must inspect all internet-bound traffic from the spoke virtual networks and the branches.

    Which configuration should you use for each project? To answer, drag the appropriate configurations to the correct projects. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un réseau étendu virtuel Standard avec un hub virtuel nommé **Hub1**. Contoso mène trois projets qui utilisent des appliances virtuelles réseau (NVA) tierces :

    - **Project1** : 300 succursales doivent se connecter par des tunnels SD-WAN qui aboutissent dans Hub1 sur une appliance SD-WAN d'un partenaire pris en charge, gérée conjointement par Microsoft et le fabricant.
    - **Project2** : une NVA de pare-feu dans un réseau virtuel spoke connecté à Hub1 doit publier les préfixes des réseaux virtuels situés derrière elle, et le hub doit apprendre les nouveaux préfixes sans aucune mise à jour manuelle des routes.
    - **Project3** : une NVA Check Point CloudGuard déployée dans Hub1 doit inspecter tout le trafic à destination d'Internet issu des réseaux virtuels spoke et des branches.

    Quelle configuration devez-vous utiliser pour chaque projet ? Pour répondre, faites glisser les configurations appropriées vers les projets correspondants. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: managed, text: { en: "Deploy the partner NVA in Hub1 as a managed application", fr: "Déployer la NVA du partenaire dans Hub1 en tant qu'application managée" } }
    - { id: bgp, text: { en: "Configure BGP peering between the NVA and the virtual hub router", fr: "Configurer un peering BGP entre la NVA et le routeur du hub virtuel" } }
    - { id: static, text: { en: "Add static routes to the Default route table with the spoke connection as next hop", fr: "Ajouter à la table de routage Default des routes statiques avec la connexion du spoke comme tronçon suivant" } }
    - { id: intent, text: { en: "Configure an internet traffic routing policy with the NVA as next hop", fr: "Configurer une stratégie de routage du trafic Internet avec la NVA comme tronçon suivant" } }
  targets:
    - { id: t1, text: Project1 }
    - { id: t2, text: Project2 }
    - { id: t3, text: Project3 }
answer:
  mapping: { t1: managed, t2: bgp, t3: intent }
explanation:
  correct:
    en: |
      Partner SD-WAN NVAs are deployed directly in the hub as managed applications and peer with the hub router like Microsoft gateways. An NVA in a directly connected spoke can peer over BGP with the hub router, so new prefixes are learned dynamically. An internet traffic routing policy (routing intent) sends internet-bound traffic from all the virtual network and branch connections to a supported security NVA in the hub, such as Check Point. Static routes work for Project2 only with manual updates whenever prefixes change.
    fr: |
      Les NVA SD-WAN des partenaires sont déployées directement dans le hub en tant qu'applications managées et établissent un peering avec le routeur du hub comme les passerelles Microsoft. Une NVA d'un spoke directement connecté peut établir un peering BGP avec le routeur du hub : les nouveaux préfixes sont appris dynamiquement. Une stratégie de routage du trafic Internet (intention de routage) envoie le trafic Internet de toutes les connexions de réseau virtuel et de branche vers une NVA de sécurité prise en charge dans le hub, comme Check Point. Les routes statiques ne conviendraient à Project2 qu'avec des mises à jour manuelles à chaque changement de préfixe.
references:
  - title: About NVAs in a Virtual WAN hub
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/about-nva-hub
  - title: "Scenario: BGP peering with a virtual hub"
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/scenario-bgp-peering-hub
