id: az700-sr1-vwan-remote-users-1
objective: "2.4.1"
type: series_yesno
series: az700-sr1-vwan-remote-users
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: |
    You keep the Basic type, add a point-to-site gateway to Hub1 and connect the spokes.
  fr: |
    Vous conservez le type Basic, ajoutez une passerelle de point à site à Hub1 et connectez les spokes.
body:
  solution:
    en: |
      You keep VWAN1 as a **Basic** virtual WAN. You create a user VPN configuration that uses the **OpenVPN** tunnel type and Microsoft Entra authentication, and you add a point-to-site gateway that uses this configuration to Hub1. You connect Spoke1, Spoke2 and Spoke3 to Hub1.
    fr: |
      Vous conservez VWAN1 comme virtual WAN **Basic**. Vous créez une configuration VPN utilisateur qui utilise le type de tunnel **OpenVPN** et l'authentification Microsoft Entra, et vous ajoutez à Hub1 une passerelle de point à site qui utilise cette configuration. Vous connectez Spoke1, Spoke2 et Spoke3 à Hub1.
answer: { value: false }
explanation:
  correct:
    en: |
      A Basic virtual WAN contains only Basic hubs, and a Basic hub supports site-to-site VPN only. User VPN (point-to-site) and transit between virtual networks through the hub are Standard features, so the solution can't be deployed while VWAN1 stays Basic.
    fr: |
      Un virtual WAN Basic ne contient que des hubs Basic, et un hub Basic ne prend en charge que le VPN de site à site. Le VPN utilisateur (point à site) et le transit entre réseaux virtuels par le hub sont des fonctionnalités Standard : la solution ne peut pas être déployée tant que VWAN1 reste Basic.
references:
  - title: What is Azure Virtual WAN?
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-about
