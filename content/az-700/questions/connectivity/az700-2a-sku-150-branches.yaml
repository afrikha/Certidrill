id: az700-2a-sku-150-branches
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has 150 retail stores. Each store has one VPN device that must connect to Azure over a site-to-site VPN. All stores must reach workloads in a virtual network named **VNet-Core**.

    You need to recommend a connectivity solution that supports all the stores.

    What should you recommend?
  fr: |
    Wingtip Toys possède 150 magasins. Chaque magasin dispose d'un périphérique VPN qui doit se connecter à Azure par un VPN de site à site. Tous les magasins doivent joindre les charges de travail d'un réseau virtuel nommé **VNet-Core**.

    Vous devez recommander une solution de connectivité qui prend en charge tous les magasins.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A VPN gateway that uses the VpnGw5AZ SKU in VNet-Core", fr: "Une passerelle VPN de référence SKU VpnGw5AZ dans VNet-Core" } }
    - { id: b, text: { en: "Two VPN gateways that use the VpnGw4AZ SKU in VNet-Core", fr: "Deux passerelles VPN de référence SKU VpnGw4AZ dans VNet-Core" } }
    - { id: c, text: { en: "An ExpressRoute gateway that uses the ErGw3AZ SKU in VNet-Core", fr: "Une passerelle ExpressRoute de référence SKU ErGw3AZ dans VNet-Core" } }
    - { id: d, text: { en: "Azure Virtual WAN with a site-to-site VPN gateway in a virtual hub", fr: "Azure Virtual WAN avec une passerelle VPN de site à site dans un hub virtuel" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The largest VPN Gateway SKUs (VpnGw4AZ and VpnGw5AZ) support at most 100 site-to-site tunnels. Microsoft recommends Virtual WAN when you need more than 100 site-to-site VPN tunnels; VNet-Core is then connected to the virtual hub.
    fr: |
      Les plus grandes références SKU de VPN Gateway (VpnGw4AZ et VpnGw5AZ) prennent en charge 100 tunnels de site à site au maximum. Microsoft recommande Virtual WAN au-delà de 100 tunnels VPN de site à site ; VNet-Core est alors connecté au hub virtuel.
  options:
    a: { en: "VpnGw5AZ is limited to 100 site-to-site tunnels.", fr: "VpnGw5AZ est limitée à 100 tunnels de site à site." }
    b: { en: "A virtual network can have only one VPN gateway (plus one ExpressRoute gateway).", fr: "Un réseau virtuel ne peut avoir qu'une passerelle VPN (plus une passerelle ExpressRoute)." }
    c: { en: "An ExpressRoute gateway terminates ExpressRoute circuits, not IPsec site-to-site VPN tunnels.", fr: "Une passerelle ExpressRoute termine des circuits ExpressRoute, pas des tunnels VPN IPsec de site à site." }
references:
  - title: About gateway SKUs
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-gateway-skus
  - title: What is Azure Virtual WAN?
    url: https://learn.microsoft.com/en-us/azure/virtual-wan/virtual-wan-about
