id: az700-2a-ipsec-ps-policy
objective: "2.1.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank must apply the following cryptographic policy to a site-to-site connection named **Hub-to-Trading**:

    | Phase | Requirement |
    | --- | --- |
    | IKE (Main Mode, Phase 1) | AES256, SHA384, Diffie-Hellman group 24 |
    | IPsec (Quick Mode, Phase 2) | GCMAES256 encryption, perfect forward secrecy with Diffie-Hellman group 14 (2048-bit MODP) |

    How should you complete the PowerShell command that creates the policy? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank doit appliquer la stratégie de chiffrement suivante à une connexion de site à site nommée **Hub-to-Trading** :

    | Phase | Exigence |
    | --- | --- |
    | IKE (mode principal, phase 1) | AES256, SHA384, groupe Diffie-Hellman 24 |
    | IPsec (mode rapide, phase 2) | Chiffrement GCMAES256, confidentialité persistante parfaite (PFS) avec le groupe Diffie-Hellman 14 (MODP 2048 bits) |

    Comment devez-vous compléter la commande PowerShell qui crée la stratégie ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $policy = New-AzIpsecPolicy -IkeEncryption AES256 -IkeIntegrity SHA384 `
      -DhGroup [[dh]] `
      -IpsecEncryption GCMAES256 -IpsecIntegrity [[integ]] `
      -PfsGroup [[pfs]] `
      -SALifeTimeSeconds 14400 -SADataSizeKilobytes 102400000
  slots:
    - id: dh
      options:
        - { id: dh24, text: DHGroup24 }
        - { id: pfs24, text: PFS24 }
        - { id: ecp384, text: ECP384 }
        - { id: dh14, text: DHGroup14 }
    - id: integ
      options:
        - { id: sha256, text: SHA256 }
        - { id: gcm256, text: GCMAES256 }
        - { id: gcm128, text: GCMAES128 }
        - { id: sha1, text: SHA1 }
    - id: pfs
      options:
        - { id: pfs2048, text: PFS2048 }
        - { id: dhg14, text: DHGroup14 }
        - { id: pfsg24, text: PFS24 }
        - { id: none, text: None }
answer:
  values: { dh: dh24, integ: gcm256, pfs: pfs2048 }
explanation:
  correct:
    en: |
      Phase 1 uses `-DhGroup`, whose value for group 24 is `DHGroup24`. When IPsec encryption is a GCMAES algorithm, IPsec integrity must use the same GCMAES algorithm and key length, so `GCMAES256`. Perfect forward secrecy uses `-PfsGroup`, whose value for the 2048-bit MODP group 14 is `PFS2048`.
    fr: |
      La phase 1 utilise `-DhGroup`, dont la valeur pour le groupe 24 est `DHGroup24`. Quand le chiffrement IPsec est un algorithme GCMAES, l'intégrité IPsec doit utiliser le même algorithme GCMAES avec la même longueur de clé, donc `GCMAES256`. La PFS utilise `-PfsGroup`, dont la valeur pour le groupe 14 MODP 2048 bits est `PFS2048`.
  options:
    pfs24: { en: "PFS24 is a value of -PfsGroup (Phase 2), not of -DhGroup.", fr: "PFS24 est une valeur de -PfsGroup (phase 2), pas de -DhGroup." }
    dh14: { en: "DHGroup14 is group 14; the requirement is group 24 for Phase 1.", fr: "DHGroup14 correspond au groupe 14 ; l'exigence est le groupe 24 en phase 1." }
    sha256: { en: "With GCMAES encryption, the integrity value must be the same GCMAES algorithm.", fr: "Avec un chiffrement GCMAES, l'intégrité doit utiliser le même algorithme GCMAES." }
    gcm128: { en: "The GCMAES key length must match the encryption: GCMAES256.", fr: "La longueur de clé GCMAES doit correspondre au chiffrement : GCMAES256." }
    dhg14: { en: "DHGroup14 is a -DhGroup value; -PfsGroup expects PFS2048 for group 14.", fr: "DHGroup14 est une valeur de -DhGroup ; -PfsGroup attend PFS2048 pour le groupe 14." }
    pfsg24: { en: "PFS24 is group 24; the requirement is group 14 for Phase 2.", fr: "PFS24 correspond au groupe 24 ; l'exigence est le groupe 14 en phase 2." }
references:
  - title: "Configure custom IPsec/IKE connection policies for S2S VPN and VNet-to-VNet: PowerShell"
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-ipsecikepolicy-rm-powershell
  - title: New-AzIpsecPolicy
    url: https://learn.microsoft.com/en-us/powershell/module/az.network/new-azipsecpolicy
