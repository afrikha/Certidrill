id: az700-2b-entra-group-access
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has two route-based VPN gateways that accept point-to-site connections:

    | Gateway | Virtual network | Tunnel type | Authentication | Audience |
    | --- | --- | --- | --- | --- |
    | VPNGW-HQ | VNet-HQ | OpenVPN (SSL) | Microsoft Entra ID | c632b3df-fb67-4d84-bdcf-b95ad541b5c8 |
    | VPNGW-RD | VNet-RD | OpenVPN (SSL) | Microsoft Entra ID | c632b3df-fb67-4d84-bdcf-b95ad541b5c8 |

    All employees currently can connect through both gateways.

    You need to ensure that only the members of a group named **RD-Engineers** can connect through VPNGW-RD. All employees must still be able to connect through VPNGW-HQ.

    What should you do?
  fr: |
    Contoso dispose de deux passerelles VPN basées sur des routes qui acceptent les connexions de point à site :

    | Passerelle | Réseau virtuel | Type de tunnel | Authentification | Audience |
    | --- | --- | --- | --- | --- |
    | VPNGW-HQ | VNet-HQ | OpenVPN (SSL) | Microsoft Entra ID | c632b3df-fb67-4d84-bdcf-b95ad541b5c8 |
    | VPNGW-RD | VNet-RD | OpenVPN (SSL) | Microsoft Entra ID | c632b3df-fb67-4d84-bdcf-b95ad541b5c8 |

    Actuellement, tous les employés peuvent se connecter par les deux passerelles.

    Vous devez faire en sorte que seuls les membres d'un groupe nommé **RD-Engineers** puissent se connecter par VPNGW-RD. Tous les employés doivent toujours pouvoir se connecter par VPNGW-HQ.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a Conditional Access policy that targets the Azure VPN application and includes only RD-Engineers.", fr: "Créer une stratégie d'accès conditionnel qui cible l'application Azure VPN et n'inclut que RD-Engineers." } }
    - { id: b, text: { en: "Add the object ID of RD-Engineers as a second Audience value on VPNGW-RD.", fr: "Ajouter l'ID d'objet de RD-Engineers comme seconde valeur Audience sur VPNGW-RD." } }
    - { id: c, text: { en: "Associate a network security group that allows only RD-Engineers with the GatewaySubnet of VNet-RD.", fr: "Associer au GatewaySubnet de VNet-RD un groupe de sécurité réseau qui n'autorise que RD-Engineers." } }
    - { id: d, text: { en: "Register a custom app assigned to RD-Engineers and use its app ID as the Audience of VPNGW-RD.", fr: "Inscrire une application personnalisée attribuée à RD-Engineers et utiliser son ID comme Audience de VPNGW-RD." } }
answer: { optionId: d }
explanation:
  correct:
    en: Access based on users and groups uses one custom app registration per gateway. You register the app, add the Azure VPN Client as an authorized client application, set Assignment required to Yes on its enterprise application, assign RD-Engineers, and set the app ID as the Audience of VPNGW-RD. VPNGW-HQ keeps the Microsoft-registered audience, so all employees can still use it.
    fr: "L'accès selon les utilisateurs et les groupes repose sur une inscription d'application personnalisée par passerelle. Vous inscrivez l'application, ajoutez Azure VPN Client comme application cliente autorisée, définissez Assignment required sur Yes dans son application d'entreprise, attribuez RD-Engineers et utilisez l'ID de l'application comme Audience de VPNGW-RD. VPNGW-HQ conserve l'audience inscrite par Microsoft : tous les employés peuvent toujours l'utiliser."
  options:
    a: { en: "Both gateways use the same Azure VPN application, so the policy would also block the other employees on VPNGW-HQ.", fr: "Les deux passerelles utilisent la même application Azure VPN : la stratégie bloquerait aussi les autres employés sur VPNGW-HQ." }
    b: { en: "A gateway supports only one Audience value, and the audience is an application ID, not a group.", fr: "Une passerelle ne prend en charge qu'une valeur Audience, et l'audience est un ID d'application, pas un groupe." }
    c: { en: "An NSG filters IP traffic by address and port; it knows nothing about Microsoft Entra group membership.", fr: "Un NSG filtre le trafic IP par adresse et par port ; il ignore l'appartenance aux groupes Microsoft Entra." }
references:
  - title: Configure P2S access based on users and groups - Microsoft Entra ID authentication - Azure VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-entra-users-access
  - title: Create custom app ID for P2S VPN Microsoft Entra ID authentication - Azure VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-entra-register-custom-app
