id: az700-cs2a-gateway-sku
objective: "2.1.2"
type: single
caseStudy: az700-cs2a-alpine-ski-house
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    You need to resize VGW-Hub to support the resorts planned for 2028. The solution must meet the requirements for VGW-Hub.

    To which SKU should you resize VGW-Hub?
  fr: |
    Vous devez redimensionner VGW-Hub pour prendre en charge les stations prévues pour 2028. La solution doit respecter les exigences relatives à VGW-Hub.

    Vers quelle référence SKU devez-vous redimensionner VGW-Hub ?
body:
  options:
    - { id: a, text: "VpnGw1AZ" }
    - { id: b, text: "VpnGw2AZ" }
    - { id: c, text: "VpnGw3AZ" }
    - { id: d, text: "VpnGw4AZ" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      VpnGw1AZ, VpnGw2AZ and VpnGw3AZ support at most 30 site-to-site tunnels, which is fewer than the 42 planned connections. VpnGw4AZ (Generation2) supports up to 100 tunnels and 5 Gbps, and it is the least expensive zone-redundant SKU that meets the requirement.
    fr: |
      VpnGw1AZ, VpnGw2AZ et VpnGw3AZ prennent en charge au plus 30 tunnels de site à site, soit moins que les 42 connexions prévues. VpnGw4AZ (Generation2) prend en charge jusqu'à 100 tunnels et 5 Gbit/s ; c'est la référence SKU redondante interzone la moins chère qui répond à l'exigence.
  options:
    a: { en: "VpnGw1AZ is limited to 30 tunnels and 650 Mbps.", fr: "VpnGw1AZ est limitée à 30 tunnels et 650 Mbit/s." }
    b: { en: "The current SKU supports at most 30 tunnels.", fr: "La référence SKU actuelle prend en charge au plus 30 tunnels." }
    c: { en: "VpnGw3AZ (Generation2) has enough throughput, 2.5 Gbps, but it is limited to 30 tunnels.", fr: "VpnGw3AZ (Generation2) offre un débit suffisant, 2,5 Gbit/s, mais elle est limitée à 30 tunnels." }
references:
  - title: About gateway SKUs
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/about-gateway-skus
