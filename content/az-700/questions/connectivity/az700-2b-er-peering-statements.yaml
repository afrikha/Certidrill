id: az700-2b-er-peering-statements
objective: "2.3.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an ExpressRoute circuit named **CKT1** with the following configuration:

    | Setting | Value |
    | --- | --- |
    | Peering location | Paris |
    | SKU | Standard, MeteredData |
    | Bandwidth | 1 Gbps |
    | Azure private peering | Configured, linked to VNet1 in France Central |
    | Microsoft peering | Configured, advertised public prefix 203.0.113.0/27 |
    | Route filter on Microsoft peering | One rule that allows the regional BGP community of France Central |

    On-premises clients use addresses in 10.0.0.0/8.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un circuit ExpressRoute nommé **CKT1** dont la configuration est la suivante :

    | Paramètre | Valeur |
    | --- | --- |
    | Emplacement de peering | Paris |
    | Référence SKU | Standard, MeteredData |
    | Bande passante | 1 Gbit/s |
    | Peering privé Azure | Configuré, lié à VNet1 dans France Central |
    | Peering Microsoft | Configuré, préfixe public publié 203.0.113.0/27 |
    | Filtre de routage sur le peering Microsoft | Une règle qui autorise la communauté BGP régionale de France Central |

    Les clients locaux utilisent des adresses de 10.0.0.0/8.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: On-premises clients can reach storage accounts in France Central over Microsoft peering by using their 10.0.0.0/8 addresses without NAT.
        fr: Les clients locaux peuvent joindre des comptes de stockage de France Central par le peering Microsoft avec leurs adresses 10.0.0.0/8, sans NAT.
    - id: s2
      text:
        en: Traffic over Azure private peering and traffic over Microsoft peering share the 1 Gbps of CKT1.
        fr: Le trafic du peering privé Azure et celui du peering Microsoft se partagent le 1 Gbit/s de CKT1.
    - id: s3
      text:
        en: On-premises clients can reach storage accounts in West Europe over the Microsoft peering of CKT1.
        fr: Les clients locaux peuvent joindre des comptes de stockage de West Europe par le peering Microsoft de CKT1.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Microsoft peering accepts only public addresses, and RFC 1918 prefixes aren't accepted, so on-premises traffic must be translated to the advertised public prefix. Each circuit has a fixed bandwidth shared by its peerings. The route filter is an allowlist of BGP communities, so only the prefixes of the Azure services in France Central are advertised to Fabrikam; the West Europe prefixes aren't received over the circuit.
    fr: "Le peering Microsoft n'accepte que des adresses publiques, et les préfixes RFC 1918 n'y sont pas acceptés : le trafic local doit être traduit vers le préfixe public publié. Chaque circuit a une bande passante fixe partagée par ses peerings. Le filtre de routage est une liste d'autorisation de communautés BGP : seuls les préfixes des services Azure de France Central sont publiés vers Fabrikam ; les préfixes de West Europe ne sont pas reçus par le circuit."
references:
  - title: "Azure ExpressRoute: Routing requirements"
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-routing
  - title: Configure route filters for Microsoft peering
    url: https://learn.microsoft.com/en-us/azure/expressroute/how-to-routefilter-portal
