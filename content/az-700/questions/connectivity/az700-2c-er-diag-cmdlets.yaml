id: az700-2c-er-diag-cmdlets
objective: "2.3.13"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Users report that they can't reach a virtual network through an ExpressRoute circuit named **ER-Circuit1**. The circuit status is Enabled and the provider status is Provisioned. You plan to troubleshoot the Azure private peering by using Azure PowerShell.

    Which cmdlet should you use for each check? To answer, drag the appropriate cmdlets to the correct checks. Each cmdlet may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Des utilisateurs signalent qu'ils ne peuvent pas joindre un réseau virtuel par un circuit ExpressRoute nommé **ER-Circuit1**. L'état du circuit est Enabled et l'état du fournisseur est Provisioned. Vous prévoyez de dépanner le peering privé Azure avec Azure PowerShell.

    Quelle applet de commande devez-vous utiliser pour chaque vérification ? Pour répondre, faites glisser les applets de commande appropriées vers les vérifications correspondantes. Chaque applet de commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: peercfg, text: Get-AzExpressRouteCircuitPeeringConfig }
    - { id: arp, text: Get-AzExpressRouteCircuitARPTable }
    - { id: rt, text: Get-AzExpressRouteCircuitRouteTable }
    - { id: stats, text: Get-AzExpressRouteCircuitStats }
    - { id: auth, text: Get-AzExpressRouteCircuitAuthorization }
  targets:
    - id: t1
      text: { en: "Confirm that the VLAN ID, the peer ASN and the primary and secondary subnets match the edge routers", fr: "Vérifier que l'ID de VLAN, l'ASN homologue et les sous-réseaux principal et secondaire correspondent aux routeurs de périphérie" }
    - id: t2
      text: { en: "Confirm that the MSEE has learned the MAC address of the on-premises router interface", fr: "Vérifier que le MSEE a appris l'adresse MAC de l'interface du routeur local" }
    - id: t3
      text: { en: "Confirm that the expected on-premises prefixes are received over BGP", fr: "Vérifier que les préfixes locaux attendus sont reçus par BGP" }
    - id: t4
      text: { en: "Compare the bytes in and out on the primary and secondary paths", fr: "Comparer les octets entrants et sortants sur les chemins principal et secondaire" }
answer:
  mapping: { t1: peercfg, t2: arp, t3: rt, t4: stats }
explanation:
  correct:
    en: |
      Get-AzExpressRouteCircuitPeeringConfig shows the peering settings (subnets, VLAN ID, ASNs). Get-AzExpressRouteCircuitARPTable shows the layer 2 mapping of each interface IP to its MAC address. Get-AzExpressRouteCircuitRouteTable lists the BGP routes on the MSEE, per device path. Get-AzExpressRouteCircuitStats returns PrimaryBytesIn/Out and SecondaryBytesIn/Out. Get-AzExpressRouteCircuitAuthorization lists the authorizations used to link virtual networks from other subscriptions.
    fr: |
      Get-AzExpressRouteCircuitPeeringConfig affiche les paramètres du peering (sous-réseaux, ID de VLAN, ASN). Get-AzExpressRouteCircuitARPTable affiche la correspondance de couche 2 entre l'adresse IP de chaque interface et son adresse MAC. Get-AzExpressRouteCircuitRouteTable liste les routes BGP du MSEE, par chemin d'appareil. Get-AzExpressRouteCircuitStats renvoie PrimaryBytesIn/Out et SecondaryBytesIn/Out. Get-AzExpressRouteCircuitAuthorization liste les autorisations servant à lier des réseaux virtuels d'autres abonnements.
references:
  - title: Verify Azure ExpressRoute connectivity
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-troubleshooting-expressroute-overview
