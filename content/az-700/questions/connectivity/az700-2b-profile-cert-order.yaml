id: az700-2b-profile-cert-order
objective: "2.2.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind has deployed a route-based VPN gateway named **VPNGW1** (SKU VpnGw1AZ). No point-to-site configuration exists yet.

    You need to allow employees to connect from Windows 11 computers by using the native Windows VPN client and certificate authentication. Northwind has no enterprise certification authority.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind a déployé une passerelle VPN basée sur des routes nommée **VPNGW1** (référence SKU VpnGw1AZ). Aucune configuration de point à site n'existe encore.

    Vous devez permettre aux employés de se connecter depuis des ordinateurs Windows 11 avec le client VPN natif de Windows et l'authentification par certificat. Northwind ne dispose d'aucune autorité de certification d'entreprise.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: certs, text: { en: "Generate a self-signed root certificate and client certificates issued from it.", fr: "Générer un certificat racine auto-signé et des certificats clients émis à partir de celui-ci." } }
    - { id: config, text: { en: "On the **Point-to-site configuration** page, set the address pool, the IKEv2 tunnel type and Azure certificate authentication, paste the root certificate public key, and save.", fr: "Sur la page **Configuration de point à site**, définir le pool d'adresses, le type de tunnel IKEv2 et l'authentification par certificat Azure, coller la clé publique du certificat racine, puis enregistrer." } }
    - { id: download, text: { en: "Select **Download VPN client** to generate the profile package.", fr: "Sélectionner **Télécharger le client VPN** pour générer le package de profil." } }
    - { id: install, text: { en: "On each computer, install a client certificate with its private key and run VpnClientSetupAmd64.", fr: "Sur chaque ordinateur, installer un certificat client avec sa clé privée et exécuter VpnClientSetupAmd64." } }
    - { id: pfx, text: { en: "Upload each client certificate with its private key (.pfx) to VPNGW1.", fr: "Charger chaque certificat client avec sa clé privée (.pfx) sur VPNGW1." } }
    - { id: udr, text: { en: "Associate a route table with a 0.0.0.0/0 route with GatewaySubnet.", fr: "Associer à GatewaySubnet une table de routage contenant un itinéraire 0.0.0.0/0." } }
    - { id: radius, text: { en: "Register VPNGW1 as a RADIUS client on a Network Policy Server.", fr: "Inscrire VPNGW1 comme client RADIUS sur un serveur NPS." } }
answer:
  sequence: [ certs, config, download, install ]
explanation:
  correct:
    en: The gateway trusts clients through the public key of the root certificate, so the certificates come first, then the point-to-site configuration that holds the root key. The profile package reflects the saved configuration, so you download it afterwards, and finally each computer gets a client certificate and the client configuration.
    fr: "La passerelle fait confiance aux clients grâce à la clé publique du certificat racine : les certificats viennent d'abord, puis la configuration de point à site qui contient la clé racine. Le package de profil reflète la configuration enregistrée : vous le téléchargez ensuite, et chaque ordinateur reçoit enfin un certificat client et la configuration du client."
  options:
    pfx: { en: "Only the public key of the root certificate is uploaded; client private keys never leave the clients.", fr: "Seule la clé publique du certificat racine est chargée ; les clés privées des clients ne quittent jamais les clients." }
    udr: { en: "A default route on GatewaySubnet breaks point-to-site connections (error 0x80090326).", fr: "Un itinéraire par défaut sur GatewaySubnet empêche les connexions de point à site (erreur 0x80090326)." }
    radius: { en: "RADIUS is a different authentication type; certificate authentication is validated by the gateway itself.", fr: "RADIUS est un autre type d'authentification ; l'authentification par certificat est validée par la passerelle elle-même." }
references:
  - title: About Azure Point-to-Site VPN connections - Azure VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-about
  - title: Configure a VPN client for P2S certificate authentication connections - Azure VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/point-to-site-vpn-client-certificate-windows-native
