id: az700-2a-s2s-cli-connection
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has the following resources in a resource group named **RG-Net**:

    | Name | Type |
    | --- | --- |
    | VNet-Paris | Virtual network |
    | GW-Paris | Virtual network gateway (VPN, route-based) |
    | GW-Paris-pip1 | Public IP address used by GW-Paris |
    | Lyon-Site | Local network gateway (on-premises device 203.0.113.50, prefix 10.60.0.0/16) |

    You need to create a site-to-site VPN connection between VNet-Paris and the Lyon office by using the Azure CLI.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose des ressources suivantes dans un groupe de ressources nommé **RG-Net** :

    | Nom | Type |
    | --- | --- |
    | VNet-Paris | Réseau virtuel |
    | GW-Paris | Passerelle de réseau virtuel (VPN, basée sur des itinéraires) |
    | GW-Paris-pip1 | Adresse IP publique utilisée par GW-Paris |
    | Lyon-Site | Passerelle de réseau local (périphérique local 203.0.113.50, préfixe 10.60.0.0/16) |

    Vous devez créer une connexion VPN de site à site entre VNet-Paris et le bureau de Lyon avec Azure CLI.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network [[grp]] create \
      --name Paris-to-Lyon \
      --resource-group RG-Net \
      --vnet-gateway1 [[gw]] \
      --local-gateway2 [[lng]] \
      --shared-key 'Xk9#pL2v!Qe7'
  slots:
    - id: grp
      options:
        - { id: vpnconn, text: vpn-connection }
        - { id: vnetgw, text: vnet-gateway }
        - { id: localgw, text: local-gateway }
        - { id: vpngw, text: vpn-gateway }
    - id: gw
      options:
        - { id: gwparis, text: GW-Paris }
        - { id: vnetparis, text: VNet-Paris }
        - { id: pip, text: GW-Paris-pip1 }
        - { id: gwsub, text: GatewaySubnet }
    - id: lng
      options:
        - { id: lyon, text: Lyon-Site }
        - { id: lyonip, text: 203.0.113.50 }
        - { id: lyonpfx, text: 10.60.0.0/16 }
answer:
  values: { grp: vpnconn, gw: gwparis, lng: lyon }
explanation:
  correct:
    en: |
      A site-to-site connection is a connection resource created with `az network vpn-connection create`. It links the virtual network gateway (`--vnet-gateway1`, here GW-Paris) to the local network gateway that represents the on-premises device (`--local-gateway2`, here Lyon-Site). The device IP address and the on-premises prefixes are properties of the local network gateway, not of the connection.
    fr: |
      Une connexion de site à site est une ressource de connexion créée avec `az network vpn-connection create`. Elle relie la passerelle de réseau virtuel (`--vnet-gateway1`, ici GW-Paris) à la passerelle de réseau local qui représente le périphérique local (`--local-gateway2`, ici Lyon-Site). L'adresse IP du périphérique et les préfixes locaux sont des propriétés de la passerelle de réseau local, pas de la connexion.
  options:
    vnetgw: { en: "az network vnet-gateway create creates the virtual network gateway itself.", fr: "az network vnet-gateway create crée la passerelle de réseau virtuel elle-même." }
    localgw: { en: "az network local-gateway create creates the local network gateway, which already exists.", fr: "az network local-gateway create crée la passerelle de réseau local, qui existe déjà." }
    vpngw: { en: "az network vpn-gateway manages Virtual WAN VPN gateways, not VPN Gateway connections.", fr: "az network vpn-gateway gère les passerelles VPN de Virtual WAN, pas les connexions de VPN Gateway." }
    lyonip: { en: "The device IP address is stored in the local network gateway; the parameter expects the local network gateway.", fr: "L'adresse IP du périphérique est stockée dans la passerelle de réseau local ; le paramètre attend la passerelle de réseau local." }
references:
  - title: Create a site-to-site VPN connection - Azure CLI
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-howto-site-to-site-resource-manager-cli
