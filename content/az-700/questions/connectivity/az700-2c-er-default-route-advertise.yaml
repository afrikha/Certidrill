id: az700-2c-er-default-route-advertise
objective: "2.3.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an ExpressRoute circuit with Azure private peering and Microsoft peering. Five virtual networks are linked to the circuit. Security policy requires that internet-bound traffic from the virtual machines in these virtual networks be inspected by the on-premises firewalls.

    The network team plans to advertise a default route (0.0.0.0/0) from the on-premises edge routers.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un circuit ExpressRoute avec le peering privé Azure et le peering Microsoft. Cinq réseaux virtuels sont liés au circuit. La stratégie de sécurité exige que le trafic à destination d'Internet issu des machines virtuelles de ces réseaux virtuels soit inspecté par les pare-feu locaux.

    L'équipe réseau prévoit de publier une route par défaut (0.0.0.0/0) depuis les routeurs de périphérie locaux.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The default route can be advertised over Microsoft peering so that private peering carries only the virtual network traffic.", fr: "La route par défaut peut être publiée sur le peering Microsoft afin que le peering privé ne transporte que le trafic des réseaux virtuels." } }
    - { id: b, text: { en: "Virtual machines might fail to activate their Windows licenses unless user-defined routes send the activation traffic directly to the internet.", fr: "Les machines virtuelles risquent de ne plus activer leur licence Windows si des itinéraires définis par l'utilisateur n'envoient pas le trafic d'activation directement vers Internet." } }
    - { id: c, text: { en: "Traffic from the virtual machines to Azure public endpoints keeps using the direct internet path from Azure.", fr: "Le trafic des machines virtuelles vers les points de terminaison publics Azure continue d'emprunter le chemin Internet direct depuis Azure." } }
    - { id: d, text: { en: "The default route must be advertised over Azure private peering.", fr: "La route par défaut doit être publiée sur le peering privé Azure." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      ExpressRoute accepts a default route only on private peering. Once it is advertised, the internet path from the linked virtual networks is replaced by the path to on-premises, which breaks Windows license activation and any direct internet access unless user-defined routes send those destinations to the internet.
    fr: |
      ExpressRoute n'accepte une route par défaut que sur le peering privé. Une fois publiée, le chemin Internet des réseaux virtuels liés est remplacé par le chemin vers le réseau local, ce qui casse l'activation des licences Windows et tout accès Internet direct, sauf si des itinéraires définis par l'utilisateur envoient ces destinations vers Internet.
  options:
    a: { en: "Default routes and RFC 1918 prefixes must be filtered out of Microsoft peering; a default route is accepted only on private peering.", fr: "Les routes par défaut et les préfixes RFC 1918 doivent être filtrés du peering Microsoft ; une route par défaut n'est acceptée que sur le peering privé." }
    c: { en: "The default route blocks the internet path from Azure for the linked virtual networks, including traffic to Azure public endpoints, unless you add user-defined routes.", fr: "La route par défaut bloque le chemin Internet depuis Azure pour les réseaux virtuels liés, y compris le trafic vers les points de terminaison publics Azure, sauf si vous ajoutez des itinéraires définis par l'utilisateur." }
references:
  - title: ExpressRoute routing requirements
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-routing
