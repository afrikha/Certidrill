id: az700-2b-er-sku-local
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans a new 10-Gbps ExpressRoute circuit at a peering location whose local Azure region is West Europe. The connectivity provider supports ExpressRoute Local at that location.

    All of Proseware's virtual networks are in West Europe, and they will stay there. Every month, about 500 TB of backup data will be copied from Azure virtual machines in West Europe to the on-premises datacenter over the circuit. Global Reach isn't required.

    You need to recommend a circuit SKU. The solution must minimize the monthly cost.

    What should you recommend?
  fr: |
    Proseware prévoit un nouveau circuit ExpressRoute de 10 Gbit/s dans un emplacement de peering dont la région Azure locale est West Europe. Le fournisseur de connectivité prend en charge ExpressRoute Local dans cet emplacement.

    Tous les réseaux virtuels de Proseware sont dans West Europe et y resteront. Chaque mois, environ 500 To de données de sauvegarde seront copiés depuis des machines virtuelles Azure de West Europe vers le centre de données local par le circuit. Global Reach n'est pas nécessaire.

    Vous devez recommander une référence SKU de circuit. La solution doit réduire au minimum le coût mensuel.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: "Standard, MeteredData" }
    - { id: b, text: "Local" }
    - { id: c, text: "Standard, UnlimitedData" }
    - { id: d, text: "Premium, UnlimitedData" }
answer: { optionId: b }
explanation:
  correct:
    en: An ExpressRoute Local circuit reaches only the one or two Azure regions near its peering location, which is enough here, and its price includes the outbound data transfer. With a large and steady volume of outbound data to the local region, Local is the cheapest option.
    fr: "Un circuit ExpressRoute Local n'atteint que la ou les deux régions Azure proches de son emplacement de peering, ce qui suffit ici, et son prix inclut le transfert de données sortant. Avec un volume de données sortantes élevé et régulier vers la région locale, Local est l'option la moins chère."
  options:
    a: { en: "With metered data, 500 TB of outbound transfer each month would be charged per GB.", fr: "Avec la facturation à l'usage, 500 To de transfert sortant par mois seraient facturés au Go." }
    c: { en: "Standard unlimited also includes outbound data, but it costs more than Local and its wider regional reach isn't needed.", fr: "Standard illimité inclut aussi les données sortantes, mais il coûte plus cher que Local et sa portée régionale plus large n'est pas utile." }
    d: { en: "Premium adds worldwide reach and higher limits that Proseware doesn't need, at a higher price.", fr: "Premium ajoute une portée mondiale et des limites plus élevées dont Proseware n'a pas besoin, pour un prix supérieur." }
references:
  - title: FAQ - Azure ExpressRoute
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-faqs
