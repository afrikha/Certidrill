id: az700-2b-p2s-error-798
objective: "2.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a VPN gateway named **VPNGW1** that accepts point-to-site connections with IKEv2 and certificate authentication. About 200 users connect successfully every day with the native Windows VPN client.

    A user named User1 receives a new Windows 11 computer and runs the VPN client installer on it. When User1 connects, the following error appears: "A certificate could not be found that can be used with this Extensible Authentication Protocol. (Error 798)".

    You need to ensure that User1 can connect. What should you do?
  fr: |
    Fabrikam dispose d'une passerelle VPN nommée **VPNGW1** qui accepte les connexions de point à site avec IKEv2 et l'authentification par certificat. Environ 200 utilisateurs s'y connectent chaque jour sans problème avec le client VPN natif de Windows.

    Un utilisateur nommé User1 reçoit un nouvel ordinateur Windows 11 et y exécute le programme d'installation du client VPN. Quand User1 se connecte, l'erreur suivante apparaît : « A certificate could not be found that can be used with this Extensible Authentication Protocol. (Error 798) ».

    Vous devez faire en sorte que User1 puisse se connecter. Que devez-vous faire ?
body:
  options:
    - { id: d, text: { en: "Install a client certificate with its private key in Current User\\Personal.", fr: "Installer un certificat client avec sa clé privée dans Current User\\Personal." } }
    - { id: a, text: { en: "Delete the root certificate from VPNGW1 and upload it again.", fr: "Supprimer le certificat racine de VPNGW1 et le charger de nouveau." } }
    - { id: b, text: { en: "Reset VPNGW1 to refresh its point-to-site configuration.", fr: "Réinitialiser VPNGW1 pour actualiser sa configuration de point à site." } }
    - { id: c, text: { en: "Change the tunnel type of VPNGW1 to OpenVPN (SSL).", fr: "Changer le type de tunnel de VPNGW1 en OpenVPN (SSL)." } }
answer: { optionId: d }
explanation:
  correct:
    en: Error 798 means that the VPN client can't find a client certificate in Current User\Personal\Certificates. The new computer has the client configuration but not the certificate, so you install a client certificate issued from the trusted root, exported with its private key.
    fr: "L'erreur 798 signifie que le client VPN ne trouve pas de certificat client dans Current User\\Personal\\Certificates. Le nouvel ordinateur a la configuration du client mais pas le certificat : vous installez un certificat client émis par la racine approuvée, exporté avec sa clé privée."
  options:
    a: { en: "The other users connect, so the root certificate on the gateway is valid; the missing piece is on User1's computer.", fr: "Les autres utilisateurs se connectent : le certificat racine de la passerelle est valide ; l'élément manquant est sur l'ordinateur de User1." }
    b: { en: "The gateway works for everyone else; a reset doesn't place a certificate on the client.", fr: "La passerelle fonctionne pour tous les autres ; une réinitialisation ne place pas de certificat sur le client." }
    c: { en: "Changing the tunnel type would break the other users' native IKEv2 clients and still requires a client certificate.", fr: "Changer le type de tunnel casserait les clients IKEv2 natifs des autres utilisateurs et exigerait toujours un certificat client." }
references:
  - title: Troubleshoot Azure point-to-site connection problems - Azure VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-troubleshoot-vpn-point-to-site-connection-problems
