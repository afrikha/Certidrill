id: az700-2b-profile-new-peering
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has a hub virtual network named **VNet-Hub** that contains a VPN gateway named **VPNGW1**. VPNGW1 accepts point-to-site connections that use IKEv2 and certificate authentication. Last month, users installed the VPN client profile package on their Windows 11 computers and use the native Windows VPN client.

    Yesterday, you peered a new virtual network named **VNet-App** with VNet-Hub. **Allow gateway transit** is enabled on the VNet-Hub side of the peering, and **Use remote gateways** is enabled on the VNet-App side. The network security groups allow the traffic.

    Point-to-site users can connect and reach the virtual machines in VNet-Hub, but they can't reach the virtual machines in VNet-App.

    What should you do?
  fr: |
    Tailspin dispose d'un réseau virtuel hub nommé **VNet-Hub** qui contient une passerelle VPN nommée **VPNGW1**. VPNGW1 accepte les connexions de point à site qui utilisent IKEv2 et l'authentification par certificat. Le mois dernier, les utilisateurs ont installé le package de profil du client VPN sur leurs ordinateurs Windows 11 et utilisent le client VPN natif de Windows.

    Hier, vous avez créé un peering entre un nouveau réseau virtuel nommé **VNet-App** et VNet-Hub. **Autoriser le transit par passerelle** est activé du côté VNet-Hub du peering, et **Utiliser des passerelles distantes** est activé du côté VNet-App. Les groupes de sécurité réseau autorisent le trafic.

    Les utilisateurs de point à site peuvent se connecter et joindre les machines virtuelles de VNet-Hub, mais pas celles de VNet-App.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the address space of VNet-App to the point-to-site address pool of VPNGW1.", fr: "Ajouter l'espace d'adressage de VNet-App au pool d'adresses de point à site de VPNGW1." } }
    - { id: b, text: { en: "Associate a route table with GatewaySubnet that routes VNet-App to the virtual network gateway.", fr: "Associer à GatewaySubnet une table de routage qui envoie VNet-App vers la passerelle de réseau virtuel." } }
    - { id: c, text: { en: "Download the VPN client profile package again and reinstall it on the computers.", fr: "Télécharger de nouveau le package de profil du client VPN et le réinstaller sur les ordinateurs." } }
    - { id: d, text: { en: "Enable Use remote gateways on the VNet-Hub side of the peering.", fr: "Activer Utiliser des passerelles distantes du côté VNet-Hub du peering." } }
answer: { optionId: c }
explanation:
  correct:
    en: The profile package is a snapshot of the gateway configuration, and the native Windows client gets its routes from it. After a virtual network peering is added, the clients don't have the route to VNet-App until you download the package again and reinstall it.
    fr: "Le package de profil est un instantané de la configuration de la passerelle, et le client Windows natif en tire ses routes. Après l'ajout d'un peering de réseaux virtuels, les clients n'ont pas la route vers VNet-App tant que vous n'avez pas téléchargé et réinstallé le package."
  options:
    a: { en: "The address pool provides client addresses and must not overlap the virtual networks; adding VNet-App's range would create an overlap.", fr: "Le pool d'adresses fournit les adresses des clients et ne doit pas chevaucher les réseaux virtuels ; y ajouter la plage de VNet-App créerait un chevauchement." }
    b: { en: "The gateway already knows the peered address space; the missing route is on the clients.", fr: "La passerelle connaît déjà l'espace d'adressage relié par peering ; la route manquante est côté clients." }
    d: { en: "Use remote gateways is set on the virtual network without a gateway (VNet-App), which is already the case.", fr: "Utiliser des passerelles distantes se définit sur le réseau virtuel sans passerelle (VNet-App), ce qui est déjà le cas." }
references:
  - title: Troubleshoot Azure point-to-site connection problems - Azure VPN Gateway
    url: https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-troubleshoot-vpn-point-to-site-connection-problems
