id: az700-4a-pls-delete
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso is retiring an application that was published through a Private Link service named **pls-legacy** on a Standard internal load balancer named **lb-legacy**. Three consumers still have approved private endpoint connections to pls-legacy.

    You need to delete pls-legacy. The load balancer must be kept for another application.

    What should you do first?
  fr: |
    Contoso retire une application publiée via un service Private Link nommé **pls-legacy** sur un équilibreur de charge interne Standard nommé **lb-legacy**. Trois consommateurs ont encore des connexions de point de terminaison privé approuvées vers pls-legacy.

    Vous devez supprimer pls-legacy. L'équilibreur de charge doit être conservé pour une autre application.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: b, text: { en: "Remove all the NAT IP configurations of pls-legacy.", fr: "Supprimer toutes les configurations IP NAT de pls-legacy." } }
    - { id: a, text: { en: "Reject all the private endpoint connections of pls-legacy.", fr: "Rejeter toutes les connexions de point de terminaison privé de pls-legacy." } }
    - { id: c, text: { en: "Remove the frontend IP configuration from lb-legacy.", fr: "Supprimer la configuration IP frontale de lb-legacy." } }
    - { id: d, text: { en: "Set the Private Link service network policies of the NAT subnet to Enabled.", fr: "Régler les stratégies réseau du service Private Link du sous-réseau NAT sur Enabled." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Before you delete a Private Link service, no private endpoint connections can be associated with it. Rejecting all the connections ends the consumers' access, and you can then delete the service while keeping the load balancer.
    fr: |
      Avant de supprimer un service Private Link, aucune connexion de point de terminaison privé ne doit lui être associée. Rejeter toutes les connexions met fin à l'accès des consommateurs ; vous pouvez ensuite supprimer le service tout en conservant l'équilibreur de charge.
  options:
    b: { en: "A Private Link service needs at least one NAT IP address; the last one can't be deleted.", fr: "Un service Private Link a besoin d'au moins une adresse IP NAT ; la dernière ne peut pas être supprimée." }
    c: { en: "The frontend is still used by the service, and changing the load balancer doesn't remove the consumers' connections.", fr: "La configuration frontale est encore utilisée par le service, et modifier l'équilibreur de charge ne supprime pas les connexions des consommateurs." }
    d: { en: "The subnet policy is a creation prerequisite; changing it doesn't clear the connections.", fr: "La stratégie du sous-réseau est un prérequis de création ; la modifier ne supprime pas les connexions." }
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
