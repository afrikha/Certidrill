id: az700-4b-sep-definition-scope
objective: "4.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a subscription named **Sub1** that contains the following resource groups:

    | Resource group | Storage accounts |
    | --- | --- |
    | RG-App | stnwappdata, stnwapplogs, stnwtemp |
    | RG-Shared | stnwshared1, stnwshared2, and accounts that will be added later |

    You are configuring a service endpoint policy for a subnet named **Subnet1**. Virtual machines in Subnet1 must be able to reach stnwappdata and every current and future storage account in RG-Shared. They must not be able to reach any other storage account.

    Which two resource IDs should you add to the policy definition? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un abonnement nommé **Sub1** qui contient les groupes de ressources suivants :

    | Groupe de ressources | Comptes de stockage |
    | --- | --- |
    | RG-App | stnwappdata, stnwapplogs, stnwtemp |
    | RG-Shared | stnwshared1, stnwshared2 et des comptes qui seront ajoutés plus tard |

    Vous configurez une stratégie de point de terminaison de service pour un sous-réseau nommé **Subnet1**. Les machines virtuelles de Subnet1 doivent pouvoir atteindre stnwappdata et tous les comptes de stockage actuels et futurs de RG-Shared. Elles ne doivent pouvoir atteindre aucun autre compte de stockage.

    Quels sont les deux ID de ressource que vous devez ajouter à la définition de stratégie ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "/subscriptions/<Sub1 ID>" }
    - { id: b, text: "/subscriptions/<Sub1 ID>/resourceGroups/RG-App" }
    - { id: c, text: "/subscriptions/<Sub1 ID>/resourceGroups/RG-Shared" }
    - { id: d, text: "/subscriptions/<Sub1 ID>/resourceGroups/RG-App/providers/Microsoft.Storage/storageAccounts/stnwappdata" }
    - { id: e, text: "/subscriptions/<Sub1 ID>/resourceGroups/RG-Shared/providers/Microsoft.Storage/storageAccounts/stnwshared1" }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      A policy definition accepts three scopes of resource IDs: a subscription, a resource group or a single storage account. The resource group ID of RG-Shared allows every account in that group, including accounts created later, and the account ID of stnwappdata allows only that account in RG-App. Everything else is denied because the policy is an allow list.
    fr: |
      Une définition de stratégie accepte trois étendues d'ID de ressource : un abonnement, un groupe de ressources ou un compte de stockage. L'ID du groupe de ressources RG-Shared autorise tous les comptes de ce groupe, y compris ceux créés plus tard, et l'ID de compte de stnwappdata n'autorise que ce compte dans RG-App. Tout le reste est refusé, car la stratégie est une liste d'autorisation.
  options:
    a: { en: "The subscription scope would also allow stnwapplogs and stnwtemp.", fr: "L'étendue de l'abonnement autoriserait aussi stnwapplogs et stnwtemp." }
    b: { en: "The RG-App scope would also allow stnwapplogs and stnwtemp.", fr: "L'étendue de RG-App autoriserait aussi stnwapplogs et stnwtemp." }
    e: { en: "A single account entry doesn't cover stnwshared2 or the accounts added later to RG-Shared.", fr: "Une entrée de compte unique ne couvre ni stnwshared2 ni les comptes ajoutés plus tard à RG-Shared." }
references:
  - title: Azure virtual network service endpoint policies
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoint-policies-overview
