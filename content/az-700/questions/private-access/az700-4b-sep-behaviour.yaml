id: az700-4b-sep-behaviour
objective: "4.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a virtual machine named **VM1** in a subnet named **Subnet1** of a virtual network in the West Europe region. The Microsoft.Storage service endpoint is enabled on Subnet1. The firewalls of all the storage accounts allow access from all networks.

    The following service endpoint policies are associated with Subnet1:

    | Policy | Listed storage account | Account region | Account redundancy |
    | --- | --- | --- | --- |
    | sep-main | stfabmain | West Europe | RA-GRS |
    | sep-logs | stfablogseus | East US | LRS |

    A storage account named **stfabother** in East US isn't listed in any policy.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une machine virtuelle nommée **VM1** dans un sous-réseau nommé **Subnet1** d'un réseau virtuel de la région West Europe. Le point de terminaison de service Microsoft.Storage est activé sur Subnet1. Les pare-feu de tous les comptes de stockage autorisent l'accès depuis tous les réseaux.

    Les stratégies de point de terminaison de service suivantes sont associées à Subnet1 :

    | Stratégie | Compte de stockage répertorié | Région du compte | Redondance du compte |
    | --- | --- | --- | --- |
    | sep-main | stfabmain | West Europe | RA-GRS |
    | sep-logs | stfablogseus | East US | LRS |

    Un compte de stockage nommé **stfabother**, situé en East US, ne figure dans aucune stratégie.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          VM1 can read data from the secondary endpoint of stfabmain.
        fr: |
          VM1 peut lire des données depuis le point de terminaison secondaire de stfabmain.
    - id: s2
      text:
        en: |
          VM1 can write data to stfablogseus.
        fr: |
          VM1 peut écrire des données dans stfablogseus.
    - id: s3
      text:
        en: |
          VM1 can write data to stfabother.
        fr: |
          VM1 peut écrire des données dans stfabother.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      When a primary account is listed, read access to its RA-GRS secondary is allowed automatically. Several policies on one subnet combine, so an account listed in any of them is allowed. Applying a policy makes the Storage service endpoint scope global, so all storage traffic from Subnet1, in every region, is filtered and stfabother is denied.
    fr: |
      Quand un compte principal est répertorié, l'accès en lecture à son secondaire RA-GRS est autorisé automatiquement. Plusieurs stratégies sur un même sous-réseau se combinent : un compte répertorié dans l'une d'elles est autorisé. L'application d'une stratégie rend globale l'étendue du point de terminaison de service Storage : tout le trafic de stockage de Subnet1, quelle que soit la région, est filtré, et stfabother est refusé.
references:
  - title: Azure virtual network service endpoint policies
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoint-policies-overview
