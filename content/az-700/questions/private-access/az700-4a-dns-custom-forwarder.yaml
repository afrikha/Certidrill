id: az700-4a-dns-custom-forwarder
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a hub virtual network named **VNet-Hub** and two spokes peered with it. A DNS server named **DNS1** (10.0.0.4) runs on a virtual machine in VNet-Hub and hosts the corp.northwind.com zone. All three virtual networks use DNS1 as their DNS server, and DNS1 forwards all other queries to an internet DNS provider.

    Private endpoints for storage accounts are in VNet-Hub. The **privatelink.blob.core.windows.net** zone holds their records through zone groups and is linked to VNet-Hub only. Clients in the spokes resolve the storage account names to public IP addresses.

    You need the clients to resolve the storage account names to the private endpoint IP addresses. DNS1 must remain the DNS server of all the virtual networks, and the records must keep being managed automatically.

    What should you do?
  fr: |
    Northwind dispose d'un réseau virtuel hub nommé **VNet-Hub** et de deux spokes reliés à lui par peering. Un serveur DNS nommé **DNS1** (10.0.0.4) s'exécute sur une machine virtuelle de VNet-Hub et héberge la zone corp.northwind.com. Les trois réseaux virtuels utilisent DNS1 comme serveur DNS, et DNS1 transfère toutes les autres requêtes à un fournisseur DNS Internet.

    Les points de terminaison privés des comptes de stockage se trouvent dans VNet-Hub. La zone **privatelink.blob.core.windows.net** contient leurs enregistrements via des groupes de zones et n'est liée qu'à VNet-Hub. Les clients des spokes résolvent les noms des comptes de stockage vers des adresses IP publiques.

    Vous devez faire en sorte que les clients résolvent les noms des comptes de stockage vers les adresses IP des points de terminaison privés. DNS1 doit rester le serveur DNS de tous les réseaux virtuels, et les enregistrements doivent continuer d'être gérés automatiquement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "On DNS1, create a conditional forwarder for blob.core.windows.net that points to 168.63.129.16.", fr: "Sur DNS1, créer un redirecteur conditionnel pour blob.core.windows.net qui pointe vers 168.63.129.16." } }
    - { id: b, text: { en: "Link the privatelink.blob.core.windows.net zone to both spoke virtual networks.", fr: "Lier la zone privatelink.blob.core.windows.net aux deux réseaux virtuels spoke." } }
    - { id: c, text: { en: "On DNS1, create a primary zone named privatelink.blob.core.windows.net with the endpoint records.", fr: "Sur DNS1, créer une zone principale nommée privatelink.blob.core.windows.net avec les enregistrements des points de terminaison." } }
    - { id: d, text: { en: "Enable autoregistration on the link between the zone and VNet-Hub.", fr: "Activer l'inscription automatique sur le lien entre la zone et VNet-Hub." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Clients query DNS1, so DNS1 must obtain the private answer. A DNS forwarder in a virtual network linked to the private zone forwards the queries to Azure-provided DNS at 168.63.129.16, which answers from the linked zone. Forwarding the public zone name (blob.core.windows.net) lets the CNAME chain reach the privatelink record.
    fr: |
      Les clients interrogent DNS1 : c'est donc DNS1 qui doit obtenir la réponse privée. Un redirecteur DNS situé dans un réseau virtuel lié à la zone privée transfère les requêtes au DNS fourni par Azure (168.63.129.16), qui répond à partir de la zone liée. Transférer le nom de la zone publique (blob.core.windows.net) permet à la chaîne CNAME d'atteindre l'enregistrement privatelink.
  options:
    b: { en: "The spoke clients send their queries to DNS1, not to Azure-provided DNS, so a link to the spokes isn't used.", fr: "Les clients des spokes envoient leurs requêtes à DNS1, pas au DNS fourni par Azure : un lien vers les spokes n'est pas utilisé." }
    c: { en: "A copy of the zone on DNS1 must be maintained by hand, which doesn't meet the automatic management requirement.", fr: "Une copie de la zone sur DNS1 doit être maintenue à la main, ce qui ne respecte pas l'exigence de gestion automatique." }
    d: { en: "Autoregistration registers VMs of the linked network; DNS1 still forwards storage queries to the internet.", fr: "L'inscription automatique enregistre les machines virtuelles du réseau lié ; DNS1 transfère toujours les requêtes de stockage vers Internet." }
references:
  - title: Azure Private Endpoint DNS integration Scenarios
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
  - title: Azure Private Endpoint private DNS zone values
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
