id: az700-4b-sep-region-sub
objective: "4.2.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Contoso has the following resources:

    | Resource | Subscription | Region |
    | --- | --- | --- |
    | stcontosoraw, stcontosocur | Sub1 | West Europe |
    | VNet2, with a subnet named Subnet1 | Sub2 | North Europe |

    The Microsoft.Storage service endpoint is enabled on Subnet1. You plan to create a service endpoint policy that lists stcontosoraw and stcontosocur and to associate the policy with Subnet1.

    Where should you create the service endpoint policy?
  fr: |
    Contoso dispose des ressources suivantes :

    | Ressource | Abonnement | Région |
    | --- | --- | --- |
    | stcontosoraw, stcontosocur | Sub1 | West Europe |
    | VNet2, avec un sous-réseau nommé Subnet1 | Sub2 | North Europe |

    Le point de terminaison de service Microsoft.Storage est activé sur Subnet1. Vous prévoyez de créer une stratégie de point de terminaison de service qui répertorie stcontosoraw et stcontosocur, puis d'associer la stratégie à Subnet1.

    Où devez-vous créer la stratégie de point de terminaison de service ?
body:
  options:
    - { id: a, text: { en: "In Sub1, in the West Europe region", fr: "Dans Sub1, dans la région West Europe" } }
    - { id: b, text: { en: "In Sub1, in the North Europe region", fr: "Dans Sub1, dans la région North Europe" } }
    - { id: c, text: { en: "In Sub2, in the West Europe region", fr: "Dans Sub2, dans la région West Europe" } }
    - { id: d, text: { en: "In Sub2, in the North Europe region", fr: "Dans Sub2, dans la région North Europe" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The virtual network must be in the same region and subscription as the service endpoint policy, so the policy goes in Sub2, North Europe. The storage accounts it lists can be in another subscription and, once the policy is applied, in any region, because the Storage service endpoint scope becomes global.
    fr: |
      Le réseau virtuel doit se trouver dans la même région et le même abonnement que la stratégie de point de terminaison de service : la stratégie va donc dans Sub2, en North Europe. Les comptes de stockage qu'elle répertorie peuvent se trouver dans un autre abonnement et, une fois la stratégie appliquée, dans n'importe quelle région, car l'étendue du point de terminaison de service Storage devient globale.
  options:
    a: { en: "The policy follows the virtual network, not the storage accounts; both the subscription and the region are wrong.", fr: "La stratégie suit le réseau virtuel, pas les comptes de stockage ; l'abonnement et la région sont tous deux incorrects." }
    b: { en: "The region matches VNet2, but the policy must also be in the subscription of VNet2.", fr: "La région correspond à VNet2, mais la stratégie doit aussi se trouver dans l'abonnement de VNet2." }
    c: { en: "The subscription matches VNet2, but the policy must also be in the region of VNet2.", fr: "L'abonnement correspond à VNet2, mais la stratégie doit aussi se trouver dans la région de VNet2." }
references:
  - title: Azure virtual network service endpoint policies
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoint-policies-overview
