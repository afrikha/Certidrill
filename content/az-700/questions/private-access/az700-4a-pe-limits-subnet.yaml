id: az700-4a-pe-limits-subnet
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove is designing a shared-services virtual network named **VNet-Shared** in West Europe. The network will host private endpoints for several hundred PaaS resources, including key vaults, storage accounts and Azure SQL Database servers located in several Azure regions.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove conçoit un réseau virtuel de services partagés nommé **VNet-Shared** dans West Europe. Ce réseau hébergera des points de terminaison privés pour plusieurs centaines de ressources PaaS, notamment des coffres de clés, des comptes de stockage et des serveurs Azure SQL Database situés dans plusieurs régions Azure.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "VNet-Shared can host up to 1,500 private endpoints.", fr: "VNet-Shared peut héberger jusqu'à 1 500 points de terminaison privés." } }
    - { id: b, text: { en: "A single key vault supports up to 64 private endpoints.", fr: "Un même coffre de clés prend en charge jusqu'à 64 points de terminaison privés." } }
    - { id: c, text: { en: "A private endpoint can be deployed in a subnet that also contains virtual machines.", fr: "Un point de terminaison privé peut être déployé dans un sous-réseau qui contient aussi des machines virtuelles." } }
    - { id: d, text: { en: "Each private endpoint must be in the same region as its target resource.", fr: "Chaque point de terminaison privé doit se trouver dans la même région que sa ressource cible." } }
    - { id: e, text: { en: "All the private endpoints of VNet-Shared must be deployed in the same subnet.", fr: "Tous les points de terminaison privés de VNet-Shared doivent être déployés dans le même sous-réseau." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      The Private Link limits allow 64 private endpoints per key vault. A private endpoint is a network interface in an ordinary subnet, which can also host virtual machines, as in the Microsoft quickstart that deploys the test VM in the endpoint's subnet.
    fr: |
      Les limites de Private Link autorisent 64 points de terminaison privés par coffre de clés. Un point de terminaison privé est une interface réseau dans un sous-réseau ordinaire, qui peut aussi héberger des machines virtuelles, comme dans le démarrage rapide de Microsoft qui déploie la machine virtuelle de test dans le sous-réseau du point de terminaison.
  options:
    a: { en: "The limit is 1,000 private endpoints per virtual network (4,000 across peered virtual networks).", fr: "La limite est de 1 000 points de terminaison privés par réseau virtuel (4 000 sur des réseaux virtuels reliés par peering)." }
    d: { en: "The endpoint must be in the region of its virtual network; the target resource can be in another region.", fr: "Le point de terminaison doit être dans la région de son réseau virtuel ; la ressource cible peut être dans une autre région." }
    e: { en: "Private endpoints can be spread across several subnets of the same virtual network.", fr: "Les points de terminaison privés peuvent être répartis sur plusieurs sous-réseaux du même réseau virtuel." }
references:
  - title: Azure subscription and service limits, quotas, and constraints
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/azure-subscription-service-limits
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
