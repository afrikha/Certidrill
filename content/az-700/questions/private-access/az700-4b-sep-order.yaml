id: az700-4b-sep-order
objective: "4.2.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove has a virtual network named **VNet1** in the West Europe region. A subnet named **Subnet-App** already has the Microsoft.Storage service endpoint enabled. Applications in Subnet-App use two storage accounts named **stwgapp** and **stwgdiag**.

    You need to prevent virtual machines in Subnet-App from reaching any other storage account, without interrupting access to stwgapp and stwgdiag.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove dispose d'un réseau virtuel nommé **VNet1** dans la région West Europe. Le point de terminaison de service Microsoft.Storage est déjà activé sur un sous-réseau nommé **Subnet-App**. Les applications de Subnet-App utilisent deux comptes de stockage nommés **stwgapp** et **stwgdiag**.

    Vous devez empêcher les machines virtuelles de Subnet-App d'atteindre tout autre compte de stockage, sans interrompre l'accès à stwgapp et stwgdiag.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Create a service endpoint policy in the West Europe region.", fr: "Créer une stratégie de point de terminaison de service dans la région West Europe." } }
    - { id: define, text: { en: "Add a policy definition for Microsoft.Storage that lists stwgapp and stwgdiag.", fr: "Ajouter une définition de stratégie pour Microsoft.Storage qui répertorie stwgapp et stwgdiag." } }
    - { id: assoc, text: { en: "Associate the policy with Subnet-App.", fr: "Associer la stratégie à Subnet-App." } }
    - { id: global, text: { en: "Replace the Microsoft.Storage service endpoint of Subnet-App with Microsoft.Storage.Global.", fr: "Remplacer le point de terminaison de service Microsoft.Storage de Subnet-App par Microsoft.Storage.Global." } }
    - { id: vnetrule, text: { en: "Add a virtual network rule for Subnet-App to stwgapp and stwgdiag.", fr: "Ajouter une règle de réseau virtuel pour Subnet-App à stwgapp et stwgdiag." } }
    - { id: nsg, text: { en: "Add an NSG outbound rule that denies the Storage service tag.", fr: "Ajouter une règle NSG sortante qui refuse l'étiquette de service Storage." } }
answer:
  sequence: [ create, define, assoc ]
explanation:
  correct:
    en: |
      The policy is created in the region and subscription of the virtual network, then its definition lists every account the applications need, and only then is it associated with the subnet. Microsoft warns to add all required storage accounts before the association, because from that moment only the listed resources are reachable over the service endpoint.
    fr: |
      La stratégie est créée dans la région et l'abonnement du réseau virtuel, puis sa définition répertorie tous les comptes dont les applications ont besoin, et elle n'est associée au sous-réseau qu'ensuite. Microsoft recommande d'ajouter tous les comptes de stockage nécessaires avant l'association, car dès ce moment seules les ressources répertoriées sont joignables via le point de terminaison de service.
  options:
    global: { en: "A policy works with the Microsoft.Storage endpoint and already makes its scope global; no endpoint change is needed.", fr: "Une stratégie fonctionne avec le point de terminaison Microsoft.Storage et rend déjà son étendue globale ; aucun changement de point de terminaison n'est nécessaire." }
    vnetrule: { en: "Virtual network rules restrict who reaches the accounts; they don't block the subnet from other accounts.", fr: "Les règles de réseau virtuel limitent qui atteint les comptes ; elles n'empêchent pas le sous-réseau d'atteindre d'autres comptes." }
    nsg: { en: "Denying the Storage service tag would also block stwgapp and stwgdiag.", fr: "Refuser l'étiquette de service Storage bloquerait aussi stwgapp et stwgdiag." }
references:
  - title: Create and associate service endpoint policies
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoint-policies
  - title: Azure virtual network service endpoint policies
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoint-policies-overview
