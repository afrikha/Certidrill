id: az700-4a-pe-portal-wizard
objective: "4.1.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You need to use the Azure portal to create a private endpoint for the blob service of a storage account named **stlitwarelogs**. The private endpoint must be placed in the **snet-pe** subnet of a virtual network named **VNet-Ops** and use a static IP address. You keep the default values on the **DNS** and **Tags** tabs.

    Which four actions should you perform in sequence in the **Create a private endpoint** wizard? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez utiliser le portail Azure pour créer un point de terminaison privé pour le service blob d'un compte de stockage nommé **stlitwarelogs**. Le point de terminaison privé doit être placé dans le sous-réseau **snet-pe** d'un réseau virtuel nommé **VNet-Ops** et utiliser une adresse IP statique. Vous conservez les valeurs par défaut des onglets **DNS** et **Tags**.

    Quelles sont les quatre actions à effectuer dans l'ordre dans l'assistant **Create a private endpoint** ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: basics, text: { en: "On the **Basics** tab, enter the name, the network interface name and the region.", fr: "Dans l'onglet **Basics**, saisir le nom, le nom de l'interface réseau et la région." } }
    - { id: resource, text: { en: "On the **Resource** tab, select the resource type `Microsoft.Storage/storageAccounts`, stlitwarelogs and the target subresource `blob`.", fr: "Dans l'onglet **Resource**, sélectionner le type de ressource `Microsoft.Storage/storageAccounts`, stlitwarelogs et la sous-ressource cible `blob`." } }
    - { id: vnet, text: { en: "On the **Virtual Network** tab, select VNet-Ops and snet-pe, and choose a static private IP configuration.", fr: "Dans l'onglet **Virtual Network**, sélectionner VNet-Ops et snet-pe, puis choisir une configuration d'adresse IP privée statique." } }
    - { id: create, text: { en: "On the **Review + create** tab, select **Create**.", fr: "Dans l'onglet **Review + create**, sélectionner **Create**." } }
    - { id: wrongbasics, text: { en: "On the **Basics** tab, select the target subresource `blob`.", fr: "Dans l'onglet **Basics**, sélectionner la sous-ressource cible `blob`." } }
    - { id: wrongnic, text: { en: "After creation, edit the network interface of the private endpoint and set its IP address to static.", fr: "Après la création, modifier l'interface réseau du point de terminaison privé et rendre son adresse IP statique." } }
answer:
  sequence: [ basics, resource, vnet, create ]
explanation:
  correct:
    en: |
      The wizard starts with **Basics** (name, network interface name, region), then **Resource** (connection method, resource type, resource and target subresource), then **Virtual Network** (virtual network, subnet, network policy and private IP configuration), followed by **DNS**, **Tags** and **Review + create**. The static IP address must be chosen during creation.
    fr: |
      L'assistant commence par **Basics** (nom, nom de l'interface réseau, région), puis **Resource** (méthode de connexion, type de ressource, ressource et sous-ressource cible), puis **Virtual Network** (réseau virtuel, sous-réseau, stratégie réseau et configuration d'adresse IP privée), suivis de **DNS**, **Tags** et **Review + create**. L'adresse IP statique doit être choisie pendant la création.
  options:
    wrongbasics: { en: "The target subresource is selected on the Resource tab.", fr: "La sous-ressource cible se sélectionne dans l'onglet Resource." }
    wrongnic: { en: "A static IP address can't be configured on an existing private endpoint.", fr: "Une adresse IP statique ne peut pas être configurée sur un point de terminaison privé existant." }
references:
  - title: "Quickstart: Create a private endpoint by using the Azure portal"
    url: https://learn.microsoft.com/en-us/azure/private-link/create-private-endpoint-portal
