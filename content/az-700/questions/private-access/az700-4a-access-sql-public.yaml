id: az700-4a-access-sql-public
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure SQL Database logical server named **sql-crm**. You created a private endpoint for sql-crm in a virtual network named **VNet-CRM** and configured the private DNS zone. Applications in VNet-CRM now connect through the private endpoint.

    An audit shows that users on the internet can still connect to sql-crm by using its public endpoint.

    You need to ensure that sql-crm can be reached only through the private endpoint.

    What should you do?
  fr: |
    Contoso dispose d'un serveur logique Azure SQL Database nommé **sql-crm**. Vous avez créé un point de terminaison privé pour sql-crm dans un réseau virtuel nommé **VNet-CRM** et configuré la zone DNS privée. Les applications de VNet-CRM se connectent désormais via le point de terminaison privé.

    Un audit montre que des utilisateurs sur Internet peuvent toujours se connecter à sql-crm par son point de terminaison public.

    Vous devez faire en sorte que sql-crm ne soit accessible que via le point de terminaison privé.

    Que devez-vous faire ?
body:
  options:
    - { id: b, text: { en: "Enable network security groups in the private endpoint network policy of the endpoint's subnet.", fr: "Activer les groupes de sécurité réseau dans la stratégie réseau des points de terminaison privés du sous-réseau du point de terminaison." } }
    - { id: a, text: { en: "Set Public network access to Disable in the networking settings of sql-crm.", fr: "Régler Public network access sur Disable dans les paramètres réseau de sql-crm." } }
    - { id: c, text: { en: "Add an inbound NSG rule that denies the Internet service tag on the endpoint's subnet.", fr: "Ajouter, sur le sous-réseau du point de terminaison, une règle NSG entrante qui refuse l'étiquette de service Internet." } }
    - { id: d, text: { en: "Link the privatelink.database.windows.net zone to every virtual network of Contoso.", fr: "Lier la zone privatelink.database.windows.net à tous les réseaux virtuels de Contoso." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A private endpoint doesn't block the public endpoint of the service. To force private access, you disable public network access on the resource itself; connections through approved private endpoints keep working.
    fr: |
      Un point de terminaison privé ne bloque pas le point de terminaison public du service. Pour imposer l'accès privé, vous désactivez l'accès réseau public sur la ressource elle-même ; les connexions via les points de terminaison privés approuvés continuent de fonctionner.
  options:
    b: { en: "Network policies control traffic sent to the private endpoint from your networks; internet users use the public endpoint, which they don't touch.", fr: "Les stratégies réseau contrôlent le trafic envoyé au point de terminaison privé depuis vos réseaux ; les utilisateurs Internet passent par le point de terminaison public, qu'elles ne concernent pas." }
    c: { en: "Internet traffic to the public endpoint never crosses the endpoint's subnet, so an NSG there has no effect on it.", fr: "Le trafic Internet vers le point de terminaison public ne traverse jamais le sous-réseau du point de terminaison : un NSG à cet endroit n'a aucun effet." }
    d: { en: "DNS resolution isn't access control: internet clients still resolve and reach the public endpoint.", fr: "La résolution DNS n'est pas un contrôle d'accès : les clients Internet résolvent et atteignent toujours le point de terminaison public." }
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
  - title: Azure Private Endpoint private DNS zone values
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
