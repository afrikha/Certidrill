id: az700-4b-sec-scope-statements
objective: "4.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware has a virtual network named **VNet1** that contains two subnets named **Subnet1** and **Subnet2**. No service endpoint is configured.

    You plan to enable service endpoints on Subnet1 so that its virtual machines can be allowed by the firewalls of a storage account and a key vault.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un réseau virtuel nommé **VNet1** qui contient deux sous-réseaux nommés **Subnet1** et **Subnet2**. Aucun point de terminaison de service n'est configuré.

    Vous prévoyez d'activer des points de terminaison de service sur Subnet1 pour que ses machines virtuelles puissent être autorisées par les pare-feu d'un compte de stockage et d'un coffre de clés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Enabling the Microsoft.Storage service endpoint on Subnet1 also applies it to the virtual machines in Subnet2.
        fr: |
          L'activation du point de terminaison de service Microsoft.Storage sur Subnet1 l'applique aussi aux machines virtuelles de Subnet2.
    - id: s2
      text:
        en: |
          You can enable the Microsoft.Storage and Microsoft.KeyVault service endpoints on Subnet1 at the same time.
        fr: |
          Vous pouvez activer en même temps les points de terminaison de service Microsoft.Storage et Microsoft.KeyVault sur Subnet1.
    - id: s3
      text:
        en: |
          Before you enable the service endpoints, you must delegate Subnet1 to Microsoft.Storage and Microsoft.KeyVault.
        fr: |
          Avant d'activer les points de terminaison de service, vous devez déléguer Subnet1 à Microsoft.Storage et à Microsoft.KeyVault.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Service endpoints are enabled subnet by subnet; to secure a service to several subnets, you enable the endpoint on each one. A subnet can enable several services in the same operation, for example by selecting both in the Services list or by passing both names to `--service-endpoints`. Service endpoints don't require subnet delegation, which is a separate feature that dedicates a subnet to an injected service.
    fr: |
      Les points de terminaison de service s'activent sous-réseau par sous-réseau ; pour sécuriser un service vers plusieurs sous-réseaux, vous activez le point de terminaison sur chacun d'eux. Un sous-réseau peut activer plusieurs services en une seule opération, par exemple en sélectionnant les deux dans la liste Services ou en passant les deux noms à `--service-endpoints`. Les points de terminaison de service ne nécessitent pas de délégation de sous-réseau, une fonctionnalité distincte qui dédie un sous-réseau à un service injecté.
references:
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
  - title: az network vnet subnet
    url: https://learn.microsoft.com/en-us/cli/azure/network/vnet/subnet
