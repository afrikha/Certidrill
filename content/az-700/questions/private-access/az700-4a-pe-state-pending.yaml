id: az700-4a-pe-state-pending
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You create a private endpoint named **PE-Archive** for a storage account that belongs to another business unit. You don't have any permissions on the storage account, so you submit a manual connection request with a request message. The owner of the storage account hasn't acted on the request yet.

    What is the connection status of PE-Archive?
  fr: |
    Vous créez un point de terminaison privé nommé **PE-Archive** pour un compte de stockage qui appartient à une autre division. Vous n'avez aucune autorisation sur le compte de stockage : vous soumettez donc une demande de connexion manuelle avec un message de requête. Le propriétaire du compte de stockage n'a pas encore traité la demande.

    Quel est l'état de connexion de PE-Archive ?
body:
  options:
    - { id: a, text: Approved }
    - { id: b, text: Pending }
    - { id: c, text: Disconnected }
    - { id: d, text: Rejected }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A manual request creates the private endpoint connection in the Pending state until the resource owner approves or rejects it. Only an Approved connection can carry traffic, so PE-Archive can't be used yet.
    fr: |
      Une demande manuelle crée la connexion de point de terminaison privé à l'état Pending jusqu'à ce que le propriétaire de la ressource l'approuve ou la rejette. Seule une connexion Approved peut transporter du trafic : PE-Archive n'est donc pas encore utilisable.
  options:
    a: { en: "Approved requires an approval by the owner, or automatic approval when you have the approval permission.", fr: "Approved exige une approbation du propriétaire, ou une approbation automatique si vous disposez de l'autorisation d'approbation." }
    c: { en: "Disconnected means that the resource owner removed the connection.", fr: "Disconnected signifie que le propriétaire de la ressource a supprimé la connexion." }
    d: { en: "Rejected means that the resource owner declined the request; no action has been taken here.", fr: "Rejected signifie que le propriétaire de la ressource a refusé la demande ; aucune action n'a été effectuée ici." }
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
