id: az700-4a-pe-region-subscription
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has two Azure subscriptions in the same Microsoft Entra tenant:

    | Subscription | Resource | Region |
    | --- | --- | --- |
    | Sub-Prod | Virtual network **VNet-Prod** with a subnet named **snet-pe** | West Europe |
    | Sub-Data | Storage account **stfabrikamhist** (general-purpose v2) | North Europe |

    Virtual machines in VNet-Prod must access the blobs of stfabrikamhist through a private endpoint in snet-pe.

    Where should you create the private endpoint?
  fr: |
    Fabrikam dispose de deux abonnements Azure dans le même locataire Microsoft Entra :

    | Abonnement | Ressource | Région |
    | --- | --- | --- |
    | Sub-Prod | Réseau virtuel **VNet-Prod** avec un sous-réseau nommé **snet-pe** | West Europe |
    | Sub-Data | Compte de stockage **stfabrikamhist** (v2 universel) | North Europe |

    Les machines virtuelles de VNet-Prod doivent accéder aux objets blob de stfabrikamhist via un point de terminaison privé dans snet-pe.

    Où devez-vous créer le point de terminaison privé ?
body:
  options:
    - { id: a, text: { en: "In Sub-Prod, in the West Europe region", fr: "Dans Sub-Prod, dans la région West Europe" } }
    - { id: b, text: { en: "In Sub-Data, in the North Europe region", fr: "Dans Sub-Data, dans la région North Europe" } }
    - { id: c, text: { en: "In Sub-Prod, in the North Europe region", fr: "Dans Sub-Prod, dans la région North Europe" } }
    - { id: d, text: { en: "In Sub-Data, in the West Europe region", fr: "Dans Sub-Data, dans la région West Europe" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A private endpoint must be in the same region and the same subscription as the virtual network that hosts it. The target resource can be in another region or subscription, so the storage account in North Europe and Sub-Data is not a constraint.
    fr: |
      Un point de terminaison privé doit se trouver dans la même région et le même abonnement que le réseau virtuel qui l'héberge. La ressource cible peut être dans une autre région ou un autre abonnement : le compte de stockage situé dans North Europe et dans Sub-Data n'impose donc rien.
  options:
    b: { en: "The endpoint follows its virtual network, not the target resource: both the region and the subscription are wrong.", fr: "Le point de terminaison suit son réseau virtuel, pas la ressource cible : la région et l'abonnement sont tous deux incorrects." }
    c: { en: "The endpoint must be in the region of VNet-Prod (West Europe), not in the region of the storage account.", fr: "Le point de terminaison doit être dans la région de VNet-Prod (West Europe), pas dans celle du compte de stockage." }
    d: { en: "The endpoint must be in the subscription of VNet-Prod (Sub-Prod), not in the subscription of the storage account.", fr: "Le point de terminaison doit être dans l'abonnement de VNet-Prod (Sub-Prod), pas dans celui du compte de stockage." }
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
