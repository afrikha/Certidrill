id: az700-4b-sec-cli-dropdown
objective: "4.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a virtual network named **VNet1** in a resource group named **RG-Net**. VNet1 contains an existing subnet named **Subnet-Data**.

    You need to enable service endpoints for Azure Storage and Azure SQL Database on Subnet-Data by using the Azure CLI.

    How should you complete the command? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un réseau virtuel nommé **VNet1** dans un groupe de ressources nommé **RG-Net**. VNet1 contient un sous-réseau existant nommé **Subnet-Data**.

    Vous devez activer des points de terminaison de service pour Stockage Azure et Azure SQL Database sur Subnet-Data à l'aide d'Azure CLI.

    Comment devez-vous compléter la commande ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    [[cmd]] \
      --resource-group RG-Net \
      --vnet-name VNet1 \
      --name Subnet-Data \
      [[param]] Microsoft.Storage [[sql]]
  slots:
    - id: cmd
      options:
        - { id: vnetupd, text: az network vnet update }
        - { id: subupd, text: az network vnet subnet update }
        - { id: subcreate, text: az network vnet subnet create }
    - id: param
      options:
        - { id: deleg, text: "--delegations" }
        - { id: sepol, text: "--service-endpoint-policy" }
        - { id: se, text: "--service-endpoints" }
    - id: sql
      options:
        - { id: sql, text: Microsoft.Sql }
        - { id: sqlservers, text: Microsoft.Sql/servers }
        - { id: tag, text: Sql }
answer:
  values: { cmd: subupd, param: se, sql: sql }
explanation:
  correct:
    en: |
      A service endpoint is a property of a subnet, so you change the existing subnet with `az network vnet subnet update`. The `--service-endpoints` parameter takes a space-separated list of service names from `az network vnet list-endpoint-services`, here Microsoft.Storage and Microsoft.Sql.
    fr: |
      Un point de terminaison de service est une propriété d'un sous-réseau : vous modifiez le sous-réseau existant avec `az network vnet subnet update`. Le paramètre `--service-endpoints` prend une liste de noms de services séparés par des espaces, issus de `az network vnet list-endpoint-services`, ici Microsoft.Storage et Microsoft.Sql.
  options:
    vnetupd: { en: "Service endpoints are set per subnet, not on the virtual network resource.", fr: "Les points de terminaison de service se définissent par sous-réseau, pas sur la ressource réseau virtuel." }
    subcreate: { en: "Subnet-Data already exists; create would fail instead of updating it.", fr: "Subnet-Data existe déjà ; create échouerait au lieu de le modifier." }
    deleg: { en: "Delegation dedicates a subnet to an injected service; it doesn't enable service endpoints.", fr: "La délégation dédie un sous-réseau à un service injecté ; elle n'active pas de points de terminaison de service." }
    sepol: { en: "This parameter associates a service endpoint policy; the endpoints themselves must already be enabled.", fr: "Ce paramètre associe une stratégie de point de terminaison de service ; les points de terminaison eux-mêmes doivent déjà être activés." }
    sqlservers: { en: "Microsoft.Sql/servers is a resource type, not the name of a service endpoint.", fr: "Microsoft.Sql/servers est un type de ressource, pas le nom d'un point de terminaison de service." }
    tag: { en: "Sql is a service tag used in NSG rules, not a service endpoint name.", fr: "Sql est une étiquette de service utilisée dans les règles de NSG, pas un nom de point de terminaison de service." }
references:
  - title: az network vnet subnet
    url: https://learn.microsoft.com/en-us/cli/azure/network/vnet/subnet
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
