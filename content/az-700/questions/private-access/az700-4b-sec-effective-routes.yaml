id: az700-4b-sec-effective-routes
objective: "4.2.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a virtual machine named **VM1** in a subnet named **Subnet1** of a virtual network named **VNet1** (10.0.0.0/16) in the West Europe region. Subnet1 is associated with a route table that sends 0.0.0.0/0 to an Azure Firewall at 10.0.100.4. The Microsoft.Storage service endpoint is enabled on Subnet1.

    The effective routes of the network interface of VM1 are shown in the following table. The second row contains the Azure Storage address prefixes of the West Europe region.

    Answer each prompt by selecting the address prefix of the route that VM1 uses.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une machine virtuelle nommée **VM1** dans un sous-réseau nommé **Subnet1** d'un réseau virtuel nommé **VNet1** (10.0.0.0/16), dans la région West Europe. Subnet1 est associé à une table de routage qui envoie 0.0.0.0/0 vers un Pare-feu Azure à l'adresse 10.0.100.4. Le point de terminaison de service Microsoft.Storage est activé sur Subnet1.

    Les itinéraires effectifs de l'interface réseau de VM1 figurent dans le tableau suivant. La deuxième ligne contient les préfixes d'adresse de Stockage Azure de la région West Europe.

    Répondez à chaque consigne en sélectionnant le préfixe d'adresse de l'itinéraire qu'utilise VM1.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Traffic from VM1 to the blob endpoint of a storage account in West Europe", fr: "Trafic de VM1 vers le point de terminaison blob d'un compte de stockage en West Europe" }
    - id: p2
      text: { en: "Traffic from VM1 to the blob endpoint of a storage account in East US", fr: "Trafic de VM1 vers le point de terminaison blob d'un compte de stockage en East US" }
  grid:
    header: [Source, { en: State, fr: État }, { en: Address prefixes, fr: Préfixes d'adresse }, { en: Next hop type, fr: Type de tronçon suivant }, { en: Next hop IP address, fr: Adresse IP du tronçon suivant }]
    rows:
      - [{ text: Default }, { text: Active }, { text: 10.0.0.0/16, area: r1 }, { text: { en: Virtual network, fr: Réseau virtuel } }, { text: "-" }]
      - [{ text: Default }, { text: Active }, { text: { en: "Azure Storage prefixes (West Europe)", fr: "Préfixes de Stockage Azure (West Europe)" }, area: r2 }, { text: VirtualNetworkServiceEndpoint }, { text: "-" }]
      - [{ text: User }, { text: Active }, { text: 0.0.0.0/0, area: r3 }, { text: { en: Virtual appliance, fr: Appliance virtuelle } }, { text: 10.0.100.4 }]
      - [{ text: Default }, { text: Invalid }, { text: 0.0.0.0/0, area: r4 }, { text: Internet }, { text: "-" }]
      - [{ text: Default }, { text: Active }, { text: 10.0.0.0/8, area: r5 }, { text: None }, { text: "-" }]
answer:
  values: { p1: r2, p2: r3 }
explanation:
  correct:
    en: |
      Routes with the next hop type VirtualNetworkServiceEndpoint are more specific routes for the service prefixes and take precedence over user-defined routes that match them, so West Europe storage traffic goes directly over the backbone. The Microsoft.Storage endpoint covers only accounts in the region of the virtual network; East US prefixes aren't in the table, so that traffic matches the user-defined 0.0.0.0/0 route to the firewall. The system 0.0.0.0/0 route is Invalid because the user-defined route replaces it.
    fr: |
      Les itinéraires de type de tronçon suivant VirtualNetworkServiceEndpoint sont des itinéraires plus spécifiques pour les préfixes du service et l'emportent sur les itinéraires définis par l'utilisateur qui leur correspondent : le trafic de stockage de West Europe part directement sur le réseau principal. Le point de terminaison Microsoft.Storage ne couvre que les comptes de la région du réseau virtuel ; les préfixes d'East US ne figurent pas dans le tableau : ce trafic correspond à l'itinéraire défini par l'utilisateur 0.0.0.0/0 vers le pare-feu. L'itinéraire système 0.0.0.0/0 est Invalid, car l'itinéraire défini par l'utilisateur le remplace.
references:
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
  - title: Firewall rules and network access for Azure Blob, Data Lake, Queue, and Table Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
