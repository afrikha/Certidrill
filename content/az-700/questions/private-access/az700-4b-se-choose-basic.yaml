id: az700-4b-se-choose-basic
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has a virtual network named **VNet1** in the West Europe region. Virtual machines in a subnet named **Subnet-App** use a general-purpose v2 storage account named **stlitwareapp**, also in West Europe. Subnet-App is associated with a NAT gateway.

    You need to ensure that only the virtual machines in Subnet-App can access stlitwareapp. The solution must meet the following requirements:

    - The DNS configuration must remain unchanged.
    - Costs must be minimized.

    What should you implement?
  fr: |
    Litware dispose d'un réseau virtuel nommé **VNet1** dans la région West Europe. Les machines virtuelles d'un sous-réseau nommé **Subnet-App** utilisent un compte de stockage v2 à usage général nommé **stlitwareapp**, lui aussi en West Europe. Subnet-App est associé à une passerelle NAT.

    Vous devez faire en sorte que seules les machines virtuelles de Subnet-App puissent accéder à stlitwareapp. La solution doit répondre aux exigences suivantes :

    - La configuration DNS doit rester inchangée.
    - Les coûts doivent être réduits au minimum.

    Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "A private endpoint for stlitwareapp in Subnet-App, with public network access disabled", fr: "Un point de terminaison privé pour stlitwareapp dans Subnet-App, avec l'accès réseau public désactivé" } }
    - { id: b, text: { en: "An IP network rule on stlitwareapp for the public IP address of the NAT gateway", fr: "Une règle de réseau IP sur stlitwareapp pour l'adresse IP publique de la passerelle NAT" } }
    - { id: c, text: { en: "A Microsoft.Storage service endpoint on Subnet-App, with a virtual network rule on stlitwareapp", fr: "Un point de terminaison de service Microsoft.Storage sur Subnet-App, avec une règle de réseau virtuel sur stlitwareapp" } }
    - { id: d, text: { en: "A Private Link service in Subnet-App, with a connection approved by stlitwareapp", fr: "Un service Private Link dans Subnet-App, avec une connexion approuvée par stlitwareapp" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A service endpoint is free and leaves DNS unchanged; the storage account then sees the private source address and subnet identity of the virtual machines, and a virtual network rule (with the default action Deny) admits only Subnet-App.
    fr: |
      Un point de terminaison de service est gratuit et ne modifie pas le DNS ; le compte de stockage voit alors l'adresse source privée et l'identité du sous-réseau des machines virtuelles, et une règle de réseau virtuel (avec l'action par défaut Deny) n'admet que Subnet-App.
  options:
    a: { en: "A private endpoint would work, but it's billed and requires a privatelink DNS zone, which breaks both requirements.", fr: "Un point de terminaison privé fonctionnerait, mais il est facturé et nécessite une zone DNS privatelink, ce qui enfreint les deux exigences." }
    b: { en: "IP network rules have no effect on requests that come from the same Azure region as the storage account.", fr: "Les règles de réseau IP n'ont aucun effet sur les requêtes qui proviennent de la même région Azure que le compte de stockage." }
    d: { en: "A Private Link service publishes your own application behind a Standard load balancer; it doesn't secure access to a storage account.", fr: "Un service Private Link publie votre propre application derrière un équilibreur de charge Standard ; il ne sécurise pas l'accès à un compte de stockage." }
references:
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
  - title: "Guidelines & limitations: Azure Storage firewall"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-limitations
