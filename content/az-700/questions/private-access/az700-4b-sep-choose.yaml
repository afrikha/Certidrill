id: az700-4b-sep-choose
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a subnet named **Subnet-Analytics** in the West Europe region. The Microsoft.Storage service endpoint is enabled on Subnet-Analytics. All of Adatum's storage accounts are in a subscription named **Sub-Data**.

    The security team is concerned that a user of a virtual machine in Subnet-Analytics could copy data to a storage account owned by another organization.

    You need to ensure that virtual machines in Subnet-Analytics can reach only the storage accounts in Sub-Data through the service endpoint.

    What should you use?
  fr: |
    Adatum dispose d'un sous-réseau nommé **Subnet-Analytics** dans la région West Europe. Le point de terminaison de service Microsoft.Storage est activé sur Subnet-Analytics. Tous les comptes de stockage d'Adatum se trouvent dans un abonnement nommé **Sub-Data**.

    L'équipe de sécurité craint qu'un utilisateur d'une machine virtuelle de Subnet-Analytics copie des données vers un compte de stockage appartenant à une autre organisation.

    Vous devez faire en sorte que les machines virtuelles de Subnet-Analytics ne puissent atteindre que les comptes de stockage de Sub-Data via le point de terminaison de service.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A network security group outbound rule that allows only the Storage.WestEurope service tag", fr: "Une règle sortante de groupe de sécurité réseau qui n'autorise que l'étiquette de service Storage.WestEurope" } }
    - { id: b, text: { en: "A virtual network rule for Subnet-Analytics on each storage account in Sub-Data", fr: "Une règle de réseau virtuel pour Subnet-Analytics sur chaque compte de stockage de Sub-Data" } }
    - { id: c, text: { en: "An Azure Policy assignment that denies the creation of storage accounts outside Sub-Data", fr: "Une attribution Azure Policy qui refuse la création de comptes de stockage hors de Sub-Data" } }
    - { id: d, text: { en: "A service endpoint policy that lists Sub-Data, associated with Subnet-Analytics", fr: "Une stratégie de point de terminaison de service qui répertorie Sub-Data, associée à Subnet-Analytics" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A service endpoint policy filters egress traffic from the subnet to Azure Storage over the service endpoint and allows only the listed resources; a subscription entry allows every storage account in Sub-Data and denies all others, which closes the exfiltration path.
    fr: |
      Une stratégie de point de terminaison de service filtre le trafic sortant du sous-réseau vers Stockage Azure via le point de terminaison de service et n'autorise que les ressources listées ; une entrée d'abonnement autorise tous les comptes de stockage de Sub-Data et refuse tous les autres, ce qui ferme le chemin d'exfiltration.
  options:
    a: { en: "A service tag allows every storage account of the region, including accounts of other organizations.", fr: "Une étiquette de service autorise tous les comptes de stockage de la région, y compris ceux d'autres organisations." }
    b: { en: "Virtual network rules control who can reach Adatum's accounts; they don't stop the subnet from reaching other accounts.", fr: "Les règles de réseau virtuel contrôlent qui peut atteindre les comptes d'Adatum ; elles n'empêchent pas le sous-réseau d'atteindre d'autres comptes." }
    c: { en: "Azure Policy governs Adatum's own resource deployments; it can't filter traffic to accounts in another organization's subscriptions.", fr: "Azure Policy régit les déploiements de ressources d'Adatum ; il ne peut pas filtrer le trafic vers des comptes situés dans les abonnements d'une autre organisation." }
references:
  - title: Azure virtual network service endpoint policies
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoint-policies-overview
