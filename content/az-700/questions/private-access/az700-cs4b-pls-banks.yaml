id: az700-cs4b-pls-banks
objective: "4.1.4"
type: dropdown
caseStudy: az700-cs4b-fernhill
difficulty: 2
status: draft
stem:
  en: |
    You create a Private Link service named **pls-dist** that uses the frontend IP configuration of ILB-Dist and NAT IP addresses from snet-pls. The banks will create private endpoints in their virtual networks that connect to pls-dist.

    You need to configure pls-dist to meet the distribution API requirements. How should you configure pls-dist? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un service Private Link nommé **pls-dist** qui utilise la configuration IP frontale d'ILB-Dist et des adresses IP NAT de snet-pls. Les banques créeront dans leurs réseaux virtuels des points de terminaison privés qui se connectent à pls-dist.

    Vous devez configurer pls-dist pour respecter les exigences de l'API de distribution. Comment devez-vous configurer pls-dist ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Visibility: [[vis]]

      Registered bank subscriptions: [[approval]]

      Setting that lets the API log the client address: [[proxy]]
    fr: |
      Visibilité : [[vis]]

      Abonnements de banques enregistrés : [[approval]]

      Paramètre qui permet à l'API de journaliser l'adresse du client : [[proxy]]
  slots:
    - id: vis
      options:
        - { id: rbac, text: { en: "Role-based access control only", fr: "Contrôle d'accès en fonction du rôle uniquement (Role-based access control only)" } }
        - { id: sub, text: { en: "Restricted by subscription", fr: "Limité par abonnement (Restricted by subscription)" } }
        - { id: alias, text: { en: "Anyone with your alias", fr: "Toute personne disposant de votre alias (Anyone with your alias)" } }
    - id: approval
      options:
        - { id: manual, text: { en: "Approve each private endpoint connection manually", fr: "Approuver manuellement chaque connexion de point de terminaison privé" } }
        - { id: role, text: { en: "Grant the Network Contributor role on pls-dist", fr: "Accorder le rôle Network Contributor sur pls-dist" } }
        - { id: auto, text: { en: "Add them to the auto-approval list", fr: "Les ajouter à la liste d'approbation automatique" } }
    - id: proxy
      options:
        - { id: floating, text: { en: "Floating IP on the load-balancing rules of ILB-Dist", fr: "IP flottante sur les règles d'équilibrage de charge d'ILB-Dist" } }
        - { id: tcpv2, text: { en: "TCP Proxy v2 on pls-dist", fr: "TCP Proxy v2 sur pls-dist" } }
        - { id: persist, text: { en: "Session persistence (Client IP) on ILB-Dist", fr: "Persistance de session (Client IP) sur ILB-Dist" } }
answer:
  values: { vis: sub, approval: auto, proxy: tcpv2 }
explanation:
  correct:
    en: |
      A Private Link service exposes ILB-Dist to private endpoints in other subscriptions and tenants; traffic is translated to NAT IP addresses of snet-pls, so overlapping address spaces don't conflict. **Restricted by subscription** lets only the listed subscriptions find the service, without granting permissions to bank users. The auto-approval list, a subset of the visibility list, accepts their connection requests automatically. Because the API receives the NAT IP address instead of the client address, enabling TCP Proxy v2 adds a proxy protocol header that carries the source IP address of the consumer (and the LinkID of its private endpoint); the API must be able to parse that header.
    fr: |
      Un service Private Link expose ILB-Dist à des points de terminaison privés d'autres abonnements et locataires ; le trafic est traduit vers des adresses IP NAT de snet-pls : des espaces d'adressage qui se chevauchent n'entrent donc pas en conflit. **Restricted by subscription** permet aux seuls abonnements listés de trouver le service, sans accorder d'autorisation aux utilisateurs des banques. La liste d'approbation automatique, sous-ensemble de la liste de visibilité, accepte automatiquement leurs demandes de connexion. Comme l'API reçoit l'adresse IP NAT au lieu de l'adresse du client, l'activation de TCP Proxy v2 ajoute un en-tête de protocole proxy qui transporte l'adresse IP source du consommateur (et le LinkID de son point de terminaison privé) ; l'API doit savoir analyser cet en-tête.
  options:
    rbac: { en: "With Role-based access control only, a bank would need Azure permissions on the service to find it, which requirement 6 forbids.", fr: "Avec Role-based access control only, une banque aurait besoin d'autorisations Azure sur le service pour le trouver, ce que l'exigence 6 interdit." }
    alias: { en: "Anyone with your alias lets any subscription that knows the alias find the service, not only the registered banks.", fr: "Anyone with your alias permet à tout abonnement qui connaît l'alias de trouver le service, pas seulement aux banques enregistrées." }
    manual: { en: "Manual approval contradicts requirement 7.", fr: "L'approbation manuelle contredit l'exigence 7." }
    role: { en: "Granting a role gives bank users Azure permissions, which requirement 6 forbids, and doesn't approve connections automatically.", fr: "Accorder un rôle donne des autorisations Azure aux utilisateurs des banques, ce que l'exigence 6 interdit, et n'approuve pas les connexions automatiquement." }
    floating: { en: "Floating IP changes the destination address seen by the backend; the source is still the NAT IP address of the Private Link service.", fr: "L'IP flottante modifie l'adresse de destination vue par le back-end ; la source reste l'adresse IP NAT du service Private Link." }
    persist: { en: "Session persistence only keeps a client on the same backend VM; it doesn't reveal the client address behind the NAT.", fr: "La persistance de session ne fait que maintenir un client sur la même machine virtuelle du back-end ; elle ne révèle pas l'adresse du client derrière la NAT." }
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
