id: az700-4a-access-firewall-snat
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has a hub virtual network that contains an Azure Firewall and a spoke virtual network named **VNet-PE** that contains only private endpoints. A spoke named **VNet-App** contains application virtual machines. Both spokes are peered with the hub and with each other.

    The network policy for private endpoints of the endpoint subnet is set to **RouteTableEnabled**. A route table associated with the application subnet sends the address space of VNet-PE to the firewall. The firewall allows the traffic by using **network rules**, with the default SNAT settings.

    Connections from the application virtual machines to the private endpoints fail. The firewall logs show the allowed outbound packets, but the sessions never complete.

    You need to fix the connectivity while keeping the inspection by the firewall.

    What should you do?
  fr: |
    Tailspin dispose d'un réseau virtuel hub qui contient un Pare-feu Azure et d'un réseau virtuel spoke nommé **VNet-PE** qui ne contient que des points de terminaison privés. Un spoke nommé **VNet-App** contient les machines virtuelles de l'application. Les deux spokes sont reliés par peering au hub et entre eux.

    La stratégie réseau des points de terminaison privés du sous-réseau des points de terminaison vaut **RouteTableEnabled**. Une table de routage associée au sous-réseau de l'application envoie l'espace d'adressage de VNet-PE vers le pare-feu. Le pare-feu autorise le trafic avec des **règles de réseau**, avec les paramètres SNAT par défaut.

    Les connexions des machines virtuelles de l'application vers les points de terminaison privés échouent. Les journaux du pare-feu montrent les paquets sortants autorisés, mais les sessions n'aboutissent jamais.

    Vous devez rétablir la connectivité tout en conservant l'inspection par le pare-feu.

    Que devez-vous faire ?
body:
  options:
    - { id: b, text: { en: "Set the network policy for private endpoints of the endpoint subnet to NetworkSecurityGroupEnabled.", fr: "Régler la stratégie réseau des points de terminaison privés du sous-réseau des points de terminaison sur NetworkSecurityGroupEnabled." } }
    - { id: c, text: { en: "Add a 0.0.0.0/0 route to the firewall in the route table of the application subnet.", fr: "Ajouter un itinéraire 0.0.0.0/0 vers le pare-feu dans la table de routage du sous-réseau de l'application." } }
    - { id: a, text: { en: "Replace the network rules with application rules for the FQDNs of the services.", fr: "Remplacer les règles de réseau par des règles d'application pour les FQDN des services." } }
    - { id: d, text: { en: "Associate an NSG that allows inbound traffic from AzureFirewallSubnet with the endpoint subnet.", fr: "Associer au sous-réseau des points de terminaison un NSG qui autorise le trafic entrant provenant d'AzureFirewallSubnet." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The return traffic from the private endpoints goes straight back to the application VMs instead of through the firewall, so the flow is asymmetric. Azure Firewall always applies SNAT to traffic matched by application rules, which keeps the flow symmetric; with network rules, you must configure SNAT for traffic to private endpoints. Using application rules fixes the issue while keeping inspection.
    fr: |
      Le trafic de retour des points de terminaison privés revient directement vers les machines virtuelles de l'application au lieu de passer par le pare-feu : le flux est asymétrique. Le Pare-feu Azure applique toujours la SNAT au trafic correspondant à des règles d'application, ce qui garde le flux symétrique ; avec des règles de réseau, vous devez configurer la SNAT pour le trafic vers les points de terminaison privés. Utiliser des règles d'application règle le problème tout en conservant l'inspection.
  options:
    b: { en: "This value disables the route table policy, so the /32 routes would bypass the firewall again.", fr: "Cette valeur désactive la stratégie de table de routage : les itinéraires /32 contourneraient de nouveau le pare-feu." }
    c: { en: "A default route is less specific than the existing route and doesn't change the return path.", fr: "Un itinéraire par défaut est moins précis que l'itinéraire existant et ne modifie pas le chemin de retour." }
    d: { en: "With RouteTableEnabled, NSGs don't apply to the private endpoints, and the problem is the asymmetric return path, not filtering.", fr: "Avec RouteTableEnabled, les NSG ne s'appliquent pas aux points de terminaison privés, et le problème vient du chemin de retour asymétrique, pas du filtrage." }
references:
  - title: Azure Firewall scenarios to inspect traffic destined to a private endpoint
    url: https://learn.microsoft.com/en-us/azure/private-link/inspect-traffic-with-azure-firewall
