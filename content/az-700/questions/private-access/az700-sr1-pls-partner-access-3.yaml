id: az700-sr1-pls-partner-access-3
objective: "4.1.4"
type: series_yesno
series: az700-sr1-pls-partner-access
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You create a Private Link service on ILB1 with visibility set to Anyone with your alias.
  fr: |
    Vous créez un service Private Link sur ILB1 avec la visibilité définie sur Anyone with your alias.
body:
  solution:
    en: |
      In VNet-Prov, you create a **Private Link service** that is associated with the frontend IP configuration of ILB1 and that takes its NAT IP address from a subnet of VNet-Prov. You set its visibility to **Anyone with your alias**, leave the auto-approval list empty, and send the alias to Contoso. Contoso creates a private endpoint in VNet-Cons that targets the alias. You make no other change.
    fr: |
      Dans VNet-Prov, vous créez un **service Private Link** associé à la configuration IP frontale d'ILB1 et qui prend son adresse IP NAT dans un sous-réseau de VNet-Prov. Vous définissez sa visibilité sur **Anyone with your alias**, laissez vide la liste d'approbation automatique et envoyez l'alias à Contoso. Contoso crée dans VNet-Cons un point de terminaison privé qui cible l'alias. Vous n'apportez aucune autre modification.
answer: { value: false }
explanation:
  correct:
    en: |
      Visibility only controls who can find the service and request a connection. Because Contoso's subscription isn't in the auto-approval list, the private endpoint connection is created in the Pending state, and only approved connections can send traffic to the Private Link service. Fabrikam must approve the connection, or add Contoso's subscription to the auto-approval list before Contoso creates the endpoint.
    fr: |
      La visibilité détermine seulement qui peut trouver le service et demander une connexion. Comme l'abonnement de Contoso ne figure pas dans la liste d'approbation automatique, la connexion de point de terminaison privé est créée à l'état Pending, et seules les connexions approuvées peuvent envoyer du trafic au service Private Link. Fabrikam doit approuver la connexion, ou ajouter l'abonnement de Contoso à la liste d'approbation automatique avant que Contoso ne crée le point de terminaison.
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
