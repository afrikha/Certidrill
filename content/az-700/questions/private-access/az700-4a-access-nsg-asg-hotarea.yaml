id: az700-4a-access-nsg-asg-hotarea
objective: "4.1.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a virtual network named **VNet1** (10.1.0.0/16) that is peered with **VNet2** (10.2.0.0/16). A private endpoint named **PE-SQL** for an Azure SQL Database server is in the **snet-pe** subnet of VNet1. PE-SQL is a member of an application security group named **asg-pe-sql**.

    The network policy for private endpoints of snet-pe is set to **NetworkSecurityGroupEnabled**. A network security group named **NSG-PE** is associated with snet-pe and has the inbound security rules shown in the following table. No other NSG applies to the traffic.

    | Virtual machine | IP address | Application security group |
    | --- | --- | --- |
    | VM-App1 | 10.1.1.5 (VNet1) | asg-app |
    | VM-Web1 | 10.1.3.4 (VNet1) | None |
    | VM-Admin1 | 10.2.8.4 (VNet2) | None |

    Answer each prompt by selecting the rule that processes the connection to PE-SQL on TCP port 1433.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un réseau virtuel nommé **VNet1** (10.1.0.0/16) relié par peering à **VNet2** (10.2.0.0/16). Un point de terminaison privé nommé **PE-SQL** pour un serveur Azure SQL Database se trouve dans le sous-réseau **snet-pe** de VNet1. PE-SQL est membre d'un groupe de sécurité d'application nommé **asg-pe-sql**.

    La stratégie réseau des points de terminaison privés de snet-pe vaut **NetworkSecurityGroupEnabled**. Un groupe de sécurité réseau nommé **NSG-PE** est associé à snet-pe et contient les règles de sécurité entrantes du tableau suivant. Aucun autre NSG ne s'applique au trafic.

    | Machine virtuelle | Adresse IP | Groupe de sécurité d'application |
    | --- | --- | --- |
    | VM-App1 | 10.1.1.5 (VNet1) | asg-app |
    | VM-Web1 | 10.1.3.4 (VNet1) | Aucun |
    | VM-Admin1 | 10.2.8.4 (VNet2) | Aucun |

    Répondez à chaque consigne en sélectionnant la règle qui traite la connexion vers PE-SQL sur le port TCP 1433.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Connection from VM-App1", fr: "Connexion depuis VM-App1" }
    - id: p2
      text: { en: "Connection from VM-Admin1", fr: "Connexion depuis VM-Admin1" }
    - id: p3
      text: { en: "Connection from VM-Web1", fr: "Connexion depuis VM-Web1" }
  grid:
    header: [{ en: "Priority", fr: "Priorité" }, { en: Name, fr: Nom }, { en: Source, fr: Source }, { en: Destination, fr: Destination }, Port, Action]
    rows:
      - [{ text: "100" }, { text: Allow-App-SQL, area: r100 }, { text: asg-app }, { text: asg-pe-sql }, { text: "1433" }, { text: Allow }]
      - [{ text: "200" }, { text: Deny-VNet2, area: r200 }, { text: 10.2.0.0/16 }, { text: Any }, { text: Any }, { text: Deny }]
      - [{ text: "300" }, { text: Allow-Admins-SQL, area: r300 }, { text: 10.2.8.0/24 }, { text: asg-pe-sql }, { text: "1433" }, { text: Allow }]
      - [{ text: "65000" }, { text: AllowVnetInBound, area: r65000 }, { text: VirtualNetwork }, { text: VirtualNetwork }, { text: Any }, { text: Allow }]
      - [{ text: "65500" }, { text: DenyAllInBound, area: r65500 }, { text: Any }, { text: Any }, { text: Any }, { text: Deny }]
answer:
  values: { p1: r100, p2: r200, p3: r65000 }
explanation:
  correct:
    en: |
      With `NetworkSecurityGroupEnabled`, NSG-PE applies to traffic sent to PE-SQL, and private endpoints can be members of application security groups. Rules are processed by priority and stop at the first match: VM-App1 (asg-app) matches rule 100. VM-Admin1 (10.2.8.4) matches rule 200 before rule 300, so it's denied. VM-Web1 matches neither custom rule and is allowed by the default AllowVnetInBound rule (65000).
    fr: |
      Avec `NetworkSecurityGroupEnabled`, NSG-PE s'applique au trafic envoyé à PE-SQL, et les points de terminaison privés peuvent être membres de groupes de sécurité d'application. Les règles sont traitées par priorité et le traitement s'arrête à la première correspondance : VM-App1 (asg-app) correspond à la règle 100. VM-Admin1 (10.2.8.4) correspond à la règle 200 avant la règle 300 : la connexion est refusée. VM-Web1 ne correspond à aucune règle personnalisée et est autorisée par la règle par défaut AllowVnetInBound (65000).
references:
  - title: Manage network policies for private endpoints
    url: https://learn.microsoft.com/en-us/azure/private-link/disable-private-endpoint-network-policy
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
