id: az700-4b-se-peered-onprem
objective: "4.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso has the following environment in the West Europe region:

    - A virtual network named **VNet1** with a subnet named **Subnet1**. The Microsoft.Storage service endpoint is enabled on Subnet1.
    - A virtual network named **VNet2**, peered with VNet1. No service endpoint is enabled in VNet2.
    - A VPN gateway in VNet1 with a site-to-site connection to the on-premises network.
    - A storage account named **stcontosodocs**. Public network access is set to **Enabled from selected virtual networks and IP addresses**, and the only rule is a virtual network rule for Subnet1.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose de l'environnement suivant dans la région West Europe :

    - Un réseau virtuel nommé **VNet1** avec un sous-réseau nommé **Subnet1**. Le point de terminaison de service Microsoft.Storage est activé sur Subnet1.
    - Un réseau virtuel nommé **VNet2**, relié à VNet1 par peering. Aucun point de terminaison de service n'est activé dans VNet2.
    - Une passerelle VPN dans VNet1 avec une connexion de site à site vers le réseau local.
    - Un compte de stockage nommé **stcontosodocs**. L'accès réseau public a la valeur **Enabled from selected virtual networks and IP addresses**, et la seule règle est une règle de réseau virtuel pour Subnet1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A virtual machine in Subnet1 can access stcontosodocs.
        fr: |
          Une machine virtuelle de Subnet1 peut accéder à stcontosodocs.
    - id: s2
      text:
        en: |
          A virtual machine in VNet2 can access stcontosodocs through the peering with VNet1.
        fr: |
          Une machine virtuelle de VNet2 peut accéder à stcontosodocs grâce au peering avec VNet1.
    - id: s3
      text:
        en: |
          An on-premises server can access stcontosodocs through the site-to-site VPN.
        fr: |
          Un serveur local peut accéder à stcontosodocs via le VPN de site à site.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Subnet1 has the service endpoint and is allowed by the virtual network rule, so its virtual machines are accepted. A service endpoint applies only to the subnet that enables it; traffic from VNet2 reaches the storage public endpoint with a source that no rule allows, even though the networks are peered. Service endpoints can't be used for on-premises traffic; on-premises access would need an IP network rule for the public NAT addresses or a private endpoint.
    fr: |
      Subnet1 dispose du point de terminaison de service et est autorisé par la règle de réseau virtuel : ses machines virtuelles sont acceptées. Un point de terminaison de service ne s'applique qu'au sous-réseau qui l'active ; le trafic de VNet2 atteint le point de terminaison public du stockage avec une source qu'aucune règle n'autorise, même si les réseaux sont reliés par peering. Les points de terminaison de service ne peuvent pas être utilisés pour le trafic local ; l'accès local nécessiterait une règle de réseau IP pour les adresses NAT publiques, ou un point de terminaison privé.
references:
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
