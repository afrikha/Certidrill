id: az700-4a-pls-facts-yesno
objective: "4.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a Standard internal load balancer named **lb-apps** in a virtual network named **VNet-Apps** in East US. Adatum plans to publish several applications behind lb-apps by using Private Link services.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un équilibreur de charge interne Standard nommé **lb-apps** dans un réseau virtuel nommé **VNet-Apps** situé dans East US. Adatum prévoit de publier plusieurs applications derrière lb-apps au moyen de services Private Link.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A Private Link service that uses lb-apps can be created in the West Europe region.
        fr: Un service Private Link qui utilise lb-apps peut être créé dans la région West Europe.
    - id: s2
      text:
        en: A consumer can connect to a Private Link service of lb-apps from a private endpoint in a virtual network in West Europe.
        fr: Un consommateur peut se connecter à un service Private Link de lb-apps depuis un point de terminaison privé situé dans un réseau virtuel de West Europe.
    - id: s3
      text:
        en: lb-apps can host up to eight Private Link services, each attached to a different frontend IP configuration.
        fr: lb-apps peut héberger jusqu'à huit services Private Link, chacun attaché à une configuration IP frontale différente.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A Private Link service must be in the same region as its virtual network and Standard load balancer, here East US. Approved private endpoints in any public region can connect to it. Several Private Link services can share a Standard load balancer by using different frontend IP configurations, up to eight per load balancer.
    fr: |
      Un service Private Link doit se trouver dans la même région que son réseau virtuel et son équilibreur de charge Standard, ici East US. Les points de terminaison privés approuvés de n'importe quelle région publique peuvent s'y connecter. Plusieurs services Private Link peuvent partager un équilibreur de charge Standard en utilisant des configurations IP frontales différentes, jusqu'à huit par équilibreur de charge.
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
  - title: Azure subscription and service limits, quotas, and constraints
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/azure-subscription-service-limits
