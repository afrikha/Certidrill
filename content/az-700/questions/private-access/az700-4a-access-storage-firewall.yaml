id: az700-4a-access-storage-firewall
objective: "4.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a general-purpose v2 storage account named **stnwinvoices**. You create an approved private endpoint for the blob service of stnwinvoices in a virtual network named **VNet-Fin**, configure the private DNS zone, and then set **Public network access** of stnwinvoices to **Disabled**. No virtual network rules or IP rules are configured on the storage firewall.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un compte de stockage v2 universel nommé **stnwinvoices**. Vous créez un point de terminaison privé approuvé pour le service blob de stnwinvoices dans un réseau virtuel nommé **VNet-Fin**, configurez la zone DNS privée, puis réglez **Public network access** de stnwinvoices sur **Disabled**. Aucune règle de réseau virtuel ni aucune règle IP n'est configurée sur le pare-feu du stockage.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Virtual machines in VNet-Fin can still access the blobs of stnwinvoices through the private endpoint.
        fr: Les machines virtuelles de VNet-Fin peuvent toujours accéder aux objets blob de stnwinvoices via le point de terminaison privé.
    - id: s2
      text:
        en: For the private endpoint to work, you must add VNet-Fin as a virtual network rule on the storage firewall.
        fr: Pour que le point de terminaison privé fonctionne, vous devez ajouter VNet-Fin comme règle de réseau virtuel sur le pare-feu du stockage.
    - id: s3
      text:
        en: An application on the internet that has a valid SAS token is refused by stnwinvoices.
        fr: Une application sur Internet qui dispose d'un jeton SAS valide est refusée par stnwinvoices.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The storage firewall controls only the public endpoint. Traffic from the virtual network of an approved private endpoint is always allowed, even when public network access is disabled, so no virtual network rule is needed. With public network access disabled, connections to the public endpoint are rejected whatever the credentials, including a valid SAS.
    fr: |
      Le pare-feu du stockage ne contrôle que le point de terminaison public. Le trafic provenant du réseau virtuel d'un point de terminaison privé approuvé est toujours autorisé, même quand l'accès réseau public est désactivé : aucune règle de réseau virtuel n'est nécessaire. Avec l'accès réseau public désactivé, les connexions au point de terminaison public sont rejetées quelles que soient les informations d'identification, y compris une SAS valide.
references:
  - title: Use private endpoints for Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
  - title: Azure Private Endpoint private DNS zone values
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
