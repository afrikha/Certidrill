id: az700-4b-sec-enable-impact
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has a subnet named **Subnet-Prod** that hosts production virtual machines. The applications on the virtual machines keep long-lived connections to Azure Storage.

    You plan to enable the Microsoft.Storage service endpoint on Subnet-Prod. You need to identify the impact of the change on the running applications so that you can plan a maintenance window.

    What should you expect when you enable the service endpoint?
  fr: |
    Tailspin dispose d'un sous-réseau nommé **Subnet-Prod** qui héberge des machines virtuelles de production. Les applications de ces machines virtuelles maintiennent des connexions de longue durée vers Stockage Azure.

    Vous prévoyez d'activer le point de terminaison de service Microsoft.Storage sur Subnet-Prod. Vous devez identifier l'impact du changement sur les applications en cours d'exécution pour planifier une fenêtre de maintenance.

    À quoi devez-vous vous attendre quand vous activez le point de terminaison de service ?
body:
  options:
    - { id: a, text: { en: "The virtual machines in Subnet-Prod restart to apply the new network configuration.", fr: "Les machines virtuelles de Subnet-Prod redémarrent pour appliquer la nouvelle configuration réseau." } }
    - { id: b, text: { en: "The open TCP connections from Subnet-Prod to Azure Storage are closed and must be reestablished.", fr: "Les connexions TCP ouvertes de Subnet-Prod vers Stockage Azure sont fermées et doivent être rétablies." } }
    - { id: c, text: { en: "The private IP addresses of the virtual machines in Subnet-Prod are reassigned.", fr: "Les adresses IP privées des machines virtuelles de Subnet-Prod sont réattribuées." } }
    - { id: d, text: { en: "The DNS records of the storage accounts are updated, and clients must flush their DNS cache.", fr: "Les enregistrements DNS des comptes de stockage sont mis à jour, et les clients doivent vider leur cache DNS." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When a service endpoint is enabled or disabled, the source address of the subnet's service traffic switches between public and private, so existing TCP connections from the subnet to the service are closed. Microsoft recommends making the change when no critical task runs and making sure applications reconnect automatically.
    fr: |
      Quand un point de terminaison de service est activé ou désactivé, l'adresse source du trafic du sous-réseau vers le service bascule entre publique et privée : les connexions TCP existantes du sous-réseau vers le service sont donc fermées. Microsoft recommande d'effectuer le changement quand aucune tâche critique ne s'exécute et de s'assurer que les applications se reconnectent automatiquement.
  options:
    a: { en: "A service endpoint is a subnet property; enabling it doesn't restart the virtual machines.", fr: "Un point de terminaison de service est une propriété du sous-réseau ; son activation ne redémarre pas les machines virtuelles." }
    c: { en: "The virtual machines keep their addresses; only the source address used toward the service changes from public to private.", fr: "Les machines virtuelles gardent leurs adresses ; seule l'adresse source utilisée vers le service passe de publique à privée." }
    d: { en: "DNS entries of Azure services don't change with a service endpoint; they still resolve to public IP addresses.", fr: "Les entrées DNS des services Azure ne changent pas avec un point de terminaison de service ; elles sont toujours résolues en adresses IP publiques." }
references:
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
