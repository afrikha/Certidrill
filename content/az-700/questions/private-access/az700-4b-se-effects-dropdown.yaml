id: az700-4b-se-effects-dropdown
objective: "4.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind has a virtual machine named **VM1** in a subnet named **Subnet1** in the West Europe region. Subnet1 is associated with a NAT gateway that has the public IP address 20.50.10.5. VM1 has the private IP address 10.1.1.4 and uses Azure-provided DNS.

    You enable the Microsoft.Storage service endpoint on Subnet1. VM1 then connects to a storage account named **stnorthwind** in West Europe.

    How does the service endpoint affect the traffic? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'une machine virtuelle nommée **VM1** dans un sous-réseau nommé **Subnet1**, dans la région West Europe. Subnet1 est associé à une passerelle NAT dont l'adresse IP publique est 20.50.10.5. VM1 a l'adresse IP privée 10.1.1.4 et utilise le DNS fourni par Azure.

    Vous activez le point de terminaison de service Microsoft.Storage sur Subnet1. VM1 se connecte ensuite à un compte de stockage nommé **stnorthwind**, situé en West Europe.

    Quel est l'effet du point de terminaison de service sur le trafic ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      From VM1, `stnorthwind.blob.core.windows.net` resolves to: [[dns]]

      Source address of VM1's requests in the stnorthwind logs: [[src]]

      Next hop type of the storage prefixes in the effective routes of VM1: [[hop]]
    fr: |
      Depuis VM1, `stnorthwind.blob.core.windows.net` est résolu en : [[dns]]

      Adresse source des requêtes de VM1 dans les journaux de stnorthwind : [[src]]

      Type de tronçon suivant des préfixes du stockage dans les itinéraires effectifs de VM1 : [[hop]]
  slots:
    - id: dns
      options:
        - { id: pub, text: { en: "A public IP address of Azure Storage", fr: "Une adresse IP publique de Stockage Azure" } }
        - { id: priv, text: { en: "A private IP address from Subnet1", fr: "Une adresse IP privée de Subnet1" } }
        - { id: nx, text: { en: "No address (NXDOMAIN)", fr: "Aucune adresse (NXDOMAIN)" } }
    - id: src
      options:
        - { id: nat, text: "20.50.10.5" }
        - { id: vm, text: "10.1.1.4" }
        - { id: wire, text: "168.63.129.16" }
    - id: hop
      options:
        - { id: inet, text: Internet }
        - { id: vnet, text: { en: "Virtual network", fr: "Réseau virtuel" } }
        - { id: sep, text: VirtualNetworkServiceEndpoint }
answer:
  values: { dns: pub, src: vm, hop: sep }
explanation:
  correct:
    en: |
      A service endpoint doesn't change DNS, so the name still resolves to the public IP address of the service. Traffic from the subnet switches from a public source to the private IPv4 address of the client, which the service records together with the subnet identity; the NAT gateway is no longer used for this traffic. The endpoint adds routes for the service prefixes with the next hop type VirtualNetworkServiceEndpoint.
    fr: |
      Un point de terminaison de service ne modifie pas le DNS : le nom est toujours résolu en adresse IP publique du service. Le trafic du sous-réseau passe d'une source publique à l'adresse IPv4 privée du client, que le service enregistre avec l'identité du sous-réseau ; la passerelle NAT n'est plus utilisée pour ce trafic. Le point de terminaison ajoute pour les préfixes du service des itinéraires de type de tronçon suivant VirtualNetworkServiceEndpoint.
  options:
    priv: { en: "Only a private endpoint gives the service an address from your subnet.", fr: "Seul un point de terminaison privé donne au service une adresse de votre sous-réseau." }
    nat: { en: "With the service endpoint, storage traffic no longer leaves through the NAT gateway's public address.", fr: "Avec le point de terminaison de service, le trafic de stockage ne sort plus par l'adresse publique de la passerelle NAT." }
references:
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
