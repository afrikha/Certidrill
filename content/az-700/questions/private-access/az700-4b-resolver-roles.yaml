id: az700-4b-resolver-roles
objective: "4.1.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind is designing hybrid name resolution between its on-premises network and a hub virtual network that contains private endpoints. The design uses Azure DNS Private Resolver and private DNS zones.

    You need to identify the component that performs each function.

    Which component should you use for each function? To answer, drag the appropriate components to the correct functions. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind conçoit la résolution de noms hybride entre son réseau local et un réseau virtuel hub qui contient des points de terminaison privés. La conception utilise Azure DNS Private Resolver et des zones DNS privées.

    Vous devez identifier le composant qui assure chaque fonction.

    Quel composant devez-vous utiliser pour chaque fonction ? Pour répondre, faites glisser les composants appropriés vers les fonctions correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: inbound, text: { en: "Inbound endpoint", fr: "Point de terminaison entrant" } }
    - { id: outbound, text: { en: "Outbound endpoint", fr: "Point de terminaison sortant" } }
    - { id: ruleset, text: { en: "DNS forwarding ruleset", fr: "Ensemble de règles de transfert DNS" } }
    - { id: link, text: { en: "Virtual network link", fr: "Lien de réseau virtuel" } }
    - { id: zonegroup, text: { en: "Private DNS zone group", fr: "Groupe de zones DNS privées" } }
    - { id: autoreg, text: { en: "Autoregistration", fr: "Inscription automatique" } }
  targets:
    - id: t1
      text: { en: "Provides the IP address that on-premises conditional forwarders target", fr: "Fournit l'adresse IP ciblée par les redirecteurs conditionnels locaux" } 
    - id: t2
      text: { en: "Maps on-premises domain names to the IP addresses of on-premises DNS servers", fr: "Associe des noms de domaine locaux aux adresses IP de serveurs DNS locaux" }
    - id: t3
      text: { en: "Makes the records of a privatelink zone visible to Azure DNS queries from the hub virtual network", fr: "Rend les enregistrements d'une zone privatelink visibles pour les requêtes Azure DNS issues du réseau virtuel hub" }
    - id: t4
      text: { en: "Creates and deletes the A record of a private endpoint together with the endpoint", fr: "Crée et supprime l'enregistrement A d'un point de terminaison privé en même temps que le point de terminaison" }
answer:
  mapping: { t1: inbound, t2: ruleset, t3: link, t4: zonegroup }
explanation:
  correct:
    en: |
      The inbound endpoint receives queries that enter Azure, so on-premises conditional forwarders point to its IP address. A DNS forwarding ruleset holds the rules (domain name, target DNS servers) used by an outbound endpoint for queries leaving Azure. A virtual network link lets Azure DNS answer from a private zone for queries from that network. A private DNS zone group on the private endpoint manages its A record for its whole lifetime.
    fr: |
      Le point de terminaison entrant reçoit les requêtes qui entrent dans Azure : les redirecteurs conditionnels locaux pointent donc vers son adresse IP. Un ensemble de règles de transfert DNS contient les règles (nom de domaine, serveurs DNS cibles) qu'utilise un point de terminaison sortant pour les requêtes qui sortent d'Azure. Un lien de réseau virtuel permet à Azure DNS de répondre depuis une zone privée aux requêtes de ce réseau. Un groupe de zones DNS privées sur le point de terminaison privé gère son enregistrement A pendant toute sa durée de vie.
  options:
    outbound: { en: "The outbound endpoint is where forwarded queries leave Azure; the rules that map domains to servers are in the ruleset.", fr: "Le point de terminaison sortant est l'endroit par lequel les requêtes transférées sortent d'Azure ; les règles qui associent domaines et serveurs se trouvent dans l'ensemble de règles." }
    autoreg: { en: "Autoregistration creates records for virtual machines, not for private endpoints.", fr: "L'inscription automatique crée des enregistrements pour les machines virtuelles, pas pour les points de terminaison privés." }
references:
  - title: Azure DNS Private Resolver Overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
  - title: Azure Private Endpoint DNS Integration Scenarios
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
