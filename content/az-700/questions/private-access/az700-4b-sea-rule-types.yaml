id: az700-4b-sea-rule-types
objective: "4.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a storage account named **stfabreports**. Public network access is set to **Enabled from selected virtual networks and IP addresses**.

    You need to configure the network settings of stfabreports to allow each of the following sources, and nothing more.

    Which setting should you use for each source? To answer, drag the appropriate settings to the correct sources. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un compte de stockage nommé **stfabreports**. L'accès réseau public a la valeur **Enabled from selected virtual networks and IP addresses**.

    Vous devez configurer les paramètres réseau de stfabreports pour autoriser chacune des sources suivantes, et rien de plus.

    Quel paramètre devez-vous utiliser pour chaque source ? Pour répondre, faites glisser les paramètres appropriés vers les sources correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vnet, text: { en: "Virtual network rule", fr: "Règle de réseau virtuel" } }
    - { id: ip, text: { en: "IP network rule", fr: "Règle de réseau IP" } }
    - { id: instance, text: { en: "Resource instance rule", fr: "Règle d'instance de ressource" } }
    - { id: trusted, text: { en: "Allow Azure services on the trusted services list to access this storage account", fr: "Allow Azure services on the trusted services list to access this storage account" } }
    - { id: sep, text: { en: "Service endpoint policy", fr: "Stratégie de point de terminaison de service" } }
    - { id: pe, text: { en: "Private endpoint", fr: "Point de terminaison privé" } }
  targets:
    - id: t1
      text: { en: "Virtual machines in a subnet that has the Microsoft.Storage service endpoint enabled", fr: "Machines virtuelles d'un sous-réseau sur lequel le point de terminaison de service Microsoft.Storage est activé" }
    - id: t2
      text: { en: "Users at a partner site whose internet traffic leaves from the public range 198.51.100.0/24", fr: "Utilisateurs d'un site partenaire dont le trafic internet sort depuis la plage publique 198.51.100.0/24" }
    - id: t3
      text: { en: "One specific Azure resource in the same tenant that can't be isolated by virtual network or IP rules; other resources of the same type must stay blocked", fr: "Une ressource Azure précise du même locataire, qui ne peut pas être isolée par des règles de réseau virtuel ou IP ; les autres ressources du même type doivent rester bloquées" }
    - id: t4
      text: { en: "Azure services that use strong authentication and must read logs and metrics of the account", fr: "Services Azure qui utilisent une authentification forte et doivent lire les journaux et les métriques du compte" }
answer:
  mapping: { t1: vnet, t2: ip, t3: instance, t4: trusted }
explanation:
  correct:
    en: |
      A virtual network rule allows a subnet that has a storage service endpoint. An IP network rule allows a public IPv4 address or range. A resource instance rule allows one resource instance, identified by its resource ID, in the same tenant, and its role assignments decide what it can do. The trusted services exception lets the Azure services of the trusted list, which use strong authentication, reach the account, for example to read logs and metrics.
    fr: |
      Une règle de réseau virtuel autorise un sous-réseau doté d'un point de terminaison de service de stockage. Une règle de réseau IP autorise une adresse ou une plage IPv4 publique. Une règle d'instance de ressource autorise une instance de ressource, identifiée par son ID de ressource, dans le même locataire, et ses attributions de rôles déterminent ce qu'elle peut faire. L'exception des services approuvés permet aux services Azure de la liste approuvée, qui utilisent une authentification forte, d'atteindre le compte, par exemple pour lire les journaux et les métriques.
  options:
    sep: { en: "A service endpoint policy filters which accounts a subnet can reach; it's configured on the subnet, not on the storage account.", fr: "Une stratégie de point de terminaison de service filtre les comptes qu'un sous-réseau peut atteindre ; elle se configure sur le sous-réseau, pas sur le compte de stockage." }
    pe: { en: "A private endpoint adds a private path; it isn't a setting that allows a source on the public endpoint.", fr: "Un point de terminaison privé ajoute un chemin privé ; ce n'est pas un paramètre qui autorise une source sur le point de terminaison public." }
references:
  - title: Firewall rules and network access for Azure Blob, Data Lake, Queue, and Table Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
