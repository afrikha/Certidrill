id: az700-4b-pls-partner-onprem-dns
objective: "4.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam publishes an order API by using a Private Link service named **pls-orders**. pls-orders uses the frontend IP configuration of an internal Standard load balancer in a Fabrikam virtual network whose address space is 10.0.0.0/16. Fabrikam has shared the alias of pls-orders with Contoso.

    Contoso has the following environment:

    - An on-premises datacenter whose address space is 10.0.0.0/16.
    - A virtual network named **VNet-Hub** (172.16.0.0/16) connected to the datacenter by ExpressRoute private peering.
    - On-premises DNS servers that host the zone `partners.contoso.com`.

    You need to ensure that on-premises Contoso servers can call the API by using the name `orders.partners.contoso.com`. The traffic must not traverse the internet.

    What should you do?
  fr: |
    Fabrikam publie une API de commandes à l'aide d'un service Private Link nommé **pls-orders**. pls-orders utilise la configuration IP frontale d'un équilibreur de charge interne Standard situé dans un réseau virtuel Fabrikam dont l'espace d'adressage est 10.0.0.0/16. Fabrikam a communiqué l'alias de pls-orders à Contoso.

    Contoso dispose de l'environnement suivant :

    - Un centre de données local dont l'espace d'adressage est 10.0.0.0/16.
    - Un réseau virtuel nommé **VNet-Hub** (172.16.0.0/16) relié au centre de données par le peering privé ExpressRoute.
    - Des serveurs DNS locaux qui hébergent la zone `partners.contoso.com`.

    Vous devez faire en sorte que les serveurs locaux de Contoso puissent appeler l'API avec le nom `orders.partners.contoso.com`. Le trafic ne doit pas passer par Internet.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Peer VNet-Hub with the Fabrikam virtual network, and create an A record for orders that points to the frontend IP address of the load balancer.", fr: "Créer un peering entre VNet-Hub et le réseau virtuel de Fabrikam, et créer un enregistrement A orders qui pointe vers l'adresse IP frontale de l'équilibreur de charge." } }
    - { id: b, text: { en: "Create a private endpoint in VNet-Hub that connects to the alias of pls-orders, and create an A record for orders that points to a NAT IP address of pls-orders.", fr: "Créer dans VNet-Hub un point de terminaison privé qui se connecte à l'alias de pls-orders, et créer un enregistrement A orders qui pointe vers une adresse IP NAT de pls-orders." } }
    - { id: c, text: { en: "Create a site-to-site VPN from the datacenter to the Fabrikam virtual network, and create an A record for orders that points to the frontend IP address of the load balancer.", fr: "Créer un VPN de site à site entre le centre de données et le réseau virtuel de Fabrikam, et créer un enregistrement A orders qui pointe vers l'adresse IP frontale de l'équilibreur de charge." } }
    - { id: d, text: { en: "Create a private endpoint in VNet-Hub that connects to the alias of pls-orders, and create an A record for orders that points to the private IP address of the private endpoint.", fr: "Créer dans VNet-Hub un point de terminaison privé qui se connecte à l'alias de pls-orders, et créer un enregistrement A orders qui pointe vers l'adresse IP privée du point de terminaison privé." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The consumer creates a private endpoint in its own network with the alias; once Fabrikam approves the connection, on-premises clients reach the endpoint over ExpressRoute because its address belongs to VNet-Hub. Private Link applies NAT on the provider side, so the overlapping 10.0.0.0/16 ranges don't conflict. A Private Link service has no recommended privatelink zone, so you publish the chosen name as an A record that points to the private endpoint IP address.
    fr: |
      Le consommateur crée un point de terminaison privé dans son propre réseau avec l'alias ; une fois la connexion approuvée par Fabrikam, les clients locaux atteignent le point de terminaison via ExpressRoute, car son adresse appartient à VNet-Hub. Private Link applique une NAT côté fournisseur : les plages 10.0.0.0/16 qui se chevauchent n'entrent donc pas en conflit. Un service Private Link n'a pas de zone privatelink recommandée : vous publiez le nom choisi sous forme d'enregistrement A qui pointe vers l'adresse IP du point de terminaison privé.
  options:
    a: { en: "The on-premises range overlaps the Fabrikam address space, so on-premises servers can't route traffic for 10.0.0.0/16 to the Fabrikam network through VNet-Hub.", fr: "La plage locale chevauche l'espace d'adressage de Fabrikam : les serveurs locaux ne peuvent pas router le trafic destiné à 10.0.0.0/16 vers le réseau de Fabrikam via VNet-Hub." }
    b: { en: "The NAT IP addresses belong to the provider's subnet; clients always connect to the private endpoint, never to the NAT addresses.", fr: "Les adresses IP NAT appartiennent au sous-réseau du fournisseur ; les clients se connectent toujours au point de terminaison privé, jamais aux adresses NAT." }
    c: { en: "Both sides use 10.0.0.0/16, so a VPN between them can't route the traffic.", fr: "Les deux côtés utilisent 10.0.0.0/16 : un VPN entre eux ne peut pas router le trafic." }
references:
