id: az700-4b-sec-storage-global
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip has the following resources:

    | Resource | Type | Region |
    | --- | --- | --- |
    | VNet-FR | Virtual network with a subnet named Subnet1 | France Central |
    | stwingtipweu | Storage account (general-purpose v2) | West Europe |

    No service endpoint is enabled on Subnet1. You plan to add a virtual network rule for Subnet1 to stwingtipweu and to set its default action to Deny.

    You need to ensure that virtual machines in Subnet1 can access stwingtipweu after the change. The solution must not add any resource.

    Which service endpoint configuration should you use on Subnet1?
  fr: |
    Wingtip dispose des ressources suivantes :

    | Ressource | Type | Région |
    | --- | --- | --- |
    | VNet-FR | Réseau virtuel avec un sous-réseau nommé Subnet1 | France Central |
    | stwingtipweu | Compte de stockage (v2 à usage général) | West Europe |

    Aucun point de terminaison de service n'est activé sur Subnet1. Vous prévoyez d'ajouter à stwingtipweu une règle de réseau virtuel pour Subnet1 et de définir son action par défaut sur Deny.

    Vous devez faire en sorte que les machines virtuelles de Subnet1 puissent accéder à stwingtipweu après ce changement. La solution ne doit ajouter aucune ressource.

    Quelle configuration de point de terminaison de service devez-vous utiliser sur Subnet1 ?
body:
  options:
    - { id: a, text: { en: "Enable the Microsoft.Storage service endpoint only", fr: "Activer uniquement le point de terminaison de service Microsoft.Storage" } }
    - { id: b, text: { en: "Enable the Microsoft.Storage.Global service endpoint only", fr: "Activer uniquement le point de terminaison de service Microsoft.Storage.Global" } }
    - { id: c, text: { en: "Enable both the Microsoft.Storage and Microsoft.Storage.Global service endpoints", fr: "Activer les points de terminaison de service Microsoft.Storage et Microsoft.Storage.Global" } }
    - { id: d, text: { en: "Enable the Microsoft.Storage service endpoint, and add the range of Subnet1 as an IP network rule", fr: "Activer le point de terminaison de service Microsoft.Storage, et ajouter la plage de Subnet1 comme règle de réseau IP" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Microsoft.Storage endpoint covers storage accounts in the same region as the virtual network, while Microsoft.Storage.Global covers accounts in any region. France Central and West Europe are different regions, so Subnet1 needs Microsoft.Storage.Global for its traffic to reach stwingtipweu with the subnet identity that the virtual network rule checks.
    fr: |
      Le point de terminaison Microsoft.Storage couvre les comptes de stockage de la même région que le réseau virtuel, tandis que Microsoft.Storage.Global couvre les comptes de toutes les régions. France Central et West Europe sont des régions différentes : Subnet1 a besoin de Microsoft.Storage.Global pour que son trafic atteigne stwingtipweu avec l'identité de sous-réseau que vérifie la règle de réseau virtuel.
  options:
    a: { en: "Microsoft.Storage applies to storage accounts in the region of the virtual network (France Central), not to an account in West Europe.", fr: "Microsoft.Storage s'applique aux comptes de stockage de la région du réseau virtuel (France Central), pas à un compte en West Europe." }
    c: { en: "A subnet can have only one of the two storage endpoint types.", fr: "Un sous-réseau ne peut avoir qu'un seul des deux types de point de terminaison de stockage." }
    d: { en: "IP network rules accept only public internet addresses; the private range of Subnet1 is rejected, and Microsoft.Storage still doesn't cover West Europe.", fr: "Les règles de réseau IP n'acceptent que des adresses internet publiques ; la plage privée de Subnet1 est refusée, et Microsoft.Storage ne couvre toujours pas West Europe." }
references:
  - title: Firewall rules and network access for Azure Blob, Data Lake, Queue, and Table Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
