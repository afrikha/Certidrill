difficulty: 1
status: draft
stem:
  en: You associate a service endpoint policy that lists stproddata with Subnet1.
  fr: Vous associez à Subnet1 une stratégie de point de terminaison de service qui répertorie stproddata.
body:
  solution:
    en: |
      You create a service endpoint policy in Sub1 in the West Europe region. You add a policy definition for the `Microsoft.Storage` service that contains the resource ID of stproddata, and you associate the policy with Subnet1.
    fr: |
      Vous créez une stratégie de point de terminaison de service dans Sub1, dans la région West Europe. Vous ajoutez une définition de stratégie pour le service `Microsoft.Storage` qui contient l'ID de ressource de stproddata, puis vous associez la stratégie à Subnet1.
answer: { value: true }
explanation:
  correct:
    en: |
      Service endpoint policies are allow policies: once a policy is applied to a subnet, only the storage accounts it lists can be reached over the service endpoint, and access to every other account is denied. The policy must be in the same region and subscription as the virtual network, which is the case here.
    fr: |
      Les stratégies de point de terminaison de service sont des stratégies d'autorisation : une fois qu'une stratégie est appliquée à un sous-réseau, seuls les comptes de stockage qu'elle répertorie sont joignables par le point de terminaison de service, et l'accès à tout autre compte est refusé. La stratégie doit se trouver dans la même région et le même abonnement que le réseau virtuel, ce qui est le cas ici.
references:
  - title: Azure virtual network service endpoint policies
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoint-policies-overview
