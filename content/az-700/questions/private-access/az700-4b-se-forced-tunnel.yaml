id: az700-4b-se-forced-tunnel
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a virtual network named **VNet1** in the North Europe region. A subnet named **Subnet1** is associated with a route table that contains a route for 0.0.0.0/0 with the next hop type **Virtual network gateway**. All internet traffic from Subnet1 is forced through the site-to-site VPN to an on-premises proxy.

    Virtual machines in Subnet1 upload large files to a storage account named **stproseware** in North Europe. The uploads are slow because they go through the on-premises network.

    You need to ensure that traffic from Subnet1 to stproseware uses the Azure backbone directly and that stproseware accepts connections only from Subnet1. Other internet traffic must still go through the on-premises proxy. The solution must minimize costs.

    What should you do?
  fr: |
    Proseware dispose d'un réseau virtuel nommé **VNet1** dans la région North Europe. Un sous-réseau nommé **Subnet1** est associé à une table de routage qui contient un itinéraire pour 0.0.0.0/0 avec le type de tronçon suivant **Passerelle de réseau virtuel**. Tout le trafic internet de Subnet1 est forcé vers un proxy local via le VPN de site à site.

    Des machines virtuelles de Subnet1 chargent des fichiers volumineux dans un compte de stockage nommé **stproseware**, situé en North Europe. Les chargements sont lents, car ils transitent par le réseau local.

    Vous devez faire en sorte que le trafic de Subnet1 vers stproseware emprunte directement le réseau principal Azure et que stproseware n'accepte les connexions que de Subnet1. Le reste du trafic internet doit toujours passer par le proxy local. La solution doit réduire les coûts au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable a Microsoft.Storage service endpoint on Subnet1, and add a virtual network rule for Subnet1 to stproseware.", fr: "Activer un point de terminaison de service Microsoft.Storage sur Subnet1, et ajouter une règle de réseau virtuel pour Subnet1 à stproseware." } }
    - { id: b, text: { en: "Associate a NAT gateway with Subnet1, and add an IP network rule for its public IP address to stproseware.", fr: "Associer une passerelle NAT à Subnet1, et ajouter une règle de réseau IP pour son adresse IP publique à stproseware." } }
    - { id: c, text: { en: "Add a route for the Storage service tag with the next hop type Internet, and add an IP network rule for Subnet1 to stproseware.", fr: "Ajouter un itinéraire pour l'étiquette de service Storage avec le type de tronçon suivant Internet, et ajouter une règle de réseau IP pour Subnet1 à stproseware." } }
    - { id: d, text: { en: "Create a private endpoint for stproseware in Subnet1, and set public network access of stproseware to Disabled.", fr: "Créer un point de terminaison privé pour stproseware dans Subnet1, et définir l'accès réseau public de stproseware sur Disabled." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A service endpoint adds routes with the next hop type VirtualNetworkServiceEndpoint for the storage prefixes, and these routes override user-defined and BGP routes. Storage traffic therefore leaves directly over the backbone while forced tunneling still applies to other internet traffic, and the virtual network rule restricts stproseware to Subnet1. Service endpoints are free.
    fr: |
      Un point de terminaison de service ajoute des itinéraires de type de tronçon suivant VirtualNetworkServiceEndpoint pour les préfixes du stockage, et ces itinéraires l'emportent sur les itinéraires définis par l'utilisateur et BGP. Le trafic de stockage part donc directement sur le réseau principal tandis que le tunneling forcé continue de s'appliquer au reste du trafic internet, et la règle de réseau virtuel limite stproseware à Subnet1. Les points de terminaison de service sont gratuits.
  options:
    b: { en: "The 0.0.0.0/0 user-defined route to the gateway still takes the traffic, and IP rules don't apply to requests from the same region as the account.", fr: "L'itinéraire défini par l'utilisateur 0.0.0.0/0 vers la passerelle prend toujours le trafic, et les règles IP ne s'appliquent pas aux requêtes de la même région que le compte." }
    c: { en: "IP network rules accept only public addresses, so they can't identify Subnet1, and the account would stay open to every other source.", fr: "Les règles de réseau IP n'acceptent que des adresses publiques : elles ne peuvent pas identifier Subnet1, et le compte resterait ouvert à toutes les autres sources." }
    d: { en: "A private endpoint meets the routing and access needs, but it's billed per hour and per GB, so it doesn't minimize costs.", fr: "Un point de terminaison privé répond aux besoins de routage et d'accès, mais il est facturé à l'heure et au Go : il ne réduit pas les coûts au minimum." }
references:
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
