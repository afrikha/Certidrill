id: az700-4b-se-pe-pls-match
objective: "4.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is planning network access for several workloads.

    You need to recommend a solution for each requirement. Each solution must meet its requirement at the lowest cost.

    Which solution should you recommend for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam planifie l'accès réseau de plusieurs charges de travail.

    Vous devez recommander une solution pour chaque exigence. Chaque solution doit répondre à son exigence au coût le plus bas.

    Quelle solution devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: se, text: { en: "Service endpoint", fr: "Point de terminaison de service" } }
    - { id: pe, text: { en: "Private endpoint", fr: "Point de terminaison privé" } }
    - { id: pls, text: { en: "Private Link service", fr: "Service Private Link" } }
    - { id: nat, text: { en: "NAT gateway", fr: "Passerelle NAT" } }
    - { id: sep, text: { en: "Service endpoint policy", fr: "Stratégie de point de terminaison de service" } }
  targets:
    - id: t1
      text: { en: "Only VMs in a subnet of an Azure virtual network may use a storage account in the same region; DNS must not change.", fr: "Seules les machines virtuelles d'un sous-réseau d'un réseau virtuel Azure peuvent utiliser un compte de stockage de la même région ; le DNS ne doit pas changer." }
    - id: t2
      text: { en: "On-premises servers connected by ExpressRoute private peering must reach a key vault by using a private IP address.", fr: "Des serveurs locaux reliés par le peering privé ExpressRoute doivent atteindre un coffre de clés avec une adresse IP privée." }
    - id: t3
      text: { en: "Public network access of an Azure SQL logical server must be disabled while VMs in Azure keep access.", fr: "L'accès réseau public d'un serveur logique Azure SQL doit être désactivé, tandis que les machines virtuelles d'Azure gardent l'accès." }
    - id: t4
      text: { en: "An internal application behind a Standard load balancer must be offered privately to a partner whose address space overlaps.", fr: "Une application interne derrière un équilibreur de charge Standard doit être proposée de façon privée à un partenaire dont l'espace d'adressage se chevauche." }
answer:
  mapping: { t1: se, t2: pe, t3: pe, t4: pls }
explanation:
  correct:
    en: |
      A service endpoint is free, keeps DNS unchanged and lets the storage account allow one subnet. Clients on-premises can't use service endpoints, but they reach a private endpoint over ExpressRoute private peering. When public network access is disabled, the public endpoint is closed and only private endpoints remain. A Private Link service publishes your own application behind a Standard load balancer, with NAT that tolerates overlapping address spaces.
    fr: |
      Un point de terminaison de service est gratuit, ne change pas le DNS et permet au compte de stockage d'autoriser un sous-réseau. Les clients locaux ne peuvent pas utiliser les points de terminaison de service, mais ils atteignent un point de terminaison privé via le peering privé ExpressRoute. Quand l'accès réseau public est désactivé, le point de terminaison public est fermé et seuls les points de terminaison privés restent utilisables. Un service Private Link publie votre propre application derrière un équilibreur de charge Standard, avec une NAT qui tolère des espaces d'adressage qui se chevauchent.
  options:
    nat: { en: "A NAT gateway provides outbound internet connectivity; it doesn't restrict who can access a service.", fr: "Une passerelle NAT fournit une connectivité internet sortante ; elle ne limite pas qui peut accéder à un service." }
    sep: { en: "A service endpoint policy filters which storage accounts a subnet can reach; it doesn't provide access by itself.", fr: "Une stratégie de point de terminaison de service filtre les comptes de stockage qu'un sous-réseau peut atteindre ; elle ne fournit pas d'accès à elle seule." }
references:
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
