id: az700-4b-onprem-forward-public-zone
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an on-premises datacenter connected to a virtual network named **VNet-Hub** (West Europe, 10.10.0.0/16) by a site-to-site VPN. The on-premises DNS servers run Windows Server.

    VNet-Hub contains the following resources:

    | Resource | Configuration |
    | --- | --- |
    | pe-stcontosofin | Private endpoint for the `blob` subresource of the storage account **stcontosofin** |
    | privatelink.blob.core.windows.net | Private DNS zone linked to VNet-Hub, with an A record for stcontosofin |
    | dnspr-hub | Azure DNS Private Resolver with an inbound endpoint that uses the IP address 10.10.4.4 |

    On-premises applications connect to `https://stcontosofin.blob.core.windows.net`. You need to ensure that the applications resolve the name to the private IP address of pe-stcontosofin. Name resolution of other storage accounts must not be affected.

    What should you configure on the on-premises DNS servers?
  fr: |
    Contoso dispose d'un centre de données local relié à un réseau virtuel nommé **VNet-Hub** (West Europe, 10.10.0.0/16) par un VPN de site à site. Les serveurs DNS locaux exécutent Windows Server.

    VNet-Hub contient les ressources suivantes :

    | Ressource | Configuration |
    | --- | --- |
    | pe-stcontosofin | Point de terminaison privé pour la sous-ressource `blob` du compte de stockage **stcontosofin** |
    | privatelink.blob.core.windows.net | Zone DNS privée liée à VNet-Hub, avec un enregistrement A pour stcontosofin |
    | dnspr-hub | Azure DNS Private Resolver avec un point de terminaison entrant qui utilise l'adresse IP 10.10.4.4 |

    Les applications locales se connectent à `https://stcontosofin.blob.core.windows.net`. Vous devez faire en sorte que les applications résolvent ce nom en l'adresse IP privée de pe-stcontosofin. La résolution de noms des autres comptes de stockage ne doit pas être affectée.

    Que devez-vous configurer sur les serveurs DNS locaux ?
body:
  options:
    - { id: a, text: { en: "A conditional forwarder for blob.core.windows.net that targets 168.63.129.16", fr: "Un redirecteur conditionnel pour blob.core.windows.net qui cible 168.63.129.16" } }
    - { id: b, text: { en: "A primary zone named blob.core.windows.net that contains an A record for stcontosofin", fr: "Une zone principale nommée blob.core.windows.net qui contient un enregistrement A pour stcontosofin" } }
    - { id: c, text: { en: "A conditional forwarder for blob.core.windows.net that targets 10.10.4.4", fr: "Un redirecteur conditionnel pour blob.core.windows.net qui cible 10.10.4.4" } }
    - { id: d, text: { en: "A conditional forwarder for privatelink.blob.core.windows.net that targets 168.63.129.16", fr: "Un redirecteur conditionnel pour privatelink.blob.core.windows.net qui cible 168.63.129.16" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The inbound endpoint of the DNS Private Resolver receives queries from on-premises and resolves them with Azure DNS from VNet-Hub, which is linked to the private zone. Microsoft requires the conditional forwarder to use the public zone name (blob.core.windows.net), because applications query the public name and Azure returns a CNAME to the privatelink name, which the private zone then answers with the private IP address.
    fr: |
      Le point de terminaison entrant du résolveur DNS privé reçoit les requêtes du réseau local et les résout avec Azure DNS depuis VNet-Hub, qui est lié à la zone privée. Microsoft demande que le redirecteur conditionnel utilise le nom de la zone publique (blob.core.windows.net), car les applications interrogent le nom public et Azure renvoie un CNAME vers le nom privatelink, auquel la zone privée répond ensuite avec l'adresse IP privée.
  options:
    a: { en: "168.63.129.16 is reachable only from inside Azure virtual networks; on-premises DNS servers can't send queries to it over the VPN.", fr: "168.63.129.16 n'est joignable que depuis des réseaux virtuels Azure ; les serveurs DNS locaux ne peuvent pas l'interroger via le VPN." }
    b: { en: "A local zone named after the public name would make every other storage account unresolvable from on-premises.", fr: "Une zone locale portant le nom public rendrait tous les autres comptes de stockage impossibles à résoudre depuis le réseau local." }
    d: { en: "The target is unreachable from on-premises, and the forwarder must use the public zone name, not the privatelink name.", fr: "La cible n'est pas joignable depuis le réseau local, et le redirecteur doit utiliser le nom de la zone publique, pas le nom privatelink." }
references:
  - title: Azure Private Endpoint DNS Integration Scenarios
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
  - title: Azure DNS Private Resolver Overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
