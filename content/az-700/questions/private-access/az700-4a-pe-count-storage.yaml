id: az700-4a-pe-count-storage
objective: "4.1.1"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Contoso has a general-purpose v2 storage account named **stcontosoorders** that uses read-access geo-redundant storage (RA-GRS). Public network access to the account will be disabled.

    An order-processing application in a virtual network named **VNet-App** uses the following services of the account:

    - Blob Storage, including reads from the secondary region during a regional outage
    - Queue Storage
    - Table Storage

    You need to plan private endpoints so that the application can use all these services privately from VNet-App.

    What is the minimum number of private endpoints that you should create?
  fr: |
    Contoso dispose d'un compte de stockage v2 universel nommé **stcontosoorders** qui utilise le stockage géoredondant avec accès en lecture (RA-GRS). L'accès réseau public au compte sera désactivé.

    Une application de traitement des commandes, située dans un réseau virtuel nommé **VNet-App**, utilise les services suivants du compte :

    - Stockage Blob, y compris des lectures depuis la région secondaire pendant une panne régionale
    - Stockage File d'attente
    - Stockage Table

    Vous devez planifier des points de terminaison privés pour que l'application puisse utiliser tous ces services de façon privée depuis VNet-App.

    Quel est le nombre minimal de points de terminaison privés que vous devez créer ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "4" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A private endpoint maps to one target subresource of a storage account, so blob, queue and table each need their own endpoint. Reading from the secondary region of an RA-GRS account requires an additional endpoint for the `blob_secondary` subresource, alongside the primary `blob` endpoint. That makes four private endpoints.
    fr: |
      Un point de terminaison privé correspond à une seule sous-ressource cible d'un compte de stockage ; blob, queue et table ont donc chacun besoin de leur propre point de terminaison. La lecture depuis la région secondaire d'un compte RA-GRS exige un point de terminaison supplémentaire pour la sous-ressource `blob_secondary`, en plus du point de terminaison `blob` principal. Cela fait quatre points de terminaison privés.
  options:
    a: { en: "One private endpoint reaches a single subresource; it can't serve blobs, queues and tables at the same time.", fr: "Un point de terminaison privé n'atteint qu'une sous-ressource ; il ne peut pas servir à la fois les objets blob, les files d'attente et les tables." }
    b: { en: "Two endpoints leave at least two of the required subresources without a private path.", fr: "Deux points de terminaison laissent au moins deux des sous-ressources requises sans chemin privé." }
    c: { en: "Three endpoints cover blob, queue and table, but secondary reads need a separate blob_secondary endpoint.", fr: "Trois points de terminaison couvrent blob, queue et table, mais les lectures secondaires exigent un point de terminaison blob_secondary distinct." }
references:
  - title: Use private endpoints for Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
