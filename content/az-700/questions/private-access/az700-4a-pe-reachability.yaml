id: az700-4a-pe-reachability
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware has the following networks:

    | Network | Connectivity |
    | --- | --- |
    | VNet-Hub (West Europe) | Contains a private endpoint named **PE1** for an Azure SQL Database logical server, and a VPN gateway |
    | VNet-Spoke1 (West Europe) | Peered with VNet-Hub |
    | VNet-Spoke2 (North Europe) | Peered with VNet-Spoke1 only |
    | VNet-Lab (West Europe) | No peering and no gateway |
    | On-premises network | Site-to-site VPN connection to the VPN gateway in VNet-Hub |

    No user-defined routes or network virtual appliances are configured. Name resolution of the SQL server returns the private IP address of PE1 for every client listed below.

    Which two clients can connect to the SQL server through PE1?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose des réseaux suivants :

    | Réseau | Connectivité |
    | --- | --- |
    | VNet-Hub (West Europe) | Contient un point de terminaison privé nommé **PE1** pour un serveur logique Azure SQL Database, ainsi qu'une passerelle VPN |
    | VNet-Spoke1 (West Europe) | Peering avec VNet-Hub |
    | VNet-Spoke2 (North Europe) | Peering avec VNet-Spoke1 uniquement |
    | VNet-Lab (West Europe) | Aucun peering ni aucune passerelle |
    | Réseau local | Connexion VPN de site à site vers la passerelle VPN de VNet-Hub |

    Aucun itinéraire défini par l'utilisateur ni aucune appliance virtuelle réseau ne sont configurés. La résolution du nom du serveur SQL renvoie l'adresse IP privée de PE1 pour chacun des clients ci-dessous.

    Quels sont les deux clients qui peuvent se connecter au serveur SQL via PE1 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A virtual machine in VNet-Spoke1", fr: "Une machine virtuelle de VNet-Spoke1" } }
    - { id: b, text: { en: "A virtual machine in VNet-Spoke2", fr: "Une machine virtuelle de VNet-Spoke2" } }
    - { id: c, text: { en: "A virtual machine in VNet-Lab", fr: "Une machine virtuelle de VNet-Lab" } }
    - { id: d, text: { en: "A server on the on-premises network", fr: "Un serveur du réseau local" } }
    - { id: e, text: { en: "A laptop on the internet that has no VPN connection", fr: "Un ordinateur portable sur Internet sans connexion VPN" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A private endpoint is reachable from its own virtual network, from directly peered virtual networks (regional or global) and from on-premises networks connected over VPN or ExpressRoute. VNet-Spoke1 is directly peered with VNet-Hub, and the on-premises network reaches VNet-Hub through the site-to-site VPN.
    fr: |
      Un point de terminaison privé est accessible depuis son propre réseau virtuel, depuis les réseaux virtuels directement reliés par peering (régional ou mondial) et depuis les réseaux locaux connectés par VPN ou ExpressRoute. VNet-Spoke1 est directement relié à VNet-Hub par peering, et le réseau local atteint VNet-Hub via le VPN de site à site.
  options:
    b: { en: "Peering isn't transitive: VNet-Spoke2 is peered with VNet-Spoke1, not with VNet-Hub, and no NVA or route forwards the traffic.", fr: "Le peering n'est pas transitif : VNet-Spoke2 est relié à VNet-Spoke1, pas à VNet-Hub, et aucune NVA ni aucun itinéraire ne transfère le trafic." }
    c: { en: "VNet-Lab has no network path to VNet-Hub; correct name resolution doesn't create one.", fr: "VNet-Lab n'a aucun chemin réseau vers VNet-Hub ; une résolution de noms correcte n'en crée pas." }
    e: { en: "The private IP address of PE1 isn't routable from the internet.", fr: "L'adresse IP privée de PE1 n'est pas routable depuis Internet." }
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
