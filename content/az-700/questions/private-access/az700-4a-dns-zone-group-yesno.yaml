id: az700-4a-dns-zone-group-yesno
objective: "4.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware has a private endpoint named **PE-KV** for a key vault. PE-KV has a private DNS zone group that references the private DNS zone **privatelink.vaultcore.azure.net**. The zone is linked to the virtual network of PE-KV.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un point de terminaison privé nommé **PE-KV** pour un coffre de clés. PE-KV possède un groupe de zones DNS privées qui référence la zone DNS privée **privatelink.vaultcore.azure.net**. La zone est liée au réseau virtuel de PE-KV.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If you delete PE-KV, the A record that the zone group created in privatelink.vaultcore.azure.net is deleted.
        fr: Si vous supprimez PE-KV, l'enregistrement A créé par le groupe de zones dans privatelink.vaultcore.azure.net est supprimé.
    - id: s2
      text:
        en: You can add a second private DNS zone group to PE-KV.
        fr: Vous pouvez ajouter un second groupe de zones DNS privées à PE-KV.
    - id: s3
      text:
        en: Autoregistration must be enabled on the virtual network link for the zone group to create the A record of PE-KV.
        fr: L'inscription automatique doit être activée sur le lien de réseau virtuel pour que le groupe de zones crée l'enregistrement A de PE-KV.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      A private DNS zone group ties the zone to the private endpoint: it creates and updates the endpoint's records and deletes them when the endpoint is deleted. A private endpoint supports only one zone group, which can reference up to five zones. Autoregistration registers virtual machines of the linked network and isn't used for private endpoint records; Microsoft's examples create the link with registration disabled.
    fr: |
      Un groupe de zones DNS privées associe la zone au point de terminaison privé : il crée et met à jour les enregistrements du point de terminaison et les supprime quand le point de terminaison est supprimé. Un point de terminaison privé ne prend en charge qu'un seul groupe de zones, qui peut référencer jusqu'à cinq zones. L'inscription automatique enregistre les machines virtuelles du réseau lié et ne sert pas aux enregistrements des points de terminaison privés ; les exemples de Microsoft créent le lien avec l'inscription désactivée.
references:
  - title: Azure Private Endpoint DNS integration Scenarios
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
  - title: "Quickstart: Create a private endpoint by using the Azure CLI"
    url: https://learn.microsoft.com/en-us/azure/private-link/create-private-endpoint-cli
