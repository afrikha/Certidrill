id: az700-4a-pe-dfs-subresource
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind has a general-purpose v2 storage account named **stnwlake** with the hierarchical namespace enabled (Data Lake Storage). Public network access to stnwlake is disabled.

    You created a private endpoint for the `blob` subresource of stnwlake in a virtual network named **VNet-Analytics**, and the private DNS configuration for that endpoint resolves correctly. An analytics application in VNet-Analytics can read and write files, but creating directories and managing access control lists (ACLs) fail.

    You need to ensure that all the application's operations succeed.

    What should you do?
  fr: |
    Northwind dispose d'un compte de stockage v2 universel nommé **stnwlake** dont l'espace de noms hiérarchique est activé (Data Lake Storage). L'accès réseau public à stnwlake est désactivé.

    Vous avez créé un point de terminaison privé pour la sous-ressource `blob` de stnwlake dans un réseau virtuel nommé **VNet-Analytics**, et la configuration DNS privée de ce point de terminaison résout correctement. Une application d'analyse de VNet-Analytics peut lire et écrire des fichiers, mais la création de répertoires et la gestion des listes de contrôle d'accès (ACL) échouent.

    Vous devez faire en sorte que toutes les opérations de l'application réussissent.

    Que devez-vous faire ?
body:
  options:
    - { id: b, text: { en: "Change the target subresource of the existing private endpoint from blob to dfs.", fr: "Remplacer la sous-ressource cible blob du point de terminaison existant par dfs." } }
    - { id: c, text: { en: "Add the dfs zone to the private DNS zone group of the existing endpoint.", fr: "Ajouter la zone dfs au groupe de zones DNS privées du point de terminaison existant." } }
    - { id: a, text: { en: "Create a second private endpoint that targets the dfs subresource.", fr: "Créer un second point de terminaison privé qui cible la sous-ressource dfs." } }
    - { id: d, text: { en: "Enable a Microsoft.Storage service endpoint on the application subnet.", fr: "Activer un point de terminaison de service Microsoft.Storage sur le sous-réseau de l'application." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Directory and ACL operations use the Data Lake Storage (dfs) APIs, which require a private endpoint for the `dfs` subresource. Microsoft recommends a blob endpoint and a dfs endpoint together, because some dfs operations redirect to the blob endpoint. Each endpoint needs its own record in its own `privatelink` zone.
    fr: |
      Les opérations sur les répertoires et les ACL utilisent les API Data Lake Storage (dfs), qui exigent un point de terminaison privé pour la sous-ressource `dfs`. Microsoft recommande d'avoir à la fois un point de terminaison blob et un point de terminaison dfs, car certaines opérations dfs sont redirigées vers le point de terminaison blob. Chaque point de terminaison a besoin de son propre enregistrement dans sa propre zone `privatelink`.
  options:
    b: { en: "Replacing blob with dfs would break the operations that rely on the blob endpoint; both endpoints are needed.", fr: "Remplacer blob par dfs casserait les opérations qui reposent sur le point de terminaison blob ; les deux points de terminaison sont nécessaires." }
    c: { en: "A DNS zone only resolves names; without a dfs private endpoint there is no private address for the dfs service.", fr: "Une zone DNS ne fait que résoudre des noms ; sans point de terminaison privé dfs, il n'existe aucune adresse privée pour le service dfs." }
    d: { en: "A service endpoint reaches the public endpoint, which is disabled on stnwlake.", fr: "Un point de terminaison de service atteint le point de terminaison public, qui est désactivé sur stnwlake." }
references:
  - title: Use private endpoints for Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
