id: az700-sr1-pls-partner-access-1
objective: "4.1.4"
type: series_yesno
series: az700-sr1-pls-partner-access
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You create a Private Link service on ILB1 and approve the private endpoint connection from Contoso.
  fr: |
    Vous créez un service Private Link sur ILB1 et approuvez la connexion de point de terminaison privé de Contoso.
body:
  solution:
    en: |
      In VNet-Prov, you create a **Private Link service** that is associated with the frontend IP configuration of ILB1 and that takes its NAT IP address from a subnet of VNet-Prov. You set its visibility to **Anyone with your alias** and send the alias to Contoso. Contoso creates a private endpoint in VNet-Cons that targets the alias, and you **approve** the pending private endpoint connection on the Private Link service.
    fr: |
      Dans VNet-Prov, vous créez un **service Private Link** associé à la configuration IP frontale d'ILB1 et qui prend son adresse IP NAT dans un sous-réseau de VNet-Prov. Vous définissez sa visibilité sur **Anyone with your alias** et envoyez l'alias à Contoso. Contoso crée dans VNet-Cons un point de terminaison privé qui cible l'alias, et vous **approuvez** la connexion de point de terminaison privé en attente sur le service Private Link.
answer: { value: true }
explanation:
  correct:
    en: |
      The private endpoint gets a private IP address of VNet-Cons and maps only to the frontend of ILB1, so Contoso reaches the pricing service and nothing else in VNet-Prov. The Private Link service translates the traffic to its NAT IP address, so the overlapping address spaces don't conflict, and the connection works across tenants. Traffic flows once the pending connection is approved.
    fr: |
      Le point de terminaison privé reçoit une adresse IP privée de VNet-Cons et ne correspond qu'à la configuration IP frontale d'ILB1 : Contoso atteint le service de tarification et rien d'autre dans VNet-Prov. Le service Private Link traduit le trafic vers son adresse IP NAT, de sorte que les espaces d'adressage qui se chevauchent n'entrent pas en conflit, et la connexion fonctionne entre locataires. Le trafic circule dès que la connexion en attente est approuvée.
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
