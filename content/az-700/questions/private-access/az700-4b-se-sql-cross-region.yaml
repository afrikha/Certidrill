id: az700-4b-se-sql-cross-region
objective: "4.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip has the following resources:

    | Resource | Type | Region |
    | --- | --- | --- |
    | VNet-FR | Virtual network with a subnet named Subnet-Web | France Central |
    | sqlwingtip | Logical server for Azure SQL Database | West Europe |

    Web servers in Subnet-Web connect to databases on sqlwingtip. Currently, the server firewall allows several public IP address ranges.

    You need to ensure that sqlwingtip accepts connections only from Subnet-Web. Moving resources to another region isn't allowed.

    What should you do?
  fr: |
    Wingtip dispose des ressources suivantes :

    | Ressource | Type | Région |
    | --- | --- | --- |
    | VNet-FR | Réseau virtuel avec un sous-réseau nommé Subnet-Web | France Central |
    | sqlwingtip | Serveur logique Azure SQL Database | West Europe |

    Les serveurs web de Subnet-Web se connectent à des bases de données de sqlwingtip. Actuellement, le pare-feu du serveur autorise plusieurs plages d'adresses IP publiques.

    Vous devez faire en sorte que sqlwingtip n'accepte que les connexions de Subnet-Web. Il n'est pas possible de déplacer des ressources vers une autre région.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable a Microsoft.Sql service endpoint on Subnet-Web, add a virtual network rule for Subnet-Web, and remove the IP firewall rules.", fr: "Activer un point de terminaison de service Microsoft.Sql sur Subnet-Web, ajouter une règle de réseau virtuel pour Subnet-Web et supprimer les règles de pare-feu IP." } }
    - { id: b, text: { en: "Add a server-level IP firewall rule for the address range of Subnet-Web, and remove the other IP firewall rules.", fr: "Ajouter une règle de pare-feu IP au niveau du serveur pour la plage d'adresses de Subnet-Web, et supprimer les autres règles de pare-feu IP." } }
    - { id: c, text: { en: "Create a private endpoint for sqlwingtip in Subnet-Web, configure its private DNS zone, and deny public network access.", fr: "Créer un point de terminaison privé pour sqlwingtip dans Subnet-Web, configurer sa zone DNS privée et refuser l'accès réseau public." } }
    - { id: d, text: { en: "Set Allow Azure services and resources to access this server to Yes, and remove the IP firewall rules.", fr: "Définir Allow Azure services and resources to access this server sur Yes, et supprimer les règles de pare-feu IP." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A private endpoint can connect to a resource in another region, and with public network access denied, only clients that reach the private IP address in Subnet-Web (and the networks you connect to it) can use the server. The private DNS zone privatelink.database.windows.net makes the server name resolve to that address.
    fr: |
      Un point de terminaison privé peut se connecter à une ressource d'une autre région ; avec l'accès réseau public refusé, seuls les clients qui atteignent l'adresse IP privée de Subnet-Web (et les réseaux que vous y reliez) peuvent utiliser le serveur. La zone DNS privée privatelink.database.windows.net fait résoudre le nom du serveur en cette adresse.
  options:
    a: { en: "For Azure SQL Database, the subnets referenced by virtual network rules must be in the same region as the server; VNet-FR is in France Central.", fr: "Pour Azure SQL Database, les sous-réseaux référencés par les règles de réseau virtuel doivent être dans la même région que le serveur ; VNet-FR est en France Central." }
    b: { en: "Without a private path, the web servers reach the public endpoint with a public source address, so a rule for the private range of Subnet-Web never matches.", fr: "Sans chemin privé, les serveurs web atteignent le point de terminaison public avec une adresse source publique : une règle pour la plage privée de Subnet-Web ne correspond jamais." }
    d: { en: "This setting accepts traffic from any subnet inside the Azure boundary, including other customers' resources.", fr: "Ce paramètre accepte le trafic de n'importe quel sous-réseau dans le périmètre Azure, y compris les ressources d'autres clients." }
references:
  - title: Virtual Network Endpoints and Rules for Azure SQL Database - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/vnet-service-endpoint-rule-overview
  - title: What is a private endpoint? - Azure Private Link
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
