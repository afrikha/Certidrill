id: az700-sr1-pls-partner-access-2
objective: "4.1.4"
type: series_yesno
series: az700-sr1-pls-partner-access
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    You peer VNet-Cons with VNet-Prov and filter the traffic with an NSG.
  fr: |
    Vous créez un peering entre VNet-Cons et VNet-Prov et filtrez le trafic avec un NSG.
body:
  solution:
    en: |
      You create a virtual network peering between VNet-Prov and VNet-Cons across the two tenants. On the subnets of VNet-Prov, you associate a network security group that allows inbound traffic from VNet-Cons only to the frontend IP address of ILB1.
    fr: |
      Vous créez un peering de réseaux virtuels entre VNet-Prov et VNet-Cons, entre les deux locataires. Sur les sous-réseaux de VNet-Prov, vous associez un groupe de sécurité réseau qui autorise le trafic entrant venant de VNet-Cons uniquement vers l'adresse IP frontale d'ILB1.
answer: { value: false }
explanation:
  correct:
    en: |
      Peering across tenants is supported, but peered virtual networks must have non-overlapping address spaces, and VNet-Prov and VNet-Cons both use 10.0.0.0/16. The peering can't be created. A Private Link service avoids the conflict by translating the traffic to a NAT IP address of the provider network.
    fr: |
      Le peering entre locataires est pris en charge, mais des réseaux virtuels reliés par peering doivent avoir des espaces d'adressage qui ne se chevauchent pas, et VNet-Prov comme VNet-Cons utilisent 10.0.0.0/16. Le peering ne peut pas être créé. Un service Private Link évite ce conflit en traduisant le trafic vers une adresse IP NAT du réseau du fournisseur.
references:
  - title: Create, change, or delete Azure virtual network peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
