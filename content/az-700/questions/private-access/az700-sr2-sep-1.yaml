seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You restrict the network access of stproddata to Subnet1.
  fr: Vous limitez l'accès réseau de stproddata à Subnet1.
body:
  solution:
    en: |
      On stproddata, you set **Public network access** to **Enabled from selected virtual networks and IP addresses**, and you add a virtual network rule for Subnet1.
    fr: |
      Sur stproddata, vous définissez **Public network access** sur **Enabled from selected virtual networks and IP addresses**, et vous ajoutez une règle de réseau virtuel pour Subnet1.
answer: { value: false }
explanation:
  correct:
    en: |
      The storage firewall controls which networks can reach stproddata; it doesn't control which storage accounts the virtual machines in Subnet1 can reach. Without a service endpoint policy, a subnet with a storage service endpoint can still access every storage account, so data can be copied to another account.
    fr: |
      Le pare-feu du stockage contrôle quels réseaux peuvent joindre stproddata ; il ne contrôle pas quels comptes de stockage les machines virtuelles de Subnet1 peuvent joindre. Sans stratégie de point de terminaison de service, un sous-réseau doté d'un point de terminaison de service de stockage peut toujours accéder à tous les comptes de stockage : les données peuvent donc être copiées vers un autre compte.
references:
  - title: Azure virtual network service endpoint policies
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoint-policies-overview
