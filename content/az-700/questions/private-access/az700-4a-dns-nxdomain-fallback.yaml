id: az700-4a-dns-nxdomain-fallback
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a private DNS zone named **privatelink.blob.core.windows.net** that is linked to all its virtual networks and contains the records of Contoso's own blob private endpoints. Virtual machines use Azure-provided DNS.

    A partner named Tailspin gives Contoso access to a storage account named **sttailspinfeed** over its public endpoint, with a SAS token. Tailspin also created a private endpoint for sttailspinfeed in its own virtual network. Since then, Contoso's VMs receive an NXDOMAIN response when they resolve sttailspinfeed.blob.core.windows.net.

    You need Contoso's VMs to reach sttailspinfeed through its public endpoint. The solution must keep working if Tailspin's public IP address changes and must minimize administrative effort.

    What should you do?
  fr: |
    Contoso dispose d'une zone DNS privée nommée **privatelink.blob.core.windows.net**, liée à tous ses réseaux virtuels, qui contient les enregistrements de ses propres points de terminaison privés blob. Les machines virtuelles utilisent le DNS fourni par Azure.

    Un partenaire nommé Tailspin donne à Contoso l'accès à un compte de stockage nommé **sttailspinfeed** via son point de terminaison public, avec un jeton SAS. Tailspin a aussi créé un point de terminaison privé pour sttailspinfeed dans son propre réseau virtuel. Depuis, les machines virtuelles de Contoso reçoivent une réponse NXDOMAIN quand elles résolvent sttailspinfeed.blob.core.windows.net.

    Vous devez faire en sorte que les machines virtuelles de Contoso atteignent sttailspinfeed via son point de terminaison public. La solution doit continuer de fonctionner si l'adresse IP publique de Tailspin change et doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: b, text: { en: "Add an A record for sttailspinfeed with the current public IP address of the storage account to the zone.", fr: "Ajouter à la zone un enregistrement A sttailspinfeed avec l'adresse IP publique actuelle du compte de stockage." } }
    - { id: c, text: { en: "Unlink the privatelink.blob.core.windows.net zone from the virtual networks.", fr: "Supprimer les liens de la zone privatelink.blob.core.windows.net vers les réseaux virtuels." } }
    - { id: a, text: { en: "Enable fallback to internet on the virtual network links of the privatelink.blob.core.windows.net zone.", fr: "Activer le repli vers Internet sur les liens de réseau virtuel de la zone privatelink.blob.core.windows.net." } }
    - { id: d, text: { en: "Create a private DNS zone named blob.core.windows.net with a CNAME record for sttailspinfeed.", fr: "Créer une zone DNS privée nommée blob.core.windows.net avec un enregistrement CNAME pour sttailspinfeed." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Because sttailspinfeed now has a private endpoint, its public CNAME points to the `privatelink` name, which Contoso's linked zone answers with NXDOMAIN. Fallback to internet (`resolutionPolicy` set to `NxDomainRedirect` on the virtual network link) makes Azure DNS retry through the public resolution path when the private zone returns NXDOMAIN, with no record to maintain.
    fr: |
      Comme sttailspinfeed possède désormais un point de terminaison privé, son CNAME public pointe vers le nom `privatelink`, auquel la zone liée de Contoso répond NXDOMAIN. Le repli vers Internet (`resolutionPolicy` réglé sur `NxDomainRedirect` sur le lien de réseau virtuel) fait réessayer Azure DNS par le chemin de résolution public quand la zone privée renvoie NXDOMAIN, sans enregistrement à maintenir.
  options:
    b: { en: "A manual A record with the public IP works but isn't updated automatically, so it breaks when the address changes; Microsoft doesn't recommend it.", fr: "Un enregistrement A manuel avec l'adresse IP publique fonctionne mais n'est pas mis à jour automatiquement : il casse quand l'adresse change ; Microsoft ne le recommande pas." }
    c: { en: "Unlinking the zone would break resolution of Contoso's own private endpoints.", fr: "Supprimer les liens casserait la résolution des propres points de terminaison privés de Contoso." }
    d: { en: "A zone named after the public zone would override every other storage account name.", fr: "Une zone portant le nom de la zone publique remplacerait tous les autres noms de comptes de stockage." }
references:
  - title: Fallback to internet for Azure Private DNS zones
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-fallback
  - title: Azure Private Endpoint private DNS zone values
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
