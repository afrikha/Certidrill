id: az700-4b-sea-sql-40914
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a logical server for Azure SQL Database named **sqllitware** in the West Europe region. A network administrator enabled the Microsoft.Sql service endpoint on a subnet named **Subnet-Api** of a virtual network in West Europe.

    Since the change, connections from the virtual machines in Subnet-Api to sqllitware fail with error 40914. Before the change, the virtual machines connected through an IP firewall rule for the public IP address of their NAT gateway.

    You need to restore connectivity. The server must accept connections only from Subnet-Api.

    What should you do?
  fr: |
    Litware dispose d'un serveur logique Azure SQL Database nommé **sqllitware** dans la région West Europe. Un administrateur réseau a activé le point de terminaison de service Microsoft.Sql sur un sous-réseau nommé **Subnet-Api** d'un réseau virtuel situé en West Europe.

    Depuis ce changement, les connexions des machines virtuelles de Subnet-Api à sqllitware échouent avec l'erreur 40914. Avant le changement, les machines virtuelles se connectaient grâce à une règle de pare-feu IP pour l'adresse IP publique de leur passerelle NAT.

    Vous devez rétablir la connectivité. Le serveur ne doit accepter que les connexions de Subnet-Api.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a virtual network rule for Subnet-Api to the firewall of sqllitware.", fr: "Ajouter une règle de réseau virtuel pour Subnet-Api au pare-feu de sqllitware." } }
    - { id: b, text: { en: "Add an IP firewall rule for the private address range of Subnet-Api to sqllitware.", fr: "Ajouter à sqllitware une règle de pare-feu IP pour la plage d'adresses privées de Subnet-Api." } }
    - { id: c, text: { en: "Set Allow Azure services and resources to access this server to Yes on sqllitware.", fr: "Définir Allow Azure services and resources to access this server sur Yes sur sqllitware." } }
    - { id: d, text: { en: "Disable the Microsoft.Sql service endpoint, and re-enable it with the IgnoreMissingVnetServiceEndpoint flag.", fr: "Désactiver le point de terminaison de service Microsoft.Sql, puis le réactiver avec l'indicateur IgnoreMissingVnetServiceEndpoint." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Error 40914 means that the client's subnet has a service endpoint but the server has no virtual network rule for it. With the endpoint enabled, the server sees the private address and subnet identity instead of the NAT gateway address, so the IP rule no longer matches; a virtual network rule for Subnet-Api fixes it and admits only that subnet.
    fr: |
      L'erreur 40914 signifie que le sous-réseau du client dispose d'un point de terminaison de service, mais que le serveur n'a pas de règle de réseau virtuel pour ce sous-réseau. Avec le point de terminaison activé, le serveur voit l'adresse privée et l'identité du sous-réseau au lieu de l'adresse de la passerelle NAT : la règle IP ne correspond plus. Une règle de réseau virtuel pour Subnet-Api corrige le problème et n'admet que ce sous-réseau.
  options:
    b: { en: "IP rules match the public source address; traffic through a service endpoint is identified by its subnet, which only a virtual network rule can allow.", fr: "Les règles IP correspondent à l'adresse source publique ; le trafic qui passe par un point de terminaison de service est identifié par son sous-réseau, que seule une règle de réseau virtuel peut autoriser." }
    c: { en: "This setting would accept traffic from any subnet in Azure, which breaks the requirement to accept only Subnet-Api.", fr: "Ce paramètre accepterait le trafic de n'importe quel sous-réseau d'Azure, ce qui enfreint l'exigence de n'accepter que Subnet-Api." }
    d: { en: "IgnoreMissingVnetServiceEndpoint is a property of the virtual network rule on the server, not of the subnet's service endpoint.", fr: "IgnoreMissingVnetServiceEndpoint est une propriété de la règle de réseau virtuel du serveur, pas du point de terminaison de service du sous-réseau." }
references:
  - title: Virtual Network Endpoints and Rules for Azure SQL Database - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/vnet-service-endpoint-rule-overview
