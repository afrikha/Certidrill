id: az700-4a-pe-create-yesno
objective: "4.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip deploys private endpoints for Azure PaaS resources by using the Azure portal and the Azure CLI. An existing private endpoint named **PE-Media** was created with the default settings.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip déploie des points de terminaison privés pour des ressources PaaS Azure avec le portail Azure et Azure CLI. Un point de terminaison privé existant nommé **PE-Media** a été créé avec les paramètres par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A connection request is approved automatically when its creator has the privateEndpointConnectionsApproval/action permission on the target resource.
        fr: Une demande de connexion est approuvée automatiquement quand son auteur dispose de l'autorisation privateEndpointConnectionsApproval/action sur la ressource cible.
    - id: s2
      text:
        en: You can assign a static IP address to PE-Media by editing the IP configuration of its network interface.
        fr: Vous pouvez attribuer une adresse IP statique à PE-Media en modifiant la configuration IP de son interface réseau.
    - id: s3
      text:
        en: You can set a custom name for the network interface of a new private endpoint when you create the endpoint.
        fr: Vous pouvez définir un nom personnalisé pour l'interface réseau d'un nouveau point de terminaison privé lors de sa création.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Automatic approval requires the `Microsoft.<Provider>/<resource_type>/privateEndpointConnectionsApproval/action` permission on the target resource; otherwise the request is manual. A static IP address can only be configured when the private endpoint is created, not on an existing endpoint, whose network interface is read-only. A custom network interface name is also set at creation time (renaming an existing interface isn't supported).
    fr: |
      L'approbation automatique exige l'autorisation `Microsoft.<Provider>/<resource_type>/privateEndpointConnectionsApproval/action` sur la ressource cible ; sinon, la demande est manuelle. Une adresse IP statique ne peut être configurée qu'à la création du point de terminaison privé, pas sur un point de terminaison existant, dont l'interface réseau est en lecture seule. Un nom d'interface réseau personnalisé se définit lui aussi à la création (le renommage d'une interface existante n'est pas pris en charge).
references:
  - title: Manage Azure private endpoints
    url: https://learn.microsoft.com/en-us/azure/private-link/manage-private-endpoint
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
