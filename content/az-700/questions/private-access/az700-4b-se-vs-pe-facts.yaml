id: az700-4b-se-vs-pe-facts
objective: "4.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum is comparing virtual network service endpoints and private endpoints to secure access from its Azure virtual networks to Azure Storage and Azure Key Vault.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum compare les points de terminaison de service de réseau virtuel et les points de terminaison privés pour sécuriser l'accès de ses réseaux virtuels Azure à Stockage Azure et à Azure Key Vault.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "With a service endpoint, the name of the resource still resolves to its public IP address.", fr: "Avec un point de terminaison de service, le nom de la ressource est toujours résolu en son adresse IP publique." } }
    - { id: b, text: { en: "A service endpoint is billed per hour and per gigabyte of data processed.", fr: "Un point de terminaison de service est facturé à l'heure et par gigaoctet de données traitées." } }
    - { id: c, text: { en: "With a private endpoint, clients connect to an IP address from a subnet of your virtual network.", fr: "Avec un point de terminaison privé, les clients se connectent à une adresse IP d'un sous-réseau de votre réseau virtuel." } }
    - { id: d, text: { en: "A service endpoint lets on-premises clients connected by ExpressRoute private peering reach the resource.", fr: "Un point de terminaison de service permet aux clients locaux reliés par le peering privé ExpressRoute d'atteindre la ressource." } }
    - { id: e, text: { en: "A private endpoint gives access to every storage account in the region of the virtual network.", fr: "Un point de terminaison privé donne accès à tous les comptes de stockage de la région du réseau virtuel." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A service endpoint changes the source address seen by the service, not the destination, so DNS entries are unchanged and still resolve to public IP addresses. A private endpoint is a network interface with a private IP address from your subnet, which is why it needs DNS configuration.
    fr: |
      Un point de terminaison de service modifie l'adresse source vue par le service, pas la destination : les entrées DNS ne changent pas et sont toujours résolues en adresses IP publiques. Un point de terminaison privé est une interface réseau dotée d'une adresse IP privée de votre sous-réseau, ce qui explique qu'il nécessite une configuration DNS.
  options:
    b: { en: "Service endpoints have no extra charge; private endpoints are the billed option.", fr: "Les points de terminaison de service n'entraînent aucun coût supplémentaire ; ce sont les points de terminaison privés qui sont facturés." }
    d: { en: "Service endpoints apply only to traffic from the subnet; on-premises access requires IP rules for public NAT addresses or a private endpoint.", fr: "Les points de terminaison de service ne s'appliquent qu'au trafic du sous-réseau ; l'accès local nécessite des règles IP pour les adresses NAT publiques ou un point de terminaison privé." }
    e: { en: "A private endpoint maps to one subresource of one resource, not to a whole service.", fr: "Un point de terminaison privé correspond à une sous-ressource d'une ressource, pas à un service entier." }
references:
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
  - title: What is a private endpoint? - Azure Private Link
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
