id: az700-4a-access-policy-facts
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has a subnet named **snet-shared** that contains virtual machines and three private endpoints. A network security group named **NSG-Shared** is associated with snet-shared.

    You set the network policy for private endpoints of snet-shared to **Enabled**.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un sous-réseau nommé **snet-shared** qui contient des machines virtuelles et trois points de terminaison privés. Un groupe de sécurité réseau nommé **NSG-Shared** est associé à snet-shared.

    Vous réglez la stratégie réseau des points de terminaison privés de snet-shared sur **Enabled**.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: c, text: { en: "The portal shows the effective security rules on the network interfaces of the private endpoints.", fr: "Le portail affiche les règles de sécurité effectives sur les interfaces réseau des points de terminaison privés." } }
    - { id: a, text: { en: "The setting applies to all three private endpoints of snet-shared.", fr: "Le paramètre s'applique aux trois points de terminaison privés de snet-shared." } }
    - { id: d, text: { en: "NSG-Shared now starts to filter the traffic of the virtual machines in snet-shared.", fr: "NSG-Shared commence désormais à filtrer le trafic des machines virtuelles de snet-shared." } }
    - { id: b, text: { en: "A rule of NSG-Shared can use an application security group that contains the private endpoints as its destination.", fr: "Une règle de NSG-Shared peut utiliser comme destination un groupe de sécurité d'application qui contient les points de terminaison privés." } }
    - { id: e, text: { en: "An outbound deny rule in NSG-Shared is required to prevent the PaaS services from opening connections into snet-shared.", fr: "Une règle sortante de refus dans NSG-Shared est nécessaire pour empêcher les services PaaS d'ouvrir des connexions vers snet-shared." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      The network policy is a subnet setting that affects every private endpoint in the subnet. Once it's enabled, NSG rules apply to the endpoints, and private endpoints support application security groups, so an ASG that contains them can be used in rules.
    fr: |
      La stratégie réseau est un paramètre de sous-réseau qui concerne tous les points de terminaison privés du sous-réseau. Une fois qu'elle est activée, les règles NSG s'appliquent aux points de terminaison, et les points de terminaison privés prennent en charge les groupes de sécurité d'application : un ASG qui les contient peut donc être utilisé dans les règles.
  options:
    c: { en: "Effective routes and security rules aren't displayed for the network interface of a private endpoint.", fr: "Les itinéraires et règles de sécurité effectifs ne sont pas affichés pour l'interface réseau d'un point de terminaison privé." }
    d: { en: "Virtual machines in the subnet were already subject to NSG-Shared; the setting only changes how private endpoints are treated.", fr: "Les machines virtuelles du sous-réseau étaient déjà soumises à NSG-Shared ; le paramètre ne change que le traitement des points de terminaison privés." }
    e: { en: "A provider can't originate traffic through a private endpoint, so denying outbound traffic from the endpoint isn't a valid scenario.", fr: "Un fournisseur ne peut pas initier de trafic via un point de terminaison privé : refuser le trafic sortant du point de terminaison n'est pas un scénario valide." }
references:
  - title: Manage network policies for private endpoints
    url: https://learn.microsoft.com/en-us/azure/private-link/disable-private-endpoint-network-policy
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
