id: az700-cs3c-storage-exfiltration
objective: "4.2.3"
type: single
caseStudy: az700-cs3c-munsons
difficulty: 2
status: draft
stem:
  en: You need to meet the data protection requirement for the data science VMs. What should you do?
  fr: Vous devez respecter l'exigence de protection des données des machines virtuelles de science des données. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a virtual network rule for the Analytics subnet to the firewall of stmunsonsanalytics", fr: "Ajouter une règle de réseau virtuel pour le sous-réseau Analytics au pare-feu de stmunsonsanalytics" } }
    - { id: b, text: { en: "Associate a service endpoint policy that lists stmunsonsanalytics with the Analytics subnet", fr: "Associer au sous-réseau Analytics une stratégie de point de terminaison de service qui liste stmunsonsanalytics" } }
    - { id: c, text: { en: "Add an NSG outbound rule on the Analytics subnet that allows only the Storage.WestEurope service tag", fr: "Ajouter sur le sous-réseau Analytics une règle sortante de NSG qui autorise uniquement l'étiquette de service Storage.WestEurope" } }
    - { id: d, text: { en: "Add a route for the Storage service tag with the next hop type None to the Analytics subnet", fr: "Ajouter au sous-réseau Analytics un itinéraire pour l'étiquette de service Storage avec le type de tronçon suivant None" } }
answer: { optionId: b }
explanation:
  correct:
    en: A service endpoint policy filters the traffic that leaves a subnet over the Microsoft.Storage service endpoint and allows only the storage accounts that it lists. Once it's associated with the Analytics subnet, access to every other storage account through the endpoint is denied. The policy must be in the same region and subscription as the virtual network, which is the case here.
    fr: Une stratégie de point de terminaison de service filtre le trafic qui quitte un sous-réseau par le point de terminaison de service Microsoft.Storage et n'autorise que les comptes de stockage qu'elle liste. Une fois associée au sous-réseau Analytics, l'accès à tout autre compte de stockage par le point de terminaison est refusé. La stratégie doit se trouver dans la même région et le même abonnement que le réseau virtuel, ce qui est le cas ici.
  options:
    a: { en: "A virtual network rule controls which networks can reach stmunsonsanalytics; it doesn't stop the VMs from reaching other storage accounts.", fr: "Une règle de réseau virtuel contrôle quels réseaux peuvent atteindre stmunsonsanalytics ; elle n'empêche pas les machines virtuelles d'atteindre d'autres comptes de stockage." }
    c: { en: "The Storage.WestEurope service tag covers every storage account in the region, not only stmunsonsanalytics.", fr: "L'étiquette de service Storage.WestEurope couvre tous les comptes de stockage de la région, pas seulement stmunsonsanalytics." }
    d: { en: "Dropping all Storage traffic would also block stmunsonsanalytics, and service endpoint routes can't be overridden by a route table.", fr: "Abandonner tout le trafic Storage bloquerait aussi stmunsonsanalytics, et les itinéraires de point de terminaison de service ne peuvent pas être remplacés par une table de routage." }
references:
  - title: Virtual network service endpoint policies for Azure Storage
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoint-policies-overview
