id: az700-cs2c-status-pls
objective: "4.1.4"
type: yesno_statements
caseStudy: az700-cs2c-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You create pls-status on the frontend IP configuration of lb-status. You set the visibility to **Restricted by subscription** and add the subscriptions of the contracted delivery companies to the auto-approval list. TCP proxy v2 isn't enabled.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez pls-status sur la configuration IP frontale de lb-status. Vous définissez la visibilité sur **Restricted by subscription** et vous ajoutez les abonnements des entreprises de livraison sous contrat à la liste d'approbation automatique. TCP proxy v2 n'est pas activé.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          VM-API1 sees a NAT IP address of pls-status as the source address of the requests sent by the delivery companies.
        fr: |
          VM-API1 voit une adresse IP NAT de pls-status comme adresse source des requêtes envoyées par les entreprises de livraison.
    - id: s2
      text:
        en: |
          A delivery company must create its private endpoint in a virtual network of the West Europe region.
        fr: |
          Une entreprise de livraison doit créer son point de terminaison privé dans un réseau virtuel de la région West Europe.
    - id: s3
      text:
        en: |
          A delivery company whose virtual network uses 10.80.0.0/16 can reach the API through a private endpoint connected to pls-status.
        fr: |
          Une entreprise de livraison dont le réseau virtuel utilise 10.80.0.0/16 peut atteindre l'API par un point de terminaison privé connecté à pls-status.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Private Link service translates the consumer traffic, so the backend receives a NAT IP address taken from snet-pls; the real source address is available only through the proxy protocol header when TCP proxy v2 is enabled. The Private Link service must be in the region of its load balancer, but approved private endpoints can connect to it from any public region. Because of this NAT, the consumer and provider address spaces don't conflict, so overlapping ranges are supported.
    fr: |
      Le service Private Link traduit le trafic des consommateurs : le back-end reçoit donc une adresse IP NAT prise dans snet-pls ; l'adresse source réelle n'est disponible que dans l'en-tête du protocole proxy quand TCP proxy v2 est activé. Le service Private Link doit se trouver dans la région de son équilibreur de charge, mais des points de terminaison privés approuvés peuvent s'y connecter depuis n'importe quelle région publique. Grâce à cette traduction d'adresses, les espaces d'adressage du consommateur et du fournisseur n'entrent pas en conflit : les plages qui se chevauchent sont prises en charge.
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
