id: az700-4a-dns-public-zone-trap
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a private endpoint with the IP address 10.4.2.5 for the blob service of a storage account named **stfabdocs**. Virtual machines in a virtual network named **VNet-Docs** use Azure-provided DNS.

    An administrator created a private DNS zone named **blob.core.windows.net**, linked it to VNet-Docs, and added an A record named **stfabdocs** that points to 10.4.2.5. The VMs now reach stfabdocs privately, but they can no longer resolve the names of other storage accounts that Fabrikam uses through their public endpoints.

    You need to fix name resolution for all the storage accounts. The solution must not require records for the other storage accounts.

    What should you do?
  fr: |
    Fabrikam dispose d'un point de terminaison privé d'adresse IP 10.4.2.5 pour le service blob d'un compte de stockage nommé **stfabdocs**. Les machines virtuelles d'un réseau virtuel nommé **VNet-Docs** utilisent le DNS fourni par Azure.

    Un administrateur a créé une zone DNS privée nommée **blob.core.windows.net**, l'a liée à VNet-Docs et y a ajouté un enregistrement A nommé **stfabdocs** qui pointe vers 10.4.2.5. Les machines virtuelles atteignent désormais stfabdocs de façon privée, mais elles ne peuvent plus résoudre les noms des autres comptes de stockage que Fabrikam utilise via leurs points de terminaison publics.

    Vous devez rétablir la résolution de noms pour tous les comptes de stockage. La solution ne doit pas exiger d'enregistrements pour les autres comptes de stockage.

    Que devez-vous faire ?
body:
  options:
    - { id: c, text: { en: "Add a CNAME record for stfabdocs that points to stfabdocs.privatelink.blob.core.windows.net in the existing zone.", fr: "Ajouter dans la zone existante un enregistrement CNAME stfabdocs qui pointe vers stfabdocs.privatelink.blob.core.windows.net." } }
    - { id: b, text: { en: "Enable autoregistration on the virtual network link of the blob.core.windows.net zone.", fr: "Activer l'inscription automatique sur le lien de réseau virtuel de la zone blob.core.windows.net." } }
    - { id: d, text: { en: "Configure the DNS servers of VNet-Docs to use a public DNS resolver.", fr: "Configurer les serveurs DNS de VNet-Docs pour utiliser un résolveur DNS public." } }
    - { id: a, text: { en: "Replace the zone with a privatelink.blob.core.windows.net zone that contains the stfabdocs record and is linked to VNet-Docs.", fr: "Remplacer la zone par une zone privatelink.blob.core.windows.net qui contient l'enregistrement stfabdocs et qui est liée à VNet-Docs." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A private zone named after the public zone makes Azure DNS authoritative for every `*.blob.core.windows.net` name in VNet-Docs, so accounts without a record no longer resolve. With the recommended `privatelink.blob.core.windows.net` zone, the public CNAME chain still applies: stfabdocs resolves through the private record, and other accounts follow their public resolution.
    fr: |
      Une zone privée portant le nom de la zone publique rend Azure DNS faisant autorité pour tous les noms `*.blob.core.windows.net` dans VNet-Docs : les comptes sans enregistrement ne se résolvent plus. Avec la zone recommandée `privatelink.blob.core.windows.net`, la chaîne CNAME publique s'applique toujours : stfabdocs se résout via l'enregistrement privé, et les autres comptes suivent leur résolution publique.
  options:
    b: { en: "Autoregistration creates records for virtual machines of the linked network; it doesn't restore resolution of the public storage names.", fr: "L'inscription automatique crée des enregistrements pour les machines virtuelles du réseau lié ; elle ne rétablit pas la résolution des noms de stockage publics." }
    c: { en: "The problem is the zone name: it still overrides all the other storage account names.", fr: "Le problème vient du nom de la zone : elle remplace toujours tous les autres noms de comptes de stockage." }
    d: { en: "A public resolver can't see the private zone, so stfabdocs would resolve to its public address.", fr: "Un résolveur public ne voit pas la zone privée : stfabdocs se résoudrait vers son adresse publique." }
references:
  - title: Azure Private Endpoint private DNS zone values
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
  - title: Use private endpoints for Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
