id: az700-4b-sea-storage-cli
objective: "4.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Northwind has a storage account named **stnwinvoices** in a resource group named **RG-Data**. The Microsoft.Storage service endpoint is enabled on a subnet named **Subnet1** of a virtual network named **VNet1**, in the same resource group.

    You need to configure stnwinvoices to meet the following requirements:

    - Deny access from all networks by default.
    - Allow access from Subnet1.
    - Allow access from the public address range 203.0.113.0/24 of a branch office.

    How should you complete the Azure CLI commands? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un compte de stockage nommé **stnwinvoices** dans un groupe de ressources nommé **RG-Data**. Le point de terminaison de service Microsoft.Storage est activé sur un sous-réseau nommé **Subnet1** d'un réseau virtuel nommé **VNet1**, situé dans le même groupe de ressources.

    Vous devez configurer stnwinvoices pour répondre aux exigences suivantes :

    - Refuser par défaut l'accès depuis tous les réseaux.
    - Autoriser l'accès depuis Subnet1.
    - Autoriser l'accès depuis la plage d'adresses publiques 203.0.113.0/24 d'une agence.

    Comment devez-vous compléter les commandes Azure CLI ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az storage account update \
      --resource-group RG-Data \
      --name stnwinvoices \
      --default-action [[act]]

    az storage account network-rule add \
      --resource-group RG-Data \
      --account-name stnwinvoices \
      --vnet-name VNet1 \
      [[sub]] Subnet1

    az storage account network-rule add \
      --resource-group RG-Data \
      --account-name stnwinvoices \
      [[ip]] 203.0.113.0/24
  slots:
    - id: act
      options:
        - { id: allow, text: Allow }
        - { id: deny, text: Deny }
        - { id: disabled, text: Disabled }
    - id: sub
      options:
        - { id: subnet, text: "--subnet" }
        - { id: resid, text: "--resource-id" }
        - { id: ipaddr, text: "--ip-address" }
    - id: ip
      options:
        - { id: ipaddr, text: "--ip-address" }
        - { id: subnet, text: "--subnet" }
        - { id: tenant, text: "--tenant-id" }
answer:
  values: { act: deny, sub: subnet, ip: ipaddr }
explanation:
  correct:
    en: |
      The default action Deny blocks every network that no rule allows. `az storage account network-rule add` then takes `--subnet` (with `--vnet-name` when you give a name) for a virtual network rule, and `--ip-address` for an IPv4 address or CIDR range.
    fr: |
      L'action par défaut Deny bloque tout réseau qu'aucune règle n'autorise. `az storage account network-rule add` prend ensuite `--subnet` (avec `--vnet-name` quand vous indiquez un nom) pour une règle de réseau virtuel, et `--ip-address` pour une adresse IPv4 ou une plage CIDR.
  options:
    allow: { en: "Allow is the default behaviour: the account would stay open to all networks.", fr: "Allow est le comportement par défaut : le compte resterait ouvert à tous les réseaux." }
    disabled: { en: "Disabled isn't a value of the default action; it's a value of public network access, and it would block the subnet and IP rules too.", fr: "Disabled n'est pas une valeur de l'action par défaut ; c'est une valeur de l'accès réseau public, qui bloquerait aussi les règles de sous-réseau et IP." }
    resid: { en: "--resource-id creates a resource instance rule for an Azure resource, not a subnet rule.", fr: "--resource-id crée une règle d'instance de ressource pour une ressource Azure, pas une règle de sous-réseau." }
    tenant: { en: "--tenant-id goes with --resource-id for resource instance rules.", fr: "--tenant-id accompagne --resource-id pour les règles d'instance de ressource." }
references:
  - title: az storage account network-rule
    url: https://learn.microsoft.com/en-us/cli/azure/storage/account/network-rule
  - title: Firewall rules and network access for Azure Blob, Data Lake, Queue, and Table Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
