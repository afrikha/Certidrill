id: az700-4a-pls-provider-steps
objective: "4.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs an order API on virtual machines behind a Standard internal load balancer named **lb-orders** in a virtual network named **VNet-App**. The backend pool of lb-orders is configured by network interface, and the load-balancing rule and health probe are working. The frontend IP configuration is named **fe-orders**. A subnet named **snet-pls** will provide the NAT IP addresses.

    A partner named Fabrikam must reach the API from its own subscription in another Microsoft Entra tenant. Fabrikam's subscription won't be in the auto-approval list. You use the Azure CLI.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso exécute une API de commandes sur des machines virtuelles derrière un équilibreur de charge interne Standard nommé **lb-orders** dans un réseau virtuel nommé **VNet-App**. Le pool principal de lb-orders est configuré par interface réseau, et la règle d'équilibrage de charge et la sonde d'intégrité fonctionnent. La configuration IP frontale se nomme **fe-orders**. Un sous-réseau nommé **snet-pls** fournira les adresses IP NAT.

    Un partenaire nommé Fabrikam doit atteindre l'API depuis son propre abonnement, dans un autre locataire Microsoft Entra. L'abonnement de Fabrikam ne figurera pas dans la liste d'approbation automatique. Vous utilisez Azure CLI.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: policy, text: { en: "Set the Private Link service network policies of snet-pls to **Disabled**.", fr: "Régler les stratégies réseau du service Private Link de snet-pls sur **Disabled**." } }
    - { id: create, text: { en: "Create a Private Link service on fe-orders, with its visibility restricted to Fabrikam's subscription.", fr: "Créer un service Private Link sur fe-orders, avec une visibilité limitée à l'abonnement de Fabrikam." } }
    - { id: alias, text: { en: "Send the alias of the Private Link service to Fabrikam.", fr: "Envoyer l'alias du service Private Link à Fabrikam." } }
    - { id: approve, text: { en: "Approve the pending private endpoint connection from Fabrikam.", fr: "Approuver la connexion de point de terminaison privé en attente provenant de Fabrikam." } }
    - { id: pepol, text: { en: "Set the private endpoint network policies of snet-pls to **Enabled**.", fr: "Régler les stratégies réseau des points de terminaison privés de snet-pls sur **Enabled**." } }
    - { id: peer, text: { en: "Peer VNet-App with Fabrikam's virtual network.", fr: "Relier par peering VNet-App au réseau virtuel de Fabrikam." } }
answer:
  sequence: [ policy, create, alias, approve ]
explanation:
  correct:
    en: |
      With the CLI, `privateLinkServiceNetworkPolicies` must be disabled on the NAT subnet before the Private Link service can be created (the portal does it automatically). You then create the service on the frontend IP configuration of the Standard load balancer, share its alias, and approve Fabrikam's request, which arrives in the Pending state because its subscription isn't auto-approved.
    fr: |
      Avec Azure CLI, `privateLinkServiceNetworkPolicies` doit être désactivé sur le sous-réseau NAT avant de pouvoir créer le service Private Link (le portail le fait automatiquement). Vous créez ensuite le service sur la configuration IP frontale de l'équilibreur de charge Standard, communiquez son alias et approuvez la demande de Fabrikam, qui arrive à l'état Pending puisque son abonnement n'est pas approuvé automatiquement.
  options:
    pepol: { en: "The private endpoint network policy concerns consumers' private endpoints, not the NAT IP addresses of a Private Link service.", fr: "La stratégie réseau des points de terminaison privés concerne les points de terminaison des consommateurs, pas les adresses IP NAT d'un service Private Link." }
    peer: { en: "Private Link replaces peering: Fabrikam connects through a private endpoint in its own network.", fr: "Private Link remplace le peering : Fabrikam se connecte via un point de terminaison privé dans son propre réseau." }
references:
  - title: "Quickstart: Create a Private Link service using Azure CLI"
    url: https://learn.microsoft.com/en-us/azure/private-link/create-private-link-service-cli
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
