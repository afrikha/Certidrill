id: az700-4b-resolver-deploy-order
objective: "4.1.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has an on-premises network connected to a virtual network named **VNet-Hub** by ExpressRoute private peering. VNet-Hub contains:

    - a private endpoint for the `file` subresource of the storage account **stwoodgrovefs**;
    - the private DNS zone `privatelink.file.core.windows.net`, linked to VNet-Hub, with the A record of the private endpoint;
    - an empty subnet named **snet-dns-in** (10.30.5.0/28) delegated to `Microsoft.Network/dnsResolvers`.

    On-premises file servers must map `\\stwoodgrovefs.file.core.windows.net\share1` by using the private endpoint. You need to configure name resolution.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove dispose d'un réseau local relié à un réseau virtuel nommé **VNet-Hub** par le peering privé ExpressRoute. VNet-Hub contient :

    - un point de terminaison privé pour la sous-ressource `file` du compte de stockage **stwoodgrovefs** ;
    - la zone DNS privée `privatelink.file.core.windows.net`, liée à VNet-Hub, avec l'enregistrement A du point de terminaison privé ;
    - un sous-réseau vide nommé **snet-dns-in** (10.30.5.0/28) délégué à `Microsoft.Network/dnsResolvers`.

    Les serveurs de fichiers locaux doivent mapper `\\stwoodgrovefs.file.core.windows.net\share1` en utilisant le point de terminaison privé. Vous devez configurer la résolution de noms.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: resolver, text: { en: "Create an Azure DNS Private Resolver for VNet-Hub.", fr: "Créer un Azure DNS Private Resolver pour VNet-Hub." } }
    - { id: inbound, text: { en: "Add an inbound endpoint to the resolver in snet-dns-in.", fr: "Ajouter au résolveur un point de terminaison entrant dans snet-dns-in." } }
    - { id: forwarder, text: { en: "On the on-premises DNS servers, create a conditional forwarder for file.core.windows.net that targets the IP address of the inbound endpoint.", fr: "Sur les serveurs DNS locaux, créer un redirecteur conditionnel pour file.core.windows.net qui cible l'adresse IP du point de terminaison entrant." } }
    - { id: outbound, text: { en: "Add an outbound endpoint to the resolver in snet-dns-in.", fr: "Ajouter au résolveur un point de terminaison sortant dans snet-dns-in." } }
    - { id: ruleset, text: { en: "Create a DNS forwarding ruleset for file.core.windows.net and link it to VNet-Hub.", fr: "Créer un ensemble de règles de transfert DNS pour file.core.windows.net et le lier à VNet-Hub." } }
    - { id: vnetdns, text: { en: "Set the DNS servers of VNet-Hub to the IP address of the inbound endpoint.", fr: "Définir l'adresse IP du point de terminaison entrant comme serveur DNS de VNet-Hub." } }
answer:
  sequence: [ resolver, inbound, forwarder ]
explanation:
  correct:
    en: |
      The resolver is created for one virtual network in its region, then its inbound endpoint takes an IP address in the dedicated, delegated subnet. Only then does that IP address exist, so the on-premises DNS servers can forward the public zone file.core.windows.net to it; the resolver answers with Azure DNS from VNet-Hub, which is linked to the privatelink zone.
    fr: |
      Le résolveur est créé pour un réseau virtuel de sa région, puis son point de terminaison entrant prend une adresse IP dans le sous-réseau dédié et délégué. Cette adresse n'existe qu'à ce moment-là : les serveurs DNS locaux peuvent alors lui transférer la zone publique file.core.windows.net ; le résolveur répond avec Azure DNS depuis VNet-Hub, qui est lié à la zone privatelink.
  options:
    outbound: { en: "An outbound endpoint sends queries from Azure to other DNS servers; it isn't needed for on-premises clients to resolve Azure names, and snet-dns-in will already be used by the inbound endpoint.", fr: "Un point de terminaison sortant envoie des requêtes d'Azure vers d'autres serveurs DNS ; il n'est pas nécessaire pour que les clients locaux résolvent des noms Azure, et snet-dns-in sera déjà utilisé par le point de terminaison entrant." }
    ruleset: { en: "A ruleset forwards queries from Azure to external servers; Azure already resolves file.core.windows.net.", fr: "Un ensemble de règles transfère des requêtes d'Azure vers des serveurs externes ; Azure résout déjà file.core.windows.net." }
    vnetdns: { en: "Virtual machines of VNet-Hub already resolve the private zone with Azure DNS; this change doesn't help on-premises servers.", fr: "Les machines virtuelles de VNet-Hub résolvent déjà la zone privée avec Azure DNS ; ce changement n'aide pas les serveurs locaux." }
references:
  - title: Azure DNS Private Resolver Overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
  - title: Azure Private Endpoint DNS Integration Scenarios
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
