id: az700-4b-sea-sql-allow-azure
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has a logical server for Azure SQL Database named **sqltailspin**. The firewall of sqltailspin has a virtual network rule for a subnet named **Subnet-Web**, which has the Microsoft.Sql service endpoint enabled. **Allow Azure services and resources to access this server** is set to **Yes**. There are no IP firewall rules.

    An audit reports that sqltailspin accepts connections from Azure resources outside Subnet-Web.

    You need to ensure that only Subnet-Web can connect to sqltailspin.

    What should you do?
  fr: |
    Tailspin dispose d'un serveur logique Azure SQL Database nommé **sqltailspin**. Le pare-feu de sqltailspin a une règle de réseau virtuel pour un sous-réseau nommé **Subnet-Web**, sur lequel le point de terminaison de service Microsoft.Sql est activé. **Allow Azure services and resources to access this server** a la valeur **Yes**. Il n'y a aucune règle de pare-feu IP.

    Un audit signale que sqltailspin accepte des connexions de ressources Azure situées hors de Subnet-Web.

    Vous devez faire en sorte que seul Subnet-Web puisse se connecter à sqltailspin.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set Allow Azure services and resources to access this server to No.", fr: "Définir Allow Azure services and resources to access this server sur No." } }
    - { id: b, text: { en: "Set the IgnoreMissingVnetServiceEndpoint flag on the virtual network rule.", fr: "Définir l'indicateur IgnoreMissingVnetServiceEndpoint sur la règle de réseau virtuel." } }
    - { id: c, text: { en: "Replace the virtual network rule with an IP firewall rule for the address range of Subnet-Web.", fr: "Remplacer la règle de réseau virtuel par une règle de pare-feu IP pour la plage d'adresses de Subnet-Web." } }
    - { id: d, text: { en: "Enable the Microsoft.Sql service endpoint on every other subnet of the virtual network.", fr: "Activer le point de terminaison de service Microsoft.Sql sur tous les autres sous-réseaux du réseau virtuel." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When Allow Azure services and resources to access this server is enabled, the server accepts traffic from any subnet inside the Azure boundary, which Microsoft describes as excessive access. Setting it to No leaves the virtual network rule for Subnet-Web as the only way in.
    fr: |
      Quand Allow Azure services and resources to access this server est activé, le serveur accepte le trafic de n'importe quel sous-réseau dans le périmètre Azure, ce que Microsoft qualifie d'accès excessif. Le définir sur No laisse la règle de réseau virtuel de Subnet-Web comme seul accès.
  options:
    b: { en: "The flag only lets a virtual network rule exist before the endpoint is enabled; it doesn't remove other access.", fr: "L'indicateur permet seulement à une règle de réseau virtuel d'exister avant l'activation du point de terminaison ; il ne supprime pas d'autre accès." }
    c: { en: "Traffic through the service endpoint arrives with a private source and a subnet identity, which IP rules don't match; the Azure services setting would also stay enabled.", fr: "Le trafic qui passe par le point de terminaison de service arrive avec une source privée et une identité de sous-réseau, qu'aucune règle IP ne reconnaît ; de plus, le paramètre des services Azure resterait activé." }
    d: { en: "Enabling endpoints elsewhere doesn't revoke anything; the Azure services setting would still admit other resources.", fr: "Activer des points de terminaison ailleurs ne révoque rien ; le paramètre des services Azure admettrait toujours d'autres ressources." }
references:
  - title: Virtual Network Endpoints and Rules for Azure SQL Database - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/vnet-service-endpoint-rule-overview
