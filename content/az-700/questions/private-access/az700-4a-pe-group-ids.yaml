id: az700-4a-pe-group-ids
objective: "4.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin is planning private endpoints for four workloads. Each private endpoint must target only the subresource that the workload uses.

    Which target subresource should you select for each private endpoint? To answer, drag the appropriate subresources to the correct workloads. Each subresource may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin planifie des points de terminaison privés pour quatre charges de travail. Chaque point de terminaison privé doit cibler uniquement la sous-ressource utilisée par la charge de travail.

    Quelle sous-ressource cible devez-vous sélectionner pour chaque point de terminaison privé ? Pour répondre, faites glisser les sous-ressources appropriées vers les charges de travail correspondantes. Chaque sous-ressource peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: blob, text: blob }
    - { id: file, text: file }
    - { id: sqlserver, text: sqlServer }
    - { id: sql, text: Sql }
    - { id: vault, text: vault }
    - { id: sites, text: sites }
  targets:
    - id: t1
      text: { en: "Mount an Azure file share over SMB from a storage account", fr: "Monter un partage de fichiers Azure en SMB depuis un compte de stockage" }
    - id: t2
      text: { en: "Connect an application to an Azure SQL Database logical server", fr: "Connecter une application à un serveur logique Azure SQL Database" }
    - id: t3
      text: { en: "Read secrets from an Azure Key Vault", fr: "Lire des secrets dans un coffre Azure Key Vault" }
    - id: t4
      text: { en: "Call an HTTP-triggered function in an Azure Functions app", fr: "Appeler une fonction déclenchée par HTTP dans une application Azure Functions" }
answer:
  mapping: { t1: file, t2: sqlserver, t3: vault, t4: sites }
explanation:
  correct:
    en: |
      Each private-link resource exposes its own group IDs. Azure Files uses `file`, an Azure SQL Database logical server uses `sqlServer`, Key Vault uses `vault`, and App Service and Azure Functions apps use `sites`. `blob` is for Blob Storage, and `Sql` is the Azure Cosmos DB for NoSQL subresource.
    fr: |
      Chaque ressource de liaison privée expose ses propres ID de groupe. Azure Files utilise `file`, un serveur logique Azure SQL Database utilise `sqlServer`, Key Vault utilise `vault`, et les applications App Service et Azure Functions utilisent `sites`. `blob` sert au Stockage Blob, et `Sql` est la sous-ressource d'Azure Cosmos DB for NoSQL.
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
  - title: Azure Private Endpoint private DNS zone values
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
