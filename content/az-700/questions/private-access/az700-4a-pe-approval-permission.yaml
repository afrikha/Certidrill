id: az700-4a-pe-approval-permission
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum's network team creates private endpoints in a resource group named **RG-Net** and already has the permissions required to create them. The storage accounts that the endpoints target are in a resource group named **RG-Data**.

    Today, every private endpoint that the network team creates for a storage account in RG-Data stays in the Pending state until the storage team approves it. You are creating a custom role that will be assigned to the network team on RG-Data so that these connections are approved automatically. The role must follow the principle of least privilege.

    Which permission should the custom role include?
  fr: |
    L'équipe réseau d'Adatum crée des points de terminaison privés dans un groupe de ressources nommé **RG-Net** et dispose déjà des autorisations nécessaires pour les créer. Les comptes de stockage ciblés se trouvent dans un groupe de ressources nommé **RG-Data**.

    Aujourd'hui, chaque point de terminaison privé que l'équipe réseau crée pour un compte de stockage de RG-Data reste à l'état Pending jusqu'à ce que l'équipe de stockage l'approuve. Vous créez un rôle personnalisé qui sera attribué à l'équipe réseau sur RG-Data pour que ces connexions soient approuvées automatiquement. Le rôle doit respecter le principe du moindre privilège.

    Quelle autorisation le rôle personnalisé doit-il inclure ?
body:
  options:
    - { id: b, text: "Microsoft.Network/privateLinkServices/privateEndpointConnectionsApproval/action" }
    - { id: c, text: "Microsoft.Storage/storageAccounts/listKeys/action" }
    - { id: d, text: "Microsoft.Network/privateDnsZones/join/action" }
    - { id: a, text: "Microsoft.Storage/storageAccounts/privateEndpointConnectionsApproval/action" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A private endpoint connection is approved automatically when its creator has the permission `Microsoft.<Provider>/<resource_type>/privateEndpointConnectionsApproval/action` on the target resource. For storage accounts, the provider and resource type are `Microsoft.Storage/storageAccounts`.
    fr: |
      Une connexion de point de terminaison privé est approuvée automatiquement quand son auteur dispose de l'autorisation `Microsoft.<Provider>/<resource_type>/privateEndpointConnectionsApproval/action` sur la ressource cible. Pour les comptes de stockage, le fournisseur et le type de ressource sont `Microsoft.Storage/storageAccounts`.
  options:
    b: { en: "This permission applies to your own Private Link services, not to storage accounts.", fr: "Cette autorisation s'applique à vos propres services Private Link, pas aux comptes de stockage." }
    c: { en: "Listing the account keys grants data access, not approval of private endpoint connections, and violates least privilege.", fr: "Lister les clés du compte donne accès aux données, pas l'approbation des connexions de point de terminaison privé, et viole le moindre privilège." }
    d: { en: "Joining a private DNS zone is about DNS records, not about approving the connection.", fr: "Rejoindre une zone DNS privée concerne les enregistrements DNS, pas l'approbation de la connexion." }
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
