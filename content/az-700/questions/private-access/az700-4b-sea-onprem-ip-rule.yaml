id: az700-4b-sea-onprem-ip-rule
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a storage account named **stcontosohr** in the West Europe region. Public network access is set to **Enabled from selected virtual networks and IP addresses**, with a virtual network rule for a subnet named **Subnet1**. The Microsoft.Storage service endpoint is enabled on Subnet1.

    The on-premises network (192.168.0.0/16) is connected to the virtual network of Subnet1 by a site-to-site VPN. On-premises users reach the internet through a firewall whose public IP addresses are 203.0.113.0/28.

    You need to allow on-premises users to access stcontosohr. The solution must not use private endpoints.

    What should you do?
  fr: |
    Contoso dispose d'un compte de stockage nommé **stcontosohr** dans la région West Europe. L'accès réseau public a la valeur **Enabled from selected virtual networks and IP addresses**, avec une règle de réseau virtuel pour un sous-réseau nommé **Subnet1**. Le point de terminaison de service Microsoft.Storage est activé sur Subnet1.

    Le réseau local (192.168.0.0/16) est relié au réseau virtuel de Subnet1 par un VPN de site à site. Les utilisateurs locaux accèdent à Internet via un pare-feu dont les adresses IP publiques sont 203.0.113.0/28.

    Vous devez permettre aux utilisateurs locaux d'accéder à stcontosohr. La solution ne doit pas utiliser de points de terminaison privés.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add an IP network rule for 192.168.0.0/16 to stcontosohr.", fr: "Ajouter une règle de réseau IP pour 192.168.0.0/16 à stcontosohr." } }
    - { id: b, text: { en: "Enable the Microsoft.Storage service endpoint on GatewaySubnet, and add a virtual network rule for GatewaySubnet.", fr: "Activer le point de terminaison de service Microsoft.Storage sur GatewaySubnet, et ajouter une règle de réseau virtuel pour GatewaySubnet." } }
    - { id: c, text: { en: "Add an IP network rule for 203.0.113.0/28 to stcontosohr.", fr: "Ajouter une règle de réseau IP pour 203.0.113.0/28 à stcontosohr." } }
    - { id: d, text: { en: "Replace the Microsoft.Storage service endpoint of Subnet1 with Microsoft.Storage.Global.", fr: "Remplacer le point de terminaison de service Microsoft.Storage de Subnet1 par Microsoft.Storage.Global." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Resources secured with service endpoints aren't reachable from on-premises, because service endpoints don't apply to on-premises traffic. On-premises users reach the public endpoint of the account from the public addresses of their internet firewall, so an IP network rule for 203.0.113.0/28 allows them alongside the virtual network rule.
    fr: |
      Les ressources sécurisées par des points de terminaison de service ne sont pas joignables depuis le réseau local, car les points de terminaison de service ne s'appliquent pas au trafic local. Les utilisateurs locaux atteignent le point de terminaison public du compte depuis les adresses publiques de leur pare-feu internet : une règle de réseau IP pour 203.0.113.0/28 les autorise, en plus de la règle de réseau virtuel.
  options:
    a: { en: "IP network rules accept only public internet addresses; private RFC 1918 ranges are rejected.", fr: "Les règles de réseau IP n'acceptent que des adresses internet publiques ; les plages privées RFC 1918 sont refusées." }
    b: { en: "Service endpoints can't carry traffic that comes from on-premises, even through the gateway subnet.", fr: "Les points de terminaison de service ne peuvent pas transporter le trafic qui vient du réseau local, même via le sous-réseau de passerelle." }
    d: { en: "Microsoft.Storage.Global extends the endpoint to accounts in other regions; it still applies only to traffic from the subnet.", fr: "Microsoft.Storage.Global étend le point de terminaison aux comptes d'autres régions ; il ne s'applique toujours qu'au trafic du sous-réseau." }
references:
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
  - title: "Guidelines & limitations: Azure Storage firewall"
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security-limitations
