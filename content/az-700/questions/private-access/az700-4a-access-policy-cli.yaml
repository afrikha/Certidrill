id: az700-4a-access-policy-cli
objective: "4.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum has a subnet named **snet-endpoints** in a virtual network named **VNet-Core**. The subnet contains private endpoints and virtual machines. A network security group associated with the subnet is designed for the virtual machines only.

    You need to ensure that the user-defined routes of the route table associated with snet-endpoints apply to the private endpoints. The rules of the network security group must not apply to the private endpoints.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un sous-réseau nommé **snet-endpoints** dans un réseau virtuel nommé **VNet-Core**. Le sous-réseau contient des points de terminaison privés et des machines virtuelles. Un groupe de sécurité réseau associé au sous-réseau est conçu uniquement pour les machines virtuelles.

    Vous devez faire en sorte que les itinéraires définis par l'utilisateur de la table de routage associée à snet-endpoints s'appliquent aux points de terminaison privés. Les règles du groupe de sécurité réseau ne doivent pas s'appliquer aux points de terminaison privés.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    [[cmd]] \
      --resource-group RG-Core \
      --vnet-name VNet-Core \
      --name snet-endpoints \
      [[param]] [[value]]
  slots:
    - id: cmd
      options:
        - { id: subnet, text: az network vnet subnet update }
        - { id: pe, text: az network private-endpoint update }
        - { id: nic, text: az network nic update }
        - { id: vnet, text: az network vnet update }
    - id: param
      options:
        - { id: pepol, text: "--private-endpoint-network-policies" }
        - { id: plspol, text: "--private-link-service-network-policies" }
        - { id: rt, text: "--route-table" }
    - id: value
      options:
        - { id: rte, text: RouteTableEnabled }
        - { id: nsge, text: NetworkSecurityGroupEnabled }
        - { id: en, text: Enabled }
        - { id: dis, text: Disabled }
answer:
  values: { cmd: subnet, param: pepol, value: rte }
explanation:
  correct:
    en: |
      The network policy for private endpoints is a property of the subnet, set with `az network vnet subnet update --private-endpoint-network-policies`. `RouteTableEnabled` applies user-defined routes to the private endpoints of the subnet while NSG rules keep being ignored for them; `Enabled` would apply both.
    fr: |
      La stratégie réseau des points de terminaison privés est une propriété du sous-réseau, définie avec `az network vnet subnet update --private-endpoint-network-policies`. `RouteTableEnabled` applique les itinéraires définis par l'utilisateur aux points de terminaison privés du sous-réseau, tandis que les règles NSG restent ignorées pour eux ; `Enabled` appliquerait les deux.
  options:
    pe: { en: "The policy isn't a property of the private endpoint but of its subnet.", fr: "La stratégie n'est pas une propriété du point de terminaison privé, mais de son sous-réseau." }
    nic: { en: "The network interface of a private endpoint is read-only and doesn't carry the policy.", fr: "L'interface réseau d'un point de terminaison privé est en lecture seule et ne porte pas la stratégie." }
    plspol: { en: "This setting concerns the NAT IP addresses of a Private Link service.", fr: "Ce paramètre concerne les adresses IP NAT d'un service Private Link." }
    rt: { en: "The route table is already associated; associating it doesn't make it apply to private endpoints.", fr: "La table de routage est déjà associée ; l'associer ne la fait pas s'appliquer aux points de terminaison privés." }
    nsge: { en: "NetworkSecurityGroupEnabled applies the NSG, not the route table.", fr: "NetworkSecurityGroupEnabled applique le NSG, pas la table de routage." }
    en: { en: "Enabled also applies the NSG rules, which must not apply.", fr: "Enabled applique aussi les règles NSG, qui ne doivent pas s'appliquer." }
references:
  - title: Manage network policies for private endpoints
    url: https://learn.microsoft.com/en-us/azure/private-link/disable-private-endpoint-network-policy
