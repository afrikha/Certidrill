status: draft
stem:
  en: You filter the outbound traffic of Subnet1 with an NSG that uses a Storage service tag.
  fr: Vous filtrez le trafic sortant de Subnet1 avec un NSG qui utilise une étiquette de service Storage.
body:
  solution:
    en: |
      You associate a network security group with Subnet1. It contains an outbound rule with priority 100 that allows TCP 443 to the `Storage.WestEurope` service tag, and an outbound rule with priority 200 that denies all traffic to the `Storage` service tag.
    fr: |
      Vous associez à Subnet1 un groupe de sécurité réseau. Il contient une règle de sécurité sortante de priorité 100 qui autorise TCP 443 vers l'étiquette de service `Storage.WestEurope`, et une règle de sécurité sortante de priorité 200 qui refuse tout trafic vers l'étiquette de service `Storage`.
answer: { value: false }
explanation:
  correct:
    en: |
      A service tag restricts outbound traffic to the Azure Storage service of a region, but it still allows any storage account in that region, including accounts in other subscriptions. Only a service endpoint policy can limit access to specific storage accounts.
    fr: |
      Une étiquette de service limite le trafic sortant au service Stockage Azure d'une région, mais elle autorise toujours n'importe quel compte de stockage de cette région, y compris ceux d'autres abonnements. Seule une stratégie de point de terminaison de service peut limiter l'accès à des comptes de stockage précis.
references:
  - title: Azure virtual network service endpoint policies
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoint-policies-overview
