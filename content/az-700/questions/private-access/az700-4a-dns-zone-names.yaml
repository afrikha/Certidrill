id: az700-4a-dns-zone-names
objective: "4.1.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware is creating private endpoints in the Azure public cloud for the following resources and wants to use the recommended private DNS zone names.

    Which private DNS zone should you use for each private endpoint? To answer, drag the appropriate zones to the correct resources. Each zone may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware crée des points de terminaison privés dans le cloud public Azure pour les ressources suivantes et souhaite utiliser les noms de zones DNS privées recommandés.

    Quelle zone DNS privée devez-vous utiliser pour chaque point de terminaison privé ? Pour répondre, faites glisser les zones appropriées vers les ressources correspondantes. Chaque zone peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sqldb, text: privatelink.database.windows.net }
    - { id: cosmos, text: privatelink.documents.azure.com }
    - { id: web, text: privatelink.azurewebsites.net }
    - { id: queue, text: privatelink.queue.core.windows.net }
    - { id: sb, text: privatelink.servicebus.windows.net }
    - { id: pg, text: privatelink.postgres.database.azure.com }
  targets:
    - id: t1
      text: { en: "Azure SQL Database logical server (sqlServer)", fr: "Serveur logique Azure SQL Database (sqlServer)" }
    - id: t2
      text: { en: "Azure Cosmos DB for NoSQL account (Sql)", fr: "Compte Azure Cosmos DB for NoSQL (Sql)" }
    - id: t3
      text: { en: "App Service web app (sites)", fr: "Application web App Service (sites)" }
    - id: t4
      text: { en: "Storage account queue service (queue)", fr: "Service de file d'attente d'un compte de stockage (queue)" }
answer:
  mapping: { t1: sqldb, t2: cosmos, t3: web, t4: queue }
explanation:
  correct:
    en: |
      Each private-link subresource has a recommended `privatelink` zone: `privatelink.database.windows.net` for Azure SQL Database, `privatelink.documents.azure.com` for Cosmos DB (Sql), `privatelink.azurewebsites.net` for App Service, and `privatelink.queue.core.windows.net` for queues. The Service Bus and PostgreSQL flexible server zones belong to other services.
    fr: |
      Chaque sous-ressource de liaison privée a une zone `privatelink` recommandée : `privatelink.database.windows.net` pour Azure SQL Database, `privatelink.documents.azure.com` pour Cosmos DB (Sql), `privatelink.azurewebsites.net` pour App Service, et `privatelink.queue.core.windows.net` pour les files d'attente. Les zones de Service Bus et de PostgreSQL serveur flexible appartiennent à d'autres services.
references:
  - title: Azure Private Endpoint private DNS zone values
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
