id: az700-4a-pls-settings-dragdrop
objective: "4.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove is creating a Private Link service named **pls-statements** for a statement-download application. The following requirements must be met:

    - Only the subscriptions of Fabrikam and Tailspin can find the service and request a connection.
    - Requests from Fabrikam's subscription are approved without any action by Woodgrove.
    - The application must log the original source IP address of each consumer and the link ID of its private endpoint.
    - The service must support more concurrent TCP connections from consumers.

    Which setting of pls-statements should you configure for each requirement? To answer, drag the appropriate settings to the correct requirements. Each setting may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove crée un service Private Link nommé **pls-statements** pour une application de téléchargement de relevés. Les exigences suivantes doivent être respectées :

    - Seuls les abonnements de Fabrikam et de Tailspin peuvent trouver le service et demander une connexion.
    - Les demandes provenant de l'abonnement de Fabrikam sont approuvées sans aucune action de Woodgrove.
    - L'application doit journaliser l'adresse IP source d'origine de chaque consommateur et l'ID de lien de son point de terminaison privé.
    - Le service doit prendre en charge davantage de connexions TCP simultanées provenant des consommateurs.

    Quel paramètre de pls-statements devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vis, text: { en: "Visibility", fr: "Visibilité (Visibility)" } }
    - { id: auto, text: { en: "Auto-approval", fr: "Approbation automatique (Auto-approval)" } }
    - { id: proxy, text: TCP proxy v2 }
    - { id: nat, text: { en: "Additional NAT IP addresses", fr: "Adresses IP NAT supplémentaires" } }
    - { id: fe, text: { en: "Load balancer frontend IP configuration", fr: "Configuration IP frontale de l'équilibreur de charge" } }
    - { id: pepol, text: { en: "Private endpoint network policies", fr: "Stratégies réseau des points de terminaison privés" } }
  targets:
    - id: t1
      text: { en: "Only Fabrikam and Tailspin can find the service and request a connection", fr: "Seuls Fabrikam et Tailspin peuvent trouver le service et demander une connexion" }
    - id: t2
      text: { en: "Fabrikam's requests are approved without action", fr: "Les demandes de Fabrikam sont approuvées sans intervention" }
    - id: t3
      text: { en: "Log the consumer's source IP address and private endpoint link ID", fr: "Journaliser l'adresse IP source du consommateur et l'ID de lien du point de terminaison privé" }
    - id: t4
      text: { en: "Support more concurrent TCP connections", fr: "Prendre en charge davantage de connexions TCP simultanées" }
answer:
  mapping: { t1: vis, t2: auto, t3: proxy, t4: nat }
explanation:
  correct:
    en: |
      Visibility set to **Restricted by subscription** controls who can see the service and request a connection, and auto-approval lists the subscriptions (a subset of the visibility list) whose requests are approved automatically. TCP proxy v2 adds a PROXY protocol header with the consumer's source IP and the private endpoint's link ID; the application must parse it. Each additional NAT IP address (up to eight) provides more ports for TCP connections.
    fr: |
      La visibilité réglée sur **Restricted by subscription** contrôle qui peut voir le service et demander une connexion, et l'approbation automatique liste les abonnements (un sous-ensemble de la liste de visibilité) dont les demandes sont approuvées automatiquement. TCP proxy v2 ajoute un en-tête de protocole PROXY contenant l'adresse IP source du consommateur et l'ID de lien du point de terminaison privé ; l'application doit l'analyser. Chaque adresse IP NAT supplémentaire (jusqu'à huit) fournit davantage de ports pour les connexions TCP.
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
