id: az700-4b-onprem-resolver-component
objective: "4.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an on-premises network connected to an Azure virtual network named **VNet1** by an ExpressRoute circuit with private peering. VNet1 is linked to the private DNS zones of several private endpoints.

    You need to allow the on-premises DNS servers to resolve the records of the private DNS zones. The solution must not require you to deploy or maintain virtual machines.

    What should you deploy in VNet1?
  fr: |
    Fabrikam dispose d'un réseau local relié à un réseau virtuel Azure nommé **VNet1** par un circuit ExpressRoute avec peering privé. VNet1 est lié aux zones DNS privées de plusieurs points de terminaison privés.

    Vous devez permettre aux serveurs DNS locaux de résoudre les enregistrements des zones DNS privées. La solution ne doit pas vous obliger à déployer ni à maintenir des machines virtuelles.

    Que devez-vous déployer dans VNet1 ?
body:
  options:
    - { id: a, text: { en: "An Azure DNS Private Resolver with an outbound endpoint and a DNS forwarding ruleset", fr: "Un Azure DNS Private Resolver avec un point de terminaison sortant et un ensemble de règles de transfert DNS" } }
    - { id: b, text: { en: "An Azure DNS Private Resolver with an inbound endpoint", fr: "Un Azure DNS Private Resolver avec un point de terminaison entrant" } }
    - { id: c, text: { en: "A public DNS zone that contains copies of the private endpoint records", fr: "Une zone DNS publique qui contient une copie des enregistrements des points de terminaison privés" } }
    - { id: d, text: { en: "A virtual network link with autoregistration enabled on each private DNS zone", fr: "Un lien de réseau virtuel avec l'inscription automatique activée sur chaque zone DNS privée" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An inbound endpoint gives the resolver an IP address in VNet1 that on-premises DNS servers can reach over ExpressRoute; you configure it as the target of their conditional forwarders. The resolver answers with Azure DNS from VNet1, so the linked private zones are resolved, and the service is fully managed.
    fr: |
      Un point de terminaison entrant donne au résolveur une adresse IP dans VNet1 que les serveurs DNS locaux peuvent joindre via ExpressRoute ; vous la configurez comme cible de leurs redirecteurs conditionnels. Le résolveur répond avec Azure DNS depuis VNet1 : les zones privées liées sont donc résolues, et le service est entièrement managé.
  options:
    a: { en: "An outbound endpoint and a ruleset forward queries from Azure to other DNS servers, such as on-premises servers; they don't receive on-premises queries.", fr: "Un point de terminaison sortant et un ensemble de règles transfèrent des requêtes d'Azure vers d'autres serveurs DNS, par exemple locaux ; ils ne reçoivent pas les requêtes locales." }
    c: { en: "Publishing private IP addresses in a public zone exposes them on the internet and requires manual record maintenance.", fr: "Publier des adresses IP privées dans une zone publique les expose sur Internet et impose une maintenance manuelle des enregistrements." }
    d: { en: "Autoregistration registers virtual machines of the linked network; it doesn't make the zones resolvable from on-premises.", fr: "L'inscription automatique enregistre les machines virtuelles du réseau lié ; elle ne rend pas les zones résolubles depuis le réseau local." }
references:
  - title: Azure DNS Private Resolver Overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
