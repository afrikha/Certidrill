id: az700-cs4b-archive-access
objective: "4.1.1"
type: single
caseStudy: az700-cs4b-fernhill
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the archive requirement. What should you include in the solution?
  fr: |
    Vous devez respecter l'exigence relative à l'archive. Que devez-vous inclure dans la solution ?
body:
  options:
    - { id: a, text: { en: "A Microsoft.Storage service endpoint on GatewaySubnet and a virtual network rule on stfharchive", fr: "Un point de terminaison de service Microsoft.Storage sur GatewaySubnet et une règle de réseau virtuel sur stfharchive" } }
    - { id: b, text: { en: "Microsoft peering on ER-Paris with a route filter for Azure Storage in France Central", fr: "Le peering Microsoft sur ER-Paris avec un filtre de routage pour Stockage Azure dans France Central" } }
    - { id: c, text: { en: "A Private Link service in VNet-Data that targets the blob endpoint of stfharchive", fr: "Un service Private Link dans VNet-Data qui cible le point de terminaison blob de stfharchive" } }
    - { id: d, text: { en: "A private endpoint in VNet-Data for the blob subresource of stfharchive", fr: "Un point de terminaison privé dans VNet-Data pour la sous-ressource blob de stfharchive" } }
answer: { optionId: d }
explanation:
  correct:
    en: A private endpoint is a network interface with a private IP address from VNet-Data that maps to the blob service of stfharchive. The Paris datacenter reaches that address over Azure private peering through ERGW1 and the peering, so public network access can be disabled. The on-premises DNS must also resolve the storage account name to the private IP address of the endpoint.
    fr: |
      Un point de terminaison privé est une interface réseau dotée d'une adresse IP privée de VNet-Data qui correspond au service blob de stfharchive. Le centre de données de Paris atteint cette adresse par le peering privé Azure, via ERGW1 et le peering de réseaux virtuels : l'accès réseau public peut donc être désactivé. Le DNS local doit aussi résoudre le nom du compte de stockage vers l'adresse IP privée du point de terminaison.
  options:
    a: { en: "Service endpoints can't be used for traffic from on-premises to Azure services, and the account would still be reached on its public endpoint.", fr: "Les points de terminaison de service ne peuvent pas être utilisés pour le trafic de l'environnement local vers les services Azure, et le compte serait toujours atteint par son point de terminaison public." }
    b: { en: "Microsoft peering reaches the public endpoint of the storage account, which requirement 4 says must be disabled, and it doesn't use Azure private peering.", fr: "Le peering Microsoft atteint le point de terminaison public du compte de stockage, que l'exigence 4 impose de désactiver, et il n'utilise pas le peering privé Azure." }
    c: { en: "A Private Link service publishes your own service behind a Standard Load Balancer; consumers reach Azure PaaS resources such as Storage through private endpoints.", fr: "Un service Private Link publie votre propre service derrière un équilibreur de charge Standard ; les consommateurs atteignent des ressources PaaS Azure comme Stockage Azure par des points de terminaison privés." }
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
