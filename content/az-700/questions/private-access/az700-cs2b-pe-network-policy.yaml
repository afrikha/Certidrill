id: az700-cs2b-pe-network-policy
objective: "4.1.3"
type: single
caseStudy: az700-cs2b-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    VM-BATCH1 can connect to pe-sqlwwi on TCP 1433. You need to meet the requirement for pe-sqlwwi.

    What should you do?
  fr: |
    VM-BATCH1 peut se connecter à pe-sqlwwi sur TCP 1433. Vous devez respecter l'exigence relative à pe-sqlwwi.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add an inbound rule to NSG-PE that denies 10.41.3.0/24 at priority 200.", fr: "Ajouter à NSG-PE une règle entrante qui refuse 10.41.3.0/24 en priorité 200." } }
    - { id: b, text: { en: "Set Network policy for private endpoints on snet-pe to Network security groups.", fr: "Définir Network policy for private endpoints sur Network security groups pour snet-pe." } }
    - { id: c, text: { en: "Add a virtual network rule for snet-app to the networking settings of sqlwwi.", fr: "Ajouter une règle de réseau virtuel pour snet-app dans les paramètres réseau de sqlwwi." } }
    - { id: d, text: { en: "Add a service endpoint for Microsoft.Sql to snet-app and remove it from snet-batch.", fr: "Ajouter un point de terminaison de service pour Microsoft.Sql à snet-app et le retirer de snet-batch." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Network policies are disabled by default for private endpoints in a subnet, so the rules of NSG-PE don't apply to the traffic sent to pe-sqlwwi. Enabling network policy support for network security groups on snet-pe makes the existing rules apply, and the deny rule at priority 4000 then blocks snet-batch.
    fr: |
      Les stratégies réseau sont désactivées par défaut pour les points de terminaison privés d'un sous-réseau : les règles de NSG-PE ne s'appliquent donc pas au trafic envoyé à pe-sqlwwi. Activer la prise en charge des stratégies réseau pour les groupes de sécurité réseau sur snet-pe fait appliquer les règles existantes, et la règle de refus en priorité 4000 bloque alors snet-batch.
  options:
    a: { en: "While network policies are disabled on snet-pe, no rule of NSG-PE applies to private endpoint traffic, including a new deny rule.", fr: "Tant que les stratégies réseau sont désactivées sur snet-pe, aucune règle de NSG-PE ne s'applique au trafic du point de terminaison privé, y compris une nouvelle règle de refus." }
    c: { en: "Virtual network rules of the server apply to its public endpoint, which is disabled; they don't filter connections to its private endpoint.", fr: "Les règles de réseau virtuel du serveur s'appliquent à son point de terminaison public, qui est désactivé ; elles ne filtrent pas les connexions à son point de terminaison privé." }
    d: { en: "Service endpoints concern traffic to the public endpoint of the service; they don't filter access to a private endpoint.", fr: "Les points de terminaison de service concernent le trafic vers le point de terminaison public du service ; ils ne filtrent pas l'accès à un point de terminaison privé." }
references:
  - title: Manage network policies for private endpoints
    url: https://learn.microsoft.com/en-us/azure/private-link/disable-private-endpoint-network-policy
