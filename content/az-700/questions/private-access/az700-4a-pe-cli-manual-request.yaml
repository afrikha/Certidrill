id: az700-4a-pe-cli-manual-request
objective: "4.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure SQL Database logical server named **sql-payroll** that is managed by the database team. You have the Reader role on sql-payroll and the Network Contributor role on a virtual network named **VNet-HR**.

    You need to create a private endpoint for sql-payroll in the **snet-pe** subnet of VNet-HR. The database team must receive a request that identifies the payroll application, and they will decide whether to approve it.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un serveur logique Azure SQL Database nommé **sql-payroll**, géré par l'équipe des bases de données. Vous avez le rôle Reader sur sql-payroll et le rôle Network Contributor sur un réseau virtuel nommé **VNet-HR**.

    Vous devez créer un point de terminaison privé pour sql-payroll dans le sous-réseau **snet-pe** de VNet-HR. L'équipe des bases de données doit recevoir une demande qui identifie l'application de paie, et elle décidera de l'approuver ou non.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    sqlId=$(az sql server show --name sql-payroll --resource-group RG-DB --query id --output tsv)

    az network private-endpoint create \
      --resource-group RG-HR \
      --name pe-sql-payroll \
      --vnet-name VNet-HR \
      --subnet snet-pe \
      --private-connection-resource-id $sqlId \
      --group-id [[grp]] \
      --connection-name sql-payroll-hr \
      [[req]]
  slots:
    - id: grp
      options:
        - { id: sqlserver, text: sqlServer }
        - { id: sql, text: Sql }
        - { id: sites, text: sites }
        - { id: vault, text: vault }
    - id: req
      options:
        - { id: manual, text: "--manual-request true --request-message \"Payroll application\"" }
        - { id: auto, text: "--manual-request false" }
        - { id: nic, text: "--nic-name pe-sql-payroll-nic" }
        - { id: asg, text: "--asg asg-payroll" }
answer:
  values: { grp: sqlserver, req: manual }
explanation:
  correct:
    en: |
      The group ID of an Azure SQL Database logical server is `sqlServer`. Because you only have Reader on sql-payroll, you don't have the `privateEndpointConnectionsApproval/action` permission, so you create a manual request with `--manual-request true`; `--request-message` carries the text shown to the database team, which then approves or rejects the Pending connection.
    fr: |
      L'ID de groupe d'un serveur logique Azure SQL Database est `sqlServer`. Comme vous n'avez que Reader sur sql-payroll, vous ne disposez pas de l'autorisation `privateEndpointConnectionsApproval/action` : vous créez donc une demande manuelle avec `--manual-request true` ; `--request-message` porte le texte présenté à l'équipe des bases de données, qui approuve ou rejette ensuite la connexion en attente (Pending).
  options:
    sql: { en: "Sql is the Azure Cosmos DB for NoSQL subresource.", fr: "Sql est la sous-ressource d'Azure Cosmos DB for NoSQL." }
    sites: { en: "sites is the subresource of App Service and Azure Functions apps.", fr: "sites est la sous-ressource des applications App Service et Azure Functions." }
    vault: { en: "vault is the Azure Key Vault subresource.", fr: "vault est la sous-ressource d'Azure Key Vault." }
    auto: { en: "An automatic request needs the approval permission on sql-payroll, which Reader doesn't include.", fr: "Une demande automatique exige l'autorisation d'approbation sur sql-payroll, que Reader n'inclut pas." }
    nic: { en: "A custom network interface name doesn't send a request or a message to the resource owner.", fr: "Un nom d'interface réseau personnalisé n'envoie ni demande ni message au propriétaire de la ressource." }
    asg: { en: "An application security group is used for NSG rules, not for the connection request.", fr: "Un groupe de sécurité d'application sert aux règles NSG, pas à la demande de connexion." }
references:
  - title: az network private-endpoint
    url: https://learn.microsoft.com/en-us/cli/azure/network/private-endpoint
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
