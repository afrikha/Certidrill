id: az700-cs1b-sql-private
objective: "4.1.5"
type: multi
caseStudy: az700-cs1b-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the data requirements.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez respecter les exigences relatives aux données.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Create a private endpoint for the sqlServer subresource of sql-proseware in snet-pe.", fr: "Créer un point de terminaison privé pour la sous-ressource sqlServer de sql-proseware dans snet-pe." } }
    - { id: b, text: { en: "Enable a Microsoft.Sql service endpoint on snet-int and add a virtual network rule for snet-int to sql-proseware.", fr: "Activer un point de terminaison de service Microsoft.Sql sur snet-int et ajouter à sql-proseware une règle de réseau virtuel pour snet-int." } }
    - { id: c, text: { en: "Create a private DNS zone named privatelink.database.windows.net that contains the A record of the private endpoint, and link the zone to VNet-NE.", fr: "Créer une zone DNS privée nommée privatelink.database.windows.net qui contient l'enregistrement A du point de terminaison privé, et lier la zone à VNet-NE." } }
    - { id: d, text: { en: "Enable private endpoint network policies for route tables on snet-pe.", fr: "Activer les stratégies réseau de point de terminaison privé pour les tables de routage sur snet-pe." } }
    - { id: e, text: { en: "Disable public network access on sql-proseware.", fr: "Désactiver l'accès au réseau public sur sql-proseware." } }
    - { id: f, text: { en: "Change the server name in the connection string to sql-proseware.privatelink.database.windows.net.", fr: "Remplacer le nom de serveur de la chaîne de connexion par sql-proseware.privatelink.database.windows.net." } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: The private endpoint gives sql-proseware a private IP address in VNet-NE, which app-portal-ne reaches through its virtual network integration. The public name sql-proseware.database.windows.net is a CNAME to the privatelink name, so a privatelink.database.windows.net zone linked to VNet-NE makes the unchanged server name resolve to the private IP address. Disabling public network access makes the server refuse every connection that doesn't come through a private endpoint.
    fr: Le point de terminaison privé donne à sql-proseware une adresse IP privée dans VNet-NE, qu'app-portal-ne atteint par son intégration au réseau virtuel. Le nom public sql-proseware.database.windows.net est un CNAME vers le nom privatelink ; une zone privatelink.database.windows.net liée à VNet-NE fait donc résoudre le nom de serveur inchangé en adresse IP privée. Désactiver l'accès au réseau public fait refuser au serveur toute connexion qui ne passe pas par un point de terminaison privé.
  options:
    b:
      en: A service endpoint keeps the traffic on the public endpoint of the server, which must then stay enabled for selected networks; the server isn't reached through a private IP address.
      fr: Un point de terminaison de service conserve le trafic sur le point de terminaison public du serveur, qui doit alors rester activé pour des réseaux sélectionnés ; le serveur n'est pas joint par une adresse IP privée.
    d:
      en: Private endpoint network policies only let route tables (or NSGs) apply to private endpoint traffic. No route table is involved here, and the setting provides neither the private IP address nor the name resolution.
      fr: Les stratégies réseau de point de terminaison privé permettent seulement aux tables de routage (ou aux NSG) de s'appliquer au trafic des points de terminaison privés. Aucune table de routage n'intervient ici, et ce paramètre ne fournit ni l'adresse IP privée ni la résolution de noms.
    f:
      en: The connection string must not change, and Azure SQL Database rejects logins made through the privatelink FQDN; clients keep using the server's standard name.
      fr: La chaîne de connexion ne doit pas changer, et Azure SQL Database rejette les connexions établies avec le FQDN privatelink ; les clients conservent le nom standard du serveur.
references:
  - title: Azure Private Endpoint private DNS zone values
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns
  - title: Azure Private Link for Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/private-endpoint-overview
