id: az700-4a-pe-cli-static-ip
objective: "4.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Proseware has a web app named **app-proseware-portal** in a resource group named **RG-Web**. You need to create a private endpoint for the app in the **snet-pe** subnet (10.30.2.0/24) of a virtual network named **VNet-Web**.

    The security team requires that:

    - the network interface of the private endpoint is named **nic-pe-portal**;
    - the private endpoint always uses the IP address 10.30.2.10.

    How should you complete the Azure CLI script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'une application web nommée **app-proseware-portal** dans un groupe de ressources nommé **RG-Web**. Vous devez créer un point de terminaison privé pour l'application dans le sous-réseau **snet-pe** (10.30.2.0/24) d'un réseau virtuel nommé **VNet-Web**.

    L'équipe de sécurité exige que :

    - l'interface réseau du point de terminaison privé soit nommée **nic-pe-portal** ;
    - le point de terminaison privé utilise toujours l'adresse IP 10.30.2.10.

    Comment devez-vous compléter le script Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    id=$(az webapp show --name app-proseware-portal --resource-group RG-Web --query [[q]] --output tsv)

    az network private-endpoint create \
      --resource-group RG-Web \
      --name pe-portal \
      --vnet-name VNet-Web \
      --subnet snet-pe \
      --private-connection-resource-id $id \
      --group-id sites \
      --connection-name portal-conn \
      [[nic]] nic-pe-portal \
      [[ip]] name=ipconfig-1 group-id=sites member-name=sites private-ip-address=10.30.2.10
  slots:
    - id: q
      options:
        - { id: id, text: id }
        - { id: name, text: name }
        - { id: host, text: defaultHostName }
        - { id: rg, text: resourceGroup }
    - id: nic
      options:
        - { id: nicname, text: "--nic-name" }
        - { id: conn, text: "--connection-name" }
        - { id: asg, text: "--asg" }
        - { id: edge, text: "--edge-zone" }
    - id: ip
      options:
        - { id: ipconfig, text: "--ip-config" }
        - { id: appgw, text: "--app-gateway-ip-configs" }
        - { id: ipver, text: "--ip-version-type" }
        - { id: reqmsg, text: "--request-message" }
answer:
  values: { q: id, nic: nicname, ip: ipconfig }
explanation:
  correct:
    en: |
      `--private-connection-resource-id` expects the resource ID of the web app, returned by the `id` property. The custom network interface name and the static IP address can only be set when the private endpoint is created: `--nic-name` names the interface, and `--ip-config` defines an IP configuration with the group ID, the member name and the static private IP address.
    fr: |
      `--private-connection-resource-id` attend l'ID de ressource de l'application web, renvoyé par la propriété `id`. Le nom personnalisé de l'interface réseau et l'adresse IP statique ne peuvent être définis qu'à la création du point de terminaison privé : `--nic-name` nomme l'interface, et `--ip-config` définit une configuration IP avec l'ID de groupe, le nom de membre et l'adresse IP privée statique.
  options:
    name: { en: "The name alone isn't a resource ID.", fr: "Le nom seul n'est pas un ID de ressource." }
    host: { en: "The default host name is the app's FQDN, not its resource ID.", fr: "Le nom d'hôte par défaut est le FQDN de l'application, pas son ID de ressource." }
    conn: { en: "--connection-name names the private link service connection, already set in the command.", fr: "--connection-name nomme la connexion de service Private Link, déjà définie dans la commande." }
    appgw: { en: "--app-gateway-ip-configs refers to Application Gateway IP configurations, not to the endpoint's own static address.", fr: "--app-gateway-ip-configs désigne des configurations IP d'Application Gateway, pas l'adresse statique du point de terminaison." }
    ipver: { en: "--ip-version-type chooses IPv4, IPv6 or dual stack; it doesn't set an address.", fr: "--ip-version-type choisit IPv4, IPv6 ou double pile ; il ne définit pas d'adresse." }
references:
  - title: "Quickstart: Create a private endpoint by using the Azure CLI"
    url: https://learn.microsoft.com/en-us/azure/private-link/create-private-endpoint-cli
  - title: Manage Azure private endpoints
    url: https://learn.microsoft.com/en-us/azure/private-link/manage-private-endpoint
