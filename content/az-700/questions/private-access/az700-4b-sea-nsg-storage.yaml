id: az700-4b-sea-nsg-storage
objective: "4.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a subnet named **Subnet-Batch** in the West Europe region. The Microsoft.Storage service endpoint is enabled on Subnet-Batch, and the storage accounts used by the subnet allow it through virtual network rules.

    You associate a new network security group named **NSG-Batch** with Subnet-Batch. You need to configure NSG-Batch to meet the following requirements:

    - Virtual machines in Subnet-Batch can connect to Azure Storage in West Europe over HTTPS.
    - Virtual machines in Subnet-Batch can't connect to any other internet destination.
    - Traffic inside the virtual network isn't affected.

    Which two outbound security rules should you create? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un sous-réseau nommé **Subnet-Batch** dans la région West Europe. Le point de terminaison de service Microsoft.Storage est activé sur Subnet-Batch, et les comptes de stockage utilisés par le sous-réseau l'autorisent par des règles de réseau virtuel.

    Vous associez un nouveau groupe de sécurité réseau nommé **NSG-Batch** à Subnet-Batch. Vous devez configurer NSG-Batch pour répondre aux exigences suivantes :

    - Les machines virtuelles de Subnet-Batch peuvent se connecter à Stockage Azure en West Europe en HTTPS.
    - Les machines virtuelles de Subnet-Batch ne peuvent se connecter à aucune autre destination internet.
    - Le trafic interne au réseau virtuel n'est pas affecté.

    Quelles sont les deux règles de sécurité sortantes que vous devez créer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Priority 100: allow TCP 443 to the Storage.WestEurope service tag", fr: "Priorité 100 : autoriser TCP 443 vers l'étiquette de service Storage.WestEurope" } }
    - { id: b, text: { en: "Priority 90: deny any protocol to the Internet service tag", fr: "Priorité 90 : refuser tout protocole vers l'étiquette de service Internet" } }
    - { id: c, text: { en: "Priority 200: deny any protocol to the Internet service tag", fr: "Priorité 200 : refuser tout protocole vers l'étiquette de service Internet" } }
    - { id: d, text: { en: "Priority 200: deny any protocol to the VirtualNetwork service tag", fr: "Priorité 200 : refuser tout protocole vers l'étiquette de service VirtualNetwork" } }
    - { id: e, text: { en: "Priority 4000: allow TCP 443 to the Storage.WestEurope service tag", fr: "Priorité 4000 : autoriser TCP 443 vers l'étiquette de service Storage.WestEurope" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The default AllowInternetOutBound rule lets all internet traffic leave, so you need a deny rule for the Internet tag. Azure Storage addresses are part of the Internet tag, so the allow rule for Storage.WestEurope must have a lower priority number (100) than the deny rule (200) to be evaluated first; the default AllowVnetOutBound rule keeps internal traffic working.
    fr: |
      La règle par défaut AllowInternetOutBound laisse sortir tout le trafic internet : il faut donc une règle de refus pour l'étiquette Internet. Les adresses de Stockage Azure font partie de l'étiquette Internet : la règle d'autorisation pour Storage.WestEurope doit avoir un numéro de priorité plus petit (100) que la règle de refus (200) pour être évaluée en premier ; la règle par défaut AllowVnetOutBound maintient le trafic interne.
  options:
    b: { en: "With priority 90, the deny rule is evaluated before the storage allow rule and blocks Azure Storage too.", fr: "Avec la priorité 90, la règle de refus est évaluée avant la règle d'autorisation du stockage et bloque aussi Stockage Azure." }
    d: { en: "Denying the VirtualNetwork tag would break traffic inside the virtual network.", fr: "Refuser l'étiquette VirtualNetwork casserait le trafic interne au réseau virtuel." }
    e: { en: "With priority 4000, the allow rule is evaluated after the internet deny rule, so storage traffic is already denied.", fr: "Avec la priorité 4000, la règle d'autorisation est évaluée après la règle de refus internet : le trafic de stockage est déjà refusé." }
references:
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
  - title: "Tutorial: Restrict access to PaaS resources with service endpoints"
    url: https://learn.microsoft.com/en-us/azure/virtual-network/tutorial-restrict-network-access-to-resources
