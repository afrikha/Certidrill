id: az700-4a-pls-lb-requirements
objective: "4.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to publish an inventory application to customers in other Microsoft Entra tenants by using a Private Link service. The Private Link service will be attached to the frontend IP configuration of a load balancer named **lb-inventory** in West Europe. Customers' virtual networks are in several regions, and some of them use the same address space as Proseware.

    Which two requirements must lb-inventory meet?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit de publier une application d'inventaire auprès de clients situés dans d'autres locataires Microsoft Entra au moyen d'un service Private Link. Le service Private Link sera attaché à la configuration IP frontale d'un équilibreur de charge nommé **lb-inventory** dans West Europe. Les réseaux virtuels des clients se trouvent dans plusieurs régions, et certains utilisent le même espace d'adressage que Proseware.

    À quelles deux exigences lb-inventory doit-il répondre ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: c, text: { en: "Be deployed in the same region as each customer's virtual network.", fr: "Être déployé dans la même région que le réseau virtuel de chaque client." } }
    - { id: a, text: { en: "Use the Standard SKU.", fr: "Utiliser la référence SKU Standard." } }
    - { id: d, text: { en: "Use an address space that doesn't overlap with the customers' networks.", fr: "Utiliser un espace d'adressage qui ne chevauche pas les réseaux des clients." } }
    - { id: e, text: { en: "Have an inbound NAT rule for each customer.", fr: "Disposer d'une règle NAT de trafic entrant pour chaque client." } }
    - { id: b, text: { en: "Define its backend pool by network interface.", fr: "Définir son pool principal par interface réseau." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      A Private Link service runs behind a Standard load balancer; the Basic SKU isn't supported. The backend pool must be configured by network interface, because backend pools configured by IP address aren't supported.
    fr: |
      Un service Private Link s'exécute derrière un équilibreur de charge Standard ; la référence SKU Basic n'est pas prise en charge. Le pool principal doit être configuré par interface réseau, car les pools principaux configurés par adresse IP ne sont pas pris en charge.
  options:
    c: { en: "The service must be in the region of its load balancer, but consumers can connect from private endpoints in any public region.", fr: "Le service doit être dans la région de son équilibreur de charge, mais les consommateurs peuvent se connecter depuis des points de terminaison privés de n'importe quelle région publique." }
    d: { en: "The Private Link service applies NAT, so overlapping consumer address spaces aren't a problem.", fr: "Le service Private Link applique une NAT : le chevauchement des espaces d'adressage des consommateurs ne pose pas de problème." }
    e: { en: "Consumers reach the service through load-balancing rules; per-customer inbound NAT rules aren't required.", fr: "Les consommateurs atteignent le service via les règles d'équilibrage de charge ; aucune règle NAT de trafic entrant par client n'est nécessaire." }
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
