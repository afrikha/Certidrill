id: az700-4b-hybrid-dns-statements
objective: "4.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an on-premises network connected to a virtual network named **VNet-Hub** by a site-to-site VPN. VNet-Hub has the following subnets:

    | Subnet | Address range | Content |
    | --- | --- | --- |
    | GatewaySubnet | 10.20.0.0/27 | VPN gateway |
    | snet-dns-in | 10.20.1.0/28 | Inbound endpoint of an Azure DNS Private Resolver |
    | snet-pe | 10.20.2.0/24 | Private endpoint of the key vault **kv-tailspin** |

    The private DNS zone `privatelink.vaultcore.azure.net` is linked to VNet-Hub. The on-premises DNS servers forward `vaultcore.azure.net` to the inbound endpoint.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un réseau local relié à un réseau virtuel nommé **VNet-Hub** par un VPN de site à site. VNet-Hub contient les sous-réseaux suivants :

    | Sous-réseau | Plage d'adresses | Contenu |
    | --- | --- | --- |
    | GatewaySubnet | 10.20.0.0/27 | Passerelle VPN |
    | snet-dns-in | 10.20.1.0/28 | Point de terminaison entrant d'un Azure DNS Private Resolver |
    | snet-pe | 10.20.2.0/24 | Point de terminaison privé du coffre de clés **kv-tailspin** |

    La zone DNS privée `privatelink.vaultcore.azure.net` est liée à VNet-Hub. Les serveurs DNS locaux transfèrent `vaultcore.azure.net` vers le point de terminaison entrant.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can replace the inbound endpoint as the target of the on-premises forwarder with 168.63.129.16.
        fr: |
          Vous pouvez remplacer le point de terminaison entrant par 168.63.129.16 comme cible du redirecteur local.
    - id: s2
      text:
        en: |
          On-premises clients can reach the private IP address of the kv-tailspin private endpoint through the site-to-site VPN.
        fr: |
          Les clients locaux peuvent joindre l'adresse IP privée du point de terminaison privé de kv-tailspin via le VPN de site à site.
    - id: s3
      text:
        en: |
          You can create a second private endpoint, for a storage account, in snet-dns-in.
        fr: |
          Vous pouvez créer un second point de terminaison privé, pour un compte de stockage, dans snet-dns-in.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      168.63.129.16 answers only queries that come from inside an Azure virtual network, which is why on-premises servers forward to the resolver's inbound endpoint. A private endpoint can be reached from on-premises over VPN or ExpressRoute, because its address belongs to the virtual network. The subnet of a resolver endpoint is delegated to Microsoft.Network/dnsResolvers and can't host other services, so the second private endpoint must go in another subnet such as snet-pe.
    fr: |
      168.63.129.16 ne répond qu'aux requêtes qui proviennent d'un réseau virtuel Azure : c'est pourquoi les serveurs locaux transfèrent vers le point de terminaison entrant du résolveur. Un point de terminaison privé est joignable depuis le réseau local via un VPN ou ExpressRoute, car son adresse appartient au réseau virtuel. Le sous-réseau d'un point de terminaison du résolveur est délégué à Microsoft.Network/dnsResolvers et ne peut pas héberger d'autres services : le second point de terminaison privé doit aller dans un autre sous-réseau, comme snet-pe.
references:
  - title: Azure DNS Private Resolver Overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
  - title: What is a private endpoint? - Azure Private Link
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
