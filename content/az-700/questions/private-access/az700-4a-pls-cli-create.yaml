id: az700-4a-pls-cli-create
objective: "4.1.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind has a Standard internal load balancer named **lb-claims** with a frontend IP configuration named **fe-claims** in a virtual network named **VNet-Claims**. The NAT IP addresses of a new Private Link service must come from a subnet named **snet-pls**.

    You need to create the Private Link service by using the Azure CLI. Only the subscriptions of two insurers, Sub-Fabrikam and Sub-Tailspin, must be able to see the service, and requests from Sub-Fabrikam must be approved automatically.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un équilibreur de charge interne Standard nommé **lb-claims**, avec une configuration IP frontale nommée **fe-claims**, dans un réseau virtuel nommé **VNet-Claims**. Les adresses IP NAT d'un nouveau service Private Link doivent provenir d'un sous-réseau nommé **snet-pls**.

    Vous devez créer le service Private Link avec Azure CLI. Seuls les abonnements de deux assureurs, Sub-Fabrikam et Sub-Tailspin, doivent pouvoir voir le service, et les demandes de Sub-Fabrikam doivent être approuvées automatiquement.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network vnet subnet update \
      --resource-group RG-Claims \
      --vnet-name VNet-Claims \
      --name snet-pls \
      [[pol]] Disabled

    az network private-link-service create \
      --resource-group RG-Claims \
      --name pls-claims \
      --vnet-name VNet-Claims \
      --subnet snet-pls \
      --lb-name lb-claims \
      [[fe]] fe-claims \
      [[vis]] $subFabrikam $subTailspin \
      --auto-approval $subFabrikam
  slots:
    - id: pol
      options:
        - { id: plspol, text: "--private-link-service-network-policies" }
        - { id: pepol, text: "--private-endpoint-network-policies" }
        - { id: nsg, text: "--nsg" }
        - { id: rt, text: "--route-table" }
    - id: fe
      options:
        - { id: lbfe, text: "--lb-frontend-ip-configs" }
        - { id: ipconf, text: "--ip-configurations" }
        - { id: privip, text: "--private-ip-address" }
        - { id: dest, text: "--destination-ip-address" }
    - id: vis
      options:
        - { id: visibility, text: "--visibility" }
        - { id: fqdns, text: "--fqdns" }
        - { id: edge, text: "--edge-zone" }
        - { id: tags, text: "--tags" }
answer:
  values: { pol: plspol, fe: lbfe, vis: visibility }
explanation:
  correct:
    en: |
      Outside the portal, `privateLinkServiceNetworkPolicies` must be set to `Disabled` on the subnet that provides the NAT IP addresses. `--lb-frontend-ip-configs` attaches the service to the load balancer frontend (by name together with `--lb-name`). `--visibility` lists the subscriptions that can see the service, and `--auto-approval` lists the subset approved automatically.
    fr: |
      En dehors du portail, `privateLinkServiceNetworkPolicies` doit être réglé sur `Disabled` sur le sous-réseau qui fournit les adresses IP NAT. `--lb-frontend-ip-configs` attache le service à la configuration frontale de l'équilibreur de charge (par nom, avec `--lb-name`). `--visibility` liste les abonnements qui peuvent voir le service, et `--auto-approval` liste le sous-ensemble approuvé automatiquement.
  options:
    pepol: { en: "This setting applies to private endpoints of the subnet, not to the Private Link service NAT IP addresses.", fr: "Ce paramètre s'applique aux points de terminaison privés du sous-réseau, pas aux adresses IP NAT du service Private Link." }
    ipconf: { en: "--ip-configurations defines the NAT IP configurations of the service, not the load balancer frontend.", fr: "--ip-configurations définit les configurations IP NAT du service, pas la configuration frontale de l'équilibreur de charge." }
    privip: { en: "--private-ip-address sets a static NAT IP address, not the frontend to attach.", fr: "--private-ip-address définit une adresse IP NAT statique, pas la configuration frontale à attacher." }
    dest: { en: "--destination-ip-address is used for a destination IP instead of a load balancer frontend, not with fe-claims.", fr: "--destination-ip-address sert à une adresse IP de destination à la place d'une configuration frontale d'équilibreur de charge, pas avec fe-claims." }
    fqdns: { en: "--fqdns lists FQDNs for the service; it doesn't restrict who can see it.", fr: "--fqdns liste des FQDN pour le service ; il ne restreint pas qui peut le voir." }
references:
  - title: az network private-link-service
    url: https://learn.microsoft.com/en-us/cli/azure/network/private-link-service
  - title: Disable network policies for Private Link service source IP
    url: https://learn.microsoft.com/en-us/azure/private-link/disable-private-link-service-network-policy
