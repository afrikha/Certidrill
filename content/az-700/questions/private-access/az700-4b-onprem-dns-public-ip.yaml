id: az700-4b-onprem-dns-public-ip
objective: "4.1.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum has the following Azure resources in the West Europe region:

    | Resource | Configuration |
    | --- | --- |
    | VNet-Hub | Connected to the on-premises network by a site-to-site VPN; peered with VNet-App |
    | VNet-App | Contains pe-sqladatum, a private endpoint for the logical server **sqladatum** |
    | privatelink.database.windows.net | Private DNS zone that contains the A record of pe-sqladatum |
    | dnspr-hub | Azure DNS Private Resolver deployed in VNet-Hub, with an inbound endpoint |

    An administrator runs `nslookup sqladatum.database.windows.net` on an on-premises server and receives the public IP address of the service instead of the private IP address of pe-sqladatum.

    Which two issues could cause this result?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose des ressources Azure suivantes dans la région West Europe :

    | Ressource | Configuration |
    | --- | --- |
    | VNet-Hub | Relié au réseau local par un VPN de site à site ; peering avec VNet-App |
    | VNet-App | Contient pe-sqladatum, un point de terminaison privé pour le serveur logique **sqladatum** |
    | privatelink.database.windows.net | Zone DNS privée qui contient l'enregistrement A de pe-sqladatum |
    | dnspr-hub | Azure DNS Private Resolver déployé dans VNet-Hub, avec un point de terminaison entrant |

    Un administrateur exécute `nslookup sqladatum.database.windows.net` sur un serveur local et obtient l'adresse IP publique du service au lieu de l'adresse IP privée de pe-sqladatum.

    Quels sont les deux problèmes qui peuvent provoquer ce résultat ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The private DNS zone is linked to VNet-App but not to VNet-Hub.", fr: "La zone DNS privée est liée à VNet-App, mais pas à VNet-Hub." } }
    - { id: b, text: { en: "The network policy for private endpoints of the subnet of pe-sqladatum is set to Disabled.", fr: "La stratégie réseau pour les points de terminaison privés du sous-réseau de pe-sqladatum a la valeur Disabled." } }
    - { id: c, text: { en: "The on-premises DNS server used by the server has no conditional forwarder for database.windows.net.", fr: "Le serveur DNS local utilisé par le serveur n'a pas de redirecteur conditionnel pour database.windows.net." } }
    - { id: d, text: { en: "The network security group of the subnet of pe-sqladatum blocks TCP port 1433 from the on-premises network.", fr: "Le groupe de sécurité réseau du sous-réseau de pe-sqladatum bloque le port TCP 1433 depuis le réseau local." } }
    - { id: e, text: { en: "The VPN gateway of VNet-Hub is configured without BGP.", fr: "La passerelle VPN de VNet-Hub est configurée sans BGP." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The resolver resolves queries with Azure DNS from VNet-Hub, the virtual network it belongs to; if the privatelink zone isn't linked to VNet-Hub, the CNAME chain ends in public DNS and returns the public IP address. If the on-premises DNS server doesn't forward database.windows.net to the inbound endpoint, it resolves the name on the internet and gets the same public answer.
    fr: |
      Le résolveur résout les requêtes avec Azure DNS depuis VNet-Hub, le réseau virtuel auquel il appartient ; si la zone privatelink n'est pas liée à VNet-Hub, la chaîne de CNAME se termine dans le DNS public et renvoie l'adresse IP publique. Si le serveur DNS local ne transfère pas database.windows.net vers le point de terminaison entrant, il résout le nom sur Internet et obtient la même réponse publique.
  options:
    b: { en: "The network policy setting decides whether NSGs and route tables apply to the private endpoint; it has no effect on name resolution.", fr: "Le paramètre de stratégie réseau détermine si les NSG et les tables de routage s'appliquent au point de terminaison privé ; il n'a aucun effet sur la résolution de noms." }
    d: { en: "An NSG filters connections, not DNS answers; nslookup would still return the private IP address.", fr: "Un NSG filtre les connexions, pas les réponses DNS ; nslookup renverrait quand même l'adresse IP privée." }
    e: { en: "A site-to-site VPN works with static routing; BGP has no influence on the DNS answer.", fr: "Un VPN de site à site fonctionne avec un routage statique ; BGP n'a aucune influence sur la réponse DNS." }
references:
  - title: Azure Private Endpoint DNS Integration Scenarios
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
  - title: Azure DNS Private Resolver Overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
