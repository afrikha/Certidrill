id: az700-4a-dns-spoke-resolution
objective: "4.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a hub virtual network named **VNet-Hub** peered with a spoke named **VNet-Spoke1**. A private endpoint for an Azure SQL Database server is in VNet-Hub. The private DNS zone **privatelink.database.windows.net** contains its A record and is linked only to VNet-Hub. VNet-Hub also contains an Azure DNS Private Resolver with an inbound endpoint.

    Virtual machines in VNet-Spoke1 use Azure-provided DNS, and the SQL server name resolves to its public IP address from those VMs.

    You need the VMs in VNet-Spoke1 to resolve the SQL server name to the private endpoint IP address.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un réseau virtuel hub nommé **VNet-Hub** relié par peering à un spoke nommé **VNet-Spoke1**. Un point de terminaison privé pour un serveur Azure SQL Database se trouve dans VNet-Hub. La zone DNS privée **privatelink.database.windows.net** contient son enregistrement A et n'est liée qu'à VNet-Hub. VNet-Hub contient aussi un Azure DNS Private Resolver doté d'un point de terminaison entrant.

    Les machines virtuelles de VNet-Spoke1 utilisent le DNS fourni par Azure, et le nom du serveur SQL se résout vers son adresse IP publique depuis ces machines virtuelles.

    Vous devez faire en sorte que les machines virtuelles de VNet-Spoke1 résolvent le nom du serveur SQL vers l'adresse IP du point de terminaison privé.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: c, text: { en: "Create a second privatelink.database.windows.net zone and link it to VNet-Spoke1.", fr: "Créer une seconde zone privatelink.database.windows.net et la lier à VNet-Spoke1." } }
    - { id: d, text: { en: "Enable autoregistration on the link between the zone and VNet-Hub.", fr: "Activer l'inscription automatique sur le lien entre la zone et VNet-Hub." } }
    - { id: a, text: { en: "Link the privatelink.database.windows.net zone to VNet-Spoke1.", fr: "Lier la zone privatelink.database.windows.net à VNet-Spoke1." } }
    - { id: e, text: { en: "Enable Use remote gateways on the peering of VNet-Spoke1.", fr: "Activer Utiliser des passerelles distantes sur le peering de VNet-Spoke1." } }
    - { id: b, text: { en: "Set the DNS servers of VNet-Spoke1 to the IP address of the resolver's inbound endpoint.", fr: "Définir comme serveur DNS de VNet-Spoke1 l'adresse IP du point de terminaison entrant du résolveur." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Azure DNS answers from a private zone only for queries that originate from a virtual network linked to it. Linking the existing zone to VNet-Spoke1 works directly. Alternatively, the spoke can send its queries to the Private Resolver's inbound endpoint in VNet-Hub; the resolver queries Azure DNS from the linked hub, so it returns the private record.
    fr: |
      Azure DNS ne répond depuis une zone privée qu'aux requêtes émises depuis un réseau virtuel lié à cette zone. Lier la zone existante à VNet-Spoke1 fonctionne directement. Autre possibilité : le spoke envoie ses requêtes au point de terminaison entrant du Private Resolver dans VNet-Hub ; le résolveur interroge Azure DNS depuis le hub lié et renvoie donc l'enregistrement privé.
  options:
    c: { en: "A new zone with the same name is empty; zones with the same name in different networks need manual record merging.", fr: "Une nouvelle zone portant le même nom est vide ; des zones de même nom dans différents réseaux exigent une fusion manuelle des enregistrements." }
    d: { en: "Autoregistration registers virtual machines; it doesn't make the zone visible from VNet-Spoke1.", fr: "L'inscription automatique enregistre des machines virtuelles ; elle ne rend pas la zone visible depuis VNet-Spoke1." }
    e: { en: "Gateway transit concerns routing through a VPN or ExpressRoute gateway, not DNS resolution.", fr: "Le transit par passerelle concerne le routage via une passerelle VPN ou ExpressRoute, pas la résolution DNS." }
references:
  - title: Azure Private Endpoint DNS integration Scenarios
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
