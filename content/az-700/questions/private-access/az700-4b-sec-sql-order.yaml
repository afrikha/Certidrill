id: az700-4b-sec-sql-order
objective: "4.2.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a virtual network named **VNet1** in the West Europe region. A subnet named **Subnet-App** is associated with a NAT gateway. Application servers in Subnet-App connect to databases on a logical server named **sqlcontoso**, also in West Europe.

    The only firewall rule of sqlcontoso is an IP rule that allows the public IP address of the NAT gateway. **Allow Azure services and resources to access this server** is set to **No**.

    You need to replace the IP rule with access through a service endpoint for Subnet-App. The solution must minimize the interruption of database connections.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'un réseau virtuel nommé **VNet1** dans la région West Europe. Un sous-réseau nommé **Subnet-App** est associé à une passerelle NAT. Des serveurs d'applications de Subnet-App se connectent à des bases de données d'un serveur logique nommé **sqlcontoso**, lui aussi en West Europe.

    La seule règle de pare-feu de sqlcontoso est une règle IP qui autorise l'adresse IP publique de la passerelle NAT. **Allow Azure services and resources to access this server** a la valeur **No**.

    Vous devez remplacer la règle IP par un accès via un point de terminaison de service pour Subnet-App. La solution doit réduire au minimum l'interruption des connexions aux bases de données.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: rule, text: { en: "On sqlcontoso, create a virtual network rule for Subnet-App with the IgnoreMissingVnetServiceEndpoint flag.", fr: "Sur sqlcontoso, créer une règle de réseau virtuel pour Subnet-App avec l'indicateur IgnoreMissingVnetServiceEndpoint." } }
    - { id: se, text: { en: "Enable the Microsoft.Sql service endpoint on Subnet-App.", fr: "Activer le point de terminaison de service Microsoft.Sql sur Subnet-App." } }
    - { id: delip, text: { en: "Delete the IP rule that allows the public IP address of the NAT gateway.", fr: "Supprimer la règle IP qui autorise l'adresse IP publique de la passerelle NAT." } }
    - { id: azure, text: { en: "Set Allow Azure services and resources to access this server to Yes.", fr: "Définir Allow Azure services and resources to access this server sur Yes." } }
    - { id: iprange, text: { en: "Add an IP rule for the address range of Subnet-App.", fr: "Ajouter une règle IP pour la plage d'adresses de Subnet-App." } }
    - { id: pe, text: { en: "Create a private endpoint for sqlcontoso in Subnet-App.", fr: "Créer un point de terminaison privé pour sqlcontoso dans Subnet-App." } }
answer:
  sequence: [ rule, se, delip ]
explanation:
  correct:
    en: |
      With the IgnoreMissingVnetServiceEndpoint flag, the virtual network rule can exist before the endpoint is enabled; it doesn't secure anything until then. When you enable Microsoft.Sql on Subnet-App, the source switches from the NAT gateway address to the private address and subnet identity, which the rule already allows, so the downtime of the transition is reduced. Once traffic arrives through the endpoint, the IP rule no longer matches and can be deleted.
    fr: |
      Avec l'indicateur IgnoreMissingVnetServiceEndpoint, la règle de réseau virtuel peut exister avant l'activation du point de terminaison ; elle ne sécurise rien jusque-là. Quand vous activez Microsoft.Sql sur Subnet-App, la source passe de l'adresse de la passerelle NAT à l'adresse privée et à l'identité du sous-réseau, que la règle autorise déjà : l'interruption de la transition est réduite. Une fois que le trafic arrive par le point de terminaison, la règle IP ne correspond plus et peut être supprimée.
  options:
    azure: { en: "This setting would accept traffic from any subnet in Azure, which Microsoft calls excessive access.", fr: "Ce paramètre accepterait le trafic de n'importe quel sous-réseau d'Azure, ce que Microsoft qualifie d'accès excessif." }
    iprange: { en: "IP rules match public source addresses; the private range of Subnet-App never matches them.", fr: "Les règles IP correspondent à des adresses sources publiques ; la plage privée de Subnet-App ne correspond jamais." }
    pe: { en: "A private endpoint is a different feature; the requirement is a service endpoint.", fr: "Un point de terminaison privé est une autre fonctionnalité ; l'exigence porte sur un point de terminaison de service." }
references:
  - title: Virtual Network Endpoints and Rules for Azure SQL Database - Azure SQL Database
    url: https://learn.microsoft.com/en-us/azure/azure-sql/database/vnet-service-endpoint-rule-overview
