id: az700-4a-pls-overlap
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware hosts a TCP-based pricing service on virtual machines behind an internal load balancer in a virtual network named **VNet-Pricing** (10.0.0.0/16). A customer named Tailspin wants to consume the service from its own Azure subscription. Tailspin's virtual network also uses 10.0.0.0/16.

    You need to give Tailspin private access to the pricing service only. Neither company can change its address space, and Tailspin must not reach any other resource in VNet-Pricing.

    What should you use?
  fr: |
    Litware héberge un service de tarification TCP sur des machines virtuelles derrière un équilibreur de charge interne dans un réseau virtuel nommé **VNet-Pricing** (10.0.0.0/16). Un client nommé Tailspin souhaite consommer ce service depuis son propre abonnement Azure. Le réseau virtuel de Tailspin utilise aussi 10.0.0.0/16.

    Vous devez donner à Tailspin un accès privé au seul service de tarification. Aucune des deux entreprises ne peut modifier son espace d'adressage, et Tailspin ne doit atteindre aucune autre ressource de VNet-Pricing.

    Que devez-vous utiliser ?
body:
  options:
    - { id: b, text: { en: "Global virtual network peering with an NSG", fr: "Un peering de réseaux virtuels mondial avec un NSG" } }
    - { id: c, text: { en: "A VNet-to-VNet VPN connection", fr: "Une connexion VPN de réseau virtuel à réseau virtuel" } }
    - { id: d, text: { en: "A service endpoint on the subnet of the service", fr: "Un point de terminaison de service sur le sous-réseau du service" } }
    - { id: a, text: { en: "A Private Link service on the load balancer", fr: "Un service Private Link sur l'équilibreur de charge" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Private Link service publishes an application that runs behind a Standard load balancer. Tailspin creates a private endpoint in its own virtual network, and the service applies NAT, so overlapping address spaces don't matter and only that service is exposed.
    fr: |
      Un service Private Link publie une application exécutée derrière un équilibreur de charge Standard. Tailspin crée un point de terminaison privé dans son propre réseau virtuel, et le service applique une NAT : le chevauchement des espaces d'adressage n'a pas d'importance et seul ce service est exposé.
  options:
    b: { en: "Peering can't be created between virtual networks whose address spaces overlap, and it would expose the whole network.", fr: "Un peering ne peut pas être créé entre réseaux virtuels dont les espaces d'adressage se chevauchent, et il exposerait tout le réseau." }
    c: { en: "A VPN connection needs non-overlapping address spaces to route between the networks.", fr: "Une connexion VPN exige des espaces d'adressage qui ne se chevauchent pas pour router entre les réseaux." }
    d: { en: "Service endpoints give access to Azure PaaS services, not to your own application.", fr: "Les points de terminaison de service donnent accès à des services PaaS Azure, pas à votre propre application." }
references:
  - title: What is Azure Private Link service?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-link-service-overview
