id: az700-4a-pe-rejected-request
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    You created a private endpoint named **PE-Billing** in a virtual network named **VNet-Fin**. PE-Billing targets an Azure SQL Database server owned by another team and was submitted as a manual request.

    The owner of the server rejected the connection by mistake. The connection status of PE-Billing is now **Rejected**.

    You need PE-Billing's workload to connect to the server through a private endpoint in VNet-Fin as soon as the owner agrees.

    What should you do?
  fr: |
    Vous avez créé un point de terminaison privé nommé **PE-Billing** dans un réseau virtuel nommé **VNet-Fin**. PE-Billing cible un serveur Azure SQL Database appartenant à une autre équipe et a été soumis sous forme de demande manuelle.

    Le propriétaire du serveur a rejeté la connexion par erreur. L'état de connexion de PE-Billing est désormais **Rejected**.

    Vous devez faire en sorte que la charge de travail de PE-Billing se connecte au serveur via un point de terminaison privé dans VNet-Fin dès que le propriétaire donne son accord.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Ask the owner to approve the rejected connection of PE-Billing.", fr: "Demander au propriétaire d'approuver la connexion rejetée de PE-Billing." } }
    - { id: b, text: { en: "Delete PE-Billing, and then create a new private endpoint with a new manual request.", fr: "Supprimer PE-Billing, puis créer un nouveau point de terminaison privé avec une nouvelle demande manuelle." } }
    - { id: c, text: { en: "Update the request message of PE-Billing so that the request is submitted again.", fr: "Modifier le message de requête de PE-Billing pour que la demande soit soumise de nouveau." } }
    - { id: d, text: { en: "Change the connection approval method of PE-Billing to automatic.", fr: "Passer la méthode d'approbation de la connexion de PE-Billing en automatique." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A rejected (denied) private endpoint connection can't be approved later. You remove it and create a new connection: delete PE-Billing and create a new private endpoint with a manual request, which the owner can then approve.
    fr: |
      Une connexion de point de terminaison privé rejetée ne peut pas être approuvée ultérieurement. Il faut la supprimer et créer une nouvelle connexion : supprimez PE-Billing et créez un nouveau point de terminaison privé avec une demande manuelle, que le propriétaire pourra alors approuver.
  options:
    a: { en: "A denied connection can't be approved afterward; a new connection is required.", fr: "Une connexion refusée ne peut pas être approuvée ensuite ; une nouvelle connexion est nécessaire." }
    c: { en: "The request message is sent with the request; changing it doesn't create a new request for a rejected connection.", fr: "Le message de requête est envoyé avec la demande ; le modifier ne crée pas de nouvelle demande pour une connexion rejetée." }
    d: { en: "Automatic approval depends on your permissions on the target server, which you don't have, and doesn't revive a rejected connection.", fr: "L'approbation automatique dépend de vos autorisations sur le serveur cible, que vous n'avez pas, et ne réactive pas une connexion rejetée." }
references:
  - title: Manage Azure private endpoints
    url: https://learn.microsoft.com/en-us/azure/private-link/manage-private-endpoint
