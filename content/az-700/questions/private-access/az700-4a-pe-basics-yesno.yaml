id: az700-4a-pe-basics-yesno
objective: "4.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum plans to create a private endpoint named **PE-Docs** in a virtual network named **VNet1** for the blob service of a general-purpose v2 storage account named **stadatumdocs**. The storage account currently allows public network access from all networks.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de créer un point de terminaison privé nommé **PE-Docs** dans un réseau virtuel nommé **VNet1** pour le service blob d'un compte de stockage v2 universel nommé **stadatumdocs**. Le compte de stockage autorise actuellement l'accès réseau public depuis tous les réseaux.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After PE-Docs is created and approved, clients on the internet can no longer reach the public endpoint of stadatumdocs.
        fr: Une fois PE-Docs créé et approuvé, les clients sur Internet ne peuvent plus atteindre le point de terminaison public de stadatumdocs.
    - id: s2
      text:
        en: The private IP address assigned to PE-Docs stays the same for the lifetime of the private endpoint.
        fr: L'adresse IP privée attribuée à PE-Docs reste la même pendant toute la durée de vie du point de terminaison privé.
    - id: s3
      text:
        en: The storage service can initiate connections to virtual machines in VNet1 through PE-Docs.
        fr: Le service de stockage peut ouvrir des connexions vers les machines virtuelles de VNet1 via PE-Docs.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      A private endpoint adds a private path but doesn't block the public endpoint; you must disable public network access or restrict the storage firewall. The endpoint's network interface receives an IP address from the subnet that doesn't change during the endpoint's lifecycle. Connections are one-directional: only clients can initiate them, and the service has no route to start connections into the virtual network.
    fr: |
      Un point de terminaison privé ajoute un chemin privé mais ne bloque pas le point de terminaison public ; vous devez désactiver l'accès réseau public ou restreindre le pare-feu du stockage. L'interface réseau du point de terminaison reçoit une adresse IP du sous-réseau qui ne change pas pendant tout son cycle de vie. Les connexions sont unidirectionnelles : seuls les clients peuvent les ouvrir, et le service n'a aucun itinéraire pour ouvrir des connexions vers le réseau virtuel.
references:
  - title: What is a private endpoint?
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
