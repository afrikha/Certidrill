id: az700-sr2-fw-fqdn
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has a hub virtual network named **VNet-Hub** that contains an Azure Firewall Standard instance named **FW1** with the private IP address 10.0.1.4. A spoke virtual network named **Spoke1** (10.20.0.0/16) is peered with VNet-Hub. A subnet of Spoke1 named **Workload** (10.20.1.0/24) has a route table that sends 0.0.0.0/0 to 10.0.1.4.

    The virtual machines in Spoke1 use the Azure-provided DNS servers.

    FW1 is managed by a firewall policy named **FWPolicy1** that has no parent policy. DNS proxy is disabled in FWPolicy1. FWPolicy1 contains a single rule collection group:

    | Rule collection group | Priority | Rule collection | Type | Priority | Action | Rule |
    | --- | --- | --- | --- | --- | --- | --- |
    | RCG-Platform | 200 | NRC-DenyWeb | Network | 300 | Deny | Source 10.20.0.0/16, protocol TCP, destination *, ports 80 and 443 |

    You need to ensure that the virtual machines in Workload can connect to `updates.fabrikam.com` over HTTPS. NRC-DenyWeb must remain unchanged.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys possède un réseau virtuel hub nommé **VNet-Hub** qui contient une instance de Pare-feu Azure Standard nommée **FW1**, d'adresse IP privée 10.0.1.4. Un réseau virtuel spoke nommé **Spoke1** (10.20.0.0/16) est relié à VNet-Hub par un peering. Un sous-réseau de Spoke1 nommé **Workload** (10.20.1.0/24) possède une table de routage qui envoie 0.0.0.0/0 vers 10.0.1.4.

    Les machines virtuelles de Spoke1 utilisent les serveurs DNS fournis par Azure.

    FW1 est géré par une stratégie de pare-feu nommée **FWPolicy1** qui n'a pas de stratégie parente. Le proxy DNS est désactivé dans FWPolicy1. FWPolicy1 contient un seul groupe de collections de règles :

    | Groupe de collections de règles | Priorité | Collection de règles | Type | Priorité | Action | Règle |
    | --- | --- | --- | --- | --- | --- | --- |
    | RCG-Platform | 200 | NRC-DenyWeb | Réseau | 300 | Deny | Source 10.20.0.0/16, protocole TCP, destination *, ports 80 et 443 |

    Vous devez vous assurer que les machines virtuelles de Workload peuvent se connecter à `updates.fabrikam.com` en HTTPS. NRC-DenyWeb doit rester inchangée.
