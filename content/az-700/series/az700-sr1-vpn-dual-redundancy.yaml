id: az700-sr1-vpn-dual-redundancy
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware, Inc. has a datacenter that uses the address space **10.50.0.0/16**. The datacenter has two VPN devices, each on its own internet connection:

    | Device | Public IP address | BGP peer IP address | ASN |
    | --- | --- | --- | --- |
    | Dev1 | 203.0.113.10 | 10.50.255.1 | 65050 |
    | Dev2 | 198.51.100.20 | 10.50.255.2 | 65050 |

    Both devices support BGP and can establish several IPsec tunnels at the same time.

    You plan to deploy a route-based VPN gateway named **VGW1** that uses the **VpnGw2AZ** SKU in an Azure virtual network named **VNet1**. You need to design the site-to-site connectivity between VNet1 and the datacenter to meet the following requirements:

    - Connectivity must continue if one of the two VPN devices fails.
    - Traffic must use tunnels that terminate on both instances of VGW1 at the same time, so that the failure of one gateway instance doesn't wait for a standby instance to take over.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware, Inc. dispose d'un centre de données qui utilise l'espace d'adressage **10.50.0.0/16**. Le centre de données possède deux périphériques VPN, chacun sur sa propre connexion Internet :

    | Périphérique | Adresse IP publique | Adresse IP d'homologue BGP | ASN |
    | --- | --- | --- | --- |
    | Dev1 | 203.0.113.10 | 10.50.255.1 | 65050 |
    | Dev2 | 198.51.100.20 | 10.50.255.2 | 65050 |

    Les deux périphériques prennent en charge BGP et peuvent établir plusieurs tunnels IPsec simultanément.

    Vous prévoyez de déployer une passerelle VPN basée sur des routes nommée **VGW1**, qui utilise la référence SKU **VpnGw2AZ**, dans un réseau virtuel Azure nommé **VNet1**. Vous devez concevoir la connectivité de site à site entre VNet1 et le centre de données pour répondre aux exigences suivantes :

    - La connectivité doit être maintenue si l'un des deux périphériques VPN tombe en panne.
    - Le trafic doit utiliser simultanément des tunnels qui aboutissent aux deux instances de VGW1, de sorte que la panne d'une instance de passerelle n'attende pas la prise de relais d'une instance de secours.
