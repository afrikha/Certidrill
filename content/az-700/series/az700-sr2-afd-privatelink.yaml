id: az700-sr2-afd-privatelink
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank hosts a web app named **app1** in Azure App Service. app1 runs on a PremiumV3 App Service plan in the East US region and is currently reachable from the internet at its default host name.

    A virtual network named **VNet1** in East US contains an empty subnet named **Subnet-Int**.

    You plan to publish app1 to users through Azure Front Door. You need to ensure that:

    - Azure Front Door connects to app1 through a private endpoint.
    - app1 doesn't accept any connection on its public endpoint.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank héberge une application web nommée **app1** dans Azure App Service. app1 s'exécute sur un plan App Service PremiumV3 dans la région East US et est actuellement joignable depuis Internet par son nom d'hôte par défaut.

    Un réseau virtuel nommé **VNet1** dans East US contient un sous-réseau vide nommé **Subnet-Int**.

    Vous prévoyez de publier app1 auprès des utilisateurs par Azure Front Door. Vous devez vous assurer que :

    - Azure Front Door se connecte à app1 par un point de terminaison privé.
    - app1 n'accepte aucune connexion sur son point de terminaison public.
