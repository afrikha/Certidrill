id: az700-sr2-globalreach
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware has two offices, in Paris (10.1.0.0/16) and in Amsterdam (10.2.0.0/16). Each office connects to Azure through its own ExpressRoute circuit:

    | Circuit | Peering location | Tier | Azure private peering |
    | --- | --- | --- | --- |
    | ER-PAR | Paris | Standard | Configured |
    | ER-AMS | Amsterdam | Standard | Configured |

    Both circuits are in the same subscription. Both are connected to an ExpressRoute virtual network gateway named **ERGW1** (SKU `ErGw3AZ`) in a virtual network named **VNet-Hub** in the West Europe region. Hosts in both offices can reach the virtual machines in VNet-Hub.

    The address range 192.168.100.0/29 isn't used on-premises or in Azure.

    You need to ensure that hosts in the Paris office can communicate with hosts in the Amsterdam office over the Microsoft global network by using the existing circuits. You must not add circuits or VPN connections.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware possède deux bureaux, à Paris (10.1.0.0/16) et à Amsterdam (10.2.0.0/16). Chaque bureau se connecte à Azure par son propre circuit ExpressRoute :

    | Circuit | Emplacement de peering | Niveau | Peering privé Azure |
    | --- | --- | --- | --- |
    | ER-PAR | Paris | Standard | Configuré |
    | ER-AMS | Amsterdam | Standard | Configuré |

    Les deux circuits se trouvent dans le même abonnement. Ils sont tous deux connectés à une passerelle de réseau virtuel ExpressRoute nommée **ERGW1** (référence SKU `ErGw3AZ`) dans un réseau virtuel nommé **VNet-Hub** de la région West Europe. Les hôtes des deux bureaux peuvent joindre les machines virtuelles de VNet-Hub.

    La plage d'adresses 192.168.100.0/29 n'est utilisée ni sur site ni dans Azure.

    Vous devez vous assurer que les hôtes du bureau de Paris peuvent communiquer avec ceux du bureau d'Amsterdam par le réseau mondial de Microsoft en utilisant les circuits existants. Vous ne devez ajouter ni circuit ni connexion VPN.
