id: az700-sr1-vwan-remote-users
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Proseware, Inc. has an Azure Virtual WAN named **VWAN1** of type **Basic**. VWAN1 contains a virtual hub named **Hub1** in the North Europe region. Hub1 has a site-to-site VPN gateway that connects 20 branch offices.

    Proseware also has three virtual networks named **Spoke1**, **Spoke2** and **Spoke3** in North Europe. None of them has a virtual network gateway, and they aren't peered.

    You need to meet the following requirements:

    - Remote users must connect by using point-to-site VPN connections that authenticate with **Microsoft Entra ID**.
    - Remote users and branch offices must be able to reach the three spoke virtual networks, and traffic between the spoke virtual networks must transit through Hub1.
    - The existing site-to-site connections of the branch offices must stay on Hub1.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Proseware, Inc. dispose d'un Azure Virtual WAN nommé **VWAN1** de type **Basic**. VWAN1 contient un hub virtuel nommé **Hub1** dans la région North Europe. Hub1 dispose d'une passerelle VPN de site à site qui connecte 20 succursales.

    Proseware dispose aussi de trois réseaux virtuels nommés **Spoke1**, **Spoke2** et **Spoke3** dans North Europe. Aucun d'eux ne possède de passerelle de réseau virtuel, et aucun peering n'existe entre eux.

    Vous devez répondre aux exigences suivantes :

    - Les utilisateurs distants doivent se connecter par des connexions VPN de point à site qui s'authentifient avec **Microsoft Entra ID**.
    - Les utilisateurs distants et les succursales doivent pouvoir atteindre les trois réseaux virtuels spoke, et le trafic entre les réseaux virtuels spoke doit transiter par Hub1.
    - Les connexions de site à site existantes des succursales doivent rester sur Hub1.
