id: az700-sr1-firewall-url-idps
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has a hub-and-spoke network in Azure. You plan to deploy Azure Firewall in the hub virtual network. User-defined routes will send all the outbound internet traffic of the spoke virtual machines to the firewall.

    Woodgrove has an enterprise certification authority (CA). The root CA certificate is trusted by all the virtual machines, and the enterprise CA can issue an intermediate CA certificate.

    You need to configure outbound filtering to meet the following requirements:

    - The virtual machines must be able to connect over HTTPS to **https://api.fabrikam.com/v2/orders**. Requests to any other path on api.fabrikam.com must be blocked.
    - Outbound HTTPS traffic must be inspected for known attack signatures, and matching traffic must be blocked.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'un réseau hub-and-spoke dans Azure. Vous prévoyez de déployer Pare-feu Azure dans le réseau virtuel hub. Des itinéraires définis par l'utilisateur enverront tout le trafic Internet sortant des machines virtuelles des spokes vers le pare-feu.

    Woodgrove dispose d'une autorité de certification d'entreprise. Le certificat d'autorité de certification racine est approuvé par toutes les machines virtuelles, et l'autorité de certification d'entreprise peut émettre un certificat d'autorité de certification intermédiaire.

    Vous devez configurer le filtrage sortant pour répondre aux exigences suivantes :

    - Les machines virtuelles doivent pouvoir se connecter en HTTPS à **https://api.fabrikam.com/v2/orders**. Les requêtes vers tout autre chemin d'api.fabrikam.com doivent être bloquées.
    - Le trafic HTTPS sortant doit être inspecté à la recherche de signatures d'attaques connues, et le trafic correspondant doit être bloqué.
