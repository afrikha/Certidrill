id: az700-sr1-pls-partner-access
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam, Inc. hosts a TCP-based pricing service on virtual machines in a virtual network named **VNet-Prov** (10.0.0.0/16) in the West Europe region. The virtual machines are in the backend pool of a Standard internal load balancer named **ILB1**. VNet-Prov also contains database servers and management servers.

    A customer named Contoso, Ltd. uses its own Microsoft Entra tenant and Azure subscription. Contoso's application servers are in a virtual network named **VNet-Cons** (10.0.0.0/16) in West Europe.

    You need to ensure that Contoso's application servers can connect to the pricing service over the Microsoft network by using a private IP address of VNet-Cons. Contoso must not be able to reach any other resource in VNet-Prov.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam, Inc. héberge un service de tarification basé sur TCP sur des machines virtuelles d'un réseau virtuel nommé **VNet-Prov** (10.0.0.0/16) dans la région West Europe. Les machines virtuelles font partie du pool principal d'un équilibreur de charge interne Standard nommé **ILB1**. VNet-Prov contient aussi des serveurs de base de données et des serveurs d'administration.

    Un client nommé Contoso, Ltd. utilise son propre locataire Microsoft Entra et son propre abonnement Azure. Les serveurs d'applications de Contoso se trouvent dans un réseau virtuel nommé **VNet-Cons** (10.0.0.0/16) dans West Europe.

    Vous devez faire en sorte que les serveurs d'applications de Contoso puissent se connecter au service de tarification par le réseau Microsoft en utilisant une adresse IP privée de VNet-Cons. Contoso ne doit pouvoir atteindre aucune autre ressource de VNet-Prov.
