id: az700-sr1-tm-regional-failover
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum Corporation deploys a public web application in two Azure regions. Each deployment has its own public endpoint:

    | Deployment | Region | Endpoint |
    | --- | --- | --- |
    | App-WE | West Europe | app-we.adatum.com |
    | App-EUS | East US | app-eus.adatum.com |

    You plan to use Azure Traffic Manager to direct users to the deployments. You need to meet the following requirements:

    - While both deployments are healthy, users whose DNS queries come from Europe must be sent to App-WE, and all other users must be sent to App-EUS.
    - If one deployment becomes unhealthy, all users must be sent to the other deployment.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum Corporation déploie une application web publique dans deux régions Azure. Chaque déploiement possède son propre point de terminaison public :

    | Déploiement | Région | Point de terminaison |
    | --- | --- | --- |
    | App-WE | West Europe | app-we.adatum.com |
    | App-EUS | East US | app-eus.adatum.com |

    Vous prévoyez d'utiliser Azure Traffic Manager pour diriger les utilisateurs vers les déploiements. Vous devez répondre aux exigences suivantes :

    - Tant que les deux déploiements sont intègres, les utilisateurs dont les requêtes DNS proviennent d'Europe doivent être envoyés vers App-WE, et tous les autres utilisateurs vers App-EUS.
    - Si un déploiement devient non intègre, tous les utilisateurs doivent être envoyés vers l'autre déploiement.
