id: az700-sr1-onprem-private-dns
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso, Ltd. has an on-premises datacenter that is connected to an Azure virtual network named **VNet-Hub** in the West Europe region by a site-to-site VPN. On-premises clients use two DNS servers that run Windows Server and that are located in the datacenter.

    A storage account named **stcontosodata** has a private endpoint in VNet-Hub. A private DNS zone named **privatelink.blob.core.windows.net** contains the A record of the private endpoint and is linked to VNet-Hub. VNet-Hub uses the Azure-provided DNS service.

    You need to ensure that the on-premises clients resolve **stcontosodata.blob.core.windows.net** to the private IP address of the private endpoint. The solution must not require you to deploy any virtual machine in Azure.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso, Ltd. dispose d'un centre de données local connecté à un réseau virtuel Azure nommé **VNet-Hub**, dans la région West Europe, par un VPN de site à site. Les clients locaux utilisent deux serveurs DNS qui exécutent Windows Server et qui se trouvent dans le centre de données.

    Un compte de stockage nommé **stcontosodata** dispose d'un point de terminaison privé dans VNet-Hub. Une zone DNS privée nommée **privatelink.blob.core.windows.net** contient l'enregistrement A du point de terminaison privé et est liée à VNet-Hub. VNet-Hub utilise le service DNS fourni par Azure.

    Vous devez faire en sorte que les clients locaux résolvent **stcontosodata.blob.core.windows.net** en l'adresse IP privée du point de terminaison privé. La solution ne doit vous obliger à déployer aucune machine virtuelle dans Azure.
