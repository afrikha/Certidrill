id: az700-sr2-sep
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Proseware has an Azure subscription named **Sub1** that contains the following resources in the West Europe region:

    | Name | Type | Configuration |
    | --- | --- | --- |
    | VNet1 | Virtual network | Contains a subnet named **Subnet1** with a service endpoint for `Microsoft.Storage` |
    | VM1, VM2 | Virtual machines | Connected to Subnet1 |
    | stproddata | Storage account (StorageV2) | Public network access enabled from all networks |

    VM1 and VM2 run a batch job that writes its results to blob containers in stproddata.

    To prevent data exfiltration, you need to ensure that the virtual machines in Subnet1 can access stproddata over the service endpoint but can't access any other storage account, including storage accounts in other subscriptions.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Proseware dispose d'un abonnement Azure nommé **Sub1** qui contient les ressources suivantes dans la région West Europe :

    | Nom | Type | Configuration |
    | --- | --- | --- |
    | VNet1 | Réseau virtuel | Contient un sous-réseau nommé **Subnet1** doté d'un point de terminaison de service pour `Microsoft.Storage` |
    | VM1, VM2 | Machines virtuelles | Connectées à Subnet1 |
    | stproddata | Compte de stockage (StorageV2) | Accès réseau public activé depuis tous les réseaux |

    VM1 et VM2 exécutent un traitement par lots qui écrit ses résultats dans des conteneurs blob de stproddata.

    Pour empêcher l'exfiltration de données, vous devez vous assurer que les machines virtuelles de Subnet1 peuvent accéder à stproddata par le point de terminaison de service, mais ne peuvent accéder à aucun autre compte de stockage, y compris ceux d'autres abonnements.
