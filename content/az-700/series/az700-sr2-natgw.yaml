id: az700-sr2-natgw
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso has an Azure subscription that contains a virtual network named **VNet1** in the East US region. VNet1 contains a subnet named **Subnet1** (10.10.1.0/24).

    Subnet1 hosts a virtual machine scale set named **VMSS1**. VMSS1 autoscales between 2 and 20 instances. The instances have no public IP addresses, and no route table is associated with Subnet1.

    The VMSS1 instances call an API published on the internet by a partner named Fabrikam. Fabrikam accepts calls only from source IP addresses in its allowlist, and the allowlist can contain **at most two** public IP addresses.

    You need to ensure that:

    - Every outbound internet connection from the VMSS1 instances uses a static public IP address that is in the Fabrikam allowlist, whatever the number of instances.
    - No connection initiated from the internet can reach the VMSS1 instances.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso dispose d'un abonnement Azure qui contient un réseau virtuel nommé **VNet1** dans la région East US. VNet1 contient un sous-réseau nommé **Subnet1** (10.10.1.0/24).

    Subnet1 héberge un groupe de machines virtuelles identiques nommé **VMSS1**. VMSS1 est mis à l'échelle automatiquement entre 2 et 20 instances. Les instances n'ont pas d'adresse IP publique, et aucune table de routage n'est associée à Subnet1.

    Les instances de VMSS1 appellent une API publiée sur Internet par un partenaire nommé Fabrikam. Fabrikam n'accepte que les appels provenant d'adresses IP sources figurant dans sa liste d'autorisation, et cette liste peut contenir **au maximum deux** adresses IP publiques.

    Vous devez vous assurer que :

    - Chaque connexion Internet sortante des instances de VMSS1 utilise une adresse IP publique statique figurant dans la liste d'autorisation de Fabrikam, quel que soit le nombre d'instances.
    - Aucune connexion initiée depuis Internet ne peut atteindre les instances de VMSS1.
