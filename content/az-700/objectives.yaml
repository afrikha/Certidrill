# AZ-700 objectives — official study guide, skills measured as of 2026-07-27 (en-us and fr-fr pages, checked on 2026-11-16).
# `code` is the stable key referenced by question files and course sections.
# French: text of the fr-fr page with straight apostrophes; page typos fixed (1.1.3 final period, 1.2.2 "à pour", 4.1.6 straight quotes replaced by « »).
core:
- group:
    en: Design and implement IP addressing for Azure resources
    fr: Concevoir et implémenter un adressage IP pour des ressources Azure
  objectives:
  - code: 1.1.1
    en: Plan and implement network segmentation and address spaces
    fr: Planifier et implémenter la segmentation et les espaces d'adressage réseau
  - code: 1.1.2
    en: Create a virtual network (VNet)
    fr: Créer un réseau virtuel (VNet)
  - code: 1.1.3
    en: Plan and configure subnetting for services, including virtual network gateways, private endpoints, service endpoints, firewalls, application gateways, VNet-integrated platform services, and Azure Bastion
    fr: Planifier et configurer le sous-réseautage pour les services, y compris les passerelles de réseau virtuel, les points de terminaison privés, les points de terminaison de service, les pare-feu, les passerelles d'application, les services de plateforme intégrés au réseau virtuel et l'Azure Bastion
  - code: 1.1.4
    en: Plan and configure subnet delegation
    fr: Planifier et configurer la délégation de sous-réseau
  - code: 1.1.5
    en: Plan and configure shared or dedicated subnets
    fr: Planifier et configurer des sous-réseaux dédiés ou partagés
  - code: 1.1.6
    en: Create a Public IP Prefix
    fr: Créer un préfixe d'adresse IP publique
  - code: 1.1.7
    en: Choose when to use a public IP address prefix
    fr: Choisir quand utiliser un préfixe d'adresse IP publique
  - code: 1.1.8
    en: Plan and implement a Custom IP address prefix (bring your own IP)
    fr: Planifiez et implémentez un préfixe d'adresse IP personnalisée (apportez votre propre adresse IP)
  - code: 1.1.9
    en: Create a public IP address
    fr: Créer une adresse IP publique
  - code: 1.1.10
    en: Associate public IP addresses to resources
    fr: Associer des adresses IP publiques à des ressources
- group:
    en: Design and implement name resolution
    fr: Concevoir et implémenter la résolution de noms
  objectives:
  - code: 1.2.1
    en: Design name resolution inside a VNet
    fr: Concevoir la résolution de noms au sein d'un VNet (réseau virtuel)
  - code: 1.2.2
    en: Configure DNS settings for a VNet
    fr: Configurer les paramètres DNS pour un réseau virtuel
  - code: 1.2.3
    en: Design public DNS zones
    fr: Concevoir des zones DNS publiques
  - code: 1.2.4
    en: Design private DNS zones
    fr: Concevoir des zones DNS privées
  - code: 1.2.5
    en: Configure public and private DNS zones
    fr: Configurer des zones DNS publiques et privées
  - code: 1.2.6
    en: Link a private DNS zone to a VNet
    fr: Lier une zone DNS privée à un réseau virtuel
  - code: 1.2.7
    en: Design and implement Azure DNS Private Resolver
    fr: Concevoir et implémenter Azure DNS Private Resolver
- group:
    en: Design and implement VNet connectivity and routing
    fr: Concevoir et implémenter la connectivité et le routage de réseau virtuel
  objectives:
  - code: 1.3.1
    en: Design service chaining, including gateway transit
    fr: Concevoir le chaînage de services, y compris le transit de passerelle
  - code: 1.3.2
    en: Implement VNet peering
    fr: Implémenter VNet Peering
  - code: 1.3.3
    en: Implement and manage virtual network connectivity by using Azure Virtual Network Manager
    fr: Implémenter et gérer la connectivité des réseaux virtuels en utilisant Azure Virtual Network Manager
  - code: 1.3.4
    en: Design and implement user-defined routes (UDRs)
    fr: Concevoir et implémenter des routes définies par l'utilisateur
  - code: 1.3.5
    en: Associate a route table with a subnet
    fr: Associer une table de routage à un sous-réseau
  - code: 1.3.6
    en: Configure forced tunneling
    fr: Configurer un tunnel forcé
  - code: 1.3.7
    en: Diagnose and resolve routing issues
    fr: Diagnostiquer et résoudre les problèmes de routage
  - code: 1.3.8
    en: Design and implement Azure Route Server
    fr: Concevoir et implémenter un serveur de routes Azure
  - code: 1.3.9
    en: Identify appropriate use cases for Azure NAT Gateway
    fr: Identifier les cas d'usage appropriés pour la passerelle NAT Azure
  - code: 1.3.10
    en: Implement Azure NAT Gateway
    fr: Implémenter la passerelle NAT Azure
- group:
    en: Monitor networks
    fr: Superviser les réseaux
  objectives:
  - code: 1.4.1
    en: Configure monitoring, network diagnostics, and logs in Azure Network Watcher
    fr: Configurer la supervision, les diagnostics réseau et les journaux dans Azure Network Watcher
  - code: 1.4.2
    en: Monitor and troubleshoot network health by using Azure Network Watcher
    fr: Monitorer et dépanner l'intégrité du réseau en utilisant Azure Network Watcher
  - code: 1.4.3
    en: Monitor and troubleshoot networks by using Azure Monitor for Networks
    fr: Surveiller et résoudre les problèmes de réseaux à l'aide d'Azure Monitor pour réseaux
  - code: 1.4.4
    en: Activate and monitor distributed denial-of-service (DDoS) protection
    fr: Activer et superviser la protection DDoS (Distributed Denial-Of-Service)
  - code: 1.4.5
    en: Evaluate network security recommendations identified by Microsoft Defender for Cloud Secure Score
    fr: Évaluer des suggestions relatives à la sécurité réseau identifiées par Microsoft Defender for Cloud Secure Score (Score de sécurité Microsoft Defender pour le cloud)
  - code: 1.4.6
    en: Evaluate network security recommendations identified by Microsoft Defender for Cloud attack path analysis
    fr: Évaluer les recommandations de sécurité réseau identifiées par Microsoft Defender for Cloud analyse du chemin d'attaque
  - code: 1.4.7
    en: Identify network resources by using Cloud Security Explorer in Microsoft Defender for Cloud
    fr: Identifier les ressources réseau à l'aide de Cloud Security Explorer dans Microsoft Defender for Cloud
connectivity:
- group:
    en: Design, implement, and manage a site-to-site VPN connection
    fr: Concevoir, implémenter et gérer une connexion VPN de site à site
  objectives:
  - code: 2.1.1
    en: Design a site-to-site VPN connection, including for high availability
    fr: Concevoir une connexion VPN de site à site, y compris pour la haute disponibilité
  - code: 2.1.2
    en: Select an appropriate virtual network gateway stock-keeping unit (SKU) for site-to-site VPN requirements
    fr: Sélectionnez une unité de conservation de stock (SKU) de passerelle de réseau virtuel appropriée pour les exigences VPN de site à site
  - code: 2.1.3
    en: Implement a site-to-site VPN connection
    fr: Implémenter une connexion VPN de site à site
  - code: 2.1.4
    en: Identify when to use a policy-based VPN versus a route-based VPN connection
    fr: Identifier quand utiliser un VPN basé sur des stratégies ou une connexion VPN basée sur des routes
  - code: 2.1.5
    en: Create and configure a local network gateway
    fr: Créer et configurer une passerelle réseau locale
  - code: 2.1.6
    en: Create and configure an IPsec/Internet Key Exchange (IKE) policy
    fr: Créer et configurer une stratégie IPsec/IKE (Internet Key Exchange)
  - code: 2.1.7
    en: Create and configure a virtual network gateway
    fr: Créer et configurer une passerelle de réseau virtuel
  - code: 2.1.8
    en: Diagnose and resolve virtual network gateway connectivity issues
    fr: Diagnostiquer et résoudre les problèmes de connectivité d'une passerelle de réseau virtuel
  - code: 2.1.9
    en: Implement Azure Extended Network
    fr: Implémenter un réseau étendu Azure
- group:
    en: Design, implement, and manage a point-to-site VPN connection
    fr: Concevoir, implémenter et gérer une connexion VPN de point à site
  objectives:
  - code: 2.2.1
    en: Select an appropriate virtual network gateway SKU for point-to-site VPN requirements
    fr: Sélectionner une référence SKU de passerelle de réseau virtuel appropriée pour les exigences d'un VPN de point à site
  - code: 2.2.2
    en: Select and configure a tunnel type
    fr: Sélectionner et configurer un type de tunnel
  - code: 2.2.3
    en: Select an appropriate authentication method
    fr: Sélectionner une méthode d'authentification appropriée
  - code: 2.2.4
    en: Configure RADIUS authentication
    fr: Configurer l'authentification RADIUS
  - code: 2.2.5
    en: Configure authentication by using Microsoft Entra ID
    fr: Configurer l'authentification en utilisant Microsoft Entra ID
  - code: 2.2.6
    en: Implement a VPN client configuration file
    fr: Implémenter un fichier de configuration de client VPN
  - code: 2.2.7
    en: Diagnose and resolve client-side and authentication issues
    fr: Diagnostiquer et résoudre les problèmes d'authentification côté client
  - code: 2.2.8
    en: Specify Azure requirements for Always On VPN
    fr: Spécifier les exigences Azure pour le VPN Always On
  - code: 2.2.9
    en: Specify Azure requirements for Azure Network Adapter
    fr: Spécifier les exigences pour Carte réseau Azure
- group:
    en: Design, implement, and manage Azure ExpressRoute
    fr: Concevoir, implémenter et gérer Azure ExpressRoute
  objectives:
  - code: 2.3.1
    en: Select an ExpressRoute connectivity model
    fr: Sélectionner un modèle de connectivité ExpressRoute
  - code: 2.3.2
    en: Select an appropriate ExpressRoute SKU and tier
    fr: Sélectionner une référence SKU ExpressRoute et un niveau appropriés
  - code: 2.3.3
    en: Design and implement ExpressRoute to meet requirements, including cross-region connectivity, redundancy, and disaster recovery
    fr: Concevoir et implémenter ExpressRoute pour répondre aux exigences, y compris la connectivité inter-régions, la redondance et la reprise d'activité
  - code: 2.3.4
    en: Design and implement ExpressRoute options, including Global Reach, FastPath, and ExpressRoute Direct
    fr: Concevoir et implémenter les options ExpressRoute, y compris Global Reach, FastPath et ExpressRoute Direct
  - code: 2.3.5
    en: Choose between Azure private peering only, Microsoft peering only, or both
    fr: Choisir entre le Peering privé Azure uniquement, le Peering Microsoft uniquement, ou les deux
  - code: 2.3.6
    en: Configure Azure private peering
    fr: Configurer le peering privé Azure
  - code: 2.3.7
    en: Configure Microsoft peering
    fr: Configurer le peering Microsoft
  - code: 2.3.8
    en: Create and configure an ExpressRoute gateway
    fr: Créer et configurer une passerelle ExpressRoute
  - code: 2.3.9
    en: Connect a virtual network to an ExpressRoute circuit
    fr: Connecter un réseau virtuel à un circuit ExpressRoute
  - code: 2.3.10
    en: Recommend a route advertisement configuration
    fr: Recommander une configuration de publication de routage
  - code: 2.3.11
    en: Configure encryption over ExpressRoute
    fr: Configurer le chiffrement sur ExpressRoute
  - code: 2.3.12
    en: Implement Bidirectional Forwarding Detection
    fr: Implémenter la détection de transfert bidirectionnel
  - code: 2.3.13
    en: Diagnose and resolve ExpressRoute connection issues
    fr: Diagnostiquer et résoudre les problèmes de connexion ExpressRoute
- group:
    en: Design and implement an Azure Virtual WAN architecture
    fr: Concevoir et implémenter une architecture Azure Virtual WAN
  objectives:
  - code: 2.4.1
    en: Select a Virtual WAN SKU
    fr: Choisir un SKU de Virtual WAN
  - code: 2.4.2
    en: Design a Virtual WAN architecture, including selecting types and services
    fr: Concevoir une architecture Virtual WAN, y compris la sélection de types et de services
  - code: 2.4.3
    en: Create a virtual hub in Virtual WAN
    fr: Créer un hub virtuel dans Virtual WAN
  - code: 2.4.4
    en: Choose an appropriate scale unit for each gateway type
    fr: Choisir une unité d'échelle appropriée pour chaque type de passerelle
  - code: 2.4.5
    en: Deploy a gateway into a virtual hub
    fr: Déployer une passerelle dans un hub virtuel
  - code: 2.4.6
    en: Configure virtual hub routing
    fr: Configurer le routage de hub virtuel
  - code: 2.4.7
    en: Integrate a virtual hub with a third-party NVA for cloud connectivity
    fr: Intégrer un hub Virtual à une appliance virtuelle réseau (NVA) tierce pour la connectivité cloud
delivery:
- group:
    en: Design and implement Azure Load Balancer and Azure Traffic Manager
    fr: Concevoir et implémenter Azure Load Balancer et Azure Traffic Manager
  objectives:
  - code: 3.1.1
    en: Map requirements to features and capabilities of Azure Load Balancer
    fr: Faites correspondre les exigences aux fonctionnalités et capacités d'Azure Load Balancer
  - code: 3.1.2
    en: Identify appropriate use cases for Azure Load Balancer
    fr: Identifier les cas d'usage appropriés pour Azure Load Balancer
  - code: 3.1.3
    en: Choose an Azure Load Balancer SKU and tier
    fr: Choisir une référence SKU et un niveau d'Azure Load Balancer
  - code: 3.1.4
    en: Choose between public and internal load balancers
    fr: Choisir entre des équilibreurs de charge publics et internes
  - code: 3.1.5
    en: Choose between regional and cross-region load balancers
    fr: Choisir entre les équilibreurs de charge régionaux et interrégions
  - code: 3.1.6
    en: Create and configure an Azure Load Balancer
    fr: Créer et configurer un équilibreur de charge Azure
  - code: 3.1.7
    en: Implement Azure Traffic Manager
    fr: Implémenter Azure Traffic Manager
  - code: 3.1.8
    en: Implement Gateway Load Balancer
    fr: Implémenter l'équilibreur de charge de passerelle
  - code: 3.1.9
    en: Implement a load balancing rule
    fr: Implémenter une règle d'équilibrage de charge
  - code: 3.1.10
    en: Create and configure inbound NAT rules
    fr: Créer et configurer des règles NAT de trafic entrant
  - code: 3.1.11
    en: Create and configure explicit outbound rules, including source network address translation (SNAT)
    fr: Créer et configurer des règles de trafic sortant explicites, notamment la traduction d'adresses réseau sources (SNAT)
- group:
    en: Design and implement Azure Application Gateway
    fr: Concevoir et implémenter Azure Application Gateway
  objectives:
  - code: 3.2.1
    en: Map requirements to features and capabilities of Azure Application Gateway
    fr: Mapper des exigences aux fonctionnalités et aux capacités d'Azure Application Gateway
  - code: 3.2.2
    en: Identify appropriate use cases for Azure Application Gateway
    fr: Identifier les cas d'usage appropriés pour Azure Application Gateway
  - code: 3.2.3
    en: Choose between manual and autoscale
    fr: Choisir entre la mise à l'échelle manuelle et la mise à l'échelle automatique
  - code: 3.2.4
    en: Create a backend pool
    fr: Créer un pool principal
  - code: 3.2.5
    en: Configure health probes
    fr: Configurer les sondes de santé
  - code: 3.2.6
    en: Configure listeners
    fr: Configurer des écouteurs
  - code: 3.2.7
    en: Configure routing rules
    fr: Configurer des règles d'acheminement
  - code: 3.2.8
    en: Configure HTTP settings
    fr: Configuration des paramètres HTTP
  - code: 3.2.9
    en: Configure Transport Layer Security (TLS)
    fr: Configurer le protocole TLS (Transport Layer Security)
  - code: 3.2.10
    en: Configure rewrite rule sets
    fr: Configurer des ensembles de règles de réécriture
- group:
    en: Design and implement Azure Front Door
    fr: Concevoir et implémenter Azure Front Door
  objectives:
  - code: 3.3.1
    en: Map requirements to features and capabilities of Azure Front Door
    fr: Associer des besoins aux fonctionnalités et aux capacités d'Azure Front Door
  - code: 3.3.2
    en: Identify appropriate use cases for Azure Front Door
    fr: Identifier les cas d'usage appropriés pour Azure Front Door
  - code: 3.3.3
    en: Choose an appropriate tier
    fr: Choisir un niveau approprié
  - code: 3.3.4
    en: Configure an Azure Front Door, including routing, origins, and endpoints
    fr: Configurer une instance Azure Front Door, y compris le routage, les origines et les points de terminaison
  - code: 3.3.5
    en: Configure TLS termination and end-to-end TLS encryption
    fr: Configurer l'arrêt TLS et le chiffrement TLS de bout en bout
  - code: 3.3.6
    en: Configure caching
    fr: Configurer la mise en cache
  - code: 3.3.7
    en: Configure traffic acceleration
    fr: Configurer l'accélération du trafic
  - code: 3.3.8
    en: Implement rules, URL rewrite, and URL redirect
    fr: Implémenter des règles, la réécriture d'URL et la redirection d'URL
  - code: 3.3.9
    en: Secure an origin by using Azure Private Link in Azure Front Door
    fr: Sécuriser une origine en utilisant Azure Private Link dans Azure Front Door
