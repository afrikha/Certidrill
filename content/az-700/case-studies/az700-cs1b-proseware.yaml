id: az700-cs1b-proseware
status: draft
title:
  en: Proseware
  fr: Proseware
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Proseware, Inc. publishes an online learning platform used by 300 universities in Europe and North America. Students follow video courses and take online exams on a web portal.

        Proseware has no datacenter. The portal runs entirely in Azure, and Proseware plans to publish it through a single global entry point.
      fr: |
        Proseware, Inc. édite une plateforme d'apprentissage en ligne utilisée par 300 universités en Europe et en Amérique du Nord. Les étudiants suivent des cours vidéo et passent des examens en ligne sur un portail web.

        Proseware n'a pas de centre de données. Le portail fonctionne entièrement dans Azure, et Proseware prévoit de le publier par un point d'entrée mondial unique.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Proseware has an Azure subscription named **Sub-Learn** that contains the following resources.

        | Name | Type | Region | Configuration |
        | --- | --- | --- | --- |
        | app-portal-ne | Web app | North Europe | Premium v3 App Service plan; virtual network integration with snet-int of VNet-NE |
        | app-portal-eus | Web app | East US | Premium v3 App Service plan; same code as app-portal-ne |
        | VNet-NE | Virtual network | North Europe | 10.40.0.0/16; subnets snet-int (10.40.1.0/26, delegated to `Microsoft.Web/serverFarms`) and snet-pe (10.40.2.0/24, empty) |
        | sql-proseware | Azure SQL logical server | North Europe | Hosts the database **ExamsDb**; public network access enabled |
        | proseware.com | Public DNS zone | Global | Contains the record set **www**, a CNAME that points to app-portal-ne.azurewebsites.net |

        - Only app-portal-ne connects to ExamsDb. Its connection string uses the server name **sql-proseware.database.windows.net**.
        - VNet-NE uses the Azure-provided DNS service.
      fr: |
        Proseware dispose d'un abonnement Azure nommé **Sub-Learn** qui contient les ressources suivantes.

        | Nom | Type | Région | Configuration |
        | --- | --- | --- | --- |
        | app-portal-ne | Application web | North Europe | Plan App Service Premium v3 ; intégration au réseau virtuel avec snet-int de VNet-NE |
        | app-portal-eus | Application web | East US | Plan App Service Premium v3 ; même code qu'app-portal-ne |
        | VNet-NE | Réseau virtuel | North Europe | 10.40.0.0/16 ; sous-réseaux snet-int (10.40.1.0/26, délégué à `Microsoft.Web/serverFarms`) et snet-pe (10.40.2.0/24, vide) |
        | sql-proseware | Serveur logique Azure SQL | North Europe | Héberge la base de données **ExamsDb** ; accès au réseau public activé |
        | proseware.com | Zone DNS publique | Globale | Contient le jeu d'enregistrements **www**, un CNAME qui pointe vers app-portal-ne.azurewebsites.net |

        - Seule app-portal-ne se connecte à ExamsDb. Sa chaîne de connexion utilise le nom de serveur **sql-proseware.database.windows.net**.
        - VNet-NE utilise le service DNS fourni par Azure.
  - key: planned
    title: { en: "Planned changes", fr: "Changements prévus" }
    body:
      en: |
        Proseware plans to deploy an Azure Front Door profile named **fd-proseware** that has one endpoint named **ep-portal** and one origin group named **og-portal**. app-portal-ne and app-portal-eus will be the origins of og-portal.

        Students will reach the portal at **proseware.com** and **www.proseware.com**.
      fr: |
        Proseware prévoit de déployer un profil Azure Front Door nommé **fd-proseware** qui comporte un point de terminaison nommé **ep-portal** et un groupe d'origines nommé **og-portal**. app-portal-ne et app-portal-eus seront les origines d'og-portal.

        Les étudiants accéderont au portail à **proseware.com** et à **www.proseware.com**.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Delivery requirements**

        - Each request must be served by the web app that has the lowest latency from the Front Door environment that receives the request.
        - If a web app fails its health probes, all requests must go to the other web app.
        - Azure Front Door must reach the web apps over private connections, and the web apps must reject any other traffic.

        **Security requirements**

        - The portal must be protected against common web attacks, such as those of the OWASP Top 10, by rules that Microsoft manages, and against malicious bots.
        - During the first two weeks after go-live, the web application firewall (WAF) must block no request, but every request that matches a rule must be logged so that false positives can be reviewed. After two weeks, matching requests will be blocked.

        **Data requirements**

        - app-portal-ne must connect to ExamsDb by using a private IP address.
        - sql-proseware must refuse every connection that comes from a public network.
        - The connection string of app-portal-ne must not change.
      fr: |
        **Exigences de distribution**

        - Chaque requête doit être servie par l'application web dont la latence est la plus faible depuis l'environnement Front Door qui reçoit la requête.
        - Si une application web échoue à ses sondes d'intégrité, toutes les requêtes doivent aller vers l'autre application web.
        - Azure Front Door doit joindre les applications web par des connexions privées, et les applications web doivent rejeter tout autre trafic.

        **Exigences de sécurité**

        - Le portail doit être protégé contre les attaques web courantes, comme celles du Top 10 de l'OWASP, par des règles gérées par Microsoft, et contre les bots malveillants.
        - Pendant les deux premières semaines après la mise en service, le pare-feu d'applications web (WAF) ne doit bloquer aucune requête, mais chaque requête qui correspond à une règle doit être journalisée pour permettre l'examen des faux positifs. Après deux semaines, les requêtes correspondantes seront bloquées.

        **Exigences relatives aux données**

        - app-portal-ne doit se connecter à ExamsDb à l'aide d'une adresse IP privée.
        - sql-proseware doit refuser toute connexion provenant d'un réseau public.
        - La chaîne de connexion d'app-portal-ne ne doit pas changer.
