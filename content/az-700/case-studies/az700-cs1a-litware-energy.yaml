id: az700-cs1a-litware-energy
status: draft
title:
  en: Litware Energy
  fr: Litware Energy
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Litware Energy, Inc. operates wind farms and the grid control center of the northern Netherlands. The company has 1,800 employees. The head office and the only datacenter are in Groningen.

        Litware Energy is moving its billing application and the historian of its supervisory control and data acquisition (SCADA) system to Azure. All Azure resources are deployed to the West Europe region.
      fr: |
        Litware Energy, Inc. exploite des parcs éoliens et le centre de contrôle du réseau électrique du nord des Pays-Bas. La société compte 1 800 employés. Le siège et l'unique centre de données se trouvent à Groningue.

        Litware Energy déplace vers Azure son application de facturation et l'historien de son système de supervision et d'acquisition de données (SCADA). Toutes les ressources Azure sont déployées dans la région West Europe.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Groningen datacenter**

        - The datacenter uses the address space 192.168.0.0/16.
        - Two DNS servers named **DC1** (192.168.10.10) and **DC2** (192.168.10.11) host the Active Directory Domain Services (AD DS) zone **corp.litware.com**. All on-premises clients use DC1 and DC2.
        - An ExpressRoute circuit named **ER-GRN** connects the datacenter to Azure. Azure private peering is configured. The datacenter edge routers advertise 192.168.0.0/16 over ER-GRN.

        **Azure**

        Litware Energy has an Azure subscription named **Sub-Energy** that contains the following virtual networks.

        | Virtual network | Address space | Subnets |
        | --- | --- | --- |
        | VNet-Hub | 10.20.0.0/22 | GatewaySubnet (10.20.0.0/27), AzureFirewallSubnet (10.20.1.0/26), snet-dns-in (10.20.2.0/28), snet-dns-out (10.20.2.16/28) |
        | VNet-Scada | 10.21.0.0/16 | snet-hist (10.21.1.0/24) |
        | VNet-Billing | 10.22.0.0/16 | snet-app (10.22.1.0/24) |

        - GatewaySubnet contains an ExpressRoute gateway named **ErGw-Hub** (ErGw1AZ) that is connected to ER-GRN.
        - AzureFirewallSubnet is empty. snet-dns-in and snet-dns-out are empty and delegated to `Microsoft.Network/dnsResolvers`.
        - VNet-Hub is peered with VNet-Scada and with VNet-Billing. On every peering link, **Allow forwarded traffic** is enabled. No other peering setting is enabled.
        - All the virtual networks use the Azure-provided DNS service. No route table exists.
        - A storage account named **stlitwarescada** has a private endpoint in snet-hist. A private DNS zone named **privatelink.blob.core.windows.net** contains the A record of the private endpoint and is linked to VNet-Hub and VNet-Scada.
      fr: |
        **Centre de données de Groningue**

        - Le centre de données utilise l'espace d'adressage 192.168.0.0/16.
        - Deux serveurs DNS nommés **DC1** (192.168.10.10) et **DC2** (192.168.10.11) hébergent la zone Active Directory Domain Services (AD DS) **corp.litware.com**. Tous les clients locaux utilisent DC1 et DC2.
        - Un circuit ExpressRoute nommé **ER-GRN** relie le centre de données à Azure. Le peering privé Azure est configuré. Les routeurs de périphérie du centre de données annoncent 192.168.0.0/16 sur ER-GRN.

        **Azure**

        Litware Energy dispose d'un abonnement Azure nommé **Sub-Energy** qui contient les réseaux virtuels suivants.

        | Réseau virtuel | Espace d'adressage | Sous-réseaux |
        | --- | --- | --- |
        | VNet-Hub | 10.20.0.0/22 | GatewaySubnet (10.20.0.0/27), AzureFirewallSubnet (10.20.1.0/26), snet-dns-in (10.20.2.0/28), snet-dns-out (10.20.2.16/28) |
        | VNet-Scada | 10.21.0.0/16 | snet-hist (10.21.1.0/24) |
        | VNet-Billing | 10.22.0.0/16 | snet-app (10.22.1.0/24) |

        - GatewaySubnet contient une passerelle ExpressRoute nommée **ErGw-Hub** (ErGw1AZ) connectée à ER-GRN.
        - AzureFirewallSubnet est vide. snet-dns-in et snet-dns-out sont vides et délégués à `Microsoft.Network/dnsResolvers`.
        - VNet-Hub est relié par peering à VNet-Scada et à VNet-Billing. Sur chaque lien de peering, **Allow forwarded traffic** est activé. Aucun autre paramètre de peering n'est activé.
        - Tous les réseaux virtuels utilisent le service DNS fourni par Azure. Aucune table de routage n'existe.
        - Un compte de stockage nommé **stlitwarescada** possède un point de terminaison privé dans snet-hist. Une zone DNS privée nommée **privatelink.blob.core.windows.net** contient l'enregistrement A du point de terminaison privé et est liée à VNet-Hub et à VNet-Scada.
  - key: planned
    title: { en: "Planned changes", fr: "Changements prévus" }
    body:
      en: |
        Litware Energy plans to implement the following changes:

        - Deploy a VPN gateway named **VpnGw-Hub** to VNet-Hub, and create a site-to-site VPN connection that uses BGP between VpnGw-Hub and the Groningen datacenter. The VPN connection is a backup of ER-GRN.
        - Deploy an Azure DNS Private Resolver named **dnspr-hub** to VNet-Hub.
        - Deploy an Azure Firewall named **FW1** to AzureFirewallSubnet. FW1 will use the private IP address 10.20.1.4.
      fr: |
        Litware Energy prévoit de mettre en œuvre les changements suivants :

        - Déployer une passerelle VPN nommée **VpnGw-Hub** dans VNet-Hub et créer une connexion VPN de site à site qui utilise BGP entre VpnGw-Hub et le centre de données de Groningue. La connexion VPN sert de secours à ER-GRN.
        - Déployer un Azure DNS Private Resolver nommé **dnspr-hub** dans VNet-Hub.
        - Déployer un Pare-feu Azure nommé **FW1** dans AzureFirewallSubnet. FW1 utilisera l'adresse IP privée 10.20.1.4.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Connectivity requirements**

        - The virtual machines in VNet-Scada and VNet-Billing must reach the Groningen datacenter through the gateways of VNet-Hub. No gateway can be deployed to VNet-Scada or VNet-Billing.
        - If ER-GRN fails, the traffic between Azure and the datacenter must fail over to the VPN connection automatically.

        **Name resolution requirements**

        - The virtual machines in all the virtual networks must resolve the names of corp.litware.com by using DC1 and DC2.
        - On-premises clients must resolve **stlitwarescada.blob.core.windows.net** to the private IP address of its private endpoint.
        - No DNS server can be deployed on a virtual machine in Azure. The DNS servers setting of the virtual networks must remain the Azure-provided DNS service.

        **Security requirements**

        - The internet-bound traffic from snet-app must go through FW1.
        - FW1 must decrypt and inspect outbound HTTPS traffic, filter it on the full URL path, and block the traffic that matches intrusion signatures.
        - Costs must be minimized.
      fr: |
        **Exigences de connectivité**

        - Les machines virtuelles de VNet-Scada et de VNet-Billing doivent joindre le centre de données de Groningue par les passerelles de VNet-Hub. Aucune passerelle ne peut être déployée dans VNet-Scada ni dans VNet-Billing.
        - Si ER-GRN tombe en panne, le trafic entre Azure et le centre de données doit basculer automatiquement sur la connexion VPN.

        **Exigences de résolution de noms**

        - Les machines virtuelles de tous les réseaux virtuels doivent résoudre les noms de corp.litware.com à l'aide de DC1 et DC2.
        - Les clients locaux doivent résoudre **stlitwarescada.blob.core.windows.net** en l'adresse IP privée de son point de terminaison privé.
        - Aucun serveur DNS ne peut être déployé sur une machine virtuelle dans Azure. Le paramètre de serveurs DNS des réseaux virtuels doit rester le service DNS fourni par Azure.

        **Exigences de sécurité**

        - Le trafic à destination d'Internet issu de snet-app doit passer par FW1.
        - FW1 doit déchiffrer et inspecter le trafic HTTPS sortant, le filtrer sur le chemin d'URL complet et bloquer le trafic qui correspond à des signatures d'intrusion.
        - Les coûts doivent être réduits au minimum.
