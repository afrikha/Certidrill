id: az700-cs1c-wingtip-toys
status: draft
title:
  en: Wingtip Toys
  fr: Wingtip Toys
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Wingtip Toys sells toys through 180 stores in Germany, Austria and Switzerland. The head office and the datacenter are in Munich. In addition to the store staff, 450 store managers and sales representatives work remotely.

        Wingtip Toys plans to replace the VPN concentrator of the Munich datacenter with Azure Virtual WAN, which will connect the stores, the remote staff, the datacenter and the point-of-sale (POS) applications hosted in Azure.
      fr: |
        Wingtip Toys vend des jouets dans 180 magasins en Allemagne, en Autriche et en Suisse. Le siège et le centre de données se trouvent à Munich. En plus du personnel des magasins, 450 gérants de magasin et commerciaux travaillent à distance.

        Wingtip Toys prévoit de remplacer le concentrateur VPN du centre de données de Munich par Azure Virtual WAN, qui reliera les magasins, le personnel à distance, le centre de données et les applications de point de vente (POS) hébergées dans Azure.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **On-premises environment**

        - The Munich datacenter uses the address space 172.16.0.0/16. An ExpressRoute circuit named **ER-MUC** (1 Gbps) is provisioned, and Azure private peering is configured. ER-MUC isn't connected to any gateway yet.
        - Each store uses a /24 range from 10.100.0.0/16 and has an internet connection and a VPN device that supports IKEv2 and BGP.
        - The remote staff use Windows 11 and macOS laptops. All users have accounts in the Microsoft Entra tenant of Wingtip Toys.

        **Azure environment**

        Wingtip Toys has an Azure subscription named **Sub-Retail** that contains the following resources in the Germany West Central region.

        | Name | Type | Configuration |
        | --- | --- | --- |
        | VNet-POS | Virtual network | 10.60.0.0/16; subnets snet-api (10.60.1.0/24) and snet-db (10.60.2.0/24) |
        | VNet-Inventory | Virtual network | 10.61.0.0/16; subnet snet-app (10.61.1.0/24) |
        | VM-POSAPI1 | Virtual machine | Runs the POS API; IP address 10.60.1.4 in snet-api |
        | VM-POSDB1 | Virtual machine | Runs SQL Server; IP address 10.60.2.4 in snet-db |
        | stwtlogsgwc | Storage account | General-purpose v2, Standard performance, Germany West Central |
        | stwtlogsweu | Storage account | General-purpose v2, Standard performance, West Europe |

        - No virtual network has a virtual network gateway. Network Watcher is enabled in Germany West Central.
        - VM-POSAPI1 calls the API of the payment provider Fabrikam at **https://api.fabrikam.com** on TCP port 443.
      fr: |
        **Environnement local**

        - Le centre de données de Munich utilise l'espace d'adressage 172.16.0.0/16. Un circuit ExpressRoute nommé **ER-MUC** (1 Gbit/s) est provisionné, et le peering privé Azure est configuré. ER-MUC n'est encore connecté à aucune passerelle.
        - Chaque magasin utilise une plage /24 de 10.100.0.0/16 et dispose d'une connexion Internet et d'un appareil VPN qui prend en charge IKEv2 et BGP.
        - Le personnel à distance utilise des ordinateurs portables Windows 11 et macOS. Tous les utilisateurs ont un compte dans le locataire Microsoft Entra de Wingtip Toys.

        **Environnement Azure**

        Wingtip Toys dispose d'un abonnement Azure nommé **Sub-Retail** qui contient les ressources suivantes dans la région Germany West Central.

        | Nom | Type | Configuration |
        | --- | --- | --- |
        | VNet-POS | Réseau virtuel | 10.60.0.0/16 ; sous-réseaux snet-api (10.60.1.0/24) et snet-db (10.60.2.0/24) |
        | VNet-Inventory | Réseau virtuel | 10.61.0.0/16 ; sous-réseau snet-app (10.61.1.0/24) |
        | VM-POSAPI1 | Machine virtuelle | Exécute l'API POS ; adresse IP 10.60.1.4 dans snet-api |
        | VM-POSDB1 | Machine virtuelle | Exécute SQL Server ; adresse IP 10.60.2.4 dans snet-db |
        | stwtlogsgwc | Compte de stockage | Usage général v2, performances Standard, Germany West Central |
        | stwtlogsweu | Compte de stockage | Usage général v2, performances Standard, West Europe |

        - Aucun réseau virtuel ne possède de passerelle de réseau virtuel. Network Watcher est activé dans Germany West Central.
        - VM-POSAPI1 appelle l'API du prestataire de paiement Fabrikam à **https://api.fabrikam.com** sur le port TCP 443.
  - key: planned
    title: { en: "Planned changes", fr: "Changements prévus" }
    body:
      en: |
        Wingtip Toys plans to implement the following changes:

        - Create a virtual WAN named **vwan-wingtip** that has one virtual hub named **hub-gwc** in Germany West Central.
        - Connect the stores to hub-gwc by using site-to-site VPN, the remote staff by using point-to-site VPN, and the datacenter by using ER-MUC.
        - Connect VNet-POS and VNet-Inventory to hub-gwc.
        - Deploy an Azure Firewall named **FW-Hub** in hub-gwc and manage it with an Azure Firewall Manager policy.
      fr: |
        Wingtip Toys prévoit de mettre en œuvre les changements suivants :

        - Créer un WAN virtuel nommé **vwan-wingtip** qui comporte un hub virtuel nommé **hub-gwc** dans Germany West Central.
        - Connecter les magasins à hub-gwc par un VPN de site à site, le personnel à distance par un VPN de point à site, et le centre de données par ER-MUC.
        - Connecter VNet-POS et VNet-Inventory à hub-gwc.
        - Déployer un Pare-feu Azure nommé **FW-Hub** dans hub-gwc et le gérer avec une stratégie Azure Firewall Manager.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Connectivity requirements**

        - The stores, the datacenter, the remote staff and both virtual networks must be able to communicate with each other through hub-gwc.
        - At peak time, the stores send up to 1.4 Gbps in total through their site-to-site VPN connections.
        - Up to 420 remote staff members connect at the same time. Their aggregate throughput stays below 300 Mbps.
        - The traffic between the datacenter and Azure reaches up to 1 Gbps.
        - Each gateway must use the minimum number of scale units that meets these needs.

        **Remote access requirements**

        - Remote staff members must sign in with their Microsoft Entra accounts, and the Conditional Access policies of Wingtip Toys must apply to the VPN sign-ins.

        **Security requirements**

        - FW-Hub must inspect the traffic between the stores and the virtual networks, the traffic between the two virtual networks, and the internet-bound traffic of the virtual networks.
        - No route table can be created or associated in VNet-POS or VNet-Inventory.

        **Monitoring requirements**

        - All the IP flows of VNet-POS, allowed and denied, must be recorded and analyzed with traffic analytics.
        - The packet loss and the round-trip time between VM-POSAPI1 and the Fabrikam API must be measured continuously, and an alert must be raised when more than 10 percent of the checks fail.
      fr: |
        **Exigences de connectivité**

        - Les magasins, le centre de données, le personnel à distance et les deux réseaux virtuels doivent pouvoir communiquer entre eux par hub-gwc.
        - En période de pointe, les magasins envoient au total jusqu'à 1,4 Gbit/s par leurs connexions VPN de site à site.
        - Jusqu'à 420 membres du personnel à distance se connectent en même temps. Leur débit agrégé reste inférieur à 300 Mbit/s.
        - Le trafic entre le centre de données et Azure atteint jusqu'à 1 Gbit/s.
        - Chaque passerelle doit utiliser le nombre minimal d'unités d'échelle qui répond à ces besoins.

        **Exigences d'accès à distance**

        - Les membres du personnel à distance doivent se connecter avec leur compte Microsoft Entra, et les stratégies d'accès conditionnel de Wingtip Toys doivent s'appliquer aux connexions VPN.

        **Exigences de sécurité**

        - FW-Hub doit inspecter le trafic entre les magasins et les réseaux virtuels, le trafic entre les deux réseaux virtuels et le trafic à destination d'Internet des réseaux virtuels.
        - Aucune table de routage ne peut être créée ou associée dans VNet-POS ou VNet-Inventory.

        **Exigences de supervision**

        - Tous les flux IP de VNet-POS, autorisés et refusés, doivent être enregistrés et analysés avec traffic analytics.
        - La perte de paquets et le temps aller-retour entre VM-POSAPI1 et l'API Fabrikam doivent être mesurés en continu, et une alerte doit être déclenchée lorsque plus de 10 % des vérifications échouent.
