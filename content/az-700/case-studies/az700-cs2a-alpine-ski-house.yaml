id: az700-cs2a-alpine-ski-house
status: draft
title:
  en: |
    Alpine Ski House
  fr: |
    Alpine Ski House
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Alpine Ski House operates 14 ski resorts in the French and Swiss Alps. The head office is in Annecy. The booking system of the resorts runs in Azure, in the France Central region.

        A network team of three engineers manages the connections of the resorts and the Azure environment. Alpine Ski House plans to connect new resorts over the next two years.
      fr: |
        Alpine Ski House exploite 14 stations de ski dans les Alpes françaises et suisses. Le siège se trouve à Annecy. Le système de réservation des stations s'exécute dans Azure, dans la région France Central.

        Une équipe réseau de trois ingénieurs gère les connexions des stations et l'environnement Azure. Alpine Ski House prévoit de connecter de nouvelles stations au cours des deux prochaines années.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **On-premises sites**

        - The Annecy head office uses 172.16.0.0/16. Its VPN device connects to VGW-Hub over a site-to-site VPN connection that uses BGP.
        - Ten resorts use addresses in 10.100.0.0/16. Each resort has its own firewall and a site-to-site VPN connection to VGW-Hub.
        - Four resorts use addresses in 10.120.0.0/16. They connect through SD-WAN tunnels that terminate on nva-sdwan1.
        - The firewall of the **Megève** resort was replaced last week. Since then, the connection **cn-megeve** shows the status **Not connected**.

        **Azure**

        Alpine Ski House has an Azure subscription named **Sub-Resorts** that contains the following resources in France Central.

        | Name | Type | Configuration |
        | --- | --- | --- |
        | VNet-Hub | Virtual network | 10.10.0.0/16; subnets GatewaySubnet (10.10.0.0/27), AzureBastionSubnet (10.10.1.0/26), snet-sdwan (10.10.2.0/24), snet-mgmt (10.10.3.0/24) |
        | VNet-Booking | Virtual network | 10.20.0.0/16; subnet snet-app (10.20.1.0/24) that contains VM-BOOK1 (10.20.1.4) and VM-BOOK2 (10.20.1.5) |
        | VGW-Hub | VPN gateway | Route-based, VpnGw2AZ (Generation2), active-active, BGP enabled with ASN 65515 |
        | nva-sdwan1 | Virtual machine | SD-WAN network virtual appliance in snet-sdwan (10.10.2.4); supports multi-hop eBGP with ASN 65020; IP forwarding enabled |
        | bas-hub | Azure Bastion | Standard SKU in VNet-Hub; the network security group **NSG-Bastion** is associated with AzureBastionSubnet |

        VNet-Booking is peered with VNet-Hub. The peering uses the default settings. The network security group of snet-app allows RDP (TCP 3389) from 10.10.1.0/26.

        Administrators can open RDP sessions on the virtual machines of snet-mgmt through bas-hub, but not on VM-BOOK1 or VM-BOOK2.
      fr: |
        **Sites locaux**

        - Le siège d'Annecy utilise 172.16.0.0/16. Son périphérique VPN se connecte à VGW-Hub par une connexion VPN de site à site qui utilise BGP.
        - Dix stations utilisent des adresses de 10.100.0.0/16. Chaque station dispose de son propre pare-feu et d'une connexion VPN de site à site vers VGW-Hub.
        - Quatre stations utilisent des adresses de 10.120.0.0/16. Elles se connectent par des tunnels SD-WAN qui aboutissent sur nva-sdwan1.
        - Le pare-feu de la station de **Megève** a été remplacé la semaine dernière. Depuis, la connexion **cn-megeve** affiche l'état **Not connected**.

        **Azure**

        Alpine Ski House dispose d'un abonnement Azure nommé **Sub-Resorts** qui contient les ressources suivantes dans France Central.

        | Nom | Type | Configuration |
        | --- | --- | --- |
        | VNet-Hub | Réseau virtuel | 10.10.0.0/16 ; sous-réseaux GatewaySubnet (10.10.0.0/27), AzureBastionSubnet (10.10.1.0/26), snet-sdwan (10.10.2.0/24), snet-mgmt (10.10.3.0/24) |
        | VNet-Booking | Réseau virtuel | 10.20.0.0/16 ; sous-réseau snet-app (10.20.1.0/24) qui contient VM-BOOK1 (10.20.1.4) et VM-BOOK2 (10.20.1.5) |
        | VGW-Hub | Passerelle VPN | Basée sur des routes, VpnGw2AZ (Generation2), actif-actif, BGP activé avec l'ASN 65515 |
        | nva-sdwan1 | Machine virtuelle | Appliance virtuelle réseau SD-WAN dans snet-sdwan (10.10.2.4) ; prend en charge l'eBGP multitronçon avec l'ASN 65020 ; transfert IP activé |
        | bas-hub | Azure Bastion | Référence SKU Standard dans VNet-Hub ; le groupe de sécurité réseau **NSG-Bastion** est associé à AzureBastionSubnet |

        VNet-Booking est connecté à VNet-Hub par un peering. Le peering utilise les paramètres par défaut. Le groupe de sécurité réseau de snet-app autorise RDP (TCP 3389) depuis 10.10.1.0/26.

        Les administrateurs peuvent ouvrir des sessions RDP sur les machines virtuelles de snet-mgmt par bas-hub, mais pas sur VM-BOOK1 ni VM-BOOK2.
  - key: planned
    title: { en: "Planned changes", fr: "Changements prévus" }
    body:
      en: |
        Alpine Ski House plans the following changes:

        - Connect the new **Chamonix** resort to VGW-Hub. The Chamonix firewall supports only policy-based VPN configurations and uses IKEv2. The Chamonix systems only need to reach VNet-Hub.
        - Deploy an Azure Route Server named **rs-hub** in VNet-Hub and configure a BGP peering between rs-hub and nva-sdwan1.
        - Connect more resorts by site-to-site VPN. By the end of 2028, VGW-Hub will have 42 site-to-site connections. Their aggregate throughput won't exceed 2 Gbps.
      fr: |
        Alpine Ski House prévoit les changements suivants :

        - Connecter la nouvelle station de **Chamonix** à VGW-Hub. Le pare-feu de Chamonix ne prend en charge que les configurations VPN basées sur des stratégies et utilise IKEv2. Les systèmes de Chamonix n'ont besoin d'atteindre que VNet-Hub.
        - Déployer un Azure Route Server nommé **rs-hub** dans VNet-Hub et configurer un peering BGP entre rs-hub et nva-sdwan1.
        - Connecter d'autres stations par VPN de site à site. D'ici fin 2028, VGW-Hub comptera 42 connexions de site à site. Leur débit agrégé ne dépassera pas 2 Gbit/s.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Alpine Ski House identifies the following requirements:

        1. The Chamonix connection must use the following settings: IKE encryption AES256, IKE integrity SHA256, DH group 14, IPsec encryption AES-GCM with a 256-bit key, perfect forward secrecy (PFS) with DH group 14, SA lifetime 27,000 seconds and 102,400,000 KB.
        2. The routes advertised by nva-sdwan1 must be programmed into the virtual machines of VNet-Hub and VNet-Booking, and the Annecy head office must learn the prefixes of the SD-WAN resorts. No user-defined route must be used for these prefixes.
        3. The virtual machines of VNet-Booking must be able to reach the head office and the resorts.
        4. Administrators must connect to the virtual machines of VNet-Hub and VNet-Booking only through bas-hub. NSG-Bastion must remain associated with AzureBastionSubnet.
        5. VGW-Hub must support the planned connections and remain zone-redundant. Costs must be minimized.
        6. VPN connection problems must be diagnosed with Azure tools. Administrative effort must be minimized.
      fr: |
        Alpine Ski House a défini les exigences suivantes :

        1. La connexion de Chamonix doit utiliser les paramètres suivants : chiffrement IKE AES256, intégrité IKE SHA256, groupe DH 14, chiffrement IPsec AES-GCM avec une clé de 256 bits, confidentialité persistante parfaite (PFS) avec le groupe DH 14, durée de vie de SA de 27 000 secondes et 102 400 000 Ko.
        2. Les routes publiées par nva-sdwan1 doivent être programmées dans les machines virtuelles de VNet-Hub et de VNet-Booking, et le siège d'Annecy doit apprendre les préfixes des stations SD-WAN. Aucun itinéraire défini par l'utilisateur ne doit être utilisé pour ces préfixes.
        3. Les machines virtuelles de VNet-Booking doivent pouvoir atteindre le siège et les stations.
        4. Les administrateurs doivent se connecter aux machines virtuelles de VNet-Hub et de VNet-Booking uniquement par bas-hub. NSG-Bastion doit rester associé à AzureBastionSubnet.
        5. VGW-Hub doit prendre en charge les connexions prévues et rester redondant interzone. Les coûts doivent être réduits au minimum.
        6. Les problèmes de connexion VPN doivent être diagnostiqués avec des outils Azure. L'effort d'administration doit être réduit au minimum.
