id: az120-4b-ha-rhel-agent
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs the ASCS and ERS instances of an SAP system in a two-node Pacemaker cluster on Red Hat Enterprise Linux 8.8 Azure VMs. Fabrikam plans to add a high-availability cluster (Pacemaker) provider to its Azure Monitor for SAP solutions resource.

    You need to prepare the cluster nodes for the provider.

    What should you install on each node?
  fr: |
    Fabrikam exécute les instances ASCS et ERS d'un système SAP dans un cluster Pacemaker à deux nœuds sur des machines virtuelles Azure Red Hat Enterprise Linux 8.8. Fabrikam prévoit d'ajouter un fournisseur de cluster à haute disponibilité (Pacemaker) à sa ressource Azure Monitor pour solutions SAP.

    Vous devez préparer les nœuds du cluster pour le fournisseur.

    Que devez-vous installer sur chaque nœud ?
body:
  options:
    - { id: a, text: { en: "Performance Co-Pilot with pcp-pmda-hacluster", fr: "Performance Co-Pilot avec pcp-pmda-hacluster" } }
    - { id: b, text: { en: "The prometheus-ha_cluster_exporter package", fr: "Le paquet prometheus-ha_cluster_exporter" } }
    - { id: c, text: { en: "The Prometheus node exporter", fr: "Le Prometheus node exporter" } }
    - { id: d, text: { en: "The Azure Monitor Agent with a data collection rule", fr: "L'agent Azure Monitor avec une règle de collecte de données" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      On RHEL (8.2, 8.4 and later), the Pacemaker provider reads cluster metrics from Performance Co-Pilot with the pcp-pmda-hacluster subpackage, exposed at http://<IP-address>:44322/metrics?names=ha_cluster. You install it on every cluster node and create one provider per node.
    fr: |
      Sur RHEL (8.2, 8.4 et ultérieur), le fournisseur Pacemaker lit les métriques du cluster depuis Performance Co-Pilot avec le sous-paquet pcp-pmda-hacluster, exposé à l'adresse http://<IP-address>:44322/metrics?names=ha_cluster. Vous l'installez sur chaque nœud du cluster et créez un fournisseur par nœud.
  options:
    b: { en: "prometheus-ha_cluster_exporter is the agent for SUSE Linux Enterprise Server, on port 9664.", fr: "prometheus-ha_cluster_exporter est l'agent pour SUSE Linux Enterprise Server, sur le port 9664." }
    c: { en: "The node exporter feeds the OS (Linux) provider with OS metrics, not cluster status.", fr: "Le node exporter alimente le fournisseur Système d'exploitation (Linux) en métriques du système d'exploitation, pas en état du cluster." }
    d: { en: "Azure Monitor for SAP solutions doesn't collect data through the Azure Monitor Agent; its providers pull from exporters on the nodes.", fr: "Azure Monitor pour solutions SAP ne collecte pas de données via l'agent Azure Monitor ; ses fournisseurs interrogent des exportateurs sur les nœuds." }
references:
  - title: Create a high-availability cluster provider for Azure Monitor for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/provider-ha-pacemaker-cluster
