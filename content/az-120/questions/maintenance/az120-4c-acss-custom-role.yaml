id: az120-4c-acss-custom-role
objective: "4.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove manages an SAP system named **WP1** as a Virtual Instance for SAP solutions (VIS).

    A shift team must be able to start and stop the application server instances of WP1. The team must not be able to stop the whole system, the central services instance or the HANA database.

    You need to grant the team access to WP1. The solution must follow the principle of least privilege.

    What should you assign to the team?
  fr: |
    Woodgrove gère un système SAP nommé **WP1** en tant que Virtual Instance for SAP solutions (VIS).

    Une équipe de quart doit pouvoir démarrer et arrêter les instances de serveur d'applications de WP1. Elle ne doit pas pouvoir arrêter tout le système, l'instance des services centraux ni la base de données HANA.

    Vous devez accorder à l'équipe l'accès à WP1. La solution doit respecter le principe du moindre privilège.

    Que devez-vous attribuer à l'équipe ?
body:
  options:
    - { id: a, text: { en: "The Azure Center for SAP solutions administrator role", fr: "Le rôle Azure Center for SAP solutions administrator" } }
    - { id: b, text: { en: "A custom role with the read permissions and `sapVirtualInstances/applicationInstances/start/action` and `stop/action`", fr: "Un rôle personnalisé avec les autorisations de lecture et `sapVirtualInstances/applicationInstances/start/action` et `stop/action`" } }
    - { id: c, text: { en: "A custom role with the read permissions and `sapVirtualInstances/start/action` and `sapVirtualInstances/stop/action`", fr: "Un rôle personnalisé avec les autorisations de lecture et `sapVirtualInstances/start/action` et `sapVirtualInstances/stop/action`" } }
    - { id: d, text: { en: "The Azure Center for SAP solutions reader role", fr: "Le rôle Azure Center for SAP solutions reader" } }
answer: { optionId: b }
explanation:
  correct:
    en: Azure Center for SAP solutions has a separate permission for each start and stop operation. `Microsoft.Workloads/sapVirtualInstances/applicationInstances/start/action` and `.../stop/action` cover only application server instances, so a custom role with them and the read permissions meets the requirement.
    fr: Le Centre Azure pour les solutions SAP dispose d'une autorisation distincte pour chaque opération de démarrage et d'arrêt. `Microsoft.Workloads/sapVirtualInstances/applicationInstances/start/action` et `.../stop/action` ne couvrent que les instances de serveur d'applications ; un rôle personnalisé qui les contient avec les autorisations de lecture répond à l'exigence.
  options:
    a: { en: "The administrator role grants every action, including stopping the system, central services and the database.", fr: "Le rôle administrator accorde toutes les actions, y compris l'arrêt du système, des services centraux et de la base de données." }
    c: { en: "These actions start and stop the whole SAP system, which the team must not do.", fr: "Ces actions démarrent et arrêtent tout le système SAP, ce que l'équipe ne doit pas faire." }
    d: { en: "The reader role only views VIS resources and can't start or stop instances.", fr: "Le rôle reader ne fait que consulter les ressources VIS et ne peut ni démarrer ni arrêter d'instances." }
references:
  - title: Azure RBAC for Azure Center for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/manage-with-azure-rbac
