id: az120-cs1b-resize
objective: "4.1.4"
type: yesno_statements
caseStudy: az120-cs1b-lucerne-publishing
difficulty: 1
status: draft
stem:
  en: |
    You are planning the resizing of the LPP VMs. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez le redimensionnement des machines virtuelles de LPP. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When you resize a running application server VM, Azure restarts the VM.
        fr: |
          Quand vous redimensionnez une machine virtuelle de serveur d'applications en cours d'exécution, Azure redémarre la machine virtuelle.
    - id: s2
      text:
        en: |
          Because the application servers run Linux, you can resize them from a size without a local temporary disk to a size with a local temporary disk.
        fr: |
          Comme les serveurs d'applications s'exécutent sous Linux, vous pouvez les redimensionner d'une taille sans disque temporaire local vers une taille avec un disque temporaire local.
    - id: s3
      text:
        en: |
          If you resize the primary database VM from Standard_E32-8s_v5 to Standard_E32s_v5, the number of vCPUs available to Oracle Database stays at eight.
        fr: |
          Si vous redimensionnez la machine virtuelle de base de données primaire de Standard_E32-8s_v5 vers Standard_E32s_v5, le nombre de processeurs virtuels disponibles pour Oracle Database reste de huit.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Resizing a running VM is a disruptive operation that restarts it; if the new size isn't available on the current hardware cluster, you might also have to deallocate the VM first. Linux VMs can resize between sizes with and without a local temporary disk, a move that Windows VMs can't make. Standard_E32s_v5 is the unconstrained parent size and exposes all 32 vCPUs, so the vCPU count to license would grow to 32.
    fr: |
      Redimensionner une machine virtuelle en cours d'exécution est une opération perturbatrice qui la redémarre ; si la nouvelle taille n'est pas disponible sur le cluster matériel actuel, vous devrez peut-être aussi libérer la machine virtuelle au préalable. Les machines virtuelles Linux peuvent passer d'une taille avec disque temporaire local à une taille sans, et inversement, ce que les machines virtuelles Windows ne peuvent pas faire. Standard_E32s_v5 est la taille parente non limitée et expose les 32 processeurs virtuels : le nombre de processeurs virtuels à licencier passerait à 32.
references:
  - title: Change the size of a virtual machine
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/resize-vm
  - title: Constrained vCPU sizes for database workloads
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/constrained-vcpu
