id: az120-4a-rs-behavior-statements
objective: "4.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware plans to resize the VM that hosts the ASCS instance of a non-production SAP system to reduce costs. The VM is running, and its NIC uses a dynamic private IP address. You review the behavior of a resize before you schedule it.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit de redimensionner la machine virtuelle qui héberge l'instance ASCS d'un système SAP hors production pour réduire les coûts. La machine virtuelle est en cours d'exécution, et sa carte réseau utilise une adresse IP privée dynamique. Vous examinez le comportement d'un redimensionnement avant de le planifier.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Resizing the running VM restarts it, so the ASCS instance is unavailable during the operation.
        fr: |
          Le redimensionnement de la machine virtuelle en cours d'exécution la redémarre ; l'instance ASCS est donc indisponible pendant l'opération.
    - id: s2
      text:
        en: |
          If you must deallocate the VM before the resize, its private IP address might change.
        fr: |
          Si vous devez libérer la machine virtuelle avant le redimensionnement, son adresse IP privée peut changer.
    - id: s3
      text:
        en: |
          If the resize fails, the size shown in the Azure portal is the size on which the VM is still running.
        fr: |
          Si le redimensionnement échoue, la taille affichée dans le portail Azure est celle sur laquelle la machine virtuelle s'exécute toujours.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Changing the size of a running VM restarts it, which is disruptive for stateful workloads. Deallocation releases dynamic IP addresses, so a static private IP address is preferable for SAP VMs. After a failed resize, the VM model shows the requested size while the VM keeps running on its previous size, because the portal reflects the applied configuration, not the running size.
    fr: |
      Modifier la taille d'une machine virtuelle en cours d'exécution la redémarre, ce qui perturbe les charges de travail avec état. La libération libère les adresses IP dynamiques : une adresse IP privée statique est préférable pour les machines virtuelles SAP. Après un redimensionnement en échec, le modèle de la machine virtuelle affiche la taille demandée alors que la machine virtuelle continue de s'exécuter sur sa taille précédente, car le portail reflète la configuration appliquée et non la taille en cours d'exécution.
references:
  - title: Resize a virtual machine
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/resize-vm
