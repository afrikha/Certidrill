id: az120-4b-vm-aem-cli
objective: "4.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware runs SAP on a Red Hat Enterprise Linux 8.8 Azure VM named **vm-lq1-app** in the resource group **rg-sap-lq1**. The VM has a system-assigned managed identity, and the standard version of the Azure VM extension for SAP solutions isn't installed. The security team doesn't allow role assignments at the resource group scope: the VM identity may read only the VM's own disks and network interfaces.

    You need to install the new version of the extension by using the Azure CLI, and then check that it's configured correctly.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware exécute SAP sur une machine virtuelle Azure Red Hat Enterprise Linux 8.8 nommée **vm-lq1-app** dans le groupe de ressources **rg-sap-lq1**. La machine virtuelle dispose d'une identité managée affectée par le système, et la version standard de l'Azure VM extension for SAP solutions n'est pas installée. L'équipe de sécurité n'autorise pas les attributions de rôles à l'étendue du groupe de ressources : l'identité de la machine virtuelle ne peut lire que les disques et interfaces réseau de la machine virtuelle.

    Vous devez installer la nouvelle version de l'extension avec Azure CLI, puis vérifier qu'elle est correctement configurée.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az vm aem set --resource-group rg-sap-lq1 --name vm-lq1-app \
      [[ver]] [[scope]]

    az vm aem [[check]] --resource-group rg-sap-lq1 --name vm-lq1-app
  slots:
    - id: ver
      options:
        - { id: debug, text: "--debug-extension" }
        - { id: newext, text: "--install-new-extension" }
        - { id: skipsa, text: "--skip-storage-analytics" }
    - id: scope
      options:
        - { id: proxy, text: "--proxy-uri" }
        - { id: ids, text: "--ids" }
        - { id: indiv, text: "--set-access-to-individual-resources" }
    - id: check
      options:
        - { id: verify, text: verify }
        - { id: set, text: set }
        - { id: delete, text: delete }
answer:
  values: { ver: newext, scope: indiv, check: verify }
explanation:
  correct:
    en: |
      `az vm aem set --install-new-extension` installs the new version of the Azure VM extension for SAP solutions. `--set-access-to-individual-resources` gives the VM identity access to individual resources such as the data disks instead of the whole resource group, which meets the security requirement. `az vm aem verify` then checks that the extension is configured correctly. After installation, restart the SAP Host Agent.
    fr: |
      `az vm aem set --install-new-extension` installe la nouvelle version de l'Azure VM extension for SAP solutions. `--set-access-to-individual-resources` donne à l'identité de la machine virtuelle l'accès à des ressources individuelles, comme les disques de données, plutôt qu'à tout le groupe de ressources, ce qui satisfait l'exigence de sécurité. `az vm aem verify` vérifie ensuite que l'extension est correctement configurée. Après l'installation, redémarrez le SAP Host Agent.
  options:
    debug: { en: "--debug-extension enables debug mode on the extension; without --install-new-extension, the command configures the standard version.", fr: "--debug-extension active le mode débogage de l'extension ; sans --install-new-extension, la commande configure la version standard." }
    skipsa: { en: "--skip-storage-analytics skips enabling analytics on storage accounts; it doesn't select the new version.", fr: "--skip-storage-analytics évite d'activer l'analytique sur les comptes de stockage ; il ne sélectionne pas la nouvelle version." }
    proxy: { en: "--proxy-uri sets a proxy for external resources such as the Azure API; it doesn't change the scope of the identity's access.", fr: "--proxy-uri définit un proxy pour les ressources externes comme l'API Azure ; il ne change pas l'étendue de l'accès de l'identité." }
    ids: { en: "--ids identifies the VM by resource ID; the VM is already identified by name and resource group.", fr: "--ids identifie la machine virtuelle par son ID de ressource ; elle est déjà identifiée par son nom et son groupe de ressources." }
    set: { en: "Running set again reconfigures the extension; it doesn't report whether the configuration is correct.", fr: "Exécuter de nouveau set reconfigure l'extension ; cela n'indique pas si la configuration est correcte." }
    delete: { en: "delete removes the extension.", fr: "delete supprime l'extension." }
references:
  - title: az vm aem
    url: https://learn.microsoft.com/en-us/cli/azure/vm/aem
  - title: New version of Azure VM extension for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap-new
