id: az120-4b-sto-metric-statements
objective: "4.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip is building an Azure Monitor dashboard for the managed disks of its SAP VMs. Some data disks have ReadOnly host caching enabled.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip crée un tableau de bord Azure Monitor pour les disques managés de ses machines virtuelles SAP. Certains disques de données ont la mise en cache de l'hôte ReadOnly activée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The VM Uncached IOPS Consumed Percentage metric is available for every Azure VM series.
        fr: La métrique VM Uncached IOPS Consumed Percentage est disponible pour toutes les séries de machines virtuelles Azure.
    - id: s2
      text:
        en: When the Data Disk IOPS Consumed Percentage metric reaches 100%, the I/O is capped by the uncached IOPS limit of the VM.
        fr: Quand la métrique Data Disk IOPS Consumed Percentage atteint 100 %, les E/S sont plafonnées par la limite d'IOPS non mises en cache de la machine virtuelle.
    - id: s3
      text:
        en: I/O served by disks with host caching enabled counts towards the VM Cached IOPS Consumed Percentage metric.
        fr: Les E/S servies par les disques dont la mise en cache de l'hôte est activée comptent dans la métrique VM Cached IOPS Consumed Percentage.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      The storage I/O utilization metrics (disk and VM consumed percentages) are available only on VM series that support premium storage. Data Disk IOPS Consumed Percentage divides the IOPS completed by the provisioned IOPS of the data disk: at 100%, the disk's own limit caps the I/O, while the VM limit shows in VM Uncached IOPS Consumed Percentage. VM Cached IOPS Consumed Percentage divides the total cached IOPS, those of disks with ReadOnly or ReadWrite caching, by the VM's cached IOPS limit.
    fr: |
      Les métriques d'utilisation des E/S de stockage (pourcentages consommés des disques et de la machine virtuelle) ne sont disponibles que sur les séries de machines virtuelles qui prennent en charge le stockage Premium. Data Disk IOPS Consumed Percentage divise les IOPS effectuées par les IOPS provisionnées du disque de données : à 100 %, c'est la limite du disque lui-même qui plafonne les E/S, tandis que la limite de la machine virtuelle apparaît dans VM Uncached IOPS Consumed Percentage. VM Cached IOPS Consumed Percentage divise le total des IOPS mises en cache, celles des disques en cache ReadOnly ou ReadWrite, par la limite d'IOPS en cache de la machine virtuelle.
references:
  - title: Disk metrics - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-metrics
