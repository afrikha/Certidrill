id: az120-4b-ha-lb-probe-metric
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs the ASCS and ERS instances of an SAP system in a Pacemaker cluster on two Azure VMs, **vm-ascs1** and **vm-ascs2**. A Standard internal load balancer has one frontend IP configuration for ASCS and one for ERS, each with its own health probe and load-balancing rule with HA ports and floating IP.

    The operations team wants a chart in Azure Monitor that shows, over time, which of the two VMs answered the health probe of the ASCS frontend, so that they can correlate cluster failovers with incidents.

    Which load balancer metric should you chart, split by backend IP address?
  fr: |
    Adatum exécute les instances ASCS et ERS d'un système SAP dans un cluster Pacemaker sur deux machines virtuelles Azure, **vm-ascs1** et **vm-ascs2**. Un équilibreur de charge interne Standard dispose d'une configuration IP frontale pour l'ASCS et d'une pour l'ERS, chacune avec sa propre sonde d'intégrité et sa règle d'équilibrage de charge avec ports HA et adresse IP flottante.

    L'équipe d'exploitation veut un graphique dans Azure Monitor qui montre dans le temps laquelle des deux machines virtuelles a répondu à la sonde d'intégrité de l'adresse frontale ASCS, afin de mettre en corrélation les basculements du cluster et les incidents.

    Quelle métrique de l'équilibreur de charge devez-vous représenter, fractionnée par adresse IP principale ?
body:
  options:
    - { id: a, text: Data Path Availability }
    - { id: b, text: SYN Count }
    - { id: c, text: SNAT Connection Count }
    - { id: d, text: Health Probe Status }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Health Probe Status reports the health of each backend endpoint as seen by the load balancer probes, and you can filter or split it by frontend IP and backend IP. In an SAP cluster, only the node that runs the ASCS resource group answers the ASCS probe, so the split shows which VM owned the ASCS virtual IP at any time. Use the Average aggregation.
    fr: |
      Health Probe Status indique l'intégrité de chaque point de terminaison principal vue par les sondes de l'équilibreur de charge, et vous pouvez la filtrer ou la fractionner par adresse IP frontale et adresse IP principale. Dans un cluster SAP, seul le nœud qui exécute le groupe de ressources ASCS répond à la sonde ASCS : le fractionnement montre donc quelle machine virtuelle détenait l'adresse IP virtuelle ASCS à chaque instant. Utilisez l'agrégation Average.
  options:
    a: { en: "Data Path Availability measures the data path from within the region to the frontend; it's reported per frontend IP and port, not per backend VM.", fr: "Data Path Availability mesure le chemin de données depuis la région jusqu'à l'adresse frontale ; elle est fournie par adresse IP et port frontaux, pas par machine virtuelle principale." }
    b: { en: "SYN Count counts new connection attempts; it doesn't show which backend answers the health probe.", fr: "SYN Count compte les tentatives de nouvelles connexions ; il ne montre pas quel membre principal répond à la sonde d'intégrité." }
    c: { en: "SNAT Connection Count is available for public load balancers only and concerns outbound connections.", fr: "SNAT Connection Count n'est disponible que pour les équilibreurs de charge publics et concerne les connexions sortantes." }
references:
  - title: Load Balancer Diagnostics - Azure Load Balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-standard-diagnostics
