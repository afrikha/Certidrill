id: az120-cs4b-sql-backup
objective: "4.2.6"
type: yesno_statements
caseStudy: az120-cs4b-treyresearch
difficulty: 3
status: draft
stem:
  en: |
    You configure Azure Backup for the PRD database to meet the backup requirements. A Recovery Services vault named **RSV-PRD-WE** is created in West Europe.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez Sauvegarde Azure pour la base de données de PRD afin de respecter les exigences de sauvegarde. Un coffre Recovery Services nommé **RSV-PRD-WE** est créé dans West Europe.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Scheduled full backups of the PRD database will run on the secondary replica in West Europe.
        fr: Les sauvegardes complètes planifiées de la base de données de PRD s'exécuteront sur le réplica secondaire de West Europe.
    - id: s2
      text:
        en: A backup policy with log backups every 15 minutes meets the point-in-time restore requirement.
        fr: Une stratégie de sauvegarde avec des sauvegardes de journaux toutes les 15 minutes respecte l'exigence de restauration à un point dans le temps.
    - id: s3
      text:
        en: You can register all three PRD replica VMs, including the North Europe replica, to RSV-PRD-WE.
        fr: Vous pouvez inscrire les trois machines virtuelles réplicas de PRD, y compris le réplica de North Europe, auprès de RSV-PRD-WE.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: With SQL Server 2022 and earlier, Azure Backup takes full and differential backups only from the primary replica, whatever the backup preference; only copy-only full and log backups follow the Prefer Secondary preference. Log backups can be scheduled every 15 minutes, which gives a 15-minute RPO and point-in-time restore. A Recovery Services vault protects databases only on VMs in its own region and subscription, so the North Europe replica cannot be registered to RSV-PRD-WE.
    fr: Avec SQL Server 2022 et versions antérieures, Sauvegarde Azure effectue les sauvegardes complètes et différentielles uniquement depuis le réplica principal, quelle que soit la préférence de sauvegarde ; seules les sauvegardes complètes de copie seule et les sauvegardes de journaux suivent la préférence Prefer Secondary. Les sauvegardes de journaux peuvent être planifiées toutes les 15 minutes, ce qui donne un RPO de 15 minutes et une restauration à un point dans le temps. Un coffre Recovery Services ne protège que des bases de données situées sur des machines virtuelles de sa propre région et de son propre abonnement ; le réplica de North Europe ne peut donc pas être inscrit auprès de RSV-PRD-WE.
references:
  - title: Back up SQL Server always on availability groups - Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-sql-server-on-availability-groups
  - title: Back up SQL Server databases to Azure - Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-sql-database
