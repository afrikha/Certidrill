id: az120-4b-arch-dt-design
objective: "4.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs a native SAP HANA application on an M128s Azure VM. To offload warm data and reduce memory costs, Proseware plans to implement SAP HANA Dynamic Tiering 2.0 (DT 2.0). The deployment must meet the mandatory requirements for official support of DT 2.0 on Azure.

    How should you complete the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute une application SAP HANA native sur une machine virtuelle Azure M128s. Pour délester les données tièdes et réduire les coûts de mémoire, Proseware prévoit d'implémenter SAP HANA Dynamic Tiering 2.0 (DT 2.0). Le déploiement doit respecter les exigences obligatoires du support officiel de DT 2.0 sur Azure.

    Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Install DT 2.0 on: [[host]]

      Network placement: [[net]]

      DT 2.0 data volume: [[disk]]
    fr: |
      Installer DT 2.0 sur : [[host]]

      Placement réseau : [[net]]

      Volume de données DT 2.0 : [[disk]]
  slots:
    - id: host
      options:
        - { id: same, text: { en: "The existing M128s VM, next to the HANA instance", fr: "La machine virtuelle M128s existante, à côté de l'instance HANA" } }
        - { id: m64, text: { en: "A dedicated M64-32ms VM", fr: "Une machine virtuelle M64-32ms dédiée" } }
        - { id: anf, text: { en: "An Azure NetApp Files volume mounted on the M128s VM", fr: "Un volume Azure NetApp Files monté sur la machine virtuelle M128s" } }
    - id: net
      options:
        - { id: peer, text: { en: "A peered virtual network in the same region", fr: "Un réseau virtuel relié par peering dans la même région" } }
        - { id: ppg, text: { en: "The same proximity placement group, without accelerated networking", fr: "Le même groupe de placement de proximité, sans mise en réseau accélérée" } }
        - { id: vnet, text: { en: "The same virtual network, with accelerated networking on both VMs", fr: "Le même réseau virtuel, avec la mise en réseau accélérée sur les deux machines virtuelles" } }
    - id: disk
      options:
        - { id: single, text: { en: "One Premium SSD disk sized for the capacity", fr: "Un seul disque SSD Premium dimensionné pour la capacité" } }
        - { id: stripe, text: { en: "Several Premium SSD disks in a striped volume (LVM or mdadm)", fr: "Plusieurs disques SSD Premium dans un volume agrégé par bandes (LVM ou mdadm)" } }
        - { id: stdssd, text: { en: "Several Standard SSD disks in a striped volume (LVM or mdadm)", fr: "Plusieurs disques SSD Standard dans un volume agrégé par bandes (LVM ou mdadm)" } }
answer:
  values: { host: m64, net: vnet, disk: stripe }
explanation:
  correct:
    en: |
      On Azure, DT 2.0 must run on a dedicated VM (M64-32ms or E32sv3; M64-32ms is the recommended pairing for an M128s). The HANA and DT 2.0 VMs must be in the same virtual network with accelerated networking, because at least 10 Gb of throughput is needed between them. DT 2.0 requires Premium storage with multiple disks striped by a software RAID, because one disk can't reach the VM throughput limit.
    fr: |
      Sur Azure, DT 2.0 doit s'exécuter sur une machine virtuelle dédiée (M64-32ms ou E32sv3 ; M64-32ms est l'association recommandée pour une M128s). Les machines virtuelles HANA et DT 2.0 doivent se trouver dans le même réseau virtuel avec la mise en réseau accélérée, car il faut au moins 10 Gb de débit entre elles. DT 2.0 exige un stockage Premium avec plusieurs disques agrégés par un RAID logiciel, car un seul disque ne peut pas atteindre la limite de débit de la machine virtuelle.
  options:
    same: { en: "DT 2.0 isn't allowed on the VM that runs the HANA instance.", fr: "DT 2.0 n'est pas autorisé sur la machine virtuelle qui exécute l'instance HANA." }
    anf: { en: "DT 2.0 is a separate server component that needs its own VM; a volume on the HANA VM doesn't meet that requirement.", fr: "DT 2.0 est un composant serveur distinct qui a besoin de sa propre machine virtuelle ; un volume sur la machine virtuelle HANA ne répond pas à cette exigence." }
    peer: { en: "Both VMs must be in the same virtual network.", fr: "Les deux machines virtuelles doivent se trouver dans le même réseau virtuel." }
    ppg: { en: "Accelerated networking is mandatory on the HANA and DT 2.0 VMs.", fr: "La mise en réseau accélérée est obligatoire sur les machines virtuelles HANA et DT 2.0." }
    single: { en: "A single disk can't provide the throughput needed to reach the VM limit; striping is required.", fr: "Un seul disque ne peut pas fournir le débit nécessaire pour atteindre la limite de la machine virtuelle ; l'agrégation par bandes est requise." }
    stdssd: { en: "Azure Premium storage is mandatory for the DT 2.0 VM.", fr: "Le stockage Premium Azure est obligatoire pour la machine virtuelle DT 2.0." }
references:
  - title: SAP HANA infrastructure configurations and operations on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations
