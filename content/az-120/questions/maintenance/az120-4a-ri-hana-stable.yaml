id: az120-4a-ri-hana-stable
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs a production SAP S/4HANA system in the West Europe region. The SAP HANA database VMs and the ASCS/ERS VMs run 24 hours a day on fixed sizes. Contoso doesn't plan to change their sizes, VM families or region for at least three years.

    You need to recommend a pricing option for these VMs that maximizes the compute savings.

    What should you recommend?
  fr: |
    Contoso exécute un système SAP S/4HANA de production dans la région Europe Ouest. Les machines virtuelles de base de données SAP HANA et les machines virtuelles ASCS/ERS fonctionnent 24 heures sur 24 avec des tailles fixes. Contoso ne prévoit pas de modifier leurs tailles, leurs familles de machines virtuelles ou leur région pendant au moins trois ans.

    Vous devez recommander une option de tarification pour ces machines virtuelles qui maximise les économies sur le calcul.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A three-year Azure savings plan for compute", fr: "Un plan d'économies Azure pour le calcul de trois ans" }
    - id: b
      text: { en: "On-demand capacity reservations for the VM sizes", fr: "Des réservations de capacité à la demande pour les tailles de machines virtuelles" }
    - id: c
      text: { en: "Three-year Azure Reserved VM Instances", fr: "Des instances de machine virtuelle réservées Azure de trois ans" }
    - id: d
      text: { en: "One-year Azure Reserved VM Instances", fr: "Des instances de machine virtuelle réservées Azure d'un an" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Reservations commit to a VM size or instance family in one region and give the greatest savings when fully used, which fits workloads that run continuously with no expected change of instance type, family or region. A three-year term matches the planned stability.
    fr: |
      Les réservations engagent sur une taille ou une famille d'instances de machines virtuelles dans une région et offrent les économies les plus importantes quand elles sont pleinement utilisées, ce qui convient aux charges de travail qui fonctionnent en continu sans changement prévu de type d'instance, de famille ou de région. Une durée de trois ans correspond à la stabilité prévue.
  options:
    a: { en: "A savings plan trades part of the discount for flexibility across families and regions, which these VMs don't need.", fr: "Un plan d'économies échange une partie de la remise contre une flexibilité entre familles et régions dont ces machines virtuelles n'ont pas besoin." }
    b: { en: "Capacity reservations guarantee capacity at pay-as-you-go rates; they don't provide a discount by themselves.", fr: "Les réservations de capacité garantissent de la capacité au tarif du paiement à l'utilisation ; elles n'offrent pas de remise à elles seules." }
    d: { en: "A one-year term gives a smaller discount than a three-year term for a workload that is stable for three years.", fr: "Une durée d'un an offre une remise inférieure à celle d'une durée de trois ans pour une charge de travail stable pendant trois ans." }
references:
  - title: Decide between a savings plan and a reservation
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
