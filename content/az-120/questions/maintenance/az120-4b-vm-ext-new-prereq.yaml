id: az120-4b-vm-ext-new-prereq
objective: "4.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso deploys SAP S/4HANA on SUSE Linux Enterprise Server 15 SP6 VMs by using Terraform. The VMs use Premium SSD v2 and Standard SSD managed disks. The team will deploy the new version of the Azure VM extension for SAP solutions from the Terraform configuration.

    You need to make sure that the extension can collect the data it needs about each VM and its disks and network interfaces. The solution must follow the principle of least privilege.

    What should you include in the Terraform configuration?
  fr: |
    Contoso déploie SAP S/4HANA sur des machines virtuelles SUSE Linux Enterprise Server 15 SP6 avec Terraform. Les machines virtuelles utilisent des disques managés SSD Premium v2 et SSD Standard. L'équipe déploiera la nouvelle version de l'Azure VM extension for SAP solutions depuis la configuration Terraform.

    Vous devez vous assurer que l'extension peut collecter les données dont elle a besoin sur chaque machine virtuelle, ses disques et ses interfaces réseau. La solution doit respecter le principe du moindre privilège.

    Que devez-vous inclure dans la configuration Terraform ?
body:
  options:
    - { id: a, text: { en: "A managed identity on each VM with the Reader role on the VM's resource group", fr: "Une identité managée sur chaque machine virtuelle avec le rôle Reader sur le groupe de ressources de la machine virtuelle" } }
    - { id: b, text: { en: "A managed identity on each VM with the Contributor role on the VM's resource group", fr: "Une identité managée sur chaque machine virtuelle avec le rôle Contributor sur le groupe de ressources de la machine virtuelle" } }
    - { id: c, text: { en: "A storage account with Storage Analytics enabled, referenced by the extension settings", fr: "Un compte de stockage avec Storage Analytics activé, référencé dans les paramètres de l'extension" } }
    - { id: d, text: { en: "A Log Analytics workspace and a data collection rule associated with each VM", fr: "Un espace de travail Log Analytics et une règle de collecte de données associée à chaque machine virtuelle" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The new version of the extension reads VM and resource data through a system-assigned or user-assigned managed identity. Microsoft's prerequisite is the built-in Reader role for that identity on the resource group, or on the individual network interfaces and disks. The VM also needs outbound access to management.azure.com.
    fr: |
      La nouvelle version de l'extension lit les données de la machine virtuelle et des ressources grâce à une identité managée affectée par le système ou par l'utilisateur. Le prérequis de Microsoft est le rôle intégré Reader pour cette identité sur le groupe de ressources, ou sur les interfaces réseau et les disques individuels. La machine virtuelle a aussi besoin d'un accès sortant à management.azure.com.
  options:
    b: { en: "The extension only reads data; Contributor grants write access the extension doesn't need.", fr: "L'extension ne fait que lire des données ; Contributor accorde un accès en écriture dont elle n'a pas besoin." }
    c: { en: "The new version reads data through Azure Resource Manager with the identity; it doesn't depend on Storage Analytics.", fr: "La nouvelle version lit les données via Azure Resource Manager avec l'identité ; elle ne dépend pas de Storage Analytics." }
    d: { en: "A workspace and a DCR configure the Azure Monitor Agent, not the Azure VM extension for SAP solutions.", fr: "Un espace de travail et une DCR configurent l'agent Azure Monitor, pas l'Azure VM extension for SAP solutions." }
references:
  - title: New version of Azure VM extension for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap-new
  - title: Implement the Azure VM extension for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap
