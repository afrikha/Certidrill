id: az120-cs4a-latency-monitor
objective: "4.2.4"
type: single
caseStudy: az120-cs4a-wideworld
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the alerting requirement of the network team.

    What should you configure?
  fr: |
    Vous devez satisfaire l'exigence d'alerte de l'équipe réseau.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text:
        en: "Azure Monitor for SAP solutions with a NetWeaver provider for SAP S/4HANA and an alert rule on the provider metrics"
        fr: "Azure Monitor pour solutions SAP avec un fournisseur NetWeaver pour SAP S/4HANA et une règle d'alerte sur les métriques du fournisseur"
    - id: b
      text:
        en: "Virtual network flow logs for VNET-INT-WE with traffic analytics and an alert rule on the traffic analytics results"
        fr: "Des journaux de flux de réseau virtuel pour VNET-INT-WE avec l'analytique du trafic et une règle d'alerte sur ses résultats"
    - id: c
      text:
        en: "A connection monitor with VM-WMS1 and VM-WMS2 as sources, a TCP test to the SAP application servers and a metric alert rule"
        fr: "Un moniteur de connexion avec VM-WMS1 et VM-WMS2 comme sources, un test TCP vers les serveurs d'applications SAP et une règle d'alerte de métrique"
    - id: d
      text:
        en: "An IP flow verify check from VM-WMS1 and VM-WMS2 to the SAP application servers and an alert rule on the check result"
        fr: "Une vérification du flux IP de VM-WMS1 et VM-WMS2 vers les serveurs d'applications SAP et une règle d'alerte sur le résultat"
answer: { optionId: c }
explanation:
  correct:
    en: Connection Monitor in Network Watcher measures round-trip time and the percentage of failed checks between sources and destinations continuously. Azure VMs become sources through the Network Watcher Agent extension, and the destinations (here the private IP addresses of the SAP application servers) need no agent. Metric alert rules on RoundTripTimeMs and ChecksFailedPercent notify the network team.
    fr: Le moniteur de connexion de Network Watcher mesure en continu le temps d'aller-retour et le pourcentage de vérifications en échec entre des sources et des destinations. Les machines virtuelles Azure deviennent des sources grâce à l'extension Network Watcher Agent, et les destinations (ici les adresses IP privées des serveurs d'applications SAP) n'ont besoin d'aucun agent. Des règles d'alerte de métrique sur RoundTripTimeMs et ChecksFailedPercent préviennent l'équipe réseau.
  options:
    a:
      en: SAP RISE does not support any integration with Azure Monitor for SAP solutions; SAP provides its own monitoring for the managed systems.
      fr: SAP RISE ne prend en charge aucune intégration avec Azure Monitor pour solutions SAP ; SAP fournit sa propre supervision pour les systèmes gérés.
    b:
      en: Flow logs and traffic analytics describe the IP flows and volumes that cross the network; they do not measure round-trip time between two endpoints.
      fr: Les journaux de flux et l'analytique du trafic décrivent les flux IP et les volumes qui traversent le réseau ; ils ne mesurent pas le temps d'aller-retour entre deux points de terminaison.
    d:
      en: IP flow verify is a one-time check of whether NSG rules allow a packet; it measures neither latency nor connectivity over time.
      fr: La vérification du flux IP est un contrôle ponctuel qui indique si les règles NSG autorisent un paquet ; elle ne mesure ni la latence ni la connectivité dans la durée.
references:
  - title: Connection Monitor Overview - Azure Network Watcher
    url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview
  - title: Identity and security in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-security
