id: az120-4b-net-next-hop
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs SAP S/4HANA in a single virtual network. The application servers are in the subnet **snet-app** (10.10.1.0/24) and the HANA database VM is in **snet-db** (10.10.2.0/24). After the network team associated new route tables with several subnets, the SAP response times doubled, and the team suspects that traffic from the application servers to the database now goes through a firewall appliance.

    You need to confirm how traffic from the application server VM **vm-app01** to the HANA VM at 10.10.2.4 is routed.

    Which Network Watcher tool should you use?
  fr: |
    Contoso exécute SAP S/4HANA dans un seul réseau virtuel. Les serveurs d'applications se trouvent dans le sous-réseau **snet-app** (10.10.1.0/24) et la machine virtuelle de base de données HANA dans **snet-db** (10.10.2.0/24). Après que l'équipe réseau a associé de nouvelles tables de routage à plusieurs sous-réseaux, les temps de réponse SAP ont doublé, et l'équipe soupçonne que le trafic des serveurs d'applications vers la base de données passe désormais par une appliance de pare-feu.

    Vous devez confirmer comment le trafic de la machine virtuelle de serveur d'applications **vm-app01** vers la machine virtuelle HANA à l'adresse 10.10.2.4 est routé.

    Quel outil Network Watcher devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "IP flow verify", fr: "Vérification des flux IP" } }
    - { id: b, text: { en: "Effective security rules", fr: "Règles de sécurité effectives" } }
    - { id: c, text: { en: "Next hop", fr: "Tronçon suivant" } }
    - { id: d, text: { en: "VPN troubleshoot", fr: "Résolution des problèmes VPN" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Next hop detects routing issues: for a source VM and a destination IP address, it returns the next hop type (for example VirtualAppliance), its IP address and the ID of the route table that produced the route. Microsoft recommends no network virtual appliance in the path between SAP application servers and the DBMS, because it can double latency.
    fr: |
      Le tronçon suivant détecte les problèmes de routage : pour une machine virtuelle source et une adresse IP de destination, il renvoie le type de tronçon suivant (par exemple VirtualAppliance), son adresse IP et l'ID de la table de routage à l'origine de l'itinéraire. Microsoft recommande de ne placer aucune appliance virtuelle réseau entre les serveurs d'applications SAP et le SGBD, car elle peut doubler la latence.
  options:
    a: { en: "IP flow verify tells whether security rules allow or deny a packet; it doesn't show the route the packet takes.", fr: "La vérification des flux IP indique si les règles de sécurité autorisent ou refusent un paquet ; elle ne montre pas l'itinéraire emprunté." }
    b: { en: "Effective security rules lists the NSG rules applied to a NIC; routes aren't security rules.", fr: "Les règles de sécurité effectives listent les règles NSG appliquées à une carte réseau ; les itinéraires ne sont pas des règles de sécurité." }
    d: { en: "VPN troubleshoot diagnoses virtual network gateways and their connections, not routing between two subnets.", fr: "La résolution des problèmes VPN diagnostique les passerelles de réseau virtuel et leurs connexions, pas le routage entre deux sous-réseaux." }
references:
  - title: Azure Network Watcher Overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
