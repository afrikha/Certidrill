id: az120-4b-net-flowlog-order
objective: "4.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin's SAP virtual network **VNET-SAP** (West Europe) has two subnets whose NSGs, **NSG-APP** and **NSG-DB**, still have NSG flow logs enabled. A Standard general-purpose v2 storage account in West Europe and a Log Analytics workspace already exist in the same subscription.

    You need to replace the NSG flow logs with virtual network flow logs that are analyzed by traffic analytics. Microsoft recommends avoiding duplicate recording of the same traffic. Then the network team needs to review the SAP traffic flows.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Le réseau virtuel SAP de Tailspin, **VNET-SAP** (West Europe), comporte deux sous-réseaux dont les NSG, **NSG-APP** et **NSG-DB**, ont encore des journaux de flux NSG activés. Un compte de stockage Standard usage général v2 en West Europe et un espace de travail Log Analytics existent déjà dans le même abonnement.

    Vous devez remplacer les journaux de flux NSG par des journaux de flux de réseau virtuel analysés par traffic analytics. Microsoft recommande d'éviter d'enregistrer deux fois le même trafic. Ensuite, l'équipe réseau doit examiner les flux du trafic SAP.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: disable, text: { en: "Disable the NSG flow logs of NSG-APP and NSG-DB.", fr: "Désactiver les journaux de flux NSG de NSG-APP et NSG-DB." } }
    - { id: create, text: { en: "Create a virtual network flow log for VNET-SAP that uses the storage account, with traffic analytics sending data to the workspace.", fr: "Créer un journal de flux de réseau virtuel pour VNET-SAP qui utilise le compte de stockage, avec traffic analytics envoyant les données à l'espace de travail." } }
    - { id: review, text: { en: "Review the SAP flows in the traffic analytics dashboard.", fr: "Examiner les flux SAP dans le tableau de bord traffic analytics." } }
    - { id: premium, text: { en: "Create a Premium block blob storage account for the flow logs.", fr: "Créer un compte de stockage d'objets blob de blocs Premium pour les journaux de flux." } }
    - { id: agent, text: { en: "Install the Network Watcher Agent extension on every SAP VM.", fr: "Installer l'extension Network Watcher Agent sur chaque machine virtuelle SAP." } }
    - { id: newnsg, text: { en: "Create an NSG flow log for the NSG of the gateway subnet.", fr: "Créer un journal de flux NSG pour le NSG du sous-réseau de passerelle." } }
answer:
  sequence: [ disable, create, review ]
explanation:
  correct:
    en: |
      Microsoft recommends disabling NSG flow logs before enabling virtual network flow logs on the same workloads, to avoid duplicate recording and extra cost. The virtual network flow log is enabled on VNET-SAP with a Standard storage account in the same region and subscription, and traffic analytics processes the logs into the workspace. Only then can the team review the flows in traffic analytics.
    fr: |
      Microsoft recommande de désactiver les journaux de flux NSG avant d'activer les journaux de flux de réseau virtuel sur les mêmes charges de travail, pour éviter un double enregistrement et des coûts supplémentaires. Le journal de flux de réseau virtuel est activé sur VNET-SAP avec un compte de stockage Standard de la même région et du même abonnement, et traffic analytics traite les journaux dans l'espace de travail. Ce n'est qu'ensuite que l'équipe peut examiner les flux dans traffic analytics.
  options:
    premium: { en: "Flow logs require a Standard storage account; Premium accounts aren't supported, and a suitable account already exists.", fr: "Les journaux de flux exigent un compte de stockage Standard ; les comptes Premium ne sont pas pris en charge, et un compte adapté existe déjà." }
    agent: { en: "Flow logs are recorded by the platform; the Network Watcher Agent extension serves tools such as connection monitor and packet capture.", fr: "Les journaux de flux sont enregistrés par la plateforme ; l'extension Network Watcher Agent sert à des outils comme le moniteur de connexion et la capture de paquets." }
    newnsg: { en: "NSG flow logs no longer support new creations; the virtual network flow log already covers the VNet.", fr: "Les journaux de flux NSG n'acceptent plus de nouvelles créations ; le journal de flux de réseau virtuel couvre déjà le réseau virtuel." }
references:
  - title: Virtual Network Flow Logs - Azure Network Watcher
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
  - title: NSG Flow Logs Overview - Azure Network Watcher
    url: https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-overview
