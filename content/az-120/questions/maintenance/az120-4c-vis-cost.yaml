id: az120-4c-vis-cost
objective: "4.2.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum registered an existing SAP system named **AE1** in Azure Center for SAP solutions on March 1. The virtual machines, disks and load balancers of AE1 are in a resource group named **rg-ae1**. The HANA data and log volumes of AE1 are Azure NetApp Files volumes, and AE1 uses a virtual network shared with other systems.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum a inscrit un système SAP existant nommé **AE1** dans le Centre Azure pour les solutions SAP le 1er mars. Les machines virtuelles, disques et équilibreurs de charge d'AE1 se trouvent dans un groupe de ressources nommé **rg-ae1**. Les volumes de données et de journaux HANA d'AE1 sont des volumes Azure NetApp Files, et AE1 utilise un réseau virtuel partagé avec d'autres systèmes.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The cost analysis of the VIS of AE1 shows the costs of the AE1 virtual machines for February.
        fr: L'analyse des coûts de la VIS d'AE1 affiche les coûts des machines virtuelles d'AE1 pour février.
    - id: s2
      text:
        en: The cost analysis of the VIS of AE1 includes the cost of the Azure NetApp Files volumes of AE1.
        fr: L'analyse des coûts de la VIS d'AE1 inclut le coût des volumes Azure NetApp Files d'AE1.
    - id: s3
      text:
        en: If an application server VM is later added to AE1, the cost analysis of the VIS includes the cost of that VM.
        fr: Si une machine virtuelle de serveur d'applications est ajoutée plus tard à AE1, l'analyse des coûts de la VIS inclut le coût de cette machine virtuelle.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: Cost analysis sums the Azure resources tagged with costanalysis-parent, a tag added to the VMs, disks and load balancers of the system at deployment or registration. For a registered system, data starts at the registration time, because the tag doesn't apply to historical data. Shared resources such as virtual networks, storage accounts and Azure NetApp Files are excluded. When application server VMs are added or removed, the tags are updated.
    fr: L'analyse des coûts additionne les ressources Azure portant l'étiquette costanalysis-parent, ajoutée aux machines virtuelles, disques et équilibreurs de charge du système lors du déploiement ou de l'inscription. Pour un système inscrit, les données commencent à la date d'inscription, car l'étiquette ne s'applique pas aux données historiques. Les ressources partagées comme les réseaux virtuels, les comptes de stockage et Azure NetApp Files sont exclues. Quand des machines virtuelles de serveur d'applications sont ajoutées ou retirées, les étiquettes sont mises à jour.
references:
  - title: Cost analysis for SAP systems in Azure Center for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/view-cost-analysis
