id: az120-4b-opt-vis-cost-analysis
objective: "4.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum has three SAP systems (**AP1**, **AQ1** and **AD1**) whose VMs, disks and load balancers share one resource group. All three systems are registered in Azure Center for SAP solutions.

    The SAP Basis lead needs to review the running cost of the AP1 virtual machines, disks and load balancers to decide which of them to optimize. The solution must minimize administrative effort.

    What should the SAP Basis lead use?
  fr: |
    Adatum dispose de trois systèmes SAP (**AP1**, **AQ1** et **AD1**) dont les machines virtuelles, les disques et les équilibreurs de charge partagent un même groupe de ressources. Les trois systèmes sont inscrits dans le Centre Azure pour les solutions SAP.

    Le responsable SAP Basis doit examiner le coût de fonctionnement des machines virtuelles, des disques et des équilibreurs de charge d'AP1 pour décider lesquels optimiser. La solution doit réduire au minimum l'effort d'administration.

    Qu'est-ce que le responsable SAP Basis doit utiliser ?
body:
  options:
    - { id: a, text: { en: "The Quality Insights workbook of the AP1 Virtual Instance for SAP solutions", fr: "Le classeur Quality Insights de la Virtual Instance for SAP solutions d'AP1" } }
    - { id: b, text: { en: "The cost analysis view of the AP1 Virtual Instance for SAP solutions", fr: "La vue d'analyse des coûts de la Virtual Instance for SAP solutions d'AP1" } }
    - { id: c, text: { en: "The Cost recommendations of Azure Advisor for the resource group", fr: "Les recommandations de coût d'Azure Advisor pour le groupe de ressources" } }
    - { id: d, text: { en: "The workbooks of an Azure Monitor for SAP solutions resource for AP1", fr: "Les classeurs d'une ressource Azure Monitor pour solutions SAP pour AP1" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      From a VIS, cost analysis shows the running cost of the virtual machines, disks and load balancers of that SAP system only. It totals the resources that carry the costanalysis-parent tag that Azure Center for SAP solutions adds at deployment or registration, so systems that share a resource group don't need separate manual analysis. The user needs Cost Management Reader or equivalent on the subscription.
    fr: |
      Depuis une VIS, l'analyse des coûts affiche le coût de fonctionnement des machines virtuelles, des disques et des équilibreurs de charge de ce seul système SAP. Elle totalise les ressources qui portent l'étiquette costanalysis-parent ajoutée par le Centre Azure pour les solutions SAP au déploiement ou à l'inscription : les systèmes qui partagent un groupe de ressources n'exigent pas d'analyse manuelle séparée. L'utilisateur a besoin de Cost Management Reader ou d'un rôle équivalent sur l'abonnement.
  options:
    a: { en: "Quality Insights shows Advisor recommendations and configuration checks against SAP best practices, not the running cost per system.", fr: "Quality Insights affiche les recommandations Advisor et les contrôles de configuration par rapport aux bonnes pratiques SAP, pas le coût de fonctionnement par système." }
    c: { en: "Advisor gives cost recommendations per resource; it doesn't total the cost of one SAP system among the three that share the resource group.", fr: "Advisor donne des recommandations de coût par ressource ; il ne totalise pas le coût d'un système SAP parmi les trois qui partagent le groupe de ressources." }
    d: { en: "Azure Monitor for SAP solutions collects SAP, database and OS telemetry; it doesn't report Azure costs.", fr: "Azure Monitor pour solutions SAP collecte la télémétrie SAP, base de données et système d'exploitation ; il ne présente pas les coûts Azure." }
references:
  - title: View cost analysis for SAP systems in Azure Center for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/view-cost-analysis
