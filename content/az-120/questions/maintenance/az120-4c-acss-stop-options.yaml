id: az120-4c-acss-stop-options
objective: "4.2.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso manages an SAP system named **QAS** as a Virtual Instance for SAP solutions (VIS) in Azure Center for SAP solutions. You are writing a script that uses the `az workloads sap-virtual-instance start` and `az workloads sap-virtual-instance stop` commands.

    Which parameter meets each requirement? To answer, drag the appropriate parameters to the correct requirements. Each parameter may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso gère un système SAP nommé **QAS** en tant que Virtual Instance for SAP solutions (VIS) dans le Centre Azure pour les solutions SAP. Vous écrivez un script qui utilise les commandes `az workloads sap-virtual-instance start` et `az workloads sap-virtual-instance stop`.

    Quel paramètre répond à chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dealloc, text: "`--deallocate-vm`" }
    - { id: startvm, text: "`--start-vm`" }
    - { id: soft, text: "`--soft-stop-timeout-seconds`" }
    - { id: nowait, text: "`--no-wait`" }
    - { id: chref, text: "`--change-reference`" }
  targets:
    - id: t1
      text: { en: "Stop the SAP system and deallocate its virtual machines", fr: "Arrêter le système SAP et libérer ses machines virtuelles" }
    - id: t2
      text: { en: "Start the virtual machines before the SAP instances are started", fr: "Démarrer les machines virtuelles avant le démarrage des instances SAP" }
    - id: t3
      text: { en: "Wait until RFC and HTTP clients stop routing calls to the instances before they stop", fr: "Attendre que les clients RFC et HTTP cessent d'acheminer des appels vers les instances avant leur arrêt" }
    - id: t4
      text: { en: "Return control to the script without waiting for the operation to finish", fr: "Rendre la main au script sans attendre la fin de l'opération" }
answer:
  mapping: { t1: dealloc, t2: startvm, t3: soft, t4: nowait }
explanation:
  correct:
    en: "`--deallocate-vm` stops and deallocates the VMs along with the SAP instances, and `--start-vm` starts the VMs before the SAP instances; both default to false, so the VIS operations leave the VMs alone unless you set them. `--soft-stop-timeout-seconds` sets how long the soft shutdown waits for RFC and HTTP clients (0, the default, means a hard stop). `--no-wait` doesn't wait for the long-running operation."
    fr: "`--deallocate-vm` arrête et libère les machines virtuelles en même temps que les instances SAP, et `--start-vm` démarre les machines virtuelles avant les instances SAP ; les deux valent false par défaut : les opérations de la VIS ne touchent pas aux machines virtuelles sans eux. `--soft-stop-timeout-seconds` définit le temps d'attente de l'arrêt progressif pour les clients RFC et HTTP (0, la valeur par défaut, signifie un arrêt immédiat). `--no-wait` n'attend pas la fin de l'opération de longue durée."
  options:
    chref: { en: "--change-reference records a related change reference ID; it doesn't change the behavior of the operation.", fr: "--change-reference enregistre un ID de référence de changement ; il ne modifie pas le comportement de l'opération." }
references:
  - title: az workloads sap-virtual-instance
    url: https://learn.microsoft.com/en-us/cli/azure/workloads/sap-virtual-instance
