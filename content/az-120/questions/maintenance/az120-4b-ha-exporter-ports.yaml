id: az120-4b-ha-exporter-ports
objective: "4.2.2"
type: dropdown
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Northwind monitors two Pacemaker clusters with Azure Monitor for SAP solutions:

    - **Cluster 1** hosts SAP HANA on SUSE Linux Enterprise Server for SAP 15 SP5 and uses prometheus-ha_cluster_exporter.
    - **Cluster 2** hosts the ASCS and ERS instances on Red Hat Enterprise Linux 8.8 and uses Performance Co-Pilot with pcp-pmda-hacluster.

    You need to enter the port of the HA Cluster Exporter Endpoint for the providers of each cluster.

    Which port should you use for each cluster? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind supervise deux clusters Pacemaker avec Azure Monitor pour solutions SAP :

    - Le **Cluster 1** héberge SAP HANA sur SUSE Linux Enterprise Server for SAP 15 SP5 et utilise prometheus-ha_cluster_exporter.
    - Le **Cluster 2** héberge les instances ASCS et ERS sur Red Hat Enterprise Linux 8.8 et utilise Performance Co-Pilot avec pcp-pmda-hacluster.

    Vous devez saisir le port du champ HA Cluster Exporter Endpoint des fournisseurs de chaque cluster.

    Quel port devez-vous utiliser pour chaque cluster ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Cluster 1 (SUSE): [[sles]]

      Cluster 2 (Red Hat): [[rhel]]
    fr: |
      Cluster 1 (SUSE) : [[sles]]

      Cluster 2 (Red Hat) : [[rhel]]
  slots:
    - id: sles
      options:
        - { id: s9100, text: "9100" }
        - { id: s9664, text: "9664" }
        - { id: s44322, text: "44322" }
        - { id: s50013, text: "50013" }
    - id: rhel
      options:
        - { id: r9100, text: "9100" }
        - { id: r9664, text: "9664" }
        - { id: r44322, text: "44322" }
        - { id: r50013, text: "50013" }
answer:
  values: { sles: s9664, rhel: r44322 }
explanation:
  correct:
    en: |
      On SUSE, prometheus-ha_cluster_exporter exposes the cluster metrics at http://<ip-address>:9664/metrics. On Red Hat, Performance Co-Pilot exposes them at http://<IP-address>:44322/metrics?names=ha_cluster. You create one provider per node with that node's endpoint.
    fr: |
      Sur SUSE, prometheus-ha_cluster_exporter expose les métriques du cluster à l'adresse http://<ip-address>:9664/metrics. Sur Red Hat, Performance Co-Pilot les expose à l'adresse http://<IP-address>:44322/metrics?names=ha_cluster. Vous créez un fournisseur par nœud avec le point de terminaison de ce nœud.
  options:
    s9100: { en: "Port 9100 is the Prometheus node exporter used by the OS (Linux) provider.", fr: "Le port 9100 est celui du Prometheus node exporter utilisé par le fournisseur Système d'exploitation (Linux)." }
    r9100: { en: "Port 9100 is the Prometheus node exporter used by the OS (Linux) provider.", fr: "Le port 9100 est celui du Prometheus node exporter utilisé par le fournisseur Système d'exploitation (Linux)." }
    s44322: { en: "44322 is the Performance Co-Pilot endpoint used on Red Hat.", fr: "44322 est le point de terminaison Performance Co-Pilot utilisé sur Red Hat." }
    r9664: { en: "9664 is the port of prometheus-ha_cluster_exporter on SUSE.", fr: "9664 est le port de prometheus-ha_cluster_exporter sur SUSE." }
    s50013: { en: "5<instance>13 is the HTTP port of SAP start service (sapstartsrv), used by the NetWeaver provider.", fr: "5<instance>13 est le port HTTP du service de démarrage SAP (sapstartsrv), utilisé par le fournisseur NetWeaver." }
    r50013: { en: "5<instance>13 is the HTTP port of SAP start service (sapstartsrv), used by the NetWeaver provider.", fr: "5<instance>13 est le port HTTP du service de démarrage SAP (sapstartsrv), utilisé par le fournisseur NetWeaver." }
references:
  - title: Create a high-availability cluster provider for Azure Monitor for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/provider-ha-pacemaker-cluster
