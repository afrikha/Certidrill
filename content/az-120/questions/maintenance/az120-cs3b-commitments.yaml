id: az120-cs3b-commitments
objective: "4.1.3"
type: dropdown
caseStudy: az120-cs3b-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a pricing option for the VMs that Humongous Insurance runs. The solution must meet the cost requirement. What should you recommend for each group of VMs? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une option de tarification pour les machines virtuelles exécutées par Humongous Insurance. La solution doit respecter l'exigence de coûts. Que devez-vous recommander pour chaque groupe de machines virtuelles ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      BOBJ1 to BOBJ4: [[bobj]]

      DS1 to DS6: [[ds]]
    fr: |
      BOBJ1 à BOBJ4 : [[bobj]]

      DS1 à DS6 : [[ds]]
  slots:
    - id: bobj
      options:
        - { id: payg, text: { en: "Pay-as-you-go pricing", fr: "Tarification à l'utilisation" } }
        - { id: ri, text: { en: "Three-year Azure Reserved VM Instances", fr: "Instances de machines virtuelles réservées Azure sur trois ans" } }
        - { id: sp, text: { en: "Three-year Azure savings plan for compute", fr: "Plan d'économies Azure pour le calcul sur trois ans" } }
    - id: ds
      options:
        - { id: payg, text: { en: "Pay-as-you-go pricing", fr: "Tarification à l'utilisation" } }
        - { id: ri, text: { en: "Three-year Azure Reserved VM Instances", fr: "Instances de machines virtuelles réservées Azure sur trois ans" } }
        - { id: sp, text: { en: "Three-year Azure savings plan for compute", fr: "Plan d'économies Azure pour le calcul sur trois ans" } }
answer:
  values: { bobj: ri, ds: sp }
explanation:
  correct:
    en: |
      Reservations commit to a specific instance type or family in a specific region and give the greatest savings for workloads that run continuously with no planned change, like the BusinessObjects VMs. A savings plan commits to an hourly spend on eligible compute in all regions, so it keeps applying when the data science VMs move to other series and to Sweden Central.
    fr: |
      Les réservations engagent sur un type ou une famille d'instances dans une région précise et offrent les économies les plus importantes pour les charges de travail qui s'exécutent en continu sans changement prévu, comme les machines virtuelles BusinessObjects. Un plan d'économies engage sur une dépense horaire de calcul éligible dans toutes les régions : il continue donc de s'appliquer quand les machines virtuelles de science des données passent à d'autres séries et à Sweden Central.
  options:
    payg:
      en: |
        Pay-as-you-go pricing gives no discount for VMs that run continuously.
      fr: |
        La tarification à l'utilisation n'accorde aucune remise pour des machines virtuelles qui s'exécutent en continu.
references:
  - title: Decide between a savings plan and a reservation
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
