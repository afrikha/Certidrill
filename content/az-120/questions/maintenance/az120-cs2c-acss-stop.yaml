id: az120-cs2c-acss-stop
objective: "4.2.7"
type: yesno_statements
caseStudy: az120-cs2c-litware
difficulty: 2
status: draft
stem:
  en: |
    The operations team will use the Virtual Instance for SAP solutions (VIS) of LQ1 to meet the operations requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe d'exploitation utilisera l'instance virtuelle pour les solutions SAP (VIS) de LQ1 pour respecter les exigences d'exploitation.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When the team stops LQ1 from the VIS, the VMs of LQ1 are also stopped and deallocated.
        fr: Quand l'équipe arrête LQ1 depuis la VIS, les machines virtuelles de LQ1 sont également arrêtées et libérées.
    - id: s2
      text:
        en: To start LQ1 from the VIS on Monday, the VMs of LQ1 must already be running.
        fr: Pour démarrer LQ1 depuis la VIS le lundi, les machines virtuelles de LQ1 doivent déjà être en cours d'exécution.
    - id: s3
      text:
        en: The Reader role on the VIS is sufficient for the team to stop and start LQ1.
        fr: Le rôle Reader sur la VIS suffit à l'équipe pour arrêter et démarrer LQ1.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Start and stop from Azure Center for SAP solutions act on the SAP application instances (ASCS and application servers) or the HANA database, not on the underlying VMs. A start operation therefore requires the VMs to be running, and sapstartsrv must be running on them. The operation requires the Azure Center for SAP solutions administrator role or equivalent permissions; Reader only allows viewing.
    fr: Le démarrage et l'arrêt depuis le Centre Azure pour les solutions SAP agissent sur les instances applicatives SAP (ASCS et serveurs d'applications) ou sur la base HANA, pas sur les machines virtuelles sous-jacentes. Une opération de démarrage exige donc que les machines virtuelles soient en cours d'exécution, avec sapstartsrv actif. L'opération nécessite le rôle Azure Center for SAP solutions administrator ou des autorisations équivalentes ; Reader permet seulement la consultation.
references:
  - title: Start and stop SAP systems, instances, and HANA database
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/start-stop-sap-systems
