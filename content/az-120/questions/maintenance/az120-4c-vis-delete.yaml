id: az120-4c-vis-delete
objective: "4.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso registered an SAP system named **CQ1** in Azure Center for SAP solutions. The company no longer wants to manage CQ1 through Azure Center for SAP solutions, but CQ1 must keep running.

    You delete the Virtual Instance for SAP solutions (VIS) of CQ1.

    Which statement describes the result?
  fr: |
    Contoso a inscrit un système SAP nommé **CQ1** dans le Centre Azure pour les solutions SAP. L'entreprise ne souhaite plus gérer CQ1 avec le Centre Azure pour les solutions SAP, mais CQ1 doit continuer de s'exécuter.

    Vous supprimez la Virtual Instance for SAP solutions (VIS) de CQ1.

    Quelle affirmation décrit le résultat ?
body:
  options:
    - { id: a, text: { en: "The VIS and its instance resources are deleted; the managed resource group and the VMs are kept.", fr: "La VIS et ses ressources d'instance sont supprimées ; le groupe de ressources managé et les machines virtuelles sont conservés." } }
    - { id: b, text: { en: "The VIS, its instance resources and its managed resource group are deleted; the VMs, disks and NICs are kept.", fr: "La VIS, ses ressources d'instance et son groupe de ressources managé sont supprimés ; les machines virtuelles, disques et cartes réseau sont conservés." } }
    - { id: c, text: { en: "The VIS, its instance resources, its managed resource group and the VMs are deleted; the disks are kept.", fr: "La VIS, ses ressources d'instance, son groupe de ressources managé et les machines virtuelles sont supprimés ; les disques sont conservés." } }
    - { id: d, text: { en: "The VIS is soft deleted and can be restored for 14 days; the VMs, disks and NICs are kept.", fr: "La VIS fait l'objet d'une suppression réversible et peut être restaurée pendant 14 jours ; les machines virtuelles, disques et cartes réseau sont conservés." } }
answer: { optionId: b }
explanation:
  correct:
    en: Deleting a VIS also deletes its ASCS, application server and database instance resources and its managed resource group. The underlying Azure resources, such as VMs, disks and NICs, aren't deleted, so CQ1 keeps running. The deletion is permanent, but you can register the system again later.
    fr: "Supprimer une VIS supprime aussi ses ressources d'instance ASCS, de serveur d'applications et de base de données, ainsi que son groupe de ressources managé. Les ressources Azure sous-jacentes, comme les machines virtuelles, les disques et les cartes réseau, ne sont pas supprimées : CQ1 continue de s'exécuter. La suppression est définitive, mais vous pouvez inscrire de nouveau le système plus tard."
  options:
    a: { en: "The managed resource group is deleted with the VIS.", fr: "Le groupe de ressources managé est supprimé avec la VIS." }
    c: { en: "The VMs are physical resources that deleting a VIS never removes.", fr: "Les machines virtuelles sont des ressources physiques que la suppression d'une VIS ne retire jamais." }
    d: { en: "A deleted VIS can't be restored; you can only register the system again.", fr: "Une VIS supprimée ne peut pas être restaurée ; vous pouvez seulement inscrire de nouveau le système." }
references:
  - title: Manage a Virtual Instance for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/manage-virtual-instance
