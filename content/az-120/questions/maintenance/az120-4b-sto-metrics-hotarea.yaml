id: az120-4b-sto-metrics-hotarea
objective: "4.2.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Contoso runs SAP HANA on an Azure VM that supports premium storage. The VM has three Premium SSD data disks: LUN 0 (/hana/data, host caching None), LUN 1 (/hana/log, host caching None) and LUN 2 (/usr/sap, host caching ReadOnly). Users report slow HANA savepoints. Azure Monitor shows the averages in the following table.

    Answer each prompt by selecting the value that answers it.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute SAP HANA sur une machine virtuelle Azure qui prend en charge le stockage Premium. La machine virtuelle a trois disques de données SSD Premium : LUN 0 (/hana/data, mise en cache de l'hôte None), LUN 1 (/hana/log, mise en cache de l'hôte None) et LUN 2 (/usr/sap, mise en cache de l'hôte ReadOnly). Les utilisateurs signalent des points de sauvegarde (savepoints) HANA lents. Azure Monitor affiche les moyennes du tableau suivant.

    Répondez à chaque consigne en sélectionnant la valeur qui y répond.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The value that explains why I/O to /hana/data and /hana/log is throttled", fr: "La valeur qui explique pourquoi les E/S vers /hana/data et /hana/log sont limitées" }
    - id: p2
      text: { en: "The value that shows a disk capped by its own provisioned IOPS", fr: "La valeur qui montre un disque plafonné par ses propres IOPS provisionnées" }
  grid:
    header: [{ en: Metric, fr: Métrique }, Dimension, { en: Average, fr: Moyenne }]
    rows:
      - [{ text: VM Cached IOPS Consumed Percentage }, { text: { en: "(none)", fr: "(aucune)" } }, { text: "31%", area: vmc }]
      - [{ text: VM Uncached IOPS Consumed Percentage }, { text: { en: "(none)", fr: "(aucune)" } }, { text: "100%", area: vmu }]
      - [{ text: Data Disk IOPS Consumed Percentage }, { text: LUN 0 }, { text: "72%", area: l0 }]
      - [{ text: Data Disk IOPS Consumed Percentage }, { text: LUN 1 }, { text: "76%", area: l1 }]
      - [{ text: Data Disk IOPS Consumed Percentage }, { text: LUN 2 }, { text: "100%", area: l2 }]
answer:
  values: { p1: vmu, p2: l2 }
explanation:
  correct:
    en: |
      LUN 0 and LUN 1 have no host caching, so their I/O counts against the VM's uncached limit. VM Uncached IOPS Consumed Percentage at 100% shows that the VM limit caps them even though each disk is below its own limit (72% and 76%); the fix is a VM size with higher uncached limits, not more disks. LUN 2 is at 100% of its own provisioned IOPS, so that disk is capped by its own limit; the VM cached limit (31%) isn't the constraint.
    fr: |
      LUN 0 et LUN 1 n'ont pas de mise en cache de l'hôte : leurs E/S comptent dans la limite non mise en cache de la machine virtuelle. VM Uncached IOPS Consumed Percentage à 100 % montre que la limite de la machine virtuelle les plafonne alors que chaque disque reste sous sa propre limite (72 % et 76 %) ; la correction est une taille de machine virtuelle aux limites non mises en cache plus élevées, pas davantage de disques. LUN 2 est à 100 % de ses propres IOPS provisionnées : ce disque est plafonné par sa propre limite ; la limite en cache de la machine virtuelle (31 %) n'est pas la contrainte.
references:
  - title: Disk metrics - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-metrics
