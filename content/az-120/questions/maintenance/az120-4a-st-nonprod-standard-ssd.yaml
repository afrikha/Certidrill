id: az120-4a-st-nonprod-standard-ssd
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs a quality assurance (QA) SAP system on Azure VMs with SQL Server. The QA system has low IOPS and throughput demands and is used by a few testers. All its disks are Premium SSD.

    You need to reduce the storage cost of the QA system. The solution must use the lowest-cost disk type that Microsoft considers suitable for this system.

    Which disk type should you use?
  fr: |
    Fabrikam exécute un système SAP d'assurance qualité (QA) sur des machines virtuelles Azure avec SQL Server. Le système QA a de faibles besoins en IOPS et en débit et est utilisé par quelques testeurs. Tous ses disques sont des SSD Premium.

    Vous devez réduire le coût de stockage du système QA. La solution doit utiliser le type de disque le moins coûteux que Microsoft juge adapté à ce système.

    Quel type de disque devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Standard HDD", fr: "HDD Standard" }
    - id: b
      text: { en: "Premium SSD v2", fr: "SSD Premium v2" }
    - id: c
      text: { en: "Standard SSD", fr: "SSD Standard" }
    - id: d
      text: { en: "Ultra Disk", fr: "Disque Ultra" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Standard SSD is the minimum storage for non-production SAP systems with low IOPS and throughput demands. It offers up to 500 IOPS per disk with no IOPS or throughput SLA, which is acceptable for a lightly used QA system.
    fr: |
      SSD Standard est le stockage minimal pour les systèmes SAP hors production qui ont de faibles besoins en IOPS et en débit. Il offre jusqu'à 500 IOPS par disque sans SLA d'IOPS ni de débit, ce qui est acceptable pour un système QA peu utilisé.
  options:
    a: { en: "Standard HDD should be used only for SAP backups or rarely used retired systems, never for active development, QA or production VMs or database files.", fr: "HDD Standard ne doit servir qu'aux sauvegardes SAP ou à des systèmes retirés rarement consultés, jamais aux machines virtuelles actives de développement, d'assurance qualité ou de production ni aux fichiers de base de données." }
    b: { en: "Premium SSD v2 has the best price/performance for demanding workloads, but it costs more than Standard SSD for a low-demand system.", fr: "SSD Premium v2 offre le meilleur rapport prix/performances pour les charges exigeantes, mais coûte plus cher que SSD Standard pour un système peu exigeant." }
    d: { en: "Ultra Disk costs more than Premium storage and targets demanding I/O workloads.", fr: "Le disque Ultra coûte plus cher que le stockage Premium et vise les charges d'E/S exigeantes." }
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
