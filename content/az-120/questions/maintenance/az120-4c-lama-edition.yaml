id: az120-4c-lama-edition
objective: "4.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso uses SAP Landscape Management (LaMa) 3.0 SP04, Standard Edition, to operate its on-premises SAP systems. The company migrated several SAP systems to Azure virtual machines.

    You need LaMa to deallocate and start the Azure VMs and to copy and relocate their managed disks by using the SAP LaMa connector for Azure.

    What should you do first?
  fr: |
    Contoso utilise SAP Landscape Management (LaMa) 3.0 SP04, édition Standard, pour exploiter ses systèmes SAP locaux. L'entreprise a migré plusieurs systèmes SAP vers des machines virtuelles Azure.

    Vous devez permettre à LaMa de libérer et de démarrer les machines virtuelles Azure et de copier et déplacer leurs disques managés à l'aide du connecteur SAP LaMa pour Azure.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Upgrade to SAP LaMa 3.0 SP05 or later and keep the Standard Edition.", fr: "Mettre à niveau vers SAP LaMa 3.0 SP05 ou ultérieur en conservant l'édition Standard." } }
    - { id: b, text: { en: "Keep SAP LaMa 3.0 SP04 and register the SAP systems in Azure Center for SAP solutions.", fr: "Conserver SAP LaMa 3.0 SP04 et inscrire les systèmes SAP dans le Centre Azure pour les solutions SAP." } }
    - { id: c, text: { en: "Upgrade to SAP LaMa 3.0 SP05 or later, Enterprise Edition.", fr: "Mettre à niveau vers SAP LaMa 3.0 SP05 ou ultérieur, édition Enterprise." } }
    - { id: d, text: { en: "Keep SAP LaMa 3.0 SP04 and deploy the connector from Azure Marketplace.", fr: "Conserver SAP LaMa 3.0 SP04 et déployer le connecteur depuis la Place de marché Azure." } }
answer: { optionId: c }
explanation:
  correct:
    en: The Azure connector ships with SAP LaMa 3.0 SP05 and later, and it's available only in SAP LaMa Enterprise Edition (SAP Note 2343511). Microsoft recommends the latest LaMa 3.0 support package and patch.
    fr: Le connecteur Azure est livré avec SAP LaMa 3.0 SP05 et ultérieur, et il n'est disponible que dans SAP LaMa Enterprise Edition (note SAP 2343511). Microsoft recommande le dernier support package et le dernier correctif de LaMa 3.0.
  options:
    a: { en: "The connector isn't available in the Standard Edition, whatever the support package.", fr: "Le connecteur n'est pas disponible dans l'édition Standard, quel que soit le support package." }
    b: { en: "Azure Center for SAP solutions doesn't add the connector to LaMa, and SP04 doesn't include it.", fr: "Le Centre Azure pour les solutions SAP n'ajoute pas le connecteur à LaMa, et SP04 ne l'inclut pas." }
    d: { en: "The connector is part of SAP LaMa itself, not an Azure Marketplace offer.", fr: "Le connecteur fait partie de SAP LaMa lui-même ; ce n'est pas une offre de la Place de marché Azure." }
references:
  - title: Set up the SAP LaMa connector for Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/lama-installation
