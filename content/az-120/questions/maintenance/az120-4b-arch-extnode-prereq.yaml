id: az120-4b-arch-extnode-prereq
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs SAP BW/4HANA on a single SAP HANA scale-up system hosted on one M-series Azure VM. The HANA database keeps growing, mostly with warm data from older data store objects.

    Fabrikam plans to place the warm data on an SAP HANA extension node. The solution must follow the SAP on Azure guidance and minimize licensing costs.

    Which design should you recommend?
  fr: |
    Fabrikam exécute SAP BW/4HANA sur un système SAP HANA en scale-up hébergé sur une seule machine virtuelle Azure de la série M. La base de données HANA ne cesse de croître, surtout avec des données tièdes issues d'anciens objets de stockage de données.

    Fabrikam prévoit de placer les données tièdes sur un nœud d'extension SAP HANA. La solution doit suivre les recommandations SAP sur Azure et réduire au minimum les coûts de licence.

    Quelle conception devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Install the extension node as a second HANA instance on the existing VM, sharing its OS and disks", fr: "Installer le nœud d'extension comme seconde instance HANA sur la machine virtuelle existante, en partageant son système d'exploitation et ses disques" } }
    - { id: b, text: { en: "Convert the system to scale-out and add the extension node on a separate VM, with no additional HANA license", fr: "Convertir le système en scale-out et ajouter le nœud d'extension sur une machine virtuelle distincte, sans licence HANA supplémentaire" } }
    - { id: c, text: { en: "Keep the scale-up system and add the extension node on a separate VM, with an additional HANA license", fr: "Conserver le système en scale-up et ajouter le nœud d'extension sur une machine virtuelle distincte, avec une licence HANA supplémentaire" } }
    - { id: d, text: { en: "Keep the scale-up system and move the warm tables to the NSE buffer cache of the extension node", fr: "Conserver le système en scale-up et déplacer les tables tièdes dans le cache tampon NSE du nœud d'extension" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An extension node requires a scale-out deployment, so a scale-up system must first be extended to scale-out. The extension node can't share the OS, network or disks of the standard node, so it runs on its own VM. It needs no license beyond the standard HANA license.
    fr: |
      Un nœud d'extension exige un déploiement en scale-out ; un système en scale-up doit donc d'abord être étendu en scale-out. Le nœud d'extension ne peut partager ni le système d'exploitation, ni le réseau, ni les disques du nœud standard : il s'exécute sur sa propre machine virtuelle. Il ne demande aucune licence en plus de la licence HANA standard.
  options:
    a: { en: "The extension node can't share the OS, network or disks of the standard node.", fr: "Le nœud d'extension ne peut pas partager le système d'exploitation, le réseau ni les disques du nœud standard." }
    c: { en: "Extension nodes require scale-out, and no additional license is needed.", fr: "Les nœuds d'extension exigent un scale-out, et aucune licence supplémentaire n'est nécessaire." }
    d: { en: "NSE and extension nodes are different warm-tier options; an extension node isn't an NSE buffer cache, and it still requires scale-out.", fr: "NSE et les nœuds d'extension sont deux options distinctes de niveau tiède ; un nœud d'extension n'est pas un cache tampon NSE, et il exige toujours un scale-out." }
references:
  - title: Managing SAP HANA data footprint for balancing cost and performance
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-tiering-guidance
