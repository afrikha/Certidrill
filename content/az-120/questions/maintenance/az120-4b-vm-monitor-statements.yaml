id: az120-4b-vm-monitor-statements
objective: "4.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Wingtip runs SAP S/4HANA on Azure VMs. The operations team is designing VM monitoring with Azure Monitor and is reviewing the Azure VM extension for SAP solutions that is installed on every SAP VM.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip exécute SAP S/4HANA sur des machines virtuelles Azure. L'équipe d'exploitation conçoit la supervision des machines virtuelles avec Azure Monitor et examine l'Azure VM extension for SAP solutions installée sur chaque machine virtuelle SAP.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Azure Monitor collects host metrics such as CPU, disk I/O and network traffic for the SAP VMs without any agent installed in the guest OS.
        fr: Azure Monitor collecte les métriques de l'hôte, comme le processeur, les E/S disque et le trafic réseau, pour les machines virtuelles SAP sans aucun agent installé dans le système d'exploitation invité.
    - id: s2
      text:
        en: The standard version and the new version of the Azure VM extension for SAP solutions can be installed side by side on the same VM.
        fr: La version standard et la nouvelle version de l'Azure VM extension for SAP solutions peuvent être installées côte à côte sur la même machine virtuelle.
    - id: s3
      text:
        en: For an issue with the Azure VM extension for SAP solutions, Wingtip opens a support case with SAP Support.
        fr: Pour un problème avec l'Azure VM extension for SAP solutions, Wingtip ouvre un cas de support auprès du support SAP.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Host metrics, including availability, are collected by default at no cost; only guest metrics and logs need the Azure Monitor Agent. The two versions of the Azure VM extension for SAP solutions can't run on the same VM, so you uninstall one before switching. Support for the extension is provided through SAP support channels.
    fr: |
      Les métriques de l'hôte, y compris la disponibilité, sont collectées par défaut sans frais ; seuls les métriques et journaux invités exigent l'agent Azure Monitor. Les deux versions de l'Azure VM extension for SAP solutions ne peuvent pas s'exécuter sur la même machine virtuelle : vous désinstallez l'une avant de changer. Le support de l'extension passe par les canaux de support SAP.
references:
  - title: Monitor virtual machines in Azure
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vminsights-overview
  - title: Implement the Azure VM extension for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap
