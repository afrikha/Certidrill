id: az120-4b-opt-stop-dealloc-cmd
objective: "4.1.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has a quality assurance SAP system named **TQ1** that is registered in Azure Center for SAP solutions as a Virtual Instance for SAP solutions (VIS) in the resource group **rg-sap-tq1**. TQ1 is used only during business hours.

    Every evening, you need to stop the SAP application tier of TQ1 so that load-balanced RFC and HTTP calls drain for up to three minutes first, and so that the compute of the TQ1 VMs is no longer billed.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'un système SAP d'assurance qualité nommé **TQ1**, inscrit dans le Centre Azure pour les solutions SAP en tant que Virtual Instance for SAP solutions (VIS) dans le groupe de ressources **rg-sap-tq1**. TQ1 n'est utilisé que pendant les heures ouvrées.

    Chaque soir, vous devez arrêter le niveau application SAP de TQ1 de sorte que les appels RFC et HTTP équilibrés se vident d'abord pendant trois minutes au plus, et que le calcul des machines virtuelles de TQ1 ne soit plus facturé.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az workloads sap-virtual-instance [[verb]] \
      --resource-group rg-sap-tq1 --name TQ1 \
      [[drain]] 180 \
      [[vm]] true
  slots:
    - id: verb
      options:
        - { id: start, text: start }
        - { id: stop, text: stop }
        - { id: update, text: update }
        - { id: delete, text: delete }
    - id: drain
      options:
        - { id: soft, text: "--soft-stop-timeout-seconds" }
        - { id: nowait, text: "--no-wait" }
        - { id: change, text: "--change-reference" }
    - id: vm
      options:
        - { id: startvm, text: "--start-vm" }
        - { id: nowait2, text: "--no-wait" }
        - { id: dealloc, text: "--deallocate-vm" }
answer:
  values: { verb: stop, drain: soft, vm: dealloc }
explanation:
  correct:
    en: |
      `stop` stops the ASCS and application server instances of the VIS. `--soft-stop-timeout-seconds` sets how long the soft shutdown waits until RFC and HTTP clients stop sending load-balanced calls to the instances (0, the default, is a hard stop). By default only the SAP application stops; `--deallocate-vm true` also stops and deallocates the VMs, so their compute is no longer billed.
    fr: |
      `stop` arrête les instances ASCS et serveurs d'applications de la VIS. `--soft-stop-timeout-seconds` définit combien de temps l'arrêt progressif attend que les clients RFC et HTTP cessent d'envoyer des appels équilibrés aux instances (0, la valeur par défaut, correspond à un arrêt brutal). Par défaut, seule l'application SAP s'arrête ; `--deallocate-vm true` arrête et libère aussi les machines virtuelles, dont le calcul n'est alors plus facturé.
  options:
    update: { en: "update changes the properties of the VIS resource; it doesn't stop SAP instances.", fr: "update modifie les propriétés de la ressource VIS ; il n'arrête pas les instances SAP." }
    delete: { en: "delete removes the VIS resource from Azure Center for SAP solutions; it doesn't stop the SAP system.", fr: "delete supprime la ressource VIS du Centre Azure pour les solutions SAP ; il n'arrête pas le système SAP." }
    nowait: { en: "--no-wait only returns before the long-running operation finishes; it doesn't take a number of seconds.", fr: "--no-wait se contente de rendre la main avant la fin de l'opération longue ; il n'accepte pas un nombre de secondes." }
    change: { en: "--change-reference records a related change reference ID for policy purposes; it doesn't control the shutdown.", fr: "--change-reference enregistre un ID de référence de modification associé, à des fins de stratégie ; il ne contrôle pas l'arrêt." }
    startvm: { en: "--start-vm belongs to the start command and starts the VMs before the SAP instances.", fr: "--start-vm appartient à la commande start et démarre les machines virtuelles avant les instances SAP." }
references:
  - title: az workloads sap-virtual-instance
    url: https://learn.microsoft.com/en-us/cli/azure/workloads/sap-virtual-instance
  - title: Start and stop SAP systems, instances, and HANA database
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/start-stop-sap-systems
