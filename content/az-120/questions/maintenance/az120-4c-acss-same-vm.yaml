id: az120-4c-acss-same-vm
objective: "4.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin manages an SAP system named **TP1** as a Virtual Instance for SAP solutions (VIS). Two application server instances, **D10** and **D11**, run on a virtual machine named **app03**. Other application server instances run on app01 and app02.

    A script sends stop requests for D10 and D11 at the same time. D10 stops, but the request for D11 fails.

    You need to stop D10 and D11 only. The other instances must keep running.

    What should you do?
  fr: |
    Tailspin gère un système SAP nommé **TP1** en tant que Virtual Instance for SAP solutions (VIS). Deux instances de serveur d'applications, **D10** et **D11**, s'exécutent sur une machine virtuelle nommée **app03**. D'autres instances de serveur d'applications s'exécutent sur app01 et app02.

    Un script envoie en même temps des demandes d'arrêt pour D10 et D11. D10 s'arrête, mais la demande pour D11 échoue.

    Vous devez arrêter uniquement D10 et D11. Les autres instances doivent continuer de s'exécuter.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Stop TP1 from the VIS with the VM deallocation option.", fr: "Arrêter TP1 depuis la VIS avec l'option de libération des machines virtuelles." } }
    - { id: b, text: { en: "Send both stop requests again in parallel with the `--no-wait` parameter.", fr: "Renvoyer les deux demandes d'arrêt en parallèle avec le paramètre `--no-wait`." } }
    - { id: c, text: { en: "Stop the instances one at a time, and send the request for D11 after D10 has stopped.", fr: "Arrêter les instances une à la fois, et envoyer la demande pour D11 après l'arrêt de D10." } }
    - { id: d, text: { en: "Stop the central services instance of TP1, then stop D11.", fr: "Arrêter l'instance des services centraux de TP1, puis arrêter D11." } }
answer: { optionId: c }
explanation:
  correct:
    en: When several application server instances run on the same VM, only one stop request is accepted at a time and parallel requests fail. Stopping the instances one at a time stops D10 and D11 without affecting the other instances.
    fr: Quand plusieurs instances de serveur d'applications s'exécutent sur la même machine virtuelle, une seule demande d'arrêt est acceptée à la fois et les demandes parallèles échouent. Arrêter les instances une à la fois arrête D10 et D11 sans affecter les autres instances.
  options:
    a: { en: "Stopping the VIS stops the whole application tier, including the instances on app01 and app02.", fr: "Arrêter la VIS arrête tout le niveau application, y compris les instances d'app01 et d'app02." }
    b: { en: "--no-wait only returns control earlier; the requests are still parallel and one of them fails.", fr: "--no-wait rend seulement la main plus tôt ; les demandes restent parallèles et l'une d'elles échoue." }
    d: { en: "Stopping central services affects the whole system, which must keep running.", fr: "Arrêter les services centraux affecte tout le système, qui doit continuer de s'exécuter." }
references:
  - title: Start and stop SAP systems, instances, and HANA database
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/start-stop-sap-systems
