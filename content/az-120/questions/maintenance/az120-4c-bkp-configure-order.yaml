id: az120-4c-bkp-configure-order
objective: "4.2.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin runs SAP HANA 2.0 SPS 07 on a Red Hat Enterprise Linux 9.2 virtual machine named **hdb-tp1** in the North Europe region. The databases aren't backed up yet.

    You need to configure Backint streaming backups of the HANA databases by using Azure Backup.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin exécute SAP HANA 2.0 SPS 07 sur une machine virtuelle Red Hat Enterprise Linux 9.2 nommée **hdb-tp1**, dans la région North Europe. Les bases de données ne sont pas encore sauvegardées.

    Vous devez configurer des sauvegardes en streaming Backint des bases de données HANA avec Sauvegarde Azure.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: vault, text: { en: "Create a Recovery Services vault in North Europe, in the subscription of hdb-tp1.", fr: "Créer un coffre Recovery Services dans North Europe, dans l'abonnement de hdb-tp1." } }
    - { id: script, text: { en: "Run the pre-registration script as root on hdb-tp1.", fr: "Exécuter le script de préinscription en tant que root sur hdb-tp1." } }
    - { id: discover, text: { en: "Discover the databases of hdb-tp1 from the vault.", fr: "Découvrir les bases de données de hdb-tp1 depuis le coffre." } }
    - { id: enable, text: { en: "Select the databases, select a backup policy and enable backup.", fr: "Sélectionner les bases de données, choisir une stratégie de sauvegarde et activer la sauvegarde." } }
    - { id: mars, text: { en: "Install the Microsoft Azure Recovery Services (MARS) agent on hdb-tp1.", fr: "Installer l'agent Microsoft Azure Recovery Services (MARS) sur hdb-tp1." } }
    - { id: bvault, text: { en: "Create a Backup vault in North Europe.", fr: "Créer un coffre de sauvegarde dans North Europe." } }
answer:
  sequence: [ vault, script, discover, enable ]
explanation:
  correct:
    en: |
      HANA streaming backups use a Recovery Services vault in the same region and subscription as the VM. The pre-registration script, run as root, installs the required packages, checks connectivity and creates the AZUREWLBACKUPHANAUSER user and its hdbuserstore key. Discovery then registers the VM and installs the workload extension, and you finally enable backup with a policy.
    fr: |
      Les sauvegardes en streaming HANA utilisent un coffre Recovery Services situé dans la même région et le même abonnement que la machine virtuelle. Le script de préinscription, exécuté en tant que root, installe les packages nécessaires, vérifie la connectivité et crée l'utilisateur AZUREWLBACKUPHANAUSER et sa clé hdbuserstore. La découverte inscrit ensuite la machine virtuelle et installe l'extension de charge de travail, puis vous activez la sauvegarde avec une stratégie.
  options:
    mars: { en: "Azure Backup installs a workload extension on the VM; the MARS agent backs up files and folders, not HANA databases.", fr: "Sauvegarde Azure installe une extension de charge de travail sur la machine virtuelle ; l'agent MARS sauvegarde des fichiers et dossiers, pas des bases de données HANA." }
    bvault: { en: "SAP HANA in Azure VM backups are stored in a Recovery Services vault, not in a Backup vault.", fr: "Les sauvegardes SAP HANA dans une machine virtuelle Azure sont stockées dans un coffre Recovery Services, pas dans un coffre de sauvegarde." }
references:
  - title: Tutorial - Back up SAP HANA databases in Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/tutorial-backup-sap-hana-db
  - title: Back up SAP HANA databases in Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-sap-hana-database
