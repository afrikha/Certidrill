id: az120-4a-ri-optimize-order
objective: "4.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs a large SAP landscape on Azure. Some VMs are oversized, several existing reservations are underused because VM families changed, and part of the usage is still billed at pay-as-you-go rates. The production database VMs are stable, while the application tiers change often.

    You need to optimize the commitment-based discounts by following the sequence that Microsoft recommends.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware exécute un vaste paysage SAP sur Azure. Certaines machines virtuelles sont surdimensionnées, plusieurs réservations existantes sont sous-utilisées parce que les familles de machines virtuelles ont changé, et une partie de l'utilisation est encore facturée au tarif du paiement à l'utilisation. Les machines virtuelles de base de données de production sont stables, tandis que les niveaux d'applications changent souvent.

    Vous devez optimiser les remises fondées sur des engagements en suivant la séquence recommandée par Microsoft.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: rightsize, text: { en: "Right-size or remove the oversized and unused VMs.", fr: "Redimensionner ou supprimer les machines virtuelles surdimensionnées et inutilisées." } }
    - { id: exchange, text: { en: "Exchange underused reservations for configurations that match the current VMs.", fr: "Échanger les réservations sous-utilisées contre des configurations qui correspondent aux machines virtuelles actuelles." } }
    - { id: tradein, text: { en: "Trade in the remaining underused reservations for a savings plan.", fr: "Convertir les réservations encore sous-utilisées en plan d'économies." } }
    - { id: buyri, text: { en: "Buy new reservations for the stable database VMs.", fr: "Acheter de nouvelles réservations pour les machines virtuelles de base de données stables." } }
    - { id: buysp, text: { en: "Buy a new savings plan sized to the remaining eligible usage.", fr: "Acheter un nouveau plan d'économies dimensionné pour l'utilisation éligible restante." } }
    - { id: cancelsp, text: { en: "Cancel the existing savings plans that are underused.", fr: "Annuler les plans d'économies existants qui sont sous-utilisés." } }
    - { id: capres, text: { en: "Buy on-demand capacity reservations for the usage billed at pay-as-you-go rates.", fr: "Acheter des réservations de capacité à la demande pour l'utilisation facturée au tarif du paiement à l'utilisation." } }
answer:
  sequence: [ rightsize, exchange, tradein, buyri, buysp ]
explanation:
  correct:
    en: |
      Microsoft's sequence removes waste first, because discounts reduce rates, not waste. You then fix existing commitments by exchanging underused reservations and trading in those that no longer fit for a savings plan. Only then do you buy new reservations for stable workloads and, last, new savings plans sized to the optimized baseline.
    fr: |
      La séquence de Microsoft supprime d'abord le gaspillage, car les remises réduisent les tarifs, pas le gaspillage. Vous corrigez ensuite les engagements existants en échangeant les réservations sous-utilisées et en convertissant en plan d'économies celles qui ne conviennent plus. Ce n'est qu'ensuite que vous achetez de nouvelles réservations pour les charges de travail stables et, en dernier, de nouveaux plans d'économies dimensionnés pour la base optimisée.
  options:
    cancelsp: { en: "Savings plans can't be canceled or refunded.", fr: "Les plans d'économies ne peuvent être ni annulés ni remboursés." }
    capres: { en: "Capacity reservations are billed at pay-as-you-go rates and don't reduce the cost of uncovered usage.", fr: "Les réservations de capacité sont facturées au tarif du paiement à l'utilisation et ne réduisent pas le coût de l'utilisation non couverte." }
references:
  - title: Decide between a savings plan and a reservation
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
