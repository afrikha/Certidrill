id: az120-4b-arch-nse-s4
objective: "4.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs SAP S/4HANA on a single SAP HANA 2.0 SPS 07 scale-up system hosted on an M-series Azure VM. Data characterization shows that 40% of the column store data is warm: it's rarely read, but users must still be able to query it from S/4HANA.

    You need to reduce the memory footprint of the HANA database so that Contoso can move to a smaller certified VM size. The data must stay in the database, and the change must be reversible.

    What should you recommend?
  fr: |
    Contoso exécute SAP S/4HANA sur un système SAP HANA 2.0 SPS 07 en scale-up hébergé sur une machine virtuelle Azure de la série M. La caractérisation des données montre que 40 % des données du column store sont tièdes : elles sont rarement lues, mais les utilisateurs doivent toujours pouvoir les interroger depuis S/4HANA.

    Vous devez réduire l'empreinte mémoire de la base de données HANA pour que Contoso puisse passer à une taille de machine virtuelle certifiée plus petite. Les données doivent rester dans la base, et la modification doit être réversible.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "SAP HANA Dynamic Tiering 2.0 on a dedicated VM", fr: "SAP HANA Dynamic Tiering 2.0 sur une machine virtuelle dédiée" } }
    - { id: b, text: { en: "Data archiving to an SAP ILM store in Azure Blob Storage", fr: "L'archivage des données dans un magasin SAP ILM sur Stockage Blob Azure" } }
    - { id: c, text: { en: "SAP HANA Native Storage Extension (NSE)", fr: "SAP HANA Native Storage Extension (NSE)" } }
    - { id: d, text: { en: "An SAP HANA extension node in the same system", fr: "Un nœud d'extension SAP HANA dans le même système" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      NSE is the warm tier Microsoft lists for S/4HANA. It's a built-in, disk-based extension of the in-memory column store, available from HANA 2.0 SPS 04 on any HANA-certified Azure VM. Warm data is loaded on demand into a buffer cache instead of staying in memory, it remains queryable, and the change is reversible.
    fr: |
      NSE est le niveau tiède que Microsoft indique pour S/4HANA. C'est une extension intégrée sur disque du column store en mémoire, disponible à partir de HANA 2.0 SPS 04 sur toute machine virtuelle Azure certifiée HANA. Les données tièdes sont chargées à la demande dans un cache tampon au lieu de rester en mémoire, elles restent interrogeables, et la modification est réversible.
  options:
    a: { en: "Dynamic Tiering 2.0 isn't supported by S/4HANA or SAP BW; its use cases are native HANA applications.", fr: "Dynamic Tiering 2.0 n'est pas pris en charge par S/4HANA ni par SAP BW ; il s'adresse aux applications HANA natives." }
    b: { en: "Archiving removes the data from the database, which the requirement forbids, and it isn't reversible like NSE.", fr: "L'archivage retire les données de la base, ce que l'exigence interdit, et il n'est pas réversible comme NSE." }
    d: { en: "Extension nodes apply to BW on HANA, BW/4HANA and native HANA, and they require a scale-out system.", fr: "Les nœuds d'extension s'appliquent à BW on HANA, BW/4HANA et HANA natif, et ils exigent un système en scale-out." }
references:
  - title: Managing SAP HANA data footprint for balancing cost and performance
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-tiering-guidance
