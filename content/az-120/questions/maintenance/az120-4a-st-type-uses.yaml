id: az120-4a-st-type-uses
objective: "4.1.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove is reviewing the storage of its SAP landscape on Azure to reduce costs. The production SAP HANA VMs are zonal.

    Which storage type should you use for each requirement? To answer, drag the appropriate storage types to the correct requirements. Each storage type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove examine le stockage de son paysage SAP sur Azure pour réduire les coûts. Les machines virtuelles SAP HANA de production sont zonales.

    Quel type de stockage devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les types de stockage appropriés vers les exigences correspondantes. Chaque type de stockage peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: hdd, text: { en: "Standard HDD", fr: "HDD Standard" } }
    - { id: ssd, text: { en: "Standard SSD", fr: "SSD Standard" } }
    - { id: pv2, text: { en: "Premium SSD v2", fr: "SSD Premium v2" } }
    - { id: anf, text: { en: "Azure NetApp Files", fr: "Azure NetApp Files" } }
    - { id: ultra, text: { en: "Ultra Disk", fr: "Disque Ultra" } }
    - { id: premium, text: { en: "Premium SSD", fr: "SSD Premium" } }
  targets:
    - id: backup
      text: { en: "A disk that stores only SAP database backup files", fr: "Un disque qui stocke uniquement des fichiers de sauvegarde de base de données SAP" }
    - id: nonprod
      text: { en: "The disks of a non-production SAP system with low IOPS and throughput demands", fr: "Les disques d'un système SAP hors production qui a de faibles besoins en IOPS et en débit" }
    - id: log
      text: { en: "A block disk for /hana/log in production, with the best price/performance and without Write Accelerator", fr: "Un disque en mode bloc pour /hana/log en production, avec le meilleur rapport prix/performances et sans Write Accelerator" }
    - id: nfs
      text: { en: "An NFS volume for /hana/data whose throughput can be set independently of its size", fr: "Un volume NFS pour /hana/data dont le débit peut être défini indépendamment de sa taille" }
answer:
  mapping: { backup: hdd, nonprod: ssd, log: pv2, nfs: anf }
explanation:
  correct:
    en: |
      Standard HDD should be used only to store SAP backups. Standard SSD is the minimum storage for non-production systems with low IOPS and throughput demands. Premium SSD v2 offers the best price/performance for SAP and passes HANA certification without Write Accelerator. Azure NetApp Files provides NFS volumes, and its manual QoS decouples throughput from volume size.
    fr: |
      HDD Standard ne doit servir qu'à stocker des sauvegardes SAP. SSD Standard est le stockage minimal pour les systèmes hors production qui ont de faibles besoins en IOPS et en débit. SSD Premium v2 offre le meilleur rapport prix/performances pour SAP et obtient la certification HANA sans Write Accelerator. Azure NetApp Files fournit des volumes NFS, et sa QoS manuelle découple le débit de la taille du volume.
  options:
    ultra: { en: "Ultra Disk also needs no Write Accelerator, but its cost is higher than Premium storage.", fr: "Le disque Ultra n'a pas non plus besoin de Write Accelerator, mais son coût est supérieur à celui du stockage Premium." }
    premium: { en: "Premium SSD requires Write Accelerator for /hana/log, and its performance is tied to the size of the disk.", fr: "SSD Premium exige Write Accelerator pour /hana/log, et ses performances sont liées à la taille du disque." }
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
