id: az120-4a-net-peered-vnets
objective: "4.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove runs a production SAP system named **WP1**. The application server VMs are in a virtual network named **vnet-app**, and the SAP HANA VM is in a virtual network named **vnet-db**. The two virtual networks are peered. The HANA VM was deployed from a custom image with accelerated networking disabled. The monthly bill includes significant peering traffic charges.

    You need to reduce the network latency between the application servers and the database, reduce networking costs and use a configuration that SAP on Azure supports. Traffic between the tiers must remain filtered.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove exécute un système SAP de production nommé **WP1**. Les machines virtuelles de serveur d'applications se trouvent dans un réseau virtuel nommé **vnet-app**, et la machine virtuelle SAP HANA dans un réseau virtuel nommé **vnet-db**. Les deux réseaux virtuels sont reliés par un peering. La machine virtuelle HANA a été déployée à partir d'une image personnalisée avec la mise en réseau accélérée désactivée. La facture mensuelle comprend des frais importants de trafic de peering.

    Vous devez réduire la latence réseau entre les serveurs d'applications et la base de données, réduire les coûts réseau et utiliser une configuration prise en charge par SAP sur Azure. Le trafic entre les niveaux doit rester filtré.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Place the application and database VMs in different subnets of one virtual network, with NSG rules between the subnets", fr: "Placer les machines virtuelles d'application et de base de données dans des sous-réseaux différents d'un même réseau virtuel, avec des règles NSG entre les sous-réseaux" }
    - id: b
      text: { en: "Add a second NIC to the HANA VM in a subnet of vnet-app", fr: "Ajouter une deuxième carte réseau à la machine virtuelle HANA dans un sous-réseau de vnet-app" }
    - id: c
      text: { en: "Enable accelerated networking on the NIC of the HANA VM", fr: "Activer la mise en réseau accélérée sur la carte réseau de la machine virtuelle HANA" }
    - id: d
      text: { en: "Route the traffic between vnet-app and vnet-db through Azure Firewall in a hub virtual network", fr: "Faire passer le trafic entre vnet-app et vnet-db par Pare-feu Azure dans un réseau virtuel hub" }
    - id: e
      text: { en: "Place the VMs of all the SAP systems of the landscape in one proximity placement group", fr: "Placer les machines virtuelles de tous les systèmes SAP du paysage dans un seul groupe de placement de proximité" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Segregating the SAP application and DBMS layers into different virtual networks isn't supported and incurs peering transfer costs; Microsoft recommends subnets of the same virtual network, with NSGs and ASGs for filtering. Accelerated networking should be enabled on all NICs of all SAP VMs where technically possible, which lowers latency.
    fr: |
      Séparer les couches d'applications et SGBD SAP dans des réseaux virtuels différents n'est pas pris en charge et entraîne des frais de transfert de peering ; Microsoft recommande des sous-réseaux du même réseau virtuel, avec des NSG et des ASG pour le filtrage. La mise en réseau accélérée doit être activée sur toutes les cartes réseau de toutes les machines virtuelles SAP quand c'est techniquement possible, ce qui réduit la latence.
  options:
    b: { en: "Additional NICs share the VM's bandwidth, and Microsoft recommends multiple NICs only to reach other private subnets; the layers would still be split across virtual networks.", fr: "Les cartes réseau supplémentaires partagent la bande passante de la machine virtuelle, et Microsoft ne recommande plusieurs cartes réseau que pour atteindre d'autres sous-réseaux privés ; les couches resteraient réparties sur des réseaux virtuels différents." }
    d: { en: "A firewall in the path between the application and DBMS layers is an unsupported network virtual appliance that adds latency.", fr: "Un pare-feu sur le chemin entre les couches d'applications et SGBD est une appliance virtuelle réseau non prise en charge qui ajoute de la latence." }
    e: { en: "A proximity placement group should contain only one SAP system; bundling a landscape increases allocation failures.", fr: "Un groupe de placement de proximité ne doit contenir qu'un seul système SAP ; y regrouper un paysage augmente les échecs d'allocation." }
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
