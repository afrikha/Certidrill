id: az120-4b-opt-db-license-multi
objective: "4.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware runs SAP ERP 6.0 on Azure. The production database runs Microsoft SQL Server on two Windows Server VMs that run 24/7 on the same VM size in one region, and Litware doesn't plan to change that size or region for at least three years. Litware has Windows Server core licenses with active Software Assurance.

    You need to reduce the cost of the production database VMs. The configuration must remain supported for SAP production workloads.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware exécute SAP ERP 6.0 sur Azure. La base de données de production utilise Microsoft SQL Server sur deux machines virtuelles Windows Server qui fonctionnent 24 h/24, 7 j/7 sur la même taille de machine virtuelle dans une seule région, et Litware ne prévoit pas de changer cette taille ni cette région pendant au moins trois ans. Litware dispose de licences de cœurs Windows Server avec Software Assurance actif.

    Vous devez réduire le coût des machines virtuelles de base de données de production. La configuration doit rester prise en charge pour les charges de travail SAP de production.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable Azure Hybrid Benefit for Windows Server on the database VMs.", fr: "Activer Azure Hybrid Benefit pour Windows Server sur les machines virtuelles de base de données." } }
    - { id: b, text: { en: "Move the SQL Server data files to Standard HDD managed disks.", fr: "Déplacer les fichiers de données SQL Server vers des disques managés HDD Standard." } }
    - { id: c, text: { en: "Purchase a three-year reservation for the database VM size in that region.", fr: "Acheter une réservation de trois ans pour la taille de machine virtuelle de base de données dans cette région." } }
    - { id: d, text: { en: "Move the SQL Server data files to an Azure Files SSD share.", fr: "Déplacer les fichiers de données SQL Server vers un partage Azure Files SSD." } }
    - { id: e, text: { en: "Redeploy the database VMs as Azure Spot Virtual Machines.", fr: "Redéployer les machines virtuelles de base de données en tant que machines virtuelles Azure Spot." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Azure Hybrid Benefit lets Litware run the Windows VMs at a reduced cost by reusing Windows Server core licenses with active Software Assurance. A three-year reservation gives the deepest discount for VMs that run continuously on a fixed size in one region. Neither action changes the storage or the infrastructure the SAP system runs on.
    fr: |
      Azure Hybrid Benefit permet à Litware d'exécuter les machines virtuelles Windows à coût réduit en réutilisant des licences de cœurs Windows Server avec Software Assurance actif. Une réservation de trois ans offre la remise la plus forte pour des machines virtuelles qui fonctionnent en continu sur une taille fixe dans une seule région. Aucune de ces actions ne modifie le stockage ni l'infrastructure sur laquelle s'exécute le système SAP.
  options:
    b: { en: "Standard HDD should only store SAP backups; database files and active production VMs must not use it.", fr: "Le HDD Standard ne doit servir qu'aux sauvegardes SAP ; les fichiers de base de données et les machines virtuelles de production actives ne doivent pas l'utiliser." }
    d: { en: "No SAP DBMS workload is supported on shared volumes based on Azure Files SSD.", fr: "Aucune charge de travail SGBD SAP n'est prise en charge sur des volumes partagés basés sur Azure Files SSD." }
    e: { en: "Spot VMs can be evicted when Azure needs the capacity, which is unacceptable for a production database.", fr: "Les machines virtuelles Spot peuvent être évincées quand Azure a besoin de la capacité, ce qui est inacceptable pour une base de données de production." }
references:
  - title: Explore Azure Hybrid Benefit for Windows VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/hybrid-use-benefit-licensing
  - title: Azure storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
