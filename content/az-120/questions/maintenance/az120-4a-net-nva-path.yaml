id: az120-4a-net-nva-path
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs an SAP S/4HANA system on Azure VMs. The application servers are in a subnet named **snet-app** and the SAP HANA cluster is in a subnet named **snet-db** of the same virtual network. A user-defined route sends all traffic from snet-app to snet-db through a third-party firewall network virtual appliance (NVA) for inspection.

    Since the route was added, database response times have doubled, and the Pacemaker cluster of the database has failed over unexpectedly twice.

    You need a configuration that SAP on Azure supports. Traffic between the two subnets must still be restricted to the required ports.

    What should you do?
  fr: |
    Contoso exécute un système SAP S/4HANA sur des machines virtuelles Azure. Les serveurs d'applications se trouvent dans un sous-réseau nommé **snet-app** et le cluster SAP HANA dans un sous-réseau nommé **snet-db** du même réseau virtuel. Un itinéraire défini par l'utilisateur envoie tout le trafic de snet-app vers snet-db au travers d'une appliance virtuelle réseau (NVA) de pare-feu tierce pour inspection.

    Depuis l'ajout de l'itinéraire, les temps de réponse de la base de données ont doublé et le cluster Pacemaker de la base de données a basculé deux fois de façon inattendue.

    Vous avez besoin d'une configuration prise en charge par SAP sur Azure. Le trafic entre les deux sous-réseaux doit toujours être limité aux ports nécessaires.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Replace the third-party NVA with Azure Firewall Premium in the same path", fr: "Remplacer la NVA tierce par Pare-feu Azure Premium sur le même chemin" }
    - id: b
      text: { en: "Move the database VMs to a peered virtual network and filter the traffic on the peering", fr: "Déplacer les machines virtuelles de base de données vers un autre réseau virtuel relié par peering et filtrer le trafic sur le peering" }
    - id: c
      text: { en: "Remove the route and restrict the traffic with NSG rules that use application security groups", fr: "Supprimer l'itinéraire et limiter le trafic avec des règles NSG qui utilisent des groupes de sécurité d'application" }
    - id: d
      text: { en: "Enable accelerated networking on the NICs of the NVA and keep the route", fr: "Activer la mise en réseau accélérée sur les cartes réseau de la NVA et conserver l'itinéraire" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An NVA in the communication path between the SAP application layer and the DBMS layer isn't supported; it can double latency, restrict throughput and make Pacemaker clusters fail. The path must be direct. NSG and ASG rules don't count as an NVA and don't restrict performance, so they keep the traffic limited to the required ports.
    fr: |
      Une NVA sur le chemin de communication entre la couche d'applications SAP et la couche SGBD n'est pas prise en charge ; elle peut doubler la latence, limiter le débit et faire échouer les clusters Pacemaker. Le chemin doit être direct. Les règles NSG et ASG ne constituent pas une NVA et ne limitent pas les performances : elles maintiennent le trafic limité aux ports nécessaires.
  options:
    a: { en: "Azure Firewall in the path between the application and database layers is still a network virtual appliance in that path, which isn't supported.", fr: "Pare-feu Azure sur le chemin entre les couches d'applications et de base de données reste une appliance virtuelle réseau sur ce chemin, ce qui n'est pas pris en charge." }
    b: { en: "Splitting the application and DBMS layers into different virtual networks isn't supported, and peering traffic is billed; peering itself doesn't filter traffic.", fr: "Séparer les couches d'applications et SGBD dans des réseaux virtuels différents n'est pas pris en charge, et le trafic de peering est facturé ; le peering lui-même ne filtre pas le trafic." }
    d: { en: "Accelerated networking on the NVA doesn't remove the unsupported device from the path.", fr: "La mise en réseau accélérée sur la NVA ne retire pas l'appareil non pris en charge du chemin." }
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
