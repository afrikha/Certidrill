id: az120-4c-lama-sp-order
objective: "4.2.9"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs SAP LaMa 3.0 Enterprise Edition, with the latest support package, on an on-premises server. LaMa must manage the SAP systems in two Azure resource groups named **rg-sap-qas** and **rg-sap-dev**.

    You need to configure the SAP LaMa connector for Azure by using a service principal. The solution must follow the principle of least privilege.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam exécute SAP LaMa 3.0 Enterprise Edition, avec le dernier support package, sur un serveur local. LaMa doit gérer les systèmes SAP de deux groupes de ressources Azure nommés **rg-sap-qas** et **rg-sap-dev**.

    Vous devez configurer le connecteur SAP LaMa pour Azure avec un principal de service. La solution doit respecter le principe du moindre privilège.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: app, text: { en: "Create an app registration in Microsoft Entra ID and add a client secret.", fr: "Créer une inscription d'application dans Microsoft Entra ID et ajouter une clé secrète client." } }
    - { id: role, text: { en: "Assign the service principal the Contributor role on rg-sap-qas and rg-sap-dev.", fr: "Attribuer au principal de service le rôle Contributor sur rg-sap-qas et rg-sap-dev." } }
    - { id: adapter, text: { en: "In LaMa, add a Microsoft Azure Cloud Adapter with the application ID, the secret, the subscription ID and the tenant ID.", fr: "Dans LaMa, ajouter un Microsoft Azure Cloud Adapter avec l'ID d'application, le secret, l'ID d'abonnement et l'ID de locataire." } }
    - { id: test, text: { en: "Select Test Configuration in the cloud manager.", fr: "Sélectionner Test Configuration dans le gestionnaire de cloud." } }
    - { id: reader, text: { en: "Assign the service principal the Reader role on the subscription.", fr: "Attribuer au principal de service le rôle Reader sur l'abonnement." } }
    - { id: mi, text: { en: "Enable a system-assigned managed identity for the LaMa server and select Use Managed Identity.", fr: "Activer une identité managée affectée par le système pour le serveur LaMa et sélectionner Use Managed Identity." } }
answer:
  sequence: [ app, role, adapter, test ]
explanation:
  correct:
    en: |
      The service principal comes from an app registration: its application ID is the User Name and the client secret is the Password of the connector. It needs Contributor on each resource group that contains SAP systems that LaMa manages. You then add the Microsoft Azure Cloud Adapter under Infrastructure > Cloud Managers and validate it with Test Configuration, which lists the resource groups found.
    fr: |
      Le principal de service provient d'une inscription d'application : son ID d'application est le User Name et la clé secrète client est le Password du connecteur. Il a besoin de Contributor sur chaque groupe de ressources contenant des systèmes SAP gérés par LaMa. Vous ajoutez ensuite le Microsoft Azure Cloud Adapter sous Infrastructure > Cloud Managers et le validez avec Test Configuration, qui liste les groupes de ressources trouvés.
  options:
    reader: { en: "Reader can't deallocate VMs or copy disks, and the subscription is a broader scope than needed.", fr: "Reader ne peut ni libérer des machines virtuelles ni copier des disques, et l'abonnement est une étendue plus large que nécessaire." }
    mi: { en: "Managed identities apply when LaMa runs on an Azure VM; here it runs on-premises.", fr: "Les identités managées s'appliquent quand LaMa s'exécute sur une machine virtuelle Azure ; ici, il s'exécute en local." }
references:
  - title: Set up the SAP LaMa connector for Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/lama-installation
