id: az120-cs2a-ams-cluster
objective: "4.2.5"
type: multi
caseStudy: az120-cs2a-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to configure monitoring of the HANA Pacemaker cluster of HP1. The solution must meet the monitoring requirements.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer la supervision du cluster Pacemaker HANA de HP1. La solution doit respecter les exigences de supervision.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install the prometheus-ha_cluster_exporter package on each cluster node.", fr: "Installer le package prometheus-ha_cluster_exporter sur chaque nœud du cluster." } }
    - { id: b, text: { en: "Install Performance Co-Pilot and the pcp-pmda-hacluster package on each cluster node.", fr: "Installer Performance Co-Pilot et le package pcp-pmda-hacluster sur chaque nœud du cluster." } }
    - { id: c, text: { en: "Add one High-availability cluster (Pacemaker) provider for the cluster, with an endpoint on port 9664.", fr: "Ajouter un seul fournisseur High-availability cluster (Pacemaker) pour le cluster, avec un point de terminaison sur le port 9664." } }
    - { id: d, text: { en: "Add one High-availability cluster (Pacemaker) provider per node, with an endpoint on port 44322.", fr: "Ajouter un fournisseur High-availability cluster (Pacemaker) par nœud, avec un point de terminaison sur le port 44322." } }
    - { id: e, text: { en: "Install the Azure Monitor Agent and create a data collection rule for the cluster logs.", fr: "Installer l'agent Azure Monitor et créer une règle de collecte de données pour les journaux du cluster." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: On RHEL, the Pacemaker provider of Azure Monitor for SAP solutions reads cluster metrics from Performance Co-Pilot (PCP) with the pcp-pmda-hacluster agent, exposed by pmproxy on port 44322 (http://IP:44322/metrics?names=ha_cluster). You create the provider once for each cluster node.
    fr: Sur RHEL, le fournisseur Pacemaker d'Azure Monitor pour solutions SAP lit les métriques du cluster depuis Performance Co-Pilot (PCP) avec l'agent pcp-pmda-hacluster, exposé par pmproxy sur le port 44322 (http://IP:44322/metrics?names=ha_cluster). Vous créez le fournisseur une fois pour chaque nœud du cluster.
  options:
    a: { en: "ha_cluster_exporter is the agent used on SUSE Linux Enterprise Server, not on RHEL.", fr: "ha_cluster_exporter est l'agent utilisé sur SUSE Linux Enterprise Server, pas sur RHEL." }
    c: { en: "Port 9664 is the ha_cluster_exporter endpoint on SUSE, and the provider is added for each node.", fr: "Le port 9664 est le point de terminaison de ha_cluster_exporter sur SUSE, et le fournisseur est ajouté pour chaque nœud." }
    e: { en: "Azure Monitor for SAP solutions collects cluster status through its provider, not through Azure Monitor Agent data collection rules.", fr: "Azure Monitor pour solutions SAP collecte l'état du cluster par son fournisseur, pas par les règles de collecte de données de l'agent Azure Monitor." }
references:
  - title: Create a high-availability cluster provider for Azure Monitor for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/provider-ha-pacemaker-cluster
