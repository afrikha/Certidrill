id: az120-4b-ha-signal-mapping
objective: "4.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin runs a highly available SAP S/4HANA system on Azure: Pacemaker clusters on SUSE for ASCS/ERS and for SAP HANA, HANA System Replication between the database nodes, and Standard internal load balancers in front of each cluster. An Azure Monitor for SAP solutions resource is deployed.

    You need to choose a data source for each monitoring requirement.

    Which data source should you use for each requirement? To answer, drag the appropriate data sources to the correct requirements. Each data source may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin exécute un système SAP S/4HANA hautement disponible sur Azure : des clusters Pacemaker sur SUSE pour ASCS/ERS et pour SAP HANA, la réplication système HANA entre les nœuds de base de données, et des équilibreurs de charge internes Standard devant chaque cluster. Une ressource Azure Monitor pour solutions SAP est déployée.

    Vous devez choisir une source de données pour chaque exigence de supervision.

    Quelle source de données devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les sources de données appropriées vers les exigences correspondantes. Chaque source de données peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pcmk, text: { en: "Azure Monitor for SAP solutions, HA cluster (Pacemaker) provider", fr: "Azure Monitor pour solutions SAP, fournisseur de cluster HA (Pacemaker)" } }
    - { id: hana, text: { en: "Azure Monitor for SAP solutions, SAP HANA provider", fr: "Azure Monitor pour solutions SAP, fournisseur SAP HANA" } }
    - { id: lb, text: { en: "Load balancer Health Probe Status metric", fr: "Métrique Health Probe Status de l'équilibreur de charge" } }
    - { id: rh, text: "Resource Health" }
    - { id: os, text: { en: "Azure Monitor for SAP solutions, OS (Linux) provider", fr: "Azure Monitor pour solutions SAP, fournisseur Système d'exploitation (Linux)" } }
  targets:
    - id: t1
      text: { en: "Status of the SBD devices and Pacemaker location constraints", fr: "État des périphériques SBD et contraintes d'emplacement Pacemaker" }
    - id: t2
      text: { en: "Replication status between the primary and secondary HANA databases", fr: "État de la réplication entre les bases de données HANA principale et secondaire" }
    - id: t3
      text: { en: "Which backend VM answers the probe of the ASCS virtual IP", fr: "Machine virtuelle principale qui répond à la sonde de l'adresse IP virtuelle ASCS" }
    - id: t4
      text: { en: "Azure platform events that made a cluster VM unavailable", fr: "Événements de la plateforme Azure qui ont rendu une machine virtuelle du cluster indisponible" }
answer:
  mapping: { t1: pcmk, t2: hana, t3: lb, t4: rh }
explanation:
  correct:
    en: |
      The Pacemaker provider collects node, resource and SBD status, location constraints, quorum votes and ring status. HANA System Replication status comes from the SAP HANA provider. The load balancer's Health Probe Status metric, split by backend IP, shows which node answers the probe of the virtual IP. Resource Health reports Azure-side events that affected the availability of a VM.
    fr: |
      Le fournisseur Pacemaker collecte l'état des nœuds, des ressources et de SBD, les contraintes d'emplacement, les votes de quorum et l'état des anneaux. L'état de la réplication système HANA provient du fournisseur SAP HANA. La métrique Health Probe Status de l'équilibreur de charge, fractionnée par adresse IP principale, montre quel nœud répond à la sonde de l'adresse IP virtuelle. Resource Health signale les événements côté Azure qui ont affecté la disponibilité d'une machine virtuelle.
  options:
    os: { en: "The OS (Linux) provider collects CPU, memory, disk and network data of the hosts, not cluster or replication status.", fr: "Le fournisseur Système d'exploitation (Linux) collecte les données processeur, mémoire, disque et réseau des hôtes, pas l'état du cluster ni de la réplication." }
references:
  - title: What is Azure Monitor for SAP solutions?
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/about-azure-monitor-sap-solutions
  - title: Load Balancer Diagnostics - Azure Load Balancer
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-standard-diagnostics
