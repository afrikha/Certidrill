id: az120-4c-ams-architecture
objective: "4.2.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Tailspin deployed an Azure Monitor for SAP solutions resource named **ams-sap-weu** with a new Log Analytics workspace. Providers are configured for the SAP HANA databases and the SAP NetWeaver systems of the company.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin a déployé une ressource Azure Monitor pour solutions SAP nommée **ams-sap-weu** avec un nouvel espace de travail Log Analytics. Des fournisseurs sont configurés pour les bases de données SAP HANA et les systèmes SAP NetWeaver de l'entreprise.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The managed resource group of ams-sap-weu contains a key vault that stores provider information.
        fr: Le groupe de ressources managé d'ams-sap-weu contient un coffre de clés qui stocke les informations des fournisseurs.
    - id: s2
      text:
        en: You can create an alert rule from an alert template of the SAP HANA workbook and send notifications through an action group.
        fr: Vous pouvez créer une règle d'alerte à partir d'un modèle d'alerte du classeur SAP HANA et envoyer des notifications par un groupe d'actions.
    - id: s3
      text:
        en: ams-sap-weu collects the activity log of the monitored SAP virtual machines into the Log Analytics workspace.
        fr: ams-sap-weu collecte le journal d'activité des machines virtuelles SAP supervisées dans l'espace de travail Log Analytics.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: The managed resource group holds Azure Functions, a key vault (credentials and provider information), a storage account and, here, the Log Analytics workspace. Alert rules are created from the Alerts templates of a provider workbook, with a threshold, a provider instance and an action group. The service sends custom logs to Azure Monitor Logs; resource logs and activity logs aren't supported.
    fr: Le groupe de ressources managé contient Azure Functions, un coffre de clés (identifiants et informations des fournisseurs), un compte de stockage et, ici, l'espace de travail Log Analytics. Les règles d'alerte se créent à partir des modèles Alerts d'un classeur de fournisseur, avec un seuil, une instance de fournisseur et un groupe d'actions. Le service envoie des journaux personnalisés dans les Journaux Azure Monitor ; les journaux de ressources et le journal d'activité ne sont pas pris en charge.
references:
  - title: What is Azure Monitor for SAP solutions?
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/about-azure-monitor-sap-solutions
  - title: Configure alerts in Azure Monitor for SAP solutions in the Azure portal
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/get-alerts-portal
