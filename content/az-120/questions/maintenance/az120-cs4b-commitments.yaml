id: az120-cs4b-commitments
objective: "4.1.3"
type: dropdown
caseStudy: az120-cs4b-treyresearch
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a purchasing option for each group of VMs. The solution must meet the cost requirements and the disaster recovery requirements.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une option d'achat pour chaque groupe de machines virtuelles. La solution doit respecter les exigences de coût et les exigences de reprise d'activité.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      PRD VMs in West Europe: [[prd]]

      Sandbox VMs: [[sandbox]]

      Failover target for the PRD VMs in North Europe: [[dr]]
    fr: |
      Machines virtuelles de PRD dans West Europe : [[prd]]

      Machines virtuelles sandbox : [[sandbox]]

      Cible de basculement des machines virtuelles de PRD dans North Europe : [[dr]]
  slots:
    - id: prd
      options:
        - { id: p-ri, text: { en: "Azure reservations", fr: "Réservations Azure" } }
        - { id: p-sp, text: { en: "Azure savings plan for compute", fr: "Plan d'économies Azure pour le calcul" } }
        - { id: p-ocr, text: { en: "On-demand capacity reservation", fr: "Réservation de capacité à la demande" } }
        - { id: p-spot, text: { en: "Azure Spot Virtual Machines", fr: "Machines virtuelles Spot Azure" } }
    - id: sandbox
      options:
        - { id: s-ri, text: { en: "Azure reservations", fr: "Réservations Azure" } }
        - { id: s-sp, text: { en: "Azure savings plan for compute", fr: "Plan d'économies Azure pour le calcul" } }
        - { id: s-ocr, text: { en: "On-demand capacity reservation", fr: "Réservation de capacité à la demande" } }
        - { id: s-spot, text: { en: "Azure Spot Virtual Machines", fr: "Machines virtuelles Spot Azure" } }
    - id: dr
      options:
        - { id: d-ri, text: { en: "Azure reservations", fr: "Réservations Azure" } }
        - { id: d-sp, text: { en: "Azure savings plan for compute", fr: "Plan d'économies Azure pour le calcul" } }
        - { id: d-ocr, text: { en: "On-demand capacity reservation", fr: "Réservation de capacité à la demande" } }
        - { id: d-spot, text: { en: "Azure Spot Virtual Machines", fr: "Machines virtuelles Spot Azure" } }
answer:
  values: { prd: p-ri, sandbox: s-sp, dr: d-ocr }
explanation:
  correct:
    en: Reservations suit workloads that run continuously with no expected change of instance type, family or region, and they give the greatest savings when fully used, which matches the PRD VMs. A savings plan for compute applies to usage across VM families and regions up to the hourly commitment, so it fits the sandboxes that change families and move to North Europe. Site Recovery cannot guarantee VM capacity in the target region at failover; an on-demand capacity reservation group in North Europe that is used by the Site Recovery replication provides that capacity.
    fr: Les réservations conviennent aux charges de travail qui s'exécutent en continu sans changement prévu de type d'instance, de famille ni de région, et elles offrent les économies les plus importantes quand elles sont entièrement utilisées, ce qui correspond aux machines virtuelles de PRD. Un plan d'économies pour le calcul s'applique à l'utilisation de toutes les familles de machines virtuelles et de toutes les régions, jusqu'à l'engagement horaire ; il convient donc aux sandbox qui changent de famille et passent dans North Europe. Site Recovery ne peut pas garantir la capacité de machines virtuelles dans la région cible au moment du basculement ; un groupe de réservations de capacité à la demande dans North Europe utilisé par la réplication Site Recovery fournit cette capacité.
  options:
    p-sp: { en: "A savings plan works for PRD but gives less savings than fully used reservations for VMs whose size and region never change.", fr: "Un plan d'économies fonctionne pour PRD, mais il offre moins d'économies que des réservations entièrement utilisées pour des machines virtuelles dont la taille et la région ne changent jamais." }
    p-ocr: { en: "A capacity reservation is charged at the pay-as-you-go rate of the VM size and gives no discount by itself.", fr: "Une réservation de capacité est facturée au tarif paiement à l'utilisation de la taille de machine virtuelle et n'offre aucune remise à elle seule." }
    p-spot: { en: "Spot VMs can be evicted at any time, which is unacceptable for a production SAP system.", fr: "Les machines virtuelles Spot peuvent être évincées à tout moment, ce qui est inacceptable pour un système SAP de production." }
    s-ri: { en: "A reservation applies only to the chosen VM size group and region, so frequent family and region changes would leave it unused.", fr: "Une réservation ne s'applique qu'au groupe de tailles et à la région choisis ; les changements fréquents de famille et de région la laisseraient inutilisée." }
    d-ri: { en: "Reservations are a billing discount and provide no capacity guarantee in the failover region.", fr: "Les réservations sont une remise de facturation et n'offrent aucune garantie de capacité dans la région de basculement." }
    d-spot: { en: "Spot VMs offer no capacity guarantee and can be evicted, so they cannot secure failover capacity.", fr: "Les machines virtuelles Spot n'offrent aucune garantie de capacité et peuvent être évincées ; elles ne peuvent donc pas assurer la capacité de basculement." }
references:
  - title: Decide between a savings plan and a reservation - Microsoft Cost Management
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
  - title: Disaster Recovery overview and infrastructure guidelines for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-overview-guide
