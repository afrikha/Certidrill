id: az120-4c-acss-hana-ha
objective: "4.2.7"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Litware manages a distributed highly available SAP system named **LP1** as a Virtual Instance for SAP solutions (VIS). The ASCS and ERS instances run in a SUSE Pacemaker cluster with the `sap_vendor_cluster_connector` installed. The SAP HANA 2.0 database is a multitenant database container with two tenant databases, **LP1** and **LPX**, and uses HANA system replication managed by a Pacemaker cluster. `sapstartsrv` runs on all the virtual machines.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware gère un système SAP distribué à haute disponibilité nommé **LP1** en tant que Virtual Instance for SAP solutions (VIS). Les instances ASCS et ERS s'exécutent dans un cluster Pacemaker SUSE sur lequel `sap_vendor_cluster_connector` est installé. La base de données SAP HANA 2.0 est un conteneur de bases de données mutualisé comprenant deux bases de données de locataire, **LP1** et **LPX**, et utilise la réplication de système HANA gérée par un cluster Pacemaker. `sapstartsrv` s'exécute sur toutes les machines virtuelles.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: From the VIS, you can stop the tenant database LPX while the tenant database LP1 keeps running.
        fr: Depuis la VIS, vous pouvez arrêter la base de données de locataire LPX pendant que la base de données de locataire LP1 continue de s'exécuter.
    - id: s2
      text:
        en: The stop operation of the HANA database from the VIS runs only when the cluster maintenance mode is Disabled.
        fr: L'opération d'arrêt de la base de données HANA depuis la VIS ne s'exécute que lorsque le mode maintenance du cluster est Disabled.
    - id: s3
      text:
        en: When you stop LP1 from the VIS, the ASCS instance first fails over to the ERS node and then stops.
        fr: Quand vous arrêtez LP1 depuis la VIS, l'instance ASCS bascule d'abord vers le nœud ERS, puis s'arrête.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Stopping the HANA database from the VIS stops the whole HANA instance; a single tenant of a multitenant container can't be stopped. For a clustered HANA database, the stop operation requires the cluster maintenance mode to be Disabled (the start operation requires Enabled). Stopping an HA system from the VIS stops the instances gracefully in the right order, without a failover of the central services instance.
    fr: Arrêter la base de données HANA depuis la VIS arrête toute l'instance HANA ; un locataire seul d'un conteneur mutualisé ne peut pas être arrêté. Pour une base HANA en cluster, l'opération d'arrêt exige que le mode maintenance du cluster soit Disabled (l'opération de démarrage exige Enabled). Arrêter un système à haute disponibilité depuis la VIS arrête proprement les instances dans le bon ordre, sans basculement de l'instance des services centraux.
references:
  - title: Start and stop SAP systems, instances, and HANA database
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/start-stop-sap-systems
