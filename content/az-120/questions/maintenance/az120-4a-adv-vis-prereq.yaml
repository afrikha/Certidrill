id: az120-4a-adv-vis-prereq
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs an SAP S/4HANA system named **PR1** on Azure VMs. PR1 was installed manually with SAP Software Provisioning Manager, without Azure Center for SAP solutions. Azure Advisor shows only generic recommendations for the PR1 VMs, such as right-sizing.

    You need Azure Advisor to provide recommendations that check PR1 against SAP on Azure best practices, such as the high-availability load balancer settings and the HANA file system layout.

    What should you do first?
  fr: |
    Contoso exécute un système SAP S/4HANA nommé **PR1** sur des machines virtuelles Azure. PR1 a été installé manuellement avec SAP Software Provisioning Manager, sans Azure Center for SAP solutions. Azure Advisor n'affiche que des recommandations génériques pour les machines virtuelles de PR1, comme le redimensionnement.

    Vous devez faire en sorte qu'Azure Advisor fournisse des recommandations qui vérifient PR1 par rapport aux bonnes pratiques SAP sur Azure, comme les paramètres de l'équilibreur de charge de haute disponibilité et la disposition des systèmes de fichiers HANA.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Create an Azure Monitor for SAP solutions instance with a SAP HANA provider", fr: "Créer une instance Azure Monitor for SAP solutions avec un fournisseur SAP HANA" }
    - id: b
      text: { en: "Register PR1 in Azure Center for SAP solutions as a Virtual Instance for SAP solutions", fr: "Inscrire PR1 dans Azure Center for SAP solutions en tant que Virtual Instance for SAP solutions" }
    - id: c
      text: { en: "Enable VM insights on the PR1 VMs with a data collection rule", fr: "Activer VM Insights sur les machines virtuelles de PR1 avec une règle de collecte de données" }
    - id: d
      text: { en: "Install the Azure VM extension for SAP solutions on the PR1 VMs", fr: "Installer l'extension de machine virtuelle Azure pour les solutions SAP sur les machines virtuelles de PR1" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The SAP-specific quality checks run on Virtual Instance for SAP solutions (VIS) resources, so the system must be deployed with or registered in Azure Center for SAP solutions. Once PR1 is a VIS, more than 100 checks run hourly and their findings appear as Azure Advisor recommendations for the ASCS, application and database instances.
    fr: |
      Les contrôles qualité propres à SAP s'exécutent sur les ressources Virtual Instance for SAP solutions (VIS) ; le système doit donc être déployé avec Azure Center for SAP solutions ou inscrit dans ce service. Une fois PR1 devenu une VIS, plus de 100 contrôles s'exécutent toutes les heures et leurs résultats apparaissent comme recommandations Azure Advisor pour les instances ASCS, d'application et de base de données.
  options:
    a: { en: "Azure Monitor for SAP solutions collects monitoring data from providers; it doesn't generate the SAP best-practice recommendations in Advisor.", fr: "Azure Monitor for SAP solutions collecte des données de supervision auprès de fournisseurs ; il ne génère pas les recommandations de bonnes pratiques SAP dans Advisor." }
    c: { en: "VM insights shows guest performance and dependencies; it doesn't run SAP configuration checks.", fr: "VM Insights affiche les performances invitées et les dépendances ; il n'exécute pas de contrôles de configuration SAP." }
    d: { en: "The VM extension for SAP solutions provides host data to the SAP monitoring agent; it doesn't make Advisor run SAP quality checks.", fr: "L'extension de machine virtuelle pour les solutions SAP fournit des données de l'hôte à l'agent de supervision SAP ; elle ne déclenche pas les contrôles qualité SAP dans Advisor." }
references:
  - title: View quality checks and insights for a Virtual Instance for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/get-quality-checks-insights
