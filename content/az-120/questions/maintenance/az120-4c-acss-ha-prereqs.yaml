id: az120-4c-acss-ha-prereqs
objective: "4.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an existing highly available SAP NetWeaver system named **AP1**. The ASCS and ERS instances run in a Red Hat Enterprise Linux Pacemaker cluster. AP1 wasn't deployed by Azure Center for SAP solutions; you registered it as a Virtual Instance for SAP solutions (VIS) last week.

    The operators have the Azure Center for SAP solutions administrator role on the VIS. When they try to stop AP1 from the VIS, the operation fails.

    You need to make sure that the operators can stop and start AP1 from the VIS.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un système SAP NetWeaver à haute disponibilité existant nommé **AP1**. Les instances ASCS et ERS s'exécutent dans un cluster Pacemaker Red Hat Enterprise Linux. AP1 n'a pas été déployé par le Centre Azure pour les solutions SAP ; vous l'avez inscrit en tant que Virtual Instance for SAP solutions (VIS) la semaine dernière.

    Les opérateurs disposent du rôle Azure Center for SAP solutions administrator sur la VIS. Quand ils tentent d'arrêter AP1 depuis la VIS, l'opération échoue.

    Vous devez faire en sorte que les opérateurs puissent arrêter et démarrer AP1 depuis la VIS.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install the HA interface cluster connector `sap_vendor_cluster_connector` on the ASCS instance.", fr: "Installer le connecteur de cluster de l'interface HA `sap_vendor_cluster_connector` sur l'instance ASCS." } }
    - { id: b, text: { en: "Enable the maintenance mode of the ASCS and ERS cluster before each stop operation.", fr: "Activer le mode maintenance du cluster ASCS et ERS avant chaque opération d'arrêt." } }
    - { id: c, text: { en: "Make sure that `sapstartsrv` runs on every virtual machine of AP1.", fr: "Vérifier que `sapstartsrv` s'exécute sur chaque machine virtuelle d'AP1." } }
    - { id: d, text: { en: "Deploy Azure Monitor for SAP solutions and add an SAP NetWeaver provider for AP1.", fr: "Déployer Azure Monitor pour solutions SAP et ajouter un fournisseur SAP NetWeaver pour AP1." } }
    - { id: e, text: { en: "Assign the operators the Azure Center for SAP solutions reader role on the VIS.", fr: "Attribuer aux opérateurs le rôle Azure Center for SAP solutions reader sur la VIS." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Start and stop operations need `sapstartsrv` running on every VM of the system, and, for an HA system, the `sap_vendor_cluster_connector` installed on the ASCS instance so that SAP and the cluster cooperate. Systems deployed by Azure Center for SAP solutions get the connector during installation, but a registered system might not have it.
    fr: Les opérations de démarrage et d'arrêt exigent que `sapstartsrv` s'exécute sur chaque machine virtuelle du système et, pour un système à haute disponibilité, que `sap_vendor_cluster_connector` soit installé sur l'instance ASCS pour que SAP et le cluster coopèrent. Les systèmes déployés par le Centre Azure pour les solutions SAP reçoivent le connecteur à l'installation, mais un système inscrit peut ne pas l'avoir.
  options:
    b: { en: "Maintenance mode conditions apply to clustered HANA databases, and their stop requires the mode to be Disabled.", fr: "Les conditions de mode maintenance concernent les bases de données HANA en cluster, et leur arrêt exige que le mode soit Disabled." }
    d: { en: "Azure Monitor for SAP solutions collects telemetry; it isn't a prerequisite of start and stop.", fr: "Azure Monitor pour solutions SAP collecte de la télémétrie ; ce n'est pas un prérequis du démarrage et de l'arrêt." }
    e: { en: "The reader role only views VIS resources; the operators already have the administrator role.", fr: "Le rôle reader ne fait que consulter les ressources VIS ; les opérateurs ont déjà le rôle administrator." }
references:
  - title: Start and stop SAP systems, instances, and HANA database
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/start-stop-sap-systems
