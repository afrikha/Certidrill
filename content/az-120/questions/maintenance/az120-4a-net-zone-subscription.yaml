id: az120-4a-net-zone-subscription
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum measured network latency between availability zones in the West Europe region by using VMs deployed in a subscription named **Sub-Test**. Based on the results, Adatum decided to deploy its production SAP HANA cluster in zones 1 and 3.

    The production SAP system will be deployed in a different subscription named **Sub-Prod**, in the same region and the same Microsoft Entra tenant.

    You need to ensure that the production HANA cluster uses the zone pair with the lowest latency.

    What should you do before you deploy the production VMs?
  fr: |
    Adatum a mesuré la latence réseau entre les zones de disponibilité de la région Europe Ouest à l'aide de machines virtuelles déployées dans un abonnement nommé **Sub-Test**. D'après les résultats, Adatum a décidé de déployer son cluster SAP HANA de production dans les zones 1 et 3.

    Le système SAP de production sera déployé dans un autre abonnement nommé **Sub-Prod**, dans la même région et le même locataire Microsoft Entra.

    Vous devez vous assurer que le cluster HANA de production utilise la paire de zones qui présente la plus faible latence.

    Que devez-vous faire avant de déployer les machines virtuelles de production ?
body:
  options:
    - id: a
      text: { en: "Repeat the latency measurements with VMs deployed in Sub-Prod", fr: "Répéter les mesures de latence avec des machines virtuelles déployées dans Sub-Prod" }
    - id: b
      text: { en: "Peer the virtual networks of Sub-Prod and Sub-Test so that the results apply to both", fr: "Relier par peering les réseaux virtuels de Sub-Prod et de Sub-Test pour que les résultats s'appliquent aux deux" }
    - id: c
      text: { en: "Create a proximity placement group in Sub-Prod for zones 1 and 3", fr: "Créer dans Sub-Prod un groupe de placement de proximité pour les zones 1 et 3" }
    - id: d
      text: { en: "Deploy the production VMs in zones 1 and 3 because the tenant is the same", fr: "Déployer les machines virtuelles de production dans les zones 1 et 3, car le locataire est le même" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The mapping of zone numbers to physical zones is fixed per subscription, so measurements are valid only for the subscription in which they were taken. Zone 1 in Sub-Prod might not be the same physical zone as zone 1 in Sub-Test. You repeat the measurements in Sub-Prod, or compare the zone mappings of the two subscriptions, for example with the AvZone-Mapping script.
    fr: |
      Le mappage des numéros de zone vers les zones physiques est fixe par abonnement : les mesures ne valent que pour l'abonnement dans lequel elles ont été effectuées. La zone 1 de Sub-Prod n'est pas forcément la même zone physique que la zone 1 de Sub-Test. Vous répétez les mesures dans Sub-Prod, ou vous comparez les mappages de zones des deux abonnements, par exemple avec le script AvZone-Mapping.
  options:
    b: { en: "Peering connects networks; it doesn't change how zone numbers map to physical zones in each subscription.", fr: "Le peering relie des réseaux ; il ne modifie pas la façon dont les numéros de zone correspondent aux zones physiques dans chaque abonnement." }
    c: { en: "A proximity placement group collocates VMs for latency, but it doesn't identify which physical zones zones 1 and 3 of Sub-Prod are.", fr: "Un groupe de placement de proximité regroupe des machines virtuelles pour la latence, mais il n'indique pas quelles zones physiques correspondent aux zones 1 et 3 de Sub-Prod." }
    d: { en: "Zone mapping is per subscription, not per tenant, so the same numbers can point to different physical zones.", fr: "Le mappage des zones est défini par abonnement, et non par locataire : les mêmes numéros peuvent désigner des zones physiques différentes." }
references:
  - title: SAP workload configurations with Azure Availability Zones
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones
