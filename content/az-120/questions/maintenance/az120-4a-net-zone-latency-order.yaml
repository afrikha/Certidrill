id: az120-4a-net-zone-latency-order
objective: "4.1.2"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Litware plans to deploy a production SAP S/4HANA system across availability zones in an Azure region that has three zones. The SAP HANA database will use an active/passive cluster in two zones. Litware wants to base the choice of zones on measured network latency, as Microsoft recommends for SAP.

    You need to determine the zones for the database layer and the latency that the application layer will experience.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware prévoit de déployer un système SAP S/4HANA de production sur plusieurs zones de disponibilité dans une région Azure qui compte trois zones. La base de données SAP HANA utilisera un cluster actif/passif dans deux zones. Litware veut fonder le choix des zones sur la latence réseau mesurée, comme Microsoft le recommande pour SAP.

    Vous devez déterminer les zones de la couche de base de données et la latence que la couche d'applications subira.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: dbvms, text: { en: "Deploy one VM of the database VM size in each of the three zones, with accelerated networking enabled.", fr: "Déployer une machine virtuelle de la taille de la base de données dans chacune des trois zones, avec la mise en réseau accélérée activée." } }
    - { id: dbmeasure, text: { en: "Measure the latency between the three database-size VMs with niping.", fr: "Mesurer la latence entre les trois machines virtuelles de la taille de la base de données avec niping." } }
    - { id: pick, text: { en: "Select the two zones with the lowest latency between them for the database layer.", fr: "Sélectionner les deux zones qui présentent la plus faible latence entre elles pour la couche de base de données." } }
    - { id: appvms, text: { en: "Deploy one VM of the application server VM size in each of the three zones.", fr: "Déployer une machine virtuelle de la taille des serveurs d'applications dans chacune des trois zones." } }
    - { id: appmeasure, text: { en: "Measure the latency from the application-size VMs to the database-size VMs in the two selected zones.", fr: "Mesurer la latence entre les machines virtuelles de la taille des serveurs d'applications et les machines virtuelles de la taille de la base de données des deux zones sélectionnées." } }
    - { id: ping, text: { en: "Measure the latency between the three database-size VMs with ping.", fr: "Mesurer la latence entre les trois machines virtuelles de la taille de la base de données avec ping." } }
    - { id: ppg, text: { en: "Create one proximity placement group that contains the VMs of the three zones.", fr: "Créer un groupe de placement de proximité qui contient les machines virtuelles des trois zones." } }
answer:
  sequence: [ dbvms, dbmeasure, pick, appvms, appmeasure ]
explanation:
  correct:
    en: |
      Microsoft's procedure deploys the database VM SKU in all three zones with accelerated networking enabled and measures the latency between them with niping. You keep the two zones with the least latency for the database, then deploy three VMs of the application layer SKU across the zones and measure their latency against the two database VMs. The results drive the distribution of the application layer and the active/active or active/passive choice.
    fr: |
      La procédure de Microsoft déploie le SKU de machine virtuelle de la base de données dans les trois zones avec la mise en réseau accélérée activée, puis mesure la latence entre elles avec niping. Vous conservez pour la base de données les deux zones qui présentent la plus faible latence, puis vous déployez trois machines virtuelles du SKU de la couche d'applications dans les zones et mesurez leur latence par rapport aux deux machines virtuelles de base de données. Les résultats déterminent la répartition de la couche d'applications et le choix actif/actif ou actif/passif.
  options:
    ping: { en: "ping doesn't use the accelerated networking code paths, so Microsoft doesn't recommend it for these measurements.", fr: "ping n'utilise pas les chemins de code de la mise en réseau accélérée : Microsoft ne le recommande pas pour ces mesures." }
    ppg: { en: "A proximity placement group collocates VMs in one datacenter; it can't span three zones and isn't part of the measurement procedure.", fr: "Un groupe de placement de proximité regroupe des machines virtuelles dans un même centre de données ; il ne peut pas couvrir trois zones et ne fait pas partie de la procédure de mesure." }
references:
  - title: SAP workload configurations with Azure Availability Zones
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones
