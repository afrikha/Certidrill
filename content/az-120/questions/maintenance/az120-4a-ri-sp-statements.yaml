id: az120-4a-ri-sp-statements
objective: "4.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs SAP VMs on SUSE Linux Enterprise Server for SAP Applications pay-as-you-go images. Fabrikam owns Azure Reserved VM Instances for the database VMs and buys an Azure savings plan for compute with an hourly commitment, both with a shared scope.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam exécute des machines virtuelles SAP sur des images de paiement à l'utilisation SUSE Linux Enterprise Server for SAP Applications. Fabrikam possède des instances de machine virtuelle réservées Azure pour les machines virtuelles de base de données et achète un plan d'économies Azure pour le calcul avec un engagement horaire, tous deux avec une étendue partagée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When a reservation and the savings plan can both apply to the same VM usage, Azure applies the reservation first.
        fr: |
          Quand une réservation et le plan d'économies peuvent tous deux s'appliquer à la même utilisation de machine virtuelle, Azure applique d'abord la réservation.
    - id: s2
      text:
        en: |
          The part of the hourly commitment that isn't used in one hour is carried over to the next hour.
        fr: |
          La partie de l'engagement horaire qui n'est pas utilisée pendant une heure est reportée sur l'heure suivante.
    - id: s3
      text:
        en: |
          The savings plan also discounts the SUSE Linux Enterprise Server for SAP Applications software charges of the VMs.
        fr: |
          Le plan d'économies réduit aussi les frais logiciels SUSE Linux Enterprise Server for SAP Applications des machines virtuelles.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Because reservations are more restrictive and usually offer greater discounts, Azure applies reservation benefits before savings plan benefits. Each hour of a savings plan is use-it-or-lose-it and can't be rolled over. A savings plan for compute doesn't cover software, networking or storage charges.
    fr: |
      Comme les réservations sont plus restrictives et offrent généralement des remises plus importantes, Azure applique les avantages des réservations avant ceux des plans d'économies. Chaque heure d'un plan d'économies est perdue si elle n'est pas utilisée et ne peut pas être reportée. Un plan d'économies pour le calcul ne couvre pas les frais de logiciels, de réseau ni de stockage.
references:
  - title: How a savings plan discount is applied
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/discount-application
  - title: What are savings plans?
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/savings-plan-compute-overview
