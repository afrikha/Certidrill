id: az120-4c-ams-webmethods
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an SAP NetWeaver ABAP system named **FP1** on SUSE Linux Enterprise Server. FP1 has an ASCS instance and three application server instances.

    You add an SAP NetWeaver provider with the **SOAP** connection type to an Azure Monitor for SAP solutions resource. The NetWeaver workbook shows no data, and the provider reports the error `SOAPWebMethodsValidationFailed`.

    An administrator already set the `service/protectedwebmethods` parameter to the value documented by Microsoft in each instance profile by using transaction RZ10, and saved the profiles.

    You need the provider to collect data. The solution must minimize the downtime of FP1.

    What should you do next?
  fr: |
    Fabrikam dispose d'un système SAP NetWeaver ABAP nommé **FP1** sur SUSE Linux Enterprise Server. FP1 comprend une instance ASCS et trois instances de serveur d'applications.

    Vous ajoutez un fournisseur SAP NetWeaver de type de connexion **SOAP** à une ressource Azure Monitor pour solutions SAP. Le classeur NetWeaver n'affiche aucune donnée et le fournisseur signale l'erreur `SOAPWebMethodsValidationFailed`.

    Un administrateur a déjà défini le paramètre `service/protectedwebmethods` sur la valeur documentée par Microsoft dans chaque profil d'instance avec la transaction RZ10, puis a enregistré les profils.

    Vous devez faire en sorte que le fournisseur collecte des données. La solution doit réduire au minimum le temps d'arrêt de FP1.

    Que devez-vous faire ensuite ?
body:
  options:
    - id: a
      text: { en: "Run `sapcontrol -nr <instance number> -function RestartService` for each instance of FP1.", fr: "Exécuter `sapcontrol -nr <instance number> -function RestartService` pour chaque instance de FP1." }
    - id: b
      text: { en: "Stop and start the whole FP1 system from its Virtual Instance for SAP solutions.", fr: "Arrêter et démarrer tout le système FP1 depuis sa Virtual Instance for SAP solutions." }
    - id: c
      text: { en: "Change the connection type of the provider to SOAP + RFC.", fr: "Remplacer le type de connexion du fournisseur par SOAP + RFC." }
    - id: d
      text: { en: "Restart the Azure Functions app in the managed resource group.", fr: "Redémarrer l'application Azure Functions du groupe de ressources managé." }
answer: { optionId: a }
explanation:
  correct:
    en: The new value of `service/protectedwebmethods` takes effect only after `sapstartsrv` restarts. Restarting the SAPStartSRV service of each instance with `sapcontrol -function RestartService` doesn't stop the SAP system, so it meets the downtime requirement.
    fr: La nouvelle valeur de `service/protectedwebmethods` ne s'applique qu'après le redémarrage de `sapstartsrv`. Redémarrer le service SAPStartSRV de chaque instance avec `sapcontrol -function RestartService` n'arrête pas le système SAP, ce qui respecte l'exigence de temps d'arrêt.
  options:
    b: { en: "A full restart of FP1 also loads the parameter, but it causes downtime that restarting only SAPStartSRV avoids.", fr: "Un redémarrage complet de FP1 charge aussi le paramètre, mais il provoque un temps d'arrêt qu'un simple redémarrage de SAPStartSRV évite." }
    c: { en: "SOAP + RFC adds RFC metrics but still relies on the unprotected SAP Control web methods, which aren't active yet.", fr: "SOAP + RFC ajoute les métriques RFC mais repose toujours sur les méthodes web SAP Control déprotégées, qui ne sont pas encore actives." }
    d: { en: "The monitoring code isn't the problem: the SAP instances still reject the web method calls.", fr: "Le code de supervision n'est pas en cause : les instances SAP rejettent toujours les appels des méthodes web." }
references:
  - title: Configure SAP NetWeaver for Azure Monitor for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/provider-netweaver
