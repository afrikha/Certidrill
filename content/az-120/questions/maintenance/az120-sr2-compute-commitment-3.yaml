id: az120-sr2-compute-commitment-3
objective: "4.1.3"
type: series_yesno
series: az120-sr2-compute-commitment
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You buy Reserved VM Instances with a shared scope.
  fr: |
    Vous achetez des instances de machines virtuelles réservées avec une étendue partagée.
body:
  solution:
    en: |
      You purchase three-year **Reserved VM Instances** for 24 Standard_E32ds_v5 VMs in **West Europe**, and you set the reservation scope to **Shared** so that the discount applies to all the eligible subscriptions of the billing account.
    fr: |
      Vous achetez des **instances de machines virtuelles réservées** de trois ans pour 24 machines virtuelles Standard_E32ds_v5 dans **West Europe**, et vous définissez l'étendue de la réservation sur **Shared** pour que la remise s'applique à tous les abonnements éligibles du compte de facturation.
answer: { value: false }
explanation:
  correct:
    en: |
      The reservation scope only controls which subscriptions or resource groups receive the discount. The reservation still matches the region and instance family selected at purchase, so VMs of a newer series or in Sweden Central would not receive it.
    fr: |
      L'étendue de la réservation détermine seulement les abonnements ou groupes de ressources qui reçoivent la remise. La réservation correspond toujours à la région et à la famille d'instances choisies à l'achat : les machines virtuelles d'une série plus récente ou situées dans Sweden Central n'en bénéficieraient pas.
references:
  - title: What are Azure Reservations?
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/save-compute-costs-reservations
