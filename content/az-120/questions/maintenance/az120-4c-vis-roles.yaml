id: az120-4c-vis-roles
objective: "4.2.8"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware manages an SAP system named **LP2** as a Virtual Instance for SAP solutions (VIS) in Azure Center for SAP solutions.

    You need to grant access for each requirement. The solution must follow the principle of least privilege.

    Which role should you assign for each requirement? To answer, drag the appropriate roles to the correct requirements. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware gère un système SAP nommé **LP2** en tant que Virtual Instance for SAP solutions (VIS) dans le Centre Azure pour les solutions SAP.

    Vous devez accorder l'accès correspondant à chaque exigence. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer pour chaque exigence ? Pour répondre, faites glisser les rôles appropriés vers les exigences correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: admin, text: Azure Center for SAP solutions administrator }
    - { id: reader, text: Azure Center for SAP solutions reader }
    - { id: svc, text: Azure Center for SAP solutions service role }
    - { id: cost, text: Cost Management Reader }
    - { id: mio, text: Managed Identity Operator }
    - { id: contrib, text: Contributor }
  targets:
    - id: t1
      text: { en: "The finance team views the cost analysis of LP2", fr: "L'équipe financière consulte l'analyse des coûts de LP2" }
    - id: t2
      text: { en: "The auditors view the Quality Insights of LP2", fr: "Les auditeurs consultent les Quality Insights de LP2" }
    - id: t3
      text: { en: "The user-assigned managed identity that the service uses to manage LP2", fr: "L'identité managée affectée par l'utilisateur que le service utilise pour gérer LP2" }
    - id: t4
      text: { en: "The operators stop and start LP2 from the VIS", fr: "Les opérateurs arrêtent et démarrent LP2 depuis la VIS" }
answer:
  mapping: { t1: cost, t2: reader, t3: svc, t4: admin }
explanation:
  correct:
    en: Cost analysis of a VIS needs Cost Management Reader. Quality Insights needs only the Azure Center for SAP solutions reader role. The user-assigned managed identity receives the Azure Center for SAP solutions service role. Start and stop operations use the Azure Center for SAP solutions administrator role (or a custom role with the specific start and stop actions).
    fr: L'analyse des coûts d'une VIS exige Cost Management Reader. Quality Insights n'exige que le rôle Azure Center for SAP solutions reader. L'identité managée affectée par l'utilisateur reçoit le rôle Azure Center for SAP solutions service role. Les opérations de démarrage et d'arrêt utilisent le rôle Azure Center for SAP solutions administrator (ou un rôle personnalisé avec les actions de démarrage et d'arrêt spécifiques).
  options:
    mio: { en: "Managed Identity Operator lets a user assign an existing identity to a VIS; it doesn't grant access to the VIS.", fr: "Managed Identity Operator permet à un utilisateur d'affecter une identité existante à une VIS ; il ne donne pas accès à la VIS." }
    contrib: { en: "Contributor is broader than any of these requirements.", fr: "Contributor est plus large que chacune de ces exigences." }
references:
  - title: Azure RBAC for Azure Center for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/manage-with-azure-rbac
