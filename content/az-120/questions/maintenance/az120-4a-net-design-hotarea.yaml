id: az120-4a-net-design-hotarea
objective: "4.1.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Northwind is reviewing the network configuration of a production SAP ERP system that uses SAP HANA. Users report slow response times. The configuration is shown in the following table.

    Answer each prompt by selecting the value in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind examine la configuration réseau d'un système SAP ERP de production qui utilise SAP HANA. Les utilisateurs signalent des temps de réponse lents. La configuration est présentée dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la valeur dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The value that makes the configuration unsupported for SAP on Azure", fr: "La valeur qui rend la configuration non prise en charge pour SAP sur Azure" }
    - id: p2
      text: { en: "The value to change on the database side to reduce latency without changing the network topology", fr: "La valeur à modifier côté base de données pour réduire la latence sans modifier la topologie du réseau" }
  grid:
    header: [{ en: Component, fr: Composant }, { en: Setting, fr: Paramètre }, { en: Value, fr: Valeur }]
    rows:
      - [{ text: vnet-sap }, { text: { en: "Subnets", fr: "Sous-réseaux" } }, { text: { en: "snet-app 10.10.1.0/24, snet-db 10.10.2.0/24", fr: "snet-app 10.10.1.0/24, snet-db 10.10.2.0/24" }, area: v1 }]
      - [{ text: { en: "Route table of snet-app", fr: "Table de routage de snet-app" } }, { text: { en: "Route to 10.10.2.0/24", fr: "Itinéraire vers 10.10.2.0/24" } }, { text: { en: "Next hop: virtual appliance 10.10.0.4", fr: "Tronçon suivant : appliance virtuelle 10.10.0.4" }, area: v2 }]
      - [{ text: { en: "NSG of snet-db", fr: "NSG de snet-db" } }, { text: { en: "Inbound rule", fr: "Règle de trafic entrant" } }, { text: { en: "Allow asg-app to asg-hana, TCP 30013, 30015", fr: "Autoriser asg-app vers asg-hana, TCP 30013, 30015" }, area: v3 }]
      - [{ text: { en: "NICs of the application server VMs", fr: "Cartes réseau des machines virtuelles de serveur d'applications" } }, { text: { en: "Accelerated networking", fr: "Mise en réseau accélérée" } }, { text: { en: "Enabled", fr: "Activée" }, area: v4 }]
      - [{ text: { en: "NIC of the HANA VM", fr: "Carte réseau de la machine virtuelle HANA" } }, { text: { en: "Accelerated networking", fr: "Mise en réseau accélérée" } }, { text: { en: "Disabled", fr: "Désactivée" }, area: v5 }]
      - [{ text: { en: "All SAP VMs", fr: "Toutes les machines virtuelles SAP" } }, { text: { en: "Proximity placement group", fr: "Groupe de placement de proximité" } }, { text: { en: "None", fr: "Aucun" }, area: v6 }]
answer:
  values: { p1: v2, p2: v5 }
explanation:
  correct:
    en: |
      The route sends the traffic from the application subnet to the database subnet through a network virtual appliance, which isn't supported between the SAP application and DBMS layers. Accelerated networking should be enabled on all NICs of all SAP VMs where technically possible; it's disabled on the HANA VM. Subnets of one virtual network with NSG and ASG rules are the recommended design, and not using a proximity placement group is the default for most SAP systems.
    fr: |
      L'itinéraire envoie le trafic du sous-réseau d'applications vers le sous-réseau de base de données au travers d'une appliance virtuelle réseau, ce qui n'est pas pris en charge entre les couches d'applications et SGBD SAP. La mise en réseau accélérée doit être activée sur toutes les cartes réseau de toutes les machines virtuelles SAP quand c'est techniquement possible ; elle est désactivée sur la machine virtuelle HANA. Des sous-réseaux d'un même réseau virtuel avec des règles NSG et ASG constituent la conception recommandée, et ne pas utiliser de groupe de placement de proximité est la valeur par défaut pour la plupart des systèmes SAP.
  options:
    v3: { en: "NSG and ASG rules are allowed in the path and don't restrict performance.", fr: "Les règles NSG et ASG sont autorisées sur le chemin et ne limitent pas les performances." }
    v6: { en: "Proximity placement groups are used only when the default placement doesn't meet the latency requirement.", fr: "Les groupes de placement de proximité ne sont utilisés que si le placement par défaut ne répond pas à l'exigence de latence." }
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
