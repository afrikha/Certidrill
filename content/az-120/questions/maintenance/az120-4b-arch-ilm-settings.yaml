id: az120-4b-arch-ilm-settings
objective: "4.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin is creating a storage account named **sttaililm** to be used as the SAP ILM store for archive files from SAP S/4HANA. **Secure transfer required** is already enabled, and a registered application named **app-ilm** has the Storage Blob Data Contributor role on the account.

    You need to complete the configuration of sttaililm by following Microsoft's recommendations for the SAP ILM store.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin crée un compte de stockage nommé **sttaililm** qui servira de magasin SAP ILM pour les fichiers d'archive de SAP S/4HANA. **Transfert sécurisé requis** est déjà activé, et une application inscrite nommée **app-ilm** dispose du rôle Storage Blob Data Contributor sur le compte.

    Vous devez terminer la configuration de sttaililm en suivant les recommandations de Microsoft pour le magasin SAP ILM.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the minimum TLS version of the account to 1.2.", fr: "Définir la version TLS minimale du compte sur 1.2." } }
    - { id: b, text: { en: "Enable blob anonymous access so that SAP users can open attachments.", fr: "Activer l'accès anonyme aux objets blob pour que les utilisateurs SAP puissent ouvrir les pièces jointes." } }
    - { id: c, text: { en: "Disable storage account key access on the account.", fr: "Désactiver l'accès par clé de compte de stockage sur le compte." } }
    - { id: d, text: { en: "Assign Storage Blob Data Contributor to the SAP Basis team as well.", fr: "Attribuer également Storage Blob Data Contributor à l'équipe SAP Basis." } }
    - { id: e, text: { en: "Give the SAP system an account SAS signed with the account key.", fr: "Fournir au système SAP une SAS de compte signée avec la clé du compte." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Besides secure transfer, Microsoft recommends a minimum TLS version of 1.2, blob public access disabled and storage account key access disabled for the ILM store account. Access goes through the registered application with Storage Blob Data Contributor, and no other user should have access to the account.
    fr: |
      En plus du transfert sécurisé, Microsoft recommande pour le compte du magasin ILM une version TLS minimale 1.2, l'accès public aux objets blob désactivé et l'accès par clé de compte de stockage désactivé. L'accès passe par l'application inscrite dotée de Storage Blob Data Contributor, et aucun autre utilisateur ne doit avoir accès au compte.
  options:
    b: { en: "The guidance sets blob public access to disabled; archive data must not be anonymously readable.", fr: "Les recommandations désactivent l'accès public aux objets blob ; les données archivées ne doivent pas être lisibles anonymement." }
    d: { en: "The guidance says no user other than the registered application should have access to the account.", fr: "Les recommandations indiquent qu'aucun utilisateur autre que l'application inscrite ne doit avoir accès au compte." }
    e: { en: "An account SAS is signed with the account key, and key access is to be disabled; the application authenticates with Microsoft Entra ID instead.", fr: "Une SAS de compte est signée avec la clé du compte, or l'accès par clé doit être désactivé ; l'application s'authentifie plutôt avec Microsoft Entra ID." }
references:
  - title: SAP Information Lifecycle Management with Microsoft Azure Blob Storage
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-information-lifecycle-management
