id: az120-4b-net-tool-mapping
objective: "4.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs SAP S/4HANA in Azure. The network is connected to the on-premises datacenter, where the SAP router runs, by a site-to-site VPN. The operations team has the following troubleshooting tasks.

    Which Network Watcher tool should you use for each task? To answer, drag the appropriate tools to the correct tasks. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute SAP S/4HANA dans Azure. Le réseau est connecté au centre de données local, où s'exécute le routeur SAP, par un VPN de site à site. L'équipe d'exploitation doit effectuer les tâches de dépannage suivantes.

    Quel outil Network Watcher devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les outils appropriés vers les tâches correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pcap, text: { en: "Packet capture", fr: "Capture de paquets" } }
    - { id: conn, text: { en: "Connection troubleshoot", fr: "Résolution des problèmes de connexion" } }
    - { id: vpn, text: { en: "VPN troubleshoot", fr: "Résolution des problèmes VPN" } }
    - { id: esr, text: { en: "Effective security rules", fr: "Règles de sécurité effectives" } }
    - { id: nh, text: { en: "Next hop", fr: "Tronçon suivant" } }
    - { id: topo, text: { en: "Topology", fr: "Topologie" } }
  targets:
    - id: t1
      text: { en: "Record the packets exchanged between an application server and the HANA VM so that SAP Support can analyze them", fr: "Enregistrer les paquets échangés entre un serveur d'applications et la machine virtuelle HANA pour que le support SAP puisse les analyser" }
    - id: t2
      text: { en: "Test right now whether an application server VM can open a TCP connection to the HANA SQL port", fr: "Tester immédiatement si une machine virtuelle de serveur d'applications peut ouvrir une connexion TCP vers le port SQL HANA" }
    - id: t3
      text: { en: "Diagnose the virtual network gateway and its connection after the tunnel to the SAP router drops", fr: "Diagnostiquer la passerelle de réseau virtuel et sa connexion après la coupure du tunnel vers le routeur SAP" }
    - id: t4
      text: { en: "List all the security rules applied to the NIC of the ASCS VM, from both its NIC and subnet NSGs", fr: "Lister toutes les règles de sécurité appliquées à la carte réseau de la machine virtuelle ASCS, issues des NSG de sa carte réseau et de son sous-réseau" }
answer:
  mapping: { t1: pcap, t2: conn, t3: vpn, t4: esr }
explanation:
  correct:
    en: |
      Packet capture creates remote capture sessions on a VM or scale set. Connection troubleshoot tests a connection from a VM to a VM, FQDN, URI or IP address at a point in time, unlike connection monitor, which monitors over time. VPN troubleshoot diagnoses virtual network gateways and their connections. Effective security rules shows the rules applied to a network interface, its subnet and the aggregate of both.
    fr: |
      La capture de paquets crée des sessions de capture à distance sur une machine virtuelle ou un groupe identique. La résolution des problèmes de connexion teste une connexion d'une machine virtuelle vers une machine virtuelle, un FQDN, un URI ou une adresse IP à un instant donné, contrairement au moniteur de connexion, qui surveille dans la durée. La résolution des problèmes VPN diagnostique les passerelles de réseau virtuel et leurs connexions. Les règles de sécurité effectives montrent les règles appliquées à une interface réseau, à son sous-réseau et leur agrégat.
  options:
    nh: { en: "Next hop shows how traffic to a destination is routed; none of the tasks is a routing question.", fr: "Le tronçon suivant montre comment le trafic vers une destination est routé ; aucune tâche ne porte sur le routage." }
    topo: { en: "Topology visualizes the network resources and their relationships; it doesn't test, capture or list rules.", fr: "La topologie représente les ressources réseau et leurs relations ; elle ne teste rien, ne capture rien et ne liste pas de règles." }
references:
  - title: Azure Network Watcher Overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview
