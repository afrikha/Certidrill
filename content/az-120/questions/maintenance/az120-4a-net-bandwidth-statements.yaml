id: az120-4a-net-bandwidth-statements
objective: "4.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum runs an SAP HANA database on an Azure VM that has one NIC with accelerated networking enabled. During the nightly data loads, the outbound network throughput of the VM reaches the expected network bandwidth listed for the VM size. An engineer proposes several changes.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute une base de données SAP HANA sur une machine virtuelle Azure qui possède une carte réseau avec la mise en réseau accélérée activée. Pendant les chargements de données nocturnes, le débit réseau sortant de la machine virtuelle atteint la bande passante réseau attendue indiquée pour la taille de la machine virtuelle. Un ingénieur propose plusieurs modifications.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Adding a second NIC to the VM increases the outbound bandwidth available to the VM.
        fr: |
          Ajouter une deuxième carte réseau à la machine virtuelle augmente la bande passante sortante disponible pour la machine virtuelle.
    - id: s2
      text:
        en: |
          Accelerated networking raises the bandwidth limit of the VM above the value listed for its size.
        fr: |
          La mise en réseau accélérée relève la limite de bande passante de la machine virtuelle au-delà de la valeur indiquée pour sa taille.
    - id: s3
      text:
        en: |
          The bandwidth limit of the VM applies to the sum of the outbound traffic of all its NICs, whatever the destination.
        fr: |
          La limite de bande passante de la machine virtuelle s'applique à la somme du trafic sortant de toutes ses cartes réseau, quelle que soit la destination.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Azure limits the outbound bandwidth per VM, as the sum of the egress traffic across all its network interfaces, whatever the destination. Adding NICs doesn't increase it, and accelerated networking improves latency, throughput and CPU usage only up to the allocated bandwidth. To get more bandwidth, you need a VM size with a higher expected network bandwidth.
    fr: |
      Azure limite la bande passante sortante par machine virtuelle, comme somme du trafic sortant de toutes ses interfaces réseau, quelle que soit la destination. Ajouter des cartes réseau ne l'augmente pas, et la mise en réseau accélérée améliore la latence, le débit et l'utilisation du processeur uniquement jusqu'à la bande passante allouée. Pour obtenir plus de bande passante, il faut une taille de machine virtuelle avec une bande passante réseau attendue plus élevée.
references:
  - title: Virtual machine network bandwidth
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-machine-network-throughput
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
