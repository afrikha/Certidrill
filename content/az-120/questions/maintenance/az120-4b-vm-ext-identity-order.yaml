id: az120-4b-vm-ext-identity-order
objective: "4.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin deployed a new SAP application server VM named **vm-tp1-app03** on SUSE Linux Enterprise Server 15 SP5 by using an ARM template. The VM has no managed identity, and no version of the Azure VM extension for SAP solutions is installed. SAP Host Agent 7.22 is installed.

    You need to deploy the new version of the Azure VM extension for SAP solutions in the order that Microsoft documents, so that the SAP Host Agent reports Azure infrastructure data.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin a déployé une nouvelle machine virtuelle de serveur d'applications SAP nommée **vm-tp1-app03** sur SUSE Linux Enterprise Server 15 SP5 avec un modèle ARM. La machine virtuelle n'a pas d'identité managée, et aucune version de l'Azure VM extension for SAP solutions n'est installée. SAP Host Agent 7.22 est installé.

    Vous devez déployer la nouvelle version de l'Azure VM extension for SAP solutions dans l'ordre documenté par Microsoft, pour que le SAP Host Agent remonte les données de l'infrastructure Azure.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: identity, text: { en: "Enable a system-assigned managed identity on vm-tp1-app03.", fr: "Activer une identité managée affectée par le système sur vm-tp1-app03." } }
    - { id: reader, text: { en: "Assign the Reader role to the VM identity on the VM's resource group.", fr: "Attribuer le rôle Reader à l'identité de la machine virtuelle sur le groupe de ressources de la machine virtuelle." } }
    - { id: install, text: { en: "Run Set-AzVMAEMExtension with the -InstallNewExtension parameter.", fr: "Exécuter Set-AzVMAEMExtension avec le paramètre -InstallNewExtension." } }
    - { id: restart, text: { en: "Restart the SAP Host Agent on vm-tp1-app03.", fr: "Redémarrer le SAP Host Agent sur vm-tp1-app03." } }
    - { id: uninstall, text: { en: "Uninstall the standard version of the extension.", fr: "Désinstaller la version standard de l'extension." } }
    - { id: ama, text: { en: "Install the Azure Monitor Agent and associate a data collection rule.", fr: "Installer l'agent Azure Monitor et associer une règle de collecte de données." } }
    - { id: contrib, text: { en: "Assign the Contributor role to the VM identity on the subscription.", fr: "Attribuer le rôle Contributor à l'identité de la machine virtuelle sur l'abonnement." } }
answer:
  sequence: [ identity, reader, install, restart ]
explanation:
  correct:
    en: |
      The new version reads VM data through a managed identity, so the identity must exist before you can assign it the Reader role on the resource group (or on the individual disks and NICs). You then install the extension with Set-AzVMAEMExtension -InstallNewExtension, and restart the SAP Host Agent, which detects the extension only after a restart.
    fr: |
      La nouvelle version lit les données de la machine virtuelle via une identité managée : l'identité doit exister avant que vous puissiez lui attribuer le rôle Reader sur le groupe de ressources (ou sur les disques et cartes réseau individuels). Vous installez ensuite l'extension avec Set-AzVMAEMExtension -InstallNewExtension, puis vous redémarrez le SAP Host Agent, qui ne détecte l'extension qu'après un redémarrage.
  options:
    uninstall: { en: "No version of the extension is installed, so there's nothing to uninstall.", fr: "Aucune version de l'extension n'est installée : il n'y a rien à désinstaller." }
    ama: { en: "The Azure Monitor Agent isn't a prerequisite of the Azure VM extension for SAP solutions.", fr: "L'agent Azure Monitor n'est pas un prérequis de l'Azure VM extension for SAP solutions." }
    contrib: { en: "Reader is enough; Contributor on the subscription breaks least privilege.", fr: "Reader suffit ; Contributor sur l'abonnement enfreint le moindre privilège." }
references:
  - title: New version of Azure VM extension for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap-new
