id: az120-4a-st-disk-statements
objective: "4.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum is reviewing the managed disks of its SAP HANA VMs to reduce storage costs. Some VMs use Premium SSD disks with Write Accelerator on /hana/log, and new zonal VMs will use Premium SSD v2.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum examine les disques managés de ses machines virtuelles SAP HANA pour réduire les coûts de stockage. Certaines machines virtuelles utilisent des disques SSD Premium avec Write Accelerator sur /hana/log, et les nouvelles machines virtuelles zonales utiliseront SSD Premium v2.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The monthly cost of a Premium SSD disk depends on the amount of data stored on the disk.
        fr: |
          Le coût mensuel d'un disque SSD Premium dépend de la quantité de données stockées sur le disque.
    - id: s2
      text:
        en: |
          A Premium SSD v2 configuration for /hana/log meets the SAP HANA storage requirements without Write Accelerator.
        fr: |
          Une configuration SSD Premium v2 pour /hana/log respecte les exigences de stockage SAP HANA sans Write Accelerator.
    - id: s3
      text:
        en: |
          Credit-based bursting of a Premium SSD disk of 512 GiB or less can last up to 30 minutes.
        fr: |
          Le bursting à crédits d'un disque SSD Premium de 512 Gio ou moins peut durer jusqu'à 30 minutes.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Premium SSD is billed by the size category of the disk, independent of the data stored; for example, all disks from 513 to 1,024 GiB cost the same. Premium SSD v2 passes SAP HANA certification without Write Accelerator or other caches, and Write Accelerator isn't supported on it. Bursting is available for Premium SSD disks of 512 GiB or less and is limited to 30 minutes, so it can't replace sizing for long peaks.
    fr: |
      SSD Premium est facturé selon la catégorie de taille du disque, indépendamment des données stockées ; par exemple, tous les disques de 513 à 1 024 Gio coûtent le même prix. SSD Premium v2 obtient la certification SAP HANA sans Write Accelerator ni autre cache, et Write Accelerator n'y est pas pris en charge. Le bursting est disponible pour les disques SSD Premium de 512 Gio ou moins et est limité à 30 minutes : il ne remplace pas le dimensionnement pour de longs pics.
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
