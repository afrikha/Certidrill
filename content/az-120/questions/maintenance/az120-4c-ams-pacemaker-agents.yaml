id: az120-4c-ams-pacemaker-agents
objective: "4.2.5"
type: dropdown
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    Litware has two SAP HANA databases protected by Pacemaker clusters:

    | Cluster | Operating system | Nodes |
    | --- | --- | --- |
    | HN1 | SUSE Linux Enterprise Server for SAP 15 SP5 | 2 |
    | HN2 | Red Hat Enterprise Linux 8.8 | 2 |

    You need to monitor both clusters by using the high-availability cluster (Pacemaker) provider of an Azure Monitor for SAP solutions resource. All the metrics of every node must appear in the workbook.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose de deux bases de données SAP HANA protégées par des clusters Pacemaker :

    | Cluster | Système d'exploitation | Nœuds |
    | --- | --- | --- |
    | HN1 | SUSE Linux Enterprise Server for SAP 15 SP5 | 2 |
    | HN2 | Red Hat Enterprise Linux 8.8 | 2 |

    Vous devez superviser les deux clusters avec le fournisseur de cluster à haute disponibilité (Pacemaker) d'une ressource Azure Monitor pour solutions SAP. Toutes les métriques de chaque nœud doivent apparaître dans le classeur.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Install [[suse]] on each node of HN1.

      For each node of HN2, enter the endpoint [[rhel]] in the provider.

      Create [[count]] high-availability cluster providers in total.
    fr: |
      Installer [[suse]] sur chaque nœud de HN1.

      Pour chaque nœud de HN2, saisir le point de terminaison [[rhel]] dans le fournisseur.

      Créer [[count]] fournisseurs de cluster à haute disponibilité au total.
  slots:
    - id: suse
      options:
        - { id: pcp, text: "`pcp-pmda-hacluster`" }
        - { id: hce, text: "`prometheus-ha_cluster_exporter`" }
        - { id: node, text: "Prometheus node exporter" }
        - { id: conn, text: "`sap_vendor_cluster_connector`" }
    - id: rhel
      options:
        - { id: p9664, text: "`http://<IP>:9664/metrics`" }
        - { id: p9100, text: "`http://<IP>:9100/metrics`" }
        - { id: p44322, text: "`http://<IP>:44322/metrics?names=ha_cluster`" }
    - id: count
      options:
        - { id: c1, text: "1" }
        - { id: c2, text: "2" }
        - { id: c4, text: "4" }
answer:
  values: { suse: hce, rhel: p44322, count: c4 }
explanation:
  correct:
    en: On SUSE, the agent is the `prometheus-ha_cluster_exporter` package, which exposes metrics on port 9664. On Red Hat, the agent is Performance Co-Pilot with `pcp-pmda-hacluster`, reached at port 44322 with `?names=ha_cluster`. Each node needs its own provider to show all the metrics, so the two two-node clusters need four providers.
    fr: "Sur SUSE, l'agent est le package `prometheus-ha_cluster_exporter`, qui expose les métriques sur le port 9664. Sur Red Hat, l'agent est Performance Co-Pilot avec `pcp-pmda-hacluster`, joint sur le port 44322 avec `?names=ha_cluster`. Chaque nœud a besoin de son propre fournisseur pour afficher toutes les métriques : les deux clusters de deux nœuds exigent donc quatre fournisseurs."
  options:
    pcp: { en: "Performance Co-Pilot with pcp-pmda-hacluster is the Red Hat agent.", fr: "Performance Co-Pilot avec pcp-pmda-hacluster est l'agent de Red Hat." }
    node: { en: "Node exporter feeds the OS (Linux) provider, not the cluster provider.", fr: "Node exporter alimente le fournisseur de système d'exploitation (Linux), pas le fournisseur de cluster." }
    conn: { en: "The cluster connector lets SAP start and stop instances in a cluster; it doesn't expose metrics.", fr: "Le connecteur de cluster permet à SAP de démarrer et d'arrêter des instances dans un cluster ; il n'expose pas de métriques." }
    p9664: { en: "Port 9664 is the endpoint of the SUSE exporter.", fr: "Le port 9664 est le point de terminaison de l'exportateur SUSE." }
    c2: { en: "One provider per cluster doesn't show the metrics of every node.", fr: "Un fournisseur par cluster n'affiche pas les métriques de chaque nœud." }
references:
  - title: Create a high-availability Pacemaker cluster provider for Azure Monitor for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/provider-ha-pacemaker-cluster
