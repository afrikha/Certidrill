id: az120-4a-adv-resize-criteria
objective: "4.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind runs SAP NetWeaver application servers on Azure VMs. Azure Advisor shows a cost recommendation to change the size of one of the application server VMs. Before you act on the recommendation, you review which conditions Advisor applies when it selects the recommended size.

    Which two statements are true about the size that Advisor recommends?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind exécute des serveurs d'applications SAP NetWeaver sur des machines virtuelles Azure. Azure Advisor affiche une recommandation de coût pour changer la taille de l'une des machines virtuelles de serveur d'applications. Avant d'agir sur la recommandation, vous examinez les conditions qu'Advisor applique quand il sélectionne la taille recommandée.

    Quelles sont les deux affirmations vraies concernant la taille recommandée par Advisor ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "It's in the list of sizes that SAP supports for SAP NetWeaver on Azure.", fr: "Elle figure dans la liste des tailles prises en charge par SAP pour SAP NetWeaver sur Azure." }
    - id: b
      text: { en: "It has the same accelerated networking and Premium Storage capabilities as the current size.", fr: "Elle offre les mêmes capacités de mise en réseau accélérée et de stockage Premium que la taille actuelle." }
    - id: c
      text: { en: "It belongs to the same VM family as the current size.", fr: "Elle appartient à la même famille de machines virtuelles que la taille actuelle." }
    - id: d
      text: { en: "It's less expensive than the current size, based on retail rates.", fr: "Elle est moins chère que la taille actuelle, d'après les tarifs publics." }
    - id: e
      text: { en: "It's covered by the reservations that the subscription already owns.", fr: "Elle est couverte par les réservations que l'abonnement possède déjà." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Advisor recommends a size that keeps the accelerated networking and Premium Storage capabilities of the current size, is supported in the VM's region and is less expensive at retail rates. It doesn't check SAP support, so you must verify that the recommended size is supported for SAP before you resize.
    fr: |
      Advisor recommande une taille qui conserve les capacités de mise en réseau accélérée et de stockage Premium de la taille actuelle, qui est prise en charge dans la région de la machine virtuelle et qui est moins chère aux tarifs publics. Il ne vérifie pas la prise en charge par SAP : vous devez vérifier que la taille recommandée est prise en charge pour SAP avant de redimensionner.
  options:
    a: { en: "Advisor's criteria are utilization, capabilities, region and price; SAP support isn't one of them.", fr: "Les critères d'Advisor sont l'utilisation, les capacités, la région et le prix ; la prise en charge par SAP n'en fait pas partie." }
    c: { en: "The candidates include a smaller size in the same family, a newer version or a different family, for example D3v2 to E3v2.", fr: "Les candidates incluent une taille inférieure de la même famille, une version plus récente ou une autre famille, par exemple D3v2 vers E3v2." }
    e: { en: "The recommendations don't account for existing reservations or savings plans, so a change of series can increase the cost of VMs covered by a reservation.", fr: "Les recommandations ne tiennent pas compte des réservations ou des plans d'économies existants : un changement de série peut augmenter le coût de machines virtuelles couvertes par une réservation." }
references:
  - title: Optimize virtual machine (VM) or virtual machine scale set (VMSS) spend by resizing or shutting down underutilized instances
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-cost-recommendations
