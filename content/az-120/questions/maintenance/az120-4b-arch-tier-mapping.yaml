id: az120-4b-arch-tier-mapping
objective: "4.1.6"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Northwind runs SAP S/4HANA, SAP BW/4HANA on a scale-out SAP HANA system, and a native SAP HANA application, all on Azure VMs. Northwind wants to apply the data tiering options that Microsoft maps to each SAP solution.

    Which option should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind exécute SAP S/4HANA, SAP BW/4HANA sur un système SAP HANA en scale-out et une application SAP HANA native, tous sur des machines virtuelles Azure. Northwind veut appliquer les options de hiérarchisation des données que Microsoft associe à chaque solution SAP.

    Quelle option devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: nse, text: "SAP HANA Native Storage Extension (NSE)" }
    - { id: ext, text: { en: "SAP HANA extension node", fr: "Nœud d'extension SAP HANA" } }
    - { id: dt, text: "SAP HANA Dynamic Tiering 2.0" }
    - { id: iq, text: "SAP IQ" }
    - { id: di, text: { en: "SAP Data Intelligence with Azure Data Lake Storage", fr: "SAP Data Intelligence avec Azure Data Lake Storage" } }
  targets:
    - id: t1
      text: { en: "S/4HANA: move cold data out of HANA to a columnar database on Azure VMs", fr: "S/4HANA : sortir les données froides de HANA vers une base de données en colonnes sur des machines virtuelles Azure" }
    - id: t2
      text: { en: "BW/4HANA: keep warm data on a dedicated node of the scale-out system", fr: "BW/4HANA : conserver les données tièdes sur un nœud dédié du système en scale-out" }
    - id: t3
      text: { en: "Native HANA application: move cold data to low-cost storage through data pipelines", fr: "Application HANA native : déplacer les données froides vers un stockage économique au moyen de pipelines de données" }
    - id: t4
      text: { en: "S/4HANA: keep warm data in the database, loaded into memory only when accessed", fr: "S/4HANA : conserver les données tièdes dans la base, chargées en mémoire uniquement lors de l'accès" }
answer:
  mapping: { t1: iq, t2: ext, t3: di, t4: nse }
explanation:
  correct:
    en: |
      For S/4HANA, Microsoft maps the warm tier to NSE (data aging via NSE) and the cold tier to SAP IQ, a columnar database deployed on Azure VMs. For BW/4HANA, an extension node keeps warm data on a dedicated node of a scale-out system. For native HANA, cold data goes through data lifecycle management with SAP Data Intelligence pipelines to Azure Data Lake Storage. Dynamic Tiering is a warm option for native HANA only, so it fits none of these requirements.
    fr: |
      Pour S/4HANA, Microsoft associe le niveau tiède à NSE (data aging via NSE) et le niveau froid à SAP IQ, une base de données en colonnes déployée sur des machines virtuelles Azure. Pour BW/4HANA, un nœud d'extension conserve les données tièdes sur un nœud dédié d'un système en scale-out. Pour HANA natif, les données froides passent par la gestion du cycle de vie des données avec des pipelines SAP Data Intelligence vers Azure Data Lake Storage. Dynamic Tiering est une option tiède réservée à HANA natif ; il ne correspond donc à aucune de ces exigences.
  options:
    dt: { en: "Dynamic Tiering is a warm-tier option for native HANA and isn't supported by S/4HANA or BW.", fr: "Dynamic Tiering est une option de niveau tiède pour HANA natif, non prise en charge par S/4HANA ni par BW." }
references:
  - title: Managing SAP HANA data footprint for balancing cost and performance
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-tiering-guidance
