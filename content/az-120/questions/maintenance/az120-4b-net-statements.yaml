id: az120-4b-net-statements
objective: "4.2.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove is reviewing the network monitoring of its SAP landscape in the virtual network **VNET-SAP-NE** (North Europe). The team plans to use flow logs and connection monitor in Network Watcher.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove examine la supervision réseau de son paysage SAP dans le réseau virtuel **VNET-SAP-NE** (North Europe). L'équipe prévoit d'utiliser les journaux de flux et le moniteur de connexion de Network Watcher.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Woodgrove can create an NSG flow log for a network security group that it creates today.
        fr: Woodgrove peut créer un journal de flux NSG pour un groupe de sécurité réseau qu'il crée aujourd'hui.
    - id: s2
      text:
        en: The storage account that stores the virtual network flow logs of VNET-SAP-NE must be in North Europe.
        fr: Le compte de stockage qui stocke les journaux de flux de réseau virtuel de VNET-SAP-NE doit se trouver en North Europe.
    - id: s3
      text:
        en: The HANA VM used as the destination of a connection monitor test needs the Network Watcher Agent extension.
        fr: La machine virtuelle HANA utilisée comme destination d'un test de moniteur de connexion a besoin de l'extension Network Watcher Agent.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      NSG flow logs retire on September 30, 2027 and no longer support new creations; virtual network flow logs replace them. The storage account for virtual network flow logs must be in the same region as the virtual network (and in the same subscription or one in the same Microsoft Entra tenant). In connection monitor, only Azure VM sources need the Network Watcher Agent extension; destination endpoints don't.
    fr: |
      Les journaux de flux NSG sont mis hors service le 30 septembre 2027 et n'acceptent plus de nouvelles créations ; les journaux de flux de réseau virtuel les remplacent. Le compte de stockage des journaux de flux de réseau virtuel doit se trouver dans la même région que le réseau virtuel (et dans le même abonnement ou un abonnement du même locataire Microsoft Entra). Dans le moniteur de connexion, seules les sources de type machine virtuelle Azure ont besoin de l'extension Network Watcher Agent ; les points de terminaison de destination n'en ont pas besoin.
references:
  - title: Virtual Network Flow Logs - Azure Network Watcher
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
  - title: Connection Monitor Overview - Azure Network Watcher
    url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview
