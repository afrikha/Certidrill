id: az120-4a-rs-metric-diagnosis
objective: "4.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs an SAP HANA database on a zonal Azure VM. The /hana/log volume is on a Premium SSD v2 disk attached at LUN 0. The /hana/data volume is on two Premium SSD v2 disks attached at LUN 1 and LUN 2. Users report slow commits during peak hours. You collect the following metrics during a peak:

    - VM Cached IOPS Consumed Percentage: 30%
    - VM Uncached IOPS Consumed Percentage: 55%
    - VM Uncached Bandwidth Consumed Percentage: 48%
    - Data Disk IOPS Consumed Percentage, split by LUN: LUN 0 at 100%, LUN 1 at 35%, LUN 2 at 33%

    You need to identify the bottleneck and remove it at the lowest cost.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam exécute une base de données SAP HANA sur une machine virtuelle Azure zonale. Le volume /hana/log se trouve sur un disque SSD Premium v2 attaché au LUN 0. Le volume /hana/data se trouve sur deux disques SSD Premium v2 attachés aux LUN 1 et LUN 2. Les utilisateurs signalent des validations lentes aux heures de pointe. Vous collectez les métriques suivantes pendant un pic :

    - VM Cached IOPS Consumed Percentage : 30 %
    - VM Uncached IOPS Consumed Percentage : 55 %
    - VM Uncached Bandwidth Consumed Percentage : 48 %
    - Data Disk IOPS Consumed Percentage, fractionnée par LUN : LUN 0 à 100 %, LUN 1 à 35 %, LUN 2 à 33 %

    Vous devez identifier le goulot d'étranglement et le supprimer au moindre coût.

    Comment devez-vous compléter les phrases ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The I/O bottleneck is [[b]].
      To remove it, you should [[a]].
    fr: |
      Le goulot d'étranglement des E/S est [[b]].
      Pour le supprimer, vous devez [[a]].
  slots:
    - id: b
      options:
        - { id: vmuncached, text: { en: "the uncached IOPS limit of the VM", fr: "la limite d'IOPS non mises en cache de la machine virtuelle" } }
        - { id: vmcached, text: { en: "the cached IOPS limit of the VM", fr: "la limite d'IOPS mises en cache de la machine virtuelle" } }
        - { id: lun0, text: { en: "the IOPS limit of the disk at LUN 0", fr: "la limite d'IOPS du disque au LUN 0" } }
        - { id: osdisk, text: { en: "the IOPS limit of the OS disk", fr: "la limite d'IOPS du disque du système d'exploitation" } }
    - id: a
      options:
        - { id: iops, text: { en: "increase the provisioned IOPS of the disk at LUN 0", fr: "augmenter les IOPS provisionnées du disque au LUN 0" } }
        - { id: resize, text: { en: "resize the VM to the next larger size", fr: "redimensionner la machine virtuelle vers la taille immédiatement supérieure" } }
        - { id: cache, text: { en: "enable read/write host caching on the disk at LUN 0", fr: "activer la mise en cache de l'hôte en lecture/écriture sur le disque au LUN 0" } }
        - { id: datadisk, text: { en: "add a third disk to the /hana/data volume", fr: "ajouter un troisième disque au volume /hana/data" } }
answer:
  values: { b: lun0, a: iops }
explanation:
  correct:
    en: |
      When the metric is split by LUN, the log disk at LUN 0 reaches 100% of its IOPS limit while the VM-level metrics stay around 50%, so the disk is the bottleneck, not the VM. Premium SSD v2 lets you raise the provisioned IOPS of that disk alone, without changing its capacity or the VM size.
    fr: |
      Quand la métrique est fractionnée par LUN, le disque de journaux au LUN 0 atteint 100 % de sa limite d'IOPS alors que les métriques de la machine virtuelle restent autour de 50 % : le goulot d'étranglement est le disque, pas la machine virtuelle. SSD Premium v2 permet d'augmenter les IOPS provisionnées de ce seul disque, sans modifier sa capacité ni la taille de la machine virtuelle.
  options:
    vmuncached: { en: "At 55%, the VM uncached limit still has headroom.", fr: "À 55 %, la limite non mise en cache de la machine virtuelle dispose encore d'une marge." }
    resize: { en: "A larger VM raises VM limits that aren't reached and costs more; the disk limit stays the same.", fr: "Une machine virtuelle plus grande relève des limites de machine virtuelle qui ne sont pas atteintes et coûte plus cher ; la limite du disque reste la même." }
    cache: { en: "Premium SSD v2 doesn't support host caching.", fr: "SSD Premium v2 ne prend pas en charge la mise en cache de l'hôte." }
    datadisk: { en: "The data disks aren't saturated; the commits wait on the log disk.", fr: "Les disques de données ne sont pas saturés ; les validations attendent le disque de journaux." }
references:
  - title: Disk performance metrics
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-metrics
  - title: Select a disk type for Azure IaaS VMs - managed disks
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types
