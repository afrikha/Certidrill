id: az120-4a-ri-refund
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove is decommissioning an SAP BW system that runs on Azure VMs. The following commitments were bought for the system:

    - Three-year Azure Reserved VM Instances for the M-series database VMs
    - An Azure savings plan for compute that covers the application servers
    - A SUSE Linux software plan for the VMs
    - A Red Hat plan for a VM that runs SAP Web Dispatcher

    You need to recover part of the money spent on the commitments.

    Which commitment can you return for a prorated refund?
  fr: |
    Woodgrove met hors service un système SAP BW qui s'exécute sur des machines virtuelles Azure. Les engagements suivants ont été achetés pour le système :

    - Des instances de machine virtuelle réservées Azure de trois ans pour les machines virtuelles de base de données de la série M
    - Un plan d'économies Azure pour le calcul qui couvre les serveurs d'applications
    - Un plan logiciel SUSE Linux pour les machines virtuelles
    - Un plan Red Hat pour une machine virtuelle qui exécute SAP Web Dispatcher

    Vous devez récupérer une partie de l'argent consacré aux engagements.

    Quel engagement pouvez-vous retourner pour un remboursement au prorata ?
body:
  options:
    - id: a
      text: { en: "The savings plan for compute", fr: "Le plan d'économies pour le calcul" }
    - id: b
      text: { en: "The SUSE Linux software plan", fr: "Le plan logiciel SUSE Linux" }
    - id: c
      text: { en: "The Red Hat plan", fr: "Le plan Red Hat" }
    - id: d
      text: { en: "The Reserved VM Instances", fr: "Les instances de machine virtuelle réservées" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure reservations can be returned for a refund based on the remaining days of the term, within a limit of USD 50,000 of canceled commitment per rolling 12-month window. No early termination fee is currently charged.
    fr: |
      Les réservations Azure peuvent être retournées pour un remboursement calculé sur les jours restants de la durée, dans la limite de 50 000 USD d'engagement annulé par période glissante de 12 mois. Aucuns frais de résiliation anticipée ne sont actuellement facturés.
  options:
    a: { en: "A savings plan can't be canceled or refunded.", fr: "Un plan d'économies ne peut être ni annulé ni remboursé." }
    b: { en: "SUSE Linux plans aren't eligible for exchange or refund.", fr: "Les plans SUSE Linux ne sont éligibles ni à l'échange ni au remboursement." }
    c: { en: "Red Hat plans aren't eligible for exchange or refund.", fr: "Les plans Red Hat ne sont éligibles ni à l'échange ni au remboursement." }
references:
  - title: Self-service exchanges and refunds for Azure Reservations
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/exchange-and-refund-azure-reservations
