id: az120-4a-net-accel-cli
objective: "4.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an SAP HANA VM named **vm-hana01** in a resource group named **rg-sap-prd**. The VM has one NIC named **nic-hana01** with accelerated networking disabled. The VM size and the OS image support accelerated networking. The VM isn't in an availability set.

    You need to enable accelerated networking on the NIC by using the Azure CLI.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'une machine virtuelle SAP HANA nommée **vm-hana01** dans un groupe de ressources nommé **rg-sap-prd**. La machine virtuelle possède une carte réseau nommée **nic-hana01** dont la mise en réseau accélérée est désactivée. La taille de la machine virtuelle et l'image du système d'exploitation prennent en charge la mise en réseau accélérée. La machine virtuelle ne fait pas partie d'un groupe à haute disponibilité.

    Vous devez activer la mise en réseau accélérée sur la carte réseau à l'aide d'Azure CLI.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az vm [[s1]] --resource-group rg-sap-prd --name vm-hana01
    az network [[s2]] --resource-group rg-sap-prd --name nic-hana01 \
      --accelerated-networking [[s3]]
    az vm start --resource-group rg-sap-prd --name vm-hana01
  slots:
    - id: s1
      options:
        - { id: restart, text: restart }
        - { id: deallocate, text: deallocate }
        - { id: redeploy, text: redeploy }
        - { id: reapply, text: reapply }
    - id: s2
      options:
        - { id: ipconfig, text: "nic ip-config update" }
        - { id: nicupdate, text: "nic update" }
        - { id: niccreate, text: "nic create" }
    - id: s3
      options:
        - { id: t, text: "true" }
        - { id: f, text: "false" }
answer:
  values: { s1: deallocate, s2: nicupdate, s3: t }
explanation:
  correct:
    en: |
      The VM must be stopped or deallocated before you can enable accelerated networking on its NIC. Accelerated networking is a property of the network interface, set with az network nic update --accelerated-networking true; you then start the VM so that the virtual function appears in the guest.
    fr: |
      La machine virtuelle doit être arrêtée ou libérée avant que vous puissiez activer la mise en réseau accélérée sur sa carte réseau. La mise en réseau accélérée est une propriété de l'interface réseau, définie avec az network nic update --accelerated-networking true ; vous démarrez ensuite la machine virtuelle pour que la fonction virtuelle apparaisse dans l'invité.
  options:
    restart: { en: "A restart keeps the VM running on its host; the NIC setting can't be changed while the VM runs.", fr: "Un redémarrage laisse la machine virtuelle en cours d'exécution sur son hôte ; le paramètre de la carte réseau ne peut pas être modifié pendant que la machine virtuelle s'exécute." }
    redeploy: { en: "Redeploy moves a running VM to a new host and starts it again; it doesn't leave it stopped for the NIC change.", fr: "Redeploy déplace une machine virtuelle vers un nouvel hôte et la redémarre ; elle ne reste pas arrêtée pour la modification de la carte réseau." }
    ipconfig: { en: "IP configuration settings cover addresses and backend pools, not accelerated networking, which is set on the NIC itself.", fr: "Les paramètres de configuration IP portent sur les adresses et les pools principaux, pas sur la mise en réseau accélérée, qui se définit sur la carte réseau elle-même." }
references:
  - title: Manage accelerated networking for Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-network/manage-accelerated-networking
