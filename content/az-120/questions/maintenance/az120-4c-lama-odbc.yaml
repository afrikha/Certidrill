id: az120-4c-lama-odbc
objective: "4.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs an SAP NetWeaver ABAP system with Microsoft SQL Server on Windows Server virtual machines in Azure. The company uses SAP LaMa with the Azure connector to relocate application server instances to new target VMs. SAP Host Agent and SAP Adaptive Extensions are installed on the target VMs.

    A relocation of an application server instance fails at the `checkClient` step on a target VM.

    What should you install on the target VM?
  fr: |
    Proseware exécute un système SAP NetWeaver ABAP avec Microsoft SQL Server sur des machines virtuelles Windows Server dans Azure. L'entreprise utilise SAP LaMa avec le connecteur Azure pour déplacer des instances de serveur d'applications vers de nouvelles machines virtuelles cibles. SAP Host Agent et SAP Adaptive Extensions sont installés sur les machines virtuelles cibles.

    Le déplacement d'une instance de serveur d'applications échoue à l'étape `checkClient` sur une machine virtuelle cible.

    Que devez-vous installer sur la machine virtuelle cible ?
body:
  options:
    - { id: a, text: { en: "The Azure VM extension for SAP solutions", fr: "L'Azure VM extension for SAP solutions" } }
    - { id: b, text: { en: "A supported Microsoft ODBC Driver for SQL Server", fr: "Un Microsoft ODBC Driver for SQL Server pris en charge" } }
    - { id: c, text: { en: "The Azure Monitor Agent", fr: "L'agent Azure Monitor" } }
    - { id: d, text: { en: "SQL Server Management Studio", fr: "SQL Server Management Studio" } }
answer: { optionId: b }
explanation:
  correct:
    en: Every VM used as a target for application server relocation or system copy of a SQL Server-based system needs a supported Microsoft ODBC Driver for SQL Server. A `checkClient` failure during the application server installation is fixed by installing this driver on the VM.
    fr: Chaque machine virtuelle utilisée comme cible de déplacement de serveur d'applications ou de copie de système d'un système basé sur SQL Server a besoin d'un Microsoft ODBC Driver for SQL Server pris en charge. Un échec de `checkClient` pendant l'installation du serveur d'applications se corrige en installant ce pilote sur la machine virtuelle.
  options:
    a: { en: "The extension provides Azure infrastructure metrics to SAP support; it isn't a database client.", fr: "L'extension fournit des métriques d'infrastructure Azure au support SAP ; ce n'est pas un client de base de données." }
    c: { en: "The Azure Monitor Agent collects guest monitoring data and doesn't connect SAP to SQL Server.", fr: "L'agent Azure Monitor collecte des données de supervision de l'invité et ne connecte pas SAP à SQL Server." }
    d: { en: "Management Studio is an administration tool, not the ODBC client that the SAP kernel uses.", fr: "Management Studio est un outil d'administration, pas le client ODBC qu'utilise le noyau SAP." }
references:
  - title: Set up the SAP LaMa connector for Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/lama-installation
