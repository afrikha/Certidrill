id: az120-4c-ams-hana-provider
objective: "4.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs a production SAP BW/4HANA system on an SAP HANA 2.0 SPS 07 multitenant database container. The container has SYSTEMDB and one tenant database named **BWP**.

    You need to add an SAP HANA provider to an Azure Monitor for SAP solutions resource. The solution must follow Microsoft recommendations and the principle of least privilege.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute un système SAP BW/4HANA de production sur un conteneur de bases de données mutualisé SAP HANA 2.0 SPS 07. Le conteneur comprend SYSTEMDB et une base de données de locataire nommée **BWP**.

    Vous devez ajouter un fournisseur SAP HANA à une ressource Azure Monitor pour solutions SAP. La solution doit respecter les recommandations de Microsoft et le principe du moindre privilège.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the Database tenant field of the provider to SYSTEMDB.", fr: "Définir le champ Database tenant du fournisseur sur SYSTEMDB." } }
    - { id: b, text: { en: "Set the Database tenant field of the provider to BWP.", fr: "Définir le champ Database tenant du fournisseur sur BWP." } }
    - { id: c, text: { en: "Use the SYSTEM database user in the provider.", fr: "Utiliser l'utilisateur de base de données SYSTEM dans le fournisseur." } }
    - { id: d, text: { en: "Create a dedicated database user that has the MONITORING role.", fr: "Créer un utilisateur de base de données dédié qui dispose du rôle MONITORING." } }
    - { id: e, text: { en: "Install the Prometheus node exporter on the HANA virtual machine.", fr: "Installer Prometheus node exporter sur la machine virtuelle HANA." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Microsoft recommends connecting the HANA provider to SYSTEMDB, because tenant databases lack some monitoring views. The provider needs a dedicated HANA user with the MONITORING or BACKUP CATALOG READ role; the SYSTEM user is suggested only for nonproduction instances.
    fr: Microsoft recommande de connecter le fournisseur HANA à SYSTEMDB, car certaines vues de supervision manquent dans les bases de données de locataire. Le fournisseur a besoin d'un utilisateur HANA dédié doté du rôle MONITORING ou BACKUP CATALOG READ ; l'utilisateur SYSTEM n'est suggéré que pour les instances hors production.
  options:
    b: { en: "A tenant database lacks some of the monitoring views that the provider reads.", fr: "Une base de données de locataire ne contient pas certaines des vues de supervision que lit le fournisseur." }
    c: { en: "SYSTEM has far more privileges than monitoring needs and is suggested only outside production.", fr: "SYSTEM a bien plus de privilèges que ce qu'exige la supervision et n'est suggéré qu'hors production." }
    e: { en: "Node exporter is the prerequisite of the OS (Linux) provider, not of the SAP HANA provider.", fr: "Node exporter est le prérequis du fournisseur de système d'exploitation (Linux), pas du fournisseur SAP HANA." }
references:
  - title: Configure SAP HANA provider for Azure Monitor for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/provider-hana
