id: az120-4b-vm-ext-after-install
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs SAP on an Azure VM named **vm-ap1-db** in the resource group **rg-sap-ap1**. The VM has a system-assigned managed identity with the Reader role on rg-sap-ap1. You install the new version of the Azure VM extension for SAP solutions by running the following command.

    ```powershell
    Set-AzVMAEMExtension -ResourceGroupName rg-sap-ap1 -VMName vm-ap1-db -InstallNewExtension
    ```

    You need to make sure that the SAP Host Agent uses the extension and that the extension configuration is healthy.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute SAP sur une machine virtuelle Azure nommée **vm-ap1-db** dans le groupe de ressources **rg-sap-ap1**. La machine virtuelle dispose d'une identité managée affectée par le système avec le rôle Reader sur rg-sap-ap1. Vous installez la nouvelle version de l'Azure VM extension for SAP solutions en exécutant la commande suivante.

    ```powershell
    Set-AzVMAEMExtension -ResourceGroupName rg-sap-ap1 -VMName vm-ap1-db -InstallNewExtension
    ```

    Vous devez vous assurer que le SAP Host Agent utilise l'extension et que la configuration de l'extension est saine.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run Test-AzVMAEMExtension and confirm that every check returns OK.", fr: "Exécuter Test-AzVMAEMExtension et vérifier que chaque contrôle renvoie OK." } }
    - { id: b, text: { en: "Install the standard version of the extension too, for redundancy.", fr: "Installer aussi la version standard de l'extension, par redondance." } }
    - { id: c, text: { en: "Grant the managed identity the Contributor role on rg-sap-ap1.", fr: "Accorder le rôle Contributor à l'identité managée sur rg-sap-ap1." } }
    - { id: d, text: { en: "Restart the SAP Host Agent on vm-ap1-db.", fr: "Redémarrer le SAP Host Agent sur vm-ap1-db." } }
    - { id: e, text: { en: "Install the Azure Monitor Agent and associate a data collection rule.", fr: "Installer l'agent Azure Monitor et associer une règle de collecte de données." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      The SAP Host Agent detects the new extension only after it restarts, so you restart it after the installation. Test-AzVMAEMExtension runs the health checks of the extension configuration; every result must be OK, otherwise you rerun Set-AzVMAEMExtension. Inside the VM, http://127.0.0.1:11812/azure4sap/metrics shows the Provider Health Description.
    fr: |
      Le SAP Host Agent ne détecte la nouvelle extension qu'après son redémarrage : vous le redémarrez donc après l'installation. Test-AzVMAEMExtension exécute les contrôles d'intégrité de la configuration de l'extension ; chaque résultat doit être OK, sinon vous exécutez de nouveau Set-AzVMAEMExtension. Dans la machine virtuelle, http://127.0.0.1:11812/azure4sap/metrics affiche la Provider Health Description.
  options:
    b: { en: "The two versions can't run on the same VM; you uninstall one before installing the other.", fr: "Les deux versions ne peuvent pas s'exécuter sur la même machine virtuelle ; vous désinstallez l'une avant d'installer l'autre." }
    c: { en: "The extension only needs Reader, which the identity already has.", fr: "L'extension n'a besoin que de Reader, que l'identité possède déjà." }
    e: { en: "The Azure Monitor Agent sends data to Azure Monitor; it plays no role in the SAP Host Agent's use of the extension.", fr: "L'agent Azure Monitor envoie des données à Azure Monitor ; il ne joue aucun rôle dans l'utilisation de l'extension par le SAP Host Agent." }
references:
  - title: New version of Azure VM extension for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap-new
