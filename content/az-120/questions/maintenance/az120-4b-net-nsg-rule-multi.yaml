id: az120-4b-net-nsg-rule-multi
objective: "4.2.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs SAP NetWeaver on Azure VMs. After a change to the network security groups, the application server **vm-fb1-app02** can no longer connect to the message server of the ASCS instance (instance number 00) on **vm-fb1-ascs** over TCP port 3600.

    You need to identify which security rule blocks the traffic.

    Which two Network Watcher tools can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam exécute SAP NetWeaver sur des machines virtuelles Azure. Après une modification des groupes de sécurité réseau, le serveur d'applications **vm-fb1-app02** ne peut plus se connecter au serveur de messages de l'instance ASCS (numéro d'instance 00) sur **vm-fb1-ascs** via le port TCP 3600.

    Vous devez identifier la règle de sécurité qui bloque le trafic.

    Quels sont les deux outils Network Watcher que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Next hop", fr: "Tronçon suivant" } }
    - { id: b, text: { en: "IP flow verify", fr: "Vérification des flux IP" } }
    - { id: c, text: { en: "Topology", fr: "Topologie" } }
    - { id: d, text: { en: "NSG diagnostics", fr: "Diagnostics NSG" } }
    - { id: e, text: { en: "VPN troubleshoot", fr: "Résolution des problèmes VPN" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      IP flow verify checks whether a packet is allowed or denied to or from a VM and tells you which security rule allowed or denied it. NSG diagnostics performs the same check at the VM, scale set or application gateway level, for an IP address, prefix or service tag, and also names the rule.
    fr: |
      La vérification des flux IP contrôle si un paquet est autorisé ou refusé vers ou depuis une machine virtuelle et indique quelle règle de sécurité l'a autorisé ou refusé. Les diagnostics NSG effectuent le même contrôle au niveau d'une machine virtuelle, d'un groupe identique ou d'une passerelle d'application, pour une adresse IP, un préfixe ou une étiquette de service, et nomment aussi la règle.
  options:
    a: { en: "Next hop shows how traffic is routed, not which security rule filters it.", fr: "Le tronçon suivant montre comment le trafic est routé, pas quelle règle de sécurité le filtre." }
    c: { en: "Topology visualizes resources and their relationships; it doesn't evaluate rules for a given flow.", fr: "La topologie représente les ressources et leurs relations ; elle n'évalue pas les règles pour un flux donné." }
    e: { en: "VPN troubleshoot diagnoses virtual network gateways and their connections.", fr: "La résolution des problèmes VPN diagnostique les passerelles de réseau virtuel et leurs connexions." }
references:
  - title: Azure Network Watcher Overview
    url: https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-overview
