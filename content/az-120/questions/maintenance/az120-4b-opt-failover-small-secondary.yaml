id: az120-4b-opt-failover-small-secondary
objective: "4.1.7"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    To reduce costs, Proseware replicates its production SAP HANA database **PH1** with HANA System Replication, without Pacemaker and without data preload, to a secondary Azure VM in the same region. The secondary VM uses a smaller VM size than the primary VM and also runs the HANA instance of the quality assurance system **QH1**.

    The primary VM fails. You need to make PH1 available on the secondary VM by following Microsoft's guidance for this configuration.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Pour réduire les coûts, Proseware réplique sa base de données SAP HANA de production **PH1** avec la réplication système HANA, sans Pacemaker et sans préchargement des données, vers une machine virtuelle Azure secondaire de la même région. La machine virtuelle secondaire utilise une taille inférieure à celle de la machine virtuelle principale et exécute aussi l'instance HANA du système d'assurance qualité **QH1**.

    La machine virtuelle principale tombe en panne. Vous devez rendre PH1 disponible sur la machine virtuelle secondaire en suivant les recommandations de Microsoft pour cette configuration.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: stopqa, text: { en: "Shut down the QH1 HANA instance on the secondary VM.", fr: "Arrêter l'instance HANA de QH1 sur la machine virtuelle secondaire." } }
    - { id: resize, text: { en: "Resize the secondary VM to the size of the primary VM.", fr: "Redimensionner la machine virtuelle secondaire à la taille de la machine virtuelle principale." } }
    - { id: takeover, text: { en: "Perform the HANA System Replication takeover on the secondary VM.", fr: "Effectuer la reprise (takeover) de la réplication système HANA sur la machine virtuelle secondaire." } }
    - { id: preload, text: { en: "Enable data preload on the secondary instance and wait for replication to complete.", fr: "Activer le préchargement des données sur l'instance secondaire et attendre la fin de la réplication." } }
    - { id: asr, text: { en: "Trigger an Azure Site Recovery failover of the primary VM.", fr: "Déclencher un basculement Azure Site Recovery de la machine virtuelle principale." } }
    - { id: restore, text: { en: "Restore the latest PH1 backup from Azure Backup to the secondary VM.", fr: "Restaurer la dernière sauvegarde de PH1 depuis Sauvegarde Azure sur la machine virtuelle secondaire." } }
answer:
  sequence: [ stopqa, resize, takeover ]
explanation:
  correct:
    en: |
      QH1 holds most of the secondary VM's memory, so you shut it down first to free memory for the replicated data. A smaller secondary VM adds an extra step before the manual failover: resizing it to the size of the source VM (which restarts it). Then you perform the takeover so that PH1 runs on the secondary and loads its data.
    fr: |
      QH1 occupe l'essentiel de la mémoire de la machine virtuelle secondaire : vous l'arrêtez d'abord pour libérer la mémoire destinée aux données répliquées. Une machine virtuelle secondaire plus petite ajoute une étape avant le basculement manuel : son redimensionnement à la taille de la machine virtuelle source (qui la redémarre). Vous effectuez ensuite la reprise pour que PH1 s'exécute sur le secondaire et charge ses données.
  options:
    preload: { en: "Replication can't continue from a failed primary, and preload would remove the memory saving the design relies on.", fr: "La réplication ne peut pas se poursuivre depuis un primaire en panne, et le préchargement supprimerait l'économie de mémoire sur laquelle repose la conception." }
    asr: { en: "The database is protected by HANA System Replication, not by Site Recovery.", fr: "La base de données est protégée par la réplication système HANA, pas par Site Recovery." }
    restore: { en: "The replicated data is already on the secondary; a restore would lose time and possibly data.", fr: "Les données répliquées sont déjà sur le secondaire ; une restauration ferait perdre du temps et peut-être des données." }
references:
  - title: SAP HANA availability within one Azure region
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-availability-one-region
