id: az120-4b-vm-sap-extension-purpose
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind is deploying SAP NetWeaver on Windows Server Azure VMs. Before go-live, SAP requires that the SAP Host Agent on each VM can read Azure infrastructure metrics so that SAP supports the environment.

    You need to meet the SAP support requirement.

    What should you deploy on each SAP VM?
  fr: |
    Northwind déploie SAP NetWeaver sur des machines virtuelles Azure Windows Server. Avant la mise en production, SAP exige que le SAP Host Agent de chaque machine virtuelle puisse lire les métriques de l'infrastructure Azure pour que SAP prenne en charge l'environnement.

    Vous devez satisfaire l'exigence de support de SAP.

    Que devez-vous déployer sur chaque machine virtuelle SAP ?
body:
  options:
    - { id: a, text: { en: "The Azure Monitor Agent with a data collection rule", fr: "L'agent Azure Monitor avec une règle de collecte de données" } }
    - { id: b, text: { en: "The Azure VM extension for SAP solutions", fr: "L'Azure VM extension for SAP solutions" } }
    - { id: c, text: { en: "The Network Watcher Agent virtual machine extension", fr: "L'extension de machine virtuelle Network Watcher Agent" } }
    - { id: d, text: { en: "An SAP NetWeaver provider in Azure Monitor for SAP solutions", fr: "Un fournisseur SAP NetWeaver dans Azure Monitor pour solutions SAP" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Azure VM extension for SAP solutions collects Azure infrastructure data that the SAP Host Agent reads (the metrics are listed in SAP Note 2178632). Microsoft states that you must enable it for SAP to support your environment, and its support goes through SAP support channels.
    fr: |
      L'Azure VM extension for SAP solutions collecte les données de l'infrastructure Azure que lit le SAP Host Agent (les métriques sont listées dans la note SAP 2178632). Microsoft indique qu'il faut l'activer pour que SAP prenne en charge votre environnement, et son support passe par les canaux de support SAP.
  options:
    a: { en: "The Azure Monitor Agent sends guest data to Azure Monitor; the SAP Host Agent doesn't read it.", fr: "L'agent Azure Monitor envoie les données invitées à Azure Monitor ; le SAP Host Agent ne les lit pas." }
    c: { en: "The Network Watcher Agent extension serves Network Watcher tools such as connection monitor and packet capture.", fr: "L'extension Network Watcher Agent sert aux outils Network Watcher comme le moniteur de connexion et la capture de paquets." }
    d: { en: "Azure Monitor for SAP solutions is optional telemetry in Azure; it doesn't replace the extension that SAP support requires.", fr: "Azure Monitor pour solutions SAP est une télémétrie facultative dans Azure ; il ne remplace pas l'extension exigée par le support SAP." }
references:
  - title: Implement the Azure VM extension for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap
