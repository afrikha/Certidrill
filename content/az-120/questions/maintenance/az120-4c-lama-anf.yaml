id: az120-4c-lama-anf
objective: "4.2.9"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind uses SAP LaMa with the Azure connector for an SAP system named **NA1** on SUSE Linux Enterprise Server. The file systems `/sapmnt/NA1`, `/usr/sap/NA1` and `/home/na1adm` of the ASCS and application server instances are Azure NetApp Files NFS volumes in a virtual network named **vnet-sap**. The virtual host names of the instances are added with SAPACEXT.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind utilise SAP LaMa avec le connecteur Azure pour un système SAP nommé **NA1** sur SUSE Linux Enterprise Server. Les systèmes de fichiers `/sapmnt/NA1`, `/usr/sap/NA1` et `/home/na1adm` des instances ASCS et de serveur d'applications sont des volumes NFS Azure NetApp Files dans un réseau virtuel nommé **vnet-sap**. Les noms d'hôtes virtuels des instances sont ajoutés avec SAPACEXT.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The ASCS VM doesn't need to act as an NFS server, so the `acosprep/nfs_paths` entry isn't required in its SAP Host Agent profile.
        fr: La machine virtuelle ASCS n'a pas besoin de jouer le rôle de serveur NFS ; l'entrée `acosprep/nfs_paths` n'est donc pas nécessaire dans son profil SAP Host Agent.
    - id: s2
      text:
        en: The Azure NetApp Files volumes require a subnet of vnet-sap delegated to Microsoft.NetApp/volumes.
        fr: Les volumes Azure NetApp Files exigent un sous-réseau de vnet-sap délégué à Microsoft.NetApp/volumes.
    - id: s3
      text:
        en: The virtual IP addresses added with SAPACEXT remain assigned to the network interfaces after the VM restarts, with no further action.
        fr: Les adresses IP virtuelles ajoutées avec SAPACEXT restent attribuées aux interfaces réseau après le redémarrage de la machine virtuelle, sans autre action.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Without Azure NetApp Files, the ASCS exports the SAP file systems over NFS and its host profile needs `acosprep/nfs_paths`; with Azure NetApp Files, that's no longer required. Azure NetApp Files needs a subnet delegated to Microsoft.NetApp/volumes in the same virtual network as the SAP servers. Virtual IP addresses must be added again after every reboot, and Microsoft recommends SAPACEXT for that.
    fr: Sans Azure NetApp Files, l'ASCS exporte les systèmes de fichiers SAP en NFS et son profil d'hôte a besoin d'`acosprep/nfs_paths` ; avec Azure NetApp Files, ce n'est plus nécessaire. Azure NetApp Files a besoin d'un sous-réseau délégué à Microsoft.NetApp/volumes dans le même réseau virtuel que les serveurs SAP. Les adresses IP virtuelles doivent être ajoutées de nouveau après chaque redémarrage, et Microsoft recommande SAPACEXT pour cela.
references:
  - title: Set up the SAP LaMa connector for Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/lama-installation
