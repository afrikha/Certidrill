id: az120-cs1c-lama-connector
objective: "4.2.9"
type: yesno_statements
caseStudy: az120-cs1c-tailspin-toys
difficulty: 2
status: draft
stem:
  en: |
    You are configuring the SAP LaMa connector for Azure on lama01 to meet the LaMa requirement. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez le connecteur SAP LaMa pour Azure sur lama01 pour satisfaire l'exigence relative à LaMa. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You should enable a managed identity on lama01 and select Use Managed Identity in the connector configuration.
        fr: |
          Vous devez activer une identité managée sur lama01 et sélectionner Use Managed Identity dans la configuration du connecteur.
    - id: s2
      text:
        en: |
          Assigning the Reader role to the identity at the scope of the resource groups that contain the non-production systems is sufficient.
        fr: |
          Attribuer le rôle Reader à l'identité dans l'étendue des groupes de ressources qui contiennent les systèmes hors production suffit.
    - id: s3
      text:
        en: |
          With the Change Storage Type to save costs option, when LaMa stops a VM, it changes all the attached disks of the VM, including the OS disk, to Standard storage.
        fr: |
          Avec l'option Change Storage Type to save costs, quand LaMa arrête une machine virtuelle, il passe tous les disques attachés de la machine virtuelle, y compris le disque du système d'exploitation, au stockage Standard.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The connector can authenticate with a service principal or a managed identity; when SAP LaMa runs on an Azure VM, Microsoft recommends the managed identity, so no secret is stored in LaMa. The identity needs the Contributor role on every resource group that contains SAP systems managed by LaMa, because it deallocates and starts VMs and copies, relocates and deletes managed disks. With Change Storage Type to save costs, stopping a VM switches all attached disks, including the OS disk, to Standard storage.
    fr: |
      Le connecteur peut s'authentifier avec un principal de service ou une identité managée ; quand SAP LaMa s'exécute sur une machine virtuelle Azure, Microsoft recommande l'identité managée, ce qui évite de stocker un secret dans LaMa. L'identité a besoin du rôle Contributor sur chaque groupe de ressources qui contient des systèmes SAP gérés par LaMa, car elle libère et démarre des machines virtuelles et copie, déplace et supprime des disques managés. Avec Change Storage Type to save costs, l'arrêt d'une machine virtuelle passe tous les disques attachés, y compris le disque du système d'exploitation, au stockage Standard.
references:
  - title: Set up the SAP LaMa connector for Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/lama-installation
