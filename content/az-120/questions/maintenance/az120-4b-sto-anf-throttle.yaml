id: az120-4b-sto-anf-throttle
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs SAP HANA on Azure VMs. The /hana/log volume is an NFSv4.1 volume in an Azure NetApp Files capacity pool that uses manual QoS. During peak loads, the HANA log write times increase.

    You need an alert that fires when the /hana/log volume is throttled because it reaches the throughput assigned to it.

    Which metric should you use?
  fr: |
    Adatum exécute SAP HANA sur des machines virtuelles Azure. Le volume /hana/log est un volume NFSv4.1 d'un pool de capacité Azure NetApp Files qui utilise la QoS manuelle. Pendant les pics de charge, les temps d'écriture des journaux HANA augmentent.

    Vous avez besoin d'une alerte qui se déclenche lorsque le volume /hana/log est limité parce qu'il atteint le débit qui lui est attribué.

    Quelle métrique devez-vous utiliser ?
body:
  options:
    - { id: a, text: Throughput limit reached }
    - { id: b, text: Percentage Volume Consumed Size }
    - { id: c, text: Data Disk Bandwidth Consumed Percentage }
    - { id: d, text: Pool Allocated to Volume Size }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Throughput limit reached is a Boolean Azure NetApp Files volume metric: 1 means the volume hit its QoS throughput limit during the five-minute window and was throttled, 0 means it didn't. A volume that reaches it isn't sized for the application's demand; with manual QoS, you can assign it more throughput from the pool.
    fr: |
      Throughput limit reached est une métrique booléenne des volumes Azure NetApp Files : 1 signifie que le volume a atteint sa limite de débit QoS pendant la fenêtre de cinq minutes et a été limité, 0 qu'il ne l'a pas atteinte. Un volume qui l'atteint n'est pas dimensionné pour la demande de l'application ; avec la QoS manuelle, vous pouvez lui attribuer plus de débit à partir du pool.
  options:
    b: { en: "Percentage Volume Consumed Size tracks used capacity, including snapshots, not throughput.", fr: "Percentage Volume Consumed Size suit la capacité utilisée, instantanés compris, pas le débit." }
    c: { en: "Data Disk Bandwidth Consumed Percentage applies to managed disks attached to the VM, not to Azure NetApp Files volumes.", fr: "Data Disk Bandwidth Consumed Percentage s'applique aux disques managés attachés à la machine virtuelle, pas aux volumes Azure NetApp Files." }
    d: { en: "Pool Allocated to Volume Size is the total quota of the volumes in the pool, a capacity value.", fr: "Pool Allocated to Volume Size est le quota total des volumes du pool, une valeur de capacité." }
references:
  - title: Metrics for Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-metrics
