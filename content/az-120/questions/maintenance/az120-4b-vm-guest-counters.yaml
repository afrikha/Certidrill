id: az120-4b-vm-guest-counters
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs SAP application servers on Red Hat Enterprise Linux Azure VMs. The operations team wants to query the available memory and swap usage reported by the guest OS, together with the syslog messages of each VM, in a Log Analytics workspace named **law-sap-ops**.

    You need to configure the data collection.

    What should you configure?
  fr: |
    Fabrikam exécute des serveurs d'applications SAP sur des machines virtuelles Azure Red Hat Enterprise Linux. L'équipe d'exploitation veut interroger la mémoire disponible et l'utilisation du swap signalées par le système d'exploitation invité, ainsi que les messages syslog de chaque machine virtuelle, dans un espace de travail Log Analytics nommé **law-sap-ops**.

    Vous devez configurer la collecte des données.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "The Log Analytics agent connected to law-sap-ops", fr: "L'agent Log Analytics connecté à law-sap-ops" } }
    - { id: b, text: { en: "The Azure VM extension for SAP solutions on each VM", fr: "L'Azure VM extension for SAP solutions sur chaque machine virtuelle" } }
    - { id: c, text: { en: "Boot diagnostics with a managed storage account", fr: "Les diagnostics de démarrage avec un compte de stockage managé" } }
    - { id: d, text: { en: "The Azure Monitor Agent and a data collection rule", fr: "L'agent Azure Monitor et une règle de collecte de données" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Host metrics are collected without an agent, but guest OS counters and logs aren't. The Azure Monitor Agent collects them, and a data collection rule defines which counters and syslog facilities to collect and sends them to the Log Analytics workspace, where you query them with KQL.
    fr: |
      Les métriques de l'hôte sont collectées sans agent, mais pas les compteurs ni les journaux du système d'exploitation invité. L'agent Azure Monitor les collecte, et une règle de collecte de données définit les compteurs et les fonctionnalités syslog à collecter et les envoie dans l'espace de travail Log Analytics, où vous les interrogez en KQL.
  options:
    a: { en: "The Log Analytics agent (MMA/OMS) is retired; the Azure Monitor Agent with DCRs replaces it.", fr: "L'agent Log Analytics (MMA/OMS) est mis hors service ; l'agent Azure Monitor avec des DCR le remplace." }
    b: { en: "The extension provides Azure infrastructure data to the SAP Host Agent; it doesn't send guest counters or syslog to Log Analytics.", fr: "L'extension fournit des données d'infrastructure Azure au SAP Host Agent ; elle n'envoie ni compteurs invités ni syslog dans Log Analytics." }
    c: { en: "Boot diagnostics captures the serial console output and screenshots for troubleshooting boot issues.", fr: "Les diagnostics de démarrage capturent la sortie de la console série et des captures d'écran pour résoudre les problèmes de démarrage." }
references:
  - title: Monitor virtual machines in Azure
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/vm/vminsights-overview
