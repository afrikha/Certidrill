id: az120-4a-adv-refresh-wait
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an SAP system named **FP1** registered as a Virtual Instance for SAP solutions (VIS). The Quality Insights workbook showed an Azure Advisor recommendation to enable accelerated networking on the NIC of an application server VM.

    Fifteen minutes ago, you enabled accelerated networking on that NIC. The recommendation still appears in Advisor.

    You need to confirm that the change resolved the recommendation. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Fabrikam dispose d'un système SAP nommé **FP1** inscrit en tant que Virtual Instance for SAP solutions (VIS). Le classeur Quality Insights affichait une recommandation Azure Advisor demandant d'activer la mise en réseau accélérée sur la carte réseau d'une machine virtuelle de serveur d'applications.

    Il y a quinze minutes, vous avez activé la mise en réseau accélérée sur cette carte réseau. La recommandation apparaît toujours dans Advisor.

    Vous devez confirmer que la modification a résolu la recommandation. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Dismiss the recommendation in Azure Advisor", fr: "Ignorer la recommandation dans Azure Advisor" }
    - id: b
      text: { en: "Delete the VIS and register FP1 again", fr: "Supprimer la VIS et inscrire de nouveau FP1" }
    - id: c
      text: { en: "Wait for the next hourly run of the quality checks", fr: "Attendre la prochaine exécution horaire des contrôles qualité" }
    - id: d
      text: { en: "Redeploy the VM to start a new quality check", fr: "Redéployer la machine virtuelle pour lancer un nouveau contrôle qualité" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The quality checks run on every VIS hourly, and the matching Advisor recommendations refresh hourly too. After you act on a recommendation, you wait for the next refresh; if the fix is effective, the recommendation no longer appears.
    fr: |
      Les contrôles qualité s'exécutent toutes les heures sur chaque VIS, et les recommandations Advisor correspondantes sont actualisées toutes les heures également. Après avoir agi sur une recommandation, vous attendez l'actualisation suivante ; si la correction est efficace, la recommandation n'apparaît plus.
  options:
    a: { en: "Dismissing only hides the recommendation; it doesn't prove that the configuration is now correct.", fr: "Ignorer la recommandation ne fait que la masquer ; cela ne prouve pas que la configuration est désormais correcte." }
    b: { en: "Advisor filters out recommendations for deleted resources for seven days, so a re-registered VIS shows recommendations only after seven days.", fr: "Advisor filtre pendant sept jours les recommandations des ressources supprimées : une VIS réinscrite n'affiche des recommandations qu'au bout de sept jours." }
    d: { en: "Redeploying moves the VM to a new host and restarts it; it doesn't trigger the quality checks, which follow their hourly schedule.", fr: "Le redéploiement déplace la machine virtuelle vers un nouvel hôte et la redémarre ; il ne déclenche pas les contrôles qualité, qui suivent leur planification horaire." }
references:
  - title: View quality checks and insights for a Virtual Instance for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/get-quality-checks-insights
