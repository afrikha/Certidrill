id: az120-cs1a-anf-metrics
objective: "4.2.3"
type: dragdrop
caseStudy: az120-cs1a-blue-yonder-airlines
difficulty: 2
status: draft
stem:
  en: |
    You need to configure Azure Monitor metric alert rules for the Azure NetApp Files volumes to meet the monitoring requirements.

    Which metric should you use for each condition? To answer, drag the appropriate metrics to the correct conditions. Each metric may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer des règles d'alerte de métrique Azure Monitor pour les volumes Azure NetApp Files afin de respecter les exigences de supervision.

    Quelle métrique devez-vous utiliser pour chaque condition ? Pour répondre, faites glisser les métriques appropriées vers les conditions correspondantes. Chaque métrique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: tlr, text: "Throughput limit reached" }
    - { id: awl, text: "Average Write Latency" }
    - { id: pvcs, text: "Percentage Volume Consumed Size" }
    - { id: lag, text: "Volume replication lag time" }
    - { id: iops, text: "Total IOPS" }
    - { id: pas, text: "Pool Allocated Size" }
  targets:
    - id: throttle
      text:
        en: |
          The /hana/log volume of BYP is throttled by its QoS limit.
        fr: |
          Le volume /hana/log de BYP est limité par sa limite de QoS.
    - id: latency
      text:
        en: |
          The round-trip time of writes to /hana/log, measured within the storage service, increases.
        fr: |
          Le temps d'aller-retour des écritures sur /hana/log, mesuré dans le service de stockage, augmente.
    - id: space
      text:
        en: |
          The /hana/logbackup volume is more than 85 percent full, including its snapshots.
        fr: |
          Le volume /hana/logbackup est rempli à plus de 85 %, instantanés compris.
    - id: repl
      text:
        en: |
          Changes on /sapmnt take too long to reach the volume in Germany North.
        fr: |
          Les modifications de /sapmnt mettent trop de temps à atteindre le volume de Germany North.
answer:
  mapping: { throttle: tlr, latency: awl, space: pvcs, repl: lag }
explanation:
  correct:
    en: |
      Throughput limit reached is set to 1 when a volume hits its QoS limit. Average Write Latency is the write round-trip time measured inside the storage service. Percentage Volume Consumed Size includes snapshots. Volume replication lag time measures the delay between a write on the source and its availability on the destination; replication metrics are populated only on the destination volume, so the alert targets the /sapmnt volume in Germany North.
    fr: |
      Throughput limit reached prend la valeur 1 quand un volume atteint sa limite de QoS. Average Write Latency est le temps d'aller-retour des écritures mesuré dans le service de stockage. Percentage Volume Consumed Size inclut les instantanés. Volume replication lag time mesure le délai entre une écriture sur la source et sa disponibilité sur la destination ; les métriques de réplication ne sont alimentées que sur le volume de destination, l'alerte cible donc le volume /sapmnt de Germany North.
  options:
    iops:
      en: |
        Total IOPS counts operations per second; it does not show whether the volume is throttled or slow.
      fr: |
        Total IOPS compte les opérations par seconde ; il n'indique pas si le volume est limité ou lent.
    pas:
      en: |
        Pool Allocated Size is the provisioned size of the capacity pool, not the space consumed in one volume.
      fr: |
        Pool Allocated Size est la taille provisionnée du pool de capacité, pas l'espace consommé dans un volume.
references:
  - title: Metrics for Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-metrics
