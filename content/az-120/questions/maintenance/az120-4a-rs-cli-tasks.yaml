id: az120-4a-rs-cli-tasks
objective: "4.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware plans to resize the SAP application server VMs of a non-production system by using the Azure CLI. Some of the target sizes might not be available on the hardware cluster that currently hosts the VMs.

    Which command should you use for each task? To answer, drag the appropriate commands to the correct tasks. Each command may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit de redimensionner les machines virtuelles de serveur d'applications d'un système hors production à l'aide d'Azure CLI. Certaines des tailles cibles peuvent ne pas être disponibles sur le cluster matériel qui héberge actuellement les machines virtuelles.

    Quelle commande devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les commandes appropriées vers les tâches correspondantes. Chaque commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: options, text: "az vm list-vm-resize-options" }
    - { id: resize, text: "az vm resize" }
    - { id: dealloc, text: "az vm deallocate" }
    - { id: sizes, text: "az vm list-sizes" }
    - { id: redeploy, text: "az vm redeploy" }
  targets:
    - id: list
      text: { en: "List the sizes to which a running VM can be resized", fr: "Lister les tailles vers lesquelles une machine virtuelle en cours d'exécution peut être redimensionnée" }
    - id: release
      text: { en: "Release the VM from its hardware cluster before you choose a size that isn't available there", fr: "Libérer la machine virtuelle de son cluster matériel avant de choisir une taille qui n'y est pas disponible" }
    - id: change
      text: { en: "Change the size of the VM", fr: "Modifier la taille de la machine virtuelle" }
answer:
  mapping: { list: options, release: dealloc, change: resize }
explanation:
  correct:
    en: |
      az vm list-vm-resize-options lists the sizes available for a VM; for a running VM, other sizes might appear only after the VM is stopped. If the new size isn't available on the current hardware cluster, you deallocate the VM first, then run az vm resize with the --size parameter.
    fr: |
      az vm list-vm-resize-options liste les tailles disponibles pour une machine virtuelle ; pour une machine virtuelle en cours d'exécution, d'autres tailles peuvent n'apparaître qu'une fois la machine virtuelle arrêtée. Si la nouvelle taille n'est pas disponible sur le cluster matériel actuel, vous libérez d'abord la machine virtuelle, puis vous exécutez az vm resize avec le paramètre --size.
  options:
    sizes: { en: "az vm list-sizes, now deprecated, lists the sizes offered in a region, not the sizes a given VM can move to.", fr: "az vm list-sizes, désormais déprécié, liste les tailles proposées dans une région, pas les tailles vers lesquelles une machine virtuelle donnée peut passer." }
    redeploy: { en: "az vm redeploy moves the VM to a new host and starts it again; it doesn't leave the VM deallocated for the resize.", fr: "az vm redeploy déplace la machine virtuelle vers un nouvel hôte et la redémarre ; elle ne laisse pas la machine virtuelle libérée pour le redimensionnement." }
references:
  - title: Resize a virtual machine
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/resize-vm
  - title: az vm
    url: https://learn.microsoft.com/en-us/cli/azure/vm
