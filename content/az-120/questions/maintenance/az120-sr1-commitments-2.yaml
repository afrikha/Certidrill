id: az120-sr1-commitments-2
objective: "4.1.3"
type: series_yesno
series: az120-sr1-commitments
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |-
    You buy reservations with instance size flexibility for all the VMs.
  fr: |-
    Vous achetez des réservations avec flexibilité de taille d'instance pour toutes les machines virtuelles.
body:
  solution:
    en: |-
      You buy three-year **Azure Reserved Virtual Machine Instances** in West Europe for the VM sizes of the production and non-production VMs, and you set every reservation to optimize for **instance size flexibility**.
    fr: |-
      Vous achetez des **instances de machines virtuelles réservées Azure** de trois ans dans West Europe pour les tailles des machines virtuelles de production et hors production, et vous configurez chaque réservation pour optimiser la **flexibilité de taille d'instance**.
answer: { value: false }
explanation:
  correct:
    en: |-
      A reservation applies only to its compute service and region combination, so the non-production reservations bought for West Europe stop applying after the move to Sweden Central. Instance size flexibility covers other sizes of the same instance size flexibility group only, not sizes in other groups; keeping the discount would require exchanging the reservations.
    fr: |-
      Une réservation ne s'applique qu'à sa combinaison de service de calcul et de région : les réservations hors production achetées pour West Europe cessent de s'appliquer après le déplacement vers Sweden Central. La flexibilité de taille d'instance couvre uniquement les autres tailles du même groupe de flexibilité de taille d'instance, pas celles des autres groupes ; conserver la remise exigerait d'échanger les réservations.
references:
  - title: Decide between a savings plan and a reservation
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
  - title: Virtual machine size flexibility with Reserved VM Instances
