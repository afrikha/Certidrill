id: az120-4b-opt-scale-app-tier
objective: "4.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs SAP S/4HANA on Azure. During the month-end close, the CPU usage of the four application server VMs stays above 90%, while the HANA database VM stays below 45%. For the rest of the month, all VMs are below 40%.

    You need to handle the month-end peak. The solution must minimize compute costs for the rest of the month.

    What should you do?
  fr: |
    Fabrikam exécute SAP S/4HANA sur Azure. Pendant la clôture mensuelle, l'utilisation du processeur des quatre machines virtuelles de serveurs d'applications reste au-dessus de 90 %, tandis que celle de la machine virtuelle de base de données HANA reste sous 45 %. Le reste du mois, toutes les machines virtuelles sont sous 40 %.

    Vous devez absorber le pic de fin de mois. La solution doit réduire au minimum les coûts de calcul le reste du mois.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Resize the HANA database VM to the next larger M-series size", fr: "Redimensionner la machine virtuelle de base de données HANA à la taille de série M supérieure" } }
    - { id: b, text: { en: "Resize the four application server VMs to a size with twice the vCPUs", fr: "Redimensionner les quatre machines virtuelles de serveurs d'applications à une taille dotée de deux fois plus de processeurs virtuels" } }
    - { id: c, text: { en: "Add application server VMs for month-end, then stop and deallocate them", fr: "Ajouter des machines virtuelles de serveurs d'applications pour la fin de mois, puis les arrêter et les libérer" } }
    - { id: d, text: { en: "Add a second network interface to each application server VM", fr: "Ajouter une deuxième interface réseau à chaque machine virtuelle de serveur d'applications" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The bottleneck is the application layer, which is the SAP layer that scales out; the database layer usually doesn't. Extra application server instances on additional VMs absorb the peak, and stopping and deallocating them after the close means their compute isn't billed for the rest of the month.
    fr: |
      Le goulet d'étranglement est la couche application, qui est la couche SAP capable de scale-out ; la couche base de données, en général, ne l'est pas. Des instances de serveur d'applications supplémentaires sur d'autres machines virtuelles absorbent le pic, et les arrêter puis les libérer après la clôture évite de payer leur calcul le reste du mois.
  options:
    a: { en: "The database VM isn't the bottleneck, and a larger M-series VM would cost more all month.", fr: "La machine virtuelle de base de données n'est pas le goulet d'étranglement, et une machine virtuelle de série M plus grande coûterait plus cher tout le mois." }
    b: { en: "Larger application server VMs would handle the peak but would be billed at the higher rate all month, unless resized twice a month with a restart each time.", fr: "Des machines virtuelles de serveurs d'applications plus grandes absorberaient le pic mais seraient facturées au tarif supérieur tout le mois, à moins de les redimensionner deux fois par mois avec un redémarrage à chaque fois." }
    d: { en: "Additional NICs don't add CPU or bandwidth: all NICs of a VM share its network limit.", fr: "Des cartes réseau supplémentaires n'ajoutent ni processeur ni bande passante : toutes les cartes réseau d'une machine virtuelle partagent sa limite réseau." }
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
