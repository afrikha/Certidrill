id: az120-cs2c-commitments
objective: "4.1.3"
type: dragdrop
caseStudy: az120-cs2c-litware
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend a pricing option for each group of VMs. The solution must meet the cost requirements.

    What should you recommend for each group? To answer, drag the appropriate options to the correct groups. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une option de tarification pour chaque groupe de machines virtuelles. La solution doit respecter les exigences de coûts.

    Que devez-vous recommander pour chaque groupe ? Pour répondre, faites glisser les options appropriées vers les groupes correspondants. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ri, text: { en: "Azure Reserved VM Instances, 3-year term", fr: "Instances de machines virtuelles réservées Azure, durée de 3 ans" } }
    - { id: sp, text: { en: "Azure savings plan for compute", fr: "Plan d'économies Azure pour le calcul" } }
    - { id: payg, text: { en: "Pay-as-you-go, without commitment", fr: "Paiement à l'utilisation, sans engagement" } }
    - { id: cr, text: { en: "On-demand capacity reservation", fr: "Réservation de capacité à la demande" } }
  targets:
    - { id: core, text: { en: "LE1 ASCS/ERS and database VMs", fr: "Machines virtuelles ASCS/ERS et de base de données de LE1" } }
    - { id: app, text: { en: "LE1 application server VMs", fr: "Machines virtuelles de serveur d'applications de LE1" } }
    - { id: sbx, text: { en: "LS1 sandbox VMs", fr: "Machines virtuelles du bac à sable LS1" } }
answer:
  mapping: { core: ri, app: sp, sbx: payg }
explanation:
  correct:
    en: Reservations commit to a VM size or family in one region and give the greatest savings for stable workloads that run continuously. A savings plan commits to an hourly spend across VM families and regions, so it fits the application servers that will change family and maybe region. LS1 runs about 20 hours per month, so a commitment would be mostly unused.
    fr: |
      Les réservations engagent sur une taille ou une famille de machines virtuelles dans une région et offrent les économies les plus importantes pour des charges de travail stables qui fonctionnent en continu. Un plan d'économies engage sur une dépense horaire pour toutes les familles de machines virtuelles et toutes les régions : il convient aux serveurs d'applications qui changeront de famille et peut-être de région. LS1 fonctionne environ 20 heures par mois : un engagement serait en grande partie inutilisé.
  options:
    cr: { en: "A capacity reservation guarantees compute capacity and is billed at pay-as-you-go rates; it is not a discount.", fr: "Une réservation de capacité garantit de la capacité de calcul et est facturée au tarif du paiement à l'utilisation ; ce n'est pas une remise." }
references:
  - title: Decide between a savings plan and a reservation
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
