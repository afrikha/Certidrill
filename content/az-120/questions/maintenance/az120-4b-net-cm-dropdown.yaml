id: az120-4b-net-cm-dropdown
objective: "4.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Proseware runs SAP S/4HANA on Azure. Two interface servers must stay responsive when they call the SAP application servers:

    - **vm-int-az**, an Azure VM in the SAP virtual network
    - **srv-int-op**, an on-premises Windows server connected through ExpressRoute

    You plan a connection monitor with both servers as sources, the private IP addresses of the SAP application servers as destinations, and a TCP test configuration. The network team must be alerted when the latency between a source and the application servers exceeds 5 ms.

    How should you complete the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute SAP S/4HANA sur Azure. Deux serveurs d'interface doivent rester réactifs lorsqu'ils appellent les serveurs d'applications SAP :

    - **vm-int-az**, une machine virtuelle Azure du réseau virtuel SAP
    - **srv-int-op**, un serveur Windows local connecté par ExpressRoute

    Vous prévoyez un moniteur de connexion avec les deux serveurs comme sources, les adresses IP privées des serveurs d'applications SAP comme destinations et une configuration de test TCP. L'équipe réseau doit être alertée lorsque la latence entre une source et les serveurs d'applications dépasse 5 ms.

    Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Prepare vm-int-az: [[az]]

      Prepare srv-int-op: [[onprem]]

      Metric of the alert rule: [[metric]]
    fr: |
      Préparer vm-int-az : [[az]]

      Préparer srv-int-op : [[onprem]]

      Métrique de la règle d'alerte : [[metric]]
  slots:
    - id: az
      options:
        - { id: nwa, text: { en: "Install the Network Watcher Agent extension", fr: "Installer l'extension Network Watcher Agent" } }
        - { id: sapext, text: { en: "Install the Azure VM extension for SAP solutions", fr: "Installer l'Azure VM extension for SAP solutions" } }
        - { id: nothing, text: { en: "Nothing: Azure VMs are monitored without an agent", fr: "Rien : les machines virtuelles Azure sont supervisées sans agent" } }
    - id: onprem
      options:
        - { id: mma, text: { en: "Install the Log Analytics agent", fr: "Installer l'agent Log Analytics" } }
        - { id: arcama, text: { en: "Onboard it to Azure Arc and install the Azure Monitor Agent", fr: "L'intégrer à Azure Arc et installer l'agent Azure Monitor" } }
        - { id: nwaonly, text: { en: "Install the Network Watcher Agent extension only", fr: "Installer uniquement l'extension Network Watcher Agent" } }
    - id: metric
      options:
        - { id: checks, text: "% Checks Failed (ChecksFailedPercent)" }
        - { id: rtt, text: "Round-trip time (ms) (RoundTripTimeMs)" }
        - { id: result, text: "TestResult" }
answer:
  values: { az: nwa, onprem: arcama, metric: rtt }
explanation:
  correct:
    en: |
      Azure VM sources need the Network Watcher Agent extension. On-premises sources must be Azure Arc-enabled servers with the Azure Monitor Agent; the Log Analytics agent is no longer supported for connection monitor. Destinations, such as the private IP addresses of the application servers, need no agent. RoundTripTimeMs reports latency in milliseconds, so a static alert condition greater than 5 meets the requirement.
    fr: |
      Les sources de type machine virtuelle Azure ont besoin de l'extension Network Watcher Agent. Les sources locales doivent être des serveurs Azure Arc avec l'agent Azure Monitor ; l'agent Log Analytics n'est plus pris en charge par le moniteur de connexion. Les destinations, comme les adresses IP privées des serveurs d'applications, n'ont besoin d'aucun agent. RoundTripTimeMs indique la latence en millisecondes : une condition d'alerte statique supérieure à 5 satisfait l'exigence.
  options:
    sapext: { en: "The Azure VM extension for SAP solutions feeds the SAP Host Agent; it plays no role in connection monitor.", fr: "L'Azure VM extension for SAP solutions alimente le SAP Host Agent ; elle ne joue aucun rôle dans le moniteur de connexion." }
    nothing: { en: "Azure VM sources need the Network Watcher Agent extension for connection monitor tests.", fr: "Les sources de type machine virtuelle Azure ont besoin de l'extension Network Watcher Agent pour les tests du moniteur de connexion." }
    mma: { en: "The Log Analytics agent is no longer supported for monitoring on-premises machines with connection monitor.", fr: "L'agent Log Analytics n'est plus pris en charge pour superviser des machines locales avec le moniteur de connexion." }
    nwaonly: { en: "VM extensions apply to Azure VMs; an on-premises source must be Arc-enabled with the Azure Monitor Agent.", fr: "Les extensions de machine virtuelle s'appliquent aux machines virtuelles Azure ; une source locale doit être activée par Arc avec l'agent Azure Monitor." }
    checks: { en: "ChecksFailedPercent measures failed checks (reachability), not latency.", fr: "ChecksFailedPercent mesure les vérifications en échec (accessibilité), pas la latence." }
    result: { en: "TestResult reports the test state (pass, warning, fail, indeterminate), not a latency value in milliseconds.", fr: "TestResult indique l'état du test (réussite, avertissement, échec, indéterminé), pas une latence en millisecondes." }
references:
  - title: Connection Monitor Overview - Azure Network Watcher
    url: https://learn.microsoft.com/en-us/azure/network-watcher/connection-monitor-overview
