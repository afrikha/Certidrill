id: az120-4b-sto-bottleneck-dropdown
objective: "4.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind runs SAP HANA on an Azure VM that supports premium storage. The /hana/data volume is a single Premium SSD v2 disk at LUN 2. During the nightly data loads, Azure Monitor shows the following averages.

    | Metric | Dimension | Average |
    | --- | --- | --- |
    | Data Disk IOPS Consumed Percentage | LUN 2 | 100% |
    | Data Disk Bandwidth Consumed Percentage | LUN 2 | 38% |
    | VM Uncached IOPS Consumed Percentage | (none) | 46% |
    | VM Uncached Bandwidth Consumed Percentage | (none) | 31% |

    You need to remove the bottleneck. The solution must avoid restarting the VM and minimize costs.

    How should you complete the analysis? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind exécute SAP HANA sur une machine virtuelle Azure qui prend en charge le stockage Premium. Le volume /hana/data est un seul disque SSD Premium v2 au LUN 2. Pendant les chargements de données nocturnes, Azure Monitor affiche les moyennes suivantes.

    | Métrique | Dimension | Moyenne |
    | --- | --- | --- |
    | Data Disk IOPS Consumed Percentage | LUN 2 | 100 % |
    | Data Disk Bandwidth Consumed Percentage | LUN 2 | 38 % |
    | VM Uncached IOPS Consumed Percentage | (aucune) | 46 % |
    | VM Uncached Bandwidth Consumed Percentage | (aucune) | 31 % |

    Vous devez supprimer le goulet d'étranglement. La solution doit éviter de redémarrer la machine virtuelle et réduire les coûts au minimum.

    Comment devez-vous compléter l'analyse ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The I/O is capped by: [[where]]

      Remediation: [[fix]]
    fr: |
      Les E/S sont plafonnées par : [[where]]

      Correction : [[fix]]
  slots:
    - id: where
      options:
        - { id: vmiops, text: { en: "The uncached IOPS limit of the VM", fr: "La limite d'IOPS non mises en cache de la machine virtuelle" } }
        - { id: diskiops, text: { en: "The provisioned IOPS of the LUN 2 disk", fr: "Les IOPS provisionnées du disque du LUN 2" } }
        - { id: diskbw, text: { en: "The provisioned throughput of the LUN 2 disk", fr: "Le débit provisionné du disque du LUN 2" } }
    - id: fix
      options:
        - { id: resize, text: { en: "Resize the VM to a size with higher storage limits", fr: "Redimensionner la machine virtuelle à une taille aux limites de stockage plus élevées" } }
        - { id: cache, text: { en: "Enable ReadOnly host caching on the LUN 2 disk", fr: "Activer la mise en cache de l'hôte ReadOnly sur le disque du LUN 2" } }
        - { id: raise, text: { en: "Increase the provisioned IOPS of the LUN 2 disk", fr: "Augmenter les IOPS provisionnées du disque du LUN 2" } }
        - { id: wa, text: { en: "Enable Write Accelerator on the LUN 2 disk", fr: "Activer Write Accelerator sur le disque du LUN 2" } }
answer:
  values: { where: diskiops, fix: raise }
explanation:
  correct:
    en: |
      The disk-level IOPS consumed percentage is at 100% while the VM-level percentages and the disk bandwidth stay well below their limits, so the disk's own provisioned IOPS cap the I/O. Premium SSD v2 lets you raise IOPS independently of capacity and throughput, without downtime (up to four performance changes per 24 hours), and you pay only for the extra IOPS above the free 3,000 baseline.
    fr: |
      Le pourcentage d'IOPS consommé au niveau du disque est à 100 % alors que les pourcentages au niveau de la machine virtuelle et le débit du disque restent bien en dessous de leurs limites : ce sont donc les IOPS provisionnées du disque qui plafonnent les E/S. Le SSD Premium v2 permet d'augmenter les IOPS indépendamment de la capacité et du débit, sans interruption de service (jusqu'à quatre modifications de performances par 24 heures), et vous ne payez que les IOPS au-delà de la base gratuite de 3 000.
  options:
    vmiops: { en: "VM Uncached IOPS Consumed Percentage is at 46%: the VM limit isn't reached.", fr: "VM Uncached IOPS Consumed Percentage est à 46 % : la limite de la machine virtuelle n'est pas atteinte." }
    diskbw: { en: "Disk bandwidth consumption is at 38%; only the IOPS limit is reached.", fr: "La consommation de bande passante du disque est à 38 % ; seule la limite d'IOPS est atteinte." }
    resize: { en: "A larger VM doesn't raise the disk's own IOPS, and resizing restarts the VM.", fr: "Une machine virtuelle plus grande n'augmente pas les IOPS propres du disque, et le redimensionnement redémarre la machine virtuelle." }
    cache: { en: "Premium SSD v2 doesn't support host caching.", fr: "Le SSD Premium v2 ne prend pas en charge la mise en cache de l'hôte." }
    wa: { en: "Write Accelerator applies to M-series log disks on Premium SSD; Premium SSD v2 meets HANA latency requirements without it, and it adds no IOPS.", fr: "Write Accelerator s'applique aux disques de journaux de la série M sur SSD Premium ; le SSD Premium v2 respecte sans lui les exigences de latence de HANA, et il n'ajoute aucune IOPS." }
references:
  - title: Disk metrics - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-metrics
  - title: Select a disk type for Azure IaaS VMs - managed disks
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types
