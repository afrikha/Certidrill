id: az120-4a-ri-scope-config
objective: "4.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum has an Enterprise Agreement enrollment with three subscriptions named **Sub-PRD**, **Sub-QAS** and **Sub-DEV**. Sub-PRD contains the production SAP HANA VMs in two resource groups named **rg-pr1** and **rg-pr2**. The VMs will keep the same size and region for at least four years.

    You plan to buy Azure Reserved VM Instances for the production HANA VMs. The solution must meet the following requirements:

    - The discount must apply to matching VMs in both resource groups of Sub-PRD, and never to VMs in Sub-QAS or Sub-DEV.
    - Datacenter capacity must be prioritized for deployments of the reserved size.
    - The discount must be maximized.

    How should you configure the reservation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'une inscription Contrat Entreprise avec trois abonnements nommés **Sub-PRD**, **Sub-QAS** et **Sub-DEV**. Sub-PRD contient les machines virtuelles SAP HANA de production dans deux groupes de ressources nommés **rg-pr1** et **rg-pr2**. Les machines virtuelles conserveront la même taille et la même région pendant au moins quatre ans.

    Vous prévoyez d'acheter des instances de machine virtuelle réservées Azure pour les machines virtuelles HANA de production. La solution doit respecter les exigences suivantes :

    - La remise doit s'appliquer aux machines virtuelles correspondantes des deux groupes de ressources de Sub-PRD, et jamais aux machines virtuelles de Sub-QAS ou de Sub-DEV.
    - La capacité du centre de données doit être prioritaire pour les déploiements de la taille réservée.
    - La remise doit être maximisée.

    Comment devez-vous configurer la réservation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Scope: [[scope]]
      Optimize for: [[optimize]]
      Term: [[term]]
    fr: |
      Étendue : [[scope]]
      Optimiser pour : [[optimize]]
      Durée : [[term]]
  slots:
    - id: scope
      options:
        - { id: rg, text: { en: "Single resource group", fr: "Groupe de ressources unique" } }
        - { id: sub, text: { en: "Single subscription", fr: "Abonnement unique" } }
        - { id: mg, text: { en: "Management group", fr: "Groupe d'administration" } }
        - { id: shared, text: { en: "Shared", fr: "Partagée" } }
    - id: optimize
      options:
        - { id: isf, text: { en: "Instance size flexibility", fr: "Flexibilité de taille d'instance" } }
        - { id: cap, text: { en: "Capacity priority", fr: "Priorité de capacité" } }
    - id: term
      options:
        - { id: y1, text: { en: "1 year", fr: "1 an" } }
        - { id: y3, text: { en: "3 years", fr: "3 ans" } }
answer:
  values: { scope: sub, optimize: cap, term: y3 }
explanation:
  correct:
    en: |
      A single subscription scope applies the discount to matching resources in every resource group of Sub-PRD only. The capacity priority option prioritizes datacenter capacity for your deployments, and it's available only with a single subscription scope. A three-year term gives the larger discount for VMs that stay stable for four years.
    fr: |
      Une étendue d'abonnement unique applique la remise aux ressources correspondantes de tous les groupes de ressources de Sub-PRD uniquement. L'option de priorité de capacité donne la priorité à la capacité du centre de données pour vos déploiements, et elle n'est disponible qu'avec une étendue d'abonnement unique. Une durée de trois ans offre la remise la plus importante pour des machines virtuelles stables pendant quatre ans.
  options:
    rg: { en: "A single resource group scope would cover only one of the two resource groups.", fr: "Une étendue de groupe de ressources unique ne couvrirait qu'un seul des deux groupes de ressources." }
    shared: { en: "A shared scope applies the discount across the eligible subscriptions of the enrollment, including Sub-QAS and Sub-DEV.", fr: "Une étendue partagée applique la remise à tous les abonnements éligibles de l'inscription, y compris Sub-QAS et Sub-DEV." }
    mg: { en: "A management group scope is possible, but capacity priority requires a single subscription scope.", fr: "Une étendue de groupe d'administration est possible, mais la priorité de capacité exige une étendue d'abonnement unique." }
    isf: { en: "Instance size flexibility, the default, spreads the discount across sizes of the group but doesn't prioritize capacity.", fr: "La flexibilité de taille d'instance, option par défaut, répartit la remise entre les tailles du groupe, mais ne donne pas la priorité à la capacité." }
references:
  - title: Save costs with Azure Reserved VM Instances
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/prepay-reserved-vm-instances
