id: az120-4a-st-pssdv2-tuning
objective: "4.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware is moving the /hana/data and /hana/log volumes of its zonal SAP HANA VMs to Premium SSD v2 disks. To control costs, Proseware wants to provision IOPS and throughput close to the measured needs and adjust them after go-live.

    Which two statements are true about Premium SSD v2 disks?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware déplace les volumes /hana/data et /hana/log de ses machines virtuelles SAP HANA zonales vers des disques SSD Premium v2. Pour maîtriser les coûts, Proseware veut provisionner des IOPS et un débit proches des besoins mesurés et les ajuster après la mise en production.

    Quelles sont les deux affirmations vraies concernant les disques SSD Premium v2 ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Host caching can be set to ReadOnly on the data disks to reduce the IOPS to provision.", fr: "La mise en cache de l'hôte peut être définie sur ReadOnly sur les disques de données pour réduire les IOPS à provisionner." }
    - id: b
      text: { en: "The performance of a disk can be adjusted up to four times in a 24-hour period.", fr: "Les performances d'un disque peuvent être ajustées jusqu'à quatre fois sur une période de 24 heures." }
    - id: c
      text: { en: "A Premium SSD v2 disk can also replace the Premium SSD OS disk of the VMs.", fr: "Un disque SSD Premium v2 peut aussi remplacer le disque SSD Premium du système d'exploitation des machines virtuelles." }
    - id: d
      text: { en: "IOPS and throughput can be provisioned above the baseline without increasing the disk capacity.", fr: "Les IOPS et le débit peuvent être provisionnés au-delà de la base sans augmenter la capacité du disque." }
    - id: e
      text: { en: "The baseline of 3,000 IOPS and 125 MBps is billed in addition to the capacity.", fr: "La base de 3 000 IOPS et 125 Mo/s est facturée en plus de la capacité." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Premium SSD v2 is billed per provisioned GiB, and extra IOPS and throughput are provisioned and paid for separately from capacity. You can adjust the performance up to four times in 24 hours; creating the disk counts as one adjustment, so only three remain during the first 24 hours.
    fr: |
      SSD Premium v2 est facturé par Gio provisionné, et les IOPS et le débit supplémentaires sont provisionnés et payés indépendamment de la capacité. Vous pouvez ajuster les performances jusqu'à quatre fois en 24 heures ; la création du disque compte comme un ajustement, si bien qu'il n'en reste que trois pendant les 24 premières heures.
  options:
    a: { en: "Premium SSD v2 doesn't support host caching.", fr: "SSD Premium v2 ne prend pas en charge la mise en cache de l'hôte." }
    c: { en: "Premium SSD v2 can't be used as an OS disk.", fr: "SSD Premium v2 ne peut pas servir de disque de système d'exploitation." }
    e: { en: "The baseline of 3,000 IOPS and 125 MBps is included free of charge with every disk.", fr: "La base de 3 000 IOPS et 125 Mo/s est incluse gratuitement avec chaque disque." }
references:
  - title: Select a disk type for Azure IaaS VMs - managed disks
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types
