id: az120-4b-sto-disk-limit-metric
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs SAP ASE on an Azure VM from a series that supports premium storage. The database data files are on several Premium SSD data disks. Users report slow batch jobs, and the SAP Basis team suspects that one of the data disks has reached its provisioned IOPS.

    You need to identify in Azure Monitor whether a specific data disk is capped by its own IOPS limit.

    Which metric should you review, split by LUN?
  fr: |
    Contoso exécute SAP ASE sur une machine virtuelle Azure d'une série qui prend en charge le stockage Premium. Les fichiers de données de la base se trouvent sur plusieurs disques de données SSD Premium. Les utilisateurs signalent des traitements par lots lents, et l'équipe SAP Basis soupçonne que l'un des disques de données a atteint ses IOPS provisionnées.

    Vous devez déterminer dans Azure Monitor si un disque de données précis est plafonné par sa propre limite d'IOPS.

    Quelle métrique devez-vous examiner, fractionnée par LUN ?
body:
  options:
    - { id: a, text: VM Uncached IOPS Consumed Percentage }
    - { id: b, text: Data Disk Queue Depth }
    - { id: c, text: Data Disk IOPS Consumed Percentage }
    - { id: d, text: VM Cached IOPS Consumed Percentage }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Data Disk IOPS Consumed Percentage is the actual IOPS of the data disk divided by its provisioned IOPS. At 100%, the disk's own IOPS limit caps the application. Splitting the metric by LUN shows which disk is at its limit.
    fr: |
      Data Disk IOPS Consumed Percentage correspond aux IOPS réelles du disque de données divisées par ses IOPS provisionnées. À 100 %, la limite d'IOPS propre au disque plafonne l'application. Fractionner la métrique par LUN montre quel disque atteint sa limite.
  options:
    a: { en: "VM Uncached IOPS Consumed Percentage compares the total uncached IOPS with the VM's limit; it shows a VM cap, not a disk cap.", fr: "VM Uncached IOPS Consumed Percentage compare le total des IOPS non mises en cache à la limite de la machine virtuelle ; elle révèle un plafond de la machine virtuelle, pas du disque." }
    b: { en: "Queue depth counts outstanding I/O requests; it shows queuing, not whether the provisioned IOPS are reached.", fr: "La profondeur de file d'attente compte les requêtes d'E/S en attente ; elle montre l'attente, pas si les IOPS provisionnées sont atteintes." }
    d: { en: "VM Cached IOPS Consumed Percentage compares cached IOPS with the VM's cached limit; it's a VM-level metric.", fr: "VM Cached IOPS Consumed Percentage compare les IOPS mises en cache à la limite de cache de la machine virtuelle ; c'est une métrique au niveau de la machine virtuelle." }
references:
  - title: Disk metrics - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-metrics
