id: az120-4a-st-stripe-config
objective: "4.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind runs SAP ERP with SQL Server on an Azure VM. You are designing the Premium SSD disks for the SQL Server data files. The volume needs at least 400 MBps of throughput and 512 GiB of capacity. The VM limits aren't a constraint, and the disks will be striped with no in-VM redundancy.

    You need to meet the requirements at the lowest monthly disk cost.

    How should you configure the volume? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind exécute SAP ERP avec SQL Server sur une machine virtuelle Azure. Vous concevez les disques SSD Premium des fichiers de données SQL Server. Le volume a besoin d'au moins 400 Mo/s de débit et de 512 Gio de capacité. Les limites de la machine virtuelle ne sont pas une contrainte, et les disques seront entrelacés sans redondance dans la machine virtuelle.

    Vous devez respecter les exigences au coût mensuel de disque le plus bas.

    Comment devez-vous configurer le volume ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Number of disks in the stripe set: [[count]]
      Premium SSD disk size: [[tier]]
    fr: |
      Nombre de disques dans le jeu entrelacé : [[count]]
      Taille des disques SSD Premium : [[tier]]
  slots:
    - id: count
      options:
        - { id: n1, text: "1" }
        - { id: n2, text: "2" }
        - { id: n4, text: "4" }
        - { id: n8, text: "8" }
    - id: tier
      options:
        - { id: p10, text: "P10 (128 GiB, 100 MBps)" }
        - { id: p20, text: "P20 (512 GiB, 150 MBps)" }
        - { id: p30, text: "P30 (1 TiB, 200 MBps)" }
        - { id: p60, text: "P60 (8 TiB, 500 MBps)" }
answer:
  values: { count: n4, tier: p10 }
explanation:
  correct:
    en: |
      Premium SSD is billed by the size category of each disk, and its throughput grows with size. Four striped P10 disks give 400 MBps for 512 GiB, while a single disk with that throughput needs a P60 of 8 TiB. Microsoft describes striping across several smaller disks as the best way to get a good price/performance ratio with Premium SSD.
    fr: |
      SSD Premium est facturé selon la catégorie de taille de chaque disque, et son débit augmente avec la taille. Quatre disques P10 entrelacés offrent 400 Mo/s pour 512 Gio, alors qu'un disque unique offrant ce débit doit être un P60 de 8 Tio. Microsoft présente l'entrelacement sur plusieurs disques plus petits comme le meilleur moyen d'obtenir un bon rapport prix/performances avec SSD Premium.
  options:
    p20: { en: "Two P20 disks give only 300 MBps, and four P20 disks provision 2 TiB that isn't needed.", fr: "Deux disques P20 n'offrent que 300 Mo/s, et quatre disques P20 provisionnent 2 Tio inutiles." }
    p30: { en: "Two P30 disks reach 400 MBps but provision 2 TiB, which costs more than four P10 disks.", fr: "Deux disques P30 atteignent 400 Mo/s, mais provisionnent 2 Tio, ce qui coûte plus cher que quatre disques P10." }
    p60: { en: "A single P60 meets the throughput but bills 8 TiB of capacity.", fr: "Un seul P60 respecte le débit, mais facture 8 Tio de capacité." }
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
  - title: Select a disk type for Azure IaaS VMs - managed disks
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types
