id: az120-4c-bkp-stop-instance-first
objective: "4.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware protects an SAP HANA system named **LH1** with Azure Backup in a Recovery Services vault. The HANA instance is protected by a **DB Instance via snapshot** policy, and SYSTEMDB and the tenant database are protected by a **Database via Backint** policy.

    LH1 is being retired. You need to stop the protection of LH1 and retain all the backup data.

    You select the SYSTEMDB backup item and select **Stop backup**, but the operation fails.

    What should you do?
  fr: |
    Litware protège un système SAP HANA nommé **LH1** avec Sauvegarde Azure dans un coffre Recovery Services. L'instance HANA est protégée par une stratégie **DB Instance via snapshot**, et SYSTEMDB ainsi que la base de données de locataire sont protégées par une stratégie **Database via Backint**.

    LH1 va être retiré. Vous devez arrêter la protection de LH1 et conserver toutes les données de sauvegarde.

    Vous sélectionnez l'élément de sauvegarde SYSTEMDB, puis **Stop backup**, mais l'opération échoue.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Stop protection of the HANA instance item first, then stop protection of the databases.", fr: "Arrêter d'abord la protection de l'élément d'instance HANA, puis celle des bases de données." } }
    - { id: b, text: { en: "Unregister the HANA virtual machine first, then stop protection of the databases.", fr: "Désinscrire d'abord la machine virtuelle HANA, puis arrêter la protection des bases de données." } }
    - { id: c, text: { en: "Re-register the workload backup extension, then stop protection of the databases.", fr: "Réinscrire l'extension de sauvegarde de charge de travail, puis arrêter la protection des bases de données." } }
    - { id: d, text: { en: "Disable soft delete on the vault, then stop protection of the databases.", fr: "Désactiver la suppression réversible sur le coffre, puis arrêter la protection des bases de données." } }
answer: { optionId: a }
explanation:
  correct:
    en: When a HANA instance is protected, Azure Backup requires you to stop protection of the instance before its databases; otherwise the operation fails. Stopping the instance protection with retain data, then the database protection with retain data, keeps all the recovery points.
    fr: "Quand une instance HANA est protégée, Sauvegarde Azure exige d'arrêter la protection de l'instance avant celle de ses bases de données ; sinon l'opération échoue. Arrêter la protection de l'instance avec conservation des données, puis celle des bases de données avec conservation des données, garde tous les points de récupération."
  options:
    b: { en: "A server can be unregistered only after protection is disabled, so this order doesn't work.", fr: "Un serveur ne peut être désinscrit qu'après la désactivation de la protection : cet ordre ne fonctionne pas." }
    c: { en: "Re-registering fixes an unhealthy extension and can fail running jobs; the extension isn't the cause here.", fr: "La réinscription répare une extension défectueuse et peut faire échouer des travaux en cours ; l'extension n'est pas en cause ici." }
    d: { en: "Soft delete protects deleted backup data; it doesn't block stopping protection with retained data.", fr: "La suppression réversible protège les données de sauvegarde supprimées ; elle n'empêche pas d'arrêter la protection en conservant les données." }
references:
  - title: Manage backed up SAP HANA databases on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-manage
