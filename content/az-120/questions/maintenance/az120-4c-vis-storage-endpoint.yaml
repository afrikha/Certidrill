id: az120-4c-vis-storage-endpoint
objective: "4.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin is registering an SAP system named **TQ1** in Azure Center for SAP solutions. The ASCS and application server VMs are in a subnet named **snet-app**, and the HANA VM is in a subnet named **snet-db**. Both subnets are in the same virtual network. The network security groups allow outbound traffic to Azure Storage, Azure Resource Manager and Microsoft Entra ID.

    In the registration wizard, you set the storage account network access to **Enable access from specific virtual network**. snet-app has the Microsoft.Storage service endpoint enabled; snet-db doesn't.

    The registration fails because the discovery can't reach the managed storage account from the HANA VM. Access to the managed storage account must stay restricted.

    What should you do?
  fr: |
    Tailspin inscrit un système SAP nommé **TQ1** dans le Centre Azure pour les solutions SAP. Les machines virtuelles ASCS et serveurs d'applications se trouvent dans un sous-réseau nommé **snet-app**, et la machine virtuelle HANA dans un sous-réseau nommé **snet-db**. Les deux sous-réseaux appartiennent au même réseau virtuel. Les groupes de sécurité réseau autorisent le trafic sortant vers Stockage Azure, Azure Resource Manager et Microsoft Entra ID.

    Dans l'assistant d'inscription, vous définissez l'accès réseau du compte de stockage sur **Enable access from specific virtual network**. Le point de terminaison de service Microsoft.Storage est activé sur snet-app, mais pas sur snet-db.

    L'inscription échoue, car la découverte ne parvient pas à joindre le compte de stockage managé depuis la machine virtuelle HANA. L'accès au compte de stockage managé doit rester restreint.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable the Microsoft.Storage service endpoint on snet-db, and then retry the registration.", fr: "Activer le point de terminaison de service Microsoft.Storage sur snet-db, puis relancer l'inscription." } }
    - { id: b, text: { en: "Create a private endpoint for the managed storage account in snet-db, and then retry the registration.", fr: "Créer un point de terminaison privé pour le compte de stockage managé dans snet-db, puis relancer l'inscription." } }
    - { id: c, text: { en: "Change the storage account network access to Public, and then retry the registration.", fr: "Passer l'accès réseau du compte de stockage sur Public, puis relancer l'inscription." } }
    - { id: d, text: { en: "Assign the managed identity the Storage Blob Data Contributor role, and then retry the registration.", fr: "Attribuer à l'identité managée le rôle Storage Blob Data Contributor, puis relancer l'inscription." } }
answer: { optionId: a }
explanation:
  correct:
    en: With access from specific virtual networks, the Microsoft.Storage service endpoint must be enabled on all the subnets where the SAP VMs run; otherwise registration fails. After you fix the cause, you can select Retry on the VIS page.
    fr: Avec l'accès depuis des réseaux virtuels spécifiques, le point de terminaison de service Microsoft.Storage doit être activé sur tous les sous-réseaux où s'exécutent les machines virtuelles SAP ; sinon l'inscription échoue. Après avoir corrigé la cause, vous pouvez sélectionner Retry sur la page de la VIS.
  options:
    b: { en: "Private endpoints on the managed storage account aren't supported in this scenario.", fr: "Les points de terminaison privés sur le compte de stockage managé ne sont pas pris en charge dans ce scénario." }
    c: { en: "Public network access would work but violates the requirement to keep access restricted.", fr: "L'accès réseau public fonctionnerait, mais il ne respecte pas l'exigence d'accès restreint." }
    d: { en: "The failure is a network path issue from snet-db, not a missing data-plane role.", fr: "L'échec est un problème de chemin réseau depuis snet-db, pas un rôle de plan de données manquant." }
references:
  - title: Register an existing SAP system
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/register-existing-system
