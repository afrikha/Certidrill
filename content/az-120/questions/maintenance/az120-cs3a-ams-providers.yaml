id: az120-cs3a-ams-providers
objective: "4.2.5"
type: dragdrop
caseStudy: az120-cs3a-coho-winery
difficulty: 1
status: draft
stem:
  en: |
    You create an Azure Monitor for SAP solutions resource for CWP. You need to prepare the prerequisites of the providers that meet the monitoring requirement.

    Which prerequisite should you prepare for each provider? To answer, drag the appropriate prerequisites to the correct providers. Each prerequisite may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une ressource Azure Monitor pour solutions SAP pour CWP. Vous devez préparer les prérequis des fournisseurs qui répondent à l'exigence de supervision.

    Quel prérequis devez-vous préparer pour chaque fournisseur ? Pour répondre, faites glisser les prérequis appropriés vers les fournisseurs correspondants. Chaque prérequis peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: node, text: { en: "Prometheus node exporter listening on port 9100 on each HANA VM", fr: "Prometheus node exporter à l'écoute sur le port 9100 sur chaque machine virtuelle HANA" } }
    - { id: hace, text: { en: "prometheus-ha_cluster_exporter listening on port 9664 on each cluster node", fr: "prometheus-ha_cluster_exporter à l'écoute sur le port 9664 sur chaque nœud du cluster" } }
    - { id: dbuser, text: { en: "A dedicated SYSTEMDB user that has the MONITORING role", fr: "Un utilisateur dédié de SYSTEMDB disposant du rôle MONITORING" } }
    - { id: pcp, text: { en: "Performance Co-Pilot with pcp-pmda-hacluster on port 44322 on each cluster node", fr: "Performance Co-Pilot avec pcp-pmda-hacluster sur le port 44322 sur chaque nœud du cluster" } }
    - { id: ama, text: { en: "Azure Monitor Agent with a data collection rule on each HANA VM", fr: "Agent Azure Monitor avec une règle de collecte de données sur chaque machine virtuelle HANA" } }
  targets:
    - { id: os, text: { en: "OS (Linux) provider", fr: "Fournisseur OS (Linux)" } }
    - { id: ha, text: { en: "High-availability cluster (Pacemaker) provider", fr: "Fournisseur High-availability cluster (Pacemaker)" } }
    - { id: hana, text: { en: "SAP HANA provider", fr: "Fournisseur SAP HANA" } }
answer:
  mapping: { os: node, ha: hace, hana: dbuser }
explanation:
  correct:
    en: |
      The Linux provider reads the metrics that the Prometheus node exporter exposes, by default on port 9100, on each monitored host. On SLES, the Pacemaker cluster provider reads prometheus-ha_cluster_exporter on port 9664, with one provider per cluster node. The SAP HANA provider connects with a dedicated database user that has the MONITORING (or BACKUP CATALOG READ) role, preferably on SYSTEMDB because tenant databases lack some monitoring views.
    fr: |
      Le fournisseur Linux lit les métriques exposées par Prometheus node exporter, par défaut sur le port 9100, sur chaque hôte supervisé. Sur SLES, le fournisseur de cluster Pacemaker lit prometheus-ha_cluster_exporter sur le port 9664, avec un fournisseur par nœud du cluster. Le fournisseur SAP HANA se connecte avec un utilisateur de base de données dédié qui dispose du rôle MONITORING (ou BACKUP CATALOG READ), de préférence sur SYSTEMDB, car les bases de données de locataire n'ont pas toutes les vues de supervision.
  options:
    pcp:
      en: |
        Performance Co-Pilot with pcp-pmda-hacluster is the cluster agent for RHEL; the CWP cluster runs on SLES.
      fr: |
        Performance Co-Pilot avec pcp-pmda-hacluster est l'agent de cluster pour RHEL ; le cluster de CWP s'exécute sur SLES.
    ama:
      en: |
        Azure Monitor for SAP solutions collects data with its own Azure Functions code from exporters and database connections, not through the Azure Monitor Agent.
      fr: |
        Azure Monitor pour solutions SAP collecte les données avec son propre code Azure Functions à partir d'exportateurs et de connexions de base de données, pas par l'agent Azure Monitor.
references:
  - title: Configure Linux provider for Azure Monitor for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/provider-linux
  - title: Create a high-availability Pacemaker cluster provider for Azure Monitor for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/provider-ha-pacemaker-cluster
