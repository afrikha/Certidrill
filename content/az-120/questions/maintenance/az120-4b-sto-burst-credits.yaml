id: az120-4b-sto-burst-credits
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs a non-production SAP system with Microsoft SQL Server on an Azure VM. The SQL Server data files are on a 512 GiB Premium SSD (P20) data disk that relies on credit-based bursting during nightly loads, which last about 20 minutes.

    You need an alert that warns the operations team when the disk is close to exhausting its IOPS burst capacity.

    Which metric should you use for the alert rule?
  fr: |
    Fabrikam exécute un système SAP hors production avec Microsoft SQL Server sur une machine virtuelle Azure. Les fichiers de données SQL Server se trouvent sur un disque de données SSD Premium de 512 Gio (P20) qui s'appuie sur le bursting à base de crédits pendant les chargements nocturnes, qui durent environ 20 minutes.

    Vous avez besoin d'une alerte qui prévient l'équipe d'exploitation lorsque le disque est près d'épuiser sa capacité de bursting en IOPS.

    Quelle métrique devez-vous utiliser pour la règle d'alerte ?
body:
  options:
    - { id: a, text: Data Disk Max Burst IOPS }
    - { id: b, text: Data Disk Target IOPS }
    - { id: c, text: VM Cached Used Burst IO Credits Percentage }
    - { id: d, text: Data Disk Used Burst IO Credits Percentage }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Data Disk Used Burst IO Credits Percentage is the accumulated percentage of the IOPS burst used by the data disks; it's emitted every five minutes. An alert on a high value warns that the disk will soon fall back to its target IOPS. Premium SSD disks of 512 GiB or less offer this burst, for 30 minutes maximum.
    fr: |
      Data Disk Used Burst IO Credits Percentage est le pourcentage cumulé du bursting en IOPS utilisé par les disques de données ; il est émis toutes les cinq minutes. Une alerte sur une valeur élevée prévient que le disque va bientôt revenir à ses IOPS cibles. Les disques SSD Premium de 512 Gio ou moins offrent ce bursting, pendant 30 minutes au maximum.
  options:
    a: { en: "Max Burst IOPS is the IOPS limit the disk can burst up to; it doesn't show how much burst credit is left.", fr: "Max Burst IOPS est la limite d'IOPS que le disque peut atteindre en bursting ; elle n'indique pas les crédits restants." }
    b: { en: "Target IOPS is the limit without bursting; it doesn't change as credits are consumed.", fr: "Target IOPS est la limite sans bursting ; elle ne change pas quand les crédits sont consommés." }
    c: { en: "This metric tracks the burst credits of the VM's cached limit, not those of the disk.", fr: "Cette métrique suit les crédits de bursting de la limite de cache de la machine virtuelle, pas ceux du disque." }
references:
  - title: Disk metrics - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-metrics
  - title: Azure storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
