id: az120-4a-ri-esv3-transition
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware runs the SAP application servers of an SAP ERP system on Esv3-series VMs in the North Europe region. The VMs are covered by one-year Azure Reserved VM Instances that expire in December 2026.

    During 2027, Litware will move the application servers gradually to Edsv5-series VMs, and will move some of them to the West Europe region. The application servers will keep running 24 hours a day.

    You need to recommend a commitment-based discount for the application servers that applies during and after the migration. The solution must minimize the management of commitments.

    What should you recommend?
  fr: |
    Litware exécute les serveurs d'applications d'un système SAP ERP sur des machines virtuelles de la série Esv3 dans la région Europe Nord. Les machines virtuelles sont couvertes par des instances de machine virtuelle réservées Azure d'un an qui expirent en décembre 2026.

    En 2027, Litware migrera progressivement les serveurs d'applications vers des machines virtuelles de la série Edsv5 et en déplacera certains vers la région Europe Ouest. Les serveurs d'applications continueront à fonctionner 24 heures sur 24.

    Vous devez recommander une remise fondée sur un engagement pour les serveurs d'applications, qui s'applique pendant et après la migration. La solution doit réduire au minimum la gestion des engagements.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Renew the Esv3 reservations for one year when they expire", fr: "Renouveler les réservations Esv3 pour un an à leur expiration" }
    - id: b
      text: { en: "Buy on-demand capacity reservations for the Edsv5 sizes in both regions", fr: "Acheter des réservations de capacité à la demande pour les tailles Edsv5 dans les deux régions" }
    - id: c
      text: { en: "Buy Edsv5 reservations in North Europe when the Esv3 reservations expire", fr: "Acheter des réservations Edsv5 dans la région Europe Nord à l'expiration des réservations Esv3" }
    - id: d
      text: { en: "Buy an Azure savings plan for compute when the Esv3 reservations expire", fr: "Acheter un plan d'économies Azure pour le calcul à l'expiration des réservations Esv3" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A savings plan commits to an hourly spend that applies to eligible compute in any region and VM family, so it covers the Esv3 VMs, the new Edsv5 VMs and the VMs moved to West Europe without exchanges. Since July 1, 2026, Esv3 reservations can no longer be purchased or renewed, and Microsoft points to savings plans for these workloads.
    fr: |
      Un plan d'économies engage sur une dépense horaire qui s'applique au calcul éligible dans toute région et toute famille de machines virtuelles : il couvre les machines virtuelles Esv3, les nouvelles machines virtuelles Edsv5 et celles déplacées vers la région Europe Ouest, sans échange. Depuis le 1er juillet 2026, les réservations Esv3 ne peuvent plus être achetées ni renouvelées, et Microsoft oriente ces charges de travail vers les plans d'économies.
  options:
    a: { en: "Esv3 is one of the series whose reservations can't be purchased or renewed after July 1, 2026.", fr: "Esv3 fait partie des séries dont les réservations ne peuvent plus être achetées ni renouvelées après le 1er juillet 2026." }
    b: { en: "Capacity reservations guarantee capacity and are billed at pay-as-you-go rates; they aren't a discount.", fr: "Les réservations de capacité garantissent de la capacité et sont facturées au tarif du paiement à l'utilisation ; ce ne sont pas des remises." }
    c: { en: "An Edsv5 reservation in North Europe doesn't cover the Esv3 VMs still running during the migration or the VMs moved to West Europe.", fr: "Une réservation Edsv5 dans la région Europe Nord ne couvre ni les machines virtuelles Esv3 encore en service pendant la migration, ni celles déplacées vers la région Europe Ouest." }
references:
  - title: Transition guide for retired Azure Reserved VM Instances
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/manage-legacy-vm-reservations-after-july-1-2026
  - title: Decide between a savings plan and a reservation
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
