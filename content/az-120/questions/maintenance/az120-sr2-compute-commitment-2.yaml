seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You buy an Azure savings plan for compute.
  fr: |
    Vous achetez un plan d'économies Azure pour le calcul.
body:
  solution:
    en: |
      You purchase a three-year **Azure savings plan for compute** with an hourly commitment sized to the stable compute usage of the application servers.
    fr: |
      Vous achetez un **plan d'économies Azure pour le calcul** de trois ans, avec un engagement horaire dimensionné sur la consommation de calcul stable des serveurs d'applications.
answer: { value: true }
explanation:
  correct:
    en: |
      A savings plan is a fixed hourly spend commitment that applies automatically to eligible compute usage across instance families and regions. The discount keeps applying when Woodgrove changes the VM series and moves VMs to Sweden Central, which is the scenario for which Microsoft recommends a savings plan over a reservation.
    fr: |
      Un plan d'économies est un engagement de dépense horaire fixe qui s'applique automatiquement à la consommation de calcul éligible, quelles que soient la famille d'instances et la région. La remise continue de s'appliquer lorsque Woodgrove change de série de machines virtuelles et déplace des machines virtuelles vers Sweden Central, ce qui correspond au cas où Microsoft recommande un plan d'économies plutôt qu'une réservation.
references:
  - title: Decide between a savings plan and a reservation
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
