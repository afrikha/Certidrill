id: az120-4b-arch-tiering-statements
objective: "4.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs SAP S/4HANA and a native SAP HANA application on Azure VMs. Both databases run SAP HANA 2.0 SPS 06. The SAP Basis team is evaluating data tiering options to keep the HANA VM sizes under control.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute SAP S/4HANA et une application SAP HANA native sur des machines virtuelles Azure. Les deux bases de données utilisent SAP HANA 2.0 SPS 06. L'équipe SAP Basis évalue les options de hiérarchisation des données pour maîtriser la taille des machines virtuelles HANA.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Moving warm S/4HANA tables to Native Storage Extension (NSE) reduces the size of the HANA data volume on disk.
        fr: Déplacer des tables S/4HANA tièdes vers Native Storage Extension (NSE) réduit la taille du volume de données HANA sur disque.
    - id: s2
      text:
        en: By default, the NSE buffer cache is sized at 10% of the HANA memory.
        fr: Par défaut, le cache tampon NSE est dimensionné à 10 % de la mémoire HANA.
    - id: s3
      text:
        en: SAP HANA Dynamic Tiering 2.0 can be used as the warm tier of the S/4HANA database.
        fr: SAP HANA Dynamic Tiering 2.0 peut servir de niveau tiède à la base de données S/4HANA.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      NSE displaces warm data from memory to disk-based pages loaded on demand; it reduces the memory footprint but not the HANA disk size. Its buffer cache defaults to 10% of HANA memory and is allocated separately from the hot working memory. Dynamic Tiering 2.0 isn't supported by S/4HANA or SAP BW; on Azure it targets native HANA applications, so only the native application could use it.
    fr: |
      NSE déplace les données tièdes de la mémoire vers des pages sur disque chargées à la demande ; il réduit l'empreinte mémoire mais pas la taille disque de HANA. Son cache tampon vaut par défaut 10 % de la mémoire HANA et il est alloué séparément de la mémoire de travail des données chaudes. Dynamic Tiering 2.0 n'est pas pris en charge par S/4HANA ni par SAP BW ; sur Azure, il vise les applications HANA natives : seule l'application native pourrait l'utiliser.
references:
  - title: Managing SAP HANA data footprint for balancing cost and performance
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-tiering-guidance
  - title: SAP HANA infrastructure configurations and operations on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations
