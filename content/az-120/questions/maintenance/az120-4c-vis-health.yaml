id: az120-4c-vis-health
objective: "4.2.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind manages an SAP system named **NP1** as a Virtual Instance for SAP solutions (VIS). On the VIS overview, the instances show the following:

    | Instance | Status | Health |
    | --- | --- | --- |
    | ASCS | Running | Healthy |
    | Application server D00 | Running | Healthy |
    | Application server D01 | Running | Degraded |
    | Database | Running | |

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind gère un système SAP nommé **NP1** en tant que Virtual Instance for SAP solutions (VIS). Dans la vue d'ensemble de la VIS, les instances indiquent ceci :

    | Instance | État | Intégrité |
    | --- | --- | --- |
    | ASCS | Running | Healthy |
    | Serveur d'applications D00 | Running | Healthy |
    | Serveur d'applications D01 | Running | Degraded |
    | Base de données | Running | |

    Comment devez-vous compléter l'affirmation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The status of NP1 is [[st]] and the health of NP1 is [[hl]].
    fr: |
      L'état de NP1 est [[st]] et l'intégrité de NP1 est [[hl]].
  slots:
    - id: st
      options:
        - { id: partial, text: Partially running }
        - { id: running, text: Running }
        - { id: offline, text: Offline }
        - { id: unavail, text: Unavailable }
    - id: hl
      options:
        - { id: healthy, text: Healthy }
        - { id: unhealthy, text: Unhealthy }
        - { id: unknown, text: Unknown }
        - { id: degraded, text: Degraded }
answer:
  values: { st: running, hl: degraded }
explanation:
  correct:
    en: The status of a VIS shows whether its instances are running, and its health reflects the health of the instances and their collective impact. All the instances are running, so NP1 is Running; one degraded application server instance makes the system health Degraded.
    fr: L'état d'une VIS indique si ses instances s'exécutent, et son intégrité reflète celle des instances et leur impact collectif. Toutes les instances s'exécutent, donc NP1 est Running ; une instance de serveur d'applications dégradée rend l'intégrité du système Degraded.
  options:
    partial: { en: "Every instance is running, so the system isn't partially running.", fr: "Toutes les instances s'exécutent : le système n'est pas partiellement en cours d'exécution." }
    healthy: { en: "One degraded instance is enough to make the system health Degraded.", fr: "Une seule instance dégradée suffit à rendre l'intégrité du système Degraded." }
    unhealthy: { en: "Unhealthy corresponds to a red instance; D01 shows signs of degradation, not failure.", fr: "Unhealthy correspond à une instance rouge ; D01 présente des signes de dégradation, pas une défaillance." }
references:
  - title: Monitor SAP system from the Azure portal
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/monitor-portal
