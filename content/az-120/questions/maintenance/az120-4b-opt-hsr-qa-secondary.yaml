id: az120-4b-opt-hsr-qa-secondary
objective: "4.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove runs its production SAP HANA database (SID **HP1**) on an Azure VM and replicates it with HANA System Replication to a second VM in the same region. No Pacemaker cluster is configured, and the operations team accepts a manual failover with a longer RTO. Woodgrove also needs a quality assurance HANA system (SID **HQ1**) of a similar size.

    You need to reduce the total compute cost of HP1 and HQ1. The design must follow the cost-saving options that Microsoft describes for HANA System Replication within one region.

    What should you recommend?
  fr: |
    Woodgrove exécute sa base de données SAP HANA de production (SID **HP1**) sur une machine virtuelle Azure et la réplique avec la réplication système HANA vers une deuxième machine virtuelle de la même région. Aucun cluster Pacemaker n'est configuré, et l'équipe d'exploitation accepte un basculement manuel avec un RTO plus long. Woodgrove a aussi besoin d'un système HANA d'assurance qualité (SID **HQ1**) de taille comparable.

    Vous devez réduire le coût de calcul total de HP1 et HQ1. La conception doit suivre les options d'économie que Microsoft décrit pour la réplication système HANA dans une même région.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Keep data preload enabled on the secondary VM and run HQ1 on that VM", fr: "Conserver le préchargement des données sur la machine virtuelle secondaire et y exécuter HQ1" } }
    - { id: b, text: { en: "Disable data preload on the secondary VM and run HQ1 on that VM", fr: "Désactiver le préchargement des données sur la machine virtuelle secondaire et y exécuter HQ1" } }
    - { id: c, text: { en: "Add a Pacemaker cluster with automatic failover and use a smaller secondary VM", fr: "Ajouter un cluster Pacemaker avec basculement automatique et utiliser une machine virtuelle secondaire plus petite" } }
    - { id: d, text: { en: "Replace replication with Azure Site Recovery and run HQ1 on the replica VM", fr: "Remplacer la réplication par Azure Site Recovery et exécuter HQ1 sur la machine virtuelle réplica" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Without data preload, the replicated HANA instance on the secondary VM doesn't hold the column store in memory, so another HANA instance such as HQ1 can use most of the VM's memory. At failover, you shut down HQ1 so that the replicated data can be loaded, then take over. The target still needs at least 64 GB of memory plus room for the row store data.
    fr: |
      Sans préchargement des données, l'instance HANA répliquée sur la machine virtuelle secondaire ne garde pas le column store en mémoire ; une autre instance HANA comme HQ1 peut donc utiliser l'essentiel de la mémoire de la machine virtuelle. Au basculement, vous arrêtez HQ1 pour que les données répliquées puissent être chargées, puis vous effectuez la reprise. La cible a toujours besoin d'au moins 64 Go de mémoire plus la place des données du row store.
  options:
    a: { en: "With preload, the replicated data occupies the memory of the secondary VM, so you can't run another HANA system there.", fr: "Avec le préchargement, les données répliquées occupent la mémoire de la machine virtuelle secondaire : vous ne pouvez pas y exécuter un autre système HANA." }
    c: { en: "With automatic failover, the primary and secondary VMs must use the same VM SKU, and the cluster adds no saving.", fr: "Avec le basculement automatique, les machines virtuelles principale et secondaire doivent utiliser la même référence de machine virtuelle, et le cluster n'apporte aucune économie." }
    d: { en: "Site Recovery creates the target VM only during a failover, so there's no running replica VM that could host HQ1.", fr: "Site Recovery ne crée la machine virtuelle cible qu'au moment d'un basculement : il n'existe pas de machine virtuelle réplica en cours d'exécution qui pourrait héberger HQ1." }
references:
  - title: SAP HANA availability within one Azure region
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-availability-one-region
