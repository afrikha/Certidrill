id: az120-4a-st-azfiles-hana-shared
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware runs SAP HANA on Azure VMs. The /hana/data, /hana/log and /hana/shared volumes are on Azure NetApp Files. To reduce the size of the Azure NetApp Files capacity pool, Litware wants to move volumes to an NFS share on Azure Files (SSD), which is billed on the provisioned capacity of the share and needs no capacity pool.

    You need to identify which volumes can be moved while keeping a configuration supported for SAP HANA.

    Which volumes should you identify?
  fr: |
    Litware exécute SAP HANA sur des machines virtuelles Azure. Les volumes /hana/data, /hana/log et /hana/shared se trouvent sur Azure NetApp Files. Pour réduire la taille du pool de capacité Azure NetApp Files, Litware veut déplacer des volumes vers un partage NFS sur Azure Files (SSD), facturé sur la capacité provisionnée du partage et sans pool de capacité.

    Vous devez identifier les volumes qui peuvent être déplacés en conservant une configuration prise en charge pour SAP HANA.

    Quels volumes devez-vous identifier ?
body:
  options:
    - id: a
      text: { en: "/hana/data only", fr: "/hana/data uniquement" }
    - id: b
      text: { en: "/hana/log only", fr: "/hana/log uniquement" }
    - id: c
      text: { en: "/hana/data and /hana/log", fr: "/hana/data et /hana/log" }
    - id: d
      text: { en: "/hana/shared only", fr: "/hana/shared uniquement" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure Files NFS shares on SSD are supported for /hana/shared but not for the HANA data or log volumes. Their charging is based on the provisioned capacity of each share, with no performance tiers and no capacity pool, which suits /hana/shared.
    fr: |
      Les partages NFS Azure Files sur SSD sont pris en charge pour /hana/shared, mais pas pour les volumes de données ou de journaux HANA. Leur facturation repose sur la capacité provisionnée de chaque partage, sans niveaux de performances ni pool de capacité, ce qui convient à /hana/shared.
  options:
    a: { en: "Azure Files isn't supported for HANA data volumes.", fr: "Azure Files n'est pas pris en charge pour les volumes de données HANA." }
    b: { en: "Azure Files isn't supported for HANA log volumes.", fr: "Azure Files n'est pas pris en charge pour les volumes de journaux HANA." }
    c: { en: "Neither the data nor the log volume is supported on Azure Files; they stay on Azure NetApp Files or block storage.", fr: "Ni le volume de données ni le volume de journaux ne sont pris en charge sur Azure Files ; ils restent sur Azure NetApp Files ou sur un stockage en mode bloc." }
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
