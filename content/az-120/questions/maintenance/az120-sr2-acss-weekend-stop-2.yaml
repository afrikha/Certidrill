id: az120-sr2-acss-weekend-stop-2
objective: "4.2.7"
type: series_yesno
series: az120-sr2-acss-weekend-stop
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    You run a soft stop of the VIS.
  fr: |
    Vous exécutez un arrêt progressif (soft stop) de la VIS.
body:
  solution:
    en: |
      You run the following command.

      ```bash
      az workloads sap-virtual-instance stop -g rg-qas -n QAS --soft-stop-timeout-seconds 600
      ```
    fr: |
      Vous exécutez la commande suivante.

      ```bash
      az workloads sap-virtual-instance stop -g rg-qas -n QAS --soft-stop-timeout-seconds 600
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      A soft stop drains user sessions and batch processes for up to the timeout, then stops the ASCS and application server instances. Without the deallocate option, a VIS stop affects only the SAP application: the VMs keep running and are billed, and the HANA database is not stopped.
    fr: |
      Un arrêt progressif laisse se terminer les sessions utilisateur et les traitements par lots pendant le délai indiqué, puis arrête les instances ASCS et de serveur d'applications. Sans l'option de libération, l'arrêt d'une VIS ne concerne que l'application SAP : les machines virtuelles continuent de fonctionner et d'être facturées, et la base de données HANA n'est pas arrêtée.
