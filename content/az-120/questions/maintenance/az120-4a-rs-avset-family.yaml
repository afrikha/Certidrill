id: az120-4a-rs-avset-family
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso runs the SAP HANA database of an SAP ERP system on two VMs named **hn1-db-0** and **hn1-db-1** in an availability set named **avset-db**. The VMs use an Edsv5-series size and replicate with HANA System Replication. After a data growth, the database needs a larger M-series size that is certified for SAP HANA.

    When you try to resize hn1-db-1 to the M-series size, the operation fails because the size isn't available on the hardware cluster that hosts the availability set.

    You need to move both VMs to the M-series size. The VMs must stay in avset-db.

    What should you do?
  fr: |
    Contoso exécute la base de données SAP HANA d'un système SAP ERP sur deux machines virtuelles nommées **hn1-db-0** et **hn1-db-1** dans un groupe à haute disponibilité nommé **avset-db**. Les machines virtuelles utilisent une taille de la série Edsv5 et se répliquent avec la réplication du système SAP HANA. Après une croissance des données, la base de données a besoin d'une taille plus grande de la série M certifiée pour SAP HANA.

    Quand vous essayez de redimensionner hn1-db-1 vers la taille de la série M, l'opération échoue, car la taille n'est pas disponible sur le cluster matériel qui héberge le groupe à haute disponibilité.

    Vous devez passer les deux machines virtuelles à la taille de la série M. Les machines virtuelles doivent rester dans avset-db.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Redeploy hn1-db-1 to a new host, and then resize it", fr: "Redéployer hn1-db-1 sur un nouvel hôte, puis la redimensionner" }
    - id: b
      text: { en: "Deallocate both VMs, resize both VMs, and then start them", fr: "Libérer les deux machines virtuelles, redimensionner les deux machines virtuelles, puis les démarrer" }
    - id: c
      text: { en: "Deallocate hn1-db-1 only, resize it, and then start it", fr: "Libérer uniquement hn1-db-1, la redimensionner, puis la démarrer" }
    - id: d
      text: { en: "Add both VMs to a proximity placement group, and then resize them", fr: "Ajouter les deux machines virtuelles à un groupe de placement de proximité, puis les redimensionner" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      VMs of an availability set share a hardware cluster. To move to a VM family that the cluster doesn't host, such as from Edsv5 to the M family, you must shut down all VMs of the availability set and resize them all so that they can run on the other host type. HANA System Replication lets you plan the operation, but both VMs are down at the same time.
    fr: |
      Les machines virtuelles d'un groupe à haute disponibilité partagent un cluster matériel. Pour passer à une famille que le cluster n'héberge pas, par exemple d'Edsv5 vers la famille M, vous devez arrêter toutes les machines virtuelles du groupe à haute disponibilité et les redimensionner toutes pour qu'elles puissent s'exécuter sur l'autre type d'hôte. La réplication du système SAP HANA permet de planifier l'opération, mais les deux machines virtuelles sont arrêtées en même temps.
  options:
    a: { en: "Redeploying doesn't change the hardware type that the availability set uses while hn1-db-0 still runs on it, so the M-series size still can't be allocated.", fr: "Le redéploiement ne modifie pas le type de matériel utilisé par le groupe à haute disponibilité tant que hn1-db-0 s'y exécute : la taille de la série M ne peut toujours pas être allouée." }
    c: { en: "While hn1-db-0 keeps running, the availability set stays bound to its current hardware cluster, so the resize of hn1-db-1 fails again.", fr: "Tant que hn1-db-0 reste en cours d'exécution, le groupe à haute disponibilité reste lié à son cluster matériel actuel : le redimensionnement de hn1-db-1 échoue de nouveau." }
    d: { en: "A proximity placement group restricts placement further; it doesn't make a new VM family available to the availability set.", fr: "Un groupe de placement de proximité restreint davantage le placement ; il ne rend pas une nouvelle famille de machines virtuelles disponible pour le groupe à haute disponibilité." }
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
