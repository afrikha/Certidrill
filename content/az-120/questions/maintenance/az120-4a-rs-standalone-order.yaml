id: az120-4a-rs-standalone-order
objective: "4.1.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Tailspin runs an SAP sandbox system on a single Azure VM that hosts both SAP HANA and the SAP application instances. The VM isn't in an availability set. You must resize the VM to a size that isn't available on the hardware cluster that currently hosts it.

    You need to resize the VM without corrupting the database.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin exécute un système SAP de bac à sable sur une seule machine virtuelle Azure qui héberge à la fois SAP HANA et les instances d'application SAP. La machine virtuelle ne fait pas partie d'un groupe à haute disponibilité. Vous devez redimensionner la machine virtuelle vers une taille qui n'est pas disponible sur le cluster matériel qui l'héberge actuellement.

    Vous devez redimensionner la machine virtuelle sans endommager la base de données.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: stopsap, text: { en: "Stop the SAP application instances and the SAP HANA database.", fr: "Arrêter les instances d'application SAP et la base de données SAP HANA." } }
    - { id: dealloc, text: { en: "Stop and deallocate the VM.", fr: "Arrêter et libérer la machine virtuelle." } }
    - { id: resize, text: { en: "Change the size of the VM.", fr: "Modifier la taille de la machine virtuelle." } }
    - { id: startvm, text: { en: "Start the VM.", fr: "Démarrer la machine virtuelle." } }
    - { id: startsap, text: { en: "Start the SAP HANA database and the SAP application instances.", fr: "Démarrer la base de données SAP HANA et les instances d'application SAP." } }
    - { id: redeploy, text: { en: "Redeploy the VM to a new host.", fr: "Redéployer la machine virtuelle sur un nouvel hôte." } }
    - { id: detach, text: { en: "Detach the data disks from the VM.", fr: "Détacher les disques de données de la machine virtuelle." } }
answer:
  sequence: [ stopsap, dealloc, resize, startvm, startsap ]
explanation:
  correct:
    en: |
      You stop SAP and HANA cleanly first, because the VM will go down. Because the target size isn't available on the current hardware cluster, you deallocate the VM before you change its size. You then start the VM and, once the OS is up, start HANA and the SAP instances.
    fr: |
      Vous arrêtez d'abord proprement SAP et HANA, car la machine virtuelle va s'arrêter. Comme la taille cible n'est pas disponible sur le cluster matériel actuel, vous libérez la machine virtuelle avant de modifier sa taille. Vous démarrez ensuite la machine virtuelle puis, une fois le système d'exploitation démarré, HANA et les instances SAP.
  options:
    redeploy: { en: "Redeploying isn't needed: deallocating the VM lets Azure place it on a cluster that offers the new size.", fr: "Le redéploiement n'est pas nécessaire : la libération de la machine virtuelle permet à Azure de la placer sur un cluster qui propose la nouvelle taille." }
    detach: { en: "OS and data disks aren't affected by deallocation or resizing, so they stay attached.", fr: "Les disques du système d'exploitation et de données ne sont pas affectés par la libération ou le redimensionnement : ils restent attachés." }
references:
  - title: Resize a virtual machine
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/resize-vm
