id: az120-4c-acss-db-start
objective: "4.2.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam manages a non-production SAP system as a Virtual Instance for SAP solutions (VIS) named **FD1** in a resource group named **rg-sap-dev**. The SAP HANA database instance resource of FD1 is named **HD1**. Every evening, the SAP system is stopped and all its virtual machines are deallocated.

    Every morning, a script must first start the HANA database, including its virtual machine, and then start the application tier.

    How should you complete the first command of the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam gère un système SAP hors production en tant que Virtual Instance for SAP solutions (VIS) nommée **FD1**, dans un groupe de ressources nommé **rg-sap-dev**. La ressource d'instance de base de données SAP HANA de FD1 se nomme **HD1**. Chaque soir, le système SAP est arrêté et toutes ses machines virtuelles sont libérées.

    Chaque matin, un script doit d'abord démarrer la base de données HANA, y compris sa machine virtuelle, puis démarrer le niveau application.

    Comment devez-vous compléter la première commande du script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az workloads [[res]] start \
      --sap-virtual-instance-name FD1 \
      --resource-group rg-sap-dev \
      --name HD1 \
      [[opt]] true
  slots:
    - id: res
      options:
        - { id: vis, text: sap-virtual-instance }
        - { id: db, text: sap-database-instance }
        - { id: cs, text: sap-central-instance }
        - { id: app, text: sap-application-server-instance }
    - id: opt
      options:
        - { id: nowait, text: "--no-wait" }
        - { id: dealloc, text: "--deallocate-vm" }
        - { id: startvm, text: "--start-vm" }
answer:
  values: { res: db, opt: startvm }
explanation:
  correct:
    en: "`az workloads sap-database-instance start` starts the database instance of the VIS (currently supported for SAP HANA only), identified by the VIS name and the database resource name. `--start-vm true` starts the virtual machine before the database; without it, the VM must already be running."
    fr: "`az workloads sap-database-instance start` démarre l'instance de base de données de la VIS (prise en charge uniquement pour SAP HANA actuellement), identifiée par le nom de la VIS et celui de la ressource de base de données. `--start-vm true` démarre la machine virtuelle avant la base de données ; sans ce paramètre, la machine virtuelle doit déjà être en cours d'exécution."
  options:
    vis: { en: "sap-virtual-instance start starts the application tier (central services and application servers), not the database.", fr: "sap-virtual-instance start démarre le niveau application (services centraux et serveurs d'applications), pas la base de données." }
    cs: { en: "sap-central-instance targets the central services instance.", fr: "sap-central-instance cible l'instance des services centraux." }
    app: { en: "sap-application-server-instance targets an application server instance.", fr: "sap-application-server-instance cible une instance de serveur d'applications." }
    nowait: { en: "--no-wait only returns immediately; the deallocated VM wouldn't be started.", fr: "--no-wait rend seulement la main immédiatement ; la machine virtuelle libérée ne serait pas démarrée." }
    dealloc: { en: "--deallocate-vm is a parameter of the stop command.", fr: "--deallocate-vm est un paramètre de la commande stop." }
references:
  - title: az workloads sap-database-instance
    url: https://learn.microsoft.com/en-us/cli/azure/workloads/sap-database-instance
