id: az120-4c-bkp-health-state
objective: "4.2.6"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware protects two SAP HANA databases, **PS1** and **PS2**, with Azure Backup in a Recovery Services vault. You review the backup items of the vault.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware protège deux bases de données SAP HANA, **PS1** et **PS2**, avec Sauvegarde Azure dans un coffre Recovery Services. Vous examinez les éléments de sauvegarde du coffre.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      PS1 was protected one hour ago and its first backup hasn't run yet. The backup status of PS1 is [[s1]].

      The workload backup extension on the virtual machine of PS2 hasn't synchronized with the service for three hours. The backup status of PS2 is [[s2]].
    fr: |
      PS1 a été protégée il y a une heure et sa première sauvegarde n'a pas encore été exécutée. L'état de sauvegarde de PS1 est [[s1]].

      L'extension de sauvegarde de charge de travail de la machine virtuelle de PS2 ne s'est pas synchronisée avec le service depuis trois heures. L'état de sauvegarde de PS2 est [[s2]].
  slots:
    - id: s1
      options:
        - { id: healthy, text: Healthy }
        - { id: unhealthy, text: Unhealthy }
        - { id: notreach, text: NotReachable }
        - { id: irpending, text: IRPending }
    - id: s2
      options:
        - { id: healthy, text: Healthy }
        - { id: unhealthy, text: Unhealthy }
        - { id: notreach, text: NotReachable }
        - { id: irpending, text: IRPending }
answer:
  values: { s1: irpending, s2: notreach }
explanation:
  correct:
    en: IRPending means that the first backup hasn't run yet. NotReachable means that the extension on the VM and the service haven't synchronized for more than two hours. Healthy and Unhealthy reflect the result of the last backup.
    fr: IRPending signifie que la première sauvegarde n'a pas encore été exécutée. NotReachable signifie que l'extension de la machine virtuelle et le service ne se sont pas synchronisés depuis plus de deux heures. Healthy et Unhealthy reflètent le résultat de la dernière sauvegarde.
references:
  - title: Back up SAP HANA databases in Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-sap-hana-database
