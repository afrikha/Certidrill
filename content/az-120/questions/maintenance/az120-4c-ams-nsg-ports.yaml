id: az120-4c-ams-nsg-ports
objective: "4.2.5"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Northwind has an Azure Monitor for SAP solutions resource in a subnet named **snet-ams** (10.50.4.0/25) of a virtual network named **vnet-mon**. vnet-mon is peered with a virtual network named **vnet-sap**.

    An SAP HANA virtual machine named **hdb01** runs HANA instance number **03** in a subnet of vnet-sap. The subnet is associated with a network security group named **nsg-db**. The firewall of the operating system allows all the required ports.

    You add an SAP HANA provider for instance 03 and an OS (Linux) provider that uses the node exporter on its default port. Both providers fail to connect to hdb01. The inbound security rules of nsg-db are shown in the following table.

    Answer each prompt by selecting the rule that blocks the traffic.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'une ressource Azure Monitor pour solutions SAP dans un sous-réseau nommé **snet-ams** (10.50.4.0/25) d'un réseau virtuel nommé **vnet-mon**. vnet-mon est relié par un peering à un réseau virtuel nommé **vnet-sap**.

    Une machine virtuelle SAP HANA nommée **hdb01** exécute l'instance HANA numéro **03** dans un sous-réseau de vnet-sap. Le sous-réseau est associé à un groupe de sécurité réseau nommé **nsg-db**. Le pare-feu du système d'exploitation autorise tous les ports nécessaires.

    Vous ajoutez un fournisseur SAP HANA pour l'instance 03 et un fournisseur de système d'exploitation (Linux) qui utilise node exporter sur son port par défaut. Les deux fournisseurs ne parviennent pas à se connecter à hdb01. Les règles de sécurité entrantes de nsg-db figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la règle qui bloque le trafic.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Traffic of the SAP HANA provider", fr: "Trafic du fournisseur SAP HANA" }
    - id: p2
      text: { en: "Traffic of the OS (Linux) provider", fr: "Trafic du fournisseur de système d'exploitation (Linux)" }
  grid:
    header: [{ en: "Priority", fr: "Priorité" }, { en: Name, fr: Nom }, Port, Source, Action]
    rows:
      - [{ text: "100" }, { text: Allow-AMS-HANA, area: r100 }, { text: "30013-30015" }, { text: 10.50.4.0/25 }, { text: Allow }]
      - [{ text: "110" }, { text: Deny-Exporters, area: r110 }, { text: "9100" }, { text: VirtualNetwork }, { text: Deny }]
      - [{ text: "120" }, { text: Allow-AMS-OS, area: r120 }, { text: "9100" }, { text: 10.50.4.0/25 }, { text: Allow }]
      - [{ text: "200" }, { text: Deny-HANA-SQL, area: r200 }, { text: "30000-39999" }, { text: Any }, { text: Deny }]
      - [{ text: "300" }, { text: Allow-AMS-HANA03, area: r300 }, { text: "30313-30315" }, { text: 10.50.4.0/25 }, { text: Allow }]
      - [{ text: "65000" }, { text: AllowVnetInBound, area: r65000 }, { text: Any }, { text: VirtualNetwork }, { text: Allow }]
answer:
  values: { p1: r200, p2: r110 }
explanation:
  correct:
    en: The HANA provider uses ports `3<instance number>13` and `3<instance number>15`, so 30313 and 30315 for instance 03. Rule 100 covers instance 00 only, and rule 200 denies 30313 before rule 300 is evaluated. The node exporter listens on port 9100, and the VirtualNetwork service tag includes the address space of peered virtual networks, so rule 110 denies snet-ams before rule 120 allows it.
    fr: "Le fournisseur HANA utilise les ports `3<numéro d'instance>13` et `3<numéro d'instance>15`, soit 30313 et 30315 pour l'instance 03. La règle 100 ne couvre que l'instance 00, et la règle 200 refuse 30313 avant que la règle 300 soit évaluée. Node exporter écoute sur le port 9100, et l'étiquette de service VirtualNetwork inclut l'espace d'adressage des réseaux virtuels reliés par peering : la règle 110 refuse snet-ams avant que la règle 120 ne l'autorise."
references:
  - title: Set up a network for Azure Monitor for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/set-up-network
  - title: Configure Linux provider for Azure Monitor for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/provider-linux
