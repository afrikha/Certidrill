id: az120-4c-bkp-operator-role
objective: "4.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso protects the SAP HANA databases of its production SAP system with Azure Backup in a Recovery Services vault named **rsv-sap-weu**.

    The operations team must be able to run on-demand backups and restore the databases to their original virtual machines. The team must not be able to create or modify backup policies or to stop protection. The team already has the Virtual Machine Contributor role on the HANA virtual machines.

    You need to grant the team access to rsv-sap-weu. The solution must follow the principle of least privilege.

    Which role should you assign?
  fr: |
    Contoso protège les bases de données SAP HANA de son système SAP de production avec Sauvegarde Azure dans un coffre Recovery Services nommé **rsv-sap-weu**.

    L'équipe d'exploitation doit pouvoir lancer des sauvegardes à la demande et restaurer les bases de données sur leurs machines virtuelles d'origine. Elle ne doit pas pouvoir créer ni modifier de stratégies de sauvegarde, ni arrêter la protection. L'équipe dispose déjà du rôle Virtual Machine Contributor sur les machines virtuelles HANA.

    Vous devez accorder à l'équipe l'accès à rsv-sap-weu. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer ?
body:
  options:
    - { id: a, text: Backup Reader }
    - { id: b, text: Backup Operator }
    - { id: c, text: Backup Contributor }
    - { id: d, text: Contributor }
answer: { optionId: b }
explanation:
  correct:
    en: For SAP HANA and SQL Server databases in Azure VMs, Backup Operator on the vault allows enabling backup, on-demand backups and restores, together with Virtual Machine Contributor on the VMs. Backup Operator can't manage backup policies or stop protection, which require Backup Contributor.
    fr: Pour les bases de données SAP HANA et SQL Server dans des machines virtuelles Azure, Backup Operator sur le coffre permet d'activer la sauvegarde, de lancer des sauvegardes à la demande et de restaurer, avec Virtual Machine Contributor sur les machines virtuelles. Backup Operator ne peut ni gérer les stratégies de sauvegarde ni arrêter la protection, qui exigent Backup Contributor.
  options:
    a: { en: "Backup Reader only views backup items and can't trigger backups or restores.", fr: "Backup Reader ne fait que consulter les éléments de sauvegarde et ne peut lancer ni sauvegarde ni restauration." }
    c: { en: "Backup Contributor also manages policies and stops protection, which the team must not do.", fr: "Backup Contributor gère aussi les stratégies et arrête la protection, ce que l'équipe ne doit pas faire." }
    d: { en: "Contributor grants full management of the vault, far beyond the requirement.", fr: "Contributor accorde la gestion complète du coffre, bien au-delà du besoin." }
references:
  - title: Use Azure role-based access control to manage Azure Backup recovery points
    url: https://learn.microsoft.com/en-us/azure/backup/backup-rbac-rs-vault
