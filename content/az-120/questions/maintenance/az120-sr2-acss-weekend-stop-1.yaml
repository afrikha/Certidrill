id: az120-sr2-acss-weekend-stop-1
objective: "4.2.7"
type: series_yesno
series: az120-sr2-acss-weekend-stop
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: |
    You stop the VIS and then the HANA database instance, both with the VM deallocation option.
  fr: |
    Vous arrêtez la VIS puis l'instance de base de données HANA, chacune avec l'option de libération des machines virtuelles.
body:
  solution:
    en: |
      You assign the **Virtual Machine Contributor** role to the user-assigned managed identity of the VIS on the resource group that contains the QAS VMs. You stop the VIS with the **deallocate VM** option, and then you stop the HANA database instance of the VIS with the **deallocate VM** option.
    fr: |
      Vous attribuez le rôle **Virtual Machine Contributor** à l'identité managée affectée par l'utilisateur de la VIS sur le groupe de ressources qui contient les machines virtuelles de QAS. Vous arrêtez la VIS avec l'option **deallocate VM**, puis vous arrêtez l'instance de base de données HANA de la VIS avec l'option **deallocate VM**.
answer: { value: true }
explanation:
  correct:
    en: |
      To stop and start VMs, the managed identity of the VIS needs Virtual Machine Contributor or an equivalent role. Stopping the VIS with VM deallocation stops the application tier (ASCS and application servers) and then deallocates their VMs. The HANA database has its own stop action, which stops HANA and deallocates its VM, so all four VMs are deallocated after SAP is stopped.
    fr: |
      Pour arrêter et démarrer des machines virtuelles, l'identité managée de la VIS a besoin du rôle Virtual Machine Contributor ou d'un rôle équivalent. L'arrêt de la VIS avec libération des machines virtuelles arrête la couche Application (ASCS et serveurs d'applications), puis libère leurs machines virtuelles. La base de données HANA a sa propre action d'arrêt, qui arrête HANA et libère sa machine virtuelle : les quatre machines virtuelles sont libérées après l'arrêt de SAP.
references:
  - title: Start and stop SAP systems, instances, HANA database, and underlying VMs
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/stop-start-sap-and-underlying-vm
