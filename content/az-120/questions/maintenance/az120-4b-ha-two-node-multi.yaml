id: az120-4b-ha-two-node-multi
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove runs a two-node SAP HANA Pacemaker cluster on SUSE Linux Enterprise Server for SAP 15 SP6 VMs named **hana-n1** and **hana-n2**. An Azure Monitor for SAP solutions resource is deployed in a subnet that can reach both nodes.

    You need the high-availability cluster workbook of Azure Monitor for SAP solutions to show all the metrics of both nodes.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove exécute un cluster Pacemaker SAP HANA à deux nœuds sur des machines virtuelles SUSE Linux Enterprise Server for SAP 15 SP6 nommées **hana-n1** et **hana-n2**. Une ressource Azure Monitor pour solutions SAP est déployée dans un sous-réseau qui peut joindre les deux nœuds.

    Vous devez faire en sorte que le classeur de cluster à haute disponibilité d'Azure Monitor pour solutions SAP affiche toutes les métriques des deux nœuds.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Install, start and enable prometheus-ha_cluster_exporter on hana-n1 and hana-n2.", fr: "Installer, démarrer et activer prometheus-ha_cluster_exporter sur hana-n1 et hana-n2." } }
    - { id: b, text: { en: "Install prometheus-ha_cluster_exporter on the node that currently runs the primary HANA instance only.", fr: "Installer prometheus-ha_cluster_exporter uniquement sur le nœud qui exécute actuellement l'instance HANA principale." } }
    - { id: c, text: { en: "Create one provider whose endpoint is the virtual IP address of the HANA cluster.", fr: "Créer un seul fournisseur dont le point de terminaison est l'adresse IP virtuelle du cluster HANA." } }
    - { id: d, text: { en: "Create one high-availability cluster provider for each node, with the node's endpoint.", fr: "Créer un fournisseur de cluster à haute disponibilité pour chaque nœud, avec le point de terminaison du nœud." } }
    - { id: e, text: { en: "Install the Prometheus node exporter on both nodes and open port 9100.", fr: "Installer le Prometheus node exporter sur les deux nœuds et ouvrir le port 9100." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Each cluster node needs the HA cluster exporter (on SUSE, prometheus-ha_cluster_exporter on port 9664), started and enabled. The provider reads one node's endpoint, so you create a provider for each server to see all metrics in the workbook.
    fr: |
      Chaque nœud du cluster a besoin de l'exportateur de cluster HA (sur SUSE, prometheus-ha_cluster_exporter sur le port 9664), démarré et activé. Le fournisseur lit le point de terminaison d'un seul nœud : vous créez donc un fournisseur pour chaque serveur afin de voir toutes les métriques dans le classeur.
  options:
    b: { en: "The exporter is needed on every node; the primary role moves between nodes at failover.", fr: "L'exportateur est nécessaire sur chaque nœud ; le rôle principal passe d'un nœud à l'autre au basculement." }
    c: { en: "The documented setup points each provider to the exporter endpoint of one server and repeats it for every server; the cluster virtual IP isn't the documented endpoint.", fr: "La configuration documentée fait pointer chaque fournisseur vers le point de terminaison de l'exportateur d'un serveur et la répète pour chaque serveur ; l'adresse IP virtuelle du cluster n'est pas le point de terminaison documenté." }
    e: { en: "The node exporter on port 9100 feeds the OS (Linux) provider, not the cluster provider.", fr: "Le node exporter sur le port 9100 alimente le fournisseur Système d'exploitation (Linux), pas le fournisseur de cluster." }
references:
  - title: Create a high-availability cluster provider for Azure Monitor for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/provider-ha-pacemaker-cluster
