id: az120-4b-opt-hsr-sizing-statements
objective: "4.1.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso replicates a production SAP HANA database between two Azure VMs in the same region by using HANA System Replication. To lower costs, Contoso is reviewing the size of the secondary VM.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso réplique une base de données SAP HANA de production entre deux machines virtuelles Azure de la même région avec la réplication système HANA. Pour réduire les coûts, Contoso examine la taille de la machine virtuelle secondaire.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If a Pacemaker cluster provides automatic failover between the two VMs, the secondary VM can use a smaller VM size than the primary VM.
        fr: Si un cluster Pacemaker assure le basculement automatique entre les deux machines virtuelles, la machine virtuelle secondaire peut utiliser une taille inférieure à celle de la machine virtuelle principale.
    - id: s2
      text:
        en: If data preload is disabled on the secondary, the secondary HANA instance needs at least 64 GB of memory plus enough memory for the row store data.
        fr: Si le préchargement des données est désactivé sur le secondaire, l'instance HANA secondaire a besoin d'au moins 64 Go de mémoire plus assez de mémoire pour les données du row store.
    - id: s3
      text:
        en: If the secondary VM uses a smaller size and failover is manual, the secondary VM is resized to the size of the primary VM before the failover.
        fr: Si la machine virtuelle secondaire utilise une taille inférieure et que le basculement est manuel, elle est redimensionnée à la taille de la machine virtuelle principale avant le basculement.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      With automatic failover (RPO 0, low RTO), the primary and secondary VMs must use the same Azure VM SKU. The cost-saving options apply to configurations without automatic failover: without preload, the target still needs at least 64 GB plus memory for the row store, and a smaller secondary VM adds an extra step, resizing it to the source VM size, before the manual failover.
    fr: |
      Avec le basculement automatique (RPO de 0, RTO faible), les machines virtuelles principale et secondaire doivent utiliser la même référence de machine virtuelle Azure. Les options d'économie s'appliquent aux configurations sans basculement automatique : sans préchargement, la cible a toujours besoin d'au moins 64 Go plus la mémoire du row store, et une machine virtuelle secondaire plus petite ajoute une étape, son redimensionnement à la taille de la machine virtuelle source, avant le basculement manuel.
references:
  - title: SAP HANA availability within one Azure region
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-availability-one-region
