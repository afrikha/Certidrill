id: az120-4c-vis-register-order
objective: "4.2.8"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an SAP S/4HANA system named **FP2** on SUSE Linux Enterprise Server. The virtual machines, disks and load balancers of FP2 are in a resource group named **rg-fp2-compute**, and the virtual network is in a resource group named **rg-network**. The Microsoft.Workloads resource provider is registered in the subscription. All the VMs of FP2 are running.

    You have the Owner role on the subscription. You need to register FP2 in Azure Center for SAP solutions. The solution must follow the principle of least privilege.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam dispose d'un système SAP S/4HANA nommé **FP2** sur SUSE Linux Enterprise Server. Les machines virtuelles, disques et équilibreurs de charge de FP2 se trouvent dans un groupe de ressources nommé **rg-fp2-compute**, et le réseau virtuel dans un groupe de ressources nommé **rg-network**. Le fournisseur de ressources Microsoft.Workloads est inscrit dans l'abonnement. Toutes les machines virtuelles de FP2 sont en cours d'exécution.

    Vous disposez du rôle Owner sur l'abonnement. Vous devez inscrire FP2 dans le Centre Azure pour les solutions SAP. La solution doit respecter le principe du moindre privilège.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: mi, text: { en: "Create a user-assigned managed identity.", fr: "Créer une identité managée affectée par l'utilisateur." } }
    - { id: ra, text: { en: "Assign the identity the Azure Center for SAP solutions service role on rg-fp2-compute and the Reader role on rg-network.", fr: "Attribuer à l'identité le rôle Azure Center for SAP solutions service role sur rg-fp2-compute et le rôle Reader sur rg-network." } }
    - { id: reg, text: { en: "Select Register an existing SAP system, select the ASCS VM of FP2, and select the identity.", fr: "Sélectionner Register an existing SAP system, choisir la machine virtuelle ASCS de FP2, puis sélectionner l'identité." } }
    - { id: contrib, text: { en: "Assign the identity the Contributor role on the subscription.", fr: "Attribuer à l'identité le rôle Contributor sur l'abonnement." } }
    - { id: dealloc, text: { en: "Stop and deallocate the VMs of FP2.", fr: "Arrêter et libérer les machines virtuelles de FP2." } }
    - { id: ams, text: { en: "Deploy Azure Monitor for SAP solutions and add an SAP NetWeaver provider for FP2.", fr: "Déployer Azure Monitor pour solutions SAP et ajouter un fournisseur SAP NetWeaver pour FP2." } }
answer:
  sequence: [ mi, ra, reg ]
explanation:
  correct:
    en: |
      Registration uses a user-assigned managed identity that Azure Center for SAP solutions uses to install VM extensions and discover the SAP components. The identity needs the Azure Center for SAP solutions service role on the compute resource group and Reader on the virtual network resource group. You then register the system from its ASCS VM; the service discovers the other components.
    fr: |
      L'inscription utilise une identité managée affectée par l'utilisateur, que le Centre Azure pour les solutions SAP emploie pour installer des extensions de machine virtuelle et découvrir les composants SAP. L'identité a besoin du rôle Azure Center for SAP solutions service role sur le groupe de ressources de calcul et de Reader sur le groupe de ressources du réseau virtuel. Vous inscrivez ensuite le système à partir de sa machine virtuelle ASCS ; le service découvre les autres composants.
  options:
    contrib: { en: "Contributor on the subscription grants far more than the two documented role assignments.", fr: "Contributor sur l'abonnement accorde bien plus que les deux attributions de rôles documentées." }
    dealloc: { en: "The ASCS, application server and database VMs must be running during registration.", fr: "Les machines virtuelles ASCS, serveurs d'applications et base de données doivent être en cours d'exécution pendant l'inscription." }
    ams: { en: "Azure Monitor for SAP solutions is optional telemetry, not a registration prerequisite.", fr: "Azure Monitor pour solutions SAP est une télémétrie facultative, pas un prérequis de l'inscription." }
references:
  - title: Register an existing SAP system
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/register-existing-system
