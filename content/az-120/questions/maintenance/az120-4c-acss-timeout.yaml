id: az120-4c-acss-timeout
objective: "4.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware manages a large SAP system named **PP1** as a Virtual Instance for SAP solutions (VIS). You stop PP1 from the Azure portal.

    After five minutes, the portal reports that the stop operation was terminated. The status of the VIS still shows **Stopping**.

    You need to make sure that PP1 stops. The SAP instances must shut down gracefully.

    What should you do first?
  fr: |
    Proseware gère un grand système SAP nommé **PP1** en tant que Virtual Instance for SAP solutions (VIS). Vous arrêtez PP1 depuis le portail Azure.

    Au bout de cinq minutes, le portail signale que l'opération d'arrêt a été interrompue. L'état de la VIS indique toujours **Stopping**.

    Vous devez vous assurer que PP1 s'arrête. Les instances SAP doivent s'arrêter proprement.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Send a new stop request with `--soft-stop-timeout-seconds 0`.", fr: "Envoyer une nouvelle demande d'arrêt avec `--soft-stop-timeout-seconds 0`." } }
    - { id: b, text: { en: "Deallocate the virtual machines of PP1 by using `az vm deallocate`.", fr: "Libérer les machines virtuelles de PP1 avec `az vm deallocate`." } }
    - { id: c, text: { en: "Delete the VIS and register PP1 again.", fr: "Supprimer la VIS et inscrire PP1 de nouveau." } }
    - { id: d, text: { en: "Wait, and check the status of the VIS before you retry the stop.", fr: "Attendre, et vérifier l'état de la VIS avant de relancer l'arrêt." } }
answer: { optionId: d }
explanation:
  correct:
    en: A start or stop operation that takes longer than 300 seconds is terminated, but the SAP processes keep stopping and the monitoring service keeps updating the status of the VIS. Check the VIS status before you retry, because the system might reach the stopped state on its own.
    fr: Une opération de démarrage ou d'arrêt qui dure plus de 300 secondes est interrompue, mais les processus SAP continuent de s'arrêter et le service de supervision continue de mettre à jour l'état de la VIS. Vérifiez l'état de la VIS avant de relancer, car le système peut atteindre seul l'état arrêté.
  options:
    a: { en: "A timeout of 0 means a hard stop without waiting, which isn't graceful, and PP1 might already be stopping on its own.", fr: "Un délai de 0 signifie un arrêt immédiat sans attente, qui n'est pas propre, et PP1 est peut-être déjà en train de s'arrêter seul." }
    b: { en: "Deallocating the VMs can cut off SAP processes that are still shutting down.", fr: "Libérer les machines virtuelles peut interrompre des processus SAP encore en cours d'arrêt." }
    c: { en: "The VIS isn't broken: the timeout is expected behavior, and deleting it removes the management features.", fr: "La VIS n'est pas défaillante : le délai d'expiration est un comportement attendu, et la supprimer retire les fonctionnalités de gestion." }
references:
  - title: Start and stop SAP systems, instances, and HANA database
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/start-stop-sap-systems
