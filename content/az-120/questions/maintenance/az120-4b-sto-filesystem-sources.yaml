id: az120-4b-sto-filesystem-sources
objective: "4.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware runs SAP HANA 2.0 SPS 07 on a SUSE Linux Enterprise Server for SAP Azure VM. The /hana/data and /hana/shared file systems are on Premium SSD v2 disks. Proseware has an Azure Monitor for SAP solutions resource that can reach the VM.

    The operations team wants a workbook that shows how full the /hana/data and /hana/shared file systems are inside the VM.

    Which two data sources provide this information? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute SAP HANA 2.0 SPS 07 sur une machine virtuelle Azure SUSE Linux Enterprise Server for SAP. Les systèmes de fichiers /hana/data et /hana/shared se trouvent sur des disques SSD Premium v2. Proseware dispose d'une ressource Azure Monitor pour solutions SAP qui peut joindre la machine virtuelle.

    L'équipe d'exploitation veut un classeur qui montre le taux de remplissage des systèmes de fichiers /hana/data et /hana/shared dans la machine virtuelle.

    Quelles sont les deux sources de données qui fournissent cette information ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The Azure Monitor platform metrics of the Premium SSD v2 managed disks", fr: "Les métriques de plateforme Azure Monitor des disques managés SSD Premium v2" } }
    - { id: b, text: { en: "An OS (Linux) provider in Azure Monitor for SAP solutions", fr: "Un fournisseur Système d'exploitation (Linux) dans Azure Monitor pour solutions SAP" } }
    - { id: c, text: { en: "An HA cluster (Pacemaker) provider in Azure Monitor for SAP solutions", fr: "Un fournisseur de cluster HA (Pacemaker) dans Azure Monitor pour solutions SAP" } }
    - { id: d, text: { en: "An SAP HANA provider in Azure Monitor for SAP solutions", fr: "Un fournisseur SAP HANA dans Azure Monitor pour solutions SAP" } }
    - { id: e, text: { en: "The Data Disk Queue Depth metric of the VM", fr: "La métrique Data Disk Queue Depth de la machine virtuelle" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Managed disk metrics describe I/O against the disk; they don't know how full the file system inside the guest is. In Azure Monitor for SAP solutions, the OS (Linux) provider collects file system usage from the node exporter, and the SAP HANA provider collects file system use, disk use and database growth from the HANA database. Either one shows the fill level in a workbook.
    fr: |
      Les métriques des disques managés décrivent les E/S vers le disque ; elles ignorent le taux de remplissage du système de fichiers dans l'invité. Dans Azure Monitor pour solutions SAP, le fournisseur Système d'exploitation (Linux) collecte l'utilisation des systèmes de fichiers depuis le node exporter, et le fournisseur SAP HANA collecte l'utilisation des systèmes de fichiers, l'utilisation disque et la croissance de la base depuis la base HANA. L'un ou l'autre montre le taux de remplissage dans un classeur.
  options:
    a: { en: "Platform disk metrics report IOPS, throughput, latency and burst consumption, not the used space of a file system.", fr: "Les métriques de plateforme des disques indiquent les IOPS, le débit, la latence et la consommation de bursting, pas l'espace utilisé d'un système de fichiers." }
    c: { en: "The Pacemaker provider reports cluster node, resource and SBD status; the VM isn't described as clustered, and the provider has no file system data.", fr: "Le fournisseur Pacemaker indique l'état des nœuds, des ressources et de SBD du cluster ; la machine virtuelle n'est pas décrite comme membre d'un cluster, et le fournisseur n'a pas de données de systèmes de fichiers." }
    e: { en: "Queue depth counts outstanding I/O requests; it says nothing about used capacity.", fr: "La profondeur de file d'attente compte les requêtes d'E/S en attente ; elle ne dit rien de la capacité utilisée." }
references:
  - title: What is Azure Monitor for SAP solutions?
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/about-azure-monitor-sap-solutions
  - title: Disk metrics - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-metrics
