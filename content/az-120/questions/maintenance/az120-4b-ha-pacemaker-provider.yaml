id: az120-4b-ha-pacemaker-provider
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs a highly available SAP HANA database on two SUSE Linux Enterprise Server for SAP 15 SP5 VMs in a Pacemaker cluster with SBD fencing. Contoso already has an Azure Monitor for SAP solutions resource in the same virtual network.

    The operations team needs a workbook that shows the node and resource status of the cluster, the status of the SBD devices, and the quorum votes.

    Which provider should you add to the Azure Monitor for SAP solutions resource?
  fr: |
    Contoso exécute une base de données SAP HANA hautement disponible sur deux machines virtuelles SUSE Linux Enterprise Server for SAP 15 SP5 dans un cluster Pacemaker avec clôture SBD. Contoso dispose déjà d'une ressource Azure Monitor pour solutions SAP dans le même réseau virtuel.

    L'équipe d'exploitation a besoin d'un classeur qui affiche l'état des nœuds et des ressources du cluster, l'état des périphériques SBD et les votes de quorum.

    Quel fournisseur devez-vous ajouter à la ressource Azure Monitor pour solutions SAP ?
body:
  options:
    - { id: a, text: "SAP HANA" }
    - { id: b, text: { en: "Operating system (Linux)", fr: "Système d'exploitation (Linux)" } }
    - { id: c, text: { en: "High-availability cluster (Pacemaker)", fr: "Cluster à haute disponibilité (Pacemaker)" } }
    - { id: d, text: "SAP NetWeaver" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The high-availability Pacemaker cluster provider collects node, resource and SBD status, Pacemaker location constraints, quorum votes and ring status. It reads them from an HA cluster exporter installed on each cluster node, and you create one provider per node.
    fr: |
      Le fournisseur de cluster Pacemaker à haute disponibilité collecte l'état des nœuds, des ressources et de SBD, les contraintes d'emplacement Pacemaker, les votes de quorum et l'état des anneaux. Il les lit depuis un exportateur de cluster HA installé sur chaque nœud du cluster, et vous créez un fournisseur par nœud.
  options:
    a: { en: "The SAP HANA provider collects database data such as system replication, backups and resource use, not Pacemaker cluster status.", fr: "Le fournisseur SAP HANA collecte des données de base de données comme la réplication système, les sauvegardes et l'utilisation des ressources, pas l'état du cluster Pacemaker." }
    b: { en: "The OS (Linux) provider collects CPU, memory, disk and network data from the node exporter, not cluster status.", fr: "Le fournisseur Système d'exploitation (Linux) collecte des données processeur, mémoire, disque et réseau depuis le node exporter, pas l'état du cluster." }
    d: { en: "The SAP NetWeaver provider monitors SAP application instances and processes, not the database cluster.", fr: "Le fournisseur SAP NetWeaver supervise les instances et processus de l'application SAP, pas le cluster de base de données." }
references:
  - title: What is Azure Monitor for SAP solutions?
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/about-azure-monitor-sap-solutions
