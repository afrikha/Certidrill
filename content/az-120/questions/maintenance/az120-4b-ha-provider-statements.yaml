id: az120-4b-ha-provider-statements
objective: "4.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware is adding high-availability cluster (Pacemaker) providers to an Azure Monitor for SAP solutions resource for the HANA cluster of the SAP system **LP1**. The cluster nodes run SUSE Linux Enterprise Server for SAP 15 SP5, and HANA System Replication runs between them.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware ajoute des fournisseurs de cluster à haute disponibilité (Pacemaker) à une ressource Azure Monitor pour solutions SAP pour le cluster HANA du système SAP **LP1**. Les nœuds du cluster exécutent SUSE Linux Enterprise Server for SAP 15 SP5, et la réplication système HANA fonctionne entre eux.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The value of the Cluster field of each provider must match the cluster name configured in Pacemaker.
        fr: La valeur du champ Cluster de chaque fournisseur doit correspondre au nom du cluster configuré dans Pacemaker.
    - id: s2
      text:
        en: The HA Cluster Exporter Endpoint of each provider uses port 9664 on the node's IP address.
        fr: Le champ HA Cluster Exporter Endpoint de chaque fournisseur utilise le port 9664 de l'adresse IP du nœud.
    - id: s3
      text:
        en: To also chart the HANA System Replication status in Azure Monitor for SAP solutions, Litware adds an SAP HANA provider.
        fr: Pour représenter aussi l'état de la réplication système HANA dans Azure Monitor pour solutions SAP, Litware ajoute un fournisseur SAP HANA.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The Cluster field is a custom name for the SAP system cluster that appears in the workbook; it doesn't need to match the cluster name on the server. On SUSE, prometheus-ha_cluster_exporter listens on port 9664, so the endpoint is http://<ip-address>:9664/metrics. HANA System Replication status is part of the data collected by the SAP HANA provider, not by the Pacemaker provider.
    fr: |
      Le champ Cluster est un nom personnalisé du cluster du système SAP qui apparaît dans le classeur ; il n'a pas besoin de correspondre au nom du cluster sur le serveur. Sur SUSE, prometheus-ha_cluster_exporter écoute sur le port 9664 : le point de terminaison est donc http://<ip-address>:9664/metrics. L'état de la réplication système HANA fait partie des données collectées par le fournisseur SAP HANA, pas par le fournisseur Pacemaker.
references:
  - title: Create a high-availability cluster provider for Azure Monitor for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/provider-ha-pacemaker-cluster
  - title: What is Azure Monitor for SAP solutions?
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/about-azure-monitor-sap-solutions
