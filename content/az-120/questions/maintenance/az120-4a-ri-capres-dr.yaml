id: az120-4a-ri-capres-dr
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin is designing disaster recovery for an SAP system in a secondary Azure region. The DR VMs will be deployed only during DR tests and failovers. Tailspin wants guaranteed compute capacity for them in the secondary region without a one-year or three-year term, and plans to use on-demand capacity reservations.

    The planned DR VMs are:

    - The SAP HANA VM, size Standard_M128s
    - Two ASCS/ERS VMs in an availability set
    - Four zonal application server VMs, size Standard_E16ds_v5
    - Two zonal SAP Web Dispatcher VMs, size Standard_D4ds_v5

    Which two groups of VMs can't use on-demand capacity reservations?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin conçoit la reprise d'activité d'un système SAP dans une région Azure secondaire. Les machines virtuelles de reprise ne seront déployées que pendant les tests de reprise et les basculements. Tailspin veut une capacité de calcul garantie pour elles dans la région secondaire sans durée d'un an ou de trois ans, et prévoit d'utiliser des réservations de capacité à la demande.

    Les machines virtuelles de reprise prévues sont les suivantes :

    - La machine virtuelle SAP HANA, de taille Standard_M128s
    - Deux machines virtuelles ASCS/ERS dans un groupe à haute disponibilité
    - Quatre machines virtuelles zonales de serveur d'applications, de taille Standard_E16ds_v5
    - Deux machines virtuelles zonales SAP Web Dispatcher, de taille Standard_D4ds_v5

    Quels sont les deux groupes de machines virtuelles qui ne peuvent pas utiliser de réservations de capacité à la demande ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "The SAP HANA VM", fr: "La machine virtuelle SAP HANA" }
    - id: b
      text: { en: "The ASCS/ERS VMs", fr: "Les machines virtuelles ASCS/ERS" }
    - id: c
      text: { en: "The application server VMs", fr: "Les machines virtuelles de serveur d'applications" }
    - id: d
      text: { en: "The SAP Web Dispatcher VMs", fr: "Les machines virtuelles SAP Web Dispatcher" }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      On-demand capacity reservation isn't supported for some VM series, including M series v1, to which Standard_M128s belongs. It also isn't supported for VMs in availability sets or proximity placement groups. Zonal VMs of supported series, such as Edsv5 and Ddsv5, can consume a capacity reservation created for their size and zone.
    fr: |
      La réservation de capacité à la demande n'est pas prise en charge pour certaines séries de machines virtuelles, dont la série M v1, à laquelle appartient Standard_M128s. Elle n'est pas non plus prise en charge pour les machines virtuelles des groupes à haute disponibilité ou des groupes de placement de proximité. Les machines virtuelles zonales de séries prises en charge, comme Edsv5 et Ddsv5, peuvent consommer une réservation de capacité créée pour leur taille et leur zone.
  options:
    c: { en: "Edsv5 zonal VMs can use a capacity reservation for their size in the zone.", fr: "Les machines virtuelles zonales Edsv5 peuvent utiliser une réservation de capacité pour leur taille dans la zone." }
    d: { en: "Ddsv5 zonal VMs can use a capacity reservation for their size in the zone.", fr: "Les machines virtuelles zonales Ddsv5 peuvent utiliser une réservation de capacité pour leur taille dans la zone." }
references:
  - title: On-demand capacity reservation
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/capacity-reservation-overview
