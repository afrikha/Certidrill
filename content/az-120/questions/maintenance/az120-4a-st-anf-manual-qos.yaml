id: az120-4a-st-anf-manual-qos
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin runs SAP HANA on Azure VMs with Azure NetApp Files. A 6-TiB capacity pool at the Ultra service level (128 MiB/s per TiB) uses the auto QoS type and contains two volumes:

    - /hana/data: 4 TiB quota, needs 250 MiB/s
    - /hana/log: 512 GiB quota, needs 400 MiB/s

    Log writes are slow because the log volume receives only 64 MiB/s.

    You need to give each volume the throughput that it needs. The solution must not add capacity that the volumes don't need.

    What should you do?
  fr: |
    Tailspin exécute SAP HANA sur des machines virtuelles Azure avec Azure NetApp Files. Un pool de capacité de 6 Tio au niveau de service Ultra (128 Mio/s par Tio) utilise le type de QoS automatique et contient deux volumes :

    - /hana/data : quota de 4 Tio, a besoin de 250 Mio/s
    - /hana/log : quota de 512 Gio, a besoin de 400 Mio/s

    Les écritures de journaux sont lentes, car le volume de journaux ne reçoit que 64 Mio/s.

    Vous devez donner à chaque volume le débit dont il a besoin. La solution ne doit pas ajouter de capacité dont les volumes n'ont pas besoin.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Increase the quota of the /hana/log volume to 4 TiB and expand the capacity pool", fr: "Augmenter le quota du volume /hana/log à 4 Tio et agrandir le pool de capacité" }
    - id: b
      text: { en: "Move the /hana/log volume to an NFS share on Azure Files (SSD)", fr: "Déplacer le volume /hana/log vers un partage NFS sur Azure Files (SSD)" }
    - id: c
      text: { en: "Change the capacity pool to the manual QoS type and assign throughput to each volume", fr: "Passer le pool de capacité au type de QoS manuelle et attribuer un débit à chaque volume" }
    - id: d
      text: { en: "Enable Write Accelerator for the /hana/log volume", fr: "Activer Write Accelerator pour le volume /hana/log" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With auto QoS, a volume's throughput follows its quota, so 0.5 TiB at 128 MiB/s per TiB gives the log volume 64 MiB/s. With manual QoS, throughput is set independently of capacity within the pool's total, here 6 TiB × 128 MiB/s = 768 MiB/s, which covers 400 MiB/s for the log and 250 MiB/s for the data. Throughput can be changed without service interruption.
    fr: |
      Avec la QoS automatique, le débit d'un volume suit son quota : 0,5 Tio à 128 Mio/s par Tio donne 64 Mio/s au volume de journaux. Avec la QoS manuelle, le débit se définit indépendamment de la capacité, dans la limite du total du pool, ici 6 Tio × 128 Mio/s = 768 Mio/s, ce qui couvre 400 Mio/s pour les journaux et 250 Mio/s pour les données. Le débit peut être modifié sans interruption de service.
  options:
    a: { en: "A larger quota raises the throughput under auto QoS, but it pays for 3.5 TiB of log capacity that isn't needed.", fr: "Un quota plus grand augmente le débit en QoS automatique, mais il fait payer 3,5 Tio de capacité de journaux inutile." }
    b: { en: "Azure Files is supported for /hana/shared, not for the HANA log volume.", fr: "Azure Files est pris en charge pour /hana/shared, pas pour le volume de journaux HANA." }
    d: { en: "Write Accelerator is a feature of Azure managed disks; it doesn't apply to Azure NetApp Files volumes.", fr: "Write Accelerator est une fonctionnalité des disques managés Azure ; elle ne s'applique pas aux volumes Azure NetApp Files." }
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
