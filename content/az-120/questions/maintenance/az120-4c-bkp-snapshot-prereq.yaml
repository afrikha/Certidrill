id: az120-4c-bkp-snapshot-prereq
objective: "4.2.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum runs a standalone SAP HANA 2.0 SPS 07 instance on an Azure virtual machine named **hdb-ha1**. The data volumes use the xfs file system. No backup is configured yet. You have the Owner role on all the resource groups involved.

    You need to configure SAP HANA database instance snapshot backups for hdb-ha1 by using Azure Backup with the Standard policy subtype.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute une instance SAP HANA 2.0 SPS 07 autonome sur une machine virtuelle Azure nommée **hdb-ha1**. Les volumes de données utilisent le système de fichiers xfs. Aucune sauvegarde n'est encore configurée. Vous disposez du rôle Owner sur tous les groupes de ressources concernés.

    Vous devez configurer des sauvegardes par instantané d'instance de base de données SAP HANA pour hdb-ha1 avec Sauvegarde Azure et le sous-type de stratégie Standard.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Protect every database of the instance with a Database via Backint policy that has weekly full and log backups.", fr: "Protéger chaque base de données de l'instance avec une stratégie Database via Backint comportant des sauvegardes complètes hebdomadaires et des sauvegardes de journaux." } }
    - { id: b, text: { en: "Add daily differential backups to the Database via Backint policy of the databases.", fr: "Ajouter des sauvegardes différentielles quotidiennes à la stratégie Database via Backint des bases de données." } }
    - { id: c, text: { en: "Set the frequency of the DB Instance via snapshot policy to every four hours.", fr: "Définir la fréquence de la stratégie DB Instance via snapshot sur toutes les quatre heures." } }
    - { id: d, text: { en: "Assign the Disk Snapshot Contributor role on the snapshot resource group to the Backup Management Service.", fr: "Attribuer le rôle Disk Snapshot Contributor sur le groupe de ressources des instantanés au service Backup Management Service." } }
    - { id: e, text: { en: "Assign the Disk Backup Reader role on the snapshot resource group to the Backup Management Service.", fr: "Attribuer le rôle Disk Backup Reader sur le groupe de ressources des instantanés au service Backup Management Service." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Before you configure DB Instance via snapshot, every database of the instance must be protected by a Database via Backint policy with weekly full and log backups; logs are replayed over the snapshot at restore. The portal assigns the roles of the VM's managed identity, but you must assign Disk Snapshot Contributor on the snapshot resource group to the Backup Management Service yourself so that it can delete old snapshots.
    fr: Avant de configurer DB Instance via snapshot, chaque base de données de l'instance doit être protégée par une stratégie Database via Backint avec des sauvegardes complètes hebdomadaires et des sauvegardes de journaux ; les journaux sont rejoués sur l'instantané lors de la restauration. Le portail attribue les rôles de l'identité managée de la machine virtuelle, mais vous devez attribuer vous-même Disk Snapshot Contributor sur le groupe de ressources des instantanés au service Backup Management Service pour qu'il puisse supprimer les anciens instantanés.
  options:
    b: { en: "The database policy must not use differential or incremental backups when instance snapshots are used.", fr: "La stratégie de base de données ne doit utiliser ni sauvegardes différentielles ni incrémentielles quand des instantanés d'instance sont utilisés." }
    c: { en: "Instance snapshots run once a day only.", fr: "Les instantanés d'instance ne s'exécutent qu'une fois par jour." }
    e: { en: "Disk Backup Reader goes to the VM's managed identity on the source disk resource group, not to the Backup Management Service.", fr: "Disk Backup Reader est attribué à l'identité managée de la machine virtuelle sur le groupe de ressources des disques sources, pas au service Backup Management Service." }
references:
  - title: Back up SAP HANA database instances on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-instances-backup
