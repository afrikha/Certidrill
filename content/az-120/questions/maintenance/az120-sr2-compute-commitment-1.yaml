id: az120-sr2-compute-commitment-1
objective: "4.1.3"
type: series_yesno
series: az120-sr2-compute-commitment
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: |
    You buy Reserved VM Instances optimized for instance size flexibility.
  fr: |
    Vous achetez des instances de machines virtuelles réservées optimisées pour la flexibilité de taille d'instance.
body:
  solution:
    en: |
      You purchase three-year **Reserved VM Instances** for 24 Standard_E32ds_v5 VMs in **West Europe**, optimized for **instance size flexibility**.
    fr: |
      Vous achetez des **instances de machines virtuelles réservées** de trois ans pour 24 machines virtuelles Standard_E32ds_v5 dans **West Europe**, optimisées pour la **flexibilité de taille d'instance**.
answer: { value: false }
explanation:
  correct:
    en: |
      A reservation applies only to the region and the instance family that you buy it for. Instance size flexibility extends the discount to other sizes of the same flexibility group, not to a newer VM series or to Sweden Central, so the discount would stop applying unless Woodgrove exchanges the reservation.
    fr: |
      Une réservation s'applique uniquement à la région et à la famille d'instances pour lesquelles vous l'achetez. La flexibilité de taille d'instance étend la remise aux autres tailles du même groupe de flexibilité, pas à une série de machines virtuelles plus récente ni à Sweden Central : la remise cesserait de s'appliquer, sauf si Woodgrove échange la réservation.
references:
  - title: Virtual machine size flexibility with Reserved VM Instances
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/reserved-vm-instance-size-flexibility
  - title: Decide between a savings plan and a reservation
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
