id: az120-4a-st-pssdv2-migrate
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a production SAP HANA database on a zonal Azure VM. The /hana/data volume is on a single P40 Premium SSD disk (2 TiB). The P40 size was chosen only for its throughput; the data uses about 800 GiB and isn't expected to exceed 1 TiB. The volume needs 250 MBps and no more than 3,000 IOPS.

    You need to reduce the storage cost of /hana/data while keeping the required performance and a configuration supported for SAP HANA.

    What should you do?
  fr: |
    Contoso exécute une base de données SAP HANA de production sur une machine virtuelle Azure zonale. Le volume /hana/data se trouve sur un seul disque SSD Premium P40 (2 Tio). La taille P40 a été choisie uniquement pour son débit ; les données occupent environ 800 Gio et ne devraient pas dépasser 1 Tio. Le volume a besoin de 250 Mo/s et de 3 000 IOPS au maximum.

    Vous devez réduire le coût de stockage de /hana/data tout en conservant les performances nécessaires et une configuration prise en charge pour SAP HANA.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Reduce the size of the P40 disk to 1 TiB", fr: "Réduire la taille du disque P40 à 1 Tio" }
    - id: b
      text: { en: "Move the data to a 1-TiB Premium SSD v2 disk with 250 MBps of provisioned throughput", fr: "Déplacer les données vers un disque SSD Premium v2 de 1 Tio avec 250 Mo/s de débit provisionné" }
    - id: c
      text: { en: "Move the data to a 1-TiB Ultra Disk with 250 MBps of provisioned throughput", fr: "Déplacer les données vers un disque Ultra de 1 Tio avec 250 Mo/s de débit provisionné" }
    - id: d
      text: { en: "Move the data to a 1-TiB Standard SSD disk", fr: "Déplacer les données vers un disque SSD Standard de 1 Tio" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Premium SSD v2 is billed per provisioned GiB, includes 3,000 IOPS and 125 MBps, and lets you buy extra IOPS and throughput separately from capacity. A 1-TiB disk with 250 MBps avoids paying for the unused terabyte of the P40, and Premium SSD v2 passes SAP HANA certification without Write Accelerator or other caches. In most regions, it attaches only to zonal VMs, which Contoso uses.
    fr: |
      SSD Premium v2 est facturé par Gio provisionné, inclut 3 000 IOPS et 125 Mo/s, et permet d'acheter des IOPS et du débit supplémentaires indépendamment de la capacité. Un disque de 1 Tio avec 250 Mo/s évite de payer le téraoctet inutilisé du P40, et SSD Premium v2 obtient la certification SAP HANA sans Write Accelerator ni autre cache. Dans la plupart des régions, il ne s'attache qu'à des machines virtuelles zonales, ce qui est le cas chez Contoso.
  options:
    a: { en: "A managed disk can't be shrunk, and a 1-TiB Premium SSD (P30) offers only 200 MBps.", fr: "Un disque managé ne peut pas être réduit, et un SSD Premium de 1 Tio (P30) n'offre que 200 Mo/s." }
    c: { en: "Ultra Disk would meet the performance, but its cost is higher than Premium storage.", fr: "Le disque Ultra respecterait les performances, mais son coût est supérieur à celui du stockage Premium." }
    d: { en: "Standard SSD offers up to 500 IOPS per disk with no SLA and is meant for low-demand non-production systems.", fr: "SSD Standard offre jusqu'à 500 IOPS par disque sans SLA et est destiné aux systèmes hors production peu exigeants." }
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
  - title: Select a disk type for Azure IaaS VMs - managed disks
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types
