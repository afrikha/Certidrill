id: az120-4b-net-traffic-analytics
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware runs its SAP landscape in a virtual network named **VNET-SAP** that is connected to the on-premises network by ExpressRoute. The network team wants to see which hosts exchange the most traffic between the SAP subnets and on-premises, and how the volumes change over several weeks. No flow logging is configured today.

    You need to provide this visibility.

    What should you configure?
  fr: |
    Litware exécute son paysage SAP dans un réseau virtuel nommé **VNET-SAP** connecté au réseau local par ExpressRoute. L'équipe réseau veut voir quels hôtes échangent le plus de trafic entre les sous-réseaux SAP et le site local, et comment les volumes évoluent sur plusieurs semaines. Aucune journalisation des flux n'est configurée aujourd'hui.

    Vous devez fournir cette visibilité.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "NSG flow logs on the NSGs of the SAP subnets, with traffic analytics", fr: "Des journaux de flux NSG sur les NSG des sous-réseaux SAP, avec traffic analytics" } }
    - { id: b, text: { en: "A connection monitor between the SAP subnets and on-premises hosts", fr: "Un moniteur de connexion entre les sous-réseaux SAP et des hôtes locaux" } }
    - { id: c, text: { en: "Virtual network flow logs for VNET-SAP, with traffic analytics", fr: "Des journaux de flux de réseau virtuel pour VNET-SAP, avec traffic analytics" } }
    - { id: d, text: { en: "Packet capture sessions on the SAP application server VMs", fr: "Des sessions de capture de paquets sur les machines virtuelles de serveurs d'applications SAP" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Virtual network flow logs record the IP flows of the workloads in the virtual network and store them in a storage account; traffic analytics processes them into a Log Analytics workspace and visualizes top talkers and traffic volumes over time. NSG flow logs retire on September 30, 2027 and no longer accept new creations.
    fr: |
      Les journaux de flux de réseau virtuel enregistrent les flux IP des charges de travail du réseau virtuel et les stockent dans un compte de stockage ; traffic analytics les traite dans un espace de travail Log Analytics et visualise les principaux émetteurs et les volumes de trafic dans le temps. Les journaux de flux NSG sont mis hors service le 30 septembre 2027 et n'acceptent plus de nouvelles créations.
  options:
    a: { en: "NSG flow logs are retiring and no longer support new creations; virtual network flow logs replace them.", fr: "Les journaux de flux NSG sont en cours de mise hors service et n'acceptent plus de nouvelles créations ; les journaux de flux de réseau virtuel les remplacent." }
    b: { en: "Connection monitor measures reachability and round-trip time between chosen endpoints; it doesn't record traffic volumes per host.", fr: "Le moniteur de connexion mesure l'accessibilité et le temps d'aller-retour entre des points de terminaison choisis ; il n'enregistre pas les volumes de trafic par hôte." }
    d: { en: "Packet capture records packets on specific VMs for a limited session; it isn't designed for weeks of traffic analysis across subnets.", fr: "La capture de paquets enregistre les paquets de machines virtuelles précises pendant une session limitée ; elle n'est pas conçue pour analyser des semaines de trafic entre sous-réseaux." }
references:
  - title: Virtual Network Flow Logs - Azure Network Watcher
    url: https://learn.microsoft.com/en-us/azure/network-watcher/vnet-flow-logs-overview
  - title: NSG Flow Logs Overview - Azure Network Watcher
    url: https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-overview
