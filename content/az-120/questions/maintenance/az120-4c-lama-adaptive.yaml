id: az120-4c-lama-adaptive
objective: "4.2.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove plans to use SAP LaMa with the Azure connector to relocate the ASCS and application server instances of SAP systems that run on SUSE Linux Enterprise Server virtual machines. The instances use virtual host names.

    You need to prepare the environment so that the prepare, unprepare and relocate operations succeed.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove prévoit d'utiliser SAP LaMa avec le connecteur Azure pour déplacer les instances ASCS et de serveur d'applications de systèmes SAP qui s'exécutent sur des machines virtuelles SUSE Linux Enterprise Server. Les instances utilisent des noms d'hôtes virtuels.

    Vous devez préparer l'environnement pour que les opérations prepare, unprepare et relocate réussissent.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Place the LaMa-managed VMs in a separate subnet and use static IP address allocation.", fr: "Placer les machines virtuelles gérées par LaMa dans un sous-réseau distinct et utiliser l'allocation statique des adresses IP." } }
    - { id: b, text: { en: "Use dynamic IP address allocation so that the addresses of unprepared instances are released.", fr: "Utiliser l'allocation dynamique des adresses IP pour libérer les adresses des instances non préparées." } }
    - { id: c, text: { en: "Disable `CLOUD_NETCONFIG_MANAGE` on the SUSE VMs.", fr: "Désactiver `CLOUD_NETCONFIG_MANAGE` sur les machines virtuelles SUSE." } }
    - { id: d, text: { en: "Enable `CLOUD_NETCONFIG_MANAGE` so that SUSE manages the virtual IP addresses.", fr: "Activer `CLOUD_NETCONFIG_MANAGE` pour que SUSE gère les adresses IP virtuelles." } }
    - { id: e, text: { en: "Enable Automatic Mountpoint Creation in the LaMa engine settings.", fr: "Activer Automatic Mountpoint Creation dans les paramètres du moteur LaMa." } }
    - { id: f, text: { en: "Install more VM extensions on each VM to speed up disk detach operations.", fr: "Installer davantage d'extensions de machine virtuelle sur chaque machine virtuelle pour accélérer le détachement des disques." } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: A separate subnet without dynamic allocation keeps the IP addresses of unprepared instances from being given to other VMs. On SUSE, `CLOUD_NETCONFIG_MANAGE` must be disabled so that the OS doesn't remove the virtual IP addresses that SAPACEXT adds. Automatic Mountpoint Creation (Setup > Settings > Engine) creates the mount points that SAPACEXT needs when it mounts volumes.
    fr: Un sous-réseau distinct sans allocation dynamique évite que les adresses IP des instances non préparées soient attribuées à d'autres machines virtuelles. Sur SUSE, `CLOUD_NETCONFIG_MANAGE` doit être désactivé pour que le système d'exploitation ne retire pas les adresses IP virtuelles ajoutées par SAPACEXT. Automatic Mountpoint Creation (Setup > Settings > Engine) crée les points de montage dont SAPACEXT a besoin pour monter les volumes.
  options:
    b: { en: "With dynamic allocation, the addresses of unprepared instances can be allocated to other VMs, and preparation fails.", fr: "Avec l'allocation dynamique, les adresses des instances non préparées peuvent être attribuées à d'autres machines virtuelles, et la préparation échoue." }
    d: { en: "Microsoft documents disabling this setting, not enabling it.", fr: "Microsoft documente la désactivation de ce paramètre, pas son activation." }
    f: { en: "VM extensions can cause long disk detach times; Microsoft recommends removing them where possible.", fr: "Les extensions de machine virtuelle peuvent allonger le détachement des disques ; Microsoft recommande de les supprimer si possible." }
references:
  - title: Set up the SAP LaMa connector for Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/lama-installation
