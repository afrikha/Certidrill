id: az120-4c-lama-mi-fields
objective: "4.2.9"
type: dropdown
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    Litware runs SAP LaMa Enterprise Edition on an Azure virtual machine named **vm-lama01**. vm-lama01 has a system-assigned managed identity that has the Contributor role on the resource groups of the SAP systems.

    You add a Microsoft Azure Cloud Adapter in LaMa, select **Use Managed Identity**, and enter the subscription ID and the tenant ID.

    How should you complete the other fields? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware exécute SAP LaMa Enterprise Edition sur une machine virtuelle Azure nommée **vm-lama01**. vm-lama01 dispose d'une identité managée affectée par le système qui a le rôle Contributor sur les groupes de ressources des systèmes SAP.

    Vous ajoutez un Microsoft Azure Cloud Adapter dans LaMa, sélectionnez **Use Managed Identity**, puis saisissez l'ID d'abonnement et l'ID de locataire.

    Comment devez-vous compléter les autres champs ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      User Name: [[un]]

      Password: [[pw]]

      Monitoring Interval (Seconds): [[mon]]
    fr: |
      User Name : [[un]]

      Password : [[pw]]

      Monitoring Interval (Seconds) : [[mon]]
  slots:
    - id: un
      options:
        - { id: subid, text: { en: "The subscription ID", fr: "L'ID d'abonnement" } }
        - { id: vmname, text: { en: "The name of vm-lama01", fr: "Le nom de vm-lama01" } }
        - { id: empty, text: { en: "Leave empty", fr: "Laisser vide" } }
        - { id: tenant, text: { en: "The tenant ID", fr: "L'ID de locataire" } }
    - id: pw
      options:
        - { id: secret, text: { en: "A client secret of an app registration", fr: "Une clé secrète client d'une inscription d'application" } }
        - { id: empty, text: { en: "Leave empty", fr: "Laisser vide" } }
        - { id: admin, text: { en: "The administrator password of vm-lama01", fr: "Le mot de passe d'administrateur de vm-lama01" } }
    - id: mon
      options:
        - { id: s60, text: "60" }
        - { id: s120, text: "120" }
        - { id: s300, text: "300" }
answer:
  values: { un: empty, pw: empty, mon: s300 }
explanation:
  correct:
    en: With a system-assigned managed identity, you select Use Managed Identity and leave User Name and Password empty; for a user-assigned identity, you would enter its ID as the User Name. The Monitoring Interval must be at least 300 seconds.
    fr: "Avec une identité managée affectée par le système, vous sélectionnez Use Managed Identity et laissez User Name et Password vides ; pour une identité affectée par l'utilisateur, vous saisiriez son ID comme User Name. Le Monitoring Interval doit être d'au moins 300 secondes."
  options:
    secret: { en: "A client secret is the password of a service principal, not of a managed identity.", fr: "Une clé secrète client est le mot de passe d'un principal de service, pas d'une identité managée." }
    s60: { en: "The connector requires a monitoring interval of at least 300 seconds.", fr: "Le connecteur exige un intervalle de surveillance d'au moins 300 secondes." }
    s120: { en: "The connector requires a monitoring interval of at least 300 seconds.", fr: "Le connecteur exige un intervalle de surveillance d'au moins 300 secondes." }
references:
  - title: Set up the SAP LaMa connector for Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/lama-installation
