id: az120-4c-ams-subnet
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs SAP S/4HANA on Azure virtual machines in a virtual network named **vnet-sap-prd** in the West Europe region.

    You plan to deploy Azure Monitor for SAP solutions in a new subnet of a virtual network named **vnet-mgmt-weu**. vnet-mgmt-weu is in West Europe and is peered with vnet-sap-prd.

    You need to prepare the subnet for the Azure Monitor for SAP solutions resource.

    Which subnet configuration should you use?
  fr: |
    Contoso exécute SAP S/4HANA sur des machines virtuelles Azure dans un réseau virtuel nommé **vnet-sap-prd**, dans la région West Europe.

    Vous prévoyez de déployer Azure Monitor pour solutions SAP dans un nouveau sous-réseau d'un réseau virtuel nommé **vnet-mgmt-weu**. vnet-mgmt-weu se trouve dans West Europe et est relié à vnet-sap-prd par un peering.

    Vous devez préparer le sous-réseau pour la ressource Azure Monitor pour solutions SAP.

    Quelle configuration de sous-réseau devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "A /26 IPv4 subnet delegated to Microsoft.Web/serverFarms", fr: "Un sous-réseau IPv4 /26 délégué à Microsoft.Web/serverFarms" }
    - id: b
      text: { en: "A /25 IPv4 subnet delegated to Microsoft.ContainerInstance/containerGroups", fr: "Un sous-réseau IPv4 /25 délégué à Microsoft.ContainerInstance/containerGroups" }
    - id: c
      text: { en: "A /25 IPv4 subnet delegated to Microsoft.Web/serverFarms", fr: "Un sous-réseau IPv4 /25 délégué à Microsoft.Web/serverFarms" }
    - id: d
      text: { en: "A /25 IPv4 subnet with no delegation and a Microsoft.Storage service endpoint", fr: "Un sous-réseau IPv4 /25 sans délégation, avec un point de terminaison de service Microsoft.Storage" }
answer: { optionId: c }
explanation:
  correct:
    en: The data collection engine of Azure Monitor for SAP solutions is Azure Functions, which is integrated into the virtual network. The subnet must be IPv4 /25 or larger, because at least 100 IP addresses are needed, and it must be delegated to Microsoft.Web/serverFarms.
    fr: Le moteur de collecte de données d'Azure Monitor pour solutions SAP est Azure Functions, intégré au réseau virtuel. Le sous-réseau doit être un IPv4 /25 ou plus grand, car au moins 100 adresses IP sont nécessaires, et il doit être délégué à Microsoft.Web/serverFarms.
  options:
    a: { en: "A /26 provides fewer addresses than the /25 minimum required by the monitoring resources.", fr: "Un /26 fournit moins d'adresses que le minimum /25 exigé par les ressources de supervision." }
    b: { en: "The subnet is used by Azure Functions, so it must be delegated to Microsoft.Web/serverFarms, not to Azure Container Instances.", fr: "Le sous-réseau est utilisé par Azure Functions : il doit être délégué à Microsoft.Web/serverFarms, pas à Azure Container Instances." }
    d: { en: "A service endpoint doesn't replace the Microsoft.Web/serverFarms delegation that the Azure Functions integration requires.", fr: "Un point de terminaison de service ne remplace pas la délégation à Microsoft.Web/serverFarms qu'exige l'intégration d'Azure Functions." }
references:
  - title: Set up a network for Azure Monitor for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/set-up-network
  - title: "Quickstart: Deploy Azure Monitor for SAP solutions using the Azure portal"
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/quickstart-portal
