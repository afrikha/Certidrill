id: az120-sr1-commitments-1
objective: "4.1.3"
type: series_yesno
series: az120-sr1-commitments
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |-
    You buy reservations for production and a savings plan for non-production.
  fr: |-
    Vous achetez des réservations pour la production et un plan d'économies pour la hors production.
body:
  solution:
    en: |-
      You buy three-year **Azure Reserved Virtual Machine Instances** in West Europe for the VM sizes of the production VMs. You buy a three-year **Azure savings plan for compute** whose hourly commitment matches the steady compute spend of the non-production VMs.
    fr: |-
      Vous achetez des **instances de machines virtuelles réservées Azure** de trois ans dans West Europe pour les tailles des machines virtuelles de production. Vous achetez un **plan d'économies de calcul Azure** de trois ans dont l'engagement horaire correspond aux dépenses de calcul stables des machines virtuelles hors production.
answer: { value: true }
explanation:
  correct:
    en: |-
      Reservations suit workloads that run continuously with no change of instance family or region, and they provide the greatest savings when fully utilized. A savings plan applies to eligible compute usage in any region and across VM series up to its hourly commitment, so the non-production discount follows the move to Sweden Central and the resizing without any change to the commitment.
    fr: |-
      Les réservations conviennent aux charges de travail qui s'exécutent en continu sans changement de famille d'instances ni de région, et elles offrent les économies les plus importantes lorsqu'elles sont entièrement utilisées. Un plan d'économies s'applique à l'utilisation de calcul éligible dans toutes les régions et toutes les séries de machines virtuelles jusqu'à son engagement horaire : la remise hors production suit le déplacement vers Sweden Central et le redimensionnement sans modifier l'engagement.
references:
  - title: Decide between a savings plan and a reservation
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
