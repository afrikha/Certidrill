seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You stop the VIS with the VM deallocation option.
  fr: |
    Vous arrêtez la VIS avec l'option de libération des machines virtuelles.
body:
  solution:
    en: |
      You assign the **Virtual Machine Contributor** role to the user-assigned managed identity of the VIS on the resource group that contains the QAS VMs, and you run the following command.

      ```bash
      az workloads sap-virtual-instance stop -g rg-qas -n QAS --deallocate-vm
      ```
    fr: |
      Vous attribuez le rôle **Virtual Machine Contributor** à l'identité managée affectée par l'utilisateur de la VIS sur le groupe de ressources qui contient les machines virtuelles de QAS, puis vous exécutez la commande suivante.

      ```bash
      az workloads sap-virtual-instance stop -g rg-qas -n QAS --deallocate-vm
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      Stopping the VIS with VM deallocation covers the SAP application tier only: the ASCS and application server instances are stopped and their three VMs are deallocated. The HANA database and its VM are handled by the separate stop action of the database instance, so the HANA VM keeps running.
    fr: |
      L'arrêt de la VIS avec libération des machines virtuelles ne couvre que la couche Application SAP : les instances ASCS et de serveur d'applications sont arrêtées et leurs trois machines virtuelles sont libérées. La base de données HANA et sa machine virtuelle relèvent de l'action d'arrêt distincte de l'instance de base de données : la machine virtuelle HANA continue de fonctionner.
references:
  - title: Start and stop SAP systems, instances, HANA database, and underlying VMs
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/stop-start-sap-and-underlying-vm
