id: az120-4a-adv-workbook-location
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has an SAP system named **PW1** registered as a Virtual Instance for SAP solutions (VIS) in Azure Center for SAP solutions.

    You need to view, for PW1 only, the VMs that don't have Azure Backup configured and whether accelerated networking is enabled on each NIC.

    What should you use?
  fr: |
    Proseware dispose d'un système SAP nommé **PW1** inscrit en tant que Virtual Instance for SAP solutions (VIS) dans Azure Center for SAP solutions.

    Vous devez afficher, pour PW1 uniquement, les machines virtuelles pour lesquelles Sauvegarde Azure n'est pas configurée et l'état de la mise en réseau accélérée sur chaque carte réseau.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "The Configuration Checks tab of the Quality Insights workbook of the VIS", fr: "L'onglet Configuration Checks du classeur Quality Insights de la VIS" }
    - id: b
      text: { en: "The Performance tab of VM insights for the PW1 VMs", fr: "L'onglet Performance de VM Insights pour les machines virtuelles de PW1" }
    - id: c
      text: { en: "The Advisor score page of the subscription", fr: "La page Advisor score de l'abonnement" }
    - id: d
      text: { en: "The Backup center view of the Recovery Services vault", fr: "La vue Backup center du coffre Recovery Services" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Quality Insights workbook, under Monitoring in the VIS, has a Configuration Checks tab with Accelerated Networking, Public IP, Backup and Load Balancer sections. The Backup section lists the VMs of the VIS without Azure Backup, and the Accelerated Networking section shows the setting of each NIC.
    fr: |
      Le classeur Quality Insights, sous Supervision dans la VIS, comporte un onglet Configuration Checks avec les sections Accelerated Networking, Public IP, Backup et Load Balancer. La section Backup liste les machines virtuelles de la VIS sans Sauvegarde Azure, et la section Accelerated Networking affiche le paramètre de chaque carte réseau.
  options:
    b: { en: "VM insights shows guest performance counters, not the backup or accelerated networking configuration of the SAP system.", fr: "VM Insights affiche des compteurs de performances invités, pas la configuration de la sauvegarde ni de la mise en réseau accélérée du système SAP." }
    c: { en: "Advisor score summarizes how well a subscription follows recommendations; it isn't scoped to one SAP system.", fr: "Advisor score résume dans quelle mesure un abonnement suit les recommandations ; il n'est pas limité à un système SAP." }
    d: { en: "A vault shows only the items it protects, so it doesn't list the VMs without backup together with their NIC settings.", fr: "Un coffre n'affiche que les éléments qu'il protège : il ne liste pas les machines virtuelles sans sauvegarde avec les paramètres de leurs cartes réseau." }
references:
  - title: View quality checks and insights for a Virtual Instance for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/get-quality-checks-insights
