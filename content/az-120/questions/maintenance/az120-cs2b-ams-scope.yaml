id: az120-cs2b-ams-scope
objective: "4.2.5"
type: yesno_statements
caseStudy: az120-cs2b-wingtip
difficulty: 1
status: draft
stem:
  en: |
    You are planning the use of Azure Monitor for SAP solutions for Wingtip. The solution must meet the monitoring requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous planifiez l'utilisation d'Azure Monitor pour solutions SAP chez Wingtip. La solution doit respecter les exigences de supervision.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can add an SAP HANA provider to Azure Monitor for SAP solutions to monitor the HANA database of WB1.
        fr: Vous pouvez ajouter un fournisseur SAP HANA à Azure Monitor pour solutions SAP pour superviser la base de données HANA de WB1.
    - id: s2
      text:
        en: You can add an SAP NetWeaver provider to Azure Monitor for SAP solutions to monitor the application servers of WS1.
        fr: Vous pouvez ajouter un fournisseur SAP NetWeaver à Azure Monitor pour solutions SAP pour superviser les serveurs d'applications de WS1.
    - id: s3
      text:
        en: You can register WS1 in Azure Center for SAP solutions to view its health and status in the Azure portal.
        fr: Vous pouvez inscrire WS1 dans le Centre Azure pour les solutions SAP pour afficher son intégrité et son état dans le portail Azure.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: WB1 runs on VMs in Wingtip's own subscription, so Azure Monitor for SAP solutions can monitor its HANA database with an SAP HANA provider. SAP RISE/ECS does not support any integration with Azure Monitor for SAP solutions, nor with Azure Center for SAP solutions in any capability, because SAP manages those systems in its own subscription.
    fr: WB1 s'exécute sur des machines virtuelles de l'abonnement de Wingtip ; Azure Monitor pour solutions SAP peut donc superviser sa base HANA avec un fournisseur SAP HANA. SAP RISE/ECS ne prend en charge aucune intégration avec Azure Monitor pour solutions SAP, ni avec le Centre Azure pour les solutions SAP, car SAP gère ces systèmes dans son propre abonnement.
references:
  - title: Azure identity and security services with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-security
  - title: What is Azure Monitor for SAP solutions?
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/about-azure-monitor-sap-solutions
