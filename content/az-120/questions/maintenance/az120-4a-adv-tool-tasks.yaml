id: az120-4a-adv-tool-tasks
objective: "4.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip runs several SAP systems on Azure. All of them are registered in Azure Center for SAP solutions. The operations team wants to use Azure Advisor and related tools to optimize the SAP workloads.

    Which tool should you use for each task? To answer, drag the appropriate tools to the correct tasks. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip exécute plusieurs systèmes SAP sur Azure. Tous sont inscrits dans Azure Center for SAP solutions. L'équipe d'exploitation veut utiliser Azure Advisor et les outils associés pour optimiser les charges de travail SAP.

    Quel outil devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les outils appropriés vers les tâches correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: alert, text: { en: "An Azure Advisor alert", fr: "Une alerte Azure Advisor" } }
    - { id: qi, text: { en: "The Quality Insights workbook", fr: "Le classeur Quality Insights" } }
    - { id: cfg, text: { en: "The Advisor Configuration page", fr: "La page Configuration d'Advisor" } }
    - { id: ams, text: { en: "Azure Monitor for SAP solutions", fr: "Azure Monitor for SAP solutions" } }
    - { id: budget, text: { en: "A Cost Management budget", fr: "Un budget Cost Management" } }
  targets:
    - id: notify
      text: { en: "Be notified when Advisor generates a new recommendation for the SAP VMs", fr: "Être averti quand Advisor génère une nouvelle recommandation pour les machines virtuelles SAP" }
    - id: inventory
      text: { en: "Review the SKU, OS image version and extension status of each VM of one SAP system", fr: "Examiner le SKU, la version de l'image du système d'exploitation et l'état des extensions de chaque machine virtuelle d'un système SAP" }
    - id: threshold
      text: { en: "Change the CPU threshold used to filter the right-sizing recommendations of a subscription", fr: "Modifier le seuil de processeur utilisé pour filtrer les recommandations de redimensionnement d'un abonnement" }
    - id: hana
      text: { en: "Collect SAP HANA database metrics over time from the database host", fr: "Collecter dans le temps les métriques de la base de données SAP HANA depuis l'hôte de base de données" }
answer:
  mapping: { notify: alert, inventory: qi, threshold: cfg, hana: ams }
explanation:
  correct:
    en: |
      Because the SAP quality checks are integrated with Advisor, you can create Advisor alerts on new recommendations. The Virtual Machine tab of the Quality Insights workbook lists the SKU, OS image, extensions and their status for the VMs of a VIS. The CPU threshold filter is set per subscription in the Advisor Configuration page. Azure Monitor for SAP solutions collects telemetry such as SAP HANA metrics through its providers.
    fr: |
      Comme les contrôles qualité SAP sont intégrés à Advisor, vous pouvez créer des alertes Advisor sur les nouvelles recommandations. L'onglet Virtual Machine du classeur Quality Insights liste le SKU, l'image du système d'exploitation, les extensions et leur état pour les machines virtuelles d'une VIS. Le filtre de seuil de processeur se définit par abonnement dans la page Configuration d'Advisor. Azure Monitor for SAP solutions collecte des données de télémétrie comme les métriques SAP HANA au moyen de ses fournisseurs.
  options:
    budget: { en: "A budget alerts on cost thresholds; it doesn't report recommendations, VM inventory or HANA metrics.", fr: "Un budget alerte sur des seuils de coûts ; il ne signale ni recommandations, ni inventaire des machines virtuelles, ni métriques HANA." }
references:
  - title: View quality checks and insights for a Virtual Instance for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/get-quality-checks-insights
  - title: Create Azure Advisor alerts on new recommendations by using the Azure portal
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-alerts-portal
