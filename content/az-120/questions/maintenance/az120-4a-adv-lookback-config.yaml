id: az120-4a-adv-lookback-config
objective: "4.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs the SAP application servers of an SAP ERP system on Azure VMs. The CPU usage of the VMs is low for most of the month and peaks during the month-end close. Azure Advisor recommends smaller sizes for the VMs because its analysis currently covers only the last seven days.

    You need Advisor to base its right-sizing recommendations on the shortest period that covers at least the last two months of usage. You also need to know when the new recommendations can be expected.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute les serveurs d'applications d'un système SAP ERP sur des machines virtuelles Azure. L'utilisation du processeur des machines virtuelles est faible la plus grande partie du mois et culmine pendant la clôture mensuelle. Azure Advisor recommande des tailles inférieures pour les machines virtuelles, car son analyse ne couvre actuellement que les sept derniers jours.

    Vous devez faire en sorte qu'Advisor base ses recommandations de redimensionnement sur la période la plus courte qui couvre au moins les deux derniers mois d'utilisation. Vous devez aussi savoir quand les nouvelles recommandations peuvent être attendues.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In Azure Advisor, open [[where]].
      Set the lookback period to [[period]].
      Expect the updated recommendations within [[delay]].
    fr: |
      Dans Azure Advisor, ouvrez [[where]].
      Définissez la période d'analyse sur [[period]].
      Attendez-vous aux recommandations mises à jour sous [[delay]].
  slots:
    - id: where
      options:
        - { id: cfg, text: { en: "Configuration > Resources > VM/Virtual Machine Scale Sets right sizing", fr: "Configuration > Resources > VM/Virtual Machine Scale Sets right sizing" } }
        - { id: alerts, text: { en: "Alerts", fr: "Alerts" } }
        - { id: score, text: { en: "Advisor score", fr: "Advisor score" } }
        - { id: wb, text: { en: "Workbooks", fr: "Workbooks" } }
    - id: period
      options:
        - { id: d30, text: { en: "30 days", fr: "30 jours" } }
        - { id: d60, text: { en: "60 days", fr: "60 jours" } }
        - { id: d90, text: { en: "90 days", fr: "90 jours" } }
        - { id: d21, text: { en: "21 days", fr: "21 jours" } }
    - id: delay
      options:
        - { id: h1, text: { en: "1 hour", fr: "1 heure" } }
        - { id: h48, text: { en: "48 hours", fr: "48 heures" } }
        - { id: d7, text: { en: "7 days", fr: "7 jours" } }
answer:
  values: { where: cfg, period: d60, delay: h48 }
explanation:
  correct:
    en: |
      The right-sizing settings of a subscription are in the Advisor Configuration page, on the Resources tab, under VM/Virtual Machine Scale Sets right sizing. The lookback period can be 7, 14, 21, 30, 60 or 90 days, so 60 days is the shortest value that covers two months. A lookback change can take up to 48 hours to be reflected in the recommendations.
    fr: |
      Les paramètres de redimensionnement d'un abonnement se trouvent dans la page Configuration d'Advisor, sous l'onglet Resources, dans VM/Virtual Machine Scale Sets right sizing. La période d'analyse peut être de 7, 14, 21, 30, 60 ou 90 jours : 60 jours est donc la valeur la plus courte qui couvre deux mois. Une modification de la période d'analyse peut mettre jusqu'à 48 heures à se refléter dans les recommandations.
  options:
    d30: { en: "30 days covers only one month-end close.", fr: "30 jours ne couvrent qu'une seule clôture mensuelle." }
    d90: { en: "90 days covers two months but isn't the shortest period that does.", fr: "90 jours couvrent deux mois, mais ce n'est pas la période la plus courte qui le fait." }
    h1: { en: "The hourly refresh applies to the SAP quality checks of a VIS, not to a change of the lookback period.", fr: "L'actualisation horaire concerne les contrôles qualité SAP d'une VIS, pas une modification de la période d'analyse." }
    alerts: { en: "Advisor alerts notify you of new recommendations; they don't change how recommendations are calculated.", fr: "Les alertes Advisor vous informent des nouvelles recommandations ; elles ne modifient pas la façon dont les recommandations sont calculées." }
references:
  - title: Optimize virtual machine (VM) or virtual machine scale set (VMSS) spend by resizing or shutting down underutilized instances
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-cost-recommendations
