id: az120-4a-ri-compute-only
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind runs an SAP HANA VM deployed from a SUSE Linux Enterprise Server for SAP Applications pay-as-you-go image. The VM uses Premium SSD v2 disks for /hana/data and /hana/log and sends replication traffic to another region. Northwind buys a three-year Azure Reserved VM Instance that matches the VM size and region.

    Which charge of the VM is reduced by the reservation?
  fr: |
    Northwind exécute une machine virtuelle SAP HANA déployée à partir d'une image de paiement à l'utilisation SUSE Linux Enterprise Server for SAP Applications. La machine virtuelle utilise des disques SSD Premium v2 pour /hana/data et /hana/log et envoie du trafic de réplication vers une autre région. Northwind achète une instance de machine virtuelle réservée Azure de trois ans qui correspond à la taille et à la région de la machine virtuelle.

    Quels frais de la machine virtuelle sont réduits par la réservation ?
body:
  options:
    - id: a
      text: { en: "The SUSE Linux Enterprise Server for SAP Applications software charge", fr: "Les frais logiciels SUSE Linux Enterprise Server for SAP Applications" }
    - id: b
      text: { en: "The compute charge of the VM", fr: "Les frais de calcul de la machine virtuelle" }
    - id: c
      text: { en: "The capacity, IOPS and throughput charges of the Premium SSD v2 disks", fr: "Les frais de capacité, d'IOPS et de débit des disques SSD Premium v2" }
    - id: d
      text: { en: "The data transfer charge of the replication traffic", fr: "Les frais de transfert de données du trafic de réplication" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Reserved VM Instance covers only the compute part of the VM usage. Software charges of the image, managed disks and data transfer are billed separately. Software such as SUSE or Red Hat can be covered by a separate software plan.
    fr: |
      Une instance de machine virtuelle réservée ne couvre que la partie calcul de l'utilisation de la machine virtuelle. Les frais logiciels de l'image, les disques managés et le transfert de données sont facturés séparément. Les logiciels comme SUSE ou Red Hat peuvent être couverts par un plan logiciel distinct.
  options:
    a: { en: "Software charges aren't included in the reservation; the compute meter is discounted, the software meter isn't.", fr: "Les frais logiciels ne sont pas inclus dans la réservation : le compteur de calcul bénéficie de la remise, pas le compteur logiciel." }
    c: { en: "Disks are storage resources billed on their own meters, outside the VM reservation.", fr: "Les disques sont des ressources de stockage facturées sur leurs propres compteurs, en dehors de la réservation de machine virtuelle." }
    d: { en: "Data transfer is a networking charge, not covered by a VM reservation.", fr: "Le transfert de données fait partie des frais réseau, non couverts par une réservation de machine virtuelle." }
references:
  - title: Save costs with Azure Reserved VM Instances
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/prepay-reserved-vm-instances
