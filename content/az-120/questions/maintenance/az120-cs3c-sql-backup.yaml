id: az120-cs3c-sql-backup
objective: "4.2.6"
type: yesno_statements
caseStudy: az120-cs3c-trey-research
difficulty: 1
status: draft
stem:
  en: |
    You plan to protect the TRP database with Azure Backup from a Recovery Services vault. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de protéger la base de données de TRP avec Sauvegarde Azure à partir d'un coffre Recovery Services. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A backup policy that runs log backups every 15 minutes and keeps them for 30 days meets the backup requirement.
        fr: |
          Une stratégie de sauvegarde qui exécute des sauvegardes de journaux toutes les 15 minutes et les conserve 30 jours respecte l'exigence de sauvegarde.
    - id: s2
      text:
        en: |
          You can add differential backups to a policy that runs daily full backups.
        fr: |
          Vous pouvez ajouter des sauvegardes différentielles à une stratégie qui exécute des sauvegardes complètes quotidiennes.
    - id: s3
      text:
        en: |
          Before you configure the backup, you must install the Microsoft Azure Recovery Services (MARS) agent on SQL-PRD1 and SQL-PRD2.
        fr: |
          Avant de configurer la sauvegarde, vous devez installer l'agent Microsoft Azure Recovery Services (MARS) sur SQL-PRD1 et SQL-PRD2.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Log backups can run as often as every 15 minutes and can be kept for up to 35 days, so a 15-minute frequency with 30 days of retention meets the requirement. A differential backup can be added only when full backups are weekly. No agent is installed for SQL Server databases: during discovery, Azure Backup installs the AzureBackupWindowsWorkload extension and creates the NT Service\AzureWLBackupPluginSvc account.
    fr: |
      Les sauvegardes de journaux peuvent s'exécuter jusqu'à toutes les 15 minutes et être conservées jusqu'à 35 jours : une fréquence de 15 minutes avec 30 jours de rétention respecte donc l'exigence. Une sauvegarde différentielle ne peut être ajoutée que si les sauvegardes complètes sont hebdomadaires. Aucun agent n'est installé pour les bases de données SQL Server : pendant la découverte, Sauvegarde Azure installe l'extension AzureBackupWindowsWorkload et crée le compte NT Service\AzureWLBackupPluginSvc.
references:
  - title: Back up multiple SQL Server VMs from the vault
    url: https://learn.microsoft.com/en-us/azure/backup/backup-sql-server-database-azure-vms
