id: az120-4a-adv-quality-statements
objective: "4.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware deploys SAP systems with Azure Center for SAP solutions. The SAP systems run SAP HANA in Pacemaker clusters on SUSE Linux Enterprise Server behind Standard internal load balancers. Litware uses the Quality Insights workbook and Azure Advisor to find configuration issues.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware déploie des systèmes SAP avec Azure Center for SAP solutions. Les systèmes SAP exécutent SAP HANA dans des clusters Pacemaker sur SUSE Linux Enterprise Server derrière des équilibreurs de charge internes Standard. Litware utilise le classeur Quality Insights et Azure Advisor pour trouver les problèmes de configuration.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The quality checks include Pacemaker configuration checks for the HANA database cluster.
        fr: |
          Les contrôles qualité incluent des contrôles de la configuration Pacemaker pour le cluster de la base de données HANA.
    - id: s2
      text:
        en: |
          If you delete a Virtual Instance for SAP solutions and register the system again, its Advisor recommendations appear after the next hourly run.
        fr: |
          Si vous supprimez une Virtual Instance for SAP solutions et inscrivez de nouveau le système, ses recommandations Advisor apparaissent après l'exécution horaire suivante.
    - id: s3
      text:
        en: |
          The load balancer checks verify whether HA ports and floating IP are enabled on the load-balancing rules.
        fr: |
          Les contrôles de l'équilibreur de charge vérifient si les ports haute disponibilité et l'adresse IP flottante sont activés sur les règles d'équilibrage de charge.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The check categories include Pacemaker configuration checks for the HANA database and the ASCS instance on SUSE and Red Hat, and high-availability load balancer checks for HA ports, floating IP and keep-alive. Advisor filters out recommendations for deleted resources for seven days, so a deleted and re-registered VIS shows its recommendations only after seven days, not after the next hourly run.
    fr: |
      Les catégories de contrôles incluent des contrôles de la configuration Pacemaker pour la base de données HANA et l'instance ASCS sur SUSE et Red Hat, ainsi que des contrôles de l'équilibreur de charge de haute disponibilité pour les ports haute disponibilité, l'adresse IP flottante et le keep-alive. Advisor filtre pendant sept jours les recommandations des ressources supprimées : une VIS supprimée puis réinscrite n'affiche ses recommandations qu'au bout de sept jours, et non après l'exécution horaire suivante.
references:
  - title: View quality checks and insights for a Virtual Instance for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/get-quality-checks-insights
