id: az120-4c-bkp-stop-retain
objective: "4.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is decommissioning an SAP system named **FS1**. The SAP HANA databases of FS1 are protected by Azure Backup in a Recovery Services vault.

    You need to stop all new backups of the databases. The existing recovery points must remain available for restores during an audit, and the company might need to resume the backups later.

    What should you do?
  fr: |
    Fabrikam met hors service un système SAP nommé **FS1**. Les bases de données SAP HANA de FS1 sont protégées par Sauvegarde Azure dans un coffre Recovery Services.

    Vous devez arrêter toutes les nouvelles sauvegardes des bases de données. Les points de récupération existants doivent rester disponibles pour des restaurations pendant un audit, et l'entreprise pourrait devoir reprendre les sauvegardes plus tard.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Stop protection of the databases and delete the backup data.", fr: "Arrêter la protection des bases de données et supprimer les données de sauvegarde." } }
    - { id: b, text: { en: "Unregister the HANA virtual machine from the vault.", fr: "Désinscrire la machine virtuelle HANA du coffre." } }
    - { id: c, text: { en: "Assign the databases a backup policy with a retention of 7 days.", fr: "Affecter aux bases de données une stratégie de sauvegarde avec une rétention de 7 jours." } }
    - { id: d, text: { en: "Stop protection of the databases and retain the backup data.", fr: "Arrêter la protection des bases de données et conserver les données de sauvegarde." } }
answer: { optionId: d }
explanation:
  correct:
    en: Stopping protection with the retain data option stops future backups and keeps the recovery points indefinitely, without pruning. Resume protection is possible only when the data was retained. You keep paying for the protected instance and the storage consumed.
    fr: Arrêter la protection avec l'option de conservation des données interrompt les sauvegardes futures et conserve les points de récupération indéfiniment, sans élagage. La reprise de la protection n'est possible que si les données ont été conservées. Vous continuez de payer l'instance protégée et le stockage consommé.
  options:
    a: { en: "Deleting the backup data removes the recovery points that the audit needs and prevents resuming.", fr: "Supprimer les données de sauvegarde efface les points de récupération dont l'audit a besoin et empêche la reprise." }
    b: { en: "You unregister an instance only after protection is disabled, typically before deleting the vault.", fr: "Une instance ne se désinscrit qu'après la désactivation de la protection, en général avant la suppression du coffre." }
    c: { en: "Changing the policy keeps backups running and shortens the retention of existing recovery points.", fr: "Changer de stratégie laisse les sauvegardes s'exécuter et raccourcit la rétention des points de récupération existants." }
references:
  - title: Manage backed up SAP HANA databases on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-manage
