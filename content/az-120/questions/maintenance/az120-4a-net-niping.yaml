id: az120-4a-net-niping
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam reports slow dialog response times on an SAP ERP system that runs on Azure VMs with accelerated networking enabled. You suspect the network round trip between an application server VM and the database VM.

    You need to measure the network latency between the two VMs. The measurement must follow the SAP on Azure guidance for latency tests.

    What should you use?
  fr: |
    Fabrikam signale des temps de réponse de dialogue lents sur un système SAP ERP qui s'exécute sur des machines virtuelles Azure avec la mise en réseau accélérée activée. Vous soupçonnez l'aller-retour réseau entre une machine virtuelle de serveur d'applications et la machine virtuelle de base de données.

    Vous devez mesurer la latence réseau entre les deux machines virtuelles. La mesure doit suivre les recommandations SAP sur Azure pour les tests de latence.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "The ping command between the two VMs", fr: "La commande ping entre les deux machines virtuelles" }
    - id: b
      text: { en: "IP flow verify in Azure Network Watcher", fr: "La vérification des flux IP dans Azure Network Watcher" }
    - id: c
      text: { en: "Next hop in Azure Network Watcher", fr: "Le tronçon suivant dans Azure Network Watcher" }
    - id: d
      text: { en: "The SAP niping tool between the two VMs", fr: "L'outil SAP niping entre les deux machines virtuelles" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Microsoft recommends niping, the SAP tool described in SAP Notes 500235 and 1100926, to measure latency between SAP VMs. Accelerated networking must be enabled and working during the measurement so the result reflects the real path.
    fr: |
      Microsoft recommande niping, l'outil SAP décrit dans les notes SAP 500235 et 1100926, pour mesurer la latence entre des machines virtuelles SAP. La mise en réseau accélérée doit être activée et fonctionnelle pendant la mesure pour que le résultat reflète le chemin réel.
  options:
    a: { en: "ping doesn't go through the accelerated networking code paths, so Microsoft doesn't recommend it for these measurements.", fr: "ping ne passe pas par les chemins de code de la mise en réseau accélérée : Microsoft ne le recommande pas pour ces mesures." }
    b: { en: "IP flow verify checks whether NSG rules allow or deny a flow; it doesn't measure latency.", fr: "La vérification des flux IP contrôle si les règles NSG autorisent ou refusent un flux ; elle ne mesure pas la latence." }
    c: { en: "Next hop shows the routing decision for a destination; it doesn't measure latency.", fr: "Le tronçon suivant affiche la décision de routage pour une destination ; il ne mesure pas la latence." }
references:
  - title: SAP workload configurations with Azure Availability Zones
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones
