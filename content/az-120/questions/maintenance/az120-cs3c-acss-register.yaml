id: az120-cs3c-acss-register
objective: "4.2.8"
type: multi
caseStudy: az120-cs3c-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You create a user-assigned managed identity that Azure Center for SAP solutions will use to register TRP. You need to grant the identity the permissions it needs to meet the operations requirement.

    Which two role assignments should you create? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez une identité managée affectée par l'utilisateur que le Centre Azure pour les solutions SAP utilisera pour inscrire TRP. Vous devez accorder à l'identité les autorisations nécessaires pour respecter l'exigence d'exploitation.

    Quelles sont les deux attributions de rôle à créer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Azure Center for SAP solutions administrator on rg-trp-compute", fr: "Azure Center for SAP solutions administrator sur rg-trp-compute" } }
    - { id: b, text: { en: "Azure Center for SAP solutions service role on rg-trp-compute", fr: "Azure Center for SAP solutions service role sur rg-trp-compute" } }
    - { id: c, text: { en: "Virtual Machine Contributor on rg-trp-compute", fr: "Virtual Machine Contributor sur rg-trp-compute" } }
    - { id: d, text: { en: "Reader on rg-trp-network", fr: "Reader sur rg-trp-network" } }
    - { id: e, text: { en: "Network Contributor on rg-trp-network", fr: "Network Contributor sur rg-trp-network" } }
    - { id: f, text: { en: "Managed Identity Operator on the subscription", fr: "Managed Identity Operator sur l'abonnement" } }
answer:
  optionIds: [ b, d ]
explanation:
  correct:
    en: |
      To register an existing system, Azure Center for SAP solutions uses a user-assigned managed identity that has the Azure Center for SAP solutions service role on the resource group of the compute resources and the Reader role on the resource group of the virtual network. With these permissions, the service discovers the system, installs its VM extensions and creates the VIS resources.
    fr: |
      Pour inscrire un système existant, le Centre Azure pour les solutions SAP utilise une identité managée affectée par l'utilisateur qui dispose du rôle Azure Center for SAP solutions service role sur le groupe de ressources des ressources de calcul et du rôle Reader sur le groupe de ressources du réseau virtuel. Avec ces autorisations, le service découvre le système, installe ses extensions de machine virtuelle et crée les ressources VIS.
  options:
    a:
      en: |
        Azure Center for SAP solutions administrator is required for the user who performs the registration, not for the managed identity.
      fr: |
        Azure Center for SAP solutions administrator est requis pour l'utilisateur qui effectue l'inscription, pas pour l'identité managée.
    c:
      en: |
        Virtual Machine Contributor isn't the role documented for the registration identity; the Azure Center for SAP solutions service role already grants what the service needs on the compute resources.
      fr: |
        Virtual Machine Contributor n'est pas le rôle documenté pour l'identité d'inscription ; le rôle Azure Center for SAP solutions service role accorde déjà ce dont le service a besoin sur les ressources de calcul.
    e:
      en: |
        The identity only needs to read the virtual network; Network Contributor would grant write access and break least privilege.
      fr: |
        L'identité doit seulement lire le réseau virtuel ; Network Contributor accorderait un accès en écriture et enfreindrait le moindre privilège.
    f:
      en: |
        Managed Identity Operator is required for the user who assigns the identity during the registration, not for the identity itself.
      fr: |
        Managed Identity Operator est requis pour l'utilisateur qui affecte l'identité pendant l'inscription, pas pour l'identité elle-même.
references:
  - title: Register an existing SAP system
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/register-existing-system
