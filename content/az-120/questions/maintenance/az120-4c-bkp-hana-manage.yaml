id: az120-4c-bkp-hana-manage
objective: "4.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove protects the SAP HANA databases of an SAP system named **WP1** with Azure Backup (Backint streaming backups) in a Recovery Services vault named **rsv-wp1**. The databases run on a virtual machine named **hdb-wp1**. The database administrators also use SAP HANA Cockpit.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove protège les bases de données SAP HANA d'un système SAP nommé **WP1** avec Sauvegarde Azure (sauvegardes en streaming Backint) dans un coffre Recovery Services nommé **rsv-wp1**. Les bases de données s'exécutent sur une machine virtuelle nommée **hdb-wp1**. Les administrateurs de bases de données utilisent aussi SAP HANA Cockpit.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: From SAP HANA Cockpit, an administrator can restore a backup of WP1 to another virtual machine named hdb-wp1-test.
        fr: Depuis SAP HANA Cockpit, un administrateur peut restaurer une sauvegarde de WP1 sur une autre machine virtuelle nommée hdb-wp1-test.
    - id: s2
      text:
        en: If you reduce the retention of the policy used by WP1, the new retention also applies to the existing recovery points.
        fr: Si vous réduisez la rétention de la stratégie utilisée par WP1, la nouvelle rétention s'applique aussi aux points de récupération existants.
    - id: s3
      text:
        en: To delete rsv-wp1 after stopping protection, you must first unregister the HANA instance in the backup infrastructure of the vault.
        fr: Pour supprimer rsv-wp1 après l'arrêt de la protection, vous devez d'abord désinscrire l'instance HANA dans l'infrastructure de sauvegarde du coffre.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Restores started from HANA native clients are supported only to the same machine, because Azure RBAC prevents Azure Backup from authenticating another target server. Changing the retention of a policy applies retroactively to older recovery points. A vault can't be deleted until all its servers and instances are unregistered in Backup Infrastructure.
    fr: Les restaurations lancées depuis les clients natifs HANA ne sont prises en charge que sur la même machine, car Azure RBAC empêche Sauvegarde Azure d'authentifier un autre serveur cible. Modifier la rétention d'une stratégie s'applique rétroactivement aux anciens points de récupération. Un coffre ne peut pas être supprimé tant que tous ses serveurs et instances ne sont pas désinscrits dans Backup Infrastructure.
references:
  - title: Manage backed up SAP HANA databases on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-manage
