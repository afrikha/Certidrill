id: az120-4c-lama-role
objective: "4.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs SAP LaMa Enterprise Edition on an Azure virtual machine that uses a user-assigned managed identity named **id-lama**. The SAP systems that LaMa manages are in two resource groups named **rg-sap-prd** and **rg-sap-qas**. Other resource groups in the subscription contain non-SAP workloads.

    LaMa must deallocate and start the SAP virtual machines and copy, relocate and delete their managed disks.

    You need to grant id-lama the required permissions. The solution must follow the principle of least privilege.

    What should you assign to id-lama?
  fr: |
    Adatum exécute SAP LaMa Enterprise Edition sur une machine virtuelle Azure qui utilise une identité managée affectée par l'utilisateur nommée **id-lama**. Les systèmes SAP gérés par LaMa se trouvent dans deux groupes de ressources nommés **rg-sap-prd** et **rg-sap-qas**. D'autres groupes de ressources de l'abonnement contiennent des charges de travail non SAP.

    LaMa doit libérer et démarrer les machines virtuelles SAP, et copier, déplacer et supprimer leurs disques managés.

    Vous devez accorder à id-lama les autorisations nécessaires. La solution doit respecter le principe du moindre privilège.

    Que devez-vous attribuer à id-lama ?
body:
  options:
    - { id: a, text: { en: "The Reader role on rg-sap-prd and rg-sap-qas", fr: "Le rôle Reader sur rg-sap-prd et rg-sap-qas" } }
    - { id: b, text: { en: "The Contributor role on the subscription", fr: "Le rôle Contributor sur l'abonnement" } }
    - { id: c, text: { en: "The Owner role on rg-sap-prd and rg-sap-qas", fr: "Le rôle Owner sur rg-sap-prd et rg-sap-qas" } }
    - { id: d, text: { en: "The Contributor role on rg-sap-prd and rg-sap-qas", fr: "Le rôle Contributor sur rg-sap-prd et rg-sap-qas" } }
answer: { optionId: d }
explanation:
  correct:
    en: The LaMa connector calls Azure Resource Manager to change VMs and managed disks, so Microsoft documents the Contributor role at the scope of each resource group that contains SAP systems managed by LaMa. Limiting the assignment to these two resource groups follows least privilege.
    fr: Le connecteur LaMa appelle Azure Resource Manager pour modifier des machines virtuelles et des disques managés ; Microsoft documente donc le rôle Contributor à l'étendue de chaque groupe de ressources contenant des systèmes SAP gérés par LaMa. Limiter l'attribution à ces deux groupes de ressources respecte le moindre privilège.
  options:
    a: { en: "Reader can't deallocate VMs or copy and delete disks.", fr: "Reader ne peut ni libérer des machines virtuelles ni copier et supprimer des disques." }
    b: { en: "A subscription scope would also cover the non-SAP resource groups.", fr: "Une étendue d'abonnement couvrirait aussi les groupes de ressources non SAP." }
    c: { en: "Owner adds the right to manage access, which LaMa doesn't need.", fr: "Owner ajoute le droit de gérer les accès, dont LaMa n'a pas besoin." }
references:
  - title: Set up the SAP LaMa connector for Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/lama-installation
