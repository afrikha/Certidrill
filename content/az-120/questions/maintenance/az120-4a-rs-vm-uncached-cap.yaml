id: az120-4a-rs-vm-uncached-cap
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs an SAP HANA database on an Azure VM. The /hana/data volume is striped across four Premium SSD disks with host caching set to None. During the nightly data loads, the load jobs run longer than planned. You collect the following metrics during a load:

    - VM Uncached IOPS Consumed Percentage: 100%
    - VM Uncached Bandwidth Consumed Percentage: 72%
    - Data Disk IOPS Consumed Percentage, split by LUN: between 48% and 55% for each data disk
    - Percentage CPU: 45%

    You need to remove the I/O bottleneck.

    What should you do?
  fr: |
    Adatum exécute une base de données SAP HANA sur une machine virtuelle Azure. Le volume /hana/data est entrelacé sur quatre disques SSD Premium dont la mise en cache de l'hôte est définie sur None. Pendant les chargements de données nocturnes, les travaux de chargement durent plus longtemps que prévu. Vous collectez les métriques suivantes pendant un chargement :

    - VM Uncached IOPS Consumed Percentage : 100 %
    - VM Uncached Bandwidth Consumed Percentage : 72 %
    - Data Disk IOPS Consumed Percentage, fractionnée par LUN : entre 48 % et 55 % pour chaque disque de données
    - Percentage CPU : 45 %

    Vous devez supprimer le goulot d'étranglement des E/S.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Replace the four data disks with larger Premium SSD disks", fr: "Remplacer les quatre disques de données par des disques SSD Premium plus grands" }
    - id: b
      text: { en: "Add two more Premium SSD disks to the /hana/data stripe set", fr: "Ajouter deux disques SSD Premium supplémentaires au jeu entrelacé /hana/data" }
    - id: c
      text: { en: "Enable Write Accelerator on the four data disks", fr: "Activer Write Accelerator sur les quatre disques de données" }
    - id: d
      text: { en: "Resize the VM to a larger size certified for SAP HANA", fr: "Redimensionner la machine virtuelle vers une taille supérieure certifiée pour SAP HANA" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      VM Uncached IOPS Consumed Percentage at 100% shows that the VM-level limit for uncached disk I/O caps the workload, while each disk still has headroom. Only a VM size with a higher uncached IOPS limit removes that cap, and the target size must be certified for SAP HANA.
    fr: |
      La métrique VM Uncached IOPS Consumed Percentage à 100 % montre que la limite de la machine virtuelle pour les E/S de disque non mises en cache plafonne la charge de travail, alors que chaque disque dispose encore d'une marge. Seule une taille de machine virtuelle avec une limite d'IOPS non mises en cache plus élevée lève ce plafond, et la taille cible doit être certifiée pour SAP HANA.
  options:
    a: { en: "Larger disks raise the disk limits, but the disks aren't capped; the VM limit stays the same.", fr: "Des disques plus grands relèvent les limites des disques, mais les disques ne sont pas plafonnés ; la limite de la machine virtuelle reste la même." }
    b: { en: "More disks add disk-level IOPS, but the total uncached I/O of the VM is already at its limit.", fr: "Plus de disques ajoutent des IOPS au niveau des disques, mais le total des E/S non mises en cache de la machine virtuelle est déjà à sa limite." }
    c: { en: "Write Accelerator is used for the HANA log volume on Premium SSD, not for the data volume, and it doesn't raise the VM limit.", fr: "Write Accelerator sert au volume de journaux HANA sur SSD Premium, pas au volume de données, et il ne relève pas la limite de la machine virtuelle." }
references:
  - title: Disk performance metrics
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-metrics
