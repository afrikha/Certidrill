id: az120-sr1-commitments-3
objective: "4.1.3"
type: series_yesno
series: az120-sr1-commitments
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: |-
    You buy a single savings plan that covers all the VMs.
  fr: |-
    Vous achetez un seul plan d'économies qui couvre toutes les machines virtuelles.
body:
  solution:
    en: |-
      You buy one three-year **Azure savings plan for compute** whose hourly commitment matches the steady compute spend of the production and non-production VMs together, and you don't buy any reservation.
    fr: |-
      Vous achetez un seul **plan d'économies de calcul Azure** de trois ans dont l'engagement horaire correspond aux dépenses de calcul stables des machines virtuelles de production et hors production réunies, et vous n'achetez aucune réservation.
answer: { value: false }
explanation:
  correct:
    en: |-
      The savings plan meets the non-production requirement, but it doesn't maximize the savings on the production VMs. Their size and region are stable for three years, which is the case for reservations; fully utilized reservations provide the greatest savings.
    fr: |-
      Le plan d'économies répond à l'exigence hors production, mais il ne maximise pas les économies sur les machines virtuelles de production. Leur taille et leur région sont stables pendant trois ans, ce qui correspond au cas des réservations ; entièrement utilisées, les réservations offrent les économies les plus importantes.
references:
  - title: Decide between a savings plan and a reservation
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
