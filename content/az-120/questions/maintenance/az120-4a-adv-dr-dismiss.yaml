id: az120-4a-adv-dr-dismiss
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin runs a production SAP HANA database on an M-series VM in West Europe. A second VM of the same size in North Europe receives HANA System Replication and stays idle until a disaster recovery failover. The DR design requires the DR VM to keep the same size as the primary VM.

    Azure Advisor shows a cost recommendation to resize the DR VM to a smaller size. The subscription contains other SAP VMs whose right-sizing recommendations the team still wants to review.

    You need to stop seeing the recommendation for the DR VM only.

    What should you do?
  fr: |
    Tailspin exécute une base de données SAP HANA de production sur une machine virtuelle de la série M dans la région Europe Ouest. Une deuxième machine virtuelle de même taille dans la région Europe Nord reçoit la réplication du système SAP HANA et reste inactive jusqu'à un basculement de reprise d'activité. La conception de la reprise d'activité exige que la machine virtuelle de reprise conserve la même taille que la machine virtuelle principale.

    Azure Advisor affiche une recommandation de coût pour redimensionner la machine virtuelle de reprise vers une taille inférieure. L'abonnement contient d'autres machines virtuelles SAP dont l'équipe veut toujours examiner les recommandations de redimensionnement.

    Vous devez ne plus voir la recommandation pour la machine virtuelle de reprise uniquement.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Change the CPU threshold filter of the subscription in the Advisor configuration", fr: "Modifier le filtre de seuil de processeur de l'abonnement dans la configuration d'Advisor" }
    - id: b
      text: { en: "Set the lookback period of the subscription to 90 days", fr: "Définir la période d'analyse de l'abonnement sur 90 jours" }
    - id: c
      text: { en: "Stop and deallocate the DR VM between DR tests", fr: "Arrêter et libérer la machine virtuelle de reprise entre les tests de reprise" }
    - id: d
      text: { en: "Dismiss the recommendation for the DR VM", fr: "Ignorer la recommandation pour la machine virtuelle de reprise" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Microsoft lists disaster recovery VMs among the cases where a resize or shutdown recommendation may not apply, and advises using the Dismiss or Postpone option of the recommendation. Dismissing acts on that recommendation only, so the other VMs keep their recommendations.
    fr: |
      Microsoft cite les machines virtuelles de reprise d'activité parmi les cas où une recommandation de redimensionnement ou d'arrêt peut ne pas s'appliquer, et conseille d'utiliser l'option Ignorer ou Reporter de la recommandation. Ignorer n'agit que sur cette recommandation : les autres machines virtuelles conservent leurs recommandations.
  options:
    a: { en: "The CPU threshold filter applies to all VM recommendations of the subscription, so it would also hide recommendations for the other SAP VMs.", fr: "Le filtre de seuil de processeur s'applique à toutes les recommandations de machines virtuelles de l'abonnement : il masquerait aussi les recommandations des autres machines virtuelles SAP." }
    b: { en: "An idle replication target stays underutilized over any lookback period, and the setting affects the whole subscription.", fr: "Une cible de réplication inactive reste sous-utilisée quelle que soit la période d'analyse, et le paramètre concerne tout l'abonnement." }
    c: { en: "A deallocated VM can't receive HANA System Replication, which breaks the DR design.", fr: "Une machine virtuelle libérée ne peut pas recevoir la réplication du système SAP HANA, ce qui rompt la conception de la reprise d'activité." }
references:
  - title: Optimize virtual machine (VM) or virtual machine scale set (VMSS) spend by resizing or shutting down underutilized instances
    url: https://learn.microsoft.com/en-us/azure/advisor/advisor-cost-recommendations
