id: az120-4b-arch-ilm-role
objective: "4.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware archives data from SAP S/4HANA by using SAP Information Lifecycle Management (ILM). Litware wants the SAP ILM store to keep the archive files in a new storage account named **stlitilm01**.

    You registered an application named **app-sap-ilm** in Microsoft Entra ID and added a client secret. You need to grant app-sap-ilm access to stlitilm01. The solution must follow Microsoft's configuration guidance for the ILM store and use the principle of least privilege.

    Which role should you assign to app-sap-ilm on stlitilm01?
  fr: |
    Litware archive des données de SAP S/4HANA avec SAP Information Lifecycle Management (ILM). Litware veut que le magasin SAP ILM conserve les fichiers d'archive dans un nouveau compte de stockage nommé **stlitilm01**.

    Vous avez inscrit une application nommée **app-sap-ilm** dans Microsoft Entra ID et lui avez ajouté une clé secrète client. Vous devez accorder à app-sap-ilm l'accès à stlitilm01. La solution doit suivre les recommandations de configuration de Microsoft pour le magasin ILM et respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à app-sap-ilm sur stlitilm01 ?
body:
  options:
    - { id: a, text: Storage Account Contributor }
    - { id: b, text: Storage Blob Data Reader }
    - { id: c, text: Storage Blob Delegator }
    - { id: d, text: Storage Blob Data Contributor }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The ILM store writes, reads and deletes archive files as blobs, so the application needs data-plane access to blob data. Microsoft's guidance assigns Storage Blob Data Contributor to the registered application on the storage account and gives no other user access to the account.
    fr: |
      Le magasin ILM écrit, lit et supprime les fichiers d'archive sous forme d'objets blob ; l'application a donc besoin d'un accès au plan de données des blobs. Les recommandations de Microsoft attribuent Storage Blob Data Contributor à l'application inscrite sur le compte de stockage et ne donnent accès au compte à aucun autre utilisateur.
  options:
    a: { en: "Storage Account Contributor manages the account (control plane), including its keys; it grants more than needed and isn't the role Microsoft's guidance assigns for blob data access.", fr: "Storage Account Contributor gère le compte (plan de contrôle), y compris ses clés ; il accorde plus que nécessaire et ce n'est pas le rôle que les recommandations de Microsoft attribuent pour l'accès aux données blob." }
    b: { en: "Storage Blob Data Reader only reads blobs; the ILM store must also write archive files.", fr: "Storage Blob Data Reader ne fait que lire les blobs ; le magasin ILM doit aussi écrire les fichiers d'archive." }
    c: { en: "Storage Blob Delegator only lets a principal get a user delegation key to create SAS tokens; it grants no access to blob data.", fr: "Storage Blob Delegator permet seulement d'obtenir une clé de délégation d'utilisateur pour créer des jetons SAS ; il ne donne aucun accès aux données blob." }
references:
  - title: SAP Information Lifecycle Management with Microsoft Azure Blob Storage
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-information-lifecycle-management
