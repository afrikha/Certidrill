id: az120-4a-rs-ppg-allocation
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip deployed an SAP system with availability sets. The database, ASCS/SCS and application server availability sets share one proximity placement group. To reduce costs, you try to resize an application server VM to a size of another VM family. The subscription has enough vCPU quota for the target size, but the resize fails with an allocation failure.

    What is the most likely cause of the failure?
  fr: |
    Wingtip a déployé un système SAP avec des groupes à haute disponibilité. Les groupes à haute disponibilité de la base de données, de l'ASCS/SCS et des serveurs d'applications partagent un groupe de placement de proximité. Pour réduire les coûts, vous essayez de redimensionner une machine virtuelle de serveur d'applications vers une taille d'une autre famille de machines virtuelles. L'abonnement dispose d'un quota de processeurs virtuels suffisant pour la taille cible, mais le redimensionnement échoue avec un échec d'allocation.

    Quelle est la cause la plus probable de l'échec ?
body:
  options:
    - id: a
      text: { en: "The target size isn't offered in the datacenter that hosts the proximity placement group", fr: "La taille cible n'est pas proposée dans le centre de données qui héberge le groupe de placement de proximité" }
    - id: b
      text: { en: "The target size isn't covered by the reservations of the subscription", fr: "La taille cible n'est pas couverte par les réservations de l'abonnement" }
    - id: c
      text: { en: "Accelerated networking must be disabled before you change the VM family", fr: "La mise en réseau accélérée doit être désactivée avant de changer de famille de machines virtuelles" }
    - id: d
      text: { en: "The VM must first be removed from its availability set", fr: "La machine virtuelle doit d'abord être retirée de son groupe à haute disponibilité" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A proximity placement group collocates its VMs in one datacenter, under one network spine. Not every VM type is available in every datacenter or spine, so a resize to another type can fail with an allocation failure. This is why Microsoft limits proximity placement groups to cases where latency requires them, and recommends one per zone scoped by the ASCS/SCS VM in zonal designs.
    fr: |
      Un groupe de placement de proximité regroupe ses machines virtuelles dans un même centre de données, sous une même dorsale réseau. Tous les types de machines virtuelles ne sont pas disponibles dans chaque centre de données ou dorsale : un redimensionnement vers un autre type peut donc échouer avec un échec d'allocation. C'est pourquoi Microsoft limite les groupes de placement de proximité aux cas où la latence les exige et, dans les conceptions zonales, recommande un groupe par zone défini par la machine virtuelle ASCS/SCS.
  options:
    b: { en: "Reservations are a billing discount; they never block a deployment or a resize.", fr: "Les réservations sont une remise de facturation ; elles ne bloquent jamais un déploiement ni un redimensionnement." }
    c: { en: "Accelerated networking doesn't need to be disabled for a resize, as long as the target size supports it.", fr: "La mise en réseau accélérée n'a pas besoin d'être désactivée pour un redimensionnement, tant que la taille cible la prend en charge." }
    d: { en: "A VM can be resized inside its availability set; membership isn't the cause of an allocation failure under a proximity placement group.", fr: "Une machine virtuelle peut être redimensionnée au sein de son groupe à haute disponibilité ; l'appartenance au groupe n'est pas la cause d'un échec d'allocation sous un groupe de placement de proximité." }
references:
  - title: Configuration options to minimize network latency with SAP applications
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/proximity-placement-scenarios
