id: az120-4c-ams-provider-data
objective: "4.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip plans to monitor its SAP landscape on Azure by using Azure Monitor for SAP solutions.

    Which provider collects each type of data? To answer, drag the appropriate providers to the correct data types. Each provider may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip prévoit de superviser son paysage SAP sur Azure avec Azure Monitor pour solutions SAP.

    Quel fournisseur collecte chaque type de données ? Pour répondre, faites glisser les fournisseurs appropriés vers les types de données correspondants. Chaque fournisseur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: hana, text: SAP HANA }
    - { id: ha, text: { en: "High-availability cluster (Pacemaker)", fr: "Cluster à haute disponibilité (Pacemaker)" } }
    - { id: nw, text: SAP NetWeaver }
    - { id: os, text: { en: "OS (Linux)", fr: "Système d'exploitation (Linux)" } }
    - { id: sql, text: Microsoft SQL Server }
    - { id: db2, text: IBM Db2 }
  targets:
    - id: t1
      text: { en: "HANA system replication status", fr: "État de la réplication de système HANA" }
    - id: t2
      text: { en: "SBD status, quorum votes and ring status", fr: "État SBD, votes de quorum et état des anneaux" }
    - id: t3
      text: { en: "Work process usage and enqueue lock statistics", fr: "Utilisation des processus de travail et statistiques des verrous d'enqueue" }
    - id: t4
      text: { en: "Read and write latency per block device", fr: "Latence de lecture et d'écriture par périphérique de bloc" }
answer:
  mapping: { t1: hana, t2: ha, t3: nw, t4: os }
explanation:
  correct:
    en: The SAP HANA provider reports HANA system replication, backups and resource use. The Pacemaker provider reports node, resource and SBD status, quorum votes and ring status. The NetWeaver provider reports work processes, enqueue locks and queues from SAP Control. The OS (Linux) provider reads node exporter metrics, including latency per block device.
    fr: Le fournisseur SAP HANA remonte la réplication de système HANA, les sauvegardes et l'utilisation des ressources. Le fournisseur Pacemaker remonte l'état des nœuds, des ressources et de SBD, les votes de quorum et l'état des anneaux. Le fournisseur NetWeaver remonte les processus de travail, les verrous d'enqueue et les files d'attente à partir de SAP Control. Le fournisseur de système d'exploitation (Linux) lit les métriques de node exporter, dont la latence par périphérique de bloc.
references:
  - title: What is Azure Monitor for SAP solutions?
    url: https://learn.microsoft.com/en-us/azure/sap/monitor/about-azure-monitor-sap-solutions
