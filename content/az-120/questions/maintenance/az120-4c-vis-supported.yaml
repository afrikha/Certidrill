id: az120-4c-vis-supported
objective: "4.2.8"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Wingtip runs several SAP systems on Azure virtual machines and plans to register them in Azure Center for SAP solutions.

    Which two systems can be registered?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip exécute plusieurs systèmes SAP sur des machines virtuelles Azure et prévoit de les inscrire dans le Centre Azure pour les solutions SAP.

    Quels sont les deux systèmes qui peuvent être inscrits ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An SAP NetWeaver AS Java portal on Red Hat Enterprise Linux with SAP ASE", fr: "Un portail SAP NetWeaver AS Java sur Red Hat Enterprise Linux avec SAP ASE" } }
    - { id: b, text: { en: "An SAP NetWeaver ABAP system on Windows Server with SQL Server", fr: "Un système SAP NetWeaver ABAP sur Windows Server avec SQL Server" } }
    - { id: c, text: { en: "An SAP BW/4HANA system on an SAP HANA scale-out database with a standby node", fr: "Un système SAP BW/4HANA sur une base de données SAP HANA scale-out avec un nœud de secours" } }
    - { id: d, text: { en: "An SAP S/4HANA system on SUSE with a scale-up SAP HANA database", fr: "Un système SAP S/4HANA sur SUSE avec une base de données SAP HANA scale-up" } }
    - { id: e, text: { en: "An SAP ECC system whose application servers are in a virtual network peered with the ASCS virtual network", fr: "Un système SAP ECC dont les serveurs d'applications sont dans un réseau virtuel relié par peering au réseau virtuel de l'ASCS" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Registration supports SAP NetWeaver ABAP stacks on Windows, SUSE and RHEL, with HANA, Db2, SQL Server, Oracle, MaxDB or SAP ASE databases. A scale-up HANA S/4HANA system and an ABAP system on SQL Server are both supported.
    fr: L'inscription prend en charge les piles SAP NetWeaver ABAP sous Windows, SUSE et RHEL, avec des bases de données HANA, Db2, SQL Server, Oracle, MaxDB ou SAP ASE. Un système S/4HANA sur HANA scale-up et un système ABAP sur SQL Server sont tous deux pris en charge.
  options:
    a: { en: "Java stacks and dual stacks aren't supported for registration.", fr: "Les piles Java et les doubles piles ne sont pas prises en charge pour l'inscription." }
    c: { en: "HANA scale-out configurations aren't supported.", fr: "Les configurations HANA scale-out ne sont pas prises en charge." }
    e: { en: "Systems distributed across peered virtual networks aren't supported.", fr: "Les systèmes répartis sur des réseaux virtuels reliés par peering ne sont pas pris en charge." }
references:
  - title: Register an existing SAP system
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/register-existing-system
