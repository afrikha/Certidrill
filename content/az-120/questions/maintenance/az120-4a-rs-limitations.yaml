id: az120-4a-rs-limitations
objective: "4.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind plans to resize several SAP VMs to reduce costs. Each target size is available in the region and on the hardware cluster that hosts the VM. The planned changes are:

    - A Windows application server VM, from a size with a local temporary disk to a size without a local temporary disk
    - A Linux application server VM that uses the SCSI disk controller, to a remote NVMe-enabled size
    - A Linux application server VM, from Standard_E16ds_v5 to Standard_E8ds_v5
    - A Windows application server VM, from Standard_E16s_v5 to Standard_E8s_v5

    Which two changes can't be completed by only changing the VM size?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind prévoit de redimensionner plusieurs machines virtuelles SAP pour réduire les coûts. Chaque taille cible est disponible dans la région et sur le cluster matériel qui héberge la machine virtuelle. Les modifications prévues sont les suivantes :

    - Une machine virtuelle Windows de serveur d'applications, d'une taille avec disque temporaire local vers une taille sans disque temporaire local
    - Une machine virtuelle Linux de serveur d'applications qui utilise le contrôleur de disque SCSI, vers une taille compatible NVMe distant
    - Une machine virtuelle Linux de serveur d'applications, de Standard_E16ds_v5 vers Standard_E8ds_v5
    - Une machine virtuelle Windows de serveur d'applications, de Standard_E16s_v5 vers Standard_E8s_v5

    Quelles sont les deux modifications qui ne peuvent pas être réalisées en changeant uniquement la taille de la machine virtuelle ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "The Windows VM that moves from a size with a temporary disk to a size without one", fr: "La machine virtuelle Windows qui passe d'une taille avec disque temporaire à une taille sans disque temporaire" }
    - id: b
      text: { en: "The SCSI-based Linux VM that moves to a remote NVMe-enabled size", fr: "La machine virtuelle Linux basée sur SCSI qui passe à une taille compatible NVMe distant" }
    - id: c
      text: { en: "The Linux VM that moves from Standard_E16ds_v5 to Standard_E8ds_v5", fr: "La machine virtuelle Linux qui passe de Standard_E16ds_v5 à Standard_E8ds_v5" }
    - id: d
      text: { en: "The Windows VM that moves from Standard_E16s_v5 to Standard_E8s_v5", fr: "La machine virtuelle Windows qui passe de Standard_E16s_v5 à Standard_E8s_v5" }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      For Windows VMs, a resize is allowed only between two sizes with a temporary disk or two sizes without one; moving between them needs a snapshot-based workaround. A SCSI-based VM can't be resized to a remote NVMe-enabled size either, which also needs a workaround. Downsizing within the same family, with the same temporary disk configuration, is a plain resize.
    fr: |
      Pour les machines virtuelles Windows, un redimensionnement n'est autorisé qu'entre deux tailles avec disque temporaire ou entre deux tailles sans disque temporaire ; passer de l'une à l'autre exige une solution de contournement fondée sur un instantané. Une machine virtuelle basée sur SCSI ne peut pas non plus être redimensionnée vers une taille compatible NVMe distant, ce qui exige aussi une solution de contournement. La réduction de taille dans la même famille, avec la même configuration de disque temporaire, est un simple redimensionnement.
  options:
    c: { en: "Both sizes have a local temporary disk and belong to the same family, and the target is available on the cluster.", fr: "Les deux tailles ont un disque temporaire local et appartiennent à la même famille, et la cible est disponible sur le cluster." }
    d: { en: "Neither size has a local temporary disk, so this Windows resize is a supported combination.", fr: "Aucune des deux tailles n'a de disque temporaire local : ce redimensionnement Windows est une combinaison prise en charge." }
references:
  - title: Resize a virtual machine
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/sizes/resize-vm
