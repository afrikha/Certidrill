id: az120-3b-restart-systemd
objective: "3.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam installs the ASCS instance (instance number 00) on **nw1-cl-0** and the ERS instance (instance number 01) on **nw1-cl-1** for an SAP system named **NW1** on SLES. The SAP startup framework is managed by systemd, as described in SAP Note 3115048. Fabrikam will then manage both instances with a Pacemaker cluster.

    You need to prevent the SAP startup framework from compromising the stability of the cluster, as recommended in Microsoft's guide.

    What should you do before you configure the cluster resources?
  fr: |
    Fabrikam installe l'instance ASCS (numéro d'instance 00) sur **nw1-cl-0** et l'instance ERS (numéro d'instance 01) sur **nw1-cl-1** pour un système SAP nommé **NW1** sur SLES. L'infrastructure de démarrage SAP est gérée par systemd, comme le décrit la note SAP 3115048. Fabrikam gérera ensuite les deux instances avec un cluster Pacemaker.

    Vous devez empêcher l'infrastructure de démarrage SAP de compromettre la stabilité du cluster, comme le recommande le guide de Microsoft.

    Que devez-vous faire avant de configurer les ressources du cluster ?
body:
  options:
    - { id: a, text: { en: "Stop the instances and their services with sapcontrol, then disable the SAPNW1_00 and SAPNW1_01 systemd services.", fr: "Arrêter les instances et leurs services avec sapcontrol, puis désactiver les services systemd SAPNW1_00 et SAPNW1_01." } }
    - { id: b, text: { en: "Enable the SAPNW1_00 and SAPNW1_01 systemd services so that the instances start at boot before Pacemaker.", fr: "Activer les services systemd SAPNW1_00 et SAPNW1_01 pour que les instances démarrent au boot avant Pacemaker." } }
    - { id: c, text: { en: "Add Autostart = 1 to the ASCS and ERS instance profiles so that systemd starts the instances.", fr: "Ajouter Autostart = 1 dans les profils des instances ASCS et ERS pour que systemd démarre les instances." } }
    - { id: d, text: { en: "Disable the pacemaker systemd service on both nodes so that only the SAP services start at boot.", fr: "Désactiver le service systemd pacemaker sur les deux nœuds pour que seuls les services SAP démarrent au boot." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When systemd manages the SAP startup framework, Microsoft's guide stops each instance and its service (sapcontrol Stop and StopService as <sid>adm), then runs systemctl disable SAPNW1_00 on the ASCS node and systemctl disable SAPNW1_01 on the ERS node. The cluster then alone decides when and where the instances start.
    fr: |
      Lorsque systemd gère l'infrastructure de démarrage SAP, le guide de Microsoft arrête chaque instance et son service (sapcontrol Stop et StopService en tant que <sid>adm), puis exécute systemctl disable SAPNW1_00 sur le nœud ASCS et systemctl disable SAPNW1_01 sur le nœud ERS. Le cluster décide alors seul quand et où les instances démarrent.
  options:
    b: { en: "Enabling the services lets the instances start outside the cluster's control.", fr: "Activer les services permet aux instances de démarrer hors du contrôle du cluster." }
    c: { en: "Autostart must not be used for clustered instances such as ASCS and ERS.", fr: "Autostart ne doit pas être utilisé pour des instances en cluster comme ASCS et ERS." }
    d: { en: "Pacemaker must manage the instances; disabling it would leave them unprotected.", fr: "Pacemaker doit gérer les instances ; le désactiver les laisserait sans protection." }
references:
  - title: High availability for SAP NetWeaver on Azure VMs on SUSE Linux Enterprise Server for SAP applications
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse
