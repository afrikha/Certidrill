id: az120-3b-region-hana-topology
objective: "3.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware runs SAP HANA 2.0 SPS 07 in the West Europe region on two VMs in different availability zones, managed by a Pacemaker cluster. Litware adds a third HANA VM in North Europe for disaster recovery.

    The solution must meet the following requirements:

    - A failure inside West Europe must cause no loss of committed data.
    - The HANA VM in North Europe must keep receiving changes while the secondary VM in West Europe is down for maintenance.

    How should you configure HANA System Replication? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware exécute SAP HANA 2.0 SPS 07 dans la région West Europe sur deux machines virtuelles situées dans des zones de disponibilité différentes, gérées par un cluster Pacemaker. Litware ajoute une troisième machine virtuelle HANA dans North Europe pour la reprise d'activité.

    La solution doit répondre aux exigences suivantes :

    - Une panne dans West Europe ne doit entraîner aucune perte de données validées.
    - La machine virtuelle HANA de North Europe doit continuer de recevoir les modifications pendant que la machine virtuelle secondaire de West Europe est arrêtée pour maintenance.

    Comment devez-vous configurer HANA System Replication ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Replication between the two VMs in West Europe: [[ha]]

      Replication to the VM in North Europe: [[dr]]

      Replication topology: [[topo]]
    fr: |
      Réplication entre les deux machines virtuelles de West Europe : [[ha]]

      Réplication vers la machine virtuelle de North Europe : [[dr]]

      Topologie de réplication : [[topo]]
  slots:
    - id: ha
      options:
        - { id: hasync, text: { en: "Synchronous", fr: "Synchrone" } }
        - { id: haasync, text: { en: "Asynchronous", fr: "Asynchrone" } }
        - { id: haasr, text: { en: "Site Recovery zone-to-zone replication", fr: "Réplication zone à zone de Site Recovery" } }
    - id: dr
      options:
        - { id: drsync, text: { en: "Synchronous", fr: "Synchrone" } }
        - { id: drasync, text: { en: "Asynchronous", fr: "Asynchrone" } }
        - { id: drasr, text: { en: "Site Recovery replication", fr: "Réplication Site Recovery" } }
    - id: topo
      options:
        - { id: multitarget, text: { en: "Multitarget: the primary replicates to both secondaries", fr: "Multicible : le principal réplique vers les deux secondaires" } }
        - { id: multitier, text: { en: "Multitier: the West Europe secondary replicates to North Europe", fr: "Multiniveau : le secondaire de West Europe réplique vers North Europe" } }
        - { id: stretched, text: { en: "A Pacemaker cluster stretched across both regions", fr: "Un cluster Pacemaker étendu sur les deux régions" } }
answer:
  values: { ha: hasync, dr: drasync, topo: multitarget }
explanation:
  correct:
    en: |
      Synchronous HSR between the zones gives an RPO of zero within West Europe. The latency between regions rules out synchronous replication, so the North Europe replica is asynchronous. In a multitier (chained) setup, the DR site receives its changes from the HA secondary, so it stops receiving them while that secondary is down; multitarget replication, available since HANA 2.0 SPS3, makes the DR site independent of the HA secondary.
    fr: |
      HSR synchrone entre les zones donne un RPO nul dans West Europe. La latence entre régions exclut la réplication synchrone : le réplica de North Europe est donc asynchrone. Dans une configuration multiniveau (en chaîne), le site de reprise reçoit ses modifications du secondaire de haute disponibilité et cesse donc de les recevoir quand ce secondaire est arrêté ; la réplication multicible, disponible depuis HANA 2.0 SPS3, rend le site de reprise indépendant du secondaire de haute disponibilité.
  options:
    haasync: { en: "Asynchronous replication can't guarantee an RPO of zero.", fr: "La réplication asynchrone ne peut pas garantir un RPO nul." }
    haasr: { en: "Site Recovery doesn't guarantee database consistency; HANA uses HSR.", fr: "Site Recovery ne garantit pas la cohérence de la base de données ; HANA utilise HSR." }
    drsync: { en: "The round-trip latency between regions is too high for synchronous HSR.", fr: "La latence aller-retour entre régions est trop élevée pour HSR synchrone." }
    multitier: { en: "In a chain, the North Europe site depends on the West Europe secondary, which is down during its maintenance.", fr: "Dans une chaîne, le site de North Europe dépend du secondaire de West Europe, arrêté pendant sa maintenance." }
    stretched: { en: "Failover between regions is always manual; a cross-region cluster isn't the design Microsoft describes.", fr: "Le basculement entre régions est toujours manuel ; un cluster interrégion n'est pas la conception décrite par Microsoft." }
references:
  - title: SAP HANA availability across Azure regions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-availability-across-regions
