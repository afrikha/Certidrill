id: az120-3c-rst-files-steps
objective: "3.2.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You used the **Restore as files** option of Azure Backup to dump the full backup and log backups of an SAP HANA tenant database named **H01** to an NFS path on a HANA VM. You removed the JSON metadata files from the data and log folders after noting the backup ID.

    You need to recover H01 on this VM from the dumped files.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous avez utilisé l'option **Restaurer en tant que fichiers** de Sauvegarde Azure pour déposer la sauvegarde complète et les sauvegardes de journaux d'une base de données de locataire SAP HANA nommée **H01** dans un chemin NFS d'une machine virtuelle HANA. Vous avez retiré les fichiers de métadonnées JSON des dossiers de données et de journaux après avoir noté l'ID de sauvegarde.

    Vous devez récupérer H01 sur cette machine virtuelle à partir des fichiers déposés.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: chown, text: { en: "Change the owner of the dumped folder to `<sid>adm:sapsys`.", fr: "Changer le propriétaire du dossier déposé en `<sid>adm:sapsys`." } }
    - { id: catalog, text: { en: "As `<sid>adm`, generate a catalog file with `hdbbackupdiag --generate`.", fr: "En tant que `<sid>adm`, générer un fichier catalogue avec `hdbbackupdiag --generate`." } }
    - { id: stop, text: { en: "Connect to SYSTEMDB with hdbsql and stop H01.", fr: "Se connecter à SYSTEMDB avec hdbsql et arrêter H01." } }
    - { id: recover, text: { en: "Run `RECOVER DATABASE FOR H01` with the catalog, data and log paths.", fr: "Exécuter `RECOVER DATABASE FOR H01` avec les chemins du catalogue, des données et des journaux." } }
    - { id: register, text: { en: "Run `hdbnsutil -sr_register` on the VM.", fr: "Exécuter `hdbnsutil -sr_register` sur la machine virtuelle." } }
    - { id: alr, text: { en: "Start an Alternate location restore from the vault.", fr: "Lancer une restauration vers un autre emplacement depuis le coffre." } }
answer:
  sequence: [ chown, catalog, stop, recover ]
explanation:
  correct:
    en: |
      The dumped files must belong to `<sid>adm:sapsys`. As `<sid>adm`, you generate the backup catalog with hdbbackupdiag from the data and log directories. In hdbsql connected to SYSTEMDB, you stop the target database, then run RECOVER DATABASE with USING CATALOG PATH, LOG PATH and DATA PATH.
    fr: |
      Les fichiers déposés doivent appartenir à `<sid>adm:sapsys`. En tant que `<sid>adm`, vous générez le catalogue de sauvegarde avec hdbbackupdiag à partir des répertoires de données et de journaux. Dans hdbsql connecté à SYSTEMDB, vous arrêtez la base cible, puis exécutez RECOVER DATABASE avec USING CATALOG PATH, LOG PATH et DATA PATH.
  options:
    register: { en: "hdbnsutil -sr_register registers a system replication secondary; it plays no part in a file-based recovery.", fr: "hdbnsutil -sr_register inscrit un secondaire de réplication système ; il ne joue aucun rôle dans une récupération à partir de fichiers." }
    alr: { en: "An alternate location restore is a different restore option; the files are already dumped and recovered manually.", fr: "Une restauration vers un autre emplacement est une autre option de restauration ; les fichiers sont déjà déposés et récupérés manuellement." }
references:
  - title: Restore SAP HANA databases on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-db-restore
