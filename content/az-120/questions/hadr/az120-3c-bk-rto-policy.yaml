id: az120-3c-bk-rto-policy
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a 6 TB SAP HANA database named **PRD** on an Azure VM. PRD is protected by Azure Backup with streaming (Backint) backups to a Recovery Services vault, because the backups must be kept for one year.

    You need to recommend a backup policy for PRD. The solution must minimize the time required for a point-in-time restore from the vault. Backup storage cost is a secondary concern.

    Which policy should you recommend?
  fr: |
    Fabrikam dispose d'une base de données SAP HANA de 6 To nommée **PRD** sur une machine virtuelle Azure. PRD est protégée par Sauvegarde Azure avec des sauvegardes en streaming (Backint) vers un coffre Recovery Services, car les sauvegardes doivent être conservées un an.

    Vous devez recommander une stratégie de sauvegarde pour PRD. La solution doit réduire au minimum le temps nécessaire à une restauration à un point dans le temps depuis le coffre. Le coût du stockage de sauvegarde est secondaire.

    Quelle stratégie devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A daily full backup and log backups", fr: "Une sauvegarde complète quotidienne et des sauvegardes de journaux" } }
    - { id: b, text: { en: "A weekly full backup, a daily differential backup and log backups", fr: "Une sauvegarde complète hebdomadaire, une sauvegarde différentielle quotidienne et des sauvegardes de journaux" } }
    - { id: c, text: { en: "A weekly full backup, a daily incremental backup and log backups", fr: "Une sauvegarde complète hebdomadaire, une sauvegarde incrémentielle quotidienne et des sauvegardes de journaux" } }
    - { id: d, text: { en: "A weekly full backup and log backups", fr: "Une sauvegarde complète hebdomadaire et des sauvegardes de journaux" } }
answer: { optionId: a }
explanation:
  correct:
    en: With a daily full backup, a restore needs only one full backup plus the logs since that backup, which gives the fastest restore. Microsoft notes that this policy also has the highest storage cost, which the scenario accepts.
    fr: Avec une sauvegarde complète quotidienne, une restauration n'a besoin que d'une sauvegarde complète et des journaux postérieurs, ce qui donne la restauration la plus rapide. Microsoft précise que cette stratégie a aussi le coût de stockage le plus élevé, ce que le scénario accepte.
  options:
    c: { en: "A restore needs the full backup plus every incremental backup since it, then the logs: the slowest option, though the cheapest.", fr: "Une restauration nécessite la sauvegarde complète, toutes les sauvegardes incrémentielles suivantes, puis les journaux : c'est l'option la plus lente, bien que la moins chère." }
    b: { en: "A restore needs the full backup, one differential and the logs: faster than incremental but slower than a daily full.", fr: "Une restauration nécessite la sauvegarde complète, une différentielle et les journaux : plus rapide que l'incrémentielle, mais plus lente qu'une complète quotidienne." }
    d: { en: "Without delta backups, a restore late in the week must replay up to a week of log backups.", fr: "Sans sauvegarde delta, une restauration en fin de semaine doit rejouer jusqu'à une semaine de sauvegardes de journaux." }
references:
  - title: FAQ - Back up SAP HANA databases on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-faq-backup-azure-vm
