id: az120-3a-sla-figures-match
objective: "3.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso is designing the database layer of three SAP systems on Azure. Each design uses a different VM deployment option. All the VMs use Premium SSD managed disks for the operating system and all data disks.

    You need to document the monthly uptime SLA that Azure offers for each deployment option.

    Which SLA should you document for each option? To answer, drag the appropriate SLA values to the correct deployment options. Each value may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso conçoit la couche de base de données de trois systèmes SAP sur Azure. Chaque conception utilise une option de déploiement de machines virtuelles différente. Toutes les machines virtuelles utilisent des disques managés SSD Premium pour le système d'exploitation et tous les disques de données.

    Vous devez documenter le SLA de disponibilité mensuelle qu'Azure propose pour chaque option de déploiement.

    Quel SLA devez-vous documenter pour chaque option ? Pour répondre, faites glisser les valeurs de SLA appropriées vers les options de déploiement correspondantes. Chaque valeur peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: p999, text: "99.9%" }
    - { id: p9995, text: "99.95%" }
    - { id: p9999, text: "99.99%" }
    - { id: p99999, text: "99.999%" }
  targets:
    - id: single
      text: { en: "One VM that runs SAP HANA", fr: "Une seule machine virtuelle qui exécute SAP HANA" }
    - id: avset
      text: { en: "Two VMs in the same availability set", fr: "Deux machines virtuelles dans le même groupe à haute disponibilité" }
    - id: zones
      text: { en: "Two VMs deployed in two different availability zones", fr: "Deux machines virtuelles déployées dans deux zones de disponibilité différentes" }
answer:
  mapping: { single: p999, avset: p9995, zones: p9999 }
explanation:
  correct:
    en: A single VM whose OS and data disks are all Premium SSD is covered by a 99.9% monthly uptime SLA. Two or more VMs in an availability set raise it to 99.95%, and two or more VMs spread across availability zones raise it to 99.99%. No VM deployment option offers 99.999%.
    fr: Une seule machine virtuelle dont le disque du système d'exploitation et tous les disques de données sont des SSD Premium bénéficie d'un SLA de disponibilité mensuelle de 99,9 %. Deux machines virtuelles ou plus dans un groupe à haute disponibilité portent ce SLA à 99,95 %, et deux machines virtuelles ou plus réparties entre des zones de disponibilité le portent à 99,99 %. Aucune option de déploiement de machines virtuelles n'offre 99,999 %.
references:
  - title: SAP HANA availability on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-availability-overview
