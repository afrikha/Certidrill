id: az120-3b-repl-hana-zones
objective: "3.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys runs SAP HANA scale-up on two M-series VMs, one in availability zone 1 and one in availability zone 2. The /hana/data and /hana/log volumes use Premium SSD v2 disks.

    The database must survive the loss of a zone with a recovery point objective (RPO) of zero. The configuration must be supported for SAP.

    How should you replicate the database between the zones?
  fr: |
    Wingtip Toys exécute SAP HANA scale-up sur deux machines virtuelles de série M, l'une dans la zone de disponibilité 1 et l'autre dans la zone de disponibilité 2. Les volumes /hana/data et /hana/log utilisent des disques SSD Premium v2.

    La base de données doit survivre à la perte d'une zone avec un objectif de point de récupération (RPO) nul. La configuration doit être prise en charge pour SAP.

    Comment devez-vous répliquer la base de données entre les zones ?
body:
  options:
    - { id: a, text: { en: "Move /hana/data and /hana/log to Premium_ZRS disks shared by both VMs.", fr: "Déplacer /hana/data et /hana/log vers des disques Premium_ZRS partagés par les deux machines virtuelles." } }
    - { id: b, text: { en: "Configure HANA System Replication in synchronous mode between the two VMs.", fr: "Configurer HANA System Replication en mode synchrone entre les deux machines virtuelles." } }
    - { id: c, text: { en: "Move the volumes to Azure NetApp Files, and configure cross-zone replication.", fr: "Déplacer les volumes vers Azure NetApp Files, et configurer la réplication entre zones." } }
    - { id: d, text: { en: "Protect the primary VM with Site Recovery zone-to-zone replication.", fr: "Protéger la machine virtuelle principale avec la réplication zone à zone de Site Recovery." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Premium SSD v2, Ultra Disk and Azure NetApp Files offer no synchronous storage replication across zones, so Microsoft relies on database methods for database deployments across zones. Synchronous HANA System Replication between the zonal VMs gives an RPO of zero, and it is the basis of the Pacemaker HA configuration.
    fr: |
      Les SSD Premium v2, les Disques Ultra et Azure NetApp Files n'offrent aucune réplication de stockage synchrone entre zones : Microsoft s'appuie donc sur les méthodes de la base de données pour les déploiements de bases de données entre zones. HANA System Replication synchrone entre les machines virtuelles zonales donne un RPO nul, et c'est la base de la configuration de haute disponibilité avec Pacemaker.
  options:
    a: { en: "Synchronous zonal replication of Premium SSD v1 isn't tested with SAP databases and is considered not supported for them.", fr: "La réplication zonale synchrone des SSD Premium v1 n'est pas testée avec les bases de données SAP et est considérée comme non prise en charge pour elles." }
    c: { en: "Azure NetApp Files cross-zone replication is asynchronous, so it can't give an RPO of zero.", fr: "La réplication entre zones d'Azure NetApp Files est asynchrone : elle ne peut pas donner un RPO nul." }
    d: { en: "Site Recovery doesn't guarantee database consistency and replicates asynchronously.", fr: "Site Recovery ne garantit pas la cohérence de la base de données et réplique de manière asynchrone." }
references:
  - title: SAP workload configurations with Azure Availability Zones
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones
