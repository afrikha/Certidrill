id: az120-3a-sql-listener-statements
objective: "3.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs SQL Server 2022 on two Windows Server 2022 VMs in the same subnet for the database of an SAP system. The VMs are in an Always On availability group. Northwind is choosing between a virtual network name (VNN) listener and a distributed network name (DNN) listener.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders exécute SQL Server 2022 sur deux machines virtuelles Windows Server 2022 du même sous-réseau pour la base de données d'un système SAP. Les machines virtuelles font partie d'un groupe de disponibilité Always On. Northwind hésite entre un écouteur à nom de réseau virtuel (VNN) et un écouteur à nom de réseau distribué (DNN).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A DNN listener is also supported for availability groups that run SQL Server 2016 SP3 on Windows Server 2016.
        fr: Un écouteur DNN est également pris en charge pour les groupes de disponibilité qui exécutent SQL Server 2016 SP3 sur Windows Server 2016.
    - id: s2
      text:
        en: Microsoft recommends configuring the DNN listener on port 1433.
        fr: Microsoft recommande de configurer l'écouteur DNN sur le port 1433.
    - id: s3
      text:
        en: A DNN listener requires clients whose connection string includes MultiSubnetFailover=True.
        fr: Un écouteur DNN exige des clients dont la chaîne de connexion contient MultiSubnetFailover=True.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The DNN listener is supported from SQL Server 2016 SP3, SQL Server 2017 CU25 and SQL Server 2019 CU8 on Windows Server 2016 or later. It removes the load balancer that a VNN listener needs in a single subnet, but it must use a port that is unique across the replicas, and Microsoft strongly discourages 1433 because SQL Server already listens on it. The client must support MultiSubnetFailover=True and include the port in the connection string.
    fr: L'écouteur DNN est pris en charge à partir de SQL Server 2016 SP3, SQL Server 2017 CU25 et SQL Server 2019 CU8 sur Windows Server 2016 ou version ultérieure. Il supprime l'équilibreur de charge dont un écouteur VNN a besoin dans un sous-réseau unique, mais il doit utiliser un port unique sur l'ensemble des réplicas, et Microsoft déconseille fortement 1433, sur lequel SQL Server écoute déjà. Le client doit prendre en charge MultiSubnetFailover=True et indiquer le port dans la chaîne de connexion.
references:
  - title: Configure DNN Listener for Availability Group - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/availability-group-distributed-network-name-dnn-listener-configure
  - title: Configure an Azure Load Balancer for an AG VNN Listener - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/availability-group-vnn-azure-load-balancer-configure
