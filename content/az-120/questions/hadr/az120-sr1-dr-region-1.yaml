id: az120-sr1-dr-region-1
objective: "3.2.1"
type: series_yesno
series: az120-sr1-dr-region
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: |-
    You replicate all the VMs, including the HANA VMs, by using Azure Site Recovery.
  fr: |-
    Vous répliquez toutes les machines virtuelles, y compris les machines virtuelles HANA, avec Azure Site Recovery.
body:
  solution:
    en: |-
      You use **Azure Site Recovery** to replicate the application server VMs, the ASCS/ERS cluster VMs and both **HANA VMs** to North Europe, and you configure **cross-region replication** of the /sapmnt and /usr/sap/trans volumes of Azure NetApp Files to North Europe.
    fr: |-
      Vous utilisez **Azure Site Recovery** pour répliquer vers North Europe les machines virtuelles de serveur d'applications, les machines virtuelles du cluster ASCS/ERS et les deux **machines virtuelles HANA**, et vous configurez la **réplication inter-région** des volumes /sapmnt et /usr/sap/trans d'Azure NetApp Files vers North Europe.
answer: { value: false }
explanation:
  correct:
    en: |-
      Site Recovery isn't advised for databases: it doesn't guarantee database consistency and has data churn limits. For the HANA tier, Microsoft recommends native replication, that is, HANA System Replication to a VM in the DR region, while Site Recovery protects the application tier.
    fr: |-
      Site Recovery n'est pas conseillé pour les bases de données : il ne garantit pas la cohérence de la base et présente des limites de taux de modification des données. Pour la couche HANA, Microsoft recommande la réplication native, c'est-à-dire HANA System Replication vers une machine virtuelle de la région de reprise, Site Recovery protégeant la couche application.
references:
  - title: Disaster recovery overview and infrastructure guidelines for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-overview-guide
