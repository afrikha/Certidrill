id: az120-cs1b-oracle-backup
objective: "3.2.4"
type: single
caseStudy: az120-cs1b-lucerne-publishing
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a backup strategy for the LPP database. The solution must meet the backup requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une stratégie de sauvegarde pour la base de données de LPP. La solution doit respecter les exigences de sauvegarde.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Daily Azure VM backups that use the enhanced prescript and postscript framework configured in /etc/azure/workload.conf, plus log backups to an NFS share every 15 minutes", fr: "Des sauvegardes quotidiennes de machine virtuelle Azure qui utilisent l'infrastructure améliorée de prescripts et postscripts configurée dans /etc/azure/workload.conf, plus des sauvegardes de journaux vers un partage NFS toutes les 15 minutes" } }
    - { id: b, text: { en: "Daily Azure VM backups that use the enhanced prescript and postscript framework configured in /etc/azure/workload.conf, with no separate log backups", fr: "Des sauvegardes quotidiennes de machine virtuelle Azure qui utilisent l'infrastructure améliorée de prescripts et postscripts configurée dans /etc/azure/workload.conf, sans sauvegarde distincte des journaux" } }
    - { id: c, text: { en: "Daily Azure VM backups that use custom pre-scripts and post-scripts written by the administrators, plus log backups to an NFS share every 15 minutes", fr: "Des sauvegardes quotidiennes de machine virtuelle Azure qui utilisent des pre-scripts et post-scripts personnalisés écrits par les administrateurs, plus des sauvegardes de journaux vers un partage NFS toutes les 15 minutes" } }
    - { id: d, text: { en: "Azure Site Recovery replication of the database VMs to another region with application-consistent recovery points every 15 minutes", fr: "Une réplication Azure Site Recovery des machines virtuelles de base de données vers une autre région avec des points de récupération cohérents avec les applications toutes les 15 minutes" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With the enhanced framework, Azure Backup installs the Oracle prescripts and postscripts with the backup extension, so you only edit workload.conf to get database-consistent snapshots stored in the vault. A VM backup runs once a day, so Microsoft recommends pairing it with frequent log backups streamed to an NFS volume; the log backup interval, here 15 minutes, then sets the data loss and meets the 30-minute target.
    fr: |
      Avec l'infrastructure améliorée, Sauvegarde Azure installe les prescripts et postscripts Oracle avec l'extension de sauvegarde : vous modifiez seulement workload.conf pour obtenir des instantanés cohérents avec la base de données stockés dans le coffre. Une sauvegarde de machine virtuelle s'exécute une fois par jour : Microsoft recommande donc de l'associer à des sauvegardes fréquentes des journaux envoyées vers un volume NFS ; l'intervalle de sauvegarde des journaux, ici 15 minutes, détermine alors la perte de données et respecte l'objectif de 30 minutes.
  options:
    b:
      en: |
        Without log backups, the only recovery points are the daily VM backups, so a restore can lose up to 24 hours of data.
      fr: |
        Sans sauvegardes des journaux, les seuls points de récupération sont les sauvegardes quotidiennes de machine virtuelle : une restauration peut perdre jusqu'à 24 heures de données.
    c:
      en: |
        Writing custom scripts to quiesce Oracle violates the requirement; the enhanced framework already provides them.
      fr: |
        Écrire des scripts personnalisés pour mettre Oracle au repos enfreint l'exigence ; l'infrastructure améliorée les fournit déjà.
    d:
      en: |
        Site Recovery is a disaster recovery replication service, not a backup stored in a Recovery Services vault for 30 days, and Microsoft doesn't recommend it for database VMs.
      fr: |
        Site Recovery est un service de réplication pour la reprise d'activité, pas une sauvegarde stockée 30 jours dans un coffre Recovery Services, et Microsoft ne le recommande pas pour les machines virtuelles de base de données.
references:
  - title: Enhanced prescripts and postscripts for database-consistent snapshots
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-linux-database-consistent-enhanced-pre-post
