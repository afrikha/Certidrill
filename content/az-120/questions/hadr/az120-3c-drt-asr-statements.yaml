id: az120-3c-drt-asr-statements
objective: "3.2.8"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Litware runs a test failover of a Site Recovery recovery plan that contains the ASCS/ERS and application server VMs of an SAP system. The test VMs start in an isolated virtual network in the target region.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware lance un test de basculement d'un plan de récupération Site Recovery qui contient les machines virtuelles ASCS/ERS et des serveurs d'applications d'un système SAP. Les machines virtuelles de test démarrent dans un réseau virtuel isolé de la région cible.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Replication of the source VMs is paused until you select Cleanup test failover.
        fr: La réplication des machines virtuelles source est suspendue jusqu'à ce que vous sélectionniez Cleanup test failover.
    - id: s2
      text:
        en: Changes made on the test VMs are discarded when you clean up the test failover.
        fr: Les modifications apportées aux machines virtuelles de test sont abandonnées lorsque vous nettoyez le test de basculement.
    - id: s3
      text:
        en: The recovery plan skips the step that shuts down the source VMs.
        fr: Le plan de récupération ignore l'étape qui arrête les machines virtuelles source.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      A test failover doesn't affect ongoing replication or the production environment. Cleanup test failover deletes the test VMs, and the changes made on them are lost, not replicated back. Because the primary site keeps running during a test failover, the shutdown step of the recovery plan is skipped.
    fr: |
      Un test de basculement n'affecte ni la réplication en cours ni l'environnement de production. Cleanup test failover supprime les machines virtuelles de test, et les modifications qui y ont été faites sont perdues, sans être répliquées vers la source. Comme le site principal continue de fonctionner pendant un test de basculement, l'étape d'arrêt du plan de récupération est ignorée.
references:
  - title: Run a test failover (disaster recovery drill) to Azure
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-test-failover-to-azure
  - title: About recovery plans in Azure Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/recovery-plan-overview
