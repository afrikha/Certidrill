id: az120-cs4b-dr-components
objective: "3.2.1"
type: dragdrop
caseStudy: az120-cs4b-treyresearch
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a disaster recovery method for each component of PRD. The solution must meet the disaster recovery requirements.

    Which method should you recommend for each component? To answer, drag the appropriate methods to the correct components. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander une méthode de reprise d'activité pour chaque composant de PRD. La solution doit respecter les exigences de reprise d'activité.

    Quelle méthode devez-vous recommander pour chaque composant ? Pour répondre, faites glisser les méthodes appropriées vers les composants correspondants. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: asr, text: { en: "Azure Site Recovery replication to North Europe", fr: "Réplication Azure Site Recovery vers North Europe" } }
    - { id: aoag, text: { en: "The asynchronous availability group replica in North Europe", fr: "Le réplica asynchrone du groupe de disponibilité dans North Europe" } }
    - { id: robocopy, text: { en: "Scheduled Robocopy to an Azure Files share in North Europe", fr: "Robocopy planifié vers un partage Azure Files dans North Europe" } }
    - { id: grs, text: { en: "Geo-redundant storage (GRS) on the storage account", fr: "Stockage géoredondant (GRS) sur le compte de stockage" } }
    - { id: anf, text: { en: "Azure NetApp Files cross-region replication", fr: "Réplication interrégion Azure NetApp Files" } }
    - { id: crr, text: { en: "Azure Backup with cross-region restore", fr: "Sauvegarde Azure avec restauration interrégion" } }
  targets:
    - { id: appvms, text: { en: "Application server and SAP Web Dispatcher VMs", fr: "Machines virtuelles des serveurs d'applications et de SAP Web Dispatcher" } }
    - { id: db, text: { en: "PRD database", fr: "Base de données de PRD" } }
    - { id: sapmnt, text: { en: "SAP global host files on the premium Azure Files SMB share", fr: "Fichiers de l'hôte global SAP sur le partage SMB Azure Files premium" } }
answer:
  mapping: { appvms: asr, db: aoag, sapmnt: robocopy }
explanation:
  correct:
    en: Azure Site Recovery replicates the application server and Web Dispatcher VMs with their managed disks, so they start in North Europe without any reinstallation. For the database, Microsoft recommends native DBMS replication, here the asynchronous Always On replica, because Site Recovery does not guarantee database consistency and has data churn limits. Site Recovery does not replicate file shares; for SMB on Azure Files the documented DR method is a copy with Robocopy to a share in the DR region, after which SAPGLOBALHOST is repointed.
    fr: Azure Site Recovery réplique les machines virtuelles des serveurs d'applications et de Web Dispatcher avec leurs disques managés ; elles démarrent donc dans North Europe sans aucune réinstallation. Pour la base de données, Microsoft recommande la réplication native du SGBD, ici le réplica Always On asynchrone, car Site Recovery ne garantit pas la cohérence de la base de données et a des limites de taux de modification des données. Site Recovery ne réplique pas les partages de fichiers ; pour SMB sur Azure Files, la méthode de reprise documentée est une copie avec Robocopy vers un partage de la région de reprise, puis SAPGLOBALHOST est redirigé.
  options:
    grs: { en: "GRS is available only for standard storage accounts; the premium account that hosts sapmnt supports LRS or ZRS.", fr: "GRS n'est disponible que pour les comptes de stockage standard ; le compte premium qui héberge sapmnt prend en charge LRS ou ZRS." }
    anf: { en: "Cross-region replication applies to Azure NetApp Files volumes, which PRD does not use.", fr: "La réplication interrégion s'applique aux volumes Azure NetApp Files, que PRD n'utilise pas." }
    crr: { en: "Restoring backups in another region gives a higher RTO and more data loss than continuous replication.", fr: "Restaurer des sauvegardes dans une autre région donne un RTO plus élevé et davantage de perte de données qu'une réplication continue." }
references:
  - title: Disaster Recovery overview and infrastructure guidelines for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-overview-guide
  - title: Disaster Recovery recommendation for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-sap-guide
