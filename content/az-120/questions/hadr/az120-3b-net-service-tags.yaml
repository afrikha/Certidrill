id: az120-3b-net-service-tags
objective: "3.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys enables Azure Site Recovery replication of its SAP application server VMs from West Europe to North Europe. The network security group of the source subnet in West Europe denies all outbound internet traffic. An outbound rule that allows the **AzureActiveDirectory** service tag over HTTPS already exists.

    You need to add the other outbound HTTPS rules that Site Recovery requires, by using service tags.

    Which three service tags should you allow?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys active la réplication Azure Site Recovery de ses machines virtuelles de serveur d'applications SAP de West Europe vers North Europe. Le groupe de sécurité réseau du sous-réseau source dans West Europe refuse tout le trafic Internet sortant. Une règle sortante qui autorise l'étiquette de service **AzureActiveDirectory** en HTTPS existe déjà.

    Vous devez ajouter les autres règles sortantes HTTPS dont Site Recovery a besoin, en utilisant des étiquettes de service.

    Quelles sont les trois étiquettes de service à autoriser ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: Storage.WestEurope }
    - { id: b, text: Storage.NorthEurope }
    - { id: c, text: EventHub.NorthEurope }
    - { id: d, text: EventHub.WestEurope }
    - { id: e, text: AzureSiteRecovery }
    - { id: f, text: AzureBackup }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |
      The replicated VMs write to the cache storage account in the source region (Storage tag of the source region), send monitoring data to Event Hubs in the target region (EventHub tag of the target region), and communicate with the Site Recovery service (AzureSiteRecovery), in addition to authenticating with Microsoft Entra ID (AzureActiveDirectory).
    fr: |
      Les machines virtuelles répliquées écrivent dans le compte de stockage de cache de la région source (étiquette Storage de la région source), envoient des données de supervision à Event Hubs dans la région cible (étiquette EventHub de la région cible) et communiquent avec le service Site Recovery (AzureSiteRecovery), en plus de s'authentifier auprès de Microsoft Entra ID (AzureActiveDirectory).
  options:
    b: { en: "The cache storage account is in the source region; Storage of the target region is needed only to replicate back after failover.", fr: "Le compte de stockage de cache se trouve dans la région source ; le stockage de la région cible n'est nécessaire que pour la réplication inverse après le basculement." }
    d: { en: "Site Recovery monitoring uses Event Hubs in the target region, not in the source region.", fr: "La supervision de Site Recovery utilise Event Hubs dans la région cible, pas dans la région source." }
    f: { en: "AzureBackup is the tag of the Azure Backup service, not of Site Recovery replication.", fr: "AzureBackup est l'étiquette du service Sauvegarde Azure, pas de la réplication Site Recovery." }
references:
  - title: About networking in Azure VM disaster recovery with Azure Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-about-networking
