id: az120-3a-sla-app-servers-min
objective: "3.1.1"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Woodgrove Bank is deploying an SAP NetWeaver system on Azure. The ASCS/SCS instance and the database are protected by failover clusters. The application layer must remain available when one application server VM fails, by using redundancy instead of clustering.

    What is the minimum number of SAP application server instances, each on its own VM, that you should deploy?
  fr: |
    Woodgrove Bank déploie un système SAP NetWeaver sur Azure. L'instance ASCS/SCS et la base de données sont protégées par des clusters de basculement. La couche d'applications doit rester disponible en cas de défaillance d'une machine virtuelle de serveur d'applications, grâce à la redondance plutôt qu'au clustering.

    Quel est le nombre minimal d'instances de serveur d'applications SAP, chacune sur sa propre machine virtuelle, que vous devez déployer ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "4" }
answer: { optionId: b }
explanation:
  correct:
    en: Application server instances don't need a specific high-availability solution; their availability comes from redundancy. Microsoft recommends at least two SAP application instances installed on two VMs, spread across fault domains or zones, so that one VM failure leaves at least one instance running.
    fr: "Les instances de serveur d'applications n'ont pas besoin d'une solution de haute disponibilité spécifique : leur disponibilité vient de la redondance. Microsoft recommande au moins deux instances d'applications SAP installées sur deux machines virtuelles, réparties entre des domaines d'erreur ou des zones, afin qu'une défaillance de machine virtuelle laisse au moins une instance en fonctionnement."
  options:
    a: { en: "A single application server is lost with its VM, so the application layer would not survive a VM failure.", fr: "Un serveur d'applications unique disparaît avec sa machine virtuelle : la couche d'applications ne survivrait pas à une défaillance de machine virtuelle." }
    c: { en: "Three or more instances may be needed for capacity, but two is the minimum for redundancy.", fr: "Trois instances ou plus peuvent être nécessaires pour la capacité, mais deux constituent le minimum pour la redondance." }
    d: { en: "Four instances exceed the minimum needed to survive one VM failure.", fr: "Quatre instances dépassent le minimum nécessaire pour survivre à une défaillance de machine virtuelle." }
references:
  - title: Azure VMs HA architecture and scenarios for SAP NetWeaver
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-high-availability-architecture-scenarios
