id: az120-3c-bk-crr-rpo
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware runs an SAP BW/4HANA system in West Europe. The SAP HANA database is backed up by Azure Backup with log backups every 30 minutes. The Recovery Services vault uses the default storage redundancy and hasn't protected any item yet.

    You need to ensure that the database can be restored in North Europe, the paired region, if West Europe becomes unavailable. The solution must meet the following requirements:

    - Provide an RPO of 24 hours or less in North Europe.
    - Keep no VM running in North Europe before a disaster.
    - Minimize costs.

    What should you include in the solution?
  fr: |
    Litware exécute un système SAP BW/4HANA en West Europe. La base de données SAP HANA est sauvegardée par Sauvegarde Azure avec des sauvegardes de journaux toutes les 30 minutes. Le coffre Recovery Services utilise la redondance de stockage par défaut et ne protège encore aucun élément.

    Vous devez vous assurer que la base de données pourra être restaurée en North Europe, la région jumelée, si West Europe devient indisponible. La solution doit répondre aux exigences suivantes :

    - Fournir un RPO de 24 heures ou moins en North Europe.
    - Ne conserver aucune machine virtuelle en cours d'exécution en North Europe avant un sinistre.
    - Réduire les coûts au minimum.

    Que devez-vous inclure dans la solution ?
body:
  options:
    - { id: a, text: { en: "Set the vault to zone-redundant storage (ZRS)", fr: "Configurer le coffre en stockage redondant interzone (ZRS)" } }
    - { id: b, text: { en: "Configure asynchronous HANA System Replication to a VM in North Europe", fr: "Configurer la réplication du système HANA asynchrone vers une machine virtuelle en North Europe" } }
    - { id: c, text: { en: "Replicate the HANA VM to North Europe by using Azure Site Recovery", fr: "Répliquer la machine virtuelle HANA vers North Europe avec Azure Site Recovery" } }
    - { id: d, text: { en: "Keep the vault on GRS and enable Cross Region Restore", fr: "Conserver le coffre en GRS et activer la restauration interrégion" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      GRS is the default redundancy of a vault and is required by Cross Region Restore, which restores SAP HANA databases in the paired region. Its RPO in the secondary region is 12 hours plus the log backup frequency, here 12.5 hours, which meets the 24-hour target. No compute runs in North Europe until you restore to a HANA VM registered with a vault there.
    fr: |
      GRS est la redondance par défaut d'un coffre et la restauration interrégion l'exige ; celle-ci restaure les bases de données SAP HANA dans la région jumelée. Son RPO dans la région secondaire est de 12 heures plus la fréquence des sauvegardes de journaux, ici 12 h 30, ce qui respecte l'objectif de 24 heures. Aucune ressource de calcul ne s'exécute en North Europe tant que vous ne restaurez pas vers une machine virtuelle HANA inscrite auprès d'un coffre de cette région.
  options:
    a: { en: "ZRS protects against the loss of a zone inside West Europe, not against the loss of the region.", fr: "ZRS protège contre la perte d'une zone dans West Europe, pas contre la perte de la région." }
    b: { en: "HSR gives a much lower RPO but needs a HANA VM running in North Europe, which the requirements exclude and which costs more.", fr: "La HSR donne un RPO bien plus faible, mais elle exige une machine virtuelle HANA en cours d'exécution en North Europe, ce que les exigences excluent et qui coûte plus cher." }
    c: { en: "Microsoft advises against Site Recovery for databases: it doesn't guarantee database consistency and has data churn limits.", fr: "Microsoft déconseille Site Recovery pour les bases de données : il ne garantit pas la cohérence de la base et a des limites d'activité des données." }
references:
  - title: Restore SAP HANA databases on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-db-restore
  - title: Create and configure Recovery Services vaults
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
