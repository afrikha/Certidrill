id: az120-sr1-dr-region-3
objective: "3.2.1"
type: series_yesno
series: az120-sr1-dr-region
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |-
    You use Site Recovery for the application tier, HANA System Replication for HANA and cross-region replication for the NFS volumes.
  fr: |-
    Vous utilisez Site Recovery pour la couche application, HANA System Replication pour HANA et la réplication inter-région pour les volumes NFS.
body:
  solution:
    en: |-
      You use **Azure Site Recovery** to replicate the application server VMs and the ASCS/ERS cluster VMs to North Europe. You add a HANA VM in North Europe that receives **asynchronous HANA System Replication** from the primary site. You configure **cross-region replication** of the /sapmnt and /usr/sap/trans volumes of Azure NetApp Files to North Europe.
    fr: |-
      Vous utilisez **Azure Site Recovery** pour répliquer vers North Europe les machines virtuelles de serveur d'applications et les machines virtuelles du cluster ASCS/ERS. Vous ajoutez dans North Europe une machine virtuelle HANA qui reçoit la **réplication HANA System Replication asynchrone** depuis le site principal. Vous configurez la **réplication inter-région** des volumes /sapmnt et /usr/sap/trans d'Azure NetApp Files vers North Europe.
answer: { value: true }
explanation:
  correct:
    en: |-
      Site Recovery replicates the application and central services VMs continuously, so they don't have to be rebuilt. Native HANA System Replication keeps a database-consistent copy in North Europe, and Azure NetApp Files cross-region replication, available between the West Europe and North Europe pair, copies the NFS volumes.
    fr: |-
      Site Recovery réplique en continu les machines virtuelles d'application et des services centraux, qui n'ont donc pas à être reconstruites. La réplication native HANA System Replication conserve dans North Europe une copie cohérente de la base de données, et la réplication inter-région d'Azure NetApp Files, disponible entre la paire West Europe et North Europe, copie les volumes NFS.
references:
  - title: Disaster recovery overview and infrastructure guidelines for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-overview-guide
  - title: Understand Azure NetApp Files replication
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/cross-region-replication-introduction
