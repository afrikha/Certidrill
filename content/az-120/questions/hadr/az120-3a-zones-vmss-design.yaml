id: az120-3a-zones-vmss-design
objective: "3.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders runs two SAP systems, **ERP** and **BW**, on VMs that were deployed in availability zones without a scale set. Northwind wants to move both systems to virtual machine scale sets with Flexible orchestration, following Microsoft's guidance for SAP.

    How should you complete the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders exécute deux systèmes SAP, **ERP** et **BW**, sur des machines virtuelles déployées dans des zones de disponibilité sans groupe de machines virtuelles identiques. Northwind veut migrer les deux systèmes vers des groupes de machines virtuelles identiques avec orchestration flexible, conformément aux recommandations de Microsoft pour SAP.

    Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Number of scale sets: [[scope]]

      Allocation policy of each scale set: [[alloc]]

      Method to move the existing VMs: [[move]]
    fr: |
      Nombre de groupes : [[scope]]

      Stratégie d'allocation de chaque groupe : [[alloc]]

      Méthode pour déplacer les machines virtuelles existantes : [[move]]
  slots:
    - id: scope
      options:
        - { id: one, text: { en: "One scale set for both systems", fr: "Un groupe pour les deux systèmes" } }
        - { id: persys, text: { en: "One scale set per SAP system", fr: "Un groupe par système SAP" } }
        - { id: pertier, text: { en: "One scale set per tier of each SAP system", fr: "Un groupe par couche de chaque système SAP" } }
    - id: alloc
      options:
        - { id: max, text: { en: "Max spreading", fr: "Max spreading" } }
        - { id: fixed, text: { en: "Fixed spreading", fr: "Fixed spreading" } }
    - id: move
      options:
        - { id: recreate, text: { en: "Re-create the VMs and disks in the scale set", fr: "Recréer les machines virtuelles et les disques dans le groupe" } }
        - { id: update, text: { en: "Attach each running VM to the scale set by updating its properties", fr: "Rattacher chaque machine virtuelle en cours d'exécution au groupe en mettant à jour ses propriétés" } }
        - { id: mover, text: { en: "Use Azure Resource Mover to move the VMs into the scale set", fr: "Utiliser Azure Resource Mover pour déplacer les machines virtuelles dans le groupe" } }
answer:
  values: { scope: persys, alloc: max, move: recreate }
explanation:
  correct:
    en: Microsoft recommends deploying each SAP system in its own flexible scale set, with all its components (database, ASCS/ERS and application servers) in that set. The allocation policy should be Max spreading, not Fixed spreading. There is no direct migration path from zonal VMs or availability sets to a flexible scale set with FD=1; the VMs and disks must be re-created with zone constraints.
    fr: Microsoft recommande de déployer chaque système SAP dans son propre groupe flexible, avec tous ses composants (base de données, ASCS/ERS et serveurs d'applications) dans ce groupe. La stratégie d'allocation doit être Max spreading, et non Fixed spreading. Il n'existe aucun chemin de migration direct de machines virtuelles zonales ou de groupes à haute disponibilité vers un groupe flexible avec FD=1 ; les machines virtuelles et les disques doivent être recréés avec des contraintes de zone.
  options:
    one: { en: "Bundling several SAP systems in one scale set goes against the one-system-per-scale-set guidance.", fr: "Regrouper plusieurs systèmes SAP dans un même groupe va à l'encontre de la recommandation d'un système par groupe." }
    pertier: { en: "All the components of one SAP system belong in the same scale set.", fr: "Tous les composants d'un système SAP doivent se trouver dans le même groupe." }
    fixed: { en: "Microsoft explicitly says not to configure the scale set with Fixed spreading.", fr: "Microsoft indique explicitement de ne pas configurer le groupe avec Fixed spreading." }
    update: { en: "Microsoft states that there is no direct migration path for existing SAP VMs into a flexible scale set with FD=1.", fr: "Microsoft indique qu'il n'existe aucun chemin de migration direct des machines virtuelles SAP existantes vers un groupe flexible avec FD=1." }
    mover: { en: "Resource Mover moves resources to another region; Microsoft states that there is no direct migration path into a flexible scale set with FD=1.", fr: "Resource Mover déplace des ressources vers une autre région ; Microsoft indique qu'il n'existe aucun chemin de migration direct vers un groupe flexible avec FD=1." }
references:
  - title: Virtual machine scale sets for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/virtual-machine-scale-set-sap-deployment-guide
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
