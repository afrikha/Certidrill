id: az120-3c-rst-hsr-target
objective: "3.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso runs SAP HANA with HANA System Replication on **hn1-db-0** (primary) and **hn1-db-1** (secondary). Both nodes are protected by Azure Backup as one HSR container with streaming backups.

    After a failed data load, you must restore the tenant database to 06:30 today on hn1-db-0. The business accepts that the HA protection is rebuilt after the restore.

    What should you do?
  fr: |
    Contoso exécute SAP HANA avec la réplication du système HANA sur **hn1-db-0** (principal) et **hn1-db-1** (secondaire). Les deux nœuds sont protégés par Sauvegarde Azure comme un seul conteneur HSR avec des sauvegardes en streaming.

    Après un chargement de données en échec, vous devez restaurer la base de données de locataire à 06:30 aujourd'hui sur hn1-db-0. L'entreprise accepte que la protection de haute disponibilité soit reconstruite après la restauration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run an Original location restore with Force Overwrite selected", fr: "Lancer une restauration à l'emplacement d'origine en sélectionnant Force Overwrite" } }
    - { id: b, text: { en: "Stop protection with retain data, then run an Original location restore", fr: "Arrêter la protection en conservant les données, puis lancer une restauration à l'emplacement d'origine" } }
    - { id: c, text: { en: "Run a Cross Region Restore that targets hn1-db-0", fr: "Lancer une restauration interrégion qui cible hn1-db-0" } }
    - { id: d, text: { en: "Disable HSR on hn1-db-0, then run an Alternate location restore with hn1-db-0 as the host", fr: "Désactiver la HSR sur hn1-db-0, puis lancer une restauration vers un autre emplacement avec hn1-db-0 comme hôte" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Original location recovery isn't supported for HSR, so you use Alternate location and select the source VM as the host. SAP doesn't allow a restore to an HSR-enabled system, so HSR must be disabled on the target first; replication is set up again afterwards.
    fr: |
      La restauration à l'emplacement d'origine n'est pas prise en charge pour la HSR : vous utilisez Autre emplacement et sélectionnez la machine virtuelle source comme hôte. SAP n'autorise pas la restauration vers un système où la HSR est activée : il faut d'abord la désactiver sur la cible, puis reconfigurer la réplication ensuite.
  options:
    a: { en: "Original location recovery isn't supported for HSR databases, with or without Force Overwrite.", fr: "La restauration à l'emplacement d'origine n'est pas prise en charge pour les bases HSR, avec ou sans Force Overwrite." }
    b: { en: "Stopping protection doesn't make Original location recovery available, and HSR would still be enabled on the target.", fr: "Arrêter la protection ne rend pas disponible la restauration à l'emplacement d'origine, et la HSR serait toujours activée sur la cible." }
    c: { en: "Cross Region Restore restores to the paired secondary region, not to the primary node.", fr: "La restauration interrégion restaure dans la région secondaire jumelée, pas sur le nœud principal." }
references:
  - title: Restore SAP HANA databases on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-db-restore
  - title: SAP HANA Backup support matrix
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-backup-support-matrix
