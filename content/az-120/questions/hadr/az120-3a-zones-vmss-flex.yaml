id: az120-3a-zones-vmss-flex
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware is planning a new highly available SAP S/4HANA system in an Azure region that has three availability zones. The database and ASCS/ERS VM pairs will be clustered, and the application servers will be spread across zones.

    You need to recommend a VM deployment framework that follows Microsoft's guidance for new SAP deployments across zones.

    What should you recommend?
  fr: |
    Proseware prévoit un nouveau système SAP S/4HANA hautement disponible dans une région Azure qui compte trois zones de disponibilité. Les paires de machines virtuelles de base de données et ASCS/ERS seront mises en cluster, et les serveurs d'applications seront répartis entre les zones.

    Vous devez recommander une infrastructure de déploiement de machines virtuelles conforme aux recommandations de Microsoft pour les nouveaux déploiements SAP entre zones.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A virtual machine scale set with Flexible orchestration and a fault domain count of 1", fr: "Un groupe de machines virtuelles identiques avec orchestration flexible et un nombre de domaines d'erreur de 1" }
    - id: b
      text: { en: "A virtual machine scale set with Uniform orchestration across the three zones", fr: "Un groupe de machines virtuelles identiques avec orchestration uniforme dans les trois zones" }
    - id: c
      text: { en: "A virtual machine scale set with Flexible orchestration and a fault domain count of 3", fr: "Un groupe de machines virtuelles identiques avec orchestration flexible et un nombre de domaines d'erreur de 3" }
    - id: d
      text: { en: "One availability set per zone with three fault domains each", fr: "Un groupe à haute disponibilité par zone avec trois domaines d'erreur chacun" }
answer: { optionId: a }
explanation:
  correct:
    en: For SAP workloads, only a flexible scale set with FD=1 is supported, and Microsoft recommends it for new deployments across zones. The VMs are spread across the zones you specify and, on a best-effort basis, across fault domains within each zone.
    fr: Pour les charges de travail SAP, seul un groupe de machines virtuelles identiques avec orchestration flexible et FD=1 est pris en charge, et Microsoft le recommande pour les nouveaux déploiements entre zones. Les machines virtuelles sont réparties entre les zones spécifiées et, dans la mesure du possible, entre les domaines d'erreur de chaque zone.
  options:
    b: { en: "Uniform orchestration can't be used for SAP workloads.", fr: "L'orchestration uniforme ne peut pas être utilisée pour les charges de travail SAP." }
    c: { en: "A flexible scale set with FD greater than 1 is a regional deployment, which isn't supported for SAP.", fr: "Un groupe flexible avec FD supérieur à 1 est un déploiement régional, qui n'est pas pris en charge pour SAP." }
    d: { en: "Availability sets can't be deployed within availability zones unless they are combined through a proximity placement group.", fr: "Les groupes à haute disponibilité ne peuvent pas être déployés dans des zones de disponibilité, sauf s'ils sont combinés au moyen d'un groupe de placement de proximité." }
references:
  - title: Virtual machine scale sets for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/virtual-machine-scale-set-sap-deployment-guide
  - title: SAP workload configurations with Azure Availability Zones
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones
