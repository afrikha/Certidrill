id: az120-3b-repl-wsfc-zones
objective: "3.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs the ASCS/SCS instance of an SAP system in a two-node Windows Server failover cluster. One node is in availability zone 1 and the other in availability zone 2. The cluster must use a cluster shared disk, not a file share, for the ASCS/SCS instance, and the disk content must remain available if either zone fails.

    Which two storage options can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders exécute l'instance ASCS/SCS d'un système SAP dans un cluster de basculement Windows Server à deux nœuds. Un nœud se trouve dans la zone de disponibilité 1 et l'autre dans la zone de disponibilité 2. Le cluster doit utiliser un disque partagé de cluster, et non un partage de fichiers, pour l'instance ASCS/SCS, et le contenu du disque doit rester disponible si l'une des zones tombe en panne.

    Quelles sont les deux options de stockage que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A Premium_LRS Azure shared disk with maxShares set to 2", fr: "Un disque partagé Azure Premium_LRS avec maxShares défini sur 2" } }
    - { id: b, text: { en: "A Premium_ZRS Azure shared disk with maxShares set to 2", fr: "Un disque partagé Azure Premium_ZRS avec maxShares défini sur 2" } }
    - { id: c, text: { en: "SIOS DataKeeper Cluster Edition mirroring a managed disk of each node", fr: "SIOS DataKeeper Cluster Edition qui met en miroir un disque managé de chaque nœud" } }
    - { id: d, text: { en: "An Azure NetApp Files SMB volume with cross-zone replication", fr: "Un volume SMB Azure NetApp Files avec réplication entre zones" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      For a zonal Windows cluster, Microsoft's guide uses an Azure shared disk with the Premium_ZRS SKU, which is replicated synchronously across zones and can be attached to VMs in different zones. SIOS DataKeeper Cluster Edition is the third-party alternative: it mirrors the local disks of the nodes synchronously and presents the volume to the cluster as a shared disk.
    fr: |
      Pour un cluster Windows zonal, le guide de Microsoft utilise un disque partagé Azure avec la référence Premium_ZRS, qui est répliqué de manière synchrone entre zones et peut être attaché à des machines virtuelles de zones différentes. SIOS DataKeeper Cluster Edition est l'alternative tierce : il met en miroir de manière synchrone les disques locaux des nœuds et présente le volume au cluster comme un disque partagé.
  options:
    a: { en: "Premium_LRS shared disks are for availability sets; an LRS disk can't be attached to a VM in another zone.", fr: "Les disques partagés Premium_LRS sont destinés aux groupes à haute disponibilité ; un disque LRS ne peut pas être attaché à une machine virtuelle d'une autre zone." }
    d: { en: "An SMB volume is a file share, not a cluster disk, and cross-zone replication is asynchronous with a manual failover.", fr: "Un volume SMB est un partage de fichiers, pas un disque de cluster, et la réplication entre zones est asynchrone avec un basculement manuel." }
references:
  - title: Prepare the Azure infrastructure for SAP HA by using a Windows failover cluster and shared disk for SAP ASCS/SCS
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-high-availability-infrastructure-wsfc-shared-disk
