id: az120-3b-asr-ascs-nfs
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank runs the ASCS/ERS instances of an SAP system in a Pacemaker cluster on RHEL in the West Europe region. The cluster virtual IPs are published by an internal Standard load balancer, and /sapmnt is an NFS share on Azure Files SSD with ZRS. Woodgrove enables Azure Site Recovery replication of the two cluster VMs to North Europe.

    You need to make sure that central services can run in North Europe after a failover.

    Which two actions should you perform in addition to the Site Recovery replication? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank exécute les instances ASCS/ERS d'un système SAP dans un cluster Pacemaker sur RHEL dans la région West Europe. Les adresses IP virtuelles du cluster sont publiées par un équilibreur de charge interne Standard, et /sapmnt est un partage NFS sur Azure Files SSD avec ZRS. Woodgrove active la réplication Azure Site Recovery des deux machines virtuelles du cluster vers North Europe.

    Vous devez vous assurer que les services centraux peuvent s'exécuter dans North Europe après un basculement.

    Quelles sont les deux actions à effectuer en plus de la réplication Site Recovery ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an internal Standard load balancer in North Europe with an empty backend pool.", fr: "Créer un équilibreur de charge interne Standard dans North Europe avec un pool principal vide." } }
    - { id: b, text: { en: "Enable geo-redundant storage (GRS) on the storage account of the /sapmnt share.", fr: "Activer le stockage géoredondant (GRS) sur le compte de stockage du partage /sapmnt." } }
    - { id: c, text: { en: "Copy /sapmnt to an NFS share in North Europe with a scheduled rsync script.", fr: "Copier /sapmnt vers un partage NFS dans North Europe avec un script rsync planifié." } }
    - { id: d, text: { en: "Enable Azure NetApp Files cross-region replication for the /sapmnt share.", fr: "Activer la réplication entre régions d'Azure NetApp Files pour le partage /sapmnt." } }
    - { id: e, text: { en: "Select the NFS mounts of the cluster VMs as replicated items in Site Recovery.", fr: "Sélectionner les montages NFS des machines virtuelles du cluster comme éléments répliqués dans Site Recovery." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Site Recovery replicates VMs and their managed disks, but not the Azure load balancer and not NFS mounts. You create an internal load balancer in the DR region beforehand (with an empty backend pool, filled after the failover) or after the failover. For NFS on Azure Files, Microsoft lists a custom method such as rsync for cross-region copies. The Pacemaker configuration must also be adjusted after the failover.
    fr: |
      Site Recovery réplique les machines virtuelles et leurs disques managés, mais ni l'équilibreur de charge Azure ni les montages NFS. Vous créez un équilibreur de charge interne dans la région de reprise à l'avance (avec un pool principal vide, rempli après le basculement) ou après le basculement. Pour NFS sur Azure Files, Microsoft indique une méthode personnalisée comme rsync pour la copie entre régions. La configuration Pacemaker doit aussi être ajustée après le basculement.
  options:
    b: { en: "Azure Files SSD offers LRS and ZRS only; GRS isn't available for it.", fr: "Azure Files SSD n'offre que LRS et ZRS ; GRS n'est pas disponible." }
    d: { en: "Cross-region replication is a feature of Azure NetApp Files volumes, not of Azure Files shares.", fr: "La réplication entre régions est une fonctionnalité des volumes Azure NetApp Files, pas des partages Azure Files." }
    e: { en: "Site Recovery doesn't replicate NFS mounts; only the VMs and their managed disks are replicated.", fr: "Site Recovery ne réplique pas les montages NFS ; seules les machines virtuelles et leurs disques managés sont répliqués." }
references:
  - title: Disaster recovery guidelines for SAP application
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-sap-guide
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
