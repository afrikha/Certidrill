id: az120-3a-clu-ha-interface
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys runs the ASCS and ERS instances of an SAP system named **NW1** in a Pacemaker cluster on SLES. When administrators stop the ASCS instance with sapcontrol for maintenance, the cluster detects a failure and fails the instance over.

    You need SAP's start and stop commands to be coordinated with the cluster.

    What should you configure?
  fr: |
    Wingtip Toys exécute les instances ASCS et ERS d'un système SAP nommé **NW1** dans un cluster Pacemaker sur SLES. Lorsque les administrateurs arrêtent l'instance ASCS avec sapcontrol pour une maintenance, le cluster détecte une défaillance et bascule l'instance.

    Vous devez faire en sorte que les commandes de démarrage et d'arrêt de SAP soient coordonnées avec le cluster.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "Set Autostart = 1 in the ASCS and ERS profiles.", fr: "Définir Autostart = 1 dans les profils ASCS et ERS." }
    - id: b
      text: { en: "Set AUTOMATIC_RECOVER=true on the SAPInstance resources.", fr: "Définir AUTOMATIC_RECOVER=true sur les ressources SAPInstance." }
    - id: c
      text: { en: "Configure the SAP HA interface with sap-suse-cluster-connector in the instance profiles.", fr: "Configurer l'interface HA SAP avec sap-suse-cluster-connector dans les profils d'instance." }
    - id: d
      text: { en: "Set the cluster property maintenance-mode=true permanently.", fr: "Définir la propriété de cluster maintenance-mode=true de façon permanente." }
answer: { optionId: c }
explanation:
  correct:
    en: The SAP HA interface (service/halib and service/halib_cluster_connector = /usr/bin/sap_suse_cluster_connector in the ASCS and ERS profiles, with the sidadm user added to the haclient group) lets sapcontrol pass start and stop requests to Pacemaker. The cluster then knows that the stop is intended and doesn't trigger a failover.
    fr: L'interface HA SAP (service/halib et service/halib_cluster_connector = /usr/bin/sap_suse_cluster_connector dans les profils ASCS et ERS, avec l'utilisateur sidadm ajouté au groupe haclient) permet à sapcontrol de transmettre les demandes de démarrage et d'arrêt à Pacemaker. Le cluster sait alors que l'arrêt est voulu et ne déclenche pas de basculement.
  options:
    a: { en: "Autostart must not be used for clustered instances such as ASCS/SCS, and it doesn't coordinate with the cluster.", fr: "Autostart ne doit pas être utilisé pour des instances en cluster comme l'ASCS/SCS, et il n'assure aucune coordination avec le cluster." }
    b: { en: "AUTOMATIC_RECOVER controls the cleanup of a crashed instance at start; it doesn't make sapcontrol cluster-aware.", fr: "AUTOMATIC_RECOVER contrôle le nettoyage d'une instance plantée au démarrage ; il ne rend pas sapcontrol conscient du cluster." }
    d: { en: "Permanent maintenance mode disables the cluster's protection altogether.", fr: "Un mode maintenance permanent désactive entièrement la protection du cluster." }
references:
  - title: Azure VMs high availability for SAP NetWeaver on SLES
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse
