id: az120-cs1a-dr-region
objective: "3.2.2"
type: yesno_statements
caseStudy: az120-cs1a-blue-yonder-airlines
difficulty: 3
status: draft
stem:
  en: |
    You are designing the disaster recovery solution of BYP in Germany North. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez la solution de reprise d'activité de BYP dans Germany North. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can configure Azure NetApp Files cross-region replication from Germany West Central to Germany North for the /sapmnt and /usr/sap/trans volumes.
        fr: |
          Vous pouvez configurer la réplication entre régions d'Azure NetApp Files de Germany West Central vers Germany North pour les volumes /sapmnt et /usr/sap/trans.
    - id: s2
      text:
        en: |
          When the HANA VM in Germany North receives asynchronous HANA System Replication, the BYP topology is supported by Azure Backup for SAP HANA.
        fr: |
          Quand la machine virtuelle HANA de Germany North reçoit la réplication HANA System Replication asynchrone, la topologie de BYP est prise en charge par Sauvegarde Azure pour SAP HANA.
    - id: s3
      text:
        en: |
          When Azure Site Recovery replicates ascs1 and ascs2 to Germany North, it also replicates the internal Standard load balancer of the ASCS/ERS cluster.
        fr: |
          Quand Azure Site Recovery réplique ascs1 et ascs2 vers Germany North, il réplique aussi l'équilibreur de charge interne Standard du cluster ASCS/ERS.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Azure NetApp Files cross-region replication works only between supported region pairs, and Germany West Central with Germany North is one of them. Azure Backup for SAP HANA doesn't support HANA System Replication combined with a DR replica or asynchronous replication, which is the BYP topology. Site Recovery replicates VMs and their managed disks, not Azure load balancers, so you create the internal load balancer in the DR region yourself and reconfigure the cluster.
    fr: |
      La réplication entre régions d'Azure NetApp Files ne fonctionne qu'entre des paires de régions prises en charge, et Germany West Central avec Germany North en fait partie. Sauvegarde Azure pour SAP HANA ne prend pas en charge HANA System Replication combinée à un réplica de reprise d'activité ou à une réplication asynchrone, ce qui correspond à la topologie de BYP. Site Recovery réplique les machines virtuelles et leurs disques managés, pas les équilibreurs de charge Azure : vous créez vous-même l'équilibreur de charge interne dans la région de reprise et vous reconfigurez le cluster.
references:
  - title: Understand Azure NetApp Files Replication
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/cross-region-replication-introduction
  - title: Disaster recovery guidelines for SAP application
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-sap-guide
