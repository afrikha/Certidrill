id: az120-3a-clu-automated-register
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has finished the failover tests of a two-node Pacemaker cluster for SAP HANA with HANA System Replication on SLES. During the tests, the SAPHanaController resource was configured with `AUTOMATED_REGISTER="false"`, and the administrators re-registered the former primary manually after each takeover.

    For production, Contoso wants the former primary to rejoin automatically as the new secondary after a takeover, so that replication resumes without manual action.

    What should you do?
  fr: |
    Contoso a terminé les tests de basculement d'un cluster Pacemaker à deux nœuds pour SAP HANA avec la réplication du système SAP HANA sur SLES. Pendant les tests, la ressource SAPHanaController était configurée avec `AUTOMATED_REGISTER="false"`, et les administrateurs réenregistraient manuellement l'ancien principal après chaque prise de contrôle.

    Pour la production, Contoso veut que l'ancien principal revienne automatiquement comme nouveau secondaire après une prise de contrôle, afin que la réplication reprenne sans action manuelle.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set PREFER_SITE_TAKEOVER to false on the SAPHanaController resource.", fr: "Définir PREFER_SITE_TAKEOVER sur false sur la ressource SAPHanaController." }
    - id: b
      text: { en: "Set DUPLICATE_PRIMARY_TIMEOUT to 0 on the SAPHanaController resource.", fr: "Définir DUPLICATE_PRIMARY_TIMEOUT sur 0 sur la ressource SAPHanaController." }
    - id: c
      text: { en: "Set AUTOMATED_REGISTER to true on the SAPHanaController resource.", fr: "Définir AUTOMATED_REGISTER sur true sur la ressource SAPHanaController." }
    - id: d
      text: { en: "Set migration-threshold to 1 in the resource defaults of the cluster.", fr: "Définir migration-threshold sur 1 dans les valeurs par défaut des ressources du cluster." }
answer: { optionId: c }
explanation:
  correct:
    en: With AUTOMATED_REGISTER set to true, the cluster registers the former primary as secondary when it comes back after a takeover, and system replication resumes automatically. Microsoft recommends false only during failover testing, so that each test is checked before replication is re-established.
    fr: Avec AUTOMATED_REGISTER défini sur true, le cluster enregistre l'ancien principal comme secondaire lorsqu'il revient après une prise de contrôle, et la réplication système reprend automatiquement. Microsoft recommande false uniquement pendant les tests de basculement, afin que chaque test soit vérifié avant le rétablissement de la réplication.
  options:
    a: { en: "PREFER_SITE_TAKEOVER controls whether the cluster prefers a takeover to the secondary site over a local restart; it doesn't register the old primary.", fr: "PREFER_SITE_TAKEOVER détermine si le cluster préfère une prise de contrôle vers le site secondaire à un redémarrage local ; il n'enregistre pas l'ancien principal." }
    b: { en: "DUPLICATE_PRIMARY_TIMEOUT is the wait time used when two primaries are detected; setting it to 0 doesn't register the former primary.", fr: "DUPLICATE_PRIMARY_TIMEOUT est le délai d'attente utilisé lorsque deux principaux sont détectés ; le définir sur 0 n'enregistre pas l'ancien principal." }
    d: { en: "migration-threshold sets how many failures move a resource away from a node; it doesn't affect system replication registration.", fr: "migration-threshold définit le nombre d'échecs qui déplacent une ressource hors d'un nœud ; il n'a aucun effet sur l'enregistrement de la réplication système." }
references:
  - title: High availability for SAP HANA on Azure VMs on SLES
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability
