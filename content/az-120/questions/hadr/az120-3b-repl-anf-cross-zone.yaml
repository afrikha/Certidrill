id: az120-3b-repl-anf-cross-zone
objective: "3.1.8"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum stores the /usr/sap/trans and interface file systems of its SAP landscape on Azure NetApp Files volumes in availability zone 1. Adatum plans to protect these volumes against a zone outage by using Azure NetApp Files cross-zone replication to zone 2.

    You need to describe the behavior of the solution to the operations team.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum stocke les systèmes de fichiers /usr/sap/trans et d'interface de son paysage SAP sur des volumes Azure NetApp Files dans la zone de disponibilité 1. Adatum prévoit de protéger ces volumes contre une panne de zone en utilisant la réplication entre zones d'Azure NetApp Files vers la zone 2.

    Vous devez décrire le comportement de la solution à l'équipe d'exploitation.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The data is replicated to zone 2 [[mode]].

      Before a failover, the destination volumes are [[access]].

      In addition to the capacity pools, Adatum pays [[cost]].
    fr: |
      Les données sont répliquées vers la zone 2 [[mode]].

      Avant un basculement, les volumes de destination sont [[access]].

      En plus des pools de capacité, Adatum paie [[cost]].
  slots:
    - id: mode
      options:
        - { id: sync, text: { en: "synchronously, like ZRS storage", fr: "de manière synchrone, comme un stockage ZRS" } }
        - { id: async, text: { en: "asynchronously, on a replication schedule", fr: "de manière asynchrone, selon une planification de réplication" } }
        - { id: asr, text: { en: "continuously, through Azure Site Recovery", fr: "en continu, par Azure Site Recovery" } }
    - id: access
      options:
        - { id: ro, text: { en: "read-only", fr: "en lecture seule" } }
        - { id: rw, text: { en: "read-write", fr: "en lecture-écriture" } }
        - { id: none, text: { en: "unmountable", fr: "impossibles à monter" } }
    - id: cost
      options:
        - { id: nothing, text: { en: "no charge for the data replication", fr: "aucuns frais pour la réplication des données" } }
        - { id: gib, text: { en: "a charge for each GiB replicated", fr: "des frais pour chaque Gio répliqué" } }
        - { id: setup, text: { en: "a one-time setup charge per volume", fr: "des frais de mise en place uniques par volume" } }
answer:
  values: { mode: async, access: ro, cost: nothing }
explanation:
  correct:
    en: |
      Azure NetApp Files cross-zone replication copies the source volume asynchronously, on the replication schedule, to a destination volume in another zone. During normal operation the destination volume is available read-only; it becomes read-write when you break the replication peering. The replicated volume sits in a capacity pool, so the cost depends on the capacity pool, with no extra charge for data replication.
    fr: |
      La réplication entre zones d'Azure NetApp Files copie le volume source de manière asynchrone, selon la planification de réplication, vers un volume de destination d'une autre zone. En fonctionnement normal, le volume de destination est accessible en lecture seule ; il passe en lecture-écriture lorsque vous interrompez le peering de réplication. Le volume répliqué se trouve dans un pool de capacité : le coût dépend donc du pool de capacité, sans frais supplémentaires pour la réplication des données.
  options:
    sync: { en: "Azure NetApp Files offers no synchronous replication across zones.", fr: "Azure NetApp Files n'offre aucune réplication synchrone entre zones." }
    rw: { en: "The destination becomes writable only after you break the replication peering.", fr: "La destination ne devient accessible en écriture qu'après l'interruption du peering de réplication." }
    gib: { en: "The per-GiB replication charge applies to cross-region replication, not to cross-zone replication.", fr: "Les frais de réplication par Gio s'appliquent à la réplication entre régions, pas à la réplication entre zones." }
references:
  - title: Understand Azure NetApp Files replication
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/cross-zone-replication-introduction
  - title: Create volume replication for Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/cross-region-replication-create-peering
