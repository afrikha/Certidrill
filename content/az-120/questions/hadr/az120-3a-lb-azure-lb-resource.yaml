id: az120-3a-lb-azure-lb-resource
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is configuring a Pacemaker cluster on two SLES VMs for the ASCS/SCS instance of an SAP system named **NW1**. A Standard internal load balancer has a frontend IP address for the ASCS virtual host name and a TCP health probe on port 62000.

    You need to ensure that the health probe succeeds only on the cluster node that currently runs the ASCS/SCS instance.

    Which cluster resource should you add to the ASCS/SCS resource group?
  fr: |
    Contoso configure un cluster Pacemaker sur deux machines virtuelles SLES pour l'instance ASCS/SCS d'un système SAP nommé **NW1**. Un équilibreur de charge interne Standard possède une adresse IP frontale pour le nom d'hôte virtuel ASCS et une sonde d'intégrité TCP sur le port 62000.

    Vous devez vous assurer que la sonde d'intégrité ne réussit que sur le nœud du cluster qui exécute actuellement l'instance ASCS/SCS.

    Quelle ressource de cluster devez-vous ajouter au groupe de ressources ASCS/SCS ?
body:
  options:
    - id: a
      text: { en: "An IPaddr2 resource configured with port 62000", fr: "Une ressource IPaddr2 configurée avec le port 62000" }
    - id: b
      text: { en: "An azure-events-az resource cloned on both nodes", fr: "Une ressource azure-events-az clonée sur les deux nœuds" }
    - id: c
      text: { en: "An azure-lb resource configured with port 62000", fr: "Une ressource azure-lb configurée avec le port 62000" }
    - id: d
      text: { en: "A SAPHanaTopology resource cloned on both nodes", fr: "Une ressource SAPHanaTopology clonée sur les deux nœuds" }
answer: { optionId: c }
explanation:
  correct:
    en: The azure-lb resource agent listens on the probe port, so only the node where the group runs answers the Azure Load Balancer health probe. Grouped with the IPaddr2 virtual IP and the file system, it moves with the ASCS/SCS instance during a failover, and the load balancer then sends traffic to the new node.
    fr: L'agent de ressource azure-lb écoute sur le port de la sonde ; seul le nœud qui exécute le groupe répond donc à la sonde d'intégrité d'Azure Load Balancer. Regroupée avec l'adresse IP virtuelle IPaddr2 et le système de fichiers, elle suit l'instance ASCS/SCS lors d'un basculement, et l'équilibreur de charge envoie alors le trafic vers le nouveau nœud.
  options:
    a: { en: "IPaddr2 configures the virtual IP address on the node; it doesn't listen on a probe port.", fr: "IPaddr2 configure l'adresse IP virtuelle sur le nœud ; il n'écoute pas sur un port de sonde." }
    b: { en: "azure-events-az reacts to Azure scheduled events; it doesn't answer load balancer probes.", fr: "azure-events-az réagit aux événements planifiés Azure ; il ne répond pas aux sondes de l'équilibreur de charge." }
    d: { en: "SAPHanaTopology collects HANA System Replication status; it isn't used for ASCS/SCS.", fr: "SAPHanaTopology collecte l'état de la réplication du système SAP HANA ; elle n'est pas utilisée pour l'ASCS/SCS." }
references:
  - title: Azure VMs high availability for SAP NetWeaver on SLES
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse
