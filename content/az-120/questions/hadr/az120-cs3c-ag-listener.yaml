id: az120-cs3c-ag-listener
objective: "3.1.5"
type: single
caseStudy: az120-cs3c-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a connectivity solution for the availability group of SQL-PRD1 and SQL-PRD2 that meets the database high availability requirement. What should you recommend?
  fr: |
    Vous devez recommander une solution de connectivité pour le groupe de disponibilité de SQL-PRD1 et SQL-PRD2 qui respecte l'exigence de haute disponibilité de la base de données. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A virtual network name (VNN) listener whose IP address is the frontend of a Standard internal load balancer", fr: "Un écouteur de nom de réseau virtuel (VNN) dont l'adresse IP est l'IP frontale d'un équilibreur de charge interne Standard" } }
    - { id: b, text: { en: "A distributed network name (DNN) listener that the SAP application servers use as the database host name", fr: "Un écouteur de nom de réseau distribué (DNN) que les serveurs d'applications SAP utilisent comme nom d'hôte de base de données" } }
    - { id: c, text: { en: "A SQL Server failover cluster instance on an Azure shared disk instead of the availability group", fr: "Une instance de cluster de basculement SQL Server sur un disque partagé Azure à la place du groupe de disponibilité" } }
    - { id: d, text: { en: "An Azure Traffic Manager profile with priority routing to the private IP addresses of the replicas", fr: "Un profil Azure Traffic Manager avec un routage par priorité vers les adresses IP privées des réplicas" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A distributed network name (DNN) listener can be used instead of an Azure load balancer for an SAP availability group, starting with SQL Server 2019 CU8, so SQL Server 2022 qualifies. The SAP application servers connect to the DNN name, so no load balancer is needed and the replicas stay in the same subnet.
    fr: |
      Un écouteur de nom de réseau distribué (DNN) peut être utilisé à la place d'un équilibreur de charge Azure pour un groupe de disponibilité SAP, à partir de SQL Server 2019 CU8 : SQL Server 2022 convient donc. Les serveurs d'applications SAP se connectent au nom DNN : aucun équilibreur de charge n'est nécessaire et les réplicas restent dans le même sous-réseau.
  options:
    a:
      en: |
        A VNN listener in a single subnet needs an Azure load balancer to route traffic to the primary replica, which the requirement forbids.
      fr: |
        Un écouteur VNN dans un seul sous-réseau a besoin d'un équilibreur de charge Azure pour router le trafic vers le réplica principal, ce que l'exigence interdit.
    c:
      en: |
        A failover cluster instance replaces the availability group design and still needs a load balancer or a DNN for its virtual name; it doesn't answer the listener requirement.
      fr: |
        Une instance de cluster de basculement remplace la conception par groupe de disponibilité et a encore besoin d'un équilibreur de charge ou d'un DNN pour son nom virtuel ; elle ne répond pas à l'exigence d'écouteur.
    d:
      en: |
        Traffic Manager is a DNS-based service for public endpoints; it isn't an availability group listener and doesn't follow WSFC failovers.
      fr: |
        Traffic Manager est un service basé sur DNS pour des points de terminaison publics ; ce n'est pas un écouteur de groupe de disponibilité et il ne suit pas les basculements WSFC.
references:
  - title: SQL Server Azure virtual machines DBMS deployment for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/dbms-guide-sqlserver
