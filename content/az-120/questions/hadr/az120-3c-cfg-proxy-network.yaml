id: az120-3c-cfg-proxy-network
objective: "3.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware hosts SAP HANA on Azure VMs in a spoke virtual network. The VMs can reach the internet only through an HTTP proxy at 10.20.0.4. The security team doesn't allow NSG rules that open outbound internet traffic, and no Azure Firewall is deployed.

    You need to configure the network so that Azure Backup for SAP HANA can discover, back up and restore the databases.

    What should you do?
  fr: |
    Litware héberge SAP HANA sur des machines virtuelles Azure dans un réseau virtuel spoke. Les machines virtuelles ne peuvent accéder à Internet que par un proxy HTTP à l'adresse 10.20.0.4. L'équipe de sécurité n'autorise aucune règle NSG ouvrant le trafic sortant vers Internet, et aucun Pare-feu Azure n'est déployé.

    Vous devez configurer le réseau pour que Sauvegarde Azure pour SAP HANA puisse découvrir, sauvegarder et restaurer les bases de données.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the proxy for Microsoft Entra ID, Azure Backup and Azure Storage traffic in ExtensionSettingsOverrides.json", fr: "Définir le proxy pour le trafic Microsoft Entra ID, Sauvegarde Azure et Stockage Azure dans ExtensionSettingsOverrides.json" } }
    - { id: b, text: { en: "Set the proxy for Microsoft Entra ID traffic in ExtensionSettingsOverrides.json, and create private endpoints for Azure Backup and Azure Storage", fr: "Définir le proxy pour le trafic Microsoft Entra ID dans ExtensionSettingsOverrides.json, et créer des points de terminaison privés pour Sauvegarde Azure et Stockage Azure" } }
    - { id: c, text: { en: "Set the proxy for Microsoft Entra ID traffic in ExtensionSettingsOverrides.json, and add virtual network service endpoints for Azure Backup and Azure Storage", fr: "Définir le proxy pour le trafic Microsoft Entra ID dans ExtensionSettingsOverrides.json, et ajouter des points de terminaison de service de réseau virtuel pour Sauvegarde Azure et Stockage Azure" } }
    - { id: d, text: { en: "Set the proxy for Azure Backup traffic in ExtensionSettingsOverrides.json, and create private endpoints for Microsoft Entra ID and Azure Storage", fr: "Définir le proxy pour le trafic Sauvegarde Azure dans ExtensionSettingsOverrides.json, et créer des points de terminaison privés pour Microsoft Entra ID et Stockage Azure" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For SAP HANA backup, an HTTP proxy is supported only for Microsoft Entra ID traffic (UseProxyForAAD in /opt/msawb/bin/ExtensionSettingsOverrides.json). Azure Backup and Azure Storage traffic must use another option, and private endpoints keep that traffic on private IPs without opening the internet.
    fr: |
      Pour la sauvegarde SAP HANA, un proxy HTTP n'est pris en charge que pour le trafic Microsoft Entra ID (UseProxyForAAD dans /opt/msawb/bin/ExtensionSettingsOverrides.json). Le trafic Sauvegarde Azure et Stockage Azure doit utiliser une autre option, et les points de terminaison privés conservent ce trafic sur des adresses IP privées sans ouvrir Internet.
  options:
    a: { en: "Proxy support doesn't cover Azure Backup or Azure Storage traffic.", fr: "La prise en charge du proxy ne couvre pas le trafic Sauvegarde Azure ni Stockage Azure." }
    c: { en: "A virtual network service endpoint can be used for Azure Storage only, not for Azure Backup.", fr: "Un point de terminaison de service de réseau virtuel n'est utilisable que pour Stockage Azure, pas pour Sauvegarde Azure." }
    d: { en: "The proxy can't carry Azure Backup traffic, and Microsoft Entra ID private endpoints are only in private preview.", fr: "Le proxy ne peut pas transporter le trafic Sauvegarde Azure, et les points de terminaison privés Microsoft Entra ID ne sont qu'en préversion privée." }
references:
  - title: Back up SAP HANA databases in Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-sap-hana-database
