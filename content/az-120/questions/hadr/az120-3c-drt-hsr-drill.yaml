id: az120-3c-drt-hsr-drill
objective: "3.2.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso replicates its production SAP HANA database from East US 2 to Central US by using asynchronous HANA System Replication. A planned DR exercise will move the database to Central US during a maintenance window. The application servers are already handled by Azure Site Recovery.

    Which two actions should you perform for the database during the exercise? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso réplique sa base de données SAP HANA de production d'East US 2 vers Central US par la réplication du système HANA asynchrone. Un exercice de reprise planifié déplacera la base de données vers Central US pendant une fenêtre de maintenance. Les serveurs d'applications sont déjà pris en charge par Azure Site Recovery.

    Quelles sont les deux actions à effectuer pour la base de données pendant l'exercice ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Confirm that all committed data on the primary has reached the secondary in Central US", fr: "Vérifier que toutes les données validées sur le principal ont atteint le secondaire en Central US" } }
    - { id: b, text: { en: "Switch the replication mode to synchronous for the duration of the exercise", fr: "Passer le mode de réplication en synchrone pendant la durée de l'exercice" } }
    - { id: c, text: { en: "Run a takeover on the HANA node in Central US", fr: "Lancer une prise de contrôle sur le nœud HANA de Central US" } }
    - { id: d, text: { en: "Add the Central US node to the Pacemaker cluster so that it fails over automatically", fr: "Ajouter le nœud de Central US au cluster Pacemaker pour qu'il bascule automatiquement" } }
    - { id: e, text: { en: "Run a test failover of the HANA VM with Azure Site Recovery", fr: "Lancer un test de basculement de la machine virtuelle HANA avec Azure Site Recovery" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Cross-region HSR is asynchronous, so committed data may not have reached the secondary yet: before moving, especially in an exercise, you must confirm it has. The cross-region failover is always manual: you run the takeover (hdbnsutil -sr_takeover) on the DR node, then redirect clients, preferably through DNS.
    fr: |
      La HSR interrégion est asynchrone : des données validées peuvent ne pas encore avoir atteint le secondaire, et vous devez vérifier qu'elles l'ont fait avant de basculer, surtout lors d'un exercice. Le basculement interrégion est toujours manuel : vous lancez la prise de contrôle (hdbnsutil -sr_takeover) sur le nœud de reprise, puis redirigez les clients, de préférence par le DNS.
  options:
    b: { en: "The network latency between regions rules out synchronous replication for SAP workloads.", fr: "La latence réseau entre régions exclut la réplication synchrone pour les charges de travail SAP." }
    d: { en: "Automatic failover isn't an option with asynchronous cross-region replication; the takeover is manual.", fr: "Le basculement automatique n'est pas possible avec une réplication interrégion asynchrone ; la prise de contrôle est manuelle." }
    e: { en: "The database is protected by HSR, not by Site Recovery, which doesn't guarantee database consistency.", fr: "La base de données est protégée par la HSR, pas par Site Recovery, qui ne garantit pas la cohérence de la base." }
references:
  - title: SAP HANA availability across Azure regions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-availability-across-regions
