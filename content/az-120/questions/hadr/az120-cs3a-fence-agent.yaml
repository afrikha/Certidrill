id: az120-cs3a-fence-agent
objective: "3.1.7"
type: ordering
caseStudy: az120-cs3a-coho-winery
difficulty: 2
status: draft
stem:
  en: |
    A custom role named **Linux Fence Agent** that allows reading compute resources and powering off and starting VMs exists in the subscription. You need to configure fencing for the HANA cluster to meet the fencing requirement.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un rôle personnalisé nommé **Linux Fence Agent**, qui permet de lire les ressources de calcul ainsi que d'arrêter et de démarrer des machines virtuelles, existe dans l'abonnement. Vous devez configurer l'isolation du cluster HANA pour respecter l'exigence d'isolation.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: msi, text: { en: "Enable a system-assigned managed identity on HANA-PRD1 and on HANA-PRD2.", fr: "Activer une identité managée affectée par le système sur HANA-PRD1 et sur HANA-PRD2." } }
    - { id: role, text: { en: "Assign the Linux Fence Agent role to the identity of each node, on both cluster VMs.", fr: "Attribuer le rôle Linux Fence Agent à l'identité de chaque nœud, sur les deux machines virtuelles du cluster." } }
    - { id: stonith, text: { en: "Create a fence_azure_arm STONITH resource with the msi=true parameter.", fr: "Créer une ressource STONITH fence_azure_arm avec le paramètre msi=true." } }
    - { id: uami, text: { en: "Create one user-assigned managed identity and attach it to both cluster VMs.", fr: "Créer une identité managée affectée par l'utilisateur et l'attacher aux deux machines virtuelles du cluster." } }
    - { id: spn, text: { en: "Register an application and store its client secret in the STONITH resource.", fr: "Inscrire une application et stocker son secret client dans la ressource STONITH." } }
    - { id: sbd, text: { en: "Create a Premium_ZRS shared disk with maxShares set to 2 for an SBD device.", fr: "Créer un disque partagé Premium_ZRS avec maxShares défini sur 2 pour un appareil SBD." } }
answer:
  sequence: [ msi, role, stonith ]
explanation:
  correct:
    en: |
      The Azure fence agent authenticates with a system-assigned managed identity on each cluster VM, so no secret is stored on the nodes and no extra VM or disk is needed. Each identity then receives the Linux Fence Agent role on every VM of the cluster, including its own VM, so that either node can power off the other. Finally, you create the fence_azure_arm STONITH resource with msi=true, the resource group, the subscription ID and the pcmk_host_map.
    fr: |
      L'agent Azure Fence s'authentifie avec une identité managée affectée par le système sur chaque machine virtuelle du cluster : aucun secret n'est stocké sur les nœuds et aucune machine virtuelle ni aucun disque supplémentaire n'est nécessaire. Chaque identité reçoit ensuite le rôle Linux Fence Agent sur toutes les machines virtuelles du cluster, y compris la sienne, pour que chaque nœud puisse arrêter l'autre. Enfin, vous créez la ressource STONITH fence_azure_arm avec msi=true, le groupe de ressources, l'ID d'abonnement et pcmk_host_map.
  options:
    uami:
      en: |
        User-assigned managed identities aren't supported by the Azure fence agent at this time.
      fr: |
        Les identités managées affectées par l'utilisateur ne sont pas prises en charge par l'agent Azure Fence pour le moment.
    spn:
      en: |
        A service principal requires a secret in the cluster configuration, which the fencing requirement forbids.
      fr: |
        Un principal de service exige un secret dans la configuration du cluster, ce que l'exigence d'isolation interdit.
    sbd:
      en: |
        An SBD device on an Azure shared disk adds a shared disk, which the fencing requirement forbids.
      fr: |
        Un appareil SBD sur un disque partagé Azure ajoute un disque partagé, ce que l'exigence d'isolation interdit.
references:
  - title: Set up Pacemaker on SUSE Linux Enterprise Server (SLES) in Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-pacemaker
