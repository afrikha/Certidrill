id: az120-3c-drt-recovery-point
objective: "3.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind protects the SAP Web Dispatcher, ASCS/ERS and application server VMs of its SAP ERP system with Azure Site Recovery. All the VMs are in a recovery plan named **rp-erp**.

    During the yearly DR drill, the auditors want to measure the shortest possible time to bring the VMs online in the target region. The age of the data on the application tier doesn't matter for the drill.

    Which recovery point should you select when you run the test failover of rp-erp?
  fr: |
    Northwind protège les machines virtuelles SAP Web Dispatcher, ASCS/ERS et des serveurs d'applications de son système SAP ERP avec Azure Site Recovery. Toutes les machines virtuelles font partie d'un plan de récupération nommé **rp-erp**.

    Lors de l'exercice annuel de reprise, les auditeurs veulent mesurer le temps le plus court possible pour mettre les machines virtuelles en ligne dans la région cible. L'ancienneté des données de la couche d'applications n'a pas d'importance pour l'exercice.

    Quel point de récupération devez-vous sélectionner lorsque vous lancez le test de basculement de rp-erp ?
body:
  options:
    - { id: a, text: Latest processed }
    - { id: b, text: Latest app-consistent }
    - { id: c, text: Latest }
    - { id: d, text: Custom }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Latest processed fails over all VMs of the plan to the latest recovery point that Site Recovery has already processed. No time is spent processing pending data, which gives the lowest RTO.
    fr: |
      Latest processed bascule toutes les machines virtuelles du plan vers le dernier point de récupération déjà traité par Site Recovery. Aucun temps n'est consacré au traitement des données en attente, ce qui donne le RTO le plus faible.
  options:
    c: { en: "Latest first processes all the data sent to Site Recovery: it gives the lowest RPO, not the lowest RTO.", fr: "Latest traite d'abord toutes les données envoyées à Site Recovery : il donne le RPO le plus faible, pas le RTO le plus faible." }
    b: { en: "The latest app-consistent point is older than the latest processed point and adds no speed benefit.", fr: "Le dernier point cohérent avec les applications est plus ancien que le dernier point traité et n'apporte aucun gain de rapidité." }
    d: { en: "Custom selects a point for a specific VM; it isn't available for a recovery plan failover.", fr: "Custom sélectionne un point pour une machine virtuelle précise ; il n'est pas disponible pour le basculement d'un plan de récupération." }
references:
