id: az120-cs3a-hana-ilb
objective: "3.1.3"
type: dropdown
caseStudy: az120-cs3a-coho-winery
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You need to configure load balancing for the production HANA database to meet the high availability requirement. How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer l'équilibrage de charge de la base de données HANA de production pour respecter l'exigence de haute disponibilité. Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Load balancer: [[lb]]

      Load-balancing rule with HA ports and Floating IP enabled, idle timeout (minutes): [[idle]]

      Health probe, TCP port: [[probe]]

      Kernel parameter net.ipv4.tcp_timestamps on HANA-PRD1 and HANA-PRD2: [[ts]]
    fr: |
      Équilibreur de charge : [[lb]]

      Règle d'équilibrage de charge avec ports HA et IP flottante activés, délai d'inactivité (minutes) : [[idle]]

      Sonde d'intégrité, port TCP : [[probe]]

      Paramètre de noyau net.ipv4.tcp_timestamps sur HANA-PRD1 et HANA-PRD2 : [[ts]]
  slots:
    - id: lb
      options:
        - { id: gw, text: { en: "Gateway load balancer chained to the HANA network interfaces", fr: "Équilibreur de charge de passerelle chaîné aux interfaces réseau HANA" } }
        - { id: int, text: { en: "Standard internal load balancer with a frontend IP in the HANA subnet", fr: "Équilibreur de charge interne Standard avec une IP frontale dans le sous-réseau HANA" } }
        - { id: pub, text: { en: "Standard public load balancer with a public frontend IP address", fr: "Équilibreur de charge public Standard avec une adresse IP frontale publique" } }
    - id: idle
      options:
        - { id: i4, text: "4" }
        - { id: i30, text: "30" }
        - { id: i60, text: "60" }
    - id: probe
      options:
        - { id: p30313, text: "30313" }
        - { id: p50313, text: "50313" }
        - { id: p62503, text: "62503" }
        - { id: p62603, text: "62603" }
    - id: ts
      options:
        - { id: t0, text: "0" }
        - { id: t1, text: "1" }
        - { id: t2, text: "2" }
answer:
  values: { lb: int, idle: i30, probe: p62503, ts: t0 }
explanation:
  correct:
    en: |
      Microsoft's HANA cluster guide uses a Standard internal load balancer whose frontend IP is in the database subnet, with a rule that enables HA ports and Floating IP and sets the idle timeout to 30 minutes. The health probe answers on port 625 followed by the instance number, so 62503 for instance 03; the azure-lb cluster resource listens on that port on the primary node only. TCP timestamps must be disabled (net.ipv4.tcp_timestamps = 0) on VMs behind Azure Load Balancer, otherwise the health probes fail.
    fr: |
      Le guide de cluster HANA de Microsoft utilise un équilibreur de charge interne Standard dont l'IP frontale est dans le sous-réseau de base de données, avec une règle qui active les ports HA et l'IP flottante et définit le délai d'inactivité à 30 minutes. La sonde d'intégrité répond sur le port 625 suivi du numéro d'instance, soit 62503 pour l'instance 03 ; la ressource de cluster azure-lb écoute sur ce port uniquement sur le nœud primaire. Les horodatages TCP doivent être désactivés (net.ipv4.tcp_timestamps = 0) sur les machines virtuelles placées derrière Azure Load Balancer, sinon les sondes d'intégrité échouent.
  options:
    gw:
      en: |
        A gateway load balancer inserts network virtual appliances in a traffic path; it doesn't publish a virtual IP address for a cluster.
      fr: |
        Un équilibreur de charge de passerelle insère des appliances virtuelles réseau dans un chemin de trafic ; il ne publie pas d'adresse IP virtuelle pour un cluster.
    pub:
      en: |
        The database must only be reachable on a private virtual IP address inside the virtual network.
      fr: |
        La base de données doit être joignable uniquement sur une adresse IP virtuelle privée dans le réseau virtuel.
    p30313:
      en: |
        30313 is the SQL port of the HANA system database for instance 03, not the probe port of the cluster resource.
      fr: |
        30313 est le port SQL de la base de données système HANA pour l'instance 03, pas le port de sonde de la ressource de cluster.
    p62603:
      en: |
        The 626 prefix is used for the probe of the optional read-enabled secondary virtual IP address.
      fr: |
        Le préfixe 626 sert à la sonde de l'adresse IP virtuelle secondaire facultative ouverte en lecture.
references:
  - title: High availability for SAP HANA on Azure VMs on SLES
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability
