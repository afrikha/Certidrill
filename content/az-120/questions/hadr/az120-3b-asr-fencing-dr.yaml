id: az120-3b-asr-fencing-dr
objective: "3.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs three SAP systems on SLES. Each system has an ASCS/ERS Pacemaker cluster that uses a different fencing mechanism, as shown in the answer area. Adatum replicates the cluster VMs of the three systems to a DR region with Azure Site Recovery and wants to keep the same fencing mechanism after a failover.

    Which action should be part of the DR procedure for each cluster? To answer, drag the appropriate actions to the correct clusters. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute trois systèmes SAP sur SLES. Chaque système dispose d'un cluster Pacemaker ASCS/ERS qui utilise un mécanisme de clôture différent, comme indiqué dans la zone de réponse. Adatum réplique les machines virtuelles des clusters des trois systèmes vers une région de reprise d'activité avec Azure Site Recovery et veut conserver le même mécanisme de clôture après un basculement.

    Quelle action doit faire partie de la procédure de reprise d'activité de chaque cluster ? Pour répondre, faites glisser les actions appropriées vers les clusters correspondants. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: iscsi, text: { en: "Replicate the iSCSI target servers with Site Recovery, and discover the iSCSI disks again on the DR VMs", fr: "Répliquer les serveurs cibles iSCSI avec Site Recovery, et redécouvrir les disques iSCSI sur les machines virtuelles de reprise" } }
    - { id: msi, text: { en: "Enable managed identities on the DR VMs, assign the custom role, and update the fence agent resource", fr: "Activer des identités managées sur les machines virtuelles de reprise, attribuer le rôle personnalisé et mettre à jour la ressource de l'agent de clôture" } }
    - { id: newdisk, text: { en: "Create a shared disk in the DR region, and attach it to the DR VMs after the failover", fr: "Créer un disque partagé dans la région de reprise, et l'attacher aux machines virtuelles de reprise après le basculement" } }
    - { id: none, text: { en: "Rely on Site Recovery, which replicates the fencing configuration with no further action", fr: "S'appuyer sur Site Recovery, qui réplique la configuration de clôture sans autre action" } }
    - { id: switch, text: { en: "Configure a different fencing mechanism in the DR region than in the primary region", fr: "Configurer dans la région de reprise un mécanisme de clôture différent de celui de la région primaire" } }
  targets:
    - { id: t_iscsi, text: { en: "AD1 cluster: SBD with iSCSI target servers", fr: "Cluster AD1 : SBD avec des serveurs cibles iSCSI" } }
    - { id: t_agent, text: { en: "AD2 cluster: Azure fence agent", fr: "Cluster AD2 : agent de clôture Azure" } }
    - { id: t_disk, text: { en: "AD3 cluster: SBD with an Azure shared disk", fr: "Cluster AD3 : SBD avec un disque partagé Azure" } }
answer:
  mapping: { t_iscsi: iscsi, t_agent: msi, t_disk: newdisk }
explanation:
  correct:
    en: |
      Microsoft's DR guidance keeps the same fencing mechanism in both regions. With SBD on iSCSI, you replicate the iSCSI target servers with Site Recovery and rediscover the iSCSI disks on the DR VMs. With the Azure fence agent, you enable managed identities on the DR VMs, assign the custom role and update the fence agent resource. With SBD on an Azure shared disk, you configure a new shared disk in the DR region and attach it after the failover. In every case the cluster needs reconfiguration: the as-is Pacemaker configuration doesn't work out of the box.
    fr: |
      Les recommandations de reprise d'activité de Microsoft conservent le même mécanisme de clôture dans les deux régions. Avec SBD sur iSCSI, vous répliquez les serveurs cibles iSCSI avec Site Recovery et redécouvrez les disques iSCSI sur les machines virtuelles de reprise. Avec l'agent de clôture Azure, vous activez des identités managées sur les machines virtuelles de reprise, attribuez le rôle personnalisé et mettez à jour la ressource de l'agent de clôture. Avec SBD sur un disque partagé Azure, vous configurez un nouveau disque partagé dans la région de reprise et l'attachez après le basculement. Dans tous les cas, le cluster doit être reconfiguré : la configuration Pacemaker telle quelle ne fonctionne pas directement.
  options:
    none: { en: "The replicated Pacemaker configuration doesn't work as-is after a failover; it needs additional reconfiguration.", fr: "La configuration Pacemaker répliquée ne fonctionne pas telle quelle après un basculement ; elle doit être reconfigurée." }
    switch: { en: "Microsoft advises against using a different fencing mechanism after the failover.", fr: "Microsoft déconseille d'utiliser un mécanisme de clôture différent après le basculement." }
references:
  - title: Disaster recovery guidelines for SAP application
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-sap-guide
