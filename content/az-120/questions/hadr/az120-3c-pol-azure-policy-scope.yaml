id: az120-3c-pol-azure-policy-scope
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a management group named **MG-SAP** that contains two subscriptions, **Sub-Prod** and **Sub-NonProd**. Each subscription has SAP application server VMs in West Europe and in North Europe, and a Recovery Services vault in each of the two regions.

    You need to ensure that every new VM tagged **Backup=SAP** is automatically protected in the vault of its own region. The solution must use the built-in policy "Configure backup on virtual machines with a given tag to an existing recovery services vault in the same location".

    How should you assign the policy?
  fr: |
    Proseware dispose d'un groupe d'administration nommé **MG-SAP** qui contient deux abonnements, **Sub-Prod** et **Sub-NonProd**. Chaque abonnement contient des machines virtuelles de serveurs d'applications SAP en West Europe et en North Europe, ainsi qu'un coffre Recovery Services dans chacune des deux régions.

    Vous devez vous assurer que chaque nouvelle machine virtuelle dotée de l'étiquette **Backup=SAP** est automatiquement protégée dans le coffre de sa propre région. La solution doit utiliser la stratégie intégrée « Configure backup on virtual machines with a given tag to an existing recovery services vault in the same location ».

    Comment devez-vous attribuer la stratégie ?
body:
  options:
    - { id: a, text: { en: "One assignment for each subscription and location", fr: "Une attribution pour chaque abonnement et chaque emplacement" } }
    - { id: b, text: { en: "One assignment for each subscription", fr: "Une attribution pour chaque abonnement" } }
    - { id: c, text: { en: "One assignment at the MG-SAP scope", fr: "Une attribution à l'étendue MG-SAP" } }
    - { id: d, text: { en: "One assignment for each location at the MG-SAP scope", fr: "Une attribution pour chaque emplacement à l'étendue MG-SAP" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each assignment of this policy covers one subscription and one location, with a vault in the same location, so you need four assignments here. Management group scope isn't supported for this policy. Existing VMs are then protected through a remediation task.
    fr: |
      Chaque attribution de cette stratégie couvre un abonnement et un emplacement, avec un coffre dans le même emplacement : il faut donc ici quatre attributions. L'étendue groupe d'administration n'est pas prise en charge pour cette stratégie. Les machines virtuelles existantes sont ensuite protégées par une tâche de correction.
  options:
    c: { en: "Management group scope isn't supported, and one assignment targets a single location and vault.", fr: "L'étendue groupe d'administration n'est pas prise en charge, et une attribution cible un seul emplacement et un seul coffre." }
    b: { en: "A subscription-level assignment still targets only one location and its vault, so the VMs of the other region wouldn't be protected.", fr: "Une attribution au niveau de l'abonnement ne cible toujours qu'un emplacement et son coffre : les machines virtuelles de l'autre région ne seraient pas protégées." }
    d: { en: "Management group scope isn't supported for this policy.", fr: "L'étendue groupe d'administration n'est pas prise en charge pour cette stratégie." }
references:
  - title: Audit and enforce backup during virtual machine creation automatically using Azure Policy
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-auto-enable-backup
