id: az120-sr1-hana-vip-1
objective: "3.1.3"
type: series_yesno
series: az120-sr1-hana-vip
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: |-
    You deploy an internal Standard load balancer and enable TCP timestamps on both VMs.
  fr: |-
    Vous déployez un équilibreur de charge Standard interne et activez les horodatages TCP sur les deux machines virtuelles.
body:
  solution:
    en: |-
      You deploy an **internal Standard** load balancer with a frontend IP configuration in db-subnet and a backend pool that contains hana1 and hana2. You create a load-balancing rule with **HA ports**, **floating IP** enabled and an idle timeout of 30 minutes, and a TCP health probe on port **62503** with a probe threshold of 2, answered by an `azure-lb` cluster resource that runs with the primary. To tune the network stack, you set `net.ipv4.tcp_timestamps` to **1** on both VMs.
    fr: |-
      Vous déployez un équilibreur de charge **Standard interne** avec une configuration IP frontale dans db-subnet et un pool principal qui contient hana1 et hana2. Vous créez une règle d'équilibrage de charge avec les **Ports HA**, l'**IP flottante** activée et un délai d'inactivité de 30 minutes, ainsi qu'une sonde d'intégrité TCP sur le port **62503** avec un seuil de sonde de 2, à laquelle répond une ressource de cluster `azure-lb` qui s'exécute avec le primaire. Pour optimiser la pile réseau, vous définissez `net.ipv4.tcp_timestamps` sur **1** sur les deux machines virtuelles.
answer: { value: false }
explanation:
  correct:
    en: |-
      The load balancer design is the documented one, but TCP timestamps must not be enabled on Azure VMs placed behind Azure Load Balancer: they cause the health probes to fail, so the load balancer can't detect which node is the primary. `net.ipv4.tcp_timestamps` must be set to 0.
    fr: |-
      La conception de l'équilibreur de charge est celle documentée, mais les horodatages TCP ne doivent pas être activés sur les machines virtuelles Azure placées derrière Azure Load Balancer : ils font échouer les sondes d'intégrité, et l'équilibreur de charge ne peut plus détecter le nœud primaire. `net.ipv4.tcp_timestamps` doit être défini sur 0.
references:
  - title: High availability for SAP HANA on Azure VMs on SUSE Linux Enterprise Server
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability
