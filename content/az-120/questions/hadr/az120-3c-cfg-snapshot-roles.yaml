id: az120-3c-cfg-snapshot-roles
objective: "3.2.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind is configuring HANA instance snapshot backups for an SAP HANA VM named **hdb01**. The managed disks of hdb01 are in a resource group named **RG-SAP-Disks**, and the snapshots will be stored in a resource group named **RG-SAP-Snaps**. The backup policy uses the system-assigned managed identity of hdb01.

    You need to assign the built-in roles required for the snapshot backups. The solution must follow the principle of least privilege.

    Which role should you assign for each scope? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind configure des sauvegardes par instantanés d'instance HANA pour une machine virtuelle SAP HANA nommée **hdb01**. Les disques managés de hdb01 se trouvent dans un groupe de ressources nommé **RG-SAP-Disks**, et les instantanés seront stockés dans un groupe de ressources nommé **RG-SAP-Snaps**. La stratégie de sauvegarde utilise l'identité managée affectée par le système de hdb01.

    Vous devez attribuer les rôles intégrés nécessaires aux sauvegardes par instantanés. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer pour chaque étendue ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Managed identity of hdb01 on RG-SAP-Disks: [[r1]]

      Managed identity of hdb01 on RG-SAP-Snaps: [[r2]]

      Backup Management Service on RG-SAP-Snaps: [[r3]]
    fr: |
      Identité managée de hdb01 sur RG-SAP-Disks : [[r1]]

      Identité managée de hdb01 sur RG-SAP-Snaps : [[r2]]

      Backup Management Service sur RG-SAP-Snaps : [[r3]]
  slots:
    - id: r1
      options:
        - { id: dbr, text: Disk Backup Reader }
        - { id: dsc, text: Disk Snapshot Contributor }
        - { id: dro, text: Disk Restore Operator }
        - { id: vmc, text: Virtual Machine Contributor }
    - id: r2
      options:
        - { id: dbr, text: Disk Backup Reader }
        - { id: dsc, text: Disk Snapshot Contributor }
        - { id: dro, text: Disk Restore Operator }
        - { id: bc, text: Backup Contributor }
    - id: r3
      options:
        - { id: dbr, text: Disk Backup Reader }
        - { id: dsc, text: Disk Snapshot Contributor }
        - { id: bo, text: Backup Operator }
        - { id: rdr, text: Reader }
answer:
  values: { r1: dbr, r2: dsc, r3: dsc }
explanation:
  correct:
    en: |
      The VM managed identity needs Disk Backup Reader on the source disk resource group to create snapshots of the disks, and Disk Snapshot Contributor on the snapshot resource group to create and store them. The Backup Management Service also needs Disk Snapshot Contributor on the snapshot resource group to delete old snapshots; this assignment is done manually.
    fr: |
      L'identité managée de la machine virtuelle a besoin de Disk Backup Reader sur le groupe de ressources des disques source pour créer les instantanés des disques, et de Disk Snapshot Contributor sur le groupe de ressources des instantanés pour les créer et les stocker. Le Backup Management Service a aussi besoin de Disk Snapshot Contributor sur le groupe de ressources des instantanés pour supprimer les anciens instantanés ; cette attribution se fait manuellement.
  options:
    dro: { en: "Disk Restore Operator is used on the target disk resource group during a snapshot restore, not for backups.", fr: "Disk Restore Operator sert sur le groupe de ressources des disques cible lors d'une restauration d'instantané, pas pour les sauvegardes." }
    vmc: { en: "Virtual Machine Contributor on the source VM is for the backup administrator who configures the backup.", fr: "Virtual Machine Contributor sur la machine virtuelle source est destiné à l'administrateur de sauvegarde qui configure la sauvegarde." }
    bo: { en: "Backup Operator is a vault role; it doesn't let the service delete disk snapshots in a resource group.", fr: "Backup Operator est un rôle de coffre ; il ne permet pas au service de supprimer des instantanés de disque dans un groupe de ressources." }
references:
  - title: Back up SAP HANA database instances on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-instances-backup
