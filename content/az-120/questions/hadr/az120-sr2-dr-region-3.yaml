id: az120-sr2-dr-region-3
objective: "3.2.1"
type: series_yesno
series: az120-sr2-dr-region
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You combine Site Recovery, Azure NetApp Files cross-region replication and asynchronous HSR.
  fr: |
    Vous combinez Site Recovery, la réplication entre régions d'Azure NetApp Files et HSR asynchrone.
body:
  solution:
    en: |
      You enable **Azure Site Recovery** replication to North Europe for the Web Dispatcher, application server and ASCS/ERS VMs. You configure **cross-region replication** of the Azure NetApp Files volumes to North Europe. You add a HANA VM in North Europe as a third HSR site in **asynchronous** mode.
    fr: |
      Vous activez la réplication **Azure Site Recovery** vers North Europe pour les machines virtuelles Web Dispatcher, de serveur d'applications et ASCS/ERS. Vous configurez la **réplication entre régions** des volumes Azure NetApp Files vers North Europe. Vous ajoutez dans North Europe une machine virtuelle HANA comme troisième site HSR en mode **asynchrone**.
answer: { value: true }
explanation:
  correct:
    en: |
      Site Recovery is the recommended DR method for the Web Dispatcher, application server and central services VMs, and the NFS shared directories on Azure NetApp Files are covered by its cross-region replication, which supports West Europe and North Europe. Native HSR keeps the database copy consistent, and asynchronous mode avoids adding the cross-region latency to production commits.
    fr: |
      Site Recovery est la méthode de reprise d'activité recommandée pour les machines virtuelles Web Dispatcher, de serveur d'applications et des services centraux, et les répertoires partagés NFS sur Azure NetApp Files sont couverts par sa réplication entre régions, qui prend en charge West Europe et North Europe. HSR natif conserve une copie cohérente de la base de données, et le mode asynchrone évite d'ajouter la latence entre régions aux validations de production.
references:
