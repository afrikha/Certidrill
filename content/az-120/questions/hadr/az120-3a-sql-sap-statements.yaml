id: az120-3a-sql-sap-statements
objective: "3.1.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is planning the SQL Server database layer of an SAP NetWeaver system on Azure VMs with an Always On availability group.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank planifie la couche de base de données SQL Server d'un système SAP NetWeaver sur des machines virtuelles Azure avec un groupe de disponibilité Always On.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The database VMs can run SQL Server on Linux if they use an availability group.
        fr: Les machines virtuelles de base de données peuvent exécuter SQL Server sur Linux si elles utilisent un groupe de disponibilité.
    - id: s2
      text:
        en: SAP supports SQL Server Transparent Data Encryption (TDE) on the database.
        fr: SAP prend en charge le chiffrement transparent des données (TDE) de SQL Server sur la base de données.
    - id: s3
      text:
        en: Database backups can be taken from a secondary replica of the availability group.
        fr: Les sauvegardes de la base de données peuvent être effectuées à partir d'un réplica secondaire du groupe de disponibilité.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: SAP doesn't support the Linux version of SQL Server with any SAP software, whatever the HA configuration. SAP fully supports SQL Server TDE. Several customers use the availability group to run backups from a secondary replica, which offloads the primary.
    fr: SAP ne prend en charge la version Linux de SQL Server avec aucun logiciel SAP, quelle que soit la configuration de haute disponibilité. SAP prend entièrement en charge le TDE de SQL Server. Plusieurs clients utilisent le groupe de disponibilité pour effectuer les sauvegardes à partir d'un réplica secondaire, ce qui décharge le principal.
references:
  - title: SQL Server Azure virtual machines DBMS deployment for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/dbms-guide-sqlserver
