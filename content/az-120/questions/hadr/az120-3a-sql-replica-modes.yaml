id: az120-3a-sql-replica-modes
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs the SQL Server database of its SAP Business Suite system in an Always On availability group. The primary replica runs in availability zone 1 of West Europe. Litware adds a secondary replica in zone 2 of West Europe and a secondary replica in North Europe.

    The design must meet the following requirements:

    - A zone failure must not lose committed transactions, and failover within West Europe must be automatic.
    - The latency to North Europe must not delay commits on the primary.

    How should you configure the availability modes of the secondary replicas?
  fr: |
    Litware exécute la base de données SQL Server de son système SAP Business Suite dans un groupe de disponibilité Always On. Le réplica principal s'exécute dans la zone de disponibilité 1 de West Europe. Litware ajoute un réplica secondaire dans la zone 2 de West Europe et un réplica secondaire dans North Europe.

    La conception doit respecter les exigences suivantes :

    - Une panne de zone ne doit faire perdre aucune transaction validée, et le basculement dans West Europe doit être automatique.
    - La latence vers North Europe ne doit pas retarder les validations sur le principal.

    Comment devez-vous configurer les modes de disponibilité des réplicas secondaires ?
body:
  options:
    - id: a
      text: { en: "Zone 2: asynchronous commit. North Europe: synchronous commit.", fr: "Zone 2 : validation asynchrone. North Europe : validation synchrone." }
    - id: b
      text: { en: "Zone 2: synchronous commit. North Europe: synchronous commit.", fr: "Zone 2 : validation synchrone. North Europe : validation synchrone." }
    - id: c
      text: { en: "Zone 2: synchronous commit. North Europe: asynchronous commit.", fr: "Zone 2 : validation synchrone. North Europe : validation asynchrone." }
    - id: d
      text: { en: "Zone 2: asynchronous commit. North Europe: asynchronous commit.", fr: "Zone 2 : validation asynchrone. North Europe : validation asynchrone." }
answer: { optionId: c }
explanation:
  correct:
    en: A synchronous-commit replica in the other zone hardens each transaction before the commit completes and supports automatic failover, which gives zero data loss for a zone failure. The cross-region replica uses asynchronous commit so that its latency never slows down commits; this is the pattern Microsoft describes for SAP with SQL Server across zones and regions.
    fr: Un réplica en validation synchrone dans l'autre zone écrit chaque transaction avant la fin de la validation et prend en charge le basculement automatique, ce qui garantit l'absence de perte de données en cas de panne de zone. Le réplica interrégional utilise la validation asynchrone pour que sa latence ne ralentisse jamais les validations ; c'est le modèle que Microsoft décrit pour SAP avec SQL Server entre zones et régions.
  options:
    a: { en: "This reverses the modes: the zonal replica could lose transactions and the remote replica would slow every commit.", fr: "Cette option inverse les modes : le réplica zonal pourrait perdre des transactions et le réplica distant ralentirait chaque validation." }
    b: { en: "A synchronous replica in North Europe adds cross-region latency to every commit.", fr: "Un réplica synchrone dans North Europe ajoute la latence interrégionale à chaque validation." }
    d: { en: "Asynchronous commit in zone 2 allows data loss and doesn't support automatic failover.", fr: "La validation asynchrone dans la zone 2 permet une perte de données et ne prend pas en charge le basculement automatique." }
references:
  - title: SQL Server Azure virtual machines DBMS deployment for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/dbms-guide-sqlserver
