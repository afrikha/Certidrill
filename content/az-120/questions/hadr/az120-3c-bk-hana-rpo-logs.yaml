id: az120-3c-bk-hana-rpo-logs
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs SAP S/4HANA on an Azure VM. The SAP HANA database is backed up to a Recovery Services vault by using Azure Backup for SAP HANA.

    The service-level agreement requires a recovery point objective (RPO) of 15 minutes for the database.

    What should you configure?
  fr: |
    Contoso exécute SAP S/4HANA sur une machine virtuelle Azure. La base de données SAP HANA est sauvegardée dans un coffre Recovery Services avec Sauvegarde Azure pour SAP HANA.

    Le contrat de niveau de service exige un objectif de point de récupération (RPO) de 15 minutes pour la base de données.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A differential backup every 15 minutes in the backup policy", fr: "Une sauvegarde différentielle toutes les 15 minutes dans la stratégie de sauvegarde" } }
    - { id: b, text: { en: "A log backup every 15 minutes in the backup policy", fr: "Une sauvegarde de journaux toutes les 15 minutes dans la stratégie de sauvegarde" } }
    - { id: c, text: { en: "A HANA instance snapshot every 15 minutes in a snapshot policy", fr: "Un instantané d'instance HANA toutes les 15 minutes dans une stratégie d'instantané" } }
    - { id: d, text: { en: "An Azure VM backup every 4 hours in an Enhanced policy", fr: "Une sauvegarde de machine virtuelle Azure toutes les 4 heures dans une stratégie Enhanced" } }
answer: { optionId: b }
explanation:
  correct:
    en: The RPO of Azure Backup for SAP HANA is set by the log backup frequency, and the minimum frequency is 15 minutes. A point-in-time restore replays the log backups on top of the last full (and delta) backup, so at most 15 minutes of committed data can be lost.
    fr: |
      Le RPO de Sauvegarde Azure pour SAP HANA dépend de la fréquence des sauvegardes de journaux, dont le minimum est de 15 minutes. Une restauration à un point dans le temps rejoue les sauvegardes de journaux sur la dernière sauvegarde complète (et delta) : au plus 15 minutes de données validées peuvent être perdues.
  options:
    a: { en: "A HANA backup policy allows at most one differential backup per day.", fr: "Une stratégie de sauvegarde HANA autorise au plus une sauvegarde différentielle par jour." }
    c: { en: "HANA instance snapshots can only be scheduled daily; the RPO still comes from the log backups.", fr: "Les instantanés d'instance HANA ne peuvent être planifiés que quotidiennement ; le RPO dépend toujours des sauvegardes de journaux." }
    d: { en: "An Enhanced VM policy gives an RPO of 4 hours at best, and VM backup isn't a database-aware HANA backup.", fr: "Une stratégie de machine virtuelle Enhanced donne au mieux un RPO de 4 heures, et la sauvegarde de machine virtuelle n'est pas une sauvegarde HANA tenant compte de la base de données." }
references:
  - title: About SAP HANA database backup on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-about
  - title: SAP HANA Backup support matrix
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-backup-support-matrix
