id: az120-cs4b-ascs-cluster
objective: "3.1.4"
type: dropdown
caseStudy: az120-cs4b-treyresearch
difficulty: 2
status: draft
stem:
  en: |
    You need to design the ASCS/ERS cluster of PRD. The solution must meet the high availability requirements.

    What should you include in the design? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez concevoir le cluster ASCS/ERS de PRD. La solution doit respecter les exigences de haute disponibilité.

    Que devez-vous inclure dans la conception ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      SAP global host files: [[share]]

      Cluster quorum: [[quorum]]

      Load-balancing rule for the ASCS virtual IP address: [[rule]]
    fr: |
      Fichiers de l'hôte global SAP : [[share]]

      Quorum du cluster : [[quorum]]

      Règle d'équilibrage de charge pour l'adresse IP virtuelle de l'ASCS : [[rule]]
  slots:
    - id: share
      options:
        - { id: filesLrs, text: { en: "An SMB share in a premium Azure Files storage account with LRS", fr: "Un partage SMB dans un compte de stockage Azure Files premium avec LRS" } }
        - { id: filesZrs, text: { en: "An SMB share in a premium Azure Files storage account with ZRS", fr: "Un partage SMB dans un compte de stockage Azure Files premium avec ZRS" } }
        - { id: sofs, text: { en: "A scale-out file server cluster with Storage Spaces Direct stretched across zones 1 and 2", fr: "Un cluster de serveurs de fichiers avec montée en puissance parallèle avec espaces de stockage direct étendu aux zones 1 et 2" } }
        - { id: shared, text: { en: "An Azure shared disk with the Premium_LRS SKU attached to both cluster nodes", fr: "Un disque partagé Azure avec la référence SKU Premium_LRS attaché aux deux nœuds du cluster" } }
    - id: quorum
      options:
        - { id: cloud, text: { en: "A cloud witness in an Azure storage account", fr: "Un témoin cloud dans un compte de stockage Azure" } }
        - { id: fsw, text: { en: "A file share witness on a domain controller VM in zone 3", fr: "Un témoin de partage de fichiers sur une machine virtuelle contrôleur de domaine dans la zone 3" } }
        - { id: third, text: { en: "Node majority with a third cluster node in zone 3", fr: "Majorité de nœuds avec un troisième nœud de cluster dans la zone 3" } }
        - { id: none, text: { en: "Node majority without a witness", fr: "Majorité de nœuds sans témoin" } }
    - id: rule
      options:
        - { id: haFip30, text: { en: "HA ports, floating IP enabled, idle timeout 30 minutes", fr: "Ports HA, IP flottante activée, délai d'inactivité de 30 minutes" } }
        - { id: haNoFip, text: { en: "HA ports, floating IP disabled, idle timeout 30 minutes", fr: "Ports HA, IP flottante désactivée, délai d'inactivité de 30 minutes" } }
        - { id: haFip4, text: { en: "HA ports, floating IP enabled, idle timeout 4 minutes", fr: "Ports HA, IP flottante activée, délai d'inactivité de 4 minutes" } }
        - { id: port3200, text: { en: "TCP port 3200 only, floating IP disabled, idle timeout 30 minutes", fr: "Port TCP 3200 uniquement, IP flottante désactivée, délai d'inactivité de 30 minutes" } }
answer:
  values: { share: filesZrs, quorum: cloud, rule: haFip30 }
explanation:
  correct:
    en: Azure Files SMB shares can host sapmnt for a WSFC-clustered ASCS/SCS, and customers with a zonal deployment should choose a premium ZRS account so the share survives a zone failure without any file-server VM. Microsoft recommends a cloud witness, stored in an Azure storage account, as the quorum of a Windows Server 2016 or 2019 cluster, so no third VM is needed. The internal load balancer rule for ASCS/SCS uses HA ports with floating IP enabled and a 30-minute idle timeout, so long-lived enqueue connections are not dropped.
    fr: Les partages SMB Azure Files peuvent héberger sapmnt pour un ASCS/SCS en cluster WSFC, et les clients qui ont un déploiement zonal doivent choisir un compte premium ZRS pour que le partage résiste à la défaillance d'une zone sans machine virtuelle de serveur de fichiers. Microsoft recommande un témoin cloud, stocké dans un compte de stockage Azure, comme quorum d'un cluster Windows Server 2016 ou 2019 ; aucune troisième machine virtuelle n'est donc nécessaire. La règle de l'équilibreur de charge interne pour l'ASCS/SCS utilise les ports HA avec l'IP flottante activée et un délai d'inactivité de 30 minutes, pour que les connexions de longue durée vers l'enqueue ne soient pas coupées.
  options:
    filesLrs: { en: "LRS keeps all copies in one zone, so the share does not survive the zone failure.", fr: "LRS conserve toutes les copies dans une seule zone ; le partage ne résiste donc pas à la défaillance de la zone." }
    sofs: { en: "A scale-out file server needs file-server VMs, and a Storage Spaces Direct cluster cannot be stretched across availability zones.", fr: "Un serveur de fichiers avec montée en puissance parallèle nécessite des machines virtuelles de serveur de fichiers, et un cluster d'espaces de stockage direct ne peut pas être étendu à plusieurs zones de disponibilité." }
    shared: { en: "A shared disk is not a file service, and a zonal cluster would need Premium_ZRS rather than Premium_LRS.", fr: "Un disque partagé n'est pas un service de fichiers, et un cluster zonal nécessiterait Premium_ZRS plutôt que Premium_LRS." }
    fsw: { en: "A file share witness on a VM adds a third VM to the quorum design, which requirement 5 rules out.", fr: "Un témoin de partage de fichiers sur une machine virtuelle ajoute une troisième machine virtuelle à la conception du quorum, ce que l'exigence 5 exclut." }
    third: { en: "A third cluster node is a third VM, which requirement 5 rules out.", fr: "Un troisième nœud de cluster est une troisième machine virtuelle, ce que l'exigence 5 exclut." }
    none: { en: "A two-node cluster without a witness loses quorum when one node or zone fails.", fr: "Un cluster à deux nœuds sans témoin perd le quorum quand un nœud ou une zone tombe en panne." }
    haNoFip: { en: "The ASCS/SCS load-balancing rule requires floating IP to be enabled.", fr: "La règle d'équilibrage de charge de l'ASCS/SCS exige que l'IP flottante soit activée." }
    haFip4: { en: "The default 4-minute idle timeout can drop idle enqueue connections; the Microsoft guidance for ASCS/SCS sets 30 minutes.", fr: "Le délai d'inactivité par défaut de 4 minutes peut couper les connexions inactives vers l'enqueue ; les recommandations de Microsoft pour l'ASCS/SCS fixent 30 minutes." }
    port3200: { en: "Port 3200 is a dispatcher port of a single instance; ASCS/SCS clusters use an HA ports rule with floating IP.", fr: "Le port 3200 est un port de répartiteur d'une seule instance ; les clusters ASCS/SCS utilisent une règle de ports HA avec l'IP flottante." }
references:
  - title: Install high-availability SAP NetWeaver with Azure Files SMB
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-windows-azure-files-smb
  - title: "Azure infrastructure for SAP ASCS/SCS with WSFC&shared disk"
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-high-availability-infrastructure-wsfc-shared-disk
