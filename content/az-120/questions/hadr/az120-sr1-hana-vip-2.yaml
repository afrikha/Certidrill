id: az120-sr1-hana-vip-2
objective: "3.1.3"
type: series_yesno
series: az120-sr1-hana-vip
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |-
    You deploy an internal Standard load balancer with HA ports and floating IP.
  fr: |-
    Vous déployez un équilibreur de charge Standard interne avec les Ports HA et l'IP flottante.
body:
  solution:
    en: |-
      You deploy an **internal Standard** load balancer with a frontend IP configuration in db-subnet and a backend pool that contains hana1 and hana2. You create a load-balancing rule with **HA ports**, **floating IP** enabled and an idle timeout of 30 minutes, and a TCP health probe on port **62503** with a probe threshold of 2, answered by an `azure-lb` cluster resource that runs with the primary. You keep `net.ipv4.tcp_timestamps` set to **0** on both VMs.
    fr: |-
      Vous déployez un équilibreur de charge **Standard interne** avec une configuration IP frontale dans db-subnet et un pool principal qui contient hana1 et hana2. Vous créez une règle d'équilibrage de charge avec les **Ports HA**, l'**IP flottante** activée et un délai d'inactivité de 30 minutes, ainsi qu'une sonde d'intégrité TCP sur le port **62503** avec un seuil de sonde de 2, à laquelle répond une ressource de cluster `azure-lb` qui s'exécute avec le primaire. Vous conservez `net.ipv4.tcp_timestamps` défini sur **0** sur les deux machines virtuelles.
answer: { value: true }
explanation:
  correct:
    en: |-
      This is the documented configuration: an internal Standard load balancer, an HA ports rule with floating IP and a 30-minute idle timeout, and a TCP probe on port 625 followed by the instance number. Only the node that runs the `azure-lb` resource answers the probe, so the frontend IP always points to the current primary; TCP timestamps stay disabled so that the probes work.
    fr: |-
      C'est la configuration documentée : un équilibreur de charge Standard interne, une règle Ports HA avec IP flottante et un délai d'inactivité de 30 minutes, et une sonde TCP sur le port 625 suivi du numéro d'instance. Seul le nœud qui exécute la ressource `azure-lb` répond à la sonde : l'IP frontale pointe donc toujours vers le primaire actuel ; les horodatages TCP restent désactivés pour que les sondes fonctionnent.
references:
  - title: High availability for SAP HANA on Azure VMs on SUSE Linux Enterprise Server
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability
