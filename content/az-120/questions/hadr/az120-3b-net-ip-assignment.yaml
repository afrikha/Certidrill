id: az120-3b-net-ip-assignment
objective: "3.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank protects two SAP VMs with Azure Site Recovery from West Europe to North Europe. Both source network interfaces use static private IP addresses, and the target IP settings of the replicated items weren't changed.

    | VM | Source subnet | Source IP address | Target subnet |
    | --- | --- | --- | --- |
    | ascs01 | 10.1.2.0/24 | 10.1.2.10 | 10.1.2.0/24 (10.1.2.10 is free) |
    | app01 | 10.1.3.0/24 | 10.1.3.20 | 10.21.3.0/24 |

    How will the IP addresses be assigned after a failover? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank protège deux machines virtuelles SAP avec Azure Site Recovery de West Europe vers North Europe. Les deux interfaces réseau sources utilisent des adresses IP privées statiques, et les paramètres IP cibles des éléments répliqués n'ont pas été modifiés.

    | Machine virtuelle | Sous-réseau source | Adresse IP source | Sous-réseau cible |
    | --- | --- | --- | --- |
    | ascs01 | 10.1.2.0/24 | 10.1.2.10 | 10.1.2.0/24 (10.1.2.10 est libre) |
    | app01 | 10.1.3.0/24 | 10.1.3.20 | 10.21.3.0/24 |

    Comment les adresses IP seront-elles attribuées après un basculement ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      IP address of ascs01: [[ip1]]

      IP address of app01: [[ip2]]

      Allocation method of the app01 IP address: [[alloc]]
    fr: |
      Adresse IP de ascs01 : [[ip1]]

      Adresse IP de app01 : [[ip2]]

      Méthode d'allocation de l'adresse IP de app01 : [[alloc]]
  slots:
    - id: ip1
      options:
        - { id: same, text: "10.1.2.10" }
        - { id: next, text: { en: "The next available IP address in 10.1.2.0/24", fr: "La prochaine adresse IP disponible dans 10.1.2.0/24" } }
        - { id: dhcp, text: { en: "An address assigned by DHCP", fr: "Une adresse attribuée par DHCP" } }
    - id: ip2
      options:
        - { id: src, text: "10.1.3.20" }
        - { id: offset, text: "10.21.3.20" }
        - { id: avail, text: { en: "The next available IP address in 10.21.3.0/24", fr: "La prochaine adresse IP disponible dans 10.21.3.0/24" } }
    - id: alloc
      options:
        - { id: static, text: { en: "Static", fr: "Statique" } }
        - { id: dynamic, text: { en: "Dynamic", fr: "Dynamique" } }
answer:
  values: { ip1: same, ip2: avail, alloc: static }
explanation:
  correct:
    en: |
      When the source and target subnets have the same address space, the target VM gets the source IP address if it's available, otherwise the next available address. When the address spaces differ, the target VM gets the next available IP address of the target subnet. A source NIC with a static IP address gets a static IP address on the target.
    fr: |
      Lorsque les sous-réseaux source et cible ont le même espace d'adressage, la machine virtuelle cible reçoit l'adresse IP source si elle est disponible, sinon la prochaine adresse disponible. Lorsque les espaces d'adressage diffèrent, la machine virtuelle cible reçoit la prochaine adresse IP disponible du sous-réseau cible. Une carte réseau source avec une adresse IP statique reçoit une adresse IP statique sur la cible.
  options:
    next: { en: "The next available address is used only when the source address is already taken.", fr: "La prochaine adresse disponible n'est utilisée que si l'adresse source est déjà prise." }
    dhcp: { en: "A static source NIC keeps a static configuration on the target.", fr: "Une carte réseau source statique conserve une configuration statique sur la cible." }
    src: { en: "10.1.3.20 isn't in the target subnet 10.21.3.0/24.", fr: "10.1.3.20 ne fait pas partie du sous-réseau cible 10.21.3.0/24." }
    offset: { en: "Site Recovery doesn't translate the host part of the address; it takes the next available IP.", fr: "Site Recovery ne transpose pas la partie hôte de l'adresse ; il prend la prochaine adresse IP disponible." }
    dynamic: { en: "The target NIC uses the same allocation method as the source NIC.", fr: "La carte réseau cible utilise la même méthode d'allocation que la carte réseau source." }
references:
  - title: Set up network mapping and IP addressing for VNets
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-network-mapping
