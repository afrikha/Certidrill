id: az120-3a-lb-read-enabled
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware runs SAP HANA instance number 03 in a two-node Pacemaker cluster on SLES with HANA System Replication. A Standard internal load balancer has a frontend IP address for the primary, a TCP health probe on port 62503 and an HA ports rule with floating IP enabled.

    Proseware wants reporting tools to run read-only queries on the secondary database through a second virtual IP address that always follows the secondary node. The secondary is registered with the operation mode **logreplay_readaccess**. The cluster resources for the second virtual IP address will be configured separately.

    What should you add to the load balancer?
  fr: |
    Proseware exécute l'instance SAP HANA numéro 03 dans un cluster Pacemaker à deux nœuds sur SLES avec la réplication du système SAP HANA. Un équilibreur de charge interne Standard possède une adresse IP frontale pour le principal, une sonde d'intégrité TCP sur le port 62503 et une règle de ports haute disponibilité avec l'IP flottante activée.

    Proseware veut que des outils de reporting exécutent des requêtes en lecture seule sur la base de données secondaire via une deuxième adresse IP virtuelle qui suit toujours le nœud secondaire. Le secondaire est enregistré avec le mode d'opération **logreplay_readaccess**. Les ressources de cluster de la deuxième adresse IP virtuelle seront configurées séparément.

    Que devez-vous ajouter à l'équilibreur de charge ?
body:
  options:
    - id: a
      text: { en: "A second frontend IP address, a TCP health probe on port 62603, and an HA ports rule with floating IP enabled", fr: "Une deuxième adresse IP frontale, une sonde d'intégrité TCP sur le port 62603 et une règle de ports haute disponibilité avec l'IP flottante activée" }
    - id: b
      text: { en: "A second frontend IP address, a TCP health probe on port 62503, and an HA ports rule with floating IP enabled", fr: "Une deuxième adresse IP frontale, une sonde d'intégrité TCP sur le port 62503 et une règle de ports haute disponibilité avec l'IP flottante activée" }
    - id: c
      text: { en: "A second backend pool that contains only the secondary VM, and an HA ports rule that uses the probe on port 62503", fr: "Un deuxième pool principal qui ne contient que la machine virtuelle secondaire, et une règle de ports haute disponibilité qui utilise la sonde du port 62503" }
    - id: d
      text: { en: "A second frontend IP address, a TCP health probe on port 62603, and an HA ports rule with floating IP disabled", fr: "Une deuxième adresse IP frontale, une sonde d'intégrité TCP sur le port 62603 et une règle de ports haute disponibilité avec l'IP flottante désactivée" }
answer: { optionId: a }
explanation:
  correct:
    en: The read-enabled secondary needs its own frontend IP address and its own probe on 626<instance number>, here 62603, answered by an azure-lb resource that the cluster colocates with the Unpromoted (secondary) role. The rule is configured like the primary one, with HA ports and floating IP enabled.
    fr: Le secondaire activé en lecture a besoin de sa propre adresse IP frontale et de sa propre sonde sur 626<numéro d'instance>, ici 62603, à laquelle répond une ressource azure-lb que le cluster colocalise avec le rôle Unpromoted (secondaire). La règle est configurée comme celle du principal, avec les ports haute disponibilité et l'IP flottante activée.
  options:
    b: { en: "Port 62503 is answered on the primary node, so the second IP would follow the primary instead of the secondary.", fr: "Le port 62503 reçoit une réponse sur le nœud principal ; la deuxième adresse IP suivrait donc le principal au lieu du secondaire." }
    c: { en: "Pinning a backend pool to one VM breaks after a takeover, and the probe on 62503 tracks the primary.", fr: "Limiter un pool principal à une seule machine virtuelle ne fonctionne plus après une prise de contrôle, et la sonde du port 62503 suit le principal." }
    d: { en: "Floating IP must be enabled so that the packets reach the cluster-managed virtual IP on the secondary node.", fr: "L'IP flottante doit être activée pour que les paquets atteignent l'adresse IP virtuelle gérée par le cluster sur le nœud secondaire." }
references:
  - title: High availability for SAP HANA on Azure VMs on SLES
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability
