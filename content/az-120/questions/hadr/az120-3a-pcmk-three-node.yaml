id: az120-3a-pcmk-three-node
objective: "3.1.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware runs the ASCS and ERS instances of an SAP S/4HANA system (ENSA2) in a two-node Pacemaker cluster on SLES. The cluster has two fencing resources, **stonith-sbd** and **rsc_st_azure**, configured as in Microsoft's guide for two-node clusters. Proseware adds a third node as a spare for ASCS or ERS failover.

    Which two changes should you make to the fencing resources? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute les instances ASCS et ERS d'un système SAP S/4HANA (ENSA2) dans un cluster Pacemaker à deux nœuds sur SLES. Le cluster possède deux ressources d'isolation, **stonith-sbd** et **rsc_st_azure**, configurées selon le guide de Microsoft pour les clusters à deux nœuds. Proseware ajoute un troisième nœud de secours pour le basculement de l'ASCS ou de l'ERS.

    Quelles sont les deux modifications que vous devez apporter aux ressources d'isolation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Delete the pcmk_delay_max parameter.", fr: "Supprimer le paramètre pcmk_delay_max." } }
    - { id: b, text: { en: "Set the pcmk_action_limit parameter to -1.", fr: "Définir le paramètre pcmk_action_limit sur -1." } }
    - { id: c, text: { en: "Set the priority-fencing-delay cluster property to 30.", fr: "Définir la propriété de cluster priority-fencing-delay sur 30." } }
    - { id: d, text: { en: "Set the pcmk_monitor_retries parameter to 0.", fr: "Définir le paramètre pcmk_monitor_retries sur 0." } }
    - { id: e, text: { en: "Increase the power_timeout parameter to 900.", fr: "Augmenter le paramètre power_timeout à 900." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: For clusters with more than two nodes, Microsoft's SLES guide deletes pcmk_delay_max from both fencing resources, because the random delay only resolves fence races between two nodes, and sets pcmk_action_limit to -1 so that fencing actions aren't limited. Quorum already prevents a minority partition from fencing in a three-node cluster.
    fr: Pour les clusters de plus de deux nœuds, le guide SLES de Microsoft supprime pcmk_delay_max des deux ressources d'isolation, car le délai aléatoire ne règle que les courses à l'isolation entre deux nœuds, et définit pcmk_action_limit sur -1 pour ne pas limiter les actions d'isolation. Dans un cluster à trois nœuds, le quorum empêche déjà une partition minoritaire d'isoler les autres nœuds.
  options:
    c: { en: "priority-fencing-delay is meant for two-node clusters and must not be used in a three-node cluster.", fr: "priority-fencing-delay est destiné aux clusters à deux nœuds et ne doit pas être utilisé dans un cluster à trois nœuds." }
    d: { en: "pcmk_monitor_retries (4 in the guide) isn't related to the number of nodes; removing retries makes monitor failures more likely.", fr: "pcmk_monitor_retries (4 dans le guide) n'a pas de lien avec le nombre de nœuds ; supprimer les nouvelles tentatives rend les échecs de surveillance plus probables." }
    e: { en: "power_timeout stays at 240 seconds in the guide; the node count doesn't change it.", fr: "power_timeout reste à 240 secondes dans le guide ; le nombre de nœuds ne le modifie pas." }
references:
  - title: Set up Pacemaker on SUSE Linux Enterprise Server (SLES) in Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-pacemaker
  - title: Azure VMs high availability for SAP NetWeaver on SLES
