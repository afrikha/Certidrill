id: az120-cs2a-dr-methods
objective: "3.2.1"
type: dragdrop
caseStudy: az120-cs2a-proseware
difficulty: 1
status: draft
stem:
  en: |
    You need to design the replication of HP1 to North Europe. The solution must meet the disaster recovery requirements.

    Which replication method should you use for each component? To answer, drag the appropriate methods to the correct components. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez concevoir la réplication de HP1 vers North Europe. La solution doit respecter les exigences de reprise d'activité.

    Quelle méthode de réplication devez-vous utiliser pour chaque composant ? Pour répondre, faites glisser les méthodes appropriées vers les composants correspondants. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: hsr, text: { en: "Asynchronous HANA System Replication", fr: "Réplication système HANA asynchrone" } }
    - { id: asr, text: Azure Site Recovery }
    - { id: crr, text: { en: "Azure NetApp Files cross-region replication", fr: "Réplication entre régions d'Azure NetApp Files" } }
    - { id: crr2, text: { en: "Azure Backup with Cross Region Restore", fr: "Sauvegarde Azure avec restauration interrégion" } }
    - { id: rsync, text: { en: "A scheduled rsync script", fr: "Un script rsync planifié" } }
  targets:
    - { id: db, text: { en: "SAP HANA database", fr: "Base de données SAP HANA" } }
    - { id: app, text: { en: "Application server VMs", fr: "Machines virtuelles des serveurs d'applications" } }
    - { id: nfs, text: { en: "/sapmnt and /usr/sap/trans volumes", fr: "Volumes /sapmnt et /usr/sap/trans" } }
answer:
  mapping: { db: hsr, app: asr, nfs: crr }
explanation:
  correct:
    en: Microsoft recommends native database replication, such as HANA System Replication, for the DBMS layer because Azure Site Recovery does not guarantee database consistency and has data churn limits. The application server VMs are replicated with Azure Site Recovery. NFS volumes on Azure NetApp Files are replicated with ANF cross-region replication, which needs no custom script.
    fr: Microsoft recommande une réplication native de la base de données, comme la réplication système HANA, pour la couche SGBD, car Azure Site Recovery ne garantit pas la cohérence de la base et a des limites de taux de modification des données. Les machines virtuelles des serveurs d'applications sont répliquées avec Azure Site Recovery. Les volumes NFS Azure NetApp Files sont répliqués avec la réplication entre régions d'ANF, sans script personnalisé.
  options:
    crr2: { en: "Backups restored in another region give a much longer RPO and RTO than continuous replication and are not the recommended DR mechanism for these components.", fr: "Des sauvegardes restaurées dans une autre région donnent un RPO et un RTO bien plus longs qu'une réplication continue et ne sont pas le mécanisme de reprise recommandé pour ces composants." }
    rsync: { en: "rsync is suggested for NFS on Azure Files; for Azure NetApp Files, cross-region replication avoids maintaining a script.", fr: "rsync est suggéré pour NFS sur Azure Files ; pour Azure NetApp Files, la réplication entre régions évite de maintenir un script." }
references:
  - title: Disaster recovery overview and infrastructure guidelines for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-overview-guide
