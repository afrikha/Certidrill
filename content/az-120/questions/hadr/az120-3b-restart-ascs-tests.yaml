id: az120-3b-restart-ascs-tests
objective: "3.1.9"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs the ASCS and ERS instances of an SAP system named **NW1** (ENSA2) in a two-node Pacemaker cluster on SLES. The cluster is configured as in Microsoft's guide, with `op monitor interval=11 timeout=60 on-fail=restart` on the SAPInstance resources. Contoso runs failure tests before go-live.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute les instances ASCS et ERS d'un système SAP nommé **NW1** (ENSA2) dans un cluster Pacemaker à deux nœuds sur SLES. Le cluster est configuré comme dans le guide de Microsoft, avec `op monitor interval=11 timeout=60 on-fail=restart` sur les ressources SAPInstance. Contoso effectue des tests de panne avant la mise en production.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When the message server process of the ASCS instance is killed once, sapstart restarts it on the same node.
        fr: Lorsque le processus du serveur de messages de l'instance ASCS est arrêté de force une fois, sapstart le redémarre sur le même nœud.
    - id: s2
      text:
        en: When the ASCS instance is restarted with sapcontrol StopWait and StartWait, the enqueue locks are lost.
        fr: Lorsque l'instance ASCS est redémarrée avec sapcontrol StopWait et StartWait, les verrous de mise en file d'attente sont perdus.
    - id: s3
      text:
        en: When the enqueue replication server process is killed repeatedly, the ERS resource can remain stopped until you run crm resource cleanup.
        fr: Lorsque le processus du serveur de réplication de mise en file d'attente est arrêté de force à plusieurs reprises, la ressource ERS peut rester arrêtée jusqu'à ce que vous exécutiez crm resource cleanup.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      In Microsoft's test plan, a single kill of the message server is handled locally: sapstart restarts the process. With ENSA2, a manual restart of the ASCS instance keeps the enqueue locks, because the replicated lock table is retained; locks are lost only with ENSA1. If the ERS process is killed often enough, the resource stays stopped until you clean it up with crm resource cleanup.
    fr: |
      Dans le plan de test de Microsoft, un seul arrêt forcé du serveur de messages est traité localement : sapstart redémarre le processus. Avec ENSA2, un redémarrage manuel de l'instance ASCS conserve les verrous de mise en file d'attente, car la table de verrous répliquée est préservée ; les verrous ne sont perdus qu'avec ENSA1. Si le processus ERS est arrêté de force suffisamment souvent, la ressource reste arrêtée jusqu'à son nettoyage avec crm resource cleanup.
references:
  - title: High availability for SAP NetWeaver on Azure VMs on SUSE Linux Enterprise Server for SAP applications
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse
