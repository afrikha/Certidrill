id: az120-3c-rst-other-region
objective: "3.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam protects an SAP HANA database in West Europe with Azure Backup streaming backups. The Recovery Services vault uses GRS with Cross Region Restore enabled. The paired region of West Europe is North Europe.

    For an audit, you must restore a copy of the database, as of last Sunday, on a HANA VM named **hdb-audit** in Sweden Central. hdb-audit isn't registered with any vault.

    What should you do?
  fr: |
    Fabrikam protège une base de données SAP HANA en West Europe avec des sauvegardes en streaming de Sauvegarde Azure. Le coffre Recovery Services utilise GRS avec la restauration interrégion activée. La région jumelée de West Europe est North Europe.

    Pour un audit, vous devez restaurer une copie de la base de données, dans son état de dimanche dernier, sur une machine virtuelle HANA nommée **hdb-audit** en Sweden Central. hdb-audit n'est inscrite auprès d'aucun coffre.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Register hdb-audit with the vault, then run an alternate location restore to hdb-audit", fr: "Inscrire hdb-audit auprès du coffre, puis lancer une restauration vers un autre emplacement sur hdb-audit" } }
    - { id: b, text: { en: "Run a Cross Region Restore and select hdb-audit as the target", fr: "Lancer une restauration interrégion et sélectionner hdb-audit comme cible" } }
    - { id: c, text: { en: "Restore as files to an NFS path on a registered VM in West Europe, copy the files to hdb-audit and recover the database there", fr: "Restaurer en tant que fichiers vers un chemin NFS d'une machine virtuelle inscrite en West Europe, copier les fichiers sur hdb-audit et y récupérer la base de données" } }
    - { id: d, text: { en: "Restore as files to an SMB Azure file share and mount the share on hdb-audit", fr: "Restaurer en tant que fichiers vers un partage de fichiers Azure SMB et monter le partage sur hdb-audit" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Restore as files dumps the backup files and their metadata to a destination path so that you can recover them on any HANA machine, including in another subscription or region. You then generate the catalog with hdbbackupdiag and run RECOVER DATABASE on hdb-audit.
    fr: |
      La restauration en tant que fichiers dépose les fichiers de sauvegarde et leurs métadonnées dans un chemin de destination pour que vous puissiez les récupérer sur n'importe quelle machine HANA, y compris dans un autre abonnement ou une autre région. Vous générez ensuite le catalogue avec hdbbackupdiag et lancez RECOVER DATABASE sur hdb-audit.
  options:
    a: { en: "The target of an alternate location restore must be in the same region as the backup and registered with the same vault.", fr: "La cible d'une restauration vers un autre emplacement doit se trouver dans la même région que la sauvegarde et être inscrite auprès du même coffre." }
    b: { en: "Cross Region Restore targets only the paired region (North Europe), with a server registered to a vault there.", fr: "La restauration interrégion ne cible que la région jumelée (North Europe), avec un serveur inscrit auprès d'un coffre de cette région." }
    d: { en: "Restore as files doesn't work on CIFS/SMB shares; it requires a local or NFS path.", fr: "La restauration en tant que fichiers ne fonctionne pas sur les partages CIFS/SMB ; elle exige un chemin local ou NFS." }
references:
  - title: Restore SAP HANA databases on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-db-restore
