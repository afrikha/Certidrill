id: az120-3a-sla-single-vm-disks
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs a non-production SAP S/4HANA system on a single Azure VM named **VM-QAS**. The OS disk is a Premium SSD managed disk. The HANA data and log volumes use Premium SSD managed disks, and the **/hana/shared** and **/usr/sap** volumes use Standard SSD managed disks.

    Fabrikam wants VM-QAS to qualify for the single-instance VM SLA of 99.9%. The solution must not add VMs.

    What should you do?
  fr: |
    Fabrikam exécute un système SAP S/4HANA hors production sur une seule machine virtuelle Azure nommée **VM-QAS**. Le disque du système d'exploitation est un disque managé SSD Premium. Les volumes de données et de journaux HANA utilisent des disques managés SSD Premium, et les volumes **/hana/shared** et **/usr/sap** utilisent des disques managés SSD Standard.

    Fabrikam veut que VM-QAS soit couverte par le SLA de 99,9 % des machines virtuelles à instance unique. La solution ne doit pas ajouter de machines virtuelles.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Enable Write Accelerator on the HANA log disks.", fr: "Activer l'Accélérateur d'écriture sur les disques de journaux HANA." }
    - id: b
      text: { en: "Change the Standard SSD disks to Premium SSD.", fr: "Remplacer les disques SSD Standard par des disques SSD Premium." }
    - id: c
      text: { en: "Deploy VM-QAS into a proximity placement group.", fr: "Déployer VM-QAS dans un groupe de placement de proximité." }
    - id: d
      text: { en: "Add VM-QAS to a new availability set.", fr: "Ajouter VM-QAS à un nouveau groupe à haute disponibilité." }
answer: { optionId: b }
explanation:
  correct:
    en: The 99.9% SLA for a single VM applies only when the OS disk and all data disks are Premium SSD. The two Standard SSD data disks disqualify VM-QAS, so converting them to Premium SSD is enough.
    fr: Le SLA de 99,9 % d'une machine virtuelle unique ne s'applique que si le disque du système d'exploitation et tous les disques de données sont des SSD Premium. Les deux disques de données SSD Standard excluent VM-QAS de ce SLA ; il suffit donc de les convertir en SSD Premium.
  options:
    a:
      en: Write Accelerator improves the write latency of the log volume on M-series VMs; it has no effect on SLA eligibility.
      fr: L'Accélérateur d'écriture améliore la latence d'écriture du volume de journaux sur les machines virtuelles de série M ; il n'a aucun effet sur l'éligibilité au SLA.
    c:
      en: A proximity placement group reduces network latency between VMs; it does not change the SLA of a single VM.
      fr: Un groupe de placement de proximité réduit la latence réseau entre machines virtuelles ; il ne change pas le SLA d'une machine virtuelle unique.
    d:
      en: The availability set SLA requires two or more VMs in the set, which the solution must not add. An existing VM also cannot be added to an availability set without being re-created.
      fr: Le SLA des groupes à haute disponibilité exige au moins deux machines virtuelles dans le groupe, ce que la solution ne doit pas ajouter. De plus, une machine virtuelle existante ne peut pas être ajoutée à un groupe à haute disponibilité sans être recréée.
references:
