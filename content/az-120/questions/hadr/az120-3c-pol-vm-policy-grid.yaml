id: az120-3c-pol-vm-policy-grid
objective: "3.2.5"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Recovery Services vault that contains the VM backup policies shown in the following table.

    You need to assign a policy to each VM of an SAP system:

    - **app01**, an application server with Premium SSD v2 data disks, needs an RPO of 6 hours or less.
    - **wd01**, a Web Dispatcher with Premium SSD disks, needs one backup a day, at least 2 days of instant restore, and the lowest snapshot storage cost.

    Which policy should you assign to each VM? To answer, select the appropriate policy in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un coffre Recovery Services qui contient les stratégies de sauvegarde de machines virtuelles présentées dans le tableau suivant.

    Vous devez attribuer une stratégie à chaque machine virtuelle d'un système SAP :

    - **app01**, un serveur d'applications avec des disques de données SSD Premium v2, a besoin d'un RPO de 6 heures ou moins.
    - **wd01**, un Web Dispatcher avec des disques SSD Premium, a besoin d'une sauvegarde par jour, d'au moins 2 jours de restauration instantanée et du coût de stockage des instantanés le plus faible.

    Quelle stratégie devez-vous attribuer à chaque machine virtuelle ? Pour répondre, sélectionnez la stratégie appropriée dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - { id: p1, text: app01 }
    - { id: p2, text: wd01 }
  grid:
    header: [{ en: "Policy", fr: "Stratégie" }, { en: "Subtype", fr: "Sous-type" }, { en: "Schedule", fr: "Planification" }, { en: "Instant restore retention", fr: "Rétention de la restauration instantanée" }]
    rows:
      - [{ text: Pol-A, area: pola }, { text: Standard }, { text: { en: "Daily, 22:00", fr: "Quotidienne, 22:00" } }, { text: { en: "2 days", fr: "2 jours" } }]
      - [{ text: Pol-B, area: polb }, { text: Standard }, { text: { en: "Weekly, Sunday", fr: "Hebdomadaire, dimanche" } }, { text: { en: "5 days", fr: "5 jours" } }]
      - [{ text: Pol-C, area: polc }, { text: Enhanced }, { text: { en: "Every 4 hours", fr: "Toutes les 4 heures" } }, { text: { en: "7 days", fr: "7 jours" } }]
      - [{ text: Pol-D, area: pold }, { text: Enhanced }, { text: { en: "Every 12 hours", fr: "Toutes les 12 heures" } }, { text: { en: "20 days", fr: "20 jours" } }]
      - [{ text: Pol-E, area: pole }, { text: Enhanced }, { text: { en: "Daily, 22:00", fr: "Quotidienne, 22:00" } }, { text: { en: "30 days", fr: "30 jours" } }]
answer:
  values: { p1: polc, p2: pola }
explanation:
  correct:
    en: |
      Premium SSD v2 disks require an Enhanced policy, and only Pol-C (every 4 hours) meets an RPO of 6 hours; Pol-D runs every 12 hours. For wd01, the Standard policy supports Premium SSD and its instant restore snapshots are incremental, while Enhanced snapshots start with a full copy and cost more; Pol-A runs daily with 2 days of instant restore, whereas Pol-B runs only weekly.
    fr: |
      Les disques SSD Premium v2 exigent une stratégie Enhanced, et seule Pol-C (toutes les 4 heures) respecte un RPO de 6 heures ; Pol-D s'exécute toutes les 12 heures. Pour wd01, la stratégie Standard prend en charge le SSD Premium et ses instantanés de restauration instantanée sont incrémentiels, alors que les instantanés Enhanced commencent par une copie complète et coûtent plus cher ; Pol-A s'exécute chaque jour avec 2 jours de restauration instantanée, alors que Pol-B n'est qu'hebdomadaire.
references:
  - title: Back up Azure VMs with the Enhanced policy
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy
  - title: Azure Instant Restore Capability
    url: https://learn.microsoft.com/en-us/azure/backup/backup-instant-restore-capability
