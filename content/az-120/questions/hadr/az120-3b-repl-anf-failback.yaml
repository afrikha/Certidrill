id: az120-3b-repl-anf-failback
objective: "3.1.8"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys replicates the /usr/sap/trans volume of Azure NetApp Files from availability zone 1 (source volume) to availability zone 2 (destination volume) by using cross-zone replication. During a zone 1 outage, Tailspin broke the replication peering and used the destination volume. Zone 1 is available again, and the source volume still exists.

    You need to fail back to the source volume and resume the replication from zone 1 to zone 2.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys réplique le volume /usr/sap/trans d'Azure NetApp Files de la zone de disponibilité 1 (volume source) vers la zone de disponibilité 2 (volume de destination) avec la réplication entre zones. Pendant une panne de la zone 1, Tailspin a interrompu le peering de réplication et utilisé le volume de destination. La zone 1 est de nouveau disponible, et le volume source existe toujours.

    Vous devez revenir au volume source et reprendre la réplication de la zone 1 vers la zone 2.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: rr_src, text: { en: "On the source volume, run Reverse Resync and wait for the Mirrored and Idle states.", fr: "Sur le volume source, exécuter Reverse Resync et attendre les états Mirrored et Idle." } }
    - { id: break_dst, text: { en: "On the destination volume, run Break Peering.", fr: "Sur le volume de destination, exécuter Break Peering." } }
    - { id: rr_dst, text: { en: "On the destination volume, run Reverse Resync.", fr: "Sur le volume de destination, exécuter Reverse Resync." } }
    - { id: mount, text: { en: "Remount the source volume on the SAP VMs.", fr: "Remonter le volume source sur les machines virtuelles SAP." } }
    - { id: authorize, text: { en: "On the source volume, authorize the replication with the resource ID of the destination volume.", fr: "Sur le volume source, autoriser la réplication avec l'ID de ressource du volume de destination." } }
    - { id: schedule, text: { en: "On the destination volume, change the replication schedule to every 10 minutes.", fr: "Sur le volume de destination, définir la planification de réplication sur toutes les 10 minutes." } }
answer:
  sequence: [ rr_src, break_dst, rr_dst, mount ]
explanation:
  correct:
    en: |
      A Reverse Resync on the source volume replicates the changes made on the destination back to the source, from the last common snapshot (newer data on the source is overwritten). Once it shows Mirrored and Idle, you break the peering on the destination volume, run Reverse Resync on the destination to re-establish replication in the original direction, and remount the source volume for the clients.
    fr: |
      Un Reverse Resync sur le volume source réplique vers la source les modifications faites sur la destination, à partir du dernier instantané commun (les données plus récentes de la source sont écrasées). Une fois les états Mirrored et Idle atteints, vous interrompez le peering sur le volume de destination, vous exécutez Reverse Resync sur la destination pour rétablir la réplication dans le sens d'origine, puis vous remontez le volume source pour les clients.
  options:
    authorize: { en: "Authorization is part of the initial replication setup; the existing relationship is reused.", fr: "L'autorisation fait partie de la configuration initiale de la réplication ; la relation existante est réutilisée." }
    schedule: { en: "Changing the schedule doesn't move the data back or change the replication direction.", fr: "Modifier la planification ne rapatrie pas les données et ne change pas le sens de la réplication." }
references:
  - title: Manage disaster recovery using Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/cross-region-replication-manage-disaster-recovery
