id: az120-3a-lb-ascs-ers-hotarea
objective: "3.1.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam deploys a Pacemaker cluster on two VMs named **nw1-cl-0** and **nw1-cl-1** for the ASCS instance (instance number 00) and the ERS instance (instance number 01) of an SAP system named **NW1**. The ASCS and ERS instances can run on either node. The Standard internal load balancer is configured as shown in the following table.

    Answer each prompt by selecting the value in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam déploie un cluster Pacemaker sur deux machines virtuelles nommées **nw1-cl-0** et **nw1-cl-1** pour l'instance ASCS (numéro d'instance 00) et l'instance ERS (numéro d'instance 01) d'un système SAP nommé **NW1**. Les instances ASCS et ERS peuvent s'exécuter sur l'un ou l'autre nœud. L'équilibreur de charge interne Standard est configuré comme indiqué dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la valeur dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The value that prevents clients from reaching ASCS after it fails over to nw1-cl-1", fr: "La valeur qui empêche les clients d'atteindre l'ASCS après son basculement vers nw1-cl-1" }
    - id: p2
      text: { en: "The value that prevents the ERS virtual IP address configured by the cluster from receiving traffic", fr: "La valeur qui empêche l'adresse IP virtuelle ERS configurée par le cluster de recevoir du trafic" }
  grid:
    header: [{ en: Object, fr: Objet }, { en: Name, fr: Nom }, { en: Value, fr: Valeur }]
    rows:
      - [{ text: { en: "Frontend IP configuration", fr: "Configuration IP frontale" } }, { text: fe-ascs }, { text: { en: "10.0.0.7 (static)", fr: "10.0.0.7 (statique)" }, area: v1 }]
      - [{ text: { en: "Frontend IP configuration", fr: "Configuration IP frontale" } }, { text: fe-ers }, { text: { en: "10.0.0.8 (static)", fr: "10.0.0.8 (statique)" }, area: v2 }]
      - [{ text: { en: "Backend pool", fr: "Pool principal" } }, { text: be-nw1 }, { text: nw1-cl-0, area: v3 }]
      - [{ text: { en: "Health probe", fr: "Sonde d'intégrité" } }, { text: probe-ascs }, { text: "TCP 62000", area: v4 }]
      - [{ text: { en: "Health probe", fr: "Sonde d'intégrité" } }, { text: probe-ers }, { text: "TCP 62101", area: v5 }]
      - [{ text: { en: "Load-balancing rule", fr: "Règle d'équilibrage de charge" } }, { text: rule-ascs }, { text: { en: "HA ports, floating IP enabled, idle timeout 30 minutes", fr: "Ports haute disponibilité, IP flottante activée, délai d'inactivité 30 minutes" }, area: v6 }]
      - [{ text: { en: "Load-balancing rule", fr: "Règle d'équilibrage de charge" } }, { text: rule-ers }, { text: { en: "HA ports, floating IP disabled, idle timeout 30 minutes", fr: "Ports haute disponibilité, IP flottante désactivée, délai d'inactivité 30 minutes" }, area: v7 }]
answer:
  values: { p1: v3, p2: v7 }
explanation:
  correct:
    en: The backend pool must contain both cluster VMs; with only nw1-cl-0, the load balancer has no target after ASCS fails over to nw1-cl-1. Each rule of a Pacemaker-managed instance needs floating IP enabled, otherwise the load balancer rewrites the destination to the VM's own address and the ERS virtual IP never receives the traffic. The probe ports follow the 620<instance> and 621<instance> convention, and HA ports with a 30-minute idle timeout are the documented rule settings.
    fr: "Le pool principal doit contenir les deux machines virtuelles du cluster : avec nw1-cl-0 seule, l'équilibreur de charge n'a plus de cible après le basculement de l'ASCS vers nw1-cl-1. Chaque règle d'une instance gérée par Pacemaker doit avoir l'IP flottante activée ; sinon, l'équilibreur de charge remplace la destination par l'adresse de la machine virtuelle, et l'adresse IP virtuelle ERS ne reçoit jamais le trafic. Les ports de sonde suivent la convention 620<instance> et 621<instance>, et les ports haute disponibilité avec un délai d'inactivité de 30 minutes sont les paramètres de règle documentés."
references:
  - title: Azure VMs high availability for SAP NetWeaver on SLES
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse
