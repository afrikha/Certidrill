id: az120-3b-asr-windows-cluster
objective: "3.2.1"
type: dragdrop
difficulty: 3
status: draft
stem:
  en: |
    Proseware runs SAP NetWeaver on Windows in the West Europe region. The ASCS/SCS instance runs in a two-node Windows Server failover cluster that uses an Azure shared disk and a cloud witness for quorum. The VMs are joined to an Active Directory Domain Services (AD DS) domain whose domain controllers run on Azure VMs in West Europe.

    You need to design the disaster recovery of these components to North Europe by following Microsoft's guidance.

    What should you use for each component? To answer, drag the appropriate methods to the correct components. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute SAP NetWeaver sur Windows dans la région West Europe. L'instance ASCS/SCS s'exécute dans un cluster de basculement Windows Server à deux nœuds qui utilise un disque partagé Azure et un témoin cloud pour le quorum. Les machines virtuelles sont jointes à un domaine Active Directory Domain Services (AD DS) dont les contrôleurs de domaine s'exécutent sur des machines virtuelles Azure dans West Europe.

    Vous devez concevoir la reprise d'activité de ces composants vers North Europe en suivant les recommandations de Microsoft.

    Que devez-vous utiliser pour chaque composant ? Pour répondre, faites glisser les méthodes appropriées vers les composants correspondants. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: asrsd, text: { en: "Site Recovery replication of both nodes with their Azure shared disk", fr: "Réplication Site Recovery des deux nœuds avec leur disque partagé Azure" } }
    - { id: newcw, text: { en: "A new cloud witness deployed in North Europe", fr: "Un nouveau témoin cloud déployé dans North Europe" } }
    - { id: adrep, text: { en: "Active Directory replication to a domain controller running in North Europe", fr: "La réplication Active Directory vers un contrôleur de domaine exécuté dans North Europe" } }
    - { id: asrcw, text: { en: "Site Recovery replication of the cloud witness", fr: "La réplication Site Recovery du témoin cloud" } }
    - { id: crr, text: { en: "Azure Backup with Cross Region Restore", fr: "Sauvegarde Azure avec restauration interrégion" } }
  targets:
    - { id: t_ascs, text: { en: "ASCS/SCS cluster nodes", fr: "Nœuds du cluster ASCS/SCS" } }
    - { id: t_cw, text: { en: "Cluster quorum witness", fr: "Témoin de quorum du cluster" } }
    - { id: t_ad, text: { en: "AD DS domain controllers", fr: "Contrôleurs de domaine AD DS" } }
answer:
  mapping: { t_ascs: asrsd, t_cw: newcw, t_ad: adrep }
explanation:
  correct:
    en: |
      Microsoft lists Site Recovery with Azure shared disk as the DR method for shared-disk clusters; the same shared-disk set must be attached to every protected cluster node. Site Recovery doesn't replicate the cloud witness, so you deploy one in the DR region. Domain controllers are protected with Active Directory replication, and AD and DNS must work in the DR region before SAP is recovered.
    fr: |
      Microsoft indique Site Recovery avec disque partagé Azure comme méthode de reprise d'activité pour les clusters à disque partagé ; le même ensemble de disques partagés doit être attaché à chaque nœud de cluster protégé. Site Recovery ne réplique pas le témoin cloud : vous en déployez un dans la région de reprise. Les contrôleurs de domaine sont protégés par la réplication Active Directory, et AD et DNS doivent fonctionner dans la région de reprise avant la récupération de SAP.
  options:
    asrcw: { en: "Site Recovery doesn't replicate the cloud witness.", fr: "Site Recovery ne réplique pas le témoin cloud." }
    crr: { en: "Restoring backups gives a high RTO and isn't the recommended method for domain controllers or a running cluster.", fr: "La restauration de sauvegardes donne un RTO élevé et n'est pas la méthode recommandée pour des contrôleurs de domaine ou un cluster en cours d'exécution." }
references:
  - title: Set up disaster recovery for a multi-tier SAP NetWeaver app deployment
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-sap
  - title: Disaster recovery overview and infrastructure guidelines for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-overview-guide
