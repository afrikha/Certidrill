id: az120-3b-region-zone-vs-region
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank runs a production SAP S/4HANA system across availability zones 1 and 2 of the West Europe region, with synchronous HANA System Replication and Pacemaker clusters. A regulator requires that the disaster recovery site survive a geographically widespread disaster and be at least 500 km from the production site.

    What should you include in the disaster recovery design?
  fr: |
    Woodgrove Bank exécute un système SAP S/4HANA de production réparti entre les zones de disponibilité 1 et 2 de la région West Europe, avec HANA System Replication synchrone et des clusters Pacemaker. Un régulateur exige que le site de reprise d'activité survive à une catastrophe géographiquement étendue et se trouve à au moins 500 km du site de production.

    Que devez-vous inclure dans la conception de la reprise d'activité ?
body:
  options:
    - { id: a, text: { en: "Replicate the VMs to zone 3 of West Europe with zone-to-zone Site Recovery.", fr: "Répliquer les machines virtuelles vers la zone 3 de West Europe avec Site Recovery zone à zone." } }
    - { id: b, text: { en: "Add a third HANA node in zone 3 of West Europe with asynchronous replication.", fr: "Ajouter un troisième nœud HANA dans la zone 3 de West Europe avec une réplication asynchrone." } }
    - { id: c, text: { en: "Replicate the system to North Europe with Site Recovery and HANA System Replication.", fr: "Répliquer le système vers North Europe avec Site Recovery et HANA System Replication." } }
    - { id: d, text: { en: "Deploy a copy of the system in a separate availability set in West Europe.", fr: "Déployer une copie du système dans un groupe à haute disponibilité distinct de West Europe." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Zone-to-zone disaster recovery mimics a metro DR design, but it can fall short of requirements for a geographically widespread disaster, and all zones of a region are close to each other. A minimum distance and protection against a regional disaster require a second Azure region, here North Europe, with Site Recovery for the application layer and HANA System Replication for the database.
    fr: |
      La reprise d'activité de zone à zone reproduit une conception de reprise métropolitaine, mais elle peut ne pas satisfaire les exigences face à une catastrophe géographiquement étendue, et toutes les zones d'une région sont proches les unes des autres. Une distance minimale et une protection contre une catastrophe régionale exigent une deuxième région Azure, ici North Europe, avec Site Recovery pour la couche Application et HANA System Replication pour la base de données.
  options:
    a: { en: "Zone 3 is in the same region, so it doesn't meet the distance or regional disaster requirement.", fr: "La zone 3 est dans la même région : elle ne répond ni à l'exigence de distance ni à celle d'une catastrophe régionale." }
    b: { en: "A node in another zone of the same region doesn't survive a regional disaster.", fr: "Un nœud dans une autre zone de la même région ne survit pas à une catastrophe régionale." }
    d: { en: "An availability set protects against host and rack failures within one datacenter, not against a regional disaster.", fr: "Un groupe à haute disponibilité protège contre les pannes d'hôte et de rack dans un centre de données, pas contre une catastrophe régionale." }
references:
  - title: Disaster recovery overview and infrastructure guidelines for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-overview-guide
