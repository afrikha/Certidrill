id: az120-3a-sql-cloud-witness
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam runs the SQL Server database of an SAP system in an Always On availability group on a two-node Windows Server 2022 failover cluster. The nodes are in availability zones 1 and 2. Fabrikam will configure a cloud witness as the quorum witness.

    You need to create the storage account for the cloud witness.

    Which storage account configuration should you use?
  fr: |
    Fabrikam exécute la base de données SQL Server d'un système SAP dans un groupe de disponibilité Always On sur un cluster de basculement Windows Server 2022 à deux nœuds. Les nœuds se trouvent dans les zones de disponibilité 1 et 2. Fabrikam configurera un témoin cloud comme témoin de quorum.

    Vous devez créer le compte de stockage du témoin cloud.

    Quelle configuration de compte de stockage devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Standard general-purpose v2 with locally redundant storage (LRS)", fr: "Usage général v2 Standard avec stockage localement redondant (LRS)" }
    - id: b
      text: { en: "Premium block blobs with locally redundant storage (LRS)", fr: "Objets blob de blocs Premium avec stockage localement redondant (LRS)" }
    - id: c
      text: { en: "Standard legacy Blob storage account with locally redundant storage (LRS)", fr: "Compte de stockage Blob hérité Standard avec stockage localement redondant (LRS)" }
    - id: d
      text: { en: "Premium file shares with zone-redundant storage (ZRS)", fr: "Partages de fichiers Premium avec stockage redondant interzone (ZRS)" }
answer: { optionId: a }
explanation:
  correct:
    en: A cloud witness requires a general-purpose storage account with Standard performance, and the documented replication type is locally redundant storage. The witness only stores a small blob with a time stamp and is reached over HTTPS on port 443.
    fr: Un témoin cloud exige un compte de stockage à usage général avec des performances Standard, et le type de réplication documenté est le stockage localement redondant. Le témoin ne stocke qu'un petit objet blob contenant un horodatage et est joint en HTTPS sur le port 443.
  options:
    b: { en: "Azure Premium Storage isn't supported for a cloud witness.", fr: "Le stockage Premium Azure n'est pas pris en charge pour un témoin cloud." }
    c: { en: "Blob storage accounts aren't supported; the account kind must be general purpose.", fr: "Les comptes de stockage Blob ne sont pas pris en charge ; le type de compte doit être à usage général." }
    d: { en: "Premium file shares are neither general purpose nor Standard, so they can't host a cloud witness.", fr: "Les partages de fichiers Premium ne sont ni à usage général ni Standard ; ils ne peuvent donc pas héberger un témoin cloud." }
references:
  - title: Configure Cluster Quorum - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/hadr-cluster-quorum-configure-how-to
