id: az120-3b-restart-acss-stop
objective: "3.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an SAP S/4HANA system registered in Azure Center for SAP solutions as a Virtual Instance for SAP solutions (VIS). The ASCS/ERS instances run in a Pacemaker cluster on RHEL, and `sap_vendor_cluster_connector` is installed.

    Before a weekend maintenance window, an operator must stop the SAP application tier. The solution must meet the following requirements:

    - The operator must not sign in to any VM.
    - The central services instance must not fail over.
    - The VMs must keep running.

    What should the operator do?
  fr: |
    Northwind Traders dispose d'un système SAP S/4HANA inscrit dans le Centre Azure pour les solutions SAP en tant qu'instance virtuelle pour les solutions SAP (VIS). Les instances ASCS/ERS s'exécutent dans un cluster Pacemaker sur RHEL, et `sap_vendor_cluster_connector` est installé.

    Avant une fenêtre de maintenance du week-end, un opérateur doit arrêter la couche Application SAP. La solution doit répondre aux exigences suivantes :

    - L'opérateur ne doit se connecter à aucune machine virtuelle.
    - L'instance des services centraux ne doit pas basculer.
    - Les machines virtuelles doivent rester en cours d'exécution.

    Que doit faire l'opérateur ?
body:
  options:
    - { id: a, text: { en: "Stop the ASCS and ERS VMs from the Azure portal, and then stop the application server VMs.", fr: "Arrêter les machines virtuelles ASCS et ERS depuis le portail Azure, puis arrêter les machines virtuelles des serveurs d'applications." } }
    - { id: b, text: { en: "Run the Stop action on the VIS resource from the Azure portal, Azure CLI or Azure PowerShell.", fr: "Exécuter l'action Stop sur la ressource VIS depuis le portail Azure, Azure CLI ou Azure PowerShell." } }
    - { id: c, text: { en: "Run a Run Command on the ASCS node that puts the node in standby with crm node standby.", fr: "Exécuter une commande Run Command sur le nœud ASCS qui met le nœud en veille avec crm node standby." } }
    - { id: d, text: { en: "Set Autostart = 0 in the instance profiles, and restart the VMs from the Azure portal.", fr: "Définir Autostart = 0 dans les profils d'instance, et redémarrer les machines virtuelles depuis le portail Azure." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Stopping an SAP system from its VIS resource stops the SAP instances in the correct order and, for a highly available system, doesn't trigger a failover of the central services instance. The operation affects only the SAP application: the underlying VMs aren't stopped. It's available from the portal, Azure PowerShell, Azure CLI and the REST API.
    fr: |
      Arrêter un système SAP depuis sa ressource VIS arrête les instances SAP dans le bon ordre et, pour un système à haute disponibilité, ne déclenche pas de basculement de l'instance des services centraux. L'opération ne concerne que l'application SAP : les machines virtuelles sous-jacentes ne sont pas arrêtées. Elle est disponible depuis le portail, Azure PowerShell, Azure CLI et l'API REST.
  options:
    a: { en: "Stopping the VMs violates the requirement that the VMs keep running, and stopping a cluster node can move resources.", fr: "Arrêter les machines virtuelles enfreint l'exigence qu'elles restent en cours d'exécution, et arrêter un nœud de cluster peut déplacer des ressources." }
    c: { en: "Putting the node in standby moves the ASCS resources to the other node, which is a failover.", fr: "Mettre le nœud en veille déplace les ressources ASCS vers l'autre nœud, ce qui est un basculement." }
    d: { en: "Restarting the VMs doesn't keep them running, and Autostart must not be used for the clustered instances.", fr: "Redémarrer les machines virtuelles ne les maintient pas en cours d'exécution, et Autostart ne doit pas être utilisé pour les instances en cluster." }
references:
  - title: Start and stop SAP systems, instances, and HANA database
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/start-stop-sap-systems
