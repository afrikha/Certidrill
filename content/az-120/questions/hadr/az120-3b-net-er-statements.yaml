id: az120-3b-net-er-statements
objective: "3.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum connects its on-premises network to Azure through ExpressRoute private peering. Adatum enables Azure Site Recovery replication of its SAP application VMs from West Europe to North Europe and lets Site Recovery create the target network.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum connecte son réseau local à Azure par le peering privé ExpressRoute. Adatum active la réplication Azure Site Recovery de ses machines virtuelles d'application SAP de West Europe vers North Europe et laisse Site Recovery créer le réseau cible.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The replication traffic from West Europe to North Europe goes through the ExpressRoute circuit.
        fr: Le trafic de réplication de West Europe vers North Europe passe par le circuit ExpressRoute.
    - id: s2
      text:
        en: Site Recovery creates the ExpressRoute gateway, the gateway connection and the virtual network peerings in North Europe.
        fr: Site Recovery crée la passerelle ExpressRoute, la connexion de passerelle et les peerings de réseaux virtuels dans North Europe.
    - id: s3
      text:
        en: Site Recovery creates the target virtual network and its subnets in North Europe and maps them to the source networks.
        fr: Site Recovery crée le réseau virtuel cible et ses sous-réseaux dans North Europe, et les associe aux réseaux sources.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Azure-to-Azure replication traffic stays within Azure and doesn't use ExpressRoute; the circuit is used after failover to reach the recovered VMs. Site Recovery creates replica virtual networks and subnets and maps them to the source networks, but it doesn't create route tables, gateways, gateway connections or peerings: you create them before the failover or automate them in the recovery plan.
    fr: |
      Le trafic de réplication d'Azure vers Azure reste dans Azure et n'utilise pas ExpressRoute ; le circuit sert après le basculement pour atteindre les machines virtuelles récupérées. Site Recovery crée des réseaux virtuels et des sous-réseaux réplicas et les associe aux réseaux sources, mais il ne crée ni tables de routage, ni passerelles, ni connexions de passerelle, ni peerings : vous les créez avant le basculement ou les automatisez dans le plan de récupération.
references:
  - title: Integrate ExpressRoute with disaster recovery for Azure virtual machines
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-vm-disaster-recovery-with-expressroute
