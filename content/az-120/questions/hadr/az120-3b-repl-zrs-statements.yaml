id: az120-3b-repl-zrs-statements
objective: "3.1.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is designing a zonal deployment of SAP NetWeaver across availability zones 1 and 2. The design must use only configurations that Microsoft supports for SAP.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam conçoit un déploiement zonal de SAP NetWeaver réparti entre les zones de disponibilité 1 et 2. La conception ne doit utiliser que des configurations que Microsoft prend en charge pour SAP.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Fabrikam can store the data files of the SQL Server database on Premium_ZRS disks to replicate them synchronously across zones.
        fr: Fabrikam peut stocker les fichiers de données de la base SQL Server sur des disques Premium_ZRS pour les répliquer de manière synchrone entre zones.
    - id: s2
      text:
        en: A Windows failover cluster for the ASCS/SCS instance can use a Premium_ZRS Azure shared disk when its nodes are in different zones.
        fr: Un cluster de basculement Windows pour l'instance ASCS/SCS peut utiliser un disque partagé Azure Premium_ZRS lorsque ses nœuds se trouvent dans des zones différentes.
    - id: s3
      text:
        en: SMB shares on Azure Files SSD with ZRS are supported for the central services failover cluster of SAP NetWeaver.
        fr: Les partages SMB sur Azure Files SSD avec ZRS sont pris en charge pour le cluster de basculement des services centraux de SAP NetWeaver.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Synchronous zonal replication of Premium SSD v1 hasn't been tested with SAP database workloads, so Microsoft considers it not supported for databases; database files replicate with the DBMS (for example SQL Server Always On). For the ASCS/SCS cluster, Microsoft's Windows guide uses Premium_ZRS shared disks for zonal deployments, and zone-redundant SMB and NFS shares on Azure Files SSD are fully supported for central services failover clusters.
    fr: |
      La réplication zonale synchrone des SSD Premium v1 n'a pas été testée avec les charges de travail de base de données SAP : Microsoft la considère donc comme non prise en charge pour les bases de données ; les fichiers de base de données se répliquent avec le SGBD (par exemple SQL Server Always On). Pour le cluster ASCS/SCS, le guide Windows de Microsoft utilise des disques partagés Premium_ZRS pour les déploiements zonaux, et les partages SMB et NFS redondants interzone sur Azure Files SSD sont entièrement pris en charge pour les clusters de basculement des services centraux.
references:
  - title: SAP workload configurations with Azure Availability Zones
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones
  - title: Prepare the Azure infrastructure for SAP HA by using a Windows failover cluster and shared disk for SAP ASCS/SCS
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-high-availability-infrastructure-wsfc-shared-disk
