id: az120-3b-region-statements
objective: "3.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is designing disaster recovery for its SAP landscape in a second Azure region. The DR VMs will be deployed in a separate subscription dedicated to disaster recovery.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam conçoit la reprise d'activité de son paysage SAP dans une deuxième région Azure. Les machines virtuelles de reprise seront déployées dans un abonnement distinct dédié à la reprise d'activité.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Geo-redundant storage (GRS) on standard storage accounts is a suitable way to replicate the SAP DBMS data disks to the DR region.
        fr: Le stockage géoredondant (GRS) sur des comptes de stockage standard est un moyen adapté de répliquer les disques de données du SGBD SAP vers la région de reprise.
    - id: s2
      text:
        en: Azure Backup replicates backups of the supported workloads only to the paired region of the primary region.
        fr: Sauvegarde Azure ne réplique les sauvegardes des charges de travail prises en charge que vers la région jumelée de la région primaire.
    - id: s3
      text:
        en: Fabrikam must verify that the DR subscription has enough vCPU quota for each VM family that the DR site needs.
        fr: Fabrikam doit vérifier que l'abonnement de reprise dispose d'un quota de processeurs virtuels suffisant pour chaque famille de machines virtuelles nécessaire au site de reprise.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      GRS replicates standard storage accounts to the paired region, but standard storage isn't suitable for SAP DBMS or VM data disks; databases use native DBMS replication. Azure Backup replicates backups only between paired regions. When the DR site is in a different subscription, you must check that it has enough compute quota for the required VM families, such as Mv2.
    fr: |
      GRS réplique les comptes de stockage standard vers la région jumelée, mais le stockage standard ne convient pas aux disques de SGBD SAP ni aux disques de données des machines virtuelles ; les bases de données utilisent la réplication native du SGBD. Sauvegarde Azure ne réplique les sauvegardes qu'entre régions jumelées. Lorsque le site de reprise se trouve dans un autre abonnement, vous devez vérifier qu'il dispose d'un quota de calcul suffisant pour les familles de machines virtuelles nécessaires, comme Mv2.
references:
  - title: Disaster recovery overview and infrastructure guidelines for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-overview-guide
