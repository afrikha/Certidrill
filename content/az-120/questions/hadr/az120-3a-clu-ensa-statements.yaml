id: az120-3a-clu-ensa-statements
objective: "3.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs two SAP systems on Azure with Pacemaker clusters for the ASCS/ERS instances: **ECC**, based on SAP NetWeaver 7.40 with the Standalone Enqueue Server (ENSA1), and **S4P**, based on ABAP Platform 2022.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute deux systèmes SAP sur Azure avec des clusters Pacemaker pour les instances ASCS/ERS : **ECC**, basé sur SAP NetWeaver 7.40 avec le serveur de mise en file d'attente autonome (ENSA1), et **S4P**, basé sur ABAP Platform 2022.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: S4P uses the Standalone Enqueue Server 2 (ENSA2) by default.
        fr: S4P utilise par défaut le serveur de mise en file d'attente autonome 2 (ENSA2).
    - id: s2
      text:
        en: The ASCS/ERS cluster of ECC can be extended to three nodes, with the third node as a spare.
        fr: Le cluster ASCS/ERS d'ECC peut être étendu à trois nœuds, le troisième servant de nœud de secours.
    - id: s3
      text:
        en: The ASCS profile of ECC must contain enque/encni/set_so_keepalive = TRUE.
        fr: Le profil ASCS d'ECC doit contenir enque/encni/set_so_keepalive = TRUE.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: ENSA2 is installed by default from ABAP Platform 1809, so S4P uses it. A three-node ASCS/ERS cluster with a spare node is supported only with ENSA2, not with the ENSA1 system ECC. ENSA1 requires enque/encni/set_so_keepalive = TRUE in the ASCS profile, in addition to the OS keepalive settings that both versions need.
    fr: ENSA2 est installé par défaut à partir d'ABAP Platform 1809 ; S4P l'utilise donc. Un cluster ASCS/ERS à trois nœuds avec un nœud de secours n'est pris en charge qu'avec ENSA2, pas avec le système ENSA1 ECC. ENSA1 exige enque/encni/set_so_keepalive = TRUE dans le profil ASCS, en plus des paramètres keepalive du système d'exploitation nécessaires aux deux versions.
references:
  - title: Azure VMs high availability for SAP NetWeaver on SLES
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse
  - title: Azure Virtual Machines HA for SAP NW on RHEL
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-rhel
