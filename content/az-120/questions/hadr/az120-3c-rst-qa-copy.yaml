id: az120-3c-rst-qa-copy
objective: "3.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum protects the SAP HANA database of its production system **PRD** with Azure Backup. A quality assurance system named **QAS** runs on another Azure VM in the same region and is registered with the same Recovery Services vault.

    You need to refresh QAS with the last full backup of PRD. PRD must stay online and unchanged.

    Which restore option should you use?
  fr: |
    Adatum protège la base de données SAP HANA de son système de production **PRD** avec Sauvegarde Azure. Un système d'assurance qualité nommé **QAS** s'exécute sur une autre machine virtuelle Azure de la même région et est inscrit auprès du même coffre Recovery Services.

    Vous devez actualiser QAS avec la dernière sauvegarde complète de PRD. PRD doit rester en ligne et inchangé.

    Quelle option de restauration devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Alternate location", fr: "Autre emplacement" } }
    - { id: b, text: { en: "Cross Region Restore", fr: "Restauration interrégion" } }
    - { id: c, text: { en: "Original location", fr: "Emplacement d'origine" } }
    - { id: d, text: { en: "Restore as files to an SMB Azure file share", fr: "Restaurer en tant que fichiers vers un partage de fichiers Azure SMB" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An alternate location restore sends the backup to another registered HANA instance in the same region, here QAS, and keeps the source database. You select the Full & Differential recovery point of the last full backup and a name for the restored database.
    fr: |
      Une restauration vers un autre emplacement envoie la sauvegarde vers une autre instance HANA inscrite de la même région, ici QAS, et conserve la base source. Vous sélectionnez le point de récupération Full & Differential de la dernière sauvegarde complète et un nom pour la base restaurée.
  options:
    c: { en: "Original location overwrites the PRD database.", fr: "L'emplacement d'origine remplace la base de données PRD." }
    b: { en: "Cross Region Restore restores in the paired secondary region, not to an instance in the same region.", fr: "La restauration interrégion restaure dans la région secondaire jumelée, pas vers une instance de la même région." }
    d: { en: "Restore as files doesn't work on CIFS/SMB shares, and it would require a manual recovery on QAS.", fr: "La restauration en tant que fichiers ne fonctionne pas sur les partages CIFS/SMB, et elle exigerait une récupération manuelle sur QAS." }
references:
  - title: Restore SAP HANA databases on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-db-restore
