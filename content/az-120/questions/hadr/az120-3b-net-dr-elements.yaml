id: az120-3b-net-dr-elements
objective: "3.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso is preparing the network of the DR region for its SAP S/4HANA system. The SAP users connect from on-premises through ExpressRoute, partners use the Fiori launchpad over HTTPS through a web application firewall (WAF), and the ASCS/ERS instances run in a Pacemaker cluster. The DR virtual network will be peered with the production virtual network for HANA System Replication, and both will be connected to the on-premises network at the same time.

    What should you configure for each requirement? To answer, drag the appropriate configurations to the correct requirements. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prépare le réseau de la région de reprise pour son système SAP S/4HANA. Les utilisateurs SAP se connectent depuis le site local par ExpressRoute, des partenaires utilisent le Fiori launchpad en HTTPS au travers d'un pare-feu d'applications web (WAF), et les instances ASCS/ERS s'exécutent dans un cluster Pacemaker. Le réseau virtuel de reprise sera relié par peering au réseau virtuel de production pour HANA System Replication, et les deux seront connectés au réseau local en même temps.

    Que devez-vous configurer pour chaque exigence ? Pour répondre, faites glisser les configurations appropriées vers les exigences correspondantes. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: er, text: { en: "Geo-redundant ExpressRoute circuits to both regions, with a site-to-site VPN as backup", fr: "Des circuits ExpressRoute géoredondants vers les deux régions, avec un VPN site à site en secours" } }
    - { id: ilb, text: { en: "A separate internal Standard load balancer in the DR region", fr: "Un équilibreur de charge interne Standard distinct dans la région de reprise" } }
    - { id: agw, text: { en: "A separate Application Gateway with WAF in the DR region", fr: "Une instance Application Gateway distincte avec WAF dans la région de reprise" } }
    - { id: range, text: { en: "An IP address range that doesn't overlap the production range", fr: "Une plage d'adresses IP qui ne chevauche pas la plage de production" } }
    - { id: same, text: { en: "The same IP address range as the production virtual network", fr: "La même plage d'adresses IP que le réseau virtuel de production" } }
    - { id: single, text: { en: "A single ExpressRoute circuit that terminates in the primary region", fr: "Un seul circuit ExpressRoute qui aboutit dans la région primaire" } }
  targets:
    - { id: t_onprem, text: { en: "On-premises connectivity that survives the loss of the primary region", fr: "Une connectivité locale qui survit à la perte de la région primaire" } }
    - { id: t_vip, text: { en: "Virtual IP addresses of the ASCS/ERS cluster after failover", fr: "Les adresses IP virtuelles du cluster ASCS/ERS après le basculement" } }
    - { id: t_https, text: { en: "Partner HTTPS access with WAF after failover", fr: "L'accès HTTPS des partenaires avec WAF après le basculement" } }
    - { id: t_addr, text: { en: "Address space of the DR virtual network", fr: "L'espace d'adressage du réseau virtuel de reprise" } }
answer:
  mapping: { t_onprem: er, t_vip: ilb, t_https: agw, t_addr: range }
explanation:
  correct:
    en: |
      Microsoft recommends geo-redundant ExpressRoute circuits, at least one to the primary region and one to the DR region, with a site-to-site VPN as a possible backup. Load balancers for clustered systems and Application Gateway with WAF must be created separately in the DR region. Peered virtual networks, and virtual networks connected to the same circuit, can't have overlapping address spaces, so the DR network uses a different range.
    fr: |
      Microsoft recommande des circuits ExpressRoute géoredondants, au moins un vers la région primaire et un vers la région de reprise, avec un VPN site à site comme secours possible. Les équilibreurs de charge des systèmes en cluster et Application Gateway avec WAF doivent être créés séparément dans la région de reprise. Des réseaux virtuels reliés par peering, ou connectés au même circuit, ne peuvent pas avoir d'espaces d'adressage qui se chevauchent : le réseau de reprise utilise donc une autre plage.
  options:
    same: { en: "Overlapping ranges prevent peering and can't be connected to the same circuit at the same time.", fr: "Des plages qui se chevauchent empêchent le peering et ne peuvent pas être connectées au même circuit en même temps." }
    single: { en: "A circuit that terminates only in the primary region doesn't protect connectivity against a regional outage.", fr: "Un circuit qui aboutit uniquement dans la région primaire ne protège pas la connectivité contre une panne régionale." }
references:
  - title: Disaster recovery overview and infrastructure guidelines for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-overview-guide
  - title: Integrate ExpressRoute with disaster recovery for Azure virtual machines
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-vm-disaster-recovery-with-expressroute
