id: az120-cs3c-dr-methods
objective: "3.2.1"
type: dragdrop
caseStudy: az120-cs3c-trey-research
difficulty: 3
status: draft
stem:
  en: |
    You need to design the replication of TRP to North Europe to meet the disaster recovery requirement.

    Which replication method should you use for each component? To answer, drag the appropriate methods to the correct components. Each method may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez concevoir la réplication de TRP vers North Europe pour respecter l'exigence de reprise d'activité.

    Quelle méthode de réplication devez-vous utiliser pour chaque composant ? Pour répondre, faites glisser les méthodes appropriées vers les composants correspondants. Chaque méthode peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: asr, text: { en: "Azure Site Recovery", fr: "Azure Site Recovery" } }
    - { id: ag, text: { en: "Asynchronous availability group replica in North Europe", fr: "Réplica asynchrone du groupe de disponibilité dans North Europe" } }
    - { id: robo, text: { en: "Scheduled RoboCopy to a share in North Europe", fr: "RoboCopy planifié vers un partage dans North Europe" } }
    - { id: anf, text: { en: "Azure NetApp Files cross-region replication", fr: "Réplication interrégion d'Azure NetApp Files" } }
    - { id: grs, text: { en: "Geo-redundant storage (GRS) on the storage account", fr: "Stockage géoredondant (GRS) sur le compte de stockage" } }
  targets:
    - { id: app, text: { en: "APP-PRD1 to APP-PRD4", fr: "APP-PRD1 à APP-PRD4" } }
    - { id: ascs, text: { en: "ASCS-PRD1 and ASCS-PRD2 with their Azure shared disk", fr: "ASCS-PRD1 et ASCS-PRD2 avec leur disque partagé Azure" } }
    - { id: db, text: { en: "TRP database", fr: "Base de données de TRP" } }
    - { id: trans, text: { en: "Transport share", fr: "Partage de transport" } }
answer:
  mapping: { app: asr, ascs: asr, db: ag, trans: robo }
explanation:
  correct:
    en: |
      Azure Site Recovery replicates the managed disks of the application servers, and it also supports Windows active-passive WSFC clusters with Azure shared disks; for regional DR, a ZRS shared disk replicates to ZRS. For the database, Microsoft advises native DBMS replication, here an asynchronous availability group replica, because Site Recovery doesn't guarantee database consistency. SMB shares on Azure Files are copied to the DR site with RoboCopy.
    fr: |
      Azure Site Recovery réplique les disques managés des serveurs d'applications, et il prend aussi en charge les clusters WSFC Windows actif-passif avec des disques partagés Azure ; pour une reprise d'activité régionale, un disque partagé ZRS est répliqué vers du ZRS. Pour la base de données, Microsoft conseille la réplication native du SGBD, ici un réplica asynchrone du groupe de disponibilité, car Site Recovery ne garantit pas la cohérence de la base. Les partages SMB sur Azure Files sont copiés vers le site de reprise avec RoboCopy.
  options:
    anf:
      en: |
        Cross-region replication applies to Azure NetApp Files volumes, and TRP doesn't use Azure NetApp Files.
      fr: |
        La réplication interrégion s'applique aux volumes Azure NetApp Files, et TRP n'utilise pas Azure NetApp Files.
    grs:
      en: |
        GRS is only offered for standard storage accounts; premium file shares and the managed disks of SAP VMs can't use it.
      fr: |
        Le GRS n'est proposé que pour les comptes de stockage standard ; les partages de fichiers premium et les disques managés des machines virtuelles SAP ne peuvent pas l'utiliser.
references:
  - title: Disaster Recovery overview and infrastructure guidelines for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-overview-guide
  - title: Support matrix for shared disks in Azure VM disaster recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/shared-disk-support-matrix
