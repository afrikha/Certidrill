id: az120-3a-lb-outbound
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys deploys a Pacemaker cluster for SAP HANA in a new virtual network created in October 2026. The two VMs have no public IP addresses and are in the backend pool of a Standard internal load balancer. The Azure fence agent on the VMs must reach `https://management.azure.com` and `https://login.microsoftonline.com`. The VMs must not accept inbound connections from the internet.

    Which two solutions can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys déploie un cluster Pacemaker pour SAP HANA dans un nouveau réseau virtuel créé en octobre 2026. Les deux machines virtuelles n'ont pas d'adresse IP publique et se trouvent dans le pool principal d'un équilibreur de charge interne Standard. L'agent de clôture Azure des machines virtuelles doit joindre `https://management.azure.com` et `https://login.microsoftonline.com`. Les machines virtuelles ne doivent pas accepter de connexions entrantes depuis Internet.

    Quelles sont les deux solutions que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Associate an Azure NAT gateway with the subnet of the VMs.", fr: "Associer une passerelle NAT Azure au sous-réseau des machines virtuelles." } }
    - { id: b, text: { en: "Enable floating IP on the load-balancing rule of the internal load balancer.", fr: "Activer l'IP flottante sur la règle d'équilibrage de charge de l'équilibreur de charge interne." } }
    - { id: c, text: { en: "Route 0.0.0.0/0 from the subnet to Azure Firewall and allow the two endpoints in its rules.", fr: "Router 0.0.0.0/0 depuis le sous-réseau vers le Pare-feu Azure et autoriser les deux points de terminaison dans ses règles." } }
    - { id: d, text: { en: "Add a virtual network service endpoint for Microsoft.Storage to the subnet.", fr: "Ajouter un point de terminaison de service de réseau virtuel pour Microsoft.Storage au sous-réseau." } }
    - { id: e, text: { en: "Link a private DNS zone named management.azure.com to the virtual network.", fr: "Lier une zone DNS privée nommée management.azure.com au réseau virtuel." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: VMs in the backend pool of an internal Standard load balancer have no outbound internet access, and subnets of virtual networks created after March 31, 2026 are private by default. A NAT gateway on the subnet provides outbound-only connectivity, and Azure Firewall with a default route is another documented option, provided that it allows the Azure management and Microsoft Entra endpoints.
    fr: "Les machines virtuelles du pool principal d'un équilibreur de charge interne Standard n'ont pas d'accès sortant à Internet, et les sous-réseaux des réseaux virtuels créés après le 31 mars 2026 sont privés par défaut. Une passerelle NAT sur le sous-réseau fournit une connectivité uniquement sortante, et le Pare-feu Azure avec un itinéraire par défaut est une autre option documentée, à condition qu'il autorise les points de terminaison de gestion Azure et de Microsoft Entra."
  options:
    b: { en: "Floating IP changes how inbound load-balanced traffic is delivered; it gives no outbound connectivity.", fr: "L'IP flottante change la façon dont le trafic entrant équilibré est remis ; elle n'apporte aucune connectivité sortante." }
    d: { en: "A Microsoft.Storage service endpoint covers Azure Storage, not the Azure Resource Manager and Microsoft Entra endpoints.", fr: "Un point de terminaison de service Microsoft.Storage couvre Stockage Azure, pas les points de terminaison Azure Resource Manager et Microsoft Entra." }
    e: { en: "A private DNS zone changes name resolution only; the VMs still have no outbound path, and resolution of the real endpoint would break.", fr: "Une zone DNS privée ne modifie que la résolution de noms ; les machines virtuelles n'ont toujours pas de chemin sortant, et la résolution du vrai point de terminaison serait cassée." }
references:
  - title: Outbound connectivity for SAP VMs
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-standard-load-balancer-outbound-connections
