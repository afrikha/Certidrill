id: az120-3c-cfg-health-states
objective: "3.2.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are validating the Azure Backup protection of three SAP HANA databases in a Recovery Services vault. Each database shows a different backup status.

    Which status matches each situation? To answer, drag the appropriate statuses to the correct situations. Each status may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous validez la protection Sauvegarde Azure de trois bases de données SAP HANA dans un coffre Recovery Services. Chaque base affiche un état de sauvegarde différent.

    Quel état correspond à chaque situation ? Pour répondre, faites glisser les états appropriés vers les situations correspondantes. Chaque état peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: healthy, text: Healthy }
    - { id: unhealthy, text: Unhealthy }
    - { id: notreach, text: NotReachable }
    - { id: irpending, text: IRPending }
  targets:
    - id: t1
      text: { en: "The database was just protected and its first backup hasn't run yet.", fr: "La base vient d'être protégée et sa première sauvegarde n'a pas encore eu lieu." }
    - id: t2
      text: { en: "The VM extension hasn't synchronized with the service for more than 2 hours.", fr: "L'extension de la machine virtuelle ne s'est pas synchronisée avec le service depuis plus de 2 heures." }
    - id: t3
      text: { en: "The last backup of the database failed.", fr: "La dernière sauvegarde de la base a échoué." }
answer:
  mapping: { t1: irpending, t2: notreach, t3: unhealthy }
explanation:
  correct:
    en: |
      IRPending means the first backup hasn't occurred yet. The extension syncs with the service about every hour; with no sync for more than 2 hours, the status becomes NotReachable. Unhealthy means the last backup failed, and Healthy means it succeeded.
    fr: |
      IRPending signifie que la première sauvegarde n'a pas encore eu lieu. L'extension se synchronise avec le service environ toutes les heures ; sans synchronisation depuis plus de 2 heures, l'état devient NotReachable. Unhealthy signifie que la dernière sauvegarde a échoué, et Healthy qu'elle a réussi.
references:
  - title: Back up SAP HANA databases in Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-sap-hana-database
