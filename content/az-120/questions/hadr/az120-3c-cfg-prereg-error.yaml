id: az120-3c-cfg-prereg-error
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are configuring Azure Backup for an SAP HANA database on an Azure VM named **hana01**. Network connectivity to Azure Backup, Azure Storage and Microsoft Entra ID is in place.

    When you select **Discover DBs**, the operation fails with the error **UserErrorHanaScriptNotRun**.

    What should you do?
  fr: |
    Vous configurez Sauvegarde Azure pour une base de données SAP HANA sur une machine virtuelle Azure nommée **hana01**. La connectivité réseau vers Sauvegarde Azure, Stockage Azure et Microsoft Entra ID est en place.

    Lorsque vous sélectionnez **Discover DBs**, l'opération échoue avec l'erreur **UserErrorHanaScriptNotRun**.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Install the Azure Monitor Agent on hana01", fr: "Installer l'agent Azure Monitor sur hana01" } }
    - { id: b, text: { en: "Assign the Backup Contributor role to the managed identity of hana01", fr: "Attribuer le rôle Backup Contributor à l'identité managée de hana01" } }
    - { id: c, text: { en: "Run the pre-registration script on hana01 as root", fr: "Exécuter le script de préinscription sur hana01 en tant que root" } }
    - { id: d, text: { en: "Re-register the Microsoft.RecoveryServices resource provider", fr: "Réinscrire le fournisseur de ressources Microsoft.RecoveryServices" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The pre-registration script must run as root on the HANA VM before discovery. It creates the AZUREWLBACKUPHANAUSER database user (or uses a custom backup user) and the matching hdbuserstore key. Skipping it causes the UserErrorHanaScriptNotRun error.
    fr: |
      Le script de préinscription doit être exécuté en tant que root sur la machine virtuelle HANA avant la découverte. Il crée l'utilisateur de base de données AZUREWLBACKUPHANAUSER (ou utilise un utilisateur de sauvegarde personnalisé) et la clé hdbuserstore correspondante. Sans lui, l'erreur UserErrorHanaScriptNotRun se produit.
  options:
    a: { en: "The Azure Monitor Agent collects monitoring data; HANA backup uses its own workload extension, installed during discovery.", fr: "L'agent Azure Monitor collecte des données de supervision ; la sauvegarde HANA utilise sa propre extension de charge de travail, installée lors de la découverte." }
    b: { en: "Streaming backup doesn't rely on a role assigned to the VM identity; the error points to the missing database user and key.", fr: "La sauvegarde en streaming ne dépend pas d'un rôle attribué à l'identité de la machine virtuelle ; l'erreur indique l'absence de l'utilisateur et de la clé de base de données." }
    d: { en: "Re-registering the provider fixes missing vault settings in the portal, not a HANA discovery error.", fr: "Réinscrire le fournisseur corrige des paramètres de coffre absents dans le portail, pas une erreur de découverte HANA." }
references:
  - title: About SAP HANA database backup on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-about
