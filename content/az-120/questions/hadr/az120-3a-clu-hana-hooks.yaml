id: az120-3a-clu-hana-hooks
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is configuring a SAP HANA 2.0 SPS 07 scale-up cluster on SLES 15 by using the SAPHanaSR-angi package. The cluster must know the exact system replication status before it decides on a takeover. It must also fence the node quickly when the HANA indexserver process is lost.

    Which two HA/DR provider hooks should you configure in global.ini? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys configure un cluster SAP HANA 2.0 SPS 07 en scale-up sur SLES 15 avec le package SAPHanaSR-angi. Le cluster doit connaître l'état exact de la réplication système avant de décider d'une prise de contrôle. Il doit aussi isoler rapidement le nœud lorsque le processus indexserver de HANA est perdu.

    Quels sont les deux hooks de fournisseur HA/DR que vous devez configurer dans global.ini ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "susHanaSR", fr: "susHanaSR" } }
    - { id: b, text: { en: "susChkSrv with action_on_lost = fence", fr: "susChkSrv avec action_on_lost = fence" } }
    - { id: c, text: { en: "HanaSR from the sap-hana-ha package", fr: "HanaSR du package sap-hana-ha" } }
    - { id: d, text: { en: "susChkSrv with action_on_lost = ignore", fr: "susChkSrv avec action_on_lost = ignore" } }
    - { id: e, text: { en: "sap_suse_cluster_connector", fr: "sap_suse_cluster_connector" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: The susHanaSR hook reports system replication events to the cluster (the srHook attribute), so the cluster takes over only when the secondary is in sync. The susChkSrv hook, which requires HANA 2.0 SPS 05 or later, reacts when hdbindexserver is lost; action_on_lost = fence makes the cluster fence the node instead of waiting for a slow local restart.
    fr: Le hook susHanaSR transmet au cluster les événements de réplication système (attribut srHook) ; le cluster ne prend donc le contrôle que si le secondaire est synchronisé. Le hook susChkSrv, qui exige HANA 2.0 SPS 05 ou version ultérieure, réagit à la perte de hdbindexserver ; action_on_lost = fence fait isoler le nœud par le cluster au lieu d'attendre un lent redémarrage local.
  options:
    c: { en: "HanaSR and the sap-hana-ha package are the Red Hat implementation; on SLES with SAPHanaSR-angi the provider is susHanaSR.", fr: "HanaSR et le package sap-hana-ha sont l'implémentation Red Hat ; sur SLES avec SAPHanaSR-angi, le fournisseur est susHanaSR." }
    d: { en: "With ignore, the hook takes no action when the indexserver is lost, so the node isn't fenced.", fr: "Avec ignore, le hook n'effectue aucune action lorsque l'indexserver est perdu ; le nœud n'est donc pas isolé." }
    e: { en: "sap_suse_cluster_connector is the SAP HA interface used in NetWeaver instance profiles, not a HANA HA/DR provider hook.", fr: "sap_suse_cluster_connector est l'interface HA SAP utilisée dans les profils d'instance NetWeaver, pas un hook de fournisseur HA/DR HANA." }
references:
  - title: High availability for SAP HANA on Azure VMs on SLES
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability
