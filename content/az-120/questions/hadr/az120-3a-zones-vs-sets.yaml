id: az120-3a-zones-vs-sets
objective: "3.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware is comparing availability sets and availability zones for the ASCS/ERS and database VM pairs of a new SAP S/4HANA system.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware compare les groupes à haute disponibilité et les zones de disponibilité pour les paires de machines virtuelles ASCS/ERS et de base de données d'un nouveau système SAP S/4HANA.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "VMs deployed in an availability set are protected against a power or cooling failure of an entire datacenter.", fr: "Les machines virtuelles déployées dans un groupe à haute disponibilité sont protégées contre une panne d'alimentation ou de refroidissement d'un centre de données entier." } }
    - { id: b, text: { en: "In a zonal deployment, each VM and its managed disks are colocated in the same zone.", fr: "Dans un déploiement zonal, chaque machine virtuelle et ses disques managés sont colocalisés dans la même zone." } }
    - { id: c, text: { en: "Azure guarantees a minimum geographical distance between the zones of a region.", fr: "Azure garantit une distance géographique minimale entre les zones d'une région." } }
    - { id: d, text: { en: "Without a proximity placement group, you must choose either an availability set or an availability zone for a VM.", fr: "Sans groupe de placement de proximité, vous devez choisir pour une machine virtuelle soit un groupe à haute disponibilité, soit une zone de disponibilité." } }
    - { id: e, text: { en: "Zonal VMs can use unmanaged disks if the storage account is zone-redundant.", fr: "Les machines virtuelles zonales peuvent utiliser des disques non managés si le compte de stockage est redondant interzone." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Zonal deployments colocate each VM with its disks in the zone, whereas availability sets offer no forced alignment between a VM and its disks. Availability sets and zones are mutually exclusive for a VM; they can only be combined through a proximity placement group.
    fr: "Les déploiements zonaux colocalisent chaque machine virtuelle et ses disques dans la zone, alors que les groupes à haute disponibilité n'imposent aucun alignement entre une machine virtuelle et ses disques. Groupes à haute disponibilité et zones s'excluent mutuellement pour une machine virtuelle : ils ne peuvent être combinés qu'au moyen d'un groupe de placement de proximité."
  options:
    a: { en: "An availability set stays within one datacenter, so it doesn't protect against datacenter-level power, cooling or network failures.", fr: "Un groupe à haute disponibilité reste dans un seul centre de données ; il ne protège donc pas contre les pannes d'alimentation, de refroidissement ou de réseau au niveau du centre de données." }
    c: { en: "Microsoft gives no guarantee or information about the distance between zones.", fr: "Microsoft ne donne aucune garantie ni aucune information sur la distance entre les zones." }
    e: { en: "Managed disks are mandatory for zonal deployments.", fr: "Les disques managés sont obligatoires pour les déploiements zonaux." }
references:
  - title: SAP workload configurations with Azure Availability Zones
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones
