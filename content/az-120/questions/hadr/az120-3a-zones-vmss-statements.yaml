id: az120-3a-zones-vmss-statements
objective: "3.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans to deploy an SAP system named **PR1** into a virtual machine scale set with Flexible orchestration and FD=1 that spans availability zones 1 and 2. PR1 uses E-series VMs for the application servers and M-series VMs for SAP HANA.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit de déployer un système SAP nommé **PR1** dans un groupe de machines virtuelles identiques avec orchestration flexible et FD=1 qui s'étend sur les zones de disponibilité 1 et 2. PR1 utilise des machines virtuelles de série E pour les serveurs d'applications et de série M pour SAP HANA.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After the scale set is created, you can add availability zone 3 to it to host more PR1 application servers.
        fr: Une fois le groupe créé, vous pouvez y ajouter la zone de disponibilité 3 pour héberger d'autres serveurs d'applications de PR1.
    - id: s2
      text:
        en: The E-series and M-series VMs of PR1 can be deployed in the same scale set.
        fr: Les machines virtuelles de série E et de série M de PR1 peuvent être déployées dans le même groupe.
    - id: s3
      text:
        en: Microsoft recommends creating the scale set without a scaling profile.
        fr: Microsoft recommande de créer le groupe sans profil de mise à l'échelle.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: The availability zones of a flexible scale set must be specified at creation and can't be modified later. A single flexible scale set can contain different VM SKUs (D, E and M series) and different operating systems. Microsoft recommends no scaling profile, because autoscaling doesn't work out of the box for SAP and the scale set is only a deployment framework.
    fr: Les zones de disponibilité d'un groupe flexible doivent être spécifiées à la création et ne peuvent pas être modifiées ensuite. Un même groupe flexible peut contenir différentes références SKU de machines virtuelles (séries D, E et M) et différents systèmes d'exploitation. Microsoft recommande de ne pas utiliser de profil de mise à l'échelle, car la mise à l'échelle automatique ne fonctionne pas telle quelle pour SAP et le groupe n'est qu'une infrastructure de déploiement.
references:
  - title: Virtual machine scale sets for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/virtual-machine-scale-set-sap-deployment-guide
