id: az120-3b-region-asymmetric-pair
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs SAP HANA on Mv2-series VMs and stores /hana/shared, /sapmnt and /usr/sap/trans on Azure NetApp Files in its primary region. Contoso plans the disaster recovery site in the paired region of the primary region.

    During the design review, you discover that the paired region offers neither the Mv2 VM sizes nor Azure NetApp Files. The DR site must use the same VM family and the same storage services as production.

    What should you recommend?
  fr: |
    Contoso exécute SAP HANA sur des machines virtuelles de série Mv2 et stocke /hana/shared, /sapmnt et /usr/sap/trans sur Azure NetApp Files dans sa région primaire. Contoso prévoit le site de reprise d'activité dans la région jumelée de la région primaire.

    Pendant la revue de conception, vous découvrez que la région jumelée ne propose ni les tailles de machines virtuelles Mv2 ni Azure NetApp Files. Le site de reprise doit utiliser la même famille de machines virtuelles et les mêmes services de stockage que la production.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Keep the paired region, and request a vCPU quota increase for the Mv2 family in that region.", fr: "Conserver la région jumelée, et demander une augmentation du quota de processeurs virtuels pour la famille Mv2 dans cette région." } }
    - { id: b, text: { en: "Keep the paired region, and enable geo-redundant storage for the HANA disks and NFS volumes.", fr: "Conserver la région jumelée, et activer le stockage géoredondant pour les disques HANA et les volumes NFS." } }
    - { id: c, text: { en: "Choose another region that offers Mv2 and forms a supported Azure NetApp Files replication pair with it.", fr: "Choisir une autre région qui propose Mv2 et qui forme avec elle une paire de réplication Azure NetApp Files prise en charge." } }
    - { id: d, text: { en: "Stay in the primary region, and replicate the volumes with Azure NetApp Files cross-zone replication.", fr: "Rester dans la région primaire, et répliquer les volumes avec la réplication entre zones d'Azure NetApp Files." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Paired regions can be asymmetrical: M-series sizes or Azure NetApp Files available in the primary region may be missing in the paired region. Site Recovery and HANA System Replication work between any two regions, and Azure NetApp Files cross-region replication works between its supported region pairs, which include nonstandard pairs. Choose a DR region that offers the required SKUs and services.
    fr: |
      Les régions jumelées peuvent être asymétriques : des tailles de série M ou Azure NetApp Files disponibles dans la région primaire peuvent manquer dans la région jumelée. Site Recovery et HANA System Replication fonctionnent entre deux régions quelconques, et la réplication entre régions d'Azure NetApp Files fonctionne entre ses paires de régions prises en charge, qui incluent des paires non standard. Choisissez une région de reprise qui propose les références et services nécessaires.
  options:
    a: { en: "A quota increase can't make a VM size available in a region that doesn't offer it.", fr: "Une augmentation de quota ne peut pas rendre disponible une taille de machine virtuelle dans une région qui ne la propose pas." }
    b: { en: "GRS applies to standard storage accounts, which aren't suitable for SAP DBMS disks, and it doesn't apply to Azure NetApp Files.", fr: "GRS s'applique aux comptes de stockage standard, qui ne conviennent pas aux disques de SGBD SAP, et ne s'applique pas à Azure NetApp Files." }
    d: { en: "Zones of the primary region don't protect against a regional disaster.", fr: "Les zones de la région primaire ne protègent pas contre une catastrophe régionale." }
references:
  - title: Disaster recovery overview and infrastructure guidelines for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-overview-guide
  - title: Requirements and considerations for Azure NetApp Files replication
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/replication-requirements
