id: az120-3b-region-nonprod-pattern
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders runs its production SAP systems in a primary Azure region and prepares a DR region. Management doesn't want compute in the DR region to sit idle when there's no disaster. During a disaster, production must take priority over every other SAP system.

    Which deployment pattern should you recommend?
  fr: |
    Northwind Traders exécute ses systèmes SAP de production dans une région Azure primaire et prépare une région de reprise. La direction ne veut pas que les ressources de calcul de la région de reprise restent inutilisées en l'absence de sinistre. Pendant un sinistre, la production doit être prioritaire sur tous les autres systèmes SAP.

    Quel modèle de déploiement devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Run all systems in the primary region, and use the DR region only during a failover.", fr: "Exécuter tous les systèmes dans la région primaire, et n'utiliser la région de reprise que lors d'un basculement." } }
    - { id: b, text: { en: "Run production in the primary region, and run non-production in the DR region, stopped during a failover.", fr: "Exécuter la production dans la région primaire, et la non-production dans la région de reprise, arrêtée lors d'un basculement." } }
    - { id: c, text: { en: "Run production active in both regions, with synchronous replication between the regions.", fr: "Exécuter la production en mode actif dans les deux régions, avec une réplication synchrone entre les régions." } }
    - { id: d, text: { en: "Run non-production in the primary region, and replicate it to the DR region with Site Recovery.", fr: "Exécuter la non-production dans la région primaire, et la répliquer vers la région de reprise avec Site Recovery." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft describes two reference patterns: production in the primary region and non-production in the DR region, or everything in the primary region with the DR region used only on failover. The first pattern uses the DR region's compute every day, and the non-production systems are given up during a failover so that production gets the capacity.
    fr: |
      Microsoft décrit deux modèles de référence : la production dans la région primaire et la non-production dans la région de reprise, ou tout dans la région primaire avec une région de reprise utilisée uniquement lors d'un basculement. Le premier modèle utilise chaque jour le calcul de la région de reprise, et les systèmes hors production sont sacrifiés lors d'un basculement pour que la production dispose de la capacité.
  options:
    a: { en: "This is a valid pattern, but the DR compute stays unused when there's no disaster.", fr: "C'est un modèle valide, mais le calcul de la région de reprise reste inutilisé en l'absence de sinistre." }
    c: { en: "Synchronous replication across regions isn't practical because of the latency.", fr: "La réplication synchrone entre régions n'est pas réaliste à cause de la latence." }
    d: { en: "Replica VMs don't run before a failover, so the DR compute still sits idle.", fr: "Les machines virtuelles répliquées ne s'exécutent pas avant un basculement : le calcul de reprise reste donc inutilisé." }
references:
  - title: Disaster recovery overview and infrastructure guidelines for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-overview-guide
