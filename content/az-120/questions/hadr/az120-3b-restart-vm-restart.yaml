id: az120-3b-restart-vm-restart
objective: "3.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware runs a production SAP NetWeaver system on Azure VMs without any cluster software. The ASCS instance, the database and each application server run on separate VMs that use managed disks. Proseware plans to rely on Azure VM restart (service healing) to recover from host failures.

    Microsoft states that this approach isn't suitable for critical components such as the ASCS/SCS instance or the database.

    What is the reason?
  fr: |
    Proseware exécute un système SAP NetWeaver de production sur des machines virtuelles Azure sans aucun logiciel de cluster. L'instance ASCS, la base de données et chaque serveur d'applications s'exécutent sur des machines virtuelles distinctes qui utilisent des disques managés. Proseware prévoit de s'appuyer sur le redémarrage des machines virtuelles Azure (réparation de service) pour récupérer après des pannes d'hôte.

    Microsoft indique que cette approche ne convient pas aux composants critiques comme l'instance ASCS/SCS ou la base de données.

    Quelle en est la raison ?
body:
  options:
    - { id: a, text: { en: "Azure VM restart applies only to VMs that are deployed in availability zones.", fr: "Le redémarrage des machines virtuelles Azure s'applique uniquement aux machines virtuelles déployées dans des zones de disponibilité." } }
    - { id: b, text: { en: "Azure VM restart isn't performed for VMs whose disks use premium storage.", fr: "Le redémarrage des machines virtuelles Azure n'est pas effectué pour les machines virtuelles dont les disques utilisent le stockage Premium." } }
    - { id: c, text: { en: "There is no SLA on the time a VM takes to restart after a host outage.", fr: "Il n'existe aucun contrat SLA sur le temps nécessaire au redémarrage d'une machine virtuelle après une panne d'hôte." } }
    - { id: d, text: { en: "Azure VM restart requires Pacemaker or a Windows failover cluster in the VM.", fr: "Le redémarrage des machines virtuelles Azure nécessite Pacemaker ou un cluster de basculement Windows dans la machine virtuelle." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure VM restart protects the VMs, not the applications, against planned and unplanned outages of the physical infrastructure. Because no SLA covers how long the restart takes, a single ASCS/SCS or database VM remains a single point of failure whose downtime is unpredictable; these components need application-aware clustering.
    fr: |
      Le redémarrage des machines virtuelles Azure protège les machines virtuelles, pas les applications, contre les interruptions planifiées et non planifiées de l'infrastructure physique. Comme aucun contrat SLA ne couvre la durée du redémarrage, une machine virtuelle ASCS/SCS ou de base de données unique reste un point de défaillance unique dont l'interruption est imprévisible ; ces composants ont besoin d'un clustering adapté à l'application.
  options:
    a: { en: "VM restart works for any VM; it isn't tied to availability zones.", fr: "Le redémarrage fonctionne pour toute machine virtuelle ; il n'est pas lié aux zones de disponibilité." }
    b: { en: "Premium storage doesn't prevent VM restart; Microsoft even recommends managed premium disks.", fr: "Le stockage Premium n'empêche pas le redémarrage ; Microsoft recommande même des disques managés Premium." }
    d: { en: "VM restart is the fallback used precisely when no WSFC or Pacemaker cluster is configured.", fr: "Le redémarrage est la solution de repli utilisée précisément lorsqu'aucun cluster WSFC ou Pacemaker n'est configuré." }
references:
  - title: Utilize Azure infrastructure VM restart to achieve "higher availability" of an SAP system
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-higher-availability-architecture-scenarios
