id: az120-3b-asr-recovery-plan-lb
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam protects the SAP Web Dispatcher, ASCS/SCS and application server VMs of an SAP NetWeaver system with Azure Site Recovery. All the VMs are in Group 1 of a recovery plan named **RP-SAP**. An internal Standard load balancer already exists in the DR virtual network, with an empty backend pool.

    After a failover, the failed-over Web Dispatcher VMs must be added to the load balancer automatically, without operator intervention.

    What should you do?
  fr: |
    Fabrikam protège les machines virtuelles SAP Web Dispatcher, ASCS/SCS et serveurs d'applications d'un système SAP NetWeaver avec Azure Site Recovery. Toutes les machines virtuelles se trouvent dans le groupe 1 d'un plan de récupération nommé **RP-SAP**. Un équilibreur de charge interne Standard existe déjà dans le réseau virtuel de reprise d'activité, avec un pool principal vide.

    Après un basculement, les machines virtuelles Web Dispatcher basculées doivent être ajoutées automatiquement à l'équilibreur de charge, sans intervention d'un opérateur.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a pre-action script to Group 1 that runs an Azure Automation runbook to attach the VMs to the load balancer.", fr: "Ajouter à Group 1 un script de pré-action qui exécute un runbook Azure Automation pour attacher les machines virtuelles à l'équilibreur de charge." } }
    - { id: b, text: { en: "Add a manual action after Group 1 so that an operator adds the VMs to the backend pool of the load balancer.", fr: "Ajouter une action manuelle après Group 1 pour qu'un opérateur ajoute les machines virtuelles au pool principal de l'équilibreur de charge." } }
    - { id: c, text: { en: "Add a post-action script to Group 1 that runs an Azure Automation runbook to attach the VMs to the load balancer.", fr: "Ajouter à Group 1 un script de post-action qui exécute un runbook Azure Automation pour attacher les machines virtuelles à l'équilibreur de charge." } }
    - { id: d, text: { en: "Move the Web Dispatcher VMs to a new Group 2 so that the load balancer is attached when the group starts.", fr: "Déplacer les machines virtuelles Web Dispatcher dans un nouveau Group 2 pour que l'équilibreur de charge soit attaché au démarrage du groupe." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Site Recovery doesn't replicate load balancers, but a recovery plan can run Azure Automation runbooks as pre-action or post-action scripts of a group. Microsoft's SAP guidance uses a post-action script on Group 1 (the ASR-AddSingleLoadBalancer sample) to attach the load balancer once the failed-over VMs exist.
    fr: |
      Site Recovery ne réplique pas les équilibreurs de charge, mais un plan de récupération peut exécuter des runbooks Azure Automation comme scripts de pré-action ou de post-action d'un groupe. Les recommandations SAP de Microsoft utilisent un script de post-action sur Group 1 (l'exemple ASR-AddSingleLoadBalancer) pour attacher l'équilibreur de charge une fois les machines virtuelles basculées créées.
  options:
    a: { en: "A pre-action script runs before the VMs of the group are failed over, so there's nothing to attach yet.", fr: "Un script de pré-action s'exécute avant le basculement des machines virtuelles du groupe : il n'y a encore rien à attacher." }
    b: { en: "A manual action requires an operator, which the requirement forbids.", fr: "Une action manuelle nécessite un opérateur, ce que l'exigence interdit." }
    d: { en: "Groups only order the failover; they don't attach any load balancer by themselves.", fr: "Les groupes ne font qu'ordonner le basculement ; ils n'attachent aucun équilibreur de charge par eux-mêmes." }
references:
  - title: Set up disaster recovery for a multi-tier SAP NetWeaver app deployment
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-sap
