id: az120-3c-cfg-nsg-tags
objective: "3.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin protects SAP HANA databases with Azure Backup streaming (Backint) backups only. The subnet of the HANA VMs has a network security group that contains an outbound rule denying traffic to the **Internet** service tag. Instance snapshots aren't used.

    You need to add outbound rules so that backups and restores succeed. The solution must grant the minimum access required.

    Which three service tags should you use as destinations? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin protège des bases de données SAP HANA uniquement avec des sauvegardes en streaming (Backint) de Sauvegarde Azure. Le sous-réseau des machines virtuelles HANA possède un groupe de sécurité réseau qui contient une règle sortante refusant le trafic vers l'étiquette de service **Internet**. Les instantanés d'instance ne sont pas utilisés.

    Vous devez ajouter des règles sortantes pour que les sauvegardes et les restaurations réussissent. La solution doit accorder l'accès minimal nécessaire.

    Quelles sont les trois étiquettes de service à utiliser comme destinations ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: AzureBackup }
    - { id: b, text: AzureResourceManager }
    - { id: c, text: Storage }
    - { id: d, text: AzureSiteRecovery }
    - { id: e, text: AzureActiveDirectory }
    - { id: f, text: AzureMonitor }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |
      The HANA backup extension needs connectivity to Azure Backup, Azure Storage and Microsoft Entra ID. With NSGs, you allow these through the AzureBackup, Storage and AzureActiveDirectory service tags.
    fr: |
      L'extension de sauvegarde HANA a besoin d'une connectivité vers Sauvegarde Azure, Stockage Azure et Microsoft Entra ID. Avec des NSG, vous les autorisez par les étiquettes de service AzureBackup, Storage et AzureActiveDirectory.
  options:
    b: { en: "AzureResourceManager (management.azure.com) is required only for HANA instance snapshot backups, which aren't used here.", fr: "AzureResourceManager (management.azure.com) n'est nécessaire que pour les sauvegardes par instantanés d'instance HANA, non utilisées ici." }
    d: { en: "AzureSiteRecovery is for Site Recovery replication, not for Azure Backup.", fr: "AzureSiteRecovery sert à la réplication Site Recovery, pas à Sauvegarde Azure." }
    f: { en: "AzureMonitor isn't required for backup and restore operations.", fr: "AzureMonitor n'est pas nécessaire aux opérations de sauvegarde et de restauration." }
references:
  - title: Back up SAP HANA databases in Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-sap-hana-database
