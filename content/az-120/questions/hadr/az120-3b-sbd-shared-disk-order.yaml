id: az120-3b-sbd-shared-disk-order
objective: "3.1.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs a two-node Pacemaker cluster on SLES for the ASCS/ERS instances of an SAP system. The two VMs are in the same availability set. Proseware decides to use SBD fencing with an Azure shared disk. The softdog module is already loaded on both nodes.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware exécute un cluster Pacemaker à deux nœuds sur SLES pour les instances ASCS/ERS d'un système SAP. Les deux machines virtuelles se trouvent dans le même groupe à haute disponibilité. Proseware décide d'utiliser une clôture SBD avec un disque partagé Azure. Le module softdog est déjà chargé sur les deux nœuds.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create a small Premium_LRS managed disk with maxShares set to 2.", fr: "Créer un petit disque managé Premium_LRS avec maxShares défini sur 2." } }
    - { id: attach, text: { en: "Attach the disk to both cluster VMs by using the same LUN.", fr: "Attacher le disque aux deux machines virtuelles du cluster en utilisant le même LUN." } }
    - { id: init, text: { en: "Initialize the SBD device on the disk with sbd -d <device> -1 60 -4 120 create.", fr: "Initialiser le périphérique SBD sur le disque avec sbd -d <device> -1 60 -4 120 create." } }
    - { id: rsc, text: { en: "Configure the SBD fencing resource of the cluster to use the device.", fr: "Configurer la ressource de clôture SBD du cluster pour qu'elle utilise le périphérique." } }
    - { id: iscsi, text: { en: "Deploy three iSCSI target server VMs in the same region.", fr: "Déployer trois machines virtuelles de serveur cible iSCSI dans la même région." } }
    - { id: role, text: { en: "Assign the Linux Fence Agent role to the managed identity of each VM.", fr: "Attribuer le rôle Linux Fence Agent à l'identité managée de chaque machine virtuelle." } }
    - { id: wa, text: { en: "Enable Write Accelerator on the shared disk.", fr: "Activer l'accélérateur d'écriture sur le disque partagé." } }
answer:
  sequence: [ create, attach, init, rsc ]
explanation:
  correct:
    en: |
      You first create the shared disk (Premium_LRS for an availability set, maxShares at least the number of nodes) and attach it to every node with the same LUN. You then initialize the SBD device on the disk from one node, and finally configure the cluster's SBD fencing resource to use it (with stonith-timeout 210).
    fr: |
      Vous créez d'abord le disque partagé (Premium_LRS pour un groupe à haute disponibilité, maxShares au moins égal au nombre de nœuds) et vous l'attachez à chaque nœud avec le même LUN. Vous initialisez ensuite le périphérique SBD sur le disque depuis un nœud, puis vous configurez la ressource de clôture SBD du cluster pour qu'elle l'utilise (avec stonith-timeout à 210).
  options:
    iscsi: { en: "iSCSI target servers are the other SBD option; a shared disk replaces them.", fr: "Les serveurs cibles iSCSI sont l'autre option SBD ; un disque partagé les remplace." }
    role: { en: "The Linux Fence Agent role is for the Azure fence agent, not for SBD.", fr: "Le rôle Linux Fence Agent concerne l'agent de clôture Azure, pas SBD." }
    wa: { en: "Write Accelerator is for the HANA log volume on M-series VMs; an SBD disk doesn't need it.", fr: "L'accélérateur d'écriture est destiné au volume de journal HANA sur les machines virtuelles de série M ; un disque SBD n'en a pas besoin." }
references:
  - title: Set up Pacemaker on SUSE Linux Enterprise Server in Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-pacemaker
