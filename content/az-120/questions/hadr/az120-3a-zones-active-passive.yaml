id: az120-3a-zones-active-passive
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is deploying a highly available SAP ERP system across availability zones 1 and 2 of an Azure region. The ASCS/ERS and database VM pairs will be clustered across the two zones. Latency tests show that when an application server and the active database are in different zones, batch job run times increase to a level that the business can't accept. Fabrikam accepts that a zonal outage stops the application layer until it is restarted in the other zone.

    Which deployment pattern should you recommend for the application servers?
  fr: |
    Fabrikam déploie un système SAP ERP hautement disponible dans les zones de disponibilité 1 et 2 d'une région Azure. Les paires de machines virtuelles ASCS/ERS et de base de données seront mises en cluster entre les deux zones. Les tests de latence montrent que, lorsqu'un serveur d'applications et la base de données active se trouvent dans des zones différentes, la durée d'exécution des travaux en arrière-plan augmente à un niveau que l'entreprise ne peut pas accepter. Fabrikam accepte qu'une panne de zone arrête la couche d'applications jusqu'à son redémarrage dans l'autre zone.

    Quel modèle de déploiement devez-vous recommander pour les serveurs d'applications ?
body:
  options:
    - id: a
      text: { en: "Active/active: deploy an even number of application servers across zones 1 and 2.", fr: "Actif/actif : déployer un nombre pair de serveurs d'applications dans les zones 1 et 2." }
    - id: b
      text: { en: "Active/passive: deploy the application servers in the zone of the active database and ASCS/SCS.", fr: "Actif/passif : déployer les serveurs d'applications dans la zone de la base de données et de l'ASCS/SCS actifs." }
    - id: c
      text: { en: "Active/active: deploy the application servers across zones 1, 2 and 3.", fr: "Actif/actif : déployer les serveurs d'applications dans les zones 1, 2 et 3." }
    - id: d
      text: { en: "Regional: deploy the application servers in a flexible scale set with FD=3.", fr: "Régional : déployer les serveurs d'applications dans un groupe flexible avec FD=3." }
answer: { optionId: b }
explanation:
  correct:
    en: The active/passive pattern keeps the application layer in the same zone as the active ASCS/SCS and database, which removes cross-zone latency from application-to-database traffic. Microsoft suggests it when cross-zone latency causes intolerable run-time differences; the trade-off is that a zonal outage requires failing over the application layer, which users experience as a full system shutdown.
    fr: "Le modèle actif/passif conserve la couche d'applications dans la même zone que l'ASCS/SCS et la base de données actifs, ce qui supprime la latence interzone du trafic entre applications et base de données. Microsoft le suggère lorsque la latence interzone entraîne des écarts de durée d'exécution inacceptables ; en contrepartie, une panne de zone impose de basculer la couche d'applications, ce que les utilisateurs perçoivent comme un arrêt complet du système."
  options:
    a: { en: "Active/active is the preferred pattern in general, but it places application servers in the zone of the passive database, which the latency results rule out.", fr: "L'actif/actif est le modèle préféré en général, mais il place des serveurs d'applications dans la zone de la base de données passive, ce que les résultats de latence excluent." }
    c: { en: "Spreading across three zones still places most application servers away from the active database.", fr: "Une répartition sur trois zones éloigne toujours la plupart des serveurs d'applications de la base de données active." }
    d: { en: "A flexible scale set with FD greater than 1 is a regional deployment, which isn't supported for SAP.", fr: "Un groupe flexible avec FD supérieur à 1 est un déploiement régional, qui n'est pas pris en charge pour SAP." }
references:
  - title: SAP workload configurations with Azure Availability Zones
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones
