id: az120-3b-restart-start-program
objective: "3.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum is installing the ASCS and ERS instances of an SAP system named **AD1** in a Pacemaker cluster on SLES, by following Microsoft's guide. After the installation, the ASCS instance profile contains the following line:

    ```text
    Restart_Program_01 = local $(_EN) pf=$(_PF)
    ```

    You need to adapt the ASCS instance profile so that the restart of the enqueue server is controlled by the cluster.

    What should you do?
  fr: |
    Adatum installe les instances ASCS et ERS d'un système SAP nommé **AD1** dans un cluster Pacemaker sur SLES, en suivant le guide de Microsoft. Après l'installation, le profil de l'instance ASCS contient la ligne suivante :

    ```text
    Restart_Program_01 = local $(_EN) pf=$(_PF)
    ```

    Vous devez adapter le profil de l'instance ASCS pour que le redémarrage du serveur de mise en file d'attente soit contrôlé par le cluster.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the line Autostart = 1 to the ASCS instance profile.", fr: "Ajouter la ligne Autostart = 1 dans le profil de l'instance ASCS." } }
    - { id: b, text: { en: "Comment out Restart_Program_01 and add Start_Program_01 with the same value.", fr: "Commenter Restart_Program_01 et ajouter Start_Program_01 avec la même valeur." } }
    - { id: c, text: { en: "Comment out Restart_Program_01 and add Restart_Program_00 with the same value.", fr: "Commenter Restart_Program_01 et ajouter Restart_Program_00 avec la même valeur." } }
    - { id: d, text: { en: "Delete the line, and add the enqueue server to the DEFAULT.PFL profile.", fr: "Supprimer la ligne, et ajouter le serveur de mise en file d'attente dans le profil DEFAULT.PFL." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Restart_Program entry tells sapstart to restart the process locally whenever it ends. Microsoft's guide changes the restart command to a start command (Start_Program_01) in the ASCS profile, and does the same for the enqueue replication server in the ERS profile, so that a failure is handled by Pacemaker and the SAPInstance resource agent instead of a local restart.
    fr: |
      Une entrée Restart_Program demande à sapstart de redémarrer le processus localement chaque fois qu'il s'arrête. Le guide de Microsoft remplace la commande de redémarrage par une commande de démarrage (Start_Program_01) dans le profil ASCS, et fait de même pour le serveur de réplication de mise en file d'attente dans le profil ERS, afin qu'une panne soit gérée par Pacemaker et l'agent de ressource SAPInstance plutôt que par un redémarrage local.
  options:
    a: { en: "Autostart must not be used for clustered instances; it doesn't change how the enqueue server is restarted.", fr: "Autostart ne doit pas être utilisé pour les instances en cluster ; il ne change pas la façon dont le serveur de mise en file d'attente est redémarré." }
    c: { en: "Renumbering the entry keeps a Restart_Program, so sapstart still restarts the process locally.", fr: "Renuméroter l'entrée conserve un Restart_Program : sapstart redémarre donc toujours le processus localement." }
    d: { en: "The enqueue server is started from the instance profile; the default profile holds system-wide parameters.", fr: "Le serveur de mise en file d'attente est démarré depuis le profil d'instance ; le profil par défaut contient les paramètres globaux du système." }
references:
  - title: High availability for SAP NetWeaver on Azure VMs on SUSE Linux Enterprise Server for SAP applications
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse
