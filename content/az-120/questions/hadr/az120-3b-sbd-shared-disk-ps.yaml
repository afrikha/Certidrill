id: az120-3b-sbd-shared-disk-ps
objective: "3.1.7"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Litware is deploying a three-node Pacemaker cluster on Red Hat Enterprise Linux (RHEL) 9 for the ASCS/ERS instances (ENSA2) of an SAP system. The three VMs are in availability zones 1, 2 and 3. The cluster will use SBD fencing with an Azure shared disk.

    You need to create the SBD disk by following Microsoft's guidance.

    How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware déploie un cluster Pacemaker à trois nœuds sur Red Hat Enterprise Linux (RHEL) 9 pour les instances ASCS/ERS (ENSA2) d'un système SAP. Les trois machines virtuelles se trouvent dans les zones de disponibilité 1, 2 et 3. Le cluster utilisera une clôture SBD avec un disque partagé Azure.

    Vous devez créer le disque SBD en suivant les recommandations de Microsoft.

    Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $diskConfig = New-AzDiskConfig -Location $location -SkuName [[sku]] `
        -CreateOption [[create]] -DiskSizeGB 4 -MaxSharesCount [[shares]]
    $sbdDisk = New-AzDisk -ResourceGroupName "rg-sap-prd" -DiskName "disk-sbd-lw1" -Disk $diskConfig
  slots:
    - id: sku
      options:
        - { id: plrs, text: Premium_LRS }
        - { id: pzrs, text: Premium_ZRS }
        - { id: slrs, text: StandardSSD_LRS }
        - { id: ultra, text: UltraSSD_LRS }
    - id: create
      options:
        - { id: empty, text: Empty }
        - { id: copy, text: Copy }
        - { id: attach, text: Attach }
    - id: shares
      options:
        - { id: s1, text: "1" }
        - { id: s2, text: "2" }
        - { id: s3, text: "3" }
answer:
  values: { sku: pzrs, create: empty, shares: s3 }
explanation:
  correct:
    en: |
      The SBD device is a Premium SSD shared disk. Premium_ZRS is the SKU for VMs spread across availability zones, because a zone-redundant disk can be attached to VMs in different zones. You create an empty disk, and maxShares must be at least the number of cluster nodes, so 3 for this three-node cluster.
    fr: |
      Le périphérique SBD est un disque partagé SSD Premium. Premium_ZRS est la référence pour des machines virtuelles réparties entre zones de disponibilité, car un disque redondant interzone peut être attaché à des machines virtuelles de zones différentes. Vous créez un disque vide, et maxShares doit être au moins égal au nombre de nœuds du cluster, soit 3 pour ce cluster à trois nœuds.
  options:
    plrs: { en: "Premium_LRS shared disks are for availability set deployments; an LRS disk lives in a single zone.", fr: "Les disques partagés Premium_LRS sont destinés aux déploiements en groupe à haute disponibilité ; un disque LRS réside dans une seule zone." }
    slrs: { en: "Microsoft's SBD guidance uses a Premium SSD shared disk, not Standard SSD.", fr: "Les recommandations SBD de Microsoft utilisent un disque partagé SSD Premium, pas un SSD Standard." }
    ultra: { en: "Microsoft's SBD guidance uses Premium SSD (Premium_LRS or Premium_ZRS), not Ultra Disk.", fr: "Les recommandations SBD de Microsoft utilisent un SSD Premium (Premium_LRS ou Premium_ZRS), pas un Disque Ultra." }
    copy: { en: "Copy creates a disk from an existing disk or snapshot; the SBD device starts as an empty disk.", fr: "Copy crée un disque à partir d'un disque ou d'un instantané existant ; le périphérique SBD est au départ un disque vide." }
    s2: { en: "With maxShares 2, the disk can't be attached to the third node.", fr: "Avec maxShares à 2, le disque ne peut pas être attaché au troisième nœud." }
references:
  - title: Set up Pacemaker on Red Hat Enterprise Linux in Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-rhel-pacemaker
