id: az120-3b-fence-choose-method
objective: "3.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders is deploying a two-node Pacemaker cluster on SLES 15 SP6 for SAP HANA. One node is in availability zone 1 and the other in availability zone 2.

    Northwind has the following requirements:

    - The cluster VMs must have no outbound connectivity to public endpoints, including Azure management endpoints.
    - The operations team must not have additional VMs to deploy and patch for the cluster.
    - The fencing configuration must be supported by Microsoft for SAP workloads.

    Which fencing configuration should you recommend?
  fr: |
    Northwind Traders déploie un cluster Pacemaker à deux nœuds sur SLES 15 SP6 pour SAP HANA. Un nœud se trouve dans la zone de disponibilité 1 et l'autre dans la zone de disponibilité 2.

    Northwind a les exigences suivantes :

    - Les machines virtuelles du cluster ne doivent avoir aucune connectivité sortante vers des points de terminaison publics, y compris les points de terminaison de gestion Azure.
    - L'équipe d'exploitation ne doit pas avoir de machines virtuelles supplémentaires à déployer et à corriger pour le cluster.
    - La configuration de clôture doit être prise en charge par Microsoft pour les charges de travail SAP.

    Quelle configuration de clôture devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "The Azure fence agent, with a system-assigned managed identity on each node", fr: "L'agent de clôture Azure, avec une identité managée affectée par le système sur chaque nœud" } }
    - { id: b, text: { en: "SBD with three iSCSI target servers, one in each availability zone", fr: "SBD avec trois serveurs cibles iSCSI, un dans chaque zone de disponibilité" } }
    - { id: c, text: { en: "SBD with one Premium_LRS Azure shared disk attached to both nodes", fr: "SBD avec un disque partagé Azure Premium_LRS attaché aux deux nœuds" } }
    - { id: d, text: { en: "SBD with one Premium_ZRS Azure shared disk attached to both nodes", fr: "SBD avec un disque partagé Azure Premium_ZRS attaché aux deux nœuds" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      SBD on an Azure shared disk needs no extra VMs and no outbound connectivity, because fencing goes through a block device attached to the nodes. With nodes in different availability zones, the shared disk must be zone-redundant, so Premium_ZRS is the supported choice.
    fr: |
      SBD sur un disque partagé Azure ne nécessite ni machine virtuelle supplémentaire ni connectivité sortante, car la clôture passe par un périphérique de blocs attaché aux nœuds. Avec des nœuds dans des zones de disponibilité différentes, le disque partagé doit être redondant interzone : Premium_ZRS est donc le choix pris en charge.
  options:
    a: { en: "The Azure fence agent needs outbound access to the public Azure management and Microsoft Entra endpoints, which the requirements forbid.", fr: "L'agent de clôture Azure a besoin d'un accès sortant aux points de terminaison publics de gestion Azure et de Microsoft Entra, ce que les exigences interdisent." }
    b: { en: "iSCSI target servers are three additional VMs to deploy and patch.", fr: "Les serveurs cibles iSCSI représentent trois machines virtuelles supplémentaires à déployer et à corriger." }
    c: { en: "A Premium_LRS shared disk is for availability sets; it can't be attached to VMs in two zones.", fr: "Un disque partagé Premium_LRS est destiné aux groupes à haute disponibilité ; il ne peut pas être attaché à des machines virtuelles situées dans deux zones." }
references:
  - title: Set up Pacemaker on SUSE Linux Enterprise Server in Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-pacemaker
