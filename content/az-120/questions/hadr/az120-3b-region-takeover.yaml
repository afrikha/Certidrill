id: az120-3b-region-takeover
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum replicates its production SAP HANA database from West Europe to North Europe by using asynchronous HANA System Replication with the logreplay operation mode. The SAP virtual networks use 10.10.0.0/16 in West Europe and 10.20.0.0/16 in North Europe.

    You are documenting how Adatum fails over the database to North Europe.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum réplique sa base de données SAP HANA de production de West Europe vers North Europe avec HANA System Replication asynchrone et le mode d'opération logreplay. Les réseaux virtuels SAP utilisent 10.10.0.0/16 dans West Europe et 10.20.0.0/16 dans North Europe.

    Vous documentez la façon dont Adatum bascule la base de données vers North Europe.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Pacemaker takes over to North Europe automatically when the West Europe nodes stop responding.", fr: "Pacemaker effectue automatiquement la prise de contrôle vers North Europe lorsque les nœuds de West Europe ne répondent plus." } }
    - { id: b, text: { en: "The takeover to North Europe is always started manually by an administrator.", fr: "La prise de contrôle vers North Europe est toujours lancée manuellement par un administrateur." } }
    - { id: c, text: { en: "With the logreplay operation mode, an unplanned takeover loses no committed transaction.", fr: "Avec le mode d'opération logreplay, une prise de contrôle non planifiée ne perd aucune transaction validée." } }
    - { id: d, text: { en: "Clients should reach the new primary through a name resolution change rather than a client configuration change.", fr: "Les clients doivent joindre le nouveau principal grâce à une modification de la résolution de noms plutôt que de la configuration des clients." } }
    - { id: e, text: { en: "The new primary keeps its West Europe IP address, so no client or DNS change is needed.", fr: "Le nouveau principal conserve son adresse IP de West Europe : aucune modification des clients ni du DNS n'est nécessaire." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Because committed data may not have reached the asynchronous secondary, failover between regions is always manual; even in a planned exercise, you first check that all committed data has arrived. The DR virtual network uses a different IP range, so Microsoft prefers changing name resolution to redirect clients over changing the HANA client configuration.
    fr: |
      Comme les données validées peuvent ne pas avoir atteint le secondaire asynchrone, le basculement entre régions est toujours manuel ; même lors d'un exercice planifié, vous vérifiez d'abord que toutes les données validées sont arrivées. Le réseau virtuel de reprise utilise une autre plage d'adresses IP : Microsoft préfère donc modifier la résolution de noms pour rediriger les clients plutôt que de modifier la configuration des clients HANA.
  options:
    a: { en: "Automatic failover isn't an option between regions, because data loss can't be excluded.", fr: "Le basculement automatique n'est pas possible entre régions, car une perte de données ne peut pas être exclue." }
    c: { en: "Asynchronous replication can't provide an RPO of zero, whatever the operation mode.", fr: "La réplication asynchrone ne peut pas fournir un RPO nul, quel que soit le mode d'opération." }
    e: { en: "The DR VM is in 10.20.0.0/16; its address differs from the West Europe address.", fr: "La machine virtuelle de reprise est dans 10.20.0.0/16 ; son adresse diffère de celle de West Europe." }
references:
  - title: SAP HANA availability across Azure regions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-availability-across-regions
