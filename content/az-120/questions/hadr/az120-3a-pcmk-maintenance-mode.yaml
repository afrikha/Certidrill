id: az120-3a-pcmk-maintenance-mode
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware runs SAP HANA with HANA System Replication in a two-node Pacemaker cluster on SLES. Administrators must apply a HANA configuration change that requires stopping and starting the HANA instances on both nodes. During the change, the cluster must neither stop, start nor move any resource, and no node must be fenced. HANA must stay where it runs now.

    What should you do before the change?
  fr: |
    Litware exécute SAP HANA avec la réplication du système SAP HANA dans un cluster Pacemaker à deux nœuds sur SLES. Les administrateurs doivent appliquer une modification de configuration HANA qui nécessite d'arrêter puis de démarrer les instances HANA sur les deux nœuds. Pendant la modification, le cluster ne doit ni arrêter, ni démarrer, ni déplacer de ressource, et aucun nœud ne doit être isolé. HANA doit rester là où il s'exécute actuellement.

    Que devez-vous faire avant la modification ?
body:
  options:
    - id: a
      text: "sudo crm configure property maintenance-mode=true"
    - id: b
      text: "sudo crm node standby on both nodes"
    - id: c
      text: "sudo crm configure property stonith-enabled=false"
    - id: d
      text: "sudo crm resource cleanup on the SAPHanaController resource"
answer: { optionId: a }
explanation:
  correct:
    en: In maintenance mode, Pacemaker stops managing and monitoring the resources, so it doesn't react when administrators stop and start HANA. After the change, you set maintenance-mode=false and check the status with crm_mon -r and SAPHanaSR-showAttr. Microsoft's guides use the same property when they create or change the HANA cluster resources.
    fr: En mode maintenance, Pacemaker cesse de gérer et de surveiller les ressources ; il ne réagit donc pas lorsque les administrateurs arrêtent et démarrent HANA. Après la modification, vous définissez maintenance-mode=false et vérifiez l'état avec crm_mon -r et SAPHanaSR-showAttr. Les guides de Microsoft utilisent la même propriété pour créer ou modifier les ressources HANA du cluster.
  options:
    b: { en: "Putting nodes in standby makes the cluster stop the resources on them, which is the opposite of the requirement.", fr: "Mettre les nœuds en veille fait arrêter leurs ressources par le cluster, soit l'inverse de l'exigence." }
    c: { en: "Disabling STONITH doesn't stop the cluster from reacting to the stopped instances, and it removes split-brain protection.", fr: "Désactiver STONITH n'empêche pas le cluster de réagir aux instances arrêtées, et supprime la protection contre le split-brain." }
    d: { en: "A cleanup clears the failure history of a resource; the cluster keeps managing HANA.", fr: "Un nettoyage efface l'historique des échecs d'une ressource ; le cluster continue de gérer HANA." }
references:
  - title: High availability for SAP HANA on Azure VMs on SLES
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability
