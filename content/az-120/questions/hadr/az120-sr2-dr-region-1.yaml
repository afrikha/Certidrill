id: az120-sr2-dr-region-1
objective: "3.2.1"
type: series_yesno
series: az120-sr2-dr-region
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: |
    You use Site Recovery for the application layer and rely on it to replicate the NFS mounts.
  fr: |
    Vous utilisez Site Recovery pour la couche Application et comptez sur lui pour répliquer les montages NFS.
body:
  solution:
    en: |
      You enable **Azure Site Recovery** replication to North Europe for the Web Dispatcher, application server and ASCS/ERS VMs, and you rely on this replication to copy **/sapmnt** and **/usr/sap/trans** with the VMs. You add a HANA VM in North Europe as a third HSR site in **asynchronous** mode.
    fr: |
      Vous activez la réplication **Azure Site Recovery** vers North Europe pour les machines virtuelles Web Dispatcher, de serveur d'applications et ASCS/ERS, et vous comptez sur cette réplication pour copier **/sapmnt** et **/usr/sap/trans** avec les machines virtuelles. Vous ajoutez dans North Europe une machine virtuelle HANA comme troisième site HSR en mode **asynchrone**.
answer: { value: false }
explanation:
  correct:
    en: |
      Site Recovery replicates VMs and their attached managed disks, but not NFS mounts. The Azure NetApp Files volumes that hold /sapmnt and /usr/sap/trans must be replicated separately, for example with Azure NetApp Files cross-region replication, so the shared directories would be missing after a failover.
    fr: |
      Site Recovery réplique les machines virtuelles et leurs disques managés attachés, mais pas les montages NFS. Les volumes Azure NetApp Files qui contiennent /sapmnt et /usr/sap/trans doivent être répliqués séparément, par exemple avec la réplication entre régions d'Azure NetApp Files : les répertoires partagés manqueraient après un basculement.
references:
  - title: Disaster Recovery recommendation for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-sap-guide
