id: az120-3b-asr-high-churn
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware runs SAP application server instances on VMs whose data disks are Premium SSD v2 disks. Litware plans to protect these VMs with Azure Site Recovery to another region.

    What should you do when you enable the replication?
  fr: |
    Litware exécute des instances de serveur d'applications SAP sur des machines virtuelles dont les disques de données sont des disques SSD Premium v2. Litware prévoit de protéger ces machines virtuelles avec Azure Site Recovery vers une autre région.

    Que devez-vous faire lorsque vous activez la réplication ?
body:
  options:
    - { id: a, text: { en: "Select the Normal Churn option, and switch to High Churn after the initial replication.", fr: "Sélectionner l'option Normal Churn, et passer à High Churn après la réplication initiale." } }
    - { id: b, text: { en: "Enable host caching on the Premium SSD v2 disks before you enable the replication.", fr: "Activer la mise en cache de l'hôte sur les disques SSD Premium v2 avant d'activer la réplication." } }
    - { id: c, text: { en: "Convert the Premium SSD v2 disks to Ultra Disk before you enable the replication.", fr: "Convertir les disques SSD Premium v2 en Disques Ultra avant d'activer la réplication." } }
    - { id: d, text: { en: "Select the High Churn option for the VMs when you enable the replication.", fr: "Sélectionner l'option High Churn pour les machines virtuelles lors de l'activation de la réplication." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Site Recovery supports Premium SSD v2 disks only with High Churn, which must be selected when replication is enabled. The source PremiumV2_LRS disks replicate to Premium_LRS replica disks and fail over to PremiumV2_LRS.
    fr: |
      Site Recovery ne prend en charge les disques SSD Premium v2 qu'avec High Churn, qui doit être sélectionné lors de l'activation de la réplication. Les disques sources PremiumV2_LRS sont répliqués vers des disques réplicas Premium_LRS et basculent vers PremiumV2_LRS.
  options:
    a: { en: "High Churn is required for Premium SSD v2 and must be chosen when replication is enabled.", fr: "High Churn est obligatoire pour les SSD Premium v2 et doit être choisi lors de l'activation de la réplication." }
    b: { en: "Host caching isn't supported for Premium SSD v2 disks.", fr: "La mise en cache de l'hôte n'est pas prise en charge pour les disques SSD Premium v2." }
    c: { en: "Ultra Disk also requires High Churn; converting the disks adds effort and doesn't remove the requirement.", fr: "Le Disque Ultra exige aussi High Churn ; convertir les disques ajoute de l'effort sans supprimer l'exigence." }
references:
  - title: Support matrix for Azure VM disaster recovery between Azure regions
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-support-matrix
