id: az120-3a-pcmk-startup-delay
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum is building a two-node Pacemaker cluster on RHEL 9 for SAP HANA. The cluster uses the Azure fence agent; SBD isn't configured. Adatum wants to follow Microsoft's guidance so that, after a node is fenced and restarts, Pacemaker doesn't start immediately at boot but only after a delay.

    What should you configure on the nodes?
  fr: |
    Adatum crée un cluster Pacemaker à deux nœuds sur RHEL 9 pour SAP HANA. Le cluster utilise l'agent de clôture Azure ; SBD n'est pas configuré. Adatum veut suivre les recommandations de Microsoft pour que, après l'isolation et le redémarrage d'un nœud, Pacemaker ne démarre pas immédiatement au démarrage du système mais seulement après un délai.

    Que devez-vous configurer sur les nœuds ?
body:
  options:
    - id: a
      text: { en: "Set SBD_DELAY_START=yes in /etc/sysconfig/sbd, and restart the sbd service.", fr: "Définir SBD_DELAY_START=yes dans /etc/sysconfig/sbd, et redémarrer le service sbd." }
    - id: b
      text: { en: "Set pcmk_reboot_timeout=900 on the fencing resource, and restart the cluster.", fr: "Définir pcmk_reboot_timeout=900 sur la ressource d'isolation, et redémarrer le cluster." }
    - id: c
      text: { en: "Set the corosync totem token to 60000, and reload corosync on both nodes.", fr: "Définir le jeton totem de corosync sur 60000, et recharger corosync sur les deux nœuds." }
    - id: d
      text: { en: "Enable a pacemaker systemd timer with OnBootSec, and run pcs cluster disable --all.", fr: "Activer un minuteur systemd pacemaker avec OnBootSec, et exécuter pcs cluster disable --all." }
answer: { optionId: d }
explanation:
  correct:
    en: Microsoft's guidance creates a pacemaker.timer unit with an OnBootSec delay and enables it, then disables the direct start of the cluster services with pcs cluster disable --all. After a reboot, the timer starts Pacemaker only once the delay has elapsed.
    fr: Les recommandations de Microsoft créent une unité pacemaker.timer avec un délai OnBootSec et l'activent, puis désactivent le démarrage direct des services de cluster avec pcs cluster disable --all. Après un redémarrage, le minuteur ne démarre Pacemaker qu'une fois le délai écoulé.
  options:
    a: { en: "SBD_DELAY_START is a setting of the SBD daemon, which this cluster doesn't use.", fr: "SBD_DELAY_START est un paramètre du démon SBD, que ce cluster n'utilise pas." }
    b: { en: "pcmk_reboot_timeout is the time allowed for a fencing reboot operation; it doesn't delay Pacemaker at boot.", fr: "pcmk_reboot_timeout est le temps accordé à une opération de redémarrage d'isolation ; il ne retarde pas Pacemaker au démarrage." }
    c: { en: "The token timeout controls how fast a lost node is detected; Microsoft's value is 30000, and it doesn't delay the start of Pacemaker.", fr: "Le délai du jeton contrôle la rapidité de détection d'un nœud perdu ; la valeur de Microsoft est 30000, et il ne retarde pas le démarrage de Pacemaker." }
references:
  - title: Set up Pacemaker on RHEL in Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-rhel-pacemaker
