id: az120-3b-asr-support-statements
objective: "3.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys plans to protect the VMs of its SAP application layer with Azure Site Recovery between two Azure regions. Some VMs are M-series VMs with Write Accelerator enabled on a disk, and some VMs are deployed in a proximity placement group.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit de protéger les machines virtuelles de sa couche Application SAP avec Azure Site Recovery entre deux régions Azure. Certaines machines virtuelles sont de série M avec l'accélérateur d'écriture activé sur un disque, et certaines machines virtuelles sont déployées dans un groupe de placement de proximité.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Write Accelerator must be disabled on a VM before you enable its replication.
        fr: L'accélérateur d'écriture doit être désactivé sur une machine virtuelle avant d'activer sa réplication.
    - id: s2
      text:
        en: Site Recovery can protect VMs that are deployed in a proximity placement group.
        fr: Site Recovery peut protéger des machines virtuelles déployées dans un groupe de placement de proximité.
    - id: s3
      text:
        en: Site Recovery can protect a VM that uses an ephemeral OS disk.
        fr: Site Recovery peut protéger une machine virtuelle qui utilise un disque de système d'exploitation éphémère.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Write Accelerator isn't supported during protection: you disable it before enabling replication and can re-enable it manually after failover on a supported M-series VM. VMs inside proximity placement groups can be protected. Ephemeral OS disks aren't supported by Site Recovery.
    fr: |
      L'accélérateur d'écriture n'est pas pris en charge pendant la protection : vous le désactivez avant d'activer la réplication et pouvez le réactiver manuellement après le basculement sur une machine virtuelle de série M prise en charge. Les machines virtuelles d'un groupe de placement de proximité peuvent être protégées. Les disques de système d'exploitation éphémères ne sont pas pris en charge par Site Recovery.
references:
  - title: Support matrix for Azure VM disaster recovery between Azure regions
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-support-matrix
