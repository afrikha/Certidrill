id: az120-3c-bk-strategy-statements
objective: "3.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin is sizing the Azure Backup design for an SAP HANA 2.0 database that runs on an M-series VM with 208 vCPUs and 2.8 TB of memory. The database is 9 TB. A new Recovery Services vault named **rsv-sap** uses the default storage redundancy.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dimensionne la conception Sauvegarde Azure d'une base de données SAP HANA 2.0 qui s'exécute sur une machine virtuelle de série M avec 208 processeurs virtuels et 2,8 To de mémoire. La base de données fait 9 To. Un nouveau coffre Recovery Services nommé **rsv-sap** utilise la redondance de stockage par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Multistreaming with the parallel_data_backup_backint_channels parameter can increase the throughput of the full backups of this database.
        fr: Le multistreaming avec le paramètre parallel_data_backup_backint_channels peut augmenter le débit des sauvegardes complètes de cette base de données.
    - id: s2
      text:
        en: After the database is protected, you can change rsv-sap from GRS to LRS in the vault's Backup Configuration to reduce costs.
        fr: Une fois la base de données protégée, vous pouvez faire passer rsv-sap de GRS à LRS dans la configuration de sauvegarde du coffre pour réduire les coûts.
    - id: s3
      text:
        en: Azure Backup for SAP HANA supports this database size.
        fr: Sauvegarde Azure pour SAP HANA prend en charge cette taille de base de données.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Multistreaming applies to data backups larger than 128 GB on VMs with at least 16 vCPUs and 128 GB of RAM, and raises throughput up to 1.5 GBps with up to 32 channels. The storage replication type of a vault can be changed only before a backup is configured; afterwards the option is disabled. Azure Backup supports SAP HANA databases up to 40 TB (database size, not memory size).
    fr: Le multistreaming s'applique aux sauvegardes de données de plus de 128 Go sur des machines virtuelles d'au moins 16 processeurs virtuels et 128 Go de RAM, et porte le débit jusqu'à 1,5 Go/s avec jusqu'à 32 canaux. Le type de réplication du stockage d'un coffre ne peut être modifié qu'avant la configuration d'une sauvegarde ; ensuite, l'option est désactivée. Sauvegarde Azure prend en charge les bases SAP HANA jusqu'à 40 To (taille de la base, pas de la mémoire).
references:
  - title: SAP HANA Backup support matrix
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-backup-support-matrix
  - title: Create and configure Recovery Services vaults
    url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
