id: az120-3b-repl-storage-hotarea
objective: "3.1.8"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    Contoso is deploying an SAP S/4HANA system on Linux VMs across availability zones 1 and 2 of a region that supports zone-redundant storage. Contoso evaluates the storage options in the following table for the shared file systems of the system.

    Answer each prompt by selecting the storage that meets the requirement.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso déploie un système SAP S/4HANA sur des machines virtuelles Linux réparties entre les zones de disponibilité 1 et 2 d'une région qui prend en charge le stockage redondant interzone. Contoso évalue les options de stockage du tableau suivant pour les systèmes de fichiers partagés du système.

    Répondez à chaque consigne en sélectionnant le stockage qui répond à l'exigence.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "/sapmnt must be replicated synchronously across zones, transparently to the NFS clients.", fr: "/sapmnt doit être répliqué de manière synchrone entre zones, de façon transparente pour les clients NFS." }
    - id: p2
      text: { en: "/usr/sap/trans must be replicated asynchronously to a volume in another zone, with a manual failover.", fr: "/usr/sap/trans doit être répliqué de manière asynchrone vers un volume d'une autre zone, avec un basculement manuel." }
  grid:
    header: [{ en: "Storage", fr: "Stockage" }, { en: "Type", fr: "Type" }]
    rows:
      - [{ text: { en: "Premium SSD v2", fr: "SSD Premium v2" }, area: pv2 }, { text: { en: "Managed disk", fr: "Disque managé" } }]
      - [{ text: { en: "Ultra Disk", fr: "Disque Ultra" }, area: ultra }, { text: { en: "Managed disk", fr: "Disque managé" } }]
      - [{ text: { en: "Premium SSD (Premium_ZRS)", fr: "SSD Premium (Premium_ZRS)" }, area: pzrs }, { text: { en: "Managed disk", fr: "Disque managé" } }]
      - [{ text: { en: "Azure Files SSD with ZRS", fr: "Azure Files SSD avec ZRS" }, area: afs }, { text: { en: "NFS share", fr: "Partage NFS" } }]
      - [{ text: "Azure NetApp Files", area: anf }, { text: { en: "NFS volume", fr: "Volume NFS" } }]
answer:
  values: { p1: afs, p2: anf }
explanation:
  correct:
    en: |
      Azure Files SSD with ZRS replicates the share synchronously across zones, and Microsoft fully supports zone-redundant NFS shares for the SAP application layer and central services clusters. Azure NetApp Files cross-zone replication copies a volume asynchronously to a destination volume in another zone; the destination stays read-only until you break the replication peering, which is a manual failover.
    fr: |
      Azure Files SSD avec ZRS réplique le partage de manière synchrone entre zones, et Microsoft prend entièrement en charge les partages NFS redondants interzone pour la couche Application SAP et les clusters des services centraux. La réplication entre zones d'Azure NetApp Files copie un volume de manière asynchrone vers un volume de destination d'une autre zone ; la destination reste en lecture seule jusqu'à ce que vous interrompiez le peering de réplication, ce qui constitue un basculement manuel.
  options:
    pv2: { en: "Premium SSD v2 is LRS only and offers no replication across zones.", fr: "Le SSD Premium v2 est uniquement LRS et n'offre aucune réplication entre zones." }
    ultra: { en: "Ultra Disk is LRS only and offers no replication across zones.", fr: "Le Disque Ultra est uniquement LRS et n'offre aucune réplication entre zones." }
    pzrs: { en: "A ZRS managed disk is a block device, not an NFS share that several VMs mount.", fr: "Un disque managé ZRS est un périphérique de blocs, pas un partage NFS que plusieurs machines virtuelles montent." }
references:
  - title: SAP workload configurations with Azure Availability Zones
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones
  - title: Understand Azure NetApp Files replication
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/cross-zone-replication-introduction
