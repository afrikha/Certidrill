id: az120-3a-sla-composite
objective: "3.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware plans an SAP NetWeaver system on Azure with the following infrastructure:

    | Layer | Deployment | Azure SLA |
    | --- | --- | --- |
    | Application servers | Two VMs in an availability set | 99.95% |
    | ASCS/SCS | One VM with Premium SSD disks | 99.9% |
    | DBMS | One VM with Premium SSD disks | 99.9% |

    The system is unavailable if any layer is unavailable. Use a 30-day month (43,200 minutes).

    You need to estimate the availability of the whole system from the Azure SLAs.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit un système SAP NetWeaver sur Azure avec l'infrastructure suivante :

    | Couche | Déploiement | SLA Azure |
    | --- | --- | --- |
    | Serveurs d'applications | Deux machines virtuelles dans un groupe à haute disponibilité | 99,95 % |
    | ASCS/SCS | Une machine virtuelle avec des disques SSD Premium | 99,9 % |
    | SGBD | Une machine virtuelle avec des disques SSD Premium | 99,9 % |

    Le système est indisponible dès qu'une couche est indisponible. Utilisez un mois de 30 jours (43 200 minutes).

    Vous devez estimer la disponibilité de l'ensemble du système à partir des SLA Azure.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The composite availability of the system is approximately [[comp]].

      The maximum downtime per month covered by this composite figure is approximately [[down]].
    fr: |
      La disponibilité composite du système est d'environ [[comp]].

      L'indisponibilité mensuelle maximale correspondant à ce chiffre composite est d'environ [[down]].
  slots:
    - id: comp
      options:
        - { id: c9995, text: { en: "99.95%", fr: "99,95 %" } }
        - { id: c999, text: { en: "99.9%", fr: "99,9 %" } }
        - { id: c9975, text: { en: "99.75%", fr: "99,75 %" } }
        - { id: c996, text: { en: "99.6%", fr: "99,6 %" } }
    - id: down
      options:
        - { id: m22, text: { en: "21.6 minutes", fr: "21,6 minutes" } }
        - { id: m43, text: { en: "43.2 minutes", fr: "43,2 minutes" } }
        - { id: m108, text: { en: "108 minutes", fr: "108 minutes" } }
        - { id: m216, text: { en: "216 minutes", fr: "216 minutes" } }
answer:
  values: { comp: c9975, down: m108 }
explanation:
  correct:
    en: Serial dependencies multiply their availabilities, so 0.9995 x 0.999 x 0.999 is about 0.9975, or 99.75%, which is lower than any individual SLA. The remaining 0.25% of 43,200 minutes is 108 minutes of possible downtime per month. Clustering the ASCS/SCS and DBMS layers is how you raise this figure.
    fr: "Les dépendances en série multiplient leurs disponibilités : 0,9995 x 0,999 x 0,999 donne environ 0,9975, soit 99,75 %, ce qui est inférieur à chaque SLA pris isolément. Les 0,25 % restants de 43 200 minutes représentent 108 minutes d'indisponibilité possible par mois. La mise en cluster des couches ASCS/SCS et SGBD permet d'améliorer ce chiffre."
  options:
    c9995: { en: "99.95% is the SLA of the application layer alone; the two single VMs lower the composite figure.", fr: "99,95 % est le SLA de la seule couche d'applications ; les deux machines virtuelles uniques abaissent le chiffre composite." }
    c999: { en: "A composite of serial components is always lower than its weakest component (99.9%).", fr: "La disponibilité composite de composants en série est toujours inférieure à celle du composant le plus faible (99,9 %)." }
    m43: { en: "43.2 minutes corresponds to 99.9%, the SLA of a single layer.", fr: "43,2 minutes correspondent à 99,9 %, le SLA d'une seule couche." }
references:
  - title: Azure VMs HA architecture and scenarios for SAP NetWeaver
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-high-availability-architecture-scenarios
