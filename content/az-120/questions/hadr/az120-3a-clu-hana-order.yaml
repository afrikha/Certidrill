id: az120-3a-clu-hana-order
objective: "3.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has deployed two SLES for SAP VMs named **hn1-db-0** and **hn1-db-1** with a Standard internal load balancer. A Pacemaker cluster with fencing is already configured on both VMs. SAP HANA isn't installed yet.

    You need to configure SAP HANA scale-up with HANA System Replication and automatic failover managed by the cluster.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam a déployé deux machines virtuelles SLES for SAP nommées **hn1-db-0** et **hn1-db-1** avec un équilibreur de charge interne Standard. Un cluster Pacemaker avec isolation est déjà configuré sur les deux machines virtuelles. SAP HANA n'est pas encore installé.

    Vous devez configurer SAP HANA en scale-up avec la réplication du système SAP HANA et un basculement automatique géré par le cluster.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: install, text: { en: "Install SAP HANA on both VMs.", fr: "Installer SAP HANA sur les deux machines virtuelles." } }
    - { id: hsr, text: { en: "Enable system replication on hn1-db-0 and register hn1-db-1 as the secondary.", fr: "Activer la réplication système sur hn1-db-0 et enregistrer hn1-db-1 comme secondaire." } }
    - { id: hooks, text: { en: "Configure the HA/DR provider hooks in global.ini and the sudoers entries on both VMs.", fr: "Configurer les hooks de fournisseur HA/DR dans global.ini et les entrées sudoers sur les deux machines virtuelles." } }
    - { id: rsc, text: { en: "Put the cluster in maintenance mode and create the SAPHanaTopology and SAPHanaController resources.", fr: "Placer le cluster en mode maintenance et créer les ressources SAPHanaTopology et SAPHanaController." } }
    - { id: ers, text: { en: "Install the ERS instance on hn1-db-1.", fr: "Installer l'instance ERS sur hn1-db-1." } }
    - { id: asr, text: { en: "Enable Azure Site Recovery replication for both VMs.", fr: "Activer la réplication Azure Site Recovery pour les deux machines virtuelles." } }
answer:
  sequence: [ install, hsr, hooks, rsc ]
explanation:
  correct:
    en: HANA must be installed before system replication can be enabled on the primary (hdbnsutil -sr_enable) and the secondary registered (hdbnsutil -sr_register). The hooks (susHanaSR, susChkSrv) are then added while HANA is stopped, and verified after restart. Finally, in maintenance mode, you create the cluster resources and constraints, then leave maintenance mode.
    fr: HANA doit être installé avant d'activer la réplication système sur le principal (hdbnsutil -sr_enable) et d'enregistrer le secondaire (hdbnsutil -sr_register). Les hooks (susHanaSR, susChkSrv) sont ensuite ajoutés pendant que HANA est arrêté, puis vérifiés après le redémarrage. Enfin, en mode maintenance, vous créez les ressources et contraintes du cluster, puis vous quittez le mode maintenance.
  options:
    ers: { en: "ERS belongs to the ASCS/ERS cluster of the application layer, not to the HANA database cluster.", fr: "L'ERS appartient au cluster ASCS/ERS de la couche d'applications, pas au cluster de la base de données HANA." }
    asr: { en: "Site Recovery is a disaster recovery tool for other regions or zones; it isn't part of HANA high availability within the cluster.", fr: "Site Recovery est un outil de reprise d'activité vers d'autres régions ou zones ; il ne fait pas partie de la haute disponibilité HANA au sein du cluster." }
references:
  - title: High availability for SAP HANA on Azure VMs on SLES
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability
