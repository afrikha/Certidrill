id: az120-3a-zones-latency-tool
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum is choosing two of the three availability zones of an Azure region for a zonal SAP deployment. Test VMs of the database VM size are deployed in each zone with Accelerated Networking enabled.

    You need to measure the network round-trip latency between the test VMs in the way that Microsoft recommends for SAP.

    Which tool should you use?
  fr: |
    Adatum choisit deux des trois zones de disponibilité d'une région Azure pour un déploiement SAP zonal. Des machines virtuelles de test de la taille de la machine virtuelle de base de données sont déployées dans chaque zone avec la mise en réseau accélérée activée.

    Vous devez mesurer la latence réseau aller-retour entre les machines virtuelles de test de la manière recommandée par Microsoft pour SAP.

    Quel outil devez-vous utiliser ?
body:
  options:
    - id: a
      text: ping
    - id: b
      text: traceroute
    - id: c
      text: { en: "Network Watcher IP flow verify", fr: "Vérification des flux IP de Network Watcher" }
    - id: d
      text: niping
answer: { optionId: d }
explanation:
  correct:
    en: Microsoft recommends the SAP tool niping (SAP Notes 500235 and 1100926) to measure latency between zones, or the AvZone-Latency-Test script that automates the measurements. Results are valid for the subscription used, because the mapping of logical zones to datacenters differs between subscriptions.
    fr: Microsoft recommande l'outil SAP niping (notes SAP 500235 et 1100926) pour mesurer la latence entre les zones, ou le script AvZone-Latency-Test qui automatise les mesures. Les résultats valent pour l'abonnement utilisé, car la correspondance entre zones logiques et centres de données diffère d'un abonnement à l'autre.
  options:
    a: { en: "ping doesn't use the Accelerated Networking code paths, so Microsoft doesn't recommend it for these measurements.", fr: "ping n'emprunte pas les chemins de code de la mise en réseau accélérée ; Microsoft ne le recommande donc pas pour ces mesures." }
    c: { en: "IP flow verify checks whether NSG rules allow a packet; it doesn't measure latency.", fr: "La vérification des flux IP contrôle si les règles NSG autorisent un paquet ; elle ne mesure pas la latence." }
    b: { en: "traceroute shows the path of packets, not the application-level round-trip latency that SAP guidance relies on.", fr: "traceroute montre le chemin des paquets, pas la latence aller-retour au niveau applicatif sur laquelle s'appuient les recommandations SAP." }
references:
  - title: SAP workload configurations with Azure Availability Zones
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones
