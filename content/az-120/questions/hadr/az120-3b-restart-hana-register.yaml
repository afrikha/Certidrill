id: az120-3b-restart-hana-register
objective: "3.1.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware runs SAP HANA (SID **HN1**) with HANA System Replication in a two-node Pacemaker cluster on SLES that uses the Azure fence agent. The SAPHanaController resource is configured with `AUTOMATED_REGISTER="false"`.

    The HANA instance on the primary node **hn1-db-0** crashed. The cluster promoted **hn1-db-1** to primary, and hn1-db-0 wasn't fenced. The HANA instance on hn1-db-0 is stopped.

    You need to restart HANA on hn1-db-0 as the new secondary.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware exécute SAP HANA (SID **HN1**) avec HANA System Replication dans un cluster Pacemaker à deux nœuds sur SLES qui utilise l'agent de clôture Azure. La ressource SAPHanaController est configurée avec `AUTOMATED_REGISTER="false"`.

    L'instance HANA du nœud principal **hn1-db-0** a planté. Le cluster a promu **hn1-db-1** comme principal, et hn1-db-0 n'a pas fait l'objet d'une clôture. L'instance HANA de hn1-db-0 est arrêtée.

    Vous devez redémarrer HANA sur hn1-db-0 comme nouveau secondaire.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "On hn1-db-0, run hdbnsutil -sr_register with hn1-db-1 as the remote host, as hn1adm.", fr: "Sur hn1-db-0, exécuter hdbnsutil -sr_register avec hn1-db-1 comme hôte distant, en tant que hn1adm." } }
    - { id: b, text: { en: "On hn1-db-0, run hdbnsutil -sr_takeover, as hn1adm.", fr: "Sur hn1-db-0, exécuter hdbnsutil -sr_takeover, en tant que hn1adm." } }
    - { id: c, text: { en: "Run crm resource cleanup for the HANA promotable clone resource on hn1-db-0, as root.", fr: "Exécuter crm resource cleanup pour la ressource clone promouvable HANA sur hn1-db-0, en tant que root." } }
    - { id: d, text: { en: "Clear the SBD slot of hn1-db-0 with sbd message clear, as root.", fr: "Effacer l'emplacement SBD de hn1-db-0 avec sbd message clear, en tant que root." } }
    - { id: e, text: { en: "Add Autostart = 1 to the HANA instance profile on hn1-db-0, and restart the VM.", fr: "Ajouter Autostart = 1 dans le profil de l'instance HANA sur hn1-db-0, et redémarrer la machine virtuelle." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      With AUTOMATED_REGISTER set to false, the cluster leaves the former primary stopped so that you can check it. You register it as secondary of the new primary with hdbnsutil -sr_register (remote host hn1-db-1), then clean up the failed state of the HANA resource on hn1-db-0 with crm resource cleanup, and Pacemaker starts it as the secondary.
    fr: |
      Avec AUTOMATED_REGISTER défini sur false, le cluster laisse l'ancien principal arrêté pour que vous puissiez le vérifier. Vous l'enregistrez comme secondaire du nouveau principal avec hdbnsutil -sr_register (hôte distant hn1-db-1), puis vous nettoyez l'état d'échec de la ressource HANA sur hn1-db-0 avec crm resource cleanup, et Pacemaker le démarre comme secondaire.
  options:
    b: { en: "A takeover would make hn1-db-0 primary again and create a second primary next to hn1-db-1.", fr: "Une prise de contrôle referait de hn1-db-0 un principal et créerait un second principal à côté de hn1-db-1." }
    d: { en: "SBD messages must be cleared only after an SBD fencing; this cluster uses the Azure fence agent and the node wasn't fenced.", fr: "Les messages SBD ne doivent être effacés qu'après une clôture SBD ; ce cluster utilise l'agent de clôture Azure et le nœud n'a pas fait l'objet d'une clôture." }
    e: { en: "In an HSR cluster, Pacemaker starts HANA; an automatic start outside the cluster could start a second primary.", fr: "Dans un cluster HSR, c'est Pacemaker qui démarre HANA ; un démarrage automatique hors cluster pourrait démarrer un second principal." }
references:
  - title: High availability for SAP HANA on Azure VMs on SUSE Linux Enterprise Server
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability
