id: az120-3c-bk-method-match
objective: "3.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip is defining the backup method of each component of its SAP landscape on Azure.

    Which method should you use for each requirement? To answer, drag the appropriate methods to the correct requirements. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip définit la méthode de sauvegarde de chaque composant de son paysage SAP sur Azure.

    Quelle méthode devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les méthodes appropriées vers les exigences correspondantes. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: backint, text: { en: "Azure Backup for SAP HANA (streaming)", fr: "Sauvegarde Azure pour SAP HANA (streaming)" } }
    - { id: azacsnap, text: AzAcSnap }
    - { id: vmenh, text: { en: "Azure VM backup, Enhanced policy", fr: "Sauvegarde de machine virtuelle Azure, stratégie Enhanced" } }
    - { id: asr, text: Azure Site Recovery }
    - { id: anfcrr, text: { en: "Azure NetApp Files cross-region replication", fr: "Réplication interrégion Azure NetApp Files" } }
  targets:
    - id: t1
      text: { en: "HANA database on managed disks: point-in-time restore from a vault, with recovery points kept for 10 years", fr: "Base HANA sur disques managés : restauration à un point dans le temps depuis un coffre, avec des points de récupération conservés 10 ans" }
    - id: t2
      text: { en: "HANA database on Azure NetApp Files: application-consistent storage snapshots recorded in the HANA backup catalog", fr: "Base HANA sur Azure NetApp Files : instantanés de stockage cohérents avec l'application, inscrits dans le catalogue de sauvegarde HANA" }
    - id: t3
      text: { en: "Application server VMs with Premium SSD v2 disks: several backups per day", fr: "Machines virtuelles de serveurs d'applications avec disques SSD Premium v2 : plusieurs sauvegardes par jour" }
answer:
  mapping: { t1: backint, t2: azacsnap, t3: vmenh }
explanation:
  correct:
    en: Azure Backup for SAP HANA streams full, delta and log backups through the certified Backint interface to a vault, with point-in-time restore and long-term retention. AzAcSnap puts HANA in a consistent state, takes Azure NetApp Files snapshots and keeps the HANA backup catalog up to date. The Enhanced VM policy supports Premium SSD v2 and backups every 4 hours or more.
    fr: Sauvegarde Azure pour SAP HANA transfère en streaming les sauvegardes complètes, delta et de journaux vers un coffre via l'interface Backint certifiée, avec restauration à un point dans le temps et rétention à long terme. AzAcSnap met HANA dans un état cohérent, prend des instantanés Azure NetApp Files et tient à jour le catalogue de sauvegarde HANA. La stratégie de machine virtuelle Enhanced prend en charge le SSD Premium v2 et des sauvegardes toutes les 4 heures ou plus.
  options:
    asr: { en: "Site Recovery replicates VMs for disaster recovery; it isn't a backup with long-term recovery points.", fr: "Site Recovery réplique des machines virtuelles pour la reprise d'activité ; ce n'est pas une sauvegarde avec des points de récupération à long terme." }
    anfcrr: { en: "Cross-region replication copies volumes to another region for DR; it doesn't make HANA consistent or update its catalog.", fr: "La réplication interrégion copie des volumes vers une autre région pour la reprise ; elle ne rend pas HANA cohérent et ne met pas à jour son catalogue." }
references:
  - title: About SAP HANA database backup on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-about
  - title: Back up Azure VMs with the Enhanced policy
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy
