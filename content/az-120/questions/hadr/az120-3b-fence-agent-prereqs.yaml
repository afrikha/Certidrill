id: az120-3b-fence-agent-prereqs
objective: "3.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is building a two-node Pacemaker cluster on RHEL 9 for SAP HANA. The two VMs are in the backend pool of an internal Standard load balancer and have no public IP address. Their subnet has no NAT gateway and no other outbound internet connectivity.

    You plan to use the Azure fence agent with managed identities, as recommended by Microsoft.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys crée un cluster Pacemaker à deux nœuds sur RHEL 9 pour SAP HANA. Les deux machines virtuelles se trouvent dans le pool principal d'un équilibreur de charge interne Standard et n'ont pas d'adresse IP publique. Leur sous-réseau n'a ni passerelle NAT ni aucune autre connectivité Internet sortante.

    Vous prévoyez d'utiliser l'agent de clôture Azure avec des identités managées, comme le recommande Microsoft.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create one user-assigned managed identity, assign it to both VMs, and grant it the fence agent role.", fr: "Créer une identité managée affectée par l'utilisateur, l'attribuer aux deux machines virtuelles et lui accorder le rôle de l'agent de clôture." } }
    - { id: b, text: { en: "Enable a system-assigned managed identity on each VM, and grant each identity the fence agent role on both VMs.", fr: "Activer une identité managée affectée par le système sur chaque machine virtuelle, et accorder à chaque identité le rôle de l'agent de clôture sur les deux machines virtuelles." } }
    - { id: c, text: { en: "Deploy three iSCSI target server VMs in the same region, and connect both nodes to them.", fr: "Déployer trois machines virtuelles de serveur cible iSCSI dans la même région, et y connecter les deux nœuds." } }
    - { id: d, text: { en: "Provide outbound connectivity to the Azure public endpoints, for example by adding a NAT gateway to the subnet.", fr: "Fournir une connectivité sortante vers les points de terminaison publics Azure, par exemple en ajoutant une passerelle NAT au sous-réseau." } }
    - { id: e, text: { en: "Load the softdog module on both nodes, and set SBD_PACEMAKER=yes in /etc/sysconfig/sbd.", fr: "Charger le module softdog sur les deux nœuds, et définir SBD_PACEMAKER=yes dans /etc/sysconfig/sbd." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The Azure fence agent authenticates with a system-assigned managed identity on each cluster VM, and each identity needs the custom fence role on every VM of the cluster, including its own. The agent calls Azure Resource Manager and Microsoft Entra ID through public endpoints, and VMs behind an internal Standard load balancer have no outbound access, so you must provide it (NAT gateway, public load balancer for outbound, or firewall).
    fr: |
      L'agent de clôture Azure s'authentifie avec une identité managée affectée par le système sur chaque machine virtuelle du cluster, et chaque identité a besoin du rôle personnalisé de clôture sur toutes les machines virtuelles du cluster, y compris la sienne. L'agent appelle Azure Resource Manager et Microsoft Entra ID par des points de terminaison publics, et les machines virtuelles derrière un équilibreur de charge interne Standard n'ont pas d'accès sortant : vous devez donc le fournir (passerelle NAT, équilibreur de charge public pour le trafic sortant ou pare-feu).
  options:
    a: { en: "User-assigned managed identities aren't supported by the Azure fence agent.", fr: "Les identités managées affectées par l'utilisateur ne sont pas prises en charge par l'agent de clôture Azure." }
    c: { en: "iSCSI target servers provide SBD devices; they aren't used by the Azure fence agent.", fr: "Les serveurs cibles iSCSI fournissent des périphériques SBD ; l'agent de clôture Azure ne les utilise pas." }
    e: { en: "The softdog watchdog and the sbd configuration file belong to SBD fencing, not to the Azure fence agent.", fr: "Le watchdog softdog et le fichier de configuration sbd relèvent de la clôture SBD, pas de l'agent de clôture Azure." }
references:
  - title: Set up Pacemaker on Red Hat Enterprise Linux in Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-rhel-pacemaker
