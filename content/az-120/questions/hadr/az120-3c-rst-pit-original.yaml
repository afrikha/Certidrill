id: az120-3c-rst-pit-original
objective: "3.2.7"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Tailspin protects the standalone SAP HANA database of its production system **PRD** with Azure Backup streaming backups: a daily full backup and log backups every 15 minutes.

    At 10:43 today, a faulty transport deleted business data. You need to return PRD itself to its state of 10:42:00 today.

    How should you configure the restore? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin protège la base de données SAP HANA autonome de son système de production **PRD** avec des sauvegardes en streaming de Sauvegarde Azure : une sauvegarde complète quotidienne et des sauvegardes de journaux toutes les 15 minutes.

    À 10:43 aujourd'hui, un transport défectueux a supprimé des données métier. Vous devez ramener PRD lui-même à son état de 10:42:00 aujourd'hui.

    Comment devez-vous configurer la restauration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Restore point type: [[rp]]

      Where to restore: [[loc]]
    fr: |
      Type de point de restauration : [[rp]]

      Emplacement de la restauration : [[loc]]
  slots:
    - id: rp
      options:
        - { id: full, text: "Full & Differential" }
        - { id: logs, text: "Logs (Point in Time)" }
        - { id: snap, text: { en: "HANA instance snapshot", fr: "Instantané d'instance HANA" } }
    - id: loc
      options:
        - { id: alt, text: { en: "Alternate location", fr: "Autre emplacement" } }
        - { id: orig, text: { en: "Original location", fr: "Emplacement d'origine" } }
        - { id: files, text: { en: "Restore as files", fr: "Restaurer en tant que fichiers" } }
answer:
  values: { rp: logs, loc: orig }
explanation:
  correct:
    en: |
      Logs (Point in Time) restores to a specific second; Azure Backup selects the required full, differential and log backups. Original location restores to the same instance and overwrites PRD, which is what the scenario requires.
    fr: |
      Logs (Point in Time) restaure à une seconde précise ; Sauvegarde Azure sélectionne les sauvegardes complètes, différentielles et de journaux nécessaires. L'emplacement d'origine restaure sur la même instance et remplace PRD, ce que demande le scénario.
  options:
    full: { en: "A full recovery point returns to the time of last night's full backup and loses this morning's data.", fr: "Un point de récupération complet ramène à l'heure de la sauvegarde complète de la nuit et perd les données de ce matin." }
    snap: { en: "PRD is protected by streaming backups only; no instance snapshot exists.", fr: "PRD n'est protégé que par des sauvegardes en streaming ; aucun instantané d'instance n'existe." }
    alt: { en: "Alternate location keeps PRD unchanged and restores elsewhere.", fr: "Autre emplacement laisse PRD inchangé et restaure ailleurs." }
    files: { en: "Restore as files requires a manual recovery and doesn't restore PRD directly.", fr: "La restauration en tant que fichiers exige une récupération manuelle et ne restaure pas PRD directement." }
references:
  - title: Restore SAP HANA databases on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-db-restore
