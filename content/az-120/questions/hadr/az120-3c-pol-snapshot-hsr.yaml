id: az120-3c-pol-snapshot-hsr
objective: "3.2.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso runs SAP HANA scale-up with HANA System Replication on two Azure VMs, **hn1-db-0** and **hn1-db-1**, in a Pacemaker cluster. Both nodes are registered with the same Recovery Services vault. The HANA data is on Premium SSD managed disks formatted with xfs. Contoso accepts preview features.

    You need to protect the HANA instance with snapshot backups that can also be kept in the vault for long-term retention.

    How should you configure the policies? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute SAP HANA en scale-up avec la réplication du système HANA sur deux machines virtuelles Azure, **hn1-db-0** et **hn1-db-1**, dans un cluster Pacemaker. Les deux nœuds sont inscrits auprès du même coffre Recovery Services. Les données HANA se trouvent sur des disques managés SSD Premium formatés en xfs. Contoso accepte les fonctionnalités en préversion.

    Vous devez protéger l'instance HANA avec des sauvegardes par instantanés qui peuvent aussi être conservées dans le coffre pour une rétention à long terme.

    Comment devez-vous configurer les stratégies ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Snapshot policy subtype: [[sub]]

      Snapshot frequency: [[freq]]

      Streaming policy of each database: [[db]]
    fr: |
      Sous-type de la stratégie d'instantané : [[sub]]

      Fréquence des instantanés : [[freq]]

      Stratégie de streaming de chaque base de données : [[db]]
  slots:
    - id: sub
      options:
        - { id: std, text: Standard }
        - { id: enh, text: Enhanced }
    - id: freq
      options:
        - { id: h4, text: { en: "Every 4 hours", fr: "Toutes les 4 heures" } }
        - { id: h12, text: { en: "Every 12 hours", fr: "Toutes les 12 heures" } }
        - { id: daily, text: { en: "Daily", fr: "Quotidienne" } }
        - { id: weekly, text: { en: "Weekly", fr: "Hebdomadaire" } }
    - id: db
      options:
        - { id: dfull, text: { en: "Daily full + logs", fr: "Complète quotidienne + journaux" } }
        - { id: wdiff, text: { en: "Weekly full + daily differential + logs", fr: "Complète hebdomadaire + différentielle quotidienne + journaux" } }
        - { id: wfull, text: { en: "Weekly full + logs", fr: "Complète hebdomadaire + journaux" } }
answer:
  values: { sub: enh, freq: daily, db: wfull }
explanation:
  correct:
    en: |
      The Standard snapshot policy doesn't support HANA System Replication; the Enhanced subtype (preview) supports HSR and adds vault retention, immutability and Cross Region Restore. Instance snapshots can be scheduled only daily. Every database of the instance must use a streaming policy of weekly full backups plus logs, without differential or incremental backups.
    fr: |
      La stratégie d'instantané Standard ne prend pas en charge la réplication du système HANA ; le sous-type Enhanced (préversion) prend en charge la HSR et ajoute la rétention dans le coffre, l'immuabilité et la restauration interrégion. Les instantanés d'instance ne peuvent être planifiés que quotidiennement. Chaque base de l'instance doit utiliser une stratégie de streaming de sauvegardes complètes hebdomadaires plus journaux, sans sauvegarde différentielle ni incrémentielle.
  options:
    std: { en: "Standard is GA but supports neither HSR nor vault retention of snapshots.", fr: "Standard est en disponibilité générale, mais ne prend en charge ni la HSR ni la rétention des instantanés dans le coffre." }
    h4: { en: "Hourly schedules exist for VM Enhanced policies, not for HANA instance snapshots.", fr: "Les planifications horaires existent pour les stratégies Enhanced de machine virtuelle, pas pour les instantanés d'instance HANA." }
    wdiff: { en: "Differential backups aren't used with instance snapshots.", fr: "Les sauvegardes différentielles ne sont pas utilisées avec les instantanés d'instance." }
references:
  - title: Back up SAP HANA database instances on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-instances-backup
