id: az120-3c-pol-snapshot-hsr
objective: "3.2.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso runs a single-node SAP HANA scale-up system on an Azure VM named **hn1-db-0**. The VM is registered with a Recovery Services vault. The HANA data is on Premium SSD managed disks formatted with xfs.

    You need to protect the HANA instance with snapshot backups. Each snapshot must remain available for instant restore for as long as the snapshot policy allows.

    How should you configure the policies? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute un système SAP HANA scale-up à nœud unique sur une machine virtuelle Azure nommée **hn1-db-0**. La machine virtuelle est inscrite auprès d'un coffre Recovery Services. Les données HANA se trouvent sur des disques managés SSD Premium formatés en xfs.

    Vous devez protéger l'instance HANA avec des sauvegardes par instantanés. Chaque instantané doit rester disponible pour la restauration instantanée aussi longtemps que la stratégie d'instantané le permet.

    Comment devez-vous configurer les stratégies ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Instant restore retention: [[ret]]

      Snapshot frequency: [[freq]]

      Streaming policy of each database: [[db]]
    fr: |
      Rétention de la restauration instantanée : [[ret]]

      Fréquence des instantanés : [[freq]]

      Stratégie de streaming de chaque base de données : [[db]]
  slots:
    - id: ret
      options:
        - { id: d2, text: { en: "2 days", fr: "2 jours" } }
        - { id: d30, text: { en: "30 days", fr: "30 jours" } }
        - { id: d35, text: { en: "35 days", fr: "35 jours" } }
    - id: freq
      options:
        - { id: h4, text: { en: "Every 4 hours", fr: "Toutes les 4 heures" } }
        - { id: h12, text: { en: "Every 12 hours", fr: "Toutes les 12 heures" } }
        - { id: daily, text: { en: "Daily", fr: "Quotidienne" } }
        - { id: weekly, text: { en: "Weekly", fr: "Hebdomadaire" } }
    - id: db
      options:
        - { id: dfull, text: { en: "Daily full + logs", fr: "Complète quotidienne + journaux" } }
        - { id: wdiff, text: { en: "Weekly full + daily differential + logs", fr: "Complète hebdomadaire + différentielle quotidienne + journaux" } }
        - { id: wfull, text: { en: "Weekly full + logs", fr: "Complète hebdomadaire + journaux" } }
answer:
  values: { ret: d35, freq: daily, db: wfull }
explanation:
  correct:
    en: |
      The instant restore retention of a HANA instance snapshot policy ranges from 1 to 35 days, so 35 days is the longest. Instance snapshots can be scheduled only daily. Before snapshot backup is configured, every database of the instance must use a Backint streaming policy of weekly full backups plus logs, without differential or incremental backups; otherwise the snapshot configuration fails.
    fr: |
      La rétention de la restauration instantanée d'une stratégie d'instantané d'instance HANA va de 1 à 35 jours : 35 jours est donc la durée la plus longue. Les instantanés d'instance ne peuvent être planifiés que quotidiennement. Avant de configurer la sauvegarde par instantanés, chaque base de l'instance doit utiliser une stratégie de streaming Backint de sauvegardes complètes hebdomadaires plus journaux, sans sauvegarde différentielle ni incrémentielle ; sinon, la configuration des instantanés échoue.
  options:
    d2: { en: "2 days is the default instant restore retention of the policy, not its maximum.", fr: "2 jours est la rétention de restauration instantanée par défaut de la stratégie, pas son maximum." }
    d30: { en: "30 days is the maximum instant restore retention of the Enhanced VM backup policy; HANA instance snapshots allow up to 35 days.", fr: "30 jours est la rétention de restauration instantanée maximale de la stratégie Enhanced de sauvegarde de machine virtuelle ; les instantanés d'instance HANA autorisent jusqu'à 35 jours." }
    h4: { en: "Hourly schedules exist for VM Enhanced policies, not for HANA instance snapshots.", fr: "Les planifications horaires existent pour les stratégies Enhanced de machine virtuelle, pas pour les instantanés d'instance HANA." }
    wdiff: { en: "Differential backups aren't used with instance snapshots.", fr: "Les sauvegardes différentielles ne sont pas utilisées avec les instantanés d'instance." }
references:
  - title: Back up SAP HANA database instances on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-instances-backup
