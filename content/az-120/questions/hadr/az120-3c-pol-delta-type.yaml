id: az120-3c-pol-delta-type
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are creating an Azure Backup policy for an SAP HANA database named **HD1**. The policy runs a weekly full backup on Sunday and log backups every 15 minutes.

    You need to add a delta backup on the other six days. A restore must never require more than one delta backup on top of the full backup.

    What should you configure in the policy?
  fr: |
    Vous créez une stratégie Sauvegarde Azure pour une base de données SAP HANA nommée **HD1**. La stratégie exécute une sauvegarde complète hebdomadaire le dimanche et des sauvegardes de journaux toutes les 15 minutes.

    Vous devez ajouter une sauvegarde delta les six autres jours. Une restauration ne doit jamais nécessiter plus d'une sauvegarde delta en plus de la sauvegarde complète.

    Que devez-vous configurer dans la stratégie ?
body:
  options:
    - { id: a, text: { en: "Enable incremental backups from Monday to Saturday", fr: "Activer les sauvegardes incrémentielles du lundi au samedi" } }
    - { id: b, text: { en: "Enable differential backups from Monday to Saturday", fr: "Activer les sauvegardes différentielles du lundi au samedi" } }
    - { id: c, text: { en: "Enable differential backups on Wednesday and incremental backups on the other days", fr: "Activer les sauvegardes différentielles le mercredi et incrémentielles les autres jours" } }
    - { id: d, text: { en: "Change the full backup to daily and enable differential backups", fr: "Passer la sauvegarde complète en quotidienne et activer les sauvegardes différentielles" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A differential backup contains every change since the last full backup, so a restore needs the full backup, a single differential and the logs. A HANA policy allows at most one differential backup per day, retained up to 180 days.
    fr: |
      Une sauvegarde différentielle contient toutes les modifications depuis la dernière sauvegarde complète : une restauration nécessite la sauvegarde complète, une seule différentielle et les journaux. Une stratégie HANA autorise au plus une sauvegarde différentielle par jour, conservée jusqu'à 180 jours.
  options:
    a: { en: "Each incremental backup contains only the changes since the previous backup, so a restore on Saturday needs six incrementals.", fr: "Chaque sauvegarde incrémentielle ne contient que les modifications depuis la sauvegarde précédente : une restauration le samedi nécessite six incrémentielles." }
    c: { en: "A policy uses either differential or incremental backups, not both.", fr: "Une stratégie utilise soit des sauvegardes différentielles, soit des incrémentielles, pas les deux." }
    d: { en: "Differential backups can't be combined with a daily full backup.", fr: "Les sauvegardes différentielles ne peuvent pas être combinées avec une sauvegarde complète quotidienne." }
references:
  - title: Back up SAP HANA databases in Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-sap-hana-database
