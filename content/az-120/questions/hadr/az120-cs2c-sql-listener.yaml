id: az120-cs2c-sql-listener
objective: "3.1.5"
type: single
caseStudy: az120-cs2c-litware
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend how the SAP application servers of LE1 connect to the SQL Server database. The solution must meet the database high availability requirements.

    What should you recommend?
  fr: |
    Vous devez recommander la façon dont les serveurs d'applications SAP de LE1 se connectent à la base de données SQL Server. La solution doit respecter les exigences de haute disponibilité de la base de données.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A virtual network name (VNN) listener behind a Standard internal load balancer with Floating IP enabled", fr: "Un écouteur à nom de réseau virtuel (VNN) derrière un équilibreur de charge interne Standard avec l'option IP flottante activée" } }
    - { id: b, text: { en: "The SAP profile parameter dbs/mss/server set to the two synchronous replicas, without a listener", fr: "Le paramètre de profil SAP dbs/mss/server défini sur les deux réplicas synchrones, sans écouteur" } }
    - { id: c, text: { en: "A distributed network name (DNN) listener for the availability group", fr: "Un écouteur à nom de réseau distribué (DNN) pour le groupe de disponibilité" } }
    - { id: d, text: { en: "A SQL Server failover cluster instance on an Azure shared disk instead of the availability group", fr: "Une instance de cluster de basculement SQL Server sur un disque partagé Azure à la place du groupe de disponibilité" } }
answer: { optionId: c }
explanation:
  correct:
    en: A DNN listener removes the need for an Azure load balancer in front of the availability group listener. It is supported with SQL Server 2019 CU8 and later on Windows Server 2016 and later, which matches LE1.
    fr: Un écouteur DNN supprime la nécessité d'un équilibreur de charge Azure devant l'écouteur du groupe de disponibilité. Il est pris en charge à partir de SQL Server 2019 CU8 sur Windows Server 2016 et versions ultérieures, ce qui correspond à LE1.
  options:
    a: { en: "A VNN listener requires an Azure load balancer, which the requirements exclude.", fr: "Un écouteur VNN nécessite un équilibreur de charge Azure, ce que les exigences excluent." }
    b: { en: "The database mirroring-style connection with dbs/mss/server works only with two-node availability groups; LE1's group has three replicas.", fr: "La connexion de type mise en miroir avec dbs/mss/server ne fonctionne qu'avec des groupes de disponibilité à deux nœuds ; celui de LE1 compte trois réplicas." }
    d: { en: "Failover cluster instances and Azure shared disks are not supported for SQL Server with SAP on Azure.", fr: "Les instances de cluster de basculement et les disques partagés Azure ne sont pas pris en charge pour SQL Server avec SAP sur Azure." }
references:
  - title: SQL Server Azure Virtual Machines DBMS deployment for SAP NetWeaver
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/dbms-guide-sqlserver
