id: az120-sr1-dr-region-2
objective: "3.2.1"
type: series_yesno
series: az120-sr1-dr-region
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: |-
    You use Site Recovery for the application tier, HANA System Replication for HANA and snapshots for the NFS volumes.
  fr: |-
    Vous utilisez Site Recovery pour la couche application, HANA System Replication pour HANA et des instantanés pour les volumes NFS.
body:
  solution:
    en: |-
      You use **Azure Site Recovery** to replicate the application server VMs and the ASCS/ERS cluster VMs to North Europe. You add a HANA VM in North Europe that receives **asynchronous HANA System Replication** from the primary site. You protect the /sapmnt and /usr/sap/trans volumes with an Azure NetApp Files **snapshot policy**.
    fr: |-
      Vous utilisez **Azure Site Recovery** pour répliquer vers North Europe les machines virtuelles de serveur d'applications et les machines virtuelles du cluster ASCS/ERS. Vous ajoutez dans North Europe une machine virtuelle HANA qui reçoit la **réplication HANA System Replication asynchrone** depuis le site principal. Vous protégez les volumes /sapmnt et /usr/sap/trans avec une **stratégie d'instantanés** Azure NetApp Files.
answer: { value: false }
explanation:
  correct:
    en: |-
      The application tier and the HANA tier are protected correctly, but Azure NetApp Files snapshots stay with the volume in West Europe. Without a copy of /sapmnt and /usr/sap/trans in North Europe, the SAP system can't start there; these NFS volumes need Azure NetApp Files cross-region replication.
    fr: |-
      Les couches application et HANA sont correctement protégées, mais les instantanés Azure NetApp Files restent avec le volume dans West Europe. Sans copie de /sapmnt et /usr/sap/trans dans North Europe, le système SAP ne peut pas y démarrer : ces volumes NFS nécessitent la réplication inter-région d'Azure NetApp Files.
references:
  - title: Disaster recovery overview and infrastructure guidelines for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-overview-guide
