id: az120-3a-sla-downtime-target
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys is designing the SAP HANA database layer of its production S/4HANA system. HANA System Replication with a Pacemaker cluster will be used whenever the design contains two database VMs. All disks are Premium SSD.

    The Azure SLA for the database layer infrastructure must allow no more than five minutes of downtime in a 30-day month (43,200 minutes).

    Which deployment should you include in the design?
  fr: |
    Tailspin Toys conçoit la couche de base de données SAP HANA de son système S/4HANA de production. La réplication du système SAP HANA avec un cluster Pacemaker sera utilisée chaque fois que la conception comporte deux machines virtuelles de base de données. Tous les disques sont des SSD Premium.

    Le SLA Azure de l'infrastructure de la couche de base de données doit permettre au plus cinq minutes d'indisponibilité sur un mois de 30 jours (43 200 minutes).

    Quel déploiement devez-vous inclure dans la conception ?
body:
  options:
    - id: a
      text: { en: "One VM deployed in an availability zone", fr: "Une machine virtuelle déployée dans une zone de disponibilité" }
    - id: b
      text: { en: "Two VMs deployed in the same availability set", fr: "Deux machines virtuelles déployées dans le même groupe à haute disponibilité" }
    - id: c
      text: { en: "Two VMs deployed in the same proximity placement group", fr: "Deux machines virtuelles déployées dans le même groupe de placement de proximité" }
    - id: d
      text: { en: "Two VMs deployed in two availability zones", fr: "Deux machines virtuelles déployées dans deux zones de disponibilité" }
answer: { optionId: d }
explanation:
  correct:
    en: Five minutes out of 43,200 is about 0.0116%, so the SLA must be at least about 99.988%. Only two or more VMs across availability zones reach this, with a 99.99% SLA (about 4.3 minutes per month).
    fr: Cinq minutes sur 43 200 représentent environ 0,0116 % ; le SLA doit donc être d'au moins 99,988 % environ. Seules deux machines virtuelles ou plus réparties entre des zones de disponibilité y parviennent, avec un SLA de 99,99 % (environ 4,3 minutes par mois).
  options:
    a: { en: "A single zonal VM has the single-instance SLA of 99.9%, about 43 minutes per month.", fr: "Une machine virtuelle zonale unique a le SLA d'instance unique de 99,9 %, soit environ 43 minutes par mois." }
    b: { en: "An availability set gives 99.95%, which allows about 21.6 minutes per month.", fr: "Un groupe à haute disponibilité donne 99,95 %, ce qui autorise environ 21,6 minutes par mois." }
    c: { en: "A proximity placement group alone gives no SLA beyond the single-instance SLA of each VM.", fr: "Un groupe de placement de proximité seul n'apporte aucun SLA au-delà du SLA d'instance unique de chaque machine virtuelle." }
references:
  - title: SAP HANA availability on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-availability-overview
