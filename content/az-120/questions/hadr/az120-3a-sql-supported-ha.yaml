id: az120-3a-sql-supported-ha
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is migrating an SAP ERP system that uses SQL Server 2022 on Windows Server 2022 to Azure VMs. Contoso requires automatic failover of the database within the Azure region and wants a configuration that SAP supports on Azure.

    Which high-availability solution should you recommend for the database?
  fr: |
    Contoso migre vers des machines virtuelles Azure un système SAP ERP qui utilise SQL Server 2022 sur Windows Server 2022. Contoso exige un basculement automatique de la base de données dans la région Azure et veut une configuration prise en charge par SAP sur Azure.

    Quelle solution de haute disponibilité devez-vous recommander pour la base de données ?
body:
  options:
    - id: a
      text: { en: "A SQL Server failover cluster instance on Azure shared disks", fr: "Une instance de cluster de basculement SQL Server sur des disques partagés Azure" }
    - id: b
      text: { en: "A SQL Server failover cluster instance on Storage Spaces Direct", fr: "Une instance de cluster de basculement SQL Server sur des espaces de stockage direct" }
    - id: c
      text: { en: "SQL Server log shipping to a second VM", fr: "La copie des journaux de transaction SQL Server vers une deuxième machine virtuelle" }
    - id: d
      text: { en: "A SQL Server Always On availability group with a synchronous secondary replica", fr: "Un groupe de disponibilité SQL Server Always On avec un réplica secondaire synchrone" }
answer: { optionId: d }
explanation:
  correct:
    en: Always On availability groups are supported for SAP on Azure and are the solution most customers use for high availability within a region, typically with a pair of VMs across two availability zones and a synchronous secondary for automatic failover.
    fr: Les groupes de disponibilité Always On sont pris en charge pour SAP sur Azure et constituent la solution que la plupart des clients utilisent pour la haute disponibilité dans une région, généralement avec une paire de machines virtuelles dans deux zones de disponibilité et un secondaire synchrone pour le basculement automatique.
  options:
    a: { en: "SQL Server failover cluster instances, including on Azure shared disks, aren't supported for SAP workloads on Azure.", fr: "Les instances de cluster de basculement SQL Server, y compris sur des disques partagés Azure, ne sont pas prises en charge pour les charges de travail SAP sur Azure." }
    b: { en: "FCI on Storage Spaces Direct works for SQL Server in general, but Microsoft doesn't support it for SAP workloads.", fr: "Une FCI sur des espaces de stockage direct fonctionne pour SQL Server en général, mais Microsoft ne la prend pas en charge pour les charges de travail SAP." }
    c: { en: "Log shipping has no automatic failover; it's used for disaster recovery or cut-over, rarely for high availability.", fr: "La copie des journaux de transaction n'offre pas de basculement automatique ; elle sert à la reprise d'activité ou à la bascule de migration, rarement à la haute disponibilité." }
references:
  - title: SQL Server Azure virtual machines DBMS deployment for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/dbms-guide-sqlserver
