id: az120-3c-pol-snapshot-prereq
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The databases of an SAP HANA instance named **HN1** are protected by Azure Backup with a streaming policy that runs a weekly full backup, a daily differential backup and log backups.

    You try to configure **DB Instance via snapshot** for HN1 with a Standard snapshot policy, but the configuration fails.

    What should you do first?
  fr: |
    Les bases de données d'une instance SAP HANA nommée **HN1** sont protégées par Sauvegarde Azure avec une stratégie de streaming qui exécute une sauvegarde complète hebdomadaire, une sauvegarde différentielle quotidienne et des sauvegardes de journaux.

    Vous essayez de configurer **DB Instance via snapshot** pour HN1 avec une stratégie d'instantané Standard, mais la configuration échoue.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Change the subtype of the snapshot policy to Enhanced", fr: "Passer le sous-type de la stratégie d'instantané à Enhanced" } }
    - { id: b, text: { en: "Assign a streaming policy with daily full backups and log backups", fr: "Attribuer une stratégie de streaming avec des sauvegardes complètes quotidiennes et de journaux" } }
    - { id: c, text: { en: "Increase the instant restore retention of the snapshot policy to 35 days", fr: "Porter la rétention de la restauration instantanée de la stratégie d'instantané à 35 jours" } }
    - { id: d, text: { en: "Assign a streaming policy with weekly full backups and log backups only", fr: "Attribuer une stratégie de streaming avec uniquement des sauvegardes complètes hebdomadaires et de journaux" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Before you configure instance snapshots, every database of the instance must be protected via Backint with a policy of weekly full backups plus log backups only, as SAP guidance requires. Differential and incremental backups aren't used with snapshots; otherwise the snapshot configuration fails.
    fr: |
      Avant de configurer les instantanés d'instance, chaque base de l'instance doit être protégée via Backint avec une stratégie composée uniquement de sauvegardes complètes hebdomadaires et de sauvegardes de journaux, comme l'exige SAP. Les sauvegardes différentielles et incrémentielles ne sont pas utilisées avec les instantanés ; sinon, la configuration des instantanés échoue.
  options:
    a: { en: "Enhanced is needed for HANA System Replication or vault retention of snapshots; it doesn't remove the database policy prerequisite.", fr: "Enhanced est nécessaire pour la réplication du système HANA ou la rétention des instantanés dans le coffre ; il ne supprime pas le prérequis de stratégie de base de données." }
    b: { en: "The prerequisite is weekly full backups plus logs, not daily full backups.", fr: "Le prérequis est une sauvegarde complète hebdomadaire plus les journaux, pas des sauvegardes complètes quotidiennes." }
    c: { en: "The instant restore retention (1 to 35 days) doesn't cause the failure.", fr: "La rétention de la restauration instantanée (1 à 35 jours) n'est pas la cause de l'échec." }
references:
  - title: Back up SAP HANA database instances on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-instances-backup
