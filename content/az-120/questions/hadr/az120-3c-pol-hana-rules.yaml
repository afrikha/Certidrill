id: az120-3c-pol-hana-rules
objective: "3.2.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum protects the SAP HANA databases of its SAP ERP system with Azure Backup. You are reviewing the backup policies with the operations team.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum protège les bases de données SAP HANA de son système SAP ERP avec Sauvegarde Azure. Vous passez en revue les stratégies de sauvegarde avec l'équipe d'exploitation.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When a HANA instance is protected by instance snapshots, you can disable log backups in the streaming policy of its databases.
        fr: Lorsqu'une instance HANA est protégée par des instantanés d'instance, vous pouvez désactiver les sauvegardes de journaux dans la stratégie de streaming de ses bases de données.
    - id: s2
      text:
        en: In a HANA streaming policy, differential backups can be retained for up to 180 days.
        fr: Dans une stratégie de streaming HANA, les sauvegardes différentielles peuvent être conservées jusqu'à 180 jours.
    - id: s3
      text:
        en: If you reduce the retention of daily full backups in an existing policy, only the recovery points created after the change use the new retention.
        fr: Si vous réduisez la rétention des sauvegardes complètes quotidiennes dans une stratégie existante, seuls les points de récupération créés après la modification utilisent la nouvelle rétention.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Log backups can't be disabled because SAP HANA manages them, and instance snapshots depend on them for point-in-time recovery. Differential and incremental backups are limited to one per day and 180 days of retention. Policy changes apply retroactively: expiry dates of existing recovery points are recalculated and expired points are deleted.
    fr: |
      Les sauvegardes de journaux ne peuvent pas être désactivées, car SAP HANA les gère, et les instantanés d'instance en dépendent pour la récupération à un point dans le temps. Les sauvegardes différentielles et incrémentielles sont limitées à une par jour et à 180 jours de rétention. Les modifications de stratégie s'appliquent rétroactivement : les dates d'expiration des points de récupération existants sont recalculées et les points expirés sont supprimés.
references:
  - title: Back up SAP HANA databases in Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-sap-hana-database
  - title: FAQ - Back up SAP HANA databases on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-faq-backup-azure-vm
