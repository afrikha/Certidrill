id: az120-3a-sla-statements
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum is reviewing the availability design of an SAP ERP system on Azure. The ASCS/SCS instance and the database currently run on single VMs that rely on Azure VM restart after host failures. The application servers run on several VMs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum examine la conception de la disponibilité d'un système SAP ERP sur Azure. L'instance ASCS/SCS et la base de données s'exécutent actuellement sur des machines virtuelles uniques qui s'appuient sur le redémarrage des machines virtuelles Azure après une défaillance de l'hôte. Les serveurs d'applications s'exécutent sur plusieurs machines virtuelles.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Azure SLA guarantees the maximum time needed to restart a VM on a healthy host after a host outage.
        fr: Le SLA Azure garantit le temps maximal nécessaire pour redémarrer une machine virtuelle sur un hôte sain après une panne de l'hôte.
    - id: s2
      text:
        en: For two VMs in an availability set, the SLA guarantees connectivity to at least one of the VMs, not to each VM.
        fr: Pour deux machines virtuelles dans un groupe à haute disponibilité, le SLA garantit la connectivité à au moins une des machines virtuelles, et non à chacune d'elles.
    - id: s3
      text:
        en: Placing the ASCS/SCS VM and the database VM in the same proximity placement group gives them a higher SLA than single VMs.
        fr: Placer la machine virtuelle ASCS/SCS et la machine virtuelle de base de données dans le même groupe de placement de proximité leur donne un SLA supérieur à celui de machines virtuelles uniques.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Azure VM restart protects the infrastructure, but no SLA covers how long the restart takes, which is why Microsoft considers it unsuitable on its own for critical components such as ASCS/SCS and the DBMS. The availability set SLA guarantees connectivity to at least one instance 99.95% of the time. A proximity placement group only influences placement for latency; the VMs keep their single-instance SLA.
    fr: Le redémarrage des machines virtuelles Azure protège l'infrastructure, mais aucun SLA ne couvre la durée du redémarrage ; c'est pourquoi Microsoft le juge insuffisant à lui seul pour les composants critiques comme l'ASCS/SCS et le SGBD. Le SLA des groupes à haute disponibilité garantit la connectivité à au moins une instance 99,95 % du temps. Un groupe de placement de proximité n'influence que le placement, pour la latence ; les machines virtuelles conservent leur SLA d'instance unique.
references:
  - title: Utilize Azure VMs restart for 'higher availability' of an SAP system
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-higher-availability-architecture-scenarios
  - title: Azure VMs HA architecture and scenarios for SAP NetWeaver
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-high-availability-architecture-scenarios
