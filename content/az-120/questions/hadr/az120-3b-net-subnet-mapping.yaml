id: az120-3b-net-subnet-mapping
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam replicates an SAP application server VM named **app01** to North Europe with Azure Site Recovery. In West Europe, app01 is connected to the subnet **snet-sapapp**. When Fabrikam enabled the replication, it selected the existing virtual network **vnet-sap-neu** as the target network. The target network contains the following subnets: **snet-web**, **snet-sap-app** and **snet-db**.

    Fabrikam didn't change the network settings of the replicated item.

    To which subnet will app01 be connected after a failover?
  fr: |
    Fabrikam réplique une machine virtuelle de serveur d'applications SAP nommée **app01** vers North Europe avec Azure Site Recovery. Dans West Europe, app01 est connectée au sous-réseau **snet-sapapp**. Lors de l'activation de la réplication, Fabrikam a sélectionné le réseau virtuel existant **vnet-sap-neu** comme réseau cible. Le réseau cible contient les sous-réseaux suivants : **snet-web**, **snet-sap-app** et **snet-db**.

    Fabrikam n'a pas modifié les paramètres réseau de l'élément répliqué.

    À quel sous-réseau app01 sera-t-elle connectée après un basculement ?
body:
  options:
    - { id: a, text: snet-web }
    - { id: b, text: snet-sap-app }
    - { id: c, text: snet-db }
    - { id: d, text: { en: "A new subnet named snet-sapapp that Site Recovery creates", fr: "Un nouveau sous-réseau nommé snet-sapapp que Site Recovery crée" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Site Recovery uses the target subnet that has the same name as the source subnet. If no subnet has the same name, it uses the first subnet in alphabetical order, here snet-db (before snet-sap-app and snet-web). You can change the target subnet in the Network settings of the replicated VM.
    fr: |
      Site Recovery utilise le sous-réseau cible qui porte le même nom que le sous-réseau source. Si aucun sous-réseau ne porte le même nom, il utilise le premier sous-réseau dans l'ordre alphabétique, ici snet-db (avant snet-sap-app et snet-web). Vous pouvez changer le sous-réseau cible dans les paramètres réseau de la machine virtuelle répliquée.
  options:
    a: { en: "snet-web comes last in alphabetical order.", fr: "snet-web arrive en dernier dans l'ordre alphabétique." }
    b: { en: "Site Recovery matches exact names only; snet-sap-app isn't the same name as snet-sapapp.", fr: "Site Recovery ne retient que les noms identiques ; snet-sap-app n'est pas le même nom que snet-sapapp." }
    d: { en: "Site Recovery doesn't add subnets to an existing target network that you selected.", fr: "Site Recovery n'ajoute pas de sous-réseau à un réseau cible existant que vous avez sélectionné." }
references:
  - title: Set up network mapping and IP addressing for VNets
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-network-mapping
