id: az120-3b-net-er-gateway-order
objective: "3.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders created the DR virtual network **vnet-sap-neu** in North Europe manually for its SAP systems. The virtual network contains only the subnet **snet-sap** and uses an address space that doesn't overlap production. A second ExpressRoute circuit named **er-dub** with private peering is provisioned to North Europe.

    You need to connect vnet-sap-neu to on-premises through er-dub before any failover.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders a créé manuellement le réseau virtuel de reprise **vnet-sap-neu** dans North Europe pour ses systèmes SAP. Le réseau virtuel ne contient que le sous-réseau **snet-sap** et utilise un espace d'adressage qui ne chevauche pas la production. Un second circuit ExpressRoute nommé **er-dub** avec peering privé est approvisionné vers North Europe.

    Vous devez connecter vnet-sap-neu au réseau local par er-dub avant tout basculement.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: subnet, text: { en: "Add a subnet named GatewaySubnet to vnet-sap-neu.", fr: "Ajouter un sous-réseau nommé GatewaySubnet à vnet-sap-neu." } }
    - { id: gw, text: { en: "Create an ExpressRoute virtual network gateway in vnet-sap-neu.", fr: "Créer une passerelle de réseau virtuel ExpressRoute dans vnet-sap-neu." } }
    - { id: conn, text: { en: "Create a connection between the gateway and er-dub.", fr: "Créer une connexion entre la passerelle et er-dub." } }
    - { id: msft, text: { en: "Enable Microsoft peering on er-dub for the Site Recovery replication traffic.", fr: "Activer le peering Microsoft sur er-dub pour le trafic de réplication de Site Recovery." } }
    - { id: remote, text: { en: "Peer vnet-sap-neu with the production virtual network, and enable Use remote gateways.", fr: "Relier vnet-sap-neu par peering au réseau virtuel de production, et activer Utiliser des passerelles distantes." } }
    - { id: vpn, text: { en: "Create a policy-based VPN gateway in snet-sap.", fr: "Créer une passerelle VPN basée sur des stratégies dans snet-sap." } }
answer:
  sequence: [ subnet, gw, conn ]
explanation:
  correct:
    en: |
      A virtual network gateway must be deployed in a subnet named GatewaySubnet, so you add that subnet first, then create the ExpressRoute gateway, and finally connect the gateway to the DR circuit. Site Recovery doesn't create gateways or connections in the target region; Microsoft recommends creating them in advance because their deployment takes time.
    fr: |
      Une passerelle de réseau virtuel doit être déployée dans un sous-réseau nommé GatewaySubnet : vous ajoutez donc d'abord ce sous-réseau, puis vous créez la passerelle ExpressRoute, et enfin vous connectez la passerelle au circuit de reprise. Site Recovery ne crée ni passerelles ni connexions dans la région cible ; Microsoft recommande de les créer à l'avance, car leur déploiement prend du temps.
  options:
    msft: { en: "Site Recovery replication doesn't use ExpressRoute at all.", fr: "La réplication Site Recovery n'utilise pas du tout ExpressRoute." }
    remote: { en: "Using the production gateway makes the DR network depend on the primary region it must survive.", fr: "Utiliser la passerelle de production rend le réseau de reprise dépendant de la région primaire à laquelle il doit survivre." }
    vpn: { en: "A gateway can't be deployed in a workload subnet, and a VPN gateway doesn't connect to an ExpressRoute circuit.", fr: "Une passerelle ne peut pas être déployée dans un sous-réseau de charge de travail, et une passerelle VPN ne se connecte pas à un circuit ExpressRoute." }
references:
  - title: Integrate ExpressRoute with disaster recovery for Azure virtual machines
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-vm-disaster-recovery-with-expressroute
