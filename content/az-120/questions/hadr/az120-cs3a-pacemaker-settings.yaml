id: az120-cs3a-pacemaker-settings
objective: "3.1.6"
type: yesno_statements
caseStudy: az120-cs3a-coho-winery
difficulty: 3
status: draft
stem:
  en: |
    You are configuring the Pacemaker cluster for HANA-PRD1 and HANA-PRD2. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez le cluster Pacemaker de HANA-PRD1 et HANA-PRD2. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          When the Azure fence agent is used, you should set the stonith-enabled cluster property to false, because the agent fences nodes through Azure Resource Manager instead of Pacemaker.
        fr: |
          Quand l'agent Azure Fence est utilisé, vous devez définir la propriété de cluster stonith-enabled sur false, car l'agent isole les nœuds par Azure Resource Manager au lieu de Pacemaker.
    - id: s2
      text:
        en: |
          To reduce the risk of both nodes fencing each other at the same time, you should set pcmk_delay_max on the fencing device and the priority-fencing-delay cluster property.
        fr: |
          Pour réduire le risque que les deux nœuds s'isolent mutuellement en même temps, vous devez définir pcmk_delay_max sur l'appareil d'isolation et la propriété de cluster priority-fencing-delay.
    - id: s3
      text:
        en: |
          To meet the maintenance requirement, you should configure a cloned azure-events-az resource and set the node-health-strategy cluster property to custom.
        fr: |
          Pour respecter l'exigence de maintenance, vous devez configurer une ressource azure-events-az clonée et définir la propriété de cluster node-health-strategy sur custom.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The Azure fence agent is a Pacemaker STONITH resource (fence_azure_arm), so stonith-enabled must stay true; Microsoft's procedure also sets stonith-timeout to 900 seconds. For split-brain protection, Microsoft recommends pcmk_delay_max on the fencing device and priority-fencing-delay in the cluster configuration. The azure-events-az agent watches the Azure scheduled events of the node; when an event is pending and another node is available, it sets the node health attribute to -1000000, which, with node-health-strategy=custom, moves the resources away.
    fr: |
      L'agent Azure Fence est une ressource STONITH de Pacemaker (fence_azure_arm) : stonith-enabled doit donc rester à true ; la procédure de Microsoft définit aussi stonith-timeout à 900 secondes. Pour se protéger d'un split-brain, Microsoft recommande pcmk_delay_max sur l'appareil d'isolation et priority-fencing-delay dans la configuration du cluster. L'agent azure-events-az surveille les événements planifiés Azure du nœud ; quand un événement est en attente et qu'un autre nœud est disponible, il définit l'attribut d'intégrité du nœud à -1000000, ce qui, avec node-health-strategy=custom, déplace les ressources.
references:
  - title: Set up Pacemaker on SUSE Linux Enterprise Server (SLES) in Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-pacemaker
  - title: High availability for SAP HANA on Azure VMs on SLES
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability
