id: az120-3b-asr-hana-method
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs SAP S/4HANA in the West Europe region. The SAP HANA database runs on M-series VMs that use managed disks. Contoso uses Azure Site Recovery to replicate the application server VMs to North Europe.

    For the database, the disaster recovery solution must provide a database-consistent copy in North Europe with a recovery point objective (RPO) of less than 15 minutes.

    What should you use for the database?
  fr: |
    Contoso exécute SAP S/4HANA dans la région West Europe. La base de données SAP HANA s'exécute sur des machines virtuelles de série M qui utilisent des disques managés. Contoso utilise Azure Site Recovery pour répliquer les machines virtuelles des serveurs d'applications vers North Europe.

    Pour la base de données, la solution de reprise d'activité doit fournir une copie cohérente au niveau de la base de données dans North Europe, avec un objectif de point de récupération (RPO) inférieur à 15 minutes.

    Que devez-vous utiliser pour la base de données ?
body:
  options:
    - { id: a, text: { en: "Site Recovery replication of the HANA VMs to North Europe", fr: "La réplication des machines virtuelles HANA vers North Europe par Site Recovery" } }
    - { id: b, text: { en: "Synchronous HANA System Replication to a VM in North Europe", fr: "HANA System Replication synchrone vers une machine virtuelle de North Europe" } }
    - { id: c, text: { en: "Asynchronous HANA System Replication to a VM in North Europe", fr: "HANA System Replication asynchrone vers une machine virtuelle de North Europe" } }
    - { id: d, text: { en: "Azure Backup for SAP HANA with Cross Region Restore to North Europe", fr: "Sauvegarde Azure pour SAP HANA avec restauration interrégion vers North Europe" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft recommends the native DBMS replication for the database layer; for SAP HANA, that is HANA System Replication. Between regions, the round-trip latency rules out synchronous replication, so the DR replica uses asynchronous HSR, which gives a low but non-zero RPO and a database-consistent copy.
    fr: |
      Microsoft recommande la réplication native du SGBD pour la couche base de données ; pour SAP HANA, il s'agit de HANA System Replication. Entre régions, la latence aller-retour exclut la réplication synchrone : le réplica de reprise d'activité utilise donc HSR asynchrone, qui donne un RPO faible mais non nul et une copie cohérente au niveau de la base de données.
  options:
    a: { en: "Site Recovery isn't recommended for databases: it doesn't guarantee database consistency and has data churn limits.", fr: "Site Recovery n'est pas recommandé pour les bases de données : il ne garantit pas la cohérence de la base et a des limites de taux de modification des données." }
    b: { en: "The latency between regions is too high for synchronous replication under SAP workloads.", fr: "La latence entre régions est trop élevée pour une réplication synchrone sous une charge de travail SAP." }
    d: { en: "Cross Region Restore gives an RPO of about 12 hours plus the log backup frequency, far above 15 minutes.", fr: "La restauration interrégion donne un RPO d'environ 12 heures plus la fréquence des sauvegardes de journaux, bien au-delà de 15 minutes." }
references:
  - title: Disaster recovery guidelines for SAP application
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-sap-guide
  - title: SAP HANA availability across Azure regions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-availability-across-regions
