id: az120-3a-lb-sql-listener-rule
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank runs the database of an SAP ERP system on two Windows Server VMs with SQL Server in an Always On availability group. Both VMs are in the same subnet. The SAP application servers connect through an availability group listener that uses a virtual network name (VNN).

    You deploy a Standard internal load balancer whose frontend IP address is the listener IP address, with a TCP health probe on port 59999 and a load-balancing rule for port 1433.

    Which setting must you enable on the load-balancing rule?
  fr: |
    Woodgrove Bank exécute la base de données d'un système SAP ERP sur deux machines virtuelles Windows Server avec SQL Server dans un groupe de disponibilité Always On. Les deux machines virtuelles se trouvent dans le même sous-réseau. Les serveurs d'applications SAP se connectent au moyen d'un écouteur de groupe de disponibilité qui utilise un nom de réseau virtuel (VNN).

    Vous déployez un équilibreur de charge interne Standard dont l'adresse IP frontale est l'adresse IP de l'écouteur, avec une sonde d'intégrité TCP sur le port 59999 et une règle d'équilibrage de charge pour le port 1433.

    Quel paramètre devez-vous activer sur la règle d'équilibrage de charge ?
body:
  options:
    - id: a
      text: { en: "Floating IP (direct server return)", fr: "IP flottante (retour direct du serveur)" }
    - id: b
      text: { en: "TCP reset", fr: "Réinitialisation TCP" }
    - id: c
      text: { en: "Session persistence: Client IP", fr: "Persistance de session : IP du client" }
    - id: d
      text: { en: "Outbound source network address translation (SNAT)", fr: "Traduction d'adresses réseau source (SNAT) sortante" }
answer: { optionId: a }
explanation:
  correct:
    en: For an availability group listener behind a load balancer, the rule must have floating IP (direct server return) enabled, with the backend port equal to the frontend port. The packets keep the listener IP as their destination, and the cluster IP resource that owns that address on the primary replica answers them.
    fr: Pour un écouteur de groupe de disponibilité derrière un équilibreur de charge, la règle doit avoir l'IP flottante (retour direct du serveur) activée, avec un port principal égal au port frontal. Les paquets conservent l'adresse IP de l'écouteur comme destination, et la ressource IP du cluster qui détient cette adresse sur le réplica principal y répond.
  options:
    b: { en: "TCP reset sends a reset on idle timeout; it isn't required for the listener.", fr: "La réinitialisation TCP envoie un reset à l'expiration du délai d'inactivité ; elle n'est pas requise pour l'écouteur." }
    c: { en: "The documented setting for session persistence is None; only one replica answers the probe anyway.", fr: "Le paramètre documenté pour la persistance de session est None ; de toute façon, un seul réplica répond à la sonde." }
    d: { en: "Outbound SNAT concerns outbound connections through a public frontend, not listener traffic.", fr: "La SNAT sortante concerne les connexions sortantes via une adresse frontale publique, pas le trafic de l'écouteur." }
references:
  - title: Configure an Azure Load Balancer for an AG VNN Listener - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/availability-group-vnn-azure-load-balancer-configure
