id: az120-3b-region-operation-mode
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys uses multitier HANA System Replication: tier 1 and tier 2 are in two availability zones of the primary region with synchronous replication, and tier 3 is in the DR region with asynchronous replication. To reduce costs, the tier 3 VM also hosts a QA system, and Tailspin wants the replication to use as little memory as possible on that VM.

    Replication inside the primary region must provide an RPO of zero.

    Which operation mode configuration should you use?
  fr: |
    Tailspin Toys utilise HANA System Replication multiniveau : les niveaux 1 et 2 se trouvent dans deux zones de disponibilité de la région primaire avec une réplication synchrone, et le niveau 3 se trouve dans la région de reprise avec une réplication asynchrone. Pour réduire les coûts, la machine virtuelle du niveau 3 héberge aussi un système d'assurance qualité, et Tailspin veut que la réplication utilise le moins de mémoire possible sur cette machine virtuelle.

    La réplication dans la région primaire doit fournir un RPO nul.

    Quelle configuration de mode d'opération devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "logreplay on all tiers", fr: "logreplay sur tous les niveaux" } }
    - { id: b, text: { en: "delta_datashipping on all tiers", fr: "delta_datashipping sur tous les niveaux" } }
    - { id: c, text: { en: "logreplay for tier 2, and delta_datashipping for tier 3", fr: "logreplay pour le niveau 2, et delta_datashipping pour le niveau 3" } }
    - { id: d, text: { en: "delta_datashipping for tier 2, and logreplay for tier 3", fr: "delta_datashipping pour le niveau 2, et logreplay pour le niveau 3" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Operation modes must be homogeneous across all tiers of a multitier setup: you can't use logreplay between tiers 1 and 2 and delta_datashipping for tier 3. Because delta_datashipping can't deliver an RPO of zero, logreplay is the only practical choice, even though delta_datashipping could need much less memory on a shared DR VM.
    fr: |
      Les modes d'opération doivent être homogènes sur tous les niveaux d'une configuration multiniveau : vous ne pouvez pas utiliser logreplay entre les niveaux 1 et 2 et delta_datashipping pour le niveau 3. Comme delta_datashipping ne peut pas fournir un RPO nul, logreplay est le seul choix réaliste, même si delta_datashipping pourrait nécessiter beaucoup moins de mémoire sur une machine virtuelle de reprise partagée.
  options:
    b: { en: "delta_datashipping can't provide the RPO of zero required inside the primary region.", fr: "delta_datashipping ne peut pas fournir le RPO nul exigé dans la région primaire." }
    c: { en: "Mixing operation modes between tiers isn't supported.", fr: "Mélanger les modes d'opération entre niveaux n'est pas pris en charge." }
    d: { en: "Mixing operation modes isn't supported, and delta_datashipping doesn't meet the RPO of zero.", fr: "Mélanger les modes d'opération n'est pas pris en charge, et delta_datashipping ne permet pas le RPO nul." }
references:
  - title: SAP HANA availability across Azure regions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-availability-across-regions
