id: az120-3b-repl-anf-large-schedule
objective: "3.1.8"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Litware stores the archive and interface files of its SAP landscape on an Azure NetApp Files **large volume** of 120 TiB in availability zone 1. No application-level replication protects these files.

    Litware plans to configure cross-zone replication of the volume to availability zone 2. The solution must minimize the recovery point objective (RPO) after a zone outage.

    Which replication schedule should you configure?
  fr: |
    Litware stocke les fichiers d'archive et d'interface de son paysage SAP sur un **grand volume** Azure NetApp Files de 120 Tio dans la zone de disponibilité 1. Aucune réplication au niveau de l'application ne protège ces fichiers.

    Litware prévoit de configurer la réplication entre zones du volume vers la zone de disponibilité 2. La solution doit réduire au minimum l'objectif de point de récupération (RPO) après une panne de zone.

    Quelle planification de réplication devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Every 10 minutes", fr: "Toutes les 10 minutes" } }
    - { id: b, text: { en: "Hourly", fr: "Toutes les heures" } }
    - { id: c, text: { en: "Daily", fr: "Tous les jours" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure NetApp Files replication offers 10-minute, hourly and daily schedules, but large volumes support cross-zone replication only with an hourly or daily schedule. The hourly schedule is therefore the shortest interval available for this volume, which gives the lowest RPO.
    fr: |
      La réplication Azure NetApp Files propose des planifications toutes les 10 minutes, toutes les heures et tous les jours, mais les grands volumes ne prennent en charge la réplication entre zones qu'avec une planification horaire ou quotidienne. La planification horaire est donc l'intervalle le plus court disponible pour ce volume, ce qui donne le RPO le plus faible.
  options:
    a: { en: "The 10-minute schedule isn't available for cross-zone replication of a large volume.", fr: "La planification toutes les 10 minutes n'est pas disponible pour la réplication entre zones d'un grand volume." }
    c: { en: "A daily schedule is supported but gives a higher RPO than hourly.", fr: "Une planification quotidienne est prise en charge, mais elle donne un RPO plus élevé que la planification horaire." }
references:
  - title: Requirements and considerations for Azure NetApp Files replication
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/replication-requirements
