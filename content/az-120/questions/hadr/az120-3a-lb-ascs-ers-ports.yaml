id: az120-3a-lb-ascs-ers-ports
objective: "3.1.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum is configuring a Standard internal load balancer for a Pacemaker cluster on RHEL that hosts the ASCS instance (instance number 10) and the ERS instance (instance number 12) of an SAP system named **AD1**. Adatum follows the port conventions of Microsoft's guidance.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum configure un équilibreur de charge interne Standard pour un cluster Pacemaker sur RHEL qui héberge l'instance ASCS (numéro d'instance 10) et l'instance ERS (numéro d'instance 12) d'un système SAP nommé **AD1**. Adatum suit les conventions de ports des recommandations de Microsoft.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Number of frontend IP configurations: [[fe]]

      Health probe port for ASCS: [[ascs]]

      Health probe port for ERS: [[ers]]
    fr: |
      Nombre de configurations IP frontales : [[fe]]

      Port de la sonde d'intégrité de l'ASCS : [[ascs]]

      Port de la sonde d'intégrité de l'ERS : [[ers]]
  slots:
    - id: fe
      options:
        - { id: one, text: "1" }
        - { id: two, text: "2" }
        - { id: three, text: "3" }
    - id: ascs
      options:
        - { id: a62010, text: "62010" }
        - { id: a62510, text: "62510" }
        - { id: a62110, text: "62110" }
        - { id: a3210, text: "3210" }
    - id: ers
      options:
        - { id: e62012, text: "62012" }
        - { id: e62112, text: "62112" }
        - { id: e62612, text: "62612" }
        - { id: e62010, text: "62010" }
answer:
  values: { fe: two, ascs: a62010, ers: e62112 }
explanation:
  correct:
    en: ASCS and ERS each have their own virtual IP address, so the load balancer needs two frontend IP configurations, two probes and two rules. Microsoft's convention is 620<instance number> for the ASCS probe (62010) and 621<instance number> for the ERS probe (62112). Each probe is answered by the azure-lb resource of the matching cluster group.
    fr: L'ASCS et l'ERS ont chacun leur propre adresse IP virtuelle ; l'équilibreur de charge a donc besoin de deux configurations IP frontales, de deux sondes et de deux règles. La convention de Microsoft est 620<numéro d'instance> pour la sonde ASCS (62010) et 621<numéro d'instance> pour la sonde ERS (62112). Chaque sonde reçoit la réponse de la ressource azure-lb du groupe de cluster correspondant.
  options:
    one: { en: "One frontend can't represent two virtual IPs that may run on different nodes.", fr: "Une seule adresse frontale ne peut pas représenter deux adresses IP virtuelles qui peuvent s'exécuter sur des nœuds différents." }
    a62510: { en: "625<instance> is the probe convention for the HANA database, not ASCS.", fr: "625<instance> est la convention de sonde de la base de données HANA, pas de l'ASCS." }
    e62012: { en: "62012 follows the ASCS pattern (620); the ERS probe uses 621<instance>.", fr: "62012 suit le modèle ASCS (620) ; la sonde ERS utilise 621<instance>." }
    e62010: { en: "62010 is the ASCS probe port; each instance needs its own probe.", fr: "62010 est le port de la sonde ASCS ; chaque instance a besoin de sa propre sonde." }
references:
  - title: Azure Virtual Machines HA for SAP NW on RHEL
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-rhel
