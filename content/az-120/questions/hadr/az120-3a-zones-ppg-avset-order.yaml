id: az120-3a-zones-ppg-avset-order
objective: "3.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys runs SAP NetWeaver across availability zones 1 and 2. Measurements show that the latency between the application servers and the database is too high when application servers run in a zone other than the active database and ASCS/SCS instance. Wingtip decides to keep the application servers of the production system in zone 1, spread across fault domains, close to the ASCS/SCS VM.

    You need to deploy the zone 1 VMs of the system by combining an availability zone and an availability set.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys exécute SAP NetWeaver dans les zones de disponibilité 1 et 2. Les mesures montrent que la latence entre les serveurs d'applications et la base de données est trop élevée lorsque les serveurs d'applications s'exécutent dans une autre zone que la base de données active et l'instance ASCS/SCS. Wingtip décide de conserver les serveurs d'applications du système de production dans la zone 1, répartis entre des domaines d'erreur, à proximité de la machine virtuelle ASCS/SCS.

    Vous devez déployer les machines virtuelles de la zone 1 du système en combinant une zone de disponibilité et un groupe à haute disponibilité.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: ppg, text: { en: "Create a proximity placement group.", fr: "Créer un groupe de placement de proximité." } }
    - { id: anchor, text: { en: "Deploy the ASCS/SCS VM in zone 1 and reference the proximity placement group.", fr: "Déployer la machine virtuelle ASCS/SCS dans la zone 1 en référençant le groupe de placement de proximité." } }
    - { id: avset, text: { en: "Create an availability set that references the proximity placement group.", fr: "Créer un groupe à haute disponibilité qui référence le groupe de placement de proximité." } }
    - { id: app, text: { en: "Deploy the application server VMs in the availability set and the proximity placement group.", fr: "Déployer les machines virtuelles de serveur d'applications dans le groupe à haute disponibilité et le groupe de placement de proximité." } }
    - { id: vmss, text: { en: "Create a flexible scale set with FD=1 that references the proximity placement group.", fr: "Créer un groupe de machines virtuelles identiques flexible avec FD=1 qui référence le groupe de placement de proximité." } }
    - { id: avzone, text: { en: "Create an availability set and specify zone 1 as its availability zone.", fr: "Créer un groupe à haute disponibilité et spécifier la zone 1 comme zone de disponibilité." } }
answer:
  sequence: [ ppg, anchor, avset, app ]
explanation:
  correct:
    en: An availability set can't be placed in a zone directly; the proximity placement group links them. You create the proximity placement group, deploy the anchor VM (Microsoft recommends the ASCS/SCS VM) in a zone so the group is pinned to that zone's datacenter, then create the availability set that references the group, and finally deploy the application VMs into the set and the group.
    fr: "Un groupe à haute disponibilité ne peut pas être placé directement dans une zone : c'est le groupe de placement de proximité qui les relie. Vous créez le groupe de placement de proximité, vous déployez la machine virtuelle d'ancrage (Microsoft recommande la machine virtuelle ASCS/SCS) dans une zone pour que le groupe soit fixé au centre de données de cette zone, puis vous créez le groupe à haute disponibilité qui référence le groupe, et enfin vous déployez les machines virtuelles d'applications dans le groupe à haute disponibilité et le groupe de placement de proximité."
  options:
    vmss: { en: "Microsoft advises against combining a proximity placement group with a flexible scale set with FD=1, and the scenario asks for an availability set.", fr: "Microsoft déconseille de combiner un groupe de placement de proximité avec un groupe flexible avec FD=1, et le scénario demande un groupe à haute disponibilité." }
    avzone: { en: "An availability set has no zone property; it can only be aligned with a zone through a proximity placement group.", fr: "Un groupe à haute disponibilité n'a pas de propriété de zone ; il ne peut être aligné sur une zone que par un groupe de placement de proximité." }
references:
  - title: Configuration options to minimize network latency with SAP applications
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/proximity-placement-scenarios
