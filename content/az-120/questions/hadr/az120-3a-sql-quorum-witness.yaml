id: az120-3a-sql-quorum-witness
objective: "3.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware operates three two-node Windows Server failover clusters for SQL Server on Azure VMs.

    | Cluster | Description |
    | --- | --- |
    | CL1 | Always On availability group for an SAP database, Windows Server 2022, nodes in availability zones 1 and 2 |
    | CL2 | Failover cluster instance for a non-SAP reporting database, Windows Server 2022, data on Azure shared disks |
    | CL3 | Legacy cluster on Windows Server 2012 R2 |

    You need to recommend a quorum witness for each cluster, following Microsoft's guidance.

    Which witness should you recommend for each cluster? To answer, drag the appropriate witness types to the correct clusters. Each witness type may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exploite trois clusters de basculement Windows Server à deux nœuds pour SQL Server sur des machines virtuelles Azure.

    | Cluster | Description |
    | --- | --- |
    | CL1 | Groupe de disponibilité Always On pour une base de données SAP, Windows Server 2022, nœuds dans les zones de disponibilité 1 et 2 |
    | CL2 | Instance de cluster de basculement pour une base de données de reporting non SAP, Windows Server 2022, données sur des disques partagés Azure |
    | CL3 | Cluster hérité sur Windows Server 2012 R2 |

    Vous devez recommander un témoin de quorum pour chaque cluster, conformément aux recommandations de Microsoft.

    Quel témoin devez-vous recommander pour chaque cluster ? Pour répondre, faites glisser les types de témoin appropriés vers les clusters correspondants. Chaque type de témoin peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: cloud, text: { en: "Cloud witness", fr: "Témoin cloud" } }
    - { id: disk, text: { en: "Disk witness", fr: "Témoin disque" } }
    - { id: fsw, text: { en: "File share witness", fr: "Témoin de partage de fichiers" } }
    - { id: none, text: { en: "No witness (node majority)", fr: "Aucun témoin (majorité de nœuds)" } }
  targets:
    - { id: cl1, text: CL1 }
    - { id: cl2, text: CL2 }
    - { id: cl3, text: CL3 }
answer:
  mapping: { cl1: cloud, cl2: disk, cl3: fsw }
explanation:
  correct:
    en: Microsoft recommends a disk witness for a failover cluster instance on Azure shared disks and a cloud witness whenever possible otherwise; the cloud witness is ideal for multi-zone deployments such as CL1. Windows Server 2012 R2 doesn't support a cloud witness, so CL3 uses a file share witness. A two-node cluster always needs a witness to provide the third vote.
    fr: "Microsoft recommande un témoin disque pour une instance de cluster de basculement sur des disques partagés Azure, et un témoin cloud dans tous les autres cas où c'est possible ; le témoin cloud est idéal pour les déploiements multizones comme CL1. Windows Server 2012 R2 ne prend pas en charge le témoin cloud : CL3 utilise donc un témoin de partage de fichiers. Un cluster à deux nœuds a toujours besoin d'un témoin pour fournir le troisième vote."
references:
  - title: Configure Cluster Quorum - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/hadr-cluster-quorum-configure-how-to
