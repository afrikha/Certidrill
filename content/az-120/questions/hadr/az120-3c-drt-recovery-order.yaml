id: az120-3c-drt-recovery-order
objective: "3.2.8"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Adatum is preparing a full DR exercise for its SAP S/4HANA landscape. During the exercise, the landscape will be recovered in the DR region. The exercise must validate the dependency order of the services.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum prépare un exercice complet de reprise d'activité pour son paysage SAP S/4HANA. Pendant l'exercice, le paysage sera récupéré dans la région de reprise. L'exercice doit valider l'ordre de dépendance des services.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: adds, text: { en: "Validate that AD DS and DNS respond in the DR region.", fr: "Vérifier qu'AD DS et le DNS répondent dans la région de reprise." } }
    - { id: db, text: { en: "Bring the SAP HANA database online in the DR region.", fr: "Mettre en ligne la base de données SAP HANA dans la région de reprise." } }
    - { id: ascs, text: { en: "Start the ASCS/ERS instances and their cluster.", fr: "Démarrer les instances ASCS/ERS et leur cluster." } }
    - { id: app, text: { en: "Start the application servers.", fr: "Démarrer les serveurs d'applications." } }
    - { id: wd, text: { en: "Start the SAP Web Dispatcher and open access to users.", fr: "Démarrer SAP Web Dispatcher et ouvrir l'accès aux utilisateurs." } }
    - { id: commit, text: { en: "Commit the failover of the Site Recovery VMs.", fr: "Valider (Commit) le basculement des machines virtuelles Site Recovery." } }
    - { id: lbasr, text: { en: "Replicate the ASCS/ERS internal load balancer with Site Recovery.", fr: "Répliquer l'équilibreur de charge interne ASCS/ERS avec Site Recovery." } }
answer:
  sequence: [ adds, db, ascs, app, wd ]
explanation:
  correct:
    en: |
      AD and DNS must work before SAP and non-SAP systems are recovered. Dependencies come first: the database, then central services (message and enqueue servers), then the application servers that connect to both, and finally the Web Dispatcher so that users reach the system only when it's ready.
    fr: |
      AD et le DNS doivent fonctionner avant la récupération des systèmes SAP et non SAP. Les dépendances passent en premier : la base de données, puis les services centraux (serveurs de messages et de mise en file d'attente), puis les serveurs d'applications qui se connectent aux deux, et enfin le Web Dispatcher, pour que les utilisateurs n'atteignent le système que lorsqu'il est prêt.
  options:
    commit: { en: "Commit only confirms a failover and deletes the recovery points of the VMs; it doesn't bring any SAP layer online.", fr: "Commit ne fait que confirmer un basculement et supprime les points de récupération des machines virtuelles ; il ne met en ligne aucune couche SAP." }
    lbasr: { en: "Site Recovery doesn't replicate Azure Load Balancer; the DR load balancer is created separately, before or after failover.", fr: "Site Recovery ne réplique pas Azure Load Balancer ; l'équilibreur de charge de reprise est créé séparément, avant ou après le basculement." }
references:
  - title: Disaster recovery guidelines for SAP application
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-sap-guide
  - title: About recovery plans in Azure Site Recovery
    url: https://learn.microsoft.com/en-us/azure/site-recovery/recovery-plan-overview
