id: az120-3c-cfg-streaming-order
objective: "3.2.6"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Proseware runs an SAP HANA database on an Azure VM named **hdb-prd** in Germany West Central. Outbound connectivity to Azure Backup, Azure Storage and Microsoft Entra ID is already configured. No Recovery Services vault exists.

    You need to protect the database with Azure Backup streaming backups.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware exécute une base de données SAP HANA sur une machine virtuelle Azure nommée **hdb-prd** en Germany West Central. La connectivité sortante vers Sauvegarde Azure, Stockage Azure et Microsoft Entra ID est déjà configurée. Aucun coffre Recovery Services n'existe.

    Vous devez protéger la base de données avec des sauvegardes en streaming de Sauvegarde Azure.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: vault, text: { en: "Create a Recovery Services vault in Germany West Central.", fr: "Créer un coffre Recovery Services en Germany West Central." } }
    - { id: script, text: { en: "Run the pre-registration script on hdb-prd as root.", fr: "Exécuter le script de préinscription sur hdb-prd en tant que root." } }
    - { id: discover, text: { en: "Select hdb-prd in the vault and run Discover DBs.", fr: "Sélectionner hdb-prd dans le coffre et lancer Discover DBs." } }
    - { id: configure, text: { en: "Select the databases and assign a backup policy, then enable backup.", fr: "Sélectionner les bases de données et attribuer une stratégie de sauvegarde, puis activer la sauvegarde." } }
    - { id: bvault, text: { en: "Create a Backup vault in Germany West Central.", fr: "Créer un coffre de sauvegarde en Germany West Central." } }
    - { id: ext, text: { en: "Install the backup extension manually from the Extensions blade of hdb-prd.", fr: "Installer manuellement l'extension de sauvegarde depuis le panneau Extensions de hdb-prd." } }
answer:
  sequence: [ vault, script, discover, configure ]
explanation:
  correct:
    en: |
      SAP HANA backup uses a Recovery Services vault in the same region as the VM. The pre-registration script must run before discovery, which registers the VM with the vault and installs the workload extension. You then select the databases, choose a policy and enable backup.
    fr: |
      La sauvegarde SAP HANA utilise un coffre Recovery Services dans la même région que la machine virtuelle. Le script de préinscription doit être exécuté avant la découverte, qui inscrit la machine virtuelle auprès du coffre et installe l'extension de charge de travail. Vous sélectionnez ensuite les bases, choisissez une stratégie et activez la sauvegarde.
  options:
    bvault: { en: "SAP HANA in Azure VM is protected in a Recovery Services vault, not a Backup vault.", fr: "SAP HANA dans une machine virtuelle Azure est protégé dans un coffre Recovery Services, pas dans un coffre de sauvegarde." }
    ext: { en: "Discovery installs the extension; no manual installation is needed.", fr: "La découverte installe l'extension ; aucune installation manuelle n'est nécessaire." }
references:
  - title: Back up SAP HANA databases in Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-sap-hana-database
