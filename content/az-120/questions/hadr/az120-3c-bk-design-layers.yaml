id: az120-3c-bk-design-layers
objective: "3.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind runs SAP S/4HANA on Azure in a single region:

    - The SAP HANA database (12 TB, standalone, no HANA System Replication) runs on Premium SSD managed disks formatted with xfs.
    - The application servers use Premium SSD v2 data disks.

    The backup requirements are:

    - The whole HANA instance must be restorable within minutes, whatever the database size, and point-in-time recovery must remain possible.
    - The application servers need an RPO of 4 hours.

    What should you include in the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind exécute SAP S/4HANA sur Azure dans une seule région :

    - La base de données SAP HANA (12 To, autonome, sans réplication du système HANA) s'exécute sur des disques managés SSD Premium formatés en xfs.
    - Les serveurs d'applications utilisent des disques de données SSD Premium v2.

    Les exigences de sauvegarde sont les suivantes :

    - L'instance HANA entière doit pouvoir être restaurée en quelques minutes, quelle que soit la taille de la base, et la récupération à un point dans le temps doit rester possible.
    - Les serveurs d'applications ont besoin d'un RPO de 4 heures.

    Que devez-vous inclure dans la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      SAP HANA database: [[db]]

      Application servers: [[app]]
    fr: |
      Base de données SAP HANA : [[db]]

      Serveurs d'applications : [[app]]
  slots:
    - id: db
      options:
        - { id: stream, text: { en: "Streaming (Backint) backups only", fr: "Sauvegardes en streaming (Backint) uniquement" } }
        - { id: snap, text: { en: "HANA instance snapshots with streaming log backups", fr: "Instantanés d'instance HANA avec sauvegardes de journaux en streaming" } }
        - { id: vmenh, text: { en: "Azure VM backup with an Enhanced policy", fr: "Sauvegarde de machine virtuelle Azure avec une stratégie Enhanced" } }
        - { id: asr, text: { en: "Azure Site Recovery replication", fr: "Réplication Azure Site Recovery" } }
    - id: app
      options:
        - { id: std, text: { en: "Azure VM backup, Standard policy, daily", fr: "Sauvegarde de machine virtuelle Azure, stratégie Standard, quotidienne" } }
        - { id: enh4, text: { en: "Azure VM backup, Enhanced policy, every 4 hours", fr: "Sauvegarde de machine virtuelle Azure, stratégie Enhanced, toutes les 4 heures" } }
        - { id: enh24, text: { en: "Azure VM backup, Enhanced policy, every 24 hours", fr: "Sauvegarde de machine virtuelle Azure, stratégie Enhanced, toutes les 24 heures" } }
        - { id: asrapp, text: { en: "Azure Site Recovery replication", fr: "Réplication Azure Site Recovery" } }
answer:
  values: { db: snap, app: enh4 }
explanation:
  correct:
    en: HANA instance snapshots provide HANA-consistent managed disk snapshots with instant backup and restore regardless of the database size, on ext3 or xfs; log backups still stream through Backint and are replayed for point-in-time recovery. Premium SSD v2 disks require the Enhanced VM policy, and its hourly schedule supports a backup every 4 hours.
    fr: Les instantanés d'instance HANA fournissent des instantanés de disques managés cohérents avec HANA, avec sauvegarde et restauration instantanées quelle que soit la taille de la base, sur ext3 ou xfs ; les sauvegardes de journaux passent toujours en streaming par Backint et sont rejouées pour la récupération à un point dans le temps. Les disques SSD Premium v2 exigent la stratégie de machine virtuelle Enhanced, dont la planification horaire permet une sauvegarde toutes les 4 heures.
  options:
    stream: { en: "Restoring 12 TB from the vault takes hours; streaming alone doesn't give instant restore.", fr: "Restaurer 12 To depuis le coffre prend des heures ; le streaming seul n'offre pas de restauration instantanée." }
    vmenh: { en: "A VM backup isn't HANA-aware and gives no log-based point-in-time recovery.", fr: "Une sauvegarde de machine virtuelle ne tient pas compte de HANA et n'offre pas de récupération à un point dans le temps par les journaux." }
    std: { en: "The Standard policy doesn't support Premium SSD v2 and runs only once a day.", fr: "La stratégie Standard ne prend pas en charge le SSD Premium v2 et ne s'exécute qu'une fois par jour." }
    enh24: { en: "A 24-hour schedule doesn't meet the 4-hour RPO.", fr: "Une planification de 24 heures ne respecte pas le RPO de 4 heures." }
    asr: { en: "Site Recovery is a disaster recovery replication, not a backup, and isn't recommended for databases.", fr: "Site Recovery est une réplication de reprise d'activité, pas une sauvegarde, et n'est pas recommandé pour les bases de données." }
    asrapp: { en: "Site Recovery replicates to another region; it doesn't keep backup recovery points.", fr: "Site Recovery réplique vers une autre région ; il ne conserve pas de points de récupération de sauvegarde." }
references:
  - title: About SAP HANA database backup on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-about
  - title: Back up Azure VMs with the Enhanced policy
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-vms-enhanced-policy
