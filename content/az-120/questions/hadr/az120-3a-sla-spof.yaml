id: az120-3a-sla-spof
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is designing an SAP NetWeaver ABAP system on Azure VMs. The business requires an availability that the single-VM SLA cannot provide. To control cost, Northwind wants to configure a failover cluster only for the components that are single points of failure. All other components will be made highly available through redundancy.

    Which two components should you protect with a failover cluster?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders conçoit un système SAP NetWeaver ABAP sur des machines virtuelles Azure. L'entreprise exige une disponibilité que le SLA d'une machine virtuelle unique ne peut pas fournir. Pour maîtriser les coûts, Northwind veut configurer un cluster de basculement uniquement pour les composants qui constituent des points de défaillance uniques. Tous les autres composants seront rendus hautement disponibles par la redondance.

    Quels sont les deux composants que vous devez protéger avec un cluster de basculement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The primary application server (PAS) instance", fr: "L'instance du serveur d'applications principal (PAS)" } }
    - { id: b, text: { en: "The ASCS/SCS instance", fr: "L'instance ASCS/SCS" } }
    - { id: c, text: { en: "The additional application server (AAS) instances", fr: "Les instances de serveur d'applications supplémentaire (AAS)" } }
    - { id: d, text: { en: "The database management system (DBMS)", fr: "Le système de gestion de base de données (SGBD)" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: The ASCS/SCS instance (message and enqueue servers) and the DBMS exist once per SAP system, so each is a single point of failure that requires a failover cluster (Pacemaker or Windows Server Failover Clustering) to reach a higher availability. Application server instances get their availability from redundancy, by running at least two instances on two VMs.
    fr: L'instance ASCS/SCS (serveurs de messages et de mise en file d'attente) et le SGBD n'existent qu'une fois par système SAP ; chacun est donc un point de défaillance unique qui nécessite un cluster de basculement (Pacemaker ou clustering de basculement Windows Server) pour atteindre une disponibilité supérieure. Les instances de serveur d'applications obtiennent leur disponibilité par la redondance, en exécutant au moins deux instances sur deux machines virtuelles.
  options:
    a: { en: "The PAS is an application server instance; users can log on to the other instances, so redundancy is enough.", fr: "Le PAS est une instance de serveur d'applications ; les utilisateurs peuvent se connecter aux autres instances, la redondance suffit donc." }
    c: { en: "AAS instances are protected by deploying several of them on different VMs, not by clustering.", fr: "Les instances AAS sont protégées en en déployant plusieurs sur des machines virtuelles différentes, et non par un cluster." }
references:
  - title: Azure VMs HA architecture and scenarios for SAP NetWeaver
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-high-availability-architecture-scenarios
