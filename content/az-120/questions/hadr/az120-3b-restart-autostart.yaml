id: az120-3b-restart-autostart
objective: "3.1.9"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank runs an SAP NetWeaver system that has a Pacemaker cluster for the ASCS and ERS instances and four non-clustered application server instances, each on its own VM. Woodgrove wants each application server instance to start automatically when its VM restarts after an Azure host failure.

    How should you complete the operating guidelines? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank exécute un système SAP NetWeaver qui comporte un cluster Pacemaker pour les instances ASCS et ERS, et quatre instances de serveur d'applications hors cluster, chacune sur sa propre machine virtuelle. Woodgrove veut que chaque instance de serveur d'applications démarre automatiquement lorsque sa machine virtuelle redémarre après une panne d'hôte Azure.

    Comment devez-vous compléter les consignes d'exploitation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Add the line `Autostart = 1` to [[prof]].

      Before running Software Update Manager (SUM): [[sum]]

      For the clustered ASCS and ERS instances: [[clu]]
    fr: |
      Ajouter la ligne `Autostart = 1` dans [[prof]].

      Avant d'exécuter Software Update Manager (SUM) : [[sum]]

      Pour les instances ASCS et ERS en cluster : [[clu]]
  slots:
    - id: prof
      options:
        - { id: start, text: { en: "the start profile of each application server instance", fr: "le profil de démarrage de chaque instance de serveur d'applications" } }
        - { id: default, text: { en: "the DEFAULT.PFL profile of the system", fr: "le profil DEFAULT.PFL du système" } }
        - { id: fstab, text: { en: "the /etc/fstab file of each application server VM", fr: "le fichier /etc/fstab de chaque machine virtuelle de serveur d'applications" } }
    - id: sum
      options:
        - { id: disable, text: { en: "disable Autostart on the application server instances.", fr: "désactiver Autostart sur les instances de serveur d'applications." } }
        - { id: keep, text: { en: "keep Autostart enabled so that SUM restarts the instances.", fr: "conserver Autostart pour que SUM redémarre les instances." } }
        - { id: ers, text: { en: "also enable Autostart on the ERS instance.", fr: "activer aussi Autostart sur l'instance ERS." } }
    - id: clu
      options:
        - { id: none, text: { en: "don't use Autostart; the cluster starts them.", fr: "ne pas utiliser Autostart ; c'est le cluster qui les démarre." } }
        - { id: both, text: { en: "use Autostart so that they start before Pacemaker.", fr: "utiliser Autostart pour qu'elles démarrent avant Pacemaker." } }
        - { id: ersonly, text: { en: "use Autostart on the ERS instance only.", fr: "utiliser Autostart uniquement sur l'instance ERS." } }
answer:
  values: { prof: start, sum: disable, clu: none }
explanation:
  correct:
    en: |
      Autostart = 1 goes into the start profile of the ABAP or Java instance; the instance then starts when its SAP service starts at boot (SAP KBA 1909114). SUM and other lifecycle tasks restart SAP services and don't expect automatic instance starts, so disable Autostart before running them. Clustered instances such as ASCS/SCS and ERS must not use Autostart, because the cluster controls where and when they start.
    fr: |
      Autostart = 1 se place dans le profil de démarrage de l'instance ABAP ou Java ; l'instance démarre alors quand son service SAP démarre au boot (KBA SAP 1909114). SUM et les autres tâches de cycle de vie redémarrent des services SAP et n'attendent pas de démarrage automatique des instances : désactivez donc Autostart avant de les exécuter. Les instances en cluster comme ASCS/SCS et ERS ne doivent pas utiliser Autostart, car c'est le cluster qui décide où et quand elles démarrent.
  options:
    default: { en: "Autostart is set per instance in its start profile, not for the whole system.", fr: "Autostart se définit par instance, dans son profil de démarrage, pas pour tout le système." }
    keep: { en: "Automatic starts interfere with SUM, which doesn't expect them.", fr: "Les démarrages automatiques perturbent SUM, qui ne les attend pas." }
    both: { en: "Starting clustered instances outside the cluster conflicts with Pacemaker's control of the resources.", fr: "Démarrer des instances en cluster en dehors du cluster entre en conflit avec le contrôle des ressources par Pacemaker." }
    ersonly: { en: "Microsoft's guide removes Autostart from the ERS profile as well.", fr: "Le guide de Microsoft supprime aussi Autostart du profil ERS." }
references:
  - title: Utilize Azure infrastructure VM restart to achieve "higher availability" of an SAP system
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-higher-availability-architecture-scenarios
  - title: High availability for SAP NetWeaver on Azure VMs on SUSE Linux Enterprise Server for SAP applications
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse
