id: az120-3a-pcmk-rhel-setup-order
objective: "3.1.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders deployed two RHEL 9 VMs named **sap-cl1** and **sap-cl2** for an SAP ASCS/ERS cluster. The pcs, pacemaker and fence agent packages are installed on both VMs, name resolution works, and the firewall allows the high-availability service.

    You need to create the Pacemaker cluster by following Microsoft's guidance.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders a déployé deux machines virtuelles RHEL 9 nommées **sap-cl1** et **sap-cl2** pour un cluster SAP ASCS/ERS. Les packages pcs, pacemaker et de l'agent de clôture sont installés sur les deux machines virtuelles, la résolution de noms fonctionne et le pare-feu autorise le service high-availability.

    Vous devez créer le cluster Pacemaker en suivant les recommandations de Microsoft.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: pw, text: { en: "Set the same password for the hacluster user on both VMs.", fr: "Définir le même mot de passe pour l'utilisateur hacluster sur les deux machines virtuelles." } }
    - { id: pcsd, text: { en: "Start and enable pcsd.service on both VMs.", fr: "Démarrer et activer pcsd.service sur les deux machines virtuelles." } }
    - { id: auth, text: { en: "On sap-cl1, run pcs host auth sap-cl1 sap-cl2 -u hacluster.", fr: "Sur sap-cl1, exécuter pcs host auth sap-cl1 sap-cl2 -u hacluster." } }
    - { id: setup, text: { en: "On sap-cl1, run pcs cluster setup with both nodes and totem token=30000.", fr: "Sur sap-cl1, exécuter pcs cluster setup avec les deux nœuds et totem token=30000." } }
    - { id: start, text: { en: "On sap-cl1, run pcs cluster start --all.", fr: "Sur sap-cl1, exécuter pcs cluster start --all." } }
    - { id: crminit, text: { en: "On sap-cl1, run crm cluster init with both nodes.", fr: "Sur sap-cl1, exécuter crm cluster init avec les deux nœuds." } }
    - { id: stonithoff, text: { en: "Set the stonith-enabled cluster property to false until the cluster is started.", fr: "Définir la propriété de cluster stonith-enabled sur false jusqu'au démarrage du cluster." } }
answer:
  sequence: [ pw, pcsd, auth, setup, start ]
explanation:
  correct:
    en: The pcsd daemon authenticates nodes with the hacluster account, so the password must be set before pcsd is started and before pcs host auth runs. pcs cluster setup then writes the corosync configuration, with the token set to 30000 ms as Microsoft recommends, and pcs cluster start --all starts the cluster on both nodes. Fencing is configured afterward.
    fr: Le démon pcsd authentifie les nœuds avec le compte hacluster ; le mot de passe doit donc être défini avant le démarrage de pcsd et l'exécution de pcs host auth. pcs cluster setup écrit ensuite la configuration corosync, avec le jeton défini à 30000 ms comme le recommande Microsoft, et pcs cluster start --all démarre le cluster sur les deux nœuds. L'isolation est configurée ensuite.
  options:
    crminit: { en: "crm cluster init is the crmsh command used on SLES; RHEL clusters are created with pcs.", fr: "crm cluster init est la commande crmsh utilisée sur SLES ; les clusters RHEL se créent avec pcs." }
    stonithoff: { en: "Microsoft's guidance never disables STONITH; the fencing device is configured after the cluster starts, with stonith-enabled=true.", fr: "Les recommandations de Microsoft ne désactivent jamais STONITH ; le périphérique d'isolation est configuré après le démarrage du cluster, avec stonith-enabled=true." }
references:
  - title: Set up Pacemaker on RHEL in Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-rhel-pacemaker
