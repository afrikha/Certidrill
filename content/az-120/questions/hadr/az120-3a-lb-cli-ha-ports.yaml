id: az120-3a-lb-cli-ha-ports
objective: "3.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are scripting the Standard internal load balancer named **lb-nw1** for the ASCS/SCS cluster of an SAP system. The frontend IP configuration **fe-ascs**, the backend pool **be-nw1** and the health probe **probe-ascs** already exist.

    You need to create the load-balancing rule for the ASCS/SCS frontend. The rule must forward all TCP and UDP ports to the node that answers the probe and must preserve the frontend IP address as the destination of the packets.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez un script pour l'équilibreur de charge interne Standard nommé **lb-nw1** du cluster ASCS/SCS d'un système SAP. La configuration IP frontale **fe-ascs**, le pool principal **be-nw1** et la sonde d'intégrité **probe-ascs** existent déjà.

    Vous devez créer la règle d'équilibrage de charge de l'adresse frontale ASCS/SCS. La règle doit transférer tous les ports TCP et UDP vers le nœud qui répond à la sonde et doit conserver l'adresse IP frontale comme destination des paquets.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network lb rule create \
      --resource-group rg-sap-prd \
      --lb-name lb-nw1 \
      --name rule-ascs \
      --frontend-ip fe-ascs \
      --backend-pool-name be-nw1 \
      --probe-name probe-ascs \
      --protocol [[proto]] \
      --frontend-port [[port]] \
      --backend-port [[port2]] \
      --floating-ip [[fip]] \
      --idle-timeout 30
  slots:
    - id: proto
      options:
        - { id: all, text: All }
        - { id: tcp, text: Tcp }
        - { id: udp, text: Udp }
    - id: port
      options:
        - { id: f0, text: "0" }
        - { id: f3200, text: "3200" }
        - { id: f62000, text: "62000" }
    - id: port2
      options:
        - { id: b0, text: "0" }
        - { id: b3600, text: "3600" }
        - { id: b62000, text: "62000" }
    - id: fip
      options:
        - { id: t, text: "true" }
        - { id: f, text: "false" }
answer:
  values: { proto: all, port: f0, port2: b0, fip: t }
explanation:
  correct:
    en: An HA ports rule is created with the protocol All and the frontend and backend ports set to 0, which load-balances every TCP and UDP port. Floating IP must be enabled so the packets keep the frontend IP address as their destination, which the cluster's virtual IP (IPaddr2) accepts on the active node.
    fr: Une règle de ports haute disponibilité se crée avec le protocole All et les ports frontal et principal à 0, ce qui équilibre tous les ports TCP et UDP. L'IP flottante doit être activée pour que les paquets conservent l'adresse IP frontale comme destination ; l'adresse IP virtuelle du cluster (IPaddr2) les accepte sur le nœud actif.
  options:
    tcp: { en: "Tcp limits the rule to one protocol and requires a specific port, so it isn't an HA ports rule.", fr: "Tcp limite la règle à un protocole et exige un port précis : ce n'est pas une règle de ports haute disponibilité." }
    f3200: { en: "Port 3200 would balance only the dispatcher port, not all ports.", fr: "Le port 3200 n'équilibrerait que le port du répartiteur, pas tous les ports." }
    f62000: { en: "62000 is the health probe port, not a frontend port of the rule.", fr: "62000 est le port de la sonde d'intégrité, pas un port frontal de la règle." }
    f: { en: "Without floating IP, the load balancer rewrites the destination to the VM's own IP address, and the cluster virtual IP is bypassed.", fr: "Sans IP flottante, l'équilibreur de charge remplace la destination par l'adresse IP de la machine virtuelle, et l'adresse IP virtuelle du cluster est contournée." }
references:
  - title: az network lb rule
    url: https://learn.microsoft.com/en-us/cli/azure/network/lb/rule
  - title: Azure VMs high availability for SAP NetWeaver on SLES
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse
