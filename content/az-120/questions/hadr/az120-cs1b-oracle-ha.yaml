id: az120-cs1b-oracle-ha
objective: "3.1.2"
type: single
caseStudy: az120-cs1b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a high availability solution for the LPP database across zones 1 and 2. The solution must meet the high availability requirement.

    What should you recommend?
  fr: |
    Vous devez recommander une solution de haute disponibilité pour la base de données de LPP entre les zones 1 et 2. La solution doit respecter l'exigence de haute disponibilité.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Oracle Data Guard with synchronous redo transport and Fast-Start Failover", fr: "Oracle Data Guard avec transport synchrone des journaux de restauration et Fast-Start Failover" } }
    - { id: b, text: { en: "Oracle Data Guard with synchronous redo transport and manual failover by the DBA", fr: "Oracle Data Guard avec transport synchrone des journaux de restauration et basculement manuel par le DBA" } }
    - { id: c, text: { en: "Azure Site Recovery zone-to-zone replication of the primary database VM", fr: "Réplication de zone à zone Azure Site Recovery de la machine virtuelle de base de données primaire" } }
    - { id: d, text: { en: "Premium SSD ZRS disks on the primary VM, reattached to a VM in zone 2 after a failure", fr: "Disques SSD Premium ZRS sur la machine virtuelle primaire, rattachés à une machine virtuelle de la zone 2 après une panne" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Oracle Data Guard is supported for high availability and disaster recovery of SAP on Azure. Automatic failover requires Fast-Start Failover, whose observer triggers the failover; synchronous redo transport keeps the standby current so that no committed transaction is lost.
    fr: |
      Oracle Data Guard est pris en charge pour la haute disponibilité et la reprise d'activité de SAP sur Azure. Le basculement automatique nécessite Fast-Start Failover, dont l'observateur déclenche le basculement ; le transport synchrone des journaux de restauration maintient la base de secours à jour afin qu'aucune transaction validée ne soit perdue.
  options:
    b:
      en: |
        Without Fast-Start Failover, Data Guard supports only a manual failover, which doesn't meet the automatic failover requirement.
      fr: |
        Sans Fast-Start Failover, Data Guard ne permet qu'un basculement manuel, ce qui ne respecte pas l'exigence de basculement automatique.
    c:
      en: |
        Microsoft recommends native database replication instead of Site Recovery for database VMs, because Site Recovery doesn't guarantee database consistency and has data churn limits; its failover is not automatic either.
      fr: |
        Microsoft recommande la réplication native de la base de données plutôt que Site Recovery pour les machines virtuelles de base de données, car Site Recovery ne garantit pas la cohérence de la base et a des limites de taux de modification ; son basculement n'est pas automatique non plus.
    d:
      en: |
        ZRS disks survive a zone failure, but reattaching them to another VM is a manual recovery, not an automatic database failover.
      fr: |
        Les disques ZRS survivent à une panne de zone, mais les rattacher à une autre machine virtuelle est une récupération manuelle, pas un basculement automatique de la base de données.
references:
  - title: Azure virtual machines Oracle database deployment for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/dbms-guide-oracle
  - title: Disaster recovery guidelines for SAP application
