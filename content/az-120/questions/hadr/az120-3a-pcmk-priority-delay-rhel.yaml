id: az120-3a-pcmk-priority-delay-rhel
objective: "3.1.6"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys runs SAP HANA in an existing two-node Pacemaker cluster on RHEL 9 that uses the Azure fence agent with `pcmk_delay_max=15`. Tailspin plans to run these commands:

    ```bash
    sudo pcs resource update rsc_SAPHanaController_HN1_HDB03 meta priority=100
    sudo pcs property set priority-fencing-delay=15s
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys exécute SAP HANA dans un cluster Pacemaker existant à deux nœuds sur RHEL 9 qui utilise l'agent de clôture Azure avec `pcmk_delay_max=15`. Tailspin prévoit d'exécuter ces commandes :

    ```bash
    sudo pcs resource update rsc_SAPHanaController_HN1_HDB03 meta priority=100
    sudo pcs property set priority-fencing-delay=15s
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After the change, in a network split, the node that runs the HANA primary is more likely to survive the fencing race.
        fr: Après la modification, en cas de partition du réseau, le nœud qui exécute le principal HANA a plus de chances de survivre à la course à l'isolation.
    - id: s2
      text:
        en: According to Microsoft's RHEL guidance, you should keep pcmk_delay_max on the fencing device after you set priority-fencing-delay.
        fr: Selon les recommandations de Microsoft pour RHEL, vous devez conserver pcmk_delay_max sur le périphérique d'isolation après avoir défini priority-fencing-delay.
    - id: s3
      text:
        en: The priority-fencing-delay property requires pacemaker-2.0.4-6.el8 or later.
        fr: La propriété priority-fencing-delay exige pacemaker-2.0.4-6.el8 ou version ultérieure.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: priority-fencing-delay delays the fencing of the node whose resources have the highest total priority, here the node that runs the promoted SAPHanaController with priority 100, so that node wins the race and HANA keeps running. Microsoft's RHEL guidance says to clear pcmk_delay_max from the fencing device when you add priority-fencing-delay to an existing cluster, and the property is available only from pacemaker-2.0.4-6.el8.
    fr: priority-fencing-delay retarde l'isolation du nœud dont les ressources ont la priorité totale la plus élevée, ici le nœud qui exécute le SAPHanaController promu avec la priorité 100 ; ce nœud gagne donc la course et HANA continue de s'exécuter. Les recommandations de Microsoft pour RHEL indiquent de supprimer pcmk_delay_max du périphérique d'isolation lorsque vous ajoutez priority-fencing-delay à un cluster existant, et la propriété n'est disponible qu'à partir de pacemaker-2.0.4-6.el8.
references:
  - title: High availability of SAP HANA on Azure VMs on RHEL
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability-rhel
  - title: Azure Virtual Machines HA for SAP NW on RHEL
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-rhel
