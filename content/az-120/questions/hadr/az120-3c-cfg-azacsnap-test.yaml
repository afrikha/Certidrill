id: az120-3c-cfg-azacsnap-test
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip runs SAP HANA on an Azure VM with its data volume on Azure NetApp Files. You installed AzAcSnap and created its configuration file.

    Before you schedule the snapshot backups, you need to verify that AzAcSnap can connect to the SAP HANA instance and create snapshots on the configured data volumes. The verification must not leave a snapshot behind.

    Which command should you run?
  fr: |
    Wingtip exécute SAP HANA sur une machine virtuelle Azure dont le volume de données se trouve sur Azure NetApp Files. Vous avez installé AzAcSnap et créé son fichier de configuration.

    Avant de planifier les sauvegardes par instantanés, vous devez vérifier qu'AzAcSnap peut se connecter à l'instance SAP HANA et créer des instantanés sur les volumes de données configurés. La vérification ne doit laisser aucun instantané.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "`azacsnap -c backup --volume data --prefix verify --retention 1`" }
    - { id: b, text: "`azacsnap -c test --test all`" }
    - { id: c, text: "`azacsnap -c details --details snapshots`" }
    - { id: d, text: "`azacsnap -c test --test hana`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `azacsnap -c test --test all` runs the hana test (connection to SYSTEMDB through hdbuserstore) and then the storage test, which creates a temporary snapshot on each configured data volume and removes it.
    fr: |
      `azacsnap -c test --test all` exécute le test hana (connexion à SYSTEMDB via hdbuserstore) puis le test storage, qui crée un instantané temporaire sur chaque volume de données configuré et le supprime.
  options:
    a: { en: "This takes a real database-consistent snapshot and keeps one snapshot with the verify prefix.", fr: "Cette commande prend un véritable instantané cohérent avec la base de données et conserve un instantané avec le préfixe verify." }
    c: { en: "The details command lists the existing snapshots of each volume; it doesn't test connectivity or snapshot creation.", fr: "La commande details répertorie les instantanés existants de chaque volume ; elle ne teste ni la connectivité ni la création d'instantanés." }
    d: { en: "The hana test checks only the connection to SAP HANA, not the storage interface.", fr: "Le test hana ne vérifie que la connexion à SAP HANA, pas l'interface de stockage." }
references:
  - title: Test Azure Application Consistent Snapshot tool for Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azacsnap-cmd-ref-test
