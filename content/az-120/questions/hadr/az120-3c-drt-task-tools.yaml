id: az120-3c-drt-task-tools
objective: "3.2.8"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is running a planned DR exercise for an SAP system. The application servers are protected by Azure Site Recovery, the SAP HANA database by asynchronous HANA System Replication, and the /sapmnt volume by Azure NetApp Files cross-region replication.

    Which action should you use for each task? To answer, drag the appropriate actions to the correct tasks. Each action may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam effectue un exercice de reprise planifié pour un système SAP. Les serveurs d'applications sont protégés par Azure Site Recovery, la base de données SAP HANA par la réplication du système HANA asynchrone, et le volume /sapmnt par la réplication interrégion Azure NetApp Files.

    Quelle action devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les actions appropriées vers les tâches correspondantes. Chaque action peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: tfo, text: { en: "Site Recovery Test Failover", fr: "Test Failover de Site Recovery" } }
    - { id: cleanup, text: { en: "Site Recovery Cleanup test failover", fr: "Cleanup test failover de Site Recovery" } }
    - { id: commit, text: { en: "Site Recovery Commit", fr: "Commit de Site Recovery" } }
    - { id: break, text: { en: "Azure NetApp Files Break Peering", fr: "Break Peering d'Azure NetApp Files" } }
    - { id: rresync, text: { en: "Azure NetApp Files Reverse Resync", fr: "Reverse Resync d'Azure NetApp Files" } }
    - { id: takeover, text: "hdbnsutil -sr_takeover" }
  targets:
    - id: t1
      text: { en: "Start copies of the application servers without interrupting replication", fr: "Démarrer des copies des serveurs d'applications sans interrompre la réplication" }
    - id: t2
      text: { en: "Make the DR copy of /sapmnt writable for the DR servers", fr: "Rendre accessible en écriture la copie de reprise de /sapmnt pour les serveurs de reprise" }
    - id: t3
      text: { en: "Make the DR HANA node the primary", fr: "Faire du nœud HANA de reprise le principal" }
    - id: t4
      text: { en: "Delete the drill VMs after validation", fr: "Supprimer les machines virtuelles de l'exercice après validation" }
answer:
  mapping: { t1: tfo, t2: break, t3: takeover, t4: cleanup }
explanation:
  correct:
    en: |
      A Site Recovery test failover creates the VMs in the target region without affecting replication, and Cleanup test failover deletes them afterwards. Azure NetApp Files failover is manual: breaking the replication peering lets clients read and write the destination volume. The cross-region HANA takeover is manual and runs on the DR node.
    fr: |
      Un test de basculement Site Recovery crée les machines virtuelles dans la région cible sans affecter la réplication, et Cleanup test failover les supprime ensuite. Le basculement Azure NetApp Files est manuel : la rupture du peering de réplication permet aux clients de lire et d'écrire sur le volume de destination. La prise de contrôle HANA interrégion est manuelle et s'exécute sur le nœud de reprise.
  options:
    commit: { en: "Commit applies to a real failover and deletes the recovery points; it isn't used to end a drill.", fr: "Commit s'applique à un véritable basculement et supprime les points de récupération ; il ne sert pas à terminer un exercice." }
    rresync: { en: "Reverse Resync copies data from the destination back to the source when you fail back.", fr: "Reverse Resync recopie les données de la destination vers la source lors de la restauration automatique." }
references:
  - title: Run a test failover (disaster recovery drill) to Azure
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-test-failover-to-azure
  - title: Manage disaster recovery using Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/cross-region-replication-manage-disaster-recovery
