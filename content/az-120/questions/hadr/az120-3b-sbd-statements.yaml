id: az120-3b-sbd-statements
objective: "3.1.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation runs two Pacemaker clusters on SLES in the West Europe region: one for the ASCS/ERS instances and one for the SAP HANA database of an SAP system. Both clusters will use SBD fencing.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation exécute deux clusters Pacemaker sur SLES dans la région West Europe : l'un pour les instances ASCS/ERS et l'autre pour la base de données SAP HANA d'un système SAP. Les deux clusters utiliseront une clôture SBD.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Each cluster node must load the softdog kernel module to provide the watchdog that SBD uses.
        fr: |
          Chaque nœud du cluster doit charger le module de noyau softdog pour fournir le watchdog qu'utilise SBD.
    - id: s2
      text:
        en: |
          To protect fencing against a regional outage, Adatum can place the iSCSI target servers in North Europe.
        fr: |
          Pour protéger la clôture contre une panne régionale, Adatum peut placer les serveurs cibles iSCSI dans North Europe.
    - id: s3
      text:
        en: |
          To reduce cost, Adatum can attach one Azure shared disk as the SBD device of both clusters.
        fr: |
          Pour réduire les coûts, Adatum peut attacher un même disque partagé Azure comme périphérique SBD des deux clusters.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      SBD in Azure relies on the software-emulated softdog watchdog, which Microsoft's guide loads on every node. The iSCSI target servers must be in the same region as the cluster, and the traffic to them must not go through non-redundant devices such as an NVA. An Azure shared disk used for SBD must not be attached across different Pacemaker clusters; each cluster needs its own device (with iSCSI, its own LUN).
    fr: |
      Dans Azure, SBD s'appuie sur le watchdog émulé par logiciel softdog, que le guide de Microsoft charge sur chaque nœud. Les serveurs cibles iSCSI doivent se trouver dans la même région que le cluster, et le trafic vers eux ne doit pas traverser d'équipements non redondants comme une NVA. Un disque partagé Azure utilisé pour SBD ne doit pas être attaché à plusieurs clusters Pacemaker ; chaque cluster a besoin de son propre périphérique (avec iSCSI, de son propre LUN).
references:
  - title: Set up Pacemaker on SUSE Linux Enterprise Server in Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-pacemaker
