id: az120-3b-net-er-single-circuit
objective: "3.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware connects its on-premises network to the SAP virtual network in the primary region through a single ExpressRoute circuit. Litware protects the SAP VMs with Azure Site Recovery and wants to keep the same IP addresses after failover, so the DR virtual network uses the same address space as the production virtual network. The DR virtual network already has an ExpressRoute gateway.

    You need to plan how on-premises users reach the SAP systems in the DR region after a failover.

    What should you include in the plan?
  fr: |
    Litware connecte son réseau local au réseau virtuel SAP de la région primaire par un seul circuit ExpressRoute. Litware protège les machines virtuelles SAP avec Azure Site Recovery et veut conserver les mêmes adresses IP après le basculement : le réseau virtuel de reprise utilise donc le même espace d'adressage que le réseau virtuel de production. Le réseau virtuel de reprise dispose déjà d'une passerelle ExpressRoute.

    Vous devez planifier la façon dont les utilisateurs locaux atteignent les systèmes SAP dans la région de reprise après un basculement.

    Que devez-vous inclure dans le plan ?
body:
  options:
    - { id: a, text: { en: "Connect the DR virtual network to the circuit now, so that both networks are connected before any failover.", fr: "Connecter dès maintenant le réseau virtuel de reprise au circuit, afin que les deux réseaux soient connectés avant tout basculement." } }
    - { id: b, text: { en: "During failover, disconnect the production network from the circuit, then connect the DR network, scripted in the recovery plan.", fr: "Pendant le basculement, déconnecter le réseau de production du circuit, puis connecter le réseau de reprise, par un script du plan de récupération." } }
    - { id: c, text: { en: "Peer the DR virtual network with the production network, and use the production gateway through gateway transit.", fr: "Relier par peering le réseau virtuel de reprise au réseau de production, et utiliser la passerelle de production par transit de passerelle." } }
    - { id: d, text: { en: "Add a second connection from the DR network to the circuit with a higher routing weight than production.", fr: "Ajouter une seconde connexion du réseau de reprise au circuit, avec un poids de routage supérieur à celui de la production." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Two virtual networks with overlapping address spaces can't be connected to the same circuit at the same time. With a single circuit and the same IP space in the target, you disconnect the source connection and then connect the target network, which you can script in the recovery plan. If the source region is unreachable, the disconnection may fail, which is why Microsoft recommends geo-redundant circuits or a different address space.
    fr: |
      Deux réseaux virtuels dont les espaces d'adressage se chevauchent ne peuvent pas être connectés au même circuit en même temps. Avec un seul circuit et le même espace IP sur la cible, vous déconnectez la connexion source puis connectez le réseau cible, ce qui peut être scripté dans le plan de récupération. Si la région source est inaccessible, la déconnexion peut échouer : c'est pourquoi Microsoft recommande des circuits géoredondants ou un espace d'adressage différent.
  options:
    a: { en: "Both networks use the same address space, so they can't be connected to the circuit at the same time.", fr: "Les deux réseaux utilisent le même espace d'adressage : ils ne peuvent pas être connectés au circuit en même temps." }
    c: { en: "Overlapping address spaces can't be peered, and the production gateway is lost with the primary region.", fr: "Des espaces d'adressage qui se chevauchent ne peuvent pas être reliés par peering, et la passerelle de production est perdue avec la région primaire." }
    d: { en: "A routing weight doesn't allow two overlapping networks on the same circuit.", fr: "Un poids de routage ne permet pas d'avoir deux réseaux qui se chevauchent sur le même circuit." }
references:
  - title: Integrate ExpressRoute with disaster recovery for Azure virtual machines
    url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-vm-disaster-recovery-with-expressroute
