id: az120-3c-drt-test-network
objective: "3.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove replicates the SAP application server VMs of its production system from France Central to France South by using Azure Site Recovery. The failover virtual network **vnet-dr-sap** in France South is peered with the production hub network.

    You need to run a disaster recovery drill of the application servers. The drill must not affect production and must avoid IP address and host name conflicts.

    Which virtual network should you select for the test failover?
  fr: |
    Woodgrove réplique les machines virtuelles des serveurs d'applications SAP de son système de production de France Central vers France South avec Azure Site Recovery. Le réseau virtuel de basculement **vnet-dr-sap** en France South est relié par peering au réseau hub de production.

    Vous devez effectuer un exercice de reprise d'activité des serveurs d'applications. L'exercice ne doit pas affecter la production et doit éviter les conflits d'adresses IP et de noms d'hôtes.

    Quel réseau virtuel devez-vous sélectionner pour le test de basculement ?
body:
  options:
    - { id: a, text: { en: "vnet-dr-sap, the failover network peered with the production hub", fr: "vnet-dr-sap, le réseau de basculement relié par peering au hub de production" } }
    - { id: b, text: { en: "An isolated virtual network in France South that mirrors the subnets of vnet-dr-sap", fr: "Un réseau virtuel isolé en France South qui reproduit les sous-réseaux de vnet-dr-sap" } }
    - { id: c, text: { en: "The production virtual network in France Central", fr: "Le réseau virtuel de production en France Central" } }
    - { id: d, text: { en: "A new subnet of vnet-dr-sap that is reserved for the test VMs", fr: "Un nouveau sous-réseau de vnet-dr-sap réservé aux machines virtuelles de test" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft recommends a test network isolated from production, with the same subnet names and address ranges, and DNS pointing to a test copy of AD DS and DNS. The test VMs can then start with their usual IP addresses without clashing with production, and replication continues during the drill.
    fr: |
      Microsoft recommande un réseau de test isolé de la production, avec les mêmes noms de sous-réseaux et plages d'adresses, et un DNS qui pointe vers une copie de test d'AD DS et du DNS. Les machines virtuelles de test peuvent alors démarrer avec leurs adresses IP habituelles sans conflit avec la production, et la réplication continue pendant l'exercice.
  options:
    a: { en: "vnet-dr-sap is connected to production through peering, so test VMs with production identities would conflict with the running systems.", fr: "vnet-dr-sap est connecté à la production par peering : des machines virtuelles de test portant les identités de production entreraient en conflit avec les systèmes en cours d'exécution." }
    c: { en: "Testing in a production network requires shutting down the primary VMs and causes production downtime.", fr: "Un test dans un réseau de production exige d'arrêter les machines virtuelles principales et entraîne une interruption de la production." }
    d: { en: "A subnet of vnet-dr-sap is still reachable from production through the peering, so the test VMs would conflict with the production servers.", fr: "Un sous-réseau de vnet-dr-sap reste joignable depuis la production par le peering : les machines virtuelles de test entreraient en conflit avec les serveurs de production." }
references:
  - title: Run a test failover (disaster recovery drill) to Azure
    url: https://learn.microsoft.com/en-us/azure/site-recovery/site-recovery-test-failover-to-azure
