id: az120-cs2b-bw-backup
objective: "3.2.4"
type: dropdown
caseStudy: az120-cs2b-wingtip
difficulty: 2
status: draft
stem:
  en: |
    You need to design the backup of the HANA database of WB1. The solution must meet the BW/4HANA backup requirements.

    What should you include in the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez concevoir la sauvegarde de la base de données HANA de WB1. La solution doit respecter les exigences de sauvegarde de BW/4HANA.

    Que devez-vous inclure dans la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Backup solution: [[sol]]

      Backup storage: [[store]]

      Before database discovery, run: [[prep]]
    fr: |
      Solution de sauvegarde : [[sol]]

      Stockage des sauvegardes : [[store]]

      Avant la découverte des bases de données, exécuter : [[prep]]
  slots:
    - id: sol
      options:
        - { id: vmbk, text: { en: "Azure VM backup with an Enhanced policy", fr: "Sauvegarde de machine virtuelle Azure avec une stratégie Enhanced" } }
        - { id: hana, text: { en: "Azure Backup for SAP HANA databases (Backint streaming)", fr: "Sauvegarde Azure pour bases de données SAP HANA (streaming Backint)" } }
        - { id: asr, text: Azure Site Recovery }
    - id: store
      options:
        - { id: bv, text: { en: "A Backup vault", fr: "Un coffre de sauvegarde" } }
        - { id: anf, text: { en: "An Azure NetApp Files volume", fr: "Un volume Azure NetApp Files" } }
        - { id: rsv, text: { en: "A Recovery Services vault", fr: "Un coffre Recovery Services" } }
    - id: prep
      options:
        - { id: prereg, text: { en: "The pre-registration script, as root on the HANA VM", fr: "Le script de préinscription, en tant que root sur la machine virtuelle HANA" } }
        - { id: ext, text: { en: "The installation of the Azure VM extension for SAP solutions", fr: "L'installation de l'extension de machine virtuelle Azure pour les solutions SAP" } }
        - { id: ama, text: { en: "The installation of the Azure Monitor Agent", fr: "L'installation de l'agent Azure Monitor" } }
answer:
  values: { sol: hana, store: rsv, prep: prereg }
explanation:
  correct:
    en: Azure Backup for SAP HANA is Backint certified by SAP and streams HANA-native full, differential and log backups to a Recovery Services vault without any backup infrastructure, with a 15-minute RPO. Before discovery, you run the pre-registration script as root on the HANA VM; it creates the backup user and its hdbuserstore key.
    fr: Sauvegarde Azure pour SAP HANA est certifiée Backint par SAP et envoie en streaming des sauvegardes HANA natives complètes, différentielles et de journaux vers un coffre Recovery Services, sans infrastructure de sauvegarde, avec un RPO de 15 minutes. Avant la découverte, vous exécutez le script de préinscription en tant que root sur la machine virtuelle HANA ; il crée l'utilisateur de sauvegarde et sa clé hdbuserstore.
  options:
    vmbk: { en: "A VM backup is not HANA-consistent by itself and cannot reach a 15-minute RPO.", fr: "Une sauvegarde de machine virtuelle n'est pas cohérente avec HANA en elle-même et ne permet pas un RPO de 15 minutes." }
    asr: { en: "Site Recovery replicates VMs for disaster recovery; it is not a backup solution and does not guarantee database consistency.", fr: "Site Recovery réplique des machines virtuelles pour la reprise d'activité ; ce n'est pas une solution de sauvegarde et il ne garantit pas la cohérence de la base." }
    bv: { en: "Streamed SAP HANA backups are stored in a Recovery Services vault.", fr: "Les sauvegardes SAP HANA en streaming sont stockées dans un coffre Recovery Services." }
    ext: { en: "The VM extension for SAP solutions provides monitoring data to SAP; Azure Backup does not need it.", fr: "L'extension de machine virtuelle pour les solutions SAP fournit des données de supervision à SAP ; Sauvegarde Azure n'en a pas besoin." }
references:
  - title: About SAP HANA database backup on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-about
