id: az120-3a-clu-resource-agents
objective: "3.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware is building Pacemaker clusters on SLES for the SAP HANA database and for the ASCS/ERS instances of an SAP S/4HANA system.

    Which resource agent should you use for each task? To answer, drag the appropriate resource agents to the correct tasks. Each resource agent may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware crée des clusters Pacemaker sur SLES pour la base de données SAP HANA et pour les instances ASCS/ERS d'un système SAP S/4HANA.

    Quel agent de ressource devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les agents de ressource appropriés vers les tâches correspondantes. Chaque agent de ressource peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ctrl, text: SAPHanaController }
    - { id: topo, text: SAPHanaTopology }
    - { id: inst, text: SAPInstance }
    - { id: ip, text: IPaddr2 }
    - { id: events, text: azure-events-az }
  targets:
    - id: t1
      text: { en: "Promote the HANA secondary to primary during a takeover", fr: "Promouvoir le secondaire HANA en principal lors d'une prise de contrôle" }
    - id: t2
      text: { en: "Collect the system replication status on every node, as a clone", fr: "Collecter l'état de la réplication système sur chaque nœud, sous forme de clone" }
    - id: t3
      text: { en: "Start, stop and monitor the ASCS and ERS instances", fr: "Démarrer, arrêter et surveiller les instances ASCS et ERS" }
    - id: t4
      text: { en: "Configure the virtual IP address on the active node", fr: "Configurer l'adresse IP virtuelle sur le nœud actif" }
answer:
  mapping: { t1: ctrl, t2: topo, t3: inst, t4: ip }
explanation:
  correct:
    en: SAPHanaController is a promotable clone that manages the HANA primary and secondary roles and performs the takeover. SAPHanaTopology runs as a clone on all nodes to gather the system replication status used by the controller. SAPInstance manages the ASCS and ERS instances (with IS_ERS=true for ERS). IPaddr2 configures the virtual IP address that the load balancer forwards traffic to. azure-events-az handles Azure scheduled events, which none of the tasks requires.
    fr: SAPHanaController est un clone promouvable qui gère les rôles principal et secondaire de HANA et effectue la prise de contrôle. SAPHanaTopology s'exécute comme clone sur tous les nœuds pour recueillir l'état de la réplication système utilisé par le contrôleur. SAPInstance gère les instances ASCS et ERS (avec IS_ERS=true pour l'ERS). IPaddr2 configure l'adresse IP virtuelle vers laquelle l'équilibreur de charge transfère le trafic. azure-events-az gère les événements planifiés Azure, ce qu'aucune des tâches n'exige.
references:
  - title: High availability for SAP HANA on Azure VMs on SLES
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability
  - title: Azure VMs high availability for SAP NetWeaver on SLES
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse
