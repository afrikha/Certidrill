id: az120-cs2a-hana-ilb
objective: "3.1.3"
type: yesno_statements
caseStudy: az120-cs2a-proseware
difficulty: 2
status: draft
stem:
  en: |
    You are configuring the Standard internal load balancer for the HANA cluster of HP1. The solution must meet the load-balancing requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez l'équilibreur de charge interne Standard du cluster HANA de HP1. La solution doit respecter les exigences d'équilibrage de charge.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The load-balancing rule of the HANA frontend IP address has Floating IP enabled and uses HA ports.
        fr: La règle d'équilibrage de charge de l'adresse IP frontale HANA a l'option IP flottante activée et utilise les ports HA.
    - id: s2
      text:
        en: To mark a node as unhealthy after two consecutive failed probes, you set Unhealthy threshold to 2 on the health probe in the Azure portal.
        fr: Pour marquer un nœud comme défaillant après deux échecs consécutifs de la sonde, vous définissez Unhealthy threshold sur 2 pour la sonde d'intégrité dans le portail Azure.
    - id: s3
      text:
        en: Following the port convention of Microsoft's guidance, the health probe of HP1 uses TCP port 62503.
        fr: Selon la convention de ports des recommandations de Microsoft, la sonde d'intégrité de HP1 utilise le port TCP 62503.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The HANA load-balancing rule uses HA ports, Floating IP enabled and a 30-minute idle timeout. The portal's Unhealthy threshold (numberOfProbes) is not respected; you set the probeThreshold property to 2 with the Azure CLI or PowerShell. The probe port follows the pattern 625 followed by the instance number, so instance 03 uses 62503.
    fr: |
      La règle d'équilibrage de charge HANA utilise les ports HA, l'option IP flottante activée et un délai d'inactivité de 30 minutes. Le paramètre Unhealthy threshold (numberOfProbes) du portail n'est pas respecté ; vous définissez la propriété probeThreshold sur 2 avec Azure CLI ou PowerShell. Le port de sonde suit le modèle 625 suivi du numéro d'instance : l'instance 03 utilise 62503.
  options:
    s2: { en: "probeThreshold cannot be set in the portal, and the portal's Unhealthy threshold value is ignored.", fr: "probeThreshold ne peut pas être défini dans le portail, et la valeur Unhealthy threshold du portail est ignorée." }
references:
  - title: High availability of SAP HANA on Azure VMs on Red Hat Enterprise Linux
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability-rhel
