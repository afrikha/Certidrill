id: az120-3c-pol-immutable-ops
objective: "3.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove protects its SAP HANA databases in a Recovery Services vault named **rsv-hana**. Immutability is enabled and locked on rsv-hana. The policy **pol-hana** keeps daily full backups for 30 days.

    Which two actions can you perform on rsv-hana?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove protège ses bases de données SAP HANA dans un coffre Recovery Services nommé **rsv-hana**. L'immuabilité est activée et verrouillée sur rsv-hana. La stratégie **pol-hana** conserve les sauvegardes complètes quotidiennes 30 jours.

    Quelles sont les deux actions que vous pouvez effectuer sur rsv-hana ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Increase the daily retention of pol-hana to 60 days", fr: "Augmenter la rétention quotidienne de pol-hana à 60 jours" } }
    - { id: b, text: { en: "Reduce the daily retention of pol-hana to 14 days", fr: "Réduire la rétention quotidienne de pol-hana à 14 jours" } }
    - { id: c, text: { en: "Stop protection of a database and retain the backup data", fr: "Arrêter la protection d'une base de données et conserver les données de sauvegarde" } }
    - { id: d, text: { en: "Stop protection of a database and delete the backup data", fr: "Arrêter la protection d'une base de données et supprimer les données de sauvegarde" } }
    - { id: e, text: { en: "Disable immutability on the vault", fr: "Désactiver l'immuabilité sur le coffre" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      An immutable vault blocks only the operations that could cause the loss of backups. Increasing retention and changing the schedule are allowed, and so is stopping protection while retaining the data.
    fr: |
      Un coffre immuable ne bloque que les opérations qui pourraient entraîner la perte de sauvegardes. Augmenter la rétention et modifier la planification sont autorisés, tout comme arrêter la protection en conservant les données.
  options:
    b: { en: "Reducing retention in a policy is blocked in an immutable vault.", fr: "La réduction de la rétention d'une stratégie est bloquée dans un coffre immuable." }
    d: { en: "Recovery points can't be deleted before they expire, so stop protection with delete data is blocked.", fr: "Les points de récupération ne peuvent pas être supprimés avant leur expiration : l'arrêt de la protection avec suppression des données est bloqué." }
    e: { en: "Once immutability is locked, it's irreversible and can't be disabled.", fr: "Une fois verrouillée, l'immuabilité est irréversible et ne peut pas être désactivée." }
references:
  - title: Immutable vault for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vault-concept
