id: az120-3c-rst-rules-statements
objective: "3.2.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware uses Azure Backup to protect SAP HANA multitenant database container (MDC) systems on Azure VMs. The operations team is preparing a restore runbook.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise Sauvegarde Azure pour protéger des systèmes SAP HANA à conteneurs de bases de données multiples (MDC) sur des machines virtuelles Azure. L'équipe d'exploitation prépare une procédure de restauration.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can restore a database from one HANA instance to another HANA instance that runs on the same Azure VM.
        fr: Vous pouvez restaurer une base de données d'une instance HANA vers une autre instance HANA qui s'exécute sur la même machine virtuelle Azure.
    - id: s2
      text:
        en: After you restore the system database to a target instance, you must run the pre-registration script again before you restore the tenant databases.
        fr: Après avoir restauré la base de données système sur une instance cible, vous devez réexécuter le script de préinscription avant de restaurer les bases de données de locataire.
    - id: s3
      text:
        en: Failed and canceled restores count toward the daily limit of restores for a HANA instance.
        fr: Les restaurations ayant échoué ou annulées sont prises en compte dans la limite quotidienne de restaurations d'une instance HANA.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Azure Backup can't distinguish two HANA instances on the same VM, so a restore between them isn't possible. Restoring SYSTEMDB of an MDC system replaces user and key information, so the pre-registration script must be rerun before tenant restores. A HANA system or instance allows at most 10 restores per day, and canceled or failed restores count.
    fr: |
      Sauvegarde Azure ne peut pas distinguer deux instances HANA sur la même machine virtuelle : une restauration de l'une vers l'autre est impossible. La restauration de SYSTEMDB d'un système MDC remplace les informations d'utilisateur et de clé : le script de préinscription doit être réexécuté avant les restaurations de locataires. Un système ou une instance HANA autorise au plus 10 restaurations par jour, et les restaurations annulées ou en échec comptent.
references:
  - title: Restore SAP HANA databases on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-db-restore
  - title: FAQ - Back up SAP HANA databases on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-faq-backup-azure-vm
