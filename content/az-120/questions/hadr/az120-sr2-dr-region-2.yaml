id: az120-sr2-dr-region-2
objective: "3.2.1"
type: series_yesno
series: az120-sr2-dr-region
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    You use Site Recovery for every VM, including the HANA VMs.
  fr: |
    Vous utilisez Site Recovery pour toutes les machines virtuelles, y compris les machines virtuelles HANA.
body:
  solution:
    en: |
      You enable **Azure Site Recovery** replication to North Europe for all the VMs of the system, **including the two HANA VMs**. You configure **cross-region replication** of the Azure NetApp Files volumes to North Europe.
    fr: |
      Vous activez la réplication **Azure Site Recovery** vers North Europe pour toutes les machines virtuelles du système, **y compris les deux machines virtuelles HANA**. Vous configurez la **réplication entre régions** des volumes Azure NetApp Files vers North Europe.
answer: { value: false }
explanation:
  correct:
    en: |
      Site Recovery is not recommended for SAP databases because it does not guarantee database consistency and has data churn limits. The database tier must use native replication, here HANA System Replication, so this solution does not meet the consistency requirement.
    fr: |
      Site Recovery n'est pas recommandé pour les bases de données SAP, car il ne garantit pas la cohérence de la base de données et présente des limites de taux de modification des données. La couche base de données doit utiliser la réplication native, ici HANA System Replication : cette solution ne répond pas à l'exigence de cohérence.
references:
  - title: Disaster Recovery recommendation for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-sap-guide
