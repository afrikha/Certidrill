id: az120-sr1-hana-vip-3
objective: "3.1.3"
type: series_yesno
series: az120-sr1-hana-vip
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: |-
    You deploy a public Standard load balancer with an HA ports rule.
  fr: |-
    Vous déployez un équilibreur de charge Standard public avec une règle Ports HA.
body:
  solution:
    en: |-
      You deploy a **public Standard** load balancer with a frontend that uses a Standard SKU public IP address and a backend pool that contains hana1 and hana2. You create a load-balancing rule with **HA ports** and **floating IP** enabled, and a TCP health probe on port **62503** answered by an `azure-lb` cluster resource that runs with the primary.
    fr: |-
      Vous déployez un équilibreur de charge **Standard public** avec une configuration frontale qui utilise une adresse IP publique de référence SKU Standard et un pool principal qui contient hana1 et hana2. Vous créez une règle d'équilibrage de charge avec les **Ports HA** et l'**IP flottante** activée, ainsi qu'une sonde d'intégrité TCP sur le port **62503** à laquelle répond une ressource de cluster `azure-lb` qui s'exécute avec le primaire.
answer: { value: false }
explanation:
  correct:
    en: |-
      HA ports load-balancing rules are available only on an internal Standard load balancer, so a public load balancer can't forward all the HANA ports with a single rule. The application servers in VNet1 need a private frontend IP in db-subnet, which only an internal load balancer provides.
    fr: |-
      Les règles d'équilibrage de charge Ports HA ne sont disponibles que sur un équilibreur de charge Standard interne : un équilibreur de charge public ne peut pas transférer tous les ports HANA avec une seule règle. Les serveurs d'applications de VNet1 ont besoin d'une IP frontale privée dans db-subnet, que seul un équilibreur de charge interne fournit.
references:
  - title: High availability ports overview
    url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-ha-ports-overview
  - title: High availability for SAP HANA on Azure VMs on SUSE Linux Enterprise Server
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability
