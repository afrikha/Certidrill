id: az120-cs1a-hana-snapshots
objective: "3.2.6"
type: single
caseStudy: az120-cs1a-blue-yonder-airlines
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the snapshot backups of BYP to meet the backup requirements.

    What should you do?
  fr: |
    Vous devez configurer les sauvegardes par instantanés de BYP pour respecter les exigences de sauvegarde.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Configure AzAcSnap for BYP and run azacsnap -c backup from a cron job every four hours", fr: "Configurer AzAcSnap pour BYP et exécuter azacsnap -c backup depuis une tâche cron toutes les quatre heures" } }
    - { id: b, text: { en: "Assign an Azure NetApp Files snapshot policy every four hours to the /hana/data and /hana/log volumes", fr: "Affecter une stratégie d'instantané Azure NetApp Files toutes les quatre heures aux volumes /hana/data et /hana/log" } }
    - { id: c, text: { en: "Protect hdb1 and hdb2 with Azure Backup for Azure VMs by using an Enhanced policy every four hours", fr: "Protéger hdb1 et hdb2 avec Sauvegarde Azure pour les machines virtuelles Azure à l'aide d'une stratégie Enhanced toutes les quatre heures" } }
    - { id: d, text: { en: "Configure Azure Backup for SAP HANA with a streaming (Backint) full backup every four hours", fr: "Configurer Sauvegarde Azure pour SAP HANA avec une sauvegarde complète en streaming (Backint) toutes les quatre heures" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Azure Application Consistent Snapshot tool (AzAcSnap) is a single command-line binary, scheduled with cron, that puts SAP HANA in a consistent state, takes the Azure NetApp Files snapshot of the data volume and closes the HANA snapshot. It keeps the SAP HANA backup catalog up to date and needs no third-party product.
    fr: |
      L'outil Azure Application Consistent Snapshot (AzAcSnap) est un binaire en ligne de commande unique, planifié avec cron, qui met SAP HANA dans un état cohérent, prend l'instantané Azure NetApp Files du volume de données et ferme l'instantané HANA. Il tient à jour le catalogue de sauvegarde SAP HANA et ne nécessite aucun produit tiers.
  options:
    b:
      en: |
        A volume snapshot policy alone does not prepare HANA, so the snapshots are not application-consistent and do not appear in the backup catalog. Microsoft also advises against snapshots of /hana/log.
      fr: |
        Une stratégie d'instantané de volume seule ne prépare pas HANA : les instantanés ne sont pas cohérents avec l'application et n'apparaissent pas dans le catalogue de sauvegarde. Microsoft déconseille aussi les instantanés de /hana/log.
    c:
      en: |
        Azure Backup for Azure VMs protects managed disks; it does not support Azure NetApp Files volumes, so the HANA data would not be backed up.
      fr: |
        Sauvegarde Azure pour les machines virtuelles Azure protège les disques managés ; elle ne prend pas en charge les volumes Azure NetApp Files, donc les données HANA ne seraient pas sauvegardées.
    d:
      en: |
        Backint streams the data to a vault; it does not create the storage snapshots that the requirements ask for.
      fr: |
        Backint transfère les données en continu vers un coffre ; il ne crée pas les instantanés de stockage demandés par les exigences.
references:
  - title: What is the Azure Application Consistent Snapshot tool for Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azacsnap-introduction
  - title: NFS v4.1 volumes on Azure NetApp Files for SAP HANA
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-netapp
