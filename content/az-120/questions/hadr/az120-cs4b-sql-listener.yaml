id: az120-cs4b-sql-listener
objective: "3.1.5"
type: single
caseStudy: az120-cs4b-treyresearch
difficulty: 3
status: draft
stem:
  en: |
    You need to configure how the SAP application servers of PRD connect to the availability group. The solution must meet the high availability requirements.

    What should you configure?
  fr: |
    Vous devez configurer la façon dont les serveurs d'applications SAP de PRD se connectent au groupe de disponibilité. La solution doit respecter les exigences de haute disponibilité.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text:
        en: "A virtual network name (VNN) listener behind a Standard internal load balancer with floating IP enabled"
        fr: "Un écouteur de nom de réseau virtuel (VNN) derrière un équilibreur de charge interne Standard avec l'IP flottante activée"
    - id: b
      text:
        en: "The SAP profile parameter dbs/mss/server set to the two West Europe instances, as for database mirroring"
        fr: "Le paramètre de profil SAP dbs/mss/server défini sur les deux instances de West Europe, comme pour la mise en miroir de bases de données"
    - id: c
      text:
        en: "A distributed network name (DNN) listener on a unique port, with MultiSubnetFailover=True in the connection"
        fr: "Un écouteur de nom de réseau distribué (DNN) sur un port unique, avec MultiSubnetFailover=True dans la connexion"
    - id: d
      text:
        en: "An Azure Traffic Manager profile with priority routing that points to the private IP address of each replica"
        fr: "Un profil Azure Traffic Manager avec un routage par priorité qui pointe vers l'adresse IP privée de chaque réplica"
answer: { optionId: c }
explanation:
  correct:
    en: A DNN listener removes the need for an Azure load balancer to route traffic to the primary replica, and it is supported from SQL Server 2019 CU8 on Windows Server 2016 and later. The listener must use a port that no other connection on any replica shares, and the client must set MultiSubnetFailover=True so that it reconnects quickly to the new primary after a failover.
    fr: Un écouteur DNN supprime le besoin d'un équilibreur de charge Azure pour router le trafic vers le réplica principal, et il est pris en charge à partir de SQL Server 2019 CU8 sur Windows Server 2016 et versions ultérieures. L'écouteur doit utiliser un port qu'aucune autre connexion ne partage sur aucun réplica, et le client doit définir MultiSubnetFailover=True pour se reconnecter rapidement au nouveau réplica principal après un basculement.
  options:
    a:
      en: A VNN listener on Azure requires an Azure load balancer in front of the database VMs, which the database team does not want.
      fr: Un écouteur VNN sur Azure nécessite un équilibreur de charge Azure devant les machines virtuelles de base de données, ce que l'équipe base de données ne veut pas.
    b:
      en: The database mirroring style connection works only when the availability group spans two instances; the PRD availability group has three replicas, including North Europe.
      fr: La connexion de type mise en miroir de bases de données ne fonctionne que si le groupe de disponibilité couvre deux instances ; le groupe de disponibilité de PRD a trois réplicas, dont celui de North Europe.
    d:
      en: Traffic Manager answers DNS queries with an endpoint chosen by its routing method; it has no knowledge of which replica is the primary of an availability group.
      fr: Traffic Manager répond aux requêtes DNS avec un point de terminaison choisi par sa méthode de routage ; il ignore quel réplica est le principal d'un groupe de disponibilité.
references:
  - title: Configure DNN Listener for Availability Group - SQL Server on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/availability-group-distributed-network-name-dnn-listener-configure
