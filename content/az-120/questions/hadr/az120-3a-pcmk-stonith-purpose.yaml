id: az120-3a-pcmk-stonith-purpose
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is building a two-node Pacemaker cluster on SLES for the ASCS/ERS instances of an SAP system. An administrator proposes to skip the STONITH configuration to simplify the setup.

    You need to explain why Microsoft's guidance requires STONITH in the cluster.

    What does STONITH provide?
  fr: |
    Contoso crée un cluster Pacemaker à deux nœuds sur SLES pour les instances ASCS/ERS d'un système SAP. Un administrateur propose d'ignorer la configuration de STONITH pour simplifier l'installation.

    Vous devez expliquer pourquoi les recommandations de Microsoft exigent STONITH dans le cluster.

    Que fournit STONITH ?
body:
  options:
    - id: a
      text: { en: "It replicates the enqueue lock table from the ASCS node to the ERS node.", fr: "Il réplique la table de verrous de mise en file d'attente du nœud ASCS vers le nœud ERS." }
    - id: b
      text: { en: "It isolates an unresponsive node so that resources never run on two nodes at the same time.", fr: "Il isole un nœud qui ne répond pas, afin que les ressources ne s'exécutent jamais sur deux nœuds en même temps." }
    - id: c
      text: { en: "It sends the load balancer health probes only to the node that runs the ASCS instance.", fr: "Il envoie les sondes d'intégrité de l'équilibreur de charge uniquement au nœud qui exécute l'instance ASCS." }
    - id: d
      text: { en: "It adds a third quorum vote so that the cluster keeps quorum when one node fails.", fr: "Il ajoute un troisième vote de quorum pour que le cluster conserve le quorum lorsqu'un nœud tombe en panne." }
answer: { optionId: b }
explanation:
  correct:
    en: STONITH ("shoot the other node in the head") fences a node that the cluster can no longer trust, by powering it off or restarting it through the Azure fence agent or SBD, before its resources are started elsewhere. Without it, a network split could leave the virtual IP, file systems or instances active on both nodes. Microsoft's Pacemaker guides set stonith-enabled to true.
    fr: STONITH (« shoot the other node in the head ») isole un nœud auquel le cluster ne peut plus se fier, en l'arrêtant ou en le redémarrant au moyen de l'agent de clôture Azure ou de SBD, avant que ses ressources ne soient démarrées ailleurs. Sans cela, une partition du réseau pourrait laisser l'adresse IP virtuelle, les systèmes de fichiers ou les instances actifs sur les deux nœuds. Les guides Pacemaker de Microsoft définissent stonith-enabled sur true.
  options:
    a: { en: "Lock table replication is the job of the ERS instance, not of the fencing mechanism.", fr: "La réplication de la table de verrous est le rôle de l'instance ERS, pas du mécanisme d'isolation." }
    c: { en: "The azure-lb resource answers the probes on the active node; STONITH doesn't influence load balancing.", fr: "La ressource azure-lb répond aux sondes sur le nœud actif ; STONITH n'a aucune influence sur l'équilibrage de charge." }
    d: { en: "Fencing doesn't add quorum votes; a quorum witness or device provides an extra vote.", fr: "L'isolation n'ajoute pas de vote de quorum ; c'est un témoin ou un périphérique de quorum qui fournit un vote supplémentaire." }
references:
  - title: Set up Pacemaker on SUSE Linux Enterprise Server (SLES) in Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-pacemaker
