id: az120-3b-fence-iscsi-count
objective: "3.1.7"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Fabrikam is deploying a two-node Pacemaker cluster on SUSE Linux Enterprise Server (SLES) for the ASCS/ERS instances of an SAP system named **FB1**. The cluster will use SBD fencing with iSCSI target servers.

    Fencing must keep working when any one of the iSCSI target servers is unavailable, for example during its patching. The solution must minimize the number of iSCSI target servers.

    How many iSCSI target servers should you deploy?
  fr: |
    Fabrikam déploie un cluster Pacemaker à deux nœuds sur SUSE Linux Enterprise Server (SLES) pour les instances ASCS/ERS d'un système SAP nommé **FB1**. Le cluster utilisera une clôture SBD avec des serveurs cibles iSCSI.

    La clôture doit continuer de fonctionner lorsque l'un quelconque des serveurs cibles iSCSI est indisponible, par exemple pendant son application de correctifs. La solution doit réduire au minimum le nombre de serveurs cibles iSCSI.

    Combien de serveurs cibles iSCSI devez-vous déployer ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "4" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft recommends three iSCSI target servers, each providing one SBD device, for the highest resiliency. With three devices, the cluster can still fence when one target server is down, so three is the smallest number that meets the requirement.
    fr: |
      Microsoft recommande trois serveurs cibles iSCSI, chacun fournissant un périphérique SBD, pour une résilience maximale. Avec trois périphériques, le cluster peut encore effectuer une clôture lorsqu'un serveur cible est arrêté : trois est donc le plus petit nombre qui répond à l'exigence.
  options:
    a: { en: "A single iSCSI target server is a single point of failure: when it is down, no SBD device is available.", fr: "Un seul serveur cible iSCSI est un point de défaillance unique : lorsqu'il est arrêté, aucun périphérique SBD n'est disponible." }
    b: { en: "With two SBD devices, Pacemaker doesn't allow fencing when one of the two target servers is down.", fr: "Avec deux périphériques SBD, Pacemaker n'autorise pas la clôture lorsque l'un des deux serveurs cibles est arrêté." }
    d: { en: "Four target servers would work, but three already meet the requirement with fewer VMs.", fr: "Quatre serveurs cibles fonctionneraient, mais trois répondent déjà à l'exigence avec moins de machines virtuelles." }
references:
  - title: Set up Pacemaker on SUSE Linux Enterprise Server in Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-pacemaker
