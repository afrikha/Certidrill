id: az120-cs2a-fencing
objective: "3.1.7"
type: ordering
caseStudy: az120-cs2a-proseware
difficulty: 3
status: draft
stem:
  en: |
    The Pacemaker cluster of the two HANA VMs of HP1 is configured, and STONITH is not yet configured. You need to configure fencing. The solution must meet the fencing requirements.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Le cluster Pacemaker des deux machines virtuelles HANA de HP1 est configuré, et STONITH n'est pas encore configuré. Vous devez configurer l'isolation. La solution doit respecter les exigences d'isolation.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: uami, text: { en: "Create a user-assigned managed identity and assign it to both HANA VMs.", fr: "Créer une identité managée affectée par l'utilisateur et l'attribuer aux deux machines virtuelles HANA." } }
    - { id: mi, text: { en: "Enable a system-assigned managed identity on each HANA VM.", fr: "Activer une identité managée affectée par le système sur chaque machine virtuelle HANA." } }
    - { id: spn, text: { en: "Create a service principal and add its secret to the fence agent parameters.", fr: "Créer un principal de service et ajouter son secret aux paramètres de l'agent de clôture." } }
    - { id: role, text: { en: "Assign the Linux Fence Agent role to the identity of each HANA VM, for both VMs.", fr: "Attribuer le rôle Linux Fence Agent à l'identité de chaque machine virtuelle HANA, pour les deux machines virtuelles." } }
    - { id: sbd, text: { en: "Attach a Premium_ZRS shared disk to both VMs and initialize it as an SBD device.", fr: "Attacher un disque partagé Premium_ZRS aux deux machines virtuelles et l'initialiser comme périphérique SBD." } }
    - { id: stonith, text: { en: "Run pcs stonith create with the fence_azure_arm agent and msi=true.", fr: "Exécuter pcs stonith create avec l'agent fence_azure_arm et msi=true." } }
answer:
  sequence: [ mi, role, stonith ]
explanation:
  correct:
    en: The Azure fence agent (fence_azure_arm) fences nodes through the Azure API. Microsoft recommends a system-assigned managed identity on each VM, so no secret is stored on the nodes. The identity of each VM receives the Linux Fence Agent role for every VM of the cluster, including itself, and then you create the STONITH resource with msi=true.
    fr: L'agent de clôture Azure (fence_azure_arm) isole les nœuds par l'API Azure. Microsoft recommande une identité managée affectée par le système sur chaque machine virtuelle, ce qui évite de stocker un secret sur les nœuds. L'identité de chaque machine virtuelle reçoit le rôle Linux Fence Agent sur toutes les machines virtuelles du cluster, y compris elle-même, puis vous créez la ressource STONITH avec msi=true.
  options:
    uami: { en: "User-assigned managed identities are not supported by the Azure fence agent on RHEL.", fr: "Les identités managées affectées par l'utilisateur ne sont pas prises en charge par l'agent de clôture Azure sur RHEL." }
    spn: { en: "A service principal stores a secret on the nodes, which the requirements forbid; it is the legacy method.", fr: "Un principal de service stocke un secret sur les nœuds, ce que les exigences interdisent ; c'est la méthode héritée." }
    sbd: { en: "SBD needs an additional shared disk and does not fence through the Azure API.", fr: "SBD nécessite un disque partagé supplémentaire et n'isole pas les nœuds par l'API Azure." }
references:
  - title: Set up Pacemaker on Red Hat Enterprise Linux in Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-rhel-pacemaker
