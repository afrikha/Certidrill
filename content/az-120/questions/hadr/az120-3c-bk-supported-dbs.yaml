id: az120-3c-bk-supported-dbs
objective: "3.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum is designing the backup strategy of four SAP systems on Azure VMs. The policy requires database-consistent backups that are managed by Azure Backup, without third-party tools.

    | System | Database | Database storage |
    | --- | --- | --- |
    | ERP | SQL Server 2022 | Premium SSD managed disks |
    | CRM | Oracle Database 19c | Premium SSD managed disks |
    | SRM | IBM Db2 11.5 | Premium SSD managed disks |
    | BW | SAP HANA 2.0 | Azure NetApp Files volumes |

    The BW team wants to use HANA instance snapshots.

    For which two systems can Azure Backup meet the requirement?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum conçoit la stratégie de sauvegarde de quatre systèmes SAP sur des machines virtuelles Azure. La politique interne exige des sauvegardes cohérentes avec la base de données gérées par Sauvegarde Azure, sans outil tiers.

    | Système | Base de données | Stockage de la base |
    | --- | --- | --- |
    | ERP | SQL Server 2022 | Disques managés SSD Premium |
    | CRM | Oracle Database 19c | Disques managés SSD Premium |
    | SRM | IBM Db2 11.5 | Disques managés SSD Premium |
    | BW | SAP HANA 2.0 | Volumes Azure NetApp Files |

    L'équipe BW souhaite utiliser les instantanés d'instance HANA.

    Pour quels deux systèmes Sauvegarde Azure peut-elle répondre à l'exigence ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: ERP }
    - { id: b, text: CRM }
    - { id: c, text: SRM }
    - { id: d, text: BW }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: Azure Backup backs up SQL Server databases in Azure VMs natively, and protects Oracle through Azure VM backup with database-consistent snapshots (the enhanced pre-script and post-script framework configured in /etc/azure/workload.conf).
    fr: Sauvegarde Azure sauvegarde nativement les bases SQL Server des machines virtuelles Azure, et protège Oracle par la sauvegarde de machine virtuelle avec des instantanés cohérents avec la base de données (le framework amélioré de pré-scripts et post-scripts configuré dans /etc/azure/workload.conf).
  options:
    c: { en: "IBM Db2 isn't supported by Azure Backup; Microsoft lists it among the unsupported workloads for SAP.", fr: "IBM Db2 n'est pas pris en charge par Sauvegarde Azure ; Microsoft le cite parmi les charges de travail SAP non prises en charge." }
    d: { en: "HANA instance snapshots are managed disk snapshots, and Azure Backup doesn't support Azure NetApp Files volumes (use ANF snapshots with AzAcSnap instead).", fr: "Les instantanés d'instance HANA sont des instantanés de disques managés, et Sauvegarde Azure ne prend pas en charge les volumes Azure NetApp Files (utilisez plutôt les instantanés ANF avec AzAcSnap)." }
references:
  - title: Disaster recovery guidelines for SAP application
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-sap-guide
  - title: Enhanced prescripts and postscripts for database-consistent snapshots
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-linux-database-consistent-enhanced-pre-post
