id: az120-1a-size-quick-sizer
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans a greenfield implementation of SAP S/4HANA on Azure virtual machines. No SAP system exists yet. The business team has estimated the expected volumes of sales orders, deliveries and invoices for the first three years.

    You need to estimate the SAPS and the memory that the new system will require.

    What should you use?
  fr: |
    Contoso prévoit une implémentation entièrement nouvelle de SAP S/4HANA sur des machines virtuelles Azure. Aucun système SAP n'existe encore. L'équipe métier a estimé les volumes attendus de commandes client, de livraisons et de factures pour les trois premières années.

    Vous devez estimer les SAPS et la mémoire dont le nouveau système aura besoin.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "SAP EarlyWatch Alert reports", fr: "Les rapports SAP EarlyWatch Alert" } }
    - { id: b, text: { en: "The SAP on Azure Quality Check Tool", fr: "L'outil SAP on Azure Quality Check Tool" } }
    - { id: c, text: { en: "SAP Quick Sizer", fr: "SAP Quick Sizer" } }
    - { id: d, text: { en: "Azure Advisor right-sizing recommendations", fr: "Les recommandations de redimensionnement d'Azure Advisor" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For a new system there is no workload to measure, so sizing starts from business volumes. SAP Quick Sizer turns document volumes into SAPS, memory and disk requirements, which you then map to SAP-certified Azure VM types and storage.
    fr: |
      Pour un nouveau système, il n'existe aucune charge de travail à mesurer : le dimensionnement part des volumes métier. SAP Quick Sizer convertit les volumes de documents en besoins de SAPS, de mémoire et de disque, que vous faites ensuite correspondre à des types de machines virtuelles Azure certifiés SAP et à du stockage.
  options:
    a:
      en: |
        EarlyWatch Alert reports describe the workload of an existing system; they are an input for sizing a system that already runs.
      fr: |
        Les rapports EarlyWatch Alert décrivent la charge d'un système existant ; ils servent à dimensionner un système qui fonctionne déjà.
    b:
      en: |
        The Quality Check Tool checks a deployed SAP system against Microsoft recommendations; it doesn't size a future system.
      fr: |
        Quality Check Tool vérifie un système SAP déjà déployé par rapport aux recommandations de Microsoft ; il ne dimensionne pas un futur système.
    d:
      en: |
        Azure Advisor bases its recommendations on the utilization of resources already deployed in Azure.
      fr: |
        Azure Advisor fonde ses recommandations sur l'utilisation de ressources déjà déployées dans Azure.
references:
  - title: "SAP workloads on Azure: planning and deployment checklist"
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/deployment-checklist
