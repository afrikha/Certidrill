id: az120-1a-cost-ri-coverage
objective: "1.1.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove bought a three-year reservation with shared scope for four Standard_E32ds_v5 instances in West Europe. Instance size flexibility is left at its default setting. Woodgrove runs three Standard_E32ds_v5 and two Standard_E16ds_v5 SAP application server VMs in West Europe, all deployed from a SUSE Linux Enterprise Server for SAP Applications pay-as-you-go image and using Premium SSD P10 managed disks. Woodgrove has no other reservation or savings plan.

    Which two charges of these VMs are still billed at pay-as-you-go rates?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove a acheté une réservation de trois ans avec une étendue partagée pour quatre instances Standard_E32ds_v5 dans West Europe. La flexibilité de taille d'instance est conservée à son paramètre par défaut. Woodgrove exécute dans West Europe trois machines virtuelles Standard_E32ds_v5 et deux machines virtuelles Standard_E16ds_v5 de serveurs d'applications SAP, toutes déployées à partir d'une image de paiement à l'utilisation SUSE Linux Enterprise Server for SAP Applications et utilisant des disques managés SSD Premium P10. Woodgrove n'a aucune autre réservation ni aucun plan d'économies.

    Quels sont les deux frais de ces machines virtuelles qui restent facturés au tarif de paiement à l'utilisation ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The compute hours of the Standard_E32ds_v5 VMs", fr: "Les heures de calcul des machines virtuelles Standard_E32ds_v5" } }
    - { id: b, text: { en: "The SUSE software charges of the VMs", fr: "Les frais du logiciel SUSE des machines virtuelles" } }
    - { id: c, text: { en: "The compute hours of the Standard_E16ds_v5 VMs", fr: "Les heures de calcul des machines virtuelles Standard_E16ds_v5" } }
    - { id: d, text: { en: "The Premium SSD managed disk charges", fr: "Les frais des disques managés SSD Premium" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A reserved VM instance covers only the compute part of VM usage. Software meters, such as SUSE, and storage are billed separately; only a SUSE software plan reservation or a disk reservation (available for P30 and larger) would discount them, and P10 disks aren't eligible for a disk reservation anyway.
    fr: |
      Une instance de machine virtuelle réservée ne couvre que la partie calcul de l'utilisation des machines virtuelles. Les compteurs logiciels, comme SUSE, et le stockage sont facturés à part ; seule une réservation de plan logiciel SUSE ou une réservation de disques (disponible pour P30 et plus) les réduirait, et les disques P10 ne sont de toute façon pas éligibles à une réservation de disques.
  options:
    a:
      en: |
        The compute of VMs that match the reserved size, region and scope gets the reservation discount.
      fr: |
        Le calcul des machines virtuelles qui correspondent à la taille, à la région et à l'étendue réservées bénéficie de la remise de la réservation.
    c:
      en: |
        Instance size flexibility is on by default, so the unused capacity of the fourth reserved instance covers the two smaller VMs of the same size group.
      fr: |
        La flexibilité de taille d'instance est activée par défaut : la capacité inutilisée de la quatrième instance réservée couvre les deux machines virtuelles plus petites du même groupe de tailles.
references:
  - title: What are Azure Reservations?
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/save-compute-costs-reservations
  - title: Save costs with Azure Reserved VM Instances
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/prepay-reserved-vm-instances
