id: az120-1c-rise-id-cloud-identity
objective: "1.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys runs SAP S/4HANA in RISE with SAP on Azure and uses SAP SuccessFactors and several SAP BTP applications that require SAP Cloud Identity Services - Identity Authentication. All employees have Microsoft Entra ID accounts.

    You have the following requirements:

    - When HR hires an employee in SuccessFactors, a Microsoft Entra ID account must be created automatically.
    - Employees must sign in to the BTP applications with their Microsoft Entra ID credentials.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys exécute SAP S/4HANA dans RISE with SAP sur Azure et utilise SAP SuccessFactors et plusieurs applications SAP BTP qui exigent SAP Cloud Identity Services - Identity Authentication. Tous les employés disposent de comptes Microsoft Entra ID.

    Vous avez les exigences suivantes :

    - Lorsque les RH embauchent un employé dans SuccessFactors, un compte Microsoft Entra ID doit être créé automatiquement.
    - Les employés doivent se connecter aux applications BTP avec leurs informations d'identification Microsoft Entra ID.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Configure Microsoft Entra automated user provisioning from SAP SuccessFactors.", fr: "Configurer le provisionnement automatique des utilisateurs Microsoft Entra depuis SAP SuccessFactors." }
    - id: b
      text: { en: "Configure SSO between Identity Authentication and Microsoft Entra ID, with Identity Authentication as a proxy identity provider.", fr: "Configurer l'authentification unique entre Identity Authentication et Microsoft Entra ID, avec Identity Authentication comme fournisseur d'identité proxy." }
    - id: c
      text: { en: "Configure SPNEGO with Active Directory for the BTP applications.", fr: "Configurer SPNEGO avec Active Directory pour les applications BTP." }
    - id: d
      text: { en: "Deploy Microsoft Entra Domain Services and join the RISE servers to the managed domain.", fr: "Déployer Microsoft Entra Domain Services et joindre les serveurs RISE au domaine managé." }
    - id: e
      text: { en: "Configure Microsoft Entra Connect to synchronize SuccessFactors employees to Microsoft Entra ID.", fr: "Configurer Microsoft Entra Connect pour synchroniser les employés de SuccessFactors vers Microsoft Entra ID." }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Microsoft Entra ID automated user provisioning from SuccessFactors creates accounts as employees are hired, and can write the email address back to SuccessFactors. For BTP and SaaS applications that require Identity Authentication, SSO between Identity Authentication and Microsoft Entra ID makes Identity Authentication a proxy identity provider that forwards authentication to Microsoft Entra ID.
    fr: |
      Le provisionnement automatique des utilisateurs Microsoft Entra ID depuis SuccessFactors crée les comptes lors des embauches et peut réécrire l'adresse e-mail dans SuccessFactors. Pour les applications BTP et SaaS qui exigent Identity Authentication, l'authentification unique entre Identity Authentication et Microsoft Entra ID fait d'Identity Authentication un fournisseur d'identité proxy qui transfère l'authentification à Microsoft Entra ID.
  options:
    c:
      en: |
        SPNEGO with Active Directory applies to Web GUI and SAP Enterprise Portal, not to sign-in with Microsoft Entra ID for BTP applications.
      fr: |
        SPNEGO avec Active Directory s'applique à Web GUI et à SAP Enterprise Portal, pas à la connexion avec Microsoft Entra ID aux applications BTP.
    d:
      en: |
        RISE servers are managed by SAP and are not joined to customer domains; a managed domain does not provide SSO to BTP.
      fr: |
        Les serveurs RISE sont gérés par SAP et ne sont pas joints aux domaines du client ; un domaine managé ne fournit pas d'authentification unique à BTP.
    e:
      en: |
        Microsoft Entra Connect synchronizes on-premises Active Directory; SuccessFactors uses the Microsoft Entra provisioning service.
      fr: |
        Microsoft Entra Connect synchronise l'Active Directory local ; SuccessFactors utilise le service de provisionnement Microsoft Entra.
references:
  - title: Identity and access management for SAP on Azure - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/sap/eslz-identity-and-access-management
  - title: Manage access to your SAP applications - Microsoft Entra ID Governance
    url: https://learn.microsoft.com/en-us/entra/id-governance/sap
