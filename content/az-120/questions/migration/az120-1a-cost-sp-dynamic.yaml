id: az120-1a-cost-sp-dynamic
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam will migrate about 40 SAP systems to Azure in several waves over the next three years. During the program, many systems will be resized between E-series and M-series VMs, and some systems will move from West Europe to Sweden Central. Fabrikam has a Microsoft Customer Agreement and expects a stable overall compute spend per hour.

    You need to recommend a commitment-based discount that adapts to these changes with the least management effort.

    What should you recommend?
  fr: |
    Fabrikam va migrer environ 40 systèmes SAP vers Azure en plusieurs vagues au cours des trois prochaines années. Pendant le programme, de nombreux systèmes seront redimensionnés entre des machines virtuelles de série E et de série M, et certains systèmes passeront de West Europe à Sweden Central. Fabrikam dispose d'un Contrat client Microsoft et prévoit une dépense de calcul horaire globale stable.

    Vous devez recommander une remise basée sur un engagement qui s'adapte à ces changements avec le moins d'effort de gestion.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Reserved VM instances for each VM size and region", fr: "Des instances de machine virtuelle réservées pour chaque taille et chaque région" } }
    - { id: b, text: { en: "On-demand capacity reservations", fr: "Des réservations de capacité à la demande" } }
    - { id: c, text: { en: "A compute savings plan", fr: "Un plan d'économies pour le calcul" } }
    - { id: d, text: { en: "Azure Spot VMs for the systems being migrated", fr: "Des machines virtuelles Azure Spot pour les systèmes en cours de migration" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A savings plan commits to an hourly spend on eligible compute services across all Azure regions. The discount applies automatically to the usage of any VM family in any region up to the commitment, which suits workloads that change families and regions.
    fr: |
      Un plan d'économies engage une dépense horaire sur les services de calcul éligibles dans toutes les régions Azure. La remise s'applique automatiquement à l'utilisation de n'importe quelle famille de machines virtuelles dans n'importe quelle région, dans la limite de l'engagement, ce qui convient aux charges qui changent de famille et de région.
  options:
    a:
      en: |
        Reservations are tied to a VM family and a region; frequent resizing and region moves would require many exchanges.
      fr: |
        Les réservations sont liées à une famille de machines virtuelles et à une région ; des redimensionnements et des changements de région fréquents exigeraient de nombreux échanges.
    b:
      en: |
        Capacity reservations guarantee capacity at pay-as-you-go rates; they give no discount.
      fr: |
        Les réservations de capacité garantissent de la capacité au tarif de paiement à l'utilisation ; elles n'offrent aucune remise.
    d:
      en: |
        Spot VMs aren't a commitment-based discount and can be evicted, which doesn't suit SAP systems.
      fr: |
        Les machines virtuelles Spot ne sont pas une remise basée sur un engagement et peuvent être évincées, ce qui ne convient pas aux systèmes SAP.
references:
  - title: Decide between a savings plan and a reservation
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
  - title: What are savings plans?
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/savings-plan-compute-overview
