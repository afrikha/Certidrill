id: az120-1c-rise-data-cdc-runmode
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs SAP S/4HANA in RISE with SAP on Azure. You create an Azure Data Factory mapping data flow that uses the SAP CDC connector to replicate a sales order object to Azure Data Lake Storage Gen2.

    The first execution must load a full snapshot of the object, and each later execution must load only the changes since the previous one.

    How should you configure the source of the data flow?
  fr: |
    Northwind Traders exécute SAP S/4HANA dans RISE with SAP sur Azure. Vous créez un flux de données de mappage Azure Data Factory qui utilise le connecteur SAP CDC pour répliquer un objet de commande client vers Azure Data Lake Storage Gen2.

    La première exécution doit charger un instantané complet de l'objet, et chaque exécution suivante ne doit charger que les changements depuis la précédente.

    Comment devez-vous configurer la source du flux de données ?
body:
  options:
    - id: a
      text: { en: "Run mode Full on every run, with key columns defined", fr: "Mode d'exécution Full on every run, avec des colonnes clés définies" }
    - id: b
      text: { en: "Run mode Incremental changes only, with key columns defined", fr: "Mode d'exécution Incremental changes only, avec des colonnes clés définies" }
    - id: c
      text: { en: "Run mode Full on the first run, then incremental, with key columns defined", fr: "Mode d'exécution Full on the first run, then incremental, avec des colonnes clés définies" }
    - id: d
      text: { en: "Run mode Full on the first run, then incremental, without key columns", fr: "Mode d'exécution Full on the first run, then incremental, sans colonnes clés" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      "Full on the first run, then incremental" performs a delta initialization: it creates an ODP delta subscription, returns a full snapshot, and then returns only the changes on later runs. Both incremental run modes require key columns.
    fr: |
      « Full on the first run, then incremental » effectue une initialisation delta : il crée un abonnement delta ODP, renvoie un instantané complet, puis seulement les changements lors des exécutions suivantes. Les deux modes d'exécution incrémentiels exigent des colonnes clés.
  options:
    a:
      en: |
        Full on every run reloads the complete snapshot at each execution instead of only the changes.
      fr: |
        Full on every run recharge l'instantané complet à chaque exécution au lieu des seuls changements.
    b:
      en: |
        Incremental changes only creates the subscription without an initial full snapshot.
      fr: |
        Incremental changes only crée l'abonnement sans instantané complet initial.
    d:
      en: |
        The incremental run modes require key columns, so this configuration is not valid.
      fr: |
        Les modes d'exécution incrémentiels exigent des colonnes clés : cette configuration n'est pas valide.
references:
  - title: Transform data from an SAP ODP source with the SAP CDC connector in Azure Data Factory or Azure Synapse Analytics - Azure Data Factory & Azure Synapse
    url: https://learn.microsoft.com/en-us/azure/data-factory/connector-sap-change-data-capture
