id: az120-1c-rise-svc-responsibilities
objective: "1.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders runs SAP S/4HANA in RISE with SAP on Azure. Northwind integrates the landscape with Azure services that it deploys in its own subscriptions, which are peered with the RISE virtual network.

    Who is responsible for each task? To answer, drag the appropriate parties to the correct tasks. Each party may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders exécute SAP S/4HANA dans RISE with SAP sur Azure. Northwind intègre le paysage à des services Azure qu'elle déploie dans ses propres abonnements, reliés par peering au réseau virtuel RISE.

    Qui est responsable de chaque tâche ? Pour répondre, faites glisser les parties appropriées vers les tâches correspondantes. Chaque partie peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: sap, text: "SAP" }
    - { id: cust, text: { en: "Northwind", fr: "Northwind" } }
    - { id: ms, text: { en: "Microsoft Azure support", fr: "Support Microsoft Azure" } }
  targets:
    - { id: t1, text: { en: "Open the ports and maintain the NSG rules in the RISE virtual network", fr: "Ouvrir les ports et gérer les règles NSG du réseau virtuel RISE" } }
    - { id: t2, text: { en: "Deploy and operate the self-hosted integration runtime VMs", fr: "Déployer et exploiter les machines virtuelles du runtime d'intégration auto-hébergé" } }
    - { id: t3, text: { en: "Handle a support request about a VM in a Northwind subscription", fr: "Traiter une demande de support sur une machine virtuelle d'un abonnement Northwind" } }
    - { id: t4, text: { en: "Decide and deploy the technical architecture of the RISE landscape", fr: "Décider et déployer l'architecture technique du paysage RISE" } }
answer:
  mapping: { t1: sap, t2: cust, t3: ms, t4: sap }
explanation:
  correct:
    en: |
      SAP owns the RISE subscription: it decides, validates and deploys the RISE architecture and opens the ports used by integrations. The customer deploys and operates the self-hosted integration runtime in its own subscription and VNet. Azure support covers only resources in the customer's subscriptions; issues with resources in SAP's subscription go to SAP.
    fr: |
      SAP possède l'abonnement RISE : il décide, valide et déploie l'architecture RISE et ouvre les ports utilisés par les intégrations. Le client déploie et exploite le runtime d'intégration auto-hébergé dans son propre abonnement et son réseau virtuel. Le support Azure ne couvre que les ressources des abonnements du client ; les problèmes de ressources de l'abonnement de SAP relèvent de SAP.
references:
  - title: Integrating Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration
  - title: Integrating Azure services with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-services
