id: az120-1b-lsm-to-hana-tool
objective: "1.1.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. runs SAP ECC 6.0 on HP-UX with an Oracle database in its own datacenter. Litware plans to move the system to Azure.

    The requirements are:

    - The database on Azure must be SAP HANA. The target release requires an SAP upgrade.
    - The move to Azure, the upgrade and the database migration must be performed in a single downtime window.
    - The method must be supported by SAP for migrations to the cloud.

    Which migration approach and which tool should you use? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. exécute SAP ECC 6.0 sur HP-UX avec une base de données Oracle dans son propre centre de données. Litware prévoit de déplacer le système vers Azure.

    Les exigences sont les suivantes :

    - La base de données sur Azure doit être SAP HANA. La version cible exige une mise à niveau SAP.
    - Le déplacement vers Azure, la mise à niveau et la migration de la base de données doivent être effectués dans une seule fenêtre de temps d'arrêt.
    - La méthode doit être prise en charge par SAP pour les migrations vers le cloud.

    Quelle approche de migration et quel outil devez-vous utiliser ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Migration approach: [[app]]

      Tool: [[tool]]
    fr: |
      Approche de migration : [[app]]

      Outil : [[tool]]
  slots:
    - id: app
      options:
        - { id: lsh, text: { en: "Lift and shift", fr: "Lift-and-shift" } }
        - { id: lsm, text: { en: "Lift-shift-migrate", fr: "Lift-shift-migrate" } }
        - { id: lsmh, text: { en: "Lift-shift-migrate to HANA", fr: "Lift-shift-migrate vers HANA" } }
    - id: tool
      options:
        - { id: swpm, text: { en: "SWPM heterogeneous system copy", fr: "Copie système hétérogène avec SWPM" } }
        - { id: dmosm, text: { en: "SUM with DMO with System Move", fr: "SUM avec DMO with System Move" } }
        - { id: dmo, text: { en: "SUM with classical (in-place) DMO", fr: "SUM avec DMO classique (sur place)" } }
        - { id: asr, text: { en: "Azure Site Recovery", fr: "Azure Site Recovery" } }
answer:
  values: { app: lsmh, tool: dmosm }
explanation:
  correct:
    en: Changing the database to SAP HANA while moving to Azure is a lift-shift-migrate to HANA. DMO of SUM performs the SAP upgrade and the migration to HANA in one step, and DMO with System Move is the variant that SAP supports for moving to new servers in Azure; SUM starts on premises and the import continues on the Azure application server.
    fr: "Changer la base de données pour SAP HANA en déplaçant le système vers Azure correspond à un lift-shift-migrate vers HANA. DMO de SUM effectue la mise à niveau SAP et la migration vers HANA en une seule étape, et DMO with System Move est la variante que SAP prend en charge pour passer sur de nouveaux serveurs dans Azure : SUM démarre en local et l'import se poursuit sur le serveur d'applications Azure."
  options:
    lsh: { en: "Lift and shift keeps the DBMS, but the target must be SAP HANA.", fr: "Le lift-and-shift conserve le SGBD, alors que la cible doit être SAP HANA." }
    lsm: { en: "Lift-shift-migrate covers OS/DB changes to a non-HANA target such as SQL Server; the target here is HANA.", fr: "Le lift-shift-migrate couvre les changements de système d'exploitation ou de SGBD vers une cible autre que HANA, comme SQL Server ; ici la cible est HANA." }
    swpm: { en: "A classical SWPM migration does not upgrade SAP, so it would need a second downtime for the upgrade.", fr: "Une migration classique avec SWPM ne met pas SAP à niveau ; il faudrait un second temps d'arrêt pour la mise à niveau." }
    dmo: { en: "Classical DMO is an in-place procedure; using it for a cloud migration is not officially supported by SAP.", fr: "DMO classique est une procédure sur place ; son utilisation pour une migration vers le cloud n'est pas officiellement prise en charge par SAP." }
    asr: { en: "Azure Site Recovery cannot replicate HP-UX servers and changes neither the database nor the SAP release.", fr: "Azure Site Recovery ne peut pas répliquer des serveurs HP-UX et ne change ni la base de données ni la version SAP." }
references:
  - title: Analyze the SAP database migration option methodology
    url: https://learn.microsoft.com/en-us/training/modules/explore-migration-options/5-analyze-sap-database-migration-option-methodology
  - title: Explore one-step migration - DMO with system move option
    url: https://learn.microsoft.com/en-us/training/modules/explore-migration-options/6-explore-one-step-migration-database-move-only-option-system-move-option
