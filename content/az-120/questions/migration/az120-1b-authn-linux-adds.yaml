id: az120-1b-authn-linux-adds
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs SAP application servers on Linux virtual machines in Azure. The Linux servers must authenticate AD DS users.

    The requirements are:

    - The servers will also access SMB file shares.
    - Some administration tools on the servers authenticate by using NTLM.
    - No add-on can be installed on the AD DS domain controllers.

    Which integration method should you use?
  fr: |
    Northwind Traders exécute des serveurs d'applications SAP sur des machines virtuelles Linux dans Azure. Les serveurs Linux doivent authentifier des utilisateurs AD DS.

    Les exigences sont les suivantes :

    - Les serveurs accéderont aussi à des partages de fichiers SMB.
    - Certains outils d'administration des serveurs s'authentifient avec NTLM.
    - Aucun module complémentaire ne peut être installé sur les contrôleurs de domaine AD DS.

    Quelle méthode d'intégration devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "LDAP authentication and authorization with the NSS and PAM LDAP modules", fr: "Authentification et autorisation LDAP avec les modules LDAP de NSS et PAM" } }
    - { id: b, text: { en: "Kerberos 5 authentication with pam_krb5 and LDAP authorization", fr: "Authentification Kerberos 5 avec pam_krb5 et autorisation LDAP" } }
    - { id: c, text: { en: "Winbind authentication and authorization from the Samba suite", fr: "Authentification et autorisation Winbind de la suite Samba" } }
    - { id: d, text: { en: "Microsoft Entra login with the AADSSHLoginForLinux extension", fr: "Connexion Microsoft Entra avec l'extension AADSSHLoginForLinux" } }
answer: { optionId: c }
explanation:
  correct:
    en: Winbind runs a daemon on each Linux system, supports RPC and NTLM and needs no add-on such as Services for UNIX on the domain controllers. Because Winbind is part of Samba, which also provides SMB file sharing, it is the logical choice when the servers use SMB.
    fr: Winbind exécute un démon sur chaque système Linux, prend en charge RPC et NTLM et ne nécessite aucun module complémentaire tel que Services for UNIX sur les contrôleurs de domaine. Comme Winbind fait partie de Samba, qui fournit aussi le partage de fichiers SMB, c'est le choix logique lorsque les serveurs utilisent SMB.
  options:
    a:
      en: LDAP authentication doesn't support NTLM and doesn't let users change their password from the Linux client.
      fr: L'authentification LDAP ne prend pas en charge NTLM et ne permet pas aux utilisateurs de changer leur mot de passe depuis le client Linux.
    b:
      en: Kerberos 5 with LDAP authorization is popular and supports password changes, but it doesn't provide NTLM.
      fr: Kerberos 5 avec autorisation LDAP est répandu et prend en charge le changement de mot de passe, mais il ne fournit pas NTLM.
    d:
      en: Microsoft Entra login authenticates against Microsoft Entra ID over SSH, not against AD DS, and doesn't provide NTLM.
      fr: La connexion Microsoft Entra authentifie auprès de Microsoft Entra ID par SSH, pas auprès d'AD DS, et ne fournit pas NTLM.
references:
  - title: Integrate Linux with Active Directory Domain Services
    url: https://learn.microsoft.com/en-us/training/modules/explore-identity-services/13-integrate-linux-active-directory-domain-services
