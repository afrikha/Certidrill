id: az120-1a-quota-family
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove has an Azure subscription named Sub-SAP-Prod. In the West Europe region, the subscription currently uses 120 of its 1,000 total regional vCPUs.

    A deployment of a Standard_M128s virtual machine for SAP HANA in West Europe fails. The error states that the vCPU quota of the VM's family would be exceeded.

    You need to deploy the VM.

    What should you do first?
  fr: |
    Woodgrove dispose d'un abonnement Azure nommé Sub-SAP-Prod. Dans la région West Europe, l'abonnement utilise actuellement 120 de ses 1 000 processeurs virtuels régionaux au total.

    Le déploiement d'une machine virtuelle Standard_M128s pour SAP HANA dans West Europe échoue. L'erreur indique que le quota de processeurs virtuels de la famille de la machine virtuelle serait dépassé.

    Vous devez déployer la machine virtuelle.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Request an increase of the total regional vCPU quota in West Europe", fr: "Demander une augmentation du quota total de processeurs virtuels régionaux dans West Europe" } }
    - { id: b, text: { en: "Create an on-demand capacity reservation for Standard_M128s", fr: "Créer une réservation de capacité à la demande pour Standard_M128s" } }
    - { id: c, text: { en: "Request an increase of the VM-family vCPU quota in West Europe", fr: "Demander une augmentation du quota de processeurs virtuels de la famille de machines virtuelles dans West Europe" } }
    - { id: d, text: { en: "Purchase a reserved VM instance for Standard_M128s", fr: "Acheter une instance de machine virtuelle réservée pour Standard_M128s" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      vCPU quotas are enforced per subscription and per region at two tiers: total regional vCPUs and vCPUs per VM-size family. A new VM must fit within both. Here the regional quota has room, so you must raise the quota of the VM's family in West Europe.
    fr: |
      Les quotas de processeurs virtuels s'appliquent par abonnement et par région à deux niveaux : le total des processeurs virtuels régionaux et les processeurs virtuels par famille de tailles de machines virtuelles. Une nouvelle machine virtuelle doit respecter les deux. Ici, le quota régional a de la marge : vous devez augmenter le quota de la famille de la machine virtuelle dans West Europe.
  options:
    a:
      en: |
        The regional quota still has 880 free vCPUs; the family quota is the limit that blocks the deployment.
      fr: |
        Le quota régional dispose encore de 880 processeurs virtuels libres ; c'est le quota de la famille qui bloque le déploiement.
    b:
      en: |
        Creating a capacity reservation also consumes quota, so it fails for the same reason.
      fr: |
        La création d'une réservation de capacité consomme aussi du quota : elle échoue pour la même raison.
    d:
      en: |
        A reservation is a billing discount; it doesn't raise the family quota that blocks the deployment.
      fr: |
        Une réservation est une remise de facturation ; elle n'augmente pas le quota de famille qui bloque le déploiement.
references:
  - title: Check vCPU quotas
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/quotas
