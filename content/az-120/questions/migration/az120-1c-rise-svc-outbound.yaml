id: az120-1c-rise-svc-outbound
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation runs SAP S/4HANA in RISE with SAP on Azure. SAP has enabled outbound internet access for the RISE landscape. The RISE virtual network is peered with the Adatum hub, which contains Azure Firewall.

    Adatum deploys an integration application on Azure virtual machines in a spoke virtual network. The application reads data from S/4HANA and must call a partner REST API on the internet. Adatum security requires all its own outbound traffic to be inspected centrally.

    You need to design the outbound path of the integration application.

    What should you include in the design?
  fr: |
    Adatum Corporation exécute SAP S/4HANA dans RISE with SAP sur Azure. SAP a activé l'accès Internet sortant pour le paysage RISE. Le réseau virtuel RISE est relié par peering au hub d'Adatum, qui contient le Pare-feu Azure.

    Adatum déploie une application d'intégration sur des machines virtuelles Azure d'un réseau virtuel spoke. L'application lit des données de S/4HANA et doit appeler une API REST partenaire sur Internet. La sécurité d'Adatum exige que tout son trafic sortant soit inspecté de manière centralisée.

    Vous devez concevoir le chemin sortant de l'application d'intégration.

    Que devez-vous inclure dans la conception ?
body:
  options:
    - id: a
      text: { en: "A user-defined route in the spoke that sends 0.0.0.0/0 to the proxy servers in the RISE network", fr: "Un itinéraire défini par l'utilisateur dans le spoke qui envoie 0.0.0.0/0 vers les serveurs proxy du réseau RISE" }
    - id: b
      text: { en: "A user-defined route in the spoke that sends 0.0.0.0/0 to the Azure Firewall in the Adatum hub", fr: "Un itinéraire défini par l'utilisateur dans le spoke qui envoie 0.0.0.0/0 vers le Pare-feu Azure du hub d'Adatum" }
    - id: c
      text: { en: "A request to SAP to add outbound NSG rules for the spoke in the RISE network", fr: "Une demande à SAP d'ajouter des règles NSG sortantes pour le spoke dans le réseau RISE" }
    - id: d
      text: { en: "A user-defined route in the spoke that sends 0.0.0.0/0 to the SAP-managed Application Gateway", fr: "Un itinéraire défini par l'utilisateur dans le spoke qui envoie 0.0.0.0/0 vers l'Application Gateway géré par SAP" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Applications in the customer's own VNets reach the internet directly or through the customer's centrally managed services, such as Azure Firewall or NAT Gateway; that path is managed by the customer. The internet path of RISE stays within the RISE VNet and is managed by SAP for the RISE systems only.
    fr: |
      Les applications des réseaux virtuels du client accèdent à Internet directement ou par les services gérés de manière centralisée par le client, comme le Pare-feu Azure ou NAT Gateway ; ce chemin est géré par le client. Le chemin Internet de RISE reste dans le réseau virtuel RISE et il est géré par SAP pour les seuls systèmes RISE.
  options:
    a:
      en: |
        The proxies and other internet services of RISE are managed by SAP for the RISE landscape; customer traffic does not use them.
      fr: |
        Les proxys et autres services Internet de RISE sont gérés par SAP pour le paysage RISE ; le trafic du client ne les utilise pas.
    c:
      en: |
        NSG rules in the RISE VNet control traffic to and from the RISE systems; they do not give customer VMs an internet path.
      fr: |
        Les règles NSG du réseau virtuel RISE contrôlent le trafic vers et depuis les systèmes RISE ; elles ne donnent pas de chemin Internet aux machines virtuelles du client.
    d:
      en: |
        The SAP-managed Application Gateway exposes RISE HTTPS endpoints; it is not an outbound path for customer applications.
      fr: |
        L'Application Gateway géré par SAP expose les points de terminaison HTTPS de RISE ; ce n'est pas un chemin sortant pour les applications du client.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
