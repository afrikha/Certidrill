id: az120-1a-cost-levers-dd
objective: "1.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind is building the cost model of its SAP landscape on Azure. Northwind has a Microsoft Customer Agreement and identified the following requirements.

    Which option should you recommend for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind construit le modèle de coûts de son paysage SAP sur Azure. Northwind dispose d'un Contrat client Microsoft et a identifié les exigences suivantes.

    Quelle option devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ri, text: { en: "Reserved VM instances", fr: "Instances de machine virtuelle réservées" } }
    - { id: sp, text: { en: "Compute savings plan", fr: "Plan d'économies pour le calcul" } }
    - { id: ahb, text: { en: "Azure Hybrid Benefit", fr: "Azure Hybrid Benefit" } }
    - { id: constrained, text: { en: "Constrained vCPU VM size", fr: "Taille de machine virtuelle à processeurs virtuels limités" } }
    - { id: capres, text: { en: "On-demand capacity reservation", fr: "Réservation de capacité à la demande" } }
    - { id: spot, text: { en: "Azure Spot VMs", fr: "Machines virtuelles Azure Spot" } }
  targets:
    - id: win
      text: { en: "Reuse existing Windows Server licenses with Software Assurance on the application servers", fr: "Réutiliser des licences Windows Server existantes avec Software Assurance sur les serveurs d'applications" }
    - id: sql
      text: { en: "Reduce the SQL Server core licenses of a database VM without reducing its memory or IOPS", fr: "Réduire les licences de cœurs SQL Server d'une machine virtuelle de base de données sans réduire sa mémoire ni ses IOPS" }
    - id: flex
      text: { en: "Get a discount on compute spend that will shift between VM families and regions", fr: "Obtenir une remise sur une dépense de calcul qui passera d'une famille de machines virtuelles et d'une région à l'autre" }
    - id: dr
      text: { en: "Guarantee capacity for DR VMs in another region without a term commitment", fr: "Garantir de la capacité pour des machines virtuelles de DR dans une autre région sans engagement de durée" }
answer:
  mapping: { win: ahb, sql: constrained, flex: sp, dr: capres }
explanation:
  correct:
    en: |
      Azure Hybrid Benefit reuses Windows Server licenses with Software Assurance. A constrained vCPU size keeps the memory and I/O of its base size with fewer active vCPUs, which lowers per-core licensing. A savings plan applies an hourly commitment across VM families and regions. An on-demand capacity reservation guarantees capacity in a region or zone, with no term, at pay-as-you-go rates.
    fr: |
      Azure Hybrid Benefit réutilise les licences Windows Server avec Software Assurance. Une taille à processeurs virtuels limités conserve la mémoire et les E/S de sa taille de base avec moins de processeurs virtuels actifs, ce qui réduit les licences par cœur. Un plan d'économies applique un engagement horaire à toutes les familles de machines virtuelles et à toutes les régions. Une réservation de capacité à la demande garantit de la capacité dans une région ou une zone, sans durée, au tarif de paiement à l'utilisation.
  options:
    ri:
      en: |
        Reservations are tied to a VM family and region and require a one-year or three-year term.
      fr: |
        Les réservations sont liées à une famille de machines virtuelles et à une région et exigent une durée d'un an ou de trois ans.
    spot:
      en: |
        Spot VMs offer no capacity guarantee and can be evicted.
      fr: |
        Les machines virtuelles Spot n'offrent aucune garantie de capacité et peuvent être évincées.
references:
  - title: Decide between a savings plan and a reservation
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
  - title: Constrained vCPU sizes for database workloads
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/constrained-vcpu
