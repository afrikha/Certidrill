id: az120-1c-rise-impl-peering-role
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation is setting up virtual network peering between its hub virtual network **vnet-hub** and its RISE with SAP virtual network in SAP's tenant. An SAP network engineer has been added as a guest user in the Adatum Microsoft Entra tenant so that SAP can create its side of the peering to vnet-hub.

    You need to grant the guest user the permissions required on vnet-hub. The solution must follow the principle of least privilege.

    Which built-in role should you assign on vnet-hub?
  fr: |
    Adatum Corporation configure un peering de réseaux virtuels entre son réseau virtuel hub **vnet-hub** et son réseau virtuel RISE with SAP du locataire de SAP. Un ingénieur réseau de SAP a été ajouté comme utilisateur invité dans le locataire Microsoft Entra d'Adatum afin que SAP puisse créer son côté du peering vers vnet-hub.

    Vous devez accorder à l'utilisateur invité les autorisations requises sur vnet-hub. La solution doit respecter le principe du moindre privilège.

    Quel rôle intégré devez-vous attribuer sur vnet-hub ?
body:
  options:
    - { id: a, text: Contributor }
    - { id: b, text: Reader }
    - { id: c, text: Virtual Machine Contributor }
    - { id: d, text: Network Contributor }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Accounts that create virtual network peerings need the Network Contributor role (or a custom role with the peering actions) on the virtual network. For a cross-tenant peering, each tenant adds the other side's user as a guest and assigns Network Contributor on its virtual network.
    fr: |
      Les comptes qui créent des peerings de réseaux virtuels ont besoin du rôle Network Contributor (ou d'un rôle personnalisé comportant les actions de peering) sur le réseau virtuel. Pour un peering entre locataires, chaque locataire ajoute l'utilisateur de l'autre partie comme invité et lui attribue Network Contributor sur son réseau virtuel.
  options:
    a:
      en: |
        Contributor works but grants far more than network permissions, so it does not follow least privilege.
      fr: |
        Contributor fonctionne mais accorde bien plus que des autorisations réseau : il ne respecte pas le moindre privilège.
    b:
      en: |
        Reader cannot create or modify peerings.
      fr: |
        Reader ne permet pas de créer ni de modifier des peerings.
    c:
      en: |
        Virtual Machine Contributor manages VMs, not virtual network peerings.
      fr: |
        Virtual Machine Contributor gère les machines virtuelles, pas les peerings de réseaux virtuels.
references:
  - title: Create, Change, or Delete Azure Virtual Network Peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
  - title: Create Virtual Network Peering Between Different Subscriptions - Azure Virtual Network
    url: https://learn.microsoft.com/en-us/azure/virtual-network/create-peering-different-subscriptions
