id: az120-1b-lsm-match-approach
objective: "1.1.8"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys plans to move four SAP systems from its datacenter to Azure. The answer area describes each system and what must change.

    Which migration approach should you use for each system? To answer, drag the appropriate approaches to the correct systems. Each approach may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit de déplacer quatre systèmes SAP de son centre de données vers Azure. La zone de réponse décrit chaque système et ce qui doit changer.

    Quelle approche de migration devez-vous utiliser pour chaque système ? Pour répondre, faites glisser les approches appropriées vers les systèmes correspondants. Chaque approche peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: lsh, text: { en: "Lift and shift", fr: "Lift-and-shift" } }
    - { id: lsm, text: { en: "Lift-shift-migrate", fr: "Lift-shift-migrate" } }
    - { id: lsmh, text: { en: "Lift-shift-migrate to HANA", fr: "Lift-shift-migrate vers HANA" } }
    - { id: green, text: { en: "Greenfield implementation", fr: "Implémentation greenfield" } }
  targets:
    - id: t1
      text: { en: "SAP ERP on SLES with SAP HANA 2.0 on x86 servers; the same OS and HANA release in Azure", fr: "SAP ERP sur SLES avec SAP HANA 2.0 sur serveurs x86 ; même système d'exploitation et même version HANA dans Azure" }
    - id: t2
      text: { en: "SAP BW on Windows Server with SQL Server; it must run as SAP BW on HANA in Azure", fr: "SAP BW sur Windows Server avec SQL Server ; il doit s'exécuter en SAP BW on HANA dans Azure" }
    - id: t3
      text: { en: "SAP ERP on AIX with IBM Db2; it must run on Windows Server with SQL Server in Azure", fr: "SAP ERP sur AIX avec IBM Db2 ; il doit s'exécuter sur Windows Server avec SQL Server dans Azure" }
    - id: t4
      text: { en: "SAP Process Integration on HP-UX with Oracle; Oracle stays, on Oracle Linux in Azure", fr: "SAP Process Integration sur HP-UX avec Oracle ; Oracle est conservé, sur Oracle Linux dans Azure" }
answer:
  mapping: { t1: lsh, t2: lsmh, t3: lsm, t4: lsm }
explanation:
  correct:
    en: A system that keeps its OS, DBMS and processor architecture is a lift and shift (homogeneous copy). A system whose database becomes SAP HANA is a lift-shift-migrate to HANA (DMO). A change of operating system, DBMS or byte order to a non-HANA target is a lift-shift-migrate (heterogeneous copy); HP-UX keeping Oracle still changes the operating system and the byte order. A greenfield implementation rebuilds the solution instead of migrating the existing system.
    fr: "Un système qui conserve son système d'exploitation, son SGBD et son architecture de processeur relève du lift-and-shift (copie homogène). Un système dont la base de données devient SAP HANA relève du lift-shift-migrate vers HANA (DMO). Un changement de système d'exploitation, de SGBD ou d'ordre des octets vers une cible autre que HANA relève du lift-shift-migrate (copie hétérogène) ; HP-UX avec Oracle conservé change quand même de système d'exploitation et d'ordre des octets. Une implémentation greenfield reconstruit la solution au lieu de migrer le système existant."
references:
  - title: Compare classical migration with the SAP database migration option (DMO)
    url: https://learn.microsoft.com/en-us/training/modules/explore-migration-options/4-compare-classic-vs-sap-database-move-only
  - title: Explore very large database migration
    url: https://learn.microsoft.com/en-us/training/modules/migrate-very-large-databases-to-azure/2-explore-very-large-database-migration
