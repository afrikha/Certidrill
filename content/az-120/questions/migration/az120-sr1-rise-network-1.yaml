id: az120-sr1-rise-network-1
objective: "1.3.1"
type: series_yesno
series: az120-sr1-rise-network
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |-
    You ask SAP for a dedicated ExpressRoute connection into the RISE virtual network.
  fr: |-
    Vous demandez à SAP une connexion ExpressRoute dédiée vers le réseau virtuel RISE.
body:
  solution:
    en: |-
      You ask SAP to provision a **dedicated ExpressRoute connection** between the on-premises network and the RISE virtual network, and you configure a **DNS zone transfer** of ecs.contoso.com from the SAP DNS servers to the AD DS DNS servers in Hub1.
    fr: |-
      Vous demandez à SAP de provisionner une **connexion ExpressRoute dédiée** entre le réseau local et le réseau virtuel RISE, et vous configurez un **transfert de zone DNS** de ecs.contoso.com depuis les serveurs DNS de SAP vers les serveurs DNS AD DS de Hub1.
answer: { value: false }
explanation:
  correct:
    en: |-
      An ExpressRoute or VPN connection that SAP establishes directly into RISE reaches only the SAP-managed virtual network and can't be used to reach the customer's own Azure virtual networks. It also bypasses the existing Contoso circuit, which the requirements say to use. The recommended design is a virtual network peering between Hub1 and the RISE virtual network, with the existing gateway in Hub1 providing the on-premises path.
    fr: |-
      Une connexion ExpressRoute ou VPN que SAP établit directement vers RISE n'atteint que le réseau virtuel géré par SAP et ne peut pas servir à accéder aux réseaux virtuels Azure du client. Elle contourne aussi le circuit existant de Contoso, que les exigences imposent. La conception recommandée est un peering de réseaux virtuels entre Hub1 et le réseau virtuel RISE, la passerelle existante de Hub1 fournissant le chemin vers le réseau local.
references:
  - title: Connectivity with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
