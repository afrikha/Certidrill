id: az120-1b-pol-layering
objective: "1.2.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank governs its SAP landscape with Azure Policy. The SAP subscriptions are under a management group named **MG-SAP**. A subscription named **Sub-SAP-Prod** contains a resource group named **RG-SAP-DR**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank gouverne son paysage SAP avec Azure Policy. Les abonnements SAP se trouvent sous un groupe d'administration nommé **MG-SAP**. Un abonnement nommé **Sub-SAP-Prod** contient un groupe de ressources nommé **RG-SAP-DR**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If a deny assignment on MG-SAP allows only West Europe and a deny assignment on RG-SAP-DR allows only North Europe, the creation of a VM in RG-SAP-DR is denied in both regions.
        fr: Si une attribution deny sur MG-SAP n'autorise que West Europe et qu'une attribution deny sur RG-SAP-DR n'autorise que North Europe, la création d'une machine virtuelle dans RG-SAP-DR est refusée dans les deux régions.
    - id: s2
      text:
        en: A modify policy that adds a missing tag can prevent a deny policy that requires the same tag from blocking a request.
        fr: Une stratégie modify qui ajoute une étiquette manquante peut empêcher une stratégie deny qui exige la même étiquette de bloquer une demande.
    - id: s3
      text:
        en: The Owner of Sub-SAP-Prod can remove a policy assignment inherited from MG-SAP by deleting it at the subscription scope.
        fr: Le propriétaire (Owner) de Sub-SAP-Prod peut supprimer une attribution de stratégie héritée de MG-SAP en la supprimant à l'étendue de l'abonnement.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: Assignments are evaluated independently and the result is cumulative most restrictive, so a resource in RG-SAP-DR must satisfy both location lists and no region qualifies. Append and modify are evaluated before deny and can change the request, so the added tag makes the request compliant with the deny policy. An assignment made at a management group exists at that scope; the owner of a child subscription cannot alter it.
    fr: Les attributions sont évaluées indépendamment et le résultat est cumulatif et le plus restrictif ; une ressource de RG-SAP-DR doit donc respecter les deux listes d'emplacements, et aucune région ne convient. Append et modify sont évalués avant deny et peuvent modifier la demande ; l'étiquette ajoutée rend donc la demande conforme à la stratégie deny. Une attribution effectuée sur un groupe d'administration existe à cette étendue ; le propriétaire d'un abonnement enfant ne peut pas la modifier.
references:
  - title: Azure Policy definitions effect basics
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-basics
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
