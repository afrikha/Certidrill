id: az120-1b-hier-statements
objective: "1.2.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is planning the management hierarchy for its SAP workloads in Azure.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders planifie la hiérarchie de gestion de ses charges de travail SAP dans Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The SAP production subscription can be a child of the Corp management group and of an SAP management group at the same time.
        fr: L'abonnement SAP de production peut être à la fois l'enfant du groupe d'administration Corp et d'un groupe d'administration SAP.
    - id: s2
      text:
        en: When no default management group is configured, a newly created subscription is placed under the tenant root group.
        fr: Lorsqu'aucun groupe d'administration par défaut n'est configuré, un abonnement nouvellement créé est placé sous le Groupe racine du locataire.
    - id: s3
      text:
        en: The region of a resource group determines where the data of the virtual machines and disks that it contains is stored.
        fr: La région d'un groupe de ressources détermine l'emplacement de stockage des données des machines virtuelles et des disques qu'il contient.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: Each management group and subscription supports only one parent. New subscriptions default to the root management group unless a default management group is configured in the hierarchy settings. The location of a resource group is where its metadata is stored; the resources keep their own regions and their data stays there.
    fr: Chaque groupe d'administration et chaque abonnement n'acceptent qu'un seul parent. Les nouveaux abonnements sont placés par défaut sous le groupe d'administration racine, sauf si un groupe d'administration par défaut est configuré dans les paramètres de hiérarchie. L'emplacement d'un groupe de ressources est celui où sont stockées ses métadonnées ; les ressources conservent leurs propres régions et leurs données y restent.
references:
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
