id: az120-1a-supp-plans-dd
objective: "1.1.7"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses a separate Azure subscription for each SAP environment. Each subscription will get its own Azure support plan, and each plan must be the lowest-cost one that meets the requirement of its environment.

    Which support plan should you recommend for each environment? To answer, drag the appropriate plans to the correct environments. Each plan may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise un abonnement Azure distinct pour chaque environnement SAP. Chaque abonnement aura son propre plan de support Azure, et chaque plan doit être le moins cher qui réponde à l'exigence de son environnement.

    Quel plan de support devez-vous recommander pour chaque environnement ? Pour répondre, faites glisser les plans appropriés vers les environnements correspondants. Chaque plan peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: basic, text: Basic }
    - { id: dev, text: Developer }
    - { id: std, text: Standard }
    - { id: prodirect, text: Professional Direct }
    - { id: unified, text: Unified Enterprise }
  targets:
    - id: sandbox
      text: { en: "Sandbox: billing questions and quota increases only, no technical support", fr: "Bac à sable : questions de facturation et augmentations de quota uniquement, sans support technique" }
    - id: training
      text: { en: "Training: technical support during business hours for minimal-impact issues", fr: "Formation : support technique aux heures ouvrées pour des problèmes à impact minimal" }
    - id: qa
      text: { en: "Quality assurance: 24x7 technical support with a one-hour response for critical issues", fr: "Assurance qualité : support technique 24 h/24, 7 j/7 avec une réponse en une heure pour les problèmes critiques" }
    - id: prod
      text: { en: "Production: Azure-only support with architecture guidance from a pool of delivery managers", fr: "Production : support Azure uniquement avec des conseils d'architecture d'un pool de responsables de la prestation (delivery managers)" }
answer:
  mapping: { sandbox: basic, training: dev, qa: std, prod: prodirect }
explanation:
  correct:
    en: |
      Basic includes billing and subscription management, such as quota requests, but no technical support. Developer provides business-hours technical support for Severity C issues. Standard adds 24x7 support with a one-hour response for Severity A. Professional Direct adds architecture and operations guidance from a pool of ProDirect delivery managers, for Azure only.
    fr: |
      Basic inclut la facturation et la gestion des abonnements, comme les demandes de quota, mais aucun support technique. Developer fournit un support technique aux heures ouvrées pour les problèmes de gravité C. Standard ajoute un support 24 h/24, 7 j/7 avec une réponse en une heure pour la gravité A. Professional Direct ajoute des conseils d'architecture et d'exploitation d'un pool de responsables de la prestation ProDirect, pour Azure uniquement.
  options:
    unified:
      en: |
        Unified Enterprise meets these needs but costs more and covers products beyond Azure.
      fr: |
        Unified Enterprise répond à ces besoins, mais coûte plus cher et couvre des produits au-delà d'Azure.
references:
  - title: Create an Azure support request
    url: https://learn.microsoft.com/en-us/azure/azure-portal/supportability/how-to-create-azure-support-request
