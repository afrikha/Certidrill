id: az120-1a-req-config-hot
objective: "1.1.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Contoso proposes the following disk configuration for a production SAP HANA scale-up system on a Standard_M64s virtual machine. The VM also hosts the SAP global transport directory, which it exports to the other SAP systems over NFS.

    Answer each prompt by selecting the appropriate row in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso propose la configuration de disques suivante pour un système SAP HANA scale-up de production sur une machine virtuelle Standard_M64s. La machine virtuelle héberge aussi le répertoire de transport global SAP, qu'elle exporte en NFS vers les autres systèmes SAP.

    Répondez à chaque consigne en sélectionnant la ligne appropriée du tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Select the SAP HANA volume whose configuration doesn't meet the production storage latency KPIs.", fr: "Sélectionnez le volume SAP HANA dont la configuration ne respecte pas les KPI de latence de stockage de production." }
    - id: p2
      text: { en: "Select the volume that uses a storage type that isn't supported for its content.", fr: "Sélectionnez le volume qui utilise un type de stockage non pris en charge pour son contenu." }
  grid:
    header: [{ en: "Volume", fr: "Volume" }, { en: "Disk type", fr: "Type de disque" }, { en: "Disks", fr: "Disques" }, { en: "Host caching", fr: "Mise en cache de l'hôte" }, Write Accelerator]
    rows:
      - [{ text: { en: "OS disk", fr: "Disque du système d'exploitation" }, area: os }, { text: Premium SSD }, { text: 1 x P10 }, { text: ReadWrite }, { text: { en: "Off", fr: "Désactivé" } }]
      - [{ text: /hana/data, area: data }, { text: Premium SSD }, { text: 4 x P15 }, { text: None }, { text: { en: "Off", fr: "Désactivé" } }]
      - [{ text: /hana/log, area: log }, { text: Premium SSD }, { text: 3 x P15 }, { text: None }, { text: { en: "Off", fr: "Désactivé" } }]
      - [{ text: /hana/shared, area: shared }, { text: Premium SSD }, { text: 1 x P30 }, { text: ReadOnly }, { text: { en: "Off", fr: "Désactivé" } }]
      - [{ text: /usr/sap/trans, area: trans }, { text: Standard SSD }, { text: 1 x E15 }, { text: ReadOnly }, { text: { en: "Off", fr: "Désactivé" } }]
answer:
  values: { p1: log, p2: trans }
explanation:
  correct:
    en: |
      On an M-series VM with Premium SSD, Write Accelerator is mandatory for /hana/log; without it, the log volume doesn't meet the HANA latency KPIs. Standard SSD isn't supported for the SAP global transport directory, whose latency it can't meet; use Premium SSD, Azure Files SSD or Azure NetApp Files. The OS, data and shared volumes follow the documented recommendations.
    fr: |
      Sur une machine virtuelle de série M avec SSD Premium, Write Accelerator est obligatoire pour /hana/log ; sans lui, le volume de journal ne respecte pas les KPI de latence de HANA. Le SSD Standard n'est pas pris en charge pour le répertoire de transport global SAP, dont il ne peut pas tenir la latence ; utilisez du SSD Premium, Azure Files SSD ou Azure NetApp Files. Les volumes du système d'exploitation, des données et partagé suivent les recommandations documentées.
references:
  - title: SAP HANA Azure virtual machine Premium SSD storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-premium-ssd-v1
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
