id: az120-1b-authn-fiori-saml
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. runs SAP S/4HANA on Azure virtual machines. Users access the SAP Fiori launchpad from a browser.

    Users must sign in to SAP Fiori with their Microsoft Entra accounts without entering an SAP password, and Contoso wants to control the access from Microsoft Entra ID.

    What should you configure?
  fr: |
    Contoso, Ltd. exécute SAP S/4HANA sur des machines virtuelles Azure. Les utilisateurs accèdent au launchpad SAP Fiori depuis un navigateur.

    Les utilisateurs doivent se connecter à SAP Fiori avec leurs comptes Microsoft Entra sans saisir de mot de passe SAP, et Contoso veut contrôler l'accès depuis Microsoft Entra ID.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A Microsoft Entra Domain Services managed domain used for LDAP binds by SAP", fr: "Un domaine managé Microsoft Entra Domain Services utilisé par SAP pour des liaisons LDAP" } }
    - { id: b, text: { en: "SAML single sign-on between Microsoft Entra ID and the SAP NetWeaver ABAP system", fr: "Une authentification unique SAML entre Microsoft Entra ID et le système SAP NetWeaver ABAP" } }
    - { id: c, text: { en: "The AADSSHLoginForLinux extension on the SAP application server VMs", fr: "L'extension AADSSHLoginForLinux sur les machines virtuelles des serveurs d'applications SAP" } }
    - { id: d, text: { en: "Password hash synchronization in Microsoft Entra Connect", fr: "La synchronisation du hachage de mot de passe dans Microsoft Entra Connect" } }
answer: { optionId: b }
explanation:
  correct:
    en: SAP Fiori and other SAP NetWeaver web applications support SAML 2.0. You add the SAP NetWeaver (or SAP Fiori) application from the Microsoft Entra gallery, exchange metadata with transaction SAML2, and Microsoft Entra ID then authenticates the users and controls access.
    fr: SAP Fiori et les autres applications web SAP NetWeaver prennent en charge SAML 2.0. Vous ajoutez l'application SAP NetWeaver (ou SAP Fiori) depuis la galerie Microsoft Entra, échangez les métadonnées avec la transaction SAML2, puis Microsoft Entra ID authentifie les utilisateurs et contrôle l'accès.
  options:
    a:
      en: LDAP binds against a managed domain would still prompt for a password and don't provide browser SSO.
      fr: Des liaisons LDAP sur un domaine managé demanderaient toujours un mot de passe et ne fournissent pas d'authentification unique dans le navigateur.
    c:
      en: This extension enables Microsoft Entra sign-in to the Linux operating system over SSH, not to SAP applications.
      fr: Cette extension permet la connexion Microsoft Entra au système d'exploitation Linux par SSH, pas aux applications SAP.
    d:
      en: Password hash synchronization lets users authenticate to Microsoft Entra ID; it doesn't configure SSO to SAP Fiori.
      fr: La synchronisation du hachage de mot de passe permet aux utilisateurs de s'authentifier auprès de Microsoft Entra ID ; elle ne configure pas l'authentification unique vers SAP Fiori.
references:
  - title: Configure SAP NetWeaver for Single sign-on with Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/saas-apps/sap-netweaver-tutorial
