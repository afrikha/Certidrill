id: az120-1c-rise-data-cdc-multi
objective: "1.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. runs SAP S/4HANA in RISE with SAP on Azure. Litware builds Azure Data Factory mapping data flows that use the SAP CDC connector to replicate several S/4HANA objects incrementally to Azure Data Lake Storage Gen2.

    Which two statements about the solution are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. exécute SAP S/4HANA dans RISE with SAP sur Azure. Litware crée des flux de données de mappage Azure Data Factory qui utilisent le connecteur SAP CDC pour répliquer de façon incrémentielle plusieurs objets S/4HANA vers Azure Data Lake Storage Gen2.

    Quelles sont les deux affirmations vraies sur la solution ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "The connector extracts the data by using the SAP ODP framework.", fr: "Le connecteur extrait les données en utilisant l'infrastructure SAP ODP." }
    - id: b
      text: { en: "The staging linked service of the data flow can use the self-hosted integration runtime.", fr: "Le service lié intermédiaire (staging) du flux de données peut utiliser le runtime d'intégration auto-hébergé." }
    - id: c
      text: { en: "You can reset the ODQ subscriptions of a source from the Data Factory monitoring view.", fr: "Vous pouvez réinitialiser les abonnements ODQ d'une source depuis la vue de supervision de Data Factory." }
    - id: d
      text: { en: "Each source of the data flows should use its own unique checkpoint key.", fr: "Chaque source des flux de données doit utiliser sa propre clé de point de contrôle unique." }
    - id: e
      text: { en: "The connector can also be used as a sink in a copy activity.", fr: "Le connecteur peut aussi être utilisé comme récepteur dans une activité de copie." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      The SAP CDC connector uses the SAP ODP framework, which is present in up-to-date SAP NetWeaver-based systems. The checkpoint key stores the change data capture state, so each source must use a unique checkpoint key.
    fr: |
      Le connecteur SAP CDC utilise l'infrastructure SAP ODP, présente dans les systèmes SAP NetWeaver à jour. La clé de point de contrôle stocke l'état de la capture des changements de données : chaque source doit donc utiliser une clé de point de contrôle unique.
  options:
    b:
      en: |
        The staging linked service cannot use a self-hosted integration runtime.
      fr: |
        Le service lié intermédiaire (staging) ne peut pas utiliser de runtime d'intégration auto-hébergé.
    c:
      en: |
        ODQ subscriptions cannot be reset or deleted in Data Factory; use transaction ODQMON in the SAP system.
      fr: |
        Les abonnements ODQ ne peuvent pas être réinitialisés ni supprimés dans Data Factory ; utilisez la transaction ODQMON dans le système SAP.
    e:
      en: |
        The connector is supported only as a source in mapping data flows.
      fr: |
        Le connecteur n'est pris en charge que comme source dans les flux de données de mappage.
references:
  - title: Transform data from an SAP ODP source with the SAP CDC connector in Azure Data Factory or Azure Synapse Analytics - Azure Data Factory & Azure Synapse
    url: https://learn.microsoft.com/en-us/azure/data-factory/connector-sap-change-data-capture
