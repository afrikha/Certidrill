id: az120-1b-tool-system-move-order
objective: "1.1.9"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys plans to migrate SAP ERP from its datacenter to SAP HANA in Azure by using DMO with System Move in sequential data transfer mode. Nothing has been deployed in Azure yet.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys prévoit de migrer SAP ERP de son centre de données vers SAP HANA dans Azure à l'aide de DMO with System Move en mode de transfert séquentiel. Rien n'a encore été déployé dans Azure.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: net, text: { en: "Establish ExpressRoute or VPN connectivity and deploy the SAP NetWeaver and SAP HANA servers in Azure.", fr: "Établir la connectivité ExpressRoute ou VPN et déployer les serveurs SAP NetWeaver et SAP HANA dans Azure." } }
    - { id: uptime, text: { en: "Start SUM on the on-premises application server and run the uptime phases that build the shadow repository.", fr: "Démarrer SUM sur le serveur d'applications local et exécuter les phases de disponibilité qui construisent le référentiel fantôme." } }
    - { id: export, text: { en: "Run the downtime export to the file system of the on-premises application server.", fr: "Exécuter l'export du temps d'arrêt vers le système de fichiers du serveur d'applications local." } }
    - { id: copy, text: { en: "Transfer the complete SUM directory to the target application server in Azure.", fr: "Transférer le répertoire SUM complet vers le serveur d'applications cible dans Azure." } }
    - { id: import, text: { en: "Continue SUM on the Azure application server to run the import and the post-processing.", fr: "Poursuivre SUM sur le serveur d'applications Azure pour exécuter l'import et le post-traitement." } }
    - { id: restore, text: { en: "Restore a full backup of the source database on the SAP HANA server in Azure.", fr: "Restaurer une sauvegarde complète de la base de données source sur le serveur SAP HANA dans Azure." } }
    - { id: shadowaz, text: { en: "Start SUM on the SAP HANA server in Azure to build the shadow repository.", fr: "Démarrer SUM sur le serveur SAP HANA dans Azure pour construire le référentiel fantôme." } }
answer:
  sequence: [ net, uptime, export, copy, import ]
explanation:
  correct:
    en: The Azure targets and the network path come first. SUM then starts on the on-premises application server, builds the shadow repository during uptime and exports the tables during downtime to the local file system. In sequential mode, the complete SUM directory is transferred to Azure after the export (resynchronized in the HOSTCHANGE phase), and SUM continues on the Azure application server with the import and post-processing.
    fr: "Les cibles Azure et le chemin réseau viennent en premier. SUM démarre ensuite sur le serveur d'applications local, construit le référentiel fantôme pendant la disponibilité et exporte les tables pendant le temps d'arrêt vers le système de fichiers local. En mode séquentiel, le répertoire SUM complet est transféré vers Azure après l'export (resynchronisé dans la phase HOSTCHANGE), et SUM se poursuit sur le serveur d'applications Azure avec l'import et le post-traitement."
  options:
    restore: { en: "DMO moves the data by export and import; a source database backup cannot be restored on SAP HANA.", fr: "DMO déplace les données par export et import ; une sauvegarde de la base source ne peut pas être restaurée sur SAP HANA." }
    shadowaz: { en: "The shadow repository is built on the source database while SUM runs on premises.", fr: "Le référentiel fantôme est construit sur la base de données source pendant que SUM s'exécute en local." }
references:
  - title: Explore one-step migration - DMO with system move option
    url: https://learn.microsoft.com/en-us/training/modules/explore-migration-options/6-explore-one-step-migration-database-move-only-option-system-move-option
