id: az120-1c-lz-zone-resilience-policy
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation uses Azure landing zones. All the SAP subscriptions (production, non-production and future ones) are placed under an intermediate management group named **MG-SAP**.

    You need to apply a "start resilient and stay resilient" approach to the SAP landing zones. The solution must detect existing resources that are not zone resilient, prevent new non-resilient configurations in every current and future SAP subscription, and minimize administrative effort.

    What should you do?
  fr: |
    Adatum Corporation utilise des zones d'atterrissage Azure. Tous les abonnements SAP (production, hors production et futurs abonnements) sont placés sous un groupe d'administration intermédiaire nommé **MG-SAP**.

    Vous devez appliquer aux zones d'atterrissage SAP une approche « démarrer résilient et le rester ». La solution doit détecter les ressources existantes qui ne sont pas résilientes aux zones, empêcher les nouvelles configurations non résilientes dans chaque abonnement SAP actuel et futur, et réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Assign the Azure Policy initiative for zone resilience to each SAP resource group.", fr: "Attribuer l'initiative Azure Policy de résilience aux zones à chaque groupe de ressources SAP." }
    - id: b
      text: { en: "Create Azure Advisor alerts for the reliability recommendations of each SAP subscription.", fr: "Créer des alertes Azure Advisor sur les recommandations de fiabilité de chaque abonnement SAP." }
    - id: c
      text: { en: "Apply a ReadOnly lock to each SAP subscription after the first deployment.", fr: "Appliquer un verrou Lecture seule à chaque abonnement SAP après le premier déploiement." }
    - id: d
      text: { en: "Assign the Azure Policy initiative for zone resilience to the MG-SAP management group.", fr: "Attribuer l'initiative Azure Policy de résilience aux zones au groupe d'administration MG-SAP." }
answer: { optionId: d }
explanation:
  correct:
    en: The SAP landing zone guidance assigns the Azure Policy initiative for zone resilience to the intermediate management group. Every subscription placed under MG-SAP, including future ones, inherits the assignment; audit effects detect non-compliant resources and deny effects prevent new ones.
    fr: Les recommandations de zone d'atterrissage SAP attribuent l'initiative Azure Policy de résilience aux zones au groupe d'administration intermédiaire. Chaque abonnement placé sous MG-SAP, y compris les futurs, hérite de l'attribution ; les effets d'audit détectent les ressources non conformes et les effets Deny empêchent les nouvelles.
  options:
    a:
      en: Resource group assignments must be repeated for every new resource group and subscription, which does not minimize effort and misses future ones.
      fr: Les attributions au niveau des groupes de ressources doivent être répétées pour chaque nouveau groupe de ressources et abonnement, ce qui n'est pas minimal et oublie les futurs.
    b:
      en: Advisor recommendations can help detect issues, but they cannot prevent non-resilient deployments.
      fr: Les recommandations Advisor peuvent aider à détecter des problèmes, mais elles ne peuvent pas empêcher les déploiements non résilients.
    c:
      en: A ReadOnly lock blocks all changes, including legitimate resilient deployments; it does not evaluate zone resilience.
      fr: Un verrou Lecture seule bloque toutes les modifications, y compris les déploiements résilients légitimes ; il n'évalue pas la résilience aux zones.
references:
  - title: SAP on Azure landing zone accelerator - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/sap/enterprise-scale-landing-zone
