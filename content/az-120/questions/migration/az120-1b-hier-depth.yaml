id: az120-1b-hier-depth
objective: "1.2.5"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Adatum Corporation is designing the Azure management group hierarchy that will hold its SAP subscriptions. An architect proposes a deeply nested hierarchy that mirrors the organization chart.

    You need to identify the maximum number of management group levels that the hierarchy can contain, excluding the tenant root level and the subscription level.

    What is the maximum number of levels?
  fr: |
    Adatum Corporation conçoit la hiérarchie de groupes d'administration Azure qui contiendra ses abonnements SAP. Un architecte propose une hiérarchie très imbriquée qui reproduit l'organigramme.

    Vous devez identifier le nombre maximal de niveaux de groupes d'administration que peut contenir la hiérarchie, sans compter le niveau racine du locataire ni le niveau des abonnements.

    Quel est le nombre maximal de niveaux ?
body:
  options:
    - { id: a, text: "3" }
    - { id: b, text: "4" }
    - { id: c, text: "6" }
    - { id: d, text: "10" }
answer: { optionId: c }
explanation:
  correct:
    en: A management group tree supports up to six levels of depth, excluding the root level and the subscription level. Microsoft nevertheless recommends a flat hierarchy of three to four levels and advises against mirroring the organization chart.
    fr: Une arborescence de groupes d'administration prend en charge jusqu'à six niveaux de profondeur, sans compter le niveau racine et le niveau des abonnements. Microsoft recommande néanmoins une hiérarchie plate de trois à quatre niveaux et déconseille de reproduire l'organigramme.
  options:
    a: { en: "Three levels is a recommended design target, not the limit.", fr: "Trois niveaux est un objectif de conception recommandé, pas la limite." }
    b: { en: "Four levels is the upper end of the recommended flat design, not the platform limit.", fr: "Quatre niveaux est le haut de la conception plate recommandée, pas la limite de la plateforme." }
    d: { en: "The limit is six levels; 10,000 is the number of management groups a directory supports.", fr: "La limite est de six niveaux ; 10 000 est le nombre de groupes d'administration pris en charge par un annuaire." }
references:
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
  - title: Management groups
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups
