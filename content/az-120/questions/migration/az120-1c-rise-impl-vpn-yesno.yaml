id: az120-1c-rise-impl-vpn-yesno
objective: "1.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys will connect its Azure environment to its RISE with SAP landscape by using a VNet-to-VNet VPN connection between a virtual network gateway in the RISE subscription and a virtual network gateway in the Wingtip subscription.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys va connecter son environnement Azure à son paysage RISE with SAP en utilisant une connexion VPN de réseau virtuel à réseau virtuel entre une passerelle de réseau virtuel de l'abonnement RISE et une passerelle de réseau virtuel de l'abonnement Wingtip.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The throughput of the connection is limited by the gateway SKUs on both sides.
        fr: Le débit de la connexion est limité par les références SKU des passerelles des deux côtés.
    - id: s2
      text:
        en: The two virtual networks must be in the same Azure region.
        fr: Les deux réseaux virtuels doivent se trouver dans la même région Azure.
    - id: s3
      text:
        en: Zone-redundant virtual network gateways are recommended to meet resiliency requirements.
        fr: Des passerelles de réseau virtuel redondantes interzone sont recommandées pour répondre aux exigences de résilience.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      With a VNet-to-VNet VPN to RISE, the throughput depends on the gateway SKUs on both the customer and the SAP side. The two networks can be in different regions. To address resiliency, Microsoft recommends zone-redundant virtual network gateways for this connection.
    fr: |
      Avec un VPN de réseau virtuel à réseau virtuel vers RISE, le débit dépend des références SKU des passerelles côté client et côté SAP. Les deux réseaux peuvent se trouver dans des régions différentes. Pour la résilience, Microsoft recommande des passerelles de réseau virtuel redondantes interzone pour cette connexion.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
