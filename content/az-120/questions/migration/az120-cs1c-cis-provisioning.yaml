id: az120-cs1c-cis-provisioning
objective: "1.2.4"
type: multi
caseStudy: az120-cs1c-tailspin-toys
difficulty: 2
status: draft
stem:
  en: |
    You need to configure automatic provisioning to meet the identity requirement.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer le provisionnement automatique pour satisfaire l'exigence d'identité.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In SAP Cloud Identity Services, create an administrator of type User and give it the Manage Users authorization", fr: "Dans SAP Cloud Identity Services, créer un administrateur de type User et lui donner l'autorisation Manage Users" } }
    - { id: b, text: { en: "In SAP Cloud Identity Services, create an administrator of type System with the Manage Users authorization and a secret", fr: "Dans SAP Cloud Identity Services, créer un administrateur de type System avec l'autorisation Manage Users et un secret" } }
    - { id: c, text: { en: "In the enterprise application, enter the SCIM tenant URL, the client ID and the client secret, and then test the connection", fr: "Dans l'application d'entreprise, saisir l'URL SCIM du locataire, l'ID client et le secret client, puis tester la connexion" } }
    - { id: d, text: { en: "In the enterprise application, configure SAML-based single sign-on so that the provisioning service can authenticate", fr: "Dans l'application d'entreprise, configurer l'authentification unique SAML pour que le service de provisionnement puisse s'authentifier" } }
    - { id: e, text: { en: "Install the Microsoft Entra provisioning agent on a server that can reach SAP Cloud Identity Services", fr: "Installer l'agent de provisionnement Microsoft Entra sur un serveur qui peut atteindre SAP Cloud Identity Services" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      The provisioning service calls the SCIM API of SAP Cloud Identity Services, which accepts only an administrator of type System with the Manage Users authorization. You copy the client ID and client secret of that system into the Admin credentials of the provisioning configuration, with the SCIM tenant URL, and test the connection. Users and groups are already assigned with the User role, and the P1 licenses cover group provisioning.
    fr: |
      Le service de provisionnement appelle l'API SCIM de SAP Cloud Identity Services, qui n'accepte qu'un administrateur de type System disposant de l'autorisation Manage Users. Vous copiez l'ID client et le secret client de ce système dans les informations d'identification d'administrateur de la configuration de provisionnement, avec l'URL SCIM du locataire, puis vous testez la connexion. Les utilisateurs et groupes sont déjà affectés avec le rôle User, et les licences P1 couvrent le provisionnement des groupes.
  options:
    a:
      en: |
        An administrator of type User can't authenticate to the SCIM API for provisioning.
      fr: |
        Un administrateur de type User ne peut pas s'authentifier auprès de l'API SCIM pour le provisionnement.
    d:
      en: |
        Single sign-on is configured separately and is optional; provisioning authenticates with the client ID and secret, not with SAML.
      fr: |
        L'authentification unique se configure séparément et est facultative ; le provisionnement s'authentifie avec l'ID client et le secret, pas avec SAML.
    e:
      en: |
        SAP Cloud Identity Services is a cloud SCIM endpoint that the provisioning service reaches directly; the provisioning agent is used for on-premises targets.
      fr: |
        SAP Cloud Identity Services est un point de terminaison SCIM cloud que le service de provisionnement atteint directement ; l'agent de provisionnement sert aux cibles locales.
references:
  - title: Configure SAP Cloud Identity Services for automatic user provisioning with Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/saas-apps/sap-cloud-platform-identity-authentication-provisioning-tutorial
