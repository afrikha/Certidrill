id: az120-1b-authn-hana-saml
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys configures SAML single sign-on from Microsoft Entra ID to SAP HANA XS Advanced applications that run on an Azure virtual machine. The HANA database users already exist, and each HANA user name equals the part of the user's email address before the @ sign.

    The HANA users are configured for SAML with a specific external identity, not with the Any option. You need to configure the Name claim in the Microsoft Entra enterprise application so that each user is matched to the right HANA user.

    What should you configure?
  fr: |
    Wingtip Toys configure l'authentification unique SAML de Microsoft Entra ID vers des applications SAP HANA XS Advanced qui s'exécutent sur une machine virtuelle Azure. Les utilisateurs de base de données HANA existent déjà, et chaque nom d'utilisateur HANA correspond à la partie de l'adresse e-mail de l'utilisateur située avant le signe @.

    Les utilisateurs HANA sont configurés pour SAML avec une identité externe précise, et non avec l'option Any. Vous devez configurer la revendication Name dans l'application d'entreprise Microsoft Entra pour que chaque utilisateur corresponde au bon utilisateur HANA.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "The ToUppercase() transformation applied to user.displayname", fr: "La transformation ToUppercase() appliquée à user.displayname" } }
    - { id: b, text: { en: "The user.userprincipalname attribute without transformation", fr: "L'attribut user.userprincipalname sans transformation" } }
    - { id: c, text: { en: "The user.objectid attribute without transformation", fr: "L'attribut user.objectid sans transformation" } }
    - { id: d, text: { en: "The ExtractMailPrefix() transformation applied to user.mail", fr: "La transformation ExtractMailPrefix() appliquée à user.mail" } }
answer: { optionId: d }
explanation:
  correct:
    en: When Any isn't selected, the HANA user name must exactly match the prefix of the user's identifier. Applying ExtractMailPrefix() to user.mail sends only the part before the @ sign in the Name claim, which matches the existing HANA user names.
    fr: Lorsque Any n'est pas sélectionné, le nom d'utilisateur HANA doit correspondre exactement au préfixe de l'identifiant de l'utilisateur. Appliquer ExtractMailPrefix() à user.mail n'envoie dans la revendication Name que la partie située avant le signe @, ce qui correspond aux noms d'utilisateurs HANA existants.
  options:
    b:
      en: The full UPN includes the domain suffix, so it doesn't equal the HANA user name.
      fr: L'UPN complet comprend le suffixe de domaine ; il ne correspond donc pas au nom d'utilisateur HANA.
    c:
      en: The object ID is a GUID that doesn't match any HANA user name.
      fr: L'ID d'objet est un GUID qui ne correspond à aucun nom d'utilisateur HANA.
    a:
      en: The display name is a person's name, not the email prefix used as the HANA user name.
      fr: Le nom d'affichage est le nom d'une personne, pas le préfixe de l'adresse e-mail utilisé comme nom d'utilisateur HANA.
references:
  - title: Integrate Microsoft Entra ID with SAP HANA
    url: https://learn.microsoft.com/en-us/training/modules/explore-identity-services/7-exercise-integrate-azure-active-directory-sap-hana
