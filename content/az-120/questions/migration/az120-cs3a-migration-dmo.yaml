id: az120-cs3a-migration-dmo
objective: "1.1.9"
type: single
caseStudy: az120-cs3a-coho-winery
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a migration approach for CWP that meets the migration requirement. What should you recommend?
  fr: |
    Vous devez recommander une approche de migration pour CWP qui respecte l'exigence de migration. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Copy CWP to Azure with a homogeneous Db2 backup and restore, and then convert it with SUM and DMO in Azure", fr: "Copier CWP vers Azure par une sauvegarde et une restauration Db2 homogènes, puis le convertir avec SUM et DMO dans Azure" } }
    - { id: b, text: { en: "Convert CWP with SUM and DMO with System Move, exporting on-premises and importing into SAP HANA on Azure", fr: "Convertir CWP avec SUM et DMO with System Move, en exportant en local et en important dans SAP HANA sur Azure" } }
    - { id: c, text: { en: "Replicate the CWP servers with Azure Site Recovery, fail them over, and then convert CWP with SUM and DMO in Azure", fr: "Répliquer les serveurs de CWP avec Azure Site Recovery, les basculer, puis convertir CWP avec SUM et DMO dans Azure" } }
    - { id: d, text: { en: "Migrate CWP with an SWPM heterogeneous system copy, exporting on-premises and importing into SAP HANA on Azure", fr: "Migrer CWP par une copie système hétérogène SWPM, en exportant en local et en important dans SAP HANA sur Azure" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Software Update Manager (SUM) with the Database Migration Option (DMO) upgrades or converts the SAP system and migrates the database to SAP HANA in a single run, often called a one-step migration. With System Move, SUM runs on the on-premises source, the export files are transferred to Azure over ExpressRoute, and the import runs on the target in Azure, so there is only one downtime window.
    fr: |
      Software Update Manager (SUM) avec Database Migration Option (DMO) met à niveau ou convertit le système SAP et migre la base de données vers SAP HANA en une seule exécution, ce qu'on appelle souvent une migration en une étape. Avec System Move, SUM s'exécute sur la source locale, les fichiers d'export sont transférés vers Azure par ExpressRoute et l'import s'exécute sur la cible dans Azure : il n'y a qu'une fenêtre d'interruption.
  options:
    a:
      en: |
        A lift and shift followed by DMO is a two-step migration with two downtime windows and two test cycles.
      fr: |
        Un lift-and-shift suivi de DMO est une migration en deux étapes, avec deux fenêtres d'interruption et deux cycles de test.
    c:
      en: |
        This is also a two-step migration, and Azure Site Recovery doesn't guarantee database consistency, so it isn't advised for the Db2 database.
      fr: |
        Il s'agit aussi d'une migration en deux étapes, et Azure Site Recovery ne garantit pas la cohérence de la base de données : il n'est pas conseillé pour la base Db2.
    d:
      en: |
        An SWPM system copy moves the database to SAP HANA but keeps SAP ECC; the conversion to SAP S/4HANA would still require a separate SUM run and a second downtime.
      fr: |
        Une copie système SWPM déplace la base de données vers SAP HANA mais conserve SAP ECC ; la conversion en SAP S/4HANA demanderait encore une exécution SUM distincte et une seconde interruption.
references:
