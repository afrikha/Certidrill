id: az120-1a-req-caching-dd
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are deploying a production SAP HANA database on a Standard_M128s virtual machine. All the volumes use Premium SSD managed disks, with separate disks for /hana/data, /hana/log and /hana/shared.

    You need to set the host caching of the /hana/log and /hana/shared disks by following Microsoft's recommendations for SAP HANA.

    How should you configure the disks? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous déployez une base de données SAP HANA de production sur une machine virtuelle Standard_M128s. Tous les volumes utilisent des disques managés SSD Premium, avec des disques distincts pour /hana/data, /hana/log et /hana/shared.

    Vous devez définir la mise en cache de l'hôte des disques /hana/log et /hana/shared en suivant les recommandations de Microsoft pour SAP HANA.

    Comment devez-vous configurer les disques ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      /hana/log disks: [[log]]

      /hana/shared disk: [[shared]]
    fr: |
      Disques /hana/log : [[log]]

      Disque /hana/shared : [[shared]]
  slots:
    - id: log
      options:
        - { id: none, text: None }
        - { id: ro, text: ReadOnly }
        - { id: nonewa, text: None + Write Accelerator }
        - { id: rw, text: ReadWrite }
    - id: shared
      options:
        - { id: none, text: None }
        - { id: ro, text: ReadOnly }
        - { id: rw, text: ReadWrite }
answer:
  values: { log: nonewa, shared: ro }
explanation:
  correct:
    en: |
      HANA writes the redo log intensively and its latency is critical: on M-series VMs the log disks use no host caching with Write Accelerator enabled. /hana/shared benefits from read caching. The /hana/data disks use None or read caching, and the OS disk keeps the default caching set by Azure.
    fr: |
      HANA écrit intensivement dans le journal de rétablissement, dont la latence est critique : sur les machines virtuelles de série M, les disques du journal n'utilisent pas de cache d'hôte et ont Write Accelerator activé. /hana/shared tire parti de la mise en cache en lecture. Les disques /hana/data utilisent None ou la mise en cache en lecture, et le disque du système d'exploitation conserve la mise en cache par défaut définie par Azure.
  options:
    none:
      en: |
        For the log, None without Write Accelerator doesn't meet the HANA log latency KPI on Premium SSD; for /hana/shared, read caching is recommended.
      fr: |
        Pour le journal, None sans Write Accelerator ne respecte pas le KPI de latence du journal HANA sur SSD Premium ; pour /hana/shared, la mise en cache en lecture est recommandée.
    rw:
      en: |
        ReadWrite caching isn't recommended for HANA volumes and isn't supported with Write Accelerator.
      fr: |
        La mise en cache ReadWrite n'est pas recommandée pour les volumes HANA et n'est pas prise en charge avec Write Accelerator.
references:
  - title: SAP HANA Azure virtual machine Premium SSD storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-premium-ssd-v1
