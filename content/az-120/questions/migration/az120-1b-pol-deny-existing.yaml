id: az120-1b-pol-deny-existing
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. has SAP test virtual machines in the Sweden Central region in a subscription under the management group **MG-SAP**.

    You assign the built-in Allowed locations policy to MG-SAP with the deny effect. The allowed locations are West Europe and North Europe.

    What happens to the existing virtual machines in Sweden Central?
  fr: |
    Fabrikam, Inc. dispose de machines virtuelles SAP de test dans la région Sweden Central, dans un abonnement situé sous le groupe d'administration **MG-SAP**.

    Vous attribuez la stratégie intégrée Allowed locations à MG-SAP avec l'effet deny. Les emplacements autorisés sont West Europe et North Europe.

    Qu'advient-il des machines virtuelles existantes de Sweden Central ?
body:
  options:
    - { id: a, text: { en: "Azure Policy deallocates them until they are moved to an allowed region.", fr: "Azure Policy les libère jusqu'à leur déplacement vers une région autorisée." } }
    - { id: b, text: { en: "They keep running, and Azure Policy reports them as noncompliant.", fr: "Elles continuent de s'exécuter, et Azure Policy les signale comme non conformes." } }
    - { id: c, text: { en: "Azure Policy deletes them during the next compliance evaluation.", fr: "Azure Policy les supprime lors de la prochaine évaluation de conformité." } }
    - { id: d, text: { en: "They are exempted automatically and reported as compliant.", fr: "Elles sont exemptées automatiquement et signalées comme conformes." } }
answer: { optionId: b }
explanation:
  correct:
    en: The deny effect blocks create and update requests that don't comply. Resources that already exist are not changed or removed; the compliance evaluation marks them as noncompliant so that you can decide how to handle them.
    fr: L'effet deny bloque les demandes de création et de mise à jour non conformes. Les ressources existantes ne sont ni modifiées ni supprimées ; l'évaluation de conformité les marque comme non conformes pour que vous décidiez de leur traitement.
  options:
    a: { en: "Azure Policy never stops or deallocates resources.", fr: "Azure Policy n'arrête et ne libère jamais de ressources." }
    c: { en: "No policy effect deletes existing resources.", fr: "Aucun effet de stratégie ne supprime de ressources existantes." }
    d: { en: "Exemptions are created explicitly; existing resources are evaluated like any other.", fr: "Les exemptions sont créées explicitement ; les ressources existantes sont évaluées comme les autres." }
references:
  - title: Azure Policy definitions effect basics
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-basics
