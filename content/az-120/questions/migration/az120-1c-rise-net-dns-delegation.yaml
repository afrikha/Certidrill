id: az120-1c-rise-net-dns-delegation
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. uses the DNS domain contoso.com. The domain is hosted on Active Directory-integrated DNS servers that run on virtual machines in the Contoso hub virtual network. These DNS servers resolve names for on-premises clients and for the Azure spoke virtual networks.

    Contoso is moving its SAP systems to RISE with SAP. SAP will deploy DNS servers in the RISE virtual network. On-premises clients, Contoso Azure services and the SAP-managed environment must all resolve the host names of the RISE systems.

    You need to recommend a DNS design for the RISE host names.

    What should you include in the design?
  fr: |
    Contoso, Ltd. utilise le domaine DNS contoso.com. Le domaine est hébergé sur des serveurs DNS intégrés à Active Directory qui s'exécutent sur des machines virtuelles du réseau virtuel hub de Contoso. Ces serveurs DNS résolvent les noms pour les clients locaux et pour les réseaux virtuels spoke Azure.

    Contoso migre ses systèmes SAP vers RISE with SAP. SAP va déployer des serveurs DNS dans le réseau virtuel RISE. Les clients locaux, les services Azure de Contoso et l'environnement géré par SAP doivent tous résoudre les noms d'hôte des systèmes RISE.

    Vous devez recommander une conception DNS pour les noms d'hôte RISE.

    Que devez-vous inclure dans la conception ?
body:
  options:
    - id: a
      text: { en: "Create the RISE host records in contoso.com on the Contoso DNS servers and give SAP write access to the zone.", fr: "Créer les enregistrements d'hôte RISE dans contoso.com sur les serveurs DNS de Contoso et donner à SAP un accès en écriture à la zone." }
    - id: b
      text: { en: "Delegate a subdomain such as ecs.contoso.com to the SAP DNS servers, which hold the master role for that zone.", fr: "Déléguer un sous-domaine comme ecs.contoso.com aux serveurs DNS de SAP, qui détiennent le rôle maître pour cette zone." }
    - id: c
      text: { en: "Delegate a subdomain such as ecs.contoso.com to a public DNS provider that both Contoso and SAP manage.", fr: "Déléguer un sous-domaine comme ecs.contoso.com à un fournisseur DNS public que Contoso et SAP gèrent ensemble." }
    - id: d
      text: { en: "Configure the RISE virtual network to use Azure-provided DNS and link it to a private DNS zone of Contoso.", fr: "Configurer le réseau virtuel RISE pour utiliser le DNS fourni par Azure et le lier à une zone DNS privée de Contoso." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In the RISE DNS integration, the customer delegates a subdomain (for example ecs.contoso.com) to SAP, and the SAP DNS servers in the RISE VNet hold the master role for that zone. The entries are then replicated to the customer's DNS servers, which keep answering all clients.
    fr: |
      Dans l'intégration DNS de RISE, le client délègue un sous-domaine (par exemple ecs.contoso.com) à SAP, et les serveurs DNS de SAP du réseau virtuel RISE détiennent le rôle maître pour cette zone. Les entrées sont ensuite répliquées vers les serveurs DNS du client, qui continuent de répondre à tous les clients.
  options:
    a:
      en: |
        SAP manages the RISE names on its own DNS servers in the delegated zone; it does not write to the customer's parent zone.
      fr: |
        SAP gère les noms RISE sur ses propres serveurs DNS dans la zone déléguée ; il n'écrit pas dans la zone parente du client.
    c:
      en: |
        SAP typically does not support external DNS providers for the delegated zone, and private RISE addresses do not belong in public DNS.
      fr: |
        SAP ne prend généralement pas en charge de fournisseur DNS externe pour la zone déléguée, et les adresses privées RISE n'ont pas leur place dans un DNS public.
    d:
      en: |
        The RISE VNet is managed by SAP in SAP's tenant; the customer does not configure its DNS settings or link its private zones to it.
      fr: |
        Le réseau virtuel RISE est géré par SAP dans le locataire de SAP ; le client ne configure pas ses paramètres DNS et n'y lie pas ses zones privées.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
