id: az120-1b-authn-sapgui-sso
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. migrated SAP ERP to Azure virtual machines. Fabrikam users work on Windows computers joined to an Active Directory Domain Services (AD DS) domain and use SAP GUI for Windows.

    Users must sign in to SAP GUI with their Windows session, without a password prompt.

    What should you implement?
  fr: |
    Fabrikam, Inc. a migré SAP ERP vers des machines virtuelles Azure. Les utilisateurs de Fabrikam travaillent sur des ordinateurs Windows joints à un domaine Active Directory Domain Services (AD DS) et utilisent SAP GUI pour Windows.

    Les utilisateurs doivent se connecter à SAP GUI avec leur session Windows, sans invite de mot de passe.

    Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "SAML 2.0 single sign-on between Microsoft Entra ID and the SAP system", fr: "Une authentification unique SAML 2.0 entre Microsoft Entra ID et le système SAP" } }
    - { id: b, text: { en: "Secure Network Communications (SNC) with Kerberos against AD DS", fr: "Secure Network Communications (SNC) avec Kerberos sur AD DS" } }
    - { id: c, text: { en: "OAuth 2.0 with the SAML bearer grant registered in transaction SOAUTH2", fr: "OAuth 2.0 avec l'octroi SAML bearer enregistré dans la transaction SOAUTH2" } }
    - { id: d, text: { en: "Microsoft Entra login for the Windows virtual machines of the SAP system", fr: "La connexion Microsoft Entra pour les machines virtuelles Windows du système SAP" } }
answer: { optionId: b }
explanation:
  correct:
    en: SAP GUI doesn't use browser-based SAML. Single sign-on for SAP GUI is done with SNC, and SNC with Kerberos (SPNEGO) against Active Directory reuses the Windows logon ticket, which is the preferred option for ease of configuration and maintenance.
    fr: SAP GUI n'utilise pas SAML, qui repose sur le navigateur. L'authentification unique pour SAP GUI passe par SNC, et SNC avec Kerberos (SPNEGO) sur Active Directory réutilise le ticket d'ouverture de session Windows ; c'est l'option préférée pour sa facilité de configuration et de maintenance.
  options:
    a:
      en: SAML 2.0 provides SSO to SAP web applications such as Fiori and Web GUI, not to SAP GUI for Windows.
      fr: SAML 2.0 fournit l'authentification unique aux applications web SAP comme Fiori et Web GUI, pas à SAP GUI pour Windows.
    c:
      en: OAuth lets applications call SAP NetWeaver OData services; it isn't a sign-in method for SAP GUI.
      fr: OAuth permet à des applications d'appeler des services OData SAP NetWeaver ; ce n'est pas une méthode de connexion à SAP GUI.
    d:
      en: Microsoft Entra login controls sign-in to the operating system of the VMs, not to the SAP application.
      fr: La connexion Microsoft Entra contrôle l'ouverture de session sur le système d'exploitation des machines virtuelles, pas sur l'application SAP.
references:
  - title: Integrate Active Directory with SAP single sign-on (Kerberos-SPNEGO)
    url: https://learn.microsoft.com/en-us/training/modules/explore-identity-services/9-exercise-integrate-active-directory-sap-single-sign-on
