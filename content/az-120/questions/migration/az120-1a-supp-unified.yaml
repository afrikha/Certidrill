id: az120-1a-supp-unified
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs SAP S/4HANA with Windows Server application servers and a separate SAP Business Suite system on SQL Server. Contoso also uses Microsoft 365 and Dynamics 365. Contoso requires a single Microsoft support contract that covers Azure, Windows Server, SQL Server and its other Microsoft products, with escalation management and a 15-minute initial response for critical Azure incidents.

    You need to recommend a support offering.

    What should you recommend?
  fr: |
    Contoso exécute SAP S/4HANA avec des serveurs d'applications Windows Server et un système SAP Business Suite distinct sur SQL Server. Contoso utilise aussi Microsoft 365 et Dynamics 365. Contoso exige un contrat de support Microsoft unique qui couvre Azure, Windows Server, SQL Server et ses autres produits Microsoft, avec une gestion des escalades et une réponse initiale en 15 minutes pour les incidents Azure critiques.

    Vous devez recommander une offre de support.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: Professional Direct }
    - { id: b, text: Unified Enterprise }
    - { id: c, text: Standard }
    - { id: d, text: Developer }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Unified Enterprise covers Azure, Microsoft 365, Dynamics 365 and other Microsoft technologies, includes escalation management and responds within 15 minutes to critical (Severity 1) Azure incidents. For SAP on Windows Server and SQL Server, Microsoft recommends this enterprise-level support (formerly Premier).
    fr: |
      Unified Enterprise couvre Azure, Microsoft 365, Dynamics 365 et d'autres technologies Microsoft, inclut la gestion des escalades et répond en 15 minutes aux incidents Azure critiques (gravité 1). Pour SAP sous Windows Server et SQL Server, Microsoft recommande ce support de niveau entreprise (anciennement Premier).
  options:
    a:
      en: |
        Professional Direct covers Azure only, with a one-hour response for Severity A incidents.
      fr: |
        Professional Direct ne couvre qu'Azure, avec une réponse en une heure pour les incidents de gravité A.
    c:
      en: |
        Standard covers Azure only and responds to Severity A incidents within one hour.
      fr: |
        Standard ne couvre qu'Azure et répond aux incidents de gravité A en une heure.
    d:
      en: |
        Developer covers Azure only, during business hours, for Severity C incidents.
      fr: |
        Developer ne couvre qu'Azure, aux heures ouvrées, pour des incidents de gravité C.
references:
  - title: Explore licensing, pricing, and support of Azure for SAP workloads
    url: https://learn.microsoft.com/en-us/training/modules/explore-licensing-pricing-support/3-explore-licensing-pricing-support-azure-for-sap-workloads
