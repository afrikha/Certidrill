id: az120-1b-lsm-same-platform
objective: "1.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. runs SAP ERP 6.0 EHP8 on Windows Server with Microsoft SQL Server in an on-premises datacenter. The operating system release and the SQL Server release are both supported for SAP on Azure virtual machines.

    Fabrikam must move the system to Azure before its datacenter contract ends. The project must not change the operating system family, the DBMS or the SAP release, and it must minimize migration risk.

    Which migration approach should you recommend?
  fr: |
    Fabrikam, Inc. exécute SAP ERP 6.0 EHP8 sur Windows Server avec Microsoft SQL Server dans un centre de données local. La version du système d'exploitation et celle de SQL Server sont toutes deux prises en charge pour SAP sur des machines virtuelles Azure.

    Fabrikam doit déplacer le système vers Azure avant la fin de son contrat de centre de données. Le projet ne doit changer ni la famille de système d'exploitation, ni le SGBD, ni la version SAP, et il doit réduire au minimum le risque de migration.

    Quelle approche de migration devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Lift and shift", fr: "Lift-and-shift" } }
    - { id: b, text: { en: "Lift-shift-migrate", fr: "Lift-shift-migrate" } }
    - { id: c, text: { en: "Lift-shift-migrate to HANA", fr: "Lift-shift-migrate vers HANA" } }
    - { id: d, text: { en: "New implementation (greenfield) of SAP S/4HANA on Azure", fr: "Nouvelle implémentation (greenfield) de SAP S/4HANA sur Azure" } }
answer: { optionId: a }
explanation:
  correct:
    en: When the operating system and the DBMS are already supported on Azure and nothing else must change, a lift and shift moves the system as it is. The Azure copy is built with a homogeneous system copy, such as a database backup and restore or DBMS replication, which keeps the risk lowest.
    fr: Lorsque le système d'exploitation et le SGBD sont déjà pris en charge sur Azure et que rien d'autre ne doit changer, un lift-and-shift déplace le système tel quel. La copie Azure est construite par copie système homogène, par exemple une sauvegarde et restauration de la base de données ou une réplication du SGBD, ce qui limite le risque au minimum.
  options:
    b:
      en: Lift-shift-migrate changes the operating system or the DBMS during the move (heterogeneous system copy), which the project forbids.
      fr: Le lift-shift-migrate change le système d'exploitation ou le SGBD pendant le déplacement (copie système hétérogène), ce que le projet interdit.
    c:
      en: Lift-shift-migrate to HANA replaces SQL Server with SAP HANA and usually includes an SAP upgrade, which the project forbids.
      fr: Le lift-shift-migrate vers HANA remplace SQL Server par SAP HANA et comprend généralement une mise à niveau SAP, ce que le projet interdit.
    d:
      en: A greenfield S/4HANA implementation changes the SAP product and the business processes; it is the opposite of a low-risk move of the existing system.
      fr: Une implémentation greenfield de S/4HANA change le produit SAP et les processus métier ; c'est l'inverse d'un déplacement à faible risque du système existant.
references:
