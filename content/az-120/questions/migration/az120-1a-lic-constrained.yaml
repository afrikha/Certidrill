id: az120-1a-lic-constrained
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware will move the SQL Server database of its SAP ERP system to Azure. Load tests show that the database needs the memory, the number of data disks and the storage IOPS of a Standard_M64ms virtual machine, but that 32 vCPUs are enough. SQL Server is licensed per core, and Litware wants to minimize the number of SQL Server core licenses.

    You need to recommend a VM size.

    What should you recommend?
  fr: |
    Litware va déplacer vers Azure la base de données SQL Server de son système SAP ERP. Les tests de charge montrent que la base de données a besoin de la mémoire, du nombre de disques de données et des IOPS de stockage d'une machine virtuelle Standard_M64ms, mais que 32 processeurs virtuels suffisent. SQL Server est concédé sous licence par cœur, et Litware veut réduire au minimum le nombre de licences de cœurs SQL Server.

    Vous devez recommander une taille de machine virtuelle.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: Standard_M64ms }
    - { id: b, text: Standard_M32ms }
    - { id: c, text: Standard_M64-32ms }
    - { id: d, text: Standard_E32-16s_v5 }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Constrained vCPU sizes keep the memory, disk count and I/O bandwidth of the base size but expose only a half or a quarter of its vCPUs. Standard_M64-32ms keeps the characteristics of Standard_M64ms with 32 active vCPUs, and SQL Server licensing is based on the available vCPUs. The VM price stays the same as the base size; the savings come from licensing.
    fr: |
      Les tailles à processeurs virtuels limités conservent la mémoire, le nombre de disques et la bande passante d'E/S de la taille de base, mais n'exposent que la moitié ou le quart de ses processeurs virtuels. Standard_M64-32ms conserve les caractéristiques de Standard_M64ms avec 32 processeurs virtuels actifs, et les licences SQL Server reposent sur les processeurs virtuels disponibles. Le prix de la machine virtuelle reste celui de la taille de base ; l'économie porte sur les licences.
  options:
    a:
      en: |
        Standard_M64ms exposes 64 vCPUs, so it requires twice as many SQL Server core licenses.
      fr: |
        Standard_M64ms expose 64 processeurs virtuels : elle exige deux fois plus de licences de cœurs SQL Server.
    b:
      en: |
        Standard_M32ms has 32 vCPUs but only about half the memory and fewer data disks than Standard_M64ms.
      fr: |
        Standard_M32ms a 32 processeurs virtuels, mais environ la moitié de la mémoire et moins de disques de données que Standard_M64ms.
    d:
      en: |
        Standard_E32-16s_v5 keeps the characteristics of Standard_E32s_v5, which has far less memory than Standard_M64ms.
      fr: |
        Standard_E32-16s_v5 conserve les caractéristiques de Standard_E32s_v5, qui a beaucoup moins de mémoire que Standard_M64ms.
references:
  - title: Constrained vCPU sizes for database workloads
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/constrained-vcpu
