id: az120-1c-rise-data-abap-sdk
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. runs SAP S/4HANA in RISE with SAP on Azure. Developers want custom ABAP programs to send data management events and archive notifications directly from the SAP system to Azure services by using the ABAP SDK for Azure.

    Which component must be set up in the SAP system before the ABAP SDK for Azure can be installed?
  fr: |
    Proseware, Inc. exécute SAP S/4HANA dans RISE with SAP sur Azure. Les développeurs souhaitent que des programmes ABAP personnalisés envoient des événements de gestion des données et des notifications d'archivage directement du système SAP vers des services Azure en utilisant l'ABAP SDK for Azure.

    Quel composant doit être configuré dans le système SAP avant de pouvoir installer l'ABAP SDK for Azure ?
body:
  options:
    - { id: a, text: "SAP Cloud Connector" }
    - { id: b, text: "abapGit" }
    - { id: c, text: { en: "The self-hosted integration runtime", fr: "Le runtime d'intégration auto-hébergé" } }
    - { id: d, text: { en: "The on-premises data gateway", fr: "La passerelle de données locale" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      ABAP-based integration with Azure uses the ABAP SDK for Azure and the Microsoft AI SDK for SAP, which are distributed as open-source repositories. Their installation requires abapGit to be set up first in the SAP system.
    fr: |
      L'intégration ABAP avec Azure utilise l'ABAP SDK for Azure et le Microsoft AI SDK for SAP, distribués sous forme de dépôts open source. Leur installation exige de configurer d'abord abapGit dans le système SAP.
  options:
    a:
      en: |
        SAP Cloud Connector links on-premises or private systems to SAP BTP; it is not used to install ABAP packages.
      fr: |
        SAP Cloud Connector relie des systèmes locaux ou privés à SAP BTP ; il ne sert pas à installer des packages ABAP.
    c:
      en: |
        The self-hosted IR is the runtime of Data Factory, Synapse, Fabric and Purview connectors outside the SAP system.
      fr: |
        Le runtime d'intégration auto-hébergé est le runtime des connecteurs de Data Factory, Synapse, Fabric et Purview, en dehors du système SAP.
    d:
      en: |
        The on-premises data gateway serves Logic Apps, Power Apps and Power BI connectors; it is not an ABAP prerequisite.
      fr: |
        La passerelle de données locale sert les connecteurs de Logic Apps, Power Apps et Power BI ; ce n'est pas un prérequis ABAP.
references:
  - title: Integrating Azure services with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-services
