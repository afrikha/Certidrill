id: az120-1c-rise-impl-gateway-transit
objective: "1.3.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a hub virtual network named **vnet-hub** that contains an ExpressRoute gateway. The RISE with SAP virtual network of Northwind is named **vnet-rise**. Two peerings exist: **hub-to-rise** (managed by Northwind on vnet-hub) and **rise-to-hub** (managed by SAP on vnet-rise). Currently, every property in the following table is set to false.

    On-premises users must reach the RISE systems through the ExpressRoute gateway of vnet-hub.

    Answer each prompt by selecting the property that must be set to true.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un réseau virtuel hub nommé **vnet-hub** qui contient une passerelle ExpressRoute. Le réseau virtuel RISE with SAP de Northwind s'appelle **vnet-rise**. Deux peerings existent : **hub-to-rise** (géré par Northwind sur vnet-hub) et **rise-to-hub** (géré par SAP sur vnet-rise). Actuellement, toutes les propriétés du tableau suivant ont la valeur false.

    Les utilisateurs locaux doivent atteindre les systèmes RISE par la passerelle ExpressRoute de vnet-hub.

    Répondez à chaque consigne en sélectionnant la propriété qui doit avoir la valeur true.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Property to set on the peering that Northwind manages", fr: "Propriété à définir sur le peering géré par Northwind" }
    - id: p2
      text: { en: "Property that SAP must set on its peering", fr: "Propriété que SAP doit définir sur son peering" }
  grid:
    header: [ { en: "Peering", fr: "Peering" }, { en: "Property", fr: "Propriété" }, { en: "Value", fr: "Valeur" } ]
    rows:
      - [ { text: hub-to-rise }, { text: allowForwardedTraffic, area: h-fwd }, { text: "false" } ]
      - [ { text: hub-to-rise }, { text: allowGatewayTransit, area: h-gwt }, { text: "false" } ]
      - [ { text: hub-to-rise }, { text: useRemoteGateways, area: h-urg }, { text: "false" } ]
      - [ { text: rise-to-hub }, { text: allowForwardedTraffic, area: r-fwd }, { text: "false" } ]
      - [ { text: rise-to-hub }, { text: allowGatewayTransit, area: r-gwt }, { text: "false" } ]
      - [ { text: rise-to-hub }, { text: useRemoteGateways, area: r-urg }, { text: "false" } ]
answer:
  values: { p1: h-gwt, p2: r-urg }
explanation:
  correct:
    en: |
      Remote gateway transit needs both sides: the peering on the VNet that owns the gateway (vnet-hub) sets allowGatewayTransit, and the peering on the VNet that uses it (vnet-rise) sets useRemoteGateways. useRemoteGateways can only be set when the VNet has no gateway of its own, which is why no gateway can then be added in the RISE VNet. allowForwardedTraffic concerns traffic forwarded by an NVA, not gateway transit.
    fr: |
      Le transit par passerelle distante exige les deux côtés : le peering du réseau virtuel qui possède la passerelle (vnet-hub) définit allowGatewayTransit, et le peering du réseau virtuel qui l'utilise (vnet-rise) définit useRemoteGateways. useRemoteGateways ne peut être défini que si le réseau virtuel n'a pas sa propre passerelle, c'est pourquoi aucune passerelle ne peut ensuite être ajoutée au réseau virtuel RISE. allowForwardedTraffic concerne le trafic transféré par une NVA, pas le transit par passerelle.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
  - title: az network vnet peering
    url: https://learn.microsoft.com/en-us/cli/azure/network/vnet/peering
