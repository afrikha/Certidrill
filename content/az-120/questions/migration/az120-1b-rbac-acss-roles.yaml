id: az120-1b-rbac-acss-roles
objective: "1.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. uses Azure Center for SAP solutions to deploy and operate its SAP systems.

    You need to assign built-in roles for the activities in the answer area. The solution must follow the principle of least privilege.

    Which role should you assign for each activity? To answer, drag the appropriate roles to the correct activities. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. utilise le Centre Azure pour les solutions SAP pour déployer et exploiter ses systèmes SAP.

    Vous devez attribuer des rôles intégrés pour les activités de la zone de réponse. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer pour chaque activité ? Pour répondre, faites glisser les rôles appropriés vers les activités correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: admin, text: Azure Center for SAP solutions administrator }
    - { id: service, text: Azure Center for SAP solutions service role }
    - { id: reader, text: Azure Center for SAP solutions reader }
    - { id: cost, text: Cost Management Reader }
    - { id: contrib, text: Contributor }
    - { id: mio, text: Managed Identity Operator }
  targets:
    - id: t1
      text: { en: "An SAP engineer installs SAP software on a VIS and can delete VIS resources", fr: "Un ingénieur SAP installe le logiciel SAP sur une VIS et peut supprimer des ressources VIS" }
    - id: t2
      text: { en: "The user-assigned managed identity that the service uses to deploy and manage the SAP systems", fr: "L'identité managée affectée par l'utilisateur que le service utilise pour déployer et gérer les systèmes SAP" }
    - id: t3
      text: { en: "A finance analyst views the cost analysis of the SAP systems", fr: "Un analyste financier consulte l'analyse des coûts des systèmes SAP" }
    - id: t4
      text: { en: "An operations engineer sets up Azure Monitor for SAP solutions", fr: "Un ingénieur d'exploitation configure Azure Monitor pour les solutions SAP" }
answer:
  mapping: { t1: admin, t2: service, t3: cost, t4: contrib }
explanation:
  correct:
    en: The administrator role covers deploying, installing, managing and deleting VIS resources. The service role is designed for the user-assigned managed identity used by the service. Viewing cost analysis requires Cost Management Reader, and setting up Azure Monitor for SAP solutions requires Contributor. The reader role only views VIS resources, and Managed Identity Operator is needed only to assign an existing user-assigned identity to a VIS.
    fr: Le rôle administrator couvre le déploiement, l'installation, la gestion et la suppression des ressources VIS. Le rôle service role est conçu pour l'identité managée affectée par l'utilisateur qu'utilise le service. L'analyse des coûts exige Cost Management Reader, et la configuration d'Azure Monitor pour les solutions SAP exige Contributor. Le rôle reader permet seulement de consulter les ressources VIS, et Managed Identity Operator n'est nécessaire que pour affecter une identité affectée par l'utilisateur existante à une VIS.
references:
  - title: Azure RBAC for Azure Center for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/manage-with-azure-rbac
