id: az120-sr2-rise-network-2
objective: "1.3.1"
type: series_yesno
series: az120-sr2-rise-network
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You connect Hub1 and the SAP RISE virtual network by using a VNet-to-VNet VPN connection.
  fr: |
    Vous connectez Hub1 et le réseau virtuel SAP RISE à l'aide d'une connexion VPN de réseau virtuel à réseau virtuel.
body:
  solution:
    en: |
      You deploy a VPN gateway in **Hub1**, SAP deploys a VPN gateway in the SAP RISE virtual network, and you create a **VNet-to-VNet VPN connection** between the two gateways. The integration VMs and the on-premises users reach SAP RISE through this connection.
    fr: |
      Vous déployez une passerelle VPN dans **Hub1**, SAP déploie une passerelle VPN dans le réseau virtuel SAP RISE, et vous créez une **connexion VPN de réseau virtuel à réseau virtuel** entre les deux passerelles. Les machines virtuelles d'intégration et les utilisateurs locaux atteignent SAP RISE via cette connexion.
answer: { value: false }
explanation:
  correct:
    en: |
      A VNet-to-VNet VPN is a supported alternative to peering for SAP RISE, but its throughput is limited by the gateway SKU on both sides and the traffic goes through encrypted tunnels between gateways. Virtual network peering gives lower latency and higher throughput, so this solution does not meet the performance requirement.
    fr: |
      Un VPN de réseau virtuel à réseau virtuel est une alternative prise en charge au peering pour SAP RISE, mais son débit est limité par la référence SKU de la passerelle des deux côtés et le trafic transite par des tunnels chiffrés entre passerelles. Le peering de réseaux virtuels offre une latence plus faible et un débit plus élevé : cette solution ne répond pas à l'exigence de performances.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
