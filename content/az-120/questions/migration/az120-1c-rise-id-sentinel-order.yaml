id: az120-1c-rise-id-sentinel-order
objective: "1.3.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. runs SAP S/4HANA Cloud, private edition in RISE with SAP on Azure. The security team has reviewed the prerequisites of the SAP agentless data connector and has a Log Analytics workspace enabled for Microsoft Sentinel.

    You need to deploy the Microsoft Sentinel solution for SAP applications by following the documented deployment sequence.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware, Inc. exécute SAP S/4HANA Cloud, private edition dans RISE with SAP sur Azure. L'équipe de sécurité a examiné les prérequis du connecteur de données SAP sans agent et dispose d'un espace de travail Log Analytics activé pour Microsoft Sentinel.

    Vous devez déployer la solution Microsoft Sentinel pour les applications SAP en suivant la séquence de déploiement documentée.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: hub, text: { en: "Deploy the SAP applications solution from the Microsoft Sentinel content hub.", fr: "Déployer la solution pour les applications SAP depuis le hub de contenu Microsoft Sentinel." } }
    - { id: sapcfg, text: { en: "Configure the SAP authorizations and SAP auditing in the SAP system.", fr: "Configurer les autorisations SAP et l'audit SAP dans le système SAP." } }
    - { id: connect, text: { en: "Connect the SAP system by using the agentless data connector and SAP Cloud Connector.", fr: "Connecter le système SAP en utilisant le connecteur de données sans agent et SAP Cloud Connector." } }
    - { id: detect, text: { en: "Enable the SAP detections and threat protection.", fr: "Activer les détections SAP et la protection contre les menaces." } }
    - { id: ama, text: { en: "Install the Azure Monitor Agent on the RISE application servers.", fr: "Installer l'agent Azure Monitor sur les serveurs d'application RISE." } }
    - { id: container, text: { en: "Deploy the containerized data connector agent on a Linux VM.", fr: "Déployer l'agent de connecteur de données conteneurisé sur une machine virtuelle Linux." } }
answer:
  sequence: [ hub, sapcfg, connect, detect ]
explanation:
  correct:
    en: |
      After the prerequisites, the security team deploys the solution from the content hub, the SAP Basis team configures the SAP system (authorizations and auditing), the security team connects the system with the agentless data connector by using SAP Cloud Connector, and finally enables the SAP detections and threat protection.
    fr: |
      Après les prérequis, l'équipe de sécurité déploie la solution depuis le hub de contenu, l'équipe SAP Basis configure le système SAP (autorisations et audit), l'équipe de sécurité connecte le système avec le connecteur de données sans agent en utilisant SAP Cloud Connector, puis active les détections SAP et la protection contre les menaces.
  options:
    ama:
      en: |
        Customers have no access to the RISE VMs, and the solution collects application logs through the data connector, not an agent on the servers.
      fr: |
        Les clients n'ont pas accès aux machines virtuelles RISE, et la solution collecte les journaux d'application par le connecteur de données, pas par un agent sur les serveurs.
    container:
      en: |
        The containerized data connector agent retired on September 14, 2026.
      fr: |
        L'agent de connecteur de données conteneurisé a été mis hors service le 14 septembre 2026.
references:
  - title: Deploy the Microsoft Sentinel solution for SAP applications
    url: https://learn.microsoft.com/en-us/azure/sentinel/sap/deployment-overview
