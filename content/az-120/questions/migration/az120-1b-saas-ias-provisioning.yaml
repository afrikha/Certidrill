id: az120-1b-saas-ias-provisioning
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders wants Microsoft Entra ID to create, update and deactivate users and groups automatically in its SAP Cloud Identity Services tenant. You add the SAP Cloud Identity Services application from the Microsoft Entra gallery and open its Provisioning tab.

    What should you create in SAP Cloud Identity Services to provide the credentials that the provisioning connection uses?
  fr: |
    Northwind Traders veut que Microsoft Entra ID crée, mette à jour et désactive automatiquement des utilisateurs et des groupes dans son locataire SAP Cloud Identity Services. Vous ajoutez l'application SAP Cloud Identity Services depuis la galerie Microsoft Entra et ouvrez son onglet Provisioning.

    Que devez-vous créer dans SAP Cloud Identity Services pour fournir les informations d'identification qu'utilise la connexion d'approvisionnement ?
body:
  options:
    - { id: a, text: { en: "An administrator system with the Manage Users authorization and a client secret", fr: "Un système administrateur avec l'autorisation Manage Users et une clé secrète client" } }
    - { id: b, text: { en: "An administrator user with the Manage Users authorization and a password", fr: "Un utilisateur administrateur avec l'autorisation Manage Users et un mot de passe" } }
    - { id: c, text: { en: "A corporate identity provider that imports the Microsoft Entra metadata", fr: "Un fournisseur d'identité d'entreprise qui importe les métadonnées Microsoft Entra" } }
    - { id: d, text: { en: "A trust configuration toward the BTP subaccount with shadow users enabled", fr: "Une configuration d'approbation vers le sous-compte BTP avec les utilisateurs fantômes activés" } }
answer: { optionId: a }
explanation:
  correct:
    en: The connector authenticates as an SAP administrator system, not a user. In the IAS admin console, you add a system under Administrators, turn on Manage Users and add a secret; its client ID and client secret go into the Admin Username and Admin Password fields, with the tenant's SCIM URL.
    fr: Le connecteur s'authentifie en tant que système administrateur SAP, pas en tant qu'utilisateur. Dans la console d'administration IAS, vous ajoutez un système sous Administrators, activez Manage Users et ajoutez une clé secrète ; son ID client et sa clé secrète client vont dans les champs Admin Username et Admin Password, avec l'URL SCIM du locataire.
  options:
    b:
      en: The provisioning connection uses an administrator system's client credentials, not the password of a person.
      fr: La connexion d'approvisionnement utilise les informations d'identification client d'un système administrateur, pas le mot de passe d'une personne.
    c:
      en: A corporate identity provider configures SAML authentication through Microsoft Entra ID; it gives no credentials for provisioning.
      fr: Un fournisseur d'identité d'entreprise configure l'authentification SAML via Microsoft Entra ID ; il ne fournit aucune information d'identification pour l'approvisionnement.
    d:
      en: A BTP trust configuration controls sign-in to BTP; shadow users are created at sign-in, not by Microsoft Entra provisioning.
      fr: Une configuration d'approbation BTP contrôle la connexion à BTP ; les utilisateurs fantômes sont créés à la connexion, pas par l'approvisionnement Microsoft Entra.
references:
  - title: Configure SAP Cloud Identity Services for automatic user provisioning with Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/entra/identity/saas-apps/sap-cloud-platform-identity-authentication-provisioning-tutorial
