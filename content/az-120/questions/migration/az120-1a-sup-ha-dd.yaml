id: az120-1a-sup-ha-dd
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum is designing high availability for two production SAP systems on Azure virtual machines:

    - SYS1: SAP NetWeaver on SUSE Linux Enterprise Server. The ASCS/ERS instances will run in a Pacemaker cluster and use an NFS share for sapmnt.
    - SYS2: SAP NetWeaver with a SQL Server database on Windows Server.

    You need to choose, for each system, a configuration that SAP and Microsoft support. For SYS2, follow Microsoft's default recommendation for production.

    How should you complete the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum conçoit la haute disponibilité de deux systèmes SAP de production sur des machines virtuelles Azure :

    - SYS1 : SAP NetWeaver sous SUSE Linux Enterprise Server. Les instances ASCS/ERS s'exécuteront dans un cluster Pacemaker et utiliseront un partage NFS pour sapmnt.
    - SYS2 : SAP NetWeaver avec une base de données SQL Server sous Windows Server.

    Vous devez choisir, pour chaque système, une configuration prise en charge par SAP et Microsoft. Pour SYS2, suivez la recommandation par défaut de Microsoft pour la production.

    Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      SYS1 sapmnt share: [[share]]

      SYS2 database high availability: [[sqlha]]
    fr: |
      Partage sapmnt de SYS1 : [[share]]

      Haute disponibilité de la base de données de SYS2 : [[sqlha]]
  slots:
    - id: share
      options:
        - { id: fileshdd, text: { en: "NFS on Azure Files HDD (standard)", fr: "NFS sur Azure Files HDD (standard)" } }
        - { id: filesssd, text: { en: "NFS on Azure Files SSD (premium)", fr: "NFS sur Azure Files SSD (premium)" } }
        - { id: smbhdd, text: { en: "SMB on Azure Files HDD (standard)", fr: "SMB sur Azure Files HDD (standard)" } }
    - id: sqlha
      options:
        - { id: ag, text: { en: "SQL Server Always On availability groups", fr: "Groupes de disponibilité SQL Server Always On" } }
        - { id: fcianf, text: { en: "Failover cluster instance with database files on an SMB share in Azure NetApp Files", fr: "Instance de cluster de basculement avec les fichiers de base de données sur un partage SMB dans Azure NetApp Files" } }
        - { id: pacemaker, text: { en: "Pacemaker cluster with the Azure fence agent", fr: "Cluster Pacemaker avec l'agent de clôture Azure" } }
answer:
  values: { share: filesssd, sqlha: ag }
explanation:
  correct:
    en: |
      For SAP Central Services on SUSE Pacemaker, NFS on Azure NetApp Files or on Azure Files SSD is supported; Azure Files HDD isn't. For a SQL Server database on Windows, Always On availability groups are Microsoft's default recommendation for production.
    fr: |
      Pour SAP Central Services sur Pacemaker SUSE, NFS sur Azure NetApp Files ou sur Azure Files SSD est pris en charge, mais pas Azure Files HDD. Pour une base de données SQL Server sous Windows, les groupes de disponibilité Always On sont la recommandation par défaut de Microsoft en production.
  options:
    fileshdd:
      en: |
        Azure Files HDD isn't supported for SAP Central Services shares.
      fr: |
        Azure Files HDD n'est pas pris en charge pour les partages de SAP Central Services.
    smbhdd:
      en: |
        A Linux Pacemaker cluster uses NFS for sapmnt, and Azure Files HDD isn't supported anyway.
      fr: |
        Un cluster Pacemaker Linux utilise NFS pour sapmnt, et Azure Files HDD n'est de toute façon pas pris en charge.
    fcianf:
      en: |
        WSFC with database files on SOFS or SMB on Azure NetApp Files isn't supported for Windows SAP databases.
      fr: |
        WSFC avec les fichiers de base de données sur SOFS ou sur SMB dans Azure NetApp Files n'est pas pris en charge pour les bases de données SAP sous Windows.
    pacemaker:
      en: |
        Pacemaker is the Linux cluster framework; on Windows, the supported framework is WSFC.
      fr: |
        Pacemaker est le framework de cluster Linux ; sous Windows, le framework pris en charge est WSFC.
references:
  - title: SAP workload on Azure virtual machine supported scenarios
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-supported-configurations
