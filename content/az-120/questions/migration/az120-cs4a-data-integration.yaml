id: az120-cs4a-data-integration
objective: "1.3.4"
type: single
caseStudy: az120-cs4a-wideworld
difficulty: 2
status: draft
stem:
  en: |
    You need to design the Azure Data Factory solution that meets the integration requirements.

    Which integration runtime configuration should you use?
  fr: |
    Vous devez concevoir la solution Azure Data Factory qui respecte les exigences d'intégration.

    Quelle configuration de runtime d'intégration devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: "An Azure integration runtime that connects to the HTTPS endpoint published by the SAP-managed application gateway"
        fr: "Un runtime d'intégration Azure qui se connecte au point de terminaison HTTPS publié par la passerelle d'application gérée par SAP"
    - id: b
      text:
        en: "A self-hosted integration runtime on VMs in VNET-INT-WE that connects to SAP S/4HANA over RFC through the peering"
        fr: "Un runtime d'intégration auto-hébergé sur des machines virtuelles de VNET-INT-WE qui se connecte à SAP S/4HANA par RFC via le peering"
    - id: c
      text:
        en: "An Azure integration runtime in a managed virtual network that uses a managed private endpoint to SAP S/4HANA"
        fr: "Un runtime d'intégration Azure dans un réseau virtuel managé qui utilise un point de terminaison privé managé vers SAP S/4HANA"
    - id: d
      text:
        en: "A self-hosted integration runtime installed on the SAP S/4HANA application servers in the SAP-managed virtual network"
        fr: "Un runtime d'intégration auto-hébergé installé sur les serveurs d'applications SAP S/4HANA dans le réseau virtuel géré par SAP"
answer: { optionId: b }
explanation:
  correct:
    en: With RISE, the customer deploys and operates the self-hosted integration runtime in its own subscription and virtual network. Its SAP connectors, such as the SAP table connector, call SAP function modules over RFC and reach the SAP system through the virtual network peering by using private addresses only, so no data crosses a public endpoint. Most SAP connectors are available only on a self-hosted integration runtime.
    fr: Avec RISE, le client déploie et exploite le runtime d'intégration auto-hébergé dans son propre abonnement et son propre réseau virtuel. Ses connecteurs SAP, comme le connecteur de table SAP, appellent des modules de fonction SAP par RFC et atteignent le système SAP via le peering de réseaux virtuels en n'utilisant que des adresses privées ; aucune donnée ne traverse donc un point de terminaison public. La plupart des connecteurs SAP ne sont disponibles que sur un runtime d'intégration auto-hébergé.
  options:
    a:
      en: The Azure integration runtime reaches RISE through a public IP address exposed by the SAP-managed application gateway, which violates the requirement that data never transits through a public endpoint.
      fr: Le runtime d'intégration Azure atteint RISE par une adresse IP publique exposée par la passerelle d'application gérée par SAP, ce qui enfreint l'exigence selon laquelle les données ne transitent jamais par un point de terminaison public.
    c:
      en: SAP does not generally offer private endpoints to RISE workloads, so a managed private endpoint to the SAP system is not available.
      fr: SAP ne propose généralement pas de points de terminaison privés vers les charges de travail RISE ; un point de terminaison privé managé vers le système SAP n'est donc pas disponible.
    d:
      en: Wide World Importers has no access to the VMs in SAP's subscription; the customer runs the self-hosted integration runtime in its own virtual network.
      fr: Wide World Importers n'a pas accès aux machines virtuelles de l'abonnement de SAP ; le client exécute le runtime d'intégration auto-hébergé dans son propre réseau virtuel.
references:
  - title: Integrating Azure services with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-services
