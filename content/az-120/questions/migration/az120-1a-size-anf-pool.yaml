id: az120-1a-size-anf-pool
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove plans to host the data and log volumes of a production SAP HANA system on Azure NetApp Files. The sizing exercise produced the following requirements:

    | Volume | Capacity | Throughput |
    | --- | --- | --- |
    | /hana/data | 38 TiB | 2,200 MiB/s |
    | /hana/log | 2 TiB | 300 MiB/s |

    The Premium service level provides 64 MiB/s per provisioned TiB and the Ultra service level provides 128 MiB/s per provisioned TiB. Ultra has a higher price per TiB than Premium.

    You need to recommend a capacity pool configuration that meets the capacity and throughput requirements at the lowest cost.

    What should you recommend?
  fr: |
    Woodgrove prévoit d'héberger les volumes de données et de journal d'un système SAP HANA de production sur Azure NetApp Files. L'exercice de dimensionnement a produit les exigences suivantes :

    | Volume | Capacité | Débit |
    | --- | --- | --- |
    | /hana/data | 38 Tio | 2 200 Mio/s |
    | /hana/log | 2 Tio | 300 Mio/s |

    Le niveau de service Premium fournit 64 Mio/s par Tio provisionné et le niveau de service Ultra 128 Mio/s par Tio provisionné. Ultra a un prix par Tio plus élevé que Premium.

    Vous devez recommander une configuration de pool de capacité qui respecte les exigences de capacité et de débit au coût le plus bas.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "One 20-TiB Ultra capacity pool with manual QoS", fr: "Un pool de capacité Ultra de 20 Tio avec QoS manuelle" } }
    - { id: b, text: { en: "Two Premium capacity pools of 38 TiB and 2 TiB with auto QoS", fr: "Deux pools de capacité Premium de 38 Tio et de 2 Tio avec QoS automatique" } }
    - { id: c, text: { en: "One 40-TiB Ultra capacity pool with auto QoS", fr: "Un pool de capacité Ultra de 40 Tio avec QoS automatique" } }
    - { id: d, text: { en: "One 40-TiB Premium capacity pool with manual QoS", fr: "Un pool de capacité Premium de 40 Tio avec QoS manuelle" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The volumes need 40 TiB and 2,500 MiB/s in total. A 40-TiB Premium pool provides 40 x 64 = 2,560 MiB/s, and manual QoS lets you assign that throughput to the volumes independently of their size (2,200 MiB/s to data and 300 MiB/s to log). It is the cheapest option that satisfies both capacity and throughput.
    fr: |
      Les volumes ont besoin au total de 40 Tio et de 2 500 Mio/s. Un pool Premium de 40 Tio fournit 40 x 64 = 2 560 Mio/s, et la QoS manuelle permet d'attribuer ce débit aux volumes indépendamment de leur taille (2 200 Mio/s pour les données et 300 Mio/s pour le journal). C'est l'option la moins chère qui respecte à la fois la capacité et le débit.
  options:
    a:
      en: |
        20 TiB of Ultra provides 2,560 MiB/s but only half of the 40 TiB of capacity required.
      fr: |
        20 Tio en Ultra fournissent 2 560 Mio/s mais seulement la moitié des 40 Tio de capacité nécessaires.
    b:
      en: |
        With auto QoS, throughput follows volume size: the 2-TiB log volume gets only 2 x 64 = 128 MiB/s instead of 300 MiB/s.
      fr: |
        Avec la QoS automatique, le débit suit la taille du volume : le volume de journal de 2 Tio n'obtient que 2 x 64 = 128 Mio/s au lieu de 300 Mio/s.
    c:
      en: |
        A 40-TiB Ultra pool meets the requirements, but it costs more than the Premium pool that also meets them.
      fr: |
        Un pool Ultra de 40 Tio respecte les exigences, mais il coûte plus cher que le pool Premium qui les respecte aussi.
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
