id: az120-1a-quota-offer-sp
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware hosts its SAP development systems in an Azure subscription created with an individual pay-as-you-go offer (Microsoft Online Subscription Program, offer MS-AZR-0003P). The subscription isn't part of an Enterprise Agreement, a Microsoft Customer Agreement or a Microsoft Partner Agreement.

    Proseware wants to buy a one-year commitment-based discount for the VMs in this subscription.

    Which discounts can Proseware purchase for this subscription?
  fr: |
    Proseware héberge ses systèmes SAP de développement dans un abonnement Azure créé avec une offre individuelle de paiement à l'utilisation (Microsoft Online Subscription Program, offre MS-AZR-0003P). L'abonnement ne fait partie ni d'un Contrat Entreprise, ni d'un Contrat client Microsoft, ni d'un Contrat Partenaire Microsoft.

    Proseware veut acheter une remise basée sur un engagement d'un an pour les machines virtuelles de cet abonnement.

    Quelles remises Proseware peut-elle acheter pour cet abonnement ?
body:
  options:
    - { id: a, text: { en: "Compute savings plans only", fr: "Uniquement des plans d'économies pour le calcul" } }
    - { id: b, text: { en: "Both reserved VM instances and compute savings plans", fr: "Des instances de machine virtuelle réservées et des plans d'économies pour le calcul" } }
    - { id: c, text: { en: "Neither reserved VM instances nor compute savings plans", fr: "Ni instances de machine virtuelle réservées, ni plans d'économies pour le calcul" } }
    - { id: d, text: { en: "Reserved VM instances only", fr: "Uniquement des instances de machine virtuelle réservées" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Individual pay-as-you-go subscriptions can buy Azure reservations, which are charged to the subscription's payment method. Savings plans are available only to customers with an Enterprise Agreement, a Microsoft Customer Agreement or a Microsoft Partner Agreement, so the subscription model limits Proseware to reservations.
    fr: |
      Les abonnements individuels de paiement à l'utilisation peuvent acheter des réservations Azure, facturées sur le moyen de paiement de l'abonnement. Les plans d'économies ne sont disponibles que pour les clients disposant d'un Contrat Entreprise, d'un Contrat client Microsoft ou d'un Contrat Partenaire Microsoft : le modèle d'abonnement limite donc Proseware aux réservations.
  options:
    a:
      en: |
        Savings plans require an EA, MCA or MPA billing agreement, which this subscription doesn't have.
      fr: |
        Les plans d'économies exigent un contrat de facturation EA, MCA ou MPA, que cet abonnement n'a pas.
    b:
      en: |
        Only reservations are available; savings plans aren't offered to individual pay-as-you-go subscriptions.
      fr: |
        Seules les réservations sont disponibles ; les plans d'économies ne sont pas proposés aux abonnements individuels de paiement à l'utilisation.
    c:
      en: |
        Individual pay-as-you-go subscriptions can buy reservations and pay for them up front or monthly.
      fr: |
        Les abonnements individuels de paiement à l'utilisation peuvent acheter des réservations et les payer d'avance ou mensuellement.
references:
  - title: What are savings plans?
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/savings-plan-compute-overview
  - title: What are Azure Reservations?
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/save-compute-costs-reservations
