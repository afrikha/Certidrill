id: az120-1c-rise-impl-peering-order
objective: "1.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a hub virtual network named **vnet-hub** in its own Microsoft Entra tenant. SAP has deployed the RISE with SAP landscape of Contoso in a virtual network named **vnet-rise** in SAP's tenant, and has sent Contoso the resource ID of vnet-rise and a guest invitation to SAP's tenant.

    You need to establish virtual network peering between vnet-hub and vnet-rise.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso, Ltd. dispose d'un réseau virtuel hub nommé **vnet-hub** dans son propre locataire Microsoft Entra. SAP a déployé le paysage RISE with SAP de Contoso dans un réseau virtuel nommé **vnet-rise** du locataire de SAP, et a envoyé à Contoso l'ID de ressource de vnet-rise et une invitation d'invité dans le locataire de SAP.

    Vous devez établir un peering de réseaux virtuels entre vnet-hub et vnet-rise.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: guest, text: { en: "Accept the guest invitation to SAP's tenant, and invite SAP's user as a guest with the Network Contributor role on vnet-hub.", fr: "Accepter l'invitation d'invité dans le locataire de SAP, et inviter l'utilisateur de SAP en tant qu'invité avec le rôle Network Contributor sur vnet-hub." } }
    - { id: create, text: { en: "Create the peering on vnet-hub by using the resource ID of vnet-rise.", fr: "Créer le peering sur vnet-hub en utilisant l'ID de ressource de vnet-rise." } }
    - { id: sap, text: { en: "Have SAP create and approve the corresponding peering on vnet-rise.", fr: "Faire créer et approuver par SAP le peering correspondant sur vnet-rise." } }
    - { id: verify, text: { en: "Verify that the peering status is Connected on both virtual networks.", fr: "Vérifier que l'état du peering est Connected sur les deux réseaux virtuels." } }
    - { id: pe, text: { en: "Create a private endpoint in vnet-hub for the RISE application servers.", fr: "Créer dans vnet-hub un point de terminaison privé pour les serveurs d'application RISE." } }
    - { id: sync, text: { en: "Run a sync on the peering of vnet-hub before SAP creates its peering.", fr: "Exécuter une synchronisation du peering de vnet-hub avant que SAP crée son peering." } }
answer:
  sequence: [ guest, create, sap, verify ]
explanation:
  correct:
    en: |
      Because RISE runs in SAP's tenant, each side needs a guest user in the opposite tenant with permission (such as Network Contributor) on the virtual network. You then create the peering with the resource ID of the SAP network; it stays Initiated until SAP creates and approves the matching peering, after which both peerings show Connected.
    fr: |
      Comme RISE s'exécute dans le locataire de SAP, chaque partie a besoin d'un utilisateur invité dans le locataire opposé, avec une autorisation (comme Network Contributor) sur le réseau virtuel. Vous créez ensuite le peering avec l'ID de ressource du réseau de SAP ; il reste à l'état Initiated jusqu'à ce que SAP crée et approuve le peering correspondant, après quoi les deux peerings affichent Connected.
  options:
    pe:
      en: |
        SAP generally does not offer private endpoints to RISE workloads; the connectivity is the peering itself.
      fr: |
        SAP ne propose généralement pas de points de terminaison privés vers les charges de travail RISE ; la connectivité est le peering lui-même.
    sync:
      en: |
        A sync is needed after an address space change on a peered VNet, not while establishing the peering.
      fr: |
        Une synchronisation est nécessaire après une modification de l'espace d'adressage d'un réseau virtuel relié par peering, pas pendant l'établissement du peering.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
  - title: Create Virtual Network Peering Between Different Subscriptions - Azure Virtual Network
    url: https://learn.microsoft.com/en-us/azure/virtual-network/create-peering-different-subscriptions
