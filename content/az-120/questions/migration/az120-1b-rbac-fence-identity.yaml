id: az120-1b-rbac-fence-identity
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation deploys a two-node Pacemaker cluster for SAP HANA on SUSE Linux Enterprise Server (SLES) virtual machines named **hana-vm1** and **hana-vm2**. The cluster uses the Azure fence agent.

    You need to authorize the fence agent. The solution must follow the principle of least privilege and must not require any credential maintenance.

    What should you do?
  fr: |
    Adatum Corporation déploie un cluster Pacemaker à deux nœuds pour SAP HANA sur des machines virtuelles SUSE Linux Enterprise Server (SLES) nommées **hana-vm1** et **hana-vm2**. Le cluster utilise l'agent Azure Fence.

    Vous devez autoriser l'agent Azure Fence. La solution doit respecter le principe du moindre privilège et ne doit exiger aucune maintenance d'informations d'identification.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Enable a system-assigned managed identity on each VM, and assign each identity a custom role that allows power-off and start on both cluster VMs.", fr: "Activer une identité managée affectée par le système sur chaque machine virtuelle, et attribuer à chaque identité un rôle personnalisé autorisant l'arrêt et le démarrage sur les deux machines virtuelles du cluster." }
    - id: b
      text: { en: "Create one user-assigned managed identity, attach it to both VMs, and assign it the Virtual Machine Contributor role on the resource group.", fr: "Créer une identité managée affectée par l'utilisateur, l'attacher aux deux machines virtuelles et lui attribuer le rôle Virtual Machine Contributor sur le groupe de ressources." }
    - id: c
      text: { en: "Create a service principal with a client secret, and assign it a custom role that allows power-off and start on both cluster VMs.", fr: "Créer un principal de service avec une clé secrète client, et lui attribuer un rôle personnalisé autorisant l'arrêt et le démarrage sur les deux machines virtuelles du cluster." }
    - id: d
      text: { en: "Enable a system-assigned managed identity on each VM, and assign each identity the Virtual Machine Contributor role on its own VM only.", fr: "Activer une identité managée affectée par le système sur chaque machine virtuelle, et attribuer à chaque identité le rôle Virtual Machine Contributor sur sa propre machine virtuelle uniquement." }
answer: { optionId: a }
explanation:
  correct:
    en: Microsoft recommends managed identities for the Azure fence agent because they remove credential maintenance, and only system-assigned identities are supported. A custom role (Linux Fence Agent) grants only Microsoft.Compute read, powerOff and start actions, and each node's identity is assigned the role for every VM of the cluster, including itself, because a node must be able to fence its peer.
    fr: Microsoft recommande les identités managées pour l'agent Azure Fence, car elles suppriment la maintenance des informations d'identification, et seules les identités affectées par le système sont prises en charge. Un rôle personnalisé (Linux Fence Agent) n'accorde que la lecture Microsoft.Compute et les actions powerOff et start, et l'identité de chaque nœud reçoit ce rôle pour chaque machine virtuelle du cluster, y compris elle-même, car un nœud doit pouvoir isoler son homologue.
  options:
    b:
      en: User-assigned managed identities aren't supported by the fence agent, and Virtual Machine Contributor grants far more than power actions.
      fr: Les identités managées affectées par l'utilisateur ne sont pas prises en charge par l'agent Azure Fence, et Virtual Machine Contributor accorde bien plus que les actions d'alimentation.
    c:
      en: A service principal works but its secret must be stored and rotated, which the requirement excludes; Microsoft recommends moving from a service principal to a managed identity.
      fr: Un principal de service fonctionne, mais sa clé secrète doit être stockée et renouvelée, ce que l'exigence exclut ; Microsoft recommande de passer d'un principal de service à une identité managée.
    d:
      en: Each node must be able to power off the other node, so a role on its own VM only doesn't allow fencing; the role is also broader than needed.
      fr: Chaque nœud doit pouvoir arrêter l'autre nœud ; un rôle sur sa seule machine virtuelle ne permet donc pas l'isolation, et ce rôle est en outre plus large que nécessaire.
references:
  - title: Set up Pacemaker on SUSE Linux Enterprise Server in Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-pacemaker
