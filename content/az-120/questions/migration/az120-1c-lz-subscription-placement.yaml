id: az120-1c-lz-subscription-placement
objective: "1.2.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is designing the subscriptions of its SAP landing zone by following the SAP on Azure reference architecture. The architecture uses a primary and a secondary Azure region, and a hub-spoke network topology.

    Which subscription should host each set of resources? To answer, drag the appropriate subscriptions to the correct resources. Each subscription may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank conçoit les abonnements de sa zone d'atterrissage SAP en suivant l'architecture de référence SAP sur Azure. L'architecture utilise une région Azure principale et une région secondaire, ainsi qu'une topologie réseau hub-spoke.

    Quel abonnement doit héberger chaque ensemble de ressources ? Pour répondre, faites glisser les abonnements appropriés vers les ressources correspondantes. Chaque abonnement peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: hub, text: { en: "Hub subscription", fr: "Abonnement hub" } }
    - { id: prd, text: { en: "SAP production subscription", fr: "Abonnement SAP de production" } }
    - { id: nonprd, text: { en: "SAP non-production subscription", fr: "Abonnement SAP hors production" } }
    - { id: ident, text: { en: "Identity subscription", fr: "Abonnement d'identité" } }
  targets:
    - { id: t1, text: { en: "Hub virtual networks of the primary and secondary regions", fr: "Réseaux virtuels hub des régions principale et secondaire" } }
    - { id: t2, text: { en: "Production S/4HANA systems and their disaster recovery systems", fr: "Systèmes S/4HANA de production et leurs systèmes de récupération d'urgence" } }
    - { id: t3, text: { en: "Sandbox, development and quality assurance systems", fr: "Systèmes de bac à sable, de développement et d'assurance qualité" } }
answer:
  mapping: { t1: hub, t2: prd, t3: nonprd }
explanation:
  correct:
    en: In the reference architecture, the hub subscription contains the hub virtual networks of both regions. The SAP production subscription contains the production systems and their disaster recovery systems, so DR stays with production. The non-production subscription holds sandbox, development, quality assurance or preproduction systems.
    fr: |
      Dans l'architecture de référence, l'abonnement hub contient les réseaux virtuels hub des deux régions. L'abonnement SAP de production contient les systèmes de production et leurs systèmes de récupération d'urgence : la récupération d'urgence reste avec la production. L'abonnement hors production contient les systèmes de bac à sable, de développement, d'assurance qualité ou de préproduction.
  options:
    ident:
      en: The reference SAP architecture does not place any of these resources in an identity subscription.
      fr: L'architecture SAP de référence ne place aucune de ces ressources dans un abonnement d'identité.
references:
  - title: SAP on Azure landing zone accelerator - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/sap/enterprise-scale-landing-zone
