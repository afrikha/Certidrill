id: az120-1b-pol-dine-effect
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. requires that every SAP virtual machine deployed in its SAP landing zone has a specific VM extension installed. When a virtual machine is created without the extension, the extension must be deployed automatically. Existing virtual machines will be handled later.

    You plan to write a custom policy definition.

    Which effect should the policy definition use?
  fr: |
    Proseware, Inc. exige que chaque machine virtuelle SAP déployée dans sa zone d'atterrissage SAP dispose d'une extension de machine virtuelle précise. Lorsqu'une machine virtuelle est créée sans l'extension, celle-ci doit être déployée automatiquement. Les machines virtuelles existantes seront traitées plus tard.

    Vous prévoyez d'écrire une définition de stratégie personnalisée.

    Quel effet la définition de stratégie doit-elle utiliser ?
body:
  options:
    - { id: a, text: append }
    - { id: b, text: modify }
    - { id: c, text: deployIfNotExists }
    - { id: d, text: auditIfNotExists }
answer: { optionId: c }
explanation:
  correct:
    en: The extension is a related resource of the virtual machine. deployIfNotExists evaluates after the VM is created and deploys a template when the related resource doesn't exist, using the assignment's managed identity; existing VMs can be fixed later with a remediation task.
    fr: L'extension est une ressource associée à la machine virtuelle. deployIfNotExists s'évalue après la création de la machine virtuelle et déploie un modèle lorsque la ressource associée n'existe pas, à l'aide de l'identité managée de l'attribution ; les machines virtuelles existantes peuvent être corrigées plus tard par une tâche de correction.
  options:
    a:
      en: append adds fields to the create or update request of the resource itself; it cannot deploy another resource.
      fr: append ajoute des champs à la demande de création ou de mise à jour de la ressource elle-même ; il ne peut pas déployer une autre ressource.
    b:
      en: modify adds, updates or removes properties or tags of the resource itself; it doesn't deploy a related resource.
      fr: modify ajoute, met à jour ou supprime des propriétés ou des étiquettes de la ressource elle-même ; il ne déploie pas de ressource associée.
    d:
      en: auditIfNotExists only reports that the related resource is missing; it doesn't deploy it.
      fr: auditIfNotExists signale seulement que la ressource associée est absente ; il ne la déploie pas.
references:
  - title: Azure Policy definitions effect basics
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-basics
  - title: Remediate non-compliant resources with Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
