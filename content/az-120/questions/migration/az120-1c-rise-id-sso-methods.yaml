id: az120-1c-rise-id-sso-methods
objective: "1.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. runs SAP S/4HANA in RISE with SAP on Azure. Contoso uses Microsoft Entra ID and an on-premises Active Directory domain. You are designing single sign-on (SSO) for three access types.

    How should you complete the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. exécute SAP S/4HANA dans RISE with SAP sur Azure. Contoso utilise Microsoft Entra ID et un domaine Active Directory local. Vous concevez l'authentification unique (SSO) pour trois types d'accès.

    Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      SAP Fiori in the browser, with Microsoft Entra ID as the identity provider: [[fiori]]

      SAP GUI for Windows, with Microsoft Entra ID as the identity provider: [[gui]]

      SAP Enterprise Portal with Active Directory Kerberos tickets: [[portal]]

      The SSO configuration for the Enterprise Portal is performed by: [[who]]
    fr: |
      SAP Fiori dans le navigateur, avec Microsoft Entra ID comme fournisseur d'identité : [[fiori]]

      SAP GUI pour Windows, avec Microsoft Entra ID comme fournisseur d'identité : [[gui]]

      SAP Enterprise Portal avec des tickets Kerberos Active Directory : [[portal]]

      La configuration SSO de l'Enterprise Portal est effectuée par : [[who]]
  slots:
    - id: fiori
      options:
        - { id: saml, text: "SAML" }
        - { id: snc, text: "SNC" }
        - { id: spnego, text: "SPNEGO" }
    - id: gui
      options:
        - { id: saml, text: "SAML" }
        - { id: snc, text: "SNC" }
        - { id: spnego, text: "SPNEGO" }
    - id: portal
      options:
        - { id: saml, text: "SAML" }
        - { id: snc, text: "SNC" }
        - { id: spnego, text: "SPNEGO" }
    - id: who
      options:
        - { id: cust, text: { en: "Contoso only", fr: "Contoso uniquement" } }
        - { id: sap, text: { en: "SAP only", fr: "SAP uniquement" } }
        - { id: both, text: { en: "Contoso and SAP", fr: "Contoso et SAP" } }
answer:
  values: { fiori: saml, gui: snc, portal: spnego, who: both }
explanation:
  correct:
    en: |
      SSO for RISE is configured as for natively run SAP systems. SAML (or OAuth) with Microsoft Entra ID covers Fiori, Web GUI, Portal and HANA, configured by the customer. SNC covers SAP GUI, also configured by the customer. SPNEGO with Active Directory covers Web GUI and SAP Enterprise Portal and is configured by the customer and SAP together.
    fr: |
      L'authentification unique pour RISE se configure comme pour des systèmes SAP exécutés de façon native. SAML (ou OAuth) avec Microsoft Entra ID couvre Fiori, Web GUI, Portal et HANA, configuré par le client. SNC couvre SAP GUI, également configuré par le client. SPNEGO avec Active Directory couvre Web GUI et SAP Enterprise Portal, et il est configuré conjointement par le client et SAP.
references:
  - title: Identity and security in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-security
