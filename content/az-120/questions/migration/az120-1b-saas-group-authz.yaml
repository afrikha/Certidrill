id: az120-1b-saas-group-authz
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. federates SAP BTP with SAP Cloud Identity Services - Identity Authentication (IAS), and IAS uses Microsoft Entra ID as its corporate identity provider.

    Access to the BTP applications must be granted by adding users to Microsoft Entra security groups. Renaming a group must not change who has access.

    Which two actions should you perform?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. fédère SAP BTP avec SAP Cloud Identity Services - Identity Authentication (IAS), et IAS utilise Microsoft Entra ID comme fournisseur d'identité d'entreprise.

    L'accès aux applications BTP doit être accordé en ajoutant des utilisateurs à des groupes de sécurité Microsoft Entra. Le renommage d'un groupe ne doit pas changer qui dispose de l'accès.

    Quelles sont les deux actions à effectuer ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In the Microsoft Entra enterprise application for IAS, add a group claim named Groups with Group ID as its source.", fr: "Dans l'application d'entreprise Microsoft Entra pour IAS, ajouter une revendication de groupe nommée Groups avec Group ID comme source." } }
    - { id: b, text: { en: "In the BTP subaccount, map each role collection to the Object ID of the matching Microsoft Entra group.", fr: "Dans le sous-compte BTP, mapper chaque collection de rôles (role collection) à l'ID d'objet du groupe Microsoft Entra correspondant." } }
    - { id: c, text: { en: "In the BTP subaccount, map each role collection to the display name of the matching Microsoft Entra group.", fr: "Dans le sous-compte BTP, mapper chaque collection de rôles (role collection) au nom d'affichage du groupe Microsoft Entra correspondant." } }
    - { id: d, text: { en: "In the Microsoft Entra enterprise application for IAS, set User assignment required to Yes and assign each user.", fr: "Dans l'application d'entreprise Microsoft Entra pour IAS, définir User assignment required sur Yes et attribuer chaque utilisateur." } }
    - { id: e, text: { en: "In IAS, enable Use Identity Authentication user store on the corporate identity provider.", fr: "Dans IAS, activer Use Identity Authentication user store sur le fournisseur d'identité d'entreprise." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: The SAML group claim named Groups, sourced from the Group ID, carries the users' group memberships through IAS to BTP, where role collections are mapped to user groups. The Object ID is globally unique and immutable, so renaming a group doesn't affect access, unlike the display name.
    fr: La revendication de groupe SAML nommée Groups, alimentée par le Group ID, transmet les appartenances aux groupes des utilisateurs via IAS jusqu'à BTP, où les collections de rôles sont mappées à des groupes d'utilisateurs. L'ID d'objet est globalement unique et immuable ; renommer un groupe n'affecte donc pas l'accès, contrairement au nom d'affichage.
  options:
    c: { en: "A display name can be changed or reused by a new group, which could break access or grant it to the wrong people.", fr: "Un nom d'affichage peut être modifié ou réutilisé par un nouveau groupe, ce qui pourrait casser l'accès ou l'accorder aux mauvaises personnes." }
    d: { en: "Microsoft recommends turning User assignment required off; Microsoft Entra ID only sees the sign-in to IAS and can't make per-application decisions.", fr: "Microsoft recommande de désactiver User assignment required ; Microsoft Entra ID ne voit que la connexion à IAS et ne peut pas décider par application." }
    e: { en: "With this setting enabled, the group information from Microsoft Entra ID is dropped and authorization fails.", fr: "Avec ce paramètre activé, les informations de groupe venant de Microsoft Entra ID sont perdues et l'autorisation échoue." }
references:
  - title: Scenario - Using Microsoft Entra ID to secure access to SAP platforms and applications
    url: https://learn.microsoft.com/en-us/entra/fundamentals/scenario-azure-first-sap-identity-integration
