id: az120-1a-lic-sql-yn
objective: "1.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove runs the SQL Server Enterprise database of its SAP system on an Azure virtual machine deployed from a pay-as-you-go Marketplace image. A second VM hosts a passive SQL Server replica in another region, used only for disaster recovery. Woodgrove owns SQL Server core licenses with Software Assurance.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove exécute la base de données SQL Server Enterprise de son système SAP sur une machine virtuelle Azure déployée à partir d'une image de paiement à l'utilisation de la Place de marché. Une seconde machine virtuelle héberge un réplica SQL Server passif dans une autre région, utilisé uniquement pour la reprise d'activité. Woodgrove possède des licences de cœurs SQL Server avec Software Assurance.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Switching the primary VM to the Azure Hybrid Benefit license model restarts the SQL Server service.
        fr: |
          Basculer la machine virtuelle principale vers le modèle de licence Azure Hybrid Benefit redémarre le service SQL Server.
    - id: s2
      text:
        en: |
          To change the license model in Azure, each VM must be registered with the SQL IaaS Agent extension.
        fr: |
          Pour changer le modèle de licence dans Azure, chaque machine virtuelle doit être inscrite auprès de l'extension SQL IaaS Agent.
    - id: s3
      text:
        en: |
          The VM that hosts the passive disaster recovery replica can use the HA/DR license type.
        fr: |
          La machine virtuelle qui héberge le réplica passif de reprise d'activité peut utiliser le type de licence HA/DR.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Changing the license model has no downtime: it doesn't restart the VM or the SQL Server service and takes effect immediately. The change requires the VM to be registered with the SQL IaaS Agent extension. The HA/DR license type covers a VM used as a passive replica, for the free HA/DR replica benefit.
    fr: |
      Changer le modèle de licence n'entraîne pas d'interruption : cela ne redémarre ni la machine virtuelle ni le service SQL Server et prend effet immédiatement. Le changement exige que la machine virtuelle soit inscrite auprès de l'extension SQL IaaS Agent. Le type de licence HA/DR couvre une machine virtuelle utilisée comme réplica passif, pour l'avantage du réplica HA/DR gratuit.
references:
  - title: Change the license model for a SQL virtual machine in Azure
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/licensing-model-azure-hybrid-benefit-ahb-change
