id: az120-1c-rise-id-sentinel-connector
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. runs SAP S/4HANA Cloud, private edition in RISE with SAP on Azure. In November 2026, the Fabrikam security team starts deploying the Microsoft Sentinel solution for SAP applications to collect the SAP security audit log, change documents and user master data.

    You need to recommend how to connect the SAP system to Microsoft Sentinel.

    What should you recommend?
  fr: |
    Fabrikam, Inc. exécute SAP S/4HANA Cloud, private edition dans RISE with SAP sur Azure. En novembre 2026, l'équipe de sécurité de Fabrikam commence à déployer la solution Microsoft Sentinel pour les applications SAP afin de collecter le journal d'audit de sécurité SAP, les documents de modification et les données de base des utilisateurs.

    Vous devez recommander comment connecter le système SAP à Microsoft Sentinel.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "The containerized data connector agent on a Linux VM in a Fabrikam virtual network peered with RISE", fr: "L'agent de connecteur de données conteneurisé sur une machine virtuelle Linux d'un réseau virtuel Fabrikam relié par peering à RISE" }
    - id: b
      text: { en: "The Azure Monitor Agent with a data collection rule on the RISE application servers", fr: "L'agent Azure Monitor avec une règle de collecte de données sur les serveurs d'application RISE" }
    - id: c
      text: { en: "An Azure Monitor for SAP solutions instance with a NetWeaver provider for the RISE system", fr: "Une instance Azure Monitor pour les solutions SAP avec un fournisseur NetWeaver pour le système RISE" }
    - id: d
      text: { en: "The agentless data connector, which uses SAP Cloud Connector and SAP Integration Suite", fr: "Le connecteur de données sans agent, qui utilise SAP Cloud Connector et SAP Integration Suite" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Microsoft Sentinel solution for SAP applications uses the agentless data connector, which connects to the SAP system through SAP Cloud Connector and SAP Integration Suite and supports S/4HANA Cloud, private edition (RISE). It ingests the security audit log, change documents and user master data, including roles and authorizations.
    fr: |
      La solution Microsoft Sentinel pour les applications SAP utilise le connecteur de données sans agent, qui se connecte au système SAP par SAP Cloud Connector et SAP Integration Suite et prend en charge S/4HANA Cloud, private edition (RISE). Il ingère le journal d'audit de sécurité, les documents de modification et les données de base des utilisateurs, y compris les rôles et autorisations.
  options:
    a:
      en: |
        The containerized data connector agent retired on September 14, 2026, is unsupported, and its container images were removed on October 14, 2026.
      fr: |
        L'agent de connecteur de données conteneurisé a été mis hors service le 14 septembre 2026, il n'est plus pris en charge et ses images de conteneur ont été supprimées le 14 octobre 2026.
    b:
      en: |
        Customers have no access to the Azure resources of RISE, and the solution integrates only the SAP application layer.
      fr: |
        Les clients n'ont pas accès aux ressources Azure de RISE, et la solution n'intègre que la couche d'application SAP.
    c:
      en: |
        RISE does not support any integration with Azure Monitor for SAP solutions, which is a monitoring service, not a Sentinel connector.
      fr: |
        RISE ne prend en charge aucune intégration avec Azure Monitor pour les solutions SAP, qui est un service de supervision, pas un connecteur Sentinel.
references:
  - title: Deploy the Microsoft Sentinel solution for SAP applications
    url: https://learn.microsoft.com/en-us/azure/sentinel/sap/deployment-overview
  - title: Identity and security in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-security
