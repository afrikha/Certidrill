id: az120-1a-quota-request-order
objective: "1.1.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Tailspin needs more vCPUs in the Germany West Central region of an Azure subscription named Sub-SAP-QA to deploy SAP quality assurance systems. You have the Contributor role on the subscription.

    You need to increase the regional vCPU quota by using the Quotas page of the Azure portal.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin a besoin de davantage de processeurs virtuels dans la région Germany West Central d'un abonnement Azure nommé Sub-SAP-QA pour déployer des systèmes SAP d'assurance qualité. Vous disposez du rôle Contributor sur l'abonnement.

    Vous devez augmenter le quota de processeurs virtuels régional à l'aide de la page Quotas du portail Azure.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: open, text: { en: "Search for quotas and open **Quotas**.", fr: "Rechercher « quotas » et ouvrir **Quotas**." } }
    - { id: compute, text: { en: "On the **Overview** page, select **Compute**.", fr: "Dans la page **Overview**, sélectionner **Compute**." } }
    - { id: region, text: { en: "On **My quotas**, filter the list on the Germany West Central region.", fr: "Dans **My quotas**, filtrer la liste sur la région Germany West Central." } }
    - { id: select, text: { en: "Select the quota to increase and select **New Quota Request**.", fr: "Sélectionner le quota à augmenter, puis **New Quota Request**." } }
    - { id: submit, text: { en: "Enter the new limit and select **Submit**.", fr: "Saisir la nouvelle limite et sélectionner **Submit**." } }
    - { id: tech, text: { en: "Create a technical support request with the **Virtual Machine running Linux** service.", fr: "Créer une demande de support technique pour le service **Virtual Machine running Linux**." } }
    - { id: upgrade, text: { en: "Purchase a Professional Direct support plan.", fr: "Acheter un plan de support Professional Direct." } }
answer:
  sequence: [ open, compute, region, select, submit ]
explanation:
  correct:
    en: |
      In the Quotas page, you select the Compute provider, filter My quotas on the region, select the quota and create a new quota request with the new limit. Requests are usually answered within minutes. Quota requests are subscription management requests, which don't require a paid support plan.
    fr: |
      Dans la page Quotas, vous sélectionnez le fournisseur Compute, filtrez My quotas sur la région, sélectionnez le quota et créez une nouvelle demande de quota avec la nouvelle limite. Les demandes reçoivent généralement une réponse en quelques minutes. Les demandes de quota relèvent de la gestion d'abonnement, qui n'exige pas de plan de support payant.
  options:
    tech:
      en: |
        A quota increase isn't a technical issue; it is handled from the Quotas page or as a service and subscription limits request.
      fr: |
        Une augmentation de quota n'est pas un problème technique ; elle se traite depuis la page Quotas ou comme une demande de limites de service et d'abonnement.
    upgrade:
      en: |
        Quota adjustments are supported at no cost, without a support plan.
      fr: |
        Les ajustements de quota sont pris en charge gratuitement, sans plan de support.
references:
  - title: Increase regional vCPU quotas
    url: https://learn.microsoft.com/en-us/azure/quotas/regional-quota-requests
  - title: Create an Azure support request
    url: https://learn.microsoft.com/en-us/azure/azure-portal/supportability/how-to-create-azure-support-request
