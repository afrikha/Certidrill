id: az120-1c-rise-svc-management-yesno
objective: "1.3.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. runs SAP S/4HANA Cloud, private edition in RISE with SAP on Azure. The Fabrikam operations team already uses Azure Center for SAP solutions and Azure Monitor for SAP solutions for its other SAP systems that run on Azure virtual machines in Fabrikam subscriptions.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. exécute SAP S/4HANA Cloud, private edition dans RISE with SAP sur Azure. L'équipe d'exploitation de Fabrikam utilise déjà le Centre Azure pour les solutions SAP et Azure Monitor pour les solutions SAP pour ses autres systèmes SAP qui s'exécutent sur des machines virtuelles Azure des abonnements de Fabrikam.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Fabrikam can register the RISE system in Azure Center for SAP solutions to start and stop it from Azure.
        fr: Fabrikam peut inscrire le système RISE dans le Centre Azure pour les solutions SAP pour le démarrer et l'arrêter depuis Azure.
    - id: s2
      text:
        en: Fabrikam can add the RISE HANA database as a provider in its Azure Monitor for SAP solutions instance.
        fr: Fabrikam peut ajouter la base de données HANA de RISE comme fournisseur dans son instance Azure Monitor pour les solutions SAP.
    - id: s3
      text:
        en: Monitoring and reporting for the RISE landscape are provided by SAP as defined in the service description.
        fr: La supervision et les rapports du paysage RISE sont fournis par SAP selon la description de service.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      RISE does not support any integration with Azure Center for SAP solutions, because SAP deploys the workloads in its own tenant and subscription without customer access to the Azure resources. RISE does not support Azure Monitor for SAP solutions either; SAP's own monitoring and reporting is provided as defined in the service description.
    fr: |
      RISE ne prend en charge aucune intégration avec le Centre Azure pour les solutions SAP, car SAP déploie les charges de travail dans son propre locataire et son propre abonnement, sans accès du client aux ressources Azure. RISE ne prend pas non plus en charge Azure Monitor pour les solutions SAP ; la supervision et les rapports de SAP sont fournis selon la description de service.
references:
  - title: Identity and security in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-security
