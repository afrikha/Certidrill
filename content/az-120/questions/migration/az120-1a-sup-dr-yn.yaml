id: az120-1a-sup-dr-yn
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs a production SAP S/4HANA system on Azure virtual machines in West Europe: SAP HANA on M-series VMs and the SAP application servers on E-series VMs. Fabrikam needs a disaster recovery (DR) design in North Europe that SAP and Microsoft support.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam exécute un système SAP S/4HANA de production sur des machines virtuelles Azure dans la région West Europe : SAP HANA sur des machines virtuelles de série M et les serveurs d'applications SAP sur des machines virtuelles de série E. Fabrikam a besoin d'une conception de reprise d'activité (DR) dans la région North Europe prise en charge par SAP et Microsoft.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can use Azure Site Recovery to replicate the SAP application server VMs to North Europe.
        fr: |
          Vous pouvez utiliser Azure Site Recovery pour répliquer les machines virtuelles des serveurs d'applications SAP vers North Europe.
    - id: s2
      text:
        en: |
          You can use Azure Site Recovery to replicate the SAP HANA VMs to North Europe.
        fr: |
          Vous pouvez utiliser Azure Site Recovery pour répliquer les machines virtuelles SAP HANA vers North Europe.
    - id: s3
      text:
        en: |
          The HANA VM in North Europe can be smaller than the primary VM if it can still apply the replicated changes.
        fr: |
          La machine virtuelle HANA de North Europe peut être plus petite que la machine virtuelle principale si elle peut toujours appliquer les modifications répliquées.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      For the non-DBMS layer, Azure-to-Azure Site Recovery is a supported DR method. For the DBMS layer, Site Recovery isn't supported: use the native asynchronous replication of the DBMS, here HANA System Replication, to another region. The DR target VM can be smaller, provided it has enough resources to apply the change stream and accepts the lower disk count and throughput limits.
    fr: |
      Pour la couche hors SGBD, Site Recovery Azure vers Azure est une méthode de DR prise en charge. Pour la couche SGBD, Site Recovery n'est pas pris en charge : utilisez la réplication asynchrone native du SGBD, ici HANA System Replication, vers une autre région. La machine virtuelle cible de DR peut être plus petite, à condition d'avoir assez de ressources pour appliquer le flux de modifications et d'accepter un nombre de disques et des limites de débit inférieurs.
references:
  - title: SAP workload on Azure virtual machine supported scenarios
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-supported-configurations
