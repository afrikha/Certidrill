id: az120-1c-rise-net-internet
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is planning internet connectivity for its SAP S/4HANA Cloud, private edition landscape that runs in RISE with SAP on Azure. Tailspin employees must reach SAP Fiori from the internet, and an integration application that Tailspin runs in its own spoke virtual network needs an SAP Cloud Connector to reach SAP BTP.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys planifie la connectivité Internet de son paysage SAP S/4HANA Cloud, private edition qui s'exécute dans RISE with SAP sur Azure. Les employés de Tailspin doivent accéder à SAP Fiori depuis Internet, et une application d'intégration que Tailspin exécute dans son propre réseau virtuel spoke a besoin d'un SAP Cloud Connector pour atteindre SAP BTP.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Internet connectivity is not enabled by default for RISE and must be planned with SAP.", fr: "La connectivité Internet n'est pas activée par défaut pour RISE et doit être planifiée avec SAP." }
    - id: b
      text: { en: "Internet-bound traffic from RISE transits through the Azure Firewall in the Tailspin hub.", fr: "Le trafic à destination d'Internet issu de RISE transite par le Pare-feu Azure du hub de Tailspin." }
    - id: c
      text: { en: "The SAP Cloud Connector for the Tailspin integration should run on VMs that Tailspin manages.", fr: "Le SAP Cloud Connector de l'intégration de Tailspin doit s'exécuter sur des machines virtuelles gérées par Tailspin." }
    - id: d
      text: { en: "Fiori must be published through an Application Gateway that Tailspin deploys in its hub.", fr: "Fiori doit être publié par un Application Gateway que Tailspin déploie dans son hub." }
    - id: e
      text: { en: "Inbound internet access to RISE requires a NAT gateway in the Tailspin hub.", fr: "L'accès entrant depuis Internet vers RISE exige une passerelle NAT dans le hub de Tailspin." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      RISE networking uses private IP ranges only by default; internet inbound or outbound access requires planning with SAP. For integrations of the customer's own applications, an SAP Cloud Connector should run on the customer's VMs, on a network path that the customer manages.
    fr: |
      Par défaut, le réseau RISE n'utilise que des plages d'adresses IP privées ; l'accès Internet entrant ou sortant doit être planifié avec SAP. Pour les intégrations des applications du client, un SAP Cloud Connector doit s'exécuter sur les machines virtuelles du client, sur un chemin réseau que le client gère.
  options:
    b:
      en: |
        The RISE internet path typically stays within the SAP RISE VNet and does not transit the customer's VNets.
      fr: |
        Le chemin Internet de RISE reste généralement dans le réseau virtuel SAP RISE et ne transite pas par les réseaux virtuels du client.
    d:
      en: |
        When internet access is enabled, SAP protects it with services such as Application Gateway with WAF that SAP manages in the RISE VNet and subscription.
      fr: |
        Lorsque l'accès Internet est activé, SAP le protège avec des services comme Application Gateway avec WAF, que SAP gère dans le réseau virtuel et l'abonnement RISE.
    e:
      en: |
        A NAT gateway provides outbound connectivity only, and RISE internet traffic is handled inside the RISE VNet by SAP.
      fr: |
        Une passerelle NAT ne fournit que la connectivité sortante, et le trafic Internet de RISE est géré par SAP dans le réseau virtuel RISE.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
