id: az120-1b-lsm-two-step
objective: "1.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders runs SAP ECC 6.0 EHP7 on Windows Server with SQL Server in its datacenter. The database is 12 TB. Northwind wants to run the system on SAP HANA in Azure.

    The requirements are:

    - The datacenter must be vacated within four months.
    - Performance of the system in Azure must be validated before any database conversion, so that a performance problem can be attributed either to the new infrastructure or to HANA.
    - The business accepts two separate downtime windows.

    Which migration approach should you recommend?
  fr: |
    Northwind Traders exécute SAP ECC 6.0 EHP7 sur Windows Server avec SQL Server dans son centre de données. La base de données fait 12 To. Northwind veut exécuter le système sur SAP HANA dans Azure.

    Les exigences sont les suivantes :

    - Le centre de données doit être libéré dans les quatre mois.
    - Les performances du système dans Azure doivent être validées avant toute conversion de la base de données, afin qu'un problème de performances puisse être attribué soit à la nouvelle infrastructure, soit à HANA.
    - L'entreprise accepte deux fenêtres de temps d'arrêt distinctes.

    Quelle approche de migration devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Downtime-optimized DMO combined with DMO with System Move to SAP HANA in Azure", fr: "DMO optimisé pour le temps d'arrêt combiné à DMO with System Move vers SAP HANA dans Azure" } }
    - { id: b, text: { en: "DMO with System Move from the datacenter directly to SAP HANA in Azure", fr: "DMO with System Move depuis le centre de données directement vers SAP HANA dans Azure" } }
    - { id: c, text: { en: "A lift and shift to SQL Server in Azure, followed later by DMO to SAP HANA in Azure", fr: "Un lift-and-shift vers SQL Server dans Azure, suivi plus tard de DMO vers SAP HANA dans Azure" } }
    - { id: d, text: { en: "A Near-Zero Downtime (NZDT) clone-based migration to SAP HANA in Azure", fr: "Une migration NZDT (Near-Zero Downtime) fondée sur un clone vers SAP HANA dans Azure" } }
answer: { optionId: c }
explanation:
  correct:
    en: The two-step approach first clones the system to Azure with a homogeneous copy and validates it, then runs DMO to SAP HANA in Azure. It costs two downtimes and two testing cycles, which the business accepts, and each change is validated on its own, so performance issues can be attributed to the right step.
    fr: L'approche en deux étapes clone d'abord le système dans Azure par copie homogène et le valide, puis exécute DMO vers SAP HANA dans Azure. Elle coûte deux temps d'arrêt et deux cycles de test, ce que l'entreprise accepte, et chaque changement est validé séparément ; un problème de performances peut donc être attribué à la bonne étape.
  options:
    b:
      en: DMO with System Move changes the infrastructure and the database in one downtime, so the system is never validated in Azure before the conversion.
      fr: DMO with System Move change l'infrastructure et la base de données en un seul temps d'arrêt ; le système n'est donc jamais validé dans Azure avant la conversion.
    a:
      en: Downtime-optimized DMO cannot be combined with DMO with System Move, and it also converts the database in the same step.
      fr: DMO optimisé pour le temps d'arrêt ne peut pas être combiné à DMO with System Move, et il convertit lui aussi la base de données dans la même étape.
    d:
      en: NZDT is not supported for migrations to the cloud, and it would also combine the move and the conversion.
      fr: NZDT n'est pas pris en charge pour les migrations vers le cloud, et il combinerait lui aussi le déplacement et la conversion.
