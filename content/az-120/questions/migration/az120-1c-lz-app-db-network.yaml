id: az120-1c-lz-app-db-network
objective: "1.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is designing the network of its SAP workload landing zones. SAP systems will run in West Europe and North Europe. Each region has a hub virtual network that contains Azure Firewall.

    The security team proposes several design choices.

    Which two design choices follow the SAP on Azure landing zone network guidance?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. conçoit le réseau de ses zones d'atterrissage de charge de travail SAP. Les systèmes SAP s'exécuteront dans les régions West Europe et North Europe. Chaque région dispose d'un réseau virtuel hub qui contient le Pare-feu Azure.

    L'équipe de sécurité propose plusieurs choix de conception.

    Quels sont les deux choix de conception conformes aux recommandations réseau de la zone d'atterrissage SAP sur Azure ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Route the traffic between the SAP application subnet and the database subnet through the Azure Firewall in the hub.", fr: "Faire passer le trafic entre le sous-réseau d'application SAP et le sous-réseau de base de données par le Pare-feu Azure du hub." }
    - id: b
      text: { en: "Place the SAP application servers and the database servers in the same virtual network, in separate subnets protected by NSGs and ASGs.", fr: "Placer les serveurs d'application SAP et les serveurs de base de données dans le même réseau virtuel, dans des sous-réseaux distincts protégés par des NSG et des ASG." }
    - id: c
      text: { en: "Host the database servers in a dedicated spoke virtual network that is peered with the application spoke.", fr: "Héberger les serveurs de base de données dans un réseau virtuel spoke dédié, relié au spoke d'application par peering." }
    - id: d
      text: { en: "Connect the SAP landing zones of the two regions by using global virtual network peering.", fr: "Relier les zones d'atterrissage SAP des deux régions en utilisant le peering de réseaux virtuels mondial." }
    - id: e
      text: { en: "Encrypt all SAP traffic over ExpressRoute private peering with IPsec, because ExpressRoute requires encryption.", fr: "Chiffrer avec IPsec tout le trafic SAP passant par le peering privé ExpressRoute, car ExpressRoute exige le chiffrement." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: The guidance keeps the SAP application and DBMS layers in the same virtual network and uses NSG and ASG rules as access-control lists between them. Local and global virtual network peering are the preferred ways to connect SAP landing zones across regions.
    fr: Les recommandations conservent les couches d'application SAP et de SGBD dans le même réseau virtuel et utilisent des règles NSG et ASG comme listes de contrôle d'accès entre elles. Le peering de réseaux virtuels local et mondial est la méthode privilégiée pour relier des zones d'atterrissage SAP entre régions.
  options:
    a:
      en: Network virtual appliances between the SAP application and the database server are not supported in either topology.
      fr: Les appliances virtuelles réseau entre l'application SAP et le serveur de base de données ne sont prises en charge dans aucune des deux topologies.
    c:
      en: Hosting the DBMS and application layers in different peered VNets is not recommended; the heavy traffic between the layers can create substantial peering costs.
      fr: Héberger les couches SGBD et application dans des réseaux virtuels différents reliés par peering est déconseillé ; le trafic important entre les couches peut entraîner des coûts de peering élevés.
    e:
      en: ExpressRoute private peering is not encrypted by default and encryption is not required for SAP; the customer decides, keeping in mind the performance cost of IPsec.
      fr: Le peering privé ExpressRoute n'est pas chiffré par défaut et le chiffrement n'est pas obligatoire pour SAP ; le client décide, en tenant compte du coût en performances d'IPsec.
references:
  - title: Network topology and connectivity for an SAP migration - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/sap/eslz-network-topology-and-connectivity
