id: az120-1a-cost-capres-dd
objective: "1.1.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin creates an on-demand capacity reservation for four Standard_M64ms_v2 VMs in availability zone 2 of the disaster recovery region of its SAP landscape. Two VMs run permanently as HANA System Replication targets; the two others will be deployed only during a disaster. Tailspin also owns reserved VM instances that match the VM size and region.

    You need to explain the cost implications of this design to the finance team.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin crée une réservation de capacité à la demande pour quatre machines virtuelles Standard_M64ms_v2 dans la zone de disponibilité 2 de la région de reprise d'activité de son paysage SAP. Deux machines virtuelles s'exécutent en permanence comme cibles de HANA System Replication ; les deux autres ne seront déployées qu'en cas de sinistre. Tailspin possède aussi des instances de machine virtuelle réservées qui correspondent à la taille et à la région des machines virtuelles.

    Vous devez expliquer les implications de coût de cette conception à l'équipe finance.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The two unused reserved capacity slots are billed [[unused]].

      The reserved VM instance discount [[ri]].
    fr: |
      Les deux emplacements de capacité réservée inutilisés sont facturés [[unused]].

      La remise des instances de machine virtuelle réservées [[ri]].
  slots:
    - id: unused
      options:
        - { id: free, text: { en: "only after a VM consumes them", fr: "seulement après qu'une machine virtuelle les a consommés" } }
        - { id: payg, text: { en: "at the pay-as-you-go rate of the VM size", fr: "au tarif de paiement à l'utilisation de la taille de machine virtuelle" } }
        - { id: half, text: { en: "at half the pay-as-you-go rate of the VM size", fr: "à la moitié du tarif de paiement à l'utilisation de la taille de machine virtuelle" } }
    - id: ri
      options:
        - { id: both, text: { en: "can apply to both the running VMs and the unused reserved capacity", fr: "peut s'appliquer à la fois aux machines virtuelles en cours d'exécution et à la capacité réservée inutilisée" } }
        - { id: vmonly, text: { en: "applies only to the running VMs that consume the capacity reservation", fr: "s'applique uniquement aux machines virtuelles en cours d'exécution qui consomment la réservation de capacité" } }
        - { id: never, text: { en: "can't be combined with a capacity reservation", fr: "ne peut pas être combinée avec une réservation de capacité" } }
answer:
  values: { unused: payg, ri: both }
explanation:
  correct:
    en: |
      Reserved capacity is billed at the pay-as-you-go rate of the VM size whether or not a VM uses it; when a VM consumes it, you pay once, not for both the slot and the VM. Reserved VM instances and savings plans apply to both used and unused capacity reservations, so the discount can land on the running VMs or on the unused slots.
    fr: |
      La capacité réservée est facturée au tarif de paiement à l'utilisation de la taille de machine virtuelle, qu'une machine virtuelle l'utilise ou non ; lorsqu'une machine virtuelle la consomme, vous payez une seule fois, pas l'emplacement et la machine virtuelle. Les instances de machine virtuelle réservées et les plans d'économies s'appliquent aux réservations de capacité utilisées comme inutilisées : la remise peut porter sur les machines virtuelles en cours d'exécution ou sur les emplacements inutilisés.
  options:
    free:
      en: |
        Unused reserved capacity is billed from the moment the reservation is created.
      fr: |
        La capacité réservée inutilisée est facturée dès la création de la réservation.
    vmonly:
      en: |
        The documentation states that reservation and savings plan discounts also apply to unused reserved capacity.
      fr: |
        La documentation indique que les remises des réservations et des plans d'économies s'appliquent aussi à la capacité réservée inutilisée.
references:
  - title: On-demand capacity reservation
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/capacity-reservation-overview
