id: az120-1b-tool-vldb-downtime
objective: "1.1.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank plans a heterogeneous migration of a 35-TB SAP ERP database from Oracle on AIX to SQL Server on Windows Server in Azure. The migration uses R3load and the Migration Monitor. Downtime must be minimized.

    Which two actions should you include in the migration design?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit une migration hétérogène d'une base de données SAP ERP de 35 To, d'Oracle sur AIX vers SQL Server sur Windows Server dans Azure. La migration utilise R3load et Migration Monitor. Le temps d'arrêt doit être réduit au minimum.

    Quelles sont les deux actions à inclure dans la conception de la migration ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run the R3load export processes on dedicated x86 Intel servers instead of the AIX database server.", fr: "Exécuter les processus d'export R3load sur des serveurs Intel x86 dédiés plutôt que sur le serveur de base de données AIX." } }
    - { id: b, text: { en: "Use the SAP application server VMs in Azure as the R3load import servers.", fr: "Utiliser les machines virtuelles des serveurs d'applications SAP dans Azure comme serveurs d'import R3load." } }
    - { id: c, text: { en: "Enable Accelerated Networking on the target database server and on the R3load import servers.", fr: "Activer Accelerated Networking sur le serveur de base de données cible et sur les serveurs d'import R3load." } }
    - { id: d, text: { en: "Keep the SQL Server transaction log on the local temporary SSD after go-live.", fr: "Conserver le journal des transactions SQL Server sur le SSD temporaire local après la mise en production." } }
    - { id: e, text: { en: "Split every large table into as many export packages as possible.", fr: "Fractionner chaque grande table en autant de paquets d'export que possible." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Export performance often gates downtime, and the thread performance of UNIX servers is much lower than that of modern Intel servers, so R3load runs on separate x86 servers. On the target, Accelerated Networking is mandatory for the database and R3load servers.
    fr: Les performances de l'export conditionnent souvent le temps d'arrêt, et les performances par thread des serveurs UNIX sont bien inférieures à celles des serveurs Intel modernes ; R3load s'exécute donc sur des serveurs x86 distincts. Sur la cible, Accelerated Networking est obligatoire pour les serveurs de base de données et R3load.
  options:
    b: { en: "Dedicated import R3load servers are recommended; the SAP application servers should not be used for this task.", fr: "Des serveurs d'import R3load dédiés sont recommandés ; les serveurs d'applications SAP ne doivent pas être utilisés pour cette tâche." }
    d: { en: "The local SSD speeds up log writes during the import only; after the migration, the log must move to a persisted disk.", fr: "Le SSD local accélère les écritures du journal pendant l'import uniquement ; après la migration, le journal doit passer sur un disque persistant." }
    e: { en: "Too many splits can drastically increase import time; the effect of each split must be measured and tested.", fr: "Un trop grand nombre de fractionnements peut augmenter fortement la durée de l'import ; l'effet de chaque fractionnement doit être mesuré et testé." }
references:
