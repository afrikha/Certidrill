id: az120-cs2a-dmo-move
objective: "1.1.9"
type: single
caseStudy: az120-cs2a-proseware
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a migration approach for PE1. The solution must meet the migration requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une approche de migration pour PE1. La solution doit respecter les exigences de migration.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A homogeneous system copy of PE1 to Azure on Oracle, followed by DMO on Azure", fr: "Une copie système homogène de PE1 vers Azure sur Oracle, suivie de DMO sur Azure" } }
    - { id: b, text: { en: "DMO with System Move in the Sequential Data Transfer mode", fr: "DMO avec System Move en mode Sequential Data Transfer" } }
    - { id: c, text: { en: "DMO with System Move in the Parallel Data Transfer mode", fr: "DMO avec System Move en mode Parallel Data Transfer" } }
    - { id: d, text: { en: "HANA System Replication from PE1 to the HANA VMs on Azure", fr: "La réplication système HANA de PE1 vers les machines virtuelles HANA sur Azure" } }
answer: { optionId: c }
explanation:
  correct:
    en: DMO with System Move migrates the database to SAP HANA and moves the system to Azure in one step, so only one downtime is needed and no intermediate Oracle system is built on Azure. In the Parallel Data Transfer mode, each export file is sent to Azure as soon as it is complete (dmotocloud.sh), so export, transfer and import overlap and the downtime is shorter.
    fr: |
      DMO avec System Move migre la base de données vers SAP HANA et déplace le système vers Azure en une seule étape, avec une seule interruption et sans système Oracle intermédiaire sur Azure. En mode Parallel Data Transfer, chaque fichier d'export est envoyé vers Azure dès qu'il est terminé (dmotocloud.sh) : l'export, le transfert et l'import se chevauchent et l'interruption est plus courte.
  options:
    a: { en: "This is the two-step approach (lift and shift followed by DMO): it builds an Oracle copy on Azure and needs two downtimes and two test cycles.", fr: "C'est l'approche en deux étapes (lift-and-shift suivi de DMO) : elle crée une copie Oracle sur Azure et impose deux interruptions et deux cycles de test." }
    b: { en: "The sequential mode exports all tables first and transfers the whole SUM directory afterwards, so the downtime is longer than in the parallel mode.", fr: "Le mode séquentiel exporte d'abord toutes les tables puis transfère tout le répertoire SUM, ce qui allonge l'interruption par rapport au mode parallèle." }
    d: { en: "HANA System Replication only replicates between HANA databases; PE1 runs on Oracle Database.", fr: "La réplication système HANA ne fonctionne qu'entre bases HANA ; PE1 s'exécute sur Oracle Database." }
references:
  - title: Explore one-step migration - DMO with system move option
    url: https://learn.microsoft.com/en-us/training/modules/explore-migration-options/6-explore-one-step-migration-database-move-only-option-system-move-option
  - title: Explore two-step migration - lift and shift followed by DMO
    url: https://learn.microsoft.com/en-us/training/modules/explore-migration-options/7-explore-two-step-migration-lift-shift-followed-database-move-only
