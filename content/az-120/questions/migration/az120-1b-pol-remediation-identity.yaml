id: az120-1b-pol-remediation-identity
objective: "1.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. uses an automation script based on the Azure SDK to assign a custom policy definition with the modify effect to a subscription named **Sub-SAP-Dev**. The policy definition lists the required roles in roleDefinitionIds. The script creates the assignment with a system-assigned managed identity but creates no role assignment.

    The compliance results show 240 existing SAP resources as noncompliant. You need to bring the existing resources into compliance.

    Which two actions should you perform?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. utilise un script d'automatisation fondé sur le SDK Azure pour attribuer une définition de stratégie personnalisée avec l'effet modify à un abonnement nommé **Sub-SAP-Dev**. La définition de stratégie liste les rôles nécessaires dans roleDefinitionIds. Le script crée l'attribution avec une identité managée affectée par le système, mais ne crée aucune attribution de rôle.

    Les résultats de conformité indiquent que 240 ressources SAP existantes sont non conformes. Vous devez mettre en conformité les ressources existantes.

    Quelles sont les deux actions à effectuer ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Grant the assignment's managed identity the roles listed in roleDefinitionIds.", fr: "Accorder à l'identité managée de l'attribution les rôles listés dans roleDefinitionIds." } }
    - { id: b, text: { en: "Create a remediation task for the policy assignment.", fr: "Créer une tâche de correction pour l'attribution de stratégie." } }
    - { id: c, text: { en: "Change the effect of the policy definition to deny.", fr: "Changer l'effet de la définition de stratégie en deny." } }
    - { id: d, text: { en: "Start an on-demand compliance evaluation scan.", fr: "Lancer une analyse d'évaluation de conformité à la demande." } }
    - { id: e, text: { en: "Create a policy exemption for the noncompliant resources.", fr: "Créer une exemption de stratégie pour les ressources non conformes." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: Existing resources are fixed by a remediation task, which performs the modify operations with the assignment's managed identity. The portal grants the roles automatically, but for an assignment created with an SDK you must grant the roles of roleDefinitionIds to the identity yourself; otherwise the remediation fails.
    fr: Les ressources existantes sont corrigées par une tâche de correction, qui effectue les opérations modify avec l'identité managée de l'attribution. Le portail accorde les rôles automatiquement, mais pour une attribution créée avec un SDK, vous devez accorder vous-même à l'identité les rôles de roleDefinitionIds ; sinon la correction échoue.
  options:
    c: { en: "Deny blocks new noncompliant requests but never fixes existing resources.", fr: "Deny bloque les nouvelles demandes non conformes mais ne corrige jamais les ressources existantes." }
    d: { en: "A scan only re-evaluates compliance; the resources stay unchanged.", fr: "Une analyse ne fait que réévaluer la conformité ; les ressources restent inchangées." }
    e: { en: "An exemption hides the resources from the policy instead of bringing them into compliance.", fr: "Une exemption soustrait les ressources à la stratégie au lieu de les mettre en conformité." }
references:
  - title: Remediate non-compliant resources with Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
