id: az120-1a-size-hana-shared-dd
objective: "1.1.1"
type: dropdown
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Tailspin plans two SAP HANA systems on Azure virtual machines:

    | System | Deployment | VM type | Memory per VM |
    | --- | --- | --- | --- |
    | HP1 | Scale-up, one VM | Standard_M128ms | 3,892 GiB |
    | BW1 | Scale-out, eight worker nodes, no standby node | Certified M-series VM | 2,048 GiB |

    You need to size the **/hana/shared** volume of each system by following the SAP sizing guideline that Microsoft documents for Azure.

    What size should you plan for each system? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin prévoit deux systèmes SAP HANA sur des machines virtuelles Azure :

    | Système | Déploiement | Type de machine virtuelle | Mémoire par machine virtuelle |
    | --- | --- | --- | --- |
    | HP1 | Scale-up, une machine virtuelle | Standard_M128ms | 3 892 Gio |
    | BW1 | Scale-out, huit nœuds worker, sans nœud de secours | Machine virtuelle de série M certifiée | 2 048 Gio |

    Vous devez dimensionner le volume **/hana/shared** de chaque système en suivant la règle de dimensionnement SAP que Microsoft documente pour Azure.

    Quelle taille devez-vous prévoir pour chaque système ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      /hana/shared for HP1: [[hp1]]

      /hana/shared for BW1: [[bw1]]
    fr: |
      /hana/shared pour HP1 : [[hp1]]

      /hana/shared pour BW1 : [[bw1]]
  slots:
    - id: hp1
      options:
        - { id: s512, text: { en: "512 GiB", fr: "512 Gio" } }
        - { id: s1t, text: { en: "1 TiB", fr: "1 Tio" } }
        - { id: s2t, text: { en: "2 TiB", fr: "2 Tio" } }
        - { id: ram, text: { en: "3,892 GiB", fr: "3 892 Gio" } }
    - id: bw1
      options:
        - { id: s1t, text: { en: "1 TiB", fr: "1 Tio" } }
        - { id: s2t, text: { en: "2 TiB", fr: "2 Tio" } }
        - { id: s4t, text: { en: "4 TiB", fr: "4 Tio" } }
        - { id: s16t, text: { en: "16 TiB", fr: "16 Tio" } }
answer:
  values: { hp1: s1t, bw1: s4t }
explanation:
  correct:
    en: |
      For a scale-up system, the guideline is Min(1 TB, 1 x RAM): with 3,892 GiB of memory, the cap of 1 TB applies. For a scale-out system, plan the memory of one worker node for every four worker nodes: eight workers of 2,048 GiB give 2 x 2 TiB = 4 TiB. An undersized /hana/shared can saturate I/O and, in clustered setups, trigger unnecessary failovers.
    fr: |
      Pour un système scale-up, la règle est Min(1 To, 1 x RAM) : avec 3 892 Gio de mémoire, le plafond de 1 To s'applique. Pour un système scale-out, prévoyez la mémoire d'un nœud worker pour quatre nœuds worker : huit workers de 2 048 Gio donnent 2 x 2 Tio = 4 Tio. Un volume /hana/shared sous-dimensionné peut saturer les E/S et, dans une configuration en cluster, provoquer des basculements inutiles.
  options:
    ram:
      en: |
        For HP1, sizing /hana/shared at the full memory size ignores the 1 TB cap of the scale-up rule.
      fr: |
        Pour HP1, dimensionner /hana/shared à la taille totale de la mémoire ignore le plafond de 1 To de la règle scale-up.
    s16t:
      en: |
        16 TiB is the total memory of the eight workers; the rule is one worker's memory per four workers.
      fr: |
        16 Tio correspondent à la mémoire totale des huit workers ; la règle est la mémoire d'un worker pour quatre workers.
references:
  - title: SAP HANA Azure virtual machine storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-storage
