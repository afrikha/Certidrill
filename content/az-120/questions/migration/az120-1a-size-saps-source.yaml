id: az120-1a-size-saps-source
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are sizing the application servers of an SAP NetWeaver system that will run on SUSE Linux Enterprise Server with SAP ASE on Azure virtual machines. The sizing exercise produced a SAPS requirement for each application server.

    You need to find the SAPS rating of each SAP-supported Azure VM type so that you can select the VM type.

    Where should you look?
  fr: |
    Vous dimensionnez les serveurs d'applications d'un système SAP NetWeaver qui s'exécutera sous SUSE Linux Enterprise Server avec SAP ASE sur des machines virtuelles Azure. L'exercice de dimensionnement a produit un besoin en SAPS pour chaque serveur d'applications.

    Vous devez trouver la valeur SAPS de chaque type de machine virtuelle Azure pris en charge par SAP afin de choisir le type de machine virtuelle.

    Où devez-vous chercher ?
body:
  options:
    - { id: a, text: { en: "SAP Note 1928533", fr: "La note SAP 1928533" } }
    - { id: b, text: { en: "SAP Note 2015553", fr: "La note SAP 2015553" } }
    - { id: c, text: { en: "SAP Note 2235581", fr: "La note SAP 2235581" } }
    - { id: d, text: { en: "The SAP Product Availability Matrix (PAM)", fr: "La matrice de disponibilité des produits SAP (PAM)" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      SAP Note 1928533 (SAP Applications on Azure - supported products and sizing) lists the Azure VM types supported for SAP NetWeaver-based applications, with their SAPS throughput and limitations.
    fr: |
      La note SAP 1928533 (applications SAP sur Azure - produits pris en charge et dimensionnement) liste les types de machines virtuelles Azure pris en charge pour les applications basées sur SAP NetWeaver, avec leur débit en SAPS et leurs limites.
  options:
    b:
      en: |
        SAP Note 2015553 describes the support prerequisites (support contract, storage, networking, monitoring), not VM throughput.
      fr: |
        La note SAP 2015553 décrit les prérequis de support (contrat de support, stockage, réseau, supervision), pas le débit des machines virtuelles.
    c:
      en: |
        SAP Note 2235581 lists the SAP HANA releases supported with each operating system release.
      fr: |
        La note SAP 2235581 liste les versions de SAP HANA prises en charge pour chaque version de système d'exploitation.
    d:
      en: |
        The PAM shows which operating system and DBMS releases an SAP product supports; it doesn't rate Azure VM types.
      fr: |
        La PAM indique les versions de système d'exploitation et de SGBD prises en charge par un produit SAP ; elle ne donne pas de valeur pour les types de machines virtuelles Azure.
references:
  - title: What SAP software is supported for Azure deployments
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/supported-product-on-azure
