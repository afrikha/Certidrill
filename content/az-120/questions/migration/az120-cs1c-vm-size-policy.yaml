id: az120-cs1c-vm-size-policy
objective: "1.2.2"
type: single
caseStudy: az120-cs1c-tailspin-toys
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the governance requirement for the SAP subscriptions.

    What should you do?
  fr: |
    Vous devez satisfaire l'exigence de gouvernance pour les abonnements SAP.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Allowed virtual machine size SKUs policy to the SAP management group", fr: "Affecter la stratégie Allowed virtual machine size SKUs au groupe d'administration SAP" } }
    - { id: b, text: { en: "Assign the Allowed virtual machine size SKUs policy to Sub-SAP-PRD and Sub-SAP-NPRD", fr: "Affecter la stratégie Allowed virtual machine size SKUs à Sub-SAP-PRD et Sub-SAP-NPRD" } }
    - { id: c, text: { en: "Assign a custom role with NotActions for unapproved sizes to the SAP project leads", fr: "Attribuer aux chefs de projet SAP un rôle personnalisé avec des NotActions pour les tailles non approuvées" } }
    - { id: d, text: { en: "Apply a ReadOnly lock to the compute resource groups of the SAP subscriptions", fr: "Appliquer un verrou ReadOnly aux groupes de ressources de calcul des abonnements SAP" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The built-in Allowed virtual machine size SKUs policy denies the deployment of any size outside the approved list. Assigned to the SAP management group, it is inherited by every current and future subscription in that group, and subscription owners can't alter a policy assigned at a management group.
    fr: |
      La stratégie intégrée Allowed virtual machine size SKUs refuse le déploiement de toute taille absente de la liste approuvée. Affectée au groupe d'administration SAP, elle est héritée par tous les abonnements actuels et futurs de ce groupe, et les propriétaires d'abonnement ne peuvent pas modifier une stratégie affectée à un groupe d'administration.
  options:
    b:
      en: |
        Assignments on the two subscriptions don't cover future SAP subscriptions, and the subscription owners could delete assignments at their own scope.
      fr: |
        Des affectations sur les deux abonnements ne couvrent pas les futurs abonnements SAP, et les propriétaires d'abonnement pourraient supprimer les affectations de leur propre étendue.
    c:
      en: |
        Azure RBAC permissions apply to operations such as writing a VM; they can't filter the values of a property such as the VM size. The project leads also own the subscriptions.
      fr: |
        Les autorisations Azure RBAC s'appliquent à des opérations comme l'écriture d'une machine virtuelle ; elles ne peuvent pas filtrer les valeurs d'une propriété comme la taille de la machine virtuelle. Les chefs de projet sont en outre propriétaires des abonnements.
    d:
      en: |
        A ReadOnly lock blocks all changes, including approved deployments, and an owner can remove it.
      fr: |
        Un verrou ReadOnly bloque toutes les modifications, y compris les déploiements approuvés, et un propriétaire peut le supprimer.
references:
  - title: Azure Policy built-in definitions for Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/policy-reference
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
