id: az120-1a-supp-prereqs
objective: "1.1.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware plans to run its production SAP S/4HANA system on Azure virtual machines with SUSE Linux Enterprise Server. Litware wants to be sure that SAP and Microsoft will support the system when an incident occurs.

    Which three requirements must Litware meet?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit d'exécuter son système SAP S/4HANA de production sur des machines virtuelles Azure avec SUSE Linux Enterprise Server. Litware veut s'assurer que SAP et Microsoft prendront en charge le système en cas d'incident.

    Quelles sont les trois exigences que Litware doit respecter ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "A Microsoft support contract at the Professional Direct level or higher", fr: "Un contrat de support Microsoft de niveau Professional Direct ou supérieur" } }
    - { id: b, text: { en: "Support for the Linux distribution that meets SAP's requirements", fr: "Un support de la distribution Linux qui respecte les exigences de SAP" } }
    - { id: c, text: { en: "The Azure VM extension for SAP solutions on every SAP VM", fr: "L'extension de machine virtuelle Azure pour les solutions SAP sur chaque machine virtuelle SAP" } }
    - { id: d, text: { en: "A Developer support plan on the production subscription", fr: "Un plan de support Developer sur l'abonnement de production" } }
    - { id: e, text: { en: "Microsoft Entra join for every SAP VM", fr: "La jonction Microsoft Entra pour chaque machine virtuelle SAP" } }
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: |
      SAP Note 2015553 requires a support contract with Microsoft, for which Professional Direct is the documented minimum. On Linux, customers must also meet SAP's support requirements for the distribution. The Azure VM extension for SAP solutions is required for support on every Azure VM that runs an SAP workload.
    fr: |
      La note SAP 2015553 exige un contrat de support avec Microsoft, pour lequel Professional Direct est le minimum documenté. Sous Linux, les clients doivent aussi respecter les exigences de support de SAP pour la distribution. L'extension de machine virtuelle Azure pour les solutions SAP est requise pour le support sur chaque machine virtuelle Azure qui exécute une charge de travail SAP.
  options:
    d:
      en: |
        Developer is a business-hours, non-production plan and is below the documented minimum for SAP.
      fr: |
        Developer est un plan aux heures ouvrées destiné au hors production, en dessous du minimum documenté pour SAP.
    e:
      en: |
        Microsoft Entra join isn't a support prerequisite, and Linux SAP VMs aren't joined to Microsoft Entra ID for SAP support.
      fr: |
        La jonction Microsoft Entra n'est pas un prérequis de support, et les machines virtuelles SAP Linux ne sont pas jointes à Microsoft Entra ID pour le support SAP.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
  - title: Explore licensing, pricing, and support of Azure for SAP workloads
    url: https://learn.microsoft.com/en-us/training/modules/explore-licensing-pricing-support/3-explore-licensing-pricing-support-azure-for-sap-workloads
