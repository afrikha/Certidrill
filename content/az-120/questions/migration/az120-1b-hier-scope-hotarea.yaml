id: az120-1b-hier-scope-hotarea
objective: "1.2.5"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has the Azure resource hierarchy shown in the following table. Corp contains the workloads that use hybrid connectivity through the hub, and Online contains internet-facing workloads.

    Answer each prompt by selecting the scope where you should make the assignment. Each assignment must follow Microsoft's landing zone recommendations.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose de la hiérarchie de ressources Azure présentée dans le tableau suivant. Corp contient les charges de travail qui utilisent la connectivité hybride par le hub, et Online les charges de travail exposées à Internet.

    Répondez à chaque consigne en sélectionnant l'étendue où vous devez effectuer l'attribution. Chaque attribution doit suivre les recommandations de Microsoft pour les zones d'atterrissage.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Assign an Azure Policy initiative that must apply to every current and future workload subscription that uses hybrid connectivity, but not to the platform, internet-facing or sandbox subscriptions.", fr: "Attribuer une initiative Azure Policy qui doit s'appliquer à tous les abonnements de charge de travail actuels et futurs qui utilisent la connectivité hybride, mais pas aux abonnements de plateforme, exposés à Internet ou de bac à sable." }
    - id: p2
      text: { en: "Assign the Virtual Machine Contributor role to the SAP Basis team for the non-production SAP systems only.", fr: "Attribuer le rôle Virtual Machine Contributor à l'équipe SAP Basis pour les seuls systèmes SAP hors production." }
  grid:
    header: [{ en: Scope, fr: Étendue }, { en: Type, fr: Type }, { en: Parent, fr: Parent }]
    rows:
      - [{ text: { en: "Tenant root group", fr: "Groupe racine du locataire" }, area: root }, { text: { en: "Management group", fr: "Groupe d'administration" } }, { text: "-" }]
      - [{ text: Platform, area: platform }, { text: { en: "Management group", fr: "Groupe d'administration" } }, { text: { en: "Tenant root group", fr: "Groupe racine du locataire" } }]
      - [{ text: sub-connectivity, area: conn }, { text: { en: "Subscription", fr: "Abonnement" } }, { text: Platform }]
      - [{ text: Landing zones, area: lz }, { text: { en: "Management group", fr: "Groupe d'administration" } }, { text: { en: "Tenant root group", fr: "Groupe racine du locataire" } }]
      - [{ text: Corp, area: corp }, { text: { en: "Management group", fr: "Groupe d'administration" } }, { text: Landing zones }]
      - [{ text: sub-sap-prod, area: prod }, { text: { en: "Subscription", fr: "Abonnement" } }, { text: Corp }]
      - [{ text: sub-sap-nonprod, area: nonprod }, { text: { en: "Subscription", fr: "Abonnement" } }, { text: Corp }]
      - [{ text: Online, area: online }, { text: { en: "Management group", fr: "Groupe d'administration" } }, { text: Landing zones }]
      - [{ text: sub-web-portal, area: web }, { text: { en: "Subscription", fr: "Abonnement" } }, { text: Online }]
      - [{ text: Sandbox, area: sandbox }, { text: { en: "Management group", fr: "Groupe d'administration" } }, { text: { en: "Tenant root group", fr: "Groupe racine du locataire" } }]
answer:
  values: { p1: corp, p2: nonprod }
explanation:
  correct:
    en: Policies shared by all the subscriptions of a management group are assigned at that management group, and they also apply to subscriptions added later; Corp covers exactly the hybrid workloads, whereas Landing zones would include Online. Workload teams should receive roles at the subscription or resource group level rather than at management group scope, so the Basis team's role is assigned on sub-sap-nonprod.
    fr: Les stratégies communes à tous les abonnements d'un groupe d'administration sont attribuées sur ce groupe d'administration, et elles s'appliquent aussi aux abonnements ajoutés ultérieurement ; Corp couvre exactement les charges de travail hybrides, alors que Landing zones inclurait Online. Les équipes de charge de travail doivent recevoir leurs rôles au niveau de l'abonnement ou du groupe de ressources plutôt qu'à l'étendue d'un groupe d'administration ; le rôle de l'équipe Basis est donc attribué sur sub-sap-nonprod.
references:
  - title: Management groups
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups
