id: az120-1c-rise-net-options-dragdrop
objective: "1.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Three companies are moving SAP systems to RISE with SAP on Azure. Each company has a different connectivity requirement.

    Which connectivity option should you recommend for each company? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Trois entreprises migrent des systèmes SAP vers RISE with SAP sur Azure. Chaque entreprise a une exigence de connectivité différente.

    Quelle option de connectivité devez-vous recommander pour chaque entreprise ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vpn, text: { en: "VNet-to-VNet VPN connection", fr: "Connexion VPN de réseau virtuel à réseau virtuel" } }
    - { id: fwaas, text: { en: "Subnet peering with the SAP Firewall as a Service", fr: "Peering de sous-réseaux avec le Firewall as a Service de SAP" } }
    - { id: vwan, text: { en: "RISE virtual network as a spoke of a Virtual WAN hub", fr: "Réseau virtuel RISE en tant que spoke d'un hub Virtual WAN" } }
    - { id: pe, text: { en: "Private endpoints to the RISE systems", fr: "Points de terminaison privés vers les systèmes RISE" } }
  targets:
    - id: t1
      text: { en: "Adatum: a central network team wants a single gateway to be the only point of entry into the Adatum network.", fr: "Adatum : une équipe réseau centrale veut qu'une passerelle unique soit le seul point d'entrée dans le réseau d'Adatum." }
    - id: t2
      text: { en: "Proseware: SAP must manage firewall macro-segmentation between the RISE tiers, and only one Proseware subnet communicates with RISE.", fr: "Proseware : SAP doit gérer une macro-segmentation par pare-feu entre les niveaux RISE, et un seul sous-réseau de Proseware communique avec RISE." }
    - id: t3
      text: { en: "Wingtip: all Azure regions and branch offices already connect through a customer-managed Virtual WAN.", fr: "Wingtip : toutes les régions Azure et agences sont déjà connectées par un Virtual WAN géré par le client." }
answer:
  mapping: { t1: vpn, t2: fwaas, t3: vwan }
explanation:
  correct:
    en: |
      With a VNet-to-VNet VPN, the VPN gateway is the only point of entry into the customer's network and is managed by a central team. The optional SAP Firewall as a Service segments RISE into tiers and connects through subnet peering between one RISE subnet and one customer subnet. With Virtual WAN, the RISE VNet becomes a spoke of the customer-managed hub, by peering or VPN.
    fr: |
      Avec un VPN de réseau virtuel à réseau virtuel, la passerelle VPN est le seul point d'entrée dans le réseau du client et elle est gérée par une équipe centrale. Le Firewall as a Service optionnel de SAP segmente RISE en niveaux et se connecte par un peering de sous-réseaux entre un sous-réseau RISE et un sous-réseau du client. Avec Virtual WAN, le réseau virtuel RISE devient un spoke du hub géré par le client, par peering ou VPN.
  options:
    pe:
      en: |
        SAP generally does not offer private endpoints to RISE workloads for customers.
      fr: |
        SAP ne propose généralement pas de points de terminaison privés vers les charges de travail RISE pour les clients.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
