id: az120-1a-sup-two-tier-hana
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans a small production SAP S/4HANA system on Azure virtual machines running SUSE Linux Enterprise Server. To reduce costs, the project manager proposes to install the SAP HANA database and all the SAP application instances on a single VM.

    The design must be supported by SAP and Microsoft for production use.

    What should you recommend?
  fr: |
    Contoso prévoit un petit système SAP S/4HANA de production sur des machines virtuelles Azure exécutant SUSE Linux Enterprise Server. Pour réduire les coûts, le chef de projet propose d'installer la base de données SAP HANA et toutes les instances d'application SAP sur une seule machine virtuelle.

    La conception doit être prise en charge par SAP et Microsoft pour une utilisation en production.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Keep the single VM and cap the memory used by SAP HANA", fr: "Conserver la machine virtuelle unique et limiter la mémoire utilisée par SAP HANA" } }
    - { id: b, text: { en: "Keep the single VM and protect it by using Azure Site Recovery", fr: "Conserver la machine virtuelle unique et la protéger avec Azure Site Recovery" } }
    - { id: c, text: { en: "Deploy SAP HANA and the application instances on separate VMs", fr: "Déployer SAP HANA et les instances d'application sur des machines virtuelles distinctes" } }
    - { id: d, text: { en: "Deploy the system on a single SAP HANA Large Instances unit", fr: "Déployer le système sur une seule unité SAP HANA (grandes instances)" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A 2-tier configuration, with the DBMS and the SAP application on one VM, is supported with SAP HANA only for non-production systems. For production, use a 3-tier configuration with the HANA database and the application layer on separate VMs.
    fr: |
      Une configuration à 2 niveaux, avec le SGBD et l'application SAP sur une seule machine virtuelle, n'est prise en charge avec SAP HANA que pour les systèmes hors production. En production, utilisez une configuration à 3 niveaux avec la base de données HANA et la couche application sur des machines virtuelles distinctes.
  options:
    a:
      en: |
        Capping memory is a requirement of 2-tier setups, but it doesn't make a 2-tier SAP HANA system supported for production.
      fr: |
        Limiter la mémoire est une exigence des configurations à 2 niveaux, mais cela ne rend pas un système SAP HANA à 2 niveaux pris en charge en production.
    b:
      en: |
        Site Recovery isn't supported for DBMS VMs, and it wouldn't change the 2-tier restriction.
      fr: |
        Site Recovery n'est pas pris en charge pour les machines virtuelles de SGBD, et il ne changerait rien à la restriction des configurations à 2 niveaux.
    d:
      en: |
        HANA Large Instances is in sunset mode and doesn't accept new customers.
      fr: |
        HANA (grandes instances) est en fin de commercialisation et n'accepte pas de nouveaux clients.
references:
  - title: SAP workload on Azure virtual machine supported scenarios
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-supported-configurations
