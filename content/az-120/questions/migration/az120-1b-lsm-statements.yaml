id: az120-1b-lsm-statements
objective: "1.1.8"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. is comparing migration approaches for the SAP systems that it plans to move from its datacenter to Azure.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. compare les approches de migration des systèmes SAP qu'elle prévoit de déplacer de son centre de données vers Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: For a lift and shift of an SAP system that runs on SQL Server, the copy in Azure can be built by using DBMS replication such as SQL Server Always On.
        fr: Pour un lift-and-shift d'un système SAP qui s'exécute sur SQL Server, la copie dans Azure peut être construite à l'aide d'une réplication du SGBD telle que SQL Server Always On.
    - id: s2
      text:
        en: An SAP system on Solaris on SPARC servers can be moved to Linux virtual machines in Azure with a homogeneous system copy if it keeps its Oracle database.
        fr: Un système SAP sur Solaris, sur des serveurs SPARC, peut être déplacé vers des machines virtuelles Linux dans Azure par copie système homogène s'il conserve sa base de données Oracle.
    - id: s3
      text:
        en: A two-step migration, a lift and shift followed by DMO to SAP HANA in Azure, requires two downtimes and two testing cycles.
        fr: Une migration en deux étapes, un lift-and-shift suivi de DMO vers SAP HANA dans Azure, exige deux temps d'arrêt et deux cycles de test.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: In a lift and shift, the cloned system is built with a homogeneous system copy (backup and restore) or with DBMS replication tools such as Oracle Data Guard or SQL Server Always On. A homogeneous copy requires the same DBMS and the same processor architecture; SPARC is big-endian and Azure x86 virtual machines are little-endian, so a heterogeneous copy is needed even with Oracle kept. The two-step approach clones the system first and runs DMO afterward, hence two downtimes and two testing cycles.
    fr: "Dans un lift-and-shift, le système cloné est construit par copie système homogène (sauvegarde et restauration) ou avec des outils de réplication du SGBD tels qu'Oracle Data Guard ou SQL Server Always On. Une copie homogène exige le même SGBD et la même architecture de processeur ; SPARC est big-endian et les machines virtuelles x86 d'Azure sont little-endian : une copie hétérogène est nécessaire même en conservant Oracle. L'approche en deux étapes clone d'abord le système puis exécute DMO, d'où deux temps d'arrêt et deux cycles de test."
references:
  - title: Explore two-step migration - lift and shift followed by DMO
    url: https://learn.microsoft.com/en-us/training/modules/explore-migration-options/7-explore-two-step-migration-lift-shift-followed-database-move-only
  - title: Explore very large database migration
    url: https://learn.microsoft.com/en-us/training/modules/migrate-very-large-databases-to-azure/2-explore-very-large-database-migration
