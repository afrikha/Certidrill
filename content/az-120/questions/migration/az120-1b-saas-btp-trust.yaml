id: az120-1b-saas-btp-trust
objective: "1.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank federates SAP Cloud Identity Services - Identity Authentication (IAS) with Microsoft Entra ID and connects a new SAP BTP subaccount to IAS. The requirements are:

    - Users who sign in to a BTP application for the first time must get a BTP user automatically.
    - Microsoft Entra ID must authenticate all users of the IAS applications.
    - Users must not be able to sign in to the subaccount by using SAP ID Service.

    How should you configure the solution? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank fédère SAP Cloud Identity Services - Identity Authentication (IAS) avec Microsoft Entra ID et connecte un nouveau sous-compte SAP BTP à IAS. Les exigences sont les suivantes :

    - Les utilisateurs qui se connectent pour la première fois à une application BTP doivent obtenir automatiquement un utilisateur BTP.
    - Microsoft Entra ID doit authentifier tous les utilisateurs des applications IAS.
    - Les utilisateurs ne doivent pas pouvoir se connecter au sous-compte avec SAP ID Service.

    Comment devez-vous configurer la solution ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      BTP trust configuration toward IAS: enable Available for User Logon and [[shadow]]

      IAS Conditional Authentication, Default Authenticating Identity Provider: [[default]]

      Default SAP ID Service trust configuration in the subaccount: [[sapid]]
    fr: |
      Configuration d'approbation BTP vers IAS : activer Available for User Logon et [[shadow]]

      IAS Conditional Authentication, Default Authenticating Identity Provider : [[default]]

      Configuration d'approbation SAP ID Service par défaut du sous-compte : [[sapid]]
  slots:
    - id: shadow
      options:
        - { id: create, text: Create Shadow Users During Logon }
        - { id: store, text: Use Identity Authentication user store }
        - { id: assign, text: User assignment required }
    - id: default
      options:
        - { id: corp, text: { en: "the corporate identity provider for Microsoft Entra ID", fr: "le fournisseur d'identité d'entreprise pour Microsoft Entra ID" } }
        - { id: sapidsvc, text: SAP ID Service }
        - { id: local, text: { en: "Identity Authentication (local user store)", fr: "Identity Authentication (magasin d'utilisateurs local)" } }
    - id: sapid
      options:
        - { id: disable, text: { en: "disable Available for User Logon", fr: "désactiver Available for User Logon" } }
        - { id: shadowon, text: { en: "enable Create Shadow Users During Logon", fr: "activer Create Shadow Users During Logon" } }
        - { id: keep, text: { en: "keep the default settings", fr: "conserver les paramètres par défaut" } }
answer:
  values: { shadow: create, default: corp, sapid: disable }
explanation:
  correct:
    en: Create Shadow Users During Logon lets first-time users get a BTP user at sign-in; without it, only preprovisioned users can sign in. Setting the IAS Default Authenticating Identity Provider to the corporate identity provider for Microsoft Entra ID forwards authentication to Entra. Disabling Available for User Logon on the default SAP ID Service trust configuration makes users always go through Microsoft Entra ID.
    fr: Create Shadow Users During Logon permet aux nouveaux utilisateurs d'obtenir un utilisateur BTP à la connexion ; sans ce paramètre, seuls les utilisateurs préapprovisionnés peuvent se connecter. Définir le Default Authenticating Identity Provider d'IAS sur le fournisseur d'identité d'entreprise pour Microsoft Entra ID transfère l'authentification à Entra. Désactiver Available for User Logon sur la configuration d'approbation SAP ID Service par défaut oblige les utilisateurs à toujours passer par Microsoft Entra ID.
  options:
    store: { en: "This is a setting of the IAS corporate identity provider, and enabling it drops the Entra group claims.", fr: "C'est un paramètre du fournisseur d'identité d'entreprise d'IAS, et son activation supprime les revendications de groupe Entra." }
    assign: { en: "User assignment required is a property of the Microsoft Entra enterprise application, not of a BTP trust configuration.", fr: "User assignment required est une propriété de l'application d'entreprise Microsoft Entra, pas d'une configuration d'approbation BTP." }
    sapidsvc: { en: "SAP ID Service would authenticate users with SAP accounts instead of Microsoft Entra ID.", fr: "SAP ID Service authentifierait les utilisateurs avec des comptes SAP au lieu de Microsoft Entra ID." }
    local: { en: "The local IAS user store authenticates users with IAS passwords, not with Microsoft Entra ID.", fr: "Le magasin d'utilisateurs local d'IAS authentifie les utilisateurs avec des mots de passe IAS, pas avec Microsoft Entra ID." }
    shadowon: { en: "Creating shadow users on the SAP ID Service trust would still let users sign in through it.", fr: "Créer des utilisateurs fantômes sur l'approbation SAP ID Service laisserait les utilisateurs s'y connecter." }
    keep: { en: "By default the SAP ID Service trust stays available for user logon.", fr: "Par défaut, l'approbation SAP ID Service reste disponible pour la connexion des utilisateurs." }
references:
  - title: Scenario - Using Microsoft Entra ID to secure access to SAP platforms and applications
    url: https://learn.microsoft.com/en-us/entra/fundamentals/scenario-azure-first-sap-identity-integration
