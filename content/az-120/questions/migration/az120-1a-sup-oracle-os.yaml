id: az120-1a-sup-oracle-os
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip runs a Unicode SAP ERP 6.0 system with an Oracle Database on HP-UX servers. Wingtip plans to migrate the system to Azure virtual machines. Company policy requires all the SAP servers in Azure to run Linux.

    You need to recommend the operating system for the database VM and for the ABAP application server VMs. The solution must be supported by SAP.

    What should you recommend?
  fr: |
    Wingtip exécute un système SAP ERP 6.0 Unicode avec une base de données Oracle sur des serveurs HP-UX. Wingtip prévoit de migrer le système vers des machines virtuelles Azure. La politique de l'entreprise impose que tous les serveurs SAP dans Azure s'exécutent sous Linux.

    Vous devez recommander le système d'exploitation de la machine virtuelle de base de données et des machines virtuelles des serveurs d'applications ABAP. La solution doit être prise en charge par SAP.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Red Hat Enterprise Linux for the database and the application servers", fr: "Red Hat Enterprise Linux pour la base de données et les serveurs d'applications" } }
    - { id: b, text: { en: "Oracle Linux for the database and the application servers", fr: "Oracle Linux pour la base de données et les serveurs d'applications" } }
    - { id: c, text: { en: "Oracle Linux for the database and SUSE Linux Enterprise Server for the application servers", fr: "Oracle Linux pour la base de données et SUSE Linux Enterprise Server pour les serveurs d'applications" } }
    - { id: d, text: { en: "SUSE Linux Enterprise Server for the database and the application servers", fr: "SUSE Linux Enterprise Server pour la base de données et les serveurs d'applications" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      SAP supports Oracle Database on Azure only with Windows or Oracle Linux as the guest OS (SAP Note 2039619). The restriction also applies to the Oracle client, so every SAP component that connects to the database, such as the ABAP application servers, must run on Oracle Linux.
    fr: |
      SAP ne prend en charge Oracle Database sur Azure qu'avec Windows ou Oracle Linux comme système d'exploitation invité (note SAP 2039619). La restriction s'applique aussi au client Oracle : chaque composant SAP qui se connecte à la base de données, comme les serveurs d'applications ABAP, doit s'exécuter sous Oracle Linux.
  options:
    a:
      en: |
        Red Hat Enterprise Linux isn't a supported guest OS for an SAP Oracle database on Azure.
      fr: |
        Red Hat Enterprise Linux n'est pas un système d'exploitation invité pris en charge pour une base de données Oracle SAP sur Azure.
    c:
      en: |
        The ABAP application servers connect to the Oracle database through the Oracle client, so they must also run on Oracle Linux.
      fr: |
        Les serveurs d'applications ABAP se connectent à la base Oracle par le client Oracle : ils doivent donc aussi s'exécuter sous Oracle Linux.
    d:
      en: |
        SUSE Linux Enterprise Server isn't a supported guest OS for an SAP Oracle database on Azure.
      fr: |
        SUSE Linux Enterprise Server n'est pas un système d'exploitation invité pris en charge pour une base de données Oracle SAP sur Azure.
references:
  - title: What SAP software is supported for Azure deployments
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/supported-product-on-azure
