id: az120-1b-authn-snc-setup-order
objective: "1.2.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation runs an SAP NetWeaver ABAP 7.02 system on Windows Server virtual machines in Azure, joined to an AD DS domain. Adatum wants Kerberos-based SNC single sign-on for SAP GUI. The SNCWIZARD and SPNEGO transactions aren't available in this release.

    You need to prepare the SAP system. User mapping and the client computers will be configured later.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum Corporation exécute un système SAP NetWeaver ABAP 7.02 sur des machines virtuelles Windows Server dans Azure, jointes à un domaine AD DS. Adatum veut une authentification unique SNC fondée sur Kerberos pour SAP GUI. Les transactions SNCWIZARD et SPNEGO ne sont pas disponibles dans cette version.

    Vous devez préparer le système SAP. Le mappage des utilisateurs et les ordinateurs clients seront configurés ultérieurement.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: account, text: { en: "Create an AD DS user account for the SAP system, with a password that doesn't expire.", fr: "Créer un compte d'utilisateur AD DS pour le système SAP, avec un mot de passe qui n'expire pas." } }
    - { id: spn, text: { en: "Register a service principal name (SPN) for the account by using SETSPN.", fr: "Enregistrer un nom de principal du service (SPN) pour le compte à l'aide de SETSPN." } }
    - { id: lib, text: { en: "Install CommonCryptoLib and set the SECUDIR environment variable.", fr: "Installer CommonCryptoLib et définir la variable d'environnement SECUDIR." } }
    - { id: params, text: { en: "Set the SNC profile parameters for the crypto library and the SPN, and restart the SAP instance.", fr: "Définir les paramètres de profil SNC pour la bibliothèque de chiffrement et le SPN, puis redémarrer l'instance SAP." } }
    - { id: keytab, text: { en: "Create the Kerberos keytab and the corresponding PSE file.", fr: "Créer le fichier keytab Kerberos et le fichier PSE correspondant." } }
    - { id: wizard, text: { en: "Run transaction SNCWIZARD, and then transaction SPNEGO.", fr: "Exécuter la transaction SNCWIZARD, puis la transaction SPNEGO." } }
    - { id: saml, text: { en: "Upload the Microsoft Entra federation metadata in transaction SAML2.", fr: "Charger les métadonnées de fédération Microsoft Entra dans la transaction SAML2." } }
answer:
  sequence: [ account, spn, lib, params, keytab ]
explanation:
  correct:
    en: Without the wizards, the manual procedure is to create the AD service account, register its SPN with SETSPN, install CommonCryptoLib and set SECUDIR, set the profile parameters that reference the crypto library and the SPN and restart the instance, and then create the keytab and PSE files. Users are then mapped in SU01 and the clients are configured.
    fr: Sans les assistants, la procédure manuelle consiste à créer le compte de service AD, enregistrer son SPN avec SETSPN, installer CommonCryptoLib et définir SECUDIR, définir les paramètres de profil qui référencent la bibliothèque de chiffrement et le SPN puis redémarrer l'instance, et enfin créer les fichiers keytab et PSE. Les utilisateurs sont ensuite mappés dans SU01 et les clients configurés.
  options:
    wizard: { en: "The wizards exist only from SAP NetWeaver ABAP 7.31; this system needs the manual steps.", fr: "Les assistants n'existent qu'à partir de SAP NetWeaver ABAP 7.31 ; ce système exige les étapes manuelles." }
    saml: { en: "SAML2 configures browser SAML SSO with Microsoft Entra ID, not Kerberos SNC for SAP GUI.", fr: "SAML2 configure l'authentification unique SAML par navigateur avec Microsoft Entra ID, pas SNC Kerberos pour SAP GUI." }
references:
  - title: Integrate Active Directory with SAP single sign-on (Kerberos-SPNEGO)
    url: https://learn.microsoft.com/en-us/training/modules/explore-identity-services/9-exercise-integrate-active-directory-sap-single-sign-on
