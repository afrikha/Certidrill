id: az120-1a-quota-anf-dd
objective: "1.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware plans to host the SAP HANA volumes of its landscape on Azure NetApp Files in a single Azure subscription, in the West Europe region. The design requires 160 TiB of provisioned capacity pools in total. The largest volume, which stores the data of an SAP BW/4HANA system, must be 120 TiB.

    No Azure NetApp Files limits have been changed for the subscription.

    How should you complete the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit d'héberger les volumes SAP HANA de son paysage sur Azure NetApp Files dans un seul abonnement Azure, dans la région West Europe. La conception exige au total 160 Tio de pools de capacité provisionnés. Le plus grand volume, qui stocke les données d'un système SAP BW/4HANA, doit faire 120 Tio.

    Aucune limite Azure NetApp Files n'a été modifiée pour l'abonnement.

    Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To provision 160 TiB of capacity pools: [[quota]]

      For the 120-TiB volume: [[volume]]
    fr: |
      Pour provisionner 160 Tio de pools de capacité : [[quota]]

      Pour le volume de 120 Tio : [[volume]]
  slots:
    - id: quota
      options:
        - { id: none, text: { en: "No action is needed; the default limit is sufficient", fr: "Aucune action n'est nécessaire ; la limite par défaut suffit" } }
        - { id: request, text: { en: "Request an increase of the regional capacity quota of the subscription", fr: "Demander une augmentation du quota de capacité régional de l'abonnement" } }
        - { id: account, text: { en: "Create a second NetApp account in West Europe", fr: "Créer un second compte NetApp dans West Europe" } }
    - id: volume
      options:
        - { id: regular, text: { en: "Create a regular volume", fr: "Créer un volume standard (regular)" } }
        - { id: large, text: { en: "Create a large volume", fr: "Créer un volume de grande taille (large volume)" } }
        - { id: split, text: { en: "Create the volume in a dedicated capacity pool of 120 TiB", fr: "Créer le volume dans un pool de capacité dédié de 120 Tio" } }
answer:
  values: { quota: request, volume: large }
explanation:
  correct:
    en: |
      The default regional capacity quota is 100 TiB per subscription and region; it is adjustable through a support request of type Service and subscription limits (Quotas). A regular volume is limited to 100 TiB, so a 120-TiB volume must be a large volume (from 50 TiB up to 1 PiB by default).
    fr: |
      Le quota de capacité régional par défaut est de 100 Tio par abonnement et par région ; il est ajustable par une demande de support de type limites de service et d'abonnement (quotas). Un volume standard est limité à 100 Tio : un volume de 120 Tio doit donc être un volume de grande taille (de 50 Tio jusqu'à 1 Pio par défaut).
  options:
    none:
      en: |
        160 TiB exceeds the default regional capacity quota of 100 TiB.
      fr: |
        160 Tio dépassent le quota de capacité régional par défaut de 100 Tio.
    account:
      en: |
        The regional capacity quota applies to the whole subscription in the region, whatever the number of NetApp accounts.
      fr: |
        Le quota de capacité régional s'applique à tout l'abonnement dans la région, quel que soit le nombre de comptes NetApp.
    regular:
      en: |
        A regular volume can't exceed 100 TiB.
      fr: |
        Un volume standard ne peut pas dépasser 100 Tio.
    split:
      en: |
        A dedicated capacity pool doesn't raise the 100-TiB maximum size of a regular volume.
      fr: |
        Un pool de capacité dédié n'augmente pas la taille maximale de 100 Tio d'un volume standard.
references:
  - title: Resource limits for Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-resource-limits
