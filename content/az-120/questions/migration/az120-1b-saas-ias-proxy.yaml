id: az120-1b-saas-ias-proxy
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. uses several SAP Business Technology Platform (BTP) subaccounts and SAP SuccessFactors, which comes with a preconfigured SAP Cloud Identity Services - Identity Authentication (IAS) tenant. Microsoft Entra ID is Contoso's identity provider.

    Users must sign in to all these SAP applications with their Microsoft Entra accounts, and security policies must be enforced in one place with Conditional Access. The solution must minimize the configuration required for each BTP subaccount.

    What should you do?
  fr: |
    Contoso, Ltd. utilise plusieurs sous-comptes SAP Business Technology Platform (BTP) et SAP SuccessFactors, fourni avec un locataire SAP Cloud Identity Services - Identity Authentication (IAS) préconfiguré. Microsoft Entra ID est le fournisseur d'identité de Contoso.

    Les utilisateurs doivent se connecter à toutes ces applications SAP avec leurs comptes Microsoft Entra, et les stratégies de sécurité doivent être appliquées en un seul endroit avec l'accès conditionnel. La solution doit réduire au minimum la configuration nécessaire pour chaque sous-compte BTP.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Federate each BTP subaccount directly with Microsoft Entra ID by using a SAML trust configuration.", fr: "Fédérer directement chaque sous-compte BTP avec Microsoft Entra ID à l'aide d'une configuration d'approbation SAML." } }
    - { id: b, text: { en: "Make IAS federate with Microsoft Entra ID as a corporate identity provider, and make the BTP subaccounts trust IAS.", fr: "Fédérer IAS avec Microsoft Entra ID comme fournisseur d'identité d'entreprise, et faire approuver IAS par les sous-comptes BTP." } }
    - { id: c, text: { en: "Deploy Microsoft Entra Domain Services, and configure the SAP applications to authenticate users by using LDAP.", fr: "Déployer Microsoft Entra Domain Services, et configurer les applications SAP pour authentifier les utilisateurs par LDAP." } }
    - { id: d, text: { en: "Configure SAP SuccessFactors as the identity provider of Microsoft Entra ID, and federate BTP with SuccessFactors.", fr: "Configurer SAP SuccessFactors comme fournisseur d'identité de Microsoft Entra ID, et fédérer BTP avec SuccessFactors." } }
answer: { optionId: b }
explanation:
  correct:
    en: Microsoft recommends a BTP trust configuration toward IAS, with IAS federating to Microsoft Entra ID as a Corporate Identity Provider (proxy mode). The Entra federation is configured once in IAS instead of once per subaccount, SAP SaaS applications such as SuccessFactors already use IAS, and Conditional Access in Microsoft Entra ID becomes the single place for advanced security policies.
    fr: Microsoft recommande une configuration d'approbation BTP vers IAS, IAS se fédérant avec Microsoft Entra ID en tant que Corporate Identity Provider (mode proxy). La fédération Entra est configurée une seule fois dans IAS au lieu d'une fois par sous-compte, les applications SAP SaaS comme SuccessFactors utilisent déjà IAS, et l'accès conditionnel de Microsoft Entra ID devient l'endroit unique des stratégies de sécurité avancées.
  options:
    a:
      en: Direct federation works but must be repeated for each subaccount, which doesn't minimize configuration, and it bypasses the preconfigured IAS of the SaaS applications.
      fr: La fédération directe fonctionne mais doit être répétée pour chaque sous-compte, ce qui ne réduit pas la configuration, et elle contourne l'IAS préconfiguré des applications SaaS.
    c:
      en: SAP cloud applications authenticate with SAML through IAS, not with LDAP binds to a managed domain.
      fr: Les applications cloud SAP s'authentifient en SAML via IAS, pas par des liaisons LDAP vers un domaine managé.
    d:
      en: SuccessFactors can be an HR source for provisioning, but it isn't the identity provider of Microsoft Entra ID.
      fr: SuccessFactors peut être une source RH pour l'approvisionnement, mais ce n'est pas le fournisseur d'identité de Microsoft Entra ID.
references:
  - title: Scenario - Using Microsoft Entra ID to secure access to SAP platforms and applications
    url: https://learn.microsoft.com/en-us/entra/fundamentals/scenario-azure-first-sap-identity-integration
