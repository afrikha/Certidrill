id: az120-1c-rise-impl-dns
objective: "1.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. delegated the DNS zone **ecs.proseware.com** to the SAP DNS servers in its RISE with SAP virtual network. Proseware runs Active Directory-integrated DNS servers on two virtual machines in its hub virtual network. The spoke virtual networks of Proseware currently use Azure-provided DNS.

    You need to ensure that on-premises clients and the virtual machines in the Proseware spokes can resolve the names in ecs.proseware.com by using the Proseware DNS servers.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. a délégué la zone DNS **ecs.proseware.com** aux serveurs DNS de SAP de son réseau virtuel RISE with SAP. Proseware exécute des serveurs DNS intégrés à Active Directory sur deux machines virtuelles de son réseau virtuel hub. Les réseaux virtuels spoke de Proseware utilisent actuellement le DNS fourni par Azure.

    Vous devez faire en sorte que les clients locaux et les machines virtuelles des spokes de Proseware puissent résoudre les noms de ecs.proseware.com en utilisant les serveurs DNS de Proseware.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Configure a zone transfer of ecs.proseware.com from the SAP DNS servers to the Proseware DNS servers.", fr: "Configurer un transfert de zone de ecs.proseware.com des serveurs DNS de SAP vers les serveurs DNS de Proseware." }
    - id: b
      text: { en: "Create an Azure private DNS zone named ecs.proseware.com and configure it to receive zone transfers from SAP.", fr: "Créer une zone DNS privée Azure nommée ecs.proseware.com et la configurer pour recevoir les transferts de zone de SAP." }
    - id: c
      text: { en: "Configure the spoke virtual networks to use custom DNS servers that point to the Proseware DNS servers in the hub.", fr: "Configurer les réseaux virtuels spoke pour utiliser des serveurs DNS personnalisés qui pointent vers les serveurs DNS de Proseware du hub." }
    - id: d
      text: { en: "Link the RISE virtual network to an Azure private DNS zone in the Proseware subscription.", fr: "Lier le réseau virtuel RISE à une zone DNS privée Azure de l'abonnement Proseware." }
    - id: e
      text: { en: "Create private endpoints in the hub for the two SAP DNS servers.", fr: "Créer dans le hub des points de terminaison privés pour les deux serveurs DNS de SAP." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      DNS zone transfer from the SAP DNS servers to the customer's DNS servers is the primary method to replicate the RISE entries, and it works with customer-run DNS such as AD DS. The customer VNets then use custom DNS that points to the DNS servers in the hub, which answer for both on-premises and Azure clients.
    fr: |
      Le transfert de zone DNS des serveurs DNS de SAP vers les serveurs DNS du client est la méthode principale pour répliquer les entrées RISE, et il fonctionne avec un DNS exploité par le client comme AD DS. Les réseaux virtuels du client utilisent ensuite un DNS personnalisé qui pointe vers les serveurs DNS du hub, lesquels répondent aux clients locaux comme Azure.
  options:
    b:
      en: |
        Azure-provided DNS and Azure private DNS zones do not support zone transfers, so they cannot accept replication from the SAP DNS servers.
      fr: |
        Le DNS fourni par Azure et les zones DNS privées Azure ne prennent pas en charge les transferts de zone : ils ne peuvent pas recevoir la réplication des serveurs DNS de SAP.
    d:
      en: |
        The RISE VNet is in SAP's tenant and SAP holds the master role for the delegated zone; a private zone link would not replicate the SAP entries.
      fr: |
        Le réseau virtuel RISE se trouve dans le locataire de SAP et SAP détient le rôle maître de la zone déléguée ; une liaison de zone privée ne répliquerait pas les entrées de SAP.
    e:
      en: |
        SAP generally does not offer private endpoints for RISE resources, and private endpoints do not replicate DNS zones.
      fr: |
        SAP ne propose généralement pas de points de terminaison privés pour les ressources RISE, et les points de terminaison privés ne répliquent pas de zones DNS.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
