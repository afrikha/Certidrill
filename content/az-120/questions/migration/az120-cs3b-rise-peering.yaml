id: az120-cs3b-rise-peering
objective: "1.3.1"
type: dropdown
caseStudy: az120-cs3b-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You need to design the network connectivity to the RISE virtual network to meet the connectivity requirement. What should you include in the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez concevoir la connectivité réseau vers le réseau virtuel RISE pour respecter l'exigence de connectivité. Que devez-vous inclure dans la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Connection between VNet-Hub and the RISE virtual network: [[conn]]

      Access from Brussels to the RISE virtual network: [[onprem]]
    fr: |
      Connexion entre VNet-Hub et le réseau virtuel RISE : [[conn]]

      Accès depuis Bruxelles au réseau virtuel RISE : [[onprem]]
  slots:
    - id: conn
      options:
        - { id: peer, text: { en: "Virtual network peering between the two tenants", fr: "Peering de réseaux virtuels entre les deux locataires" } }
        - { id: vpn, text: { en: "VNet-to-VNet VPN between gateways in both subscriptions", fr: "VPN de réseau virtuel à réseau virtuel entre des passerelles des deux abonnements" } }
        - { id: pe, text: { en: "A private endpoint in VNet-Hub for SAP S/4HANA", fr: "Un point de terminaison privé dans VNet-Hub pour SAP S/4HANA" } }
    - id: onprem
      options:
        - { id: transit, text: { en: "Gateway transit through the ExpressRoute gateway of VNet-Hub", fr: "Transit par la passerelle ExpressRoute de VNet-Hub" } }
        - { id: ergw, text: { en: "A new ExpressRoute gateway in the RISE virtual network", fr: "Une nouvelle passerelle ExpressRoute dans le réseau virtuel RISE" } }
        - { id: s2s, text: { en: "A site-to-site VPN to a gateway in the RISE virtual network", fr: "Un VPN site à site vers une passerelle du réseau virtuel RISE" } }
answer:
  values: { conn: peer, onprem: transit }
explanation:
  correct:
    en: |
      Virtual network peering is the preferred way to connect a customer's Azure environment to SAP RISE; because SAP runs RISE in its own tenant and subscription, the peering is cross-tenant. The RISE virtual network then acts as a spoke of the customer hub, and with gateway transit (remote gateway on the RISE side) on-premises users reach RISE through the existing ExpressRoute gateway. A virtual network can use only one gateway, local or remote, so no gateway is added to the RISE virtual network.
    fr: |
      Le peering de réseaux virtuels est la méthode privilégiée pour connecter l'environnement Azure d'un client à SAP RISE ; comme SAP exécute RISE dans son propre locataire et son propre abonnement, le peering est interlocataire. Le réseau virtuel RISE devient alors un spoke du hub du client, et grâce au transit par passerelle (passerelle distante côté RISE), les utilisateurs locaux atteignent RISE par la passerelle ExpressRoute existante. Un réseau virtuel ne peut utiliser qu'une seule passerelle, locale ou distante : aucune passerelle n'est ajoutée au réseau virtuel RISE.
  options:
    vpn:
      en: |
        A VNet-to-VNet VPN is only the alternative to peering, and its throughput is limited by the gateway SKUs on both sides.
      fr: |
        Un VPN de réseau virtuel à réseau virtuel n'est que l'alternative au peering, et son débit est limité par les SKU de passerelle des deux côtés.
    pe:
      en: |
        SAP doesn't generally offer private endpoints to RISE workloads for customers.
      fr: |
        SAP ne propose généralement pas de points de terminaison privés vers les charges de travail RISE pour les clients.
    ergw:
      en: |
        The requirement forbids an additional gateway in the RISE virtual network, and a connection that SAP establishes directly in RISE only reaches the SAP-managed virtual network.
      fr: |
        L'exigence interdit toute passerelle supplémentaire dans le réseau virtuel RISE, et une connexion établie directement par SAP dans RISE n'atteint que le réseau virtuel géré par SAP.
    s2s:
      en: |
        A site-to-site VPN needs a VPN gateway in the RISE virtual network and doesn't use the existing ExpressRoute circuit.
      fr: |
        Un VPN site à site exige une passerelle VPN dans le réseau virtuel RISE et n'utilise pas le circuit ExpressRoute existant.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
