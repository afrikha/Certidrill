id: az120-1a-lic-rhel-payg
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin migrated its SAP HANA VMs running Red Hat Enterprise Linux from on-premises to Azure by using Azure Migrate. The VMs use the custom images that came from on-premises and the Red Hat subscriptions that Tailspin bought. Those Red Hat subscriptions expire next month and won't be renewed.

    Tailspin wants Azure to bill the RHEL software from now on, with access to the RHEL for SAP high availability repositories used by the Pacemaker clusters. The VMs must not be redeployed.

    What should you do?
  fr: |
    Tailspin a migré ses machines virtuelles SAP HANA exécutant Red Hat Enterprise Linux depuis son environnement local vers Azure avec Azure Migrate. Les machines virtuelles utilisent les images personnalisées venues du local et les abonnements Red Hat achetés par Tailspin. Ces abonnements Red Hat expirent le mois prochain et ne seront pas renouvelés.

    Tailspin veut qu'Azure facture désormais le logiciel RHEL, avec l'accès aux référentiels de haute disponibilité RHEL for SAP utilisés par les clusters Pacemaker. Les machines virtuelles ne doivent pas être redéployées.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the license type of each VM to RHEL_BYOS and keep the VMs registered", fr: "Définir le type de licence de chaque machine virtuelle sur RHEL_BYOS et garder leur inscription" } }
    - { id: b, text: { en: "Set the license type of each VM to NONE to restore the image's model", fr: "Définir le type de licence de chaque machine virtuelle sur NONE pour rétablir le modèle de l'image" } }
    - { id: c, text: { en: "Purchase a Red Hat software plan reservation for the VMs", fr: "Acheter une réservation de plan logiciel Red Hat pour les machines virtuelles" } }
    - { id: d, text: { en: "Install the AHBForRHEL extension and set the license type to RHEL_SAPHA", fr: "Installer l'extension AHBForRHEL et définir le type de licence sur RHEL_SAPHA" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Custom images uploaded through Azure Migrate are already BYOS and can be converted to pay-as-you-go with Azure Hybrid Benefit for Linux, without redeployment. The BYOS-to-PAYG conversion for RHEL requires the AHBForRHEL extension first; the PAYG license type then selects the repositories it installs, and RHEL_SAPHA selects the SAP HA repositories.
    fr: |
      Les images personnalisées chargées avec Azure Migrate sont déjà en BYOS et peuvent être converties en paiement à l'utilisation avec Azure Hybrid Benefit pour Linux, sans redéploiement. La conversion BYOS vers paiement à l'utilisation pour RHEL exige d'abord l'extension AHBForRHEL ; le type de licence de paiement à l'utilisation sélectionne ensuite les référentiels qu'elle installe, et RHEL_SAPHA sélectionne les référentiels SAP HA.
  options:
    a:
      en: |
        The VMs are already BYOS; RHEL_BYOS keeps Tailspin responsible for the Red Hat subscriptions.
      fr: |
        Les machines virtuelles sont déjà en BYOS ; RHEL_BYOS laisse Tailspin responsable des abonnements Red Hat.
    b:
      en: |
        NONE reverts a VM to its image's default billing model, which is BYOS for a custom image.
      fr: |
        NONE ramène une machine virtuelle au modèle de facturation par défaut de son image, qui est BYOS pour une image personnalisée.
    c:
      en: |
        A software plan reservation discounts Red Hat meters that Azure already bills; these BYOS VMs generate no such meter.
      fr: |
        Une réservation de plan logiciel réduit les compteurs Red Hat déjà facturés par Azure ; ces machines virtuelles en BYOS ne génèrent pas de tels compteurs.
references:
  - title: Azure Hybrid Benefit for Linux virtual machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/azure-hybrid-benefit-linux
