id: az120-1a-size-hana-cert-dd
objective: "1.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum is sizing two SAP HANA systems on Azure virtual machines: a production SAP S/4HANA database and a sandbox database used by developers.

    You need to identify the list from which each VM type must be selected so that the deployment is supported.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dimensionne deux systèmes SAP HANA sur des machines virtuelles Azure : une base de données SAP S/4HANA de production et une base de données bac à sable utilisée par les développeurs.

    Vous devez identifier la liste dans laquelle chaque type de machine virtuelle doit être choisi pour que le déploiement soit pris en charge.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      The production SAP HANA VM must use a VM type listed in [[prod]].

      The sandbox SAP HANA VM can also use a VM type listed in [[nonprod]].
    fr: |
      La machine virtuelle SAP HANA de production doit utiliser un type de machine virtuelle listé dans [[prod]].

      La machine virtuelle SAP HANA bac à sable peut aussi utiliser un type de machine virtuelle listé dans [[nonprod]].
  slots:
    - id: prod
      options:
        - { id: pam, text: { en: "the SAP Product Availability Matrix (PAM)", fr: "la matrice de disponibilité des produits SAP (PAM)" } }
        - { id: hwd, text: { en: "the SAP HANA hardware directory (certified IaaS platforms)", fr: "l'annuaire matériel SAP HANA (plateformes IaaS certifiées)" } }
        - { id: n1928533, text: { en: "SAP Note 1928533", fr: "la note SAP 1928533" } }
        - { id: n2015553, text: { en: "SAP Note 2015553", fr: "la note SAP 2015553" } }
    - id: nonprod
      options:
        - { id: pam, text: { en: "the SAP Product Availability Matrix (PAM)", fr: "la matrice de disponibilité des produits SAP (PAM)" } }
        - { id: n2015553, text: { en: "SAP Note 2015553", fr: "la note SAP 2015553" } }
        - { id: n1928533, text: { en: "SAP Note 1928533", fr: "la note SAP 1928533" } }
        - { id: n2235581, text: { en: "SAP Note 2235581", fr: "la note SAP 2235581" } }
answer:
  values: { prod: hwd, nonprod: n1928533 }
explanation:
  correct:
    en: |
      Production SAP HANA must run on VM types certified for HANA and listed in the SAP HANA hardware directory (certified IaaS platforms). For non-production HANA systems, Microsoft's guidance also allows the VM types listed in SAP Note 1928533.
    fr: |
      SAP HANA en production doit s'exécuter sur des types de machines virtuelles certifiés pour HANA et listés dans l'annuaire matériel SAP HANA (plateformes IaaS certifiées). Pour les systèmes HANA hors production, les recommandations de Microsoft autorisent aussi les types de machines virtuelles listés dans la note SAP 1928533.
  options:
    pam:
      en: |
        The PAM lists the OS and DBMS releases supported by an SAP product; it doesn't certify Azure VM types.
      fr: |
        La PAM liste les versions de système d'exploitation et de SGBD prises en charge par un produit SAP ; elle ne certifie pas de types de machines virtuelles Azure.
    n2015553:
      en: |
        SAP Note 2015553 covers the support prerequisites, not the list of VM types.
      fr: |
        La note SAP 2015553 couvre les prérequis de support, pas la liste des types de machines virtuelles.
    n2235581:
      en: |
        SAP Note 2235581 lists supported HANA and OS releases, not VM types.
      fr: |
        La note SAP 2235581 liste les versions de HANA et de système d'exploitation prises en charge, pas les types de machines virtuelles.
references:
  - title: SAP HANA infrastructure configurations and operations on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations
