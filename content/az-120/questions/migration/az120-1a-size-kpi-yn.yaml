id: az120-1a-size-kpi-yn
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind is sizing the storage of a production SAP HANA database on an Azure M-series virtual machine. The team wants the volumes to meet the SAP HANA storage KPIs that Microsoft documents for Azure.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dimensionne le stockage d'une base de données SAP HANA de production sur une machine virtuelle Azure de série M. L'équipe veut que les volumes respectent les KPI de stockage SAP HANA que Microsoft documente pour Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The /hana/log volume must sustain at least 250 MB/s of read and write throughput with 1 MB I/O.
        fr: |
          Le volume /hana/log doit soutenir un débit en lecture et en écriture d'au moins 250 Mo/s avec des E/S de 1 Mo.
    - id: s2
      text:
        en: |
          The throughput of the /hana/data volume should exceed the overall storage throughput limit of the VM so that savepoints complete faster.
        fr: |
          Le débit du volume /hana/data doit dépasser la limite de débit de stockage globale de la machine virtuelle pour que les points de sauvegarde (savepoints) se terminent plus vite.
    - id: s3
      text:
        en: |
          The /hana/data volume must deliver at least 400 MB/s of read throughput.
        fr: |
          Le volume /hana/data doit fournir un débit en lecture d'au moins 400 Mo/s.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      SAP's minimum KPIs are 250 MB/s read and write for /hana/log at 1 MB I/O size, and at least 400 MB/s read and 250 MB/s write for /hana/data. Microsoft recommends keeping the /hana/data throughput at or below the VM's overall storage throughput limit, so that savepoint writes don't starve the redo log writes.
    fr: |
      Les KPI minimaux de SAP sont de 250 Mo/s en lecture et en écriture pour /hana/log avec des E/S de 1 Mo, et d'au moins 400 Mo/s en lecture et 250 Mo/s en écriture pour /hana/data. Microsoft recommande de maintenir le débit de /hana/data au niveau ou en dessous de la limite de débit de stockage globale de la machine virtuelle, afin que les écritures des points de sauvegarde ne privent pas les écritures du journal de rétablissement.
references:
  - title: SAP HANA Azure virtual machine storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-storage
