id: az120-1a-cost-ri-stable
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs its production SAP HANA database on a Standard_M128s_v2 virtual machine in West Europe, 24 hours a day. The VM size and the region won't change for at least three years.

    You need to recommend a purchasing option that provides the greatest compute savings for this VM.

    What should you recommend?
  fr: |
    Contoso exécute sa base de données SAP HANA de production sur une machine virtuelle Standard_M128s_v2 dans West Europe, 24 heures sur 24. La taille de la machine virtuelle et la région ne changeront pas pendant au moins trois ans.

    Vous devez recommander une option d'achat qui offre les économies de calcul les plus importantes pour cette machine virtuelle.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A three-year compute savings plan", fr: "Un plan d'économies pour le calcul de trois ans" } }
    - { id: b, text: { en: "A three-year reserved VM instance", fr: "Une instance de machine virtuelle réservée de trois ans" } }
    - { id: c, text: { en: "An Azure Spot VM", fr: "Une machine virtuelle Azure Spot" } }
    - { id: d, text: { en: "An on-demand capacity reservation", fr: "Une réservation de capacité à la demande" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A reservation commits to a specific VM size or family in a specific region and gives the greatest savings when it is fully used. A workload that runs continuously with no expected change of instance type or region is the textbook case for a three-year reservation.
    fr: |
      Une réservation porte sur une taille ou une famille de machines virtuelles précise dans une région précise et offre les économies les plus importantes lorsqu'elle est pleinement utilisée. Une charge de travail qui s'exécute en continu sans changement prévu de type d'instance ni de région est le cas typique d'une réservation de trois ans.
  options:
    a:
      en: |
        A savings plan suits dynamic workloads that change VM families or regions; for a stable VM, a reservation usually offers a deeper discount.
      fr: |
        Un plan d'économies convient aux charges dynamiques qui changent de famille de machines virtuelles ou de région ; pour une machine virtuelle stable, une réservation offre généralement une remise plus importante.
    c:
      en: |
        Spot VMs can be evicted at any time, which is unacceptable for a production database.
      fr: |
        Les machines virtuelles Spot peuvent être évincées à tout moment, ce qui est inacceptable pour une base de données de production.
    d:
      en: |
        A capacity reservation guarantees capacity and is billed at pay-as-you-go rates; it gives no discount.
      fr: |
        Une réservation de capacité garantit de la capacité et est facturée au tarif de paiement à l'utilisation ; elle n'offre aucune remise.
references:
  - title: Decide between a savings plan and a reservation
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation
