id: az120-1b-rbac-statements
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is designing access control for its SAP landscape in Azure. The SAP subscriptions are under a management group named **MG-SAP**, and Microsoft Entra login is enabled on the SAP Linux virtual machines.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys conçoit le contrôle d'accès de son paysage SAP dans Azure. Les abonnements SAP se trouvent sous un groupe d'administration nommé **MG-SAP**, et la connexion Microsoft Entra est activée sur les machines virtuelles Linux SAP.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A user who has only the Owner role on the resource group of an SAP Linux VM can sign in to the VM with Microsoft Entra ID.
        fr: Un utilisateur qui dispose uniquement du rôle Owner sur le groupe de ressources d'une machine virtuelle Linux SAP peut se connecter à la machine virtuelle avec Microsoft Entra ID.
    - id: s2
      text:
        en: A role assigned to a security group at the scope of MG-SAP applies to the SAP virtual machines in the subscriptions under MG-SAP.
        fr: Un rôle attribué à un groupe de sécurité à l'étendue de MG-SAP s'applique aux machines virtuelles SAP des abonnements situés sous MG-SAP.
    - id: s3
      text:
        en: A new custom role whose assignable scopes include MG-SAP can list only that one management group in its assignable scopes.
        fr: Un nouveau rôle personnalisé dont les étendues attribuables incluent MG-SAP ne peut lister que ce seul groupe d'administration dans ses étendues attribuables.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: Owner and Contributor don't grant SSH login to a VM through Microsoft Entra ID; Virtual Machine Administrator Login or Virtual Machine User Login is required. Roles assigned at a management group are inherited by the subscriptions, resource groups and resources below it. A new custom role can list only one management group in its assignable scopes.
    fr: "Owner et Contributor n'accordent pas la connexion SSH à une machine virtuelle par Microsoft Entra ID ; Virtual Machine Administrator Login ou Virtual Machine User Login est nécessaire. Les rôles attribués à un groupe d'administration sont hérités par les abonnements, groupes de ressources et ressources situés en dessous. Un nouveau rôle personnalisé ne peut lister qu'un seul groupe d'administration dans ses étendues attribuables."
references:
  - title: Sign in to a Linux virtual machine in Azure by using Microsoft Entra ID and OpenSSH
    url: https://learn.microsoft.com/en-us/entra/identity/devices/howto-vm-sign-in-azure-ad-linux
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
