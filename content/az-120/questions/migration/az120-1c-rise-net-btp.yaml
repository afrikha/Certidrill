id: az120-1c-rise-net-btp
objective: "1.3.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. runs SAP S/4HANA in RISE with SAP on Azure and uses several SAP BTP services that also run on Azure. Fabrikam has its own hub-and-spoke network, peered with the RISE virtual network, and a central Azure Firewall for outbound internet access.

    You are documenting the network path of three BTP communication flows.

    How should you complete the documentation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. exécute SAP S/4HANA dans RISE with SAP sur Azure et utilise plusieurs services SAP BTP qui s'exécutent également sur Azure. Fabrikam dispose de son propre réseau hub-and-spoke, relié par peering au réseau virtuel RISE, et d'un Pare-feu Azure central pour l'accès Internet sortant.

    Vous documentez le chemin réseau de trois flux de communication BTP.

    Comment devez-vous compléter la documentation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Requests that originate from a BTP service and must reach a Fabrikam application over a private IP range: [[frombtp]]

      Calls from a Fabrikam application in a spoke to a BTP service: [[tobtp]]

      Access to SAP Data Intelligence: [[di]]
    fr: |
      Requêtes issues d'un service BTP qui doivent atteindre une application de Fabrikam par une plage d'adresses IP privées : [[frombtp]]

      Appels d'une application de Fabrikam dans un spoke vers un service BTP : [[tobtp]]

      Accès à SAP Data Intelligence : [[di]]
  slots:
    - id: frombtp
      options:
        - { id: pls, text: "SAP Private Link Service" }
        - { id: peer, text: { en: "The virtual network peering with RISE", fr: "Le peering de réseaux virtuels avec RISE" } }
        - { id: pub, text: { en: "The BTP public endpoint through the Fabrikam outbound path", fr: "Le point de terminaison public BTP par le chemin sortant de Fabrikam" } }
        - { id: sep, text: { en: "A separate virtual network peering", fr: "Un peering de réseaux virtuels distinct" } }
    - id: tobtp
      options:
        - { id: pls, text: "SAP Private Link Service" }
        - { id: peer, text: { en: "The virtual network peering with RISE", fr: "Le peering de réseaux virtuels avec RISE" } }
        - { id: pub, text: { en: "The BTP public endpoint through the Fabrikam outbound path", fr: "Le point de terminaison public BTP par le chemin sortant de Fabrikam" } }
        - { id: sep, text: { en: "A separate virtual network peering", fr: "Un peering de réseaux virtuels distinct" } }
    - id: di
      options:
        - { id: pls, text: "SAP Private Link Service" }
        - { id: peer, text: { en: "The virtual network peering with RISE", fr: "Le peering de réseaux virtuels avec RISE" } }
        - { id: pub, text: { en: "The BTP public endpoint through the Fabrikam outbound path", fr: "Le point de terminaison public BTP par le chemin sortant de Fabrikam" } }
        - { id: sep, text: { en: "A separate virtual network peering", fr: "Un peering de réseaux virtuels distinct" } }
answer:
  values: { frombtp: pls, tobtp: pub, di: sep }
explanation:
  correct:
    en: |
      SAP Private Link Service provides private, uni-directional connectivity for requests that originate from BTP into the customer's Azure network (its availability for RISE must be confirmed with SAP). Connections into BTP do not use Private Link: customer applications reach the BTP public interface through their own outbound path, such as a central firewall. SAP Data Intelligence is by design accessed through a separate virtual network peering instead of a public endpoint.
    fr: |
      SAP Private Link Service fournit une connectivité privée et unidirectionnelle pour les requêtes issues de BTP vers le réseau Azure du client (sa disponibilité pour RISE doit être confirmée avec SAP). Les connexions vers BTP n'utilisent pas Private Link : les applications du client atteignent l'interface publique de BTP par leur propre chemin sortant, comme un pare-feu central. SAP Data Intelligence est par conception accessible par un peering de réseaux virtuels distinct plutôt que par un point de terminaison public.
  options:
    peer:
      en: |
        The RISE peering connects the customer's network to the RISE landscape, not to BTP services.
      fr: |
        Le peering RISE relie le réseau du client au paysage RISE, pas aux services BTP.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
