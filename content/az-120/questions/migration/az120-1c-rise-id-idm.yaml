id: az120-1c-rise-id-idm
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank manages the user lifecycle and authorizations of its SAP systems with SAP Identity Management (SAP IDM). Woodgrove is moving the SAP systems to RISE with SAP on Azure and uses Microsoft Entra ID for all its employees.

    You need to recommend a long-term solution to manage SAP user lifecycle and access across the SAP and Microsoft ecosystems.

    What should you recommend?
  fr: |
    Woodgrove Bank gère le cycle de vie des utilisateurs et les autorisations de ses systèmes SAP avec SAP Identity Management (SAP IDM). Woodgrove migre ses systèmes SAP vers RISE with SAP sur Azure et utilise Microsoft Entra ID pour tous ses employés.

    Vous devez recommander une solution à long terme pour gérer le cycle de vie des utilisateurs SAP et les accès entre les écosystèmes SAP et Microsoft.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Keep SAP IDM and run it on Azure virtual machines in a Woodgrove subscription", fr: "Conserver SAP IDM et l'exécuter sur des machines virtuelles Azure d'un abonnement Woodgrove" } }
    - { id: b, text: { en: "Deploy Microsoft Entra Domain Services and join the RISE servers to its domain", fr: "Déployer Microsoft Entra Domain Services et joindre les serveurs RISE à son domaine" } }
    - { id: c, text: { en: "Migrate to Microsoft Entra ID Governance integrated with SAP Cloud Identity Services", fr: "Migrer vers Microsoft Entra ID Governance intégré à SAP Cloud Identity Services" } }
    - { id: d, text: { en: "Synchronize the SAP user accounts to Microsoft Entra ID by using Microsoft Entra Connect", fr: "Synchroniser les comptes d'utilisateur SAP vers Microsoft Entra ID en utilisant Microsoft Entra Connect" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      SAP announced the retirement of SAP IDM by 2027 and recommends that customers migrate to Microsoft Entra. Microsoft Entra ID Governance, with its built-in integrations with SAP Cloud Identity Services, manages SAP user lifecycle and authorizations across both ecosystems, including for RISE.
    fr: |
      SAP a annoncé la mise hors service de SAP IDM d'ici 2027 et recommande aux clients de migrer vers Microsoft Entra. Microsoft Entra ID Governance, avec ses intégrations natives à SAP Cloud Identity Services, gère le cycle de vie des utilisateurs SAP et leurs autorisations dans les deux écosystèmes, y compris pour RISE.
  options:
    a:
      en: |
        SAP IDM is being retired, so rehosting it is not a long-term solution.
      fr: |
        SAP IDM est en cours de mise hors service : le réhéberger n'est pas une solution à long terme.
    b:
      en: |
        RISE servers are managed by SAP and are not joined to customer domains; a managed domain does not govern SAP user lifecycle.
      fr: |
        Les serveurs RISE sont gérés par SAP et ne sont pas joints aux domaines du client ; un domaine managé ne gouverne pas le cycle de vie des utilisateurs SAP.
    d:
      en: |
        Microsoft Entra Connect synchronizes on-premises Active Directory to Microsoft Entra ID; it does not read SAP user accounts or manage SAP authorizations.
      fr: |
        Microsoft Entra Connect synchronise l'Active Directory local vers Microsoft Entra ID ; il ne lit pas les comptes d'utilisateur SAP et ne gère pas les autorisations SAP.
references:
  - title: Identity and security in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-security
  - title: Manage access to your SAP applications - Microsoft Entra ID Governance
    url: https://learn.microsoft.com/en-us/entra/id-governance/sap
