id: az120-1b-rbac-fence-role-json
objective: "1.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    You are creating the custom role that the Azure fence agent of an SAP Pacemaker cluster will use through the managed identities of the cluster nodes.

    The role must grant only read access to compute resources and the two power actions that the fence agent performs on the cluster VMs.

    How should you complete the role definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez le rôle personnalisé que l'agent Azure Fence d'un cluster Pacemaker SAP utilisera par l'intermédiaire des identités managées des nœuds du cluster.

    Le rôle ne doit accorder que l'accès en lecture aux ressources de calcul et les deux actions d'alimentation que l'agent Azure Fence effectue sur les machines virtuelles du cluster.

    Comment devez-vous compléter la définition de rôle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "Name": "Linux Fence Agent",
      "description": "Allowed to power-off and start virtual machines",
      "assignableScopes": [
        "/subscriptions/00000000-0000-0000-0000-000000000000"
      ],
      "actions": [
        [[read]],
        [[off]],
        [[on]]
      ],
      "notActions": [],
      "dataActions": [],
      "notDataActions": []
    }
  slots:
    - id: read
      options:
        - { id: compread, text: '"Microsoft.Compute/*/read"' }
        - { id: compall, text: '"Microsoft.Compute/*"' }
        - { id: allread, text: '"*/read"' }
        - { id: netread, text: '"Microsoft.Network/*/read"' }
    - id: off
      options:
        - { id: poweroff, text: '"Microsoft.Compute/virtualMachines/powerOff/action"' }
        - { id: dealloc, text: '"Microsoft.Compute/virtualMachines/deallocate/action"' }
        - { id: delete, text: '"Microsoft.Compute/virtualMachines/delete"' }
        - { id: restart, text: '"Microsoft.Compute/virtualMachines/restart/action"' }
    - id: on
      options:
        - { id: start, text: '"Microsoft.Compute/virtualMachines/start/action"' }
        - { id: redeploy, text: '"Microsoft.Compute/virtualMachines/redeploy/action"' }
        - { id: write, text: '"Microsoft.Compute/virtualMachines/write"' }
        - { id: runcmd, text: '"Microsoft.Compute/virtualMachines/runCommand/action"' }
answer:
  values: { read: compread, off: poweroff, on: start }
explanation:
  correct:
    en: The Linux Fence Agent role documented by Microsoft contains exactly Microsoft.Compute/*/read, Microsoft.Compute/virtualMachines/powerOff/action and Microsoft.Compute/virtualMachines/start/action. The fence agent powers off the failed node and starts it again; it needs nothing else.
    fr: Le rôle Linux Fence Agent documenté par Microsoft contient exactement Microsoft.Compute/*/read, Microsoft.Compute/virtualMachines/powerOff/action et Microsoft.Compute/virtualMachines/start/action. L'agent Azure Fence arrête le nœud défaillant puis le redémarre ; il n'a besoin de rien d'autre.
  options:
    compall: { en: "Microsoft.Compute/* grants every compute action, including write and delete.", fr: "Microsoft.Compute/* accorde toutes les actions de calcul, y compris l'écriture et la suppression." }
    allread: { en: "*/read grants read access to every resource type, not only compute.", fr: "*/read accorde l'accès en lecture à tous les types de ressources, pas seulement au calcul." }
    netread: { en: "The fence agent reads VM state, not network resources.", fr: "L'agent Azure Fence lit l'état des machines virtuelles, pas les ressources réseau." }
    dealloc: { en: "The documented role uses powerOff, not deallocate.", fr: "Le rôle documenté utilise powerOff, pas deallocate." }
    delete: { en: "Fencing must never delete a cluster VM.", fr: "L'isolation ne doit jamais supprimer une machine virtuelle du cluster." }
    restart: { en: "The fence agent powers off and starts the VM; restart is not one of the two documented actions.", fr: "L'agent Azure Fence arrête puis démarre la machine virtuelle ; restart ne fait pas partie des deux actions documentées." }
    redeploy: { en: "Redeploy moves the VM to another host; it is not used for fencing.", fr: "Redeploy déplace la machine virtuelle vers un autre hôte ; il ne sert pas à l'isolation." }
    write: { en: "Write allows changing the VM configuration, which the fence agent doesn't need.", fr: "Write permet de modifier la configuration de la machine virtuelle, ce dont l'agent Azure Fence n'a pas besoin." }
    runcmd: { en: "Run Command executes scripts inside the VM; it is not a power action.", fr: "Run Command exécute des scripts dans la machine virtuelle ; ce n'est pas une action d'alimentation." }
references:
  - title: Set up Pacemaker on SUSE Linux Enterprise Server in Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-pacemaker
