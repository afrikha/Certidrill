id: az120-1b-saas-statements
objective: "1.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is designing authentication for its SAP BTP applications. SAP Cloud Identity Services - Identity Authentication (IAS) will federate with Microsoft Entra ID in proxy mode.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. conçoit l'authentification de ses applications SAP BTP. SAP Cloud Identity Services - Identity Authentication (IAS) se fédérera avec Microsoft Entra ID en mode proxy.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Microsoft recommends turning off User assignment required on the Microsoft Entra enterprise application that represents IAS.
        fr: Microsoft recommande de désactiver User assignment required sur l'application d'entreprise Microsoft Entra qui représente IAS.
    - id: s2
      text:
        en: Microsoft Entra ID can provision users directly into BTP subaccounts without SAP Identity Provisioning.
        fr: Microsoft Entra ID peut approvisionner des utilisateurs directement dans les sous-comptes BTP sans SAP Identity Provisioning.
    - id: s3
      text:
        en: The development and test versions of a BTP application should use the production IAS tenant for end-user authentication.
        fr: Les versions de développement et de test d'une application BTP doivent utiliser le locataire IAS de production pour l'authentification des utilisateurs finaux.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Through IAS, Microsoft Entra ID only sees an authentication to IAS, so authorization belongs in IAS and BTP and the assignment requirement should be turned off. Native provisioning exists from Microsoft Entra ID to IAS, but not to BTP, where SAP Identity Provisioning Service is the integrated option. Microsoft recommends the production IAS tenant for all end-user authentication, including dev and test applications, so that the Entra federation is configured in one place.
    fr: Via IAS, Microsoft Entra ID ne voit qu'une authentification auprès d'IAS ; l'autorisation relève donc d'IAS et de BTP et l'exigence d'attribution doit être désactivée. L'approvisionnement natif existe de Microsoft Entra ID vers IAS, mais pas vers BTP, où SAP Identity Provisioning Service est l'option intégrée. Microsoft recommande le locataire IAS de production pour toute authentification des utilisateurs finaux, y compris pour les applications de développement et de test, afin que la fédération Entra soit configurée en un seul endroit.
references:
  - title: Scenario - Using Microsoft Entra ID to secure access to SAP platforms and applications
    url: https://learn.microsoft.com/en-us/entra/fundamentals/scenario-azure-first-sap-identity-integration
