id: az120-1a-supp-yn
objective: "1.1.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum is defining how its SAP Basis team will work with Microsoft support for the Azure subscriptions that host its SAP landscape.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum définit la façon dont son équipe SAP Basis travaillera avec le support Microsoft pour les abonnements Azure qui hébergent son paysage SAP.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Requesting a vCPU quota increase for M-series VMs requires a paid Azure support plan.
        fr: |
          Demander une augmentation de quota de processeurs virtuels pour des machines virtuelles de série M exige un plan de support Azure payant.
    - id: s2
      text:
        en: |
          A user who has only the Support Request Contributor role on a subscription can create support requests for that subscription.
        fr: |
          Un utilisateur qui dispose uniquement du rôle Support Request Contributor sur un abonnement peut créer des demandes de support pour cet abonnement.
    - id: s3
      text:
        en: |
          With the Developer support plan, the team can open Severity A requests for production outages.
        fr: |
          Avec le plan de support Developer, l'équipe peut ouvrir des demandes de gravité A pour des pannes de production.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Subscription management requests, including quota adjustments, are supported at no cost without a support plan; only technical support requires a plan. At subscription scope, Owner, Contributor and Support Request Contributor can create support requests. The maximum severity depends on the plan: Developer offers only Severity C during business hours.
    fr: |
      Les demandes de gestion d'abonnement, y compris les ajustements de quota, sont prises en charge gratuitement sans plan de support ; seul le support technique exige un plan. Au niveau de l'abonnement, Owner, Contributor et Support Request Contributor peuvent créer des demandes de support. La gravité maximale dépend du plan : Developer n'offre que la gravité C aux heures ouvrées.
references:
  - title: Create an Azure support request
    url: https://learn.microsoft.com/en-us/azure/azure-portal/supportability/how-to-create-azure-support-request
