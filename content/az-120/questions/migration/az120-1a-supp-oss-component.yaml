id: az120-1a-supp-oss-component
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind runs SAP NetWeaver on Red Hat Enterprise Linux virtual machines in Azure. The SAP Basis team suspects that an issue with the Azure infrastructure is causing intermittent performance problems on an application server. The team wants to open an incident with SAP so that SAP and Microsoft can work on it together.

    Which SAP component should the team use for the incident?
  fr: |
    Northwind exécute SAP NetWeaver sur des machines virtuelles Red Hat Enterprise Linux dans Azure. L'équipe SAP Basis soupçonne qu'un problème de l'infrastructure Azure provoque des problèmes de performances intermittents sur un serveur d'applications. L'équipe veut ouvrir un incident auprès de SAP pour que SAP et Microsoft le traitent ensemble.

    Quel composant SAP l'équipe doit-elle utiliser pour l'incident ?
body:
  options:
    - { id: a, text: BC-OP-NT-AZR }
    - { id: b, text: BC-DB-HDB }
    - { id: c, text: BC-OP-LNX-AZR }
    - { id: d, text: BC-OP-LNX-RH }
answer: { optionId: c }
explanation:
  correct:
    en: |
      SAP incidents about SAP systems on Azure use the Azure-specific operating system components: BC-OP-LNX-AZR for Linux and BC-OP-NT-AZR for Windows. The application server runs Red Hat Enterprise Linux on Azure, so the team uses BC-OP-LNX-AZR.
    fr: |
      Les incidents SAP concernant des systèmes SAP sur Azure utilisent les composants de système d'exploitation propres à Azure : BC-OP-LNX-AZR pour Linux et BC-OP-NT-AZR pour Windows. Le serveur d'applications s'exécute sous Red Hat Enterprise Linux sur Azure : l'équipe utilise donc BC-OP-LNX-AZR.
  options:
    a:
      en: |
        BC-OP-NT-AZR is the component for SAP systems on Windows in Azure.
      fr: |
        BC-OP-NT-AZR est le composant des systèmes SAP sous Windows dans Azure.
    b:
      en: |
        BC-DB-HDB is the SAP HANA database component; the issue concerns the Azure infrastructure of an application server.
      fr: |
        BC-DB-HDB est le composant de la base de données SAP HANA ; le problème concerne l'infrastructure Azure d'un serveur d'applications.
    d:
      en: |
        BC-OP-LNX-RH covers Red Hat Linux issues in general, not issues specific to Azure.
      fr: |
        BC-OP-LNX-RH couvre les problèmes Red Hat Linux en général, pas les problèmes propres à Azure.
references:
  - title: Explore licensing, pricing, and support of Azure for SAP workloads
    url: https://learn.microsoft.com/en-us/training/modules/explore-licensing-pricing-support/3-explore-licensing-pricing-support-azure-for-sap-workloads
