id: az120-1b-authn-linux-entra
objective: "1.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. plans to let its SAP administrators sign in over SSH to the SLES virtual machines of its SAP systems by using Microsoft Entra ID instead of local accounts.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. prévoit de permettre à ses administrateurs SAP de se connecter par SSH aux machines virtuelles SLES de ses systèmes SAP avec Microsoft Entra ID plutôt qu'avec des comptes locaux.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Each virtual machine needs a system-assigned managed identity for Microsoft Entra login to work.
        fr: Chaque machine virtuelle a besoin d'une identité managée affectée par le système pour que la connexion Microsoft Entra fonctionne.
    - id: s2
      text:
        en: An administrator who is assigned the Virtual Machine User Login role can run commands with sudo after signing in.
        fr: Un administrateur auquel le rôle Virtual Machine User Login est attribué peut exécuter des commandes avec sudo après sa connexion.
    - id: s3
      text:
        en: A Conditional Access policy that targets the Azure Linux VM Sign-In application can require multifactor authentication for these sign-ins.
        fr: Une stratégie d'accès conditionnel qui cible l'application Azure Linux VM Sign-In peut exiger l'authentification multifacteur pour ces connexions.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The AADSSHLoginForLinux extension requires a system-assigned managed identity on the VM. Virtual Machine User Login allows sign-in as a regular user without sudo; Virtual Machine Administrator Login is needed for sudo. Conditional Access can require MFA, a compliant device or a sign-in risk check through the Azure Linux VM Sign-In application.
    fr: L'extension AADSSHLoginForLinux exige une identité managée affectée par le système sur la machine virtuelle. Virtual Machine User Login permet la connexion en tant qu'utilisateur standard, sans sudo ; Virtual Machine Administrator Login est nécessaire pour sudo. L'accès conditionnel peut exiger l'authentification multifacteur, un appareil conforme ou une vérification du risque de connexion via l'application Azure Linux VM Sign-In.
references:
  - title: Sign in to a Linux virtual machine in Azure by using Microsoft Entra ID and OpenSSH
    url: https://learn.microsoft.com/en-us/entra/identity/devices/howto-vm-sign-in-azure-ad-linux
