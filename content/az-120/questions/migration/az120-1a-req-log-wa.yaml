id: az120-1a-req-log-wa
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You are deploying a production SAP HANA database on a Standard_M64s virtual machine. The /hana/log volume is a stripe set of three Premium SSD managed disks.

    You need to configure the log disks so that the volume meets the SAP HANA storage latency requirements.

    What should you configure on the log disks?
  fr: |
    Vous déployez une base de données SAP HANA de production sur une machine virtuelle Standard_M64s. Le volume /hana/log est un agrégat par bandes de trois disques managés SSD Premium.

    Vous devez configurer les disques du journal pour que le volume respecte les exigences de latence de stockage de SAP HANA.

    Que devez-vous configurer sur les disques du journal ?
body:
  options:
    - { id: a, text: { en: "Host caching set to ReadWrite on the three log disks", fr: "La mise en cache de l'hôte définie sur ReadWrite sur les trois disques du journal" } }
    - { id: b, text: { en: "Host caching set to ReadOnly on the three log disks", fr: "La mise en cache de l'hôte définie sur ReadOnly sur les trois disques du journal" } }
    - { id: c, text: { en: "On-demand disk bursting on the three log disks", fr: "Le mode rafale (bursting) à la demande sur les trois disques du journal" } }
    - { id: d, text: { en: "Write Accelerator with host caching set to None", fr: "Write Accelerator avec la mise en cache de l'hôte définie sur None" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      On M-series VMs with Premium SSD, Write Accelerator is mandatory for /hana/log: the common caching types don't meet the HANA log latency KPIs. Microsoft recommends no host caching on the log disks, which the portal shows as None + Write Accelerator.
    fr: |
      Sur les machines virtuelles de série M avec SSD Premium, Write Accelerator est obligatoire pour /hana/log : les types de cache courants ne respectent pas les KPI de latence du journal HANA. Microsoft recommande de ne pas utiliser de cache d'hôte sur les disques du journal, ce que le portail affiche sous la forme None + Write Accelerator.
  options:
    a:
      en: |
        ReadWrite caching isn't supported with Write Accelerator and doesn't meet the log latency requirement.
      fr: |
        La mise en cache ReadWrite n'est pas prise en charge avec Write Accelerator et ne respecte pas l'exigence de latence du journal.
    b:
      en: |
        Read caching doesn't help a write-heavy log volume; without Write Accelerator the KPIs aren't met.
      fr: |
        La mise en cache en lecture n'aide pas un volume de journal surtout sollicité en écriture ; sans Write Accelerator, les KPI ne sont pas respectés.
    c:
      en: |
        Bursting adds temporary throughput; it doesn't lower the write latency of each log I/O.
      fr: |
        Le mode rafale ajoute du débit temporaire ; il ne réduit pas la latence d'écriture de chaque E/S du journal.
references:
  - title: SAP HANA Azure virtual machine Premium SSD storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-premium-ssd-v1
  - title: Enable Write Accelerator
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/how-to-enable-write-accelerator
