id: az120-sr2-rise-network-1
objective: "1.3.1"
type: series_yesno
series: az120-sr2-rise-network
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You peer Hub1 with the SAP RISE virtual network, and the RISE side uses the remote gateway of Hub1.
  fr: |
    Vous créez un peering entre Hub1 et le réseau virtuel SAP RISE, et le côté RISE utilise la passerelle distante de Hub1.
body:
  solution:
    en: |
      You create a virtual network peering between **Hub1** and the SAP RISE virtual network by using the Azure resource ID that SAP provides, and SAP approves the peering. On Hub1 you enable **Allow gateway transit**, and SAP configures the RISE side of the peering to **use the remote gateway** of Hub1.
    fr: |
      Vous créez un peering de réseaux virtuels entre **Hub1** et le réseau virtuel SAP RISE à l'aide de l'ID de ressource Azure fourni par SAP, et SAP approuve le peering. Sur Hub1, vous activez **Allow gateway transit**, et SAP configure le côté RISE du peering pour **utiliser la passerelle distante** de Hub1.
answer: { value: true }
explanation:
  correct:
    en: |
      Virtual network peering is the preferred connectivity to SAP RISE: it keeps traffic on private addresses and gives the lowest latency and highest throughput. Because RISE runs in SAP's tenant, the peering is a cross-tenant peering set up with the SAP-provided resource ID and approved by SAP. With gateway transit, the RISE network acts as a spoke of Hub1, so on-premises users reach it through the existing ExpressRoute gateway.
    fr: |
      Le peering de réseaux virtuels est la connectivité privilégiée vers SAP RISE : il conserve le trafic sur des adresses privées et offre la latence la plus faible et le débit le plus élevé. Comme RISE s'exécute dans le locataire de SAP, il s'agit d'un peering entre locataires créé avec l'ID de ressource fourni par SAP et approuvé par SAP. Avec le transit par passerelle, le réseau RISE se comporte comme un spoke de Hub1 : les utilisateurs locaux l'atteignent via la passerelle ExpressRoute existante.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
