id: az120-1b-tool-match-task
objective: "1.1.9"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. plans the migration of several SAP systems to Azure.

    Which tool should you use for each task? To answer, drag the appropriate tools to the correct tasks. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. planifie la migration de plusieurs systèmes SAP vers Azure.

    Quel outil devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les outils appropriés vers les tâches correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: swpm, text: "Software Provisioning Manager (SWPM)" }
    - { id: dmo, text: { en: "Software Update Manager (SUM) with DMO", fr: "Software Update Manager (SUM) avec DMO" } }
    - { id: script, text: dmotocloud.sh }
    - { id: azcopy, text: AzCopy }
    - { id: asr, text: Azure Site Recovery }
  targets:
    - id: t1
      text: { en: "Export and import the database of an SAP system for an OS/DB migration to SQL Server", fr: "Exporter et importer la base de données d'un système SAP pour une migration de système d'exploitation et de SGBD vers SQL Server" }
    - id: t2
      text: { en: "Upgrade SAP ERP and migrate its database to SAP HANA in one procedure", fr: "Mettre à niveau SAP ERP et migrer sa base de données vers SAP HANA en une seule procédure" }
    - id: t3
      text: { en: "Send each export file of a DMO with System Move run to Azure as soon as it is exported", fr: "Envoyer vers Azure chaque fichier d'export d'une exécution DMO with System Move dès qu'il est exporté" }
    - id: t4
      text: { en: "Upload R3load dump files to Azure Blob Storage over the internet", fr: "Charger des fichiers de vidage R3load vers le Stockage Blob Azure par Internet" }
answer:
  mapping: { t1: swpm, t2: dmo, t3: script, t4: azcopy }
explanation:
  correct:
    en: SWPM performs the classical heterogeneous system copy (R3load export and import) to any target DBMS. SUM with DMO combines the upgrade and the migration to SAP HANA. The dmotocloud.sh script implements the parallel transfer mode of DMO with System Move. AzCopy copies R3load dump files to Blob Storage, often faster than over ExpressRoute for very large databases. Azure Site Recovery replicates virtual machines and is not a database migration tool.
    fr: "SWPM effectue la copie système hétérogène classique (export et import R3load) vers n'importe quel SGBD cible. SUM avec DMO combine la mise à niveau et la migration vers SAP HANA. Le script dmotocloud.sh met en œuvre le mode de transfert parallèle de DMO with System Move. AzCopy copie les fichiers de vidage R3load vers le Stockage Blob, souvent plus vite que par ExpressRoute pour les très grandes bases de données. Azure Site Recovery réplique des machines virtuelles et n'est pas un outil de migration de base de données."
references:
  - title: Compare classical migration with the SAP database migration option (DMO)
    url: https://learn.microsoft.com/en-us/training/modules/explore-migration-options/4-compare-classic-vs-sap-database-move-only
  - title: Optimize network upload
    url: https://learn.microsoft.com/en-us/training/modules/migrate-very-large-databases-to-azure/5-optimize-network-upload
