id: az120-1c-lz-anf-delegated-subnet
objective: "1.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. has an SAP production landing zone that contains a spoke virtual network named **VNet-SAP-PRD**. VNet-SAP-PRD contains a subnet named **snet-anf** that is delegated to Azure NetApp Files and hosts the `/sapmnt` volumes of the SAP system PR1.

    Fabrikam will deploy a second SAP system named PR2 in VNet-SAP-PRD. The HANA data and log volumes of PR2 will use Azure NetApp Files. The network team wants to keep the volumes of PR2 separate from those of PR1.

    You need to recommend where to create the Azure NetApp Files volumes of PR2. The volume creation must succeed.

    What should you recommend?
  fr: |
    Fabrikam, Inc. dispose d'une zone d'atterrissage SAP de production qui contient un réseau virtuel spoke nommé **VNet-SAP-PRD**. VNet-SAP-PRD contient un sous-réseau nommé **snet-anf**, délégué à Azure NetApp Files, qui héberge les volumes `/sapmnt` du système SAP PR1.

    Fabrikam va déployer un deuxième système SAP nommé PR2 dans VNet-SAP-PRD. Les volumes de données et de journaux HANA de PR2 utiliseront Azure NetApp Files. L'équipe réseau souhaite séparer les volumes de PR2 de ceux de PR1.

    Vous devez recommander où créer les volumes Azure NetApp Files de PR2. La création des volumes doit réussir.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Create a second subnet in VNet-SAP-PRD that is delegated to Microsoft.NetApp/volumes.", fr: "Créer dans VNet-SAP-PRD un deuxième sous-réseau délégué à Microsoft.NetApp/volumes." }
    - id: b
      text: { en: "Enable a Microsoft.Storage service endpoint on the database subnet and create the volumes there.", fr: "Activer un point de terminaison de service Microsoft.Storage sur le sous-réseau de base de données et y créer les volumes." }
    - id: c
      text: { en: "Create the volumes in snet-anf and separate them by using a different capacity pool.", fr: "Créer les volumes dans snet-anf et les séparer en utilisant un autre pool de capacité." }
    - id: d
      text: { en: "Delegate the database subnet of VNet-SAP-PRD to Azure NetApp Files as well.", fr: "Déléguer également à Azure NetApp Files le sous-réseau de base de données de VNet-SAP-PRD." }
answer: { optionId: c }
explanation:
  correct:
    en: In each virtual network, only one subnet can be delegated to Azure NetApp Files. Azure lets you create more delegated subnets, but creating a new volume then fails. Keep all the volumes of the VNet in snet-anf and use separate capacity pools (or volumes) to organize PR2 apart from PR1.
    fr: "Dans chaque réseau virtuel, un seul sous-réseau peut être délégué à Azure NetApp Files. Azure permet de créer d'autres sous-réseaux délégués, mais la création d'un nouveau volume échoue alors. Conservez tous les volumes du réseau virtuel dans snet-anf et utilisez des pools de capacité (ou des volumes) distincts pour séparer PR2 de PR1."
  options:
    a:
      en: A second subnet delegated to Azure NetApp Files in the same VNet makes new volume creation fail.
      fr: Un deuxième sous-réseau délégué à Azure NetApp Files dans le même réseau virtuel fait échouer la création de nouveaux volumes.
    b:
      en: Azure NetApp Files volumes are created only in a subnet delegated to Microsoft.NetApp/volumes; a storage service endpoint does not host volumes.
      fr: Les volumes Azure NetApp Files ne se créent que dans un sous-réseau délégué à Microsoft.NetApp/volumes ; un point de terminaison de service de stockage n'héberge pas de volumes.
    d:
      en: Delegating the database subnet creates a second delegated subnet in the same VNet, with the same failure, and the subnet could no longer host the database VMs.
      fr: Déléguer le sous-réseau de base de données crée un deuxième sous-réseau délégué dans le même réseau virtuel, avec le même échec, et le sous-réseau ne pourrait plus héberger les machines virtuelles de base de données.
references:
