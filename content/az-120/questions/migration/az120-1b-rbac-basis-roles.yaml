id: az120-1b-rbac-basis-roles
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The non-production SAP systems of Litware, Inc. run on SLES virtual machines in a resource group named **rg-sap-dev**. Microsoft Entra login is enabled on the virtual machines.

    The SAP Basis team must be able to:

    - start, stop and resize the virtual machines;
    - sign in to the virtual machines with their Microsoft Entra credentials and run commands with sudo.

    The team must not be able to modify the virtual networks or to assign roles. You need to assign roles to the team at the scope of rg-sap-dev. The solution must follow the principle of least privilege.

    Which two roles should you assign?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les systèmes SAP hors production de Litware, Inc. s'exécutent sur des machines virtuelles SLES dans un groupe de ressources nommé **rg-sap-dev**. La connexion Microsoft Entra est activée sur les machines virtuelles.

    L'équipe SAP Basis doit pouvoir :

    - démarrer, arrêter et redimensionner les machines virtuelles ;
    - se connecter aux machines virtuelles avec ses informations d'identification Microsoft Entra et exécuter des commandes avec sudo.

    L'équipe ne doit pas pouvoir modifier les réseaux virtuels ni attribuer des rôles. Vous devez attribuer des rôles à l'équipe à l'étendue de rg-sap-dev. La solution doit respecter le principe du moindre privilège.

    Quels sont les deux rôles à attribuer ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Virtual Machine Contributor }
    - { id: b, text: Virtual Machine Administrator Login }
    - { id: c, text: Contributor }
    - { id: d, text: Virtual Machine User Login }
    - { id: e, text: Owner }
    - { id: f, text: Network Contributor }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: Virtual Machine Contributor lets the team manage the virtual machines (start, stop, resize) but not the virtual network or storage they're connected to, and it doesn't allow role assignments. Signing in with Microsoft Entra ID requires a separate login role; Virtual Machine Administrator Login is the one that allows sudo.
    fr: Virtual Machine Contributor permet à l'équipe de gérer les machines virtuelles (démarrer, arrêter, redimensionner), mais pas le réseau virtuel ni le stockage auxquels elles sont connectées, et ne permet pas d'attribuer des rôles. La connexion avec Microsoft Entra ID exige un rôle de connexion distinct ; Virtual Machine Administrator Login est celui qui autorise sudo.
  options:
    c: { en: "Contributor also allows changing the virtual networks in the resource group, and it doesn't grant SSH login.", fr: "Contributor permet aussi de modifier les réseaux virtuels du groupe de ressources, et il n'accorde pas la connexion SSH." }
    d: { en: "Virtual Machine User Login allows sign-in as a regular user, without sudo.", fr: "Virtual Machine User Login permet la connexion en tant qu'utilisateur standard, sans sudo." }
    e: { en: "Owner allows role assignments and network changes, and it doesn't grant SSH login either.", fr: "Owner permet d'attribuer des rôles et de modifier le réseau, et il n'accorde pas non plus la connexion SSH." }
    f: { en: "Network Contributor manages networks, which the team must not do.", fr: "Network Contributor gère les réseaux, ce que l'équipe ne doit pas faire." }
references:
  - title: Azure built-in roles for Compute
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/compute
  - title: Sign in to a Linux virtual machine in Azure by using Microsoft Entra ID and OpenSSH
    url: https://learn.microsoft.com/en-us/entra/identity/devices/howto-vm-sign-in-azure-ad-linux
