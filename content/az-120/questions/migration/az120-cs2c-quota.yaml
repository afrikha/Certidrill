id: az120-cs2c-quota
objective: "1.1.4"
type: single
caseStudy: az120-cs2c-litware
difficulty: 1
status: draft
stem:
  en: |
    You need to ensure that the six application server VMs of LE1 can be deployed. The solution must meet the deployment requirements.

    What should you do first?
  fr: |
    Vous devez vous assurer que les six machines virtuelles de serveur d'applications de LE1 peuvent être déployées. La solution doit respecter les exigences de déploiement.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Request an increase of the Total Regional vCPUs quota of Sub-SAP-PRD to at least 448", fr: "Demander une augmentation du quota Total Regional vCPUs de Sub-SAP-PRD à au moins 448" } }
    - { id: b, text: { en: "Create an on-demand capacity reservation for six Standard_E32ds_v5 VMs", fr: "Créer une réservation de capacité à la demande pour six machines virtuelles Standard_E32ds_v5" } }
    - { id: c, text: { en: "Keep the two pilot VMs deallocated during the deployment", fr: "Laisser les deux machines virtuelles pilotes libérées pendant le déploiement" } }
    - { id: d, text: { en: "Request an increase of the Standard EDSv5 Family vCPUs quota of Sub-SAP-PRD to at least 256", fr: "Demander une augmentation du quota Standard EDSv5 Family vCPUs de Sub-SAP-PRD à au moins 256" } }
answer: { optionId: d }
explanation:
  correct:
    en: A deployment must fit both the Total Regional vCPUs quota and the VM-family quota of the subscription in the region. Six Standard_E32ds_v5 VMs need 192 vCPUs; with the 64 vCPUs of the pilot VMs, the EDSv5 family needs 256 vCPUs, above its limit of 100. The regional total of 256 is already below its limit of 350.
    fr: Un déploiement doit respecter à la fois le quota Total Regional vCPUs et le quota de famille de machines virtuelles de l'abonnement dans la région. Six machines virtuelles Standard_E32ds_v5 nécessitent 192 processeurs virtuels ; avec les 64 des machines virtuelles pilotes, la famille EDSv5 a besoin de 256 processeurs virtuels, au-dessus de sa limite de 100. Le total régional de 256 est déjà inférieur à sa limite de 350.
  options:
    a: { en: "The regional quota is not the blocking limit: 256 vCPUs fit in the current limit of 350.", fr: "Le quota régional n'est pas la limite bloquante : 256 processeurs virtuels tiennent dans la limite actuelle de 350." }
    b: { en: "Creating a capacity reservation requires quota in the same way as creating VMs, so it fails for the same reason.", fr: "La création d'une réservation de capacité exige du quota, comme la création de machines virtuelles : elle échoue pour la même raison." }
    c: { en: "Deallocated VMs still count against the vCPU quota.", fr: "Les machines virtuelles libérées sont toujours décomptées du quota de processeurs virtuels." }
references:
  - title: Check vCPU quotas
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/quotas
  - title: On-demand capacity reservation
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/capacity-reservation-overview
