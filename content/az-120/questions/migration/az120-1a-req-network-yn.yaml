id: az120-1a-req-network-yn
objective: "1.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Tailspin is defining the network requirements of SAP NetWeaver virtual machines on Azure. The ASCS instance and each application server use SAP virtual host names.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin définit les exigences réseau de machines virtuelles SAP NetWeaver sur Azure. L'instance ASCS et chaque serveur d'applications utilisent des noms d'hôte virtuels SAP.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Accelerated Networking should be enabled on every NIC of the SAP VMs where the VM size supports it.
        fr: |
          La mise en réseau accélérée (Accelerated Networking) doit être activée sur chaque carte réseau des machines virtuelles SAP lorsque la taille de machine virtuelle la prend en charge.
    - id: s2
      text:
        en: |
          Adding a second network interface to a VM increases the network bandwidth available to the VM.
        fr: |
          Ajouter une seconde interface réseau à une machine virtuelle augmente la bande passante réseau disponible pour la machine virtuelle.
    - id: s3
      text:
        en: |
          Secondary IP addresses on a network interface can be used for the SAP virtual host names.
        fr: |
          Des adresses IP secondaires sur une interface réseau peuvent être utilisées pour les noms d'hôte virtuels SAP.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Microsoft recommends Accelerated Networking on all the NICs of SAP VMs where it's technically possible. All the NICs of a VM share the VM's bandwidth, so extra NICs only serve subnet separation. Secondary IP configurations assigned in Azure are the usual way to provide the IP addresses of SAP virtual host names; don't set static IP addresses inside the guest OS.
    fr: |
      Microsoft recommande la mise en réseau accélérée sur toutes les cartes réseau des machines virtuelles SAP lorsque c'est techniquement possible. Toutes les cartes réseau d'une machine virtuelle partagent la bande passante de celle-ci : des cartes supplémentaires ne servent qu'à séparer les sous-réseaux. Les configurations IP secondaires définies dans Azure sont la méthode habituelle pour fournir les adresses IP des noms d'hôte virtuels SAP ; ne définissez pas d'adresses IP statiques dans le système d'exploitation invité.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
