id: az120-1b-hier-rg-design
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. will run three SAP systems (ERP, BW and GRC) in its SAP production subscription. Each system is deployed, patched, resized and eventually decommissioned on its own schedule, and the SAP Basis team wants to report costs and delegate access per system.

    You need to design the resource groups.

    What should you recommend?
  fr: |
    Litware, Inc. exécutera trois systèmes SAP (ERP, BW et GRC) dans son abonnement SAP de production. Chaque système est déployé, corrigé, redimensionné et finalement décommissionné selon son propre calendrier, et l'équipe SAP Basis veut suivre les coûts et déléguer l'accès par système.

    Vous devez concevoir les groupes de ressources.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "One resource group per SAP system, containing its VMs, disks, network interfaces and load balancer", fr: "Un groupe de ressources par système SAP, contenant ses machines virtuelles, disques, interfaces réseau et équilibreur de charge" } }
    - { id: b, text: { en: "One resource group per resource type, such as all the VMs in one and all the disks in another", fr: "Un groupe de ressources par type de ressource, par exemple toutes les machines virtuelles dans l'un et tous les disques dans un autre" } }
    - { id: c, text: { en: "One resource group for the three SAP systems, with the systems identified by tags only", fr: "Un groupe de ressources pour les trois systèmes SAP, les systèmes étant identifiés uniquement par des étiquettes" } }
    - { id: d, text: { en: "One resource group per Azure region, shared by all the SAP systems in that region", fr: "Un groupe de ressources par région Azure, partagé par tous les systèmes SAP de la région" } }
answer: { optionId: a }
explanation:
  correct:
    en: Resources in a resource group should share the same lifecycle, so that you deploy, update and delete them together. A resource group per SAP system groups the resources that share a lifecycle and gives a natural scope for role assignments and cost reporting; the SAP landscape guidance also aligns each system's load balancer with the SAP system and its resource group.
    fr: Les ressources d'un groupe de ressources doivent partager le même cycle de vie, afin d'être déployées, mises à jour et supprimées ensemble. Un groupe de ressources par système SAP regroupe les ressources qui partagent un cycle de vie et fournit une étendue naturelle pour les attributions de rôle et le suivi des coûts ; les recommandations de paysage SAP alignent aussi l'équilibreur de charge de chaque système sur le système SAP et son groupe de ressources.
  options:
    b:
      en: Grouping by resource type splits each SAP system across several resource groups, so no group matches a system's lifecycle or access needs.
      fr: Le regroupement par type de ressource répartit chaque système SAP sur plusieurs groupes de ressources ; aucun groupe ne correspond alors au cycle de vie ni aux besoins d'accès d'un système.
    c:
      en: A shared resource group mixes three lifecycles and can't delegate access per system with a resource group scope.
      fr: Un groupe de ressources partagé mélange trois cycles de vie et ne permet pas de déléguer l'accès par système avec une étendue de groupe de ressources.
    d:
      en: A region doesn't match the lifecycle of any SAP system, and it gives no per-system scope for access or costs.
      fr: Une région ne correspond au cycle de vie d'aucun système SAP et ne fournit aucune étendue par système pour l'accès ou les coûts.
references:
  - title: What is Azure Resource Manager?
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
  - title: SAP landscape architecture
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/sap/sap-whole-landscape
