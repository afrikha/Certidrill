id: az120-1a-lic-ahb-windows
objective: "1.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs SAP application servers on Windows Server virtual machines in Azure. Adatum wants to use Azure Hybrid Benefit for Windows Server for these VMs.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute des serveurs d'applications SAP sur des machines virtuelles Windows Server dans Azure. Adatum veut utiliser Azure Hybrid Benefit pour Windows Server pour ces machines virtuelles.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Adatum needs Windows Server core licenses with active Software Assurance or qualifying subscription licenses.", fr: "Adatum a besoin de licences de cœurs Windows Server avec Software Assurance active ou de licences d'abonnement éligibles." } }
    - { id: b, text: { en: "Enabling the benefit on an existing VM requires redeploying it from an image.", fr: "Activer l'avantage sur une machine virtuelle existante exige de la redéployer à partir d'une image." } }
    - { id: c, text: { en: "A VM with four vCPUs requires a minimum of eight core licenses.", fr: "Une machine virtuelle à quatre processeurs virtuels exige au minimum huit licences de cœurs." } }
    - { id: d, text: { en: "One Windows Server processor license covers eight cores.", fr: "Une licence de processeur Windows Server couvre huit cœurs." } }
    - { id: e, text: { en: "The benefit can't be used on VMs that also run SQL Server.", fr: "L'avantage ne peut pas être utilisé sur des machines virtuelles qui exécutent aussi SQL Server." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Azure Hybrid Benefit for Windows Server requires core licenses with active Software Assurance or qualifying subscription licenses. Each VM needs at least eight core licenses, so a four-core VM still consumes eight; larger VMs need one license per core.
    fr: |
      Azure Hybrid Benefit pour Windows Server exige des licences de cœurs avec Software Assurance active ou des licences d'abonnement éligibles. Chaque machine virtuelle nécessite au moins huit licences de cœurs : une machine virtuelle à quatre cœurs en consomme quand même huit ; les machines virtuelles plus grandes nécessitent une licence par cœur.
  options:
    b:
      en: |
        Changing the license type only changes a licensing flag; it doesn't restart or redeploy the VM.
      fr: |
        Changer le type de licence ne modifie qu'un indicateur de licence ; cela ne redémarre ni ne redéploie la machine virtuelle.
    d:
      en: |
        Each processor license equals 16 core licenses.
      fr: |
        Chaque licence de processeur équivaut à 16 licences de cœurs.
    e:
      en: |
        The benefit works with any VM running Windows Server, including VMs that run SQL Server.
      fr: |
        L'avantage fonctionne avec toute machine virtuelle exécutant Windows Server, y compris celles qui exécutent SQL Server.
references:
  - title: Explore Azure Hybrid Benefit for Windows VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/hybrid-use-benefit-licensing
