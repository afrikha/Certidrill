id: az120-1c-rise-data-ilm-store
objective: "1.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation runs SAP S/4HANA and wants SAP Information Lifecycle Management (ILM) to store archive files and attachments in an Azure Blob Storage account named **stilmadatum** in an Adatum subscription.

    You are preparing stilmadatum by following the Microsoft guidance for SAP ILM. The SAP system must be the only principal that can access the account, and the account must follow the recommended security settings.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation exécute SAP S/4HANA et souhaite que SAP Information Lifecycle Management (ILM) stocke les fichiers d'archive et les pièces jointes dans un compte Stockage Blob Azure nommé **stilmadatum** d'un abonnement Adatum.

    Vous préparez stilmadatum en suivant les recommandations de Microsoft pour SAP ILM. Le système SAP doit être le seul principal à pouvoir accéder au compte, et le compte doit respecter les paramètres de sécurité recommandés.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Identity used by the SAP ILM Store: [[auth]]

      Role assigned to that identity on stilmadatum: [[role]]

      Account settings: [[set]]
    fr: |
      Identité utilisée par le magasin SAP ILM : [[auth]]

      Rôle attribué à cette identité sur stilmadatum : [[role]]

      Paramètres du compte : [[set]]
  slots:
    - id: auth
      options:
        - { id: app, text: { en: "An application registered in Microsoft Entra ID, with a client secret", fr: "Une application inscrite dans Microsoft Entra ID, avec un secret client" } }
        - { id: key, text: { en: "The storage account access key", fr: "La clé d'accès du compte de stockage" } }
        - { id: sas, text: { en: "An account SAS with read and write permissions", fr: "Une SAS de compte avec les autorisations de lecture et d'écriture" } }
        - { id: anon, text: { en: "Anonymous access to the archive container", fr: "L'accès anonyme au conteneur d'archive" } }
    - id: role
      options:
        - { id: sbdc, text: Storage Blob Data Contributor }
        - { id: sbdr, text: Storage Blob Data Reader }
        - { id: sac, text: Storage Account Contributor }
        - { id: rdr, text: Reader }
    - id: set
      options:
        - { id: both, text: { en: "Storage account key access disabled and blob anonymous access disabled", fr: "Accès par clé du compte de stockage désactivé et accès anonyme aux blobs désactivé" } }
        - { id: keyon, text: { en: "Storage account key access enabled and blob anonymous access disabled", fr: "Accès par clé du compte de stockage activé et accès anonyme aux blobs désactivé" } }
        - { id: anonon, text: { en: "Storage account key access disabled and blob anonymous access enabled", fr: "Accès par clé du compte de stockage désactivé et accès anonyme aux blobs activé" } }
answer:
  values: { auth: app, role: sbdc, set: both }
explanation:
  correct:
    en: |
      The SAP ILM guidance registers an application in Microsoft Entra ID with a client secret and assigns it the Storage Blob Data Contributor role on the storage account, so ILM can write and read archive files. The account enables secure transfer, sets blob public access and storage account key access to false and the minimum TLS version to 1.2, and no other user has access apart from the registered application.
    fr: |
      Les recommandations SAP ILM inscrivent une application dans Microsoft Entra ID avec un secret client et lui attribuent le rôle Storage Blob Data Contributor sur le compte de stockage, afin qu'ILM puisse écrire et lire les fichiers d'archive. Le compte active le transfert sécurisé, définit l'accès public aux blobs et l'accès par clé du compte de stockage sur false et la version TLS minimale sur 1.2, et aucun autre utilisateur n'y a accès en dehors de l'application inscrite.
  options:
    key:
      en: |
        Key-based access is disabled in the recommended configuration, and the key grants full access to anyone who holds it.
      fr: |
        L'accès par clé est désactivé dans la configuration recommandée, et la clé donne un accès complet à quiconque la détient.
    sbdr:
      en: |
        ILM must write archive files; a reader role cannot write.
      fr: |
        ILM doit écrire des fichiers d'archive ; un rôle de lecture ne peut pas écrire.
    sac:
      en: |
        Storage Account Contributor manages the account but does not grant data access through Microsoft Entra ID.
      fr: |
        Storage Account Contributor gère le compte mais n'accorde pas l'accès aux données par Microsoft Entra ID.
references:
  - title: SAP Information Lifecycle Management with Microsoft Azure Blob Storage
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-information-lifecycle-management
