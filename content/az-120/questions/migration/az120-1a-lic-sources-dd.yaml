id: az120-1a-lic-sources-dd
objective: "1.1.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso is preparing the licensing plan for its SAP landscape on Azure virtual machines:

    - The SAP S/4HANA system uses SAP HANA on SUSE Linux Enterprise Server for SAP Applications. Contoso has no SUSE subscriptions and will deploy the HANA VMs from a pay-as-you-go Azure Marketplace image.
    - The SAP Web Dispatcher VMs run Red Hat Enterprise Linux, for which Contoso already owns Red Hat subscriptions.
    - A Windows Server file server is covered by existing Windows Server core licenses with active Software Assurance.

    How should each license be obtained? To answer, drag the appropriate licensing methods to the correct components. Each method may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prépare le plan de licences de son paysage SAP sur des machines virtuelles Azure :

    - Le système SAP S/4HANA utilise SAP HANA sous SUSE Linux Enterprise Server for SAP Applications. Contoso n'a pas d'abonnement SUSE et déploiera les machines virtuelles HANA à partir d'une image de paiement à l'utilisation de la Place de marché Azure.
    - Les machines virtuelles SAP Web Dispatcher exécutent Red Hat Enterprise Linux, pour lequel Contoso possède déjà des abonnements Red Hat.
    - Un serveur de fichiers Windows Server est couvert par des licences de cœurs Windows Server existantes avec Software Assurance active.

    Comment chaque licence doit-elle être obtenue ? Pour répondre, faites glisser les méthodes de licence appropriées vers les composants correspondants. Chaque méthode peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: sap, text: { en: "Procured by Contoso under its SAP license agreement", fr: "Acquise par Contoso dans le cadre de son contrat de licence SAP" } }
    - { id: payg, text: { en: "Included in the pay-as-you-go price of the Marketplace image", fr: "Incluse dans le prix de paiement à l'utilisation de l'image de la Place de marché" } }
    - { id: ahbw, text: { en: "Azure Hybrid Benefit for Windows Server", fr: "Azure Hybrid Benefit pour Windows Server" } }
    - { id: byos, text: { en: "Bring your own subscription through Red Hat Cloud Access", fr: "Utilisation de son propre abonnement (BYOS) via Red Hat Cloud Access" } }
    - { id: ri, text: { en: "Included in a reserved VM instance", fr: "Incluse dans une instance de machine virtuelle réservée" } }
  targets:
    - id: s4
      text: { en: "SAP S/4HANA and SAP HANA software", fr: "Logiciels SAP S/4HANA et SAP HANA" }
    - id: sles
      text: { en: "SUSE Linux Enterprise Server for SAP Applications on the HANA VMs", fr: "SUSE Linux Enterprise Server for SAP Applications sur les machines virtuelles HANA" }
    - id: rhel
      text: { en: "Red Hat Enterprise Linux on the Web Dispatcher VMs", fr: "Red Hat Enterprise Linux sur les machines virtuelles Web Dispatcher" }
    - id: win
      text: { en: "Windows Server on the file server VM", fr: "Windows Server sur la machine virtuelle du serveur de fichiers" }
answer:
  mapping: { s4: sap, sles: payg, rhel: byos, win: ahbw }
explanation:
  correct:
    en: |
      Customers must procure the licenses of the SAP software they deploy on Azure (SAP Note 1380654). A pay-as-you-go Marketplace image includes the OS software fee in the VM price. Existing Red Hat subscriptions are used on Azure through Red Hat Cloud Access (BYOS), and Windows Server licenses with Software Assurance through Azure Hybrid Benefit.
    fr: |
      Les clients doivent acquérir les licences des logiciels SAP qu'ils déploient sur Azure (note SAP 1380654). Une image de paiement à l'utilisation de la Place de marché inclut les frais du logiciel du système d'exploitation dans le prix de la machine virtuelle. Les abonnements Red Hat existants s'utilisent sur Azure via Red Hat Cloud Access (BYOS), et les licences Windows Server avec Software Assurance via Azure Hybrid Benefit.
  options:
    ri:
      en: |
        A reserved VM instance covers only the compute part of VM usage, not software licenses.
      fr: |
        Une instance de machine virtuelle réservée ne couvre que la partie calcul de l'utilisation des machines virtuelles, pas les licences logicielles.
references:
  - title: Explore licensing, pricing, and support of Azure for SAP workloads
    url: https://learn.microsoft.com/en-us/training/modules/explore-licensing-pricing-support/3-explore-licensing-pricing-support-azure-for-sap-workloads
  - title: Azure Hybrid Benefit for Linux virtual machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/azure-hybrid-benefit-linux
