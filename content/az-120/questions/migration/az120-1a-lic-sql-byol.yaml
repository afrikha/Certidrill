id: az120-1a-lic-sql-byol
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam will run the SQL Server database of its SAP ERP system on an Azure virtual machine. Fabrikam owns SQL Server Enterprise core licenses with active Software Assurance and wants to use them in Azure. An administrator can't find a bring-your-own-license (BYOL) SQL Server image in Azure Marketplace.

    You need to deploy the VM so that Fabrikam doesn't pay for the SQL Server license through Azure.

    What should you do?
  fr: |
    Fabrikam exécutera la base de données SQL Server de son système SAP ERP sur une machine virtuelle Azure. Fabrikam possède des licences de cœurs SQL Server Enterprise avec Software Assurance active et veut les utiliser dans Azure. Un administrateur ne trouve pas d'image SQL Server BYOL (licence personnelle) dans la Place de marché Azure.

    Vous devez déployer la machine virtuelle de façon que Fabrikam ne paie pas la licence SQL Server via Azure.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Deploy a SQL Server Developer image and set the license type to Azure Hybrid Benefit", fr: "Déployer une image SQL Server Developer et définir le type de licence sur Azure Hybrid Benefit" } }
    - { id: b, text: { en: "Deploy a SQL Server Enterprise image and set the license type to Azure Hybrid Benefit", fr: "Déployer une image SQL Server Enterprise et définir le type de licence sur Azure Hybrid Benefit" } }
    - { id: c, text: { en: "Deploy a Windows Server image and set licenseType to Windows_Server", fr: "Déployer une image Windows Server et définir licenseType sur Windows_Server" } }
    - { id: d, text: { en: "Deploy a SQL Server Enterprise image and set the license type to HA/DR", fr: "Déployer une image SQL Server Enterprise et définir le type de licence sur HA/DR" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      BYOL SQL Server images are retired from Azure Marketplace. You deploy a Standard or Enterprise edition image and switch the license model to Azure Hybrid Benefit, at deployment or later, through the SQL IaaS Agent extension. Software Assurance is required for this license type.
    fr: |
      Les images SQL Server BYOL ont été retirées de la Place de marché Azure. Vous déployez une image d'édition Standard ou Enterprise et basculez le modèle de licence vers Azure Hybrid Benefit, au déploiement ou plus tard, grâce à l'extension SQL IaaS Agent. La Software Assurance est requise pour ce type de licence.
  options:
    a:
      en: |
        License model changes are supported only for the Standard and Enterprise editions; Developer edition can't be used for production anyway.
      fr: |
        Les changements de modèle de licence ne sont pris en charge que pour les éditions Standard et Enterprise ; l'édition Developer ne peut de toute façon pas servir en production.
    c:
      en: |
        Windows_Server applies Azure Hybrid Benefit to the Windows Server license only, not to SQL Server.
      fr: |
        Windows_Server applique Azure Hybrid Benefit uniquement à la licence Windows Server, pas à SQL Server.
    d:
      en: |
        The HA/DR license type is for a passive replica, not for the active database server.
      fr: |
        Le type de licence HA/DR concerne un réplica passif, pas le serveur de base de données actif.
references:
  - title: Change the license model for a SQL virtual machine in Azure
    url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/licensing-model-azure-hybrid-benefit-ahb-change
