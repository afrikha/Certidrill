id: az120-1b-hier-settings
objective: "1.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has finished building its management group hierarchy for the SAP landing zones. Today, any user in the tenant can create management groups, and new subscriptions, such as Visual Studio subscriptions created by developers, appear under the tenant root group.

    You need to ensure that only privileged users can create or change management groups, and that new subscriptions are placed in the Sandbox management group.

    Which two actions should you perform?

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank a terminé la construction de sa hiérarchie de groupes d'administration pour les zones d'atterrissage SAP. Aujourd'hui, tout utilisateur du locataire peut créer des groupes d'administration, et les nouveaux abonnements, comme les abonnements Visual Studio créés par les développeurs, apparaissent sous le Groupe racine du locataire.

    Vous devez vous assurer que seuls les utilisateurs privilégiés peuvent créer ou modifier des groupes d'administration, et que les nouveaux abonnements sont placés dans le groupe d'administration Sandbox.

    Quelles sont les deux actions à effectuer ?

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "In the hierarchy settings, require Azure RBAC authorization for management group operations.", fr: "Dans les paramètres de hiérarchie, exiger l'autorisation Azure RBAC pour les opérations sur les groupes d'administration." } }
    - { id: b, text: { en: "In the hierarchy settings, set Sandbox as the default management group for new subscriptions.", fr: "Dans les paramètres de hiérarchie, définir Sandbox comme groupe d'administration par défaut des nouveaux abonnements." } }
    - { id: c, text: { en: "Move the tenant root group under the Sandbox management group.", fr: "Déplacer le Groupe racine du locataire sous le groupe d'administration Sandbox." } }
    - { id: d, text: { en: "Assign the Management Group Contributor role to the platform team at the tenant root group.", fr: "Attribuer le rôle Management Group Contributor à l'équipe de plateforme sur le Groupe racine du locataire." } }
    - { id: e, text: { en: "Create a remediation task at the tenant root group for the existing subscriptions.", fr: "Créer une tâche de correction sur le Groupe racine du locataire pour les abonnements existants." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: By default, any principal in the tenant can create management groups; enabling Azure RBAC authorization in the hierarchy settings limits creation and changes to users with the right permissions. Configuring a dedicated default management group, such as Sandbox, prevents new subscriptions from landing under the root.
    fr: Par défaut, tout principal du locataire peut créer des groupes d'administration ; activer l'autorisation Azure RBAC dans les paramètres de hiérarchie limite la création et les modifications aux utilisateurs disposant des autorisations nécessaires. Configurer un groupe d'administration par défaut dédié, comme Sandbox, évite que les nouveaux abonnements atterrissent sous la racine.
  options:
    c: { en: "The root management group can't be moved or deleted.", fr: "Le groupe d'administration racine ne peut être ni déplacé ni supprimé." }
    d: { en: "Granting a role to the platform team doesn't stop other users from creating management groups while authorization isn't required.", fr: "Accorder un rôle à l'équipe de plateforme n'empêche pas les autres utilisateurs de créer des groupes d'administration tant que l'autorisation n'est pas exigée." }
    e: { en: "Remediation tasks fix resources for modify and deployIfNotExists policies; they don't change where new subscriptions are placed.", fr: "Les tâches de correction corrigent des ressources pour les stratégies modify et deployIfNotExists ; elles ne changent pas l'emplacement des nouveaux abonnements." }
references:
  - title: Management groups
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
