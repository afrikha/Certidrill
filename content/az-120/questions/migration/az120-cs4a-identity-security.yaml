id: az120-cs4a-identity-security
objective: "1.3.5"
type: yesno_statements
caseStudy: az120-cs4a-wideworld
difficulty: 2
status: draft
stem:
  en: |
    You are designing the identity and security integration of SAP S/4HANA to meet the identity and security requirements.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez l'intégration d'identité et de sécurité de SAP S/4HANA pour respecter les exigences d'identité et de sécurité.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To meet the single sign-on requirement, SAP must first join the SAP S/4HANA servers to the AD DS domain of Wide World Importers.
        fr: Pour respecter l'exigence d'authentification unique, SAP doit d'abord joindre les serveurs SAP S/4HANA au domaine AD DS de Wide World Importers.
    - id: s2
      text:
        en: Wide World Importers deploys and manages the SAP data connector agent of the Microsoft Sentinel solution for SAP applications in one of its own subscriptions.
        fr: Wide World Importers déploie et gère l'agent du connecteur de données SAP de la solution Microsoft Sentinel pour les applications SAP dans l'un de ses propres abonnements.
    - id: s3
      text:
        en: The Microsoft Sentinel solution for SAP applications collects the operating system logs of the VMs that run SAP S/4HANA.
        fr: La solution Microsoft Sentinel pour les applications SAP collecte les journaux du système d'exploitation des machines virtuelles qui exécutent SAP S/4HANA.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: SSO to the SAP Fiori launchpad uses SAML with Microsoft Entra ID, configured by the customer exactly as for a system it runs itself; no domain join is involved, and RISE Windows systems are not joined to the customer's domain anyway. For RISE, the Microsoft Sentinel solution for SAP applications is deployed in the customer's subscription, with the data connector agent on a VM or container that reaches SAP over the private connectivity; the customer manages it, not SAP. Under the RISE shared responsibility model, Sentinel integrates only the SAP application layer; infrastructure and operating system logs are available only through the optional SAP LogServ service.
    fr: L'authentification unique au SAP Fiori launchpad utilise SAML avec Microsoft Entra ID, configuré par le client exactement comme pour un système qu'il exploite lui-même ; aucune jonction de domaine n'intervient, et les systèmes Windows de RISE ne sont de toute façon pas joints au domaine du client. Pour RISE, la solution Microsoft Sentinel pour les applications SAP est déployée dans l'abonnement du client, avec l'agent du connecteur de données sur une machine virtuelle ou un conteneur qui atteint SAP par la connectivité privée ; c'est le client qui la gère, pas SAP. Selon le modèle de responsabilité partagée de RISE, Sentinel n'intègre que la couche applicative SAP ; les journaux d'infrastructure et du système d'exploitation ne sont disponibles que par le service facultatif SAP LogServ.
references:
  - title: Identity and security in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-security
