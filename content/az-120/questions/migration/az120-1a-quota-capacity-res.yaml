id: az120-1a-quota-capacity-res
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso replicates its production SAP HANA database to North Europe by using HANA System Replication. During a disaster, Contoso must be able to start two Standard_M64ms_v2 virtual machines in availability zone 1 of North Europe. The VMs don't use proximity placement groups or availability sets.

    You need to guarantee the compute capacity in North Europe, backed by an SLA. Contoso doesn't want a one-year or three-year commitment.

    What should you use?
  fr: |
    Contoso réplique sa base de données SAP HANA de production vers North Europe avec HANA System Replication. En cas de sinistre, Contoso doit pouvoir démarrer deux machines virtuelles Standard_M64ms_v2 dans la zone de disponibilité 1 de North Europe. Les machines virtuelles n'utilisent ni groupe de placement de proximité ni groupe à haute disponibilité.

    Vous devez garantir la capacité de calcul dans North Europe, avec un contrat de niveau de service. Contoso ne veut pas d'engagement d'un an ou de trois ans.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "An on-demand capacity reservation", fr: "Une réservation de capacité à la demande" } }
    - { id: b, text: { en: "A reserved VM instance with capacity priority", fr: "Une instance de machine virtuelle réservée avec la priorité de capacité" } }
    - { id: c, text: { en: "A compute savings plan", fr: "Un plan d'économies pour le calcul" } }
    - { id: d, text: { en: "An increase of the VM-family vCPU quota", fr: "Une augmentation du quota de processeurs virtuels de la famille de machines virtuelles" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An on-demand capacity reservation reserves capacity for a VM size in a region or zone, with no term commitment and with an SLA. You pay the pay-as-you-go rate of the VM size for the reserved capacity whether or not VMs use it. Msv2 medium memory sizes are supported, and the VMs don't use the unsupported proximity placement groups or availability sets.
    fr: |
      Une réservation de capacité à la demande réserve de la capacité pour une taille de machine virtuelle dans une région ou une zone, sans engagement de durée et avec un contrat de niveau de service. Vous payez le tarif de paiement à l'utilisation de la taille de machine virtuelle pour la capacité réservée, que des machines virtuelles l'utilisent ou non. Les tailles Msv2 à mémoire moyenne sont prises en charge, et les machines virtuelles n'utilisent ni groupe de placement de proximité ni groupe à haute disponibilité, qui ne sont pas pris en charge.
  options:
    b:
      en: |
        A reservation requires a one-year or three-year term, and capacity priority isn't backed by an SLA.
      fr: |
        Une réservation exige une durée d'un an ou de trois ans, et la priorité de capacité n'est pas couverte par un contrat de niveau de service.
    c:
      en: |
        A savings plan is an hourly spend commitment for one or three years; it gives a discount, not capacity.
      fr: |
        Un plan d'économies est un engagement de dépense horaire sur un ou trois ans ; il donne une remise, pas de la capacité.
    d:
      en: |
        Quota is a permission to deploy; it doesn't guarantee that physical capacity is available.
      fr: |
        Le quota est une autorisation de déployer ; il ne garantit pas que de la capacité physique est disponible.
references:
  - title: On-demand capacity reservation
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/capacity-reservation-overview
