id: az120-1a-req-pv2-facts
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to use Premium SSD v2 managed disks for a new SAP HANA system on Azure M-series virtual machines deployed across availability zones.

    Which two statements about Premium SSD v2 for this deployment are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit d'utiliser des disques managés SSD Premium v2 pour un nouveau système SAP HANA sur des machines virtuelles Azure de série M déployées dans plusieurs zones de disponibilité.

    Quelles sont les deux affirmations vraies sur le SSD Premium v2 pour ce déploiement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It can be used for the OS disk of the HANA VMs.", fr: "Il peut être utilisé pour le disque du système d'exploitation des machines virtuelles HANA." } }
    - { id: b, text: { en: "It meets the SAP HANA log latency KPIs without Write Accelerator.", fr: "Il respecte les KPI de latence du journal SAP HANA sans Write Accelerator." } }
    - { id: c, text: { en: "Its IOPS and throughput can be provisioned beyond the disk's baseline, independently of capacity.", fr: "Ses IOPS et son débit peuvent être provisionnés au-delà de la base du disque, indépendamment de la capacité." } }
    - { id: d, text: { en: "It supports credit-based bursting for savepoint peaks.", fr: "Il prend en charge le mode rafale (bursting) à crédits pour les pics des points de sauvegarde (savepoints)." } }
    - { id: e, text: { en: "It must be combined with Write Accelerator on M-series VMs.", fr: "Il doit être combiné avec Write Accelerator sur les machines virtuelles de série M." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Premium SSD v2 offers sub-millisecond latency and meets the HANA KPIs for /hana/data and /hana/log without Write Accelerator. Each disk starts with a baseline of 3,000 IOPS and 125 MBps, and you can provision and pay for more IOPS and throughput separately from capacity.
    fr: |
      Le SSD Premium v2 offre une latence inférieure à la milliseconde et respecte les KPI HANA pour /hana/data et /hana/log sans Write Accelerator. Chaque disque démarre avec une base de 3 000 IOPS et 125 Mo/s, et vous pouvez provisionner et payer davantage d'IOPS et de débit séparément de la capacité.
  options:
    a:
      en: |
        Premium SSD v2 can't be used as an OS disk; use Premium SSD for the OS disk.
      fr: |
        Le SSD Premium v2 ne peut pas servir de disque du système d'exploitation ; utilisez du SSD Premium pour ce disque.
    d:
      en: |
        Premium SSD v2 doesn't offer bursting; you provision the performance you need instead.
      fr: |
        Le SSD Premium v2 ne propose pas de mode rafale (bursting) ; vous provisionnez plutôt les performances nécessaires.
    e:
      en: |
        Write Accelerator works only with Premium SSD (v1) disks; Premium SSD v2 doesn't use it.
      fr: |
        Write Accelerator ne fonctionne qu'avec les disques SSD Premium (v1) ; le SSD Premium v2 ne l'utilise pas.
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
