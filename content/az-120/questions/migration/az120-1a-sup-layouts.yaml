id: az120-1a-sup-layouts
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware is reviewing several architecture proposals for an SAP ERP system on SQL Server that will run on Azure virtual machines. The architecture must be supported by SAP and Microsoft.

    Which two configurations are supported?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware examine plusieurs propositions d'architecture pour un système SAP ERP sur SQL Server qui s'exécutera sur des machines virtuelles Azure. L'architecture doit être prise en charge par SAP et Microsoft.

    Quelles sont les deux configurations prises en charge ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The application servers stay on-premises and the database runs in Azure.", fr: "Les serveurs d'applications restent en local et la base de données s'exécute dans Azure." } }
    - { id: b, text: { en: "Several SAP dialog instances run on one VM, each with a memory limit.", fr: "Plusieurs instances de dialogue SAP s'exécutent sur une même machine virtuelle, chacune avec une limite de mémoire." } }
    - { id: c, text: { en: "A network virtual appliance inspects the traffic between the application servers and the database.", fr: "Une appliance virtuelle réseau inspecte le trafic entre les serveurs d'applications et la base de données." } }
    - { id: d, text: { en: "The application and database VMs use two subnets of one virtual network, filtered by NSGs.", fr: "Les machines virtuelles d'application et de base de données utilisent deux sous-réseaux d'un même réseau virtuel, filtrés par des groupes de sécurité réseau." } }
    - { id: e, text: { en: "The application servers run in West Europe and the database runs in North Europe.", fr: "Les serveurs d'applications s'exécutent dans West Europe et la base de données dans North Europe." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Several SAP dialog instances per VM are supported for production and non-production, with memory limits such as PHYS_MEMSIZE. Placing the application and database tiers in different subnets of one virtual network, with NSG or ASG rules that allow a direct path, is the recommended layout.
    fr: |
      Plusieurs instances de dialogue SAP par machine virtuelle sont prises en charge en production et hors production, avec des limites de mémoire comme PHYS_MEMSIZE. Placer les couches application et base de données dans des sous-réseaux différents d'un même réseau virtuel, avec des règles NSG ou ASG qui autorisent un chemin direct, est la disposition recommandée.
  options:
    a:
      en: |
        Splitting the application and DBMS tiers between on-premises and Azure adds latency and isn't supported.
      fr: |
        Répartir les couches application et SGBD entre le local et Azure ajoute de la latence et n'est pas pris en charge.
    c:
      en: |
        Network virtual appliances aren't supported in the communication path between the SAP application layer and the DBMS layer.
      fr: |
        Les appliances virtuelles réseau ne sont pas prises en charge sur le chemin de communication entre la couche application SAP et la couche SGBD.
    e:
      en: |
        Running the application and DBMS tiers in different Azure regions isn't supported because of the added latency.
      fr: |
        Exécuter les couches application et SGBD dans des régions Azure différentes n'est pas pris en charge en raison de la latence ajoutée.
references:
  - title: SAP workload on Azure virtual machine supported scenarios
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-supported-configurations
