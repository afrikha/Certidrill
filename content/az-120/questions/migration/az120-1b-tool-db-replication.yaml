id: az120-1b-tool-db-replication
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. plans a lift and shift of a busy SAP ERP production system that runs on Windows Server with SQL Server on Hyper-V virtual machines. The target is Windows Server with SQL Server on Azure virtual machines.

    A team member proposes to replicate all the virtual machines, including the database server, with Azure Site Recovery. You must recommend a method for the database server that guarantees a consistent database at cutover and follows the proven SAP migration methodology.

    What should you recommend for the database server?
  fr: |
    Proseware, Inc. prévoit un lift-and-shift d'un système de production SAP ERP très sollicité qui s'exécute sur Windows Server avec SQL Server sur des machines virtuelles Hyper-V. La cible est Windows Server avec SQL Server sur des machines virtuelles Azure.

    Un membre de l'équipe propose de répliquer toutes les machines virtuelles, y compris le serveur de base de données, avec Azure Site Recovery. Vous devez recommander pour le serveur de base de données une méthode qui garantit une base de données cohérente au basculement et suit la méthodologie de migration SAP éprouvée.

    Que devez-vous recommander pour le serveur de base de données ?
body:
  options:
    - { id: a, text: { en: "Replicate it with Azure Site Recovery by using app-consistent recovery points", fr: "Le répliquer avec Azure Site Recovery à l'aide de points de récupération cohérents avec les applications" } }
    - { id: b, text: { en: "Replicate it with the agentless replication of Azure Migrate", fr: "Le répliquer avec la réplication sans agent d'Azure Migrate" } }
    - { id: c, text: { en: "Replicate the database with SQL Server Always On to SQL Server on an Azure VM", fr: "Répliquer la base de données avec SQL Server Always On vers SQL Server sur une machine virtuelle Azure" } }
    - { id: d, text: { en: "Copy the SQL Server data files to Azure Blob Storage with AzCopy while online", fr: "Copier les fichiers de données SQL Server vers le Stockage Blob Azure avec AzCopy en ligne" } }
answer: { optionId: c }
explanation:
  correct:
    en: Microsoft recommends DBMS replication or SAP migration tools for SAP databases. VM replication tools such as Azure Site Recovery and Azure Migrate can't guarantee database consistency, busy SAP systems exceed their change-rate limits, and they aren't validated for large-scale SAP migrations. SQL Server Always On keeps a synchronized copy in Azure that you fail over to at cutover.
    fr: Microsoft recommande la réplication du SGBD ou les outils de migration SAP pour les bases de données SAP. Les outils de réplication de machines virtuelles tels qu'Azure Site Recovery et Azure Migrate ne peuvent pas garantir la cohérence de la base de données, les systèmes SAP très sollicités dépassent leurs limites de taux de modification, et ils ne sont pas validés pour les migrations SAP à grande échelle. SQL Server Always On maintient dans Azure une copie synchronisée vers laquelle vous basculez lors de la bascule finale.
  options:
    a:
      en: Site Recovery is suited to VM-based tiers without databases; for a busy database it can't guarantee consistency and may exceed its change-rate limits.
      fr: Site Recovery convient aux couches fondées sur des machines virtuelles sans base de données ; pour une base de données très sollicitée, il ne peut pas garantir la cohérence et peut dépasser ses limites de taux de modification.
    b:
      en: Azure Migrate has the same limits as Site Recovery for SAP databases and has no validation for large-scale SAP migrations.
      fr: Azure Migrate a les mêmes limites que Site Recovery pour les bases de données SAP et n'est pas validé pour les migrations SAP à grande échelle.
    d:
      en: Copying the data files of an online database produces an inconsistent copy; it is not a supported way to move a database.
      fr: Copier les fichiers de données d'une base en ligne produit une copie incohérente ; ce n'est pas une méthode prise en charge pour déplacer une base de données.
