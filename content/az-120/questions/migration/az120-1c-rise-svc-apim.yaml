id: az120-1c-rise-svc-apim
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. runs SAP S/4HANA in RISE with SAP on Azure. Power Apps, Azure Functions and Azure App Service applications will consume OData services of S/4HANA.

    You need a central component in the Litware environment that governs and secures these calls. The component must support request throttling and usage quotas, and it must keep the SAP back-end authorizations of the Microsoft 365 users who make the calls.

    What should you deploy?
  fr: |
    Litware, Inc. exécute SAP S/4HANA dans RISE with SAP sur Azure. Des applications Power Apps, Azure Functions et Azure App Service vont consommer des services OData de S/4HANA.

    Vous avez besoin d'un composant central dans l'environnement de Litware qui gouverne et sécurise ces appels. Le composant doit prendre en charge la limitation des requêtes et des quotas d'utilisation, et il doit conserver les autorisations SAP back-end des utilisateurs Microsoft 365 qui effectuent les appels.

    Que devez-vous déployer ?
body:
  options:
    - { id: a, text: { en: "Azure Application Gateway with Web Application Firewall", fr: "Azure Application Gateway avec pare-feu d'applications web" } }
    - { id: b, text: { en: "The on-premises data gateway", fr: "La passerelle de données locale" } }
    - { id: c, text: { en: "Azure Front Door with a WAF policy", fr: "Azure Front Door avec une stratégie WAF" } }
    - { id: d, text: { en: "Azure API Management", fr: "Gestion des API Azure" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure API Management deployed in the customer environment acts as the intermediary that governs and secures consumers such as Power Apps, Power BI, Azure Functions and App Service. It provides throttling and usage quotas, and with SAP principal propagation it keeps the SAP back-end authorizations of the authenticated Microsoft 365 callers.
    fr: |
      Gestion des API Azure, déployé dans l'environnement du client, sert d'intermédiaire pour gouverner et sécuriser des consommateurs comme Power Apps, Power BI, Azure Functions et App Service. Il fournit la limitation des requêtes et les quotas d'utilisation et, avec la propagation du principal SAP, conserve les autorisations SAP back-end des appelants Microsoft 365 authentifiés.
  options:
    a:
      en: |
        Application Gateway with WAF protects web traffic but provides neither usage quotas nor SAP principal propagation.
      fr: |
        Application Gateway avec WAF protège le trafic web mais ne fournit ni quotas d'utilisation ni propagation du principal SAP.
    b:
      en: |
        The data gateway supports legacy RFC connectivity for built-in connectors; it is not an API governance layer.
      fr: |
        La passerelle de données prend en charge la connectivité RFC héritée des connecteurs intégrés ; ce n'est pas une couche de gouvernance d'API.
    c:
      en: |
        Front Door delivers and protects global HTTP applications; it does not manage API quotas or principal propagation.
      fr: |
        Front Door distribue et protège des applications HTTP mondiales ; il ne gère ni quotas d'API ni propagation du principal.
references:
  - title: Integrating Azure services with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-services
