id: az120-1a-sup-hli
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind has never used Azure. It plans to move a 6-TB SAP HANA database for SAP BW/4HANA to Azure. A consultant recommends ordering SAP HANA on Azure (Large Instances) units for the database.

    You need to recommend a hosting option for the production database that Northwind can deploy today and that SAP supports.

    What should you recommend?
  fr: |
    Northwind n'a jamais utilisé Azure. Elle prévoit de déplacer vers Azure une base de données SAP HANA de 6 To pour SAP BW/4HANA. Un consultant recommande de commander des unités SAP HANA sur Azure (grandes instances) pour la base de données.

    Vous devez recommander une option d'hébergement pour la base de données de production que Northwind peut déployer aujourd'hui et que SAP prend en charge.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "SAP HANA on Azure (Large Instances) units in the target region", fr: "Des unités SAP HANA sur Azure (grandes instances) dans la région cible" } }
    - { id: b, text: { en: "Azure VMware Solution hosts in a private cloud sized for HANA", fr: "Des hôtes Azure VMware Solution dans un cloud privé dimensionné pour HANA" } }
    - { id: c, text: { en: "Any E-series VM with enough memory for the database", fr: "N'importe quelle machine virtuelle de série E avec assez de mémoire pour la base" } }
    - { id: d, text: { en: "HANA-certified Azure VMs from the SAP HANA hardware directory", fr: "Des machines virtuelles Azure certifiées HANA de l'annuaire matériel SAP HANA" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      HANA Large Instances is in sunset mode and accepts no new customers. The alternative is an Azure VM type certified for SAP HANA and listed in the SAP HANA hardware directory (certified IaaS platforms), such as the large M-series VMs.
    fr: |
      HANA (grandes instances) est en fin de commercialisation et n'accepte plus de nouveaux clients. L'alternative est un type de machine virtuelle Azure certifié pour SAP HANA et listé dans l'annuaire matériel SAP HANA (plateformes IaaS certifiées), comme les grandes machines virtuelles de série M.
  options:
    a:
      en: |
        Only existing HANA Large Instances customers can still get units; a new customer can't.
      fr: |
        Seuls les clients existants de HANA (grandes instances) peuvent encore obtenir des unités ; un nouveau client ne le peut pas.
    b:
      en: |
        SAP doesn't support SAP workloads on Azure VMware Solution (SAP Note 2138865).
      fr: |
        SAP ne prend pas en charge les charges de travail SAP sur Azure VMware Solution (note SAP 2138865).
    c:
      en: |
        Production HANA requires a VM type certified for HANA; memory size alone isn't enough.
      fr: |
        HANA en production exige un type de machine virtuelle certifié pour HANA ; la taille de la mémoire ne suffit pas.
references:
  - title: SAP workload on Azure virtual machine supported scenarios
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-supported-configurations
