id: az120-cs3b-rise-responsibility
objective: "1.3.5"
type: dragdrop
caseStudy: az120-cs3b-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You are preparing the identity and security integration with SAP RISE. You need to identify who configures or provides each element.

    Which party should you identify for each element? To answer, drag the appropriate parties to the correct elements. Each party may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez l'intégration de l'identité et de la sécurité avec SAP RISE. Vous devez identifier qui configure ou fournit chaque élément.

    Quelle partie devez-vous identifier pour chaque élément ? Pour répondre, faites glisser les parties appropriées vers les éléments correspondants. Chaque partie peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: cust, text: { en: "Humongous Insurance", fr: "Humongous Insurance" } }
    - { id: sap, text: { en: "SAP", fr: "SAP" } }
    - { id: both, text: { en: "Humongous Insurance and SAP", fr: "Humongous Insurance et SAP" } }
  targets:
    - { id: saml, text: { en: "SAML single sign-on between Microsoft Entra ID and SAP Fiori", fr: "Authentification unique SAML entre Microsoft Entra ID et SAP Fiori" } }
    - { id: spnego, text: { en: "SPNEGO single sign-on with Active Directory for SAP Web GUI", fr: "Authentification unique SPNEGO avec Active Directory pour SAP Web GUI" } }
    - { id: sentinel, text: { en: "Microsoft Sentinel solution for SAP and its data connector agent", fr: "Solution Microsoft Sentinel pour SAP et son agent de connecteur de données" } }
    - { id: oslogs, text: { en: "Operating system and infrastructure logs of the RISE VMs", fr: "Journaux du système d'exploitation et de l'infrastructure des machines virtuelles RISE" } }
answer:
  mapping: { saml: cust, spnego: both, sentinel: cust, oslogs: sap }
explanation:
  correct:
    en: |
      SAML or OAuth single sign-on with Microsoft Entra ID for SAP Fiori is configured by the customer, as for a self-managed SAP system, while SPNEGO with Active Directory for Web GUI needs configuration by both the customer and SAP. The Microsoft Sentinel solution for SAP is deployed and managed entirely by the customer in its own subscription, with the data connector agent on a VM or container that reaches SAP through the peering. Under the shared responsibility model, Sentinel only integrates the SAP application layer; infrastructure and operating system logs of RISE are provided by SAP through the optional SAP LogServ service.
    fr: |
      L'authentification unique SAML ou OAuth avec Microsoft Entra ID pour SAP Fiori est configurée par le client, comme pour un système SAP autogéré, tandis que SPNEGO avec Active Directory pour Web GUI demande une configuration par le client et par SAP. La solution Microsoft Sentinel pour SAP est déployée et gérée entièrement par le client dans son propre abonnement, avec l'agent de connecteur de données sur une machine virtuelle ou un conteneur qui atteint SAP par le peering. Selon le modèle de responsabilité partagée, Sentinel n'intègre que la couche application SAP ; les journaux d'infrastructure et du système d'exploitation de RISE sont fournis par SAP par le service facultatif SAP LogServ.
references:
  - title: Identity and security in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-security
