id: az120-1c-rise-net-multi-region
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank operates network hubs in West Europe and East US. Each hub virtual network is connected to the regional on-premises offices.

    Woodgrove will use RISE with SAP. SAP will host one S/4HANA landscape in West Europe for the European subsidiaries and another landscape in East US for the American subsidiaries. Integration applications run in spokes of both hubs.

    You need to recommend a peering design for the RISE virtual networks. The design must minimize latency and peering costs.

    What should you recommend?
  fr: |
    Woodgrove Bank exploite des hubs réseau dans les régions West Europe et East US. Chaque réseau virtuel hub est connecté aux bureaux locaux de sa région.

    Woodgrove va utiliser RISE with SAP. SAP hébergera un paysage S/4HANA dans West Europe pour les filiales européennes et un autre paysage dans East US pour les filiales américaines. Des applications d'intégration s'exécutent dans des spokes des deux hubs.

    Vous devez recommander une conception de peering pour les réseaux virtuels RISE. La conception doit réduire au minimum la latence et les coûts de peering.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Peer each RISE virtual network with the Woodgrove hub of the same region.", fr: "Relier par peering chaque réseau virtuel RISE au hub Woodgrove de la même région." }
    - id: b
      text: { en: "Peer both RISE virtual networks with the West Europe hub by using global peering.", fr: "Relier par peering les deux réseaux virtuels RISE au hub West Europe avec un peering mondial." }
    - id: c
      text: { en: "Peer each RISE virtual network with every spoke virtual network of both hubs.", fr: "Relier par peering chaque réseau virtuel RISE à tous les réseaux virtuels spoke des deux hubs." }
    - id: d
      text: { en: "Peer each RISE virtual network with both Woodgrove hubs by using global peering.", fr: "Relier par peering chaque réseau virtuel RISE aux deux hubs Woodgrove avec un peering mondial." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Microsoft recommends matching the RISE region with the region of the customer's workloads because of latency and peering costs. For globally distributed landscapes, use a multi-region network in your own Azure environment, with each RISE environment peered locally to the hub of its geography.
    fr: |
      Microsoft recommande de faire correspondre la région RISE avec celle des charges de travail du client, pour des raisons de latence et de coûts de peering. Pour les paysages répartis mondialement, utilisez un réseau multirégion dans votre propre environnement Azure, chaque environnement RISE étant relié localement par peering au hub de sa zone géographique.
  options:
    b:
      en: |
        Peering the East US landscape with the West Europe hub adds cross-region latency and global peering costs for the American subsidiaries.
      fr: |
        Relier le paysage East US au hub West Europe ajoute une latence interrégion et des coûts de peering mondial pour les filiales américaines.
    c:
      en: |
        Peering every spoke with RISE multiplies peerings and bypasses the hubs, whose shared on-premises path and central policies should apply to RISE.
      fr: |
        Relier chaque spoke à RISE multiplie les peerings et contourne les hubs, dont le chemin local partagé et les stratégies centrales doivent s'appliquer à RISE.
    d:
      en: |
        Peering each landscape with both hubs adds global peering traffic and costs that local peering avoids.
      fr: |
        Relier chaque paysage aux deux hubs ajoute un trafic et des coûts de peering mondial que le peering local évite.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
