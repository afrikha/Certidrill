id: az120-1a-quota-ri-facts
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to buy reserved VM instances with single subscription scope for the four Standard_M128ms_v2 virtual machines that will host its SAP HANA databases in West Europe.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit d'acheter des instances de machine virtuelle réservées avec une étendue d'abonnement unique pour les quatre machines virtuelles Standard_M128ms_v2 qui hébergeront ses bases de données SAP HANA dans West Europe.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The subscription must have enough vCPU quota for the reserved instances.", fr: "L'abonnement doit disposer d'un quota de processeurs virtuels suffisant pour les instances réservées." } }
    - { id: b, text: { en: "Buying the reservation deploys the four VMs automatically.", fr: "L'achat de la réservation déploie automatiquement les quatre machines virtuelles." } }
    - { id: c, text: { en: "The reservation discount must be assigned to each VM by its resource ID.", fr: "La remise de la réservation doit être attribuée à chaque machine virtuelle par son ID de ressource." } }
    - { id: d, text: { en: "The reservation doesn't by itself guarantee that capacity is available for the VMs.", fr: "La réservation ne garantit pas à elle seule que de la capacité est disponible pour les machines virtuelles." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Buying a single-subscription reservation requires available vCPU quota in that subscription, taking into account the VMs already deployed. A reservation is a billing discount only: to be sure that you can start the VMs, combine it with an on-demand capacity reservation.
    fr: |
      L'achat d'une réservation à étendue d'abonnement unique exige un quota de processeurs virtuels disponible dans cet abonnement, en tenant compte des machines virtuelles déjà déployées. Une réservation n'est qu'une remise de facturation : pour être sûr de pouvoir démarrer les machines virtuelles, combinez-la avec une réservation de capacité à la demande.
  options:
    b:
      en: |
        A reservation doesn't change the runtime state of resources; you deploy the VMs yourself.
      fr: |
        Une réservation ne modifie pas l'état d'exécution des ressources ; c'est vous qui déployez les machines virtuelles.
    c:
      en: |
        The discount applies automatically to running VMs that match the reservation's scope and attributes.
      fr: |
        La remise s'applique automatiquement aux machines virtuelles en cours d'exécution qui correspondent à l'étendue et aux attributs de la réservation.
references:
  - title: Save costs with Azure Reserved VM Instances
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/prepay-reserved-vm-instances
