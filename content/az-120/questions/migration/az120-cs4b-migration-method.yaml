id: az120-cs4b-migration-method
objective: "1.1.9"
type: single
caseStudy: az120-cs4b-treyresearch
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a method to migrate the PRD database to Azure. The solution must meet the migration requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une méthode pour migrer la base de données de PRD vers Azure. La solution doit respecter les exigences de migration.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "Export the database with SAP Software Provisioning Manager (SWPM) during the downtime and import it into SQL Server on Azure"
        fr: "Exporter la base de données avec SAP Software Provisioning Manager (SWPM) pendant le temps d'arrêt et l'importer dans SQL Server sur Azure"
    - id: b
      text:
        en: "Run the Database Migration Option (DMO) of SAP Software Update Manager (SUM) with the System Move option to Azure"
        fr: "Exécuter l'option Database Migration Option (DMO) de SAP Software Update Manager (SUM) avec l'option System Move vers Azure"
    - id: c
      text:
        en: "Take a full backup at the start of the downtime, copy it to Azure Blob Storage, and restore it on the SQL Server VM in Azure"
        fr: "Effectuer une sauvegarde complète au début du temps d'arrêt, la copier vers le Stockage Blob Azure et la restaurer sur la machine virtuelle SQL Server dans Azure"
    - id: d
      text:
        en: "Add a SQL Server VM in Azure as an asynchronous secondary replica of the availability group, then fail over to it at cutover"
        fr: "Ajouter une machine virtuelle SQL Server dans Azure comme réplica secondaire asynchrone du groupe de disponibilité, puis basculer vers elle lors de la bascule"
answer: { optionId: d }
explanation:
  correct:
    en: PRD keeps Windows, SQL Server and its SAP release, so a homogeneous copy is enough, and Microsoft documents DBMS replication tools such as SQL Server Always On to build the cloned system on Azure. The replica in Azure is seeded and synchronized over ExpressRoute while the on-premises database stays primary; at cutover, the team makes the replica synchronous, fails over and repoints the SAP instances, which keeps the downtime minimal.
    fr: PRD conserve Windows, SQL Server et sa version SAP ; une copie homogène suffit donc, et Microsoft documente les outils de réplication du SGBD comme SQL Server Always On pour créer le système cloné sur Azure. Le réplica dans Azure est amorcé et synchronisé par ExpressRoute pendant que la base de données locale reste principale ; lors de la bascule, l'équipe passe le réplica en mode synchrone, bascule et redirige les instances SAP, ce qui réduit le temps d'arrêt au minimum.
  options:
    a:
      en: An SWPM export and import is a file-based heterogeneous system copy for a change of DBMS or platform; exporting a 4 TB database during the downtime makes the cutover much longer.
      fr: Un export et un import SWPM constituent une copie système hétérogène basée sur des fichiers, destinée à un changement de SGBD ou de plateforme ; exporter une base de 4 To pendant le temps d'arrêt allonge fortement la bascule.
    b:
      en: DMO combines an SAP upgrade with a migration to SAP HANA, which violates the requirement to keep the DBMS and SAP release.
      fr: DMO combine une mise à niveau SAP et une migration vers SAP HANA, ce qui enfreint l'exigence de conserver le SGBD et la version SAP.
    c:
      en: A backup and restore is a valid homogeneous copy, but taking, copying and restoring a full 4 TB backup inside the downtime window does not minimize the cutover downtime.
      fr: Une sauvegarde suivie d'une restauration est une copie homogène valide, mais effectuer, copier et restaurer une sauvegarde complète de 4 To pendant le temps d'arrêt ne réduit pas au minimum la durée de la bascule.
