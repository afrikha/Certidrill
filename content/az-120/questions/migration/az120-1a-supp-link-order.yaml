id: az120-1a-supp-link-order
objective: "1.1.7"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove signed a Microsoft Unified support contract for its SAP landscape on Azure and received an Access ID and a Contract ID. A production SAP HANA VM now has a critical issue. You have the Contributor role on the subscription.

    You need to open a technical support request that uses the Unified contract.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove a signé un contrat de support Microsoft Unified pour son paysage SAP sur Azure et a reçu un ID d'accès (Access ID) et un ID de contrat (Contract ID). Une machine virtuelle SAP HANA de production rencontre maintenant un problème critique. Vous disposez du rôle Contributor sur l'abonnement.

    Vous devez ouvrir une demande de support technique qui utilise le contrat Unified.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: help, text: { en: "In the Azure portal, open **Help + support**.", fr: "Dans le portail Azure, ouvrir **Help + support**." } }
    - { id: link, text: { en: "Select **Support plans**, and then select **Link support benefits**.", fr: "Sélectionner **Support plans**, puis **Link support benefits**." } }
    - { id: ids, text: { en: "Enter the Access ID and the Contract ID.", fr: "Saisir l'ID d'accès et l'ID de contrat." } }
    - { id: create, text: { en: "Create a support request for the subscription and choose a severity that reflects the business impact.", fr: "Créer une demande de support pour l'abonnement et choisir une gravité qui reflète l'impact sur l'activité." } }
    - { id: reader, text: { en: "Assign the Reader role on the subscription to the Microsoft support engineer.", fr: "Attribuer le rôle Reader sur l'abonnement à l'ingénieur du support Microsoft." } }
    - { id: quota, text: { en: "Create a **Service and subscription limits (Quotas)** request.", fr: "Créer une demande **Service and subscription limits (Quotas)**." } }
answer:
  sequence: [ help, link, ids, create ]
explanation:
  correct:
    en: |
      A plan that requires an Access ID and a Contract ID is added from Help + support, Support plans, Link support benefits. Once the benefit is linked, you create the support request, select the subscription and choose the severity; the maximum severity and response time depend on the plan.
    fr: |
      Un plan qui exige un ID d'accès et un ID de contrat s'ajoute depuis Help + support, Support plans, Link support benefits. Une fois l'avantage lié, vous créez la demande de support, sélectionnez l'abonnement et choisissez la gravité ; la gravité maximale et le délai de réponse dépendent du plan.
  options:
    reader:
      en: |
        The subscription selected in the request determines which resources the engineer can access; no role assignment is needed.
      fr: |
        L'abonnement sélectionné dans la demande détermine les ressources auxquelles l'ingénieur peut accéder ; aucune attribution de rôle n'est nécessaire.
    quota:
      en: |
        A quota request is a subscription management request; it doesn't address a technical issue.
      fr: |
        Une demande de quota relève de la gestion d'abonnement ; elle ne traite pas un problème technique.
references:
  - title: Create an Azure support request
    url: https://learn.microsoft.com/en-us/azure/azure-portal/supportability/how-to-create-azure-support-request
