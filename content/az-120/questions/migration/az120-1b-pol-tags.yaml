id: az120-1b-pol-tags
objective: "1.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation charges SAP costs back by using a tag named **CostCenter**. You need to implement the following requirements with Azure Policy in the SAP subscriptions:

    - Requirement 1: The creation of a resource group without the CostCenter tag must fail.
    - Requirement 2: A resource that has no CostCenter tag must receive the value of its resource group. A value that the SAP team set on a resource must not be overwritten.
    - Requirement 3: Resources that existed before the assignment must also be brought into compliance.

    What should you use for each requirement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation refacture les coûts SAP à l'aide d'une étiquette nommée **CostCenter**. Vous devez implémenter les exigences suivantes avec Azure Policy dans les abonnements SAP :

    - Exigence 1 : la création d'un groupe de ressources sans l'étiquette CostCenter doit échouer.
    - Exigence 2 : une ressource sans étiquette CostCenter doit recevoir la valeur de son groupe de ressources. Une valeur définie par l'équipe SAP sur une ressource ne doit pas être remplacée.
    - Exigence 3 : les ressources existant avant l'attribution doivent elles aussi être mises en conformité.

    Que devez-vous utiliser pour chaque exigence ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Requirement 1: [[r1]]

      Requirement 2: [[r2]]

      Requirement 3: [[r3]]
    fr: |
      Exigence 1 : [[r1]]

      Exigence 2 : [[r2]]

      Exigence 3 : [[r3]]
  slots:
    - id: r1
      options:
        - { id: req, text: Require a tag on resource groups }
        - { id: addrg, text: Add a tag to resource groups }
        - { id: apprg, text: Append a tag and its value to resource groups }
        - { id: reqres, text: Require a tag on resources }
    - id: r2
      options:
        - { id: inhmiss, text: Inherit a tag from the resource group if missing }
        - { id: inh, text: Inherit a tag from the resource group }
        - { id: appfrom, text: Append a tag and its value from the resource group }
        - { id: replace, text: Add or replace a tag on resources }
    - id: r3
      options:
        - { id: remed, text: { en: "A remediation task", fr: "Une tâche de correction" } }
        - { id: exempt, text: { en: "A policy exemption", fr: "Une exemption de stratégie" } }
        - { id: scan, text: { en: "An on-demand compliance evaluation scan", fr: "Une analyse d'évaluation de conformité à la demande" } }
        - { id: lock, text: { en: "A CanNotDelete lock", fr: "Un verrou CanNotDelete" } }
answer:
  values: { r1: req, r2: inhmiss, r3: remed }
explanation:
  correct:
    en: Require a tag on resource groups uses the deny effect and blocks the creation of a resource group without the tag. Inherit a tag from the resource group if missing uses the modify effect and copies the resource group value only when the resource has no value, so it doesn't overwrite a different value. Modify policies change existing resources only through a remediation task.
    fr: Require a tag on resource groups utilise l'effet deny et bloque la création d'un groupe de ressources sans l'étiquette. Inherit a tag from the resource group if missing utilise l'effet modify et copie la valeur du groupe de ressources uniquement lorsque la ressource n'en a pas ; il ne remplace donc pas une valeur différente. Les stratégies modify ne changent les ressources existantes que par une tâche de correction.
  options:
    addrg: { en: "Add a tag adds the tag with a fixed value instead of rejecting the request.", fr: "Add a tag ajoute l'étiquette avec une valeur fixe au lieu de rejeter la demande." }
    apprg: { en: "Append adds a fixed tag and value; it doesn't make the creation fail.", fr: "Append ajoute une étiquette et une valeur fixes ; il ne fait pas échouer la création." }
    reqres: { en: "This policy targets resources, not resource groups.", fr: "Cette stratégie cible les ressources, pas les groupes de ressources." }
    inh: { en: "Without if missing, the policy replaces a value that differs from the resource group's.", fr: "Sans if missing, la stratégie remplace une valeur différente de celle du groupe de ressources." }
    appfrom: { en: "Append policies don't change existing resources until they are modified and can't be remediated.", fr: "Les stratégies append ne changent pas les ressources existantes avant leur modification et ne peuvent pas être corrigées par une tâche." }
    replace: { en: "Add or replace overwrites existing values and uses a fixed value, not the resource group's.", fr: "Add or replace remplace les valeurs existantes et utilise une valeur fixe, pas celle du groupe de ressources." }
    exempt: { en: "An exemption removes resources from evaluation; it doesn't fix them.", fr: "Une exemption retire des ressources de l'évaluation ; elle ne les corrige pas." }
    scan: { en: "A scan only re-evaluates compliance; it changes nothing.", fr: "Une analyse ne fait que réévaluer la conformité ; elle ne change rien." }
    lock: { en: "A lock prevents deletion; it doesn't add tags.", fr: "Un verrou empêche la suppression ; il n'ajoute pas d'étiquettes." }
references:
  - title: Assign policy definitions for tag compliance
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-policies
  - title: Remediate non-compliant resources with Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
