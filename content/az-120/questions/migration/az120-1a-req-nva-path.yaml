id: az120-1a-req-nva-path
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is designing the network for an SAP S/4HANA system on Azure virtual machines. The application servers and the SAP HANA database will be in two subnets of the same spoke virtual network. The security team requires all the traffic between subnets to be inspected by a network virtual appliance (NVA) in the hub virtual network.

    You need to recommend a design that SAP and Microsoft support and that keeps as much inspection as possible.

    What should you recommend?
  fr: |
    Fabrikam conçoit le réseau d'un système SAP S/4HANA sur des machines virtuelles Azure. Les serveurs d'applications et la base de données SAP HANA seront dans deux sous-réseaux du même réseau virtuel spoke. L'équipe sécurité exige que tout le trafic entre sous-réseaux soit inspecté par une appliance virtuelle réseau (NVA) dans le réseau virtuel hub.

    Vous devez recommander une conception prise en charge par SAP et Microsoft qui conserve le plus d'inspection possible.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Route the application-to-database traffic through the NVA by using a user-defined route", fr: "Faire passer le trafic application-base de données par la NVA avec un itinéraire défini par l'utilisateur" } }
    - { id: b, text: { en: "Keep the application-to-database path direct with NSGs and ASGs, and inspect other flows with the NVA", fr: "Garder direct le chemin application-base de données avec des NSG et des ASG, et inspecter les autres flux avec la NVA" } }
    - { id: c, text: { en: "Move the database to a separate peered virtual network and route the peering traffic through the NVA", fr: "Déplacer la base de données dans un réseau virtuel distinct relié par peering et faire passer le trafic de peering par la NVA" } }
    - { id: d, text: { en: "Place the NVA and the database VM in a proximity placement group to reduce the added latency", fr: "Placer la NVA et la machine virtuelle de base de données dans un groupe de placement de proximité pour réduire la latence ajoutée" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      NVAs aren't supported in the communication path between the SAP application layer and the DBMS layer: they can double latency, limit throughput and, in some cases, break Pacemaker clusters. NSG and ASG rules are allowed as long as they permit a direct path, and the NVA can still inspect the other flows, such as user and internet traffic.
    fr: |
      Les NVA ne sont pas prises en charge sur le chemin de communication entre la couche application SAP et la couche SGBD : elles peuvent doubler la latence, limiter le débit et, dans certains cas, perturber les clusters Pacemaker. Les règles NSG et ASG sont autorisées tant qu'elles permettent un chemin direct, et la NVA peut toujours inspecter les autres flux, comme le trafic des utilisateurs et d'Internet.
  options:
    a:
      en: |
        A user-defined route would place the NVA in the application-to-database path, which isn't supported.
      fr: |
        Un itinéraire défini par l'utilisateur placerait la NVA sur le chemin application-base de données, ce qui n'est pas pris en charge.
    c:
      en: |
        Separating the tiers into different virtual networks isn't supported, and routing their traffic through an NVA is unsupported too.
      fr: |
        Séparer les couches dans des réseaux virtuels différents n'est pas pris en charge, et faire passer leur trafic par une NVA ne l'est pas non plus.
    d:
      en: |
        Co-location doesn't remove the restriction: any NVA in the application-to-database path is unsupported.
      fr: |
        La colocalisation ne lève pas la restriction : toute NVA sur le chemin application-base de données n'est pas prise en charge.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
