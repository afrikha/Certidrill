id: az120-1c-rise-net-onprem-yesno
objective: "1.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a hub virtual network that contains an ExpressRoute gateway connected to its on-premises network. The SAP RISE virtual network of Northwind is peered with the hub as a spoke, and the peering uses remote gateway transit.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un réseau virtuel hub qui contient une passerelle ExpressRoute connectée à son réseau local. Le réseau virtuel SAP RISE de Northwind est relié au hub par peering en tant que spoke, et le peering utilise le transit par passerelle distante.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: On-premises users can reach the RISE systems through the ExpressRoute gateway in the Northwind hub.
        fr: Les utilisateurs locaux peuvent atteindre les systèmes RISE par la passerelle ExpressRoute du hub de Northwind.
    - id: s2
      text:
        en: SAP can add a VPN gateway to the RISE virtual network for a partner connection while keeping this peering configuration.
        fr: SAP peut ajouter une passerelle VPN au réseau virtuel RISE pour une connexion partenaire tout en conservant cette configuration de peering.
    - id: s3
      text:
        en: If SAP also provisions a dedicated ExpressRoute connection within RISE, Northwind can use it to reach its own Azure virtual networks.
        fr: Si SAP provisionne aussi une connexion ExpressRoute dédiée dans RISE, Northwind peut l'utiliser pour atteindre ses propres réseaux virtuels Azure.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      With remote gateway transit, the RISE spoke uses the hub's ExpressRoute gateway, so on-premises users reach RISE over the existing path. A virtual network can have only one gateway, local or remote, so no gateway can be added in the RISE VNet while it uses remote gateway transit. An on-premises connection that SAP establishes within RISE reaches only the SAP-managed VNet, never the customer's own VNets.
    fr: |
      Avec le transit par passerelle distante, le spoke RISE utilise la passerelle ExpressRoute du hub : les utilisateurs locaux atteignent RISE par le chemin existant. Un réseau virtuel ne peut avoir qu'une seule passerelle, locale ou distante : aucune passerelle ne peut être ajoutée au réseau virtuel RISE tant qu'il utilise le transit par passerelle distante. Une connexion locale que SAP établit dans RISE n'atteint que le réseau virtuel géré par SAP, jamais les réseaux virtuels du client.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
