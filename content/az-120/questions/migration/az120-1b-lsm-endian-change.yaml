id: az120-1b-lsm-endian-change
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank runs SAP ERP 6.0 on AIX on IBM Power servers with an IBM Db2 database. Woodgrove plans to move the system to Azure virtual machines that run SUSE Linux Enterprise Server (SLES).

    The requirements are:

    - Keep IBM Db2 as the database.
    - Do not upgrade the SAP release and do not adopt SAP HANA during this project.

    Which migration approach should you use?
  fr: |
    Woodgrove Bank exécute SAP ERP 6.0 sur AIX, sur des serveurs IBM Power, avec une base de données IBM Db2. Woodgrove prévoit de déplacer le système vers des machines virtuelles Azure qui exécutent SUSE Linux Enterprise Server (SLES).

    Les exigences sont les suivantes :

    - Conserver IBM Db2 comme base de données.
    - Ne pas mettre à niveau la version SAP et ne pas adopter SAP HANA dans ce projet.

    Quelle approche de migration devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Lift and shift, with a homogeneous system copy based on a Db2 backup and restore", fr: "Lift-and-shift, avec une copie système homogène fondée sur une sauvegarde et restauration Db2" } }
    - { id: b, text: { en: "Lift-shift-migrate, with a heterogeneous system copy based on an export and import", fr: "Lift-shift-migrate, avec une copie système hétérogène fondée sur un export et un import" } }
    - { id: c, text: { en: "Lift-shift-migrate to HANA, with SUM and the Database Migration Option (DMO)", fr: "Lift-shift-migrate vers HANA, avec SUM et l'option de migration de base de données (DMO)" } }
    - { id: d, text: { en: "Lift and shift, with Azure Site Recovery replication of the AIX servers", fr: "Lift-and-shift, avec une réplication Azure Site Recovery des serveurs AIX" } }
answer: { optionId: b }
explanation:
  correct:
    en: A homogeneous system copy requires the same DBMS and the same processor architecture (byte order). IBM Power is big-endian and Azure virtual machines are x86 little-endian, so even with Db2 kept, the operating system and byte order change. That is a lift-shift-migrate, done with a heterogeneous system copy (SWPM, R3load export and import).
    fr: "Une copie système homogène exige le même SGBD et la même architecture de processeur (ordre des octets). IBM Power est big-endian et les machines virtuelles Azure sont x86 little-endian : même en conservant Db2, le système d'exploitation et l'ordre des octets changent. Il s'agit d'un lift-shift-migrate, réalisé par copie système hétérogène (SWPM, export et import R3load)."
  options:
    a:
      en: A Db2 backup taken on big-endian AIX cannot serve as a homogeneous copy for little-endian Linux on Azure; the processor architecture changes.
      fr: Une sauvegarde Db2 prise sur AIX big-endian ne peut pas servir de copie homogène pour Linux little-endian sur Azure ; l'architecture de processeur change.
    c:
      en: DMO migrates to SAP HANA, and the requirements exclude HANA and an SAP upgrade.
      fr: DMO migre vers SAP HANA, et les exigences excluent HANA ainsi que la mise à niveau SAP.
    d:
      en: Azure Site Recovery replicates x86 Windows and Linux machines; it cannot turn an AIX system on IBM Power into an Azure virtual machine.
      fr: Azure Site Recovery réplique des machines Windows et Linux x86 ; il ne peut pas transformer un système AIX sur IBM Power en machine virtuelle Azure.
