id: az120-1c-rise-id-sentinel-yesno
objective: "1.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. runs SAP S/4HANA Cloud, private edition in RISE with SAP on Azure. Litware wants to monitor its SAP landscape with the Microsoft Sentinel solution for SAP applications. Litware has not subscribed to any optional SAP logging service.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. exécute SAP S/4HANA Cloud, private edition dans RISE with SAP sur Azure. Litware souhaite superviser son paysage SAP avec la solution Microsoft Sentinel pour les applications SAP. Litware n'a souscrit à aucun service de journalisation SAP optionnel.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The solution is deployed in a Litware Azure subscription, and Litware manages all its parts.
        fr: La solution est déployée dans un abonnement Azure de Litware, et Litware en gère toutes les parties.
    - id: s2
      text:
        en: The solution can ingest the operating system logs of the RISE virtual machines.
        fr: La solution peut ingérer les journaux du système d'exploitation des machines virtuelles RISE.
    - id: s3
      text:
        en: The SAP Cloud Connector used by the solution can be hosted by SAP in the RISE subscription.
        fr: Le SAP Cloud Connector utilisé par la solution peut être hébergé par SAP dans l'abonnement RISE.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      For RISE, the Microsoft Sentinel solution for SAP must be deployed in the customer's Azure subscription, and the customer manages it, not SAP. Under the RISE shared responsibility model, customers can integrate only the SAP application layer; infrastructure and OS logs are available only through the optional SAP LogServ service. SAP hosts the SAP Cloud Connector in the RISE subscription, or the customer hosts it in its own network if VNet connectivity exists.
    fr: |
      Pour RISE, la solution Microsoft Sentinel pour SAP doit être déployée dans l'abonnement Azure du client, et c'est le client qui la gère, pas SAP. Selon le modèle de responsabilité partagée de RISE, les clients ne peuvent intégrer que la couche d'application SAP ; les journaux d'infrastructure et du système d'exploitation ne sont disponibles que par le service optionnel SAP LogServ. SAP héberge le SAP Cloud Connector dans l'abonnement RISE, ou le client l'héberge dans son propre réseau si une connectivité de réseau virtuel existe.
references:
  - title: Identity and security in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-security
