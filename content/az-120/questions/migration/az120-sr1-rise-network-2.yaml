id: az120-sr1-rise-network-2
objective: "1.3.1"
type: series_yesno
series: az120-sr1-rise-network
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |-
    You peer Hub1 with the RISE virtual network and replicate the zone to the AD DS DNS servers.
  fr: |-
    Vous créez un peering entre Hub1 et le réseau virtuel RISE et répliquez la zone vers les serveurs DNS AD DS.
body:
  solution:
    en: |-
      You create a **virtual network peering** between Hub1 and the RISE virtual network by using the Azure resource ID that SAP provides, SAP approves the peering, and the peering uses **gateway transit** through the ExpressRoute gateway of Hub1. You configure a **DNS zone transfer** of ecs.contoso.com from the SAP DNS servers to the AD DS DNS servers in Hub1.
    fr: |-
      Vous créez un **peering de réseaux virtuels** entre Hub1 et le réseau virtuel RISE à l'aide de l'ID de ressource Azure fourni par SAP, SAP approuve le peering, et le peering utilise le **transit par passerelle** via la passerelle ExpressRoute de Hub1. Vous configurez un **transfert de zone DNS** de ecs.contoso.com depuis les serveurs DNS de SAP vers les serveurs DNS AD DS de Hub1.
answer: { value: true }
explanation:
  correct:
    en: |-
      Peering in the same region is the preferred RISE connectivity model; it keeps traffic on private addresses and gives the lowest latency. With remote gateway transit, the RISE virtual network is reached from on-premises through the existing ExpressRoute gateway of Hub1. A zone transfer from the SAP DNS servers to customer-run DNS servers such as AD DS is the primary method to replicate the RISE DNS records.
    fr: |-
      Le peering dans la même région est le modèle de connectivité RISE à privilégier : le trafic reste sur des adresses privées avec la latence la plus faible. Avec le transit par passerelle distante, le réseau virtuel RISE est accessible depuis le réseau local par la passerelle ExpressRoute existante de Hub1. Un transfert de zone depuis les serveurs DNS de SAP vers des serveurs DNS gérés par le client, comme AD DS, est la méthode principale de réplication des enregistrements DNS RISE.
references:
  - title: Connectivity with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
