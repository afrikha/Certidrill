id: az120-cs4a-rise-peering
objective: "1.3.1"
type: single
caseStudy: az120-cs4a-wideworld
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend how to connect the Azure environment of Wide World Importers to the SAP-managed virtual network. The solution must meet the network requirements.

    What should you recommend?
  fr: |
    Vous devez recommander comment connecter l'environnement Azure de Wide World Importers au réseau virtuel géré par SAP. La solution doit respecter les exigences réseau.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text:
        en: "A VNet-to-VNet VPN connection between a VPN gateway in VNET-HUB-WE and a VPN gateway in the SAP-managed virtual network"
        fr: "Une connexion VPN de réseau virtuel à réseau virtuel entre une passerelle VPN dans VNET-HUB-WE et une passerelle VPN dans le réseau virtuel géré par SAP"
    - id: b
      text:
        en: "An ExpressRoute circuit that SAP provides for the SAP-managed virtual network, connected to the on-premises network of Wide World Importers"
        fr: "Un circuit ExpressRoute fourni par SAP pour le réseau virtuel géré par SAP, connecté au réseau local de Wide World Importers"
    - id: c
      text:
        en: "A virtual network peering between VNET-HUB-WE and the SAP-managed virtual network that uses the ExpressRoute gateway of VNET-HUB-WE as a remote gateway"
        fr: "Un peering de réseaux virtuels entre VNET-HUB-WE et le réseau virtuel géré par SAP qui utilise la passerelle ExpressRoute de VNET-HUB-WE comme passerelle distante"
    - id: d
      text:
        en: "Private endpoints in VNET-INT-WE for the SAP S/4HANA application servers, with a private DNS zone linked to VNET-HUB-WE"
        fr: "Des points de terminaison privés dans VNET-INT-WE pour les serveurs d'applications SAP S/4HANA, avec une zone DNS privée liée à VNET-HUB-WE"
answer: { optionId: c }
explanation:
  correct:
    en: Virtual network peering is the preferred connectivity for RISE with SAP on Azure; it gives the lowest latency and highest throughput over private addresses, and both networks are in West Europe. The SAP-managed network behaves as a spoke of the customer hub and uses the hub's ExpressRoute gateway through gateway transit, so on-premises traffic follows the existing path and the central Azure Firewall rules of Wide World Importers. The peering is set up across the two tenants with SAP's approval.
    fr: Le peering de réseaux virtuels est la connectivité privilégiée pour RISE with SAP sur Azure ; il offre la latence la plus faible et le débit le plus élevé par des adresses privées, et les deux réseaux sont dans la région West Europe. Le réseau géré par SAP se comporte comme un spoke du hub du client et utilise la passerelle ExpressRoute du hub grâce au transit de passerelle ; le trafic local suit donc le chemin existant et les règles Azure Firewall centrales de Wide World Importers. Le peering est établi entre les deux locataires avec l'approbation de SAP.
  options:
    a:
      en: A VNet-to-VNet VPN is a supported alternative, but its throughput is limited by the gateway SKUs and it adds latency compared to peering, so it does not give the lowest possible latency.
      fr: Un VPN de réseau virtuel à réseau virtuel est une solution prise en charge, mais son débit est limité par les références SKU des passerelles et il ajoute de la latence par rapport au peering ; il n'offre donc pas la latence la plus faible possible.
    b:
      en: An ExpressRoute connection that SAP provides inside RISE reaches only the SAP-managed network and bypasses the existing connectivity and firewall of Wide World Importers, which violates requirement 2.
      fr: Une connexion ExpressRoute fournie par SAP dans RISE n'atteint que le réseau géré par SAP et contourne la connectivité et le pare-feu existants de Wide World Importers, ce qui enfreint l'exigence 2.
    d:
      en: SAP does not generally offer private endpoints to RISE workloads, and private endpoints would not give on-premises users a routed path to the SAP systems.
      fr: SAP ne propose généralement pas de points de terminaison privés vers les charges de travail RISE, et des points de terminaison privés ne fourniraient pas aux utilisateurs locaux un chemin routé vers les systèmes SAP.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
