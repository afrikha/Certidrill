id: az120-1b-tool-min-downtime
objective: "1.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. runs SAP ECC 6.0 EHP8 on Oracle in its datacenter. Fabrikam must move the system to SAP HANA on Azure virtual machines, together with the SAP upgrade that HANA requires, in a single project.

    Business downtime must be minimized. Fabrikam's SAP partner states that only options that SAP supports for migrations to Azure can be used.

    Which migration option should you recommend?
  fr: |
    Fabrikam, Inc. exécute SAP ECC 6.0 EHP8 sur Oracle dans son centre de données. Fabrikam doit faire passer le système sur SAP HANA sur des machines virtuelles Azure, avec la mise à niveau SAP qu'exige HANA, dans un seul projet.

    Le temps d'arrêt pour l'activité doit être réduit au minimum. Le partenaire SAP de Fabrikam indique que seules les options que SAP prend en charge pour les migrations vers Azure peuvent être utilisées.

    Quelle option de migration devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Near-Zero Downtime (NZDT) on a clone of the production system", fr: "NZDT (Near-Zero Downtime) sur un clone du système de production" } }
    - { id: b, text: { en: "DMO with System Move in sequential data transfer mode", fr: "DMO with System Move en mode de transfert séquentiel" } }
    - { id: c, text: { en: "Downtime-optimized DMO combined with DMO with System Move", fr: "DMO optimisé pour le temps d'arrêt combiné à DMO with System Move" } }
    - { id: d, text: { en: "DMO with System Move in parallel data transfer mode", fr: "DMO with System Move en mode de transfert parallèle" } }
answer: { optionId: d }
explanation:
  correct:
    en: DMO with System Move is the DMO variant supported for migrations to Azure. In parallel mode, each export file is transferred with dmotocloud.sh as soon as it is exported, so the transfer overlaps the export and the downtime is shorter than in sequential mode.
    fr: DMO with System Move est la variante de DMO prise en charge pour les migrations vers Azure. En mode parallèle, chaque fichier d'export est transféré avec dmotocloud.sh dès qu'il est exporté ; le transfert chevauche l'export et le temps d'arrêt est plus court qu'en mode séquentiel.
  options:
    b:
      en: Sequential mode transfers the complete SUM directory after the export finishes, so the transfer time adds to the downtime.
      fr: Le mode séquentiel transfère tout le répertoire SUM une fois l'export terminé ; la durée du transfert s'ajoute donc au temps d'arrêt.
    c:
      en: Downtime-optimized DMO can be combined with DMO without software update, but not with DMO with System Move.
      fr: DMO optimisé pour le temps d'arrêt peut être combiné à DMO sans mise à jour logicielle, mais pas à DMO with System Move.
    a:
      en: NZDT and downtime-optimized DMO are not supported for migrations to the cloud.
      fr: NZDT et DMO optimisé pour le temps d'arrêt ne sont pas pris en charge pour les migrations vers le cloud.
references:
