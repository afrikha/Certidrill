id: az120-1a-size-dbms-first
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware is preparing the sizing of an SAP Business Suite system that will move from its datacenter to Azure virtual machines. The system uses Db2 as its database.

    You review the sizing approach proposed by the project team.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prépare le dimensionnement d'un système SAP Business Suite qui va passer de son centre de données à des machines virtuelles Azure. Le système utilise Db2 comme base de données.

    Vous examinez l'approche de dimensionnement proposée par l'équipe projet.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The DBMS VM should be sized first, because the database layer usually can't scale out.", fr: "La machine virtuelle du SGBD doit être dimensionnée en premier, car la couche base de données ne peut généralement pas évoluer horizontalement." } }
    - { id: b, text: { en: "SAPS measured in the EarlyWatch reports are the main input for a system that has never run.", fr: "Les SAPS mesurés dans les rapports EarlyWatch sont l'entrée principale pour un système qui n'a jamais fonctionné." } }
    - { id: c, text: { en: "The application layer can meet a higher SAPS requirement by adding application server VMs.", fr: "La couche application peut répondre à un besoin en SAPS plus élevé en ajoutant des machines virtuelles de serveurs d'applications." } }
    - { id: d, text: { en: "The SAPS of SAP-certified Azure VM types rely on CPU over-provisioning of the host.", fr: "Les SAPS des types de machines virtuelles Azure certifiés SAP reposent sur un surapprovisionnement du processeur de l'hôte." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Microsoft's planning guide separates the SAPS into a DBMS part and an application part and focuses on the DBMS VM first, because the database layer usually doesn't scale out. The application layer scales out by adding application server VMs.
    fr: |
      Le guide de planification de Microsoft sépare les SAPS en une partie SGBD et une partie application, et se concentre d'abord sur la machine virtuelle du SGBD, car la couche base de données n'évolue généralement pas horizontalement. La couche application évolue horizontalement en ajoutant des machines virtuelles de serveurs d'applications.
  options:
    b:
      en: |
        A system that has never run has no EarlyWatch data; new systems are sized with a sizing exercise such as SAP Quick Sizer.
      fr: |
        Un système qui n'a jamais fonctionné n'a pas de données EarlyWatch ; les nouveaux systèmes se dimensionnent avec un exercice de dimensionnement, par exemple SAP Quick Sizer.
    d:
      en: |
        Azure VM types certified for SAP don't use CPU or memory over-provisioning.
      fr: |
        Les types de machines virtuelles Azure certifiés pour SAP n'utilisent pas de surapprovisionnement du processeur ni de la mémoire.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
