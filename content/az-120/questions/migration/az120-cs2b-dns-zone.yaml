id: az120-cs2b-dns-zone
objective: "1.3.2"
type: single
caseStudy: az120-cs2b-wingtip
difficulty: 3
status: draft
stem:
  en: |
    You need to configure name resolution for the s4.wingtiptoys.com zone. The solution must meet the name resolution requirements.

    What should you do?
  fr: |
    Vous devez configurer la résolution de noms de la zone s4.wingtiptoys.com. La solution doit respecter les exigences de résolution de noms.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an Azure Private DNS zone named s4.wingtiptoys.com, link it to Hub-FRC, and ask SAP to transfer the zone to it", fr: "Créer une zone Azure DNS privée nommée s4.wingtiptoys.com, la lier à Hub-FRC et demander à SAP d'y transférer la zone" } }
    - { id: b, text: { en: "Change the DNS settings of Wingtip's virtual networks to use the two SAP DNS servers as custom DNS servers", fr: "Modifier les paramètres DNS des réseaux virtuels de Wingtip pour utiliser les deux serveurs DNS SAP comme serveurs DNS personnalisés" } }
    - { id: c, text: { en: "Create a secondary zone for s4.wingtiptoys.com on the AD DS DNS servers and configure zone transfer from the SAP DNS servers", fr: "Créer une zone secondaire pour s4.wingtiptoys.com sur les serveurs DNS AD DS et configurer le transfert de zone depuis les serveurs DNS SAP" } }
    - { id: d, text: { en: "Create a public Azure DNS zone named s4.wingtiptoys.com and add an A record for each WS1 host", fr: "Créer une zone Azure DNS publique nommée s4.wingtiptoys.com et ajouter un enregistrement A pour chaque hôte de WS1" } }
answer: { optionId: c }
explanation:
  correct:
    en: In SAP RISE, the SAP DNS servers hold the master copy of the delegated zone, and the primary replication method is a zone transfer to the customer's DNS servers (AD DS or BIND) in the hub. Wingtip's VNets already use the AD DS DNS servers, and on-premises clients resolve through them as well.
    fr: Dans SAP RISE, les serveurs DNS SAP détiennent la copie maître de la zone déléguée, et la méthode de réplication principale est un transfert de zone vers les serveurs DNS du client (AD DS ou BIND) dans le hub. Les réseaux virtuels de Wingtip utilisent déjà les serveurs DNS AD DS, et les clients locaux résolvent également par leur intermédiaire.
  options:
    a: { en: "Azure Private DNS zones do not support zone transfer, so they cannot receive the zone from the SAP DNS servers.", fr: "Les zones Azure DNS privées ne prennent pas en charge le transfert de zone et ne peuvent donc pas recevoir la zone des serveurs DNS SAP." }
    b: { en: "The SAP DNS servers only host the delegated zone; Wingtip's VNets must keep using Wingtip's DNS servers to resolve its other names.", fr: "Les serveurs DNS SAP n'hébergent que la zone déléguée ; les réseaux virtuels de Wingtip doivent continuer à utiliser les serveurs DNS de Wingtip pour résoudre ses autres noms." }
    d: { en: "A public zone with manual records exposes private names on the internet and does not replicate the zone that SAP maintains.", fr: "Une zone publique avec des enregistrements manuels expose des noms privés sur Internet et ne réplique pas la zone gérée par SAP." }
references:
  - title: Connectivity with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
