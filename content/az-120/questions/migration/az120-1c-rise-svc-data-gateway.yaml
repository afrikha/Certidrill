id: az120-1c-rise-svc-data-gateway
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. runs SAP S/4HANA in RISE with SAP on Azure. The RISE virtual network is peered with the Contoso hub. Contoso builds Power Apps and Azure Logic Apps workflows that must call BAPIs and send IDocs to S/4HANA by using the built-in SAP connectors over RFC. The traffic must use private IP addresses only.

    You need to recommend the component to deploy.

    What should you recommend?
  fr: |
    Contoso, Ltd. exécute SAP S/4HANA dans RISE with SAP sur Azure. Le réseau virtuel RISE est relié par peering au hub de Contoso. Contoso crée des applications Power Apps et des workflows Azure Logic Apps qui doivent appeler des BAPI et envoyer des IDoc à S/4HANA en utilisant les connecteurs SAP intégrés par RFC. Le trafic ne doit utiliser que des adresses IP privées.

    Vous devez recommander le composant à déployer.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A self-hosted integration runtime on a VM in a Contoso virtual network that is connected to RISE", fr: "Un runtime d'intégration auto-hébergé sur une machine virtuelle d'un réseau virtuel Contoso connecté à RISE" }
    - id: b
      text: { en: "The on-premises data gateway on a VM that SAP deploys in the RISE virtual network", fr: "La passerelle de données locale sur une machine virtuelle que SAP déploie dans le réseau virtuel RISE" }
    - id: c
      text: { en: "The on-premises data gateway on a VM in a Contoso virtual network that is connected to RISE", fr: "La passerelle de données locale sur une machine virtuelle d'un réseau virtuel Contoso connecté à RISE" }
    - id: d
      text: { en: "An Azure Application Gateway in the Contoso hub that publishes the RFC ports of RISE", fr: "Un Azure Application Gateway dans le hub de Contoso qui publie les ports RFC de RISE" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Logic Apps, Power Apps and Power BI use the Microsoft on-premises data gateway for RFC, BAPI and IDoc calls through the SAP .NET connector. The gateway VM is deployed and operated by the customer and reaches RISE by private address through the VNet peering or a site-to-site VPN.
    fr: |
      Logic Apps, Power Apps et Power BI utilisent la passerelle de données locale de Microsoft pour les appels RFC, BAPI et IDoc via le connecteur SAP .NET. La machine virtuelle de passerelle est déployée et exploitée par le client et atteint RISE par adresse privée via le peering de réseaux virtuels ou un VPN site à site.
  options:
    a:
      en: |
        The self-hosted integration runtime serves Azure Data Factory, Synapse, Fabric and Purview, not the connectors of Power Apps and Logic Apps.
      fr: |
        Le runtime d'intégration auto-hébergé sert Azure Data Factory, Synapse, Fabric et Purview, pas les connecteurs de Power Apps et Logic Apps.
    b:
      en: |
        The data gateway is deployed and operated by the customer; SAP does not run customer integration components in the RISE VNet.
      fr: |
        La passerelle de données est déployée et exploitée par le client ; SAP n'exécute pas de composants d'intégration du client dans le réseau virtuel RISE.
    d:
      en: |
        Application Gateway is an HTTP(S) load balancer; it does not publish RFC traffic and does not provide the SAP connector runtime.
      fr: |
        Application Gateway est un équilibreur de charge HTTP(S) ; il ne publie pas le trafic RFC et ne fournit pas le runtime du connecteur SAP.
references:
  - title: Integrating Azure services with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-services
