id: az120-cs1b-oracle-licensing
objective: "1.1.5"
type: single
caseStudy: az120-cs1b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a VM size for the primary database server of LPP. The solution must meet the sizing results and the platform requirements. Assume that all the VM sizes in the answer choices are supported for the workload.

    Which VM size should you recommend?
  fr: |
    Vous devez recommander une taille de machine virtuelle pour le serveur de base de données primaire de LPP. La solution doit respecter les résultats du dimensionnement et les exigences de plateforme. Supposez que toutes les tailles de machine virtuelle des choix de réponse sont prises en charge pour la charge de travail.

    Quelle taille de machine virtuelle devez-vous recommander ?
body:
  options:
    - { id: a, text: "Standard_E8s_v5" }
    - { id: b, text: "Standard_E32-8s_v5" }
    - { id: c, text: "Standard_E32-16s_v5" }
    - { id: d, text: "Standard_E32s_v5" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Standard_E32-8s_v5 is a constrained vCPU size: it keeps the memory (256 GiB), the disk count and the 80,000 IOPS of Standard_E32s_v5 but exposes only 8 active vCPUs. Software licensed on the available vCPU count, such as the Oracle processor licenses here, is counted on those 8 vCPUs, while the VM price stays the same as the parent size.
    fr: |
      Standard_E32-8s_v5 est une taille à processeurs virtuels limités : elle conserve la mémoire (256 Gio), le nombre de disques et les 80 000 IOPS de Standard_E32s_v5, mais n'expose que 8 processeurs virtuels actifs. Les logiciels licenciés sur le nombre de processeurs virtuels disponibles, comme les licences de processeur Oracle ici, sont comptés sur ces 8 processeurs virtuels, tandis que le prix de la machine virtuelle reste celui de la taille parente.
  options:
    a:
      en: |
        Standard_E8s_v5 has 8 vCPUs but only a fraction of the memory and I/O of the E32 size, so it doesn't meet the 256 GiB and 60,000 IOPS requirements.
      fr: |
        Standard_E8s_v5 a 8 processeurs virtuels mais seulement une fraction de la mémoire et des E/S de la taille E32 : elle ne répond pas aux exigences de 256 Gio et de 60 000 IOPS.
    c:
      en: |
        Standard_E32-16s_v5 meets the memory and I/O needs but exposes 16 vCPUs, which doubles the vCPU count to license compared with the 8 the database needs.
      fr: |
        Standard_E32-16s_v5 répond aux besoins de mémoire et d'E/S mais expose 16 processeurs virtuels, ce qui double le nombre de processeurs virtuels à licencier par rapport aux 8 nécessaires.
    d:
      en: |
        Standard_E32s_v5 exposes all 32 vCPUs, so it maximizes the vCPUs to license instead of minimizing them.
      fr: |
        Standard_E32s_v5 expose les 32 processeurs virtuels : il maximise le nombre de processeurs virtuels à licencier au lieu de le réduire.
references:
  - title: Constrained vCPU sizes for database workloads
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/constrained-vcpu
