id: az120-cs3b-adf-runtime
objective: "1.3.4"
type: single
caseStudy: az120-cs3b-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend an integration runtime for the Azure Data Factory pipelines that meets the data integration requirement. What should you recommend?
  fr: |
    Vous devez recommander un runtime d'intégration pour les pipelines Azure Data Factory qui respecte l'exigence d'intégration des données. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An Azure integration runtime that connects to SAP S/4HANA through the default Azure-hosted compute", fr: "Un runtime d'intégration Azure qui se connecte à SAP S/4HANA par le calcul par défaut hébergé par Azure" } }
    - { id: b, text: { en: "A self-hosted integration runtime that SAP installs on a VM in the RISE virtual network", fr: "Un runtime d'intégration auto-hébergé que SAP installe sur une machine virtuelle du réseau virtuel RISE" } }
    - { id: c, text: { en: "A self-hosted integration runtime that Humongous Insurance installs on VMs in VNet-Hub", fr: "Un runtime d'intégration auto-hébergé que Humongous Insurance installe sur des machines virtuelles de VNet-Hub" } }
    - { id: d, text: { en: "An Azure integration runtime in a managed virtual network with a managed private endpoint to SAP S/4HANA", fr: "Un runtime d'intégration Azure dans un réseau virtuel managé avec un point de terminaison privé managé vers SAP S/4HANA" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With SAP RISE, the customer deploys and operates the self-hosted integration runtime in its own subscription and virtual network, and its SAP connectors reach the RISE system through the virtual network peering on private addresses only. VNet-Hub is the network peered with RISE; peering isn't transitive, so VMs in VNet-Data couldn't reach RISE without additional routing.
    fr: |
      Avec SAP RISE, le client déploie et exploite le runtime d'intégration auto-hébergé dans son propre abonnement et son propre réseau virtuel, et ses connecteurs SAP atteignent le système RISE par le peering de réseaux virtuels, uniquement sur des adresses privées. VNet-Hub est le réseau en peering avec RISE ; le peering n'est pas transitif, donc des machines virtuelles de VNet-Data ne pourraient pas atteindre RISE sans routage supplémentaire.
  options:
    a:
      en: |
        Data connectors that use the Azure integration runtime access the SAP environment through a public IP address.
      fr: |
        Les connecteurs de données qui utilisent le runtime d'intégration Azure accèdent à l'environnement SAP par une adresse IP publique.
    b:
      en: |
        SAP doesn't deploy or support customer integration components in RISE; the self-hosted integration runtime is the customer's responsibility in its own subscription.
      fr: |
        SAP ne déploie ni ne prend en charge les composants d'intégration du client dans RISE ; le runtime d'intégration auto-hébergé relève du client, dans son propre abonnement.
    d:
      en: |
        SAP doesn't generally offer private endpoints to RISE workloads, so a managed private endpoint can't target SAP S/4HANA.
      fr: |
        SAP ne propose généralement pas de points de terminaison privés vers les charges de travail RISE : un point de terminaison privé managé ne peut pas cibler SAP S/4HANA.
references:
  - title: Integrating Azure services with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-services
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
