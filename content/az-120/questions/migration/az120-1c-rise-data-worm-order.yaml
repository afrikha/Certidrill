id: az120-1c-rise-data-worm-order
objective: "1.3.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. runs SAP S/4HANA in RISE with SAP on Azure. An Azure Data Factory pipeline will export monthly SAP archive extracts to a new general-purpose v2 storage account named **stsaparchive** in a Contoso subscription.

    A regulation requires that the extracts cannot be modified or deleted for 10 years, in a state that is compliant with SEC Rule 17a-4(f). You plan to use a container-level immutability policy.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso, Ltd. exécute SAP S/4HANA dans RISE with SAP sur Azure. Un pipeline Azure Data Factory exportera chaque mois des extraits d'archive SAP vers un nouveau compte de stockage v2 à usage général nommé **stsaparchive** dans un abonnement Contoso.

    Une réglementation exige que les extraits ne puissent être ni modifiés ni supprimés pendant 10 ans, dans un état conforme à la règle SEC 17a-4(f). Vous prévoyez d'utiliser une stratégie d'immuabilité au niveau du conteneur.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: cont, text: { en: "Create a container named archive in stsaparchive.", fr: "Créer un conteneur nommé archive dans stsaparchive." } }
    - { id: policy, text: { en: "Configure a time-based retention policy of 3,650 days on the container.", fr: "Configurer sur le conteneur une stratégie de rétention limitée dans le temps de 3 650 jours." } }
    - { id: lock, text: { en: "Lock the time-based retention policy.", fr: "Verrouiller la stratégie de rétention limitée dans le temps." } }
    - { id: hold, text: { en: "Set a legal hold on the container, and then lock the legal hold.", fr: "Définir une conservation légale sur le conteneur, puis verrouiller la conservation légale." } }
    - { id: soft, text: { en: "Enable soft delete for blobs with a retention period of 3,650 days.", fr: "Activer la suppression réversible des blobs avec une période de rétention de 3 650 jours." } }
    - { id: lcm, text: { en: "Create a lifecycle management rule that moves the extracts to the Archive tier.", fr: "Créer une règle de gestion du cycle de vie qui déplace les extraits vers le niveau archive (Archive)." } }
answer:
  sequence: [ cont, policy, lock ]
explanation:
  correct:
    en: |
      A container-level time-based retention policy applies to all the blobs of the container: you create the container, then configure the policy. A new policy is unlocked for testing; it must be locked for the blobs to be in a compliant WORM state for SEC 17a-4(f). Once locked, the policy cannot be deleted or shortened, only extended.
    fr: |
      Une stratégie de rétention limitée dans le temps au niveau du conteneur s'applique à tous les blobs du conteneur : vous créez le conteneur, puis vous configurez la stratégie. Une nouvelle stratégie est déverrouillée pour les tests ; elle doit être verrouillée pour que les blobs soient dans un état WORM conforme à SEC 17a-4(f). Une fois verrouillée, la stratégie ne peut être ni supprimée ni raccourcie, seulement prolongée.
  options:
    hold:
      en: |
        A legal hold keeps data until it is explicitly cleared; it has no duration and is not locked.
      fr: |
        Une conservation légale conserve les données jusqu'à sa suppression explicite ; elle n'a pas de durée et ne se verrouille pas.
    soft:
      en: |
        Soft delete lets you recover deleted blobs, but it does not prevent modification or deletion, and its retention is limited to 365 days.
      fr: |
        La suppression réversible permet de récupérer des blobs supprimés, mais elle n'empêche ni la modification ni la suppression, et sa rétention est limitée à 365 jours.
    lcm:
      en: |
        Tiering can reduce cost, but it does not make the data immutable; all access tiers support immutability without it.
      fr: |
        Le changement de niveau peut réduire les coûts, mais il ne rend pas les données immuables ; tous les niveaux d'accès prennent en charge l'immuabilité sans lui.
references:
  - title: Immutable Storage for Blob Data Overview - Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/blobs/immutable-storage-overview
