id: az120-1c-lz-basis-sdaf-yesno
objective: "1.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. is building SAP landing zones in a hub-and-spoke architecture. The SAP Basis team will deploy SAP systems by using SAP Deployment Automation Framework. The central IT team manages the platform and wants a good balance between separation of duties and operational efficiency.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. crée des zones d'atterrissage SAP dans une architecture hub-and-spoke. L'équipe SAP Basis déploiera les systèmes SAP en utilisant SAP Deployment Automation Framework. L'équipe informatique centrale gère la plateforme et souhaite un bon équilibre entre séparation des tâches et efficacité opérationnelle.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Assigning the Virtual Machine Contributor role to the SAP Basis team in the non-production SAP subscription matches the landing zone guidance.
        fr: Attribuer le rôle Virtual Machine Contributor à l'équipe SAP Basis dans l'abonnement SAP hors production est conforme aux recommandations de la zone d'atterrissage.
    - id: s2
      text:
        en: The SAP Deployment Automation Framework control plane should be deployed in each spoke subscription that hosts SAP systems.
        fr: Le plan de contrôle de SAP Deployment Automation Framework doit être déployé dans chaque abonnement spoke qui héberge des systèmes SAP.
    - id: s3
      text:
        en: A workload zone of SAP Deployment Automation Framework is typically created for each virtual network into which SAP systems are deployed.
        fr: Une zone de charge de travail de SAP Deployment Automation Framework est généralement créée pour chaque réseau virtuel dans lequel des systèmes SAP sont déployés.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: The SAP identity guidance suggests elevated access such as Virtual Machine Contributor for the Basis team in non-production, and partially elevated access in production. The SDAF control plane is a regional resource typically deployed into the hub subscription, not into every spoke. A workload zone is typically created for each VNet that receives SAP systems and is deployed into a spoke subscription with its own deployment credential.
    fr: Les recommandations d'identité SAP proposent un accès élevé comme Virtual Machine Contributor pour l'équipe Basis hors production, et un accès partiellement élevé en production. Le plan de contrôle SDAF est une ressource régionale généralement déployée dans l'abonnement hub, pas dans chaque spoke. Une zone de charge de travail est généralement créée pour chaque réseau virtuel qui reçoit des systèmes SAP et déployée dans un abonnement spoke avec ses propres informations d'identification de déploiement.
references:
  - title: Identity and access management for SAP on Azure - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/sap/eslz-identity-and-access-management
  - title: About SAP Deployment Automation Framework
    url: https://learn.microsoft.com/en-us/azure/sap/automation/deployment-framework
