id: az120-1a-size-existing-order
objective: "1.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs SAP ERP 6.0 on SQL Server in its on-premises datacenter and plans to rehost the system on Azure virtual machines. The system has run for several years and its workload is stable.

    You need to size the target Azure infrastructure by following Microsoft's planning guidance for existing systems.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam exécute SAP ERP 6.0 sur SQL Server dans son centre de données local et prévoit de réhéberger le système sur des machines virtuelles Azure. Le système fonctionne depuis plusieurs années et sa charge de travail est stable.

    Vous devez dimensionner l'infrastructure Azure cible en suivant les recommandations de planification de Microsoft pour les systèmes existants.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: measure, text: { en: "Collect the SAPS consumption from EarlyWatch reports and the IOPS and throughput of the database.", fr: "Collecter la consommation de SAPS dans les rapports EarlyWatch ainsi que les IOPS et le débit de la base de données." } }
    - { id: split, text: { en: "Split the SAPS requirement into a DBMS part and an application part.", fr: "Répartir le besoin en SAPS entre une partie SGBD et une partie application." } }
    - { id: dbvm, text: { en: "Select the DBMS VM type and its storage from the SAP-supported VM types.", fr: "Sélectionner le type de machine virtuelle du SGBD et son stockage parmi les types de machines virtuelles pris en charge par SAP." } }
    - { id: appvm, text: { en: "Determine the number and type of application server VMs.", fr: "Déterminer le nombre et le type de machines virtuelles de serveurs d'applications." } }
    - { id: quick, text: { en: "Enter the expected business document volumes in SAP Quick Sizer.", fr: "Saisir les volumes de documents métier attendus dans SAP Quick Sizer." } }
    - { id: ri, text: { en: "Purchase three-year reservations for the application server VMs.", fr: "Acheter des réservations de trois ans pour les machines virtuelles des serveurs d'applications." } }
answer:
  sequence: [ measure, split, dbvm, appvm ]
explanation:
  correct:
    en: |
      For an existing system you start from measured data (SAPS from EarlyWatch reports, database I/O). You then separate the DBMS and application parts and size the DBMS VM first, because the database layer usually can't scale out, whereas the application layer can scale out by adding VMs.
    fr: |
      Pour un système existant, vous partez de données mesurées (SAPS issus des rapports EarlyWatch, E/S de la base de données). Vous séparez ensuite les parties SGBD et application, et vous dimensionnez d'abord la machine virtuelle du SGBD, car la couche base de données ne peut généralement pas évoluer horizontalement, alors que la couche application le peut en ajoutant des machines virtuelles.
  options:
    quick:
      en: |
        Quick Sizer is the method for new implementations; an existing system is sized from its measured workload.
      fr: |
        Quick Sizer est la méthode pour les nouvelles implémentations ; un système existant se dimensionne à partir de sa charge mesurée.
    ri:
      en: |
        Buying reservations is a cost decision taken after the sizing is validated, not a sizing step.
      fr: |
        L'achat de réservations est une décision de coût prise après validation du dimensionnement, pas une étape de dimensionnement.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
  - title: "SAP workloads on Azure: planning and deployment checklist"
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/deployment-checklist
