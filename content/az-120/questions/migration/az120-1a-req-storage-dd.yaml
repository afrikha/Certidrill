id: az120-1a-req-storage-dd
objective: "1.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind is selecting storage for several components of its SAP landscape on Azure. Each component must use a storage type that is supported for it. When several types are supported, choose the lowest-cost one.

    Which storage type should you use for each component? To answer, drag the appropriate storage types to the correct components. Each storage type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind choisit le stockage de plusieurs composants de son paysage SAP sur Azure. Chaque composant doit utiliser un type de stockage pris en charge pour lui. Lorsque plusieurs types sont pris en charge, choisissez le moins cher.

    Quel type de stockage devez-vous utiliser pour chaque composant ? Pour répondre, faites glisser les types de stockage appropriés vers les composants correspondants. Chaque type de stockage peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pssd, text: Premium SSD }
    - { id: pssdv2, text: Premium SSD v2 }
    - { id: ultra, text: Ultra Disk }
    - { id: files, text: { en: "Azure Files SSD (NFS, ZRS)", fr: "Azure Files SSD (NFS, ZRS)" } }
    - { id: anf, text: Azure NetApp Files }
    - { id: hdd, text: Standard HDD }
  targets:
    - id: os
      text: { en: "OS disk of a production SAP HANA VM", fr: "Disque du système d'exploitation d'une machine virtuelle SAP HANA de production" }
    - id: shared
      text: { en: "/hana/shared of a zonal HANA cluster, synchronously replicated across zones", fr: "/hana/shared d'un cluster HANA zonal, répliqué de façon synchrone entre les zones" }
    - id: standby
      text: { en: "/hana/data and /hana/log of a HANA scale-out system with a standby node", fr: "/hana/data et /hana/log d'un système HANA scale-out avec un nœud de secours" }
    - id: backup
      text: { en: "Disks that receive file-based backups of a sandbox system", fr: "Disques qui reçoivent les sauvegardes sur fichiers d'un système bac à sable" }
answer:
  mapping: { os: pssd, shared: files, standby: anf, backup: hdd }
explanation:
  correct:
    en: |
      Premium SSD v2 and Ultra Disk can't be OS disks, so the HANA VM's OS disk uses Premium SSD. Azure Files SSD with ZRS replicates synchronously across zones and is supported for /hana/shared. A HANA scale-out system with a standby node requires NFS on Azure NetApp Files for data and log. Standard HDD is the lowest-cost option and is suitable only for backups or rarely used systems.
    fr: |
      Le SSD Premium v2 et Ultra Disk ne peuvent pas être des disques de système d'exploitation : le disque du système d'exploitation de la machine virtuelle HANA utilise donc du SSD Premium. Azure Files SSD avec ZRS réplique de façon synchrone entre les zones et est pris en charge pour /hana/shared. Un système HANA scale-out avec un nœud de secours exige NFS sur Azure NetApp Files pour les données et le journal. Le HDD Standard est l'option la moins chère et ne convient qu'aux sauvegardes ou aux systèmes rarement utilisés.
  options:
    pssdv2:
      en: |
        Premium SSD v2 can't be an OS disk, isn't a shared file system and costs more than Standard HDD for backups.
      fr: |
        Le SSD Premium v2 ne peut pas être un disque de système d'exploitation, n'est pas un système de fichiers partagé et coûte plus cher que le HDD Standard pour les sauvegardes.
    ultra:
      en: |
        Ultra Disk can't be an OS disk, and a standby node requires shared NFS volumes on Azure NetApp Files.
      fr: |
        Ultra Disk ne peut pas être un disque de système d'exploitation, et un nœud de secours exige des volumes NFS partagés sur Azure NetApp Files.
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
  - title: SAP workload on Azure virtual machine supported scenarios
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-supported-configurations
