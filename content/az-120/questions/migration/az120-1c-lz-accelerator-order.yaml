id: az120-1c-lz-accelerator-order
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. plans to migrate its SAP S/4HANA landscape to Azure. Today, Contoso has only three standalone test subscriptions and no shared governance, networking or identity foundation in Azure.

    The cloud architects want to use the SAP on Azure landing zone accelerator to build the SAP workload landing zones.

    What should you do first?
  fr: |
    Contoso, Ltd. prévoit de migrer son paysage SAP S/4HANA vers Azure. Aujourd'hui, Contoso ne dispose que de trois abonnements de test isolés, sans fondation commune de gouvernance, de réseau ni d'identité dans Azure.

    Les architectes cloud veulent utiliser l'accélérateur de zone d'atterrissage SAP sur Azure pour créer les zones d'atterrissage de la charge de travail SAP.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Deploy a workload zone of SAP Deployment Automation Framework in each test subscription.", fr: "Déployer une zone de charge de travail de SAP Deployment Automation Framework dans chaque abonnement de test." }
    - id: b
      text: { en: "Implement an enterprise-scale Azure landing zone that provides the platform foundation.", fr: "Implémenter une zone d'atterrissage Azure à l'échelle de l'entreprise qui fournit la fondation de plateforme." }
    - id: c
      text: { en: "Register the existing SAP test systems in Azure Center for SAP solutions.", fr: "Inscrire les systèmes SAP de test existants dans le Centre Azure pour les solutions SAP." }
    - id: d
      text: { en: "Deploy Azure Monitor for SAP solutions in a new production subscription.", fr: "Déployer Azure Monitor pour les solutions SAP dans un nouvel abonnement de production." }
answer: { optionId: b }
explanation:
  correct:
    en: The SAP on Azure landing zone accelerator builds workload landing zones inside an existing enterprise-scale (platform) landing zone, and Microsoft says to deploy it only after the enterprise-scale landing zone is in place. The platform landing zone provides the shared governance, connectivity and identity that the SAP landing zones rely on.
    fr: "L'accélérateur de zone d'atterrissage SAP sur Azure crée des zones d'atterrissage de charge de travail au sein d'une zone d'atterrissage (de plateforme) à l'échelle de l'entreprise existante, et Microsoft indique de le déployer seulement une fois cette zone d'atterrissage en place. La zone d'atterrissage de plateforme fournit la gouvernance, la connectivité et l'identité communes dont dépendent les zones d'atterrissage SAP."
  options:
    a:
      en: A workload zone deploys the SAP network and credentials for one environment; it does not create the platform foundation the accelerator requires, and test subscriptions are not the target structure.
      fr: Une zone de charge de travail déploie le réseau et les informations d'identification SAP d'un environnement ; elle ne crée pas la fondation de plateforme requise par l'accélérateur, et des abonnements de test ne sont pas la structure cible.
    c:
      en: Registering systems in Azure Center for SAP solutions is a management step for existing SAP systems, not the prerequisite of the landing zone accelerator.
      fr: L'inscription de systèmes dans le Centre Azure pour les solutions SAP est une étape de gestion de systèmes SAP existants, pas le prérequis de l'accélérateur de zone d'atterrissage.
    d:
      en: Monitoring is a day-2 capability; it does not provide the governance and connectivity foundation needed first.
      fr: La supervision est une fonctionnalité d'exploitation ultérieure ; elle ne fournit pas la fondation de gouvernance et de connectivité nécessaire en premier.
references:
