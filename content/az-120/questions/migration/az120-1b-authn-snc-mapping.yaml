id: az120-1b-authn-snc-mapping
objective: "1.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has finished the server-side configuration of Kerberos-based SNC on an SAP NetWeaver ABAP system in Azure. A user named Lee has the user principal name lee@adatum.com.

    You need to complete the configuration so that Lee can sign in to SAP GUI without a password prompt.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation a terminé la configuration côté serveur de SNC fondé sur Kerberos sur un système SAP NetWeaver ABAP dans Azure. Un utilisateur nommé Lee a le nom d'utilisateur principal lee@adatum.com.

    Vous devez terminer la configuration pour que Lee puisse se connecter à SAP GUI sans invite de mot de passe.

    Comment devez-vous terminer la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Enter the SNC name p:CN=lee@adatum.com in: [[user]]

      Enter the SNC name of the SAP system's service principal in: [[system]]

      Install on Lee's computer: [[client]]
    fr: |
      Saisir le nom SNC p:CN=lee@adatum.com dans : [[user]]

      Saisir le nom SNC du principal de service du système SAP dans : [[system]]

      Installer sur l'ordinateur de Lee : [[client]]
  slots:
    - id: user
      options:
        - { id: su01, text: { en: "transaction SU01, SNC tab of Lee's SAP user", fr: "la transaction SU01, onglet SNC de l'utilisateur SAP de Lee" } }
        - { id: saml2, text: { en: "transaction SAML2, Identity Federation", fr: "la transaction SAML2, Identity Federation" } }
        - { id: gui, text: { en: "the Secure Network Settings of the SAP GUI connection", fr: "les Secure Network Settings de la connexion SAP GUI" } }
    - id: system
      options:
        - { id: su01, text: { en: "transaction SU01, SNC tab of Lee's SAP user", fr: "la transaction SU01, onglet SNC de l'utilisateur SAP de Lee" } }
        - { id: saml2, text: { en: "transaction SAML2, Identity Federation", fr: "la transaction SAML2, Identity Federation" } }
        - { id: gui, text: { en: "the Secure Network Settings of the SAP GUI connection", fr: "les Secure Network Settings de la connexion SAP GUI" } }
    - id: client
      options:
        - { id: securelogin, text: { en: "the secure login software", fr: "le logiciel de connexion sécurisée (secure login)" } }
        - { id: entraconnect, text: Microsoft Entra Connect }
        - { id: aadssh, text: { en: "the AADSSHLoginForLinux extension", fr: "l'extension AADSSHLoginForLinux" } }
answer:
  values: { user: su01, system: gui, client: securelogin }
explanation:
  correct:
    en: The user's Kerberos identity is mapped to the SAP user on the SNC tab in SU01. On the client, the secure login software is installed, and the SAP GUI connection's Secure Network Settings contain the SNC name of the SAP system's service principal, so SAP GUI requests a Kerberos ticket for that SPN.
    fr: L'identité Kerberos de l'utilisateur est mappée à l'utilisateur SAP dans l'onglet SNC de SU01. Sur le client, le logiciel de connexion sécurisée est installé, et les Secure Network Settings de la connexion SAP GUI contiennent le nom SNC du principal de service du système SAP ; SAP GUI demande alors un ticket Kerberos pour ce SPN.
  options:
    saml2: { en: "SAML2 configures SAML trust with an identity provider, not SNC names.", fr: "SAML2 configure l'approbation SAML avec un fournisseur d'identité, pas des noms SNC." }
    entraconnect: { en: "Microsoft Entra Connect synchronizes identities to Microsoft Entra ID; it isn't an SNC client component.", fr: "Microsoft Entra Connect synchronise les identités vers Microsoft Entra ID ; ce n'est pas un composant client SNC." }
    aadssh: { en: "This extension is installed on Linux VMs for SSH sign-in, not on user computers.", fr: "Cette extension s'installe sur des machines virtuelles Linux pour la connexion SSH, pas sur les ordinateurs des utilisateurs." }
references:
  - title: Integrate Active Directory with SAP single sign-on (Kerberos-SPNEGO)
    url: https://learn.microsoft.com/en-us/training/modules/explore-identity-services/9-exercise-integrate-active-directory-sap-single-sign-on
