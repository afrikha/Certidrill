id: az120-cs1b-oracle-os
objective: "1.1.2"
type: dragdrop
caseStudy: az120-cs1b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    You need to select the operating system for each layer of LPP on Azure. The solution must meet the platform requirements and the standard of the Linux team.

    Which operating system should you use for each layer? To answer, drag the appropriate operating systems to the correct layers. Each operating system may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez sélectionner le système d'exploitation de chaque couche de LPP sur Azure. La solution doit respecter les exigences de plateforme et la norme de l'équipe Linux.

    Quel système d'exploitation devez-vous utiliser pour chaque couche ? Pour répondre, faites glisser les systèmes d'exploitation appropriés vers les couches correspondantes. Chaque système d'exploitation peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: ol, text: "Oracle Linux 8" }
    - { id: rhel, text: "Red Hat Enterprise Linux for SAP Solutions 8" }
    - { id: sles, text: "SUSE Linux Enterprise Server for SAP Applications 15" }
    - { id: win, text: "Windows Server 2022" }
  targets:
    - id: db
      text:
        en: Oracle database VMs
        fr: Machines virtuelles de base de données Oracle
    - id: app
      text:
        en: Application server VMs (PAS and AAS)
        fr: Machines virtuelles des serveurs d'applications (PAS et AAS)
    - id: ascs
      text:
        en: ASCS/ERS cluster VMs
        fr: Machines virtuelles du cluster ASCS/ERS
answer:
  mapping: { db: ol, app: ol, ascs: rhel }
explanation:
  correct:
    en: |
      SAP on Oracle on Azure is supported only on Oracle Linux, not on SUSE or Red Hat, for the database servers and for the application servers, because the application servers use the Oracle client. The ASCS/ERS VMs don't use the Oracle client, so they can run RHEL, which follows the standard of the Linux team, as long as no application server is installed on them.
    fr: |
      SAP sur Oracle sur Azure n'est pris en charge que sur Oracle Linux, et non sur SUSE ou Red Hat, pour les serveurs de base de données et pour les serveurs d'applications, car ceux-ci utilisent le client Oracle. Les machines virtuelles ASCS/ERS n'utilisent pas le client Oracle : elles peuvent donc exécuter RHEL, conformément à la norme de l'équipe Linux, à condition qu'aucun serveur d'applications n'y soit installé.
  options:
    sles:
      en: |
        SUSE Linux is not supported for Oracle database or application servers, and the Linux team prefers RHEL for the layers where a choice exists.
      fr: |
        SUSE Linux n'est pas pris en charge pour les serveurs de base de données ou d'applications Oracle, et l'équipe Linux préfère RHEL pour les couches où un choix existe.
    win:
      en: |
        Windows is supported for Oracle Database 19c from specific patch levels, but the database operating system must stay the same as on-premises (Oracle Linux).
      fr: |
        Windows est pris en charge pour Oracle Database 19c à partir de certains niveaux de correctif, mais le système d'exploitation de la base de données doit rester le même qu'en local (Oracle Linux).
references:
  - title: Azure virtual machines Oracle database deployment for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/dbms-guide-oracle
