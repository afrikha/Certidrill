id: az120-1c-rise-data-ir-yesno
objective: "1.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. runs SAP S/4HANA in RISE with SAP on Azure. Fabrikam uses Azure Data Factory and Microsoft Fabric to integrate SAP data with its data platform. Some pipelines use an Azure integration runtime and others use a self-hosted integration runtime that Fabrikam deployed in a virtual network peered with RISE.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. exécute SAP S/4HANA dans RISE with SAP sur Azure. Fabrikam utilise Azure Data Factory et Microsoft Fabric pour intégrer des données SAP à sa plateforme de données. Certains pipelines utilisent un runtime d'intégration Azure et d'autres un runtime d'intégration auto-hébergé que Fabrikam a déployé dans un réseau virtuel relié par peering à RISE.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Azure integration runtime reaches the SAP system over HTTPS through a public endpoint that SAP provides with an Application Gateway.
        fr: Le runtime d'intégration Azure atteint le système SAP en HTTPS par un point de terminaison public que SAP fournit avec un Application Gateway.
    - id: s2
      text:
        en: Fabrikam can use the SAP HANA connector from the self-hosted integration runtime only if direct database access has been agreed with SAP.
        fr: Fabrikam ne peut utiliser le connecteur SAP HANA depuis le runtime d'intégration auto-hébergé que si l'accès direct à la base de données a été convenu avec SAP.
    - id: s3
      text:
        en: SAP RISE support troubleshoots the configuration of the self-hosted integration runtime in the Fabrikam subscription.
        fr: Le support SAP RISE dépanne la configuration du runtime d'intégration auto-hébergé de l'abonnement Fabrikam.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      The Azure IR accesses RISE through a public IP address that SAP provides through an application gateway, with HTTPS data movement. The SAP HANA ODBC/JDBC connector can be used from the self-hosted IR only when direct database access is agreed with SAP. The customer deploys and operates the self-hosted IR; SAP exposes the ports but has no knowledge of or support for the connected services.
    fr: |
      Le runtime d'intégration Azure accède à RISE par une adresse IP publique que SAP fournit au moyen d'une passerelle d'application, avec un transfert de données en HTTPS. Le connecteur SAP HANA ODBC/JDBC ne peut être utilisé depuis le runtime d'intégration auto-hébergé que si l'accès direct à la base de données est convenu avec SAP. Le client déploie et exploite le runtime d'intégration auto-hébergé ; SAP expose les ports mais n'a aucune connaissance des services connectés et ne les prend pas en charge.
references:
  - title: Integrating Azure services with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-services
