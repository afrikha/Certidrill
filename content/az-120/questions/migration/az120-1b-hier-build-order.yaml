id: az120-1b-hier-build-order
objective: "1.2.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has two subscriptions, **sub-sap-prod** and **sub-sap-nonprod**, directly under the tenant root group. No other management group exists.

    You need to create the following hierarchy: Tenant root group > Landing zones > Corp > sub-sap-prod and sub-sap-nonprod.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys dispose de deux abonnements, **sub-sap-prod** et **sub-sap-nonprod**, directement sous le Groupe racine du locataire. Aucun autre groupe d'administration n'existe.

    Vous devez créer la hiérarchie suivante : Groupe racine du locataire > Landing zones > Corp > sub-sap-prod et sub-sap-nonprod.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: lz, text: { en: "Create the Landing zones management group under the tenant root group.", fr: "Créer le groupe d'administration Landing zones sous le Groupe racine du locataire." } }
    - { id: corp, text: { en: "Create the Corp management group with Landing zones as its parent.", fr: "Créer le groupe d'administration Corp avec Landing zones comme parent." } }
    - { id: move, text: { en: "Move sub-sap-prod and sub-sap-nonprod to the Corp management group.", fr: "Déplacer sub-sap-prod et sub-sap-nonprod vers le groupe d'administration Corp." } }
    - { id: moveroot, text: { en: "Move the tenant root group under the Landing zones management group.", fr: "Déplacer le Groupe racine du locataire sous le groupe d'administration Landing zones." } }
    - { id: rg, text: { en: "Create a resource group named Corp in sub-sap-prod.", fr: "Créer un groupe de ressources nommé Corp dans sub-sap-prod." } }
    - { id: owner, text: { en: "Assign the Owner role on Corp to the SAP Basis team.", fr: "Attribuer le rôle Owner sur Corp à l'équipe SAP Basis." } }
answer:
  sequence: [ lz, corp, move ]
explanation:
  correct:
    en: A management group can only be created under an existing parent, so Landing zones comes first, then Corp as its child. The subscriptions can then be moved to Corp; each subscription has a single parent, so the move replaces the root as their parent.
    fr: Un groupe d'administration ne peut être créé que sous un parent existant ; Landing zones vient donc en premier, puis Corp comme enfant. Les abonnements peuvent ensuite être déplacés vers Corp ; chaque abonnement n'a qu'un seul parent, et le déplacement remplace donc la racine comme parent.
  options:
    moveroot: { en: "The root management group can't be moved.", fr: "Le groupe d'administration racine ne peut pas être déplacé." }
    rg: { en: "Resource groups live inside subscriptions; they aren't levels of the management group hierarchy.", fr: "Les groupes de ressources se trouvent dans les abonnements ; ce ne sont pas des niveaux de la hiérarchie de groupes d'administration." }
    owner: { en: "Not needed for the hierarchy, and workload teams shouldn't get roles at management group scope.", fr: "Inutile pour la hiérarchie, et les équipes de charge de travail ne doivent pas recevoir de rôles à l'étendue d'un groupe d'administration." }
references:
  - title: What are Azure management groups?
    url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
