id: az120-1a-sup-release-order
objective: "1.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs SAP NetWeaver 7.31 with SQL Server 2012 on Windows Server 2012 in its datacenter and plans to rehost the system on Azure virtual machines. You suspect that some releases are too old for Azure.

    You need to determine the changes required to reach a configuration supported on Azure, by following Microsoft's documented process.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso exécute SAP NetWeaver 7.31 avec SQL Server 2012 sous Windows Server 2012 dans son centre de données et prévoit de réhéberger le système sur des machines virtuelles Azure. Vous pensez que certaines versions sont trop anciennes pour Azure.

    Vous devez déterminer les changements nécessaires pour obtenir une configuration prise en charge sur Azure, en suivant le processus documenté par Microsoft.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: note, text: { en: "Compare the current releases with the minimum releases listed in SAP Note 1928533.", fr: "Comparer les versions actuelles aux versions minimales listées dans la note SAP 1928533." } }
    - { id: pam, text: { en: "Define a target release and use the SAP PAM to find the supported OS and DBMS combinations.", fr: "Définir une version cible et utiliser la PAM SAP pour trouver les combinaisons de système d'exploitation et de SGBD prises en charge." } }
    - { id: kernel, text: { en: "Check whether the SAP kernel must be updated.", fr: "Vérifier si le noyau SAP doit être mis à jour." } }
    - { id: sp, text: { en: "Check whether Support Packages, such as Basis Support Packages, are required.", fr: "Vérifier si des Support Packages, comme les Support Packages Basis, sont nécessaires." } }
    - { id: hwd, text: { en: "Select a VM type from the SAP HANA hardware directory.", fr: "Sélectionner un type de machine virtuelle dans l'annuaire matériel SAP HANA." } }
    - { id: extend, text: { en: "Ask Microsoft support to extend support to the current OS release.", fr: "Demander au support Microsoft d'étendre la prise en charge à la version actuelle du système d'exploitation." } }
answer:
  sequence: [ note, pam, kernel, sp ]
explanation:
  correct:
    en: |
      Start with the minimum releases in SAP Note 1928533. If the system doesn't meet them, define a target release and use the PAM to find the supported OS and DBMS combinations. Then check whether the SAP kernel must be updated and whether Support Packages, especially Basis Support Packages required by a newer DBMS release, are needed.
    fr: |
      Commencez par les versions minimales de la note SAP 1928533. Si le système ne les respecte pas, définissez une version cible et utilisez la PAM pour trouver les combinaisons de système d'exploitation et de SGBD prises en charge. Vérifiez ensuite si le noyau SAP doit être mis à jour et si des Support Packages, en particulier les Support Packages Basis exigés par une version plus récente du SGBD, sont nécessaires.
  options:
    hwd:
      en: |
        The SAP HANA hardware directory applies to SAP HANA; this system uses SQL Server.
      fr: |
        L'annuaire matériel SAP HANA concerne SAP HANA ; ce système utilise SQL Server.
    extend:
      en: |
        Older OS releases must be upgraded; Microsoft doesn't extend support to releases older than the documented minimums.
      fr: |
        Les anciennes versions de système d'exploitation doivent être mises à niveau ; Microsoft n'étend pas la prise en charge aux versions antérieures aux minimums documentés.
references:
  - title: What SAP software is supported for Azure deployments
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/supported-product-on-azure
