id: az120-1b-tool-system-move-settings
objective: "1.1.9"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. uses DMO with System Move to migrate SAP ERP from its datacenter to SAP HANA on Azure virtual machines. The datacenter is connected to Azure by ExpressRoute. The target SAP NetWeaver and SAP HANA servers are already deployed in Azure.

    You need to configure the migration so that downtime is as short as possible.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. utilise DMO with System Move pour migrer SAP ERP de son centre de données vers SAP HANA sur des machines virtuelles Azure. Le centre de données est connecté à Azure par ExpressRoute. Les serveurs SAP NetWeaver et SAP HANA cibles sont déjà déployés dans Azure.

    Vous devez configurer la migration pour que le temps d'arrêt soit le plus court possible.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Start SUM on: [[start]]

      Data transfer mode: [[mode]]

      Send the export files to Azure by using: [[copy]]
    fr: |
      Démarrer SUM sur : [[start]]

      Mode de transfert des données : [[mode]]

      Envoyer les fichiers d'export vers Azure avec : [[copy]]
  slots:
    - id: start
      options:
        - { id: onprem, text: { en: "the on-premises source application server", fr: "le serveur d'applications source local" } }
        - { id: azapp, text: { en: "the target application server in Azure", fr: "le serveur d'applications cible dans Azure" } }
        - { id: azdb, text: { en: "the SAP HANA database server in Azure", fr: "le serveur de base de données SAP HANA dans Azure" } }
    - id: mode
      options:
        - { id: par, text: { en: "Parallel", fr: "Parallèle" } }
        - { id: seq, text: { en: "Sequential", fr: "Séquentiel" } }
        - { id: mem, text: { en: "Memory pipes", fr: "Canaux mémoire (memory pipes)" } }
    - id: copy
      options:
        - { id: dmocloud, text: { en: "the dmotocloud.sh script", fr: "le script dmotocloud.sh" } }
        - { id: robo, text: { en: "Robocopy with the /MIR switch", fr: "Robocopy avec le commutateur /MIR" } }
        - { id: databox, text: { en: "Azure Data Box", fr: "Azure Data Box" } }
answer:
  values: { start: onprem, mode: par, copy: dmocloud }
explanation:
  correct:
    en: With DMO with System Move, SUM starts on the on-premises source application server, runs the uptime phases there and stops at the execution phase; the import then continues on the Azure application server. In parallel mode, each export file is sent to Azure as soon as it is exported by the dmotocloud.sh script, so transfer overlaps export and downtime is shorter than in sequential mode.
    fr: "Avec DMO with System Move, SUM démarre sur le serveur d'applications source local, y exécute les phases de disponibilité (uptime) et s'arrête à la phase d'exécution ; l'import se poursuit ensuite sur le serveur d'applications Azure. En mode parallèle, chaque fichier d'export est envoyé vers Azure dès qu'il est exporté par le script dmotocloud.sh : le transfert chevauche l'export et le temps d'arrêt est plus court qu'en mode séquentiel."
  options:
    azapp: { en: "The Azure application server takes over only after the export, for the import and post-processing.", fr: "Le serveur d'applications Azure ne prend le relais qu'après l'export, pour l'import et le post-traitement." }
    azdb: { en: "SUM runs on an application server, not on the HANA database server.", fr: "SUM s'exécute sur un serveur d'applications, pas sur le serveur de base de données HANA." }
    seq: { en: "Sequential mode transfers the whole SUM directory after the export ends, so the transfer adds to downtime.", fr: "Le mode séquentiel transfère tout le répertoire SUM après la fin de l'export ; le transfert s'ajoute donc au temps d'arrêt." }
    mem: { en: "Memory pipes require export and import on the same application server; System Move uses a file system dump.", fr: "Les canaux mémoire exigent l'export et l'import sur le même serveur d'applications ; System Move utilise un vidage dans le système de fichiers." }
    robo: { en: "Robocopy is used to copy R3load dump files of a classical migration, not DMO System Move files.", fr: "Robocopy sert à copier les fichiers de vidage R3load d'une migration classique, pas les fichiers de DMO System Move." }
    databox: { en: "An offline Data Box shipment cannot overlap with the export during the downtime.", fr: "Un envoi hors connexion par Data Box ne peut pas chevaucher l'export pendant le temps d'arrêt." }
references:
  - title: Explore one-step migration - DMO with system move option
    url: https://learn.microsoft.com/en-us/training/modules/explore-migration-options/6-explore-one-step-migration-database-move-only-option-system-move-option
  - title: Analyze the SAP database migration option methodology
    url: https://learn.microsoft.com/en-us/training/modules/explore-migration-options/5-analyze-sap-database-migration-option-methodology
