id: az120-1b-rbac-acss-reader
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. manages its SAP S/4HANA systems as Virtual Instance for SAP solutions (VIS) resources in Azure Center for SAP solutions.

    A team of auditors must be able to view all the VIS resources and their Quality Insights. The auditors must not be able to start, stop or delete the SAP systems. The solution must follow the principle of least privilege.

    Which built-in role should you assign to the auditors?
  fr: |
    Contoso, Ltd. gère ses systèmes SAP S/4HANA sous forme de ressources VIS (Virtual Instance for SAP solutions) dans le Centre Azure pour les solutions SAP.

    Une équipe d'auditeurs doit pouvoir consulter toutes les ressources VIS et leurs Quality Insights. Les auditeurs ne doivent pas pouvoir démarrer, arrêter ni supprimer les systèmes SAP. La solution doit respecter le principe du moindre privilège.

    Quel rôle intégré devez-vous attribuer aux auditeurs ?
body:
  options:
    - { id: a, text: Azure Center for SAP solutions administrator }
    - { id: b, text: Azure Center for SAP solutions service role }
    - { id: c, text: Azure Center for SAP solutions reader }
    - { id: d, text: Cost Management Reader }
answer: { optionId: c }
explanation:
  correct:
    en: The Azure Center for SAP solutions reader role lets a user view all VIS resources, and it is the role listed for viewing Quality Insights. It grants no start, stop or delete action.
    fr: Le rôle Azure Center for SAP solutions reader permet de consulter toutes les ressources VIS, et c'est le rôle indiqué pour consulter les Quality Insights. Il n'accorde aucune action de démarrage, d'arrêt ni de suppression.
  options:
    a:
      en: The administrator role can deploy, install, start, stop and delete VIS resources, which exceeds the auditors' needs.
      fr: Le rôle administrator peut déployer, installer, démarrer, arrêter et supprimer des ressources VIS, ce qui dépasse les besoins des auditeurs.
    b:
      en: The service role is meant for the user-assigned managed identity that the service uses to deploy and manage SAP systems, not for people.
      fr: Le rôle service role est destiné à l'identité managée affectée par l'utilisateur que le service utilise pour déployer et gérer les systèmes SAP, pas aux personnes.
    d:
      en: Cost Management Reader shows cost analysis only; it doesn't grant read access to the VIS resources.
      fr: Cost Management Reader n'affiche que l'analyse des coûts ; il n'accorde pas l'accès en lecture aux ressources VIS.
references:
  - title: Azure RBAC for Azure Center for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/manage-with-azure-rbac
