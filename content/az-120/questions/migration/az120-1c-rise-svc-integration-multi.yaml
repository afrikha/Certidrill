id: az120-1c-rise-svc-integration-multi
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys runs SAP S/4HANA in RISE with SAP on Azure. The RISE virtual network is peered with the Wingtip hub. Wingtip plans to extend the landscape with Azure services that it deploys in its own subscriptions.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys exécute SAP S/4HANA dans RISE with SAP sur Azure. Le réseau virtuel RISE est relié par peering au hub de Wingtip. Wingtip prévoit d'étendre le paysage avec des services Azure qu'elle déploie dans ses propres abonnements.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Any Azure service with access to the Wingtip virtual network can reach the SAP systems through the ports that SAP opened.", fr: "Tout service Azure ayant accès au réseau virtuel de Wingtip peut atteindre les systèmes SAP par les ports ouverts par SAP." }
    - id: b
      text: { en: "Wingtip can deploy a jump-box VM in a subnet of the RISE virtual network to troubleshoot integrations.", fr: "Wingtip peut déployer une machine virtuelle de rebond dans un sous-réseau du réseau virtuel RISE pour dépanner les intégrations." }
    - id: c
      text: { en: "Applications can reach RISE over HTTPS on a public IP address exposed by an SAP-managed Application Gateway.", fr: "Les applications peuvent atteindre RISE en HTTPS sur une adresse IP publique exposée par un Application Gateway géré par SAP." }
    - id: d
      text: { en: "Wingtip can create private endpoints in its hub for the RISE application servers.", fr: "Wingtip peut créer dans son hub des points de terminaison privés pour les serveurs d'application RISE." }
    - id: e
      text: { en: "Wingtip can associate its own network security groups with the subnets of the RISE virtual network.", fr: "Wingtip peut associer ses propres groupes de sécurité réseau aux sous-réseaux du réseau virtuel RISE." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Any Azure service with access to the customer VNet can communicate with the RISE landscape through the available ports, as configured and opened by SAP. Applications can also use HTTPS on a public IP exposed by an SAP-managed Azure Application Gateway.
    fr: |
      Tout service Azure ayant accès au réseau virtuel du client peut communiquer avec le paysage RISE par les ports disponibles, tels que configurés et ouverts par SAP. Les applications peuvent aussi utiliser HTTPS sur une adresse IP publique exposée par un Azure Application Gateway géré par SAP.
  options:
    b:
      en: |
        Only SAP can see and manage the resources of the RISE subscription; customers cannot deploy VMs there.
      fr: |
        Seul SAP peut voir et gérer les ressources de l'abonnement RISE ; les clients ne peuvent pas y déployer de machines virtuelles.
    d:
      en: |
        SAP generally does not offer private endpoints to RISE workloads for customers.
      fr: |
        SAP ne propose généralement pas de points de terminaison privés vers les charges de travail RISE pour les clients.
    e:
      en: |
        The NSGs of the RISE VNet are managed by SAP; the customer manages NSGs only in its own VNets.
      fr: |
        Les NSG du réseau virtuel RISE sont gérés par SAP ; le client ne gère les NSG que dans ses propres réseaux virtuels.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
  - title: Integrating Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration
