id: az120-1a-quota-yn
objective: "1.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum is planning the vCPU quotas of the Azure subscriptions that will host its SAP landscape in West Europe and North Europe.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum planifie les quotas de processeurs virtuels des abonnements Azure qui hébergeront son paysage SAP dans West Europe et North Europe.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The vCPUs of deallocated VMs count toward the subscription's vCPU quota.
        fr: |
          Les processeurs virtuels des machines virtuelles libérées sont comptés dans le quota de processeurs virtuels de l'abonnement.
    - id: s2
      text:
        en: |
          An approved vCPU quota increase in West Europe also applies to North Europe.
        fr: |
          Une augmentation de quota de processeurs virtuels approuvée dans West Europe s'applique aussi à North Europe.
    - id: s3
      text:
        en: |
          When the subscription has enough vCPU quota, the deployment of an M-series VM is guaranteed to find capacity in the region.
        fr: |
          Lorsque l'abonnement dispose d'un quota de processeurs virtuels suffisant, le déploiement d'une machine virtuelle de série M est assuré de trouver de la capacité dans la région.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Quota counts all the cores in use, both allocated and deallocated. Quotas are set per region, so each region needs its own request. Quota is only a permission to deploy; capacity is the physical infrastructure, and a deployment can still fail for lack of capacity unless you use an on-demand capacity reservation.
    fr: |
      Le quota compte tous les cœurs utilisés, alloués comme libérés. Les quotas sont définis par région : chaque région nécessite sa propre demande. Le quota n'est qu'une autorisation de déployer ; la capacité est l'infrastructure physique, et un déploiement peut toujours échouer faute de capacité, sauf si vous utilisez une réservation de capacité à la demande.
references:
  - title: Check vCPU quotas
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/quotas
  - title: Increase regional vCPU quotas
    url: https://learn.microsoft.com/en-us/azure/quotas/regional-quota-requests
