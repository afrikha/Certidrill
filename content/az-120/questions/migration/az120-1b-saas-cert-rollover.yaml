id: az120-1b-saas-cert-rollover
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. federates SAP Cloud Identity Services - Identity Authentication (IAS) with Microsoft Entra ID, and its SAP BTP subaccounts trust IAS.

    The SAML signing certificate of the Microsoft Entra enterprise application that represents IAS will expire next month. You create and activate a new certificate on the enterprise application.

    What else must you do to prevent a sign-in outage?
  fr: |
    Proseware, Inc. fédère SAP Cloud Identity Services - Identity Authentication (IAS) avec Microsoft Entra ID, et ses sous-comptes SAP BTP approuvent IAS.

    Le certificat de signature SAML de l'application d'entreprise Microsoft Entra qui représente IAS expire le mois prochain. Vous créez et activez un nouveau certificat sur l'application d'entreprise.

    Que devez-vous faire d'autre pour éviter une interruption des connexions ?
body:
  options:
    - { id: a, text: { en: "Upload the metadata XML of each BTP subaccount to the Microsoft Entra enterprise application.", fr: "Charger le fichier XML de métadonnées de chaque sous-compte BTP dans l'application d'entreprise Microsoft Entra." } }
    - { id: b, text: { en: "Import the new Microsoft Entra metadata XML into the trust configuration of each BTP subaccount.", fr: "Importer le nouveau fichier XML de métadonnées Microsoft Entra dans la configuration d'approbation de chaque sous-compte BTP." } }
    - { id: c, text: { en: "Nothing, because IAS reads the Microsoft Entra federation metadata endpoint automatically.", fr: "Rien, car IAS lit automatiquement le point de terminaison de métadonnées de fédération Microsoft Entra." } }
    - { id: d, text: { en: "Import the new Microsoft Entra metadata XML into the corporate identity provider configuration in IAS.", fr: "Importer le nouveau fichier XML de métadonnées Microsoft Entra dans la configuration du fournisseur d'identité d'entreprise d'IAS." } }
answer: { optionId: d }
explanation:
  correct:
    en: IAS accepts a corporate identity provider only by importing a metadata XML file and doesn't support a dynamic metadata endpoint for Microsoft Entra ID. When the Entra enterprise application certificate changes, the SAML configuration of the corporate identity provider in IAS must be updated with the new metadata.
    fr: IAS n'accepte un fournisseur d'identité d'entreprise que par l'import d'un fichier XML de métadonnées et ne prend pas en charge de point de terminaison de métadonnées dynamique pour Microsoft Entra ID. Lorsque le certificat de l'application d'entreprise Entra change, la configuration SAML du fournisseur d'identité d'entreprise dans IAS doit être mise à jour avec les nouvelles métadonnées.
  options:
    b:
      en: The BTP subaccounts trust IAS, not Microsoft Entra ID; they are updated when the IAS tenant certificate changes.
      fr: Les sous-comptes BTP approuvent IAS, pas Microsoft Entra ID ; ils sont mis à jour lorsque le certificat du locataire IAS change.
    c:
      en: IAS has no dynamic metadata import for Microsoft Entra ID, so the old certificate would stay configured.
      fr: IAS n'a pas d'import dynamique des métadonnées pour Microsoft Entra ID ; l'ancien certificat resterait configuré.
    a:
      en: Microsoft Entra ID federates with IAS, not with the subaccounts, and its own certificate is what changed.
      fr: Microsoft Entra ID est fédéré avec IAS, pas avec les sous-comptes, et c'est son propre certificat qui a changé.
references:
  - title: Scenario - Using Microsoft Entra ID to secure access to SAP platforms and applications
    url: https://learn.microsoft.com/en-us/entra/fundamentals/scenario-azure-first-sap-identity-integration
