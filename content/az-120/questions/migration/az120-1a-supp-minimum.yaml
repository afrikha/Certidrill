id: az120-1a-supp-minimum
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware will run its production SAP ERP system on Azure virtual machines with SUSE Linux Enterprise Server and SAP ASE. Proseware needs Microsoft support only for the Azure platform itself and wants the lowest-cost support option that satisfies the support requirements of SAP Note 2015553.

    Which Azure support plan should Proseware purchase?
  fr: |
    Proseware exécutera son système SAP ERP de production sur des machines virtuelles Azure avec SUSE Linux Enterprise Server et SAP ASE. Proseware n'a besoin du support Microsoft que pour la plateforme Azure elle-même et veut l'option de support la moins chère qui satisfait les exigences de support de la note SAP 2015553.

    Quel plan de support Azure Proseware doit-elle acheter ?
body:
  options:
    - { id: a, text: Developer }
    - { id: b, text: Standard }
    - { id: c, text: Basic }
    - { id: d, text: Professional Direct }
answer: { optionId: d }
explanation:
  correct:
    en: |
      SAP Note 2015553 requires a support contract with Microsoft for SAP systems on Azure VMs. Microsoft's guidance describes Professional Direct as the minimum level when you only need support for Azure itself; Unified (formerly Premier) is recommended when you also need enterprise support for Windows Server or SQL Server.
    fr: |
      La note SAP 2015553 exige un contrat de support avec Microsoft pour les systèmes SAP sur des machines virtuelles Azure. Les recommandations de Microsoft présentent Professional Direct comme le niveau minimal lorsque vous n'avez besoin que du support d'Azure lui-même ; Unified (anciennement Premier) est recommandé lorsque vous avez aussi besoin d'un support d'entreprise pour Windows Server ou SQL Server.
  options:
    a:
      en: |
        Developer is meant for non-production environments, with business-hours support and Severity C responses only.
      fr: |
        Developer est destiné aux environnements hors production, avec un support aux heures ouvrées et uniquement des réponses de gravité C.
    b:
      en: |
        Standard offers 24x7 technical support but is below the level that Microsoft documents as the minimum for SAP workloads.
      fr: |
        Standard offre un support technique 24 h/24, 7 j/7, mais reste en dessous du niveau que Microsoft documente comme minimal pour les charges de travail SAP.
    c:
      en: |
        Basic includes billing and subscription management support only, with no technical support.
      fr: |
        Basic inclut uniquement le support de facturation et de gestion des abonnements, sans support technique.
references:
  - title: Explore licensing, pricing, and support of Azure for SAP workloads
    url: https://learn.microsoft.com/en-us/training/modules/explore-licensing-pricing-support/3-explore-licensing-pricing-support-azure-for-sap-workloads
  - title: "SAP workloads on Azure: planning and deployment checklist"
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/deployment-checklist
