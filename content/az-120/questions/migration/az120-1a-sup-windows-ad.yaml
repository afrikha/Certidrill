id: az120-1a-sup-windows-ad
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware is a new company that uses only cloud services. It has a Microsoft Entra tenant and no on-premises Active Directory Domain Services (AD DS) environment. Proseware plans to deploy SAP S/4HANA with Windows Server application servers on Azure virtual machines.

    The Windows application servers must be joined to a domain in a supported configuration. Proseware doesn't want to deploy or maintain domain controllers.

    What should you recommend?
  fr: |
    Proseware est une nouvelle entreprise qui n'utilise que des services cloud. Elle dispose d'un locataire Microsoft Entra et d'aucun environnement Active Directory Domain Services (AD DS) local. Proseware prévoit de déployer SAP S/4HANA avec des serveurs d'applications Windows Server sur des machines virtuelles Azure.

    Les serveurs d'applications Windows doivent être joints à un domaine dans une configuration prise en charge. Proseware ne veut pas déployer ni maintenir de contrôleurs de domaine.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Join the VMs to a Microsoft Entra Domain Services managed domain", fr: "Joindre les machines virtuelles à un domaine managé Microsoft Entra Domain Services" } }
    - { id: b, text: { en: "Join the VMs to Microsoft Entra ID by using Microsoft Entra join", fr: "Joindre les machines virtuelles à Microsoft Entra ID avec la jonction Microsoft Entra" } }
    - { id: c, text: { en: "Synchronize the tenant by using Microsoft Entra Connect cloud sync", fr: "Synchroniser le locataire avec Microsoft Entra Connect cloud sync" } }
    - { id: d, text: { en: "Register the VMs in a Microsoft Entra External ID tenant", fr: "Inscrire les machines virtuelles dans un locataire Microsoft Entra External ID" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For SAP NetWeaver and S/4HANA on Windows, Microsoft supports on-premises Active Directory and Microsoft Entra Domain Services as the domain. Entra Domain Services is a managed domain, so Proseware doesn't run its own domain controllers.
    fr: |
      Pour SAP NetWeaver et S/4HANA sous Windows, Microsoft prend en charge comme domaine Active Directory local et Microsoft Entra Domain Services. Entra Domain Services est un domaine managé : Proseware n'exécute pas ses propres contrôleurs de domaine.
  options:
    b:
      en: |
        Microsoft Entra ID isn't supported as the directory for SAP systems on Windows; Entra accounts remain usable for single sign-on only.
      fr: |
        Microsoft Entra ID n'est pas pris en charge comme annuaire des systèmes SAP sous Windows ; les comptes Entra restent utilisables uniquement pour l'authentification unique.
    c:
      en: |
        Cloud sync synchronizes an existing AD DS to Microsoft Entra ID; Proseware has no AD DS, and the VMs still wouldn't be in a supported domain.
      fr: |
        Cloud sync synchronise un AD DS existant vers Microsoft Entra ID ; Proseware n'a pas d'AD DS et les machines virtuelles ne seraient toujours pas dans un domaine pris en charge.
    d:
      en: |
        External ID manages customer and partner identities for applications; it doesn't provide a Windows domain.
      fr: |
        External ID gère les identités des clients et des partenaires pour les applications ; il ne fournit pas de domaine Windows.
references:
  - title: SAP workload on Azure virtual machine supported scenarios
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-supported-configurations
