id: az120-1a-lic-sles-cli-dd
objective: "1.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind runs two SAP application server VMs on Azure:

    - **sapapp01** was deployed from a SUSE Linux Enterprise Server for SAP Applications pay-as-you-go image. Northwind has now bought SUSE subscriptions and wants to stop paying the SUSE software fee through Azure.
    - **sapapp02** was deployed from the same pay-as-you-go image and converted to bring-your-own-subscription (BYOS) last year. It must return to the billing model of its original image.

    Neither VM may be redeployed.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind exécute deux machines virtuelles de serveurs d'applications SAP sur Azure :

    - **sapapp01** a été déployée à partir d'une image de paiement à l'utilisation SUSE Linux Enterprise Server for SAP Applications. Northwind a maintenant acheté des abonnements SUSE et veut cesser de payer les frais du logiciel SUSE via Azure.
    - **sapapp02** a été déployée à partir de la même image de paiement à l'utilisation et convertie en BYOS (utilisation de son propre abonnement) l'an dernier. Elle doit revenir au modèle de facturation de son image d'origine.

    Aucune des deux machines virtuelles ne peut être redéployée.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az vm update --resource-group rg-sap-prd --name sapapp01 --license-type [[byos]]

    az vm update --resource-group rg-sap-prd --name sapapp02 --license-type [[reset]]
  slots:
    - id: byos
      options:
        - { id: slessap, text: SLES_SAP }
        - { id: slesbyos, text: SLES_BYOS }
        - { id: rhelbyos, text: RHEL_BYOS }
        - { id: winsrv, text: Windows_Server }
    - id: reset
      options:
        - { id: sles, text: SLES }
        - { id: rhelbyos, text: RHEL_BYOS }
        - { id: none, text: NONE }
        - { id: winsrv, text: Windows_Server }
answer:
  values: { byos: slesbyos, reset: none }
explanation:
  correct:
    en: |
      Azure Hybrid Benefit for Linux switches a VM between pay-as-you-go and BYOS without redeployment. SLES_BYOS removes the SUSE software fee from the Azure bill. The value NONE reverts the VM to the billing model of its original image, here SLES for SAP pay-as-you-go.
    fr: |
      Azure Hybrid Benefit pour Linux bascule une machine virtuelle entre paiement à l'utilisation et BYOS sans redéploiement. SLES_BYOS retire les frais du logiciel SUSE de la facture Azure. La valeur NONE ramène la machine virtuelle au modèle de facturation de son image d'origine, ici SLES for SAP en paiement à l'utilisation.
  options:
    slessap:
      en: |
        SLES_SAP is a pay-as-you-go license type: the SUSE fee would still be billed by Azure.
      fr: |
        SLES_SAP est un type de licence de paiement à l'utilisation : les frais SUSE seraient toujours facturés par Azure.
    rhelbyos:
      en: |
        RHEL_BYOS applies to Red Hat Enterprise Linux; a mismatched license type doesn't update billing.
      fr: |
        RHEL_BYOS s'applique à Red Hat Enterprise Linux ; un type de licence qui ne correspond pas à la distribution ne modifie pas la facturation.
    sles:
      en: |
        SLES selects the pay-as-you-go model of standard SLES, not the original SLES for SAP model of the image.
      fr: |
        SLES sélectionne le modèle de paiement à l'utilisation de SLES standard, pas le modèle SLES for SAP d'origine de l'image.
    winsrv:
      en: |
        Windows_Server is the Azure Hybrid Benefit value for Windows Server VMs.
      fr: |
        Windows_Server est la valeur Azure Hybrid Benefit des machines virtuelles Windows Server.
references:
  - title: Azure Hybrid Benefit for Linux virtual machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/azure-hybrid-benefit-linux
