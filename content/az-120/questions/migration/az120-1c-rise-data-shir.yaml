id: az120-1c-rise-data-shir
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. runs SAP S/4HANA in RISE with SAP on Azure. The RISE virtual network is peered with a Contoso hub. Contoso plans an Azure Data Factory pipeline that uses the SAP Table connector to copy S/4HANA tables to Azure Data Lake Storage. The extraction must use private IP addresses only.

    You need to recommend an integration runtime for the pipeline.

    What should you recommend?
  fr: |
    Contoso, Ltd. exécute SAP S/4HANA dans RISE with SAP sur Azure. Le réseau virtuel RISE est relié par peering à un hub Contoso. Contoso prévoit un pipeline Azure Data Factory qui utilise le connecteur SAP Table pour copier des tables S/4HANA vers Azure Data Lake Storage. L'extraction ne doit utiliser que des adresses IP privées.

    Vous devez recommander un runtime d'intégration pour le pipeline.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "An Azure integration runtime in a managed virtual network with a managed private endpoint to S/4HANA", fr: "Un runtime d'intégration Azure dans un réseau virtuel managé avec un point de terminaison privé managé vers S/4HANA" }
    - id: b
      text: { en: "An Azure integration runtime that connects through the SAP-managed Application Gateway", fr: "Un runtime d'intégration Azure qui se connecte par l'Application Gateway géré par SAP" }
    - id: c
      text: { en: "An Azure-SSIS integration runtime that runs the SAP extraction as an SSIS package", fr: "Un runtime d'intégration Azure-SSIS qui exécute l'extraction SAP sous forme de package SSIS" }
    - id: d
      text: { en: "A self-hosted integration runtime on a VM in a Contoso virtual network that is connected to RISE", fr: "Un runtime d'intégration auto-hébergé sur une machine virtuelle d'un réseau virtuel Contoso connecté à RISE" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Most SAP connectors, including SAP Table, are available only on the self-hosted integration runtime; they use the SAP .NET connector to call function modules over RFC. The self-hosted IR, deployed and operated by the customer in its own VNet, reaches RISE through the VNet peering and private addresses only.
    fr: |
      La plupart des connecteurs SAP, dont SAP Table, ne sont disponibles que sur le runtime d'intégration auto-hébergé ; ils utilisent le connecteur SAP .NET pour appeler des modules fonction par RFC. Le runtime d'intégration auto-hébergé, déployé et exploité par le client dans son propre réseau virtuel, atteint RISE par le peering de réseaux virtuels et des adresses privées uniquement.
  options:
    a:
      en: |
        SAP generally does not offer private endpoints to RISE workloads, and the SAP Table connector requires a self-hosted IR.
      fr: |
        SAP ne propose généralement pas de points de terminaison privés vers les charges de travail RISE, et le connecteur SAP Table exige un runtime d'intégration auto-hébergé.
    b:
      en: |
        The Azure IR reaches RISE through a public IP exposed by the SAP-managed Application Gateway over HTTPS, which violates the private-only requirement.
      fr: |
        Le runtime d'intégration Azure atteint RISE par une adresse IP publique exposée par l'Application Gateway géré par SAP en HTTPS, ce qui ne respecte pas l'exigence d'adresses privées.
    c:
      en: |
        The Azure-SSIS IR runs SSIS packages; it is not the runtime of the Data Factory SAP Table connector.
      fr: |
        Le runtime d'intégration Azure-SSIS exécute des packages SSIS ; ce n'est pas le runtime du connecteur SAP Table de Data Factory.
references:
  - title: Integrating Azure services with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-services
