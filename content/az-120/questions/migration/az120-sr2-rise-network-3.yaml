id: az120-sr2-rise-network-3
objective: "1.3.1"
type: series_yesno
series: az120-sr2-rise-network
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You peer Hub1 with SAP RISE by using remote gateway transit, and SAP adds an ExpressRoute gateway to the RISE network.
  fr: |
    Vous créez un peering entre Hub1 et SAP RISE avec le transit par passerelle distante, et SAP ajoute une passerelle ExpressRoute au réseau RISE.
body:
  solution:
    en: |
      You create a virtual network peering between **Hub1** and the SAP RISE virtual network, and the RISE side **uses the remote gateway** of Hub1. To add a second path for on-premises users, SAP also deploys an **ExpressRoute gateway** in the SAP RISE virtual network and connects it to Contoso's ExpressRoute circuit.
    fr: |
      Vous créez un peering de réseaux virtuels entre **Hub1** et le réseau virtuel SAP RISE, et le côté RISE **utilise la passerelle distante** de Hub1. Pour ajouter un second chemin pour les utilisateurs locaux, SAP déploie aussi une **passerelle ExpressRoute** dans le réseau virtuel SAP RISE et la connecte au circuit ExpressRoute de Contoso.
answer: { value: false }
explanation:
  correct:
    en: |
      A virtual network can have only one gateway, either its own or a remote one through peering. When the RISE network uses the remote gateway of Hub1, no gateway can be added to the RISE network, so this combination cannot be deployed.
    fr: |
      Un réseau virtuel ne peut avoir qu'une seule passerelle, la sienne ou une passerelle distante via le peering. Lorsque le réseau RISE utilise la passerelle distante de Hub1, aucune passerelle ne peut être ajoutée au réseau RISE : cette combinaison ne peut pas être déployée.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
