id: az120-cs2b-adf-runtime
objective: "1.3.4"
type: single
caseStudy: az120-cs2b-wingtip
difficulty: 1
status: draft
stem:
  en: |
    You need to recommend an integration runtime for the Azure Data Factory pipeline that extracts WS1 tables. The solution must meet the data extraction requirements.

    What should you recommend?
  fr: |
    Vous devez recommander un runtime d'intégration pour le pipeline Azure Data Factory qui extrait les tables de WS1. La solution doit respecter les exigences d'extraction de données.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "An Azure integration runtime that connects through the SAP-managed application gateway", fr: "Un runtime d'intégration Azure qui se connecte via la passerelle d'application gérée par SAP" } }
    - { id: b, text: { en: "A self-hosted integration runtime on VMs in Spoke-Data", fr: "Un runtime d'intégration auto-hébergé sur des machines virtuelles de Spoke-Data" } }
    - { id: c, text: { en: "An Azure integration runtime in a managed virtual network with a managed private endpoint to WS1", fr: "Un runtime d'intégration Azure dans un réseau virtuel managé avec un point de terminaison privé managé vers WS1" } }
    - { id: d, text: { en: "A self-hosted integration runtime on the WS1 application server VMs", fr: "Un runtime d'intégration auto-hébergé sur les machines virtuelles de serveur d'applications de WS1" } }
answer: { optionId: b }
explanation:
  correct:
    en: The SAP Table connector requires a self-hosted integration runtime with the SAP .NET Connector installed. For SAP RISE, the customer deploys the self-hosted runtime in its own subscription and virtual network, and it reaches SAP over the peering by using private IP addresses only.
    fr: Le connecteur SAP Table exige un runtime d'intégration auto-hébergé sur lequel SAP .NET Connector est installé. Pour SAP RISE, le client déploie le runtime auto-hébergé dans son propre abonnement et son propre réseau virtuel, et ce runtime atteint SAP par le peering en utilisant uniquement des adresses IP privées.
  options:
    a: { en: "The SAP Table connector does not support the Azure integration runtime, and the application gateway path uses a public IP address.", fr: "Le connecteur SAP Table ne prend pas en charge le runtime d'intégration Azure, et le chemin par la passerelle d'application utilise une adresse IP publique." }
    c: { en: "The SAP Table connector needs a self-hosted runtime, and SAP generally does not offer private endpoints to RISE workloads.", fr: "Le connecteur SAP Table nécessite un runtime auto-hébergé, et SAP ne propose généralement pas de points de terminaison privés pour les charges de travail RISE." }
    d: { en: "The WS1 VMs run in SAP's subscription and are managed by SAP; Wingtip cannot install software on them.", fr: "Les machines virtuelles de WS1 s'exécutent dans l'abonnement de SAP et sont gérées par SAP ; Wingtip ne peut pas y installer de logiciel." }
references:
  - title: Integrate Azure services with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-services
  - title: Copy data from an SAP table using Azure Data Factory or Azure Synapse Analytics
    url: https://learn.microsoft.com/en-us/azure/data-factory/connector-sap-table
