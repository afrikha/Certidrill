id: az120-cs2b-identity
objective: "1.3.5"
type: dragdrop
caseStudy: az120-cs2b-wingtip
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend solutions for the identity and security monitoring requirements of WS1.

    What should you recommend for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander des solutions pour les exigences d'identité et de supervision de la sécurité de WS1.

    Que devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: saml, text: { en: "SAML with Microsoft Entra ID", fr: "SAML avec Microsoft Entra ID" } }
    - { id: snc, text: { en: "SNC with Microsoft Entra ID", fr: "SNC avec Microsoft Entra ID" } }
    - { id: spnego, text: { en: "SPNEGO with Active Directory", fr: "SPNEGO avec Active Directory" } }
    - { id: sentinel, text: { en: "Microsoft Sentinel solution for SAP in Wingtip's subscription, with the agentless data connector", fr: "Solution Microsoft Sentinel pour SAP dans l'abonnement de Wingtip, avec le connecteur de données sans agent" } }
    - { id: logserv, text: { en: "SAP LogServ service", fr: "Service SAP LogServ" } }
    - { id: ams, text: { en: "Azure Monitor for SAP solutions", fr: "Azure Monitor pour solutions SAP" } }
  targets:
    - { id: fiori, text: { en: "Fiori launchpad sign-in", fr: "Connexion au Fiori launchpad" } }
    - { id: gui, text: { en: "SAP GUI single sign-on", fr: "Authentification unique SAP GUI" } }
    - { id: audit, text: { en: "SAP security audit log to Sentinel", fr: "Journal d'audit de sécurité SAP vers Sentinel" } }
    - { id: oslog, text: { en: "WS1 operating system logs to Sentinel", fr: "Journaux du système d'exploitation de WS1 vers Sentinel" } }
answer:
  mapping: { fiori: saml, gui: snc, audit: sentinel, oslog: logserv }
explanation:
  correct:
    en: Fiori uses SAML (or OAuth) with Microsoft Entra ID, configured by the customer, so Conditional Access applies. SAP GUI single sign-on with Microsoft Entra ID uses SNC. The Microsoft Sentinel solution for SAP runs in the customer's subscription, collects with the agentless data connector (SAP Cloud Connector and SAP Integration Suite) and covers the SAP application layer only; infrastructure and operating system logs of RISE systems are available only through the optional SAP LogServ service, which integrates with Sentinel.
    fr: Fiori utilise SAML (ou OAuth) avec Microsoft Entra ID, configuré par le client, ce qui permet d'appliquer l'accès conditionnel. L'authentification unique SAP GUI avec Microsoft Entra ID utilise SNC. La solution Microsoft Sentinel pour SAP s'exécute dans l'abonnement du client, collecte avec le connecteur de données sans agent (SAP Cloud Connector et SAP Integration Suite) et ne couvre que la couche applicative SAP ; les journaux d'infrastructure et du système d'exploitation des systèmes RISE ne sont disponibles que par le service facultatif SAP LogServ, qui s'intègre à Sentinel.
  options:
    spnego: { en: "SPNEGO relies on Active Directory Kerberos, not on Microsoft Entra ID, so Conditional Access does not apply.", fr: "SPNEGO repose sur Kerberos d'Active Directory, pas sur Microsoft Entra ID : l'accès conditionnel ne s'applique pas." }
    ams: { en: "SAP RISE doesn't support any integration with Azure Monitor for SAP solutions, and it is not a log source for Sentinel.", fr: "SAP RISE ne prend en charge aucune intégration avec Azure Monitor pour solutions SAP, qui n'est pas une source de journaux pour Sentinel." }
references:
  - title: Azure identity and security services with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-security
  - title: Deploy the Microsoft Sentinel solution for SAP applications
    url: https://learn.microsoft.com/en-us/azure/sentinel/sap/deployment-overview
