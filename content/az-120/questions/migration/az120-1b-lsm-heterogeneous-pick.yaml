id: az120-1b-lsm-heterogeneous-pick
objective: "1.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation plans to move five on-premises SAP systems to Azure. The following table shows the current platform of each system and the platform required in Azure.

    | System | Current platform | Required platform in Azure |
    | --- | --- | --- |
    | ERP1 | AIX on IBM Power, IBM Db2 | SLES, IBM Db2 |
    | BW1 | Windows Server, SQL Server | Windows Server, SQL Server |
    | CRM1 | HP-UX, Oracle Database | Windows Server, SQL Server |
    | ERP2 | Red Hat Enterprise Linux, Oracle Database | Red Hat Enterprise Linux, SAP HANA |
    | SRM1 | SLES on x86 servers, SAP ASE | SLES, SAP ASE |

    No system is upgraded to a new SAP release except where a move to SAP HANA requires it.

    For which two systems is lift-shift-migrate the appropriate approach?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation prévoit de déplacer cinq systèmes SAP locaux vers Azure. Le tableau suivant indique la plateforme actuelle de chaque système et la plateforme exigée dans Azure.

    | Système | Plateforme actuelle | Plateforme exigée dans Azure |
    | --- | --- | --- |
    | ERP1 | AIX sur IBM Power, IBM Db2 | SLES, IBM Db2 |
    | BW1 | Windows Server, SQL Server | Windows Server, SQL Server |
    | CRM1 | HP-UX, Oracle Database | Windows Server, SQL Server |
    | ERP2 | Red Hat Enterprise Linux, Oracle Database | Red Hat Enterprise Linux, SAP HANA |
    | SRM1 | SLES sur serveurs x86, SAP ASE | SLES, SAP ASE |

    Aucun système n'est mis à niveau vers une nouvelle version SAP, sauf lorsqu'un passage à SAP HANA l'exige.

    Pour quels deux systèmes le lift-shift-migrate est-il l'approche appropriée ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: ERP1 }
    - { id: b, text: BW1 }
    - { id: c, text: CRM1 }
    - { id: d, text: ERP2 }
    - { id: e, text: SRM1 }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Lift-shift-migrate applies when the operating system or the DBMS changes to a target other than SAP HANA, which requires a heterogeneous system copy. ERP1 keeps Db2 but leaves big-endian IBM Power for x86 Linux, and CRM1 changes both the operating system and the DBMS.
    fr: "Le lift-shift-migrate s'applique lorsque le système d'exploitation ou le SGBD change vers une cible autre que SAP HANA, ce qui exige une copie système hétérogène. ERP1 conserve Db2 mais quitte IBM Power big-endian pour Linux x86, et CRM1 change à la fois de système d'exploitation et de SGBD."
  options:
    b: { en: "BW1 keeps the same operating system and DBMS on x86: a lift and shift with a homogeneous copy.", fr: "BW1 conserve le même système d'exploitation et le même SGBD sur x86 : c'est un lift-and-shift avec copie homogène." }
    d: { en: "ERP2 moves to SAP HANA, which is a lift-shift-migrate to HANA (DMO).", fr: "ERP2 passe à SAP HANA, ce qui correspond à un lift-shift-migrate vers HANA (DMO)." }
    e: { en: "SRM1 already runs on x86 and keeps SLES and SAP ASE: a lift and shift.", fr: "SRM1 s'exécute déjà sur x86 et conserve SLES et SAP ASE : c'est un lift-and-shift." }
references:
  - title: Explore very large database migration
    url: https://learn.microsoft.com/en-us/training/modules/migrate-very-large-databases-to-azure/2-explore-very-large-database-migration
  - title: Compare classical migration with the SAP database migration option (DMO)
    url: https://learn.microsoft.com/en-us/training/modules/explore-migration-options/4-compare-classic-vs-sap-database-move-only
