id: az120-cs3c-migration-sql
objective: "1.1.8"
type: single
caseStudy: az120-cs3c-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend a migration method for the TRP database that meets the migration requirement. What should you recommend?
  fr: |
    Vous devez recommander une méthode de migration pour la base de données de TRP qui respecte l'exigence de migration. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Lift and shift: add SQL-PRD1 as an asynchronous replica of the on-premises availability group, and fail over to it at cutover", fr: "Lift-and-shift : ajouter SQL-PRD1 comme réplica asynchrone du groupe de disponibilité local, puis basculer vers lui lors de la bascule" } }
    - { id: b, text: { en: "Lift and shift: back up the database to URL in Azure Blob Storage at cutover, and restore it on SQL-PRD1", fr: "Lift-and-shift : sauvegarder la base de données vers une URL de Stockage Blob Azure lors de la bascule, puis la restaurer sur SQL-PRD1" } }
    - { id: c, text: { en: "Lift and shift: replicate the on-premises database servers with Azure Site Recovery, and fail them over at cutover", fr: "Lift-and-shift : répliquer les serveurs de base de données locaux avec Azure Site Recovery, puis les basculer lors de la bascule" } }
    - { id: d, text: { en: "Lift-shift-migrate to HANA: convert the database with SUM and DMO with System Move during the cutover", fr: "Lift-shift-migrate vers HANA : convertir la base de données avec SUM et DMO with System Move lors de la bascule" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Trey Research keeps the same SAP release, operating system and database, so this is a lift and shift (homogeneous) migration. DBMS replication such as SQL Server Always On can build the copy in Azure while the on-premises database stays productive; at cutover, only a role switch is needed, without a full backup, restore, export or import.
    fr: |
      Trey Research conserve la même version SAP, le même système d'exploitation et la même base de données : il s'agit d'une migration lift-and-shift (homogène). Une réplication du SGBD comme SQL Server Always On peut construire la copie dans Azure pendant que la base locale reste en production ; lors de la bascule, seul un changement de rôle est nécessaire, sans sauvegarde, restauration, export ni import complets.
  options:
    b:
      en: |
        A full backup and restore of the 6-TB database during the cutover is explicitly forbidden by the migration requirement.
      fr: |
        Une sauvegarde et une restauration complètes de la base de 6 To pendant la bascule sont explicitement interdites par l'exigence de migration.
    c:
      en: |
        Azure Site Recovery isn't advised for databases because it doesn't guarantee database consistency and has data churn limits.
      fr: |
        Azure Site Recovery n'est pas conseillé pour les bases de données, car il ne garantit pas leur cohérence et présente des limites de taux de modification des données.
    d:
      en: |
        DMO migrates the database to SAP HANA with an export and import, while Trey Research keeps SQL Server and forbids an export or import during the cutover.
      fr: |
        DMO migre la base de données vers SAP HANA par un export et un import, alors que Trey Research conserve SQL Server et interdit tout export ou import pendant la bascule.
references:
  - title: Explore two-step migration - lift and shift followed by DMO
    url: https://learn.microsoft.com/en-us/training/modules/explore-migration-options/7-explore-two-step-migration-lift-shift-followed-database-move-only
  - title: Disaster Recovery overview and infrastructure guidelines for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-overview-guide
