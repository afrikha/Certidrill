id: az120-1b-hier-prod-nonprod
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. uses an Azure landing zone hierarchy with the Platform, Landing zones (with the Corp and Online child management groups) and Sandbox management groups. Contoso plans to move its SAP landscape to Azure. The SAP systems need hybrid connectivity to the corporate network through the connectivity hub.

    The production systems and the non-production systems (sandbox, development, quality assurance) must be separated for billing and access control, and the design must follow Microsoft's recommendations and limit management overhead.

    How should you organize the SAP subscriptions?
  fr: |
    Contoso, Ltd. utilise une hiérarchie de zone d'atterrissage Azure avec les groupes d'administration Platform, Landing zones (avec les groupes d'administration enfants Corp et Online) et Sandbox. Contoso prévoit de déplacer son paysage SAP vers Azure. Les systèmes SAP ont besoin d'une connectivité hybride au réseau de l'entreprise par le hub de connectivité.

    Les systèmes de production et hors production (bac à sable, développement, assurance qualité) doivent être séparés pour la facturation et le contrôle d'accès, et la conception doit suivre les recommandations de Microsoft et limiter la charge de gestion.

    Comment devez-vous organiser les abonnements SAP ?
body:
  options:
    - { id: a, text: { en: "Create one subscription for all the SAP environments under the Platform management group.", fr: "Créer un abonnement pour tous les environnements SAP sous le groupe d'administration Platform." } }
    - { id: b, text: { en: "Create Production and Non-production management groups under Corp, each containing one SAP subscription.", fr: "Créer les groupes d'administration Production et Non-production sous Corp, chacun contenant un abonnement SAP." } }
    - { id: c, text: { en: "Create one subscription for each SAP system (SID) under the Online management group.", fr: "Créer un abonnement pour chaque système SAP (SID) sous le groupe d'administration Online." } }
    - { id: d, text: { en: "Create an SAP production subscription and an SAP non-production subscription under the Corp management group.", fr: "Créer un abonnement SAP de production et un abonnement SAP hors production sous le groupe d'administration Corp." } }
answer: { optionId: d }
explanation:
  correct:
    en: Workloads that need hybrid connectivity through the hub belong under Corp. Microsoft recommends separating production and non-production into different subscriptions within the same management group rather than creating environment management groups, and the SAP landscape architecture uses SAP production and SAP non-production subscriptions without a subscription per SAP system.
    fr: Les charges de travail qui ont besoin d'une connectivité hybride par le hub relèvent de Corp. Microsoft recommande de séparer la production et la hors production dans des abonnements différents au sein du même groupe d'administration plutôt que de créer des groupes d'administration par environnement, et l'architecture de paysage SAP utilise des abonnements SAP de production et SAP hors production, sans abonnement par système SAP.
  options:
    b:
      en: Microsoft advises against management groups for production, development or test; environments are separated by subscriptions.
      fr: Microsoft déconseille les groupes d'administration pour la production, le développement ou le test ; les environnements sont séparés par abonnements.
    c:
      en: Online is for workloads with direct internet connectivity, and a subscription per SAP system adds management overhead and network complexity.
      fr: Online est destiné aux charges de travail avec connectivité Internet directe, et un abonnement par système SAP ajoute de la charge de gestion et de la complexité réseau.
    a:
      en: Platform holds the shared platform subscriptions, and one subscription doesn't separate production from non-production.
      fr: Platform contient les abonnements de plateforme partagés, et un seul abonnement ne sépare pas la production de la hors production.
references:
  - title: Management groups
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups
  - title: SAP landscape architecture
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/sap/sap-whole-landscape
