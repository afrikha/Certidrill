id: az120-1c-rise-impl-peering-initiated
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys created a peering named **hub-to-rise** from its hub virtual network to its RISE with SAP virtual network by using the resource ID provided by SAP. The address spaces of the two virtual networks do not overlap.

    One day later, the Azure portal shows the peering status of hub-to-rise as **Initiated**, and no traffic flows between the networks.

    What should you do?
  fr: |
    Tailspin Toys a créé un peering nommé **hub-to-rise** de son réseau virtuel hub vers son réseau virtuel RISE with SAP en utilisant l'ID de ressource fourni par SAP. Les espaces d'adressage des deux réseaux virtuels ne se chevauchent pas.

    Un jour plus tard, le portail Azure affiche l'état de peering **Initiated** pour hub-to-rise, et aucun trafic ne circule entre les réseaux.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Ask SAP to create and approve the corresponding peering on the RISE virtual network.", fr: "Demander à SAP de créer et d'approuver le peering correspondant sur le réseau virtuel RISE." }
    - id: b
      text: { en: "Enable gateway transit on hub-to-rise and wait for the status to change.", fr: "Activer le transit par passerelle sur hub-to-rise et attendre le changement d'état." }
    - id: c
      text: { en: "Run a sync on hub-to-rise to refresh the address space of the remote network.", fr: "Exécuter une synchronisation de hub-to-rise pour actualiser l'espace d'adressage du réseau distant." }
    - id: d
      text: { en: "Delete hub-to-rise and create it again by using the name of the RISE network.", fr: "Supprimer hub-to-rise et le recréer en utilisant le nom du réseau RISE." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The first peering of a pair has the status Initiated; it becomes Connected only when the corresponding peering is created on the other virtual network. For RISE, SAP creates and approves its side, so you must ask SAP to complete it.
    fr: |
      Le premier peering d'une paire a l'état Initiated ; il ne passe à Connected que lorsque le peering correspondant est créé sur l'autre réseau virtuel. Pour RISE, SAP crée et approuve son côté : vous devez donc demander à SAP de le terminer.
  options:
    b:
      en: |
        Gateway transit controls access to a gateway through the peering; it does not complete a half-created peering.
      fr: |
        Le transit par passerelle contrôle l'accès à une passerelle via le peering ; il ne complète pas un peering créé d'un seul côté.
    c:
      en: |
        A sync applies address space changes to an existing connected peering; the missing remote peering is the problem.
      fr: |
        Une synchronisation applique les modifications d'espace d'adressage à un peering connecté existant ; le problème est le peering distant manquant.
    d:
      en: |
        A remote VNet in another subscription and tenant must be referenced by its resource ID, and recreating the peering does not create SAP's side.
      fr: |
        Un réseau virtuel distant d'un autre abonnement et d'un autre locataire doit être référencé par son ID de ressource, et recréer le peering ne crée pas le côté SAP.
references:
  - title: Create, Change, or Delete Azure Virtual Network Peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
