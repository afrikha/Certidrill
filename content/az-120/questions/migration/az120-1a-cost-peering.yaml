id: az120-1a-cost-peering
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    In Litware's proposed design, the SAP application servers are in a virtual network named VNet-App and the SAP HANA database is in a virtual network named VNet-DB. Both virtual networks are in the same region and are peered. The finance team notices a large network data transfer charge in the cost estimate.

    You need to reduce the network cost of the design while keeping a configuration that Microsoft recommends.

    What should you recommend?
  fr: |
    Dans la conception proposée par Litware, les serveurs d'applications SAP sont dans un réseau virtuel nommé VNet-App et la base de données SAP HANA dans un réseau virtuel nommé VNet-DB. Les deux réseaux virtuels sont dans la même région et reliés par peering. L'équipe finance remarque des frais importants de transfert de données réseau dans l'estimation des coûts.

    Vous devez réduire le coût réseau de la conception tout en conservant une configuration recommandée par Microsoft.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Place the application servers and the database in two subnets of one virtual network", fr: "Placer les serveurs d'applications et la base de données dans deux sous-réseaux d'un même réseau virtuel" } }
    - { id: b, text: { en: "Replace the peering with a site-to-site VPN between the two virtual networks", fr: "Remplacer le peering par un VPN de site à site entre les deux réseaux virtuels" } }
    - { id: c, text: { en: "Route the traffic between the two virtual networks through a hub network virtual appliance", fr: "Faire passer le trafic entre les deux réseaux virtuels par une appliance virtuelle réseau du hub" } }
    - { id: d, text: { en: "Add a private endpoint for the database in VNet-App", fr: "Ajouter un point de terminaison privé pour la base de données dans VNet-App" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Traffic between peered virtual networks incurs data transfer charges, which can be substantial with the heavy traffic between SAP application servers and the database. Microsoft recommends placing the application and DBMS tiers in subnets of the same virtual network, where this traffic isn't charged as peering traffic.
    fr: |
      Le trafic entre réseaux virtuels reliés par peering entraîne des frais de transfert de données, qui peuvent être importants avec le trafic intense entre les serveurs d'applications SAP et la base de données. Microsoft recommande de placer les couches application et SGBD dans des sous-réseaux du même réseau virtuel, où ce trafic n'est pas facturé comme du trafic de peering.
  options:
    b:
      en: |
        A VPN adds gateway costs and latency between the tiers, which degrades SAP performance.
      fr: |
        Un VPN ajoute des coûts de passerelle et de la latence entre les couches, ce qui dégrade les performances SAP.
    c:
      en: |
        An NVA in the application-to-database path isn't supported and still incurs the peering charges.
      fr: |
        Une NVA sur le chemin application-base de données n'est pas prise en charge et entraîne toujours les frais de peering.
    d:
      en: |
        Private endpoints serve PaaS services and incur their own charges; they don't apply to a HANA VM.
      fr: |
        Les points de terminaison privés servent aux services PaaS et ont leurs propres frais ; ils ne s'appliquent pas à une machine virtuelle HANA.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
