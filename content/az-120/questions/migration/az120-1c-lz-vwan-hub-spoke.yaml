id: az120-1c-lz-vwan-hub-spoke
objective: "1.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Two companies are designing the network topology of their SAP landing zones:

    - **Northwind Traders** will run SAP systems in four Azure regions. It has 60 branch offices connected through an SD-WAN solution and needs global transit connectivity between all the regions and the on-premises locations.
    - **Tailspin Toys** will run SAP systems in a single Azure region. It has three branch offices and its network team requires full control to configure the Azure routing manually.

    You need to recommend a topology for each company.

    How should you complete the recommendation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Deux entreprises conçoivent la topologie réseau de leurs zones d'atterrissage SAP :

    - **Northwind Traders** exécutera des systèmes SAP dans quatre régions Azure. Elle compte 60 agences connectées par une solution SD-WAN et a besoin d'une connectivité de transit mondiale entre toutes les régions et les sites locaux.
    - **Tailspin Toys** exécutera des systèmes SAP dans une seule région Azure. Elle compte trois agences et son équipe réseau exige un contrôle total pour configurer manuellement le routage Azure.

    Vous devez recommander une topologie pour chaque entreprise.

    Comment devez-vous compléter la recommandation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Northwind Traders: [[nw]]

      Tailspin Toys: [[ts]]

      In the Northwind Traders design, traffic between spoke virtual networks is handled by: [[spoke]]
    fr: |
      Northwind Traders : [[nw]]

      Tailspin Toys : [[ts]]

      Dans la conception de Northwind Traders, le trafic entre réseaux virtuels spoke est pris en charge par : [[spoke]]
  slots:
    - id: nw
      options:
        - { id: vwan, text: "Azure Virtual WAN" }
        - { id: hub, text: { en: "Traditional hub-and-spoke with a customer-managed hub virtual network", fr: "Hub-and-spoke traditionnel avec un réseau virtuel hub géré par le client" } }
        - { id: mesh, text: { en: "Full mesh of virtual network peerings without a hub", fr: "Maillage complet de peerings de réseaux virtuels sans hub" } }
    - id: ts
      options:
        - { id: vwan, text: "Azure Virtual WAN" }
        - { id: hub, text: { en: "Traditional hub-and-spoke with a customer-managed hub virtual network", fr: "Hub-and-spoke traditionnel avec un réseau virtuel hub géré par le client" } }
        - { id: mesh, text: { en: "Full mesh of virtual network peerings without a hub", fr: "Maillage complet de peerings de réseaux virtuels sans hub" } }
    - id: spoke
      options:
        - { id: hubrt, text: { en: "The virtual hub routing, without user-defined routes or NVAs", fr: "Le routage du hub virtuel, sans itinéraire défini par l'utilisateur ni NVA" } }
        - { id: udr, text: { en: "User-defined routes in each spoke that point to an NVA", fr: "Des itinéraires définis par l'utilisateur dans chaque spoke qui pointent vers une NVA" } }
        - { id: gwt, text: { en: "Gateway transit enabled on every spoke peering", fr: "Le transit par passerelle activé sur chaque peering de spoke" } }
answer:
  values: { nw: vwan, ts: hub, spoke: hubrt }
explanation:
  correct:
    en: Virtual WAN fits new, large or global networks that need global transit across regions and on-premises locations and SD-WAN integration. A traditional hub-and-spoke fits deployments in a few regions with few branches (fewer than 30 IPsec tunnels) and a need for full manual control. In Virtual WAN, the virtual hub manages spoke-to-spoke connectivity, so no UDRs or NVAs are needed.
    fr: Virtual WAN convient aux réseaux nouveaux, étendus ou mondiaux qui ont besoin d'un transit mondial entre régions et sites locaux et d'une intégration SD-WAN. Un hub-and-spoke traditionnel convient aux déploiements dans peu de régions, avec peu d'agences (moins de 30 tunnels IPsec) et un besoin de contrôle manuel total. Dans Virtual WAN, le hub virtuel gère la connectivité entre spokes, sans itinéraire défini par l'utilisateur ni NVA.
  options:
    mesh:
      en: Peering is not transitive; a full mesh without a hub provides no shared on-premises path and does not scale.
      fr: Le peering n'est pas transitif ; un maillage complet sans hub n'offre pas de chemin local partagé et ne passe pas à l'échelle.
    udr:
      en: UDRs and NVAs are what Virtual WAN avoids; they belong to a manually configured hub-and-spoke.
      fr: Les itinéraires définis par l'utilisateur et les NVA sont justement ce que Virtual WAN évite ; ils relèvent d'un hub-and-spoke configuré manuellement.
    gwt:
      en: Gateway transit gives spokes access to a gateway in a peered hub VNet; it does not route traffic between spokes.
      fr: Le transit par passerelle donne aux spokes l'accès à la passerelle d'un réseau virtuel hub relié par peering ; il ne route pas le trafic entre spokes.
references:
  - title: Network topology and connectivity for an SAP migration - Cloud Adoption Framework
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/sap/eslz-network-topology-and-connectivity
