id: az120-1a-req-eseries-log
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware runs a production SAP HANA database on a HANA-certified Standard_E64ds_v5 virtual machine. The VM belongs to an availability set together with the second node of the HANA System Replication pair. /hana/data uses Premium SSD managed disks.

    You need to recommend storage for /hana/log that meets the SAP HANA storage latency KPIs. The VM must stay in the availability set.

    What should you recommend?
  fr: |
    Litware exécute une base de données SAP HANA de production sur une machine virtuelle Standard_E64ds_v5 certifiée HANA. La machine virtuelle fait partie d'un groupe à haute disponibilité avec le second nœud de la paire HANA System Replication. /hana/data utilise des disques managés SSD Premium.

    Vous devez recommander un stockage pour /hana/log qui respecte les KPI de latence de stockage de SAP HANA. La machine virtuelle doit rester dans le groupe à haute disponibilité.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Premium SSD managed disks with Write Accelerator", fr: "Des disques managés SSD Premium avec Write Accelerator" } }
    - { id: b, text: { en: "Premium SSD v2 managed disks", fr: "Des disques managés SSD Premium v2" } }
    - { id: c, text: { en: "An NFS v4.1 volume in Azure NetApp Files", fr: "Un volume NFS v4.1 dans Azure NetApp Files" } }
    - { id: d, text: { en: "Ultra Disk managed disks", fr: "Des disques managés Ultra Disk" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure NetApp Files is certified for /hana/log, typically delivers latency under 1 ms and is reached over the network, so it doesn't depend on the VM's placement in an availability set. HANA System Replication requires the same storage type for /hana/log on both replicas, so plan the same choice for the second node.
    fr: |
      Azure NetApp Files est certifié pour /hana/log, offre généralement une latence inférieure à 1 ms et est accessible par le réseau : il ne dépend pas du placement de la machine virtuelle dans un groupe à haute disponibilité. HANA System Replication exige le même type de stockage pour /hana/log sur les deux réplicas : prévoyez donc le même choix pour le second nœud.
  options:
    a:
      en: |
        Write Accelerator is available only on M-series VMs; on E-series VMs, Premium SSD can't reach sub-millisecond log latency.
      fr: |
        Write Accelerator n'est disponible que sur les machines virtuelles de série M ; sur la série E, le SSD Premium ne peut pas atteindre une latence de journal inférieure à la milliseconde.
    b:
      en: |
        Premium SSD v2 meets the HANA KPIs, but it isn't supported with availability sets.
      fr: |
        Le SSD Premium v2 respecte les KPI de HANA, mais il n'est pas pris en charge avec les groupes à haute disponibilité.
    d:
      en: |
        Ultra Disk meets the HANA KPIs, but it works only with zonal deployments, not with availability sets.
      fr: |
        Ultra Disk respecte les KPI de HANA, mais il ne fonctionne qu'avec des déploiements zonaux, pas avec des groupes à haute disponibilité.
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
  - title: SAP HANA Azure virtual machine storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-storage
