id: az120-1b-pol-allowed-skus
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a subscription named **Sub-SAP-Prod** for its production SAP systems. The SAP architects maintain a list of SAP-certified virtual machine sizes that are approved for production.

    You need to ensure that nobody can create a virtual machine in Sub-SAP-Prod with a size that is not on the list. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Contoso, Ltd. dispose d'un abonnement nommé **Sub-SAP-Prod** pour ses systèmes SAP de production. Les architectes SAP tiennent à jour une liste de tailles de machines virtuelles certifiées SAP approuvées pour la production.

    Vous devez vous assurer que personne ne peut créer dans Sub-SAP-Prod une machine virtuelle d'une taille absente de la liste. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the built-in Allowed virtual machine size SKUs policy to Sub-SAP-Prod.", fr: "Attribuer la stratégie intégrée Allowed virtual machine size SKUs à Sub-SAP-Prod." } }
    - { id: b, text: { en: "Apply a CanNotDelete resource lock to Sub-SAP-Prod.", fr: "Appliquer un verrou de ressource CanNotDelete à Sub-SAP-Prod." } }
    - { id: c, text: { en: "Create a custom role without Microsoft.Compute/virtualMachines/write.", fr: "Créer un rôle personnalisé sans Microsoft.Compute/virtualMachines/write." } }
    - { id: d, text: { en: "Enable the right-size recommendations of Azure Advisor for Sub-SAP-Prod.", fr: "Activer les recommandations de redimensionnement d'Azure Advisor pour Sub-SAP-Prod." } }
answer: { optionId: a }
explanation:
  correct:
    en: The built-in Allowed virtual machine size SKUs policy has a deny effect, so Azure Policy rejects any create or update request for a VM size that isn't in the allowed list, whoever sends it. You only maintain the list in the assignment parameter.
    fr: La stratégie intégrée Allowed virtual machine size SKUs a un effet deny ; Azure Policy rejette donc toute demande de création ou de mise à jour d'une machine virtuelle dont la taille ne figure pas dans la liste autorisée, quel que soit son émetteur. Vous ne tenez à jour que la liste dans le paramètre de l'attribution.
  options:
    b:
      en: A CanNotDelete lock prevents deletion; it doesn't restrict which VM sizes can be created.
      fr: Un verrou CanNotDelete empêche la suppression ; il ne restreint pas les tailles de machines virtuelles pouvant être créées.
    c:
      en: Removing the write action would prevent creating any VM at all; RBAC cannot filter on property values such as the VM size.
      fr: Retirer l'action write empêcherait de créer toute machine virtuelle ; Azure RBAC ne peut pas filtrer sur des valeurs de propriétés comme la taille.
    d:
      en: Advisor makes recommendations after deployment; it doesn't block noncompliant deployments.
      fr: Advisor émet des recommandations après le déploiement ; il ne bloque pas les déploiements non conformes.
references:
  - title: Azure Policy definitions effect basics
    url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/effect-basics
