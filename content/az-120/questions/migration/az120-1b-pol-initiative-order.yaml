id: az120-1b-pol-initiative-order
objective: "1.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has defined a set of SAP guardrails as custom policy definitions, some of which use the modify and deployIfNotExists effects. The guardrails must apply to all the SAP subscriptions under a management group named **MG-SAP**, including subscriptions created later, and existing noncompliant resources must be fixed.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys a défini un ensemble de garde-fous SAP sous forme de définitions de stratégie personnalisées, dont certaines utilisent les effets modify et deployIfNotExists. Les garde-fous doivent s'appliquer à tous les abonnements SAP situés sous un groupe d'administration nommé **MG-SAP**, y compris les abonnements créés ultérieurement, et les ressources non conformes existantes doivent être corrigées.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: define, text: { en: "Create an initiative definition that groups the guardrails, with MG-SAP as its definition location.", fr: "Créer une définition d'initiative regroupant les garde-fous, avec MG-SAP comme emplacement de la définition." } }
    - { id: assign, text: { en: "Assign the initiative to MG-SAP with a managed identity.", fr: "Attribuer l'initiative à MG-SAP avec une identité managée." } }
    - { id: review, text: { en: "Wait for the compliance evaluation and review the noncompliant resources.", fr: "Attendre l'évaluation de conformité et examiner les ressources non conformes." } }
    - { id: remed, text: { en: "Create remediation tasks for the modify and deployIfNotExists policies.", fr: "Créer des tâches de correction pour les stratégies modify et deployIfNotExists." } }
    - { id: root, text: { en: "Assign the initiative to the tenant root group.", fr: "Attribuer l'initiative au Groupe racine du locataire." } }
    - { id: early, text: { en: "Create the remediation tasks while you create the assignment.", fr: "Créer les tâches de correction pendant la création de l'attribution." } }
    - { id: lock, text: { en: "Apply a ReadOnly lock to each SAP subscription.", fr: "Appliquer un verrou ReadOnly à chaque abonnement SAP." } }
answer:
  sequence: [ define, assign, review, remed ]
explanation:
  correct:
    en: The initiative must be defined at or above the scope where it is assigned. An assignment on MG-SAP applies to every current and future subscription below it, and modify and deployIfNotExists need the assignment's managed identity. For a management group assignment, remediation tasks are created after the evaluation has determined compliance.
    fr: L'initiative doit être définie à l'étendue de l'attribution ou au-dessus. Une attribution sur MG-SAP s'applique à tous les abonnements actuels et futurs situés en dessous, et modify et deployIfNotExists ont besoin de l'identité managée de l'attribution. Pour une attribution sur un groupe d'administration, les tâches de correction sont créées après que l'évaluation a déterminé la conformité.
  options:
    root: { en: "The root scope would apply the guardrails to every subscription of the tenant, not only SAP.", fr: "L'étendue racine appliquerait les garde-fous à tous les abonnements du locataire, pas seulement à SAP." }
    early: { en: "Remediation during assignment is possible only for subscription-scoped assignments.", fr: "La correction pendant l'attribution n'est possible que pour les attributions à l'étendue d'un abonnement." }
    lock: { en: "A ReadOnly lock would block the remediation itself and every change to the SAP resources.", fr: "Un verrou ReadOnly bloquerait la correction elle-même et toute modification des ressources SAP." }
references:
  - title: Remediate non-compliant resources with Azure Policy
    url: https://learn.microsoft.com/en-us/azure/governance/policy/how-to/remediate-resources
  - title: Management groups
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/landing-zone/design-area/resource-org-management-groups
