id: az120-1b-saas-provisioning-match
objective: "1.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation uses SAP SuccessFactors Employee Central as its HR system, Microsoft Entra ID for identities, and SAP Cloud Identity Services and SAP BTP for its SAP cloud applications. Employees don't need on-premises Active Directory accounts.

    Which component should you use for each requirement? To answer, drag the appropriate components to the correct requirements. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation utilise SAP SuccessFactors Employee Central comme système RH, Microsoft Entra ID pour les identités, ainsi que SAP Cloud Identity Services et SAP BTP pour ses applications cloud SAP. Les employés n'ont pas besoin de comptes Active Directory locaux.

    Quel composant devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les composants appropriés vers les exigences correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sf2entra, text: { en: "SuccessFactors to Microsoft Entra user provisioning app", fr: "Application SuccessFactors to Microsoft Entra user provisioning" } }
    - { id: writeback, text: { en: "SuccessFactors Writeback app", fr: "Application SuccessFactors Writeback" } }
    - { id: scis, text: { en: "SAP Cloud Identity Services provisioning connector in Microsoft Entra ID", fr: "Connecteur d'approvisionnement SAP Cloud Identity Services dans Microsoft Entra ID" } }
    - { id: ips, text: SAP Identity Provisioning Service }
    - { id: connect, text: Microsoft Entra Connect Sync }
  targets:
    - id: t1
      text: { en: "Create Microsoft Entra accounts automatically for new hires entered in Employee Central", fr: "Créer automatiquement des comptes Microsoft Entra pour les nouveaux employés saisis dans Employee Central" }
    - id: t2
      text: { en: "Write the email address generated in Microsoft Entra ID back to SuccessFactors", fr: "Réécrire dans SuccessFactors l'adresse e-mail générée dans Microsoft Entra ID" }
    - id: t3
      text: { en: "Push users and groups from Microsoft Entra ID to SAP Cloud Identity Services", fr: "Envoyer des utilisateurs et des groupes de Microsoft Entra ID vers SAP Cloud Identity Services" }
    - id: t4
      text: { en: "Provision users into the SAP BTP subaccounts", fr: "Approvisionner des utilisateurs dans les sous-comptes SAP BTP" }
answer:
  mapping: { t1: sf2entra, t2: writeback, t3: scis, t4: ips }
explanation:
  correct:
    en: For cloud-only users, the SuccessFactors to Microsoft Entra user provisioning app makes Employee Central the authoritative source for Entra accounts, and the separate SuccessFactors Writeback app writes the email back. Microsoft Entra ID provisions users and groups natively to SAP Cloud Identity Services, but there is no native Entra provisioning to BTP, where SAP Identity Provisioning Service is the integrated option. Microsoft Entra Connect Sync synchronizes on-premises Active Directory, which Adatum doesn't need.
    fr: Pour des utilisateurs uniquement cloud, l'application SuccessFactors to Microsoft Entra user provisioning fait d'Employee Central la source faisant autorité pour les comptes Entra, et l'application distincte SuccessFactors Writeback réécrit l'adresse e-mail. Microsoft Entra ID approvisionne nativement les utilisateurs et les groupes dans SAP Cloud Identity Services, mais il n'existe pas d'approvisionnement Entra natif vers BTP, où SAP Identity Provisioning Service est l'option intégrée. Microsoft Entra Connect Sync synchronise un Active Directory local, dont Adatum n'a pas besoin.
references:
  - title: Configure SAP SuccessFactors to Microsoft Entra user provisioning
    url: https://learn.microsoft.com/en-us/entra/identity/saas-apps/sap-successfactors-inbound-provisioning-cloud-only-tutorial
  - title: Scenario - Using Microsoft Entra ID to secure access to SAP platforms and applications
    url: https://learn.microsoft.com/en-us/entra/fundamentals/scenario-azure-first-sap-identity-integration
