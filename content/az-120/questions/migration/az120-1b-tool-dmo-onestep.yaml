id: az120-1b-tool-dmo-onestep
objective: "1.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys runs SAP ERP on an Oracle database. As part of its migration project, Tailspin must upgrade the SAP release and migrate the database to SAP HANA in a single procedure, with automated data consistency checks.

    Which tool should you use?
  fr: |
    Tailspin Toys exécute SAP ERP sur une base de données Oracle. Dans le cadre de son projet de migration, Tailspin doit mettre à niveau la version SAP et migrer la base de données vers SAP HANA en une seule procédure, avec des contrôles automatisés de cohérence des données.

    Quel outil devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Software Provisioning Manager (SWPM)", fr: "Software Provisioning Manager (SWPM)" } }
    - { id: b, text: { en: "Software Update Manager (SUM) with the Database Migration Option (DMO)", fr: "Software Update Manager (SUM) avec l'option de migration de base de données (DMO)" } }
    - { id: c, text: { en: "Azure Migrate", fr: "Azure Migrate" } }
    - { id: d, text: { en: "Azure Database Migration Service", fr: "Azure Database Migration Service" } }
answer: { optionId: b }
explanation:
  correct:
    en: DMO of SUM combines the SAP upgrade and the database migration to SAP HANA in one tool, which is why it is called a one-step migration. It builds a shadow repository, automates the process and includes the consistency checks and monitoring.
    fr: DMO de SUM combine la mise à niveau SAP et la migration de la base de données vers SAP HANA dans un seul outil, d'où le nom de migration en une étape. Il construit un référentiel fantôme (shadow repository), automatise le processus et inclut les contrôles de cohérence et la supervision.
  options:
    a:
      en: SWPM performs the classical system copy (database migration only); an upgrade would be a separate step, and checks are manual.
      fr: SWPM effectue la copie système classique (migration de base de données uniquement) ; une mise à niveau serait une étape distincte, et les contrôles sont manuels.
    c:
      en: Azure Migrate moves servers; it neither upgrades SAP nor converts a database to SAP HANA.
      fr: Azure Migrate déplace des serveurs ; il ne met pas SAP à niveau et ne convertit pas une base de données vers SAP HANA.
    d:
      en: Azure Database Migration Service targets Azure database services, not an SAP upgrade with a migration to SAP HANA.
      fr: Azure Database Migration Service cible les services de base de données Azure, pas une mise à niveau SAP avec migration vers SAP HANA.
references:
  - title: Compare classical migration with the SAP database migration option (DMO)
    url: https://learn.microsoft.com/en-us/training/modules/explore-migration-options/4-compare-classic-vs-sap-database-move-only
