id: az120-sr1-rise-network-3
objective: "1.3.1"
type: series_yesno
series: az120-sr1-rise-network
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |-
    You peer Hub1 with the RISE virtual network and replicate the zone to an Azure private DNS zone.
  fr: |-
    Vous créez un peering entre Hub1 et le réseau virtuel RISE et répliquez la zone vers une zone DNS privée Azure.
body:
  solution:
    en: |-
      You create a **virtual network peering** between Hub1 and the RISE virtual network by using the Azure resource ID that SAP provides, SAP approves the peering, and the peering uses **gateway transit** through the ExpressRoute gateway of Hub1. You create an **Azure private DNS zone** named ecs.contoso.com, link it to Hub1, and configure it to receive **zone transfers** from the SAP DNS servers.
    fr: |-
      Vous créez un **peering de réseaux virtuels** entre Hub1 et le réseau virtuel RISE à l'aide de l'ID de ressource Azure fourni par SAP, SAP approuve le peering, et le peering utilise le **transit par passerelle** via la passerelle ExpressRoute de Hub1. Vous créez une **zone DNS privée Azure** nommée ecs.contoso.com, vous la liez à Hub1 et vous la configurez pour recevoir des **transferts de zone** depuis les serveurs DNS de SAP.
answer: { value: false }
explanation:
  correct:
    en: |-
      The peering part is correct, but neither Azure-provided DNS nor Azure private DNS zones support DNS zone transfers, so the private zone can't receive the records replicated from the SAP DNS servers. Zone transfer requires customer-run DNS servers, such as the AD DS DNS servers already in Hub1.
    fr: |-
      La partie peering est correcte, mais ni le DNS fourni par Azure ni les zones DNS privées Azure ne prennent en charge les transferts de zone DNS : la zone privée ne peut pas recevoir les enregistrements répliqués depuis les serveurs DNS de SAP. Le transfert de zone exige des serveurs DNS gérés par le client, comme les serveurs DNS AD DS déjà présents dans Hub1.
references:
  - title: Connectivity with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
