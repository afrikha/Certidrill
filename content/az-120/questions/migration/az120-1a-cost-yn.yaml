id: az120-1a-cost-yn
objective: "1.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs SAP HANA on SUSE Linux Enterprise Server for SAP Applications pay-as-you-go VMs. Adatum has an Enterprise Agreement and has bought both reserved VM instances and a compute savings plan with shared scope.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute SAP HANA sur des machines virtuelles SUSE Linux Enterprise Server for SAP Applications en paiement à l'utilisation. Adatum dispose d'un Contrat Entreprise et a acheté à la fois des instances de machine virtuelle réservées et un plan d'économies pour le calcul avec une étendue partagée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The reserved VM instances also discount the SUSE software charges of the VMs.
        fr: |
          Les instances de machine virtuelle réservées réduisent aussi les frais du logiciel SUSE des machines virtuelles.
    - id: s2
      text:
        en: |
          When a VM matches both a reservation and the savings plan, the reservation discount is applied first.
        fr: |
          Lorsqu'une machine virtuelle correspond à la fois à une réservation et au plan d'économies, la remise de la réservation est appliquée en premier.
    - id: s3
      text:
        en: |
          Adatum can cancel the savings plan for a prorated refund if the SAP landscape shrinks.
        fr: |
          Adatum peut annuler le plan d'économies contre un remboursement au prorata si le paysage SAP diminue.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Reserved VM instances cover only the compute part of VM usage; software such as SUSE is billed separately, and only a dedicated SUSE software plan reservation discounts it. Azure applies reservation benefits before the savings plan, because reservations are more restrictive and usually give greater discounts. Savings plan purchases can't be canceled or refunded.
    fr: |
      Les instances de machine virtuelle réservées ne couvrent que la partie calcul de l'utilisation des machines virtuelles ; les logiciels comme SUSE sont facturés à part, et seule une réservation de plan logiciel SUSE les réduit. Azure applique les avantages des réservations avant le plan d'économies, car les réservations sont plus restrictives et offrent généralement des remises plus importantes. Les achats de plans d'économies ne peuvent être ni annulés ni remboursés.
references:
  - title: How a savings plan discount is applied
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/discount-application
  - title: What are Azure Reservations?
    url: https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/save-compute-costs-reservations
