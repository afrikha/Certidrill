id: az120-1b-rbac-sdaf-identity
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders plans to deploy the control plane of SAP Deployment Automation Framework. The deployments will create the SAP infrastructure in a subscription named **Sub-SAP-NP** and must be able to create role assignments for the resources that they deploy.

    You need to choose the deployment identity. The solution must minimize credential management.

    What should you use?
  fr: |
    Northwind Traders prévoit de déployer le plan de contrôle de SAP Deployment Automation Framework. Les déploiements créeront l'infrastructure SAP dans un abonnement nommé **Sub-SAP-NP** et doivent pouvoir créer des attributions de rôle pour les ressources qu'ils déploient.

    Vous devez choisir l'identité de déploiement. La solution doit réduire au minimum la gestion des informations d'identification.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A managed identity with Contributor on Sub-SAP-NP", fr: "Une identité managée avec Contributor sur Sub-SAP-NP" } }
    - { id: b, text: { en: "A service principal with Contributor and User Access Administrator on Sub-SAP-NP", fr: "Un principal de service avec Contributor et User Access Administrator sur Sub-SAP-NP" } }
    - { id: c, text: { en: "A managed identity with Contributor and User Access Administrator on Sub-SAP-NP", fr: "Une identité managée avec Contributor et User Access Administrator sur Sub-SAP-NP" } }
    - { id: d, text: { en: "A service principal with Owner on the tenant root group", fr: "Un principal de service avec Owner sur le Groupe racine du locataire" } }
answer: { optionId: c }
explanation:
  correct:
    en: SAP Deployment Automation Framework can deploy with a managed identity, which Microsoft recommends, or a service principal. The identity needs Contributor on the subscription, and User Access Administrator (optional in the framework) when deployments must create role assignments. A managed identity has no secret to rotate.
    fr: SAP Deployment Automation Framework peut déployer avec une identité managée, ce que Microsoft recommande, ou avec un principal de service. L'identité a besoin de Contributor sur l'abonnement, et de User Access Administrator (facultatif dans le framework) lorsque les déploiements doivent créer des attributions de rôle. Une identité managée n'a pas de clé secrète à renouveler.
  options:
    b:
      en: The roles are right, but a service principal has a password to store and rotate, which doesn't minimize credential management.
      fr: Les rôles sont corrects, mais un principal de service a un mot de passe à stocker et à renouveler, ce qui ne réduit pas la gestion des informations d'identification.
    a:
      en: Contributor cannot create role assignments, so deployments that assign roles would fail.
      fr: Contributor ne peut pas créer d'attributions de rôle ; les déploiements qui attribuent des rôles échoueraient.
    d:
      en: Owner at the tenant root group grants access to every subscription in the directory, far beyond Sub-SAP-NP, and still needs a secret.
      fr: Owner sur le Groupe racine du locataire donne accès à tous les abonnements de l'annuaire, bien au-delà de Sub-SAP-NP, et exige toujours une clé secrète.
references:
  - title: Deploy the control plane
    url: https://learn.microsoft.com/en-us/azure/sap/automation/deploy-control-plane
