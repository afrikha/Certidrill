id: az120-1c-rise-id-soar
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation runs SAP S/4HANA Cloud, private edition in RISE with SAP on Azure. Adatum ingests the SAP security audit log in Microsoft Sentinel by using the Microsoft Sentinel solution for SAP applications.

    When a detection indicates that an SAP user account is compromised, the user account must be blocked in the SAP system itself. A security analyst must be able to approve the action from Microsoft Teams. The solution must minimize development effort.

    What should you use?
  fr: |
    Adatum Corporation exécute SAP S/4HANA Cloud, private edition dans RISE with SAP sur Azure. Adatum ingère le journal d'audit de sécurité SAP dans Microsoft Sentinel en utilisant la solution Microsoft Sentinel pour les applications SAP.

    Lorsqu'une détection indique qu'un compte d'utilisateur SAP est compromis, le compte doit être bloqué dans le système SAP lui-même. Un analyste de sécurité doit pouvoir approuver l'action depuis Microsoft Teams. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "A Microsoft Entra ID Protection user risk policy that requires a secure password change", fr: "Une stratégie de risque utilisateur Microsoft Entra ID Protection qui exige une modification sécurisée du mot de passe" }
    - id: b
      text: { en: "A prebuilt Microsoft Sentinel playbook of the SAP solution that blocks the SAP user", fr: "Un playbook Microsoft Sentinel prédéfini de la solution SAP qui bloque l'utilisateur SAP" }
    - id: c
      text: { en: "An Azure Monitor alert rule whose action group runs a runbook on the RISE application servers", fr: "Une règle d'alerte Azure Monitor dont le groupe d'actions exécute un runbook sur les serveurs d'application RISE" }
    - id: d
      text: { en: "A Microsoft Defender for Cloud workflow automation that targets the RISE virtual machines", fr: "Une automatisation de workflow Microsoft Defender for Cloud qui cible les machines virtuelles RISE" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Microsoft Sentinel solution for SAP includes prebuilt SOAR playbooks. A common first scenario blocks an SAP user, with an option to act from Microsoft Teams, and the response can target SAP ERP, SAP BTP or Microsoft Entra ID.
    fr: |
      La solution Microsoft Sentinel pour SAP comprend des playbooks SOAR prédéfinis. Un premier scénario courant bloque un utilisateur SAP, avec une option d'action depuis Microsoft Teams, et la réponse peut cibler SAP ERP, SAP BTP ou Microsoft Entra ID.
  options:
    a:
      en: |
        A user risk policy acts on the Microsoft Entra sign-in; it does not block the user account in the SAP system and offers no Teams approval.
      fr: |
        Une stratégie de risque utilisateur agit sur la connexion Microsoft Entra ; elle ne bloque pas le compte dans le système SAP et n'offre pas d'approbation dans Teams.
    c:
      en: |
        Customers have no access to the Azure resources of RISE, so they cannot run runbooks on the RISE servers.
      fr: |
        Les clients n'ont pas accès aux ressources Azure de RISE : ils ne peuvent pas exécuter de runbooks sur les serveurs RISE.
    d:
      en: |
        The RISE VMs are in SAP's subscription and tenant; Defender for Cloud in the customer tenant cannot target them.
      fr: |
        Les machines virtuelles RISE se trouvent dans l'abonnement et le locataire de SAP ; Defender for Cloud dans le locataire du client ne peut pas les cibler.
references:
  - title: Identity and security in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-security
