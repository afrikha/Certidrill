id: az120-1c-rise-svc-protocols
objective: "1.3.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys runs SAP S/4HANA in RISE with SAP on Azure. The RISE virtual network is peered with the Tailspin hub, and SAP has opened the required ports. Tailspin plans three integrations from its own virtual networks, all over private IP addresses.

    Which protocol should each integration use? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys exécute SAP S/4HANA dans RISE with SAP sur Azure. Le réseau virtuel RISE est relié par peering au hub de Tailspin, et SAP a ouvert les ports requis. Tailspin prévoit trois intégrations depuis ses propres réseaux virtuels, toutes par adresses IP privées.

    Quel protocole chaque intégration doit-elle utiliser ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A middleware VM exchanges IDocs and calls BAPIs: [[idoc]]

      A web application consumes OData services: [[odata]]

      An analytics tool reads the SAP HANA database directly, as agreed with SAP: [[hana]]
    fr: |
      Une machine virtuelle de middleware échange des IDoc et appelle des BAPI : [[idoc]]

      Une application web consomme des services OData : [[odata]]

      Un outil d'analytique lit directement la base de données SAP HANA, comme convenu avec SAP : [[hana]]
  slots:
    - id: idoc
      options:
        - { id: rfc, text: "RFC" }
        - { id: https, text: "HTTPS" }
        - { id: jdbc, text: "JDBC/ODBC" }
        - { id: nfs, text: "NFS" }
    - id: odata
      options:
        - { id: rfc, text: "RFC" }
        - { id: https, text: "HTTPS" }
        - { id: jdbc, text: "JDBC/ODBC" }
        - { id: nfs, text: "NFS" }
    - id: hana
      options:
        - { id: rfc, text: "RFC" }
        - { id: https, text: "HTTPS" }
        - { id: jdbc, text: "JDBC/ODBC" }
        - { id: nfs, text: "NFS" }
answer:
  values: { idoc: rfc, odata: https, hana: jdbc }
explanation:
  correct:
    en: |
      Through the private network, RISE systems are reached with RFC for BAPI and IDoc, HTTPS for OData and REST/SOAP, and JDBC/ODBC for direct SAP HANA database connections. Direct database access must be agreed with SAP.
    fr: |
      Par le réseau privé, les systèmes RISE sont joints en RFC pour les BAPI et IDoc, en HTTPS pour OData et REST/SOAP, et en JDBC/ODBC pour les connexions directes à la base de données SAP HANA. L'accès direct à la base de données doit être convenu avec SAP.
  options:
    nfs:
      en: |
        NFS is a file-sharing protocol; it is not one of the SAP integration interfaces that RISE exposes.
      fr: |
        NFS est un protocole de partage de fichiers ; ce n'est pas l'une des interfaces d'intégration SAP exposées par RISE.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
