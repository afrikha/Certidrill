id: az120-1c-rise-net-peering-preferred
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. has an Azure hub-and-spoke network in West Europe. The hub virtual network contains an ExpressRoute gateway that connects to the on-premises datacenter. Several integration applications run in the spoke virtual networks.

    Litware signs a RISE with SAP contract. SAP will run S/4HANA Cloud, private edition for Litware in West Europe, in an SAP-managed subscription.

    You need to recommend how to connect the RISE environment to the Litware Azure environment. The solution must minimize latency and maximize throughput between the RISE systems and the integration applications, and it must reuse the existing on-premises network path.

    What should you recommend?
  fr: |
    Litware, Inc. dispose d'un réseau Azure hub-and-spoke dans la région West Europe. Le réseau virtuel hub contient une passerelle ExpressRoute connectée au centre de données local. Plusieurs applications d'intégration s'exécutent dans les réseaux virtuels spoke.

    Litware signe un contrat RISE with SAP. SAP exécutera S/4HANA Cloud, private edition pour Litware dans la région West Europe, dans un abonnement géré par SAP.

    Vous devez recommander comment connecter l'environnement RISE à l'environnement Azure de Litware. La solution doit réduire au minimum la latence et maximiser le débit entre les systèmes RISE et les applications d'intégration, et elle doit réutiliser le chemin réseau local existant.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A VNet-to-VNet VPN connection between a gateway in the RISE VNet and the hub gateway", fr: "Une connexion VPN de réseau virtuel à réseau virtuel entre une passerelle du réseau virtuel RISE et la passerelle du hub" }
    - id: b
      text: { en: "Private endpoints in the hub virtual network for each RISE application server", fr: "Des points de terminaison privés dans le réseau virtuel hub pour chaque serveur d'application RISE" }
    - id: c
      text: { en: "Cross-tenant virtual network peering between the RISE virtual network and the hub", fr: "Un peering de réseaux virtuels entre locataires entre le réseau virtuel RISE et le hub" }
    - id: d
      text: { en: "A dedicated ExpressRoute connection that SAP provisions directly for the RISE environment", fr: "Une connexion ExpressRoute dédiée que SAP provisionne directement pour l'environnement RISE" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Virtual network peering is the preferred and most performant way to connect RISE to the customer's Azure environment: traffic stays in a private address space with minimal latency and maximum throughput. Because RISE runs in SAP's tenant, the peering is set up across tenants, and the RISE VNet becomes a spoke of the existing hub, reusing its ExpressRoute path.
    fr: |
      Le peering de réseaux virtuels est la méthode privilégiée et la plus performante pour connecter RISE à l'environnement Azure du client : le trafic reste dans un espace d'adressage privé, avec une latence minimale et un débit maximal. Comme RISE s'exécute dans le locataire de SAP, le peering est configuré entre locataires, et le réseau virtuel RISE devient un spoke du hub existant, qui réutilise son chemin ExpressRoute.
  options:
    a:
      en: |
        A VNet-to-VNet VPN is a supported alternative, but its throughput is limited by the gateway SKUs, so it does not maximize throughput.
      fr: |
        Une connexion VPN de réseau virtuel à réseau virtuel est une alternative prise en charge, mais son débit est limité par les références SKU des passerelles : elle ne maximise pas le débit.
    b:
      en: |
        SAP generally does not offer private connectivity to RISE workloads through private endpoints.
      fr: |
        SAP ne propose généralement pas de connectivité privée vers les charges de travail RISE par des points de terminaison privés.
    d:
      en: |
        A connection that SAP sets up directly within RISE reaches only the SAP-managed VNet and does not reuse the existing hub path.
      fr: |
        Une connexion que SAP établit directement dans RISE ne permet d'atteindre que le réseau virtuel géré par SAP et ne réutilise pas le chemin existant du hub.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
