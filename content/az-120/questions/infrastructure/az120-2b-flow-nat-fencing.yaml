id: az120-2b-flow-nat-fencing
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind deploys an SAP HANA Pacemaker cluster on SUSE Linux Enterprise Server in a virtual network created in May 2026. The two cluster VMs have no public IP addresses and are in the backend pool of an internal Standard Load Balancer. The cluster uses the Azure fence agent, which must reach `management.azure.com` and `login.microsoftonline.com`.

    The solution must meet the following requirements:

    - No inbound connections from the internet to the VMs.
    - No new subnet and no routing changes.
    - Minimize administrative effort.

    What should you do?
  fr: |
    Northwind déploie un cluster Pacemaker SAP HANA sur SUSE Linux Enterprise Server dans un réseau virtuel créé en mai 2026. Les deux machines virtuelles du cluster n'ont pas d'adresse IP publique et font partie du pool principal d'un équilibreur de charge interne Standard. Le cluster utilise l'agent d'isolation Azure, qui doit joindre `management.azure.com` et `login.microsoftonline.com`.

    La solution doit répondre aux exigences suivantes :

    - Aucune connexion entrante depuis Internet vers les machines virtuelles.
    - Aucun nouveau sous-réseau et aucune modification du routage.
    - Réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Associate an Azure NAT gateway with the subnet of the cluster VMs.", fr: "Associer une passerelle NAT Azure au sous-réseau des machines virtuelles du cluster." }
    - id: b
      text: { en: "Assign a Standard public IP address to the network interface of each cluster VM.", fr: "Attribuer une adresse IP publique Standard à l'interface réseau de chaque machine virtuelle du cluster." }
    - id: c
      text: { en: "Deploy Azure Firewall and add a route for 0.0.0.0/0 to the subnet of the cluster VMs.", fr: "Déployer le Pare-feu Azure et ajouter un itinéraire 0.0.0.0/0 au sous-réseau des machines virtuelles du cluster." }
    - id: d
      text: { en: "Enable floating IP and HA ports on the rule of the internal load balancer.", fr: "Activer l'adresse IP flottante et les ports HA sur la règle de l'équilibreur de charge interne." }
answer: { optionId: a }
explanation:
  correct:
    en: "In virtual networks created after March 31, 2026, subnets are private by default, and VMs behind an internal Standard Load Balancer have no outbound internet access. A NAT gateway associated with the subnet gives all its VMs outbound-only connectivity, with no per-VM configuration, no extra subnet and no routing change; NSGs can restrict the reachable endpoints."
    fr: "Dans les réseaux virtuels créés après le 31 mars 2026, les sous-réseaux sont privés par défaut, et les machines virtuelles placées derrière un équilibreur de charge interne Standard n'ont pas d'accès sortant à Internet. Une passerelle NAT associée au sous-réseau donne à toutes ses machines virtuelles une connectivité uniquement sortante, sans configuration par machine virtuelle, sans sous-réseau supplémentaire ni modification du routage ; des NSG peuvent restreindre les points de terminaison joignables."
  options:
    b:
      en: "Instance-level public IPs expose SAP VMs to inbound connections, which SAP deployments rarely accept and the requirements forbid."
      fr: "Des adresses IP publiques au niveau de l'instance exposent les machines virtuelles SAP aux connexions entrantes, ce que les déploiements SAP acceptent rarement et que les exigences interdisent."
    c:
      en: "Azure Firewall needs a dedicated AzureFirewallSubnet and a user-defined route, which the requirements exclude."
      fr: "Le Pare-feu Azure nécessite un sous-réseau AzureFirewallSubnet dédié et un itinéraire défini par l'utilisateur, ce que les exigences excluent."
    d:
      en: "Floating IP and HA ports are inbound load-balancing settings; they don't give outbound connectivity."
      fr: "L'adresse IP flottante et les ports HA sont des paramètres d'équilibrage entrant ; ils ne fournissent pas de connectivité sortante."
references:
  - title: Outbound connectivity for SAP VMs
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-standard-load-balancer-outbound-connections
