id: az120-2a-sdaf-sequence
objective: "2.1.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum starts from an empty Azure subscription and plans to deploy its first SAP S/4HANA development system with SAP Deployment Automation Framework. The SAP installation media is already available.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum part d'un abonnement Azure vide et prévoit de déployer son premier système de développement SAP S/4HANA avec SAP Deployment Automation Framework. Les médias d'installation SAP sont déjà disponibles.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: cp, text: { en: "Deploy the control plane by running deploy_controlplane.sh.", fr: "Déployer le plan de contrôle en exécutant deploy_controlplane.sh." } }
    - { id: wz, text: { en: "Deploy the workload zone by running install_workloadzone.sh.", fr: "Déployer la zone de charge de travail en exécutant install_workloadzone.sh." } }
    - { id: sys, text: { en: "Deploy the SAP system infrastructure by running installer.sh --type sap_system.", fr: "Déployer l'infrastructure du système SAP en exécutant installer.sh --type sap_system." } }
    - { id: ans, text: { en: "Run the Ansible playbooks to configure the OS and install SAP.", fr: "Exécuter les playbooks Ansible pour configurer le système d'exploitation et installer SAP." } }
    - { id: vis, text: { en: "Create a Virtual Instance for SAP solutions to deploy the VMs.", fr: "Créer une Virtual Instance for SAP solutions pour déployer les machines virtuelles." } }
    - { id: gen, text: { en: "Generalize the deployer VM and capture it as an image.", fr: "Généraliser la machine virtuelle de déploiement et la capturer comme image." } }
answer:
  sequence: [ cp, wz, sys, ans ]
explanation:
  correct:
    en: |
      The control plane comes first, because the other environments are deployed from it. A workload zone requires a deployed control plane, and an SAP system uses the services of its workload zone. The system deployment produces the SID_hosts.yaml and sap-parameters.yaml files that the Ansible playbooks then use to configure the VMs and install SAP.
    fr: |
      Le plan de contrôle vient en premier, car les autres environnements sont déployés à partir de lui. Une zone de charge de travail exige un plan de contrôle déployé, et un système SAP utilise les services de sa zone de charge de travail. Le déploiement du système produit les fichiers SID_hosts.yaml et sap-parameters.yaml, que les playbooks Ansible utilisent ensuite pour configurer les machines virtuelles et installer SAP.
  options:
    vis:
      en: |
        A Virtual Instance for SAP solutions belongs to Azure Center for SAP solutions; in the framework, the VMs are created by the Terraform system deployment.
      fr: |
        Une Virtual Instance for SAP solutions appartient au Centre Azure pour les solutions SAP ; dans le framework, les machines virtuelles sont créées par le déploiement Terraform du système.
    gen:
      en: |
        The deployer VM is a long-lived part of the control plane; it is not generalized.
      fr: |
        La machine virtuelle de déploiement est un élément durable du plan de contrôle ; elle n'est pas généralisée.
references:
  - title: Deploy SAP workload zones with the automation framework
    url: https://learn.microsoft.com/en-us/azure/sap/automation/deploy-workload-zone
  - title: SAP system deployment for SAP Deployment Automation Framework
    url: https://learn.microsoft.com/en-us/azure/sap/automation/deploy-system
