id: az120-2c-backup-ransomware
objective: "2.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum backs up its SAP HANA databases and SAP VMs to a Recovery Services vault named **rsv-sap**. After a ransomware incident at a partner company, Adatum adds these requirements:

    - Nobody, including subscription owners, can delete recovery points or shorten their retention before they expire.
    - Critical operations on the vault, such as disabling soft delete, must require an approval from the security team, which manages its own subscription.

    Which two features should you configure? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum sauvegarde ses bases de données SAP HANA et ses machines virtuelles SAP dans un coffre Recovery Services nommé **rsv-sap**. Après un incident de rançongiciel chez une entreprise partenaire, Adatum ajoute ces exigences :

    - Personne, y compris les propriétaires de l'abonnement, ne peut supprimer des points de récupération ni raccourcir leur rétention avant leur expiration.
    - Les opérations critiques sur le coffre, comme la désactivation de la suppression réversible, doivent exiger une approbation de l'équipe de sécurité, qui gère son propre abonnement.

    Quelles sont les deux fonctionnalités à configurer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Cross Region Restore on the vault", fr: "La restauration interrégion sur le coffre" } }
    - { id: b, text: { en: "Multi-user authorization with a Resource Guard", fr: "L'autorisation multi-utilisateur avec un Resource Guard" } }
    - { id: c, text: { en: "Customer-managed keys for the vault encryption", fr: "Des clés gérées par le client pour le chiffrement du coffre" } }
    - { id: d, text: { en: "A locked immutable vault", fr: "Un coffre immuable verrouillé" } }
    - { id: e, text: { en: "A Backup Contributor role assignment for the security team", fr: "Une attribution du rôle Backup Contributor à l'équipe de sécurité" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      An immutable vault blocks operations that could lose recovery points, such as deleting them or reducing retention, and locking it makes the setting irreversible. Multi-user authorization with a Resource Guard, owned by another team, requires that team's approval before critical operations run. Microsoft recommends both, with read-only vault access for SAP administrators, to protect SAP backups against ransomware and rogue administrators.
    fr: |
      Un coffre immuable bloque les opérations qui pourraient faire perdre des points de récupération, comme leur suppression ou la réduction de la rétention, et le verrouiller rend ce paramètre irréversible. L'autorisation multi-utilisateur avec un Resource Guard, détenu par une autre équipe, exige l'approbation de cette équipe avant l'exécution des opérations critiques. Microsoft recommande les deux, avec un accès en lecture seule au coffre pour les administrateurs SAP, pour protéger les sauvegardes SAP des rançongiciels et des administrateurs malveillants.
  options:
    a: { en: "Cross Region Restore allows restores in the paired region; it doesn't prevent deletion or require approvals.", fr: "La restauration interrégion permet des restaurations dans la région jumelée ; elle n'empêche pas les suppressions et n'exige pas d'approbation." }
    c: { en: "Customer-managed keys control the encryption keys; they don't block deletion of recovery points.", fr: "Les clés gérées par le client contrôlent les clés de chiffrement ; elles ne bloquent pas la suppression des points de récupération." }
    e: { en: "Granting the security team Backup Contributor adds privileges but doesn't force an approval for operations run by others.", fr: "Attribuer Backup Contributor à l'équipe de sécurité ajoute des privilèges, mais n'impose pas d'approbation pour les opérations exécutées par d'autres." }
references:
  - title: Concept of Immutable Vault for Azure Backup
    url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-immutable-vault-concept
  - title: Multiuser Authorization Using Resource Guard
    url: https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization-concept
