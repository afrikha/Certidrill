id: az120-2a-sdaf-tools
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to use SAP Deployment Automation Framework to deploy and configure several SAP S/4HANA systems on Azure. The infrastructure team must know which technologies it needs to learn.

    Which technologies does the framework use to create the Azure infrastructure and to configure the VMs and install SAP?
  fr: |
    Contoso prévoit d'utiliser SAP Deployment Automation Framework pour déployer et configurer plusieurs systèmes SAP S/4HANA sur Azure. L'équipe d'infrastructure doit savoir quelles technologies elle doit apprendre.

    Quelles technologies le framework utilise-t-il pour créer l'infrastructure Azure, puis pour configurer les machines virtuelles et installer SAP ?
body:
  options:
    - { id: a, text: { en: "Terraform for the infrastructure and Ansible for the VMs", fr: "Terraform pour l'infrastructure et Ansible pour les machines virtuelles" } }
    - { id: b, text: { en: "ARM templates for the infrastructure and cloud-init for the VMs", fr: "Des modèles ARM pour l'infrastructure et cloud-init pour les machines virtuelles" } }
    - { id: c, text: { en: "Bicep for the infrastructure and Azure Automation State Configuration for the VMs", fr: "Bicep pour l'infrastructure et Azure Automation State Configuration pour les machines virtuelles" } }
    - { id: d, text: { en: "Terraform for the infrastructure and Azure Machine Configuration for the VMs", fr: "Terraform pour l'infrastructure et Azure Machine Configuration pour les machines virtuelles" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      SAP Deployment Automation Framework is an open-source orchestration tool that creates the SAP infrastructure with Terraform and configures the operating systems, installs SAP and sets up high availability with Ansible playbooks run from the deployer VMs.
    fr: |
      SAP Deployment Automation Framework est un outil d'orchestration open source qui crée l'infrastructure SAP avec Terraform, puis configure les systèmes d'exploitation, installe SAP et met en place la haute disponibilité avec des playbooks Ansible exécutés depuis les machines virtuelles de déploiement.
  options:
    c:
      en: |
        The framework does not use Bicep or Azure Automation; its infrastructure code is Terraform.
      fr: |
        Le framework n'utilise ni Bicep ni Azure Automation ; son code d'infrastructure est en Terraform.
    b:
      en: |
        ARM templates and cloud-init are not the engines of the framework; it uses Terraform and Ansible.
      fr: |
        Les modèles ARM et cloud-init ne sont pas les moteurs du framework ; il utilise Terraform et Ansible.
    d:
      en: |
        The infrastructure part is right, but the configuration is done with Ansible playbooks, not with Azure Machine Configuration.
      fr: |
        La partie infrastructure est juste, mais la configuration est faite avec des playbooks Ansible, pas avec Azure Machine Configuration.
references:
  - title: About SAP Deployment Automation Framework
    url: https://learn.microsoft.com/en-us/azure/sap/automation/deployment-framework
