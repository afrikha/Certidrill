id: az120-2c-wa-disk-limit
objective: "2.3.6"
type: single
difficulty: 1
shuffle: false
status: draft
stem:
  en: |
    Fabrikam plans to run SAP HANA on a **Standard_M32ms** virtual machine. The **/hana/log** volume will be a stripe set of Premium SSD disks, and Write Accelerator must be enabled on every disk of the stripe set.

    What is the maximum number of disks that can have Write Accelerator enabled on this VM?
  fr: |
    Fabrikam prévoit d'exécuter SAP HANA sur une machine virtuelle **Standard_M32ms**. Le volume **/hana/log** sera un jeu entrelacé de disques SSD Premium, et l'Accélérateur d'écriture doit être activé sur chaque disque du jeu entrelacé.

    Quel est le nombre maximal de disques pouvant avoir l'Accélérateur d'écriture activé sur cette machine virtuelle ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "4" }
    - { id: d, text: "8" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The number of Write Accelerator disks depends on the VM size: Standard_M32ms supports 4 Write Accelerator disks, which share 5,000 IOPS. Larger sizes such as Standard_M64ms support 8, and Standard_M128ms supports 16.
    fr: |
      Le nombre de disques avec Accélérateur d'écriture dépend de la taille de la machine virtuelle : Standard_M32ms prend en charge 4 disques avec Accélérateur d'écriture, qui partagent 5 000 IOPS. Des tailles plus grandes comme Standard_M64ms en prennent en charge 8, et Standard_M128ms 16.
  options:
    a: { en: "One Write Accelerator disk is the limit of the M8 sizes.", fr: "Un seul disque avec Accélérateur d'écriture est la limite des tailles M8." }
    b: { en: "Two Write Accelerator disks is the limit of the M16 sizes.", fr: "Deux disques avec Accélérateur d'écriture est la limite des tailles M16." }
    d: { en: "Eight Write Accelerator disks is the limit of the M64 sizes.", fr: "Huit disques avec Accélérateur d'écriture est la limite des tailles M64." }
references:
  - title: Azure Write Accelerator
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/how-to-enable-write-accelerator
