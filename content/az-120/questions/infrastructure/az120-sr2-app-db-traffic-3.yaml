id: az120-sr2-app-db-traffic-3
objective: "2.2.5"
type: series_yesno
series: az120-sr2-app-db-traffic
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: |
    You move the HANA VM to a separate virtual network peered with VNet1.
  fr: |
    Vous déplacez la machine virtuelle HANA dans un réseau virtuel distinct connecté par peering à VNet1.
body:
  solution:
    en: |
      You redeploy the HANA VM in a new virtual network named **VNet-DB** that is peered with VNet1. A network security group on the subnet of VNet-DB allows only the HANA SQL ports from the address prefix of **AppSubnet** and denies all other inbound traffic from VNet1.
    fr: |
      Vous redéployez la machine virtuelle HANA dans un nouveau réseau virtuel nommé **VNet-DB**, connecté par peering à VNet1. Un groupe de sécurité réseau sur le sous-réseau de VNet-DB autorise uniquement les ports SQL de HANA depuis le préfixe d'adresse d'**AppSubnet** et refuse tout autre trafic entrant en provenance de VNet1.
answer: { value: false }
explanation:
  correct:
    en: |
      Placing the SAP application layer and the DBMS layer in different virtual networks is not supported, even when the networks are peered; the two layers must be separated by subnets of the same virtual network. Peering would also add data transfer costs on the busiest path of the system.
    fr: |
      Séparer la couche Application SAP et la couche SGBD dans des réseaux virtuels différents n'est pas pris en charge, même avec un peering : les deux couches doivent être séparées par des sous-réseaux du même réseau virtuel. Le peering ajouterait aussi des coûts de transfert de données sur le chemin le plus sollicité du système.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
