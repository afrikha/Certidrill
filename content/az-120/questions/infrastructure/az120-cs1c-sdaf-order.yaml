id: az120-cs1c-sdaf-order
objective: "2.1.6"
type: ordering
caseStudy: az120-cs1c-tailspin-toys
difficulty: 2
status: draft
stem:
  en: |
    You need to deploy TSQ to meet the deployment requirement.

    Which three actions should you perform in sequence from the deployer? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez déployer TSQ pour satisfaire l'exigence de déploiement.

    Quelles sont les trois actions à effectuer dans l'ordre depuis le deployer ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: wz, text: { en: "Run install_workloadzone.sh with the parameter file of the new workload zone.", fr: "Exécuter install_workloadzone.sh avec le fichier de paramètres de la nouvelle zone de charge de travail." } }
    - { id: sys, text: { en: "Run installer.sh with --type sap_system and the parameter file of TSQ.", fr: "Exécuter installer.sh avec --type sap_system et le fichier de paramètres de TSQ." } }
    - { id: ans, text: { en: "Run the Ansible playbooks from configuration_menu.sh to configure the OS and install SAP.", fr: "Exécuter les playbooks Ansible depuis configuration_menu.sh pour configurer le système d'exploitation et installer SAP." } }
    - { id: cp, text: { en: "Run deploy_controlplane.sh with the deployer and library parameter files.", fr: "Exécuter deploy_controlplane.sh avec les fichiers de paramètres du deployer et de la bibliothèque." } }
    - { id: bom, text: { en: "Run download_menu.sh and select the BoM Downloader playbook.", fr: "Exécuter download_menu.sh et sélectionner le playbook BoM Downloader." } }
    - { id: acss, text: { en: "Register TSQ with Azure Center for SAP solutions.", fr: "Inscrire TSQ auprès du Centre Azure pour les solutions SAP." } }
answer:
  sequence: [ wz, sys, ans ]
explanation:
  correct:
    en: |
      SDAF deploys a workload zone (network, key vault for system credentials) with install_workloadzone.sh, then the infrastructure of each SAP system into that zone with installer.sh --type sap_system. The Ansible playbooks, started from configuration_menu.sh or the command line, then configure the operating system and install the SAP software from the media in the SAP library.
    fr: |
      SDAF déploie une zone de charge de travail (réseau, coffre de clés pour les informations d'identification des systèmes) avec install_workloadzone.sh, puis l'infrastructure de chaque système SAP dans cette zone avec installer.sh --type sap_system. Les playbooks Ansible, lancés depuis configuration_menu.sh ou la ligne de commande, configurent ensuite le système d'exploitation et installent le logiciel SAP à partir du support de la bibliothèque SAP.
  options:
    cp:
      en: |
        The control plane already exists and rarely needs to be redeployed.
      fr: |
        Le plan de contrôle existe déjà et n'a que rarement besoin d'être redéployé.
    bom:
      en: |
        The BoM Downloader copies the media into the sapbits container, which already contains it.
      fr: |
        Le BoM Downloader copie le support dans le conteneur sapbits, qui le contient déjà.
    acss:
      en: |
        Registering with Azure Center for SAP solutions is not part of an SDAF deployment and is not needed to get a running system.
      fr: |
        L'inscription auprès du Centre Azure pour les solutions SAP ne fait pas partie d'un déploiement SDAF et n'est pas nécessaire pour obtenir un système en cours d'exécution.
references:
  - title: Deploy SAP Deployment Automation Framework for enterprise scale
    url: https://learn.microsoft.com/en-us/azure/sap/automation/tutorial
  - title: About SAP Deployment Automation Framework
    url: https://learn.microsoft.com/en-us/azure/sap/automation/deployment-framework
