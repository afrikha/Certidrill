id: az120-2b-an-both-vms
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs an SAP S/4HANA system on Azure virtual machines. The SAP HANA VM **hanaprd01** and four application server VMs run in the same virtual network, in two different subnets.

    Accelerated Networking is enabled on the network interface of hanaprd01 only. Performance tests show that the round-trip time between the application servers and the database barely improved after Accelerated Networking was enabled.

    You need to reduce the network latency between the application layer and the database layer.

    What should you do?
  fr: |
    Contoso exécute un système SAP S/4HANA sur des machines virtuelles Azure. La machine virtuelle SAP HANA **hanaprd01** et quatre machines virtuelles de serveur d'applications sont dans le même réseau virtuel, dans deux sous-réseaux différents.

    Accelerated Networking est activé uniquement sur l'interface réseau de hanaprd01. Les tests de performances montrent que le temps aller-retour entre les serveurs d'applications et la base de données s'est à peine amélioré après l'activation d'Accelerated Networking.

    Vous devez réduire la latence réseau entre la couche Application et la couche Base de données.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Enable Accelerated Networking on the network interfaces of the four application server VMs.", fr: "Activer Accelerated Networking sur les interfaces réseau des quatre machines virtuelles de serveur d'applications." }
    - id: b
      text: { en: "Add a second network interface to hanaprd01 in the application server subnet.", fr: "Ajouter une deuxième interface réseau à hanaprd01 dans le sous-réseau des serveurs d'applications." }
    - id: c
      text: { en: "Move the application server VMs to a peered virtual network that has Accelerated Networking enabled.", fr: "Déplacer les machines virtuelles de serveur d'applications vers un réseau virtuel relié par peering où Accelerated Networking est activé." }
    - id: d
      text: { en: "Enable IP forwarding on the network interface of hanaprd01.", fr: "Activer le transfert IP sur l'interface réseau de hanaprd01." }
answer: { optionId: a }
explanation:
  correct:
    en: "The benefits of Accelerated Networking apply only to the VM that enables it, so both communication partners need it. Microsoft recommends enabling it on at least two VMs in the same virtual network for best results, and the SAP guidance asks for it on every VM of the application and DBMS layers."
    fr: "Les avantages d'Accelerated Networking ne s'appliquent qu'à la machine virtuelle sur laquelle il est activé ; les deux partenaires de communication en ont donc besoin. Microsoft recommande de l'activer sur au moins deux machines virtuelles du même réseau virtuel pour obtenir les meilleurs résultats, et les recommandations SAP le demandent sur toutes les machines virtuelles des couches Application et SGBD."
  options:
    b:
      en: "Additional NICs share the VM's bandwidth and don't add acceleration on the application servers; Microsoft recommends as few NICs as possible."
      fr: "Les cartes réseau supplémentaires partagent la bande passante de la machine virtuelle et n'accélèrent pas les serveurs d'applications ; Microsoft recommande le moins de cartes réseau possible."
    c:
      en: "Accelerated Networking has minimal effect across virtual networks, and splitting the SAP layers into peered virtual networks isn't supported."
      fr: "Accelerated Networking a un effet minime entre réseaux virtuels, et la séparation des couches SAP dans des réseaux virtuels reliés par peering n'est pas prise en charge."
    d:
      en: "IP forwarding lets a VM route traffic for other addresses (as an NVA does); it doesn't reduce latency."
      fr: "Le transfert IP permet à une machine virtuelle de router du trafic destiné à d'autres adresses (comme une NVA) ; il ne réduit pas la latence."
references:
  - title: Azure Accelerated Networking Overview and Benefits
    url: https://learn.microsoft.com/en-us/azure/virtual-network/accelerated-networking-overview
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
