id: az120-cs4a-rise-dns
objective: "2.2.8"
type: dropdown
caseStudy: az120-cs4a-wideworld
difficulty: 3
status: draft
stem:
  en: |
    You need to design name resolution for the SAP S/4HANA systems. The solution must meet the network requirements.

    What should you include in the design? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez concevoir la résolution de noms pour les systèmes SAP S/4HANA. La solution doit respecter les exigences réseau.

    Que devez-vous inclure dans la conception ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Authority for sap.wideworldimporters.com: [[zone]]

      How DC1 and DC2 obtain the SAP records: [[copy]]
    fr: |
      Autorité pour sap.wideworldimporters.com : [[zone]]

      Comment DC1 et DC2 obtiennent les enregistrements SAP : [[copy]]
  slots:
    - id: zone
      options:
        - { id: delegate, text: { en: "Delegate the subdomain to the SAP DNS servers, which hold the primary zone", fr: "Déléguer le sous-domaine aux serveurs DNS de SAP, qui détiennent la zone principale" } }
        - { id: privzone, text: { en: "Create an Azure private DNS zone in Sub-Connectivity and grant SAP write access", fr: "Créer une zone DNS privée Azure dans Sub-Connectivity et accorder à SAP un accès en écriture" } }
        - { id: adzone, text: { en: "Create a primary zone on DC1 and DC2 in which the SAP systems register their records by dynamic update", fr: "Créer sur DC1 et DC2 une zone principale dans laquelle les systèmes SAP inscrivent leurs enregistrements par mise à jour dynamique" } }
        - { id: azuredns, text: { en: "Rely on the Azure-provided DNS of the SAP-managed virtual network", fr: "S'appuyer sur le DNS fourni par Azure du réseau virtuel géré par SAP" } }
    - id: copy
      options:
        - { id: forward, text: { en: "A DNS forwarder in VNET-HUB-WE that sends queries for the zone to the SAP DNS servers", fr: "Un redirecteur DNS dans VNET-HUB-WE qui envoie les requêtes de la zone aux serveurs DNS de SAP" } }
        - { id: transfer, text: { en: "A DNS zone transfer from the SAP DNS servers to secondary zones on DC1 and DC2", fr: "Un transfert de zone DNS des serveurs DNS de SAP vers des zones secondaires sur DC1 et DC2" } }
        - { id: vnetlink, text: { en: "A virtual network link from a private DNS zone to the SAP-managed virtual network", fr: "Une liaison de réseau virtuel d'une zone DNS privée vers le réseau virtuel géré par SAP" } }
        - { id: sync, text: { en: "Microsoft Entra Connect synchronization of the SAP DNS records", fr: "La synchronisation Microsoft Entra Connect des enregistrements DNS de SAP" } }
answer:
  values: { zone: delegate, copy: transfer }
explanation:
  correct:
    en: With RISE, the customer provides a subdomain and delegates it to SAP; the SAP DNS servers in the SAP-managed virtual network hold the primary role for that zone and SAP maintains its records. DNS zone transfer from the SAP DNS servers to the customer DNS servers is the primary method to replicate the records, which gives DC1 and DC2 a local copy that keeps resolving when the SAP DNS servers are unreachable. Zone transfer works here because DC1 and DC2 run Windows DNS on AD DS.
    fr: Avec RISE, le client fournit un sous-domaine et le délègue à SAP ; les serveurs DNS de SAP dans le réseau virtuel géré par SAP détiennent le rôle principal pour cette zone et SAP gère ses enregistrements. Le transfert de zone DNS des serveurs DNS de SAP vers les serveurs DNS du client est la méthode principale de réplication des enregistrements ; DC1 et DC2 disposent ainsi d'une copie locale qui continue de répondre quand les serveurs DNS de SAP sont inaccessibles. Le transfert de zone fonctionne ici, car DC1 et DC2 exécutent le DNS Windows sur AD DS.
  options:
    privzone: { en: "Azure private DNS zones do not support zone transfer, and SAP keeps the master role for the delegated zone on its own DNS servers.", fr: "Les zones DNS privées Azure ne prennent pas en charge le transfert de zone, et SAP conserve le rôle principal de la zone déléguée sur ses propres serveurs DNS." }
    adzone: { en: "With RISE, the customer delegates the zone to SAP and the SAP DNS servers hold its primary role; the customer DNS servers receive the records as a copy.", fr: "Avec RISE, le client délègue la zone à SAP et les serveurs DNS de SAP en détiennent le rôle principal ; les serveurs DNS du client reçoivent les enregistrements sous forme de copie." }
    azuredns: { en: "Azure-provided DNS cannot host a custom zone such as sap.wideworldimporters.com or answer queries from on-premises clients.", fr: "Le DNS fourni par Azure ne peut pas héberger une zone personnalisée comme sap.wideworldimporters.com ni répondre aux requêtes des clients locaux." }
    forward: { en: "A forwarder resolves names while the SAP DNS servers answer, but DC1 and DC2 would hold no copy of the records, as requirement 3 demands.", fr: "Un redirecteur résout les noms tant que les serveurs DNS de SAP répondent, mais DC1 et DC2 ne détiendraient aucune copie des enregistrements, contrairement à ce qu'exige l'exigence 3." }
    vnetlink: { en: "Wide World Importers has no access to the SAP subscription, and a virtual network link does not copy records to DC1 and DC2.", fr: "Wide World Importers n'a pas accès à l'abonnement de SAP, et une liaison de réseau virtuel ne copie pas d'enregistrements vers DC1 et DC2." }
    sync: { en: "Microsoft Entra Connect synchronizes identities, not DNS records.", fr: "Microsoft Entra Connect synchronise des identités, pas des enregistrements DNS." }
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
