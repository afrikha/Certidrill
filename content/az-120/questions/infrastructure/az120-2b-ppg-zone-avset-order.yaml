id: az120-2b-ppg-zone-avset-order
objective: "2.2.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Tailspin runs SAP ERP in an Azure region where the latency inside availability zone 1 doesn't meet the requirements of the application. You decide to colocate the SAP central services (ASCS) VM and the application servers of zone 1 under the same network spine, and to spread the application servers across fault domains by using an availability set. Following current Microsoft guidance, the database VMs stay out of the proximity placement group.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin exécute SAP ERP dans une région Azure où la latence à l'intérieur de la zone de disponibilité 1 ne répond pas aux exigences de l'application. Vous décidez de colocaliser la machine virtuelle des services centraux SAP (ASCS) et les serveurs d'applications de la zone 1 sous la même colonne vertébrale réseau, et de répartir les serveurs d'applications sur des domaines d'erreur à l'aide d'un groupe à haute disponibilité. Conformément aux recommandations actuelles de Microsoft, les machines virtuelles de base de données restent hors du groupe de placement de proximité.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: ppg, text: { en: "Create a proximity placement group.", fr: "Créer un groupe de placement de proximité." } }
    - { id: ascs, text: { en: "Deploy the ASCS VM in zone 1 and reference the proximity placement group.", fr: "Déployer la machine virtuelle ASCS dans la zone 1 en référençant le groupe de placement de proximité." } }
    - { id: avset, text: { en: "Create an availability set that references the proximity placement group by its resource ID.", fr: "Créer un groupe à haute disponibilité qui référence le groupe de placement de proximité par son ID de ressource." } }
    - { id: app, text: { en: "Deploy the application server VMs and reference the availability set and the proximity placement group.", fr: "Déployer les machines virtuelles de serveur d'applications en référençant le groupe à haute disponibilité et le groupe de placement de proximité." } }
    - { id: db, text: { en: "Deploy the first database VM in zone 1 and reference the proximity placement group.", fr: "Déployer la première machine virtuelle de base de données dans la zone 1 en référençant le groupe de placement de proximité." } }
    - { id: avzone, text: { en: "Create an availability set and assign it to zone 1.", fr: "Créer un groupe à haute disponibilité et l'affecter à la zone 1." } }
answer:
  sequence: [ ppg, ascs, avset, app ]
explanation:
  correct:
    en: "The first VM deployed in a proximity placement group pins it to a network spine; in the current zonal model, that anchor is the ASCS/SCS VM deployed with a zone and the PPG. Because a VM can't reference both a zone and an availability set, you then create an availability set tied to the PPG (by ID) and deploy the application servers into that set and PPG, which places them in the same zone and datacenter as the anchor."
    fr: "La première machine virtuelle déployée dans un groupe de placement de proximité l'ancre sur une colonne vertébrale réseau ; dans le modèle zonal actuel, cette ancre est la machine virtuelle ASCS/SCS déployée avec une zone et le PPG. Comme une machine virtuelle ne peut pas référencer à la fois une zone et un groupe à haute disponibilité, vous créez ensuite un groupe à haute disponibilité lié au PPG (par son ID) et y déployez les serveurs d'applications, qui se retrouvent ainsi dans la même zone et le même centre de données que l'ancre."
  options:
    db: { en: "Database VMs are no longer part of the PPG in the current guidance; anchoring with the DBMS VM was the older model.", fr: "Les machines virtuelles de base de données ne font plus partie du PPG dans les recommandations actuelles ; l'ancrage par la machine virtuelle SGBD correspond à l'ancien modèle." }
    avzone: { en: "An availability set can't be assigned to an availability zone; it follows the zone of the PPG anchor.", fr: "Un groupe à haute disponibilité ne peut pas être affecté à une zone ; il suit la zone de l'ancre du PPG." }
references:
  - title: Configuration options to minimize network latency with SAP applications
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/proximity-placement-scenarios
