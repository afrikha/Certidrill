id: az120-2a-bicep-what-if
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin deploys the VMs of its SAP landscape with a Bicep file named **main.bicep** to a resource group named **RG-SAP-QAS**. Before each change, the operations team must see which resources the deployment will create, modify or delete.

    Which two commands can the team use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin déploie les machines virtuelles de son paysage SAP avec un fichier Bicep nommé **main.bicep** dans un groupe de ressources nommé **RG-SAP-QAS**. Avant chaque modification, l'équipe d'exploitation doit voir les ressources que le déploiement va créer, modifier ou supprimer.

    Quelles sont les deux commandes que l'équipe peut utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "az deployment group validate --resource-group RG-SAP-QAS --template-file main.bicep" }
    - { id: b, text: "az deployment group what-if --resource-group RG-SAP-QAS --template-file main.bicep" }
    - { id: c, text: "az deployment group create --resource-group RG-SAP-QAS --template-file main.bicep --rollback-on-error" }
    - { id: d, text: "az deployment group create --resource-group RG-SAP-QAS --template-file main.bicep --confirm-with-what-if" }
    - { id: e, text: "az bicep build main.bicep --stdout" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      `az deployment group what-if` previews the changes (Create, Delete, Modify, NoChange and so on) without deploying. `az deployment group create --confirm-with-what-if` (short form `-c`) shows the same preview and asks for confirmation before it deploys.
    fr: |
      `az deployment group what-if` affiche un aperçu des modifications (Create, Delete, Modify, NoChange, etc.) sans déployer. `az deployment group create --confirm-with-what-if` (forme courte `-c`) affiche le même aperçu et demande une confirmation avant de déployer.
  options:
    a:
      en: |
        validate checks that the template is valid and would be accepted, but it does not list the resource changes.
      fr: |
        validate vérifie que le modèle est valide et serait accepté, mais il ne liste pas les modifications des ressources.
    c:
      en: |
        --rollback-on-error redeploys the last successful deployment if this one fails; it shows no preview.
      fr: |
        --rollback-on-error redéploie le dernier déploiement réussi si celui-ci échoue ; il n'affiche aucun aperçu.
    e:
      en: |
        az bicep build converts the Bicep file to an ARM JSON template; it does not compare it with the deployed resources.
      fr: |
        az bicep build convertit le fichier Bicep en modèle ARM JSON ; il ne le compare pas aux ressources déployées.
references:
  - title: "Bicep What-If: Preview Changes Before Deployment - Azure Resource Manager"
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deploy-what-if
