id: az120-2b-er-fastpath-sku
objective: "2.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware's SAP application servers run in a virtual network that contains an ExpressRoute gateway with the **ErGw2Az** SKU. The gateway is connected to a 10-Gbps ExpressRoute provider circuit. SAP GUI users in the datacenter report high response times, and the network team wants on-premises traffic to bypass the gateway and go directly to the SAP VMs.

    You need to enable ExpressRoute FastPath on the connection.

    What should you do first?
  fr: |
    Les serveurs d'applications SAP de Litware s'exécutent dans un réseau virtuel qui contient une passerelle ExpressRoute de référence SKU **ErGw2Az**. La passerelle est connectée à un circuit ExpressRoute de fournisseur de 10 Gbits/s. Les utilisateurs SAP GUI du centre de données signalent des temps de réponse élevés, et l'équipe réseau veut que le trafic local contourne la passerelle pour aller directement aux machines virtuelles SAP.

    Vous devez activer ExpressRoute FastPath sur la connexion.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Enable the ExpressRoute Premium add-on on the circuit.", fr: "Activer le module complémentaire ExpressRoute Premium sur le circuit." }
    - id: b
      text: { en: "Enable ExpressRoute Global Reach on the circuit.", fr: "Activer ExpressRoute Global Reach sur le circuit." }
    - id: c
      text: { en: "Upgrade the gateway to the ErGw3Az SKU.", fr: "Mettre à niveau la passerelle vers la référence SKU ErGw3Az." }
    - id: d
      text: { en: "Convert the circuit to ExpressRoute Direct.", fr: "Convertir le circuit en ExpressRoute Direct." }
answer: { optionId: c }
explanation:
  correct:
    en: "FastPath requires an Ultra Performance or ErGw3Az gateway, an ErGwScale gateway with at least 10 scale units, or a Virtual WAN ExpressRoute gateway with at least 5 scale units. ErGw2Az doesn't support FastPath, and it can be upgraded in place to ErGw3Az because both SKUs are in the availability-zone-enabled family. FastPath to VMs in the gateway's virtual network works with provider circuits."
    fr: "FastPath exige une passerelle Ultra Performance ou ErGw3Az, une passerelle ErGwScale d'au moins 10 unités d'échelle, ou une passerelle ExpressRoute Virtual WAN d'au moins 5 unités d'échelle. ErGw2Az ne prend pas en charge FastPath et peut être mise à niveau sur place vers ErGw3Az, car les deux références SKU appartiennent à la famille compatible avec les zones de disponibilité. FastPath vers les machines virtuelles du réseau virtuel de la passerelle fonctionne avec les circuits de fournisseur."
  options:
    a:
      en: "Premium extends routing limits and geographic reach; it isn't a FastPath prerequisite."
      fr: "Premium étend les limites de routage et la portée géographique ; ce n'est pas un prérequis de FastPath."
    b:
      en: "Global Reach links ExpressRoute circuits together for on-premises-to-on-premises traffic."
      fr: "Global Reach relie des circuits ExpressRoute entre eux pour le trafic entre sites locaux."
    d:
      en: "ExpressRoute Direct is only needed for some FastPath features, such as spoke peering, UDRs or Private Link, not for VMs in the hub."
      fr: "ExpressRoute Direct n'est nécessaire que pour certaines fonctionnalités FastPath, comme le peering de spokes, les UDR ou Private Link, pas pour les machines virtuelles du hub."
references:
  - title: "Azure ExpressRoute FastPath: Features, availability, and limitations"
    url: https://learn.microsoft.com/en-us/azure/expressroute/about-fastpath
  - title: About ExpressRoute virtual network gateways
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-virtual-network-gateways
