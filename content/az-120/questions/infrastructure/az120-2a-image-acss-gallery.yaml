id: az120-2a-image-acss-gallery
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has a hardened image of SUSE Linux Enterprise Server for SAP Applications 15 SP4, stored as a managed image in a subscription named **Sub-Shared**. Contoso plans to deploy a new SAP S/4HANA system with Azure Center for SAP solutions in a subscription named **Sub-SAP** and wants the deployment to use this custom OS image. The base OS version of the image is on the list supported by the service.

    What should you do before you start the deployment?
  fr: |
    Contoso dispose d'une image durcie de SUSE Linux Enterprise Server for SAP Applications 15 SP4, stockée sous forme d'image managée dans un abonnement nommé **Sub-Shared**. Contoso prévoit de déployer un nouveau système SAP S/4HANA avec le Centre Azure pour les solutions SAP dans un abonnement nommé **Sub-SAP** et veut que le déploiement utilise cette image de système d'exploitation personnalisée. La version de base du système d'exploitation de l'image figure dans la liste prise en charge par le service.

    Que devez-vous faire avant de lancer le déploiement ?
body:
  options:
    - { id: a, text: { en: "Grant the deployment managed identity the Reader role on the managed image in Sub-Shared.", fr: "Accorder le rôle Reader à l'identité managée du déploiement sur l'image managée de Sub-Shared." } }
    - { id: b, text: { en: "Create an image version in an Azure Compute Gallery in Sub-SAP with security type Standard, and grant the managed identity Reader on the gallery.", fr: "Créer une version d'image dans une galerie Azure Compute Gallery de Sub-SAP avec le type de sécurité Standard, et accorder le rôle Reader à l'identité managée sur la galerie." } }
    - { id: c, text: { en: "Create an image version in an Azure Compute Gallery in Sub-Shared, and share the gallery with Sub-SAP as a community gallery.", fr: "Créer une version d'image dans une galerie Azure Compute Gallery de Sub-Shared, et partager la galerie avec Sub-SAP en tant que galerie communautaire." } }
    - { id: d, text: { en: "Create an image version in an Azure Compute Gallery in Sub-SAP with security type TrustedLaunch, and grant the managed identity Contributor on the gallery.", fr: "Créer une version d'image dans une galerie Azure Compute Gallery de Sub-SAP avec le type de sécurité TrustedLaunch, et accorder le rôle Contributor à l'identité managée sur la galerie." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure Center for SAP solutions accepts a custom OS image only if it is stored in an Azure Compute Gallery in the same subscription as the deployment and uses the Standard security type. The user-assigned managed identity of the deployment needs the Reader role on the gallery.
    fr: |
      Le Centre Azure pour les solutions SAP n'accepte une image de système d'exploitation personnalisée que si elle est stockée dans une galerie Azure Compute Gallery du même abonnement que le déploiement et utilise le type de sécurité Standard. L'identité managée affectée par l'utilisateur du déploiement a besoin du rôle Reader sur la galerie.
  options:
    a:
      en: |
        A managed image outside a gallery is not a supported source, and the image is in another subscription.
      fr: |
        Une image managée hors galerie n'est pas une source prise en charge, et l'image se trouve dans un autre abonnement.
    c:
      en: |
        The gallery must be in the same subscription as the deployment; a community gallery also makes the image public.
      fr: |
        La galerie doit se trouver dans le même abonnement que le déploiement ; une galerie communautaire rend en outre l'image publique.
    d:
      en: |
        The service requires the Standard security type, and Reader on the gallery is enough; Contributor exceeds what is needed.
      fr: |
        Le service exige le type de sécurité Standard, et le rôle Reader sur la galerie suffit ; Contributor dépasse le besoin.
references:
  - title: Deploy an S/4HANA infrastructure
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/deploy-s4hana
  - title: Share VM images in a compute gallery - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries
