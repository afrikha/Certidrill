id: az120-2c-anf-delegated-subnet
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam plans to host the **/hana/data**, **/hana/log** and **/hana/shared** volumes of an SAP HANA system on Azure NetApp Files. The HANA VM runs in a virtual network named **VNet-HANA**.

    You need to prepare VNet-HANA so that the Azure NetApp Files volumes can be created and reached privately from the HANA VM.

    What should you configure in VNet-HANA?
  fr: |
    Fabrikam prévoit d'héberger les volumes **/hana/data**, **/hana/log** et **/hana/shared** d'un système SAP HANA sur Azure NetApp Files. La machine virtuelle HANA s'exécute dans un réseau virtuel nommé **VNet-HANA**.

    Vous devez préparer VNet-HANA afin que les volumes Azure NetApp Files puissent être créés et atteints de façon privée depuis la machine virtuelle HANA.

    Que devez-vous configurer dans VNet-HANA ?
body:
  options:
    - { id: a, text: { en: "A private endpoint for the NetApp account", fr: "Un point de terminaison privé pour le compte NetApp" } }
    - { id: b, text: { en: "A subnet delegated to Azure NetApp Files", fr: "Un sous-réseau délégué à Azure NetApp Files" } }
    - { id: c, text: { en: "A Microsoft.Storage service endpoint on the HANA subnet", fr: "Un point de terminaison de service Microsoft.Storage sur le sous-réseau HANA" } }
    - { id: d, text: { en: "A NAT gateway associated with the HANA subnet", fr: "Une passerelle NAT associée au sous-réseau HANA" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure NetApp Files volumes receive their IP addresses from a subnet delegated to Azure NetApp Files in the virtual network, so the traffic stays private. For SAP workloads, Microsoft highly recommends a /25 range for the delegated subnet.
    fr: |
      Les volumes Azure NetApp Files reçoivent leurs adresses IP d'un sous-réseau délégué à Azure NetApp Files dans le réseau virtuel ; le trafic reste ainsi privé. Pour les charges de travail SAP, Microsoft recommande fortement une plage /25 pour le sous-réseau délégué.
  options:
    a: { en: "Azure NetApp Files volumes are injected into a delegated subnet; they aren't reached through a private endpoint.", fr: "Les volumes Azure NetApp Files sont injectés dans un sous-réseau délégué ; ils ne sont pas atteints par un point de terminaison privé." }
    c: { en: "A Microsoft.Storage service endpoint applies to Azure Storage accounts, not to Azure NetApp Files.", fr: "Un point de terminaison de service Microsoft.Storage s'applique aux comptes Stockage Azure, pas à Azure NetApp Files." }
    d: { en: "A NAT gateway provides outbound internet access; it doesn't make volumes reachable.", fr: "Une passerelle NAT fournit un accès sortant à Internet ; elle ne rend pas les volumes accessibles." }
references:
  - title: SAP HANA Azure virtual machine ANF configuration
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-netapp
