id: az120-2a-sizing-recommendations
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin is sizing Azure virtual machines for a new SAP S/4HANA system. The sizing exercise produced a SAPS requirement for the database layer and another for the application layer.

    You need to recommend how to select the VM types. The solution must follow Microsoft guidance for SAP on Azure.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dimensionne les machines virtuelles Azure d'un nouveau système SAP S/4HANA. L'exercice de dimensionnement a produit un besoin en SAPS pour la couche de base de données et un autre pour la couche application.

    Vous devez recommander une méthode de sélection des types de machines virtuelles. La solution doit suivre les recommandations de Microsoft pour SAP sur Azure.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Size the DBMS VM first, because the database layer usually does not scale out.", fr: "Dimensionner d'abord la machine virtuelle du SGBD, car la couche de base de données ne se met généralement pas à l'échelle horizontalement." } }
    - { id: b, text: { en: "Deploy every SAP VM from a generation 2 image, whatever the VM size.", fr: "Déployer chaque machine virtuelle SAP à partir d'une image de génération 2, quelle que soit la taille." } }
    - { id: c, text: { en: "Use a VM type listed for Standard storage only to host the DBMS and reduce cost.", fr: "Utiliser un type de machine virtuelle listé pour le stockage Standard uniquement afin d'héberger le SGBD et de réduire les coûts." } }
    - { id: d, text: { en: "Store the SAP application data on the temporary disk to get the lowest latency.", fr: "Stocker les données de l'application SAP sur le disque temporaire pour obtenir la latence la plus faible." } }
    - { id: e, text: { en: "Size the application layer first, because the DBMS VM can be scaled out later.", fr: "Dimensionner d'abord la couche application, car la machine virtuelle du SGBD peut être mise à l'échelle horizontalement plus tard." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Microsoft advises comparing the DBMS SAPS requirement with the SAPS values of SAP Note 1928533 and sizing the DBMS VM first, because the database usually scales only up while application servers can scale out. Microsoft also recommends generation 2 VMs for all SAP deployments, regardless of size.
    fr: |
      Microsoft conseille de comparer le besoin en SAPS du SGBD aux valeurs SAPS de la note SAP 1928533 et de dimensionner d'abord la machine virtuelle du SGBD, car la base de données ne se met généralement à l'échelle que verticalement alors que les serveurs d'applications peuvent se multiplier. Microsoft recommande aussi la génération 2 pour tous les déploiements SAP, quelle que soit la taille.
  options:
    c:
      en: |
        SAP Note 1928533 lists VM types with Standard storage only separately, and DBMS deployment on those types is not supported.
      fr: |
        La note SAP 1928533 liste à part les types de machines virtuelles limités au stockage Standard, et le déploiement d'un SGBD sur ces types n'est pas pris en charge.
    d:
      en: |
        The temporary disk is only for expendable data such as swap or page files; its content can be lost.
      fr: |
        Le disque temporaire est réservé aux données jetables comme le fichier d'échange ; son contenu peut être perdu.
    e:
      en: |
        It is the application layer that scales out; the database layer is the one to size first.
      fr: |
        C'est la couche application qui se met à l'échelle horizontalement ; c'est la couche de base de données qu'il faut dimensionner en premier.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
  - title: What SAP software is supported on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/supported-product-on-azure
