id: az120-cs1b-oracle-storage
objective: "2.3.1"
type: dropdown
caseStudy: az120-cs1b-lucerne-publishing
difficulty: 1
status: draft
stem:
  en: |
    You are designing the storage of the LPP database VMs. The database will use managed disks. The design must meet the platform requirements.

    How should you complete the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez le stockage des machines virtuelles de base de données de LPP. La base de données utilisera des disques managés. La conception doit respecter les exigences de plateforme.

    Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Volume management for the database files: [[vol]]

      Disk type for the database disks: [[disk]]

      Host caching of the disks that hold the online redo log files: [[cache]]
    fr: |
      Gestion des volumes pour les fichiers de base de données : [[vol]]

      Type de disque pour les disques de la base de données : [[disk]]

      Mise en cache de l'hôte des disques qui contiennent les fichiers de journalisation en ligne (online redo log) : [[cache]]
  slots:
    - id: vol
      options:
        - { id: lvm, text: { en: "LVM striped volumes, without Oracle mirror log", fr: "Volumes LVM entrelacés, sans mirror log Oracle" } }
        - { id: asm, text: "Oracle ASM" }
        - { id: mdadm, text: { en: "mdadm RAID 1 volumes", fr: "Volumes mdadm RAID 1" } }
    - id: disk
      options:
        - { id: stdssd, text: { en: "Standard SSD", fr: "SSD Standard" } }
        - { id: azfiles, text: { en: "Azure Files NFS shares", fr: "Partages NFS Azure Files" } }
        - { id: premssd, text: { en: "Premium SSD", fr: "SSD Premium" } }
    - id: cache
      options:
        - { id: none, text: "None" }
        - { id: ro, text: "ReadOnly" }
        - { id: rw, text: "ReadWrite" }
answer:
  values: { vol: asm, disk: premssd, cache: none }
explanation:
  correct:
    en: |
      Microsoft recommends Oracle ASM on block storage for databases of all sizes and encourages moving from LVM file systems to ASM. The database disks must be Premium SSD (or Premium SSD v2 or Ultra Disk); Standard disks and Azure Files are not supported for Oracle. Only the DATA disk group can use read caching; all other disk groups, including the online redo logs, use None.
    fr: |
      Microsoft recommande Oracle ASM sur un stockage de blocs pour les bases de données de toutes tailles et encourage à passer des systèmes de fichiers LVM à ASM. Les disques de la base de données doivent être des SSD Premium (ou des SSD Premium v2 ou des disques Ultra) ; les disques Standard et Azure Files ne sont pas pris en charge pour Oracle. Seul le groupe de disques DATA peut utiliser la mise en cache en lecture ; tous les autres groupes de disques, y compris les fichiers de journalisation en ligne (online redo log), utilisent None.
  options:
    lvm:
      en: |
        LVM is supported only when ASM isn't used, and Oracle mirror log is then required, so LVM without mirror log is not a supported layout.
      fr: |
        LVM n'est pris en charge que lorsqu'ASM n'est pas utilisé, et le mirror log Oracle est alors obligatoire : LVM sans mirror log n'est pas une disposition prise en charge.
    azfiles:
      en: |
        Azure Files NFS and SMB shares are not supported for Oracle database files.
      fr: |
        Les partages NFS et SMB d'Azure Files ne sont pas pris en charge pour les fichiers de base de données Oracle.
references:
  - title: Azure virtual machines Oracle database deployment for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/dbms-guide-oracle
