id: az120-2c-stripe-premium-data
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware runs SAP HANA on a Standard_E32ds_v5 virtual machine that runs Red Hat Enterprise Linux. The **/hana/data** volume uses Premium SSD disks.

    Performance tests show that **/hana/data** needs more throughput than a single Premium SSD disk of the required capacity provides. The VM throughput limit is not reached.

    What should you do?
  fr: |
    Proseware exécute SAP HANA sur une machine virtuelle Standard_E32ds_v5 qui exécute Red Hat Enterprise Linux. Le volume **/hana/data** utilise des disques SSD Premium.

    Des tests de performances montrent que **/hana/data** a besoin de plus de débit que n'en fournit un seul disque SSD Premium de la capacité requise. La limite de débit de la machine virtuelle n'est pas atteinte.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Build an mdadm RAID 1 mirror of two Premium SSD disks.", fr: "Créer un miroir RAID 1 mdadm de deux disques SSD Premium." } }
    - { id: b, text: { en: "Build an LVM striped volume over several Premium SSD disks of the same size.", fr: "Créer un volume LVM entrelacé sur plusieurs disques SSD Premium de même taille." } }
    - { id: c, text: { en: "Build an LVM linear volume over Premium SSD disks of different sizes.", fr: "Créer un volume LVM linéaire sur des disques SSD Premium de tailles différentes." } }
    - { id: d, text: { en: "Keep a single Premium SSD disk and set its host caching to ReadWrite.", fr: "Conserver un seul disque SSD Premium et régler sa mise en cache de l'hôte sur ReadWrite." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With Premium SSD, IOPS and throughput are tied to the disk size, so you stripe several disks of the same size with LVM or mdadm to add up their IOPS and throughput. Azure already keeps three copies of each disk, so the stripe set needs no in-VM redundancy.
    fr: |
      Avec le SSD Premium, les IOPS et le débit dépendent de la taille du disque : vous entrelacez plusieurs disques de même taille avec LVM ou mdadm pour cumuler leurs IOPS et leur débit. Azure conserve déjà trois copies de chaque disque ; le jeu entrelacé n'a donc besoin d'aucune redondance dans la machine virtuelle.
  options:
    a: { en: "A mirror adds redundancy that Azure storage already provides and doesn't add write throughput.", fr: "Un miroir ajoute une redondance que le stockage Azure fournit déjà et n'augmente pas le débit en écriture." }
    c: { en: "A linear volume fills one disk after the other, so the I/O isn't spread across the disks.", fr: "Un volume linéaire remplit un disque après l'autre : les E/S ne sont pas réparties entre les disques." }
    d: { en: "ReadWrite caching isn't recommended for HANA data, and caching doesn't raise the disk's provisioned throughput for writes.", fr: "La mise en cache ReadWrite n'est pas recommandée pour les données HANA, et la mise en cache n'augmente pas le débit provisionné du disque pour les écritures." }
references:
