id: az120-2c-sapmnt-shared-services
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders plans a highly available SAP NetWeaver system on Red Hat Enterprise Linux. The ASCS and ERS instances will run in a Pacemaker cluster of two VMs in an availability set.

    You need to recommend storage for **/sapmnt/<SID>** and **/usr/sap/trans**. The file systems must be shared by all SAP VMs, and the solution must not require you to deploy or manage additional VMs to provide NFS.

    Which two storage services should you recommend? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders prévoit un système SAP NetWeaver hautement disponible sur Red Hat Enterprise Linux. Les instances ASCS et ERS s'exécuteront dans un cluster Pacemaker de deux machines virtuelles placées dans un groupe à haute disponibilité.

    Vous devez recommander le stockage de **/sapmnt/<SID>** et de **/usr/sap/trans**. Les systèmes de fichiers doivent être partagés par toutes les machines virtuelles SAP, et la solution ne doit pas vous obliger à déployer ou gérer des machines virtuelles supplémentaires pour fournir NFS.

    Quels sont les deux services de stockage à recommander ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Azure NetApp Files NFS volumes", fr: "Des volumes NFS Azure NetApp Files" } }
    - { id: b, text: { en: "Azure Blob Storage containers with NFS 3.0 enabled", fr: "Des conteneurs Stockage Blob Azure avec NFS 3.0 activé" } }
    - { id: c, text: { en: "NFS shares on Azure Files SSD", fr: "Des partages NFS sur Azure Files SSD" } }
    - { id: d, text: { en: "A Premium SSD v2 data disk attached to the ASCS VM", fr: "Un disque de données SSD Premium v2 attaché à la machine virtuelle ASCS" } }
    - { id: e, text: { en: "An Ultra Disk attached to each cluster node", fr: "Un disque Ultra attaché à chaque nœud du cluster" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Microsoft recommends both Azure NetApp Files and Azure Files SSD (NFS on Linux) for /sapmnt and the global transport directory in highly available SAP systems. Both are managed services that several VMs mount at the same time, so no NFS cluster VMs are needed.
    fr: Microsoft recommande à la fois Azure NetApp Files et Azure Files SSD (NFS sous Linux) pour /sapmnt et le répertoire de transport global dans les systèmes SAP hautement disponibles. Ce sont deux services managés que plusieurs machines virtuelles montent simultanément ; aucune machine virtuelle de cluster NFS n'est donc nécessaire.
  options:
    b: { en: "Blob Storage NFS 3.0 isn't one of the storage types listed for SAP shared file systems.", fr: "NFS 3.0 sur le Stockage Blob ne fait pas partie des types de stockage indiqués pour les systèmes de fichiers partagés SAP." }
    d: { en: "A data disk is attached to a single VM, so the other VMs can't mount it without an NFS server.", fr: "Un disque de données est attaché à une seule machine virtuelle : les autres ne peuvent pas le monter sans serveur NFS." }
    e: { en: "Separate disks on each node aren't shared storage, and Ultra Disks don't support availability sets.", fr: "Des disques distincts sur chaque nœud ne constituent pas un stockage partagé, et les disques Ultra ne prennent pas en charge les groupes à haute disponibilité." }
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
