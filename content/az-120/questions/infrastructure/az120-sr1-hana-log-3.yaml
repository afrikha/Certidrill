id: az120-sr1-hana-log-3
objective: "2.3.6"
type: series_yesno
series: az120-sr1-hana-log
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: |-
    You enable Write Accelerator on the /hana/log disks.
  fr: |-
    Vous activez l'Accélérateur d'écriture sur les disques de /hana/log.
body:
  solution:
    en: |-
      You shut down HDB1, enable **Write Accelerator** on each of the three **/hana/log** disks while keeping their host caching set to None, and start HDB1.
    fr: |-
      Vous arrêtez HDB1, activez l'**Accélérateur d'écriture** sur chacun des trois disques de **/hana/log** en conservant leur mise en cache de l'hôte sur None, puis démarrez HDB1.
answer: { value: true }
explanation:
  correct:
    en: |-
      With Premium SSD on M-series VMs, Write Accelerator on /hana/log is mandatory to meet the SAP HANA KPIs, and the log disks use the None + Write Accelerator setting. A Standard_M96ds_2_v3 VM supports up to eight Write Accelerator disks, so three log disks are within the limit; the disks of a striped volume are enabled one by one while the VM is shut down.
    fr: |-
      Avec des SSD Premium sur des machines virtuelles de la série M, l'Accélérateur d'écriture sur /hana/log est obligatoire pour respecter les KPI SAP HANA, et les disques de journaux utilisent le paramètre None + Write Accelerator. Une machine virtuelle Standard_M96ds_2_v3 prend en charge jusqu'à huit disques avec Accélérateur d'écriture : trois disques de journaux restent dans la limite ; les disques d'un volume entrelacé sont activés un par un pendant que la machine virtuelle est arrêtée.
references:
  - title: Enable Write Accelerator
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/how-to-enable-write-accelerator
  - title: SAP HANA Azure virtual machine Premium SSD storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-premium-ssd-v1
