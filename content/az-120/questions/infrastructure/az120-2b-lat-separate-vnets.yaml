id: az120-2b-lat-separate-vnets
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware is designing the network for a new SAP ERP system in a single Azure region. The infrastructure team proposes two virtual networks: **vnet-erp-app** for the application servers and **vnet-erp-db** for the database VMs, connected by virtual network peering, so that each team manages its own network.

    The design must:

    - be supported for SAP;
    - minimize the network latency and the data transfer costs between the application layer and the database layer;
    - allow different network security rules for each layer.

    What should you recommend?
  fr: |
    Litware conçoit le réseau d'un nouveau système SAP ERP dans une seule région Azure. L'équipe d'infrastructure propose deux réseaux virtuels : **vnet-erp-app** pour les serveurs d'applications et **vnet-erp-db** pour les machines virtuelles de base de données, reliés par peering de réseaux virtuels, pour que chaque équipe gère son propre réseau.

    La conception doit :

    - être prise en charge pour SAP ;
    - réduire au minimum la latence réseau et les coûts de transfert de données entre la couche Application et la couche Base de données ;
    - permettre des règles de sécurité réseau différentes pour chaque couche.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Keep the two virtual networks and replace the peering with a VNet-to-VNet VPN connection.", fr: "Conserver les deux réseaux virtuels et remplacer le peering par une connexion VPN de réseau virtuel à réseau virtuel." }
    - id: b
      text: { en: "Keep the two virtual networks and the peering, and add network security groups in each network.", fr: "Conserver les deux réseaux virtuels et le peering, et ajouter des groupes de sécurité réseau dans chaque réseau." }
    - id: c
      text: { en: "Use one virtual network with separate subnets for the application and database VMs, each with its own NSG.", fr: "Utiliser un seul réseau virtuel avec des sous-réseaux distincts pour les machines virtuelles d'application et de base de données, chacun avec son propre NSG." }
    - id: d
      text: { en: "Keep the two virtual networks and route the traffic between them through an NVA in a hub virtual network.", fr: "Conserver les deux réseaux virtuels et router le trafic entre eux via une NVA dans un réseau virtuel hub." }
answer: { optionId: c }
explanation:
  correct:
    en: "Microsoft recommends separating the SAP application layer and the DBMS layer with subnets of the same virtual network; separating them into different virtual networks isn't supported. Peered traffic is charged, and the many terabytes exchanged every day between the two layers can incur substantial costs. NSGs on each subnet give each layer its own rules."
    fr: "Microsoft recommande de séparer la couche Application SAP et la couche SGBD avec des sous-réseaux du même réseau virtuel ; les séparer dans des réseaux virtuels différents n'est pas pris en charge. Le trafic de peering est facturé, et les nombreux téraoctets échangés chaque jour entre les deux couches peuvent entraîner des coûts importants. Les NSG de chaque sous-réseau donnent à chaque couche ses propres règles."
  options:
    a:
      en: "A VPN adds gateways and encryption overhead in the app-to-database path and keeps an unsupported split."
      fr: "Un VPN ajoute des passerelles et le coût du chiffrement sur le chemin application-base de données, et conserve une séparation non prise en charge."
    b:
      en: "Separate virtual networks for the two layers aren't supported, and peering adds data transfer charges."
      fr: "Des réseaux virtuels distincts pour les deux couches ne sont pas pris en charge, et le peering ajoute des frais de transfert de données."
    d:
      en: "An NVA in the path between the application and DBMS layers isn't supported."
      fr: "Une NVA sur le chemin entre la couche Application et la couche SGBD n'est pas prise en charge."
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
