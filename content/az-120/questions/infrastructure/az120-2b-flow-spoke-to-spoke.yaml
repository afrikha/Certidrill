id: az120-2b-flow-spoke-to-spoke
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam uses a hub-spoke topology. The hub virtual network contains Azure Firewall with the private IP address **10.0.1.4**. The spoke **vnet-sap** (10.20.0.0/16) hosts SAP S/4HANA, and the spoke **vnet-bi** (10.30.0.0/16) hosts a reporting application that must call the SAP application servers. Both spokes are peered with the hub only, and all the peerings allow forwarded traffic.

    You need the reporting application to reach the SAP application servers, and the traffic between the spokes must be inspected by the firewall.

    What should you do?
  fr: |
    Fabrikam utilise une topologie hub-and-spoke. Le réseau virtuel hub contient le Pare-feu Azure, d'adresse IP privée **10.0.1.4**. Le spoke **vnet-sap** (10.20.0.0/16) héberge SAP S/4HANA, et le spoke **vnet-bi** (10.30.0.0/16) héberge une application de reporting qui doit appeler les serveurs d'applications SAP. Les deux spokes sont reliés par peering au hub uniquement, et tous les peerings autorisent le trafic transféré.

    L'application de reporting doit joindre les serveurs d'applications SAP, et le trafic entre les spokes doit être inspecté par le pare-feu.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a virtual network peering between vnet-sap and vnet-bi.", fr: "Créer un peering de réseaux virtuels entre vnet-sap et vnet-bi." }
    - id: b
      text: { en: "Enable gateway transit on the hub side of both peerings.", fr: "Activer le transit par passerelle côté hub sur les deux peerings." }
    - id: c
      text: { en: "Add a user-defined route in each spoke for the other spoke's address space, with next hop Virtual appliance 10.0.1.4.", fr: "Ajouter dans chaque spoke un itinéraire défini par l'utilisateur vers l'espace d'adressage de l'autre spoke, avec le tronçon suivant Appliance virtuelle 10.0.1.4." }
    - id: d
      text: { en: "Add a user-defined route in vnet-bi only, for 10.20.0.0/16 with next hop Virtual network.", fr: "Ajouter un itinéraire défini par l'utilisateur dans vnet-bi uniquement, pour 10.20.0.0/16 avec le tronçon suivant Réseau virtuel." }
answer: { optionId: c }
explanation:
  correct:
    en: "Peering isn't transitive, so the spokes can't reach each other through the hub on their own. User-defined routes in both spokes that send the other spoke's prefix to the firewall create a symmetric path through Azure Firewall, which inspects and forwards the traffic. The SAP application-to-database path inside vnet-sap stays direct."
    fr: "Le peering n'est pas transitif : les spokes ne peuvent pas se joindre seuls via le hub. Des itinéraires définis par l'utilisateur dans les deux spokes, qui envoient le préfixe de l'autre spoke vers le pare-feu, créent un chemin symétrique par le Pare-feu Azure, qui inspecte et relaie le trafic. Le chemin entre application et base de données SAP à l'intérieur de vnet-sap reste direct."
  options:
    a:
      en: "Direct spoke-to-spoke peering works but bypasses the firewall, so the traffic isn't inspected."
      fr: "Un peering direct entre spokes fonctionne mais contourne le pare-feu : le trafic n'est pas inspecté."
    b:
      en: "Gateway transit shares a VPN or ExpressRoute gateway; it doesn't route traffic between spokes through the firewall."
      fr: "Le transit par passerelle partage une passerelle VPN ou ExpressRoute ; il ne route pas le trafic entre spokes via le pare-feu."
    d:
      en: "The Virtual network next hop only targets the local virtual network, and a one-sided route would make the return path asymmetric."
      fr: "Le tronçon Réseau virtuel ne cible que le réseau virtuel local, et un itinéraire d'un seul côté rendrait le chemin de retour asymétrique."
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
  - title: Azure Virtual Network Peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
