id: az120-2a-ext-statements
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip runs SAP NetWeaver on Azure VMs that have the standard version of the Azure VM extension for SAP solutions. The team plans to move several VMs to the new version of the extension.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip exécute SAP NetWeaver sur des machines virtuelles Azure qui ont la version standard de l'extension de machine virtuelle Azure pour les solutions SAP. L'équipe prévoit de faire passer plusieurs machines virtuelles à la nouvelle version de l'extension.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The team can keep the standard version installed on a VM while it installs the new version, to compare the data of both versions.
        fr: |
          L'équipe peut conserver la version standard installée sur une machine virtuelle pendant qu'elle installe la nouvelle version, afin de comparer les données des deux versions.
    - id: s2
      text:
        en: |
          The VMs that run the new version need outbound access to management.azure.com.
        fr: |
          Les machines virtuelles qui exécutent la nouvelle version ont besoin d'un accès sortant à management.azure.com.
    - id: s3
      text:
        en: |
          After the extension is installed, SAP Host Agent must be restarted before it detects the extension.
        fr: |
          Après l'installation de l'extension, SAP Host Agent doit être redémarré avant de détecter l'extension.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Installing both versions on the same VM is not supported: uninstall the standard version before you install the new one. The new version requires outbound internet access to management.azure.com (a proxy can be configured). SAP Host Agent does not detect the extension until it is restarted.
    fr: |
      L'installation des deux versions sur la même machine virtuelle n'est pas prise en charge : désinstallez la version standard avant d'installer la nouvelle. La nouvelle version exige un accès Internet sortant à management.azure.com (un proxy peut être configuré). SAP Host Agent ne détecte l'extension qu'après son redémarrage.
references:
  - title: New version of Azure VM extension for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap-new
  - title: Implement the Azure VM extension for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap
