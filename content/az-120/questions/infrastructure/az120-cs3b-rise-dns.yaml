id: az120-cs3b-rise-dns
objective: "2.2.8"
type: single
caseStudy: az120-cs3b-humongous-insurance
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a solution for the zone ecs.humongousinsurance.example that meets the name resolution requirement. What should you recommend?
  fr: |
    Vous devez recommander une solution pour la zone ecs.humongousinsurance.example qui respecte l'exigence de résolution de noms. Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Create an Azure private DNS zone for the RISE zone and configure it to receive zone transfers from the SAP DNS servers", fr: "Créer une zone DNS privée Azure pour la zone RISE et la configurer pour recevoir des transferts de zone depuis les serveurs DNS de SAP" } }
    - { id: b, text: { en: "Add a rule to the forwarding ruleset of the DNS Private Resolver that sends queries for the RISE zone to the SAP DNS servers", fr: "Ajouter au jeu de règles de transfert du résolveur privé DNS une règle qui envoie les requêtes de la zone RISE vers les serveurs DNS de SAP" } }
    - { id: c, text: { en: "Deploy DNS server VMs in VNet-Hub that host a secondary copy of the RISE zone by zone transfer from the SAP DNS servers", fr: "Déployer dans VNet-Hub des machines virtuelles de serveur DNS qui hébergent une copie secondaire de la zone RISE par transfert de zone depuis les serveurs DNS de SAP" } }
    - { id: d, text: { en: "Create a public Azure DNS zone for humongousinsurance.example and delegate the RISE subdomain to the SAP DNS servers", fr: "Créer une zone Azure DNS publique pour humongousinsurance.example et déléguer le sous-domaine RISE aux serveurs DNS de SAP" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With RISE, SAP's DNS servers hold the primary role for the delegated zone, and DNS zone transfer to the customer's DNS servers is the primary method to replicate the records. Azure-provided DNS and Azure private DNS zones don't support zone transfers, so Humongous Insurance needs DNS servers of its own, for example on VMs in VNet-Hub, that hold a secondary copy of the zone; the resolver and the on-premises servers can then forward the zone to them.
    fr: |
      Avec RISE, les serveurs DNS de SAP détiennent le rôle principal pour la zone déléguée, et le transfert de zone DNS vers les serveurs DNS du client est la méthode principale pour répliquer les enregistrements. Le DNS fourni par Azure et les zones DNS privées Azure ne prennent pas en charge les transferts de zone : Humongous Insurance a donc besoin de ses propres serveurs DNS, par exemple sur des machines virtuelles dans VNet-Hub, qui détiennent une copie secondaire de la zone ; le résolveur et les serveurs locaux peuvent ensuite leur transférer la zone.
  options:
    a:
      en: |
        Azure private DNS zones can't accept zone transfers, so they can't receive the replicated RISE records.
      fr: |
        Les zones DNS privées Azure ne peuvent pas accepter de transferts de zone : elles ne peuvent pas recevoir les enregistrements RISE répliqués.
    b:
      en: |
        Forwarding resolves the names only while the SAP DNS servers answer; the records aren't replicated, so resolution stops if those servers are unreachable.
      fr: |
        Le transfert conditionnel ne résout les noms que tant que les serveurs DNS de SAP répondent ; les enregistrements ne sont pas répliqués, donc la résolution s'arrête si ces serveurs sont injoignables.
    d:
      en: |
        The RISE zone uses private addresses and must not be published on the internet; a public delegation also doesn't replicate any record to Humongous servers.
      fr: |
        La zone RISE utilise des adresses privées et ne doit pas être publiée sur Internet ; une délégation publique ne réplique d'ailleurs aucun enregistrement vers les serveurs de Humongous.
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
