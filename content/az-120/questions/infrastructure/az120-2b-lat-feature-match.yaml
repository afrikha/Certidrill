id: az120-2b-lat-feature-match
objective: "2.2.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has the following latency requirements for its SAP workloads on Azure.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam a les exigences de latence suivantes pour ses charges de travail SAP sur Azure.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ppg, text: { en: "Proximity placement group", fr: "Groupe de placement de proximité" } }
    - { id: fss, text: { en: "Flexible scale set with FD=1", fr: "Groupe identique flexible avec FD=1" } }
    - { id: an, text: Accelerated Networking }
    - { id: fp, text: ExpressRoute FastPath }
    - { id: gpeer, text: { en: "Global virtual network peering", fr: "Peering de réseaux virtuels mondial" } }
  targets:
    - id: t1
      text: { en: "Place the ASCS VM and the application servers under one datacenter network spine because latency inside the zone is too high", fr: "Placer la machine virtuelle ASCS et les serveurs d'applications sous une même colonne vertébrale réseau de centre de données, car la latence dans la zone est trop élevée" }
    - id: t2
      text: { en: "Spread SAP VMs across zones with best-effort fault domain distribution and keep the freedom to resize them", fr: "Répartir les machines virtuelles SAP sur les zones avec une distribution au mieux sur les domaines d'erreur, tout en gardant la liberté de les redimensionner" }
    - id: t3
      text: { en: "Reduce latency and jitter in each VM by bypassing the host virtual switch", fr: "Réduire la latence et la gigue dans chaque machine virtuelle en contournant le commutateur virtuel de l'hôte" }
    - id: t4
      text: { en: "Reduce latency for on-premises users by sending traffic directly to the VMs instead of through the ExpressRoute gateway", fr: "Réduire la latence pour les utilisateurs locaux en envoyant le trafic directement aux machines virtuelles plutôt que par la passerelle ExpressRoute" }
answer:
  mapping: { t1: ppg, t2: fss, t3: an, t4: fp }
explanation:
  correct:
    en: "A proximity placement group colocates VMs under one spine when zonal latency isn't enough. A flexible scale set with FD=1 spreads VMs across zones and fault domains without the resizing limits of a PPG. Accelerated Networking uses SR-IOV to bypass the host virtual switch. FastPath sends on-premises traffic directly to the VMs, bypassing the ExpressRoute gateway in the data path. Global peering connects regions; it doesn't reduce latency."
    fr: "Un groupe de placement de proximité colocalise les machines virtuelles sous une même colonne vertébrale réseau quand la latence zonale ne suffit pas. Un groupe identique flexible avec FD=1 répartit les machines virtuelles sur les zones et les domaines d'erreur sans les limites de redimensionnement d'un PPG. Accelerated Networking utilise SR-IOV pour contourner le commutateur virtuel de l'hôte. FastPath envoie le trafic local directement aux machines virtuelles, sans passer par la passerelle ExpressRoute dans le chemin des données. Le peering mondial relie des régions ; il ne réduit pas la latence."
references:
  - title: Configuration options to minimize network latency with SAP applications
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/proximity-placement-scenarios
  - title: "Azure ExpressRoute FastPath: Features, availability, and limitations"
    url: https://learn.microsoft.com/en-us/azure/expressroute/about-fastpath
