id: az120-2b-er-gateway-transit
objective: "2.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware connects its datacenter to Azure with an ExpressRoute circuit linked to an ExpressRoute gateway in the hub virtual network **vnet-hub**. The new SAP spoke virtual network **vnet-sap** has no gateway and is peered with vnet-hub with the default peering settings.

    The SAP VMs can reach the VMs in vnet-hub but not the on-premises networks.

    You need the SAP VMs to reach the on-premises networks through the existing ExpressRoute gateway.

    How should you configure the peerings?
  fr: |
    Proseware relie son centre de données à Azure par un circuit ExpressRoute connecté à une passerelle ExpressRoute du réseau virtuel hub **vnet-hub**. Le nouveau réseau virtuel spoke SAP **vnet-sap** n'a pas de passerelle et est relié par peering à vnet-hub avec les paramètres de peering par défaut.

    Les machines virtuelles SAP peuvent joindre les machines virtuelles de vnet-hub, mais pas les réseaux locaux.

    Les machines virtuelles SAP doivent joindre les réseaux locaux par la passerelle ExpressRoute existante.

    Comment devez-vous configurer les peerings ?
body:
  options:
    - id: a
      text: { en: "On the vnet-hub peering, allow gateway transit; on the vnet-sap peering, use remote gateways.", fr: "Sur le peering de vnet-hub, autoriser le transit par passerelle ; sur le peering de vnet-sap, utiliser des passerelles distantes." }
    - id: b
      text: { en: "On the vnet-sap peering, allow gateway transit; on the vnet-hub peering, use remote gateways.", fr: "Sur le peering de vnet-sap, autoriser le transit par passerelle ; sur le peering de vnet-hub, utiliser des passerelles distantes." }
    - id: c
      text: { en: "On both peerings, allow forwarded traffic, and keep the gateway settings unchanged.", fr: "Sur les deux peerings, autoriser le trafic transféré, sans modifier les paramètres de passerelle." }
    - id: d
      text: { en: "On both peerings, allow gateway transit and use remote gateways.", fr: "Sur les deux peerings, autoriser le transit par passerelle et utiliser des passerelles distantes." }
answer: { optionId: a }
explanation:
  correct:
    en: "Gateway transit lets a virtual network use the VPN or ExpressRoute gateway of a peered virtual network. The virtual network that owns the gateway (vnet-hub) allows gateway transit, and the spoke (vnet-sap) uses the remote gateway; a virtual network that uses a remote gateway can't have its own gateway."
    fr: "Le transit par passerelle permet à un réseau virtuel d'utiliser la passerelle VPN ou ExpressRoute d'un réseau virtuel relié par peering. Le réseau virtuel propriétaire de la passerelle (vnet-hub) autorise le transit par passerelle, et le spoke (vnet-sap) utilise la passerelle distante ; un réseau virtuel qui utilise une passerelle distante ne peut pas avoir sa propre passerelle."
  options:
    b:
      en: "The settings are reversed: vnet-sap has no gateway to share."
      fr: "Les paramètres sont inversés : vnet-sap n'a pas de passerelle à partager."
    c:
      en: "Allowing forwarded traffic doesn't make the gateway's on-premises routes available to the spoke."
      fr: "Autoriser le trafic transféré ne rend pas les itinéraires locaux de la passerelle disponibles pour le spoke."
    d:
      en: "Each side has one role; vnet-hub can't use a remote gateway because it has its own."
      fr: "Chaque côté a un seul rôle ; vnet-hub ne peut pas utiliser de passerelle distante, car il possède la sienne."
references:
  - title: Azure Virtual Network Peering
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
