id: az120-2c-encryption-facts
objective: "2.3.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso is defining the encryption standard for its SAP landscape on Azure. The landscape includes SAP HANA on Premium SSD v2 disks, SAP on SQL Server, and application servers on Premium SSD disks.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso définit la norme de chiffrement de son paysage SAP sur Azure. Le paysage comprend SAP HANA sur des disques SSD Premium v2, SAP sur SQL Server et des serveurs d'applications sur des disques SSD Premium.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Azure Disk Encryption isn't supported for SAP systems.", fr: "Azure Disk Encryption n'est pas pris en charge pour les systèmes SAP." } }
    - { id: b, text: { en: "SAP HANA can store its database encryption keys in Azure Key Vault.", fr: "SAP HANA peut stocker les clés de chiffrement de sa base de données dans Azure Key Vault." } }
    - { id: c, text: { en: "Double encryption at rest can be enabled on the Premium SSD v2 disks.", fr: "Le double chiffrement au repos peut être activé sur les disques SSD Premium v2." } }
    - { id: d, text: { en: "SQL Server TDE can use Azure Key Vault to store its TDE keys.", fr: "Le TDE de SQL Server peut utiliser Azure Key Vault pour stocker ses clés TDE." } }
    - { id: e, text: { en: "Encryption at host can be enabled on a VM that previously used Azure Disk Encryption.", fr: "Le chiffrement sur l'hôte peut être activé sur une machine virtuelle qui a utilisé Azure Disk Encryption." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Microsoft states that Azure Disk Encryption isn't supported for SAP systems; encryption at host is the usual choice. SQL Server TDE is fully integrated with Azure Key Vault through the SQL Server connector, and SAP supports TDE.
    fr: |
      Microsoft indique qu'Azure Disk Encryption n'est pas pris en charge pour les systèmes SAP ; le chiffrement sur l'hôte est le choix habituel. Le TDE de SQL Server est entièrement intégré à Azure Key Vault au moyen du connecteur SQL Server, et SAP prend en charge le TDE.
  options:
    b: { en: "SAP HANA doesn't support storing its keys in Azure Key Vault or any other HSM device.", fr: "SAP HANA ne prend pas en charge le stockage de ses clés dans Azure Key Vault ni dans aucun autre appareil HSM." }
    c: { en: "Double encryption at rest isn't supported with Ultra Disks or Premium SSD v2 disks.", fr: "Le double chiffrement au repos n'est pas pris en charge avec les disques Ultra ni avec les disques SSD Premium v2." }
    e: { en: "Encryption at host can't be enabled on VMs that currently have or ever had Azure Disk Encryption enabled.", fr: "Le chiffrement sur l'hôte ne peut pas être activé sur les machines virtuelles sur lesquelles Azure Disk Encryption est ou a été activé." }
references:
  - title: Secure Azure Infrastructure for SAP Applications
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-security-infrastructure
  - title: Server-side encryption of Azure managed disks
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption
