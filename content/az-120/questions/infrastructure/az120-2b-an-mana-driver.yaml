id: az120-2b-an-mana-driver
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware runs SAP NetWeaver application servers on Azure VMs deployed from a custom Linux image that was built three years ago. Accelerated Networking is enabled on all the NICs.

    After a planned stop (deallocate) and restart, one VM shows lower network throughput than the throughput specified for its size. The Azure portal still shows Accelerated Networking as enabled. In the guest, `ethtool -S eth0` shows no VF traffic, and the host now uses the Microsoft Azure Network Adapter (MANA).

    You need to restore the expected network performance on this VM and on any VM that is restarted on similar hosts in the future.

    What should you do?
  fr: |
    Litware exécute des serveurs d'applications SAP NetWeaver sur des machines virtuelles Azure déployées à partir d'une image Linux personnalisée créée il y a trois ans. Accelerated Networking est activé sur toutes les cartes réseau.

    Après un arrêt planifié (libération) suivi d'un redémarrage, une machine virtuelle affiche un débit réseau inférieur à celui spécifié pour sa taille. Le portail Azure indique toujours qu'Accelerated Networking est activé. Dans l'invité, `ethtool -S eth0` n'indique aucun trafic VF, et l'hôte utilise désormais Microsoft Azure Network Adapter (MANA).

    Vous devez rétablir les performances réseau attendues sur cette machine virtuelle et sur toute machine virtuelle redémarrée à l'avenir sur des hôtes similaires.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Disable and then re-enable Accelerated Networking on the NIC of each affected VM.", fr: "Désactiver puis réactiver Accelerated Networking sur la carte réseau de chaque machine virtuelle concernée." }
    - id: b
      text: { en: "Update the image and kernel so that the guest includes the MANA driver as well as the mlx4 and mlx5 drivers.", fr: "Mettre à jour l'image et le noyau pour que l'invité contienne le pilote MANA ainsi que les pilotes mlx4 et mlx5." }
    - id: c
      text: { en: "Resize the VMs to a size that has twice as many vCPUs.", fr: "Redimensionner les machines virtuelles vers une taille disposant de deux fois plus de processeurs virtuels." }
    - id: d
      text: { en: "Add a second NIC with Accelerated Networking to each VM and bond the two NICs in the guest.", fr: "Ajouter à chaque machine virtuelle une deuxième carte réseau avec Accelerated Networking et agréger les deux cartes dans l'invité." }
answer: { optionId: b }
explanation:
  correct:
    en: "You can't choose the NIC hardware of the host, and a VM that is deallocated and restarted can land on hardware with a different NIC model. When the image lacks the driver for the host NIC, networking falls back to the synthetic interface while the platform still reports Accelerated Networking as enabled. Images must include the drivers for all supported NIC types (mlx4, mlx5 and MANA) to get the performance specified for the VM size."
    fr: "Vous ne pouvez pas choisir le matériel réseau de l'hôte, et une machine virtuelle libérée puis redémarrée peut se retrouver sur un matériel doté d'un autre modèle de carte réseau. Quand l'image n'a pas le pilote de la carte de l'hôte, le réseau repasse par l'interface synthétique alors que la plateforme indique toujours Accelerated Networking comme activé. Les images doivent contenir les pilotes de tous les types de cartes pris en charge (mlx4, mlx5 et MANA) pour obtenir les performances prévues pour la taille de la machine virtuelle."
  options:
    a:
      en: "The setting is already enabled; toggling it doesn't add the missing driver to the guest."
      fr: "Le paramètre est déjà activé ; le basculer n'ajoute pas le pilote manquant dans l'invité."
    c:
      en: "The problem is the missing guest driver, not the VM size, and a bigger size doesn't guarantee a host with a Mellanox NIC."
      fr: "Le problème vient du pilote manquant dans l'invité, pas de la taille, et une taille supérieure ne garantit pas un hôte doté d'une carte Mellanox."
    d:
      en: "Additional NICs share the VM's bandwidth and would face the same missing-driver problem."
      fr: "Les cartes réseau supplémentaires partagent la bande passante de la machine virtuelle et rencontreraient le même problème de pilote manquant."
references:
  - title: How Accelerated Networking works in Linux and FreeBSD VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-network/accelerated-networking-how-it-works
  - title: Microsoft Azure Network Adapter (MANA) overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/accelerated-networking-mana-overview
