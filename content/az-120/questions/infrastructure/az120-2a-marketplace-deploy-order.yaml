id: az120-2a-marketplace-deploy-order
objective: "2.1.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You are deploying an SAP NetWeaver application server on Azure from an Azure Marketplace image of SUSE Linux Enterprise Server for SAP Applications. The VNet reaches the internet only through an on-premises proxy over ExpressRoute.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous déployez un serveur d'applications SAP NetWeaver sur Azure à partir d'une image de la Place de marché Azure SUSE Linux Enterprise Server for SAP Applications. Le réseau virtuel n'accède à Internet que par un proxy local via ExpressRoute.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: create, text: { en: "Create the VM from the Marketplace image with a VM size listed in SAP Note 1928533.", fr: "Créer la machine virtuelle à partir de l'image de la Place de marché avec une taille listée dans la note SAP 1928533." } }
    - { id: proxy, text: { en: "Configure the proxy settings of the Azure VM Agent.", fr: "Configurer les paramètres de proxy de l'agent de machine virtuelle Azure." } }
    - { id: ext, text: { en: "Install the Azure VM extension for SAP solutions.", fr: "Installer l'extension de machine virtuelle Azure pour les solutions SAP." } }
    - { id: sap, text: { en: "Install the SAP software.", fr: "Installer les logiciels SAP." } }
    - { id: agent, text: { en: "Install the Azure Linux VM Agent manually on the OS disk.", fr: "Installer manuellement l'agent de machine virtuelle Linux Azure sur le disque du système d'exploitation." } }
    - { id: deprov, text: { en: "Run sudo waagent -deprovision+user on the VM.", fr: "Exécuter sudo waagent -deprovision+user sur la machine virtuelle." } }
answer:
  sequence: [ create, proxy, ext, sap ]
explanation:
  correct:
    en: |
      For a Marketplace deployment, you create the VM with a supported size, configure the proxy so the VM Agent can reach the internet, deploy the Azure VM extension for SAP solutions, and then install SAP with the same procedures as on-premises. The VM Agent is installed automatically on Marketplace images.
    fr: |
      Pour un déploiement depuis la Place de marché, vous créez la machine virtuelle avec une taille prise en charge, configurez le proxy pour que l'agent de machine virtuelle puisse joindre Internet, déployez l'extension de machine virtuelle Azure pour les solutions SAP, puis installez SAP avec les mêmes procédures que localement. L'agent de machine virtuelle est installé automatiquement sur les images de la Place de marché.
  options:
    agent:
      en: |
        Manual installation of the VM Agent is needed for an uploaded non-generalized disk, not for a Marketplace image.
      fr: |
        L'installation manuelle de l'agent de machine virtuelle est nécessaire pour un disque non généralisé chargé, pas pour une image de la Place de marché.
    deprov:
      en: |
        Deprovisioning generalizes a VM to capture an image; it would make this VM unusable as a server.
      fr: |
        La déprovision généralise une machine virtuelle pour capturer une image ; elle rendrait cette machine virtuelle inutilisable comme serveur.
references:
  - title: Azure Virtual Machines deployment for SAP NetWeaver
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/deployment-guide
