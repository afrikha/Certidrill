id: az120-2c-hana-snapshot-backup
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs a 6 TB SAP HANA 2.0 SPS 07 database on an Azure virtual machine that runs SUSE Linux Enterprise Server for SAP 15 SP5. The HANA volumes use Premium SSD managed disks with XFS file systems.

    You need to recommend a backup solution that meets the following requirements:

    - Restore the database from a recent backup in minutes, without copying the data back from a vault.
    - Support point-in-time recovery.
    - Produce HANA-consistent backups without any backup server to deploy or manage.

    What should you recommend?
  fr: |
    Proseware exécute une base de données SAP HANA 2.0 SPS 07 de 6 To sur une machine virtuelle Azure qui exécute SUSE Linux Enterprise Server for SAP 15 SP5. Les volumes HANA utilisent des disques managés SSD Premium avec des systèmes de fichiers XFS.

    Vous devez recommander une solution de sauvegarde qui répond aux exigences suivantes :

    - Restaurer la base de données à partir d'une sauvegarde récente en quelques minutes, sans recopier les données depuis un coffre.
    - Prendre en charge la récupération jusqu'à une date et heure.
    - Produire des sauvegardes cohérentes pour HANA sans serveur de sauvegarde à déployer ni à gérer.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Azure Site Recovery replication of the HANA VM to a secondary region", fr: "La réplication de la machine virtuelle HANA vers une région secondaire avec Azure Site Recovery" } }
    - { id: b, text: { en: "Azure VM backup of the HANA VM with an enhanced policy", fr: "La sauvegarde de machine virtuelle Azure de la machine virtuelle HANA avec une stratégie améliorée" } }
    - { id: c, text: { en: "Azure Backup HANA instance snapshots combined with Backint full and log backups", fr: "Les instantanés d'instance HANA de Sauvegarde Azure combinés à des sauvegardes complètes et de journaux Backint" } }
    - { id: d, text: { en: "Daily incremental snapshots of each managed disk created by an Azure Automation runbook", fr: "Des instantanés incrémentiels quotidiens de chaque disque managé créés par un runbook Azure Automation" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure Backup for SAP HANA offers HANA-consistent instance snapshots, integrated with Backint, which give instant backup and instant restore from managed disk snapshots kept in a resource group. The Backint streaming log backups are replayed over the snapshot for point-in-time recovery, and the service needs no backup infrastructure.
    fr: |
      Sauvegarde Azure pour SAP HANA propose des instantanés d'instance cohérents pour HANA, intégrés à Backint, qui offrent une sauvegarde et une restauration instantanées à partir d'instantanés de disques managés conservés dans un groupe de ressources. Les sauvegardes de journaux Backint en streaming sont rejouées sur l'instantané pour la récupération jusqu'à une date et heure, et le service ne nécessite aucune infrastructure de sauvegarde.
  options:
    a: { en: "Site Recovery is a disaster recovery replication service, not a database backup with point-in-time recovery; HANA uses native replication for DR.", fr: "Site Recovery est un service de réplication pour la reprise d'activité, pas une sauvegarde de base de données avec récupération jusqu'à une date et heure ; HANA utilise sa réplication native pour la reprise d'activité." }
    b: { en: "A VM backup isn't integrated with HANA log backups, so it can't provide HANA point-in-time recovery.", fr: "Une sauvegarde de machine virtuelle n'est pas intégrée aux sauvegardes de journaux HANA ; elle ne permet donc pas la récupération HANA jusqu'à une date et heure." }
    d: { en: "Disk snapshots taken without HANA coordination aren't HANA-consistent, and there are no log backups for point-in-time recovery.", fr: "Des instantanés de disques pris sans coordination avec HANA ne sont pas cohérents pour HANA, et aucune sauvegarde de journaux ne permet la récupération jusqu'à une date et heure." }
references:
  - title: About the SAP HANA database backup on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-about
  - title: Back up SAP HANA database instances on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-instances-backup
