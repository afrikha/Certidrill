id: az120-2a-image-vm-agent
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum builds a Red Hat Enterprise Linux image for SAP application servers on its on-premises Hyper-V hosts. The team generalizes the image, uploads the VHD to Azure and plans to deploy VMs with the SAP quickstart template for a user image, which takes the image in its user image parameter.

    You need to ensure that the template deployment succeeds.

    What must the uploaded image contain?
  fr: |
    Adatum crée une image Red Hat Enterprise Linux pour les serveurs d'applications SAP sur ses hôtes Hyper-V locaux. L'équipe généralise l'image, charge le disque dur virtuel dans Azure et prévoit de déployer des machines virtuelles avec le modèle de démarrage rapide SAP pour image utilisateur, qui reçoit l'image dans son paramètre d'image utilisateur.

    Vous devez vous assurer que le déploiement du modèle réussit.

    Que doit contenir l'image chargée ?
body:
  options:
    - { id: a, text: { en: "The Azure Linux VM Agent", fr: "L'agent de machine virtuelle Linux Azure" } }
    - { id: b, text: { en: "The SAP Host Agent", fr: "SAP Host Agent" } }
    - { id: c, text: { en: "The Azure VM extension for SAP solutions", fr: "L'extension de machine virtuelle Azure pour les solutions SAP" } }
    - { id: d, text: { en: "The Azure Monitor Agent", fr: "L'agent Azure Monitor" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For a custom image, the Azure Linux VM Agent must already be installed in the user image, otherwise the template deployment fails. On RHEL you install it with the WALinuxAgent package before you generalize the image.
    fr: |
      Pour une image personnalisée, l'agent de machine virtuelle Linux Azure doit déjà être installé dans l'image utilisateur, sinon le déploiement du modèle échoue. Sous RHEL, vous l'installez avec le package WALinuxAgent avant de généraliser l'image.
  options:
    c:
      en: |
        The VM extension for SAP is deployed after the VM exists, and it relies on the VM Agent being present.
      fr: |
        L'extension de machine virtuelle pour SAP se déploie une fois la machine virtuelle créée, et elle dépend de la présence de l'agent de machine virtuelle.
    b:
      en: |
        SAP Host Agent is needed by the SAP system, but its absence does not make the Azure template deployment fail.
      fr: |
        SAP Host Agent est nécessaire au système SAP, mais son absence ne fait pas échouer le déploiement du modèle Azure.
    d:
      en: |
        The Azure Monitor Agent collects monitoring data and is optional for the deployment.
      fr: |
        L'agent Azure Monitor collecte des données de supervision et il est facultatif pour le déploiement.
references:
  - title: Azure Virtual Machines deployment for SAP NetWeaver
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/deployment-guide
