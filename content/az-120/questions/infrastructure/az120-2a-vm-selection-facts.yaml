id: az120-2a-vm-selection-facts
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware is selecting Azure virtual machines for an SAP landscape that includes a production SAP HANA database, a non-production SAP HANA sandbox and several SAP application servers. The team plans to use Mv2-series VMs for the production database.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware choisit des machines virtuelles Azure pour un paysage SAP qui comprend une base de données SAP HANA de production, un bac à sable SAP HANA hors production et plusieurs serveurs d'applications SAP. L'équipe prévoit d'utiliser des machines virtuelles de la série Mv2 pour la base de données de production.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          For the non-production HANA sandbox, the team can use a VM type that is listed in SAP Note 1928533 even if it is not listed in the SAP HANA hardware directory.
        fr: |
          Pour le bac à sable HANA hors production, l'équipe peut utiliser un type de machine virtuelle listé dans la note SAP 1928533 même s'il ne figure pas dans le répertoire matériel SAP HANA.
    - id: s2
      text:
        en: |
          The team can deploy the Mv2-series VMs from a generation 1 operating system image.
        fr: |
          L'équipe peut déployer les machines virtuelles de la série Mv2 à partir d'une image de système d'exploitation de génération 1.
    - id: s3
      text:
        en: |
          If the generation of an SAP VM must change later, the team must deploy a new VM and reinstall the software, and can then reattach the data disks.
        fr: |
          Si la génération d'une machine virtuelle SAP doit changer plus tard, l'équipe doit déployer une nouvelle machine virtuelle et réinstaller les logiciels, puis peut rattacher les disques de données.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Production HANA requires a VM type from the SAP HANA hardware directory, while non-production HANA can use the wider list in SAP Note 1928533. Mv2-series VMs support only generation 2, and Microsoft recommends generation 2 for all SAP deployments. The image sets the generation and an existing VM cannot be converted, so you redeploy, reinstall and reattach data disks or NFS/SMB shares.
    fr: |
      HANA en production exige un type de machine virtuelle du répertoire matériel SAP HANA, tandis que HANA hors production peut utiliser la liste plus large de la note SAP 1928533. Les machines virtuelles de la série Mv2 ne prennent en charge que la génération 2, et Microsoft recommande la génération 2 pour tous les déploiements SAP. L'image détermine la génération et une machine virtuelle existante ne peut pas être convertie : vous la redéployez, réinstallez les logiciels et rattachez les disques de données ou les partages NFS/SMB.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
  - title: SAP HANA infrastructure configurations and operations on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations
