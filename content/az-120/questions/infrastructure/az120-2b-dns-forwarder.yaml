id: az120-2b-dns-forwarder
objective: "2.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso's SAP spoke virtual networks use two Windows Server DNS servers deployed as VMs in the hub virtual network. The private DNS zone **privatelink.file.core.windows.net**, which contains the private endpoint records of the SAP file shares, is linked to the hub virtual network.

    You need the hub DNS servers to resolve the Azure Files names to the private endpoint IP addresses.

    To which IP address should the hub DNS servers forward the queries they can't answer themselves?
  fr: |
    Les réseaux virtuels spoke SAP de Contoso utilisent deux serveurs DNS Windows Server déployés sous forme de machines virtuelles dans le réseau virtuel hub. La zone DNS privée **privatelink.file.core.windows.net**, qui contient les enregistrements des points de terminaison privés des partages de fichiers SAP, est liée au réseau virtuel hub.

    Les serveurs DNS du hub doivent résoudre les noms Azure Files en adresses IP des points de terminaison privés.

    Vers quelle adresse IP les serveurs DNS du hub doivent-ils transférer les requêtes auxquelles ils ne peuvent pas répondre eux-mêmes ?
body:
  options:
    - id: a
      text: 169.254.169.254
    - id: b
      text: 168.63.129.16
    - id: c
      text: { en: "The private IP address of the ExpressRoute gateway", fr: "L'adresse IP privée de la passerelle ExpressRoute" }
    - id: d
      text: { en: "The IP address of an on-premises DNS server", fr: "L'adresse IP d'un serveur DNS local" }
answer: { optionId: b }
explanation:
  correct:
    en: "A DNS forwarder in Azure, deployed in the virtual network linked to the private DNS zone, forwards queries to the Azure-provided DNS at 168.63.129.16, a static virtual IP address. Azure DNS answers from the private DNS zones linked to the virtual network where the query originates, here the hub."
    fr: "Un redirecteur DNS dans Azure, déployé dans le réseau virtuel lié à la zone DNS privée, transfère les requêtes au DNS fourni par Azure à l'adresse 168.63.129.16, une adresse IP virtuelle statique. Azure DNS répond à partir des zones DNS privées liées au réseau virtuel d'où provient la requête, ici le hub."
  options:
    a:
      en: "169.254.169.254 is the Instance Metadata Service endpoint, not a DNS resolver."
      fr: "169.254.169.254 est le point de terminaison du service de métadonnées d'instance, pas un résolveur DNS."
    c:
      en: "An ExpressRoute gateway routes traffic and exchanges BGP routes; it doesn't resolve DNS queries."
      fr: "Une passerelle ExpressRoute route le trafic et échange des itinéraires BGP ; elle ne résout pas les requêtes DNS."
    d:
      en: "On-premises DNS servers can't read the Azure private DNS zone linked to the hub."
      fr: "Les serveurs DNS locaux ne peuvent pas lire la zone DNS privée Azure liée au hub."
references:
  - title: Azure Private Endpoint DNS Integration Scenarios
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
  - title: Azure Virtual Network Name Resolution Guide
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-name-resolution-for-vms-and-role-instances
