id: az120-2a-ext-version-choice
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove deploys a new SAP HANA VM that runs SUSE Linux Enterprise Server for SAP Applications 15 SP5. The /hana/log volume uses Ultra Disk. The VM can reach `management.azure.com` through the corporate firewall.

    SAP support requires the Azure VM extension for SAP solutions on the VM. You plan to install it by using Azure PowerShell.

    What should you install?
  fr: |
    Woodgrove déploie une nouvelle machine virtuelle SAP HANA qui exécute SUSE Linux Enterprise Server for SAP Applications 15 SP5. Le volume /hana/log utilise un disque Ultra. La machine virtuelle peut joindre `management.azure.com` via le pare-feu de l'entreprise.

    Le support SAP exige l'extension de machine virtuelle Azure pour les solutions SAP sur la machine virtuelle. Vous prévoyez de l'installer avec Azure PowerShell.

    Que devez-vous installer ?
body:
  options:
    - { id: a, text: { en: "The standard version, by running Set-AzVMAEMExtension without extra switches", fr: "La version standard, en exécutant Set-AzVMAEMExtension sans commutateur supplémentaire" } }
    - { id: b, text: { en: "The new version, by running Set-AzVMAEMExtension with -InstallNewExtension", fr: "La nouvelle version, en exécutant Set-AzVMAEMExtension avec -InstallNewExtension" } }
    - { id: c, text: { en: "The Azure Monitor Agent, with a data collection rule for performance counters", fr: "L'agent Azure Monitor, avec une règle de collecte de données pour les compteurs de performances" } }
    - { id: d, text: { en: "An SAP HANA provider in Azure Monitor for SAP solutions", fr: "Un fournisseur SAP HANA dans Azure Monitor pour solutions SAP" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft says to choose the new version of the extension when you install it on SLES 15 or later, on RHEL or Oracle Linux 8.1 or later, or when the VM uses Ultra Disk or Standard managed disks. The new version needs outbound access to management.azure.com, which this VM has. The -InstallNewExtension switch of Set-AzVMAEMExtension installs it.
    fr: |
      Microsoft indique de choisir la nouvelle version de l'extension pour une installation sur SLES 15 ou ultérieur, sur RHEL ou Oracle Linux 8.1 ou ultérieur, ou lorsque la machine virtuelle utilise des disques Ultra ou des disques managés Standard. La nouvelle version a besoin d'un accès sortant à management.azure.com, dont dispose cette machine virtuelle. Le commutateur -InstallNewExtension de Set-AzVMAEMExtension l'installe.
  options:
    a:
      en: |
        The standard version is for installations where none of the new-version cases apply; SLES 15 and Ultra Disk are both new-version cases.
      fr: |
        La version standard concerne les installations où aucun cas de la nouvelle version ne s'applique ; SLES 15 et le disque Ultra sont tous deux des cas de la nouvelle version.
    c:
      en: |
        The Azure Monitor Agent sends data to Azure Monitor; it does not provide the Azure infrastructure data that SAP Host Agent reads and that SAP support requires.
      fr: |
        L'agent Azure Monitor envoie des données à Azure Monitor ; il ne fournit pas les données d'infrastructure Azure que lit SAP Host Agent et qu'exige le support SAP.
    d:
      en: |
        Azure Monitor for SAP solutions is an optional monitoring service; it does not replace the VM extension that SAP support requires.
      fr: |
        Azure Monitor pour solutions SAP est un service de supervision facultatif ; il ne remplace pas l'extension de machine virtuelle exigée par le support SAP.
references:
  - title: Implement the Azure VM extension for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap
  - title: New version of Azure VM extension for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap-new
