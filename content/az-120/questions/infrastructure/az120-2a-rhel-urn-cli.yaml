id: az120-2a-rhel-urn-cli
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You need to deploy an SAP HANA VM named **vmhanadb01** from the Azure Marketplace image of RHEL 8.4 for SAP with High Availability and Update Services. The VM must be a generation 2 VM, and it must use the most recent image version of that SKU.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez déployer une machine virtuelle SAP HANA nommée **vmhanadb01** à partir de l'image de la Place de marché Azure RHEL 8.4 for SAP with High Availability and Update Services. La machine virtuelle doit être de génération 2 et doit utiliser la version d'image la plus récente de cette référence SKU.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az vm create \
      --resource-group RG-SAP-HANA \
      --name vmhanadb01 \
      --size Standard_M64s_v2 \
      --image RedHat:[[offer]]:[[sku]]:latest \
      --admin-username azureadm \
      --generate-ssh-keys
  slots:
    - id: offer
      options:
        - { id: apps, text: RHEL-SAP-APPS }
        - { id: ha, text: RHEL-SAP-HA }
        - { id: rhel, text: RHEL }
    - id: sku
      options:
        - { id: lvm, text: 8-LVM }
        - { id: appsku, text: 84sapapps-gen2 }
        - { id: hasku, text: 84sapha-gen2 }
answer:
  values: { offer: ha, sku: hasku }
explanation:
  correct:
    en: |
      The image URN is Publisher:Offer:SKU:Version. RHEL for SAP with High Availability and Update Services is the RHEL-SAP-HA offer, and its RHEL 8 SKUs follow the pattern `8<minor>sapha-gen2`, so RHEL 8.4 generation 2 is 84sapha-gen2. The version `latest` selects the most recent image version.
    fr: |
      L'URN d'image a la forme Publisher:Offer:SKU:Version. RHEL for SAP with High Availability and Update Services correspond à l'offre RHEL-SAP-HA, dont les références SKU RHEL 8 suivent le modèle `8<mineure>sapha-gen2` : RHEL 8.4 en génération 2 donne 84sapha-gen2. La version `latest` sélectionne la version d'image la plus récente.
  options:
    apps:
      en: |
        RHEL-SAP-APPS is RHEL for SAP Applications, without the High Availability repositories.
      fr: |
        RHEL-SAP-APPS correspond à RHEL for SAP Applications, sans les référentiels High Availability.
    rhel:
      en: |
        The RHEL offer contains standard RHEL images without the SAP entitlements.
      fr: |
        L'offre RHEL contient des images RHEL standard sans les droits SAP.
    lvm:
      en: |
        8-LVM is a SKU of the standard RHEL offer, not an RHEL for SAP SKU.
      fr: |
        8-LVM est une référence SKU de l'offre RHEL standard, pas une référence SKU RHEL for SAP.
    appsku:
      en: |
        The sapapps SKUs belong to the RHEL-SAP-APPS offer.
      fr: |
        Les références SKU sapapps appartiennent à l'offre RHEL-SAP-APPS.
references:
  - title: Overview of Red Hat Enterprise Linux images in Azure - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/workloads/redhat/redhat-images
  - title: Deploy an S/4HANA infrastructure
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/deploy-s4hana
