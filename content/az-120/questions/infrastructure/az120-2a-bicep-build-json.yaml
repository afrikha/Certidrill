id: az120-2a-bicep-build-json
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware's SAP team describes its VMs in a Bicep file named **sap-vms.bicep**. The change advisory board of Proseware reviews infrastructure changes only as Azure Resource Manager (ARM) JSON templates.

    You need to produce an ARM JSON template from sap-vms.bicep.

    Which command should you use?
  fr: |
    L'équipe SAP de Proseware décrit ses machines virtuelles dans un fichier Bicep nommé **sap-vms.bicep**. Le comité consultatif des changements de Proseware n'examine les modifications d'infrastructure que sous forme de modèles ARM (Azure Resource Manager) JSON.

    Vous devez produire un modèle ARM JSON à partir de sap-vms.bicep.

    Quelle commande devez-vous utiliser ?
body:
  options:
    - { id: a, text: "az bicep decompile" }
    - { id: b, text: "az bicep format" }
    - { id: c, text: "az bicep build-params" }
    - { id: d, text: "az bicep build" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The build command converts a Bicep file to an ARM JSON template; you can write it to a chosen file with --outfile or to the console with --stdout.
    fr: |
      La commande build convertit un fichier Bicep en modèle ARM JSON ; vous pouvez l'écrire dans le fichier de votre choix avec --outfile ou dans la console avec --stdout.
  options:
    a:
      en: |
        decompile works in the opposite direction: it converts an ARM JSON template to a Bicep file.
      fr: |
        decompile fonctionne dans le sens inverse : il convertit un modèle ARM JSON en fichier Bicep.
    b:
      en: |
        format only applies the recommended style conventions to the Bicep file.
      fr: |
        format applique seulement les conventions de style recommandées au fichier Bicep.
    c:
      en: |
        build-params converts a .bicepparam parameters file to a JSON parameters file, not the template itself.
      fr: |
        build-params convertit un fichier de paramètres .bicepparam en fichier de paramètres JSON, pas le modèle lui-même.
references:
  - title: Bicep CLI commands - Azure Resource Manager
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/bicep-cli
