id: az120-2c-anf-log-size
objective: "2.3.8"
type: single
difficulty: 2
shuffle: false
status: draft
stem:
  en: |
    Fabrikam is deploying an SAP HANA system on Azure NetApp Files. The **/hana/log** volume will be created in a capacity pool that uses the Ultra service level and auto QoS.

    You need to size the /hana/log volume so that it meets the minimum write throughput that SAP requires for the HANA log. The solution must minimize the provisioned capacity.

    What size should you provision for the /hana/log volume?
  fr: |
    Fabrikam déploie un système SAP HANA sur Azure NetApp Files. Le volume **/hana/log** sera créé dans un pool de capacité qui utilise le niveau de service Ultra et la QoS automatique.

    Vous devez dimensionner le volume /hana/log pour qu'il atteigne le débit d'écriture minimal exigé par SAP pour le journal HANA. La solution doit réduire au minimum la capacité provisionnée.

    Quelle taille devez-vous provisionner pour le volume /hana/log ?
body:
  options:
    - { id: a, text: "1 TiB" }
    - { id: b, text: "2 TiB" }
    - { id: c, text: "4 TiB" }
    - { id: d, text: "6.3 TiB" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      SAP requires at least 250 MB/s of write throughput for /hana/log. With auto QoS, throughput is proportional to the volume quota, and the Ultra service level provides 128 MiB/s per TiB, so a 2 TiB volume gives 256 MiB/s.
    fr: |
      SAP exige au moins 250 Mo/s de débit d'écriture pour /hana/log. Avec la QoS automatique, le débit est proportionnel au quota du volume, et le niveau de service Ultra fournit 128 Mio/s par Tio : un volume de 2 Tio offre donc 256 Mio/s.
  options:
    a: { en: "1 TiB at the Ultra service level provides only 128 MiB/s.", fr: "1 Tio au niveau de service Ultra ne fournit que 128 Mio/s." }
    c: { en: "4 TiB is the minimum log size at the Premium service level; at Ultra it overprovisions capacity.", fr: "4 Tio est la taille minimale du journal au niveau de service Premium ; au niveau Ultra, cela surprovisionne la capacité." }
    d: { en: "6.3 TiB is the Premium sizing for the /hana/data read KPI, not for /hana/log at Ultra.", fr: "6,3 Tio correspond au dimensionnement Premium pour le KPI de lecture de /hana/data, pas à /hana/log au niveau Ultra." }
references:
  - title: SAP HANA Azure virtual machine ANF configuration
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-netapp
  - title: Service levels for Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-service-levels
