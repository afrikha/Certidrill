id: az120-2c-lvm-stripe-order
objective: "2.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    You attached four new P15 Premium SSD data disks, with host caching set to ReadOnly, to an SAP HANA virtual machine that runs SUSE Linux Enterprise Server for SAP.

    You need to create the **/hana/data** file system on a striped logical volume in a dedicated volume group, by using the stripe size that Microsoft recommends.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous avez attaché quatre nouveaux disques de données SSD Premium P15, avec la mise en cache de l'hôte réglée sur ReadOnly, à une machine virtuelle SAP HANA qui exécute SUSE Linux Enterprise Server for SAP.

    Vous devez créer le système de fichiers **/hana/data** sur un volume logique entrelacé dans un groupe de volumes dédié, avec la taille de bande recommandée par Microsoft.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: pv, text: { en: "Initialize the four disks as physical volumes by running `pvcreate`.", fr: "Initialiser les quatre disques comme volumes physiques en exécutant `pvcreate`." } }
    - { id: vg, text: { en: "Create the volume group `vg_hana_data` from the four physical volumes by running `vgcreate`.", fr: "Créer le groupe de volumes `vg_hana_data` à partir des quatre volumes physiques en exécutant `vgcreate`." } }
    - { id: lv, text: { en: "Create the logical volume by running `lvcreate` with `-i 4 -I 256`.", fr: "Créer le volume logique en exécutant `lvcreate` avec `-i 4 -I 256`." } }
    - { id: fs, text: { en: "Create an XFS file system on the logical volume by running `mkfs.xfs`.", fr: "Créer un système de fichiers XFS sur le volume logique en exécutant `mkfs.xfs`." } }
    - { id: mnt, text: { en: "Add the file system to `/etc/fstab` and mount it on `/hana/data`.", fr: "Ajouter le système de fichiers à `/etc/fstab` et le monter sur `/hana/data`." } }
    - { id: root, text: { en: "Add the four disks to the root volume group by running `vgextend`.", fr: "Ajouter les quatre disques au groupe de volumes racine en exécutant `vgextend`." } }
    - { id: md5, text: { en: "Create a RAID 5 array over the four disks by running `mdadm --create --level=5`.", fr: "Créer une grappe RAID 5 sur les quatre disques en exécutant `mdadm --create --level=5`." } }
answer:
  sequence: [ pv, vg, lv, fs, mnt ]
explanation:
  correct:
    en: |
      LVM builds a stripe set bottom-up: physical volumes, then a dedicated volume group, then a logical volume striped over the four disks (`-i 4`) with a 256 KB stripe size (`-I 256`), the value recommended for /hana/data. You then create the file system and mount it persistently.
    fr: |
      LVM construit un jeu entrelacé de bas en haut : volumes physiques, puis groupe de volumes dédié, puis volume logique entrelacé sur les quatre disques (`-i 4`) avec une taille de bande de 256 Ko (`-I 256`), la valeur recommandée pour /hana/data. Vous créez ensuite le système de fichiers et le montez de façon persistante.
  options:
    root: { en: "The HANA file systems must not be placed in the default or root volume group.", fr: "Les systèmes de fichiers HANA ne doivent pas être placés dans le groupe de volumes par défaut ou racine." }
    md5: { en: "Parity is unnecessary because Azure storage already keeps three copies, and it would slow down writes.", fr: "La parité est inutile, car le stockage Azure conserve déjà trois copies, et elle ralentirait les écritures." }
references:
  - title: SAP HANA Azure virtual machine storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-storage
