id: az120-2a-net-nsg-asg
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso hosts three SAP systems (SIDs PRD, QAS and DEV) in one spoke virtual network. Each SID has application server VMs and database VMs.

    You need to recommend how to restrict network traffic between the VMs. The solution must follow Microsoft guidance for SAP on Azure and keep troubleshooting simple.

    Which two actions should you recommend? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso héberge trois systèmes SAP (SID PRD, QAS et DEV) dans un seul réseau virtuel spoke. Chaque SID comprend des machines virtuelles de serveur d'applications et des machines virtuelles de base de données.

    Vous devez recommander une méthode pour restreindre le trafic réseau entre les machines virtuelles. La solution doit suivre les recommandations de Microsoft pour SAP sur Azure et garder le dépannage simple.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Associate the network security groups with the subnets rather than with the network interfaces.", fr: "Associer les groupes de sécurité réseau aux sous-réseaux plutôt qu'aux interfaces réseau." } }
    - { id: b, text: { en: "Associate a network security group with every network interface in addition to the subnet one.", fr: "Associer un groupe de sécurité réseau à chaque interface réseau en plus de celui du sous-réseau." } }
    - { id: c, text: { en: "Group the VMs in application security groups by role and SID, and use them in the rules.", fr: "Regrouper les machines virtuelles dans des groupes de sécurité d'application par rôle et par SID, et les utiliser dans les règles." } }
    - { id: d, text: { en: "Move the database VMs of each SID to a separate virtual network peered with the spoke.", fr: "Déplacer les machines virtuelles de base de données de chaque SID vers un réseau virtuel distinct relié au spoke par peering." } }
    - { id: e, text: { en: "Add a second network interface to each VM and filter traffic per interface.", fr: "Ajouter une deuxième interface réseau à chaque machine virtuelle et filtrer le trafic par interface." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Microsoft recommends activating NSGs only at the subnet level, because NIC-level NSGs complicate troubleshooting. VMs are grouped into application security groups by role, tier and SID, for example one ASG for all DBMS VMs and one per SID, so that rules stay readable.
    fr: |
      Microsoft recommande de n'activer les NSG qu'au niveau des sous-réseaux, car les NSG au niveau des cartes réseau compliquent le dépannage. Les machines virtuelles sont regroupées dans des groupes de sécurité d'application par rôle, couche et SID, par exemple un ASG pour toutes les machines virtuelles de SGBD et un par SID, afin que les règles restent lisibles.
  options:
    b:
      en: |
        NIC-level NSGs are for exceptional cases only, because they make troubleshooting harder.
      fr: |
        Les NSG au niveau des cartes réseau sont réservés aux cas exceptionnels, car ils compliquent le dépannage.
    d:
      en: |
        Splitting the application and database layers into different virtual networks is not supported, and peering would add transfer costs on large daily volumes.
      fr: |
        Séparer les couches application et base de données dans des réseaux virtuels différents n'est pas pris en charge, et le peering ajouterait des coûts de transfert sur de gros volumes quotidiens.
    e:
      en: |
        Multiple NICs are recommended only when subnets with their own routes and NSG rules are needed; they add complexity without adding bandwidth.
      fr: |
        Plusieurs cartes réseau ne sont recommandées que lorsque des sous-réseaux avec leurs propres itinéraires et règles NSG sont nécessaires ; elles ajoutent de la complexité sans ajouter de bande passante.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
