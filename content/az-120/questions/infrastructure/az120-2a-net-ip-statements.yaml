id: az120-2a-net-ip-statements
objective: "2.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum is designing the IP addressing of the subnets that will host its SAP VMs on Azure. Some non-production VMs will be deallocated outside business hours, and the SAP central services will use virtual host names.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum conçoit l'adressage IP des sous-réseaux qui hébergeront ses machines virtuelles SAP sur Azure. Certaines machines virtuelles hors production seront libérées en dehors des heures ouvrées, et les services centraux SAP utiliseront des noms d'hôte virtuels.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Adding a second network interface to an SAP VM doubles the network bandwidth available to the VM.", fr: "L'ajout d'une deuxième interface réseau à une machine virtuelle SAP double la bande passante réseau disponible." } }
    - { id: b, text: { en: "A dynamic private IP address stays claimed while its network interface exists, even when the VM is deallocated.", fr: "Une adresse IP privée dynamique reste réservée tant que son interface réseau existe, même quand la machine virtuelle est libérée." } }
    - { id: c, text: { en: "A secondary IP address for a virtual host name must be in the subnet of its NIC and can be added without deallocating the VM.", fr: "Une adresse IP secondaire pour un nom d'hôte virtuel doit appartenir au sous-réseau de sa carte réseau et peut être ajoutée sans libérer la machine virtuelle." } }
    - { id: d, text: { en: "A network interface can be moved to a subnet of another virtual network without redeploying the VM.", fr: "Une interface réseau peut être déplacée vers un sous-réseau d'un autre réseau virtuel sans redéployer la machine virtuelle." } }
    - { id: e, text: { en: "Microsoft recommends sending user traffic through the subnet of a secondary network interface.", fr: "Microsoft recommande de faire passer le trafic des utilisateurs par le sous-réseau d'une interface réseau secondaire." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      A NIC keeps its IP address while it exists, even if the VM is stopped; a dynamic address is released only if the NIC is deleted, moved to another subnet or switched to static, so subnet ranges must include stopped VMs. Secondary IPs for SAP virtual host names are added in the NIC IP configuration, must be in the NIC's subnet, and can be added or removed without deallocation (changing the primary IP requires it).
    fr: |
      Une carte réseau conserve son adresse IP tant qu'elle existe, même si la machine virtuelle est arrêtée ; une adresse dynamique n'est libérée que si la carte réseau est supprimée, déplacée vers un autre sous-réseau ou passée en statique : les plages des sous-réseaux doivent donc inclure les machines virtuelles arrêtées. Les adresses IP secondaires des noms d'hôte virtuels SAP s'ajoutent dans la configuration IP de la carte réseau, doivent appartenir à son sous-réseau, et peuvent être ajoutées ou supprimées sans libération (le changement de l'adresse IP principale l'exige).
  options:
    a:
      en: |
        Additional vNICs do not add bandwidth: all NICs share the bandwidth of the VM.
      fr: |
        Des cartes réseau virtuelles supplémentaires n'ajoutent pas de bande passante : toutes les cartes partagent celle de la machine virtuelle.
    d:
      en: |
        A NIC cannot change virtual networks after deployment; moving a resource to another virtual network means deleting and redeploying it.
      fr: |
        Une carte réseau ne peut pas changer de réseau virtuel après le déploiement ; déplacer une ressource vers un autre réseau virtuel implique de la supprimer et de la redéployer.
    e:
      en: |
        Microsoft recommends using the subnet of the primary NIC for user network traffic.
      fr: |
        Microsoft recommande d'utiliser le sous-réseau de la carte réseau principale pour le trafic des utilisateurs.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
  - title: Azure Virtual Network FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
