id: az120-2b-er-premium
objective: "2.2.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a 1-Gbps ExpressRoute circuit with the Standard SKU at the Amsterdam peering location. Eight virtual networks in West Europe are linked to the circuit. The SAP program adds the following requirements:

    - Link the circuit to an SAP virtual network in Southeast Asia.
    - Link seven more virtual networks in West Europe for new SAP landscapes.
    - Connect the circuit with Global Reach to a second Contoso circuit at the Frankfurt peering location.
    - Enable FastPath for the SAP application servers.

    Which two requirements require the ExpressRoute Premium add-on?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un circuit ExpressRoute de 1 Gbit/s avec la référence SKU Standard à l'emplacement de peering d'Amsterdam. Huit réseaux virtuels de West Europe sont liés au circuit. Le programme SAP ajoute les exigences suivantes :

    - Lier le circuit à un réseau virtuel SAP de Southeast Asia.
    - Lier sept réseaux virtuels supplémentaires de West Europe pour de nouveaux paysages SAP.
    - Connecter le circuit par Global Reach à un deuxième circuit de Contoso à l'emplacement de peering de Francfort.
    - Activer FastPath pour les serveurs d'applications SAP.

    Quelles sont les deux exigences qui nécessitent le module complémentaire ExpressRoute Premium ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Linking the SAP virtual network in Southeast Asia", fr: "La liaison du réseau virtuel SAP de Southeast Asia" } }
    - { id: b, text: { en: "Linking seven more virtual networks in West Europe", fr: "La liaison de sept réseaux virtuels supplémentaires de West Europe" } }
    - { id: c, text: { en: "Connecting to the Frankfurt circuit with Global Reach", fr: "La connexion au circuit de Francfort par Global Reach" } }
    - { id: d, text: { en: "Enabling FastPath for the SAP application servers", fr: "L'activation de FastPath pour les serveurs d'applications SAP" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "A Standard circuit reaches only the Azure regions of its geopolitical region, so linking a virtual network in Southeast Asia to a circuit in Amsterdam needs Premium. A Standard circuit allows 10 virtual network links, and 15 links exceed that limit; a 1-Gbps Premium circuit allows 50. Global Reach between two circuits in the same geopolitical region doesn't need Premium, and FastPath depends on the gateway SKU."
    fr: "Un circuit Standard ne dessert que les régions Azure de sa zone géopolitique : lier un réseau virtuel de Southeast Asia à un circuit d'Amsterdam nécessite Premium. Un circuit Standard autorise 10 liaisons de réseaux virtuels, et 15 liaisons dépassent cette limite ; un circuit Premium de 1 Gbit/s en autorise 50. Global Reach entre deux circuits d'une même zone géopolitique ne nécessite pas Premium, et FastPath dépend de la référence SKU de la passerelle."
  options:
    c: { en: "Premium is required for Global Reach only between different geopolitical regions; Amsterdam and Frankfurt are both in Europe.", fr: "Premium n'est requis pour Global Reach qu'entre zones géopolitiques différentes ; Amsterdam et Francfort sont toutes deux en Europe." }
    d: { en: "FastPath requires an Ultra Performance, ErGw3Az or ErGwScale (10+ scale units) gateway, not Premium.", fr: "FastPath exige une passerelle Ultra Performance, ErGw3Az ou ErGwScale (10 unités d'échelle ou plus), pas Premium." }
references:
  - title: FAQ - Azure ExpressRoute
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-faqs
  - title: About Azure ExpressRoute Global Reach
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-global-reach
