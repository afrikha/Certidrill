id: az120-2c-anf-dbms-support
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys is migrating four SAP ERP systems to Azure. Each system uses a different database management system. To simplify storage operations, Tailspin wants to place the database data files on Azure NetApp Files wherever this configuration is supported for SAP workloads.

    For which database deployment can you place the data files on Azure NetApp Files?
  fr: |
    Tailspin Toys migre quatre systèmes SAP ERP vers Azure. Chaque système utilise un système de gestion de base de données différent. Pour simplifier l'exploitation du stockage, Tailspin veut placer les fichiers de données des bases sur Azure NetApp Files partout où cette configuration est prise en charge pour les charges de travail SAP.

    Pour quel déploiement de base de données pouvez-vous placer les fichiers de données sur Azure NetApp Files ?
body:
  options:
    - { id: a, text: { en: "SAP ASE on Windows Server, by using SMB volumes", fr: "SAP ASE sur Windows Server, avec des volumes SMB" } }
    - { id: b, text: { en: "IBM Db2 on Windows Server, by using SMB volumes", fr: "IBM Db2 sur Windows Server, avec des volumes SMB" } }
    - { id: c, text: { en: "SQL Server 2019 on Windows Server, by using SMB volumes", fr: "SQL Server 2019 sur Windows Server, avec des volumes SMB" } }
    - { id: d, text: { en: "Oracle Database on Oracle Linux, by using dNFS with NFS volumes", fr: "Oracle Database sur Oracle Linux, avec dNFS sur des volumes NFS" } }
answer: { optionId: d }
explanation:
  correct:
    en: For non-HANA databases, Azure NetApp Files is supported only for specific combinations - Oracle on Oracle Linux with dNFS, Db2, SAP ASE and SAP MaxDB on SUSE or Red Hat Linux with NFS, and SQL Server 2022 or later with SMB. Oracle on Oracle Linux with Oracle Direct NFS (dNFS) matches one of these combinations.
    fr: "Pour les bases de données autres que HANA, Azure NetApp Files n'est pris en charge que pour des combinaisons précises : Oracle sur Oracle Linux avec dNFS ; Db2, SAP ASE et SAP MaxDB sur SUSE ou Red Hat Linux avec NFS ; SQL Server 2022 ou version ultérieure avec SMB. Oracle sur Oracle Linux avec Oracle Direct NFS (dNFS) correspond à l'une de ces combinaisons."
  options:
    a: { en: "SAP ASE is supported on Azure NetApp Files only on SUSE or Red Hat Linux with NFS, not on Windows with SMB.", fr: "SAP ASE n'est pris en charge sur Azure NetApp Files que sur SUSE ou Red Hat Linux avec NFS, pas sur Windows avec SMB." }
    b: { en: "Db2 is supported on Azure NetApp Files only on SUSE or Red Hat Linux with NFS.", fr: "Db2 n'est pris en charge sur Azure NetApp Files que sur SUSE ou Red Hat Linux avec NFS." }
    c: { en: "SMB volumes for SQL Server data files are supported from SQL Server 2022 onward, not with SQL Server 2019.", fr: "Les volumes SMB pour les fichiers de données SQL Server sont pris en charge à partir de SQL Server 2022, pas avec SQL Server 2019." }
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
