id: az120-2b-flow-outbound-statements
objective: "2.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso is designing outbound connectivity for SAP VMs that have no public IP addresses. Some VMs are in the backend pool of an internal Standard Load Balancer used by Pacemaker clusters. The virtual networks will be created in 2027.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso conçoit la connectivité sortante de machines virtuelles SAP sans adresse IP publique. Certaines machines virtuelles font partie du pool principal d'un équilibreur de charge interne Standard utilisé par des clusters Pacemaker. Les réseaux virtuels seront créés en 2027.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A NAT gateway associated with a subnet takes precedence over load balancer outbound rules for new connections from that subnet.", fr: "Une passerelle NAT associée à un sous-réseau est prioritaire sur les règles de trafic sortant d'un équilibreur de charge pour les nouvelles connexions de ce sous-réseau." } }
    - { id: b, text: { en: "Standalone VMs that aren't behind a load balancer need an explicit outbound method to reach public endpoints.", fr: "Les machines virtuelles autonomes qui ne sont pas derrière un équilibreur de charge ont besoin d'une méthode de sortie explicite pour joindre des points de terminaison publics." } }
    - { id: c, text: { en: "VMs in the backend pool of the internal Standard Load Balancer reach the internet through the load balancer frontend IP address.", fr: "Les machines virtuelles du pool principal de l'équilibreur de charge interne Standard accèdent à Internet par l'adresse IP frontale de l'équilibreur." } }
    - { id: d, text: { en: "An additional public Standard Load Balancer with outbound rules sends the outbound traffic through a centralized corporate auditing solution.", fr: "Un équilibreur de charge public Standard supplémentaire avec des règles de trafic sortant fait passer le trafic sortant par une solution d'audit centralisée de l'entreprise." } }
    - { id: e, text: { en: "Azure Firewall can be deployed in the same subnet as the SAP VMs that use it.", fr: "Le Pare-feu Azure peut être déployé dans le même sous-réseau que les machines virtuelles SAP qui l'utilisent." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "Once associated with a subnet, a NAT gateway becomes the preferred outbound method and takes precedence over load balancer outbound rules and instance-level public IPs for new connections. For virtual networks created after March 31, 2026, subnets are private by default, so every VM, standalone or behind a load balancer, needs an explicit outbound method."
    fr: "Une fois associée à un sous-réseau, une passerelle NAT devient la méthode de sortie préférée et l'emporte sur les règles de trafic sortant d'un équilibreur de charge et sur les adresses IP publiques d'instance pour les nouvelles connexions. Pour les réseaux virtuels créés après le 31 mars 2026, les sous-réseaux sont privés par défaut : chaque machine virtuelle, autonome ou derrière un équilibreur de charge, a besoin d'une méthode de sortie explicite."
  options:
    c: { en: "An internal load balancer has a private frontend and gives no outbound internet connectivity to its backend pool.", fr: "Un équilibreur de charge interne a une adresse frontale privée et ne donne aucune connectivité Internet sortante à son pool principal." }
    d: { en: "A public load balancer with outbound rules gives direct access to public endpoints, so it might not meet a central auditing requirement.", fr: "Un équilibreur de charge public avec des règles de trafic sortant donne un accès direct aux points de terminaison publics : il peut ne pas répondre à une exigence d'audit centralisé." }
    e: { en: "Azure Firewall requires its own subnet named AzureFirewallSubnet.", fr: "Le Pare-feu Azure exige son propre sous-réseau nommé AzureFirewallSubnet." }
references:
  - title: Outbound connectivity for SAP VMs
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-standard-load-balancer-outbound-connections
