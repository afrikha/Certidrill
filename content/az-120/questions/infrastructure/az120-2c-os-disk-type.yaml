id: az120-2c-os-disk-type
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to deploy a production SAP HANA database on an Azure virtual machine named **hdb01** that runs SUSE Linux Enterprise Server for SAP. The **/hana/data** and **/hana/log** volumes will be placed on Premium SSD v2 disks.

    You need to recommend a disk type for the operating system disk of hdb01. The solution must follow Microsoft guidance for production SAP workloads.

    Which disk type should you recommend?
  fr: |
    Contoso prévoit de déployer une base de données SAP HANA de production sur une machine virtuelle Azure nommée **hdb01** qui exécute SUSE Linux Enterprise Server for SAP. Les volumes **/hana/data** et **/hana/log** seront placés sur des disques SSD Premium v2.

    Vous devez recommander un type de disque pour le disque du système d'exploitation de hdb01. La solution doit respecter les recommandations de Microsoft pour les charges de travail SAP de production.

    Quel type de disque devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Premium SSD v2", fr: "SSD Premium v2" } }
    - { id: b, text: { en: "Ultra Disk", fr: "Disque Ultra" } }
    - { id: c, text: { en: "Premium SSD", fr: "SSD Premium" } }
    - { id: d, text: { en: "Standard HDD", fr: "HDD Standard" } }
answer: { optionId: c }
explanation:
  correct:
    en: Premium SSD is the recommended disk type for the operating system disk of SAP VMs. Premium SSD v2 and Ultra Disk are data disks only and can't be used as an OS disk, so the OS disk stays on Premium SSD even when the HANA volumes use Premium SSD v2.
    fr: Le SSD Premium est le type de disque recommandé pour le disque du système d'exploitation des machines virtuelles SAP. Le SSD Premium v2 et le disque Ultra sont uniquement des disques de données et ne peuvent pas servir de disque du système d'exploitation ; le disque du système d'exploitation reste donc sur SSD Premium, même si les volumes HANA utilisent du SSD Premium v2.
  options:
    a: { en: "Premium SSD v2 disks can't be used as an OS disk.", fr: "Les disques SSD Premium v2 ne peuvent pas servir de disque du système d'exploitation." }
    b: { en: "Ultra Disks can't be used as an OS disk.", fr: "Les disques Ultra ne peuvent pas servir de disque du système d'exploitation." }
    d: { en: "Standard HDD is not suitable for the OS disk of SAP VMs; it is only meant for backups.", fr: "Le HDD Standard ne convient pas au disque du système d'exploitation des machines virtuelles SAP ; il est réservé aux sauvegardes." }
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
  - title: Select a disk type for Azure IaaS VMs - managed disks
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types
