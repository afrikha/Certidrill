id: az120-2a-net-static-ip
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind is deploying an SAP HANA VM in a subnet named **snet-sap-db** (10.40.2.0/24). The network team assigned the private IP address 10.40.2.10 to the VM in its IP address plan, and the VM must always use this address.

    The VM is protected by Azure Backup.

    What should you do?
  fr: |
    Northwind déploie une machine virtuelle SAP HANA dans un sous-réseau nommé **snet-sap-db** (10.40.2.0/24). L'équipe réseau a attribué l'adresse IP privée 10.40.2.10 à la machine virtuelle dans son plan d'adressage, et la machine virtuelle doit toujours utiliser cette adresse.

    La machine virtuelle est protégée par Sauvegarde Azure.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep the Dynamic allocation of the NIC and let Azure assign the next free address of the subnet.", fr: "Conserver l'allocation Dynamic de la carte réseau et laisser Azure attribuer la prochaine adresse libre du sous-réseau." } }
    - { id: b, text: { en: "Set the IP configuration of the NIC to Static with the address 10.40.2.10 in Azure.", fr: "Définir la configuration IP de la carte réseau sur Static avec l'adresse 10.40.2.10 dans Azure." } }
    - { id: c, text: { en: "Configure the address 10.40.2.10 statically in the network settings of the guest OS.", fr: "Configurer l'adresse 10.40.2.10 de façon statique dans les paramètres réseau du système d'exploitation invité." } }
    - { id: d, text: { en: "Add 10.40.2.10 to the hosts file of every SAP VM and keep DHCP in the guest OS.", fr: "Ajouter 10.40.2.10 au fichier hosts de chaque machine virtuelle SAP et conserver DHCP dans le système d'exploitation invité." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Static private IP addresses for SAP VMs are assigned through Azure, in the IP configuration of the network interface. The guest OS keeps getting its address through DHCP, which Azure Backup relies on for the primary NIC.
    fr: |
      Les adresses IP privées statiques des machines virtuelles SAP s'attribuent par Azure, dans la configuration IP de l'interface réseau. Le système d'exploitation invité continue d'obtenir son adresse par DHCP, ce sur quoi Sauvegarde Azure s'appuie pour la carte réseau principale.
  options:
    a:
      en: |
        A dynamic allocation gives the next free address, which is not necessarily 10.40.2.10.
      fr: |
        Une allocation dynamique donne la prochaine adresse libre, qui n'est pas forcément 10.40.2.10.
    c:
      en: |
        Microsoft advises against setting static IPs inside the guest OS; Azure Backup relies on the primary NIC using DHCP.
      fr: |
        Microsoft déconseille de définir des adresses IP statiques dans le système d'exploitation invité ; Sauvegarde Azure s'appuie sur l'usage de DHCP par la carte réseau principale.
    d:
      en: |
        Name resolution entries do not control which address Azure assigns to the NIC.
      fr: |
        Des entrées de résolution de noms ne déterminent pas l'adresse qu'Azure attribue à la carte réseau.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
