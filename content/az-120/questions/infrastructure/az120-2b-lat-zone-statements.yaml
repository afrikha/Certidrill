id: az120-2b-lat-zone-statements
objective: "2.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso deploys its SAP landscape across availability zones in two Azure subscriptions: **sub-sap-prod** for production and **sub-sap-nonprod** for the other systems. The production SAP HANA system uses synchronous HANA System Replication between two zones.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso déploie son paysage SAP sur des zones de disponibilité dans deux abonnements Azure : **sub-sap-prod** pour la production et **sub-sap-nonprod** pour les autres systèmes. Le système SAP HANA de production utilise la réplication système HANA synchrone entre deux zones.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Zone 1 of sub-sap-prod and zone 1 of sub-sap-nonprod always refer to the same physical zone."
        fr: "La zone 1 de sub-sap-prod et la zone 1 de sub-sap-nonprod désignent toujours la même zone physique."
    - id: s2
      text:
        en: "For the active and passive nodes of the cross-zone deployment, you should use the two zones that have the lowest network latency between them."
        fr: "Pour les nœuds actif et passif du déploiement interzone, vous devez utiliser les deux zones dont la latence réseau entre elles est la plus faible."
    - id: s3
      text:
        en: "Synchronous HANA System Replication between two zones of the region is expected to work without impacting the scalability of the workload."
        fr: "La réplication système HANA synchrone entre deux zones de la région devrait fonctionner sans affecter la scalabilité de la charge de travail."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "The mapping of logical zone numbers to physical zones is fixed per subscription, so each subscription needs its own analysis (the Avzone-Mapping script compares them). Microsoft advises using the two zones with the lowest latency for the active and passive nodes. Even in the worst case, synchronous replication such as HANA System Replication works across zones without impacting the workload's scalability."
    fr: "L'association des numéros de zone logiques aux zones physiques est fixée par abonnement : chaque abonnement doit être analysé séparément (le script Avzone-Mapping permet de les comparer). Microsoft conseille d'utiliser les deux zones à la latence la plus faible pour les nœuds actif et passif. Même dans le pire des cas, une réplication synchrone comme la réplication système HANA fonctionne entre zones sans affecter la scalabilité de la charge de travail."
references:
  - title: SAP workload configurations with Azure Availability Zones
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones
  - title: SAP workload planning and deployment checklist
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/deployment-checklist
