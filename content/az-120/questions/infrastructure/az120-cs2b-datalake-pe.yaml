id: az120-cs2b-datalake-pe
objective: "2.2.7"
type: multi
caseStudy: az120-cs2b-wingtip
difficulty: 2
status: draft
stem:
  en: |
    You need to create private endpoints in Spoke-Data for stwtdatalake. The solution must meet the data extraction requirements.

    For which two target sub-resources should you create a private endpoint? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer des points de terminaison privés dans Spoke-Data pour stwtdatalake. La solution doit respecter les exigences d'extraction de données.

    Pour quelles deux sous-ressources cibles devez-vous créer un point de terminaison privé ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: file }
    - { id: b, text: dfs }
    - { id: c, text: table }
    - { id: d, text: blob }
    - { id: e, text: web }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Operations such as Create Directory and Manage ACL use the Data Lake Storage (dfs) endpoint, so a dfs private endpoint is required. Microsoft also says to create a blob private endpoint when you create a dfs one, because operations on the DFS endpoint may be redirected to the Blob endpoint.
    fr: Des opérations comme Create Directory et Manage ACL utilisent le point de terminaison Data Lake Storage (dfs) ; un point de terminaison privé dfs est donc nécessaire. Microsoft indique aussi de créer un point de terminaison privé blob quand vous en créez un pour dfs, car des opérations sur le point de terminaison DFS peuvent être redirigées vers le point de terminaison Blob.
  options:
    a: { en: "file is the Azure Files endpoint, which the pipeline does not use.", fr: "file est le point de terminaison Azure Files, que le pipeline n'utilise pas." }
    c: { en: "table is the Table storage endpoint, which the pipeline does not use.", fr: "table est le point de terminaison du stockage Table, que le pipeline n'utilise pas." }
    e: { en: "web is the static website endpoint, which the pipeline does not use.", fr: "web est le point de terminaison du site web statique, que le pipeline n'utilise pas." }
references:
  - title: Use private endpoints for Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
