id: az120-2b-se-statements
objective: "2.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum enables a **Microsoft.Storage** service endpoint on the subnet **snet-sap-db** (West Europe) so that the SAP HANA VMs can write backups to the storage account **stsapbkp01** in West Europe. A virtual network rule on stsapbkp01 allows snet-sap-db, and the default network action is Deny.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum active un point de terminaison de service **Microsoft.Storage** sur le sous-réseau **snet-sap-db** (West Europe) pour que les machines virtuelles SAP HANA écrivent des sauvegardes dans le compte de stockage **stsapbkp01** de West Europe. Une règle de réseau virtuel sur stsapbkp01 autorise snet-sap-db, et l'action réseau par défaut est Deny.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The storage account sees the private IP addresses of the HANA VMs as the source of their requests.", fr: "Le compte de stockage voit les adresses IP privées des machines virtuelles HANA comme source de leurs requêtes." } }
    - { id: b, text: { en: "The name stsapbkp01.blob.core.windows.net still resolves to a public IP address of the storage service.", fr: "Le nom stsapbkp01.blob.core.windows.net est toujours résolu en une adresse IP publique du service de stockage." } }
    - { id: c, text: { en: "The storage account receives an IP address from the address range of snet-sap-db.", fr: "Le compte de stockage reçoit une adresse IP de la plage d'adresses de snet-sap-db." } }
    - { id: d, text: { en: "Existing TCP connections from snet-sap-db to the storage service stay open while the service endpoint is being enabled.", fr: "Les connexions TCP existantes de snet-sap-db vers le service de stockage restent ouvertes pendant l'activation du point de terminaison de service." } }
    - { id: e, text: { en: "The service endpoint also gives snet-sap-db access to storage accounts in every other Azure region.", fr: "Le point de terminaison de service donne aussi à snet-sap-db l'accès aux comptes de stockage de toutes les autres régions Azure." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "With a service endpoint, traffic from the subnet to the service uses the virtual network private addresses as source IPs, which is what the virtual network rule matches. DNS entries don't change and keep resolving to the public IP addresses of the service; the traffic takes an optimized route over the Azure backbone."
    fr: "Avec un point de terminaison de service, le trafic du sous-réseau vers le service utilise les adresses privées du réseau virtuel comme adresses IP sources, ce que reconnaît la règle de réseau virtuel. Les entrées DNS ne changent pas et continuent d'être résolues en adresses IP publiques du service ; le trafic emprunte un itinéraire optimisé sur le réseau principal Azure."
  options:
    c: { en: "Only a private endpoint gets an IP address in the virtual network.", fr: "Seul un point de terminaison privé reçoit une adresse IP dans le réseau virtuel." }
    d: { en: "The source IPs switch from public to private addresses, and the existing open TCP connections are closed during the switch.", fr: "Les adresses IP sources passent d'adresses publiques à des adresses privées, et les connexions TCP ouvertes sont fermées pendant ce changement." }
    e: { en: "Microsoft.Storage covers storage accounts in the same region; any-region access needs Microsoft.Storage.Global.", fr: "Microsoft.Storage couvre les comptes de stockage de la même région ; l'accès à toute région nécessite Microsoft.Storage.Global." }
references:
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
  - title: Firewall rules and network access for Azure Blob, Data Lake, Queue, and Table Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
