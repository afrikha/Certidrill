id: az120-2b-dns-suffix
objective: "2.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank's SAP virtual network used Azure-provided name resolution. To resolve on-premises names, you change the DNS servers of the virtual network to two Active Directory domain controllers in the hub that host the zone **corp.woodgrove.com**, and you restart the SAP VMs.

    The A records of all the SAP VMs exist in corp.woodgrove.com. Since the change, `ping sapapp02.corp.woodgrove.com` works from the SAP VMs, but `ping sapapp02` fails. The SAP administrators require short host name resolution between the SAP VMs.

    What should you do?
  fr: |
    Le réseau virtuel SAP de Woodgrove Bank utilisait la résolution de noms fournie par Azure. Pour résoudre les noms locaux, vous remplacez les serveurs DNS du réseau virtuel par deux contrôleurs de domaine Active Directory du hub qui hébergent la zone **corp.woodgrove.com**, puis vous redémarrez les machines virtuelles SAP.

    Les enregistrements A de toutes les machines virtuelles SAP existent dans corp.woodgrove.com. Depuis la modification, `ping sapapp02.corp.woodgrove.com` fonctionne depuis les machines virtuelles SAP, mais `ping sapapp02` échoue. Les administrateurs SAP exigent la résolution des noms d'hôte courts entre les machines virtuelles SAP.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Configure corp.woodgrove.com as the DNS search suffix in the guest OS of the SAP VMs.", fr: "Configurer corp.woodgrove.com comme suffixe de recherche DNS dans le système d'exploitation invité des machines virtuelles SAP." }
    - id: b
      text: { en: "Add 168.63.129.16 as a third DNS server in the settings of the SAP virtual network.", fr: "Ajouter 168.63.129.16 comme troisième serveur DNS dans les paramètres du réseau virtuel SAP." }
    - id: c
      text: { en: "Link the SAP virtual network to a private DNS zone with autoregistration enabled.", fr: "Lier le réseau virtuel SAP à une zone DNS privée avec l'inscription automatique activée." }
    - id: d
      text: { en: "Restart the SAP VMs again after renewing the DHCP lease in the guest OS.", fr: "Redémarrer de nouveau les machines virtuelles SAP après avoir renouvelé le bail DHCP dans l'invité." }
answer: { optionId: a }
explanation:
  correct:
    en: "With Azure-provided DNS, the appropriate DNS suffix is applied automatically, so host names alone resolve. With any other option, such as your own DNS servers, you must use FQDNs or manually apply the appropriate DNS suffix to the VMs. Setting corp.woodgrove.com as the search suffix lets `sapapp02` expand to the FQDN that the domain controllers resolve."
    fr: "Avec le DNS fourni par Azure, le suffixe DNS approprié est appliqué automatiquement : les noms d'hôte seuls sont résolus. Avec toute autre option, comme vos propres serveurs DNS, vous devez utiliser des noms de domaine complets (FQDN) ou appliquer manuellement le suffixe DNS approprié aux machines virtuelles. Définir corp.woodgrove.com comme suffixe de recherche permet de compléter `sapapp02` en FQDN, que les contrôleurs de domaine résolvent."
  options:
    b:
      en: "Azure DNS doesn't host corp.woodgrove.com, and adding a DNS server doesn't append that suffix to short names."
      fr: "Azure DNS n'héberge pas corp.woodgrove.com, et ajouter un serveur DNS n'ajoute pas ce suffixe aux noms courts."
    c:
      en: "Autoregistration creates records in an Azure private zone; it doesn't change the suffix that the guests append to short names."
      fr: "L'inscription automatique crée des enregistrements dans une zone privée Azure ; elle ne change pas le suffixe que les invités ajoutent aux noms courts."
    d:
      en: "The VMs already use the new DNS servers, as the working FQDN query shows; another restart doesn't add a suffix."
      fr: "Les machines virtuelles utilisent déjà les nouveaux serveurs DNS, comme le montre la requête FQDN réussie ; un nouveau redémarrage n'ajoute pas de suffixe."
references:
  - title: Azure Virtual Network Name Resolution Guide
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-name-resolution-for-vms-and-role-instances
