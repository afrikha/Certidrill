id: az120-2b-lat-reduce-actions
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin runs an SAP S/4HANA system in an active/active pattern across availability zones 1 and 2. The active SAP HANA VM is in zone 1, and the application server VMs are split evenly between the two zones. Accelerated Networking is disabled on all the VMs.

    Long-running batch jobs take much longer when they run on application servers in zone 2. SAP assigns the batch jobs to any application instance.

    You need to reduce the impact of network latency on the batch jobs and on the application-to-database traffic. The solution must remain supported.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin exécute un système SAP S/4HANA selon un modèle actif/actif sur les zones de disponibilité 1 et 2. La machine virtuelle SAP HANA active se trouve dans la zone 1, et les machines virtuelles de serveur d'applications sont réparties à parts égales entre les deux zones. Accelerated Networking est désactivé sur toutes les machines virtuelles.

    Les traitements par lots de longue durée prennent beaucoup plus de temps quand ils s'exécutent sur des serveurs d'applications de la zone 2. SAP affecte les traitements par lots à n'importe quelle instance d'application.

    Vous devez réduire l'impact de la latence réseau sur les traitements par lots et sur le trafic entre application et base de données. La solution doit rester prise en charge.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Define SAP batch server groups that run the batch jobs on the application instances in zone 1.", fr: "Définir des groupes de serveurs de traitement par lots SAP qui exécutent les traitements sur les instances d'application de la zone 1." } }
    - { id: b, text: { en: "Enable Accelerated Networking on the application server VMs and on the HANA VMs.", fr: "Activer Accelerated Networking sur les machines virtuelles de serveur d'applications et sur les machines virtuelles HANA." } }
    - { id: c, text: { en: "Add the HANA VMs of both zones and all the application servers to one proximity placement group.", fr: "Ajouter les machines virtuelles HANA des deux zones et tous les serveurs d'applications à un même groupe de placement de proximité." } }
    - { id: d, text: { en: "Add a second network interface to the active HANA VM in the application subnet.", fr: "Ajouter une deuxième interface réseau à la machine virtuelle HANA active dans le sous-réseau des applications." } }
    - { id: e, text: { en: "Enable FastPath on the ExpressRoute connection of the hub virtual network.", fr: "Activer FastPath sur la connexion ExpressRoute du réseau virtuel hub." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "Microsoft says that the latency difference between in-zone and cross-zone traffic can lengthen batch runtimes, and that you mitigate it with SAP functions such as logon groups, RFC server groups and batch server groups that keep the work in the zone of the active database. Accelerated Networking on both communication partners lowers the latency of every application-to-database call."
    fr: "Microsoft indique que l'écart de latence entre le trafic dans la zone et le trafic interzone peut allonger la durée des traitements par lots, et qu'il se compense avec des fonctions SAP comme les groupes de connexion, les groupes de serveurs RFC et les groupes de serveurs de traitement par lots, qui gardent le travail dans la zone de la base de données active. Accelerated Networking sur les deux partenaires de communication réduit la latence de chaque appel entre application et base de données."
  options:
    c: { en: "A proximity placement group can't span availability zones.", fr: "Un groupe de placement de proximité ne peut pas couvrir plusieurs zones de disponibilité." }
    d: { en: "Extra NICs share the VM bandwidth and don't shorten the cross-zone path.", fr: "Les cartes réseau supplémentaires partagent la bande passante de la machine virtuelle et ne raccourcissent pas le chemin interzone." }
    e: { en: "FastPath only affects traffic between on-premises and Azure, not traffic between SAP VMs.", fr: "FastPath ne concerne que le trafic entre le site local et Azure, pas le trafic entre machines virtuelles SAP." }
references:
  - title: SAP workload configurations with Azure Availability Zones
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones
  - title: Azure Accelerated Networking Overview and Benefits
    url: https://learn.microsoft.com/en-us/azure/virtual-network/accelerated-networking-overview
