id: az120-2a-hana-log-premium-family
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum is deploying a production SAP HANA database on Azure. For cost reasons, the database team requires the /hana/log volume to use Premium SSD (v1) managed disks. The configuration must be compliant with the SAP HANA certification of the VM.

    What should you include in the design?
  fr: |
    Adatum déploie une base de données SAP HANA de production sur Azure. Pour des raisons de coût, l'équipe de base de données exige que le volume /hana/log utilise des disques managés SSD Premium (v1). La configuration doit être conforme à la certification SAP HANA de la machine virtuelle.

    Que devez-vous inclure dans la conception ?
body:
  options:
    - { id: a, text: { en: "An Edsv5-series VM with Write Accelerator enabled on the log disks", fr: "Une machine virtuelle de la série Edsv5 avec Write Accelerator activé sur les disques de journal" } }
    - { id: b, text: { en: "An Edsv5-series VM with ReadOnly host caching on the log disks", fr: "Une machine virtuelle de la série Edsv5 avec la mise en cache de l'hôte ReadOnly sur les disques de journal" } }
    - { id: c, text: { en: "An M-series VM with Write Accelerator enabled on the log disks", fr: "Une machine virtuelle de la série M avec Write Accelerator activé sur les disques de journal" } }
    - { id: d, text: { en: "An M-series VM with ReadWrite host caching on the log disks", fr: "Une machine virtuelle de la série M avec la mise en cache de l'hôte ReadWrite sur les disques de journal" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      SAP HANA certification of M-series VMs with Premium SSD is exclusively with Azure Write Accelerator on the /hana/log volume, which makes Write Accelerator mandatory there. Write Accelerator is available only for M-series VMs (M, Mv2, Mv3) and works with host caching None or ReadOnly.
    fr: |
      La certification SAP HANA des machines virtuelles de la série M avec SSD Premium suppose exclusivement Azure Write Accelerator sur le volume /hana/log, ce qui le rend obligatoire sur ce volume. Write Accelerator n'est disponible que pour les machines virtuelles de la série M (M, Mv2, Mv3) et fonctionne avec la mise en cache de l'hôte None ou ReadOnly.
  options:
    a:
      en: |
        Write Accelerator works only with M-series VMs; it cannot be enabled on E-series VMs.
      fr: |
        Write Accelerator ne fonctionne qu'avec les machines virtuelles de la série M ; il ne peut pas être activé sur les séries E.
    b:
      en: |
        Without Write Accelerator, Premium SSD log latency on E-series VMs does not go below 1 ms; for E-series, Ultra Disk is the documented way to meet the log KPIs.
      fr: |
        Sans Write Accelerator, la latence du journal sur SSD Premium avec la série E ne descend pas sous 1 ms ; pour la série E, le disque Ultra est la solution documentée pour respecter les KPI du journal.
    d:
      en: |
        ReadWrite caching is not supported with Write Accelerator, and M-series certification with Premium SSD requires Write Accelerator on /hana/log.
      fr: |
        La mise en cache ReadWrite n'est pas prise en charge avec Write Accelerator, et la certification de la série M avec SSD Premium exige Write Accelerator sur /hana/log.
references:
  - title: SAP HANA Azure virtual machine Premium SSD configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-premium-ssd-v1
  - title: Azure Write Accelerator - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/how-to-enable-write-accelerator
