id: az120-2b-an-statements
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to enable Accelerated Networking on all the SUSE Linux Enterprise Server VMs of its SAP landscape. The VMs are in a spoke virtual network that connects to the on-premises datacenter through ExpressRoute. Network security groups (NSGs) are associated with the VM network interfaces.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prévoit d'activer Accelerated Networking sur toutes les machines virtuelles SUSE Linux Enterprise Server de son paysage SAP. Les machines virtuelles sont dans un réseau virtuel spoke connecté au centre de données local par ExpressRoute. Des groupes de sécurité réseau (NSG) sont associés aux interfaces réseau des machines virtuelles.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "After Accelerated Networking is enabled, the rules of the NSGs associated with the network interfaces are still enforced."
        fr: "Une fois Accelerated Networking activé, les règles des NSG associés aux interfaces réseau sont toujours appliquées."
    - id: s2
      text:
        en: "Accelerated Networking significantly reduces the latency between SAP GUI users in the on-premises datacenter and the SAP application servers."
        fr: "Accelerated Networking réduit fortement la latence entre les utilisateurs SAP GUI du centre de données local et les serveurs d'applications SAP."
    - id: s3
      text:
        en: "SAP applications should be configured to use the IP address of the virtual function (VF) interface instead of the synthetic interface."
        fr: "Les applications SAP doivent être configurées pour utiliser l'adresse IP de l'interface de fonction virtuelle (VF) plutôt que celle de l'interface synthétique."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "With Accelerated Networking the physical NIC applies the same policies (NSGs, ACLs, isolation) in hardware, so NSG rules keep working. The feature has minimal effect on traffic to other virtual networks or to on-premises networks; it mainly helps VM-to-VM traffic in the same virtual network. In the Linux guest, IP addresses are assigned only to the synthetic interface, which is bonded to the VF interface; applications must use the synthetic interface."
    fr: "Avec Accelerated Networking, la carte réseau physique applique les mêmes stratégies (NSG, listes de contrôle d'accès, isolation) au niveau matériel ; les règles NSG continuent donc de fonctionner. La fonctionnalité a un effet minime sur le trafic vers d'autres réseaux virtuels ou vers les réseaux locaux ; elle aide surtout le trafic entre machines virtuelles d'un même réseau virtuel. Dans l'invité Linux, les adresses IP sont attribuées uniquement à l'interface synthétique, couplée à l'interface VF ; les applications doivent utiliser l'interface synthétique."
references:
  - title: Azure Accelerated Networking Overview and Benefits
    url: https://learn.microsoft.com/en-us/azure/virtual-network/accelerated-networking-overview
  - title: How Accelerated Networking works in Linux and FreeBSD VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-network/accelerated-networking-how-it-works
