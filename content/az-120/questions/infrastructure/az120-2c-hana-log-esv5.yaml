id: az120-2c-hana-log-esv5
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam plans to run a production SAP HANA database on a **Standard_E64ds_v5** virtual machine deployed in availability zone 1 of West Europe.

    You need to recommend the storage for the **/hana/log** volume. The solution must meet the SAP HANA storage KPIs required for production, without relying on any disk caching or acceleration feature.

    What should you recommend?
  fr: |
    Fabrikam prévoit d'exécuter une base de données SAP HANA de production sur une machine virtuelle **Standard_E64ds_v5** déployée dans la zone de disponibilité 1 de West Europe.

    Vous devez recommander le stockage du volume **/hana/log**. La solution doit respecter les KPI de stockage SAP HANA exigés en production, sans dépendre d'une fonctionnalité de mise en cache ou d'accélération des disques.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Premium SSD disks with Write Accelerator enabled", fr: "Des disques SSD Premium avec l'Accélérateur d'écriture activé" } }
    - { id: b, text: { en: "Premium SSD v2 disks", fr: "Des disques SSD Premium v2" } }
    - { id: c, text: { en: "An NFS share on Azure Files SSD", fr: "Un partage NFS sur Azure Files SSD" } }
    - { id: d, text: { en: "Standard SSD disks", fr: "Des disques SSD Standard" } }
answer: { optionId: b }
explanation:
  correct:
    en: Premium SSD v2 delivers submillisecond latency and is certified for SAP HANA /hana/log without Write Accelerator or any cache, and it can be attached to a zonal VM. On E-series VMs, Premium SSD alone doesn't reach the HANA log latency KPIs because Write Accelerator isn't available.
    fr: Le SSD Premium v2 offre une latence inférieure à la milliseconde et est certifié pour le volume /hana/log de SAP HANA sans Accélérateur d'écriture ni cache ; il peut être attaché à une machine virtuelle zonale. Sur les machines virtuelles de la série E, le SSD Premium seul n'atteint pas les KPI de latence du journal HANA, car l'Accélérateur d'écriture n'y est pas disponible.
  options:
    a: { en: "Write Accelerator works only with M-series VMs; it can't be enabled on an E-series VM.", fr: "L'Accélérateur d'écriture ne fonctionne qu'avec les machines virtuelles de la série M ; il ne peut pas être activé sur une machine virtuelle de la série E." }
    c: { en: "Azure Files isn't supported for /hana/data or /hana/log; it can host /hana/shared only.", fr: "Azure Files n'est pas pris en charge pour /hana/data ni /hana/log ; il peut héberger uniquement /hana/shared." }
    d: { en: "Standard SSD isn't supported for SAP HANA DBMS volumes.", fr: "Le SSD Standard n'est pas pris en charge pour les volumes de SGBD SAP HANA." }
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
  - title: SAP HANA Azure virtual machine Premium SSD v2 storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-premium-ssd-v2
