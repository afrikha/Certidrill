id: az120-cs2a-hana-disks
objective: "2.3.6"
type: dropdown
caseStudy: az120-cs2a-proseware
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You need to configure the disks of the HANA VMs of HP1. The solution must meet the storage requirements.

    How should you configure the disks? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer les disques des machines virtuelles HANA de HP1. La solution doit respecter les exigences de stockage.

    Comment devez-vous configurer les disques ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Host caching of the /hana/log disks: [[log]]

      Host caching of the /hana/shared disks: [[shared]]

      Stripe size of the /hana/log LVM volume: [[stripe]]
    fr: |
      Mise en cache de l'hôte des disques /hana/log : [[log]]

      Mise en cache de l'hôte des disques /hana/shared : [[shared]]

      Taille de bande du volume LVM /hana/log : [[stripe]]
  slots:
    - id: log
      options:
        - { id: rowa, text: { en: "Read-only + Write Accelerator", fr: "Lecture seule + Accélérateur d'écriture" } }
        - { id: rw, text: { en: "Read/write", fr: "Lecture/écriture" } }
        - { id: nonewa, text: { en: "None + Write Accelerator", fr: "Aucune + Accélérateur d'écriture" } }
        - { id: none, text: { en: "None, without Write Accelerator", fr: "Aucune, sans Accélérateur d'écriture" } }
    - id: shared
      options:
        - { id: snone, text: { en: "None", fr: "Aucune" } }
        - { id: sro, text: { en: "Read-only", fr: "Lecture seule" } }
        - { id: srw, text: { en: "Read/write", fr: "Lecture/écriture" } }
    - id: stripe
      options:
        - { id: s32, text: "32 KB" }
        - { id: s64, text: "64 KB" }
        - { id: s256, text: "256 KB" }
        - { id: s1m, text: "1 MB" }
answer:
  values: { log: nonewa, shared: sro, stripe: s64 }
explanation:
  correct:
    en: On M-series VMs with Premium SSD (v1), Write Accelerator on the /hana/log disks is mandatory for the SAP HANA certification, and Microsoft recommends no host caching on them (portal option None + Write Accelerator). The /hana/shared disks use read caching. Microsoft recommends a 64 KB stripe size for /hana/log and 256 KB for /hana/data.
    fr: Sur les machines virtuelles de série M avec des disques SSD Premium (v1), l'Accélérateur d'écriture sur les disques /hana/log est obligatoire pour la certification SAP HANA, et Microsoft recommande de ne pas activer de cache d'hôte sur ces disques (option None + Write Accelerator du portail). Les disques /hana/shared utilisent le cache en lecture. Microsoft recommande une taille de bande de 64 Ko pour /hana/log et de 256 Ko pour /hana/data.
  options:
    rowa: { en: "Write Accelerator accepts read-only caching, but Microsoft's HANA recommendation for /hana/log is no caching.", fr: "L'Accélérateur d'écriture accepte le cache en lecture seule, mais la recommandation HANA de Microsoft pour /hana/log est l'absence de cache." }
    rw: { en: "Read/write caching is not supported with Write Accelerator and is not recommended for HANA volumes.", fr: "Le cache en lecture/écriture n'est pas pris en charge avec l'Accélérateur d'écriture et n'est pas recommandé pour les volumes HANA." }
    none: { en: "Without Write Accelerator, Premium SSD (v1) on M-series VMs does not meet the HANA certification for /hana/log.", fr: "Sans Accélérateur d'écriture, les disques SSD Premium (v1) sur des machines virtuelles de série M ne respectent pas la certification HANA pour /hana/log." }
    s256: { en: "256 KB is the recommended stripe size for /hana/data, not for /hana/log.", fr: "256 Ko est la taille de bande recommandée pour /hana/data, pas pour /hana/log." }
references:
  - title: SAP HANA Azure virtual machine Premium SSD storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-premium-ssd-v1
  - title: SAP HANA Azure virtual machine storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-storage
