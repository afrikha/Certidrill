id: az120-sr1-app-db-traffic-3
objective: "2.2.6"
type: series_yesno
series: az120-sr1-app-db-traffic
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: |-
    You filter the traffic with an NSG and application security groups in VNet1.
  fr: |-
    Vous filtrez le trafic avec un groupe de sécurité réseau et des groupes de sécurité d'application dans VNet1.
body:
  solution:
    en: |-
      You place the application servers and the HANA VMs in separate subnets of VNet1 and group their network interfaces in two **application security groups**, ASG-App and ASG-HANA. You associate with the database subnet a **network security group** that allows the HANA SQL ports from ASG-App to ASG-HANA and SSH from the jump hosts, and denies all other inbound traffic.
    fr: |-
      Vous placez les serveurs d'applications et les machines virtuelles HANA dans des sous-réseaux distincts de VNet1 et regroupez leurs interfaces réseau dans deux **groupes de sécurité d'application**, ASG-App et ASG-HANA. Vous associez au sous-réseau de base de données un **groupe de sécurité réseau** qui autorise les ports SQL HANA de ASG-App vers ASG-HANA et SSH depuis les hôtes de rebond, et refuse tout autre trafic entrant.
answer: { value: true }
explanation:
  correct:
    en: |-
      Separate subnets of the same virtual network, filtered by subnet-level NSGs that use ASGs, is the recommended design for SAP. NSG and ASG rules don't add latency or restrict performance, and the support restriction on the application-to-DBMS path doesn't include NSG and ASG rules that allow a direct path.
    fr: |-
      Des sous-réseaux distincts du même réseau virtuel, filtrés par des groupes de sécurité réseau au niveau du sous-réseau qui utilisent des groupes de sécurité d'application, constituent la conception recommandée pour SAP. Les règles de groupe de sécurité réseau et de groupe de sécurité d'application n'ajoutent pas de latence et ne limitent pas les performances, et la restriction de prise en charge sur le chemin entre l'application et le SGBD n'inclut pas ces règles lorsqu'elles autorisent un chemin direct.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
