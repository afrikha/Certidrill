id: az120-2b-pe-statements
objective: "2.2.7"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso stores SAP archive files in a geo-redundant (GRS) storage account named **starchsap**. You create a private endpoint for the blob service of starchsap in the SAP virtual network. You don't change any other network setting of the storage account.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso stocke des fichiers d'archive SAP dans un compte de stockage géoredondant (GRS) nommé **starchsap**. Vous créez un point de terminaison privé pour le service blob de starchsap dans le réseau virtuel SAP. Vous ne modifiez aucun autre paramètre réseau du compte de stockage.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Creating the private endpoint blocks the connections that clients on the internet make to the public endpoint of starchsap."
        fr: "La création du point de terminaison privé bloque les connexions établies par des clients d'Internet vers le point de terminaison public de starchsap."
    - id: s2
      text:
        en: "If you later disable public network access on starchsap, the VMs of the SAP virtual network can still use the private endpoint."
        fr: "Si vous désactivez plus tard l'accès au réseau public sur starchsap, les machines virtuelles du réseau virtuel SAP peuvent toujours utiliser le point de terminaison privé."
    - id: s3
      text:
        en: "After a failover of starchsap to the secondary region, you must create a new private endpoint for the new primary instance."
        fr: "Après un basculement de starchsap vers la région secondaire, vous devez créer un nouveau point de terminaison privé pour la nouvelle instance principale."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "A private link doesn't automatically block the public endpoint; you must configure the storage firewall to deny or limit public access. Traffic from the virtual network that has the private endpoint is always allowed, even when public network access is disabled. For failover you don't need a second private endpoint, because the endpoint automatically connects to the new primary; a separate endpoint is only needed for read access to the secondary of an RA-GRS account."
    fr: "Une liaison privée ne bloque pas automatiquement le point de terminaison public ; vous devez configurer le pare-feu de stockage pour refuser ou limiter l'accès public. Le trafic du réseau virtuel qui contient le point de terminaison privé est toujours autorisé, même si l'accès au réseau public est désactivé. Pour un basculement, aucun deuxième point de terminaison privé n'est nécessaire, car le point de terminaison se connecte automatiquement à la nouvelle instance principale ; un point de terminaison distinct n'est requis que pour lire la région secondaire d'un compte RA-GRS."
references:
  - title: Use private endpoints for Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
