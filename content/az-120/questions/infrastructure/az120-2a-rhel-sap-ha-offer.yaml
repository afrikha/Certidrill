id: az120-2a-rhel-sap-ha-offer
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum will deploy two SAP HANA VMs on Red Hat Enterprise Linux 8 in a Pacemaker cluster with HANA System Replication. The VMs must use pay-as-you-go licensing and receive packages from the High Availability repositories and the Update Services for SAP Solutions (E4S) repositories.

    Which Azure Marketplace offer should you use for the VMs?
  fr: |
    Adatum va déployer deux machines virtuelles SAP HANA sur Red Hat Enterprise Linux 8 dans un cluster Pacemaker avec la réplication système HANA. Les machines virtuelles doivent utiliser des licences avec paiement à l'utilisation et recevoir les packages des référentiels High Availability et Update Services for SAP Solutions (E4S).

    Quelle offre de la Place de marché Azure devez-vous utiliser pour les machines virtuelles ?
body:
  options:
    - { id: a, text: "RHEL-SAP-APPS" }
    - { id: b, text: "RHEL" }
    - { id: c, text: "RHEL-SAP-HA" }
    - { id: d, text: "rhel-byos" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      RHEL-SAP-HA (RHEL for SAP with High Availability and Update Services) is entitled to the SAP Solutions and Applications repositories, the High Availability repositories and the E4S repositories. It is billed with the RHEL, SAP and High Availability premiums on top of the compute fee.
    fr: |
      RHEL-SAP-HA (RHEL for SAP with High Availability and Update Services) donne droit aux référentiels SAP Solutions and Applications, aux référentiels High Availability et aux référentiels E4S. Elle est facturée avec les suppléments RHEL, SAP et High Availability en plus du coût de calcul.
  options:
    a:
      en: |
        RHEL-SAP-APPS images are entitled to the SAP Applications and base RHEL repositories, without the High Availability repositories needed by Pacemaker.
      fr: |
        Les images RHEL-SAP-APPS donnent droit aux référentiels SAP Applications et RHEL de base, sans les référentiels High Availability nécessaires à Pacemaker.
    b:
      en: |
        The standard RHEL offer does not include the SAP, High Availability and E4S entitlements.
      fr: |
        L'offre RHEL standard n'inclut pas les droits SAP, High Availability et E4S.
    d:
      en: |
        rhel-byos is a bring-your-own-subscription offer for RHEL 7 whose images are not attached to any repository; it is not pay-as-you-go.
      fr: |
        rhel-byos est une offre BYOS (apportez votre propre abonnement) pour RHEL 7 dont les images ne sont rattachées à aucun référentiel ; ce n'est pas du paiement à l'utilisation.
references:
  - title: Overview of Red Hat Enterprise Linux images in Azure - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/workloads/redhat/redhat-images
