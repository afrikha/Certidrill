id: az120-2b-ppg-zonal-fss
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is designing a highly available SAP S/4HANA system across availability zones 1 and 2 of an Azure region. Latency tests show that the zonal network latency meets the requirements of the application.

    The design must meet the following requirements:

    - Spread the application server VMs across fault domains inside each zone.
    - Keep the flexibility to resize or change the VM types of all SAP layers later.

    What should you include in the design?
  fr: |
    Fabrikam conçoit un système SAP S/4HANA hautement disponible sur les zones de disponibilité 1 et 2 d'une région Azure. Les tests montrent que la latence réseau dans les zones répond aux exigences de l'application.

    La conception doit répondre aux exigences suivantes :

    - Répartir les machines virtuelles de serveur d'applications sur des domaines d'erreur à l'intérieur de chaque zone.
    - Conserver la possibilité de redimensionner ou de changer plus tard le type des machines virtuelles de toutes les couches SAP.

    Que devez-vous inclure dans la conception ?
body:
  options:
    - id: a
      text: { en: "A Virtual Machine Scale Set with Flexible orchestration across the zones with a fault domain count of 1, and no proximity placement group", fr: "Un groupe de machines virtuelles identiques avec orchestration flexible réparti sur les zones avec un nombre de domaines d'erreur de 1, sans groupe de placement de proximité" }
    - id: b
      text: { en: "One proximity placement group per zone, scoped by the database VM, with an availability set for the application servers", fr: "Un groupe de placement de proximité par zone, ancré par la machine virtuelle de base de données, avec un groupe à haute disponibilité pour les serveurs d'applications" }
    - id: c
      text: { en: "One proximity placement group that contains the VMs of both zones", fr: "Un groupe de placement de proximité unique contenant les machines virtuelles des deux zones" }
    - id: d
      text: { en: "One availability set per zone for the application servers, without a proximity placement group", fr: "Un groupe à haute disponibilité par zone pour les serveurs d'applications, sans groupe de placement de proximité" }
answer: { optionId: a }
explanation:
  correct:
    en: "Microsoft recommends deploying SAP across zones with a flexible scale set that uses FD=1, which is the only scale set configuration supported for SAP. The VMs aren't tied to a single datacenter spine, so all layers can be resized, and the scale set spreads the VMs across fault domains inside each zone on a best-effort basis. Proximity placement groups should be used only when zonal latency is too high."
    fr: "Microsoft recommande de déployer SAP sur plusieurs zones avec un groupe identique flexible configuré avec FD=1, seule configuration de groupe identique prise en charge pour SAP. Les machines virtuelles ne sont pas liées à une seule colonne vertébrale réseau de centre de données : toutes les couches peuvent être redimensionnées, et le groupe identique répartit au mieux les machines virtuelles sur des domaines d'erreur dans chaque zone. Les groupes de placement de proximité ne doivent être utilisés que si la latence dans une zone est trop élevée."
  options:
    b:
      en: "This is the older zonal PPG model; putting the DBMS VM in the PPG limits resizing, and a PPG isn't needed when zonal latency is acceptable."
      fr: "C'est l'ancien modèle de PPG zonal ; placer la machine virtuelle SGBD dans le PPG limite le redimensionnement, et un PPG est inutile si la latence zonale est acceptable."
    c:
      en: "A single proximity placement group can't span availability zones."
      fr: "Un groupe de placement de proximité ne peut pas couvrir plusieurs zones de disponibilité."
    d:
      en: "An availability set can't be placed in an availability zone unless a proximity placement group is used."
      fr: "Un groupe à haute disponibilité ne peut pas être placé dans une zone de disponibilité sans groupe de placement de proximité."
references:
  - title: Configuration options to minimize network latency with SAP applications
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/proximity-placement-scenarios
  - title: SAP workload configurations with Azure Availability Zones
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones
