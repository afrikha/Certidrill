id: az120-2c-wa-vm-family
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders plans to deploy a production SAP HANA database on Azure. To reuse its existing storage design, the **/hana/log** volume must be built on Premium SSD disks with Write Accelerator enabled.

    Which virtual machine size should you use?
  fr: |
    Northwind Traders prévoit de déployer une base de données SAP HANA de production sur Azure. Pour réutiliser sa conception de stockage existante, le volume **/hana/log** doit être créé sur des disques SSD Premium avec l'Accélérateur d'écriture activé.

    Quelle taille de machine virtuelle devez-vous utiliser ?
body:
  options:
    - { id: a, text: Standard_E64ds_v5 }
    - { id: b, text: Standard_E96ds_v5 }
    - { id: c, text: Standard_M64s }
    - { id: d, text: Standard_D64ds_v5 }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Write Accelerator is available only for M-series VMs (including Mv2 and Mv3) with Premium SSD managed disks. Standard_M64s supports up to eight Write Accelerator disks, so /hana/log on Premium SSD can meet the HANA latency KPIs.
    fr: |
      L'Accélérateur d'écriture n'est disponible que pour les machines virtuelles de la série M (y compris Mv2 et Mv3) avec des disques managés SSD Premium. Standard_M64s prend en charge jusqu'à huit disques avec Accélérateur d'écriture : /hana/log sur SSD Premium peut ainsi respecter les KPI de latence de HANA.
  options:
    a: { en: "E-series VMs don't support Write Accelerator.", fr: "Les machines virtuelles de la série E ne prennent pas en charge l'Accélérateur d'écriture." }
    b: { en: "E-series VMs don't support Write Accelerator, whatever their size.", fr: "Les machines virtuelles de la série E ne prennent pas en charge l'Accélérateur d'écriture, quelle que soit leur taille." }
    d: { en: "D-series VMs don't support Write Accelerator.", fr: "Les machines virtuelles de la série D ne prennent pas en charge l'Accélérateur d'écriture." }
references:
  - title: Azure Write Accelerator
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/how-to-enable-write-accelerator
