id: az120-2b-an-benefits
objective: "2.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum is preparing the design document for an SAP S/4HANA landscape on Azure. The network team asks why the design requires Accelerated Networking on the SAP application server VMs and on the SAP HANA VMs.

    Which two benefits should you list in the design document?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prépare le document de conception d'un paysage SAP S/4HANA sur Azure. L'équipe réseau demande pourquoi la conception exige Accelerated Networking sur les machines virtuelles de serveur d'applications SAP et sur les machines virtuelles SAP HANA.

    Quels sont les deux avantages à indiquer dans le document de conception ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Lower latency, less jitter and more packets per second between the VMs", fr: "Une latence plus faible, moins de gigue et davantage de paquets par seconde entre les machines virtuelles" } }
    - { id: b, text: { en: "Lower CPU utilization for network processing in the VMs", fr: "Une utilisation moindre du processeur pour le traitement réseau dans les machines virtuelles" } }
    - { id: c, text: { en: "A higher maximum number of network interfaces per VM", fr: "Un nombre maximal plus élevé d'interfaces réseau par machine virtuelle" } }
    - { id: d, text: { en: "Encryption of the traffic between the application servers and the database", fr: "Le chiffrement du trafic entre les serveurs d'applications et la base de données" } }
    - { id: e, text: { en: "Traffic that bypasses the network security group rules of the subnets", fr: "Un trafic qui contourne les règles des groupes de sécurité réseau des sous-réseaux" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "Accelerated Networking uses SR-IOV so that traffic goes directly between the VM and the host NIC, bypassing the host virtual switch. This lowers latency and jitter, raises packets per second and reduces the CPU time spent on network processing, which matters for the chatty traffic between SAP application servers and the DBMS."
    fr: "Accelerated Networking utilise SR-IOV pour que le trafic circule directement entre la machine virtuelle et la carte réseau de l'hôte, sans passer par le commutateur virtuel de l'hôte. La latence et la gigue diminuent, le nombre de paquets par seconde augmente et le temps processeur consacré au réseau baisse, ce qui compte pour le trafic très bavard entre les serveurs d'applications SAP et le SGBD."
  options:
    c: { en: "The number of NICs depends on the VM type and size, not on Accelerated Networking.", fr: "Le nombre de cartes réseau dépend du type et de la taille de la machine virtuelle, pas d'Accelerated Networking." }
    d: { en: "Accelerated Networking doesn't encrypt traffic.", fr: "Accelerated Networking ne chiffre pas le trafic." }
    e: { en: "The NIC enforces the same policies, including NSG rules, in hardware.", fr: "La carte réseau applique les mêmes stratégies, y compris les règles NSG, au niveau matériel." }
references:
  - title: Azure Accelerated Networking Overview and Benefits
    url: https://learn.microsoft.com/en-us/azure/virtual-network/accelerated-networking-overview
