id: az120-2c-cmk-disks
objective: "2.3.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys runs SAP HANA virtual machines in the Sweden Central region. A security policy requires that all managed disks of the SAP VMs be encrypted at rest with keys that Wingtip creates and controls, and that new key versions be applied to the disks automatically.

    You need to design the key configuration.

    How should you complete the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys exécute des machines virtuelles SAP HANA dans la région Sweden Central. Une stratégie de sécurité exige que tous les disques managés des machines virtuelles SAP soient chiffrés au repos avec des clés que Wingtip crée et contrôle, et que les nouvelles versions de clé soient appliquées automatiquement aux disques.

    Vous devez concevoir la configuration des clés.

    Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Store the key in: [[store]]

      Key type: [[key]]

      Resource that links the key to the disks and supports automatic key rotation: [[obj]]
    fr: |
      Stocker la clé dans : [[store]]

      Type de clé : [[key]]

      Ressource qui relie la clé aux disques et prend en charge la rotation automatique des clés : [[obj]]
  slots:
    - id: store
      options:
        - { id: kvsame, text: { en: "An Azure Key Vault in Sweden Central", fr: "Un coffre Azure Key Vault dans Sweden Central" } }
        - { id: kvother, text: { en: "An Azure Key Vault in West Europe", fr: "Un coffre Azure Key Vault dans West Europe" } }
        - { id: appconf, text: { en: "An Azure App Configuration store in Sweden Central", fr: "Un magasin Azure App Configuration dans Sweden Central" } }
    - id: key
      options:
        - { id: rsa1024, text: { en: "RSA, 1,024-bit", fr: "RSA, 1 024 bits" } }
        - { id: rsa3072, text: { en: "RSA, 3,072-bit", fr: "RSA, 3 072 bits" } }
        - { id: ec256, text: { en: "Elliptic curve, P-256", fr: "Courbe elliptique, P-256" } }
    - id: obj
      options:
        - { id: des, text: { en: "A disk encryption set", fr: "Un jeu de chiffrement de disque" } }
        - { id: scope, text: { en: "An encryption scope", fr: "Une étendue de chiffrement" } }
        - { id: guard, text: Resource Guard }
answer:
  values: { store: kvsame, key: rsa3072, obj: des }
explanation:
  correct:
    en: |
      Customer-managed keys for managed disks must be stored in a key store in the same region as the disks, and only RSA keys of 2,048, 3,072 or 4,096 bits are supported. A disk encryption set references the key; when automatic rotation is enabled on it, all disks, snapshots and images that use it move to the new key version within one hour.
    fr: |
      Les clés gérées par le client des disques managés doivent être stockées dans un magasin de clés situé dans la même région que les disques, et seules les clés RSA de 2 048, 3 072 ou 4 096 bits sont prises en charge. Un jeu de chiffrement de disque référence la clé ; lorsque la rotation automatique y est activée, tous les disques, instantanés et images qui l'utilisent passent à la nouvelle version de clé en moins d'une heure.
  options:
    kvother: { en: "The key store must be in the same region as the managed disks.", fr: "Le magasin de clés doit se trouver dans la même région que les disques managés." }
    ec256: { en: "Elliptic curve keys aren't supported for disk encryption.", fr: "Les clés à courbe elliptique ne sont pas prises en charge pour le chiffrement des disques." }
    scope: { en: "Encryption scopes apply to Blob Storage containers and blobs, not to managed disks.", fr: "Les étendues de chiffrement s'appliquent aux conteneurs et aux blobs du Stockage Blob, pas aux disques managés." }
references:
  - title: Server-side encryption of Azure managed disks
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption
