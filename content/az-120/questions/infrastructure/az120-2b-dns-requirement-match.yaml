id: az120-2b-dns-requirement-match
objective: "2.2.8"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin uses Azure-provided DNS in its SAP virtual networks, with Azure private DNS zones and an Azure DNS Private Resolver deployed in the hub. The on-premises Active Directory domain is **corp.tailspin.com**.

    Which solution should you use for each requirement? To answer, drag the appropriate solutions to the correct requirements. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin utilise le DNS fourni par Azure dans ses réseaux virtuels SAP, avec des zones DNS privées Azure et un Azure DNS Private Resolver déployé dans le hub. Le domaine Active Directory local est **corp.tailspin.com**.

    Quelle solution devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les solutions appropriées vers les exigences correspondantes. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: outbound, text: { en: "Outbound endpoint with a DNS forwarding ruleset linked to the SAP virtual networks", fr: "Point de terminaison sortant avec un ensemble de règles de transfert DNS lié aux réseaux virtuels SAP" } }
    - { id: inbound, text: { en: "Inbound endpoint of the DNS Private Resolver", fr: "Point de terminaison entrant du DNS Private Resolver" } }
    - { id: autoreg, text: { en: "Virtual network link with autoregistration enabled", fr: "Lien de réseau virtuel avec l'inscription automatique activée" } }
    - { id: manual, text: { en: "A record created manually in the private DNS zone", fr: "Enregistrement A créé manuellement dans la zone DNS privée" } }
    - { id: public, text: { en: "Azure public DNS zone", fr: "Zone DNS publique Azure" } }
  targets:
    - id: t1
      text: { en: "SAP VMs in Azure must resolve names in corp.tailspin.com without DNS server VMs", fr: "Les machines virtuelles SAP dans Azure doivent résoudre les noms de corp.tailspin.com sans machines virtuelles de serveur DNS" }
    - id: t2
      text: { en: "Records for new SAP VMs must be created and removed automatically", fr: "Les enregistrements des nouvelles machines virtuelles SAP doivent être créés et supprimés automatiquement" }
    - id: t3
      text: { en: "The SAP ASCS virtual host name must resolve to the frontend IP address of the internal load balancer", fr: "Le nom d'hôte virtuel SAP ASCS doit être résolu en adresse IP frontale de l'équilibreur de charge interne" }
answer:
  mapping: { t1: outbound, t2: autoreg, t3: manual }
explanation:
  correct:
    en: "An outbound endpoint, with a forwarding ruleset linked to the virtual networks, conditionally forwards corp.tailspin.com queries from Azure to the on-premises DNS servers. A virtual network link with autoregistration creates and removes A records for VMs. Autoregistration doesn't cover internal load balancers, so the virtual host name needs a manual A record. The inbound endpoint serves queries that come from on-premises, the opposite direction."
    fr: "Un point de terminaison sortant, avec un ensemble de règles de transfert lié aux réseaux virtuels, transfère de manière conditionnelle les requêtes corp.tailspin.com depuis Azure vers les serveurs DNS locaux. Un lien de réseau virtuel avec inscription automatique crée et supprime les enregistrements A des machines virtuelles. L'inscription automatique ne couvre pas les équilibreurs de charge internes : le nom d'hôte virtuel nécessite un enregistrement A manuel. Le point de terminaison entrant sert les requêtes venant du site local, dans le sens inverse."
references:
  - title: Azure DNS Private Resolver Overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
  - title: What is autoregistration feature in Azure DNS private zones?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-autoregistration
