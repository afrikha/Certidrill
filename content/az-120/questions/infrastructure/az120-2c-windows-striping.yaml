id: az120-2c-windows-striping
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum runs the database of an SAP ERP system on SQL Server on a Windows Server 2022 virtual machine. The data files must be placed on one volume that combines the IOPS and throughput of eight Premium SSD data disks.

    Which technology should you use to build the volume?
  fr: |
    Adatum exécute la base de données d'un système SAP ERP sur SQL Server, sur une machine virtuelle Windows Server 2022. Les fichiers de données doivent être placés sur un volume qui cumule les IOPS et le débit de huit disques de données SSD Premium.

    Quelle technologie devez-vous utiliser pour créer le volume ?
body:
  options:
    - { id: a, text: { en: "Storage Replica", fr: "Réplica de stockage" } }
    - { id: b, text: { en: "A RAID-5 volume on dynamic disks", fr: "Un volume RAID-5 sur des disques dynamiques" } }
    - { id: c, text: { en: "Windows Storage Spaces", fr: "Les espaces de stockage Windows" } }
    - { id: d, text: { en: "Data Deduplication", fr: "La déduplication des données" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft recommends Windows Storage Spaces to build stripe sets across several Azure disks on Windows (Windows Server 2012 R2 or later). The stripe spreads the I/O over all disks so that their IOPS and throughput add up.
    fr: |
      Microsoft recommande les espaces de stockage Windows pour créer des jeux entrelacés sur plusieurs disques Azure sous Windows (Windows Server 2012 R2 ou version ultérieure). L'entrelacement répartit les E/S sur tous les disques afin de cumuler leurs IOPS et leur débit.
  options:
    a: { en: "Storage Replica replicates volumes between servers; it doesn't combine disks.", fr: "Le réplica de stockage réplique des volumes entre serveurs ; il ne combine pas de disques." }
    b: { en: "Parity adds redundancy that Azure storage already provides and penalizes writes; Storage Spaces is the recommended method.", fr: "La parité ajoute une redondance que le stockage Azure fournit déjà et pénalise les écritures ; les espaces de stockage sont la méthode recommandée." }
    d: { en: "Data Deduplication reduces stored data; it doesn't aggregate disk performance.", fr: "La déduplication des données réduit le volume stocké ; elle ne cumule pas les performances des disques." }
references:
  - title: Considerations for Azure VMs DBMS deployment for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/dbms-guide-general
