id: az120-2a-acss-cli-create
objective: "2.1.7"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are automating the deployment of SAP systems with Azure Center for SAP solutions. You have a payload file named **s4p-payload.json** that describes a distributed highly available S/4HANA system, and an existing managed identity named **id-acss** that has the required role assignments.

    You need to create the Virtual Instance for SAP solutions named **S4P** and deploy its infrastructure by using the Azure CLI.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous automatisez le déploiement de systèmes SAP avec le Centre Azure pour les solutions SAP. Vous disposez d'un fichier de charge utile nommé **s4p-payload.json** qui décrit un système S/4HANA distribué à haute disponibilité, et d'une identité managée existante nommée **id-acss** qui dispose des attributions de rôles requises.

    Vous devez créer la Virtual Instance for SAP solutions nommée **S4P** et déployer son infrastructure avec Azure CLI.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az workloads [[cmd]] \
      -g RG-S4P -n S4P \
      --environment Prod \
      --sap-product s4hana \
      --configuration ./s4p-payload.json \
      --identity "{type:[[idtype]],userAssignedIdentities:{<resource ID of id-acss>:{}}}"
  slots:
    - id: cmd
      options:
        - { id: sizing, text: sap-sizing-recommendation }
        - { id: sku, text: sap-supported-sku }
        - { id: create, text: sap-virtual-instance create }
        - { id: delete, text: sap-virtual-instance delete }
    - id: idtype
      options:
        - { id: sys, text: SystemAssigned }
        - { id: user, text: UserAssigned }
        - { id: none, text: None }
answer:
  values: { cmd: create, idtype: user }
explanation:
  correct:
    en: |
      `az workloads sap-virtual-instance create` creates the VIS and deploys the infrastructure described in the payload file. The service works with a user-assigned managed identity, passed with `type:UserAssigned` and its resource ID in `userAssignedIdentities`.
    fr: |
      `az workloads sap-virtual-instance create` crée la VIS et déploie l'infrastructure décrite dans le fichier de charge utile. Le service fonctionne avec une identité managée affectée par l'utilisateur, transmise avec `type:UserAssigned` et son ID de ressource dans `userAssignedIdentities`.
  options:
    sizing:
      en: |
        sap-sizing-recommendation returns VM SKU recommendations from SAPS and database memory; it deploys nothing.
      fr: |
        sap-sizing-recommendation renvoie des recommandations de références SKU de machines virtuelles à partir des SAPS et de la mémoire de la base de données ; il ne déploie rien.
    sku:
      en: |
        sap-supported-sku lists the supported VM SKUs for a configuration; it deploys nothing.
      fr: |
        sap-supported-sku liste les références SKU de machines virtuelles prises en charge pour une configuration ; il ne déploie rien.
    delete:
      en: |
        sap-virtual-instance delete removes a VIS and its related service resources, not the VMs and disks.
      fr: |
        sap-virtual-instance delete supprime une VIS et ses ressources de service associées, pas les machines virtuelles ni les disques.
    sys:
      en: |
        The deployment uses the user-assigned identity id-acss; a system-assigned identity would not carry its role assignments.
      fr: |
        Le déploiement utilise l'identité affectée par l'utilisateur id-acss ; une identité affectée par le système ne porterait pas ses attributions de rôles.
references:
  - title: Create infrastructure for a distributed highly available SAP system with customized resource names using Azure CLI
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/tutorial-create-high-availability-name-custom
