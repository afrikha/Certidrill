id: az120-2b-ppg-statements
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank plans to use proximity placement groups (PPGs) for an SAP system whose application layer is very sensitive to network latency. The PPGs will be created with the `intent` property that lists the planned VM sizes.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit d'utiliser des groupes de placement de proximité (PPG) pour un système SAP dont la couche Application est très sensible à la latence réseau. Les PPG seront créés avec la propriété `intent` qui liste les tailles de machines virtuelles prévues.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A single PPG can contain VMs deployed in availability zone 1 and VMs deployed in availability zone 2."
        fr: "Un même PPG peut contenir des machines virtuelles déployées dans la zone de disponibilité 1 et d'autres déployées dans la zone de disponibilité 2."
    - id: s2
      text:
        en: "When all the resources of a PPG are stopped (deallocated) or deleted, the PPG is no longer pinned to a datacenter."
        fr: "Quand toutes les ressources d'un PPG sont arrêtées (libérées) ou supprimées, le PPG n'est plus ancré à un centre de données."
    - id: s3
      text:
        en: "Listing VM sizes in the intent reserves capacity for those sizes in the selected datacenter."
        fr: "Lister des tailles de machines virtuelles dans l'intention réserve de la capacité pour ces tailles dans le centre de données sélectionné."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "A PPG is pinned to a datacenter when its first resource is deployed and becomes unpinned once all its resources are deallocated or deleted. A single PPG can't span zones, which is why zonal SAP designs use one PPG per zone. The intent only makes Azure choose a datacenter that offers all the listed sizes; it gives no capacity reservation, so allocation failures remain possible."
    fr: "Un PPG est ancré à un centre de données au déploiement de sa première ressource et cesse de l'être quand toutes ses ressources sont libérées ou supprimées. Un PPG ne peut pas couvrir plusieurs zones, d'où un PPG par zone dans les conceptions SAP zonales. L'intention amène seulement Azure à choisir un centre de données qui propose toutes les tailles listées ; elle ne réserve aucune capacité, et des échecs d'allocation restent possibles."
references:
  - title: Proximity placement groups
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/co-location
