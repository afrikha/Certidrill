id: az120-2c-stripe-statements
objective: "2.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is reviewing the volume design of several SAP HANA virtual machines. Some VMs use Premium SSD v2 disks and others use Azure NetApp Files NFS volumes.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank examine la conception des volumes de plusieurs machines virtuelles SAP HANA. Certaines machines virtuelles utilisent des disques SSD Premium v2 et d'autres des volumes NFS Azure NetApp Files.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To give a Premium SSD v2 /hana/log volume more than 3,000 IOPS, you must stripe it over several disks.
        fr: Pour qu'un volume /hana/log sur SSD Premium v2 dépasse 3 000 IOPS, vous devez l'entrelacer sur plusieurs disques.
    - id: s2
      text:
        en: When you stripe Premium SSD v2 disks, every disk of the stripe set must have the same capacity, provisioned IOPS and provisioned throughput.
        fr: Lorsque vous entrelacez des disques SSD Premium v2, chaque disque du jeu entrelacé doit avoir la même capacité, les mêmes IOPS provisionnées et le même débit provisionné.
    - id: s3
      text:
        en: You can build an LVM stripe set over several Azure NetApp Files NFS volumes to create a single /hana/data file system.
        fr: Vous pouvez créer un jeu entrelacé LVM sur plusieurs volumes NFS Azure NetApp Files pour obtenir un seul système de fichiers /hana/data.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Premium SSD v2 includes 3,000 IOPS and 125 MB/s at no charge, and you can provision more IOPS and throughput on the same disk, so striping isn't needed to exceed the baseline. If you do stripe Premium SSD v2 or Ultra Disk, capacity, IOPS and throughput must match on every disk. NFS and SMB shares can't be striped with a volume manager; to spread HANA data over several NFS volumes, you use SAP HANA data volume partitioning instead.
    fr: |
      Le SSD Premium v2 inclut gratuitement 3 000 IOPS et 125 Mo/s, et vous pouvez provisionner davantage d'IOPS et de débit sur le même disque : l'entrelacement n'est donc pas nécessaire pour dépasser cette base. Si vous entrelacez quand même des disques SSD Premium v2 ou Ultra, la capacité, les IOPS et le débit doivent être identiques sur chaque disque. Les partages NFS et SMB ne peuvent pas être entrelacés avec un gestionnaire de volumes ; pour répartir les données HANA sur plusieurs volumes NFS, vous utilisez plutôt le partitionnement des volumes de données SAP HANA.
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
  - title: Select a disk type for Azure IaaS VMs - managed disks
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types
