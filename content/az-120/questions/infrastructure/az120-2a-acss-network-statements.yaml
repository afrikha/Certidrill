id: az120-2a-acss-network-statements
objective: "2.1.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is preparing a virtual network for a new SAP system that will be deployed by Azure Center for SAP solutions. The VMs will have no direct internet access.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam prépare un réseau virtuel pour un nouveau système SAP qui sera déployé par le Centre Azure pour les solutions SAP. Les machines virtuelles n'auront pas d'accès direct à Internet.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Fabrikam can use AzureBastionSubnet as the application subnet of the SAP system.
        fr: |
          Fabrikam peut utiliser AzureBastionSubnet comme sous-réseau d'application du système SAP.
    - id: s2
      text:
        en: |
          Outbound access must be allowed to Azure Storage, Azure Key Vault, Microsoft Entra ID, Azure Resource Manager and the SUSE or Red Hat update endpoints.
        fr: |
          L'accès sortant doit être autorisé vers Stockage Azure, Azure Key Vault, Microsoft Entra ID, Azure Resource Manager et les points de terminaison de mise à jour SUSE ou Red Hat.
    - id: s3
      text:
        en: |
          The application VMs and the database VMs go into separate subnets, and traffic between the two subnets must be allowed.
        fr: |
          Les machines virtuelles d'application et de base de données vont dans des sous-réseaux distincts, et le trafic entre les deux sous-réseaux doit être autorisé.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      AzureFirewallSubnet, AzureFirewallManagementSubnet, AzureBastionSubnet and GatewaySubnet are reserved names that the SAP subnets must not use. Without internet access, the deployment and the software installation need outbound access to the SUSE or Red Hat endpoints, storage accounts, Key Vault, Microsoft Entra ID and Azure Resource Manager, for example through service tags. The service needs separate application and database subnets that can communicate.
    fr: |
      AzureFirewallSubnet, AzureFirewallManagementSubnet, AzureBastionSubnet et GatewaySubnet sont des noms réservés que les sous-réseaux SAP ne doivent pas utiliser. Sans accès à Internet, le déploiement et l'installation des logiciels ont besoin d'un accès sortant vers les points de terminaison SUSE ou Red Hat, les comptes de stockage, Key Vault, Microsoft Entra ID et Azure Resource Manager, par exemple avec des étiquettes de service. Le service exige des sous-réseaux d'application et de base de données distincts qui peuvent communiquer.
references:
  - title: Prepare a network for infrastructure deployment
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/prepare-network
