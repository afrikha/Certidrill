id: az120-2a-sdaf-components
objective: "2.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is designing an SAP landscape that will be deployed with SAP Deployment Automation Framework. The architects must map each responsibility to the right component of the framework.

    Which component should you map to each responsibility? To answer, drag the appropriate components to the correct responsibilities. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam conçoit un paysage SAP qui sera déployé avec SAP Deployment Automation Framework. Les architectes doivent associer chaque responsabilité au bon composant du framework.

    Quel composant devez-vous associer à chaque responsabilité ? Pour répondre, faites glisser les composants appropriés vers les responsabilités correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: deployer, text: { en: "Deployer", fr: "Machine virtuelle de déploiement (deployer)" } }
    - { id: library, text: { en: "SAP library", fr: "Bibliothèque SAP" } }
    - { id: zone, text: { en: "SAP workload zone", fr: "Zone de charge de travail SAP" } }
    - { id: system, text: { en: "SAP system", fr: "Système SAP" } }
    - { id: vis, text: { en: "Virtual Instance for SAP solutions", fr: "Virtual Instance for SAP solutions" } }
  targets:
    - id: run
      text: { en: "Runs Terraform and acts as the Ansible controller", fr: "Exécute Terraform et sert de contrôleur Ansible" }
    - id: state
      text: { en: "Stores the Terraform state files and the SAP installation media", fr: "Stocke les fichiers d'état Terraform et les médias d'installation SAP" }
    - id: env
      text: { en: "Provides the virtual network and the credentials key vault shared by the systems of one environment", fr: "Fournit le réseau virtuel et le coffre de clés d'informations d'identification partagés par les systèmes d'un environnement" }
    - id: sid
      text: { en: "Contains the VMs, disks and load balancers of one SID in a dedicated resource group", fr: "Contient les machines virtuelles, disques et équilibreurs de charge d'un SID dans un groupe de ressources dédié" }
answer:
  mapping: { run: deployer, state: library, env: zone, sid: system }
explanation:
  correct:
    en: |
      In the control plane, the deployer VMs run the Terraform deployments and are the Ansible controllers, and the SAP library holds the Terraform state files and the SAP installation media. A workload zone partitions deployments into environments such as DEV or PRD and provides the VNet and a key vault for system credentials. An SAP system is the deployment unit of one SID, in its own resource group.
    fr: |
      Dans le plan de contrôle, les machines virtuelles de déploiement exécutent les déploiements Terraform et servent de contrôleurs Ansible, et la bibliothèque SAP contient les fichiers d'état Terraform et les médias d'installation SAP. Une zone de charge de travail répartit les déploiements en environnements comme DEV ou PRD et fournit le réseau virtuel et un coffre de clés pour les informations d'identification des systèmes. Un système SAP est l'unité de déploiement d'un SID, dans son propre groupe de ressources.
  options:
    vis:
      en: |
        A Virtual Instance for SAP solutions is the Azure Center for SAP solutions resource that represents an SAP system; it is not a framework component.
      fr: |
        Une Virtual Instance for SAP solutions est la ressource du Centre Azure pour les solutions SAP qui représente un système SAP ; ce n'est pas un composant du framework.
references:
  - title: About SAP Deployment Automation Framework
    url: https://learn.microsoft.com/en-us/azure/sap/automation/deployment-framework
  - title: Deploy SAP workload zones with the automation framework
    url: https://learn.microsoft.com/en-us/azure/sap/automation/deploy-workload-zone
