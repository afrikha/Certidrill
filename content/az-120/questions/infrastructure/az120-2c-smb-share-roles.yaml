id: az120-2c-smb-share-roles
objective: "2.3.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is installing a highly available SAP NetWeaver system with SID **TS1** on Windows Server. The **sapmnt** share is an SMB share on Azure Files SSD, and the storage account is joined to the on-premises Active Directory Domain Services (AD DS) domain by using the Azure Files hybrid script.

    You need to grant the required permissions. The solution must follow the principle of least privilege.

    Which role should you assign to each principal? To answer, drag the appropriate roles to the correct principals. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys installe un système SAP NetWeaver hautement disponible de SID **TS1** sur Windows Server. Le partage **sapmnt** est un partage SMB sur Azure Files SSD, et le compte de stockage est joint au domaine Active Directory Domain Services (AD DS) local au moyen du script hybride Azure Files.

    Vous devez accorder les autorisations nécessaires. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à chaque principal ? Pour répondre, faites glisser les rôles appropriés vers les principaux correspondants. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: elev, text: Storage File Data SMB Share Elevated Contributor }
    - { id: contrib, text: Storage File Data SMB Share Contributor }
    - { id: reader, text: Storage File Data SMB Share Reader }
    - { id: rgcontrib, text: Contributor }
    - { id: keyop, text: Storage Account Key Operator Service Role }
  targets:
    - id: sap
      text: { en: "ts1adm, SAPServiceTS1 and SAP_TS1_GlobalAdmin, which need full control of the sapmnt directory, including its NTFS permissions", fr: "ts1adm, SAPServiceTS1 et SAP_TS1_GlobalAdmin, qui ont besoin du contrôle total du répertoire sapmnt, y compris de ses autorisations NTFS" }
    - id: script
      text: { en: "Microsoft Entra user who runs the hybrid script that joins the storage account to AD DS, at the resource group scope", fr: "Utilisateur Microsoft Entra qui exécute le script hybride joignant le compte de stockage à AD DS, à l'étendue du groupe de ressources" }
    - id: audit
      text: { en: "Audit account that only reads the profile files stored on the share", fr: "Compte d'audit qui lit uniquement les fichiers de profil stockés sur le partage" }
answer:
  mapping: { sap: elev, script: rgcontrib, audit: reader }
explanation:
  correct:
    en: |
      The SAP accounts and the SAP_<SID>_GlobalAdmin group receive Storage File Data SMB Share Elevated Contributor, which adds the right to change NTFS permissions to read, write and delete access. The user who runs the AD DS join script needs Contributor on the resource group that contains the storage account. An account that only reads files needs Storage File Data SMB Share Reader.
    fr: |
      Les comptes SAP et le groupe SAP_<SID>_GlobalAdmin reçoivent Storage File Data SMB Share Elevated Contributor, qui ajoute le droit de modifier les autorisations NTFS aux accès en lecture, écriture et suppression. L'utilisateur qui exécute le script de jonction à AD DS a besoin du rôle Contributor sur le groupe de ressources du compte de stockage. Un compte qui lit seulement des fichiers a besoin de Storage File Data SMB Share Reader.
  options:
    contrib: { en: "Storage File Data SMB Share Contributor allows read, write and delete but not changing NTFS permissions, which the SAP accounts need.", fr: "Storage File Data SMB Share Contributor permet la lecture, l'écriture et la suppression, mais pas la modification des autorisations NTFS dont les comptes SAP ont besoin." }
    keyop: { en: "This role lists and regenerates account keys; it isn't needed and would bypass identity-based access.", fr: "Ce rôle liste et régénère les clés du compte ; il n'est pas nécessaire et contournerait l'accès basé sur l'identité." }
references:
  - title: Install high-availability SAP NetWeaver with Azure Files SMB
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-windows-azure-files-smb
