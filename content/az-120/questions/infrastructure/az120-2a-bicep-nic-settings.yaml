id: az120-2a-bicep-nic-settings
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove is writing a Bicep file for the network interface of an SAP HANA database VM. The network interface must meet the following requirements:

    - Use Accelerated Networking.
    - Keep the private IP address 10.20.2.10, assigned by Azure rather than inside the guest OS.

    Which two settings should you include in the network interface resource? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove écrit un fichier Bicep pour l'interface réseau d'une machine virtuelle de base de données SAP HANA. L'interface réseau doit répondre aux exigences suivantes :

    - Utiliser Accelerated Networking.
    - Conserver l'adresse IP privée 10.20.2.10, attribuée par Azure plutôt que dans le système d'exploitation invité.

    Quels sont les deux paramètres à inclure dans la ressource d'interface réseau ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "`enableIPForwarding: true` in the properties of the network interface", fr: "`enableIPForwarding: true` dans les propriétés de l'interface réseau" } }
    - { id: b, text: { en: "`enableAcceleratedNetworking: true` in the properties of the network interface", fr: "`enableAcceleratedNetworking: true` dans les propriétés de l'interface réseau" } }
    - { id: c, text: { en: "`privateIPAllocationMethod: 'Static'` and `privateIPAddress: '10.20.2.10'` in the IP configuration", fr: "`privateIPAllocationMethod: 'Static'` et `privateIPAddress: '10.20.2.10'` dans la configuration IP" } }
    - { id: d, text: { en: "`privateIPAllocationMethod: 'Dynamic'` and a cloud-init script that sets 10.20.2.10 in the OS", fr: "`privateIPAllocationMethod: 'Dynamic'` et un script cloud-init qui définit 10.20.2.10 dans le système d'exploitation" } }
    - { id: e, text: { en: "`publicIPAddress` that references a Standard SKU public IP address in the IP configuration", fr: "`publicIPAddress` qui référence une adresse IP publique de référence SKU Standard dans la configuration IP" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Accelerated Networking is enabled per network interface with `enableAcceleratedNetworking: true`, and Microsoft asks for it on all SAP VMs where it is technically possible. A static private IP is set in the Azure IP configuration with the Static allocation method and the address; Microsoft advises against setting static IPs inside the guest OS.
    fr: |
      Accelerated Networking s'active par interface réseau avec `enableAcceleratedNetworking: true`, et Microsoft le demande sur toutes les machines virtuelles SAP où c'est techniquement possible. Une adresse IP privée statique se définit dans la configuration IP Azure avec la méthode d'allocation Static et l'adresse ; Microsoft déconseille de définir des adresses IP statiques dans le système d'exploitation invité.
  options:
    a:
      en: |
        IP forwarding lets a NIC forward traffic for other destinations, as an NVA does; it is not Accelerated Networking.
      fr: |
        Le transfert IP permet à une carte réseau de relayer du trafic destiné à d'autres adresses, comme une NVA ; ce n'est pas Accelerated Networking.
    d:
      en: |
        Setting the address in the guest OS is what Microsoft advises against; Azure Backup also relies on the primary NIC using DHCP inside the OS.
      fr: |
        Définir l'adresse dans le système d'exploitation invité est justement déconseillé par Microsoft ; Sauvegarde Azure s'appuie aussi sur l'usage de DHCP par la carte réseau principale dans le système d'exploitation.
    e:
      en: |
        A public IP address is not required by either requirement and exposes the database VM.
      fr: |
        Aucune exigence ne demande d'adresse IP publique, qui exposerait la machine virtuelle de base de données.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
  - title: "Quickstart: Use a Bicep file to create an Ubuntu Linux VM - Azure Virtual Machines"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/quick-create-bicep
