id: az120-2a-sdaf-media-secrets
objective: "2.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware deployed the control plane of SAP Deployment Automation Framework and a workload zone named **DEV-WEEU-SAP01**. On the deployer, you created a sap-parameters.yaml file that sets `bom_base_name` and sets `kv_name` to the key vault of the control plane, and you ran `playbook_bom_downloader.yaml`.

    The playbook fails because it cannot sign in to SAP to download the media. The secrets `sapbits-access-key` and `sapbits-location-base-path` exist and are valid.

    What should you do before you run the playbook again?
  fr: |
    Litware a déployé le plan de contrôle de SAP Deployment Automation Framework et une zone de charge de travail nommée **DEV-WEEU-SAP01**. Sur la machine virtuelle de déploiement, vous avez créé un fichier sap-parameters.yaml qui définit `bom_base_name` et définit `kv_name` sur le coffre de clés du plan de contrôle, puis vous avez exécuté `playbook_bom_downloader.yaml`.

    Le playbook échoue, car il ne parvient pas à se connecter à SAP pour télécharger les médias. Les secrets `sapbits-access-key` et `sapbits-location-base-path` existent et sont valides.

    Que devez-vous faire avant de réexécuter le playbook ?
body:
  options:
    - { id: a, text: { en: "Add the secrets S-Username and S-Password to the key vault of the DEV-WEEU-SAP01 workload zone.", fr: "Ajouter les secrets S-Username et S-Password au coffre de clés de la zone de charge de travail DEV-WEEU-SAP01." } }
    - { id: b, text: { en: "Regenerate the storage account key and update the sapbits-access-key secret.", fr: "Régénérer la clé du compte de stockage et mettre à jour le secret sapbits-access-key." } }
    - { id: c, text: { en: "Export the SAP user name and password in ARM_CLIENT_ID and ARM_CLIENT_SECRET.", fr: "Exporter le nom et le mot de passe de l'utilisateur SAP dans ARM_CLIENT_ID et ARM_CLIENT_SECRET." } }
    - { id: d, text: { en: "Add the secrets S-Username and S-Password to the key vault of the control plane.", fr: "Ajouter les secrets S-Username et S-Password au coffre de clés du plan de contrôle." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The BOM downloader signs in to SAP with an SAP user account (S-user) that has download rights. The framework reads it from the secrets S-Username and S-Password in the key vault named by kv_name, which is the control plane key vault that also holds the sapbits secrets created by the framework.
    fr: |
      Le téléchargeur de BOM se connecte à SAP avec un compte utilisateur SAP (S-user) disposant des droits de téléchargement. Le framework le lit dans les secrets S-Username et S-Password du coffre de clés désigné par kv_name, c'est-à-dire le coffre du plan de contrôle qui contient aussi les secrets sapbits créés par le framework.
  options:
    a:
      en: |
        The workload zone key vault stores the credentials of the SAP systems (VM and SAP accounts); the downloader reads the S-user from the key vault named in kv_name.
      fr: |
        Le coffre de clés de la zone de charge de travail stocke les informations d'identification des systèmes SAP (comptes de machines virtuelles et SAP) ; le téléchargeur lit le S-user dans le coffre désigné par kv_name.
    b:
      en: |
        The storage secrets are valid; the failure is the sign-in to SAP, not the upload to storage.
      fr: |
        Les secrets de stockage sont valides ; l'échec concerne la connexion à SAP, pas l'envoi vers le stockage.
    c:
      en: |
        The ARM_* variables hold the Azure deployment credential (service principal or managed identity), not the SAP download account.
      fr: |
        Les variables ARM_* contiennent les informations d'identification de déploiement Azure (principal de service ou identité managée), pas le compte de téléchargement SAP.
references:
  - title: Download SAP software for the automation framework
    url: https://learn.microsoft.com/en-us/azure/sap/automation/software
