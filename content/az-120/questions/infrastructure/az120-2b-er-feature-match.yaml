id: az120-2b-er-feature-match
objective: "2.2.9"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is planning hybrid connectivity for an SAP migration to Azure. The network design has the following requirements.

    Which ExpressRoute option should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam planifie la connectivité hybride d'une migration SAP vers Azure. La conception réseau présente les exigences suivantes.

    Quelle option ExpressRoute devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: gr, text: ExpressRoute Global Reach }
    - { id: fp, text: ExpressRoute FastPath }
    - { id: local, text: ExpressRoute Local }
    - { id: vpn, text: { en: "Coexisting site-to-site VPN connection", fr: "Connexion VPN site à site coexistante" } }
    - { id: direct, text: ExpressRoute Direct }
    - { id: premium, text: ExpressRoute Premium }
  targets:
    - id: t1
      text: { en: "Let the Paris and Singapore datacenters exchange data through their existing ExpressRoute circuits and the Microsoft network", fr: "Permettre aux centres de données de Paris et de Singapour d'échanger des données par leurs circuits ExpressRoute existants et le réseau Microsoft" }
    - id: t2
      text: { en: "Send on-premises traffic directly to the SAP VMs, bypassing the ExpressRoute gateway", fr: "Envoyer le trafic local directement aux machines virtuelles SAP, sans passer par la passerelle ExpressRoute" }
    - id: t3
      text: { en: "Transfer large migration volumes to the Azure region in the same metro as the peering location, with data transfer included in the circuit price", fr: "Transférer de gros volumes de migration vers la région Azure de la même métropole que l'emplacement de peering, avec le transfert de données inclus dans le prix du circuit" }
    - id: t4
      text: { en: "Provide a backup path for private peering traffic if the ExpressRoute circuit fails", fr: "Fournir un chemin de secours pour le trafic du peering privé en cas de défaillance du circuit ExpressRoute" }
answer:
  mapping: { t1: gr, t2: fp, t3: local, t4: vpn }
explanation:
  correct:
    en: "Global Reach links ExpressRoute circuits so that on-premises sites exchange data over the Microsoft network (Premium is needed when the circuits are in different geopolitical regions, but Premium alone doesn't link circuits). FastPath sends traffic directly to the VMs, bypassing the gateway. ExpressRoute Local reaches only one or two nearby regions and includes egress data transfer in its price. A coexisting route-based site-to-site VPN can serve as a failover path for private peering."
    fr: "Global Reach relie des circuits ExpressRoute pour que des sites locaux échangent des données par le réseau Microsoft (Premium est nécessaire si les circuits sont dans des zones géopolitiques différentes, mais Premium seul ne relie pas des circuits). FastPath envoie le trafic directement aux machines virtuelles, sans passer par la passerelle. ExpressRoute Local ne dessert qu'une ou deux régions proches et inclut le transfert de données sortantes dans son prix. Un VPN site à site basé sur des itinéraires et coexistant peut servir de chemin de basculement pour le peering privé."
references:
  - title: About Azure ExpressRoute Global Reach
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-global-reach
  - title: Configure ExpressRoute and S2S VPN coexisting connections with Azure PowerShell
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-howto-coexist-resource-manager
