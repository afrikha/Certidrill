id: az120-2a-marketplace-proxy-linux
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind deploys an SAP application server VM from an Azure Marketplace image of SUSE Linux Enterprise Server for SAP Applications. The VNet is connected to the on-premises network by ExpressRoute, and all internet-bound traffic must go through the on-premises proxy **proxy.northwind.local:8080**.

    After deployment, the Azure VM extension for SAP solutions cannot be installed because the VM cannot download extensions.

    What should you do on the VM?
  fr: |
    Northwind déploie une machine virtuelle de serveur d'applications SAP à partir d'une image de la Place de marché Azure SUSE Linux Enterprise Server for SAP Applications. Le réseau virtuel est relié au réseau local par ExpressRoute, et tout le trafic à destination d'Internet doit passer par le proxy local **proxy.northwind.local:8080**.

    Après le déploiement, l'extension de machine virtuelle Azure pour les solutions SAP ne peut pas être installée, car la machine virtuelle ne peut pas télécharger d'extensions.

    Que devez-vous faire sur la machine virtuelle ?
body:
  options:
    - { id: a, text: { en: "Install the Azure Linux VM Agent by running sudo zypper install WALinuxAgent", fr: "Installer l'agent de machine virtuelle Linux Azure en exécutant sudo zypper install WALinuxAgent" } }
    - { id: b, text: { en: "Add 168.63.129.16 to the proxy exceptions in the Internet Options settings", fr: "Ajouter 168.63.129.16 aux exceptions du proxy dans les paramètres Options Internet" } }
    - { id: c, text: { en: "Set HttpProxy.Host and HttpProxy.Port in /etc/waagent.conf and restart waagent", fr: "Définir HttpProxy.Host et HttpProxy.Port dans /etc/waagent.conf et redémarrer waagent" } }
    - { id: d, text: { en: "Configure the private IP address statically in the network configuration of the OS", fr: "Configurer l'adresse IP privée de façon statique dans la configuration réseau du système d'exploitation" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A VM connected through VPN or ExpressRoute may have no direct internet access, so the Azure VM Agent cannot download extensions. On Linux, you set HttpProxy.Host and HttpProxy.Port in /etc/waagent.conf and restart the agent with sudo service waagent restart.
    fr: |
      Une machine virtuelle reliée par VPN ou ExpressRoute peut ne pas avoir d'accès direct à Internet : l'agent de machine virtuelle Azure ne peut alors pas télécharger d'extensions. Sous Linux, vous définissez HttpProxy.Host et HttpProxy.Port dans /etc/waagent.conf et redémarrez l'agent avec sudo service waagent restart.
  options:
    a:
      en: |
        Marketplace images already contain the VM Agent; the agent is present but cannot reach the internet without the proxy settings.
      fr: |
        Les images de la Place de marché contiennent déjà l'agent de machine virtuelle ; l'agent est présent mais ne peut pas joindre Internet sans les paramètres de proxy.
    b:
      en: |
        The Internet Options exception for 168.63.129.16 is part of the Windows proxy procedure; this VM runs SLES.
      fr: |
        L'exception 168.63.129.16 dans Options Internet fait partie de la procédure de proxy sous Windows ; cette machine virtuelle exécute SLES.
    d:
      en: |
        Microsoft advises against setting IP addresses inside the guest OS, and a static IP does not give the agent a path to the internet.
      fr: |
        Microsoft déconseille de définir les adresses IP dans le système d'exploitation invité, et une adresse IP statique ne donne pas à l'agent de chemin vers Internet.
references:
  - title: Azure Virtual Machines deployment for SAP NetWeaver
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/deployment-guide
