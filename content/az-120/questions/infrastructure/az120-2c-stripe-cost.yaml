id: az120-2c-stripe-cost
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is sizing the **/hana/data** volume of an SAP HANA virtual machine that uses Premium SSD disks. The volume requires:

    - at least 512 GiB of capacity;
    - at least 400 MiB/s of provisioned throughput, without relying on disk bursting.

    The VM supports enough data disks and throughput for any of the options. The solution must minimize storage cost.

    Which disk configuration should you use?
  fr: |
    Wingtip Toys dimensionne le volume **/hana/data** d'une machine virtuelle SAP HANA qui utilise des disques SSD Premium. Le volume exige :

    - au moins 512 Gio de capacité ;
    - au moins 400 Mio/s de débit provisionné, sans compter sur le bursting des disques.

    La machine virtuelle prend en charge suffisamment de disques de données et de débit pour chacune des options. La solution doit réduire au minimum le coût du stockage.

    Quelle configuration de disques devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "One P60 disk (8 TiB)", fr: "Un disque P60 (8 Tio)" } }
    - { id: b, text: { en: "One P40 disk (2 TiB)", fr: "Un disque P40 (2 Tio)" } }
    - { id: c, text: { en: "Two P15 disks (256 GiB each), striped", fr: "Deux disques P15 (256 Gio chacun), entrelacés" } }
    - { id: d, text: { en: "Four P10 disks (128 GiB each), striped", fr: "Quatre disques P10 (128 Gio chacun), entrelacés" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Striping adds up the throughput of the disks: four P10 disks give 512 GiB and 400 MiB/s, at a fraction of the price of one large disk. Striping smaller Premium SSD disks gives a better price/performance ratio, at the cost of a little more deployment and management effort.
    fr: |
      L'entrelacement cumule le débit des disques : quatre disques P10 offrent 512 Gio et 400 Mio/s, pour une fraction du prix d'un grand disque. Entrelacer de petits disques SSD Premium donne un meilleur rapport prix/performances, au prix d'un peu plus d'effort de déploiement et de gestion.
  options:
    a: { en: "A P60 provides 500 MiB/s, but you pay for 8 TiB when only 512 GiB is needed.", fr: "Un P60 fournit 500 Mio/s, mais vous payez 8 Tio alors que 512 Gio suffisent." }
    b: { en: "A single P40 provides only 250 MiB/s.", fr: "Un seul P40 ne fournit que 250 Mio/s." }
    c: { en: "Two striped P15 disks provide only 250 MiB/s.", fr: "Deux disques P15 entrelacés ne fournissent que 250 Mio/s." }
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
