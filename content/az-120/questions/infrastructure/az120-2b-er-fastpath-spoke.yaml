id: az120-2b-er-fastpath-spoke
objective: "2.2.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank connects its datacenter to Azure through a 10-Gbps ExpressRoute provider circuit. The hub virtual network contains an **ErGw3Az** gateway, and FastPath is enabled on its connection. The SAP S/4HANA VMs run in a spoke virtual network in the same region that is peered with the hub and uses the hub gateway.

    Measurements show that traffic between on-premises and the SAP spoke still goes through the ExpressRoute gateway. You need on-premises traffic to bypass the gateway for the SAP VMs. The circuit type must not change.

    What should you do?
  fr: |
    Woodgrove Bank relie son centre de données à Azure par un circuit ExpressRoute de fournisseur de 10 Gbits/s. Le réseau virtuel hub contient une passerelle **ErGw3Az**, et FastPath est activé sur sa connexion. Les machines virtuelles SAP S/4HANA s'exécutent dans un réseau virtuel spoke de la même région, relié par peering au hub et utilisant la passerelle du hub.

    Les mesures montrent que le trafic entre le site local et le spoke SAP passe toujours par la passerelle ExpressRoute. Le trafic local doit contourner la passerelle pour les machines virtuelles SAP. Le type de circuit ne doit pas changer.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a user-defined route in the spoke that sends on-premises prefixes to the hub gateway.", fr: "Ajouter dans le spoke un itinéraire défini par l'utilisateur qui envoie les préfixes locaux vers la passerelle du hub." }
    - id: b
      text: { en: "Enable Global Reach between the circuit and the SAP spoke virtual network.", fr: "Activer Global Reach entre le circuit et le réseau virtuel spoke SAP." }
    - id: c
      text: { en: "Deploy an ErGw3Az gateway in the SAP virtual network and connect it directly to the circuit with FastPath enabled.", fr: "Déployer une passerelle ErGw3Az dans le réseau virtuel SAP et la connecter directement au circuit avec FastPath activé." }
    - id: d
      text: { en: "Enable the ExpressRoute Premium add-on and reconfigure FastPath on the hub connection.", fr: "Activer le module complémentaire ExpressRoute Premium et reconfigurer FastPath sur la connexion du hub." }
answer: { optionId: c }
explanation:
  correct:
    en: "FastPath over virtual network peering is supported only with ExpressRoute Direct; with a provider circuit, traffic to peered spokes keeps flowing through the gateway. Connecting the SAP virtual network directly to the circuit, through its own FastPath-capable gateway, lets FastPath send traffic straight to the SAP VMs. The spoke then stops using the remote hub gateway, because a virtual network can have only one gateway, local or remote."
    fr: "FastPath sur le peering de réseaux virtuels n'est pris en charge qu'avec ExpressRoute Direct ; avec un circuit de fournisseur, le trafic vers les spokes reliés par peering continue de passer par la passerelle. Connecter directement le réseau virtuel SAP au circuit, par sa propre passerelle compatible FastPath, permet à FastPath d'envoyer le trafic directement aux machines virtuelles SAP. Le spoke cesse alors d'utiliser la passerelle distante du hub, car un réseau virtuel ne peut avoir qu'une seule passerelle, locale ou distante."
  options:
    a:
      en: "UDRs over FastPath are also an ExpressRoute Direct feature, and a route toward the gateway doesn't bypass it."
      fr: "Les UDR sur FastPath sont aussi une fonctionnalité d'ExpressRoute Direct, et un itinéraire vers la passerelle ne la contourne pas."
    b:
      en: "Global Reach connects ExpressRoute circuits to each other, not circuits to virtual networks."
      fr: "Global Reach relie des circuits ExpressRoute entre eux, pas des circuits à des réseaux virtuels."
    d:
      en: "Premium doesn't add FastPath support for peered spokes; that support depends on ExpressRoute Direct."
      fr: "Premium n'ajoute pas la prise en charge de FastPath pour les spokes reliés par peering ; elle dépend d'ExpressRoute Direct."
references:
  - title: "Azure ExpressRoute FastPath: Features, availability, and limitations"
    url: https://learn.microsoft.com/en-us/azure/expressroute/about-fastpath
  - title: SAP S/4HANA in Linux on Azure
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/sap/sap-s4hana
