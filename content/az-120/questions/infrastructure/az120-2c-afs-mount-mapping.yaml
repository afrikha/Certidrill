id: az120-2c-afs-mount-mapping
objective: "2.3.9"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso is building a highly available SAP NetWeaver system with SID **NW1** on SUSE Linux Enterprise Server. ASCS00 and ERS01 run in a Pacemaker cluster, and the dialog instance D02 runs on a separate application server. The shared file systems use NFS shares on Azure Files SSD.

    You need to choose how each file system is provided. NFS must be used only for file systems that are shared between VMs or that move between cluster nodes.

    How should you provide each file system? To answer, drag the appropriate options to the correct file systems. Each option may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso crée un système SAP NetWeaver hautement disponible de SID **NW1** sur SUSE Linux Enterprise Server. ASCS00 et ERS01 s'exécutent dans un cluster Pacemaker, et l'instance de dialogue D02 s'exécute sur un serveur d'applications distinct. Les systèmes de fichiers partagés utilisent des partages NFS sur Azure Files SSD.

    Vous devez choisir comment fournir chaque système de fichiers. NFS ne doit être utilisé que pour les systèmes de fichiers partagés entre machines virtuelles ou qui basculent entre les nœuds du cluster.

    Comment devez-vous fournir chaque système de fichiers ? Pour répondre, faites glisser les options appropriées vers les systèmes de fichiers correspondants. Chaque option peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: fstab, text: { en: "Azure Files NFS share mounted through /etc/fstab", fr: "Partage NFS Azure Files monté par /etc/fstab" } }
    - { id: pcmk, text: { en: "Azure Files NFS share managed as a Pacemaker Filesystem resource", fr: "Partage NFS Azure Files géré comme ressource Filesystem de Pacemaker" } }
    - { id: disk, text: { en: "Azure managed disk attached to the VM", fr: "Disque managé Azure attaché à la machine virtuelle" } }
  targets:
    - { id: sapmnt, text: "/sapmnt/NW1" }
    - { id: ascs, text: "/usr/sap/NW1/ASCS00" }
    - { id: ers, text: "/usr/sap/NW1/ERS01" }
    - { id: d02, text: "/usr/sap/NW1/D02" }
answer:
  mapping: { sapmnt: fstab, ascs: pcmk, ers: pcmk, d02: disk }
explanation:
  correct:
    en: |
      /sapmnt/NW1 is used by all SAP VMs at the same time, so it is mounted permanently through /etc/fstab. The ASCS00 and ERS01 directories must follow their instance when it fails over, so they are defined as Pacemaker Filesystem resources and not in fstab. File systems that don't need NFS, such as the D02 dialog instance directory, can be deployed on Azure disk storage.
    fr: |
      /sapmnt/NW1 est utilisé simultanément par toutes les machines virtuelles SAP : il est monté de façon permanente par /etc/fstab. Les répertoires ASCS00 et ERS01 doivent suivre leur instance lors d'un basculement : ils sont donc définis comme ressources Filesystem de Pacemaker et non dans fstab. Les systèmes de fichiers qui n'ont pas besoin de NFS, comme le répertoire de l'instance de dialogue D02, peuvent être déployés sur du stockage sur disque Azure.
references:
  - title: Azure VMs high availability for SAP NW on SLES with NFS on Azure Files
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-nfs-azure-files
