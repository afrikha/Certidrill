id: az120-2c-stripe-sizes
objective: "2.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are configuring storage for SAP HANA on an Azure virtual machine. Both **/hana/data** and **/hana/log** are built as LVM stripe sets over Premium SSD disks, each in its own volume group.

    You need to complete the configuration according to Microsoft guidance.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez le stockage de SAP HANA sur une machine virtuelle Azure. Les volumes **/hana/data** et **/hana/log** sont tous deux créés sous forme de jeux entrelacés LVM sur des disques SSD Premium, chacun dans son propre groupe de volumes.

    Vous devez compléter la configuration conformément aux recommandations de Microsoft.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Stripe size for /hana/data: [[data]]

      Stripe size for /hana/log: [[log]]

      Redundancy of each stripe set: [[raid]]
    fr: |
      Taille de bande pour /hana/data : [[data]]

      Taille de bande pour /hana/log : [[log]]

      Redondance de chaque jeu entrelacé : [[raid]]
  slots:
    - id: data
      options:
        - { id: k64, text: "64 KB" }
        - { id: k128, text: "128 KB" }
        - { id: k256, text: "256 KB" }
        - { id: m1, text: "1 MB" }
    - id: log
      options:
        - { id: k32, text: "32 KB" }
        - { id: k64, text: "64 KB" }
        - { id: k256, text: "256 KB" }
        - { id: m1, text: "1 MB" }
    - id: raid
      options:
        - { id: r0, text: { en: "None (RAID 0, striping only)", fr: "Aucune (RAID 0, entrelacement seul)" } }
        - { id: r1, text: { en: "Mirroring (RAID 1)", fr: "Mise en miroir (RAID 1)" } }
        - { id: r5, text: { en: "Striping with parity (RAID 5)", fr: "Entrelacement avec parité (RAID 5)" } }
answer:
  values: { data: k256, log: k64, raid: r0 }
explanation:
  correct:
    en: |
      Microsoft recommends a 256 KB stripe size for /hana/data and 64 KB for /hana/log. Azure block storage already keeps three copies of every disk, so you configure striping only to spread the I/O, without mirroring or parity.
    fr: |
      Microsoft recommande une taille de bande de 256 Ko pour /hana/data et de 64 Ko pour /hana/log. Le stockage de blocs Azure conserve déjà trois copies de chaque disque : vous configurez l'entrelacement uniquement pour répartir les E/S, sans miroir ni parité.
  options:
    k128: { en: "64 KB and 128 KB were older recommendations for /hana/data; the current value is 256 KB.", fr: "64 Ko et 128 Ko étaient d'anciennes recommandations pour /hana/data ; la valeur actuelle est 256 Ko." }
    k32: { en: "32 KB was the former /hana/log recommendation; the current value is 64 KB.", fr: "32 Ko était l'ancienne recommandation pour /hana/log ; la valeur actuelle est 64 Ko." }
    r1: { en: "Mirroring duplicates redundancy that Azure storage already provides.", fr: "La mise en miroir duplique une redondance que le stockage Azure fournit déjà." }
references:
  - title: SAP HANA Azure virtual machine storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-storage
