id: az120-2a-net-subnet-sizing
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Fabrikam is planning the subnets of a spoke virtual network for SAP S/4HANA. The SAP HANA scale-out system will use Azure NetApp Files for many volumes.

    Complete the design statements. Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam planifie les sous-réseaux d'un réseau virtuel spoke pour SAP S/4HANA. Le système SAP HANA scale-out utilisera Azure NetApp Files pour de nombreux volumes.

    Complétez les affirmations de conception. Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      A subnet with a /27 prefix provides [[usable]] IP addresses that VMs and services can use.

      For the Azure NetApp Files subnet of this HANA system, Microsoft suggests considering a [[anf]] prefix, because the prefix of a delegated subnet cannot be changed after creation.

      The Azure NetApp Files subnet must be delegated to [[deleg]].
    fr: |
      Un sous-réseau de préfixe /27 fournit [[usable]] adresses IP utilisables par les machines virtuelles et les services.

      Pour le sous-réseau Azure NetApp Files de ce système HANA, Microsoft suggère d'envisager un préfixe [[anf]], car le préfixe d'un sous-réseau délégué ne peut plus être modifié après sa création.

      Le sous-réseau Azure NetApp Files doit être délégué à [[deleg]].
  slots:
    - id: usable
      options:
        - { id: u26, text: "26" }
        - { id: u27, text: "27" }
        - { id: u30, text: "30" }
        - { id: u32, text: "32" }
    - id: anf
      options:
        - { id: p28, text: "/28" }
        - { id: p26, text: "/26" }
        - { id: p24, text: "/24" }
        - { id: p23, text: "/23" }
    - id: deleg
      options:
        - { id: sql, text: Microsoft.Sql/managedInstances }
        - { id: netapp, text: Microsoft.NetApp/volumes }
        - { id: web, text: Microsoft.Web/serverFarms }
answer:
  values: { usable: u27, anf: p23, deleg: netapp }
explanation:
  correct:
    en: |
      Azure reserves five addresses in every subnet (the network address, the default gateway, two addresses for Azure DNS and the broadcast address), so a /27 (32 addresses) leaves 27. For high-volume scenarios such as SAP HANA, Microsoft suggests considering a /23 for the Azure NetApp Files subnet, because its mask cannot be changed later. The subnet is delegated to Microsoft.NetApp/volumes, and only one delegated subnet per VNet can be used by Azure NetApp Files.
    fr: |
      Azure réserve cinq adresses dans chaque sous-réseau (l'adresse réseau, la passerelle par défaut, deux adresses pour Azure DNS et l'adresse de diffusion) : un /27 (32 adresses) en laisse donc 27. Pour les scénarios à fort volume comme SAP HANA, Microsoft suggère d'envisager un /23 pour le sous-réseau Azure NetApp Files, car son masque ne peut plus être modifié. Le sous-réseau est délégué à Microsoft.NetApp/volumes, et Azure NetApp Files ne peut utiliser qu'un seul sous-réseau délégué par réseau virtuel.
  options:
    u32:
      en: |
        32 is the total size of a /27; five of these addresses are reserved by Azure.
      fr: |
        32 est la taille totale d'un /27 ; cinq de ces adresses sont réservées par Azure.
    p28:
      en: |
        A /28 leaves only 11 usable addresses, which may not be enough for many volumes.
      fr: |
        Un /28 ne laisse que 11 adresses utilisables, ce qui peut être insuffisant pour de nombreux volumes.
    p24:
      en: |
        A /24 (251 usable addresses) suits many deployments, but for high-volume SAP HANA Microsoft suggests a /23.
      fr: |
        Un /24 (251 adresses utilisables) convient à de nombreux déploiements, mais pour SAP HANA à fort volume Microsoft suggère un /23.
references:
  - title: Delegate a subnet to Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-delegate-subnet
  - title: Azure Virtual Network FAQ
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
