id: az120-2b-se-config-order
objective: "2.2.7"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    The SAP HANA VMs in the subnet **snet-sap-db** of **vnet-sap** write backups to the storage account **stsapbkp01** in the same region. The storage account currently accepts traffic from all networks.

    You need to restrict stsapbkp01 to snet-sap-db by using a service endpoint and the Azure CLI. After each step, the HANA VMs must still be allowed to access the storage account.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Les machines virtuelles SAP HANA du sous-réseau **snet-sap-db** de **vnet-sap** écrivent des sauvegardes dans le compte de stockage **stsapbkp01** de la même région. Le compte de stockage accepte actuellement le trafic de tous les réseaux.

    Vous devez restreindre stsapbkp01 à snet-sap-db à l'aide d'un point de terminaison de service et d'Azure CLI. Après chaque étape, les machines virtuelles HANA doivent toujours être autorisées à accéder au compte de stockage.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: se, text: { en: "Run `az network vnet subnet update` with `--service-endpoints Microsoft.Storage` for snet-sap-db.", fr: "Exécuter `az network vnet subnet update` avec `--service-endpoints Microsoft.Storage` pour snet-sap-db." } }
    - { id: rule, text: { en: "Run `az storage account network-rule add` for stsapbkp01 with the vnet-sap virtual network and the snet-sap-db subnet.", fr: "Exécuter `az storage account network-rule add` pour stsapbkp01 avec le réseau virtuel vnet-sap et le sous-réseau snet-sap-db." } }
    - { id: deny, text: { en: "Run `az storage account update` with `--default-action Deny` for stsapbkp01.", fr: "Exécuter `az storage account update` avec `--default-action Deny` pour stsapbkp01." } }
    - { id: dns, text: { en: "Create a private DNS zone named privatelink.blob.core.windows.net and link it to vnet-sap.", fr: "Créer une zone DNS privée nommée privatelink.blob.core.windows.net et la lier à vnet-sap." } }
    - { id: pe, text: { en: "Run `az network private-endpoint create` with `--group-id blob` in snet-sap-db.", fr: "Exécuter `az network private-endpoint create` avec `--group-id blob` dans snet-sap-db." } }
answer:
  sequence: [ se, rule, deny ]
explanation:
  correct:
    en: "The subnet must have the Microsoft.Storage service endpoint before the storage account can use it in a virtual network rule (the portal creates it automatically, the CLI doesn't). Adding the rule before switching the default action to Deny keeps the HANA VMs allowed at every step."
    fr: "Le sous-réseau doit disposer du point de terminaison de service Microsoft.Storage avant que le compte de stockage puisse l'utiliser dans une règle de réseau virtuel (le portail le crée automatiquement, pas Azure CLI). Ajouter la règle avant de passer l'action par défaut à Deny maintient l'autorisation des machines virtuelles HANA à chaque étape."
  options:
    dns: { en: "A privatelink DNS zone is for private endpoints; service endpoints keep the public DNS names and IPs.", fr: "Une zone DNS privatelink sert aux points de terminaison privés ; les points de terminaison de service conservent les noms DNS et les adresses IP publics." }
    pe: { en: "The requirement is a service endpoint, not a private endpoint.", fr: "L'exigence porte sur un point de terminaison de service, pas sur un point de terminaison privé." }
references:
  - title: Firewall rules and network access for Azure Blob, Data Lake, Queue, and Table Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-network-security
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
