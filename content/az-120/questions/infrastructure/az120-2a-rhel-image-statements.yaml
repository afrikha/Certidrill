id: az120-2a-rhel-image-statements
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware deploys its SAP VMs from pay-as-you-go Red Hat Enterprise Linux for SAP images in the Azure Marketplace.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware déploie ses machines virtuelles SAP à partir d'images Red Hat Enterprise Linux for SAP avec paiement à l'utilisation de la Place de marché Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The deployed VMs receive RHEL updates from the Azure Red Hat Update Infrastructure (RHUI) without being redeployed from a newer image.
        fr: |
          Les machines virtuelles déployées reçoivent les mises à jour RHEL depuis Red Hat Update Infrastructure (RHUI) d'Azure sans être redéployées à partir d'une image plus récente.
    - id: s2
      text:
        en: |
          Litware can later move a VM to bring-your-own-subscription licensing by using Azure Hybrid Benefit, without redeploying the VM.
        fr: |
          Litware peut ensuite faire passer une machine virtuelle à des licences BYOS (apportez votre propre abonnement) avec Azure Hybrid Benefit, sans redéployer la machine virtuelle.
    - id: s3
      text:
        en: |
          The Azure Marketplace search in the Azure portal shows all the published RHEL for SAP images, so the Azure CLI is not needed to find them.
        fr: |
          La recherche de la Place de marché Azure dans le portail Azure affiche toutes les images RHEL for SAP publiées : Azure CLI n'est pas nécessaire pour les trouver.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Pay-as-you-go RHEL VMs are connected to the Azure RHUI and receive updates, usually within 24 hours of a Red Hat release. Azure Hybrid Benefit switches RHEL VMs between pay-as-you-go and BYOS dynamically. The Marketplace search and the portal show only some images; to see the full set, run az vm image list --publisher RedHat --all.
    fr: |
      Les machines virtuelles RHEL avec paiement à l'utilisation sont connectées à RHUI d'Azure et reçoivent les mises à jour, en général moins de 24 heures après leur publication par Red Hat. Azure Hybrid Benefit fait passer dynamiquement les machines virtuelles RHEL du paiement à l'utilisation au BYOS. La recherche de la Place de marché et le portail n'affichent qu'une partie des images ; pour voir l'ensemble, exécutez az vm image list --publisher RedHat --all.
references:
  - title: Overview of Red Hat Enterprise Linux images in Azure - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/workloads/redhat/redhat-images
