id: az120-sr1-hana-log-2
objective: "2.3.6"
type: series_yesno
series: az120-sr1-hana-log
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: |-
    You move the HANA volumes to Premium SSD v2 disks without Write Accelerator.
  fr: |-
    Vous déplacez les volumes HANA vers des disques SSD Premium v2 sans Accélérateur d'écriture.
body:
  solution:
    en: |-
      You move **/hana/data** and **/hana/log** to new **Premium SSD v2** disks provisioned with the IOPS and throughput that Microsoft lists for a VM of this memory size, and you don't enable Write Accelerator on any disk.
    fr: |-
      Vous déplacez **/hana/data** et **/hana/log** vers de nouveaux disques **SSD Premium v2** provisionnés avec les IOPS et le débit que Microsoft indique pour une machine virtuelle de cette taille de mémoire, et vous n'activez l'Accélérateur d'écriture sur aucun disque.
answer: { value: true }
explanation:
  correct:
    en: |-
      Premium SSD v2 has submillisecond latency and passes the SAP HANA KPIs for /hana/data and /hana/log without Write Accelerator or caching; the same configuration applies to the certified E-series and M-series VMs of the same memory size. The Write Accelerator requirement applies to /hana/log on Premium SSD (v1) only, and Premium SSD v2 doesn't support Write Accelerator anyway.
    fr: |-
      Le SSD Premium v2 offre une latence inférieure à la milliseconde et respecte les KPI SAP HANA pour /hana/data et /hana/log sans Accélérateur d'écriture ni mise en cache ; la même configuration s'applique aux machines virtuelles certifiées des séries E et M de même taille de mémoire. L'obligation d'utiliser l'Accélérateur d'écriture ne concerne que /hana/log sur SSD Premium (v1), et le SSD Premium v2 ne prend de toute façon pas en charge l'Accélérateur d'écriture.
references:
  - title: SAP HANA Azure virtual machine Premium SSD v2 storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-premium-ssd-v2
