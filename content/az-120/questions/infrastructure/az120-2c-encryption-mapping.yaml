id: az120-2c-encryption-mapping
objective: "2.3.7"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware is defining encryption for an SAP landscape on Azure that includes SAP HANA, SAP on SQL Server, and a highly available ASCS/ERS cluster on SUSE Linux Enterprise Server that mounts **/sapmnt** from Azure Files NFS shares.

    You need to select an encryption feature for each requirement.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware définit le chiffrement d'un paysage SAP sur Azure qui comprend SAP HANA, SAP sur SQL Server et un cluster ASCS/ERS hautement disponible sur SUSE Linux Enterprise Server qui monte **/sapmnt** depuis des partages NFS Azure Files.

    Vous devez sélectionner une fonctionnalité de chiffrement pour chaque exigence.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: hanaenc, text: { en: "SAP HANA data volume encryption", fr: "Chiffrement des volumes de données SAP HANA" } }
    - { id: tde, text: { en: "SQL Server TDE with the keys in Azure Key Vault", fr: "TDE de SQL Server avec les clés dans Azure Key Vault" } }
    - { id: eit, text: { en: "Encryption in transit with the AZNFS mount helper", fr: "Chiffrement en transit avec l'assistant de montage AZNFS" } }
    - { id: des, text: { en: "Customer-managed keys in a disk encryption set with automatic key rotation", fr: "Clés gérées par le client dans un jeu de chiffrement de disque avec rotation automatique des clés" } }
    - { id: ade, text: { en: "Azure Disk Encryption", fr: "Azure Disk Encryption" } }
  targets:
    - id: hana
      text: { en: "Encrypt the HANA database files inside the DBMS, with keys managed by HANA itself", fr: "Chiffrer les fichiers de la base HANA dans le SGBD, avec des clés gérées par HANA lui-même" }
    - id: sql
      text: { en: "Encrypt the SQL Server database and its backups, with the keys stored in an Azure service", fr: "Chiffrer la base SQL Server et ses sauvegardes, avec les clés stockées dans un service Azure" }
    - id: nfs
      text: { en: "Encrypt the NFS traffic between the cluster nodes and the /sapmnt shares", fr: "Chiffrer le trafic NFS entre les nœuds du cluster et les partages /sapmnt" }
    - id: disks
      text: { en: "Encrypt the managed disks of the application servers at rest with keys that Litware controls and rotates automatically", fr: "Chiffrer au repos les disques managés des serveurs d'applications avec des clés que Litware contrôle et fait pivoter automatiquement" }
answer:
  mapping: { hana: hanaenc, sql: tde, nfs: eit, disks: des }
explanation:
  correct:
    en: |
      Microsoft recommends database-level encryption (TDE) for every DBMS that runs SAP: SAP HANA encrypts its data volumes with keys it manages itself, because HANA doesn't support storing keys in Azure Key Vault, whereas SQL Server TDE is fully integrated with Key Vault, and TDE-enabled databases produce encrypted backups. Azure Files NFS traffic is encrypted with TLS through the AZNFS mount helper. A disk encryption set with automatic rotation encrypts managed disks with customer-managed keys.
    fr: |
      Microsoft recommande le chiffrement au niveau de la base de données (TDE) pour chaque SGBD qui exécute SAP : SAP HANA chiffre ses volumes de données avec des clés qu'il gère lui-même, car HANA ne prend pas en charge le stockage des clés dans Azure Key Vault, alors que le TDE de SQL Server est entièrement intégré à Key Vault, et les bases avec TDE produisent des sauvegardes chiffrées. Le trafic NFS Azure Files est chiffré avec TLS grâce à l'assistant de montage AZNFS. Un jeu de chiffrement de disque avec rotation automatique chiffre les disques managés avec des clés gérées par le client.
  options:
    ade: { en: "Azure Disk Encryption isn't supported for SAP systems and is scheduled for retirement on September 15, 2028.", fr: "Azure Disk Encryption n'est pas pris en charge pour les systèmes SAP et doit être mis hors service le 15 septembre 2028." }
references:
  - title: Secure Azure Infrastructure for SAP Applications
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-security-infrastructure
  - title: Azure Files NFS Encryption in Transit for SAP on Azure Systems
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-azure-files-nfs-encryption-in-transit-guide
