id: az120-2c-sql-cache-layout
objective: "2.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank runs the database of an SAP ERP system on SQL Server 2022 on a Standard_E32ds_v5 virtual machine that runs Windows Server. The data files and the transaction log are on separate Premium SSD disks. The VM size is SAP-certified.

    You need to configure the storage according to Microsoft guidance for SAP on SQL Server. The tempdb files must not consume the IOPS of the persistent disks.

    How should you configure the storage? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank exécute la base de données d'un système SAP ERP sur SQL Server 2022, sur une machine virtuelle Standard_E32ds_v5 qui exécute Windows Server. Les fichiers de données et le journal des transactions se trouvent sur des disques SSD Premium distincts. La taille de machine virtuelle est certifiée SAP.

    Vous devez configurer le stockage conformément aux recommandations de Microsoft pour SAP sur SQL Server. Les fichiers tempdb ne doivent pas consommer les IOPS des disques persistants.

    Comment devez-vous configurer le stockage ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Host caching of the data file disks: [[data]]

      Host caching of the transaction log disk: [[log]]

      Location of the tempdb data and log files: [[tmp]]
    fr: |
      Mise en cache de l'hôte des disques de fichiers de données : [[data]]

      Mise en cache de l'hôte du disque du journal des transactions : [[log]]

      Emplacement des fichiers de données et de journal de tempdb : [[tmp]]
  slots:
    - id: data
      options:
        - { id: none, text: None }
        - { id: ro, text: ReadOnly }
        - { id: rw, text: ReadWrite }
    - id: log
      options:
        - { id: none, text: None }
        - { id: ro, text: ReadOnly }
        - { id: rw, text: ReadWrite }
    - id: tmp
      options:
        - { id: d, text: { en: "The nonpersistent D:\\ drive", fr: "Le lecteur non persistant D:\\" } }
        - { id: c, text: { en: "The operating system disk C:\\", fr: "Le disque du système d'exploitation C:\\" } }
        - { id: data, text: { en: "The volume that holds the data files", fr: "Le volume qui contient les fichiers de données" } }
        - { id: log, text: { en: "The transaction log disk", fr: "Le disque du journal des transactions" } }
answer:
  values: { data: ro, log: none, tmp: d }
explanation:
  correct:
    en: |
      For Premium SSD, Microsoft recommends read caching for the disks of the SAP database data files and no caching for the log disks, because log I/O is write-heavy. With SAP-certified VM types, tempdb data and log files can be placed on the nonpersistent D:\ drive, which doesn't use the IOPS of the managed disks.
    fr: |
      Pour le SSD Premium, Microsoft recommande la mise en cache en lecture pour les disques des fichiers de données de la base SAP et aucune mise en cache pour les disques de journaux, car les E/S du journal sont surtout des écritures. Avec les types de machines virtuelles certifiés SAP, les fichiers de données et de journal de tempdb peuvent être placés sur le lecteur non persistant D:\, qui n'utilise pas les IOPS des disques managés.
  options:
    rw: { en: "ReadWrite caching risks losing cached writes if the VM fails and isn't recommended for database files.", fr: "La mise en cache ReadWrite risque de perdre des écritures en cache en cas de défaillance de la machine virtuelle et n'est pas recommandée pour les fichiers de base de données." }
    c: { en: "The OS disk is a persistent managed disk, so tempdb would consume its IOPS.", fr: "Le disque du système d'exploitation est un disque managé persistant : tempdb consommerait ses IOPS." }
references:
  - title: Considerations for Azure VMs DBMS deployment for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/dbms-guide-general
  - title: SQL Server Azure virtual machines DBMS deployment for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/dbms-guide-sqlserver
