id: az120-cs3a-hana-log-disks
objective: "2.3.6"
type: dropdown
caseStudy: az120-cs3a-coho-winery
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the disks of the /hana/log volumes to meet the storage requirement. Which disk setting should you use for each system? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer les disques des volumes /hana/log pour respecter l'exigence de stockage. Quel paramètre de disque devez-vous utiliser pour chaque système ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      /hana/log disks of HANA-PRD1 and HANA-PRD2: [[prd]]

      /hana/log disks of HANA-QAS: [[qas]]
    fr: |
      Disques /hana/log de HANA-PRD1 et HANA-PRD2 : [[prd]]

      Disques /hana/log de HANA-QAS : [[qas]]
  slots:
    - id: prd
      options:
        - { id: wa, text: { en: "Host caching None, Write Accelerator enabled", fr: "Mise en cache de l'hôte None, Accélérateur d'écriture activé" } }
        - { id: ro, text: { en: "Host caching Read-only, Write Accelerator disabled", fr: "Mise en cache de l'hôte Read-only, Accélérateur d'écriture désactivé" } }
        - { id: rw, text: { en: "Host caching Read/write, Write Accelerator disabled", fr: "Mise en cache de l'hôte Read/write, Accélérateur d'écriture désactivé" } }
        - { id: na, text: { en: "No host caching and no Write Accelerator available", fr: "Ni mise en cache de l'hôte ni Accélérateur d'écriture disponibles" } }
    - id: qas
      options:
        - { id: wa, text: { en: "Host caching None, Write Accelerator enabled", fr: "Mise en cache de l'hôte None, Accélérateur d'écriture activé" } }
        - { id: ro, text: { en: "Host caching Read-only, Write Accelerator disabled", fr: "Mise en cache de l'hôte Read-only, Accélérateur d'écriture désactivé" } }
        - { id: rw, text: { en: "Host caching Read/write, Write Accelerator disabled", fr: "Mise en cache de l'hôte Read/write, Accélérateur d'écriture désactivé" } }
        - { id: na, text: { en: "No host caching and no Write Accelerator available", fr: "Ni mise en cache de l'hôte ni Accélérateur d'écriture disponibles" } }
answer:
  values: { prd: wa, qas: na }
explanation:
  correct:
    en: |
      With Premium SSD on M-series VMs, including Mv3, Write Accelerator is mandatory for /hana/log, and the disks use host caching None (the portal option "None + Write Accelerator"). Premium SSD v2, like Ultra Disk, offers no host caching option and doesn't support Write Accelerator; its latency meets the SAP HANA KPIs without them, which is why it can serve /hana/log on the E-series VM.
    fr: |
      Avec des SSD Premium sur des machines virtuelles de série M, y compris Mv3, l'Accélérateur d'écriture est obligatoire pour /hana/log, et les disques utilisent la mise en cache de l'hôte None (option « None + Write Accelerator » du portail). Le SSD Premium v2, comme Ultra Disk, n'offre aucune option de mise en cache de l'hôte et ne prend pas en charge l'Accélérateur d'écriture ; sa latence respecte les KPI de SAP HANA sans eux, ce qui lui permet de porter /hana/log sur la machine virtuelle de série E.
  options:
    ro:
      en: |
        Read caching is never recommended for /hana/log; it is an option only for /hana/data and /hana/shared on Premium SSD.
      fr: |
        La mise en cache en lecture n'est jamais recommandée pour /hana/log ; c'est une option uniquement pour /hana/data et /hana/shared sur SSD Premium.
    rw:
      en: |
        Read/write caching isn't used for any SAP HANA data or log volume.
      fr: |
        La mise en cache en lecture/écriture n'est utilisée pour aucun volume de données ou de journal SAP HANA.
references:
  - title: SAP HANA Azure virtual machine Premium SSD configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-premium-ssd-v1
  - title: SAP HANA Azure virtual machine Premium SSD v2 configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-premium-ssd-v2
