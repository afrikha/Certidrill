id: az120-2c-anf-manual-qos
objective: "2.3.8"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys will host one SAP HANA system on Azure NetApp Files by using the **Premium** service level. The volumes have the following requirements:

    | Volume | Capacity | Throughput |
    | --- | --- | --- |
    | /hana/data | 4 TiB | 640 MiB/s |
    | /hana/log | 1 TiB | 384 MiB/s |
    | /hana/shared | 1 TiB | 64 MiB/s |

    The quota of each volume must equal its capacity requirement. All three volumes will be in the same capacity pool, and the pool must be as small as possible.

    How should you configure the capacity pool? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys hébergera un système SAP HANA sur Azure NetApp Files avec le niveau de service **Premium**. Les volumes ont les exigences suivantes :

    | Volume | Capacité | Débit |
    | --- | --- | --- |
    | /hana/data | 4 Tio | 640 Mio/s |
    | /hana/log | 1 Tio | 384 Mio/s |
    | /hana/shared | 1 Tio | 64 Mio/s |

    Le quota de chaque volume doit être égal à sa capacité requise. Les trois volumes seront dans le même pool de capacité, et le pool doit être aussi petit que possible.

    Comment devez-vous configurer le pool de capacité ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      QoS type: [[qos]]

      Capacity pool size: [[size]]
    fr: |
      Type de QoS : [[qos]]

      Taille du pool de capacité : [[size]]
  slots:
    - id: qos
      options:
        - { id: auto, text: { en: "Auto", fr: "Automatique" } }
        - { id: manual, text: { en: "Manual", fr: "Manuelle" } }
    - id: size
      options:
        - { id: t6, text: "6 TiB" }
        - { id: t12, text: "12 TiB" }
        - { id: t17, text: "17 TiB" }
        - { id: t24, text: "24 TiB" }
answer:
  values: { qos: manual, size: t17 }
explanation:
  correct:
    en: |
      With auto QoS, a volume's throughput is its quota multiplied by 64 MiB/s per TiB, so the 1 TiB log volume would get only 64 MiB/s. Manual QoS lets you assign capacity and throughput independently, within a pool total of pool size x 64 MiB/s per TiB. The volumes need 640 + 384 + 64 = 1,088 MiB/s, and 1,088 / 64 = 17, so a 17 TiB pool is the smallest that provides the throughput (it also exceeds the 6 TiB of quotas).
    fr: |
      Avec la QoS automatique, le débit d'un volume est son quota multiplié par 64 Mio/s par Tio : le volume de journal de 1 Tio n'obtiendrait que 64 Mio/s. La QoS manuelle permet d'attribuer la capacité et le débit indépendamment, dans la limite d'un total de taille du pool x 64 Mio/s par Tio. Les volumes ont besoin de 640 + 384 + 64 = 1 088 Mio/s, et 1 088 / 64 = 17 : un pool de 17 Tio est le plus petit qui fournit ce débit (il dépasse aussi les 6 Tio de quotas).
  options:
    t6: { en: "A 6 TiB Premium pool provides only 384 MiB/s in total.", fr: "Un pool Premium de 6 Tio ne fournit que 384 Mio/s au total." }
    t12: { en: "A 12 TiB Premium pool provides only 768 MiB/s in total.", fr: "Un pool Premium de 12 Tio ne fournit que 768 Mio/s au total." }
    t24: { en: "24 TiB provides enough throughput but isn't the smallest pool.", fr: "24 Tio fournit assez de débit, mais ce n'est pas le plus petit pool." }
references:
  - title: Service levels for Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-service-levels
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
