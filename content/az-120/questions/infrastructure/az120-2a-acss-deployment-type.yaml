id: az120-2a-acss-deployment-type
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware will deploy a production SAP S/4HANA system by using Azure Center for SAP solutions in a region that has availability zones. The ASCS instance and the SAP HANA database must stay available if one availability zone fails.

    Which deployment type should you select?
  fr: |
    Proseware va déployer un système SAP S/4HANA de production avec le Centre Azure pour les solutions SAP dans une région dotée de zones de disponibilité. L'instance ASCS et la base de données SAP HANA doivent rester disponibles en cas de défaillance d'une zone de disponibilité.

    Quel type de déploiement devez-vous sélectionner ?
body:
  options:
    - { id: a, text: { en: "Single server", fr: "Serveur unique (Single server)" } }
    - { id: b, text: { en: "Distributed", fr: "Distribué (Distributed)" } }
    - { id: c, text: { en: "Distributed with High Availability, with availability sets", fr: "Distribué avec haute disponibilité, avec des groupes à haute disponibilité" } }
    - { id: d, text: { en: "Distributed with High Availability, with an availability zone pair", fr: "Distribué avec haute disponibilité, avec une paire de zones de disponibilité" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Distributed with High Availability is the type recommended for production. With the 99.99% option (optimize for availability), the active ASCS and database servers run in a primary zone and the passive ones in a secondary zone, so the system survives a zone failure.
    fr: |
      Distribué avec haute disponibilité est le type recommandé pour la production. Avec l'option 99,99 % (optimiser la disponibilité), les serveurs ASCS et de base de données actifs s'exécutent dans une zone principale et les serveurs passifs dans une zone secondaire : le système survit à la défaillance d'une zone.
  options:
    a:
      en: |
        Single server is for non-production systems only and has no redundancy.
      fr: |
        Le serveur unique est réservé aux systèmes hors production et n'a aucune redondance.
    b:
      en: |
        Distributed separates the tiers on several VMs but without high availability for ASCS and the database.
      fr: |
        Le type distribué répartit les couches sur plusieurs machines virtuelles, mais sans haute disponibilité pour l'ASCS et la base de données.
    c:
      en: |
        The 99.95% option (optimize for cost) uses three availability sets, which protect against host failures within one datacenter but not against a zone failure.
      fr: |
        L'option 99,95 % (optimiser le coût) utilise trois groupes à haute disponibilité, qui protègent contre les défaillances d'hôte dans un centre de données mais pas contre la défaillance d'une zone.
references:
  - title: Deploy an S/4HANA infrastructure
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/deploy-s4hana
