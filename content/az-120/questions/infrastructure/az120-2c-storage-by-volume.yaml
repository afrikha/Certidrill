id: az120-2c-storage-by-volume
objective: "2.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware is designing the storage of an SAP S/4HANA landscape on Azure. The production database runs on zonal M-series virtual machines, and the ABAP central services (ASCS/ERS) run in a Pacemaker cluster on SUSE Linux Enterprise Server.

    You need to select a storage type for each requirement. The solution must minimize cost where several storage types would work.

    Which storage type should you use for each requirement? To answer, drag the appropriate storage types to the correct requirements. Each storage type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware conçoit le stockage d'un paysage SAP S/4HANA sur Azure. La base de données de production s'exécute sur des machines virtuelles zonales de la série M, et les services centraux ABAP (ASCS/ERS) s'exécutent dans un cluster Pacemaker sur SUSE Linux Enterprise Server.

    Vous devez sélectionner un type de stockage pour chaque exigence. La solution doit réduire les coûts au minimum lorsque plusieurs types de stockage conviennent.

    Quel type de stockage devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les types de stockage appropriés vers les exigences correspondantes. Chaque type de stockage peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pssd, text: { en: "Premium SSD", fr: "SSD Premium" } }
    - { id: pssdv2, text: { en: "Premium SSD v2", fr: "SSD Premium v2" } }
    - { id: hdd, text: { en: "Standard HDD", fr: "HDD Standard" } }
    - { id: ssd, text: { en: "Standard SSD", fr: "SSD Standard" } }
    - { id: afs, text: { en: "Azure Files NFS share", fr: "Partage NFS Azure Files" } }
  targets:
    - id: os
      text: { en: "Operating system disk of a production SAP application server", fr: "Disque du système d'exploitation d'un serveur d'applications SAP de production" }
    - id: sapmnt
      text: { en: "/sapmnt/<SID>, mounted by both ASCS/ERS cluster nodes and all application servers", fr: "/sapmnt/<SID>, monté par les deux nœuds du cluster ASCS/ERS et par tous les serveurs d'applications" }
    - id: bkp
      text: { en: "Disk that only stores file-based HANA backups of a test system", fr: "Disque qui stocke uniquement les sauvegardes HANA basées sur des fichiers d'un système de test" }
    - id: data
      text: { en: "/hana/data on a single disk whose IOPS and throughput are set independently of its capacity", fr: "/hana/data sur un seul disque dont les IOPS et le débit sont définis indépendamment de sa capacité" }
answer:
  mapping: { os: pssd, sapmnt: afs, bkp: hdd, data: pssdv2 }
explanation:
  correct:
    en: Premium SSD is the recommended OS disk for production SAP VMs (Premium SSD v2 can't be an OS disk and Standard SSD is restricted to non-production). /sapmnt must be shared by several VMs, which an Azure Files NFS share provides. Standard HDD is suitable only for backups and is the cheapest option. Premium SSD v2 lets you provision IOPS and throughput independently of capacity, so no striping is needed, and it attaches to zonal VMs.
    fr: Le SSD Premium est le disque du système d'exploitation recommandé pour les machines virtuelles SAP de production (le SSD Premium v2 ne peut pas être un disque du système d'exploitation et le SSD Standard est limité à la non-production). /sapmnt doit être partagé par plusieurs machines virtuelles, ce que fournit un partage NFS Azure Files. Le HDD Standard ne convient qu'aux sauvegardes et c'est l'option la moins chère. Le SSD Premium v2 permet de provisionner les IOPS et le débit indépendamment de la capacité, sans entrelacement, et il s'attache aux machines virtuelles zonales.
  options:
    ssd: { en: "Standard SSD is restricted to non-production OS and data disks and costs more than Standard HDD for a backup-only disk.", fr: "Le SSD Standard est limité aux disques de système d'exploitation et de données hors production, et il coûte plus cher que le HDD Standard pour un disque réservé aux sauvegardes." }
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
