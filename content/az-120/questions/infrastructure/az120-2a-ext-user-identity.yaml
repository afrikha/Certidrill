id: az120-2a-ext-user-identity
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs SAP HANA on a Linux VM named **vmhana01**. The VM has no system-assigned managed identity. It has one user-assigned managed identity named **id-sap-monitor**, which already has the Reader role on the VM, its disks and its network interfaces.

    You need to deploy the new version of the Azure VM extension for SAP solutions by running `Set-AzVMExtension` with the publisher `Microsoft.AzureCAT.AzureEnhancedMonitoring`.

    Which parameter values should you use?
  fr: |
    Fabrikam exécute SAP HANA sur une machine virtuelle Linux nommée **vmhana01**. La machine virtuelle n'a pas d'identité managée affectée par le système. Elle a une identité managée affectée par l'utilisateur nommée **id-sap-monitor**, qui dispose déjà du rôle Reader sur la machine virtuelle, ses disques et ses interfaces réseau.

    Vous devez déployer la nouvelle version de l'extension de machine virtuelle Azure pour les solutions SAP en exécutant `Set-AzVMExtension` avec l'éditeur `Microsoft.AzureCAT.AzureEnhancedMonitoring`.

    Quelles valeurs de paramètres devez-vous utiliser ?
body:
  options:
    - id: a
      text: "`-ExtensionType \"MonitorX64Linux\" -SettingString '{\"cfg\":[]}'`"
    - id: b
      text: "`-ExtensionType \"MonitorX64Linux\" -SettingString '{\"cfg\":[{\"key\":\"msi_res_id\",\"value\":\"<resource ID of id-sap-monitor>\"}]}'`"
    - id: c
      text: "`-ExtensionType \"MonitorX64Windows\" -SettingString '{\"cfg\":[{\"key\":\"msi_res_id\",\"value\":\"<resource ID of id-sap-monitor>\"}]}'`"
    - id: d
      text: "`-ExtensionType \"MonitorX64Linux\" -SettingString '{\"cfg\":[{\"key\":\"proxy\",\"value\":\"<resource ID of id-sap-monitor>\"}]}'`"
answer: { optionId: b }
explanation:
  correct:
    en: |
      On Linux, the extension type is MonitorX64Linux. With a user-assigned identity, you pass its resource ID in the `msi_res_id` key of the `cfg` array; because the identity already has read access, no Owner rights are needed for the installation.
    fr: |
      Sous Linux, le type d'extension est MonitorX64Linux. Avec une identité affectée par l'utilisateur, vous transmettez son ID de ressource dans la clé `msi_res_id` du tableau `cfg` ; comme l'identité dispose déjà de l'accès en lecture, aucun droit Owner n'est nécessaire pour l'installation.
  options:
    a:
      en: |
        An empty `cfg` array makes the extension use the system-assigned identity, which vmhana01 does not have.
      fr: |
        Un tableau `cfg` vide fait utiliser l'identité affectée par le système, dont vmhana01 ne dispose pas.
    c:
      en: |
        MonitorX64Windows is the extension type for Windows VMs; vmhana01 runs Linux.
      fr: |
        MonitorX64Windows est le type d'extension des machines virtuelles Windows ; vmhana01 exécute Linux.
    d:
      en: |
        The `proxy` key takes the URL of a proxy server, not the resource ID of an identity.
      fr: |
        La clé `proxy` attend l'URL d'un serveur proxy, pas l'ID de ressource d'une identité.
references:
  - title: New version of Azure VM extension for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap-new
