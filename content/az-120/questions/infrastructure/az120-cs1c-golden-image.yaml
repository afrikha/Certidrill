id: az120-cs1c-golden-image
objective: "2.1.4"
type: single
caseStudy: az120-cs1c-tailspin-toys
difficulty: 1
status: draft
stem:
  en: |
    The platform team has prepared a hardened SUSE Linux Enterprise Server for SAP Applications VM in Sweden Central. You need to provide an image for the application server VMs that meets the image requirement.

    What should you do?
  fr: |
    L'équipe plateforme a préparé une machine virtuelle SUSE Linux Enterprise Server for SAP Applications renforcée dans Sweden Central. Vous devez fournir une image pour les machines virtuelles des serveurs d'applications qui respecte l'exigence relative aux images.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create an image version from the VM in an Azure Compute Gallery and replicate it to Sweden Central and North Europe", fr: "Créer une version d'image à partir de la machine virtuelle dans une galerie Azure Compute Gallery et la répliquer vers Sweden Central et North Europe" } }
    - { id: b, text: { en: "Deploy the VMs from the Marketplace SLES for SAP image and apply the hardening with the Custom Script Extension", fr: "Déployer les machines virtuelles à partir de l'image SLES for SAP de la Place de marché et appliquer le renforcement avec l'extension de script personnalisé" } }
    - { id: c, text: { en: "Export the OS disk of the VM as a VHD to a storage account in each region and create the VMs from the VHD", fr: "Exporter le disque du système d'exploitation de la machine virtuelle en VHD vers un compte de stockage dans chaque région et créer les machines virtuelles à partir du VHD" } }
    - { id: d, text: { en: "Deploy the VMs from the Marketplace SLES for SAP image and apply the hardening with cloud-init at first boot", fr: "Déployer les machines virtuelles à partir de l'image SLES for SAP de la Place de marché et appliquer le renforcement avec cloud-init au premier démarrage" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Compute Gallery stores image definitions and image versions, so the hardened image is versioned, and each image version can be replicated to several regions. VMs in Sweden Central and North Europe are then created from the same version, with the hardening already inside the image.
    fr: |
      Azure Compute Gallery stocke des définitions d'image et des versions d'image : l'image renforcée est donc versionnée, et chaque version d'image peut être répliquée vers plusieurs régions. Les machines virtuelles de Sweden Central et de North Europe sont alors créées à partir de la même version, avec le renforcement déjà inclus dans l'image.
  options:
    b:
      en: |
        The Custom Script Extension runs the hardening after deployment, which the requirement forbids.
      fr: |
        L'extension de script personnalisé exécute le renforcement après le déploiement, ce que l'exigence interdit.
    c:
      en: |
        Copying VHDs gives no versioning or managed replication; each copy must be maintained by hand.
      fr: |
        La copie de VHD n'offre ni gestion des versions ni réplication gérée ; chaque copie doit être maintenue manuellement.
    d:
      en: |
        cloud-init also applies the hardening after deployment, at first boot.
      fr: |
        cloud-init applique lui aussi le renforcement après le déploiement, au premier démarrage.
references:
  - title: Store and share resources in Azure Compute Gallery
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
