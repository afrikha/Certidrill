id: az120-2c-cache-hotarea
objective: "2.3.5"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam deployed a production SAP HANA database on a Standard_M64s virtual machine named **hdb01**. All disks are Premium SSD managed disks. Write Accelerator isn't enabled on any disk. The disk configuration of hdb01 is shown in the following table.

    Answer each prompt by selecting the appropriate host caching setting in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam a déployé une base de données SAP HANA de production sur une machine virtuelle Standard_M64s nommée **hdb01**. Tous les disques sont des disques managés SSD Premium. L'Accélérateur d'écriture n'est activé sur aucun disque. La configuration des disques de hdb01 figure dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le paramètre de mise en cache de l'hôte approprié dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The setting that doesn't follow Microsoft guidance for SAP HANA on this VM", fr: "Le paramètre qui ne respecte pas les recommandations de Microsoft pour SAP HANA sur cette machine virtuelle" }
    - id: p2
      text: { en: "The setting that Azure doesn't support", fr: "Le paramètre qu'Azure ne prend pas en charge" }
  grid:
    header: [{ en: "Disk", fr: "Disque" }, { en: "Mount point", fr: "Point de montage" }, { en: "Disks", fr: "Disques" }, { en: "Host caching", fr: "Mise en cache de l'hôte" }]
    rows:
      - [{ text: { en: "OS", fr: "Système d'exploitation" } }, { text: "/" }, { text: "1 x P10 (128 GiB)" }, { text: ReadWrite, area: os }]
      - [{ text: { en: "Data", fr: "Données" } }, { text: "/hana/data" }, { text: "4 x P15 (256 GiB)" }, { text: ReadOnly, area: data }]
      - [{ text: { en: "Log", fr: "Journal" } }, { text: "/hana/log" }, { text: "3 x P15 (256 GiB)" }, { text: ReadWrite, area: log }]
      - [{ text: { en: "Shared", fr: "Partagé" } }, { text: "/hana/shared" }, { text: "1 x P30 (1 TiB)" }, { text: ReadOnly, area: shared }]
      - [{ text: { en: "Backup", fr: "Sauvegarde" } }, { text: "/hana/backup" }, { text: "1 x P70 (16 TiB)" }, { text: ReadOnly, area: backup }]
answer:
  values: { p1: log, p2: backup }
explanation:
  correct:
    en: |
      On an M-series VM with Premium SSD, /hana/log must use caching None with Write Accelerator enabled; ReadWrite caching on the log disks doesn't meet the guidance. Host caching isn't supported for disks of 4 TiB and larger, so the ReadOnly setting can't apply to the 16 TiB P70 disk. ReadWrite is the Azure default for the OS disk, which you shouldn't change, and read caching is recommended for /hana/data and /hana/shared.
    fr: |
      Sur une machine virtuelle de la série M avec du SSD Premium, /hana/log doit utiliser la mise en cache None avec l'Accélérateur d'écriture activé ; la mise en cache ReadWrite sur les disques du journal ne respecte pas les recommandations. La mise en cache de l'hôte n'est pas prise en charge pour les disques de 4 Tio et plus : le paramètre ReadOnly ne peut pas s'appliquer au disque P70 de 16 Tio. ReadWrite est la valeur par défaut d'Azure pour le disque du système d'exploitation, qu'il ne faut pas modifier, et la mise en cache en lecture est recommandée pour /hana/data et /hana/shared.
references:
  - title: SAP HANA Azure virtual machine Premium SSD storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-premium-ssd-v1
  - title: "Azure premium storage: Design for high performance"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/premium-storage-performance
