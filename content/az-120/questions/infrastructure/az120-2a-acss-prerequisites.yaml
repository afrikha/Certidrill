id: az120-2a-acss-prerequisites
objective: "2.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a new Azure subscription named **Sub-SAP-PRD** that contains a virtual network with an application subnet and a database subnet, and sufficient vCPU quotas. Contoso plans to deploy the infrastructure of an SAP S/4HANA system in Sub-SAP-PRD by using Azure Center for SAP solutions.

    Which two actions should you perform before you start the deployment? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un nouvel abonnement Azure nommé **Sub-SAP-PRD** qui contient un réseau virtuel avec un sous-réseau d'application et un sous-réseau de base de données, ainsi que des quotas de processeurs virtuels suffisants. Contoso prévoit de déployer l'infrastructure d'un système SAP S/4HANA dans Sub-SAP-PRD avec le Centre Azure pour les solutions SAP.

    Quelles sont les deux actions à effectuer avant de lancer le déploiement ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Register the Microsoft.Workloads resource provider in Sub-SAP-PRD.", fr: "Inscrire le fournisseur de ressources Microsoft.Workloads dans Sub-SAP-PRD." } }
    - { id: b, text: { en: "Deploy the control plane of SAP Deployment Automation Framework in Sub-SAP-PRD.", fr: "Déployer le plan de contrôle de SAP Deployment Automation Framework dans Sub-SAP-PRD." } }
    - { id: c, text: { en: "Create a user-assigned managed identity with the role assignments the deployment needs.", fr: "Créer une identité managée affectée par l'utilisateur avec les attributions de rôles nécessaires au déploiement." } }
    - { id: d, text: { en: "Enable a system-assigned managed identity on a jump box VM in the virtual network.", fr: "Activer une identité managée affectée par le système sur une machine virtuelle de rebond du réseau virtuel." } }
    - { id: e, text: { en: "Rename the application subnet to GatewaySubnet so the service can find it.", fr: "Renommer le sous-réseau d'application en GatewaySubnet pour que le service le trouve." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The service runs on the Microsoft.Workloads resource provider, which must be registered in the subscription. The deployment also uses a user-assigned managed identity that has the required role assignments on the subscription or the resource groups (compute, network, storage); you can create it in advance or from the wizard.
    fr: |
      Le service repose sur le fournisseur de ressources Microsoft.Workloads, qui doit être inscrit dans l'abonnement. Le déploiement utilise aussi une identité managée affectée par l'utilisateur disposant des attributions de rôles requises sur l'abonnement ou les groupes de ressources (calcul, réseau, stockage) ; vous pouvez la créer à l'avance ou depuis l'Assistant.
  options:
    b:
      en: |
        The SDAF control plane belongs to another deployment tool; Azure Center for SAP solutions does not need it.
      fr: |
        Le plan de contrôle SDAF appartient à un autre outil de déploiement ; le Centre Azure pour les solutions SAP n'en a pas besoin.
    d:
      en: |
        The service uses a user-assigned managed identity, not a system-assigned identity of a jump box.
      fr: |
        Le service utilise une identité managée affectée par l'utilisateur, pas l'identité affectée par le système d'une machine virtuelle de rebond.
    e:
      en: |
        GatewaySubnet is a reserved name that must not be used for the application or database subnet.
      fr: |
        GatewaySubnet est un nom réservé qui ne doit pas être utilisé pour le sous-réseau d'application ou de base de données.
references:
  - title: Deploy an S/4HANA infrastructure
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/deploy-s4hana
