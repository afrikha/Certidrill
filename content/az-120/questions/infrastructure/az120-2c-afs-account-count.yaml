id: az120-2c-afs-account-count
objective: "2.3.9"
type: single
difficulty: 3
shuffle: false
status: draft
stem:
  en: |
    Woodgrove Bank is migrating 10 SAP NetWeaver systems to Azure: seven production systems and three non-production systems. Each system needs its own **sapmnt** share, and all shares will be NFS shares on Azure Files SSD.

    You need to plan the storage accounts. The design must follow Microsoft's general guidance for consolidating SAP shares in storage accounts, and it must minimize the number of storage accounts.

    How many storage accounts should you plan?
  fr: |
    Woodgrove Bank migre 10 systèmes SAP NetWeaver vers Azure : sept systèmes de production et trois systèmes hors production. Chaque système a besoin de son propre partage **sapmnt**, et tous les partages seront des partages NFS sur Azure Files SSD.

    Vous devez planifier les comptes de stockage. La conception doit suivre les recommandations générales de Microsoft pour le regroupement des partages SAP dans des comptes de stockage, et elle doit réduire au minimum le nombre de comptes de stockage.

    Combien de comptes de stockage devez-vous prévoir ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "10" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft recommends, in general, not consolidating the shares of more than five SAP systems in a single storage account and avoiding mixing production and non-production shares in the same account. The seven production systems therefore need two accounts, and the three non-production systems need one more, for a total of three.
    fr: |
      Microsoft recommande, en général, de ne pas regrouper les partages de plus de cinq systèmes SAP dans un même compte de stockage et d'éviter de mélanger les partages de production et hors production dans le même compte. Les sept systèmes de production nécessitent donc deux comptes, et les trois systèmes hors production un de plus, soit trois au total.
  options:
    a: { en: "One account would hold 10 systems and mix production with non-production.", fr: "Un seul compte contiendrait 10 systèmes et mélangerait production et hors production." }
    b: { en: "With two accounts, either an account holds more than five systems or production and non-production shares are mixed.", fr: "Avec deux comptes, soit un compte contient plus de cinq systèmes, soit les partages de production et hors production sont mélangés." }
    d: { en: "One account per system follows the guidance but doesn't minimize the number of accounts.", fr: "Un compte par système respecte les recommandations, mais ne réduit pas le nombre de comptes au minimum." }
references:
  - title: Azure VMs high availability for SAP NW on SLES with NFS on Azure Files
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-nfs-azure-files
