id: az120-2c-hana-backup-facts
objective: "2.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans to protect an SAP HANA database that runs on an Azure virtual machine by using Azure Backup. The design includes Backint-based backups and HANA instance snapshot backups with the standard policy.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit de protéger une base de données SAP HANA qui s'exécute sur une machine virtuelle Azure avec Sauvegarde Azure. La conception comprend des sauvegardes basées sur Backint et des sauvegardes par instantanés d'instance HANA avec la stratégie standard.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Log backups of a database start only after a full backup of that database has completed successfully.
        fr: Les sauvegardes de journaux d'une base de données ne démarrent qu'après la réussite d'une sauvegarde complète de cette base.
    - id: s2
      text:
        en: The HANA instance snapshots are transferred to the Recovery Services vault and billed as vault backup storage.
        fr: Les instantanés d'instance HANA sont transférés vers le coffre Recovery Services et facturés comme stockage de sauvegarde du coffre.
    - id: s3
      text:
        en: Before you configure the instance snapshot backup, the database must be protected by a Backint policy with weekly full and log backups.
        fr: Avant de configurer la sauvegarde par instantanés d'instance, la base de données doit être protégée par une stratégie Backint avec des sauvegardes complètes hebdomadaires et des sauvegardes de journaux.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Log backups, which can run as often as every 15 minutes, only begin to flow after a successful full backup. With the standard policy, instance snapshots are managed disk snapshots stored in a resource group that you choose; they aren't transferred to the vault and incur snapshot storage charges instead. Snapshot backup configuration fails unless the database already has a Backint policy with weekly full backups and log backups.
    fr: |
      Les sauvegardes de journaux, qui peuvent s'exécuter toutes les 15 minutes, ne commencent qu'après une sauvegarde complète réussie. Avec la stratégie standard, les instantanés d'instance sont des instantanés de disques managés stockés dans un groupe de ressources que vous choisissez ; ils ne sont pas transférés vers le coffre et génèrent à la place des frais de stockage d'instantanés. La configuration de la sauvegarde par instantanés échoue si la base ne dispose pas déjà d'une stratégie Backint avec sauvegardes complètes hebdomadaires et sauvegardes de journaux.
references:
  - title: About the SAP HANA database backup on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-about
  - title: Back up SAP HANA database instances on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-instances-backup
