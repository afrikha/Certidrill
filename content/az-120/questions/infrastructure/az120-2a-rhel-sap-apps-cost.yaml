id: az120-2a-rhel-sap-apps-cost
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin will deploy eight SAP NetWeaver application server VMs on Red Hat Enterprise Linux 9. The application servers do not run in a Pacemaker cluster. Each VM must get the SAP-specific RHEL packages from the Azure Red Hat Update Infrastructure (RHUI) with pay-as-you-go licensing.

    You need to choose an Azure Marketplace offer for the VMs. The solution must minimize the software charges of the VMs.

    Which offer should you choose?
  fr: |
    Tailspin va déployer huit machines virtuelles de serveur d'applications SAP NetWeaver sur Red Hat Enterprise Linux 9. Les serveurs d'applications ne s'exécutent pas dans un cluster Pacemaker. Chaque machine virtuelle doit obtenir les packages RHEL propres à SAP depuis Red Hat Update Infrastructure (RHUI) d'Azure avec des licences avec paiement à l'utilisation.

    Vous devez choisir une offre de la Place de marché Azure pour les machines virtuelles. La solution doit réduire au minimum les frais logiciels des machines virtuelles.

    Quelle offre devez-vous choisir ?
body:
  options:
    - { id: a, text: "RHEL-SAP-HA" }
    - { id: b, text: "RHEL-SAP-APPS" }
    - { id: c, text: "RHEL" }
    - { id: d, text: "RHEL-SAP-HANA" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      RHEL-SAP-APPS (RHEL for SAP Applications) images are entitled to the SAP Applications repositories and the base RHEL repositories. They provide what non-clustered application servers need without the High Availability premium that RHEL-SAP-HA adds.
    fr: |
      Les images RHEL-SAP-APPS (RHEL for SAP Applications) donnent droit aux référentiels SAP Applications et aux référentiels RHEL de base. Elles fournissent ce dont ont besoin des serveurs d'applications hors cluster, sans le supplément High Availability qu'ajoute RHEL-SAP-HA.
  options:
    a:
      en: |
        RHEL-SAP-HA also bills the High Availability premium, which these non-clustered VMs do not need.
      fr: |
        RHEL-SAP-HA facture aussi le supplément High Availability, inutile pour ces machines virtuelles hors cluster.
    c:
      en: |
        The standard RHEL offer is not entitled to the SAP repositories, so the SAP-specific packages would be missing.
      fr: |
        L'offre RHEL standard ne donne pas droit aux référentiels SAP : les packages propres à SAP manqueraient.
    d:
      en: |
        RHEL-SAP-HANA is a RHEL 7 offering that Red Hat considers end of life; Red Hat recommends moving to RHEL-SAP-HA.
      fr: |
        RHEL-SAP-HANA est une offre RHEL 7 que Red Hat considère en fin de vie ; Red Hat recommande de passer à RHEL-SAP-HA.
references:
  - title: Overview of Red Hat Enterprise Linux images in Azure - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/workloads/redhat/redhat-images
