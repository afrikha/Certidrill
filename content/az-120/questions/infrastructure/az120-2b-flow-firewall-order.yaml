id: az120-2b-flow-firewall-order
objective: "2.2.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank runs SAP central services in a Pacemaker cluster. The cluster VMs and their internal Standard Load Balancer are in the subnet **snet-sap** of the virtual network **vnet-sap**. The VMs need outbound access to the Azure management API for the fence agent.

    Corporate policy requires that this outbound traffic go through Azure Firewall so that it is logged. A firewall policy named **fp-sap-out** that allows the required endpoints already exists.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank exécute les services centraux SAP dans un cluster Pacemaker. Les machines virtuelles du cluster et leur équilibreur de charge interne Standard se trouvent dans le sous-réseau **snet-sap** du réseau virtuel **vnet-sap**. Les machines virtuelles ont besoin d'un accès sortant à l'API de gestion Azure pour l'agent d'isolation.

    La stratégie de l'entreprise exige que ce trafic sortant passe par le Pare-feu Azure pour être journalisé. Une stratégie de pare-feu nommée **fp-sap-out**, qui autorise les points de terminaison nécessaires, existe déjà.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: subnet, text: { en: "Create a subnet named AzureFirewallSubnet in vnet-sap.", fr: "Créer un sous-réseau nommé AzureFirewallSubnet dans vnet-sap." } }
    - { id: fw, text: { en: "Deploy Azure Firewall in vnet-sap with the policy fp-sap-out, and note its private IP address.", fr: "Déployer le Pare-feu Azure dans vnet-sap avec la stratégie fp-sap-out, et noter son adresse IP privée." } }
    - { id: rt, text: { en: "Create a route table with a route for 0.0.0.0/0, next hop type Virtual appliance, to the private IP address of the firewall.", fr: "Créer une table de routage contenant un itinéraire 0.0.0.0/0, avec le type de tronçon suivant Appliance virtuelle, vers l'adresse IP privée du pare-feu." } }
    - { id: assoc, text: { en: "Associate the route table with snet-sap.", fr: "Associer la table de routage à snet-sap." } }
    - { id: assocfw, text: { en: "Associate the route table with AzureFirewallSubnet.", fr: "Associer la table de routage à AzureFirewallSubnet." } }
    - { id: ipfwd, text: { en: "Enable IP forwarding on the network interfaces of the cluster VMs.", fr: "Activer le transfert IP sur les interfaces réseau des machines virtuelles du cluster." } }
answer:
  sequence: [ subnet, fw, rt, assoc ]
explanation:
  correct:
    en: "Azure Firewall requires a dedicated subnet named AzureFirewallSubnet, so it comes first; the firewall then gets the private IP address that the route points to. The user-defined route 0.0.0.0/0 with next hop Virtual appliance takes effect only after the route table is associated with the subnet of the SAP VMs and the load balancer."
    fr: "Le Pare-feu Azure exige un sous-réseau dédié nommé AzureFirewallSubnet, qui vient donc en premier ; le pare-feu reçoit ensuite l'adresse IP privée vers laquelle pointe l'itinéraire. L'itinéraire défini par l'utilisateur 0.0.0.0/0 avec le tronçon suivant Appliance virtuelle ne s'applique qu'une fois la table de routage associée au sous-réseau des machines virtuelles SAP et de l'équilibreur de charge."
  options:
    assocfw: { en: "A default route to itself on AzureFirewallSubnet would break the firewall's own internet egress; the route belongs on snet-sap.", fr: "Un itinéraire par défaut vers lui-même sur AzureFirewallSubnet casserait la sortie Internet du pare-feu ; l'itinéraire doit être sur snet-sap." }
    ipfwd: { en: "IP forwarding is needed on an NVA that forwards traffic, not on the VMs that send it.", fr: "Le transfert IP est nécessaire sur une NVA qui relaie le trafic, pas sur les machines virtuelles qui l'émettent." }
references:
  - title: Outbound connectivity for SAP VMs
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-standard-load-balancer-outbound-connections
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
