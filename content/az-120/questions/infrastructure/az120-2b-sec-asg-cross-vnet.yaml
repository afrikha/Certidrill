id: az120-2b-sec-asg-cross-vnet
objective: "2.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has two peered virtual networks in the same region:

    | Virtual network | Contents |
    | --- | --- |
    | vnet-sap | SAP HANA VMs, whose NICs are in the application security group **asg-hana** |
    | vnet-mgmt | Administration jump boxes in the subnet 10.50.1.0/27, whose NICs are in the application security group **asg-jump** |

    You need to add an inbound rule to the NSG of the HANA subnet that allows SSH and the HANA administration ports only from the jump boxes. When you create the rule with asg-jump as the source and asg-hana as the destination, the operation fails.

    What should you use as the source of the rule?
  fr: |
    Contoso dispose de deux réseaux virtuels reliés par peering dans la même région :

    | Réseau virtuel | Contenu |
    | --- | --- |
    | vnet-sap | Machines virtuelles SAP HANA, dont les cartes réseau appartiennent au groupe de sécurité d'application **asg-hana** |
    | vnet-mgmt | Serveurs de rebond d'administration dans le sous-réseau 10.50.1.0/27, dont les cartes réseau appartiennent au groupe de sécurité d'application **asg-jump** |

    Vous devez ajouter au NSG du sous-réseau HANA une règle entrante qui autorise SSH et les ports d'administration HANA uniquement depuis les serveurs de rebond. Quand vous créez la règle avec asg-jump comme source et asg-hana comme destination, l'opération échoue.

    Que devez-vous utiliser comme source de la règle ?
body:
  options:
    - id: a
      text: { en: "The VirtualNetwork service tag", fr: "L'étiquette de service VirtualNetwork" }
    - id: b
      text: { en: "The address prefix 10.50.1.0/27", fr: "Le préfixe d'adresse 10.50.1.0/27" }
    - id: c
      text: { en: "asg-hana, after adding the jump box NICs to it", fr: "asg-hana, après y avoir ajouté les cartes réseau des serveurs de rebond" }
    - id: d
      text: { en: "asg-jump, after moving the rule to the NSG of the jump box subnet", fr: "asg-jump, après avoir déplacé la règle vers le NSG du sous-réseau des serveurs de rebond" }
answer: { optionId: b }
explanation:
  correct:
    en: "When ASGs are used as both source and destination of a rule, the NICs of both groups must be in the same virtual network, which isn't the case here. Using the CIDR block of the jump box subnet as the source and asg-hana as the destination allows exactly the jump boxes and still follows the HANA VMs through the ASG."
    fr: "Quand des ASG sont utilisés à la fois comme source et comme destination d'une règle, les cartes réseau des deux groupes doivent être dans le même réseau virtuel, ce qui n'est pas le cas ici. Utiliser le bloc CIDR du sous-réseau des serveurs de rebond comme source et asg-hana comme destination autorise exactement les serveurs de rebond, tout en suivant les machines virtuelles HANA grâce à l'ASG."
  options:
    a:
      en: "VirtualNetwork includes the whole address space of vnet-sap, every peered network and the on-premises ranges, which is far broader than the jump boxes."
      fr: "VirtualNetwork inclut tout l'espace d'adressage de vnet-sap, chaque réseau relié par peering et les plages locales, ce qui est bien plus large que les serveurs de rebond."
    c:
      en: "All NICs of an ASG must be in the virtual network of its first NIC, so jump box NICs from vnet-mgmt can't join asg-hana."
      fr: "Toutes les cartes réseau d'un ASG doivent être dans le réseau virtuel de sa première carte réseau : les cartes des serveurs de rebond de vnet-mgmt ne peuvent pas rejoindre asg-hana."
    d:
      en: "The same cross-virtual-network ASG constraint applies in any NSG, and an outbound rule on the jump box side doesn't protect the HANA subnet."
      fr: "La même contrainte des ASG entre réseaux virtuels s'applique dans tout NSG, et une règle côté serveurs de rebond ne protège pas le sous-réseau HANA."
references:
  - title: Azure Application Security Groups Overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
