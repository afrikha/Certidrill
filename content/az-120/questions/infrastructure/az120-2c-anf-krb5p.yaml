id: az120-2c-anf-krb5p
objective: "2.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum hosts the SAP global transport directory **/usr/sap/trans** on an Azure NetApp Files NFS v4.1 volume. A new security requirement states that NFS clients must authenticate with Kerberos and that the content of every NFS packet between the SAP VMs and the volume must be encrypted.

    Which security setting should you configure for the volume and the mounts?
  fr: |
    Adatum héberge le répertoire de transport global SAP **/usr/sap/trans** sur un volume NFS v4.1 Azure NetApp Files. Une nouvelle exigence de sécurité impose que les clients NFS s'authentifient avec Kerberos et que le contenu de chaque paquet NFS entre les machines virtuelles SAP et le volume soit chiffré.

    Quel paramètre de sécurité devez-vous configurer pour le volume et les montages ?
body:
  options:
    - { id: a, text: krb5 }
    - { id: b, text: krb5i }
    - { id: c, text: krb5p }
    - { id: d, text: sys }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kerberos 5p (krb5p) provides authentication, integrity checking and privacy: it wraps each NFS packet to encrypt its content. In Azure NetApp Files, NFS Kerberos is supported only with NFS v4.1.
    fr: |
      Kerberos 5p (krb5p) fournit l'authentification, la vérification de l'intégrité et la confidentialité : il encapsule chaque paquet NFS pour en chiffrer le contenu. Dans Azure NetApp Files, Kerberos pour NFS n'est pris en charge qu'avec NFS v4.1.
  options:
    a: { en: "krb5 authenticates the clients, but NFS packets aren't encrypted.", fr: "krb5 authentifie les clients, mais les paquets NFS ne sont pas chiffrés." }
    b: { en: "krb5i adds integrity checking to authentication but doesn't encrypt the packet content.", fr: "krb5i ajoute la vérification de l'intégrité à l'authentification, mais ne chiffre pas le contenu des paquets." }
    d: { en: "sys uses UNIX user and group IDs without Kerberos authentication or encryption.", fr: "sys utilise les ID d'utilisateur et de groupe UNIX, sans authentification Kerberos ni chiffrement." }
references:
  - title: Understand data encryption in Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/understand-data-encryption
