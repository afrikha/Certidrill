id: az120-2a-hana-prod-vm-source
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to move its production SAP S/4HANA system to Azure. The SAP HANA database will run scale-up on a single Azure virtual machine.

    The SAP Basis team must select an Azure VM type that SAP supports for a production SAP HANA database.

    Which source should the team use to confirm that a VM type is supported?
  fr: |
    Contoso prévoit de migrer son système SAP S/4HANA de production vers Azure. La base de données SAP HANA s'exécutera en scale-up sur une seule machine virtuelle Azure.

    L'équipe SAP Basis doit choisir un type de machine virtuelle Azure pris en charge par SAP pour une base de données SAP HANA de production.

    Quelle source l'équipe doit-elle utiliser pour confirmer qu'un type de machine virtuelle est pris en charge ?
body:
  options:
    - { id: a, text: { en: "The SAP HANA hardware directory (Certified IaaS Platforms)", fr: "Le répertoire matériel SAP HANA (Certified IaaS Platforms)" } }
    - { id: b, text: { en: "The SAP Product Availability Matrix (PAM)", fr: "La matrice de disponibilité des produits SAP (PAM)" } }
    - { id: c, text: { en: "The memory optimized virtual machine sizes page on Microsoft Learn", fr: "La page des tailles de machines virtuelles à mémoire optimisée sur Microsoft Learn" } }
    - { id: d, text: { en: "The Azure products available by region page", fr: "La page des produits Azure disponibles par région" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For production SAP HANA, Microsoft states that you must use only the VM types listed as certified IaaS platforms in the SAP HANA hardware directory. SAP Note 1928533 lists a wider set of VM types that you can use for non-production HANA systems.
    fr: |
      Pour SAP HANA en production, Microsoft indique de n'utiliser que les types de machines virtuelles listés comme plateformes IaaS certifiées dans le répertoire matériel SAP HANA. La note SAP 1928533 liste un ensemble plus large de types utilisables pour les systèmes HANA hors production.
  options:
    b:
      en: |
        The PAM confirms that a combination of SAP release, operating system and DBMS is supported; it does not certify Azure VM types for HANA.
      fr: |
        La PAM confirme qu'une combinaison de version SAP, de système d'exploitation et de SGBD est prise en charge ; elle ne certifie pas les types de machines virtuelles Azure pour HANA.
    c:
      en: |
        The Azure sizes pages describe vCPUs, memory and limits, but they do not state whether SAP certifies a size for production HANA.
      fr: |
        Les pages des tailles Azure décrivent les processeurs virtuels, la mémoire et les limites, mais elles n'indiquent pas si SAP certifie une taille pour HANA en production.
    d:
      en: |
        This page shows where a VM family is deployed, which you check after you have picked a certified type, not to confirm SAP support.
      fr: |
        Cette page montre où une famille de machines virtuelles est déployée, ce que vous vérifiez après avoir choisi un type certifié, et non pour confirmer la prise en charge par SAP.
references:
  - title: SAP HANA infrastructure configurations and operations on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations
  - title: What SAP software is supported on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/supported-product-on-azure
