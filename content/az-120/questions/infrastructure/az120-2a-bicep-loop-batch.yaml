id: az120-2a-bicep-loop-batch
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are writing a Bicep file that deploys the SAP application servers of Northwind. The number of application servers is passed in an integer parameter named **appServerCount**.

    The file must declare the application server VM only once, and Azure Resource Manager must deploy the VMs two at a time instead of all in parallel.

    How should you declare the VM resource?
  fr: |
    Vous écrivez un fichier Bicep qui déploie les serveurs d'applications SAP de Northwind. Le nombre de serveurs d'applications est transmis dans un paramètre entier nommé **appServerCount**.

    Le fichier ne doit déclarer la machine virtuelle de serveur d'applications qu'une seule fois, et Azure Resource Manager doit déployer les machines virtuelles deux par deux plutôt que toutes en parallèle.

    Comment devez-vous déclarer la ressource de machine virtuelle ?
body:
  options:
    - { id: a, text: "`resource appVm '...' = [for i in range(0, appServerCount): { ... }]`" }
    - { id: b, text: { en: "`@batchSize(2)` followed by `resource appVm '...' = [for i in range(0, appServerCount): { ... }]`", fr: "`@batchSize(2)` suivi de `resource appVm '...' = [for i in range(0, appServerCount): { ... }]`" } }
    - { id: c, text: { en: "`@batchSize(2)` followed by `resource appVm '...' = if (appServerCount > 0) { ... }`", fr: "`@batchSize(2)` suivi de `resource appVm '...' = if (appServerCount > 0) { ... }`" } }
    - { id: d, text: "`resource appVm '...' = { copy: { name: 'appVm', count: appServerCount } ... }`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A `for` expression over `range(0, appServerCount)` creates one VM per iteration from a single declaration. Loop instances deploy in parallel by default; the `@batchSize(2)` decorator on the loop makes Resource Manager deploy them in batches of two, each batch waiting for the previous one.
    fr: |
      Une expression `for` sur `range(0, appServerCount)` crée une machine virtuelle par itération à partir d'une seule déclaration. Les instances d'une boucle se déploient en parallèle par défaut ; le décorateur `@batchSize(2)` sur la boucle fait déployer Resource Manager par lots de deux, chaque lot attendant le précédent.
  options:
    a:
      en: |
        Without @batchSize, the loop instances are deployed in parallel.
      fr: |
        Sans @batchSize, les instances de la boucle sont déployées en parallèle.
    c:
      en: |
        A condition deploys at most one instance; batchSize applies only to a loop.
      fr: |
        Une condition déploie au plus une instance ; batchSize ne s'applique qu'à une boucle.
    d:
      en: |
        The copy element is the ARM JSON syntax that a Bicep loop is transpiled to; Bicep itself uses the for expression.
      fr: |
        L'élément copy est la syntaxe ARM JSON vers laquelle une boucle Bicep est transpilée ; Bicep utilise l'expression for.
references:
  - title: Iterative loops in Bicep - Azure Resource Manager
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/loops
