id: az120-2a-ext-aem-cli
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You manage an SAP application server VM named **vmsapapp01** in a resource group named **RG-SAP-PRD**. The resource group also contains resources of other SAP systems.

    You need to deploy the Azure VM extension for SAP solutions on vmsapapp01 by using the Azure CLI. The solution must meet the following requirements:

    - Install the new version of the extension.
    - Grant the VM identity access only to the resources of vmsapapp01, such as its disks and network interfaces, instead of the whole resource group.
    - Send the extension's calls to the Azure API through the corporate proxy.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez une machine virtuelle de serveur d'applications SAP nommée **vmsapapp01** dans un groupe de ressources nommé **RG-SAP-PRD**. Ce groupe de ressources contient aussi des ressources d'autres systèmes SAP.

    Vous devez déployer l'extension de machine virtuelle Azure pour les solutions SAP sur vmsapapp01 avec Azure CLI. La solution doit répondre aux exigences suivantes :

    - Installer la nouvelle version de l'extension.
    - Accorder à l'identité de la machine virtuelle un accès aux seules ressources de vmsapapp01, comme ses disques et ses interfaces réseau, plutôt qu'à tout le groupe de ressources.
    - Faire passer les appels de l'extension vers l'API Azure par le proxy de l'entreprise.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az vm aem [[cmd]] \
      --resource-group RG-SAP-PRD \
      --name vmsapapp01 \
      [[ver]] \
      [[scope]] \
      --proxy-uri http://proxy.contoso.com:8080
  slots:
    - id: cmd
      options:
        - { id: set, text: set }
        - { id: verify, text: verify }
        - { id: delete, text: delete }
    - id: ver
      options:
        - { id: inst, text: "--install-new-extension" }
        - { id: dbg, text: "--debug-extension" }
        - { id: skipan, text: "--skip-storage-analytics" }
    - id: scope
      options:
        - { id: wait, text: "--wait-time-in-minutes 15" }
        - { id: indiv, text: "--set-access-to-individual-resources" }
        - { id: skipchk, text: "--skip-storage-check" }
answer:
  values: { cmd: set, ver: inst, scope: indiv }
explanation:
  correct:
    en: |
      `az vm aem set` configures the extension, and `--install-new-extension` selects the new version. `--set-access-to-individual-resources` grants the VM identity access to individual resources such as data disks instead of the complete resource group, and `--proxy-uri` routes the calls to the Azure API through a proxy.
    fr: |
      `az vm aem set` configure l'extension, et `--install-new-extension` sélectionne la nouvelle version. `--set-access-to-individual-resources` accorde à l'identité de la machine virtuelle l'accès à des ressources individuelles comme les disques de données plutôt qu'à tout le groupe de ressources, et `--proxy-uri` fait passer les appels vers l'API Azure par un proxy.
  options:
    verify:
      en: |
        `az vm aem verify` checks an existing configuration; it does not install anything.
      fr: |
        `az vm aem verify` vérifie une configuration existante ; il n'installe rien.
    delete:
      en: |
        `az vm aem delete` removes the extension.
      fr: |
        `az vm aem delete` supprime l'extension.
    dbg:
      en: |
        `--debug-extension` enables debug mode; it does not choose the new version.
      fr: |
        `--debug-extension` active le mode débogage ; il ne choisit pas la nouvelle version.
    skipchk:
      en: |
        `--skip-storage-check` is a parameter of `az vm aem verify` that disables the table content test.
      fr: |
        `--skip-storage-check` est un paramètre de `az vm aem verify` qui désactive le test du contenu des tables.
    wait:
      en: |
        `--wait-time-in-minutes` belongs to `az vm aem verify` and sets how long to wait for storage metrics.
      fr: |
        `--wait-time-in-minutes` appartient à `az vm aem verify` et fixe la durée d'attente des métriques de stockage.
references:
  - title: az vm aem
    url: https://learn.microsoft.com/en-us/cli/azure/vm/aem
  - title: New version of Azure VM extension for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap-new
