id: az120-2c-afs-account-type
objective: "2.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum plans to host **/sapmnt/AD1** and **/usr/sap/trans** of a highly available SAP NetWeaver system on SUSE Linux Enterprise Server as NFS v4.1 shares on Azure Files.

    You need to create the storage account that will host the shares.

    Which type of storage account should you create?
  fr: |
    Adatum prévoit d'héberger **/sapmnt/AD1** et **/usr/sap/trans** d'un système SAP NetWeaver hautement disponible sur SUSE Linux Enterprise Server sous forme de partages NFS v4.1 sur Azure Files.

    Vous devez créer le compte de stockage qui hébergera les partages.

    Quel type de compte de stockage devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "Standard performance, general-purpose v2 account", fr: "Un compte usage général v2 aux performances Standard" } }
    - { id: b, text: { en: "Premium performance, BlockBlobStorage account", fr: "Un compte BlockBlobStorage aux performances Premium" } }
    - { id: c, text: { en: "Standard performance, general-purpose v2 account with hierarchical namespace", fr: "Un compte usage général v2 aux performances Standard avec espace de noms hiérarchique" } }
    - { id: d, text: { en: "Premium performance, FileStorage account", fr: "Un compte FileStorage aux performances Premium" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      NFS on Azure Files runs on Azure Files SSD, which you deploy by creating a storage account with Premium performance and the FileStorage account kind. You then create the shares with the NFS protocol in that account.
    fr: |
      NFS sur Azure Files s'exécute sur Azure Files SSD, que vous déployez en créant un compte de stockage aux performances Premium de type FileStorage. Vous créez ensuite les partages avec le protocole NFS dans ce compte.
  options:
    a: { en: "Standard general-purpose v2 accounts host HDD file shares, which don't offer the NFS protocol.", fr: "Les comptes usage général v2 Standard hébergent des partages de fichiers HDD, qui ne proposent pas le protocole NFS." }
    b: { en: "A BlockBlobStorage account hosts premium block blobs, not file shares.", fr: "Un compte BlockBlobStorage héberge des objets blob de blocs Premium, pas des partages de fichiers." }
    c: { en: "Hierarchical namespace enables Data Lake Storage and Blob NFS 3.0, not Azure Files NFS shares.", fr: "L'espace de noms hiérarchique active Data Lake Storage et NFS 3.0 pour les blobs, pas les partages NFS Azure Files." }
references:
  - title: Azure VMs high availability for SAP NW on SLES with NFS on Azure Files
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-nfs-azure-files
