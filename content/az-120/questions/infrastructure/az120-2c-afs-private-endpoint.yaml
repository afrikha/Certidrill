id: az120-2c-afs-private-endpoint
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank created a premium FileStorage account named **sapafsprd** that hosts the NFS shares for **/sapmnt** and **/usr/sap/trans** of its SAP systems. The SAP VMs run in a virtual network named **VNet-SAP**.

    You need to ensure that the SAP VMs reach the shares only through a private IP address in VNet-SAP, that the account can't be reached from public networks, and that the VMs resolve the account name without manual host file entries.

    What should you do?
  fr: |
    Woodgrove Bank a créé un compte FileStorage Premium nommé **sapafsprd** qui héberge les partages NFS de **/sapmnt** et de **/usr/sap/trans** de ses systèmes SAP. Les machines virtuelles SAP s'exécutent dans un réseau virtuel nommé **VNet-SAP**.

    Vous devez faire en sorte que les machines virtuelles SAP n'atteignent les partages que par une adresse IP privée de VNet-SAP, que le compte ne soit pas accessible depuis les réseaux publics, et que les machines virtuelles résolvent le nom du compte sans entrée manuelle dans le fichier hosts.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a private endpoint for the file sub-resource with private DNS zone integration, and disable public network access.", fr: "Créer un point de terminaison privé pour la sous-ressource file avec intégration à une zone DNS privée, et désactiver l'accès réseau public." } }
    - { id: b, text: { en: "Enable a Microsoft.Storage service endpoint on the SAP subnet, and keep public network access enabled for all networks.", fr: "Activer un point de terminaison de service Microsoft.Storage sur le sous-réseau SAP, et laisser l'accès réseau public activé pour tous les réseaux." } }
    - { id: c, text: { en: "Generate a shared access signature (SAS) for each share, and add it to the NFS mount options on each VM.", fr: "Générer une signature d'accès partagé (SAS) pour chaque partage, et l'ajouter aux options de montage NFS de chaque machine virtuelle." } }
    - { id: d, text: { en: "Assign the Storage File Data SMB Share Reader role to the managed identities of the SAP VMs.", fr: "Attribuer le rôle Storage File Data SMB Share Reader aux identités managées des machines virtuelles SAP." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A private endpoint gives the storage account a private IP address in VNet-SAP, and private DNS zone integration makes the account name resolve to that address. Microsoft recommends using a private endpoint for Azure Files NFS shares used by SAP and removing public endpoints from storage accounts.
    fr: |
      Un point de terminaison privé donne au compte de stockage une adresse IP privée dans VNet-SAP, et l'intégration à une zone DNS privée fait résoudre le nom du compte vers cette adresse. Microsoft recommande d'utiliser un point de terminaison privé pour les partages NFS Azure Files utilisés par SAP et de supprimer les points de terminaison publics des comptes de stockage.
  options:
    b: { en: "A service endpoint keeps the public endpoint of the account, and allowing all networks leaves it reachable from public networks.", fr: "Un point de terminaison de service conserve le point de terminaison public du compte, et autoriser tous les réseaux le laisse accessible depuis les réseaux publics." }
    c: { en: "NFS shares don't use SAS tokens; access is controlled at the network level.", fr: "Les partages NFS n'utilisent pas de jetons SAS ; l'accès est contrôlé au niveau du réseau." }
    d: { en: "SMB share roles don't apply to NFS shares and don't control the network path.", fr: "Les rôles de partage SMB ne s'appliquent pas aux partages NFS et ne contrôlent pas le chemin réseau." }
references:
  - title: Azure VMs high availability for SAP NW on SLES with NFS on Azure Files
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-nfs-azure-files
  - title: Secure Azure Infrastructure for SAP Applications
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-security-infrastructure
