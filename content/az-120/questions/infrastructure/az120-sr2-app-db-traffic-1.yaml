id: az120-sr2-app-db-traffic-1
objective: "2.2.5"
type: series_yesno
series: az120-sr2-app-db-traffic
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You route the traffic from AppSubnet to DbSubnet through Azure Firewall.
  fr: |
    Vous faites passer le trafic d'AppSubnet vers DbSubnet par Azure Firewall.
body:
  solution:
    en: |
      You associate a route table with **AppSubnet** that contains a user-defined route for the address prefix of **DbSubnet** with the private IP address of **Azure Firewall** as the next hop. On Azure Firewall, you create network rules that allow only the HANA SQL ports from the application server VMs to the HANA VM.
    fr: |
      Vous associez à **AppSubnet** une table de routage qui contient un itinéraire défini par l'utilisateur pour le préfixe d'adresse de **DbSubnet**, avec l'adresse IP privée d'**Azure Firewall** comme tronçon suivant. Sur Azure Firewall, vous créez des règles de réseau qui autorisent uniquement les ports SQL de HANA des machines virtuelles de serveur d'applications vers la machine virtuelle HANA.
answer: { value: false }
explanation:
  correct:
    en: |
      A firewall or other network virtual appliance in the communication path between the SAP application layer and the DBMS layer is not supported for SAP NetWeaver and S/4HANA. It can double the latency and restrict throughput on the most critical path, so the path between the two layers must stay direct.
    fr: |
      Un pare-feu ou toute autre appliance virtuelle réseau (NVA) placée dans le chemin de communication entre la couche Application SAP et la couche SGBD n'est pas prise en charge pour SAP NetWeaver et S/4HANA. Elle peut doubler la latence et limiter le débit sur le chemin le plus critique : le chemin entre les deux couches doit rester direct.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
