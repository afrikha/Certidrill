id: az120-2c-snapshot-roles
objective: "2.3.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam is configuring Azure Backup HANA instance snapshot backups for an SAP HANA virtual machine named **hdb01**. The disks of hdb01 are in a resource group named **RG-HANA-Disks**, and the snapshots will be stored in a resource group named **RG-HANA-Snap**. The backups use the system-assigned managed identity of hdb01.

    You need to assign the permissions that the snapshot backups require.

    Which role should you assign for each scope? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam configure des sauvegardes par instantanés d'instance HANA avec Sauvegarde Azure pour une machine virtuelle SAP HANA nommée **hdb01**. Les disques de hdb01 se trouvent dans un groupe de ressources nommé **RG-HANA-Disks**, et les instantanés seront stockés dans un groupe de ressources nommé **RG-HANA-Snap**. Les sauvegardes utilisent l'identité managée affectée par le système de hdb01.

    Vous devez attribuer les autorisations requises par les sauvegardes par instantanés.

    Quel rôle devez-vous attribuer pour chaque étendue ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Managed identity of hdb01 on RG-HANA-Disks: [[disk]]

      Managed identity of hdb01 on RG-HANA-Snap: [[snap]]

      Backup Management Service on RG-HANA-Snap: [[bms]]
    fr: |
      Identité managée de hdb01 sur RG-HANA-Disks : [[disk]]

      Identité managée de hdb01 sur RG-HANA-Snap : [[snap]]

      Backup Management Service sur RG-HANA-Snap : [[bms]]
  slots:
    - id: disk
      options:
        - { id: dbr, text: Disk Backup Reader }
        - { id: dsc, text: Disk Snapshot Contributor }
        - { id: dro, text: Disk Restore Operator }
        - { id: vmc, text: Virtual Machine Contributor }
    - id: snap
      options:
        - { id: dbr, text: Disk Backup Reader }
        - { id: dsc, text: Disk Snapshot Contributor }
        - { id: bop, text: Backup Operator }
        - { id: vmc, text: Virtual Machine Contributor }
    - id: bms
      options:
        - { id: dbr, text: Disk Backup Reader }
        - { id: dsc, text: Disk Snapshot Contributor }
        - { id: dro, text: Disk Restore Operator }
        - { id: bop, text: Backup Operator }
answer:
  values: { disk: dbr, snap: dsc, bms: dsc }
explanation:
  correct:
    en: |
      The VM's managed identity needs Disk Backup Reader on the resource group of the source disks and Disk Snapshot Contributor on the snapshot resource group to create and store the snapshots. The Backup Management Service also needs Disk Snapshot Contributor on the snapshot resource group to delete expired snapshots; this assignment isn't made by the portal and must be added manually.
    fr: |
      L'identité managée de la machine virtuelle a besoin de Disk Backup Reader sur le groupe de ressources des disques sources et de Disk Snapshot Contributor sur le groupe de ressources des instantanés pour créer et stocker les instantanés. Backup Management Service a aussi besoin de Disk Snapshot Contributor sur le groupe de ressources des instantanés pour supprimer les instantanés expirés ; cette attribution n'est pas faite par le portail et doit être ajoutée manuellement.
  options:
    vmc: { en: "Virtual Machine Contributor is needed by the backup administrator on the VM, not by the managed identity on these resource groups.", fr: "Virtual Machine Contributor est nécessaire à l'administrateur de sauvegarde sur la machine virtuelle, pas à l'identité managée sur ces groupes de ressources." }
    dro: { en: "Disk Restore Operator is used for disk restores, not to create or delete snapshot backups.", fr: "Disk Restore Operator sert aux restaurations de disques, pas à la création ni à la suppression des instantanés de sauvegarde." }
references:
  - title: Back up SAP HANA database instances on Azure VMs
    url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-instances-backup
