id: az120-2b-sec-asg-grouping
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware hosts several SAP systems in one virtual network. The database servers of all the systems are spread across several subnets, and VMs are added and removed regularly.

    You need to write network security group (NSG) rules that allow the SAP application servers to reach every database server on the database ports. The rules must not reference individual IP addresses and must apply automatically to new database VMs.

    What should you use in the NSG rules?
  fr: |
    Proseware héberge plusieurs systèmes SAP dans un même réseau virtuel. Les serveurs de base de données de tous les systèmes sont répartis sur plusieurs sous-réseaux, et des machines virtuelles sont régulièrement ajoutées ou supprimées.

    Vous devez écrire des règles de groupe de sécurité réseau (NSG) qui autorisent les serveurs d'applications SAP à joindre tous les serveurs de base de données sur les ports de base de données. Les règles ne doivent pas référencer d'adresses IP individuelles et doivent s'appliquer automatiquement aux nouvelles machines virtuelles de base de données.

    Que devez-vous utiliser dans les règles NSG ?
body:
  options:
    - id: a
      text: { en: "The VirtualNetwork service tag as the destination", fr: "L'étiquette de service VirtualNetwork comme destination" }
    - id: b
      text: { en: "Application security groups for the application servers and the database servers", fr: "Des groupes de sécurité d'application pour les serveurs d'applications et les serveurs de base de données" }
    - id: c
      text: { en: "An augmented security rule that lists the subnet prefixes of the database servers", fr: "Une règle de sécurité augmentée qui liste les préfixes des sous-réseaux des serveurs de base de données" }
    - id: d
      text: { en: "A separate NSG associated with the network interface of each database server", fr: "Un NSG distinct associé à l'interface réseau de chaque serveur de base de données" }
answer: { optionId: b }
explanation:
  correct:
    en: "Application security groups let you group VM network interfaces by workload and use the groups as source and destination of NSG rules instead of IP addresses. The SAP guidance suggests, for example, an ASG with all the DBMS VMs of the landscape; a new database VM is covered as soon as its NIC joins the ASG."
    fr: "Les groupes de sécurité d'application permettent de regrouper les interfaces réseau des machines virtuelles par charge de travail et d'utiliser ces groupes comme source et destination des règles NSG à la place d'adresses IP. Les recommandations SAP suggèrent par exemple un ASG contenant toutes les machines virtuelles SGBD du paysage ; une nouvelle machine virtuelle de base de données est couverte dès que sa carte réseau rejoint l'ASG."
  options:
    a:
      en: "VirtualNetwork covers the whole virtual network, peered networks and on-premises ranges, not only the database servers."
      fr: "VirtualNetwork couvre tout le réseau virtuel, les réseaux reliés par peering et les plages locales, pas seulement les serveurs de base de données."
    c:
      en: "Subnet prefixes are IP ranges, and the database subnets also contain other VMs; the rule wouldn't follow the workload."
      fr: "Les préfixes de sous-réseau sont des plages IP, et les sous-réseaux de base de données contiennent aussi d'autres machines virtuelles ; la règle ne suivrait pas la charge de travail."
    d:
      en: "Per-NIC NSGs multiply the rule sets to maintain, and Microsoft recommends NIC-level NSGs only in exceptional cases."
      fr: "Des NSG par carte réseau multiplient les jeux de règles à maintenir, et Microsoft ne recommande les NSG au niveau de la carte réseau que dans des cas exceptionnels."
references:
  - title: Azure Application Security Groups Overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
