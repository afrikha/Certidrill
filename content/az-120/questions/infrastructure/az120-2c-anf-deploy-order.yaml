id: az120-2c-anf-deploy-order
objective: "2.3.8"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders plans to host the HANA volumes of a new SAP HANA VM on Azure NetApp Files. The Azure NetApp Files resource provider is registered, and the virtual network of the VM already contains a subnet delegated to Azure NetApp Files.

    You need to make the volumes available to SAP HANA.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders prévoit d'héberger les volumes HANA d'une nouvelle machine virtuelle SAP HANA sur Azure NetApp Files. Le fournisseur de ressources Azure NetApp Files est inscrit, et le réseau virtuel de la machine virtuelle contient déjà un sous-réseau délégué à Azure NetApp Files.

    Vous devez rendre les volumes disponibles pour SAP HANA.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: acct, text: { en: "Create a NetApp account.", fr: "Créer un compte NetApp." } }
    - { id: pool, text: { en: "Create a capacity pool with the required service level and QoS type.", fr: "Créer un pool de capacité avec le niveau de service et le type de QoS requis." } }
    - { id: vol, text: { en: "Create NFS v4.1 volumes for /hana/data, /hana/log and /hana/shared in the delegated subnet.", fr: "Créer des volumes NFS v4.1 pour /hana/data, /hana/log et /hana/shared dans le sous-réseau délégué." } }
    - { id: mount, text: { en: "Mount the volumes on the HANA VM with NFS v4.1 mount options.", fr: "Monter les volumes sur la machine virtuelle HANA avec les options de montage NFS v4.1." } }
    - { id: sa, text: { en: "Create a premium FileStorage storage account.", fr: "Créer un compte de stockage FileStorage Premium." } }
    - { id: pe, text: { en: "Create a private endpoint for the NetApp account.", fr: "Créer un point de terminaison privé pour le compte NetApp." } }
answer:
  sequence: [ acct, pool, vol, mount ]
explanation:
  correct:
    en: |
      Azure NetApp Files uses a hierarchy: a NetApp account contains capacity pools, which define the service level and QoS type, and volumes are created in a pool and attached to the delegated subnet. The HANA VM then mounts the volumes, with NFS v4.1 for /hana/data and /hana/log.
    fr: |
      Azure NetApp Files utilise une hiérarchie : un compte NetApp contient des pools de capacité, qui définissent le niveau de service et le type de QoS, et les volumes sont créés dans un pool et reliés au sous-réseau délégué. La machine virtuelle HANA monte ensuite les volumes, avec NFS v4.1 pour /hana/data et /hana/log.
  options:
    sa: { en: "A FileStorage account is for Azure Files, not Azure NetApp Files.", fr: "Un compte FileStorage sert à Azure Files, pas à Azure NetApp Files." }
    pe: { en: "Azure NetApp Files volumes are reached through the delegated subnet, not through a private endpoint.", fr: "Les volumes Azure NetApp Files sont atteints par le sous-réseau délégué, pas par un point de terminaison privé." }
references:
  - title: SAP HANA Azure virtual machine ANF configuration
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-netapp
  - title: Service levels for Azure NetApp Files
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-service-levels
