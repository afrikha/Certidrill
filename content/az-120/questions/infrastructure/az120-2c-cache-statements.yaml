id: az120-2c-cache-statements
objective: "2.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware is reviewing the disk caching configuration of its SAP virtual machines. The VMs use Premium SSD and Premium SSD v2 managed disks.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware examine la configuration de mise en cache des disques de ses machines virtuelles SAP. Les machines virtuelles utilisent des disques managés SSD Premium et SSD Premium v2.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Changing the host caching setting of a data disk detaches and reattaches the disk, so you should first stop the applications that use it.
        fr: Modifier le paramètre de mise en cache de l'hôte d'un disque de données détache puis rattache le disque ; vous devez donc d'abord arrêter les applications qui l'utilisent.
    - id: s2
      text:
        en: You can enable ReadOnly host caching on a P60 (8 TiB) Premium SSD data disk.
        fr: Vous pouvez activer la mise en cache de l'hôte ReadOnly sur un disque de données SSD Premium P60 (8 Tio).
    - id: s3
      text:
        en: You can set ReadOnly host caching on the Premium SSD v2 disks of a /hana/data volume.
        fr: Vous pouvez définir la mise en cache de l'hôte ReadOnly sur les disques SSD Premium v2 d'un volume /hana/data.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Changing the cache setting of a disk detaches and reattaches it (and restarts the VM for the OS disk), which can corrupt data if applications are still writing. Host caching isn't supported for disks of 4 TiB and larger, so an 8 TiB P60 can't use it. Premium SSD v2, like Ultra Disk and Azure NetApp Files, offers no caching options.
    fr: |
      Modifier le paramètre de cache d'un disque le détache puis le rattache (et redémarre la machine virtuelle pour le disque du système d'exploitation), ce qui peut corrompre des données si des applications écrivent encore. La mise en cache de l'hôte n'est pas prise en charge pour les disques de 4 Tio et plus : un P60 de 8 Tio ne peut pas l'utiliser. Le SSD Premium v2, comme le disque Ultra et Azure NetApp Files, ne propose aucune option de mise en cache.
references:
  - title: "Azure premium storage: Design for high performance"
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/premium-storage-performance
  - title: Considerations for Azure VMs DBMS deployment for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/dbms-guide-general
