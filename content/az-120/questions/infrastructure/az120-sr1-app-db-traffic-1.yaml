id: az120-sr1-app-db-traffic-1
objective: "2.2.6"
type: series_yesno
series: az120-sr1-app-db-traffic
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |-
    You route the application-to-database traffic through Azure Firewall.
  fr: |-
    Vous routez le trafic entre l'application et la base de données via le Pare-feu Azure.
body:
  solution:
    en: |-
      You place the application servers and the HANA VMs in separate subnets of VNet1. You associate with the application subnet a **user-defined route** that sends the traffic for the database subnet to the **Azure Firewall** instance in the hub, and you create firewall rules that allow only the HANA SQL ports from the application servers and SSH from the jump hosts.
    fr: |-
      Vous placez les serveurs d'applications et les machines virtuelles HANA dans des sous-réseaux distincts de VNet1. Vous associez au sous-réseau d'application un **itinéraire défini par l'utilisateur** qui envoie le trafic destiné au sous-réseau de base de données vers l'instance **Pare-feu Azure** du hub, et vous créez des règles de pare-feu qui autorisent uniquement les ports SQL HANA depuis les serveurs d'applications et SSH depuis les hôtes de rebond.
answer: { value: false }
explanation:
  correct:
    en: |-
      A network virtual appliance, such as a firewall, in the communication path between the SAP application layer and the DBMS layer isn't supported. It can roughly double the latency and limit throughput on this critical path. The path must be direct, filtered only by NSG and ASG rules.
    fr: |-
      Une appliance virtuelle réseau, comme un pare-feu, dans le chemin de communication entre la couche application SAP et la couche SGBD n'est pas prise en charge. Elle peut environ doubler la latence et limiter le débit sur ce chemin critique. Le chemin doit être direct, filtré uniquement par des règles de groupe de sécurité réseau et de groupe de sécurité d'application.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
