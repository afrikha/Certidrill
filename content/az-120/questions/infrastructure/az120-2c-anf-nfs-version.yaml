id: az120-2c-anf-nfs-version
objective: "2.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware plans to deploy SAP HANA on a virtual machine that runs Red Hat Enterprise Linux for SAP. The **/hana/data** and **/hana/log** volumes will be hosted on Azure NetApp Files.

    Which protocol should you use for the /hana/data and /hana/log volumes?
  fr: |
    Proseware prévoit de déployer SAP HANA sur une machine virtuelle qui exécute Red Hat Enterprise Linux for SAP. Les volumes **/hana/data** et **/hana/log** seront hébergés sur Azure NetApp Files.

    Quel protocole devez-vous utiliser pour les volumes /hana/data et /hana/log ?
body:
  options:
    - { id: a, text: "NFS v3" }
    - { id: b, text: "NFS v4.1" }
    - { id: c, text: "SMB 3" }
    - { id: d, text: { en: "NFS v3 with the nconnect mount option", fr: "NFS v3 avec l'option de montage nconnect" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      NFS v4.1 is mandatory for /hana/data and /hana/log on Azure NetApp Files. /hana/shared can functionally use NFS v3 or NFS v4.1, but NFS v4.1 is highly recommended for all HANA volumes.
    fr: |
      NFS v4.1 est obligatoire pour /hana/data et /hana/log sur Azure NetApp Files. /hana/shared peut fonctionnellement utiliser NFS v3 ou NFS v4.1, mais NFS v4.1 est fortement recommandé pour tous les volumes HANA.
  options:
    a: { en: "NFS v3 on Azure NetApp Files isn't supported for /hana/data and /hana/log.", fr: "NFS v3 sur Azure NetApp Files n'est pas pris en charge pour /hana/data et /hana/log." }
    c: { en: "SMB volumes aren't used for SAP HANA on Linux.", fr: "Les volumes SMB ne sont pas utilisés pour SAP HANA sous Linux." }
    d: { en: "nconnect raises throughput but doesn't change the protocol version, and NFS v3 remains unsupported for these volumes.", fr: "nconnect augmente le débit mais ne change pas la version du protocole, et NFS v3 reste non pris en charge pour ces volumes." }
references:
  - title: SAP HANA Azure virtual machine ANF configuration
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-netapp
