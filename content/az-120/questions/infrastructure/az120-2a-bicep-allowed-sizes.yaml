id: az120-2a-bicep-allowed-sizes
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware's SAP Basis team approved a short list of SAP-certified VM sizes for its HANA databases. Engineers deploy the database VMs from a Bicep file that has a string parameter named **vmSize**.

    You need the deployment to fail validation when an engineer passes a size that is not on the approved list.

    What should you add to the vmSize parameter?
  fr: |
    L'équipe SAP Basis de Litware a approuvé une courte liste de tailles de machines virtuelles certifiées SAP pour ses bases de données HANA. Les ingénieurs déploient les machines virtuelles de base de données à partir d'un fichier Bicep qui contient un paramètre de chaîne nommé **vmSize**.

    Vous devez faire échouer la validation du déploiement lorsqu'un ingénieur transmet une taille absente de la liste approuvée.

    Que devez-vous ajouter au paramètre vmSize ?
body:
  options:
    - { id: a, text: { en: "An `@allowed` decorator that lists the approved sizes", fr: "Un décorateur `@allowed` qui liste les tailles approuvées" } }
    - { id: b, text: { en: "A `@metadata` decorator that lists the approved sizes", fr: "Un décorateur `@metadata` qui liste les tailles approuvées" } }
    - { id: c, text: { en: "A `@description` decorator that lists the approved sizes", fr: "Un décorateur `@description` qui liste les tailles approuvées" } }
    - { id: d, text: { en: "A `@minLength` decorator set to the length of the shortest size", fr: "Un décorateur `@minLength` défini sur la longueur de la taille la plus courte" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The @allowed decorator restricts a parameter to the values of an array; a deployment with any other value fails validation.
    fr: |
      Le décorateur @allowed limite un paramètre aux valeurs d'un tableau ; un déploiement avec une autre valeur échoue à la validation.
  options:
    b:
      en: |
        @metadata adds custom properties for documentation; it does not restrict the value.
      fr: |
        @metadata ajoute des propriétés personnalisées de documentation ; il ne restreint pas la valeur.
    c:
      en: |
        @description only explains the parameter, for example as a tip in the Azure portal.
      fr: |
        @description explique seulement le paramètre, par exemple sous forme d'info-bulle dans le portail Azure.
    d:
      en: |
        @minLength checks only the number of characters, so unapproved sizes with a long enough name still pass.
      fr: |
        @minLength ne vérifie que le nombre de caractères : des tailles non approuvées au nom assez long passent quand même.
references:
  - title: Parameters in Bicep files - Azure Resource Manager
    url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/parameters
