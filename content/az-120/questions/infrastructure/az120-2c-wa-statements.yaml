id: az120-2c-wa-statements
objective: "2.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs SAP HANA on M-series virtual machines. The **/hana/log** volumes use Premium SSD disks with Write Accelerator enabled.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute SAP HANA sur des machines virtuelles de la série M. Les volumes **/hana/log** utilisent des disques SSD Premium avec l'Accélérateur d'écriture activé.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The Write Accelerator IOPS limit of a VM size is shared by all the Write Accelerator disks attached to the VM.
        fr: La limite d'IOPS de l'Accélérateur d'écriture d'une taille de machine virtuelle est partagée par tous les disques avec Accélérateur d'écriture attachés à la machine virtuelle.
    - id: s2
      text:
        en: You should also enable Write Accelerator on the /hana/data disks to speed up savepoints.
        fr: Vous devez aussi activer l'Accélérateur d'écriture sur les disques /hana/data pour accélérer les points de sauvegarde (savepoints).
    - id: s3
      text:
        en: Only I/O requests of 64 KiB or smaller take the accelerated path.
        fr: Seules les requêtes d'E/S de 64 Kio ou moins empruntent le chemin accéléré.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Write Accelerator limits apply per VM: all Write Accelerator disks share the same IOPS limit (for example, 10,000 IOPS on Standard_M64s). Write Accelerator is meant for the transaction log or redo log volumes only, not for DBMS data volumes. Only small I/Os, 64 KiB or less, take the accelerated path.
    fr: |
      Les limites de l'Accélérateur d'écriture s'appliquent par machine virtuelle : tous les disques avec Accélérateur d'écriture partagent la même limite d'IOPS (par exemple 10 000 IOPS sur Standard_M64s). L'Accélérateur d'écriture est destiné uniquement aux volumes de journal des transactions ou de journalisation (redo), pas aux volumes de données des SGBD. Seules les petites E/S, de 64 Kio ou moins, empruntent le chemin accéléré.
references:
  - title: Azure Write Accelerator
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/how-to-enable-write-accelerator
