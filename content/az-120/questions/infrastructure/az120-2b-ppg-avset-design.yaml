id: az120-2b-ppg-avset-design
objective: "2.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso deploys SAP systems in an Azure region that has no availability zones. Each SAP system uses three availability sets: one for the DBMS VMs, one for the ASCS/SCS VMs and one for the application server VMs. The production system **PRD** needs all its VMs colocated under the same network spine.

    You need to complete the design according to Microsoft guidance.

    How should you complete the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso déploie des systèmes SAP dans une région Azure sans zones de disponibilité. Chaque système SAP utilise trois groupes à haute disponibilité : un pour les machines virtuelles SGBD, un pour les machines virtuelles ASCS/SCS et un pour les machines virtuelles de serveur d'applications. Toutes les machines virtuelles du système de production **PRD** doivent être colocalisées sous la même colonne vertébrale réseau.

    Vous devez compléter la conception conformément aux recommandations de Microsoft.

    Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Proximity placement groups for PRD: [[count]]

      The group is scoped (pinned) when you deploy: [[anchor]]
    fr: |
      Groupes de placement de proximité pour PRD : [[count]]

      Le groupe est ancré au déploiement de : [[anchor]]
  slots:
    - id: count
      options:
        - { id: one, text: { en: "One group, assigned to the three availability sets", fr: "Un groupe, affecté aux trois groupes à haute disponibilité" } }
        - { id: three, text: { en: "Three groups, one for each availability set", fr: "Trois groupes, un par groupe à haute disponibilité" } }
        - { id: land, text: { en: "One group shared by PRD and the non-production systems", fr: "Un groupe partagé par PRD et les systèmes hors production" } }
    - id: anchor
      options:
        - { id: db, text: { en: "The first VM of the DBMS availability set", fr: "La première machine virtuelle du groupe à haute disponibilité SGBD" } }
        - { id: ascs, text: { en: "The first VM of the ASCS/SCS availability set", fr: "La première machine virtuelle du groupe à haute disponibilité ASCS/SCS" } }
        - { id: app, text: { en: "The first VM of the application server availability set", fr: "La première machine virtuelle du groupe à haute disponibilité des serveurs d'applications" } }
answer:
  values: { count: one, anchor: db }
explanation:
  correct:
    en: "For availability set deployments, Microsoft recommends one proximity placement group per SAP system, assigned to all three availability sets. The group is scoped when the first database-tier VM is deployed into the DBMS availability set, so the rest of the system follows the datacenter that hosts the largest, least flexible VM type."
    fr: "Pour les déploiements avec groupes à haute disponibilité, Microsoft recommande un groupe de placement de proximité par système SAP, affecté aux trois groupes à haute disponibilité. Le groupe est ancré lors du déploiement de la première machine virtuelle de la couche Base de données dans le groupe à haute disponibilité SGBD : le reste du système suit le centre de données qui héberge le type de machine virtuelle le plus grand et le moins flexible."
  options:
    three: { en: "Separate groups could be pinned to different spines and wouldn't colocate the tiers.", fr: "Des groupes distincts pourraient être ancrés à des colonnes vertébrales réseau différentes et ne colocaliseraient pas les couches." }
    land: { en: "A PPG should contain a single SAP system; bundling systems raises the risk that a VM type is unavailable under the spine.", fr: "Un PPG ne doit contenir qu'un seul système SAP ; regrouper des systèmes augmente le risque qu'un type de machine virtuelle soit indisponible sous la colonne vertébrale réseau." }
    ascs: { en: "Anchoring with the ASCS/SCS VM applies to the zonal model, where DBMS VMs are outside the PPG.", fr: "L'ancrage par la machine virtuelle ASCS/SCS s'applique au modèle zonal, où les machines virtuelles SGBD sont hors du PPG." }
references:
  - title: Configuration options to minimize network latency with SAP applications
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/proximity-placement-scenarios
