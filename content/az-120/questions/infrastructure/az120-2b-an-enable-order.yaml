id: az120-2b-an-enable-order
objective: "2.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An SAP application server VM named **sapapp01** runs SUSE Linux Enterprise Server and has one network interface named **nic-sapapp01**. Accelerated Networking is disabled on the NIC. The VM size supports Accelerated Networking, and the guest image includes the required drivers.

    You need to enable Accelerated Networking on sapapp01 by using the Azure CLI and confirm that traffic uses the accelerated path.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une machine virtuelle de serveur d'applications SAP nommée **sapapp01** exécute SUSE Linux Enterprise Server et possède une interface réseau nommée **nic-sapapp01**. Accelerated Networking est désactivé sur cette carte réseau. La taille de la machine virtuelle prend en charge Accelerated Networking et l'image de l'invité contient les pilotes nécessaires.

    Vous devez activer Accelerated Networking sur sapapp01 à l'aide d'Azure CLI et vérifier que le trafic emprunte le chemin accéléré.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: dealloc, text: { en: "Run `az vm deallocate` for sapapp01.", fr: "Exécuter `az vm deallocate` pour sapapp01." } }
    - { id: update, text: { en: "Run `az network nic update` with `--accelerated-networking true` for nic-sapapp01.", fr: "Exécuter `az network nic update` avec `--accelerated-networking true` pour nic-sapapp01." } }
    - { id: start, text: { en: "Run `az vm start` for sapapp01.", fr: "Exécuter `az vm start` pour sapapp01." } }
    - { id: check, text: { en: "In the guest OS, run `ethtool -S eth0 | grep vf_` and check that the VF packet counters increase.", fr: "Dans le système d'exploitation invité, exécuter `ethtool -S eth0 | grep vf_` et vérifier que les compteurs de paquets VF augmentent." } }
    - { id: redeploy, text: { en: "Run `az vm redeploy` for sapapp01.", fr: "Exécuter `az vm redeploy` pour sapapp01." } }
    - { id: newnic, text: { en: "Detach nic-sapapp01 and attach a new NIC created with Accelerated Networking.", fr: "Détacher nic-sapapp01 et attacher une nouvelle carte réseau créée avec Accelerated Networking." } }
answer:
  sequence: [ dealloc, update, start, check ]
explanation:
  correct:
    en: "Accelerated Networking can't be enabled on a running VM; the VM must be stopped and deallocated, then you set the property on the existing NIC and start the VM again. In the guest, the `vf_` counters reported by `ethtool -S` show the traffic that flows over the virtual function (VF) interface."
    fr: "Accelerated Networking ne peut pas être activé sur une machine virtuelle en cours d'exécution ; il faut l'arrêter et la libérer, définir la propriété sur la carte réseau existante, puis redémarrer la machine virtuelle. Dans l'invité, les compteurs `vf_` renvoyés par `ethtool -S` montrent le trafic qui passe par l'interface de fonction virtuelle (VF)."
  options:
    redeploy: { en: "Redeploying moves the VM to another host but doesn't change the NIC setting.", fr: "Le redéploiement déplace la machine virtuelle vers un autre hôte, mais ne modifie pas le paramètre de la carte réseau." }
    newnic: { en: "Replacing the NIC is unnecessary: the existing NIC can be updated while the VM is deallocated, and a new NIC would change the primary IP configuration.", fr: "Remplacer la carte réseau est inutile : la carte existante peut être modifiée pendant que la machine virtuelle est libérée, et une nouvelle carte changerait la configuration IP principale." }
references:
  - title: Azure Accelerated Networking Overview and Benefits
    url: https://learn.microsoft.com/en-us/azure/virtual-network/accelerated-networking-overview
  - title: How Accelerated Networking works in Linux and FreeBSD VMs
    url: https://learn.microsoft.com/en-us/azure/virtual-network/accelerated-networking-how-it-works
