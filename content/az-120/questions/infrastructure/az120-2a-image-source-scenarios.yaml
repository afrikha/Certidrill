id: az120-2a-image-source-scenarios
objective: "2.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware plans three SAP deployments on Azure:

    - Move an on-premises SAP system to Azure and keep its host name, SAP SID and SAP user accounts.
    - Deploy 20 identical SAP application servers that include the company's hardening settings and agents.
    - Deploy a sandbox that runs SUSE Linux Enterprise Server for SAP Applications as published by SUSE.

    Which OS source should you use for each deployment? To answer, drag the appropriate sources to the correct deployments. Each source may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit trois déploiements SAP sur Azure :

    - Migrer un système SAP local vers Azure en conservant son nom d'hôte, son SID SAP et ses comptes utilisateur SAP.
    - Déployer 20 serveurs d'applications SAP identiques qui incluent les paramètres de durcissement et les agents de l'entreprise.
    - Déployer un bac à sable qui exécute SUSE Linux Enterprise Server for SAP Applications tel que publié par SUSE.

    Quelle source de système d'exploitation devez-vous utiliser pour chaque déploiement ? Pour répondre, faites glisser les sources appropriées vers les déploiements correspondants. Chaque source peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mkt, text: { en: "Azure Marketplace image", fr: "Image de la Place de marché Azure" } }
    - { id: gen, text: { en: "Generalized image version in an Azure Compute Gallery", fr: "Version d'image généralisée dans une galerie Azure Compute Gallery" } }
    - { id: vhd, text: { en: "Non-generalized OS disk uploaded from on-premises", fr: "Disque de système d'exploitation non généralisé chargé depuis l'environnement local" } }
    - { id: datasnap, text: { en: "Snapshot of a data disk of the on-premises system", fr: "Instantané d'un disque de données du système local" } }
  targets:
    - id: move
      text: { en: "Keep host name, SID and SAP users", fr: "Conserver le nom d'hôte, le SID et les utilisateurs SAP" }
    - id: fleet
      text: { en: "20 identical hardened application servers", fr: "20 serveurs d'applications durcis identiques" }
    - id: sandbox
      text: { en: "Sandbox with the SUSE-published OS", fr: "Bac à sable avec le système d'exploitation publié par SUSE" }
answer:
  mapping: { move: vhd, fleet: gen, sandbox: mkt }
explanation:
  correct:
    en: |
      To move a specific SAP system and keep its host name, SID and accounts, you upload its OS disk without generalizing it (the VM Agent must then be installed manually). Many identical customized VMs come from a generalized image, best stored as a gallery image version. An unmodified vendor OS comes from the Azure Marketplace, where the VM Agent is preinstalled.
    fr: |
      Pour migrer un système SAP précis en conservant son nom d'hôte, son SID et ses comptes, vous chargez son disque de système d'exploitation sans le généraliser (l'agent de machine virtuelle doit alors être installé manuellement). De nombreuses machines virtuelles personnalisées identiques proviennent d'une image généralisée, idéalement stockée comme version d'image d'une galerie. Un système d'exploitation de l'éditeur non modifié provient de la Place de marché Azure, où l'agent de machine virtuelle est préinstallé.
  options:
    datasnap:
      en: |
        A data disk snapshot does not contain the operating system, so it cannot be the OS source of a VM.
      fr: |
        Un instantané de disque de données ne contient pas le système d'exploitation : il ne peut pas servir de source de système d'exploitation à une machine virtuelle.
references:
  - title: Azure Virtual Machines deployment for SAP NetWeaver
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/deployment-guide
  - title: Share VM images in a compute gallery - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries
