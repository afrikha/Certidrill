id: az120-2b-sec-fiori-publish
objective: "2.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin must give its business partners access to SAP Fiori apps from the internet. The SAP S/4HANA system runs in an Azure spoke virtual network, behind two SAP Web Dispatcher VMs. The design must protect the HTTPS traffic at layer 7 and must not replace the SAP Web Dispatcher.

    How should you complete the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin doit donner à ses partenaires commerciaux l'accès aux applications SAP Fiori depuis Internet. Le système SAP S/4HANA s'exécute dans un réseau virtuel spoke Azure, derrière deux machines virtuelles SAP Web Dispatcher. La conception doit protéger le trafic HTTPS au niveau de la couche 7 et ne doit pas remplacer SAP Web Dispatcher.

    Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Internet entry point: [[entry]]

      Backend pool of the entry point: [[backend]]
    fr: |
      Point d'entrée Internet : [[entry]]

      Pool principal du point d'entrée : [[backend]]
  slots:
    - id: entry
      options:
        - { id: agw, text: { en: "Application Gateway with Web Application Firewall and a public IP address", fr: "Application Gateway avec pare-feu d'applications web et une adresse IP publique" } }
        - { id: plb, text: { en: "Public Standard Load Balancer with a load-balancing rule for port 443", fr: "Équilibreur de charge public Standard avec une règle d'équilibrage pour le port 443" } }
        - { id: nat, text: { en: "NAT gateway associated with the Web Dispatcher subnet", fr: "Passerelle NAT associée au sous-réseau des Web Dispatcher" } }
    - id: backend
      options:
        - { id: wd, text: { en: "The two SAP Web Dispatcher VMs", fr: "Les deux machines virtuelles SAP Web Dispatcher" } }
        - { id: app, text: { en: "The SAP application server VMs", fr: "Les machines virtuelles de serveur d'applications SAP" } }
        - { id: ascs, text: { en: "The virtual IP address of the ASCS internal load balancer", fr: "L'adresse IP virtuelle de l'équilibreur de charge interne ASCS" } }
answer:
  values: { entry: agw, backend: wd }
explanation:
  correct:
    en: "For internet-facing deployments, Microsoft recommends Application Gateway with Web Application Firewall rather than a load balancer with a public IP. The gateway's backend pool is the set of SAP Web Dispatcher VMs, accessed round-robin; the application gateway is a reverse proxy and doesn't replace the Web Dispatcher."
    fr: "Pour les déploiements exposés à Internet, Microsoft recommande Application Gateway avec pare-feu d'applications web plutôt qu'un équilibreur de charge doté d'une adresse IP publique. Le pool principal de la passerelle est constitué des machines virtuelles SAP Web Dispatcher, accédées à tour de rôle ; la passerelle d'application est un proxy inverse et ne remplace pas Web Dispatcher."
  options:
    plb: { en: "A layer 4 load balancer doesn't inspect HTTPS requests.", fr: "Un équilibreur de charge de couche 4 n'inspecte pas les requêtes HTTPS." }
    nat: { en: "A NAT gateway provides outbound connectivity only.", fr: "Une passerelle NAT ne fournit que la connectivité sortante." }
    app: { en: "Sending traffic directly to the application servers would bypass the Web Dispatcher.", fr: "Envoyer le trafic directement aux serveurs d'applications contournerait Web Dispatcher." }
    ascs: { en: "The ASCS virtual IP serves the enqueue and message server, not Fiori HTTP traffic.", fr: "L'adresse IP virtuelle ASCS sert le serveur d'enqueue et le serveur de messages, pas le trafic HTTP de Fiori." }
references:
  - title: Inbound and outbound internet connections for SAP on Azure
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/sap/sap-internet-inbound-outbound
  - title: What is Azure Web Application Firewall on Azure Application Gateway?
    url: https://learn.microsoft.com/en-us/azure/web-application-firewall/ag/ag-overview
