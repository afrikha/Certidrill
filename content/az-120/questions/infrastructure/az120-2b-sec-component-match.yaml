id: az120-2b-sec-component-match
objective: "2.2.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip is securing an SAP S/4HANA landscape deployed in a hub-spoke topology. The landscape has the following requirements.

    Which component should you use for each requirement? To answer, drag the appropriate components to the correct requirements. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip sécurise un paysage SAP S/4HANA déployé dans une topologie hub-and-spoke. Le paysage présente les exigences suivantes.

    Quel composant devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les composants appropriés vers les exigences correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: waf, text: { en: "Application Gateway with Web Application Firewall", fr: "Application Gateway avec pare-feu d'applications web (WAF)" } }
    - { id: fw, text: { en: "Azure Firewall", fr: "Pare-feu Azure" } }
    - { id: nsg, text: { en: "NSG rules with application security groups", fr: "Règles NSG avec groupes de sécurité d'application" } }
    - { id: nat, text: { en: "NAT gateway", fr: "Passerelle NAT" } }
    - { id: bastion, text: Azure Bastion }
  targets:
    - id: t1
      text: { en: "Publish SAP Fiori over HTTPS to internet users, with layer 7 protection in front of the SAP Web Dispatcher VMs", fr: "Publier SAP Fiori en HTTPS pour les utilisateurs d'Internet, avec une protection de couche 7 devant les machines virtuelles SAP Web Dispatcher" }
    - id: t2
      text: { en: "Provide SAProuter with inbound and outbound internet connections limited to authorized IP addresses", fr: "Fournir à SAProuter des connexions Internet entrantes et sortantes limitées aux adresses IP autorisées" }
    - id: t3
      text: { en: "Restrict the traffic between the application subnet and the database subnet without adding a hop in the path", fr: "Restreindre le trafic entre le sous-réseau des applications et le sous-réseau de base de données sans ajouter de saut sur le chemin" }
answer:
  mapping: { t1: waf, t2: fw, t3: nsg }
explanation:
  correct:
    en: "For internet-facing SAP web applications, Microsoft recommends Application Gateway with WAF, with the Web Dispatcher VMs as backend pool. SAProuter needs both inbound and outbound connections, so its path goes through the firewall, whose rules limit communication to authorized IPs. Between the application and DBMS layers only NSG and ASG rules are allowed, because they keep a direct path."
    fr: "Pour les applications web SAP exposées sur Internet, Microsoft recommande Application Gateway avec WAF, avec les machines virtuelles Web Dispatcher comme pool principal. SAProuter a besoin de connexions entrantes et sortantes : son chemin passe par le pare-feu, dont les règles limitent la communication aux adresses IP autorisées. Entre les couches Application et SGBD, seules les règles NSG et ASG sont admises, car elles conservent un chemin direct."
  options:
    nat: { en: "A NAT gateway provides outbound connectivity only, so it can't serve SAProuter's inbound connections.", fr: "Une passerelle NAT ne fournit que la connectivité sortante : elle ne peut pas servir les connexions entrantes de SAProuter." }
    bastion: { en: "Azure Bastion provides administrative RDP/SSH access, not application traffic protection.", fr: "Azure Bastion fournit un accès d'administration RDP/SSH, pas la protection du trafic applicatif." }
references:
  - title: Inbound and outbound internet connections for SAP on Azure
    url: https://learn.microsoft.com/en-us/azure/architecture/guide/sap/sap-internet-inbound-outbound
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
