id: az120-2a-ext-identity-reader
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware deploys SAP VMs by using Bicep. The Bicep file enables a system-assigned managed identity on each VM and deploys the new version of the Azure VM extension for SAP solutions as an extension resource with an empty `cfg` setting.

    After deployment, the extension cannot read the configuration of the VM disks and network interfaces. You need to fix the issue by following the principle of least privilege.

    What should you do?
  fr: |
    Proseware déploie ses machines virtuelles SAP avec Bicep. Le fichier Bicep active une identité managée affectée par le système sur chaque machine virtuelle et déploie la nouvelle version de l'extension de machine virtuelle Azure pour les solutions SAP en tant que ressource d'extension avec un paramètre `cfg` vide.

    Après le déploiement, l'extension ne peut pas lire la configuration des disques et des interfaces réseau de la machine virtuelle. Vous devez corriger le problème en respectant le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Contributor role to the VM identity on the resource group of the VM", fr: "Attribuer le rôle Contributor à l'identité de la machine virtuelle sur le groupe de ressources de la machine virtuelle" } }
    - { id: b, text: { en: "Assign the Owner role to your deployment account on the subscription", fr: "Attribuer le rôle Owner à votre compte de déploiement sur l'abonnement" } }
    - { id: c, text: { en: "Assign the Reader role to the VM identity on the resource group of the VM", fr: "Attribuer le rôle Reader à l'identité de la machine virtuelle sur le groupe de ressources de la machine virtuelle" } }
    - { id: d, text: { en: "Enable storage analytics on a storage account and redeploy the extension", fr: "Activer l'analytique de stockage sur un compte de stockage et redéployer l'extension" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The new extension reads monitoring and configuration data with the managed identity of the VM. For a manual deployment (ARM, Bicep, Terraform), you grant that identity read access, ideally with the built-in Reader role, on the resource group or on the individual resources (NICs, OS disk, data disks).
    fr: |
      La nouvelle extension lit les données de supervision et de configuration avec l'identité managée de la machine virtuelle. Pour un déploiement manuel (ARM, Bicep, Terraform), vous accordez à cette identité un accès en lecture, idéalement avec le rôle intégré Reader, sur le groupe de ressources ou sur les ressources individuelles (cartes réseau, disque du système d'exploitation, disques de données).
  options:
    a:
      en: |
        Contributor also grants write permissions that the extension does not need, so it is not least privilege.
      fr: |
        Contributor accorde aussi des autorisations d'écriture dont l'extension n'a pas besoin : ce n'est pas le moindre privilège.
    b:
      en: |
        Owner rights are needed by the person who runs the automated Set-AzVMAEMExtension installation, which then assigns access itself; the Bicep deployment still leaves the VM identity without any role.
      fr: |
        Les droits Owner sont nécessaires à la personne qui exécute l'installation automatisée avec Set-AzVMAEMExtension, qui attribue alors l'accès elle-même ; le déploiement Bicep laisse toujours l'identité de la machine virtuelle sans aucun rôle.
    d:
      en: |
        Storage analytics is configured by the standard version for storage counters; it does not give the new version's identity access to the resources.
      fr: |
        L'analytique de stockage est configurée par la version standard pour les compteurs de stockage ; elle ne donne pas à l'identité de la nouvelle version l'accès aux ressources.
references:
  - title: New version of Azure VM extension for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap-new
