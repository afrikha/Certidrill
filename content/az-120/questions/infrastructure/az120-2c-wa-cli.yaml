id: az120-2c-wa-cli
objective: "2.3.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs SAP HANA on a Standard_M128s virtual machine named **hdb01** in a resource group named **rg-sap-prd**. The **/hana/log** volume is striped over two Premium SSD data disks that are already attached at LUN 1 and LUN 2, with host caching set to None. hdb01 is shut down.

    You need to enable Write Accelerator on both log disks by using the Azure CLI.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute SAP HANA sur une machine virtuelle Standard_M128s nommée **hdb01** dans un groupe de ressources nommé **rg-sap-prd**. Le volume **/hana/log** est entrelacé sur deux disques de données SSD Premium déjà attachés aux LUN 1 et 2, avec la mise en cache de l'hôte réglée sur None. hdb01 est arrêtée.

    Vous devez activer l'Accélérateur d'écriture sur les deux disques du journal avec Azure CLI.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az vm [[cmd]] --resource-group rg-sap-prd --name hdb01 \
      [[param]] 1=true 2=true
  slots:
    - id: cmd
      options:
        - { id: update, text: update }
        - { id: attach, text: disk attach }
        - { id: resize, text: resize }
        - { id: redeploy, text: redeploy }
    - id: param
      options:
        - { id: wa, text: --write-accelerator }
        - { id: enablewa, text: --enable-write-accelerator }
        - { id: ultra, text: --ultra-ssd-enabled }
        - { id: caching, text: --disk-caching }
answer:
  values: { cmd: update, param: wa }
explanation:
  correct:
    en: |
      For disks that are already attached, you run `az vm update` with `--write-accelerator`, giving the LUN of each disk and the value `true`. The `--enable-write-accelerator` switch belongs to `az vm disk attach` and applies when you attach an existing disk.
    fr: |
      Pour des disques déjà attachés, vous exécutez `az vm update` avec `--write-accelerator`, en indiquant le LUN de chaque disque et la valeur `true`. Le commutateur `--enable-write-accelerator` appartient à `az vm disk attach` et s'utilise lorsque vous attachez un disque existant.
  options:
    attach: { en: "az vm disk attach attaches a disk; the log disks are already attached.", fr: "az vm disk attach attache un disque ; les disques du journal sont déjà attachés." }
    resize: { en: "az vm resize changes the VM size, not disk settings.", fr: "az vm resize modifie la taille de la machine virtuelle, pas les paramètres des disques." }
    caching: { en: "--disk-caching sets the host caching mode of the disks; it doesn't enable Write Accelerator.", fr: "--disk-caching définit le mode de mise en cache de l'hôte des disques ; il n'active pas l'Accélérateur d'écriture." }
    ultra: { en: "--ultra-ssd-enabled enables Ultra Disk compatibility on the VM; it isn't Write Accelerator.", fr: "--ultra-ssd-enabled active la compatibilité avec les disques Ultra sur la machine virtuelle ; ce n'est pas l'Accélérateur d'écriture." }
references:
  - title: Azure Write Accelerator
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/how-to-enable-write-accelerator
