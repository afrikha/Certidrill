id: az120-2c-avg-facts
objective: "2.3.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans to use Azure NetApp Files application volume group for SAP HANA to deploy the volumes of a new single-host SAP HANA system in availability zone 2.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit d'utiliser le groupe de volumes d'application Azure NetApp Files pour SAP HANA afin de déployer les volumes d'un nouveau système SAP HANA à hôte unique dans la zone de disponibilité 2.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The data, log and shared volumes are created in a single atomic call: either all volumes are created or none.", fr: "Les volumes de données, de journal et partagé sont créés en un seul appel atomique : tous les volumes sont créés, ou aucun." } }
    - { id: b, text: { en: "The data and log volumes are placed behind the same storage endpoint to minimize latency.", fr: "Les volumes de données et de journal sont placés derrière le même point de terminaison de stockage pour réduire la latence." } }
    - { id: c, text: { en: "The volumes must be created in a capacity pool that uses manual QoS.", fr: "Les volumes doivent être créés dans un pool de capacité qui utilise la QoS manuelle." } }
    - { id: d, text: { en: "The group also creates the /usr/sap/trans and /sapmnt volumes of the SAP system.", fr: "Le groupe crée aussi les volumes /usr/sap/trans et /sapmnt du système SAP." } }
    - { id: e, text: { en: "The group can be used only for single-host HANA systems.", fr: "Le groupe ne peut être utilisé que pour des systèmes HANA à hôte unique." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Application volume group for SAP HANA creates the data, log and shared volumes (and optional log-backup and data-backup volumes) in one atomic call, in a manual QoS capacity pool, and can place them in the same availability zone as the VMs.
    fr: |
      Le groupe de volumes d'application pour SAP HANA crée les volumes de données, de journal et partagé (et, en option, les volumes de sauvegarde des journaux et des données) en un seul appel atomique, dans un pool de capacité à QoS manuelle, et peut les placer dans la même zone de disponibilité que les machines virtuelles.
  options:
    b: { en: "The group creates separate storage endpoints, with different IP addresses, for data and log volumes to improve performance.", fr: "Le groupe crée des points de terminaison de stockage distincts, avec des adresses IP différentes, pour les volumes de données et de journal afin d'améliorer les performances." }
    d: { en: "The group creates HANA volumes only: data, log, shared, and optionally log-backup and data-backup.", fr: "Le groupe crée uniquement des volumes HANA : données, journal, partagé et, en option, sauvegarde des journaux et des données." }
    e: { en: "The group supports single-host and multiple-host HANA systems, HSR secondaries and cross-region replication DR volumes.", fr: "Le groupe prend en charge les systèmes HANA à hôte unique et à plusieurs hôtes, les systèmes secondaires HSR et les volumes de reprise d'activité par réplication interrégion." }
references:
  - title: Understand Azure NetApp Files application volume group for SAP HANA
    url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/application-volume-group-introduction
