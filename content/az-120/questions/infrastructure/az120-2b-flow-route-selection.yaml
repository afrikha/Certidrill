id: az120-2b-flow-route-selection
objective: "2.2.5"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    The subnet **snet-sap-app** (10.10.1.0/24) of the virtual network **vnet-sap** (10.10.0.0/16) contains SAP application servers. The SAP HANA VMs are in 10.10.2.0/24. The following table lists the routes that apply to snet-sap-app, including the routes learned from the ExpressRoute gateway in the peered hub (10.0.0.0/16) and the user-defined routes of the associated route table.

    Answer each prompt by selecting the route that Azure uses for the traffic.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le sous-réseau **snet-sap-app** (10.10.1.0/24) du réseau virtuel **vnet-sap** (10.10.0.0/16) contient des serveurs d'applications SAP. Les machines virtuelles SAP HANA sont dans 10.10.2.0/24. Le tableau suivant liste les itinéraires qui s'appliquent à snet-sap-app, y compris ceux appris de la passerelle ExpressRoute du hub relié par peering (10.0.0.0/16) et les itinéraires définis par l'utilisateur de la table de routage associée.

    Répondez à chaque consigne en sélectionnant l'itinéraire utilisé par Azure pour le trafic.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Traffic from an application server to the HANA VM 10.10.2.10", fr: "Trafic d'un serveur d'applications vers la machine virtuelle HANA 10.10.2.10" }
    - id: p2
      text: { en: "Traffic from an application server to the on-premises print server 192.168.5.20", fr: "Trafic d'un serveur d'applications vers le serveur d'impression local 192.168.5.20" }
    - id: p3
      text: { en: "Traffic from an application server to the on-premises file server 192.168.9.20", fr: "Trafic d'un serveur d'applications vers le serveur de fichiers local 192.168.9.20" }
  grid:
    header: [{ en: "Source", fr: "Source" }, { en: "Address prefix", fr: "Préfixe d'adresse" }, { en: "Next hop type", fr: "Type de tronçon suivant" }, { en: "Next hop IP", fr: "IP du tronçon suivant" }]
    rows:
      - [{ text: Default }, { text: 10.10.0.0/16, area: r1 }, { text: Virtual network }, { text: "-" }]
      - [{ text: Default }, { text: 10.0.0.0/16, area: r2 }, { text: VNet peering }, { text: "-" }]
      - [{ text: Virtual network gateway }, { text: 192.168.0.0/16, area: r3 }, { text: Virtual network gateway }, { text: "-" }]
      - [{ text: Virtual network gateway }, { text: 192.168.5.0/24, area: r4 }, { text: Virtual network gateway }, { text: "-" }]
      - [{ text: User }, { text: 192.168.0.0/16, area: r5 }, { text: Virtual appliance }, { text: 10.0.1.4 }]
      - [{ text: User }, { text: 0.0.0.0/0, area: r6 }, { text: Virtual appliance }, { text: 10.0.1.4 }]
answer:
  values: { p1: r1, p2: r4, p3: r5 }
explanation:
  correct:
    en: "Azure first applies the longest prefix match. Traffic to 10.10.2.10 matches the virtual network route 10.10.0.0/16, which is more specific than 0.0.0.0/0, so it stays direct (as SAP requires between the application and database layers). 192.168.5.20 matches the BGP route 192.168.5.0/24, longer than any /16. 192.168.9.20 matches two /16 routes; with an identical prefix, a user-defined route wins over a BGP route, so the traffic goes to the NVA."
    fr: "Azure applique d'abord la correspondance du préfixe le plus long. Le trafic vers 10.10.2.10 correspond à l'itinéraire du réseau virtuel 10.10.0.0/16, plus spécifique que 0.0.0.0/0 : il reste direct (comme SAP l'exige entre les couches Application et Base de données). 192.168.5.20 correspond à l'itinéraire BGP 192.168.5.0/24, plus long que tous les /16. 192.168.9.20 correspond à deux itinéraires /16 ; à préfixe identique, un itinéraire défini par l'utilisateur l'emporte sur un itinéraire BGP, et le trafic part vers la NVA."
references:
  - title: Azure virtual network traffic routing
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview
