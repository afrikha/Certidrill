id: az120-2a-image-windows-gallery-order
objective: "2.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Windows Server VM named **vmsapwin01** that contains the SAP prerequisites and corporate agents for SAP application servers. An Azure Compute Gallery named **galSAP** already contains an image definition named **sap-app-win** whose OS state is Generalized.

    You need to deploy new application server VMs from an image of vmsapwin01 by using galSAP.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso dispose d'une machine virtuelle Windows Server nommée **vmsapwin01** qui contient les prérequis SAP et les agents de l'entreprise pour les serveurs d'applications SAP. Une galerie Azure Compute Gallery nommée **galSAP** contient déjà une définition d'image nommée **sap-app-win** dont l'état du système d'exploitation est Generalized.

    Vous devez déployer de nouvelles machines virtuelles de serveur d'applications à partir d'une image de vmsapwin01 en utilisant galSAP.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: sysprep, text: { en: "Run sysprep.exe /generalize /shutdown on vmsapwin01.", fr: "Exécuter sysprep.exe /generalize /shutdown sur vmsapwin01." } }
    - { id: mark, text: { en: "Run Set-AzVm with the -Generalized parameter for vmsapwin01.", fr: "Exécuter Set-AzVm avec le paramètre -Generalized pour vmsapwin01." } }
    - { id: version, text: { en: "Create an image version of sap-app-win from vmsapwin01.", fr: "Créer une version d'image de sap-app-win à partir de vmsapwin01." } }
    - { id: deploy, text: { en: "Create the new VMs from the image version.", fr: "Créer les nouvelles machines virtuelles à partir de la version d'image." } }
    - { id: restart, text: { en: "Start vmsapwin01 to check that Sysprep completed.", fr: "Démarrer vmsapwin01 pour vérifier que Sysprep s'est terminé." } }
    - { id: spec, text: { en: "Create an image definition whose OS state is Specialized.", fr: "Créer une définition d'image dont l'état du système d'exploitation est Specialized." } }
answer:
  sequence: [ sysprep, mark, version, deploy ]
explanation:
  correct:
    en: |
      Sysprep removes account and security information and shuts down the VM. You then mark the VM as generalized in Azure with Set-AzVm -Generalized, create an image version in the existing generalized image definition, and deploy VMs from that version.
    fr: |
      Sysprep supprime les informations de compte et de sécurité et arrête la machine virtuelle. Vous marquez ensuite la machine virtuelle comme généralisée dans Azure avec Set-AzVm -Generalized, créez une version d'image dans la définition d'image généralisée existante, puis déployez les machines virtuelles à partir de cette version.
  options:
    restart:
      en: |
        After Sysprep, the VM must not be restarted: a generalized VM cannot be started again.
      fr: |
        Après Sysprep, la machine virtuelle ne doit pas être redémarrée : une machine virtuelle généralisée ne peut plus être démarrée.
    spec:
      en: |
        The existing definition is already Generalized, which matches a Sysprep image; a Specialized definition is for images that keep machine-specific data.
      fr: |
        La définition existante est déjà Generalized, ce qui correspond à une image Sysprep ; une définition Specialized concerne les images qui conservent les données propres à la machine.
references:
  - title: Deprovision or generalize a VM before creating an image - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/generalize
  - title: Share VM images in a compute gallery - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries
