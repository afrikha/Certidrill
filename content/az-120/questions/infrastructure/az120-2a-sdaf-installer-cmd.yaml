id: az120-2a-sdaf-installer-cmd
objective: "2.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip uses SAP Deployment Automation Framework. The control plane and the workload zone **DEV-WEEU-SAP01** are deployed. You prepared the configuration of a new SAP system with the SID **X01** in the folder `WORKSPACES/SYSTEM/DEV-WEEU-SAP01-X01`.

    You need to deploy the VMs, disks and load balancers of X01 from the deployer.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip utilise SAP Deployment Automation Framework. Le plan de contrôle et la zone de charge de travail **DEV-WEEU-SAP01** sont déployés. Vous avez préparé la configuration d'un nouveau système SAP de SID **X01** dans le dossier `WORKSPACES/SYSTEM/DEV-WEEU-SAP01-X01`.

    Vous devez déployer les machines virtuelles, disques et équilibreurs de charge de X01 depuis la machine virtuelle de déploiement.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    cd ~/Azure_SAP_Automated_Deployment/WORKSPACES/SYSTEM/DEV-WEEU-SAP01-X01

    ${SAP_AUTOMATION_REPO_PATH}/deploy/scripts/[[script]] \
        --parameterfile [[file]] \
        --type sap_system --auto-approve
  slots:
    - id: script
      options:
        - { id: wz, text: install_workloadzone.sh }
        - { id: cp, text: deploy_controlplane.sh }
        - { id: inst, text: installer.sh }
        - { id: cfg, text: configure_deployer.sh }
    - id: file
      options:
        - { id: infra, text: DEV-WEEU-SAP01-INFRASTRUCTURE.tfvars }
        - { id: x01, text: DEV-WEEU-SAP01-X01.tfvars }
        - { id: lib, text: MGMT-WEEU-SAP_LIBRARY.tfvars }
answer:
  values: { script: inst, file: x01 }
explanation:
  correct:
    en: |
      An SAP system is deployed with installer.sh and the type sap_system, from the system folder, with the system parameter file named after the workload zone and the SID (DEV-WEEU-SAP01-X01.tfvars). The deployment also creates the SID_hosts.yaml and sap-parameters.yaml files used by Ansible.
    fr: |
      Un système SAP se déploie avec installer.sh et le type sap_system, depuis le dossier du système, avec le fichier de paramètres du système nommé d'après la zone de charge de travail et le SID (DEV-WEEU-SAP01-X01.tfvars). Le déploiement crée aussi les fichiers SID_hosts.yaml et sap-parameters.yaml utilisés par Ansible.
  options:
    wz:
      en: |
        install_workloadzone.sh deploys a workload zone, which already exists.
      fr: |
        install_workloadzone.sh déploie une zone de charge de travail, qui existe déjà.
    cp:
      en: |
        deploy_controlplane.sh deploys the deployer and the SAP library.
      fr: |
        deploy_controlplane.sh déploie la machine virtuelle de déploiement et la bibliothèque SAP.
    cfg:
      en: |
        configure_deployer.sh installs Terraform and Ansible on the deployer VM.
      fr: |
        configure_deployer.sh installe Terraform et Ansible sur la machine virtuelle de déploiement.
    infra:
      en: |
        The INFRASTRUCTURE file is the parameter file of the workload zone.
      fr: |
        Le fichier INFRASTRUCTURE est le fichier de paramètres de la zone de charge de travail.
    lib:
      en: |
        The SAP_LIBRARY file configures the SAP library of the control plane.
      fr: |
        Le fichier SAP_LIBRARY configure la bibliothèque SAP du plan de contrôle.
references:
  - title: SAP system deployment for SAP Deployment Automation Framework
    url: https://learn.microsoft.com/en-us/azure/sap/automation/deploy-system
  - title: Deploy the control plane for SAP Deployment Automation Framework
    url: https://learn.microsoft.com/en-us/azure/sap/automation/deploy-control-plane
