id: az120-2a-net-scaleout-vnic
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware is deploying an SAP BW/4HANA system on a four-node SAP HANA scale-out configuration in a virtual network named **VNet-SAP**. Following SAP recommendations, the traffic between the HANA nodes must be separated from the client and application traffic.

    What should you include in the design?
  fr: |
    Litware déploie un système SAP BW/4HANA sur une configuration SAP HANA scale-out à quatre nœuds dans un réseau virtuel nommé **VNet-SAP**. Conformément aux recommandations de SAP, le trafic entre les nœuds HANA doit être séparé du trafic des clients et des applications.

    Que devez-vous inclure dans la conception ?
body:
  options:
    - { id: a, text: { en: "A secondary network interface on each node, in a separate subnet of VNet-SAP for the inter-node traffic", fr: "Une interface réseau secondaire sur chaque nœud, dans un sous-réseau distinct de VNet-SAP pour le trafic entre nœuds" } }
    - { id: b, text: { en: "A second virtual network peered with VNet-SAP, with one network interface of each node for the inter-node traffic", fr: "Un deuxième réseau virtuel relié à VNet-SAP par peering, avec une interface réseau de chaque nœud pour le trafic entre nœuds" } }
    - { id: c, text: { en: "A secondary IP configuration on the primary network interface of each node for the inter-node traffic", fr: "Une configuration IP secondaire sur l'interface réseau principale de chaque nœud pour le trafic entre nœuds" } }
    - { id: d, text: { en: "A network virtual appliance between the subnets of the nodes that reserves bandwidth for the inter-node traffic", fr: "Une appliance virtuelle réseau entre les sous-réseaux des nœuds qui réserve de la bande passante pour le trafic entre nœuds" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      HANA scale-out requires a secondary vNIC for the internal network. Each vNIC can be placed in a different subnet of the VNet of the primary vNIC, which separates inter-node traffic from client traffic. Azure cannot enforce QoS or quotas per vNIC and all NICs share the VM bandwidth, so the separation is a security measure only.
    fr: |
      HANA scale-out exige une carte réseau virtuelle secondaire pour le réseau interne. Chaque carte réseau virtuelle peut être placée dans un sous-réseau différent du réseau virtuel de la carte principale, ce qui sépare le trafic entre nœuds du trafic des clients. Azure ne peut pas appliquer de QoS ni de quotas par carte réseau virtuelle et toutes les cartes partagent la bande passante de la machine virtuelle : la séparation est uniquement une mesure de sécurité.
  options:
    b:
      en: |
        A VM's network interfaces must all be in the virtual network of its primary interface; they cannot be placed in another, peered virtual network.
      fr: |
        Les interfaces réseau d'une machine virtuelle doivent toutes se trouver dans le réseau virtuel de son interface principale ; elles ne peuvent pas être placées dans un autre réseau virtuel relié par peering.
    c:
      en: |
        A secondary IP configuration stays in the subnet of its NIC, so it does not separate the traffic into its own subnet; secondary IPs are used for SAP virtual host names.
      fr: |
        Une configuration IP secondaire reste dans le sous-réseau de sa carte réseau : elle ne sépare pas le trafic dans un sous-réseau dédié ; les adresses IP secondaires servent aux noms d'hôte virtuels SAP.
    d:
      en: |
        NVAs can double network latency, and Azure cannot reserve bandwidth per vNIC.
      fr: |
        Les NVA peuvent doubler la latence réseau, et Azure ne peut pas réserver de bande passante par carte réseau virtuelle.
references:
