id: az120-2b-lat-measure-tool
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Before go-live, Wingtip must evaluate the TCP network latency between the SAP application server VMs and the database VMs, and compare the results with the latency categories of SAP note 1100926.

    Which tool should you use?
  fr: |
    Avant la mise en production, Wingtip doit évaluer la latence réseau TCP entre les machines virtuelles de serveur d'applications SAP et les machines virtuelles de base de données, puis comparer les résultats aux catégories de latence de la note SAP 1100926.

    Quel outil devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Azure Network Watcher IP flow verify", fr: "La vérification des flux IP d'Azure Network Watcher" }
    - id: b
      text: { en: "Azure Network Watcher next hop", fr: "Le tronçon suivant d'Azure Network Watcher" }
    - id: c
      text: { en: "The `ping` command (ICMP echo requests)", fr: "La commande `ping` (requêtes d'écho ICMP)" }
    - id: d
      text: { en: "The `niping` program", fr: "Le programme `niping`" }
answer: { optionId: d }
explanation:
  correct:
    en: "The SAP deployment checklist says to test the latency between the application and DBMS VMs according to SAP notes 500235 and 1100926 with SAP's niping (sockperf or ethr can also measure TCP latency), and to check that the result is in the moderate or good range."
    fr: "La liste de contrôle de déploiement SAP demande de tester la latence entre les machines virtuelles d'application et SGBD selon les notes SAP 500235 et 1100926 avec niping de SAP (sockperf ou ethr peuvent aussi mesurer la latence TCP), et de vérifier que le résultat se situe dans la plage modérée ou bonne."
  options:
    a:
      en: "IP flow verify tells whether an NSG rule allows or denies a flow; it doesn't measure latency."
      fr: "La vérification des flux IP indique si une règle NSG autorise ou refuse un flux ; elle ne mesure pas la latence."
    b:
      en: "Next hop shows the routing decision for a destination, not the round-trip time."
      fr: "Le tronçon suivant indique la décision de routage pour une destination, pas le temps aller-retour."
    c:
      en: "ping measures ICMP round trips, not the TCP latency that SAP note 1100926 refers to."
      fr: "ping mesure des allers-retours ICMP, pas la latence TCP visée par la note SAP 1100926."
references:
  - title: SAP workload planning and deployment checklist
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/deployment-checklist
