id: az120-2a-acss-media-roles
objective: "2.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove deployed the infrastructure of an S/4HANA system named **S4D** with Azure Center for SAP solutions. The deployment used a user-assigned managed identity named **id-acss** that has the Contributor role on the resource groups of S4D. The SAP media and the BOM file are in a storage account named **stsapmedia01** in a separate resource group.

    When you run Install SAP software, the installation fails because the service cannot read the media. You need to fix the issue by following the principle of least privilege.

    What should you do?
  fr: |
    Woodgrove a déployé l'infrastructure d'un système S/4HANA nommé **S4D** avec le Centre Azure pour les solutions SAP. Le déploiement a utilisé une identité managée affectée par l'utilisateur nommée **id-acss**, qui dispose du rôle Contributor sur les groupes de ressources de S4D. Les médias SAP et le fichier BOM se trouvent dans un compte de stockage nommé **stsapmedia01**, dans un groupe de ressources distinct.

    Lorsque vous exécutez Install SAP software, l'installation échoue, car le service ne peut pas lire les médias. Vous devez corriger le problème en respectant le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign your user account the Storage Blob Data Contributor role on stsapmedia01.", fr: "Attribuer à votre compte utilisateur le rôle Storage Blob Data Contributor sur stsapmedia01." } }
    - { id: b, text: { en: "Assign id-acss the Storage Account Contributor role on the resource group of stsapmedia01.", fr: "Attribuer à id-acss le rôle Storage Account Contributor sur le groupe de ressources de stsapmedia01." } }
    - { id: c, text: { en: "Assign id-acss the Storage Blob Data Reader and Reader and Data Access roles on stsapmedia01.", fr: "Attribuer à id-acss les rôles Storage Blob Data Reader et Reader and Data Access sur stsapmedia01." } }
    - { id: d, text: { en: "Assign id-acss the Contributor role on the subscription that contains stsapmedia01.", fr: "Attribuer à id-acss le rôle Contributor sur l'abonnement qui contient stsapmedia01." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      To install SAP software through the service, the user-assigned managed identity needs the Storage Blob Data Reader and Reader and Data Access roles on the storage account that holds the SAP media. Assigning them on the storage account itself grants only what the installation needs.
    fr: |
      Pour installer les logiciels SAP par le service, l'identité managée affectée par l'utilisateur a besoin des rôles Storage Blob Data Reader et Reader and Data Access sur le compte de stockage qui contient les médias SAP. Les attribuer sur le compte de stockage lui-même n'accorde que ce dont l'installation a besoin.
  options:
    a:
      en: |
        The service reads the media with id-acss, not with the account of the person who starts the installation.
      fr: |
        Le service lit les médias avec id-acss, pas avec le compte de la personne qui lance l'installation.
    b:
      en: |
        Storage Account Contributor manages storage accounts but includes write permissions the installation does not need, and the scope is wider than the storage account.
      fr: |
        Storage Account Contributor gère les comptes de stockage mais inclut des autorisations d'écriture inutiles à l'installation, et son étendue dépasse le compte de stockage.
    d:
      en: |
        Contributor on the whole subscription is far broader than needed for reading the media.
      fr: |
        Contributor sur tout l'abonnement est bien plus large que nécessaire pour lire les médias.
references:
  - title: Install SAP software
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/install-software
