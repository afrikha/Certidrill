id: az120-2a-ext-cmdlet-tasks
objective: "2.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You manage the Azure VM extension for SAP solutions on the SAP VMs of Contoso. You use Azure PowerShell and the Azure CLI.

    Which command should you use for each task? To answer, drag the appropriate commands to the correct tasks. Each command may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous gérez l'extension de machine virtuelle Azure pour les solutions SAP sur les machines virtuelles SAP de Contoso. Vous utilisez Azure PowerShell et Azure CLI.

    Quelle commande devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les commandes appropriées vers les tâches correspondantes. Chaque commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: setaem, text: "Set-AzVMAEMExtension -InstallNewExtension" }
    - { id: testaem, text: "Test-AzVMAEMExtension" }
    - { id: getimg, text: "Get-AzVMExtensionImage" }
    - { id: aemdel, text: "az vm aem delete" }
    - { id: getext, text: "Get-AzVMExtension" }
  targets:
    - id: install
      text: { en: "Install the new version and let the command assign the VM identity access to the VM resources", fr: "Installer la nouvelle version et laisser la commande accorder à l'identité de la machine virtuelle l'accès aux ressources de la machine virtuelle" }
    - id: health
      text: { en: "Run the health checks of the extension from your workstation", fr: "Exécuter les contrôles d'intégrité de l'extension depuis votre poste de travail" }
    - id: versions
      text: { en: "List the available versions of MonitorX64Linux to pin one of them", fr: "Lister les versions disponibles de MonitorX64Linux pour en épingler une" }
    - id: remove
      text: { en: "Remove the standard version before you switch to the new version", fr: "Supprimer la version standard avant de passer à la nouvelle version" }
answer:
  mapping: { install: setaem, health: testaem, versions: getimg, remove: aemdel }
explanation:
  correct:
    en: |
      Set-AzVMAEMExtension with -InstallNewExtension installs the new version and handles the role assignment when you have Owner rights. Test-AzVMAEMExtension runs the health checks, which should all return OK. Get-AzVMExtensionImage with the publisher Microsoft.AzureCAT.AzureEnhancedMonitoring lists the versions of MonitorX64Linux or MonitorX64Windows. az vm aem delete removes the extension, which you must do before switching versions.
    fr: |
      Set-AzVMAEMExtension avec -InstallNewExtension installe la nouvelle version et gère l'attribution de rôle si vous disposez des droits Owner. Test-AzVMAEMExtension exécute les contrôles d'intégrité, qui doivent tous renvoyer OK. Get-AzVMExtensionImage avec l'éditeur Microsoft.AzureCAT.AzureEnhancedMonitoring liste les versions de MonitorX64Linux ou MonitorX64Windows. az vm aem delete supprime l'extension, ce qu'il faut faire avant de changer de version.
  options:
    getext:
      en: |
        Get-AzVMExtension shows the extensions already installed on a VM; it neither runs the SAP health checks nor lists the versions published in a region.
      fr: |
        Get-AzVMExtension affiche les extensions déjà installées sur une machine virtuelle ; il n'exécute pas les contrôles d'intégrité SAP et ne liste pas les versions publiées dans une région.
references:
  - title: New version of Azure VM extension for SAP solutions
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap-new
  - title: az vm aem
    url: https://learn.microsoft.com/en-us/cli/azure/vm/aem
