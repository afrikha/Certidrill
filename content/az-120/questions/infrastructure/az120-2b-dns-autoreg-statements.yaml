id: az120-2b-dns-autoreg-statements
objective: "2.2.8"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum creates the Azure private DNS zone **sap.adatum.internal**. The virtual network **vnet-sap-prd** is linked to the zone with autoregistration enabled, and the virtual network **vnet-sap-qas** is linked to the zone without autoregistration. Both virtual networks use Azure-provided DNS.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum crée la zone DNS privée Azure **sap.adatum.internal**. Le réseau virtuel **vnet-sap-prd** est lié à la zone avec l'inscription automatique activée, et le réseau virtuel **vnet-sap-qas** est lié à la zone sans inscription automatique. Les deux réseaux virtuels utilisent le DNS fourni par Azure.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "vnet-sap-prd can also be linked, with autoregistration enabled, to a second private DNS zone."
        fr: "vnet-sap-prd peut aussi être lié, avec l'inscription automatique activée, à une deuxième zone DNS privée."
    - id: s2
      text:
        en: "When a VM of vnet-sap-prd is deleted, its autoregistered A record is removed from sap.adatum.internal."
        fr: "Quand une machine virtuelle de vnet-sap-prd est supprimée, son enregistrement A inscrit automatiquement est retiré de sap.adatum.internal."
    - id: s3
      text:
        en: "The VMs of vnet-sap-qas can resolve the records that were registered automatically for the VMs of vnet-sap-prd."
        fr: "Les machines virtuelles de vnet-sap-qas peuvent résoudre les enregistrements inscrits automatiquement pour les machines virtuelles de vnet-sap-prd."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "A virtual network can have only one registration zone, although a zone can have several registration virtual networks. Autoregistration manages the A records of the VMs for their whole lifecycle: records are created at deployment and removed when the VM is deleted. A resolution virtual network can query all the records of the zone, including those registered automatically from other linked networks."
    fr: "Un réseau virtuel ne peut avoir qu'une seule zone d'inscription, même si une zone peut avoir plusieurs réseaux virtuels d'inscription. L'inscription automatique gère les enregistrements A des machines virtuelles pendant tout leur cycle de vie : ils sont créés au déploiement et supprimés quand la machine virtuelle est supprimée. Un réseau virtuel de résolution peut interroger tous les enregistrements de la zone, y compris ceux inscrits automatiquement depuis d'autres réseaux liés."
references:
  - title: What is autoregistration feature in Azure DNS private zones?
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-autoregistration
  - title: What is a virtual network link subresource of Azure DNS private zones
    url: https://learn.microsoft.com/en-us/azure/dns/private-dns-virtual-network-links
