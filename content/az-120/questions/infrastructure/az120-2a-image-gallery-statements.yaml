id: az120-2a-image-gallery-statements
objective: "2.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam stores the OS images of its SAP VMs in an Azure Compute Gallery and deploys VMs in West Europe and North Europe.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam stocke les images de système d'exploitation de ses machines virtuelles SAP dans une galerie Azure Compute Gallery et déploie des machines virtuelles dans les régions West Europe et North Europe.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Fabrikam can store a specialized image that keeps machine-specific information in the gallery, without generalizing the source VM.
        fr: |
          Fabrikam peut stocker dans la galerie une image spécialisée qui conserve les informations propres à la machine, sans généraliser la machine virtuelle source.
    - id: s2
      text:
        en: |
          After a VM is marked as generalized in Azure, Fabrikam can start it again to install more patches before it captures the image.
        fr: |
          Une fois qu'une machine virtuelle est marquée comme généralisée dans Azure, Fabrikam peut la redémarrer pour installer d'autres correctifs avant de capturer l'image.
    - id: s3
      text:
        en: |
          An image version can be replicated to both regions, and its source region must be one of its target regions.
        fr: |
          Une version d'image peut être répliquée dans les deux régions, et sa région source doit faire partie de ses régions cibles.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Azure Compute Gallery supports specialized images, so generalizing is optional when you keep machine-specific data. A VM marked as generalized cannot be restarted. Each image version has one source region, which must also be in its list of target regions, and you set replica counts per region.
    fr: |
      Azure Compute Gallery prend en charge les images spécialisées : la généralisation est facultative si vous conservez les données propres à la machine. Une machine virtuelle marquée comme généralisée ne peut pas être redémarrée. Chaque version d'image a une région source, qui doit aussi figurer dans ses régions cibles, et vous définissez le nombre de réplicas par région.
references:
  - title: Share VM images in a compute gallery - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries
  - title: Deprovision or generalize a VM before creating an image - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/generalize
