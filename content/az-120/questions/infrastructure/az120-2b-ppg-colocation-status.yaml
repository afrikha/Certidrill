id: az120-2b-ppg-colocation-status
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind uses a proximity placement group named **ppg-erp-z1** for the ASCS VM and the application servers of an SAP ERP system. After an Azure maintenance event, you run the following command:

    `az ppg show --name ppg-erp-z1 --resource-group rg-erp --include-colocation-status`

    The colocation status is **Not aligned**, and the membership section lists the application server VM **erpapp02**.

    You need to bring erpapp02 back inside the latency envelope of the group with the least disruption to the other VMs.

    What should you do first?
  fr: |
    Northwind utilise un groupe de placement de proximité nommé **ppg-erp-z1** pour la machine virtuelle ASCS et les serveurs d'applications d'un système SAP ERP. Après un événement de maintenance Azure, vous exécutez la commande suivante :

    `az ppg show --name ppg-erp-z1 --resource-group rg-erp --include-colocation-status`

    L'état de colocalisation est **Not aligned**, et la section des membres indique la machine virtuelle de serveur d'applications **erpapp02**.

    Vous devez ramener erpapp02 dans l'enveloppe de latence du groupe en perturbant le moins possible les autres machines virtuelles.

    Que devez-vous faire en premier ?
body:
  options:
    - id: a
      text: { en: "Restart erpapp02 from the guest operating system.", fr: "Redémarrer erpapp02 depuis le système d'exploitation invité." }
    - id: b
      text: { en: "Add the size of erpapp02 to the intent of ppg-erp-z1.", fr: "Ajouter la taille d'erpapp02 à l'intention de ppg-erp-z1." }
    - id: c
      text: { en: "Stop (deallocate) erpapp02, and then start it.", fr: "Arrêter (libérer) erpapp02, puis le démarrer." }
    - id: d
      text: { en: "Delete ppg-erp-z1 and create a new proximity placement group.", fr: "Supprimer ppg-erp-z1 et créer un nouveau groupe de placement de proximité." }
answer: { optionId: c }
explanation:
  correct:
    en: "For a Not aligned group, Microsoft says to stop (deallocate) and restart the affected resources, which lets Azure reallocate them close to the other members. Only if that fails with an allocation error do you stop (deallocate) all the resources of the group and restart them."
    fr: "Pour un groupe Not aligned, Microsoft indique d'arrêter (libérer) puis de redémarrer les ressources concernées, ce qui permet à Azure de les réallouer près des autres membres. C'est seulement en cas d'échec d'allocation qu'il faut arrêter (libérer) toutes les ressources du groupe et les redémarrer."
  options:
    a:
      en: "A guest OS restart keeps the VM on the same host, so its placement doesn't change."
      fr: "Un redémarrage depuis l'invité conserve la machine virtuelle sur le même hôte : son placement ne change pas."
    b:
      en: "Updating the intent requires deallocating all the VMs of the group and only steers datacenter selection; it doesn't realign one VM."
      fr: "La mise à jour de l'intention exige de libérer toutes les machines virtuelles du groupe et oriente seulement le choix du centre de données ; elle ne réaligne pas une machine virtuelle."
    d:
      en: "Re-creating the group disrupts every member and isn't required to realign a single VM."
      fr: "Recréer le groupe perturbe tous les membres et n'est pas nécessaire pour réaligner une seule machine virtuelle."
references:
  - title: Proximity placement groups
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/co-location
