id: az120-2b-pe-nfs-sapmnt
objective: "2.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind will host the `/sapmnt` and `/usr/sap/trans` file systems of an SAP system on an NFS Azure file share in a zone-redundant (ZRS) storage account. The SAP VMs run in two availability zones.

    The network access to the share must meet the following requirements:

    - The share must be reached through a private IP address in the SAP virtual network.
    - If a zone fails, the NFS clients must not have to remount the share.

    What should you configure?
  fr: |
    Northwind va héberger les systèmes de fichiers `/sapmnt` et `/usr/sap/trans` d'un système SAP sur un partage de fichiers Azure NFS dans un compte de stockage redondant interzone (ZRS). Les machines virtuelles SAP s'exécutent dans deux zones de disponibilité.

    L'accès réseau au partage doit répondre aux exigences suivantes :

    - Le partage doit être joint par une adresse IP privée du réseau virtuel SAP.
    - En cas de défaillance d'une zone, les clients NFS ne doivent pas avoir à remonter le partage.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "A Microsoft.Storage service endpoint on the SAP subnet and a virtual network rule on the storage account", fr: "Un point de terminaison de service Microsoft.Storage sur le sous-réseau SAP et une règle de réseau virtuel sur le compte de stockage" }
    - id: b
      text: { en: "A private endpoint for the file sub-resource of the storage account", fr: "Un point de terminaison privé pour la sous-ressource file du compte de stockage" }
    - id: c
      text: { en: "An IP network rule on the storage account that allows the address space of the SAP virtual network", fr: "Une règle de réseau IP sur le compte de stockage qui autorise l'espace d'adressage du réseau virtuel SAP" }
    - id: d
      text: { en: "A resource instance rule on the storage account for each SAP VM", fr: "Une règle d'instance de ressource sur le compte de stockage pour chaque machine virtuelle SAP" }
answer: { optionId: b }
explanation:
  correct:
    en: "A private endpoint gives the file share a private IP address in the virtual network. Microsoft recommends private endpoints for Azure Files used by SAP workloads; in the unlikely event of a zonal failure, the NFS client automatically redirects to a healthy zone without a remount."
    fr: "Un point de terminaison privé donne au partage de fichiers une adresse IP privée dans le réseau virtuel. Microsoft recommande les points de terminaison privés pour Azure Files avec les charges de travail SAP ; en cas improbable de défaillance d'une zone, le client NFS est redirigé automatiquement vers une zone saine sans remontage."
  options:
    a:
      en: "A service endpoint doesn't assign a private IP to the share; if a zone outage changes the public endpoint IP, clients might need to remount."
      fr: "Un point de terminaison de service n'attribue pas d'adresse IP privée au partage ; si une panne de zone change l'adresse IP du point de terminaison public, les clients peuvent devoir remonter le partage."
    c:
      en: "IP network rules apply to public IP addresses; NFS shares require a private endpoint or a service endpoint with virtual network restrictions."
      fr: "Les règles de réseau IP s'appliquent aux adresses IP publiques ; les partages NFS exigent un point de terminaison privé ou un point de terminaison de service avec restrictions de réseau virtuel."
    d:
      en: "Resource instance rules are for Azure resources that can't be isolated by network rules, not for VMs in a virtual network."
      fr: "Les règles d'instance de ressource concernent des ressources Azure qu'on ne peut pas isoler par des règles réseau, pas des machines virtuelles d'un réseau virtuel."
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
  - title: NFS file shares in Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/files-nfs-protocol
