id: az120-sr1-app-db-traffic-2
objective: "2.2.6"
type: series_yesno
series: az120-sr1-app-db-traffic
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |-
    You move the HANA VMs to a separate peered virtual network protected by an NSG.
  fr: |-
    Vous déplacez les machines virtuelles HANA vers un réseau virtuel distinct connecté par peering et protégé par un groupe de sécurité réseau.
body:
  solution:
    en: |-
      You move the HANA VMs to a new virtual network named **VNet-DB** that is peered directly with VNet1. You associate with the database subnet of VNet-DB a **network security group** that allows the HANA SQL ports from the application subnet and SSH from the jump hosts, and denies all other inbound traffic.
    fr: |-
      Vous déplacez les machines virtuelles HANA vers un nouveau réseau virtuel nommé **VNet-DB** connecté directement par peering à VNet1. Vous associez au sous-réseau de base de données de VNet-DB un **groupe de sécurité réseau** qui autorise les ports SQL HANA depuis le sous-réseau d'application et SSH depuis les hôtes de rebond, et refuse tout autre trafic entrant.
answer: { value: false }
explanation:
  correct:
    en: |-
      Segregating the SAP application layer and the DBMS layer into different Azure virtual networks isn't supported, even when the two virtual networks are peered; the traffic between them can also incur substantial peering costs. Microsoft recommends separating the two layers by subnets within the same virtual network.
    fr: |-
      Séparer la couche application SAP et la couche SGBD dans des réseaux virtuels Azure différents n'est pas pris en charge, même si les deux réseaux virtuels sont connectés par peering ; le trafic entre eux peut aussi entraîner des coûts de peering importants. Microsoft recommande de séparer les deux couches par des sous-réseaux au sein du même réseau virtuel.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
