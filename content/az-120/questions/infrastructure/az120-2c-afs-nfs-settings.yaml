id: az120-2c-afs-nfs-settings
objective: "2.3.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso is deploying a highly available SAP NetWeaver system on SUSE Linux Enterprise Server for SAP 15 SP5. The **/sapmnt/PR1** and **/usr/sap/PR1/ASCS00** file systems will be NFS shares on Azure Files SSD, reached through a private endpoint. The storage account was created in the Azure portal with the default settings.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso déploie un système SAP NetWeaver hautement disponible sur SUSE Linux Enterprise Server for SAP 15 SP5. Les systèmes de fichiers **/sapmnt/PR1** et **/usr/sap/PR1/ASCS00** seront des partages NFS sur Azure Files SSD, atteints par un point de terminaison privé. Le compte de stockage a été créé dans le portail Azure avec les paramètres par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To mount the shares without encryption in transit, you must disable the Require Encryption in Transit for NFS setting of the storage account.
        fr: Pour monter les partages sans chiffrement en transit, vous devez désactiver le paramètre Exiger le chiffrement en transit pour NFS du compte de stockage.
    - id: s2
      text:
        en: To mount the shares with encryption in transit, you install the AZNFS mount helper and use aznfs as the file system type.
        fr: Pour monter les partages avec chiffrement en transit, vous installez l'assistant de montage AZNFS et utilisez aznfs comme type de système de fichiers.
    - id: s3
      text:
        en: You should enable root squash on the shares so that file owners and groups are displayed correctly on the VMs.
        fr: Vous devez activer root squash sur les partages afin que les propriétaires et les groupes des fichiers s'affichent correctement sur les machines virtuelles.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Require Encryption in Transit for NFS is enabled by default on storage accounts created in the portal and takes precedence over Secure transfer required for NFS, so it must be disabled to allow mounts without TLS. Encryption in transit uses the AZNFS mount helper (stunnel and TLS), with aznfs as the file system type in /etc/fstab or in the Pacemaker Filesystem resource. The shares must use No root squash; otherwise the VMs can't see the file owner or group.
    fr: |
      Exiger le chiffrement en transit pour NFS est activé par défaut sur les comptes de stockage créés dans le portail et prévaut sur Transfert sécurisé requis pour NFS : il doit être désactivé pour autoriser les montages sans TLS. Le chiffrement en transit utilise l'assistant de montage AZNFS (stunnel et TLS), avec aznfs comme type de système de fichiers dans /etc/fstab ou dans la ressource Filesystem de Pacemaker. Les partages doivent utiliser No root squash ; sinon, les machines virtuelles ne voient ni le propriétaire ni le groupe des fichiers.
references:
  - title: Azure VMs high availability for SAP NW on SLES with NFS on Azure Files
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-nfs-azure-files
  - title: Configure encryption in transit for Azure Files
    url: https://learn.microsoft.com/en-us/azure/storage/files/files-encryption-in-transit
