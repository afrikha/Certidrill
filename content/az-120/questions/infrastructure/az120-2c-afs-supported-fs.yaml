id: az120-2c-afs-supported-fs
objective: "2.3.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs an SAP NetWeaver ABAP system and an SAP NetWeaver Java system on SUSE Linux Enterprise Server. The databases run on SAP HANA. Fabrikam wants to use NFS shares on Azure Files SSD wherever Microsoft supports this configuration.

    Which two file systems can you place on NFS shares on Azure Files?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam exécute un système SAP NetWeaver ABAP et un système SAP NetWeaver Java sur SUSE Linux Enterprise Server. Les bases de données s'exécutent sur SAP HANA. Fabrikam veut utiliser des partages NFS sur Azure Files SSD partout où Microsoft prend en charge cette configuration.

    Quels sont les deux systèmes de fichiers que vous pouvez placer sur des partages NFS Azure Files ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "/hana/log of the HANA database", fr: "/hana/log de la base de données HANA" } }
    - { id: b, text: { en: "/sapmnt/<SID> of the ABAP system", fr: "/sapmnt/<SID> du système ABAP" } }
    - { id: c, text: { en: "/usr/sap/<SID>/J<nr> of the Java instance", fr: "/usr/sap/<SID>/J<nr> de l'instance Java" } }
    - { id: d, text: { en: "/usr/sap/trans, the global transport directory", fr: "/usr/sap/trans, le répertoire de transport global" } }
    - { id: e, text: { en: "/hana/data of the HANA database", fr: "/hana/data de la base de données HANA" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Azure Files SSD is highly recommended for /sapmnt and the global transport directory, and it can also host /hana/shared. It isn't supported for DBMS data or log volumes such as /hana/data and /hana/log, and placing /usr/sap/<SID>/J<nr> of SAP J2EE systems on Azure Files NFS isn't supported.
    fr: |
      Azure Files SSD est fortement recommandé pour /sapmnt et le répertoire de transport global, et il peut aussi héberger /hana/shared. Il n'est pas pris en charge pour les volumes de données ou de journal des SGBD comme /hana/data et /hana/log, et placer /usr/sap/<SID>/J<nr> des systèmes SAP J2EE sur Azure Files NFS n'est pas pris en charge.
  options:
    a: { en: "Azure Files isn't supported for /hana/log; use Premium SSD, Premium SSD v2, Ultra Disk or Azure NetApp Files.", fr: "Azure Files n'est pas pris en charge pour /hana/log ; utilisez du SSD Premium, du SSD Premium v2, un disque Ultra ou Azure NetApp Files." }
    c: { en: "Placing the Java instance directory /usr/sap/<SID>/J<nr> on Azure Files NFS isn't supported.", fr: "Placer le répertoire de l'instance Java /usr/sap/<SID>/J<nr> sur Azure Files NFS n'est pas pris en charge." }
    e: { en: "Azure Files isn't supported for /hana/data; DBMS volumes aren't supported on its shares.", fr: "Azure Files n'est pas pris en charge pour /hana/data ; les volumes de SGBD ne sont pas pris en charge sur ses partages." }
references:
  - title: Azure Storage types for SAP workload
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
  - title: Azure VMs high availability for SAP NW on SLES with NFS on Azure Files
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-nfs-azure-files
