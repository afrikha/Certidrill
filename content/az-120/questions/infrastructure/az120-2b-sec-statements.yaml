id: az120-2b-sec-statements
objective: "2.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum protects its SAP systems with network security groups (NSGs) associated with the application and database subnets of the virtual network **vnet-sap**. The SAP HANA VMs run in a Pacemaker cluster behind an internal Standard Load Balancer. The application server NICs are in the application security group **asg-sapapp** and the HANA NICs are in **asg-hana**; all these NICs are in vnet-sap.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum protège ses systèmes SAP avec des groupes de sécurité réseau (NSG) associés aux sous-réseaux des applications et de base de données du réseau virtuel **vnet-sap**. Les machines virtuelles SAP HANA s'exécutent dans un cluster Pacemaker derrière un équilibreur de charge interne Standard. Les cartes réseau des serveurs d'applications appartiennent au groupe de sécurité d'application **asg-sapapp**, et celles de HANA à **asg-hana** ; toutes ces cartes réseau sont dans vnet-sap.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Each additional NSG rule on the database subnet adds measurable latency to the traffic between the application servers and SAP HANA."
        fr: "Chaque règle NSG supplémentaire sur le sous-réseau de base de données ajoute une latence mesurable au trafic entre les serveurs d'applications et SAP HANA."
    - id: s2
      text:
        en: "Without custom rules, the default rules of the database subnet NSG allow inbound traffic from VMs in peered virtual networks."
        fr: "Sans règle personnalisée, les règles par défaut du NSG du sous-réseau de base de données autorisent le trafic entrant des machines virtuelles des réseaux virtuels reliés par peering."
    - id: s3
      text:
        en: "A single NSG rule can use asg-sapapp as the source and asg-hana as the destination."
        fr: "Une même règle NSG peut utiliser asg-sapapp comme source et asg-hana comme destination."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "NSGs don't restrict performance with the rules you define, which is why they are allowed between the SAP application and DBMS layers. The default rule AllowVNetInBound (priority 65000) allows traffic from the VirtualNetwork service tag, which includes peered virtual networks, so you need explicit deny rules to block them. An NSG rule can use ASGs as source and destination when all their NICs are in the same virtual network."
    fr: "Les NSG ne limitent pas les performances avec les règles que vous définissez ; c'est pourquoi ils sont admis entre les couches Application et SGBD de SAP. La règle par défaut AllowVNetInBound (priorité 65000) autorise le trafic de l'étiquette de service VirtualNetwork, qui inclut les réseaux virtuels reliés par peering : des règles de refus explicites sont nécessaires pour les bloquer. Une règle NSG peut utiliser des ASG comme source et destination si toutes leurs cartes réseau sont dans le même réseau virtuel."
references:
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
  - title: Azure Application Security Groups Overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
