id: az120-2c-afs-zrs
objective: "2.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware deploys the ASCS/ERS cluster and the application servers of an SAP system across availability zones 1 and 2 of a region that supports zone-redundant SSD file shares. **/sapmnt** will be an NFS share on Azure Files.

    You need to ensure that the SAP VMs keep access to /sapmnt if an availability zone fails, without remounting the share.

    What should you configure?
  fr: |
    Litware déploie le cluster ASCS/ERS et les serveurs d'applications d'un système SAP dans les zones de disponibilité 1 et 2 d'une région qui prend en charge les partages de fichiers SSD redondants interzone. **/sapmnt** sera un partage NFS sur Azure Files.

    Vous devez faire en sorte que les machines virtuelles SAP conservent l'accès à /sapmnt en cas de défaillance d'une zone de disponibilité, sans remonter le partage.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A premium FileStorage account with zone-redundant storage (ZRS)", fr: "Un compte FileStorage Premium avec stockage redondant interzone (ZRS)" } }
    - { id: b, text: { en: "A premium FileStorage account with locally redundant storage (LRS) and daily share snapshots", fr: "Un compte FileStorage Premium avec stockage localement redondant (LRS) et des instantanés de partage quotidiens" } }
    - { id: c, text: { en: "A standard general-purpose v2 account with geo-redundant storage (GRS)", fr: "Un compte usage général v2 Standard avec stockage géoredondant (GRS)" } }
    - { id: d, text: { en: "Two premium FileStorage accounts with LRS, one per zone, synchronized with AzCopy", fr: "Deux comptes FileStorage Premium avec LRS, un par zone, synchronisés avec AzCopy" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      ZRS replicates the share synchronously across the three availability zones of the region. If a zone fails, the NFS sessions automatically redirect to a healthy zone, and the VMs don't need to remount the share.
    fr: |
      Le stockage ZRS réplique le partage de façon synchrone entre les trois zones de disponibilité de la région. En cas de défaillance d'une zone, les sessions NFS sont automatiquement redirigées vers une zone saine, et les machines virtuelles n'ont pas besoin de remonter le partage.
  options:
    b: { en: "LRS keeps the copies in a single zone, and snapshots don't keep the share available during a zone outage.", fr: "Le stockage LRS conserve les copies dans une seule zone, et les instantanés ne maintiennent pas le partage disponible pendant une panne de zone." }
    c: { en: "Standard accounts don't offer NFS file shares, and GRS replicates asynchronously to another region.", fr: "Les comptes Standard ne proposent pas de partages de fichiers NFS, et le stockage GRS réplique de façon asynchrone vers une autre région." }
    d: { en: "Two separate accounts expose two different shares; a failover would require remounting, and the copies wouldn't be synchronous.", fr: "Deux comptes distincts exposent deux partages différents ; un basculement nécessiterait un remontage, et les copies ne seraient pas synchrones." }
references:
  - title: Azure VMs high availability for SAP NW on SLES with NFS on Azure Files
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-nfs-azure-files
