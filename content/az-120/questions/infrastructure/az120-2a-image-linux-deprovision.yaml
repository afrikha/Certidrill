id: az120-2a-image-linux-deprovision
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip has a reference VM named **vmsapref01** that runs SUSE Linux Enterprise Server for SAP Applications with the company's hardening settings and agents. You plan to capture a generalized image of vmsapref01 to deploy new SAP application servers. The image must not contain the account that was used to provision vmsapref01.

    What should you run first, inside vmsapref01?
  fr: |
    Wingtip dispose d'une machine virtuelle de référence nommée **vmsapref01** qui exécute SUSE Linux Enterprise Server for SAP Applications avec les paramètres de durcissement et les agents de l'entreprise. Vous prévoyez de capturer une image généralisée de vmsapref01 pour déployer de nouveaux serveurs d'applications SAP. L'image ne doit pas contenir le compte utilisé pour provisionner vmsapref01.

    Que devez-vous exécuter en premier, dans vmsapref01 ?
body:
  options:
    - { id: a, text: "az vm generalize --resource-group RG-SAP --name vmsapref01" }
    - { id: b, text: "sysprep.exe /generalize /shutdown" }
    - { id: c, text: "sudo zypper install WALinuxAgent" }
    - { id: d, text: "sudo waagent -deprovision+user" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      On Linux, `waagent -deprovision+user` deletes the provisioning data, machine-specific files and the last provisioned user account; `-deprovision` alone keeps that account. You then leave the VM, deallocate it and mark it as generalized with `az vm generalize`.
    fr: |
      Sous Linux, `waagent -deprovision+user` supprime les données de provisionnement, les fichiers propres à la machine et le dernier compte utilisateur provisionné ; `-deprovision` seul conserve ce compte. Vous quittez ensuite la machine virtuelle, la libérez et la marquez comme généralisée avec `az vm generalize`.
  options:
    a:
      en: |
        `az vm generalize` runs from outside the VM after deprovisioning and deallocation; it only marks the VM as generalized in Azure.
      fr: |
        `az vm generalize` s'exécute hors de la machine virtuelle après la déprovision et la libération ; il marque seulement la machine virtuelle comme généralisée dans Azure.
    b:
      en: |
        Sysprep generalizes Windows VMs, not Linux VMs.
      fr: |
        Sysprep généralise les machines virtuelles Windows, pas les machines virtuelles Linux.
    c:
      en: |
        This command installs the Azure VM Agent; it does not remove machine-specific data or user accounts.
      fr: |
        Cette commande installe l'agent de machine virtuelle Azure ; elle ne supprime ni les données propres à la machine ni les comptes utilisateur.
references:
  - title: Deprovision or generalize a VM before creating an image - Azure Virtual Machines
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/generalize
