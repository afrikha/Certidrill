id: az120-2a-acss-install-order
objective: "2.1.7"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Tailspin will deploy a new SAP S/4HANA system with Azure Center for SAP solutions and let the service install the SAP software. The SAP installation media and the BOM file are already in a storage account, and the managed identity and the resource provider are ready.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin va déployer un nouveau système SAP S/4HANA avec le Centre Azure pour les solutions SAP et laisser le service installer les logiciels SAP. Les médias d'installation SAP et le fichier BOM se trouvent déjà dans un compte de stockage, et l'identité managée et le fournisseur de ressources sont prêts.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: net, text: { en: "Create the virtual network with an application subnet, a database subnet and outbound connectivity.", fr: "Créer le réseau virtuel avec un sous-réseau d'application, un sous-réseau de base de données et une connectivité sortante." } }
    - { id: infra, text: { en: "Create the Virtual Instance for SAP solutions to deploy the infrastructure.", fr: "Créer la Virtual Instance for SAP solutions pour déployer l'infrastructure." } }
    - { id: check, text: { en: "Verify that the Infrastructure column of the VIS shows Deployed.", fr: "Vérifier que la colonne Infrastructure de la VIS affiche Deployed." } }
    - { id: install, text: { en: "Select Install SAP software on the VIS and provide the BOM file location.", fr: "Sélectionner Install SAP software sur la VIS et indiquer l'emplacement du fichier BOM." } }
    - { id: confirm, text: { en: "Select Confirm already installed software on the VIS.", fr: "Sélectionner Confirm already installed software sur la VIS." } }
    - { id: register, text: { en: "Register an existing SAP system by selecting its ASCS VM.", fr: "Inscrire un système SAP existant en sélectionnant sa machine virtuelle ASCS." } }
answer:
  sequence: [ net, infra, check, install ]
explanation:
  correct:
    en: |
      The network must exist before the deployment, in the same region as the SAP system. You then create the VIS, which deploys the infrastructure; when the Infrastructure column shows Deployed, you start Install SAP software from the VIS overview and point to the BOM file in the storage account.
    fr: |
      Le réseau doit exister avant le déploiement, dans la même région que le système SAP. Vous créez ensuite la VIS, qui déploie l'infrastructure ; lorsque la colonne Infrastructure affiche Deployed, vous lancez Install SAP software depuis la vue d'ensemble de la VIS et indiquez le fichier BOM du compte de stockage.
  options:
    confirm:
      en: |
        Confirm already installed software is for S/4HANA installed outside the service, which then detects it.
      fr: |
        Confirm already installed software concerne un S/4HANA installé hors du service, qui le détecte ensuite.
    register:
      en: |
        Registration is for SAP systems that already run on Azure and were not deployed by the service.
      fr: |
        L'inscription concerne les systèmes SAP qui s'exécutent déjà sur Azure et n'ont pas été déployés par le service.
references:
  - title: Install SAP software
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/install-software
  - title: Deploy an S/4HANA infrastructure
    url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/deploy-s4hana
