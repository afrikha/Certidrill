id: az120-cs2c-ppg
objective: "2.2.3"
type: single
caseStudy: az120-cs2c-litware
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend a placement design for LE1 that meets the latency requirements.

    What should you recommend?
  fr: |
    Vous devez recommander une conception de placement pour LE1 qui respecte les exigences de latence.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "One proximity placement group for LE1 that contains the VMs of both zones", fr: "Un seul groupe de placement de proximité pour LE1, qui contient les machines virtuelles des deux zones" } }
    - { id: b, text: { en: "One proximity placement group per zone that contains the ASCS/ERS, SQL Server and application server VMs of the zone", fr: "Un groupe de placement de proximité par zone, qui contient les machines virtuelles ASCS/ERS, SQL Server et serveurs d'applications de la zone" } }
    - { id: c, text: { en: "One proximity placement group per zone, anchored by the ASCS/ERS VM of the zone, with the zone's application servers in an availability set linked to it", fr: "Un groupe de placement de proximité par zone, ancré par la machine virtuelle ASCS/ERS de la zone, avec les serveurs d'applications de la zone dans un groupe à haute disponibilité qui lui est lié" } }
    - { id: d, text: { en: "Accelerated Networking on the SQL Server VMs and the application server VMs of both zones", fr: "Accelerated Networking sur les machines virtuelles SQL Server et serveurs d'applications des deux zones" } }
answer: { optionId: c }
explanation:
  correct:
    en: For zonal deployments, Microsoft now recommends one proximity placement group per zone, scoped by the ASCS/SCS VM of that zone, with the application servers in an availability set tied to the group. The DBMS VMs are no longer part of the groups, which keeps the flexibility to resize them or move them to other VM types.
    fr: Pour les déploiements zonaux, Microsoft recommande désormais un groupe de placement de proximité par zone, dont l'étendue est fixée par la machine virtuelle ASCS/SCS de la zone, avec les serveurs d'applications dans un groupe à haute disponibilité lié au groupe. Les machines virtuelles du SGBD ne font plus partie des groupes, ce qui préserve la possibilité de les redimensionner ou de les passer à d'autres types de machines virtuelles.
  options:
    a: { en: "A proximity placement group places VMs close together in one datacenter, so it cannot span two availability zones.", fr: "Un groupe de placement de proximité rapproche les machines virtuelles dans un même centre de données : il ne peut pas couvrir deux zones de disponibilité." }
    b: { en: "Placing the SQL Server VMs in the groups is the previous guidance; it restricts later resizing of the database VMs, which the requirements forbid.", fr: "Placer les machines virtuelles SQL Server dans les groupes correspond aux anciennes recommandations ; cela limite le redimensionnement ultérieur des machines virtuelles de base de données, ce que les exigences interdisent." }
    d: { en: "Accelerated Networking is already enabled on every VM, so it cannot reduce the measured latency further.", fr: "Accelerated Networking est déjà activé sur toutes les machines virtuelles : il ne peut pas réduire davantage la latence mesurée." }
references:
  - title: Configuration options to minimize network latency with SAP applications
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/proximity-placement-scenarios
