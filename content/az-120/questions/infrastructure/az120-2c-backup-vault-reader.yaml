id: az120-2c-backup-vault-reader
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware protects its SAP HANA databases and SAP VMs with Azure Backup in a Recovery Services vault named **rsv-sap-prd**. A security review requires a stronger segregation of duties between the SAP Basis team and the backup team.

    You need to grant the SAP Basis team access to rsv-sap-prd. The team must be able to view backup items, jobs and policies, but must not be able to trigger, stop or delete backups. The solution must follow the principle of least privilege.

    Which role should you assign?
  fr: |
    Litware protège ses bases de données SAP HANA et ses machines virtuelles SAP avec Sauvegarde Azure dans un coffre Recovery Services nommé **rsv-sap-prd**. Un audit de sécurité exige une séparation des tâches plus stricte entre l'équipe SAP Basis et l'équipe de sauvegarde.

    Vous devez accorder à l'équipe SAP Basis un accès à rsv-sap-prd. L'équipe doit pouvoir consulter les éléments, les travaux et les stratégies de sauvegarde, mais ne doit pas pouvoir déclencher, arrêter ni supprimer des sauvegardes. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer ?
body:
  options:
    - { id: a, text: Backup Operator }
    - { id: b, text: Backup Contributor }
    - { id: c, text: Disk Snapshot Contributor }
    - { id: d, text: Backup Reader }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Backup Reader lets users view all backup management operations without changing anything. Microsoft recommends that SAP and server administrators have read-only access to the backup vault, combined with multi-user authorization and a Resource Guard, to protect against rogue administrators and ransomware.
    fr: |
      Backup Reader permet de consulter toutes les opérations de gestion des sauvegardes sans rien modifier. Microsoft recommande que les administrateurs SAP et serveurs n'aient qu'un accès en lecture seule au coffre de sauvegarde, associé à l'autorisation multi-utilisateur et à un Resource Guard, pour se protéger des administrateurs malveillants et des rançongiciels.
  options:
    a: { en: "Backup Operator can trigger backups and restores, which exceeds the requirement.", fr: "Backup Operator peut déclencher des sauvegardes et des restaurations, ce qui dépasse le besoin." }
    b: { en: "Backup Contributor can manage backups and policies, including stopping protection.", fr: "Backup Contributor peut gérer les sauvegardes et les stratégies, y compris arrêter la protection." }
    c: { en: "Disk Snapshot Contributor manages disk snapshots; it gives no visibility on the vault.", fr: "Disk Snapshot Contributor gère les instantanés de disques ; il ne donne aucune visibilité sur le coffre." }
references:
  - title: Secure Azure Infrastructure for SAP Applications
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-security-infrastructure
