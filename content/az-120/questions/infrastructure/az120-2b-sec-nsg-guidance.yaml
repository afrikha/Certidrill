id: az120-2b-sec-nsg-guidance
objective: "2.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware is writing the network security standard for its SAP landscape on Azure. The landscape includes Pacemaker clusters behind internal Standard Load Balancers.

    Which two recommendations should the standard include to follow Microsoft guidance for SAP?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware rédige la norme de sécurité réseau de son paysage SAP sur Azure. Le paysage comprend des clusters Pacemaker derrière des équilibreurs de charge internes Standard.

    Quelles sont les deux recommandations que la norme doit contenir pour suivre les recommandations de Microsoft pour SAP ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Associate NSGs with subnets, and use NIC-level NSGs only in exceptional situations.", fr: "Associer les NSG aux sous-réseaux, et n'utiliser des NSG au niveau des cartes réseau que dans des situations exceptionnelles." } }
    - { id: b, text: { en: "Use application security groups, for example one for all DBMS VMs and one for the VMs of each SAP SID, in the NSG rules.", fr: "Utiliser des groupes de sécurité d'application dans les règles NSG, par exemple un pour toutes les machines virtuelles SGBD et un pour les machines virtuelles de chaque SID SAP." } }
    - { id: c, text: { en: "Inspect the traffic between the application servers and the DBMS with an Azure Firewall Premium instance.", fr: "Inspecter le trafic entre les serveurs d'applications et le SGBD avec une instance du Pare-feu Azure Premium." } }
    - { id: d, text: { en: "Deny inbound traffic from the AzureLoadBalancer service tag on the cluster subnets.", fr: "Refuser le trafic entrant provenant de l'étiquette de service AzureLoadBalancer sur les sous-réseaux des clusters." } }
    - { id: e, text: { en: "Associate an NSG with every NIC in addition to the NSG of its subnet.", fr: "Associer un NSG à chaque carte réseau en plus du NSG de son sous-réseau." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "The SAP planning guide recommends activating NSGs at the subnet level, using NIC-level NSGs only when required, and combining NSGs with ASGs (such as an ASG for all DBMS VMs and one per SAP SID) to permit the needed flows."
    fr: "Le guide de planification SAP recommande d'activer les NSG au niveau des sous-réseaux, de n'utiliser des NSG au niveau des cartes réseau qu'en cas de besoin, et de combiner NSG et ASG (par exemple un ASG pour toutes les machines virtuelles SGBD et un par SID SAP) pour autoriser les flux nécessaires."
  options:
    c: { en: "An NVA, including Azure Firewall, in the path between the SAP application layer and the DBMS isn't supported.", fr: "Une NVA, Pare-feu Azure compris, sur le chemin entre la couche Application SAP et le SGBD n'est pas prise en charge." }
    d: { en: "Load balancer health probes come from the AzureLoadBalancer tag (168.63.129.16); denying it makes the probes fail and breaks cluster failover.", fr: "Les sondes d'intégrité de l'équilibreur de charge proviennent de l'étiquette AzureLoadBalancer (168.63.129.16) ; la refuser fait échouer les sondes et casse le basculement du cluster." }
    e: { en: "Doubling NSGs at subnet and NIC levels adds complexity; NIC-level NSGs are for exceptions.", fr: "Doubler les NSG au niveau des sous-réseaux et des cartes réseau ajoute de la complexité ; les NSG de carte réseau sont réservés aux exceptions." }
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
  - title: Azure network security groups overview
    url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
