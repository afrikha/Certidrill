id: az120-cs1a-byq-latency
objective: "2.2.4"
type: single
caseStudy: az120-cs1a-blue-yonder-airlines
difficulty: 3
status: draft
stem:
  en: |
    You need to recommend how to deploy the Azure NetApp Files volumes of BYQ. The solution must meet the storage requirements.

    What should you recommend?
  fr: |
    Vous devez recommander comment déployer les volumes Azure NetApp Files de BYQ. La solution doit respecter les exigences de stockage.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Create the volumes with availability zone volume placement in zone 1", fr: "Créer les volumes avec le placement de volume en zone de disponibilité dans la zone 1" } }
    - { id: b, text: { en: "Create the volumes with an application volume group for SAP HANA and a proximity placement group", fr: "Créer les volumes avec un groupe de volumes d'application pour SAP HANA et un groupe de placement de proximité" } }
    - { id: c, text: { en: "Create the volumes in a new capacity pool that uses the Ultra service level", fr: "Créer les volumes dans un nouveau pool de capacité qui utilise le niveau de service Ultra" } }
    - { id: d, text: { en: "Create the volumes in a delegated subnet of a virtual network peered with the virtual network of byq-hdb", fr: "Créer les volumes dans un sous-réseau délégué d'un réseau virtuel en peering avec celui de byq-hdb" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Availability zone volume placement creates the volumes in the same zone as byq-hdb, which gives zonal proximity between the VM and its volumes. Microsoft states that this method needs no interactive process with Microsoft to pin VMs to a datacenter, and it is sufficient for non-production systems.
    fr: |
      Le placement de volume en zone de disponibilité crée les volumes dans la même zone que byq-hdb, ce qui offre une proximité zonale entre la machine virtuelle et ses volumes. Microsoft indique que cette méthode ne nécessite aucun échange avec Microsoft pour lier des machines virtuelles à un centre de données, et qu'elle suffit pour les systèmes hors production.
  options:
    b:
      en: |
        An application volume group with a proximity placement group gives the lowest latency, but it requires a request to Microsoft to pin the VMs and ties the deployment to one datacenter.
      fr: |
        Un groupe de volumes d'application avec un groupe de placement de proximité offre la latence la plus faible, mais il nécessite une demande auprès de Microsoft pour lier les machines virtuelles et attache le déploiement à un seul centre de données.
    c:
      en: |
        The service level changes the throughput per TiB of the volumes, not the network distance between the VM and the storage.
      fr: |
        Le niveau de service modifie le débit par Tio des volumes, pas la distance réseau entre la machine virtuelle et le stockage.
    d:
      en: |
        Placing the volumes behind a peering adds nothing to proximity; it does not place the storage closer to byq-hdb.
      fr: |
        Placer les volumes derrière un peering n'apporte aucune proximité ; cela ne rapproche pas le stockage de byq-hdb.
references:
  - title: NFS v4.1 volumes on Azure NetApp Files for SAP HANA
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-netapp
