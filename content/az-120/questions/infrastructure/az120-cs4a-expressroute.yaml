id: az120-cs4a-expressroute
objective: "2.2.9"
type: dropdown
caseStudy: az120-cs4a-wideworld
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend changes to the hybrid connectivity of Wide World Importers to meet the network requirements.

    What should you recommend? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez recommander des modifications de la connectivité hybride de Wide World Importers pour respecter les exigences réseau.

    Que devez-vous recommander ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      ExpressRoute circuits: [[circuit]]

      Virtual network gateway: [[gateway]]
    fr: |
      Circuits ExpressRoute : [[circuit]]

      Passerelle de réseau virtuel : [[gateway]]
  slots:
    - id: circuit
      options:
        - { id: standard, text: { en: "Increase the bandwidth of the existing circuit at the Amsterdam peering location", fr: "Augmenter la bande passante du circuit existant à l'emplacement de peering d'Amsterdam" } }
        - { id: metro, text: { en: "Replace the circuit with an ExpressRoute Metro circuit split across two Amsterdam sites", fr: "Remplacer le circuit par un circuit ExpressRoute Metro réparti sur deux sites d'Amsterdam" } }
        - { id: maximum, text: { en: "Add a second circuit at a peering location outside the Amsterdam metropolitan area", fr: "Ajouter un deuxième circuit à un emplacement de peering situé hors de l'agglomération d'Amsterdam" } }
    - id: gateway
      options:
        - { id: zr, text: { en: "Migrate the ExpressRoute gateway in VNET-HUB-WE to a zone-redundant gateway", fr: "Migrer la passerelle ExpressRoute de VNET-HUB-WE vers une passerelle redondante interzone" } }
        - { id: spoke, text: { en: "Deploy a second ExpressRoute gateway in VNET-INT-WE", fr: "Déployer une deuxième passerelle ExpressRoute dans VNET-INT-WE" } }
        - { id: rise, text: { en: "Ask SAP to deploy an ExpressRoute gateway in the SAP-managed virtual network", fr: "Demander à SAP de déployer une passerelle ExpressRoute dans le réseau virtuel géré par SAP" } }
answer:
  values: { circuit: maximum, gateway: zr }
explanation:
  correct:
    en: Maximum resiliency uses a pair of circuits in two distinct peering locations and removes any single point of failure on the Microsoft network path, so it survives an outage of the whole Amsterdam metropolitan area. A zone-redundant ExpressRoute gateway spreads its instances across availability zones, so the loss of one zone in West Europe does not cut on-premises access. The gateway stays in the hub so that the SAP-managed network and the spokes keep using it through gateway transit.
    fr: La résilience maximale utilise une paire de circuits dans deux emplacements de peering distincts et supprime tout point de défaillance unique sur le chemin réseau de Microsoft ; elle résiste donc à une panne de toute l'agglomération d'Amsterdam. Une passerelle ExpressRoute redondante interzone répartit ses instances entre les zones de disponibilité ; la perte d'une zone de West Europe ne coupe donc pas l'accès local. La passerelle reste dans le hub pour que le réseau géré par SAP et les spokes continuent de l'utiliser grâce au transit de passerelle.
  options:
    standard: { en: "More bandwidth does not change the resiliency level: a single circuit at one site protects against the failure of one connection, not against the loss of the site or the metropolitan area.", fr: "Plus de bande passante ne change pas le niveau de résilience : un circuit unique sur un site protège contre la défaillance d'une connexion, pas contre la perte du site ni de l'agglomération." }
    metro: { en: "ExpressRoute Metro gives site diversity inside one metropolitan area, so a metro-wide outage of Amsterdam still interrupts connectivity.", fr: "ExpressRoute Metro offre une diversité de sites au sein d'une même agglomération ; une panne de toute l'agglomération d'Amsterdam interrompt donc encore la connectivité." }
    spoke: { en: "A gateway in a spoke does not make the hub gateway zone-resilient, and it breaks the hub-and-spoke design used for the SAP-managed network.", fr: "Une passerelle dans un spoke ne rend pas la passerelle du hub résiliente aux zones, et elle rompt la conception hub-and-spoke utilisée pour le réseau géré par SAP." }
    rise: { en: "The SAP-managed network uses the hub gateway as a remote gateway and a virtual network can have only one gateway, local or remote; a gateway that SAP provides reaches only the SAP-managed network.", fr: "Le réseau géré par SAP utilise la passerelle du hub comme passerelle distante, et un réseau virtuel ne peut avoir qu'une passerelle, locale ou distante ; une passerelle fournie par SAP n'atteint que le réseau géré par SAP." }
references:
  - title: Design and architect Azure ExpressRoute for resiliency
    url: https://learn.microsoft.com/en-us/azure/expressroute/design-architecture-for-resiliency
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
