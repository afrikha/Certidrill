id: az120-2c-anf-snapshot-order
objective: "2.3.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs SAP HANA with **/hana/data** and **/hana/log** on Azure NetApp Files NFS v4.1 volumes. You are scripting a storage-based backup without a third-party tool.

    You need to create a HANA-consistent backup that is protected against a failure of the storage that hosts the volumes.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders exécute SAP HANA avec **/hana/data** et **/hana/log** sur des volumes NFS v4.1 Azure NetApp Files. Vous écrivez un script de sauvegarde basée sur le stockage, sans outil tiers.

    Vous devez créer une sauvegarde cohérente pour HANA qui soit protégée contre une défaillance du stockage qui héberge les volumes.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: prep, text: { en: "Run `BACKUP DATA FOR FULL SYSTEM CREATE SNAPSHOT` in SAP HANA.", fr: "Exécuter `BACKUP DATA FOR FULL SYSTEM CREATE SNAPSHOT` dans SAP HANA." } }
    - { id: snap, text: { en: "Create an Azure NetApp Files snapshot of the /hana/data volume.", fr: "Créer un instantané Azure NetApp Files du volume /hana/data." } }
    - { id: close, text: { en: "Run `BACKUP DATA FOR FULL SYSTEM CLOSE SNAPSHOT` with the backup ID and `SUCCESSFUL`.", fr: "Exécuter `BACKUP DATA FOR FULL SYSTEM CLOSE SNAPSHOT` avec l'ID de sauvegarde et `SUCCESSFUL`." } }
    - { id: copy, text: { en: "Copy the snapshot content to another storage location, such as Azure Blob Storage.", fr: "Copier le contenu de l'instantané vers un autre emplacement de stockage, comme le Stockage Blob Azure." } }
    - { id: stop, text: { en: "Stop the SAP HANA database.", fr: "Arrêter la base de données SAP HANA." } }
    - { id: logsnap, text: { en: "Create an Azure NetApp Files snapshot of the /hana/log volume.", fr: "Créer un instantané Azure NetApp Files du volume /hana/log." } }
answer:
  sequence: [ prep, snap, close, copy ]
explanation:
  correct:
    en: |
      You first create a HANA database snapshot so that HANA writes a consistent state, then take the storage snapshot of /hana/data, then close the HANA snapshot; leaving it open increases HANA memory demand and can halt the database. A snapshot sits on the same storage as the volume, so at least one snapshot a day must be copied to another location to be a protected backup.
    fr: |
      Vous créez d'abord un instantané de base de données HANA afin que HANA écrive un état cohérent, puis vous prenez l'instantané de stockage de /hana/data, puis vous fermez l'instantané HANA ; le laisser ouvert augmente la consommation mémoire de HANA et peut arrêter la base. Un instantané réside sur le même stockage que le volume : au moins un instantané par jour doit être copié vers un autre emplacement pour constituer une sauvegarde protégée.
  options:
    stop: { en: "The database stays online; the HANA snapshot provides consistency.", fr: "La base de données reste en ligne ; l'instantané HANA assure la cohérence." }
    logsnap: { en: "No storage snapshot of /hana/log is needed for this procedure.", fr: "Aucun instantané de stockage de /hana/log n'est nécessaire pour cette procédure." }
references:
  - title: SAP HANA Azure virtual machine ANF configuration
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-netapp
