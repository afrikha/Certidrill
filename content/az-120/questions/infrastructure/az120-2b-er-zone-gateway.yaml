id: az120-2b-er-zone-gateway
objective: "2.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum is moving its production SAP systems to a zonal deployment across availability zones 1 and 2. The hub virtual network still uses an ExpressRoute gateway with the **HighPerformance** SKU that was created several years ago.

    You need the ExpressRoute gateway to keep working if one availability zone fails. The solution must minimize the disruption to the existing connections.

    What should you do?
  fr: |
    Adatum migre ses systèmes SAP de production vers un déploiement zonal sur les zones de disponibilité 1 et 2. Le réseau virtuel hub utilise encore une passerelle ExpressRoute de référence SKU **HighPerformance** créée il y a plusieurs années.

    La passerelle ExpressRoute doit continuer à fonctionner si une zone de disponibilité tombe en panne. La solution doit réduire au minimum la perturbation des connexions existantes.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Upgrade the gateway in place to the UltraPerformance SKU.", fr: "Mettre à niveau la passerelle sur place vers la référence SKU UltraPerformance." }
    - id: b
      text: { en: "Create a second ExpressRoute circuit at another peering location and connect it to the gateway.", fr: "Créer un deuxième circuit ExpressRoute à un autre emplacement de peering et le connecter à la passerelle." }
    - id: c
      text: { en: "Enable FastPath on the connection so that traffic no longer depends on the gateway.", fr: "Activer FastPath sur la connexion pour que le trafic ne dépende plus de la passerelle." }
    - id: d
      text: { en: "Migrate the gateway to the ErGw2Az SKU by using the gateway migration experience.", fr: "Migrer la passerelle vers la référence SKU ErGw2Az avec l'expérience de migration de passerelle." }
answer: { optionId: d }
explanation:
  correct:
    en: "Zonal protection for SAP requires the zonal (availability-zone-enabled) version of the ExpressRoute gateway. In-place upgrades only work within the same SKU family, so a HighPerformance gateway moves to an ErGw*Az SKU through the gateway migration experience, which creates a second gateway and transfers the configuration to minimize disruption."
    fr: "La protection zonale pour SAP exige la version zonale (compatible avec les zones de disponibilité) de la passerelle ExpressRoute. Les mises à niveau sur place ne fonctionnent qu'au sein d'une même famille de références SKU : une passerelle HighPerformance passe à une référence SKU ErGw*Az par l'expérience de migration de passerelle, qui crée une deuxième passerelle et transfère la configuration pour réduire la perturbation."
  options:
    a:
      en: "UltraPerformance stays in the non-availability-zone family, so the gateway still lacks zone resiliency."
      fr: "UltraPerformance reste dans la famille sans zones de disponibilité : la passerelle n'est toujours pas résiliente aux pannes de zone."
    b:
      en: "A second circuit protects against a peering location outage, not against the loss of a zone that hosts the gateway."
      fr: "Un deuxième circuit protège contre la panne d'un emplacement de peering, pas contre la perte d'une zone qui héberge la passerelle."
    c:
      en: "FastPath bypasses the gateway in the data path, but the gateway still exchanges the routes, and HighPerformance doesn't support FastPath anyway."
      fr: "FastPath contourne la passerelle dans le chemin des données, mais la passerelle échange toujours les itinéraires, et HighPerformance ne prend de toute façon pas en charge FastPath."
references:
  - title: About ExpressRoute virtual network gateways
    url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-about-virtual-network-gateways
  - title: SAP workload configurations with Azure Availability Zones
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones
