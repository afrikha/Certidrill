id: az120-2b-dns-onprem-pe
objective: "2.2.8"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind's on-premises SAP backup tool must reach the storage account **stnwbkp01** through its blob private endpoint. The on-premises network connects to the hub virtual network by ExpressRoute private peering. An Azure DNS Private Resolver is deployed in the hub, and the private DNS zone **privatelink.blob.core.windows.net** contains the A record of the private endpoint. The on-premises clients use Windows Server DNS servers.

    You need the on-premises clients to resolve `stnwbkp01.blob.core.windows.net` to the private endpoint IP address.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'outil de sauvegarde SAP local de Northwind doit joindre le compte de stockage **stnwbkp01** par son point de terminaison privé blob. Le réseau local est connecté au réseau virtuel hub par le peering privé ExpressRoute. Un Azure DNS Private Resolver est déployé dans le hub, et la zone DNS privée **privatelink.blob.core.windows.net** contient l'enregistrement A du point de terminaison privé. Les clients locaux utilisent des serveurs DNS Windows Server.

    Les clients locaux doivent résoudre `stnwbkp01.blob.core.windows.net` en adresse IP du point de terminaison privé.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      On the on-premises DNS servers, create a conditional forwarder for: [[zone]]

      The conditional forwarder targets: [[target]]

      Link the private DNS zone to: [[link]]
    fr: |
      Sur les serveurs DNS locaux, créer un redirecteur conditionnel pour : [[zone]]

      Le redirecteur conditionnel cible : [[target]]

      Lier la zone DNS privée à : [[link]]
  slots:
    - id: zone
      options:
        - { id: pub, text: blob.core.windows.net }
        - { id: pl, text: privatelink.blob.core.windows.net }
        - { id: file, text: file.core.windows.net }
    - id: target
      options:
        - { id: in, text: { en: "The IP address of the resolver's inbound endpoint", fr: "L'adresse IP du point de terminaison entrant du résolveur" } }
        - { id: out, text: { en: "The IP address of the resolver's outbound endpoint", fr: "L'adresse IP du point de terminaison sortant du résolveur" } }
        - { id: azdns, text: 168.63.129.16 }
    - id: link
      options:
        - { id: hub, text: { en: "The hub virtual network that contains the resolver", fr: "Le réseau virtuel hub qui contient le résolveur" } }
        - { id: gwsub, text: { en: "The GatewaySubnet of the hub virtual network", fr: "Le sous-réseau GatewaySubnet du réseau virtuel hub" } }
        - { id: none, text: { en: "No virtual network, because the resolver queries the zone directly", fr: "Aucun réseau virtuel, car le résolveur interroge directement la zone" } }
answer:
  values: { zone: pub, target: in, link: hub }
explanation:
  correct:
    en: "The conditional forwarder must use the public DNS zone of the service (blob.core.windows.net), not the privatelink zone, and must point to the inbound endpoint, which receives queries that enter Azure. The resolver then uses Azure DNS, which answers from the private DNS zones linked to the resolver's virtual network."
    fr: "Le redirecteur conditionnel doit utiliser la zone DNS publique du service (blob.core.windows.net), et non la zone privatelink, et pointer vers le point de terminaison entrant, qui reçoit les requêtes entrant dans Azure. Le résolveur utilise ensuite Azure DNS, qui répond à partir des zones DNS privées liées au réseau virtuel du résolveur."
  options:
    pl: { en: "Microsoft specifies forwarding the public zone, such as blob.core.windows.net, instead of the privatelink zone.", fr: "Microsoft indique de transférer la zone publique, comme blob.core.windows.net, plutôt que la zone privatelink." }
    out: { en: "The outbound endpoint sends queries from Azure to external DNS servers; it doesn't accept queries from on-premises.", fr: "Le point de terminaison sortant envoie des requêtes d'Azure vers des serveurs DNS externes ; il n'accepte pas les requêtes locales." }
    azdns: { en: "168.63.129.16 is reachable only from inside Azure virtual networks.", fr: "168.63.129.16 n'est joignable que depuis les réseaux virtuels Azure." }
    gwsub: { en: "Private DNS zones are linked to virtual networks, not to subnets.", fr: "Les zones DNS privées sont liées à des réseaux virtuels, pas à des sous-réseaux." }
    none: { en: "Azure DNS answers from the private zones linked to the virtual network where the query is resolved.", fr: "Azure DNS répond à partir des zones privées liées au réseau virtuel où la requête est résolue." }
references:
  - title: Azure Private Endpoint DNS Integration Scenarios
    url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-dns-integration
  - title: Azure DNS Private Resolver Overview
    url: https://learn.microsoft.com/en-us/azure/dns/dns-private-resolver-overview
