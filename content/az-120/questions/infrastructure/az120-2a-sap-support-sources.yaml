id: az120-2a-sap-support-sources
objective: "2.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is designing the Azure target landscape for SAP BW/4HANA and several SAP NetWeaver systems that use SQL Server. The architects must check SAP support for each design decision.

    Which source should the architects use for each check? To answer, drag the appropriate sources to the correct checks. Each source may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam conçoit le paysage Azure cible pour SAP BW/4HANA et plusieurs systèmes SAP NetWeaver qui utilisent SQL Server. Les architectes doivent vérifier la prise en charge par SAP de chaque décision de conception.

    Quelle source les architectes doivent-ils utiliser pour chaque vérification ? Pour répondre, faites glisser les sources appropriées vers les vérifications correspondantes. Chaque source peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: hwdir, text: { en: "SAP HANA hardware directory", fr: "Répertoire matériel SAP HANA" } }
    - { id: n1928533, text: { en: "SAP Note 1928533", fr: "Note SAP 1928533" } }
    - { id: pam, text: { en: "SAP Product Availability Matrix (PAM)", fr: "Matrice de disponibilité des produits SAP (PAM)" } }
    - { id: n2235581, text: { en: "SAP Note 2235581", fr: "Note SAP 2235581" } }
    - { id: regions, text: { en: "Azure products available by region", fr: "Produits Azure disponibles par région" } }
  targets:
    - id: scaleout
      text: { en: "Whether a VM type is certified for an SAP HANA scale-out OLAP configuration", fr: "Si un type de machine virtuelle est certifié pour une configuration SAP HANA scale-out OLAP" }
    - id: saps
      text: { en: "The SAPS throughput of a VM type used for SAP NetWeaver application servers", fr: "Le débit en SAPS d'un type de machine virtuelle utilisé pour les serveurs d'applications SAP NetWeaver" }
    - id: combo
      text: { en: "Whether the target SAP release, OS build and DBMS release can be combined", fr: "Si la version SAP cible, la build du système d'exploitation et la version du SGBD peuvent être combinées" }
    - id: patch
      text: { en: "The SAP HANA patch level required for a given OS release on Azure", fr: "Le niveau de correctif SAP HANA requis pour une version de système d'exploitation donnée sur Azure" }
answer:
  mapping: { scaleout: hwdir, saps: n1928533, combo: pam, patch: n2235581 }
explanation:
  correct:
    en: |
      The SAP HANA hardware directory lists certified IaaS units, and a checkmark in its Clustering column shows scale-out support, with the Application type column showing OLAP or S/4HANA. SAP Note 1928533 lists the supported Azure VM types and their SAPS values. The PAM confirms release, OS and DBMS combinations. SAP Note 2235581 lists the exact HANA releases and patch levels per OS release.
    fr: |
      Le répertoire matériel SAP HANA liste les unités IaaS certifiées ; une coche dans sa colonne Clustering indique la prise en charge du scale-out, et la colonne Application type précise OLAP ou S/4HANA. La note SAP 1928533 liste les types de machines virtuelles Azure pris en charge et leurs valeurs SAPS. La PAM confirme les combinaisons de version, de système d'exploitation et de SGBD. La note SAP 2235581 liste les versions et niveaux de correctif HANA exacts par version de système d'exploitation.
  options:
    regions:
      en: |
        The regional availability page tells you where a VM family is offered, not whether SAP supports it.
      fr: |
        La page de disponibilité régionale indique où une famille de machines virtuelles est proposée, pas si SAP la prend en charge.
references:
  - title: What SAP software is supported on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/supported-product-on-azure
  - title: SAP HANA infrastructure configurations and operations on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations
