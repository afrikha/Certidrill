id: az120-2a-avset-mixed-families
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind runs SAP ERP on Azure in a region that has no availability zones. The ASCS and application servers run on Edsv5-series VMs and the SAP HANA database runs on M-series VMs.

    The team wants to protect each layer against host failures by using availability sets. The design must allow the team to resize any VM within its family later without stopping the VMs of the other layers.

    What should you recommend?
  fr: |
    Northwind exécute SAP ERP sur Azure dans une région sans zones de disponibilité. Les serveurs ASCS et d'applications s'exécutent sur des machines virtuelles de la série Edsv5 et la base de données SAP HANA sur des machines virtuelles de la série M.

    L'équipe veut protéger chaque couche contre les défaillances d'hôte à l'aide de groupes à haute disponibilité. La conception doit permettre de redimensionner plus tard n'importe quelle machine virtuelle au sein de sa famille sans arrêter les machines virtuelles des autres couches.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Separate availability sets for the Edsv5-series VMs and for the M-series VMs", fr: "Des groupes à haute disponibilité distincts pour les machines virtuelles Edsv5 et pour celles de la série M" } }
    - { id: b, text: { en: "One availability set for all the VMs, deploying the Edsv5-series VMs first", fr: "Un seul groupe à haute disponibilité pour toutes les machines virtuelles, en déployant d'abord celles de la série Edsv5" } }
    - { id: c, text: { en: "One availability set for all the VMs, deploying the M-series VMs first", fr: "Un seul groupe à haute disponibilité pour toutes les machines virtuelles, en déployant d'abord celles de la série M" } }
    - { id: d, text: { en: "One availability set for all the VMs, inside a single proximity placement group", fr: "Un seul groupe à haute disponibilité pour toutes les machines virtuelles, dans un seul groupe de placement de proximité" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The host hardware of a VM family limits which VMs can share an availability set; Microsoft gives Edsv5 and M-family VMs as an example of families that cannot be mixed in one set. Resizing across such families inside one set fails and requires stopping all the VMs of the set, so each family gets its own availability set.
    fr: |
      Le matériel hôte d'une famille de machines virtuelles limite les machines qui peuvent partager un groupe à haute disponibilité ; Microsoft cite les familles Edsv5 et M comme exemple de familles impossibles à mélanger dans un même groupe. Un redimensionnement entre ces familles dans un même groupe échoue et impose d'arrêter toutes les machines virtuelles du groupe : chaque famille reçoit donc son propre groupe à haute disponibilité.
  options:
    c:
      en: |
        The deployment order does not remove the hardware constraint; the two families still cannot share one availability set.
      fr: |
        L'ordre de déploiement ne supprime pas la contrainte matérielle ; les deux familles ne peuvent toujours pas partager un groupe à haute disponibilité.
    b:
      en: |
        Same issue: Edsv5 and M-family VMs cannot be mixed in one availability set, whatever the order.
      fr: |
        Même problème : les familles Edsv5 et M ne peuvent pas être mélangées dans un groupe à haute disponibilité, quel que soit l'ordre.
    d:
      en: |
        A proximity placement group reduces network latency but does not lift the hardware constraint of a shared availability set.
      fr: |
        Un groupe de placement de proximité réduit la latence réseau mais ne lève pas la contrainte matérielle d'un groupe à haute disponibilité partagé.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
