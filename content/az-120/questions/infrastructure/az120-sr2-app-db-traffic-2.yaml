id: az120-sr2-app-db-traffic-2
objective: "2.2.5"
type: series_yesno
series: az120-sr2-app-db-traffic
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You filter the traffic with application security groups in an NSG on DbSubnet.
  fr: |
    Vous filtrez le trafic avec des groupes de sécurité d'application dans un NSG sur DbSubnet.
body:
  solution:
    en: |
      You add the network interfaces of the application server VMs to an application security group named **asg-prd-app** and the HANA VM to **asg-prd-db**. In a network security group associated with **DbSubnet**, you allow inbound traffic from asg-prd-app to asg-prd-db on the HANA SQL ports, followed by a rule that denies all other inbound traffic from the **VirtualNetwork** service tag to asg-prd-db.
    fr: |
      Vous ajoutez les interfaces réseau des machines virtuelles de serveur d'applications à un groupe de sécurité d'application nommé **asg-prd-app** et la machine virtuelle HANA à **asg-prd-db**. Dans un groupe de sécurité réseau associé à **DbSubnet**, vous autorisez le trafic entrant d'asg-prd-app vers asg-prd-db sur les ports SQL de HANA, puis vous ajoutez une règle qui refuse tout autre trafic entrant de la balise de service **VirtualNetwork** vers asg-prd-db.
answer: { value: true }
explanation:
  correct:
    en: |
      NSG and ASG rules are allowed between the SAP application layer and the DBMS layer because they keep a direct communication path, and NSG rules do not reduce network performance. Grouping the VMs in ASGs lets one subnet-level NSG allow only the application servers on the HANA ports and block the rest of VNet1. No load balancer health probe is affected because the HANA VM has no load balancer.
    fr: |
      Les règles de NSG et d'ASG sont autorisées entre la couche Application SAP et la couche SGBD, car elles conservent un chemin de communication direct, et les règles de NSG ne réduisent pas les performances réseau. Regrouper les machines virtuelles dans des ASG permet à un seul NSG au niveau du sous-réseau d'autoriser uniquement les serveurs d'applications sur les ports HANA et de bloquer le reste de VNet1. Aucune sonde d'intégrité n'est affectée, car la machine virtuelle HANA n'a pas d'équilibreur de charge.
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
