id: az120-2c-wa-enable-order
objective: "2.3.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware runs SAP HANA on a Standard_M64ms virtual machine named **hdb02**. The **/hana/log** volume is an LVM stripe set over three Premium SSD disks that don't have Write Accelerator enabled.

    You need to enable Write Accelerator on the /hana/log disks according to Microsoft guidance.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware exécute SAP HANA sur une machine virtuelle Standard_M64ms nommée **hdb02**. Le volume **/hana/log** est un jeu entrelacé LVM de trois disques SSD Premium sur lesquels l'Accélérateur d'écriture n'est pas activé.

    Vous devez activer l'Accélérateur d'écriture sur les disques /hana/log conformément aux recommandations de Microsoft.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: stopdb, text: { en: "Stop the SAP HANA database.", fr: "Arrêter la base de données SAP HANA." } }
    - { id: stopvm, text: { en: "Shut down hdb02.", fr: "Arrêter hdb02." } }
    - { id: enable, text: { en: "Enable Write Accelerator with host caching None on each /hana/log disk, one disk at a time.", fr: "Activer l'Accélérateur d'écriture avec la mise en cache de l'hôte None sur chaque disque /hana/log, un disque à la fois." } }
    - { id: startvm, text: { en: "Start hdb02.", fr: "Démarrer hdb02." } }
    - { id: startdb, text: { en: "Start the SAP HANA database.", fr: "Démarrer la base de données SAP HANA." } }
    - { id: data, text: { en: "Enable Write Accelerator on the /hana/data disks.", fr: "Activer l'Accélérateur d'écriture sur les disques /hana/data." } }
    - { id: rw, text: { en: "Set host caching to ReadWrite on each /hana/log disk.", fr: "Régler la mise en cache de l'hôte sur ReadWrite sur chaque disque /hana/log." } }
answer:
  sequence: [ stopdb, stopvm, enable, startvm, startdb ]
explanation:
  correct:
    en: |
      When a volume is striped over several disks, you shut down the VM before enabling or disabling Write Accelerator, after stopping the database that uses the disks. Each disk of the stripe set is then enabled in a separate step, with caching None (only None or ReadOnly are supported with Write Accelerator). You then start the VM and the database.
    fr: |
      Lorsqu'un volume est entrelacé sur plusieurs disques, vous arrêtez la machine virtuelle avant d'activer ou de désactiver l'Accélérateur d'écriture, après avoir arrêté la base de données qui utilise les disques. Chaque disque du jeu entrelacé est ensuite activé dans une étape distincte, avec la mise en cache None (seuls None et ReadOnly sont pris en charge avec l'Accélérateur d'écriture). Vous démarrez ensuite la machine virtuelle et la base de données.
  options:
    data: { en: "Write Accelerator shouldn't be used for DBMS data volumes.", fr: "L'Accélérateur d'écriture ne doit pas être utilisé pour les volumes de données des SGBD." }
    rw: { en: "ReadWrite caching isn't supported with Write Accelerator.", fr: "La mise en cache ReadWrite n'est pas prise en charge avec l'Accélérateur d'écriture." }
references:
  - title: Azure Write Accelerator
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/how-to-enable-write-accelerator
