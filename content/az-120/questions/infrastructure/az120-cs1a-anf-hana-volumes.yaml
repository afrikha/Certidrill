id: az120-cs1a-anf-hana-volumes
objective: "2.3.8"
type: dropdown
caseStudy: az120-cs1a-blue-yonder-airlines
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You are designing the Azure NetApp Files volumes for the BYP database. The design must meet the storage requirements.

    How should you complete the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez les volumes Azure NetApp Files de la base de données BYP. La conception doit respecter les exigences de stockage.

    Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Protocol for the /hana/data and /hana/log volumes: [[proto]]

      Size of the subnet delegated to Azure NetApp Files: [[subnet]]

      Minimum size of the /hana/log volume: [[log]]
    fr: |
      Protocole des volumes /hana/data et /hana/log : [[proto]]

      Taille du sous-réseau délégué à Azure NetApp Files : [[subnet]]

      Taille minimale du volume /hana/log : [[log]]
  slots:
    - id: proto
      options:
        - { id: nfs41, text: "NFS v4.1" }
        - { id: nfs3, text: "NFS v3" }
        - { id: smb, text: "SMB" }
    - id: subnet
      options:
        - { id: s28, text: "/28" }
        - { id: s26, text: "/26" }
        - { id: s25, text: "/25" }
    - id: log
      options:
        - { id: t1, text: { en: "1 TiB", fr: "1 Tio" } }
        - { id: t2, text: { en: "2 TiB", fr: "2 Tio" } }
        - { id: t4, text: { en: "4 TiB", fr: "4 Tio" } }
answer:
  values: { proto: nfs41, subnet: s25, log: t4 }
explanation:
  correct:
    en: |
      SAP HANA supports Azure NetApp Files for /hana/data and /hana/log only over NFS v4.1, and Microsoft highly recommends a /25 delegated subnet for SAP workloads. With auto QoS, a volume's throughput is proportional to its size, so a Premium volume must be at least 4 TiB to reach the /hana/log KPI of 250 MB/s (a 2 TiB minimum applies only to the Ultra service level).
    fr: |
      SAP HANA ne prend en charge Azure NetApp Files pour /hana/data et /hana/log qu'en NFS v4.1, et Microsoft recommande fortement un sous-réseau délégué /25 pour les charges de travail SAP. Avec la QoS automatique, le débit d'un volume est proportionnel à sa taille : un volume Premium doit donc faire au moins 4 Tio pour atteindre le KPI de 250 Mo/s de /hana/log (le minimum de 2 Tio ne s'applique qu'au niveau de service Ultra).
  options:
    nfs3:
      en: |
        NFS v3 is not supported for /hana/data and /hana/log on Azure NetApp Files; it can be used only for volumes such as /hana/shared or backups.
      fr: |
        NFS v3 n'est pas pris en charge pour /hana/data et /hana/log sur Azure NetApp Files ; il ne peut servir qu'à des volumes comme /hana/shared ou les sauvegardes.
    smb:
      en: |
        SAP HANA on Linux uses NFS volumes; SMB is not an option for the HANA data and log volumes.
      fr: |
        SAP HANA sur Linux utilise des volumes NFS ; SMB n'est pas une option pour les volumes de données et de journaux HANA.
    t1:
      en: |
        A 1 TiB Premium volume delivers about 64 MB/s, far below the 250 MB/s that /hana/log needs.
      fr: |
        Un volume Premium de 1 Tio fournit environ 64 Mo/s, bien moins que les 250 Mo/s dont /hana/log a besoin.
    t2:
      en: |
        2 TiB is the /hana/log minimum for the Ultra service level, but the capacity pools use Premium and must not change.
      fr: |
        2 Tio est le minimum de /hana/log pour le niveau de service Ultra, mais les pools de capacité utilisent Premium et ne doivent pas changer.
references:
  - title: NFS v4.1 volumes on Azure NetApp Files for SAP HANA
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-netapp
