id: az120-2b-pe-onprem-access
objective: "2.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam keeps an on-premises backup server that must copy SAP database backups to a Blob Storage account in Azure. The datacenter connects to the hub virtual network through ExpressRoute private peering only; Microsoft peering isn't configured. The storage account must not be reachable from the internet.

    You need to provide private connectivity from the on-premises backup server to the storage account.

    What should you include in the solution?
  fr: |
    Fabrikam conserve un serveur de sauvegarde local qui doit copier des sauvegardes de base de données SAP vers un compte Stockage Blob Azure. Le centre de données est connecté au réseau virtuel hub uniquement par le peering privé ExpressRoute ; le peering Microsoft n'est pas configuré. Le compte de stockage ne doit pas être joignable depuis Internet.

    Vous devez fournir une connectivité privée entre le serveur de sauvegarde local et le compte de stockage.

    Que devez-vous inclure dans la solution ?
body:
  options:
    - id: a
      text: { en: "A Microsoft.Storage service endpoint on GatewaySubnet", fr: "Un point de terminaison de service Microsoft.Storage sur GatewaySubnet" }
    - id: b
      text: { en: "A Microsoft.Storage.Global service endpoint on the hub subnets", fr: "Un point de terminaison de service Microsoft.Storage.Global sur les sous-réseaux du hub" }
    - id: c
      text: { en: "A private endpoint for the blob sub-resource in a hub subnet", fr: "Un point de terminaison privé pour la sous-ressource blob dans un sous-réseau du hub" }
    - id: d
      text: { en: "A storage firewall IP rule for the public NAT address of the datacenter", fr: "Une règle IP du pare-feu de stockage pour l'adresse NAT publique du centre de données" }
answer: { optionId: c }
explanation:
  correct:
    en: "Private endpoints let on-premises networks connected through VPN or ExpressRoute private peering reach the storage account on a private IP address. You then deny public network access in the storage firewall and make the on-premises DNS resolve the account name to the private endpoint."
    fr: "Les points de terminaison privés permettent aux réseaux locaux connectés par VPN ou par le peering privé ExpressRoute de joindre le compte de stockage sur une adresse IP privée. Vous refusez ensuite l'accès au réseau public dans le pare-feu de stockage et faites résoudre le nom du compte vers le point de terminaison privé par le DNS local."
  options:
    a:
      en: "Service endpoints can't be used for traffic from on-premises networks to Azure services."
      fr: "Les points de terminaison de service ne peuvent pas être utilisés pour le trafic des réseaux locaux vers les services Azure."
    b:
      en: "The cross-region service endpoint has the same limitation: it only serves traffic that originates in the subnet."
      fr: "Le point de terminaison de service interrégion a la même limitation : il ne sert que le trafic qui provient du sous-réseau."
    d:
      en: "An IP rule for a public NAT address keeps the public endpoint in use, so the traffic doesn't stay private over private peering."
      fr: "Une règle IP pour une adresse NAT publique conserve l'usage du point de terminaison public : le trafic ne reste pas privé sur le peering privé."
references:
  - title: Use private endpoints for Azure Storage
    url: https://learn.microsoft.com/en-us/azure/storage/common/storage-private-endpoints
  - title: Azure virtual network service endpoints
    url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-service-endpoints-overview
