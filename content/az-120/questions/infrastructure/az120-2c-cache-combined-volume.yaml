id: az120-2c-cache-combined-volume
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys runs a small non-production SAP HANA system on a Standard_E16ds_v5 virtual machine. To reduce cost, **/hana/data** and **/hana/log** share a single file system built on an LVM stripe set over three Premium SSD disks.

    You need to configure host caching on the three disks according to Microsoft guidance.

    What should you configure?
  fr: |
    Tailspin Toys exécute un petit système SAP HANA hors production sur une machine virtuelle Standard_E16ds_v5. Pour réduire les coûts, **/hana/data** et **/hana/log** partagent un même système de fichiers créé sur un jeu entrelacé LVM de trois disques SSD Premium.

    Vous devez configurer la mise en cache de l'hôte des trois disques conformément aux recommandations de Microsoft.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "ReadOnly on all three disks", fr: "ReadOnly sur les trois disques" } }
    - { id: b, text: { en: "ReadWrite on all three disks", fr: "ReadWrite sur les trois disques" } }
    - { id: c, text: { en: "None + Write Accelerator on all three disks", fr: "None + Accélérateur d'écriture sur les trois disques" } }
    - { id: d, text: { en: "None on all three disks", fr: "None sur les trois disques" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When the data and log volumes of SAP HANA are combined on one striped volume, the disks that build the stripe set shouldn't have read cache or read/write cache enabled, because the log writes must not go through the host cache. All disks of a stripe set should also share the same configuration.
    fr: |
      Lorsque les volumes de données et de journal de SAP HANA sont combinés sur un seul volume entrelacé, les disques qui composent le jeu entrelacé ne doivent avoir ni cache en lecture ni cache en lecture/écriture, car les écritures du journal ne doivent pas passer par le cache de l'hôte. Tous les disques d'un jeu entrelacé doivent en outre avoir la même configuration.
  options:
    a: { en: "Read caching is acceptable for a dedicated /hana/data volume, not for a volume that also holds the log.", fr: "La mise en cache en lecture est acceptable pour un volume /hana/data dédié, pas pour un volume qui contient aussi le journal." }
    b: { en: "ReadWrite caching isn't recommended for HANA volumes and can lose cached writes if the VM fails.", fr: "La mise en cache ReadWrite n'est pas recommandée pour les volumes HANA et peut perdre des écritures en cache en cas de défaillance de la machine virtuelle." }
    c: { en: "Write Accelerator is available only on M-series VMs, not on an E-series VM.", fr: "L'Accélérateur d'écriture n'est disponible que sur les machines virtuelles de la série M, pas sur une machine virtuelle de la série E." }
references:
  - title: SAP HANA Azure virtual machine Premium SSD storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-premium-ssd-v1
