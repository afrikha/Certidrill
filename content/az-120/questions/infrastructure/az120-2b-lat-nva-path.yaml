id: az120-2b-lat-nva-path
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum runs SAP S/4HANA on Azure. The application servers are in the subnet **snet-app** and the SAP HANA VMs are in the subnet **snet-db** of the same virtual network. A hub virtual network contains an Azure Firewall instance.

    The security team requires that only the SAP and HANA ports be allowed from snet-app to snet-db. The solution must be supported for SAP and must not increase the latency between the two layers.

    What should you recommend?
  fr: |
    Adatum exécute SAP S/4HANA sur Azure. Les serveurs d'applications se trouvent dans le sous-réseau **snet-app** et les machines virtuelles SAP HANA dans le sous-réseau **snet-db** du même réseau virtuel. Un réseau virtuel hub contient une instance du Pare-feu Azure.

    L'équipe de sécurité exige que seuls les ports SAP et HANA soient autorisés de snet-app vers snet-db. La solution doit être prise en charge pour SAP et ne doit pas augmenter la latence entre les deux couches.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "A user-defined route on snet-app that sends the traffic for snet-db to the Azure Firewall", fr: "Un itinéraire défini par l'utilisateur sur snet-app qui envoie le trafic destiné à snet-db vers le Pare-feu Azure" }
    - id: b
      text: { en: "A partner network virtual appliance deployed in a new subnet between snet-app and snet-db", fr: "Une appliance virtuelle réseau partenaire déployée dans un nouveau sous-réseau entre snet-app et snet-db" }
    - id: c
      text: { en: "Network security group rules on snet-db that use application security groups for the SAP VMs", fr: "Des règles de groupe de sécurité réseau sur snet-db utilisant des groupes de sécurité d'application pour les machines virtuelles SAP" }
    - id: d
      text: { en: "Moving the HANA VMs to a separate virtual network that is peered through the hub firewall", fr: "Le déplacement des machines virtuelles HANA vers un réseau virtuel distinct relié par peering via le pare-feu du hub" }
answer: { optionId: c }
explanation:
  correct:
    en: "Network virtual appliances, including firewalls, in the communication path between the SAP application layer and the DBMS layer aren't supported because they can double latency, limit throughput and even break Pacemaker clusters. NSG and ASG rules are allowed because they keep a direct path, and NSGs don't restrict performance."
    fr: "Les appliances virtuelles réseau, pare-feu compris, placées sur le chemin de communication entre la couche Application SAP et la couche SGBD ne sont pas prises en charge, car elles peuvent doubler la latence, limiter le débit, voire faire échouer des clusters Pacemaker. Les règles NSG et ASG sont autorisées, car elles conservent un chemin direct, et les NSG ne limitent pas les performances."
  options:
    a:
      en: "Routing app-to-database traffic through Azure Firewall places an NVA in the SAP kernel path: unsupported and slower."
      fr: "Router le trafic application-base de données via le Pare-feu Azure place une NVA sur le chemin du noyau SAP : non pris en charge et plus lent."
    b:
      en: "Any NVA between the two layers is unsupported, whatever the vendor."
      fr: "Toute NVA entre les deux couches n'est pas prise en charge, quel que soit l'éditeur."
    d:
      en: "Splitting the layers into different virtual networks isn't supported, and peering traffic adds transfer costs on top of the firewall latency."
      fr: "Séparer les couches dans des réseaux virtuels différents n'est pas pris en charge, et le trafic de peering ajoute des coûts de transfert à la latence du pare-feu."
references:
  - title: Plan and implement an SAP deployment on Azure
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
