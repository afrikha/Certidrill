id: az120-2c-encryption-at-host
objective: "2.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is deploying new SAP application server and SAP HANA virtual machines (E-series and Mv3-series). A compliance requirement states that the data on the temporary disks and in the disk caches must be encrypted at rest, and that the data flowing from the VMs to the storage clusters must be encrypted. The solution must not consume VM CPU and must be supported for SAP systems.

    Which disk encryption option should you use?
  fr: |
    Woodgrove Bank déploie de nouvelles machines virtuelles de serveurs d'applications SAP et SAP HANA (séries E et Mv3). Une exigence de conformité impose que les données des disques temporaires et des caches de disque soient chiffrées au repos, et que les données transitant des machines virtuelles vers les clusters de stockage soient chiffrées. La solution ne doit pas consommer de processeur de la machine virtuelle et doit être prise en charge pour les systèmes SAP.

    Quelle option de chiffrement de disque devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Server-side encryption with customer-managed keys", fr: "Le chiffrement côté serveur avec des clés gérées par le client" } }
    - { id: b, text: { en: "Azure Disk Encryption", fr: "Azure Disk Encryption" } }
    - { id: c, text: { en: "Double encryption at rest", fr: "Le double chiffrement au repos" } }
    - { id: d, text: { en: "Encryption at host", fr: "Le chiffrement sur l'hôte" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Encryption at host encrypts temporary disks and disk caches at rest and encrypts the data flows to the storage clusters, without using the VM's CPU. It is tested with SAP, adds about 2% overhead, and is what customers with an at-rest encryption requirement typically use for SAP VMs.
    fr: |
      Le chiffrement sur l'hôte chiffre au repos les disques temporaires et les caches de disque, et chiffre les flux de données vers les clusters de stockage, sans utiliser le processeur de la machine virtuelle. Il est testé avec SAP, ajoute environ 2 % de surcharge et c'est l'option qu'utilisent généralement les clients soumis à une exigence de chiffrement au repos pour les machines virtuelles SAP.
  options:
    a: { en: "Server-side encryption, with platform-managed or customer-managed keys, doesn't encrypt temporary disks or disk caches.", fr: "Le chiffrement côté serveur, avec des clés gérées par la plateforme ou par le client, ne chiffre ni les disques temporaires ni les caches de disque." }
    b: { en: "Azure Disk Encryption uses the VM's CPU, isn't supported for SAP systems, and is scheduled for retirement.", fr: "Azure Disk Encryption utilise le processeur de la machine virtuelle, n'est pas pris en charge pour les systèmes SAP et doit être mis hors service." }
    c: { en: "Double encryption adds a second layer at rest on the storage side but still doesn't cover temporary disks and caches.", fr: "Le double chiffrement ajoute une seconde couche au repos côté stockage, mais ne couvre toujours pas les disques temporaires et les caches." }
references:
  - title: Overview of managed disk encryption options
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption-overview
  - title: Secure Azure Infrastructure for SAP Applications
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-security-infrastructure
