id: az120-2c-storage-combinations
objective: "2.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum is designing a scale-up SAP HANA system on Azure that uses HANA System Replication (HSR) between a primary and a secondary virtual machine. The team is evaluating several storage layouts.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum conçoit un système SAP HANA scale-up sur Azure qui utilise HANA System Replication (HSR) entre une machine virtuelle principale et une machine virtuelle secondaire. L'équipe évalue plusieurs dispositions de stockage.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: On the same HANA VM, you can place /hana/data on an Azure NetApp Files NFS v4.1 volume and /hana/log on Premium SSD v2 disks.
        fr: Sur la même machine virtuelle HANA, vous pouvez placer /hana/data sur un volume NFS v4.1 Azure NetApp Files et /hana/log sur des disques SSD Premium v2.
    - id: s2
      text:
        en: You can attach Ultra Disks for /hana/log to HANA VMs that are deployed in an availability set.
        fr: Vous pouvez attacher des disques Ultra pour /hana/log à des machines virtuelles HANA déployées dans un groupe à haute disponibilité.
    - id: s3
      text:
        en: You can place /hana/data on Premium SSD v2 on the primary VM and on Azure NetApp Files on the secondary VM.
        fr: Vous pouvez placer /hana/data sur du SSD Premium v2 sur la machine virtuelle principale et sur Azure NetApp Files sur la machine virtuelle secondaire.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Combining Azure NetApp Files NFS for one HANA volume with Premium SSD, Premium SSD v2 or Ultra Disk for the other is supported. Ultra Disks don't support availability sets; they are used with zonal (or single) VM deployments. With HSR, /hana/data must use the same storage type on every replica, and so must /hana/log, so mixing Premium SSD v2 and Azure NetApp Files across replicas isn't supported.
    fr: |
      Combiner Azure NetApp Files NFS pour un volume HANA avec du SSD Premium, du SSD Premium v2 ou un disque Ultra pour l'autre est pris en charge. Les disques Ultra ne prennent pas en charge les groupes à haute disponibilité ; ils s'utilisent avec des déploiements zonaux (ou de machines virtuelles uniques). Avec HSR, /hana/data doit utiliser le même type de stockage sur chaque réplica, de même que /hana/log : mélanger SSD Premium v2 et Azure NetApp Files entre réplicas n'est pas pris en charge.
references:
  - title: SAP HANA Azure virtual machine storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-storage
  - title: Select a disk type for Azure IaaS VMs - managed disks
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-types
