id: az120-2b-ppg-intent
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware will deploy a new SAP system whose application servers and ASCS VM must be colocated in a proximity placement group in availability zone 1. The application servers use **Standard_E64s_v4**, and the design might later add **Standard_M416ms_v2** VMs to the same group.

    You need to create the proximity placement group so that Azure pins it to a datacenter that offers both VM sizes, which minimizes the risk of `OverconstrainedAllocationRequest` errors.

    What should you do?
  fr: |
    Proseware va déployer un nouveau système SAP dont les serveurs d'applications et la machine virtuelle ASCS doivent être colocalisés dans un groupe de placement de proximité dans la zone de disponibilité 1. Les serveurs d'applications utilisent **Standard_E64s_v4**, et la conception pourra ajouter plus tard des machines virtuelles **Standard_M416ms_v2** au même groupe.

    Vous devez créer le groupe de placement de proximité pour qu'Azure l'ancre à un centre de données qui propose les deux tailles, ce qui réduit le risque d'erreurs `OverconstrainedAllocationRequest`.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Run `az ppg create` with `-z 1` only, and deploy the ASCS VM first.", fr: "Exécuter `az ppg create` avec seulement `-z 1`, puis déployer en premier la machine virtuelle ASCS." }
    - id: b
      text: { en: "Run `az ppg create` with `--intent-vm-sizes Standard_E64s_v4 Standard_M416ms_v2` and `-z 1`.", fr: "Exécuter `az ppg create` avec `--intent-vm-sizes Standard_E64s_v4 Standard_M416ms_v2` et `-z 1`." }
    - id: c
      text: { en: "Create one proximity placement group for each VM size and deploy them in zone 1.", fr: "Créer un groupe de placement de proximité par taille de machine virtuelle et les déployer dans la zone 1." }
    - id: d
      text: { en: "Create the group without options and deploy a Standard_M416ms_v2 VM first, then delete it.", fr: "Créer le groupe sans option et déployer d'abord une machine virtuelle Standard_M416ms_v2, puis la supprimer." }
answer: { optionId: b }
explanation:
  correct:
    en: "The `intent` property lists the VM sizes you plan to use, and Azure selects a datacenter that supports all of them; creation fails with OverconstrainedAllocationRequest if none does. The `zone` parameter can only be used together with an intent and only at creation time. The intent doesn't reserve capacity."
    fr: "La propriété `intent` liste les tailles de machines virtuelles prévues, et Azure choisit un centre de données qui les prend toutes en charge ; la création échoue avec OverconstrainedAllocationRequest si aucun ne convient. Le paramètre `zone` ne peut être utilisé qu'avec une intention et seulement à la création. L'intention ne réserve pas de capacité."
  options:
    a:
      en: "A zone can't be set without an intent, and the anchor VM alone gives no guarantee that M-series hardware exists under the selected spine."
      fr: "Une zone ne peut pas être définie sans intention, et la seule machine virtuelle d'ancrage ne garantit pas que du matériel de série M existe sous la colonne vertébrale réseau sélectionnée."
    c:
      en: "Separate groups can land in different datacenters, which defeats the colocation goal."
      fr: "Des groupes distincts peuvent se retrouver dans des centres de données différents, ce qui va à l'encontre de la colocalisation."
    d:
      en: "Once all its resources are deleted, the group is unpinned again, so the trick doesn't keep it in an M-series datacenter."
      fr: "Une fois toutes ses ressources supprimées, le groupe n'est plus ancré : l'astuce ne le maintient pas dans un centre de données doté de la série M."
references:
  - title: Proximity placement groups
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/co-location
  - title: Create a proximity placement group using the Azure CLI
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/proximity-placement-groups
