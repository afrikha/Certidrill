id: az120-2a-sdaf-topology
objective: "2.1.6"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind uses a hub-and-spoke network topology and plans to deploy its development, quality assurance and production SAP systems with SAP Deployment Automation Framework.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind utilise une topologie réseau hub-and-spoke et prévoit de déployer ses systèmes SAP de développement, d'assurance qualité et de production avec SAP Deployment Automation Framework.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A single control plane can manage the deployments of all three environments.
        fr: |
          Un seul plan de contrôle peut gérer les déploiements des trois environnements.
    - id: s2
      text:
        en: |
          Each SAP system, identified by its SID, is deployed into its own dedicated resource group.
        fr: |
          Chaque système SAP, identifié par son SID, est déployé dans son propre groupe de ressources dédié.
    - id: s3
      text:
        en: |
          The workload zones are typically deployed in the hub subscription, and the control plane in a spoke subscription.
        fr: |
          Les zones de charge de travail sont généralement déployées dans l'abonnement hub, et le plan de contrôle dans un abonnement spoke.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      A single control plane is typically used to manage multiple SAP deployments. Each SAP system is deployed into a dedicated resource group and uses the services of its workload zone. It is the reverse for the topology: the control plane is typically a regional resource in the hub subscription, and workload zones are deployed as spokes, ideally each with its own deployment credential.
    fr: |
      Un seul plan de contrôle sert généralement à gérer plusieurs déploiements SAP. Chaque système SAP est déployé dans un groupe de ressources dédié et utilise les services de sa zone de charge de travail. Pour la topologie, c'est l'inverse : le plan de contrôle est généralement une ressource régionale de l'abonnement hub, et les zones de charge de travail sont déployées comme spokes, idéalement chacune avec ses propres informations d'identification de déploiement.
references:
  - title: About SAP Deployment Automation Framework
    url: https://learn.microsoft.com/en-us/azure/sap/automation/deployment-framework
