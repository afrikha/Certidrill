id: az120-2c-cache-hana-shared
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso deploys SAP HANA on a Standard_M64s virtual machine. The **/hana/shared** volume is a P30 Premium SSD disk.

    You need to configure host caching for the /hana/shared disk according to Microsoft guidance for SAP HANA.

    Which host caching setting should you use?
  fr: |
    Contoso déploie SAP HANA sur une machine virtuelle Standard_M64s. Le volume **/hana/shared** est un disque SSD Premium P30.

    Vous devez configurer la mise en cache de l'hôte du disque /hana/shared conformément aux recommandations de Microsoft pour SAP HANA.

    Quel paramètre de mise en cache de l'hôte devez-vous utiliser ?
body:
  options:
    - { id: a, text: None }
    - { id: b, text: ReadOnly }
    - { id: c, text: ReadWrite }
    - { id: d, text: { en: "None + Write Accelerator", fr: "None + Accélérateur d'écriture" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For Premium SSD, Microsoft recommends read caching for /hana/shared. /hana/data uses None or read caching, and /hana/log uses None, with Write Accelerator on M-series VMs.
    fr: |
      Pour le SSD Premium, Microsoft recommande la mise en cache en lecture pour /hana/shared. /hana/data utilise None ou la mise en cache en lecture, et /hana/log utilise None, avec l'Accélérateur d'écriture sur les machines virtuelles de la série M.
  options:
    a: { en: "None is the recommendation for /hana/log; /hana/shared benefits from read caching.", fr: "None est la recommandation pour /hana/log ; /hana/shared tire parti de la mise en cache en lecture." }
    c: { en: "ReadWrite caching isn't recommended for HANA volumes because cached writes can be lost if the VM fails.", fr: "La mise en cache ReadWrite n'est pas recommandée pour les volumes HANA, car des écritures en cache peuvent être perdues en cas de défaillance de la machine virtuelle." }
    d: { en: "Write Accelerator is meant for the /hana/log volume only.", fr: "L'Accélérateur d'écriture est destiné uniquement au volume /hana/log." }
references:
  - title: SAP HANA Azure virtual machine Premium SSD storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-premium-ssd-v1
