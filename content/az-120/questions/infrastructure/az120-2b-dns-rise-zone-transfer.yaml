id: az120-2b-dns-rise-zone-transfer
objective: "2.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam is moving SAP S/4HANA to SAP RISE. The RISE virtual network, in SAP's Azure tenant, is peered with Fabrikam's hub virtual network. Fabrikam delegated the subdomain **ecs.fabrikam.com** to SAP, and the SAP DNS servers in the RISE virtual network hold the master copy of that zone.

    Fabrikam's Azure VMs and on-premises clients use Active Directory DNS servers that run as VMs in the hub. The RISE DNS records must be replicated into Fabrikam's DNS infrastructure.

    What should you recommend?
  fr: |
    Fabrikam migre SAP S/4HANA vers SAP RISE. Le réseau virtuel RISE, dans le locataire Azure de SAP, est relié par peering au réseau virtuel hub de Fabrikam. Fabrikam a délégué le sous-domaine **ecs.fabrikam.com** à SAP, et les serveurs DNS SAP du réseau virtuel RISE détiennent la copie maître de cette zone.

    Les machines virtuelles Azure et les clients locaux de Fabrikam utilisent des serveurs DNS Active Directory exécutés sur des machines virtuelles du hub. Les enregistrements DNS RISE doivent être répliqués dans l'infrastructure DNS de Fabrikam.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Create an Azure private DNS zone named ecs.fabrikam.com and configure it to receive zone transfers from the SAP DNS servers.", fr: "Créer une zone DNS privée Azure nommée ecs.fabrikam.com et la configurer pour recevoir les transferts de zone des serveurs DNS SAP." }
    - id: b
      text: { en: "Configure the hub DNS servers to host a secondary copy of ecs.fabrikam.com that is replicated by zone transfer from the SAP DNS servers.", fr: "Configurer les serveurs DNS du hub pour héberger une copie secondaire de ecs.fabrikam.com répliquée par transfert de zone depuis les serveurs DNS SAP." }
    - id: c
      text: { en: "Link the RISE virtual network to the Azure private DNS zones of Fabrikam with autoregistration enabled.", fr: "Lier le réseau virtuel RISE aux zones DNS privées Azure de Fabrikam avec l'inscription automatique activée." }
    - id: d
      text: { en: "Host ecs.fabrikam.com in an Azure public DNS zone and delegate it from fabrikam.com.", fr: "Héberger ecs.fabrikam.com dans une zone DNS publique Azure et la déléguer depuis fabrikam.com." }
answer: { optionId: b }
explanation:
  correct:
    en: "In the RISE DNS integration design, SAP's DNS servers are master for the delegated zone, and zone transfer to the customer's DNS servers (such as AD DS or BIND in the hub) is the primary replication method. A DNS forwarder to the SAP servers is an option for resolution, but it doesn't replicate records."
    fr: "Dans la conception d'intégration DNS de RISE, les serveurs DNS de SAP sont maîtres pour la zone déléguée, et le transfert de zone vers les serveurs DNS du client (par exemple AD DS ou BIND dans le hub) est la méthode de réplication principale. Un redirecteur DNS vers les serveurs SAP est possible pour la résolution, mais il ne réplique pas les enregistrements."
  options:
    a:
      en: "Azure private DNS zones and Azure-provided DNS don't support zone transfer, so they can't accept replication from the RISE DNS servers."
      fr: "Les zones DNS privées Azure et le DNS fourni par Azure ne prennent pas en charge le transfert de zone : ils ne peuvent pas recevoir la réplication des serveurs DNS RISE."
    c:
      en: "The RISE network is managed by SAP in another tenant and uses custom DNS; autoregistration wouldn't replicate the SAP-managed zone."
      fr: "Le réseau RISE est géré par SAP dans un autre locataire et utilise un DNS personnalisé ; l'inscription automatique ne répliquerait pas la zone gérée par SAP."
    d:
      en: "A public zone would expose private SAP host names, and SAP typically doesn't support external DNS providers for the delegated zone."
      fr: "Une zone publique exposerait des noms d'hôte SAP privés, et SAP ne prend généralement pas en charge les fournisseurs DNS externes pour la zone déléguée."
references:
  - title: Network connectivity options in Azure with SAP RISE
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
