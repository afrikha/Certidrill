id: az120-sr1-hana-log-1
objective: "2.3.6"
type: series_yesno
series: az120-sr1-hana-log
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |-
    You enable Write Accelerator on the /hana/data disks.
  fr: |-
    Vous activez l'Accélérateur d'écriture sur les disques de /hana/data.
body:
  solution:
    en: |-
      You shut down HDB1, enable **Write Accelerator** on each of the four **/hana/data** disks, keep the /hana/log disks unchanged, and start HDB1.
    fr: |-
      Vous arrêtez HDB1, activez l'**Accélérateur d'écriture** sur chacun des quatre disques de **/hana/data**, conservez les disques de /hana/log sans modification et démarrez HDB1.
answer: { value: false }
explanation:
  correct:
    en: |-
      Write Accelerator is designed for DBMS log volumes and, for SAP HANA, is supported for the /hana/log volume only; it shouldn't be used for data volumes. The /hana/log disks, whose latency fails the KPIs, stay on Premium SSD without Write Accelerator, which is mandatory for /hana/log on Premium SSD with M-series VMs.
    fr: |-
      L'Accélérateur d'écriture est conçu pour les volumes de journaux des SGBD et, pour SAP HANA, il est pris en charge uniquement pour le volume /hana/log ; il ne doit pas être utilisé pour les volumes de données. Les disques de /hana/log, dont la latence ne respecte pas les KPI, restent en SSD Premium sans Accélérateur d'écriture, alors que celui-ci est obligatoire pour /hana/log sur SSD Premium avec les machines virtuelles de la série M.
references:
  - title: SAP HANA Azure virtual machine Premium SSD storage configurations
    url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-premium-ssd-v1
  - title: Enable Write Accelerator
    url: https://learn.microsoft.com/en-us/azure/virtual-machines/how-to-enable-write-accelerator
