id: az120-sr2-compute-commitment
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank runs the SAP application servers of its production landscape on 24 **Standard_E32ds_v5** VMs in the **West Europe** region. The VMs run 24 hours a day, and their total compute usage is stable. Woodgrove has a Microsoft Customer Agreement.

    During the next three years, Woodgrove plans to:

    - Move the application servers to a newer SAP-certified VM series.
    - Move half of the application servers to the **Sweden Central** region.

    You need to reduce the compute cost of the application servers by purchasing a three-year commitment. The discount must keep applying after both changes, without exchanging, refunding or purchasing commitments.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank exécute les serveurs d'applications SAP de son paysage de production sur 24 machines virtuelles **Standard_E32ds_v5** dans la région **West Europe**. Les machines virtuelles fonctionnent 24 heures sur 24 et leur consommation de calcul totale est stable. Woodgrove dispose d'un Contrat client Microsoft.

    Au cours des trois prochaines années, Woodgrove prévoit de :

    - Migrer les serveurs d'applications vers une série de machines virtuelles plus récente certifiée SAP.
    - Déplacer la moitié des serveurs d'applications vers la région **Sweden Central**.

    Vous devez réduire le coût de calcul des serveurs d'applications en achetant un engagement de trois ans. La remise doit continuer de s'appliquer après ces deux changements, sans échanger, rembourser ni acheter d'engagements.
