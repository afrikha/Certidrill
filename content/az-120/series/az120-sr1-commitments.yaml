id: az120-sr1-commitments
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware, Inc. runs its SAP landscape on Azure virtual machines in a single subscription:

    - **Production**: the SAP HANA database VMs and the SAP application server VMs run 24 hours a day in the West Europe region. Their VM sizes and region won't change for the next three years.
    - **Non-production**: the development and quality assurance SAP systems run on VMs of several series in West Europe. Next year, Litware will move these systems to the Sweden Central region and resize them to newer VM series.

    You need to recommend a commitment-based discount strategy for the VMs. The solution must meet the following requirements:

    - Maximize the savings on the production VMs.
    - The discount on the non-production VMs must keep applying after the region move and the resizing, without exchanging, canceling or modifying any commitment.
    - Both commitments must have a three-year term.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware, Inc. exécute son paysage SAP sur des machines virtuelles Azure dans un seul abonnement :

    - **Production** : les machines virtuelles de base de données SAP HANA et les machines virtuelles de serveur d'applications SAP s'exécutent 24 heures sur 24 dans la région West Europe. Leurs tailles et leur région ne changeront pas pendant les trois prochaines années.
    - **Hors production** : les systèmes SAP de développement et d'assurance qualité s'exécutent sur des machines virtuelles de plusieurs séries dans West Europe. L'année prochaine, Litware déplacera ces systèmes vers la région Sweden Central et les redimensionnera vers des séries de machines virtuelles plus récentes.

    Vous devez recommander une stratégie de remise fondée sur des engagements pour les machines virtuelles. La solution doit répondre aux exigences suivantes :

    - Maximiser les économies sur les machines virtuelles de production.
    - La remise sur les machines virtuelles hors production doit continuer à s'appliquer après le déplacement de région et le redimensionnement, sans échange, annulation ni modification d'un engagement.
    - Les deux engagements doivent avoir une durée de trois ans.
