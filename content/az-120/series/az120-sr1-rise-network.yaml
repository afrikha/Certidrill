id: az120-sr1-rise-network
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso, Ltd. has an Azure subscription that contains a virtual network named **Hub1** in the West Europe region. Hub1 contains an ExpressRoute virtual network gateway that connects Hub1 to the on-premises network, interface servers that exchange data with SAP, and two VMs that run Active Directory Domain Services (AD DS) and act as the DNS servers for Contoso.

    Contoso signs a RISE with SAP contract. SAP deploys the Contoso S/4HANA landscape in an SAP-managed virtual network in West Europe and runs its own DNS servers in that virtual network. Contoso delegates the DNS zone **ecs.contoso.com** to SAP for the RISE hosts.

    You need to design the connectivity to the RISE landscape. The solution must meet the following requirements:

    - On-premises users and the interface servers in Hub1 must reach the RISE systems over private IP addresses only.
    - On-premises traffic must use the existing ExpressRoute circuit of Contoso.
    - Network latency between Hub1 and the RISE systems must be minimized.
    - On-premises clients and the VMs in Hub1 must resolve the host names in ecs.contoso.com.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso, Ltd. dispose d'un abonnement Azure qui contient un réseau virtuel nommé **Hub1** dans la région West Europe. Hub1 contient une passerelle de réseau virtuel ExpressRoute qui connecte Hub1 au réseau local, des serveurs d'interface qui échangent des données avec SAP, et deux machines virtuelles qui exécutent Active Directory Domain Services (AD DS) et servent de serveurs DNS pour Contoso.

    Contoso signe un contrat RISE with SAP. SAP déploie le paysage S/4HANA de Contoso dans un réseau virtuel géré par SAP dans West Europe et exécute ses propres serveurs DNS dans ce réseau virtuel. Contoso délègue la zone DNS **ecs.contoso.com** à SAP pour les hôtes RISE.

    Vous devez concevoir la connectivité vers le paysage RISE. La solution doit répondre aux exigences suivantes :

    - Les utilisateurs locaux et les serveurs d'interface de Hub1 doivent atteindre les systèmes RISE uniquement par des adresses IP privées.
    - Le trafic local doit utiliser le circuit ExpressRoute existant de Contoso.
    - La latence réseau entre Hub1 et les systèmes RISE doit être réduite au minimum.
    - Les clients locaux et les machines virtuelles de Hub1 doivent résoudre les noms d'hôte de ecs.contoso.com.
