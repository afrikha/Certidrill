id: az120-sr1-hana-log
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam, Inc. runs a production SAP HANA scale-up database on an SAP HANA-certified **Standard_M96ds_2_v3** virtual machine named **HDB1**. HDB1 is deployed in availability zone 1 of the West Europe region.

    The HANA volumes of HDB1 are configured as follows:

    - **/hana/data**: four Premium SSD disks striped by using LVM, host caching set to ReadOnly.
    - **/hana/log**: three Premium SSD disks striped by using LVM, host caching set to None, Write Accelerator not enabled.

    An SAP HANA hardware and cloud measurement tools (HCMT) run shows that the write latency of /hana/log doesn't meet the SAP HANA storage KPIs.

    You need to ensure that the storage of HDB1 meets the SAP HANA storage KPIs for production in a configuration that is supported for M-series VMs. A planned downtime of HDB1 is allowed.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam, Inc. exécute une base de données SAP HANA scale-up de production sur une machine virtuelle **Standard_M96ds_2_v3** certifiée SAP HANA nommée **HDB1**. HDB1 est déployée dans la zone de disponibilité 1 de la région West Europe.

    Les volumes HANA de HDB1 sont configurés comme suit :

    - **/hana/data** : quatre disques SSD Premium entrelacés avec LVM, mise en cache de l'hôte définie sur ReadOnly.
    - **/hana/log** : trois disques SSD Premium entrelacés avec LVM, mise en cache de l'hôte définie sur None, Accélérateur d'écriture non activé.

    Une exécution de SAP HANA hardware and cloud measurement tools (HCMT) montre que la latence d'écriture de /hana/log ne respecte pas les KPI de stockage SAP HANA.

    Vous devez vous assurer que le stockage de HDB1 respecte les KPI de stockage SAP HANA pour la production, dans une configuration prise en charge pour les machines virtuelles de la série M. Une interruption planifiée de HDB1 est autorisée.
