id: az120-sr2-dr-region
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum Corporation runs an SAP S/4HANA production system on SUSE Linux Enterprise Server VMs in the **West Europe** region. The system contains:

    - Two SAP Web Dispatcher VMs
    - Four SAP application server VMs
    - An ASCS/ERS Pacemaker cluster of two VMs
    - **/sapmnt** and **/usr/sap/trans** on NFS volumes of Azure NetApp Files
    - An SAP HANA scale-up high availability pair that uses HANA System Replication (HSR) in synchronous mode across two availability zones

    You need to design a disaster recovery solution in the **North Europe** region. The solution must meet the following requirements:

    - The copy of the database in North Europe must be transactionally consistent.
    - Replication to North Europe must not increase the commit time of the production database.
    - The SAP shared directories must be available in North Europe after a failover.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum Corporation exécute un système de production SAP S/4HANA sur des machines virtuelles SUSE Linux Enterprise Server dans la région **West Europe**. Le système comprend :

    - Deux machines virtuelles SAP Web Dispatcher
    - Quatre machines virtuelles de serveur d'applications SAP
    - Un cluster Pacemaker ASCS/ERS de deux machines virtuelles
    - **/sapmnt** et **/usr/sap/trans** sur des volumes NFS d'Azure NetApp Files
    - Une paire haute disponibilité SAP HANA scale-up qui utilise HANA System Replication (HSR) en mode synchrone entre deux zones de disponibilité

    Vous devez concevoir une solution de reprise d'activité dans la région **North Europe**. La solution doit répondre aux exigences suivantes :

    - La copie de la base de données dans North Europe doit être cohérente sur le plan transactionnel.
    - La réplication vers North Europe ne doit pas augmenter le temps de validation (commit) de la base de données de production.
    - Les répertoires partagés SAP doivent être disponibles dans North Europe après un basculement.
