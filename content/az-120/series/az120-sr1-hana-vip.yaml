id: az120-sr1-hana-vip
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys runs SAP HANA scale-up with HANA System Replication on two SUSE Linux Enterprise Server (SLES) for SAP Applications virtual machines named **hana1** (availability zone 1) and **hana2** (availability zone 2). The HANA instance number is **03**. Both VMs are in a subnet named **db-subnet** of a virtual network named **VNet1**, have no public IP addresses, and are members of a Pacemaker cluster that uses SAPHanaSR to manage the takeover.

    The SAP application servers are in another subnet of VNet1. They must connect to the current HANA primary through a single virtual IP address that follows the primary after a takeover. The load-balancing rule must forward all the ports used by HANA without listing them one by one.

    You need to implement load balancing for the HANA cluster.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys exécute SAP HANA scale-up avec HANA System Replication sur deux machines virtuelles SUSE Linux Enterprise Server (SLES) for SAP Applications nommées **hana1** (zone de disponibilité 1) et **hana2** (zone de disponibilité 2). Le numéro d'instance HANA est **03**. Les deux machines virtuelles se trouvent dans un sous-réseau nommé **db-subnet** d'un réseau virtuel nommé **VNet1**, n'ont pas d'adresse IP publique et sont membres d'un cluster Pacemaker qui utilise SAPHanaSR pour gérer la reprise (takeover).

    Les serveurs d'applications SAP se trouvent dans un autre sous-réseau de VNet1. Ils doivent se connecter au primaire HANA actuel par une seule adresse IP virtuelle qui suit le primaire après une reprise. La règle d'équilibrage de charge doit transférer tous les ports utilisés par HANA sans les énumérer un par un.

    Vous devez implémenter l'équilibrage de charge pour le cluster HANA.
