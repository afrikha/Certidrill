id: az120-sr2-acss-weekend-stop
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has a non-production SAP S/4HANA system named **QAS**. QAS is a distributed non-high-availability deployment on SUSE Linux Enterprise Server: one ASCS VM, two application server VMs and one SAP HANA VM. Each VM hosts the instances of QAS only.

    QAS is registered in Azure Center for SAP solutions as a Virtual Instance for SAP solutions (VIS) that has a user-assigned managed identity. You have the Azure Center for SAP solutions administrator role on the VIS.

    Every Friday evening, you need to stop QAS and deallocate all four VMs so that their compute is not billed during the weekend. The SAP instances and the HANA database must be stopped by Azure Center for SAP solutions before their VMs are shut down.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'un système SAP S/4HANA hors production nommé **QAS**. QAS est un déploiement distribué sans haute disponibilité sur SUSE Linux Enterprise Server : une machine virtuelle ASCS, deux machines virtuelles de serveur d'applications et une machine virtuelle SAP HANA. Chaque machine virtuelle héberge uniquement les instances de QAS.

    QAS est inscrit dans le Centre Azure pour les solutions SAP en tant qu'instance virtuelle pour solutions SAP (VIS) dotée d'une identité managée affectée par l'utilisateur. Vous disposez du rôle Azure Center for SAP solutions administrator sur la VIS.

    Chaque vendredi soir, vous devez arrêter QAS et libérer les quatre machines virtuelles pour que leur calcul ne soit pas facturé pendant le week-end. Les instances SAP et la base de données HANA doivent être arrêtées par le Centre Azure pour les solutions SAP avant l'arrêt de leurs machines virtuelles.
