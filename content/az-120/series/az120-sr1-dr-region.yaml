id: az120-sr1-dr-region
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank runs a production SAP S/4HANA system in the West Europe region. The system contains the following components:

    - Four SAP application server VMs.
    - An ASCS/ERS Pacemaker cluster of two VMs.
    - SAP HANA scale-up on two VMs that use synchronous HANA System Replication across availability zones.
    - The **/sapmnt** and **/usr/sap/trans** file systems on NFS volumes of Azure NetApp Files.

    You need to design a disaster recovery solution in the North Europe region. The solution must meet the following requirements:

    - Every component of the SAP system must be recoverable in North Europe if West Europe becomes unavailable.
    - The HANA database copy in North Europe must be consistent at the database level.
    - Administrative effort to recover the application tier VMs must be minimized.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank exécute un système SAP S/4HANA de production dans la région West Europe. Le système contient les composants suivants :

    - Quatre machines virtuelles de serveur d'applications SAP.
    - Un cluster Pacemaker ASCS/ERS de deux machines virtuelles.
    - SAP HANA scale-up sur deux machines virtuelles qui utilisent HANA System Replication synchrone entre zones de disponibilité.
    - Les systèmes de fichiers **/sapmnt** et **/usr/sap/trans** sur des volumes NFS Azure NetApp Files.

    Vous devez concevoir une solution de reprise d'activité dans la région North Europe. La solution doit répondre aux exigences suivantes :

    - Chaque composant du système SAP doit pouvoir être récupéré dans North Europe si West Europe devient indisponible.
    - La copie de la base de données HANA dans North Europe doit être cohérente au niveau de la base de données.
    - L'effort d'administration pour récupérer les machines virtuelles de la couche application doit être réduit au minimum.
