id: az120-sr2-app-db-traffic
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam, Inc. is deploying an SAP S/4HANA production system named **PRD** to a virtual network named **VNet1** in the **North Europe** region. VNet1 contains two subnets:

    - **AppSubnet**: the ASCS instance and four SAP application server VMs
    - **DbSubnet**: a single SAP HANA scale-up VM, without a load balancer

    VNet1 is peered with a hub virtual network that contains Azure Firewall, which inspects the traffic from on-premises.

    The security team requires that, inside VNet1, only the SAP application server VMs can connect to the HANA VM, and only on the HANA SQL ports. All other traffic from VNet1 to the HANA VM must be blocked. The configuration must be supported for SAP workloads on Azure.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam, Inc. déploie un système de production SAP S/4HANA nommé **PRD** dans un réseau virtuel nommé **VNet1**, dans la région **North Europe**. VNet1 contient deux sous-réseaux :

    - **AppSubnet** : l'instance ASCS et quatre machines virtuelles de serveur d'applications SAP
    - **DbSubnet** : une seule machine virtuelle SAP HANA scale-up, sans équilibreur de charge

    VNet1 est connecté par peering à un réseau virtuel hub qui contient Azure Firewall, lequel inspecte le trafic en provenance du site local.

    L'équipe de sécurité exige que, dans VNet1, seules les machines virtuelles de serveur d'applications SAP puissent se connecter à la machine virtuelle HANA, et uniquement sur les ports SQL de HANA. Tout autre trafic de VNet1 vers la machine virtuelle HANA doit être bloqué. La configuration doit être prise en charge pour les charges de travail SAP sur Azure.
