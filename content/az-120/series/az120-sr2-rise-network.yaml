id: az120-sr2-rise-network
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Contoso, Ltd. is moving its SAP S/4HANA landscape to SAP RISE. SAP will run the systems in an SAP-managed virtual network in SAP's own Azure tenant, in the **West Europe** region.

    Contoso has a hub virtual network named **Hub1** in its own tenant, also in West Europe. Hub1 contains an ExpressRoute gateway that connects to the on-premises datacenter, and a subnet of integration VMs that call S/4HANA over RFC and HTTPS.

    You need to design the connectivity to the SAP RISE virtual network. The solution must meet the following requirements:

    - The integration VMs in Hub1 must reach SAP RISE with the lowest possible network latency and the highest possible throughput.
    - On-premises users must reach SAP RISE through the existing ExpressRoute circuit and the gateway in Hub1.
    - All traffic must use private IP addresses.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Contoso, Ltd. migre son paysage SAP S/4HANA vers SAP RISE. SAP exécutera les systèmes dans un réseau virtuel géré par SAP, dans son propre locataire Azure, dans la région **West Europe**.

    Contoso dispose d'un réseau virtuel hub nommé **Hub1** dans son propre locataire, également dans West Europe. Hub1 contient une passerelle ExpressRoute connectée au centre de données local, ainsi qu'un sous-réseau de machines virtuelles d'intégration qui appellent S/4HANA en RFC et en HTTPS.

    Vous devez concevoir la connectivité vers le réseau virtuel SAP RISE. La solution doit répondre aux exigences suivantes :

    - Les machines virtuelles d'intégration de Hub1 doivent atteindre SAP RISE avec la latence réseau la plus faible possible et le débit le plus élevé possible.
    - Les utilisateurs locaux doivent atteindre SAP RISE via le circuit ExpressRoute existant et la passerelle de Hub1.
    - Tout le trafic doit utiliser des adresses IP privées.
