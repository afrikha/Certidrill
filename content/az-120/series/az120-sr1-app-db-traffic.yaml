id: az120-sr1-app-db-traffic
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Adatum Corporation is deploying SAP S/4HANA on Azure virtual machines in the West Europe region. The SAP application servers and the SAP HANA database VMs are deployed in a virtual network named **VNet1**. VNet1 is peered with a hub virtual network that contains an Azure Firewall instance used for internet and on-premises traffic.

    The security team issues the following requirements:

    - The HANA VMs must accept inbound connections only from the SAP application servers on the HANA SQL ports and from the administration jump hosts on SSH.
    - The traffic between the SAP application layer and the HANA database layer must follow a configuration that SAP and Microsoft support.
    - The solution must not add network latency between the application servers and the HANA VMs.

    You need to design the network security for the SAP application and database layers.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Adatum Corporation déploie SAP S/4HANA sur des machines virtuelles Azure dans la région West Europe. Les serveurs d'applications SAP et les machines virtuelles de base de données SAP HANA sont déployés dans un réseau virtuel nommé **VNet1**. VNet1 est connecté par peering à un réseau virtuel hub qui contient une instance Pare-feu Azure utilisée pour le trafic Internet et local.

    L'équipe de sécurité émet les exigences suivantes :

    - Les machines virtuelles HANA doivent accepter les connexions entrantes uniquement depuis les serveurs d'applications SAP sur les ports SQL HANA et depuis les hôtes de rebond d'administration en SSH.
    - Le trafic entre la couche application SAP et la couche base de données HANA doit suivre une configuration prise en charge par SAP et Microsoft.
    - La solution ne doit pas ajouter de latence réseau entre les serveurs d'applications et les machines virtuelles HANA.

    Vous devez concevoir la sécurité réseau des couches application et base de données SAP.
