id: az120-cs3c-trey-research
status: draft
title:
  en: Trey Research
  fr: Trey Research
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Trey Research is a pharmaceutical company that develops and manufactures generic drugs. Its head office and its datacenter are in Amsterdam.

        Trey Research plans to move its production SAP ERP system to the Azure West Europe region and to use North Europe as the disaster recovery region. The company doesn't plan to change the SAP release, the operating system or the database platform during the move.
      fr: |
        Trey Research est une entreprise pharmaceutique qui développe et fabrique des médicaments génériques. Son siège et son centre de données sont à Amsterdam.

        Trey Research prévoit de déplacer son système SAP ERP de production vers la région Azure West Europe et d'utiliser North Europe comme région de reprise d'activité. L'entreprise ne prévoit de changer ni la version SAP, ni le système d'exploitation, ni la plateforme de base de données pendant le déplacement.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        The production system **TRP** runs SAP ERP 6.0 EHP8 (SAP NetWeaver ABAP) on Windows Server 2022. The database runs on SQL Server 2022 Enterprise in an Always On availability group with two replicas in the Amsterdam datacenter. The database is 6 TB.

        The Amsterdam datacenter is connected to West Europe and North Europe through ExpressRoute.
      fr: |
        Le système de production **TRP** exécute SAP ERP 6.0 EHP8 (SAP NetWeaver ABAP) sur Windows Server 2022. La base de données s'exécute sur SQL Server 2022 Enterprise dans un groupe de disponibilité Always On à deux réplicas dans le centre de données d'Amsterdam. La base de données fait 6 To.

        Le centre de données d'Amsterdam est connecté à West Europe et à North Europe par ExpressRoute.
  - key: design
    title: { en: "Planned environment", fr: "Environnement prévu" }
    body:
      en: |
        All the VMs of TRP will be in one virtual network named **VNet-SAP** in West Europe, in the resource group **rg-trp-network**. The VMs will be in the resource group **rg-trp-compute**.

        | Component | Configuration |
        | --- | --- |
        | SQL-PRD1, SQL-PRD2 | SQL Server 2022 on Windows Server 2022, Always On availability group in synchronous-commit mode, zones 1 and 2, same subnet |
        | ASCS-PRD1, ASCS-PRD2 | ASCS and ERS2 instances in a Windows Server failover cluster (WSFC), zones 1 and 2, Azure shared disk Premium SSD with ZRS and maxShares set to 2 |
        | APP-PRD1 to APP-PRD4 | SAP application servers, zones 1 and 2 |
        | Transport share | SMB share on Azure Files (premium) for the SAP transport directory |
      fr: |
        Toutes les machines virtuelles de TRP seront dans un réseau virtuel nommé **VNet-SAP** dans West Europe, dans le groupe de ressources **rg-trp-network**. Les machines virtuelles seront dans le groupe de ressources **rg-trp-compute**.

        | Composant | Configuration |
        | --- | --- |
        | SQL-PRD1, SQL-PRD2 | SQL Server 2022 sur Windows Server 2022, groupe de disponibilité Always On en mode de validation synchrone, zones 1 et 2, même sous-réseau |
        | ASCS-PRD1, ASCS-PRD2 | Instances ASCS et ERS2 dans un cluster de basculement Windows Server (WSFC), zones 1 et 2, disque partagé Azure SSD Premium avec ZRS et maxShares défini sur 2 |
        | APP-PRD1 à APP-PRD4 | Serveurs d'applications SAP, zones 1 et 2 |
        | Partage de transport | Partage SMB sur Azure Files (premium) pour le répertoire de transport SAP |
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Trey Research identifies the following requirements:

        1. **Migration.** The on-premises database remains the production database until the cutover. During the cutover downtime, no full database export, import, backup or restore may run.
        2. **Database high availability.** The SAP application servers must connect to the availability group through a listener. No Azure load balancer may be deployed or maintained for the database tier.
        3. **Disaster recovery.** Every component of TRP must be recoverable in North Europe. The database copy in North Europe must be transactionally consistent.
        4. **Backup.** Azure Backup must protect the SQL Server databases. The database must be recoverable to a point in time no more than 15 minutes old, and log backups must be kept for 30 days.
        5. **Operations.** TRP must be registered in Azure Center for SAP solutions as a Virtual Instance for SAP solutions (VIS). All identities must follow the principle of least privilege.
      fr: |
        Trey Research a défini les exigences suivantes :

        1. **Migration.** La base de données locale reste la base de production jusqu'à la bascule. Pendant l'interruption de la bascule, aucun export, import, sauvegarde ni restauration complets de la base de données ne doit s'exécuter.
        2. **Haute disponibilité de la base de données.** Les serveurs d'applications SAP doivent se connecter au groupe de disponibilité par un écouteur. Aucun équilibreur de charge Azure ne doit être déployé ni maintenu pour la couche de base de données.
        3. **Reprise d'activité.** Chaque composant de TRP doit pouvoir être récupéré dans North Europe. La copie de la base de données dans North Europe doit être cohérente sur le plan transactionnel.
        4. **Sauvegarde.** Sauvegarde Azure doit protéger les bases de données SQL Server. La base de données doit pouvoir être récupérée à un point dans le temps datant de 15 minutes au plus, et les sauvegardes de journaux doivent être conservées 30 jours.
        5. **Exploitation.** TRP doit être inscrit dans le Centre Azure pour les solutions SAP en tant que Virtual Instance for SAP solutions (VIS). Toutes les identités doivent respecter le principe du moindre privilège.
