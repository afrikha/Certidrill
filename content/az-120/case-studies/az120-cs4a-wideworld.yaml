id: az120-cs4a-wideworld
status: draft
title:
  en: Wide World Importers
  fr: Wide World Importers
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Wide World Importers is a consumer goods distributor that operates 14 warehouses in Europe. The head office is in Rotterdam.

        Wide World Importers is replacing its on-premises SAP ECC system with SAP S/4HANA Cloud, private edition, under a RISE with SAP contract. SAP will host and operate the new system on Azure in the West Europe region, in a subscription and a Microsoft Entra tenant that belong to SAP. Wide World Importers keeps its own Azure environment for connectivity, integration and security services.
      fr: |
        Wide World Importers est un distributeur de biens de consommation qui exploite 14 entrepôts en Europe. Le siège est à Rotterdam.

        Wide World Importers remplace son système SAP ECC local par SAP S/4HANA Cloud, private edition, dans le cadre d'un contrat RISE with SAP. SAP hébergera et exploitera le nouveau système sur Azure dans la région West Europe, dans un abonnement et un locataire Microsoft Entra qui appartiennent à SAP. Wide World Importers conserve son propre environnement Azure pour les services de connectivité, d'intégration et de sécurité.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Wide World Importers has a Microsoft Entra tenant named **wideworldimporters.com** that is synchronized with its on-premises Active Directory Domain Services (AD DS) domain.

        The Azure environment of Wide World Importers in West Europe contains the following resources:

        | Resource | Subscription | Configuration |
        | --- | --- | --- |
        | VNET-HUB-WE | Sub-Connectivity | Hub virtual network, 10.20.0.0/22. Contains Azure Firewall, a non-zone-redundant ExpressRoute virtual network gateway, and two domain controllers named DC1 and DC2 that host AD-integrated DNS zones |
        | VNET-INT-WE | Sub-Integration | Spoke virtual network, 10.20.8.0/24, peered with VNET-HUB-WE. Its custom DNS servers are DC1 and DC2 |
        | VM-WMS1, VM-WMS2 | Sub-Integration | Windows Server VMs in VNET-INT-WE that run a third-party warehouse management system (WMS). The WMS calls SAP by using RFC |

        On-premises connectivity uses one ExpressRoute circuit with standard resiliency at the Amsterdam peering location.

        SAP has communicated the following information about the RISE environment:

        - The SAP-managed virtual network uses the address space 10.30.0.0/22 in West Europe.
        - Two DNS servers that SAP manages will run in the SAP-managed virtual network.
      fr: |
        Wide World Importers dispose d'un locataire Microsoft Entra nommé **wideworldimporters.com** synchronisé avec son domaine Active Directory Domain Services (AD DS) local.

        L'environnement Azure de Wide World Importers dans la région West Europe contient les ressources suivantes :

        | Ressource | Abonnement | Configuration |
        | --- | --- | --- |
        | VNET-HUB-WE | Sub-Connectivity | Réseau virtuel hub, 10.20.0.0/22. Contient Azure Firewall, une passerelle de réseau virtuel ExpressRoute non redondante interzone et deux contrôleurs de domaine nommés DC1 et DC2 qui hébergent des zones DNS intégrées à AD |
        | VNET-INT-WE | Sub-Integration | Réseau virtuel spoke, 10.20.8.0/24, avec un peering vers VNET-HUB-WE. Ses serveurs DNS personnalisés sont DC1 et DC2 |
        | VM-WMS1, VM-WMS2 | Sub-Integration | Machines virtuelles Windows Server dans VNET-INT-WE qui exécutent un système de gestion d'entrepôt (WMS) tiers. Le WMS appelle SAP par RFC |

        La connectivité locale utilise un circuit ExpressRoute avec une résilience standard à l'emplacement de peering d'Amsterdam.

        SAP a communiqué les informations suivantes sur l'environnement RISE :

        - Le réseau virtuel géré par SAP utilise l'espace d'adressage 10.30.0.0/22 dans la région West Europe.
        - Deux serveurs DNS gérés par SAP s'exécuteront dans le réseau virtuel géré par SAP.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Network requirements**

        1. VM-WMS1, VM-WMS2 and the on-premises users must reach SAP S/4HANA by using private IP addresses only, with the lowest possible latency.
        2. On-premises traffic to SAP S/4HANA must use the existing on-premises connectivity of Wide World Importers, and the Azure Firewall rules of Wide World Importers must apply to that traffic.
        3. SAP host names will be registered in the DNS zone **sap.wideworldimporters.com**, and SAP will maintain the records of this zone. DC1 and DC2 must hold a copy of these records so that names still resolve when the SAP DNS servers are unreachable. Nobody at Wide World Importers must create SAP records manually.
        4. On-premises connectivity to Azure must survive a complete outage of the Amsterdam metropolitan area and the failure of one availability zone in West Europe.

        **Integration requirements**

        5. Every night, Azure Data Factory must copy SAP S/4HANA tables to an Azure Data Lake Storage account of Wide World Importers. The data must never transit through a public endpoint.

        **Identity and security requirements**

        6. Users must sign in to the SAP Fiori launchpad with their Microsoft Entra accounts (single sign-on).
        7. The security team must detect the execution of sensitive transactions and privilege escalations in SAP S/4HANA, and correlate them with Microsoft Entra sign-in events.

        **Operations requirements**

        8. The network team must be alerted when the round-trip time between the WMS VMs and the SAP S/4HANA application servers exceeds 5 ms, or when connectivity checks fail.
        9. Administrative effort must be minimized.
      fr: |
        **Exigences réseau**

        1. VM-WMS1, VM-WMS2 et les utilisateurs locaux doivent atteindre SAP S/4HANA uniquement par des adresses IP privées, avec la latence la plus faible possible.
        2. Le trafic local vers SAP S/4HANA doit utiliser la connectivité locale existante de Wide World Importers, et les règles Azure Firewall de Wide World Importers doivent s'appliquer à ce trafic.
        3. Les noms d'hôte SAP seront enregistrés dans la zone DNS **sap.wideworldimporters.com**, et SAP gérera les enregistrements de cette zone. DC1 et DC2 doivent détenir une copie de ces enregistrements pour que les noms soient encore résolus quand les serveurs DNS de SAP sont inaccessibles. Personne chez Wide World Importers ne doit créer d'enregistrements SAP manuellement.
        4. La connectivité locale vers Azure doit résister à une panne complète de l'agglomération d'Amsterdam et à la défaillance d'une zone de disponibilité de West Europe.

        **Exigences d'intégration**

        5. Chaque nuit, Azure Data Factory doit copier des tables SAP S/4HANA vers un compte Azure Data Lake Storage de Wide World Importers. Les données ne doivent jamais transiter par un point de terminaison public.

        **Exigences d'identité et de sécurité**

        6. Les utilisateurs doivent se connecter au SAP Fiori launchpad avec leur compte Microsoft Entra (authentification unique).
        7. L'équipe de sécurité doit détecter l'exécution de transactions sensibles et les élévations de privilèges dans SAP S/4HANA, et les corréler avec les événements de connexion Microsoft Entra.

        **Exigences d'exploitation**

        8. L'équipe réseau doit être alertée quand le temps d'aller-retour entre les machines virtuelles WMS et les serveurs d'applications SAP S/4HANA dépasse 5 ms, ou quand les vérifications de connectivité échouent.
        9. L'effort d'administration doit être réduit au minimum.
