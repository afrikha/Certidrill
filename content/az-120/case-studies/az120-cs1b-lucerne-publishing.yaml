id: az120-cs1b-lucerne-publishing
status: draft
title:
  en: Lucerne Publishing
  fr: Lucerne Publishing
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Lucerne Publishing publishes books, magazines and digital subscriptions in Switzerland, Germany and Austria. The head office is in Zurich.

        Lucerne Publishing will move its SAP ERP landscape from its Zurich datacenter to the Azure **Switzerland North** region. The SAP release, the database platform and the database operating system stay the same. The Linux team manages all Linux servers; it has standardized on Red Hat Enterprise Linux (RHEL) wherever the software vendor supports it.
      fr: |
        Lucerne Publishing publie des livres, des magazines et des abonnements numériques en Suisse, en Allemagne et en Autriche. Le siège est à Zurich.

        Lucerne Publishing va déplacer son paysage SAP ERP de son centre de données de Zurich vers la région Azure **Switzerland North**. La version SAP, la plateforme de base de données et le système d'exploitation de la base de données restent les mêmes. L'équipe Linux gère tous les serveurs Linux ; elle a standardisé Red Hat Enterprise Linux (RHEL) partout où l'éditeur du logiciel le prend en charge.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        The production system **LPP** runs SAP ERP 6.0 EHP8 on x86 servers in VMware.

        | Component | Current configuration |
        | --- | --- |
        | Database | Oracle Database 19c on Oracle Linux 8, 3 TB, file systems on LVM |
        | ASCS/ERS | Two Linux VMs in a Pacemaker cluster |
        | Application servers | Four Linux VMs (PAS and AAS) |

        Oracle Database is licensed per processor. The sizing study shows that the production database server needs 256 GiB of memory and up to 60,000 IOPS, but no more than eight vCPUs.
      fr: |
        Le système de production **LPP** exécute SAP ERP 6.0 EHP8 sur des serveurs x86 dans VMware.

        | Composant | Configuration actuelle |
        | --- | --- |
        | Base de données | Oracle Database 19c sur Oracle Linux 8, 3 To, systèmes de fichiers sur LVM |
        | ASCS/ERS | Deux machines virtuelles Linux dans un cluster Pacemaker |
        | Serveurs d'applications | Quatre machines virtuelles Linux (PAS et AAS) |

        Oracle Database est licencié par processeur. L'étude de dimensionnement montre que le serveur de base de données de production a besoin de 256 Gio de mémoire et de jusqu'à 60 000 IOPS, mais de huit processeurs virtuels au plus.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Platform**

        1. Every layer of LPP must run on a configuration that SAP and Microsoft support on Azure.
        2. The number of Oracle processor licenses must be minimized.
        3. The database storage must follow the Microsoft recommendations for Oracle on Azure for SAP.

        **High availability**

        4. The primary database VM will run in zone 1 and a standby database VM in zone 2. If zone 1 fails, the database must fail over to zone 2 automatically with no committed transaction lost.

        **Backup**

        5. Database backups must be stored in a Recovery Services vault and kept for 30 days. A database restore after a logical error must lose at most 30 minutes of data. The administrators must not write their own scripts to quiesce the database.

        **Operations**

        6. During the month-end closing, the administrators will temporarily resize the application server VMs to larger sizes.
      fr: |
        **Plateforme**

        1. Chaque couche de LPP doit s'exécuter sur une configuration que SAP et Microsoft prennent en charge sur Azure.
        2. Le nombre de licences de processeur Oracle doit être réduit au minimum.
        3. Le stockage de la base de données doit suivre les recommandations de Microsoft pour Oracle sur Azure pour SAP.

        **Haute disponibilité**

        4. La machine virtuelle de base de données primaire s'exécutera dans la zone 1 et une machine virtuelle de base de données de secours dans la zone 2. Si la zone 1 tombe en panne, la base de données doit basculer automatiquement vers la zone 2 sans perte de transaction validée.

        **Sauvegarde**

        5. Les sauvegardes de la base de données doivent être stockées dans un coffre Recovery Services et conservées 30 jours. Une restauration de la base de données après une erreur logique doit perdre au plus 30 minutes de données. Les administrateurs ne doivent pas écrire leurs propres scripts pour mettre la base de données au repos.

        **Exploitation**

        6. Pendant la clôture mensuelle, les administrateurs redimensionneront temporairement les machines virtuelles des serveurs d'applications vers des tailles plus grandes.
