id: az120-cs3b-humongous-insurance
status: draft
title:
  en: Humongous Insurance
  fr: Humongous Insurance
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Humongous Insurance is a property and casualty insurer with 3,200 employees in Belgium and the Netherlands. The head office and the datacenter are in Brussels.

        Humongous Insurance signed a RISE with SAP contract. SAP S/4HANA Cloud Private Edition will run in an Azure subscription and a Microsoft Entra tenant that SAP owns and operates, in the West Europe region. A cloud team of five engineers manages the Azure environment of Humongous Insurance.
      fr: |
        Humongous Insurance est un assureur de dommages qui compte 3 200 employés en Belgique et aux Pays-Bas. Le siège et le centre de données sont à Bruxelles.

        Humongous Insurance a signé un contrat RISE with SAP. SAP S/4HANA Cloud Private Edition s'exécutera dans un abonnement Azure et un locataire Microsoft Entra que SAP possède et exploite, dans la région West Europe. Une équipe cloud de cinq ingénieurs gère l'environnement Azure de Humongous Insurance.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Humongous Insurance has its own Microsoft Entra tenant, synchronized with an on-premises Active Directory domain, and the following resources in West Europe:

        | Resource | Configuration |
        | --- | --- |
        | VNet-Hub | Hub virtual network, 10.10.0.0/16, ExpressRoute gateway connected to the Brussels datacenter |
        | VNet-Data | Spoke virtual network peered with VNet-Hub, 10.20.0.0/16, private endpoint of the data lake storage account |
        | Name resolution | Azure private DNS zones and an Azure DNS Private Resolver in VNet-Hub; no DNS server VMs in Azure. On-premises DNS servers forward the Azure zones to the inbound endpoint of the resolver |
        | BOBJ1 to BOBJ4 | Windows VMs that run SAP BusinessObjects BI, 24 hours a day; no change of size, series or region is planned for the next three years |
        | DS1 to DS6 | Data science VMs that run continuously; next year, they will move to other VM series and to the Sweden Central region |

        SAP assigned the address space 10.30.0.0/22 to the RISE virtual network. SAP runs two DNS servers in the RISE virtual network that are authoritative for the zone **ecs.humongousinsurance.example**.
      fr: |
        Humongous Insurance dispose de son propre locataire Microsoft Entra, synchronisé avec un domaine Active Directory local, et des ressources suivantes dans West Europe :

        | Ressource | Configuration |
        | --- | --- |
        | VNet-Hub | Réseau virtuel hub, 10.10.0.0/16, passerelle ExpressRoute connectée au centre de données de Bruxelles |
        | VNet-Data | Réseau virtuel spoke en peering avec VNet-Hub, 10.20.0.0/16, point de terminaison privé du compte de stockage du lac de données |
        | Résolution de noms | Zones DNS privées Azure et un résolveur privé Azure DNS dans VNet-Hub ; aucune machine virtuelle de serveur DNS dans Azure. Les serveurs DNS locaux transfèrent les zones Azure vers le point de terminaison entrant du résolveur |
        | BOBJ1 à BOBJ4 | Machines virtuelles Windows qui exécutent SAP BusinessObjects BI 24 heures sur 24 ; aucun changement de taille, de série ni de région n'est prévu pour les trois prochaines années |
        | DS1 à DS6 | Machines virtuelles de science des données qui s'exécutent en continu ; l'an prochain, elles passeront à d'autres séries de machines virtuelles et à la région Sweden Central |

        SAP a attribué l'espace d'adressage 10.30.0.0/22 au réseau virtuel RISE. SAP exécute dans le réseau virtuel RISE deux serveurs DNS qui font autorité pour la zone **ecs.humongousinsurance.example**.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Humongous Insurance identifies the following requirements:

        1. **Connectivity.** VNet-Hub must connect to the RISE virtual network by using the method that Microsoft prefers for RISE. Users in Brussels must reach SAP S/4HANA through the existing ExpressRoute circuit, without any additional gateway in the RISE virtual network.
        2. **Name resolution.** Names in ecs.humongousinsurance.example must resolve from Azure and from on-premises. The records of the zone must be replicated to DNS servers that Humongous Insurance manages, so that resolution continues if the SAP DNS servers are unreachable.
        3. **Identity.** Users must sign in to SAP Fiori with their Microsoft Entra accounts by using single sign-on.
        4. **Security.** The security team must analyze the SAP application audit logs in Microsoft Sentinel.
        5. **Data integration.** Azure Data Factory pipelines must copy SAP S/4HANA data to the data lake. The connection between the integration runtime and SAP S/4HANA must use private IP addresses only.
        6. **Costs.** Compute costs of the VMs that Humongous Insurance runs must be minimized.
      fr: |
        Humongous Insurance a défini les exigences suivantes :

        1. **Connectivité.** VNet-Hub doit se connecter au réseau virtuel RISE avec la méthode que Microsoft privilégie pour RISE. Les utilisateurs de Bruxelles doivent atteindre SAP S/4HANA par le circuit ExpressRoute existant, sans aucune passerelle supplémentaire dans le réseau virtuel RISE.
        2. **Résolution de noms.** Les noms de ecs.humongousinsurance.example doivent être résolus depuis Azure et depuis l'environnement local. Les enregistrements de la zone doivent être répliqués vers des serveurs DNS gérés par Humongous Insurance, pour que la résolution continue si les serveurs DNS de SAP sont injoignables.
        3. **Identité.** Les utilisateurs doivent se connecter à SAP Fiori avec leur compte Microsoft Entra par authentification unique.
        4. **Sécurité.** L'équipe de sécurité doit analyser les journaux d'audit de l'application SAP dans Microsoft Sentinel.
        5. **Intégration des données.** Des pipelines Azure Data Factory doivent copier des données SAP S/4HANA vers le lac de données. La connexion entre le runtime d'intégration et SAP S/4HANA doit utiliser uniquement des adresses IP privées.
        6. **Coûts.** Les coûts de calcul des machines virtuelles exécutées par Humongous Insurance doivent être réduits au minimum.
