id: az120-cs1c-tailspin-toys
status: draft
title:
  en: Tailspin Toys
  fr: Tailspin Toys
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Tailspin Toys designs and manufactures toys and sells them through retailers and its online shop in the Nordic countries. The head office is in Stockholm.

        Tailspin Toys runs SAP S/4HANA and plans to rebuild its SAP landscape on Azure in the **Sweden Central** region, with **North Europe** as the disaster recovery region. A central platform team owns the Azure landing zones and the deployment tooling. The SAP Basis team performs system copies and refreshes.
      fr: |
        Tailspin Toys conçoit et fabrique des jouets qu'elle vend par l'intermédiaire de détaillants et de sa boutique en ligne dans les pays nordiques. Le siège est à Stockholm.

        Tailspin Toys exécute SAP S/4HANA et prévoit de reconstruire son paysage SAP sur Azure dans la région **Sweden Central**, avec **North Europe** comme région de reprise d'activité. Une équipe plateforme centrale possède les zones d'atterrissage Azure et les outils de déploiement. L'équipe SAP Basis effectue les copies et les actualisations de systèmes.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Azure hierarchy**

        The Microsoft Entra tenant of Tailspin Toys contains the management group hierarchy **Tailspin** > **Landing zones** > **SAP**. The SAP management group contains the subscriptions **Sub-SAP-PRD** and **Sub-SAP-NPRD**. New SAP subscriptions will be added to the SAP management group as the landscape grows. The platform team owns the management groups; the owners of the SAP subscriptions are the SAP project leads.

        **Deployment tooling**

        The platform team uses SAP Deployment Automation Framework (SDAF). The control plane (deployer and SAP library) is already deployed in the hub subscription, and the SAP installation media is already in the **sapbits** container of the SAP library storage account.

        **Identity**

        Tailspin Toys uses SAP Business Technology Platform (SAP BTP) applications that authenticate through an SAP Cloud Identity Services tenant. The Microsoft Entra tenant has Microsoft Entra ID P1 licenses. An enterprise application for SAP Cloud Identity Services exists, and the relevant users and groups are assigned to it with the **User** role.

        **System copies**

        The SAP Basis team uses SAP Landscape Management (LaMa) Enterprise Edition 3.0, which will run on an Azure VM named **lama01** in Sub-SAP-NPRD.
      fr: |
        **Hiérarchie Azure**

        Le locataire Microsoft Entra de Tailspin Toys contient la hiérarchie de groupes d'administration **Tailspin** > **Landing zones** > **SAP**. Le groupe d'administration SAP contient les abonnements **Sub-SAP-PRD** et **Sub-SAP-NPRD**. De nouveaux abonnements SAP seront ajoutés au groupe d'administration SAP à mesure que le paysage s'étendra. L'équipe plateforme possède les groupes d'administration ; les propriétaires des abonnements SAP sont les chefs de projet SAP.

        **Outils de déploiement**

        L'équipe plateforme utilise SAP Deployment Automation Framework (SDAF). Le plan de contrôle (deployer et bibliothèque SAP) est déjà déployé dans l'abonnement hub, et le support d'installation SAP se trouve déjà dans le conteneur **sapbits** du compte de stockage de la bibliothèque SAP.

        **Identité**

        Tailspin Toys utilise des applications SAP Business Technology Platform (SAP BTP) qui s'authentifient par l'intermédiaire d'un locataire SAP Cloud Identity Services. Le locataire Microsoft Entra dispose de licences Microsoft Entra ID P1. Une application d'entreprise pour SAP Cloud Identity Services existe, et les utilisateurs et groupes concernés y sont affectés avec le rôle **User**.

        **Copies de systèmes**

        L'équipe SAP Basis utilise SAP Landscape Management (LaMa) Enterprise Edition 3.0, qui s'exécutera sur une machine virtuelle Azure nommée **lama01** dans Sub-SAP-NPRD.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        1. **Governance.** Only VM sizes from an approved list may be deployed in the current and future SAP subscriptions. The owners of the SAP subscriptions must not be able to remove the restriction. Administrative effort must be minimized.
        2. **Identity.** Users and groups of Microsoft Entra ID must be provisioned and deprovisioned automatically in SAP Cloud Identity Services.
        3. **Deployment.** The non-production system **TSQ** must be deployed in a new SAP workload zone in Sub-SAP-NPRD by using SDAF, up to a running SAP system.
        4. **Images.** The application server VMs in Sweden Central and North Europe must be deployed from the same versioned SUSE Linux Enterprise Server for SAP Applications image that already contains the security hardening of Tailspin Toys. No hardening step may run after deployment.
        5. **LaMa.** The LaMa connector for Azure must not use any secret or password stored in LaMa. LaMa must be able to deallocate and start the VMs of the non-production systems and to copy their managed disks. For non-production systems, LaMa must reduce disk costs while the VMs are stopped.
      fr: |
        1. **Gouvernance.** Seules des tailles de machine virtuelle d'une liste approuvée peuvent être déployées dans les abonnements SAP actuels et futurs. Les propriétaires des abonnements SAP ne doivent pas pouvoir supprimer la restriction. L'effort d'administration doit être réduit au minimum.
        2. **Identité.** Les utilisateurs et groupes de Microsoft Entra ID doivent être provisionnés et déprovisionnés automatiquement dans SAP Cloud Identity Services.
        3. **Déploiement.** Le système hors production **TSQ** doit être déployé dans une nouvelle zone de charge de travail SAP dans Sub-SAP-NPRD à l'aide de SDAF, jusqu'à un système SAP en cours d'exécution.
        4. **Images.** Les machines virtuelles des serveurs d'applications de Sweden Central et de North Europe doivent être déployées à partir de la même image versionnée de SUSE Linux Enterprise Server for SAP Applications qui contient déjà le renforcement de la sécurité de Tailspin Toys. Aucune étape de renforcement ne doit s'exécuter après le déploiement.
        5. **LaMa.** Le connecteur LaMa pour Azure ne doit utiliser aucun secret ni mot de passe stocké dans LaMa. LaMa doit pouvoir libérer et démarrer les machines virtuelles des systèmes hors production et copier leurs disques managés. Pour les systèmes hors production, LaMa doit réduire le coût des disques pendant que les machines virtuelles sont arrêtées.
