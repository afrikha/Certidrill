id: az120-cs2b-wingtip
status: draft
title:
  en: Wingtip Toys
  fr: Wingtip Toys
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Wingtip Toys is a toy retailer with 300 stores and an online shop in France, Belgium and Spain. The head office is in Lille.

        Wingtip signed a RISE with SAP contract. SAP S/4HANA Cloud Private Edition now runs in the **France Central** Azure region, in a subscription and an Azure tenant that SAP owns and operates. Wingtip keeps its other workloads, including an SAP BW/4HANA system, in its own Azure subscriptions.
      fr: |
        Wingtip Toys est un distributeur de jouets qui compte 300 magasins et une boutique en ligne en France, en Belgique et en Espagne. Le siège est à Lille.

        Wingtip a signé un contrat RISE with SAP. SAP S/4HANA Cloud Private Edition s'exécute désormais dans la région Azure **France Central**, dans un abonnement et un locataire Azure qui appartiennent à SAP et qu'il exploite. Wingtip conserve ses autres charges de travail, dont un système SAP BW/4HANA, dans ses propres abonnements Azure.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        **Wingtip's Azure environment (France Central)**

        | Virtual network | Content |
        | --- | --- |
        | Hub-FRC | ExpressRoute gateway to the Lille datacenter, Azure Firewall, two AD DS domain controllers that are the DNS servers of Wingtip |
        | Spoke-Data | Integration VMs, Azure Data Factory self-hosted integration runtime nodes (planned) |
        | Spoke-BW | SAP BW/4HANA (SID WB1) on SUSE Linux Enterprise Server for SAP Applications: one HANA scale-up VM and two application server VMs |

        All Wingtip virtual networks use the AD DS domain controllers as custom DNS servers. Azure Firewall in Hub-FRC routes traffic between the spokes and the SAP RISE virtual network.

        **SAP RISE environment**

        - The SAP RISE virtual network is peered with Hub-FRC. SAP manages the peering on its side and the network security groups of its virtual network.
        - SAP hosts the DNS zone **s4.wingtiptoys.com**, delegated by Wingtip, on two DNS servers in the SAP RISE virtual network.
        - The production system is named **WS1**.

        **Other services**

        - Microsoft Entra ID is the identity provider of Wingtip. Conditional Access policies apply to all cloud applications.
        - Wingtip uses a Microsoft Sentinel workspace in its security subscription.
        - A Data Lake Storage account named **stwtdatalake** (hierarchical namespace enabled) is in Spoke-Data's subscription.
      fr: |
        **Environnement Azure de Wingtip (France Central)**

        | Réseau virtuel | Contenu |
        | --- | --- |
        | Hub-FRC | Passerelle ExpressRoute vers le centre de données de Lille, Pare-feu Azure, deux contrôleurs de domaine AD DS qui sont les serveurs DNS de Wingtip |
        | Spoke-Data | Machines virtuelles d'intégration, nœuds du runtime d'intégration auto-hébergé d'Azure Data Factory (prévus) |
        | Spoke-BW | SAP BW/4HANA (SID WB1) sur SUSE Linux Enterprise Server for SAP Applications : une machine virtuelle HANA scale-up et deux machines virtuelles de serveur d'applications |

        Tous les réseaux virtuels de Wingtip utilisent les contrôleurs de domaine AD DS comme serveurs DNS personnalisés. Le Pare-feu Azure de Hub-FRC route le trafic entre les spokes et le réseau virtuel SAP RISE.

        **Environnement SAP RISE**

        - Le réseau virtuel SAP RISE est relié à Hub-FRC par peering. SAP gère le peering de son côté et les groupes de sécurité réseau de son réseau virtuel.
        - SAP héberge la zone DNS **s4.wingtiptoys.com**, déléguée par Wingtip, sur deux serveurs DNS du réseau virtuel SAP RISE.
        - Le système de production s'appelle **WS1**.

        **Autres services**

        - Microsoft Entra ID est le fournisseur d'identité de Wingtip. Des stratégies d'accès conditionnel s'appliquent à toutes les applications cloud.
        - Wingtip utilise un espace de travail Microsoft Sentinel dans son abonnement de sécurité.
        - Un compte Data Lake Storage nommé **stwtdatalake** (espace de noms hiérarchique activé) se trouve dans l'abonnement de Spoke-Data.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Wingtip identifies the following requirements:

        1. **Name resolution.** Wingtip's VMs and on-premises clients must resolve the names of the s4.wingtiptoys.com zone by using the replication method that Microsoft documents as the primary method for SAP RISE.
        2. **Identity.** Users of the SAP Fiori launchpad of WS1 must authenticate with Microsoft Entra ID so that Conditional Access applies. Users of SAP GUI for Windows must get single sign-on based on Microsoft Entra ID.
        3. **Security monitoring.** The SAP security audit log of WS1 and the operating system logs of the WS1 VMs must be sent to Wingtip's Microsoft Sentinel workspace.
        4. **Data extraction.** Every night, an Azure Data Factory pipeline must copy WS1 tables with the SAP Table connector into stwtdatalake. All traffic must use private IP addresses. Public network access to stwtdatalake will be disabled. The pipeline creates directories and sets ACLs in the account.
        5. **Monitoring.** The operations team wants to use Azure Monitor for SAP solutions wherever it is supported.
        6. **BW/4HANA backup.** The HANA database of WB1 must have an RPO of 15 minutes, HANA-consistent backups stored outside the VM, and no backup server to manage.
      fr: |
        Wingtip a défini les exigences suivantes :

        1. **Résolution de noms.** Les machines virtuelles de Wingtip et les clients locaux doivent résoudre les noms de la zone s4.wingtiptoys.com en utilisant la méthode de réplication que Microsoft présente comme la méthode principale pour SAP RISE.
        2. **Identité.** Les utilisateurs du SAP Fiori launchpad de WS1 doivent s'authentifier avec Microsoft Entra ID afin que l'accès conditionnel s'applique. Les utilisateurs de SAP GUI for Windows doivent bénéficier d'une authentification unique basée sur Microsoft Entra ID.
        3. **Supervision de la sécurité.** Le journal d'audit de sécurité SAP de WS1 et les journaux du système d'exploitation des machines virtuelles de WS1 doivent être envoyés à l'espace de travail Microsoft Sentinel de Wingtip.
        4. **Extraction de données.** Chaque nuit, un pipeline Azure Data Factory doit copier des tables de WS1 avec le connecteur SAP Table vers stwtdatalake. Tout le trafic doit utiliser des adresses IP privées. L'accès réseau public à stwtdatalake sera désactivé. Le pipeline crée des répertoires et définit des listes de contrôle d'accès (ACL) dans le compte.
        5. **Supervision.** L'équipe d'exploitation souhaite utiliser Azure Monitor pour solutions SAP partout où c'est pris en charge.
        6. **Sauvegarde de BW/4HANA.** La base de données HANA de WB1 doit avoir un RPO de 15 minutes, des sauvegardes cohérentes avec HANA stockées hors de la machine virtuelle, et aucun serveur de sauvegarde à gérer.
