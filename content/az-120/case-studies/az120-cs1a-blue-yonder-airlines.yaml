id: az120-cs1a-blue-yonder-airlines
status: draft
title:
  en: Blue Yonder Airlines
  fr: Blue Yonder Airlines
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Blue Yonder Airlines is a regional airline based in Munich. It operates 60 aircraft and runs its maintenance, repair and overhaul (MRO) and finance processes on SAP S/4HANA.

        Blue Yonder Airlines is moving SAP S/4HANA to Azure. The SAP Basis team has five administrators. The storage team already operates Azure NetApp Files for other workloads.
      fr: |
        Blue Yonder Airlines est une compagnie aérienne régionale basée à Munich. Elle exploite 60 avions et exécute ses processus de maintenance, réparation et révision (MRO) et de finance sur SAP S/4HANA.

        Blue Yonder Airlines migre SAP S/4HANA vers Azure. L'équipe SAP Basis compte cinq administrateurs. L'équipe de stockage exploite déjà Azure NetApp Files pour d'autres charges de travail.
  - key: planned
    title: { en: "Planned environment", fr: "Environnement prévu" }
    body:
      en: |
        The SAP systems will run in the **Germany West Central** region on Red Hat Enterprise Linux for SAP Solutions 9. All HANA, /sapmnt and /usr/sap/trans file systems will be Azure NetApp Files volumes in a NetApp account named **anf-byair-gwc**. The capacity pools use the Premium service level and the auto QoS type.

        | SID | Role | VMs | Configuration |
        | --- | --- | --- | --- |
        | BYP | Production | hdb1 (zone 1), hdb2 (zone 2) | SAP HANA scale-up, HANA System Replication in synchronous mode between hdb1 and hdb2, Pacemaker cluster |
        | BYP | Production | ascs1 (zone 1), ascs2 (zone 2) | ASCS/ERS Pacemaker cluster behind an internal Standard load balancer |
        | BYP | Production | app1 to app6 (zones 1 and 2) | Application servers |
        | BYQ | Quality assurance | byq-hdb (zone 1) | SAP HANA scale-up, single VM |

        The production HANA database is 8 TB.
      fr: |
        Les systèmes SAP s'exécuteront dans la région **Germany West Central** sur Red Hat Enterprise Linux for SAP Solutions 9. Tous les systèmes de fichiers HANA, /sapmnt et /usr/sap/trans seront des volumes Azure NetApp Files dans un compte NetApp nommé **anf-byair-gwc**. Les pools de capacité utilisent le niveau de service Premium et le type de QoS automatique.

        | SID | Rôle | Machines virtuelles | Configuration |
        | --- | --- | --- | --- |
        | BYP | Production | hdb1 (zone 1), hdb2 (zone 2) | SAP HANA scale-up, HANA System Replication en mode synchrone entre hdb1 et hdb2, cluster Pacemaker |
        | BYP | Production | ascs1 (zone 1), ascs2 (zone 2) | Cluster Pacemaker ASCS/ERS derrière un équilibreur de charge interne Standard |
        | BYP | Production | app1 à app6 (zones 1 et 2) | Serveurs d'applications |
        | BYQ | Assurance qualité | byq-hdb (zone 1) | SAP HANA scale-up, une seule machine virtuelle |

        La base de données HANA de production fait 8 To.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        **Storage**

        1. The BYP volumes for /hana/data and /hana/log must meet the SAP HANA storage KPIs for production without changing the service level or the QoS type of the capacity pools. The deployment must follow the Microsoft recommendations for the protocol and the delegated subnet.
        2. For BYQ, the latency between byq-hdb and its volumes must be minimized. The solution must not pin byq-hdb to a single datacenter and must not require a request to Microsoft.

        **Backup**

        3. BYP must be protected by application-consistent storage snapshots of the HANA data volume every four hours. The snapshots must appear in the SAP HANA backup catalog. The solution must be scheduled from Linux and must not use a third-party backup product.

        **Disaster recovery**

        4. BYP must be recoverable in the **Germany North** region. A HANA VM in Germany North will receive asynchronous HANA System Replication from the production site. The /sapmnt and /usr/sap/trans volumes must be replicated at the storage level. Blue Yonder Airlines confirmed that the required VM sizes and Azure NetApp Files are available in Germany North.

        **Monitoring**

        5. The storage team must use Azure Monitor metrics to detect throttling and latency issues on the HANA volumes, a lack of free space on the log backup volume, and delays in the replication of /sapmnt.
      fr: |
        **Stockage**

        1. Les volumes /hana/data et /hana/log de BYP doivent respecter les KPI de stockage SAP HANA pour la production sans changer le niveau de service ni le type de QoS des pools de capacité. Le déploiement doit suivre les recommandations de Microsoft pour le protocole et le sous-réseau délégué.
        2. Pour BYQ, la latence entre byq-hdb et ses volumes doit être réduite au minimum. La solution ne doit pas lier byq-hdb à un seul centre de données et ne doit pas nécessiter de demande auprès de Microsoft.

        **Sauvegarde**

        3. BYP doit être protégé par des instantanés de stockage cohérents avec les applications du volume de données HANA toutes les quatre heures. Les instantanés doivent apparaître dans le catalogue de sauvegarde SAP HANA. La solution doit être planifiée depuis Linux et ne doit pas utiliser de produit de sauvegarde tiers.

        **Reprise d'activité**

        4. BYP doit pouvoir être récupéré dans la région **Germany North**. Une machine virtuelle HANA dans Germany North recevra la réplication HANA System Replication asynchrone depuis le site de production. Les volumes /sapmnt et /usr/sap/trans doivent être répliqués au niveau du stockage. Blue Yonder Airlines a confirmé que les tailles de machine virtuelle requises et Azure NetApp Files sont disponibles dans Germany North.

        **Supervision**

        5. L'équipe de stockage doit utiliser les métriques Azure Monitor pour détecter les problèmes de limitation et de latence sur les volumes HANA, un manque d'espace libre sur le volume de sauvegarde des journaux et les retards de réplication de /sapmnt.
