id: az120-cs3a-coho-winery
status: draft
title:
  en: Coho Winery
  fr: Coho Winery
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Coho Winery produces and distributes wines in 14 European countries. The head office and the main datacenter are in Bordeaux. The hosting contract of the datacenter ends in 18 months.

        Coho Winery plans to move its SAP landscape to the Azure France Central region and, in the same project, to convert SAP ECC to SAP S/4HANA. A team of four SAP Basis administrators and two Linux administrators manages the landscape.
      fr: |
        Coho Winery produit et distribue des vins dans 14 pays européens. Le siège et le centre de données principal sont à Bordeaux. Le contrat d'hébergement du centre de données prend fin dans 18 mois.

        Coho Winery prévoit de déplacer son paysage SAP vers la région Azure France Central et, dans le même projet, de convertir SAP ECC en SAP S/4HANA. Une équipe de quatre administrateurs SAP Basis et de deux administrateurs Linux gère le paysage.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        The production system **CWP** runs SAP ECC 6.0 EHP8 on IBM Db2 11.5 and Windows Server in the Bordeaux datacenter. The database is 3.4 TB. A quality assurance system **CWQ** and a development system **CWD** use the same platform.

        The Bordeaux datacenter is connected to France Central through a 2-Gbps ExpressRoute circuit.
      fr: |
        Le système de production **CWP** exécute SAP ECC 6.0 EHP8 sur IBM Db2 11.5 et Windows Server dans le centre de données de Bordeaux. La base de données fait 3,4 To. Un système d'assurance qualité **CWQ** et un système de développement **CWD** utilisent la même plateforme.

        Le centre de données de Bordeaux est connecté à France Central par un circuit ExpressRoute de 2 Gbit/s.
  - key: design
    title: { en: "Planned environment", fr: "Environnement prévu" }
    body:
      en: |
        The SAP S/4HANA systems will run SUSE Linux Enterprise Server (SLES) for SAP Applications 15 SP6 and SAP HANA 2.0 SPS 07.

        | Virtual machine | Role | Configuration |
        | --- | --- | --- |
        | HANA-PRD1, HANA-PRD2 | Production HANA database, instance number 03 | M-series (Mv3) VMs certified for SAP HANA, zones 1 and 2, HANA system replication in synchronous mode, /hana/data and /hana/log on Premium SSD |
        | HANA-QAS | Quality assurance HANA database | E-series v5 VM certified for SAP HANA, zone 1, /hana/data and /hana/log on Premium SSD v2 |
        | APP-PRD1 to APP-PRD4 | Application servers | Zones 1 and 2 |

        A Pacemaker cluster will manage HANA-PRD1 and HANA-PRD2. Applications will connect to the primary HANA database through a virtual IP address published by a load balancer.
      fr: |
        Les systèmes SAP S/4HANA exécuteront SUSE Linux Enterprise Server (SLES) for SAP Applications 15 SP6 et SAP HANA 2.0 SPS 07.

        | Machine virtuelle | Rôle | Configuration |
        | --- | --- | --- |
        | HANA-PRD1, HANA-PRD2 | Base de données HANA de production, numéro d'instance 03 | Machines virtuelles de série M (Mv3) certifiées pour SAP HANA, zones 1 et 2, réplication système HANA en mode synchrone, /hana/data et /hana/log sur SSD Premium |
        | HANA-QAS | Base de données HANA d'assurance qualité | Machine virtuelle de série E v5 certifiée pour SAP HANA, zone 1, /hana/data et /hana/log sur SSD Premium v2 |
        | APP-PRD1 à APP-PRD4 | Serveurs d'applications | Zones 1 et 2 |

        Un cluster Pacemaker gérera HANA-PRD1 et HANA-PRD2. Les applications se connecteront à la base de données HANA primaire par une adresse IP virtuelle publiée par un équilibreur de charge.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Coho Winery identifies the following requirements:

        1. **Migration.** The move to Azure and the conversion to SAP S/4HANA must be performed in one step, with a single business downtime window for CWP. The on-premises system remains the production system until the cutover.
        2. **Storage.** The /hana/log volumes must meet the SAP HANA storage KPIs and follow Microsoft's recommended disk settings for each disk type.
        3. **High availability.** Pacemaker must fail over the production HANA database automatically between zones. Clients must keep using the same virtual IP address after a failover.
        4. **Fencing.** The fencing solution must not require any additional virtual machine or shared disk, and no secret or password may be stored on the cluster nodes.
        5. **Maintenance.** The cluster must move its resources away from a node before Azure performs a scheduled maintenance event on that node.
        6. **Monitoring.** The Linux administrators will use Azure Monitor for SAP solutions to collect operating system, Pacemaker cluster and SAP HANA metrics for CWP.
      fr: |
        Coho Winery a défini les exigences suivantes :

        1. **Migration.** Le déplacement vers Azure et la conversion en SAP S/4HANA doivent être effectués en une seule étape, avec une seule fenêtre d'interruption métier pour CWP. Le système local reste le système de production jusqu'à la bascule.
        2. **Stockage.** Les volumes /hana/log doivent respecter les KPI de stockage de SAP HANA et suivre les paramètres de disque recommandés par Microsoft pour chaque type de disque.
        3. **Haute disponibilité.** Pacemaker doit basculer automatiquement la base de données HANA de production entre les zones. Les clients doivent continuer à utiliser la même adresse IP virtuelle après un basculement.
        4. **Isolation (fencing).** La solution d'isolation ne doit exiger aucune machine virtuelle ni aucun disque partagé supplémentaire, et aucun secret ni mot de passe ne doit être stocké sur les nœuds du cluster.
        5. **Maintenance.** Le cluster doit déplacer ses ressources hors d'un nœud avant qu'Azure n'effectue un événement de maintenance planifié sur ce nœud.
        6. **Supervision.** Les administrateurs Linux utiliseront Azure Monitor pour solutions SAP pour collecter les métriques du système d'exploitation, du cluster Pacemaker et de SAP HANA de CWP.
