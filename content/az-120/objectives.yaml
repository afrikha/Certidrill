# AZ-120 objectives — official study guide, skills measured as of 2026-04-17 (en-us and fr-fr pages, checked on 2026-11-16).
# `code` is the stable key referenced by question files and course sections.
# English verbatim. French from the fr-fr page with straight apostrophes; a few faulty renderings of
# the fr-fr page were corrected (2.2.6, 2.3.3 and 3.1.1 put back in the infinitive, group 2.3 title,
# "à l'aide d'Azure Monitor" elisions in 4.2).
migration:
- group:
    en: Identify requirements for target infrastructure
    fr: Identifier les exigences pour l'infrastructure cible
  objectives:
  - code: '1.1.1'
    en: Estimate target sizing for SAP workloads
    fr: Estimer le dimensionnement cible pour les charges de travail SAP
  - code: '1.1.2'
    en: Identify supported scenarios for SAP deployments on Azure
    fr: Identifier les scénarios pris en charge pour les déploiements SAP sur Azure
  - code: '1.1.3'
    en: Identify compute, storage, and network requirements for SAP workloads
    fr: Identifier les exigences en matière de calcul, de stockage et de réseau pour les charges de travail SAP
  - code: '1.1.4'
    en: Assess constraints imposed by subscription models and quota limits
    fr: Évaluer les contraintes imposées par les modèles d'abonnement et les limites de quota
  - code: '1.1.5'
    en: Identify software licensing requirements for target workloads
    fr: Identifier les exigences de licence logicielle pour les charges de travail cibles
  - code: '1.1.6'
    en: Identify cost implications for target workloads
    fr: Identifier les implications des coûts pour les charges de travail cibles
  - code: '1.1.7'
    en: Specify an Azure support plan for the target infrastructure
    fr: Spécifier un plan de support Azure pour l'infrastructure cible
  - code: '1.1.8'
    en: Choose between lift and shift, lift-shift-migrate, and lift-shift-migrate to HANA
    fr: Choisir entre les migrations lift-and-shift, lift-shift-migrate et lift-shift-migrate vers HANA
  - code: '1.1.9'
    en: Choose an appropriate SAP workload migration strategy and tools
    fr: Choisir une stratégie et des outils de migration de charge de travail SAP appropriés
- group:
    en: Design and implement an Azure environment to support SAP workloads
    fr: Concevoir et implémenter un environnement Azure pour prendre en charge les charges de travail SAP
  objectives:
  - code: '1.2.1'
    en: Design and implement authorization and access control for SAP workloads
    fr: Concevoir et implémenter l'autorisation et le contrôle d'accès pour les charges de travail SAP
  - code: '1.2.2'
    en: Design and implement governance and compliance by using Azure Policy
    fr: Concevoir et implémenter la gouvernance et la conformité en utilisant Azure Policy
  - code: '1.2.3'
    en: Design and implement authentication for SAP workloads
    fr: Concevoir et implémenter une authentification pour les charges de travail SAP
  - code: '1.2.4'
    en: Design and implement authentication for SAP software as a service (SaaS) applications
    fr: Concevoir et implémenter l'authentification pour les applications SAP SaaS (software as a service)
  - code: '1.2.5'
    en: Design and implement a management hierarchy, including management groups, subscriptions, and resource groups
    fr: Concevoir et implémenter une hiérarchie de gestion, notamment des groupes d'administration, des abonnements et des groupes de ressources
  - code: '1.2.6'
    en: Design Azure landing zones for SAP
    fr: Concevoir des zones d'atterrissage Azure pour SAP
- group:
    en: Design and implement integration with SAP RISE
    fr: Concevoir et implémenter l'intégration avec SAP RISE
  objectives:
  - code: '1.3.1'
    en: Design networking for SAP RISE
    fr: Concevoir la mise en réseau pour SAP RISE
  - code: '1.3.2'
    en: Implement networking for SAP RISE
    fr: Implémenter la mise en réseau pour SAP RISE
  - code: '1.3.3'
    en: Design and implement Azure compute, network, and storage services with SAP RISE
    fr: Concevoir et implémenter les services de calcul, de réseau et de stockage Azure avec SAP RISE
  - code: '1.3.4'
    en: Design and implement integration of data management services such as data archiving
    fr: Concevoir et implémenter l'intégration des services de gestion des données tels que l'archivage des données
  - code: '1.3.5'
    en: Design and implement integration of identity and security services with SAP RISE
    fr: Concevoir et implémenter l'intégration des services d'identité et de sécurité avec SAP RISE
infrastructure:
- group:
    en: Design and implement a compute solution for SAP workloads
    fr: Concevoir et implémenter une solution de calcul pour les charges de travail SAP
  objectives:
  - code: '2.1.1'
    en: Choose an SAP-certified Azure virtual machine for a given SAP workload
    fr: Choisir une machine virtuelle Azure certifiée SAP pour une charge de travail SAP donnée
  - code: '2.1.2'
    en: Configure the Azure VM extension for SAP solutions
    fr: Configurer l'extension de machine virtuelle Azure pour les solutions SAP
  - code: '2.1.3'
    en: Deploy an operating system by using an Azure Marketplace image
    fr: Déployer un système d'exploitation en utilisant une image de la Place de marché Azure
  - code: '2.1.4'
    en: Create a custom image and deploy it to an Azure virtual machine
    fr: Créer une image personnalisée et la déployer sur une machine virtuelle Azure
  - code: '2.1.5'
    en: Automate a deployment of Azure virtual machines by using IaC, including Bicep and Azure Resource Manager (ARM) templates
    fr: Automatiser le déploiement de machines virtuelles Azure avec IaC, y compris les modèles Bicep et ARM (Azure Resource Manager)
  - code: '2.1.6'
    en: Automate a deployment by using the SAP Deployment Automation Framework
    fr: Automatiser un déploiement à l'aide de SAP Deployment Automation Framework
  - code: '2.1.7'
    en: Automate a deployment by using Azure Center for SAP solutions
    fr: Automatiser un déploiement en utilisant le Centre Azure pour les solutions SAP
- group:
    en: Design and implement networking for SAP on Azure virtual machines
    fr: Concevoir et implémenter un réseau pour SAP sur des machines virtuelles Azure
  objectives:
  - code: '2.2.1'
    en: Design and implement virtual networks and subnets
    fr: Concevoir et implémenter des réseaux virtuels et des sous-réseaux
  - code: '2.2.2'
    en: Implement Accelerated Networking for Azure virtual machines
    fr: Implémenter Accelerated Networking pour les machines virtuelles Azure
  - code: '2.2.3'
    en: Design and configure proximity placement groups
    fr: Concevoir et configurer des groupes de placement de proximité
  - code: '2.2.4'
    en: Design networking to meet SAP workload latency requirements
    fr: Concevoir la mise en réseau pour répondre aux exigences de latence de charge de travail SAP
  - code: '2.2.5'
    en: Design and implement network flow control
    fr: Concevoir et implémenter le contrôle de flux réseau
  - code: '2.2.6'
    en: Design and implement network security
    fr: Concevoir et implémenter la sécurité réseau
  - code: '2.2.7'
    en: Design and implement service endpoints and private endpoints for Azure Storage
    fr: Concevoir et implémenter des points de terminaison de service et des points de terminaison privés pour le Stockage Azure
  - code: '2.2.8'
    en: Design name resolution for integration with Azure DNS
    fr: Concevoir la résolution de noms pour l'intégration avec Azure DNS
  - code: '2.2.9'
    en: Design and configure ExpressRoute for hybrid connectivity
    fr: Concevoir et configurer ExpressRoute pour la connectivité hybride
- group:
    en: Design and implement a storage solution for SAP on Azure virtual machines
    fr: Concevoir et implémenter une solution de stockage pour SAP sur des machines virtuelles Azure
  objectives:
  - code: '2.3.1'
    en: Choose a storage type
    fr: Choisir un type de stockage
  - code: '2.3.2'
    en: Specify when to use disk striping and simple volumes
    fr: Spécifier quand utiliser l'entrelacement de disques et des volumes simples
  - code: '2.3.3'
    en: Design for storage security considerations
    fr: Concevoir en fonction des considérations de sécurité du stockage
  - code: '2.3.4'
    en: Design and implement data protection
    fr: Concevoir et implémenter la protection des données
  - code: '2.3.5'
    en: Design and implement caching for disks
    fr: Concevoir et implémenter la mise en cache pour les disques
  - code: '2.3.6'
    en: Configure Write Accelerator
    fr: Configurer l'Accélérateur d'écriture
  - code: '2.3.7'
    en: Configure encryption for storage, disks, and data
    fr: Configurer le chiffrement pour le stockage, les disques et les données
  - code: '2.3.8'
    en: Design and implement volumes by using Azure NetApp Files
    fr: Concevoir et implémenter des volumes en utilisant Azure NetApp Files
  - code: '2.3.9'
    en: Design and implement volumes by using Azure Files
    fr: Concevoir et implémenter des volumes en utilisant Azure Files
hadr:
- group:
    en: Design and implement a high availability solution for SAP on Azure virtual machines
    fr: Concevoir et implémenter une solution de haute disponibilité pour SAP sur des machines virtuelles Azure
  objectives:
  - code: '3.1.1'
    en: Design for service-level agreement (SLA) considerations
    fr: Concevoir en fonction des considérations liées au contrat de niveau de service (SLA)
  - code: '3.1.2'
    en: Design and deploy SAP workloads into availability sets and availability zones
    fr: Concevoir et déployer des charges de travail SAP dans des groupes à haute disponibilité et des zones de disponibilité
  - code: '3.1.3'
    en: Design and implement load balancing for high availability
    fr: Concevoir et implémenter l'équilibrage de charge pour la haute disponibilité
  - code: '3.1.4'
    en: Configure clustering for HANA and SAP Central Services (SCS)
    fr: Configurer le clustering pour HANA et SAP Central Services (SCS)
  - code: '3.1.5'
    en: Configure clustering for SQL
    fr: Configurer le clustering pour SQL
  - code: '3.1.6'
    en: Configure Pacemaker and STONITH
    fr: Configurer Pacemaker et STONITH
  - code: '3.1.7'
    en: Configure an Azure fence agent or STONITH Block Device (SBD)
    fr: Configurer un agent Azure Fence ou SBD (STONITH Block Device)
  - code: '3.1.8'
    en: Design and configure storage-level replication for SAP workloads
    fr: Concevoir et configurer la réplication au niveau du stockage pour les charges de travail SAP
  - code: '3.1.9'
    en: Configure restart of SAP systems, instances, and HANA databases
    fr: Configurer le redémarrage des systèmes SAP, des instances et des bases de données HANA
- group:
    en: Design and implement a disaster recovery solution for SAP on Azure virtual machines
    fr: Concevoir et implémenter une solution de reprise d'activité pour SAP sur des machines virtuelles Azure
  objectives:
  - code: '3.2.1'
    en: Design and implement an Azure Site Recovery strategy for an SAP infrastructure
    fr: Concevoir et implémenter une stratégie Azure Site Recovery pour une infrastructure SAP
  - code: '3.2.2'
    en: Design a disaster recovery solution with regional considerations
    fr: Concevoir une solution de reprise d'activité avec des considérations régionales
  - code: '3.2.3'
    en: Specify network configurations for disaster recovery
    fr: Spécifier les configurations réseau pour la reprise d'activité
  - code: '3.2.4'
    en: Design a backup strategy to meet SLA requirements
    fr: Concevoir une stratégie de sauvegarde pour répondre aux exigences du contrat SLA
  - code: '3.2.5'
    en: Implement policies for backups and snapshots
    fr: Implémenter des stratégies pour les sauvegardes et les instantanés
  - code: '3.2.6'
    en: Configure and validate snapshots and backups for SAP workloads
    fr: Configurer et valider des instantanés et des sauvegardes pour les charges de travail SAP
  - code: '3.2.7'
    en: Perform backup and restore
    fr: Effectuer une sauvegarde et une restauration
  - code: '3.2.8'
    en: Test disaster recovery
    fr: Tester la reprise après sinistre
maintenance:
- group:
    en: Optimize performance and costs
    fr: Optimiser les performances et les coûts
  objectives:
  - code: '4.1.1'
    en: Optimize performance and costs for an SAP workload by using Azure Advisor recommendations
    fr: Optimiser les performances et les coûts d'une charge de travail SAP en utilisant les recommandations Azure Advisor
  - code: '4.1.2'
    en: Analyze and optimize network performance
    fr: Analyser et optimiser les performances réseau
  - code: '4.1.3'
    en: Optimize costs by using Azure Savings Plans or Reserved Instances for SAP virtual machines
    fr: Optimiser les coûts à l'aide d'Azure Savings Plans ou d'instances réservées pour les machines virtuelles SAP
  - code: '4.1.4'
    en: Optimize performance and costs by resizing Azure virtual machines
    fr: Optimiser les performances et les coûts en redimensionnant les machines virtuelles Azure
  - code: '4.1.5'
    en: Optimize storage costs
    fr: Optimiser les coûts de stockage
  - code: '4.1.6'
    en: Optimize data performance by using archiving
    fr: Optimiser la performance des données en utilisant l'archivage
  - code: '4.1.7'
    en: Optimize performance and costs of SAP application servers and databases
    fr: Optimiser les performances et les coûts des serveurs d'applications et des bases de données SAP
- group:
    en: Monitor and maintain SAP on Azure
    fr: Superviser et maintenir SAP sur Azure
  objectives:
  - code: '4.2.1'
    en: Monitor Azure virtual machines by using Azure Monitor
    fr: Superviser les machines virtuelles Azure à l'aide d'Azure Monitor
  - code: '4.2.2'
    en: Monitor high availability by using Azure Monitor
    fr: Surveiller la haute disponibilité à l'aide d'Azure Monitor
  - code: '4.2.3'
    en: Monitor storage by using Azure Monitor
    fr: Surveiller le stockage avec Azure Monitor
  - code: '4.2.4'
    en: Monitor networking by using Azure Monitor and Azure Network Watcher
    fr: Superviser le réseau à l'aide d'Azure Monitor et d'Azure Network Watcher
  - code: '4.2.5'
    en: Configure Azure Monitor for SAP solutions
    fr: Configurer Azure Monitor pour solutions SAP
  - code: '4.2.6'
    en: Manage backups by using Azure Backup
    fr: Gérer des sauvegardes en utilisant Sauvegarde Azure
  - code: '4.2.7'
    en: Start and stop SAP systems by using Azure Center for SAP solutions
    fr: Démarrer et arrêter des systèmes SAP à l'aide du Centre Azure pour les solutions SAP
  - code: '4.2.8'
    en: Manage virtual instances by using Azure Center for SAP solutions
    fr: Gérer des instances virtuelles avec le Centre Azure pour les solutions SAP
  - code: '4.2.9'
    en: Implement the SAP Landscape Management (LaMa) connector for Azure
    fr: Implémenter le connecteur SAP Landscape Management (LaMa) pour Azure
