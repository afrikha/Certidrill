chapter: 21-compute
questions:
  # ------------------------------------------------------------------ 1
  - id: az120-qz-21-01
    objective: "2.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso, Ltd. will deploy SAP NetWeaver application servers on Red Hat Enterprise Linux in an Azure subscription named **Sub-CSP1**, which Contoso bought through a Cloud Solution Provider (CSP). Contoso already owns Red Hat subscriptions.

        You need to deploy the VMs from Azure Marketplace images in Sub-CSP1.

        What should you use?
      fr: |
        Contoso, Ltd. va déployer des serveurs d'applications SAP NetWeaver sous Red Hat Enterprise Linux dans un abonnement Azure nommé **Sub-CSP1**, que Contoso a acheté auprès d'un fournisseur de solutions cloud (CSP). Contoso possède déjà des abonnements Red Hat.

        Vous devez déployer les machines virtuelles à partir d'images de la Place de marché Azure dans Sub-CSP1.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "RHEL BYOS images, after you enable Red Hat Cloud Access for Sub-CSP1", fr: "Des images RHEL BYOS, après avoir activé Red Hat Cloud Access pour Sub-CSP1" } }
        - { id: b, text: { en: "RHEL BYOS images, switched to pay-as-you-go later with Azure Hybrid Benefit", fr: "Des images RHEL BYOS, passées plus tard en paiement à l'utilisation avec Azure Hybrid Benefit" } }
        - { id: c, text: { en: "RHEL-SAP-HANA images, which are billed through the Red Hat subscriptions", fr: "Des images RHEL-SAP-HANA, facturées via les abonnements Red Hat" } }
        - { id: d, text: { en: "RHEL for SAP Applications images with pay-as-you-go billing", fr: "Des images RHEL for SAP Applications facturées en paiement à l'utilisation" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          RHEL BYOS images are based on private plans and aren't supported in CSP subscriptions, so the Marketplace images available in Sub-CSP1 are the pay-as-you-go ones. `RHEL-SAP-APPS` (RHEL for SAP Applications) gives access to the SAP application repositories, and its billing includes the RHEL and SAP premiums.
        fr: |
          Les images RHEL BYOS reposent sur des plans privés et ne sont pas prises en charge dans les abonnements CSP : les images de la Place de marché disponibles dans Sub-CSP1 sont donc celles en paiement à l'utilisation. `RHEL-SAP-APPS` (RHEL for SAP Applications) donne accès aux dépôts des applications SAP, et sa facturation inclut les suppléments RHEL et SAP.
      options:
        a: { en: "Enabling Cloud Access doesn't change the rule: BYOS images use private plans, which CSP subscriptions don't support.", fr: "Activer Cloud Access ne change pas la règle : les images BYOS utilisent des plans privés, que les abonnements CSP ne prennent pas en charge." }
        b: { en: "Azure Hybrid Benefit switches the billing of an existing VM, but the BYOS image can't be deployed in a CSP subscription in the first place.", fr: "Azure Hybrid Benefit change la facturation d'une machine virtuelle existante, mais l'image BYOS ne peut tout simplement pas être déployée dans un abonnement CSP." }
        c: { en: "Red Hat considers the RHEL-SAP-HANA offer end of life and recommends moving to RHEL-SAP-HA.", fr: "Red Hat considère l'offre RHEL-SAP-HANA comme en fin de vie et recommande de passer à RHEL-SAP-HA." }
    references:
      - title: Overview of Red Hat Enterprise Linux images in Azure - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/workloads/redhat/redhat-images

  # ------------------------------------------------------------------ 2
  - id: az120-qz-21-02
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. runs SAP S/4HANA on Azure. The application tier consists of two application server VMs of an E-family size listed in SAP Note 1928533. A rollout next year will raise the SAPS demand of the application tier by 60 %. The database VM has enough spare capacity.

        You need to add capacity to the application tier by following Microsoft guidance for SAP on Azure.

        What should you do?
      fr: |
        Litware, Inc. exécute SAP S/4HANA sur Azure. La couche Application se compose de deux machines virtuelles de serveur d'applications d'une taille de la famille E listée dans la note SAP 1928533. Un déploiement l'an prochain augmentera de 60 % la demande en SAPS de la couche Application. La machine virtuelle de base de données dispose d'une capacité suffisante.

        Vous devez ajouter de la capacité à la couche Application en suivant les recommandations de Microsoft pour SAP sur Azure.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Replace the two VMs by a single M-family VM that delivers the total SAPS", fr: "Remplacer les deux machines virtuelles par une seule machine virtuelle de la famille M qui fournit le total des SAPS" } }
        - { id: b, text: { en: "Add application server VMs of a size listed in SAP Note 1928533", fr: "Ajouter des machines virtuelles de serveur d'applications d'une taille listée dans la note SAP 1928533" } }
        - { id: c, text: { en: "Install extra dialog instances on the database VM, which has spare capacity", fr: "Installer des instances de dialogue supplémentaires sur la machine virtuelle de base de données, qui a de la capacité" } }
        - { id: d, text: { en: "Resize both VMs to a general purpose D-family size with more vCPUs", fr: "Redimensionner les deux machines virtuelles vers une taille polyvalente de la famille D avec plus de processeurs virtuels" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In most SAP systems the database layer doesn't scale out, but the application layer does: you add application servers when the SAPS demand grows. Each new VM must be a size that SAP Note 1928533 lists, and keeping several application servers also keeps the tier redundant.
        fr: |
          Dans la plupart des systèmes SAP, la couche Base de données ne se met pas à l'échelle horizontalement, mais la couche Application, si : vous ajoutez des serveurs d'applications quand la demande en SAPS augmente. Chaque nouvelle machine virtuelle doit être d'une taille listée dans la note SAP 1928533, et garder plusieurs serveurs d'applications conserve la redondance de la couche.
      options:
        a: { en: "A single application server removes the redundancy of the tier; the guidance is to scale the application tier out, not to concentrate it on one large VM.", fr: "Un seul serveur d'applications supprime la redondance de la couche ; la recommandation est de mettre la couche Application à l'échelle horizontalement, pas de la concentrer sur une grande machine virtuelle." }
        c: { en: "The database VM is sized first because it doesn't scale out; consuming its headroom with dialog instances works against that guidance.", fr: "La machine virtuelle de base de données est dimensionnée en premier parce qu'elle ne se met pas à l'échelle horizontalement ; consommer sa marge avec des instances de dialogue va à l'encontre de cette recommandation." }
        d: { en: "Growing each VM is possible only up to a size limit; the documented way to grow the application tier is to scale it out.", fr: "Agrandir chaque machine virtuelle n'est possible que jusqu'à une taille limite ; la méthode documentée pour faire croître la couche Application est de la mettre à l'échelle horizontalement." }
    references:
      - title: Plan and implement an SAP deployment on Azure
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide

  # ------------------------------------------------------------------ 3
  - id: az120-qz-21-03
    objective: "2.1.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation installed the Azure VM extension for SAP solutions on an SAP application server VM. `Test-AzVMAEMExtension` still reports a failed check after you ran `Set-AzVMAEMExtension` again and followed the troubleshooting guide.

        You need to get assistance with the extension.

        Where should you open a support case?
      fr: |
        Adatum Corporation a installé l'extension de machine virtuelle Azure pour les solutions SAP sur une machine virtuelle de serveur d'applications SAP. `Test-AzVMAEMExtension` signale toujours un contrôle en échec après que vous avez de nouveau exécuté `Set-AzVMAEMExtension` et suivi le guide de résolution des problèmes.

        Vous devez obtenir de l'aide sur l'extension.

        Où devez-vous ouvrir une demande de support ?
    body:
      options:
        - { id: a, text: { en: "With Microsoft, as an Azure support request for the virtual machine", fr: "Auprès de Microsoft, par une demande de support Azure pour la machine virtuelle" } }
        - { id: b, text: { en: "With the vendor of the operating system that runs on the VM", fr: "Auprès de l'éditeur du système d'exploitation exécuté sur la machine virtuelle" } }
        - { id: c, text: { en: "With SAP, as a support case through the SAP support channels", fr: "Auprès de SAP, par une demande de support via les canaux de support SAP" } }
        - { id: d, text: { en: "With Microsoft, as a support request for Azure Monitor for SAP solutions", fr: "Auprès de Microsoft, par une demande de support pour Azure Monitor pour solutions SAP" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Support for the Azure Extension for SAP is provided through SAP support channels: for assistance with the extension, you open a case with SAP Support. The extension exists so that SAP supports the system on Azure, and SAP Support can also ask you to install its new version.
        fr: |
          Le support de l'extension Azure pour SAP passe par les canaux de support SAP : pour obtenir de l'aide sur l'extension, vous ouvrez une demande auprès du support SAP. L'extension existe pour que SAP prenne en charge le système sur Azure, et le support SAP peut aussi vous demander d'installer sa nouvelle version.
      options:
        a: { en: "Microsoft documents that assistance with this extension goes through SAP Support, not through an Azure support request.", fr: "Microsoft indique que l'aide sur cette extension passe par le support SAP, pas par une demande de support Azure." }
        b: { en: "The extension is an Azure and SAP component, not part of the operating system, so the OS vendor doesn't support it.", fr: "L'extension est un composant Azure et SAP, pas une partie du système d'exploitation : l'éditeur de l'OS ne la prend pas en charge." }
        d: { en: "Azure Monitor for SAP solutions is a separate monitoring service; it isn't the support channel of the extension.", fr: "Azure Monitor pour solutions SAP est un service de supervision distinct ; ce n'est pas le canal de support de l'extension." }
    references:
      - title: Implement the Azure VM extension for SAP solutions
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap

  # ------------------------------------------------------------------ 4
  - id: az120-qz-21-04
    objective: "2.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. has an Azure Compute Gallery named **galSAP** in a subscription named **Sub-Shared**. galSAP contains image version 1.2.0 of a hardened SLES for SAP Applications image, replicated to West Europe.

        The SAP team must deploy application servers from this image version in a subscription named **Sub-SAP-PRD** in West Europe, in the same Microsoft Entra tenant. The team's deployment identity already has the Contributor role on Sub-SAP-PRD. The image must not be visible outside Fabrikam, and the solution must minimize administrative effort.

        What should you do?
      fr: |
        Fabrikam, Inc. dispose d'une galerie de calcul Azure nommée **galSAP** dans un abonnement nommé **Sub-Shared**. galSAP contient la version d'image 1.2.0 d'une image SLES for SAP Applications renforcée, répliquée dans West Europe.

        L'équipe SAP doit déployer des serveurs d'applications à partir de cette version d'image dans un abonnement nommé **Sub-SAP-PRD** dans West Europe, dans le même locataire Microsoft Entra. L'identité de déploiement de l'équipe a déjà le rôle Contributor sur Sub-SAP-PRD. L'image ne doit pas être visible hors de Fabrikam, et la solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add Sub-SAP-PRD as a replication target of image version 1.2.0 in galSAP.", fr: "Ajouter Sub-SAP-PRD comme cible de réplication de la version d'image 1.2.0 dans galSAP." } }
        - { id: b, text: { en: "Share galSAP as a community gallery, and deploy the VMs from its public name.", fr: "Partager galSAP comme galerie communautaire, puis déployer les machines virtuelles à partir de son nom public." } }
        - { id: c, text: { en: "Grant the deployment identity Reader on galSAP, and deploy by using the image version ID.", fr: "Accorder à l'identité de déploiement le rôle Reader sur galSAP, puis déployer à l'aide de l'ID de la version d'image." } }
        - { id: d, text: { en: "Export the OS disk of the image version to a VHD, and create a managed image in Sub-SAP-PRD.", fr: "Exporter le disque de système d'exploitation de la version d'image vers un VHD, puis créer une image managée dans Sub-SAP-PRD." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Image versions are replicated across regions within one subscription and used from other subscriptions through Azure RBAC. With read access on the gallery (or the image definition), the deployment identity references the image version ID from Sub-SAP-PRD, and the image stays private to the identities you choose.
        fr: |
          Les versions d'image se répliquent entre régions au sein d'un abonnement et s'utilisent depuis d'autres abonnements grâce à Azure RBAC. Avec un accès en lecture à la galerie (ou à la définition d'image), l'identité de déploiement référence l'ID de la version d'image depuis Sub-SAP-PRD, et l'image reste privée pour les identités que vous choisissez.
      options:
        a: { en: "Replication targets are regions, not subscriptions: image versions can't be replicated to another subscription.", fr: "Les cibles de réplication sont des régions, pas des abonnements : les versions d'image ne peuvent pas être répliquées vers un autre abonnement." }
        b: { en: "A community gallery shares the image publicly with all Azure users, which breaks the visibility requirement.", fr: "Une galerie communautaire partage l'image publiquement avec tous les utilisateurs Azure, ce qui enfreint l'exigence de visibilité." }
        d: { en: "Copying the image outside the gallery adds work and a second image to maintain, while RBAC sharing already meets the need.", fr: "Copier l'image hors de la galerie ajoute du travail et une seconde image à maintenir, alors que le partage RBAC répond déjà au besoin." }
    references:
      - title: Share VM images in a compute gallery - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries

  # ------------------------------------------------------------------ 5
  - id: az120-qz-21-05
    objective: "2.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys deploys SAP HANA VMs with Bicep. The VM resource **hdbprd01** sets `zones: [ '1' ]` and also sets `availabilitySet: { id: avsetHana.id }`. The deployment fails.

        hdbprd01 must be a zonal VM in zone 1, so that it can replicate to a second HANA VM in zone 2.

        How should you fix the Bicep file?
      fr: |
        Tailspin Toys déploie des machines virtuelles SAP HANA avec Bicep. La ressource de machine virtuelle **hdbprd01** définit `zones: [ '1' ]` et définit aussi `availabilitySet: { id: avsetHana.id }`. Le déploiement échoue.

        hdbprd01 doit être une machine virtuelle zonale dans la zone 1, afin de pouvoir répliquer vers une seconde machine virtuelle HANA dans la zone 2.

        Comment devez-vous corriger le fichier Bicep ?
    body:
      options:
        - { id: a, text: { en: "Keep both properties, and add a `proximityPlacementGroup` property to hdbprd01.", fr: "Conserver les deux propriétés, puis ajouter une propriété `proximityPlacementGroup` à hdbprd01." } }
        - { id: b, text: { en: "Keep both properties, and add `zones: [ '1' ]` to the availability set resource.", fr: "Conserver les deux propriétés, puis ajouter `zones: [ '1' ]` à la ressource de groupe à haute disponibilité." } }
        - { id: c, text: { en: "Remove `zones`, and keep the VM in the availability set to get zone redundancy.", fr: "Supprimer `zones`, puis garder la machine virtuelle dans le groupe à haute disponibilité pour obtenir la redondance de zone." } }
        - { id: d, text: { en: "Remove the `availabilitySet` property, and keep `zones: [ '1' ]` on hdbprd01.", fr: "Supprimer la propriété `availabilitySet`, puis conserver `zones: [ '1' ]` sur hdbprd01." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Availability zones and availability sets are mutually exclusive for a VM: a VM can be assigned to a zone or to an availability set, never both. Because the requirement is a zonal VM in zone 1, you remove `availabilitySet` and keep `zones`.
        fr: |
          Les zones de disponibilité et les groupes à haute disponibilité s'excluent mutuellement pour une machine virtuelle : une machine virtuelle peut être affectée à une zone ou à un groupe à haute disponibilité, jamais aux deux. Comme l'exigence est une machine virtuelle zonale dans la zone 1, vous supprimez `availabilitySet` et conservez `zones`.
      options:
        a: { en: "A proximity placement group lets zonal VMs and VMs of an availability set be combined in one design, but a single VM still can't have both properties.", fr: "Un groupe de placement de proximité permet de combiner dans une conception des machines virtuelles zonales et celles d'un groupe à haute disponibilité, mais une même machine virtuelle ne peut toujours pas avoir les deux propriétés." }
        b: { en: "An availability set lines up its VMs within a single datacenter and has no zone property; the conflict on the VM remains.", fr: "Un groupe à haute disponibilité aligne ses machines virtuelles dans un seul centre de données et n'a pas de propriété de zone ; le conflit sur la machine virtuelle subsiste." }
        c: { en: "An availability set doesn't protect against the failure of a zone, and the requirement is a zonal VM in zone 1.", fr: "Un groupe à haute disponibilité ne protège pas contre la défaillance d'une zone, et l'exigence est une machine virtuelle zonale dans la zone 1." }
    references:
      - title: Plan and implement an SAP deployment on Azure
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
      - title: SAP workload configurations with Azure Availability Zones
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones

  # ------------------------------------------------------------------ 6
  - id: az120-qz-21-06
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank runs SAP on two Azure VMs:

        - **VM1** runs Windows Server 2022 and an SAP NetWeaver application server. It has the standard version of the Azure VM extension for SAP solutions. Last week, the team resized VM1 and attached two new data disks.
        - **VM2** runs SUSE Linux Enterprise Server for SAP Applications 15 SP5 and SAP HANA. The team will install the extension on VM2 with Azure PowerShell.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank exécute SAP sur deux machines virtuelles Azure :

        - **VM1** exécute Windows Server 2022 et un serveur d'applications SAP NetWeaver. Elle dispose de la version standard de l'extension de machine virtuelle Azure pour les solutions SAP. La semaine dernière, l'équipe a redimensionné VM1 et attaché deux nouveaux disques de données.
        - **VM2** exécute SUSE Linux Enterprise Server for SAP Applications 15 SP5 et SAP HANA. L'équipe installera l'extension sur VM2 avec Azure PowerShell.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The team should run `Set-AzVMAEMExtension` again for VM1 to update the configuration of the extension.", fr: "L'équipe doit exécuter de nouveau `Set-AzVMAEMExtension` pour VM1 afin de mettre à jour la configuration de l'extension." } }
        - { id: s2, text: { en: "For VM2, the standard version of the extension is as valid a choice as the new version.", fr: "Pour VM2, la version standard de l'extension est un choix aussi valable que la nouvelle version." } }
        - { id: s3, text: { en: "The account that runs `Set-AzVMAEMExtension -InstallNewExtension` for VM2 needs Owner on the resource group or on the VM, its disks and its NICs.", fr: "Le compte qui exécute `Set-AzVMAEMExtension -InstallNewExtension` pour VM2 a besoin du rôle Owner sur le groupe de ressources ou sur la machine virtuelle, ses disques et ses cartes réseau." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          With the standard version, you update the configuration of the extension after you change the VM size, attach or remove data disks, or add network interfaces, by running `Set-AzVMAEMExtension` again. The new version is the one to choose on SUSE SLES 15 or later. Installing it with Azure PowerShell requires Owner privileges over the resource group or the individual resources, because the cmdlet gives the VM identity read access to them.
        fr: |
          Avec la version standard, vous mettez à jour la configuration de l'extension après avoir changé la taille de la machine virtuelle, attaché ou retiré des disques de données, ou ajouté des interfaces réseau, en exécutant de nouveau `Set-AzVMAEMExtension`. La nouvelle version est celle à choisir sur SUSE SLES 15 ou version ultérieure. L'installer avec Azure PowerShell exige des privilèges Owner sur le groupe de ressources ou sur les ressources individuelles, car l'applet de commande donne à l'identité de la machine virtuelle un accès en lecture à celles-ci.
      options:
        s2: { en: "Microsoft lists SLES 15 or later among the cases where you choose the new version of the extension.", fr: "Microsoft liste SLES 15 ou version ultérieure parmi les cas où vous choisissez la nouvelle version de l'extension." }
    references:
      - title: Standard version of Azure VM extension for SAP solutions
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap-standard
      - title: New version of Azure VM extension for SAP solutions
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap-new

  # ------------------------------------------------------------------ 7
  - id: az120-qz-21-07
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has a Windows Server VM named **vmsapref01** that contains the SAP prerequisites and corporate agents for SAP application servers. Developers use vmsapref01 every day as a test server. Its drives are encrypted inside the guest operating system.

        You need to provide an image version in an Azure Compute Gallery to deploy 30 application servers. The solution must meet the following requirements:

        - vmsapref01 must remain usable as a test server.
        - Each new VM must receive its own computer name and Windows SID during provisioning.

        What should you do?
      fr: |
        Northwind Traders dispose d'une machine virtuelle Windows Server nommée **vmsapref01** qui contient les prérequis SAP et les agents de l'entreprise pour les serveurs d'applications SAP. Les développeurs utilisent vmsapref01 chaque jour comme serveur de test. Ses lecteurs sont chiffrés dans le système d'exploitation invité.

        Vous devez fournir une version d'image dans une galerie de calcul Azure pour déployer 30 serveurs d'applications. La solution doit répondre aux exigences suivantes :

        - vmsapref01 doit rester utilisable comme serveur de test.
        - Chaque nouvelle machine virtuelle doit recevoir son propre nom d'ordinateur et son propre SID Windows lors de l'approvisionnement.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Capture a specialized image version directly from vmsapref01, without generalizing it, and deploy the 30 VMs from that version.", fr: "Capturer une version d'image spécialisée directement à partir de vmsapref01, sans la généraliser, puis déployer les 30 machines virtuelles à partir de cette version." } }
        - { id: b, text: { en: "Run Sysprep on vmsapref01, mark it as generalized, capture the image version, and then start vmsapref01 again.", fr: "Exécuter Sysprep sur vmsapref01, la marquer comme généralisée, capturer la version d'image, puis redémarrer vmsapref01." } }
        - { id: c, text: { en: "Create a VM from a snapshot of the OS disk, decrypt its drives, run Sysprep on it, mark it as generalized, and capture it.", fr: "Créer une machine virtuelle à partir d'un instantané du disque de système d'exploitation, déchiffrer ses lecteurs, y exécuter Sysprep, la marquer comme généralisée, puis la capturer." } }
        - { id: d, text: { en: "Create a VM from a snapshot of the OS disk, run Sysprep on it with its drives still encrypted, mark it as generalized, and capture it.", fr: "Créer une machine virtuelle à partir d'un instantané du disque de système d'exploitation, y exécuter Sysprep avec ses lecteurs encore chiffrés, la marquer comme généralisée, puis la capturer." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Generalizing isn't reversible: a VM marked as generalized can't be restarted. To keep the original VM working, Microsoft says to create a snapshot of the OS disk, create a VM from the snapshot, and generalize that copy. Sysprep requires fully decrypted drives, and a generalized image gives each new VM its own computer name and SID.
        fr: |
          La généralisation n'est pas réversible : une machine virtuelle marquée comme généralisée ne peut pas être redémarrée. Pour garder la machine virtuelle d'origine opérationnelle, Microsoft indique de créer un instantané du disque de système d'exploitation, de créer une machine virtuelle à partir de l'instantané, puis de généraliser cette copie. Sysprep exige des lecteurs entièrement déchiffrés, et une image généralisée donne à chaque nouvelle machine virtuelle son propre nom d'ordinateur et son propre SID.
      options:
        a: { en: "A specialized image keeps machine-specific information: the 30 VMs would get the computer name of vmsapref01 instead of their own.", fr: "Une image spécialisée conserve les informations propres à la machine : les 30 machines virtuelles recevraient le nom d'ordinateur de vmsapref01 au lieu du leur." }
        b: { en: "After Sysprep and the generalized mark, vmsapref01 can't be restarted, so it would no longer serve as a test server.", fr: "Après Sysprep et le marquage comme généralisée, vmsapref01 ne peut plus être redémarrée : elle ne servirait plus de serveur de test." }
        d: { en: "Sysprep requires the drives to be fully decrypted; encryption must be disabled before you run it.", fr: "Sysprep exige des lecteurs entièrement déchiffrés ; le chiffrement doit être désactivé avant de l'exécuter." }
    references:
      - title: Deprovision or generalize a VM before creating an image - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/generalize
      - title: Share VM images in a compute gallery - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/shared-image-galleries

  # ------------------------------------------------------------------ 8
  - id: az120-qz-21-08
    objective: "2.1.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware, Inc. will deploy its development, quality assurance and production SAP landscapes with SAP Deployment Automation Framework. Each environment has its own spoke subscription, and the shared services run in a hub subscription.

        You have the following requirements:

        - A compromised deployment credential of one environment must not allow deployments in another environment.
        - The VM and SAP account passwords of the development systems must be stored separately from those of the production systems.
        - The number of deployer VMs must be minimized.

        Which two actions should you include in the design? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware, Inc. va déployer ses paysages SAP de développement, d'assurance qualité et de production avec SAP Deployment Automation Framework. Chaque environnement dispose de son propre abonnement spoke, et les services partagés s'exécutent dans un abonnement hub.

        Vous avez les exigences suivantes :

        - Des informations d'identification de déploiement compromises d'un environnement ne doivent pas permettre de déployer dans un autre environnement.
        - Les mots de passe des machines virtuelles et des comptes SAP des systèmes de développement doivent être stockés séparément de ceux des systèmes de production.
        - Le nombre de machines virtuelles de déploiement (deployer) doit être réduit au minimum.

        Quelles sont les deux actions à inclure dans la conception ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Deploy one workload zone per environment, each with its own key vault for the credentials of its systems.", fr: "Déployer une zone de charge de travail par environnement, chacune avec son propre coffre de clés pour les informations d'identification de ses systèmes." } }
        - { id: b, text: { en: "Store the VM and SAP account credentials of every system in the key vault of the SAP library.", fr: "Stocker les informations d'identification des machines virtuelles et des comptes SAP de chaque système dans le coffre de clés de la bibliothèque SAP." } }
        - { id: c, text: { en: "Deploy a separate control plane in the spoke subscription of each environment.", fr: "Déployer un plan de contrôle distinct dans l'abonnement spoke de chaque environnement." } }
        - { id: d, text: { en: "Configure a dedicated deployment credential for each workload zone.", fr: "Configurer des informations d'identification de déploiement dédiées pour chaque zone de charge de travail." } }
        - { id: e, text: { en: "Use one service principal that has the Owner role on the three spoke subscriptions.", fr: "Utiliser un seul principal de service qui a le rôle Owner sur les trois abonnements spoke." } }
    answer: { optionIds: [ a, d ] }
    explanation:
      correct:
        en: |
          A workload zone partitions the SAP systems into environments and provides their shared resources, including the Azure Key Vault that holds the system credentials (VMs and SAP accounts), so one zone per environment keeps the secrets apart. Microsoft recommends a dedicated deployment credential for each workload zone, which limits a compromised credential to its own environment, while one control plane in the hub serves all three zones.
        fr: |
          Une zone de charge de travail partitionne les systèmes SAP en environnements et fournit leurs ressources partagées, dont l'Azure Key Vault qui contient les informations d'identification des systèmes (machines virtuelles et comptes SAP) : une zone par environnement sépare donc les secrets. Microsoft recommande des informations d'identification de déploiement dédiées pour chaque zone de charge de travail, ce qui limite des informations compromises à leur propre environnement, tandis qu'un seul plan de contrôle dans le hub sert les trois zones.
      options:
        b: { en: "The SAP library stores the Terraform state files and the SAP media; the system credentials belong in the key vault of each workload zone.", fr: "La bibliothèque SAP stocke les fichiers d'état Terraform et les médias SAP ; les informations d'identification des systèmes vont dans le coffre de clés de chaque zone de charge de travail." }
        c: { en: "One control plane, typically in the hub, can deploy every environment; three control planes would triple the deployer VMs.", fr: "Un seul plan de contrôle, en général dans le hub, peut déployer tous les environnements ; trois plans de contrôle tripleraient les machines virtuelles de déploiement." }
        e: { en: "A single credential for all subscriptions is exactly what lets one compromise reach every environment.", fr: "Des informations d'identification uniques pour tous les abonnements sont justement ce qui permet à une compromission d'atteindre tous les environnements." }
    references:
      - title: About SAP Deployment Automation Framework
        url: https://learn.microsoft.com/en-us/azure/sap/automation/deployment-framework

  # ------------------------------------------------------------------ 9
  - id: az120-qz-21-09
    objective: "2.1.7"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Contoso, Ltd. has four SAP automation needs on Azure:

        - **Need 1**: Deploy a new SAP S/4HANA 2022 system on SAP HANA scale-up, through a guided Azure portal experience that also installs the SAP software.
        - **Need 2**: Start, stop and run quality checks from Azure on an existing SAP NetWeaver ABAP system that runs on Windows Server with SQL Server and that the Basis team installed manually.
        - **Need 3**: Deploy and install SAP NetWeaver systems on an AnyDB database, from an open-source pipeline that the team customizes with its Terraform and Ansible skills.
        - **Need 4**: Create only the VMs, disks and network interfaces of a new system from Contoso's existing template pipeline; the Basis team installs SAP later.

        Which tool should you use for each need? To answer, drag the appropriate tools to the correct needs. Each tool may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. a quatre besoins d'automatisation SAP sur Azure :

        - **Besoin 1** : déployer un nouveau système SAP S/4HANA 2022 sur SAP HANA en scale-up, via une expérience guidée du portail Azure qui installe aussi le logiciel SAP.
        - **Besoin 2** : démarrer, arrêter et exécuter des contrôles de qualité depuis Azure sur un système SAP NetWeaver ABAP existant qui s'exécute sur Windows Server avec SQL Server et que l'équipe Basis a installé manuellement.
        - **Besoin 3** : déployer et installer des systèmes SAP NetWeaver sur une base de données AnyDB, à partir d'un pipeline open source que l'équipe personnalise avec ses compétences Terraform et Ansible.
        - **Besoin 4** : créer uniquement les machines virtuelles, les disques et les interfaces réseau d'un nouveau système à partir du pipeline de modèles existant de Contoso ; l'équipe Basis installe SAP plus tard.

        Quel outil devez-vous utiliser pour chaque besoin ? Pour répondre, faites glisser les outils appropriés vers les besoins correspondants. Chaque outil peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: acss, text: { en: "Azure Center for SAP solutions", fr: "Centre Azure pour les solutions SAP" } }
        - { id: sdaf, text: "SAP Deployment Automation Framework" }
        - { id: bicep, text: { en: "Bicep or ARM templates", fr: "Modèles Bicep ou ARM" } }
        - { id: migrate, text: "Azure Migrate" }
        - { id: ams, text: { en: "Azure Monitor for SAP solutions", fr: "Azure Monitor pour solutions SAP" } }
      targets:
        - { id: n1, text: { en: "Need 1", fr: "Besoin 1" } }
        - { id: n2, text: { en: "Need 2", fr: "Besoin 2" } }
        - { id: n3, text: { en: "Need 3", fr: "Besoin 3" } }
        - { id: n4, text: { en: "Need 4", fr: "Besoin 4" } }
    answer:
      mapping: { n1: acss, n2: acss, n3: sdaf, n4: bicep }
    explanation:
      correct:
        en: |
          Azure Center for SAP solutions deploys S/4HANA on HANA scale-up through a guided experience, and it also registers existing NetWeaver or ABAP systems on Windows, SUSE or RHEL with SQL Server and other databases, which then get start and stop, health and quality checks. SAP Deployment Automation Framework is the open-source Terraform and Ansible tool that also covers NetWeaver with AnyDB, which the deployment of Azure Center for SAP solutions doesn't (its database is fixed to HANA). Bicep or ARM templates deploy infrastructure only, which fits an existing template pipeline.
        fr: |
          Le Centre Azure pour les solutions SAP déploie S/4HANA sur HANA en scale-up via une expérience guidée, et il inscrit aussi des systèmes NetWeaver ou ABAP existants sous Windows, SUSE ou RHEL avec SQL Server et d'autres bases, qui obtiennent alors démarrage et arrêt, état d'intégrité et contrôles de qualité. SAP Deployment Automation Framework est l'outil open source Terraform et Ansible qui couvre aussi NetWeaver avec AnyDB, ce que le déploiement du Centre Azure pour les solutions SAP ne fait pas (sa base de données est fixée à HANA). Les modèles Bicep ou ARM ne déploient que l'infrastructure, ce qui convient à un pipeline de modèles existant.
      options:
        migrate: { en: "Azure Migrate assesses and migrates existing servers; it doesn't deploy new SAP systems or manage SAP instances.", fr: "Azure Migrate évalue et migre des serveurs existants ; il ne déploie pas de nouveaux systèmes SAP et ne gère pas d'instances SAP." }
        ams: { en: "Azure Monitor for SAP solutions collects monitoring data; it doesn't start or stop SAP systems or deploy them.", fr: "Azure Monitor pour solutions SAP collecte des données de supervision ; il ne démarre, n'arrête ni ne déploie de systèmes SAP." }
    references:
      - title: Deploy an S/4HANA infrastructure
        url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/deploy-s4hana
      - title: Register an existing SAP system
        url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/register-existing-system

  # ------------------------------------------------------------------ 10
  - id: az120-qz-21-10
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation is designing a production SAP S/4HANA system in an Azure region that has three availability zones. The SAP HANA database will run scale-up on an M-family VM size that is listed in the SAP HANA hardware directory. Two HANA VMs will use HANA System Replication with automatic failover, one VM per zone.

        The team has two findings:

        - `az vm list-skus` shows that the M-family size is offered in zones 1 and 2 only.
        - `niping` tests between Edsv5 VMs show the lowest network latency between zones 1 and 3.

        You need to choose the placement of the HANA VMs.

        What should you do?
      fr: |
        Adatum Corporation conçoit un système SAP S/4HANA de production dans une région Azure qui dispose de trois zones de disponibilité. La base de données SAP HANA s'exécutera en scale-up sur une taille de machine virtuelle de la famille M listée dans l'annuaire matériel SAP HANA. Deux machines virtuelles HANA utiliseront HANA System Replication avec basculement automatique, une machine virtuelle par zone.

        L'équipe a deux constats :

        - `az vm list-skus` montre que la taille de la famille M n'est proposée que dans les zones 1 et 2.
        - Des tests `niping` entre des machines virtuelles Edsv5 montrent la latence réseau la plus faible entre les zones 1 et 3.

        Vous devez choisir l'emplacement des machines virtuelles HANA.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Place the HANA VMs in zones 1 and 3, and request a vCPU quota increase for the M-family size in zone 3.", fr: "Placer les machines virtuelles HANA dans les zones 1 et 3, puis demander une augmentation du quota de processeurs virtuels pour la taille de la famille M dans la zone 3." } }
        - { id: b, text: { en: "Place the HANA VMs in zones 1 and 2, and measure the latency between these zones again with VMs of the M-family size.", fr: "Placer les machines virtuelles HANA dans les zones 1 et 2, puis mesurer de nouveau la latence entre ces zones avec des machines virtuelles de la taille de la famille M." } }
        - { id: c, text: { en: "Place the primary HANA VM in zone 1 on the M-family size and the secondary in zone 3 on an E-family size.", fr: "Placer la machine virtuelle HANA principale dans la zone 1 sur la taille de la famille M et la secondaire dans la zone 3 sur une taille de la famille E." } }
        - { id: d, text: { en: "Place both HANA VMs in zone 3 in an availability set, inside a proximity placement group anchored to zone 1.", fr: "Placer les deux machines virtuelles HANA dans la zone 3 dans un groupe à haute disponibilité, à l'intérieur d'un groupe de placement de proximité ancré à la zone 1." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Some VM sizes are available in only two of the three zones of a region, so the zone pair of the database is limited to the zones that offer the certified M-family size. Microsoft also says to measure latency with the VM size of the database instance, because results from other VM families don't represent it; the latency between zones 1 and 2 is then checked with the right size before the other tiers are placed.
        fr: |
          Certaines tailles de machine virtuelle ne sont disponibles que dans deux des trois zones d'une région : la paire de zones de la base de données se limite donc aux zones qui proposent la taille certifiée de la famille M. Microsoft indique aussi de mesurer la latence avec la taille de machine virtuelle de l'instance de base de données, car les résultats d'autres familles ne la représentent pas ; la latence entre les zones 1 et 2 est alors vérifiée avec la bonne taille avant le placement des autres couches.
      options:
        a: { en: "A quota increase raises the vCPUs you may use; it doesn't make a VM size available in a zone where Azure doesn't offer it.", fr: "Une augmentation de quota relève le nombre de processeurs virtuels utilisables ; elle ne rend pas une taille disponible dans une zone où Azure ne la propose pas." }
        c: { en: "Both replicas must hold the same in-memory database and be certified for production HANA: a HANA System Replication pair with automatic failover uses the same VM size.", fr: "Les deux réplicas doivent contenir la même base en mémoire et être certifiés pour HANA en production : une paire HANA System Replication avec basculement automatique utilise la même taille de machine virtuelle." }
        d: { en: "Zone 3 doesn't offer the size, and an availability set keeps both VMs in one zone, which doesn't meet the one-VM-per-zone design.", fr: "La zone 3 ne propose pas la taille, et un groupe à haute disponibilité garde les deux machines virtuelles dans une seule zone, ce qui ne respecte pas la conception d'une machine virtuelle par zone." }
    references:
      - title: SAP workload configurations with Azure Availability Zones
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones
