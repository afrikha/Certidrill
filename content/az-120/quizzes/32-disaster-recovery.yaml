chapter: 32-disaster-recovery
questions:
  # ------------------------------------------------------------------ 1
  - id: az120-qz-32-01
    objective: "3.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso enables Azure Site Recovery replication of its SAP application server VMs from West Europe to North Europe. During replication, Site Recovery uses a cache storage account.

        Where is the cache storage account, and what is it used for?
      fr: |
        Contoso active la réplication Azure Site Recovery de ses machines virtuelles de serveur d'applications SAP de la région Europe Ouest vers la région Europe Nord. Pendant la réplication, Site Recovery utilise un compte de stockage de cache.

        Où se trouve le compte de stockage de cache, et à quoi sert-il ?
    body:
      options:
        - { id: a, text: { en: "In West Europe; disk writes are stored in it before they're sent to the target region.", fr: "En Europe Ouest ; les écritures sur disque y sont stockées avant d'être envoyées vers la région cible." } }
        - { id: b, text: { en: "In North Europe; it holds the replica disks that the failed-over VMs will use.", fr: "En Europe Nord ; il contient les disques réplicas qu'utiliseront les machines virtuelles basculées." } }
        - { id: c, text: { en: "In North Europe; it stores the VMs that are created during a test failover.", fr: "En Europe Nord ; il stocke les machines virtuelles créées pendant un test de basculement." } }
        - { id: d, text: { en: "In the Recovery Services vault; it keeps the recovery points of each VM.", fr: "Dans le coffre Recovery Services ; il conserve les points de récupération de chaque machine virtuelle." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The cache storage account is in the source region. Disk writes are transferred to it immediately and processed from there to the target, which keeps the impact on the production VMs minimal.
        fr: |
          Le compte de stockage de cache se trouve dans la région source. Les écritures sur disque y sont transférées immédiatement puis traitées vers la cible, ce qui limite l'impact sur les machines virtuelles de production.
      options:
        b: { en: "The replicated data lands on managed replica disks in the target region, not in the cache storage account, which stays in the source region.", fr: "Les données répliquées aboutissent sur des disques réplicas managés dans la région cible, pas dans le compte de stockage de cache, qui reste dans la région source." }
        c: { en: "Test failover VMs are created from the replica disks in the network you choose; the cache account isn't involved and isn't in the target region.", fr: "Les machines virtuelles de test de basculement sont créées à partir des disques réplicas dans le réseau choisi ; le compte de cache n'intervient pas et ne se trouve pas dans la région cible." }
        d: { en: "The cache is a storage account in the source region, not a component of the vault, and it stages changes rather than keeping recovery points.", fr: "Le cache est un compte de stockage de la région source, et non un composant du coffre ; il met les modifications en attente au lieu de conserver des points de récupération." }
    references:
      - title: Azure to Azure disaster recovery architecture in Azure Site Recovery - Azure Site Recovery
        url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-architecture

  # ------------------------------------------------------------------ 2
  - id: az120-qz-32-02
    objective: "3.2.4"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Fabrikam backs up the SAP HANA database of its production system in West Europe with Azure Backup streaming backups. The backup policy runs a log backup every hour. The Recovery Services vault uses geo-redundant storage (GRS), and Cross Region Restore is enabled.

        Which recovery point objective (RPO) should Fabrikam document for a restore of the database in the paired region?
      fr: |
        Fabrikam sauvegarde la base de données SAP HANA de son système de production en Europe Ouest avec les sauvegardes en streaming de Sauvegarde Azure. La stratégie de sauvegarde exécute une sauvegarde des journaux toutes les heures. Le coffre Recovery Services utilise un stockage géoredondant (GRS), et la restauration interrégion (CRR) est activée.

        Quel objectif de point de récupération (RPO) Fabrikam doit-il documenter pour une restauration de la base de données dans la région jumelée ?
    body:
      options:
        - { id: a, text: { en: "1 hour", fr: "1 heure" } }
        - { id: b, text: { en: "12 hours", fr: "12 heures" } }
        - { id: c, text: { en: "13 hours", fr: "13 heures" } }
        - { id: d, text: { en: "24 hours", fr: "24 heures" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Backup data becomes available in the secondary region with an RPO of 12 hours. With Cross Region Restore, the RPO for an SAP HANA database in the secondary region is therefore 12 hours plus the log backup frequency: 12 hours + 1 hour = 13 hours.
        fr: |
          Les données de sauvegarde deviennent disponibles dans la région secondaire avec un RPO de 12 heures. Avec la restauration interrégion, le RPO d'une base de données SAP HANA dans la région secondaire est donc de 12 heures plus la fréquence des sauvegardes des journaux : 12 heures + 1 heure = 13 heures.
      options:
        a: { en: "1 hour is the RPO of a restore in the primary region, where the log backups are available as soon as they complete.", fr: "1 heure est le RPO d'une restauration dans la région primaire, où les sauvegardes des journaux sont disponibles dès leur fin." }
        b: { en: "12 hours is the delay for backup data to reach the secondary region; the log backup frequency adds to it.", fr: "12 heures est le délai pour que les données de sauvegarde atteignent la région secondaire ; la fréquence des sauvegardes des journaux s'y ajoute." }
        d: { en: "24 hours isn't the documented figure; the RPO in the secondary region is 12 hours plus the log backup frequency.", fr: "24 heures n'est pas la valeur documentée ; le RPO dans la région secondaire est de 12 heures plus la fréquence des sauvegardes des journaux." }
    references:
      - title: Restore SAP HANA databases on Azure VMs - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-restore

  # ------------------------------------------------------------------ 3
  - id: az120-qz-32-03
    objective: "3.2.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware assigns the built-in policy "Configure backup on virtual machines with a given tag to an existing recovery services vault in the same location" to its SAP subscription for the West Europe location, with the **deployIfNotExists** effect. VMs tagged **Backup=SAP** that are created after the assignment are protected automatically. However, the 40 tagged application server VMs that existed before the assignment still have no backup.

        You need to protect these existing VMs with the least administrative effort. What should you do?
      fr: |
        Litware attribue la stratégie intégrée « Configure backup on virtual machines with a given tag to an existing recovery services vault in the same location » à son abonnement SAP pour l'emplacement Europe Ouest, avec l'effet **deployIfNotExists**. Les machines virtuelles étiquetées **Backup=SAP** créées après l'attribution sont protégées automatiquement. En revanche, les 40 machines virtuelles de serveur d'applications étiquetées qui existaient avant l'attribution n'ont toujours aucune sauvegarde.

        Vous devez protéger ces machines virtuelles existantes avec un minimum d'effort administratif. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a remediation task for the existing policy assignment.", fr: "Créer une tâche de correction pour l'attribution de stratégie existante." } }
        - { id: b, text: { en: "Run az policy state trigger-scan on the SAP subscription.", fr: "Exécuter az policy state trigger-scan sur l'abonnement SAP." } }
        - { id: c, text: { en: "Assign the same policy again at the management group scope.", fr: "Attribuer à nouveau la même stratégie à l'étendue du groupe d'administration." } }
        - { id: d, text: { en: "Assign the policy \"Azure Backup should be enabled for Virtual Machines\".", fr: "Attribuer la stratégie « Azure Backup should be enabled for Virtual Machines »." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A deployIfNotExists assignment acts automatically on new or updated resources only. For resources that already existed, Azure Policy uses remediation: a remediation task for the assignment deploys the backup configuration on the noncompliant tagged VMs, without configuring each VM by hand.
        fr: |
          Une attribution deployIfNotExists n'agit automatiquement que sur les ressources nouvelles ou mises à jour. Pour les ressources qui existaient déjà, Azure Policy utilise la correction : une tâche de correction pour l'attribution déploie la configuration de sauvegarde sur les machines virtuelles étiquetées non conformes, sans configurer chaque machine virtuelle à la main.
      options:
        b: { en: "trigger-scan only starts a new compliance evaluation; it reports the VMs as noncompliant but doesn't deploy the backup configuration.", fr: "trigger-scan ne fait que lancer une nouvelle évaluation de conformité ; il signale les machines virtuelles comme non conformes mais ne déploie pas la configuration de sauvegarde." }
        c: { en: "This policy is assigned to one subscription and one location at a time; the management group scope isn't supported, and existing VMs would still need remediation.", fr: "Cette stratégie s'attribue à un abonnement et un emplacement à la fois ; l'étendue du groupe d'administration n'est pas prise en charge, et les machines virtuelles existantes auraient toujours besoin d'une correction." }
        d: { en: "This built-in policy only audits VMs that have no backup; it doesn't configure any protection.", fr: "Cette stratégie intégrée ne fait qu'auditer les machines virtuelles sans sauvegarde ; elle ne configure aucune protection." }
    references:
      - title: Audit and enforce backup during virtual machine creation automatically using Azure Policy
        url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-auto-enable-backup

  # ------------------------------------------------------------------ 4
  - id: az120-qz-32-04
    objective: "3.2.7"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum protects an SAP application server VM named **app01** with Azure Backup. app01 is an unencrypted VM with managed disks. After a faulty operating system patch last night, the SAP instance on app01 no longer starts correctly.

        You need to return the OS and data disks of app01 to the recovery point taken before the patch. The existing VM resource must be kept, with its network interface and private IP address, and the solution must minimize administrative effort.

        Which restore option should you use?
      fr: |
        Adatum protège une machine virtuelle de serveur d'applications SAP nommée **app01** avec Sauvegarde Azure. app01 est une machine virtuelle non chiffrée avec des disques managés. Après l'application d'un correctif de système d'exploitation défectueux la nuit dernière, l'instance SAP d'app01 ne démarre plus correctement.

        Vous devez ramener les disques de système d'exploitation et de données d'app01 au point de récupération pris avant le correctif. La ressource de machine virtuelle existante doit être conservée, avec sa carte réseau et son adresse IP privée, et la solution doit réduire au minimum l'effort administratif.

        Quelle option de restauration devez-vous utiliser ?
    body:
      options:
        - { id: a, text: "Create new virtual machine" }
        - { id: b, text: "Restore disks" }
        - { id: c, text: "Replace existing" }
        - { id: d, text: "Cross Region Restore" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Replace existing restores the disks of the selected recovery point and swaps them for the current disks of the VM, which must still exist; the VM resource itself is kept. Azure Backup first takes a snapshot of the current VM, and the original disks remain in the resource group. The option is supported for unencrypted managed VMs.
        fr: |
          Replace existing restaure les disques du point de récupération choisi et les substitue aux disques actuels de la machine virtuelle, qui doit toujours exister ; la ressource de machine virtuelle elle-même est conservée. Sauvegarde Azure prend d'abord un instantané de la machine virtuelle actuelle, et les disques d'origine restent dans le groupe de ressources. L'option est prise en charge pour les machines virtuelles managées non chiffrées.
      options:
        a: { en: "Create new virtual machine builds another VM from the recovery point; app01 and its network configuration wouldn't be the restored VM.", fr: "Create new virtual machine crée une autre machine virtuelle à partir du point de récupération ; app01 et sa configuration réseau ne seraient pas la machine virtuelle restaurée." }
        b: { en: "Restore disks only copies the disks to a resource group; you'd still have to swap them into app01 yourself, which adds effort.", fr: "Restore disks ne fait que copier les disques dans un groupe de ressources ; il faudrait encore les substituer vous-même dans app01, ce qui ajoute de l'effort." }
        d: { en: "Cross Region Restore restores in the paired region and doesn't support replacing existing disks.", fr: "Cross Region Restore restaure dans la région jumelée et ne prend pas en charge le remplacement des disques existants." }
    references:
      - title: Restore VMs by using the Azure portal using Azure Backup - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-arm-restore-vms

  # ------------------------------------------------------------------ 5
  - id: az120-qz-32-05
    objective: "3.2.8"
    difficulty: 2
    status: draft
    type: ordering
    stem:
      en: |
        Woodgrove Bank protects the VMs of the application tier of its SAP ERP system with Azure Site Recovery from France Central to France South. The VMs belong to a recovery plan named **rp-erp**. The auditors require a yearly DR drill that doesn't affect production and that leaves no test VMs behind.

        Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Woodgrove Bank protège les machines virtuelles de la couche application de son système SAP ERP avec Azure Site Recovery de France Centre vers France Sud. Les machines virtuelles font partie d'un plan de récupération nommé **rp-erp**. Les auditeurs exigent un exercice annuel de reprise d'activité qui n'affecte pas la production et ne laisse aucune machine virtuelle de test.

        Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 4
      actions:
        - { id: vnet, text: { en: "Create a virtual network in France South that isn't connected to production.", fr: "Créer un réseau virtuel en France Sud qui n'est pas connecté à la production." } }
        - { id: tfo, text: { en: "Run Test Failover on rp-erp, and select a recovery point and the new virtual network.", fr: "Exécuter Test Failover sur rp-erp, puis sélectionner un point de récupération et le nouveau réseau virtuel." } }
        - { id: val, text: { en: "Check that the SAP instances start on the test VMs and that test users can log on.", fr: "Vérifier que les instances SAP démarrent sur les machines virtuelles de test et que des utilisateurs de test peuvent se connecter." } }
        - { id: clean, text: { en: "Run Cleanup test failover on rp-erp, and record the observations in the notes.", fr: "Exécuter Cleanup test failover sur rp-erp, puis consigner les observations dans les notes." } }
        - { id: commit, text: { en: "Commit the failover of rp-erp.", fr: "Valider (Commit) le basculement de rp-erp." } }
        - { id: reprotect, text: { en: "Re-protect the VMs from France South to France Central.", fr: "Reprotéger les machines virtuelles de France Sud vers France Centre." } }
        - { id: disable, text: { en: "Disable the replication of the VMs before the test failover.", fr: "Désactiver la réplication des machines virtuelles avant le test de basculement." } }
    answer:
      sequence: [vnet, tfo, val, clean]
    explanation:
      correct:
        en: |
          A drill uses a non-production network, so you prepare an isolated virtual network first, then run Test Failover on the recovery plan with a recovery point and that network. You validate the SAP system on the test VMs, then run Cleanup test failover: you record your observations in the notes, and the test VMs are deleted. During a test failover, the source VMs keep running.
        fr: |
          Un exercice utilise un réseau hors production : vous préparez donc d'abord un réseau virtuel isolé, puis exécutez Test Failover sur le plan de récupération avec un point de récupération et ce réseau. Vous validez le système SAP sur les machines virtuelles de test, puis exécutez Cleanup test failover : vous consignez vos observations dans les notes, et les machines virtuelles de test sont supprimées. Pendant un test de basculement, les machines virtuelles sources continuent de s'exécuter.
      options:
        commit: { en: "Commit applies to a real failover; a test failover ends with a cleanup, not a commit.", fr: "Commit s'applique à un vrai basculement ; un test de basculement se termine par un nettoyage, pas par une validation." }
        reprotect: { en: "Re-protection follows a real failover to reverse the replication; it isn't part of a drill.", fr: "La reprotection suit un vrai basculement pour inverser la réplication ; elle ne fait pas partie d'un exercice." }
        disable: { en: "A test failover runs from the replicated data; disabling replication would remove the protection that the drill must test.", fr: "Un test de basculement s'exécute à partir des données répliquées ; désactiver la réplication supprimerait la protection que l'exercice doit tester." }
    references:
      - title: Tutorial to run an Azure VM disaster recovery drill with Azure Site Recovery - Azure Site Recovery
        url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-tutorial-dr-drill
      - title: About recovery plans in Azure Site Recovery - Azure Site Recovery
        url: https://learn.microsoft.com/en-us/azure/site-recovery/recovery-plan-overview

  # ------------------------------------------------------------------ 6
  - id: az120-qz-32-06
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware runs several SAP systems in West Europe and is designing their disaster recovery to North Europe. Each database must stay consistent after a failover, and Litware follows Microsoft's DR recommendations for SAP workloads.

        | Component | Description |
        | --- | --- |
        | ERP database | Oracle Database 19c on Azure VMs |
        | Content Server database | SAP MaxDB on an Azure VM |
        | Transport directory | /usr/sap/trans on an NFS share on Azure Files SSD |
        | Central services | ASCS/ERS VMs with managed disks, in a Pacemaker cluster |

        Which DR method should you use for each component? To answer, drag the appropriate methods to the correct components. Each method may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware exécute plusieurs systèmes SAP en Europe Ouest et conçoit leur reprise d'activité vers l'Europe Nord. Chaque base de données doit rester cohérente après un basculement, et Litware suit les recommandations de reprise d'activité de Microsoft pour les charges de travail SAP.

        | Composant | Description |
        | --- | --- |
        | Base de données ERP | Oracle Database 19c sur des machines virtuelles Azure |
        | Base de données du Content Server | SAP MaxDB sur une machine virtuelle Azure |
        | Répertoire de transport | /usr/sap/trans sur un partage NFS sur Azure Files SSD |
        | Services centraux | Machines virtuelles ASCS/ERS avec des disques managés, dans un cluster Pacemaker |

        Quelle méthode de reprise d'activité devez-vous utiliser pour chaque composant ? Pour répondre, faites glisser les méthodes appropriées vers les composants correspondants. Chaque méthode peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: asr, text: "Azure Site Recovery" }
        - { id: dg, text: "Oracle Data Guard (FarSync)" }
        - { id: standby, text: { en: "Standby database", fr: "Base de données de secours (standby)" } }
        - { id: rsync, text: { en: "Custom copy script, for example rsync", fr: "Script de copie personnalisé, par exemple rsync" } }
        - { id: robo, text: "Robocopy" }
        - { id: anf, text: { en: "Azure NetApp Files cross-region replication", fr: "Réplication interrégion d'Azure NetApp Files" } }
        - { id: hsr, text: "HANA System Replication" }
      targets:
        - { id: t_ora, text: { en: "ERP database (Oracle)", fr: "Base de données ERP (Oracle)" } }
        - { id: t_maxdb, text: { en: "Content Server database (MaxDB)", fr: "Base de données du Content Server (MaxDB)" } }
        - { id: t_trans, text: { en: "Transport directory (NFS on Azure Files)", fr: "Répertoire de transport (NFS sur Azure Files)" } }
        - { id: t_ascs, text: { en: "Central services VMs", fr: "Machines virtuelles des services centraux" } }
    answer:
      mapping: { t_ora: dg, t_maxdb: standby, t_trans: rsync, t_ascs: asr }
    explanation:
      correct:
        en: |
          Databases use their native replication, because Site Recovery doesn't guarantee database consistency and has churn limits: Oracle Data Guard (with FarSync) for Oracle and a standby database for SAP MaxDB. An NFS share on Azure Files has no built-in cross-region replication, so a custom script such as rsync copies it. The central services VMs and their managed disks are replicated with Site Recovery, followed by the cluster, load balancer and fencing work in the DR region.
        fr: |
          Les bases de données utilisent leur réplication native, car Site Recovery ne garantit pas la cohérence des bases et a des limites d'évolution des données : Oracle Data Guard (avec FarSync) pour Oracle et une base de données de secours pour SAP MaxDB. Un partage NFS sur Azure Files n'a pas de réplication interrégion intégrée : un script personnalisé comme rsync le copie. Les machines virtuelles des services centraux et leurs disques managés sont répliqués avec Site Recovery, puis le cluster, l'équilibreur de charge et la clôture sont adaptés dans la région de reprise.
      options:
        robo: { en: "Robocopy is the recommended copy tool for SMB shares on Azure Files, not for NFS shares.", fr: "Robocopy est l'outil de copie recommandé pour les partages SMB sur Azure Files, pas pour les partages NFS." }
        anf: { en: "Cross-region replication applies to Azure NetApp Files volumes; the transport directory is on Azure Files.", fr: "La réplication interrégion s'applique aux volumes Azure NetApp Files ; le répertoire de transport est sur Azure Files." }
        hsr: { en: "HANA System Replication is the native method for SAP HANA only; none of these databases is HANA.", fr: "HANA System Replication est la méthode native de SAP HANA uniquement ; aucune de ces bases de données n'est HANA." }
    references:
      - title: Disaster Recovery recommendation for SAP workload
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-sap-guide

  # ------------------------------------------------------------------ 7
  - id: az120-qz-32-07
    objective: "3.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders protects the 24 application server VMs of its SAP S/4HANA production system with Azure Site Recovery from West Europe to North Europe. The VMs use the E32ds_v5 size. The DR subscription already has enough vCPU quota for that VM family.

        Northwind has the following requirements:

        - A failover must be able to start all 24 VMs, even when North Europe is under heavy demand.
        - The DR site must not require a one-year or three-year commitment.

        What should you include in the design?
      fr: |
        Northwind Traders protège les 24 machines virtuelles de serveur d'applications de son système de production SAP S/4HANA avec Azure Site Recovery de l'Europe Ouest vers l'Europe Nord. Les machines virtuelles utilisent la taille E32ds_v5. L'abonnement de reprise dispose déjà d'un quota de processeurs virtuels suffisant pour cette famille de machines virtuelles.

        Northwind a les exigences suivantes :

        - Un basculement doit pouvoir démarrer les 24 machines virtuelles, même quand l'Europe Nord connaît une forte demande.
        - Le site de reprise ne doit pas exiger d'engagement d'un an ou de trois ans.

        Que devez-vous inclure dans la conception ?
    body:
      options:
        - { id: a, text: { en: "An on-demand capacity reservation group in North Europe for the E32ds_v5 size, used by Site Recovery", fr: "Un groupe de réservations de capacité à la demande en Europe Nord pour la taille E32ds_v5, utilisé par Site Recovery" } }
        - { id: b, text: { en: "Reserved VM instances for the E32ds_v5 size in North Europe, with a one-year term and shared scope", fr: "Des instances de machines virtuelles réservées pour la taille E32ds_v5 en Europe Nord, sur un an avec une étendue partagée" } }
        - { id: c, text: { en: "A further vCPU quota increase for the Edsv5 family in the DR subscription, requested before go-live", fr: "Une augmentation supplémentaire du quota de processeurs virtuels de la famille Edsv5 dans l'abonnement de reprise, demandée avant la mise en production" } }
        - { id: d, text: { en: "An Azure savings plan for compute whose hourly commitment covers the 24 VMs in North Europe", fr: "Un plan d'économies Azure pour le calcul dont l'engagement horaire couvre les 24 machines virtuelles en Europe Nord" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Site Recovery doesn't guarantee that the VM size is available in the DR region at failover time. On-demand capacity reservation secures capacity for a VM size in a region with no term commitment, and Site Recovery integrates with it to guarantee failovers. Northwind pays for the reserved capacity at the pay-as-you-go rate of the size, which Microsoft presents as the alternative to reservations that aren't cost effective for an idle DR site.
        fr: |
          Site Recovery ne garantit pas que la taille de machine virtuelle soit disponible dans la région de reprise au moment du basculement. La réservation de capacité à la demande sécurise de la capacité pour une taille de machine virtuelle dans une région, sans engagement de durée, et Site Recovery s'y intègre pour garantir les basculements. Northwind paie la capacité réservée au tarif à l'usage de la taille, ce que Microsoft présente comme l'alternative aux réservations, peu rentables pour un site de reprise inactif.
      options:
        b: { en: "Reserved instances require a one-year or three-year term and give a billing discount only; they don't guarantee capacity.", fr: "Les instances réservées exigent une durée d'un an ou de trois ans et n'apportent qu'une remise de facturation ; elles ne garantissent pas la capacité." }
        c: { en: "Quota is the permission to deploy, not the underlying capacity; the quota is already sufficient and a higher one still guarantees no VM.", fr: "Le quota est l'autorisation de déployer, pas la capacité sous-jacente ; le quota suffit déjà et un quota plus élevé ne garantit toujours aucune machine virtuelle." }
        d: { en: "A savings plan is a one-year or three-year spending commitment that lowers prices; it doesn't reserve any capacity.", fr: "Un plan d'économies est un engagement de dépense d'un an ou de trois ans qui réduit les prix ; il ne réserve aucune capacité." }
    references:
      - title: Disaster recovery overview and infrastructure guidelines for SAP workload
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-overview-guide
      - title: On-demand capacity reservation in Azure - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/capacity-reservation-overview

  # ------------------------------------------------------------------ 8
  - id: az120-qz-32-08
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam runs SAP S/4HANA in West Europe in a virtual network named **vnet-sap-weu** that uses the 10.10.0.0/16 address space. Fabrikam is building a DR site in North Europe:

        - The SAP HANA database will replicate to a VM in North Europe by using asynchronous HANA System Replication. This traffic must stay on the Microsoft network and must not pass through the on-premises network.
        - The application tier will fail over with Azure Site Recovery and a recovery plan.
        - Both regions will be connected to the on-premises network at the same time through ExpressRoute.
        - SAP GUI users reach the systems by SAP virtual host names. Nothing may be changed on the user workstations during a failover.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam exécute SAP S/4HANA en Europe Ouest dans un réseau virtuel nommé **vnet-sap-weu** qui utilise l'espace d'adressage 10.10.0.0/16. Fabrikam construit un site de reprise en Europe Nord :

        - La base de données SAP HANA sera répliquée vers une machine virtuelle en Europe Nord avec HANA System Replication asynchrone. Ce trafic doit rester sur le réseau Microsoft et ne doit pas passer par le réseau local.
        - La couche application basculera avec Azure Site Recovery et un plan de récupération.
        - Les deux régions seront connectées au réseau local en même temps via ExpressRoute.
        - Les utilisateurs de SAP GUI atteignent les systèmes par des noms d'hôte virtuels SAP. Rien ne doit être modifié sur les postes de travail des utilisateurs pendant un basculement.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Create the DR virtual network with an address space that doesn't overlap 10.10.0.0/16, and peer it with vnet-sap-weu.", fr: "Créer le réseau virtuel de reprise avec un espace d'adressage qui ne chevauche pas 10.10.0.0/16, et l'associer par peering à vnet-sap-weu." } }
        - { id: b, text: { en: "Create the DR virtual network with the 10.10.0.0/16 address space, so that the failed-over VMs keep their IP addresses.", fr: "Créer le réseau virtuel de reprise avec l'espace d'adressage 10.10.0.0/16, pour que les machines virtuelles basculées conservent leurs adresses IP." } }
        - { id: c, text: { en: "Add a post-action script to the recovery plan that updates the DNS records of the SAP virtual host names.", fr: "Ajouter au plan de récupération un script de post-action qui met à jour les enregistrements DNS des noms d'hôte virtuels SAP." } }
        - { id: d, text: { en: "Send the HANA System Replication traffic through the two ExpressRoute circuits and the on-premises network.", fr: "Faire passer le trafic HANA System Replication par les deux circuits ExpressRoute et le réseau local." } }
        - { id: e, text: { en: "After a failover, push a hosts file with the new IP addresses of the virtual host names to the workstations.", fr: "Après un basculement, déployer sur les postes de travail un fichier hosts avec les nouvelles adresses IP des noms d'hôte virtuels." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          The DR virtual network needs its own non-overlapping address space: only then can it be peered with the production network for HSR traffic and connected to on-premises at the same time as production. Because the failed-over VMs then get addresses from the DR range, clients are redirected through name resolution: a post-action script of the recovery plan updates the DNS records of the virtual host names, so nothing changes on the workstations.
        fr: |
          Le réseau virtuel de reprise a besoin de son propre espace d'adressage sans chevauchement : c'est la condition pour l'associer par peering au réseau de production pour le trafic HSR et le connecter au réseau local en même temps que la production. Comme les machines virtuelles basculées reçoivent alors des adresses de la plage de reprise, les clients sont redirigés par la résolution de noms : un script de post-action du plan de récupération met à jour les enregistrements DNS des noms d'hôte virtuels, sans rien changer sur les postes de travail.
      options:
        b: { en: "Overlapping address spaces can't be peered and can't be connected to on-premises at the same time, which the HSR and ExpressRoute requirements need.", fr: "Des espaces d'adressage qui se chevauchent ne peuvent pas être associés par peering ni connectés en même temps au réseau local, ce qu'exigent la HSR et ExpressRoute." }
        d: { en: "Routing HSR through on-premises breaks the requirement that the replication traffic stays on the Microsoft network.", fr: "Faire passer la HSR par le réseau local enfreint l'exigence selon laquelle le trafic de réplication reste sur le réseau Microsoft." }
        e: { en: "Distributing a hosts file changes the workstations, which the requirements forbid; DNS updates avoid any client change.", fr: "Déployer un fichier hosts modifie les postes de travail, ce que les exigences interdisent ; la mise à jour du DNS évite toute modification des clients." }
    references:
      - title: Map virtual networks between two regions in Azure Site Recovery - Azure Site Recovery
        url: https://learn.microsoft.com/en-us/azure/site-recovery/azure-to-azure-network-mapping
      - title: Disaster recovery overview and infrastructure guidelines for SAP workload
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-overview-guide

  # ------------------------------------------------------------------ 9
  - id: az120-qz-32-09
    objective: "3.2.6"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso protects the databases of a standalone SAP HANA instance on an Azure VM with Azure Backup streaming backups: a weekly full backup and log backups. The network security group of the HANA subnet denies outbound traffic to the **Internet** service tag and allows outbound HTTPS to the **AzureBackup**, **Storage** and **AzureActiveDirectory** service tags. The data disks are Premium SSD managed disks.

        Contoso now adds HANA instance snapshot backups with a Standard snapshot policy. The required roles are already assigned.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso protège les bases de données d'une instance SAP HANA autonome sur une machine virtuelle Azure avec les sauvegardes en streaming de Sauvegarde Azure : une sauvegarde complète hebdomadaire et des sauvegardes des journaux. Le groupe de sécurité réseau du sous-réseau HANA refuse le trafic sortant vers la balise de service **Internet** et autorise le HTTPS sortant vers les balises de service **AzureBackup**, **Storage** et **AzureActiveDirectory**. Les disques de données sont des disques managés SSD Premium.

        Contoso ajoute maintenant des sauvegardes par instantané d'instance HANA avec une stratégie d'instantané Standard. Les rôles requis sont déjà attribués.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: The snapshot backups need an additional outbound rule that allows the AzureResourceManager service tag.
            fr: Les sauvegardes par instantané ont besoin d'une règle sortante supplémentaire qui autorise la balise de service AzureResourceManager.
        - id: s2
          text:
            en: The snapshots are stored on Standard HDD in a resource group that Contoso chooses, and they aren't copied to the Recovery Services vault.
            fr: Les instantanés sont stockés sur HDD Standard dans un groupe de ressources choisi par Contoso, et ils ne sont pas copiés dans le coffre Recovery Services.
        - id: s3
          text:
            en: Contoso could instead route the backup traffic through an Azure Firewall application rule with TLS inspection that uses the AzureBackup FQDN tag.
            fr: Contoso pourrait à la place faire passer le trafic de sauvegarde par une règle d'application du Pare-feu Azure avec inspection TLS qui utilise la balise FQDN AzureBackup.
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Snapshot backups call Azure Resource Manager (management.azure.com), so they fail if the NSG blocks it; an outbound rule to the AzureResourceManager service tag fixes that. Managed disk snapshots use Standard HDD whatever the disk type, are stored in the resource group you specify, and aren't transferred to the vault. Azure Backup doesn't support an Azure Firewall application rule with TLS inspection enabled.
        fr: |
          Les sauvegardes par instantané appellent Azure Resource Manager (management.azure.com) : elles échouent si le NSG le bloque, et une règle sortante vers la balise de service AzureResourceManager corrige ce point. Les instantanés de disques managés utilisent le HDD Standard quel que soit le type de disque, sont stockés dans le groupe de ressources que vous indiquez et ne sont pas transférés dans le coffre. Sauvegarde Azure ne prend pas en charge une règle d'application du Pare-feu Azure avec l'inspection TLS activée.
      options:
        s3: { en: "The AzureBackup FQDN tag is the right Azure Firewall rule, but only without TLS inspection, which Azure Backup doesn't support.", fr: "La balise FQDN AzureBackup est la bonne règle du Pare-feu Azure, mais uniquement sans inspection TLS, que Sauvegarde Azure ne prend pas en charge." }
    references:
      - title: Back up an SAP HANA database to Azure with Azure Backup - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/backup-azure-sap-hana-database
      - title: About the SAP HANA database backup on Azure VMs - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-about

  # ------------------------------------------------------------------ 10
  - id: az120-qz-32-10
    objective: "3.2.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank runs a 14 TB standalone SAP HANA database, without HANA System Replication, on an Azure VM in West Europe. The data volumes are on Premium SSD managed disks formatted with xfs. Woodgrove has the following requirements for the Azure Backup design:

        - Backup data in the Recovery Services vault must stay in the West Europe region and must remain available if one availability zone of the region fails.
        - After a logical corruption, the whole HANA instance must be restorable within minutes, whatever the size of the database.
        - Point-in-time recovery from the vault must remain possible.
        - Only generally available features can be used.

        What should you include in the design? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank exécute une base de données SAP HANA autonome de 14 To, sans HANA System Replication, sur une machine virtuelle Azure en Europe Ouest. Les volumes de données sont sur des disques managés SSD Premium formatés en xfs. Woodgrove a les exigences suivantes pour la conception de Sauvegarde Azure :

        - Les données de sauvegarde du coffre Recovery Services doivent rester dans la région Europe Ouest et rester disponibles si une zone de disponibilité de la région tombe en panne.
        - Après une corruption logique, toute l'instance HANA doit pouvoir être restaurée en quelques minutes, quelle que soit la taille de la base de données.
        - La récupération à un instant donné depuis le coffre doit rester possible.
        - Seules des fonctionnalités en disponibilité générale peuvent être utilisées.

        Que devez-vous inclure dans la conception ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Storage redundancy of the vault: [[red]]

          Instance-level protection: [[inst]]

          Streaming policy of the databases: [[pol]]
        fr: |
          Redondance du stockage du coffre : [[red]]

          Protection au niveau de l'instance : [[inst]]

          Stratégie de streaming des bases de données : [[pol]]
      slots:
        - id: red
          options:
            - { id: lrs, text: { en: "Locally redundant storage (LRS)", fr: "Stockage localement redondant (LRS)" } }
            - { id: zrs, text: { en: "Zone-redundant storage (ZRS)", fr: "Stockage redondant interzone (ZRS)" } }
            - { id: grs, text: { en: "Geo-redundant storage (GRS) with Cross Region Restore", fr: "Stockage géoredondant (GRS) avec restauration interrégion" } }
        - id: inst
          options:
            - { id: snapstd, text: { en: "HANA instance snapshots with a Standard snapshot policy", fr: "Instantanés d'instance HANA avec une stratégie d'instantané Standard" } }
            - { id: snapenh, text: { en: "HANA instance snapshots with an Enhanced snapshot policy", fr: "Instantanés d'instance HANA avec une stratégie d'instantané Enhanced" } }
            - { id: vmenh, text: { en: "Azure VM backup with an Enhanced policy every 4 hours", fr: "Sauvegarde de machine virtuelle Azure avec une stratégie Enhanced toutes les 4 heures" } }
            - { id: asr, text: { en: "Azure Site Recovery replication to another zone", fr: "Réplication Azure Site Recovery vers une autre zone" } }
        - id: pol
          options:
            - { id: wfl, text: { en: "Weekly full and log backups only", fr: "Sauvegardes complètes hebdomadaires et des journaux uniquement" } }
            - { id: wfdl, text: { en: "Weekly full, daily differential and log backups", fr: "Sauvegardes complètes hebdomadaires, différentielles quotidiennes et des journaux" } }
            - { id: dfl, text: { en: "Daily full and log backups", fr: "Sauvegardes complètes quotidiennes et des journaux" } }
    answer:
      values: { red: zrs, inst: snapstd, pol: wfl }
    explanation:
      correct:
        en: |
          ZRS keeps the vault data within the region (data residency) and available when a zone fails; GRS would copy it to the paired region. HANA instance snapshots restore the whole instance in minutes whatever its size, and the Standard policy is generally available for a system without HSR. Snapshots require every database of the instance to have a Backint policy of weekly full plus log backups only, and these streaming backups keep point-in-time recovery from the vault.
        fr: |
          ZRS conserve les données du coffre dans la région (résidence des données) et disponibles en cas de panne d'une zone ; GRS les copierait dans la région jumelée. Les instantanés d'instance HANA restaurent toute l'instance en quelques minutes quelle que soit sa taille, et la stratégie Standard est en disponibilité générale pour un système sans HSR. Les instantanés exigent que chaque base de données de l'instance ait une stratégie Backint de sauvegardes complètes hebdomadaires plus journaux uniquement, et ces sauvegardes en streaming conservent la récupération à un instant donné depuis le coffre.
      options:
        lrs: { en: "LRS keeps the copies in one datacenter; a zone failure could make the backup data unavailable.", fr: "LRS conserve les copies dans un seul centre de données ; une panne de zone pourrait rendre les données de sauvegarde indisponibles." }
        grs: { en: "GRS replicates the vault data to the paired region, so the backup data doesn't stay in West Europe.", fr: "GRS réplique les données du coffre dans la région jumelée : les données de sauvegarde ne restent donc pas en Europe Ouest." }
        snapenh: { en: "The Enhanced snapshot policy is in preview; Woodgrove allows only generally available features.", fr: "La stratégie d'instantané Enhanced est en préversion ; Woodgrove n'autorise que des fonctionnalités en disponibilité générale." }
        vmenh: { en: "An Azure VM backup isn't a HANA-consistent instance backup and isn't the snapshot integration that Azure Backup offers for HANA.", fr: "Une sauvegarde de machine virtuelle Azure n'est pas une sauvegarde d'instance cohérente avec HANA, ni l'intégration par instantané que Sauvegarde Azure propose pour HANA." }
        asr: { en: "Site Recovery replicates the current state, including a logical corruption; it isn't a backup and doesn't restore to an earlier state.", fr: "Site Recovery réplique l'état actuel, corruption logique comprise ; ce n'est pas une sauvegarde et il ne restaure pas un état antérieur." }
        wfdl: { en: "With instance snapshots, the database policy must not contain differential or incremental backups, or the snapshot configuration fails.", fr: "Avec les instantanés d'instance, la stratégie de base de données ne doit contenir ni sauvegarde différentielle ni incrémentielle, sinon la configuration des instantanés échoue." }
        dfl: { en: "Snapshot backups require a weekly full plus logs only policy; a daily full policy doesn't meet that prerequisite.", fr: "Les sauvegardes par instantané exigent une stratégie complète hebdomadaire plus journaux uniquement ; une stratégie complète quotidienne ne remplit pas ce prérequis." }
    references:
      - title: Back up SAP HANA database instances on Azure VMs - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-instances-backup
      - title: Create and Configure Recovery Services Vaults - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/backup-create-recovery-services-vault
