chapter: 42-monitoring-operations
questions:
  # ------------------------------------------------------------------ 1
  - id: az120-qz-42-01
    objective: "4.2.8"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware registered an SAP system named **LP3** in Azure Center for SAP solutions. During a cleanup, an administrator deleted the managed resource group of the Virtual Instance for SAP solutions (VIS) of LP3, which contained a storage account and a key vault. Since then, the Azure Center for SAP solutions capabilities no longer work for LP3.

        What should you do to use the capabilities again?
      fr: |
        Litware a inscrit un système SAP nommé **LP3** dans le Centre Azure pour les solutions SAP. Lors d'un nettoyage, un administrateur a supprimé le groupe de ressources managé de la Virtual Instance for SAP solutions (VIS) de LP3, qui contenait un compte de stockage et un coffre de clés. Depuis, les fonctionnalités du Centre Azure pour les solutions SAP ne fonctionnent plus pour LP3.

        Que devez-vous faire pour utiliser de nouveau ces fonctionnalités ?
    body:
      options:
        - { id: a, text: { en: "Re-create a resource group with the same name, and restart the LP3 VMs", fr: "Recréer un groupe de ressources du même nom, puis redémarrer les machines virtuelles de LP3" } }
        - { id: b, text: { en: "Restart sapstartsrv and the SAP Host Agent on all the LP3 VMs", fr: "Redémarrer sapstartsrv et le SAP Host Agent sur toutes les machines virtuelles de LP3" } }
        - { id: c, text: { en: "Register LP3 again in Azure Center for SAP solutions", fr: "Inscrire de nouveau LP3 dans le Centre Azure pour les solutions SAP" } }
        - { id: d, text: { en: "Assign the service role to the managed identity on the compute resource group again", fr: "Attribuer de nouveau le rôle de service à l'identité managée sur le groupe de ressources de calcul" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Each VIS has a unique managed resource group whose storage account and key vault are critical for the service's management functions. Microsoft states that you must not delete this resource group or its resources; if they're deleted, you must register the system again to use any capability of Azure Center for SAP solutions.
        fr: |
          Chaque VIS dispose d'un groupe de ressources managé unique dont le compte de stockage et le coffre de clés sont indispensables aux fonctions de gestion du service. Microsoft indique qu'il ne faut supprimer ni ce groupe de ressources ni ses ressources ; s'ils sont supprimés, vous devez inscrire de nouveau le système pour utiliser les fonctionnalités du Centre Azure pour les solutions SAP.
      options:
        a: { en: "An empty resource group with the same name doesn't restore the storage account, the key vault or their content.", fr: "Un groupe de ressources vide du même nom ne restaure ni le compte de stockage, ni le coffre de clés, ni leur contenu." }
        b: { en: "sapstartsrv and the SAP Host Agent are prerequisites, but they don't replace the deleted managed resources.", fr: "sapstartsrv et le SAP Host Agent sont des prérequis, mais ils ne remplacent pas les ressources managées supprimées." }
        d: { en: "The identity's role assignments aren't what was deleted; the managed resource group is still missing.", fr: "Ce ne sont pas les attributions de rôles de l'identité qui ont été supprimées ; le groupe de ressources managé reste manquant." }
    references:
      - title: Manage a Virtual Instance for SAP solutions
        url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/manage-virtual-instance

  # ------------------------------------------------------------------ 2
  - id: az120-qz-42-02
    objective: "4.2.9"
    difficulty: 1
    status: draft
    type: multi
    stem:
      en: |
        Wingtip plans to install the SAP Landscape Management (LaMa) connector for Azure in SAP LaMa 3.0 Enterprise Edition.

        Which two operations does the connector let SAP LaMa perform in Azure?

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip prévoit d'installer le connecteur SAP Landscape Management (LaMa) pour Azure dans SAP LaMa 3.0 Enterprise Edition.

        Quelles sont les deux opérations que le connecteur permet à SAP LaMa d'effectuer dans Azure ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Deallocate and start virtual machines", fr: "Libérer et démarrer des machines virtuelles" } }
        - { id: b, text: { en: "Configure SAP HANA System Replication between virtual machines", fr: "Configurer SAP HANA System Replication entre des machines virtuelles" } }
        - { id: c, text: { en: "Copy and relocate managed disks", fr: "Copier et déplacer des disques managés" } }
        - { id: d, text: { en: "Back up SAP HANA databases to a Recovery Services vault", fr: "Sauvegarder des bases de données SAP HANA dans un coffre Recovery Services" } }
        - { id: e, text: { en: "Register SAP systems in Azure Center for SAP solutions", fr: "Inscrire des systèmes SAP dans le Centre Azure pour les solutions SAP" } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Starting with SAP LaMa 3.0 SP05, the connector for Azure calls Azure Resource Manager to deallocate and start VMs, copy and relocate managed disks, and delete managed disks. LaMa builds its relocate, copy, clone and refresh operations on these actions.
        fr: |
          Depuis SAP LaMa 3.0 SP05, le connecteur pour Azure appelle Azure Resource Manager pour libérer et démarrer des machines virtuelles, copier et déplacer des disques managés, et supprimer des disques managés. LaMa construit ses opérations de déplacement, de copie, de clonage et d'actualisation sur ces actions.
      options:
        b: { en: "HANA System Replication is configured in HANA itself; it isn't an operation of the LaMa connector.", fr: "HANA System Replication se configure dans HANA même ; ce n'est pas une opération du connecteur LaMa." }
        d: { en: "HANA backups to a vault are configured with Azure Backup, not through the LaMa connector.", fr: "Les sauvegardes HANA dans un coffre se configurent avec Sauvegarde Azure, pas via le connecteur LaMa." }
        e: { en: "Registration in Azure Center for SAP solutions is done from that service, not by SAP LaMa.", fr: "L'inscription dans le Centre Azure pour les solutions SAP se fait depuis ce service, pas par SAP LaMa." }
    references:
      - title: Set up the SAP LaMa connector for Azure
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/lama-installation

  # ------------------------------------------------------------------ 3
  - id: az120-qz-42-03
    objective: "4.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind deploys a new SAP application server VM that runs Windows Server 2022 by using Azure PowerShell. The VM uses Premium SSD managed disks. Neither Microsoft Support nor SAP Support has asked for a specific version of the Azure VM extension for SAP solutions.

        You need to make sure that SAP supports the environment. The solution must follow Microsoft's recommendation.

        What should you install on the VM?
      fr: |
        Northwind déploie une nouvelle machine virtuelle de serveur d'applications SAP qui exécute Windows Server 2022, à l'aide d'Azure PowerShell. La machine virtuelle utilise des disques managés SSD Premium. Ni le support Microsoft ni le support SAP n'ont demandé de version particulière de l'Azure VM extension for SAP solutions.

        Vous devez faire en sorte que SAP prenne en charge l'environnement. La solution doit suivre la recommandation de Microsoft.

        Que devez-vous installer sur la machine virtuelle ?
    body:
      options:
        - { id: a, text: { en: "The new version of the Azure VM extension for SAP solutions", fr: "La nouvelle version de l'Azure VM extension for SAP solutions" } }
        - { id: b, text: { en: "The standard version of the Azure VM extension for SAP solutions", fr: "La version standard de l'Azure VM extension for SAP solutions" } }
        - { id: c, text: { en: "Both versions of the Azure VM extension for SAP solutions", fr: "Les deux versions de l'Azure VM extension for SAP solutions" } }
        - { id: d, text: { en: "The Azure Monitor Agent with a data collection rule", fr: "Azure Monitor Agent avec une règle de collecte de données" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The Azure VM extension for SAP solutions is what SAP requires to support the environment. Microsoft recommends the standard version for every installation where none of the use cases of the new version applies: installation with Terraform, ARM templates or other means than Azure CLI or PowerShell, SLES 15, RHEL 8.1 or Oracle Linux 8.1 or later, Ultra Disk or Standard managed disks, or a request from Microsoft or SAP Support. None applies to this VM.
        fr: |
          L'Azure VM extension for SAP solutions est ce que SAP exige pour prendre en charge l'environnement. Microsoft recommande la version standard pour toute installation à laquelle aucun cas d'usage de la nouvelle version ne s'applique : installation avec Terraform, des modèles ARM ou d'autres moyens qu'Azure CLI ou PowerShell, SLES 15, RHEL 8.1 ou Oracle Linux 8.1 ou ultérieur, disque Ultra ou disques managés Standard, ou demande du support Microsoft ou SAP. Aucun ne s'applique à cette machine virtuelle.
      options:
        a: { en: "The new version is for the listed use cases only; none of them applies to a Windows VM installed with PowerShell on Premium SSD.", fr: "La nouvelle version est réservée aux cas d'usage listés ; aucun ne s'applique à une machine virtuelle Windows installée avec PowerShell sur SSD Premium." }
        c: { en: "The two versions aren't installed side by side: you uninstall the extension before switching versions.", fr: "Les deux versions ne s'installent pas côte à côte : il faut désinstaller l'extension avant de changer de version." }
        d: { en: "The Azure Monitor Agent collects guest data for Azure Monitor; it doesn't provide the Azure data that the SAP Host Agent needs.", fr: "Azure Monitor Agent collecte des données invitées pour Azure Monitor ; il ne fournit pas les données Azure dont le SAP Host Agent a besoin." }
    references:
      - title: Implement the Azure VM extension for SAP solutions
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap

  # ------------------------------------------------------------------ 4
  - id: az120-qz-42-04
    objective: "4.2.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware protects the SAP HANA databases of its landscape with Azure Backup in four Recovery Services vaults, spread across two subscriptions and two Azure regions. Management wants reports on backup jobs, storage consumed and protected instances for all the vaults, covering the last six months.

        You need to provide the reports. The solution must minimize administrative effort.

        What should you do?
      fr: |
        Proseware protège les bases de données SAP HANA de son paysage avec Sauvegarde Azure dans quatre coffres Recovery Services, répartis sur deux abonnements et deux régions Azure. La direction veut des rapports sur les travaux de sauvegarde, le stockage consommé et les instances protégées de tous les coffres, couvrant les six derniers mois.

        Vous devez fournir ces rapports. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Send the diagnostic data of the four vaults to one Log Analytics workspace, and keep its default retention", fr: "Envoyer les données de diagnostic des quatre coffres vers un espace de travail Log Analytics, et conserver sa rétention par défaut" } }
        - { id: b, text: { en: "Create one Log Analytics workspace per region, in the subscription of each vault, and keep their default retention", fr: "Créer un espace de travail Log Analytics par région, dans l'abonnement de chaque coffre, et conserver leur rétention par défaut" } }
        - { id: c, text: { en: "Send the diagnostic data of the four vaults to one Log Analytics workspace, and raise its retention to 180 days", fr: "Envoyer les données de diagnostic des quatre coffres vers un espace de travail Log Analytics, et porter sa rétention à 180 jours" } }
        - { id: d, text: { en: "Create Azure Monitor alerts for the backup jobs of the four vaults, and route them to an action group", fr: "Créer des alertes Azure Monitor pour les travaux de sauvegarde des quatre coffres, et les router vers un groupe d'actions" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Backup reports use the data that the vault diagnostic settings send to a Log Analytics workspace, and SAP HANA in Azure VMs is a supported workload. The workspace can be in any region and subscription, independent of the vaults, so one workspace covers the whole estate. Workspace data is retained for 30 days by default, so the retention must be increased to show six months.
        fr: |
          Les rapports de sauvegarde utilisent les données que les paramètres de diagnostic des coffres envoient vers un espace de travail Log Analytics, et SAP HANA dans des machines virtuelles Azure est une charge de travail prise en charge. L'espace de travail peut se trouver dans n'importe quelle région et n'importe quel abonnement, indépendamment des coffres : un seul espace couvre donc tout le parc. Les données d'un espace de travail sont conservées 30 jours par défaut : la rétention doit donc être augmentée pour afficher six mois.
      options:
        a: { en: "The default retention of a Log Analytics workspace is 30 days, so the reports can't show six months.", fr: "La rétention par défaut d'un espace de travail Log Analytics est de 30 jours : les rapports ne peuvent pas afficher six mois." }
        b: { en: "The workspace location and subscription are independent of the vaults; several workspaces add effort, and the default retention is too short.", fr: "L'emplacement et l'abonnement de l'espace de travail sont indépendants des coffres ; plusieurs espaces ajoutent de l'effort, et la rétention par défaut est trop courte." }
        d: { en: "Alerts notify about job failures; they don't produce reports on jobs, storage and protected instances over time.", fr: "Les alertes signalent les échecs de travaux ; elles ne produisent pas de rapports sur les travaux, le stockage et les instances protégées dans la durée." }
    references:
      - title: Configure Azure Backup reports - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/configure-reports

  # ------------------------------------------------------------------ 5
  - id: az120-qz-42-05
    objective: "4.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum runs the ASCS and ERS instances of an SAP system in a Pacemaker cluster behind a Standard internal load balancer. Each frontend IP configuration has its own health probe and load-balancing rule. The operations team already charts the probe result per backend IP address to see which node owns each virtual IP.

        You need an additional alert that fires when traffic sent to the ASCS frontend can no longer reach the hosts of the backend VMs, whether because of an Azure infrastructure outage in the region or because no backend instance is healthy.

        Which load balancer metric should you use?
      fr: |
        Adatum exécute les instances ASCS et ERS d'un système SAP dans un cluster Pacemaker derrière un équilibreur de charge interne Standard. Chaque configuration IP frontale a sa propre sonde d'intégrité et sa propre règle d'équilibrage de charge. L'équipe d'exploitation représente déjà le résultat de la sonde par adresse IP du pool principal pour voir quel nœud détient chaque adresse IP virtuelle.

        Vous avez besoin d'une alerte supplémentaire qui se déclenche quand le trafic envoyé à la configuration frontale ASCS ne peut plus atteindre les hôtes des machines virtuelles du pool principal, que ce soit à cause d'une panne de l'infrastructure Azure dans la région ou parce qu'aucune instance du pool principal n'est saine.

        Quelle métrique de l'équilibreur de charge devez-vous utiliser ?
    body:
      options:
        - { id: a, text: Health Probe Status }
        - { id: b, text: Data Path Availability }
        - { id: c, text: Packet Count }
        - { id: d, text: Used SNAT Ports }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Data Path Availability measures the regional data path to the load balancer frontend and the network that supports the VMs: a probing service sends packets that match the frontend and rule to the host of a backend VM. It degrades when no healthy VM remains in the backend pool or during an infrastructure outage, and it exists for internal load balancers, on frontends that have load-balancing rules.
        fr: |
          Data Path Availability mesure le chemin de données régional vers la configuration frontale de l'équilibreur de charge et le réseau qui prend en charge les machines virtuelles : un service de sondage envoie des paquets correspondant à la configuration frontale et à la règle jusqu'à l'hôte d'une machine virtuelle du pool principal. Elle se dégrade quand plus aucune machine virtuelle saine ne reste dans le pool principal ou lors d'une panne d'infrastructure, et elle existe pour les équilibreurs de charge internes, sur les configurations frontales dotées de règles d'équilibrage de charge.
      options:
        a: { en: "Health Probe Status reflects the health of the backend endpoints as seen by the probe, which the team already charts; it doesn't measure the Azure data path.", fr: "Health Probe Status reflète l'intégrité des points de terminaison du pool principal vus par la sonde, que l'équipe représente déjà ; elle ne mesure pas le chemin de données Azure." }
        c: { en: "Packet Count counts the packets processed per frontend; a low value doesn't mean that the data path is unavailable.", fr: "Packet Count compte les paquets traités par configuration frontale ; une valeur faible ne signifie pas que le chemin de données est indisponible." }
        d: { en: "SNAT port metrics exist only for public load balancers and concern outbound flows.", fr: "Les métriques de ports SNAT n'existent que pour les équilibreurs de charge publics et concernent les flux sortants." }
    references:
      - title: Load Balancer Diagnostics - Azure Load Balancer
        url: https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-standard-diagnostics

  # ------------------------------------------------------------------ 6
  - id: az120-qz-42-06
    objective: "4.2.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso runs SAP S/4HANA in a virtual network whose subnets have network security group (NSG) flow logs enabled, analyzed by traffic analytics, since 2024. After a change to the NSGs and route tables, the application server VM **vm-app01** can no longer connect to the HANA SQL port of the VM **vm-hdb01**. No VM extension other than the Azure VM extension for SAP solutions is installed on the VMs.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso exécute SAP S/4HANA dans un réseau virtuel dont les sous-réseaux ont des journaux de flux de groupe de sécurité réseau (NSG) activés, analysés par traffic analytics, depuis 2024. Après une modification des NSG et des tables de routage, la machine virtuelle de serveur d'applications **vm-app01** ne peut plus se connecter au port SQL HANA de la machine virtuelle **vm-hdb01**. Aucune extension de machine virtuelle autre que l'Azure VM extension for SAP solutions n'est installée sur les machines virtuelles.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "Connection troubleshoot can test the TCP connection from vm-app01 to vm-hdb01 without installing the Network Watcher agent extension.", fr: "La résolution des problèmes de connexion peut tester la connexion TCP de vm-app01 vers vm-hdb01 sans installer l'extension de l'agent Network Watcher." }
        - id: s2
          text: { en: "If an NSG rule blocks the traffic, the results of Connection troubleshoot can include the name of that rule.", fr: "Si une règle NSG bloque le trafic, les résultats de la résolution des problèmes de connexion peuvent inclure le nom de cette règle." }
        - id: s3
          text: { en: "If Contoso keeps its current flow logging, traffic analytics will still analyze the SAP traffic after September 30, 2027.", fr: "Si Contoso conserve sa journalisation de flux actuelle, traffic analytics analysera toujours le trafic SAP après le 30 septembre 2027." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Connection troubleshoot checks TCP or ICMP connections from a VM to a VM, FQDN, URI or IP address, and the Network Watcher agent extension is no longer required for these tests. It reports issues hop by hop, including NSG rules that block traffic (with the rule name) and misconfigured routes. NSG flow logs retire on September 30, 2027: after that date, traffic analytics is no longer supported for them and the flow log resources are deleted, so Contoso must migrate to virtual network flow logs.
        fr: |
          La résolution des problèmes de connexion (Connection troubleshoot) vérifie des connexions TCP ou ICMP d'une machine virtuelle vers une machine virtuelle, un FQDN, un URI ou une adresse IP, et l'extension de l'agent Network Watcher n'est plus requise pour ces tests. Elle signale les problèmes tronçon par tronçon, y compris les règles NSG qui bloquent le trafic (avec le nom de la règle) et les itinéraires mal configurés. Les journaux de flux NSG sont mis hors service le 30 septembre 2027 : après cette date, traffic analytics n'est plus pris en charge pour eux et les ressources de journaux de flux sont supprimées ; Contoso doit donc migrer vers les journaux de flux de réseau virtuel.
      options:
        s3: { en: "After the retirement, Azure deletes the NSG flow log resources and stops supporting traffic analytics on them; only the records already in storage are kept.", fr: "Après la mise hors service, Azure supprime les ressources de journaux de flux NSG et cesse de prendre en charge traffic analytics sur elles ; seuls les enregistrements déjà stockés sont conservés." }
    references:
      - title: Connection Troubleshoot Overview - Azure Network Watcher
        url: https://learn.microsoft.com/en-us/azure/network-watcher/network-watcher-connectivity-overview
      - title: NSG Flow Logs Overview - Azure Network Watcher
        url: https://learn.microsoft.com/en-us/azure/network-watcher/nsg-flow-logs-overview

  # ------------------------------------------------------------------ 7
  - id: az120-qz-42-07
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Woodgrove runs SAP HANA on an Azure VM from a series that supports premium storage and VM-level bursting. The VM uses the SCSI disk controller. Its OS disk and the /hana/data and /hana/log disks have host caching set to None, and the /usr/sap disk at LUN 3 has ReadOnly host caching.

        The operations team needs an Azure Monitor metric for each condition listed in the answer area.

        Which metric should you use for each condition? To answer, drag the appropriate metrics to the correct conditions. Each metric may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove exécute SAP HANA sur une machine virtuelle Azure d'une série qui prend en charge le stockage premium et le bursting au niveau de la machine virtuelle. La machine virtuelle utilise le contrôleur de disque SCSI. Son disque du système d'exploitation et les disques /hana/data et /hana/log ont la mise en cache de l'hôte définie sur None, et le disque /usr/sap au LUN 3 a la mise en cache de l'hôte ReadOnly.

        L'équipe d'exploitation a besoin d'une métrique Azure Monitor pour chaque condition listée dans la zone de réponse.

        Quelle métrique devez-vous utiliser pour chaque condition ? Pour répondre, faites glisser les métriques appropriées vers les conditions correspondantes. Chaque métrique peut être utilisée une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: osiops, text: OS Disk IOPS Consumed Percentage }
        - { id: queue, text: Data Disk Queue Depth }
        - { id: vmcached, text: VM Cached Bandwidth Consumed Percentage }
        - { id: vmburst, text: VM Uncached Used Burst IO Credits Percentage }
        - { id: target, text: Data Disk Target IOPS }
        - { id: maxburst, text: Data Disk Max Burst IOPS }
      targets:
        - id: t1
          text: { en: "The OS disk is capped by its own provisioned IOPS", fr: "Le disque du système d'exploitation est plafonné par ses propres IOPS provisionnées" }
        - id: t2
          text: { en: "I/O requests are waiting to be served by the /hana/log disk", fr: "Des requêtes d'E/S attendent d'être servies par le disque /hana/log" }
        - id: t3
          text: { en: "The throughput of the /usr/sap disk reaches the VM limit for cached I/O", fr: "Le débit du disque /usr/sap atteint la limite de la machine virtuelle pour les E/S mises en cache" }
        - id: t4
          text: { en: "The VM consumes its burst credits for uncached IOPS", fr: "La machine virtuelle consomme ses crédits de burst pour les IOPS non mises en cache" }
    answer:
      mapping: { t1: osiops, t2: queue, t3: vmcached, t4: vmburst }
    explanation:
      correct:
        en: |
          The consumed-percentage metrics show which limit caps I/O: OS Disk IOPS Consumed Percentage for the OS disk's own limit, and the VM Cached metrics for disks with host caching, such as the ReadOnly /usr/sap disk. Data Disk Queue Depth shows the I/O requests waiting for a data disk. VM bursting has its own credit metrics, split between cached and uncached I/O and between IOPS and bandwidth.
        fr: |
          Les métriques de pourcentage consommé indiquent la limite qui plafonne les E/S : OS Disk IOPS Consumed Percentage pour la limite propre du disque du système d'exploitation, et les métriques VM Cached pour les disques avec mise en cache de l'hôte, comme le disque /usr/sap en ReadOnly. Data Disk Queue Depth montre les requêtes d'E/S en attente pour un disque de données. Le bursting de la machine virtuelle a ses propres métriques de crédits, séparées entre E/S mises en cache et non mises en cache, et entre IOPS et bande passante.
      options:
        target: { en: "Data Disk Target IOPS is the provisioned IOPS target of a data disk, not a measure of consumption or queuing.", fr: "Data Disk Target IOPS est la cible d'IOPS provisionnées d'un disque de données, pas une mesure de consommation ni de file d'attente." }
        maxburst: { en: "Data Disk Max Burst IOPS is the burst ceiling of a disk; it doesn't concern the VM-level burst credits.", fr: "Data Disk Max Burst IOPS est le plafond de burst d'un disque ; elle ne concerne pas les crédits de burst au niveau de la machine virtuelle." }
    references:
      - title: Disk metrics - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-metrics

  # ------------------------------------------------------------------ 8
  - id: az120-qz-42-08
    objective: "4.2.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam monitors an SAP NetWeaver AS ABAP system named **FP2** with an SAP NetWeaver provider in Azure Monitor for SAP solutions. The provider uses the SOAP connection type: the SAP Control web methods are unprotected, `sapstartsrv` was restarted on each instance, and ports 5XX13 and 5XX14 are open.

        Fabrikam wants to change the provider to the SOAP + RFC connection type to collect more metrics. The solution must follow the principle of least privilege and must not cause downtime of FP2.

        Which three actions should you perform in FP2? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam supervise un système SAP NetWeaver AS ABAP nommé **FP2** avec un fournisseur SAP NetWeaver dans Azure Monitor pour solutions SAP. Le fournisseur utilise le type de connexion SOAP : les méthodes web SAP Control ne sont plus protégées, `sapstartsrv` a été redémarré sur chaque instance, et les ports 5XX13 et 5XX14 sont ouverts.

        Fabrikam veut passer le fournisseur au type de connexion SOAP + RFC pour collecter davantage de métriques. La solution doit respecter le principe du moindre privilège et ne doit pas provoquer d'interruption de FP2.

        Quelles sont les trois actions à effectuer dans FP2 ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Upload the Z_AMS_NETWEAVER_MONITORING role in transaction PFCG and generate its profile.", fr: "Charger le rôle Z_AMS_NETWEAVER_MONITORING dans la transaction PFCG et générer son profil." } }
        - { id: b, text: { en: "Create an RFC user and assign it the SAP_ALL profile so that every metric can be read.", fr: "Créer un utilisateur RFC et lui attribuer le profil SAP_ALL pour que toutes les métriques puissent être lues." } }
        - { id: c, text: { en: "Create an RFC user and assign it the Z_AMS_NETWEAVER_MONITORING role.", fr: "Créer un utilisateur RFC et lui attribuer le rôle Z_AMS_NETWEAVER_MONITORING." } }
        - { id: d, text: { en: "Activate the wsdl, wsdl11 and RFC services in transaction SICF.", fr: "Activer les services wsdl, wsdl11 et RFC dans la transaction SICF." } }
        - { id: e, text: { en: "Restart all the instances of FP2 so that they load the new role.", fr: "Redémarrer toutes les instances de FP2 pour qu'elles chargent le nouveau rôle." } }
        - { id: f, text: { en: "Install the Prometheus node exporter on each application server.", fr: "Installer le Prometheus node exporter sur chaque serveur d'applications." } }
    answer: { optionIds: [a, c, d] }
    explanation:
      correct:
        en: |
          SOAP + RFC is supported for AS ABAP systems only and adds three prerequisites to the SOAP ones: import the Z_AMS_NETWEAVER_MONITORING role with a role upload in PFCG (including its profile), create the RFC user that the provider uses and assign it that role, and activate the `wsdl`, `wsdl11` and `RFC` services under `/default_host/sap/bc/soap/` in SICF. None of these steps restarts the system.
        fr: |
          SOAP + RFC n'est pris en charge que pour les systèmes AS ABAP et ajoute trois prérequis à ceux de SOAP : importer le rôle Z_AMS_NETWEAVER_MONITORING par un chargement de rôle dans PFCG (profil compris), créer l'utilisateur RFC qu'utilise le fournisseur et lui attribuer ce rôle, et activer les services `wsdl`, `wsdl11` et `RFC` sous `/default_host/sap/bc/soap/` dans SICF. Aucune de ces étapes ne redémarre le système.
      options:
        b: { en: "SAP_ALL grants far more than monitoring; the dedicated Z_AMS_NETWEAVER_MONITORING role meets least privilege.", fr: "SAP_ALL accorde bien plus que la supervision ; le rôle dédié Z_AMS_NETWEAVER_MONITORING respecte le moindre privilège." }
        e: { en: "No restart is required for the RFC prerequisites, and a restart of all instances would cause downtime.", fr: "Aucun redémarrage n'est requis pour les prérequis RFC, et un redémarrage de toutes les instances provoquerait une interruption." }
        f: { en: "The node exporter is the prerequisite of the OS (Linux) provider, not of the SAP NetWeaver provider.", fr: "Le node exporter est le prérequis du fournisseur OS (Linux), pas du fournisseur SAP NetWeaver." }
    references:
      - title: Configure SAP NetWeaver for Azure Monitor for SAP solutions
        url: https://learn.microsoft.com/en-us/azure/sap/monitor/provider-netweaver

  # ------------------------------------------------------------------ 9
  - id: az120-qz-42-09
    objective: "4.2.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin manages two SAP systems as Virtual Instances for SAP solutions (VIS):

        - **TP1** runs on Windows Server. Its ASCS and ERS instances are protected by Windows Server Failover Clustering, and its SQL Server database uses an Always On availability group.
        - **TQ1** runs on SUSE Linux Enterprise Server. Its SAP HANA database replicates with HANA System Replication to a second VM, without any cluster software; a takeover is done manually. A Pacemaker cluster protects the ASCS and ERS instances.

        On both systems, the HA interface cluster connector for SAP (`sap_vendor_cluster_connector`) is installed on the ASCS instance and `sapstartsrv` runs on all the VMs. The operators have the Azure Center for SAP solutions administrator role on both VIS resources.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin gère deux systèmes SAP sous forme de Virtual Instances for SAP solutions (VIS) :

        - **TP1** s'exécute sur Windows Server. Ses instances ASCS et ERS sont protégées par le clustering de basculement Windows Server, et sa base de données SQL Server utilise un groupe de disponibilité Always On.
        - **TQ1** s'exécute sur SUSE Linux Enterprise Server. Sa base de données SAP HANA est répliquée avec HANA System Replication vers une deuxième machine virtuelle, sans logiciel de cluster ; une reprise (takeover) se fait manuellement. Un cluster Pacemaker protège les instances ASCS et ERS.

        Sur les deux systèmes, le connecteur de cluster de l'interface HA pour SAP (`sap_vendor_cluster_connector`) est installé sur l'instance ASCS et `sapstartsrv` s'exécute sur toutes les machines virtuelles. Les opérateurs disposent du rôle Azure Center for SAP solutions administrator sur les deux ressources VIS.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The operators can stop and start the application tier of TP1 from its VIS.", fr: "Les opérateurs peuvent arrêter et démarrer le niveau application de TP1 depuis sa VIS." }
        - id: s2
          text: { en: "The operators can stop the HANA database of TQ1 from its VIS.", fr: "Les opérateurs peuvent arrêter la base de données HANA de TQ1 depuis sa VIS." }
        - id: s3
          text: { en: "If a Pacemaker cluster is later added for the HANA database of TQ1, a start of the database from the VIS runs only when the cluster maintenance mode is Enabled.", fr: "Si un cluster Pacemaker est ajouté plus tard pour la base de données HANA de TQ1, un démarrage de la base depuis la VIS ne s'exécute que lorsque le mode maintenance du cluster est Enabled." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Start and stop from a VIS are supported on Windows, RHEL and SUSE, with SUSE and RHEL Pacemaker or Windows Server Failover Clustering for highly available systems. For HA HANA databases, the operations are supported only when a cluster management solution is in place, so HANA System Replication without cluster software isn't supported. With a cluster, the HANA stop runs only when maintenance mode is Disabled, and the start only when it's Enabled.
        fr: |
          Le démarrage et l'arrêt depuis une VIS sont pris en charge sur Windows, RHEL et SUSE, avec Pacemaker sur SUSE et RHEL ou le clustering de basculement Windows Server pour les systèmes hautement disponibles. Pour les bases de données HANA en haute disponibilité, ces opérations ne sont prises en charge qu'avec une solution de gestion de cluster : HANA System Replication sans logiciel de cluster n'est donc pas pris en charge. Avec un cluster, l'arrêt de HANA ne s'exécute que si le mode maintenance est Disabled, et le démarrage que s'il est Enabled.
      options:
        s2: { en: "HA HANA configurations without a cluster aren't supported for start and stop operations through the VIS.", fr: "Les configurations HANA en haute disponibilité sans cluster ne sont pas prises en charge pour les opérations de démarrage et d'arrêt via la VIS." }
    references:
      - title: Start and stop SAP systems, instances, and HANA database
        url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/start-stop-sap-systems

  # ------------------------------------------------------------------ 10
  - id: az120-qz-42-10
    objective: "4.2.6"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Contoso protects an SAP HANA multitenant database container system named **HP1** on the VM **hdb-prd** with Azure Backup (Backint streaming backups) in a Recovery Services vault named **rsv-sap-weu** in West Europe. HP1 contains SYSTEMDB and one tenant database.

        To build a test copy, you deployed a new VM named **hdb-tst** in West Europe with a HANA instance installed. hdb-tst isn't known to any vault yet.

        You need to restore SYSTEMDB and the tenant database of HP1 to hdb-tst by using Azure Backup.

        Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Contoso protège un système SAP HANA à conteneurs de bases de données multiples nommé **HP1**, sur la machine virtuelle **hdb-prd**, avec Sauvegarde Azure (sauvegardes en streaming Backint) dans un coffre Recovery Services nommé **rsv-sap-weu** en Europe Ouest. HP1 contient SYSTEMDB et une base de données de locataire.

        Pour créer une copie de test, vous avez déployé une nouvelle machine virtuelle nommée **hdb-tst** en Europe Ouest, avec une instance HANA installée. hdb-tst n'est encore connue d'aucun coffre.

        Vous devez restaurer SYSTEMDB et la base de données de locataire de HP1 sur hdb-tst à l'aide de Sauvegarde Azure.

        Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste d'actions vers la zone de réponse et classez-les dans l'ordre correct.
    body:
      count: 5
      actions:
        - { id: prereg, text: { en: "Run the pre-registration script on hdb-tst.", fr: "Exécuter le script de préinscription sur hdb-tst." } }
        - { id: discover, text: { en: "From rsv-sap-weu, discover the databases on hdb-tst.", fr: "Depuis rsv-sap-weu, découvrir les bases de données de hdb-tst." } }
        - { id: sysdb, text: { en: "Restore SYSTEMDB of HP1 to hdb-tst as an alternate location.", fr: "Restaurer SYSTEMDB de HP1 sur hdb-tst comme emplacement de remplacement." } }
        - { id: rerun, text: { en: "Run the pre-registration script on hdb-tst again.", fr: "Exécuter de nouveau le script de préinscription sur hdb-tst." } }
        - { id: tenant, text: { en: "Restore the tenant database of HP1 to hdb-tst as an alternate location.", fr: "Restaurer la base de données de locataire de HP1 sur hdb-tst comme emplacement de remplacement." } }
        - { id: vault, text: { en: "Create a Recovery Services vault for hdb-tst, and register hdb-tst in it.", fr: "Créer un coffre Recovery Services pour hdb-tst, puis y inscrire hdb-tst." } }
        - { id: mars, text: { en: "Install the Microsoft Azure Recovery Services (MARS) agent on hdb-tst.", fr: "Installer l'agent Microsoft Azure Recovery Services (MARS) sur hdb-tst." } }
    answer:
      sequence: [prereg, discover, sysdb, rerun, tenant]
    explanation:
      correct:
        en: |
          A restore to an alternate location requires a target HANA instance in the same region that is registered with the same vault as the source and passes the backup readiness check, so you run the pre-registration script and then discover the databases on hdb-tst from rsv-sap-weu. In a multitenant restore, SYSTEMDB is restored first; you then run the pre-registration script again so that the subsequent tenant database restore succeeds.
        fr: |
          Une restauration vers un emplacement de remplacement exige une instance HANA cible dans la même région, inscrite dans le même coffre que la source et qui réussit la vérification de préparation à la sauvegarde : vous exécutez donc le script de préinscription, puis découvrez les bases de données de hdb-tst depuis rsv-sap-weu. Dans une restauration à conteneurs multiples, SYSTEMDB est restaurée en premier ; vous exécutez ensuite de nouveau le script de préinscription pour que la restauration de la base de données de locataire qui suit réussisse.
      options:
        vault: { en: "The target instance must be registered with the same vault as the source; a new vault doesn't hold HP1's recovery points.", fr: "L'instance cible doit être inscrite dans le même coffre que la source ; un nouveau coffre ne contient pas les points de récupération de HP1." }
        mars: { en: "SAP HANA backup in Azure VMs uses a workload backup extension set up through the pre-registration script, not the MARS agent.", fr: "La sauvegarde de SAP HANA dans des machines virtuelles Azure utilise une extension de sauvegarde de charge de travail mise en place via le script de préinscription, pas l'agent MARS." }
    references:
      - title: Restore SAP HANA databases on Azure VMs - Azure Backup
        url: https://learn.microsoft.com/en-us/azure/backup/sap-hana-database-restore
