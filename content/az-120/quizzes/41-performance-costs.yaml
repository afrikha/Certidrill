chapter: 41-performance-costs
questions:
  # ------------------------------------------------------------------ 1
  - id: az120-qz-41-01
    objective: "4.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Azure Advisor recommends shutting down or resizing several underutilized SAP application server VMs of Contoso.

        In which Azure Advisor category does this recommendation appear?
      fr: |
        Azure Advisor recommande d'arrêter ou de redimensionner plusieurs machines virtuelles de serveur d'applications SAP sous-utilisées de Contoso.

        Dans quelle catégorie d'Azure Advisor cette recommandation apparaît-elle ?
    body:
      options:
        - { id: a, text: { en: "Performance", fr: "Performances" } }
        - { id: b, text: { en: "Operational excellence", fr: "Excellence opérationnelle" } }
        - { id: c, text: { en: "Cost", fr: "Coût" } }
        - { id: d, text: { en: "Reliability", fr: "Fiabilité" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Azure Advisor groups its recommendations into five categories: Reliability, Security, Performance, Cost and Operational excellence. The Cost category optimizes and reduces Azure spending, which includes right-sizing or shutting down underutilized VMs and buying reservations or savings plans. These generic recommendations apply to SAP VMs like any other VM.
        fr: |
          Azure Advisor classe ses recommandations dans cinq catégories : Fiabilité, Sécurité, Performances, Coût et Excellence opérationnelle. La catégorie Coût optimise et réduit les dépenses Azure, ce qui comprend le redimensionnement ou l'arrêt des machines virtuelles sous-utilisées et l'achat de réservations ou de plans d'économies. Ces recommandations génériques s'appliquent aux machines virtuelles SAP comme à toute autre machine virtuelle.
      options:
        a: { en: "Performance recommendations improve the speed of applications; they don't target the spending on idle capacity.", fr: "Les recommandations Performances améliorent la vitesse des applications ; elles ne ciblent pas les dépenses liées à une capacité inutilisée." }
        b: { en: "Operational excellence covers process and workflow efficiency, manageability and deployment practices, not spending.", fr: "Excellence opérationnelle couvre l'efficacité des processus et des flux de travail, la gestion et les pratiques de déploiement, pas les dépenses." }
        d: { en: "Reliability recommendations improve the continuity of business-critical applications, not their cost.", fr: "Les recommandations Fiabilité améliorent la continuité des applications critiques, pas leur coût." }
    references:
      - title: Introduction to Azure Advisor
        url: https://learn.microsoft.com/en-us/azure/advisor/advisor-overview

  # ------------------------------------------------------------------ 2
  - id: az120-qz-41-02
    objective: "4.1.6"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam wants to reduce the memory footprint of its SAP HANA databases. The SAP Basis team compares data tiering and archiving options.

        Which option takes business data out of the HANA database in a way that, unlike the other options, can't be reversed?
      fr: |
        Fabrikam veut réduire l'empreinte mémoire de ses bases de données SAP HANA. L'équipe SAP Basis compare les options de hiérarchisation et d'archivage des données.

        Quelle option sort des données métier de la base HANA d'une manière qui, contrairement aux autres options, ne peut pas être annulée ?
    body:
      options:
        - { id: a, text: { en: "Moving warm tables to SAP HANA Native Storage Extension (NSE)", fr: "Déplacer des tables tièdes vers SAP HANA Native Storage Extension (NSE)" } }
        - { id: b, text: { en: "Archiving data with SAP data archiving into an SAP ILM store", fr: "Archiver des données avec l'archivage de données SAP dans un magasin SAP ILM" } }
        - { id: c, text: { en: "Moving warm partitions to an SAP HANA extension node", fr: "Déplacer des partitions tièdes vers un nœud d'extension SAP HANA" } }
        - { id: d, text: { en: "Increasing the size of the NSE buffer cache", fr: "Augmenter la taille du cache tampon NSE" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Data archiving removes business data from the database and writes it to archive files, for example in an SAP ILM store on Azure Blob Storage; it isn't reversible. Microsoft describes NSE as reversible, unlike data archiving. NSE and extension nodes only displace warm data inside the HANA system, which still serves it to the application.
        fr: |
          L'archivage des données retire des données métier de la base et les écrit dans des fichiers d'archive, par exemple dans un magasin SAP ILM sur Stockage Blob Azure ; il n'est pas réversible. Microsoft décrit NSE comme réversible, contrairement à l'archivage des données. NSE et les nœuds d'extension ne font que déplacer les données tièdes au sein du système HANA, qui continue de les fournir à l'application.
      options:
        a: { en: "NSE keeps warm data in the database on disk and loads it into memory on access; it's reversible.", fr: "NSE conserve les données tièdes dans la base, sur disque, et les charge en mémoire à l'accès ; elle est réversible." }
        c: { en: "An extension node is part of the scale-out HANA system: the data stays in the database.", fr: "Un nœud d'extension fait partie du système HANA en scale-out : les données restent dans la base." }
        d: { en: "Resizing the buffer cache only changes how much warm data is held in memory; no data leaves the database.", fr: "Redimensionner le cache tampon ne change que la quantité de données tièdes gardée en mémoire ; aucune donnée ne quitte la base." }
    references:
      - title: Managing SAP HANA data footprint for balancing cost and performance
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-tiering-guidance

  # ------------------------------------------------------------------ 3
  - id: az120-qz-41-03
    objective: "4.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove runs SAP S/4HANA on Azure VMs. The application servers and the SAP HANA VMs are in two subnets of one virtual network. Network security groups (NSGs) are associated with both subnets and also with the network interface of every SAP VM. The network team finds it hard to analyze which rule restricts a flow during incidents.

        You need to recommend an NSG design that follows the SAP on Azure guidance. Traffic between the two subnets must stay filtered.

        What should you recommend?
      fr: |
        Woodgrove exécute SAP S/4HANA sur des machines virtuelles Azure. Les serveurs d'applications et les machines virtuelles SAP HANA se trouvent dans deux sous-réseaux d'un même réseau virtuel. Des groupes de sécurité réseau (NSG) sont associés aux deux sous-réseaux, ainsi qu'à l'interface réseau de chaque machine virtuelle SAP. L'équipe réseau a du mal à analyser quelle règle restreint un flux lors des incidents.

        Vous devez recommander une conception des NSG conforme aux recommandations pour SAP sur Azure. Le trafic entre les deux sous-réseaux doit rester filtré.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Keep the NSGs on the network interfaces only, and remove the NSGs from the subnets", fr: "Conserver les NSG uniquement sur les interfaces réseau et retirer les NSG des sous-réseaux" } }
        - { id: b, text: { en: "Keep the NSGs on the subnets only, with rules that reference application security groups", fr: "Conserver les NSG uniquement sur les sous-réseaux, avec des règles qui référencent des groupes de sécurité d'application" } }
        - { id: c, text: { en: "Remove all the NSGs, and filter the traffic with a network virtual appliance between the subnets", fr: "Retirer tous les NSG et filtrer le trafic avec une appliance virtuelle réseau entre les sous-réseaux" } }
        - { id: d, text: { en: "Remove all the NSGs, because NSG rules add latency between the SAP tiers", fr: "Retirer tous les NSG, car les règles NSG ajoutent de la latence entre les niveaux SAP" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The SAP planning guide recommends activating NSGs on the subnet level only: NSGs on both the subnet and the NIC level often hinder troubleshooting, and NIC-level NSGs are for exceptional cases. Application security groups let the subnet rules target groups of VMs. NSG and ASG rules don't restrict performance and keep the direct path between the application and DBMS layers.
        fr: |
          Le guide de planification SAP recommande d'activer les NSG au niveau du sous-réseau uniquement : des NSG à la fois au niveau du sous-réseau et de la carte réseau gênent souvent le dépannage, et les NSG au niveau de la carte réseau sont réservés aux cas exceptionnels. Les groupes de sécurité d'application permettent aux règles du sous-réseau de cibler des groupes de machines virtuelles. Les règles NSG et ASG ne limitent pas les performances et conservent le chemin direct entre les couches d'application et SGBD.
      options:
        a: { en: "Microsoft recommends the opposite: NSGs on the subnet level, and NIC-level NSGs only in exceptional situations.", fr: "Microsoft recommande l'inverse : des NSG au niveau du sous-réseau, et des NSG au niveau de la carte réseau uniquement dans des situations exceptionnelles." }
        c: { en: "A network virtual appliance between the SAP application and DBMS layers isn't supported.", fr: "Une appliance virtuelle réseau entre les couches d'application et SGBD SAP n'est pas prise en charge." }
        d: { en: "NSG rules don't restrict performance, and removing them leaves the traffic unfiltered, which the requirement forbids.", fr: "Les règles NSG ne limitent pas les performances, et les retirer laisse le trafic non filtré, ce que l'exigence interdit." }
    references:
      - title: Plan and implement an SAP deployment on Azure
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide

  # ------------------------------------------------------------------ 4
  - id: az120-qz-41-04
    objective: "4.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware runs a quality assurance SAP system with SAP ASE on an Azure VM. The database data files are on a 1-TiB Premium SSD (P30) data disk that holds 300 GiB of data. The data won't exceed 400 GiB, and the performance of a P20 disk (512 GiB) meets the needs of the system.

        You need to reduce the monthly cost of this data disk. The data must stay on Premium SSD.

        What should you do?
      fr: |
        Litware exécute un système SAP d'assurance qualité avec SAP ASE sur une machine virtuelle Azure. Les fichiers de données de la base se trouvent sur un disque de données SSD Premium de 1 Tio (P30) qui contient 300 Gio de données. Les données ne dépasseront pas 400 Gio, et les performances d'un disque P20 (512 Gio) répondent aux besoins du système.

        Vous devez réduire le coût mensuel de ce disque de données. Les données doivent rester sur SSD Premium.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Reduce the size of the P30 disk to 512 GiB", fr: "Réduire la taille du disque P30 à 512 Gio" } }
        - { id: b, text: { en: "Set the performance tier of the P30 disk to P20", fr: "Définir le niveau de performance du disque P30 sur P20" } }
        - { id: c, text: { en: "Copy the data to a new P20 disk, and then delete the P30 disk", fr: "Copier les données sur un nouveau disque P20, puis supprimer le disque P30" } }
        - { id: d, text: { en: "Resize the VM to a smaller size so that the disk is billed at a lower rate", fr: "Redimensionner la machine virtuelle vers une taille inférieure pour que le disque soit facturé à un tarif inférieur" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Premium SSD disks are billed by their size category, so a smaller disk is needed to lower the cost. Shrinking an existing managed disk isn't supported, so the data must move to a new P20 disk before the P30 disk is deleted. This is why SAP disks should be sized carefully from the start.
        fr: |
          Les disques SSD Premium sont facturés selon leur catégorie de taille : il faut donc un disque plus petit pour réduire le coût. La réduction d'un disque managé existant n'est pas prise en charge : les données doivent passer sur un nouveau disque P20 avant la suppression du disque P30. C'est pourquoi les disques SAP doivent être dimensionnés avec soin dès le départ.
      options:
        a: { en: "Shrinking an existing managed disk isn't supported and might result in data loss.", fr: "La réduction d'un disque managé existant n'est pas prise en charge et peut entraîner une perte de données." }
        b: { en: "A performance tier can't be set below the baseline tier of the disk size, and the size still drives the bill.", fr: "Un niveau de performance ne peut pas être défini sous le niveau de base de la taille du disque, et c'est la taille qui détermine la facture." }
        d: { en: "A managed disk is billed for its own size category, whatever the size of the VM it's attached to.", fr: "Un disque managé est facturé selon sa propre catégorie de taille, quelle que soit la taille de la machine virtuelle à laquelle il est attaché." }
    references:
      - title: Expand Virtual Hard Disks on a Linux VM - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/expand-disks
      - title: Performance tiers for Azure Premium SSD managed disks - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-change-performance

  # ------------------------------------------------------------------ 5
  - id: az120-qz-41-05
    objective: "4.1.3"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind plans to buy a three-year Azure savings plan for compute for the SAP application server VMs of its landscape. Some application servers will move to another Azure region next year, and the SAP system that uses the others might be decommissioned before the end of the term.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind prévoit d'acheter un plan d'économies Azure pour le calcul de trois ans pour les machines virtuelles de serveur d'applications SAP de son paysage. Certains serveurs d'applications passeront dans une autre région Azure l'an prochain, et le système SAP qui utilise les autres pourrait être mis hors service avant la fin de la durée.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The savings plan can discount the application server VMs after they move to the other region.", fr: "Le plan d'économies peut appliquer une remise aux machines virtuelles de serveur d'applications après leur passage dans l'autre région." }
        - id: s2
          text: { en: "If the SAP system is decommissioned, Northwind can cancel the savings plan and receive a prorated refund.", fr: "Si le système SAP est mis hors service, Northwind peut annuler le plan d'économies et recevoir un remboursement au prorata." }
        - id: s3
          text: { en: "Paying for the savings plan monthly results in the same total cost as paying for it up front.", fr: "Payer le plan d'économies mensuellement aboutit au même coût total que le payer en une fois." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Savings plan benefits apply to eligible compute usage across the globe, up to the hourly commitment, so a region move doesn't stop the discount. Savings plan purchases can't be canceled or refunded, unlike reservations. The plan can be paid up front or monthly, and the total cost is the same for both payment options.
        fr: |
          Les avantages d'un plan d'économies s'appliquent à l'utilisation de calcul éligible dans le monde entier, jusqu'à l'engagement horaire : un changement de région n'interrompt donc pas la remise. Les achats de plans d'économies ne peuvent être ni annulés ni remboursés, contrairement aux réservations. Le plan peut être payé en une fois ou mensuellement, et le coût total est le même pour les deux options de paiement.
      options:
        s2: { en: "Only reservations can be refunded, within 50,000 USD of canceled commitments per rolling 12 months; savings plans can't.", fr: "Seules les réservations peuvent être remboursées, dans la limite de 50 000 USD d'engagements annulés par période glissante de 12 mois ; les plans d'économies ne le peuvent pas." }
    references:
      - title: What are savings plans? - Microsoft Cost Management
        url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/savings-plan-compute-overview
      - title: Decide between a savings plan and a reservation - Microsoft Cost Management
        url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation

  # ------------------------------------------------------------------ 6
  - id: az120-qz-41-06
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Adatum runs a production SAP ERP system on Azure VMs. The application servers are in a subnet named **snet-app** and the SAP HANA VM is in a subnet named **snet-db** of the same virtual network, in one availability zone. The HANA VM was deployed with accelerated networking disabled. Users report slow dialog response times, and `niping` measurements show a high round-trip time between the application servers and the database.

        The network team proposes four changes, listed in the answer area. You need to classify each change.

        Which result should you assign to each change? To answer, drag the appropriate results to the correct changes. Each result may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum exécute un système SAP ERP de production sur des machines virtuelles Azure. Les serveurs d'applications se trouvent dans un sous-réseau nommé **snet-app** et la machine virtuelle SAP HANA dans un sous-réseau nommé **snet-db** du même réseau virtuel, dans une seule zone de disponibilité. La machine virtuelle HANA a été déployée avec la mise en réseau accélérée désactivée. Les utilisateurs signalent des temps de réponse lents en dialogue, et les mesures `niping` montrent un temps d'aller-retour élevé entre les serveurs d'applications et la base de données.

        L'équipe réseau propose quatre modifications, listées dans la zone de réponse. Vous devez classer chaque modification.

        Quel résultat devez-vous attribuer à chaque modification ? Pour répondre, faites glisser les résultats appropriés vers les modifications correspondantes. Chaque résultat peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: reduce, text: { en: "Supported, and can reduce the latency", fr: "Pris en charge, et peut réduire la latence" } }
        - { id: noeffect, text: { en: "Supported, but doesn't reduce the latency", fr: "Pris en charge, mais ne réduit pas la latence" } }
        - { id: unsupported, text: { en: "Not supported between the SAP application and DBMS layers", fr: "Non pris en charge entre les couches d'application et SGBD SAP" } }
      targets:
        - id: accel
          text: { en: "Enable accelerated networking on the network interface of the HANA VM", fr: "Activer la mise en réseau accélérée sur l'interface réseau de la machine virtuelle HANA" }
        - id: nic
          text: { en: "Add a second network interface to the HANA VM, in snet-db", fr: "Ajouter une deuxième interface réseau à la machine virtuelle HANA, dans snet-db" }
        - id: fw
          text: { en: "Route the traffic from snet-app to snet-db through Azure Firewall to inspect it", fr: "Router le trafic de snet-app vers snet-db au travers du Pare-feu Azure pour l'inspecter" }
        - id: ppg
          text: { en: "If the latency stays too high, place the VMs of this SAP system in a proximity placement group", fr: "Si la latence reste trop élevée, placer les machines virtuelles de ce système SAP dans un groupe de placement de proximité" }
    answer:
      mapping: { accel: reduce, nic: noeffect, fw: unsupported, ppg: reduce }
    explanation:
      correct:
        en: |
          Accelerated networking should be enabled on every SAP VM to reduce latency between VMs. Adding NICs doesn't increase bandwidth because all the NICs of a VM share its bandwidth, so a second NIC doesn't fix the round trip. Any network virtual appliance, including a firewall, in the path between the SAP application and DBMS layers isn't supported. A proximity placement group limited to one SAP system is the documented option when latency remains too high with the default placement.
        fr: |
          La mise en réseau accélérée doit être activée sur chaque machine virtuelle SAP pour réduire la latence entre machines virtuelles. Ajouter des cartes réseau n'augmente pas la bande passante, car toutes les cartes réseau d'une machine virtuelle partagent sa bande passante : une deuxième carte réseau ne corrige donc pas l'aller-retour. Toute appliance virtuelle réseau, pare-feu compris, sur le chemin entre les couches d'application et SGBD SAP n'est pas prise en charge. Un groupe de placement de proximité limité à un seul système SAP est l'option documentée quand la latence reste trop élevée avec le placement par défaut.
      options:
        noeffect: { en: "Multiple NICs are recommended only when a VM needs access to private subnets (or for the internal network of HANA scale-out).", fr: "Plusieurs cartes réseau ne sont recommandées que si une machine virtuelle doit accéder à des sous-réseaux privés (ou pour le réseau interne d'un HANA en scale-out)." }
        unsupported: { en: "An appliance in this path can double the latency, restrict throughput and make Pacemaker clusters fail; NSG and ASG rules remain allowed.", fr: "Une appliance sur ce chemin peut doubler la latence, limiter le débit et faire échouer les clusters Pacemaker ; les règles NSG et ASG restent autorisées." }
    references:
      - title: Plan and implement an SAP deployment on Azure
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
      - title: Configuration options to minimize network latency with SAP applications
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/proximity-placement-scenarios

  # ------------------------------------------------------------------ 7
  - id: az120-qz-41-07
    objective: "4.1.4"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Tailspin runs an SAP application server instance on a Windows Server VM named **vm-app05** of size Standard_E16ds_v5. All the SAP files of the instance are on the OS disk, and the page file is on the local temporary disk (D: drive). To reduce costs, Tailspin wants to run the instance on a Standard_E16s_v5 VM, a size that has no local temporary disk.

        The SAP instance is stopped. A resize of vm-app05 to Standard_E16s_v5 fails.

        You need to move the instance to a Standard_E16s_v5 VM by following the procedure that Microsoft documents.

        Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Tailspin exécute une instance de serveur d'applications SAP sur une machine virtuelle Windows Server nommée **vm-app05** de taille Standard_E16ds_v5. Tous les fichiers SAP de l'instance se trouvent sur le disque du système d'exploitation, et le fichier d'échange est sur le disque temporaire local (lecteur D:). Pour réduire les coûts, Tailspin veut exécuter l'instance sur une machine virtuelle Standard_E16s_v5, une taille qui n'a pas de disque temporaire local.

        L'instance SAP est arrêtée. Un redimensionnement de vm-app05 en Standard_E16s_v5 échoue.

        Vous devez déplacer l'instance sur une machine virtuelle Standard_E16s_v5 en suivant la procédure documentée par Microsoft.

        Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste d'actions vers la zone de réponse et classez-les dans l'ordre correct.
    body:
      count: 3
      actions:
        - { id: pagefile, text: { en: "Move pagefile.sys from the D: drive to the C: drive.", fr: "Déplacer pagefile.sys du lecteur D: vers le lecteur C:." } }
        - { id: snapshot, text: { en: "Create a snapshot of the OS disk of vm-app05.", fr: "Créer un instantané du disque du système d'exploitation de vm-app05." } }
        - { id: newvm, text: { en: "Create a Standard_E16s_v5 VM from the snapshot.", fr: "Créer une machine virtuelle Standard_E16s_v5 à partir de l'instantané." } }
        - { id: dealloc, text: { en: "Stop and deallocate vm-app05, and then resize it to Standard_E16s_v5.", fr: "Arrêter et libérer vm-app05, puis la redimensionner en Standard_E16s_v5." } }
        - { id: redeploy, text: { en: "Redeploy vm-app05 to a new host, and then resize it.", fr: "Redéployer vm-app05 sur un nouvel hôte, puis la redimensionner." } }
        - { id: detach, text: { en: "Detach the temporary disk from vm-app05.", fr: "Détacher le disque temporaire de vm-app05." } }
    answer:
      sequence: [pagefile, snapshot, newvm]
    explanation:
      correct:
        en: |
          For Windows, a VM with a local temporary disk can only be resized to another size with one, so no resize operation reaches Standard_E16s_v5. Microsoft's workaround is to move the page file from the temporary disk to C:, take a snapshot of the VM's OS disk, and create a new VM of the diskless size from that snapshot. Skipping the page file step leads to the error that changing between resource disk and non-resource disk sizes isn't allowed.
        fr: |
          Sous Windows, une machine virtuelle dotée d'un disque temporaire local ne peut être redimensionnée que vers une autre taille qui en possède un : aucune opération de redimensionnement n'atteint donc Standard_E16s_v5. La solution de contournement de Microsoft consiste à déplacer le fichier d'échange du disque temporaire vers C:, à prendre un instantané du disque du système d'exploitation, puis à créer une nouvelle machine virtuelle de la taille sans disque à partir de cet instantané. Omettre l'étape du fichier d'échange conduit à l'erreur indiquant que le passage entre tailles avec et sans disque de ressources n'est pas autorisé.
      options:
        dealloc: { en: "Deallocation helps when a size isn't available on the current hardware cluster; it doesn't allow a change from a size with a temporary disk to one without.", fr: "La libération aide quand une taille n'est pas disponible sur le cluster matériel actuel ; elle ne permet pas de passer d'une taille avec disque temporaire à une taille sans." }
        redeploy: { en: "Redeploying moves the VM to another host but keeps the same size restrictions.", fr: "Le redéploiement déplace la machine virtuelle vers un autre hôte, mais conserve les mêmes restrictions de taille." }
        detach: { en: "The temporary disk is part of the VM size; it can't be detached like a data disk.", fr: "Le disque temporaire fait partie de la taille de la machine virtuelle ; il ne peut pas être détaché comme un disque de données." }
    references:
      - title: FAQ Azure VM sizes with no local temporary disk - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-vms-no-temp-disk

  # ------------------------------------------------------------------ 8
  - id: az120-qz-41-08
    objective: "4.1.5"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam is moving the volumes of a production SAP HANA system to Azure NetApp Files. All the volumes will use Standard network features and will be placed in one capacity pool at the Ultra service level, which provides 128 MiB/s per provisioned TiB. The sizing gives the following requirements.

        | Volume | Capacity | Throughput |
        | --- | --- | --- |
        | /hana/data | 3 TiB | 600 MiB/s |
        | /hana/log | 512 GiB | 300 MiB/s |
        | /hana/shared | 1 TiB | 64 MiB/s |

        You need to configure the capacity pool so that each volume gets its capacity and throughput at the lowest cost. You also need to know how much throughput will remain available for a /hana/logbackup volume without enlarging the pool.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam déplace les volumes d'un système SAP HANA de production vers Azure NetApp Files. Tous les volumes utiliseront les fonctionnalités réseau Standard et seront placés dans un pool de capacité au niveau de service Ultra, qui fournit 128 Mio/s par Tio provisionné. Le dimensionnement donne les exigences suivantes.

        | Volume | Capacité | Débit |
        | --- | --- | --- |
        | /hana/data | 3 Tio | 600 Mio/s |
        | /hana/log | 512 Gio | 300 Mio/s |
        | /hana/shared | 1 Tio | 64 Mio/s |

        Vous devez configurer le pool de capacité pour que chaque volume obtienne sa capacité et son débit au moindre coût. Vous devez aussi savoir quel débit restera disponible pour un volume /hana/logbackup sans agrandir le pool.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    shuffle: false
    body:
      layout: text
      template:
        en: |
          QoS type of the capacity pool: [[qos]]

          Size of the capacity pool: [[size]]

          Throughput left for a /hana/logbackup volume: [[left]]
        fr: |
          Type de QoS du pool de capacité : [[qos]]

          Taille du pool de capacité : [[size]]

          Débit restant pour un volume /hana/logbackup : [[left]]
      slots:
        - id: qos
          options:
            - { id: auto, text: { en: "Auto", fr: "Auto" } }
            - { id: manual, text: { en: "Manual", fr: "Manuel" } }
        - id: size
          options:
            - { id: t5, text: { en: "5 TiB", fr: "5 Tio" } }
            - { id: t6, text: { en: "6 TiB", fr: "6 Tio" } }
            - { id: t8, text: { en: "8 TiB", fr: "8 Tio" } }
            - { id: t16, text: { en: "16 TiB", fr: "16 Tio" } }
        - id: left
          options:
            - { id: m0, text: { en: "0 MiB/s", fr: "0 Mio/s" } }
            - { id: m60, text: { en: "60 MiB/s", fr: "60 Mio/s" } }
            - { id: m448, text: { en: "448 MiB/s", fr: "448 Mio/s" } }
            - { id: m1024, text: { en: "1,024 MiB/s", fr: "1 024 Mio/s" } }
    answer:
      values: { qos: manual, size: t8, left: m60 }
    explanation:
      correct:
        en: |
          With auto QoS, a volume's throughput is its quota × 128 MiB/s per TiB, so the 512-GiB log volume would get only 64 MiB/s. Manual QoS lets you assign throughput to each volume independently of its size, within a pool total of pool size × 128 MiB/s. The volumes need 964 MiB/s, and 964 / 128 = 7.53, so the smallest pool, sized in 1-TiB increments, is 8 TiB (1,024 MiB/s), which also covers the 4.5 TiB of capacity. That leaves 1,024 − 964 = 60 MiB/s for another volume.
        fr: |
          Avec la QoS automatique, le débit d'un volume est son quota × 128 Mio/s par Tio : le volume de journaux de 512 Gio n'obtiendrait que 64 Mio/s. La QoS manuelle permet d'attribuer le débit de chaque volume indépendamment de sa taille, dans la limite d'un total de taille du pool × 128 Mio/s. Les volumes ont besoin de 964 Mio/s, et 964 / 128 = 7,53 : le plus petit pool, dimensionné par incréments de 1 Tio, fait donc 8 Tio (1 024 Mio/s), ce qui couvre aussi les 4,5 Tio de capacité. Il reste 1 024 − 964 = 60 Mio/s pour un autre volume.
      options:
        auto: { en: "Auto QoS ties throughput to quota: the log volume would need a quota of about 2.3 TiB that it doesn't use.", fr: "La QoS automatique lie le débit au quota : le volume de journaux aurait besoin d'un quota d'environ 2,3 Tio qu'il n'utilise pas." }
        t5: { en: "5 TiB covers the capacity but provides only 640 MiB/s.", fr: "5 Tio couvrent la capacité mais ne fournissent que 640 Mio/s." }
        t6: { en: "6 TiB provides only 768 MiB/s, less than the 964 MiB/s needed.", fr: "6 Tio ne fournissent que 768 Mio/s, moins que les 964 Mio/s nécessaires." }
        t16: { en: "16 TiB is the size that the Premium level (64 MiB/s per TiB) would need; at Ultra it doubles the cost for nothing.", fr: "16 Tio est la taille qu'exigerait le niveau Premium (64 Mio/s par Tio) ; en Ultra, cela double le coût inutilement." }
        m448: { en: "With manual QoS, unused capacity doesn't carry its own throughput: the limit is the pool total minus the throughput assigned.", fr: "Avec la QoS manuelle, la capacité inutilisée n'a pas de débit propre : la limite est le total du pool moins le débit attribué." }
    references:
      - title: Service levels for Azure NetApp Files
        url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-service-levels
      - title: Create a capacity pool for Azure NetApp Files
        url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-set-up-capacity-pool

  # ------------------------------------------------------------------ 9
  - id: az120-qz-41-09
    objective: "4.1.7"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Contoso runs SAP S/4HANA on a single SAP HANA 2.0 SPS 07 scale-up system hosted on an M-series Azure VM that is billed at pay-as-you-go rates. A large part of the column store is rarely read, but users must still query it from S/4HANA, and any tiering change must be reversible. After the change, the database VM will keep the same size and region for at least three years.

        You need to minimize the compute cost of the database tier by following the Microsoft guidance for HANA data tiering and for commitment-based discounts.

        Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Contoso exécute SAP S/4HANA sur un système SAP HANA 2.0 SPS 07 scale-up unique, hébergé sur une machine virtuelle Azure de la série M facturée au tarif du paiement à l'utilisation. Une grande partie du stockage en colonnes est rarement lue, mais les utilisateurs doivent toujours pouvoir l'interroger depuis S/4HANA, et toute modification de hiérarchisation doit être réversible. Après la modification, la machine virtuelle de base de données conservera la même taille et la même région pendant au moins trois ans.

        Vous devez réduire au minimum le coût de calcul du niveau base de données en suivant les recommandations de Microsoft pour la hiérarchisation des données HANA et pour les remises sur engagement.

        Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste d'actions vers la zone de réponse et classez-les dans l'ordre correct.
    body:
      count: 4
      actions:
        - { id: charac, text: { en: "Run a data characterization and usage pattern analysis of the database.", fr: "Effectuer une caractérisation des données et une analyse des modèles d'utilisation de la base." } }
        - { id: nse, text: { en: "Move the warm data to SAP HANA Native Storage Extension (NSE).", fr: "Déplacer les données tièdes vers SAP HANA Native Storage Extension (NSE)." } }
        - { id: resize, text: { en: "Resize the VM to a smaller size listed in the SAP HANA hardware directory.", fr: "Redimensionner la machine virtuelle vers une taille inférieure listée dans le répertoire du matériel SAP HANA." } }
        - { id: reserve, text: { en: "Buy a three-year reservation for the VM size in that region.", fr: "Acheter une réservation de trois ans pour la taille de machine virtuelle dans cette région." } }
        - { id: archive, text: { en: "Archive the warm data into an SAP ILM store on Azure Blob Storage.", fr: "Archiver les données tièdes dans un magasin SAP ILM sur Stockage Blob Azure." } }
        - { id: shrink, text: { en: "Reduce the size of the /hana/data disks to match the smaller memory footprint.", fr: "Réduire la taille des disques /hana/data pour l'adapter à l'empreinte mémoire plus faible." } }
        - { id: sp, text: { en: "Buy a three-year savings plan for compute sized on the current VM.", fr: "Acheter un plan d'économies pour le calcul de trois ans dimensionné sur la machine virtuelle actuelle." } }
    answer:
      sequence: [charac, nse, resize, reserve]
    explanation:
      correct:
        en: |
          Data characterization comes first: it identifies the warm data and maps S/4HANA to its tiering option. For warm S/4HANA data that must stay queryable and reversible, the option is NSE, which reduces the memory needed and lets the VM move to a smaller HANA-certified size. Right-sizing comes before any new commitment, and a stable size in one region for three years is the case for a three-year reservation, which gives the deepest discount when fully used.
        fr: |
          La caractérisation des données vient en premier : elle identifie les données tièdes et associe S/4HANA à son option de hiérarchisation. Pour des données S/4HANA tièdes qui doivent rester interrogeables et réversibles, l'option est NSE, qui réduit la mémoire nécessaire et permet de passer à une taille certifiée HANA inférieure. Le redimensionnement passe avant tout nouvel engagement, et une taille stable dans une région pendant trois ans correspond à une réservation de trois ans, qui offre la remise la plus forte quand elle est pleinement utilisée.
      options:
        archive: { en: "Archiving removes the data from the database and isn't reversible, which breaks both requirements.", fr: "L'archivage retire les données de la base et n'est pas réversible, ce qui enfreint les deux exigences." }
        shrink: { en: "NSE doesn't reduce the HANA disk size, and an existing managed disk can't be shrunk.", fr: "NSE ne réduit pas la taille disque de HANA, et un disque managé existant ne peut pas être réduit." }
        sp: { en: "A savings plan gives a lower discount than a reservation for a stable size and region, and sizing it before right-sizing wastes commitment.", fr: "Un plan d'économies offre une remise inférieure à celle d'une réservation pour une taille et une région stables, et le dimensionner avant le redimensionnement gaspille de l'engagement." }
    references:
      - title: Managing SAP HANA data footprint for balancing cost and performance
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-tiering-guidance
      - title: Decide between a savings plan and a reservation - Microsoft Cost Management
        url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/decide-between-savings-plan-reservation

  # ------------------------------------------------------------------ 10
  - id: az120-qz-41-10
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: dropdown
    shuffle: false
    stem:
      en: |
        Litware runs an SAP ERP system on Azure. The SAP HANA VM is covered by a three-year Azure reservation for its size and region. Litware also has an Azure savings plan for compute with an hourly commitment of 4.20 USD, with the same scope. The application tier uses identical application server VMs.

        Assume the following hourly compute rates for one application server VM: 1.00 USD at the pay-as-you-go rate and 0.70 USD at the savings plan rate. Ignore software, storage and networking charges.

        During business hours, eight application server VMs run. At night, only three run.

        You need to predict the compute charges.

        How should you complete the statements? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware exécute un système SAP ERP sur Azure. La machine virtuelle SAP HANA est couverte par une réservation Azure de trois ans pour sa taille et sa région. Litware dispose aussi d'un plan d'économies Azure pour le calcul avec un engagement horaire de 4,20 USD, avec la même étendue. Le niveau application utilise des machines virtuelles de serveur d'applications identiques.

        Supposez les tarifs de calcul horaires suivants pour une machine virtuelle de serveur d'applications : 1,00 USD au tarif du paiement à l'utilisation et 0,70 USD au tarif du plan d'économies. Ignorez les frais de logiciels, de stockage et de réseau.

        Pendant les heures de bureau, huit machines virtuelles de serveur d'applications s'exécutent. La nuit, seules trois s'exécutent.

        Vous devez prévoir les frais de calcul.

        Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          The usage of the HANA VM is discounted by [[hana]].

          For one business hour, the application server VMs cost [[day]].

          For one night hour, the application server VMs cost [[night]].
        fr: |
          L'utilisation de la machine virtuelle HANA est remisée par [[hana]].

          Pour une heure de bureau, les machines virtuelles de serveur d'applications coûtent [[day]].

          Pour une heure de nuit, les machines virtuelles de serveur d'applications coûtent [[night]].
      slots:
        - id: hana
          options:
            - { id: ri, text: { en: "the reservation, without consuming the savings plan commitment", fr: "la réservation, sans consommer l'engagement du plan d'économies" } }
            - { id: spfirst, text: { en: "the savings plan first, then the reservation for the rest", fr: "le plan d'économies d'abord, puis la réservation pour le reste" } }
            - { id: sponly, text: { en: "the savings plan only, because its scope is the same", fr: "le plan d'économies uniquement, car son étendue est la même" } }
        - id: day
          options:
            - { id: d420, text: { en: "4.20 USD", fr: "4,20 USD" } }
            - { id: d560, text: { en: "5.60 USD", fr: "5,60 USD" } }
            - { id: d620, text: { en: "6.20 USD", fr: "6,20 USD" } }
            - { id: d800, text: { en: "8.00 USD", fr: "8,00 USD" } }
        - id: night
          options:
            - { id: n210, text: { en: "2.10 USD", fr: "2,10 USD" } }
            - { id: n300, text: { en: "3.00 USD", fr: "3,00 USD" } }
            - { id: n420, text: { en: "4.20 USD", fr: "4,20 USD" } }
            - { id: n630, text: { en: "6.30 USD", fr: "6,30 USD" } }
    answer:
      values: { hana: ri, day: d620, night: n420 }
    explanation:
      correct:
        en: |
          Azure applies reservation benefits first, so the HANA VM is covered by its reservation and doesn't draw on the savings plan. In a business hour, the commitment covers 4.20 / 0.70 = 6 VMs at the savings plan rate; usage beyond the commitment is priced at pay-as-you-go rates, so the two other VMs add 2.00 USD, for 6.20 USD. At night, the three VMs use only 2.10 USD of the commitment, but the hourly commitment is still charged and the unused part can't roll over to another hour, so the cost is 4.20 USD.
        fr: |
          Azure applique d'abord les avantages des réservations : la machine virtuelle HANA est couverte par sa réservation et ne puise pas dans le plan d'économies. Pendant une heure de bureau, l'engagement couvre 4,20 / 0,70 = 6 machines virtuelles au tarif du plan d'économies ; l'utilisation au-delà de l'engagement est facturée au tarif du paiement à l'utilisation : les deux autres machines virtuelles ajoutent 2,00 USD, soit 6,20 USD. La nuit, les trois machines virtuelles n'utilisent que 2,10 USD de l'engagement, mais l'engagement horaire reste facturé et la part non utilisée ne peut pas être reportée sur une autre heure : le coût est de 4,20 USD.
      options:
        spfirst: { en: "Reservations are more restrictive and usually give greater discounts, so Azure applies them before the savings plan.", fr: "Les réservations sont plus restrictives et offrent généralement de plus fortes remises : Azure les applique donc avant le plan d'économies." }
        d560: { en: "5.60 USD prices all eight VMs at the savings plan rate, but the rate applies only up to the 4.20 USD commitment.", fr: "5,60 USD facture les huit machines virtuelles au tarif du plan d'économies, mais ce tarif ne s'applique que jusqu'à l'engagement de 4,20 USD." }
        n210: { en: "The commitment is a fixed hourly spend: the unused 2.10 USD is lost, not deducted from the bill.", fr: "L'engagement est une dépense horaire fixe : les 2,10 USD non utilisés sont perdus, pas déduits de la facture." }
    references:
      - title: How a savings plan discount is applied - Microsoft Cost Management
        url: https://learn.microsoft.com/en-us/azure/cost-management-billing/savings-plan/discount-application
