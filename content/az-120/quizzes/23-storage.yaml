chapter: 23-storage
questions:
  # ------------------------------------------------------------------ 1
  - id: az120-qz-23-01
    objective: "2.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank is deploying a production SAP HANA database on an M-series VM in availability zone 1. The **/hana/data** and **/hana/log** volumes will use Premium SSD managed disks. A team member proposes to add redundancy to these disks.

        Which configuration should you use for the /hana/data and /hana/log disks to follow Microsoft support guidance?
      fr: |
        Woodgrove Bank déploie une base de données SAP HANA de production sur une machine virtuelle de la série M dans la zone de disponibilité 1. Les volumes **/hana/data** et **/hana/log** utiliseront des disques managés SSD Premium. Un membre de l'équipe propose d'ajouter de la redondance à ces disques.

        Quelle configuration devez-vous utiliser pour les disques de /hana/data et /hana/log afin de suivre les recommandations de prise en charge de Microsoft ?
    body:
      options:
        - { id: a, text: { en: "Zone-redundant (ZRS) disks, so that each disk is replicated across zones", fr: "Des disques redondants interzone (ZRS), afin que chaque disque soit répliqué entre les zones" } }
        - { id: b, text: { en: "Locally redundant (LRS) disks, mirrored in pairs with RAID 1 in the guest", fr: "Des disques localement redondants (LRS), mis en miroir par paires avec RAID 1 dans l'invité" } }
        - { id: c, text: { en: "Locally redundant (LRS) disks, combined with RAID 5 in the guest", fr: "Des disques localement redondants (LRS), combinés avec RAID 5 dans l'invité" } }
        - { id: d, text: { en: "Locally redundant (LRS) disks, without any RAID redundancy in the guest", fr: "Des disques localement redondants (LRS), sans aucune redondance RAID dans l'invité" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          LRS is the only supported resiliency level for database data and log files on Azure block storage. Azure already keeps three copies of each disk on separate storage nodes, so no RAID redundancy is added in the guest; protection against a zone failure comes from database replication to another zone.
        fr: |
          LRS est le seul niveau de résilience pris en charge pour les fichiers de données et de journal des bases de données sur le stockage en mode bloc Azure. Azure conserve déjà trois copies de chaque disque sur des nœuds de stockage distincts : aucune redondance RAID n'est ajoutée dans l'invité, et la protection contre la défaillance d'une zone vient de la réplication de la base de données vers une autre zone.
      options:
        a: { en: "ZRS managed disks aren't supported for database data and log files of SAP; only LRS is.", fr: "Les disques managés ZRS ne sont pas pris en charge pour les fichiers de données et de journal des bases de données SAP ; seul LRS l'est." }
        b: { en: "Azure already keeps three copies of each disk: RAID 1 doubles the cost without any supported benefit.", fr: "Azure conserve déjà trois copies de chaque disque : RAID 1 double le coût sans aucun bénéfice pris en charge." }
        c: { en: "Microsoft advises against RAID 5 or any other in-guest redundancy for these volumes; only striping (RAID 0) is used, for performance.", fr: "Microsoft déconseille RAID 5 et toute autre redondance dans l'invité pour ces volumes ; seul l'entrelacement (RAID 0) est utilisé, pour les performances." }
    references:
      - title: Azure storage types for SAP workload
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage

  # ------------------------------------------------------------------ 2
  - id: az120-qz-23-02
    objective: "2.3.9"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum is deploying a production SAP NetWeaver system on Windows Server. ASCS/SCS runs in a Windows Server failover cluster whose two nodes are in availability zones 1 and 2. The **sapmnt** share must be hosted on Azure Files.

        Which share should you create?
      fr: |
        Adatum déploie un système SAP NetWeaver de production sur Windows Server. ASCS/SCS s'exécute dans un cluster de basculement Windows Server dont les deux nœuds se trouvent dans les zones de disponibilité 1 et 2. Le partage **sapmnt** doit être hébergé sur Azure Files.

        Quel partage devez-vous créer ?
    body:
      options:
        - { id: a, text: { en: "An SMB share in a premium storage account with locally redundant storage (LRS)", fr: "Un partage SMB dans un compte de stockage Premium avec stockage localement redondant (LRS)" } }
        - { id: b, text: { en: "An SMB share in a premium storage account with zone-redundant storage (ZRS)", fr: "Un partage SMB dans un compte de stockage Premium avec stockage redondant interzone (ZRS)" } }
        - { id: c, text: { en: "An NFS share in a premium storage account with zone-redundant storage (ZRS)", fr: "Un partage NFS dans un compte de stockage Premium avec stockage redondant interzone (ZRS)" } }
        - { id: d, text: { en: "An SMB share in a standard storage account with geo-redundant storage (GRS)", fr: "Un partage SMB dans un compte de stockage Standard avec stockage géoredondant (GRS)" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Windows ASCS/SCS clusters use SMB shares on Azure Files, since NFS Azure file shares aren't supported for Windows clients. Microsoft recommends a premium account for production and ZRS for zonal deployments, so the share survives the failure of one zone.
        fr: |
          Les clusters ASCS/SCS Windows utilisent des partages SMB sur Azure Files, car les partages de fichiers Azure NFS ne sont pas pris en charge pour les clients Windows. Microsoft recommande un compte Premium pour la production et ZRS pour les déploiements zonaux, afin que le partage survive à la défaillance d'une zone.
      options:
        a: { en: "LRS keeps the data in one zone: a zone failure could make sapmnt unavailable to both cluster nodes.", fr: "LRS garde les données dans une seule zone : la défaillance d'une zone pourrait rendre sapmnt indisponible pour les deux nœuds du cluster." }
        c: { en: "NFS Azure file shares aren't supported for Windows clients.", fr: "Les partages de fichiers Azure NFS ne sont pas pris en charge pour les clients Windows." }
        d: { en: "A standard account is enough only for non-production, and GRS doesn't protect against a zone failure inside the region.", fr: "Un compte Standard ne suffit que hors production, et GRS ne protège pas contre la défaillance d'une zone dans la région." }
    references:
      - title: Install high-availability SAP NetWeaver with Azure Files SMB
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-windows-azure-files-smb
      - title: NFS file shares in Azure Files
        url: https://learn.microsoft.com/en-us/azure/storage/files/files-nfs-protocol

  # ------------------------------------------------------------------ 3
  - id: az120-qz-23-03
    objective: "2.3.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware runs a production SAP HANA database on an Mbv3-series VM. **/hana/data** is an LVM stripe set of Premium SSD (v1) disks whose host caching is set to ReadOnly. Storage tests show lower read and write IOPS on /hana/data than the disks and the VM size should deliver. The VM storage limits aren't reached.

        You need to correct the configuration according to Microsoft guidance. What should you do?
      fr: |
        Proseware exécute une base de données SAP HANA de production sur une machine virtuelle de la série Mbv3. **/hana/data** est un ensemble entrelacé LVM de disques SSD Premium (v1) dont la mise en cache de l'hôte est définie sur ReadOnly. Les tests de stockage montrent des IOPS en lecture et en écriture sur /hana/data inférieures à ce que les disques et la taille de machine virtuelle devraient fournir. Les limites de stockage de la machine virtuelle ne sont pas atteintes.

        Vous devez corriger la configuration selon les recommandations de Microsoft. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set the host caching of the /hana/data disks to ReadWrite.", fr: "Définir la mise en cache de l'hôte des disques de /hana/data sur ReadWrite." } }
        - { id: b, text: { en: "Enable Write Accelerator on the /hana/data disks.", fr: "Activer l'Accélérateur d'écriture sur les disques de /hana/data." } }
        - { id: c, text: { en: "Set the host caching of the /hana/data disks to None.", fr: "Définir la mise en cache de l'hôte des disques de /hana/data sur None." } }
        - { id: d, text: { en: "Change the stripe size of /hana/data to 64 KB.", fr: "Changer la taille d'entrelacement de /hana/data en 64 Ko." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          For /hana/data on Premium SSD, Microsoft allows None or read caching. On some M(b)v3 sizes, read-cached Premium SSD v1 disks can deliver lower read and write IOPS and throughput than uncached disks, so None is the setting to use here.
        fr: |
          Pour /hana/data sur SSD Premium, Microsoft autorise None ou la mise en cache en lecture. Sur certaines tailles M(b)v3, des disques SSD Premium v1 avec cache en lecture peuvent fournir moins d'IOPS en lecture et en écriture et moins de débit que des disques sans cache : None est donc le paramètre à utiliser ici.
      options:
        a: { en: "No SAP database volume uses ReadWrite caching.", fr: "Aucun volume de base de données SAP n'utilise la mise en cache ReadWrite." }
        b: { en: "Write Accelerator is meant for log volumes only, not for /hana/data.", fr: "L'Accélérateur d'écriture est destiné aux seuls volumes de journal, pas à /hana/data." }
        d: { en: "The recommended stripe size for /hana/data is 256 KB; 64 KB is the value for /hana/log.", fr: "La taille d'entrelacement recommandée pour /hana/data est de 256 Ko ; 64 Ko est la valeur pour /hana/log." }
    references:
      - title: SAP HANA Azure virtual machine Premium SSD storage configurations
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-premium-ssd-v1

  # ------------------------------------------------------------------ 4
  - id: az120-qz-23-04
    objective: "2.3.3"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Adatum hosts the SAP transport directory **/usr/sap/trans** on an Azure NetApp Files NFS v4.1 volume. The SAP VMs are in the subnet 10.20.1.0/24 of a virtual network whose address space is 10.20.0.0/16. A reporting VM with the IP address 10.20.5.10 must only read the transport files. On the SAP VMs, the root user must be able to change the owner of files. No other client may access the volume.

        How should you complete the export policy of the volume? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum héberge le répertoire de transport SAP **/usr/sap/trans** sur un volume Azure NetApp Files NFS v4.1. Les machines virtuelles SAP se trouvent dans le sous-réseau 10.20.1.0/24 d'un réseau virtuel dont l'espace d'adressage est 10.20.0.0/16. Une machine virtuelle de reporting dont l'adresse IP est 10.20.5.10 doit seulement lire les fichiers de transport. Sur les machines virtuelles SAP, l'utilisateur root doit pouvoir changer le propriétaire des fichiers. Aucun autre client ne doit accéder au volume.

        Comment devez-vous compléter la stratégie d'exportation du volume ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Rule index 1 — Allowed clients: [[c1]] — Access: Read Only
          Rule index 2 — Allowed clients: [[c2]] — Access: Read & Write — Root access: [[root]]
        fr: |
          Règle d'index 1 — Clients autorisés : [[c1]] — Accès : Read Only
          Règle d'index 2 — Clients autorisés : [[c2]] — Accès : Read & Write — Accès root : [[root]]
      slots:
        - id: c1
          options:
            - { id: any, text: "0.0.0.0/0" }
            - { id: vnet, text: "10.20.0.0/16" }
            - { id: sub, text: "10.20.1.0/24" }
            - { id: rep, text: "10.20.5.10" }
        - id: c2
          options:
            - { id: any, text: "0.0.0.0/0" }
            - { id: vnet, text: "10.20.0.0/16" }
            - { id: sub, text: "10.20.1.0/24" }
            - { id: rep, text: "10.20.5.10" }
        - id: root
          options:
            - { id: on, text: "On" }
            - { id: off, text: "Off" }
            - { id: offchown, text: { en: "Off, with Chown Mode set to Unrestricted", fr: "Off, avec Chown Mode défini sur Unrestricted" } }
    shuffle: false
    answer:
      values: { c1: rep, c2: sub, root: on }
    explanation:
      correct:
        en: |
          Azure NetApp Files authorizes NFS clients through export policy rules evaluated in index order, each with allowed clients, an access level and a root access setting. Rule 1 gives the reporting VM read-only access, and rule 2 gives read and write access to the SAP subnet only, so no other address matches. Root access must stay On for root on the SAP VMs to change file owners, because with the Restricted chown mode only root can change ownership.
        fr: |
          Azure NetApp Files autorise les clients NFS par des règles de stratégie d'exportation évaluées dans l'ordre des index, chacune avec des clients autorisés, un niveau d'accès et un paramètre d'accès root. La règle 1 donne à la machine virtuelle de reporting un accès en lecture seule, et la règle 2 donne un accès en lecture et écriture au seul sous-réseau SAP : aucune autre adresse ne correspond. L'accès root doit rester sur On pour que root sur les machines virtuelles SAP change les propriétaires des fichiers, car avec le mode chown Restricted, seul root peut changer la propriété.
      options:
        any: { en: "0.0.0.0/0 matches every client, which breaks the requirement that no other client may access the volume.", fr: "0.0.0.0/0 correspond à tous les clients, ce qui enfreint l'exigence qu'aucun autre client n'accède au volume." }
        vnet: { en: "10.20.0.0/16 matches every VM of the virtual network, not only the SAP VMs or the reporting VM.", fr: "10.20.0.0/16 correspond à toutes les machines virtuelles du réseau virtuel, pas seulement aux machines virtuelles SAP ou à celle de reporting." }
        off: { en: "With root access Off, root on the SAP VMs is squashed and can't change the owner of files.", fr: "Avec l'accès root sur Off, root sur les machines virtuelles SAP est rétrogradé et ne peut pas changer le propriétaire des fichiers." }
        offchown: { en: "Unrestricted chown mode lets non-root users change the owner of files they own; it doesn't give root back its rights.", fr: "Le mode chown Unrestricted permet aux utilisateurs non root de changer le propriétaire des fichiers qu'ils possèdent ; il ne rend pas ses droits à root." }
    references:
      - title: Configure export policy for Azure NetApp Files NFS or dual-protocol volumes in Azure NetApp Files
        url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-configure-export-policy

  # ------------------------------------------------------------------ 5
  - id: az120-qz-23-05
    objective: "2.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso runs a large SAP HANA 2.0 SPS 07 scale-up system. **/hana/data** is a single Azure NetApp Files NFS v4.1 volume in an Ultra capacity pool, already mounted with the `nconnect` option. The read throughput that /hana/data now requires exceeds what a single Azure NetApp Files volume can deliver. The network bandwidth of the VM isn't a limit.

        What should you do?
      fr: |
        Contoso exécute un grand système SAP HANA 2.0 SPS 07 scale-up. **/hana/data** est un seul volume Azure NetApp Files NFS v4.1 dans un pool de capacité Ultra, déjà monté avec l'option `nconnect`. Le débit en lecture que /hana/data exige désormais dépasse ce qu'un seul volume Azure NetApp Files peut fournir. La bande passante réseau de la machine virtuelle n'est pas une limite.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Build an LVM stripe set across several Azure NetApp Files volumes for /hana/data.", fr: "Créer un ensemble entrelacé LVM sur plusieurs volumes Azure NetApp Files pour /hana/data." } }
        - { id: b, text: { en: "Mount the /hana/data volume with NFS v3 instead of NFS v4.1.", fr: "Monter le volume /hana/data en NFS v3 au lieu de NFS v4.1." } }
        - { id: c, text: { en: "Add a second network interface to the VM for the /hana/data traffic.", fr: "Ajouter une seconde carte réseau à la machine virtuelle pour le trafic de /hana/data." } }
        - { id: d, text: { en: "Use HANA data volume partitioning across several Azure NetApp Files volumes.", fr: "Utiliser le partitionnement des volumes de données HANA sur plusieurs volumes Azure NetApp Files." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          NFS volumes can't be combined into a stripe set, so a file service needs another way to spread I/O. HANA data volume partitioning, available from HANA 2.0 SPS 03, distributes the data volume across several NFS volumes, so the throughput of the volumes adds up.
        fr: |
          Des volumes NFS ne peuvent pas être combinés en ensemble entrelacé : un service de fichiers a donc besoin d'un autre moyen de répartir les E/S. Le partitionnement des volumes de données HANA, disponible à partir de HANA 2.0 SPS 03, répartit le volume de données sur plusieurs volumes NFS, dont les débits s'additionnent.
      options:
        a: { en: "NFS and SMB shares can't be striped with LVM; striping applies to block disks.", fr: "Les partages NFS et SMB ne peuvent pas être entrelacés avec LVM ; l'entrelacement s'applique aux disques en mode bloc." }
        b: { en: "NFS v3 isn't supported for /hana/data and /hana/log on Azure NetApp Files.", fr: "NFS v3 n'est pas pris en charge pour /hana/data et /hana/log sur Azure NetApp Files." }
        c: { en: "Extra network interfaces don't add bandwidth, and the limit here is the volume, not the VM.", fr: "Des cartes réseau supplémentaires n'ajoutent pas de bande passante, et la limite est ici le volume, pas la machine virtuelle." }
    references:
      - title: SAP HANA Azure virtual machine ANF configuration
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-netapp
      - title: Azure storage types for SAP workload
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage

  # ------------------------------------------------------------------ 6
  - id: az120-qz-23-06
    objective: "2.3.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Wingtip Toys runs SAP application server VMs deployed from a custom hardened SUSE Linux Enterprise Server image. Their OS and data disks are encrypted with Azure Disk Encryption (ADE). The VM sizes support encryption at host.

        Wingtip plans to replace ADE with encryption at host, combined with a disk encryption set that uses a customer-managed key in Azure Key Vault.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys exécute des machines virtuelles de serveurs d'applications SAP déployées à partir d'une image SUSE Linux Enterprise Server personnalisée et renforcée. Leurs disques de système d'exploitation et de données sont chiffrés avec Azure Disk Encryption (ADE). Les tailles de machines virtuelles prennent en charge le chiffrement sur l'hôte.

        Wingtip prévoit de remplacer ADE par le chiffrement sur l'hôte, combiné à un jeu de chiffrement de disque qui utilise une clé gérée par le client dans Azure Key Vault.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "If some VMs still use ADE after September 15, 2028, they keep running until their next reboot, when their encrypted disks fail to unlock.", fr: "Si des machines virtuelles utilisent encore ADE après le 15 septembre 2028, elles continuent de tourner jusqu'à leur prochain redémarrage, où leurs disques chiffrés ne se déverrouillent plus." }
        - id: s2
          text: { en: "With encryption at host and the disk encryption set, the temporary disks of the VMs are encrypted with Wingtip's customer-managed key.", fr: "Avec le chiffrement sur l'hôte et le jeu de chiffrement de disque, les disques temporaires des machines virtuelles sont chiffrés avec la clé gérée par le client de Wingtip." }
        - id: s3
          text: { en: "Encryption at host is supported on VMs deployed from Wingtip's custom Linux image.", fr: "Le chiffrement sur l'hôte est pris en charge sur les machines virtuelles déployées à partir de l'image Linux personnalisée de Wingtip." }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          ADE retires on September 15, 2028: ADE-enabled workloads keep running, but their encrypted disks fail to unlock after a reboot. Encryption at host encrypts the temporary disks and the disk caches, but temporary disks support only platform-managed keys; the customer-managed key of the disk encryption set applies to the managed disks. Unlike ADE, encryption at host works with custom Linux images and uses no VM CPU.
        fr: |
          ADE est mis hors service le 15 septembre 2028 : les charges de travail qui l'utilisent continuent de tourner, mais leurs disques chiffrés ne se déverrouillent plus après un redémarrage. Le chiffrement sur l'hôte chiffre les disques temporaires et les caches des disques, mais les disques temporaires ne prennent en charge que des clés gérées par la plateforme ; la clé gérée par le client du jeu de chiffrement de disque s'applique aux disques managés. Contrairement à ADE, le chiffrement sur l'hôte fonctionne avec les images Linux personnalisées et n'utilise pas le processeur de la machine virtuelle.
      options:
        s2: { en: "Temporary disk encryption with encryption at host is supported only with platform-managed keys.", fr: "Le chiffrement des disques temporaires par le chiffrement sur l'hôte n'est pris en charge qu'avec des clés gérées par la plateforme." }
    references:
      - title: Overview of managed disk encryption options - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/disk-encryption-overview

  # ------------------------------------------------------------------ 7
  - id: az120-qz-23-07
    objective: "2.3.6"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam runs a production SAP HANA database on a **Standard_M32ms** VM. **/hana/log** is an LVM stripe set over three P20 Premium SSD disks (2,300 IOPS each), with host caching set to None and Write Accelerator enabled on each disk. Monitoring shows that /hana/log never exceeds about 5,000 write IOPS, while the log workload needs 6,500 IOPS.

        The design must keep Premium SSD disks for /hana/log and follow Microsoft guidance. What should you do?
      fr: |
        Fabrikam exécute une base de données SAP HANA de production sur une machine virtuelle **Standard_M32ms**. **/hana/log** est un ensemble entrelacé LVM de trois disques SSD Premium P20 (2 300 IOPS chacun), avec la mise en cache de l'hôte définie sur None et l'Accélérateur d'écriture activé sur chaque disque. La supervision montre que /hana/log ne dépasse jamais environ 5 000 IOPS en écriture, alors que la charge de travail du journal a besoin de 6 500 IOPS.

        La conception doit conserver des disques SSD Premium pour /hana/log et suivre les recommandations de Microsoft. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add a fourth P20 disk with Write Accelerator to the /hana/log stripe set.", fr: "Ajouter un quatrième disque P20 avec l'Accélérateur d'écriture à l'ensemble entrelacé de /hana/log." } }
        - { id: b, text: { en: "Resize the VM to Standard_M64s and keep Write Accelerator on the three log disks.", fr: "Redimensionner la machine virtuelle en Standard_M64s et garder l'Accélérateur d'écriture sur les trois disques du journal." } }
        - { id: c, text: { en: "Disable Write Accelerator on one log disk so that its IOPS don't count toward the limit.", fr: "Désactiver l'Accélérateur d'écriture sur un disque du journal pour que ses IOPS ne comptent pas dans la limite." } }
        - { id: d, text: { en: "Set the host caching of the log disks to ReadWrite and keep Write Accelerator enabled.", fr: "Définir la mise en cache de l'hôte des disques du journal sur ReadWrite et garder l'Accélérateur d'écriture activé." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The Write Accelerator IOPS limit applies to the whole VM and is shared by all its accelerated disks: 5,000 IOPS on Standard_M32ms, even though the three P20 disks provide 6,900 IOPS. Standard_M64s raises the per-VM limit to 10,000 IOPS (and 8 disks), so the existing stripe set can deliver the 6,500 IOPS the log needs.
        fr: |
          La limite d'IOPS de l'Accélérateur d'écriture s'applique à toute la machine virtuelle et se partage entre tous ses disques accélérés : 5 000 IOPS sur Standard_M32ms, même si les trois disques P20 fournissent 6 900 IOPS. Standard_M64s porte la limite par machine virtuelle à 10 000 IOPS (et 8 disques) : l'ensemble entrelacé existant peut alors fournir les 6 500 IOPS dont le journal a besoin.
      options:
        a: { en: "Standard_M32ms allows 4 Write Accelerator disks, but the 5,000 IOPS limit is per VM: a fourth disk adds no accelerated IOPS.", fr: "Standard_M32ms autorise 4 disques avec l'Accélérateur d'écriture, mais la limite de 5 000 IOPS est par machine virtuelle : un quatrième disque n'ajoute aucune IOPS accélérée." }
        c: { en: "Write Accelerator is mandatory on /hana/log with Premium SSD on M-series VMs, and on every disk of the stripe set.", fr: "L'Accélérateur d'écriture est obligatoire sur /hana/log avec du SSD Premium sur les machines virtuelles de la série M, et sur chaque disque de l'ensemble entrelacé." }
        d: { en: "Write Accelerator works only with None or ReadOnly caching; ReadWrite + Write Accelerator doesn't exist.", fr: "L'Accélérateur d'écriture ne fonctionne qu'avec la mise en cache None ou ReadOnly ; ReadWrite + Accélérateur d'écriture n'existe pas." }
    references:
      - title: Azure Write Accelerator - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/how-to-enable-write-accelerator

  # ------------------------------------------------------------------ 8
  - id: az120-qz-23-08
    objective: "2.3.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam protects two SAP HANA systems with storage snapshots:

        - **PRD**: /hana/data and /hana/log are Azure NetApp Files volumes. A script creates a HANA snapshot, takes an Azure NetApp Files snapshot, and then closes the HANA snapshot. The snapshots stay on the volumes.
        - **QAS**: /hana/data and /hana/log are Premium SSD v2 disks, protected by incremental snapshots of the managed disks that are created with the default settings.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam protège deux systèmes SAP HANA avec des instantanés de stockage :

        - **PRD** : /hana/data et /hana/log sont des volumes Azure NetApp Files. Un script crée un instantané HANA, prend un instantané Azure NetApp Files, puis ferme l'instantané HANA. Les instantanés restent sur les volumes.
        - **QAS** : /hana/data et /hana/log sont des disques SSD Premium v2, protégés par des instantanés incrémentiels des disques managés créés avec les paramètres par défaut.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "If the PRD script fails before it closes the HANA snapshot, the memory demand of HANA keeps growing and can halt the database.", fr: "Si le script de PRD échoue avant de fermer l'instantané HANA, la demande de mémoire de HANA continue de croître et peut arrêter la base de données." } }
        - { id: b, text: { en: "To be consistent, the PRD script must take the storage snapshot of /hana/log at the same time as the snapshot of /hana/data.", fr: "Pour être cohérent, le script de PRD doit prendre l'instantané de stockage de /hana/log en même temps que celui de /hana/data." } }
        - { id: c, text: { en: "The snapshots kept on the PRD volumes protect the database against the loss of the storage that hosts the volumes.", fr: "Les instantanés conservés sur les volumes de PRD protègent la base de données contre la perte du stockage qui héberge les volumes." } }
        - { id: d, text: { en: "A new incremental snapshot of a QAS disk can be used to create a disk only after its background copy completes.", fr: "Un nouvel instantané incrémentiel d'un disque de QAS ne peut servir à créer un disque qu'une fois sa copie en arrière-plan terminée." } }
        - { id: e, text: { en: "The incremental snapshots of the QAS disks are stored on Premium SSD v2 storage, next to the source disks.", fr: "Les instantanés incrémentiels des disques de QAS sont stockés sur du stockage SSD Premium v2, à côté des disques sources." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          A HANA snapshot left open makes the memory demand of HANA grow until it can halt the database, so closing it is mandatory. Incremental snapshots of Premium SSD v2 disks start a background copy, and unless instant access is enabled when the snapshot is created, they can't be used to create a disk until that copy completes, which matters for restore time objectives.
        fr: |
          Un instantané HANA laissé ouvert fait croître la demande de mémoire de HANA jusqu'à pouvoir arrêter la base de données : le fermer est donc obligatoire. Les instantanés incrémentiels des disques SSD Premium v2 lancent une copie en arrière-plan et, sauf si l'accès instantané est activé à leur création, ils ne peuvent pas servir à créer un disque avant la fin de cette copie, ce qui compte pour les objectifs de délai de restauration.
      options:
        b: { en: "The storage snapshot is taken on /hana/data only; Microsoft advises against snapshots of /hana/log.", fr: "L'instantané de stockage se prend sur /hana/data uniquement ; Microsoft déconseille les instantanés de /hana/log." }
        c: { en: "A snapshot on the same storage isn't a protected backup: at least one snapshot per day must be copied to another location.", fr: "Un instantané sur le même stockage n'est pas une sauvegarde protégée : au moins un instantané par jour doit être copié vers un autre emplacement." }
        e: { en: "Incremental snapshots are stored on Standard HDD storage, whatever the type of the source disk.", fr: "Les instantanés incrémentiels sont stockés sur du stockage HDD Standard, quel que soit le type du disque source." }
    references:
      - title: SAP HANA Azure virtual machine ANF configuration
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-netapp
      - title: Create an incremental snapshot - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/disks-incremental-snapshots

  # ------------------------------------------------------------------ 9
  - id: az120-qz-23-09
    objective: "2.3.9"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys runs a highly available SAP NetWeaver system on SUSE Linux Enterprise Server across availability zones 1 and 2. **/sapmnt/TS1** and **/usr/sap/trans** are NFS shares in a ZRS Azure Files SSD storage account.

        A new disaster recovery requirement states that the content of these file systems must be replicated continuously to the paired region by a feature of the storage service, without copy scripts or scheduled jobs to maintain. The file systems must stay on NFS.

        What should you recommend?
      fr: |
        Tailspin Toys exécute un système SAP NetWeaver à haute disponibilité sur SUSE Linux Enterprise Server, réparti sur les zones de disponibilité 1 et 2. **/sapmnt/TS1** et **/usr/sap/trans** sont des partages NFS dans un compte de stockage Azure Files SSD ZRS.

        Une nouvelle exigence de reprise d'activité indique que le contenu de ces systèmes de fichiers doit être répliqué en continu vers la région jumelée par une fonctionnalité du service de stockage, sans script de copie ni tâche planifiée à maintenir. Les systèmes de fichiers doivent rester en NFS.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Change the redundancy of the storage account to GZRS so that the NFS shares are copied to the paired region.", fr: "Changer la redondance du compte de stockage en GZRS pour que les partages NFS soient copiés vers la région jumelée." } }
        - { id: b, text: { en: "Protect the ASCS/ERS cluster VMs with Azure Site Recovery so that the NFS shares are replicated with them.", fr: "Protéger les machines virtuelles du cluster ASCS/ERS avec Azure Site Recovery pour que les partages NFS soient répliqués avec elles." } }
        - { id: c, text: { en: "Move the file systems to Azure NetApp Files NFS volumes, and configure cross-region replication of the volumes.", fr: "Déplacer les systèmes de fichiers vers des volumes NFS Azure NetApp Files, et configurer la réplication interrégion des volumes." } }
        - { id: d, text: { en: "Configure object replication from the storage account to a storage account in the paired region.", fr: "Configurer la réplication d'objets du compte de stockage vers un compte de stockage de la région jumelée." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Azure Files ZRS replicates synchronously across zones, but NFS shares have no cross-region replication: GRS and GZRS aren't supported, and Microsoft lists only custom methods such as rsync for them. Azure NetApp Files NFS volumes support native cross-region replication, which meets the requirement without scripts.
        fr: |
          Azure Files ZRS réplique de façon synchrone entre les zones, mais les partages NFS n'ont pas de réplication interrégion : GRS et GZRS ne sont pas pris en charge, et Microsoft ne cite pour eux que des méthodes personnalisées comme rsync. Les volumes NFS Azure NetApp Files prennent en charge la réplication interrégion native, qui satisfait l'exigence sans script.
      options:
        a: { en: "GRS and GZRS aren't supported for NFS Azure file shares; SSD shares offer LRS and ZRS only.", fr: "GRS et GZRS ne sont pas pris en charge pour les partages de fichiers Azure NFS ; les partages SSD ne proposent que LRS et ZRS." }
        b: { en: "Site Recovery replicates the disks of the VMs, not the Azure file shares that they mount.", fr: "Site Recovery réplique les disques des machines virtuelles, pas les partages de fichiers Azure qu'elles montent." }
        d: { en: "Object replication copies block blobs between storage accounts; it doesn't apply to file shares.", fr: "La réplication d'objets copie des objets blob de blocs entre comptes de stockage ; elle ne s'applique pas aux partages de fichiers." }
    references:
      - title: Disaster Recovery recommendation for SAP workload
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/disaster-recovery-sap-guide
      - title: NFS file shares in Azure Files
        url: https://learn.microsoft.com/en-us/azure/storage/files/files-nfs-protocol

  # ------------------------------------------------------------------ 10
  - id: az120-qz-23-10
    objective: "2.3.8"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware's SAP HANA **/hana/data** volume is an Azure NetApp Files NFS v4.1 volume with a quota of 6.4 TiB, in a Premium capacity pool that uses auto QoS. The pool has 6 TiB of unallocated capacity. Litware's automation assumes that the throughput of every volume follows its quota, so the pool must keep auto QoS, and the volume must stay in this pool.

        Month-end processing needs 640 MiB/s on /hana/data. HANA must stay online, and the volume must not be remounted. The network bandwidth of the VM isn't a limit. The solution must minimize the provisioned capacity.

        What should you do?
      fr: |
        Le volume SAP HANA **/hana/data** de Litware est un volume Azure NetApp Files NFS v4.1 avec un quota de 6,4 Tio, dans un pool de capacité Premium qui utilise la QoS automatique. Le pool dispose de 6 Tio de capacité non allouée. L'automatisation de Litware suppose que le débit de chaque volume suit son quota : le pool doit donc conserver la QoS automatique, et le volume doit rester dans ce pool.

        Le traitement de fin de mois a besoin de 640 Mio/s sur /hana/data. HANA doit rester en ligne, et le volume ne doit pas être remonté. La bande passante réseau de la machine virtuelle n'est pas une limite. La solution doit réduire au minimum la capacité provisionnée.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Increase the quota of the /hana/data volume to 8 TiB.", fr: "Augmenter le quota du volume /hana/data à 8 Tio." } }
        - { id: b, text: { en: "Increase the quota of the /hana/data volume to 10 TiB.", fr: "Augmenter le quota du volume /hana/data à 10 Tio." } }
        - { id: c, text: { en: "Add a 4 TiB volume and stripe /hana/data across both volumes with LVM.", fr: "Ajouter un volume de 4 Tio et entrelacer /hana/data sur les deux volumes avec LVM." } }
        - { id: d, text: { en: "Mount the /hana/data volume again with a higher nconnect value.", fr: "Remonter le volume /hana/data avec une valeur nconnect plus élevée." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With auto QoS, the throughput of a volume is its quota multiplied by the throughput of the service level: 64 MiB/s per TiB for Premium. 640 MiB/s needs 10 TiB, which the 6 TiB of free pool capacity allows. Azure NetApp Files volumes resize online, without unmounting the volume or stopping HANA.
        fr: |
          Avec la QoS automatique, le débit d'un volume est son quota multiplié par le débit du niveau de service : 64 Mio/s par Tio pour Premium. 640 Mio/s exigent 10 Tio, ce que permettent les 6 Tio de capacité libre du pool. Les volumes Azure NetApp Files se redimensionnent en ligne, sans démonter le volume ni arrêter HANA.
      options:
        a: { en: "8 TiB on Premium gives only 512 MiB/s (8 × 64), below the 640 MiB/s required.", fr: "8 Tio en Premium ne donnent que 512 Mio/s (8 × 64), sous les 640 Mio/s requis." }
        c: { en: "NFS volumes can't be striped with LVM.", fr: "Des volumes NFS ne peuvent pas être entrelacés avec LVM." }
        d: { en: "nconnect needs a remount, which is excluded, and doesn't raise the throughput limit that the quota sets.", fr: "nconnect exige un remontage, exclu ici, et n'augmente pas la limite de débit fixée par le quota." }
    references:
      - title: Service levels for Azure NetApp Files
        url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-service-levels
      - title: SAP HANA Azure virtual machine ANF configuration
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/hana-vm-operations-netapp
