chapter: 31-high-availability
questions:
  # ------------------------------------------------------------------ 1
  - id: az120-qz-31-01
    objective: "3.1.1"
    difficulty: 1
    status: draft
    type: single
    shuffle: false
    stem:
      en: |
        Contoso deploys two SAP application server VMs in the same availability set. For this deployment, Azure guarantees connectivity to at least one of the two VMs 99.95% of the time. Contoso measures downtime over a 30-day month (43,200 minutes).

        What is the maximum monthly downtime that this SLA allows?
      fr: |
        Contoso déploie deux machines virtuelles de serveur d'applications SAP dans le même groupe à haute disponibilité. Pour ce déploiement, Azure garantit la connectivité à au moins une des deux machines virtuelles 99,95 % du temps. Contoso mesure l'indisponibilité sur un mois de 30 jours (43 200 minutes).

        Quelle est l'indisponibilité mensuelle maximale que ce SLA autorise ?
    body:
      options:
        - { id: a, text: { en: "4.3 minutes", fr: "4,3 minutes" } }
        - { id: b, text: { en: "13 minutes", fr: "13 minutes" } }
        - { id: c, text: { en: "21.6 minutes", fr: "21,6 minutes" } }
        - { id: d, text: { en: "43.2 minutes", fr: "43,2 minutes" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A 99.95% SLA leaves 0.05% of the month as possible downtime, and 0.05% of 43,200 minutes is 21.6 minutes. Microsoft's SAP high-availability guidance uses exactly this 30-day basis to convert SLA percentages into minutes.
        fr: |
          Un SLA de 99,95 % laisse 0,05 % du mois comme indisponibilité possible, et 0,05 % de 43 200 minutes représente 21,6 minutes. Les recommandations de haute disponibilité SAP de Microsoft utilisent exactement cette base de 30 jours pour convertir les pourcentages de SLA en minutes.
      options:
        a: { en: "4.3 minutes is 0.01% of the month, which corresponds to the 99.99% SLA of VMs deployed across availability zones.", fr: "4,3 minutes représentent 0,01 % du mois, ce qui correspond au SLA de 99,99 % des machines virtuelles déployées dans plusieurs zones de disponibilité." }
        b: { en: "13 minutes is about 0.03% of the month, which corresponds to an availability of about 99.97%, not 99.95%.", fr: "13 minutes représentent environ 0,03 % du mois, ce qui correspond à une disponibilité d'environ 99,97 %, et non 99,95 %." }
        d: { en: "43.2 minutes is 0.1% of the month, which corresponds to the 99.9% SLA of a single VM with premium storage.", fr: "43,2 minutes représentent 0,1 % du mois, ce qui correspond au SLA de 99,9 % d'une machine virtuelle unique avec un stockage premium." }
    references:
      - title: Azure VMs HA architecture and scenarios for SAP NetWeaver
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-high-availability-architecture-scenarios

  # ------------------------------------------------------------------ 2
  - id: az120-qz-31-02
    objective: "3.1.9"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam runs a non-clustered SAP HANA development system on a single SLES VM. Last week, the guest operating system hit a kernel panic. The VM stayed in that state until an administrator restarted it from the Azure portal; HANA then started automatically through its service watchdog.

        You need the VM to reboot by itself after a kernel panic. What should you do?
      fr: |
        Fabrikam exécute un système de développement SAP HANA sans cluster sur une seule machine virtuelle SLES. La semaine dernière, le système d'exploitation invité a subi une panique du noyau (kernel panic). La machine virtuelle est restée dans cet état jusqu'à ce qu'un administrateur la redémarre depuis le portail Azure ; HANA a ensuite démarré automatiquement grâce à son watchdog de service.

        Vous devez faire en sorte que la machine virtuelle redémarre d'elle-même après une panique du noyau. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set the kernel.panic parameter in /etc/sysctl.conf, for example to 20 or 30 seconds.", fr: "Définir le paramètre kernel.panic dans /etc/sysctl.conf, par exemple à 20 ou 30 secondes." } }
        - { id: b, text: { en: "Add Autostart = 1 to the start profile of the HANA instance, then restart the VM.", fr: "Ajouter Autostart = 1 au profil de démarrage de l'instance HANA, puis redémarrer la machine virtuelle." } }
        - { id: c, text: { en: "Enable boot diagnostics and the serial console so that Azure detects the panic and restarts the VM.", fr: "Activer les diagnostics de démarrage et la console série pour qu'Azure détecte la panique et redémarre la machine virtuelle." } }
        - { id: d, text: { en: "Configure the azure-events-az resource agent so that it reacts to Azure scheduled events.", fr: "Configurer l'agent de ressource azure-events-az pour qu'il réagisse aux événements planifiés Azure." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Azure service healing doesn't restart a Linux VM whose guest OS is in a kernel panic, because the default Linux behavior keeps the OS in that state for debugging. Setting `kernel.panic` in `/etc/sysctl.conf` makes the kernel reboot after the given number of seconds; Microsoft cites 20 to 30 seconds as common values. HANA then restarts through its watchdog as it did before.
        fr: |
          La réparation de service Azure ne redémarre pas une machine virtuelle Linux dont le système invité est en panique du noyau, car le comportement Linux par défaut conserve le système dans cet état pour le débogage. Définir `kernel.panic` dans `/etc/sysctl.conf` fait redémarrer le noyau après le nombre de secondes indiqué ; Microsoft cite 20 à 30 secondes comme valeurs courantes. HANA redémarre ensuite grâce à son watchdog, comme auparavant.
      options:
        b: { en: "Autostart starts SAP instances after the OS boots; it doesn't make a VM leave a kernel panic, and HANA already restarts through its watchdog.", fr: "Autostart démarre les instances SAP après le démarrage du système ; il ne fait pas sortir une machine virtuelle d'une panique du noyau, et HANA redémarre déjà grâce à son watchdog." }
        c: { en: "Boot diagnostics and the serial console help you see and troubleshoot the panic, but they don't make Azure restart a VM whose guest OS is in a kernel panic.", fr: "Les diagnostics de démarrage et la console série aident à voir et à diagnostiquer la panique, mais ils ne font pas redémarrer par Azure une machine virtuelle dont le système invité est en panique du noyau." }
        d: { en: "azure-events-az is a Pacemaker resource agent that moves cluster resources before planned maintenance; this VM has no cluster, and a kernel panic isn't a scheduled event.", fr: "azure-events-az est un agent de ressource Pacemaker qui déplace les ressources du cluster avant une maintenance planifiée ; cette machine virtuelle n'a pas de cluster, et une panique du noyau n'est pas un événement planifié." }
    references:
      - title: SAP HANA availability within one Azure region
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-availability-one-region

  # ------------------------------------------------------------------ 3
  - id: az120-qz-31-03
    objective: "3.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware runs three SAP application server VMs for its SAP ERP system. VM-APP1 and VM-APP2 are in an availability set named **AS-APP**. VM-APP3 was created later without an availability set. Its OS and data disks are managed disks whose delete option is set to **Detach**.

        You need VM-APP3 to be a member of AS-APP so that the three application servers are spread across fault domains. What should you do?
      fr: |
        Litware exécute trois machines virtuelles de serveur d'applications SAP pour son système SAP ERP. VM-APP1 et VM-APP2 se trouvent dans un groupe à haute disponibilité nommé **AS-APP**. VM-APP3 a été créée plus tard sans groupe à haute disponibilité. Ses disques de système d'exploitation et de données sont des disques managés dont l'option de suppression est définie sur **Detach**.

        Vous devez faire de VM-APP3 un membre d'AS-APP pour que les trois serveurs d'applications soient répartis entre des domaines d'erreur. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Delete VM-APP3, then create it again in AS-APP by attaching its existing OS and data disks.", fr: "Supprimer VM-APP3, puis la recréer dans AS-APP en attachant ses disques de système et de données existants." } }
        - { id: b, text: { en: "Stop (deallocate) VM-APP3, change its availability set to AS-APP, then start the VM again.", fr: "Arrêter (libérer) VM-APP3, changer son groupe à haute disponibilité pour AS-APP, puis redémarrer la machine virtuelle." } }
        - { id: c, text: { en: "Run Redeploy on VM-APP3 so that Azure moves the VM to a host that belongs to AS-APP.", fr: "Exécuter Redeploy sur VM-APP3 pour qu'Azure déplace la machine virtuelle vers un hôte appartenant à AS-APP." } }
        - { id: d, text: { en: "Add VM-APP3 and the VMs of AS-APP to the same new proximity placement group.", fr: "Ajouter VM-APP3 et les machines virtuelles d'AS-APP au même nouveau groupe de placement de proximité." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A VM can be added to an availability set only when it's created. To change it, you delete the VM and re-create it in the set; because the disks are set to Detach, the new VM reuses the existing OS and data disks (and the NIC), so no data is lost.
        fr: |
          Une machine virtuelle ne peut être ajoutée à un groupe à haute disponibilité qu'à sa création. Pour en changer, vous supprimez la machine virtuelle et la recréez dans le groupe ; comme les disques sont définis sur Detach, la nouvelle machine virtuelle réutilise les disques de système et de données existants (et la carte réseau), sans perte de données.
      options:
        b: { en: "The availability set of an existing VM can't be changed, even when the VM is deallocated: membership is set only at creation.", fr: "Le groupe à haute disponibilité d'une machine virtuelle existante ne peut pas être modifié, même machine virtuelle libérée : l'appartenance n'est définie qu'à la création." }
        c: { en: "Redeploy moves a VM to a new Azure host to fix host problems; it never makes the VM a member of an availability set.", fr: "Redeploy déplace une machine virtuelle vers un nouvel hôte Azure pour corriger des problèmes d'hôte ; il ne rend jamais la machine virtuelle membre d'un groupe à haute disponibilité." }
        d: { en: "A proximity placement group only keeps VMs physically close for latency; VM-APP3 would still have no fault domain spreading with AS-APP.", fr: "Un groupe de placement de proximité ne fait que rapprocher physiquement les machines virtuelles pour la latence ; VM-APP3 ne serait toujours pas répartie entre les domaines d'erreur avec AS-APP." }
    references:
      - title: Change a VM's availability set by using Azure PowerShell - Azure Virtual Machines
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/windows/change-availability-set

  # ------------------------------------------------------------------ 4
  - id: az120-qz-31-04
    objective: "3.1.7"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Adatum is configuring the Azure fence agent for a two-node Pacemaker cluster on SLES that runs SAP HANA. Each VM has a system-assigned managed identity. You are creating the custom role that will be assigned to these identities. The role already contains the action `Microsoft.Compute/*/read`.

        Which two actions should you add to the role, following Microsoft's guidance? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum configure l'agent de clôture Azure pour un cluster Pacemaker à deux nœuds sur SLES qui exécute SAP HANA. Chaque machine virtuelle dispose d'une identité managée affectée par le système. Vous créez le rôle personnalisé qui sera attribué à ces identités. Le rôle contient déjà l'action `Microsoft.Compute/*/read`.

        Quelles sont les deux actions à ajouter au rôle, en suivant les recommandations de Microsoft ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: "Microsoft.Compute/virtualMachines/powerOff/action" }
        - { id: b, text: "Microsoft.Compute/virtualMachines/deallocate/action" }
        - { id: c, text: "Microsoft.Compute/virtualMachines/start/action" }
        - { id: d, text: "Microsoft.Compute/virtualMachines/restart/action" }
        - { id: e, text: "Microsoft.Compute/virtualMachines/redeploy/action" }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          The Linux Fence Agent role of Microsoft's guide contains exactly three actions: `Microsoft.Compute/*/read`, `virtualMachines/powerOff/action` and `virtualMachines/start/action`. `fence_azure_arm` powers off the failed node through Azure Resource Manager and can start it again; without one of these actions, fencing fails and the cluster can't recover.
        fr: |
          Le rôle Linux Fence Agent du guide de Microsoft contient exactement trois actions : `Microsoft.Compute/*/read`, `virtualMachines/powerOff/action` et `virtualMachines/start/action`. `fence_azure_arm` met hors tension le nœud défaillant via Azure Resource Manager et peut le redémarrer ; sans l'une de ces actions, la clôture échoue et le cluster ne peut pas récupérer.
      options:
        b: { en: "Deallocate releases the compute resources of the VM; the fence agent powers the VM off instead, and the guide's role doesn't grant deallocate.", fr: "Deallocate libère les ressources de calcul de la machine virtuelle ; l'agent de clôture met plutôt la machine virtuelle hors tension, et le rôle du guide n'accorde pas deallocate." }
        d: { en: "Restart reboots a running VM; the fence agent's power cycle relies on powerOff and start, and the guide's role doesn't include restart.", fr: "Restart redémarre une machine virtuelle en cours d'exécution ; le cycle d'alimentation de l'agent de clôture repose sur powerOff et start, et le rôle du guide n'inclut pas restart." }
        e: { en: "Redeploy moves a VM to another host; it isn't a fencing operation and isn't part of the Linux Fence Agent role.", fr: "Redeploy déplace une machine virtuelle vers un autre hôte ; ce n'est pas une opération de clôture et elle ne fait pas partie du rôle Linux Fence Agent." }
    references:
      - title: Set up Pacemaker on SUSE Linux Enterprise Server (SLES) in Azure
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-pacemaker

  # ------------------------------------------------------------------ 5
  - id: az120-qz-31-05
    objective: "3.1.6"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank is finishing a two-node Pacemaker cluster on SLES 15 for SAP HANA scale-up with HANA System Replication. The Azure fence agent is configured with `pcmk_delay_max=15`, and the SAPHanaController resource has the meta attribute `priority=100`.

        You need to apply the remaining cluster settings of Microsoft's guide: resources tend to stay on the node where they run, they tolerate many failures before the cluster moves them away, and in a fence race the node that hosts the HANA primary gets an additional delay so that it survives.

        How should you complete the commands? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank termine un cluster Pacemaker à deux nœuds sur SLES 15 pour SAP HANA scale-up avec HANA System Replication. L'agent de clôture Azure est configuré avec `pcmk_delay_max=15`, et la ressource SAPHanaController possède le méta-attribut `priority=100`.

        Vous devez appliquer les derniers paramètres de cluster du guide de Microsoft : les ressources ont tendance à rester sur le nœud où elles s'exécutent, elles tolèrent de nombreuses défaillances avant que le cluster ne les déplace, et lors d'une course à la clôture, le nœud qui héberge le primaire HANA bénéficie d'un délai supplémentaire pour survivre.

        Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: bash
      template: |
        sudo crm configure rsc_defaults resource-stickiness=[[stick]]
        sudo crm configure rsc_defaults migration-threshold=[[mig]]
        sudo crm configure property [[race]]=30
      slots:
        - id: stick
          options:
            - { id: s0, text: "0" }
            - { id: s1000, text: "1000" }
            - { id: sinf, text: "INFINITY" }
        - id: mig
          options:
            - { id: m1, text: "1" }
            - { id: m3, text: "3" }
            - { id: m5000, text: "5000" }
        - id: race
          options:
            - { id: pfd, text: "priority-fencing-delay" }
            - { id: sto, text: "stonith-timeout" }
            - { id: pdm, text: "pcmk_delay_max" }
    answer:
      values: { stick: s1000, mig: m5000, race: pfd }
    explanation:
      correct:
        en: |
          Microsoft's SLES guide for HANA sets the resource defaults `resource-stickiness=1000` and `migration-threshold=5000`, and the cluster property `priority-fencing-delay=30`. With `priority=100` on the SAPHanaController resource, that property delays the fencing of the node that hosts the HANA primary, so this node wins the fence race in a network split.
        fr: |
          Le guide SLES de Microsoft pour HANA définit les valeurs par défaut de ressource `resource-stickiness=1000` et `migration-threshold=5000`, et la propriété de cluster `priority-fencing-delay=30`. Avec `priority=100` sur la ressource SAPHanaController, cette propriété retarde la clôture du nœud qui héberge le primaire HANA ; ce nœud remporte donc la course à la clôture lors d'une partition du réseau.
      options:
        s0: { en: "A stickiness of 0 gives no preference to the current node, so resources can move whenever the scores change.", fr: "Une adhérence de 0 ne donne aucune préférence au nœud actuel ; les ressources peuvent donc se déplacer dès que les scores changent." }
        sinf: { en: "INFINITY isn't the guide's value; it would pin resources to their node far more strictly than the guide intends.", fr: "INFINITY n'est pas la valeur du guide ; il attacherait les ressources à leur nœud bien plus strictement que ce que prévoit le guide." }
        m1: { en: "A threshold of 1 moves resources away after a single failure, the opposite of tolerating many failures.", fr: "Un seuil de 1 déplace les ressources après une seule défaillance, à l'inverse d'une tolérance à de nombreuses défaillances." }
        sto: { en: "stonith-timeout is the time allowed for a fencing operation (900 with the Azure fence agent); it doesn't favor the HANA primary.", fr: "stonith-timeout est le délai accordé à une opération de clôture (900 avec l'agent de clôture Azure) ; il ne favorise pas le primaire HANA." }
        pdm: { en: "pcmk_delay_max is a parameter of the fencing device, already set to a random delay; it isn't a cluster property and ignores resource priority.", fr: "pcmk_delay_max est un paramètre du périphérique de clôture, déjà défini avec un délai aléatoire ; ce n'est pas une propriété de cluster et il ignore la priorité des ressources." }
    references:
      - title: High availability for SAP HANA on Azure VMs on SLES
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-hana-high-availability

  # ------------------------------------------------------------------ 6
  - id: az120-qz-31-06
    objective: "3.1.8"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys runs SAP S/4HANA across availability zones 1 and 2 of an Azure region:

        - SAP HANA scale-up runs on two VMs, one in each zone, with synchronous HANA System Replication and a Pacemaker cluster. Each VM has its own Azure NetApp Files volumes for /hana/data, /hana/log and /hana/shared, in its own zone.
        - /sapmnt is an NFS share on Azure Files SSD with zone-redundant storage (ZRS).
        - /usr/sap/trans and /interfaces, which holds the files exchanged with partners, are Azure NetApp Files volumes in zone 1 only. No application replicates them.

        After the loss of zone 1, every file system must be usable in zone 2; a manual storage failover is acceptable. You plan to use Azure NetApp Files cross-zone replication. The solution must not duplicate a protection that already exists.

        Which two volumes should you replicate? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys exécute SAP S/4HANA dans les zones de disponibilité 1 et 2 d'une région Azure :

        - SAP HANA scale-up s'exécute sur deux machines virtuelles, une dans chaque zone, avec HANA System Replication synchrone et un cluster Pacemaker. Chaque machine virtuelle dispose de ses propres volumes Azure NetApp Files pour /hana/data, /hana/log et /hana/shared, dans sa propre zone.
        - /sapmnt est un partage NFS sur Azure Files SSD avec un stockage redondant interzone (ZRS).
        - /usr/sap/trans et /interfaces, qui contient les fichiers échangés avec les partenaires, sont des volumes Azure NetApp Files dans la zone 1 uniquement. Aucune application ne les réplique.

        Après la perte de la zone 1, chaque système de fichiers doit être utilisable dans la zone 2 ; un basculement manuel du stockage est acceptable. Vous prévoyez d'utiliser la réplication interzone d'Azure NetApp Files. La solution ne doit pas dupliquer une protection qui existe déjà.

        Quels sont les deux volumes à répliquer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "The /usr/sap/trans volume", fr: "Le volume /usr/sap/trans" } }
        - { id: b, text: { en: "The /hana/data volume of the zone 1 HANA VM", fr: "Le volume /hana/data de la machine virtuelle HANA de la zone 1" } }
        - { id: c, text: { en: "The /interfaces volume", fr: "Le volume /interfaces" } }
        - { id: d, text: { en: "The /hana/shared volume of the zone 1 HANA VM", fr: "Le volume /hana/shared de la machine virtuelle HANA de la zone 1" } }
        - { id: e, text: { en: "The /sapmnt share", fr: "Le partage /sapmnt" } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          /usr/sap/trans and /interfaces exist only in zone 1 and no application replicates them, so storage-based replication is the way to make them available in zone 2. Azure NetApp Files cross-zone replication copies them asynchronously to a destination volume in zone 2, at no extra replication charge; after breaking the replication peering, the destination becomes writable.
        fr: |
          /usr/sap/trans et /interfaces n'existent que dans la zone 1 et aucune application ne les réplique : la réplication au niveau du stockage est donc le moyen de les rendre disponibles dans la zone 2. La réplication interzone d'Azure NetApp Files les copie de façon asynchrone vers un volume de destination dans la zone 2, sans frais de réplication supplémentaires ; après la rupture du peering de réplication, la destination devient accessible en écriture.
      options:
        b: { en: "The HANA data is already replicated to zone 2 by synchronous HSR into the zone 2 VM's own volumes; storage replication would duplicate that protection.", fr: "Les données HANA sont déjà répliquées dans la zone 2 par la HSR synchrone vers les propres volumes de la machine virtuelle de la zone 2 ; la réplication du stockage dupliquerait cette protection." }
        d: { en: "In an HSR scale-up pair, each site has its own /hana/shared; the zone 2 VM already has its /hana/shared volume in zone 2.", fr: "Dans une paire scale-up HSR, chaque site a son propre /hana/shared ; la machine virtuelle de la zone 2 dispose déjà de son volume /hana/shared dans la zone 2." }
        e: { en: "/sapmnt is on Azure Files SSD with ZRS, which already replicates synchronously across zones; it isn't an Azure NetApp Files volume either.", fr: "/sapmnt est sur Azure Files SSD avec ZRS, qui réplique déjà de façon synchrone entre les zones ; ce n'est pas non plus un volume Azure NetApp Files." }
    references:
      - title: Understand Azure NetApp Files Replication
        url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/cross-zone-replication-introduction
      - title: SAP workload configurations with Azure Availability Zones
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones

  # ------------------------------------------------------------------ 7
  - id: az120-qz-31-07
    objective: "3.1.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso is moving the database of its SAP ERP system to Azure VMs. The database runs SQL Server 2019 CU4 on Windows Server 2022 in an Always On availability group with two synchronous replicas, one in availability zone 1 and one in zone 2. Both VMs must stay in the same subnet because the network team doesn't allow a second database subnet. The change board doesn't allow any SQL Server cumulative update before go-live.

        The SAP application servers must reach the new primary replica automatically after a failover. You need to recommend a configuration that SAP supports.

        What should you recommend?
      fr: |
        Contoso migre la base de données de son système SAP ERP vers des machines virtuelles Azure. La base de données utilise SQL Server 2019 CU4 sur Windows Server 2022 dans un groupe de disponibilité Always On avec deux réplicas synchrones, l'un dans la zone de disponibilité 1 et l'autre dans la zone 2. Les deux machines virtuelles doivent rester dans le même sous-réseau, car l'équipe réseau n'autorise pas un second sous-réseau de base de données. Le comité des changements n'autorise aucune mise à jour cumulative de SQL Server avant la mise en production.

        Les serveurs d'applications SAP doivent atteindre automatiquement le nouveau réplica principal après un basculement. Vous devez recommander une configuration prise en charge par SAP.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "A distributed network name (DNN) listener on a unique port, with MultiSubnetFailover=True for the clients", fr: "Un écouteur de nom de réseau distribué (DNN) sur un port unique, avec MultiSubnetFailover=True pour les clients" } }
        - { id: b, text: { en: "A virtual network name (VNN) listener behind an internal Standard load balancer, with a health probe and floating IP", fr: "Un écouteur de nom de réseau virtuel (VNN) derrière un équilibreur de charge Standard interne, avec une sonde d'intégrité et l'IP flottante" } }
        - { id: c, text: { en: "A virtual network name (VNN) listener with one IP address in each subnet of the replicas, and no load balancer", fr: "Un écouteur de nom de réseau virtuel (VNN) avec une adresse IP dans chaque sous-réseau des réplicas, sans équilibreur de charge" } }
        - { id: d, text: { en: "A SQL Server failover cluster instance on a Premium_ZRS Azure shared disk instead of the availability group", fr: "Une instance de cluster de basculement SQL Server sur un disque partagé Azure Premium_ZRS au lieu du groupe de disponibilité" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With both replicas in one subnet, a VNN listener needs an Azure load balancer to hold the listener IP address on the primary node, with a health probe and floating IP (direct server return) on the rule. The DNN alternative requires SQL Server 2019 CU8 or later, which the change board rules out, and multi-subnet isn't possible here. So the internal Standard load balancer is the only supported option.
        fr: |
          Avec les deux réplicas dans un seul sous-réseau, un écouteur VNN a besoin d'un équilibreur de charge Azure qui porte l'adresse IP de l'écouteur sur le nœud principal, avec une sonde d'intégrité et l'IP flottante (retour direct du serveur) sur la règle. L'alternative DNN exige SQL Server 2019 CU8 ou ultérieur, ce que le comité des changements exclut, et le multi-sous-réseau n'est pas possible ici. L'équilibreur de charge Standard interne est donc la seule option prise en charge.
      options:
        a: { en: "A DNN listener for an availability group requires SQL Server 2019 CU8 or later; CU4 doesn't qualify and no update is allowed.", fr: "Un écouteur DNN pour un groupe de disponibilité exige SQL Server 2019 CU8 ou ultérieur ; CU4 ne convient pas et aucune mise à jour n'est autorisée." }
        c: { en: "A listener without load balancer or DNN works only when the replicas are in different subnets; here both VMs must stay in one subnet.", fr: "Un écouteur sans équilibreur de charge ni DNN ne fonctionne que si les réplicas sont dans des sous-réseaux différents ; ici, les deux machines virtuelles doivent rester dans un seul sous-réseau." }
        d: { en: "A failover cluster instance on Azure shared disks is a valid Azure design for SQL Server, but it isn't supported for SAP databases.", fr: "Une instance de cluster de basculement sur des disques partagés Azure est une conception Azure valide pour SQL Server, mais elle n'est pas prise en charge pour les bases de données SAP." }
    references:
      - title: Configure DNN Listener for Availability Group - SQL Server on Azure VMs
        url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/availability-group-distributed-network-name-dnn-listener-configure
      - title: Configure an Azure Load Balancer for an AG VNN Listener - SQL Server on Azure VMs
        url: https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/availability-group-vnn-azure-load-balancer-configure

  # ------------------------------------------------------------------ 8
  - id: az120-qz-31-08
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Proseware runs the ASCS and ERS instances of two SAP systems, NW1 and NW2, in a multi-SID Pacemaker cluster on SLES. A Standard internal load balancer named **lb-ascs** has a frontend IP address, a health probe and a load-balancing rule for each ASCS and ERS virtual host name. All the rules use HA ports with floating IP, and both cluster nodes are in the backend pool.

        Proseware adds the central services of a third system, NW4, to the cluster: ASCS instance number 40 and ERS instance number 42. The ASCS and ERS instances of NW4 must be able to run on different nodes, and the configuration must follow Microsoft's port conventions.

        What should you add to lb-ascs for NW4?
      fr: |
        Proseware exécute les instances ASCS et ERS de deux systèmes SAP, NW1 et NW2, dans un cluster Pacemaker multi-SID sur SLES. Un équilibreur de charge Standard interne nommé **lb-ascs** possède une adresse IP frontale, une sonde d'intégrité et une règle d'équilibrage de charge pour chaque nom d'hôte virtuel ASCS et ERS. Toutes les règles utilisent les ports HA avec l'IP flottante, et les deux nœuds du cluster font partie du pool principal.

        Proseware ajoute au cluster les services centraux d'un troisième système, NW4 : instance ASCS numéro 40 et instance ERS numéro 42. Les instances ASCS et ERS de NW4 doivent pouvoir s'exécuter sur des nœuds différents, et la configuration doit suivre les conventions de ports de Microsoft.

        Que devez-vous ajouter à lb-ascs pour NW4 ?
    body:
      options:
        - { id: a, text: { en: "Two frontend IP addresses, health probes on ports 62040 and 62142, and two HA ports rules with floating IP", fr: "Deux adresses IP frontales, des sondes d'intégrité sur les ports 62040 et 62142, et deux règles de ports HA avec l'IP flottante" } }
        - { id: b, text: { en: "Two frontend IP addresses, health probes on ports 62040 and 62042, and two HA ports rules with floating IP", fr: "Deux adresses IP frontales, des sondes d'intégrité sur les ports 62040 et 62042, et deux règles de ports HA avec l'IP flottante" } }
        - { id: c, text: { en: "One frontend IP address for both ASCS and ERS, a health probe on port 62040, and one HA ports rule with floating IP", fr: "Une adresse IP frontale pour l'ASCS et l'ERS, une sonde d'intégrité sur le port 62040, et une règle de ports HA avec l'IP flottante" } }
        - { id: d, text: { en: "Two frontend IP addresses, health probes on ports 62040 and 62142, and two TCP port rules with floating IP disabled", fr: "Deux adresses IP frontales, des sondes d'intégrité sur les ports 62040 et 62142, et deux règles de port TCP avec l'IP flottante désactivée" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          In a multi-SID cluster, each new SID gets its own configuration on the existing load balancer: one frontend IP address per virtual host name (ASCS and ERS), one probe per instance, and one HA ports rule with floating IP per frontend. The probe ports follow the instance numbers: `620<nr>` for ASCS (62040) and `621<nr>` for ERS (62142), as in Microsoft's multi-SID guide.
        fr: |
          Dans un cluster multi-SID, chaque nouveau SID reçoit sa propre configuration sur l'équilibreur de charge existant : une adresse IP frontale par nom d'hôte virtuel (ASCS et ERS), une sonde par instance et une règle de ports HA avec l'IP flottante par adresse frontale. Les ports de sonde suivent les numéros d'instance : `620<nr>` pour l'ASCS (62040) et `621<nr>` pour l'ERS (62142), comme dans le guide multi-SID de Microsoft.
      options:
        b: { en: "62042 applies the ASCS prefix to the ERS instance number; the ERS probe of instance 42 uses `621<nr>`, so 62142.", fr: "62042 applique le préfixe ASCS au numéro d'instance ERS ; la sonde ERS de l'instance 42 utilise `621<nr>`, soit 62142." }
        c: { en: "ASCS and ERS have separate virtual host names and can run on different nodes, so each needs its own frontend IP, probe and rule.", fr: "L'ASCS et l'ERS ont des noms d'hôte virtuels distincts et peuvent s'exécuter sur des nœuds différents ; chacun a donc besoin de sa propre adresse IP frontale, de sa sonde et de sa règle." }
        d: { en: "Cluster virtual IPs need floating IP and HA ports; per-port rules without floating IP don't let the cluster IP follow the failover.", fr: "Les adresses IP virtuelles d'un cluster exigent l'IP flottante et les ports HA ; des règles par port sans IP flottante ne permettent pas à l'adresse IP du cluster de suivre le basculement." }
    references:
      - title: Azure VMs high availability for SAP NetWeaver on SLES multi-SID
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-multi-sid

  # ------------------------------------------------------------------ 9
  - id: az120-qz-31-09
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam runs the ASCS and ERS instances of three SAP systems, FB1, FB2 and FB3, in one two-node multi-SID Pacemaker cluster on SLES for SAP Applications 15. The three systems are based on ABAP Platform 2023 and use the Standalone Enqueue Server 2 (ENSA2).

        Fabrikam plans to add the central services of two new ENSA2 systems, FB4 and FB5, to the cluster. A legacy system named LG1 runs SAP NetWeaver 7.40 with the Standalone Enqueue Server (ENSA1) on separate VMs.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam exécute les instances ASCS et ERS de trois systèmes SAP, FB1, FB2 et FB3, dans un même cluster Pacemaker multi-SID à deux nœuds sur SLES for SAP Applications 15. Les trois systèmes sont basés sur ABAP Platform 2023 et utilisent Standalone Enqueue Server 2 (ENSA2).

        Fabrikam prévoit d'ajouter au cluster les services centraux de deux nouveaux systèmes ENSA2, FB4 et FB5. Un système hérité nommé LG1 exécute SAP NetWeaver 7.40 avec Standalone Enqueue Server (ENSA1) sur des machines virtuelles distinctes.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: After FB4 and FB5 are added, the cluster hosts the maximum number of SAP SIDs that Microsoft supports for a multi-SID ASCS/ERS cluster on SLES.
            fr: Une fois FB4 et FB5 ajoutés, le cluster héberge le nombre maximal de SID SAP que Microsoft prend en charge pour un cluster ASCS/ERS multi-SID sur SLES.
        - id: s2
          text:
            en: If FB1 is retired later, the central services of LG1 can be moved into the cluster in its place.
            fr: Si FB1 est retiré plus tard, les services centraux de LG1 peuvent être déplacés dans le cluster à sa place.
        - id: s3
          text:
            en: A third node can be added to the cluster as an additional failover target for the ASCS and ERS instances of FB1 to FB5.
            fr: Un troisième nœud peut être ajouté au cluster comme cible de basculement supplémentaire pour les instances ASCS et ERS de FB1 à FB5.
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Multi-SID clustering of ASCS/ERS on SLES in Azure is limited to five SAP SIDs per cluster, so FB1 to FB5 reach the limit. A mix of ENSA1 and ENSA2 in the same cluster isn't supported, so LG1 can't join even when a slot is free. The three-node setup is supported only for ENSA2 systems, which is the case for all five SIDs.
        fr: |
          Le clustering multi-SID d'ASCS/ERS sur SLES dans Azure est limité à cinq SID SAP par cluster : FB1 à FB5 atteignent donc la limite. Un mélange d'ENSA1 et d'ENSA2 dans le même cluster n'est pas pris en charge : LG1 ne peut donc pas rejoindre le cluster, même si une place se libère. La configuration à trois nœuds n'est prise en charge que pour les systèmes ENSA2, ce qui est le cas des cinq SID.
      options:
        s2: { en: "The limit isn't the issue: Microsoft doesn't support mixing ENSA1 and ENSA2 systems in one multi-SID cluster.", fr: "La limite n'est pas en cause : Microsoft ne prend pas en charge le mélange de systèmes ENSA1 et ENSA2 dans un même cluster multi-SID." }
    references:
      - title: Azure VMs high availability for SAP NetWeaver on SLES multi-SID
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-multi-sid

  # ------------------------------------------------------------------ 10
  - id: az120-qz-31-10
    objective: "3.1.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Traders is designing an SAP S/4HANA production system in a region that has availability zones. Users connect through the SAP Web Dispatcher, and the system is down whenever one of its layers is down.

        | Layer | Deployment | Azure VM SLA |
        | --- | --- | --- |
        | SAP Web Dispatcher | One VM with Premium SSD disks, in zone 1 | 99.9% |
        | Application servers | Four VMs spread across zones 1 and 2 | 99.99% |
        | ASCS/ERS | Pacemaker cluster, one node in zone 1 and one in zone 2 | 99.99% |
        | SAP HANA | HANA System Replication and Pacemaker, one node per zone | 99.99% |

        Use a 30-day month (43,200 minutes). The business requires an infrastructure availability of at least 99.95% for the whole system, with the fewest additional VMs.

        How should you complete the statements? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders conçoit un système de production SAP S/4HANA dans une région qui dispose de zones de disponibilité. Les utilisateurs se connectent via SAP Web Dispatcher, et le système est indisponible dès que l'une de ses couches est indisponible.

        | Couche | Déploiement | SLA des machines virtuelles Azure |
        | --- | --- | --- |
        | SAP Web Dispatcher | Une machine virtuelle avec des disques SSD Premium, dans la zone 1 | 99,9 % |
        | Serveurs d'applications | Quatre machines virtuelles réparties entre les zones 1 et 2 | 99,99 % |
        | ASCS/ERS | Cluster Pacemaker, un nœud dans la zone 1 et un dans la zone 2 | 99,99 % |
        | SAP HANA | HANA System Replication et Pacemaker, un nœud par zone | 99,99 % |

        Utilisez un mois de 30 jours (43 200 minutes). L'entreprise exige une disponibilité de l'infrastructure d'au moins 99,95 % pour l'ensemble du système, avec le moins possible de machines virtuelles supplémentaires.

        Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          The composite infrastructure availability of the current design is approximately [[comp]].

          This figure allows approximately [[down]] of downtime per month.

          To meet the business requirement, you should [[fix]].
        fr: |
          La disponibilité composite de l'infrastructure de la conception actuelle est d'environ [[comp]].

          Ce chiffre autorise environ [[down]] d'indisponibilité par mois.

          Pour répondre à l'exigence de l'entreprise, vous devez [[fix]].
      slots:
        - id: comp
          options:
            - { id: c9987, text: { en: "99.87%", fr: "99,87 %" } }
            - { id: c9990, text: { en: "99.90%", fr: "99,90 %" } }
            - { id: c9996, text: { en: "99.96%", fr: "99,96 %" } }
            - { id: c9997, text: { en: "99.97%", fr: "99,97 %" } }
        - id: down
          options:
            - { id: m4, text: { en: "4.3 minutes", fr: "4,3 minutes" } }
            - { id: m13, text: { en: "13 minutes", fr: "13 minutes" } }
            - { id: m43, text: { en: "43.2 minutes", fr: "43,2 minutes" } }
            - { id: m56, text: { en: "56 minutes", fr: "56 minutes" } }
        - id: fix
          options:
            - { id: wd2, text: { en: "deploy a second Web Dispatcher VM in zone 2, behind a Standard load balancer", fr: "déployer une seconde machine virtuelle Web Dispatcher dans la zone 2, derrière un équilibreur de charge Standard" } }
            - { id: avset, text: { en: "move the Web Dispatcher VM into its own availability set", fr: "déplacer la machine virtuelle Web Dispatcher dans son propre groupe à haute disponibilité" } }
            - { id: app3, text: { en: "add two application server VMs in zone 3", fr: "ajouter deux machines virtuelles de serveur d'applications dans la zone 3" } }
            - { id: ppg, text: { en: "place the Web Dispatcher VM in a proximity placement group with the ASCS/ERS VMs", fr: "placer la machine virtuelle Web Dispatcher dans un groupe de placement de proximité avec les machines virtuelles ASCS/ERS" } }
    answer:
      values: { comp: c9987, down: m56, fix: wd2 }
    explanation:
      correct:
        en: |
          Serial layers multiply: 0.999 x 0.9999 x 0.9999 x 0.9999 is about 0.9987, or 99.87%, and the remaining 0.13% of 43,200 minutes is about 56 minutes per month. The single Web Dispatcher VM is the weak link. A second Web Dispatcher VM in the other zone gives that layer the 99.99% zone SLA, and 0.9999 to the power of four is about 99.96%, which meets the 99.95% target with one more VM.
        fr: |
          Les couches en série se multiplient : 0,999 x 0,9999 x 0,9999 x 0,9999 donne environ 0,9987, soit 99,87 %, et les 0,13 % restants de 43 200 minutes représentent environ 56 minutes par mois. La machine virtuelle Web Dispatcher unique est le maillon faible. Une seconde machine virtuelle Web Dispatcher dans l'autre zone donne à cette couche le SLA de 99,99 % des zones, et 0,9999 à la puissance quatre donne environ 99,96 %, ce qui atteint l'objectif de 99,95 % avec une seule machine virtuelle de plus.
      options:
        c9990: { en: "A chain of serial layers is always below its weakest layer; 99.90% ignores the three other layers.", fr: "Une chaîne de couches en série est toujours inférieure à sa couche la plus faible ; 99,90 % ignore les trois autres couches." }
        c9997: { en: "99.97% is the product of the three zonal layers only; it leaves out the single Web Dispatcher VM.", fr: "99,97 % est le produit des trois seules couches zonales ; il omet la machine virtuelle Web Dispatcher unique." }
        m13: { en: "13 minutes matches 99.97%, which leaves out the Web Dispatcher layer.", fr: "13 minutes correspondent à 99,97 %, qui omet la couche Web Dispatcher." }
        avset: { en: "A single VM in an availability set still has only the single-instance SLA; the 99.95% availability set SLA requires two or more VMs.", fr: "Une machine virtuelle unique dans un groupe à haute disponibilité conserve le seul SLA d'instance unique ; le SLA de 99,95 % des groupes à haute disponibilité exige deux machines virtuelles ou plus." }
        app3: { en: "The application layer already has the 99.99% zone SLA; adding VMs there doesn't fix the single Web Dispatcher VM.", fr: "La couche d'applications bénéficie déjà du SLA de 99,99 % des zones ; y ajouter des machines virtuelles ne corrige pas la machine virtuelle Web Dispatcher unique." }
        ppg: { en: "A proximity placement group reduces latency but doesn't change the SLA of a single VM.", fr: "Un groupe de placement de proximité réduit la latence mais ne modifie pas le SLA d'une machine virtuelle unique." }
    references:
      - title: Azure VMs HA architecture and scenarios for SAP NetWeaver
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-high-availability-architecture-scenarios
