chapter: 11-target-requirements
questions:
  # ------------------------------------------------------------------ 1
  - id: az120-qz-11-01
    objective: "1.1.7"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys runs SAP NetWeaver on SUSE Linux Enterprise Server virtual machines in Azure. Before go-live, the SAP Basis team checks the prerequisites that SAP Note 2015553 sets for SAP to support the deployment.

        What must be enabled on every SAP virtual machine?
      fr: |
        Tailspin Toys exécute SAP NetWeaver sur des machines virtuelles SUSE Linux Enterprise Server dans Azure. Avant la mise en production, l'équipe SAP Basis vérifie les prérequis que la note SAP 2015553 fixe pour que SAP prenne en charge le déploiement.

        Qu'est-ce qui doit être activé sur chaque machine virtuelle SAP ?
    body:
      options:
        - { id: a, text: { en: "The Azure Monitor Agent, with a data collection rule", fr: "L'agent Azure Monitor, avec une règle de collecte de données" } }
        - { id: b, text: { en: "The Azure VM extension for SAP solutions", fr: "L'extension de machine virtuelle Azure pour les solutions SAP" } }
        - { id: c, text: { en: "A provider of Azure Monitor for SAP solutions", fr: "Un fournisseur d'Azure Monitor pour les solutions SAP" } }
        - { id: d, text: { en: "The Dependency agent of VM insights", fr: "L'agent de dépendances de VM Insights" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          To be sure that SAP supports the environment, Microsoft requires the Azure VM extension for SAP solutions on each SAP VM. It provides the Azure infrastructure data that SAP support relies on, and SAP Note 2015553 lists it among the support prerequisites, together with the Professional Direct or higher Microsoft support contract.
        fr: |
          Pour être sûr que SAP prend en charge l'environnement, Microsoft exige l'extension de machine virtuelle Azure pour les solutions SAP sur chaque machine virtuelle SAP. Elle fournit les données d'infrastructure Azure sur lesquelles s'appuie le support SAP, et la note SAP 2015553 la cite parmi les prérequis de support, avec un contrat de support Microsoft Professional Direct ou supérieur.
      options:
        a: { en: "The Azure Monitor Agent collects logs and metrics for Azure Monitor; it doesn't replace the extension that SAP support requires.", fr: "L'agent Azure Monitor collecte des journaux et des métriques pour Azure Monitor ; il ne remplace pas l'extension qu'exige le support SAP." }
        c: { en: "Azure Monitor for SAP solutions is an optional monitoring service; its providers aren't a support prerequisite of SAP Note 2015553.", fr: "Azure Monitor pour les solutions SAP est un service de supervision facultatif ; ses fournisseurs ne sont pas un prérequis de support de la note SAP 2015553." }
        d: { en: "The Dependency agent maps processes and connections for VM insights; SAP support doesn't require it.", fr: "L'agent de dépendances cartographie les processus et les connexions pour VM Insights ; le support SAP ne l'exige pas." }
    references:
      - title: Implement the Azure VM extension for SAP solutions
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/vm-extension-for-sap

  # ------------------------------------------------------------------ 2
  - id: az120-qz-11-02
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum plans a new SAP NetWeaver system whose load will come mostly from custom-developed programs. The architects consider the SAP Quick Sizer results unreliable for this load, and no existing system runs a comparable workload.

        You need to determine the target VM sizes before the production deployment. What should you do?
      fr: |
        Adatum prévoit un nouveau système SAP NetWeaver dont la charge viendra surtout de programmes développés sur mesure. Les architectes jugent les résultats de SAP Quick Sizer peu fiables pour cette charge, et aucun système existant n'exécute une charge comparable.

        Vous devez déterminer les tailles de machines virtuelles cibles avant le déploiement de production. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Read the SAPS from the SAP EarlyWatch Alert reports of the system", fr: "Lire les SAPS dans les rapports SAP EarlyWatch Alert du système" } }
        - { id: b, text: { en: "Apply the right-sizing recommendations of Azure Advisor", fr: "Appliquer les recommandations de dimensionnement d'Azure Advisor" } }
        - { id: c, text: { en: "Run a proof of concept on Azure and measure the load", fr: "Mener une preuve de concept sur Azure et mesurer la charge" } }
        - { id: d, text: { en: "Select the largest VM sizes listed in SAP Note 1928533", fr: "Choisir les plus grandes tailles de la note SAP 1928533" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Microsoft's planning guide recommends a proof of concept when you are unsure of the sizing. Neither of the usual sources applies here: Quick Sizer is considered unreliable for this load, and there is no running system to measure, so the load must be measured on Azure before production.
        fr: |
          Le guide de planification de Microsoft recommande une preuve de concept quand le dimensionnement est incertain. Aucune des sources habituelles ne s'applique ici : Quick Sizer est jugé peu fiable pour cette charge et il n'existe aucun système en service à mesurer ; la charge doit donc être mesurée sur Azure avant la production.
      options:
        a: { en: "EarlyWatch Alert reports describe a running system; the new system doesn't exist yet.", fr: "Les rapports EarlyWatch Alert décrivent un système en service ; le nouveau système n'existe pas encore." }
        b: { en: "Azure Advisor analyzes the usage of VMs that already run in Azure; it can't size a system that doesn't exist.", fr: "Azure Advisor analyse l'utilisation de machines virtuelles qui s'exécutent déjà dans Azure ; il ne peut pas dimensionner un système qui n'existe pas." }
        d: { en: "Choosing the largest sizes isn't a sizing method: it doesn't tell how many SAPS the system needs and can waste a large budget.", fr: "Choisir les plus grandes tailles n'est pas une méthode de dimensionnement : cela n'indique pas les SAPS nécessaires et peut gaspiller un budget important." }
    references:
      - title: Plan and implement an SAP deployment on Azure
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide

  # ------------------------------------------------------------------ 3
  - id: az120-qz-11-03
    objective: "1.1.9"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso will move four on-premises SAP systems to Azure in several waves: a GRC sandbox, a training system, the ERP production system, and a BW production system that is tightly connected to ERP. A performance analysis showed that running BW in Azure while ERP stays on-premises would significantly slow down the BW data loads. Contoso will also implement a new SAP system next year.

        You need to recommend a migration order that follows Microsoft's guidance and limits risk. What should you recommend?
      fr: |
        Contoso va déplacer quatre systèmes SAP locaux vers Azure en plusieurs vagues : un bac à sable GRC, un système de formation, le système ERP de production et un système BW de production étroitement lié à l'ERP. Une analyse des performances a montré qu'exécuter BW dans Azure pendant que l'ERP reste en local ralentirait fortement les chargements de données de BW. Contoso va aussi implémenter un nouveau système SAP l'an prochain.

        Vous devez recommander un ordre de migration qui suit les recommandations de Microsoft et limite les risques. Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Move ERP production first to secure the largest savings, then BW, the sandbox and the training system; deploy the new system in Azure.", fr: "Déplacer d'abord l'ERP de production pour obtenir les plus fortes économies, puis BW, le bac à sable et la formation ; déployer le nouveau système dans Azure." } }
        - { id: b, text: { en: "Move the sandbox and training systems first, then BW production, and ERP production in the last wave; deploy the new system in Azure.", fr: "Déplacer d'abord le bac à sable et la formation, puis BW de production, et l'ERP de production dans la dernière vague ; déployer le nouveau système dans Azure." } }
        - { id: c, text: { en: "Move the sandbox and training systems first, and ERP and BW production together in the last wave; deploy the new system on-premises.", fr: "Déplacer d'abord le bac à sable et la formation, et l'ERP et BW de production ensemble dans la dernière vague ; déployer le nouveau système en local." } }
        - { id: d, text: { en: "Move the sandbox and training systems first, and ERP and BW production together in the last wave; deploy the new system in Azure.", fr: "Déplacer d'abord le bac à sable et la formation, et l'ERP et BW de production ensemble dans la dernière vague ; déployer le nouveau système dans Azure." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Microsoft recommends starting with low-impact sandbox or training systems and moving the most critical system, ERP production, last. Tightly connected systems whose separation hurts performance form one migration group and move together, and a new SAP system starts in Azure by default instead of being deployed on-premises and moved later.
        fr: |
          Microsoft recommande de commencer par des systèmes à faible impact, bac à sable ou formation, et de déplacer en dernier le système le plus critique, l'ERP de production. Les systèmes étroitement liés dont la séparation nuit aux performances forment un groupe de migration et se déplacent ensemble, et un nouveau système SAP démarre dans Azure par défaut au lieu d'être déployé en local puis déplacé.
      options:
        a: { en: "Moving the most critical system first maximizes risk; ERP production is the last system to move.", fr: "Déplacer le système le plus critique en premier maximise le risque ; l'ERP de production est le dernier système à déplacer." }
        b: { en: "The analysis shows that BW suffers when it runs in Azure without ERP: the two systems must move in the same group.", fr: "L'analyse montre que BW souffre quand il s'exécute dans Azure sans l'ERP : les deux systèmes doivent se déplacer dans le même groupe." }
        c: { en: "A new system should start in Azure; deploying it on-premises adds a migration later.", fr: "Un nouveau système doit démarrer dans Azure ; le déployer en local ajoute une migration plus tard." }
    references:
      - title: Analyze strategies for migrating SAP systems to Microsoft Azure
        url: https://learn.microsoft.com/en-us/training/modules/explore-migration-options/2-analyze-strategies-migrating-sap-systems-microsoft-azure

  # ------------------------------------------------------------------ 4
  - id: az120-qz-11-04
    objective: "1.1.5"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam runs SAP HANA on Azure virtual machines deployed from a pay-as-you-go Red Hat Enterprise Linux for SAP with High Availability image published by Red Hat. Fabrikam has now bought Red Hat subscriptions and wants to stop paying the RHEL software charges through Azure. The VMs must not be redeployed, and Fabrikam's Azure account has never been used with a Red Hat program.

        What should you do first?
      fr: |
        Fabrikam exécute SAP HANA sur des machines virtuelles Azure déployées à partir d'une image Red Hat Enterprise Linux for SAP with High Availability en paiement à l'utilisation, publiée par Red Hat. Fabrikam a désormais acheté des abonnements Red Hat et veut cesser de payer les frais logiciels RHEL via Azure. Les machines virtuelles ne doivent pas être redéployées, et le compte Azure de Fabrikam n'a jamais été utilisé avec un programme Red Hat.

        Que devez-vous faire en premier ?
    body:
      options:
        - { id: a, text: { en: "Register the Azure account in Red Hat Cloud Access", fr: "Inscrire le compte Azure à Red Hat Cloud Access" } }
        - { id: b, text: { en: "Install the AHBForRHEL extension on each VM", fr: "Installer l'extension AHBForRHEL sur chaque machine virtuelle" } }
        - { id: c, text: { en: "Set the license type of each VM to RHEL_SAPHA", fr: "Définir le type de licence de chaque machine virtuelle sur RHEL_SAPHA" } }
        - { id: d, text: { en: "Set the license type of each VM to NONE", fr: "Définir le type de licence de chaque machine virtuelle sur NONE" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Azure Hybrid Benefit for Linux converts an eligible RHEL pay-as-you-go VM to bring-your-own-subscription without redeployment, but the Azure account must first be part of the Red Hat Cloud Access program. After the registration, you set the license type to `RHEL_BYOS` with `az vm update`, then register the VMs with Red Hat for updates.
        fr: |
          Azure Hybrid Benefit pour Linux convertit une machine virtuelle RHEL éligible en paiement à l'utilisation vers le modèle BYOS sans redéploiement, mais le compte Azure doit d'abord faire partie du programme Red Hat Cloud Access. Après l'inscription, vous définissez le type de licence sur `RHEL_BYOS` avec `az vm update`, puis vous inscrivez les machines virtuelles auprès de Red Hat pour les mises à jour.
      options:
        b: { en: "The AHBForRHEL extension is used for the opposite conversion, from BYOS to pay-as-you-go.", fr: "L'extension AHBForRHEL sert à la conversion inverse, de BYOS vers le paiement à l'utilisation." }
        c: { en: "RHEL_SAPHA is a pay-as-you-go license type: the VMs would keep paying the RHEL software through Azure.", fr: "RHEL_SAPHA est un type de licence en paiement à l'utilisation : les machines virtuelles continueraient à payer le logiciel RHEL via Azure." }
        d: { en: "NONE returns a VM to the billing of its original image, which is already pay-as-you-go here.", fr: "NONE ramène une machine virtuelle à la facturation de son image d'origine, déjà en paiement à l'utilisation ici." }
    references:
      - title: Explore Azure Hybrid Benefit for Linux VMs
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/linux/azure-hybrid-benefit-linux

  # ------------------------------------------------------------------ 5
  - id: az120-qz-11-05
    objective: "1.1.6"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind runs its SAP quality assurance (QAS) system on Azure virtual machines with Premium SSD managed disks. The HANA volumes of QAS are in a 10-TiB Azure NetApp Files capacity pool. To save costs outside office hours, an operator runs the shutdown command in the guest operating system of each QAS VM every evening. Northwind also plans to halve the quota of the QAS volumes in Azure NetApp Files.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind exécute son système SAP d'assurance qualité (QAS) sur des machines virtuelles Azure avec des disques managés SSD Premium. Les volumes HANA de QAS se trouvent dans un pool de capacité Azure NetApp Files de 10 Tio. Pour réduire les coûts hors des heures de bureau, un opérateur exécute chaque soir la commande d'arrêt dans le système d'exploitation invité de chaque machine virtuelle QAS. Northwind prévoit aussi de réduire de moitié le quota des volumes QAS dans Azure NetApp Files.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "While the QAS VMs are shut down from the guest operating system, their compute hours aren't billed.", fr: "Tant que les machines virtuelles QAS sont arrêtées depuis le système d'exploitation invité, leurs heures de calcul ne sont pas facturées." }
        - id: s2
          text: { en: "Halving the quota of the QAS volumes, without changing the size of the capacity pool, halves the Azure NetApp Files charge.", fr: "Réduire de moitié le quota des volumes QAS, sans modifier la taille du pool de capacité, réduit de moitié les frais Azure NetApp Files." }
        - id: s3
          text: { en: "If the QAS VMs are deallocated instead, their Premium SSD managed disks are still billed.", fr: "Si les machines virtuelles QAS sont plutôt libérées (deallocated), leurs disques managés SSD Premium restent facturés." }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          A shutdown from inside the guest OS leaves the VM in the Stopped (allocated) state, which is still billed; only a deallocated VM stops compute billing. Azure NetApp Files bills the provisioned size of the capacity pool, whatever the volume quotas, so the pool must be resized to save. Deallocation stops compute charges, but disks and some networking resources keep incurring charges.
        fr: |
          Un arrêt depuis le système d'exploitation invité laisse la machine virtuelle dans l'état Stopped (allocated), qui reste facturé ; seule une machine virtuelle libérée cesse d'être facturée pour le calcul. Azure NetApp Files facture la taille provisionnée du pool de capacité, quels que soient les quotas des volumes : il faut redimensionner le pool pour économiser. La libération arrête les frais de calcul, mais les disques et certaines ressources réseau restent facturés.
      options:
        s1: { en: "Use Stop in the portal, the CLI or a schedule that deallocates the VMs to stop compute billing.", fr: "Utilisez l'arrêt du portail, de l'interface CLI ou d'une planification qui libère les machines virtuelles pour arrêter la facturation du calcul." }
        s2: { en: "Shrinking volumes only moves capacity to the unallocated part of the pool; decrease the pool size to lower the bill.", fr: "Réduire des volumes déplace seulement de la capacité vers la partie non allouée du pool ; diminuez la taille du pool pour baisser la facture." }
    references:
      - title: States and billing status
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/states-billing
      - title: Understand Azure NetApp Files cost model
        url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-cost-model

  # ------------------------------------------------------------------ 6
  - id: az120-qz-11-06
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware plans SAP BW/4HANA on an SAP HANA scale-out system with four worker nodes and one standby node. The nodes are M-series virtual machines marked **Yes** in the **Clustering** column of the SAP HANA hardware directory. HANA host auto-failover must let the standby node take over the data and log volumes of a failed worker node.

        To lower costs, an architect proposes Premium SSD v2 managed disks for /hana/data and /hana/log.

        You need to recommend storage for /hana/data and /hana/log that SAP and Microsoft support for this design. What should you recommend?
      fr: |
        Litware prévoit SAP BW/4HANA sur un système SAP HANA scale-out de quatre nœuds de travail et un nœud de secours. Les nœuds sont des machines virtuelles de la série M marquées **Yes** dans la colonne **Clustering** du répertoire matériel SAP HANA. Le basculement automatique d'hôte de HANA doit permettre au nœud de secours de reprendre les volumes de données et de journal d'un nœud de travail défaillant.

        Pour réduire les coûts, un architecte propose des disques managés SSD Premium v2 pour /hana/data et /hana/log.

        Vous devez recommander un stockage pour /hana/data et /hana/log que SAP et Microsoft prennent en charge pour cette conception. Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Premium SSD v2 managed disks attached to each worker node", fr: "Des disques managés SSD Premium v2 attachés à chaque nœud de travail" } }
        - { id: b, text: { en: "Ultra Disk managed disks attached to each worker node", fr: "Des disques managés Disque Ultra attachés à chaque nœud de travail" } }
        - { id: c, text: { en: "NFS volumes in an Azure Files SSD storage account", fr: "Des volumes NFS dans un compte de stockage Azure Files SSD" } }
        - { id: d, text: { en: "NFS v4.1 volumes in Azure NetApp Files", fr: "Des volumes NFS v4.1 dans Azure NetApp Files" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          HANA scale-out configurations with standby nodes are supported exclusively with NFS shares hosted on Azure NetApp Files: the standby node must be able to mount the volumes of the failed node. Premium SSD, Premium SSD v2, Ultra Disk and Azure NetApp Files are all supported for scale-out without a standby node, which is why the architect's proposal looks valid.
        fr: |
          Les configurations HANA scale-out avec nœuds de secours sont prises en charge exclusivement avec des partages NFS hébergés sur Azure NetApp Files : le nœud de secours doit pouvoir monter les volumes du nœud défaillant. SSD Premium, SSD Premium v2, Disque Ultra et Azure NetApp Files sont tous pris en charge pour un scale-out sans nœud de secours, ce qui explique que la proposition de l'architecte paraisse valable.
      options:
        a: { en: "Premium SSD v2 is supported for scale-out only without a standby node; the standby can't take over disks attached to another VM.", fr: "Le SSD Premium v2 n'est pris en charge en scale-out que sans nœud de secours ; le nœud de secours ne peut pas reprendre des disques attachés à une autre machine virtuelle." }
        b: { en: "Ultra Disk has the same limit as Premium SSD v2: supported for scale-out without a standby node only.", fr: "Le Disque Ultra a la même limite que le SSD Premium v2 : pris en charge en scale-out sans nœud de secours uniquement." }
        c: { en: "Azure Files SSD isn't supported for SAP DBMS storage, including /hana/data and /hana/log.", fr: "Azure Files SSD n'est pas pris en charge comme stockage de SGBD SAP, y compris pour /hana/data et /hana/log." }
    references:
      - title: SAP workload on Azure virtual machine supported scenarios
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-supported-configurations
      - title: Azure Storage types for SAP workload
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage

  # ------------------------------------------------------------------ 7
  - id: az120-qz-11-07
    objective: "1.1.8"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys runs SAP S/4HANA with SAP HANA 2.0 on SUSE Linux Enterprise Server for SAP Applications, on x86 servers in its datacenter. The HANA database is 6 TB. The datacenter is connected to Azure through ExpressRoute.

        Wingtip will move the system to Azure virtual machines with the same SAP release, the same HANA release and the same operating system. The business downtime of the database move must be as short as possible, and the method must be supported for SAP systems.

        What should you recommend?
      fr: |
        Wingtip Toys exécute SAP S/4HANA avec SAP HANA 2.0 sur SUSE Linux Enterprise Server for SAP Applications, sur des serveurs x86 de son centre de données. La base de données HANA fait 6 To. Le centre de données est connecté à Azure par ExpressRoute.

        Wingtip va déplacer le système vers des machines virtuelles Azure avec la même version SAP, la même version HANA et le même système d'exploitation. L'interruption métier liée au déplacement de la base de données doit être la plus courte possible, et la méthode doit être prise en charge pour les systèmes SAP.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Lift-shift-migrate to HANA: run SUM with DMO with System Move into the HANA VM in Azure.", fr: "Lift-shift-migrate vers HANA : exécuter SUM avec DMO with System Move vers la machine virtuelle HANA dans Azure." } }
        - { id: b, text: { en: "Lift and shift: replicate the HANA servers with Azure Site Recovery, then fail them over to Azure.", fr: "Lift-and-shift : répliquer les serveurs HANA avec Azure Site Recovery, puis les basculer vers Azure." } }
        - { id: c, text: { en: "Lift and shift: replicate the database to the HANA VM in Azure with HANA System Replication, then take over.", fr: "Lift-and-shift : répliquer la base de données vers la machine virtuelle HANA dans Azure avec HANA System Replication, puis effectuer la prise de contrôle." } }
        - { id: d, text: { en: "Lift and shift: back up the database to Azure Blob Storage, then restore it on the HANA VM in Azure.", fr: "Lift-and-shift : sauvegarder la base de données dans Stockage Blob Azure, puis la restaurer sur la machine virtuelle HANA dans Azure." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The database is already SAP HANA and nothing but the platform changes, so this is a lift and shift with a homogeneous copy. Of the homogeneous methods, DBMS replication gives the shortest downtime: HANA System Replication keeps the Azure copy in sync while the source runs, and the cutover is a takeover. Microsoft documents HANA System Replication as the migration approach with the least downtime for HANA-to-HANA moves.
        fr: |
          La base de données est déjà SAP HANA et seule la plateforme change : il s'agit d'un lift-and-shift avec une copie homogène. Parmi les méthodes homogènes, la réplication du SGBD donne l'interruption la plus courte : HANA System Replication maintient la copie Azure synchronisée pendant que la source tourne, et le basculement final est une prise de contrôle. Microsoft présente HANA System Replication comme l'approche de migration offrant la plus courte interruption pour un déplacement de HANA vers HANA.
      options:
        a: { en: "DMO migrates a non-HANA database to SAP HANA; the database is already HANA and no migration to HANA is needed.", fr: "DMO migre une base de données non HANA vers SAP HANA ; la base est déjà HANA et aucune migration vers HANA n'est nécessaire." }
        b: { en: "Azure Site Recovery isn't supported for the DBMS layer of SAP systems.", fr: "Azure Site Recovery n'est pas pris en charge pour la couche SGBD des systèmes SAP." }
        d: { en: "Backup and restore is a supported homogeneous copy, but the 6-TB backup, transfer and restore all happen during the downtime.", fr: "La sauvegarde et la restauration sont une copie homogène prise en charge, mais la sauvegarde, le transfert et la restauration des 6 To ont tous lieu pendant l'interruption." }
    references:
      - title: SAP HANA on Azure Large Instance migration to Azure virtual machines
        url: https://learn.microsoft.com/en-us/azure/sap/large-instances/hana-large-instance-virtual-machine-migration
      - title: SAP workload on Azure virtual machine supported scenarios
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-supported-configurations

  # ------------------------------------------------------------------ 8
  - id: az120-qz-11-08
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Fabrikam is moving several SAP systems to Azure virtual machines. Three project teams submit proposals: the ERP team wants to keep IBM Db2 on Linux and use shared file storage for the database, the HANA team wants to consolidate small HANA databases on fewer VMs, and the integration team has standardized on Oracle Linux for its SAP application servers. Each proposal must be supported by SAP and Microsoft.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam déplace plusieurs systèmes SAP vers des machines virtuelles Azure. Trois équipes projet soumettent des propositions : l'équipe ERP veut conserver IBM Db2 sous Linux et utiliser un stockage de fichiers partagé pour la base de données, l'équipe HANA veut consolider de petites bases HANA sur moins de machines virtuelles, et l'équipe d'intégration a standardisé Oracle Linux pour ses serveurs d'applications SAP. Chaque proposition doit être prise en charge par SAP et Microsoft.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "An SAP ERP system can run IBM Db2 on Red Hat Enterprise Linux VMs with its data and log files on NFS v4.1 volumes in Azure NetApp Files.", fr: "Un système SAP ERP peut exécuter IBM Db2 sur des machines virtuelles Red Hat Enterprise Linux avec ses fichiers de données et de journal sur des volumes NFS v4.1 dans Azure NetApp Files." }
        - id: s2
          text: { en: "Two SAP HANA instances (MCOS) can run on one VM that is a node of the Pacemaker cluster protecting their HANA System Replication.", fr: "Deux instances SAP HANA (MCOS) peuvent s'exécuter sur une machine virtuelle qui est un nœud du cluster Pacemaker protégeant leur HANA System Replication." }
        - id: s3
          text: { en: "When the SAP application servers run Oracle Linux, the ASCS and ERS instances can be protected by a Pacemaker cluster.", fr: "Quand les serveurs d'applications SAP s'exécutent sous Oracle Linux, les instances ASCS et ERS peuvent être protégées par un cluster Pacemaker." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          DBMS files on NFS are supported only on NFS 4.1 volumes in Azure NetApp Files, and only for SAP HANA, Oracle on Oracle Linux and Db2 on SUSE or Red Hat, so the Db2 proposal is supported. A VM with several DBMS instances can't be part of the high availability configurations: protecting multiple DBMS instances in one Windows or Pacemaker failover cluster isn't supported. Oracle Linux doesn't support Pacemaker as a cluster framework.
        fr: |
          Les fichiers d'un SGBD sur NFS ne sont pris en charge que sur des volumes NFS 4.1 dans Azure NetApp Files, et seulement pour SAP HANA, Oracle sur Oracle Linux et Db2 sur SUSE ou Red Hat : la proposition Db2 est donc prise en charge. Une machine virtuelle à plusieurs instances de SGBD ne peut pas faire partie des configurations de haute disponibilité : protéger plusieurs instances de SGBD dans un même cluster de basculement Windows ou Pacemaker n'est pas pris en charge. Oracle Linux ne prend pas en charge Pacemaker comme framework de cluster.
      options:
        s2: { en: "MCOS is supported on a standalone VM only; each HANA system in an HSR cluster needs its own VMs.", fr: "MCOS n'est pris en charge que sur une machine virtuelle autonome ; chaque système HANA d'un cluster HSR a besoin de ses propres machines virtuelles." }
        s3: { en: "Another high availability framework, supported by its vendor, is needed on Oracle Linux.", fr: "Sous Oracle Linux, il faut un autre framework de haute disponibilité, pris en charge par son éditeur." }
    references:
      - title: SAP workload on Azure virtual machine supported scenarios
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-supported-configurations

  # ------------------------------------------------------------------ 9
  - id: az120-qz-11-09
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso replicates its production SAP HANA database from West Europe to North Europe by using HANA System Replication. The current disaster recovery (DR) design in North Europe is the following:

        - The replication target is a Standard_M128s VM (first-generation M-series, 2 TiB of memory).
        - The HANA VM and the SAP application server VMs are in one proximity placement group.
        - /hana/log uses Ultra Disk.

        Contoso wants an on-demand capacity reservation in North Europe so that the DR VMs are guaranteed to start during a disaster. The HANA VM must keep 2 TiB of memory, and its storage must stay supported for SAP HANA.

        How should you complete the DR design? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso réplique sa base de données SAP HANA de production d'Europe Ouest vers Europe Nord avec HANA System Replication. La conception actuelle de reprise d'activité en Europe Nord est la suivante :

        - La cible de réplication est une machine virtuelle Standard_M128s (série M de première génération, 2 Tio de mémoire).
        - La machine virtuelle HANA et les machines virtuelles des serveurs d'applications SAP sont dans un même groupe de placement de proximité.
        - /hana/log utilise des Disques Ultra.

        Contoso veut une réservation de capacité à la demande en Europe Nord pour que les machines virtuelles de reprise démarrent à coup sûr pendant un sinistre. La machine virtuelle HANA doit conserver 2 Tio de mémoire, et son stockage doit rester pris en charge pour SAP HANA.

        Comment devez-vous compléter la conception de reprise ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Size of the HANA VM: [[size]]

          Placement of the DR VMs: [[place]]

          Storage of /hana/log: [[log]]
        fr: |
          Taille de la machine virtuelle HANA : [[size]]

          Placement des machines virtuelles de reprise : [[place]]

          Stockage de /hana/log : [[log]]
      slots:
        - id: size
          options:
            - { id: m128s, text: Standard_M128s }
            - { id: m128ms, text: Standard_M128ms }
            - { id: m128sv2, text: Standard_M128s_v2 }
        - id: place
          options:
            - { id: ppg, text: { en: "Keep the proximity placement group", fr: "Conserver le groupe de placement de proximité" } }
            - { id: avset, text: { en: "An availability set", fr: "Un groupe à haute disponibilité" } }
            - { id: zone, text: { en: "An availability zone", fr: "Une zone de disponibilité" } }
        - id: log
          options:
            - { id: ultra, text: { en: "Keep Ultra Disk", fr: "Conserver le Disque Ultra" } }
            - { id: pv2, text: { en: "Premium SSD v2", fr: "SSD Premium v2" } }
            - { id: stdssd, text: { en: "Standard SSD", fr: "SSD Standard" } }
            - { id: files, text: { en: "Azure Files SSD (NFS)", fr: "Azure Files SSD (NFS)" } }
    answer:
      values: { size: m128sv2, place: zone, log: pv2 }
    explanation:
      correct:
        en: |
          On-demand capacity reservation doesn't support first-generation M-series sizes, so the HANA VM moves to Standard_M128s_v2, an Msv2 Medium Memory size with the same 2 TiB that the feature supports in multi-zone deployments. Proximity placement groups, availability sets and Ultra Disk aren't supported with capacity reservations, so the DR VMs are deployed in an availability zone. Premium SSD v2 meets the SAP HANA log KPIs without Write Accelerator and works with zonal VMs.
        fr: |
          La réservation de capacité à la demande ne prend pas en charge les tailles de la série M de première génération : la machine virtuelle HANA passe donc à Standard_M128s_v2, une taille Msv2 Medium Memory avec les mêmes 2 Tio, que la fonctionnalité prend en charge en déploiement multizone. Les groupes de placement de proximité, les groupes à haute disponibilité et le Disque Ultra ne sont pas pris en charge avec les réservations de capacité : les machines virtuelles de reprise sont donc déployées dans une zone de disponibilité. Le SSD Premium v2 respecte les indicateurs de journal de SAP HANA sans Accélérateur d'écriture et fonctionne avec des machines virtuelles zonales.
      options:
        m128s: { en: "M-series v1 sizes aren't supported by on-demand capacity reservation.", fr: "Les tailles de la série M v1 ne sont pas prises en charge par la réservation de capacité à la demande." }
        m128ms: { en: "Standard_M128ms is also a first-generation M-series size, and it has more memory than required.", fr: "Standard_M128ms est aussi une taille de la série M de première génération, et elle a plus de mémoire que nécessaire." }
        ppg: { en: "Proximity placement groups are a deployment constraint that capacity reservations don't support.", fr: "Les groupes de placement de proximité sont une contrainte de déploiement que les réservations de capacité ne prennent pas en charge." }
        avset: { en: "Availability sets are a deployment type that capacity reservations don't support.", fr: "Les groupes à haute disponibilité sont un type de déploiement que les réservations de capacité ne prennent pas en charge." }
        ultra: { en: "Ultra Disk Storage isn't supported with capacity reservations.", fr: "Le stockage sur Disque Ultra n'est pas pris en charge avec les réservations de capacité." }
        stdssd: { en: "Standard SSD isn't supported for /hana/data or /hana/log.", fr: "Le SSD Standard n'est pas pris en charge pour /hana/data ou /hana/log." }
        files: { en: "Azure Files isn't supported for /hana/data or /hana/log.", fr: "Azure Files n'est pas pris en charge pour /hana/data ou /hana/log." }
    references:
      - title: On-demand capacity reservation
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/capacity-reservation-overview
      - title: Msv2 Medium Memory size series
        url: https://learn.microsoft.com/en-us/azure/virtual-machines/msv2-mdsv2-series

  # ------------------------------------------------------------------ 10
  - id: az120-qz-11-10
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum proposes the following design for a production SAP S/4HANA system in the West Europe region:

        | Element | Proposed configuration |
        | --- | --- |
        | Network | Application servers and HANA VM in two subnets of one virtual network, filtered by NSGs |
        | /hana/data | Premium SSD managed disks with zone-redundant storage (ZRS) |
        | /hana/log | Premium SSD v2 managed disks with Write Accelerator enabled |
        | Network interfaces | Accelerated Networking enabled on every NIC of every SAP VM |
        | ASCS/ERS | Pacemaker cluster behind a Standard SKU internal load balancer |
        | Placement | All the VMs in availability zone 1, no proximity placement group; the measured latency meets SAP Note 1100926 |

        Which two elements must you change so that the design is supported?

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum propose la conception suivante pour un système SAP S/4HANA de production dans la région Europe Ouest :

        | Élément | Configuration proposée |
        | --- | --- |
        | Réseau | Serveurs d'applications et machine virtuelle HANA dans deux sous-réseaux d'un même réseau virtuel, filtrés par des NSG |
        | /hana/data | Disques managés SSD Premium avec stockage redondant interzone (ZRS) |
        | /hana/log | Disques managés SSD Premium v2 avec l'Accélérateur d'écriture activé |
        | Interfaces réseau | Accelerated Networking activé sur chaque carte réseau de chaque machine virtuelle SAP |
        | ASCS/ERS | Cluster Pacemaker derrière un équilibreur de charge interne de référence SKU Standard |
        | Placement | Toutes les machines virtuelles dans la zone de disponibilité 1, sans groupe de placement de proximité ; la latence mesurée respecte la note SAP 1100926 |

        Quels sont les deux éléments que vous devez modifier pour que la conception soit prise en charge ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Network", fr: "Réseau" } }
        - { id: b, text: "/hana/data" }
        - { id: c, text: "/hana/log" }
        - { id: d, text: { en: "Network interfaces", fr: "Interfaces réseau" } }
        - { id: e, text: ASCS/ERS }
        - { id: f, text: { en: "Placement", fr: "Placement" } }
    answer: { optionIds: [b, c] }
    explanation:
      correct:
        en: |
          LRS is the only supported resiliency level for managed disks that store database data and log files: ZRS isn't supported for the DBMS, so /hana/data must use LRS disks. Premium SSD v2 doesn't support Write Accelerator; it meets the HANA log latency targets without it, so the log disks must be configured without it. The other elements follow Microsoft's guidance.
        fr: |
          LRS est le seul niveau de résilience pris en charge pour les disques managés qui stockent les fichiers de données et de journal d'une base de données : ZRS n'est pas pris en charge pour le SGBD, et /hana/data doit donc utiliser des disques LRS. Le SSD Premium v2 ne prend pas en charge l'Accélérateur d'écriture ; il atteint sans lui les objectifs de latence du journal HANA, et les disques de journal doivent donc être configurés sans lui. Les autres éléments suivent les recommandations de Microsoft.
      options:
        a: { en: "Application and database VMs belong in one virtual network, in different subnets: this is the recommended layout.", fr: "Les machines virtuelles d'application et de base de données ont leur place dans un même réseau virtuel, dans des sous-réseaux différents : c'est la disposition recommandée." }
        d: { en: "Accelerated Networking on every NIC of the SAP VMs is a Microsoft recommendation.", fr: "Accelerated Networking sur chaque carte réseau des machines virtuelles SAP est une recommandation de Microsoft." }
        e: { en: "A Standard SKU load balancer is the supported choice for the cluster; only the Basic SKU must not be used.", fr: "Un équilibreur de charge de référence SKU Standard est le choix pris en charge pour le cluster ; seule la référence SKU Basic ne doit pas être utilisée." }
        f: { en: "A proximity placement group is needed only when the measured latency is too high, which isn't the case here.", fr: "Un groupe de placement de proximité n'est nécessaire que si la latence mesurée est trop élevée, ce qui n'est pas le cas ici." }
    references:
      - title: Azure Storage types for SAP workload
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide-storage
      - title: Plan and implement an SAP deployment on Azure
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
