chapter: 12-azure-environment
questions:
  # ------------------------------------------------------------------ 1
  - id: az120-qz-12-01
    objective: "1.2.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware uses SAP Identity Management (SAP IDM) to create and update the user accounts of its SAP systems. SAP will end maintenance of SAP IDM, and Microsoft and SAP are publishing guidance to move these identity management scenarios to a Microsoft service.

        To which service should Litware plan to migrate its SAP IDM scenarios?
      fr: |
        Litware utilise SAP Identity Management (SAP IDM) pour créer et mettre à jour les comptes d'utilisateurs de ses systèmes SAP. SAP va mettre fin à la maintenance de SAP IDM, et Microsoft et SAP publient des recommandations pour déplacer ces scénarios de gestion des identités vers un service Microsoft.

        Vers quel service Litware doit-il prévoir de migrer ses scénarios SAP IDM ?
    body:
      options:
        - { id: a, text: Microsoft Entra Domain Services }
        - { id: b, text: Microsoft Entra Connect Sync }
        - { id: c, text: Microsoft Entra External ID }
        - { id: d, text: Microsoft Entra ID Governance }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Microsoft and SAP document the migration of SAP IDM scenarios to Microsoft Entra, whose identity governance features provision users from Microsoft Entra ID to SAP Cloud Identity Services or SAP ECC and, through SAP Cloud Identity Services, to S/4HANA and other SAP applications. Lifecycle, provisioning and access governance of SAP accounts are Microsoft Entra ID Governance scenarios.
        fr: |
          Microsoft et SAP documentent la migration des scénarios SAP IDM vers Microsoft Entra, dont les fonctionnalités de gouvernance des identités approvisionnent les utilisateurs de Microsoft Entra ID vers SAP Cloud Identity Services ou SAP ECC puis, via SAP Cloud Identity Services, vers S/4HANA et d'autres applications SAP. Le cycle de vie, l'approvisionnement et la gouvernance des accès des comptes SAP sont des scénarios de Microsoft Entra ID Governance.
      options:
        a: { en: "Microsoft Entra Domain Services provides a managed AD DS domain (LDAP, Kerberos); it doesn't provision accounts into SAP applications.", fr: "Microsoft Entra Domain Services fournit un domaine AD DS managé (LDAP, Kerberos) ; il n'approvisionne pas de comptes dans les applications SAP." }
        b: { en: "Microsoft Entra Connect Sync synchronizes on-premises Active Directory with Microsoft Entra ID; it doesn't manage SAP accounts.", fr: "Microsoft Entra Connect Sync synchronise l'Active Directory local avec Microsoft Entra ID ; il ne gère pas les comptes SAP." }
        c: { en: "Microsoft Entra External ID manages external identities such as customers and partners, not the provisioning of employee accounts into SAP.", fr: "Microsoft Entra External ID gère les identités externes, comme les clients et les partenaires, pas l'approvisionnement des comptes des employés dans SAP." }
    references:
      - title: Migrate identity management scenarios from SAP IDM to Microsoft Entra
        url: https://learn.microsoft.com/en-us/entra/id-governance/scenarios/migrate-from-sap-idm

  # ------------------------------------------------------------------ 2
  - id: az120-qz-12-02
    objective: "1.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The security team of Contoso requires that root sign-in over SSH is disabled in the operating system of every SUSE Linux Enterprise Server virtual machine of its SAP landscape. The team wants a compliance report that lists the SAP VMs that don't meet this rule in all the SAP subscriptions.

        What should you use?
      fr: |
        L'équipe de sécurité de Contoso exige que la connexion root par SSH soit désactivée dans le système d'exploitation de chaque machine virtuelle SUSE Linux Enterprise Server de son paysage SAP. L'équipe veut un rapport de conformité qui liste les machines virtuelles SAP ne respectant pas cette règle dans tous les abonnements SAP.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "An Azure Policy definition with the deny effect on virtual machines", fr: "Une définition Azure Policy avec l'effet deny sur les machines virtuelles" } }
        - { id: b, text: { en: "An Azure Policy machine configuration assignment", fr: "Une attribution de configuration de machine d'Azure Policy" } }
        - { id: c, text: { en: "A custom Azure role without the runCommand action", fr: "Un rôle Azure personnalisé sans l'action runCommand" } }
        - { id: d, text: { en: "VM insights with the Dependency agent on the VMs", fr: "VM Insights avec l'agent de dépendances sur les machines virtuelles" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Machine configuration is the Azure Policy feature that audits or configures settings inside the operating system of Azure and Arc-enabled machines, Linux included. Assigned through Azure Policy at the scope of the SAP subscriptions or their management group, it reports each VM whose SSH configuration doesn't match the rule.
        fr: |
          La configuration de machine est la fonctionnalité d'Azure Policy qui audite ou configure des paramètres à l'intérieur du système d'exploitation des machines Azure et Arc, Linux compris. Attribuée par Azure Policy à l'étendue des abonnements SAP ou de leur groupe d'administration, elle signale chaque machine virtuelle dont la configuration SSH ne respecte pas la règle.
      options:
        a: { en: "A regular policy definition evaluates the Azure Resource Manager properties of the VM; it can't see settings inside the guest OS.", fr: "Une définition de stratégie classique évalue les propriétés Azure Resource Manager de la machine virtuelle ; elle ne voit pas les paramètres du système d'exploitation invité." }
        c: { en: "A role limits who can act on the VMs; it doesn't check or report the configuration of the OS.", fr: "Un rôle limite qui peut agir sur les machines virtuelles ; il ne vérifie pas et ne signale pas la configuration du système d'exploitation." }
        d: { en: "VM insights monitors performance and dependencies; it doesn't evaluate OS settings against a compliance rule.", fr: "VM Insights supervise les performances et les dépendances ; il n'évalue pas les paramètres du système d'exploitation par rapport à une règle de conformité." }
    references:
      - title: What is Azure Machine Configuration?
        url: https://learn.microsoft.com/en-us/azure/governance/machine-configuration/overview

  # ------------------------------------------------------------------ 3
  - id: az120-qz-12-03
    objective: "1.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam is developing a web application in Azure App Service that reads sales orders from SAP S/4HANA through SAP OData services. Users sign in to the application with Microsoft Entra ID.

        Each OData call must run under the SAP user of the signed-in person so that the SAP authorizations of that person apply. No SAP password may be stored by the application.

        What should you configure?
      fr: |
        Fabrikam développe une application web dans Azure App Service qui lit les commandes client de SAP S/4HANA via des services OData SAP. Les utilisateurs se connectent à l'application avec Microsoft Entra ID.

        Chaque appel OData doit s'exécuter sous l'utilisateur SAP de la personne connectée, afin que les autorisations SAP de cette personne s'appliquent. Aucun mot de passe SAP ne doit être stocké par l'application.

        Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "SNC with Kerberos between the application and the SAP system", fr: "SNC avec Kerberos entre l'application et le système SAP" } }
        - { id: b, text: { en: "SAML single sign-on between Microsoft Entra ID and the SAP Fiori launchpad", fr: "L'authentification unique SAML entre Microsoft Entra ID et le SAP Fiori launchpad" } }
        - { id: c, text: { en: "A technical SAP user whose password is kept in Azure Key Vault", fr: "Un utilisateur SAP technique dont le mot de passe est conservé dans Azure Key Vault" } }
        - { id: d, text: { en: "OAuth 2.0 with the SAML bearer grant, through a client registered in SOAUTH2", fr: "OAuth 2.0 avec l'octroi SAML bearer, via un client enregistré dans SOAUTH2" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          An application that calls OData services on behalf of a user uses OAuth 2.0 with the SAML bearer grant: the SAML assertion that Microsoft Entra ID issues for the user is exchanged for an SAP access token. On the SAP side, transaction SOAUTH2 registers the OAuth 2.0 client, tied to the Microsoft Entra SAML identity provider and to the scopes of the OData services.
        fr: |
          Une application qui appelle des services OData au nom d'un utilisateur utilise OAuth 2.0 avec l'octroi SAML bearer : l'assertion SAML que Microsoft Entra ID émet pour l'utilisateur est échangée contre un jeton d'accès SAP. Côté SAP, la transaction SOAUTH2 enregistre le client OAuth 2.0, lié au fournisseur d'identité SAML Microsoft Entra et aux étendues des services OData.
      options:
        a: { en: "SNC with Kerberos secures SAP GUI and RFC connections from domain-joined clients; it isn't the mechanism for a web application calling OData for its users.", fr: "SNC avec Kerberos sécurise les connexions SAP GUI et RFC de clients joints au domaine ; ce n'est pas le mécanisme d'une application web qui appelle OData pour ses utilisateurs." }
        b: { en: "SAML single sign-on signs a browser in to Fiori; the application's server-side OData calls still need a token for the user.", fr: "L'authentification unique SAML connecte un navigateur à Fiori ; les appels OData de l'application côté serveur ont toujours besoin d'un jeton pour l'utilisateur." }
        c: { en: "A technical user runs every call under one SAP identity, so the user's own SAP authorizations don't apply.", fr: "Un utilisateur technique exécute tous les appels sous une seule identité SAP : les autorisations SAP propres à l'utilisateur ne s'appliquent pas." }
    references:
      - title: Configure SAP NetWeaver for Single sign-on with Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/saas-apps/sap-netweaver-tutorial

  # ------------------------------------------------------------------ 4
  - id: az120-qz-12-04
    objective: "1.2.1"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Northwind Traders will register an existing SAP S/4HANA system in Azure Center for SAP solutions as a Virtual Instance for SAP solutions (VIS). An engineer named Ana will perform the registration and will create a new user-assigned managed identity for the service during the process.

        You need to assign built-in roles to Ana. The solution must follow the principle of least privilege.

        Which three roles should you assign to Ana? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders va inscrire un système SAP S/4HANA existant dans le Centre Azure pour les solutions SAP en tant qu'instance virtuelle pour solutions SAP (VIS). Une ingénieure nommée Ana effectuera l'inscription et créera une nouvelle identité managée affectée par l'utilisateur pour le service pendant l'opération.

        Vous devez attribuer des rôles intégrés à Ana. La solution doit respecter le principe du moindre privilège.

        Quels sont les trois rôles que vous devez attribuer à Ana ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: Azure Center for SAP solutions administrator }
        - { id: b, text: Azure Center for SAP solutions service role }
        - { id: c, text: Managed Identity Contributor }
        - { id: d, text: Reader and Data Access }
        - { id: e, text: Managed Identity Operator }
        - { id: f, text: Azure Center for SAP solutions reader }
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: |
          To register an existing system, the user needs Azure Center for SAP solutions administrator and Managed Identity Operator, which lets the user assign a user-assigned managed identity to the VIS. Because Ana also creates the identity during the registration, she needs Managed Identity Contributor as well. The service role goes to the managed identity, not to the user.
        fr: |
          Pour inscrire un système existant, l'utilisateur a besoin d'Azure Center for SAP solutions administrator et de Managed Identity Operator, qui lui permet d'affecter une identité managée affectée par l'utilisateur à la VIS. Comme Ana crée aussi l'identité pendant l'inscription, elle a également besoin de Managed Identity Contributor. Le rôle de service est attribué à l'identité managée, pas à l'utilisateur.
      options:
        b: { en: "The service role is designed for the user-assigned managed identity that the service uses, not for the engineer.", fr: "Le rôle de service est conçu pour l'identité managée affectée par l'utilisateur qu'utilise le service, pas pour l'ingénieure." }
        d: { en: "Reader and Data Access is given to the managed identity to read the SAP media during a software installation, which isn't part of a registration.", fr: "Reader and Data Access est donné à l'identité managée pour lire les supports SAP lors d'une installation logicielle, ce qui ne fait pas partie d'une inscription." }
        f: { en: "The reader role only views VIS resources; it can't register a system.", fr: "Le rôle reader permet seulement de consulter les ressources VIS ; il ne peut pas inscrire un système." }
    references:
      - title: Azure RBAC for Azure Center for SAP solutions
        url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/manage-with-azure-rbac

  # ------------------------------------------------------------------ 5
  - id: az120-qz-12-05
    objective: "1.2.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware has deployed its Azure landing zones: a platform landing zone with the hub, and SAP production and non-production subscriptions with their spoke virtual networks. The SAP Basis team must now deploy about 20 SAP NetWeaver systems, with SAP ASE and SAP HANA databases on SUSE Linux Enterprise Server, into the spokes.

        The team requires the infrastructure to be described as Terraform code, the operating system and SAP configuration to be done by Ansible playbooks, and the deployment credentials to be kept in a central deployment environment in the hub subscription.

        What should you use?
      fr: |
        Proseware a déployé ses zones d'atterrissage Azure : une zone d'atterrissage de plateforme avec le hub, et des abonnements SAP de production et hors production avec leurs réseaux virtuels spoke. L'équipe SAP Basis doit maintenant déployer une vingtaine de systèmes SAP NetWeaver, avec des bases de données SAP ASE et SAP HANA sur SUSE Linux Enterprise Server, dans les spokes.

        L'équipe exige que l'infrastructure soit décrite en code Terraform, que la configuration du système d'exploitation et de SAP soit faite par des playbooks Ansible, et que les informations d'identification de déploiement soient conservées dans un environnement de déploiement central dans l'abonnement hub.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: Azure Center for SAP solutions }
        - { id: b, text: SAP Deployment Automation Framework }
        - { id: c, text: Azure Migrate }
        - { id: d, text: Azure Site Recovery }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          SAP Deployment Automation Framework creates the infrastructure of SAP HANA and NetWeaver with AnyDB systems with Terraform and configures the OS and SAP with Ansible. Its control plane, typically in the hub subscription, holds the deployer VMs, the Terraform state and a key vault for the deployment credentials, and workload zones partition the deployments into the spokes.
        fr: |
          SAP Deployment Automation Framework crée l'infrastructure des systèmes SAP HANA et NetWeaver avec AnyDB à l'aide de Terraform, et configure le système d'exploitation et SAP avec Ansible. Son plan de contrôle, en général dans l'abonnement hub, contient les machines virtuelles de déploiement, l'état Terraform et un coffre de clés pour les informations d'identification de déploiement, et les zones de charge de travail répartissent les déploiements dans les spokes.
      options:
        a: { en: "Azure Center for SAP solutions offers a guided deployment of S/4HANA on SAP HANA only; it isn't Terraform and Ansible code that the team maintains, and it doesn't deploy SAP ASE systems.", fr: "Le Centre Azure pour les solutions SAP propose un déploiement guidé de S/4HANA sur SAP HANA uniquement ; ce n'est pas du code Terraform et Ansible maintenu par l'équipe, et il ne déploie pas de systèmes SAP ASE." }
        c: { en: "Azure Migrate discovers, assesses and replicates existing servers; it doesn't build new SAP systems from Terraform and Ansible.", fr: "Azure Migrate découvre, évalue et réplique des serveurs existants ; il ne construit pas de nouveaux systèmes SAP à partir de Terraform et d'Ansible." }
        d: { en: "Azure Site Recovery replicates VMs for disaster recovery; it doesn't deploy or configure SAP systems.", fr: "Azure Site Recovery réplique des machines virtuelles pour la reprise d'activité ; il ne déploie ni ne configure de systèmes SAP." }
    references:
      - title: About SAP Deployment Automation Framework
        url: https://learn.microsoft.com/en-us/azure/sap/automation/deployment-framework
      - title: Deploy an S/4HANA infrastructure
        url: https://learn.microsoft.com/en-us/azure/sap/center-sap-solutions/deploy-s4hana

  # ------------------------------------------------------------------ 6
  - id: az120-qz-12-06
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank assigns an initiative named **SAP-Guardrails** to a management group named **MG-SAP**. The initiative contains the Allowed virtual machine size SKUs definition with the deny effect, a definition that requires a `SID` tag, and the Allowed locations definition. The assignment is deployed by an infrastructure-as-code pipeline, and the platform team refuses any change to the assignment object for project exceptions.

        For a three-month proof of concept, a subscription named **Sub-SAP-POC** under MG-SAP must be able to deploy VM sizes that aren't on the allowed list. The other definitions of the initiative must still apply to Sub-SAP-POC, the exception must end automatically after three months, and the security team must still be able to track Sub-SAP-POC in the compliance reports of the assignment.

        What should you do?
      fr: |
        Woodgrove Bank attribue une initiative nommée **SAP-Guardrails** à un groupe d'administration nommé **MG-SAP**. L'initiative contient la définition Allowed virtual machine size SKUs avec l'effet deny, une définition qui exige une étiquette `SID` et la définition Allowed locations. L'attribution est déployée par un pipeline d'infrastructure en tant que code, et l'équipe plateforme refuse toute modification de l'objet d'attribution pour des exceptions de projet.

        Pour une preuve de concept de trois mois, un abonnement nommé **Sub-SAP-POC** sous MG-SAP doit pouvoir déployer des tailles de machines virtuelles absentes de la liste autorisée. Les autres définitions de l'initiative doivent continuer à s'appliquer à Sub-SAP-POC, l'exception doit prendre fin automatiquement au bout de trois mois, et l'équipe de sécurité doit pouvoir continuer à suivre Sub-SAP-POC dans les rapports de conformité de l'attribution.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add Sub-SAP-POC to the excluded scopes (notScopes) of the SAP-Guardrails assignment for three months.", fr: "Ajouter Sub-SAP-POC aux étendues exclues (notScopes) de l'attribution SAP-Guardrails pendant trois mois." } }
        - { id: b, text: { en: "Create a Waiver exemption on Sub-SAP-POC for the allowed sizes definition only, with an expiration date.", fr: "Créer une exemption Waiver sur Sub-SAP-POC pour la seule définition des tailles autorisées, avec une date d'expiration." } }
        - { id: c, text: { en: "Assign the Allowed virtual machine size SKUs definition to Sub-SAP-POC with the proof-of-concept sizes added.", fr: "Attribuer la définition Allowed virtual machine size SKUs à Sub-SAP-POC en y ajoutant les tailles de la preuve de concept." } }
        - { id: d, text: { en: "Move Sub-SAP-POC to the Sandbox management group for three months, then move it back under MG-SAP.", fr: "Déplacer Sub-SAP-POC vers le groupe d'administration Sandbox pendant trois mois, puis le replacer sous MG-SAP." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          An exemption is a separate Resource Manager object, so the assignment isn't modified. A Waiver exemption can target only some definitions of an initiative through their reference IDs, its `expiresOn` property ends the exemption automatically, and exempted resources show as **Exempted** in the compliance reports so that they stay tracked. Microsoft recommends exemptions for time-bound scenarios and exclusions for permanent bypasses.
        fr: |
          Une exemption est un objet Resource Manager distinct : l'attribution n'est donc pas modifiée. Une exemption Waiver peut viser seulement certaines définitions d'une initiative par leurs ID de référence, sa propriété `expiresOn` met fin automatiquement à l'exemption, et les ressources exemptées apparaissent comme **Exempted** dans les rapports de conformité, ce qui permet de les suivre. Microsoft recommande les exemptions pour les scénarios limités dans le temps et les exclusions pour les contournements permanents.
      options:
        a: { en: "notScopes is part of the assignment object, which must not change; it excludes the whole initiative, has no expiration and removes the scope from the compliance count.", fr: "notScopes fait partie de l'objet d'attribution, qui ne doit pas changer ; il exclut toute l'initiative, n'a pas d'expiration et retire l'étendue du décompte de conformité." }
        c: { en: "Assignments add up: the deny of the MG-SAP assignment still blocks the sizes that aren't on its list.", fr: "Les attributions se cumulent : l'effet deny de l'attribution sur MG-SAP bloque toujours les tailles absentes de sa liste." }
        d: { en: "Outside MG-SAP, none of the definitions of the initiative applies, and the return depends on a manual move.", fr: "En dehors de MG-SAP, aucune définition de l'initiative ne s'applique, et le retour dépend d'un déplacement manuel." }
    references:
      - title: Azure Policy exemption structure
        url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/exemption-structure
      - title: Understand scope in Azure Policy
        url: https://learn.microsoft.com/en-us/azure/governance/policy/concepts/scope

  # ------------------------------------------------------------------ 7
  - id: az120-qz-12-07
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys configures automatic provisioning from Microsoft Entra ID to its SAP Cloud Identity Services tenant by using the SAP Cloud Identity Services gallery application with the SCIM 2.0 connector. The provisioning **Scope** is **Sync only assigned users and groups**.

        Tailspin's tenant has only Microsoft Entra ID Free licenses. SAML single sign-on between Microsoft Entra ID and SAP Cloud Identity Services isn't configured yet. Tailspin plans to map its SAP BTP role collections to Microsoft Entra groups.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys configure l'approvisionnement automatique de Microsoft Entra ID vers son locataire SAP Cloud Identity Services à l'aide de l'application de la galerie SAP Cloud Identity Services avec le connecteur SCIM 2.0. L'**étendue** de l'approvisionnement est **Synchroniser uniquement les utilisateurs et groupes affectés**.

        Le locataire de Tailspin ne dispose que de licences Microsoft Entra ID Free. L'authentification unique SAML entre Microsoft Entra ID et SAP Cloud Identity Services n'est pas encore configurée. Tailspin prévoit de mapper ses collections de rôles SAP BTP à des groupes Microsoft Entra.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A user assigned to the application with only the Default Access role is provisioned to SAP Cloud Identity Services.", fr: "Un utilisateur affecté à l'application avec le seul rôle Default Access est approvisionné dans SAP Cloud Identity Services." }
        - id: s2
          text: { en: "Users can be provisioned to SAP Cloud Identity Services before the SAML single sign-on is configured.", fr: "Les utilisateurs peuvent être approvisionnés dans SAP Cloud Identity Services avant que l'authentification unique SAML soit configurée." }
        - id: s3
          text: { en: "With its current licenses, Tailspin can provision the groups that it plans to map to BTP role collections.", fr: "Avec ses licences actuelles, Tailspin peut approvisionner les groupes qu'il prévoit de mapper aux collections de rôles BTP." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          With the Sync only assigned users and groups scope, only users and groups assigned to an application role are synchronized; users with the Default Access role are excluded, and User is the only role of this application. Single sign-on and provisioning are configured independently. Group provisioning requires a Microsoft Entra ID P1 license, so Free licenses provision users only.
        fr: |
          Avec l'étendue Synchroniser uniquement les utilisateurs et groupes affectés, seuls les utilisateurs et les groupes affectés à un rôle d'application sont synchronisés ; les utilisateurs du rôle Default Access sont exclus, et User est le seul rôle de cette application. L'authentification unique et l'approvisionnement se configurent indépendamment. L'approvisionnement des groupes exige une licence Microsoft Entra ID P1 : avec des licences Free, seuls les utilisateurs sont approvisionnés.
      options:
        s1: { en: "Assign the users, or their groups, to the User role of the application.", fr: "Affectez les utilisateurs, ou leurs groupes, au rôle User de l'application." }
        s3: { en: "Group provisioning capabilities need Microsoft Entra ID P1.", fr: "Les fonctionnalités d'approvisionnement des groupes exigent Microsoft Entra ID P1." }
    references:
      - title: Configure SAP Cloud Identity Services for automatic user provisioning with Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/saas-apps/sap-cloud-platform-identity-authentication-provisioning-tutorial

  # ------------------------------------------------------------------ 8
  - id: az120-qz-12-08
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Contoso runs SAP NetWeaver AS ABAP 7.50 on Azure virtual machines. Users must sign in to the SAP web applications from their browser with their Microsoft Entra accounts by using SAML 2.0, without an SAP password prompt. The email address of each Microsoft Entra user is already maintained in transaction SU01 for the matching SAP user. No SAML configuration exists yet on either side.

        You need to configure single sign-on.

        Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Contoso exécute SAP NetWeaver AS ABAP 7.50 sur des machines virtuelles Azure. Les utilisateurs doivent se connecter aux applications web SAP depuis leur navigateur avec leur compte Microsoft Entra en utilisant SAML 2.0, sans invite de mot de passe SAP. L'adresse e-mail de chaque utilisateur Microsoft Entra est déjà renseignée dans la transaction SU01 pour l'utilisateur SAP correspondant. Aucune configuration SAML n'existe encore d'un côté comme de l'autre.

        Vous devez configurer l'authentification unique.

        Quelles sont les cinq actions que vous devez effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste d'actions vers la zone de réponse et classez-les dans l'ordre correct.
    body:
      count: 5
      actions:
        - { id: sicf, text: { en: "In transaction SICF, activate the SAML 2.0 services of the SAP system.", fr: "Dans la transaction SICF, activer les services SAML 2.0 du système SAP." } }
        - { id: oauth, text: { en: "In transaction SOAUTH2, register an OAuth 2.0 client that uses the SAML bearer grant.", fr: "Dans la transaction SOAUTH2, enregistrer un client OAuth 2.0 qui utilise l'octroi SAML bearer." } }
        - { id: local, text: { en: "In transaction SAML2, create the local provider and download its metadata.", fr: "Dans la transaction SAML2, créer le fournisseur local et télécharger ses métadonnées." } }
        - { id: entra, text: { en: "In Microsoft Entra ID, add the SAP NetWeaver gallery application and upload the SAP metadata.", fr: "Dans Microsoft Entra ID, ajouter l'application SAP NetWeaver de la galerie et charger les métadonnées SAP." } }
        - { id: snc, text: { en: "In transaction SNCWIZARD, enable SNC with Kerberos for the SAP system.", fr: "Dans la transaction SNCWIZARD, activer SNC avec Kerberos pour le système SAP." } }
        - { id: trust, text: { en: "In transaction SAML2, add Microsoft Entra ID as a trusted provider from its federation metadata.", fr: "Dans la transaction SAML2, ajouter Microsoft Entra ID comme fournisseur approuvé à partir de ses métadonnées de fédération." } }
        - { id: fed, text: { en: "In the trusted provider, configure identity federation to map the users by email.", fr: "Dans le fournisseur approuvé, configurer la fédération d'identité pour mapper les utilisateurs par e-mail." } }
    answer:
      sequence: [sicf, local, entra, trust, fed]
    explanation:
      correct:
        en: |
          The SAML 2.0 services must be active before transaction SAML2 can create the local provider, whose metadata fills the identifier and reply URL of the Microsoft Entra application. The federation metadata of that application is then imported in SAML2 to add Microsoft Entra ID as a trusted provider, with HTTP POST for single sign-on. Identity federation, configured on the trusted provider, maps the SAML name to the SAP user by email.
        fr: |
          Les services SAML 2.0 doivent être actifs pour que la transaction SAML2 puisse créer le fournisseur local, dont les métadonnées renseignent l'identificateur et l'URL de réponse de l'application Microsoft Entra. Les métadonnées de fédération de cette application sont ensuite importées dans SAML2 pour ajouter Microsoft Entra ID comme fournisseur approuvé, avec HTTP POST pour l'authentification unique. La fédération d'identité, configurée sur le fournisseur approuvé, associe le nom SAML à l'utilisateur SAP par l'e-mail.
      options:
        oauth: { en: "SOAUTH2 is needed when applications call OData services on behalf of users, not for browser single sign-on.", fr: "SOAUTH2 sert quand des applications appellent des services OData au nom des utilisateurs, pas pour l'authentification unique du navigateur." }
        snc: { en: "SNC with Kerberos provides single sign-on for SAP GUI, not SAML sign-in from a browser.", fr: "SNC avec Kerberos fournit l'authentification unique pour SAP GUI, pas la connexion SAML depuis un navigateur." }
    references:
      - title: Configure SAP NetWeaver for Single sign-on with Microsoft Entra ID
        url: https://learn.microsoft.com/en-us/entra/identity/saas-apps/sap-netweaver-tutorial

  # ------------------------------------------------------------------ 9
  - id: az120-qz-12-09
    objective: "1.2.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank has the following management group hierarchy: Tenant root group > Woodgrove > Landing zones > MG-SAP, and Tenant root group > Woodgrove > Sandbox. Sandbox is the default management group for new subscriptions. Policy assignments on MG-SAP enforce the allowed VM sizes and the tags of the SAP landscape; Sandbox has no SAP policy.

        A subscription named **Sub-SAP-PRD2** was created last week for a new SAP production system and was placed in Sandbox. You need to move Sub-SAP-PRD2 under MG-SAP.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank a la hiérarchie de groupes d'administration suivante : Tenant root group > Woodgrove > Landing zones > MG-SAP, et Tenant root group > Woodgrove > Sandbox. Sandbox est le groupe d'administration par défaut des nouveaux abonnements. Des attributions de stratégie sur MG-SAP imposent les tailles de machines virtuelles autorisées et les étiquettes du paysage SAP ; Sandbox n'a aucune stratégie SAP.

        Un abonnement nommé **Sub-SAP-PRD2** a été créé la semaine dernière pour un nouveau système SAP de production et a été placé dans Sandbox. Vous devez déplacer Sub-SAP-PRD2 sous MG-SAP.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "After the move, Sub-SAP-PRD2 inherits the policy and role assignments of MG-SAP and of the management groups above it.", fr: "Après le déplacement, Sub-SAP-PRD2 hérite des attributions de stratégie et de rôle de MG-SAP et des groupes d'administration situés au-dessus." } }
        - { id: b, text: { en: "A user whose Owner role on Sub-SAP-PRD2 is inherited from Sandbox can move it to MG-SAP while being only Contributor on MG-SAP.", fr: "Un utilisateur dont le rôle Owner sur Sub-SAP-PRD2 est hérité de Sandbox peut le déplacer vers MG-SAP en n'étant que Contributor sur MG-SAP." } }
        - { id: c, text: { en: "If Sub-SAP-PRD2 were directly under the Tenant root group, the move would also require write permission on the Tenant root group.", fr: "Si Sub-SAP-PRD2 se trouvait directement sous le Tenant root group, le déplacement exigerait aussi une autorisation d'écriture sur le Tenant root group." } }
        - { id: d, text: { en: "A user directly assigned Owner on Sub-SAP-PRD2 who has the Contributor role on MG-SAP and on Sandbox can perform the move.", fr: "Un utilisateur qui a une attribution directe du rôle Owner sur Sub-SAP-PRD2 et le rôle Contributor sur MG-SAP et sur Sandbox peut effectuer le déplacement." } }
        - { id: e, text: { en: "As soon as the move completes, every user sees Sub-SAP-PRD2 under MG-SAP in the hierarchy.", fr: "Dès que le déplacement se termine, tous les utilisateurs voient Sub-SAP-PRD2 sous MG-SAP dans la hiérarchie." } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          A subscription moved to a management group inherits all the user access and policies of its new parent and of the levels above it. A move needs write permission on the child, on the current parent and on the target parent: a user directly assigned Owner on the subscription can move it to any management group where the user has Contributor, and Contributor on Sandbox covers the current parent.
        fr: |
          Un abonnement déplacé vers un groupe d'administration hérite de tous les accès utilisateur et de toutes les stratégies de son nouveau parent et des niveaux supérieurs. Un déplacement exige une autorisation d'écriture sur l'enfant, sur le parent actuel et sur le parent cible : un utilisateur qui a une attribution directe du rôle Owner sur l'abonnement peut le déplacer vers tout groupe d'administration où il est Contributor, et Contributor sur Sandbox couvre le parent actuel.
      options:
        b: { en: "When Owner is inherited from the current management group, the subscription can only move to a management group where the user is Owner; otherwise the user would lose ownership.", fr: "Quand Owner est hérité du groupe d'administration actuel, l'abonnement ne peut aller que vers un groupe d'administration où l'utilisateur est Owner ; sinon, l'utilisateur perdrait la propriété." }
        c: { en: "The Tenant root group is an exception: no permission is needed on it when it is the current or the target parent.", fr: "Le Tenant root group est une exception : aucune autorisation n'est nécessaire sur lui quand il est le parent actuel ou le parent cible." }
        e: { en: "Tokens and the management group cache refresh every 30 minutes, so a move can take up to 30 minutes to appear.", fr: "Les jetons et le cache des groupes d'administration sont actualisés toutes les 30 minutes : un déplacement peut mettre jusqu'à 30 minutes à apparaître." }
    references:
      - title: Manage your Azure subscriptions at scale with management groups
        url: https://learn.microsoft.com/en-us/azure/governance/management-groups/manage

  # ------------------------------------------------------------------ 10
  - id: az120-qz-12-10
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Adatum is designing access for its SAP Basis team. The requirements are:

        - **Non-production subscription:** the team creates, resizes and deletes SAP VMs and their disks, but must not manage virtual networks or assign roles.
        - **Production subscription:** the team only starts, stops, restarts, deallocates and resizes the SAP VMs and reads the NSGs. No standing access is allowed: each team member activates the access for a few hours, with multifactor authentication.
        - **Recovery Services vault of the production HANA backups:** disabling soft delete or reducing backup retention must remain possible, but only after approval by the security team, including when an Owner of the production subscription makes the request.

        The solution must follow the principle of least privilege.

        How should you complete the design? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum conçoit les accès de son équipe SAP Basis. Les exigences sont les suivantes :

        - **Abonnement hors production :** l'équipe crée, redimensionne et supprime les machines virtuelles SAP et leurs disques, mais ne doit ni gérer les réseaux virtuels ni attribuer de rôles.
        - **Abonnement de production :** l'équipe se limite à démarrer, arrêter, redémarrer, libérer et redimensionner les machines virtuelles SAP et à lire les NSG. Aucun accès permanent n'est autorisé : chaque membre de l'équipe active l'accès pour quelques heures, avec l'authentification multifacteur.
        - **Coffre Recovery Services des sauvegardes HANA de production :** désactiver la suppression réversible ou réduire la conservation des sauvegardes doit rester possible, mais seulement après approbation de l'équipe de sécurité, y compris quand un Owner de l'abonnement de production en fait la demande.

        La solution doit respecter le principe du moindre privilège.

        Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Non-production role: [[np]]

          Production role: [[prole]]

          Production assignment: [[passign]]

          Protection of the vault: [[vault]]
        fr: |
          Rôle hors production : [[np]]

          Rôle de production : [[prole]]

          Attribution de production : [[passign]]

          Protection du coffre : [[vault]]
      slots:
        - id: np
          options:
            - { id: npcontrib, text: Contributor }
            - { id: npvmc, text: Virtual Machine Contributor }
            - { id: npowner, text: Owner }
        - id: prole
          options:
            - { id: pvmc, text: Virtual Machine Contributor }
            - { id: pcustom, text: { en: "A custom role", fr: "Un rôle personnalisé" } }
            - { id: pcontrib, text: Contributor }
        - id: passign
          options:
            - { id: permanent, text: { en: "A permanent active assignment", fr: "Une attribution active permanente" } }
            - { id: timebound, text: { en: "A time-bound active assignment in PIM", fr: "Une attribution active limitée dans le temps dans PIM" } }
            - { id: eligible, text: { en: "An eligible assignment in PIM", fr: "Une attribution éligible dans PIM" } }
        - id: vault
          options:
            - { id: lock, text: { en: "A ReadOnly lock on the vault", fr: "Un verrou ReadOnly sur le coffre" } }
            - { id: mua, text: { en: "Multi-user authorization with a Resource Guard", fr: "L'autorisation multi-utilisateur avec un Resource Guard" } }
            - { id: immutable, text: { en: "Locked immutability on the vault", fr: "L'immuabilité verrouillée sur le coffre" } }
            - { id: bkreader, text: { en: "The Backup Reader role for the Basis team", fr: "Le rôle Backup Reader pour l'équipe Basis" } }
    answer:
      values: { np: npvmc, prole: pcustom, passign: eligible, vault: mua }
    explanation:
      correct:
        en: |
          Virtual Machine Contributor manages VMs and disks, including deletion, without managing the virtual network or assigning roles, which fits non-production. It also allows creating and deleting VMs, so production needs a custom role limited to the listed operations. An eligible PIM assignment gives no access until the member activates it, for a limited time and with MFA. Multi-user authorization makes critical vault operations, such as disabling soft delete or reducing retention, require a permission on a Resource Guard that a different user owns.
        fr: |
          Virtual Machine Contributor gère les machines virtuelles et les disques, suppression comprise, sans gérer le réseau virtuel ni attribuer de rôles, ce qui convient au hors production. Il permet aussi de créer et de supprimer des machines virtuelles : la production a donc besoin d'un rôle personnalisé limité aux opérations listées. Une attribution éligible dans PIM ne donne aucun accès tant que le membre ne l'active pas, pour une durée limitée et avec MFA. L'autorisation multi-utilisateur soumet les opérations critiques du coffre, comme la désactivation de la suppression réversible ou la réduction de la conservation, à une autorisation sur un Resource Guard détenu par un autre utilisateur.
      options:
        npcontrib: { en: "Contributor also manages the virtual networks.", fr: "Contributor gère aussi les réseaux virtuels." }
        npowner: { en: "Owner can manage the virtual networks and assign roles.", fr: "Owner peut gérer les réseaux virtuels et attribuer des rôles." }
        pvmc: { en: "Virtual Machine Contributor allows creating and deleting VMs, beyond the production operations.", fr: "Virtual Machine Contributor permet de créer et de supprimer des machines virtuelles, au-delà des opérations de production." }
        pcontrib: { en: "Contributor can delete VMs and change network security rules.", fr: "Contributor peut supprimer des machines virtuelles et modifier les règles de sécurité réseau." }
        permanent: { en: "A permanent active assignment is standing access.", fr: "Une attribution active permanente est un accès permanent." }
        timebound: { en: "An active assignment applies during its whole period without any activation or MFA.", fr: "Une attribution active s'applique pendant toute sa période, sans activation ni MFA." }
        lock: { en: "An Owner can remove the lock without any approval.", fr: "Un Owner peut supprimer le verrou sans aucune approbation." }
        immutable: { en: "Locked immutability prevents reducing retention for everyone, with no approval path.", fr: "L'immuabilité verrouillée empêche la réduction de la conservation pour tous, sans possibilité d'approbation." }
        bkreader: { en: "A role for the Basis team doesn't stop the subscription Owners.", fr: "Un rôle pour l'équipe Basis n'arrête pas les Owners de l'abonnement." }
    references:
      - title: Multiuser authorization using Resource Guard
        url: https://learn.microsoft.com/en-us/azure/backup/multi-user-authorization-concept
      - title: What is Microsoft Entra Privileged Identity Management?
        url: https://learn.microsoft.com/en-us/entra/id-governance/privileged-identity-management/pim-configure
