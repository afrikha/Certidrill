chapter: 22-networking
questions:
  # ------------------------------------------------------------------ 1
  - id: az120-qz-22-01
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam is designing the network of a highly available SAP S/4HANA system that will be spread across availability zones 1 and 2 of the West Europe region. The application server VMs and the database VMs must be in separate subnets.

        The design must minimize the number of network resources to manage. What should you include in the design?
      fr: |
        Fabrikam conçoit le réseau d'un système SAP S/4HANA à haute disponibilité qui sera réparti sur les zones de disponibilité 1 et 2 de la région Europe Ouest. Les machines virtuelles des serveurs d'applications et celles de la base de données doivent se trouver dans des sous-réseaux distincts.

        La conception doit réduire au minimum le nombre de ressources réseau à gérer. Que devez-vous inclure dans la conception ?
    body:
      options:
        - { id: a, text: { en: "One virtual network per zone, each with an application subnet and a database subnet, connected by peering", fr: "Un réseau virtuel par zone, chacun avec un sous-réseau d'application et un sous-réseau de base de données, reliés par peering" } }
        - { id: b, text: { en: "One virtual network per layer, each with a subnet for zone 1 and a subnet for zone 2, connected by peering", fr: "Un réseau virtuel par couche, chacun avec un sous-réseau pour la zone 1 et un pour la zone 2, reliés par peering" } }
        - { id: c, text: { en: "One virtual network with one application subnet and one database subnet, used by the VMs of both zones", fr: "Un réseau virtuel avec un sous-réseau d'application et un sous-réseau de base de données, utilisés par les machines virtuelles des deux zones" } }
        - { id: d, text: { en: "One virtual network with an application subnet and a database subnet dedicated to each of the two zones", fr: "Un réseau virtuel avec un sous-réseau d'application et un sous-réseau de base de données dédiés à chacune des deux zones" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A virtual network is limited to one region but spans all its availability zones, and its subnets aren't tied to a zone. One virtual network with one application subnet and one database subnet therefore serves the VMs of both zones, which keeps the application and database layers in separate subnets of the same network, as Microsoft recommends for SAP.
        fr: |
          Un réseau virtuel est limité à une région mais couvre toutes ses zones de disponibilité, et ses sous-réseaux ne sont pas liés à une zone. Un seul réseau virtuel avec un sous-réseau d'application et un sous-réseau de base de données sert donc les machines virtuelles des deux zones, ce qui garde les couches application et base de données dans des sous-réseaux distincts du même réseau, comme Microsoft le recommande pour SAP.
      options:
        a: { en: "No per-zone network is needed, and two networks plus their peering add resources to manage for nothing.", fr: "Aucun réseau par zone n'est nécessaire, et deux réseaux plus leur peering ajoutent des ressources à gérer sans aucun bénéfice." }
        b: { en: "Separating the application and database layers into different virtual networks isn't supported for SAP and adds peering transfer costs.", fr: "Séparer les couches application et base de données dans des réseaux virtuels différents n'est pas pris en charge pour SAP et ajoute des coûts de transfert de peering." }
        d: { en: "This design works, but per-zone subnets double the subnets to manage: subnets already span all the zones of the region.", fr: "Cette conception fonctionne, mais des sous-réseaux par zone doublent le nombre de sous-réseaux à gérer : les sous-réseaux couvrent déjà toutes les zones de la région." }
    references:
      - title: Azure Virtual Network FAQ
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq
      - title: Plan and implement an SAP deployment on Azure
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide

  # ------------------------------------------------------------------ 2
  - id: az120-qz-22-02
    objective: "2.2.8"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso runs the ASCS and ERS instances of an SAP system in a Pacemaker cluster of two VMs. An internal Standard Load Balancer has one frontend IP address for ASCS and one for ERS. The SAP virtual host names **sapascs** and **sapers** are registered as A records in an Azure private DNS zone linked to the virtual network.

        To which IP address should the A record of sapascs point?
      fr: |
        Contoso exécute les instances ASCS et ERS d'un système SAP dans un cluster Pacemaker de deux machines virtuelles. Un équilibreur de charge Standard interne dispose d'une adresse IP frontale pour ASCS et d'une pour ERS. Les noms d'hôtes virtuels SAP **sapascs** et **sapers** sont inscrits comme enregistrements A dans une zone DNS privée Azure liée au réseau virtuel.

        Vers quelle adresse IP l'enregistrement A de sapascs doit-il pointer ?
    body:
      options:
        - { id: a, text: { en: "The primary private IP address of the cluster node that currently runs ASCS", fr: "L'adresse IP privée principale du nœud du cluster qui exécute actuellement ASCS" } }
        - { id: b, text: { en: "The ASCS frontend IP address of the internal load balancer", fr: "L'adresse IP frontale ASCS de l'équilibreur de charge interne" } }
        - { id: c, text: { en: "A secondary IP address added to the network interface of the first cluster node", fr: "Une adresse IP secondaire ajoutée à la carte réseau du premier nœud du cluster" } }
        - { id: d, text: { en: "The address 168.63.129.16, from which the load balancer sends its health probes", fr: "L'adresse 168.63.129.16, d'où l'équilibreur de charge envoie ses sondes d'intégrité" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          In an Azure Pacemaker cluster, the virtual host name follows the instance through the load balancer: the A record points to the frontend IP address that the load balancer sends to the node where ASCS currently runs. A failover then needs no DNS change.
        fr: |
          Dans un cluster Pacemaker sur Azure, le nom d'hôte virtuel suit l'instance grâce à l'équilibreur de charge : l'enregistrement A pointe vers l'adresse IP frontale que l'équilibreur de charge dirige vers le nœud où ASCS s'exécute actuellement. Un basculement ne demande alors aucune modification DNS.
      options:
        a: { en: "The record would stop resolving to ASCS after a failover to the other node.", fr: "L'enregistrement ne pointerait plus vers ASCS après un basculement vers l'autre nœud." }
        c: { en: "An IP address of one node's NIC doesn't move with the instance to the other node on failover.", fr: "Une adresse IP de la carte réseau d'un nœud ne suit pas l'instance vers l'autre nœud lors d'un basculement." }
        d: { en: "168.63.129.16 is the Azure platform address used for health probes and Azure DNS, not an address that clients can reach ASCS on.", fr: "168.63.129.16 est l'adresse de la plateforme Azure utilisée par les sondes d'intégrité et Azure DNS, pas une adresse où les clients peuvent joindre ASCS." }
    references:
      - title: Azure VMs high availability for SAP NW on SLES with NFS on Azure Files
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-guide-suse-nfs-azure-files

  # ------------------------------------------------------------------ 3
  - id: az120-qz-22-03
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware runs a four-node SAP HANA scale-out system. Each node has two network interfaces: **nic-client** in the subnet snet-hana-client, and **nic-inter** in the subnet snet-hana-inter, which carries the traffic between the HANA nodes. Accelerated Networking is enabled on nic-client only. The VM size supports Accelerated Networking on all its network interfaces, and the image includes the required drivers.

        You need the network interfaces of the HANA nodes to follow Microsoft guidance for SAP. What should you do?
      fr: |
        Litware exécute un système SAP HANA scale-out de quatre nœuds. Chaque nœud dispose de deux cartes réseau : **nic-client** dans le sous-réseau snet-hana-client, et **nic-inter** dans le sous-réseau snet-hana-inter, qui transporte le trafic entre les nœuds HANA. Accelerated Networking n'est activé que sur nic-client. La taille de machine virtuelle prend en charge Accelerated Networking sur toutes ses cartes réseau, et l'image contient les pilotes nécessaires.

        Vous devez faire en sorte que les cartes réseau des nœuds HANA suivent les recommandations de Microsoft pour SAP. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable Accelerated Networking on nic-inter of each node while the HANA nodes keep running.", fr: "Activer Accelerated Networking sur nic-inter de chaque nœud pendant que les nœuds HANA continuent de tourner." } }
        - { id: b, text: { en: "Add a third network interface to each node in snet-hana-inter to increase the internode bandwidth.", fr: "Ajouter une troisième carte réseau à chaque nœud dans snet-hana-inter pour augmenter la bande passante entre nœuds." } }
        - { id: c, text: { en: "Remove nic-inter and send the internode traffic through nic-client, which already uses Accelerated Networking.", fr: "Supprimer nic-inter et faire passer le trafic entre nœuds par nic-client, qui utilise déjà Accelerated Networking." } }
        - { id: d, text: { en: "Stop (deallocate) each node, enable Accelerated Networking on its nic-inter, and then start the node.", fr: "Arrêter (libérer) chaque nœud, activer Accelerated Networking sur sa carte nic-inter, puis redémarrer le nœud." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Microsoft expects Accelerated Networking on every network interface of every SAP VM where the size allows it, including the secondary interface that HANA scale-out uses for internode traffic. Accelerated Networking can be enabled only on a stopped (deallocated) VM, so each node is deallocated, updated and started again.
        fr: |
          Microsoft attend Accelerated Networking sur chaque carte réseau de chaque machine virtuelle SAP quand la taille le permet, y compris la carte secondaire que HANA scale-out utilise pour le trafic entre nœuds. Accelerated Networking ne peut être activé que sur une machine virtuelle arrêtée (libérée) : chaque nœud est donc libéré, mis à jour, puis redémarré.
      options:
        a: { en: "Accelerated Networking can't be enabled on a running VM; the VM must be stopped and deallocated first.", fr: "Accelerated Networking ne peut pas être activé sur une machine virtuelle en cours d'exécution ; elle doit d'abord être arrêtée et libérée." }
        b: { en: "All the network interfaces of a VM share its bandwidth: an extra NIC adds no bandwidth, and nic-inter would still lack Accelerated Networking.", fr: "Toutes les cartes réseau d'une machine virtuelle partagent sa bande passante : une carte de plus n'ajoute aucune bande passante, et nic-inter resterait sans Accelerated Networking." }
        c: { en: "HANA scale-out requires a separate network interface for the internode network; merging it with client traffic breaks that guidance.", fr: "HANA scale-out exige une carte réseau distincte pour le réseau entre nœuds ; la fusionner avec le trafic client enfreint cette recommandation." }
    references:
      - title: Plan and implement an SAP deployment on Azure
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide
      - title: Azure Accelerated Networking Overview and Benefits
        url: https://learn.microsoft.com/en-us/azure/virtual-network/accelerated-networking-overview

  # ------------------------------------------------------------------ 4
  - id: az120-qz-22-04
    objective: "2.2.6"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank must let SAP support connect to its SAP systems on Azure through SAProuter. The SAP systems run in a spoke virtual network, and their VMs have no public IP addresses. Azure Firewall in the hub virtual network is the only public entry point into the Azure networks, and the security team doesn't allow any other one.

        How should you complete the design? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank doit permettre au support SAP de se connecter à ses systèmes SAP sur Azure par SAProuter. Les systèmes SAP s'exécutent dans un réseau virtuel spoke, et leurs machines virtuelles n'ont pas d'adresse IP publique. Le Pare-feu Azure du réseau virtuel hub est le seul point d'entrée public des réseaux Azure, et l'équipe de sécurité n'en autorise aucun autre.

        Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          SAProuter runs on: [[host]]
          SAP support reaches SAProuter through: [[entry]]
          The NSG of the SAProuter subnet allows inbound TCP port: [[port]]
        fr: |
          SAProuter s'exécute sur : [[host]]
          Le support SAP atteint SAProuter par : [[entry]]
          Le NSG du sous-réseau de SAProuter autorise en entrée le port TCP : [[port]]
      slots:
        - id: host
          options:
            - { id: own, text: { en: "A dedicated VM with a static private IP address", fr: "Une machine virtuelle dédiée avec une adresse IP privée statique" } }
            - { id: ascs, text: { en: "The ASCS/SCS VM of the production system", fr: "La machine virtuelle ASCS/SCS du système de production" } }
            - { id: app, text: { en: "The first application server VM of each system", fr: "La première machine virtuelle de serveur d'applications de chaque système" } }
        - id: entry
          options:
            - { id: pip, text: { en: "A public IP address on the SAProuter VM", fr: "Une adresse IP publique sur la machine virtuelle SAProuter" } }
            - { id: fw, text: { en: "A DNAT rule on Azure Firewall", fr: "Une règle DNAT sur le Pare-feu Azure" } }
            - { id: nat, text: { en: "An Azure NAT gateway on the SAProuter subnet", fr: "Une passerelle NAT Azure sur le sous-réseau de SAProuter" } }
            - { id: bastion, text: { en: "Azure Bastion in the hub virtual network", fr: "Azure Bastion dans le réseau virtuel hub" } }
        - id: port
          options:
            - { id: p3200, text: "3200" }
            - { id: p3299, text: "3299" }
            - { id: p3300, text: "3300" }
            - { id: p3600, text: "3600" }
    answer:
      values: { host: own, entry: fw, port: p3299 }
    explanation:
      correct:
        en: |
          SAProuter runs on its own VM with a static IP address, so that SAP support and the saprouttab rules always target the same host and no SAP system VM is exposed. The only public entry point is Azure Firewall, so SAP support reaches SAProuter through a firewall rule restricted to SAP's router addresses. SAProuter listens on TCP 3299, the port that the NSG must allow.
        fr: |
          SAProuter s'exécute sur sa propre machine virtuelle avec une adresse IP statique, afin que le support SAP et les règles saprouttab ciblent toujours le même hôte et qu'aucune machine virtuelle de système SAP ne soit exposée. Le seul point d'entrée public est le Pare-feu Azure : le support SAP atteint donc SAProuter par une règle du pare-feu limitée aux adresses des routeurs SAP. SAProuter écoute sur TCP 3299, le port que le NSG doit autoriser.
      options:
        ascs: { en: "Hosting SAProuter on an SAP system VM exposes that system directly to the support connection.", fr: "Héberger SAProuter sur une machine virtuelle d'un système SAP expose directement ce système à la connexion de support." }
        pip: { en: "A public IP on a VM would be a second public entry point, which the security team forbids; public IPs on SAP VMs aren't recommended.", fr: "Une adresse IP publique sur une machine virtuelle serait un second point d'entrée public, interdit par l'équipe de sécurité ; elle est déconseillée sur les machines virtuelles SAP." }
        nat: { en: "A NAT gateway only handles outbound connections; inbound connections don't use it.", fr: "Une passerelle NAT ne gère que les connexions sortantes ; les connexions entrantes ne l'utilisent pas." }
        bastion: { en: "Azure Bastion gives administrators RDP or SSH access to VMs; it doesn't publish the SAProuter port to SAP.", fr: "Azure Bastion donne aux administrateurs un accès RDP ou SSH aux machines virtuelles ; il ne publie pas le port de SAProuter vers SAP." }
        p3200: { en: "32NN is the SAP dispatcher port used by SAP GUI, not SAProuter.", fr: "32NN est le port du répartiteur SAP utilisé par SAP GUI, pas celui de SAProuter." }
        p3300: { en: "33NN is the SAP gateway (RFC) port.", fr: "33NN est le port de la passerelle SAP (RFC)." }
        p3600: { en: "36NN is the message server port.", fr: "36NN est le port du serveur de messages." }
    references:
      - title: Inbound and outbound internet connections for SAP on Azure
        url: https://learn.microsoft.com/en-us/azure/architecture/guide/sap/sap-internet-inbound-outbound

  # ------------------------------------------------------------------ 5
  - id: az120-qz-22-05
    objective: "2.2.5"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Adatum uses user-defined routes to send the internet-bound and on-premises traffic of its SAP spoke virtual network through Azure Firewall in the hub. The spoke contains the SAP application servers and an SAP HANA Pacemaker cluster whose fencing uses SBD devices on iSCSI target server VMs. The security team wants as much traffic as possible to go through the firewall.

        Which two communication paths must stay direct, without the firewall in the path?

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum utilise des itinéraires définis par l'utilisateur pour faire passer par le Pare-feu Azure du hub le trafic Internet et le trafic vers l'environnement local de son réseau virtuel spoke SAP. Le spoke contient les serveurs d'applications SAP et un cluster Pacemaker SAP HANA dont la clôture utilise des périphériques SBD sur des machines virtuelles de serveurs cibles iSCSI. L'équipe de sécurité veut que le plus de trafic possible passe par le pare-feu.

        Quels sont les deux chemins de communication qui doivent rester directs, sans le pare-feu sur le chemin ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "From the HANA cluster nodes to the operating system update repositories on the internet", fr: "Des nœuds du cluster HANA vers les dépôts de mises à jour du système d'exploitation sur Internet" } }
        - { id: b, text: { en: "From the SAP application servers to the SAP HANA database", fr: "Des serveurs d'applications SAP vers la base de données SAP HANA" } }
        - { id: c, text: { en: "From the on-premises SAP GUI users to the SAP application servers", fr: "Des utilisateurs SAP GUI locaux vers les serveurs d'applications SAP" } }
        - { id: d, text: { en: "From the HANA cluster nodes to the SBD iSCSI target servers", fr: "Des nœuds du cluster HANA vers les serveurs cibles iSCSI de SBD" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Microsoft doesn't support a network virtual appliance, such as a firewall, in the path between the SAP application layer and the DBMS layer: it can double the latency and limit throughput. The path between Pacemaker cluster nodes and their SBD devices is also unsupported through an NVA, because it can make the cluster fail. Both paths can still be filtered with NSG and ASG rules.
        fr: |
          Microsoft ne prend pas en charge d'appliance virtuelle réseau, comme un pare-feu, sur le chemin entre la couche application SAP et la couche SGBD : elle peut doubler la latence et limiter le débit. Le chemin entre les nœuds d'un cluster Pacemaker et leurs périphériques SBD n'est pas non plus pris en charge à travers une NVA, car elle peut faire échouer le cluster. Ces deux chemins peuvent quand même être filtrés par des règles de NSG et d'ASG.
      options:
        a: { en: "Internet-bound traffic such as OS updates can go through the hub firewall; it's a common outbound design for SAP.", fr: "Le trafic Internet, comme les mises à jour du système d'exploitation, peut passer par le pare-feu du hub ; c'est une conception sortante courante pour SAP." }
        c: { en: "Traffic between on-premises users and the application servers can be inspected by the hub firewall; only the application-to-database path must be direct.", fr: "Le trafic entre les utilisateurs locaux et les serveurs d'applications peut être inspecté par le pare-feu du hub ; seul le chemin application-base de données doit être direct." }
    references:
      - title: Plan and implement an SAP deployment on Azure
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/planning-guide

  # ------------------------------------------------------------------ 6
  - id: az120-qz-22-06
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Tailspin Toys runs three production SAP systems in one Azure region: S/4HANA (**PS1**), BW/4HANA (**PB1**) and SAP Process Orchestration (**PP1**). PS1 is deployed across availability zones 1 and 2, and the network latency inside each zone doesn't meet the needs of its application layer. In each zone, the application servers of PS1 must be spread across fault domains by using an availability set, and the database VMs follow current Microsoft guidance for proximity placement groups (PPGs).

        The architects review the following PPG design points.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys exécute trois systèmes SAP de production dans une région Azure : S/4HANA (**PS1**), BW/4HANA (**PB1**) et SAP Process Orchestration (**PP1**). PS1 est déployé sur les zones de disponibilité 1 et 2, et la latence réseau à l'intérieur de chaque zone ne répond pas aux besoins de sa couche application. Dans chaque zone, les serveurs d'applications de PS1 doivent être répartis entre des domaines d'erreur à l'aide d'un groupe à haute disponibilité, et les machines virtuelles de base de données suivent les recommandations actuelles de Microsoft pour les groupes de placement de proximité (PPG).

        Les architectes examinent les points de conception suivants des PPG.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "To limit the number of PPGs, the application servers of PS1, PB1 and PP1 in zone 1 should share one PPG.", fr: "Pour limiter le nombre de PPG, les serveurs d'applications de PS1, PB1 et PP1 de la zone 1 doivent partager un même PPG." }
        - id: s2
          text: { en: "The application servers of PS1 in zone 2 need their own PPG, scoped by the PS1 central services cluster node deployed in zone 2.", fr: "Les serveurs d'applications de PS1 de la zone 2 ont besoin de leur propre PPG, dont l'étendue est fixée par le nœud du cluster des services centraux de PS1 déployé dans la zone 2." }
        - id: s3
          text: { en: "Because the PS1 application servers of zone 1 are members of the zone 1 PPG, their managed disks are allocated under the same network spine as the anchor VM.", fr: "Comme les serveurs d'applications de PS1 de la zone 1 sont membres du PPG de la zone 1, leurs disques managés sont alloués sous la même dorsale réseau que la machine virtuelle d'ancrage." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A PPG is scoped to one SAP system, never to a landscape: each extra system raises the risk that a needed VM type isn't available under the pinned network spine. A PPG is also bound to one zone, so a zonal system with availability sets uses one PPG per zone, scoped by the central services VM of that zone, while the database VMs stay out of the PPGs. A PPG only places VMs: the disks of the application VMs can be allocated in another datacenter of the region.
        fr: |
          Un PPG est limité à un système SAP, jamais à un paysage : chaque système supplémentaire augmente le risque qu'un type de machine virtuelle nécessaire ne soit pas disponible sous la dorsale réseau épinglée. Un PPG est aussi lié à une zone : un système zonal avec des groupes à haute disponibilité utilise donc un PPG par zone, dont l'étendue est fixée par la machine virtuelle des services centraux de cette zone, tandis que les machines virtuelles de base de données restent hors des PPG. Un PPG ne place que les machines virtuelles : les disques des machines virtuelles d'application peuvent être alloués dans un autre centre de données de la région.
      options:
        s1: { en: "Microsoft advises one PPG per SAP system; grouping several production systems makes allocation failures more likely.", fr: "Microsoft recommande un PPG par système SAP ; regrouper plusieurs systèmes de production rend les échecs d'allocation plus probables." }
        s3: { en: "Only the disks of the anchor VM are guaranteed in its zone; base VHDs and managed disks of other VMs can be allocated anywhere in the region.", fr: "Seuls les disques de la machine virtuelle d'ancrage sont garantis dans sa zone ; les VHD de base et les disques managés des autres machines virtuelles peuvent être alloués n'importe où dans la région." }
    references:
      - title: Configuration options to minimize network latency with SAP applications
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/proximity-placement-scenarios

  # ------------------------------------------------------------------ 7
  - id: az120-qz-22-07
    objective: "2.2.7"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso's SAP spoke virtual network **vnet-sap** is peered with the hub virtual network **vnet-hub** and uses the hub's ExpressRoute gateway, which connects to the on-premises datacenter through private peering. vnet-sap contains:

        - The subnet **snet-sap-app**, with the Microsoft.Storage service endpoint enabled. The NFS shares for /sapmnt and /usr/sap/trans are in the Azure Files SSD storage account **stsapnfs**, whose only network rule allows snet-sap-app; the default action is Deny.
        - The subnet **snet-anf**, delegated to Azure NetApp Files, which hosts the SAP HANA volumes with Standard network features.

        A Linux administration VM in vnet-hub must mount the NFS shares and the /hana/shared volume.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le réseau virtuel spoke SAP de Contoso, **vnet-sap**, est relié par peering au réseau virtuel hub **vnet-hub** et utilise la passerelle ExpressRoute du hub, connectée au centre de données local par le peering privé. vnet-sap contient :

        - Le sous-réseau **snet-sap-app**, avec le point de terminaison de service Microsoft.Storage activé. Les partages NFS de /sapmnt et /usr/sap/trans se trouvent dans le compte de stockage Azure Files SSD **stsapnfs**, dont la seule règle réseau autorise snet-sap-app ; l'action par défaut est Deny.
        - Le sous-réseau **snet-anf**, délégué à Azure NetApp Files, qui héberge les volumes SAP HANA avec les fonctionnalités réseau Standard.

        Une machine virtuelle Linux d'administration de vnet-hub doit monter les partages NFS et le volume /hana/shared.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The administration VM can mount the NFS shares of stsapnfs without any change to the network configuration of the storage account.", fr: "La machine virtuelle d'administration peut monter les partages NFS de stsapnfs sans aucune modification de la configuration réseau du compte de stockage." }
        - id: s2
          text: { en: "If you add a private endpoint for the file sub-resource of stsapnfs in vnet-sap, an on-premises Linux server can mount the NFS shares over ExpressRoute when its DNS resolves the account name to the private endpoint IP address.", fr: "Si vous ajoutez un point de terminaison privé pour la sous-ressource file de stsapnfs dans vnet-sap, un serveur Linux local peut monter les partages NFS via ExpressRoute lorsque son DNS résout le nom du compte vers l'adresse IP du point de terminaison privé." }
        - id: s3
          text: { en: "Before the administration VM can mount /hana/shared, you must create a private endpoint for the Azure NetApp Files volume in vnet-hub.", fr: "Avant que la machine virtuelle d'administration puisse monter /hana/shared, vous devez créer un point de terminaison privé pour le volume Azure NetApp Files dans vnet-hub." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          A service endpoint and its virtual network rule only admit traffic from the enabled subnet: a VM in a peered network isn't allowed, and IP rules aren't supported for NFS shares. A private endpoint gives the account a private IP address that peered networks and on-premises clients behind the gateway can reach, as long as DNS returns that address. Azure NetApp Files uses neither kind of endpoint: its volumes have IP addresses in the delegated subnet, reachable from peered virtual networks.
        fr: |
          Un point de terminaison de service et sa règle de réseau virtuel n'admettent que le trafic du sous-réseau activé : une machine virtuelle d'un réseau relié par peering n'est pas autorisée, et les règles IP ne sont pas prises en charge pour les partages NFS. Un point de terminaison privé donne au compte une adresse IP privée que les réseaux reliés par peering et les clients locaux derrière la passerelle peuvent joindre, tant que le DNS renvoie cette adresse. Azure NetApp Files n'utilise aucun de ces points de terminaison : ses volumes ont des adresses IP dans le sous-réseau délégué, joignables depuis les réseaux virtuels reliés par peering.
      options:
        s1: { en: "Peering doesn't extend the virtual network rule: only snet-sap-app is allowed, so a private endpoint (or a service endpoint and rule for the hub subnet) is needed.", fr: "Le peering n'étend pas la règle de réseau virtuel : seul snet-sap-app est autorisé ; il faut donc un point de terminaison privé (ou un point de terminaison de service et une règle pour le sous-réseau du hub)." }
        s3: { en: "Azure NetApp Files volumes are reached directly at their IP address in the delegated subnet, from the same or a peered virtual network.", fr: "Les volumes Azure NetApp Files sont joints directement à leur adresse IP dans le sous-réseau délégué, depuis le même réseau virtuel ou un réseau relié par peering." }
    references:
      - title: NFS file shares in Azure Files
        url: https://learn.microsoft.com/en-us/azure/storage/files/files-nfs-protocol
      - title: Guidelines for Azure NetApp Files network planning
        url: https://learn.microsoft.com/en-us/azure/azure-netapp-files/azure-netapp-files-network-topologies

  # ------------------------------------------------------------------ 8
  - id: az120-qz-22-08
    objective: "2.2.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Traders is planning a zonal deployment of SAP S/4HANA. In Northwind's subscription, the database VM size **Standard_M416ms_v2** is offered only in availability zones 1 and 2 of the region. You deployed test VMs with Accelerated Networking in the three zones and measured the latency with `niping`:

        | Path | Latency |
        | --- | --- |
        | Inside one zone | 0.12 ms |
        | Zone 1 to zone 2 | 0.71 ms |
        | Zone 1 to zone 3 | 0.38 ms |
        | Zone 2 to zone 3 | 0.44 ms |

        Load tests show that the cross-zone latency between the application layer and the database is too high for Northwind's business processes. The database and the ASCS/SCS instances will run in two-node clusters split across two zones.

        How should you complete the design? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders planifie un déploiement zonal de SAP S/4HANA. Dans l'abonnement de Northwind, la taille de machine virtuelle de base de données **Standard_M416ms_v2** n'est proposée que dans les zones de disponibilité 1 et 2 de la région. Vous avez déployé des machines virtuelles de test avec Accelerated Networking dans les trois zones et mesuré la latence avec `niping` :

        | Chemin | Latence |
        | --- | --- |
        | À l'intérieur d'une zone | 0,12 ms |
        | Zone 1 vers zone 2 | 0,71 ms |
        | Zone 1 vers zone 3 | 0,38 ms |
        | Zone 2 vers zone 3 | 0,44 ms |

        Les tests de charge montrent que la latence interzone entre la couche application et la base de données est trop élevée pour les processus métier de Northwind. La base de données et les instances ASCS/SCS s'exécuteront dans des clusters de deux nœuds répartis sur deux zones.

        Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Zones of the database and ASCS/SCS cluster nodes: [[zones]]
          Placement of the application servers: [[mode]]
          After an automatic failover of the database to the other zone: [[after]]
        fr: |
          Zones des nœuds des clusters de base de données et ASCS/SCS : [[zones]]
          Placement des serveurs d'applications : [[mode]]
          Après un basculement automatique de la base de données vers l'autre zone : [[after]]
      slots:
        - id: zones
          options:
            - { id: z12, text: { en: "Zones 1 and 2", fr: "Zones 1 et 2" } }
            - { id: z13, text: { en: "Zones 1 and 3", fr: "Zones 1 et 3" } }
            - { id: z23, text: { en: "Zones 2 and 3", fr: "Zones 2 et 3" } }
        - id: mode
          options:
            - { id: aa, text: { en: "Split evenly across both zones, active/active", fr: "Répartis à parts égales sur les deux zones, en actif/actif" } }
            - { id: ap, text: { en: "In the zone of the active database, active/passive", fr: "Dans la zone de la base de données active, en actif/passif" } }
            - { id: z3, text: { en: "In zone 3, which has the lowest latency to the other zones", fr: "Dans la zone 3, qui a la latence la plus faible vers les autres zones" } }
        - id: after
          options:
            - { id: back, text: { en: "Fail the database back to the zone of the application servers as soon as possible", fr: "Effectuer dès que possible la restauration automatique de la base de données vers la zone des serveurs d'applications" } }
            - { id: stay, text: { en: "Keep the database in the new zone, because 0.71 ms is within the SAP latency limits", fr: "Garder la base de données dans la nouvelle zone, car 0,71 ms respecte les limites de latence de SAP" } }
            - { id: ppg, text: { en: "Add the application servers to a proximity placement group that spans both zones", fr: "Ajouter les serveurs d'applications à un groupe de placement de proximité qui couvre les deux zones" } }
    answer:
      values: { zones: z12, mode: ap, after: back }
    explanation:
      correct:
        en: |
          The two zones must have the lowest latency among the pairs that offer every required VM size: the database size exists only in zones 1 and 2, so the pair 1 and 3 is excluded even though its latency is lower. When cross-zone latency is too high for the business processes, Microsoft recommends active/passive, with the application layer in the zone of the active database. After a database failover, the application servers talk to the database across zones, so you fail back as soon as possible.
        fr: |
          Les deux zones doivent avoir la latence la plus faible parmi les paires qui proposent toutes les tailles de machines virtuelles requises : la taille de la base de données n'existe que dans les zones 1 et 2, la paire 1 et 3 est donc exclue malgré sa latence plus faible. Quand la latence interzone est trop élevée pour les processus métier, Microsoft recommande l'actif/passif, avec la couche application dans la zone de la base de données active. Après un basculement de la base de données, les serveurs d'applications lui parlent d'une zone à l'autre : vous effectuez donc la restauration automatique dès que possible.
      options:
        z13: { en: "Zone 3 doesn't offer Standard_M416ms_v2, so a database cluster node can't run there.", fr: "La zone 3 ne propose pas Standard_M416ms_v2 : un nœud du cluster de base de données ne peut donc pas s'y exécuter." }
        aa: { en: "Active/active puts half of the application servers across zones from the database, which the load tests rule out.", fr: "L'actif/actif place la moitié des serveurs d'applications dans une autre zone que la base de données, ce que les tests de charge excluent." }
        z3: { en: "Zone 3 is still a different zone from the database, so every application-to-database call crosses zones.", fr: "La zone 3 reste une autre zone que celle de la base de données : chaque appel de l'application vers la base de données traverse donc les zones." }
        stay: { en: "SAP Note 1100926 classes are only rough guidance, and the load tests already show that this latency is too high for Northwind.", fr: "Les classes de la note SAP 1100926 ne sont qu'indicatives, et les tests de charge montrent déjà que cette latence est trop élevée pour Northwind." }
        ppg: { en: "A proximity placement group is bound to one zone; it can't span two zones.", fr: "Un groupe de placement de proximité est lié à une zone ; il ne peut pas en couvrir deux." }
    references:
      - title: SAP workload configurations with Azure Availability Zones
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/high-availability-zones

  # ------------------------------------------------------------------ 9
  - id: az120-qz-22-09
    objective: "2.2.8"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam's SAP virtual network **vnet-sap** uses Azure-provided DNS. The private DNS zone **privatelink.blob.core.windows.net**, linked to vnet-sap, contains the records of the private endpoints of Fabrikam's backup storage accounts.

        An SAP interface must now upload files over the internet to the storage account **stpartnerdrop**, which belongs to a partner in another Microsoft Entra tenant. The partner created a private endpoint for stpartnerdrop in its own virtual network, and the account accepts public traffic from the outbound IP address of Fabrikam's NAT gateway. From the SAP VMs, the query for `stpartnerdrop.blob.core.windows.net` returns NXDOMAIN.

        You need the SAP VMs to resolve stpartnerdrop to its public endpoint while keeping private name resolution for Fabrikam's own accounts. The solution must not require a DNS record for each external storage account. What should you do?
      fr: |
        Le réseau virtuel SAP de Fabrikam, **vnet-sap**, utilise le DNS fourni par Azure. La zone DNS privée **privatelink.blob.core.windows.net**, liée à vnet-sap, contient les enregistrements des points de terminaison privés des comptes de stockage de sauvegarde de Fabrikam.

        Une interface SAP doit désormais charger des fichiers via Internet dans le compte de stockage **stpartnerdrop**, qui appartient à un partenaire dans un autre locataire Microsoft Entra. Le partenaire a créé un point de terminaison privé pour stpartnerdrop dans son propre réseau virtuel, et le compte accepte le trafic public provenant de l'adresse IP sortante de la passerelle NAT de Fabrikam. Depuis les machines virtuelles SAP, la requête pour `stpartnerdrop.blob.core.windows.net` renvoie NXDOMAIN.

        Vous devez faire en sorte que les machines virtuelles SAP résolvent stpartnerdrop vers son point de terminaison public, tout en conservant la résolution de noms privée pour les comptes de Fabrikam. La solution ne doit pas exiger d'enregistrement DNS pour chaque compte de stockage externe. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add an A record for stpartnerdrop, with the public IP address of its blob endpoint, to the private DNS zone.", fr: "Ajouter à la zone DNS privée un enregistrement A pour stpartnerdrop, avec l'adresse IP publique de son point de terminaison blob." } }
        - { id: b, text: { en: "Link a second, empty private DNS zone named privatelink.blob.core.windows.net to vnet-sap.", fr: "Lier à vnet-sap une seconde zone DNS privée vide nommée privatelink.blob.core.windows.net." } }
        - { id: c, text: { en: "Configure vnet-sap to use custom DNS servers that forward every query to 168.63.129.16.", fr: "Configurer vnet-sap pour utiliser des serveurs DNS personnalisés qui redirigent toutes les requêtes vers 168.63.129.16." } }
        - { id: d, text: { en: "Enable fallback to internet on the virtual network link between the private DNS zone and vnet-sap.", fr: "Activer le repli vers Internet (fallback to internet) sur la liaison de réseau virtuel entre la zone DNS privée et vnet-sap." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Because the partner's account has a private endpoint, its public name is a CNAME to stpartnerdrop.privatelink.blob.core.windows.net. Fabrikam's linked private zone is authoritative for that name and has no record, so it returns NXDOMAIN. Fallback to internet on the virtual network link (`resolutionPolicy: NxDomainRedirect`) makes Azure DNS retry such a query against the public endpoint, while the records of Fabrikam's own private endpoints keep resolving privately.
        fr: |
          Comme le compte du partenaire a un point de terminaison privé, son nom public est un CNAME vers stpartnerdrop.privatelink.blob.core.windows.net. La zone privée liée de Fabrikam fait autorité pour ce nom et n'a pas d'enregistrement : elle renvoie donc NXDOMAIN. Le repli vers Internet sur la liaison de réseau virtuel (`resolutionPolicy: NxDomainRedirect`) fait réessayer à Azure DNS une telle requête vers le point de terminaison public, tandis que les enregistrements des points de terminaison privés de Fabrikam continuent d'être résolus de façon privée.
      options:
        a: { en: "A manual record works for one account only and must be maintained if the public address changes, which the requirement excludes.", fr: "Un enregistrement manuel ne fonctionne que pour un compte et doit être maintenu si l'adresse publique change, ce que l'exigence exclut." }
        b: { en: "A virtual network can't be linked to two private DNS zones with the same name, and an empty zone would also answer NXDOMAIN.", fr: "Un réseau virtuel ne peut pas être lié à deux zones DNS privées de même nom, et une zone vide répondrait aussi NXDOMAIN." }
        c: { en: "Forwarders to 168.63.129.16 use the same Azure DNS resolution and the same linked zone, so the query still returns NXDOMAIN.", fr: "Des redirecteurs vers 168.63.129.16 utilisent la même résolution Azure DNS et la même zone liée : la requête renvoie toujours NXDOMAIN." }
    references:
      - title: Fallback to internet for Azure Private DNS zones - Azure DNS
        url: https://learn.microsoft.com/en-us/azure/dns/private-dns-fallback

  # ------------------------------------------------------------------ 10
  - id: az120-qz-22-10
    objective: "2.2.9"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso connects its datacenter to Azure through a 10-Gbps ExpressRoute provider circuit. The SAP production virtual network **vnet-sap-prd** contains its own ExpressRoute gateway, connected directly to the circuit. The gateway uses the **ErGwScale** SKU with a minimum and a maximum of 4 scale units.

        vnet-sap-prd contains the SAP application servers and Azure NetApp Files volumes that use Standard network features. A virtual network named **vnet-bi** is peered with vnet-sap-prd and uses its gateway. The network team plans to enable FastPath on the connection to the circuit.

        Which two statements are true?

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso connecte son centre de données à Azure par un circuit ExpressRoute de fournisseur de 10 Gbit/s. Le réseau virtuel SAP de production **vnet-sap-prd** contient sa propre passerelle ExpressRoute, connectée directement au circuit. La passerelle utilise la SKU **ErGwScale** avec un minimum et un maximum de 4 unités d'échelle.

        vnet-sap-prd contient les serveurs d'applications SAP et des volumes Azure NetApp Files qui utilisent les fonctionnalités réseau Standard. Un réseau virtuel nommé **vnet-bi** est relié par peering à vnet-sap-prd et utilise sa passerelle. L'équipe réseau prévoit d'activer FastPath sur la connexion au circuit.

        Quelles sont les deux affirmations vraies ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "FastPath can be enabled on the connection without changing the configuration of the gateway.", fr: "FastPath peut être activé sur la connexion sans modifier la configuration de la passerelle." } }
        - { id: b, text: { en: "Once the gateway runs at least 10 scale units and FastPath is enabled, on-premises traffic to the application servers bypasses the gateway.", fr: "Une fois que la passerelle compte au moins 10 unités d'échelle et que FastPath est activé, le trafic local vers les serveurs d'applications contourne la passerelle." } }
        - { id: c, text: { en: "Once FastPath is in use on the connection, on-premises traffic to the VMs of vnet-bi also bypasses the gateway.", fr: "Une fois FastPath utilisé sur la connexion, le trafic local vers les machines virtuelles de vnet-bi contourne aussi la passerelle." } }
        - { id: d, text: { en: "Once FastPath is in use on the connection, on-premises traffic to the Azure NetApp Files volumes of vnet-sap-prd can bypass the gateway.", fr: "Une fois FastPath utilisé sur la connexion, le trafic local vers les volumes Azure NetApp Files de vnet-sap-prd peut contourner la passerelle." } }
        - { id: e, text: { en: "The circuit must be converted to ExpressRoute Direct before FastPath can be used for traffic to vnet-sap-prd.", fr: "Le circuit doit être converti en ExpressRoute Direct avant que FastPath puisse servir au trafic vers vnet-sap-prd." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          An ErGwScale gateway supports FastPath only from 10 scale units, so the gateway must be scaled first. Provider circuits support FastPath to the virtual network that contains the gateway, so traffic to the application servers then bypasses the gateway, and Azure NetApp Files volumes with Standard network features are reachable over FastPath. FastPath over virtual network peering requires ExpressRoute Direct, so traffic to vnet-bi still crosses the gateway.
        fr: |
          Une passerelle ErGwScale ne prend en charge FastPath qu'à partir de 10 unités d'échelle : il faut donc d'abord la mettre à l'échelle. Les circuits de fournisseur prennent en charge FastPath vers le réseau virtuel qui contient la passerelle : le trafic vers les serveurs d'applications contourne alors la passerelle, et les volumes Azure NetApp Files avec les fonctionnalités réseau Standard sont joignables via FastPath. FastPath via un peering de réseaux virtuels exige ExpressRoute Direct : le trafic vers vnet-bi traverse donc toujours la passerelle.
      options:
        a: { en: "With 4 scale units, the ErGwScale gateway is below the 10-unit minimum that FastPath requires.", fr: "Avec 4 unités d'échelle, la passerelle ErGwScale est sous le minimum de 10 unités qu'exige FastPath." }
        c: { en: "FastPath to peered virtual networks is supported only with ExpressRoute Direct, not with a provider circuit.", fr: "FastPath vers des réseaux virtuels reliés par peering n'est pris en charge qu'avec ExpressRoute Direct, pas avec un circuit de fournisseur." }
        e: { en: "Provider circuits support FastPath to the virtual network that contains the gateway; Direct is needed only for features such as peering, UDRs or Private Link over FastPath.", fr: "Les circuits de fournisseur prennent en charge FastPath vers le réseau virtuel qui contient la passerelle ; Direct n'est nécessaire que pour des fonctionnalités comme le peering, les UDR ou Private Link via FastPath." }
    references:
      - title: "Azure ExpressRoute FastPath: Features, availability, and limitations"
        url: https://learn.microsoft.com/en-us/azure/expressroute/about-fastpath
