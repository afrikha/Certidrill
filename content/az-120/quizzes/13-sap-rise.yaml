chapter: 13-sap-rise
questions:
  # ------------------------------------------------------------------ 1
  - id: az120-qz-13-01
    objective: "1.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. has a hub virtual network named **vnet-hub** with the address space 10.20.0.0/16. Litware will connect vnet-hub to its future RISE with SAP virtual network by using virtual network peering.

        For the RISE virtual network, SAP proposes the address range 10.20.64.0/22.

        What should you do before SAP deploys the RISE landscape?
      fr: |
        Litware, Inc. dispose d'un réseau virtuel hub nommé **vnet-hub** dont l'espace d'adressage est 10.20.0.0/16. Litware reliera vnet-hub à son futur réseau virtuel RISE with SAP par un peering de réseaux virtuels.

        Pour le réseau virtuel RISE, SAP propose la plage d'adresses 10.20.64.0/22.

        Que devez-vous faire avant que SAP déploie le paysage RISE ?
    body:
      options:
        - { id: a, text: { en: "Enable gateway transit on the future peering so that the overlapping addresses are translated.", fr: "Activer le transit par passerelle sur le futur peering afin que les adresses qui se chevauchent soient traduites." } }
        - { id: b, text: { en: "Plan a global virtual network peering instead, because it accepts overlapping address ranges.", fr: "Prévoir plutôt un peering de réseaux virtuels mondial, car il accepte les plages d'adresses qui se chevauchent." } }
        - { id: c, text: { en: "Ask SAP for a RISE address range that doesn't overlap the address space of vnet-hub.", fr: "Demander à SAP une plage d'adresses RISE qui ne chevauche pas l'espace d'adressage de vnet-hub." } }
        - { id: d, text: { en: "Keep the proposed range, create the peering, and then run a sync on the peering of vnet-hub.", fr: "Conserver la plage proposée, créer le peering, puis exécuter une synchronisation sur le peering de vnet-hub." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          10.20.64.0/22 lies inside 10.20.0.0/16, and virtual networks that you peer must have nonoverlapping address spaces. The address space of the RISE network is agreed with SAP before SAP deploys it, so this is the moment to ask for a range that is free in your addressing plan.
        fr: |
          10.20.64.0/22 se trouve à l'intérieur de 10.20.0.0/16, et les réseaux virtuels reliés par peering doivent avoir des espaces d'adressage sans chevauchement. L'espace d'adressage du réseau RISE se convient avec SAP avant que SAP le déploie : c'est donc le moment de demander une plage libre dans votre plan d'adressage.
      options:
        a: { en: "Gateway transit lets a peered network use the gateway of the other one; it doesn't translate addresses, and the peering can't be created with overlapping spaces.", fr: "Le transit par passerelle permet à un réseau relié par peering d'utiliser la passerelle de l'autre ; il ne traduit pas d'adresses, et le peering ne peut pas se créer avec des espaces qui se chevauchent." }
        b: { en: "Global peering only connects networks in different regions; the nonoverlapping requirement applies to it as well.", fr: "Le peering mondial relie seulement des réseaux de régions différentes ; l'exigence de non-chevauchement s'y applique aussi." }
        d: { en: "A sync refreshes a peering after an address space change; it can't make overlapping ranges work.", fr: "Une synchronisation actualise un peering après une modification d'espace d'adressage ; elle ne peut pas faire fonctionner des plages qui se chevauchent." }
    references:
      - title: Create, Change, or Delete Azure Virtual Network Peering
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering
      - title: Network connectivity options in Azure with SAP RISE
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network

  # ------------------------------------------------------------------ 2
  - id: az120-qz-13-02
    objective: "1.3.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam, Inc. runs SAP S/4HANA Cloud, private edition in RISE with SAP on Azure. The Microsoft Sentinel solution for SAP applications already sends the SAP security audit log of the landscape to Microsoft Sentinel. The security analysts work in the Microsoft Defender portal.

        The analysts want an AI-generated summary and recommendations for each SAP incident, directly in the portal they already use.

        What should you recommend?
      fr: |
        Fabrikam, Inc. exécute SAP S/4HANA Cloud, private edition dans RISE with SAP sur Azure. La solution Microsoft Sentinel pour les applications SAP envoie déjà le journal d'audit de sécurité SAP du paysage à Microsoft Sentinel. Les analystes de sécurité travaillent dans le portail Microsoft Defender.

        Les analystes veulent un résumé et des recommandations générés par l'IA pour chaque incident SAP, directement dans le portail qu'ils utilisent déjà.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "The SAP LogServ service, connected to Microsoft Sentinel", fr: "Le service SAP LogServ, connecté à Microsoft Sentinel" } }
        - { id: b, text: { en: "Microsoft Security Copilot, embedded in Microsoft Defender XDR", fr: "Microsoft Security Copilot, intégré à Microsoft Defender XDR" } }
        - { id: c, text: { en: "Azure Monitor for SAP solutions, with a NetWeaver provider", fr: "Azure Monitor pour solutions SAP, avec un fournisseur NetWeaver" } }
        - { id: d, text: { en: "Microsoft Entra ID Governance, integrated with SAP Cloud Identity Services", fr: "Microsoft Entra ID Governance, intégré à SAP Cloud Identity Services" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Security Copilot works with any data source that Defender XDR and Microsoft Sentinel support, including SAP RISE. Its experience is embedded in the Defender portal, with an AI-generated summary and recommendations for SAP incidents, so the analysts stay in their current tool.
        fr: |
          Security Copilot fonctionne avec toute source de données prise en charge par Defender XDR et Microsoft Sentinel, y compris SAP RISE. Son expérience est intégrée au portail Defender, avec un résumé et des recommandations générés par l'IA pour les incidents SAP : les analystes restent dans leur outil actuel.
      options:
        a: { en: "LogServ delivers the RISE infrastructure and operating system logs; it doesn't summarize incidents.", fr: "LogServ fournit les journaux d'infrastructure et d'OS de RISE ; il ne résume pas les incidents." }
        c: { en: "Azure Monitor for SAP solutions doesn't support RISE, and it monitors performance rather than security incidents.", fr: "Azure Monitor pour solutions SAP ne prend pas en charge RISE, et il supervise les performances plutôt que les incidents de sécurité." }
        d: { en: "Entra ID Governance manages SAP user lifecycle and authorizations; it doesn't analyze security incidents.", fr: "Entra ID Governance gère le cycle de vie et les autorisations des utilisateurs SAP ; il n'analyse pas les incidents de sécurité." }
    references:
      - title: Identity and security in Azure with SAP RISE
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-security

  # ------------------------------------------------------------------ 3
  - id: az120-qz-13-03
    objective: "1.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys runs SAP S/4HANA in RISE with SAP on Azure. The RISE virtual network is peered with the Wingtip hub. Wingtip doesn't use any firewall or network virtual appliance in Azure.

        An integration application on Wingtip VMs in a subnet of the hub reads S/4HANA data and sends it to a partner REST API on the internet. The partner allows calls from a single static public IP address only. The solution must minimize administrative effort.

        What should you include in the design?
      fr: |
        Wingtip Toys exécute SAP S/4HANA dans RISE with SAP sur Azure. Le réseau virtuel RISE est relié par peering au hub de Wingtip. Wingtip n'utilise aucun pare-feu ni appliance virtuelle réseau dans Azure.

        Une application d'intégration, sur des machines virtuelles de Wingtip dans un sous-réseau du hub, lit des données S/4HANA et les envoie à une API REST d'un partenaire sur internet. Le partenaire n'accepte que les appels provenant d'une seule adresse IP publique statique. La solution doit réduire au minimum l'effort administratif.

        Que devez-vous inclure dans la conception ?
    body:
      options:
        - { id: a, text: { en: "A request to SAP to enable outbound internet access in RISE and to route the VMs' traffic through it", fr: "Une demande à SAP d'activer l'accès internet sortant dans RISE et d'y faire passer le trafic des machines virtuelles" } }
        - { id: b, text: { en: "A Standard SKU public IP address assigned to the network interface of each integration VM", fr: "Une adresse IP publique de référence SKU Standard attribuée à l'interface réseau de chaque machine virtuelle d'intégration" } }
        - { id: c, text: { en: "An Azure Application Gateway in the hub that publishes the integration application", fr: "Une instance Azure Application Gateway dans le hub qui publie l'application d'intégration" } }
        - { id: d, text: { en: "A NAT gateway with one static public IP address, associated with the subnet of the integration VMs", fr: "Une passerelle NAT avec une adresse IP publique statique, associée au sous-réseau des machines virtuelles d'intégration" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          With RISE, your own applications reach the internet through your own services, such as Azure Firewall or a NAT gateway. A NAT gateway on the subnet sends all the outbound traffic of the VMs through its static public IP address, which is the single address the partner can allow, without any appliance to operate.
        fr: |
          Avec RISE, vos propres applications atteignent internet par vos propres services, comme le Pare-feu Azure ou une passerelle NAT. Une passerelle NAT sur le sous-réseau fait sortir tout le trafic des machines virtuelles par son adresse IP publique statique, l'adresse unique que le partenaire peut autoriser, sans appliance à exploiter.
      options:
        a: { en: "The internet path of RISE stays inside the SAP-managed network and doesn't carry the traffic of the customer's own virtual networks.", fr: "Le chemin internet de RISE reste dans le réseau géré par SAP et ne transporte pas le trafic des réseaux virtuels du client." }
        b: { en: "Each VM would leave the network with its own address, so the partner would receive calls from several IP addresses.", fr: "Chaque machine virtuelle sortirait avec sa propre adresse : le partenaire recevrait des appels de plusieurs adresses IP." }
        c: { en: "Application Gateway handles inbound HTTP(S) traffic to published applications; it doesn't provide outbound connectivity for VMs.", fr: "Application Gateway traite le trafic HTTP(S) entrant vers des applications publiées ; il ne fournit pas de connectivité sortante aux machines virtuelles." }
    references:
      - title: Network connectivity options in Azure with SAP RISE
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network

  # ------------------------------------------------------------------ 4
  - id: az120-qz-13-04
    objective: "1.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank runs SAP S/4HANA in RISE with SAP on Azure. The SAP HANA database grows by about 30 % each year, which forces a move to a larger and more expensive VM size.

        Finance documents older than three years must leave the database, but they must stay accessible from S/4HANA and be kept for 10 years under the company's retention rules. The removed documents must be stored in a Woodgrove Azure subscription.

        What should you recommend?
      fr: |
        Woodgrove Bank exécute SAP S/4HANA dans RISE with SAP sur Azure. La base de données SAP HANA grossit d'environ 30 % par an, ce qui impose de passer à une taille de machine virtuelle plus grande et plus chère.

        Les documents financiers de plus de trois ans doivent sortir de la base de données, mais rester accessibles depuis S/4HANA et être conservés 10 ans selon les règles de rétention de l'entreprise. Les documents retirés doivent être stockés dans un abonnement Azure de Woodgrove.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "Archive the documents with SAP ILM, and store them through the ILM Store in Azure Blob Storage", fr: "Archiver les documents avec SAP ILM, et les stocker via l'ILM Store dans le Stockage Blob Azure" } }
        - { id: b, text: { en: "Protect the HANA database with Azure Backup, and keep monthly recovery points for 10 years", fr: "Protéger la base HANA avec Sauvegarde Azure, et conserver des points de récupération mensuels pendant 10 ans" } }
        - { id: c, text: { en: "Copy the documents with the SAP table connector to Azure Data Lake Storage Gen2", fr: "Copier les documents avec le connecteur SAP table vers Azure Data Lake Storage Gen2" } }
        - { id: d, text: { en: "Ask SAP to place the /hana/data volume on larger Premium SSD v2 disks", fr: "Demander à SAP de placer le volume /hana/data sur des disques Premium SSD v2 plus grands" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          SAP Information Lifecycle Management manages data volumes and retention, and its ILM Store can keep the archive files and attachments of S/4HANA in an Azure Blob Storage account. Archiving moves the old data out of HANA, which keeps the memory, and so the VM size, under control, while ILM applies the retention rules and keeps the documents accessible.
        fr: |
          SAP Information Lifecycle Management gère les volumes de données et la rétention, et son ILM Store peut conserver les fichiers d'archive et les pièces jointes de S/4HANA dans un compte de Stockage Blob Azure. L'archivage sort les anciennes données de HANA, ce qui maîtrise la mémoire, donc la taille de la machine virtuelle, tandis qu'ILM applique les règles de rétention et garde les documents accessibles.
      options:
        b: { en: "A backup copies the whole database and leaves the data in HANA, so memory keeps growing; Woodgrove also has no access to the RISE VMs.", fr: "Une sauvegarde copie toute la base et laisse les données dans HANA : la mémoire continue de grossir ; Woodgrove n'a d'ailleurs pas accès aux machines virtuelles RISE." }
        c: { en: "The SAP table connector only reads data: it removes nothing from HANA and applies no SAP retention rules.", fr: "Le connecteur SAP table ne fait que lire des données : il ne retire rien de HANA et n'applique aucune règle de rétention SAP." }
        d: { en: "HANA keeps its data in memory, so a larger disk doesn't reduce the memory, and the VM size, that the database needs.", fr: "HANA conserve ses données en mémoire : un disque plus grand ne réduit pas la mémoire, ni donc la taille de machine virtuelle, dont la base a besoin." }
    references:
      - title: SAP Information Lifecycle Management with Microsoft Azure Blob Storage
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/sap-information-lifecycle-management

  # ------------------------------------------------------------------ 5
  - id: az120-qz-13-05
    objective: "1.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys delegated the subdomain **ecs.tailspintoys.com** to the two SAP DNS servers in its RISE with SAP virtual network, which is peered with the Tailspin hub. The hub contains two VMs that run the DNS servers of Tailspin, and every Tailspin virtual network uses them.

        The DNS team refuses to keep a copy of the SAP-managed zone on its servers. Azure services in the Tailspin virtual networks must still resolve the RISE host names.

        What should you configure?
      fr: |
        Tailspin Toys a délégué le sous-domaine **ecs.tailspintoys.com** aux deux serveurs DNS SAP de son réseau virtuel RISE with SAP, relié par peering au hub de Tailspin. Le hub contient deux machines virtuelles qui exécutent les serveurs DNS de Tailspin, et tous les réseaux virtuels de Tailspin les utilisent.

        L'équipe DNS refuse de conserver une copie de la zone gérée par SAP sur ses serveurs. Les services Azure des réseaux virtuels de Tailspin doivent tout de même résoudre les noms d'hôte RISE.

        Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "An Azure private DNS zone for ecs.tailspintoys.com, replicated from the SAP DNS servers", fr: "Une zone DNS privée Azure pour ecs.tailspintoys.com, répliquée depuis les serveurs DNS SAP" } }
        - { id: b, text: { en: "A forwarder on the hub DNS servers that sends ecs.tailspintoys.com queries to the SAP DNS servers", fr: "Un redirecteur sur les serveurs DNS du hub qui envoie les requêtes ecs.tailspintoys.com aux serveurs DNS SAP" } }
        - { id: c, text: { en: "A virtual network link from the RISE virtual network to an Azure private DNS zone of Tailspin", fr: "Une liaison de réseau virtuel du réseau virtuel RISE vers une zone DNS privée Azure de Tailspin" } }
        - { id: d, text: { en: "A public Azure DNS zone for ecs.tailspintoys.com that contains the RISE host records", fr: "Une zone Azure DNS publique pour ecs.tailspintoys.com qui contient les enregistrements des hôtes RISE" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Zone transfer to your DNS servers is the primary method, but Microsoft documents an optional DNS forwarder in your virtual networks that pushes the queries for the delegated zone to the SAP DNS servers. The hub servers keep no copy of the zone, and every network that uses them resolves the RISE names through the peering.
        fr: |
          Le transfert de zone vers vos serveurs DNS est la méthode principale, mais Microsoft documente un redirecteur DNS facultatif dans vos réseaux virtuels, qui transmet aux serveurs DNS SAP les requêtes de la zone déléguée. Les serveurs du hub ne gardent aucune copie de la zone, et chaque réseau qui les utilise résout les noms RISE par le peering.
      options:
        a: { en: "Azure private DNS zones don't support zone transfer, and replicating the zone would be the copy that the DNS team refuses.", fr: "Les zones DNS privées Azure ne prennent pas en charge le transfert de zone, et répliquer la zone serait la copie que l'équipe DNS refuse." }
        c: { en: "The RISE network is in SAP's subscription, which only SAP manages, and the RISE records are created by the SAP DNS servers, not in a Tailspin zone.", fr: "Le réseau RISE se trouve dans l'abonnement de SAP, que seul SAP gère, et les enregistrements RISE sont créés par les serveurs DNS SAP, pas dans une zone de Tailspin." }
        d: { en: "SAP typically doesn't support external DNS providers for the delegated zone, and the private addresses of RISE would be published.", fr: "SAP ne prend généralement pas en charge de fournisseur DNS externe pour la zone déléguée, et les adresses privées de RISE seraient publiées." }
    references:
      - title: Network connectivity options in Azure with SAP RISE
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network

  # ------------------------------------------------------------------ 6
  - id: az120-qz-13-06
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware, Inc. is moving to RISE with SAP on Azure. Its security policy requires that only one Proseware subnet communicates with the RISE landscape and that SAP segments the RISE tiers with firewalls. Proseware subscribes to the optional SAP-managed Firewall as a Service (FWaaS).

        The design uses subnet peering between a RISE firewall subnet and a Proseware hub subnet that hosts a Proseware network virtual appliance (NVA). The spokes of Proseware reach RISE through the hub.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware, Inc. passe à RISE with SAP sur Azure. Sa stratégie de sécurité exige qu'un seul sous-réseau de Proseware communique avec le paysage RISE et que SAP segmente les niveaux RISE avec des pare-feu. Proseware souscrit au service facultatif Firewall as a Service (FWaaS) géré par SAP.

        La conception utilise un peering de sous-réseaux entre un sous-réseau de pare-feu RISE et un sous-réseau du hub de Proseware qui héberge une appliance virtuelle réseau (NVA) de Proseware. Les spokes de Proseware atteignent RISE par le hub.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "After FWaaS goes live, Proseware can remove its own NVA, because the SAP-managed firewall inspects all the traffic between Proseware and RISE.", fr: "Une fois FWaaS en service, Proseware peut retirer sa propre NVA, car le pare-feu géré par SAP inspecte tout le trafic entre Proseware et RISE." } }
        - { id: s2, text: { en: "Traffic from a Proseware spoke to RISE must be routed through the NVA in the subnet that takes part in the subnet peering.", fr: "Le trafic d'un spoke de Proseware vers RISE doit être routé par la NVA du sous-réseau qui participe au peering de sous-réseaux." } }
        - { id: s3, text: { en: "Proseware can review the logs and audit trail of the SAP-managed firewall through the RISE LogServ service.", fr: "Proseware peut consulter les journaux et la piste d'audit du pare-feu géré par SAP via le service RISE LogServ." } }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          FWaaS complements the firewalls that the customer operates in its own subscription; it doesn't replace them, and each NVA is configured as the primary route target for all RISE communication. Unlike full virtual network peering, subnet peering only lets the selected subnets communicate, so the spokes reach RISE through the NVA of the peered subnet. The logs and audit trail of FWaaS are available through RISE LogServ.
        fr: |
          FWaaS complète les pare-feu que le client exploite dans son propre abonnement ; il ne les remplace pas, et chaque NVA est configurée comme cible de routage principale de toute la communication RISE. Contrairement à un peering de réseaux virtuels complet, le peering de sous-réseaux ne laisse communiquer que les sous-réseaux choisis : les spokes atteignent donc RISE par la NVA du sous-réseau relié par peering. Les journaux et la piste d'audit de FWaaS sont disponibles via RISE LogServ.
      options:
        s1: { en: "The architecture relies on the Proseware NVA as the route target on the Proseware side; the SAP firewall protects the RISE side only.", fr: "L'architecture s'appuie sur la NVA de Proseware comme cible de routage côté Proseware ; le pare-feu SAP ne protège que le côté RISE." }
    references:
      - title: Network connectivity options in Azure with SAP RISE
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network

  # ------------------------------------------------------------------ 7
  - id: az120-qz-13-07
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Adatum Corporation runs SAP S/4HANA in RISE with SAP on Azure. The RISE virtual network is peered with the Adatum hub, and the peering status is **Connected** on both sides. A self-hosted integration runtime runs on two VMs in a subnet of the hub. It copies S/4HANA tables over RFC for Azure Data Factory.

        Since a change window last weekend, the pipelines fail with RFC connection timeouts. Adatum can't tell yet whether the cause is on its side or on the SAP side.

        You need to start the troubleshooting by following the shared responsibility model of RISE.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum Corporation exécute SAP S/4HANA dans RISE with SAP sur Azure. Le réseau virtuel RISE est relié par peering au hub d'Adatum, et l'état du peering est **Connected** des deux côtés. Un runtime d'intégration auto-hébergé s'exécute sur deux machines virtuelles d'un sous-réseau du hub. Il copie des tables S/4HANA en RFC pour Azure Data Factory.

        Depuis une fenêtre de modification le week-end dernier, les pipelines échouent avec des expirations de connexion RFC. Adatum ne sait pas encore si la cause se trouve de son côté ou du côté de SAP.

        Vous devez commencer le dépannage en respectant le modèle de responsabilité partagée de RISE.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Check the NSG rules and routes of the runtime subnet, and open any Azure support case from an Adatum subscription.", fr: "Vérifier les règles NSG et les itinéraires du sous-réseau du runtime, et ouvrir toute demande de support Azure depuis un abonnement d'Adatum." } }
        - { id: b, text: { en: "Open an Azure support case about the RISE application server VMs, and give the ID of the SAP subscription.", fr: "Ouvrir une demande de support Azure sur les machines virtuelles des serveurs d'applications RISE, en donnant l'ID de l'abonnement SAP." } }
        - { id: c, text: { en: "Contact SAP so that SAP checks the RISE side, such as the NSG rules and the RFC ports of the RISE network.", fr: "Contacter SAP afin que SAP vérifie le côté RISE, comme les règles NSG et les ports RFC du réseau RISE." } }
        - { id: d, text: { en: "Run the connection troubleshoot of Network Watcher from a RISE application server VM to the runtime VMs.", fr: "Exécuter la résolution des problèmes de connexion de Network Watcher depuis une machine virtuelle de serveur d'applications RISE vers les machines virtuelles du runtime." } }
        - { id: e, text: { en: "Register the S/4HANA system in Azure Center for SAP solutions, and review its quality checks for the network.", fr: "Inscrire le système S/4HANA dans le Centre Azure pour les solutions SAP, et consulter ses contrôles de qualité du réseau." } }
    answer: { optionIds: [ a, c ] }
    explanation:
      correct:
        en: |
          Adatum deploys and operates the self-hosted integration runtime, its subnet and its NSGs, and an Azure support case covers only the resources of Adatum's own subscriptions. Issues with resources that SAP operates in its subscriptions, such as the RISE network and its NSGs, go to SAP: each side troubleshoots its own part, with no crossed responsibilities.
        fr: |
          Adatum déploie et exploite le runtime d'intégration auto-hébergé, son sous-réseau et ses NSG, et une demande de support Azure ne couvre que les ressources des propres abonnements d'Adatum. Les problèmes des ressources que SAP exploite dans ses abonnements, comme le réseau RISE et ses NSG, relèvent de SAP : chaque partie dépanne sa propre part, sans responsabilités croisées.
      options:
        b: { en: "When you engage Azure support, only resources in your own subscriptions are in scope; SAP handles the resources of its subscriptions.", fr: "Quand vous sollicitez le support Azure, seules les ressources de vos propres abonnements sont concernées ; SAP traite les ressources de ses abonnements." }
        d: { en: "The RISE VMs are visible to and managed by SAP only, so Adatum can't run a test from them.", fr: "Les machines virtuelles RISE ne sont visibles et gérées que par SAP : Adatum ne peut pas lancer de test depuis elles." }
        e: { en: "RISE doesn't support any integration with Azure Center for SAP solutions.", fr: "RISE ne prend en charge aucune intégration avec le Centre Azure pour les solutions SAP." }
    references:
      - title: Integrating Azure with SAP RISE
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration
      - title: Integrating Azure services with SAP RISE
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-services

  # ------------------------------------------------------------------ 8
  - id: az120-qz-13-08
    objective: "1.3.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank's SAP landscape runs in RISE with SAP on Azure. It contains SAP S/4HANA, an SAP BW 7.5 system on SAP HANA, and an SAP ECC 6.0 EHP 8 system that hasn't been converted yet. The RISE virtual network is peered with the Woodgrove hub.

        SAP opened RFC and HTTPS through the peering and published the ECC OData services on a public HTTPS endpoint of its application gateway. SAP declined direct database access to HANA.

        You are designing three Azure Data Factory copy flows. The ECC flow must run without any compute that Woodgrove manages.

        What should you use for each flow? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Le paysage SAP de Woodgrove Bank s'exécute dans RISE with SAP sur Azure. Il contient SAP S/4HANA, un système SAP BW 7.5 sur SAP HANA et un système SAP ECC 6.0 EHP 8 pas encore converti. Le réseau virtuel RISE est relié par peering au hub de Woodgrove.

        SAP a ouvert RFC et HTTPS par le peering et a publié les services OData d'ECC sur un point de terminaison HTTPS public de sa passerelle d'application. SAP a refusé l'accès direct à la base de données HANA.

        Vous concevez trois flux de copie Azure Data Factory. Le flux ECC doit s'exécuter sans aucun calcul géré par Woodgrove.

        Que devez-vous utiliser pour chaque flux ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Open Hub destination of the BW system: [[oh]]

          OData entities of the ECC system: [[ecc]]

          Table ACDOCA of S/4HANA: [[tbl]]
        fr: |
          Destination Open Hub du système BW : [[oh]]

          Entités OData du système ECC : [[ecc]]

          Table ACDOCA de S/4HANA : [[tbl]]
      slots:
        - id: oh
          options:
            - { id: shir, text: { en: "SAP BW Open Hub connector on a self-hosted IR in the hub", fr: "Connecteur SAP BW Open Hub sur un runtime d'intégration auto-hébergé dans le hub" } }
            - { id: ohaz, text: { en: "SAP BW Open Hub connector on an Azure IR through the SAP application gateway", fr: "Connecteur SAP BW Open Hub sur un runtime d'intégration Azure via la passerelle d'application SAP" } }
            - { id: mvnet, text: { en: "SAP BW Open Hub connector on an Azure IR in a managed virtual network", fr: "Connecteur SAP BW Open Hub sur un runtime d'intégration Azure dans un réseau virtuel managé" } }
        - id: ecc
          options:
            - { id: shirsap, text: { en: "SAP ECC connector on a self-hosted IR installed on the ECC application server", fr: "Connecteur SAP ECC sur un runtime d'intégration auto-hébergé installé sur le serveur d'applications ECC" } }
            - { id: azgw, text: { en: "SAP ECC connector on an Azure IR, over HTTPS to the SAP application gateway", fr: "Connecteur SAP ECC sur un runtime d'intégration Azure, en HTTPS vers la passerelle d'application SAP" } }
            - { id: mpe, text: { en: "SAP ECC connector on an Azure IR, with a managed private endpoint to ECC", fr: "Connecteur SAP ECC sur un runtime d'intégration Azure, avec un point de terminaison privé managé vers ECC" } }
        - id: tbl
          options:
            - { id: hana, text: { en: "SAP HANA connector on a self-hosted IR in the hub", fr: "Connecteur SAP HANA sur un runtime d'intégration auto-hébergé dans le hub" } }
            - { id: tblaz, text: { en: "SAP table connector on an Azure IR through the SAP application gateway", fr: "Connecteur SAP table sur un runtime d'intégration Azure via la passerelle d'application SAP" } }
            - { id: tbl, text: { en: "SAP table connector on a self-hosted IR in the hub", fr: "Connecteur SAP table sur un runtime d'intégration auto-hébergé dans le hub" } }
    answer:
      values: { oh: shir, ecc: azgw, tbl: tbl }
    explanation:
      correct:
        en: |
          The SAP BW Open Hub and SAP table connectors use the SAP .NET connector and SAP function modules over RFC, and they run only on a self-hosted integration runtime, which reaches RISE through the peering with private addresses. The SAP ECC connector also works with the Azure integration runtime, which reaches RISE over HTTPS on the public IP address that SAP exposes through its application gateway, so no Woodgrove compute is needed. Without direct database access, the SAP HANA connector isn't an option.
        fr: |
          Les connecteurs SAP BW Open Hub et SAP table utilisent le connecteur SAP .NET et des modules fonction SAP en RFC, et ils ne s'exécutent que sur un runtime d'intégration auto-hébergé, qui atteint RISE par le peering en adresses privées. Le connecteur SAP ECC fonctionne aussi avec le runtime d'intégration Azure, qui atteint RISE en HTTPS sur l'adresse IP publique que SAP expose par sa passerelle d'application : aucun calcul de Woodgrove n'est nécessaire. Sans accès direct à la base de données, le connecteur SAP HANA n'est pas envisageable.
      options:
        ohaz: { en: "The SAP BW Open Hub connector supports only the self-hosted IR: no Azure IR option exists for it.", fr: "Le connecteur SAP BW Open Hub ne prend en charge que le runtime d'intégration auto-hébergé : aucune option de runtime d'intégration Azure n'existe pour lui." }
        mvnet: { en: "A managed virtual network still runs an Azure IR, which the Open Hub connector doesn't support, and SAP offers no private endpoint to reach.", fr: "Un réseau virtuel managé exécute toujours un runtime d'intégration Azure, que le connecteur Open Hub ne prend pas en charge, et SAP ne propose aucun point de terminaison privé à atteindre." }
        tblaz: { en: "The SAP table connector supports only the self-hosted IR, and the application gateway publishes HTTPS services, not RFC.", fr: "Le connecteur SAP table ne prend en charge que le runtime d'intégration auto-hébergé, et la passerelle d'application publie des services HTTPS, pas RFC." }
        mpe: { en: "SAP generally doesn't offer private endpoints to RISE workloads, so a managed private endpoint has no target.", fr: "SAP ne propose en général pas de points de terminaison privés vers les charges de travail RISE : un point de terminaison privé managé n'a pas de cible." }
        shirsap: { en: "The ECC application servers run in SAP's subscription, where Woodgrove can't install anything; the flow must also avoid Woodgrove compute.", fr: "Les serveurs d'applications ECC s'exécutent dans l'abonnement de SAP, où Woodgrove ne peut rien installer ; le flux doit en outre éviter tout calcul de Woodgrove." }
        hana: { en: "The ODBC/JDBC connector for HANA requires direct database access agreed with SAP, which SAP declined.", fr: "Le connecteur ODBC/JDBC pour HANA exige un accès direct à la base de données convenu avec SAP, que SAP a refusé." }
    references:
      - title: Integrating Azure services with SAP RISE
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-services
      - title: Copy data from SAP Business Warehouse via Open Hub - Azure Data Factory & Azure Synapse
        url: https://learn.microsoft.com/en-us/azure/data-factory/connector-sap-business-warehouse-open-hub

  # ------------------------------------------------------------------ 9
  - id: az120-qz-13-09
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Northwind Traders signed a RISE with SAP contract. SAP hasn't deployed the RISE virtual network yet. Northwind has a hub virtual network named **vnet-hub** that contains two VMs that run Active Directory-integrated DNS for all Northwind networks. The guest users and network permissions that a cross-tenant peering needs are already in place in both tenants, and the Northwind DNS team has prepared the delegation of **ecs.northwind.com** to SAP.

        You need to connect vnet-hub to RISE and make the RISE host names resolvable by the Northwind DNS servers.

        Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Northwind Traders a signé un contrat RISE with SAP. SAP n'a pas encore déployé le réseau virtuel RISE. Northwind dispose d'un réseau virtuel hub nommé **vnet-hub** qui contient deux machines virtuelles exécutant le DNS intégré à Active Directory pour tous les réseaux de Northwind. Les utilisateurs invités et les autorisations réseau qu'exige un peering entre locataires sont déjà en place dans les deux locataires, et l'équipe DNS de Northwind a préparé la délégation de **ecs.northwind.com** à SAP.

        Vous devez relier vnet-hub à RISE et rendre les noms d'hôte RISE résolubles par les serveurs DNS de Northwind.

        Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 4
      actions:
        - { id: plan, text: { en: "Agree with SAP on a RISE address space that doesn't overlap Northwind ranges, and on the ports to open.", fr: "Convenir avec SAP d'un espace d'adressage RISE qui ne chevauche pas les plages de Northwind, et des ports à ouvrir." } }
        - { id: create, text: { en: "Create the peering on vnet-hub by using the Azure resource ID of the RISE virtual network.", fr: "Créer le peering sur vnet-hub à l'aide de l'ID de ressource Azure du réseau virtuel RISE." } }
        - { id: approve, text: { en: "Have SAP approve the peering on the RISE side, and check that both sides show Connected.", fr: "Faire approuver le peering par SAP côté RISE, et vérifier que les deux côtés affichent Connected." } }
        - { id: xfer, text: { en: "Create a secondary zone for ecs.northwind.com on the Northwind DNS servers, fed by zone transfer from SAP.", fr: "Créer une zone secondaire pour ecs.northwind.com sur les serveurs DNS de Northwind, alimentée par transfert de zone depuis SAP." } }
        - { id: pdns, text: { en: "Create an Azure private DNS zone for ecs.northwind.com, and link it to vnet-hub to receive the zone from SAP.", fr: "Créer une zone DNS privée Azure pour ecs.northwind.com, puis la lier à vnet-hub pour recevoir la zone depuis SAP." } }
        - { id: ergw, text: { en: "Ask SAP to deploy an ExpressRoute gateway in the RISE network that uses the Northwind circuit.", fr: "Demander à SAP de déployer dans le réseau RISE une passerelle ExpressRoute qui utilise le circuit de Northwind." } }
        - { id: pe, text: { en: "Create private endpoints in vnet-hub for the two SAP DNS servers of the RISE network.", fr: "Créer dans vnet-hub des points de terminaison privés pour les deux serveurs DNS SAP du réseau RISE." } }
    answer:
      sequence: [ plan, create, approve, xfer ]
    explanation:
      correct:
        en: |
          The address space and ports are agreed before SAP deploys the RISE network, because peered networks can't overlap. You then create the peering with the resource ID that SAP provides; it works only after SAP approves it and both sides are Connected. Zone transfer from the SAP DNS servers, which hold the master role for the delegated zone, needs that private connectivity, so the secondary zone on the AD DS DNS servers comes last.
        fr: |
          L'espace d'adressage et les ports se conviennent avant que SAP déploie le réseau RISE, car des réseaux reliés par peering ne peuvent pas se chevaucher. Vous créez ensuite le peering avec l'ID de ressource fourni par SAP ; il ne fonctionne qu'après l'approbation de SAP, quand les deux côtés sont Connected. Le transfert de zone depuis les serveurs DNS SAP, principaux de la zone déléguée, a besoin de cette connectivité privée : la zone secondaire sur les serveurs DNS AD DS vient donc en dernier.
      options:
        pdns: { en: "Azure private DNS zones don't support zone transfer, so they can't receive the zone from the SAP DNS servers.", fr: "Les zones DNS privées Azure ne prennent pas en charge le transfert de zone : elles ne peuvent pas recevoir la zone des serveurs DNS SAP." }
        ergw: { en: "The task doesn't need on-premises access; such a connection would also reach only the SAP network.", fr: "La tâche n'exige pas d'accès local ; une telle connexion n'atteindrait en outre que le réseau SAP." }
        pe: { en: "SAP generally doesn't offer private endpoints, and the peering already gives private access to the SAP DNS servers.", fr: "SAP ne propose en général pas de points de terminaison privés, et le peering donne déjà un accès privé aux serveurs DNS SAP." }
    references:
      - title: Network connectivity options in Azure with SAP RISE
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-network
      - title: Create, Change, or Delete Azure Virtual Network Peering
        url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-manage-peering

  # ------------------------------------------------------------------ 10
  - id: az120-qz-13-10
    objective: "1.3.5"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso, Ltd. runs SAP S/4HANA Cloud, private edition in RISE with SAP on Azure and uses SAP BTP in a Cloud Foundry environment, with one global account and two subaccounts. In November 2026, the Microsoft Sentinel solution for SAP applications already ingests the SAP security audit log of S/4HANA through the agentless data connector.

        The security team adds two requirements:

        - The operating system logs of the RISE VMs must be analyzed in Microsoft Sentinel.
        - The audit logs of the global account and of both subaccounts must be analyzed in Microsoft Sentinel.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso, Ltd. exécute SAP S/4HANA Cloud, private edition dans RISE with SAP sur Azure et utilise SAP BTP dans un environnement Cloud Foundry, avec un compte global et deux sous-comptes. En novembre 2026, la solution Microsoft Sentinel pour les applications SAP ingère déjà le journal d'audit de sécurité SAP de S/4HANA via le connecteur de données sans agent.

        L'équipe de sécurité ajoute deux exigences :

        - Les journaux du système d'exploitation des machines virtuelles RISE doivent être analysés dans Microsoft Sentinel.
        - Les journaux d'audit du compte global et des deux sous-comptes doivent être analysés dans Microsoft Sentinel.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Deploy the containerized SAP data connector agent on a Linux VM in the hub to collect the OS logs.", fr: "Déployer l'agent conteneurisé du connecteur de données SAP sur une machine virtuelle Linux du hub pour collecter les journaux d'OS." } }
        - { id: b, text: { en: "Subscribe to the SAP LogServ service, and connect it to the Microsoft Sentinel workspace.", fr: "Souscrire au service SAP LogServ, puis le connecter à l'espace de travail Microsoft Sentinel." } }
        - { id: c, text: { en: "Ask SAP to install the Azure Monitor Agent with a data collection rule on the RISE VMs.", fr: "Demander à SAP d'installer l'Azure Monitor Agent avec une règle de collecte de données sur les machines virtuelles RISE." } }
        - { id: d, text: { en: "Add the BTP subaccounts as SAP systems in the agentless data connector that already exists.", fr: "Ajouter les sous-comptes BTP comme systèmes SAP dans le connecteur de données sans agent existant." } }
        - { id: e, text: { en: "Deploy the Microsoft Sentinel solution for SAP BTP, and add the global account and each subaccount.", fr: "Déployer la solution Microsoft Sentinel pour SAP BTP, puis ajouter le compte global et chaque sous-compte." } }
    answer: { optionIds: [ b, e ] }
    explanation:
      correct:
        en: |
          Under the RISE shared responsibility model, the Sentinel solution for SAP applications covers the SAP application layer only; RISE infrastructure and OS logs are available only through the optional SAP LogServ service, which natively integrates with Microsoft Sentinel. BTP is covered by the Microsoft Sentinel solution for SAP BTP, which reads the Audit Log Management Service; you configure the connector for each subaccount and also for the global account, whose audits don't include the subaccounts.
        fr: |
          Selon le modèle de responsabilité partagée de RISE, la solution Sentinel pour les applications SAP ne couvre que la couche application SAP ; les journaux d'infrastructure et d'OS de RISE ne sont disponibles que par le service facultatif SAP LogServ, qui s'intègre nativement à Microsoft Sentinel. BTP est couvert par la solution Microsoft Sentinel pour SAP BTP, qui lit l'Audit Log Management Service ; vous configurez le connecteur pour chaque sous-compte et aussi pour le compte global, dont les audits n'incluent pas les sous-comptes.
      options:
        a: { en: "The containerized agent retired on September 14, 2026, and it read SAP application logs, never the OS logs of RISE.", fr: "L'agent conteneurisé a été retiré le 14 septembre 2026, et il lisait des journaux d'application SAP, jamais les journaux d'OS de RISE." }
        c: { en: "Customers integrate only the SAP application layer; the OS logs of RISE are offered through LogServ, not through agents on SAP's VMs.", fr: "Le client n'intègre que la couche application SAP ; les journaux d'OS de RISE sont proposés par LogServ, pas par des agents sur les machines virtuelles de SAP." }
        d: { en: "The agentless connector of the SAP applications solution collects NetWeaver-based systems; BTP needs its own solution and connector.", fr: "Le connecteur sans agent de la solution pour les applications SAP collecte les systèmes basés sur NetWeaver ; BTP a besoin de sa propre solution et de son propre connecteur." }
    references:
      - title: Identity and security in Azure with SAP RISE
        url: https://learn.microsoft.com/en-us/azure/sap/workloads/rise-integration-security
      - title: Deploy Microsoft Sentinel solution for SAP BTP
        url: https://learn.microsoft.com/en-us/azure/sentinel/sap/deploy-sap-btp-solution
