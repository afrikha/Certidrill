id: dvac03-1a-canary-api-change
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is changing the request validation and the mapping templates of its production REST API in Amazon API Gateway. It wants to send 10% of the prod stage traffic to the new API deployment, compare the metrics, and then promote or roll back the change, without asking clients to change URLs.

    Which solution will meet these requirements?
  fr: |
    Une entreprise modifie la validation des requêtes et les modèles de mappage de son API REST de production dans Amazon API Gateway. Elle veut envoyer 10 % du trafic de l'étape prod vers le nouveau déploiement de l'API, comparer les métriques, puis promouvoir ou annuler la modification, sans demander aux clients de changer d'URL.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a stage named v2 for the new deployment and ask 10% of the clients to call it.", fr: "Créer une étape nommée v2 pour le nouveau déploiement et demander à 10 % des clients de l'appeler." }
    - id: b
      text: { en: "Enable a canary release on the prod stage that sends 10% of the traffic to the new deployment.", fr: "Activer une version canari sur l'étape prod qui envoie 10 % du trafic vers le nouveau déploiement." }
    - id: c
      text: { en: "Create a Lambda alias with weighted routing that sends 10% of invocations to a new function version.", fr: "Créer un alias Lambda avec un routage pondéré qui envoie 10 % des invocations vers une nouvelle version de la fonction." }
    - id: d
      text: { en: "Move the API to an HTTP API and use automatic deployments for the new configuration.", fr: "Migrer l'API vers une API HTTP et utiliser les déploiements automatiques pour la nouvelle configuration." }
answer: { optionId: b }
explanation:
  correct:
    en: "A canary release deploys a new API version alongside the production release on the same stage, and percentTraffic sends a random share of requests to it. Canary requests have their own logs and metrics; when they look good, the canary is promoted, otherwise it is removed."
    fr: "Une version canari déploie une nouvelle version de l'API à côté de la version de production sur la même étape, et percentTraffic lui envoie une part aléatoire des requêtes. Les requêtes du canari ont leurs propres journaux et métriques ; si elles sont satisfaisantes, le canari est promu, sinon il est supprimé."
  options:
    a:
      en: "A separate stage has its own URL, so clients would have to change URLs, which the company wants to avoid."
      fr: "Une étape distincte a sa propre URL : les clients devraient changer d'URL, ce que l'entreprise veut éviter."
    c:
      en: "A weighted alias tests a new function version, but the change is in API Gateway's validation and mapping templates, which the alias doesn't cover."
      fr: "Un alias pondéré teste une nouvelle version de fonction, mais la modification porte sur la validation et les modèles de mappage d'API Gateway, que l'alias ne couvre pas."
    d:
      en: "HTTP APIs support neither canary release deployments nor request validation and body mapping templates."
      fr: "Les API HTTP ne prennent en charge ni les déploiements de version canari, ni la validation des requêtes, ni les modèles de mappage du corps."
references:
  - title: Set up an API Gateway canary release deployment
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/canary-release.html
  - title: Choose between REST APIs and HTTP APIs
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-vs-rest.html
