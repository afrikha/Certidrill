id: dvac03-1a-appconfig-feature-flag
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail application runs on Amazon ECS. Product pages call a third-party recommendation service that becomes very slow during sales. When this happens, the company wants to hide the recommendation widget within minutes while the rest of the page keeps working, without building a new image or redeploying the ECS service.

    Which solution will meet these requirements?
  fr: |
    Une application de vente au détail s'exécute sur Amazon ECS. Les pages produit appellent un service de recommandation tiers qui devient très lent pendant les soldes. Dans ce cas, l'entreprise veut masquer le widget de recommandation en quelques minutes tandis que le reste de la page continue de fonctionner, sans créer de nouvelle image ni redéployer le service ECS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Store a flag in an environment variable of the ECS task definition and update the variable when needed.", fr: "Stocker un indicateur dans une variable d'environnement de la définition de tâche ECS et modifier la variable si nécessaire." }
    - id: b
      text: { en: "Store a feature flag in AWS AppConfig, have the application read it at runtime, and disable the flag when needed.", fr: "Stocker un indicateur de fonctionnalité dans AWS AppConfig, le faire lire par l'application à l'exécution et le désactiver si nécessaire." }
    - id: c
      text: { en: "Store a flag in a configuration file inside the container image and change the file when needed.", fr: "Stocker un indicateur dans un fichier de configuration de l'image de conteneur et modifier le fichier si nécessaire." }
    - id: d
      text: { en: "Create a CloudWatch alarm on page latency that stops the ECS tasks when the latency is high.", fr: "Créer une alarme CloudWatch sur la latence des pages qui arrête les tâches ECS quand la latence est élevée." }
answer: { optionId: b }
explanation:
  correct:
    en: "Graceful degradation keeps the core function available by turning off a non-critical feature. An AWS AppConfig feature flag is read by the application at runtime, so changing the flag disables the widget without changing code, building an image or redeploying."
    fr: "La dégradation progressive maintient la fonction principale disponible en désactivant une fonctionnalité non critique. Un indicateur de fonctionnalité AWS AppConfig est lu par l'application à l'exécution : modifier l'indicateur désactive le widget sans modifier le code, créer d'image ni redéployer."
  options:
    a:
      en: "Changing an environment variable requires a new task definition revision and a new deployment of the service."
      fr: "Modifier une variable d'environnement exige une nouvelle révision de la définition de tâche et un nouveau déploiement du service."
    c:
      en: "A file inside the image can be changed only by building and deploying a new image."
      fr: "Un fichier de l'image ne peut être modifié qu'en créant et en déployant une nouvelle image."
    d:
      en: "Stopping the tasks takes the whole application down instead of degrading only the widget."
      fr: "Arrêter les tâches met toute l'application hors service au lieu de dégrader seulement le widget."
references:
  - title: Creating a feature flag configuration profile in AWS AppConfig
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-configuration-and-profile-feature-flags.html
  - title: REL05-BP01 Implement graceful degradation to transform applicable hard dependencies into soft dependencies
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_mitigate_interaction_failure_graceful_degradation.html
