id: dvac03-1d-ds-efs-shared-files
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's image-processing application runs on Amazon ECS tasks with AWS Fargate and on AWS Lambda functions. All the tasks and functions must read and write the same directory tree concurrently by using standard file system operations, with file locking and POSIX permissions. The files must persist after the tasks and functions stop.

    Which storage solution will meet these requirements?
  fr: |
    L'application de traitement d'images d'AnyCompany s'exécute sur des tâches Amazon ECS avec AWS Fargate et sur des fonctions AWS Lambda. Toutes les tâches et fonctions doivent lire et écrire simultanément la même arborescence de répertoires à l'aide d'opérations de système de fichiers standard, avec verrouillage de fichiers et autorisations POSIX. Les fichiers doivent persister après l'arrêt des tâches et des fonctions.

    Quelle solution de stockage répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach an Amazon EBS gp3 volume to each ECS task and configure the Lambda functions with 10,240 MB of ephemeral storage.", fr: "Attacher un volume Amazon EBS gp3 à chaque tâche ECS et configurer les fonctions Lambda avec 10 240 Mo de stockage éphémère." } }
    - { id: b, text: { en: "Store each file as a Binary attribute of an item in an Amazon DynamoDB table that uses the file path as the partition key.", fr: "Stocker chaque fichier dans un attribut Binary d'un élément d'une table Amazon DynamoDB dont la clé de partition est le chemin du fichier." } }
    - { id: c, text: { en: "Store each file in an Amazon ElastiCache (Valkey) cluster, with the file path as the key.", fr: "Stocker chaque fichier dans un cluster Amazon ElastiCache (Valkey), avec le chemin du fichier comme clé." } }
    - { id: d, text: { en: "Create an Amazon EFS file system and mount it in the ECS task definitions and in the Lambda function configurations.", fr: "Créer un système de fichiers Amazon EFS et le monter dans les définitions de tâches ECS et dans les configurations des fonctions Lambda." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Amazon EFS is a shared, elastic NFS file system that Amazon ECS, AWS Fargate and AWS Lambda can all mount. It provides strong consistency, file locking and POSIX permissions, and the data persists independently of the compute that uses it.
    fr: |
      Amazon EFS est un système de fichiers NFS partagé et élastique qu'Amazon ECS, AWS Fargate et AWS Lambda peuvent tous monter. Il offre une cohérence forte, le verrouillage de fichiers et les autorisations POSIX, et les données persistent indépendamment des ressources de calcul qui les utilisent.
  options:
    a: { en: "Each EBS volume and each /tmp directory is private to one task or one execution environment, so the files are not shared, and /tmp is temporary.", fr: "Chaque volume EBS et chaque répertoire /tmp est propre à une tâche ou à un environnement d'exécution : les fichiers ne sont pas partagés, et /tmp est temporaire." }
    b: { en: "DynamoDB items are limited to 400 KB and offer no file system operations, file locking or POSIX permissions.", fr: "Les éléments DynamoDB sont limités à 400 Ko et n'offrent ni opérations de système de fichiers, ni verrouillage de fichiers, ni autorisations POSIX." }
    c: { en: "An in-memory key-value store is accessed through its own commands, not through file system operations, and it provides no POSIX permissions.", fr: "Un magasin clé-valeur en mémoire est accessible par ses propres commandes, pas par des opérations de système de fichiers, et il n'offre aucune autorisation POSIX." }
references:
  - title: What is Amazon Elastic File System?
    url: https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html
