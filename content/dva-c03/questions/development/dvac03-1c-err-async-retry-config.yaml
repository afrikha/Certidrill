id: dvac03-1c-err-async-retry-config
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application invokes an AWS Lambda function asynchronously to send price alerts to customers. An alert that is more than 10 minutes old is useless. A failed alert must not be retried, because a retry can send a duplicate alert to the customer. Failed or expired events must go to an on-failure destination that is already configured.

    Which configuration will meet these requirements?
  fr: |
    Une application appelle une fonction AWS Lambda de manière asynchrone pour envoyer des alertes de prix aux clients. Une alerte de plus de 10 minutes est inutile. Une alerte en échec ne doit pas faire l'objet d'une nouvelle tentative, car une nouvelle tentative peut envoyer une alerte en double au client. Les événements en échec ou expirés doivent aller vers une destination en cas d'échec déjà configurée.

    Quelle configuration répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set MaximumRetryAttempts to 0 and MaximumEventAgeInSeconds to 600 in the function's asynchronous invocation configuration.", fr: "Définir MaximumRetryAttempts à 0 et MaximumEventAgeInSeconds à 600 dans la configuration d'appel asynchrone de la fonction." } }
    - { id: b, text: { en: "Set the timeout of the function to 600 seconds, and keep the default asynchronous invocation configuration.", fr: "Définir le délai d'expiration de la fonction à 600 secondes, et conserver la configuration d'appel asynchrone par défaut." } }
    - { id: c, text: { en: "Set MaximumRetryAttempts to 2 and MaximumEventAgeInSeconds to 21600 in the function's asynchronous invocation configuration.", fr: "Définir MaximumRetryAttempts à 2 et MaximumEventAgeInSeconds à 21600 dans la configuration d'appel asynchrone de la fonction." } }
    - { id: d, text: { en: "Set the reserved concurrency of the function to 0 so that Lambda does not retry failed events.", fr: "Définir la simultanéité réservée de la fonction à 0 afin que Lambda ne relance pas les événements en échec." } }
answer: { optionId: a }
explanation:
  correct:
    en: "For asynchronous invocations, MaximumRetryAttempts sets how many times Lambda retries after a function error, and MaximumEventAgeInSeconds sets how long Lambda keeps an event in its queue. With 0 retries and a 600-second maximum age, a failed alert is not retried, and an alert that waits more than 10 minutes is discarded and sent to the on-failure destination."
    fr: "Pour les appels asynchrones, MaximumRetryAttempts détermine combien de fois Lambda relance après une erreur de la fonction, et MaximumEventAgeInSeconds détermine combien de temps Lambda garde un événement dans sa file d'attente. Avec 0 nouvelle tentative et un âge maximal de 600 secondes, une alerte en échec n'est pas relancée, et une alerte qui attend plus de 10 minutes est rejetée et envoyée vers la destination en cas d'échec."
  options:
    b:
      en: "The timeout limits one execution; by default Lambda still retries a failed event twice and keeps events for up to 6 hours."
      fr: "Le délai d'expiration limite une exécution ; par défaut, Lambda relance toujours deux fois un événement en échec et garde les événements jusqu'à 6 heures."
    c:
      en: "These values are the maximums, so failed alerts are retried twice and old alerts can still be sent hours later."
      fr: "Ces valeurs sont les maximums : les alertes en échec sont relancées deux fois et d'anciennes alertes peuvent encore être envoyées des heures plus tard."
    d:
      en: "Reserved concurrency of 0 throttles every invocation, so no alert is sent at all."
      fr: "Une simultanéité réservée de 0 limite chaque appel : plus aucune alerte n'est envoyée."
references:
  - title: How Lambda handles errors and retries with asynchronous invocation
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-error-handling.html
