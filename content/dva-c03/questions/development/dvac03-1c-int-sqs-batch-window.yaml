id: dvac03-1c-int-sqs-batch-window
objective: "1.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function processes an Amazon SQS standard queue that receives about 20 messages each second. The event source mapping uses the default batch size of 10 and no batching window. The function timeout is 30 seconds, and the queue's visibility timeout is 180 seconds. The team wants fewer invocations, with batches of up to 200 messages and a wait of no more than 20 seconds to fill a batch. Messages must not become visible again while Lambda is still gathering or retrying a batch.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une fonction AWS Lambda traite une file d'attente standard Amazon SQS qui reçoit environ 20 messages par seconde. Le mappage de source d'événements utilise la taille de lot par défaut de 10 et aucune fenêtre de traitement par lots. Le délai d'expiration de la fonction est de 30 secondes, et le délai de visibilité de la file d'attente est de 180 secondes. L'équipe souhaite moins d'appels, avec des lots de 200 messages au plus et une attente de 20 secondes au maximum pour remplir un lot. Les messages ne doivent pas redevenir visibles pendant que Lambda rassemble ou relance encore un lot.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set BatchSize to 200 and MaximumBatchingWindowInSeconds to 20 on the event source mapping.", fr: "Définir BatchSize à 200 et MaximumBatchingWindowInSeconds à 20 sur le mappage de source d'événements." } }
    - { id: b, text: { en: "Set ParallelizationFactor to 10 on the event source mapping.", fr: "Définir ParallelizationFactor à 10 sur le mappage de source d'événements." } }
    - { id: c, text: { en: "Configure provisioned concurrency on the function so that Lambda gathers larger batches.", fr: "Configurer la simultanéité provisionnée sur la fonction afin que Lambda rassemble des lots plus grands." } }
    - { id: d, text: { en: "Increase the visibility timeout of the queue to at least 200 seconds.", fr: "Augmenter le délai de visibilité de la file d'attente à au moins 200 secondes." } }
    - { id: e, text: { en: "Reduce the function timeout to 3 seconds so that the current visibility timeout is enough.", fr: "Réduire le délai d'expiration de la fonction à 3 secondes afin que le délai de visibilité actuel suffise." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A batch size above 10 requires a batching window of at least 1 second, and the batch is sent when it is full or when the window ends. AWS recommends a visibility timeout of at least six times the function timeout plus MaximumBatchingWindowInSeconds: 6 × 30 + 20 = 200 seconds, so the current 180 seconds is too short."
    fr: "Une taille de lot supérieure à 10 exige une fenêtre de traitement par lots d'au moins 1 seconde, et le lot est envoyé lorsqu'il est plein ou à la fin de la fenêtre. AWS recommande un délai de visibilité d'au moins six fois le délai d'expiration de la fonction plus MaximumBatchingWindowInSeconds : 6 × 30 + 20 = 200 secondes ; les 180 secondes actuelles sont donc trop courtes."
  options:
    b:
      en: "ParallelizationFactor applies only to Kinesis and DynamoDB stream sources, and it would add concurrency, not reduce invocations."
      fr: "ParallelizationFactor ne s'applique qu'aux sources de flux Kinesis et DynamoDB, et ajouterait de la simultanéité au lieu de réduire les appels."
    c:
      en: "Provisioned concurrency pre-initializes environments; batch size and batching window are settings of the event source mapping."
      fr: "La simultanéité provisionnée pré-initialise des environnements ; la taille de lot et la fenêtre de traitement par lots sont des paramètres du mappage de source d'événements."
    e:
      en: "A 3-second timeout is likely too short to process 200 messages, and the requirement is to keep messages hidden, not to shorten processing."
      fr: "Un délai de 3 secondes est probablement trop court pour traiter 200 messages, et l'exigence est de garder les messages masqués, pas de raccourcir le traitement."
references:
  - title: Creating and configuring an Amazon SQS event source mapping
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-configure.html
