id: dvac03-1c-int-proxy-response
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon API Gateway REST API uses a Lambda proxy integration for the POST /orders method. The AWS Lambda function ends with the following code.

    ```python
    def handler(event, context):
        order_id = save_order(json.loads(event["body"]))
        return {"orderId": order_id, "status": "CREATED"}
    ```

    The order is saved, but clients receive an HTTP 502 Bad Gateway response. The API must return an HTTP 201 status code with the order ID in a JSON body.

    Which change will meet this requirement?
  fr: |
    Une API REST Amazon API Gateway utilise une intégration proxy Lambda pour la méthode POST /orders. La fonction AWS Lambda se termine par le code suivant.

    ```python
    def handler(event, context):
        order_id = save_order(json.loads(event["body"]))
        return {"orderId": order_id, "status": "CREATED"}
    ```

    La commande est enregistrée, mais les clients reçoivent une réponse HTTP 502 Bad Gateway. L'API doit renvoyer un code d'état HTTP 201 avec l'ID de la commande dans un corps JSON.

    Quelle modification répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Return `json.dumps({\"orderId\": order_id, \"status\": \"CREATED\"})` so that the function returns a JSON string.", fr: "Renvoyer `json.dumps({\"orderId\": order_id, \"status\": \"CREATED\"})` afin que la fonction renvoie une chaîne JSON." } }
    - { id: b, text: { en: "Return `{\"statusCode\": 201, \"headers\": {\"Content-Type\": \"application/json\"}, \"body\": json.dumps({\"orderId\": order_id})}`.", fr: "Renvoyer `{\"statusCode\": 201, \"headers\": {\"Content-Type\": \"application/json\"}, \"body\": json.dumps({\"orderId\": order_id})}`." } }
    - { id: c, text: { en: "Increase the integration timeout of the POST /orders method so that API Gateway waits until the function returns its result.", fr: "Augmenter le délai d'expiration de l'intégration de la méthode POST /orders afin qu'API Gateway attende que la fonction renvoie son résultat." } }
    - { id: d, text: { en: "Add `\"isBase64Encoded\": False` and `\"headers\": {\"Content-Type\": \"application/json\"}` to the returned dictionary.", fr: "Ajouter `\"isBase64Encoded\": False` et `\"headers\": {\"Content-Type\": \"application/json\"}` au dictionnaire renvoyé." } }
answer: { optionId: b }
explanation:
  correct:
    en: "With a Lambda proxy integration, the function must return an object with statusCode, optional headers or multiValueHeaders, body and optional isBase64Encoded. API Gateway passes body to the client as the response payload. Any other output format makes API Gateway return 502 Bad Gateway."
    fr: "Avec une intégration proxy Lambda, la fonction doit renvoyer un objet avec statusCode, headers ou multiValueHeaders facultatifs, body et isBase64Encoded facultatif. API Gateway transmet body au client comme charge utile de la réponse. Tout autre format de sortie fait renvoyer 502 Bad Gateway par API Gateway."
  options:
    a:
      en: "A JSON string is still not the proxy response format, because it has no statusCode or body field."
      fr: "Une chaîne JSON ne respecte toujours pas le format de réponse proxy, car elle n'a ni champ statusCode ni champ body."
    c:
      en: "The function finishes and the order is saved; the 502 comes from the format of the response, not from a timeout."
      fr: "La fonction se termine et la commande est enregistrée ; l'erreur 502 vient du format de la réponse, pas d'une expiration."
    d:
      en: "isBase64Encoded and headers are optional fields; without statusCode and body, the response is still malformed."
      fr: "isBase64Encoded et headers sont des champs facultatifs ; sans statusCode ni body, la réponse reste mal formée."
references:
  - title: Lambda proxy integrations in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-lambda-proxy-integrations.html
