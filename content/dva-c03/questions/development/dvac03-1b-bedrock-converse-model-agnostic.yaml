id: dvac03-1b-bedrock-converse-model-agnostic
objective: "1.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer is adding a text summarization feature to an application by using Amazon Bedrock. The team wants to compare several foundation models from different providers and switch between them later by changing only the model ID in the configuration, without rewriting the request and response handling code.

    Which solution will meet these requirements?
  fr: |
    Un développeur ajoute une fonctionnalité de résumé de texte à une application à l'aide d'Amazon Bedrock. L'équipe veut comparer plusieurs modèles de fondation de fournisseurs différents et passer de l'un à l'autre plus tard en changeant seulement l'ID du modèle dans la configuration, sans réécrire le code de traitement des requêtes et des réponses.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Call the InvokeModel API and build the request body in the native format of each model provider.", fr: "Appeler l'API InvokeModel et construire le corps de la requête dans le format natif de chaque fournisseur de modèle." }
    - id: b
      text: { en: "Call the Converse API with messages, a system prompt and inferenceConfig, and read the reply from output.message.", fr: "Appeler l'API Converse avec des messages, une invite système et inferenceConfig, et lire la réponse dans output.message." }
    - id: c
      text: { en: "Create a batch inference job for each request and read the summary from the output file in Amazon S3.", fr: "Créer une tâche d'inférence par lots pour chaque requête et lire le résumé dans le fichier de sortie Amazon S3." }
    - id: d
      text: { en: "Purchase Provisioned Throughput for each model and call the provisioned model ARN with InvokeModel.", fr: "Acheter du débit provisionné (Provisioned Throughput) pour chaque modèle et appeler l'ARN du modèle provisionné avec InvokeModel." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Converse API provides a consistent interface that works with all Amazon Bedrock models that support messages, so the same code can call models from different providers. The request uses messages, system and inferenceConfig, and the response always returns the assistant message, the stop reason and the token usage in the same structure.
    fr: |
      L'API Converse offre une interface cohérente qui fonctionne avec tous les modèles Amazon Bedrock qui prennent en charge les messages : le même code peut appeler des modèles de fournisseurs différents. La requête utilise messages, system et inferenceConfig, et la réponse renvoie toujours le message de l'assistant, le motif d'arrêt et la consommation de jetons dans la même structure.
  options:
    a:
      en: "InvokeModel takes and returns the native format of each model, so the code must change for each provider."
      fr: "InvokeModel prend et renvoie le format natif de chaque modèle : le code doit changer pour chaque fournisseur."
    c:
      en: "Batch inference processes many prompts asynchronously; it does not give a common request format and is not suited to one interactive request at a time."
      fr: "L'inférence par lots traite de nombreuses invites de façon asynchrone ; elle ne fournit pas de format de requête commun et ne convient pas à une requête interactive à la fois."
    d:
      en: "Provisioned Throughput buys capacity for a model; it neither removes the model-specific body of InvokeModel nor suits comparing several models."
      fr: "Le débit provisionné achète de la capacité pour un modèle ; il ne supprime pas le corps spécifique au modèle d'InvokeModel et ne convient pas pour comparer plusieurs modèles."
references:
  - title: Inference using Converse API
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
