id: dvac03-1b-sns-filter-message-body
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payment service publishes JSON messages such as `{"eventType": "refund", "amount": 30}` to an Amazon SNS standard topic. Three Amazon SQS queues are subscribed to the topic. The refunds queue must receive only the messages whose `eventType` is `refund`. The publisher does not set any message attributes, and the company cannot change the publisher or the consumers.

    Which solution will meet these requirements?
  fr: |
    Un service de paiement publie des messages JSON comme `{"eventType": "refund", "amount": 30}` dans une rubrique standard Amazon SNS. Trois files d'attente Amazon SQS sont abonnées à la rubrique. La file d'attente des remboursements ne doit recevoir que les messages dont `eventType` vaut `refund`. L'éditeur ne définit aucun attribut de message, et l'entreprise ne peut modifier ni l'éditeur ni les consommateurs.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add the filter policy `{\"eventType\": [\"refund\"]}` to the refunds subscription, and keep the default filter policy scope.", fr: "Ajouter la politique de filtrage `{\"eventType\": [\"refund\"]}` à l'abonnement des remboursements, et conserver la portée de politique de filtrage par défaut." }
    - id: b
      text: { en: "Add the filter policy `{\"eventType\": [\"refund\"]}` to the refunds subscription, and set its filter policy scope to MessageBody.", fr: "Ajouter la politique de filtrage `{\"eventType\": [\"refund\"]}` à l'abonnement des remboursements, et définir sa portée de politique de filtrage sur MessageBody." }
    - id: c
      text: { en: "Add a queue policy to the refunds queue that allows sqs:SendMessage only when the message contains eventType refund.", fr: "Ajouter à la file d'attente des remboursements une politique de file d'attente qui n'autorise sqs:SendMessage que si le message contient eventType refund." }
    - id: d
      text: { en: "Turn on raw message delivery for the refunds subscription so that SNS delivers only the matching messages.", fr: "Activer la remise de messages bruts pour l'abonnement des remboursements afin que SNS ne remette que les messages correspondants." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A subscription filter policy makes SNS deliver to that subscriber only the messages that match it. The FilterPolicyScope attribute decides whether the policy applies to message attributes (the default) or to the message body. Because eventType is in the JSON body and no attributes are set, the scope must be MessageBody.
    fr: |
      Une politique de filtrage d'abonnement fait remettre par SNS à cet abonné uniquement les messages qui lui correspondent. L'attribut FilterPolicyScope décide si la politique s'applique aux attributs du message (valeur par défaut) ou au corps du message. Comme eventType se trouve dans le corps JSON et qu'aucun attribut n'est défini, la portée doit être MessageBody.
  options:
    a:
      en: "The default scope is MessageAttributes; the messages have no attributes, so no message would match and the refunds queue would receive nothing."
      fr: "La portée par défaut est MessageAttributes ; les messages n'ont aucun attribut : aucun message ne correspondrait et la file d'attente des remboursements ne recevrait rien."
    c:
      en: "Queue policies control which principals can send messages; they cannot inspect the content of a message to filter it."
      fr: "Les politiques de file d'attente contrôlent les principaux autorisés à envoyer des messages ; elles ne peuvent pas inspecter le contenu d'un message pour le filtrer."
    d:
      en: "Raw message delivery removes the SNS envelope but still delivers every message published to the topic."
      fr: "La remise de messages bruts retire l'enveloppe SNS, mais remet toujours chaque message publié dans la rubrique."
references:
  - title: Amazon SNS subscription filter policy scope
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-message-filtering-scope.html
  - title: Amazon SNS message filtering
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-message-filtering.html
