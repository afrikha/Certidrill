id: dvac03-1d-ddb-sparse-index
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's Orders table in Amazon DynamoDB has the partition key CustomerId and the sort key OrderId, and it contains 80 million orders. At any time, only a few thousand orders are open. A warehouse dashboard must list the open orders of one warehouse, sorted by order date, every few seconds.

    The solution must be the MOST cost-effective in read and write capacity.

    Which solution will meet these requirements?
  fr: |
    La table Orders d'AnyCompany dans Amazon DynamoDB a la clé de partition CustomerId et la clé de tri OrderId, et elle contient 80 millions de commandes. À tout moment, seules quelques milliers de commandes sont ouvertes. Un tableau de bord d'entrepôt doit lister toutes les quelques secondes les commandes ouvertes d'un entrepôt, triées par date de commande.

    La solution doit être la PLUS rentable en capacité de lecture et d'écriture.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a global secondary index with Status as the partition key and OrderDate as the sort key, and query it for the OPEN status.", fr: "Créer un index secondaire global avec Status comme clé de partition et OrderDate comme clé de tri, et l'interroger pour le statut OPEN." } }
    - { id: b, text: { en: "Scan the table with a filter expression on Status and WarehouseId, and sort the results in the dashboard code.", fr: "Analyser la table par un Scan avec une expression de filtre sur Status et WarehouseId, et trier les résultats dans le code du tableau de bord." } }
    - { id: c, text: { en: "Set an OpenWarehouseId attribute only while an order is open, and create a global secondary index on OpenWarehouseId and OrderDate.", fr: "Définir un attribut OpenWarehouseId uniquement tant qu'une commande est ouverte, et créer un index secondaire global sur OpenWarehouseId et OrderDate." } }
    - { id: d, text: { en: "Create a global secondary index with WarehouseId as the partition key and OrderDate as the sort key, and filter on Status.", fr: "Créer un index secondaire global avec WarehouseId comme clé de partition et OrderDate comme clé de tri, et filtrer sur Status." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      DynamoDB writes an item to a global secondary index only if the item has the index key attributes, so an index keyed on an attribute that exists only on open orders is a sparse index. It holds only the few thousand open orders, a Query on one warehouse returns them sorted by OrderDate, and removing the attribute when the order closes removes the item from the index. A small index costs less to write to and to query.
    fr: |
      DynamoDB n'écrit un élément dans un index secondaire global que si l'élément possède les attributs de clé de l'index : un index dont la clé est un attribut présent uniquement sur les commandes ouvertes est un index fragmenté (sparse index). Il ne contient que les quelques milliers de commandes ouvertes, une Query sur un entrepôt les renvoie triées par OrderDate, et supprimer l'attribut à la clôture de la commande retire l'élément de l'index. Un petit index coûte moins cher en écriture et en lecture.
  options:
    a: { en: "Status has only a few values, which creates hot partitions in the index, and the dashboard would still read the open orders of every warehouse.", fr: "Status n'a que quelques valeurs, ce qui crée des partitions sollicitées dans l'index, et le tableau de bord lirait encore les commandes ouvertes de tous les entrepôts." }
    b: { en: "A Scan reads all 80 million items every few seconds, and the filter does not reduce the consumed read capacity.", fr: "Un Scan lit les 80 millions d'éléments toutes les quelques secondes, et le filtre ne réduit pas la capacité de lecture consommée." }
    d: { en: "This index contains every order, so each query reads the closed orders of the warehouse too before the filter removes them, and every order write also updates the index.", fr: "Cet index contient toutes les commandes : chaque requête lit aussi les commandes clôturées de l'entrepôt avant que le filtre ne les écarte, et chaque écriture de commande met aussi l'index à jour." }
references:
  - title: Take advantage of sparse indexes
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-indexes-general-sparse-indexes.html
