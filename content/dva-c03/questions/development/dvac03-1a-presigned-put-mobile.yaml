id: dvac03-1a-presigned-put-mobile
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A mobile application lets users upload photos of up to 20 MB to an Amazon S3 bucket. The uploads must not pass through the company's backend servers, the app must not contain AWS credentials, and each upload permission must expire after 15 minutes. The backend is written in Python.

    Which solution will meet these requirements?
  fr: |
    Une application mobile permet aux utilisateurs de charger des photos allant jusqu'à 20 Mo dans un compartiment Amazon S3. Les chargements ne doivent pas passer par les serveurs backend de l'entreprise, l'application ne doit contenir aucune information d'identification AWS, et chaque autorisation de chargement doit expirer au bout de 15 minutes. Le backend est écrit en Python.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a bucket policy that allows s3:PutObject for all principals on the uploads/ prefix.", fr: "Ajouter une politique de compartiment qui autorise s3:PutObject pour tous les principaux sur le préfixe uploads/." }
    - id: b
      text: { en: "Store the access key of an IAM user in the app configuration and call put_object from the app.", fr: "Stocker la clé d'accès d'un utilisateur IAM dans la configuration de l'application et appeler put_object depuis l'application." }
    - id: c
      text: { en: "Have the backend call generate_presigned_url for put_object with ExpiresIn=900 and return the URL to the app.", fr: "Faire appeler generate_presigned_url pour put_object avec ExpiresIn=900 par le backend et renvoyer l'URL à l'application." }
    - id: d
      text: { en: "Have the backend call generate_presigned_url for get_object with ExpiresIn=900 and return the URL to the app.", fr: "Faire appeler generate_presigned_url pour get_object avec ExpiresIn=900 par le backend et renvoyer l'URL à l'application." }
answer: { optionId: c }
explanation:
  correct:
    en: "A presigned URL for put_object lets the holder upload that object directly to S3 with an HTTP PUT, without AWS credentials. The URL carries the permissions of the backend principal that signed it and stops working after ExpiresIn seconds (900 seconds = 15 minutes)."
    fr: "Une URL présignée pour put_object permet à son détenteur de charger cet objet directement dans S3 par un PUT HTTP, sans information d'identification AWS. L'URL porte les autorisations du principal backend qui l'a signée et cesse de fonctionner après ExpiresIn secondes (900 secondes = 15 minutes)."
  options:
    a:
      en: "A public write policy lets anyone upload at any time; it has no per-upload expiration."
      fr: "Une politique d'écriture publique permet à n'importe qui de charger à tout moment ; elle n'a pas d'expiration par chargement."
    b:
      en: "Embedding long-term access keys in a mobile app breaks the no-credentials requirement and exposes the keys to anyone who inspects the app."
      fr: "Intégrer des clés d'accès à long terme dans une application mobile enfreint l'exigence d'absence d'informations d'identification et expose les clés à quiconque inspecte l'application."
    d:
      en: "A presigned URL for get_object allows downloads only; it can't be used to upload an object."
      fr: "Une URL présignée pour get_object n'autorise que les téléchargements ; elle ne permet pas de charger un objet."
references:
  - title: Uploading objects with presigned URLs
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/PresignedUrlUploadObject.html
