id: dvac03-1d-ddb-begins-with-month
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's Invoices table in Amazon DynamoDB has the partition key CustomerId and the sort key InvoiceKey. Each InvoiceKey value combines the invoice date and the invoice number, for example 2026-03-14#INV-8812. A developer must retrieve all the invoices of one customer for March 2026.

    The solution must consume the LEAST read capacity.

    Which request will meet these requirements?
  fr: |
    La table Invoices d'AnyCompany dans Amazon DynamoDB a la clé de partition CustomerId et la clé de tri InvoiceKey. Chaque valeur d'InvoiceKey combine la date et le numéro de la facture, par exemple 2026-03-14#INV-8812. Un développeur doit récupérer toutes les factures d'un client pour mars 2026.

    La solution doit consommer le MOINS de capacité de lecture possible.

    Quelle requête répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "A Query with the key condition CustomerId = :c and the filter expression begins_with(InvoiceKey, :m), where :m is 2026-03", fr: "Une Query avec la condition de clé CustomerId = :c et l'expression de filtre begins_with(InvoiceKey, :m), où :m vaut 2026-03" } }
    - { id: b, text: { en: "A Query with the key condition CustomerId = :c AND contains(InvoiceKey, :m), where :m is 2026-03", fr: "Une Query avec la condition de clé CustomerId = :c AND contains(InvoiceKey, :m), où :m vaut 2026-03" } }
    - { id: c, text: { en: "A Query with the key condition CustomerId = :c AND begins_with(InvoiceKey, :m), where :m is 2026-03", fr: "Une Query avec la condition de clé CustomerId = :c AND begins_with(InvoiceKey, :m), où :m vaut 2026-03" } }
    - { id: d, text: { en: "A Scan with the filter expression CustomerId = :c AND begins_with(InvoiceKey, :m), where :m is 2026-03", fr: "Un Scan avec l'expression de filtre CustomerId = :c AND begins_with(InvoiceKey, :m), où :m vaut 2026-03" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A key condition expression requires equality on the partition key and accepts an optional sort key condition, and begins_with is one of the supported sort key operators. DynamoDB then reads only the items of that customer whose InvoiceKey starts with 2026-03, so no other invoice consumes read capacity.
    fr: |
      Une expression de condition de clé exige l'égalité sur la clé de partition et accepte une condition facultative sur la clé de tri, et begins_with fait partie des opérateurs pris en charge pour la clé de tri. DynamoDB ne lit alors que les éléments de ce client dont InvoiceKey commence par 2026-03 : aucune autre facture ne consomme de capacité de lecture.
  options:
    a: { en: "A filter expression cannot contain partition key or sort key attributes, so the request is rejected; key attributes belong in the key condition.", fr: "Une expression de filtre ne peut pas contenir d'attributs de clé de partition ou de clé de tri : la requête est rejetée ; les attributs de clé vont dans la condition de clé." }
    b: { en: "contains is not a supported sort key operator in a key condition expression; only comparison operators, BETWEEN and begins_with are.", fr: "contains n'est pas un opérateur pris en charge pour la clé de tri dans une expression de condition de clé ; seuls les opérateurs de comparaison, BETWEEN et begins_with le sont." }
    d: { en: "A Scan reads every item of the table before the filter is applied, which consumes far more read capacity than a Query.", fr: "Un Scan lit tous les éléments de la table avant l'application du filtre, ce qui consomme bien plus de capacité de lecture qu'une Query." }
references:
  - title: Key condition expressions for the Query operation in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Query.KeyConditionExpressions.html
  - title: Filter expressions for the Query operation in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Query.FilterExpression.html
