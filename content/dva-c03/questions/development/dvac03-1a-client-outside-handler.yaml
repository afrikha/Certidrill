id: dvac03-1a-client-outside-handler
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Lambda function handles thousands of requests per minute with the following code:

    ```python
    import boto3

    def handler(event, context):
        dynamodb = boto3.client("dynamodb")
        resp = dynamodb.get_item(
            TableName="Sessions",
            Key={"id": {"S": event["id"]}},
        )
        return resp.get("Item")
    ```

    Profiling shows that creating the SDK client adds latency to every invocation.

    Which change will reduce this latency?
  fr: |
    Une fonction Lambda traite des milliers de requêtes par minute avec le code suivant :

    ```python
    import boto3

    def handler(event, context):
        dynamodb = boto3.client("dynamodb")
        resp = dynamodb.get_item(
            TableName="Sessions",
            Key={"id": {"S": event["id"]}},
        )
        return resp.get("Item")
    ```

    Le profilage montre que la création du client SDK ajoute de la latence à chaque invocation.

    Quelle modification réduira cette latence ?
body:
  options:
    - id: a
      text: { en: "Increase the reserved concurrency of the function.", fr: "Augmenter la simultanéité réservée de la fonction." }
    - id: b
      text: { en: "Create the DynamoDB client outside the handler so that warm invocations reuse it.", fr: "Créer le client DynamoDB en dehors du gestionnaire pour que les invocations à chaud le réutilisent." }
    - id: c
      text: { en: "Add `ConsistentRead=True` to the `get_item` call.", fr: "Ajouter `ConsistentRead=True` à l'appel `get_item`." }
    - id: d
      text: { en: "Create a new `boto3.session.Session()` in the handler before creating the client.", fr: "Créer une nouvelle `boto3.session.Session()` dans le gestionnaire avant de créer le client." }
answer: { optionId: b }
explanation:
  correct:
    en: "Code outside the handler runs once per execution environment, and the following invocations in the same environment reuse what it created. Initializing SDK clients outside the handler is an AWS best practice that removes the client creation cost from each warm invocation."
    fr: "Le code situé hors du gestionnaire s'exécute une fois par environnement d'exécution, et les invocations suivantes dans le même environnement réutilisent ce qu'il a créé. Initialiser les clients SDK hors du gestionnaire est une bonne pratique AWS qui supprime le coût de création du client à chaque invocation à chaud."
  options:
    a:
      en: "Reserved concurrency reserves capacity for the function; each invocation still creates a client."
      fr: "La simultanéité réservée réserve de la capacité pour la fonction ; chaque invocation crée toujours un client."
    c:
      en: "A strongly consistent read changes the read semantics and costs more capacity; it doesn't remove the client creation."
      fr: "Une lecture fortement cohérente modifie la sémantique de lecture et consomme plus de capacité ; elle ne supprime pas la création du client."
    d:
      en: "Creating a session in the handler adds even more work to every invocation."
      fr: "Créer une session dans le gestionnaire ajoute encore plus de travail à chaque invocation."
references:
  - title: Best practices for working with AWS Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/best-practices.html
