id: dvac03-1b-kiro-hook-file-save
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer uses the Kiro agent to refactor a Python code base. Every time the agent saves or modifies a Python file, the project linter and the unit tests of that module must run automatically, without the developer typing a command or a prompt.

    Which Kiro feature should the developer configure?
  fr: |
    Un développeur utilise l'agent Kiro pour refactoriser une base de code Python. Chaque fois que l'agent enregistre ou modifie un fichier Python, le linter du projet et les tests unitaires de ce module doivent s'exécuter automatiquement, sans que le développeur tape une commande ou une invite.

    Quelle fonctionnalité de Kiro le développeur doit-il configurer ?
body:
  options:
    - id: a
      text: { en: "A steering file that tells the agent to run the linter and the tests after each change.", fr: "Un fichier steering qui demande à l'agent d'exécuter le linter et les tests après chaque modification." }
    - id: b
      text: { en: "A hook with a File Save trigger for Python files and a command action that runs the linter and the tests.", fr: "Un hook avec un déclencheur File Save pour les fichiers Python et une action de commande qui exécute le linter et les tests." }
    - id: c
      text: { en: "An MCP server that exposes the linter and the test runner as tools that the agent can call.", fr: "Un serveur MCP qui expose le linter et l'exécuteur de tests comme outils que l'agent peut appeler." }
    - id: d
      text: { en: "A task in the tasks.md file of a spec that runs the linter and the tests at the end of the spec.", fr: "Une tâche dans le fichier tasks.md d'une spec qui exécute le linter et les tests à la fin de la spec." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Hooks run shell commands or agent prompts automatically when specific events happen. A File Save trigger fires when the agent saves or modifies matching files, and a command action runs a shell command in the project root, so the linter and tests run after every agent edit of a Python file.
    fr: |
      Les hooks exécutent automatiquement des commandes shell ou des invites d'agent quand des événements précis se produisent. Un déclencheur File Save se déclenche quand l'agent enregistre ou modifie des fichiers correspondants, et une action de commande exécute une commande shell à la racine du projet : le linter et les tests s'exécutent après chaque modification d'un fichier Python par l'agent.
  options:
    a:
      en: "A steering file gives guidance that the agent may follow; it does not run a command automatically on each file event."
      fr: "Un fichier steering donne des indications que l'agent peut suivre ; il n'exécute pas automatiquement une commande à chaque événement de fichier."
    c:
      en: "An MCP server makes tools available, but the agent still decides when to call them; nothing runs automatically on save."
      fr: "Un serveur MCP rend des outils disponibles, mais l'agent décide toujours quand les appeler ; rien ne s'exécute automatiquement à l'enregistrement."
    d:
      en: "A spec task runs once, when the task is executed, not every time a file is saved during the refactoring."
      fr: "Une tâche de spec s'exécute une fois, quand la tâche est lancée, pas chaque fois qu'un fichier est enregistré pendant la refactorisation."
references:
  - title: Hooks
    url: https://kiro.dev/docs/hooks/
  - title: Hook triggers
    url: https://kiro.dev/docs/hooks/types/
