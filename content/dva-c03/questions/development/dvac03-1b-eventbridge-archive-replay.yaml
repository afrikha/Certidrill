id: dvac03-1b-eventbridge-archive-replay
objective: "1.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company routes events from several microservices through an Amazon EventBridge custom event bus. When a consumer has a bug, the company wants to be able to send the events of a chosen past time window to the bus again after the fix. The solution must use the LEAST custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise achemine les événements de plusieurs microservices au moyen d'un bus d'événements personnalisé Amazon EventBridge. Quand un consommateur présente un bogue, l'entreprise veut pouvoir renvoyer sur le bus les événements d'une période passée choisie, après la correction. La solution doit utiliser le MOINS de code personnalisé possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an archive on the event bus, and start a replay for the chosen time window after the fix.", fr: "Créer une archive sur le bus d'événements, et lancer une relecture (replay) pour la période choisie après la correction." }
    - id: b
      text: { en: "Add a rule that copies all events to an Amazon SQS queue, and write a script that sends them back to the bus.", fr: "Ajouter une règle qui copie tous les événements dans une file d'attente Amazon SQS, et écrire un script qui les renvoie sur le bus." }
    - id: c
      text: { en: "Configure AWS CloudTrail to log the API calls of the bus, and write a function that resends the logged events.", fr: "Configurer AWS CloudTrail pour journaliser les appels d'API du bus, et écrire une fonction qui renvoie les événements journalisés." }
    - id: d
      text: { en: "Add a dead-letter queue to every rule target, and redrive the dead-letter queues after the fix.", fr: "Ajouter une file d'attente de lettres mortes à chaque cible de règle, et réacheminer les files de lettres mortes après la correction." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An EventBridge archive stores the events of a bus, optionally filtered by an event pattern and kept indefinitely by default. A replay resends the archived events of a time frame to the source bus, optionally to specific rules. Replayed events carry a replay-name field, and replaying does not remove them from the archive.
    fr: |
      Une archive EventBridge stocke les événements d'un bus, éventuellement filtrés par un modèle d'événement et conservés indéfiniment par défaut. Une relecture renvoie les événements archivés d'une période vers le bus source, éventuellement vers des règles précises. Les événements relus portent un champ replay-name, et la relecture ne les retire pas de l'archive.
  options:
    b:
      en: "This rebuilds archiving and replay with custom code, and a queue keeps messages for a limited time and does not select them by time window."
      fr: "Cette solution recrée l'archivage et la relecture avec du code personnalisé, et une file d'attente conserve les messages pendant une durée limitée sans les sélectionner par période."
    c:
      en: "CloudTrail records API activity for auditing; resending events from logs requires custom code and is not a replay feature."
      fr: "CloudTrail enregistre l'activité des API pour l'audit ; renvoyer des événements à partir des journaux exige du code personnalisé et n'est pas une fonctionnalité de relecture."
    d:
      en: "Dead-letter queues receive only events that could not be delivered; events that were delivered to a buggy consumer are not kept."
      fr: "Les files d'attente de lettres mortes ne reçoivent que les événements qui n'ont pas pu être livrés ; les événements livrés à un consommateur bogué ne sont pas conservés."
references:
  - title: Archiving and replaying events in Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-archive.html
