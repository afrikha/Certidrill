id: dvac03-1c-cfg-layer-python-path
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer creates a Lambda layer for a Python function with the following commands, publishes the layer, and adds it to the function.

    ```bash
    pip install requests -t .
    zip -r layer.zip requests
    ```

    Invocations fail with the error "No module named 'requests'". The developer must fix the layer without adding the library to the function's deployment package.

    Which solution will meet these requirements?
  fr: |
    Un développeur crée une couche (layer) Lambda pour une fonction Python avec les commandes suivantes, publie la couche et l'ajoute à la fonction.

    ```bash
    pip install requests -t .
    zip -r layer.zip requests
    ```

    Les appels échouent avec l'erreur « No module named 'requests' ». Le développeur doit corriger la couche sans ajouter la bibliothèque au package de déploiement de la fonction.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Rebuild the archive with the packages in a top-level nodejs/node_modules directory, and publish a new layer version.", fr: "Reconstruire l'archive avec les packages dans un répertoire nodejs/node_modules de premier niveau, et publier une nouvelle version de la couche." } }
    - { id: b, text: { en: "Rebuild the archive with the packages in a top-level lib directory, and publish a new layer version.", fr: "Reconstruire l'archive avec les packages dans un répertoire lib de premier niveau, et publier une nouvelle version de la couche." } }
    - { id: c, text: { en: "Rebuild the archive with the packages in an opt/python directory, and publish a new layer version.", fr: "Reconstruire l'archive avec les packages dans un répertoire opt/python, et publier une nouvelle version de la couche." } }
    - { id: d, text: { en: "Rebuild the archive with the packages in a top-level python directory, and publish a new layer version.", fr: "Reconstruire l'archive avec les packages dans un répertoire python de premier niveau, et publier une nouvelle version de la couche." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Lambda extracts layer content into /opt, and the Python runtime adds /opt/python (and python/lib/python3.x/site-packages) to its search path. Packages at the root of the archive land in /opt/requests, which Python does not search. Layer versions are immutable, so the fix is a new version that the function references."
    fr: "Lambda extrait le contenu de la couche dans /opt, et l'environnement d'exécution Python ajoute /opt/python (et python/lib/python3.x/site-packages) à son chemin de recherche. Les packages placés à la racine de l'archive arrivent dans /opt/requests, où Python ne cherche pas. Les versions de couche sont immuables : la correction est une nouvelle version que la fonction référence."
  options:
    a:
      en: "nodejs/node_modules is the layer path for Node.js runtimes; Python does not search it."
      fr: "nodejs/node_modules est le chemin de couche des environnements d'exécution Node.js ; Python n'y cherche pas."
    b:
      en: "The lib directory is added to LD_LIBRARY_PATH for native shared libraries, not to the Python module search path."
      fr: "Le répertoire lib est ajouté à LD_LIBRARY_PATH pour les bibliothèques natives partagées, pas au chemin de recherche des modules Python."
    c:
      en: "Lambda already extracts the archive into /opt, so this layout ends up in /opt/opt/python, which is not on the search path."
      fr: "Lambda extrait déjà l'archive dans /opt : cette structure aboutit à /opt/opt/python, qui ne fait pas partie du chemin de recherche."
references:
  - title: Packaging your layer content
    url: https://docs.aws.amazon.com/lambda/latest/dg/packaging-layers.html
  - title: Managing Lambda Event Function dependencies with layers
    url: https://docs.aws.amazon.com/lambda/latest/dg/chapter-layers.html
