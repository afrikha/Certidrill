id: dvac03-1d-cache-apigw-cache-key
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany exposes product listings through an Amazon API Gateway REST API. The GET /products method accepts a category query string parameter and uses an AWS Lambda proxy integration. A developer enabled caching on the prod stage with a 300-second TTL. Since then, users who request different categories often receive the products of another category.

    Caching must stay enabled for the method.

    Which solution will meet these requirements?
  fr: |
    AnyCompany expose des listes de produits via une API REST Amazon API Gateway. La méthode GET /products accepte un paramètre de chaîne de requête category et utilise une intégration proxy AWS Lambda. Un développeur a activé la mise en cache sur l'étape prod avec un TTL de 300 secondes. Depuis, des utilisateurs qui demandent des catégories différentes reçoivent souvent les produits d'une autre catégorie.

    La mise en cache doit rester activée pour la méthode.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the cache TTL of the GET /products method to 0 seconds.", fr: "Régler le TTL du cache de la méthode GET /products sur 0 seconde." } }
    - { id: b, text: { en: "Flush the entire stage cache each time a user requests a new category.", fr: "Vider tout le cache de l'étape chaque fois qu'un utilisateur demande une nouvelle catégorie." } }
    - { id: c, text: { en: "Add the category query string parameter as a cache key of the GET /products method.", fr: "Ajouter le paramètre de chaîne de requête category comme clé de cache de la méthode GET /products." } }
    - { id: d, text: { en: "Enable encryption of the cache data on the prod stage.", fr: "Activer le chiffrement des données du cache sur l'étape prod." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      API Gateway indexes cached responses by the parameters chosen as cache keys. When category is a cache key, GET /products?category=books and GET /products?category=toys are cached as separate entries, so each user receives the response for the requested category while caching stays on.
    fr: |
      API Gateway indexe les réponses en cache selon les paramètres choisis comme clés de cache. Quand category est une clé de cache, GET /products?category=books et GET /products?category=toys sont mis en cache comme des entrées distinctes : chaque utilisateur reçoit la réponse de la catégorie demandée, et la mise en cache reste active.
  options:
    a: { en: "A TTL of 0 disables caching for the method, which the requirement forbids.", fr: "Un TTL de 0 désactive la mise en cache de la méthode, ce que l'exigence interdit." }
    b: { en: "Flushing removes every entry, so the cache is useless and the wrong-category responses return as soon as it fills again.", fr: "Vider le cache supprime toutes les entrées : le cache devient inutile et les réponses de mauvaise catégorie reviennent dès qu'il se remplit à nouveau." }
    d: { en: "Encryption protects the cached data at rest but does not change how responses are keyed.", fr: "Le chiffrement protège les données en cache au repos, mais il ne change pas la façon dont les réponses sont indexées." }
references:
  - title: Cache settings for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-caching.html
