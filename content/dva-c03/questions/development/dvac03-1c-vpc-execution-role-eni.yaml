id: dvac03-1c-vpc-execution-role-eni
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer runs the UpdateFunctionConfiguration API operation to connect an existing AWS Lambda function to two subnets and a security group of a VPC. The call fails with an error that states that the function's execution role does not have permission to call CreateNetworkInterface on Amazon EC2. The execution role has only the AWSLambdaBasicExecutionRole managed policy.

    Which solution will meet this requirement while following the principle of least privilege?
  fr: |
    Un développeur exécute l'opération d'API UpdateFunctionConfiguration pour connecter une fonction AWS Lambda existante à deux sous-réseaux et à un groupe de sécurité d'un VPC. L'appel échoue avec une erreur indiquant que le rôle d'exécution de la fonction n'a pas l'autorisation d'appeler CreateNetworkInterface sur Amazon EC2. Le rôle d'exécution ne possède que la politique gérée AWSLambdaBasicExecutionRole.

    Quelle solution répond à cette exigence tout en respectant le principe du moindre privilège ?
body:
  options:
    - { id: a, text: { en: "Attach the AmazonEC2FullAccess managed policy to the function's execution role.", fr: "Attacher la politique gérée AmazonEC2FullAccess au rôle d'exécution de la fonction." } }
    - { id: b, text: { en: "Add a statement to the function's resource-based policy that allows ec2.amazonaws.com to invoke the function.", fr: "Ajouter à la politique basée sur les ressources de la fonction une instruction qui autorise ec2.amazonaws.com à appeler la fonction." } }
    - { id: c, text: { en: "Attach the AWSLambdaVPCAccessExecutionRole managed policy to the developer's IAM user.", fr: "Attacher la politique gérée AWSLambdaVPCAccessExecutionRole à l'utilisateur IAM du développeur." } }
    - { id: d, text: { en: "Attach the AWSLambdaVPCAccessExecutionRole managed policy to the function's execution role.", fr: "Attacher la politique gérée AWSLambdaVPCAccessExecutionRole au rôle d'exécution de la fonction." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Lambda uses the function's execution role to create and manage the network interfaces in the VPC. The AWSLambdaVPCAccessExecutionRole managed policy grants only the EC2 network interface actions that Lambda needs, such as ec2:CreateNetworkInterface, ec2:DescribeNetworkInterfaces and ec2:DeleteNetworkInterface."
    fr: "Lambda utilise le rôle d'exécution de la fonction pour créer et gérer les interfaces réseau dans le VPC. La politique gérée AWSLambdaVPCAccessExecutionRole n'accorde que les actions EC2 sur les interfaces réseau dont Lambda a besoin, comme ec2:CreateNetworkInterface, ec2:DescribeNetworkInterfaces et ec2:DeleteNetworkInterface."
  options:
    a:
      en: "AmazonEC2FullAccess would work but grants far more EC2 permissions than the network interface actions that Lambda needs."
      fr: "AmazonEC2FullAccess fonctionnerait, mais accorde bien plus d'autorisations EC2 que les actions sur les interfaces réseau dont Lambda a besoin."
    b:
      en: "A resource-based policy controls who can invoke the function; the missing permission belongs to the execution role, not to an invoker."
      fr: "Une politique basée sur les ressources contrôle qui peut appeler la fonction ; l'autorisation manquante concerne le rôle d'exécution, pas un appelant."
    c:
      en: "The error is about the execution role, which Lambda assumes to create the network interfaces; permissions on the developer's user do not fix it."
      fr: "L'erreur concerne le rôle d'exécution, que Lambda assume pour créer les interfaces réseau ; des autorisations sur l'utilisateur du développeur ne la corrigent pas."
references:
  - title: Giving Lambda Event Functions access to resources in an Amazon VPC
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html
