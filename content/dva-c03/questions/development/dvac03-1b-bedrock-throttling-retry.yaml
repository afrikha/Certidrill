id: dvac03-1b-bedrock-throttling-retry
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Python application calls the Amazon Bedrock Converse API on demand to classify support tickets as they arrive. For a few minutes each morning, about 2 % of the calls fail with `ThrottlingException` (HTTP 429). For the rest of the day, usage stays well below the account quotas. Each ticket must be classified within one minute. The company wants the MOST cost-effective solution.

    Which solution will meet these requirements?
  fr: |
    Une application Python appelle à la demande l'API Converse d'Amazon Bedrock pour classer les tickets de support à leur arrivée. Pendant quelques minutes chaque matin, environ 2 % des appels échouent avec `ThrottlingException` (HTTP 429). Le reste de la journée, l'utilisation reste bien inférieure aux quotas du compte. Chaque ticket doit être classé en moins d'une minute. L'entreprise veut la solution la PLUS rentable.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Purchase Provisioned Throughput for the model and send the morning traffic to the provisioned model.", fr: "Acheter du débit provisionné (Provisioned Throughput) pour le modèle et envoyer le trafic du matin vers le modèle provisionné." }
    - id: b
      text: { en: "Increase maxTokens in inferenceConfig so that each call returns more results and fewer calls are needed.", fr: "Augmenter maxTokens dans inferenceConfig afin que chaque appel renvoie davantage de résultats et que moins d'appels soient nécessaires." }
    - id: c
      text: { en: "Collect the morning tickets and submit them as a batch inference job with an input file in Amazon S3.", fr: "Regrouper les tickets du matin et les soumettre sous forme de tâche d'inférence par lots avec un fichier d'entrée dans Amazon S3." }
    - id: d
      text: { en: "Configure the Boto3 client with the standard retry mode and a higher max_attempts value so that throttled calls are retried.", fr: "Configurer le client Boto3 avec le mode de nouvelle tentative standard et une valeur max_attempts plus élevée afin que les appels limités soient retentés." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      ThrottlingException means that the requests exceeded the account quotas for Amazon Bedrock, which is a transient condition here. Retrying with exponential backoff, which the AWS SDK retry modes provide, spreads the short burst over a few more seconds at no extra cost, well within the one-minute target.
    fr: |
      ThrottlingException signifie que les requêtes ont dépassé les quotas du compte pour Amazon Bedrock, une situation passagère ici. Retenter avec un backoff exponentiel, que fournissent les modes de nouvelle tentative du SDK AWS, étale le court pic sur quelques secondes de plus sans coût supplémentaire, bien en dessous de l'objectif d'une minute.
  options:
    a:
      en: "Provisioned Throughput is billed for the purchased capacity whether it is used or not, which is costly for a burst of a few minutes a day."
      fr: "Le débit provisionné est facturé pour la capacité achetée, qu'elle soit utilisée ou non, ce qui est coûteux pour un pic de quelques minutes par jour."
    c:
      en: "Batch inference jobs are asynchronous and process prompts in bulk, so they do not guarantee that each ticket is classified within one minute."
      fr: "Les tâches d'inférence par lots sont asynchrones et traitent les invites en masse : elles ne garantissent pas que chaque ticket soit classé en moins d'une minute."
    b:
      en: "maxTokens limits the length of each response; it does not reduce the number of requests that reach the quota."
      fr: "maxTokens limite la longueur de chaque réponse ; il ne réduit pas le nombre de requêtes qui atteignent le quota."
references:
  - title: Converse
    url: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_runtime_Converse.html
