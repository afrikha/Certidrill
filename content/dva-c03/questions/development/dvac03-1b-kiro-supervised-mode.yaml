id: dvac03-1b-kiro-supervised-mode
objective: "1.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer asks the Kiro agent in the IDE to refactor the data access layer of an application. The developer wants Kiro to pause after each turn that edits files so that the developer can accept or reject each change before the agent continues.

    Which option should the developer select in the chat?
  fr: |
    Un développeur demande à l'agent Kiro dans l'IDE de refactoriser la couche d'accès aux données d'une application. Le développeur veut que Kiro marque une pause après chaque tour qui modifie des fichiers, afin de pouvoir accepter ou refuser chaque modification avant que l'agent continue.

    Quelle option le développeur doit-il sélectionner dans la conversation ?
body:
  options:
    - { id: a, text: "Supervised" }
    - { id: b, text: "Accept file changes" }
    - { id: c, text: "Approve for me" }
    - { id: d, text: { en: "Spec (workflow agent)", fr: "Spec (agent de flux de travail)" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In Supervised mode, Kiro pauses after each turn that edits files so that the developer can accept or reject each change, and it asks before actions in general. This gives the developer a review step on every AI-generated change.
    fr: |
      En mode Supervised, Kiro marque une pause après chaque tour qui modifie des fichiers afin que le développeur accepte ou refuse chaque modification, et il demande avant les actions en général. Le développeur dispose ainsi d'une étape de relecture pour chaque modification générée par l'IA.
  options:
    b:
      en: "Accept file changes (formerly Autopilot) lets Kiro edit files without asking; it asks only before running commands."
      fr: "Accept file changes (anciennement Autopilot) laisse Kiro modifier les fichiers sans demander ; il ne demande qu'avant d'exécuter des commandes."
    c:
      en: "Approve for me lets a model approve routine actions that it judges safe, so the developer does not review each change."
      fr: "Approve for me laisse un modèle approuver les actions courantes qu'il juge sûres : le développeur ne relit pas chaque modification."
    d:
      en: "Spec is a workflow agent that generates requirements, design and tasks; it is not a permission mode and does not set when Kiro pauses."
      fr: "Spec est un agent de flux de travail qui génère les exigences, la conception et les tâches ; ce n'est pas un mode d'autorisation et il ne détermine pas quand Kiro marque une pause."
references:
  - title: Permissions
    url: https://kiro.dev/docs/permissions/
  - title: Chat
    url: https://kiro.dev/docs/ide/chat/
