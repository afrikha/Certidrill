id: dvac03-1c-err-onfailure-destination
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Amazon S3 event notifications invoke an AWS Lambda function that processes uploaded invoices. Some invocations still fail after all retries. For each failed event, the operations team needs a record in an Amazon SQS standard queue that contains the original event, the function's error response, and the number of invocation attempts.

    Which solution will meet these requirements?
  fr: |
    Des notifications d'événements Amazon S3 appellent une fonction AWS Lambda qui traite des factures chargées. Certains appels échouent toujours après toutes les nouvelles tentatives. Pour chaque événement en échec, l'équipe d'exploitation a besoin, dans une file d'attente standard Amazon SQS, d'un enregistrement qui contient l'événement d'origine, la réponse d'erreur de la fonction et le nombre de tentatives d'appel.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure the SQS queue as the dead-letter queue of the function.", fr: "Configurer la file d'attente SQS comme file d'attente de lettres mortes (DLQ) de la fonction." } }
    - { id: b, text: { en: "Create an event source mapping between the SQS queue and the function.", fr: "Créer un mappage de source d'événements entre la file d'attente SQS et la fonction." } }
    - { id: c, text: { en: "Create a CloudWatch Logs subscription filter that sends the function's error logs to the SQS queue.", fr: "Créer un filtre d'abonnement CloudWatch Logs qui envoie les journaux d'erreur de la fonction à la file d'attente SQS." } }
    - { id: d, text: { en: "Configure the SQS queue as an on-failure destination of the function's asynchronous invocations.", fr: "Configurer la file d'attente SQS comme destination en cas d'échec des appels asynchrones de la fonction." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon S3 invokes the function asynchronously. An on-failure destination receives a JSON invocation record with the request payload, the response payload and a request context that includes approximateInvokeCount, which covers all three requirements."
    fr: "Amazon S3 appelle la fonction de manière asynchrone. Une destination en cas d'échec reçoit un enregistrement d'appel JSON avec la charge utile de la requête, la charge utile de la réponse et un contexte de requête qui inclut approximateInvokeCount, ce qui couvre les trois exigences."
  options:
    a:
      en: "A dead-letter queue receives the event with RequestID, ErrorCode and ErrorMessage attributes, but no response payload and no attempt count."
      fr: "Une file d'attente de lettres mortes reçoit l'événement avec les attributs RequestID, ErrorCode et ErrorMessage, mais sans charge utile de réponse ni nombre de tentatives."
    b:
      en: "An event source mapping makes the function read from the queue; it does not write failure records to it."
      fr: "Un mappage de source d'événements fait lire la file d'attente par la fonction ; il n'y écrit pas d'enregistrements d'échec."
    c:
      en: "Subscription filters do not support SQS as a destination, and log lines do not carry the original event and attempt count in a structured record."
      fr: "Les filtres d'abonnement ne prennent pas en charge SQS comme destination, et les lignes de journal ne fournissent pas l'événement d'origine et le nombre de tentatives dans un enregistrement structuré."
references:
  - title: Capturing records of Lambda asynchronous invocations
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-retain-records.html
