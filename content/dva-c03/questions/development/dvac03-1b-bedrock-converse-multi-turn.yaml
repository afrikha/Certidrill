id: dvac03-1b-bedrock-converse-multi-turn
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer builds a support chatbot that calls the Amazon Bedrock Converse API from an AWS Lambda function. Each request sends only the latest user question in `messages`. When users ask follow-up questions such as "And for the premium plan?", the model answers as if it had never seen the earlier conversation.

    Which change will make the model take the earlier turns into account?
  fr: |
    Un développeur crée un chatbot de support qui appelle l'API Converse d'Amazon Bedrock depuis une fonction AWS Lambda. Chaque requête n'envoie que la dernière question de l'utilisateur dans `messages`. Quand les utilisateurs posent des questions de suivi comme « Et pour l'offre premium ? », le modèle répond comme s'il n'avait jamais vu la conversation précédente.

    Quelle modification permet au modèle de tenir compte des tours précédents ?
body:
  options:
    - id: a
      text: { en: "Store the conversation and send all its previous user and assistant messages, followed by the new question, in messages.", fr: "Stocker la conversation et envoyer tous ses messages user et assistant précédents, suivis de la nouvelle question, dans messages." }
    - id: b
      text: { en: "Send the conversation ID in the requestMetadata field so that Amazon Bedrock restores the previous turns.", fr: "Envoyer l'ID de la conversation dans le champ requestMetadata afin qu'Amazon Bedrock restaure les tours précédents." }
    - id: c
      text: { en: "Increase maxTokens in inferenceConfig so that the model keeps more of the conversation in memory.", fr: "Augmenter maxTokens dans inferenceConfig afin que le modèle garde davantage de la conversation en mémoire." }
    - id: d
      text: { en: "Call ConverseStream instead of Converse so that the connection with the model stays open between turns.", fr: "Appeler ConverseStream au lieu de Converse afin que la connexion avec le modèle reste ouverte entre les tours." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Converse API is stateless. To keep context, the application includes all the messages of the conversation in each request, using the role field to mark whether each message comes from the user or from the assistant. The Lambda function must therefore store the history, for example in Amazon DynamoDB, and send it with each new question.
    fr: |
      L'API Converse est sans état. Pour conserver le contexte, l'application inclut tous les messages de la conversation dans chaque requête, en utilisant le champ role pour indiquer si chaque message vient de l'utilisateur ou de l'assistant. La fonction Lambda doit donc stocker l'historique, par exemple dans Amazon DynamoDB, et l'envoyer avec chaque nouvelle question.
  options:
    b:
      en: "Request metadata labels the invocation, for example for logs; Amazon Bedrock does not store or restore conversations from it."
      fr: "Les métadonnées de requête étiquettent l'invocation, par exemple pour les journaux ; Amazon Bedrock ne stocke ni ne restaure de conversation à partir de celles-ci."
    c:
      en: "maxTokens limits the length of the generated response; it does not give the model access to earlier messages."
      fr: "maxTokens limite la longueur de la réponse générée ; il ne donne pas au modèle l'accès aux messages précédents."
    d:
      en: "ConverseStream streams one response; each call is still independent and needs the full message history."
      fr: "ConverseStream diffuse une seule réponse en continu ; chaque appel reste indépendant et a besoin de l'historique complet des messages."
references:
  - title: Inference using Converse API
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
