id: dvac03-1d-ddb-rcu-eventual
objective: "1.3.4"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    AnyCompany is configuring an Amazon DynamoDB table in provisioned capacity mode. The application reads 120 items each second with GetItem calls. Each item is 6 KB, and the application uses eventually consistent reads.

    What is the minimum number of read capacity units (RCUs) that the table needs for this workload?
  fr: |
    AnyCompany configure une table Amazon DynamoDB en mode de capacité provisionnée. L'application lit 120 éléments par seconde avec des appels GetItem. Chaque élément fait 6 Ko, et l'application utilise des lectures à cohérence éventuelle.

    Quel est le nombre minimal d'unités de capacité de lecture (RCU) dont la table a besoin pour cette charge de travail ?
body:
  options:
    - { id: a, text: "60" }
    - { id: b, text: "90" }
    - { id: c, text: "120" }
    - { id: d, text: "240" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      One RCU is one strongly consistent read per second, or two eventually consistent reads per second, of an item up to 4 KB. The item size is rounded up to the next 4 KB, so a 6 KB item needs 2 RCUs for a strongly consistent read and 1 RCU for an eventually consistent read. 120 reads × 1 RCU = 120 RCUs.
    fr: |
      Une RCU correspond à une lecture fortement cohérente par seconde, ou à deux lectures à cohérence éventuelle par seconde, d'un élément de 4 Ko au plus. La taille de l'élément est arrondie au multiple de 4 Ko supérieur : un élément de 6 Ko exige 2 RCU pour une lecture fortement cohérente et 1 RCU pour une lecture à cohérence éventuelle. 120 lectures × 1 RCU = 120 RCU.
  options:
    a: { en: "60 rounds the 6 KB item down to 4 KB, but the size is always rounded up to the next 4 KB.", fr: "60 arrondit l'élément de 6 Ko à 4 Ko par défaut, alors que la taille est toujours arrondie au multiple de 4 Ko supérieur." }
    b: { en: "90 uses 1.5 units per item without rounding; DynamoDB rounds the item size up to 8 KB, which is 2 units.", fr: "90 utilise 1,5 unité par élément sans arrondi ; DynamoDB arrondit la taille de l'élément à 8 Ko, soit 2 unités." }
    d: { en: "240 is the capacity for strongly consistent reads; eventually consistent reads need half of it.", fr: "240 est la capacité requise pour des lectures fortement cohérentes ; les lectures à cohérence éventuelle en exigent la moitié." }
references:
  - title: DynamoDB provisioned capacity mode
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/provisioned-capacity-mode.html
