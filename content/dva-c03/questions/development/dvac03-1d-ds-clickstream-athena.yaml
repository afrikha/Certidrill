id: dvac03-1d-ds-clickstream-athena
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's web application sends clickstream events to Amazon Data Firehose, which delivers them to an Amazon S3 bucket as Parquet files. Several terabytes are added each month. A few analysts run ad hoc SQL queries on the events a few times each week, and query results within seconds to minutes are acceptable.

    The solution must be the MOST cost-effective and must not require any infrastructure to manage.

    Which solution will meet these requirements?
  fr: |
    L'application web d'AnyCompany envoie des événements de parcours de navigation (clickstream) à Amazon Data Firehose, qui les livre dans un compartiment Amazon S3 sous forme de fichiers Parquet. Plusieurs téraoctets s'ajoutent chaque mois. Quelques analystes exécutent des requêtes SQL ad hoc sur les événements quelques fois par semaine, et des résultats en quelques secondes ou minutes sont acceptables.

    La solution doit être la PLUS rentable et ne doit exiger aucune infrastructure à gérer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Query the Parquet files in place in Amazon S3 with Amazon Athena.", fr: "Interroger les fichiers Parquet sur place dans Amazon S3 avec Amazon Athena." } }
    - { id: b, text: { en: "Load the files into an Amazon Aurora PostgreSQL cluster each night and query the cluster with SQL.", fr: "Charger les fichiers chaque nuit dans un cluster Amazon Aurora PostgreSQL et interroger le cluster en SQL." } }
    - { id: c, text: { en: "Import the files into an Amazon DynamoDB table and run Scan operations with filter expressions.", fr: "Importer les fichiers dans une table Amazon DynamoDB et exécuter des opérations Scan avec des expressions de filtre." } }
    - { id: d, text: { en: "Index the events into a provisioned Amazon OpenSearch Service domain and query it with SQL.", fr: "Indexer les événements dans un domaine Amazon OpenSearch Service provisionné et l'interroger en SQL." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Athena is a serverless, interactive query service that runs standard SQL directly on data stored in Amazon S3, with no loading step. The company pays only for the queries it runs, which suits a few ad hoc queries each week, and there is no cluster to manage.
    fr: |
      Athena est un service de requêtes interactif et serverless qui exécute du SQL standard directement sur les données stockées dans Amazon S3, sans étape de chargement. L'entreprise ne paie que les requêtes exécutées, ce qui convient à quelques requêtes ad hoc par semaine, et il n'y a aucun cluster à gérer.
  options:
    b: { en: "A database cluster runs and is billed continuously for a few queries each week, and the nightly load is extra work to build and operate.", fr: "Un cluster de base de données tourne et est facturé en continu pour quelques requêtes par semaine, et le chargement nocturne est un travail supplémentaire à créer et à exploiter." }
    c: { en: "DynamoDB has no ad hoc SQL, and repeated Scans of terabytes of data consume large amounts of read capacity.", fr: "DynamoDB n'offre pas de SQL ad hoc, et des Scans répétés de téraoctets de données consomment beaucoup de capacité de lecture." }
    d: { en: "A provisioned domain is infrastructure that runs and is billed continuously, which is not cost-effective for occasional queries.", fr: "Un domaine provisionné est une infrastructure qui tourne et est facturée en continu, ce qui n'est pas rentable pour des requêtes occasionnelles." }
references:
  - title: What is Amazon Athena?
    url: https://docs.aws.amazon.com/athena/latest/ug/what-is.html
