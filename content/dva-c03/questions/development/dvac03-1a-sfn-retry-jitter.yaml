id: dvac03-1a-sfn-retry-jitter
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs thousands of concurrent AWS Step Functions executions. A Task state calls a partner API through a Lambda function, which raises a PartnerThrottled error when the API throttles. The Task state has this retrier:

    ```json
    "Retry": [
      {
        "ErrorEquals": ["PartnerThrottled"],
        "IntervalSeconds": 3,
        "MaxAttempts": 4,
        "BackoffRate": 2,
        "MaxDelaySeconds": 30
      }
    ]
    ```

    The retries of all the executions reach the partner API at the same moments and are throttled again.

    Which change will spread the retries over time?
  fr: |
    Une entreprise exécute des milliers d'exécutions AWS Step Functions simultanées. Un état Task appelle l'API d'un partenaire via une fonction Lambda, qui lève une erreur PartnerThrottled quand l'API applique une limitation. L'état Task possède ce dispositif de nouvelle tentative :

    ```json
    "Retry": [
      {
        "ErrorEquals": ["PartnerThrottled"],
        "IntervalSeconds": 3,
        "MaxAttempts": 4,
        "BackoffRate": 2,
        "MaxDelaySeconds": 30
      }
    ]
    ```

    Les nouvelles tentatives de toutes les exécutions atteignent l'API du partenaire aux mêmes instants et sont de nouveau limitées.

    Quelle modification répartira les nouvelles tentatives dans le temps ?
body:
  options:
    - id: a
      text: { en: "Add `\"JitterStrategy\": \"FULL\"` to the retrier.", fr: "Ajouter `\"JitterStrategy\": \"FULL\"` au dispositif de nouvelle tentative." }
    - id: b
      text: { en: "Set `\"BackoffRate\"` to 1 so that every wait lasts 3 seconds.", fr: "Définir `\"BackoffRate\"` à 1 pour que chaque attente dure 3 secondes." }
    - id: c
      text: { en: "Add a Catch field with `\"ErrorEquals\": [\"States.ALL\"]` to the Task state.", fr: "Ajouter à l'état Task un champ Catch avec `\"ErrorEquals\": [\"States.ALL\"]`." }
    - id: d
      text: { en: "Replace `\"PartnerThrottled\"` with `\"States.ALL\"` in `ErrorEquals`.", fr: "Remplacer `\"PartnerThrottled\"` par `\"States.ALL\"` dans `ErrorEquals`." }
answer: { optionId: a }
explanation:
  correct:
    en: "JitterStrategy defaults to NONE, so every execution waits exactly the same computed interval. With FULL, Step Functions randomizes each wait between 0 and the computed interval, which spreads the retries of concurrent executions instead of sending them in synchronized bursts."
    fr: "JitterStrategy vaut NONE par défaut : chaque exécution attend exactement le même intervalle calculé. Avec FULL, Step Functions rend chaque attente aléatoire entre 0 et l'intervalle calculé, ce qui répartit les nouvelles tentatives des exécutions simultanées au lieu de les envoyer par pics synchronisés."
  options:
    b:
      en: "A BackoffRate of 1 removes the exponential growth but keeps every execution on the same schedule, so the retries stay synchronized."
      fr: "Un BackoffRate de 1 supprime la croissance exponentielle mais garde toutes les exécutions sur le même calendrier : les nouvelles tentatives restent synchronisées."
    c:
      en: "A catcher runs only after the retries are exhausted; it doesn't change when the retries happen."
      fr: "Un dispositif Catch ne s'exécute qu'après l'épuisement des nouvelles tentatives ; il ne change pas le moment des nouvelles tentatives."
    d:
      en: "Matching every error retries more failures but with the same synchronized waits."
      fr: "Intercepter toutes les erreurs relance davantage d'échecs, mais avec les mêmes attentes synchronisées."
references:
  - title: Handling errors in Step Functions workflows
    url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html
