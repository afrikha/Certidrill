id: dvac03-1c-life-ddb-ttl-sessions
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A web application stores user sessions in an Amazon DynamoDB table. Sessions expire 24 hours after the user's last activity, and expired sessions must then be removed from the table automatically; the exact deletion time is not important. The deletions must not consume write capacity, and the team wants the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Une application web stocke les sessions des utilisateurs dans une table Amazon DynamoDB. Les sessions expirent 24 heures après la dernière activité de l'utilisateur, et les sessions expirées doivent ensuite être supprimées automatiquement de la table ; l'heure exacte de suppression n'a pas d'importance. Les suppressions ne doivent pas consommer de capacité d'écriture, et l'équipe souhaite le MOINS d'effort de développement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon EventBridge Scheduler schedule that runs a Lambda function every hour to scan the table and delete old sessions.", fr: "Créer une planification Amazon EventBridge Scheduler qui exécute toutes les heures une fonction Lambda pour analyser la table et supprimer les anciennes sessions." } }
    - { id: b, text: { en: "Turn on DynamoDB Streams, and use a Lambda function to delete each session 24 hours after it is written.", fr: "Activer DynamoDB Streams, et utiliser une fonction Lambda pour supprimer chaque session 24 heures après son écriture." } }
    - { id: c, text: { en: "Turn on time to live (TTL) on an expiresAt attribute, and write the last activity time plus 86,400 seconds as a Number in epoch seconds.", fr: "Activer la durée de vie (TTL) sur un attribut expiresAt, et y écrire l'heure de la dernière activité plus 86 400 secondes sous forme de Number en secondes epoch." } }
    - { id: d, text: { en: "Create an Amazon S3 Lifecycle rule that expires the session items 1 day after they are written.", fr: "Créer une règle S3 Lifecycle qui fait expirer les éléments de session 1 jour après leur écriture." } }
answer: { optionId: c }
explanation:
  correct:
    en: "DynamoDB TTL deletes items whose TTL attribute, a Number in Unix epoch seconds, is in the past, usually within a few days of expiration. The TTL deletes do not consume write capacity units, and refreshing expiresAt at each activity keeps active sessions alive."
    fr: "La TTL de DynamoDB supprime les éléments dont l'attribut TTL, un Number en secondes epoch Unix, est dans le passé, généralement dans les quelques jours qui suivent l'expiration. Les suppressions TTL ne consomment pas d'unités de capacité d'écriture, et actualiser expiresAt à chaque activité garde les sessions actives."
  options:
    a:
      en: "Scans and deletes consume read and write capacity, and the schedule and function are extra code to maintain."
      fr: "Les analyses et les suppressions consomment de la capacité de lecture et d'écriture, et la planification et la fonction sont du code supplémentaire à maintenir."
    b:
      en: "A stream delivers changes as they happen; deleting items from a function consumes write capacity and requires custom delay logic."
      fr: "Un flux transmet les modifications au fil de l'eau ; supprimer des éléments depuis une fonction consomme de la capacité d'écriture et exige une logique de délai personnalisée."
    d:
      en: "S3 Lifecycle rules apply to objects in S3 buckets, not to items in DynamoDB tables."
      fr: "Les règles S3 Lifecycle s'appliquent aux objets des compartiments S3, pas aux éléments des tables DynamoDB."
references:
  - title: Using time to live (TTL) in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html
