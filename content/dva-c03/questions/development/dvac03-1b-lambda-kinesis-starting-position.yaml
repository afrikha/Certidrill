id: dvac03-1b-lambda-kinesis-starting-position
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has an Amazon Kinesis data stream with a 7-day retention period that already contains several days of order records. A developer creates a new AWS Lambda event source mapping for a reporting function. The function must process all the records that are currently in the stream, starting with the oldest, and then the new records.

    Which starting position should the developer configure?
  fr: |
    Une entreprise dispose d'un flux de données Amazon Kinesis avec une période de conservation de 7 jours, qui contient déjà plusieurs jours d'enregistrements de commandes. Un développeur crée un nouveau mappage de source d'événements AWS Lambda pour une fonction de rapports. La fonction doit traiter tous les enregistrements présents dans le flux, en commençant par le plus ancien, puis les nouveaux enregistrements.

    Quelle position de départ le développeur doit-il configurer ?
body:
  options:
    - { id: a, text: "LATEST" }
    - { id: b, text: "TRIM_HORIZON" }
    - { id: c, text: { en: "AT_TIMESTAMP with the current time", fr: "AT_TIMESTAMP avec l'heure actuelle" } }
    - { id: d, text: { en: "AT_TIMESTAMP with a time 24 hours ago", fr: "AT_TIMESTAMP avec une heure située 24 heures plus tôt" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      TRIM_HORIZON starts reading at the oldest record that is still available in each shard, so the function first processes the existing records and then continues with new ones. The starting position is required for a Kinesis event source mapping and accepts AT_TIMESTAMP, TRIM_HORIZON or LATEST.
    fr: |
      TRIM_HORIZON commence la lecture au plus ancien enregistrement encore disponible dans chaque partition (shard) : la fonction traite d'abord les enregistrements existants, puis continue avec les nouveaux. La position de départ est obligatoire pour un mappage de source d'événements Kinesis et accepte AT_TIMESTAMP, TRIM_HORIZON ou LATEST.
  options:
    a:
      en: "LATEST reads only records that arrive after the mapping is created, so the existing records are skipped."
      fr: "LATEST ne lit que les enregistrements qui arrivent après la création du mappage : les enregistrements existants sont ignorés."
    c:
      en: "Starting at the current time skips every record already in the stream, like LATEST."
      fr: "Commencer à l'heure actuelle ignore tous les enregistrements déjà présents dans le flux, comme LATEST."
    d:
      en: "Starting 24 hours ago skips the older records that the 7-day retention still keeps in the stream."
      fr: "Commencer 24 heures plus tôt ignore les enregistrements plus anciens que la conservation de 7 jours garde encore dans le flux."
references:
  - title: Lambda parameters for Amazon Kinesis Data Streams event source mappings
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-kinesis-parameters.html
