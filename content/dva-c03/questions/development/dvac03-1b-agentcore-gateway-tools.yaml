id: dvac03-1b-agentcore-gateway-tools
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company builds an AI agent that must call existing AWS Lambda functions and an internal REST API described by an OpenAPI specification. The agent framework consumes tools through the Model Context Protocol (MCP). The company wants to expose these functions and the API as MCP tools behind a single managed endpoint with OAuth authorization for callers, without writing or hosting an MCP server.

    Which solution will meet these requirements?
  fr: |
    Une entreprise crée un agent d'IA qui doit appeler des fonctions AWS Lambda existantes et une API REST interne décrite par une spécification OpenAPI. Le framework d'agent consomme les outils au moyen du Model Context Protocol (MCP). L'entreprise veut exposer ces fonctions et l'API comme outils MCP derrière un point de terminaison géré unique, avec une autorisation OAuth pour les appelants, sans écrire ni héberger de serveur MCP.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run the functions and the API calls in an Amazon Bedrock AgentCore Code Interpreter session.", fr: "Exécuter les fonctions et les appels d'API dans une session Amazon Bedrock AgentCore Code Interpreter." }
    - id: b
      text: { en: "Write an MCP server that wraps the functions and the API, and run it on Amazon ECS behind an Application Load Balancer.", fr: "Écrire un serveur MCP qui encapsule les fonctions et l'API, et l'exécuter sur Amazon ECS derrière un Application Load Balancer." }
    - id: c
      text: { en: "Put the functions and the REST API behind an Amazon API Gateway REST API with a Lambda authorizer.", fr: "Placer les fonctions et l'API REST derrière une API REST Amazon API Gateway avec un mécanisme d'autorisation Lambda." }
    - id: d
      text: { en: "Create an Amazon Bedrock AgentCore gateway with a Lambda target for the functions and an OpenAPI target for the REST API.", fr: "Créer une passerelle Amazon Bedrock AgentCore (gateway) avec une cible Lambda pour les fonctions et une cible OpenAPI pour l'API REST." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      AgentCore Gateway converts APIs, Lambda functions and existing services into MCP-compatible tools, with OpenAPI, Smithy and Lambda as tool input types. It manages inbound OAuth authorization of agents and users, and outbound credentials for the tools, so the agent reaches all the tools through one managed endpoint without a custom MCP server.
    fr: |
      AgentCore Gateway convertit des API, des fonctions Lambda et des services existants en outils compatibles MCP, avec OpenAPI, Smithy et Lambda comme types d'entrée d'outils. Il gère l'autorisation OAuth entrante des agents et des utilisateurs, ainsi que les informations d'identification sortantes des outils : l'agent atteint tous les outils par un point de terminaison géré unique, sans serveur MCP personnalisé.
  options:
    b:
      en: "A custom MCP server on ECS meets the protocol need but means writing and hosting the server, which the company wants to avoid."
      fr: "Un serveur MCP personnalisé sur ECS répond au besoin de protocole, mais implique d'écrire et d'héberger le serveur, ce que l'entreprise veut éviter."
    c:
      en: "API Gateway exposes REST endpoints, not MCP tools, so the MCP-based agent framework cannot consume them as tools."
      fr: "API Gateway expose des points de terminaison REST, pas des outils MCP : le framework d'agent basé sur MCP ne peut pas les consommer comme outils."
    a:
      en: "Code Interpreter is an isolated sandbox in which agents run code; it does not expose existing functions and APIs as MCP tools."
      fr: "Code Interpreter est un bac à sable isolé dans lequel les agents exécutent du code ; il n'expose pas des fonctions et API existantes comme outils MCP."
references:
  - title: "Amazon Bedrock AgentCore Gateway: A secure AI gateway for agents, tools, and models"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html
