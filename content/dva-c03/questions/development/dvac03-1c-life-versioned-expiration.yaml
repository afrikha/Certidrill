id: dvac03-1c-life-versioned-expiration
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application writes temporary files to the tmp/ prefix of an Amazon S3 bucket with single PUT requests. Versioning is enabled on the bucket. An S3 Lifecycle rule for the tmp/ prefix contains an Expiration action with Days set to 7. After several months, a listing of tmp/ shows no objects, but the storage used by the prefix keeps growing.

    Which change will stop the storage growth?
  fr: |
    Une application écrit des fichiers temporaires sous le préfixe tmp/ d'un compartiment Amazon S3 par des requêtes PUT uniques. La gestion des versions est activée sur le compartiment. Une règle S3 Lifecycle pour le préfixe tmp/ contient une action Expiration avec Days défini à 7. Après plusieurs mois, une liste de tmp/ n'affiche aucun objet, mais le stockage utilisé par le préfixe ne cesse de croître.

    Quelle modification arrête la croissance du stockage ?
body:
  options:
    - { id: a, text: { en: "Add an AbortIncompleteMultipartUpload action to the rule.", fr: "Ajouter une action AbortIncompleteMultipartUpload à la règle." } }
    - { id: b, text: { en: "Suspend versioning on the bucket.", fr: "Suspendre la gestion des versions sur le compartiment." } }
    - { id: c, text: { en: "Set Days to 1 in the Expiration action of the rule.", fr: "Définir Days à 1 dans l'action Expiration de la règle." } }
    - { id: d, text: { en: "Add a NoncurrentVersionExpiration action to the rule.", fr: "Ajouter une action NoncurrentVersionExpiration à la règle." } }
answer: { optionId: d }
explanation:
  correct:
    en: "In a versioning-enabled bucket, the Expiration action adds a delete marker that becomes the current version, and the data version becomes noncurrent. The listing hides these objects, but the noncurrent versions are still stored and billed until a NoncurrentVersionExpiration action deletes them permanently."
    fr: "Dans un compartiment dont la gestion des versions est activée, l'action Expiration ajoute un marqueur de suppression qui devient la version actuelle, et la version des données devient non actuelle. La liste masque ces objets, mais les versions non actuelles restent stockées et facturées jusqu'à ce qu'une action NoncurrentVersionExpiration les supprime définitivement."
  options:
    a:
      en: "The application uses single PUT requests, so there are no incomplete multipart uploads to clean up."
      fr: "L'application utilise des requêtes PUT uniques : il n'y a pas de chargements partitionnés incomplets à nettoyer."
    b:
      en: "Suspending versioning does not remove the noncurrent versions that already exist."
      fr: "Suspendre la gestion des versions ne supprime pas les versions non actuelles qui existent déjà."
    c:
      en: "A shorter expiration only adds delete markers sooner; the noncurrent versions still accumulate."
      fr: "Une expiration plus courte ajoute seulement les marqueurs de suppression plus tôt ; les versions non actuelles continuent de s'accumuler."
references:
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
