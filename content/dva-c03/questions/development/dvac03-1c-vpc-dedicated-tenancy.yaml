id: dvac03-1c-vpc-dedicated-tenancy
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial company runs an internal REST service on Amazon EC2 instances in a VPC that was created with dedicated instance tenancy. The tenancy of this VPC cannot be changed. A new AWS Lambda function must call the service privately. The developer's attempt to connect the function to subnets of this VPC fails.

    Which solution will meet these requirements?
  fr: |
    Une entreprise financière exécute un service REST interne sur des instances Amazon EC2 dans un VPC créé avec la location d'instance dédiée (dedicated tenancy). La location de ce VPC ne peut pas être modifiée. Une nouvelle fonction AWS Lambda doit appeler le service en privé. La tentative du développeur de connecter la fonction à des sous-réseaux de ce VPC échoue.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Request a quota increase so that Lambda can create its network interfaces in VPCs that use dedicated instance tenancy.", fr: "Demander une augmentation de quota afin que Lambda puisse créer ses interfaces réseau dans des VPC qui utilisent la location d'instance dédiée." } }
    - { id: b, text: { en: "Create an interface VPC endpoint for Lambda in the dedicated VPC, and call the REST service through the endpoint from the function.", fr: "Créer un point de terminaison de VPC de type interface pour Lambda dans le VPC dédié, et appeler le service REST par ce point de terminaison depuis la fonction." } }
    - { id: c, text: { en: "Turn on Ipv6AllowedForDualStack for the function, and connect the function to dual-stack subnets of the dedicated VPC.", fr: "Activer Ipv6AllowedForDualStack pour la fonction, et connecter la fonction à des sous-réseaux à double pile du VPC dédié." } }
    - { id: d, text: { en: "Connect the function to a VPC with default tenancy, and peer that VPC with the dedicated VPC, with routes for the peering connection.", fr: "Connecter la fonction à un VPC avec la location par défaut, et établir un peering entre ce VPC et le VPC dédié, avec des routes pour la connexion de peering." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Lambda functions cannot connect directly to a VPC with dedicated instance tenancy. The documented workaround is to connect the function to a VPC with default tenancy and peer that VPC with the dedicated VPC, with routes and security group rules that allow the traffic to the service."
    fr: "Les fonctions Lambda ne peuvent pas se connecter directement à un VPC avec location d'instance dédiée. La solution documentée consiste à connecter la fonction à un VPC avec location par défaut et à établir un peering entre ce VPC et le VPC dédié, avec des routes et des règles de groupe de sécurité qui autorisent le trafic vers le service."
  options:
    a:
      en: "The restriction on dedicated tenancy is not a quota, so no quota increase removes it."
      fr: "La restriction sur la location dédiée n'est pas un quota : aucune augmentation de quota ne la supprime."
    b:
      en: "An interface endpoint for Lambda lets resources in the VPC call the Lambda API; it does not give the function a path into the VPC."
      fr: "Un point de terminaison de type interface pour Lambda permet aux ressources du VPC d'appeler l'API Lambda ; il ne donne pas à la fonction de chemin vers le VPC."
    c:
      en: "IPv6 settings do not change tenancy; the function still cannot connect to subnets of the dedicated VPC."
      fr: "Les paramètres IPv6 ne changent pas la location ; la fonction ne peut toujours pas se connecter aux sous-réseaux du VPC dédié."
references:
  - title: Giving Lambda Event Functions access to resources in an Amazon VPC
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html
