id: dvac03-1a-tight-coupling-signs
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer reviews an order application before splitting it into services. The developer lists several observations about how its components interact.

    Which two observations indicate that components are tightly coupled? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur examine une application de commande avant de la découper en services. Il note plusieurs observations sur la façon dont ses composants interagissent.

    Quelles sont les deux observations qui indiquent que des composants sont fortement couplés ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The order component writes order events to an Amazon SQS queue, and the invoicing component polls the queue.", fr: "Le composant de commande écrit des événements de commande dans une file d'attente Amazon SQS, et le composant de facturation interroge la file." } }
    - { id: b, text: { en: "The order component calls the payment component at a fixed IP address and waits for its response before it confirms an order.", fr: "Le composant de commande appelle le composant de paiement à une adresse IP fixe et attend sa réponse avant de confirmer une commande." } }
    - { id: c, text: { en: "The order component publishes events to an Amazon EventBridge event bus, and other components choose the events they receive.", fr: "Le composant de commande publie des événements sur un bus d'événements Amazon EventBridge, et les autres composants choisissent les événements qu'ils reçoivent." } }
    - { id: d, text: { en: "Each component reads its database endpoint from AWS Systems Manager Parameter Store when it starts.", fr: "Chaque composant lit le point de terminaison de sa base de données dans AWS Systems Manager Parameter Store au démarrage." } }
    - { id: e, text: { en: "When the shipping component fails, the order API returns errors to customers.", fr: "Quand le composant d'expédition tombe en panne, l'API de commande renvoie des erreurs aux clients." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Tight coupling means that a component depends directly on the location, availability and response time of another one. A synchronous call to a hard-coded address, and a failure that spreads from the shipping component to the order API, both show this dependency."
    fr: "Un couplage fort signifie qu'un composant dépend directement de l'emplacement, de la disponibilité et du temps de réponse d'un autre. Un appel synchrone vers une adresse codée en dur, et une panne qui se propage du composant d'expédition à l'API de commande, montrent tous deux cette dépendance."
  options:
    a:
      en: "A queue between the components is loose coupling: the producer doesn't need the consumer to be available or to answer."
      fr: "Une file d'attente entre les composants est un couplage faible : le producteur n'a pas besoin que le consommateur soit disponible ni qu'il réponde."
    c:
      en: "Publishing to an event bus is loose coupling: the producer doesn't know which components consume its events."
      fr: "Publier sur un bus d'événements est un couplage faible : le producteur ne sait pas quels composants consomment ses événements."
    d:
      en: "Reading configuration from Parameter Store externalizes settings; it does not make one component depend on another."
      fr: "Lire la configuration dans Parameter Store externalise les paramètres ; cela ne rend pas un composant dépendant d'un autre."
references:
  - title: Amazon SQS visibility timeout
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html
  - title: Amazon EventBridge event bus (default and Classic)
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-bus.html
