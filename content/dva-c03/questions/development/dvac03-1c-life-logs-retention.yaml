id: dvac03-1c-life-logs-retention
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The log group /aws/lambda/orders of an AWS Lambda function keeps growing, and its storage cost increases every month. The logs are needed for only 30 days.

    Which solution will meet these requirements?
  fr: |
    Le groupe de journaux /aws/lambda/orders d'une fonction AWS Lambda ne cesse de croître, et son coût de stockage augmente chaque mois. Les journaux ne sont nécessaires que pendant 30 jours.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an S3 Lifecycle rule that expires the objects of the /aws/lambda/orders log group after 30 days.", fr: "Créer une règle S3 Lifecycle qui fait expirer les objets du groupe de journaux /aws/lambda/orders après 30 jours." } }
    - { id: b, text: { en: "Run `aws logs put-retention-policy --log-group-name /aws/lambda/orders --retention-in-days 30`.", fr: "Exécuter `aws logs put-retention-policy --log-group-name /aws/lambda/orders --retention-in-days 30`." } }
    - { id: c, text: { en: "Set the application log level of the function to ERROR in its logging configuration.", fr: "Définir le niveau de journalisation de l'application de la fonction sur ERROR dans sa configuration de journalisation." } }
    - { id: d, text: { en: "Create a subscription filter that streams the log group to an Amazon Data Firehose stream.", fr: "Créer un filtre d'abonnement qui diffuse le groupe de journaux vers un flux Amazon Data Firehose." } }
answer: { optionId: b }
explanation:
  correct:
    en: "By default, CloudWatch Logs keeps log events indefinitely (Never Expire). PutRetentionPolicy sets the retention of a log group, here 30 days, and events older than the setting are deleted, usually within 72 hours after they expire."
    fr: "Par défaut, CloudWatch Logs conserve les événements de journal indéfiniment (Never Expire). PutRetentionPolicy définit la conservation d'un groupe de journaux, ici 30 jours, et les événements plus anciens que ce paramètre sont supprimés, généralement dans les 72 heures qui suivent leur expiration."
  options:
    a:
      en: "Log groups are not stored as objects in an S3 bucket, so S3 Lifecycle rules do not apply to them."
      fr: "Les groupes de journaux ne sont pas stockés sous forme d'objets dans un compartiment S3 : les règles S3 Lifecycle ne s'y appliquent pas."
    c:
      en: "A higher log level reduces the volume of new logs, but the existing logs are still kept forever."
      fr: "Un niveau de journalisation plus élevé réduit le volume des nouveaux journaux, mais les journaux existants restent conservés indéfiniment."
    d:
      en: "A subscription filter copies log events to another destination; it does not delete them from the log group."
      fr: "Un filtre d'abonnement copie les événements de journal vers une autre destination ; il ne les supprime pas du groupe de journaux."
references:
  - title: PutRetentionPolicy
    url: https://docs.aws.amazon.com/AmazonCloudWatchLogs/latest/APIReference/API_PutRetentionPolicy.html
  - title: Working with log groups and log streams
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/Working-with-log-groups-and-streams.html
