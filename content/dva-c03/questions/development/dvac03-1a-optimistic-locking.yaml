id: dvac03-1a-optimistic-locking
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Two worker processes update the same Amazon DynamoDB item. Each worker reads the item, changes some attributes in memory, and writes the whole item back with put_item. Sometimes one worker's changes are lost. The item has a numeric version attribute. The developer wants to detect conflicting writes without locking the item.

    Which solution will meet these requirements?
  fr: |
    Deux processus de travail mettent à jour le même élément Amazon DynamoDB. Chaque processus lit l'élément, modifie certains attributs en mémoire et réécrit l'élément entier avec put_item. Parfois, les modifications d'un processus sont perdues. L'élément possède un attribut numérique version. Le développeur veut détecter les écritures en conflit sans verrouiller l'élément.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Write only if version still equals the value read, increment version in the same write, and retry if the condition fails.", fr: "N'écrire que si version est toujours égal à la valeur lue, incrémenter version dans la même écriture, et réessayer si la condition échoue." }
    - id: b
      text: { en: "Read the item with ConsistentRead=True before each change so that each worker starts from the latest version.", fr: "Lire l'élément avec ConsistentRead=True avant chaque modification pour que chaque processus parte de la dernière version." }
    - id: c
      text: { en: "Increment the version attribute with an UpdateItem ADD action after each put_item call completes.", fr: "Incrémenter l'attribut version avec une action UpdateItem ADD après chaque appel put_item." }
    - id: d
      text: { en: "Write the item with TransactWriteItems instead of put_item so that each write is atomic.", fr: "Écrire l'élément avec TransactWriteItems au lieu de put_item pour que chaque écriture soit atomique." }
answer: { optionId: a }
explanation:
  correct:
    en: "This is optimistic locking: the write succeeds only if the stored version is still the one the worker read. If another worker wrote first, DynamoDB rejects the write with ConditionalCheckFailedException, and the worker re-reads the item and applies its change again, so no update is lost."
    fr: "C'est le verrouillage optimiste : l'écriture ne réussit que si la version stockée est toujours celle que le processus a lue. Si un autre processus a écrit avant, DynamoDB rejette l'écriture avec ConditionalCheckFailedException, et le processus relit l'élément et applique de nouveau sa modification : aucune mise à jour n'est perdue."
  options:
    b:
      en: "A strongly consistent read returns the latest item, but another worker can still write between the read and the put, which then overwrites it."
      fr: "Une lecture fortement cohérente renvoie l'élément le plus récent, mais un autre processus peut toujours écrire entre la lecture et le put, qui l'écrase alors."
    c:
      en: "Incrementing the version after an unconditional put doesn't stop the put from overwriting the other worker's changes."
      fr: "Incrémenter la version après un put inconditionnel n'empêche pas ce put d'écraser les modifications de l'autre processus."
    d:
      en: "A transaction without a condition is still an unconditional overwrite; it makes several writes atomic but doesn't detect conflicts."
      fr: "Une transaction sans condition reste un écrasement inconditionnel ; elle rend plusieurs écritures atomiques mais ne détecte pas les conflits."
references:
  - title: DynamoDB and optimistic locking with version number
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DynamoDBMapper.OptimisticLocking.html
  - title: Working with items and attributes in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithItems.html
