id: dvac03-1a-ecs-task-role-creds
objective: "1.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A containerized application on Amazon ECS with AWS Fargate reads objects from an Amazon S3 bucket by using the AWS SDK for Python (Boto3). The current container image contains the access keys of an IAM user. The company wants to remove the long-term keys and use the MOST secure credentials.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une application conteneurisée sur Amazon ECS avec AWS Fargate lit des objets dans un compartiment Amazon S3 à l'aide du kit SDK AWS pour Python (Boto3). L'image de conteneur actuelle contient les clés d'accès d'un utilisateur IAM. L'entreprise veut supprimer les clés à long terme et utiliser les informations d'identification les PLUS sécurisées.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an IAM role that allows s3:GetObject on the bucket and set it as the task role in the task definition.", fr: "Créer un rôle IAM qui autorise s3:GetObject sur le compartiment et le définir comme rôle de tâche dans la définition de tâche." } }
    - { id: b, text: { en: "Add s3:GetObject on the bucket to the task execution role of the task definition.", fr: "Ajouter s3:GetObject sur le compartiment au rôle d'exécution de tâche de la définition de tâche." } }
    - { id: c, text: { en: "Pass the access keys as environment variables in the task definition instead of the image.", fr: "Passer les clés d'accès sous forme de variables d'environnement dans la définition de tâche au lieu de l'image." } }
    - { id: d, text: { en: "Create the boto3 client without explicit credentials so that the SDK uses its default credential provider chain.", fr: "Créer le client boto3 sans informations d'identification explicites pour que le SDK utilise sa chaîne de fournisseurs d'informations d'identification par défaut." } }
    - { id: e, text: { en: "Call sts.get_session_token at startup with the IAM user's keys and use the temporary credentials.", fr: "Appeler sts.get_session_token au démarrage avec les clés de l'utilisateur IAM et utiliser les informations d'identification temporaires." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The task role grants permissions to the application code in the containers. ECS delivers short-lived task role credentials through a credential endpoint, and the SDK's default chain reads them with the container credential provider, so no keys are stored in the image or the code."
    fr: "Le rôle de tâche accorde des autorisations au code de l'application dans les conteneurs. ECS fournit des informations d'identification de rôle de tâche de courte durée via un point de terminaison d'informations d'identification, et la chaîne par défaut du SDK les lit avec le fournisseur d'informations d'identification de conteneur : aucune clé n'est stockée dans l'image ni dans le code."
  options:
    b:
      en: "The task execution role is used by ECS to pull images and send logs; the application code doesn't receive its permissions."
      fr: "Le rôle d'exécution de tâche est utilisé par ECS pour extraire les images et envoyer les journaux ; le code de l'application ne reçoit pas ses autorisations."
    c:
      en: "Environment variables still hold the same long-term keys, which the company wants to remove."
      fr: "Les variables d'environnement contiennent toujours les mêmes clés à long terme, que l'entreprise veut supprimer."
    e:
      en: "GetSessionToken still needs the IAM user's long-term keys in the container to obtain the temporary credentials."
      fr: "GetSessionToken exige toujours les clés à long terme de l'utilisateur IAM dans le conteneur pour obtenir les informations d'identification temporaires."
references:
  - title: Amazon ECS task IAM role
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html
  - title: AWS SDKs and Tools standardized credential providers
    url: https://docs.aws.amazon.com/sdkref/latest/guide/standardized-credentials.html
