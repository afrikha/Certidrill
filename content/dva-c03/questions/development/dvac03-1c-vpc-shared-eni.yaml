id: dvac03-1c-vpc-shared-eni
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team deploys 40 AWS Lambda functions to the same two private subnets of a VPC. All the functions need the same network access, but the AWS CloudFormation template creates a separate security group for each function. Each new function stays in the Pending state for several minutes after deployment, and the account is approaching its quota of network interfaces.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une équipe déploie 40 fonctions AWS Lambda dans les deux mêmes sous-réseaux privés d'un VPC. Toutes les fonctions ont besoin du même accès réseau, mais le modèle AWS CloudFormation crée un groupe de sécurité distinct pour chaque fonction. Chaque nouvelle fonction reste à l'état Pending pendant plusieurs minutes après le déploiement, et le compte approche de son quota d'interfaces réseau.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Assign one shared security group to the functions that need the same access so that they use the same subnet and security group combination.", fr: "Affecter un groupe de sécurité partagé aux fonctions qui ont besoin du même accès afin qu'elles utilisent la même combinaison de sous-réseau et de groupe de sécurité." } }
    - { id: b, text: { en: "Configure provisioned concurrency on each function so that its network interfaces are created before the first invocation.", fr: "Configurer la simultanéité provisionnée sur chaque fonction afin que ses interfaces réseau soient créées avant le premier appel." } }
    - { id: c, text: { en: "Create a dedicated subnet for each function so that the network interfaces are spread across more subnets.", fr: "Créer un sous-réseau dédié pour chaque fonction afin de répartir les interfaces réseau sur davantage de sous-réseaux." } }
    - { id: d, text: { en: "Increase the memory of each function so that Lambda allocates more network capacity to each network interface.", fr: "Augmenter la mémoire de chaque fonction afin que Lambda alloue plus de capacité réseau à chaque interface réseau." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Lambda creates a Hyperplane network interface the first time a function uses a given subnet and security group combination, and other functions with the same combination reuse it. With one shared security group, new functions reuse existing interfaces, which removes most of the Pending wait and the growth in network interfaces."
    fr: "Lambda crée une interface réseau Hyperplane la première fois qu'une fonction utilise une combinaison donnée de sous-réseau et de groupe de sécurité, et les autres fonctions ayant la même combinaison la réutilisent. Avec un groupe de sécurité partagé, les nouvelles fonctions réutilisent les interfaces existantes, ce qui supprime l'essentiel de l'attente à l'état Pending et la croissance du nombre d'interfaces réseau."
  options:
    b:
      en: "Provisioned concurrency pre-initializes execution environments at extra cost; it does not reduce the number of subnet and security group combinations."
      fr: "La simultanéité provisionnée pré-initialise des environnements d'exécution pour un coût supplémentaire ; elle ne réduit pas le nombre de combinaisons de sous-réseau et de groupe de sécurité."
    c:
      en: "More subnets create more subnet and security group combinations, and therefore more network interfaces."
      fr: "Davantage de sous-réseaux créent davantage de combinaisons de sous-réseau et de groupe de sécurité, et donc davantage d'interfaces réseau."
    d:
      en: "Memory sets the CPU and memory of the function; it has no effect on how many network interfaces Lambda creates."
      fr: "La mémoire détermine le processeur et la mémoire de la fonction ; elle n'a aucun effet sur le nombre d'interfaces réseau que Lambda crée."
references:
  - title: Giving Lambda Event Functions access to resources in an Amazon VPC
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html
