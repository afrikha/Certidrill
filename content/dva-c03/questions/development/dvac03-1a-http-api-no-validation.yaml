id: dvac03-1a-http-api-no-validation
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company exposes an Amazon API Gateway HTTP API with Lambda integrations. A new requirement says that API Gateway itself must validate each request body against a JSON schema and reject invalid requests before any Lambda function runs.

    Which solution will meet these requirements?
  fr: |
    Une entreprise expose une API HTTP Amazon API Gateway avec des intégrations Lambda. Une nouvelle exigence impose qu'API Gateway lui-même valide chaque corps de requête par rapport à un schéma JSON et rejette les requêtes non valides avant l'exécution de toute fonction Lambda.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add parameter mappings to the HTTP API routes that check the fields of the request body.", fr: "Ajouter aux routes de l'API HTTP des mappages de paramètres qui vérifient les champs du corps de la requête." }
    - id: b
      text: { en: "Add a JWT authorizer to the HTTP API routes that checks the fields of the request body.", fr: "Ajouter aux routes de l'API HTTP un mécanisme d'autorisation JWT qui vérifie les champs du corps de la requête." }
    - id: c
      text: { en: "Move the API to a REST API and configure models and request validators for its methods.", fr: "Migrer l'API vers une API REST et configurer des modèles et des validateurs de requête pour ses méthodes." }
    - id: d
      text: { en: "Enable automatic deployments on the HTTP API stage so that a JSON schema is enforced.", fr: "Activer les déploiements automatiques sur l'étape de l'API HTTP pour qu'un schéma JSON soit appliqué." }
answer: { optionId: c }
explanation:
  correct:
    en: "Request validation is a REST API feature; HTTP APIs don't support it. A REST API validates the body against a JSON schema model with a request validator and returns a 400 error before the integration runs."
    fr: "La validation des requêtes est une fonctionnalité des API REST ; les API HTTP ne la prennent pas en charge. Une API REST valide le corps par rapport à un modèle de schéma JSON avec un validateur de requête et renvoie une erreur 400 avant l'exécution de l'intégration."
  options:
    a:
      en: "HTTP API parameter mappings add, overwrite or remove headers, query strings and paths; they don't validate a body against a schema."
      fr: "Les mappages de paramètres d'une API HTTP ajoutent, remplacent ou suppriment des en-têtes, des chaînes de requête et des chemins ; ils ne valident pas un corps par rapport à un schéma."
    b:
      en: "A JWT authorizer validates the token in the request for access control; it doesn't check the body."
      fr: "Un mécanisme d'autorisation JWT valide le jeton de la requête pour le contrôle d'accès ; il ne contrôle pas le corps."
    d:
      en: "Automatic deployments only publish route and integration changes to the stage; they don't validate requests."
      fr: "Les déploiements automatiques ne font que publier sur l'étape les modifications de routes et d'intégrations ; ils ne valident pas les requêtes."
references:
  - title: Choose between REST APIs and HTTP APIs
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-vs-rest.html
