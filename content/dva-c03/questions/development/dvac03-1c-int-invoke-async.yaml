id: dvac03-1c-int-invoke-async
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function behind an Amazon API Gateway API saves an order and then calls a second function named send-receipt with the following code.

    ```python
    lambda_client.invoke(
        FunctionName="send-receipt",
        InvocationType="RequestResponse",
        Payload=json.dumps({"orderId": order_id}),
    )
    ```

    The API must respond to the client without waiting for the receipt to be generated, and Lambda must retry send-receipt automatically if it fails.

    Which change will meet these requirements?
  fr: |
    Une fonction AWS Lambda placée derrière une API Amazon API Gateway enregistre une commande, puis appelle une deuxième fonction nommée send-receipt avec le code suivant.

    ```python
    lambda_client.invoke(
        FunctionName="send-receipt",
        InvocationType="RequestResponse",
        Payload=json.dumps({"orderId": order_id}),
    )
    ```

    L'API doit répondre au client sans attendre la génération du reçu, et Lambda doit relancer automatiquement send-receipt en cas d'échec.

    Quelle modification répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep InvocationType=\"RequestResponse\", and add LogType=\"Tail\" to the call.", fr: "Conserver InvocationType=\"RequestResponse\", et ajouter LogType=\"Tail\" à l'appel." } }
    - { id: b, text: { en: "Change the call to InvocationType=\"DryRun\".", fr: "Remplacer l'appel par InvocationType=\"DryRun\"." } }
    - { id: c, text: { en: "Change the call to InvocationType=\"Event\".", fr: "Remplacer l'appel par InvocationType=\"Event\"." } }
    - { id: d, text: { en: "Add Qualifier=\"$LATEST\" to the call.", fr: "Ajouter Qualifier=\"$LATEST\" à l'appel." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With InvocationType Event, Lambda queues the event, returns status code 202 at once and runs the function asynchronously. Asynchronous invocations are retried by Lambda after function errors, and repeatedly failing events can go to a dead-letter queue or an on-failure destination."
    fr: "Avec InvocationType Event, Lambda met l'événement en file d'attente, renvoie immédiatement le code d'état 202 et exécute la fonction de manière asynchrone. Lambda relance les appels asynchrones après des erreurs de la fonction, et les événements qui échouent de façon répétée peuvent aller vers une file d'attente de lettres mortes ou une destination en cas d'échec."
  options:
    a:
      en: "LogType Tail only adds the last 4 KB of logs to the response; the call stays synchronous and waits for send-receipt."
      fr: "LogType Tail ajoute seulement les 4 derniers Ko de journaux à la réponse ; l'appel reste synchrone et attend send-receipt."
    b:
      en: "DryRun validates the parameters and permissions without running the function, so no receipt is sent."
      fr: "DryRun valide les paramètres et les autorisations sans exécuter la fonction : aucun reçu n'est envoyé."
    d:
      en: "The qualifier selects a version or alias; it does not change whether the call waits for the result."
      fr: "Le qualificateur sélectionne une version ou un alias ; il ne change pas le fait que l'appel attende le résultat."
references:
  - title: Invoke
    url: https://docs.aws.amazon.com/lambda/latest/api/API_Invoke.html
  - title: How Lambda handles errors and retries with asynchronous invocation
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-error-handling.html
