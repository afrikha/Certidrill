id: dvac03-1c-cfg-env-version-locked
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Clients invoke an AWS Lambda function through an alias named prod, which points to published version 7. A developer changes the value of the API_URL environment variable in the Lambda console and saves the change on the unpublished version. Requests that go through the prod alias still use the old URL.

    Which solution will make the prod alias use the new value with the LEAST effort?
  fr: |
    Des clients appellent une fonction AWS Lambda par un alias nommé prod, qui pointe vers la version publiée 7. Un développeur modifie la valeur de la variable d'environnement API_URL dans la console Lambda et enregistre la modification sur la version non publiée. Les requêtes qui passent par l'alias prod utilisent toujours l'ancienne URL.

    Quelle solution permet à l'alias prod d'utiliser la nouvelle valeur avec le MOINS d'effort ?
body:
  options:
    - { id: a, text: { en: "Publish a new version from $LATEST, and update the prod alias to point to the new version.", fr: "Publier une nouvelle version à partir de $LATEST, et mettre à jour l'alias prod pour qu'il pointe vers la nouvelle version." } }
    - { id: b, text: { en: "Edit the API_URL environment variable directly on version 7.", fr: "Modifier la variable d'environnement API_URL directement sur la version 7." } }
    - { id: c, text: { en: "Set the reserved concurrency to 0 and then remove it so that Lambda recreates the execution environments.", fr: "Définir la simultanéité réservée à 0 puis la supprimer afin que Lambda recrée les environnements d'exécution." } }
    - { id: d, text: { en: "Add the API_URL environment variable to the configuration of the prod alias.", fr: "Ajouter la variable d'environnement API_URL à la configuration de l'alias prod." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Environment variables are edited on the unpublished version ($LATEST) and are locked into a version when it is published. Version 7 keeps its old value, so the developer publishes a new version and moves the alias to it."
    fr: "Les variables d'environnement se modifient sur la version non publiée ($LATEST) et sont figées dans une version au moment de sa publication. La version 7 garde son ancienne valeur : le développeur publie une nouvelle version et y déplace l'alias."
  options:
    b:
      en: "A published version's configuration, including its environment variables, is locked and cannot be edited."
      fr: "La configuration d'une version publiée, y compris ses variables d'environnement, est figée et ne peut pas être modifiée."
    c:
      en: "New environments of version 7 still load version 7's configuration, which contains the old value."
      fr: "Les nouveaux environnements de la version 7 chargent toujours la configuration de la version 7, qui contient l'ancienne valeur."
    d:
      en: "An alias is a pointer to one or two versions; it has no environment variables of its own."
      fr: "Un alias est un pointeur vers une ou deux versions ; il n'a pas de variables d'environnement propres."
references:
  - title: Working with Lambda environment variables
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-envvars.html
