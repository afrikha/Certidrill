id: dvac03-1c-int-ddb-starting-position
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team creates a new event source mapping between an existing Amazon DynamoDB stream and an AWS Lambda function. The function must first process all the records that are currently available in the stream and then continue with new records.

    Which StartingPosition should the team configure?
  fr: |
    Une équipe crée un nouveau mappage de source d'événements entre un flux Amazon DynamoDB existant et une fonction AWS Lambda. La fonction doit d'abord traiter tous les enregistrements actuellement disponibles dans le flux, puis continuer avec les nouveaux enregistrements.

    Quelle StartingPosition l'équipe doit-elle configurer ?
body:
  options:
    - { id: a, text: "LATEST" }
    - { id: b, text: "TRIM_HORIZON" }
    - { id: c, text: { en: "AT_TIMESTAMP, with a timestamp 24 hours in the past", fr: "AT_TIMESTAMP, avec un horodatage 24 heures dans le passé" } }
    - { id: d, text: { en: "LATEST, with MaximumRecordAgeInSeconds set to 86400", fr: "LATEST, avec MaximumRecordAgeInSeconds défini à 86400" } }
answer: { optionId: b }
explanation:
  correct:
    en: "TRIM_HORIZON starts reading from the oldest record available in each shard, so the function processes the existing records first and then the new ones. AWS recommends TRIM_HORIZON for DynamoDB streams because LATEST can miss events while the mapping is being created or updated."
    fr: "TRIM_HORIZON commence la lecture au plus ancien enregistrement disponible de chaque partition : la fonction traite d'abord les enregistrements existants, puis les nouveaux. AWS recommande TRIM_HORIZON pour les flux DynamoDB, car LATEST peut manquer des événements pendant la création ou la mise à jour du mappage."
  options:
    a:
      en: "LATEST starts with records written after the mapping is created, so existing records are skipped."
      fr: "LATEST commence avec les enregistrements écrits après la création du mappage : les enregistrements existants sont ignorés."
    c:
      en: "AT_TIMESTAMP is supported for Kinesis streams, Amazon DocumentDB and Kafka sources, not for DynamoDB streams."
      fr: "AT_TIMESTAMP est pris en charge pour les flux Kinesis, Amazon DocumentDB et les sources Kafka, pas pour les flux DynamoDB."
    d:
      en: "MaximumRecordAgeInSeconds discards old records during retries; it does not move the starting point back in the stream."
      fr: "MaximumRecordAgeInSeconds rejette les anciens enregistrements lors des nouvelles tentatives ; il ne recule pas le point de départ dans le flux."
references:
  - title: CreateEventSourceMapping
    url: https://docs.aws.amazon.com/lambda/latest/api/API_CreateEventSourceMapping.html
  - title: Using AWS Lambda with Amazon DynamoDB
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-ddb.html
