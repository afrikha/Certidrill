id: dvac03-1d-ddb-key-customer-orders
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is designing an Amazon DynamoDB table for an online store with millions of customers. The main access pattern is to list the orders of one customer, newest first, optionally limited to a date range. Orders are spread across all customers, and the table must avoid hot partitions.

    Which primary key design will meet these requirements?
  fr: |
    AnyCompany conçoit une table Amazon DynamoDB pour une boutique en ligne qui compte des millions de clients. Le principal modèle d'accès consiste à lister les commandes d'un client, des plus récentes aux plus anciennes, éventuellement limitées à une plage de dates. Les commandes sont réparties entre tous les clients, et la table doit éviter les partitions sollicitées (hot partitions).

    Quelle conception de clé primaire répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Partition key OrderStatus and sort key OrderDate", fr: "Clé de partition OrderStatus et clé de tri OrderDate" } }
    - { id: b, text: { en: "Partition key CustomerId and sort key OrderDate", fr: "Clé de partition CustomerId et clé de tri OrderDate" } }
    - { id: c, text: { en: "Partition key OrderDate and sort key CustomerId", fr: "Clé de partition OrderDate et clé de tri CustomerId" } }
    - { id: d, text: { en: "Partition key OrderId and no sort key", fr: "Clé de partition OrderId, sans clé de tri" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      CustomerId has millions of values that are accessed fairly evenly, which spreads the load across partitions. With OrderDate as the sort key, a Query on one customer returns the orders sorted by date, ScanIndexForward=false returns the newest first, and a BETWEEN condition on the sort key limits the date range.
    fr: |
      CustomerId possède des millions de valeurs sollicitées de façon assez uniforme, ce qui répartit la charge entre les partitions. Avec OrderDate comme clé de tri, une Query sur un client renvoie les commandes triées par date, ScanIndexForward=false renvoie les plus récentes en premier, et une condition BETWEEN sur la clé de tri limite la plage de dates.
  options:
    a: { en: "A status has only a few possible values, which concentrates the writes on a few hot partition key values.", fr: "Un statut n'a que quelques valeurs possibles, ce qui concentre les écritures sur quelques valeurs de clé de partition très sollicitées." }
    c: { en: "All the orders of one day share one partition key value, which creates a hot partition, and listing one customer's orders would need a Scan.", fr: "Toutes les commandes d'une journée partagent une même valeur de clé de partition, ce qui crée une partition sollicitée, et lister les commandes d'un client exigerait un Scan." }
    d: { en: "OrderId spreads the load, but without CustomerId in the key the orders of one customer cannot be retrieved with a Query.", fr: "OrderId répartit la charge, mais sans CustomerId dans la clé, les commandes d'un client ne peuvent pas être récupérées par une Query." }
references:
  - title: Designing partition keys to distribute your workload in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-uniform-load.html
