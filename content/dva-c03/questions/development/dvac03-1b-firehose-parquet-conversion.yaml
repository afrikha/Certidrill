id: dvac03-1b-firehose-parquet-conversion
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A gaming company sends JSON game events to an Amazon Data Firehose stream that delivers them to an Amazon S3 bucket. Analysts query the data with Amazon Athena and want the files stored in Apache Parquet format to reduce query cost. The company wants the solution with the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo envoie des événements de jeu au format JSON à un flux Amazon Data Firehose qui les livre dans un compartiment Amazon S3. Les analystes interrogent les données avec Amazon Athena et veulent que les fichiers soient stockés au format Apache Parquet pour réduire le coût des requêtes. L'entreprise veut la solution qui demande le MOINS d'effort de développement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Schedule a daily Athena CREATE TABLE AS SELECT query that copies the JSON data into a Parquet table.", fr: "Planifier une requête Athena CREATE TABLE AS SELECT quotidienne qui copie les données JSON dans une table Parquet." }
    - id: b
      text: { en: "Add a Lambda transformation function to the Firehose stream that rewrites each record in Parquet format.", fr: "Ajouter au flux Firehose une fonction Lambda de transformation qui réécrit chaque enregistrement au format Parquet." }
    - id: c
      text: { en: "Create an S3 event notification that invokes a Lambda function to convert each delivered file to Parquet.", fr: "Créer une notification d'événement S3 qui invoque une fonction Lambda pour convertir chaque fichier livré en Parquet." }
    - id: d
      text: { en: "Turn on record format conversion in the Firehose stream with an AWS Glue Data Catalog table schema and the Parquet SerDe.", fr: "Activer la conversion du format des enregistrements dans le flux Firehose, avec un schéma provenant d'une table du catalogue de données AWS Glue et le SerDe Parquet." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Firehose can convert JSON input to Apache Parquet or Apache ORC before it writes to Amazon S3. The conversion needs a deserializer for the JSON input, a schema stored in an AWS Glue Data Catalog table, and the Parquet or ORC serializer. It is a configuration setting, so no code is required.
    fr: |
      Firehose peut convertir des données JSON en Apache Parquet ou Apache ORC avant de les écrire dans Amazon S3. La conversion nécessite un désérialiseur pour l'entrée JSON, un schéma stocké dans une table du catalogue de données AWS Glue et le sérialiseur Parquet ou ORC. Il s'agit d'un simple paramètre de configuration : aucun code n'est nécessaire.
  options:
    b:
      en: "A transformation function means writing and maintaining Parquet encoding code, while the built-in conversion does it without code."
      fr: "Une fonction de transformation implique d'écrire et de maintenir du code d'encodage Parquet, alors que la conversion intégrée le fait sans code."
    c:
      en: "A conversion function after delivery adds code, a second copy of the data and extra processing, compared with converting in the stream."
      fr: "Une fonction de conversion après la livraison ajoute du code, une deuxième copie des données et un traitement supplémentaire, par rapport à une conversion dans le flux."
    a:
      en: "A scheduled CTAS job must be built and run every day, and recent data stays in JSON until the next run."
      fr: "Une tâche CTAS planifiée doit être créée et exécutée chaque jour, et les données récentes restent en JSON jusqu'à l'exécution suivante."
references:
  - title: Convert input data format in Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/record-format-conversion.html
