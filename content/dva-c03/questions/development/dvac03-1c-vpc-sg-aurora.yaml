id: dvac03-1c-vpc-sg-aurora
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function runs in private subnets of a VPC and uses a security group named sg-lambda. An Amazon Aurora MySQL DB cluster in the same VPC uses a security group named sg-db, which allows inbound traffic only from a bastion host security group. The security team removed all outbound rules from sg-lambda. Connection attempts from the function to the cluster on TCP port 3306 now time out.

    Which combination of steps will allow the function to connect to the cluster with the LEAST privilege? (Choose two.)
  fr: |
    Une fonction AWS Lambda s'exécute dans des sous-réseaux privés d'un VPC et utilise un groupe de sécurité nommé sg-lambda. Un cluster de bases de données Amazon Aurora MySQL du même VPC utilise un groupe de sécurité nommé sg-db, qui n'autorise le trafic entrant qu'à partir du groupe de sécurité d'un hôte bastion. L'équipe de sécurité a supprimé toutes les règles sortantes de sg-lambda. Les tentatives de connexion de la fonction au cluster sur le port TCP 3306 expirent désormais.

    Quelle combinaison d'étapes permet à la fonction de se connecter au cluster avec le MOINDRE privilège ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a NAT gateway in a public subnet, and route the private subnets to it.", fr: "Créer une passerelle NAT dans un sous-réseau public, et y acheminer les sous-réseaux privés." } }
    - { id: b, text: { en: "Add an outbound rule to sg-lambda that allows TCP port 3306 to sg-db.", fr: "Ajouter à sg-lambda une règle sortante qui autorise le port TCP 3306 vers sg-db." } }
    - { id: c, text: { en: "Add a statement to the function's resource-based policy that allows rds.amazonaws.com to invoke the function.", fr: "Ajouter à la politique basée sur les ressources de la fonction une instruction qui autorise rds.amazonaws.com à appeler la fonction." } }
    - { id: d, text: { en: "Make the DB cluster publicly accessible, and allow TCP port 3306 from 0.0.0.0/0 in sg-db.", fr: "Rendre le cluster de bases de données accessible publiquement, et autoriser le port TCP 3306 depuis 0.0.0.0/0 dans sg-db." } }
    - { id: e, text: { en: "Add an inbound rule to sg-db that allows TCP port 3306 from sg-lambda.", fr: "Ajouter à sg-db une règle entrante qui autorise le port TCP 3306 depuis sg-lambda." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Security groups control the traffic of the function's network interfaces. The function's security group needs an outbound rule to the database port, and the cluster's security group needs an inbound rule from the function's security group. Referencing security groups instead of CIDR ranges keeps access limited to these two resources."
    fr: "Les groupes de sécurité contrôlent le trafic des interfaces réseau de la fonction. Le groupe de sécurité de la fonction a besoin d'une règle sortante vers le port de la base de données, et le groupe de sécurité du cluster a besoin d'une règle entrante depuis le groupe de sécurité de la fonction. Référencer des groupes de sécurité plutôt que des plages CIDR limite l'accès à ces deux ressources."
  options:
    a:
      en: "The cluster is in the same VPC, so the traffic never leaves the VPC; a NAT gateway only provides outbound internet access."
      fr: "Le cluster se trouve dans le même VPC, le trafic ne quitte donc jamais le VPC ; une passerelle NAT ne fournit qu'un accès sortant à Internet."
    c:
      en: "The function opens the connection to the database; Amazon RDS does not invoke the function, so a resource-based policy changes nothing."
      fr: "C'est la fonction qui ouvre la connexion à la base de données ; Amazon RDS n'appelle pas la fonction, une politique basée sur les ressources ne change donc rien."
    d:
      en: "Opening the database to 0.0.0.0/0 is far broader than needed, and sg-lambda would still block the outbound traffic."
      fr: "Ouvrir la base de données à 0.0.0.0/0 est bien plus large que nécessaire, et sg-lambda bloquerait toujours le trafic sortant."
references:
  - title: Giving Lambda Event Functions access to resources in an Amazon VPC
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html
  - title: Using AWS Lambda with Amazon RDS
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-database.html
