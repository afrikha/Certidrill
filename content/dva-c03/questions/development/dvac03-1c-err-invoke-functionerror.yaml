id: dvac03-1c-err-invoke-functionerror
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An order service calls an AWS Lambda function named calculate-tax with the AWS SDK for Python (Boto3) by using the following code.

    ```python
    resp = lambda_client.invoke(
        FunctionName="calculate-tax",
        InvocationType="RequestResponse",
        Payload=json.dumps(order),
    )
    if resp["StatusCode"] == 200:
        mark_order_complete(order)
    ```

    Orders are marked complete even when calculate-tax raises an exception. The service must mark an order complete only when the function succeeds.

    Which change will meet this requirement?
  fr: |
    Un service de commandes appelle une fonction AWS Lambda nommée calculate-tax avec le kit AWS SDK for Python (Boto3) à l'aide du code suivant.

    ```python
    resp = lambda_client.invoke(
        FunctionName="calculate-tax",
        InvocationType="RequestResponse",
        Payload=json.dumps(order),
    )
    if resp["StatusCode"] == 200:
        mark_order_complete(order)
    ```

    Les commandes sont marquées comme terminées même lorsque calculate-tax lève une exception. Le service ne doit marquer une commande comme terminée que si la fonction réussit.

    Quelle modification répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Use InvocationType=\"Event\", and mark the order complete when the status code is 202.", fr: "Utiliser InvocationType=\"Event\", et marquer la commande comme terminée lorsque le code d'état est 202." } }
    - { id: b, text: { en: "Wrap the invoke call in a try/except block that catches botocore ClientError exceptions.", fr: "Placer l'appel invoke dans un bloc try/except qui intercepte les exceptions botocore ClientError." } }
    - { id: c, text: { en: "Check that the response does not contain a FunctionError field before the order is marked complete.", fr: "Vérifier que la réponse ne contient pas de champ FunctionError avant de marquer la commande comme terminée." } }
    - { id: d, text: { en: "Call invoke with InvocationType=\"DryRun\" first, and mark the order complete when that call succeeds.", fr: "Appeler d'abord invoke avec InvocationType=\"DryRun\", et marquer la commande comme terminée lorsque cet appel réussit." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The status code of Invoke shows that Lambda accepted and ran the request, not that the function succeeded: a function error still returns 200. Lambda reports function errors with the X-Amz-Function-Error header, which Boto3 exposes as the FunctionError field, and the error details are in the payload."
    fr: "Le code d'état d'Invoke indique que Lambda a accepté et exécuté la requête, pas que la fonction a réussi : une erreur de la fonction renvoie quand même 200. Lambda signale les erreurs de fonction avec l'en-tête X-Amz-Function-Error, que Boto3 expose dans le champ FunctionError, et les détails de l'erreur se trouvent dans la charge utile."
  options:
    a:
      en: "An asynchronous invocation returns 202 as soon as the event is queued, before the function runs, so it says nothing about success."
      fr: "Un appel asynchrone renvoie 202 dès que l'événement est mis en file d'attente, avant l'exécution de la fonction : il n'indique rien sur la réussite."
    b:
      en: "API errors cover problems that prevent the execution, such as permissions or quotas; a function error does not raise a ClientError."
      fr: "Les erreurs d'API couvrent les problèmes qui empêchent l'exécution, comme les autorisations ou les quotas ; une erreur de fonction ne lève pas de ClientError."
    d:
      en: "DryRun only validates the parameters and the caller's permission; it does not run the function."
      fr: "DryRun valide seulement les paramètres et l'autorisation de l'appelant ; il n'exécute pas la fonction."
references:
  - title: Invoke
    url: https://docs.aws.amazon.com/lambda/latest/api/API_Invoke.html
