id: dvac03-1a-circuit-breaker
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A microservice calls a downstream inventory service synchronously. When the inventory service has an outage, which can last 30 minutes, every request keeps retrying with exponential backoff. Threads pile up, and the microservice itself becomes unavailable. The company wants requests to fail fast during an outage and wants calls to resume automatically after the inventory service recovers.

    Which solution will meet these requirements?
  fr: |
    Un microservice appelle de manière synchrone un service d'inventaire en aval. Quand le service d'inventaire subit une panne, qui peut durer 30 minutes, chaque requête continue de réessayer avec un backoff exponentiel. Les threads s'accumulent, et le microservice lui-même devient indisponible. L'entreprise veut que les requêtes échouent rapidement pendant une panne et que les appels reprennent automatiquement après le rétablissement du service d'inventaire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Increase the maximum number of retries and the maximum backoff delay so that requests outlast the outage.", fr: "Augmenter le nombre maximal de nouvelles tentatives et le délai de backoff maximal pour que les requêtes survivent à la panne." }
    - id: b
      text: { en: "Increase the client timeout of each call to 60 seconds so that fewer calls are counted as failures.", fr: "Porter le délai d'expiration client de chaque appel à 60 secondes pour que moins d'appels soient comptés comme des échecs." }
    - id: c
      text: { en: "Add a circuit breaker that rejects calls at once while it is open and lets trial calls through after a timeout.", fr: "Ajouter un disjoncteur (circuit breaker) qui rejette immédiatement les appels quand il est ouvert et laisse passer des appels d'essai après un délai." }
    - id: d
      text: { en: "Add more instances of the microservice behind its load balancer so that more threads are available.", fr: "Ajouter des instances du microservice derrière son équilibreur de charge pour disposer de davantage de threads." }
answer: { optionId: c }
explanation:
  correct:
    en: "Retry with backoff suits short transient faults; for a longer outage, a circuit breaker stops calling the failing service. After failures exceed a threshold, the circuit opens and calls fail immediately; after an expiry timeout, trial calls check the service and close the circuit when it has recovered. The circuit state can be stored in DynamoDB or ElastiCache so that all instances share it."
    fr: "La nouvelle tentative avec backoff convient aux défaillances transitoires courtes ; pour une panne plus longue, un disjoncteur cesse d'appeler le service défaillant. Quand les échecs dépassent un seuil, le circuit s'ouvre et les appels échouent immédiatement ; après un délai d'expiration, des appels d'essai vérifient le service et referment le circuit quand il est rétabli. L'état du circuit peut être stocké dans DynamoDB ou ElastiCache pour être partagé par toutes les instances."
  options:
    a:
      en: "More and longer retries hold even more threads during a 30-minute outage, which is the cause of the problem."
      fr: "Des nouvelles tentatives plus nombreuses et plus longues retiennent encore plus de threads pendant une panne de 30 minutes, ce qui est la cause du problème."
    b:
      en: "A longer timeout makes each call hold its thread longer, so requests fail more slowly, not faster."
      fr: "Un délai plus long fait retenir chaque thread plus longtemps : les requêtes échouent plus lentement, pas plus vite."
    d:
      en: "New instances fill up with blocked threads in the same way and add cost without failing fast."
      fr: "Les nouvelles instances se remplissent de threads bloqués de la même façon et ajoutent du coût sans échouer rapidement."
references:
  - title: Circuit breaker pattern
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/circuit-breaker.html
