id: dvac03-1a-stage-variable-alias
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has one REST API in Amazon API Gateway with a dev stage and a prod stage. Both stages must use the same API definition, but the dev stage must invoke the dev alias of a Lambda function and the prod stage must invoke the prod alias.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une entreprise possède une API REST Amazon API Gateway avec une étape dev et une étape prod. Les deux étapes doivent utiliser la même définition d'API, mais l'étape dev doit invoquer l'alias dev d'une fonction Lambda et l'étape prod l'alias prod.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a separate usage plan for each stage that points to the matching alias.", fr: "Créer un plan d'utilisation distinct pour chaque étape qui pointe vers l'alias correspondant." } }
    - { id: b, text: { en: "Set an environment variable on each Lambda alias that names the stage it serves.", fr: "Définir sur chaque alias Lambda une variable d'environnement qui indique l'étape qu'il sert." } }
    - { id: c, text: { en: "Define an alias stage variable on each stage and use it in the integration's function ARN, as in my-function:${stageVariables.alias}.", fr: "Définir une variable d'étape alias sur chaque étape et l'utiliser dans l'ARN de fonction de l'intégration, comme dans my-function:${stageVariables.alias}." } }
    - { id: d, text: { en: "Enable a canary on the prod stage that sends part of the traffic to the dev alias.", fr: "Activer un canari sur l'étape prod qui envoie une partie du trafic vers l'alias dev." } }
    - { id: e, text: { en: "Add a resource-based policy statement that allows API Gateway to invoke each alias.", fr: "Ajouter une déclaration de politique basée sur les ressources qui autorise API Gateway à invoquer chaque alias." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Stage variables are key-value pairs on a stage that can be used in the integration URI, so one definition calls my-function:dev from the dev stage and my-function:prod from the prod stage. When the function name comes from a stage variable, the permissions must be added by hand: a lambda add-permission statement for each alias that allows apigateway.amazonaws.com to invoke it."
    fr: "Les variables d'étape sont des paires clé-valeur d'une étape utilisables dans l'URI d'intégration : une même définition appelle my-function:dev depuis l'étape dev et my-function:prod depuis l'étape prod. Quand le nom de fonction vient d'une variable d'étape, les autorisations doivent être ajoutées à la main : une déclaration lambda add-permission pour chaque alias qui autorise apigateway.amazonaws.com à l'invoquer."
  options:
    a:
      en: "Usage plans set throttling and quotas for API keys; they don't choose the backend that a stage invokes."
      fr: "Les plans d'utilisation définissent la limitation et les quotas des clés d'API ; ils ne choisissent pas le backend qu'une étape invoque."
    b:
      en: "Environment variables belong to function versions, not to aliases, and they can't change which alias API Gateway invokes."
      fr: "Les variables d'environnement appartiennent aux versions de fonction, pas aux alias, et elles ne peuvent pas changer l'alias qu'API Gateway invoque."
    d:
      en: "A canary splits the traffic of one stage between deployments; it would send production traffic to the dev alias."
      fr: "Un canari répartit le trafic d'une étape entre des déploiements ; il enverrait du trafic de production vers l'alias dev."
references:
  - title: Use stage variables for a REST API in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/stage-variables.html
