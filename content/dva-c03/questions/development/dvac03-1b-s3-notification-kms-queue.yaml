id: dvac03-1b-s3-notification-kms-queue
objective: "1.1.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A developer configures an S3 event notification that sends `s3:ObjectCreated:*` events from a bucket to an Amazon SQS queue in the same account. The queue uses server-side encryption with an AWS KMS customer managed key. The queue policy currently allows only the application role to call SQS actions. No messages arrive in the queue when objects are uploaded.

    Which two changes must the developer make? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur configure une notification d'événement S3 qui envoie les événements `s3:ObjectCreated:*` d'un compartiment vers une file d'attente Amazon SQS du même compte. La file d'attente utilise le chiffrement côté serveur avec une clé gérée par le client AWS KMS. La politique de la file d'attente n'autorise actuellement que le rôle de l'application à appeler les actions SQS. Aucun message n'arrive dans la file d'attente quand des objets sont chargés.

    Quelles sont les deux modifications que le développeur doit effectuer ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a queue policy statement that allows the s3.amazonaws.com service principal to call sqs:SendMessage, with an aws:SourceArn condition for the bucket.", fr: "Ajouter à la politique de la file d'attente une instruction qui autorise le principal de service s3.amazonaws.com à appeler sqs:SendMessage, avec une condition aws:SourceArn pour le compartiment." } }
    - { id: b, text: { en: "Add a key policy statement that allows the s3.amazonaws.com service principal to use kms:GenerateDataKey and kms:Decrypt.", fr: "Ajouter à la politique de clé une instruction qui autorise le principal de service s3.amazonaws.com à utiliser kms:GenerateDataKey et kms:Decrypt." } }
    - { id: c, text: { en: "Add a bucket policy statement that allows the queue to call s3:GetObject on the bucket.", fr: "Ajouter à la politique de compartiment une instruction qui autorise la file d'attente à appeler s3:GetObject sur le compartiment." } }
    - { id: d, text: { en: "Attach an IAM role to the bucket that allows sqs:SendMessage on the queue.", fr: "Associer au compartiment un rôle IAM qui autorise sqs:SendMessage sur la file d'attente." } }
    - { id: e, text: { en: "Turn on default encryption with SSE-KMS for the bucket by using the same key as the queue.", fr: "Activer le chiffrement par défaut avec SSE-KMS pour le compartiment en utilisant la même clé que la file d'attente." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Amazon S3 publishes notifications as the s3.amazonaws.com service principal, so the queue resource policy must allow it to call SQS:SendMessage, scoped with aws:SourceArn (and aws:SourceAccount) to the bucket. Because the queue is encrypted with a customer managed key, the key policy must also allow the S3 service principal to use kms:GenerateDataKey and kms:Decrypt.
    fr: |
      Amazon S3 publie les notifications en tant que principal de service s3.amazonaws.com : la politique de ressource de la file d'attente doit l'autoriser à appeler SQS:SendMessage, avec une portée limitée au compartiment par aws:SourceArn (et aws:SourceAccount). Comme la file d'attente est chiffrée avec une clé gérée par le client, la politique de clé doit aussi autoriser le principal de service S3 à utiliser kms:GenerateDataKey et kms:Decrypt.
  options:
    c:
      en: "The queue does not read objects; S3 sends the notification to the queue, so a bucket policy for the queue changes nothing."
      fr: "La file d'attente ne lit pas les objets ; S3 envoie la notification à la file d'attente : une politique de compartiment pour la file ne change rien."
    d:
      en: "Buckets do not assume IAM roles to send notifications; S3 uses its service principal, which the destination resource policy must allow."
      fr: "Les compartiments n'assument pas de rôles IAM pour envoyer des notifications ; S3 utilise son principal de service, que la politique de ressource de la destination doit autoriser."
    e:
      en: "Bucket encryption protects the objects; it does not give S3 permission to send messages to the encrypted queue."
      fr: "Le chiffrement du compartiment protège les objets ; il ne donne pas à S3 l'autorisation d'envoyer des messages à la file d'attente chiffrée."
references:
  - title: Granting permissions to publish event notification messages to a destination
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/grant-destinations-permissions-to-s3.html
