id: dvac03-1d-ds-aurora-reader-endpoint
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's booking application uses an Amazon Aurora MySQL-Compatible cluster that has a single writer instance. A new reporting dashboard runs heavy read-only SQL queries every minute, and bookings have become slow when the dashboard is in use. The dashboard can show data that is up to a few seconds old.

    The reporting queries must be isolated from the booking workload with the LEAST change to the dashboard code.

    Which solution will meet these requirements?
  fr: |
    L'application de réservation d'AnyCompany utilise un cluster Amazon Aurora MySQL-Compatible qui ne possède qu'une instance d'écriture. Un nouveau tableau de bord de rapports exécute chaque minute de lourdes requêtes SQL en lecture seule, et les réservations sont devenues lentes quand le tableau de bord est utilisé. Le tableau de bord peut afficher des données datant de quelques secondes.

    Les requêtes de rapport doivent être isolées de la charge de réservation avec le MOINS de modifications possible du code du tableau de bord.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Connect the dashboard to the cluster endpoint with a database user that has only read permissions.", fr: "Connecter le tableau de bord au point de terminaison du cluster avec un utilisateur de base de données qui n'a que des autorisations de lecture." } }
    - { id: b, text: { en: "Migrate the reporting tables to Amazon DynamoDB and rewrite the dashboard queries as Query operations.", fr: "Migrer les tables de rapport vers Amazon DynamoDB et réécrire les requêtes du tableau de bord en opérations Query." } }
    - { id: c, text: { en: "Add Aurora Replicas to the cluster and point the dashboard's connection string at the reader endpoint.", fr: "Ajouter des réplicas Aurora au cluster et diriger la chaîne de connexion du tableau de bord vers le point de terminaison lecteur." } }
    - { id: d, text: { en: "Modify the writer to a larger DB instance class so that it can serve both workloads.", fr: "Passer l'instance d'écriture à une classe d'instance plus grande pour qu'elle serve les deux charges de travail." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Aurora Replicas share the cluster volume with the writer and are the main way to scale reads; their lag is usually well under 100 milliseconds, which the dashboard tolerates. The reader endpoint spreads read-only connections across the replicas, so the only change is the dashboard's connection string, and the writer no longer runs the reports.
    fr: |
      Les réplicas Aurora partagent le volume du cluster avec l'instance d'écriture et sont le principal moyen de mettre les lectures à l'échelle ; leur retard est généralement bien inférieur à 100 millisecondes, ce que le tableau de bord tolère. Le point de terminaison lecteur répartit les connexions en lecture seule entre les réplicas : seule la chaîne de connexion du tableau de bord change, et l'instance d'écriture n'exécute plus les rapports.
  options:
    a: { en: "The cluster endpoint always connects to the writer instance, so the reports would still compete with the bookings.", fr: "Le point de terminaison du cluster se connecte toujours à l'instance d'écriture : les rapports concurrenceraient toujours les réservations." }
    b: { en: "Rewriting relational reports for DynamoDB is a large code change, and DynamoDB has no SQL joins for the reports.", fr: "Réécrire des rapports relationnels pour DynamoDB est une modification de code importante, et DynamoDB n'a pas de jointures SQL pour les rapports." }
    d: { en: "A larger writer still runs both workloads on the same instance, so the reports are not isolated from the bookings.", fr: "Une instance d'écriture plus grande exécute toujours les deux charges sur la même instance : les rapports ne sont pas isolés des réservations." }
references:
  - title: Replication with Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html
