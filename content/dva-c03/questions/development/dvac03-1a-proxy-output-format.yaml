id: dvac03-1a-proxy-output-format
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Node.js Lambda function is behind an Amazon API Gateway REST API that uses a Lambda proxy integration. The function has the following handler:

    ```javascript
    export const handler = async (event) => {
      const order = { id: event.pathParameters.id, status: "SHIPPED" };
      return order;
    };
    ```

    Clients receive HTTP 502 errors, and the function logs show no error.

    Which change will fix the errors?
  fr: |
    Une fonction Lambda Node.js se trouve derrière une API REST Amazon API Gateway qui utilise une intégration de proxy Lambda. La fonction possède le gestionnaire suivant :

    ```javascript
    export const handler = async (event) => {
      const order = { id: event.pathParameters.id, status: "SHIPPED" };
      return order;
    };
    ```

    Les clients reçoivent des erreurs HTTP 502, et les journaux de la fonction ne montrent aucune erreur.

    Quelle modification corrigera les erreurs ?
body:
  options:
    - id: a
      text: { en: "Add a mapping template to the integration response that converts the object to JSON.", fr: "Ajouter à la réponse d'intégration un modèle de mappage qui convertit l'objet en JSON." }
    - id: b
      text: { en: "Enable CORS on the resource so that API Gateway accepts the function's response.", fr: "Activer CORS sur la ressource pour qu'API Gateway accepte la réponse de la fonction." }
    - id: c
      text: { en: "Increase the timeout of the Lambda function and the integration timeout of the method.", fr: "Augmenter le délai d'expiration de la fonction Lambda et le délai d'intégration de la méthode." }
    - id: d
      text: { en: "Return an object with a statusCode field and a body field that contains `JSON.stringify(order)`.", fr: "Renvoyer un objet avec un champ statusCode et un champ body qui contient `JSON.stringify(order)`." }
answer: { optionId: d }
explanation:
  correct:
    en: "With a Lambda proxy integration, the function must return a JSON object with statusCode, optional headers or multiValueHeaders, a body string and optionally isBase64Encoded. Any other format makes API Gateway return 502 Bad Gateway, even though the function itself succeeded."
    fr: "Avec une intégration de proxy Lambda, la fonction doit renvoyer un objet JSON avec statusCode, éventuellement headers ou multiValueHeaders, une chaîne body et éventuellement isBase64Encoded. Tout autre format fait renvoyer 502 Bad Gateway par API Gateway, même si la fonction elle-même a réussi."
  options:
    a:
      en: "A proxy integration passes the function's output through; the fix is in the format that the function returns, not in a mapping template."
      fr: "Une intégration de proxy transmet la sortie de la fonction telle quelle ; la correction porte sur le format renvoyé par la fonction, pas sur un modèle de mappage."
    b:
      en: "CORS headers matter only to browsers on other origins; a malformed proxy response still produces 502."
      fr: "Les en-têtes CORS ne concernent que les navigateurs d'autres origines ; une réponse de proxy mal formée produit toujours une erreur 502."
    c:
      en: "The function returns at once without error; a timeout would produce a different error, typically 504."
      fr: "La fonction répond immédiatement sans erreur ; une expiration produirait une autre erreur, généralement 504."
references:
  - title: Lambda proxy integrations in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-lambda-proxy-integrations.html
