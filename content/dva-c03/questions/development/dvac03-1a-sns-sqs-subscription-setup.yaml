id: dvac03-1a-sns-sqs-subscription-setup
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer creates an Amazon SNS standard topic and an Amazon SQS standard queue in the same AWS account by using the AWS CLI. The queue uses SSE-SQS encryption. The developer wants the queue to receive every message that is published to the topic so that a consumer can process the messages asynchronously.

    Which two actions must the developer take? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur crée une rubrique Amazon SNS standard et une file d'attente Amazon SQS standard dans le même compte AWS à l'aide de l'AWS CLI. La file utilise le chiffrement SSE-SQS. Le développeur veut que la file reçoive chaque message publié dans la rubrique afin qu'un consommateur puisse traiter les messages de manière asynchrone.

    Quelles sont les deux actions que le développeur doit effectuer ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Subscribe the queue to the topic with the sqs protocol and the queue ARN as the endpoint.", fr: "Abonner la file à la rubrique avec le protocole sqs et l'ARN de la file comme point de terminaison." } }
    - { id: b, text: { en: "Create an IAM role that SNS assumes to call sqs:SendMessage, and attach the role to the topic.", fr: "Créer un rôle IAM que SNS assume pour appeler sqs:SendMessage, et attacher ce rôle à la rubrique." } }
    - { id: c, text: { en: "Enable long polling on the queue by setting ReceiveMessageWaitTimeSeconds to 20.", fr: "Activer l'attente active de longue durée sur la file en définissant ReceiveMessageWaitTimeSeconds à 20." } }
    - { id: d, text: { en: "Allow the sns.amazonaws.com principal to call sqs:SendMessage in the queue policy, with aws:SourceArn set to the topic ARN.", fr: "Autoriser le principal sns.amazonaws.com à appeler sqs:SendMessage dans la politique de la file, avec aws:SourceArn défini sur l'ARN de la rubrique." } }
    - { id: e, text: { en: "Enable raw message delivery on the subscription.", fr: "Activer la remise de messages bruts sur l'abonnement." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The queue must be subscribed to the topic, and SNS can't write to a queue by default: the queue's access policy must allow the SNS service principal to call sqs:SendMessage, restricted with aws:SourceArn to this topic. With SSE-SQS, no KMS key policy change is needed."
    fr: "La file doit être abonnée à la rubrique, et SNS ne peut pas écrire dans une file par défaut : la politique d'accès de la file doit autoriser le principal de service SNS à appeler sqs:SendMessage, restreint par aws:SourceArn à cette rubrique. Avec SSE-SQS, aucune modification de politique de clé KMS n'est nécessaire."
  options:
    b:
      en: "SNS delivers to SQS under the queue's resource-based policy; it doesn't assume an IAM role to send the messages."
      fr: "SNS remet les messages à SQS selon la politique basée sur les ressources de la file ; il n'assume pas de rôle IAM pour les envoyer."
    c:
      en: "Long polling reduces empty receives for the consumer, but it isn't needed for the queue to receive messages from the topic."
      fr: "L'attente active de longue durée réduit les réceptions vides du consommateur, mais elle n'est pas nécessaire pour que la file reçoive les messages de la rubrique."
    e:
      en: "Raw message delivery only removes the SNS JSON envelope; it's optional and doesn't enable delivery."
      fr: "La remise de messages bruts supprime seulement l'enveloppe JSON de SNS ; elle est facultative et n'active pas la remise."
references:
  - title: Fanout Amazon SNS notifications to Amazon SQS queues for asynchronous processing
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html
