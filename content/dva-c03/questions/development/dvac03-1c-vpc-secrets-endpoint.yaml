id: dvac03-1c-vpc-secrets-endpoint
objective: "1.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function runs in private subnets of a VPC that has no internet gateway and no NAT gateway. The function's security group allows all outbound traffic. At startup, the function calls the AWS Secrets Manager GetSecretValue API, and the execution role allows secretsmanager:GetSecretValue on the secret. The call times out. The security team requires that the traffic stays on the AWS network without a NAT device.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une fonction AWS Lambda s'exécute dans des sous-réseaux privés d'un VPC qui n'a ni passerelle Internet ni passerelle NAT. Le groupe de sécurité de la fonction autorise tout le trafic sortant. Au démarrage, la fonction appelle l'API GetSecretValue d'AWS Secrets Manager, et le rôle d'exécution autorise secretsmanager:GetSecretValue sur le secret. L'appel expire. L'équipe de sécurité exige que le trafic reste sur le réseau AWS sans équipement NAT.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an interface VPC endpoint for Secrets Manager in the function's subnets, with private DNS enabled.", fr: "Créer un point de terminaison de VPC de type interface pour Secrets Manager dans les sous-réseaux de la fonction, avec le DNS privé activé." } }
    - { id: b, text: { en: "Create a gateway VPC endpoint for Secrets Manager, and associate it with the route tables of the function's subnets.", fr: "Créer un point de terminaison de VPC de type passerelle pour Secrets Manager, et l'associer aux tables de routage des sous-réseaux de la fonction." } }
    - { id: c, text: { en: "Add the kms:Decrypt permission for the secret's AWS KMS key to the function's execution role.", fr: "Ajouter l'autorisation kms:Decrypt sur la clé AWS KMS du secret au rôle d'exécution de la fonction." } }
    - { id: d, text: { en: "Allow inbound HTTPS (TCP 443) from the function's security group in the security group of the endpoint.", fr: "Autoriser le trafic HTTPS entrant (TCP 443) depuis le groupe de sécurité de la fonction dans le groupe de sécurité du point de terminaison." } }
    - { id: e, text: { en: "Increase the timeout of the function to 60 seconds so that the call has time to complete.", fr: "Augmenter le délai d'expiration de la fonction à 60 secondes afin que l'appel ait le temps de se terminer." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Secrets Manager is reached privately through an interface VPC endpoint (com.amazonaws.region.secretsmanager). With private DNS enabled, the SDK's default Regional endpoint name resolves to the endpoint's private IP addresses, so the code does not change. The endpoint's network interfaces use a security group that must accept HTTPS from the function."
    fr: "Secrets Manager est atteint en privé par un point de terminaison de VPC de type interface (com.amazonaws.region.secretsmanager). Avec le DNS privé activé, le nom du point de terminaison régional par défaut du SDK se résout vers les adresses IP privées du point de terminaison : le code ne change pas. Les interfaces réseau du point de terminaison utilisent un groupe de sécurité qui doit accepter le HTTPS provenant de la fonction."
  options:
    b:
      en: "Gateway endpoints exist only for Amazon S3 and Amazon DynamoDB; Secrets Manager requires an interface endpoint."
      fr: "Les points de terminaison de type passerelle n'existent que pour Amazon S3 et Amazon DynamoDB ; Secrets Manager nécessite un point de terminaison de type interface."
    c:
      en: "A missing KMS permission returns an access denied error; a timeout shows that the request never reaches the service."
      fr: "Une autorisation KMS manquante renvoie une erreur d'accès refusé ; une expiration montre que la requête n'atteint jamais le service."
    e:
      en: "There is no network path to Secrets Manager, so a longer timeout only makes the function wait longer before failing."
      fr: "Il n'existe aucun chemin réseau vers Secrets Manager : un délai plus long fait seulement attendre la fonction plus longtemps avant d'échouer."
references:
  - title: Using an AWS Secrets Manager VPC endpoint
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/vpc-endpoint-overview.html
  - title: Gateway endpoints
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html
