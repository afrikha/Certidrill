id: dvac03-1b-ddb-streams-view-type
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An ecommerce company stores products in an Amazon DynamoDB table. A developer is enabling DynamoDB Streams on the table so that an AWS Lambda function can publish a price-change event. The function must compare the price before and after each update.

    Which stream view type should the developer choose?
  fr: |
    Une entreprise de commerce électronique stocke ses produits dans une table Amazon DynamoDB. Un développeur active DynamoDB Streams sur la table afin qu'une fonction AWS Lambda puisse publier un événement de changement de prix. La fonction doit comparer le prix avant et après chaque mise à jour.

    Quel type de vue de flux le développeur doit-il choisir ?
body:
  options:
    - { id: a, text: "KEYS_ONLY" }
    - { id: b, text: "NEW_IMAGE" }
    - { id: c, text: "OLD_IMAGE" }
    - { id: d, text: "NEW_AND_OLD_IMAGES" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      NEW_AND_OLD_IMAGES writes both the item as it was before the modification and the item as it is after it into each stream record. The function can read the old and new price from the same record. The view type cannot be edited later: changing it requires disabling the stream and enabling a new one.
    fr: |
      NEW_AND_OLD_IMAGES écrit dans chaque enregistrement de flux l'élément tel qu'il était avant la modification et tel qu'il est après. La fonction peut lire l'ancien et le nouveau prix dans le même enregistrement. Le type de vue ne peut pas être modifié ensuite : pour le changer, il faut désactiver le flux et en activer un nouveau.
  options:
    a:
      en: "KEYS_ONLY contains only the key attributes of the modified item, without any price."
      fr: "KEYS_ONLY ne contient que les attributs de clé de l'élément modifié, sans aucun prix."
    b:
      en: "NEW_IMAGE contains only the item after the update, so the previous price is missing."
      fr: "NEW_IMAGE ne contient que l'élément après la mise à jour : le prix précédent est absent."
    c:
      en: "OLD_IMAGE contains only the item before the update, so the new price is missing."
      fr: "OLD_IMAGE ne contient que l'élément avant la mise à jour : le nouveau prix est absent."
references:
  - title: Change data capture for DynamoDB Streams
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.html
