id: dvac03-1c-cfg-reserved-concurrency
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS account runs many AWS Lambda functions. A function named ProcessPayments, which is invoked through Amazon API Gateway, must always be able to reach 200 concurrent executions, even when other functions in the account have traffic spikes. ProcessPayments must also never exceed 200 concurrent executions because the downstream payment service accepts at most 200 simultaneous connections. The solution must not add cost.

    Which solution will meet these requirements?
  fr: |
    Un compte AWS exécute de nombreuses fonctions AWS Lambda. Une fonction nommée ProcessPayments, appelée par Amazon API Gateway, doit toujours pouvoir atteindre 200 exécutions simultanées, même lorsque d'autres fonctions du compte subissent des pics de trafic. ProcessPayments ne doit jamais non plus dépasser 200 exécutions simultanées, car le service de paiement en aval accepte au plus 200 connexions simultanées. La solution ne doit pas ajouter de coût.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure provisioned concurrency of 200 on an alias of ProcessPayments.", fr: "Configurer une simultanéité provisionnée de 200 sur un alias de ProcessPayments." } }
    - { id: b, text: { en: "Request an increase of the account's concurrent executions quota.", fr: "Demander une augmentation du quota d'exécutions simultanées du compte." } }
    - { id: c, text: { en: "Configure reserved concurrency of 200 on ProcessPayments.", fr: "Configurer une simultanéité réservée de 200 sur ProcessPayments." } }
    - { id: d, text: { en: "Set a throttling rate limit of 200 requests per second on the API Gateway stage.", fr: "Définir une limite de débit de 200 requêtes par seconde sur l'étape (stage) API Gateway." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Reserved concurrency is both a floor and a ceiling: no other function can use the reserved units, and the function cannot scale beyond them. Configuring reserved concurrency has no additional charge."
    fr: "La simultanéité réservée est à la fois un plancher et un plafond : aucune autre fonction ne peut utiliser les unités réservées, et la fonction ne peut pas monter au-delà. La configuration de la simultanéité réservée n'entraîne aucun coût supplémentaire."
  options:
    a:
      en: "Provisioned concurrency is billed, and it pre-initializes environments without capping the function at 200 executions."
      fr: "La simultanéité provisionnée est facturée, et elle pré-initialise des environnements sans plafonner la fonction à 200 exécutions."
    b:
      en: "A larger account quota is shared by all functions, so it neither guarantees 200 executions to ProcessPayments nor caps it."
      fr: "Un quota de compte plus élevé est partagé par toutes les fonctions : il ne garantit pas 200 exécutions à ProcessPayments et ne la plafonne pas."
    d:
      en: "A request rate is not a concurrency limit, and stage throttling does not reserve capacity for the function."
      fr: "Un débit de requêtes n'est pas une limite de simultanéité, et la limitation de l'étape ne réserve pas de capacité pour la fonction."
references:
  - title: Configuring reserved concurrency for an Event Function
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-concurrency.html
