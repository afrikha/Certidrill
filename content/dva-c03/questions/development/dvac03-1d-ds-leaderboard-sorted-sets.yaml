id: dvac03-1d-ds-leaderboard-sorted-sets
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is developing a mobile game with several million players. Each time a player finishes a level, the backend updates the player's score. The game must show the top 100 players and the rank of the current player, recalculated in real time after every score update, with sub-millisecond read latency.

    The developers want to write the LEAST amount of ranking logic in the application.

    Which solution will meet these requirements?
  fr: |
    AnyCompany développe un jeu mobile qui compte plusieurs millions de joueurs. Chaque fois qu'un joueur termine un niveau, le backend met à jour son score. Le jeu doit afficher les 100 meilleurs joueurs et le rang du joueur courant, recalculés en temps réel après chaque mise à jour de score, avec une latence de lecture inférieure à la milliseconde.

    Les développeurs veulent écrire le MOINS de logique de classement possible dans l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store the scores in an Amazon DynamoDB table and run a Scan that sorts the items by score in the application.", fr: "Stocker les scores dans une table Amazon DynamoDB et exécuter un Scan qui trie les éléments par score dans l'application." } }
    - { id: b, text: { en: "Store the scores in an Amazon Aurora table with an index on the score column and run an ORDER BY query.", fr: "Stocker les scores dans une table Amazon Aurora avec un index sur la colonne de score et exécuter une requête ORDER BY." } }
    - { id: c, text: { en: "Store the scores in an Amazon ElastiCache (Valkey) sorted set and read the ranks with ZREVRANGE and ZREVRANK.", fr: "Stocker les scores dans un ensemble trié (sorted set) Amazon ElastiCache (Valkey) et lire les rangs avec ZREVRANGE et ZREVRANK." } }
    - { id: d, text: { en: "Store the scores in a JSON object in Amazon S3 and rewrite the object in sorted order after each update.", fr: "Stocker les scores dans un objet JSON d'Amazon S3 et réécrire l'objet trié après chaque mise à jour." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Valkey and Redis OSS sorted sets keep members unique and ordered by score, and they re-rank in real time when a score changes. ZADD updates a score, ZREVRANGE returns the top players, and ZREVRANK returns one player's zero-based rank, so the application contains no sorting code. ElastiCache serves these reads from memory.
    fr: |
      Les ensembles triés de Valkey et de Redis OSS gardent des membres uniques classés par score et se réordonnent en temps réel quand un score change. ZADD met à jour un score, ZREVRANGE renvoie les meilleurs joueurs et ZREVRANK le rang (à partir de zéro) d'un joueur : l'application ne contient aucun code de tri. ElastiCache sert ces lectures depuis la mémoire.
  options:
    a: { en: "A Scan reads the whole table on every request and the sorting would be written in the application, which fails both the latency and the development requirements.", fr: "Un Scan lit toute la table à chaque requête et le tri serait écrit dans l'application, ce qui ne respecte ni l'exigence de latence ni celle d'effort de développement." }
    b: { en: "A relational query with an index works, but computing a player's rank needs extra SQL logic and disk-based reads do not give sub-millisecond latency.", fr: "Une requête relationnelle avec un index fonctionne, mais calculer le rang d'un joueur demande une logique SQL supplémentaire et des lectures sur disque n'offrent pas une latence inférieure à la milliseconde." }
    d: { en: "Rewriting a large object after every score update is slow, loses concurrent updates and leaves all ranking logic in the application.", fr: "Réécrire un gros objet après chaque mise à jour de score est lent, perd des mises à jour concurrentes et laisse toute la logique de classement dans l'application." }
references:
  - title: Common ElastiCache Use Cases and How ElastiCache Can Help
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/elasticache-use-cases.html
