id: dvac03-1b-kds-on-demand-mode
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup is building a clickstream pipeline on an Amazon Kinesis data stream. Traffic is unpredictable: it can stay near zero for hours and then increase tenfold within minutes after a marketing campaign. The developers do not want to monitor shard metrics or change the number of shards themselves.

    Which solution will meet these requirements?
  fr: |
    Une start-up construit un pipeline de flux de clics sur un flux de données Amazon Kinesis. Le trafic est imprévisible : il peut rester proche de zéro pendant des heures, puis être multiplié par dix en quelques minutes après une campagne marketing. Les développeurs ne veulent ni surveiller les métriques des partitions (shards) ni modifier eux-mêmes le nombre de partitions.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create the stream in provisioned mode and schedule an AWS Lambda function that calls UpdateShardCount every hour.", fr: "Créer le flux en mode provisionné et planifier une fonction AWS Lambda qui appelle UpdateShardCount toutes les heures." }
    - id: b
      text: { en: "Create the stream in provisioned mode with enough shards for the highest expected peak.", fr: "Créer le flux en mode provisionné avec suffisamment de partitions pour le pic le plus élevé attendu." }
    - id: c
      text: { en: "Create the stream in on-demand capacity mode and have the producers write records with PutRecords.", fr: "Créer le flux en mode de capacité à la demande (on-demand) et faire écrire les enregistrements par les producteurs avec PutRecords." }
    - id: d
      text: { en: "Create the stream in provisioned mode and use the Kinesis Producer Library to aggregate records.", fr: "Créer le flux en mode provisionné et utiliser la Kinesis Producer Library pour agréger les enregistrements." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In on-demand mode, Kinesis Data Streams manages the shards and scales the capacity automatically, and the company pays for the throughput that it uses. This fits unpredictable traffic without any shard management. In provisioned mode, the developers choose the number of shards and pay for each shard per hour.
    fr: |
      En mode à la demande, Kinesis Data Streams gère les partitions et adapte automatiquement la capacité, et l'entreprise paie le débit qu'elle utilise. Ce mode convient à un trafic imprévisible sans aucune gestion de partitions. En mode provisionné, les développeurs choisissent le nombre de partitions et paient chaque partition à l'heure.
  options:
    a:
      en: "A scheduled resizing function is custom shard management, which the developers want to avoid, and an hourly schedule reacts too slowly to sudden peaks."
      fr: "Une fonction de redimensionnement planifiée est une gestion personnalisée des partitions, que les développeurs veulent éviter, et une planification horaire réagit trop lentement aux pics soudains."
    b:
      en: "Sizing for the peak means paying for idle shards most of the time, and the developers must still watch metrics and reshard when the peak grows."
      fr: "Dimensionner pour le pic revient à payer des partitions inactives la plupart du temps, et les développeurs doivent toujours surveiller les métriques et repartitionner quand le pic augmente."
    d:
      en: "Aggregation packs records more efficiently but does not change the shard count, so peaks can still exceed the provisioned capacity."
      fr: "L'agrégation regroupe les enregistrements plus efficacement mais ne change pas le nombre de partitions : les pics peuvent toujours dépasser la capacité provisionnée."
references:
  - title: Amazon Kinesis Data Streams terminology and concepts
    url: https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html
