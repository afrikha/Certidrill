id: dvac03-1a-lambda-error-regex
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A REST API in Amazon API Gateway uses a Lambda non-proxy (custom) integration. When an order doesn't exist, the Python function raises an exception whose message is "[NotFound] Order 123 does not exist". Clients receive HTTP 200 with the error in the body. The company wants clients to receive HTTP 404 in this case, without changing the function.

    Which solution will meet these requirements?
  fr: |
    Une API REST d'Amazon API Gateway utilise une intégration Lambda sans proxy (personnalisée). Quand une commande n'existe pas, la fonction Python lève une exception dont le message est "[NotFound] Order 123 does not exist". Les clients reçoivent HTTP 200 avec l'erreur dans le corps. L'entreprise veut que les clients reçoivent HTTP 404 dans ce cas, sans modifier la fonction.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change the function so that its result contains a statusCode field with the value 404.", fr: "Modifier la fonction pour que son résultat contienne un champ statusCode de valeur 404." }
    - id: b
      text:
        en: |
          Add a 404 method response and a 404 integration response whose Lambda error regex is `.*\[NotFound\].*`.
        fr: |
          Ajouter une réponse de méthode 404 et une réponse d'intégration 404 dont l'expression régulière d'erreur Lambda est `.*\[NotFound\].*`.
    - id: c
      text: { en: "Customize the RESOURCE_NOT_FOUND gateway response so that it returns HTTP 404 for this error.", fr: "Personnaliser la réponse de passerelle RESOURCE_NOT_FOUND pour qu'elle renvoie HTTP 404 pour cette erreur." }
    - id: d
      text: { en: "Set the passthroughBehavior of the integration to NEVER so that errors are not passed through.", fr: "Définir le passthroughBehavior de l'intégration sur NEVER pour que les erreurs ne soient pas transmises." }
answer: { optionId: b }
explanation:
  correct:
    en: "In a non-proxy integration, an unmapped Lambda error goes to the default integration response, usually 200. An integration response with a selection pattern (Lambda error regex) that matches the errorMessage, plus the matching method response, makes API Gateway return 404 for this error."
    fr: "Dans une intégration sans proxy, une erreur Lambda non mappée va vers la réponse d'intégration par défaut, généralement 200. Une réponse d'intégration avec un modèle de sélection (expression régulière d'erreur Lambda) qui correspond à errorMessage, plus la réponse de méthode correspondante, fait renvoyer 404 par API Gateway pour cette erreur."
  options:
    a:
      en: "A statusCode field in the result sets the status only with a Lambda proxy integration, and the company doesn't want to change the function."
      fr: "Un champ statusCode dans le résultat ne définit le code d'état qu'avec une intégration de proxy Lambda, et l'entreprise ne veut pas modifier la fonction."
    c:
      en: "Gateway responses apply to errors that API Gateway generates itself, not to errors returned by the Lambda function."
      fr: "Les réponses de passerelle s'appliquent aux erreurs générées par API Gateway lui-même, pas aux erreurs renvoyées par la fonction Lambda."
    d:
      en: "Passthrough behavior controls request bodies that have no matching mapping template; it doesn't map function errors to status codes."
      fr: "Le comportement de transfert direct contrôle les corps de requête sans modèle de mappage correspondant ; il ne mappe pas les erreurs de fonction sur des codes d'état."
references:
  - title: Handle Lambda errors in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/handle-errors-in-lambda-integration.html
