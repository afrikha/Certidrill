id: dvac03-1b-kds-for-dynamodb
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company records every change to an Amazon DynamoDB table. Six independent applications must consume the item-level changes at the same time. The company also wants to be able to reprocess the changes from the last 7 days after a bug fix. The company wants a managed solution that requires no custom replication code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de services financiers enregistre chaque modification d'une table Amazon DynamoDB. Six applications indépendantes doivent consommer les modifications au niveau des éléments en même temps. L'entreprise veut aussi pouvoir retraiter les modifications des 7 derniers jours après la correction d'un bogue. L'entreprise veut une solution gérée qui ne demande aucun code de réplication personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable DynamoDB Streams on the table and create one AWS Lambda event source mapping for each application.", fr: "Activer DynamoDB Streams sur la table et créer un mappage de source d'événements AWS Lambda pour chaque application." }
    - id: b
      text: { en: "Schedule a daily export of the table to Amazon S3 and have each application read the latest export.", fr: "Planifier un export quotidien de la table vers Amazon S3 et faire lire le dernier export par chaque application." }
    - id: c
      text: { en: "Turn on Kinesis Data Streams for DynamoDB, set the data stream retention to 7 days, and register each application as a consumer.", fr: "Activer Kinesis Data Streams for DynamoDB, définir la conservation du flux de données à 7 jours, et enregistrer chaque application comme consommateur." }
    - id: d
      text: { en: "Enable DynamoDB Streams with the NEW_AND_OLD_IMAGES view type and increase the stream retention period to 7 days.", fr: "Activer DynamoDB Streams avec le type de vue NEW_AND_OLD_IMAGES et porter la période de conservation du flux à 7 jours." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kinesis Data Streams for DynamoDB writes item-level changes to a Kinesis data stream, which can keep data for up to one year and supports up to 5 simultaneous consumers per shard, or 20 with enhanced fan-out. A 7-day retention lets the applications reread past changes. No replication code is needed.
    fr: |
      Kinesis Data Streams for DynamoDB écrit les modifications au niveau des éléments dans un flux de données Kinesis, qui peut conserver les données jusqu'à un an et prend en charge jusqu'à 5 consommateurs simultanés par partition (shard), ou 20 avec la diffusion améliorée (enhanced fan-out). Une conservation de 7 jours permet aux applications de relire les modifications passées. Aucun code de réplication n'est nécessaire.
  options:
    a:
      en: "DynamoDB Streams supports up to 2 simultaneous consumers per shard and keeps records for only 24 hours, so six readers and a 7-day replay are not possible."
      fr: "DynamoDB Streams prend en charge jusqu'à 2 consommateurs simultanés par partition et ne conserve les enregistrements que 24 heures : six lecteurs et une relecture sur 7 jours sont impossibles."
    b:
      en: "A daily export gives snapshots of the table, not the sequence of item-level changes, and the applications would not receive changes as they happen."
      fr: "Un export quotidien donne des instantanés de la table, pas la suite des modifications au niveau des éléments, et les applications ne recevraient pas les modifications au fil de l'eau."
    d:
      en: "The retention of DynamoDB Streams is fixed at 24 hours and cannot be increased."
      fr: "La conservation de DynamoDB Streams est fixée à 24 heures et ne peut pas être augmentée."
references:
  - title: Change data capture with Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/streamsmain.html
