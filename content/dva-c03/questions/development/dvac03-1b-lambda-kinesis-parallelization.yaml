id: dvac03-1b-lambda-kinesis-parallelization
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An IoT company processes telemetry from an Amazon Kinesis data stream with 4 shards by using an AWS Lambda event source mapping with default settings. The function does not return errors, but the IteratorAge metric keeps increasing during the day. Each invocation takes about 2 seconds because the function calls an external API for each batch. Records must stay in order for each device, and the device ID is the partition key. The company wants to reduce the processing delay without resharding the stream.

    Which solution will meet these requirements?
  fr: |
    Une entreprise IoT traite la télémétrie d'un flux de données Amazon Kinesis de 4 partitions (shards) au moyen d'un mappage de source d'événements AWS Lambda avec les paramètres par défaut. La fonction ne renvoie pas d'erreur, mais la métrique IteratorAge augmente tout au long de la journée. Chaque invocation dure environ 2 secondes, car la fonction appelle une API externe pour chaque lot. Les enregistrements doivent rester dans l'ordre pour chaque appareil, et l'ID d'appareil est la clé de partition. L'entreprise veut réduire le délai de traitement sans repartitionner le flux.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set the ParallelizationFactor of the event source mapping to 5 so that several batches of each shard are processed concurrently.", fr: "Définir le ParallelizationFactor du mappage de source d'événements sur 5 afin que plusieurs lots de chaque partition soient traités simultanément." }
    - id: b
      text: { en: "Set a reserved concurrency of 20 on the function so that Lambda can run more invocations for each shard.", fr: "Définir une simultanéité réservée de 20 sur la fonction afin que Lambda puisse exécuter davantage d'invocations pour chaque partition." }
    - id: c
      text: { en: "Set MaximumBatchingWindowInSeconds to 60 so that each invocation receives more records from the shard.", fr: "Définir MaximumBatchingWindowInSeconds sur 60 afin que chaque invocation reçoive davantage d'enregistrements de la partition." }
    - id: d
      text: { en: "Turn on BisectBatchOnFunctionError so that Lambda splits each batch into two smaller batches.", fr: "Activer BisectBatchOnFunctionError afin que Lambda divise chaque lot en deux lots plus petits." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      By default, Lambda processes one batch at a time per shard, so 4 shards allow only 4 concurrent invocations. ParallelizationFactor (1 to 10) lets Lambda process several batches from each shard at the same time while it still keeps records in order for each partition key. With a factor of 5, up to 20 invocations run concurrently without resharding.
    fr: |
      Par défaut, Lambda traite un lot à la fois par partition : 4 partitions ne permettent que 4 invocations simultanées. ParallelizationFactor (de 1 à 10) permet à Lambda de traiter plusieurs lots de chaque partition en même temps tout en conservant l'ordre des enregistrements pour chaque clé de partition. Avec un facteur de 5, jusqu'à 20 invocations s'exécutent simultanément sans repartitionnement.
  options:
    b:
      en: "Reserved concurrency only caps or guarantees concurrency; the event source mapping still sends one batch at a time per shard."
      fr: "La simultanéité réservée ne fait que plafonner ou garantir la simultanéité ; le mappage de source d'événements envoie toujours un lot à la fois par partition."
    c:
      en: "A batching window delays invocations to collect more records; it does not add concurrency and increases the delay that the company wants to reduce."
      fr: "Une fenêtre de traitement par lots retarde les invocations pour collecter davantage d'enregistrements ; elle n'ajoute pas de simultanéité et augmente le délai que l'entreprise veut réduire."
    d:
      en: "Bisecting applies only when the function returns an error, and this function does not fail."
      fr: "La division des lots ne s'applique que lorsque la fonction renvoie une erreur, et cette fonction n'échoue pas."
references:
  - title: Using Lambda to process records from Amazon Kinesis Data Streams
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html
  - title: Lambda parameters for Amazon Kinesis Data Streams event source mappings
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-kinesis-parameters.html
