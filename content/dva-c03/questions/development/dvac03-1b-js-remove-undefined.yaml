id: dvac03-1b-js-remove-undefined
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer migrates a Node.js application to the AWS SDK for JavaScript v3 and uses `DynamoDBDocumentClient` from `@aws-sdk/lib-dynamodb` to write user profiles. Some profiles have optional properties whose value is `undefined`. Since the migration, `PutCommand` fails for these profiles with an error that asks to remove undefined values. The optional properties must simply be left out of the stored items.

    Which change will meet these requirements with the LEAST code?
  fr: |
    Un développeur migre une application Node.js vers l'AWS SDK for JavaScript v3 et utilise `DynamoDBDocumentClient` de `@aws-sdk/lib-dynamodb` pour écrire des profils utilisateur. Certains profils ont des propriétés facultatives dont la valeur est `undefined`. Depuis la migration, `PutCommand` échoue pour ces profils avec une erreur qui demande de retirer les valeurs undefined. Les propriétés facultatives doivent simplement être absentes des éléments stockés.

    Quelle modification répond à ces exigences avec le MOINS de code ?
body:
  options:
    - id: a
      text: "`DynamoDBDocumentClient.from(client, { marshallOptions: { removeUndefinedValues: true } })`"
    - id: b
      text: "`DynamoDBDocumentClient.from(client, { unmarshallOptions: { wrapNumbers: true } })`"
    - id: c
      text: "`new PutCommand({ TableName: \"Users\", Item: JSON.stringify(profile) })`"
    - id: d
      text: "`new PutCommand({ TableName: \"Users\", Item: marshall(profile) })`"
answer: { optionId: a }
explanation:
  correct:
    en: |
      In v3, the document client keeps undefined values during marshalling, unlike the v2 DocumentClient, and the marshaller rejects them. Setting removeUndefinedValues to true in the marshallOptions of the document client removes these properties from every item that it writes, with one configuration change.
    fr: |
      En v3, le client de document conserve les valeurs undefined lors du marshalling, contrairement au DocumentClient de v2, et le marshaller les rejette. Définir removeUndefinedValues sur true dans les marshallOptions du client de document retire ces propriétés de chaque élément qu'il écrit, avec une seule modification de configuration.
  options:
    b:
      en: "unmarshallOptions apply when items are read; wrapNumbers keeps large numbers precise and does nothing for undefined values on writes."
      fr: "Les unmarshallOptions s'appliquent à la lecture des éléments ; wrapNumbers préserve la précision des grands nombres et ne fait rien pour les valeurs undefined à l'écriture."
    c:
      en: "Item must be an object of attributes; a JSON string is not a valid item for PutCommand."
      fr: "Item doit être un objet d'attributs ; une chaîne JSON n'est pas un élément valide pour PutCommand."
    d:
      en: "marshall without options throws the same error on undefined values, and the document client expects native JavaScript values, not AttributeValue maps."
      fr: "marshall sans options lève la même erreur sur les valeurs undefined, et le client de document attend des valeurs JavaScript natives, pas des maps AttributeValue."
references:
  - title: DynamoDB document client
    url: https://docs.aws.amazon.com/sdk-for-javascript/v3/developer-guide/migrate-dynamodb-doc-client.html
