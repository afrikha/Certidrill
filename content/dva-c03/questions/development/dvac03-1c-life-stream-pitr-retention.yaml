id: dvac03-1c-life-stream-pitr-retention
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An application writes click events to an Amazon Kinesis data stream that uses the default retention period, and stores user profiles in an Amazon DynamoDB table. New requirements state that consumers must be able to replay the stream records of the last 7 days, and that the table must be restorable to any second of the last 7 days. Backup data of the table must not be kept for more than 7 days.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application écrit des événements de clic dans un flux de données Amazon Kinesis qui utilise la période de conservation par défaut, et stocke les profils des utilisateurs dans une table Amazon DynamoDB. De nouvelles exigences imposent que les consommateurs puissent relire les enregistrements du flux des 7 derniers jours, et que la table puisse être restaurée à n'importe quelle seconde des 7 derniers jours. Les données de sauvegarde de la table ne doivent pas être conservées plus de 7 jours.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Call IncreaseStreamRetentionPeriod to set the stream's retention period to 168 hours.", fr: "Appeler IncreaseStreamRetentionPeriod pour définir la période de conservation du flux à 168 heures." } }
    - { id: b, text: { en: "Set MaximumRecordAgeInSeconds to 604800 on the Lambda event source mapping that reads the stream.", fr: "Définir MaximumRecordAgeInSeconds à 604800 sur le mappage de source d'événements Lambda qui lit le flux." } }
    - { id: c, text: { en: "Turn on point-in-time recovery for the table with RecoveryPeriodInDays set to 7.", fr: "Activer la restauration à un instant dans le passé (PITR) pour la table avec RecoveryPeriodInDays défini à 7." } }
    - { id: d, text: { en: "Turn on time to live (TTL) on the table so that items are deleted after 7 days.", fr: "Activer la durée de vie (TTL) sur la table afin que les éléments soient supprimés après 7 jours." } }
    - { id: e, text: { en: "Create a daily on-demand backup of the table, and delete each backup after 7 days.", fr: "Créer une sauvegarde à la demande quotidienne de la table, et supprimer chaque sauvegarde après 7 jours." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A Kinesis data stream keeps records for 24 hours by default, and IncreaseStreamRetentionPeriod raises the retention up to 8,760 hours, so 168 hours keeps 7 days of records for replay. DynamoDB point-in-time recovery restores to any second of its recovery period, which defaults to 35 days and can be set from 1 to 35 days."
    fr: "Un flux de données Kinesis conserve les enregistrements 24 heures par défaut, et IncreaseStreamRetentionPeriod augmente la conservation jusqu'à 8 760 heures : 168 heures conservent 7 jours d'enregistrements pour la relecture. La restauration à un instant dans le passé de DynamoDB restaure à n'importe quelle seconde de sa période de récupération, qui est de 35 jours par défaut et peut être définie de 1 à 35 jours."
  options:
    b:
      en: "MaximumRecordAgeInSeconds tells the event source mapping when to discard old records during retries; it does not change how long the stream keeps them."
      fr: "MaximumRecordAgeInSeconds indique au mappage de source d'événements quand rejeter les anciens enregistrements lors des nouvelles tentatives ; il ne change pas la durée pendant laquelle le flux les conserve."
    d:
      en: "TTL deletes live items from the table; it provides no backup or restore capability."
      fr: "La TTL supprime des éléments actifs de la table ; elle ne fournit aucune capacité de sauvegarde ni de restauration."
    e:
      en: "Daily backups can restore only to the time of each backup, not to any second of the last 7 days."
      fr: "Des sauvegardes quotidiennes ne permettent de restaurer qu'à l'heure de chaque sauvegarde, pas à n'importe quelle seconde des 7 derniers jours."
references:
  - title: Change the data retention period
    url: https://docs.aws.amazon.com/streams/latest/dev/kinesis-extended-retention.html
  - title: Point-in-time backups for DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Point-in-time-recovery.html
