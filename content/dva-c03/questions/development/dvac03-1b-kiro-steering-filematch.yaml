id: dvac03-1b-kiro-steering-filematch
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A repository contains application code and AWS SAM templates under `infra/`. A developer writes a Kiro steering file with rules for SAM templates, such as mandatory tags and the runtime to use. The rules must be loaded automatically when Kiro works on files that match `infra/**/*.yaml`, and they must not take up context in other interactions.

    How should the developer configure the steering file?
  fr: |
    Un dépôt contient du code applicatif et des modèles AWS SAM sous `infra/`. Un développeur écrit un fichier steering Kiro avec des règles pour les modèles SAM, comme des étiquettes obligatoires et l'environnement d'exécution (runtime) à utiliser. Les règles doivent être chargées automatiquement quand Kiro travaille sur des fichiers qui correspondent à `infra/**/*.yaml`, et elles ne doivent pas occuper de contexte dans les autres interactions.

    Comment le développeur doit-il configurer le fichier steering ?
body:
  options:
    - id: a
      text: { en: "Set `inclusion: always` in the front matter and start each rule with the path infra/.", fr: "Définir `inclusion: always` dans l'en-tête (front matter) et commencer chaque règle par le chemin infra/." }
    - id: b
      text: { en: "Set `inclusion: manual` in the front matter so that developers reference the file in chat.", fr: "Définir `inclusion: manual` dans l'en-tête (front matter) afin que les développeurs référencent le fichier dans la conversation." }
    - id: c
      text: { en: "Set `inclusion: fileMatch` with `fileMatchPattern: \"infra/**/*.yaml\"` in the front matter.", fr: "Définir `inclusion: fileMatch` avec `fileMatchPattern: \"infra/**/*.yaml\"` dans l'en-tête (front matter)." }
    - id: d
      text: { en: "Add the pattern infra/**/*.yaml to a .kiroignore file next to the steering file.", fr: "Ajouter le modèle infra/**/*.yaml dans un fichier .kiroignore à côté du fichier steering." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The inclusion mode of a steering file is set in YAML front matter at the top of the file. With `inclusion: fileMatch`, Kiro loads the file only when it works with files that match fileMatchPattern, so the SAM rules are present for templates under infra/ and absent from other interactions.
    fr: |
      Le mode d'inclusion d'un fichier steering se définit dans l'en-tête YAML (front matter) en haut du fichier. Avec `inclusion: fileMatch`, Kiro ne charge le fichier que lorsqu'il travaille sur des fichiers qui correspondent à fileMatchPattern : les règles SAM sont présentes pour les modèles sous infra/ et absentes des autres interactions.
  options:
    a:
      en: "always is the default mode and loads the file in every interaction, which uses context when Kiro works on other files."
      fr: "always est le mode par défaut et charge le fichier dans chaque interaction, ce qui occupe du contexte quand Kiro travaille sur d'autres fichiers."
    b:
      en: "manual loads the file only when someone references it with #, so it is not loaded automatically for SAM templates."
      fr: "manual ne charge le fichier que lorsque quelqu'un le référence avec #, il n'est donc pas chargé automatiquement pour les modèles SAM."
    d:
      en: ".kiroignore prevents Kiro from reading the matching files, so Kiro could no longer work on the SAM templates."
      fr: ".kiroignore empêche Kiro de lire les fichiers correspondants : Kiro ne pourrait plus travailler sur les modèles SAM."
references:
  - title: Steering
    url: https://kiro.dev/docs/steering/
