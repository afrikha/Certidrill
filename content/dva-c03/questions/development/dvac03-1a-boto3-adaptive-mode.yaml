id: dvac03-1a-boto3-adaptive-mode
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A nightly batch job written in Python writes millions of items to a single Amazon DynamoDB table that uses provisioned capacity. The job isn't latency sensitive. During the run, the job receives sustained throttling errors, and the retries of the SDK's standard retry mode keep failing in bursts. The developer wants the SDK to also limit the rate at which the client sends requests when throttling occurs, without writing rate-limiting code.

    Which client configuration will meet these requirements?
  fr: |
    Un traitement par lots nocturne écrit en Python écrit des millions d'éléments dans une seule table Amazon DynamoDB qui utilise la capacité provisionnée. Le traitement n'est pas sensible à la latence. Pendant l'exécution, il reçoit des erreurs de limitation persistantes, et les nouvelles tentatives du mode standard du SDK continuent d'échouer par vagues. Le développeur veut que le SDK limite aussi le débit auquel le client envoie des requêtes en cas de limitation, sans écrire de code de limitation de débit.

    Quelle configuration du client répond à ces exigences ?
body:
  options:
    - id: a
      text: "`Config(retries={\"mode\": \"legacy\", \"total_max_attempts\": 10})`"
    - id: b
      text: "`Config(retries={\"mode\": \"adaptive\", \"total_max_attempts\": 10})`"
    - id: c
      text: "`Config(retries={\"mode\": \"standard\", \"total_max_attempts\": 1})`"
    - id: d
      text: "`Config(connect_timeout=60, read_timeout=60)`"
answer: { optionId: b }
explanation:
  correct:
    en: "Adaptive mode includes everything in standard mode plus a client-side rate limiter (token bucket) that slows the requests of the client when the service throttles. AWS suggests it for single-resource, throttling-heavy, latency-tolerant workloads like this job."
    fr: "Le mode adaptive inclut tout le mode standard plus un limiteur de débit côté client (compartiment à jetons) qui ralentit les requêtes du client quand le service applique une limitation. AWS le conseille pour les charges de travail sur une seule ressource, très limitées et tolérantes à la latence, comme ce traitement."
  options:
    a:
      en: "Legacy mode is the older retry handler kept for backward compatibility; it has no client-side rate limiter."
      fr: "Le mode legacy est l'ancien gestionnaire de nouvelles tentatives conservé pour la compatibilité ; il n'a pas de limiteur de débit côté client."
    c:
      en: "A total of 1 attempt disables retries, so every throttled write fails instead of being slowed down."
      fr: "Un total de 1 tentative désactive les nouvelles tentatives : chaque écriture limitée échoue au lieu d'être ralentie."
    d:
      en: "Longer timeouts don't address throttling; DynamoDB rejects the excess requests quickly whatever the timeout."
      fr: "Des délais d'expiration plus longs ne traitent pas la limitation ; DynamoDB rejette rapidement les requêtes excédentaires quel que soit le délai."
references:
  - title: Retries
    url: https://docs.aws.amazon.com/boto3/latest/guide/retries.html
  - title: Retry behavior
    url: https://docs.aws.amazon.com/sdkref/latest/guide/feature-retry-behavior.html
