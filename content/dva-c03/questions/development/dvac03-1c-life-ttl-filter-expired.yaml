id: dvac03-1c-life-ttl-filter-expired
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A loyalty application stores coupons in an Amazon DynamoDB table with time to live (TTL) enabled on an expiresAt attribute. The application queries the coupons of a customer by partition key. Sometimes the results include coupons whose expiresAt time has already passed. The application must never show expired coupons.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une application de fidélité stocke des coupons dans une table Amazon DynamoDB avec la durée de vie (TTL) activée sur un attribut expiresAt. L'application interroge les coupons d'un client par clé de partition. Parfois, les résultats contiennent des coupons dont l'heure expiresAt est déjà passée. L'application ne doit jamais afficher de coupons expirés.

    Quelle solution répond à ces exigences de la manière la PLUS économique ?
body:
  options:
    - { id: a, text: { en: "Add a filter expression such as `expiresAt > :now` to the Query, with the current time in epoch seconds.", fr: "Ajouter une expression de filtre comme `expiresAt > :now` à la requête Query, avec l'heure actuelle en secondes epoch." } }
    - { id: b, text: { en: "Use strongly consistent reads for the Query so that items that TTL has expired are not returned.", fr: "Utiliser des lectures fortement cohérentes pour la requête Query afin que les éléments expirés par la TTL ne soient pas renvoyés." } }
    - { id: c, text: { en: "Turn TTL off and on again on the table so that DynamoDB deletes the expired items sooner.", fr: "Désactiver puis réactiver la TTL sur la table afin que DynamoDB supprime plus tôt les éléments expirés." } }
    - { id: d, text: { en: "Run a Lambda function every minute that scans the table and deletes the expired coupons.", fr: "Exécuter chaque minute une fonction Lambda qui analyse la table et supprime les coupons expirés." } }
answer: { optionId: a }
explanation:
  correct:
    en: "TTL deletes expired items within a few days, not at the expiration time, so expired items can still be read until they are deleted. DynamoDB recommends a filter expression that removes expired items from Query and Scan results."
    fr: "La TTL supprime les éléments expirés dans les quelques jours qui suivent, pas à l'heure d'expiration : les éléments expirés peuvent donc encore être lus tant qu'ils ne sont pas supprimés. DynamoDB recommande une expression de filtre qui retire les éléments expirés des résultats de Query et de Scan."
  options:
    b:
      en: "The expired items have not been deleted yet, so a strongly consistent read returns them as well."
      fr: "Les éléments expirés n'ont pas encore été supprimés : une lecture fortement cohérente les renvoie aussi."
    c:
      en: "Toggling TTL does not speed up the background deletion process."
      fr: "Désactiver et réactiver la TTL n'accélère pas le processus de suppression en arrière-plan."
    d:
      en: "Scanning the table every minute consumes read and write capacity continuously, which is far more expensive than a filter."
      fr: "Analyser la table chaque minute consomme en permanence de la capacité de lecture et d'écriture, ce qui coûte bien plus cher qu'un filtre."
references:
  - title: Using time to live (TTL) in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html
