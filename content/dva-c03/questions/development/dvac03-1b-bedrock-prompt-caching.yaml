id: dvac03-1b-bedrock-prompt-caching
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application answers questions about a 40-page product manual by calling the Amazon Bedrock Converse API with a supported model. Every request sends the same manual text in the system prompt, followed by a short user question. The company wants to reduce the response latency and the cost of the repeated input tokens without changing the model or shortening the manual.

    Which solution will meet these requirements?
  fr: |
    Une application répond à des questions sur un manuel produit de 40 pages en appelant l'API Converse d'Amazon Bedrock avec un modèle pris en charge. Chaque requête envoie le même texte du manuel dans l'invite système, suivi d'une courte question de l'utilisateur. L'entreprise veut réduire la latence des réponses et le coût des jetons d'entrée répétés, sans changer de modèle ni raccourcir le manuel.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Move the manual text from the system field into the first user message of each request.", fr: "Déplacer le texte du manuel du champ system vers le premier message user de chaque requête." }
    - id: b
      text: { en: "Store each answer in Amazon ElastiCache and return it when the same manual is sent again.", fr: "Stocker chaque réponse dans Amazon ElastiCache et la renvoyer quand le même manuel est envoyé de nouveau." }
    - id: c
      text: { en: "Add a cachePoint block after the manual text in the system field of each request.", fr: "Ajouter un bloc cachePoint après le texte du manuel dans le champ system de chaque requête." }
    - id: d
      text: { en: "Lower maxTokens and temperature in inferenceConfig so that the model processes the manual faster.", fr: "Réduire maxTokens et temperature dans inferenceConfig afin que le modèle traite le manuel plus rapidement." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Prompt caching reduces inference latency and input token costs for long, repeated context. A cachePoint block marks the end of the prefix to cache; later requests that start with the same prefix read it from the cache, and the TTL resets with each hit. The response reports cacheReadInputTokens and cacheWriteInputTokens to confirm the cache use.
    fr: |
      La mise en cache des invites (prompt caching) réduit la latence d'inférence et le coût des jetons d'entrée pour un contexte long et répété. Un bloc cachePoint marque la fin du préfixe à mettre en cache ; les requêtes suivantes qui commencent par le même préfixe le lisent dans le cache, et la durée de vie (TTL) est réinitialisée à chaque accès. La réponse indique cacheReadInputTokens et cacheWriteInputTokens pour confirmer l'utilisation du cache.
  options:
    b:
      en: "Users ask different questions, so cached answers rarely match, and the manual tokens are still processed for every new question."
      fr: "Les utilisateurs posent des questions différentes : les réponses en cache correspondent rarement, et les jetons du manuel sont toujours traités pour chaque nouvelle question."
    a:
      en: "Moving the text does not reduce the number of input tokens processed, so latency and cost stay the same."
      fr: "Déplacer le texte ne réduit pas le nombre de jetons d'entrée traités : la latence et le coût restent les mêmes."
    d:
      en: "These settings act on the generated output; the long input is still processed in full on every request."
      fr: "Ces paramètres agissent sur la sortie générée ; la longue entrée est toujours traitée en entier à chaque requête."
references:
  - title: Prompt caching for faster model inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
