id: dvac03-1b-kiro-steering-conventions
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A team uses Kiro to generate AWS Lambda functions in Python for a shared repository. The generated code often ignores the team conventions: structured logging with a shared library, error responses in a fixed JSON format and a naming scheme for environment variables. Developers do not want to repeat these rules in every prompt, and the rules must apply to every team member who works in the repository.

    Which solution will meet these requirements?
  fr: |
    Une équipe utilise Kiro pour générer des fonctions AWS Lambda en Python dans un dépôt partagé. Le code généré ignore souvent les conventions de l'équipe : journalisation structurée avec une bibliothèque commune, réponses d'erreur dans un format JSON fixe et schéma de nommage des variables d'environnement. Les développeurs ne veulent pas répéter ces règles dans chaque invite, et les règles doivent s'appliquer à chaque membre de l'équipe qui travaille dans le dépôt.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add the conventions to the tasks.md file of the current spec of the repository.", fr: "Ajouter les conventions dans le fichier tasks.md de la spec en cours du dépôt." }
    - id: b
      text: { en: "Write the conventions in a Markdown file in the ~/.kiro/steering/ folder of each developer's computer.", fr: "Écrire les conventions dans un fichier Markdown du dossier ~/.kiro/steering/ de l'ordinateur de chaque développeur." }
    - id: c
      text: { en: "Add the conventions to a .kiroignore file at the root of the repository.", fr: "Ajouter les conventions dans un fichier .kiroignore à la racine du dépôt." }
    - id: d
      text: { en: "Write the conventions in a Markdown file in the .kiro/steering/ folder of the repository and commit it.", fr: "Écrire les conventions dans un fichier Markdown du dossier .kiro/steering/ du dépôt et le valider (commit)." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Steering files are Markdown files that give Kiro persistent knowledge of a project, so conventions do not have to be repeated in each chat. Workspace steering files live in .kiro/steering/ at the project root and apply to that workspace; committed with the repository, they reach every team member. By default a steering file is included in every interaction.
    fr: |
      Les fichiers steering sont des fichiers Markdown qui donnent à Kiro une connaissance persistante d'un projet : les conventions n'ont pas à être répétées dans chaque conversation. Les fichiers steering de l'espace de travail se trouvent dans .kiro/steering/ à la racine du projet et s'appliquent à cet espace de travail ; validés avec le dépôt, ils atteignent chaque membre de l'équipe. Par défaut, un fichier steering est inclus dans chaque interaction.
  options:
    b:
      en: "Global steering in ~/.kiro/steering/ applies to all workspaces of one developer and must be copied by hand to each computer, so it is not shared through the repository."
      fr: "Le steering global dans ~/.kiro/steering/ s'applique à tous les espaces de travail d'un développeur et doit être copié à la main sur chaque ordinateur : il n'est pas partagé par le dépôt."
    c:
      en: ".kiroignore lists files that Kiro must not read; it does not give instructions to the agent."
      fr: ".kiroignore liste les fichiers que Kiro ne doit pas lire ; il ne donne pas d'instructions à l'agent."
    a:
      en: "tasks.md is the task list of one spec; the conventions would not apply to work outside that spec."
      fr: "tasks.md est la liste des tâches d'une spec ; les conventions ne s'appliqueraient pas au travail hors de cette spec."
references:
  - title: Steering
    url: https://kiro.dev/docs/steering/
