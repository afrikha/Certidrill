id: dvac03-1b-kiro-context-refactoring
objective: "1.1.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer asks Kiro in the IDE for refactoring suggestions on a legacy Lambda handler that is open in the editor. The suggestions must take into account the diagnostics that the editor reports for the current file and the uncommitted changes that the developer has already made in the repository. The developer wants to attach this context to the chat message without pasting it.

    Which two context providers should the developer add to the message? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur demande à Kiro dans l'IDE des suggestions de refactorisation pour un ancien gestionnaire (handler) Lambda ouvert dans l'éditeur. Les suggestions doivent tenir compte des diagnostics que l'éditeur signale pour le fichier actuel et des modifications non validées que le développeur a déjà faites dans le dépôt. Le développeur veut joindre ce contexte au message de la conversation sans le coller.

    Quels sont les deux fournisseurs de contexte que le développeur doit ajouter au message ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "#problems" }
    - { id: b, text: "#git diff" }
    - { id: c, text: "#steering" }
    - { id: d, text: "#url" }
    - { id: e, text: "#spec" }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      #problems includes all the problems that the editor reports in the current file, and #git diff references the current Git changes. Together they give Kiro the diagnostics and the uncommitted changes, so its refactoring suggestions start from the actual state of the code.
    fr: |
      #problems inclut tous les problèmes que l'éditeur signale dans le fichier actuel, et #git diff référence les modifications Git en cours. Ensemble, ils donnent à Kiro les diagnostics et les modifications non validées : ses suggestions de refactorisation partent de l'état réel du code.
  options:
    c:
      en: "#steering includes chosen steering files with project guidance, not editor diagnostics or Git changes."
      fr: "#steering inclut des fichiers steering choisis avec des indications sur le projet, pas les diagnostics de l'éditeur ni les modifications Git."
    d:
      en: "#url includes web documentation from an address, not information about the local code."
      fr: "#url inclut une documentation web à partir d'une adresse, pas des informations sur le code local."
    e:
      en: "#spec references the requirements, design and tasks files of a spec, not the current diagnostics or changes."
      fr: "#spec référence les fichiers d'exigences, de conception et de tâches d'une spec, pas les diagnostics ni les modifications en cours."
references:
  - title: Chat
    url: https://kiro.dev/docs/ide/chat/
