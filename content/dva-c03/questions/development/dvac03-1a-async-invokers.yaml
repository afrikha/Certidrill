id: dvac03-1a-async-invokers
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer reviews the event sources that invoke a Lambda function. The developer needs to know which sources invoke the function asynchronously, so that Lambda queues the event and returns success to the source without returning the function's result.

    Which two event sources invoke the function asynchronously? (Choose two.)
  fr: |
    Un développeur examine les sources d'événements qui invoquent une fonction Lambda. Il doit savoir quelles sources invoquent la fonction de manière asynchrone, c'est-à-dire que Lambda met l'événement en file d'attente et renvoie un succès à la source sans renvoyer le résultat de la fonction.

    Quelles sont les deux sources d'événements qui invoquent la fonction de manière asynchrone ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "An Amazon API Gateway REST API with a Lambda proxy integration", fr: "Une API REST Amazon API Gateway avec une intégration de proxy Lambda" } }
    - { id: b, text: { en: "An Amazon S3 event notification", fr: "Une notification d'événement Amazon S3" } }
    - { id: c, text: { en: "An Application Load Balancer with the function as a target", fr: "Un Application Load Balancer dont la fonction est une cible" } }
    - { id: d, text: { en: "An Amazon SNS topic subscription", fr: "Un abonnement à une rubrique Amazon SNS" } }
    - { id: e, text: { en: "An Amazon SQS queue read through an event source mapping", fr: "Une file d'attente Amazon SQS lue au moyen d'un mappage de source d'événements" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Amazon S3 and Amazon SNS invoke Lambda asynchronously: Lambda queues the event, returns success right away, and handles retries of function errors itself."
    fr: "Amazon S3 et Amazon SNS invoquent Lambda de manière asynchrone : Lambda met l'événement en file d'attente, renvoie immédiatement un succès et gère lui-même les nouvelles tentatives en cas d'erreur de la fonction."
  options:
    a:
      en: "API Gateway invokes the function synchronously and waits for its response to return it to the client."
      fr: "API Gateway invoque la fonction de manière synchrone et attend sa réponse pour la renvoyer au client."
    c:
      en: "An Application Load Balancer invokes the function synchronously to build the HTTP response."
      fr: "Un Application Load Balancer invoque la fonction de manière synchrone pour construire la réponse HTTP."
    e:
      en: "With SQS, Lambda polls the queue through an event source mapping and invokes the function synchronously with batches of messages."
      fr: "Avec SQS, Lambda interroge la file au moyen d'un mappage de source d'événements et invoque la fonction de manière synchrone avec des lots de messages."
references:
  - title: Invoking Lambda with events from other AWS services
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-services.html
