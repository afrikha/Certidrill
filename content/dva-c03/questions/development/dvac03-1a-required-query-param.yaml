id: dvac03-1a-required-query-param
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The GET /reports method of a REST API in Amazon API Gateway needs a customerId query string parameter. Requests without it reach the backend and cause errors. The company wants API Gateway to return a 400 error when the parameter is missing or empty.

    Which solution will meet these requirements?
  fr: |
    La méthode GET /reports d'une API REST Amazon API Gateway a besoin d'un paramètre de chaîne de requête customerId. Les requêtes qui ne l'ont pas atteignent le backend et provoquent des erreurs. L'entreprise veut qu'API Gateway renvoie une erreur 400 quand le paramètre est absent ou vide.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a model that lists customerId as a required property and enable body validation on the method.", fr: "Créer un modèle qui indique customerId comme propriété obligatoire et activer la validation du corps sur la méthode." }
    - id: b
      text: { en: "Add a mapping template that sets a default value for customerId when the parameter is missing.", fr: "Ajouter un modèle de mappage qui définit une valeur par défaut pour customerId quand le paramètre est absent." }
    - id: c
      text: { en: "Add customerId as a cache key parameter of the method and enable caching on the stage.", fr: "Ajouter customerId comme paramètre de clé de cache de la méthode et activer la mise en cache sur l'étape." }
    - id: d
      text: { en: "Mark customerId as required in the method request and enable a request validator that validates parameters.", fr: "Marquer customerId comme obligatoire dans la demande de méthode et activer un validateur de requête qui valide les paramètres." }
answer: { optionId: d }
explanation:
  correct:
    en: "Parameter validation checks that the required request parameters in the URI, query string and headers are present and not blank. With customerId marked as required and a validator that validates parameters, API Gateway returns a 400 error before calling the backend."
    fr: "La validation des paramètres vérifie que les paramètres de requête obligatoires de l'URI, de la chaîne de requête et des en-têtes sont présents et non vides. Avec customerId marqué comme obligatoire et un validateur qui valide les paramètres, API Gateway renvoie une erreur 400 avant d'appeler le backend."
  options:
    a:
      en: "A model validates the request body; a GET request carries customerId in the query string, which body validation doesn't check."
      fr: "Un modèle valide le corps de la requête ; une requête GET transporte customerId dans la chaîne de requête, que la validation du corps ne contrôle pas."
    b:
      en: "A default value hides the missing parameter instead of returning the required 400 error."
      fr: "Une valeur par défaut masque le paramètre manquant au lieu de renvoyer l'erreur 400 exigée."
    c:
      en: "Cache key parameters only decide how responses are cached; they don't reject requests."
      fr: "Les paramètres de clé de cache décident seulement de la mise en cache des réponses ; ils ne rejettent pas les requêtes."
references:
  - title: Set up basic request validation in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-validation-set-up.html
  - title: Request validation for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-method-request-validation.html
