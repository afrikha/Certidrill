id: dvac03-1a-cloudfront-origin-failover
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company serves a product catalog website from an Amazon S3 bucket in us-east-1 through Amazon CloudFront. S3 Replication copies the objects to a bucket in us-west-2. The company wants CloudFront to serve GET requests from the us-west-2 bucket automatically when the primary bucket returns 500 or 503 errors, without writing code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise diffuse un site de catalogue de produits depuis un compartiment Amazon S3 situé dans us-east-1 via Amazon CloudFront. S3 Replication copie les objets dans un compartiment situé dans us-west-2. L'entreprise veut que CloudFront serve automatiquement les requêtes GET depuis le compartiment us-west-2 quand le compartiment principal renvoie des erreurs 500 ou 503, sans écrire de code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure CloudFront custom error responses for 500 and 503 errors that return an error page stored in the us-west-2 bucket.", fr: "Configurer des réponses d'erreur personnalisées CloudFront pour les erreurs 500 et 503 qui renvoient une page d'erreur stockée dans le compartiment us-west-2." }
    - id: b
      text: { en: "Add a Lambda@Edge function on origin requests that calls the us-west-2 bucket when the primary bucket fails.", fr: "Ajouter une fonction Lambda@Edge sur les requêtes d'origine qui appelle le compartiment us-west-2 quand le compartiment principal échoue." }
    - id: c
      text: { en: "Enable S3 Transfer Acceleration on the primary bucket and keep the primary bucket as the only CloudFront origin.", fr: "Activer S3 Transfer Acceleration sur le compartiment principal et conserver ce compartiment comme seule origine CloudFront." }
    - id: d
      text: { en: "Create an origin group with the us-east-1 bucket as primary and the us-west-2 bucket as secondary, failing over on 500 and 503.", fr: "Créer un groupe d'origines avec le compartiment us-east-1 comme principal et le compartiment us-west-2 comme secondaire, avec basculement sur 500 et 503." }
answer: { optionId: d }
explanation:
  correct:
    en: "A CloudFront origin group has a primary and a secondary origin. When the primary origin returns one of the status codes chosen as failover criteria, or can't be reached, CloudFront sends the request to the secondary origin. Failover applies to GET, HEAD and OPTIONS requests, which covers a catalog website."
    fr: "Un groupe d'origines CloudFront comporte une origine principale et une origine secondaire. Quand l'origine principale renvoie l'un des codes d'état choisis comme critères de basculement, ou ne répond pas, CloudFront envoie la requête à l'origine secondaire. Le basculement s'applique aux requêtes GET, HEAD et OPTIONS, ce qui couvre un site de catalogue."
  options:
    a:
      en: "A custom error response replaces the error with an error page; it doesn't fetch the content from the replica bucket."
      fr: "Une réponse d'erreur personnalisée remplace l'erreur par une page d'erreur ; elle ne récupère pas le contenu dans le compartiment répliqué."
    b:
      en: "A Lambda@Edge function could route requests, but it is custom code, which the company wants to avoid."
      fr: "Une fonction Lambda@Edge pourrait router les requêtes, mais c'est du code spécifique, ce que l'entreprise veut éviter."
    c:
      en: "Transfer Acceleration speeds up transfers to one bucket; it doesn't switch to another bucket when the primary returns errors."
      fr: "Transfer Acceleration accélère les transferts vers un compartiment ; il ne bascule pas vers un autre compartiment quand le principal renvoie des erreurs."
references:
  - title: Optimize high availability with CloudFront origin failover
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/high_availability_origin_failover.html
