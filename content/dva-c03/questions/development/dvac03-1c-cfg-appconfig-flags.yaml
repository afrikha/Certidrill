id: dvac03-1c-cfg-appconfig-flags
objective: "1.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 15 Node.js AWS Lambda functions that read feature flags from environment variables. Each flag change requires an update of all 15 function configurations. The product team wants to change flags at runtime without updating any function, and the functions must cache the flags locally to limit the number of calls to the configuration service.

    Which combination of steps will meet these requirements with the LEAST development effort? (Choose two.)
  fr: |
    AnyCompany dispose de 15 fonctions AWS Lambda en Node.js qui lisent des indicateurs de fonctionnalité (feature flags) dans des variables d'environnement. Chaque modification d'indicateur exige de mettre à jour la configuration des 15 fonctions. L'équipe produit souhaite modifier les indicateurs à l'exécution sans mettre à jour aucune fonction, et les fonctions doivent mettre les indicateurs en cache localement pour limiter le nombre d'appels au service de configuration.

    Quelle combinaison d'étapes répond à ces exigences avec le MOINS d'effort de développement ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store the flags in an AWS AppConfig feature flag configuration profile, and deploy them to an AppConfig environment.", fr: "Stocker les indicateurs dans un profil de configuration d'indicateurs de fonctionnalité AWS AppConfig, et les déployer dans un environnement AppConfig." } }
    - { id: b, text: { en: "Store the flags in a Lambda layer, and publish a new layer version for each flag change.", fr: "Stocker les indicateurs dans une couche (layer) Lambda, et publier une nouvelle version de la couche à chaque modification d'indicateur." } }
    - { id: c, text: { en: "Call the AppConfig GetLatestConfiguration API from the handler on every invocation.", fr: "Appeler l'API AppConfig GetLatestConfiguration depuis le gestionnaire à chaque appel." } }
    - { id: d, text: { en: "Add the AWS AppConfig Agent Lambda extension layer to the functions, and read the flags from the extension's local HTTP endpoint.", fr: "Ajouter la couche de l'extension AWS AppConfig Agent Lambda aux fonctions, et lire les indicateurs sur le point de terminaison HTTP local de l'extension." } }
    - { id: e, text: { en: "Encrypt the flag environment variables with a customer managed AWS KMS key so that they can be changed without a deployment.", fr: "Chiffrer les variables d'environnement des indicateurs avec une clé AWS KMS gérée par le client afin de pouvoir les modifier sans déploiement." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "AWS AppConfig stores and deploys feature flags independently of the functions, so a flag change needs no function update. The AWS AppConfig Agent Lambda extension, added as a layer, retrieves and caches the configuration and serves it locally, which reduces AppConfig API calls without custom polling code."
    fr: "AWS AppConfig stocke et déploie les indicateurs de fonctionnalité indépendamment des fonctions : une modification d'indicateur ne demande aucune mise à jour de fonction. L'extension AWS AppConfig Agent Lambda, ajoutée sous forme de couche, récupère la configuration, la met en cache et la sert localement, ce qui réduit les appels à l'API AppConfig sans code d'interrogation personnalisé."
  options:
    b:
      en: "A new layer version must be added to each function, which is a function update for every flag change."
      fr: "Une nouvelle version de couche doit être ajoutée à chaque fonction, ce qui représente une mise à jour de fonction à chaque modification d'indicateur."
    c:
      en: "Calling the API on every invocation adds session-management code and maximizes the number of AppConfig calls instead of caching."
      fr: "Appeler l'API à chaque appel ajoute du code de gestion de session et maximise le nombre d'appels à AppConfig au lieu de mettre en cache."
    e:
      en: "Encryption does not change how environment variables are updated: each change is still a configuration update of every function."
      fr: "Le chiffrement ne change pas la façon de mettre à jour les variables d'environnement : chaque modification reste une mise à jour de configuration de chaque fonction."
references:
  - title: Using AWS AppConfig Agent with AWS Lambda
    url: https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-integration-lambda-extensions.html
