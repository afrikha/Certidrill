id: dvac03-1b-bedrock-converse-stream
objective: "1.1.10"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A web application calls the Amazon Bedrock Converse API and shows the answer only when the whole response is generated, which takes up to 20 seconds. Users must see the text appear progressively as the model generates it. The IAM role of the backend currently allows only `bedrock:InvokeModel`.

    Which combination of changes will meet these requirements? (Choose two.)
  fr: |
    Une application web appelle l'API Converse d'Amazon Bedrock et n'affiche la réponse que lorsqu'elle est entièrement générée, ce qui prend jusqu'à 20 secondes. Les utilisateurs doivent voir le texte apparaître progressivement à mesure que le modèle le génère. Le rôle IAM du backend n'autorise actuellement que `bedrock:InvokeModel`.

    Quelle combinaison de modifications répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Call ConverseStream and forward the text of each contentBlockDelta event to the client.", fr: "Appeler ConverseStream et transmettre au client le texte de chaque événement contentBlockDelta." } }
    - { id: b, text: { en: "Allow the bedrock:InvokeModelWithResponseStream action in the IAM role of the backend.", fr: "Autoriser l'action bedrock:InvokeModelWithResponseStream dans le rôle IAM du backend." } }
    - { id: c, text: { en: "Lower maxTokens in inferenceConfig so that the model returns its answer faster.", fr: "Réduire maxTokens dans inferenceConfig afin que le modèle renvoie sa réponse plus rapidement." } }
    - { id: d, text: { en: "Submit the prompts as a batch inference job and poll the output location in Amazon S3.", fr: "Soumettre les invites sous forme de tâche d'inférence par lots et interroger l'emplacement de sortie dans Amazon S3." } }
    - { id: e, text: { en: "Allow the bedrock:CreateModelInvocationJob action in the IAM role of the backend.", fr: "Autoriser l'action bedrock:CreateModelInvocationJob dans le rôle IAM du backend." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      ConverseStream returns the response as a stream of events: messageStart, contentBlockDelta events with the generated text, contentBlockStop, messageStop with the stop reason, and metadata with the usage. Forwarding each delta lets users see the text as it is generated. ConverseStream requires the bedrock:InvokeModelWithResponseStream permission, while Converse requires bedrock:InvokeModel.
    fr: |
      ConverseStream renvoie la réponse sous forme de flux d'événements : messageStart, des événements contentBlockDelta avec le texte généré, contentBlockStop, messageStop avec le motif d'arrêt et metadata avec la consommation. Transmettre chaque delta permet aux utilisateurs de voir le texte au fur et à mesure de sa génération. ConverseStream exige l'autorisation bedrock:InvokeModelWithResponseStream, alors que Converse exige bedrock:InvokeModel.
  options:
    c:
      en: "Fewer tokens shorten or truncate the answer, but the text is still displayed only at the end."
      fr: "Moins de jetons raccourcissent ou tronquent la réponse, mais le texte ne s'affiche toujours qu'à la fin."
    d:
      en: "Batch inference is asynchronous and writes results to S3 when the job completes, which is slower for interactive users."
      fr: "L'inférence par lots est asynchrone et écrit les résultats dans S3 à la fin de la tâche, ce qui est plus lent pour des utilisateurs interactifs."
    e:
      en: "CreateModelInvocationJob starts a batch inference job; it is not used for streaming responses."
      fr: "CreateModelInvocationJob démarre une tâche d'inférence par lots ; elle ne sert pas aux réponses en continu."
references:
  - title: Inference using Converse API
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/conversation-inference.html
