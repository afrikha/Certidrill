id: dvac03-1b-s3-overlapping-filters
objective: "1.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bucket has an S3 event notification that sends all `s3:ObjectCreated:*` events, without any filter, to an AWS Lambda function named Indexer. A developer adds a second notification that sends `s3:ObjectCreated:*` events for the prefix `invoices/` to an Amazon SQS queue. Amazon S3 rejects the new configuration.

    What is the cause of the error?
  fr: |
    Un compartiment possède une notification d'événement S3 qui envoie tous les événements `s3:ObjectCreated:*`, sans aucun filtre, à une fonction AWS Lambda nommée Indexer. Un développeur ajoute une deuxième notification qui envoie les événements `s3:ObjectCreated:*` du préfixe `invoices/` à une file d'attente Amazon SQS. Amazon S3 rejette la nouvelle configuration.

    Quelle est la cause de l'erreur ?
body:
  options:
    - id: a
      text: { en: "A bucket can have only one event notification for each event type.", fr: "Un compartiment ne peut avoir qu'une seule notification d'événement par type d'événement." }
    - id: b
      text: { en: "The notification without a filter overlaps with the invoices/ prefix for the same event types.", fr: "La notification sans filtre chevauche le préfixe invoices/ pour les mêmes types d'événements." }
    - id: c
      text: { en: "Prefix filters must use a wildcard, such as invoices/*, to match objects in a folder.", fr: "Les filtres de préfixe doivent utiliser un caractère générique, comme invoices/*, pour correspondre aux objets d'un dossier." }
    - id: d
      text: { en: "A bucket cannot send events to a Lambda function and to an SQS queue at the same time.", fr: "Un compartiment ne peut pas envoyer d'événements à une fonction Lambda et à une file d'attente SQS en même temps." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Notification configurations cannot define overlapping prefixes or suffixes for the same event types. A configuration without a filter is treated as matching every prefix and suffix, so it overlaps with the invoices/ rule, and S3 returns an error when the configuration is saved. Overlapping filters are allowed only for different event types.
    fr: |
      Les configurations de notification ne peuvent pas définir de préfixes ou de suffixes qui se chevauchent pour les mêmes types d'événements. Une configuration sans filtre est considérée comme correspondant à tous les préfixes et suffixes : elle chevauche la règle invoices/, et S3 renvoie une erreur à l'enregistrement de la configuration. Les filtres qui se chevauchent ne sont autorisés que pour des types d'événements différents.
  options:
    a:
      en: "A bucket can have several notifications for the same event type when their key name filters do not overlap, such as images/ and logs/."
      fr: "Un compartiment peut avoir plusieurs notifications pour le même type d'événement quand leurs filtres de nom de clé ne se chevauchent pas, comme images/ et logs/."
    c:
      en: "Wildcards are not supported in prefix or suffix filters; a prefix such as invoices/ already matches every key that starts with it."
      fr: "Les caractères génériques ne sont pas pris en charge dans les filtres de préfixe ou de suffixe ; un préfixe comme invoices/ correspond déjà à toutes les clés qui commencent par lui."
    d:
      en: "One bucket can send notifications to several destination types, such as Lambda functions, SQS queues and SNS topics."
      fr: "Un même compartiment peut envoyer des notifications à plusieurs types de destinations, comme des fonctions Lambda, des files d'attente SQS et des rubriques SNS."
references:
  - title: Configuring event notifications using object key name filtering
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/notification-how-to-filtering.html
