id: dvac03-1b-kiro-kiroignore-secrets
objective: "1.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer uses Kiro in a repository that contains local `.env` files with API keys and a `certs/` folder with private keys. The company requires that the Kiro agent never reads these files, while it can still read the rest of the workspace, including `.env.example`.

    Which solution will meet these requirements?
  fr: |
    Un développeur utilise Kiro dans un dépôt qui contient des fichiers `.env` locaux avec des clés d'API et un dossier `certs/` avec des clés privées. L'entreprise exige que l'agent Kiro ne lise jamais ces fichiers, tout en pouvant lire le reste de l'espace de travail, y compris `.env.example`.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a steering file that tells the agent not to open .env files or the certs/ folder.", fr: "Ajouter un fichier steering qui demande à l'agent de ne pas ouvrir les fichiers .env ni le dossier certs/." }
    - id: b
      text: { en: "Add .env, certs/ and !.env.example to a .kiroignore file at the root of the repository.", fr: "Ajouter .env, certs/ et !.env.example dans un fichier .kiroignore à la racine du dépôt." }
    - id: c
      text: { en: "Add .env and certs/ to the .gitignore file so that the files are not committed.", fr: "Ajouter .env et certs/ dans le fichier .gitignore afin que les fichiers ne soient pas validés (commit)." }
    - id: d
      text: { en: "Use the Supervised mode so that the developer can reject each file that the agent wants to read.", fr: "Utiliser le mode Supervised afin que le développeur puisse refuser chaque fichier que l'agent veut lire." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A .kiroignore file prevents Kiro from reading the files that match its gitignore-style patterns, across the agent's tools, and the ignored paths do not appear in search results. A negation pattern such as !.env.example keeps that file readable, as long as its parent directory is not excluded.
    fr: |
      Un fichier .kiroignore empêche Kiro de lire les fichiers qui correspondent à ses modèles de type gitignore, dans tous les outils de l'agent, et les chemins ignorés n'apparaissent pas dans les résultats de recherche. Un modèle de négation comme !.env.example garde ce fichier lisible, tant que son dossier parent n'est pas exclu.
  options:
    a:
      en: "A steering file is guidance for the agent; it does not technically block access to the files."
      fr: "Un fichier steering est une indication pour l'agent ; il ne bloque pas techniquement l'accès aux fichiers."
    c:
      en: ".gitignore keeps the files out of Git, but the files stay in the workspace, where the agent can still read them unless they are ignored for Kiro."
      fr: ".gitignore tient les fichiers hors de Git, mais ils restent dans l'espace de travail, où l'agent peut toujours les lire s'ils ne sont pas ignorés pour Kiro."
    d:
      en: "Supervised mode makes Kiro pause so that the developer reviews file changes; it does not prevent the agent from reading files."
      fr: "Le mode Supervised fait marquer une pause à Kiro pour que le développeur relise les modifications de fichiers ; il n'empêche pas l'agent de lire des fichiers."
references:
  - title: Kiroignore
    url: https://kiro.dev/docs/kiroignore/
