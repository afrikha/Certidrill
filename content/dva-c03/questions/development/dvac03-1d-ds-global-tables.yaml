id: dvac03-1d-ds-global-tables
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's user profile service stores profiles in an Amazon DynamoDB table in us-east-1. The company is launching the service in eu-west-1 and ap-southeast-2. Users in every Region must read and update their profiles with low latency from the nearest Region, and the service must keep working in the other Regions if one Region becomes unavailable.

    The solution must require no changes to the data access code.

    Which solution will meet these requirements?
  fr: |
    Le service de profils utilisateur d'AnyCompany stocke les profils dans une table Amazon DynamoDB de us-east-1. L'entreprise lance le service dans eu-west-1 et ap-southeast-2. Les utilisateurs de chaque Région doivent lire et mettre à jour leur profil avec une faible latence depuis la Région la plus proche, et le service doit continuer à fonctionner dans les autres Régions si une Région devient indisponible.

    La solution ne doit exiger aucune modification du code d'accès aux données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Export the table to Amazon S3 every hour and import each export into a new table in each of the other Regions.", fr: "Exporter la table vers Amazon S3 toutes les heures et importer chaque export dans une nouvelle table de chacune des autres Régions." } }
    - { id: b, text: { en: "Convert the table to a DynamoDB global table with replicas in eu-west-1 and ap-southeast-2.", fr: "Convertir la table en table globale DynamoDB avec des réplicas dans eu-west-1 et ap-southeast-2." } }
    - { id: c, text: { en: "Put an Amazon CloudFront distribution in front of the profile API and cache the profile responses.", fr: "Placer une distribution Amazon CloudFront devant l'API de profils et mettre en cache les réponses de profil." } }
    - { id: d, text: { en: "Create a DynamoDB Accelerator (DAX) cluster in each new Region and point the application in that Region at it.", fr: "Créer un cluster DynamoDB Accelerator (DAX) dans chaque nouvelle Région et y diriger l'application de cette Région." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Global tables replicate a DynamoDB table automatically across Regions, and every replica serves both reads and writes. Each Regional deployment uses its local replica with low latency, traffic can shift to another Region during an outage, and the existing DynamoDB APIs are used, so no application changes are required.
    fr: |
      Les tables globales répliquent automatiquement une table DynamoDB entre Régions, et chaque réplica sert à la fois les lectures et les écritures. Chaque déploiement régional utilise son réplica local avec une faible latence, le trafic peut basculer vers une autre Région en cas de panne, et les API DynamoDB existantes sont utilisées : aucune modification de l'application n'est nécessaire.
  options:
    a: { en: "Hourly copies are up to an hour stale, updates made in the other Regions are never merged back, and the export and import jobs must be built.", fr: "Des copies horaires ont jusqu'à une heure de retard, les mises à jour faites dans les autres Régions ne sont jamais fusionnées, et les tâches d'export et d'import doivent être créées." }
    c: { en: "Caching responses at edge locations does not make updates local, and the table would still be a single point of failure in us-east-1.", fr: "Mettre les réponses en cache dans les emplacements périphériques ne rend pas les mises à jour locales, et la table resterait un point de défaillance unique dans us-east-1." }
    d: { en: "DAX is an in-memory cache in front of a table, not a replica; writes and cache misses still depend on the single table in us-east-1.", fr: "DAX est un cache en mémoire devant une table, pas un réplica ; les écritures et les échecs de cache dépendent toujours de la table unique de us-east-1." }
references:
  - title: Global tables - multi-active, multi-Region replication
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html
