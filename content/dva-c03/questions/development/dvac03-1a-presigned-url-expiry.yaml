id: dvac03-1a-presigned-url-expiry
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A Lambda function emails customers links to invoices that are stored in a private Amazon S3 bucket. The function creates each link with generate_presigned_url for get_object and ExpiresIn=604800 (7 days), by using the credentials of its execution role. Customers report that the links stop working after a few hours. The links must work whenever a customer clicks them within 7 days, and the bucket must stay private.

    Which solution will meet these requirements in the MOST secure way?
  fr: |
    Une fonction Lambda envoie par e-mail aux clients des liens vers des factures stockées dans un compartiment Amazon S3 privé. La fonction crée chaque lien avec generate_presigned_url pour get_object et ExpiresIn=604800 (7 jours), à l'aide des informations d'identification de son rôle d'exécution. Les clients signalent que les liens cessent de fonctionner au bout de quelques heures. Les liens doivent fonctionner chaque fois qu'un client clique dessus dans les 7 jours, et le compartiment doit rester privé.

    Quelle solution répond à ces exigences de la manière la PLUS sécurisée ?
body:
  options:
    - id: a
      text: { en: "Email a link to an API that checks the customer and returns a new presigned URL with a short expiration.", fr: "Envoyer un lien vers une API qui vérifie le client et renvoie une nouvelle URL présignée à courte expiration." }
    - id: b
      text: { en: "Create an IAM user with long-term access keys for the function, and sign the URLs with those keys.", fr: "Créer un utilisateur IAM avec des clés d'accès à long terme pour la fonction, et signer les URL avec ces clés." }
    - id: c
      text: { en: "Increase the timeout of the Lambda function so that its role session lasts for 7 days.", fr: "Augmenter le délai d'expiration de la fonction Lambda pour que sa session de rôle dure 7 jours." }
    - id: d
      text: { en: "Set ExpiresIn to 1209600 (14 days) so that the links outlast the role session.", fr: "Définir ExpiresIn à 1209600 (14 jours) pour que les liens survivent à la session de rôle." }
answer: { optionId: a }
explanation:
  correct:
    en: "A presigned URL can't outlive the credentials that signed it: with role credentials, it stops working when the role session ends, even if ExpiresIn is later. Generating a short-lived URL at the moment the customer clicks keeps temporary credentials and a small exposure window while the links in the emails stay valid."
    fr: "Une URL présignée ne peut pas survivre aux informations d'identification qui l'ont signée : avec des informations d'identification de rôle, elle cesse de fonctionner à la fin de la session de rôle, même si ExpiresIn est plus tardif. Générer une URL de courte durée au moment où le client clique conserve des informations d'identification temporaires et une faible fenêtre d'exposition, tandis que les liens des e-mails restent valides."
  options:
    b:
      en: "Long-term IAM user keys allow 7-day URLs, but they must be stored and rotated and are less secure than temporary role credentials."
      fr: "Des clés d'utilisateur IAM à long terme permettent des URL de 7 jours, mais elles doivent être stockées et renouvelées et sont moins sûres que des informations d'identification de rôle temporaires."
    c:
      en: "The function timeout limits how long one invocation runs; it doesn't control how long the execution role's credentials are valid."
      fr: "Le délai d'expiration de la fonction limite la durée d'une invocation ; il ne détermine pas la durée de validité des informations d'identification du rôle d'exécution."
    d:
      en: "Presigned URLs can be valid for at most 7 days, and with role credentials they still expire when the session ends."
      fr: "Les URL présignées sont valides 7 jours au plus et, avec des informations d'identification de rôle, elles expirent toujours à la fin de la session."
references:
  - title: Download and upload objects with presigned URLs
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html
