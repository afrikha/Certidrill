id: dvac03-1a-graceful-pricing-fallback
objective: "1.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A product page calls a pricing microservice synchronously. When the pricing service is slow or down, the page waits up to 30 seconds and then shows an error. The company wants the page to load within 2 seconds even during a pricing outage, and to show the last known prices with a notice instead of an error.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une page produit appelle un microservice de tarification de manière synchrone. Quand le service de tarification est lent ou arrêté, la page attend jusqu'à 30 secondes puis affiche une erreur. L'entreprise veut que la page se charge en moins de 2 secondes même pendant une panne de la tarification, et qu'elle affiche les derniers prix connus avec un avertissement au lieu d'une erreur.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Increase the client timeout of the pricing call to 60 seconds.", fr: "Porter le délai d'expiration client de l'appel de tarification à 60 secondes." } }
    - { id: b, text: { en: "Set a short timeout on the pricing call so that a slow call fails within the page's time budget.", fr: "Définir un délai d'expiration court sur l'appel de tarification pour qu'un appel lent échoue dans le budget de temps de la page." } }
    - { id: c, text: { en: "Retry the pricing call up to 10 times with exponential backoff before rendering the page.", fr: "Relancer l'appel de tarification jusqu'à 10 fois avec un backoff exponentiel avant d'afficher la page." } }
    - { id: d, text: { en: "Return HTTP 500 from the page so that the browser retries the request automatically.", fr: "Renvoyer une erreur HTTP 500 depuis la page pour que le navigateur relance automatiquement la requête." } }
    - { id: e, text: { en: "Keep the last known prices in an Amazon ElastiCache cache and render them with a notice when the pricing call fails.", fr: "Conserver les derniers prix connus dans un cache Amazon ElastiCache et les afficher avec un avertissement quand l'appel de tarification échoue." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Graceful degradation turns the pricing dependency into a soft dependency. A short timeout makes a slow call fail fast within the 2-second budget, and a fallback to cached, possibly stale prices lets the page keep its core function instead of failing."
    fr: "La dégradation progressive transforme la dépendance à la tarification en dépendance souple. Un délai court fait échouer rapidement un appel lent dans le budget de 2 secondes, et un repli sur des prix en cache, éventuellement obsolètes, permet à la page de conserver sa fonction principale au lieu d'échouer."
  options:
    a:
      en: "A longer timeout makes the page wait even longer during an outage, which breaks the 2-second requirement."
      fr: "Un délai plus long fait attendre la page encore plus longtemps pendant une panne, ce qui enfreint l'exigence de 2 secondes."
    c:
      en: "Ten retries with backoff take far more than 2 seconds when the service is down and still end in an error."
      fr: "Dix nouvelles tentatives avec backoff prennent bien plus de 2 secondes quand le service est arrêté et se terminent toujours par une erreur."
    d:
      en: "Returning an error is the opposite of graceful degradation; browsers don't retry page loads automatically on a 500 response."
      fr: "Renvoyer une erreur est l'inverse de la dégradation progressive ; les navigateurs ne relancent pas automatiquement le chargement d'une page sur une réponse 500."
references:
  - title: REL05-BP01 Implement graceful degradation to transform applicable hard dependencies into soft dependencies
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_mitigate_interaction_failure_graceful_degradation.html
