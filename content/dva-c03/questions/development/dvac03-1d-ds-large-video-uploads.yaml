id: dvac03-1d-ds-large-video-uploads
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is building a training platform where instructors upload video files of up to 8 GB each. The application stores video metadata (title, duration, owner) in an Amazon DynamoDB table. The videos must be stored durably, retrieved by a unique key, and billed only for the storage that is used.

    The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany crée une plateforme de formation sur laquelle des formateurs chargent des fichiers vidéo pouvant atteindre 8 Go chacun. L'application stocke les métadonnées des vidéos (titre, durée, propriétaire) dans une table Amazon DynamoDB. Les vidéos doivent être stockées de façon durable, récupérées par une clé unique et facturées uniquement pour le stockage utilisé.

    La solution doit présenter le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store each video as a Binary attribute of the metadata item in the DynamoDB table.", fr: "Stocker chaque vidéo dans un attribut Binary de l'élément de métadonnées de la table DynamoDB." } }
    - { id: b, text: { en: "Store each video as an object in an Amazon S3 bucket by using multipart upload, and save the object key in the metadata item.", fr: "Stocker chaque vidéo sous forme d'objet dans un compartiment Amazon S3 à l'aide du chargement en plusieurs parties (multipart upload), et enregistrer la clé de l'objet dans l'élément de métadonnées." } }
    - { id: c, text: { en: "Store each video on an Amazon EBS volume attached to the Amazon EC2 instance that runs the upload API.", fr: "Stocker chaque vidéo sur un volume Amazon EBS attaché à l'instance Amazon EC2 qui exécute l'API de chargement." } }
    - { id: d, text: { en: "Store each video in an Amazon ElastiCache (Valkey) cluster, using the video ID as the key.", fr: "Stocker chaque vidéo dans un cluster Amazon ElastiCache (Valkey), avec l'ID de la vidéo comme clé." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Amazon S3 stores objects durably, retrieves them by key, and bills for the storage used, with no capacity to provision. A single PUT is limited to 5 GB, so files of 8 GB must use multipart upload, which supports objects up to 50 TB. Keeping the object key in the DynamoDB item links the metadata to the video.
    fr: |
      Amazon S3 stocke des objets de façon durable, les récupère par clé et facture le stockage utilisé, sans capacité à provisionner. Un PUT unique est limité à 5 Go : des fichiers de 8 Go doivent donc utiliser le chargement en plusieurs parties, qui prend en charge des objets jusqu'à 50 To. La clé de l'objet enregistrée dans l'élément DynamoDB relie les métadonnées à la vidéo.
  options:
    a: { en: "A DynamoDB item, including all its attributes, cannot exceed 400 KB.", fr: "Un élément DynamoDB, avec tous ses attributs, ne peut pas dépasser 400 Ko." }
    c: { en: "An EBS volume is provisioned at a fixed size, is tied to one instance and must be managed and backed up by the team.", fr: "Un volume EBS est provisionné à une taille fixe, est lié à une instance et doit être géré et sauvegardé par l'équipe." }
    d: { en: "An in-memory cache is not a durable store for large files and is billed for node memory, not for the storage used.", fr: "Un cache en mémoire n'est pas un magasin durable pour de gros fichiers et il est facturé selon la mémoire des nœuds, pas selon le stockage utilisé." }
references:
  - title: Uploading objects
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/upload-objects.html
