id: dvac03-1c-life-ttl-archive-s3
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon DynamoDB table uses time to live (TTL) to remove expired orders. When TTL deletes an order, the full item must be archived to Amazon S3. Items that users delete through the application must not be archived. The table receives millions of other writes each hour, and the company wants to minimize AWS Lambda invocations.

    Which solution will meet these requirements?
  fr: |
    Une table Amazon DynamoDB utilise la durée de vie (TTL) pour supprimer les commandes expirées. Lorsque la TTL supprime une commande, l'élément complet doit être archivé dans Amazon S3. Les éléments que les utilisateurs suppriment par l'application ne doivent pas être archivés. La table reçoit des millions d'autres écritures chaque heure, et l'entreprise souhaite réduire au minimum les appels AWS Lambda.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn on a stream with the KEYS_ONLY view type, and use a function that reads each deleted item with GetItem and writes it to S3.", fr: "Activer un flux avec le type de vue KEYS_ONLY, et utiliser une fonction qui lit chaque élément supprimé avec GetItem et l'écrit dans S3." } }
    - { id: b, text: { en: "Turn on a stream with the NEW_IMAGE view type, and filter the event source mapping on the REMOVE event name before writing to S3.", fr: "Activer un flux avec le type de vue NEW_IMAGE, et filtrer le mappage de source d'événements sur le nom d'événement REMOVE avant l'écriture dans S3." } }
    - { id: c, text: { en: "Schedule a function that scans for items whose expiresAt is in the past and copies them to S3 before TTL deletes them.", fr: "Planifier une fonction qui recherche par analyse les éléments dont expiresAt est passé et les copie dans S3 avant leur suppression par la TTL." } }
    - { id: d, text: { en: "Turn on a stream with the OLD_IMAGE view type, and filter the event source mapping on the Service identity dynamodb.amazonaws.com.", fr: "Activer un flux avec le type de vue OLD_IMAGE, et filtrer le mappage de source d'événements sur l'identité de service dynamodb.amazonaws.com." } }
answer: { optionId: d }
explanation:
  correct:
    en: "TTL deletes appear in DynamoDB Streams as service deletions, with a userIdentity of type Service and principalId dynamodb.amazonaws.com. An event filter on these fields invokes the function only for TTL deletes, and the OLD_IMAGE view type gives the function the full item to write to S3."
    fr: "Les suppressions TTL apparaissent dans DynamoDB Streams comme des suppressions de service, avec un userIdentity de type Service et le principalId dynamodb.amazonaws.com. Un filtre d'événements sur ces champs n'appelle la fonction que pour les suppressions TTL, et le type de vue OLD_IMAGE donne à la fonction l'élément complet à écrire dans S3."
  options:
    a:
      en: "The item is already deleted when the record arrives, so GetItem returns nothing, and every change of the table invokes the function."
      fr: "L'élément est déjà supprimé lorsque l'enregistrement arrive : GetItem ne renvoie rien, et chaque modification de la table appelle la fonction."
    b:
      en: "A deleted item has no new image, and a REMOVE filter also matches the deletes made by users."
      fr: "Un élément supprimé n'a pas de nouvelle image, et un filtre REMOVE correspond aussi aux suppressions faites par les utilisateurs."
    c:
      en: "Repeated scans consume read capacity, and the copy can miss items or archive items that are later updated and kept."
      fr: "Des analyses répétées consomment de la capacité de lecture, et la copie peut manquer des éléments ou archiver des éléments mis à jour puis conservés."
references:
  - title: DynamoDB Streams and Time to Live
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/time-to-live-ttl-streams.html
