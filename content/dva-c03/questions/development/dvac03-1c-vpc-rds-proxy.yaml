id: dvac03-1c-vpc-rds-proxy
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A ticketing company has an AWS Lambda function in a VPC that connects to an Amazon RDS for MySQL DB instance in the same VPC. During sales events, the function scales to hundreds of concurrent execution environments, and the database rejects new connections because the maximum number of connections is reached. The function must keep scaling with traffic.

    Which solution will meet these requirements with the LEAST development effort?
  fr: |
    Une entreprise de billetterie dispose d'une fonction AWS Lambda dans un VPC qui se connecte à une instance de base de données Amazon RDS for MySQL du même VPC. Pendant les ventes, la fonction monte jusqu'à des centaines d'environnements d'exécution simultanés, et la base de données refuse les nouvelles connexions, car le nombre maximal de connexions est atteint. La fonction doit continuer à s'adapter au trafic.

    Quelle solution répond à ces exigences avec le MOINS d'effort de développement ?
body:
  options:
    - { id: a, text: { en: "Set the reserved concurrency of the function to 50 so that fewer environments open connections.", fr: "Définir la simultanéité réservée de la fonction à 50 afin que moins d'environnements ouvrent des connexions." } }
    - { id: b, text: { en: "Create an RDS Proxy for the DB instance, and change the function's connection endpoint to the proxy endpoint.", fr: "Créer un RDS Proxy pour l'instance de base de données, et remplacer le point de terminaison de connexion de la fonction par celui du proxy." } }
    - { id: c, text: { en: "Move the database connection code outside the handler so that each environment reuses its connection.", fr: "Déplacer le code de connexion à la base de données hors du gestionnaire afin que chaque environnement réutilise sa connexion." } }
    - { id: d, text: { en: "Increase the memory of the function to 3,008 MB so that each invocation finishes and closes its connection sooner.", fr: "Augmenter la mémoire de la fonction à 3 008 Mo afin que chaque appel se termine et ferme sa connexion plus tôt." } }
answer: { optionId: b }
explanation:
  correct:
    en: "RDS Proxy manages a pool of shared database connections, so many concurrent function environments can reach the database without exhausting its connections. The code change is limited to the connection endpoint, and the function keeps scaling with traffic."
    fr: "RDS Proxy gère un pool de connexions partagées à la base de données : de nombreux environnements de fonction simultanés peuvent atteindre la base sans épuiser ses connexions. La modification du code se limite au point de terminaison de connexion, et la fonction continue à s'adapter au trafic."
  options:
    a:
      en: "Reserved concurrency caps the function at 50 environments, so requests above that are throttled and the function no longer scales with traffic."
      fr: "La simultanéité réservée plafonne la fonction à 50 environnements : les requêtes au-delà sont limitées et la fonction ne s'adapte plus au trafic."
    c:
      en: "Reusing a connection per environment is a good practice, but hundreds of environments still hold hundreds of connections."
      fr: "Réutiliser une connexion par environnement est une bonne pratique, mais des centaines d'environnements détiennent toujours des centaines de connexions."
    d:
      en: "More memory can shorten invocations, but the number of concurrent environments, and therefore of connections, stays driven by traffic."
      fr: "Plus de mémoire peut raccourcir les appels, mais le nombre d'environnements simultanés, et donc de connexions, reste dicté par le trafic."
references:
  - title: Using AWS Lambda with Amazon RDS
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-database.html
