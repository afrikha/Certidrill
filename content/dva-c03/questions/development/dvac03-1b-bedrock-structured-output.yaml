id: dvac03-1b-bedrock-structured-output
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An invoice-processing service uses the Amazon Bedrock Converse API to extract fields from email text. The system prompt asks the model to answer in JSON, but a small share of responses contain extra text or missing fields, and the downstream parser fails. The developer needs responses that are valid JSON and follow a defined schema, with a model that supports this feature.

    Which solution will meet these requirements?
  fr: |
    Un service de traitement des factures utilise l'API Converse d'Amazon Bedrock pour extraire des champs du texte d'e-mails. L'invite système demande au modèle de répondre en JSON, mais une petite partie des réponses contient du texte supplémentaire ou des champs manquants, et l'analyseur en aval échoue. Le développeur a besoin de réponses en JSON valide conformes à un schéma défini, avec un modèle qui prend en charge cette fonctionnalité.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set temperature to 0 in inferenceConfig, and add an example of the expected JSON object to the system prompt.", fr: "Définir temperature sur 0 dans inferenceConfig et ajouter un exemple du JSON attendu dans l'invite système." }
    - id: b
      text: { en: "Add a stop sequence in inferenceConfig so that generation stops at the closing brace of the JSON object.", fr: "Ajouter une séquence d'arrêt dans inferenceConfig afin que la génération s'arrête à l'accolade fermante de l'objet JSON." }
    - id: c
      text: { en: "Set outputConfig.textFormat to json_schema with the invoice JSON schema, and set additionalProperties to false on each object.", fr: "Définir outputConfig.textFormat sur json_schema avec le schéma JSON de facture, et définir additionalProperties sur false sur chaque objet." }
    - id: d
      text: { en: "Call the InvokeModel API instead of Converse, and set both the contentType and accept parameters to application/json.", fr: "Appeler l'API InvokeModel au lieu de Converse, et définir les paramètres contentType et accept sur application/json." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Structured outputs constrain the model response to a JSON schema, which gives valid, parseable output. In Converse, the schema goes in outputConfig.textFormat with the json_schema type, and every object of the schema must set additionalProperties to false. A response can still be incomplete if it reaches maxTokens, so maxTokens must leave enough room.
    fr: |
      Les sorties structurées contraignent la réponse du modèle à un schéma JSON, ce qui donne une sortie valide et analysable. Dans Converse, le schéma se place dans outputConfig.textFormat avec le type json_schema, et chaque objet du schéma doit définir additionalProperties sur false. Une réponse peut encore être incomplète si elle atteint maxTokens : maxTokens doit laisser assez de place.
  options:
    a:
      en: "A low temperature and an example make JSON more likely but do not guarantee that each response follows the schema."
      fr: "Une température basse et un exemple rendent le JSON plus probable, mais ne garantissent pas que chaque réponse suive le schéma."
    b:
      en: "A stop sequence can cut nested objects at the first closing brace and does not ensure that the required fields are present."
      fr: "Une séquence d'arrêt peut couper les objets imbriqués à la première accolade fermante et ne garantit pas la présence des champs obligatoires."
    d:
      en: "contentType and accept set the MIME types of the request and response bodies; they do not constrain the text that the model generates."
      fr: "contentType et accept définissent les types MIME des corps de requête et de réponse ; ils ne contraignent pas le texte que le modèle génère."
references:
  - title: Get validated JSON results from models
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/structured-output.html
