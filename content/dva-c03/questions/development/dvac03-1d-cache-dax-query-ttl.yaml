id: dvac03-1d-cache-dax-query-ttl
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's order-tracking application reads and writes an Amazon DynamoDB table only through a DynamoDB Accelerator (DAX) cluster that uses the default parameter group. After an UpdateItem call changes an order's status, a GetItem call returns the new status immediately, but a Query that lists the customer's orders returns the old status for several minutes.

    The Query results must reflect status changes within 30 seconds, and the application must keep using DAX for both kinds of reads.

    Which solution will meet these requirements?
  fr: |
    L'application de suivi des commandes d'AnyCompany lit et écrit une table Amazon DynamoDB uniquement via un cluster DynamoDB Accelerator (DAX) qui utilise le groupe de paramètres par défaut. Après qu'un appel UpdateItem a modifié le statut d'une commande, un appel GetItem renvoie immédiatement le nouveau statut, mais une Query qui liste les commandes du client renvoie l'ancien statut pendant plusieurs minutes.

    Les résultats des Query doivent refléter les changements de statut en moins de 30 secondes, et l'application doit continuer à utiliser DAX pour les deux types de lectures.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a custom parameter group with query-ttl-millis set to 30000 and apply it to the DAX cluster.", fr: "Créer un groupe de paramètres personnalisé avec query-ttl-millis réglé sur 30000 et l'appliquer au cluster DAX." } }
    - { id: b, text: { en: "Create a custom parameter group with record-ttl-millis set to 30000 and apply it to the DAX cluster.", fr: "Créer un groupe de paramètres personnalisé avec record-ttl-millis réglé sur 30000 et l'appliquer au cluster DAX." } }
    - { id: c, text: { en: "Send the UpdateItem calls directly to DynamoDB instead of through DAX so that the cache is bypassed for writes.", fr: "Envoyer les appels UpdateItem directement à DynamoDB plutôt que via DAX afin de contourner le cache pour les écritures." } }
    - { id: d, text: { en: "Enable DynamoDB Streams on the table so that DAX invalidates the cached query results after each update.", fr: "Activer DynamoDB Streams sur la table pour que DAX invalide les résultats de requête en cache après chaque mise à jour." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      DAX keeps an item cache for GetItem and BatchGetItem and a separate query cache for Query and Scan. A write through DAX updates the item cache but does not invalidate cached query results, which expire only at the query cache TTL, 5 minutes by default. The default parameter group cannot be modified, so a custom group with query-ttl-millis at 30,000 ms bounds the staleness of Query results to 30 seconds.
    fr: |
      DAX gère un cache d'éléments pour GetItem et BatchGetItem et un cache de requêtes distinct pour Query et Scan. Une écriture via DAX met à jour le cache d'éléments mais n'invalide pas les résultats de requête en cache, qui n'expirent qu'au TTL du cache de requêtes, 5 minutes par défaut. Le groupe de paramètres par défaut ne peut pas être modifié : un groupe personnalisé avec query-ttl-millis à 30 000 ms limite l'obsolescence des résultats de Query à 30 secondes.
  options:
    b: { en: "record-ttl-millis controls the item cache, which already returns the new status; the Query results are in the query cache.", fr: "record-ttl-millis contrôle le cache d'éléments, qui renvoie déjà le nouveau statut ; les résultats des Query se trouvent dans le cache de requêtes." }
    c: { en: "Writes that bypass DAX leave both caches unaware of the change, so the GetItem results would also become stale.", fr: "Des écritures qui contournent DAX laissent les deux caches ignorer la modification : les résultats de GetItem deviendraient eux aussi obsolètes." }
    d: { en: "DAX does not use DynamoDB Streams to invalidate its caches; cached query results expire only when their TTL ends.", fr: "DAX n'utilise pas DynamoDB Streams pour invalider ses caches ; les résultats de requête en cache n'expirent qu'à la fin de leur TTL." }
references:
  - title: DAX and DynamoDB consistency models
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.consistency.html
  - title: Managing DAX clusters
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.cluster-management.html
