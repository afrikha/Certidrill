id: dvac03-1c-life-s3-transition-expire
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application writes JSON export files of several megabytes to the exports/ prefix of an Amazon S3 bucket that does not use versioning. The files are read often during the first 30 days, then about once a quarter, and must still be readable in milliseconds when they are requested. Each file must be deleted 365 days after it is created.

    Which S3 Lifecycle rule will meet these requirements MOST cost-effectively?
  fr: |
    Une application écrit des fichiers d'export JSON de plusieurs mégaoctets sous le préfixe exports/ d'un compartiment Amazon S3 qui n'utilise pas la gestion des versions. Les fichiers sont lus souvent pendant les 30 premiers jours, puis environ une fois par trimestre, et doivent rester lisibles en quelques millisecondes lorsqu'ils sont demandés. Chaque fichier doit être supprimé 365 jours après sa création.

    Quelle règle S3 Lifecycle répond à ces exigences de la manière la PLUS économique ?
body:
  options:
    - { id: a, text: { en: "For the exports/ prefix, transition objects to S3 Glacier Flexible Retrieval after 30 days, and expire them after 365 days.", fr: "Pour le préfixe exports/, faire passer les objets à S3 Glacier Flexible Retrieval après 30 jours, et les faire expirer après 365 jours." } }
    - { id: b, text: { en: "For the exports/ prefix, transition objects to S3 Standard-IA after 30 days, with no expiration action.", fr: "Pour le préfixe exports/, faire passer les objets à S3 Standard-IA après 30 jours, sans action d'expiration." } }
    - { id: c, text: { en: "For the exports/ prefix, transition objects to S3 Glacier Instant Retrieval after 30 days, and expire them after 365 days.", fr: "Pour le préfixe exports/, faire passer les objets à S3 Glacier Instant Retrieval après 30 jours, et les faire expirer après 365 jours." } }
    - { id: d, text: { en: "For the exports/ prefix, transition objects to S3 Glacier Deep Archive after 30 days, and expire them after 365 days.", fr: "Pour le préfixe exports/, faire passer les objets à S3 Glacier Deep Archive après 30 jours, et les faire expirer après 365 jours." } }
answer: { optionId: c }
explanation:
  correct:
    en: "S3 Glacier Instant Retrieval suits data that is accessed about once a quarter and still needs millisecond access, at a lower storage price than Standard-IA. The objects stay there for 335 days, more than the 90-day minimum storage duration, and an Expiration action in the same rule deletes them after 365 days."
    fr: "S3 Glacier Instant Retrieval convient aux données consultées environ une fois par trimestre qui exigent toujours un accès en quelques millisecondes, pour un prix de stockage inférieur à celui de Standard-IA. Les objets y restent 335 jours, soit plus que la durée de stockage minimale de 90 jours, et une action Expiration dans la même règle les supprime après 365 jours."
  options:
    a:
      en: "Objects in S3 Glacier Flexible Retrieval must be restored first, which takes minutes to hours, not milliseconds."
      fr: "Les objets de S3 Glacier Flexible Retrieval doivent d'abord être restaurés, ce qui prend de quelques minutes à quelques heures, pas quelques millisecondes."
    b:
      en: "Without an expiration action, the files are never deleted, and Standard-IA costs more to store than Glacier Instant Retrieval for quarterly access."
      fr: "Sans action d'expiration, les fichiers ne sont jamais supprimés, et le stockage dans Standard-IA coûte plus cher que dans Glacier Instant Retrieval pour un accès trimestriel."
    d:
      en: "Objects in S3 Glacier Deep Archive must be restored first, which takes hours, not milliseconds."
      fr: "Les objets de S3 Glacier Deep Archive doivent d'abord être restaurés, ce qui prend des heures, pas quelques millisecondes."
references:
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
  - title: Transitioning objects using Amazon S3 Lifecycle
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html
