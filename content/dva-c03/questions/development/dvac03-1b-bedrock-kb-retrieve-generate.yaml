id: dvac03-1b-bedrock-kb-retrieve-generate
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company already has an Amazon Bedrock knowledge base that indexes its HR policy documents. A developer must add a chat feature to the intranet that answers employee questions from these documents, shows links to the source documents and supports follow-up questions. The developer wants the LEAST code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose déjà d'une base de connaissances Amazon Bedrock qui indexe ses documents de politique RH. Un développeur doit ajouter à l'intranet une fonctionnalité de conversation qui répond aux questions des employés à partir de ces documents, affiche des liens vers les documents sources et prend en charge les questions de suivi. Le développeur veut écrire le MOINS de code possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Call Retrieve to get the matching chunks, build a prompt with them, call Converse, and store the history to handle follow-up questions.", fr: "Appeler Retrieve pour obtenir les segments correspondants, construire une invite avec eux, appeler Converse, et stocker l'historique pour gérer les questions de suivi." }
    - id: b
      text: { en: "Export the documents from the knowledge base and send their full text in every Converse request.", fr: "Exporter les documents de la base de connaissances et envoyer leur texte complet dans chaque requête Converse." }
    - id: c
      text: { en: "Call Converse with the knowledge base ID in the system prompt so that the model reads the documents.", fr: "Appeler Converse avec l'ID de la base de connaissances dans l'invite système afin que le modèle lise les documents." }
    - id: d
      text: { en: "Call RetrieveAndGenerate with the knowledge base ID and a model ARN, show the citations, and pass the returned sessionId with follow-up questions.", fr: "Appeler RetrieveAndGenerate avec l'ID de la base de connaissances et un ARN de modèle, afficher les citations, et transmettre le sessionId renvoyé avec les questions de suivi." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      RetrieveAndGenerate queries the knowledge base and generates a response from the retrieved chunks, with citations whose retrievedReferences give the location of each source document. The response returns a sessionId that the application passes in the next request to keep the context of the conversation, so no history code is needed.
    fr: |
      RetrieveAndGenerate interroge la base de connaissances et génère une réponse à partir des segments récupérés, avec des citations dont les retrievedReferences donnent l'emplacement de chaque document source. La réponse renvoie un sessionId que l'application transmet dans la requête suivante pour conserver le contexte de la conversation : aucun code d'historique n'est nécessaire.
  options:
    a:
      en: "This works but rebuilds retrieval-based generation, citation handling and conversation history in custom code."
      fr: "Cette solution fonctionne, mais recrée en code personnalisé la génération à partir de la récupération, la gestion des citations et l'historique de conversation."
    c:
      en: "Converse does not query a knowledge base from an ID written in the prompt; the model never sees the documents."
      fr: "Converse n'interroge pas une base de connaissances à partir d'un ID écrit dans l'invite ; le modèle ne voit jamais les documents."
    b:
      en: "Sending all documents in every request is costly, can exceed the model context and gives no source links."
      fr: "Envoyer tous les documents dans chaque requête est coûteux, peut dépasser le contexte du modèle et ne donne aucun lien vers les sources."
references:
  - title: Query a knowledge base and generate responses based off the retrieved data
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-retrieve-generate.html
