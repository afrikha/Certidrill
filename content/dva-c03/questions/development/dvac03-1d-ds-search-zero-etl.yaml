id: dvac03-1d-ds-search-zero-etl
objective: "1.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany stores its product catalog in an Amazon DynamoDB table, which must remain the source of truth. The company wants to add keyword search over the product descriptions, with results ranked by relevance, and the search results must reflect catalog changes in near real time.

    The developers must write the LEAST amount of custom code.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    AnyCompany stocke son catalogue de produits dans une table Amazon DynamoDB, qui doit rester la source de vérité. L'entreprise veut ajouter une recherche par mots-clés dans les descriptions des produits, avec des résultats classés par pertinence, et les résultats de recherche doivent refléter les modifications du catalogue en temps quasi réel.

    Les développeurs doivent écrire le MOINS de code personnalisé possible.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a global secondary index with the description as the partition key and query it with the contains() function.", fr: "Créer un index secondaire global avec la description comme clé de partition et l'interroger avec la fonction contains()." } }
    - { id: b, text: { en: "Create an Amazon OpenSearch Service domain to hold the search index and serve the search queries.", fr: "Créer un domaine Amazon OpenSearch Service qui contient l'index de recherche et sert les requêtes de recherche." } }
    - { id: c, text: { en: "Write an AWS Lambda function that a DynamoDB stream invokes and that indexes each changed item through the search engine API.", fr: "Écrire une fonction AWS Lambda appelée par un flux DynamoDB et qui indexe chaque élément modifié via l'API du moteur de recherche." } }
    - { id: d, text: { en: "Run a Scan on the table with a FilterExpression that uses contains() on the description attribute.", fr: "Exécuter un Scan sur la table avec une FilterExpression qui utilise contains() sur l'attribut de description." } }
    - { id: e, text: { en: "Configure the DynamoDB zero-ETL integration with OpenSearch Service, with point-in-time recovery and DynamoDB Streams (new and old images) enabled on the table.", fr: "Configurer l'intégration zéro ETL de DynamoDB avec OpenSearch Service, avec la restauration à un instant dans le passé et DynamoDB Streams (nouvelles et anciennes images) activés sur la table." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      OpenSearch Service is the search and analytics engine that provides relevance-ranked keyword search. The zero-ETL integration uses an OpenSearch Ingestion pipeline: it loads an initial snapshot through a DynamoDB export to Amazon S3, which needs point-in-time recovery, and then replicates changes in near real time from DynamoDB Streams with new and old images. No synchronization code has to be written, and DynamoDB stays the source of truth.
    fr: |
      OpenSearch Service est le moteur de recherche et d'analyse qui fournit une recherche par mots-clés classée par pertinence. L'intégration zéro ETL utilise un pipeline OpenSearch Ingestion : elle charge un instantané initial par un export DynamoDB vers Amazon S3, qui exige la restauration à un instant dans le passé, puis réplique les modifications en temps quasi réel depuis DynamoDB Streams avec les nouvelles et anciennes images. Aucun code de synchronisation n'est à écrire, et DynamoDB reste la source de vérité.
  options:
    a: { en: "A key condition does not support contains(), only equality on the partition key, and DynamoDB has no relevance ranking.", fr: "Une condition de clé ne prend pas en charge contains(), seulement l'égalité sur la clé de partition, et DynamoDB n'a aucun classement par pertinence." }
    c: { en: "A stream-triggered function works, but it is custom synchronization code, which the zero-ETL integration makes unnecessary.", fr: "Une fonction déclenchée par le flux fonctionne, mais c'est du code de synchronisation personnalisé, que l'intégration zéro ETL rend inutile." }
    d: { en: "A Scan reads the whole table on every search, the filter does not reduce consumed capacity, and the results are not ranked by relevance.", fr: "Un Scan lit toute la table à chaque recherche, le filtre ne réduit pas la capacité consommée et les résultats ne sont pas classés par pertinence." }
references:
  - title: DynamoDB zero-ETL integration with Amazon OpenSearch Service
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/OpenSearchIngestionForDynamoDB.html
  - title: What is Amazon OpenSearch Service?
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html
