id: dvac03-1d-cache-memcached-multithreaded
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's content site renders HTML fragments from data in an Amazon RDS database and wants to cache the rendered fragments as simple key-value objects. The fragments can be regenerated at any time, so losing cached data is acceptable and no replication or backups are needed. The cache will run on large nodes with many vCPUs, and each node must use all its vCPUs. Capacity must grow by adding nodes.

    Which caching solution will meet these requirements?
  fr: |
    Le site de contenu d'AnyCompany génère des fragments HTML à partir de données d'une base Amazon RDS et veut mettre en cache les fragments générés sous forme d'objets clé-valeur simples. Les fragments peuvent être régénérés à tout moment : perdre des données en cache est acceptable, et aucune réplication ni sauvegarde n'est nécessaire. Le cache fonctionnera sur de grands nœuds dotés de nombreux processeurs virtuels, et chaque nœud doit utiliser tous ses processeurs virtuels. La capacité doit augmenter par ajout de nœuds.

    Quelle solution de mise en cache répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "An Amazon ElastiCache (Memcached) node-based cluster", fr: "Un cluster Amazon ElastiCache (Memcached) basé sur des nœuds" } }
    - { id: b, text: { en: "An Amazon ElastiCache (Valkey) node-based cluster with cluster mode disabled and one replica", fr: "Un cluster Amazon ElastiCache (Valkey) basé sur des nœuds, en mode cluster désactivé, avec un réplica" } }
    - { id: c, text: { en: "A DynamoDB Accelerator (DAX) cluster in front of the RDS database", fr: "Un cluster DynamoDB Accelerator (DAX) devant la base RDS" } }
    - { id: d, text: { en: "An Aurora Replica of the database, reached through the reader endpoint", fr: "Un réplica Aurora de la base, joint via le point de terminaison lecteur" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Memcached is multithreaded, so it uses the many cores of large nodes, and it scales horizontally by adding nodes. ElastiCache recommends it for the simplest model of object caching when replication, persistence and complex data types are not needed, which matches regenerable HTML fragments.
    fr: |
      Memcached est multithread : il utilise les nombreux cœurs des grands nœuds, et il se met à l'échelle horizontalement par ajout de nœuds. ElastiCache le recommande pour le modèle le plus simple de mise en cache d'objets quand la réplication, la persistance et les types de données complexes ne sont pas nécessaires, ce qui correspond à des fragments HTML régénérables.
  options:
    b: { en: "Valkey nodes are not multithreaded, cluster mode disabled has a single shard that cannot grow by adding nodes, and the replica adds cost that is not needed.", fr: "Les nœuds Valkey ne sont pas multithread, le mode cluster désactivé n'a qu'une seule partition qui ne grandit pas par ajout de nœuds, et le réplica ajoute un coût inutile." }
    c: { en: "DAX caches Amazon DynamoDB tables only; it cannot cache an RDS database or rendered fragments.", fr: "DAX ne met en cache que des tables Amazon DynamoDB ; il ne peut pas mettre en cache une base RDS ni des fragments générés." }
    d: { en: "An Aurora Replica is a database instance, not a key-value cache; the fragments would still be rendered from SQL queries.", fr: "Un réplica Aurora est une instance de base de données, pas un cache clé-valeur ; les fragments seraient toujours générés à partir de requêtes SQL." }
references:
  - title: Comparing node-based Valkey, Memcached, and Redis OSS clusters
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/SelectEngine.html
