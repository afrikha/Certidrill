id: dvac03-1a-s3-paginator
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Python script must process every object in an Amazon S3 bucket that holds 250,000 objects. The script calls list_objects_v2 once and processes only the first 1,000 objects.

    Which change will make the script process every object with the LEAST code?
  fr: |
    Un script Python doit traiter chaque objet d'un compartiment Amazon S3 qui contient 250 000 objets. Le script appelle list_objects_v2 une seule fois et ne traite que les 1 000 premiers objets.

    Quelle modification permettra au script de traiter chaque objet avec le MOINS de code ?
body:
  options:
    - id: a
      text: { en: "Set `MaxKeys=250000` in the `list_objects_v2` call of the script.", fr: "Définir `MaxKeys=250000` dans l'appel `list_objects_v2` du script." }
    - id: b
      text: { en: "Call the `list_objects` operation instead of `list_objects_v2`.", fr: "Appeler l'opération `list_objects` au lieu de `list_objects_v2`." }
    - id: c
      text: { en: "Iterate over the pages of `get_paginator(\"list_objects_v2\").paginate(Bucket=...)`.", fr: "Parcourir les pages de `get_paginator(\"list_objects_v2\").paginate(Bucket=...)`." }
    - id: d
      text: { en: "Set `Delimiter=\"/\"` in the `list_objects_v2` call of the script.", fr: "Définir `Delimiter=\"/\"` dans l'appel `list_objects_v2` du script." }
answer: { optionId: c }
explanation:
  correct:
    en: "A list call returns one page of results at a time. A boto3 paginator sends the follow-up requests with the continuation token for you and yields each page, so a simple loop over paginate() reaches every object."
    fr: "Un appel de liste renvoie une page de résultats à la fois. Un paginateur boto3 envoie pour vous les requêtes suivantes avec le jeton de continuation et produit chaque page : une simple boucle sur paginate() atteint chaque objet."
  options:
    a:
      en: "MaxKeys can only lower the page size; S3 returns at most 1,000 keys per response."
      fr: "MaxKeys ne peut que réduire la taille de page ; S3 renvoie au plus 1 000 clés par réponse."
    b:
      en: "The older list_objects operation is paginated in the same way, so it also stops after one page."
      fr: "L'ancienne opération list_objects est paginée de la même façon : elle s'arrête aussi après une page."
    d:
      en: "A delimiter groups keys into common prefixes; it doesn't return the remaining pages."
      fr: "Un délimiteur regroupe les clés en préfixes communs ; il ne renvoie pas les pages restantes."
references:
  - title: Paginators
    url: https://docs.aws.amazon.com/boto3/latest/guide/paginators.html
