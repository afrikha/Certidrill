id: dvac03-1b-sqs-filter-plain-string
objective: "1.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function processes an Amazon SQS queue through an event source mapping with the filter pattern `{ "body": { "type": [ "refund" ] } }`. Two producers send refund requests to the queue. Producer A sends bodies such as `{"type": "refund", "id": "r-7"}`, and producer B sends bodies such as `type=refund&id=r-8`. Refunds from producer B are never processed and do not appear in the queue afterward. The company can change the producers but wants to keep the filter.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda traite une file d'attente Amazon SQS au moyen d'un mappage de source d'événements avec le modèle de filtre `{ "body": { "type": [ "refund" ] } }`. Deux producteurs envoient des demandes de remboursement à la file d'attente. Le producteur A envoie des corps comme `{"type": "refund", "id": "r-7"}`, et le producteur B des corps comme `type=refund&id=r-8`. Les remboursements du producteur B ne sont jamais traités et n'apparaissent plus dans la file d'attente ensuite. L'entreprise peut modifier les producteurs, mais veut conserver le filtre.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change producer B to send the refund as a JSON object in the message body.", fr: "Modifier le producteur B pour qu'il envoie le remboursement sous forme d'objet JSON dans le corps du message." }
    - id: b
      text: { en: "Change producer B to send the refund type as an SQS message attribute named type.", fr: "Modifier le producteur B pour qu'il envoie le type de remboursement dans un attribut de message SQS nommé type." }
    - id: c
      text: { en: "Configure a dead-letter queue on the source queue to receive the messages of producer B.", fr: "Configurer une file d'attente de lettres mortes (dead-letter queue) sur la file source pour recevoir les messages du producteur B." }
    - id: d
      text: { en: "Change producer B to base64-encode the message body before it sends the message.", fr: "Modifier le producteur B pour qu'il encode le corps du message en base64 avant de l'envoyer." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Before filtering, Lambda compares the format of the message body with the format of the body filter. When the body is a plain string and the filter is JSON, Lambda drops the message, and filtered-out SQS messages are deleted from the queue. A JSON body from producer B matches the existing filter and reaches the function.
    fr: |
      Avant le filtrage, Lambda compare le format du corps du message avec celui du filtre sur body. Quand le corps est une chaîne simple et le filtre du JSON, Lambda abandonne le message, et les messages SQS écartés par le filtre sont supprimés de la file d'attente. Un corps JSON envoyé par le producteur B correspond au filtre existant et atteint la fonction.
  options:
    b:
      en: "The filter matches the body field; an attribute does not satisfy it, and the plain-string body is still dropped."
      fr: "Le filtre porte sur le champ body ; un attribut ne le satisfait pas, et le corps en chaîne simple est toujours abandonné."
    c:
      en: "Messages that do not match a filter are deleted by Lambda, not received and failed, so they never reach a dead-letter queue."
      fr: "Les messages qui ne correspondent pas à un filtre sont supprimés par Lambda, pas reçus puis en échec : ils n'atteignent jamais une file d'attente de lettres mortes."
    d:
      en: "A base64 string is still a plain string, not JSON, so Lambda keeps dropping the messages."
      fr: "Une chaîne base64 reste une chaîne simple, pas du JSON : Lambda continue d'abandonner les messages."
references:
  - title: Using event filtering with an Amazon SQS event source
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-sqs-filtering.html
