id: dvac03-1b-agentcore-runtime-session
objective: "1.1.10"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company hosts a travel-booking agent on Amazon Bedrock AgentCore Runtime. A web backend calls `InvokeAgentRuntime` for each user message. Each conversation must keep its context across messages, and conversations of different users must never share context. The backend must not store or resend the conversation history.

    Which two actions should the developer take? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise héberge un agent de réservation de voyages sur Amazon Bedrock AgentCore Runtime. Un backend web appelle `InvokeAgentRuntime` pour chaque message d'utilisateur. Chaque conversation doit conserver son contexte d'un message à l'autre, et les conversations d'utilisateurs différents ne doivent jamais partager de contexte. Le backend ne doit ni stocker ni renvoyer l'historique de la conversation.

    Quelles sont les deux actions que le développeur doit effectuer ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Generate a new UUID as the runtimeSessionId when a conversation starts.", fr: "Générer un nouvel UUID comme runtimeSessionId au début d'une conversation." } }
    - { id: b, text: { en: "Pass the runtimeSessionId of the conversation in every later InvokeAgentRuntime call of that conversation.", fr: "Transmettre le runtimeSessionId de la conversation dans chaque appel InvokeAgentRuntime suivant de cette conversation." } }
    - { id: c, text: { en: "Generate a new runtimeSessionId for every InvokeAgentRuntime call.", fr: "Générer un nouveau runtimeSessionId pour chaque appel InvokeAgentRuntime." } }
    - { id: d, text: { en: "Use one fixed runtimeSessionId for all users so that the agent stays ready between calls.", fr: "Utiliser un runtimeSessionId fixe pour tous les utilisateurs afin que l'agent reste prêt entre les appels." } }
    - { id: e, text: { en: "Send all the previous messages of the conversation in the payload of each call.", fr: "Envoyer tous les messages précédents de la conversation dans la charge utile de chaque appel." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      AgentCore Runtime runs each session in a dedicated microVM with isolated CPU, memory and file system, and providing the same session identifier across requests keeps the conversation context. A UUID per conversation avoids collisions between users or conversations, and reusing it for each later message continues the same session.
    fr: |
      AgentCore Runtime exécute chaque session dans une microVM dédiée avec processeur, mémoire et système de fichiers isolés, et fournir le même identifiant de session d'une requête à l'autre conserve le contexte de la conversation. Un UUID par conversation évite les collisions entre utilisateurs ou conversations, et le réutiliser pour chaque message suivant poursuit la même session.
  options:
    c:
      en: "A new session ID for each call starts a new conversation every time, so the context is lost."
      fr: "Un nouvel ID de session à chaque appel démarre chaque fois une nouvelle conversation : le contexte est perdu."
    d:
      en: "A shared session ID makes all users share one session and its context, which breaks the isolation requirement."
      fr: "Un ID de session partagé fait partager une seule session et son contexte à tous les utilisateurs, ce qui enfreint l'exigence d'isolation."
    e:
      en: "Resending the history requires the backend to store it, which the requirements forbid."
      fr: "Renvoyer l'historique oblige le backend à le stocker, ce que les exigences interdisent."
references:
  - title: Invoke an AgentCore Runtime agent
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-invoke-agent.html
  - title: Host agent or tools with Amazon Bedrock AgentCore Runtime
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
