id: dvac03-1c-cfg-memory-cpu
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function resizes product images. It is configured with 512 MB of memory and uses about 300 MB during each invocation. Amazon CloudWatch metrics show that the function is CPU-bound and that its duration is close to its timeout. The developer must make each invocation finish faster without changing the code.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda redimensionne des images de produits. Elle est configurée avec 512 Mo de mémoire et en utilise environ 300 Mo à chaque appel. Les métriques Amazon CloudWatch montrent que la fonction est limitée par le processeur et que sa durée est proche de son délai d'expiration. Le développeur doit faire en sorte que chaque appel se termine plus vite sans modifier le code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Increase the memory setting of the function.", fr: "Augmenter le paramètre de mémoire de la fonction." } }
    - { id: b, text: { en: "Increase the ephemeral storage of the function.", fr: "Augmenter le stockage éphémère de la fonction." } }
    - { id: c, text: { en: "Configure provisioned concurrency for the function.", fr: "Configurer la simultanéité provisionnée pour la fonction." } }
    - { id: d, text: { en: "Increase the timeout setting of the function.", fr: "Augmenter le délai d'expiration de la fonction." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Lambda allocates CPU power in proportion to the configured memory, so more memory gives a CPU-bound function more CPU even when it does not use the extra memory. At 1,769 MB, a function has the equivalent of one vCPU."
    fr: "Lambda alloue la puissance de processeur proportionnellement à la mémoire configurée : plus de mémoire donne plus de processeur à une fonction limitée par le processeur, même si elle n'utilise pas la mémoire supplémentaire. À 1 769 Mo, une fonction dispose de l'équivalent d'un vCPU."
  options:
    b:
      en: "Ephemeral storage sets the size of /tmp; it does not change the CPU allocated to the function."
      fr: "Le stockage éphémère détermine la taille de /tmp ; il ne change pas le processeur alloué à la fonction."
    c:
      en: "Provisioned concurrency removes initialization latency, but each invocation still runs with the same CPU."
      fr: "La simultanéité provisionnée supprime la latence d'initialisation, mais chaque appel s'exécute toujours avec le même processeur."
    d:
      en: "A longer timeout avoids timeouts but does not make the processing any faster."
      fr: "Un délai d'expiration plus long évite les expirations, mais n'accélère pas le traitement."
references:
  - title: Configure Lambda Event Function memory
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-memory.html
