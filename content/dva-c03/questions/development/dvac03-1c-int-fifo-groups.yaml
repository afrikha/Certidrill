id: dvac03-1c-int-fifo-groups
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function processes an Amazon SQS FIFO queue through an event source mapping with MaximumConcurrency set to 50. The producers send every message with the same MessageGroupId value of orders. The function never runs more than one invocation at a time, and the queue backlog keeps growing. The business requires the messages of each customer to be processed in order, but there is no ordering requirement between customers.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda traite une file d'attente FIFO Amazon SQS par un mappage de source d'événements dont MaximumConcurrency est défini à 50. Les producteurs envoient chaque message avec la même valeur de MessageGroupId, orders. La fonction n'exécute jamais plus d'un appel à la fois, et l'arriéré de la file d'attente ne cesse de croître. L'entreprise exige que les messages de chaque client soient traités dans l'ordre, mais il n'y a aucune exigence d'ordre entre les clients.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Increase MaximumConcurrency of the event source mapping to 1,000.", fr: "Augmenter la MaximumConcurrency du mappage de source d'événements à 1 000." } }
    - { id: b, text: { en: "Change the producers to use the customer ID as the MessageGroupId.", fr: "Modifier les producteurs pour qu'ils utilisent l'ID du client comme MessageGroupId." } }
    - { id: c, text: { en: "Increase the batch size of the event source mapping to 1,000.", fr: "Augmenter la taille de lot du mappage de source d'événements à 1 000." } }
    - { id: d, text: { en: "Configure reserved concurrency of 50 on the function.", fr: "Configurer une simultanéité réservée de 50 sur la fonction." } }
answer: { optionId: b }
explanation:
  correct:
    en: "For a FIFO queue, Lambda keeps the order within each message group, so the concurrency is capped at the lower of the number of message group IDs and the maximum concurrency. With one group ID, only one invocation can run; using the customer ID as the group ID keeps per-customer order and lets different customers be processed in parallel."
    fr: "Pour une file d'attente FIFO, Lambda conserve l'ordre dans chaque groupe de messages : la simultanéité est plafonnée à la plus petite valeur entre le nombre d'ID de groupe de messages et la simultanéité maximale. Avec un seul ID de groupe, un seul appel peut s'exécuter ; utiliser l'ID du client comme ID de groupe conserve l'ordre par client et permet de traiter différents clients en parallèle."
  options:
    a:
      en: "The single message group still limits the function to one concurrent invocation, whatever the maximum concurrency."
      fr: "Le groupe de messages unique limite toujours la fonction à un appel simultané, quelle que soit la simultanéité maximale."
    c:
      en: "The batch size of a FIFO event source mapping cannot exceed 10."
      fr: "La taille de lot d'un mappage de source d'événements FIFO ne peut pas dépasser 10."
    d:
      en: "Reserved concurrency does not lift the limit of one invocation per message group."
      fr: "La simultanéité réservée ne lève pas la limite d'un appel par groupe de messages."
references:
  - title: Configuring scaling behavior for SQS event source mappings
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-scaling.html
  - title: Creating and configuring an Amazon SQS event source mapping
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-configure.html
