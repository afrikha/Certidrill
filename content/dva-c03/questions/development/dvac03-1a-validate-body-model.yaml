id: dvac03-1a-validate-body-model
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A REST API in Amazon API Gateway has a POST /orders method with a Lambda integration. Many requests have missing or wrongly typed fields in their JSON body, and the function spends time rejecting them. The company wants API Gateway to reject these requests before they reach the function, without writing code.

    Which solution will meet these requirements?
  fr: |
    Une API REST d'Amazon API Gateway possède une méthode POST /orders avec une intégration Lambda. De nombreuses requêtes ont des champs manquants ou mal typés dans leur corps JSON, et la fonction passe du temps à les rejeter. L'entreprise veut qu'API Gateway rejette ces requêtes avant qu'elles n'atteignent la fonction, sans écrire de code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a Lambda authorizer to the method that parses the body and denies invalid requests.", fr: "Ajouter à la méthode un mécanisme d'autorisation Lambda qui analyse le corps et refuse les requêtes non valides." }
    - id: b
      text: { en: "Create a model with a JSON schema for the body and enable a request validator that validates the body.", fr: "Créer un modèle avec un schéma JSON pour le corps et activer un validateur de requête qui valide le corps." }
    - id: c
      text: { en: "Create a usage plan with a low throttling rate for the method so that fewer invalid requests arrive.", fr: "Créer un plan d'utilisation avec un débit de limitation bas pour la méthode afin que moins de requêtes non valides arrivent." }
    - id: d
      text: { en: "Add a mapping template to the integration request that removes unknown fields from the body.", fr: "Ajouter à la demande d'intégration un modèle de mappage qui supprime les champs inconnus du corps." }
answer: { optionId: b }
explanation:
  correct:
    en: "Request validation checks the body against the JSON schema model configured for the method's content type. When validation fails, API Gateway returns a 400 error immediately, before the integration request, so the function is never invoked for invalid requests."
    fr: "La validation des requêtes contrôle le corps par rapport au modèle de schéma JSON configuré pour le type de contenu de la méthode. En cas d'échec, API Gateway renvoie immédiatement une erreur 400, avant la demande d'intégration : la fonction n'est jamais invoquée pour des requêtes non valides."
  options:
    a:
      en: "A Lambda authorizer is custom code meant for access control, and it still runs a function for each request."
      fr: "Un mécanisme d'autorisation Lambda est du code spécifique destiné au contrôle d'accès, et il exécute toujours une fonction pour chaque requête."
    c:
      en: "Throttling limits the request rate of all requests, valid or not; it doesn't check the body."
      fr: "La limitation restreint le débit de toutes les requêtes, valides ou non ; elle ne contrôle pas le corps."
    d:
      en: "A mapping template transforms the payload but doesn't reject requests whose fields are missing or have the wrong type."
      fr: "Un modèle de mappage transforme la charge utile mais ne rejette pas les requêtes dont des champs manquent ou ont un mauvais type."
references:
  - title: Request validation for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-method-request-validation.html
