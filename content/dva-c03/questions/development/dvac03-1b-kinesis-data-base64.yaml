id: dvac03-1b-kinesis-data-base64
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A producer writes JSON documents such as `{"deviceId": "d-17", "temp": 21.5}` to an Amazon Kinesis data stream. A developer writes the following AWS Lambda function, which is invoked by an event source mapping on the stream. Every invocation fails with a `JSONDecodeError`.

    ```python
    import json

    def handler(event, context):
        for record in event["Records"]:
            reading = json.loads(record["kinesis"]["data"])
            save(reading["deviceId"], reading["temp"])
    ```

    Which change will fix the function?
  fr: |
    Un producteur écrit des documents JSON comme `{"deviceId": "d-17", "temp": 21.5}` dans un flux de données Amazon Kinesis. Un développeur écrit la fonction AWS Lambda suivante, invoquée par un mappage de source d'événements sur le flux. Chaque invocation échoue avec une erreur `JSONDecodeError`.

    ```python
    import json

    def handler(event, context):
        for record in event["Records"]:
            reading = json.loads(record["kinesis"]["data"])
            save(reading["deviceId"], reading["temp"])
    ```

    Quelle modification corrige la fonction ?
body:
  options:
    - { id: a, text: "`reading = json.loads(base64.b64decode(record[\"kinesis\"][\"data\"]))`" }
    - { id: b, text: "`reading = json.loads(record[\"body\"])`" }
    - { id: c, text: "`reading = json.loads(json.dumps(record[\"kinesis\"][\"data\"]))`" }
    - { id: d, text: "`reading = json.loads(record[\"kinesis\"][\"data\"].encode(\"utf-8\"))`" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In the event that Lambda sends for a Kinesis record, the data field holds the record payload as a base64-encoded string. The function must decode it (after `import base64`) to get the original JSON bytes and then parse them with json.loads.
    fr: |
      Dans l'événement que Lambda envoie pour un enregistrement Kinesis, le champ data contient la charge utile de l'enregistrement sous forme de chaîne encodée en base64. La fonction doit la décoder (après `import base64`) pour obtenir les octets JSON d'origine, puis les analyser avec json.loads.
  options:
    b:
      en: "The body field belongs to Amazon SQS events; a Kinesis record has no body field, so this raises a KeyError."
      fr: "Le champ body appartient aux événements Amazon SQS ; un enregistrement Kinesis n'a pas de champ body : cela lève une KeyError."
    c:
      en: "Serializing and parsing the string again returns the same base64 text, not the JSON document."
      fr: "Sérialiser puis analyser de nouveau la chaîne renvoie le même texte base64, pas le document JSON."
    d:
      en: "Encoding the base64 text to bytes does not decode it, so the content is still not valid JSON."
      fr: "Encoder le texte base64 en octets ne le décode pas : le contenu n'est toujours pas du JSON valide."
references:
  - title: Using Lambda to process records from Amazon Kinesis Data Streams
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html
