id: dvac03-1d-cache-dax-consistent-read
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer at AnyCompany added a DynamoDB Accelerator (DAX) cluster in front of a product table. The function below reads products through the DAX client. After the change, read latency is unchanged and the DAX cache hit metrics stay close to zero, although the same products are read many times each minute. The product pages can show data that is a few seconds old.

    ```python
    # table is created from the DAX client for the Products table
    def get_product(product_id):
        response = table.get_item(
            Key={"ProductId": product_id},
            ConsistentRead=True,
        )
        return response.get("Item")
    ```

    Which change will reduce the read latency?
  fr: |
    Un développeur d'AnyCompany a ajouté un cluster DynamoDB Accelerator (DAX) devant une table de produits. La fonction ci-dessous lit les produits via le client DAX. Après la modification, la latence de lecture est inchangée et les métriques d'accès au cache DAX restent proches de zéro, alors que les mêmes produits sont lus de nombreuses fois par minute. Les pages produit peuvent afficher des données datant de quelques secondes.

    ```python
    # table is created from the DAX client for the Products table
    def get_product(product_id):
        response = table.get_item(
            Key={"ProductId": product_id},
            ConsistentRead=True,
        )
        return response.get("Item")
    ```

    Quelle modification réduira la latence de lecture ?
body:
  options:
    - { id: a, text: { en: "Increase the record-ttl-millis parameter of the DAX cluster so that items stay in the item cache longer.", fr: "Augmenter le paramètre record-ttl-millis du cluster DAX pour que les éléments restent plus longtemps dans le cache d'éléments." } }
    - { id: b, text: { en: "Add nodes to the DAX cluster so that the item cache has more memory.", fr: "Ajouter des nœuds au cluster DAX pour que le cache d'éléments dispose de plus de mémoire." } }
    - { id: c, text: { en: "Remove ConsistentRead=True so that the GetItem calls use eventually consistent reads.", fr: "Supprimer ConsistentRead=True pour que les appels GetItem utilisent des lectures à cohérence éventuelle." } }
    - { id: d, text: { en: "Replace get_item with a query on the partition key so that the results go to the query cache.", fr: "Remplacer get_item par un appel query sur la clé de partition pour que les résultats aillent dans le cache de requêtes." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      DAX passes strongly consistent reads through to DynamoDB and does not cache their results, so every call still goes to the table. With the default eventually consistent reads, DAX serves repeated GetItem calls from its item cache in microseconds, which the product pages can tolerate.
    fr: |
      DAX transmet les lectures fortement cohérentes directement à DynamoDB et ne met pas leurs résultats en cache : chaque appel va donc toujours jusqu'à la table. Avec les lectures à cohérence éventuelle par défaut, DAX sert les appels GetItem répétés depuis son cache d'éléments en microsecondes, ce que les pages produit tolèrent.
  options:
    a: { en: "The items never enter the item cache because the reads are strongly consistent, so a longer TTL changes nothing.", fr: "Les éléments n'entrent jamais dans le cache d'éléments puisque les lectures sont fortement cohérentes : un TTL plus long ne change rien." }
    b: { en: "Cache memory is not the problem; strongly consistent reads bypass the cache whatever its size.", fr: "La mémoire du cache n'est pas le problème ; les lectures fortement cohérentes contournent le cache quelle que soit sa taille." }
    d: { en: "A strongly consistent Query is passed through to DynamoDB in the same way, and changing the call does not address the cause.", fr: "Une Query fortement cohérente est transmise directement à DynamoDB de la même façon, et changer l'appel ne traite pas la cause." }
references:
  - title: DAX and DynamoDB consistency models
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.consistency.html
