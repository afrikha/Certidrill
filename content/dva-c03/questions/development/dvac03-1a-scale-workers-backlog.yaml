id: dvac03-1a-scale-workers-backlog
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A front-end application on Amazon EC2 sends image-processing jobs to an Amazon SQS queue. Worker instances in an Auto Scaling group poll the queue. The number of jobs varies widely during the day. The company wants the workers to scale independently of the front end, based on the work that is waiting to be processed.

    Which solution will meet these requirements?
  fr: |
    Une application frontale sur Amazon EC2 envoie des tâches de traitement d'images dans une file d'attente Amazon SQS. Des instances de travail d'un groupe Auto Scaling interrogent la file. Le nombre de tâches varie fortement au cours de la journée. L'entreprise veut que les instances de travail se mettent à l'échelle indépendamment du frontal, en fonction du travail en attente de traitement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Scale the workers on the average CPU utilization of the front-end instances.", fr: "Mettre à l'échelle les instances de travail selon l'utilisation moyenne du processeur des instances frontales." }
    - id: b
      text: { en: "Scale the workers on the RequestCount metric of the front-end Application Load Balancer.", fr: "Mettre à l'échelle les instances de travail selon la métrique RequestCount de l'Application Load Balancer frontal." }
    - id: c
      text: { en: "Scale the workers on the NumberOfMessagesDeleted metric of the queue.", fr: "Mettre à l'échelle les instances de travail selon la métrique NumberOfMessagesDeleted de la file." }
    - id: d
      text: { en: "Scale the workers on a backlog per instance computed from the number of messages in the queue.", fr: "Mettre à l'échelle les instances de travail selon un backlog par instance calculé à partir du nombre de messages de la file." }
answer: { optionId: d }
explanation:
  correct:
    en: "The queue decouples the tiers, so the workers should follow the queue, not the front end. AWS recommends a target tracking policy on the backlog per instance: the number of messages in the queue divided by the number of InService instances, which scales the group in proportion to the waiting work."
    fr: "La file découple les niveaux : les instances de travail doivent suivre la file, pas le frontal. AWS recommande une politique de suivi de cible sur le backlog par instance : le nombre de messages de la file divisé par le nombre d'instances InService, ce qui met le groupe à l'échelle en proportion du travail en attente."
  options:
    a:
      en: "Front-end CPU reflects the producers, not the jobs waiting in the queue, and ties the workers back to the front end."
      fr: "Le processeur du frontal reflète les producteurs, pas les tâches en attente dans la file, et relie de nouveau les instances de travail au frontal."
    b:
      en: "The load balancer request count measures front-end traffic, not the backlog of jobs that the workers must process."
      fr: "Le nombre de requêtes de l'équilibreur de charge mesure le trafic du frontal, pas le backlog de tâches que les instances de travail doivent traiter."
    c:
      en: "NumberOfMessagesDeleted counts jobs already processed; it doesn't measure the jobs that are still waiting."
      fr: "NumberOfMessagesDeleted compte les tâches déjà traitées ; elle ne mesure pas les tâches encore en attente."
references:
  - title: Scaling policy based on Amazon SQS
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html
