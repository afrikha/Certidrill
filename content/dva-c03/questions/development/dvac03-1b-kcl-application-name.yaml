id: dvac03-1b-kcl-application-name
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs two different consumer applications on Amazon EC2: a fraud detector and an archiver. Both read the same Amazon Kinesis data stream with the Kinesis Client Library (KCL). A developer copied the configuration of the fraud detector to build the archiver, so both applications use the same application name. Since the archiver was deployed, each application processes only part of the records, and some shards are never read by the fraud detector.

    What should the developer do to make each application process every record?
  fr: |
    Une entreprise exécute deux applications consommatrices différentes sur Amazon EC2 : un détecteur de fraude et un archiveur. Les deux lisent le même flux de données Amazon Kinesis avec la Kinesis Client Library (KCL). Un développeur a copié la configuration du détecteur de fraude pour créer l'archiveur : les deux applications utilisent donc le même nom d'application. Depuis le déploiement de l'archiveur, chaque application ne traite qu'une partie des enregistrements, et certaines partitions (shards) ne sont jamais lues par le détecteur de fraude.

    Que doit faire le développeur pour que chaque application traite tous les enregistrements ?
body:
  options:
    - id: a
      text: { en: "Increase the read and write capacity of the KCL lease table in Amazon DynamoDB.", fr: "Augmenter la capacité de lecture et d'écriture de la table des baux de la KCL dans Amazon DynamoDB." }
    - id: b
      text: { en: "Give the archiver its own application name so that the KCL uses a separate lease table for it.", fr: "Donner à l'archiveur son propre nom d'application afin que la KCL utilise une table des baux distincte pour lui." }
    - id: c
      text: { en: "Set the maximum number of leases per worker to the number of shards in both applications.", fr: "Définir le nombre maximal de baux par processus de travail (worker) sur le nombre de partitions dans les deux applications." }
    - id: d
      text: { en: "Change the archiver to checkpoint after every record instead of after every batch.", fr: "Modifier l'archiveur pour qu'il crée un point de contrôle après chaque enregistrement au lieu de chaque lot." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The KCL derives the name of its DynamoDB lease table from the application name, and only one worker holds the lease of a shard at a time. With the same name, the workers of both applications compete for the same leases and act as one consumer group, so each application reads only some shards. A unique application name gives the archiver its own lease table and its own checkpoints.
    fr: |
      La KCL déduit le nom de sa table des baux DynamoDB du nom de l'application, et un seul processus de travail détient le bail d'une partition à un instant donné. Avec le même nom, les processus des deux applications se disputent les mêmes baux et agissent comme un seul groupe de consommateurs : chaque application ne lit que certaines partitions. Un nom d'application unique donne à l'archiveur sa propre table des baux et ses propres points de contrôle.
  options:
    a:
      en: "More table capacity reduces lease table throttling but the two applications still share the same leases."
      fr: "Davantage de capacité réduit la limitation de la table des baux, mais les deux applications partagent toujours les mêmes baux."
    c:
      en: "Each lease is still held by only one worker across both applications, so a shard is still read by only one of them."
      fr: "Chaque bail n'est toujours détenu que par un seul processus de travail pour les deux applications : une partition n'est toujours lue que par l'une d'elles."
    d:
      en: "Checkpoint frequency changes where processing resumes after a failure, not which application owns each shard."
      fr: "La fréquence des points de contrôle change l'endroit où le traitement reprend après une panne, pas l'application qui détient chaque partition."
references:
  - title: KCL 1.x and 2.x information
    url: https://docs.aws.amazon.com/streams/latest/dev/shared-throughput-kcl-consumers.html
