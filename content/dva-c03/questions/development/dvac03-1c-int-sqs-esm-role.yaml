id: dvac03-1c-int-sqs-esm-role
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer creates an event source mapping between an Amazon SQS standard queue and an AWS Lambda function. The queue uses SQS managed server-side encryption (SSE-SQS). The operation fails with an error that states that the function's execution role does not have permission to call ReceiveMessage on the queue.

    Which solution will meet this requirement while following the principle of least privilege?
  fr: |
    Un développeur crée un mappage de source d'événements entre une file d'attente standard Amazon SQS et une fonction AWS Lambda. La file d'attente utilise le chiffrement côté serveur géré par SQS (SSE-SQS). L'opération échoue avec une erreur indiquant que le rôle d'exécution de la fonction n'a pas l'autorisation d'appeler ReceiveMessage sur la file d'attente.

    Quelle solution répond à cette exigence tout en respectant le principe du moindre privilège ?
body:
  options:
    - { id: a, text: { en: "Add a queue policy that allows the lambda.amazonaws.com service principal to call sqs:SendMessage on the queue.", fr: "Ajouter une politique de file d'attente qui autorise le principal de service lambda.amazonaws.com à appeler sqs:SendMessage sur la file d'attente." } }
    - { id: b, text: { en: "Run lambda add-permission so that the sqs.amazonaws.com service principal can invoke the function.", fr: "Exécuter lambda add-permission afin que le principal de service sqs.amazonaws.com puisse appeler la fonction." } }
    - { id: c, text: { en: "Attach the AmazonSQSFullAccess managed policy to the execution role of the function.", fr: "Attacher la politique gérée AmazonSQSFullAccess au rôle d'exécution de la fonction." } }
    - { id: d, text: { en: "Allow sqs:ReceiveMessage, sqs:DeleteMessage and sqs:GetQueueAttributes on the queue ARN in the execution role.", fr: "Autoriser sqs:ReceiveMessage, sqs:DeleteMessage et sqs:GetQueueAttributes sur l'ARN de la file d'attente dans le rôle d'exécution." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With an event source mapping, Lambda polls the queue, reads batches and deletes processed messages by using the function's execution role. These are the SQS actions of the AWSLambdaSQSQueueExecutionRole managed policy, scoped here to the queue ARN. No KMS permission is needed because the queue uses SSE-SQS."
    fr: "Avec un mappage de source d'événements, Lambda interroge la file d'attente, lit les lots et supprime les messages traités à l'aide du rôle d'exécution de la fonction. Ce sont les actions SQS de la politique gérée AWSLambdaSQSQueueExecutionRole, limitées ici à l'ARN de la file d'attente. Aucune autorisation KMS n'est nécessaire, car la file d'attente utilise SSE-SQS."
  options:
    a:
      en: "Lambda needs to receive and delete messages, not send them, and the error names the execution role."
      fr: "Lambda doit recevoir et supprimer des messages, pas en envoyer, et l'erreur désigne le rôle d'exécution."
    b:
      en: "Amazon SQS does not push to the function; Lambda polls the queue, so a resource-based policy does not help."
      fr: "Amazon SQS n'envoie rien à la fonction ; c'est Lambda qui interroge la file d'attente : une politique basée sur les ressources n'aide pas."
    c:
      en: "Full access to every queue grants far more than the three actions that the event source mapping needs."
      fr: "Un accès complet à toutes les files d'attente accorde bien plus que les trois actions dont le mappage de source d'événements a besoin."
references:
  - title: AWSLambdaSQSQueueExecutionRole
    url: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSLambdaSQSQueueExecutionRole.html
  - title: Creating and configuring an Amazon SQS event source mapping
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-configure.html
