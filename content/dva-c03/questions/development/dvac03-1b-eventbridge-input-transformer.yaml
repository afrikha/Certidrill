id: dvac03-1b-eventbridge-input-transformer
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon EventBridge rule matches `OrderShipped` events and targets an Amazon SNS topic that sends email notifications to the support team. The team receives the full event JSON and wants a short text such as `Order o-42 shipped to Lyon`, built from the `detail.orderId` and `detail.city` fields of the event. The company wants the solution with the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Une règle Amazon EventBridge correspond aux événements `OrderShipped` et cible une rubrique Amazon SNS qui envoie des notifications par e-mail à l'équipe de support. L'équipe reçoit le JSON complet de l'événement et veut un texte court comme `Order o-42 shipped to Lyon`, construit à partir des champs `detail.orderId` et `detail.city` de l'événement. L'entreprise veut la solution qui demande le MOINS d'effort de développement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change the rule target to an AWS Lambda function that formats the text and publishes it to the SNS topic.", fr: "Remplacer la cible de la règle par une fonction AWS Lambda qui met en forme le texte et le publie dans la rubrique SNS." }
    - id: b
      text: { en: "Configure an input transformer on the target, with an input path for each field and an input template for the text.", fr: "Configurer un transformateur d'entrée sur la cible, avec un chemin d'entrée pour chaque champ et un modèle d'entrée pour le texte." }
    - id: c
      text: { en: "Turn on raw message delivery for the email subscriptions of the SNS topic.", fr: "Activer la remise de messages bruts pour les abonnements e-mail de la rubrique SNS." }
    - id: d
      text: { en: "Add the fields to the event pattern of the rule so that EventBridge sends only these fields to the target.", fr: "Ajouter les champs au modèle d'événement de la règle afin qu'EventBridge n'envoie que ces champs à la cible." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An input transformer customizes the text that EventBridge sends to a target. The input paths map variables to JSON paths of the event, such as $.detail.orderId, and the input template uses them as <variable> placeholders to build the message. No code is needed.
    fr: |
      Un transformateur d'entrée personnalise le texte qu'EventBridge envoie à une cible. Les chemins d'entrée associent des variables à des chemins JSON de l'événement, comme $.detail.orderId, et le modèle d'entrée les utilise comme espaces réservés <variable> pour construire le message. Aucun code n'est nécessaire.
  options:
    a:
      en: "A formatting function works but adds code to write and maintain, while an input transformer is configuration only."
      fr: "Une fonction de mise en forme fonctionne, mais ajoute du code à écrire et à maintenir, alors qu'un transformateur d'entrée relève de la seule configuration."
    c:
      en: "Raw message delivery applies to Amazon SQS, HTTP/S and Firehose subscriptions, and it removes the SNS envelope; it cannot build a text from event fields."
      fr: "La remise de messages bruts s'applique aux abonnements Amazon SQS, HTTP/S et Firehose, et retire l'enveloppe SNS ; elle ne peut pas construire un texte à partir des champs de l'événement."
    d:
      en: "An event pattern only decides which events match the rule; EventBridge still sends the whole event to the target."
      fr: "Un modèle d'événement décide seulement quels événements correspondent à la règle ; EventBridge envoie toujours l'événement complet à la cible."
references:
  - title: Amazon EventBridge input transformation
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-transform-target-input.html
