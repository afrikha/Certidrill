id: dvac03-1b-apigw-proxy-json-body
objective: "1.1.7"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A developer creates an Amazon API Gateway REST API with a Lambda proxy integration. Clients send `POST /orders` requests with a JSON body. The Node.js function must read the `customerId` field of the request body and return a JSON object to the client. The current function returns `502 Bad Gateway` errors.

    ```javascript
    export const handler = async (event) => {
      const customerId = event.body.customerId;
      const order = await createOrder(customerId);
      return { statusCode: 201, body: order };
    };
    ```

    Which two changes should the developer make? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur crée une API REST Amazon API Gateway avec une intégration de proxy Lambda. Les clients envoient des requêtes `POST /orders` avec un corps JSON. La fonction Node.js doit lire le champ `customerId` du corps de la requête et renvoyer un objet JSON au client. La fonction actuelle renvoie des erreurs `502 Bad Gateway`.

    ```javascript
    export const handler = async (event) => {
      const customerId = event.body.customerId;
      const order = await createOrder(customerId);
      return { statusCode: 201, body: order };
    };
    ```

    Quelles sont les deux modifications que le développeur doit effectuer ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "`const customerId = JSON.parse(event.body).customerId;`" }
    - { id: b, text: "`const customerId = event.queryStringParameters.customerId;`" }
    - { id: c, text: "`return { statusCode: 201, body: JSON.stringify(order) };`" }
    - { id: d, text: "`return { statusCode: 201, body: order, isBase64Encoded: true };`" }
    - { id: e, text: "`return order;`" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      In a Lambda proxy integration, API Gateway passes the request body to the function as a string in event.body, so the function must parse it with JSON.parse. The function must also return an object with statusCode and a body that is a string; any other output format makes API Gateway return 502 Bad Gateway. JSON.stringify turns the order object into that string.
    fr: |
      Dans une intégration de proxy Lambda, API Gateway transmet le corps de la requête à la fonction sous forme de chaîne dans event.body : la fonction doit l'analyser avec JSON.parse. La fonction doit aussi renvoyer un objet avec statusCode et un body qui est une chaîne ; tout autre format de sortie fait renvoyer 502 Bad Gateway par API Gateway. JSON.stringify transforme l'objet order en cette chaîne.
  options:
    b:
      en: "The client sends customerId in the JSON body of a POST request, not in the query string."
      fr: "Le client envoie customerId dans le corps JSON d'une requête POST, pas dans la chaîne de requête."
    d:
      en: "isBase64Encoded is for binary bodies encoded as base64 strings; the body is still an object, so the response stays malformed."
      fr: "isBase64Encoded sert aux corps binaires encodés en chaînes base64 ; le body reste un objet : la réponse est toujours mal formée."
    e:
      en: "Returning the order object directly omits statusCode and body, which a proxy integration requires."
      fr: "Renvoyer directement l'objet order omet statusCode et body, qu'une intégration de proxy exige."
references:
  - title: Lambda proxy integrations in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-lambda-proxy-integrations.html
