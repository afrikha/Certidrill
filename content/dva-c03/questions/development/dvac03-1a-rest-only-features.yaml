id: dvac03-1a-rest-only-features
objective: "1.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A team is choosing between an Amazon API Gateway REST API and an HTTP API for a new public API. The team wants to know which features would require a REST API.

    Which three features are available for REST APIs but not for HTTP APIs? (Choose three.)
  fr: |
    Une équipe hésite entre une API REST et une API HTTP Amazon API Gateway pour une nouvelle API publique. Elle veut savoir quelles fonctionnalités imposeraient une API REST.

    Quelles sont les trois fonctionnalités disponibles pour les API REST mais pas pour les API HTTP ? (Choisissez-en trois.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "Request validation against a model", fr: "Validation des requêtes par rapport à un modèle" } }
    - { id: b, text: { en: "Custom domain names for the API endpoint", fr: "Noms de domaine personnalisés pour le point de terminaison de l'API" } }
    - { id: c, text: { en: "CORS configuration for browser clients", fr: "Configuration CORS pour les clients navigateur" } }
    - { id: d, text: { en: "Request body transformation with mapping templates", fr: "Transformation du corps de la requête avec des modèles de mappage" } }
    - { id: e, text: { en: "API keys and usage plans for per-client throttling", fr: "Clés d'API et plans d'utilisation pour la limitation par client" } }
    - { id: f, text: { en: "Integrations with AWS Lambda functions", fr: "Intégrations avec des fonctions AWS Lambda" } }
answer: { optionIds: [ a, d, e ] }
explanation:
  correct:
    en: "HTTP APIs are designed with fewer features at a lower price. Request validation, request body transformation, and API keys with per-client throttling and usage plans are REST API features."
    fr: "Les API HTTP sont conçues avec moins de fonctionnalités, pour un prix plus bas. La validation des requêtes, la transformation du corps de la requête, ainsi que les clés d'API avec limitation par client et plans d'utilisation sont des fonctionnalités des API REST."
  options:
    b:
      en: "Custom domain names are available for both REST APIs and HTTP APIs."
      fr: "Les noms de domaine personnalisés sont disponibles pour les API REST comme pour les API HTTP."
    c:
      en: "Both API types support CORS configuration."
      fr: "Les deux types d'API prennent en charge la configuration CORS."
    f:
      en: "Both API types integrate with Lambda functions."
      fr: "Les deux types d'API s'intègrent aux fonctions Lambda."
references:
  - title: Choose between REST APIs and HTTP APIs
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-vs-rest.html
