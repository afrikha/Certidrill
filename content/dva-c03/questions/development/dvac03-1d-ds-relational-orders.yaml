id: dvac03-1d-ds-relational-orders
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is rewriting its order management application. The data model has customers, orders, order lines and inventory, with foreign keys between them. Each checkout must update several of these entities in one ACID transaction. Business analysts also run ad hoc SQL reports that join all four entities, and the team already uses PostgreSQL drivers and tools.

    Which data store will meet these requirements?
  fr: |
    AnyCompany réécrit son application de gestion des commandes. Le modèle de données comprend des clients, des commandes, des lignes de commande et des stocks, reliés par des clés étrangères. Chaque validation de panier doit mettre à jour plusieurs de ces entités dans une seule transaction ACID. Les analystes métier exécutent aussi des rapports SQL ad hoc qui joignent les quatre entités, et l'équipe utilise déjà des pilotes et des outils PostgreSQL.

    Quel magasin de données répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Amazon DynamoDB, with one table per entity and Scan operations for the reports", fr: "Amazon DynamoDB, avec une table par entité et des opérations Scan pour les rapports" } }
    - { id: b, text: { en: "Amazon ElastiCache (Valkey), with one hash per entity and MULTI/EXEC blocks for checkouts", fr: "Amazon ElastiCache (Valkey), avec un hachage par entité et des blocs MULTI/EXEC pour les validations" } }
    - { id: c, text: { en: "Amazon S3, with one CSV object per entity and Amazon Athena queries for the reports", fr: "Amazon S3, avec un objet CSV par entité et des requêtes Amazon Athena pour les rapports" } }
    - { id: d, text: { en: "Amazon Aurora PostgreSQL-Compatible Edition, with one table per entity and SQL joins for the reports", fr: "Amazon Aurora PostgreSQL-Compatible Edition, avec une table par entité et des jointures SQL pour les rapports" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Aurora is a managed relational database compatible with PostgreSQL, so existing drivers, tools and SQL work unchanged. Foreign keys, multi-table ACID transactions and ad hoc joins are native relational features, which matches every access pattern of the application.
    fr: |
      Aurora est une base de données relationnelle gérée compatible avec PostgreSQL : les pilotes, les outils et le SQL existants fonctionnent sans modification. Les clés étrangères, les transactions ACID sur plusieurs tables et les jointures ad hoc sont des fonctions relationnelles natives, ce qui correspond à tous les modèles d'accès de l'application.
  options:
    a: { en: "DynamoDB supports transactions, but it has no joins or ad hoc SQL; reports would scan every table and join the results in code.", fr: "DynamoDB prend en charge les transactions, mais il n'a ni jointures ni SQL ad hoc ; les rapports analyseraient chaque table et joindraient les résultats dans le code." }
    b: { en: "An in-memory key-value store has no foreign keys, joins or SQL, so the analysts could not run their reports.", fr: "Un magasin clé-valeur en mémoire n'a ni clés étrangères, ni jointures, ni SQL : les analystes ne pourraient pas exécuter leurs rapports." }
    c: { en: "Athena can join files in S3 for reports, but objects in S3 cannot be updated by an ACID transaction at each checkout.", fr: "Athena peut joindre des fichiers de S3 pour des rapports, mais les objets de S3 ne peuvent pas être mis à jour par une transaction ACID à chaque validation." }
references:
  - title: What is Amazon Aurora?
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html
