id: dvac03-1c-life-ttl-number-format
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A shopping cart service writes items to an Amazon DynamoDB table with the following code. Time to live (TTL) was enabled on the expiresAt attribute several weeks ago, but no cart has ever been deleted.

    ```python
    table.put_item(Item={
        "pk": f"cart#{cart_id}",
        "items": items,
        "expiresAt": (datetime.now(timezone.utc) + timedelta(days=7)).isoformat(),
    })
    ```

    Which change will make DynamoDB delete carts about 7 days after they are written?
  fr: |
    Un service de paniers d'achat écrit des éléments dans une table Amazon DynamoDB avec le code suivant. La durée de vie (TTL) a été activée sur l'attribut expiresAt il y a plusieurs semaines, mais aucun panier n'a jamais été supprimé.

    ```python
    table.put_item(Item={
        "pk": f"cart#{cart_id}",
        "items": items,
        "expiresAt": (datetime.now(timezone.utc) + timedelta(days=7)).isoformat(),
    })
    ```

    Quelle modification fait supprimer les paniers par DynamoDB environ 7 jours après leur écriture ?
body:
  options:
    - { id: a, text: { en: "Store expiresAt as a Number that contains the expiration time in milliseconds since the Unix epoch.", fr: "Stocker expiresAt sous forme de Number contenant l'heure d'expiration en millisecondes depuis l'epoch Unix." } }
    - { id: b, text: { en: "Store expiresAt as a Number that contains the expiration time in seconds since the Unix epoch.", fr: "Stocker expiresAt sous forme de Number contenant l'heure d'expiration en secondes depuis l'epoch Unix." } }
    - { id: c, text: { en: "Turn on DynamoDB Streams for the table so that the TTL process can find and delete the expired items.", fr: "Activer DynamoDB Streams pour la table afin que le processus TTL puisse trouver et supprimer les éléments expirés." } }
    - { id: d, text: { en: "Rename the attribute to ttl in the code, and enable TTL on the new attribute name of the table.", fr: "Renommer l'attribut en ttl dans le code, et activer la TTL sur le nouveau nom d'attribut de la table." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The TTL attribute must be a Number that holds the expiration time in Unix epoch seconds. The TTL process ignores items whose attribute is a String such as an ISO 8601 date, so these carts are never deleted."
    fr: "L'attribut TTL doit être un Number contenant l'heure d'expiration en secondes epoch Unix. Le processus TTL ignore les éléments dont l'attribut est une chaîne (String), comme une date ISO 8601 : ces paniers ne sont donc jamais supprimés."
  options:
    a:
      en: "TTL expects seconds; a value in milliseconds is read as a date far in the future, so the items do not expire after 7 days."
      fr: "La TTL attend des secondes ; une valeur en millisecondes est lue comme une date très lointaine : les éléments n'expirent pas après 7 jours."
    c:
      en: "Streams are optional and only record the TTL deletes; they do not make a String attribute valid for TTL."
      fr: "Les flux sont facultatifs et ne font qu'enregistrer les suppressions TTL ; ils ne rendent pas valide pour la TTL un attribut de type String."
    d:
      en: "The attribute name is free; the problem is the data type and format of the value."
      fr: "Le nom de l'attribut est libre ; le problème est le type et le format de la valeur."
references:
  - title: Computing time to live (TTL) in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/time-to-live-ttl-before-you-start.html
  - title: Using time to live (TTL) in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html
