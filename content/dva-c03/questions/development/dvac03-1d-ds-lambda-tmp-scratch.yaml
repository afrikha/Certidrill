id: dvac03-1d-ds-lambda-tmp-scratch
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function at AnyCompany processes satellite images. At each invocation, the function downloads a 3 GB reference file from Amazon S3 and writes about 4 GB of intermediate files, which it deletes before it returns. No other function or invocation needs these files. The function now fails with "No space left on device" errors.

    The solution must have the LEAST cost and configuration effort.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda d'AnyCompany traite des images satellite. À chaque appel, la fonction télécharge depuis Amazon S3 un fichier de référence de 3 Go et écrit environ 4 Go de fichiers intermédiaires, qu'elle supprime avant de se terminer. Aucune autre fonction ni aucun autre appel n'a besoin de ces fichiers. La fonction échoue désormais avec des erreurs « No space left on device ».

    La solution doit présenter le MOINS de coût et d'effort de configuration.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Increase the ephemeral storage (/tmp) of the function to 8,192 MB.", fr: "Porter le stockage éphémère (/tmp) de la fonction à 8 192 Mo." } }
    - { id: b, text: { en: "Create an Amazon EFS file system, connect the function to the VPC, and mount the file system in the function.", fr: "Créer un système de fichiers Amazon EFS, connecter la fonction au VPC et monter le système de fichiers dans la fonction." } }
    - { id: c, text: { en: "Write the intermediate files as items in an Amazon DynamoDB table and delete the items at the end of the invocation.", fr: "Écrire les fichiers intermédiaires sous forme d'éléments dans une table Amazon DynamoDB et supprimer les éléments à la fin de l'appel." } }
    - { id: d, text: { en: "Write the intermediate files to an Amazon S3 bucket and delete the objects at the end of the invocation.", fr: "Écrire les fichiers intermédiaires dans un compartiment Amazon S3 et supprimer les objets à la fin de l'appel." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Lambda provides ephemeral storage in /tmp that is unique to each execution environment and configurable from 512 MB to 10,240 MB. About 7 GB of scratch space is needed only during the invocation, so raising the ephemeral storage is a single configuration change and adds only a small storage charge.
    fr: |
      Lambda fournit dans /tmp un stockage éphémère propre à chaque environnement d'exécution et configurable de 512 Mo à 10 240 Mo. Environ 7 Go d'espace de travail ne sont nécessaires que pendant l'appel : augmenter le stockage éphémère est une seule modification de configuration et n'ajoute qu'un faible coût de stockage.
  options:
    b: { en: "EFS works, but it adds a file system, mount targets, VPC configuration and storage charges for data that no other invocation needs.", fr: "EFS fonctionne, mais il ajoute un système de fichiers, des cibles de montage, une configuration VPC et des frais de stockage pour des données dont aucun autre appel n'a besoin." }
    c: { en: "DynamoDB items are limited to 400 KB, and writing gigabytes of temporary data would consume large amounts of write capacity.", fr: "Les éléments DynamoDB sont limités à 400 Ko, et écrire des gigaoctets de données temporaires consommerait beaucoup de capacité d'écriture." }
    d: { en: "The processing code writes local files; moving gigabytes through Amazon S3 at each invocation adds code changes, request costs and latency.", fr: "Le code de traitement écrit des fichiers locaux ; faire transiter des gigaoctets par Amazon S3 à chaque appel ajoute des modifications de code, des coûts de requêtes et de la latence." }
references:
  - title: Configure ephemeral storage for Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-ephemeral-storage.html
