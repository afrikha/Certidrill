id: dvac03-1d-ddb-parallel-scan
objective: "1.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Each night, a reconciliation job at AnyCompany reads every item of a 200 GB Amazon DynamoDB table in provisioned capacity mode and processes the items in application code. The job uses one sequential Scan and no longer finishes before the morning. The table also serves customer traffic at night, and the job must not consume all the table's read capacity.

    Which combination of changes will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Chaque nuit, une tâche de rapprochement d'AnyCompany lit tous les éléments d'une table Amazon DynamoDB de 200 Go en mode de capacité provisionnée et traite les éléments dans le code de l'application. La tâche utilise un seul Scan séquentiel et ne se termine plus avant le matin. La table sert aussi du trafic client la nuit, et la tâche ne doit pas consommer toute la capacité de lecture de la table.

    Quelle combinaison de modifications répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a ProjectionExpression that returns only the attributes the job needs, so that each page consumes fewer read capacity units.", fr: "Ajouter une ProjectionExpression qui ne renvoie que les attributs nécessaires à la tâche, pour que chaque page consomme moins d'unités de capacité de lecture." } }
    - { id: b, text: { en: "Run several workers that each call Scan with its own Segment value and the same TotalSegments value.", fr: "Exécuter plusieurs processus de travail (workers) qui appellent chacun Scan avec sa propre valeur de Segment et la même valeur de TotalSegments." } }
    - { id: c, text: { en: "Add a FilterExpression that removes the items the job does not need, so that the Scan consumes fewer read capacity units.", fr: "Ajouter une FilterExpression qui écarte les éléments inutiles à la tâche, pour que le Scan consomme moins d'unités de capacité de lecture." } }
    - { id: d, text: { en: "Set ConsistentRead to true on each Scan request so that every worker reads the latest data.", fr: "Définir ConsistentRead sur true dans chaque requête Scan pour que chaque processus lise les données les plus récentes." } }
    - { id: e, text: { en: "Set the Limit parameter on each Scan request to cap the number of items read per request.", fr: "Définir le paramètre Limit dans chaque requête Scan pour plafonner le nombre d'éléments lus par requête." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      A parallel scan divides the table into logical segments: each worker scans one segment, identified by Segment, and TotalSegments equals the number of workers, so the job finishes much sooner. Because a large parallel scan can use all the provisioned throughput, a Limit on each request controls how much capacity each call consumes and leaves room for customer traffic.
    fr: |
      Un scan parallèle divise la table en segments logiques : chaque processus analyse un segment, identifié par Segment, et TotalSegments est égal au nombre de processus, ce qui termine la tâche bien plus tôt. Comme un grand scan parallèle peut utiliser tout le débit provisionné, un Limit sur chaque requête contrôle la capacité consommée par appel et laisse de la place au trafic client.
  options:
    a: { en: "Scan capacity depends on the number and size of the items read, not on the attributes returned, so a projection does not reduce it.", fr: "La capacité d'un Scan dépend du nombre et de la taille des éléments lus, pas des attributs renvoyés : une projection ne la réduit pas." }
    c: { en: "A filter is applied after the items are read, so a Scan consumes the same read capacity with or without it.", fr: "Un filtre s'applique après la lecture des éléments : un Scan consomme la même capacité de lecture avec ou sans filtre." }
    d: { en: "Strongly consistent scans consume twice the read capacity, which takes even more throughput away from customer traffic.", fr: "Les scans fortement cohérents consomment deux fois plus de capacité de lecture, ce qui retire encore plus de débit au trafic client." }
references:
  - title: Scanning tables in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Scan.html
