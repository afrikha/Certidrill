id: dvac03-1a-sync-payment-auth
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's checkout page must show the customer whether the card payment was authorized before it displays the order confirmation. The authorization logic runs in a Lambda function and returns in less than 2 seconds.

    Which design will meet these requirements?
  fr: |
    La page de paiement d'une entreprise doit indiquer au client si le paiement par carte a été autorisé avant d'afficher la confirmation de commande. La logique d'autorisation s'exécute dans une fonction Lambda et répond en moins de 2 secondes.

    Quelle conception répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Invoke the function synchronously through an Amazon API Gateway REST API and return its result in the HTTP response.", fr: "Invoquer la fonction de manière synchrone via une API REST Amazon API Gateway et renvoyer son résultat dans la réponse HTTP." }
    - id: b
      text: { en: "Send the payment request to an Amazon SQS queue that invokes the function through an event source mapping.", fr: "Envoyer la demande de paiement dans une file d'attente Amazon SQS qui invoque la fonction au moyen d'un mappage de source d'événements." }
    - id: c
      text: { en: "Publish the payment request to an Amazon SNS topic that has the function as a subscriber.", fr: "Publier la demande de paiement dans une rubrique Amazon SNS dont la fonction est abonnée." }
    - id: d
      text: { en: "Send the payment request to an Amazon EventBridge event bus with a rule that targets the function.", fr: "Envoyer la demande de paiement sur un bus d'événements Amazon EventBridge avec une règle qui cible la fonction." }
answer: { optionId: a }
explanation:
  correct:
    en: "The page needs the authorization result before it continues, and the result is available within seconds, so a synchronous request/response call fits. API Gateway invokes the function synchronously and returns its result to the client in the same HTTP response."
    fr: "La page a besoin du résultat de l'autorisation avant de continuer, et ce résultat est disponible en quelques secondes : un appel synchrone requête/réponse convient. API Gateway invoque la fonction de manière synchrone et renvoie son résultat au client dans la même réponse HTTP."
  options:
    b:
      en: "Sending to a queue returns only a message ID; the function's result never comes back to the page in the response."
      fr: "Envoyer dans une file d'attente ne renvoie qu'un ID de message ; le résultat de la fonction ne revient jamais à la page dans la réponse."
    c:
      en: "SNS invokes the function asynchronously, so the publisher gets a message ID, not the authorization result."
      fr: "SNS invoque la fonction de manière asynchrone : l'éditeur obtient un ID de message, pas le résultat de l'autorisation."
    d:
      en: "EventBridge invokes targets asynchronously, so the caller can't receive the authorization result in its response."
      fr: "EventBridge invoque les cibles de manière asynchrone : l'appelant ne peut pas recevoir le résultat de l'autorisation dans sa réponse."
references:
  - title: Invoking Lambda with events from other AWS services
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-services.html
