id: dvac03-1b-s3-recursive-trigger
objective: "1.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer configures an S3 event notification so that every object created in a bucket invokes an AWS Lambda function. The function creates a thumbnail of each image and uploads it to the same bucket with the key `<name>-thumb.jpg`. After deployment, the number of invocations and objects grows continuously.

    Which change will prevent this behavior?
  fr: |
    Un développeur configure une notification d'événement S3 pour que chaque objet créé dans un compartiment invoque une fonction AWS Lambda. La fonction crée une miniature de chaque image et la charge dans le même compartiment avec la clé `<name>-thumb.jpg`. Après le déploiement, le nombre d'invocations et d'objets augmente sans cesse.

    Quelle modification empêche ce comportement ?
body:
  options:
    - id: a
      text: { en: "Set the reserved concurrency of the function to 1 so that only one thumbnail is created at a time.", fr: "Définir la simultanéité réservée de la fonction sur 1 afin qu'une seule miniature soit créée à la fois." }
    - id: b
      text: { en: "Configure an on-failure destination for the function so that repeated events are discarded.", fr: "Configurer une destination en cas d'échec pour la fonction afin que les événements répétés soient écartés." }
    - id: c
      text: { en: "Change the notification to use the s3:ObjectCreated:Put event type instead of s3:ObjectCreated:*.", fr: "Modifier la notification pour utiliser le type d'événement s3:ObjectCreated:Put au lieu de s3:ObjectCreated:*." }
    - id: d
      text: { en: "Write the thumbnails to a second bucket, or limit the notification to a prefix used only for uploads.", fr: "Écrire les miniatures dans un second compartiment, ou limiter la notification à un préfixe utilisé uniquement pour les chargements." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Each thumbnail upload is itself an object-created event in the same bucket, so the function triggers itself in a loop. Amazon S3 recommends using two buckets, or applying the trigger only to a prefix used for incoming objects, so that the objects written by the function do not match the notification.
    fr: |
      Chaque chargement de miniature est lui-même un événement de création d'objet dans le même compartiment : la fonction se déclenche elle-même en boucle. Amazon S3 recommande d'utiliser deux compartiments, ou d'appliquer le déclencheur uniquement à un préfixe utilisé pour les objets entrants, afin que les objets écrits par la fonction ne correspondent pas à la notification.
  options:
    a:
      en: "Lower concurrency slows the loop down but every thumbnail still triggers a new invocation."
      fr: "Une simultanéité plus faible ralentit la boucle, mais chaque miniature déclenche toujours une nouvelle invocation."
    b:
      en: "The invocations succeed, so an on-failure destination is never used and the loop continues."
      fr: "Les invocations réussissent : une destination en cas d'échec n'est jamais utilisée et la boucle continue."
    c:
      en: "The function uploads thumbnails with PUT requests, so s3:ObjectCreated:Put events still trigger the loop."
      fr: "La fonction charge les miniatures avec des requêtes PUT : les événements s3:ObjectCreated:Put déclenchent toujours la boucle."
references:
  - title: Amazon S3 Event Notifications
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventNotifications.html
