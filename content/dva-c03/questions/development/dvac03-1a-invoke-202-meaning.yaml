id: dvac03-1a-invoke-202-meaning
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer runs the following AWS CLI command:

    ```bash
    aws lambda invoke \
      --function-name thumbnail-builder \
      --invocation-type Event \
      --cli-binary-format raw-in-base64-out \
      --payload '{"key": "photos/cat.jpg"}' response.json
    ```

    The command returns the following output:

    ```json
    {
        "StatusCode": 202
    }
    ```

    What does this response indicate?
  fr: |
    Un développeur exécute la commande AWS CLI suivante :

    ```bash
    aws lambda invoke \
      --function-name thumbnail-builder \
      --invocation-type Event \
      --cli-binary-format raw-in-base64-out \
      --payload '{"key": "photos/cat.jpg"}' response.json
    ```

    La commande renvoie la sortie suivante :

    ```json
    {
        "StatusCode": 202
    }
    ```

    Qu'indique cette réponse ?
body:
  options:
    - id: a
      text: { en: "The function ran successfully and its result is in the response.json file.", fr: "La fonction s'est exécutée avec succès et son résultat se trouve dans le fichier response.json." }
    - id: b
      text: { en: "The function was throttled, and the command must be run again later.", fr: "La fonction a été limitée (throttling), et la commande doit être relancée plus tard." }
    - id: c
      text: { en: "The function returned an error that is described in the X-Amz-Function-Error header.", fr: "La fonction a renvoyé une erreur décrite dans l'en-tête X-Amz-Function-Error." }
    - id: d
      text: { en: "Lambda queued the event; the function runs later, and its result isn't returned to the caller.", fr: "Lambda a mis l'événement en file d'attente ; la fonction s'exécute ensuite, et son résultat n'est pas renvoyé à l'appelant." }
answer: { optionId: d }
explanation:
  correct:
    en: "With the Event invocation type, Lambda adds the event to an internal queue and returns status code 202 without waiting for the function. A separate process sends the event to the function, and the response.json file contains no result."
    fr: "Avec le type d'invocation Event, Lambda ajoute l'événement à une file interne et renvoie le code d'état 202 sans attendre la fonction. Un processus distinct envoie l'événement à la fonction, et le fichier response.json ne contient aucun résultat."
  options:
    a:
      en: "A 202 status only confirms that the event was queued; the caller never receives the function's result in an asynchronous invocation."
      fr: "Un code 202 confirme seulement la mise en file de l'événement ; l'appelant ne reçoit jamais le résultat de la fonction lors d'une invocation asynchrone."
    b:
      en: "A throttled invocation returns an error (429) instead of a 202 status."
      fr: "Une invocation limitée renvoie une erreur (429) au lieu d'un code 202."
    c:
      en: "X-Amz-Function-Error accompanies synchronous invocations that end in a function error; an asynchronous call doesn't report the function's outcome."
      fr: "X-Amz-Function-Error accompagne les invocations synchrones terminées par une erreur de fonction ; un appel asynchrone ne signale pas le résultat de la fonction."
references:
  - title: Invoking a Lambda Event Function asynchronously
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async.html
