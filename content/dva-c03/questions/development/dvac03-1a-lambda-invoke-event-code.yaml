id: dvac03-1a-lambda-invoke-event-code
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Python application calls a Lambda function named audit-writer for each request:

    ```python
    import json
    import boto3

    lambda_client = boto3.client("lambda")

    def record_audit(event):
        lambda_client.invoke(
            FunctionName="audit-writer",
            InvocationType="RequestResponse",
            Payload=json.dumps(event),
        )
    ```

    The application waits for audit-writer to finish, which adds latency, but it never uses the result. The audit-writer function must still run once for each call.

    Which change will meet these requirements?
  fr: |
    Une application Python appelle une fonction Lambda nommée audit-writer pour chaque requête :

    ```python
    import json
    import boto3

    lambda_client = boto3.client("lambda")

    def record_audit(event):
        lambda_client.invoke(
            FunctionName="audit-writer",
            InvocationType="RequestResponse",
            Payload=json.dumps(event),
        )
    ```

    L'application attend la fin d'audit-writer, ce qui ajoute de la latence, alors qu'elle n'utilise jamais le résultat. La fonction audit-writer doit toujours s'exécuter une fois pour chaque appel.

    Quelle modification répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set `InvocationType` to `\"DryRun\"`.", fr: "Définir `InvocationType` sur `\"DryRun\"`." }
    - id: b
      text: { en: "Set `InvocationType` to `\"Event\"`.", fr: "Définir `InvocationType` sur `\"Event\"`." }
    - id: c
      text: { en: "Add `LogType=\"Tail\"` to the `invoke` call.", fr: "Ajouter `LogType=\"Tail\"` à l'appel `invoke`." }
    - id: d
      text: { en: "Set a 1-second read timeout on the Lambda client and ignore the timeout errors.", fr: "Définir un délai de lecture de 1 seconde sur le client Lambda et ignorer les erreurs d'expiration." }
answer: { optionId: b }
explanation:
  correct:
    en: "With InvocationType set to Event, Lambda places the event in its internal queue and returns a 202 status code right away; the function runs later and the caller doesn't receive its result. Lambda handles retries of failed asynchronous invocations."
    fr: "Avec InvocationType défini sur Event, Lambda place l'événement dans sa file interne et renvoie immédiatement un code d'état 202 ; la fonction s'exécute ensuite et l'appelant ne reçoit pas son résultat. Lambda gère les nouvelles tentatives des invocations asynchrones en échec."
  options:
    a:
      en: "DryRun only checks the parameters and the caller's permissions; the function doesn't run."
      fr: "DryRun vérifie seulement les paramètres et les autorisations de l'appelant ; la fonction ne s'exécute pas."
    c:
      en: "LogType Tail returns the end of the execution log in a synchronous response; the caller still waits."
      fr: "LogType Tail renvoie la fin du journal d'exécution dans une réponse synchrone ; l'appelant attend toujours."
    d:
      en: "A read timeout makes the SDK treat the call as a transient failure and retry it, which can run the function more than once while errors are hidden."
      fr: "Un délai de lecture fait traiter l'appel comme un échec transitoire par le SDK, qui le relance : la fonction peut s'exécuter plusieurs fois, et les erreurs sont masquées."
references:
  - title: Invoking a Lambda Event Function asynchronously
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async.html
