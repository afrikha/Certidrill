id: dvac03-1c-vpc-cfn-vpcconfig
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer defines an AWS Lambda function in an AWS CloudFormation template. The function must be connected to two private subnets and one security group of an existing VPC.

    ```yaml
    OrdersFunction:
      Type: AWS::Lambda::Function
      Properties:
        Runtime: python3.13
        Handler: app.handler
        Role: !GetAtt OrdersRole.Arn
        Code:
          S3Bucket: example-artifacts
          S3Key: orders.zip
        # VPC settings go here
    ```

    Which property must the developer add to the function resource?
  fr: |
    Un développeur définit une fonction AWS Lambda dans un modèle AWS CloudFormation. La fonction doit être connectée à deux sous-réseaux privés et à un groupe de sécurité d'un VPC existant.

    ```yaml
    OrdersFunction:
      Type: AWS::Lambda::Function
      Properties:
        Runtime: python3.13
        Handler: app.handler
        Role: !GetAtt OrdersRole.Arn
        Code:
          S3Bucket: example-artifacts
          S3Key: orders.zip
        # VPC settings go here
    ```

    Quelle propriété le développeur doit-il ajouter à la ressource de la fonction ?
body:
  options:
    - { id: a, text: { en: "`VpcConfig` with `VpcId` and `SubnetIds`", fr: "`VpcConfig` avec `VpcId` et `SubnetIds`" } }
    - { id: b, text: { en: "`NetworkConfiguration` with `Subnets` and `SecurityGroups`", fr: "`NetworkConfiguration` avec `Subnets` et `SecurityGroups`" } }
    - { id: c, text: { en: "`VpcConfig` with `SubnetIds` and `SecurityGroupIds`", fr: "`VpcConfig` avec `SubnetIds` et `SecurityGroupIds`" } }
    - { id: d, text: { en: "`VpcConfig` with `VpcId` and `SecurityGroupIds`", fr: "`VpcConfig` avec `VpcId` et `SecurityGroupIds`" } }
answer: { optionId: c }
explanation:
  correct:
    en: "The VpcConfig property of AWS::Lambda::Function takes SubnetIds and SecurityGroupIds, plus the optional Ipv6AllowedForDualStack. There is no VPC ID property: Lambda derives the VPC from the subnets and security groups."
    fr: "La propriété VpcConfig d'AWS::Lambda::Function prend SubnetIds et SecurityGroupIds, ainsi que la propriété facultative Ipv6AllowedForDualStack. Il n'existe pas de propriété d'ID de VPC : Lambda déduit le VPC des sous-réseaux et des groupes de sécurité."
  options:
    a:
      en: "VpcConfig has no VpcId property, and a security group is needed for the function's network interfaces."
      fr: "VpcConfig n'a pas de propriété VpcId, et un groupe de sécurité est nécessaire pour les interfaces réseau de la fonction."
    b:
      en: "NetworkConfiguration is the syntax of other services, such as Amazon ECS services; Lambda functions use VpcConfig."
      fr: "NetworkConfiguration est la syntaxe d'autres services, comme les services Amazon ECS ; les fonctions Lambda utilisent VpcConfig."
    d:
      en: "VpcConfig has no VpcId property, and the subnets must be listed in SubnetIds."
      fr: "VpcConfig n'a pas de propriété VpcId, et les sous-réseaux doivent être listés dans SubnetIds."
references:
  - title: AWS::Lambda::Function VpcConfig
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-lambda-function-vpcconfig.html
