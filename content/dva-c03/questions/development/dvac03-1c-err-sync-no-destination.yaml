id: dvac03-1c-err-sync-no-destination
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Amazon API Gateway REST API uses a Lambda proxy integration to invoke an AWS Lambda function. A developer configured an Amazon SQS queue as an on-failure destination of the function. When the function throws errors during API requests, no records arrive in the queue. The team needs a record of each failed request in the queue.

    Which solution will meet these requirements?
  fr: |
    Une API REST Amazon API Gateway utilise une intégration proxy Lambda pour appeler une fonction AWS Lambda. Un développeur a configuré une file d'attente Amazon SQS comme destination en cas d'échec de la fonction. Lorsque la fonction lève des erreurs pendant les requêtes d'API, aucun enregistrement n'arrive dans la file d'attente. L'équipe a besoin d'un enregistrement de chaque requête en échec dans la file d'attente.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Allow sqs:SendMessage on the queue in the function's execution role so that Lambda can deliver the records.", fr: "Autoriser sqs:SendMessage sur la file d'attente dans le rôle d'exécution de la fonction afin que Lambda puisse livrer les enregistrements." } }
    - { id: b, text: { en: "Configure the queue as the dead-letter queue of the function instead of as an on-failure destination.", fr: "Configurer la file d'attente comme file d'attente de lettres mortes (DLQ) de la fonction au lieu d'une destination en cas d'échec." } }
    - { id: c, text: { en: "Catch the errors in the function code, send the request details to the queue, and then return an error response.", fr: "Intercepter les erreurs dans le code de la fonction, envoyer les détails de la requête à la file d'attente, puis renvoyer une réponse d'erreur." } }
    - { id: d, text: { en: "Set MaximumRetryAttempts to 2 in the asynchronous invocation configuration so that failed requests reach the destination.", fr: "Définir MaximumRetryAttempts à 2 dans la configuration d'appel asynchrone afin que les requêtes en échec atteignent la destination." } }
answer: { optionId: c }
explanation:
  correct:
    en: "API Gateway invokes the function synchronously and receives the error directly. Destinations and dead-letter queues are used only for asynchronous invocations and for some event source mappings, so the function code must send the failure record itself."
    fr: "API Gateway appelle la fonction de manière synchrone et reçoit l'erreur directement. Les destinations et les files d'attente de lettres mortes ne sont utilisées que pour les appels asynchrones et pour certains mappages de source d'événements : le code de la fonction doit envoyer lui-même l'enregistrement d'échec."
  options:
    a:
      en: "The permission is needed to deliver destination records, but Lambda never sends destination records for synchronous invocations."
      fr: "L'autorisation est nécessaire pour livrer les enregistrements de destination, mais Lambda n'envoie jamais d'enregistrements de destination pour les appels synchrones."
    b:
      en: "A dead-letter queue also applies only to asynchronous invocations."
      fr: "Une file d'attente de lettres mortes ne s'applique, elle aussi, qu'aux appels asynchrones."
    d:
      en: "Asynchronous retry settings have no effect on synchronous invocations; Lambda does not retry them."
      fr: "Les paramètres de nouvelle tentative asynchrone n'ont aucun effet sur les appels synchrones ; Lambda ne les relance pas."
references:
  - title: Capturing records of Lambda asynchronous invocations
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-retain-records.html
  - title: Lambda proxy integrations in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-lambda-proxy-integrations.html
