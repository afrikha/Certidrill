id: dvac03-1b-s3-event-key-encoding
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function is invoked by Amazon S3 event notifications when users upload photos. The function reads `record["s3"]["object"]["key"]` from each event record and passes it to `get_object`. Uploads such as `summer trip.jpg` and `café.png` fail with `NoSuchKey` errors, while names without spaces or special characters work.

    Which change will fix the function?
  fr: |
    Une fonction AWS Lambda est invoquée par des notifications d'événements Amazon S3 quand des utilisateurs chargent des photos. La fonction lit `record["s3"]["object"]["key"]` dans chaque enregistrement d'événement et le transmet à `get_object`. Les chargements comme `summer trip.jpg` et `café.png` échouent avec des erreurs `NoSuchKey`, alors que les noms sans espaces ni caractères spéciaux fonctionnent.

    Quelle modification corrige la fonction ?
body:
  options:
    - id: a
      text: { en: "Decode the key with urllib.parse.unquote_plus before calling get_object.", fr: "Décoder la clé avec urllib.parse.unquote_plus avant d'appeler get_object." }
    - id: b
      text: { en: "Encode the key with urllib.parse.quote before calling get_object.", fr: "Encoder la clé avec urllib.parse.quote avant d'appeler get_object." }
    - id: c
      text: { en: "Decode the key with base64.b64decode before calling get_object.", fr: "Décoder la clé avec base64.b64decode avant d'appeler get_object." }
    - id: d
      text: { en: "Wait for the s3:TestEvent message before reading the key of each record.", fr: "Attendre le message s3:TestEvent avant de lire la clé de chaque enregistrement." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      In S3 event notification messages, the object key name is URL encoded: a space becomes a plus sign and special characters are percent-encoded. unquote_plus restores the original key (summer+trip.jpg becomes summer trip.jpg), so get_object finds the object.
    fr: |
      Dans les messages de notification d'événements S3, le nom de clé de l'objet est encodé en URL : un espace devient un signe plus, et les caractères spéciaux sont encodés en pourcentage. unquote_plus rétablit la clé d'origine (summer+trip.jpg devient summer trip.jpg) : get_object trouve l'objet.
  options:
    b:
      en: "The key is already URL encoded; encoding it again produces a key that does not exist."
      fr: "La clé est déjà encodée en URL ; l'encoder de nouveau produit une clé qui n'existe pas."
    c:
      en: "The key is URL encoded, not base64 encoded, so base64 decoding fails or returns meaningless bytes."
      fr: "La clé est encodée en URL, pas en base64 : le décodage base64 échoue ou renvoie des octets sans signification."
    d:
      en: "S3 sends the test event once when the notification is configured; it does not change the encoding of later event keys."
      fr: "S3 envoie l'événement de test une seule fois, lors de la configuration de la notification ; il ne change pas l'encodage des clés des événements suivants."
references:
  - title: Event message structure
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/notification-content-structure.html
