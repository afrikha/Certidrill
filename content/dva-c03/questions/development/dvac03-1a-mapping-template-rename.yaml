id: dvac03-1a-mapping-template-rename
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company puts an Amazon API Gateway REST API in front of a legacy HTTP backend. Clients send bodies such as `{"customerName": "Ana", "total": 12.5}`, but the backend expects `{"name": "Ana", "amount": 12.5}`. The clients and the backend can't be changed. The company wants API Gateway to convert the body without adding compute resources.

    Which solution will meet these requirements?
  fr: |
    Une entreprise place une API REST Amazon API Gateway devant un backend HTTP existant. Les clients envoient des corps comme `{"customerName": "Ana", "total": 12.5}`, mais le backend attend `{"name": "Ana", "amount": 12.5}`. Ni les clients ni le backend ne peuvent être modifiés. L'entreprise veut qu'API Gateway convertisse le corps sans ajouter de ressources de calcul.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use an HTTP (non-proxy) integration with a mapping template that builds the expected body.", fr: "Utiliser une intégration HTTP (sans proxy) avec un modèle de mappage qui construit le corps attendu." }
    - id: b
      text: { en: "Use an HTTP proxy integration so that API Gateway sends the body to the backend unchanged.", fr: "Utiliser une intégration de proxy HTTP pour qu'API Gateway envoie le corps au backend sans modification." }
    - id: c
      text: { en: "Use a Lambda proxy integration with a function that renames the fields and calls the backend.", fr: "Utiliser une intégration de proxy Lambda avec une fonction qui renomme les champs et appelle le backend." }
    - id: d
      text: { en: "Move to an HTTP API and use parameter mappings that rename the fields of the request body.", fr: "Passer à une API HTTP et utiliser des mappages de paramètres qui renomment les champs du corps de la requête." }
answer: { optionId: a }
explanation:
  correct:
    en: "Mapping templates, written in Velocity Template Language (VTL), transform the integration request of a non-proxy integration. A template such as `{\"name\": $input.json('$.customerName'), \"amount\": $input.json('$.total')}` builds the body that the backend expects, without any compute resource."
    fr: "Les modèles de mappage, écrits en Velocity Template Language (VTL), transforment la demande d'intégration d'une intégration sans proxy. Un modèle comme `{\"name\": $input.json('$.customerName'), \"amount\": $input.json('$.total')}` construit le corps attendu par le backend, sans aucune ressource de calcul."
  options:
    b:
      en: "A proxy integration passes the request through as it is, so the backend still receives the wrong field names."
      fr: "Une intégration de proxy transmet la requête telle quelle : le backend reçoit toujours les mauvais noms de champs."
    c:
      en: "A Lambda function works but adds a compute resource, which the company wants to avoid."
      fr: "Une fonction Lambda fonctionne mais ajoute une ressource de calcul, ce que l'entreprise veut éviter."
    d:
      en: "HTTP APIs transform request parameters but don't support request body transformation."
      fr: "Les API HTTP transforment les paramètres de requête mais ne prennent pas en charge la transformation du corps de la requête."
references:
  - title: Mapping template transformations for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/models-mappings.html
  - title: Choose between REST APIs and HTTP APIs
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-vs-rest.html
