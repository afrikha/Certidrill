id: dvac03-1c-cfg-secrets-extension
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A Python AWS Lambda function that is not connected to a VPC calls the AWS Secrets Manager GetSecretValue API on every invocation. The calls add latency and API costs. The team wants to cache the secret by using the AWS Parameters and Secrets Lambda Extension instead of writing caching code. The execution role already allows secretsmanager:GetSecretValue on the secret.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une fonction AWS Lambda en Python non connectée à un VPC appelle l'API GetSecretValue d'AWS Secrets Manager à chaque appel. Ces appels ajoutent de la latence et des coûts d'API. L'équipe souhaite mettre le secret en cache à l'aide de l'extension AWS Parameters and Secrets Lambda Extension au lieu d'écrire du code de cache. Le rôle d'exécution autorise déjà secretsmanager:GetSecretValue sur le secret.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a rule to the function's security group that allows inbound traffic on TCP port 2773 from the extension.", fr: "Ajouter au groupe de sécurité de la fonction une règle qui autorise le trafic entrant sur le port TCP 2773 depuis l'extension." } }
    - { id: b, text: { en: "Add the AWS Parameters and Secrets Lambda Extension layer to the function.", fr: "Ajouter la couche (layer) AWS Parameters and Secrets Lambda Extension à la fonction." } }
    - { id: c, text: { en: "Set the AWS_SESSION_TOKEN environment variable in the function configuration so that the extension can authenticate.", fr: "Définir la variable d'environnement AWS_SESSION_TOKEN dans la configuration de la fonction afin que l'extension puisse s'authentifier." } }
    - { id: d, text: { en: "Create an interface VPC endpoint for Lambda so that the function can reach the extension.", fr: "Créer un point de terminaison de VPC de type interface pour Lambda afin que la fonction atteigne l'extension." } }
    - { id: e, text: { en: "Call the extension's localhost endpoint with an X-Aws-Parameters-Secrets-Token header set to the function's session token.", fr: "Appeler le point de terminaison localhost de l'extension avec un en-tête X-Aws-Parameters-Secrets-Token défini sur le jeton de session de la fonction." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "The extension is added to the function as a layer and serves secrets and parameters on a local HTTP endpoint (port 2773 by default), with a cache whose TTL defaults to 300 seconds. Each request must carry the X-Aws-Parameters-Secrets-Token header with the function's session token, which the docs recommend reading from the SDK credential provider chain."
    fr: "L'extension est ajoutée à la fonction sous forme de couche et sert les secrets et paramètres sur un point de terminaison HTTP local (port 2773 par défaut), avec un cache dont la durée de vie (TTL) est de 300 secondes par défaut. Chaque requête doit porter l'en-tête X-Aws-Parameters-Secrets-Token avec le jeton de session de la fonction, que la documentation recommande de lire à partir de la chaîne de fournisseurs d'identifiants du SDK."
  options:
    a:
      en: "The function calls the extension on localhost inside its own execution environment, so no security group rule is involved."
      fr: "La fonction appelle l'extension sur localhost à l'intérieur de son propre environnement d'exécution : aucune règle de groupe de sécurité n'intervient."
    c:
      en: "AWS_SESSION_TOKEN is a reserved variable that Lambda manages; it cannot be set in the function configuration."
      fr: "AWS_SESSION_TOKEN est une variable réservée gérée par Lambda ; elle ne peut pas être définie dans la configuration de la fonction."
    d:
      en: "The function is not in a VPC, and an interface endpoint for Lambda is for calling the Lambda API, not a local extension."
      fr: "La fonction n'est pas dans un VPC, et un point de terminaison de type interface pour Lambda sert à appeler l'API Lambda, pas une extension locale."
references:
  - title: Using Parameter Store parameters in AWS Lambda functions
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/ps-integration-lambda-extensions.html
  - title: Working with Lambda environment variables
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-envvars.html
