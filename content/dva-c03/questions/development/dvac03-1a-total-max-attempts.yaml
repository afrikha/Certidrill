id: dvac03-1a-total-max-attempts
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer configures a boto3 client as follows. The developer expects at most 2 requests for each API call, including the first request.

    ```python
    import boto3
    from botocore.config import Config

    config = Config(retries={"max_attempts": 2, "mode": "standard"})
    s3 = boto3.client("s3", config=config)
    ```

    The DEBUG logs show that some calls are sent 3 times.

    Which change will limit each call to 2 requests in total?
  fr: |
    Un développeur configure un client boto3 comme suit. Il s'attend à au plus 2 requêtes pour chaque appel d'API, première requête comprise.

    ```python
    import boto3
    from botocore.config import Config

    config = Config(retries={"max_attempts": 2, "mode": "standard"})
    s3 = boto3.client("s3", config=config)
    ```

    Les journaux DEBUG montrent que certains appels sont envoyés 3 fois.

    Quelle modification limitera chaque appel à 2 requêtes au total ?
body:
  options:
    - id: a
      text: { en: "Set `\"mode\"` to `\"adaptive\"` and keep `\"max_attempts\": 2`.", fr: "Définir `\"mode\"` sur `\"adaptive\"` et conserver `\"max_attempts\": 2`." }
    - id: b
      text: { en: "Set the `AWS_RETRY_MODE` environment variable to `legacy`.", fr: "Définir la variable d'environnement `AWS_RETRY_MODE` sur `legacy`." }
    - id: c
      text: { en: "Replace `\"max_attempts\": 2` with `\"total_max_attempts\": 2`.", fr: "Remplacer `\"max_attempts\": 2` par `\"total_max_attempts\": 2`." }
    - id: d
      text: { en: "Replace `\"max_attempts\": 2` with `\"max_attempts\": 3`.", fr: "Remplacer `\"max_attempts\": 2` par `\"max_attempts\": 3`." }
answer: { optionId: c }
explanation:
  correct:
    en: "In a botocore Config object, max_attempts counts only the retries, so a value of 2 allows the first request plus 2 retries. total_max_attempts always counts every request, including the first one, so a value of 2 gives at most 2 requests. AWS_MAX_ATTEMPTS and the config file setting, by contrast, include the first request."
    fr: "Dans un objet Config de botocore, max_attempts ne compte que les nouvelles tentatives : une valeur de 2 autorise la première requête plus 2 nouvelles tentatives. total_max_attempts compte toujours toutes les requêtes, première comprise : une valeur de 2 donne au plus 2 requêtes. À l'inverse, AWS_MAX_ATTEMPTS et le paramètre du fichier de configuration incluent la première requête."
  options:
    a:
      en: "Adaptive mode adds client-side rate limiting but counts max_attempts the same way, so calls can still be sent 3 times."
      fr: "Le mode adaptive ajoute une limitation de débit côté client mais compte max_attempts de la même façon : les appels peuvent toujours être envoyés 3 fois."
    b:
      en: "Settings in a Config object take precedence over environment variables, and legacy mode doesn't change how this value is counted."
      fr: "Les paramètres d'un objet Config sont prioritaires sur les variables d'environnement, et le mode legacy ne change pas la façon de compter cette valeur."
    d:
      en: "A max_attempts of 3 in Config allows 3 retries, so up to 4 requests in total."
      fr: "Un max_attempts de 3 dans Config autorise 3 nouvelles tentatives, soit jusqu'à 4 requêtes au total."
references:
  - title: Retries
    url: https://docs.aws.amazon.com/boto3/latest/guide/retries.html
