id: dvac03-1a-websocket-push-result
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's browser application submits analysis jobs that take 2–10 minutes to run on AWS Lambda. Users must see each result as soon as it is ready. The company wants to stop the browser from polling a status endpoint, and the browser must not hold AWS credentials.

    Which solution will meet these requirements?
  fr: |
    L'application navigateur d'une entreprise soumet des tâches d'analyse qui s'exécutent en 2 à 10 minutes sur AWS Lambda. Les utilisateurs doivent voir chaque résultat dès qu'il est prêt. L'entreprise veut que le navigateur cesse d'interroger un point de terminaison d'état, et le navigateur ne doit détenir aucune information d'identification AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use an Amazon API Gateway WebSocket API, store each connection ID, and have the job send the result through the @connections API.", fr: "Utiliser une API WebSocket Amazon API Gateway, stocker chaque ID de connexion et faire envoyer le résultat par la tâche via l'API @connections." }
    - id: b
      text: { en: "Have the job send each result to an Amazon SQS queue that the browser reads with long polling.", fr: "Faire envoyer chaque résultat par la tâche dans une file d'attente Amazon SQS que le navigateur lit avec l'attente active de longue durée." }
    - id: c
      text: { en: "Use an Amazon API Gateway HTTP API and have the browser call a status route every second until the result is ready.", fr: "Utiliser une API HTTP Amazon API Gateway et faire appeler une route d'état par le navigateur chaque seconde jusqu'à ce que le résultat soit prêt." }
    - id: d
      text: { en: "Publish each result to an Amazon SNS topic and subscribe each browser to the topic over HTTPS.", fr: "Publier chaque résultat dans une rubrique Amazon SNS et abonner chaque navigateur à la rubrique en HTTPS." }
answer: { optionId: a }
explanation:
  correct:
    en: "A WebSocket API keeps a two-way connection open with each client. When a job finishes, the backend posts the result to the client's connection by using the @connections API (PostToConnection in the API Gateway Management API), so the result is pushed without polling."
    fr: "Une API WebSocket maintient une connexion bidirectionnelle ouverte avec chaque client. Quand une tâche se termine, le backend publie le résultat sur la connexion du client à l'aide de l'API @connections (PostToConnection de l'API API Gateway Management API) : le résultat est poussé sans interrogation."
  options:
    b:
      en: "Reading a queue is still polling, and the browser would need AWS credentials to call SQS."
      fr: "Lire une file d'attente reste de l'interrogation, et le navigateur aurait besoin d'informations d'identification AWS pour appeler SQS."
    c:
      en: "Calling a status route every second is the polling that the company wants to stop."
      fr: "Appeler une route d'état chaque seconde est précisément l'interrogation que l'entreprise veut arrêter."
    d:
      en: "An HTTPS subscription needs a public endpoint that confirms the subscription and accepts POST requests; a browser page can't be such an endpoint."
      fr: "Un abonnement HTTPS exige un point de terminaison public qui confirme l'abonnement et accepte des requêtes POST ; une page de navigateur ne peut pas être un tel point de terminaison."
references:
  - title: Use @connections commands in your backend service
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-how-to-call-websocket-api-connections.html
