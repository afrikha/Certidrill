id: dvac03-1c-err-recursive-loop
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Users upload photos to the incoming/ prefix of an Amazon S3 bucket. An S3 event notification for all object-created events in the bucket invokes an AWS Lambda function, which writes a thumbnail of each photo to the thumbnails/ prefix of the same bucket. The RecursiveInvocationsDropped metric of the function is increasing. The thumbnails must still be generated for every upload.

    Which solution will meet these requirements?
  fr: |
    Des utilisateurs chargent des photos sous le préfixe incoming/ d'un compartiment Amazon S3. Une notification d'événement S3 pour tous les événements de création d'objet du compartiment appelle une fonction AWS Lambda, qui écrit une miniature de chaque photo sous le préfixe thumbnails/ du même compartiment. La métrique RecursiveInvocationsDropped de la fonction augmente. Les miniatures doivent toujours être générées pour chaque chargement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the recursive loop configuration of the function to Allow.", fr: "Définir la configuration de boucle récursive de la fonction sur Allow." } }
    - { id: b, text: { en: "Configure a dead-letter queue for the function to capture the dropped invocations.", fr: "Configurer une file d'attente de lettres mortes pour la fonction afin de capturer les appels abandonnés." } }
    - { id: c, text: { en: "Set the reserved concurrency of the function to 1 to slow down the invocations.", fr: "Définir la simultanéité réservée de la fonction à 1 pour ralentir les appels." } }
    - { id: d, text: { en: "Add a prefix filter of incoming/ to the S3 event notification.", fr: "Ajouter un filtre de préfixe incoming/ à la notification d'événement S3." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Each thumbnail write creates an object that triggers the function again, which forms a recursive loop. Lambda detects such loops with Amazon S3 and stops the chain after about 16 invocations, counting them in RecursiveInvocationsDropped. Filtering the notification on incoming/ keeps the uploads as triggers and stops the thumbnails from invoking the function."
    fr: "Chaque écriture de miniature crée un objet qui déclenche de nouveau la fonction, ce qui forme une boucle récursive. Lambda détecte ces boucles avec Amazon S3 et arrête la chaîne après environ 16 appels, en les comptant dans RecursiveInvocationsDropped. Filtrer la notification sur incoming/ garde les chargements comme déclencheurs et empêche les miniatures d'appeler la fonction."
  options:
    a:
      en: "Allow turns off loop detection, so the loop runs without limit and keeps creating objects and invocations."
      fr: "Allow désactive la détection des boucles : la boucle s'exécute sans limite et continue de créer des objets et des appels."
    b:
      en: "A dead-letter queue would receive the stopped events but does not remove the loop."
      fr: "Une file d'attente de lettres mortes recevrait les événements arrêtés, mais ne supprime pas la boucle."
    c:
      en: "Throttling the function slows the loop and delays the uploads, but every thumbnail still triggers another invocation."
      fr: "Limiter la fonction ralentit la boucle et retarde les chargements, mais chaque miniature déclenche toujours un nouvel appel."
references:
  - title: Use Lambda recursive loop detection to prevent infinite loops
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-recursion.html
