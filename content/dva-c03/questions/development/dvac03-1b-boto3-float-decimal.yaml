id: dvac03-1b-boto3-float-decimal
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer uses the Boto3 resource interface to save products from a JSON file to an Amazon DynamoDB table. The `put_item` call fails with a `TypeError` that says that float types are not supported.

    ```python
    import json
    import boto3

    table = boto3.resource("dynamodb").Table("Products")
    with open("products.json") as f:
        for product in json.load(f):
            table.put_item(Item=product)  # {"sku": "A1", "price": 19.99}
    ```

    Which change will fix the error?
  fr: |
    Un développeur utilise l'interface de ressource de Boto3 pour enregistrer des produits provenant d'un fichier JSON dans une table Amazon DynamoDB. L'appel `put_item` échoue avec une `TypeError` qui indique que les types float ne sont pas pris en charge.

    ```python
    import json
    import boto3

    table = boto3.resource("dynamodb").Table("Products")
    with open("products.json") as f:
        for product in json.load(f):
            table.put_item(Item=product)  # {"sku": "A1", "price": 19.99}
    ```

    Quelle modification corrige l'erreur ?
body:
  options:
    - { id: a, text: "`json.load(f, parse_int=float)`" }
    - { id: b, text: "`json.load(f, parse_float=decimal.Decimal)`" }
    - { id: c, text: "`table.put_item(Item=json.dumps(product))`" }
    - { id: d, text: "`json.load(f, parse_float=str)`" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Boto3 resource interface maps Python int and decimal.Decimal values to the DynamoDB Number (N) type, but Python float is not a valid type. Parsing the JSON numbers with parse_float=decimal.Decimal (after `import decimal`) keeps the prices as numbers with exact precision.
    fr: |
      L'interface de ressource de Boto3 associe les valeurs Python int et decimal.Decimal au type Number (N) de DynamoDB, mais le type Python float n'est pas valide. Analyser les nombres JSON avec parse_float=decimal.Decimal (après `import decimal`) conserve les prix comme des nombres avec une précision exacte.
  options:
    a:
      en: "Converting integers to float adds more float values, so the same TypeError occurs for more attributes."
      fr: "Convertir les entiers en float ajoute davantage de valeurs float : la même TypeError se produit pour davantage d'attributs."
    c:
      en: "Item must be a dict of attribute names and values; a JSON string is not a valid item."
      fr: "Item doit être un dict de noms et de valeurs d'attributs ; une chaîne JSON n'est pas un élément valide."
    d:
      en: "Prices parsed as strings are stored with the String (S) type, so numeric comparisons and updates no longer work on them."
      fr: "Des prix analysés comme des chaînes sont stockés avec le type String (S) : les comparaisons et mises à jour numériques ne fonctionnent plus sur eux."
references:
  - title: DynamoDB customization reference
    url: https://docs.aws.amazon.com/boto3/latest/reference/customizations/dynamodb.html
