id: dvac03-1b-kds-putrecords-partial-failure
objective: "1.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A developer writes a Python producer that sends batches of 500 sensor readings to an Amazon Kinesis data stream with the `put_records` method of Boto3. During peaks, some readings never reach the stream, although the call does not raise an exception. The developer must make sure that every reading is written without sending duplicates of readings that were already accepted.

    Which combination of changes will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un développeur écrit un producteur Python qui envoie des lots de 500 relevés de capteurs à un flux de données Amazon Kinesis avec la méthode `put_records` de Boto3. Pendant les pics, certains relevés n'arrivent jamais dans le flux, bien que l'appel ne lève pas d'exception. Le développeur doit s'assurer que chaque relevé est écrit sans envoyer de doublons des relevés déjà acceptés.

    Quelle combinaison de modifications répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Check FailedRecordCount in the response and resend only the entries whose result contains an ErrorCode.", fr: "Vérifier FailedRecordCount dans la réponse et renvoyer uniquement les entrées dont le résultat contient un ErrorCode." } }
    - { id: b, text: { en: "Resend the complete batch of 500 records whenever FailedRecordCount is greater than zero.", fr: "Renvoyer le lot complet de 500 enregistrements chaque fois que FailedRecordCount est supérieur à zéro." } }
    - { id: c, text: { en: "Wait with an exponential backoff and jitter between retries of throttled entries.", fr: "Attendre avec un backoff exponentiel et une gigue (jitter) entre les nouvelles tentatives des entrées limitées." } }
    - { id: d, text: { en: "Set the same ExplicitHashKey on all records so that the batch goes to a single shard.", fr: "Définir le même ExplicitHashKey sur tous les enregistrements afin que le lot aille dans une seule partition (shard)." } }
    - { id: e, text: { en: "Increase the retention period of the stream to 7 days.", fr: "Porter la période de conservation du flux à 7 jours." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      PutRecords processes every entry of the request and returns HTTP 200 even when some entries fail. The response gives FailedRecordCount and a result per entry in request order, and failed entries carry an ErrorCode such as ProvisionedThroughputExceededException instead of a sequence number. Resending only those entries, with exponential backoff and jitter so that throttled shards can recover, writes every reading without duplicating accepted ones.
    fr: |
      PutRecords traite chaque entrée de la requête et renvoie HTTP 200 même si certaines entrées échouent. La réponse indique FailedRecordCount et un résultat par entrée, dans l'ordre de la requête ; les entrées en échec portent un ErrorCode, comme ProvisionedThroughputExceededException, au lieu d'un numéro de séquence. Renvoyer uniquement ces entrées, avec un backoff exponentiel et une gigue pour laisser les partitions limitées récupérer, écrit chaque relevé sans dupliquer ceux qui ont été acceptés.
  options:
    b:
      en: "The successful entries of the batch were already written, so resending the whole batch creates duplicates."
      fr: "Les entrées réussies du lot ont déjà été écrites : renvoyer tout le lot crée des doublons."
    d:
      en: "Sending all records to one shard concentrates the load and causes more throttling."
      fr: "Envoyer tous les enregistrements vers une seule partition concentre la charge et provoque davantage de limitations."
    e:
      en: "Retention controls how long accepted records stay in the stream; rejected records were never written."
      fr: "La conservation détermine combien de temps les enregistrements acceptés restent dans le flux ; les enregistrements rejetés n'ont jamais été écrits."
references:
  - title: PutRecords
    url: https://docs.aws.amazon.com/kinesis/latest/APIReference/API_PutRecords.html
  - title: Troubleshoot Amazon Kinesis Data Streams producers
    url: https://docs.aws.amazon.com/streams/latest/dev/troubleshooting-producers.html
