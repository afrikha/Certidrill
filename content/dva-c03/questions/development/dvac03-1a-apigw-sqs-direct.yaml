id: dvac03-1a-apigw-sqs-direct
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company ingests telemetry through an Amazon API Gateway REST API. A Lambda function behind the API only writes each request body to an Amazon SQS queue, and other consumers process the queue. During bursts, the function reaches its concurrency limit and requests fail. The company wants to accept the requests asynchronously, remove the Lambda function from the request path, and keep the REST API.

    Which solution will meet these requirements?
  fr: |
    Une entreprise ingère de la télémétrie via une API REST Amazon API Gateway. Une fonction Lambda derrière l'API se contente d'écrire le corps de chaque requête dans une file d'attente Amazon SQS, et d'autres consommateurs traitent la file. Lors des pics, la fonction atteint sa limite de simultanéité et des requêtes échouent. L'entreprise veut accepter les requêtes de manière asynchrone, retirer la fonction Lambda du chemin des requêtes et conserver l'API REST.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an HTTP proxy integration to the queue URL so that API Gateway forwards each request body unchanged.", fr: "Créer une intégration de proxy HTTP vers l'URL de la file pour qu'API Gateway transmette chaque corps de requête sans modification." }
    - id: b
      text: { en: "Create an AWS service integration for SQS SendMessage with an IAM role, a form-urlencoded Content-Type and a mapping template.", fr: "Créer une intégration de service AWS pour SQS SendMessage avec un rôle IAM, un Content-Type form-urlencoded et un modèle de mappage." }
    - id: c
      text: { en: "Keep the Lambda integration and add an X-Amz-Invocation-Type header with the value 'Event' to the integration request.", fr: "Conserver l'intégration Lambda et ajouter à la demande d'intégration un en-tête X-Amz-Invocation-Type avec la valeur 'Event'." }
    - id: d
      text: { en: "Keep the Lambda integration and configure provisioned concurrency that matches the peak request rate.", fr: "Conserver l'intégration Lambda et configurer une simultanéité provisionnée correspondant au débit de requêtes de pointe." }
answer: { optionId: b }
explanation:
  correct:
    en: "An AWS service integration lets the REST API call SQS SendMessage directly, with a path override of account ID and queue name and an execution role that allows sqs:SendMessage. The integration request sets Content-Type to application/x-www-form-urlencoded, and a mapping template such as Action=SendMessage&MessageBody=$util.urlEncode($input.body) builds the SQS request."
    fr: "Une intégration de service AWS permet à l'API REST d'appeler directement SQS SendMessage, avec un remplacement de chemin composé de l'ID de compte et du nom de la file, et un rôle d'exécution qui autorise sqs:SendMessage. La demande d'intégration définit Content-Type sur application/x-www-form-urlencoded, et un modèle de mappage comme Action=SendMessage&MessageBody=$util.urlEncode($input.body) construit la requête SQS."
  options:
    a:
      en: "An HTTP proxy integration sends an unsigned request with the client's body; SQS rejects it because it isn't a signed SendMessage request."
      fr: "Une intégration de proxy HTTP envoie une requête non signée avec le corps du client ; SQS la rejette car ce n'est pas une requête SendMessage signée."
    c:
      en: "Asynchronous invocation still uses the Lambda function, which the company wants to remove from the path, and its concurrency still limits processing."
      fr: "L'invocation asynchrone utilise toujours la fonction Lambda, que l'entreprise veut retirer du chemin, et sa simultanéité limite toujours le traitement."
    d:
      en: "Provisioned concurrency keeps the Lambda function in the path and adds cost for capacity that is idle between bursts."
      fr: "La simultanéité provisionnée laisse la fonction Lambda dans le chemin et ajoute un coût pour une capacité inutilisée entre les pics."
references:
  - title: Integrate Amazon API Gateway with Amazon SQS to handle asynchronous REST APIs
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/integrate-amazon-api-gateway-with-amazon-sqs-to-handle-asynchronous-rest-apis.html
