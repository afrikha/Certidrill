id: dvac03-1a-one-to-many-notify
objective: "1.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company is splitting a monolithic application into services. The order service must deliver each event to several other services at the same time, without knowing their endpoints, so that services can be added or removed without changing the order service.

    Which AWS services can the order service publish the events to? (Choose two.) Each correct answer presents a complete solution.
  fr: |
    Une entreprise découpe une application monolithique en services. Le service de commande doit remettre chaque événement à plusieurs autres services en même temps, sans connaître leurs points de terminaison, afin que des services puissent être ajoutés ou retirés sans modifier le service de commande.

    Vers quels services AWS le service de commande peut-il publier les événements ? (Choisissez-en deux.) Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: "Elastic Load Balancing (Application Load Balancer)" }
    - { id: b, text: "Amazon SNS" }
    - { id: c, text: { en: "An Amazon Route 53 private hosted zone", fr: "Une zone hébergée privée Amazon Route 53" } }
    - { id: d, text: "Amazon EventBridge" }
    - { id: e, text: "Amazon API Gateway" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "SNS topics and EventBridge event buses are publish/subscribe services: the publisher sends an event once, and the service delivers a copy to every subscriber or matching target. Consumers subscribe on their own, so the publisher never needs their endpoints."
    fr: "Les rubriques SNS et les bus d'événements EventBridge sont des services de publication/abonnement : l'éditeur envoie un événement une fois, et le service en remet une copie à chaque abonné ou cible correspondante. Les consommateurs s'abonnent d'eux-mêmes : l'éditeur n'a jamais besoin de leurs points de terminaison."
  options:
    a:
      en: "A load balancer sends each request to one target of a target group; it doesn't copy an event to several services."
      fr: "Un équilibreur de charge envoie chaque requête à une seule cible d'un groupe cible ; il ne copie pas un événement vers plusieurs services."
    c:
      en: "A private hosted zone resolves names to endpoints; the caller still calls each service itself."
      fr: "Une zone hébergée privée résout des noms en points de terminaison ; l'appelant appelle toujours lui-même chaque service."
    e:
      en: "API Gateway exposes APIs that clients call one at a time; it doesn't fan out an event to several subscribers."
      fr: "API Gateway expose des API que les clients appellent une à une ; il ne diffuse pas un événement vers plusieurs abonnés."
references:
  - title: Fanout Amazon SNS notifications to Amazon SQS queues for asynchronous processing
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html
  - title: Amazon EventBridge event bus (default and Classic)
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-bus.html
