id: dvac03-1a-lib-dynamodb-doc-client
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer writes the following Lambda function with the AWS SDK for JavaScript v3:

    ```javascript
    import { DynamoDBClient, PutItemCommand } from "@aws-sdk/client-dynamodb";

    const client = new DynamoDBClient({});

    export const handler = async (event) => {
      await client.send(new PutItemCommand({
        TableName: "Orders",
        Item: { orderId: event.orderId, total: event.total, lines: event.lines },
      }));
    };
    ```

    The call fails with a validation error because the item contains plain JavaScript values. The developer wants to keep writing plain JavaScript objects, with the LEAST code.

    Which change will meet these requirements?
  fr: |
    Un développeur écrit la fonction Lambda suivante avec le kit SDK AWS pour JavaScript v3 :

    ```javascript
    import { DynamoDBClient, PutItemCommand } from "@aws-sdk/client-dynamodb";

    const client = new DynamoDBClient({});

    export const handler = async (event) => {
      await client.send(new PutItemCommand({
        TableName: "Orders",
        Item: { orderId: event.orderId, total: event.total, lines: event.lines },
      }));
    };
    ```

    L'appel échoue avec une erreur de validation, car l'élément contient des valeurs JavaScript simples. Le développeur veut continuer à écrire des objets JavaScript simples, avec le MOINS de code.

    Quelle modification répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Pass `JSON.stringify(event)` as the `Item` parameter of the command.", fr: "Passer `JSON.stringify(event)` comme paramètre `Item` de la commande." }
    - id: b
      text: { en: "Replace `PutItemCommand` with `BatchWriteItemCommand` on the same client.", fr: "Remplacer `PutItemCommand` par `BatchWriteItemCommand` sur le même client." }
    - id: c
      text: { en: "Convert every attribute by hand to the `{ S: ... }` and `{ N: ... }` format.", fr: "Convertir chaque attribut à la main au format `{ S: ... }` et `{ N: ... }`." }
    - id: d
      text: { en: "Wrap the client with `DynamoDBDocumentClient.from()` and send a `PutCommand` instead.", fr: "Envelopper le client avec `DynamoDBDocumentClient.from()` et envoyer plutôt une `PutCommand`." }
answer: { optionId: d }
explanation:
  correct:
    en: "The low-level client expects AttributeValue objects such as `{ N: \"12\" }`. The document client in @aws-sdk/lib-dynamodb marshals native JavaScript values to AttributeValue on writes and unmarshals them on reads, so the item can stay a plain object."
    fr: "Le client de bas niveau attend des objets AttributeValue comme `{ N: \"12\" }`. Le client de document de @aws-sdk/lib-dynamodb convertit les valeurs JavaScript natives en AttributeValue lors des écritures et inversement lors des lectures : l'élément peut rester un objet simple."
  options:
    a:
      en: "Item must be a map of attributes, not a JSON string, so the request is still invalid."
      fr: "Item doit être une table d'attributs, pas une chaîne JSON : la requête reste non valide."
    b:
      en: "BatchWriteItemCommand on the low-level client uses the same AttributeValue format, so the error remains."
      fr: "BatchWriteItemCommand du client de bas niveau utilise le même format AttributeValue : l'erreur demeure."
    c:
      en: "Manual conversion works but needs code for every attribute and nested list, which isn't the least code."
      fr: "La conversion manuelle fonctionne mais demande du code pour chaque attribut et chaque liste imbriquée, ce qui n'est pas le moins de code."
references:
  - title: DynamoDB examples using SDK for JavaScript (v3)
    url: https://docs.aws.amazon.com/sdk-for-javascript/v3/developer-guide/dynamodb-example-dynamodb-utilities.html
