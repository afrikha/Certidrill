id: dvac03-1a-invocation-type-header
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A REST API in Amazon API Gateway uses a Lambda non-proxy (custom) integration for POST /audit. The function only stores audit records, and the client doesn't need its result. The company wants the API to respond without waiting for the function to finish, with the LEAST development effort and without adding AWS services.

    Which solution will meet these requirements?
  fr: |
    Une API REST d'Amazon API Gateway utilise une intégration Lambda sans proxy (personnalisée) pour POST /audit. La fonction se contente de stocker des enregistrements d'audit, et le client n'a pas besoin de son résultat. L'entreprise veut que l'API réponde sans attendre la fin de la fonction, avec l'effort de développement le MOINS important et sans ajouter de service AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add an environment variable named InvocationType with the value Event to the Lambda function.", fr: "Ajouter à la fonction Lambda une variable d'environnement nommée InvocationType avec la valeur Event." }
    - id: b
      text: { en: "Set the reserved concurrency of the Lambda function to 0 so that API Gateway queues the requests.", fr: "Définir la simultanéité réservée de la fonction Lambda à 0 pour qu'API Gateway mette les requêtes en file d'attente." }
    - id: c
      text: { en: "Change to a Lambda proxy integration and return a 202 status code at the start of the handler.", fr: "Passer à une intégration de proxy Lambda et renvoyer un code d'état 202 au début du gestionnaire." }
    - id: d
      text: { en: "Add an X-Amz-Invocation-Type header with the static value 'Event' to the integration request.", fr: "Ajouter à la demande d'intégration un en-tête X-Amz-Invocation-Type avec la valeur statique 'Event'." }
answer: { optionId: d }
explanation:
  correct:
    en: "A Lambda non-proxy integration invokes the function synchronously by default. Mapping the X-Amz-Invocation-Type integration request header to 'Event' makes API Gateway invoke the function asynchronously, so the method responds without waiting for the function's result."
    fr: "Une intégration Lambda sans proxy invoque la fonction de manière synchrone par défaut. Mapper l'en-tête de demande d'intégration X-Amz-Invocation-Type sur 'Event' fait invoquer la fonction de manière asynchrone par API Gateway : la méthode répond sans attendre le résultat de la fonction."
  options:
    a:
      en: "Environment variables configure the function's code; they don't change how API Gateway invokes the function."
      fr: "Les variables d'environnement configurent le code de la fonction ; elles ne changent pas la façon dont API Gateway invoque la fonction."
    b:
      en: "A reserved concurrency of 0 throttles every invocation of the function, so no audit record would be written."
      fr: "Une simultanéité réservée de 0 limite toutes les invocations de la fonction : aucun enregistrement d'audit ne serait écrit."
    c:
      en: "Returning from the handler ends the invocation, so the audit work wouldn't run; keeping the work would need new code such as a second asynchronous call."
      fr: "Renvoyer une réponse depuis le gestionnaire termine l'invocation : le travail d'audit ne s'exécuterait pas ; le conserver demanderait du nouveau code, comme un second appel asynchrone."
references:
  - title: Set up asynchronous invocation of the backend Lambda function
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-lambda-integration-async.html
