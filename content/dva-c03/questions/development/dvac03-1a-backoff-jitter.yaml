id: dvac03-1a-backoff-jitter
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Thousands of IoT gateways call an Amazon API Gateway API. When the API returns 429 errors, every gateway retries after exactly 1 second. The retries arrive in synchronized waves that keep the API throttled.

    Which change to the client retry logic will reduce this effect?
  fr: |
    Des milliers de passerelles IoT appellent une API Amazon API Gateway. Quand l'API renvoie des erreurs 429, chaque passerelle réessaie après exactement 1 seconde. Les nouvelles tentatives arrivent par vagues synchronisées qui maintiennent la limitation de l'API.

    Quelle modification de la logique de nouvelle tentative des clients réduira cet effet ?
body:
  options:
    - id: a
      text: { en: "Retry immediately after each 429 error and open more parallel connections.", fr: "Réessayer immédiatement après chaque erreur 429 et ouvrir davantage de connexions parallèles." }
    - id: b
      text: { en: "Keep the fixed 1-second wait and allow an unlimited number of attempts.", fr: "Conserver l'attente fixe de 1 seconde et autoriser un nombre illimité de tentatives." }
    - id: c
      text: { en: "Use exponential backoff with random jitter and a maximum number of attempts.", fr: "Utiliser un backoff exponentiel avec une gigue (jitter) aléatoire et un nombre maximal de tentatives." }
    - id: d
      text: { en: "Treat every 429 error as permanent and drop the request without retrying.", fr: "Traiter chaque erreur 429 comme définitive et abandonner la requête sans réessayer." }
answer: { optionId: c }
explanation:
  correct:
    en: "Exponential backoff increases the wait after each failed attempt so that clients reduce their load on the throttled API. Random jitter spreads the retries of many clients across the backoff window instead of synchronized bursts, and a maximum number of attempts stops endless retries."
    fr: "Le backoff exponentiel augmente l'attente après chaque tentative en échec afin que les clients réduisent leur charge sur l'API limitée. Une gigue aléatoire répartit les nouvelles tentatives de nombreux clients sur la fenêtre de backoff au lieu de pics synchronisés, et un nombre maximal de tentatives évite les nouvelles tentatives sans fin."
  options:
    a:
      en: "Immediate retries over more connections add load to an API that is already throttling requests."
      fr: "Des nouvelles tentatives immédiates sur davantage de connexions ajoutent de la charge à une API qui limite déjà les requêtes."
    b:
      en: "A fixed wait keeps all clients synchronized, and unlimited attempts keep the load high for as long as the throttling lasts."
      fr: "Une attente fixe maintient tous les clients synchronisés, et des tentatives illimitées maintiennent une charge élevée tant que dure la limitation."
    d:
      en: "A 429 error is a transient throttling error; dropping the request loses work that a later retry would complete."
      fr: "Une erreur 429 est une erreur de limitation transitoire ; abandonner la requête perd un travail qu'une nouvelle tentative ultérieure aurait terminé."
references:
  - title: Retry with backoff pattern
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/retry-backoff.html
  - title: Retry behavior
    url: https://docs.aws.amazon.com/sdkref/latest/guide/feature-retry-behavior.html
