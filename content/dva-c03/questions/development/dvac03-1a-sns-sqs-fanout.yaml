id: dvac03-1a-sns-sqs-fanout
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's order service must send every new order to three independent services: billing, shipping and analytics. Each service runs on Amazon EC2 instances, processes orders at its own pace, and can be offline for several hours during maintenance without losing any order.

    Which solution will meet these requirements?
  fr: |
    Le service de commande d'une entreprise doit envoyer chaque nouvelle commande à trois services indépendants : facturation, expédition et analytique. Chaque service s'exécute sur des instances Amazon EC2, traite les commandes à son propre rythme et peut être hors ligne pendant plusieurs heures de maintenance sans perdre aucune commande.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Send each order to one Amazon SQS standard queue that the three services poll.", fr: "Envoyer chaque commande dans une seule file d'attente Amazon SQS standard que les trois services interrogent." }
    - id: b
      text: { en: "Use an AWS Step Functions Parallel state that calls the HTTP endpoints of the three services synchronously.", fr: "Utiliser un état Parallel AWS Step Functions qui appelle les points de terminaison HTTP des trois services de manière synchrone." }
    - id: c
      text: { en: "Publish each order to an Amazon SNS topic that has one Amazon SQS queue subscribed for each service.", fr: "Publier chaque commande dans une rubrique Amazon SNS à laquelle est abonnée une file d'attente Amazon SQS par service." }
    - id: d
      text: { en: "Send each order to an Amazon SQS FIFO queue with one message group ID for each of the three services.", fr: "Envoyer chaque commande dans une file d'attente Amazon SQS FIFO avec un ID de groupe de messages pour chacun des trois services." }
answer: { optionId: c }
explanation:
  correct:
    en: "With the fan-out pattern, SNS copies each published message to every subscribed SQS queue. Each service has its own queue, so it consumes at its own pace, and messages wait in its queue while the service is offline."
    fr: "Avec le modèle de diffusion (fan-out), SNS copie chaque message publié dans chaque file d'attente SQS abonnée. Chaque service a sa propre file : il consomme à son rythme, et les messages attendent dans sa file pendant qu'il est hors ligne."
  options:
    a:
      en: "A message in a queue is processed by only one consumer, then deleted, so each order would reach only one of the three services."
      fr: "Un message d'une file d'attente n'est traité que par un seul consommateur, puis supprimé : chaque commande n'atteindrait qu'un seul des trois services."
    b:
      en: "Synchronous calls keep the services coupled: when a service is offline for maintenance, its call fails instead of the order waiting for it."
      fr: "Des appels synchrones laissent les services couplés : quand un service est hors ligne pour maintenance, son appel échoue au lieu que la commande l'attende."
    d:
      en: "A FIFO queue still delivers each message to one consumer, and a consumer can't choose to receive only its own message group, so the services would not each get every order."
      fr: "Une file FIFO remet toujours chaque message à un seul consommateur, et un consommateur ne peut pas choisir de recevoir seulement son groupe de messages : les services ne recevraient pas chacun toutes les commandes."
references:
  - title: Fanout Amazon SNS notifications to Amazon SQS queues for asynchronous processing
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html
