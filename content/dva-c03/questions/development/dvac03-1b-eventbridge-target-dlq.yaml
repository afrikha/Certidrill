id: dvac03-1b-eventbridge-target-dlq
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon EventBridge rule sends order events to an AWS Lambda function. After an administrator edits the resource-based policy of the function, some events are never delivered, and the company cannot tell which ones. The company wants to keep every undelivered event, with the error that caused the failure, so that it can resend the events after it fixes the problem.

    Which solution will meet these requirements?
  fr: |
    Une règle Amazon EventBridge envoie des événements de commande à une fonction AWS Lambda. Après qu'un administrateur a modifié la politique basée sur les ressources de la fonction, certains événements ne sont jamais livrés, et l'entreprise ne peut pas savoir lesquels. L'entreprise veut conserver chaque événement non livré, avec l'erreur à l'origine de l'échec, afin de pouvoir renvoyer les événements après avoir corrigé le problème.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Increase the retry policy of the target to the maximum event age and number of retry attempts.", fr: "Porter la politique de nouvelles tentatives de la cible à l'âge d'événement et au nombre de tentatives maximaux." }
    - id: b
      text: { en: "Configure an on-failure destination for asynchronous invocations on the Lambda function.", fr: "Configurer une destination en cas d'échec pour les invocations asynchrones sur la fonction Lambda." }
    - id: c
      text: { en: "Attach an Amazon SQS FIFO queue as the dead-letter queue of the rule target, with a queue policy that allows EventBridge to send messages.", fr: "Associer une file d'attente Amazon SQS FIFO comme file d'attente de lettres mortes de la cible de la règle, avec une politique de file d'attente qui autorise EventBridge à envoyer des messages." }
    - id: d
      text: { en: "Attach an Amazon SQS standard queue as the dead-letter queue of the rule target, with a queue policy that allows EventBridge to send messages.", fr: "Associer une file d'attente Amazon SQS standard comme file d'attente de lettres mortes de la cible de la règle, avec une politique de file d'attente qui autorise EventBridge à envoyer des messages." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A target dead-letter queue receives the events that EventBridge cannot deliver, with attributes such as ERROR_CODE, ERROR_MESSAGE and RETRY_ATTEMPTS. Permission errors are not retried, and EventBridge sends these events directly to the DLQ. The DLQ must be a standard queue in the same Region as the rule, and its policy must allow events.amazonaws.com to call sqs:SendMessage.
    fr: |
      Une file d'attente de lettres mortes (DLQ) de cible reçoit les événements qu'EventBridge ne peut pas livrer, avec des attributs comme ERROR_CODE, ERROR_MESSAGE et RETRY_ATTEMPTS. Les erreurs d'autorisation ne font pas l'objet de nouvelles tentatives, et EventBridge envoie ces événements directement à la DLQ. La DLQ doit être une file d'attente standard dans la même Région que la règle, et sa politique doit autoriser events.amazonaws.com à appeler sqs:SendMessage.
  options:
    a:
      en: "Events that fail because of missing permissions are not retried, so a larger retry policy does not recover them, and events are dropped when retries end."
      fr: "Les événements qui échouent faute d'autorisations ne sont pas retentés : une politique de nouvelles tentatives plus large ne les récupère pas, et les événements sont abandonnés à la fin des tentatives."
    b:
      en: "Lambda destinations handle failures of invocations that happened; these events never invoke the function, so the destination receives nothing."
      fr: "Les destinations Lambda traitent les échecs d'invocations qui ont eu lieu ; ces événements n'invoquent jamais la fonction : la destination ne reçoit rien."
    c:
      en: "EventBridge supports only standard queues as dead-letter queues; a FIFO queue cannot be used."
      fr: "EventBridge ne prend en charge que les files d'attente standard comme files d'attente de lettres mortes ; une file d'attente FIFO ne peut pas être utilisée."
references:
  - title: Using dead-letter queues to process undelivered events in EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-rule-dlq.html
