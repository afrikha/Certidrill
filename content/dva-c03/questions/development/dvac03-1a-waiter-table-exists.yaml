id: dvac03-1a-waiter-table-exists
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Python test script creates an Amazon DynamoDB table with create_table and immediately writes test items. The writes often fail with ResourceNotFoundException because the table isn't active yet. The developer wants the script to wait only as long as needed, with the LEAST code.

    Which change will meet these requirements?
  fr: |
    Un script de test Python crée une table Amazon DynamoDB avec create_table et écrit immédiatement des éléments de test. Les écritures échouent souvent avec ResourceNotFoundException, car la table n'est pas encore active. Le développeur veut que le script attende seulement le temps nécessaire, avec le MOINS de code.

    Quelle modification répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add `time.sleep(10)` after the `create_table` call.", fr: "Ajouter `time.sleep(10)` après l'appel `create_table`." }
    - id: b
      text: { en: "Retry each `put_item` call in a loop without a delay until it succeeds.", fr: "Relancer chaque appel `put_item` dans une boucle sans délai jusqu'à ce qu'il réussisse." }
    - id: c
      text: { en: "Call `client.get_waiter(\"table_exists\").wait(TableName=...)` after `create_table`.", fr: "Appeler `client.get_waiter(\"table_exists\").wait(TableName=...)` après `create_table`." }
    - id: d
      text: { en: "Call `describe_table` once after `create_table` and continue when it returns a response.", fr: "Appeler `describe_table` une fois après `create_table` et continuer dès qu'il renvoie une réponse." }
answer: { optionId: c }
explanation:
  correct:
    en: "A waiter polls a resource until it reaches a target state or a failure occurs. The DynamoDB table_exists waiter polls DescribeTable until the table is ACTIVE, so the script continues as soon as the table can accept writes."
    fr: "Un waiter interroge une ressource jusqu'à ce qu'elle atteigne un état cible ou qu'un échec survienne. Le waiter table_exists de DynamoDB interroge DescribeTable jusqu'à ce que la table soit ACTIVE : le script continue dès que la table peut accepter des écritures."
  options:
    a:
      en: "A fixed sleep waits too long when the table is ready early and fails when creation takes longer."
      fr: "Une pause fixe attend trop longtemps si la table est prête tôt et échoue si la création prend plus de temps."
    b:
      en: "Retrying without a delay sends a flood of failing requests and needs more code than a waiter."
      fr: "Réessayer sans délai envoie un flot de requêtes en échec et demande plus de code qu'un waiter."
    d:
      en: "DescribeTable responds while the table is still in the CREATING status, so a single call doesn't show that the table is ready."
      fr: "DescribeTable répond alors que la table est encore à l'état CREATING : un seul appel ne montre pas que la table est prête."
references:
  - title: Low-level clients
    url: https://docs.aws.amazon.com/boto3/latest/guide/clients.html
