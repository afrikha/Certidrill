id: dvac03-1c-life-sqs-dlq-retention
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application uses an Amazon SQS standard queue with the default message retention period. The queue has a redrive policy to a standard dead-letter queue that also uses the default retention period. Failed messages often spend 3 days in the source queue before they are moved to the dead-letter queue. The support team reports that the messages disappear from the dead-letter queue after about 1 day, and it needs at least 10 days to investigate them.

    Which solution will meet these requirements?
  fr: |
    Une application utilise une file d'attente standard Amazon SQS avec la période de conservation des messages par défaut. La file d'attente possède une politique de redirection vers une file d'attente de lettres mortes standard qui utilise aussi la période de conservation par défaut. Les messages en échec passent souvent 3 jours dans la file d'attente source avant d'être déplacés vers la file d'attente de lettres mortes. L'équipe de support signale que les messages disparaissent de la file d'attente de lettres mortes après environ 1 jour, et elle a besoin d'au moins 10 jours pour les analyser.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Increase the visibility timeout of the source queue to 12 hours.", fr: "Augmenter le délai de visibilité de la file d'attente source à 12 heures." } }
    - { id: b, text: { en: "Increase the maxReceiveCount of the redrive policy so that messages stay longer in the source queue.", fr: "Augmenter le maxReceiveCount de la politique de redirection afin que les messages restent plus longtemps dans la file d'attente source." } }
    - { id: c, text: { en: "Set the MessageRetentionPeriod of the dead-letter queue to 14 days.", fr: "Définir la MessageRetentionPeriod de la file d'attente de lettres mortes à 14 jours." } }
    - { id: d, text: { en: "Set the MessageRetentionPeriod of the source queue to 14 days.", fr: "Définir la MessageRetentionPeriod de la file d'attente source à 14 jours." } }
answer: { optionId: c }
explanation:
  correct:
    en: "For standard queues, a message's expiration is based on its original enqueue timestamp, which does not change when it moves to the dead-letter queue. With the default 4-day retention, a message that spent 3 days in the source queue expires 1 day later. A 14-day retention, the maximum, on the dead-letter queue leaves about 11 days, and AWS recommends a longer retention on the dead-letter queue than on the source queue."
    fr: "Pour les files d'attente standard, l'expiration d'un message est basée sur son horodatage de mise en file d'attente d'origine, qui ne change pas lorsqu'il passe dans la file d'attente de lettres mortes. Avec la conservation par défaut de 4 jours, un message resté 3 jours dans la file d'attente source expire 1 jour plus tard. Une conservation de 14 jours, le maximum, sur la file d'attente de lettres mortes laisse environ 11 jours, et AWS recommande une conservation plus longue sur la file d'attente de lettres mortes que sur la file d'attente source."
  options:
    a:
      en: "The visibility timeout controls how long a received message stays hidden; it does not extend its retention."
      fr: "Le délai de visibilité contrôle combien de temps un message reçu reste masqué ; il ne prolonge pas sa conservation."
    b:
      en: "Keeping messages longer in the source queue uses up more of their retention period before they reach the dead-letter queue."
      fr: "Garder les messages plus longtemps dans la file d'attente source consomme davantage de leur période de conservation avant qu'ils n'atteignent la file d'attente de lettres mortes."
    d:
      en: "The dead-letter queue still deletes the messages 4 days after their original enqueue time, so about 1 day after they arrive."
      fr: "La file d'attente de lettres mortes supprime toujours les messages 4 jours après leur mise en file d'attente d'origine, soit environ 1 jour après leur arrivée."
references:
