id: dvac03-1b-sns-sqs-raw-delivery
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An order service publishes JSON messages such as `{"orderId": "o-42", "total": 80}` to an Amazon SNS topic. An Amazon SQS queue is subscribed to the topic, and an AWS Lambda function processes the queue. The function reads `json.loads(record["body"])["orderId"]` and fails with a `KeyError` on every message. The company wants to fix the problem without changing the function code or the publisher.

    Which solution will meet these requirements?
  fr: |
    Un service de commandes publie des messages JSON comme `{"orderId": "o-42", "total": 80}` dans une rubrique Amazon SNS. Une file d'attente Amazon SQS est abonnée à la rubrique, et une fonction AWS Lambda traite la file d'attente. La fonction lit `json.loads(record["body"])["orderId"]` et échoue avec une `KeyError` sur chaque message. L'entreprise veut corriger le problème sans modifier le code de la fonction ni l'éditeur.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set the FilterPolicyScope attribute of the subscription to MessageBody.", fr: "Définir l'attribut FilterPolicyScope de l'abonnement sur MessageBody." }
    - id: b
      text: { en: "Add a filter criteria pattern on the body field to the event source mapping of the function.", fr: "Ajouter un modèle de critères de filtre sur le champ body au mappage de source d'événements de la fonction." }
    - id: c
      text: { en: "Set the RawMessageDelivery attribute of the subscription to true.", fr: "Définir l'attribut RawMessageDelivery de l'abonnement sur true." }
    - id: d
      text: { en: "Turn on content-based deduplication for the queue and the topic.", fr: "Activer la déduplication basée sur le contenu pour la file d'attente et la rubrique." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Without raw message delivery, SNS wraps each message in a JSON envelope (Type, MessageId, TopicArn, Message, Timestamp, Signature...) and the original payload is a string in the Message field, so orderId is not a top-level key of the body. With RawMessageDelivery set to true on the SQS subscription, SNS sends the message as is, and the body is the original JSON document.
    fr: |
      Sans la remise de messages bruts (raw message delivery), SNS enveloppe chaque message dans une enveloppe JSON (Type, MessageId, TopicArn, Message, Timestamp, Signature...) et la charge utile d'origine est une chaîne dans le champ Message : orderId n'est donc pas une clé de premier niveau du corps. Avec RawMessageDelivery défini sur true sur l'abonnement SQS, SNS envoie le message tel quel, et le corps est le document JSON d'origine.
  options:
    a:
      en: "The filter policy scope selects which messages are delivered; it does not change the format of the delivered message."
      fr: "La portée de la politique de filtrage choisit les messages remis ; elle ne change pas le format du message remis."
    b:
      en: "Filter criteria decide which messages invoke the function; the body of the matching messages is still the SNS envelope."
      fr: "Les critères de filtre décident quels messages invoquent la fonction ; le corps des messages correspondants reste l'enveloppe SNS."
    d:
      en: "Content-based deduplication applies to FIFO queues and topics and removes duplicates; it does not remove the SNS envelope."
      fr: "La déduplication basée sur le contenu s'applique aux files d'attente et rubriques FIFO et supprime les doublons ; elle ne retire pas l'enveloppe SNS."
references:
  - title: Amazon SNS raw message delivery
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-large-payload-raw-message-delivery.html
