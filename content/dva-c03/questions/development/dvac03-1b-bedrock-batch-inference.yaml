id: dvac03-1b-bedrock-batch-inference
objective: "1.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Every night, a company must generate short summaries for about 200,000 product reviews that are exported to an Amazon S3 bucket. The results are needed the next morning, and no user waits for them. The company wants to use an Amazon Bedrock model at the lowest cost and with the LEAST code for request loops, throttling and retries.

    Which solution will meet these requirements?
  fr: |
    Chaque nuit, une entreprise doit générer des résumés courts pour environ 200 000 avis sur des produits exportés dans un compartiment Amazon S3. Les résultats sont nécessaires le lendemain matin, et aucun utilisateur ne les attend. L'entreprise veut utiliser un modèle Amazon Bedrock au coût le plus faible et avec le MOINS de code pour les boucles de requêtes, la limitation et les nouvelles tentatives.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run an AWS Lambda function for each review that calls the Converse API on demand and writes the summary to Amazon S3.", fr: "Exécuter une fonction AWS Lambda pour chaque avis, qui appelle l'API Converse à la demande et écrit le résumé dans Amazon S3." }
    - id: b
      text: { en: "Purchase Provisioned Throughput for the model and run a script on Amazon EC2 that calls InvokeModel for each review.", fr: "Acheter du débit provisionné (Provisioned Throughput) pour le modèle et exécuter sur Amazon EC2 un script qui appelle InvokeModel pour chaque avis." }
    - id: c
      text: { en: "Write the prompts to JSONL files in Amazon S3 and submit a batch inference job that writes the responses to an S3 output location.", fr: "Écrire les invites dans des fichiers JSONL dans Amazon S3 et soumettre une tâche d'inférence par lots qui écrit les réponses dans un emplacement de sortie S3." }
    - id: d
      text: { en: "Call ConverseStream for each review from an AWS Step Functions Map state and store each streamed response in Amazon S3.", fr: "Appeler ConverseStream pour chaque avis depuis un état Map d'AWS Step Functions et stocker chaque réponse diffusée dans Amazon S3." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Batch inference processes a large number of prompts asynchronously: the model inputs are uploaded to S3, one job is submitted, and the responses are written to an S3 bucket. Amazon Bedrock offers batch inference for select models at a 50 % lower price than on-demand inference, and the application does not need to loop over requests or handle throttling itself.
    fr: |
      L'inférence par lots traite un grand nombre d'invites de façon asynchrone : les entrées du modèle sont chargées dans S3, une seule tâche est soumise, et les réponses sont écrites dans un compartiment S3. Amazon Bedrock propose l'inférence par lots pour certains modèles à un prix inférieur de 50 % à celui de l'inférence à la demande, et l'application n'a pas à boucler sur les requêtes ni à gérer elle-même la limitation.
  options:
    a:
      en: "200,000 on-demand calls are billed at the on-demand price, and the code must handle throttling and retries for the whole run."
      fr: "200 000 appels à la demande sont facturés au prix à la demande, et le code doit gérer la limitation et les nouvelles tentatives pour toute l'exécution."
    b:
      en: "Provisioned Throughput is paid for the reserved capacity and needs a request loop; it is not the cheapest option for a nightly job."
      fr: "Le débit provisionné est payé pour la capacité réservée et nécessite une boucle de requêtes ; ce n'est pas l'option la moins chère pour une tâche nocturne."
    d:
      en: "Streaming helps interactive users; here it still makes 200,000 on-demand calls and adds orchestration for no benefit."
      fr: "La diffusion en continu aide les utilisateurs interactifs ; ici, elle effectue toujours 200 000 appels à la demande et ajoute une orchestration sans bénéfice."
references:
  - title: Process multiple prompts with batch inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
  - title: Amazon Bedrock pricing
    url: https://aws.amazon.com/bedrock/pricing/
