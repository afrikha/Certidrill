id: dvac03-1b-firehose-transform-output
objective: "1.1.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A developer writes an AWS Lambda function that Amazon Data Firehose invokes to transform records before delivery to Amazon S3. Each incoming record contains a base64-encoded CSV line, and the function must deliver each line as a JSON document. Firehose currently reports every record as a data transformation failure.

    Which three requirements must each record in the function response meet? (Choose three.)
  fr: |
    Un développeur écrit une fonction AWS Lambda qu'Amazon Data Firehose invoque pour transformer les enregistrements avant leur livraison dans Amazon S3. Chaque enregistrement entrant contient une ligne CSV encodée en base64, et la fonction doit livrer chaque ligne sous forme de document JSON. Firehose signale actuellement chaque enregistrement comme un échec de transformation des données.

    Quelles sont les trois exigences que chaque enregistrement de la réponse de la fonction doit respecter ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "Contain the same recordId as the matching input record.", fr: "Contenir le même recordId que l'enregistrement d'entrée correspondant." } }
    - { id: b, text: { en: "Contain a result field set to Ok for each record that was transformed.", fr: "Contenir un champ result défini sur Ok pour chaque enregistrement transformé." } }
    - { id: c, text: { en: "Contain the transformed JSON document, base64-encoded, in the data field.", fr: "Contenir le document JSON transformé, encodé en base64, dans le champ data." } }
    - { id: d, text: { en: "Contain the transformed JSON document as a nested object in the data field.", fr: "Contenir le document JSON transformé sous forme d'objet imbriqué dans le champ data." } }
    - { id: e, text: { en: "Contain a new unique recordId generated by the function.", fr: "Contenir un nouveau recordId unique généré par la fonction." } }
    - { id: f, text: { en: "Contain a statusCode field set to 200.", fr: "Contenir un champ statusCode défini sur 200." } }
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: |
      Each record returned to Firehose must carry the recordId that Firehose passed in, a result of Ok, Dropped or ProcessingFailed, and the transformed payload base64-encoded in data. A recordId that does not match the original is treated as a data transformation failure, and only Ok and Dropped count as successfully processed.
    fr: |
      Chaque enregistrement renvoyé à Firehose doit porter le recordId que Firehose a transmis, un result Ok, Dropped ou ProcessingFailed, et la charge utile transformée encodée en base64 dans data. Un recordId qui ne correspond pas à l'original est traité comme un échec de transformation des données, et seuls Ok et Dropped comptent comme traités avec succès.
  options:
    d:
      en: "The data field must be a base64-encoded string; a raw JSON object in data makes the record fail."
      fr: "Le champ data doit être une chaîne encodée en base64 ; un objet JSON brut dans data fait échouer l'enregistrement."
    e:
      en: "Firehose matches output records to input records by recordId, so a new ID is a mismatch and counts as a failure."
      fr: "Firehose associe les enregistrements de sortie aux enregistrements d'entrée par recordId : un nouvel ID est une non-correspondance et compte comme un échec."
    f:
      en: "statusCode belongs to Lambda proxy responses for API Gateway; Firehose reads the result field of each record."
      fr: "statusCode appartient aux réponses de proxy Lambda pour API Gateway ; Firehose lit le champ result de chaque enregistrement."
references:
  - title: Required parameters for data transformation
    url: https://docs.aws.amazon.com/firehose/latest/dev/data-transformation-status-model.html
