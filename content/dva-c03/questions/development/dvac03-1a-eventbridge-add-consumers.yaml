id: dvac03-1a-eventbridge-add-consumers
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    After each order, a company's order service calls three downstream services directly by using the AWS SDK. Every time a team adds a downstream service, developers must change and redeploy the order service. The company wants teams to add downstream services without changing the order service or any other existing component, and each service must receive only the order event types it needs.

    Which solution will meet these requirements?
  fr: |
    Après chaque commande, le service de commande d'une entreprise appelle directement trois services en aval à l'aide du kit SDK AWS. Chaque fois qu'une équipe ajoute un service en aval, les développeurs doivent modifier et redéployer le service de commande. L'entreprise veut que les équipes puissent ajouter des services en aval sans modifier le service de commande ni aucun autre composant existant, et chaque service ne doit recevoir que les types d'événements de commande dont il a besoin.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Publish the events to an Amazon EventBridge event bus, and let each service add its own filter for the events it needs.", fr: "Publier les événements sur un bus d'événements Amazon EventBridge, et laisser chaque service ajouter son propre filtre sur les événements dont il a besoin." }
    - id: b
      text: { en: "Send the events to one Amazon SQS standard queue that every downstream service polls for its own events.", fr: "Envoyer les événements dans une seule file d'attente Amazon SQS standard que chaque service en aval interroge pour ses propres événements." }
    - id: c
      text: { en: "Create an AWS Step Functions state machine that calls each downstream service, and start one execution per order.", fr: "Créer une machine d'état AWS Step Functions qui appelle chaque service en aval, et démarrer une exécution par commande." }
    - id: d
      text: { en: "Put an Amazon API Gateway REST API in front of each downstream service, and have the order service call the APIs.", fr: "Placer une API REST Amazon API Gateway devant chaque service en aval, et faire appeler ces API par le service de commande." }
answer: { optionId: a }
explanation:
  correct:
    en: "An event bus decouples producers from consumers: the order service only publishes events and doesn't know who receives them. Each team adds its own rule with an event pattern (Classic bus) or its own subscriber with a filter (Custom Event Bus), so a new service needs no change to the producer or to other consumers."
    fr: "Un bus d'événements découple les producteurs des consommateurs : le service de commande se contente de publier des événements et ne sait pas qui les reçoit. Chaque équipe ajoute sa propre règle avec un modèle d'événement (bus Classic) ou son propre abonné avec un filtre (Custom Event Bus) : un nouveau service ne demande aucune modification du producteur ni des autres consommateurs."
  options:
    b:
      en: "A queue message goes to only one consumer, and the queue has no per-consumer filtering, so services would compete for events instead of each receiving the ones it needs."
      fr: "Un message de file d'attente ne va qu'à un seul consommateur, et la file n'a pas de filtrage par consommateur : les services se disputeraient les événements au lieu de recevoir chacun ceux dont il a besoin."
    c:
      en: "The state machine becomes a central component that must be changed every time a downstream service is added."
      fr: "La machine d'état devient un composant central qu'il faut modifier à chaque ajout d'un service en aval."
    d:
      en: "The order service would still call each API by name, so it must be changed for every new service."
      fr: "Le service de commande appellerait toujours chaque API nommément : il faudrait le modifier pour chaque nouveau service."
references:
  - title: Amazon EventBridge event bus (default and Classic)
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-event-bus.html
  - title: What is the EventBridge Custom Event Bus?
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-custom-bus-what-is.html
