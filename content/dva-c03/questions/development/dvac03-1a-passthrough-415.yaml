id: dvac03-1a-passthrough-415
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A POST method of a REST API in Amazon API Gateway has an HTTP (non-proxy) integration. The integration has one mapping template, for the application/json content type, and its passthroughBehavior is WHEN_NO_TEMPLATES. A client sends a POST request whose Content-Type header is text/xml.

    What happens to this request?
  fr: |
    Une méthode POST d'une API REST Amazon API Gateway possède une intégration HTTP (sans proxy). L'intégration a un seul modèle de mappage, pour le type de contenu application/json, et son passthroughBehavior est WHEN_NO_TEMPLATES. Un client envoie une requête POST dont l'en-tête Content-Type vaut text/xml.

    Que devient cette requête ?
body:
  options:
    - id: a
      text: { en: "API Gateway passes the XML body to the backend without transformation.", fr: "API Gateway transmet le corps XML au backend sans transformation." }
    - id: b
      text: { en: "API Gateway applies the application/json template to the XML body.", fr: "API Gateway applique le modèle application/json au corps XML." }
    - id: c
      text: { en: "API Gateway rejects the request with an HTTP 415 Unsupported Media Type response.", fr: "API Gateway rejette la requête avec une réponse HTTP 415 Unsupported Media Type." }
    - id: d
      text: { en: "API Gateway rejects the request with an HTTP 400 Bad Request response.", fr: "API Gateway rejette la requête avec une réponse HTTP 400 Bad Request." }
answer: { optionId: c }
explanation:
  correct:
    en: "With WHEN_NO_TEMPLATES, the body passes through untransformed only when the integration has no mapping template at all. This integration has a template, and text/xml matches none of its content types, so API Gateway rejects the request with 415 Unsupported Media Type."
    fr: "Avec WHEN_NO_TEMPLATES, le corps n'est transmis sans transformation que si l'intégration n'a aucun modèle de mappage. Cette intégration en a un, et text/xml ne correspond à aucun de ses types de contenu : API Gateway rejette la requête avec 415 Unsupported Media Type."
  options:
    a:
      en: "Passing an unmatched content type through unchanged is the WHEN_NO_MATCH behavior, not WHEN_NO_TEMPLATES."
      fr: "Transmettre sans modification un type de contenu sans correspondance est le comportement WHEN_NO_MATCH, pas WHEN_NO_TEMPLATES."
    b:
      en: "API Gateway selects a template by the request's Content-Type; it doesn't apply the application/json template to another content type."
      fr: "API Gateway choisit un modèle selon le Content-Type de la requête ; il n'applique pas le modèle application/json à un autre type de contenu."
    d:
      en: "A 400 error is returned when a request validator rejects parameters or a body, not for an unsupported content type in passthrough handling."
      fr: "Une erreur 400 est renvoyée quand un validateur de requête rejette des paramètres ou un corps, pas pour un type de contenu non pris en charge lors du transfert direct."
references:
  - title: Method request behavior for payloads without mapping templates for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/integration-passthrough-behaviors.html
