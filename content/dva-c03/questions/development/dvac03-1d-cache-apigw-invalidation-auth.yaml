id: dvac03-1d-cache-apigw-invalidation-auth
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's public Amazon API Gateway REST API caches GET responses on the prod stage. Some clients send the Cache-Control: max-age=0 header on every request, which bypasses the cache and overloads the backend. Only an internal operations IAM role, which signs its requests, must be able to refresh cache entries. Requests from any other client that include the header must be rejected with an error.

    Which solution will meet these requirements?
  fr: |
    L'API REST publique Amazon API Gateway d'AnyCompany met en cache les réponses GET sur l'étape prod. Certains clients envoient l'en-tête Cache-Control: max-age=0 à chaque requête, ce qui contourne le cache et surcharge le backend. Seul un rôle IAM interne d'exploitation, qui signe ses requêtes, doit pouvoir actualiser les entrées du cache. Les requêtes de tout autre client qui contiennent l'en-tête doivent être rejetées avec une erreur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Increase the cache TTL of the stage to 3,600 seconds so that entries are refreshed less often.", fr: "Augmenter le TTL du cache de l'étape à 3 600 secondes pour que les entrées soient actualisées moins souvent." } }
    - { id: b, text: { en: "Require authorization for cache invalidation with the FAIL_WITH_403 handling, and grant execute-api:InvalidateCache to the operations role.", fr: "Exiger une autorisation pour l'invalidation du cache avec le traitement FAIL_WITH_403, et accorder execute-api:InvalidateCache au rôle d'exploitation." } }
    - { id: c, text: { en: "Require authorization for cache invalidation with the SUCCEED_WITHOUT_RESPONSE_HEADER handling, and grant execute-api:InvalidateCache to the operations role.", fr: "Exiger une autorisation pour l'invalidation du cache avec le traitement SUCCEED_WITHOUT_RESPONSE_HEADER, et accorder execute-api:InvalidateCache au rôle d'exploitation." } }
    - { id: d, text: { en: "Enable encryption of the cache data and grant execute-api:Invoke only to the operations role.", fr: "Activer le chiffrement des données du cache et accorder execute-api:Invoke uniquement au rôle d'exploitation." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Without authorization on cache invalidation, any client can bypass and refresh an entry by sending Cache-Control: max-age=0. When authorization is required, only callers whose IAM policy allows execute-api:InvalidateCache on the method can invalidate it, and FAIL_WITH_403 rejects the other requests with a 403 status code.
    fr: |
      Sans autorisation sur l'invalidation du cache, n'importe quel client peut contourner et actualiser une entrée en envoyant Cache-Control: max-age=0. Quand l'autorisation est exigée, seuls les appelants dont la politique IAM autorise execute-api:InvalidateCache sur la méthode peuvent l'invalider, et FAIL_WITH_403 rejette les autres requêtes avec un code d'état 403.
  options:
    a: { en: "The header bypasses the cache whatever the TTL, so a longer TTL does not stop the clients from overloading the backend.", fr: "L'en-tête contourne le cache quel que soit le TTL : un TTL plus long n'empêche pas les clients de surcharger le backend." }
    c: { en: "SUCCEED_WITHOUT_RESPONSE_HEADER silently ignores the header and returns a normal response, but the requirement asks for an error.", fr: "SUCCEED_WITHOUT_RESPONSE_HEADER ignore l'en-tête en silence et renvoie une réponse normale, alors que l'exigence demande une erreur." }
    d: { en: "Restricting execute-api:Invoke would block every public client from calling the API, and encryption has no effect on invalidation.", fr: "Restreindre execute-api:Invoke empêcherait tous les clients publics d'appeler l'API, et le chiffrement n'a aucun effet sur l'invalidation." }
references:
  - title: Cache settings for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-caching.html
