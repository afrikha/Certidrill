id: dvac03-1c-vpc-s3-gateway-endpoint
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company has an AWS Lambda function that runs in private subnets of a VPC because it writes metadata to an Amazon ElastiCache cluster in that VPC. The function must now read objects from an Amazon S3 bucket in the same AWS Region. The VPC has no NAT gateway, and the security policy forbids sending this traffic through an internet gateway or a NAT device.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise de médias dispose d'une fonction AWS Lambda qui s'exécute dans des sous-réseaux privés d'un VPC, car elle écrit des métadonnées dans un cluster Amazon ElastiCache de ce VPC. La fonction doit maintenant lire des objets dans un compartiment Amazon S3 de la même Région AWS. Le VPC n'a pas de passerelle NAT, et la politique de sécurité interdit de faire passer ce trafic par une passerelle Internet ou un équipement NAT.

    Quelle solution répond à ces exigences de la manière la PLUS économique ?
body:
  options:
    - { id: a, text: { en: "Create a gateway VPC endpoint for Amazon S3, and associate it with the route tables of the function's subnets.", fr: "Créer un point de terminaison de VPC de type passerelle pour Amazon S3, et l'associer aux tables de routage des sous-réseaux de la fonction." } }
    - { id: b, text: { en: "Create an interface VPC endpoint for Amazon S3 in each of the function's subnets, and update the code to use the endpoint DNS name.", fr: "Créer un point de terminaison de VPC de type interface pour Amazon S3 dans chacun des sous-réseaux de la fonction, et modifier le code pour utiliser le nom DNS du point de terminaison." } }
    - { id: c, text: { en: "Create a NAT gateway in a public subnet, and route the S3 traffic of the private subnets to the NAT gateway.", fr: "Créer une passerelle NAT dans un sous-réseau public, et acheminer le trafic S3 des sous-réseaux privés vers la passerelle NAT." } }
    - { id: d, text: { en: "Remove the VPC configuration from the function so that it reaches Amazon S3 through the Lambda-managed network.", fr: "Supprimer la configuration VPC de la fonction afin qu'elle atteigne Amazon S3 par le réseau géré par Lambda." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A gateway endpoint adds a route to the S3 prefix list in the selected route tables, so traffic from the function's subnets reaches Amazon S3 without an internet gateway or a NAT device. Gateway endpoints have no additional charge, which makes them cheaper than interface endpoints."
    fr: "Un point de terminaison de type passerelle ajoute une route vers la liste de préfixes S3 dans les tables de routage sélectionnées : le trafic des sous-réseaux de la fonction atteint Amazon S3 sans passerelle Internet ni équipement NAT. Les points de terminaison de type passerelle n'entraînent aucun coût supplémentaire, ils sont donc moins chers que les points de terminaison de type interface."
  options:
    b:
      en: "An interface endpoint also keeps the traffic private, but it is billed per hour in each Availability Zone and per GB processed, and it needs a code change."
      fr: "Un point de terminaison de type interface garde aussi le trafic privé, mais il est facturé à l'heure dans chaque zone de disponibilité et par Go traité, et il demande une modification du code."
    c:
      en: "A NAT gateway is a NAT device, which the security policy forbids, and it adds hourly and data processing charges."
      fr: "Une passerelle NAT est un équipement NAT, que la politique de sécurité interdit, et elle ajoute des frais horaires et de traitement des données."
    d:
      en: "Without a VPC configuration, the function can no longer reach the ElastiCache cluster in the VPC."
      fr: "Sans configuration VPC, la fonction ne peut plus atteindre le cluster ElastiCache du VPC."
references:
  - title: Gateway endpoints for Amazon S3
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html
  - title: Gateway endpoints
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html
