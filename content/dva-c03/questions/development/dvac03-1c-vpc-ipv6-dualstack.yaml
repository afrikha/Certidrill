id: dvac03-1c-vpc-ipv6-dualstack
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function is connected to private dual-stack subnets (IPv4 and IPv6 CIDR blocks) of a VPC so that it can reach an Amazon ElastiCache cluster. The function must now send requests to a partner endpoint that is reachable only over IPv6. Hosts on the internet must not be able to initiate connections to the function's subnets.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda est connectée à des sous-réseaux privés à double pile (blocs CIDR IPv4 et IPv6) d'un VPC afin d'atteindre un cluster Amazon ElastiCache. La fonction doit maintenant envoyer des requêtes à un point de terminaison partenaire accessible uniquement en IPv6. Les hôtes d'Internet ne doivent pas pouvoir initier de connexions vers les sous-réseaux de la fonction.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep the function's network settings, and add a ::/0 route to an egress-only internet gateway in the route table of the subnets.", fr: "Conserver les paramètres réseau de la fonction, et ajouter une route ::/0 vers une passerelle Internet de sortie uniquement dans la table de routage des sous-réseaux." } }
    - { id: b, text: { en: "Set Ipv6AllowedForDualStack to true on the function, and add a ::/0 route to an egress-only internet gateway in the route table of the subnets.", fr: "Définir Ipv6AllowedForDualStack à true sur la fonction, et ajouter une route ::/0 vers une passerelle Internet de sortie uniquement dans la table de routage des sous-réseaux." } }
    - { id: c, text: { en: "Set Ipv6AllowedForDualStack to true, and connect the function to new IPv6-only subnets with a ::/0 route to an egress-only internet gateway.", fr: "Définir Ipv6AllowedForDualStack à true, et connecter la fonction à de nouveaux sous-réseaux IPv6 uniquement avec une route ::/0 vers une passerelle Internet de sortie uniquement." } }
    - { id: d, text: { en: "Remove the VPC configuration so that the function sends IPv6 traffic through the Lambda-managed network.", fr: "Supprimer la configuration VPC afin que la fonction envoie le trafic IPv6 par le réseau géré par Lambda." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Outbound IPv6 traffic from a VPC-connected function is off by default and is turned on with Ipv6AllowedForDualStack, which requires all of the function's subnets to be dual-stack. An egress-only internet gateway lets the IPv6 traffic out while it blocks connections initiated from the internet."
    fr: "Le trafic IPv6 sortant d'une fonction connectée à un VPC est désactivé par défaut et s'active avec Ipv6AllowedForDualStack, qui exige que tous les sous-réseaux de la fonction soient à double pile. Une passerelle Internet de sortie uniquement laisse sortir le trafic IPv6 tout en bloquant les connexions initiées depuis Internet."
  options:
    a:
      en: "Without Ipv6AllowedForDualStack, the function does not send IPv6 traffic, so the new route is never used."
      fr: "Sans Ipv6AllowedForDualStack, la fonction n'envoie pas de trafic IPv6 : la nouvelle route n'est jamais utilisée."
    c:
      en: "Lambda does not support IPv6-only subnets for outbound IPv6; the subnets must be dual-stack."
      fr: "Lambda ne prend pas en charge les sous-réseaux IPv6 uniquement pour le trafic IPv6 sortant ; les sous-réseaux doivent être à double pile."
    d:
      en: "Functions that are not connected to a VPC do not support outbound IPv6, and the function would lose access to the ElastiCache cluster."
      fr: "Les fonctions non connectées à un VPC ne prennent pas en charge le trafic IPv6 sortant, et la fonction perdrait l'accès au cluster ElastiCache."
references:
  - title: Enable internet access for VPC-connected Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc-internet.html
  - title: Giving Lambda Event Functions access to resources in an Amazon VPC
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html
