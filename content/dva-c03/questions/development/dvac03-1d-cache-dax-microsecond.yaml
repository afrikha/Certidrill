id: dvac03-1d-cache-dax-microsecond
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs a real-time bidding application that reads the same Amazon DynamoDB items thousands of times each second with GetItem calls. The application needs read latency in microseconds, and it can tolerate eventually consistent reads.

    The solution must require the LEAST change to the application code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une application d'enchères en temps réel qui lit les mêmes éléments Amazon DynamoDB des milliers de fois par seconde avec des appels GetItem. L'application a besoin d'une latence de lecture de l'ordre de la microseconde et elle tolère des lectures à cohérence éventuelle.

    La solution doit exiger le MOINS de modifications possible du code de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add an Amazon ElastiCache (Memcached) cluster and write lazy-loading logic around each DynamoDB call.", fr: "Ajouter un cluster Amazon ElastiCache (Memcached) et écrire une logique de chargement différé (lazy loading) autour de chaque appel DynamoDB." } }
    - { id: b, text: { en: "Create a DynamoDB Accelerator (DAX) cluster and replace the DynamoDB client with the DAX client.", fr: "Créer un cluster DynamoDB Accelerator (DAX) et remplacer le client DynamoDB par le client DAX." } }
    - { id: c, text: { en: "Increase the read capacity units of the table and switch the GetItem calls to strongly consistent reads.", fr: "Augmenter les unités de capacité de lecture de la table et passer les appels GetItem en lectures fortement cohérentes." } }
    - { id: d, text: { en: "Create a global secondary index that projects all attributes and send the reads to the index.", fr: "Créer un index secondaire global qui projette tous les attributs et envoyer les lectures vers l'index." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      DAX is a managed in-memory cache for DynamoDB that serves eventually consistent reads in microseconds instead of single-digit milliseconds, and it suits hot items read repeatedly. DAX is API-compatible with DynamoDB, so the application only swaps its client for the DAX client and keeps the same GetItem calls.
    fr: |
      DAX est un cache en mémoire géré pour DynamoDB qui sert les lectures à cohérence éventuelle en microsecondes au lieu de quelques millisecondes, et il convient aux éléments très sollicités lus de façon répétée. DAX est compatible avec l'API de DynamoDB : l'application remplace seulement son client par le client DAX et garde les mêmes appels GetItem.
  options:
    a: { en: "ElastiCache can cache the items, but the application must implement and maintain the caching logic around every call.", fr: "ElastiCache peut mettre les éléments en cache, mais l'application doit mettre en œuvre et maintenir la logique de cache autour de chaque appel." }
    c: { en: "More capacity prevents throttling but does not change DynamoDB latency, and strongly consistent reads cost twice as much.", fr: "Plus de capacité évite la limitation mais ne change pas la latence de DynamoDB, et les lectures fortement cohérentes coûtent deux fois plus." }
    d: { en: "A GSI is another DynamoDB data structure with the same latency; it does not support GetItem, so the code would also change to Query.", fr: "Un GSI est une autre structure de données DynamoDB, avec la même latence ; il ne prend pas en charge GetItem, donc le code devrait aussi passer à Query." }
references:
  - title: In-memory acceleration with DynamoDB Accelerator (DAX)
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.html
