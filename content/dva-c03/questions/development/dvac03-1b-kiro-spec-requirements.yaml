id: dvac03-1b-kiro-spec-requirements
objective: "1.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer uses a Kiro feature spec to build a new order-export API. The product owner wants to review the user stories and the acceptance criteria, written in the form `WHEN [condition] THE SYSTEM SHALL [behavior]`, before any task is implemented.

    Which spec file contains this content?
  fr: |
    Un développeur utilise une spec de fonctionnalité Kiro (feature spec) pour créer une nouvelle API d'export de commandes. Le responsable produit veut relire les récits utilisateur et les critères d'acceptation, écrits sous la forme `WHEN [condition] THE SYSTEM SHALL [behavior]`, avant l'implémentation de toute tâche.

    Quel fichier de la spec contient ce contenu ?
body:
  options:
    - { id: a, text: "requirements.md" }
    - { id: b, text: "design.md" }
    - { id: c, text: "tasks.md" }
    - { id: d, text: "product.md" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Kiro spec produces three files. requirements.md captures the user stories and acceptance criteria in EARS notation (WHEN condition THE SYSTEM SHALL behavior). design.md then describes the technical design, and tasks.md lists the discrete, trackable implementation tasks.
    fr: |
      Une spec Kiro produit trois fichiers. requirements.md contient les récits utilisateur et les critères d'acceptation en notation EARS (WHEN condition THE SYSTEM SHALL comportement). design.md décrit ensuite la conception technique, et tasks.md liste les tâches d'implémentation distinctes et suivies.
  options:
    b:
      en: "design.md contains the technical architecture, sequence diagrams and implementation considerations, not the acceptance criteria."
      fr: "design.md contient l'architecture technique, les diagrammes de séquence et les considérations d'implémentation, pas les critères d'acceptation."
    c:
      en: "tasks.md is the implementation plan of discrete tasks that Kiro executes and tracks."
      fr: "tasks.md est le plan d'implémentation en tâches distinctes que Kiro exécute et suit."
    d:
      en: "product.md is a steering file that describes the purpose and goals of the product for every interaction; it is not part of a spec."
      fr: "product.md est un fichier steering qui décrit l'objectif et les buts du produit pour chaque interaction ; il ne fait pas partie d'une spec."
references:
  - title: Feature Specs
    url: https://kiro.dev/docs/specs/feature-specs/
  - title: Specs
    url: https://kiro.dev/docs/specs/
