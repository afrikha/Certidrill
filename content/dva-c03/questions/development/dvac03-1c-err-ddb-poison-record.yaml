id: dvac03-1c-err-ddb-poison-record
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function processes an Amazon DynamoDB stream through an event source mapping that uses the default error handling settings. A record that makes the function fail blocked the processing of its shard for about one day, and the IteratorAge metric kept growing. The team wants failing records to be isolated so that the other records keep flowing, and wants a record of each discarded batch in an Amazon SQS queue.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une fonction AWS Lambda traite un flux Amazon DynamoDB par un mappage de source d'événements qui utilise les paramètres de gestion des erreurs par défaut. Un enregistrement qui fait échouer la fonction a bloqué le traitement de sa partition (shard) pendant environ un jour, et la métrique IteratorAge n'a cessé de croître. L'équipe souhaite que les enregistrements en échec soient isolés afin que les autres enregistrements continuent d'être traités, et veut un enregistrement de chaque lot rejeté dans une file d'attente Amazon SQS.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure the SQS queue as the dead-letter queue in the asynchronous invocation settings of the function.", fr: "Configurer la file d'attente SQS comme file d'attente de lettres mortes dans les paramètres d'appel asynchrone de la fonction." } }
    - { id: b, text: { en: "Set BisectBatchOnFunctionError to true on the event source mapping of the stream.", fr: "Définir BisectBatchOnFunctionError à true sur le mappage de source d'événements du flux." } }
    - { id: c, text: { en: "Set MaximumRetryAttempts to 2, and add the SQS queue as the on-failure destination of the event source mapping.", fr: "Définir MaximumRetryAttempts à 2, et ajouter la file d'attente SQS comme destination en cas d'échec du mappage de source d'événements." } }
    - { id: d, text: { en: "Change the StartingPosition of the event source mapping to LATEST so that the failing record is skipped.", fr: "Remplacer la StartingPosition du mappage de source d'événements par LATEST afin d'ignorer l'enregistrement en échec." } }
    - { id: e, text: { en: "Increase the BatchSize of the event source mapping to 1,000 so that each shard is processed faster.", fr: "Augmenter la BatchSize du mappage de source d'événements à 1 000 afin que chaque partition soit traitée plus vite." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "By default, a stream event source retries a failed batch until its records expire, which blocks the shard. BisectBatchOnFunctionError splits a failed batch in two so that the bad record is isolated in a small batch, and MaximumRetryAttempts with an on-failure destination discards that batch after a few attempts and sends an invocation record to the SQS queue."
    fr: "Par défaut, une source d'événements de flux relance un lot en échec jusqu'à l'expiration de ses enregistrements, ce qui bloque la partition. BisectBatchOnFunctionError divise un lot en échec en deux afin d'isoler l'enregistrement défectueux dans un petit lot, et MaximumRetryAttempts avec une destination en cas d'échec rejette ce lot après quelques tentatives et envoie un enregistrement d'appel à la file d'attente SQS."
  options:
    a:
      en: "A function's dead-letter queue applies only to asynchronous invocations, not to event source mappings."
      fr: "La file d'attente de lettres mortes d'une fonction ne s'applique qu'aux appels asynchrones, pas aux mappages de source d'événements."
    d:
      en: "StartingPosition only sets where an event source mapping starts reading; it does not change error handling, and it can skip records."
      fr: "StartingPosition détermine seulement où un mappage de source d'événements commence à lire ; elle ne change pas la gestion des erreurs et peut faire manquer des enregistrements."
    e:
      en: "A larger batch puts more records behind the failing one, so more records are retried and blocked."
      fr: "Un lot plus grand place davantage d'enregistrements derrière l'enregistrement en échec : davantage d'enregistrements sont relancés et bloqués."
references:
  - title: Retain discarded records for a DynamoDB event source in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-dynamodb-errors.html
