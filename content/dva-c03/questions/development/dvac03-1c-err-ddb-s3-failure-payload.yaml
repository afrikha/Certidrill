id: dvac03-1c-err-ddb-s3-failure-payload
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An event source mapping sends records from an Amazon DynamoDB stream to an AWS Lambda function. Discarded batches go to an on-failure destination that is an Amazon SNS topic. The operations team reports that the notifications contain only shard IDs and sequence numbers, and that the records have often expired from the stream when they start the investigation. The team needs the full content of each discarded batch for a later replay, without writing new code.

    Which solution will meet these requirements?
  fr: |
    Un mappage de source d'événements envoie les enregistrements d'un flux Amazon DynamoDB à une fonction AWS Lambda. Les lots rejetés vont vers une destination en cas d'échec qui est une rubrique Amazon SNS. L'équipe d'exploitation signale que les notifications ne contiennent que des ID de partition et des numéros de séquence, et que les enregistrements ont souvent expiré du flux lorsqu'elle commence l'analyse. L'équipe a besoin du contenu complet de chaque lot rejeté pour une relecture ultérieure, sans écrire de nouveau code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the on-failure destination to an Amazon S3 bucket, and allow s3:PutObject and s3:ListBucket in the execution role.", fr: "Remplacer la destination en cas d'échec par un compartiment Amazon S3, et autoriser s3:PutObject et s3:ListBucket dans le rôle d'exécution." } }
    - { id: b, text: { en: "Change the on-failure destination to an Amazon SQS standard queue, and allow sqs:SendMessage in the execution role.", fr: "Remplacer la destination en cas d'échec par une file d'attente standard Amazon SQS, et autoriser sqs:SendMessage dans le rôle d'exécution." } }
    - { id: c, text: { en: "Add an Amazon SQS dead-letter queue to the asynchronous invocation configuration of the function.", fr: "Ajouter une file d'attente de lettres mortes Amazon SQS à la configuration d'appel asynchrone de la fonction." } }
    - { id: d, text: { en: "Add ReportBatchItemFailures to the FunctionResponseTypes of the event source mapping.", fr: "Ajouter ReportBatchItemFailures aux FunctionResponseTypes du mappage de source d'événements." } }
answer: { optionId: a }
explanation:
  correct:
    en: "For a DynamoDB event source, SQS and SNS destinations receive only metadata about the failed batch, so the records must be read from the stream before they expire. An S3 destination receives the metadata plus a payload field that contains the entire original invocation record."
    fr: "Pour une source d'événements DynamoDB, les destinations SQS et SNS ne reçoivent que des métadonnées sur le lot en échec : les enregistrements doivent être lus dans le flux avant leur expiration. Une destination S3 reçoit les métadonnées et un champ payload qui contient l'intégralité de l'enregistrement d'appel d'origine."
  options:
    b:
      en: "An SQS destination receives the same metadata-only record as SNS, so the records still expire from the stream."
      fr: "Une destination SQS reçoit le même enregistrement de métadonnées seulement que SNS : les enregistrements expirent toujours du flux."
    c:
      en: "Asynchronous invocation settings do not apply to event source mappings, so the queue receives nothing."
      fr: "Les paramètres d'appel asynchrone ne s'appliquent pas aux mappages de source d'événements : la file d'attente ne reçoit rien."
    d:
      en: "Partial batch responses reduce the retries of successful records; they do not keep the content of discarded batches."
      fr: "Les réponses de lot partielles réduisent les nouvelles tentatives sur les enregistrements réussis ; elles ne conservent pas le contenu des lots rejetés."
references:
  - title: Retain discarded records for a DynamoDB event source in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-dynamodb-errors.html
