id: dvac03-1c-int-sqs-max-concurrency
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function has two Amazon SQS event source mappings: one for a queue named orders-queue and one for a queue named audit-queue. Messages from audit-queue are written to a legacy database that accepts at most 10 concurrent connections. Messages from orders-queue must keep scaling with demand. The function has no reserved concurrency.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une fonction AWS Lambda possède deux mappages de source d'événements Amazon SQS : l'un pour une file d'attente nommée orders-queue et l'autre pour une file d'attente nommée audit-queue. Les messages d'audit-queue sont écrits dans une base de données héritée qui accepte au plus 10 connexions simultanées. Les messages d'orders-queue doivent continuer à s'adapter à la demande. La fonction n'a pas de simultanéité réservée.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Set the reserved concurrency of the function to 10 so that the legacy database is protected.", fr: "Définir la simultanéité réservée de la fonction à 10 afin de protéger la base de données héritée." } }
    - { id: b, text: { en: "Set the batch size of the audit-queue event source mapping to 1 so that each invocation opens one connection.", fr: "Définir la taille de lot du mappage de source d'événements d'audit-queue à 1 afin que chaque appel ouvre une connexion." } }
    - { id: c, text: { en: "Set MaximumConcurrency to 10 in the ScalingConfig of the audit-queue event source mapping.", fr: "Définir MaximumConcurrency à 10 dans la ScalingConfig du mappage de source d'événements d'audit-queue." } }
    - { id: d, text: { en: "Replace audit-queue with a FIFO queue, and make the producers use 10 message group IDs.", fr: "Remplacer audit-queue par une file d'attente FIFO, et faire utiliser 10 ID de groupe de messages par les producteurs." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Maximum concurrency is set per SQS event source, so it limits the concurrent invocations that audit-queue can drive without limiting orders-queue. It has no charge and needs no change to the queues or the producers."
    fr: "La simultanéité maximale se définit par source d'événements SQS : elle limite les appels simultanés qu'audit-queue peut déclencher sans limiter orders-queue. Elle n'entraîne aucun coût et ne demande aucune modification des files d'attente ni des producteurs."
  options:
    a:
      en: "Reserved concurrency caps the whole function, so orders-queue would also be limited to 10 concurrent executions."
      fr: "La simultanéité réservée plafonne toute la fonction : orders-queue serait aussi limitée à 10 exécutions simultanées."
    b:
      en: "The batch size changes how many messages each invocation receives, not how many invocations run at the same time."
      fr: "La taille de lot change le nombre de messages reçus par chaque appel, pas le nombre d'appels exécutés en même temps."
    d:
      en: "FIFO concurrency is bounded by the number of message groups, but replacing the queue and changing the producers is much more work."
      fr: "La simultanéité FIFO est bornée par le nombre de groupes de messages, mais remplacer la file d'attente et modifier les producteurs demande beaucoup plus de travail."
references:
  - title: Configuring scaling behavior for SQS event source mappings
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-scaling.html
