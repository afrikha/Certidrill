id: dvac03-1b-kiro-mcp-server
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company publishes its internal service catalog, with the current API contracts of each microservice, through a Model Context Protocol (MCP) server. Developers use the Kiro agent to generate client code for these APIs, and the generated code often uses outdated request formats. The agent must be able to look up the current contracts by itself when it generates code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise publie son catalogue interne de services, avec les contrats d'API actuels de chaque microservice, au moyen d'un serveur Model Context Protocol (MCP). Les développeurs utilisent l'agent Kiro pour générer du code client pour ces API, et le code généré utilise souvent des formats de requête obsolètes. L'agent doit pouvoir consulter lui-même les contrats actuels quand il génère du code.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Copy the current API contracts into a steering file and update the file after each API release.", fr: "Copier les contrats d'API actuels dans un fichier steering et mettre à jour le fichier après chaque version d'API." }
    - id: b
      text: { en: "Create a hook with a Prompt Submit trigger that appends the text of the whole catalog to every prompt.", fr: "Créer un hook avec un déclencheur Prompt Submit qui ajoute le texte de tout le catalogue à chaque invite." }
    - id: c
      text: { en: "Add the catalog MCP server to the workspace MCP configuration of Kiro so that the agent can call its tools.", fr: "Ajouter le serveur MCP du catalogue à la configuration MCP de l'espace de travail de Kiro afin que l'agent puisse appeler ses outils." }
    - id: d
      text: { en: "Add the URL of the catalog home page to the design.md file of each spec.", fr: "Ajouter l'URL de la page d'accueil du catalogue dans le fichier design.md de chaque spec." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Kiro supports MCP servers, configured in the workspace or user MCP configuration, and gives their tools to the agent. With the catalog server configured, the agent can query the current contracts when it needs them, so the generated code follows the latest request formats without manual copies.
    fr: |
      Kiro prend en charge les serveurs MCP, configurés dans la configuration MCP de l'espace de travail ou de l'utilisateur, et met leurs outils à la disposition de l'agent. Avec le serveur du catalogue configuré, l'agent peut interroger les contrats actuels quand il en a besoin : le code généré suit les formats de requête les plus récents sans copie manuelle.
  options:
    a:
      en: "A copied contract becomes outdated as soon as an API changes, which is the problem the company wants to solve, and it must be maintained by hand."
      fr: "Un contrat copié devient obsolète dès qu'une API change, ce qui est le problème que l'entreprise veut résoudre, et il doit être maintenu à la main."
    b:
      en: "Adding the whole catalog to every prompt wastes context on unrelated contracts and does not let the agent query what it needs."
      fr: "Ajouter tout le catalogue à chaque invite gaspille du contexte avec des contrats sans rapport et ne permet pas à l'agent d'interroger ce dont il a besoin."
    d:
      en: "A URL in a design document is not a tool that the agent can call to retrieve the current contracts."
      fr: "Une URL dans un document de conception n'est pas un outil que l'agent peut appeler pour récupérer les contrats actuels."
references:
  - title: MCP
    url: https://kiro.dev/docs/mcp/
