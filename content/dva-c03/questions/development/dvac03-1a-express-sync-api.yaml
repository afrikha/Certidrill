id: dvac03-1a-express-sync-api
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's API must call three microservices, combine their responses, and return the combined result to the client in the same HTTP response. The full process takes less than 10 seconds. The company wants built-in retries and error handling for each call without writing that logic in code, and wants to pay for executions and their duration rather than for each state transition.

    Which solution will meet these requirements?
  fr: |
    L'API d'une entreprise doit appeler trois microservices, combiner leurs réponses et renvoyer le résultat combiné au client dans la même réponse HTTP. Le processus complet dure moins de 10 secondes. L'entreprise veut des nouvelles tentatives et une gestion des erreurs intégrées pour chaque appel sans écrire cette logique dans du code, et veut payer selon les exécutions et leur durée plutôt que selon chaque transition d'état.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Have Amazon API Gateway start an AWS Step Functions Standard workflow with StartExecution and return the execution ARN.", fr: "Faire démarrer par Amazon API Gateway un flux de travail Standard AWS Step Functions avec StartExecution et renvoyer l'ARN de l'exécution." }
    - id: b
      text: { en: "Have Amazon API Gateway start an asynchronous AWS Step Functions Express workflow and return the execution ARN.", fr: "Faire démarrer par Amazon API Gateway un flux de travail Express asynchrone AWS Step Functions et renvoyer l'ARN de l'exécution." }
    - id: c
      text: { en: "Have Amazon API Gateway start a synchronous AWS Step Functions Express workflow with StartSyncExecution and return its output.", fr: "Faire démarrer par Amazon API Gateway un flux de travail Express synchrone AWS Step Functions avec StartSyncExecution et renvoyer sa sortie." }
    - id: d
      text: { en: "Have Amazon API Gateway invoke a Lambda function that calls the three microservices with custom retry code.", fr: "Faire invoquer par Amazon API Gateway une fonction Lambda qui appelle les trois microservices avec du code de nouvelle tentative spécifique." }
answer: { optionId: c }
explanation:
  correct:
    en: "A synchronous Express workflow starts, waits for the workflow to finish, and returns its result, so API Gateway can return the combined output in the same response. Retry and Catch fields provide the error handling, and Express workflows are billed on the number of executions, their duration and memory."
    fr: "Un flux de travail Express synchrone démarre, attend la fin du flux et renvoie son résultat : API Gateway peut renvoyer la sortie combinée dans la même réponse. Les champs Retry et Catch fournissent la gestion des erreurs, et les flux Express sont facturés selon le nombre d'exécutions, leur durée et la mémoire."
  options:
    a:
      en: "StartExecution returns as soon as the execution starts, so the client gets an ARN instead of the result, and Standard workflows are billed per state transition."
      fr: "StartExecution répond dès que l'exécution démarre : le client reçoit un ARN au lieu du résultat, et les flux Standard sont facturés par transition d'état."
    b:
      en: "An asynchronous Express workflow confirms only that it started; the result isn't returned to the caller."
      fr: "Un flux Express asynchrone confirme seulement qu'il a démarré ; le résultat n'est pas renvoyé à l'appelant."
    d:
      en: "This returns the result synchronously, but the retries and error handling are written in code, which the company wants to avoid."
      fr: "Cette solution renvoie le résultat de manière synchrone, mais les nouvelles tentatives et la gestion des erreurs sont écrites dans du code, ce que l'entreprise veut éviter."
references:
  - title: Choosing workflow type in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
