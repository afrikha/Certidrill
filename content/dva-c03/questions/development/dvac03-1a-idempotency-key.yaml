id: dvac03-1a-idempotency-key
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payment API runs on Amazon API Gateway and AWS Lambda. When a response is slow, mobile clients time out and retry the same request, and some customers are charged twice. The company wants the clients to keep retrying after timeouts.

    Which solution will prevent duplicate charges?
  fr: |
    Une API de paiement s'exécute sur Amazon API Gateway et AWS Lambda. Quand une réponse est lente, les clients mobiles expirent et relancent la même requête, et certains clients sont débités deux fois. L'entreprise veut que les clients continuent de réessayer après une expiration.

    Quelle solution empêchera les doubles débits ?
body:
  options:
    - id: a
      text: { en: "Have clients send an idempotency key that the function stores with a conditional write before charging.", fr: "Faire envoyer par les clients une clé d'idempotence que la fonction stocke avec une écriture conditionnelle avant le débit." }
    - id: b
      text: { en: "Turn off retries in the mobile clients and show the customer an error when a request times out.", fr: "Désactiver les nouvelles tentatives dans les clients mobiles et afficher une erreur au client quand une requête expire." }
    - id: c
      text: { en: "Set the reserved concurrency of the Lambda function to 1 so that requests run one at a time.", fr: "Définir la simultanéité réservée de la fonction Lambda à 1 pour que les requêtes s'exécutent une par une." }
    - id: d
      text: { en: "Increase the Lambda function timeout so that fewer requests reach the timeout of the mobile clients.", fr: "Augmenter le délai d'expiration de la fonction Lambda pour que moins de requêtes atteignent le délai des clients mobiles." }
answer: { optionId: a }
explanation:
  correct:
    en: "Retries are safe only when the operation is idempotent. The client reuses the same key for each retry, and the function writes the key to a DynamoDB table with a condition such as attribute_not_exists, so a retry finds the key and returns the stored result instead of charging the card again."
    fr: "Les nouvelles tentatives ne sont sûres que si l'opération est idempotente. Le client réutilise la même clé à chaque nouvelle tentative, et la fonction écrit la clé dans une table DynamoDB avec une condition comme attribute_not_exists : une nouvelle tentative trouve la clé et renvoie le résultat stocké au lieu de débiter à nouveau la carte."
  options:
    b:
      en: "The company wants clients to keep retrying; without retries, transient failures become errors for customers."
      fr: "L'entreprise veut que les clients continuent de réessayer ; sans nouvelles tentatives, les échecs transitoires deviennent des erreurs pour les clients."
    c:
      en: "Running requests one at a time doesn't recognize a retry as a duplicate, so the second request still charges the card, and throughput collapses."
      fr: "Exécuter les requêtes une par une ne reconnaît pas une nouvelle tentative comme un doublon : la seconde requête débite toujours la carte, et le débit s'effondre."
    d:
      en: "The client timeout doesn't depend on the function timeout; slow responses still cause retries that are processed again."
      fr: "Le délai du client ne dépend pas de celui de la fonction ; les réponses lentes provoquent toujours des nouvelles tentatives traitées une seconde fois."
references:
  - title: Retry with backoff pattern
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/retry-backoff.html
  - title: Working with items and attributes in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithItems.html
