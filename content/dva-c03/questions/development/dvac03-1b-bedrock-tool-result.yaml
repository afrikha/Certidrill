id: dvac03-1b-bedrock-tool-result
objective: "1.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A developer gives a model a `get_order_status` tool through the `toolConfig` of the Amazon Bedrock Converse API. The first call returns `stopReason` `tool_use`. The code runs the tool and must now send its result so that the model can write the final answer.

    ```python
    response = client.converse(modelId=MODEL_ID, messages=messages, toolConfig=tool_config)
    if response["stopReason"] == "tool_use":
        assistant_msg = response["output"]["message"]
        tool = next(c["toolUse"] for c in assistant_msg["content"] if "toolUse" in c)
        status = get_order_status(**tool["input"])
        # NEXT STEP
        final = client.converse(modelId=MODEL_ID, messages=messages, toolConfig=tool_config)
    ```

    Which code should replace `# NEXT STEP`?
  fr: |
    Un développeur fournit à un modèle un outil `get_order_status` au moyen du `toolConfig` de l'API Converse d'Amazon Bedrock. Le premier appel renvoie le `stopReason` `tool_use`. Le code exécute l'outil et doit maintenant envoyer son résultat pour que le modèle puisse rédiger la réponse finale.

    ```python
    response = client.converse(modelId=MODEL_ID, messages=messages, toolConfig=tool_config)
    if response["stopReason"] == "tool_use":
        assistant_msg = response["output"]["message"]
        tool = next(c["toolUse"] for c in assistant_msg["content"] if "toolUse" in c)
        status = get_order_status(**tool["input"])
        # NEXT STEP
        final = client.converse(modelId=MODEL_ID, messages=messages, toolConfig=tool_config)
    ```

    Quel code doit remplacer `# NEXT STEP` ?
body:
  options:
    - id: a
      text: "`messages.append({\"role\": \"user\", \"content\": [{\"toolResult\": {\"toolUseId\": tool[\"toolUseId\"], \"content\": [{\"json\": status}]}}]})`"
    - id: b
      text: "`messages.append(assistant_msg)` then `messages.append({\"role\": \"user\", \"content\": [{\"toolResult\": {\"toolUseId\": tool[\"toolUseId\"], \"content\": [{\"json\": status}]}}]})`"
    - id: c
      text: "`messages.append(assistant_msg)` then `messages.append({\"role\": \"assistant\", \"content\": [{\"toolResult\": {\"toolUseId\": tool[\"toolUseId\"], \"content\": [{\"json\": status}]}}]})`"
    - id: d
      text: "`messages.append(assistant_msg)` then `messages.append({\"role\": \"user\", \"content\": [{\"text\": json.dumps(status)}]})`"
answer: { optionId: b }
explanation:
  correct:
    en: |
      After a tool_use stop, the conversation must contain the assistant message with the toolUse block, followed by a user message with a toolResult block whose toolUseId matches the request. The content of the result can be JSON or text, and a status of error can report a failed tool. The next Converse call then lets the model use the result.
    fr: |
      Après un arrêt tool_use, la conversation doit contenir le message de l'assistant avec le bloc toolUse, suivi d'un message user avec un bloc toolResult dont le toolUseId correspond à la demande. Le contenu du résultat peut être du JSON ou du texte, et un status error peut signaler un outil en échec. L'appel Converse suivant permet alors au modèle d'utiliser le résultat.
  options:
    a:
      en: "Without the assistant message that contains the toolUse block, the toolResult refers to a tool request that is missing from the conversation."
      fr: "Sans le message de l'assistant qui contient le bloc toolUse, le toolResult fait référence à une demande d'outil absente de la conversation."
    c:
      en: "Tool results are sent back in a message with the user role, not the assistant role."
      fr: "Les résultats d'outil sont renvoyés dans un message de rôle user, pas de rôle assistant."
    d:
      en: "A plain text message is not linked to the tool request; the result must be a toolResult block with the matching toolUseId."
      fr: "Un simple message texte n'est pas lié à la demande d'outil ; le résultat doit être un bloc toolResult avec le toolUseId correspondant."
references:
  - title: Client-side tool use
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/tool-use-client-side.html
