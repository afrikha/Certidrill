id: dvac03-1c-err-sqs-partial-batch
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function sends order confirmation emails. It reads an Amazon SQS standard queue through an event source mapping with a batch size of 10. When one message of a batch fails, the function raises an exception, and all 10 messages return to the queue. The messages that were already processed are processed again, and customers receive duplicate emails. The batch size must stay at 10.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une fonction AWS Lambda envoie des e-mails de confirmation de commande. Elle lit une file d'attente standard Amazon SQS par un mappage de source d'événements avec une taille de lot de 10. Lorsqu'un message d'un lot échoue, la fonction lève une exception, et les 10 messages reviennent dans la file d'attente. Les messages déjà traités sont traités de nouveau, et les clients reçoivent des e-mails en double. La taille de lot doit rester à 10.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add ReportBatchItemFailures to the FunctionResponseTypes of the event source mapping.", fr: "Ajouter ReportBatchItemFailures aux FunctionResponseTypes du mappage de source d'événements." } }
    - { id: b, text: { en: "Set BisectBatchOnFunctionError to true on the event source mapping so that failed batches are split in two.", fr: "Définir BisectBatchOnFunctionError à true sur le mappage de source d'événements afin de diviser en deux les lots en échec." } }
    - { id: c, text: { en: "Increase the visibility timeout of the queue to six times the timeout of the function.", fr: "Augmenter le délai de visibilité de la file d'attente à six fois le délai d'expiration de la fonction." } }
    - { id: d, text: { en: "Catch errors per message, and return a batchItemFailures list with the messageId of each failed message.", fr: "Intercepter les erreurs par message, et renvoyer une liste batchItemFailures avec le messageId de chaque message en échec." } }
    - { id: e, text: { en: "Call DeleteMessage for each failed message before the function raises its exception.", fr: "Appeler DeleteMessage pour chaque message en échec avant que la fonction lève son exception." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "With ReportBatchItemFailures enabled, Lambda reads the function's response and makes only the listed messages visible again; the other messages of the batch are deleted. The function must catch errors per message instead of raising an exception, because an uncaught exception still fails the whole batch."
    fr: "Avec ReportBatchItemFailures activé, Lambda lit la réponse de la fonction et ne rend visibles de nouveau que les messages listés ; les autres messages du lot sont supprimés. La fonction doit intercepter les erreurs message par message au lieu de lever une exception, car une exception non interceptée fait toujours échouer tout le lot."
  options:
    b:
      en: "BisectBatchOnFunctionError applies to Kinesis, DynamoDB Streams and Kafka event sources, not to SQS."
      fr: "BisectBatchOnFunctionError s'applique aux sources d'événements Kinesis, DynamoDB Streams et Kafka, pas à SQS."
    c:
      en: "The recommended visibility timeout gives Lambda time to retry, but a failed batch still returns all of its messages to the queue."
      fr: "Le délai de visibilité recommandé laisse à Lambda le temps de relancer, mais un lot en échec renvoie toujours tous ses messages dans la file d'attente."
    e:
      en: "Deleting the failed messages loses them instead of retrying them, and the successful ones are still reprocessed when the function raises an exception."
      fr: "Supprimer les messages en échec les perd au lieu de les relancer, et les messages réussis sont toujours retraités lorsque la fonction lève une exception."
references:
  - title: Handling errors for an SQS event source in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-errorhandling.html
