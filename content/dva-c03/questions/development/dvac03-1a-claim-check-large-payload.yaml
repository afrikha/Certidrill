id: dvac03-1a-claim-check-large-payload
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company sends a message to an Amazon SQS standard queue for each uploaded document. Some messages must carry scanned documents of up to 40 MB to the processing service, which is written in Python. The company wants to keep Amazon SQS to decouple the components and wants the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias envoie un message dans une file d'attente Amazon SQS standard pour chaque document chargé. Certains messages doivent transporter des documents numérisés allant jusqu'à 40 Mo vers le service de traitement, écrit en Python. L'entreprise veut conserver Amazon SQS pour découpler les composants et veut l'effort de développement le MOINS important.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set the MaximumMessageSize attribute of the queue to 40 MB.", fr: "Définir l'attribut MaximumMessageSize de la file d'attente à 40 Mo." }
    - id: b
      text: { en: "Split each document into chunks, send them as separate messages, and reassemble them in the consumer.", fr: "Découper chaque document en morceaux, les envoyer comme messages distincts et les réassembler dans le consommateur." }
    - id: c
      text: { en: "Replace the queue with an Amazon SNS topic so that the processing service receives larger messages.", fr: "Remplacer la file d'attente par une rubrique Amazon SNS pour que le service de traitement reçoive des messages plus volumineux." }
    - id: d
      text: { en: "Use the Amazon SQS Extended Client Library to store each payload in Amazon S3 and send a reference in the message.", fr: "Utiliser l'Amazon SQS Extended Client Library pour stocker chaque charge utile dans Amazon S3 et envoyer une référence dans le message." }
answer: { optionId: d }
explanation:
  correct:
    en: "An SQS message is limited to 1 MiB. The Extended Client Library (available for Java and Python) stores the payload in an S3 bucket and sends only a reference to the object through the queue, which supports payloads of up to 2 GB with standard or FIFO queues and almost no custom code."
    fr: "Un message SQS est limité à 1 Mio. L'Extended Client Library (disponible pour Java et Python) stocke la charge utile dans un compartiment S3 et n'envoie qu'une référence à l'objet dans la file, ce qui prend en charge des charges utiles jusqu'à 2 Go avec des files standard ou FIFO et presque sans code spécifique."
  options:
    a:
      en: "MaximumMessageSize can't exceed 1 MiB (1,048,576 bytes), so it can't be set to 40 MB."
      fr: "MaximumMessageSize ne peut pas dépasser 1 Mio (1 048 576 octets) : il ne peut pas être défini à 40 Mo."
    b:
      en: "Chunking works only with custom code for splitting, ordering, reassembly and missing parts, which is far more effort than the library."
      fr: "Le découpage ne fonctionne qu'avec du code spécifique pour découper, ordonner, réassembler et gérer les parties manquantes, ce qui demande bien plus d'effort que la bibliothèque."
    c:
      en: "SNS messages also have a size limit far below 40 MB, and a topic pushes messages instead of keeping them for the consumer, so the company would lose the queue."
      fr: "Les messages SNS ont aussi une limite de taille très inférieure à 40 Mo, et une rubrique pousse les messages au lieu de les conserver pour le consommateur : l'entreprise perdrait la file d'attente."
references:
  - title: Managing large Amazon SQS messages with Extended Client Library and Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-managing-large-messages.html
  - title: Amazon SQS message quotas
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-messages.html
