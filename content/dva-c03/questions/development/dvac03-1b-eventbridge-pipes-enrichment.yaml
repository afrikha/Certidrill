id: dvac03-1b-eventbridge-pipes-enrichment
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online store writes order messages to an Amazon SQS queue. Only orders with a `priority` of `express` must start an AWS Step Functions state machine, and each order must first be enriched with customer data returned by an existing internal HTTP API. Today a developer maintains a Lambda function that polls the queue, filters, calls the API and starts the state machine. The company wants to remove this integration code.

    Which solution will meet these requirements?
  fr: |
    Une boutique en ligne écrit des messages de commande dans une file d'attente Amazon SQS. Seules les commandes dont la `priority` vaut `express` doivent démarrer une machine d'état AWS Step Functions, et chaque commande doit d'abord être enrichie avec les données client renvoyées par une API HTTP interne existante. Aujourd'hui, un développeur maintient une fonction Lambda qui interroge la file d'attente, filtre, appelle l'API et démarre la machine d'état. L'entreprise veut supprimer ce code d'intégration.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add filter criteria on priority to the event source mapping of the existing function, and keep the function for the API call.", fr: "Ajouter des critères de filtre sur priority au mappage de source d'événements de la fonction existante, et conserver la fonction pour l'appel d'API." }
    - id: b
      text: { en: "Create an EventBridge rule on the default event bus with an event pattern on priority, and add the queue and the state machine as targets.", fr: "Créer une règle EventBridge sur le bus d'événements par défaut avec un modèle d'événement sur priority, et ajouter la file d'attente et la machine d'état comme cibles." }
    - id: c
      text: { en: "Subscribe the queue to an Amazon SNS topic with a filter policy on priority, and subscribe the state machine to the topic.", fr: "Abonner la file d'attente à une rubrique Amazon SNS avec une politique de filtrage sur priority, et abonner la machine d'état à la rubrique." }
    - id: d
      text: { en: "Create an EventBridge pipe with the queue as the source, a filter on priority, an API destination for enrichment, and the state machine as the target.", fr: "Créer un pipe EventBridge avec la file d'attente comme source, un filtre sur priority, une destination d'API pour l'enrichissement et la machine d'état comme cible." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      EventBridge Pipes connects one source to one target with optional filtering and enrichment and no integration code. The pipe reads the SQS queue, keeps only the express orders (and charges only for matching events), calls the HTTP API through an API destination to enrich each order, and starts the state machine.
    fr: |
      EventBridge Pipes relie une source à une cible avec un filtrage et un enrichissement facultatifs, sans code d'intégration. Le pipe lit la file d'attente SQS, ne conserve que les commandes express (et ne facture que les événements correspondants), appelle l'API HTTP au moyen d'une destination d'API pour enrichir chaque commande, et démarre la machine d'état.
  options:
    b:
      en: "Messages sent to an SQS queue are not events on an event bus, so a rule cannot read them, and a rule has no enrichment step."
      fr: "Les messages envoyés à une file d'attente SQS ne sont pas des événements d'un bus d'événements : une règle ne peut pas les lire, et une règle n'a pas d'étape d'enrichissement."
    c:
      en: "A queue is a subscriber of a topic, not a publisher, and SNS cannot enrich messages or subscribe a state machine directly."
      fr: "Une file d'attente est un abonné d'une rubrique, pas un éditeur, et SNS ne peut ni enrichir les messages ni abonner directement une machine d'état."
    a:
      en: "Filtering in the event source mapping reduces invocations but keeps the function and its integration code, which the company wants to remove."
      fr: "Le filtrage dans le mappage de source d'événements réduit les invocations mais conserve la fonction et son code d'intégration, que l'entreprise veut supprimer."
references:
  - title: Amazon EventBridge Pipes
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-pipes.html
