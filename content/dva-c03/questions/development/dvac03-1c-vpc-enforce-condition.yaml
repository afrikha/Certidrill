id: dvac03-1c-vpc-enforce-condition
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company requires every AWS Lambda function in an AWS account to be connected to a VPC. An administrator is writing an identity-based policy for the developer roles. The policy contains a statement that denies the lambda:CreateFunction and lambda:UpdateFunctionConfiguration actions on all resources when a condition is met.

    Which condition will meet this requirement?
  fr: |
    Une entreprise exige que chaque fonction AWS Lambda d'un compte AWS soit connectée à un VPC. Un administrateur rédige une politique basée sur l'identité pour les rôles des développeurs. La politique contient une instruction qui refuse les actions lambda:CreateFunction et lambda:UpdateFunctionConfiguration sur toutes les ressources lorsqu'une condition est remplie.

    Quelle condition répond à cette exigence ?
body:
  options:
    - { id: a, text: '`"Null": { "aws:SourceVpc": "true" }`' }
    - { id: b, text: '`"Null": { "lambda:FunctionUrlAuthType": "true" }`' }
    - { id: c, text: '`"Null": { "lambda:VpcIds": "true" }`' }
    - { id: d, text: '`"StringNotEquals": { "ec2:Vpc": "arn:aws:ec2:*:*:vpc/*" }`' }
answer: { optionId: c }
explanation:
  correct:
    en: "Lambda supports the lambda:VpcIds, lambda:SubnetIds and lambda:SecurityGroupIds condition keys for CreateFunction and UpdateFunctionConfiguration. When a request has no VPC settings, lambda:VpcIds is null, so the Deny statement blocks any function that is not connected to a VPC. Lambda derives the VPC ID from the subnets and security groups of the request."
    fr: "Lambda prend en charge les clés de condition lambda:VpcIds, lambda:SubnetIds et lambda:SecurityGroupIds pour CreateFunction et UpdateFunctionConfiguration. Lorsqu'une requête ne contient aucun paramètre VPC, lambda:VpcIds est nul : l'instruction Deny bloque toute fonction qui n'est pas connectée à un VPC. Lambda déduit l'ID du VPC des sous-réseaux et des groupes de sécurité de la requête."
  options:
    a:
      en: "aws:SourceVpc describes the VPC endpoint through which the API request is sent, not the VPC configuration of the function."
      fr: "aws:SourceVpc décrit le point de terminaison de VPC par lequel la requête d'API est envoyée, pas la configuration VPC de la fonction."
    b:
      en: "lambda:FunctionUrlAuthType applies to function URL operations; it says nothing about the VPC configuration."
      fr: "lambda:FunctionUrlAuthType s'applique aux opérations sur les URL de fonction ; elle n'indique rien sur la configuration VPC."
    d:
      en: "EC2 condition keys are not evaluated for Lambda API actions, so this condition cannot detect a missing VPC configuration."
      fr: "Les clés de condition EC2 ne sont pas évaluées pour les actions de l'API Lambda : cette condition ne peut pas détecter une configuration VPC absente."
references:
  - title: Giving Lambda Event Functions access to resources in an Amazon VPC
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html
