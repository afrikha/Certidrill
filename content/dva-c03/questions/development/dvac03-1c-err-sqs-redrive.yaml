id: dvac03-1c-err-sqs-redrive
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function processes messages from an Amazon SQS standard queue through an event source mapping. Some malformed messages always make the function fail. They return to the queue again and again until the retention period ends, which wastes invocations. After five failed processing attempts, a message must be moved to another queue for analysis.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda traite des messages d'une file d'attente standard Amazon SQS par un mappage de source d'événements. Certains messages mal formés font toujours échouer la fonction. Ils reviennent sans cesse dans la file d'attente jusqu'à la fin de la période de conservation, ce qui gaspille des appels. Après cinq tentatives de traitement en échec, un message doit être déplacé vers une autre file d'attente pour analyse.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure the analysis queue as the dead-letter queue in the asynchronous invocation settings of the function.", fr: "Configurer la file d'attente d'analyse comme file d'attente de lettres mortes dans les paramètres d'appel asynchrone de la fonction." } }
    - { id: b, text: { en: "Configure the analysis queue as the on-failure destination of the SQS event source mapping.", fr: "Configurer la file d'attente d'analyse comme destination en cas d'échec du mappage de source d'événements SQS." } }
    - { id: c, text: { en: "Add a redrive policy to the source queue that targets the analysis queue with maxReceiveCount set to 5.", fr: "Ajouter à la file d'attente source une politique de redirection vers la file d'attente d'analyse avec maxReceiveCount défini à 5." } }
    - { id: d, text: { en: "Set MaximumRetryAttempts to 5 on the event source mapping, and configure the analysis queue as its destination.", fr: "Définir MaximumRetryAttempts à 5 sur le mappage de source d'événements, et configurer la file d'attente d'analyse comme sa destination." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With an SQS event source, a failed message becomes visible again after the visibility timeout, and its receive count increases. A redrive policy on the source queue moves the message to the dead-letter queue when the receive count exceeds maxReceiveCount. Lambda documents that the DLQ for an SQS event source is configured on the source queue, not on the function."
    fr: "Avec une source d'événements SQS, un message en échec redevient visible après le délai de visibilité, et son nombre de réceptions augmente. Une politique de redirection sur la file d'attente source déplace le message vers la file d'attente de lettres mortes lorsque le nombre de réceptions dépasse maxReceiveCount. Lambda indique que la DLQ d'une source d'événements SQS se configure sur la file d'attente source, pas sur la fonction."
  options:
    a:
      en: "A function's dead-letter queue applies only to asynchronous invocations; the event source mapping invokes the function synchronously."
      fr: "La file d'attente de lettres mortes d'une fonction ne s'applique qu'aux appels asynchrones ; le mappage de source d'événements appelle la fonction de manière synchrone."
    b:
      en: "On-failure destinations for event source mappings are available for stream sources such as Kinesis, DynamoDB and Kafka, not for SQS."
      fr: "Les destinations en cas d'échec des mappages de source d'événements existent pour les sources de flux comme Kinesis, DynamoDB et Kafka, pas pour SQS."
    d:
      en: "MaximumRetryAttempts applies to Kinesis, DynamoDB Streams and Kafka event sources, not to SQS."
      fr: "MaximumRetryAttempts s'applique aux sources d'événements Kinesis, DynamoDB Streams et Kafka, pas à SQS."
references:
  - title: Capturing records of Lambda asynchronous invocations
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-retain-records.html
  - title: Creating and configuring an Amazon SQS event source mapping
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-configure.html
