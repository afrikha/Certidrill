id: dvac03-1c-int-ddb-filter
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon DynamoDB table named Orders has a stream with the NEW_AND_OLD_IMAGES view type. An event source mapping sends the stream records to an AWS Lambda function. The function must run only for newly inserted items whose status attribute, a string, is PAID. The company wants to minimize the number of invocations.

    Which filter pattern should the developer add to the event source mapping?
  fr: |
    Une table Amazon DynamoDB nommée Orders possède un flux avec le type de vue NEW_AND_OLD_IMAGES. Un mappage de source d'événements envoie les enregistrements du flux à une fonction AWS Lambda. La fonction ne doit s'exécuter que pour les éléments nouvellement insérés dont l'attribut status, une chaîne, vaut PAID. L'entreprise souhaite réduire au minimum le nombre d'appels.

    Quel modèle de filtre le développeur doit-il ajouter au mappage de source d'événements ?
body:
  options:
    - { id: a, text: '`{ "eventName": ["INSERT"], "dynamodb": { "NewImage": { "status": { "S": ["PAID"] } } } }`' }
    - { id: b, text: '`{ "eventName": ["INSERT"], "dynamodb": { "NewImage": { "status": ["PAID"] } } }`' }
    - { id: c, text: '`{ "body": { "eventName": ["INSERT"], "status": ["PAID"] } }`' }
    - { id: d, text: '`{ "eventName": ["MODIFY"], "dynamodb": { "NewImage": { "status": { "S": ["PAID"] } } } }`' }
answer: { optionId: a }
explanation:
  correct:
    en: "Event filtering drops non-matching stream records before the function is invoked. For DynamoDB, the record data is under the dynamodb key, and each attribute in NewImage is wrapped in its type descriptor, here S for a string. The eventName field identifies inserts, and separate fields in one pattern are combined with AND."
    fr: "Le filtrage des événements écarte les enregistrements du flux qui ne correspondent pas avant l'appel de la fonction. Pour DynamoDB, les données de l'enregistrement se trouvent sous la clé dynamodb, et chaque attribut de NewImage est encapsulé dans son descripteur de type, ici S pour une chaîne. Le champ eventName identifie les insertions, et les champs distincts d'un même modèle sont combinés par un ET."
  options:
    b:
      en: "Stream images use the DynamoDB JSON format, so the pattern must include the S type descriptor; this pattern never matches."
      fr: "Les images du flux utilisent le format JSON de DynamoDB : le modèle doit inclure le descripteur de type S ; ce modèle ne correspond jamais."
    c:
      en: "body is the filtering key of Amazon SQS messages; DynamoDB stream records use the dynamodb key."
      fr: "body est la clé de filtrage des messages Amazon SQS ; les enregistrements de flux DynamoDB utilisent la clé dynamodb."
    d:
      en: "MODIFY matches updates of existing items, not newly inserted items."
      fr: "MODIFY correspond aux mises à jour d'éléments existants, pas aux éléments nouvellement insérés."
references:
  - title: Control which events Lambda sends to your Event Function
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-eventfiltering.html
