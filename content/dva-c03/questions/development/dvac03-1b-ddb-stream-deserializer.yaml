id: dvac03-1b-ddb-stream-deserializer
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function written in Python processes a DynamoDB stream that uses the `NEW_IMAGE` view type. The function passes `record["dynamodb"]["NewImage"]` to an existing library that expects a plain dictionary such as `{"orderId": "o-1", "total": 25}`. The library fails because it receives values such as `{"total": {"N": "25"}}`. The developer wants a reliable conversion with the LEAST custom code.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda écrite en Python traite un flux DynamoDB qui utilise le type de vue `NEW_IMAGE`. La fonction transmet `record["dynamodb"]["NewImage"]` à une bibliothèque existante qui attend un dictionnaire simple comme `{"orderId": "o-1", "total": 25}`. La bibliothèque échoue, car elle reçoit des valeurs comme `{"total": {"N": "25"}}`. Le développeur veut une conversion fiable avec le MOINS de code personnalisé possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change the stream view type to NEW_AND_OLD_IMAGES so that the records contain plain attribute values.", fr: "Changer le type de vue du flux en NEW_AND_OLD_IMAGES afin que les enregistrements contiennent des valeurs d'attribut simples." }
    - id: b
      text: { en: "Pass each attribute value of NewImage to json.loads to remove the type descriptors.", fr: "Passer chaque valeur d'attribut de NewImage à json.loads pour retirer les descripteurs de type." }
    - id: c
      text: { en: "Convert each attribute value of NewImage with TypeDeserializer from boto3.dynamodb.types.", fr: "Convertir chaque valeur d'attribut de NewImage avec TypeDeserializer de boto3.dynamodb.types." }
    - id: d
      text: { en: "Read the item again with the low-level DynamoDB client get_item call and pass the returned Item.", fr: "Relire l'élément avec l'appel get_item du client DynamoDB de bas niveau et transmettre l'Item renvoyé." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Stream records contain item images in DynamoDB JSON, where each value is a map whose key is the type descriptor (S, N...) and whose value is a string. TypeDeserializer converts each of these values to the matching Python type, so a dictionary comprehension produces the plain dictionary that the library expects.
    fr: |
      Les enregistrements de flux contiennent les images des éléments en DynamoDB JSON, où chaque valeur est une map dont la clé est le descripteur de type (S, N...) et la valeur une chaîne. TypeDeserializer convertit chacune de ces valeurs dans le type Python correspondant : une compréhension de dictionnaire produit le dictionnaire simple que la bibliothèque attend.
  options:
    a:
      en: "The view type selects which images are written, not their format; NEW_AND_OLD_IMAGES still uses DynamoDB JSON."
      fr: "Le type de vue choisit les images écrites, pas leur format ; NEW_AND_OLD_IMAGES utilise toujours DynamoDB JSON."
    b:
      en: "The values are already Python dictionaries, not JSON strings, so json.loads fails and cannot remove the type descriptors."
      fr: "Les valeurs sont déjà des dictionnaires Python, pas des chaînes JSON : json.loads échoue et ne peut pas retirer les descripteurs de type."
    d:
      en: "The low-level client also returns DynamoDB JSON with type descriptors, and the extra read adds latency and cost."
      fr: "Le client de bas niveau renvoie lui aussi du DynamoDB JSON avec des descripteurs de type, et la lecture supplémentaire ajoute de la latence et un coût."
references:
  - title: Programming Amazon DynamoDB with Python and Boto3
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/programming-with-python.html
