id: dvac03-1a-conditional-put-username
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A sign-up service written in Python stores users in an Amazon DynamoDB table whose partition key is username. When two people register the same username at the same time, the second put_item call overwrites the first user's item. The developer must make the second registration fail, in a single request to DynamoDB.

    Which code change will meet these requirements?
  fr: |
    Un service d'inscription écrit en Python stocke les utilisateurs dans une table Amazon DynamoDB dont la clé de partition est username. Quand deux personnes inscrivent le même nom d'utilisateur en même temps, le second appel put_item écrase l'élément du premier utilisateur. Le développeur doit faire échouer la seconde inscription, en une seule requête à DynamoDB.

    Quelle modification du code répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add `ReturnValues=\"ALL_OLD\"` to the `put_item` call to detect an existing user.", fr: "Ajouter `ReturnValues=\"ALL_OLD\"` à l'appel `put_item` pour détecter un utilisateur existant." }
    - id: b
      text: { en: "Call `get_item` first and call `put_item` only if no item is returned.", fr: "Appeler d'abord `get_item` et n'appeler `put_item` que si aucun élément n'est renvoyé." }
    - id: c
      text: { en: "Write the item with `batch_write_item` instead of `put_item` to group the writes.", fr: "Écrire l'élément avec `batch_write_item` au lieu de `put_item` pour regrouper les écritures." }
    - id: d
      text: { en: "Add `ConditionExpression=\"attribute_not_exists(username)\"` to the `put_item` call.", fr: "Ajouter `ConditionExpression=\"attribute_not_exists(username)\"` à l'appel `put_item`." }
answer: { optionId: d }
explanation:
  correct:
    en: "PutItem is unconditional by default and overwrites an item with the same key. With attribute_not_exists on the partition key, the write succeeds only if no item with that key exists; otherwise DynamoDB rejects it with ConditionalCheckFailedException, which the code can report as a taken username."
    fr: "PutItem est inconditionnel par défaut et écrase un élément de même clé. Avec attribute_not_exists sur la clé de partition, l'écriture ne réussit que si aucun élément de cette clé n'existe ; sinon DynamoDB la rejette avec ConditionalCheckFailedException, que le code peut signaler comme un nom d'utilisateur déjà pris."
  options:
    a:
      en: "ALL_OLD returns the overwritten item after the fact; it doesn't prevent the overwrite."
      fr: "ALL_OLD renvoie l'élément écrasé après coup ; il n'empêche pas l'écrasement."
    b:
      en: "Two requests leave a race window: both registrations can read no item and then both write."
      fr: "Deux requêtes laissent une fenêtre de concurrence : les deux inscriptions peuvent ne lire aucun élément puis écrire toutes les deux."
    c:
      en: "BatchWriteItem doesn't accept conditions on put requests, and a put still overwrites the existing item."
      fr: "BatchWriteItem n'accepte pas de condition sur les requêtes put, et un put écrase toujours l'élément existant."
references:
  - title: DynamoDB condition expression CLI example
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Expressions.ConditionExpressions.html
  - title: Working with items and attributes in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithItems.html
