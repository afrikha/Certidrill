id: dvac03-1b-s3-events-to-fifo-queue
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A document management company stores contracts in an Amazon S3 bucket. Each new object must trigger processing by a worker fleet that reads from an Amazon SQS FIFO queue, because the workers rely on message group ordering per customer folder. The developer tries to add the FIFO queue as the destination of an S3 event notification, and the configuration fails.

    Which solution will deliver the object-created events to the FIFO queue with the LEAST custom code?
  fr: |
    Une entreprise de gestion documentaire stocke des contrats dans un compartiment Amazon S3. Chaque nouvel objet doit déclencher un traitement par un parc de processus de travail qui lisent une file d'attente Amazon SQS FIFO, car ces processus s'appuient sur l'ordre des groupes de messages par dossier client. Le développeur essaie d'ajouter la file d'attente FIFO comme destination d'une notification d'événement S3, et la configuration échoue.

    Quelle solution livre les événements de création d'objet à la file d'attente FIFO avec le MOINS de code personnalisé ?
body:
  options:
    - id: a
      text: { en: "Turn on Amazon EventBridge for the bucket and add a rule for Object Created events that targets the FIFO queue.", fr: "Activer Amazon EventBridge pour le compartiment et ajouter une règle pour les événements Object Created qui cible la file d'attente FIFO." }
    - id: b
      text: { en: "Add a MessageGroupId to the queue configuration of the S3 event notification and save the configuration again.", fr: "Ajouter un MessageGroupId à la configuration de file d'attente de la notification d'événement S3 et l'enregistrer de nouveau." }
    - id: c
      text: { en: "Configure the S3 event notification to invoke a Lambda function that copies each event to the FIFO queue.", fr: "Configurer la notification d'événement S3 pour invoquer une fonction Lambda qui copie chaque événement dans la file d'attente FIFO." }
    - id: d
      text: { en: "Replace the FIFO queue with a standard queue as the S3 notification destination and sort messages in the workers.", fr: "Remplacer la file d'attente FIFO par une file d'attente standard comme destination de la notification S3 et trier les messages dans les processus de travail." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      SQS FIFO queues are not supported as a direct S3 event notification destination, and the S3 documentation points to Amazon EventBridge for this case. Once EventBridge is turned on for the bucket, S3 sends all its events to EventBridge, and a rule can route Object Created events to the FIFO queue, with a message group ID set on the target, without any code.
    fr: |
      Les files d'attente SQS FIFO ne sont pas prises en charge comme destination directe d'une notification d'événement S3, et la documentation S3 renvoie à Amazon EventBridge pour ce cas. Une fois EventBridge activé pour le compartiment, S3 envoie tous ses événements à EventBridge, et une règle peut acheminer les événements Object Created vers la file d'attente FIFO, avec un ID de groupe de messages défini sur la cible, sans aucun code.
  options:
    b:
      en: "S3 event notifications do not support FIFO queues as a destination, whatever settings the queue configuration contains."
      fr: "Les notifications d'événements S3 ne prennent pas en charge les files d'attente FIFO comme destination, quels que soient les paramètres de la configuration de file d'attente."
    c:
      en: "A relay function works but adds code to write, deploy and maintain, compared with an EventBridge rule."
      fr: "Une fonction relais fonctionne, mais ajoute du code à écrire, déployer et maintenir, par rapport à une règle EventBridge."
    d:
      en: "A standard queue does not provide the message group ordering that the workers rely on, and sorting in the workers is custom code."
      fr: "Une file d'attente standard n'offre pas l'ordre par groupe de messages dont les processus de travail dépendent, et le tri dans les processus est du code personnalisé."
references:
  - title: Amazon S3 Event Notifications
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventNotifications.html
  - title: Using EventBridge
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html
