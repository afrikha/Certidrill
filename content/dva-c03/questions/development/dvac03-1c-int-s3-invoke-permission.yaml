id: dvac03-1c-int-s3-invoke-permission
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer runs the AWS CLI put-bucket-notification-configuration command to make an Amazon S3 bucket invoke an AWS Lambda function when objects are created. The bucket and the function are in the same AWS account. The command fails with the error "Unable to validate the following destination configurations".

    Which solution will meet this requirement in the MOST secure way?
  fr: |
    Un développeur exécute la commande AWS CLI put-bucket-notification-configuration pour qu'un compartiment Amazon S3 appelle une fonction AWS Lambda à la création d'objets. Le compartiment et la fonction se trouvent dans le même compte AWS. La commande échoue avec l'erreur « Unable to validate the following destination configurations ».

    Quelle solution répond à cette exigence de la manière la PLUS sécurisée ?
body:
  options:
    - { id: a, text: { en: "Add s3:GetObject and s3:ListBucket on the bucket to the function's execution role.", fr: "Ajouter s3:GetObject et s3:ListBucket sur le compartiment au rôle d'exécution de la fonction." } }
    - { id: b, text: { en: "Create an event source mapping between the bucket and the function with the AWS CLI.", fr: "Créer un mappage de source d'événements entre le compartiment et la fonction avec l'AWS CLI." } }
    - { id: c, text: { en: "Run lambda add-permission for the principal s3.amazonaws.com, with the bucket ARN and the account ID as source conditions.", fr: "Exécuter lambda add-permission pour le principal s3.amazonaws.com, avec l'ARN du compartiment et l'ID du compte comme conditions de source." } }
    - { id: d, text: { en: "Add a bucket policy that allows lambda.amazonaws.com to call s3:PutBucketNotification on the bucket.", fr: "Ajouter une politique de compartiment qui autorise lambda.amazonaws.com à appeler s3:PutBucketNotification sur le compartiment." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon S3 pushes events by invoking the function, so the function's resource-based policy must allow s3.amazonaws.com to call lambda:InvokeFunction. Scoping the statement with the bucket ARN and the account ID is recommended because a bucket ARN contains no account ID and a deleted bucket name could be reused by another account."
    fr: "Amazon S3 envoie les événements en appelant la fonction : la politique basée sur les ressources de la fonction doit autoriser s3.amazonaws.com à appeler lambda:InvokeFunction. Il est recommandé de restreindre l'instruction avec l'ARN du compartiment et l'ID du compte, car un ARN de compartiment ne contient pas d'ID de compte et le nom d'un compartiment supprimé pourrait être réutilisé par un autre compte."
  options:
    a:
      en: "s3:GetObject lets the function read objects after it runs; it does not allow Amazon S3 to invoke the function."
      fr: "s3:GetObject permet à la fonction de lire les objets une fois exécutée ; il n'autorise pas Amazon S3 à appeler la fonction."
    b:
      en: "Amazon S3 is a direct trigger that the bucket manages; event source mappings are for polled sources such as SQS, Kinesis and DynamoDB."
      fr: "Amazon S3 est un déclencheur direct géré par le compartiment ; les mappages de source d'événements sont destinés aux sources interrogées comme SQS, Kinesis et DynamoDB."
    d:
      en: "The developer configures the notification; the missing permission is the invoke permission on the function, not a bucket permission for Lambda."
      fr: "C'est le développeur qui configure la notification ; l'autorisation manquante est l'autorisation d'appel sur la fonction, pas une autorisation de compartiment pour Lambda."
references:
  - title: Granting Event Function access to AWS services
    url: https://docs.aws.amazon.com/lambda/latest/dg/permissions-function-services.html
  - title: How Lambda processes records from stream and queue-based event sources
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-eventsourcemapping.html
