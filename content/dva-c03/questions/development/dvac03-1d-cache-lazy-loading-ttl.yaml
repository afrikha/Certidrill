id: dvac03-1d-cache-lazy-loading-ttl
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's catalog application reads product details from an Amazon RDS for PostgreSQL database. The same products are read thousands of times each hour, and the database CPU is often saturated. Prices change a few times each day, and the pages can show data that is up to 10 minutes old. Only the products that users actually request should take up cache memory.

    Which solution will meet these requirements?
  fr: |
    L'application de catalogue d'AnyCompany lit le détail des produits dans une base de données Amazon RDS for PostgreSQL. Les mêmes produits sont lus des milliers de fois par heure, et le processeur de la base est souvent saturé. Les prix changent quelques fois par jour, et les pages peuvent afficher des données datant de 10 minutes au plus. Seuls les produits réellement demandés par les utilisateurs doivent occuper de la mémoire de cache.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a DynamoDB Accelerator (DAX) cluster in front of the RDS database and send the product reads to the DAX endpoint.", fr: "Ajouter un cluster DynamoDB Accelerator (DAX) devant la base RDS et envoyer les lectures de produits au point de terminaison DAX." } }
    - { id: b, text: { en: "Add an Amazon ElastiCache cluster and write every product to the cache whenever the product is written to the database, without a TTL.", fr: "Ajouter un cluster Amazon ElastiCache et écrire chaque produit dans le cache chaque fois qu'il est écrit dans la base, sans TTL." } }
    - { id: c, text: { en: "Modify the DB instance to a larger instance class and switch its storage to Provisioned IOPS.", fr: "Passer l'instance de base de données à une classe d'instance plus grande et basculer son stockage en Provisioned IOPS." } }
    - { id: d, text: { en: "Add an Amazon ElastiCache cluster, read from the cache first, and on a miss load the product from the database into the cache with a 600-second TTL.", fr: "Ajouter un cluster Amazon ElastiCache, lire d'abord le cache et, en cas d'échec, charger le produit depuis la base dans le cache avec un TTL de 600 secondes." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Lazy loading caches an item only when it is requested and missing from the cache, so memory holds only the products that users read. Repeated reads are served from ElastiCache instead of the database, and a 600-second TTL makes each entry expire and reload, which keeps the data at most 10 minutes old.
    fr: |
      Le chargement différé (lazy loading) ne met un élément en cache que lorsqu'il est demandé et absent du cache : la mémoire ne contient que les produits lus par les utilisateurs. Les lectures répétées sont servies par ElastiCache au lieu de la base, et un TTL de 600 secondes fait expirer et recharger chaque entrée, ce qui garde des données datant de 10 minutes au plus.
  options:
    a: { en: "DAX is a cache for Amazon DynamoDB tables only; it cannot sit in front of a relational database.", fr: "DAX est un cache réservé aux tables Amazon DynamoDB ; il ne peut pas être placé devant une base de données relationnelle." }
    b: { en: "Write-through without a TTL caches every product that is written, including products that are never read, which wastes cache memory.", fr: "L'écriture simultanée (write-through) sans TTL met en cache chaque produit écrit, y compris ceux qui ne sont jamais lus, ce qui gaspille la mémoire du cache." }
    c: { en: "A larger instance absorbs more load but every repeated read still runs on the database; nothing is cached.", fr: "Une instance plus grande absorbe plus de charge, mais chaque lecture répétée s'exécute toujours sur la base ; rien n'est mis en cache." }
references:
  - title: Caching strategies for Memcached
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
