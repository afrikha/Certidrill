id: dvac03-1b-apigw-binary-response
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A developer builds an Amazon API Gateway REST API with a Lambda proxy integration. A `GET /invoices/{id}/pdf` method must return a PDF file that the function generates in memory. Browsers currently receive a corrupted file.

    Which solution will return the PDF file correctly?
  fr: |
    Un développeur crée une API REST Amazon API Gateway avec une intégration de proxy Lambda. Une méthode `GET /invoices/{id}/pdf` doit renvoyer un fichier PDF que la fonction génère en mémoire. Les navigateurs reçoivent actuellement un fichier corrompu.

    Quelle solution renvoie correctement le fichier PDF ?
body:
  options:
    - id: a
      text: { en: "Return the PDF bytes as a UTF-8 string in body, set isBase64Encoded to false, and set the Content-Type header to application/pdf.", fr: "Renvoyer les octets du PDF sous forme de chaîne UTF-8 dans body, définir isBase64Encoded sur false et définir l'en-tête Content-Type sur application/pdf." }
    - id: b
      text: { en: "Return the PDF bytes as a base64-encoded string in body, set isBase64Encoded to true, and add the media type as a binary media type of the API.", fr: "Renvoyer les octets du PDF sous forme de chaîne encodée en base64 dans body, définir isBase64Encoded sur true et ajouter le type de média comme type de média binaire de l'API." }
    - id: c
      text: { en: "Return the PDF bytes as a base64-encoded string in body, and add a mapping template that decodes the body in the integration response.", fr: "Renvoyer les octets du PDF sous forme de chaîne encodée en base64 dans body, et ajouter un modèle de mappage qui décode le corps dans la réponse d'intégration." }
    - id: d
      text: { en: "Return the PDF as a JSON array of byte values in body, set isBase64Encoded to false, and set the Content-Type header to application/pdf.", fr: "Renvoyer le PDF sous forme de tableau JSON de valeurs d'octets dans body, définir isBase64Encoded sur false et définir l'en-tête Content-Type sur application/pdf." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The body of a Lambda proxy response is a string. To return binary content, the function base64-encodes the bytes and sets isBase64Encoded to true, and the API must list the media type (or */*) as a binary media type. API Gateway then decodes the body and returns the original bytes to the client.
    fr: |
      Le body d'une réponse de proxy Lambda est une chaîne. Pour renvoyer du contenu binaire, la fonction encode les octets en base64 et définit isBase64Encoded sur true, et l'API doit déclarer le type de média (ou */*) comme type de média binaire. API Gateway décode alors le corps et renvoie les octets d'origine au client.
  options:
    a:
      en: "Binary data that is converted to a text string is altered, so the client still receives a corrupted file."
      fr: "Des données binaires converties en chaîne de texte sont altérées : le client reçoit toujours un fichier corrompu."
    c:
      en: "A Lambda proxy integration passes the response through without integration response mapping templates, so the client would receive base64 text."
      fr: "Une intégration de proxy Lambda transmet la réponse sans modèle de mappage de réponse d'intégration : le client recevrait du texte base64."
    d:
      en: "A JSON array of numbers is text, not the PDF bytes, so browsers cannot open it as a PDF file."
      fr: "Un tableau JSON de nombres est du texte, pas les octets du PDF : les navigateurs ne peuvent pas l'ouvrir comme un fichier PDF."
references:
  - title: Lambda proxy integrations in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-lambda-proxy-integrations.html
