id: dvac03-1c-cfg-env-cmk-hide
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function reads a partner API key from an environment variable named API_KEY. Developers use an IAM role that lets them update the function's code and configuration in the Lambda console. The security team now requires that developers cannot view the value of API_KEY in the console. The application code must not change.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda lit une clé d'API de partenaire dans une variable d'environnement nommée API_KEY. Les développeurs utilisent un rôle IAM qui leur permet de mettre à jour le code et la configuration de la fonction dans la console Lambda. L'équipe de sécurité exige désormais que les développeurs ne puissent pas voir la valeur d'API_KEY dans la console. Le code de l'application ne doit pas changer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable the helpers for encryption in transit, and encrypt API_KEY with a customer managed AWS KMS key.", fr: "Activer les assistants de chiffrement en transit, et chiffrer API_KEY avec une clé AWS KMS gérée par le client." } }
    - { id: b, text: { en: "Store the API key in AWS Secrets Manager, and allow the execution role to call secretsmanager:GetSecretValue.", fr: "Stocker la clé d'API dans AWS Secrets Manager, et autoriser le rôle d'exécution à appeler secretsmanager:GetSecretValue." } }
    - { id: c, text: { en: "Encrypt the environment variables at rest with a customer managed AWS KMS key, and remove kms:Decrypt from the function's execution role.", fr: "Chiffrer les variables d'environnement au repos avec une clé AWS KMS gérée par le client, et retirer kms:Decrypt du rôle d'exécution de la fonction." } }
    - { id: d, text: { en: "Encrypt the environment variables at rest with a customer managed AWS KMS key, and deny kms:Decrypt on that key to the developers' role.", fr: "Chiffrer les variables d'environnement au repos avec une clé AWS KMS gérée par le client, et refuser kms:Decrypt sur cette clé au rôle des développeurs." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With a customer managed key for encryption at rest, viewing and managing the environment variables in the console requires kms:Decrypt on that key. Users without it can still manage the function but cannot see the variables. Lambda still decrypts the variables for the function at startup, so the code keeps reading a plaintext API_KEY."
    fr: "Avec une clé gérée par le client pour le chiffrement au repos, afficher et gérer les variables d'environnement dans la console exige kms:Decrypt sur cette clé. Les utilisateurs qui ne l'ont pas peuvent toujours gérer la fonction, mais ne voient pas les variables. Lambda déchiffre toujours les variables pour la fonction au démarrage : le code continue de lire API_KEY en clair."
  options:
    a:
      en: "Values encrypted with the in-transit helpers stay encrypted in the environment, so the code must call AWS KMS to decrypt them, which is a code change."
      fr: "Les valeurs chiffrées avec les assistants en transit restent chiffrées dans l'environnement : le code doit appeler AWS KMS pour les déchiffrer, ce qui modifie le code."
    b:
      en: "Secrets Manager is the recommended store for secrets, but the function would have to call it instead of reading the variable, which changes the code."
      fr: "Secrets Manager est le stockage recommandé pour les secrets, mais la fonction devrait l'appeler au lieu de lire la variable, ce qui modifie le code."
    c:
      en: "The execution role does not control what developers can see; developers who keep kms:Decrypt on the key can still view the value."
      fr: "Le rôle d'exécution ne contrôle pas ce que voient les développeurs ; les développeurs qui conservent kms:Decrypt sur la clé voient toujours la valeur."
references:
  - title: Securing Lambda environment variables
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-envvars-encryption.html
