id: dvac03-1c-cfg-ephemeral-storage
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function downloads a 2 GB archive from Amazon S3 to the /tmp directory, extracts about 3 GB of files from it, and processes them. The function uses the default ephemeral storage setting and fails because /tmp runs out of space. The code must not change.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda télécharge une archive de 2 Go depuis Amazon S3 dans le répertoire /tmp, en extrait environ 3 Go de fichiers et les traite. La fonction utilise le paramètre de stockage éphémère par défaut et échoue, car /tmp manque d'espace. Le code ne doit pas changer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Increase the memory of the function to 10,240 MB.", fr: "Augmenter la mémoire de la fonction à 10 240 Mo." } }
    - { id: b, text: { en: "Add a Lambda layer that provides additional disk space under /opt.", fr: "Ajouter une couche (layer) Lambda qui fournit de l'espace disque supplémentaire sous /opt." } }
    - { id: c, text: { en: "Increase the ephemeral storage of the function to 6,144 MB.", fr: "Augmenter le stockage éphémère de la fonction à 6 144 Mo." } }
    - { id: d, text: { en: "Redeploy the function as a 10 GB container image.", fr: "Redéployer la fonction sous forme d'image de conteneur de 10 Go." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The /tmp directory defaults to 512 MB and can be configured from 512 MB to 10,240 MB, in 1 MB increments. A 6,144 MB setting holds the 2 GB archive and the 3 GB of extracted files without any code change."
    fr: "Le répertoire /tmp fait 512 Mo par défaut et peut être configuré de 512 Mo à 10 240 Mo, par incréments de 1 Mo. Un paramètre de 6 144 Mo contient l'archive de 2 Go et les 3 Go de fichiers extraits sans aucune modification du code."
  options:
    a:
      en: "Memory and ephemeral storage are separate settings; more memory does not enlarge /tmp."
      fr: "La mémoire et le stockage éphémère sont des paramètres distincts ; plus de mémoire n'agrandit pas /tmp."
    b:
      en: "Layers deliver files into /opt within the 250 MB unzipped package limit; they do not add writable disk space."
      fr: "Les couches livrent des fichiers dans /opt dans la limite de 250 Mo décompressés du package ; elles n'ajoutent pas d'espace disque inscriptible."
    d:
      en: "The 10 GB limit applies to the size of the image code package, not to the writable /tmp space."
      fr: "La limite de 10 Go s'applique à la taille du package de code de l'image, pas à l'espace inscriptible de /tmp."
references:
  - title: Lambda quotas
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
