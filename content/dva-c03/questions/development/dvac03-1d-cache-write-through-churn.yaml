id: dvac03-1d-cache-write-through-churn
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's IoT application writes device status records to an Amazon RDS database and uses write-through caching to Amazon ElastiCache (Valkey) with no expiration. Most records are written often but read rarely, and the cache memory is now full, which causes frequent evictions. When a node is replaced, records that have not been written since then are missing from the cache.

    The developers must reduce the memory used by records that are not read and fill the cache with records that are requested, while keeping recently written records fresh.

    Which combination of changes will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'application IoT d'AnyCompany écrit les enregistrements d'état des appareils dans une base Amazon RDS et utilise une mise en cache en écriture simultanée (write-through) vers Amazon ElastiCache (Valkey), sans expiration. La plupart des enregistrements sont écrits souvent mais rarement lus, et la mémoire du cache est désormais pleine, ce qui provoque des évictions fréquentes. Quand un nœud est remplacé, les enregistrements qui n'ont pas été écrits depuis sont absents du cache.

    Les développeurs doivent réduire la mémoire occupée par les enregistrements non lus et remplir le cache avec les enregistrements demandés, tout en gardant à jour les enregistrements récemment écrits.

    Quelle combinaison de modifications répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Stop writing to the cache on updates and read the records from an RDS read replica instead.", fr: "Cesser d'écrire dans le cache lors des mises à jour et lire les enregistrements sur un réplica en lecture RDS." } }
    - { id: b, text: { en: "Set a TTL on each key when the application writes it to the cache.", fr: "Définir un TTL sur chaque clé lorsque l'application l'écrit dans le cache." } }
    - { id: c, text: { en: "Replace the cluster with larger nodes so that all the records fit in memory.", fr: "Remplacer le cluster par des nœuds plus grands pour que tous les enregistrements tiennent en mémoire." } }
    - { id: d, text: { en: "Replace the Valkey cluster with an Amazon ElastiCache (Memcached) cluster that uses the same write-through logic.", fr: "Remplacer le cluster Valkey par un cluster Amazon ElastiCache (Memcached) qui utilise la même logique d'écriture simultanée." } }
    - { id: e, text: { en: "Add lazy loading: on a cache miss, read the record from the database and write it to the cache.", fr: "Ajouter le chargement différé (lazy loading) : en cas d'échec de cache, lire l'enregistrement dans la base et l'écrire dans le cache." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Write-through keeps written records fresh but causes cache churn, because most written data is never read, and a new node stays empty until records are written again. A TTL makes unread records expire, which frees memory, and adding lazy loading fills the cache with the records that are requested on a miss. Combining write-through, lazy loading and a TTL is the strategy the ElastiCache documentation describes.
    fr: |
      L'écriture simultanée garde les enregistrements écrits à jour, mais elle provoque un renouvellement inutile du cache (cache churn), car la plupart des données écrites ne sont jamais lues, et un nouveau nœud reste vide jusqu'à ce que les enregistrements soient réécrits. Un TTL fait expirer les enregistrements non lus, ce qui libère la mémoire, et l'ajout du chargement différé remplit le cache avec les enregistrements demandés lors d'un échec. Combiner écriture simultanée, chargement différé et TTL est la stratégie que décrit la documentation d'ElastiCache.
  options:
    a: { en: "Reads from a replica bypass the cache, and replica lag would no longer keep recently written records fresh.", fr: "Les lectures sur un réplica contournent le cache, et le retard du réplica ne garderait plus à jour les enregistrements récemment écrits." }
    c: { en: "Larger nodes store more unread records instead of reducing them, and a replaced node is still empty.", fr: "Des nœuds plus grands stockent davantage d'enregistrements non lus au lieu de les réduire, et un nœud remplacé est toujours vide." }
    d: { en: "Changing the engine keeps the same strategy, so the same churn and missing data remain.", fr: "Changer de moteur garde la même stratégie : le même renouvellement inutile et les mêmes données manquantes demeurent." }
references:
  - title: Caching strategies for Memcached
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
