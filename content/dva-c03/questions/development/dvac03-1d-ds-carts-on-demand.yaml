id: dvac03-1d-ds-carts-on-demand
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a serverless shopping API on AWS Lambda. The API stores each shopping cart as a document of a few kilobytes that is always read and written by its cart ID. Traffic varies unpredictably during the day and is close to zero at night. Carts must be stored durably with single-digit millisecond latency.

    The solution must be the MOST cost-effective and must not require capacity planning.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une API d'achat serverless sur AWS Lambda. L'API stocke chaque panier sous la forme d'un document de quelques kilo-octets, toujours lu et écrit par son ID de panier. Le trafic varie de façon imprévisible dans la journée et il est proche de zéro la nuit. Les paniers doivent être stockés de façon durable, avec une latence de l'ordre de quelques millisecondes.

    La solution doit être la PLUS rentable et ne doit exiger aucune planification de capacité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store the carts in an Amazon DynamoDB table in provisioned capacity mode with capacity set to the daily peak.", fr: "Stocker les paniers dans une table Amazon DynamoDB en mode de capacité provisionnée, avec une capacité réglée sur le pic quotidien." } }
    - { id: b, text: { en: "Store the carts in an Amazon ElastiCache (Memcached) node-based cluster, using the cart ID as the key.", fr: "Stocker les paniers dans un cluster Amazon ElastiCache (Memcached) basé sur des nœuds, avec l'ID du panier comme clé." } }
    - { id: c, text: { en: "Store the carts in an Amazon DynamoDB table in on-demand capacity mode, with the cart ID as the partition key.", fr: "Stocker les paniers dans une table Amazon DynamoDB en mode de capacité à la demande, avec l'ID du panier comme clé de partition." } }
    - { id: d, text: { en: "Store the carts in an Amazon RDS for MySQL DB instance sized for the daily peak.", fr: "Stocker les paniers dans une instance de base de données Amazon RDS for MySQL dimensionnée pour le pic quotidien." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A key-value access pattern by cart ID fits DynamoDB, which stores data durably with single-digit millisecond latency. In on-demand mode the table scales with traffic and is billed per request, so the company pays nothing for throughput at night and does no capacity planning.
    fr: |
      Un modèle d'accès clé-valeur par ID de panier convient à DynamoDB, qui stocke les données de façon durable avec une latence de quelques millisecondes. En mode à la demande, la table s'adapte au trafic et est facturée par requête : l'entreprise ne paie aucun débit la nuit et ne planifie aucune capacité.
  options:
    a: { en: "Capacity set to the peak is paid for every hour, including at night, and requires the team to plan and adjust it.", fr: "Une capacité réglée sur le pic est payée à chaque heure, y compris la nuit, et l'équipe doit la planifier et l'ajuster." }
    b: { en: "Memcached has no persistence or replication, so carts would be lost when a node fails, and the nodes are sized and paid for in advance.", fr: "Memcached n'offre ni persistance ni réplication : les paniers seraient perdus en cas de panne d'un nœud, et les nœuds sont dimensionnés et payés à l'avance." }
    d: { en: "A DB instance sized for the peak runs and is billed continuously and still requires capacity planning.", fr: "Une instance dimensionnée pour le pic tourne et est facturée en continu, et elle exige toujours une planification de capacité." }
references:
  - title: DynamoDB on-demand capacity mode
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html
