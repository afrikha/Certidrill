id: dvac03-1d-cache-cloudfront-max-age
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany serves a single-page application from an Amazon S3 bucket through an Amazon CloudFront distribution. The build pipeline uploads a new index.html file several times each day, and it uploads JavaScript and CSS bundles whose file names include a content hash, so a bundle never changes after it is uploaded.

    Users must receive a new index.html within 60 seconds of an upload, and the bundles must stay cached at edge locations for up to 1 year. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany sert une application monopage depuis un compartiment Amazon S3 via une distribution Amazon CloudFront. Le pipeline de build charge un nouveau fichier index.html plusieurs fois par jour, ainsi que des bundles JavaScript et CSS dont le nom de fichier contient un hachage du contenu : un bundle ne change jamais après son chargement.

    Les utilisateurs doivent recevoir le nouvel index.html dans les 60 secondes qui suivent un chargement, et les bundles doivent rester en cache dans les emplacements périphériques jusqu'à 1 an. La solution doit présenter le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use a cache policy with a default TTL of 60 seconds and a maximum TTL of 1 year, and upload all the objects without Cache-Control metadata.", fr: "Utiliser une politique de cache avec un TTL par défaut de 60 secondes et un TTL maximal d'un an, et charger tous les objets sans métadonnées Cache-Control." } }
    - { id: b, text: { en: "Use a cache policy with a minimum TTL of 1 year, and set Cache-Control max-age to 60 seconds on index.html and to 1 year on the bundles.", fr: "Utiliser une politique de cache avec un TTL minimal d'un an, et définir Cache-Control max-age à 60 secondes sur index.html et à un an sur les bundles." } }
    - { id: c, text: { en: "Keep the default cache behavior settings, and have a scheduled AWS Lambda function create an invalidation for /* every minute.", fr: "Garder les paramètres par défaut du comportement de cache, et faire créer par une fonction AWS Lambda planifiée une invalidation pour /* chaque minute." } }
    - { id: d, text: { en: "Use a cache policy with a minimum TTL of 0 and a maximum TTL of 1 year, and set Cache-Control max-age to 60 seconds on index.html and to 1 year on the bundles.", fr: "Utiliser une politique de cache avec un TTL minimal de 0 et un TTL maximal d'un an, et définir Cache-Control max-age à 60 secondes sur index.html et à un an sur les bundles." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When the origin returns a Cache-Control max-age value between the minimum and maximum TTL of the cache policy, CloudFront caches the object for that duration. With a minimum TTL of 0 and a maximum TTL of one year, index.html is cached for 60 seconds and each hashed bundle for one year, and the pipeline only sets the object metadata at upload time.
    fr: |
      Quand l'origine renvoie une valeur max-age de Cache-Control comprise entre le TTL minimal et le TTL maximal de la politique de cache, CloudFront met l'objet en cache pour cette durée. Avec un TTL minimal de 0 et un TTL maximal d'un an, index.html est mis en cache 60 secondes et chaque bundle haché un an, et le pipeline ne fait que définir les métadonnées des objets au chargement.
  options:
    a: { en: "Without max-age, every object uses the 60-second default TTL, so the bundles are fetched from the origin again every minute instead of staying cached for a year.", fr: "Sans max-age, chaque objet utilise le TTL par défaut de 60 secondes : les bundles sont redemandés à l'origine chaque minute au lieu de rester en cache un an." }
    b: { en: "When max-age is lower than the minimum TTL, CloudFront uses the minimum TTL, so index.html would stay cached for a year.", fr: "Quand max-age est inférieur au TTL minimal, CloudFront utilise le TTL minimal : index.html resterait en cache un an." }
    c: { en: "Invalidating every path each minute also evicts the bundles, adds a function to operate, and creates invalidation requests all day.", fr: "Invalider tous les chemins chaque minute évince aussi les bundles, ajoute une fonction à exploiter et crée des demandes d'invalidation toute la journée." }
references:
  - title: Manage how long content stays in the cache (expiration)
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Expiration.html
