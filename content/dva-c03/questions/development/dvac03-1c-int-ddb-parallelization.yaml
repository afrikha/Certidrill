id: dvac03-1c-int-ddb-parallelization
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function processes an Amazon DynamoDB stream that has four shards. For each record, the function calls an external API that takes about 200 ms, so the IteratorAge metric keeps growing during peaks. Changes to the same item must still be processed in order. The table must not change.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda traite un flux Amazon DynamoDB qui comporte quatre partitions (shards). Pour chaque enregistrement, la fonction appelle une API externe qui prend environ 200 ms : la métrique IteratorAge ne cesse de croître pendant les pics. Les modifications d'un même élément doivent toujours être traitées dans l'ordre. La table ne doit pas changer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Increase the BatchSize of the event source mapping to 1,000.", fr: "Augmenter la BatchSize du mappage de source d'événements à 1 000." } }
    - { id: b, text: { en: "Create a second function with its own event source mapping on the same stream to share the load.", fr: "Créer une deuxième fonction avec son propre mappage de source d'événements sur le même flux pour répartir la charge." } }
    - { id: c, text: { en: "Configure provisioned concurrency of 100 on the function.", fr: "Configurer une simultanéité provisionnée de 100 sur la fonction." } }
    - { id: d, text: { en: "Set the ParallelizationFactor of the event source mapping to 5.", fr: "Définir le ParallelizationFactor du mappage de source d'événements à 5." } }
answer: { optionId: d }
explanation:
  correct:
    en: "ParallelizationFactor (1 to 10) sets how many batches Lambda processes concurrently from each shard, so four shards with a factor of 5 allow up to 20 concurrent invocations. Lambda still processes records that share a partition key in order, so changes to one item keep their order."
    fr: "ParallelizationFactor (de 1 à 10) détermine combien de lots Lambda traite simultanément à partir de chaque partition : quatre partitions avec un facteur de 5 permettent jusqu'à 20 appels simultanés. Lambda traite toujours dans l'ordre les enregistrements qui partagent une clé de partition : les modifications d'un même élément conservent leur ordre."
  options:
    a:
      en: "Larger batches do not add concurrency: each shard still has one invocation at a time that calls the API record by record."
      fr: "Des lots plus grands n'ajoutent pas de simultanéité : chaque partition a toujours un seul appel à la fois qui appelle l'API enregistrement par enregistrement."
    b:
      en: "Each event source mapping receives every record of the stream, so the second function duplicates the work instead of sharing it."
      fr: "Chaque mappage de source d'événements reçoit tous les enregistrements du flux : la deuxième fonction duplique le travail au lieu de le répartir."
    c:
      en: "Concurrency on a stream is bounded by the number of shards and the parallelization factor, not by pre-initialized environments."
      fr: "La simultanéité sur un flux est bornée par le nombre de partitions et le facteur de parallélisation, pas par des environnements pré-initialisés."
references:
  - title: Using AWS Lambda with Amazon DynamoDB
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-ddb.html
