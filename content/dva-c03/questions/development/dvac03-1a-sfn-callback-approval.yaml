id: dvac03-1a-sfn-callback-approval
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Step Functions workflow must pause until a manager approves a request in an external ticketing system. Approval can take up to 3 days. The workflow must continue as soon as the approval is recorded, and the company doesn't want to run code that polls the ticketing system.

    Which solution will meet these requirements?
  fr: |
    Un flux de travail AWS Step Functions doit se mettre en pause jusqu'à ce qu'un responsable approuve une demande dans un système de tickets externe. L'approbation peut prendre jusqu'à 3 jours. Le flux doit reprendre dès que l'approbation est enregistrée, et l'entreprise ne veut pas exécuter de code qui interroge le système de tickets.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use a Standard workflow with a .waitForTaskToken Task state, and have the ticketing system call SendTaskSuccess with the token.", fr: "Utiliser un flux Standard avec un état Task .waitForTaskToken, et faire appeler SendTaskSuccess avec le jeton par le système de tickets." }
    - id: b
      text: { en: "Use an Express workflow with a .waitForTaskToken Task state, and have the ticketing system call SendTaskSuccess with the token.", fr: "Utiliser un flux Express avec un état Task .waitForTaskToken, et faire appeler SendTaskSuccess avec le jeton par le système de tickets." }
    - id: c
      text: { en: "Use a Standard workflow with a 3-day Wait state followed by a Task state that reads the approval from the ticketing system.", fr: "Utiliser un flux Standard avec un état Wait de 3 jours suivi d'un état Task qui lit l'approbation dans le système de tickets." }
    - id: d
      text: { en: "Use a Standard workflow that loops through a Lambda function checking the ticketing system and a 5-minute Wait state.", fr: "Utiliser un flux Standard qui boucle sur une fonction Lambda vérifiant le système de tickets et un état Wait de 5 minutes." }
answer: { optionId: a }
explanation:
  correct:
    en: "With the callback pattern, Step Functions passes a task token to the external system and pauses the task until the token is returned with SendTaskSuccess or SendTaskFailure. A Standard workflow can wait days for the callback, and the workflow continues as soon as the token comes back."
    fr: "Avec le modèle de rappel, Step Functions transmet un jeton de tâche au système externe et met la tâche en pause jusqu'au retour du jeton avec SendTaskSuccess ou SendTaskFailure. Un flux Standard peut attendre le rappel pendant des jours, et le flux reprend dès le retour du jeton."
  options:
    b:
      en: "Express workflows don't support the .waitForTaskToken pattern and run for at most five minutes."
      fr: "Les flux Express ne prennent pas en charge le modèle .waitForTaskToken et s'exécutent au plus cinq minutes."
    c:
      en: "A fixed 3-day wait delays every request even when the manager approves it in minutes."
      fr: "Une attente fixe de 3 jours retarde chaque demande, même quand le responsable l'approuve en quelques minutes."
    d:
      en: "The loop is polling code, which the company doesn't want to run, and it detects the approval up to 5 minutes late."
      fr: "La boucle est du code d'interrogation, que l'entreprise ne veut pas exécuter, et elle détecte l'approbation avec jusqu'à 5 minutes de retard."
references:
  - title: Discover service integration patterns in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
