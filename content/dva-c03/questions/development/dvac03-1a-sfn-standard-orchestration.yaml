id: dvac03-1a-sfn-standard-orchestration
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's order process runs as a script on an Amazon EC2 instance. The script calls four Lambda functions one after another, waits up to 30 minutes between some steps for warehouse availability, and handles retries in its own code. A full process can take up to 2 hours. The company wants to decouple the steps from the script, use built-in retries, and view the status and history of each order's process for 30 days.

    Which solution will meet these requirements?
  fr: |
    Le processus de commande d'une entreprise s'exécute sous forme de script sur une instance Amazon EC2. Le script appelle quatre fonctions Lambda l'une après l'autre, attend jusqu'à 30 minutes entre certaines étapes selon la disponibilité de l'entrepôt et gère les nouvelles tentatives dans son propre code. Un processus complet peut durer jusqu'à 2 heures. L'entreprise veut découpler les étapes du script, utiliser des nouvelles tentatives intégrées et consulter l'état et l'historique du processus de chaque commande pendant 30 jours.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an AWS Step Functions Express workflow with Task states for the functions, Wait states and Retry fields.", fr: "Créer un flux de travail Express AWS Step Functions avec des états Task pour les fonctions, des états Wait et des champs Retry." }
    - id: b
      text: { en: "Create an AWS Step Functions Standard workflow with Task states for the functions, Wait states and Retry fields.", fr: "Créer un flux de travail Standard AWS Step Functions avec des états Task pour les fonctions, des états Wait et des champs Retry." }
    - id: c
      text: { en: "Chain the functions with asynchronous invocations, each with an on-success destination that invokes the next function.", fr: "Enchaîner les fonctions par des invocations asynchrones, chacune avec une destination en cas de succès qui invoque la fonction suivante." }
    - id: d
      text: { en: "Place an Amazon SQS queue between each pair of functions, with an event source mapping on each queue.", fr: "Placer une file d'attente Amazon SQS entre chaque paire de fonctions, avec un mappage de source d'événements sur chaque file." }
answer: { optionId: b }
explanation:
  correct:
    en: "A Standard workflow can run for up to one year, supports Wait states and Retry fields on each Task state, and keeps the execution history available through the Step Functions APIs for 90 days, so each order's status and history can be viewed for 30 days."
    fr: "Un flux de travail Standard peut s'exécuter jusqu'à un an, prend en charge les états Wait et les champs Retry sur chaque état Task, et conserve l'historique d'exécution accessible par les API Step Functions pendant 90 jours : l'état et l'historique de chaque commande sont consultables pendant 30 jours."
  options:
    a:
      en: "An Express workflow runs for at most five minutes, which is far shorter than a 2-hour process."
      fr: "Un flux de travail Express s'exécute au plus cinq minutes, bien moins qu'un processus de 2 heures."
    c:
      en: "Destinations pass results between functions but give no central view of each order's status and history, and can't wait 30 minutes between steps."
      fr: "Les destinations transmettent les résultats entre fonctions mais n'offrent pas de vue centrale de l'état et de l'historique de chaque commande, et ne peuvent pas attendre 30 minutes entre les étapes."
    d:
      en: "Queues decouple the steps but provide no per-order status or history, and the waits and retries would still need custom logic."
      fr: "Des files découplent les étapes mais ne fournissent ni état ni historique par commande, et les attentes et nouvelles tentatives demanderaient toujours une logique spécifique."
references:
  - title: Choosing workflow type in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
  - title: Handling errors in Step Functions workflows
    url: https://docs.aws.amazon.com/step-functions/latest/dg/concepts-error-handling.html
