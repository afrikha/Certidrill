id: dvac03-1d-ds-item-over-400kb
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany stores customer orders in an Amazon DynamoDB table that has the partition key OrderId. A new feature adds the full text of the signed contract, up to 1.5 MB, to each order. The PutItem calls for these orders now fail with a ValidationException.

    The application never filters on the contract text and reads it only when a user opens the order.

    Which solutions will meet these requirements? (Choose two.)

    Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany stocke les commandes de ses clients dans une table Amazon DynamoDB dont la clé de partition est OrderId. Une nouvelle fonctionnalité ajoute à chaque commande le texte intégral du contrat signé, jusqu'à 1,5 Mo. Les appels PutItem de ces commandes échouent désormais avec une ValidationException.

    L'application ne filtre jamais sur le texte du contrat et ne le lit que lorsqu'un utilisateur ouvre la commande.

    Quelles solutions répondent à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store each contract as an object in Amazon S3 and save the object key as an attribute of the order item.", fr: "Stocker chaque contrat sous forme d'objet dans Amazon S3 et enregistrer la clé de l'objet dans un attribut de l'élément de commande." } }
    - { id: b, text: { en: "Request a service quota increase that raises the maximum item size of the table to 2 MB.", fr: "Demander une augmentation de quota de service qui porte la taille maximale d'un élément de la table à 2 Mo." } }
    - { id: c, text: { en: "Create a local secondary index that projects the contract attribute, and read the contract from the index.", fr: "Créer un index secondaire local qui projette l'attribut du contrat, et lire le contrat depuis l'index." } }
    - { id: d, text: { en: "Split each contract into chunks of less than 400 KB and store them in a second table whose composite key is OrderId and ChunkNumber.", fr: "Découper chaque contrat en morceaux de moins de 400 Ko et les stocker dans une deuxième table dont la clé composite est OrderId et ChunkNumber." } }
    - { id: e, text: { en: "Switch the table from provisioned capacity mode to on-demand capacity mode.", fr: "Faire passer la table du mode de capacité provisionnée au mode de capacité à la demande." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A DynamoDB item, attribute names and values included, cannot exceed 400 KB, which causes the ValidationException. Storing the large value in Amazon S3 and keeping only its key in the item is the documented pattern; the application must then handle the two writes, because S3 and DynamoDB share no transaction. Vertical partitioning, which splits the value into smaller items that share a partition key value and are identified by a sort key, also keeps each item under the limit.
    fr: |
      Un élément DynamoDB, noms et valeurs d'attributs compris, ne peut pas dépasser 400 Ko, d'où la ValidationException. Stocker la grande valeur dans Amazon S3 et ne garder que sa clé dans l'élément est le modèle documenté ; l'application doit alors gérer les deux écritures, car S3 et DynamoDB ne partagent aucune transaction. Le partitionnement vertical, qui découpe la valeur en éléments plus petits partageant une valeur de clé de partition et identifiés par une clé de tri, garde aussi chaque élément sous la limite.
  options:
    b: { en: "The 400 KB item size is a fixed constraint of DynamoDB, not an adjustable quota.", fr: "La taille de 400 Ko par élément est une contrainte fixe de DynamoDB, pas un quota ajustable." }
    c: { en: "An index projection copies the attribute; the base table item still contains the contract and remains over the limit. An LSI also cannot be added to an existing table.", fr: "Une projection d'index copie l'attribut ; l'élément de la table de base contient toujours le contrat et dépasse toujours la limite. De plus, un LSI ne peut pas être ajouté à une table existante." }
    e: { en: "The capacity mode changes billing and scaling, not the maximum item size.", fr: "Le mode de capacité change la facturation et la mise à l'échelle, pas la taille maximale d'un élément." }
references:
  - title: Best practices for storing large items and attributes in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-use-s3-too.html
  - title: Constraints in Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Constraints.html
