id: dvac03-1c-err-destination-permission
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer configures an Amazon SNS standard topic as the on-failure destination for the asynchronous invocations of an AWS Lambda function. Failed events do not reach the topic, and the DestinationDeliveryFailures metric of the function increases. The failed events must be delivered to the topic.

    Which solution will meet this requirement?
  fr: |
    Un développeur configure une rubrique standard Amazon SNS comme destination en cas d'échec des appels asynchrones d'une fonction AWS Lambda. Les événements en échec n'atteignent pas la rubrique, et la métrique DestinationDeliveryFailures de la fonction augmente. Les événements en échec doivent être livrés à la rubrique.

    Quelle solution répond à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Allow sns:Publish on the topic in the function's execution role.", fr: "Autoriser sns:Publish sur la rubrique dans le rôle d'exécution de la fonction." } }
    - { id: b, text: { en: "Add a statement to the function's resource-based policy that allows sns.amazonaws.com to invoke the function.", fr: "Ajouter à la politique basée sur les ressources de la fonction une instruction qui autorise sns.amazonaws.com à appeler la fonction." } }
    - { id: c, text: { en: "Replace the standard topic with an SNS FIFO topic.", fr: "Remplacer la rubrique standard par une rubrique SNS FIFO." } }
    - { id: d, text: { en: "Increase MaximumEventAgeInSeconds in the asynchronous invocation configuration.", fr: "Augmenter MaximumEventAgeInSeconds dans la configuration d'appel asynchrone." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Lambda sends destination records with the permissions of the function's execution role. An SNS destination requires sns:Publish, an SQS destination sqs:SendMessage, a Lambda destination lambda:InvokeFunction and an EventBridge destination events:PutEvents."
    fr: "Lambda envoie les enregistrements de destination avec les autorisations du rôle d'exécution de la fonction. Une destination SNS exige sns:Publish, une destination SQS sqs:SendMessage, une destination Lambda lambda:InvokeFunction et une destination EventBridge events:PutEvents."
  options:
    b:
      en: "This statement lets the topic invoke the function, which is the opposite direction of a destination."
      fr: "Cette instruction permet à la rubrique d'appeler la fonction, ce qui est le sens inverse d'une destination."
    c:
      en: "Lambda destinations support only standard SNS topics, not FIFO topics."
      fr: "Les destinations Lambda ne prennent en charge que les rubriques SNS standard, pas les rubriques FIFO."
    d:
      en: "The event age controls how long Lambda keeps events before discarding them; it does not fix delivery to the destination."
      fr: "L'âge de l'événement détermine combien de temps Lambda garde les événements avant de les rejeter ; il ne corrige pas la livraison vers la destination."
references:
  - title: Capturing records of Lambda asynchronous invocations
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-retain-records.html
