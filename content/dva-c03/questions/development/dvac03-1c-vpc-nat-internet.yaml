id: dvac03-1c-vpc-nat-internet
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs an AWS Lambda function that is connected to two private subnets of a VPC so that it can query an Amazon RDS for PostgreSQL database in the same VPC. The VPC also has public subnets with a route to an internet gateway. The function must now also call a public third-party payment API over the internet. After the change, calls to the payment API time out, while the database queries still succeed.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une fonction AWS Lambda connectée à deux sous-réseaux privés d'un VPC afin d'interroger une base de données Amazon RDS for PostgreSQL située dans le même VPC. Le VPC comporte aussi des sous-réseaux publics avec une route vers une passerelle Internet. La fonction doit maintenant appeler aussi une API de paiement publique d'un tiers via Internet. Après la modification, les appels à l'API de paiement expirent, alors que les requêtes vers la base de données réussissent toujours.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Connect the function to the public subnets of the VPC, which already have a 0.0.0.0/0 route to the internet gateway.", fr: "Connecter la fonction aux sous-réseaux publics du VPC, qui ont déjà une route 0.0.0.0/0 vers la passerelle Internet." } }
    - { id: b, text: { en: "Add a 0.0.0.0/0 route to the existing internet gateway in the route table of the private subnets.", fr: "Ajouter une route 0.0.0.0/0 vers la passerelle Internet existante dans la table de routage des sous-réseaux privés." } }
    - { id: c, text: { en: "Create a NAT gateway in a public subnet, and add a 0.0.0.0/0 route to the NAT gateway in the route table of the private subnets.", fr: "Créer une passerelle NAT dans un sous-réseau public, et ajouter une route 0.0.0.0/0 vers la passerelle NAT dans la table de routage des sous-réseaux privés." } }
    - { id: d, text: { en: "Create an interface VPC endpoint for Lambda in the private subnets, and enable private DNS on the endpoint.", fr: "Créer un point de terminaison de VPC de type interface pour Lambda dans les sous-réseaux privés, et activer le DNS privé sur le point de terminaison." } }
answer: { optionId: c }
explanation:
  correct:
    en: "A function connected to a VPC can reach only the resources of that VPC unless the VPC provides internet access. The supported design keeps the function in private subnets, places a NAT gateway with an Elastic IP address in a public subnet, and routes 0.0.0.0/0 from the private subnets to the NAT gateway."
    fr: "Une fonction connectée à un VPC ne peut atteindre que les ressources de ce VPC, sauf si le VPC fournit un accès à Internet. La conception prise en charge garde la fonction dans des sous-réseaux privés, place une passerelle NAT dotée d'une adresse IP Elastic dans un sous-réseau public et achemine 0.0.0.0/0 des sous-réseaux privés vers la passerelle NAT."
  options:
    a:
      en: "Connecting a function to a public subnet gives it neither internet access nor a public IP address."
      fr: "Connecter une fonction à un sous-réseau public ne lui donne ni accès à Internet ni adresse IP publique."
    b:
      en: "The function's network interfaces have only private IP addresses, so a direct route to the internet gateway does not give them internet access."
      fr: "Les interfaces réseau de la fonction n'ont que des adresses IP privées : une route directe vers la passerelle Internet ne leur donne pas accès à Internet."
    d:
      en: "An interface endpoint for Lambda lets resources in the VPC call the Lambda API privately; it gives no access to public internet endpoints."
      fr: "Un point de terminaison de type interface pour Lambda permet aux ressources du VPC d'appeler l'API Lambda en privé ; il ne donne aucun accès aux points de terminaison publics d'Internet."
references:
  - title: Enable internet access for VPC-connected Lambda Event Functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc-internet.html
  - title: Giving Lambda Event Functions access to resources in an Amazon VPC
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html
