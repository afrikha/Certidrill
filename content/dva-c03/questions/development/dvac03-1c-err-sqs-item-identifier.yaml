id: dvac03-1c-err-sqs-item-identifier
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function processes an Amazon SQS standard queue. ReportBatchItemFailures is enabled on the event source mapping, and the handler contains the following code.

    ```python
    def handler(event, context):
        failures = []
        for record in event["Records"]:
            try:
                process(record["body"])
            except Exception:
                failures.append({"itemIdentifier": record["receiptHandle"]})
        return {"batchItemFailures": failures}
    ```

    When one message of a batch fails, all the messages of the batch become visible in the queue again.

    Which change will make only the failed messages return to the queue?
  fr: |
    Une fonction AWS Lambda traite une file d'attente standard Amazon SQS. ReportBatchItemFailures est activé sur le mappage de source d'événements, et le gestionnaire contient le code suivant.

    ```python
    def handler(event, context):
        failures = []
        for record in event["Records"]:
            try:
                process(record["body"])
            except Exception:
                failures.append({"itemIdentifier": record["receiptHandle"]})
        return {"batchItemFailures": failures}
    ```

    Lorsqu'un message d'un lot échoue, tous les messages du lot redeviennent visibles dans la file d'attente.

    Quelle modification fait revenir dans la file d'attente uniquement les messages en échec ?
body:
  options:
    - { id: a, text: { en: "Raise an exception at the end of the handler when the failures list is not empty.", fr: "Lever une exception à la fin du gestionnaire lorsque la liste failures n'est pas vide." } }
    - { id: b, text: { en: "Use record[\"messageId\"] as the itemIdentifier value.", fr: "Utiliser record[\"messageId\"] comme valeur d'itemIdentifier." } }
    - { id: c, text: { en: "Return the list under a key named failedItems instead of batchItemFailures.", fr: "Renvoyer la liste sous une clé nommée failedItems au lieu de batchItemFailures." } }
    - { id: d, text: { en: "Use record[\"md5OfBody\"] as the itemIdentifier value.", fr: "Utiliser record[\"md5OfBody\"] comme valeur d'itemIdentifier." } }
answer: { optionId: b }
explanation:
  correct:
    en: "For SQS partial batch responses, each itemIdentifier must be the messageId of a failed message. Lambda treats an itemIdentifier that does not match a message ID of the batch as a complete failure, so the receipt handle makes the whole batch visible again."
    fr: "Pour les réponses de lot partielles SQS, chaque itemIdentifier doit être le messageId d'un message en échec. Lambda traite un itemIdentifier qui ne correspond à aucun ID de message du lot comme un échec complet : le descripteur de réception (receipt handle) rend donc tout le lot visible de nouveau."
  options:
    a:
      en: "An uncaught exception marks the entire batch as failed, which is the behavior to avoid."
      fr: "Une exception non interceptée marque tout le lot comme en échec, ce qui est le comportement à éviter."
    c:
      en: "Lambda reads only batchItemFailures; without it, the response counts as a complete success and the failed messages are deleted instead of retried."
      fr: "Lambda ne lit que batchItemFailures ; sans elle, la réponse compte comme un succès complet et les messages en échec sont supprimés au lieu d'être relancés."
    d:
      en: "The MD5 digest of the body is not a message ID, so Lambda still treats the response as a complete failure."
      fr: "Le condensé MD5 du corps n'est pas un ID de message : Lambda traite toujours la réponse comme un échec complet."
references:
  - title: Handling errors for an SQS event source in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-errorhandling.html
