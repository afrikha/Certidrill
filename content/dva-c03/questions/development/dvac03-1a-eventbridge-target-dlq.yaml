id: dvac03-1a-eventbridge-target-dlq
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A rule on the default Amazon EventBridge event bus sends order events to an API destination of a partner. When the partner endpoint is unavailable for more than a day, events are dropped after the retries end. The company must keep these events so that it can send them again later.

    Which solution will meet these requirements?
  fr: |
    Une règle du bus d'événements Amazon EventBridge par défaut envoie des événements de commande vers la destination d'API d'un partenaire. Quand le point de terminaison du partenaire est indisponible plus d'une journée, les événements sont abandonnés à la fin des nouvelles tentatives. L'entreprise doit conserver ces événements pour pouvoir les renvoyer plus tard.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Increase the maximum event age in the target's retry policy to 7 days.", fr: "Porter l'âge maximal des événements de la politique de nouvelle tentative de la cible à 7 jours." }
    - id: b
      text: { en: "Configure an Amazon SQS FIFO queue as the dead-letter queue of the target.", fr: "Configurer une file d'attente Amazon SQS FIFO comme file d'attente de lettres mortes de la cible." }
    - id: c
      text: { en: "Configure an Amazon SNS topic as the dead-letter queue of the target.", fr: "Configurer une rubrique Amazon SNS comme file d'attente de lettres mortes de la cible." }
    - id: d
      text: { en: "Configure an Amazon SQS standard queue as the dead-letter queue of the target.", fr: "Configurer une file d'attente Amazon SQS standard comme file d'attente de lettres mortes de la cible." }
answer: { optionId: d }
explanation:
  correct:
    en: "When EventBridge exhausts the retry policy of a target, it drops the event unless the target has a dead-letter queue. The DLQ must be a standard SQS queue in the same Region, with a queue policy that allows events.amazonaws.com to send messages (the console adds it for same-account queues); each message keeps the error details for later reprocessing."
    fr: "Quand EventBridge épuise la politique de nouvelle tentative d'une cible, il abandonne l'événement, sauf si la cible possède une file d'attente de lettres mortes. Cette file doit être une file SQS standard de la même Région, avec une politique de file qui autorise events.amazonaws.com à envoyer des messages (la console l'ajoute pour une file du même compte) ; chaque message conserve les détails de l'erreur pour un retraitement ultérieur."
  options:
    a:
      en: "The retry policy can't keep retrying longer than 24 hours, and events are still dropped once the retries end."
      fr: "La politique de nouvelle tentative ne peut pas réessayer plus de 24 heures, et les événements sont toujours abandonnés à la fin des nouvelles tentatives."
    b:
      en: "EventBridge doesn't accept a FIFO queue as a dead-letter queue."
      fr: "EventBridge n'accepte pas de file FIFO comme file d'attente de lettres mortes."
    c:
      en: "An EventBridge target dead-letter queue must be an SQS standard queue, not an SNS topic."
      fr: "La file d'attente de lettres mortes d'une cible EventBridge doit être une file SQS standard, pas une rubrique SNS."
references:
  - title: Using dead-letter queues to process undelivered events in EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-rule-dlq.html
  - title: How EventBridge retries delivering events
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-rule-retry-policy.html
