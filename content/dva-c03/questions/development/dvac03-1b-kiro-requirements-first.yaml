id: dvac03-1b-kiro-requirements-first
objective: "1.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A team uses Kiro to add a loyalty-points feature to an existing serverless application. The business rules are still being discussed. The product owner must agree on the expected behavior, written as acceptance criteria, before the team accepts any technical design, and the team must then implement the feature through tracked tasks.

    Which Kiro workflow should the team use?
  fr: |
    Une équipe utilise Kiro pour ajouter une fonctionnalité de points de fidélité à une application sans serveur existante. Les règles métier sont encore en discussion. Le responsable produit doit valider le comportement attendu, écrit sous forme de critères d'acceptation, avant que l'équipe n'accepte une conception technique, puis l'équipe doit implémenter la fonctionnalité au moyen de tâches suivies.

    Quel flux de travail Kiro l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "A feature spec with the Quick Spec workflow, which generates the requirements, the design and the tasks in one run.", fr: "Une spec de fonctionnalité avec le flux Quick Spec, qui génère les exigences, la conception et les tâches en une seule exécution." }
    - id: b
      text: { en: "A feature spec with the Design-First workflow, which derives the requirements and the tasks from a technical design.", fr: "Une spec de fonctionnalité avec le flux Design-First, qui déduit les exigences et les tâches d'une conception technique." }
    - id: c
      text: { en: "A feature spec with the Requirements-First workflow, which produces the requirements, then the design, then the tasks.", fr: "Une spec de fonctionnalité avec le flux Requirements-First, qui produit les exigences, puis la conception, puis les tâches." }
    - id: d
      text: { en: "A bugfix spec, which analyzes the current behavior of the application before it designs the change.", fr: "Une spec de correction (bugfix spec), qui analyse le comportement actuel de l'application avant de concevoir la modification." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Requirements-First workflow starts from the desired behavior of the system, captured as requirements with acceptance criteria, and then produces the design and the tasks (Requirements, Design, Tasks). The product owner can agree on the requirements before the design phase, and tasks.md then gives the tracked implementation plan.
    fr: |
      Le flux Requirements-First part du comportement souhaité du système, saisi sous forme d'exigences avec critères d'acceptation, puis produit la conception et les tâches (exigences, conception, tâches). Le responsable produit peut valider les exigences avant la phase de conception, et tasks.md fournit ensuite le plan d'implémentation suivi.
  options:
    a:
      en: "Quick Spec runs all three phases automatically without approval gates between them, so it suits well-understood features, not rules that still need agreement."
      fr: "Quick Spec exécute automatiquement les trois phases sans étape de validation entre elles : il convient aux fonctionnalités bien comprises, pas à des règles encore à valider."
    b:
      en: "Design-First starts with the technical design and derives the requirements from it, the opposite of the order that the product owner needs."
      fr: "Design-First commence par la conception technique et en déduit les exigences, soit l'ordre inverse de celui dont le responsable produit a besoin."
    d:
      en: "Bugfix specs diagnose and fix defects; this is a new feature, not a bug."
      fr: "Les specs de correction diagnostiquent et corrigent des défauts ; il s'agit ici d'une nouvelle fonctionnalité, pas d'un bogue."
references:
  - title: Feature Specs
    url: https://kiro.dev/docs/specs/feature-specs/
